# ===========================================================================
# §1.8 Scaffold Difficulty Design — corporate video / brand film production
#   19 instances across the nine §0.5 Difficulty Rules. Every money and
#   count literal below was computed by executing the matching §1.3 formula
#   with its declared constants; none is an estimate.
# ===========================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: project_ledger_provisional_versus_committed_on_same_rows
        grounds:
          - calculations.project_cost_ledger
          - entities.Project.fields.provisional_cost_cents
          - entities.Project.fields.committed_cost_cents
          - entities.BudgetLine.fields.status
          - entities.TalentEngagement.fields.status
        distinguishing_aspect: |
          One unchanged set of rows is read by two different status filters: the PLANNED budget line
          and the DRAFT talent engagement are inside provisional_cost_cents (3381125) and outside
          committed_cost_cents (0), so the two variants of project_cost_ledger differ by exactly
          3381125 cents on identical data with no mutation between the reads.
        test_recipe:
          setup:
            - "One DRAFT project with a 50000000-cent ceiling, channel_scope of two channels and a 24-month usage term"
            - "One PLANNED budget line whose extended_cents is 2200000 (2 x 1000000 raw plus 10% markup)"
            - "One DRAFT non-union talent engagement priced on the PROVISIONAL basis at 1181125 cents"
            - "No budget approval has happened, so nothing has committed and approved_budget_cents is null"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Northwind Bank", campaign_title: "Trust Anthem 2027", creative_brief_summary: "Sixty-second brand film with OLV and social cutdowns.", channel_scope: ["OLV", "SOCIAL"], usage_term_months: 24, budget_ceiling_cents: 50000000, contracted_revision_rounds: 2 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST", description: "Offline and online edit", quantity: 2, unit_rate_cents: 1000000, markup_pct: 0.1 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { line_post: $.data.id }
            - call: "POST /talent-engagements"
              payload: { project_id: "${proj}", talent_name: "Dana Reyes", union_affiliation: "NON_UNION", compensation_model: "USAGE_BUYOUT", session_fee_cents: 250000, session_days: 2 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { eng_buyout: $.data.id }
          trigger:
            - call: "GET /projects/${proj}"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
          assert:
            - "BudgetLine.${line_post}.extended_cents == 2200000 and BudgetLine.${line_post}.status == PLANNED"
            - "TalentEngagement.${eng_buyout}.total_comp_cents == 1181125 and status == DRAFT and comp_basis == PROVISIONAL"
            - "Project.${proj}.provisional_cost_cents == 3381125"
            - "Project.${proj}.committed_cost_cents == 0"
            - "Project.${proj}.provisional_cost_cents - Project.${proj}.committed_cost_cents == 3381125"
            - "Project.${proj}.budget_variance_cents == 0 because approved_budget_cents is still null"

      - name: talent_comp_buyout_versus_union_on_identical_session_inputs
        grounds:
          - calculations.talent_compensation
          - entities.TalentEngagement.fields.compensation_model
          - entities.TalentEngagement.fields.reuse_cycles
          - entities.TalentEngagement.fields.usage_load_cents
          - validations[priority=43]
        distinguishing_aspect: |
          Two engagements with byte-identical session inputs (250000 cents x 2 days on a two-channel,
          24-month project) price at 1181125 under USAGE_BUYOUT and 2238188 under UNION_SESSION_REUSE,
          a 1057063-cent divergence produced by different component sets — usage_load 573750 and no
          pension/health on the buyout, versus 8 reuse cycles, reuse_fee 1225000 and pension_health
          340688 on the union deal.
        test_recipe:
          setup:
            - "One DRAFT project with channel_scope of exactly two channels and usage_term_months 24"
            - "One NON_UNION engagement on USAGE_BUYOUT with session_fee_cents 250000 and session_days 2"
            - "One UNION engagement on UNION_SESSION_REUSE with the identical session fee and day count"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Northwind Bank", campaign_title: "Trust Anthem 2027", creative_brief_summary: "Sixty-second brand film with OLV and social cutdowns.", channel_scope: ["OLV", "SOCIAL"], usage_term_months: 24, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /talent-engagements"
              payload: { project_id: "${proj}", talent_name: "Dana Reyes", union_affiliation: "NON_UNION", compensation_model: "USAGE_BUYOUT", session_fee_cents: 250000, session_days: 2 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { eng_buyout: $.data.id }
          trigger:
            - call: "POST /talent-engagements"
              payload: { project_id: "${proj}", talent_name: "Marc Ilesanmi", union_affiliation: "UNION", compensation_model: "UNION_SESSION_REUSE", session_fee_cents: 250000, session_days: 2 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { eng_union: $.data.id }
          assert:
            - "TalentEngagement.${eng_buyout}.base_fee_cents == 500000 and usage_load_cents == 573750 and agent_fee_cents == 107375"
            - "TalentEngagement.${eng_buyout}.reuse_cycles == 0 and reuse_fee_cents == 0 and pension_health_cents == 0"
            - "TalentEngagement.${eng_buyout}.total_comp_cents == 1181125"
            - "TalentEngagement.${eng_union}.base_fee_cents == 500000 and usage_load_cents == 0"
            - "TalentEngagement.${eng_union}.reuse_cycles == 8 and reuse_fee_cents == 1225000"
            - "TalentEngagement.${eng_union}.pension_health_cents == 340688 and agent_fee_cents == 172500"
            - "TalentEngagement.${eng_union}.total_comp_cents == 2238188"
            - "TalentEngagement.${eng_union}.total_comp_cents - TalentEngagement.${eng_buyout}.total_comp_cents == 1057063"
            - "Project.${proj}.provisional_cost_cents == 3419313"

  - rule_id: combinatorial_formula
    instances:
      - name: crew_overtime_nested_min_max_across_three_tiers
        grounds:
          - calculations.crew_booking_cost
          - entities.CrewBooking.fields.overtime_tier1_cents
          - entities.CrewBooking.fields.overtime_tier2_cents
          - entities.CrewMember.fields.hourly_rate_cents
        distinguishing_aspect: |
          A single 13.5-hour booking at 5000 cents/hour splits across all three nested min/max tiers
          at once — straight_time 50000 (min(13.5,10)), overtime_tier1 15000 (min(max(3.5,0),2) x 1.5)
          and overtime_tier2 15000 (max(1.5,0) x 2.0) — so cost_cents is 80000 and any implementation
          that drops the inner min on tier 1 lands on 26250 for that tier instead of 15000.
        test_recipe:
          setup:
            - "A SCOPED project (one deliverable, one 100000-cent budget line, scope locked) with a 50000000-cent ceiling"
            - "A location with 2 stages and one PLANNED shoot day running 2026-09-10T06:00Z to 2026-09-10T19:30Z"
            - "A camera crew member at 5000 cents/hour with the default 10-hour turnaround"
            - "The logical clock still sits at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Meridian Foods", campaign_title: "Harvest Table", creative_brief_summary: "Broadcast brand film shot over one stage day.", channel_scope: ["BROADCAST"], usage_term_months: 12, budget_ceiling_cents: 50000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Hero 60", channel: "BROADCAST", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "CLOSED_SRT", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { dlv: $.data.id }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "CREW", description: "Camera department day rate pool", quantity: 1, unit_rate_cents: 100000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /locations"
              payload: { name: "Pier 9 Stage", address: "9 Harbor Way, Oakland", stage_count: 2, daily_fee_cents: 400000, insurance_minimum_cents: 100000000, permit_authority: "City Film Office" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { loc: $.data.id }
            - call: "POST /shoot-days"
              payload: { project_id: "${proj}", location_id: "${loc}", shoot_date: "2026-09-10", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T19:30:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { day1: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Ivo Marek", department: "CAMERA", hourly_rate_cents: 5000, min_turnaround_hours: 10 }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { crew_ac: $.data.id }
          trigger:
            - call: "POST /crew-bookings"
              payload: { shoot_day_id: "${day1}", crew_member_id: "${crew_ac}", department_role: "1st AC", call_time: "2026-09-10T06:00:00Z", wrap_time: "2026-09-10T19:30:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { bk_ac: $.data.id }
          assert:
            - "CrewBooking.${bk_ac}.scheduled_hours == 13.5"
            - "CrewBooking.${bk_ac}.straight_time_cents == 50000"
            - "CrewBooking.${bk_ac}.overtime_tier1_cents == 15000"
            - "CrewBooking.${bk_ac}.overtime_tier2_cents == 15000"
            - "CrewBooking.${bk_ac}.cost_cents == 80000 and CrewBooking.${bk_ac}.status == HELD"
            - "Project.${proj}.provisional_cost_cents == 180000 and Project.${proj}.committed_cost_cents == 0"

      - name: budget_markup_rounds_per_line_before_summing
        grounds:
          - calculations.budget_line_extended_cents
          - calculations.project_cost_ledger
          - entities.BudgetLine.fields.markup_pct
          - entities.BudgetLine.fields.extended_cents
        distinguishing_aspect: |
          Three identical lines of raw 22220 cents at a 7.5% markup each round to 1667 markup cents
          (from 1666.5, half-up), so the project rolls up to 71661; rounding the 66660-cent raw total
          once instead yields 71660, and the one-cent gap is the pinned per-line-then-sum order.
        test_recipe:
          setup:
            - "One DRAFT project with a 10000000-cent ceiling"
            - "Two identical POST-category budget lines of quantity 2 at 11110 cents with markup_pct 0.075"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Halden Pharma", campaign_title: "Clinic Voices", creative_brief_summary: "Internal brand film series with matching social cutdowns.", channel_scope: ["INTERNAL"], usage_term_months: 12, budget_ceiling_cents: 10000000 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST", description: "Colour grade suite hours", quantity: 2, unit_rate_cents: 11110, markup_pct: 0.075 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { line_a: $.data.id }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST", description: "Sound mix suite hours", quantity: 2, unit_rate_cents: 11110, markup_pct: 0.075 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { line_b: $.data.id }
          trigger:
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST", description: "Conform and deliverables hours", quantity: 2, unit_rate_cents: 11110, markup_pct: 0.075 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { line_c: $.data.id }
            - call: "GET /projects/${proj}"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
          assert:
            - "BudgetLine.${line_a}.extended_cents == 23887"
            - "BudgetLine.${line_b}.extended_cents == 23887"
            - "BudgetLine.${line_c}.extended_cents == 23887"
            - "Project.${proj}.provisional_cost_cents == 71661"
            - "Project.${proj}.provisional_cost_cents != 71660 (the sum-then-round answer)"

      - name: change_order_producer_fee_tier_keyed_on_subtotal_not_amount
        grounds:
          - calculations.change_order_amount
          - entities.ChangeOrder.fields.subtotal_cents
          - entities.ChangeOrder.fields.producer_fee_pct
          - state_machines.DeliverableVersion.SUBMITTED_to_CHANGES_REQUESTED
        distinguishing_aspect: |
          The extra-round change order has labor 480000, rush_pct 0.00 (the air date is 122 days out)
          and subtotal 480000, which sits below the 500000 band, so producer_fee_pct is 0.18, fee is
          86400 and amount_cents is 566400; keying the tier on the 566400 total instead would pick
          0.15 and land on 552000, a 14400-cent divergence from the same inputs.
        test_recipe:
          setup:
            - "An IN_PRODUCTION project with contracted_revision_rounds 1 and an approved 2000000-cent budget"
            - "One deliverable airing 2026-12-01, with one cut that has passed QC and been submitted for review"
            - "The logical clock still sits at its 2026-08-01T00:00:00Z startup default"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Aster Mobility", campaign_title: "City Loop", creative_brief_summary: "Single OLV brand film with one contracted revision round.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000, contracted_revision_rounds: 1 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "City Loop 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { dlv: $.data.id }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST", description: "Post production package", quantity: 2, unit_rate_cents: 1000000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 2000000 }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "GET /deliverables/${dlv}"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { dlv_v1: $.data.version }
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v1}", cut_label: "v1 rough", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 12.5 }
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { ver1: $.data.id }
            - call: "POST /deliverable-versions/${ver1}/qc"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "POST /deliverable-versions/${ver1}/submit"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
          trigger:
            - call: "POST /deliverable-versions/${ver1}/review-decision"
              payload: { decision: "REQUEST_CHANGES", review_note: "Tighten the open and lose the third beat." }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "GET /deliverables/${dlv}/change-orders"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
              captures: { co1: "$.data[0].id" }
          assert:
            - "ChangeOrder.${co1}.trigger_reason == REVISION_ROUND_EXCEEDED and additional_rounds_granted == 1"
            - "ChangeOrder.${co1}.labor_cents == 480000"
            - "ChangeOrder.${co1}.rush_pct == 0.00 and ChangeOrder.${co1}.rush_cents == 0"
            - "ChangeOrder.${co1}.subtotal_cents == 480000"
            - "ChangeOrder.${co1}.producer_fee_pct == 0.18 and producer_fee_cents == 86400"
            - "ChangeOrder.${co1}.amount_cents == 566400 and status == PENDING_APPROVAL"
            - "ChangeOrder.${co1}.amount_cents != 552000 (the amount-keyed tier answer)"

  - rule_id: non_linear_state_machine
    instances:
      - name: deliverable_review_cycle_reenters_in_review_on_a_later_cut
        grounds:
          - state_machines.Deliverable.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.Deliverable.CHANGES_REQUESTED_to_IN_REVIEW
          - state_machines.DeliverableVersion.CHANGES_REQUESTED_to_SUPERSEDED
          - entities.Deliverable.fields.consumed_review_rounds
          - entities.DeliverableVersion.fields.round_index
        distinguishing_aspect: |
          The Deliverable state graph is cyclic: it leaves IN_REVIEW for CHANGES_REQUESTED and returns
          to IN_REVIEW on the next cut, and the lap counter (consumed_review_rounds 1 of an entitlement
          of 2) is what bounds the loop rather than any terminal state — the second visit to IN_REVIEW
          is a different lap, with round_index 2 and the first cut retired to SUPERSEDED.
        test_recipe:
          setup:
            - "An IN_PRODUCTION project with contracted_revision_rounds 2 and an approved 2000000-cent budget"
            - "One deliverable whose first cut passed QC, was submitted, and drew a REQUEST_CHANGES decision"
            - "consumed_review_rounds is 1 against an entitlement of 2, so no change order was raised and review_gate is OPEN"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Lumen Energy", campaign_title: "Grid Stories", creative_brief_summary: "OLV brand film with two contracted revision rounds.", channel_scope: ["OLV"], usage_term_months: 12, budget_ceiling_cents: 50000000, contracted_revision_rounds: 2 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Grid Stories 60", channel: "OLV", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "NONE", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { dlv: $.data.id }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST", description: "Post production package", quantity: 2, unit_rate_cents: 1000000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 2000000 }
              as: ClientApprover
              as_user_id: "client-1"
            - call: "GET /deliverables/${dlv}"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { dlv_v1: $.data.version }
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v1}", cut_label: "v1 rough", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 11.0 }
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { ver1: $.data.id }
            - call: "POST /deliverable-versions/${ver1}/qc"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "POST /deliverable-versions/${ver1}/submit"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "POST /deliverable-versions/${ver1}/review-decision"
              payload: { decision: "REQUEST_CHANGES", review_note: "Recut the middle act." }
              as: ClientApprover
              as_user_id: "client-1"
          trigger:
            - call: "GET /deliverables/${dlv}"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { dlv_v2: $.data.version }
            - call: "POST /deliverable-versions"
              payload: { deliverable_id: "${dlv}", expected_deliverable_version: "${dlv_v2}", cut_label: "v2 recut", aspect_ratio: "16:9", duration_seconds: 60, has_captions: false, caption_format: "NONE", file_size_gb: 11.4, supersedes_version_id: "${ver1}" }
              as: PostSupervisor
              as_user_id: "post-1"
              captures: { ver2: $.data.id }
            - call: "POST /deliverable-versions/${ver2}/qc"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
            - call: "POST /deliverable-versions/${ver2}/submit"
              payload: {}
              as: PostSupervisor
              as_user_id: "post-1"
          assert:
            - "Deliverable.${dlv}.status == IN_REVIEW for the second time"
            - "Deliverable.${dlv}.consumed_review_rounds == 1 and round_entitlement == 2"
            - "Deliverable.${dlv}.version_count == 2"
            - "DeliverableVersion.${ver1}.review_status == SUPERSEDED"
            - "DeliverableVersion.${ver2}.review_status == SUBMITTED and round_index == 2"
            - "Project.${proj}.review_gate == OPEN and round_entitlement_balance == 1"
            - "GET /deliverables/${dlv}/change-orders returns total_count == 0"

      - name: version_review_and_technical_axes_advance_independently
        grounds:
          - state_machines.DeliverableVersion.PENDING_QC_to_QC_FAILED
          - entities.DeliverableVersion.fields.review_status
          - entities.DeliverableVersion.fields.technical_status
          - calculations.version_qc_evaluation
          - validations[priority=21]
        distinguishing_aspect: |
          One DeliverableVersion row carries two orthogonal state fields: recording a failed QC moves
          technical_status PENDING_QC -> QC_FAILED while review_status stays exactly DRAFT, and the
          cross-axis guard then refuses the submit with ERR_VERSION_QC_NOT_PASSED — so this is a
          parallel two-dimension machine, not the single cyclic Deliverable loop.
        test_recipe:
          setup:
            - "An IN_PRODUCTION project with an approved 2000000-cent budget"
            - "One deliverable specified as 16:9, 60 seconds, CLOSED_SRT captions"
            - "One uploaded cut delivered as 9:16 with correct duration and correct caption format"
          setup_api_calls:
            - call: "POST /projects"
              payload: { client_name: "Kestrel Bank", campaign_title: "Open Doors", creative_brief_summary: "Social-first brand film with a broadcast-ratio hero cut.", channel_scope: ["SOCIAL"], usage_term_months: 12, budget_ceiling_cents: 50000000, contracted_revision_rounds: 2 }
              as: LineProducer
              as_user_id: "producer-1"
              captures: { proj: $.data.id }
            - call: "POST /deliverables"
              payload: { project_id: "${proj}", title: "Open Doors Hero", channel: "SOCIAL", aspect_ratio: "16:9", target_duration_seconds: 60, caption_requirement: "CLOSED_SRT", usage_rights_months: 12, air_date: "2026-12-01T00:00:00Z" }
              as: ProductionCoordinator
              as_user_id: "coord-1"
              captures: { dlv: $.data.id }
            - call: "POST /budget-lines"
              payload: { project_id: "${proj}", category: "POST", description: "Post production package", quantity: 2, unit_rate_cents: 1000000, markup_pct: 0 }
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/lock-scope"
              payload: {}
              as: LineProducer
              as_user_id: "producer-1"
            - call: "POST /projects/${proj}/approve-budget"
              payload: { approved_budget_cents: 2000000 }
              as: ClientApprover
              as_user_id: "client-1"
