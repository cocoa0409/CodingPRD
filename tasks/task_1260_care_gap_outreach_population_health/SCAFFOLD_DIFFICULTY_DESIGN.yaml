  # -------------------------------------------------------------------------
  # Rule 4 — transitive_cascade
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: evidence_approve_to_incentive_payout_chain
        grounds:
          - state_machines.GapClosureEvidence.SUBMITTED_to_APPROVED
          - state_machines.CareGap.PENDING_EVIDENCE_to_CLOSED
          - calculations.panel_manager_incentive_payout
          - calculations.measure_performance_numerator_denominator
        distinguishing_aspect: |
          Depth >= 3 chain: POST /gap-closure-evidence/{id}/approve mutates
          GapClosureEvidence (link 1) -> CareGap transitions to CLOSED
          (link 2) -> PanelManagerWorkload.closed_gap_count_period mutates
          (link 3) -> IncentivePayout PROJECTED row recomputes (link 4).
          Each link caused by the previous one, not by the original action.
        test_recipe:
          setup:
            - "Registry, measure, cohort, panel, member; CareGap g1 exists"
            - "Workload row for pm_1 with PROJECTED payout pre-computed (closed_gap_count_period = 0)"
            - "PROVISIONAL report for period 2026-06 exists"
            - "Evidence ev1 submitted against g1"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RC1", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/panel-manager-workloads"
              payload: { panel_manager_id: "pm_1", period_key: "2026-06" }
              as: ProgramAdministrator
              captures: { wl_id: $.data.id }
            - call: "POST /population-health/panel-manager-workloads/${wl_id}/incentive-payouts/projection"
              payload: {}
              as: ProgramAdministrator
              captures: { payout_id: $.data.id, payout_v0_total: $.data.total_payout_cents }
            - call: "POST /population-health/measure-definitions/${meas_id}/measure-performance-reports"
              payload: { period_key: "2026-06" }
              as: ProgramAdministrator
              captures: { rep_id: $.data.id, rep_v0_num: $.data.numerator_count }
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id }
            - call: "POST /population-health/care-gaps/${gap_id}/gap-closure-evidence"
              payload: { evidence_type: "CHART_REVIEW", service_date: "2026-04-15T00:00:00Z", document_uri: "s3://e.pdf" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /population-health/gap-closure-evidence/${ev_id}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_1"
          assert:
            - "CareGap.${gap_id}.status == CLOSED"
            - "PanelManagerWorkload.${wl_id}.closed_gap_count_period == 1"
            - "IncentivePayout.${payout_id}.total_payout_cents > ${payout_v0_total}"
            - "MeasurePerformanceReport.${rep_id}.numerator_count == ${rep_v0_num} + 1"

      - name: no_show_cascade_cancels_transport
        grounds:
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - state_machines.CareGap.AWAITING_APPOINTMENT_to_OUTREACH_IN_PROGRESS
          - state_machines.TransportationAssist.REQUESTED_to_CANCELLED
          - calculations.priority_score
        distinguishing_aspect: |
          Depth >= 2 chain from a DIFFERENT trigger than the evidence cascade:
          POST /appointments/{id}/mark-no-show mutates Appointment (link 1)
          -> linked TransportationAssist transitions to CANCELLED (link 2)
          -> CareGap reverts to OUTREACH_IN_PROGRESS AND a synthetic
          OutreachAttempt row is appended (link 3), which itself triggers a
          priority_score recompute via NO_SHOW_STRIKE_BONUS.
        test_recipe:
          setup:
            - "Registry, measure, cohort, panel, member; CareGap in AWAITING_APPOINTMENT"
            - "Appointment SCHEDULED with slot_end_at in the past"
            - "TransportationAssist ARRANGED linked to that appointment"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RC2", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id, gap_score_pre: $.data.0.priority_score }
            - call: "POST /population-health/care-gaps/${gap_id}/appointments"
              payload: { provider_id: "prov_A", slot_start_at: "2026-05-05T14:00:00Z", slot_end_at: "2026-05-05T15:00:00Z" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { appt_id: $.data.id }
            - call: "POST /population-health/appointments/${appt_id}/transportation-assists"
              payload: { vendor: "RideCo", pickup_at: "2026-05-05T13:00:00Z", cost_cents: 2500 }
              as: TransportationCoordinator
              captures: { ta_id: $.data.id }
            - call: "POST /population-health/transportation-assists/${ta_id}/arrange"
              payload: {}
              as: TransportationCoordinator
            # advance clock past slot_end_at
            - call: "POST /population-health/_clock/set_current_utc"
              payload: { registry_id: "${reg_id}", to_iso8601: "2026-05-06T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /population-health/appointments/${appt_id}/mark-no-show"
              payload: {}
              as: PanelManager
              as_user_id: "pm_1"
          assert:
            - "Appointment.${appt_id}.status == NO_SHOW"
            - "TransportationAssist.${ta_id}.status == CANCELLED"
            - "CareGap.${gap_id}.status == OUTREACH_IN_PROGRESS"
            - "CareGap.${gap_id}.priority_score == ${gap_score_pre} + 8  # NO_SHOW_STRIKE_BONUS"
            - "CareGap.${gap_id}.attempt_count == 1  # synthetic no-show attempt appended"

  # -------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: attempt_state_vs_business_temporal
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ATTEMPT_TOO_EARLY]
        distinguishing_aspect: |
          Pair (state, business_temporal): an attempt on an already-CLOSED
          CareGap BEFORE next_eligible_attempt_at violates both priority 4
          (state) and priority 6 (business_temporal). Priority 4 wins.
        test_recipe:
          setup:
            - "Registry, measure, cohort, panel, member, CALL campaign ACTIVE; CareGap CLOSED via evidence approve; clock BEFORE next_eligible_attempt_at"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RP1", program_year: 2026 }
