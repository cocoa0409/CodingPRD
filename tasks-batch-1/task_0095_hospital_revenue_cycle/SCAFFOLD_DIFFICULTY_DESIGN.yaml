            - "response error_id == ERR_CODING_NOT_CLEARED"
            - "HTTP status == 409"

      - name: eligibility_requires_policy_active
        grounds:
          - state_machines.Encounter.REGISTERED_to_ELIGIBILITY_VERIFIED
          - state_machines.InsurancePolicy.UNVERIFIED_to_ACTIVE
          - errors[ERR_POLICY_NOT_ACTIVE]
        distinguishing_aspect: |
          A DIFFERENT entity pair (Encounter depends on InsurancePolicy): verifying
          eligibility for an encounter whose InsurancePolicy is still UNVERIFIED (never
          verified to ACTIVE) is rejected with ERR_POLICY_NOT_ACTIVE and the encounter stays REGISTERED.
        test_recipe:
          setup:
            - "REGISTERED encounter whose policy_id points to an UNVERIFIED InsurancePolicy (verify never called)."
          setup_api_calls:
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-013", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-03-01T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
          trigger:
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_POLICY_NOT_ACTIVE"
            - "HTTP status == 409"
            - "Encounter.${encounter_id}.status == REGISTERED"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: timely_filing_window_closed_at_boundary
        grounds:
          - validations[priority=10]
          - errors[ERR_TIMELY_FILING_EXCEEDED]
          - entities.Payer.fields.timely_filing_days
          - state_machines.Encounter.CODED_to_BILLED
        distinguishing_aspect: |
          Half-open filing window on the Payer resource measured forward from the encounter
          discharge: a claim submitted strictly more than timely_filing_days (90) after
          discharge_at falls outside [discharge, discharge+90d] and is rejected — interval
          semantics are a forward duration from a single anchor (discharge).
        test_recipe:
          setup:
            - "Coded encounter discharged at 2026-03-01; payer timely_filing_days=90; clock advanced to 2026-06-15 (>90 days after discharge) before claim submission."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Registrar
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 30, active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
              as: Registrar
              captures: { patient_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${patient_id}", payer_id: "${payer_id}", member_number: "M-014", plan_year: 2026, deductible_cents: 100000, coinsurance_pct: 0.20, oop_max_cents: 500000 }
              as: Registrar
              captures: { policy_id: $.data.id }
            - call: "POST /insurance-policies/${policy_id}/verify"
              payload: {}
              as: Registrar
            - call: "POST /encounters"
              payload: { patient_id: "${patient_id}", policy_id: "${policy_id}", admission_at: "2026-02-28T09:00:00Z" }
              as: Registrar
              captures: { encounter_id: $.data.id }
            - call: "POST /encounters/${encounter_id}/charges"
              payload: { cpt_code: "99285", units: 1, unit_price_cents: 300000 }
              as: Registrar
            - call: "POST /encounters/${encounter_id}/eligibility-checks"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/discharge"
              payload: {}
              as: Registrar
            - call: "POST /encounters/${encounter_id}/coding-assignment"
              payload: { principal_icd10: "E11.65", secondary_icd10: ["I10"] }
              as: Coder
              captures: { coding_id: $.data.id }
            - call: "POST /coding-assignments/${coding_id}/finalize"
              payload: {}
              as: Coder
            - call: "POST /coding-assignments/${coding_id}/clear"
              payload: {}
              as: BillingSpecialist
            - call: "GET /encounters/${encounter_id}"
              payload: {}
              as: BillingSpecialist
              captures: { enc_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: BillingSpecialist
          trigger:
            - call: "POST /encounters/${encounter_id}/claims"
              payload: { payer_id: "${payer_id}", expected_encounter_version: "${enc_v}" }
              as: BillingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_TIMELY_FILING_EXCEEDED"
            - "HTTP status == 409"

      - name: bad_debt_aging_window_not_met
        grounds:
          - validations[priority=12]
          - errors[ERR_AGING_NOT_MET]
          - entities.PatientStatement.fields.issued_at
          - state_machines.PatientStatement.ISSUED_to_IN_COLLECTIONS
        distinguishing_aspect: |
          A DIFFERENT interval semantics on a DIFFERENT resource (PatientStatement): the
          aging gate requires AT LEAST BAD_DEBT_AGING_DAYS to have elapsed since issued_at
          (a minimum-elapsed lower-bound interval, the opposite geometry of timely filing's
          upper bound); sending to collections before the minimum elapses is rejected.
        test_recipe:
          setup:
            - "PatientStatement ISSUED (from a denied claim) at 2026-03-10; clock advanced only to 2026-03-20, fewer than BAD_DEBT_AGING_DAYS since issue."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T00:00:00Z" }
              as: Registrar
            - call: "POST /payers"
              payload: { name: "Acme Health", payer_type: "COMMERCIAL", timely_filing_days: 90, appeal_window_days: 30, active: true }
              as: Registrar
              captures: { payer_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Dana Reyes", date_of_birth: "1980-04-01" }
