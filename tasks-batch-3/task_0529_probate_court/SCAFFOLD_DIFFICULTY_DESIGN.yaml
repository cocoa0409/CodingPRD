          - calculations.marshaled_cash
          - calculations.distributable_residue
          - entities.Estate.fields.residue_cents
        distinguishing_aspect: |
          Depth-3 cascade: asset.liquidate mutates Asset->LIQUIDATED, which
          causes Estate.marshaled_cash_cents += 700000, which in turn causes
          Estate.residue_cents to be recomputed to 700000. Each hop is caused
          by the prior hop; trigger is asset.liquidate.
        test_recipe:
          setup:
