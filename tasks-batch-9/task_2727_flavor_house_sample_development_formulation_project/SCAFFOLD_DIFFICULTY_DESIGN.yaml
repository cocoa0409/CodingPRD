  - rule_id: transitive_cascade
    instances:
      - name: kosher_certificate_revocation_four_link_compliance_cascade
        grounds:
          - state_machines.SubstantiationRecord.VERIFIED_to_REVOKED
          - entities.RawMaterial.fields.claim_status
          - state_machines.Formula.APPROVED_to_REWORK_REQUIRED
          - state_machines.SampleLot.RELEASED_to_HELD
          - state_machines.SampleShipment.PACKET_ASSEMBLED_to_BLOCKED
          - state_machines.RegulatoryDocument.PINNED_to_STALE
          - calculations.formula_claim_profile
          - calculations.regulatory_packet
        distinguishing_aspect: |
          DEPTH 4, triggered by a compliance event on SubstantiationRecord. Each
          link is caused strictly by the previous one: revoking the KOSHER
          certificate restricts the RawMaterial (link 1); because the material is a
          leaf of F2 and the brief requires the kosher claim, the RESTRICTED
          material drives F2 APPROVED -> REWORK_REQUIRED (link 2); because F2 left
          APPROVED, its released lot goes RELEASED -> HELD (link 3); because the lot
          is held, the shipment carrying it goes PACKET_ASSEMBLED -> BLOCKED with
          block_reason LOT_HELD (link 4). Cutting the chain at any depth leaves a
          different observable state, and the ALLERGEN_STATEMENT document must stay
          PINNED while only the KOSHER_CERT document goes STALE.
        test_recipe:
          setup:
            - "One raw material GUM-BASE at 2000 cents per kg with two VERIFIED certificates: ALLERGEN_FREE_STATEMENT valid to 2027-06-30 and KOSHER valid to 2027-12-31."
            - "Brief BRF-0002 (DAIRY_YOGURT, dosage_pct 1.0, annual_volume_kg 500, cap 100000, kosher_required true) in ACCEPTED."
            - "Formula F2 = 100.0000% GUM-BASE, costed to 2000 cents per kg (bench cost-in-use 20000, under the cap), APPROVED."
            - "Lot of 500 g, QC PASSED and RELEASED; shipment of 150 g to the US in PACKET_ASSEMBLED with documents SDS, ALLERGEN_STATEMENT and KOSHER_CERT."
            - "The logical clock stays at 2026-08-01T00:00:00Z, so both certificates are still inside their validity window."
          setup_api_calls:
            - call: "POST /raw-materials"
              payload: { material_code: "GUM-BASE", name: "Gum Arabic Base", cost_per_kg_cents: 2000, natural_status: "NATURE_IDENTICAL", potency_class: "STANDARD", max_use_ppm: 1000000 }
              as: PurchasingManager
              captures: { m5: $.data.id }
            - call: "POST /substantiation-records"
              payload: { raw_material_id: "${m5}", claim_type: "ALLERGEN_FREE_STATEMENT", issuing_body: "Nordic Lab Services", document_ref: "AF-2026-118", valid_until: "2027-06-30T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { sr_allergen: $.data.id, allergen_valid_until: $.data.valid_until }
            - call: "POST /substantiation-records/${sr_allergen}/verify"
              payload: {}
              as: RegulatoryAffairs
            - call: "POST /substantiation-records"
              payload: { raw_material_id: "${m5}", claim_type: "KOSHER", issuing_body: "Baltic Kosher Council", document_ref: "KOS-2026-441", valid_until: "2027-12-31T00:00:00Z" }
              as: RegulatoryAffairs
              captures: { sr_kosher: $.data.id }
            - call: "POST /substantiation-records/${sr_kosher}/verify"
              payload: {}
              as: RegulatoryAffairs
            - call: "POST /customer-briefs"
              payload: { brief_code: "BRF-0002", customer_name: "Baltic Dairy", matrix_type: "DAIRY_YOGURT", target_profile: "VANILLA_CREAM", dosage_pct: 1.0, annual_volume_kg: 500, cost_in_use_cap_cents_per_tonne: 100000, confidentiality_tier: "TIER_1_STANDARD", kosher_required: true }
              as: AccountManager
              captures: { b2: $.data.id }
            - call: "POST /customer-briefs/${b2}/submit"
              payload: {}
              as: AccountManager
            - call: "POST /customer-briefs/${b2}/decision"
              payload: { decision: "ACCEPTED" }
              as: TechnicalDirector
            - call: "POST /formulas"
              payload: { brief_id: "${b2}", name: "Vanilla Cream F2" }
              as: Flavorist
              captures: { f2: $.data.id }
            - call: "POST /formulas/${f2}/components"
              payload: { component_type: "RAW_MATERIAL", raw_material_id: "${m5}", weight_pct: 100.0 }
              as: Flavorist
            - call: "POST /formulas/${f2}/cost"
              payload: {}
              as: Flavorist
              captures: { f2_kosher_ok: $.data.kosher_eligible, f2_ciu: $.data.bench_cost_in_use_cents_per_tonne }
            - call: "POST /formulas/${f2}/submit"
              payload: {}
              as: Flavorist
              as_user_id: "u_flav_1"
            - call: "POST /formulas/${f2}/decision"
              payload: { decision: "APPROVED" }
              as: TechnicalDirector
              as_user_id: "u_dir_1"
            - call: "POST /sample-lots"
              payload: { formula_id: "${f2}", batch_size_g: 500 }
              as: LabTech
              as_user_id: "u_lab_1"
              captures: { lot: $.data.id }
            - call: "POST /sample-lots/${lot}/qc"
              payload: { result: "PASSED" }
              as: LabTech
              as_user_id: "u_lab_2"
            - call: "POST /sample-lots/${lot}/release"
              payload: {}
              as: LabTech
              as_user_id: "u_lab_1"
            - call: "POST /shipments"
              payload: { sample_lot_id: "${lot}", destination_country: "US", shipped_g: 150, carrier: "AirEx" }
              as: AccountManager
              captures: { sh: $.data.id }
            - call: "POST /shipments/${sh}/assemble-packet"
              payload: {}
              as: RegulatoryAffairs
              captures: { packet_until: $.data.packet_valid_until, doc_types: $.data.required_document_types }
            - call: "GET /regulatory-documents"
              payload: { shipment_id: "${sh}" }
              as: RegulatoryAffairs
              captures: { doc_sds: "$.data[0].id", doc_allergen: "$.data[1].id", doc_kosher: "$.data[2].id", kosher_doc_status: "$.data[2].status" }
          trigger:
            - call: "POST /substantiation-records/${sr_kosher}/revoke"
              payload: { revocation_reason: "Certifying council suspended the plant audit" }
              as: RegulatoryAffairs
          assert:
            - "${f2_kosher_ok} == true and ${f2_ciu} == 20000 before the trigger"
            - "${packet_until} == ${allergen_valid_until} (2027-06-30), the earlier of the two pinned certificates, and ${kosher_doc_status} == PINNED"
            - "SubstantiationRecord.${sr_kosher}.status == REVOKED with revocation_reason set"
            - "LINK 1: RawMaterial.${m5}.claim_status == RESTRICTED and its verified_claim_types no longer contains KOSHER"
            - "LINK 2: Formula.${f2}.status == REWORK_REQUIRED with rework_reason == SUBSTANTIATION_REVOKED and kosher_eligible == false"
            - "LINK 3: SampleLot.${lot}.disposition_status == HELD while qc_status stays PASSED"
            - "LINK 4: SampleShipment.${sh}.status == BLOCKED with block_reason == LOT_HELD"
            - "RegulatoryDocument.${doc_kosher}.status == STALE"
            - "RegulatoryDocument.${doc_allergen}.status == PINNED and RegulatoryDocument.${doc_sds}.status == PINNED (only the document pinned to the revoked record went stale)"
            - "SampleShipment.${sh}.shipped_g == 150 and SampleLot.${lot}.available_g == 350 (the cascade moves states, never mass)"

