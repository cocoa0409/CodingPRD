      - name: estimate_reject_happy_path_and_lockdown
        claim_type: valid_transition
        grounds: [state_machines.Estimate.PROPOSED_to_REJECTED, "endpoints[POST /ucp/estimates/{estimate_id}/reject]"]
        distinguishing_aspect: "A PROPOSED estimate can be rejected by the tier-appropriate role (SUPERVISOR for a first estimate); the REJECTED estimate is then terminal and a later approve attempt fails ERR_INVALID_STATE."
