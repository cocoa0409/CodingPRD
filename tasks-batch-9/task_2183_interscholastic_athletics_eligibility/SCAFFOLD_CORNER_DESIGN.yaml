              captures: { cred_1: $.data.id }
            - call: "POST /athletics/staff-credentials/${cred_1}/background-check"
              payload: { result: "CLEARED", background_check_reference: "BGC-1" }
              as: AssociationAdmin
          trigger:
            - call: "POST /athletics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-20T00:00:00Z" }
              as: AssociationAdmin
              captures: { expired_n: $.data.expired_credential_count }
            - call: "POST /athletics/staff-credentials/${cred_1}/background-check"
              payload: { result: "CLEARED", background_check_reference: "BGC-2", renewed_certification_expires_on: "2027-06-30" }
              as: AssociationAdmin
          assert:
            - "${expired_n} == 1"
            - "immediately after the clock call, StaffCredential.${cred_1}.status == EXPIRED and School.${sch_a}.credential_gap_sports contains FOOTBALL"
            - "after the renewal, StaffCredential.${cred_1}.status == CLEARED"
            - "after the renewal, StaffCredential.${cred_1}.certification_expires_on == 2027-06-30"
            - "after the renewal, School.${sch_a}.credential_gap_sports == []"
            - "GET /athletics/schools/${sch_a}/staff-credentials returns an array of length 1"

