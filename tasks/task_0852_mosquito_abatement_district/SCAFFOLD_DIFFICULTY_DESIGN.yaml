      - name: empty_surveillance_window_yields_zero_indices_not_division_error
        grounds:
          - calculations.trap_abundance_index
          - calculations.larval_index
          - calculations.minimum_infection_rate
          - endpoints[GET /service-areas/{id}/surveillance-report]
        distinguishing_aspect: |
          Boundary metric #2 is the EMPTY COLLECTION edge on a different endpoint
          (GET /service-areas/{id}/surveillance-report): with zero collections, zero
          inspections and zero observations, every denominator (trap_nights, dips,
          pooled mosquitoes) is 0 and each index must render exactly 0.00 / 0.0 with
          posture NORMAL and posture_source NO_ASSESSMENT, not an error or a null.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00.000Z; ServiceArea NW1 exists with no trap sites, no collections, no inspections, no weather observations, no assessments and no service requests."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: DistrictAdmin
