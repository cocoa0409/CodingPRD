  - rule_id: transitive_cascade
    instances:
      - name: intake_observation_four_hop_monitoring_chain
        grounds:
          - state_machines.PlanOfCareReview.none_to_OPEN
          - state_machines.DietOrder.APPROVED_to_REREVIEW_REQUIRED
          - calculations.resident_weight_trend
          - calculations.intake_risk_score
          - calculations.plan_of_care_trigger
          - entities.SubstitutionRule.fields.status
          - entities.Resident.fields.tray_card_state
        distinguishing_aspect: |
          Depth-4 chain triggered by POST /residents/{id}/intake-observations: hop 1 recomputes the
          resident's monitoring metrics, hop 2 opens a PlanOfCareReview because of hop 1's values,
          hop 3 pushes the ACTIVE DietOrder to REREVIEW_REQUIRED because a review opened, hop 4
          supersedes the TEXTURE substitution rule and sets tray_card_state because of hop 3 — each
          link caused by the previous one, not by the observation itself.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-02T08:00:00Z, then advanced to 2026-08-20T08:00:00Z."
            - "One community and one resident (baseline_weight_kg 78.0, allergens PEANUT)."
            - "One APPROVED, ACTIVE DietOrder: MINCED_MOIST, MILDLY_THICK, therapeutic_codes LOW_SODIUM + RENAL."
            - "Two ACTIVE substitution rules on that resident: one TEXTURE rule (match_value ANY) and one ALLERGEN rule (match_value PEANUT)."
            - "One prior observation on 2026-08-02 at 80.0 kg with intake 80."
