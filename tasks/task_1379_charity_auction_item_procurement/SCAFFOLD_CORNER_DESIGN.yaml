            - "physical-only invoice has an empty certificates list (0 elements)"
            - "fulfill -> fulfillment_status == FULFILLED"
            - "Bundle.${bd}.status == SETTLED (bubble-up on PAID + FULFILLED)"

      - name: writeoff_unpaid_invoice_cascade
        claim_type: side_effect_execution
        grounds:
          - "state_machines.Invoice.payment_status"
          - "errors[ERR_WRITEOFF_FORBIDDEN]"
        distinguishing_aspect: "Write-off of an UNPAID invoice voids the WINNER bid, reverts bundle and item to UNSOLD, voids fulfillment, and spawns a fresh PROPOSED disposition — the compensation path distinct from refund."
        test_recipe:
          setup:
            - "Event closed; PHYSICAL bundle (FMV 40000) sold 50000; invoice UNPAID (no payments)"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala WC", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "DY", email: "dy3@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Vase", ask_estimate_cents: 40000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Vase", description: "Ming", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 40000, fmv_source: "APPRAISAL", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va: "$.data.id" } }
            - { call: "POST /valuations/${va}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Vase" }, as: CatalogManager, captures: { bd: "$.data.id" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd}/publish", payload: {}, as: CatalogManager, captures: { bd_v: "$.data.version" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev}", full_name: "Bidder A", email: "ba@x.org", paddle_no: 1, payment_method_on_file: true }, as: GalaAdmin, captures: { br: "$.data.id" } }
            - { call: "POST /bundles/${bd}/bids", payload: { amount_cents: 50000, expected_bundle_version: "${bd_v}" }, as: Bidder, as_user_id: "${br}", captures: { bid1: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "GET /invoices", payload: { bundle_id: "${bd}" }, as: GalaAdmin, captures: { inv: "$.data[0].id" } }
          trigger:
            - { call: "POST /invoices/${inv}/write-off", payload: {}, as: FinanceOfficer, captures: { ps: "$.data.payment_status", fs: "$.data.fulfillment_status" } }
            - { call: "GET /bundles/${bd}", payload: {}, as: GalaAdmin, captures: { bd_st: "$.data.status" } }
            - { call: "GET /items/${it}", payload: {}, as: GalaAdmin, captures: { it_st: "$.data.status" } }
            - { call: "GET /dispositions", payload: { item_id: "${it}" }, as: GalaAdmin, captures: { disp_st: "$.data[0].status" } }
          assert:
            - "invoice: payment_status == WRITTEN_OFF, fulfillment_status == VOIDED"
            - "Bid.${bid1}.status == VOID; Bundle.${bd}.status == UNSOLD; Item.${it}.status == UNSOLD"
            - "fresh Disposition for item ${it} has status == PROPOSED"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_solicitation_cooldown
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SOLICITATION_COOLDOWN]"
        excluded_because:
          difficulty_instance: donor_solicitation_cooldown_window
          rationale: "Triggered and asserted (negative then boundary-positive) in the named §1.8 rule-8 instance."
      - name: error_bundle_empty
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BUNDLE_EMPTY]"
        excluded_because:
          difficulty_instance: publish_empty_bundle_rejected
          rationale: "Triggered in the named §1.8 rule-6 empty-set instance."
      - name: error_bid_below_minimum
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BID_BELOW_MINIMUM]"
        excluded_because:
          difficulty_instance: bid_exactly_at_min_bid_boundary
          rationale: "Triggered at min_bid-1 in the named §1.8 rule-6 instance and again at the tier boundary in min_next_bid_tier_boundary."
      - name: error_blackout_conflict
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_BLACKOUT_CONFLICT]"
        excluded_because:
          difficulty_instance: blackout_half_open_intersection
          rationale: "Triggered by the one-day-overlap redemption in the named §1.8 rule-8 instance."
      - name: error_redemption_window_invalid
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REDEMPTION_WINDOW_INVALID]"
        excluded_because:
          difficulty_instance: redemption_closed_containment_with_grace
          rationale: "Triggered by the grace_end+1day redemption in the named §1.8 rule-8 instance (and as the winning error in temporal_beats_constraint_on_redeem)."
      - name: error_reconcile_blocked
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_RECONCILE_BLOCKED]"
        excluded_because:
          difficulty_instance: reconcile_gated_on_open_invoices
          rationale: "Triggered by the UNPAID-invoice reconcile in the named §1.8 rule-7 instance."
      - name: error_event_phase_forbidden
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_EVENT_PHASE_FORBIDDEN]"
        excluded_because:
          difficulty_instance: bid_requires_event_bidding_open
          rationale: "Triggered by bidding while CATALOGING in the named §1.8 rule-7 instance."
      - name: error_item_not_valued
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ITEM_NOT_VALUED]"
        excluded_because:
          difficulty_instance: bundle_attach_requires_item_valued
          rationale: "Triggered by attaching a RECEIVED item in the named §1.8 rule-7 instance."

      - name: reconcile_success_reaches_reconciled
        claim_type: valid_transition
        grounds:
          - "state_machines.GalaEvent.SETTLEMENT_to_RECONCILED"
        distinguishing_aspect: "With the only invoice PAID and FULFILLED and no open dispositions, reconcile moves the event SETTLEMENT -> RECONCILED (terminal reachability of the full lifecycle)."
        test_recipe:
          setup:
            - "Event BIDDING_CLOSED; PHYSICAL bundle (FMV 40000) sold 50000, invoice PAID and fulfilled"
          setup_api_calls:
            - { call: "POST /gala-events", payload: { name: "Gala RC", gala_date: "2026-11-20", bidding_opens_at: "2026-11-20T18:00:00Z", bidding_closes_at: "2026-11-20T22:00:00Z", min_bid_pct_bps: 3000, min_bid_increment_cents: 500, min_bid_floor_cents: 1000, bid_increment_tiers: [{up_to_cents: 100000, increment_cents: 2500}, {up_to_cents: 500000, increment_cents: 5000}, {up_to_cents: null, increment_cents: 10000}], ack_threshold_cents: 25000, solicitation_cooldown_days: 30, cert_validity_months: 12, cert_grace_days: 30 }, as: GalaAdmin, captures: { ev: "$.data.id" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /donors", payload: { full_name: "DRC", email: "drc@x.org", donor_type: "INDIVIDUAL" }, as: ProcurementOfficer, captures: { dn: "$.data.id" } }
            - { call: "POST /solicitations", payload: { donor_id: "${dn}", gala_event_id: "${ev}", ask_description: "Vase", ask_estimate_cents: 40000 }, as: ProcurementOfficer, captures: { so: "$.data.id" } }
            - { call: "POST /solicitations/${so}/send", payload: {}, as: ProcurementOfficer }
            - { call: "POST /solicitations/${so}/record-response", payload: { outcome: "PLEDGED" }, as: ProcurementOfficer }
            - { call: "POST /items", payload: { solicitation_id: "${so}", title: "Vase", description: "Ming", kind: "PHYSICAL" }, as: ProcurementOfficer, captures: { it: "$.data.id", it_v: "$.data.version" } }
            - { call: "POST /items/${it}/valuations", payload: { fmv_cents: 40000, fmv_source: "APPRAISAL", expected_item_version: "${it_v}" }, as: ProcurementOfficer, as_user_id: "po_1", captures: { va: "$.data.id" } }
            - { call: "POST /valuations/${va}/approve", payload: {}, as: ValuationApprover, as_user_id: "va_1" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bundles", payload: { gala_event_id: "${ev}", title: "Vase" }, as: CatalogManager, captures: { bd: "$.data.id" } }
            - { call: "POST /bundles/${bd}/items", payload: { item_id: "${it}" }, as: CatalogManager }
            - { call: "POST /bundles/${bd}/publish", payload: {}, as: CatalogManager, captures: { bd_v: "$.data.version" } }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "POST /bidders", payload: { gala_event_id: "${ev}", full_name: "Bidder A", email: "ba@x.org", paddle_no: 1, payment_method_on_file: true }, as: GalaAdmin, captures: { br: "$.data.id" } }
            - { call: "POST /bundles/${bd}/bids", payload: { amount_cents: 50000, expected_bundle_version: "${bd_v}" }, as: Bidder, as_user_id: "${br}" }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
            - { call: "GET /invoices", payload: { bundle_id: "${bd}" }, as: GalaAdmin, captures: { inv: "$.data[0].id" } }
            - { call: "POST /invoices/${inv}/payments", payload: { amount_cents: 50000, method: "CARD" }, as: Bidder, as_user_id: "${br}", captures: { pay: "$.data.id" } }
            - { call: "POST /_payments/simulate", payload: { payment_id: "${pay}", outcome: "SUCCEEDED" }, as: GalaAdmin }
            - { call: "POST /invoices/${inv}/fulfill", payload: {}, as: GalaAdmin }
            - { call: "POST /gala-events/${ev}/advance", payload: {}, as: GalaAdmin }
          trigger:
            - { call: "POST /gala-events/${ev}/reconcile", payload: {}, as: FinanceOfficer, captures: { st: "$.data.status" } }
            - { call: "GET /bundles/${bd}", payload: {}, as: GalaAdmin, captures: { bd_st: "$.data.status" } }
          assert:
            - "reconcile succeeds: GalaEvent.${ev}.status == RECONCILED"
            - "Bundle.${bd}.status == SETTLED (PAID + FULFILLED bubble-up)"
