            - "ManufacturedUnit.${u16c} is created: the identical 2027-01-06 start on lot B-08 is unaffected, proving the conflict is keyed on (community_id, lot_number) and not on the date alone"
            - "ManufacturedUnit.${u16d} is created with placement_start_date == 2027-01-07T00:00:00Z, exactly the buffer's exclusive upper endpoint"
            - "ManufacturedUnit.${u16d}.placement_end_date == null and ManufacturedUnit.${u16d}.classification == PERSONAL_PROPERTY"
            - "ManufacturedUnit.${u16a}.placement_end_date == 2026-12-31T00:00:00Z is untouched by either attempt"
            - "GET /chattel/units?community_id=${c16} has total_count 3 (the refused unit was never persisted)"

