            - call: "POST /v1/memberships/${ms1}/approve"
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/memberships/${ms2}/approve"
              as: PlatformAdmin
              captures: { ms2_status: $.data.status }
            - call: "POST /v1/memberships/${ms3}/approve"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "GET /v1/groups/${g_id}"
              as: PlatformAdmin
          assert:
            - "second approve succeeds (member_count 1 -> 2): GroupMembership.${ms2}.status == APPROVED"
            - "third approve rejected: error_id == ERR_GROUP_FULL, http 409 (member_count 2 >= capacity 2)"
