  # ===========================================================================
  # Errors (§1.6)
  # ===========================================================================
  - section: errors
    instances:
      - name: request_missing_x_user_role_header_returns_unauthenticated
        claim_type: error_triggerability
        grounds:
          - validations.priority_1
          - errors[ERR_UNAUTHENTICATED]
          - response_envelope
        distinguishing_aspect: "The authentication gate sits above every other rule: a read with neither X-User-Role nor X-User-ID returns ERR_UNAUTHENTICATED (401) in the standard error envelope, and an unrecognised role string on the same path returns the same code rather than 403."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
          trigger:
            - call: "GET /graduate-school/theses"
              payload: {}
              as: unauthenticated
              captures: { err_id: $.data.error_id, msg: $.data.message }
            - call: "GET /graduate-school/theses"
              payload: {}
              as: Provost
              as_user_id: "prov-1"
              captures: { err_role: $.data.error_id }
          assert:
            - "the first trigger call is sent with no X-User-Role and no X-User-ID header"
            - "HTTP status of the first trigger call == 401"
            - "${err_id} == ERR_UNAUTHENTICATED"
            - "${msg} is a non-empty string"
            - "the second trigger call is sent with X-User-Role: Provost, which is not one of the six declared roles"
            - "HTTP status of the second trigger call == 401"
            - "${err_role} == ERR_UNAUTHENTICATED"

      - name: theses_list_with_limit_above_the_maximum_rejected
        claim_type: error_triggerability
        grounds:
          - validations.priority_3
          - errors[ERR_INVALID_REQUEST]
          - endpoints.GET /graduate-school/theses
        distinguishing_aspect: "Pagination inputs are validated like any other input: limit 101 exceeds the declared 1..100 range and returns ERR_INVALID_REQUEST (400), while limit 100 on the same path succeeds."
        test_recipe:
          setup:
            - "Term 2026FA is OPEN with one MASTERS candidate holding one DRAFT thesis."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
            - call: "POST /graduate-school/terms"
              payload: { code: "2026FA", defense_deadline: "2026-11-13T23:59:59Z", format_review_deposit_deadline: "2026-12-04T17:00:00Z", degree_conferral_date: "2026-12-18T00:00:00Z", announcement_lead_business_days: 10 }
              as: Registrar
              as_user_id: "reg-1"
              captures: { term_id: $.data.id }
            - call: "POST /graduate-school/students"
              payload: { full_name: "Ada Stone", email: "ada@u.edu", degree_level: "MASTERS", program_code: "CS" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu_id: $.data.id }
            - call: "POST /graduate-school/theses"
              payload: { student_id: "${stu_id}", term_id: "${term_id}", title: "Pagination Probe", document_type: "THESIS", page_count: 101, third_party_item_count: 0 }
              as: Student
              as_user_id: "${stu_id}"
              captures: { thesis_id: $.data.id }
          trigger:
            - call: "GET /graduate-school/theses?limit=101"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /graduate-school/theses?limit=100&offset=0"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
          assert:
            - "HTTP status of the first trigger call == 400"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "HTTP status of the second trigger call == 200"
            - "the second trigger call returns exactly 1 row and total_count 1 with has_more false"

      - name: unknown_ids_return_the_matching_not_found_error
        claim_type: error_triggerability
        grounds:
          - validations.priority_4
          - validations.priority_5
          - errors[ERR_TERM_NOT_FOUND]
          - errors[ERR_STUDENT_NOT_FOUND]
          - errors[ERR_FACULTY_NOT_FOUND]
          - errors[ERR_ROOM_NOT_FOUND]
          - errors[ERR_THESIS_NOT_FOUND]
          - errors[ERR_COMMITTEE_NOT_FOUND]
          - errors[ERR_COMMITTEE_MEMBER_NOT_FOUND]
          - errors[ERR_DEFENSE_NOT_FOUND]
          - errors[ERR_FORMAT_REVIEW_NOT_FOUND]
          - errors[ERR_EMBARGO_REQUEST_NOT_FOUND]
          - errors[ERR_PERMISSION_RECORD_NOT_FOUND]
          - errors[ERR_SCREENING_NOT_FOUND]
        distinguishing_aspect: "Each entity family owns its own 404 code: eleven unresolvable path ids on eleven endpoints return eleven distinct error_id values, never a shared generic 404."
        test_recipe:
          setup:
            - "Empty database; the logical clock reads 2026-08-01T00:00:00Z, so none of the ids below resolve."
          setup_api_calls:
            - call: "POST /graduate-school/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Registrar
