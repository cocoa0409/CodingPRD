        distinguishing_aspect: |
          One write four levels deep: AbsenceReport create -> PostAssignment
          coverage_state GAP (link 1) -> GuardPost coverage_status UNCOVERED
          (link 2, caused by link 1) -> School coverage_rate_pct 0.00 and
          coverage_posture SUSPENDED (link 3, caused by link 2) -> the school's
          PUBLISHED WalkingRoute moves to ADVISORY_HOLD with hold_reason
          SCHOOL_COVERAGE_SUSPENDED (link 4, caused by link 3). Link 4 touches an
          entity that has no foreign key to the absence at all, so an implementation
          that stops at the two "obvious" counter updates leaves the route published
          and the school OPEN.
