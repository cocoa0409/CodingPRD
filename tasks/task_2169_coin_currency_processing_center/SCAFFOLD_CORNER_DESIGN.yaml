  - section: rbac
    instances:
      - name: missing_x_user_headers_returns_unauthenticated
        claim_type: Role Denial
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request sent without the X-User-ID header (as_user_id omitted) is rejected with ERR_UNAUTHENTICATED at 401 before any role, existence or state check runs, and no Vault row is created."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /cash-vault/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: VaultManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /cash-vault/vaults"
              payload: { vault_code: "CV-C46", name: "Headerless Vault" }
              as: VaultManager
              captures: { err: $.data.error_id }
          assert:
            - "the trigger request is sent with the X-User-ID header omitted entirely"
            - "${err} == ERR_UNAUTHENTICATED"
            - "HTTP status of the trigger response == 401"

      - name: unrecognized_role_header_returns_unauthenticated
        claim_type: Role Denial
        grounds:
          - validations[priority=2]
          - errors[ERR_UNAUTHENTICATED]
