scaffold_difficulty_design:
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: budget_levelized_vs_standard_actual_on_bill
        grounds:
          - calculations.price_bill
          - calculations.price_bill.variants.budget_billed
          - calculations.price_bill.variants.standard_billed
          - entities.Bill.fields.total_due_cents
          - entities.Bill.fields.actual_cost_cents
        distinguishing_aspect: |
          Same meter reads priced two ways on the Bill entity: with an ACTIVE budget plan
          total_due_cents is the levelized 1500 while actual_cost_cents is the real 2756; without
          a plan total_due_cents equals actual_cost_cents (2756). Cost-accounting domain.
        test_recipe:
          setup:
            - "ACTIVE tariff RES-TOU-2026 (fixed 1000, tiers [500,1000]@[12,18,25], TOU 1.5/1.0/0.8, demand 800, NM 10)"
            - "Account A on that tariff, one BIDIRECTIONAL meter"
            - "Four reads on 2026-01-05: three ON_PEAK import 2.0 (hours 16,17,18) + one MID_PEAK import 4.0 (hour 07)"
            - "Account A has an ACTIVE BudgetBillingPlan levelized 1500; a DRAFT bill over [2026-01-01,2026-02-01)"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-TOU-2026", name: "Residential TOU", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Budget Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-A1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T17:00:00Z", interval_end: "2026-01-05T18:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T18:00:00Z", interval_end: "2026-01-05T19:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T07:00:00Z", interval_end: "2026-01-05T08:00:00Z", import_kwh: 4.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /budget-plans"
              payload: { account_id: "${acct_id}", levelized_amount_cents: 1500 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
              captures: { due: $.data.total_due_cents, actual: $.data.actual_cost_cents, budget: $.data.is_budget_billed }
          assert:
            - "Bill.${bill_id}.is_budget_billed == true"
            - "Bill.${bill_id}.total_due_cents == 1500"
            - "Bill.${bill_id}.actual_cost_cents == 2756"
            - "Bill.${bill_id}.energy_charge_cents == 156"
            - "Bill.${bill_id}.demand_charge_cents == 1600"

      - name: arrears_age_instantaneous_vs_cumulative_on_account
        grounds:
          - calculations.arrears_age_evaluation
          - calculations.arrears_age_evaluation.variants.instantaneous_on_payment
          - calculations.arrears_age_evaluation.variants.cumulative_on_clock
          - entities.Account.fields.financial_status
          - state_machines.Account.DELINQUENT_to_IN_ARREARS
        distinguishing_aspect: |
          Same unpaid Bill drives two different financial_status outcomes on the Account: the
          cumulative-on-clock variant flips CURRENT->...->IN_ARREARS purely by advancing the clock
          to day 45, whereas the instantaneous-on-payment variant drops it back to CURRENT in one
          step after a clearing payment. Different entity domain (Account financial state, not Bill cost).
        test_recipe:
          setup:
            - "ACTIVE tariff + Account B + meter + one ON_PEAK read import 2.0 on 2026-01-05T16:00"
            - "DRAFT bill over [2026-01-01,2026-02-01) due 2026-01-01T00:00:00Z, issued; clock starts 2026-01-01"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-TOU-B", name: "Res TOU B", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Arrears Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-B1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-01-01T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
              captures: { due: $.data.total_due_cents }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T00:00:00Z" }
              as: BillingOperator
            - call: "POST /payments"
              payload: { account_id: "${acct_id}", amount_cents: 2636, method: "ACH" }
              as: Customer
              as_user_id: "${acct_id}"
          assert:
            - "after clock advance to 2026-02-15 (45 days), Account.${acct_id}.financial_status == IN_ARREARS"
            - "after full payment 2636, Account.${acct_id}.financial_status == CURRENT"
            - "Bill.${bill_id}.status == PAID"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_plus_tou_plus_demand_nonlinear_energy
        grounds:
          - calculations.price_bill
          - entities.Tariff.fields.tier_rates_cents_per_kwh
          - entities.Tariff.fields.tou_multipliers
          - entities.Bill.fields.energy_charge_cents
        distinguishing_aspect: |
          MODE (a): energy_charge depends non-linearly on >=3 inputs (total_import_kwh selects which
          inclining blocks fill, TOU shares re-weight the block cost, demand max is a separate axis).
          1200 kWh straddles all three tiers (6000+9000+5000=20000) then TOU-weights to 25000.
        test_recipe:
          setup:
            - "ACTIVE tariff RES-TOU-2026 as above"
            - "Account C + meter; one ON_PEAK read import 600 (hour 16) + one MID_PEAK read import 600 (hour 07)"
            - "DRAFT bill over [2026-01-01,2026-02-01)"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-TOU-C", name: "Res TOU C", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Tier Straddle" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-C1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 600.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T07:00:00Z", interval_end: "2026-01-05T08:00:00Z", import_kwh: 600.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
              captures: { energy: $.data.energy_charge_cents, demand: $.data.demand_charge_cents, due: $.data.total_due_cents }
          assert:
            - "Bill.${bill_id}.energy_charge_cents == 25000"
            - "Bill.${bill_id}.demand_charge_cents == 480000"
            - "Bill.${bill_id}.billed_peak_demand_kw == 600.0"
            - "Bill.${bill_id}.total_due_cents == 505000"

      - name: energy_rounding_order_pinned_after_tou_sum
        grounds:
          - calculations.price_bill
          - entities.Bill.fields.energy_charge_cents
        distinguishing_aspect: |
          MODE (b): nested rounding where order matters. The scaffold pins ROUND-ONCE after the
          TOU-weighted sum. With tier_cost 120 split 0.6/0.4 over multipliers 1.5/1.0, per-period
          rounding (round(108)+round(48)=156) vs round-once (round(108+48)=156) — and a fractional
          case (tier_cost 125, share 0.333.../0.666...) diverges; the scaffold forbids per-period rounding.
        test_recipe:
          setup:
            - "ACTIVE tariff with fixed 0, single tier rate 10, TOU 1.5/1.0/0.8, demand 0, NM 0"
            - "Account D + meter; one ON_PEAK read import 1.0 (hour 16) + two MID_PEAK reads import 1.0 each (hours 07,08)"
            - "tier_cost = 3.0 kWh * 10 = 30 cents; ON share 1/3, MID share 2/3"
            - "round-once: round(30*(1/3)*1.5 + 30*(2/3)*1.0) = round(15 + 20) = 35"
            - "DRAFT bill over [2026-03-01,2026-04-01)"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-RND-D", name: "Rounding D", fixed_charge_cents: 0, tier_breakpoints_kwh: [], tier_rates_cents_per_kwh: [10], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 0, net_metering_credit_cents_per_kwh: 0 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Rounding Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-D1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-03-05T16:00:00Z", interval_end: "2026-03-05T17:00:00Z", import_kwh: 1.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-03-05T07:00:00Z", interval_end: "2026-03-05T08:00:00Z", import_kwh: 1.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-03-05T08:00:00Z", interval_end: "2026-03-05T09:00:00Z", import_kwh: 1.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
              captures: { energy: $.data.energy_charge_cents }
          assert:
            - "Bill.${bill_id}.energy_charge_cents == 35"
            - "Bill.${bill_id}.total_due_cents == 35"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: account_parallel_service_and_financial_dimensions
        grounds:
          - state_machines.Account
          - entities.Account.fields.service_status
          - entities.Account.fields.financial_status
          - state_machines.Account.ACTIVE_to_DISCONNECT_PENDING
          - state_machines.Account.IN_ARREARS_to_CURRENT
        distinguishing_aspect: |
          Account carries two independent state axes: service_status and financial_status evolve
          on separate transition sets. An account can be DISCONNECT_PENDING (service) while still
          IN_ARREARS (financial) and the dimensions are asserted separately on one row.
        test_recipe:
          setup:
            - "Account E IN_ARREARS (issued bill 45+ days past due) with no assistance, service_status ACTIVE"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-PAR-E", name: "Parallel E", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Parallel Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-E1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-01-01T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T00:00:00Z" }
              as: BillingOperator
          trigger:
            - call: "POST /accounts/${acct_id}/disconnect-notice"
              payload: {}
              as: BillingOperator
              captures: { so_id: $.data.id, so_type: $.data.order_type }
          assert:
            - "Account.${acct_id}.service_status == DISCONNECT_PENDING"
            - "Account.${acct_id}.financial_status == IN_ARREARS"
            - "ServiceOrder.${so_id}.order_type == DISCONNECT"
            - "ServiceOrder.${so_id}.status == SCHEDULED"

      - name: assistance_grant_cycles_exhausted_back_to_applied_on_void
        grounds:
          - state_machines.AssistanceGrant
          - state_machines.AssistanceGrant.PLEDGED_to_EXHAUSTED
          - state_machines.AssistanceGrant.EXHAUSTED_to_APPLIED
          - entities.AssistanceGrant.fields.remaining_cents
          - state_machines.Bill.ISSUED_to_VOID
        distinguishing_aspect: |
          AssistanceGrant is cyclic on a different entity than Account: a bill drives it PLEDGED->EXHAUSTED
          (remaining 0), then voiding that bill refunds assistance and drives it EXHAUSTED->APPLIED
          (remaining > 0). The reverse edge distinguishes it from a linear lifecycle.
        test_recipe:
          setup:
            - "Account F + meter + reads producing actual cost 2756; PLEDGED grant pledged 2000"
            - "Bill issued: assistance 2000 applied, grant EXHAUSTED (remaining 0)"
          setup_api_calls:
            - call: "POST /tariffs"
              payload: { code: "RES-ASS-F", name: "Assist F", fixed_charge_cents: 1000, tier_breakpoints_kwh: [500, 1000], tier_rates_cents_per_kwh: [12, 18, 25], tou_multipliers: { ON_PEAK: 1.5, MID_PEAK: 1.0, OFF_PEAK: 0.8 }, demand_charge_cents_per_kw: 800, net_metering_credit_cents_per_kwh: 10 }
              as: BillingOperator
              captures: { tar_id: $.data.id }
            - call: "POST /tariffs/${tar_id}/activate"
              payload: {}
              as: BillingOperator
            - call: "POST /accounts"
              payload: { tariff_id: "${tar_id}", holder_name: "Assist Holder" }
              as: BillingOperator
              captures: { acct_id: $.data.id }
            - call: "POST /meters"
              payload: { account_id: "${acct_id}", serial: "MTR-F1", meter_type: "BIDIRECTIONAL" }
              as: BillingOperator
              captures: { mtr_id: $.data.id }
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T16:00:00Z", interval_end: "2026-01-05T17:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T17:00:00Z", interval_end: "2026-01-05T18:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T18:00:00Z", interval_end: "2026-01-05T19:00:00Z", import_kwh: 2.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /meter-reads"
              payload: { meter_id: "${mtr_id}", interval_start: "2026-01-05T07:00:00Z", interval_end: "2026-01-05T08:00:00Z", import_kwh: 4.0, export_kwh: 0.0 }
              as: BillingOperator
            - call: "POST /assistance-grants"
              payload: { account_id: "${acct_id}", pledged_cents: 2000, program: "LIHEAP" }
              as: AssistanceCaseworker
              captures: { grant_id: $.data.id }
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-20T00:00:00Z" }
              as: BillingOperator
              captures: { bill_id: $.data.id, acct_v: $.data.version }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: BillingOperator
              captures: { acctver_1: $.data.version }
            - call: "POST /bills/${bill_id}/issue"
              payload: { expected_account_version: "${acctver_1}" }
              as: BillingOperator
              captures: { assist_applied: $.data.assistance_applied_cents }
          trigger:
            - call: "POST /bills/${bill_id}/void"
              payload: {}
              as: BillingOperator
              captures: { vstatus: $.data.status }
          assert:
            - "before void: Bill.${bill_id}.assistance_applied_cents == 2000 and AssistanceGrant.${grant_id}.status == EXHAUSTED"
            - "after void: AssistanceGrant.${grant_id}.status == APPLIED or PLEDGED"
            - "after void: AssistanceGrant.${grant_id}.remaining_cents == 2000"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: payment_clears_arrears_cascades_cancel_disconnect_revert_service
        grounds:
          - calculations.payment_waterfall
          - state_machines.Account.IN_ARREARS_to_CURRENT
          - state_machines.Account.DISCONNECT_PENDING_to_ACTIVE
          - state_machines.ServiceOrder.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade from ONE trigger (POST /payments): (1) payment clears bills -> financial_status
          IN_ARREARS->CURRENT; (2) clearing arrears -> the SCHEDULED DISCONNECT ServiceOrder is CANCELLED;
          (3) cancelling that disconnect order -> account.service_status DISCONNECT_PENDING->ACTIVE.
          Each link caused by the prior, not by the payment directly.
        test_recipe:
          setup:
            - "Account G IN_ARREARS with a SCHEDULED DISCONNECT ServiceOrder and service_status DISCONNECT_PENDING"
            - "one issued bill total_due 2636, due 2026-01-01, clock at 2026-02-15"
          setup_api_calls:
