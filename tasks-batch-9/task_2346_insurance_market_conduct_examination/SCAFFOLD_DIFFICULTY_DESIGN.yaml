  # =============================================================================
  # RULE 8 - resource_temporal_overlap
  # =============================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: examination_fieldwork_windows_are_half_open_per_insurer
        grounds:
          - validations[priority 55 ERR_EXAM_WINDOW_CONFLICT]
          - entities.Examination.fields.fieldwork_start_date
          - entities.Examination.fields.fieldwork_end_date
          - endpoints[POST /market-conduct/examinations]
        distinguishing_aspect: |
          The contended resource is the CARRIER's examinable calendar, and the interval is half-open:
          a window starting exactly on the incumbent's end date is allowed, a window overlapping by a
          single day is refused, a window strictly contained in the incumbent's is refused, the same
          window for a different carrier is allowed, and aborting the incumbent frees the calendar again.
        test_recipe:
          setup:
            - "Insurer AURORA (LICENSED) and insurer CEDAR (LICENSED) exist."
            - "Examination E1 on AURORA with fieldwork 2026-09-01 .. 2026-11-30, status SCOPING (non-terminal, so it holds the window)."
          setup_api_calls:
            - call: "POST /market-conduct/insurers"
              payload: { name: "Aurora Mutual Insurance Company", naic_code: "10001", annual_premium_written_cents: 1200000000, policy_count_in_force: 40000, confirmed_complaints_12mo: 120, financial_stress_score: 60, consumer_trend_score: 50 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { aurora_id: "$.data.id" }
            - call: "POST /market-conduct/insurers"
              payload: { name: "Cedar Ridge Mutual Insurance Company", naic_code: "10003", annual_premium_written_cents: 800000000, policy_count_in_force: 30000, confirmed_complaints_12mo: 60, financial_stress_score: 40, consumer_trend_score: 30 }
              as: MarketAnalyst
              as_user_id: "44444444-4444-4444-4444-444444444444"
              captures: { cedar_id: "$.data.id" }
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "MARKET_CONDUCT_EXAM", mode: "ON_SITE", lead_state_code: "NV", fieldwork_start_date: "2026-09-01", fieldwork_end_date: "2026-11-30" }
              as: SupervisingExaminer
              as_user_id: "11111111-1111-1111-1111-111111111111"
              captures: { e1_id: "$.data.id" }
          trigger:
            - call: "POST /market-conduct/examinations"
              payload: { insurer_id: "${aurora_id}", exam_type: "TARGETED_EXAM", mode: "DESK", lead_state_code: "NV", fieldwork_start_date: "2026-11-30", fieldwork_end_date: "2027-01-31" }
