            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_pr2}/effectuate-termination", payload: {}, as: PlanAdministrator }
            - { call: "GET /termination-cases/${c_pr2}", payload: {}, as: PlanAdministrator, captures: { c_pr2_v2: "$.data.version" } }
            - { call: "POST /notices", payload: { termination_case_id: "${c_pr2}", notice_type: DISTRIBUTION, action_effective_date: "2026-10-20T00:00:00Z", expected_termination_case_version: "${c_pr2_v2}" }, as: PlanAdministrator }
            - { call: "POST /termination-cases/${c_pr2}/begin-distributions", payload: {}, as: PlanAdministrator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /participants/${p_z}/contact-flags", payload: { flag_type: UNDELIVERABLE_MAIL }, as: Recordkeeper }
            - { call: "POST /participants/${p_z}/declare-missing", payload: {}, as: PlanAdministrator, as_user_id: "admin-1", captures: { sc_z: "$.data.active_search_case_id" } }
            - { call: "POST /search-cases/${sc_z}/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-11-01T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_z}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_z}/attempts", payload: { method: PUBLIC_RECORDS, vendor_name: "PubRec", attempted_at: "2026-11-02T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_z}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_z}/attempts", payload: { method: CREDIT_BUREAU, vendor_name: "CBX", attempted_at: "2026-11-03T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_z}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /search-cases/${sc_z}/attempts", payload: { method: CERTIFIED_MAIL, vendor_name: "USPS", attempted_at: "2026-11-04T00:00:00Z", outcome: NO_RESULT }, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-19T00:00:00Z" }, as: PlanAdministrator }
            - { call: "POST /search-cases/${sc_z}/escalate", payload: {}, as: PlanAdministrator, as_user_id: "admin-1" }
            - { call: "POST /fiduciary-log-entries", payload: { termination_case_id: "${c_pr2}", entry_type: SEARCH_PROTOCOL_SUMMARY, narrative: "Exhausted commercial locator, public records, credit bureau, and certified mail steps with no result for this participant.", related_entity_id: "${sc_z}" }, as: PlanAdministrator, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /forfeitures", payload: { participant_id: "${p_z}", rationale: "Attempted forfeiture by the same user who ran the search protocol to exhaustion." }, as: IndependentFiduciary, as_user_id: "admin-1", captures: { err_z: "$.data.error_id" } }
          assert:
            - "The request violates BOTH segregation-of-duties (X-User-ID admin-1 == exhausted_by_user_id) and the zero-balance fiscal rule (net_distributable_cents == 0)"
            - "error_id == ERR_SEGREGATION_OF_DUTIES_VIOLATION (business_safety, priority 7, beats business_fiscal, priority 12) and http status == 403"
            - "no Forfeiture row exists for Participant.${p_z} afterwards"

      - name: role_auth_beats_existence
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          Error-category pair auth (priority 2) vs existence (priority 3) — a
          third distinct pair: a Participant-role call against a non-existent
          search case id must return ERR_FORBIDDEN_ROLE (403), never leaking
          ERR_NOT_FOUND (404) for a resource the role may not touch.
        test_recipe:
          setup:
            - "A single termination case exists; the targeted search case id is a random UUID that exists nowhere."
          setup_api_calls:
            - { call: "POST /termination-cases", payload: { plan_name: "AuthOrder Co 401k", sponsor_ein: "123456789", plan_number: "062", proposed_termination_date: "2026-10-15T00:00:00Z" }, as: PlanAdministrator }
          trigger:
            - { call: "POST /search-cases/00000000-0000-0000-0000-000000000000/attempts", payload: { method: COMMERCIAL_LOCATOR, vendor_name: "Loc8", attempted_at: "2026-08-01T00:00:00Z", outcome: NO_RESULT }, as: Participant, as_user_id: "00000000-0000-0000-0000-000000000001", captures: { err_ae: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and http status == 403 (authorization is evaluated before existence; the non-existent id is never revealed)"

  - rule_id: boundary_precision_check
    instances:
      - name: default_treatment_1000_dollar_boundary
        grounds:
          - calculations.default_treatment_tier
          - entities.Payout.fields.method
        distinguishing_aspect: |
          Cents metric via POST /participants/{id}/apply-default-treatment:
          net 99999 falls in the CASH_OUT tier (LUMP_SUM_CHECK with withholding)
          while exactly 100000 flips to AUTO_ROLLOVER_IRA (inclusive lower bound,
          no withholding) — one cent changes the distribution channel.
        test_recipe:
          setup:
            - "Case in DISTRIBUTION_IN_PROGRESS (default_treatment_date 2026-11-19) with participants LO 99999 and HI 100000, vested 100%, neither MISSING; clock advanced to 2026-11-20 (strictly after default_treatment_date)."
