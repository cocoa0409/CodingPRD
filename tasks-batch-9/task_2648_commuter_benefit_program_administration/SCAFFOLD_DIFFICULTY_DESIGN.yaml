            - call: "POST /benefits/media-orders"
              payload: { election_id: "${el2_id}", transit_media_id: "${med_id}", order_batch_id: "${bat2_id}", quantity: 1, coverage_start_at: "2026-08-15T00:00:01Z", coverage_end_at: "2026-08-31T00:00:00Z", expected_election_version: "${el2_v}" }
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { mo_b_id: $.data.id, mo_b_start: $.data.coverage_start_at, mo_b_status: $.data.status }
          assert:
            - "${mo_a_end} == 2026-08-15T00:00:00Z"
            - "${touching_error} == ERR_MEDIA_COVERAGE_OVERLAP"
            - "the touching attempt returned HTTP 409 because closed intervals collide at a shared endpoint"
            - "${mo_b_start} == 2026-08-15T00:00:01Z"
            - "${mo_b_status} == PENDING"
            - "the one-second-later attempt returned HTTP 201"
            - "MediaOrder.${mo_a_id}.status == PENDING"
            - "MediaOrder.${mo_a_id}.superseded_media_order_id == null"
            - "MediaOrder.${mo_b_id}.superseded_media_order_id == null"
            - "OrderBatch.${bat1_id}.line_count == 1"
            - "OrderBatch.${bat2_id}.line_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: funding_reversal_restores_money_conservation_and_ledger_sum
        grounds:
          - calculations.benefit_account_conservation
          - state_machines.Election.FUNDED_to_REVERSED
          - endpoints.POST_/benefits/elections/{election_id}/reverse-funding
          - entities.BenefitAccount.fields.reversed_cents
          - entities.LedgerEntry.fields.balance_after_cents
          - calculations.employer_pretax_commitment
        distinguishing_aspect: |
          CONSERVED QUANTITY 1 - MONEY. A forward funding of 30000 followed by its compensating
          reversal must return available_balance_cents to the pre-funding 1500 while LEAVING the
          forward buckets intact: contributed_cents stays 30000 and reversed_cents becomes 30000, so
          the identity rollover_in + contributed - spent - forfeited - refunded - reversed - fees
          still equals the signed ledger sum. The compensation is additive (a third append-only
          entry), never a deletion or a rollback of contributed_cents, and the employer's
          total_pretax_committed_cents unwinds to 0 as well.
        test_recipe:
          setup:
            - "Employer 'Chicago Reversal Co' is ACTIVE in US-IL-CHI with transit_group_limit_cents 30000, pretax_ratio_cap_pct 100 and program_cap_cents 5000000."
            - "One TRANSIT_PASS category with monthly_exclusion_limit_cents 30000 exists."
            - "One employee holds a TRANSIT_PASS BenefitAccount seeded with opening_rollover_cents 1500, which produced a single ROLLOVER_IN ledger entry."
            - "ElectionWindow 2026-08 [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z) took a pretax 30000 election and was LOCKED, so the election is FUNDED, the account shows contributed_cents 30000 / available_balance_cents 31500 over two ledger entries, and the employer shows total_pretax_committed_cents 30000."
            - "No card transaction has been posted, so spent_cents is 0 and the reversal is unobstructed."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Chicago Reversal Co", region_code: "US-IL-CHI", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, pretax_ratio_cap_pct: 100, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "CHI-REV-1", work_region_code: "US-IL-CHI", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}", opening_rollover_cents: 1500 }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version, opening_avail: $.data.available_balance_cents }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 30000, posttax_amount_cents: 0, expected_account_version: "${acct_v}" }
              as: ProgramAdmin
              captures: { el_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/lock"
              payload: {}
              as: ProgramAdmin
            - call: "GET /benefits/benefit-accounts/${acct_id}"
              payload: {}
              as: ProgramAdmin
              captures: { funded_avail: $.data.available_balance_cents, funded_contributed: $.data.contributed_cents, funded_entries: $.data.ledger_entry_count }
          trigger:
            - call: "POST /benefits/elections/${el_id}/reverse-funding"
              payload: { reason: "EMPLOYER_FUNDING_RECALL" }
              as: ProgramAdmin
              captures: { reversed_funding_status: $.data.funding_status }
          assert:
            - "${opening_avail} == 1500"
            - "${funded_avail} == 31500"
            - "${funded_contributed} == 30000"
            - "${funded_entries} == 2"
            - "${reversed_funding_status} == REVERSED"
            - "BenefitAccount.${acct_id}.rollover_in_cents == 1500"
            - "BenefitAccount.${acct_id}.contributed_cents == 30000"
            - "BenefitAccount.${acct_id}.reversed_cents == 30000"
            - "BenefitAccount.${acct_id}.spent_cents == 0"
            - "BenefitAccount.${acct_id}.forfeited_cents == 0"
            - "BenefitAccount.${acct_id}.refunded_cents == 0"
            - "BenefitAccount.${acct_id}.fee_charged_cents == 0"
            - "BenefitAccount.${acct_id}.available_balance_cents == 1500"
            - "BenefitAccount.${acct_id}.ledger_entry_count == 3"
            - "the account's LedgerEntry rows in created_at order are ROLLOVER_IN +1500 (balance_after 1500), CONTRIBUTION +30000 (balance_after 31500), FUNDING_REVERSAL -30000 (balance_after 1500)"
            - "the signed sum of the three ledger amounts equals available_balance_cents 1500"
            - "Employer.${er_id}.total_pretax_committed_cents == 0"
            - "Employer.${er_id}.program_status == ACTIVE"

      - name: media_supersede_and_reissue_conserve_entitled_media_units
        grounds:
          - calculations.media_unit_conservation
          - concurrency_rules.media-order-create-stale-election
          - state_machines.MediaOrder.UNDELIVERED_to_SUBMITTED
          - entities.MediaOrder.fields.superseded_media_order_id
          - entities.Election.fields.entitled_media_units
          - calculations.order_batch_invoice_total.input_set
        distinguishing_aspect: |
          A DIFFERENT CONSERVED QUANTITY - PHYSICAL MEDIA UNITS, a count rather than money. Two
          independent compensating cycles run against the same election: a supersede-create (order B
          replaces PENDING order A, which becomes CANCELLED) and an undelivered-then-reissue loop on
          order B. After both, the net non-CANCELLED unit count must still equal
          entitled_media_units 2 - the employee never ends up entitled to 4 passes or to 0 - and the
          sealed invoice must bill exactly one line because the CANCELLED row is excluded.
        test_recipe:
          setup:
            - "Employer 'Seattle Unit Conservation Co' is ACTIVE in US-WA-SEA (REGION_SURCHARGE_PCT 4.0) with transit_group_limit_cents 30000, pretax_ratio_cap_pct 100 and program_cap_cents 5000000."
            - "One TRANSIT_PASS category and one ACTIVE US-WA-SEA SMART_CARD_LOAD product at unit_price_cents 3000 / replacement_fee_cents 500 exist."
            - "One employee holds a TRANSIT_PASS BenefitAccount seeded with opening_rollover_cents 2000 so the replacement fee is payable."
            - "ElectionWindow 2026-08 [2026-07-01T00:00:00Z, 2026-08-20T00:00:00Z) is OPEN and stays OPEN (the election is never funded); the employee's PENDING election requests pretax 6000 with media_quantity 2, so entitled_media_units is 2."
            - "An OPEN OrderBatch for that window and US-WA-SEA exists, and MediaOrder A (quantity 2) has already been filed into it."
            - "The clock is at its 2026-08-01T00:00:00Z default, strictly before the cutoff."
          setup_api_calls:
            - call: "POST /benefits/employers"
              payload: { legal_name: "Seattle Unit Conservation Co", region_code: "US-WA-SEA", transit_group_limit_cents: 30000, parking_group_limit_cents: 30000, pretax_ratio_cap_pct: 100, program_cap_cents: 5000000 }
              as: ProgramAdmin
              captures: { er_id: $.data.id }
            - call: "POST /benefits/benefit-categories"
              payload: { employer_id: "${er_id}", category_type: "TRANSIT_PASS", monthly_exclusion_limit_cents: 30000 }
              as: ProgramAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /benefits/employers/${er_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/transit-media"
              payload: { sku: "SEA-UNIT", media_type: "SMART_CARD_LOAD", region_code: "US-WA-SEA", eligible_category_type: "TRANSIT_PASS", unit_price_cents: 3000, replacement_fee_cents: 500, requires_physical_fulfillment: true }
              as: OrderDesk
              as_user_id: "desk-catalog"
              captures: { med_id: $.data.id }
            - call: "POST /benefits/employees"
              payload: { employer_id: "${er_id}", external_ref: "SEA-UC-1", work_region_code: "US-WA-SEA", payroll_cycle: "MONTHLY", hire_date: "2026-02-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /benefits/benefit-accounts"
              payload: { employee_id: "${emp_id}", benefit_category_id: "${cat_id}", opening_rollover_cents: 2000 }
              as: ProgramAdmin
              captures: { acct_id: $.data.id, acct_v: $.data.version }
            - call: "POST /benefits/election-windows"
              payload: { employer_id: "${er_id}", benefit_month: "2026-08", opens_at: "2026-07-01T00:00:00Z", cutoff_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { win_id: $.data.id }
            - call: "POST /benefits/election-windows/${win_id}/open"
              payload: {}
              as: ProgramAdmin
            - call: "POST /benefits/elections"
              payload: { employee_id: "${emp_id}", election_window_id: "${win_id}", benefit_category_id: "${cat_id}", pretax_amount_cents: 6000, posttax_amount_cents: 0, transit_media_id: "${med_id}", media_quantity: 2, expected_account_version: "${acct_v}" }
              as: ProgramAdmin
              captures: { el_id: $.data.id, el_v1: $.data.version, el_units: $.data.entitled_media_units }
            - call: "POST /benefits/order-batches"
              payload: { election_window_id: "${win_id}", region_code: "US-WA-SEA" }
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { bat_id: $.data.id }
            - call: "POST /benefits/media-orders"
              payload: { election_id: "${el_id}", transit_media_id: "${med_id}", order_batch_id: "${bat_id}", quantity: 2, coverage_start_at: "2026-08-01T00:00:00Z", coverage_end_at: "2026-08-31T00:00:00Z", expected_election_version: "${el_v1}" }
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { mo_a_id: $.data.id, mo_a_status: $.data.status }
            - call: "GET /benefits/elections/${el_id}"
              payload: {}
              as: ProgramAdmin
              captures: { el_v2: $.data.version }
          trigger:
            - call: "POST /benefits/media-orders"
              payload: { election_id: "${el_id}", transit_media_id: "${med_id}", order_batch_id: "${bat_id}", quantity: 2, coverage_start_at: "2026-08-01T00:00:00Z", coverage_end_at: "2026-08-31T00:00:00Z", expected_election_version: "${el_v2}" }
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { mo_b_id: $.data.id, mo_b_superseded: $.data.superseded_media_order_id }
            - call: "POST /benefits/order-batches/${bat_id}/seal"
              payload: {}
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { sealed_lines: $.data.line_count, sealed_total: $.data.total_cents }
            - call: "POST /benefits/order-batches/${bat_id}/release"
              payload: {}
              as: OrderDesk
              as_user_id: "desk-releaser"
            - call: "POST /benefits/media-orders/${mo_b_id}/ship"
              payload: { tracking_ref: "TRK-SEA-UC-1" }
              as: OrderDesk
              as_user_id: "desk-sealer"
            - call: "POST /benefits/media-orders/${mo_b_id}/report-undelivered"
              payload: { reason: "NEVER_ARRIVED" }
              as: OrderDesk
              as_user_id: "desk-sealer"
            - call: "POST /benefits/media-orders/${mo_b_id}/reissue"
              payload: { waive_replacement_fee: false }
              as: OrderDesk
              as_user_id: "desk-sealer"
              captures: { reissued_status: $.data.status, reissued_qty: $.data.quantity, reissued_count: $.data.replacement_count }
          assert:
            - "${el_units} == 2"
            - "${mo_a_status} == PENDING"
            - "${mo_b_superseded} == ${mo_a_id}"
            - "MediaOrder.${mo_a_id}.status == CANCELLED"
            - "${sealed_lines} == 1"
            - "${sealed_total} == 6240"
            - "the CANCELLED superseded line was excluded from the invoice, so the subtotal is 6000 gross plus a 240-cent 4.0% surcharge, not 12480"
            - "${reissued_status} == SUBMITTED"
            - "${reissued_qty} == 2"
            - "${reissued_count} == 1"
            - "the net non-CANCELLED media unit count for election ${el_id} is 2, exactly equal to entitled_media_units, after BOTH the supersede-cancel and the undelivered-then-reissue cycle"
            - "MediaOrder.${mo_b_id}.replacement_fee_charged_cents == 500"
            - "MediaOrder.${mo_b_id}.tracking_ref == null"
            - "BenefitAccount.${acct_id}.fee_charged_cents == 500"
            - "BenefitAccount.${acct_id}.available_balance_cents == 1500"
            - "BenefitAccount.${acct_id}.ledger_entry_count == 2"
            - "Election.${el_id}.fulfillment_status == ORDERED"
            - "Election.${el_id}.funding_status == PENDING"
