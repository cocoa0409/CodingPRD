      - name: onsite_escort_band_sets_case_escort_required_and_gates_in_home_scheduling
        claim_type: correct_result
        grounds:
          - calculations.home_visit_risk_score
          - entities.HomeboundCase.fields.escort_required
          - errors[ERR_ESCORT_REQUIRED_NOT_CONFIRMED]
        distinguishing_aspect: |
          Hazards NO_SECONDARY_EXIT (15) + UNLIT_ACCESS (5) with escort_available false score exactly
          20 under the ONSITE_VERIFIED variant, which lands in the CLEARED_WITH_ESCORT band
          (15 <= 20 < 35) and flips case.escort_required to true — after which an IN_HOME session
          scheduled without escort_confirmed is rejected with ERR_ESCORT_REQUIRED_NOT_CONFIRMED and
          the identical call with escort_confirmed true is accepted.
        test_recipe:
          setup:
            - "PUBLISHED MIDDLE/IN_HOME rule; ENROLLED grade-7 student; CLEARED home-visit-eligible teacher."
            - "Case ELIGIBLE with weekly_entitled_minutes 390 and a FINALIZED safety review scoring 20 (CLEARED_WITH_ESCORT)."
