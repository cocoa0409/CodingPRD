        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-create-stale-loan]
          - entities.Loan.fields.version
        distinguishing_aspect: "POST /v1/repayment-plans with expected_loan_version matching loan.version succeeds and the loan.version increments by 1."
