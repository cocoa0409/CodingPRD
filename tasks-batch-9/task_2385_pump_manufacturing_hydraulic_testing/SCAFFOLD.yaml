endpoints:
  # ---------- logical clock (test-driving namespace) ----------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time. Every window, warranty-period and support-window rule reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["moves the logical clock; no entity is mutated"]
  - method: GET
    path: "/_clock"
    description: "Reads the current logical clock value."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: "{ current_utc: datetime }"
    side_effects: []

  # ---------- Foundry ----------
  - method: POST
    path: "/foundries"
    description: "Registers a foundry partner."
    roles: [PlatformAdmin]
    code: 201
    input: [foundry_code, name, approved_alloys, concurrent_pour_capacity]
    output: Foundry
    side_effects: ["creates Foundry with status ACTIVE and version 1"]
  - method: GET
    path: "/foundries"
    description: "Lists foundries."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Foundry[]
    side_effects: []
  - method: GET
    path: "/foundries/{id}"
    description: "Reads one foundry."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: Foundry
    side_effects: []
  - method: POST
    path: "/foundries/{id}/suspend"
    description: "Suspends a foundry so it may no longer pour new lots."
    roles: [PlatformAdmin]
    code: 200
    input: [suspension_reason]
    output: Foundry
    side_effects: ["Foundry ACTIVE -> SUSPENDED", "increments Foundry.version by 1"]

  # ---------- PumpModel ----------
  - method: POST
    path: "/pump-models"
    description: "Registers a hydraulic model with its full-diameter curve reference points."
    roles: [PlatformAdmin]
    code: 201
    input: [model_code, generation, interchange_group, max_impeller_diameter_mm, min_impeller_diameter_mm, shutoff_head_m, bep_flow_m3h, bep_head_m, bep_efficiency_pct, npshr_at_bep_m, rated_speed_rpm, max_flow_m3h, rotor_mass_kg, balance_grade]
    output: PumpModel
    side_effects: ["creates PumpModel with status ORDERABLE, all three warranty counters 0 and version 1"]
  - method: GET
    path: "/pump-models"
    description: "Lists hydraulic models. Filtering by superseded_by_model_id resolves the self-referential successor link in reverse."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["interchange_group?", "superseded_by_model_id?", "status?", "limit?", "offset?"]
    output: PumpModel[]
    side_effects: []
  - method: GET
    path: "/pump-models/{id}"
    description: "Reads one hydraulic model."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: PumpModel
    side_effects: []
  - method: POST
    path: "/pump-models/{id}/supersede"
    description: "Marks a model as superseded by a successor generation."
    roles: [PlatformAdmin]
    code: 200
    input: [superseded_by_model_id]
    output: PumpModel
    side_effects: ["PumpModel ORDERABLE|PATTERN_CONSTRAINED -> SUPERSEDED", "sets superseded_by_model_id", "increments PumpModel.version by 1"]

  # ---------- PatternAsset ----------
  - method: POST
    path: "/pattern-assets"
    description: "Registers casting tooling held at a foundry for one model."
    roles: [PlatformAdmin]
    code: 201
    input: [pump_model_id, foundry_id, pattern_code, wear_threshold]
    output: PatternAsset
    side_effects: ["creates PatternAsset with status QUALIFIED, all wear counters 0 and version 1"]
  - method: GET
    path: "/pattern-assets"
    description: "Lists patterns; filterable by owning model and holding foundry."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["pump_model_id?", "foundry_id?", "status?", "limit?", "offset?"]
    output: PatternAsset[]
    side_effects: []
  - method: GET
    path: "/pattern-assets/{id}"
    description: "Reads one pattern including its reconciled wear_index."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: PatternAsset
    side_effects: []
  - method: POST
    path: "/pattern-assets/{id}/refurbishment-start"
    description: "Withdraws a worn pattern for refurbishment."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PatternAsset
    side_effects: ["PatternAsset WORN -> IN_REFURB", "increments PatternAsset.version by 1"]
  - method: POST
    path: "/pattern-assets/{id}/refurbishment-complete"
    description: "Returns a refurbished pattern to service and restarts its wear curve."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PatternAsset
    side_effects: ["PatternAsset IN_REFURB -> QUALIFIED", "resets pours_since_refurb, defect_pours_since_refurb and wear_index to 0", "increments refurb_cycles by 1", "may drive PumpModel PATTERN_CONSTRAINED -> ORDERABLE", "increments PatternAsset.version by 1"]
  - method: POST
    path: "/pattern-assets/{id}/retire"
    description: "Retires tooling permanently."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: PatternAsset
    side_effects: ["PatternAsset QUALIFIED|WORN -> RETIRED", "may drive PumpModel ORDERABLE -> PATTERN_CONSTRAINED", "increments PatternAsset.version by 1"]

  # ---------- MaterialSealConfig ----------
  - method: POST
    path: "/material-seal-configs"
    description: "Releases a material and seal configuration for a model."
    roles: [PlatformAdmin]
    code: 201
    input: [pump_model_id, config_code, casing_material, impeller_material, seal_type, flush_plan, service_class, max_solids_pct, max_viscosity_cst, max_chloride_ppm, max_temp_c, min_running_clearance_mm]
    output: MaterialSealConfig
    side_effects: ["creates MaterialSealConfig (immutable; id and created_at only)"]
  - method: GET
    path: "/material-seal-configs"
    description: "Lists material and seal configurations; filterable by owning model."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["pump_model_id?", "service_class?", "limit?", "offset?"]
    output: MaterialSealConfig[]
    side_effects: []
  - method: GET
    path: "/material-seal-configs/{id}"
    description: "Reads one material and seal configuration."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: MaterialSealConfig
    side_effects: []

  # ---------- DutyApplication ----------
  - method: POST
    path: "/duty-applications"
    description: "Opens a customer enquiry carrying the guaranteed duty point and acceptance grade."
    roles: [ApplicationEngineer]
    code: 201
    input: [application_code, customer_name, duty_flow_m3h, duty_head_m, npsha_available_m, specific_gravity, viscosity_cst, solids_pct, chloride_ppm, process_temp_c, min_efficiency_pct, test_grade, witness_required, service_class_required]
    output: DutyApplication
    side_effects: ["creates DutyApplication with status OPEN and version 1"]
  - method: GET
    path: "/duty-applications"
    description: "Lists enquiries."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: DutyApplication[]
    side_effects: []
  - method: GET
    path: "/duty-applications/{id}"
    description: "Reads one enquiry; the version field is the OCC token for POST /selections."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: DutyApplication
    side_effects: []

  # ---------- Selection ----------
  - method: POST
    path: "/selections"
    description: "Sizes a pump for an enquiry: trims the impeller, predicts head, efficiency, power and NPSH, and gates the result against the envelope, the service limits and the efficiency target."
    roles: [ApplicationEngineer]
    code: 201
    input: [duty_application_id, pump_model_id, material_seal_config_id, expected_duty_application_version]
    output: Selection
    side_effects: ["runs calculations.impeller_trim_and_head_prediction, calculations.predicted_efficiency and calculations.npsh_certification_margin", "creates Selection with status DRAFT and version 1", "increments DutyApplication.version by 1"]
  - method: GET
    path: "/selections"
    description: "Lists selections; filterable by enquiry, model and configuration."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["duty_application_id?", "pump_model_id?", "material_seal_config_id?", "status?", "limit?", "offset?"]
    output: Selection[]
    side_effects: []
  - method: GET
    path: "/selections/{id}"
    description: "Reads one selection with every computed hydraulic value."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: Selection
    side_effects: []
  - method: POST
    path: "/selections/{id}/propose"
    description: "Submits a selection for hydraulic approval; also re-submits a selection returned for review."
    roles: [ApplicationEngineer]
    code: 200
    input: []
    output: Selection
    side_effects: ["Selection DRAFT|UNDER_REVIEW -> PROPOSED", "sets proposed_by_user_id to X-User-ID", "increments Selection.version by 1"]
  - method: POST
    path: "/selections/{id}/revise"
    description: "Pulls a proposed selection back to draft and discards the proposer identity."
    roles: [ApplicationEngineer]
    code: 200
    input: []
    output: Selection
    side_effects: ["Selection PROPOSED -> DRAFT", "clears proposed_by_user_id", "increments Selection.version by 1"]
  - method: POST
    path: "/selections/{id}/approve"
    description: "Approves a selection. Enforces segregation of duties against the proposer, requires a QUALIFIED pattern for the model and requires the certified NPSH margin to reach MIN_NPSH_MARGIN_M."
    roles: [HydraulicApprover]
    code: 200
    input: []
    output: Selection
    side_effects: ["Selection PROPOSED -> APPROVED", "sets approved_by_user_id to X-User-ID", "drives DutyApplication OPEN -> SELECTION_LOCKED", "increments Selection.version by 1"]
  - method: POST
    path: "/selections/{id}/supersede"
    description: "Retires an approved selection and returns the enquiry to OPEN so a replacement can be sized."
    roles: [ApplicationEngineer]
    code: 200
    input: []
    output: Selection
    side_effects: ["Selection APPROVED -> SUPERSEDED", "drives DutyApplication SELECTION_LOCKED -> OPEN", "increments Selection.version by 1"]

  # ---------- CastingLot ----------
  - method: POST
    path: "/casting-lots"
    description: "Records a pour against a pattern at a foundry. Enforces the pattern's closed-interval exclusivity and the foundry's half-open aggregate pour capacity, and advances the pattern wear index."
    roles: [FoundryPartner]
    code: 201
    input: [pattern_asset_id, foundry_id, heat_number, alloy_code, qty_poured, pour_window_start, pour_window_end]
    output: CastingLot
    side_effects: ["creates CastingLot with status POURED, qty_accepted == qty_poured and version 1", "runs calculations.pattern_wear_index and increments PatternAsset.pours_since_refurb", "may drive PatternAsset QUALIFIED -> WORN and then PumpModel ORDERABLE -> PATTERN_CONSTRAINED (cascade C)", "increments PatternAsset.version by 1"]
  - method: GET
    path: "/casting-lots"
    description: "Lists casting lots; filterable by pattern and foundry."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["pattern_asset_id?", "foundry_id?", "status?", "limit?", "offset?"]
    output: CastingLot[]
    side_effects: []
  - method: GET
    path: "/casting-lots/{id}"
    description: "Reads one lot including the reconciled piece ledger."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: CastingLot
    side_effects: []
  - method: POST
    path: "/casting-lots/{id}/inspect"
    description: "Records first-article or post-rework inspection of a lot."
    roles: [QualityInspector]
    code: 200
    input: []
    output: CastingLot
    side_effects: ["CastingLot POURED|REWORK -> INSPECTED", "increments CastingLot.version by 1"]
  - method: POST
    path: "/casting-lots/{id}/accept"
    description: "Accepts an inspected lot for production use."
    roles: [QualityInspector]
    code: 200
    input: []
    output: CastingLot
    side_effects: ["CastingLot INSPECTED -> ACCEPTED", "increments CastingLot.version by 1"]
  - method: POST
    path: "/casting-lots/{id}/rework-start"
    description: "Sends a quarantined lot to weld rework."
    roles: [QualityInspector]
    code: 200
    input: []
    output: CastingLot
    side_effects: ["CastingLot QUARANTINED -> REWORK", "increments CastingLot.version by 1"]
  - method: POST
    path: "/casting-lots/{id}/scrap-lot"
    description: "Writes off a quarantined lot in full."
    roles: [QualityInspector]
    code: 200
    input: []
    output: CastingLot
    side_effects: ["CastingLot QUARANTINED -> SCRAPPED", "sets qty_scrapped to qty_poured, qty_rework_pending to 0 and qty_accepted to 0", "increments CastingLot.version by 1"]
  - method: POST
    path: "/casting-lots/{id}/defects"
    description: "Reports a casting defect against a lot. A CRITICAL defect also advances the pattern wear index."
    roles: [FoundryPartner, QualityInspector]
    code: 201
    input: [defect_code, defect_type, severity, affected_qty]
    output: CastingDefect
    side_effects: ["creates CastingDefect with status REPORTED, reported_by_user_id from X-User-ID and version 1", "on the first CRITICAL defect for the lot, increments PatternAsset.defect_pours_since_refurb, recomputes wear_index and may drive PatternAsset QUALIFIED -> WORN", "leaves the CastingLot piece ledger unchanged until disposition"]
  - method: GET
    path: "/casting-defects"
    description: "Lists casting defects; filterable by lot."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["casting_lot_id?", "status?", "limit?", "offset?"]
    output: CastingDefect[]
    side_effects: []
  - method: GET
    path: "/casting-defects/{id}"
    description: "Reads one casting defect."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: CastingDefect
    side_effects: []
  - method: POST
    path: "/casting-defects/{id}/disposition"
    description: "Applies an engineering disposition to a reported defect. SCRAP and REPAIR_WELD move the lot's piece ledger and can start cascade A; USE_AS_IS requires a different inspector from the reporter."
    roles: [QualityInspector]
    code: 200
    input: [disposition]
    output: CastingDefect
    side_effects: ["CastingDefect REPORTED -> DISPOSITIONED_USE_AS_IS|DISPOSITIONED_REPAIR|DISPOSITIONED_SCRAP", "sets dispositioned_by_user_id from X-User-ID", "runs calculations.casting_yield_ledger on the parent lot for SCRAP and REPAIR_WELD", "may drive CastingLot -> QUARANTINED, then the newest bound BuildOrder -> CASTING_SHORT, then its PumpPackage -> HELD, then its RESERVED KitAllocations -> RELEASED (cascade A)", "increments CastingDefect.version by 1"]
  - method: POST
    path: "/casting-defects/{id}/revise-disposition"
    description: "Revises a SCRAP disposition to REPAIR_WELD, moving the affected pieces from the scrap column to the rework column."
    roles: [QualityInspector]
    code: 200
    input: [disposition]
    output: CastingDefect
    side_effects: ["CastingDefect DISPOSITIONED_SCRAP -> DISPOSITIONED_REPAIR", "runs calculations.casting_yield_ledger on the parent lot", "increments CastingLot.version by 1", "increments CastingDefect.version by 1"]
  - method: POST
    path: "/casting-defects/{id}/repair-verified"
    description: "Signs off a completed weld repair, returning the affected pieces to the accepted column."
    roles: [QualityInspector]
    code: 200
    input: []
    output: CastingDefect
    side_effects: ["CastingDefect DISPOSITIONED_REPAIR -> REPAIR_VERIFIED", "runs calculations.casting_yield_ledger on the parent lot", "may drive CastingLot QUARANTINED -> ACCEPTED", "increments CastingLot.version by 1", "increments CastingDefect.version by 1"]

  # ---------- BuildOrder ----------
  - method: POST
    path: "/build-orders"
    description: "Opens a manufacturing order against an approved selection and an accepted casting lot."
    roles: [ProductionPlanner]
    code: 201
    input: [selection_id, casting_lot_id, serial_number]
    output: BuildOrder
    side_effects: ["creates BuildOrder with status PLANNED, rework_cycles 0 and version 1", "increments CastingLot.committed_build_count by 1", "increments CastingLot.version by 1", "drives DutyApplication SELECTION_LOCKED -> CONTRACTED"]
  - method: GET
    path: "/build-orders"
    description: "Lists manufacturing orders; filterable by selection and casting lot."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["selection_id?", "casting_lot_id?", "status?", "limit?", "offset?"]
    output: BuildOrder[]
    side_effects: []
  - method: GET
    path: "/build-orders/{id}"
    description: "Reads one manufacturing order including the recorded assembly measurements."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: BuildOrder
    side_effects: []
  - method: POST
    path: "/build-orders/{id}/assembly"
    description: "Records machining and assembly results: running clearance, residual unbalance and the seal flush plan actually piped."
    roles: [ProductionPlanner]
    code: 200
    input: [running_clearance_mm, residual_unbalance_g_mm, seal_flush_plan_installed]
    output: BuildOrder
    side_effects: ["runs calculations.balance_allowance and stores allowable_unbalance_g_mm", "BuildOrder PLANNED -> ASSEMBLED", "increments BuildOrder.version by 1"]
  - method: POST
    path: "/build-orders/{id}/rework-complete"
    description: "Signs off a rework loop after a failed performance test."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: BuildOrder
    side_effects: ["BuildOrder REWORK_REQUIRED -> ASSEMBLED", "increments rework_cycles by 1", "increments BuildOrder.version by 1"]
  - method: POST
    path: "/build-orders/{id}/reassign-lot"
    description: "Re-binds a casting-short order to a different accepted lot and clears the recorded assembly measurements."
    roles: [ProductionPlanner]
    code: 200
    input: [casting_lot_id]
    output: BuildOrder
    side_effects: ["BuildOrder CASTING_SHORT -> PLANNED", "sets casting_lot_id and increments the new lot's committed_build_count by 1", "clears running_clearance_mm, residual_unbalance_g_mm, seal_flush_plan_installed and allowable_unbalance_g_mm", "increments BuildOrder.version by 1"]
  - method: POST
    path: "/build-orders/{id}/kit-allocations/auto"
    description: "Reserves a repair kit chosen by the interchange selector (eligibility filter, three-level ranking, created_at ASC tie-break, ERR_NO_INTERCHANGEABLE_KIT on an empty pool). No OCC token is taken because the client does not name the kit."
    roles: [ProductionPlanner]
    code: 201
    input: [requested_qty]
    output: KitAllocation
    side_effects: ["runs calculations.kit_interchange_resolution then calculations.kit_allocation_charge", "creates KitAllocation with status RESERVED, selected_by SELECTOR and version 1", "moves requested_qty from RepairKit.qty_on_hand to RepairKit.qty_reserved", "increments RepairKit.version by 1"]

  # ---------- TestRun / TestPoint ----------
  - method: POST
    path: "/test-runs"
    description: "Opens a performance test against an assembled unit at a chosen test speed and correction basis."
    roles: [TestEngineer]
    code: 201
    input: [build_order_id, test_speed_rpm, correction_basis, test_grade, witness_required]
    output: TestRun
    side_effects: ["creates TestRun with run_state OPEN, hydraulic_status NOT_EVALUATED, npsh_status NOT_VERIFIED and version 1"]
  - method: GET
    path: "/test-runs"
    description: "Lists performance tests; filterable by build order."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["build_order_id?", "run_state?", "hydraulic_status?", "npsh_status?", "limit?", "offset?"]
    output: TestRun[]
    side_effects: []
  - method: GET
    path: "/test-runs/{id}"
    description: "Reads one performance test with all three state dimensions and the reported guarantee-point values."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: TestRun
    side_effects: []
  - method: POST
    path: "/test-runs/{id}/points"
    description: "Appends one measured point to an open test run."
    roles: [TestEngineer]
    code: 201
    input: ["measured_flow_m3h", "measured_head_m", "measured_power_kw", "measured_npsh3_m?", "is_npsh_point?"]
    output: TestPoint
    side_effects: ["creates an immutable TestPoint (id and created_at only)"]
  - method: GET
    path: "/test-points"
    description: "Lists measured points; filterable by test run."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["test_run_id?", "limit?", "offset?"]
    output: TestPoint[]
    side_effects: []
  - method: GET
    path: "/test-points/{id}"
    description: "Reads one measured point."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: TestPoint
    side_effects: []
  - method: POST
    path: "/test-runs/{id}/lock"
    description: "Freezes the measured point set; enforces the grade's minimum point count and the single designated NPSH point."
    roles: [TestEngineer]
    code: 200
    input: []
    output: TestRun
    side_effects: ["TestRun run_state OPEN -> POINTS_LOCKED", "increments TestRun.version by 1"]
  - method: POST
    path: "/test-runs/{id}/evaluate"
    description: "Builds the reported curve from the measured points under the run's correction basis, interpolates the guarantee point and sets hydraulic_status and npsh_status independently."
    roles: [TestEngineer]
    code: 200
    input: []
    output: TestRun
    side_effects: ["TestRun run_state POINTS_LOCKED -> EVALUATED", "runs calculations.certified_test_curve and stores speed_ratio, head_at_guarantee_m, power_at_guarantee_kw, efficiency_at_guarantee_pct, head_deviation_pct, efficiency_deviation_pct and npshr_tested_m", "sets hydraulic_status and npsh_status", "when hydraulic_status becomes OUT_OF_TOLERANCE, drives BuildOrder -> REWORK_REQUIRED, then Selection APPROVED -> UNDER_REVIEW, then DutyApplication CONTRACTED -> OPEN (cascade B)", "increments TestRun.version by 1"]
  - method: POST
    path: "/test-runs/{id}/certify"
    description: "Issues the certified test curve. Requires both the hydraulic and the NPSH dimension to have passed."
    roles: [TestEngineer]
    code: 200
    input: []
    output: TestRun
    side_effects: ["TestRun run_state EVALUATED -> CERTIFIED", "drives BuildOrder ASSEMBLED -> TESTED", "increments TestRun.version by 1"]
  - method: POST
    path: "/test-runs/{id}/reopen"
    description: "Reopens an evaluated run for additional points, clearing both result dimensions and every reported value."
    roles: [TestEngineer]
    code: 200
    input: []
    output: TestRun
    side_effects: ["TestRun run_state EVALUATED -> OPEN", "resets hydraulic_status to NOT_EVALUATED and npsh_status to NOT_VERIFIED", "clears every reported guarantee-point field to null", "increments TestRun.version by 1"]

  # ---------- PumpPackage ----------
  - method: POST
    path: "/pump-packages"
    description: "Engineers a package around a tested unit: baseplate, motor and controls. The motor rating is gated against the guarantee-basis power requirement."
    roles: [ProductionPlanner]
    code: 201
    input: [build_order_id, test_run_id, baseplate_code, motor_kw, motor_frame, control_type, promised_ship_date]
    output: PumpPackage
    side_effects: ["runs calculations.pump_package_motor_requirement and stores min_motor_kw", "creates PumpPackage with status CONFIGURED, guarantee_basis null, application_error_flagged false and version 1"]
  - method: GET
    path: "/pump-packages"
    description: "Lists packages; filterable by build order and test run."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["build_order_id?", "test_run_id?", "status?", "limit?", "offset?"]
    output: PumpPackage[]
    side_effects: []
  - method: GET
    path: "/pump-packages/{id}"
    description: "Reads one package including the guarantee basis fixed at release."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: PumpPackage
    side_effects: []
  - method: POST
    path: "/pump-packages/{id}/release"
    description: "Releases a package for shipment and fixes its warranty guarantee basis from the test run's witness flag."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: PumpPackage
    side_effects: ["PumpPackage CONFIGURED -> RELEASED", "sets guarantee_basis to CERTIFIED_CURVE when TestRun.witness_required is true, otherwise SELECTION", "increments PumpPackage.version by 1"]
  - method: POST
    path: "/pump-packages/{id}/ship"
    description: "Ships a released package and starts the warranty clock."
    roles: [ProductionPlanner]
    code: 200
    input: [actual_ship_date]
    output: PumpPackage
    side_effects: ["PumpPackage RELEASED -> SHIPPED", "stores actual_ship_date", "drives BuildOrder TESTED -> CLOSED and decrements CastingLot.committed_build_count by 1", "drives DutyApplication CONTRACTED -> CLOSED", "increments PumpPackage.version by 1"]
  - method: POST
    path: "/pump-packages/{id}/release-hold"
    description: "Lifts a casting-short hold once the build order has been re-bound to an accepted lot."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: PumpPackage
    side_effects: ["PumpPackage HELD -> CONFIGURED", "increments PumpPackage.version by 1"]

  # ---------- RepairKit ----------
  - method: POST
    path: "/repair-kits"
    description: "Catalogues a spare-parts repair kit with its generation coverage and support window."
    roles: [PlatformAdmin]
    code: 201
    input: [pump_model_id, kit_code, interchange_group, gen_min, gen_max, preferred_generation, substitution_penalty_pct, unit_price, support_window_start, support_window_end]
    output: RepairKit
    side_effects: ["creates RepairKit with status ACTIVE, every stock counter 0 and version 1"]
  - method: GET
    path: "/repair-kits"
    description: "Lists repair kits; filterable by owning model and interchange group."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["pump_model_id?", "interchange_group?", "status?", "limit?", "offset?"]
    output: RepairKit[]
    side_effects: []
  - method: GET
    path: "/repair-kits/{id}"
    description: "Reads one repair kit; the version field is the OCC token for POST /kit-allocations."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: RepairKit
    side_effects: []
  - method: POST
    path: "/repair-kits/{id}/receipts"
    description: "Receives units into kit stock."
    roles: [ProductionPlanner]
    code: 200
    input: [qty]
    output: RepairKit
    side_effects: ["adds qty to qty_on_hand and to qty_received_total", "increments RepairKit.version by 1"]
  - method: POST
    path: "/repair-kits/{id}/discontinue"
    description: "Withdraws a kit from the catalogue."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RepairKit
    side_effects: ["RepairKit ACTIVE -> DISCONTINUED", "increments RepairKit.version by 1"]

  # ---------- KitAllocation ----------
  - method: POST
    path: "/kit-allocations"
    description: "Reserves units of an explicitly named repair kit against a build order. Requires the kit's OCC token."
    roles: [ProductionPlanner]
    code: 201
    input: [repair_kit_id, build_order_id, requested_qty, expected_repair_kit_version]
    output: KitAllocation
    side_effects: ["runs calculations.kit_allocation_charge", "creates KitAllocation with status RESERVED, selected_by EXPLICIT and version 1", "moves requested_qty from RepairKit.qty_on_hand to RepairKit.qty_reserved", "increments RepairKit.version by 1"]
  - method: GET
    path: "/kit-allocations"
    description: "Lists kit allocations; filterable by kit and build order."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["repair_kit_id?", "build_order_id?", "status?", "limit?", "offset?"]
    output: KitAllocation[]
    side_effects: []
  - method: GET
    path: "/kit-allocations/{id}"
    description: "Reads one kit allocation with its priced charge breakdown."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: KitAllocation
    side_effects: []
  - method: POST
    path: "/kit-allocations/{id}/issue"
    description: "Issues reserved units to the shop floor."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: KitAllocation
    side_effects: ["KitAllocation RESERVED -> ISSUED", "moves requested_qty from RepairKit.qty_reserved to RepairKit.qty_issued", "increments RepairKit.version by 1", "increments KitAllocation.version by 1"]
  - method: POST
    path: "/kit-allocations/{id}/consume"
    description: "Books issued units as consumed."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: KitAllocation
    side_effects: ["KitAllocation ISSUED -> CONSUMED", "moves requested_qty from RepairKit.qty_issued to RepairKit.qty_consumed_total", "increments RepairKit.version by 1", "increments KitAllocation.version by 1"]
  - method: POST
    path: "/kit-allocations/{id}/release"
    description: "Releases a reservation and returns the units to stock."
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: KitAllocation
    side_effects: ["KitAllocation RESERVED -> RELEASED", "moves requested_qty from RepairKit.qty_reserved back to RepairKit.qty_on_hand", "increments RepairKit.version by 1", "increments KitAllocation.version by 1"]

  # ---------- WarrantyClaim ----------
  - method: POST
    path: "/warranty-claims"
    description: "Raises a field-performance warranty claim against a shipped package, stamping the warranty age at submission."
    roles: [ApplicationEngineer]
    code: 201
    input: [pump_package_id, as_found_flow_m3h, as_found_head_m, as_found_npsha_m, as_found_solids_pct, as_found_viscosity_cst, as_found_speed_rpm, claim_lines]
    output: WarrantyClaim
    side_effects: ["creates WarrantyClaim with status SUBMITTED, submitted_by_user_id from X-User-ID and version 1", "stores months_since_ship and coverage_factor from calculations.warranty_settlement_amount step 1"]
  - method: GET
    path: "/warranty-claims"
    description: "Lists warranty claims; filterable by package."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: ["pump_package_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Reads one warranty claim with its determination and settlement breakdown."
    roles: [PlatformAdmin, ApplicationEngineer, HydraulicApprover, FoundryPartner, QualityInspector, TestEngineer, ProductionPlanner, WarrantyAdjudicator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/begin-adjudication"
    description: "Takes a submitted claim into adjudication."
    roles: [WarrantyAdjudicator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim SUBMITTED -> UNDER_ADJUDICATION", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{id}/request-info"
    description: "Returns a claim to the field for more information."
    roles: [WarrantyAdjudicator]
    code: 200
    input: [info_request_note]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim UNDER_ADJUDICATION -> INFO_REQUESTED", "stores info_request_note", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{id}/resume-adjudication"
    description: "Resumes adjudication after the requested information arrives."
    roles: [WarrantyAdjudicator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim INFO_REQUESTED -> UNDER_ADJUDICATION", "clears info_request_note", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{id}/adjudicate"
    description: "Determines liability against the package's guarantee basis and forks to one of three outcomes with divergent side effects. Enforces segregation of duties against the submitter."
    roles: [WarrantyAdjudicator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["runs calculations.warranty_liability_determination and stores liability_basis, expected_head_m, head_shortfall_pct, application_error_flags and determination", "WarrantyClaim UNDER_ADJUDICATION -> ADJUDICATED_NO_DEFECT | ADJUDICATED_APPLICATION_ERROR | ADJUDICATED_MANUFACTURING", "on ADJUDICATED_APPLICATION_ERROR also sets PumpPackage.application_error_flagged to true and increments PumpPackage.version by 1", "increments exactly one of PumpModel.no_defect_count, PumpModel.application_error_count or PumpModel.warranty_defect_count and increments PumpModel.version by 1", "increments WarrantyClaim.version by 1"]
  - method: POST
    path: "/warranty-claims/{id}/settle"
    description: "Settles a manufacturing-defect claim, rounding each claim line before summation."
    roles: [WarrantyAdjudicator]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["runs calculations.warranty_settlement_amount and stores settlement_subtotal, admin_fee and settlement_total", "WarrantyClaim ADJUDICATED_MANUFACTURING -> SETTLED", "increments WarrantyClaim.version by 1"]

errors:
  - error_id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header is absent or empty on any endpoint."
  - error_id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is not listed in the target endpoint's roles."
  - error_id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required input field is missing, of the wrong type, an unknown enum member, a negative number where the field is non-negative, or a malformed ISO-8601 datetime."
  - error_id: ERR_NOT_FOUND
    http: 404
    condition: "The {id} path parameter does not identify an existing entity of the addressed collection."
  - error_id: ERR_REFERENCED_RESOURCE_NOT_FOUND
    http: 404
    condition: "A foreign-key field in the request body does not identify an existing parent entity."
  - error_id: ERR_FOUNDRY_SCOPE_VIOLATION
    http: 403
    condition: "A FoundryPartner acts on a CastingLot, PatternAsset or defect whose foundry_id is not the Foundry that backs the caller's identity."
  - error_id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The acting X-User-ID equals the identity that performed the incompatible prior step: the selection proposer on POST /selections/{id}/approve, or the defect reporter on a USE_AS_IS disposition."
  - error_id: ERR_ADJUDICATOR_CONFLICT
    http: 409
    condition: "The acting X-User-ID on POST /warranty-claims/{id}/adjudicate equals WarrantyClaim.submitted_by_user_id."
  - error_id: ERR_STALE_DUTY_APPLICATION_VERSION
    http: 412
    condition: "expected_duty_application_version on POST /selections does not equal the current DutyApplication.version."
  - error_id: ERR_STALE_REPAIR_KIT_VERSION
    http: 412
    condition: "expected_repair_kit_version on POST /kit-allocations does not equal the current RepairKit.version."
  - error_id: ERR_ZERO_QUANTITY
    http: 422
    condition: "A quantity that must be strictly positive is zero: requested_qty on either allocation endpoint, qty_poured on POST /casting-lots, affected_qty on POST /casting-lots/{id}/defects, or qty on POST /repair-kits/{id}/receipts."
  - error_id: ERR_DUPLICATE_CODE
    http: 409
    condition: "foundry_code, model_code, pattern_code, config_code, application_code, kit_code, heat_number, serial_number or a defect_code within its lot repeats an existing value."
  - error_id: ERR_AFFECTED_QTY_EXCEEDS_LEDGER
    http: 422
    condition: "affected_qty on POST /casting-lots/{id}/defects exceeds the lot's current qty_accepted."
  - error_id: ERR_DUTY_APPLICATION_NOT_OPEN
    http: 409
    condition: "POST /selections targets a DutyApplication whose status is not OPEN."
  - error_id: ERR_SELECTION_INVALID_STATE
    http: 409
    condition: "A selection action is attempted from a state that has no such transition."
  - error_id: ERR_CASTING_LOT_INVALID_STATE
    http: 409
    condition: "A casting-lot action is attempted from a state that has no such transition."
  - error_id: ERR_DEFECT_INVALID_STATE
    http: 409
    condition: "A defect action is attempted from a state that has no such transition."
  - error_id: ERR_BUILD_ORDER_INVALID_STATE
    http: 409
    condition: "A build-order action is attempted from a state that has no such transition."
  - error_id: ERR_TEST_RUN_INVALID_STATE
    http: 409
    condition: "A test-run action is attempted from a run_state that has no such transition, including appending points to a run that is not OPEN."
  - error_id: ERR_PACKAGE_INVALID_STATE
    http: 409
    condition: "A package action is attempted from a state that has no such transition."
  - error_id: ERR_ALLOCATION_INVALID_STATE
    http: 409
    condition: "A kit-allocation action is attempted from a state that has no such transition."
  - error_id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "A warranty-claim action is attempted from a state that has no such transition."
  - error_id: ERR_PATTERN_INVALID_STATE
    http: 409
    condition: "A pattern action is attempted from a state that has no such transition."
  - error_id: ERR_REPAIR_KIT_DISCONTINUED
    http: 409
    condition: "An allocation names or the selector would name a RepairKit whose status is DISCONTINUED."
  - error_id: ERR_FOUNDRY_SUSPENDED
    http: 409
    condition: "POST /casting-lots names a Foundry whose status is SUSPENDED."
  - error_id: ERR_MODEL_NOT_ORDERABLE
    http: 409
    condition: "POST /selections names a PumpModel whose status is PATTERN_CONSTRAINED or SUPERSEDED."
  - error_id: ERR_PATTERN_NOT_QUALIFIED
    http: 409
    condition: "POST /selections/{id}/approve finds no PatternAsset in status QUALIFIED for the selected PumpModel; or POST /casting-lots targets a pattern that is not QUALIFIED."
  - error_id: ERR_CASTING_LOT_NOT_ACCEPTED
    http: 409
    condition: "POST /build-orders or POST /build-orders/{id}/reassign-lot names a CastingLot whose status is not ACCEPTED."
  - error_id: ERR_TEST_RUN_NOT_CERTIFIED
    http: 409
    condition: "POST /pump-packages names a TestRun whose run_state is not CERTIFIED."
  - error_id: ERR_SELECTION_NOT_APPROVED
    http: 409
    condition: "POST /build-orders names a Selection whose status is not APPROVED."
  - error_id: ERR_BUILD_ORDER_NOT_ASSEMBLED
    http: 409
    condition: "POST /test-runs names a BuildOrder whose status is not ASSEMBLED."
  - error_id: ERR_BUILD_ORDER_NOT_TESTED
    http: 409
    condition: "POST /pump-packages names a BuildOrder whose status is not TESTED."
  - error_id: ERR_PACKAGE_NOT_SHIPPED
    http: 409
    condition: "POST /warranty-claims names a PumpPackage whose status is not SHIPPED."
  - error_id: ERR_CONFIG_MODEL_MISMATCH
    http: 422
    condition: "The MaterialSealConfig named on POST /selections belongs to a different PumpModel than the one named."
  - error_id: ERR_LOT_MODEL_MISMATCH
    http: 422
    condition: "The CastingLot named on a build order was poured from a PatternAsset whose pump_model_id differs from the selection's pump_model_id."
  - error_id: ERR_ALLOY_NOT_APPROVED
    http: 422
    condition: "alloy_code on POST /casting-lots is not a member of the target Foundry's approved_alloys."
  - error_id: ERR_TEST_RUN_BUILD_MISMATCH
    http: 422
    condition: "The TestRun named on POST /pump-packages does not belong to the BuildOrder named."
  - error_id: ERR_SUCCESSOR_MODEL_INVALID
    http: 422
    condition: "superseded_by_model_id names the model itself, or a model whose interchange_group differs, or a model whose generation is not greater."
  - error_id: ERR_KIT_GROUP_MISMATCH
    http: 422
    condition: "The named RepairKit's interchange_group differs from the interchange_group of the build order's PumpModel."
  - error_id: ERR_TEMPERATURE_LIMIT_EXCEEDED
    http: 422
    condition: "DutyApplication.process_temp_c exceeds MaterialSealConfig.max_temp_c."
  - error_id: ERR_CHLORIDE_LIMIT_EXCEEDED
    http: 422
    condition: "DutyApplication.chloride_ppm exceeds MaterialSealConfig.max_chloride_ppm."
  - error_id: ERR_SOLIDS_LIMIT_EXCEEDED
    http: 422
    condition: "DutyApplication.solids_pct exceeds MaterialSealConfig.max_solids_pct."
  - error_id: ERR_VISCOSITY_LIMIT_EXCEEDED
    http: 422
    condition: "DutyApplication.viscosity_cst exceeds MaterialSealConfig.max_viscosity_cst."
  - error_id: ERR_SERVICE_CLASS_MISMATCH
    http: 422
    condition: "DutyApplication.service_class_required differs from MaterialSealConfig.service_class."
  - error_id: ERR_DUTY_FLOW_ABOVE_MAX
    http: 422
    condition: "DutyApplication.duty_flow_m3h exceeds PumpModel.max_flow_m3h."
  - error_id: ERR_TRIM_BELOW_MINIMUM
    http: 422
    condition: "The rounded trimmed_impeller_diameter_mm is below PumpModel.min_impeller_diameter_mm."
  - error_id: ERR_DUTY_POINT_ABOVE_ENVELOPE
    http: 422
    condition: "The rounded trimmed_impeller_diameter_mm exceeds PumpModel.max_impeller_diameter_mm."
  - error_id: ERR_NPSH_MARGIN_INSUFFICIENT
    http: 409
    condition: "POST /selections/{id}/approve finds npsh_margin_m below MIN_NPSH_MARGIN_M."
  - error_id: ERR_UNBALANCE_EXCEEDS_ALLOWANCE
    http: 422
    condition: "residual_unbalance_g_mm exceeds the ISO 1940 allowable_unbalance_g_mm computed for the model."
  - error_id: ERR_CLEARANCE_OUT_OF_BAND
    http: 422
    condition: "running_clearance_mm falls outside [min_running_clearance_mm, min_running_clearance_mm + CLEARANCE_BAND_WIDTH_MM]."
  - error_id: ERR_FLUSH_PLAN_MISMATCH
    http: 422
    condition: "seal_flush_plan_installed differs from the selection's MaterialSealConfig.flush_plan."
  - error_id: ERR_INSUFFICIENT_TEST_POINTS
    http: 409
    condition: "POST /test-runs/{id}/lock finds fewer measured points than the test grade's min_points."
  - error_id: ERR_NPSH_TEST_POINT_MISSING
    http: 409
    condition: "POST /test-runs/{id}/lock finds no point with is_npsh_point true and a non-null measured_npsh3_m, or finds more than one."
  - error_id: ERR_GUARANTEE_FLOW_NOT_BRACKETED
    http: 409
    condition: "POST /test-runs/{id}/evaluate cannot bracket the guarantee flow between two reported curve points."
  - error_id: ERR_HYDRAULIC_OUT_OF_TOLERANCE
    http: 409
    condition: "POST /test-runs/{id}/certify finds hydraulic_status other than WITHIN_TOLERANCE."
  - error_id: ERR_NPSH_NOT_VERIFIED
    http: 409
    condition: "POST /test-runs/{id}/certify finds npsh_status other than VERIFIED."
  - error_id: ERR_PATTERN_WINDOW_CONFLICT
    http: 409
    condition: "A new pour window overlaps an existing non-terminal lot's window on the same pattern under CLOSED-interval semantics, so windows that merely touch at an endpoint conflict."
  - error_id: ERR_FOUNDRY_POUR_CAPACITY_EXCEEDED
    http: 409
    condition: "The count of non-terminal lots at the foundry whose windows overlap the new window under HALF-OPEN [start, end) semantics would exceed Foundry.concurrent_pour_capacity."
  - error_id: ERR_INVALID_WINDOW
    http: 422
    condition: "pour_window_end is not strictly after pour_window_start, or a support window ends on or before it starts."
  - error_id: ERR_REWORK_LIMIT_EXCEEDED
    http: 409
    condition: "POST /build-orders/{id}/rework-complete would push rework_cycles above MAX_REWORK_CYCLES."
  - error_id: ERR_KIT_GENERATION_NOT_COVERED
    http: 422
    condition: "The build order's PumpModel.generation falls outside the named kit's [gen_min, gen_max]."
  - error_id: ERR_KIT_SUPPORT_WINDOW_EXPIRED
    http: 422
    condition: "The logical clock is outside the named kit's [support_window_start, support_window_end)."
  - error_id: ERR_KIT_STOCK_INSUFFICIENT
    http: 409
    condition: "requested_qty exceeds RepairKit.qty_on_hand."
  - error_id: ERR_NO_INTERCHANGEABLE_KIT
    http: 422
    condition: "POST /build-orders/{id}/kit-allocations/auto finds an empty eligible candidate pool after the eligibility filter."
  - error_id: ERR_WARRANTY_EXPIRED
    http: 422
    condition: "months_since_ship at claim submission exceeds WARRANTY_MONTHS."
  - error_id: ERR_EMPTY_CLAIM_LINES
    http: 422
    condition: "claim_lines on POST /warranty-claims is an empty array."
  - error_id: ERR_OPEN_DEFECTS_PRESENT
    http: 409
    condition: "POST /casting-lots/{id}/accept finds at least one CastingDefect in status REPORTED or DISPOSITIONED_REPAIR on the lot."
  - error_id: ERR_NO_ACCEPTABLE_CASTINGS
    http: 409
    condition: "POST /casting-lots/{id}/accept finds qty_accepted of zero."
  - error_id: ERR_EFFICIENCY_TARGET_NOT_MET
    http: 422
    condition: "predicted_efficiency_pct is below DutyApplication.min_efficiency_pct."
  - error_id: ERR_MOTOR_UNDERSIZED
    http: 422
    condition: "motor_kw on POST /pump-packages is below the computed min_motor_kw."

roles:
  - name: PlatformAdmin
    identity: opaque
    description: "Master-data custodian: foundries, models, patterns, material and seal configurations, kit catalogue, and the logical clock."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /foundries and POST /foundries/{id}/suspend"
      - "POST /pump-models and POST /pump-models/{id}/supersede"
      - "POST /pattern-assets and all three pattern lifecycle actions"
      - "POST /material-seal-configs"
      - "POST /repair-kits and POST /repair-kits/{id}/discontinue"
    shared_operations:
      - "every GET endpoint"
  - name: ApplicationEngineer
    identity: opaque
    description: "Owns customer enquiries, hydraulic sizing and the raising of field claims."
    exclusive_operations:
      - "POST /duty-applications"
      - "POST /selections"
      - "POST /selections/{id}/propose, /revise and /supersede"
      - "POST /warranty-claims"
    shared_operations:
      - "every GET endpoint"
  - name: HydraulicApprover
    identity: opaque
    description: "Independent approver of hydraulic selections; may never be the proposer of the selection being approved."
    exclusive_operations:
      - "POST /selections/{id}/approve"
    shared_operations:
      - "every GET endpoint"
  - name: FoundryPartner
    identity: entity_backed:Foundry
    description: "External foundry; the X-User-ID resolves to exactly one Foundry and every write is scoped to that foundry's own patterns and lots."
    exclusive_operations:
      - "POST /casting-lots"
    shared_operations:
      - "POST /casting-lots/{id}/defects (shared with QualityInspector)"
      - "every GET endpoint"
  - name: QualityInspector
    identity: opaque
    description: "Inspects, accepts, quarantines and dispositions castings; a USE_AS_IS disposition requires a different inspector from the defect reporter."
    exclusive_operations:
      - "POST /casting-lots/{id}/inspect, /accept, /rework-start and /scrap-lot"
      - "POST /casting-defects/{id}/disposition, /revise-disposition and /repair-verified"
    shared_operations:
      - "POST /casting-lots/{id}/defects (shared with FoundryPartner)"
      - "every GET endpoint"
  - name: TestEngineer
    identity: opaque
    description: "Runs the performance test, locks the point set, evaluates both result dimensions and issues the certified curve."
    exclusive_operations:
      - "POST /test-runs and POST /test-runs/{id}/points"
      - "POST /test-runs/{id}/lock, /evaluate, /certify and /reopen"
    shared_operations:
      - "every GET endpoint"
  - name: ProductionPlanner
    identity: opaque
    description: "Plans builds, records assembly measurements, reserves and moves kit stock, and engineers and ships packages."
    exclusive_operations:
      - "POST /build-orders and POST /build-orders/{id}/assembly, /rework-complete, /reassign-lot and /kit-allocations/auto"
      - "POST /pump-packages and POST /pump-packages/{id}/release, /ship and /release-hold"
      - "POST /repair-kits/{id}/receipts"
      - "POST /kit-allocations and POST /kit-allocations/{id}/issue, /consume and /release"
    shared_operations:
      - "every GET endpoint"
  - name: WarrantyAdjudicator
    identity: opaque
    description: "Adjudicates and settles warranty claims; may never adjudicate a claim they submitted."
    exclusive_operations:
      - "POST /warranty-claims/{id}/begin-adjudication, /request-info, /resume-adjudication, /adjudicate and /settle"
    shared_operations:
      - "every GET endpoint"
