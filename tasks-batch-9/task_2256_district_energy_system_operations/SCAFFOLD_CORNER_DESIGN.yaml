      - name: isolation_clearance_rule_applies_only_to_work_orders_that_request_isolation
        claim_type: Conditional validation
        grounds:
          - validations[priority 12 ERR_ISOLATION_CLEARANCE_DENIED]
          - state_machines.WorkOrder.SCHEDULED_to_EXCAVATING
          - state_machines.NetworkLoop.NORMAL_to_ISOLATED
          - state_machines.DispatchPlan.COMMITTED_to_DRAFT
        distinguishing_aspect: "The clearance rule is gated on the work order's own requires_isolation flag, so with one COMMITTED plan on LOOP-W the non-isolating order on SEG-W1 excavates normally while the isolating order on SEG-W2 is refused; decommitting the plan clears the guard and the same call then succeeds and drives the loop to ISOLATED with open_isolation_count 1."
