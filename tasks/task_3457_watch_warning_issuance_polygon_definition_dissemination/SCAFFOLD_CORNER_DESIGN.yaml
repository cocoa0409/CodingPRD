      - name: criteria_reevaluated_at_issue_from_current_storm_readings
        claim_type: Input Set Filtering
        grounds: [calculations.issuance_criteria_evaluation, state_machines.StormEvent.DETECTED_to_TRACKING]
        distinguishing_aspect: "Issuance criteria read the storm's CURRENT readings at issue time, not creation time: a draft created against 50 mph fails issuance, and only after a PUT lifts the storm to 60 mph (flipping DETECTED -> TRACKING) does the same draft issue."
