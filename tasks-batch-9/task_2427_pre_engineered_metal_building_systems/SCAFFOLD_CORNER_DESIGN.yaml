            - "within the tied ANCHORAGE stage ${l_anch1_id} precedes ${l_anch2_id} because created_at is the only tie-break and id is never used"
            - "${next_before} == ANCHORAGE, planned_load_count == 4, dispatched_load_count == 0 and ${blocked_before} == 3"
            - "the dispatch of ${l_anch1_id} succeeds with 200 because ANCHORAGE has no LOT_TYPE_FOR_STAGE mapping and no earlier-stage PLANNED load exists"
            - "${seq_after} == ANCHORAGE>ANCHORAGE>PRIMARY_FRAME>SECONDARY_FRAME — DISPATCHED loads stay in the projection"
            - "${next_after} == ANCHORAGE because ${l_anch2_id} is still PLANNED at stage_sequence 1"
            - "planned_load_count == 3, dispatched_load_count == 1 and ${blocked_after} == 2"
            - "ShipmentLoad.${l_anch1_id}.stage_sequence == 1 and ShipmentLoad.${l_sec_id}.stage_sequence == 3"

      - name: governing_load_combination_result_is_correct_for_the_reference_loads
        claim_type: correct_result
        grounds:
          - calculations.design_load_combination_and_required_moment
        excluded_because:
          difficulty_instance: asd_vs_lrfd_governing_combination_on_engineering_design
          rationale: "That §1.8 instance already pins every candidate pressure, the winning combination name, tributary_load_kip_per_ft at 6 decimals and required_moment_kip_ft for both variants against the same three configuration loads, which is the whole of the correct-result claim for this calculation."

      - name: pinned_rounding_precision_in_the_weight_rollup
        claim_type: precision
        grounds:
          - calculations.design_weight_rollup.precision
        excluded_because:
          difficulty_instance: pinned_per_line_rounding_order_in_design_weight_rollup
          rationale: "The §1.8 instance is exactly the precision claim: round the unit weight, multiply by quantity, round the line, then sum — asserting 46854.48 and explicitly excluding the round-once rival 46854.22."

      - name: line_window_interval_merge_semantics
        claim_type: interval_merge
        grounds:
          - calculations.production_line_window_conflict
        excluded_because:
          difficulty_instance: production_line_half_open_window_with_paint_changeover_buffer
          rationale: "That §1.8 instance already covers the half-open [start, end) semantics, the exact-touch acceptance for a same-colour lot and the colour-dependent 120-minute buffer widening on both sides."

      - name: volume_tier_selection_over_the_discount_base
        claim_type: tiered_pricing
        grounds:
          - calculations.quote_price_pipeline.constants.VOLUME_TIER_1_CENTS
        excluded_because:
          difficulty_instance: freight_inclusive_volume_tier_pinned_evaluation_order
          rationale: "The §1.8 instance drives the tier ladder at the 25,000,000 boundary with pre_discount_total_cents landing exactly on the threshold, which subsumes any milder tiered-pricing corner."

      - name: asd_and_lrfd_variants_diverge_on_the_same_inputs
        claim_type: variant_divergence
        grounds:
          - calculations.design_load_combination_and_required_moment.variants
        excluded_because:
          difficulty_instance: asd_vs_lrfd_governing_combination_on_engineering_design
          rationale: "Divergence is the point of that §1.8 instance: 1010.94 kip-ft under ASD against 1695.00 kip-ft under LRFD from one identical configuration."

      - name: pricing_variant_is_selected_by_the_calling_endpoint
        claim_type: variant_selection
        grounds:
          - calculations.quote_price_pipeline.variants
        excluded_because:
          difficulty_instance: preliminary_vs_final_price_variant_on_order_release
          rationale: "That §1.8 instance already shows POST /quotes selecting PRELIMINARY on the configuration estimate and POST /orders/{id}/release-to-fabrication selecting FINAL on the design's frame weight, with no client-supplied variant flag anywhere."

      - name: final_price_reconciles_against_the_quoted_price
        claim_type: reconciliation
        grounds:
          - entities.Order.fields.price_delta_cents
          - calculations.builder_credit_ledger
        excluded_because:
          difficulty_instance: preliminary_vs_final_price_variant_on_order_release
          rationale: "The reconciliation step is asserted there: final 9458205 against quoted 9719236 gives price_delta_cents -261031, which is precisely the amount credit_used_cents moves at release."

      - name: production_status_projection_evaluates_branches_in_order
        claim_type: projection
        grounds:
          - calculations.order_production_status_rollup.formula
        excluded_because:
          difficulty_instance: builder_suspension_cascade_depth_three
          rationale: "That §1.8 instance already proves the hold branch outranks the lot-derived branches: an order sitting in PROD_IN_FABRICATION with a live lot is recomputed to PROD_HOLD the moment commercial_hold is raised, which is the branch precedence this claim is about."

  - section: validations
    instances:
      - name: duplicate_jurisdiction_and_line_codes_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14, error_id=ERR_DUPLICATE_CODE]
          - entities.Jurisdiction.fields.code
          - entities.ProductionLine.fields.code
        distinguishing_aspect: "One error code guards two unrelated tables: a repeated jurisdiction code and a repeated production line code both raise ERR_DUPLICATE_CODE (409), while a jurisdiction and a line that happen to share the same code string do not collide with each other."
        test_recipe:
          setup:
            - "One jurisdiction TX-HARRIS and one production line PL-1 already exist."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County TX", state_code: "TX", territory_code: "TX-GULF", freight_zone: 3, exposure_category: "C", design_wind_speed_mph: 140, ground_snow_load_psf: 5, seismic_design_category: "A", max_authorized_builders: 2 }
              as: PlatformAdmin
              captures: { j1_id: $.data.id }
            - call: "POST /production-lines"
              payload: { code: "PL-1", name: "Plate Line 1", line_type: "PLATE_CUT_WELD" }
              as: PlatformAdmin
              captures: { pl1_id: $.data.id }
          trigger:
            - call: "POST /jurisdictions"
              payload: { code: "TX-HARRIS", name: "Harris County Duplicate", state_code: "TX", territory_code: "TX-OTHER", freight_zone: 2, exposure_category: "B", design_wind_speed_mph: 115, ground_snow_load_psf: 0, seismic_design_category: "A", max_authorized_builders: 1 }
              as: PlatformAdmin
            - call: "POST /production-lines"
              payload: { code: "PL-1", name: "Plate Line 1 Duplicate", line_type: "ROLL_FORM" }
              as: PlatformAdmin
            - call: "POST /production-lines"
              payload: { code: "TX-HARRIS", name: "Oddly Named Line", line_type: "PANEL_ROLL" }
              as: PlatformAdmin
              captures: { pl_odd_id: $.data.id }
          assert:
            - "the duplicate jurisdiction code returns 409 with data.error_id == ERR_DUPLICATE_CODE"
            - "the duplicate line code returns 409 with data.error_id == ERR_DUPLICATE_CODE"
            - "only one Jurisdiction row named Harris County TX exists and Jurisdiction.${j1_id}.territory_code is still TX-GULF"
            - "ProductionLine.${pl1_id}.line_type is still PLATE_CUT_WELD"
            - "the third call returns 201 — uniqueness is per table, so ${pl_odd_id} may carry the code TX-HARRIS"

