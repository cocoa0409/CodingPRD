# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog (40 codes; every code is reachable from §1.5)
# ---------------------------------------------------------------------------
errors:
  # -- auth -----------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty after trimming, or naming a role not declared in §1.7."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the called endpoint's roles."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "A Permittee acts on a Permit whose permittee_user_id differs from X-User-ID, or a Producer registers a PracticeProject whose producer_id differs from X-User-ID."

  # -- not found ------------------------------------------------------------
  - id: ERR_WATERSHED_NOT_FOUND
    http: 404
    condition: "watershed_id in the path or body does not resolve."
  - id: ERR_REACH_NOT_FOUND
    http: 404
    condition: "reach_id or downstream_reach_id does not resolve."
  - id: ERR_TMDL_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "tmdl_assessment_id does not resolve."
  - id: ERR_SOURCE_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "source_assessment_id does not resolve."
  - id: ERR_ALLOCATION_RUN_NOT_FOUND
    http: 404
    condition: "allocation_run_id does not resolve."
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "permit_id does not resolve."
  - id: ERR_PRODUCER_NOT_FOUND
    http: 404
    condition: "producer_id does not resolve."
  - id: ERR_PRACTICE_PROJECT_NOT_FOUND
    http: 404
    condition: "practice_project_id does not resolve."
  - id: ERR_CREDIT_BATCH_NOT_FOUND
    http: 404
    condition: "credit_batch_id does not resolve."
  - id: ERR_CREDIT_TRANSACTION_NOT_FOUND
    http: 404
    condition: "credit_transaction_id does not resolve."
  - id: ERR_ADAPTIVE_REVIEW_NOT_FOUND
    http: 404
    condition: "adaptive_review_id does not resolve."
  - id: ERR_MONITORING_SAMPLE_NOT_FOUND
    http: 404
    condition: "monitoring_sample_id does not resolve."

  # -- request shape and uniqueness ----------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, wrong type, unknown field, enum value outside the declared set, decimal outside the declared range, period_end_date not strictly after period_start_date, effective_end_date not strictly after effective_start_date, or limit/offset outside 1..100 / >= 0."
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "watershed_code already exists globally, reach_code or assessment_code already exists in the watershed, or permit_number already exists globally."
  - id: ERR_WATERSHED_MISMATCH
    http: 422
    condition: "Two rows joined by a request belong to different watersheds: a downstream reach in another watershed, a source assessment whose reach is in another watershed, a permit whose source assessment sits under another watershed's assessment, or a credit transaction spanning two watersheds."

  # -- optimistic concurrency ----------------------------------------------
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_credit_batch_version does not equal the CreditBatch's current version at POST /credit-transactions."
  - id: ERR_STALE_TMDL_VERSION
    http: 412
    condition: "expected_tmdl_assessment_version does not equal the TmdlAssessment's current version at POST /tmdl-assessments/{tmdl_assessment_id}/allocation-runs."

  # -- state ----------------------------------------------------------------
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row's current state does not declare the requested transition in §1.2, including approving a transaction whose batch is not LISTED and re-finalizing an already FINALIZED review."
  - id: ERR_TRADING_SUSPENDED
    http: 409
    condition: "Watershed.program_status is not ACTIVE when a trading operation (certify, list, propose, approve) is attempted."

  # -- program integrity ---------------------------------------------------
  - id: ERR_BASELINE_NOT_MET
    http: 422
    condition: "A BASELINE verification event with outcome PASS is submitted for a PracticeProject whose baseline_met is false."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "The same user id performs two verification stages of one project, or the certifying registry administrator is one of the project's verifiers."
  - id: ERR_PRACTICE_PERIOD_OVERLAP
    http: 409
    condition: "A new PracticeProject's half-open effective interval overlaps a live project on the same tract_code and practice_type."
  - id: ERR_REVIEW_WINDOW_CONFLICT
    http: 409
    condition: "A new AdaptiveReview window is not separated from every existing window on the same watershed by at least one clear calendar day."
  - id: ERR_REPORTING_YEAR_MISMATCH
    http: 422
    condition: "CreditTransaction.reporting_period_year differs from the buyer Permit.reporting_period_year."
  - id: ERR_ZONE_NOT_ELIGIBLE
    http: 422
    condition: "A practice reach's trading_zone_code is outside Watershed.eligible_zone_codes, or no downstream path of at most MAX_PATH_DEPTH reaches links the generating reach to the buyer's reach."

  # -- prerequisite chains -------------------------------------------------
  - id: ERR_TMDL_NOT_APPROVED
    http: 409
    condition: "The governing TmdlAssessment is not APPROVED when finalizing permit limits or finalizing an adaptive review."
  - id: ERR_PROJECT_NOT_CERTIFIED
    http: 409
    condition: "The generating PracticeProject is not CERTIFIED when its batch is listed."
  - id: ERR_WLA_NOT_ALLOCATED
    http: 409
    condition: "The linked SourceAssessment has no allocated_load_lbs_yr when limits are derived, or the assessment has no ACTIVE AllocationRun when approval is requested."
  - id: ERR_LIMITS_NOT_DERIVED
    http: 409
    condition: "An annual report is submitted while Permit.limit_status is still DRAFT_LIMITS."
  - id: ERR_ALLOCATION_RUN_IN_USE
    http: 409
    condition: "A rescind is attempted while a Permit whose source assessment belongs to the run has limit_status INTERIM or FINAL."
  - id: ERR_BATCH_HAS_OPEN_TRANSACTIONS
    http: 409
    condition: "A retire is attempted while at least one CreditTransaction against the batch is still PROPOSED."
  - id: ERR_NO_INCLUDED_SOURCES
    http: 422
    condition: "An allocation run is requested on an assessment with no SourceAssessment in status INVENTORIED or ADJUSTED."
  - id: ERR_SOURCE_NOT_POINT
    http: 422
    condition: "A permit is created against a SourceAssessment whose source_type is not POINT."

  # -- fiscal boundaries ---------------------------------------------------
  - id: ERR_ALLOCABLE_LOAD_NEGATIVE
    http: 422
    condition: "loading_capacity_lbs_yr minus margin_of_safety_lbs_yr minus effective_background_lbs_yr is strictly below 0.00; exactly 0.00 is accepted."
  - id: ERR_CREDIT_INSUFFICIENT
    http: 409
    condition: "requested_gross_lbs or retire_lbs exceeds CreditBatch.available_lbs."
  - id: ERR_NO_COMPLIANCE_GAP
    http: 409
    condition: "The buyer Permit is not in SHORTFALL with a positive compliance_gap_lbs, either at proposal or again at approval."
  - id: ERR_DELIVERY_BELOW_MINIMUM
    http: 422
    condition: "The proposed delivered quantity rounds to 0.00 lbs after the retirement withholding, delivery ratio, uncertainty ratio and equivalence ratio are applied."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix — role_model: segregation_of_duties layered over peer roles
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdministrator
    description: "State program owner. Registers watersheds, drives program_status, opens and finalizes adaptive reviews, and holds an emergency void power over credit transactions."
    identity: opaque
    exclusive_operations:
      - "POST /watersheds"
      - "POST /watersheds/{watershed_id}/program-status"
      - "POST /watersheds/{watershed_id}/adaptive-reviews"
      - "POST /adaptive-reviews/{adaptive_review_id}/finalize"
    shared_operations:
      - "POST /reaches (with TmdlAnalyst)"
      - "POST /monitoring-samples (with TmdlAnalyst)"
      - "POST /tmdl-assessments/{tmdl_assessment_id}/status (with TmdlAnalyst)"
      - "POST /allocation-runs/{allocation_run_id}/rescind (with TmdlAnalyst)"
      - "POST /producers (with RegistryAdministrator)"
      - "POST /credit-transactions/{credit_transaction_id}/void (with RegistryAdministrator)"
      - "all GET endpoints"

  - name: TmdlAnalyst
    description: "Water quality modeller. Builds assessments, inventories sources, and executes load allocation runs."
    identity: opaque
    exclusive_operations:
      - "POST /tmdl-assessments"
      - "POST /source-assessments"
      - "POST /tmdl-assessments/{tmdl_assessment_id}/allocation-runs"
    shared_operations:
      - "POST /reaches (with ProgramAdministrator)"
      - "POST /monitoring-samples (with ProgramAdministrator)"
      - "POST /tmdl-assessments/{tmdl_assessment_id}/status (with ProgramAdministrator)"
      - "POST /allocation-runs/{allocation_run_id}/rescind (with ProgramAdministrator)"
      - "GET endpoints other than /producers/{producer_id}, /practice-projects*, /credit-batches* and /credit-transactions*"

  - name: PermitWriter
    description: "Permit drafter. Issues permits against point-source wasteload allocations and derives then finalizes effluent limits. Cannot report compliance or approve credits."
    identity: opaque
    exclusive_operations:
      - "POST /permits"
      - "POST /permits/{permit_id}/derive-limits"
      - "POST /permits/{permit_id}/finalize-limits"
    shared_operations:
      - "GET endpoints for watersheds, reaches, assessments, allocation runs, permits, credit transactions and adaptive reviews"

  - name: Permittee
    description: "Regulated point-source discharger. Files its own annual report and buys credits against its own permit only."
    identity: opaque
    exclusive_operations:
      - "POST /permits/{permit_id}/annual-report"
      - "POST /credit-transactions"
    shared_operations:
      - "GET endpoints; write access is confined to permits whose permittee_user_id equals X-User-ID"

  - name: Producer
    description: "Agricultural landowner generating credits. Registers practice projects on its own tracts. X-User-ID is the Producer row's id."
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /practice-projects"
    shared_operations:
      - "GET /producers/{producer_id}, GET /practice-projects*, GET /credit-batches*, GET /reaches*, GET /watersheds*, GET /adaptive-reviews*"

  - name: PracticeVerifier
    description: "Third-party field verifier. Files baseline, implementation and reverification events. Segregation of duties forbids the same user id from filing two stages of one project."
    identity: opaque
    exclusive_operations:
      - "POST /verification-events"
    shared_operations:
      - "GET /producers/{producer_id}, GET /practice-projects*, GET /credit-batches*, GET /reaches*, GET /watersheds*, GET /adaptive-reviews*"

  - name: RegistryAdministrator
    description: "Credit registry operator. Certifies verified projects into serialized batches, lists and retires batches, and approves transactions. Cannot verify or register the practices it certifies."
    identity: opaque
    exclusive_operations:
      - "POST /practice-projects/{practice_project_id}/certify"
      - "POST /credit-batches/{credit_batch_id}/list"
      - "POST /credit-batches/{credit_batch_id}/retire"
      - "POST /credit-transactions/{credit_transaction_id}/approve"
    shared_operations:
      - "POST /producers (with ProgramAdministrator)"
      - "POST /credit-transactions/{credit_transaction_id}/void (with ProgramAdministrator)"
      - "all GET endpoints"
