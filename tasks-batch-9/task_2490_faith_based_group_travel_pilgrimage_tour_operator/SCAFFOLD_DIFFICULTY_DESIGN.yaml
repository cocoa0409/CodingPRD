# Scaffold Difficulty Design for task_2490 — Faith-Based Group Travel & Pilgrimage Tour Operator.
# 9 rule_id blocks / 24 instances. Every literal in an `assert:` line was computed by executing
# the corresponding SCAFFOLD.yaml calculations[].formula with its declared constants.
# The logical clock starts at the mandated default 2026-08-01T00:00:00Z in every instance;
# any instance that needs a different instant sets it explicitly.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: departure_tier_provisional_vs_final_divergence
        grounds:
          - calculations.departure_group_size_tier
          - entities.Departure.fields.provisional_per_pax_price_cents
          - entities.Departure.fields.final_per_pax_price_cents
          - state_machines.Departure.OPEN_FOR_SALE_to_SALES_CLOSED
          - validations[priority=68]
        distinguishing_aspect: |
          The provisional variant counts paying pilgrims in {DEPOSITED, CONFIRMED} while the final
          variant counts only {CONFIRMED and PAID_IN_FULL}, so the identical two-person roster
          selects tier P2 at 587000 provisionally and tier P1 at 620000 finally — a 33000-cent
          per-pax divergence on one Departure row, in the departure-pricing entity domain.
        test_recipe:
          setup:
            - "One program with two contiguous tiers: P1 covers exactly 1 traveler at 620000, P2 covers 2-3 travelers at 587000."
            - "One OPEN_FOR_SALE departure on 2026-11-01 with min_pax 1 and max_pax 3."
            - "Two paying travelers, both DEPOSITED; only the first is CONFIRMED and PAID_IN_FULL."
            - "Logical clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Small Group"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "P1", min_pax: 1, max_pax: 1, per_pax_price_cents: 620000, single_supplement_cents: 105000, deposit_cents: 60000 }
                  - { tier_code: "P2", min_pax: 2, max_pax: 3, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 90, penalty_bp: 1000 }
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 30, penalty_bp: 6500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 3, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-09-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Anna Kessler", date_of_birth: "1980-05-05", room_type_requested: "DOUBLE" }
              as: ProgramManager
              captures: { pil_a_id: $.data.id }
            - call: "POST /pilgrims/${pil_a_id}/payments"
              payload: { amount_cents: 60000, method: "CHECK" }
              as: FinanceController
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Bruno Costa", date_of_birth: "1982-07-07", room_type_requested: "DOUBLE" }
              as: ProgramManager
              captures: { pil_b_id: $.data.id }
            - call: "POST /pilgrims/${pil_b_id}/payments"
              payload: { amount_cents: 60000, method: "CHECK" }
              as: FinanceController
            - call: "POST /pilgrims/${pil_a_id}/confirm"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims/${pil_a_id}/payments"
              payload: { amount_cents: 549615, method: "ACH" }
              as: FinanceController
          trigger:
            - call: "POST /departures/${dep_id}/close-sales"
              payload: {}
              as: ProgramManager
          assert:
            - "Departure.${dep_id}.status == SALES_CLOSED"
            - "Departure.${dep_id}.provisional_tier_code == P2"
            - "Departure.${dep_id}.provisional_per_pax_price_cents == 587000"
            - "Departure.${dep_id}.final_tier_code == P1"
            - "Departure.${dep_id}.final_per_pax_price_cents == 620000"
            - "Departure.${dep_id}.final_per_pax_price_cents - Departure.${dep_id}.provisional_per_pax_price_cents == 33000"
            - "Pilgrim.${pil_a_id}.price_locked_cents == 620000"
            - "Pilgrim.${pil_a_id}.invoice_total_cents == 609615"
            - "Pilgrim.${pil_b_id}.booking_status == DEPOSITED"

      - name: leader_accrual_snapshot_vs_settlement_divergence
        grounds:
          - calculations.leader_benefit_accrual
          - entities.GroupLeaderAgreement.fields.recruited_paying_count
          - entities.GroupLeaderAgreement.fields.settled_recruited_count
          - state_machines.GroupLeaderAgreement.ACTIVE_to_SETTLED
          - concurrency_rules[leader-agreement-create-stale-departure]
        distinguishing_aspect: |
          In the leader-commission entity domain (GroupLeaderAgreement, not Departure), the same
          four recruits leave recruited_paying_count 4 / earned_free_seats 2 / commission_payable
          24000 on the snapshot fields while settlement writes settled_recruited_count 2 /
          settled_earned_free_seats 1 / settled_commission_cents 12000 on the very same row.
        test_recipe:
          setup:
            - "Program with tier T1 covering 1-9 travelers at 587000 and deposit 50000."
            - "Departure on 2026-11-01, OPEN_FOR_SALE, min_pax 1, max_pax 40."
            - "One ACTIVE leader agreement with free_travel_threshold 2 and PER_PAX_CASH commission of 6000 per recruit."
            - "Four paying recruits, all DEPOSITED; exactly two of them CONFIRMED and PAID_IN_FULL (invoice 577168 each)."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                  - { tier_code: "T2", min_pax: 10, max_pax: 19, per_pax_price_cents: 529000, single_supplement_cents: 92000, deposit_cents: 50000 }
                  - { tier_code: "T3", min_pax: 20, max_pax: 40, per_pax_price_cents: 488000, single_supplement_cents: 86000, deposit_cents: 40000 }
                cancellation_grid:
                  - { min_days_before: 90, penalty_bp: 1000 }
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 30, penalty_bp: 6500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-09-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id, dep_v0: $.data.version }
            - call: "POST /group-leader-agreements"
              payload: { departure_id: "${dep_id}", leader_name: "Fr. Alonso Reyes", leader_user_id: "u-leader-alonso", free_travel_threshold: 2, commission_mode: "PER_PAX_CASH", commission_rate_cents_per_pax: 6000, accrual_basis: "TRAVELED", expected_departure_version: "${dep_v0}" }
              as: ProgramManager
              captures: { agr_id: $.data.id }
            - call: "POST /group-leader-agreements/${agr_id}/countersign"
              payload: {}
              as: GroupLeader
              as_user_id: "${agr_id}"
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Recruit One", date_of_birth: "1975-01-10", room_type_requested: "DOUBLE", recruited_by_agreement_id: "${agr_id}" }
              as: ProgramManager
              captures: { pil_1_id: $.data.id }
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Recruit Two", date_of_birth: "1978-02-11", room_type_requested: "DOUBLE", recruited_by_agreement_id: "${agr_id}" }
              as: ProgramManager
              captures: { pil_2_id: $.data.id }
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Recruit Three", date_of_birth: "1981-03-12", room_type_requested: "DOUBLE", recruited_by_agreement_id: "${agr_id}" }
              as: ProgramManager
              captures: { pil_3_id: $.data.id }
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Recruit Four", date_of_birth: "1984-04-13", room_type_requested: "DOUBLE", recruited_by_agreement_id: "${agr_id}" }
              as: ProgramManager
              captures: { pil_4_id: $.data.id }
            - call: "POST /pilgrims/${pil_1_id}/payments"
              payload: { amount_cents: 50000, method: "PARISH_TRANSFER" }
              as: FinanceController
            - call: "POST /pilgrims/${pil_2_id}/payments"
              payload: { amount_cents: 50000, method: "PARISH_TRANSFER" }
              as: FinanceController
            - call: "POST /pilgrims/${pil_3_id}/payments"
              payload: { amount_cents: 50000, method: "PARISH_TRANSFER" }
              as: FinanceController
            - call: "POST /pilgrims/${pil_4_id}/payments"
              payload: { amount_cents: 50000, method: "PARISH_TRANSFER" }
              as: FinanceController
            - call: "POST /pilgrims/${pil_1_id}/confirm"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims/${pil_2_id}/confirm"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims/${pil_1_id}/payments"
              payload: { amount_cents: 527168, method: "ACH" }
              as: FinanceController
            - call: "POST /pilgrims/${pil_2_id}/payments"
              payload: { amount_cents: 527168, method: "ACH" }
              as: FinanceController
            - call: "POST /departures/${dep_id}/close-sales"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /group-leader-agreements/${agr_id}/settle"
              payload: {}
              as: FinanceController
          assert:
            - "GroupLeaderAgreement.${agr_id}.status == SETTLED"
            - "GroupLeaderAgreement.${agr_id}.recruited_paying_count == 4"
            - "GroupLeaderAgreement.${agr_id}.earned_free_seats == 2"
            - "GroupLeaderAgreement.${agr_id}.commission_payable_cents == 24000"
            - "GroupLeaderAgreement.${agr_id}.settled_recruited_count == 2"
            - "GroupLeaderAgreement.${agr_id}.settled_earned_free_seats == 1"
            - "GroupLeaderAgreement.${agr_id}.settled_commission_cents == 12000"
            - "Departure.${dep_id}.final_tier_code == T1"
            - "Pilgrim.${pil_1_id}.invoice_total_cents == 577168"

  - rule_id: combinatorial_formula
    instances:
      - name: protection_premium_four_input_band_uplift_cap_combination
        grounds:
          - calculations.protection_premium
          - calculations.pilgrim_invoice_total
          - entities.TravelProtection.fields.age_band
          - entities.TravelProtection.fields.waiver_surcharge_cents
          - state_machines.TravelProtection.MEDICAL_REVIEWED_to_WAIVER_APPROVED
        distinguishing_aspect: |
          Mode (a): premium_cents is a single formula over FOUR independent inputs — insured trip
          cost 1966500, age_at_departure 78 (band D, 1280 bp), medical_limit exactly at the
          5000000 uplift threshold (uplift 0 under the strict `>`), and an approved waiver whose
          55377-cent raw surcharge is clamped by WAIVER_SURCHARGE_CAP_CENTS to 45000; dropping any
          one input changes the result.
        test_recipe:
          setup:
            - "Rome Jubilee Deluxe program with a single tier RJ1 at 2000000 per pax and deposit 200000."
            - "Departure on 2027-03-14, OPEN_FOR_SALE."
            - "One DOUBLE-room traveler born 1948-06-20, so age_at_departure is 78."
            - "Traveler DEPOSITED at the default clock 2026-08-01, giving deposit_reference_date 2026-08-01."
            - "Protection quoted with medical_limit_cents exactly 5000000 and pre_existing_waiver_requested true."
            - "Medical review complete with stable_period_days 90, performed by user u-prot-reviewer."
            - "Clock advanced to 2026-08-10, nine days into the 21-day waiver window."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Rome Jubilee Deluxe"
                destination_country: "IT"
                faith_tradition: "CATHOLIC"
                duration_days: 8
                price_tiers:
                  - { tier_code: "RJ1", min_pax: 1, max_pax: 12, per_pax_price_cents: 2000000, single_supplement_cents: 300000, deposit_cents: 200000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 5000 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2027-03-14", return_date: "2027-03-22", min_pax: 1, max_pax: 12, deposit_due_date: "2026-09-01", final_payment_due_date: "2027-01-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Aldo Ferri", date_of_birth: "1948-06-20", room_type_requested: "DOUBLE" }
              as: ProgramManager
              captures: { pil_id: $.data.id }
            - call: "POST /pilgrims/${pil_id}/payments"
              payload: { amount_cents: 200000, method: "ACH" }
              as: FinanceController
            - call: "POST /travel-protections"
              payload: { pilgrim_id: "${pil_id}", plan_code: "PREMIER", medical_limit_cents: 5000000, pre_existing_waiver_requested: true }
              as: ProtectionAdministrator
              captures: { tp_id: $.data.id }
            - call: "POST /travel-protections/${tp_id}/medical-review"
              payload: { questionnaire_complete: true, stable_period_days: 90 }
              as: ProtectionAdministrator
              as_user_id: "u-prot-reviewer"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProtectionAdministrator
          trigger:
            - call: "POST /travel-protections/${tp_id}/waiver-decision"
              payload: { decision: "APPROVE" }
              as: ProtectionAdministrator
              as_user_id: "u-prot-approver"
          assert:
            - "Pilgrim.${pil_id}.age_at_departure == 78"
            - "Pilgrim.${pil_id}.invoice_total_cents == 1966500"
            - "TravelProtection.${tp_id}.insured_trip_cost_cents == 1966500"
            - "TravelProtection.${tp_id}.age_band == D"
            - "TravelProtection.${tp_id}.base_premium_cents == 251712"
            - "TravelProtection.${tp_id}.medical_uplift_cents == 0"
            - "TravelProtection.${tp_id}.waiver_surcharge_cents == 45000"
            - "TravelProtection.${tp_id}.premium_cents == 296712"
            - "TravelProtection.${tp_id}.status == WAIVER_APPROVED"

      - name: land_rollup_round_per_line_then_sum_order
        grounds:
          - calculations.departure_land_cost_rollup
          - entities.LandAssignment.fields.line_usd_cents
          - entities.Departure.fields.land_cost_total_cents
          - state_machines.LandAssignment.DRAFT_to_COUNTERSIGNED
        distinguishing_aspect: |
          Mode (b): with fx_rate_bp 10833 the three countersigned lines round to 1462455 + 690604 +
          677063 = 2830122, whereas converting the summed local total 2612500 in one step yields
          2830121 — a one-cent divergence that pins round-per-line-then-sum as the only permitted
          evaluation order.
        test_recipe:
          setup:
            - "Holy Land program and a PLANNING departure on 2026-11-01."
            - "Three land resources from the same operator, all at fx_rate_bp 10833: hotel rooms at 45000 local per unit-day, a motorcoach at 127500, guides at 62500."
            - "Three land lines over the closed-inclusive range 2026-11-01..2026-11-05 (days_inclusive 5): 6 hotel rooms, 1 coach, 2 guides."
            - "The hotel and coach lines are already COUNTERSIGNED; the guide line is still DRAFT."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-09-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /land-resources"
              payload: { operator_name: "Terra Santa DMC", country: "IL", resource_type: "HOTEL_ROOM_BLOCK", units_total: 30, unit_rate_local_cents: 45000, fx_rate_bp: 10833, force_majeure_notice_days: 45 }
              as: LandContractor
              captures: { lr_hotel_id: $.data.id }
            - call: "POST /land-resources"
              payload: { operator_name: "Terra Santa DMC", country: "IL", resource_type: "MOTORCOACH", units_total: 3, unit_rate_local_cents: 127500, fx_rate_bp: 10833, force_majeure_notice_days: 30 }
              as: LandContractor
              captures: { lr_coach_id: $.data.id }
            - call: "POST /land-resources"
              payload: { operator_name: "Terra Santa DMC", country: "IL", resource_type: "GUIDE", units_total: 4, unit_rate_local_cents: 62500, fx_rate_bp: 10833, force_majeure_notice_days: 21 }
              as: LandContractor
              captures: { lr_guide_id: $.data.id }
            - call: "POST /land-assignments"
              payload: { land_resource_id: "${lr_hotel_id}", departure_id: "${dep_id}", date_from: "2026-11-01", date_to: "2026-11-05", units_requested: 6 }
              as: LandContractor
              captures: { la_hotel_id: $.data.id }
            - call: "POST /land-assignments"
              payload: { land_resource_id: "${lr_coach_id}", departure_id: "${dep_id}", date_from: "2026-11-01", date_to: "2026-11-05", units_requested: 1 }
              as: LandContractor
              captures: { la_coach_id: $.data.id }
            - call: "POST /land-assignments"
              payload: { land_resource_id: "${lr_guide_id}", departure_id: "${dep_id}", date_from: "2026-11-01", date_to: "2026-11-05", units_requested: 2 }
              as: LandContractor
              captures: { la_guide_id: $.data.id }
            - call: "POST /land-assignments/${la_hotel_id}/countersign"
              payload: {}
              as: LandContractor
            - call: "POST /land-assignments/${la_coach_id}/countersign"
              payload: {}
              as: LandContractor
          trigger:
            - call: "POST /land-assignments/${la_guide_id}/countersign"
              payload: {}
              as: LandContractor
          assert:
            - "LandAssignment.${la_hotel_id}.days_inclusive == 5"
            - "LandAssignment.${la_hotel_id}.line_local_cents == 1350000"
            - "LandAssignment.${la_hotel_id}.line_usd_cents == 1462455"
            - "LandAssignment.${la_coach_id}.line_local_cents == 637500"
            - "LandAssignment.${la_coach_id}.line_usd_cents == 690604"
            - "LandAssignment.${la_guide_id}.line_local_cents == 625000"
            - "LandAssignment.${la_guide_id}.line_usd_cents == 677063"
            - "Departure.${dep_id}.land_cost_total_cents == 2830122"
            - "Departure.${dep_id}.land_cost_total_cents != 2830121"

      - name: invoice_grant_tier_keyed_on_gross_not_total
        grounds:
          - calculations.pilgrim_invoice_total
          - entities.Pilgrim.fields.invoice_total_cents
          - entities.Program.fields.price_tiers
          - state_machines.Pilgrim."booking_status = <none> (row creation)"_to_INQUIRY
        distinguishing_aspect: |
          Mode (c): the pinned step order gives 299000 gross -> grant_bp 0 -> net 299000 -> service
          fee 10465 -> total 309465, while keying the grant tier on the post-fee total (309465,
          which crosses the 300000 breakpoint) would give 300181; the 9284-cent gap makes the order
          observable on a single traveler with no other moving parts.
        test_recipe:
          setup:
            - "Marian Shrines program whose smallest tier S1 prices a traveler at 299000, one cent-band below the 300000 grant breakpoint."
            - "Departure on 2026-10-05, OPEN_FOR_SALE, max_pax 30."
            - "Logical clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Marian Shrines of Europe"
                destination_country: "PT"
                faith_tradition: "CATHOLIC"
                duration_days: 7
                price_tiers:
                  - { tier_code: "S1", min_pax: 1, max_pax: 14, per_pax_price_cents: 299000, single_supplement_cents: 41000, deposit_cents: 30000 }
                  - { tier_code: "S2", min_pax: 15, max_pax: 30, per_pax_price_cents: 268000, single_supplement_cents: 38000, deposit_cents: 30000 }
                cancellation_grid:
                  - { min_days_before: 45, penalty_bp: 2500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-10-05", return_date: "2026-10-12", min_pax: 1, max_pax: 30, deposit_due_date: "2026-08-20", final_payment_due_date: "2026-09-05", mobility_accessible_coach: false }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Rosa Neves", date_of_birth: "1991-09-09", room_type_requested: "DOUBLE" }
              as: ProgramManager
              captures: { pil_id: $.data.id }
          assert:
            - "Pilgrim.${pil_id}.price_locked_cents == 299000"
            - "Pilgrim.${pil_id}.single_supplement_applied_cents == 0"
            - "Pilgrim.${pil_id}.deviation_fee_cents == 0"
            - "Pilgrim.${pil_id}.invoice_total_cents == 309465"
            - "Pilgrim.${pil_id}.invoice_total_cents != 300181"
            - "Departure.${dep_id}.provisional_tier_code == S1"

  - rule_id: non_linear_state_machine
    instances:
      - name: air_block_offer_counter_reoffer_cycle
        grounds:
          - state_machines.AirBlock.OFFERED_to_COUNTERED
          - state_machines.AirBlock.COUNTERED_to_OFFERED
