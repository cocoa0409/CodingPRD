              payload: { resource_area: "BIOLOGICAL", label: "Planned access road", intensity_contribution: 10.0, footprint_hectares: 300.0, distance_km: 20.0, temporal_scope: "REASONABLY_FORESEEABLE" }
              as: ResourceSpecialist
