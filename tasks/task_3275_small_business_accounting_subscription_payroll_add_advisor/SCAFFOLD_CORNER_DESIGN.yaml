# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3275_small_business_accounting_subscription_payroll_add_advisor
#
# Breadth probe. Enumerates every testable claim the scaffold's §1.1–§1.7
# surface declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already
# exercise. Corners that §1.8 already covers appear as `excluded_because:`
# stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: firm_create_returns_every_declared_field_and_starts_active
        claim_type: Creation
        grounds:
          - entities.AccountantFirm
          - endpoints.POST_/firms
        distinguishing_aspect: "POST with the three required inputs returns 201 with firm_status == ACTIVE, version 1, server-minted id, and a created_at / updated_at — status is never client-supplied."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Empty database."]
          setup_api_calls:
            - &c_clock
              call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &c_firm
              call: "POST /api/firms"
              payload: { firm_name: "Fiesta CPAs", wholesale_discount_pct: 0.25, proadvisor_tier: "GOLD" }
              as: PlatformAdmin
              captures: { c_firm_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "AccountantFirm.${c_firm_id}.firm_status == ACTIVE"
            - "AccountantFirm.${c_firm_id}.version == 1"
            - "the response carries non-null id, created_at, updated_at"

      - name: plan_create_and_get_round_trips_all_fields
        claim_type: Retrieval
        grounds:
          - entities.SubscriptionPlan
          - endpoints.POST_/plans
          - endpoints.GET_/plans/{id}
        distinguishing_aspect: "All eight input fields (plan_code, list_price_cents, max_seats, four feature flags, plan_rank) round-trip through GET exactly as posted. SubscriptionPlan has common_fields:false so it carries id and created_at but no version."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock
            - &c_plan
              call: "POST /api/plans"
              payload: { plan_code: "PLUS", list_price_cents: 8000, max_seats: 5, feature_inventory: true, feature_project_profitability: true, feature_multi_currency: true, feature_bank_rules: true, plan_rank: 3 }
              as: PlatformAdmin
              captures: { c_plan_id: $.data.id }
          trigger:
            - call: "GET /api/plans/${c_plan_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200"
            - "SubscriptionPlan.${c_plan_id}.plan_code == PLUS and list_price_cents == 8000 and max_seats == 5"
            - "all four feature_* booleans are true"
            - "plan_rank == 3"
            - "no version field on the response (common_fields: false)"

      - name: company_users_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/companies/{id}/users
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three users on the company; limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. Plan ESSENTIALS max_seats=5. Company with three users."]
          setup_api_calls:
            - *c_clock
            - &c_plan_ess
              call: "POST /api/plans"
              payload: { plan_code: "ESSENTIALS", list_price_cents: 5000, max_seats: 5, feature_inventory: false, feature_project_profitability: false, feature_multi_currency: true, feature_bank_rules: true, plan_rank: 2 }
              as: PlatformAdmin
              captures: { c_plan_ess_id: $.data.id }
            - &c_company
              call: "POST /api/companies"
              payload: { legal_name: "Pagination Co", admin_email: "p@p.example", home_country: "US", data_region: "US", plan_id: "${c_plan_ess_id}" }
              as: PlatformAdmin
              captures: { c_company_id: $.data.id }
            - &c_admin
              call: "POST /api/companies/${c_company_id}/users"
              payload: { company_id: "${c_company_id}", email: "admin@p.example", display_name: "Admin", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { c_admin_id: $.data.id }
            - call: "POST /api/companies/${c_company_id}/users"
              payload: { company_id: "${c_company_id}", email: "u2@p.example", display_name: "U2", permission_level: "STANDARD" }
              as: CompanyUser
              as_user_id: "${c_admin_id}"
            - call: "POST /api/companies/${c_company_id}/users"
              payload: { company_id: "${c_company_id}", email: "u3@p.example", display_name: "U3", permission_level: "STANDARD" }
              as: CompanyUser
              as_user_id: "${c_admin_id}"
          trigger:
            - call: "GET /api/companies/${c_company_id}/users"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /companies/${c_company_id}/users?limit=2&offset=2 returns 1 row with total_count == 3 and has_more == false"
            - "GET /companies/${c_company_id}/users with no params returns 3 rows with limit defaulting to 10"

      - name: firm_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/firms/{id}
          - errors.ERR_NOT_FOUND
          - validations.priority_4_existence
        distinguishing_aspect: "A syntactically valid UUID that does not match any firm returns 404 with ERR_NOT_FOUND (not a generic 400, not 403)."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z. No firm created."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /api/firms/00000000-0000-4000-8000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 404"
            - "err_id == ERR_NOT_FOUND"

      - name: company_create_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.ClientCompany.fields.legal_name
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting legal_name (a required input with no default) returns 400 ERR_INVALID_REQUEST, not 500."
        test_recipe:
          setup: ["Logical clock at 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - *c_clock
            - *c_plan_ess
          trigger:
            - call: "POST /api/companies"
              payload: { admin_email: "x@x.example", home_country: "US", data_region: "US", plan_id: "${c_plan_ess_id}" }
              as: PlatformAdmin
              captures: { err_id2: $.data.error_id }
          assert:
            - "the response status is 400"
            - "err_id2 == ERR_INVALID_REQUEST"

      - name: company_user_is_firm_admin_default_false_applies_when_omitted
        claim_type: Defaults
        grounds:
          - entities.AccountantUser.fields.is_firm_admin
        distinguishing_aspect: "is_firm_admin has default:false; creating an AccountantUser without it must yield false."
        test_recipe:
          setup: ["Logical clock. One firm."]
          setup_api_calls:
            - *c_clock
            - *c_firm
          trigger:
            - call: "POST /api/firms/${c_firm_id}/users"
              payload: { firm_id: "${c_firm_id}", full_name: "No Flag", email: "noflag@f.example" }
              as: PlatformAdmin
              captures: { c_au_id: $.data.id }
          assert:
            - "AccountantUser.${c_au_id}.is_firm_admin == false (default applied)"

      - name: subscription_monthly_price_is_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Subscription.fields.monthly_price_cents
        distinguishing_aspect: "monthly_price_cents is computed. Even if the caller submits a body field by that name on company creation, the value is ignored and replaced by the calculated value."
        test_recipe:
          setup: ["Logical clock. Plan PLUS."]
          setup_api_calls:
            - *c_clock
            - *c_plan
          trigger:
            - call: "POST /api/companies"
              payload: { legal_name: "Cheat Co", admin_email: "cheat@c.example", home_country: "US", data_region: "US", plan_id: "${c_plan_id}", monthly_price_cents: 1 }
              as: PlatformAdmin
              captures: { c_cheat_id: $.data.id }
            - call: "GET /api/companies/${c_cheat_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { c_cheat_price: $.data.monthly_price_cents }
          assert:
            - "c_cheat_price == 8000 (list price, computed) — client-supplied monthly_price_cents=1 was ignored"

      - name: company_user_id_created_at_updated_at_are_system_stamped
        claim_type: System Fields
        grounds:
          - entities.CompanyUser
        distinguishing_aspect: "id, created_at, updated_at are server-stamped; client-supplied values are ignored; version starts at 1."
        test_recipe:
          setup: ["Logical clock. Plan PLUS. Company."]
          setup_api_calls:
            - *c_clock
            - *c_plan
            - &c_company2
              call: "POST /api/companies"
              payload: { legal_name: "Sys Co", admin_email: "sys@s.example", home_country: "US", data_region: "US", plan_id: "${c_plan_id}" }
              as: PlatformAdmin
              captures: { c_company2_id: $.data.id }
          trigger:
            - call: "POST /api/companies/${c_company2_id}/users"
              payload: { company_id: "${c_company2_id}", email: "u@s.example", display_name: "U", permission_level: "STANDARD" }
              as: PlatformAdmin
              captures: { c_u_id: $.data.id, c_u_version: $.data.version }
          assert:
            - "CompanyUser.${c_u_id}.id is a server-minted UUID (not client-supplied)"
            - "c_u_version == 1"
            - "created_at and updated_at are present and ISO-8601 UTC"

      - name: plan_create_with_out_of_enum_feature_value_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ClientCompany.fields.data_region
          - errors.ERR_INVALID_ENUM
        distinguishing_aspect: "data_region is a closed enum US|EU|UK; a value such as 'APAC' is rejected at priority 13 with 400 ERR_INVALID_ENUM."
        test_recipe:
          setup: ["Logical clock. Plan."]
          setup_api_calls:
            - *c_clock
            - *c_plan
          trigger:
            - call: "POST /api/companies"
              payload: { legal_name: "Bad Region Co", admin_email: "br@br.example", home_country: "US", data_region: "APAC", plan_id: "${c_plan_id}" }
              as: PlatformAdmin
              captures: { err_id3: $.data.error_id }
          assert:
            - "the response status is 400"
            - "err_id3 == ERR_INVALID_ENUM"

      - name: payroll_addon_requires_valid_subscription_fk
        claim_type: Parent Relationships
        grounds:
          - entities.PayrollAddon.fields.subscription_id
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "Creating a PayrollAddon with a subscription_id that does not exist returns 404; one with a valid id but on a different company returns 404 (referential integrity scoped to the path's company_id)."
        test_recipe:
          setup: ["Logical clock. Plan PLUS. Company A with subscription; Company B (different)."]
          setup_api_calls:
            - *c_clock
            - *c_plan
            - &c_co_a
              call: "POST /api/companies"
              payload: { legal_name: "A Co", admin_email: "a@a.example", home_country: "US", data_region: "US", plan_id: "${c_plan_id}" }
              as: PlatformAdmin
              captures: { c_co_a_id: $.data.id }
            - &c_co_b
              call: "POST /api/companies"
              payload: { legal_name: "B Co", admin_email: "b@b.example", home_country: "US", data_region: "US", plan_id: "${c_plan_id}" }
              as: PlatformAdmin
              captures: { c_co_b_id: $.data.id }
            - &c_adm_a
              call: "POST /api/companies/${c_co_a_id}/users"
              payload: { company_id: "${c_co_a_id}", email: "adm@a.example", display_name: "A", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { c_adm_a_id: $.data.id }
            - call: "POST /api/companies/${c_co_a_id}/users/${c_adm_a_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${c_adm_a_id}"
            - &c_sub_a
              call: "GET /api/companies/${c_co_a_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { c_sub_a_id: $.data.id }
          trigger:
            - call: "POST /api/companies/${c_co_b_id}/payroll"
              payload: { subscription_id: "${c_sub_a_id}", service_level: "SELF_SERVICE" }
              as: CompanyUser
              as_user_id: "${c_adm_a_id}"
              captures: { err_fk: $.data.error_id }
          assert:
            - "the response status is 404"
            - "err_fk == ERR_NOT_FOUND (subscription_id does not belong to company B's scope)"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: company_user_initial_state_is_invited
        claim_type: Initial State
        grounds:
          - state_machines.CompanyUser
          - entities.CompanyUser.fields.user_status
        distinguishing_aspect: "Newly invited CompanyUser has user_status == INVITED without any explicit transition."
        test_recipe:
          setup: ["Logical clock. Plan. Company."]
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_company2
          trigger:
            - call: "POST /api/companies/${c_company2_id}/users"
              payload: { company_id: "${c_company2_id}", email: "new@s.example", display_name: "N", permission_level: "STANDARD" }
              as: PlatformAdmin
              captures: { c_u2_status: $.data.user_status }
          assert:
            - "c_u2_status == INVITED"

      - name: firm_close_from_terminal_state_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.AccountantFirm
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "Calling /close on an already-CLOSED firm is rejected with ERR_INVALID_STATE_TRANSITION — terminal states lock down."
        test_recipe:
          setup: ["Logical clock. One firm with no outstanding obligations, already CLOSED."]
          setup_api_calls:
            - *c_clock
            - *c_firm
            - call: "POST /api/firms/${c_firm_id}/close"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/firms/${c_firm_id}/close"
              payload: {}
              as: PlatformAdmin
              captures: { err_term: $.data.error_id }
          assert:
            - "the response status is 400"
            - "err_term == ERR_INVALID_STATE_TRANSITION"

      - name: recon_complete_from_draft_rejected_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reconciliation
        distinguishing_aspect: "Reconciliation.complete is allowed only from IN_PROGRESS; calling it on a DRAFT recon is rejected with ERR_INVALID_STATE_TRANSITION (no DRAFT -> COMPLETED direct)."
        test_recipe:
          setup: ["Logical clock. Company with bank connection, DRAFT recon."]
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_company2
            - &c_adm2
              call: "POST /api/companies/${c_company2_id}/users"
              payload: { company_id: "${c_company2_id}", email: "adm@s.example", display_name: "A", permission_level: "PRIMARY_ADMIN" }
              as: PlatformAdmin
              captures: { c_adm2_id: $.data.id }
            - call: "POST /api/companies/${c_company2_id}/users/${c_adm2_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - call: "POST /api/companies/${c_company2_id}/subscription/activate"
              payload: { payment_method_token: "pm_x" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - &c_bc
              call: "POST /api/companies/${c_company2_id}/bank_connections"
              payload: { company_id: "${c_company2_id}", institution_name: "B", external_account_mask: "1", consent_expires_at: "2027-01-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
              captures: { c_bc_id: $.data.id }
            - call: "POST /api/companies/${c_company2_id}/bank_connections/${c_bc_id}/authorize"
              payload: {}
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - &c_recon_draft
              call: "POST /api/companies/${c_company2_id}/reconciliations"
              payload: { company_id: "${c_company2_id}", bank_connection_id: "${c_bc_id}", statement_period_start: "2026-08-01T00:00:00Z", statement_period_end: "2026-08-31T00:00:00Z", statement_ending_balance_cents: 0 }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
              captures: { c_recon_id: $.data.id }
          trigger:
            - call: "POST /api/companies/${c_company2_id}/reconciliations/${c_recon_id}/complete"
              payload: {}
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
              captures: { err_inv: $.data.error_id }
          assert:
            - "the response status is 400"
            - "err_inv == ERR_INVALID_STATE_TRANSITION (DRAFT -> COMPLETED not allowed)"

      - name: payroll_terminate_idempotent_second_call_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.PayrollEmployee
          - errors.ERR_EMPLOYEE_ALREADY_TERMINATED
        distinguishing_aspect: "Second /terminate on the same employee returns 400 ERR_EMPLOYEE_ALREADY_TERMINATED — same trigger twice fails on the second attempt."
        test_recipe:
          setup: ["Logical clock. Plan. Company with ACTIVE subscription + payroll + 1 ACTIVE employee."]
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_company2
            - *c_adm2
            - call: "POST /api/companies/${c_company2_id}/users/${c_adm2_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - call: "POST /api/companies/${c_company2_id}/subscription/activate"
              payload: { payment_method_token: "pm_x" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - &c_sub2
              call: "GET /api/companies/${c_company2_id}/subscription"
              payload: {}
              as: PlatformAdmin
              captures: { c_sub2_id: $.data.id }
            - &c_pay
              call: "POST /api/companies/${c_company2_id}/payroll"
              payload: { subscription_id: "${c_sub2_id}", service_level: "SELF_SERVICE" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
              captures: { c_pay_id: $.data.id, c_pay_v: $.data.version }
            - &c_emp
              call: "POST /api/companies/${c_company2_id}/payroll/employees"
              payload: { payroll_addon_id: "${c_pay_id}", legal_name: "E", hire_date: "2026-09-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
              captures: { c_emp_id: $.data.id }
          trigger:
            - call: "POST /api/companies/${c_company2_id}/payroll/employees/${c_emp_id}/terminate"
              payload: { expected_payroll_addon_version: "${c_pay_v}" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
              captures: { c_pay_v2: $.data.version }
            - call: "POST /api/companies/${c_company2_id}/payroll/employees/${c_emp_id}/terminate"
              payload: { expected_payroll_addon_version: "${c_pay_v2}" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
              captures: { err_idem: $.data.error_id }
          assert:
            - "first call: 200 with employment_status == TERMINATED"
            - "second call: 400 err_idem == ERR_EMPLOYEE_ALREADY_TERMINATED"

  # ===========================================================================
  - section: calculations
    instances:

      - name: invoice_total_excluded_from_difficulty_already_covered
        claim_type: Correct Result
        grounds: [calculations.invoice_total]
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_total_mode_c_evaluation_order_pinned
          rationale: "Invoice total is asserted in §1.8 instance with literal cent-by-cent values."

      - name: reconciliation_difference_excluded_from_difficulty
        claim_type: Correct Result
        grounds: [calculations.reconciliation_difference]
        excluded_because:
          difficulty_instance: boundary_precision_check / recon_difference_zero_exactly_required
          rationale: "Boundary-1 and boundary-0 cases asserted in §1.8."

      - name: tax_filing_status_aggregates_correctly
        claim_type: Correct Result
        grounds:
          - calculations.payroll_tax_filing_status
          - entities.PayrollAddon.fields.tax_filing_status
        distinguishing_aspect: "PayrollAddon.tax_filing_status is NOT_READY when there are zero ACTIVE employees, READY when there are employees and no STALE/REVOKED connections and no too-old IN_PROGRESS recons. Tested on read."
        test_recipe:
          setup: ["Logical clock. Plan. Company with payroll but no employees yet."]
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_company2
            - *c_adm2
            - call: "POST /api/companies/${c_company2_id}/users/${c_adm2_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - call: "POST /api/companies/${c_company2_id}/subscription/activate"
              payload: { payment_method_token: "pm_x" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - *c_sub2
            - *c_pay
          trigger:
            - call: "GET /api/companies/${c_company2_id}/payroll"
              payload: {}
              as: PlatformAdmin
              captures: { tf0: $.data.tax_filing_status }
            - call: "POST /api/companies/${c_company2_id}/payroll/employees"
              payload: { payroll_addon_id: "${c_pay_id}", legal_name: "New Emp", hire_date: "2026-09-01T00:00:00Z" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - call: "GET /api/companies/${c_company2_id}/payroll"
              payload: {}
              as: PlatformAdmin
              captures: { tf1: $.data.tax_filing_status }
          assert:
            - "tf0 == NOT_READY (zero ACTIVE employees)"
            - "tf1 == READY (one ACTIVE employee, no STALE connections, no too-old recons, no 3-month invoice history yet)"

      - name: seat_count_check_boundary_excluded
        claim_type: Correct Result
        grounds: [calculations.seat_count_check]
        excluded_because:
          difficulty_instance: boundary_precision_check / seat_limit_max_seats_exactly_allowed_plus_one_rejected
          rationale: "Boundary semantics covered in §1.8."

      - name: rule_match_selector_priority_tiebreak_uses_created_at
        claim_type: Correct Result
        grounds:
          - calculations.rule_match_selector
        distinguishing_aspect: "Two ACTIVE rules with the same priority both matching the txn: the older (created_at ASC) wins. Tested by creating rule A then rule B with same priority and confirming A's category is applied."
        test_recipe:
          setup: ["Logical clock. Plan with feature_bank_rules=true. Company with bank connection."]
          setup_api_calls:
            - *c_clock
            - *c_plan
            - *c_company2
            - *c_adm2
            - call: "POST /api/companies/${c_company2_id}/users/${c_adm2_id}/accept"
              payload: {}
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - call: "POST /api/companies/${c_company2_id}/subscription/activate"
              payload: { payment_method_token: "pm_x" }
              as: CompanyUser
              as_user_id: "${c_adm2_id}"
            - *c_bc
            - call: "POST /api/companies/${c_company2_id}/bank_connections/${c_bc_id}/authorize"
