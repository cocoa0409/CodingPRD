      - name: roll_forming_run_create_blocked_when_coil_lot_is_quarantined_by_a_coating_determination
        grounds:
          - validations[priority=7]
          - state_machines.CoilLot.AVAILABLE_to_QUARANTINED
          - state_machines.RollFormingRun.SCHEDULED_to_VOIDED
          - errors.ERR_COIL_LOT_NOT_AVAILABLE
          - calculations.failure_root_cause_determination
          - calculations.coil_mass_ledger
        distinguishing_aspect: |
          A different entity pair (RollFormingRun, CoilLot) and a different direction of dependency:
          creation of a child is gated on the parent lot's status, and the parent's status is moved
          by a third entity entirely - a FieldFailure determination on a completely unrelated dealer
          order that happens to share the design's CoatingSpec. The guard is also selective: an
          otherwise identical run against a lot of a different coating still succeeds, which proves
          the gate reads CoilLot.status and not the coating or the gauge.
