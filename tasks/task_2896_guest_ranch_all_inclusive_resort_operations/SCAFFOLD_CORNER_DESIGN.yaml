          rationale: "The §1.8 non_linear_state_machine instance already drives booking_status HELD -> CANCELLED while payment_status independently reaches PARTIALLY_REFUNDED on the same request and asserts both dimensions plus the conserved refunded/forfeited split; a breadth copy would only re-assert the same pair."

