            - "OutingConsent.${ca_id}.status == REQUESTED, the earlier valid consent untouched"
            - "Outing.${outing_id}.roster_count == 1 and Outing.${outing_id}.manifest_count == 1"
            - "GET /recreation/outing-consents?resident_id=${rb_id} returns total_count 0"
      - name: unauthorized_role_on_unknown_id_returns_403_unauthorized
        claim_type: priority_ordering
        grounds:
          - validations.priority_2_ERR_UNAUTHORIZED
          - validations.priority_5_ERR_RESIDENT_NOT_FOUND
        distinguishing_aspect: "Authorization at priority 2 outranks existence at priority 5, so a role that is not on the endpoint's roles list learns nothing about whether the id exists: the same fabricated resident id returns 403 ERR_UNAUTHORIZED to an ActivityAide and 404 ERR_RESIDENT_NOT_FOUND to an ActivityDirector."
        test_recipe:
          setup:
            - "no setup rows are needed; the resident id 00000000-0000-4000-8000-000000000999 is deliberately absent"
            - "PATCH /recreation/residents/{resident_id} is restricted to ActivityDirector, so ActivityAide is off the list"
          setup_api_calls: []
          trigger:
            - call: "PATCH /recreation/residents/00000000-0000-4000-8000-000000000999"
              payload: { status: "ON_LEAVE" }
              as: ActivityAide
              captures: { aide_err_id: $.data.error_id }
            - call: "PATCH /recreation/residents/00000000-0000-4000-8000-000000000999"
              payload: { status: "ON_LEAVE" }
              as: ActivityDirector
              captures: { director_err_id: $.data.error_id }
          assert:
            - "the ActivityAide call returns 403 and ${aide_err_id} == \"ERR_UNAUTHORIZED\""
            - "${aide_err_id} != \"ERR_RESIDENT_NOT_FOUND\", so existence is never leaked to an unauthorized caller"
            - "the ActivityDirector call returns 404 and ${director_err_id} == \"ERR_RESIDENT_NOT_FOUND\""
      - name: adaptive_equipment_union_not_stocked_rejected
        claim_type: conditional_validation
        grounds:
          - validations.priority_31_ERR_ADAPTIVE_EQUIPMENT_UNAVAILABLE
          - entities.ActivityProgram.fields.required_adaptive_equipment
          - entities.ActivityRoom.fields.equipment_available
        distinguishing_aspect: "The check is on the UNION of program requirements and the resident's assessed needs, so a room that stocks everything the program demands still fails when it lacks the resident's own HEARING_AMPLIFIER; the same resident enrolls successfully in a fully stocked room."
        test_recipe:
          setup:
            - "one assessed resident whose adaptive_equipment_needs is [HEARING_AMPLIFIER]"
            - "one program whose required_adaptive_equipment is [LARGE_PRINT]"
            - "room PARTIAL stocks only [LARGE_PRINT]; room FULL stocks [LARGE_PRINT, HEARING_AMPLIFIER]"
            - "one SCHEDULED session in each room"
          setup_api_calls:
            - call: "POST /recreation/residents"
              payload: { full_name: "Equipment Edna", room_number: "503A", admission_date: "2026-07-27" }
              as: ActivityDirector
              captures: { res_id: $.data.id }
