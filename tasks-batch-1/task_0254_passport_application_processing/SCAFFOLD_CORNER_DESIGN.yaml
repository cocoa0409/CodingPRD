              as_user_id: "${appl_id}"
              captures: { app_v1: "$.data.version" }
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", resource_kind: "URGENT_TRAVEL_COUNTER", counter_id: "${counter1_id}", start_utc: "2026-06-09T09:00:00Z", end_utc: "2026-06-09T09:30:00Z", expected_application_version: "${app_v1}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_v2: "$.data.application_id" }
            - call: "GET /applications/${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_v_now: "$.data.version" }
          trigger:
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", resource_kind: "URGENT_TRAVEL_COUNTER", counter_id: "${counter2_id}", start_utc: "2026-06-09T11:00:00Z", end_utc: "2026-06-09T11:30:00Z", expected_application_version: "${app_v_now}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "data.error_id == \"ERR_DUPLICATE_URGENT_APPOINTMENT\""

      - name: begin_verification_fee_unpaid_excluded
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=16]
          - errors[ERR_FEE_UNPAID]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / begin_verification_requires_feeassessment_paid
          rationale: "The Application<-FeeAssessment PAID gate on begin-verification is the depth probe of the named §1.8 instance."

      - name: state_vs_fiscal_priority_excluded
        claim_type: Priority conflict
        grounds:
          - validations[priority=5]
          - validations[priority=16]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_business_fiscal_on_begin_verification
          rationale: "The state(p5)-vs-fiscal(p16) priority ordering is the depth probe of the named §1.8 instance."

  # ===========================================================================
  # SECTION: errors  (claim-extraction-guide Table 6 — triggerability of codes
  # not already exercised above or in §1.8)
  # ===========================================================================
  - section: errors
    instances:
      - name: error_stale_version_on_appointment_book_excluded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[appointment-book-stale-application]
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_evaluation_order_urgent_surcharge_pinned_after_book
          rationale: "ERR_STALE_VERSION triggerability via the OCC write_endpoint POST /appointments is asserted through the urgent-booking version chain of the named §1.8 instance; a dedicated stale-version 412 negative is the natural extension of that same OCC field."

      - name: error_stale_version_on_submit_explicit_412
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
          - concurrency_rules[feeassessment-create-stale-application]
          - validations[priority=17]
        distinguishing_aspect: "Submitting with expected_application_version one less than the application's current version (after a name-change cascade bumped it) returns ERR_STALE_VERSION (412) — the OCC stale-version negative on POST /applications/{id}/submit, not covered by any §1.8 instance which only uses correct versions."
        test_recipe:
          setup:
            - "Adult RENEWAL BOOK application with name_change_requested true (creation cascade sets name_change_status PENDING_EVIDENCE, but version is captured fresh at creation as v0); PASS photo and NAME_CHANGE_EVIDENCE doc attached."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "StaleSub", date_of_birth: "1985-01-01", email: "stalesub@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "RENEWAL", product_type: "BOOK", service_level: "ROUTINE", name_change_requested: true, prior_name: "Old" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "NAME_CHANGE_EVIDENCE", doc_kind: "MARRIAGE_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0} - 1" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 412"
            - "data.error_id == \"ERR_STALE_VERSION\""

  # ===========================================================================
  # SECTION: rbac  (claim-extraction-guide Table 7)
  # Role denial, authentication, and segregation-of-duties corners.
  # ===========================================================================
  - section: rbac
    instances:
      - name: missing_auth_headers_unauthenticated
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Calling GET /applications/{id} without X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401); the endpoint is authenticated (POST /applicants and clock-set are the only exemptions)."
        test_recipe:
          setup:
            - "A DRAFT application exists; the trigger call omits auth headers entirely."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Anon", date_of_birth: "1990-01-01", email: "anon@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "GET /applications/${app_id}"
              payload: {}
              as: NONE
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 401"
            - "data.error_id == \"ERR_UNAUTHENTICATED\""
            - "NOTE: the trigger call is sent with NO X-User-Role and NO X-User-ID headers"

      - name: applicant_cannot_adjudicate_forbidden
        claim_type: role_denial
        grounds:
          - roles.Applicant
          - roles.Adjudicator
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "An Applicant invoking POST /applications/{id}/adjudicate (an Adjudicator-exclusive operation) is rejected ERR_FORBIDDEN (403) regardless of application state — segregation of role from operation."
        test_recipe:
          setup:
            - "Any application exists; an Applicant attempts the adjudicator-only adjudicate endpoint."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Wrong", date_of_birth: "1990-01-01", email: "wrongrole@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id" }
          trigger:
            - call: "POST /applications/${app_id}/adjudicate"
              payload: { decision: "APPROVE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 403"
            - "data.error_id == \"ERR_FORBIDDEN\""

      - name: acceptance_agent_cannot_create_facility_forbidden
        claim_type: role_denial
        grounds:
          - roles.AcceptanceAgent
          - roles.Adjudicator
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "An AcceptanceAgent invoking POST /acceptance-facilities (an Adjudicator-exclusive admin operation) is rejected ERR_FORBIDDEN (403); peer roles own non-overlapping operation sets."
        test_recipe:
          setup:
            - "An acceptance agent exists and attempts to create a facility."
          setup_api_calls:
            - call: "POST /acceptance-facilities"
              payload: { name: "Seed Facility", state_code: "CA" }
              as: Adjudicator
              captures: { fac_id: "$.data.id" }
            - call: "POST /acceptance-agents"
              payload: { name: "Agent A", badge_number: "C-8", facility_id: "${fac_id}" }
              as: Adjudicator
              captures: { agent_id: "$.data.id" }
          trigger:
            - call: "POST /acceptance-facilities"
              payload: { name: "Rogue Facility", state_code: "NY" }
              as: AcceptanceAgent
              as_user_id: "${agent_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 403"
            - "data.error_id == \"ERR_FORBIDDEN\""

      - name: agent_verify_doc_on_unassigned_application_sod
        claim_type: Segregation of duties
        grounds:
          - validations[priority=7]
          - errors[ERR_SOD_VIOLATION]
          - state_machines.SupportingDocument.PENDING_to_ACCEPTED
          - entities.Application.fields.assigned_acceptance_agent_id
        distinguishing_aspect: "An AcceptanceAgent who is NOT the application's assigned_acceptance_agent_id (a different agent began verification) verifying a document returns ERR_SOD_VIOLATION (403); the verify SoD leg is distinct from the adjudicate-vs-agent SoD the §1.8 instance covers."
        test_recipe:
          setup:
            - "Adult NEW BOOK application in IN_VERIFICATION begun by agent A; a second agent B exists and attempts to verify a PENDING IDENTITY doc."
          setup_api_calls:
            - call: "POST /acceptance-facilities"
              payload: { name: "Downtown", state_code: "CA" }
              as: Adjudicator
              captures: { fac_id: "$.data.id" }
            - call: "POST /acceptance-agents"
              payload: { name: "Agent A", badge_number: "C-9", facility_id: "${fac_id}" }
              as: Adjudicator
              captures: { agent_a_id: "$.data.id" }
            - call: "POST /acceptance-agents"
              payload: { name: "Agent B", badge_number: "C-10", facility_id: "${fac_id}" }
              as: Adjudicator
              captures: { agent_b_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_legal_name: "SodVerify", date_of_birth: "1990-01-01", email: "sodverify@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { id_doc_id: "$.data.id" }
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { fee_id: "$.data[0].id" }
            - call: "POST /fee-assessments/${fee_id}/pay"
              payload: { amount_tendered_cents: 16500 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/begin-verification"
              payload: {}
              as: AcceptanceAgent
              as_user_id: "${agent_a_id}"
          trigger:
            - call: "POST /documents/${id_doc_id}/verify"
              payload: { outcome: "ACCEPT" }
              as: AcceptanceAgent
              as_user_id: "${agent_b_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status == 403"
            - "data.error_id == \"ERR_SOD_VIOLATION\""

      - name: sod_adjudicator_equals_agent_excluded
        claim_type: Segregation of duties
        grounds:
          - validations[priority=7]
          - errors[ERR_SOD_VIOLATION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / sod_safety_beats_state_terminal_on_adjudicate
          rationale: "The adjudicator-is-the-assigned-agent SoD block on adjudicate is the depth probe of the named §1.8 instance."

  # ===========================================================================
  # SECTION: cross_cutting_complexity_layers  (claim-extraction-guide §8)
  # OCC version-increment claim and derived-field reconciliation not covered above.
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_version_increments_on_each_write
        claim_type: optimistic_concurrency
        grounds:
          - entities.Application.common_fields
          - state_machines.Application.DRAFT_to_SUBMITTED
          - validations[priority=17]
        distinguishing_aspect: "Application.version starts at 1 at creation and increments by exactly 1 on submit (a mutation), so the version observed before submit differs from the version after by 1; this is the version-increments-on-write claim underpinning OCC, distinct from the stale-version negatives."
        test_recipe:
          setup:
            - "Adult NEW BOOK application DRAFT with PASS photo and both docs attached."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Vers", date_of_birth: "1990-01-01", email: "vers@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", v_create: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /applications/${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { v_before: "$.data.version" }
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${v_before}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { v_after: "$.data.version" }
          assert:
            - "Application.${app_id}.version at creation == 1"
            - "Application.${app_id}.version after submit == ${v_before} + 1"

      - name: derived_field_total_fees_paid_reconciles_after_pay
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Applicant.fields.total_fees_paid_cents
          - state_machines.FeeAssessment.UNPAID_to_PAID
          - calculations.fee_ledger_conservation
        distinguishing_aspect: "Applicant.total_fees_paid_cents is 0 before payment and equals the paid amount 16500 after a single pay; the denormalized ledger reconciles immediately on the pay write (no refund here, distinct from the §1.8 conservation instances which net to 0)."
        test_recipe:
          setup:
            - "Adult NEW BOOK application SUBMITTED with UNPAID fee 16500; total_fees_paid_cents currently 0."
          setup_api_calls:
            - call: "POST /applicants"
              payload: { full_legal_name: "Ledger", date_of_birth: "1990-01-01", email: "ledger@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /applicants/${appl_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { paid_before: "$.data.total_fees_paid_cents" }
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { fee_id: "$.data[0].id" }
          trigger:
            - call: "POST /fee-assessments/${fee_id}/pay"
              payload: { amount_tendered_cents: 16500 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /applicants/${appl_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { paid_after: "$.data.total_fees_paid_cents" }
          assert:
            - "Applicant.${appl_id}.total_fees_paid_cents before pay == 0"
            - "Applicant.${appl_id}.total_fees_paid_cents after pay == 16500"

  # ===========================================================================
  # SECTION: consistency_model  (claim-extraction-guide §9)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_urgent_fee_visible_in_same_booking_response_chain
        claim_type: immediate
        grounds:
          - entities.Application.fields.urgent_travel
          - entities.FeeAssessment.fields.total_due_cents
          - state_machines.Appointment.BOOKED_to_CANCELLED
        distinguishing_aspect: "immediate consistency: booking an urgent appointment flips Application.urgent_travel true and the re-derived FeeAssessment.total_due_cents (22500) is visible on the very next read with no lag — verified by a single read immediately after the booking call returns."
        test_recipe:
          setup:
            - "Adult NEW BOOK ROUTINE application SUBMITTED with UNPAID fee 16500; an urgent counter exists."
          setup_api_calls:
            - call: "POST /urgent-travel-counters"
              payload: { name: "Counter 1", cleanup_buffer_minutes: 15 }
              as: Adjudicator
              captures: { counter_id: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_legal_name: "Immed", date_of_birth: "1990-01-01", email: "immed@x.com" }
              as: Applicant
              captures: { appl_id: "$.data.id" }
            - call: "POST /applications"
              payload: { applicant_id: "${appl_id}", application_type: "NEW", product_type: "BOOK", service_level: "ROUTINE" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_id: "$.data.id", app_v0: "$.data.version" }
            - call: "POST /applications/${app_id}/photos"
              payload: { width_px: 600, height_px: 600, head_height_fraction: 0.60, background_is_white: true }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "IDENTITY", doc_kind: "DRIVERS_LICENSE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/documents"
              payload: { doc_category: "CITIZENSHIP", doc_kind: "BIRTH_CERTIFICATE", declared_quality: 100 }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v0}" }
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { app_v1: "$.data.version" }
          trigger:
            - call: "POST /appointments"
              payload: { application_id: "${app_id}", resource_kind: "URGENT_TRAVEL_COUNTER", counter_id: "${counter_id}", start_utc: "2026-06-09T09:00:00Z", end_utc: "2026-06-09T09:30:00Z", expected_application_version: "${app_v1}" }
              as: Applicant
              as_user_id: "${appl_id}"
            - call: "GET /applications/${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { urgent_flag: "$.data.urgent_travel" }
            - call: "GET /fee-assessments?application_id=${app_id}"
              payload: {}
              as: Applicant
              as_user_id: "${appl_id}"
              captures: { total_now: "$.data[0].total_due_cents" }
          assert:
            - "Application.${app_id}.urgent_travel == true (visible immediately after booking)"
            - "FeeAssessment.total_due_cents == 22500 (re-derived in the same request, visible on next read)"
