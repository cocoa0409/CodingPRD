  - rule_id: non_linear_state_machine
    instances:
      - name: inspection_record_two_dimensions_advance_independently
        grounds:
          - state_machines.InspectionRecord.SCREENED_to_PASSED
          - state_machines.InspectionRecord.NONE_to_REFERRED
          - state_machines.InspectionRecord.REFERRED_to_CITED
          - entities.InspectionRecord.fields.inspection_status
          - entities.InspectionRecord.fields.enforcement_status
          - calculations.enforcement_penalty_cents
        distinguishing_aspect: |
          Non-linearity by PARALLEL DIMENSIONS on one row: inspection_status is
          already in its terminal state PASSED when enforcement_status walks
          NONE -> REFERRED -> CITED, so a terminal state on one dimension neither
          blocks nor is disturbed by transitions on the other. A single-dimension
          machine would have to reject the referral of a closed inspection.
        test_recipe:
          setup:
