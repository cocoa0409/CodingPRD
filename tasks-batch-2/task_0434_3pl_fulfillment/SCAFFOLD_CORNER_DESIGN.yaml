# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests) — task 0434
#
# Breadth probe complementing §1.8's depth probe. Every grounds[] ref resolves
# into SCAFFOLD.yaml §1.1-§1.7. Every setup_api_calls/trigger call resolves to a
# §1.5 endpoint; every payload field is a §1.5 input; every ${var} is bound by an
# earlier captures: line. section:/claim_type: values are taken verbatim from
# references/claim-extraction-guide.md (no invented categories).
#
# Sections covered: entities, state_machines, calculations, validations,
# endpoints, errors, rbac, cross_cutting_layers, consistency_model.
#
# excluded_because: stubs name an existing §1.8 instance by its exact name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_client_returns_201_with_defaults_and_zero_balances
        claim_type: Creation
        grounds:
          - entities.Client.fields.status
          - entities.Client.fields.storage_balance_cents
          - entities.Client.fields.handling_balance_cents
          - endpoints[POST /clients]
        distinguishing_aspect: |
          POST /clients with only the required name + two required rate fields
          returns 201 with status==ACTIVE, storage_balance_cents==0,
          handling_balance_cents==0, and the optional rate fields defaulted to 0.
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /clients"
              payload: { name: "Acme3PL", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id, st: $.data.status }
          assert:
            - "response status code == 201"
            - "Client.${cli}.status == ACTIVE"
            - "Client.${cli}.storage_balance_cents == 0"
            - "Client.${cli}.handling_balance_cents == 0"
            - "Client.${cli}.handling_rate_per_extra_unit_cents == 0"
            - "Client.${cli}.handling_surcharge_per_extra_carton_cents == 0"
            - "Client.${cli}.carrier_discount_bps == 0"
            - "Client.${cli}.version == 1"

      - name: create_sku_missing_required_unit_volume_cc_rejected
        claim_type: Required Fields
        grounds:
          - entities.Sku.fields.unit_volume_cc
          - endpoints[POST /clients/{clientId}/skus]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          unit_volume_cc has source:input and no default; a POST that omits it is
          rejected with ERR_INVALID_REQUEST (400), no Sku created.
        test_recipe:
          setup:
            - "One ACTIVE client"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "ReqCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id }
          trigger:
            - call: "POST /clients/${cli}/skus"
              payload: { code: "NOVOL" }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 400"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: get_bin_returns_computed_occupied_cc_and_system_fields
        claim_type: Computed Fields
        grounds:
          - entities.Bin.fields.occupied_cc
          - entities.Bin.fields.status
          - endpoints[GET /bins/{binId}]
        distinguishing_aspect: |
          A freshly created Bin reports computed occupied_cc==0, system status==OPEN,
          and a server-minted id/created_at — input-supplied occupied_cc/status are
          ignored (only location_code, bin_type, capacity_cc are accepted on create).
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls:
            - call: "POST /bins"
              payload: { location_code: "G-CORNER-01", bin_type: "GENERAL", capacity_cc: 50000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
          trigger:
            - call: "GET /bins/${bin}"
              payload: {}
              as: ReceivingClerk
              captures: { occ: $.data.occupied_cc, st: $.data.status }
          assert:
            - "Bin.${bin}.occupied_cc == 0"
            - "Bin.${bin}.status == OPEN"
            - "Bin.${bin}.capacity_cc == 50000"
            - "Bin.${bin}.version == 1"

      - name: get_client_nonexistent_id_returns_client_not_found
        claim_type: Not Found
        grounds:
          - entities.Client
          - endpoints[GET /clients/{clientId}]
          - errors[ERR_CLIENT_NOT_FOUND]
        distinguishing_aspect: |
          GET /clients/{id} for a syntactically-valid but non-existent UUID returns
          ERR_CLIENT_NOT_FOUND (404).
        test_recipe:
          setup:
            - "Empty DB"
          setup_api_calls: []
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 404"
            - "response error_id == ERR_CLIENT_NOT_FOUND"

      - name: billing_charge_is_immutable_event_only_id_and_created_at
        claim_type: Immutability
        grounds:
          - entities.BillingCharge
          - entities.BillingCharge.fields.posted
          - endpoints[GET /billing-charges/{chargeId}]
        distinguishing_aspect: |
          BillingCharge has common_fields:false (append-only event): the persisted
          STORAGE charge carries id + created_at + posted==true but NO version or
          updated_at field, and there is no update/delete endpoint for it in §1.5.
        test_recipe:
          setup:
            - "Client with one PALLET bin holding its own units; one STORAGE charge accrued for 1 day"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "ImmCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "P-IMM-01", bin_type: "PALLET", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 4 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 4 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/storage/accrue"
              payload: { days: 1 }
              as: BillingClerk
              captures: { chg: $.data.id }
          trigger:
            - call: "GET /billing-charges/${chg}"
              payload: {}
              as: BillingClerk
              captures: { posted: $.data.posted }
          assert:
            - "BillingCharge.${chg}.posted == true"
            - "BillingCharge.${chg}.charge_type == STORAGE"
            - "BillingCharge.${chg}.amount_cents == 1000"
            - "BillingCharge.${chg} response data has no 'version' field"
            - "BillingCharge.${chg} response data has no 'updated_at' field"

      - name: list_clients_pagination_envelope_fields_present
        claim_type: Listing
        grounds:
          - entities.Client
          - endpoints[GET /clients]
        distinguishing_aspect: |
          GET /clients with limit=1&offset=0 over 2 clients returns an array of 1
          and meta pagination fields total_count==2, has_more==true.
        test_recipe:
          setup:
            - "Two ACTIVE clients onboarded"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "PageA", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
            - call: "POST /clients"
              payload: { name: "PageB", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
          trigger:
            - call: "GET /clients"
              payload: { limit: 1, offset: 0 }
              as: BillingClerk
              captures: { tot: $.meta.total_count }
          assert:
            - "response data array length == 1"
            - "response total_count == 2"
            - "response has_more == true"

  # ===========================================================================
  # SECTION: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: receive_from_already_received_receipt_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Receipt.ANNOUNCED_to_RECEIVED
          - errors[ERR_RECEIPT_NOT_ANNOUNCED]
        distinguishing_aspect: |
          Receive requires ANNOUNCED; a second receive on a receipt already in
          RECEIVED is rejected with ERR_RECEIPT_NOT_ANNOUNCED and received_qty
          is left unchanged.
        test_recipe:
          setup:
            - "A receipt already moved ANNOUNCED -> RECEIVED with received_qty 5"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "RecvCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-SM-01", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 5 }
              as: ReceivingClerk
          trigger:
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 9 }
              as: ReceivingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "response error_id == ERR_RECEIPT_NOT_ANNOUNCED"
            - "Receipt.${rcpt}.status == RECEIVED"
            - "Receipt.${rcpt}.received_qty == 5"

      - name: cancel_receipt_from_received_state_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Receipt.ANNOUNCED_to_CANCELLED
          - errors[ERR_RECEIPT_NOT_ANNOUNCED]
        distinguishing_aspect: |
          Cancel is only legal from ANNOUNCED; cancelling a receipt already in
          RECEIVED is rejected with ERR_RECEIPT_NOT_ANNOUNCED.
        test_recipe:
          setup:
            - "A receipt moved ANNOUNCED -> RECEIVED"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "CnclCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-SM-02", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 5 }
              as: ReceivingClerk
          trigger:
            - call: "POST /clients/${cli}/receipts/${rcpt}/cancel"
              payload: {}
              as: ReceivingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "response error_id == ERR_RECEIPT_NOT_ANNOUNCED"
            - "Receipt.${rcpt}.status == RECEIVED"

      - name: pack_before_all_picks_confirmed_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Order.PICKING_to_PACKED
          - errors[ERR_PICKS_INCOMPLETE]
        distinguishing_aspect: |
          Pack requires every PickTask PICKED; packing while the order's single pick
          task is still ASSIGNED (never confirmed) is rejected with ERR_PICKS_INCOMPLETE
          and the order stays PICKING.
        test_recipe:
          setup:
            - "Order in PICKING whose pick task has NOT been confirmed"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "PackCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-SM-03", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 4 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 4 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 2 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
          trigger:
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 2 } ] }
              as: PackStation
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "response error_id == ERR_PICKS_INCOMPLETE"
            - "Order.${ord}.status == PICKING"

      - name: confirm_pick_already_picked_rejected_terminal_lock
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PickTask.ASSIGNED_to_PICKED
          - errors[ERR_PICK_NOT_ASSIGNED]
        distinguishing_aspect: |
          PICKED is terminal for a PickTask; a second confirm on an already-PICKED
          task is rejected with ERR_PICK_NOT_ASSIGNED, leaving picked_qty unchanged.
        test_recipe:
          setup:
            - "A pick task already confirmed (ASSIGNED -> PICKED) with picked_qty 2"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "PickCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-SM-04", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 4 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 4 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 2 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id" }
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 2 }
              as: PickOperator
          trigger:
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 2 }
              as: PickOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status code == 409"
            - "response error_id == ERR_PICK_NOT_ASSIGNED"
            - "PickTask.${pt0}.status == PICKED"
            - "PickTask.${pt0}.picked_qty == 2"

      - name: deliver_shipment_valid_transition_labelled_to_delivered
        claim_type: Valid Transition
        grounds:
          - state_machines.Shipment.LABELLED_to_DELIVERED
          - entities.Shipment.fields.status
        distinguishing_aspect: |
          Delivering a LABELLED shipment whose order is SHIPPED moves the shipment
          LABELLED -> DELIVERED (a valid forward transition) and returns status
          DELIVERED.
        test_recipe:
          setup:
            - "Order SHIPPED with a LABELLED, undelivered shipment"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "DelivCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, carrier_discount_bps: 0 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-SM-05", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 2 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 2 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 2 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id" }
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 2 }
              as: PickOperator
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 2 } ] }
              as: PackStation
            - call: "POST /clients/${cli}/shipments"
              payload: { order_id: "${ord}" }
              as: ShipStation
              captures: { shp: $.data.id }
            - call: "POST /clients/${cli}/orders/${ord}/ship"
              payload: {}
              as: ShipStation
          trigger:
            - call: "POST /clients/${cli}/shipments/${shp}/deliver"
              payload: {}
              as: ShipStation
              captures: { st: $.data.status }
          assert:
            - "response status code == 200"
            - "Shipment.${shp}.status == DELIVERED"

      - name: close_return_valid_transition_graded_to_closed
        claim_type: Valid Transition
        grounds:
          - state_machines.Return.GRADED_to_CLOSED
          - entities.Return.fields.status
        distinguishing_aspect: |
          Closing a GRADED return moves it GRADED -> CLOSED (terminal) and returns
          status CLOSED with grade preserved.
        test_recipe:
          setup:
            - "A DAMAGED-graded return against a shipped order, not yet closed"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "CloseCo", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, carrier_discount_bps: 0 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-SM-06", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 2 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 2 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 2 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id" }
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 2 }
              as: PickOperator
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 2 } ] }
              as: PackStation
            - call: "POST /clients/${cli}/shipments"
              payload: { order_id: "${ord}" }
              as: ShipStation
            - call: "POST /clients/${cli}/orders/${ord}/ship"
              payload: {}
              as: ShipStation
            - call: "POST /clients/${cli}/returns"
              payload: { order_id: "${ord}", sku_id: "${sku}", bin_id: "${bin}", qty: 1 }
