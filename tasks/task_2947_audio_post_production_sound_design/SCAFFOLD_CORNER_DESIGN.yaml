  - section: errors
    instances:

      - name: error_auth_gate_precedes_the_role_gate_and_both_precede_the_body_check
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=1]
          - validations[priority=2]
        distinguishing_aspect: "An empty X-User-ID header yields ERR_UNAUTHENTICATED (401) even when the same request would also fail the role gate and the body check, a wrong-role but authenticated caller yields ERR_ROLE_NOT_PERMITTED (403), and only the right role mutates state — proving the 1 → 2 → 12 ordering."
        test_recipe:
          setup:
            - "One project, picture NOT_LOCKED. No other state is required."
            - "The blank-identity calls send the X-User-ID header present but empty (\"\"), never absent-with-whitespace."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
