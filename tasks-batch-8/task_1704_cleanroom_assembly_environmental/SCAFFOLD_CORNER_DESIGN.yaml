              as: QualityAssurance
              captures: { sp_x2: $.data.id }
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_x2}", result_value: 1, sampled_at: "2026-08-10T00:00:00Z" }
              as: EnvironmentTech
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_x2}", result_value: 2, sampled_at: "2026-08-15T00:00:00Z" }
              as: EnvironmentTech
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_x2}", result_value: 3, sampled_at: "2026-08-20T00:00:00Z" }
              as: EnvironmentTech
          trigger:
            - call: "POST /cleanroom/audits"
              payload: { customer_code: "CUST-X2", cleanroom_id: "${room_x2}", window_start: "2026-08-10T00:00:00Z", window_end: "2026-08-20T00:00:00Z" }
              as: QualityAssurance
              captures: { aud_x2: $.data.id }
            - call: "POST /cleanroom/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-21T00:00:00Z" }
              as: QualityAssurance
            - call: "POST /cleanroom/audits/${aud_x2}/open"
              payload: {}
              as: QualityAssurance
          assert:
            - "Audit opens successfully (window started)"
            - "Scope membership: sample at window_start (2026-08-10T00:00:00Z) is IN scope; sample at window_end (2026-08-20T00:00:00Z) is OUT of scope  (half-open [start, end))"

  # ===========================================================================
  # Section: consistency_model — immediate visibility of mutations.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: sample_creation_immediately_reflects_excursion_on_room_read
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
          - "state_machines.Cleanroom"
        distinguishing_aspect: "After POST /cleanroom/samples creates an ACTION excursion, the very next GET /cleanroom/rooms/{id} (no delay) shows environment_posture == ACTION — immediate consistency, no eventual lag."
        test_recipe:
          setup: ["Room CR-CM1 with ACTIVE PARTICLE point SP-CM1, posture IN_CONTROL"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-CM1", iso_class: "ISO_7", particle_alert_limit: 300000, particle_action_limit: 352000, viable_alert_limit: 50, viable_action_limit: 100, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_cm1: $.data.id }
            - call: "POST /cleanroom/rooms/${room_cm1}/sampling-points"
              payload: { point_code: "SP-CM1", metric: "PARTICLE", zone_iso_class: "ISO_7" }
              as: QualityAssurance
              captures: { sp_cm1: $.data.id }
          trigger:
            - call: "POST /cleanroom/samples"
              payload: { sampling_point_id: "${sp_cm1}", result_value: 400000, sampled_at: "2026-08-01T09:00:00Z" }
              as: EnvironmentTech
              captures: { exc_cm1: $.data.triggered_excursion_id }
            - call: "GET /cleanroom/rooms/${room_cm1}"
              as: QualityAssurance
              captures: { posture_cm1: $.data.environment_posture }
          assert:
            - "Immediately after the sample POST returns, GET room shows environment_posture == ACTION  (no reconciliation delay)"
            - "Excursion.${exc_cm1}.status == OPEN AND severity == ACTION"
