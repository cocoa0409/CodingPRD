scaffold_difficulty_design:
  # =====================================================================
  # Rule 1 — dual_variant_calc: two dual-variant calculations on DIFFERENT
  # entity domains: efc_calculation (ISIRRecord domain) and sap_evaluation
  # (Student domain).
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: efc_provisional_vs_verified_divergence
        grounds:
          - calculations.efc_calculation
          - entities.ISIRRecord.fields.efc_provisional_cents
          - entities.ISIRRecord.fields.efc_verified_cents
          - state_machines.VerificationCase.UNDER_REVIEW_to_COMPLETED_SATISFIED
        distinguishing_aspect: |
          Dual-variant calculation on the ISIRRecord domain: identical household
          structure produces efc_provisional_cents=742000 from as-reported AGI
          45000_00 and efc_verified_cents=1071000 after a verified AGI correction
          to 52000_00 — the two variants of efc_calculation diverge by 329000 cents.
        test_recipe:
          setup:
            - "AidYear 2026-2027 OPEN with one ACTIVE PELL fund and a contiguous pell_schedule"
            - "Student S (DEPENDENT, IN_STATE, FULL_TIME, grade 1) with SSN 111223333 (deterministically verification-SELECTED at rate 0.50)"
            - "ISIR imported with agi 45000_00, untaxed 0, assets 500_00, household 4, in-college 1; verification SELECTED; VerificationCase exists in DOCUMENTS_REQUESTED with 3 REQUESTED docs"
            - "All 3 required docs marked RECEIVED then ACCEPTED; case UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { pell_id: "$.data.id" }
            - call: "POST /api/fund-types/${pell_id}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "111223333", full_name: "Vera Provisional", email: "vera@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_id: "$.data.id" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_id}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 4500000, untaxed_income_cents: 0, asset_net_worth_cents: 50000, cps_selection_flag: false }
              as: AidOfficer
              captures: { isir_id: "$.data.id" }
            - call: "GET /api/students/${stu_id}/verification-cases"
              payload: {}
              as: AidOfficer
              captures: { vc_id: "$.data[0].id" }
            - call: "GET /api/verification-cases/${vc_id}/documents"
              payload: {}
              as: AidOfficer
              captures: { doc1: "$.data[0].id", doc2: "$.data[1].id", doc3: "$.data[2].id" }
            - call: "POST /api/verification-documents/${doc1}/mark-received"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-documents/${doc2}/mark-received"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-documents/${doc3}/mark-received"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-documents/${doc1}/accept"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-documents/${doc2}/accept"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-documents/${doc3}/accept"
              payload: {}
              as: AidOfficer
            - call: "POST /api/verification-cases/${vc_id}/begin-review"
              payload: {}
              as: AidOfficer
          trigger:
            - call: "POST /api/verification-cases/${vc_id}/complete-satisfied"
              payload: { resolution_notes: "AGI corrected per tax transcript", verified_agi_cents: 5200000 }
              as: AidOfficer
            - call: "GET /api/isir-records/${isir_id}"
              payload: {}
              as: AidOfficer
          assert:
            - "ISIRRecord.${isir_id}.efc_provisional_cents == 742000"
            - "ISIRRecord.${isir_id}.efc_verified_cents == 1071000"
            - "ISIRRecord.${isir_id}.efc_official_cents == 1071000"
            - "VerificationCase.${vc_id}.status == COMPLETED_SATISFIED"

      - name: sap_standard_vs_transfer_variant_divergence
        grounds:
          - calculations.sap_evaluation
          - entities.Student.fields.sap_status
        distinguishing_aspect: |
          Dual-variant calculation on the Student domain (different domain from
          ISIRRecord EFC): with attempted=45/completed=30 the STANDARD variant
          yields pace 6666 bps (fail, below 6667 floor) while the TRANSFER
          variant with transfer_credits=12 yields 7368 bps (pass) — identical
          stored fields, two valid algorithm variants, different outcomes.
        test_recipe:
          setup:
            - "Student T with cumulative_attempted_credits=45, cumulative_completed_credits=30, gpa_hundredths=250, sap_status NOT_EVALUATED"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { ssn: "333445555", full_name: "Sam Transfer", email: "sam@example.edu", residency: "IN_STATE", dependency_status: "INDEPENDENT", enrollment_status: "FULL_TIME", grade_level: 2, cumulative_attempted_credits: 45, cumulative_completed_credits: 30, gpa_hundredths: 250 }
              as: AidOfficer
              captures: { stu_t: "$.data.id" }
            - call: "POST /api/students/${stu_t}/evaluate-sap"
              payload: {}
              as: AidOfficer
              captures: { sap_after_std: "$.data.sap_status" }
          trigger:
            - call: "POST /api/students/${stu_t}/evaluate-sap"
              payload: { transfer_credits: 12 }
              as: AidOfficer
          assert:
            - "sap_after_std == WARNING (STANDARD variant pace 6666 bps < 6667 floor; failure from NOT_EVALUATED maps to WARNING)"
            - "Student.${stu_t}.sap_status == GOOD_STANDING (TRANSFER variant pace 7368 bps >= 6667 floor; all-pass from WARNING maps to GOOD_STANDING)"

      - name: pell_variant_proration_full_vs_half
        grounds:
          - calculations.pell_award_lookup
          - entities.Student.fields.enrollment_status
        distinguishing_aspect: |
          Dual-variant-like divergence inside pell_award_lookup driven by
          enrollment_status (a third subject domain — AwardPackage/Student):
          the same EFC=0 record maps to Pell 739500 at FULL_TIME (100% proration)
          and 369750 at HALF_TIME (50% proration, floor rounding), proving the
          proration arm changes results for identical EFC inputs.
        test_recipe:
          setup:
            - "AidYear OPEN with ACTIVE PELL fund (cap 739500) and ACTIVE SEOG fund"
            - "Student F FULL_TIME and Student H HALF_TIME, both DEPENDENT IN_STATE grade 1, both with ISIR agi 20000_00 / hh 4 / ncol 1 (EFC 0), both NOT verification-selected (cps flag false, SSNs 333445555-adjacent non-selected; use cps_selection_flag=false and SSN 333445555 which hashes 5347 >= 5000 NOT_SELECTED at rate 0.50 — for the second student use SSN 123456789 hash 7666 NOT_SELECTED)"
            - "Packages created and built for both students"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { pell_id: "$.data.id" }
            - call: "POST /api/fund-types/${pell_id}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "333445555", full_name: "Full Timer", email: "full@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_f: "$.data.id" }
            - call: "POST /api/students"
              payload: { ssn: "123456789", full_name: "Half Timer", email: "half@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "HALF_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_h: "$.data.id" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_f}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_h}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
            - call: "POST /api/award-packages"
              payload: { student_id: "${stu_f}", aid_year_id: "${ay_id}" }
              as: AidOfficer
              captures: { pkg_f: "$.data.id" }
            - call: "POST /api/award-packages"
              payload: { student_id: "${stu_h}", aid_year_id: "${ay_id}" }
              as: AidOfficer
              captures: { pkg_h: "$.data.id" }
            - call: "POST /api/award-packages/${pkg_f}/build"
              payload: {}
              as: AidOfficer
            - call: "POST /api/award-packages/${pkg_h}/build"
              payload: {}
              as: AidOfficer
          trigger:
            - call: "GET /api/award-packages/${pkg_f}/award-lines"
              payload: {}
              as: AidOfficer
              captures: { pell_line_f: "$.data[0].offered_cents" }
            - call: "GET /api/award-packages/${pkg_h}/award-lines"
              payload: {}
              as: AidOfficer
              captures: { pell_line_h: "$.data[0].offered_cents" }
          assert:
            - "pell_line_f == 739500"
            - "pell_line_h == 369750"
            - "Both packages have exactly one AwardLine (PELL) with sequence_number == 1"

  # =====================================================================
  # Rule 2 — combinatorial_formula: instances in DIFFERENT modes (a)/(b)/(c).
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: efc_tiered_marginal_with_asset_and_household_mode_a
        grounds:
          - calculations.efc_calculation
        distinguishing_aspect: |
          Mode (a) — formula with >=3 inputs and non-linear interaction: EFC for
          an INDEPENDENT student with agi 180000_00 + untaxed 5000_00 crosses all
          three marginal tiers (t1=110000, t2=350000, t3=6956000), adds the
          floored asset contribution 112800 (assets 3000000 - 1000000 allowance
          at 5.64%), and the division by number_in_college=1 yields 7528800;
          changing household_size from 2 to 3 shifts the IPA from 22000_00 to
          26000_00 and changes the result non-linearly.
        test_recipe:
          setup:
            - "AidYear OPEN with an ACTIVE PELL fund"
            - "Student W INDEPENDENT hh=2, ncol=1, agi 180000_00, untaxed 5000_00, assets 3000000, not verification-selected (SSN 123456789, hash 7666 >= 5000)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { pell_id: "$.data.id" }
            - call: "POST /api/fund-types/${pell_id}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "123456789", full_name: "Wealthy Indep", email: "w@example.edu", residency: "OUT_OF_STATE", dependency_status: "INDEPENDENT", enrollment_status: "FULL_TIME", grade_level: 3 }
              as: AidOfficer
              captures: { stu_w: "$.data.id" }
          trigger:
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_w}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 2, number_in_college: 1, agi_cents: 18000000, untaxed_income_cents: 500000, asset_net_worth_cents: 3000000, cps_selection_flag: false }
              as: AidOfficer
              captures: { isir_w: "$.data.id" }
          assert:
            - "ISIRRecord.${isir_w}.efc_provisional_cents == 7528800"
            - "ISIRRecord.${isir_w}.efc_official_cents == 7528800"

      - name: packaging_waterfall_circular_order_mode_c
        grounds:
          - calculations.packaging_waterfall
          - calculations.pell_award_lookup
          - calculations.stafford_cap_schedule
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          SUB's offer depends on remaining_need which depends on PELL+SEOG offers
          already fixed, while UNSUB's offer depends on remaining_coa_gap which
          SUB's offer also reduces. The pinned order (rank 1 PELL=739500, rank 2
          SEOG=200000, rank 3 SUB=350000, rank 4 UNSUB=200000, rank 5 INST=500000
          on COA 2400000 / EFC 0) yields total 1989500 with remaining_need 610500
          and remaining_coa_gap 410500 — evaluating INST before UNSUB would change
          UNSUB's headroom, so the order must be exactly as pinned.
        test_recipe:
          setup:
            - "AidYear OPEN; funds PELL(rank1, cap 739500, pool 0), SEOG(rank2, need_based, cap 200000, pool 1000000), SUB(rank3, FED, need_based, cap 350000, pool 0), UNSUB(rank4, FED, need_based=false, cap 200000, pool 0), INST_GRANT(rank5, INSTITUTIONAL, need_based, cap 500000, pool 800000) all ACTIVE"
            - "Student P DEPENDENT IN_STATE FULL_TIME grade 1, ISIR agi 20000_00 hh 4 ncol 1 (EFC 0), not selected"
            - "Package created in DRAFT"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_pell: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "SEOG", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 200000, pool_budget_cents: 1000000, packaging_rank: 2, requires_verification_complete: false }
              as: AidDirector
              captures: { f_seog: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "SUB", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 350000, pool_budget_cents: 0, packaging_rank: 3, requires_verification_complete: false }
              as: AidDirector
              captures: { f_sub: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "UNSUB", category: "FEDERAL_TITLE_IV", need_based: false, annual_cap_cents: 200000, pool_budget_cents: 0, packaging_rank: 4, requires_verification_complete: false }
              as: AidDirector
              captures: { f_unsub: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "INST_GRANT", category: "INSTITUTIONAL", need_based: true, annual_cap_cents: 500000, pool_budget_cents: 800000, packaging_rank: 5, requires_verification_complete: false }
              as: AidDirector
              captures: { f_inst: "$.data.id" }
            - call: "POST /api/fund-types/${f_pell}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/fund-types/${f_seog}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/fund-types/${f_sub}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/fund-types/${f_unsub}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/fund-types/${f_inst}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "333445555", full_name: "Pack Order", email: "p@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_p: "$.data.id" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_p}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
            - call: "POST /api/award-packages"
              payload: { student_id: "${stu_p}", aid_year_id: "${ay_id}" }
              as: AidOfficer
              captures: { pkg_p: "$.data.id" }
          trigger:
            - call: "POST /api/award-packages/${pkg_p}/build"
              payload: {}
              as: AidOfficer
            - call: "GET /api/award-packages/${pkg_p}/award-lines"
              payload: {}
              as: AidOfficer
          assert:
            - "AwardPackage.${pkg_p}.need_cents == 2400000"
            - "AwardPackage.${pkg_p}.total_offered_cents == 1989500"
            - "AwardPackage.${pkg_p}.gift_aid_cents == 1439500"
            - "AwardLine sequence 1 (PELL).offered_cents == 739500"
            - "AwardLine sequence 2 (SEOG).offered_cents == 200000"
            - "AwardLine sequence 3 (SUB).offered_cents == 350000"
            - "AwardLine sequence 4 (UNSUB).offered_cents == 200000"
            - "AwardLine sequence 5 (INST_GRANT).offered_cents == 500000"

      - name: pell_lookup_boundary_rows_mode_b
        grounds:
          - calculations.pell_award_lookup
        distinguishing_aspect: |
          Mode (b)-adjacent nested-boundary formula: the schedule lookup's
          inclusive [efc_min, efc_max] ranges mean EFC 150000 lands in the
          739500 row while EFC 150001 lands in the 500000 row — a 1-cent EFC
          change flips the award by 239500 cents, and the proration floor
          (739500*75/100 = 554625 exact, 739500*50/100 = 369750 exact) pins the
          rounding order (prorate after lookup, floor last).
        test_recipe:
          setup:
            - "AidYear OPEN with ACTIVE PELL fund"
            - "Student L: DEPENDENT hh 4 ncol 1 FULL_TIME, agi 30142_85 -> AI = 3014285-2400000 = 614285, IC = 110000 + half_up(114285*0.35)=39999.75->40000 -> EFC 150000 (row [0,150000])"
            - "Student M: identical but agi 30142_88 -> AI 614288, IC = 110000 + half_up(114288*0.35)=40000.80->40001 -> EFC 150001 (row [150001,300000]); the two EFCs straddle the 150000/150001 schedule boundary"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "PELL", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 739500, pool_budget_cents: 0, packaging_rank: 1, requires_verification_complete: false }
