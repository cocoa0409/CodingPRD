      - name: create_model_version_with_unknown_foreign_keys_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations.priority_4
          - errors.ERR_MODEL_NOT_FOUND
          - errors.ERR_TRAINING_DATASET_NOT_FOUND
        distinguishing_aspect: |
          entity_topology is `flat`, so ownership arrives as body foreign keys rather than URL
          nesting: priority 4 resolves body FKs left-to-right in the declared input order, so an
          unknown model_id yields ERR_MODEL_NOT_FOUND even when training_dataset_id is ALSO unknown,
          and the dataset code appears only once model_id resolves.
        test_recipe:
          setup:
            - "one Model and one APPROVED TrainingDataset exist, so each id can be made valid independently"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
