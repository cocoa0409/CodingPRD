scaffold_difficulty_design:
  # ------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains)
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: ce_audit_standard_vs_restoration_totals
        grounds:
          - calculations.ce_credit_audit_total
          - entities.CEAudit.fields.audit_variant
          - entities.CEAudit.fields.verified_hours
        distinguishing_aspect: |
          CE-hours domain (License/CECredit): identical VERIFIED credits produce
          verified_hours 10 under STANDARD (pre-cycle ETHICS credit excluded) vs 16
          under RESTORATION (12-month lookback admits it, caps x1.5) — different totals.
        test_recipe:
          setup:
            - "License issued at default clock 2026-08-01 (cycle [2026-08-01, 2031-08-01)) via RECIPROCITY FULL approval"
            - "VERIFIED credits: ETHICS 6h earned 2026-02-01 (before cycle, inside restoration lookback 2025-08-01); CONTENT 10h earned 2027-01-15"
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Ann Able", email: "ann@x.com", date_of_birth: "1990-01-01T00:00:00Z", ssn_last4: "1234", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/reciprocity-evaluations", payload: { source_state: "TX", source_license_type: "STANDARD", years_teaching: 5 }, as: CredentialEvaluator, captures: { re: $.data.id } }
            - { call: "POST /licensure/reciprocity-evaluations/${re}/finalize", payload: { mapping_mode: "DETERMINISTIC" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "TX State", degree_level: "BACHELORS", total_semester_hours: 120, courses: [ { course_code: "MATH101", credit_hours: 3, letter_grade: "A" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 18 }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "BACKGROUND_REVIEW" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "PENDING_DECISION" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "APPROVED" }, as: CredentialEvaluator }
            - { call: "GET /licensure/licenses?application_id=${app}", payload: {}, as: CredentialEvaluator, captures: { lic: "$.data[0].id" } }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "EthicsBoard", category: "ETHICS", hours: 6, earned_on: "2026-02-01T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { ce1: $.data.id } }
            - { call: "POST /licensure/ce-credits/${ce1}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "ContentCo", category: "CONTENT", hours: 10, earned_on: "2027-01-15T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { ce2: $.data.id } }
            - { call: "POST /licensure/ce-credits/${ce2}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-audits", payload: { audit_variant: "STANDARD" }, as: CredentialEvaluator, captures: { au_s: $.data.id, au_s_v: $.data.version } }
            - { call: "POST /licensure/ce-audits/${au_s}/determinations", payload: { expected_ce_audit_version: "${au_s_v}" }, as: CredentialEvaluator }
            - { call: "POST /licensure/ce-audits/${au_s}/state", payload: { to_status: "UNDER_REVIEW" }, as: CredentialEvaluator }
            - { call: "POST /licensure/ce-audits/${au_s}/state", payload: { to_status: "FAILED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-audits", payload: { audit_variant: "RESTORATION" }, as: CredentialEvaluator, captures: { au_r: $.data.id, au_r_v: $.data.version } }
          trigger:
            - { call: "POST /licensure/ce-audits/${au_r}/determinations", payload: { expected_ce_audit_version: "${au_r_v}" }, as: CredentialEvaluator }
          assert:
            - "CEAudit.${au_s}.verified_hours == 10"
            - "CEAudit.${au_s}.required_hours == 60"
            - "CEAudit.${au_r}.verified_hours == 16"
            - "CEAudit.${au_r}.required_hours == 90"

      - name: reciprocity_deterministic_vs_committee_mapping
        grounds:
          - calculations.reciprocity_equivalency_mapping
          - entities.ReciprocityEvaluation.fields.outcome
        distinguishing_aspect: |
          Reciprocity domain (ReciprocityEvaluation): identical (FL, PROFESSIONAL,
          years_teaching 5) input yields PARTIAL with 6 deficiency hours under
          DETERMINISTIC vs FULL with 0 under COMMITTEE (years >= 3 upgrade) —
          different outcomes on a different entity domain than the CE audit instance.
        test_recipe:
          setup:
            - "Two applicants each with a RECIPROCITY application and an open ReciprocityEvaluation carrying identical data (FL, PROFESSIONAL, 5 years)"
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Boa Bo", email: "boa@x.com", date_of_birth: "1988-05-01T00:00:00Z", ssn_last4: "2222", moral_character_attestation: true }, as: Anonymous, captures: { ap_a: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap_a}", pathway: "RECIPROCITY", subject_area: "SCIENCE", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap_a}", captures: { app_a: $.data.id } }
            - { call: "POST /licensure/applications/${app_a}/reciprocity-evaluations", payload: { source_state: "FL", source_license_type: "PROFESSIONAL", years_teaching: 5 }, as: CredentialEvaluator, captures: { re_a: $.data.id } }
            - { call: "POST /licensure/applicants", payload: { full_name: "Cal Co", email: "cal@x.com", date_of_birth: "1991-03-03T00:00:00Z", ssn_last4: "3333", moral_character_attestation: true }, as: Anonymous, captures: { ap_b: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap_b}", pathway: "RECIPROCITY", subject_area: "SCIENCE", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap_b}", captures: { app_b: $.data.id } }
            - { call: "POST /licensure/applications/${app_b}/reciprocity-evaluations", payload: { source_state: "FL", source_license_type: "PROFESSIONAL", years_teaching: 5 }, as: CredentialEvaluator, captures: { re_b: $.data.id } }
          trigger:
            - { call: "POST /licensure/reciprocity-evaluations/${re_a}/finalize", payload: { mapping_mode: "DETERMINISTIC" }, as: CredentialEvaluator }
            - { call: "POST /licensure/reciprocity-evaluations/${re_b}/finalize", payload: { mapping_mode: "COMMITTEE" }, as: CredentialEvaluator }
          assert:
            - "ReciprocityEvaluation.${re_a}.outcome == 'PARTIAL'"
            - "ReciprocityEvaluation.${re_a}.deficiency_subject_hours == 6"
            - "ReciprocityEvaluation.${re_b}.outcome == 'FULL'"
            - "ReciprocityEvaluation.${re_b}.deficiency_subject_hours == 0"

  # ------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) then (b))
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: deficiency_computation_multi_input_clamp
        grounds:
          - calculations.deficiency_credit_computation
          - entities.CredentialApplication.fields.deficiency_hours_required
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — min(subject_relevant_hours 20,
          RECOGNITION_CAP 18) = 18, subject_gap 30-18 = 12, + TEST_GAP_PENALTY 6 (no verified
          exams) + ALTERNATIVE addon 6, final min(30, ...) clamp: 24, not 42 and not 12.
        test_recipe:
          setup:
            - "ALTERNATIVE SCIENCE application with one VERIFIED transcript attested at 20 subject-relevant hours and no verified exams"
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Dee Di", email: "dee@x.com", date_of_birth: "1992-07-07T00:00:00Z", ssn_last4: "4444", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "ALTERNATIVE", subject_area: "SCIENCE", grade_band: "G5_8" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "City College", degree_level: "BACHELORS", total_semester_hours: 100, courses: [ { course_code: "BIO101", credit_hours: 4, letter_grade: "B" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 20 }, as: CredentialEvaluator }
          trigger:
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer, captures: { def_hours: $.data.deficiency_hours_required } }
          assert:
            - "CredentialApplication.${app}.deficiency_hours_required == 24"

      - name: gpa_per_course_rounding_order
        grounds:
          - calculations.coursework_gpa_scaling
          - entities.Transcript.fields.scaled_gpa
        distinguishing_aspect: |
          Mode (b): nested rounding order — two 0.75-credit A_MINUS courses give
          round(0.75*3.7, 2) = 2.78 per course, sum 5.56, gpa 5.56/1.5 = 3.71;
          the forbidden sum-then-round order gives 5.55/1.5 = 3.70. Pinned order: per-course first.
        test_recipe:
          setup:
            - "RECIPROCITY application with one transcript carrying courses MATH510 0.75h A_MINUS and MATH511 0.75h A_MINUS"
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Eli El", email: "eli@x.com", date_of_birth: "1993-09-09T00:00:00Z", ssn_last4: "5555", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "State U", degree_level: "MASTERS", total_semester_hours: 30, courses: [ { course_code: "MATH510", credit_hours: 0.75, letter_grade: "A_MINUS" }, { course_code: "MATH511", credit_hours: 0.75, letter_grade: "A_MINUS" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
          trigger:
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 1.5 }, as: CredentialEvaluator, captures: { gpa: $.data.scaled_gpa } }
          assert:
            - "Transcript.${tr}.scaled_gpa == 3.71"

  # ------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: application_deficiency_cycle_reentry
        grounds:
          - state_machines.CredentialApplication.EVALUATION_to_DEFICIENCY_PENDING
          - state_machines.CredentialApplication.DEFICIENCY_PENDING_to_EVALUATION
          - state_machines.DeficiencyPlan.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Cycle on CredentialApplication: EVALUATION -> DEFICIENCY_PENDING -> EVALUATION
          is reachable and clears deficiency_hours_required to 0 only via a COMPLETED plan.
        test_recipe:
          setup:
            - "ALTERNATIVE SCIENCE application in EVALUATION with deficiency_hours_required == 30 (no transcripts, no exams: 30 - 0 + 6 + 6 = 42 clamped to 30)"
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Fay Fa", email: "fay@x.com", date_of_birth: "1990-11-11T00:00:00Z", ssn_last4: "6666", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "ALTERNATIVE", subject_area: "SCIENCE", grade_band: "G5_8" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "DEFICIENCY_PENDING" }, as: CredentialEvaluator, captures: { app_v: $.data.version } }
            - { call: "POST /licensure/applications/${app}/deficiency-plans", payload: { expected_application_version: "${app_v}" }, as: CredentialEvaluator, captures: { plan: $.data.id } }
            - { call: "POST /licensure/deficiency-plans/${plan}/state", payload: { to_status: "ACCEPTED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/deficiency-plans/${plan}/evidence", payload: { hours: 30 }, as: CredentialEvaluator }
          trigger:
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: CredentialEvaluator, captures: { def_hours: $.data.deficiency_hours_required } }
          assert:
            - "CredentialApplication.${app}.status == 'EVALUATION'"
            - "CredentialApplication.${app}.deficiency_hours_required == 0"
            - "DeficiencyPlan.${plan}.status == 'COMPLETED'"

      - name: ce_audit_failed_remediation_loop
        grounds:
          - state_machines.CEAudit.FAILED_to_REMEDIATION
          - state_machines.CEAudit.REMEDIATION_to_UNDER_REVIEW
          - state_machines.CEAudit.UNDER_REVIEW_to_PASSED
        distinguishing_aspect: |
          Loop on CEAudit (different entity than CredentialApplication): UNDER_REVIEW ->
          FAILED -> REMEDIATION -> UNDER_REVIEW -> PASSED after a makeup credit lifts
          verified_hours from 55 to exactly 60 (>= required passes).
        test_recipe:
          setup:
            - "License (RECIPROCITY FULL chain); VERIFIED credits CONTENT 30 + PEDAGOGY 20 + ETHICS 5 = 55; STANDARD audit open"
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Gil Gi", email: "gil@x.com", date_of_birth: "1989-02-02T00:00:00Z", ssn_last4: "7777", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app: $.data.id } }
            - { call: "POST /licensure/applications/${app}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/reciprocity-evaluations", payload: { source_state: "TX", source_license_type: "STANDARD", years_teaching: 5 }, as: CredentialEvaluator, captures: { re: $.data.id } }
            - { call: "POST /licensure/reciprocity-evaluations/${re}/finalize", payload: { mapping_mode: "DETERMINISTIC" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app}/transcripts", payload: { institution_name: "TX State", degree_level: "BACHELORS", total_semester_hours: 120, courses: [ { course_code: "MATH101", credit_hours: 3, letter_grade: "A" } ] }, as: Applicant, as_user_id: "${ap}", captures: { tr: $.data.id } }
            - { call: "POST /licensure/transcripts/${tr}/verify", payload: { verification_status: "VERIFIED", subject_relevant_hours: 18 }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/background-checks", payload: { adverse_findings: [] }, as: BackgroundInvestigator, captures: { bg: $.data.id } }
            - { call: "POST /licensure/background-checks/${bg}/state", payload: { to_status: "PRINTS_SUBMITTED", fingerprint_submitted_at: "2026-08-05T00:00:00Z" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "BACKGROUND_REVIEW" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "PENDING_DECISION" }, as: BackgroundInvestigator }
            - { call: "POST /licensure/applications/${app}/state", payload: { to_status: "APPROVED" }, as: CredentialEvaluator }
            - { call: "GET /licensure/licenses?application_id=${app}", payload: {}, as: CredentialEvaluator, captures: { lic: "$.data[0].id" } }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "P1", category: "CONTENT", hours: 30, earned_on: "2027-01-10T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { c1: $.data.id } }
            - { call: "POST /licensure/ce-credits/${c1}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "P2", category: "PEDAGOGY", hours: 20, earned_on: "2027-02-01T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { c2: $.data.id } }
            - { call: "POST /licensure/ce-credits/${c2}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "P3", category: "ETHICS", hours: 5, earned_on: "2027-03-01T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { c3: $.data.id } }
            - { call: "POST /licensure/ce-credits/${c3}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-audits", payload: { audit_variant: "STANDARD" }, as: CredentialEvaluator, captures: { au: $.data.id, au_v: $.data.version } }
            - { call: "POST /licensure/ce-audits/${au}/determinations", payload: { expected_ce_audit_version: "${au_v}" }, as: CredentialEvaluator, captures: { au_v2: $.data.version } }
            - { call: "POST /licensure/ce-audits/${au}/state", payload: { to_status: "UNDER_REVIEW" }, as: CredentialEvaluator }
            - { call: "POST /licensure/ce-audits/${au}/state", payload: { to_status: "FAILED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/ce-audits/${au}/state", payload: { to_status: "REMEDIATION" }, as: CredentialEvaluator }
            - { call: "POST /licensure/licenses/${lic}/ce-credits", payload: { provider_name: "P4", category: "TECHNOLOGY", hours: 5, earned_on: "2027-04-01T00:00:00Z" }, as: Applicant, as_user_id: "${ap}", captures: { c4: $.data.id } }
            - { call: "POST /licensure/ce-credits/${c4}/state", payload: { to_status: "VERIFIED" }, as: CredentialEvaluator }
            - { call: "POST /licensure/ce-audits/${au}/state", payload: { to_status: "UNDER_REVIEW" }, as: CredentialEvaluator, captures: { au_v3: $.data.version } }
            - { call: "POST /licensure/ce-audits/${au}/determinations", payload: { expected_ce_audit_version: "${au_v3}" }, as: CredentialEvaluator }
          trigger:
            - { call: "POST /licensure/ce-audits/${au}/state", payload: { to_status: "PASSED" }, as: CredentialEvaluator }
          assert:
            - "CEAudit.${au}.status == 'PASSED'"
            - "CEAudit.${au}.verified_hours == 60"
            - "CEAudit.${au}.required_hours == 60"

  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade (depth >= 3 and depth >= 2, different triggers)
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: revocation_cascade_license_applicant_permit
        grounds:
          - state_machines.DisciplinaryAction.PROPOSED_to_ISSUED
          - state_machines.License.ACTIVE_to_REVOKED
          - state_machines.Endorsement.ACTIVE_to_REVOKED
          - state_machines.EmergencyPermit.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Depth-3 chain from DisciplinaryAction ISSUED (REVOCATION): license -> REVOKED (1),
          license revocation -> applicant BARRED and endorsement REVOKED (2), applicant BARRED
          -> the applicant's ACTIVE emergency permit on a second application REVOKED (3).
        test_recipe:
          setup:
            - "Applicant licensed in MATHEMATICS (license L1 ACTIVE) with an ACTIVE SPECIAL_EDUCATION endorsement"
            - "Second ALTERNATIVE SCIENCE application in DEFICIENCY_PENDING with ACCEPTED plan and an ACTIVE permit for district D01"
            - "MisconductCase on L1 adjudicated SUBSTANTIATED with a PROPOSED REVOCATION action"
          setup_api_calls:
            - { call: "POST /licensure/applicants", payload: { full_name: "Hal Ha", email: "hal@x.com", date_of_birth: "1985-04-04T00:00:00Z", ssn_last4: "8888", moral_character_attestation: true }, as: Anonymous, captures: { ap: $.data.id } }
            - { call: "POST /licensure/applications", payload: { applicant_id: "${ap}", pathway: "RECIPROCITY", subject_area: "MATHEMATICS", grade_band: "G7_12" }, as: Applicant, as_user_id: "${ap}", captures: { app1: $.data.id } }
            - { call: "POST /licensure/applications/${app1}/fee-payment", payload: { payment_token: "tok_1" }, as: Applicant, as_user_id: "${ap}" }
            - { call: "POST /licensure/applications/${app1}/state", payload: { to_status: "INTAKE_REVIEW" }, as: IntakeOfficer }
            - { call: "POST /licensure/applications/${app1}/reciprocity-evaluations", payload: { source_state: "TX", source_license_type: "STANDARD", years_teaching: 5 }, as: CredentialEvaluator, captures: { re1: $.data.id } }
            - { call: "POST /licensure/reciprocity-evaluations/${re1}/finalize", payload: { mapping_mode: "DETERMINISTIC" }, as: CredentialEvaluator }
            - { call: "POST /licensure/applications/${app1}/state", payload: { to_status: "EVALUATION" }, as: IntakeOfficer }
