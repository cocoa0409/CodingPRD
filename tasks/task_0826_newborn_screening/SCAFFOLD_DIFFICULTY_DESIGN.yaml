  - rule_id: compensating_invariant
    instances:
      - name: assay_cancel_restores_facility_booked_minutes
        grounds:
          - state_machines.AssayRun.SCHEDULED_to_CANCELLED
          - entities.Facility.fields.total_booked_minutes
          - entities.AssayRun.fields.duration_minutes
        distinguishing_aspect: "Conserved quantity = booked minutes: creating a 60-minute run raises Facility.total_booked_minutes to 60, and the compensating cancel subtracts the same 60, restoring total_booked_minutes to its pre-create value 0."
        test_recipe:
          setup:
            - "A LAB facility (total_booked_minutes 0) with one SCHEDULED 60-minute assay run [09:00,10:00] on MSMS-1 (total_booked_minutes now 60)."
          setup_api_calls:
            - call: "POST /nbs/facilities"
              payload: { name: "State Lab", facility_type: "LAB", state_region: "CA" }
              as: ProgramAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /nbs/assay-runs"
              payload: { facility_id: "${lab_id}", instrument_code: "MSMS-1", start_datetime: "2026-03-02T09:00:00Z", end_datetime: "2026-03-02T10:00:00Z" }
              as: LabTechnician
              captures: { run_id: "$.data.id" }
          trigger:
            - call: "POST /nbs/assay-runs/${run_id}/cancel"
              payload: { reason: "instrument fault" }
              as: LabTechnician
          assert:
            - "AssayRun.${run_id}.status == CANCELLED"
            - "Facility.${lab_id}.total_booked_minutes == 0"

