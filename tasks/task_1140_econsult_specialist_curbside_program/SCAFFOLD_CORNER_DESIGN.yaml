  # ===========================================================================
  - section: calculations
    instances:
      - name: urgent_sla_target_covered
        claim_type: correct_result
        grounds: [calculations.sla_due_at]
        excluded_because:
          difficulty_instance: claim_amount_rounds_per_component_then_sums
          rationale: "That instance asserts sla_due_at == 2026-06-01T12:00:00Z for an URGENT consult on a 12h-urgent-target track."

      - name: late_by_one_second_marks_on_time_false
        claim_type: correct_result
        grounds: [calculations.sla_due_at, entities.ConsultResponse.fields.on_time, entities.ConsultRequest.fields.sla_breached]
        distinguishing_aspect: "Complement of the inclusive boundary: one second AFTER sla_due_at the response is on_time == false, consult.sla_breached flips true, and review_required snapshots true (lateness triggers the review gate)."
        test_recipe:
          setup: ["consult created 2026-06-01T00:00:00Z ROUTINE (sla 2026-06-03T00:00:00Z); clock advanced to 2026-06-03T00:00:01Z"]
          setup_api_calls:
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: ProgramCoordinator }
            - { call: "POST /econsult/specialty-tracks", payload: { specialty_code: CARDIOLOGY, response_time_target_hours: 48, urgent_target_hours: 12, base_response_fee_cents: 10000, conversion_response_fee_cents: 8000, clarification_fee_cents: 2500, late_penalty_cents: 3000, monthly_billing_cap_cents: 1000000 }, as: ProgramCoordinator, captures: { track_id: $.data.id } }
            - { call: "POST /econsult/referring-providers", payload: { full_name: "Dr. Priya Primary", npi: "1000003001" }, as: ProgramCoordinator, captures: { prov_id: $.data.id } }
            - { call: "POST /econsult/specialists", payload: { full_name: "Dr. Sam Specialist", npi: "2000003001" }, as: ProgramCoordinator, captures: { spec_id: $.data.id } }
            - { call: "POST /econsult/panel-memberships", payload: { specialist_id: "${spec_id}", specialty_track_id: "${track_id}" }, as: ProgramCoordinator, captures: { memb_id: $.data.id } }
            - { call: "POST /econsult/specialist-availability-windows", payload: { membership_id: "${memb_id}", window_start: "2026-05-01T00:00:00Z", window_end: "2027-01-01T00:00:00Z" }, as: Specialist, as_user_id: "${spec_id}" }
            - { call: "POST /econsult/consult-requests", payload: { patient_ref: "PAT-C1", specialty_track_id: "${track_id}", question_text: "Carotid bruit found on exam, asymptomatic; asks about ultrasound urgency and statin start.", icd10_primary: "R09", urgency: "ROUTINE" }, as: ReferringProvider, as_user_id: "${prov_id}", captures: { cons_id: $.data.id } }
            - { call: "POST /econsult/_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T00:00:01Z" }, as: ProgramCoordinator }
          trigger:
            - { call: "POST /econsult/consult-requests/${cons_id}/responses", payload: { disposition: "MANAGE_WITH_PLAN", recommendation_text: "Carotid duplex within 2 weeks; start atorvastatin 40mg now for secondary prevention." }, as: Specialist, as_user_id: "${spec_id}", captures: { r_on_time: $.data.on_time, r_rr: $.data.review_required, r_minutes: $.data.response_minutes } }
            - { call: "GET /econsult/consult-requests/${cons_id}", as: ProgramCoordinator, captures: { c_breach: $.data.sla_breached } }
          assert:
            - "on_time == false at sla_due_at + 1 second (strictly greater than the inclusive deadline)"
            - "sla_breached == true on the consult"
            - "review_required == true (lateness snapshot)"
            - "response_minutes == 2880 (48 hours; truncation to whole minutes drops the extra second)"

      - name: quality_score_defaults_when_no_reviews
        claim_type: constants_applied
        grounds: [calculations.panel_quality_score_bps]
        distinguishing_aspect: "With zero COMPLETED reviews the review component falls back to the 8500 constant: after one on-time response the score is round_half_up((6*8500 + 4*10000)/10) == 9100 and standing stays GOOD_STANDING."
        test_recipe:
          setup: ["membership with one on-time response and no reviews"]
