          - state_machines.Member.dues_status.PAST_DUE_to_DELINQUENT
          - entities.Member.fields.past_due_since
        distinguishing_aspect: |
          NUMERIC threshold boundary on the delinquency day-count metric, reached through POST /_clock/advance_dues.
          past_due_since = 2026-06-20; at exactly 15 whole days elapsed (clock 2026-07-05) dues_status flips to
          DELINQUENT (>= is inclusive). At 14 days (2026-07-04) it is still PAST_DUE. Distinct metric+endpoint
          from the occupancy-count boundary instance.
