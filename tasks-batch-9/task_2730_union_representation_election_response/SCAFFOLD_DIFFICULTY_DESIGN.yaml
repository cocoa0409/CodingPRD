              as: LaborRelationsDirector
              as_user_id: "u_dir_1"
              captures: { cc_4: $.data.id }
          assert:
            - "first trigger call: 409 ERR_PRESENTER_SCHEDULE_CONFLICT ([12:00:00, 14:30:00] touches M1's padded end 12:00:00 and both endpoints are inclusive)"
            - "second trigger call: 201 (padded start 12:00:01 clears the closed interval by one second)"
            - "third trigger call: 201 for the same 13:00:00 slot with presenter B (the resource is the individual presenter)"
            - "fourth trigger call: 201 for an EMAIL at 13:00:00 with no presenter (non-meeting channels are outside the calendar rule)"
            - "CampaignCommunication.${cc_2}.planned_delivery_at == 2026-08-25T13:00:01Z and CampaignCommunication.${cc_1}.status == DRAFT (the rejected request changed nothing)"
            - "contrast with the poll-session rule: an interval starting exactly at the previous padded end is ADMITTED there and REJECTED here"

  # =========================================================================
  # RULE 9 - compensating_invariant
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: unit_headcount_conservation_across_rule_and_reconsider
        grounds:
          - invariants.unit_headcount_conservation
          - validations[priority=27]
          - errors.ERR_HEADCOUNT_CONSERVATION_VIOLATION
          - endpoints.POST_classifications_id_reconsider
        conserved_quantity: "classified employee headcount on the Petition (110 employees across four classifications)"
        compensating_action: "POST /labor-relations/classifications/{id}/reconsider returns a ruled classification to PENDING and reverses the exact headcount movement the ruling made"
        distinguishing_aspect: |
          The conserved total is a headcount partitioned into three named buckets on the parent
          Petition, and the compensating action is a scope re-opening. Rulings move headcount between
          buckets in either direction (INCLUDED or EXCLUDED), and a reconsideration must reverse the
          exact movement, including when the classification is then ruled the other way.
        test_recipe:
          setup:
            - "petition SCOPE_ANALYSIS with PROD 60, MAINT 30, QC 12 and LEAD 8: total_classified_headcount 110, all PENDING"
            - "all four classifications scored so that each is eligible to be ruled"
