            - "Trigger 5 at exactly the 0.05 boundary: HTTP 200 and ${audited_status} == ACCREDITED with audit_outcome PASSED, audit_finding_rate 0.05 and lead_auditor_user_id auditor-2 - the ceiling is inclusive"

      - name: intake_and_confirmation_guards_answer_their_own_errors
        claim_type: violation_to_error
        grounds:
          - validations.priority_31
          - validations.priority_24
          - errors[ERR_BATCH_WINDOW_IN_FUTURE]
          - errors[ERR_IVT_CONFIDENCE_TOO_LOW]
