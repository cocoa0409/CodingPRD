  # -----------------------------------------------------------------
  # RBAC — denials, ownership, opaque-vs-entity-backed
  # -----------------------------------------------------------------
  - section: rbac
    instances:
      - name: parent_cannot_create_program
        claim_type: role_denial
        grounds:
          - roles
          - endpoints
        distinguishing_aspect: "A Parent calling POST /enrichment/programs (StudioAdmin-exclusive) is denied with ERR_UNAUTHORIZED 403."
        test_recipe:
          setup: ["A family the parent acts as."]
          setup_api_calls:
            - call: "POST /enrichment/families"
              payload: { account_email: "par@x.com", primary_contact_name: "Par" }
              as: StudioAdmin
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /enrichment/programs"
              payload: { name: "Hack", level_index: 0, min_age_months: 6, max_age_months: 60, tuition_cents: 2500 }
              as: Parent
              as_user_id: "${fam_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "http_status == 403"

      - name: parent_cannot_freeze_other_familys_membership
        claim_type: ownership_denial
        grounds:
          - roles
          - state_machines.Membership.ACTIVE_to_FROZEN
          - "errors[ERR_UNAUTHORIZED]"
        distinguishing_aspect: "Parent identity is entity_backed:Family — freezing a membership whose family_id != X-User-ID returns ERR_UNAUTHORIZED 403."
        test_recipe:
          setup: ["Family X owns an ACTIVE membership; a different Parent (Family Y) attempts to freeze it."]
          setup_api_calls:
            - call: "POST /enrichment/families"
              payload: { account_email: "fx@x.com", primary_contact_name: "FX" }
              as: StudioAdmin
              captures: { famX_id: $.data.id }
            - call: "POST /enrichment/families"
              payload: { account_email: "fy@x.com", primary_contact_name: "FY" }
              as: StudioAdmin
              captures: { famY_id: $.data.id }
            - call: "POST /enrichment/memberships"
              payload: { family_id: "${famX_id}", tier: "CORE", cycle_anchor_day: 1 }
              as: StudioAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /enrichment/memberships/${mem_id}/activate"
              payload: {}
              as: StudioAdmin
          trigger:
            - call: "POST /enrichment/memberships/${mem_id}/freeze"
              payload: {}
              as: Parent
              as_user_id: "${famY_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "http_status == 403"

      - name: missing_role_header_returns_unauthenticated
        claim_type: role_denial
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no/unknown X-User-Role returns ERR_UNAUTHENTICATED 401 before any resource lookup."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /enrichment/programs"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "http_status == 401"

