      - name: merge_survivorship_field_level_keeps_survivor_non_null_values
        claim_type: projection
        grounds:
          - calculations.merge_survivorship
          - calculations.identity_match_confidence.variants.RENORMALIZE
          - endpoints[POST /cdp/identity-links]
        distinguishing_aspect: "The projection is field-level and directional: the survivor keeps every value it already has and adopts ONLY the fields where it is null, so the survivor's phone_norm survives while its null address_hash is filled from the loser."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One SourceSystem and one PROMOTED batch of two records: P1 (created first) has a phone and NO address_line; P2 has an address_line 9 Pine Road and NO phone. Both score at or above DQ_RECORD_MIN (1.00 and 0.80)."
            - "A PROBABILISTIC MatchRule with missing_identifier_policy RENORMALIZE, created AFTER the promote so the promote's own resolution pass mints two independent profiles."
            - "Because the survivor tie-breaks on source_record_count (1 = 1), then trust_tier (same source), the earlier-created P1 wins."
          setup_api_calls:
            - call: "POST /cdp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
