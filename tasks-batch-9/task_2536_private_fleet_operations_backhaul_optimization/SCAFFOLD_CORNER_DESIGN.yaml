  - section: cross_cutting_complexity_layers
    instances:
      - name: linking_a_backhaul_offer_is_guarded_by_the_trip_version_it_was_read_at
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[backhaul-link-stale-trip]
          - errors.ERR_STALE_TRIP_VERSION
          - endpoints[POST /fleet/trips/{trip_id}/backhaul-assignments]
        distinguishing_aspect: "The trip's version advances through writes that have nothing to do with backhauls - appending a stop, staffing the trip - so a client that read the trip before staffing it is refused with ERR_STALE_TRIP_VERSION (412) even though no other client ever touched the link. The gate also fires ahead of the supersession logic: a re-link holding the pre-link version is refused rather than silently displacing the offer the holder never saw."
        test_recipe:
          setup:
            - "TRIP-C1 is a DRAFT trip in DOM-C1 with one 600-case DELIVERY stop; offers OFF-C1A and OFF-C1B are PROPOSED."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/domiciles"
              payload: { domicile_code: "DOM-C1", region_code: "MIDWEST", tractor_capacity: 20, driver_headcount_target: 10, fixed_ownership_cents_per_day: 10000, overhead_cents_per_day: 3000, dedicated_rate_cents_per_mile: 280, dedicated_rate_cents_per_case: 205 }
              as: FleetPlanner
              captures: { dom_id: $.data.id }
            - call: "POST /fleet/driver-pay-plans"
              payload: { plan_code: "MILE-C", mileage_cents_per_mile: 80, stop_cents_per_stop: 2000, drop_hook_cents: 1400, hourly_cents_per_minute: 40, minimum_daily_cents: 20000, backhaul_bonus_pct: 0.04 }
              as: PayrollAnalyst
              captures: { plan_id: $.data.id }
            - call: "POST /fleet/stores"
              payload: { store_code: "S-6200", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
              captures: { store_id: $.data.id }
            - call: "POST /fleet/drivers"
              payload: { driver_code: "D-C1", domicile_id: "${dom_id}", pay_plan_id: "${plan_id}", seniority_date: "2019-03-01" }
              as: TransportManager
              captures: { driver_id: $.data.id }
            - call: "POST /fleet/tractors"
              payload: { unit_code: "TR-C1", domicile_id: "${dom_id}", odometer_miles: 50000, pm_interval_miles: 25000, pm_last_service_odometer: 40000 }
              as: MaintenanceCoordinator
              captures: { tractor_id: $.data.id }
            - call: "POST /fleet/trailers"
              payload: { trailer_code: "TL-C1", domicile_id: "${dom_id}", trailer_type: "DRY_VAN", capacity_cases: 1800, inspection_due_at: "2026-12-01T00:00:00Z" }
              as: MaintenanceCoordinator
              captures: { trailer_id: $.data.id }
            - call: "POST /fleet/replenishment-orders"
              payload: { store_id: "${store_id}", cases: 600, weight_lbs: 13200, requested_window_start: "2026-08-20T06:00:00Z", requested_window_end: "2026-08-20T18:00:00Z", temperature_mode: "DRY", priority: 1 }
              as: FleetPlanner
              captures: { order_id: $.data.id }
            - call: "POST /fleet/trips"
              payload: { trip_code: "TRIP-C1", domicile_id: "${dom_id}", planned_start_at: "2026-08-20T06:00:00Z" }
              as: FleetPlanner
              captures: { trip_id: $.data.id, v_create: $.data.version }
            - call: "POST /fleet/backhaul-offers"
              payload: { origin_kind: "VENDOR_PICKUP", shipper_name: "Cross Layer Foods", origin_region_code: "MIDWEST", dest_store_id: "${store_id}", revenue_cents: 60000, cases: 500, weight_lbs: 11000, deadhead_miles: 40, loaded_miles: 160, temperature_mode: "DRY", pickup_window_start: "2026-08-20T14:00:00Z", pickup_window_end: "2026-08-20T20:00:00Z", offer_expires_at: "2026-08-18T00:00:00Z" }
              as: FleetPlanner
