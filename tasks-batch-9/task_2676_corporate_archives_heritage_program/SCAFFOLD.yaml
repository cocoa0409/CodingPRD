      - "a CERTIFIED package makes brand_heritage_value admissible to the FINAL appraisal variant for the same series"

  # -------------------------------------------------------------- exhibit loans
  - method: POST
    path: "/exhibit-loans"
    description: "Request an exhibit loan of item units for a display window; the new half-open window plus its light-recovery buffer must not collide with any live loan on the item."
    roles: [ArchivesDirector, Archivist]
    code: 201
    input: [archival_item_id, exhibit_name, units, window_start, window_end]
    output: ExhibitLoan
    side_effects:
      - "runs calculations.exhibit_loan_window_conflict before insert"
      - "status REQUESTED; computes recovery_until = window_end + LIGHT_RECOVERY_BUFFER_DAYS; updates the item's last_loan_window_end"

  - method: GET
    path: "/exhibit-loans"
    description: "List exhibit loans, optionally filtered by the item on display."
    roles: [ArchivesDirector, Archivist, PreservationOfficer]
    code: 200
    input: ["archival_item_id?", "status?", "limit?", "offset?"]
    output: ExhibitLoan[]
    side_effects: []

  - method: GET
    path: "/exhibit-loans/{id}"
    description: "Fetch one exhibit loan with its recovery window."
    roles: [ArchivesDirector, Archivist, PreservationOfficer]
    code: 200
    input: []
    output: ExhibitLoan
    side_effects: []

  - method: POST
    path: "/exhibit-loans/{id}/confirm"
    description: "Confirm the loan after conservation review; requires a GOOD or FAIR item and enough shelved units."
    roles: [PreservationOfficer]
    code: 200
    input: []
    output: ExhibitLoan
    side_effects:
      - "state_machines.ExhibitLoan REQUESTED -> CONFIRMED"

  - method: POST
    path: "/exhibit-loans/{id}/check-out"
    description: "Physically release the units once the display window has opened."
    roles: [Archivist]
    code: 200
    input: []
    output: ExhibitLoan
    side_effects:
      - "state_machines.ExhibitLoan CONFIRMED -> OUT; stamps checked_out_at"
      - "the item moves ACCESSIONED -> ON_LOAN with units_on_shelf -= units and units_on_loan += units"

  - method: POST
    path: "/exhibit-loans/{id}/return"
    description: "Receive the units back and record the returned condition; the compensating action for check-out."
    roles: [Archivist]
    code: 200
    input: [returned_condition_grade]
    output: ExhibitLoan
    side_effects:
      - "state_machines.ExhibitLoan OUT -> RETURNED; stamps returned_at"
      - "the item moves ON_LOAN -> ACCESSIONED with units_on_loan -= units and units_on_shelf += units, restoring calculations.unit_custody_conservation with zero drift"
      - "writes returned_condition_grade onto the item's condition_grade"

  - method: POST
    path: "/exhibit-loans/{id}/cancel"
    description: "Cancel a loan that has not been checked out."
    roles: [ArchivesDirector, Archivist]
    code: 200
    input: []
    output: ExhibitLoan
    side_effects:
      - "state_machines.ExhibitLoan REQUESTED or CONFIRMED -> CANCELLED; no units move"

  # ------------------------------------------------------- deaccession proposals
  - method: POST
    path: "/deaccession-proposals"
    description: "Propose removal of item units by destruction or donation to an external repository."
    roles: [Archivist]
    code: 201
    input: ["archival_item_id", "rationale", "route", "units", "recipient_repository?"]
    output: DeaccessionProposal
