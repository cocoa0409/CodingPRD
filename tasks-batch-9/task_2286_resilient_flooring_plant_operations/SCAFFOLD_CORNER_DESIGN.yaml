# =============================================================================
# §1.9 Scaffold Corner Design — Resilient Flooring Plant Operations (task 2286)
#
# BREADTH probe. One instance per applicable row of
# references/claim-extraction-guide.md, walked against §1.1-§1.7 of
# SCAFFOLD.yaml. Corners already probed in depth by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml are recorded as `excluded_because:` stubs that
# name the covering §1.8 instance instead of duplicating its chain.
#
# Every chain reproduces from an empty database using only §1.5 endpoints.
# The logical clock is set explicitly as the first call of every chain
# (POST /_clock/set_current_utc, default at boot 2026-08-01T00:00:00Z) so no
# assertion depends on wall-clock time.
#
# Canonical fixtures used across this file (all values author-determined):
#   RM-RESIN  VINYL_RESIN cost 180  ind 90  thermal 85  migration  5  max_phr 100
#   RM-STAB   STABILIZER  cost 900  ind 60  thermal 96  migration  2  max_phr   5
#   RM-FILLER FILLER      cost  45  ind 96  thermal 92  migration  1  max_phr 400
#   RM-SOFT   PLASTICIZER cost 300  ind 20  thermal 20  migration 80  max_phr  60
#   RM-CACO3  FILLER      cost  30  ind 30  thermal 88  migration  1  max_phr 400
#   F-MIN   = RESIN 100 + STAB 3    -> total 103.00 cost 201 score 89.28 CLASS_34_43
#   F-STD   = RESIN 100 + SOFT 25 + FILLER 40
#                                   -> total 165.00 cost 165 score 80.39 CLASS_33_42
#   F-SOFT  = RESIN 100 + SOFT 60 + FILLER 40
#                                   -> total 200.00 cost 189 score 57.82 CLASS_33_42
#   F-CHALK = RESIN 100 + CACO3 200 -> total 300.00 cost  80 score 71.87 CLASS_23_31
#   LIC-OAK    NON_EXCLUSIVE 500 bps 2026-01-01 -> 2027-01-01 cap 2000.00 [US, CA]
#   LIC-WP     NON_EXCLUSIVE 500 bps 2026-01-01 -> 2029-01-01 cap 5000.00 [US, CA]
#   PF-OAK-1200 repeat 1200x180 reg tol 0.25 emboss 0.10 roll sets 1 (LIC-OAK)
#   PF-SLATE-900 repeat 900x150 reg tol 0.30 emboss 0.05 roll sets 1 (LIC-OAK)
#   PF-WP-1800  repeat 1800x200 reg tol 0.25 emboss 0.10 roll sets 1 (LIC-WP)
#   SKU-A GLUE_DOWN  F-MIN/PF-OAK-1200 wear 12 thk 2.50 basis 2100
#         -> warranty 20/10, PINNED std 1157 (955+42+20+0+0+35+105), list 1562
#   SKU-W CLICK_LOCK_SPC waterproof IXPE_1MM F-MIN/PF-WP-1800 wear 20 thk 5.00
#         basis 2600 -> warranty 30/20, PINNED std 2212 (1910+70+24+22+9+47+130),
#         list 2986, all five required test types
#   SKU-D GLUE_DOWN  F-STD/PF-SLATE-900 wear 12 thk 5.00 basis 2000
#   PL-1 CALENDER 1.50-8.00 mm changeover 60 curl_control_index 92 (allowance 0.16)
#   PL-2 MULTI_DAY_PRESS 6.00-8.00 mm changeover 90 curl_control_index 95
#   users: pa-001 / form-001 form-002 / td-001 td-002 / qa-001 qa-002 / pp-001 /
#          adj-001 adj-002 ; Distributor calls send as_user_id "${dist_id}"
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Guide section 1 — Table 1 (Entities) + graph topology
  # ===========================================================================
  - section: entities
    instances:

      - name: distributor_create_returns_declared_defaults_and_system_fields
        claim_type: creation
        grounds:
          - "entities.Distributor.fields.account_code"
          - "entities.Distributor.fields.certified_installer_program"
          - "entities.Distributor.fields.status"
          - "endpoints.POST /distributors"
        distinguishing_aspect: |
          The narrowest legal creation body (account_code, name, territory_code)
          plus the one optional flag, proving that `status` defaults to ACTIVE, that
          the four common fields are minted by the server and that `version` starts
          at exactly 1 rather than 0.
        test_recipe:
          setup_api_calls:
            - &clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "pa-001"
          trigger:
            - &dist
              call: "POST /distributors"
              payload: { account_code: "D-100", name: "Northline Floors LLC", territory_code: "US", certified_installer_program: true }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { dist_id: $.data.id, dist_version: $.data.version }
          assert:
            - "HTTP 201 and data.account_code == D-100, data.name == Northline Floors LLC, data.territory_code == US"
            - "data.certified_installer_program == true (the supplied value is honoured)"
            - "data.status == ACTIVE — the declared default of Distributor.status"
            - "data.id is a non-empty string, data.created_at == data.updated_at == 2026-08-01T00:00:00.000Z (the logical clock)"
            - "${dist_version} == 1"

      - name: raw_material_retrieval_returns_every_stored_field
        claim_type: retrieval
        grounds:
          - "entities.RawMaterial"
          - "endpoints.GET /raw-materials/{id}"
        distinguishing_aspect: |
          A single-row read of the nine-field RawMaterial row, confirming the four
          index fields survive the round trip at their declared 2-decimal precision
          and that no derived field is invented on the read path.
        test_recipe:
          setup_api_calls:
            - *clock0
            - &rmResin
              call: "POST /raw-materials"
              payload: { material_code: "RM-RESIN", name: "Suspension PVC K67", category: VINYL_RESIN, cost_per_kg_cents: 180, indentation_index: 90, thermal_stability_index: 85, plasticizer_migration_index: 5, max_phr: 100 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_resin_id: $.data.id }
          trigger:
            - call: "GET /raw-materials/${rm_resin_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { rm_resin_cost: $.data.cost_per_kg_cents, rm_resin_status: $.data.status }
          assert:
            - "HTTP 200 and data.id == ${rm_resin_id}"
            - "data.material_code == RM-RESIN, data.category == VINYL_RESIN"
            - "${rm_resin_cost} == 180 and data.max_phr == 100"
            - "${rm_resin_status} == ACTIVE"

      - name: raw_material_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - "response_envelope.pagination_fields"
          - "response_envelope.pagination_defaults"
          - "endpoints.GET /raw-materials"
        distinguishing_aspect: |
          Three materials read two at a time: the first page must report
          total_count 3 with has_more true, and the second page exactly one row with
          has_more false — the offset arithmetic, not merely the presence of the
          four pagination fields.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - &rmStab
              call: "POST /raw-materials"
              payload: { material_code: "RM-STAB", name: "Ca-Zn Stabiliser", category: STABILIZER, cost_per_kg_cents: 900, indentation_index: 60, thermal_stability_index: 96, plasticizer_migration_index: 2, max_phr: 5 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_stab_id: $.data.id }
            - &rmFiller
              call: "POST /raw-materials"
              payload: { material_code: "RM-FILLER", name: "Coated Limestone F45", category: FILLER, cost_per_kg_cents: 45, indentation_index: 96, thermal_stability_index: 92, plasticizer_migration_index: 1, max_phr: 400 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_filler_id: $.data.id }
          trigger:
            - call: "GET /raw-materials?limit=2&offset=0"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { page1_first_code: "$.data[0].material_code" }
            - call: "GET /raw-materials?limit=2&offset=2"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { page2_first_code: "$.data[0].material_code" }
          assert:
            - "page 1: HTTP 200, response_type == array, exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "page 2: exactly 1 row, total_count == 3, has_more == false, limit == 2, offset == 2"
            - "${page1_first_code} and ${page2_first_code} are different material_code values, and the union of both pages is exactly {RM-RESIN, RM-STAB, RM-FILLER} with no row repeated"

      - name: product_sku_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - "validations.V-EXIST-1"
          - "errors.ERR_PRODUCT_SKU_NOT_FOUND"
          - "endpoints.GET /product-skus/{id}"
        distinguishing_aspect: |
          A syntactically valid UUID that matches no ProductSku row must produce the
          entity-specific 404 code, not a generic one — and it must do so on a read
          endpoint, where no other validation band can be reached.
        test_recipe:
          setup_api_calls:
            - *clock0
          trigger:
            - call: "GET /product-skus/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { nf_error: $.data.error_id }
          assert:
            - "HTTP 404 and ${nf_error} == ERR_PRODUCT_SKU_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: raw_material_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations.V-REQ-1"
          - "errors.ERR_INVALID_REQUEST"
          - "entities.RawMaterial.fields.max_phr"
        distinguishing_aspect: |
          max_phr is an input field with NO declared default, so omitting it is a
          shape violation at priority 3 — distinct from supplying it out of range,
          and distinct from the stored-state ceiling enforced later by V-CON-4.
        test_recipe:
          setup_api_calls:
            - *clock0
          trigger:
            - call: "POST /raw-materials"
              payload: { material_code: "RM-NOMAX", name: "Unbounded Filler", category: FILLER, cost_per_kg_cents: 45, indentation_index: 96, thermal_stability_index: 92, plasticizer_migration_index: 1 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { req_error: $.data.error_id }
          assert:
            - "HTTP 400 and ${req_error} == ERR_INVALID_REQUEST"
            - "no RawMaterial row with material_code RM-NOMAX exists afterwards: GET /raw-materials returns total_count == 0"

      - name: product_sku_omitted_optionals_take_declared_defaults
        claim_type: defaults
        grounds:
          - "entities.ProductSku.fields.waterproof_rated"
          - "entities.ProductSku.fields.attached_underlayment_type"
          - "entities.ProductSku.fields.profile_family"
          - "entities.ProductSku.fields.target_margin_bps"
          - "entities.ProductSku.fields.certification_status"
          - "entities.ProductSku.fields.commercial_status"
        distinguishing_aspect: |
          Six defaults on one row at once: two booleans/enums that change the test
          matrix (waterproof_rated, attached_underlayment_type), the milling family,
          the 3500 bps margin that later drives list price, and BOTH independent
          lifecycle dimensions starting at their own initial values.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - &fmin
              call: "POST /formulations"
              payload: { formulation_code: "F-MIN" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_min_id: $.data.id }
            - &fminC1
              call: "POST /formulations/${f_min_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
              captures: { comp_resin_id: $.data.id }
            - &fminC2
              call: "POST /formulations/${f_min_id}/components"
              payload: { raw_material_id: "${rm_stab_id}", phr: 3 }
              as: Formulator
              as_user_id: "form-001"
              captures: { comp_stab_id: $.data.id }
            - &lic
              call: "POST /design-licenses"
              payload: { license_code: "LIC-OAK", licensor_name: "Nordic Decor Studio", license_type: NON_EXCLUSIVE, royalty_rate_bps: 500, valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", term_volume_cap_sqm: 2000.00, territory_codes: ["US", "CA"] }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { lic_id: $.data.id }
            - &pf1
              call: "POST /print-films"
              payload: { design_code: "PF-OAK-1200", license_id: "${lic_id}", pattern_repeat_mm_length: 1200, pattern_repeat_mm_width: 180, registration_tolerance_mm: 0.25, emboss_plate_code: "EP-OAK-A", emboss_alignment_offset_mm: 0.10, master_roll_sets: 1 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf1_id: $.data.id }
          trigger:
            - &skuA
              call: "POST /product-skus"
              payload: { sku_code: "SKU-A", formulation_id: "${f_min_id}", print_film_id: "${pf1_id}", construction_type: GLUE_DOWN, wear_layer_mil: 12, overall_thickness_mm: 2.50, royalty_basis_price_cents_per_sqm: 2100 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { sku_a_id: $.data.id, sku_a_margin: $.data.target_margin_bps }
          assert:
            - "HTTP 201 and data.waterproof_rated == false, data.attached_underlayment_type == NONE, data.profile_family == NONE"
            - "data.tongue_thickness_target_mm, tolerance_plus_mm, tolerance_minus_mm and target_lock_shear_n_per_mm are all null"
            - "${sku_a_margin} == 3500"
            - "data.certification_status == UNCERTIFIED and data.commercial_status == DEVELOPMENT"
            - "data.standard_cost_cents_per_sqm == null and data.list_price_cents_per_sqm == null and data.pin_stale == false"

      - name: product_sku_warranty_terms_computed_and_extra_field_rejected_as_input
        claim_type: computed_fields
        grounds:
          - "calculations.sku_warranty_terms"
          - "entities.ProductSku.fields.warranty_years"
          - "entities.ProductSku.fields.light_commercial_warranty_years"
        distinguishing_aspect: |
          warranty_years is source: computed, so a client-supplied value must never
          survive: a waterproof CLICK_LOCK_SPC at 20 mil gets 25+5 capped to 30 and
          15+5 capped to 20 from the tier table, not the 99/99 sent in the body.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - &licWp
              call: "POST /design-licenses"
              payload: { license_code: "LIC-WP", licensor_name: "Nordic Decor Studio", license_type: NON_EXCLUSIVE, royalty_rate_bps: 500, valid_from: "2026-01-01T00:00:00Z", valid_until: "2029-01-01T00:00:00Z", term_volume_cap_sqm: 5000.00, territory_codes: ["US", "CA"] }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { lic_wp_id: $.data.id }
            - &pfWp
              call: "POST /print-films"
              payload: { design_code: "PF-WP-1800", license_id: "${lic_wp_id}", pattern_repeat_mm_length: 1800, pattern_repeat_mm_width: 200, registration_tolerance_mm: 0.25, emboss_plate_code: "EP-WP-A", emboss_alignment_offset_mm: 0.10, master_roll_sets: 1 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pf_wp_id: $.data.id }
          trigger:
            - call: "POST /product-skus"
              payload: { sku_code: "SKU-W", formulation_id: "${f_min_id}", print_film_id: "${pf_wp_id}", construction_type: CLICK_LOCK_SPC, wear_layer_mil: 20, overall_thickness_mm: 5.00, royalty_basis_price_cents_per_sqm: 2600, waterproof_rated: true, attached_underlayment_type: IXPE_1MM, profile_family: UNILIN_5G, tongue_thickness_target_mm: 1.80, tolerance_plus_mm: 0.15, tolerance_minus_mm: 0.15, target_lock_shear_n_per_mm: 8.00, warranty_years: 99, light_commercial_warranty_years: 99 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { sku_w_res: $.data.warranty_years, sku_w_com: $.data.light_commercial_warranty_years }
          assert:
            - "HTTP 201 and ${sku_w_res} == 30 (25 for wear >= 20 plus the 5-year waterproof click bonus, capped at RESIDENTIAL_CAP_YEARS 30)"
            - "${sku_w_com} == 20 (15 + 5 bonus, capped at COMMERCIAL_CAP_YEARS 20)"
            - "neither field equals the 99 supplied in the request body"

      - name: formulation_author_stamped_from_header_with_ignored_input
        claim_type: system_fields
        grounds:
          - "entities.Formulation.fields.authored_by_user_id"
          - "entities.Formulation.fields.revision"
          - "endpoints.POST /formulations"
        distinguishing_aspect: |
          authored_by_user_id is source: system and drives SoD rule S1, so it must be
          taken from the X-User-ID header and never from the body; revision must be
          minted as 1 even when the body claims 7.
        test_recipe:
          setup_api_calls:
            - *clock0
          trigger:
            - call: "POST /formulations"
              payload: { formulation_code: "F-SYS", authored_by_user_id: "form-999", revision: 7, status: APPROVED }
              as: Formulator
              as_user_id: "form-002"
              captures: { f_sys_author: $.data.authored_by_user_id, f_sys_rev: $.data.revision, f_sys_status: $.data.status }
          assert:
            - "HTTP 201 and ${f_sys_author} == form-002 (the X-User-ID header), never form-999"
            - "${f_sys_rev} == 1 and ${f_sys_status} == DRAFT"
            - "data.submitted_by_user_id == null, data.approved_by_user_id == null, data.approved_at == null, data.cost_basis == LIVE"

      - name: raw_material_out_of_range_index_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.RawMaterial.fields.indentation_index"
          - "entities.RawMaterial.fields.category"
          - "validations.V-REQ-1"
        distinguishing_aspect: |
          Three distinct shape faults on the same priority-3 rule: a numeric field
          above its declared 0-100 range, an enum value outside its declared set,
          and a pagination limit above the declared max of 100.
        test_recipe:
          setup_api_calls:
            - *clock0
          trigger:
            - call: "POST /raw-materials"
              payload: { material_code: "RM-BAD1", name: "Impossible Resin", category: VINYL_RESIN, cost_per_kg_cents: 180, indentation_index: 101, thermal_stability_index: 85, plasticizer_migration_index: 5, max_phr: 100 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { range_error: $.data.error_id }
            - call: "POST /raw-materials"
              payload: { material_code: "RM-BAD2", name: "Mystery Powder", category: GLITTER, cost_per_kg_cents: 180, indentation_index: 90, thermal_stability_index: 85, plasticizer_migration_index: 5, max_phr: 100 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { enum_error: $.data.error_id }
            - call: "GET /raw-materials?limit=101"
              payload: {}
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { limit_error: $.data.error_id }
          assert:
            - "${range_error} == ERR_INVALID_REQUEST with HTTP 400 (indentation_index 101 > 100)"
            - "${enum_error} == ERR_INVALID_REQUEST with HTTP 400 (category GLITTER is outside {VINYL_RESIN, PLASTICIZER, FILLER, STABILIZER})"
            - "${limit_error} == ERR_INVALID_REQUEST with HTTP 400 (limit 101 > pagination max 100)"
            - "GET /raw-materials?limit=100 succeeds with total_count == 0 — the boundary itself is legal"

      - name: test_result_is_immutable_and_carries_no_version
        claim_type: immutability
        grounds:
          - "entities.TestResult.common_fields"
          - "validations.V-CON-10"
          - "endpoints.GET /test-panels/{id}/results"
        distinguishing_aspect: |
          TestResult is the one entity declared common_fields: false — it has no
          version field, no update endpoint, and the only way to "change" a
          measurement is refused: re-posting the same test_type at the same
          attempt_no is rejected by V-CON-10 rather than overwriting the row.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - &fminSubmit
              call: "POST /formulations/${f_min_id}/submit"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
            - &fminApprove
              call: "POST /formulations/${f_min_id}/review-decision"
              payload: { decision: APPROVE, review_note: "Blend cleared at 89.28." }
              as: TechnicalDirector
              as_user_id: "td-001"
              captures: { f_min_version: $.data.version }
            - *lic
            - *pf1
            - *skuA
            - &skuABegin
              call: "POST /product-skus/${sku_a_id}/begin-testing"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpA1
              call: "POST /test-panels"
              payload: { panel_code: "TP-A1", sku_id: "${sku_a_id}" }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tp_a1_id: $.data.id }
            - &tpA1Start
              call: "POST /test-panels/${tp_a1_id}/start"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
            - &tpA1Ind
              call: "POST /test-panels/${tp_a1_id}/results"
              payload: { test_type: RESIDUAL_INDENTATION, measured_value: 0.0800 }
              as: QaTechnician
              as_user_id: "qa-001"
          trigger:
            - call: "GET /test-panels/${tp_a1_id}/results"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { tr_outcome: "$.data[0].outcome", tr_recorder: "$.data[0].recorded_by_user_id" }
            - call: "POST /test-panels/${tp_a1_id}/results"
              payload: { test_type: RESIDUAL_INDENTATION, measured_value: 0.0500 }
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { dup_error: $.data.error_id }
          assert:
            - "the listed TestResult has NO version field and no id-addressable update or delete endpoint exists for it anywhere in §1.5"
            - "${tr_outcome} == PASS and ${tr_recorder} == qa-001 and data[0].attempt_no == 1"
            - "the second POST returns HTTP 400 with ${dup_error} == ERR_INVALID_REQUEST (V-CON-10: a result for RESIDUAL_INDENTATION already exists at attempt_no 1)"
            - "GET /test-panels/${tp_a1_id}/results still returns total_count == 1 and measured_value == 0.0800 — the stored measurement was not overwritten"

      - name: formulation_component_with_unknown_material_returns_not_found
        claim_type: parent_relationships
        grounds:
          - "validations.V-EXIST-2"
          - "errors.ERR_RAW_MATERIAL_NOT_FOUND"
          - "entities.FormulationComponent.fields.raw_material_id"
        distinguishing_aspect: |
          FormulationComponent is a junction with TWO parents: the path parent
          (Formulation, checked at priority 4) and the body parent (RawMaterial,
          checked at priority 5). An unknown material id must return the material's
          own 404 while the recipe itself resolves fine.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *fmin
          trigger:
            - call: "POST /formulations/${f_min_id}/components"
              payload: { raw_material_id: "00000000-0000-4000-8000-000000000000", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
              captures: { fk_error: $.data.error_id }
            - call: "POST /formulations/00000000-0000-4000-8000-000000000000/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
              captures: { path_error: $.data.error_id }
          assert:
            - "${fk_error} == ERR_RAW_MATERIAL_NOT_FOUND with HTTP 404 (body reference, V-EXIST-2)"
            - "${path_error} == ERR_FORMULATION_NOT_FOUND with HTTP 404 (path resource, V-EXIST-1)"
            - "GET /formulations/${f_min_id}/components returns total_count == 0 and Formulation.${f_min_id}.total_phr == 0.00"

      - name: formulation_component_junction_reachable_from_both_parents
        claim_type: topology_graph
        grounds:
          - "complexity_profile.entity_topology"
          - "endpoints.GET /formulations/{id}/components"
          - "endpoints.GET /raw-materials/{id}/formulation-components"
        distinguishing_aspect: |
          The many-to-many Formulation<->RawMaterial junction must be listable from
          BOTH sides, and the same material must be visible from two different
          recipes at once — the graph-topology claim, not a hierarchy claim.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *rmFiller
            - *fmin
            - *fminC1
            - *fminC2
            - &fstd
              call: "POST /formulations"
              payload: { formulation_code: "F-STD" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_std_id: $.data.id }
            - &rmSoft
              call: "POST /raw-materials"
              payload: { material_code: "RM-SOFT", name: "DOTP Plasticiser", category: PLASTICIZER, cost_per_kg_cents: 300, indentation_index: 20, thermal_stability_index: 20, plasticizer_migration_index: 80, max_phr: 60 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rm_soft_id: $.data.id }
            - &fstdC1
              call: "POST /formulations/${f_std_id}/components"
              payload: { raw_material_id: "${rm_resin_id}", phr: 100 }
              as: Formulator
              as_user_id: "form-001"
            - &fstdC2
              call: "POST /formulations/${f_std_id}/components"
              payload: { raw_material_id: "${rm_soft_id}", phr: 25 }
              as: Formulator
              as_user_id: "form-001"
            - &fstdC3
              call: "POST /formulations/${f_std_id}/components"
              payload: { raw_material_id: "${rm_filler_id}", phr: 40 }
              as: Formulator
              as_user_id: "form-001"
          trigger:
            - call: "GET /formulations/${f_min_id}/components"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { fmin_comp_count_probe: "$.data[0].formulation_id" }
            - call: "GET /raw-materials/${rm_resin_id}/formulation-components"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { resin_side_first: "$.data[0].raw_material_id" }
          assert:
            - "GET /formulations/${f_min_id}/components returns total_count == 2 and every row has formulation_id == ${f_min_id}; ${fmin_comp_count_probe} == ${f_min_id}"
            - "GET /formulations/${f_std_id}/components returns total_count == 3"
            - "GET /raw-materials/${rm_resin_id}/formulation-components returns total_count == 2 — one row for F-MIN and one for F-STD — and ${resin_side_first} == ${rm_resin_id}"
            - "GET /raw-materials/${rm_soft_id}/formulation-components returns total_count == 1, pointing only at ${f_std_id}"

      - name: formulation_self_referential_revision_edge_listable_from_predecessor
        claim_type: topology_graph
        grounds:
          - "entities.Formulation.fields.supersedes_formulation_id"
          - "endpoints.GET /formulations"
          - "endpoints.POST /formulations/{id}/revisions"
        distinguishing_aspect: |
          The self-referential edge on Formulation must be navigable in reverse
          through the declared query filter supersedes_formulation_id, and the
          successor's revision number must be derived from the predecessor rather
          than restarting at 1.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
          trigger:
            - &fminRev
              call: "POST /formulations/${f_min_id}/revisions"
              payload: { formulation_code: "F-MIN-R2", expected_formulation_version: "${f_min_version}" }
              as: Formulator
              as_user_id: "form-001"
              captures: { f_min_r2_id: $.data.id, f_min_r2_rev: $.data.revision }
            - call: "GET /formulations?supersedes_formulation_id=${f_min_id}"
              payload: {}
              as: Formulator
              as_user_id: "form-001"
              captures: { rev_list_first_id: "$.data[0].id" }
          assert:
            - "HTTP 201, ${f_min_r2_rev} == 2 and data.supersedes_formulation_id == ${f_min_id}"
            - "the revision starts in DRAFT with cost_basis LIVE and copies both components (GET /formulations/${f_min_r2_id}/components returns total_count == 2 with material_cost_snapshot_cents null on each)"
            - "GET /formulations?supersedes_formulation_id=${f_min_id} returns total_count == 1 and ${rev_list_first_id} == ${f_min_r2_id}"
            - "Formulation.${f_min_id} is still APPROVED with open_revision_count == 1 — the predecessor is not superseded until the revision is approved"

  # ===========================================================================
  # Guide section 2 — Table 2 (State Machines) + shapes + side-effect patterns
  # ===========================================================================
  - section: state_machines
    instances:

      - name: production_run_created_in_planned_pending_with_reservation
        claim_type: initial_state
        grounds:
          - "state_machines.ProductionRun.initial_state"
          - "endpoints.POST /production-runs"
          - "calculations.license_volume_ledger variant RESERVED_VOLUME_BASIS"
        distinguishing_aspect: |
          ProductionRun starts in a COMPOUND initial state — run_status PLANNED and
          qc_disposition PENDING — and its creation already moves a foreign ledger
          (the licence reservation), so "initial state" here is two enum fields plus
          a side effect, not one field.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - &pl1
              call: "POST /press-lines"
              payload: { line_code: "PL-1", line_type: CALENDER, min_thickness_mm: 1.50, max_thickness_mm: 8.00, changeover_minutes: 60, curl_control_index: 92 }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { pl1_id: $.data.id }
          trigger:
            - &runA1
              call: "POST /production-runs"
              payload: { run_code: "RUN-A1", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T01:00:00Z", planned_end_utc: "2026-08-01T09:00:00Z", planned_quantity_sqm: 1200.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_a1_id: $.data.id, run_a1_status: $.data.run_status, run_a1_qc: $.data.qc_disposition }
            - call: "GET /design-licenses/${lic_id}/utilization"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { util_reserved: $.data.reserved_volume_sqm, util_projected: $.data.projected_volume_sqm }
          assert:
            - "HTTP 201, ${run_a1_status} == PLANNED and ${run_a1_qc} == PENDING — both dimensions at their declared initial values"
            - "data.changeover_minutes_applied == null, data.actual_quantity_sqm == 0, data.royalty_accrued_cents == 0, data.pattern_waste_sqm == null and all four QC gate booleans are null"
            - "${util_reserved} == 1200.00, data.consumed_volume_sqm == 0.00, ${util_projected} == 1200.00, data.remaining_volume_sqm == 800.00, data.accrued_royalty_cents == 0 and data.contributing_run_count == 0"
            - "the SKU is untouched: GET /product-skus/${sku_a_id} still reports certification_status TESTING and commercial_status DEVELOPMENT"

      - name: production_run_planned_to_setup_persists_changeover_allowance
        claim_type: valid_transition
        grounds:
          - "state_machines.ProductionRun run_status=PLANNED -> run_status=SETUP"
          - "endpoints.POST /production-runs/{id}/setup"
          - "calculations.press_line_changeover_gap"
        distinguishing_aspect: |
          The happy PLANNED -> SETUP edge, taken with no preceding run on the line, so
          required_gap_minutes is the declared no-predecessor value 0 and gets persisted
          into changeover_minutes_applied — the transition's own side effect, not merely
          a status flip.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - &tpA1Dim
              call: "POST /test-panels/${tp_a1_id}/results"
              payload: { test_type: DIMENSIONAL_STABILITY_HEAT, measured_value: 0.2000 }
              as: QaTechnician
              as_user_id: "qa-001"
            - *pl1
            - *runA1
          trigger:
            - &runA1Setup
              call: "POST /production-runs/${run_a1_id}/setup"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_a1_setup_status: $.data.run_status, run_a1_gap: $.data.changeover_minutes_applied, run_a1_v2: $.data.version }
          assert:
            - "HTTP 200 and ${run_a1_setup_status} == SETUP"
            - "${run_a1_gap} == 0 — PL-1 has no earlier non-ABORTED run, so press_line_changeover_gap returns required_gap_minutes 0"
            - "${run_a1_v2} == 2 (the run's version incremented from 1)"
            - "qc_disposition is still PENDING — the setup edge touches only the execution dimension"

      - name: run_setup_before_lead_window_rejected_then_admitted_at_exact_boundary
        claim_type: precondition_enforcement
        grounds:
          - "validations.V-TEMP-5"
          - "errors.ERR_SETUP_TOO_EARLY"
          - "state_machines.ProductionRun run_status=PLANNED -> run_status=SETUP precondition 'clock >= planned_start_utc - 120 minutes'"
        distinguishing_aspect: |
          A transition whose from-state is correct and whose actor is correct is still
          refused by a temporal precondition, and the SAME call succeeds once the logical
          clock reaches planned_start minus exactly 120 minutes — proving the guard is the
          inclusive SETUP_LEAD_MINUTES boundary and not a state check.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - call: "POST /production-runs"
              payload: { run_code: "RUN-A5", sku_id: "${sku_a_id}", press_line_id: "${pl1_id}", planned_start_utc: "2026-08-01T05:00:00Z", planned_end_utc: "2026-08-01T06:00:00Z", planned_quantity_sqm: 100.00 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_a5_id: $.data.id }
          trigger:
            - call: "POST /production-runs/${run_a5_id}/setup"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { early_error: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T03:00:00Z" }
              as: PlantAdmin
              as_user_id: "pa-001"
            - call: "POST /production-runs/${run_a5_id}/setup"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { late_status: $.data.run_status }
          assert:
            - "first setup: HTTP 409 with ${early_error} == ERR_SETUP_TOO_EARLY (clock 2026-08-01T00:00:00Z is before the window opening at 2026-08-01T03:00:00Z)"
            - "after the rejection the run is still run_status PLANNED with changeover_minutes_applied null and version 1"
            - "second setup at exactly 2026-08-01T03:00:00Z: HTTP 200 with ${late_status} == SETUP — the comparison is >= and admits the boundary instant"

      - name: run_completion_mints_batch_with_nine_field_traceability_snapshot
        claim_type: side_effect_execution
        grounds:
          - "state_machines.ProductionRun run_status=RUNNING -> run_status=COMPLETED"
          - "entities.Batch.fields.traceability_snapshot"
          - "calculations.run_quality_metrics"
          - "calculations.license_royalty_accrual"
        distinguishing_aspect: |
          One transition fans out into five distinct side effects — quality metrics, the
          ACTUAL_VOLUME_BASIS ledger swing, the royalty accrual, the minted Batch and the
          nine-field immutable snapshot copied off four different parents. The snapshot's
          blended_cost_per_kg_cents (201) proves it was taken from the PINNED recipe.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - &runA1Start
              call: "POST /production-runs/${run_a1_id}/start"
              payload: {}
              as: ProductionPlanner
              as_user_id: "pp-001"
          trigger:
            - &runA1Complete
              call: "POST /production-runs/${run_a1_id}/complete"
              payload: { actual_quantity_sqm: 1200.00, registration_drift_mm: 0.20, curl_deviation_mm: 0.10, emboss_alignment_offset_mm: 0.10, wear_layer_measured_mil: 12.0 }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { run_a1_waste: $.data.pattern_waste_sqm, run_a1_royalty: $.data.royalty_accrued_cents, run_a1_reco: $.data.auto_disposition_recommendation }
            - &batchA1Get
              call: "GET /batches?production_run_id=${run_a1_id}"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { batch_a1_id: "$.data[0].id", batch_a1_code: "$.data[0].batch_code", batch_a1_status: "$.data[0].status" }
          assert:
            - "HTTP 200, run_status == COMPLETED, ${run_a1_waste} == 8.40 (1200.00 * 1200 / 60000 * 0.35) and ${run_a1_royalty} == 126000 (1200.00 * 2100 * 500 / 10000)"
            - "all four gates are true (|0.20| <= 0.25; |0.10 - 0.10| <= 0.30; |0.10| <= curl allowance 0.16; profile_family NONE forces tongue true) so ${run_a1_reco} == RELEASED"
            - "GET /design-licenses/${lic_id}/utilization now reports reserved_volume_sqm 0.00, consumed_volume_sqm 1200.00, accrued_royalty_cents 126000 and contributing_run_count 1"
            - "exactly one Batch exists (total_count == 1) with ${batch_a1_code} == RUN-A1-B1, ${batch_a1_status} == IN_PRODUCTION, quantity_sqm 1200.00, available_quantity_sqm 0.00 and wear_layer_measured_mil 12.0"
            - "GET /batches/${batch_a1_id} returns traceability_snapshot with exactly formulation_code F-MIN, formulation_revision 1, blended_cost_per_kg_cents 201, print_film_design_code PF-OAK-1200, license_code LIC-OAK, press_line_code PL-1, planned_start_utc 2026-08-01T01:00:00Z, planned_end_utc 2026-08-01T09:00:00Z, wear_layer_mil_spec 12"

      - name: completed_run_cannot_be_aborted_and_ledger_is_untouched
        claim_type: invalid_transitions
        grounds:
          - "state_machines.ProductionRun terminal/from-set for run_status=ABORTED"
          - "validations.V-STATE-6"
          - "errors.ERR_INVALID_RUN_STATE"
        distinguishing_aspect: |
          COMPLETED is outside the abort edge's from-set {PLANNED, SETUP, RUNNING}, so the
          compensation that abort would perform must not happen: the licence ledger and the
          minted Batch have to be observably unchanged after the refusal.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
            - *pl1
            - *runA1
            - *runA1Setup
            - *runA1Start
            - *runA1Complete
          trigger:
            - call: "POST /production-runs/${run_a1_id}/abort"
              payload: { abort_reason: "planner changed their mind after the fact" }
              as: ProductionPlanner
              as_user_id: "pp-001"
              captures: { abort_error: $.data.error_id }
          assert:
            - "HTTP 409 and ${abort_error} == ERR_INVALID_RUN_STATE"
            - "GET /production-runs/${run_a1_id} still reports run_status COMPLETED, abort_reason null and royalty_accrued_cents 126000"
            - "GET /design-licenses/${lic_id}/utilization is unchanged: reserved_volume_sqm 0.00, consumed_volume_sqm 1200.00, accrued_royalty_cents 126000 — no reservation was released a second time"
            - "GET /batches?production_run_id=${run_a1_id} still returns total_count == 1"

      - name: discontinued_sku_commercial_dimension_accepts_nothing_further
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.ProductSku.terminal_states commercial_status=DISCONTINUED"
          - "validations.V-STATE-4"
          - "errors.ERR_INVALID_COMMERCIAL_STATE"
        distinguishing_aspect: |
          Every one of the three declared commercial targets is refused from
          DISCONTINUED, including DISCONTINUED itself — a terminal state is not merely
          "cannot go back", it accepts no self-loop either.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *lic
            - *pf1
            - *skuA
            - call: "POST /product-skus/${sku_a_id}/commercial-status"
              payload: { to_status: DISCONTINUED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { disc_cert: $.data.certification_status, disc_comm: $.data.commercial_status }
          trigger:
            - call: "POST /product-skus/${sku_a_id}/commercial-status"
              payload: { to_status: RELEASED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { relock_error: $.data.error_id }
            - call: "POST /product-skus/${sku_a_id}/commercial-status"
              payload: { to_status: HOLD }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { holdlock_error: $.data.error_id }
            - call: "POST /product-skus/${sku_a_id}/commercial-status"
              payload: { to_status: DISCONTINUED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { selflock_error: $.data.error_id }
          assert:
            - "the setup call left ${disc_comm} == DISCONTINUED and ${disc_cert} == DECERTIFIED (the cross-dimension force)"
            - "${relock_error} == ${holdlock_error} == ${selflock_error} == ERR_INVALID_COMMERCIAL_STATE, each with HTTP 409"
            - "GET /product-skus/${sku_a_id} still reports commercial_status DISCONTINUED, certification_status DECERTIFIED and the same version as after the setup call"

      - name: begin_testing_twice_is_rejected_not_silently_repeated
        claim_type: idempotency
        grounds:
          - "validations.V-STATE-3"
          - "errors.ERR_INVALID_SKU_CERTIFICATION_STATE"
          - "state_machines.ProductSku certification_status=UNCERTIFIED -> TESTING"
        distinguishing_aspect: |
          begin-testing is NOT idempotent by design: its from-set is {UNCERTIFIED,
          SUSPENDED}, so a second call from TESTING is a 409 rather than a no-op re-entry
          that would silently clear the pinned versions and stamped costs a second time.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
          trigger:
            - call: "POST /product-skus/${sku_a_id}/begin-testing"
              payload: {}
              as: QaTechnician
              as_user_id: "qa-001"
              captures: { twice_error: $.data.error_id }
          assert:
            - "HTTP 409 and ${twice_error} == ERR_INVALID_SKU_CERTIFICATION_STATE"
            - "GET /product-skus/${sku_a_id} reports certification_status TESTING and version 2 — the failed second call did not increment version"

      - name: certification_and_commercial_dimensions_advance_independently
        claim_type: parallel
        grounds:
          - "state_machines.ProductSku.initial_state (compound)"
          - "state_machines.ProductSku certification_status=PROVISIONAL -> CERTIFIED"
          - "state_machines.ProductSku commercial_status=DEVELOPMENT -> RELEASED"
        distinguishing_aspect: |
          The two dimensions live on ONE row and are driven by two different endpoints and
          two different roles: certify must leave commercial_status at DEVELOPMENT, and the
          commercial release must leave certification_status at CERTIFIED with its pins and
          stamped costs untouched.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
            - *tpA1Ind
            - *tpA1Dim
          trigger:
            - &skuACertify
              call: "POST /product-skus/${sku_a_id}/certify"
              payload: {}
              as: TechnicalDirector
              as_user_id: "td-002"
              captures: { cert_cert: $.data.certification_status, cert_comm: $.data.commercial_status, cert_std: $.data.standard_cost_cents_per_sqm, cert_list: $.data.list_price_cents_per_sqm }
            - &skuARelease
              call: "POST /product-skus/${sku_a_id}/commercial-status"
              payload: { to_status: RELEASED }
              as: PlantAdmin
              as_user_id: "pa-001"
              captures: { rel_cert: $.data.certification_status, rel_comm: $.data.commercial_status, rel_std: $.data.standard_cost_cents_per_sqm }
          assert:
            - "after certify: ${cert_cert} == CERTIFIED but ${cert_comm} == DEVELOPMENT — the commercial dimension did not move"
            - "certify stamped ${cert_std} == 1157 and ${cert_list} == 1562, pinned_formulation_version == 2 (F-MIN advanced to version 2 at approval), pinned_print_film_version == 1, pin_stale == false and certified_by_user_id == td-002"
            - "after the commercial release: ${rel_comm} == RELEASED and ${rel_cert} == CERTIFIED — the certification dimension did not move"
            - "${rel_std} == 1157 — the stamped cost was not recomputed by the commercial transition"

      - name: delamination_claim_forks_two_reviews_and_joins_to_adjudication_ready
        claim_type: branching
        grounds:
          - "state_machines.WarrantyClaim SUBMITTED -> TRIAGE (FORK)"
          - "state_machines.WarrantyClaim TRIAGE -> TRIAGE (branch arm)"
          - "state_machines.WarrantyClaim TRIAGE -> ADJUDICATION_READY (JOIN)"
          - "calculations.warranty_settlement_amount variant STEPPED_SCHEDULE"
        distinguishing_aspect: |
          A DELAMINATION claim forks into TWO required review arms, so the join must NOT
          fire after the first arm is answered — the claim stays in TRIAGE — and only the
          second arm advances it to ADJUDICATION_READY. A DIMENSIONAL_MOVEMENT claim on
          the same batch forks into ONE arm and joins immediately, proving the fork width
          is claim_type-driven.
        test_recipe:
          setup_api_calls:
            - *clock0
            - *dist
            - *rmResin
            - *rmStab
            - *fmin
            - *fminC1
            - *fminC2
            - *fminSubmit
            - *fminApprove
            - *lic
            - *pf1
            - *skuA
            - *skuABegin
            - *tpA1
            - *tpA1Start
