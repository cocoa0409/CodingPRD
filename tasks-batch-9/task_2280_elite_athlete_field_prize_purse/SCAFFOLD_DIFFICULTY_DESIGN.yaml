            - call: GET /race-editions/${ed_id}
              as: FinanceOfficer
          trigger:
            - call: POST /doping-tests/${test_ooc_id}/adjudicate
              payload: { outcome: ADVERSE, outcome_notes: "adverse analytical finding on sample S-OOC-1" }
              as: SanctioningBody
            - call: GET /race-results/${res1_id}
              as: TechnicalOfficial
            - call: GET /prize-awards/${award1_id}
              as: FinanceOfficer
            - call: GET /invitations/${inv1_id}
              as: ElitesDirector
            - call: GET /invitations/${inv1_id}/fluid-station-slots
              as: ElitesDirector
            - call: GET /race-editions/${ed_id}
