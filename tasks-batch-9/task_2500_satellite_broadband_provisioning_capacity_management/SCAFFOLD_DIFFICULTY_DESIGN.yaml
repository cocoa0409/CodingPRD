  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: subscription_four_parallel_dimensions_advance_independently
        grounds:
          - state_machines.Subscription.UNAUTHORIZED_to_AUTHORIZED_FIXED
          - state_machines.Subscription.PRIORITY_to_DEPRIORITIZED
          - state_machines.Subscription.ACTIVE_to_SUSPENDED
          - state_machines.Subscription.PENDING_ACK_to_ACKNOWLEDGED
          - entities.Subscription.fields.authorization_state
          - entities.Subscription.fields.priority_state
        distinguishing_aspect: |
          Entity 1 of 2 — Subscription carries parallel state dimensions on one row: authorize moves
          authorization_state and service_state while leaving priority_state PRIORITY; a fair-use
          crossing moves only priority_state; a suspend moves only service_state and leaves
          authorization_state AUTHORIZED_FIXED and priority_state DEPRIORITIZED intact.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; base licence/beam/cell/plan fixture; cell max_active_terminals 1."
            - "One subscription exists at service_state PENDING_ACTIVATION, authorization_state UNAUTHORIZED, priority_state PRIORITY, disclosure_ack_state ACKNOWLEDGED (the disclosure has been acknowledged but network authorisation has not been granted)."
