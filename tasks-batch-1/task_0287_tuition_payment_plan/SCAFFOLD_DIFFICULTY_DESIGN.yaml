              as: Registrar
            - call: "GET /institutions/late-fees?enrollment_id=${enr_17}"
              as: Registrar
              captures: { lf_q: $.data.0.id }
          trigger:
            - call: "POST /institutions/late-fees/${lf_q}/waive"
              as: Registrar
            - call: "GET /institutions/enrollments/${enr_17}"
              as: Registrar
              captures: { q_lfbal: $.data.late_fee_balance_cents }
          assert:
            - "LateFee ${lf_q} status == WAIVED"
            - "Enrollment.${enr_17}.late_fee_balance_cents == 0 (restored to pre-assessment value)"

      - name: charge_post_then_reverse_conserves_financed_principal
        grounds:
          - state_machines.Charge
          - calculations.balance_recalc_on_charge
          - entities.Enrollment.fields.scheduled_balance_cents
