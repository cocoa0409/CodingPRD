  - rule_id: non_linear_state_machine
    instances:

      - name: injury_report_correction_loop_capped_at_two_rounds_then_verifiable
        grounds:
          - state_machines.InjuryReport.PENDING_VERIFICATION_to_RETURNED_FOR_CORRECTION
          - state_machines.InjuryReport.RETURNED_FOR_CORRECTION_to_PENDING_VERIFICATION
          - state_machines.InjuryReport.PENDING_VERIFICATION_to_VERIFIED
          - entities.InjuryReport.fields.correction_round_count
          - validations[priority=31]
          - errors[ERR_CORRECTION_ROUNDS_EXHAUSTED]
        distinguishing_aspect: |
          This is the CYCLIC shape: InjuryReport loops PENDING_VERIFICATION -> RETURNED_FOR_CORRECTION ->
          PENDING_VERIFICATION twice, correction_round_count is monotonic across the loop (never reset by
          resubmit), the third return attempt is refused with ERR_CORRECTION_ROUNDS_EXHAUSTED (409), and
          the report remains verifiable afterwards with correction_round_count frozen at 2 - the loop cap
          bounds the cycle without poisoning the forward path.
