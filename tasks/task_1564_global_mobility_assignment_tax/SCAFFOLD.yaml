    roles: [MobilityAdmin, BusinessUnitApprover, MobilityApprover, PayrollSpecialist, FinanceController, VendorCoordinator, TaxVendor, Assignee, Any]
    code: 200
    input: ["assignment_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: "ShadowPayrollRecord[]"
    side_effects: []
  - method: POST
    path: "/mobility/shadow-payroll-records/{id}/post"
    description: "Post a DRAFT record: freezes computed fields, creates the PERIOD_COST chargeback entry, updates assignment YTD aggregates, runs the overrun posture check"
    roles: [PayrollSpecialist]
