          - validations[priority 38 ERR_FILING_WINDOW_CLOSED]
        distinguishing_aspect: "Both filings were created on 2026-08-01 and so carry reporting_due_date 2026-10-30; submitting exactly on that date passes because equality is admissible, while submitting one day later is a 422."
