scaffold_corner_design:

  # ===================================================================
  # Entities
  # ===================================================================
  - section: entities
    instances:
      - name: create_session_package_returns_201_with_fields
        claim_type: Creation
        grounds: [entities.SessionPackage, endpoints]
        distinguishing_aspect: "POST /studio/session-packages with all required fields -> 201; response carries id, name, tier, base_fee_cents, and defaults (active=true, requires_model_release=false)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/session-packages"
              payload: { name: "Event Premium", session_type: "EVENT", tier: "PREMIUM", base_fee_cents: 400000, included_shoot_hours: 8, overage_hourly_rate_cents: 25000, included_edited_images: 200, deposit_pct: 0.40 }
              as: StudioAdmin
              captures: { pk: $.data.id, act: $.data.active, mr: $.data.requires_model_release }
          assert:
            - "response code == 201"
            - "SessionPackage.${pk}.active == true"
            - "SessionPackage.${pk}.requires_model_release == false"

      - name: get_booking_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Booking, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /studio/bookings/{random-uuid} -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /studio/bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_booking_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Booking, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /studio/bookings omitting requested_shoot_hours -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["A client, photographer, and active package exist."]
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "ce1@x.com", full_name: "CE One", phone: "1" }
              as: StudioAdmin
              captures: { ce1: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "pe1@x.com", full_name: "PE One", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { pe1: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "PB E1", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, active: true }
              as: StudioAdmin
              captures: { pke1: $.data.id }
          trigger:
            - call: "POST /studio/bookings"
              payload: { client_id: "${ce1}", package_id: "${pke1}", lead_photographer_id: "${pe1}" }
              as: Client
              as_user_id: "${ce1}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: booking_computed_fields_ignore_client_supplied_values
        claim_type: System Fields
        grounds: [entities.Booking.fields.total_fee_cents, entities.Booking.fields.workflow_status]
        distinguishing_aspect: "New booking starts workflow_status=DRAFT, payment_status=UNPAID, amount_paid_cents=0 regardless of input; id/version are system-minted."
        test_recipe:
          setup: ["A client, photographer, and active package exist."]
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "ce2@x.com", full_name: "CE Two", phone: "2" }
              as: StudioAdmin
              captures: { ce2: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "pe2@x.com", full_name: "PE Two", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { pe2: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "PB E2", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, active: true }
              as: StudioAdmin
              captures: { pke2: $.data.id }
          trigger:
            - call: "POST /studio/bookings"
              payload: { client_id: "${ce2}", package_id: "${pke2}", lead_photographer_id: "${pe2}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${ce2}"
              captures: { bk: $.data.id, wf: $.data.workflow_status, pay: $.data.payment_status, ver: $.data.version }
          assert:
            - "Booking.${bk}.workflow_status == DRAFT"
            - "Booking.${bk}.payment_status == UNPAID"
            - "Booking.${bk}.amount_paid_cents == 0"
            - "Booking.${bk}.version == 1"

      - name: create_booking_invalid_enum_session_package_rejected
        claim_type: Type Constraints
        grounds: [entities.SessionPackage.fields.tier, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /studio/session-packages with tier='GOLD' (not in {BASIC,STANDARD,PREMIUM}) -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /studio/session-packages"
              payload: { name: "Bad Tier", session_type: "PORTRAIT", tier: "GOLD", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 422"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: proof_selection_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.ProofSelection]
        distinguishing_aspect: "ProofSelection has common_fields:false — it exposes id and created_at but no version field, and no update/delete endpoint exists."
        test_recipe:
          setup: ["A SHOT booking with a PROOFING gallery exists; client records a proof selection."]
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "ce3@x.com", full_name: "CE Three", phone: "3" }
              as: StudioAdmin
              captures: { ce3: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "pe3@x.com", full_name: "PE Three", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { pe3: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "PB E3", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, active: true }
              as: StudioAdmin
              captures: { pke3: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${ce3}", package_id: "${pke3}", lead_photographer_id: "${pe3}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${ce3}"
              captures: { bk3: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk3}" }
              as: StudioAdmin
              captures: { ct3: $.data.id }
            - call: "POST /studio/contracts/${ct3}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct3}/sign"
              payload: {}
              as: Client
              as_user_id: "${ce3}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk3}", start_utc: "2026-07-01T10:00:00Z", end_utc: "2026-07-01T12:00:00Z" }
              as: StudioAdmin
              captures: { sc3: $.data.id }
            - call: "POST /studio/bookings/${bk3}/confirm"
              payload: {}
              as: Client
              as_user_id: "${ce3}"
            - call: "POST /studio/payments"
              payload: { booking_id: "${bk3}", kind: "DEPOSIT", amount_cents: 30000 }
              as: StudioAdmin
              captures: { p3: $.data.id }
            - call: "POST /studio/payments/${p3}/settle"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T12:30:00Z" }
              as: StudioAdmin
            - call: "POST /studio/shoot-schedules/${sc3}/complete"
              payload: {}
              as: Photographer
              as_user_id: "${pe3}"
            - call: "POST /studio/galleries"
              payload: { booking_id: "${bk3}" }
              as: Photographer
              as_user_id: "${pe3}"
              captures: { g3: $.data.id }
            - call: "POST /studio/galleries/${g3}/upload"
              payload: { delivered_image_count: 30 }
              as: Photographer
              as_user_id: "${pe3}"
          trigger:
            - call: "POST /studio/galleries/${g3}/proof-selections"
              payload: { selected_image_count: 12 }
              as: Client
              as_user_id: "${ce3}"
              captures: { ps3: $.data.id, ri: $.data.round_index }
          assert:
            - "response code == 201"
            - "ProofSelection.${ps3}.round_index == 0"

  # ===================================================================
  # State Machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_booking_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.DRAFT_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A DRAFT booking cancelled, then cancelled again -> ERR_INVALID_STATE (409); CANCELLED is terminal."
        test_recipe:
          setup: ["A DRAFT booking exists and is cancelled."]
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "ce4@x.com", full_name: "CE Four", phone: "4" }
              as: StudioAdmin
              captures: { ce4: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "pe4@x.com", full_name: "PE Four", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { pe4: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "PB E4", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, active: true }
              as: StudioAdmin
              captures: { pke4: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${ce4}", package_id: "${pke4}", lead_photographer_id: "${pe4}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${ce4}"
              captures: { bk4: $.data.id }
            - call: "POST /studio/bookings/${bk4}/cancel"
              payload: {}
              as: Client
              as_user_id: "${ce4}"
          trigger:
            - call: "POST /studio/bookings/${bk4}/cancel"
              payload: {}
              as: Client
              as_user_id: "${ce4}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: confirm_draft_booking_initial_state_and_computed_total
        claim_type: Valid Transition
        grounds: [state_machines.Booking.DRAFT_to_CONFIRMED, calculations.deposit_due]
        distinguishing_aspect: "Confirm a signed+scheduled DRAFT booking -> CONFIRMED; total_fee_cents=100000, deposit_due_cents floored at MIN_DEPOSIT? No: 0.30*100000=30000."
        test_recipe:
          setup: ["PORTRAIT BASIC DRAFT booking, contract SIGNED, shoot SCHEDULED."]
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "ce5@x.com", full_name: "CE Five", phone: "5" }
              as: StudioAdmin
              captures: { ce5: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "pe5@x.com", full_name: "PE Five", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { pe5: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "PB E5", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, active: true }
              as: StudioAdmin
              captures: { pke5: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${ce5}", package_id: "${pke5}", lead_photographer_id: "${pe5}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${ce5}"
              captures: { bk5: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk5}" }
              as: StudioAdmin
              captures: { ct5: $.data.id }
            - call: "POST /studio/contracts/${ct5}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct5}/sign"
              payload: {}
              as: Client
              as_user_id: "${ce5}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk5}", start_utc: "2026-07-12T10:00:00Z", end_utc: "2026-07-12T12:00:00Z" }
              as: StudioAdmin
              captures: { sc5: $.data.id }
          trigger:
            - call: "POST /studio/bookings/${bk5}/confirm"
              payload: {}
              as: Client
              as_user_id: "${ce5}"
              captures: { wf: $.data.workflow_status, tot: $.data.total_fee_cents, dep: $.data.deposit_due_cents }
          assert:
            - "Booking.${bk5}.workflow_status == CONFIRMED"
            - "Booking.${bk5}.total_fee_cents == 100000"
            - "Booking.${bk5}.deposit_due_cents == 30000"

      - name: reschedule_limit_exhausted_returns_reschedule_limit
        claim_type: Invalid Transitions
        grounds: ["validations[priority=12]", state_machines.ShootSchedule.SCHEDULED_to_RESCHEDULED, "errors[ERR_RESCHEDULE_LIMIT]"]
        distinguishing_aspect: "After 3 reschedules (reschedule_count==MAX_RESCHEDULES=3), a 4th reschedule -> ERR_RESCHEDULE_LIMIT (409)."
        test_recipe:
          setup: ["CONFIRMED booking with a SCHEDULED shoot, rescheduled 3 times (reschedule_count==3)."]
          setup_api_calls:
            - call: "POST /studio/clients"
              payload: { email: "ce6@x.com", full_name: "CE Six", phone: "6" }
              as: StudioAdmin
              captures: { ce6: $.data.id }
            - call: "POST /studio/photographers"
              payload: { email: "pe6@x.com", full_name: "PE Six", skills: ["PHOTO"], hourly_rate_cents: 7000 }
              as: StudioAdmin
              captures: { pe6: $.data.id }
            - call: "POST /studio/session-packages"
              payload: { name: "PB E6", session_type: "PORTRAIT", tier: "BASIC", base_fee_cents: 100000, included_shoot_hours: 2, overage_hourly_rate_cents: 12000, included_edited_images: 30, deposit_pct: 0.30, active: true }
              as: StudioAdmin
              captures: { pke6: $.data.id }
            - call: "POST /studio/bookings"
              payload: { client_id: "${ce6}", package_id: "${pke6}", lead_photographer_id: "${pe6}", requested_shoot_hours: 2 }
              as: Client
              as_user_id: "${ce6}"
              captures: { bk6: $.data.id }
            - call: "POST /studio/contracts"
              payload: { booking_id: "${bk6}" }
              as: StudioAdmin
              captures: { ct6: $.data.id }
            - call: "POST /studio/contracts/${ct6}/send"
              payload: {}
              as: StudioAdmin
            - call: "POST /studio/contracts/${ct6}/sign"
              payload: {}
              as: Client
              as_user_id: "${ce6}"
            - call: "POST /studio/shoot-schedules"
              payload: { booking_id: "${bk6}", start_utc: "2026-07-20T10:00:00Z", end_utc: "2026-07-20T12:00:00Z" }
              as: StudioAdmin
              captures: { sc6: $.data.id }
            - call: "POST /studio/bookings/${bk6}/confirm"
              payload: {}
              as: Client
              as_user_id: "${ce6}"
            - call: "POST /studio/shoot-schedules/${sc6}/reschedule"
              payload: { new_start_utc: "2026-07-21T10:00:00Z", new_end_utc: "2026-07-21T12:00:00Z", reason: "WEATHER" }
              as: StudioAdmin
            - call: "POST /studio/shoot-schedules/${sc6}/reschedule"
              payload: { new_start_utc: "2026-07-22T10:00:00Z", new_end_utc: "2026-07-22T12:00:00Z", reason: "WEATHER" }
              as: StudioAdmin
            - call: "POST /studio/shoot-schedules/${sc6}/reschedule"
              payload: { new_start_utc: "2026-07-23T10:00:00Z", new_end_utc: "2026-07-23T12:00:00Z", reason: "WEATHER" }
              as: StudioAdmin
          trigger:
            - call: "POST /studio/shoot-schedules/${sc6}/reschedule"
              payload: { new_start_utc: "2026-07-24T10:00:00Z", new_end_utc: "2026-07-24T12:00:00Z", reason: "WEATHER" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "data.error_id == ERR_RESCHEDULE_LIMIT"

      - name: revision_limit_exhausted_returns_revision_limit
        claim_type: Invalid Transitions
        grounds: ["validations[priority=13]", state_machines.Gallery.PROOFING_to_REVISION_REQUESTED, "errors[ERR_REVISION_LIMIT]"]
        distinguishing_aspect: "After revision_round reaches MAX_REVISION_ROUNDS=2, a further request-revision -> ERR_REVISION_LIMIT (409)."
        test_recipe:
          setup: ["A PROOFING gallery whose revision_round==2 after two completed revision loops."]
          setup_api_calls:
            - call: "POST /studio/clients"
