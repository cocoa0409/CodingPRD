# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Travel & Expense Reimbursement (T&E)
# Walks references/claim-extraction-guide.md against SCAFFOLD.yaml §1.1–§1.7.
# excluded_because stubs cite a §1.8 instance by name (no test_recipe).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_traveler_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.Traveler
          - endpoints
        distinguishing_aspect: "POST /travelers with all required fields returns 201 and Traveler with status ACTIVE, server-minted id."
        test_recipe:
          setup: ["Need an Approver to be manager_id."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm1@x.com", full_name: "CMgr1", approval_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
          trigger:
            - call: "POST /travelers"
              payload: { email: "ct1@x.com", full_name: "CTrav1", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
          assert:
            - "Response status 201 and Traveler.${trav_id}.status == ACTIVE"
            - "Traveler.${trav_id}.email == 'ct1@x.com' and home_office_state == 'CA'"

      - name: get_traveler_not_found
        claim_type: Not Found
        grounds:
          - entities.Traveler
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /travelers/{id} with a non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /travelers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status 404 and $.data.error_id == ERR_NOT_FOUND"

      - name: create_traveler_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Traveler.fields.manager_id
          - validations[priority=5]
        distinguishing_aspect: "POST /travelers omitting manager_id returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /travelers"
              payload: { email: "ct2@x.com", full_name: "CTrav2", home_office_state: "CA" }
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status 422 and $.data.error_id == ERR_INVALID_REQUEST"

      - name: expense_report_per_diem_method_default
        claim_type: Defaults
        grounds:
          - entities.ExpenseReport.fields.per_diem_method
        distinguishing_aspect: "Omitting per_diem_method on POST /expense-reports applies default PER_DIEM."
        test_recipe:
          setup: ["ACTIVE policy, CA rate, approved CA trip."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm3@x.com", full_name: "CMgr3", approval_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "ct3@x.com", full_name: "CTrav3", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 50000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Default Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
          assert:
            - "ExpenseReport.${rpt_id}.per_diem_method == PER_DIEM"

      - name: virtual_card_computed_fields_ignore_input
        claim_type: System Fields
        grounds:
          - entities.VirtualCard.fields.available_balance_cents
          - entities.VirtualCard.fields.captured_total_cents
        distinguishing_aspect: "On card issuance, available_balance_cents == load_limit_cents and captured_total_cents == 0; server computes, input ignored."
        test_recipe:
          setup: ["Approved CA trip."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm4@x.com", full_name: "CMgr4", approval_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "ct4@x.com", full_name: "CTrav4", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 100000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_v2: $.data.version }
          trigger:
            - call: "POST /trip-requests/${trip_id}/virtual-cards"
              payload: { load_limit_cents: 80000, expected_trip_request_version: "${trip_v2}" }
              as: FinanceAdmin
              captures: { card_id: $.data.id }
          assert:
            - "VirtualCard.${card_id}.available_balance_cents == 80000 and authorized_holds_cents == 0 and captured_total_cents == 0"

      - name: per_diem_rate_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.PerDiemRate
        distinguishing_aspect: "PerDiemRate (common_fields:false) is created and read; it exposes id + created_at and has no update/state endpoint."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls:
            - call: "POST /per-diem-rates"
              payload: { state_code: "NY", lodging_cap_cents: 30000, mie_cents: 9000 }
              as: FinanceAdmin
              captures: { rate_id: $.data.id }
          trigger:
            - call: "GET /per-diem-rates/${rate_id}"
              payload: {}
              as: FinanceAdmin
              captures: { got: $.data.state_code }
          assert:
            - "GET returns 200 and PerDiemRate.${rate_id}.state_code == NY and lodging_cap_cents == 30000"

      - name: list_expense_lines_filtered_by_report
        claim_type: Listing
        grounds:
          - entities.ExpenseLine
          - endpoints
        distinguishing_aspect: "GET /expense-lines?report_id returns the report's lines as an array with pagination envelope fields."
        test_recipe:
          setup: ["Approved CA trip; DRAFT report with two out-of-pocket lines."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm5@x.com", full_name: "CMgr5", approval_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "ct5@x.com", full_name: "CTrav5", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 100000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "List Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "MILEAGE", claimed_amount_cents: 0, miles: 100 }
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "MILEAGE", claimed_amount_cents: 0, miles: 50 }
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "GET /expense-lines?report_id=${rpt_id}"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
          assert:
            - "Response response_type == array, data length 2, meta total_count == 2, has_more == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_trip_from_approved_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TripRequest
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancelling an APPROVED trip (cancel only defined from PENDING) returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["In-policy CA trip auto-approved (APPROVED)."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm6@x.com", full_name: "CMgr6", approval_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "ct6@x.com", full_name: "CTrav6", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-05", budget_total_cents: 200000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
          trigger:
            - call: "POST /trip-requests/${trip_id}/cancel"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { err: $.data.error_id }
          assert:
            - "TripRequest.${trip_id}.status == APPROVED"
            - "Response status 409 and $.data.error_id == ERR_INVALID_STATE"

      - name: trip_request_initial_state_pending
        claim_type: Initial State
        grounds:
          - state_machines.TripRequest
          - entities.TripRequest.fields.status
        distinguishing_aspect: "A newly created TripRequest starts in status PENDING."
        test_recipe:
          setup: ["ACTIVE policy, CA rate."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm7@x.com", full_name: "CMgr7", approval_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "ct7@x.com", full_name: "CTrav7", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
          trigger:
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 50000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
          assert:
            - "TripRequest.${trip_id}.status == PENDING and version == 1"

      - name: terminal_denied_trip_decision_locked
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TripRequest
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A DENIED trip cannot be decided again — second decision returns 409 ERR_INVALID_STATE (terminal)."
        test_recipe:
          setup: ["OOP CA trip denied by approver (DENIED)."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm8@x.com", full_name: "CMgr8", approval_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "ct8@x.com", full_name: "CTrav8", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-05", budget_total_cents: 300000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /trip-requests/${trip_id}/decision"
              payload: { decision: "DENY" }
              as: Approver
              as_user_id: "${mgr_id}"
          trigger:
            - call: "POST /trip-requests/${trip_id}/decision"
              payload: { decision: "APPROVE" }
              as: Approver
              as_user_id: "${mgr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "TripRequest.${trip_id}.status == DENIED"
            - "Response status 409 and $.data.error_id == ERR_INVALID_STATE"

      - name: receipt_verify_amount_mismatch
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Receipt.OCR_PROCESSED_to_VERIFIED
          - errors[ERR_RECEIPT_AMOUNT_MISMATCH]
        distinguishing_aspect: "Verifying a receipt whose ocr_amount_cents != linked line claimed_amount_cents returns 409 ERR_RECEIPT_AMOUNT_MISMATCH."
        test_recipe:
          setup: ["DRAFT report with one line claimed 10000; receipt uploaded and OCR'd to 9999."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm9@x.com", full_name: "CMgr9", approval_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "ct9@x.com", full_name: "CTrav9", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 100000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Receipt Match Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "RENTAL_CDW", claimed_amount_cents: 10000, rental_days: 5 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { line_id: $.data.id }
            - call: "POST /receipts"
              payload: { expense_line_id: "${line_id}", image_ref: "img://r1" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/ocr"
              payload: { ocr_amount_cents: 9999, ocr_merchant: "Hertz" }
              as: FinanceAdmin
          trigger:
            - call: "POST /receipts/${rcpt_id}/verify"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 and $.data.error_id == ERR_RECEIPT_AMOUNT_MISMATCH"

      - name: receipt_dispute_then_verify_path
        claim_type: Valid Transition
        grounds:
          - state_machines.Receipt.OCR_PROCESSED_to_DISPUTED
          - state_machines.Receipt.DISPUTED_to_VERIFIED
        distinguishing_aspect: "Receipt OCR_PROCESSED->DISPUTED->VERIFIED works once ocr_amount matches claimed."
        test_recipe:
          setup: ["DRAFT report with one line claimed 10000; receipt OCR'd to 10000."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm10@x.com", full_name: "CMgr10", approval_limit_cents: 500000 }
              as: FinanceAdmin
              captures: { mgr_id: $.data.id }
            - call: "POST /travelers"
              payload: { email: "ct10@x.com", full_name: "CTrav10", home_office_state: "CA", manager_id: "${mgr_id}" }
              as: FinanceAdmin
              captures: { trav_id: $.data.id }
            - call: "POST /travel-policies"
              payload: { name: "Std", max_economy_fare_cents: 50000, business_class_min_hours: 6, advance_purchase_days: 14, cdw_daily_cap_cents: 3000, mileage_rate_milli_cents: 67000, receipt_required_threshold_cents: 7500 }
              as: FinanceAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /travel-policies/${policy_id}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /per-diem-rates"
              payload: { state_code: "CA", lodging_cap_cents: 20000, mie_cents: 8000 }
              as: FinanceAdmin
            - call: "POST /trip-requests"
              payload: { traveler_id: "${trav_id}", destination_state: "CA", start_date: "2026-06-01", end_date: "2026-06-03", budget_total_cents: 100000 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { trip_id: $.data.id }
            - call: "POST /trip-requests/${trip_id}/submit"
              payload: {}
              as: Traveler
              as_user_id: "${trav_id}"
            - call: "POST /expense-reports"
              payload: { trip_request_id: "${trip_id}", title: "Dispute Rpt" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rpt_id: $.data.id }
            - call: "POST /expense-lines"
              payload: { report_id: "${rpt_id}", line_type: "RENTAL_CDW", claimed_amount_cents: 10000, rental_days: 5 }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { line_id: $.data.id }
            - call: "POST /receipts"
              payload: { expense_line_id: "${line_id}", image_ref: "img://r2" }
              as: Traveler
              as_user_id: "${trav_id}"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/ocr"
              payload: { ocr_amount_cents: 10000, ocr_merchant: "Hertz" }
              as: FinanceAdmin
            - call: "POST /receipts/${rcpt_id}/dispute"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /receipts/${rcpt_id}/verify"
              payload: {}
              as: FinanceAdmin
              captures: { st: $.data.status }
          assert:
            - "Receipt.${rcpt_id}.status == VERIFIED"

      - name: oop_step_out_of_order_rejected
        claim_type: guarded transitions
        grounds:
          - state_machines.ApprovalStep.PENDING_to_APPROVED
          - errors[ERR_OOP_STEP_OUT_OF_ORDER]
        distinguishing_aspect: "Deciding ApprovalStep order 2 while step order 1 is still PENDING returns 409 ERR_OOP_STEP_OUT_OF_ORDER."
        test_recipe:
          setup: ["A report with two ApprovalSteps (order 1, order 2) both PENDING, assigned to the same approver."]
          setup_api_calls:
            - call: "POST /approvers"
              payload: { email: "cm11@x.com", full_name: "CMgr11", approval_limit_cents: 1000000 }
