  - rule_id: resource_temporal_overlap
    instances:

      - name: bond_coverage_intervals_are_half_open_so_adjacent_periods_stack
        grounds:
          - validations[priority=63]
          - errors[ERR_COVERAGE_PERIOD_OVERLAP]
          - state_machines.CoverageRecord.PENDING_VERIFICATION_to_VERIFIED
          - calculations.license_compliance_posture
          - entities.CoverageRecord.fields.expiration_date
        distinguishing_aspect: |
          Resource = one licence's BOND timeline, semantics = HALF-OPEN [effective_date, expiration_date):
          a bond starting exactly on the incumbent's expiration_date (2027-08-01) verifies, a bond starting
          one day earlier (2027-07-31) is refused, and a GENERAL_LIABILITY record with byte-identical dates
          to the incumbent bond verifies — the exclusion is scoped per coverage_type, not per licence.
        test_recipe:
          setup:
            - "clock at 2026-08-01 and one C-10 licence issued that day"
            - "one VERIFIED 1500000 BOND already covers [2026-08-01, 2027-08-01)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /licensing/trade-classifications"
              payload: { code: "C-10", name: "Electrical", hazard_tier: 3, min_experience_months: 48, min_net_worth_cents: 250000, required_bond_amount_cents: 1500000, required_ce_hours: 8, renewal_base_fee_cents: 45000, mediation_required: true }
