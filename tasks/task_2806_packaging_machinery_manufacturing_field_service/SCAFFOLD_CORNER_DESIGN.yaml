# ---------------------------------------------------------------------------
# 1.9 Scaffold Corner Design - breadth probe over the claim-extraction-guide
# taxonomy for task 2806 (Packaging Machinery Manufacturing & Field Service).
#
# Section values are the guide's nine sections. Corners already asserted by a
# SCAFFOLD_DIFFICULTY_DESIGN.yaml instance are emitted as excluded_because stubs
# that cite that instance by name.
#
# Logical clock: every recipe below assumes the default 2026-08-01T00:00:00Z
# unless it calls POST /packaging-oem/_clock/set_current_utc explicitly.
# ---------------------------------------------------------------------------
scaffold_corner_design:

  - section: entities
    instances:
      - name: customer_create_returns_201_with_status_active
        claim_type: Creation
        grounds:
          - endpoints[POST /packaging-oem/customers]
          - entities.Customer.fields.status
          - entities.Customer.fields.open_order_count
          - response_envelope.success
        distinguishing_aspect: |
          The create endpoint must echo every input field verbatim AND seed the system/computed
          fields: status ACTIVE (not null, not an input), open_order_count 0, version 1. An
          implementation that stores only the three input fields fails on the derived trio.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.response_type == object"
            - "response.meta.api_request_id is a non-empty string"
            - "response.data.legal_name == Northwind Beverages"
            - "response.data.region_code == NA"
            - "response.data.product_variation_pct == 4.00"
            - "response.data.status == ACTIVE"
            - "response.data.open_order_count == 0"
            - "response.data.version == 1"
            - "response.data.id, created_at and updated_at are all present and non-null"

      - name: machine_model_get_by_id_returns_stored_fields
        claim_type: Retrieval
        grounds:
          - endpoints[GET /packaging-oem/machine-models/{machineModelId}]
          - entities.MachineModel.fields.lifecycle_status
          - entities.MachineModel.fields.open_defect_review_count
        distinguishing_aspect: |
          A read-after-write on a different endpoint must return the same seven input fields plus
          lifecycle_status ACTIVE and open_defect_review_count 0 - proving the row was persisted, not
          just reflected by the create handler.
        test_recipe:
          setup:
            - "one MachineModel FL-600 created by PlatformAdmin"
          setup_api_calls:
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
          trigger:
            - call: "GET /packaging-oem/machine-models/${model_id}"
              payload: {}
              as: ApplicationEngineer
          assert:
            - "HTTP status == 200"
            - "response.data.id == ${model_id}"
            - "response.data.model_code == FL-600"
            - "response.data.machine_family == FILLER"
            - "response.data.nameplate_rate_cpm == 600"
            - "response.data.guarantee_efficiency_pct == 90.00"
            - "response.data.base_price_cents == 68000000"
            - "response.data.min_container_diameter_mm == 60"
            - "response.data.max_container_diameter_mm == 110"
            - "response.data.lifecycle_status == ACTIVE"
            - "response.data.open_defect_review_count == 0"

      - name: product_trial_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /packaging-oem/product-trials]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          With three trials for one customer and limit 2 / offset 0, the envelope must report
          total_count 3 (the unfiltered-by-page total) and has_more true while returning exactly 2
          items; total_count must NOT be the page length.
        test_recipe:
          setup:
            - "one Customer, one MachineModel and three SUBMITTED ProductTrial rows for that customer"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Cider 500", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial1_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Cider 750", container_family: "PET_ROUND", container_diameter_mm: 84 }
              as: ApplicationEngineer
              captures: { trial2_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Cider 1000", container_family: "PET_ROUND", container_diameter_mm: 86 }
              as: ApplicationEngineer
              captures: { trial3_id: $.data.id }
          trigger:
            - call: "GET /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "HTTP status == 200"
            - "response.response_type == array"
            - "len(response.data) == 2"
            - "response.total_count == 3"
            - "response.has_more == true"
            - "response.limit == 2"
            - "response.offset == 0"

      - name: customer_get_with_unknown_id_returns_customer_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /packaging-oem/customers/{customerId}]
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID must yield ERR_CUSTOMER_NOT_FOUND at 404, not a 500
          and not an empty 200 body.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /packaging-oem/customers/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.response_type == error"
            - "response.data.error_id == ERR_CUSTOMER_NOT_FOUND"
            - "response.data.message is a non-empty string"

      - name: machine_order_create_missing_equipment_price_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /packaging-oem/machine-orders]
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: |
          equipment_price_cents has source input and no default, so omitting it is a 400
          ERR_INVALID_REQUEST that must be raised BEFORE any FK lookup or state check - the referenced
          trial here is a legitimate PASSED trial, so only the missing field can explain the failure.
        test_recipe:
          setup:
            - "one Customer, one MachineModel and one PASSED ProductTrial"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
          trigger:
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}" }
              as: ApplicationEngineer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"
            - "GET /packaging-oem/machine-orders?customer_id=${cust_id} returns an empty list"

      - name: machine_order_change_parts_and_guarantee_basis_defaults_applied
        claim_type: Defaults
        grounds:
          - entities.MachineOrder.fields.change_parts_price_cents
          - entities.MachineOrder.fields.guarantee_basis
          - endpoints[POST /packaging-oem/machine-orders]
        distinguishing_aspect: |
          Both optional inputs carry declared defaults: change_parts_price_cents 0 and guarantee_basis
          NAMEPLATE. Omitting them must yield those exact values (not null), and the resulting
          order_total_cents must therefore be computed from a 0 change-parts leg.
        test_recipe:
          setup:
            - "one Customer, one MachineModel and one PASSED ProductTrial"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
          trigger:
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}", equipment_price_cents: 40000000 }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.data.change_parts_price_cents == 0"
            - "response.data.guarantee_basis == NAMEPLATE"
            - "response.data.fulfillment_status == DRAFT"
            - "response.data.commercial_status == QUOTED"
            - "response.data.rework_days == 0"
            - "response.data.fat_failure_count == 0"

      - name: production_line_committed_slot_days_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.ProductionLine.fields.committed_slot_days
          - calculations.line_committed_days_ledger
          - endpoints[POST /packaging-oem/production-lines]
        distinguishing_aspect: |
          committed_slot_days is source computed and is NOT in the endpoint's input list; a client that
          smuggles committed_slot_days: 99 into the body must be ignored (value 0), not obeyed and not
          rejected with a 400.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /packaging-oem/production-lines"
              payload: { line_code: "LINE-A", machine_family: "FILLER", changeover_buffer_days: 5, capacity_days_per_quarter: 120, committed_slot_days: 99 }
              as: PlatformAdmin
              captures: { line_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.data.committed_slot_days == 0 (the smuggled 99 is ignored)"
            - "response.data.status == OPEN"
            - "response.data.capacity_days_per_quarter == 120"

      - name: customer_system_fields_generated_on_create_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Customer.fields.status
          - endpoints[POST /packaging-oem/customers]
          - response_envelope.success
        distinguishing_aspect: |
          id, created_at, updated_at and version are system-generated and status is source system with
          default ACTIVE. Supplying id and status in the request body must not override any of them -
          the server-side id must differ from the supplied one and status must still be ACTIVE.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Contoso Foods", region_code: "EU", product_variation_pct: 12.50, id: "deadbeef-0000-0000-0000-000000000001", status: "SUSPENDED", version: 42 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response.data.id != deadbeef-0000-0000-0000-000000000001"
            - "response.data.status == ACTIVE"
            - "response.data.version == 1"
            - "response.data.created_at and updated_at are server-generated ISO 8601 timestamps"
            - "response.data.product_variation_pct == 12.50"

      - name: machine_model_create_with_unknown_machine_family_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.MachineModel.fields.machine_family
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: |
          machine_family is a closed enum {FILLER, CAPPER, LABELER, CARTONER}; a near-miss value must
          be rejected at 400 by the schema layer rather than stored verbatim.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "XX-100", machine_family: "FLLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 1000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: machine_model_max_diameter_below_min_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.MachineModel.fields.max_container_diameter_mm
          - errors[ERR_INVALID_REQUEST]
          - validations[priority=3]
        distinguishing_aspect: |
          The declared constraint is relational (max_container_diameter_mm >= min_container_diameter_mm),
          not a plain range check; 110 min with 60 max must be refused even though both values are
          individually legal integers.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-601", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 110, max_container_diameter_mm: 60 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: product_trial_create_with_unknown_customer_returns_customer_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.ProductTrial.fields.customer_id
          - errors[ERR_CUSTOMER_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          entity_topology is flat, so parentage is expressed as an explicit FK in the body: an unknown
          customer_id must 404 with the CUSTOMER-specific error even though machine_model_id is valid,
          proving FK integrity is checked per reference and not just for the first one.
        test_recipe:
          setup:
            - "one MachineModel FL-600 and no Customer rows"
          setup_api_calls:
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "00000000-0000-0000-0000-0000000000aa", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response.data.error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: machine_order_order_total_cents_computed_from_price_legs
        claim_type: Computed Fields
        grounds:
          - calculations.order_total_rollup
          - entities.MachineOrder.fields.order_total_cents
        excluded_because:
          difficulty_instance: order_total_rollup_tier_keyed_on_pre_fee_subtotal
          rationale: "The computed-field correctness of order_total_cents, discount_tier and commissioning_fee_cents is asserted with pinned literals by that §1.8 combinatorial_formula instance."

  - section: state_machines
    instances:
      - name: product_trial_start_testing_moves_submitted_to_testing
        claim_type: Valid Transition
        grounds:
          - state_machines.ProductTrial.transitions[SUBMITTED -> TESTING]
          - endpoints[POST /packaging-oem/product-trials/{productTrialId}/start-testing]
        distinguishing_aspect: |
          The happy edge: an in-range container on an ACTIVE customer and ACTIVE model moves the trial
          to TESTING, bumps version and leaves retest_count at 0 (starting the first test is not a retest).
        test_recipe:
          setup:
            - "one ACTIVE Customer, one ACTIVE MachineModel FL-600 (60..110 mm) and one SUBMITTED ProductTrial at 82 mm"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
          trigger:
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
          assert:
            - "HTTP status == 200"
            - "response.data.status == TESTING"
            - "response.data.retest_count == 0"
            - "response.data.config_recommendation == PENDING"
            - "response.data.version == 2"

      - name: machine_order_initial_state_is_draft_and_quoted
        claim_type: Initial State
        grounds:
          - state_machines.MachineOrder.dimension[fulfillment_status].initial_state
          - state_machines.MachineOrder.dimension[commercial_status].initial_state
        distinguishing_aspect: |
          MachineOrder has TWO state dimensions, so "initial state" is a pair: fulfillment_status DRAFT
          and commercial_status QUOTED must both be set at create, and the read-back endpoint must
          report the same pair.
        test_recipe:
          setup:
            - "one Customer, one MachineModel and one PASSED ProductTrial"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
            - call: "POST /packaging-oem/machine-orders"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_trial_id: "${trial_id}", equipment_price_cents: 70000000, change_parts_price_cents: 3000000, guarantee_basis: "NAMEPLATE" }
              as: ApplicationEngineer
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /packaging-oem/machine-orders/${order_id}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "HTTP status == 200"
            - "response.data.fulfillment_status == DRAFT"
            - "response.data.commercial_status == QUOTED"
            - "response.data.order_total_cents == 0 (the rollup only runs at engineer)"
            - "response.data.discount_tier == NONE"

      - name: product_trial_record_result_from_submitted_returns_invalid_trial_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ProductTrial.transitions[TESTING -> PASSED]
          - errors[ERR_INVALID_TRIAL_STATE]
          - validations[priority=8]
        distinguishing_aspect: |
          record-result has no edge out of SUBMITTED; recording a PASS on a trial that was never started
          must 409 with ERR_INVALID_TRIAL_STATE and must not write measured_rate_cpm.
        test_recipe:
          setup:
            - "one SUBMITTED ProductTrial that has never been started"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Northwind Beverages", region_code: "NA", product_variation_pct: 4.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Sparkling Cider", container_family: "PET_ROUND", container_diameter_mm: 82 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
          trigger:
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 570, outcome: "PASS" }
              as: ApplicationEngineer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_TRIAL_STATE"
            - "ProductTrial.${trial_id}.status == SUBMITTED"
            - "ProductTrial.${trial_id}.config_recommendation == PENDING"

      - name: product_trial_start_testing_from_rejected_terminal_is_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ProductTrial.terminal_states
          - errors[ERR_INVALID_TRIAL_STATE]
          - validations[priority=8]
        distinguishing_aspect: |
