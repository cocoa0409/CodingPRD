# =============================================================================
# Task 1416 — Seasonal Tree & Holiday Material Recycling (city tree program)
# Scaffold seed tables (§1.0–§1.7). Difficulty/corner design live in sibling files.
# =============================================================================

scenario: |
  Seasonal Tree & Holiday Material Recycling (city tree recycling program): collection
  window & drop-off site network, curbside collection scheduling & preparation rules
  (no stands/decorations), processing (chipping/mulch) & mulch giveback event,
  volunteer & partner coordination, contamination handling, tonnage diversion &
  reporting, promotion & resident notification, site cleanup & closure

domain_name: seasonal-tree-recycling
api_prefix: ""   # flat resource paths; e.g. /programs, /sites, /bookings

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: temporal_windowing        # collection window, claim/pickup windows, appeal deadlines, closure deadlines
  secondary_archetype: quota_allocation        # route tree capacity, site stockpile capacity, mulch pool tiers
  complexity_layers:
    - optimistic_concurrency                   # OCC on Program/DropOffSite/ServiceZone versions
    - cascading_side_effects                   # adjudication -> booking -> strikes -> barred -> auto-cancel -> notify
    - dual_variant_calculation                 # provisional-vs-actual route tonnage; theoretical-vs-measured mulch yield
    - rate_threshold_triggers                  # strikes>=2 bar, open tickets>=3 posture, no-shows>=3 suspend, yield variance>8%
  entity_topology: flat                        # peer entities with FK references; flat URLs (/bookings/{id})
  state_machine_shape: compound                # Program posture derived from children + cyclic/branching machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override            # ProgramAdmin superset; SoD carve-outs on contamination adjudication
  consistency_model: immediate
  difficulty_target: expert_plus

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program display name" }
      - { name: season_label, type: string, source: input, description: "e.g. 'Winter 2027'" }
      - { name: window_start, type: datetime, source: input, description: "Collection window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Collection window end (inclusive); must be >= window_start + 7 days" }
      - { name: target_diversion_rate, type: number, source: input, description: "Target diversion rate, 0..1", default: 0.9 }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | ACTIVE | CLOSED", constraints: "initial DRAFT" }
      - { name: posture, type: enum, source: computed, description: "NORMAL | RESTRICTED; RESTRICTED while open_ticket_count >= 3" }
      - { name: open_ticket_count, type: integer, source: computed, description: "Count of ContaminationTicket in OPEN status for this program" }
      - { name: mulch_produced_cy, type: number, source: computed, description: "Sum of measured_output_cy over COMPLETED ChippingRuns" }
      - { name: mulch_allocated_participant_cy, type: number, source: computed, description: "Sum of allocated_cy over PARTICIPANT claims in CONFIRMED or FULFILLED" }
      - { name: mulch_allocated_general_cy, type: number, source: computed, description: "Sum of allocated_cy over GENERAL claims in CONFIRMED or FULFILLED" }
      - { name: participant_remaining_cy, type: number, source: computed, description: "round2(0.60*mulch_produced_cy) - mulch_allocated_participant_cy" }
      - { name: general_remaining_cy, type: number, source: computed, description: "mulch_produced_cy - round2(0.60*mulch_produced_cy) - mulch_allocated_general_cy" }

  - name: DropOffSite
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: name, type: string, source: input, description: "Site name" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: capacity_cy, type: number, source: input, description: "Max stockpile cubic yards" }
      - { name: open_date, type: datetime, source: input, description: "Site opens to public (must be within program window)" }
      - { name: close_date, type: datetime, source: input, description: "Site stops accepting (must be within program window, >= open_date)" }
      - { name: volunteer_slots_per_role, type: integer, source: input, description: "Max SIGNED_UP/COMPLETED shifts per site per day per role", default: 3 }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | SUSPENDED | CLOSING | CLOSED", constraints: "initial PLANNED" }
      - { name: stockpile_cy, type: number, source: computed, description: "Sum of net_volume_cy over RECORDED IntakeEvents minus sum of input_cy over COMPLETED ChippingRuns" }

  - name: ServiceZone
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: zone_code, type: string, source: input, description: "Unique per program, e.g. 'NW-1'" }
      - { name: collection_date, type: datetime, source: input, description: "The single curbside collection day for this zone (within program window)" }
      - { name: daily_tree_capacity, type: integer, source: input, description: "Max trees the route can service on collection_date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", constraints: "initial ACTIVE" }
      - { name: reserved_trees, type: integer, source: computed, description: "Sum of tree_count over CONFIRMED bookings in this zone" }
      - { name: remaining_capacity, type: integer, source: computed, description: "daily_tree_capacity - reserved_trees" }
      - { name: projected_tons_provisional, type: number, source: computed, description: "Forward-looking: sum over CONFIRMED bookings of tree_count*EST_TONS[size_class]" }
      - { name: collected_tons_actual, type: number, source: computed, description: "Chronological: sum over SERVICED bookings of coalesce(actual_tons, tree_count*EST_TONS[size_class])" }

  - name: Household
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; household's curbside zone" }
      - { name: address, type: string, source: input, description: "Street address" }
      - { name: contact_email, type: string, source: input, description: "Resident contact" }
      - { name: strike_count, type: integer, source: computed, description: "Number of UPHELD/UPHELD_FINAL contamination tickets linked to this household's bookings, minus overturned" , default: 0 }
      - { name: curbside_eligible, type: boolean, source: computed, description: "false while strike_count >= 2", default: true }

  - name: CurbsideBooking
    parent: null
    common_fields: true
    fields:
      - { name: household_id, type: string, source: input, description: "FK -> Household.id" }
      - { name: zone_id, type: string, source: input, description: "FK -> ServiceZone.id; must equal household.zone_id" }
      - { name: tree_count, type: integer, source: input, description: "1..5 trees" }
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE | MIXED" }
      - { name: prep_attestation, type: boolean, source: input, description: "Resident attests trees have no stands, decorations, tinsel, flocking; must be true" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | SERVICED | MISSED | CANCELLED | REJECTED_CONTAMINATED", constraints: "initial CONFIRMED" }
      - { name: service_date, type: datetime, source: computed, description: "Snapshot of zone.collection_date at creation; cascaded when zone is rescheduled" }
      - { name: actual_tons, type: number, source: input, description: "Scale weight recorded at service; null until SERVICED with weight", default: null }
      - { name: estimated_tons, type: number, source: computed, description: "tree_count * EST_TONS[size_class]" }

  - name: IntakeEvent
    parent: null
    common_fields: false
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> DropOffSite.id" }
      - { name: source_type, type: enum, source: input, description: "RESIDENT_SELF_HAUL | COMMERCIAL_LANDSCAPER | CITY_CREW" }
      - { name: tree_count, type: integer, source: input, description: "Trees delivered" }
      - { name: size_class, type: enum, source: input, description: "SMALL | MEDIUM | LARGE | MIXED" }
      - { name: contaminated_cy, type: number, source: input, description: "Volume rejected at gate (decorated/flocked)", default: 0 }
      - { name: gross_volume_cy, type: number, source: computed, description: "tree_count * CLASS_CY[size_class]" }
      - { name: net_volume_cy, type: number, source: computed, description: "gross_volume_cy - contaminated_cy" }
      - { name: weighed_tons, type: number, source: input, description: "Scale weight if site has a scale; null otherwise", default: null }
      - { name: estimated_tons, type: number, source: computed, description: "tree_count * EST_TONS[size_class]" }
      - { name: report_tons, type: number, source: computed, description: "coalesce(weighed_tons, estimated_tons)" }
      - { name: recorded_at, type: datetime, source: system, description: "Server logical clock at creation" }
      - { name: status, type: enum, source: system, description: "RECORDED | VOIDED", constraints: "initial RECORDED" }
      - { name: void_reason, type: string, source: input, description: "Set when voided", default: null }

  - name: ContaminationTicket
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: booking_id, type: string, source: input, description: "FK -> CurbsideBooking.id; exactly one of booking_id/site_id required", default: null }
      - { name: site_id, type: string, source: input, description: "FK -> DropOffSite.id; exactly one of booking_id/site_id required", default: null }
      - { name: category, type: enum, source: input, description: "DECORATIONS | STAND_ATTACHED | FLOCKED_TREE | WREATH_WITH_WIRE | OTHER" }
      - { name: notes, type: string, source: input, description: "Free text", default: null }
      - { name: reporter_user_id, type: string, source: system, description: "X-User-ID of creator" }
      - { name: reporter_role, type: string, source: system, description: "X-User-Role of creator" }
      - { name: status, type: enum, source: system, description: "OPEN | UPHELD | DISMISSED | APPEALED | UPHELD_FINAL | OVERTURNED", constraints: "initial OPEN" }
      - { name: adjudicated_by, type: string, source: system, description: "X-User-ID of adjudicator", default: null }
      - { name: adjudicated_at, type: datetime, source: system, description: "Logical clock at adjudication", default: null }
      - { name: appeal_deadline, type: datetime, source: computed, description: "adjudicated_at + 72h; appeal allowed while now <= appeal_deadline", default: null }
      - { name: resolved_by, type: string, source: system, description: "X-User-ID of appeal resolver", default: null }

  - name: ChippingRun
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: site_id, type: string, source: input, description: "FK -> DropOffSite.id; site whose stockpile is chipped" }
      - { name: scheduled_start, type: datetime, source: input, description: "Run start; within [window_start, window_end + 14 days]" }
      - { name: scheduled_end, type: datetime, source: input, description: "Run end; > scheduled_start" }
      - { name: material_class, type: enum, source: input, description: "MIXED_CONIFER | HARDWOOD | MIXED_LOAD" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED", constraints: "initial SCHEDULED" }
      - { name: input_cy, type: number, source: input, description: "Stockpile volume drawn; set at completion; <= site.stockpile_cy", default: null }
      - { name: measured_input_tons, type: number, source: input, description: "Scale weight of chipped material; set at completion", default: null }
      - { name: contaminated_input_tons, type: number, source: input, description: "Portion diverted to disposal; <= measured_input_tons", default: 0 }
      - { name: theoretical_output_cy, type: number, source: computed, description: "round2(measured_input_tons * YIELD_CY_PER_TON[material_class] * (1 - contaminated_input_tons/measured_input_tons))" }
      - { name: measured_output_cy, type: number, source: input, description: "Scale/measured mulch output; set at completion", default: null }
      - { name: variance_pct, type: number, source: computed, description: "round4(abs(measured_output_cy - theoretical_output_cy) / theoretical_output_cy)" }
      - { name: yield_review_confirmed, type: boolean, source: input, description: "Supervisor override when unrounded variance ratio > 0.08", default: false }

  - name: MulchEvent
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: claim_open_at, type: datetime, source: input, description: "Claims accepted from this instant" }
      - { name: claim_close_at, type: datetime, source: input, description: "Claims accepted until this instant (inclusive); > claim_open_at" }
      - { name: pickup_start, type: datetime, source: input, description: "Fulfillment window start; >= claim_close_at" }
      - { name: pickup_end, type: datetime, source: input, description: "Fulfillment window end (inclusive); > pickup_start" }
      - { name: per_household_cap_cy, type: number, source: input, description: "Max allocated_cy per household per event", default: 2.0 }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED", constraints: "initial SCHEDULED" }

  - name: MulchClaim
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> MulchEvent.id" }
      - { name: household_id, type: string, source: input, description: "FK -> Household.id" }
      - { name: requested_cy, type: number, source: input, description: ">= 0.5 and <= event.per_household_cap_cy" }
      - { name: tier, type: enum, source: computed, description: "PARTICIPANT if household has >=1 SERVICED booking in program, else GENERAL" }
      - { name: allocated_cy, type: number, source: computed, description: "min(requested_cy, cap, tier remaining) at allocation time; 0 while WAITLISTED" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | WAITLISTED | FULFILLED | CANCELLED | EXPIRED", constraints: "initial CONFIRMED or WAITLISTED per allocation" }

  - name: Volunteer
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: full_name, type: string, source: input, description: "Volunteer name" }
      - { name: email, type: string, source: input, description: "Contact email" }
      - { name: status, type: enum, source: system, description: "APPLIED | APPROVED | SUSPENDED", constraints: "initial APPLIED" }
      - { name: no_show_count, type: integer, source: computed, description: "Shifts marked NO_SHOW; at 3 the volunteer auto-suspends", default: 0 }

  - name: VolunteerShift
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id" }
      - { name: site_id, type: string, source: input, description: "FK -> DropOffSite.id" }
      - { name: start_at, type: datetime, source: input, description: "Shift start (must be within program window)" }
      - { name: end_at, type: datetime, source: input, description: "Shift end; > start_at" }
      - { name: shift_role, type: enum, source: input, description: "GREETER | TRAFFIC_CONTROL | LOADER" }
      - { name: status, type: enum, source: system, description: "SIGNED_UP | COMPLETED | NO_SHOW | CANCELLED", constraints: "initial SIGNED_UP" }

  - name: NotificationLog
    parent: null
    common_fields: false
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> Program.id" }
      - { name: kind, type: enum, source: system, description: "PROGRAM_PUBLISHED | ZONE_RESCHEDULED | BOOKING_AUTO_CANCELLED | CLAIM_PROMOTED | SITE_CLOSING | MULCH_EVENT_OPENED" }
      - { name: household_id, type: string, source: system, description: "Informational recipient reference (not an enforced FK)", default: null }
      - { name: zone_id, type: string, source: system, description: "Informational zone reference (not an enforced FK)", default: null }
      - { name: message, type: string, source: system, description: "Rendered notice text" }

  - name: DiversionReport
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: period_start, type: datetime, source: system, description: "Copied from program.window_start at generation" }
      - { name: period_end, type: datetime, source: system, description: "Copied from program.window_end at generation" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | SUPERSEDED", constraints: "initial DRAFT; creating a new report supersedes any PUBLISHED one" }
      - { name: collected_tons, type: number, source: computed, description: "Sum of per-source round3 tons (SERVICED bookings + RECORDED intakes)" }
      - { name: diverted_tons, type: number, source: computed, description: "Sum of round3(measured_input_tons - contaminated_input_tons) over COMPLETED runs" }
      - { name: disposed_tons, type: number, source: computed, description: "collected_tons - diverted_tons" }
      - { name: diversion_rate, type: number, source: computed, description: "round4(diverted/collected), half-up; 0.0000 when collected == 0" }
      - { name: grade, type: enum, source: computed, description: "NO_DATA | A | B | C; A if rate>=0.9000, B if >=0.7500, else C; NO_DATA when collected==0" }
      - { name: below_target, type: boolean, source: computed, description: "diversion_rate < program.target_diversion_rate" }
      - { name: published_at, type: datetime, source: system, description: "Logical clock at publication", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Program
    field: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "PATCH /programs/{id} with status=PUBLISHED"
        actor: ProgramAdmin
        preconditions:
          - ">=1 ServiceZone and >=1 DropOffSite exist for the program (else ERR_VALIDATION)"
          - "window_end >= window_start + 7 days (else ERR_VALIDATION)"
        side_effects:
          - "Creates NotificationLog kind=PROGRAM_PUBLISHED for the program"
      - from: PUBLISHED
        to: ACTIVE
        trigger: "PATCH /programs/{id} with status=ACTIVE"
        actor: ProgramAdmin
        preconditions:
          - "logical clock now >= window_start (else ERR_OUTSIDE_COLLECTION_WINDOW)"
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "PATCH /programs/{id} with status=CLOSED"
        actor: ProgramAdmin
        preconditions:
          - "All DropOffSites in CLOSED (else ERR_PROGRAM_HAS_OPEN_ITEMS)"
          - ">=1 DiversionReport in PUBLISHED (else ERR_PROGRAM_HAS_OPEN_ITEMS)"
          - "No CurbsideBooking in CONFIRMED or MISSED (else ERR_PROGRAM_HAS_OPEN_ITEMS)"
          - "No ContaminationTicket in OPEN or APPEALED (else ERR_PROGRAM_HAS_OPEN_ITEMS)"
          - "All MulchEvents CLOSED (else ERR_PROGRAM_HAS_OPEN_ITEMS)"
        side_effects: []

  - entity: Program
    field: posture
    initial_state: NORMAL
    terminal_states: []
    note: "Derived parallel dimension; recomputed on ticket open/close. RESTRICTED gates new bookings and new intake events."
    transitions:
      - from: NORMAL
        to: RESTRICTED
        trigger: "system (open_ticket_count rises to >= 3 on ticket creation)"
        actor: system
        preconditions: ["open_ticket_count >= 3"]
        side_effects:
          - "POST /bookings and POST /intake-events rejected with ERR_PROGRAM_RESTRICTED while RESTRICTED"
      - from: RESTRICTED
        to: NORMAL
        trigger: "system (open_ticket_count falls below 3 on adjudication/appeal-resolution)"
        actor: system
        preconditions: ["open_ticket_count < 3"]
        side_effects: []

  - entity: DropOffSite
    field: status
    initial_state: PLANNED
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "PATCH /sites/{id} with status=OPEN"
        actor: ProgramAdmin
        preconditions:
          - "Program status == ACTIVE (else ERR_INVALID_STATE)"
          - "open_date <= now <= close_date (else ERR_OUTSIDE_COLLECTION_WINDOW)"
        side_effects: []
      - from: OPEN
        to: SUSPENDED
        trigger: "PATCH /sites/{id} with status=SUSPENDED"
        actor: "ProgramAdmin, SiteSupervisor"
        preconditions: []
        side_effects:
          - "Intake events rejected while SUSPENDED (ERR_SITE_NOT_OPEN); existing bookings/shifts unaffected"
      - from: SUSPENDED
        to: OPEN
        trigger: "PATCH /sites/{id} with status=OPEN"
        actor: "ProgramAdmin, SiteSupervisor"
        preconditions: ["now <= close_date (else ERR_OUTSIDE_COLLECTION_WINDOW)"]
        side_effects: []
      - from: [OPEN, SUSPENDED]
        to: CLOSING
        trigger: "PATCH /sites/{id} with status=CLOSING, or system ops-run when now > close_date"
        actor: "ProgramAdmin, SiteSupervisor, system"
        preconditions: []
        side_effects:
          - "Creates NotificationLog kind=SITE_CLOSING"
          - "SIGNED_UP VolunteerShifts at this site with start_at > now -> CANCELLED"
      - from: CLOSING
        to: CLOSED
        trigger: "PATCH /sites/{id} with status=CLOSED"
        actor: "ProgramAdmin, SiteSupervisor"
        preconditions:
          - "stockpile_cy == 0 (else ERR_SITE_NOT_CLOSABLE)"
          - "No ContaminationTicket with site_id == this site in OPEN or APPEALED (else ERR_SITE_NOT_CLOSABLE)"
        side_effects: []

  - entity: ServiceZone
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /zones/{id} with status=SUSPENDED"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "New bookings rejected while SUSPENDED (ERR_ZONE_SUSPENDED); existing CONFIRMED bookings unaffected"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /zones/{id} with status=ACTIVE"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  - entity: CurbsideBooking
    field: status
    initial_state: CONFIRMED
    terminal_states: [SERVICED, CANCELLED, REJECTED_CONTAMINATED]
    transitions:
      - from: CONFIRMED
        to: SERVICED
        trigger: "POST /bookings/{id}/record-outcome with outcome=SERVICED"
        actor: "SiteSupervisor, ProgramAdmin"
        preconditions: []
        side_effects:
          - "actual_tons stored if provided; zone.collected_tons_actual recomputed"
      - from: CONFIRMED
        to: MISSED
        trigger: "POST /bookings/{id}/record-outcome with outcome=MISSED, or system ops-run when service_date < current date"
        actor: "SiteSupervisor, ProgramAdmin, system"
        preconditions: []
        side_effects:
          - "Route capacity released: zone.reserved_trees -= tree_count"
      - from: MISSED
        to: CONFIRMED
        trigger: "POST /bookings/{id}/reschedule with new_service_date"
        actor: "Resident (own), ProgramAdmin"
        preconditions:
          - "new_service_date == zone.collection_date (else ERR_BOOKING_DATE_MISMATCH)"
          - "zone.collection_date > now (else ERR_OUTSIDE_COLLECTION_WINDOW)"
          - "Household curbside_eligible == true (else ERR_HOUSEHOLD_BARRED)"
        side_effects:
          - "Capacity re-check then re-reserve: zone.reserved_trees += tree_count (ERR_ROUTE_CAPACITY_EXCEEDED if over)"
          - "service_date updated to new_service_date"
      - from: [CONFIRMED, MISSED]
        to: CANCELLED
        trigger: "POST /bookings/{id}/cancel, or system (household barred cascade)"
        actor: "Resident (own), ProgramAdmin, system"
        preconditions: []
        side_effects:
          - "If was CONFIRMED: zone.reserved_trees -= tree_count"
      - from: CONFIRMED
        to: REJECTED_CONTAMINATED
        trigger: "system (linked ContaminationTicket adjudicated UPHELD)"
        actor: system
        preconditions: []
        side_effects:
          - "zone.reserved_trees -= tree_count (capacity released)"
      - from: REJECTED_CONTAMINATED
        to: CONFIRMED
        trigger: "system (linked ticket appeal resolved OVERTURNED)"
        actor: system
        preconditions: []
        side_effects:
          - "zone.reserved_trees += tree_count (capacity re-reserved unconditionally; documented exception to the capacity check)"
          - "service_date set to current zone.collection_date"

  - entity: ContaminationTicket
    field: status
    initial_state: OPEN
    terminal_states: [DISMISSED, UPHELD_FINAL, OVERTURNED]
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: "POST /contamination-tickets/{id}/adjudicate with verdict=UPHELD"
        actor: "ProgramAdmin, SiteSupervisor"
        preconditions:
          - "adjudicator X-User-ID != reporter_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "program.open_ticket_count -= 1 (posture recompute)"
          - "Cascade hop 1: linked booking (if any) in CONFIRMED -> REJECTED_CONTAMINATED (releases capacity); booking in SERVICED stays SERVICED"
          - "Cascade hop 2: booking's household.strike_count += 1"
          - "Cascade hop 3: if strike_count reaches 2 -> household.curbside_eligible = false"
          - "Cascade hop 4: on becoming barred, household's other CONFIRMED bookings -> CANCELLED and NotificationLog kind=BOOKING_AUTO_CANCELLED per cancelled booking"
          - "appeal_deadline = adjudicated_at + 72h"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /contamination-tickets/{id}/adjudicate with verdict=DISMISSED"
        actor: "ProgramAdmin, SiteSupervisor"
        preconditions:
          - "adjudicator X-User-ID != reporter_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "program.open_ticket_count -= 1 (posture recompute); no strike, no booking change (divergent branch vs UPHELD)"
      - from: UPHELD
        to: APPEALED
        trigger: "POST /contamination-tickets/{id}/appeal"
        actor: "Resident (ticket's household)"
        preconditions:
          - "Ticket is booking-linked (site tickets cannot be appealed: ERR_INVALID_STATE)"
          - "now <= appeal_deadline (else ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects: []
      - from: APPEALED
        to: UPHELD_FINAL
        trigger: "POST /contamination-tickets/{id}/resolve-appeal with resolution=UPHELD_FINAL"
        actor: ProgramAdmin
        preconditions:
          - "resolver X-User-ID != adjudicated_by (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: APPEALED
        to: OVERTURNED
        trigger: "POST /contamination-tickets/{id}/resolve-appeal with resolution=OVERTURNED"
        actor: ProgramAdmin
        preconditions:
          - "resolver X-User-ID != adjudicated_by (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Compensation: household.strike_count -= 1; curbside_eligible recomputed (auto-cancelled bookings are NOT resurrected)"
          - "If linked booking is REJECTED_CONTAMINATED -> back to CONFIRMED (capacity re-reserved, see booking machine)"

  - entity: ChippingRun
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /chipping-runs/{id}/complete"
        actor: "ProgramAdmin, HaulerPartner"
        preconditions:
          - "now >= scheduled_start (else ERR_RUN_WINDOW_INVALID)"
          - "input_cy <= site.stockpile_cy (else ERR_RUN_INPUT_EXCEEDS_STOCKPILE)"
          - "contaminated_input_tons <= measured_input_tons (else ERR_VALIDATION)"
          - "unrounded |measured-theoretical|/theoretical <= 0.08 OR yield_review_confirmed == true (else ERR_YIELD_VARIANCE_REVIEW_REQUIRED)"
        side_effects:
          - "site.stockpile_cy -= input_cy"
          - "theoretical_output_cy and variance_pct computed and stored"
          - "Cascade hop 1: program.mulch_produced_cy += measured_output_cy (tier remainings recomputed)"
          - "Cascade hop 2: WAITLISTED MulchClaims promoted per mulch_waitlist_promotion selector"
          - "Cascade hop 3: NotificationLog kind=CLAIM_PROMOTED per promoted claim"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /chipping-runs/{id}/cancel"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  - entity: MulchEvent
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "PATCH /mulch-events/{id} with status=OPEN"
        actor: ProgramAdmin
        preconditions:
          - "Program status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "Creates NotificationLog kind=MULCH_EVENT_OPENED"
      - from: OPEN
        to: CLOSED
        trigger: "PATCH /mulch-events/{id} with status=CLOSED, or system ops-run when now > pickup_end"
        actor: "ProgramAdmin, system"
        preconditions: []
        side_effects:
          - "Claims in CONFIRMED or WAITLISTED -> EXPIRED; their allocated_cy released from tier allocations (program pool recompute; may trigger waitlist promotions on other OPEN events)"

  - entity: MulchClaim
    field: status
    initial_state: CONFIRMED
    terminal_states: [FULFILLED, CANCELLED, EXPIRED]
    note: "Initial state is CONFIRMED when allocation > 0 at creation, else WAITLISTED."
    transitions:
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (waitlist promotion on pool increase: run completion, claim cancel/expire)"
        actor: system
        preconditions: ["tier remaining >= MIN_CLAIM_CY after allocation per mulch_waitlist_promotion"]
        side_effects:
          - "allocated_cy set; tier allocation increases; NotificationLog kind=CLAIM_PROMOTED"
      - from: CONFIRMED
        to: FULFILLED
        trigger: "PATCH /mulch-claims/{id} with status=FULFILLED"
        actor: "SiteSupervisor, ProgramAdmin"
        preconditions:
          - "pickup_start <= now <= pickup_end (else ERR_PICKUP_WINDOW_CLOSED)"
        side_effects: []
      - from: [CONFIRMED, WAITLISTED]
        to: CANCELLED
        trigger: "PATCH /mulch-claims/{id} with status=CANCELLED"
        actor: "Resident (own), ProgramAdmin"
        preconditions: []
        side_effects:
          - "If was CONFIRMED: allocated_cy released from tier allocation; waitlist promotion sweep runs"
      - from: [CONFIRMED, WAITLISTED]
        to: EXPIRED
        trigger: "system (event closed or ops-run past pickup_end)"
        actor: system
        preconditions: []
        side_effects:
          - "If was CONFIRMED: allocated_cy released; waitlist promotion sweep runs"

  - entity: Volunteer
    field: status
    initial_state: APPLIED
    terminal_states: []
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "PATCH /volunteers/{id} with status=APPROVED"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "PATCH /volunteers/{id} with status=SUSPENDED, or system (no_show_count reaches 3)"
        actor: "ProgramAdmin, system"
        preconditions: []
        side_effects:
          - "On auto-suspend: volunteer's future SIGNED_UP shifts -> CANCELLED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "PATCH /volunteers/{id} with status=APPROVED"
        actor: ProgramAdmin
        preconditions: []
        side_effects: []

  - entity: VolunteerShift
    field: status
    initial_state: SIGNED_UP
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SIGNED_UP
        to: CANCELLED
        trigger: "PATCH /volunteer-shifts/{id} with status=CANCELLED"
        actor: "Volunteer (own), ProgramAdmin"
        preconditions:
          - "now <= start_at - 24h (else ERR_SHIFT_CUTOFF_PASSED); ProgramAdmin exempt from the cutoff"
        side_effects:
          - "Site-date-role occupancy decremented"
      - from: SIGNED_UP
        to: COMPLETED
        trigger: "PATCH /volunteer-shifts/{id} with status=COMPLETED"
        actor: "SiteSupervisor, ProgramAdmin"
        preconditions: ["now >= end_at (else ERR_SHIFT_CUTOFF_PASSED)"]
        side_effects: []
      - from: SIGNED_UP
        to: NO_SHOW
        trigger: "PATCH /volunteer-shifts/{id} with status=NO_SHOW, or system ops-run when end_at < now"
        actor: "SiteSupervisor, ProgramAdmin, system"
        preconditions: ["now >= end_at (else ERR_SHIFT_CUTOFF_PASSED)"]
        side_effects:
          - "volunteer.no_show_count += 1; at 3 -> volunteer auto-SUSPENDED (cascade cancels future SIGNED_UP shifts)"

  - entity: DiversionReport
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "PATCH /diversion-reports/{id} with status=PUBLISHED"
        actor: ProgramAdmin
        preconditions:
          - "now > program.window_end (else ERR_REPORT_NOT_PUBLISHABLE)"
          - "No ChippingRun in SCHEDULED for the program (else ERR_REPORT_NOT_PUBLISHABLE)"
        side_effects: []
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (a new DiversionReport is created for the program)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: IntakeEvent
    field: status
    initial_state: RECORDED
    terminal_states: [VOIDED]
    transitions:
      - from: RECORDED
        to: VOIDED
        trigger: "POST /intake-events/{id}/void"
        actor: "SiteSupervisor, ProgramAdmin"
        preconditions: []
        side_effects:
          - "site.stockpile_cy -= net_volume_cy (compensates the recording)"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: zone-reschedule-stale-version
    parent_entity: ServiceZone
    write_endpoint: "PATCH /zones/{id}"
    occ_field: expected_zone_version
    description: |
      A zone PATCH (collection_date reschedule, capacity change, or status change)
      carrying an expected_zone_version that no longer matches the zone's current
      version is rejected: the client's view of the zone is stale, e.g. another
      writer has already rescheduled (which legitimately moves the date and
      cascades to bookings) since the client last read it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: site-update-stale-version
    parent_entity: DropOffSite
    write_endpoint: "PATCH /sites/{id}"
    occ_field: expected_site_version
    description: |
      A site PATCH (capacity/hours edits, suspend/reopen/closure transitions)
      carrying an expected_site_version that no longer matches the site's current
      version is rejected: another writer has mutated the site (including
      cascaded stockpile or status changes) since the client last read it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: report-create-stale-program
    parent_entity: Program
    write_endpoint: "POST /diversion-reports"
    occ_field: expected_program_version
    description: |
      Creating a DiversionReport supersedes the program's currently PUBLISHED
      report. When the client's expected_program_version no longer matches the
      program's current version, the client's basis for supersession is stale
      (e.g. another writer has just created a report, which legitimately
      superseded the prior one) and the create is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: program-update-stale-version
    parent_entity: Program
    write_endpoint: "PATCH /programs/{id}"
    occ_field: expected_program_version
    description: |
      A program PATCH (field edits or status transitions) whose
      expected_program_version is behind the program's current version is
      rejected: cascades (ticket opens, posture flips, pool changes) may have
      advanced the version since the client last read it.
    error_id: ERR_STALE_VERSION
    http_status: 412
# =============================================================================
# §1.3 Calculation Rules Table (9 rules)
# =============================================================================
calculations:
  - name: route_tonnage_projection
    trigger: "booking create, reschedule, record-outcome, cancel, contamination-driven status changes"
    algorithm: forward_looking
    formula: |
      EST_TONS = {SMALL: 0.020, MEDIUM: 0.035, LARGE: 0.050, MIXED: 0.030}
      projected_tons_provisional = sum over bookings of (tree_count * EST_TONS[size_class])
        where booking.status == CONFIRMED
      collected_tons_actual = sum over bookings of coalesce(actual_tons, tree_count * EST_TONS[size_class])
        where booking.status == SERVICED
      Both round to 3 decimal places, round_half_up.
    input_set: "Bookings of one ServiceZone; CONFIRMED only for provisional, SERVICED only for actual"
    constants:
      EST_TONS_SMALL: 0.020
      EST_TONS_MEDIUM: 0.035
      EST_TONS_LARGE: 0.050
      EST_TONS_MIXED: 0.030
    precision: "3 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "route planning before the collection day"
        difference: "counts CONFIRMED bookings at estimated weight; ignores actual_tons"
      - name: ACTUAL
        when: "post-service reconciliation and reporting"
        difference: "counts SERVICED bookings only, preferring scale actual_tons over the estimate"
  - name: chipping_yield
    trigger: "POST /chipping-runs/{id}/complete"
    algorithm: threshold
    formula: |
      YIELD_CY_PER_TON = {MIXED_CONIFER: 2.2, HARDWOOD: 1.8, MIXED_LOAD: 2.0}
      contamination_fraction = contaminated_input_tons / measured_input_tons   (measured_input_tons must be > 0)
      theoretical_output_cy = round2(measured_input_tons * YIELD_CY_PER_TON[material_class] * (1 - contamination_fraction))
      raw_variance = abs(measured_output_cy - theoretical_output_cy) / theoretical_output_cy   (unrounded for the gate)
      variance_pct = round4(raw_variance)
      Gate: raw_variance > 0.08 requires yield_review_confirmed == true, else ERR_YIELD_VARIANCE_REVIEW_REQUIRED.
      Exactly 0.08 is allowed without the flag.
    input_set: "The single ChippingRun being completed"
    constants:
      YIELD_CY_PER_TON_MIXED_CONIFER: 2.2
      YIELD_CY_PER_TON_HARDWOOD: 1.8
      YIELD_CY_PER_TON_MIXED_LOAD: 2.0
      YIELD_VARIANCE_THRESHOLD: 0.08
    precision: "output 2 dp, variance 4 dp, round_half_up; gate uses unrounded ratio"
    variants:
      - name: THEORETICAL
        when: "expected yield from scale input and material class"
        difference: "computed from formula; deterministic"
      - name: MEASURED
        when: "actual pile measurement supplied at completion"
        difference: "operator-supplied; divergence >8% forces review flag"
  - name: mulch_claim_allocation
    trigger: "POST /mulch-claims (and re-evaluated during waitlist promotion)"
    algorithm: waterfall_allocation
    formula: |
      PARTICIPANT_RESERVE_PCT = 0.60
      participant_pool = round2(0.60 * program.mulch_produced_cy)
      general_pool = program.mulch_produced_cy - participant_pool
      participant_remaining = participant_pool - program.mulch_allocated_participant_cy
      general_remaining    = general_pool    - program.mulch_allocated_general_cy
      tier_remaining = participant_remaining if claim.tier == PARTICIPANT else general_remaining
      allocated_cy = min(requested_cy, event.per_household_cap_cy, tier_remaining)
      if allocated_cy >= MIN_CLAIM_CY (0.5): status = CONFIRMED (partial allocation below requested is allowed)
      else: allocated_cy = 0, status = WAITLISTED
      Evaluation order is fixed: tier derivation -> remaining lookup -> min(...) -> threshold test.
    input_set: "The new claim, its MulchEvent, the parent Program pool fields"
    constants:
      PARTICIPANT_RESERVE_PCT: 0.60
      MIN_CLAIM_CY: 0.5
      DEFAULT_PER_HOUSEHOLD_CAP_CY: 2.0
    precision: "2 decimal places, round_half_up; pool split rounds participant_pool to 2dp BEFORE general_pool = produced - participant_pool"
  - name: mulch_waitlist_promotion
    trigger: "chipping run completion, claim cancellation, claim expiry, event closure of another event"
    algorithm: chronological
    formula: |
      Candidates: all MulchClaims in WAITLISTED on OPEN MulchEvents of the program.
      Order: claim.created_at ASC (ties cannot occur; created_at has ms precision and is the pinned key).
      For each candidate in order: run mulch_claim_allocation against CURRENT tier remaining;
      if allocated_cy >= MIN_CLAIM_CY, promote to CONFIRMED (partial allocation allowed);
      else leave WAITLISTED and CONTINUE to the next candidate (no head-of-line blocking).
      Creating a NotificationLog kind=CLAIM_PROMOTED per promoted claim.
    input_set: "WAITLISTED claims of the program across OPEN events"
    precision: "2 decimal places, round_half_up"
  - name: route_capacity_consumption
    trigger: "booking create, reschedule (MISSED->CONFIRMED), overturn-revert, cancel, reject"
    algorithm: aggregation
    formula: |
      reserved_trees = sum of tree_count over bookings of the zone with status == CONFIRMED
      remaining_capacity = daily_tree_capacity - reserved_trees
      Admission check on create/reschedule: reserved_trees + new_tree_count <= daily_tree_capacity
      (equality admitted; one tree over is rejected with ERR_ROUTE_CAPACITY_EXCEEDED).
      Overturn-revert (REJECTED_CONTAMINATED -> CONFIRMED) re-adds tree_count WITHOUT the capacity check.
    input_set: "CONFIRMED bookings of one ServiceZone"
    precision: "integer trees"
  - name: site_stockpile_balance
    trigger: "intake create, intake void, chipping run completion"
    algorithm: aggregation
    formula: |
      stockpile_cy = sum(net_volume_cy over IntakeEvents of the site with status == RECORDED)
                   - sum(input_cy over ChippingRuns of the site with status == COMPLETED)
      Invariant A (compensating): recording an intake then voiding it leaves stockpile_cy unchanged.
      Admission check on intake: stockpile_cy + net_volume_cy <= capacity_cy (equality admitted),
      else ERR_SITE_CAPACITY_EXCEEDED.
    input_set: "RECORDED IntakeEvents and COMPLETED ChippingRuns of one DropOffSite"
    precision: "2 decimal places, round_half_up"
  - name: diversion_rate_rollup
    trigger: "POST /diversion-reports (snapshot at generation)"
    algorithm: aggregation
    formula: |
      Per-source rounding FIRST (pinned order): each source contributes round3(tons):
        booking contribution = round3(coalesce(actual_tons, tree_count * EST_TONS[size_class])) for SERVICED bookings
        intake  contribution = round3(report_tons) for RECORDED (non-voided) intakes
      collected_tons = sum of the rounded booking and intake contributions
      diverted_tons  = sum over COMPLETED runs of round3(measured_input_tons - contaminated_input_tons)
      disposed_tons  = collected_tons - diverted_tons
      diversion_rate = round4(diverted_tons / collected_tons) half-up; if collected_tons == 0 then 0.0000
      grade: NO_DATA if collected_tons == 0; else A if diversion_rate >= 0.9000;
             else B if diversion_rate >= 0.7500; else C (thresholds inclusive)
      below_target = diversion_rate < program.target_diversion_rate
      NOTE: round-per-source-then-sum is pinned; sum-then-round is the rejected alternative order
      and yields different values (e.g. 0.0204+0.0204 -> 0.040 here vs 0.041 under sum-then-round).
    input_set: "SERVICED bookings, RECORDED intakes, COMPLETED runs of the program"
    constants:
      GRADE_A_THRESHOLD: 0.9000
      GRADE_B_THRESHOLD: 0.7500
    precision: "per-source 3 dp; rate 4 dp; round_half_up everywhere"
  - name: household_strike_and_posture
    trigger: "ticket adjudicated UPHELD, appeal resolved OVERTURNED, ticket created/closed"
    algorithm: threshold
    formula: |
      strike_count = count of tickets linked to the household's bookings with status in {UPHELD, UPHELD_FINAL}
      curbside_eligible = (strike_count < STRIKE_THRESHOLD)   # threshold 2 inclusive-blocking: at exactly 2, barred
      program.open_ticket_count = count of tickets of the program with status == OPEN
      program.posture = RESTRICTED if open_ticket_count >= POSTURE_TICKET_THRESHOLD (3) else NORMAL
    input_set: "ContaminationTickets of the household / of the program"
    constants:
      STRIKE_THRESHOLD: 2
      POSTURE_TICKET_THRESHOLD: 3
    precision: "integer counts; boundaries inclusive-blocking (>=)"
  - name: volunteer_reliability_gate
    trigger: "shift marked NO_SHOW (manual or ops-run)"
    algorithm: threshold
    formula: |
      no_show_count = count of the volunteer's shifts with status == NO_SHOW
      on reaching NO_SHOW_LIMIT (3): volunteer.status -> SUSPENDED and future SIGNED_UP shifts -> CANCELLED
      Shift occupancy per site/day/role: count of SIGNED_UP or COMPLETED shifts at the site
      on the same calendar date with the same shift_role must stay <= site.volunteer_slots_per_role
      (equality admitted; one more is ERR_SHIFT_CAPACITY_FULL).
    input_set: "VolunteerShifts of one volunteer / of one site-day-role"
    constants:
      NO_SHOW_LIMIT: 3
    precision: "integer counts; boundary inclusive"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except none (registration endpoints also require the Anonymous role header)"
  - priority: 2
    category: auth
    check: "Role is in the endpoint's roles list; per-transition role splits honored (e.g. only SiteSupervisor/ProgramAdmin may PATCH a claim to FULFILLED; only Resident/ProgramAdmin may cancel a claim)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Resident's X-User-ID must equal the household_id of the booking/claim/ticket acted on; Volunteer's X-User-ID must equal the shift's volunteer_id. ProgramAdmin bypasses ownership."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "booking cancel/reschedule, claim create/cancel, ticket appeal, shift create/cancel"
  - priority: 4
    category: existence
    check: "Path ids and body FK references exist (program, site, zone, household, booking, event, volunteer, ticket, run, claim, report)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is declared (incl. terminal-state lockdown)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /programs/{id}, PATCH /sites/{id}, PATCH /zones/{id}, POST /diversion-reports"
  - priority: 7
    category: business_safety
    check: "Compliance: prep_attestation must be true on booking create; adjudicator != reporter and appeal-resolver != adjudicator (segregation of duties, applies to ProgramAdmin too)"
    error_id: ERR_PREP_ATTESTATION_REQUIRED
    http_status: 422
    applies_to: "POST /bookings (attestation); adjudicate/resolve-appeal use ERR_SEGREGATION_OF_DUTIES (403)"
  - priority: 8
    category: business_referential
    check: "Cross-references coherent: booking.zone_id == household.zone_id; ticket has exactly one of booking_id/site_id and it belongs to the given program; claim.household and claim.event share program; volunteer/shift site in same program"
    error_id: ERR_ZONE_MISMATCH
    http_status: 422
    applies_to: "POST /bookings (ERR_ZONE_MISMATCH), POST /contamination-tickets (ERR_TICKET_SOURCE_INVALID), POST /mulch-claims /volunteer-shifts (ERR_VALIDATION)"
  - priority: 9
    category: business_temporal
    check: "Time windows: intake recorded_at within [window_start, window_end] inclusive; run scheduled within [window_start, window_end+14d]; zone reschedule requires now <= collection_date - 48h; appeal requires now <= appeal_deadline; volunteer cancel requires now <= start_at - 24h; claim create within [claim_open_at, claim_close_at]; fulfill within [pickup_start, pickup_end]"
    error_id: ERR_OUTSIDE_COLLECTION_WINDOW
    http_status: 422
    applies_to: "temporal-gated endpoints (per-rule errors: ERR_RUN_WINDOW_INVALID, ERR_NOTIFICATION_LEAD_TIME, ERR_APPEAL_WINDOW_EXPIRED, ERR_SHIFT_CUTOFF_PASSED, ERR_PICKUP_WINDOW_CLOSED)"
  - priority: 10
    category: business_constraint
    check: "Entity constraints: program posture NORMAL for new bookings/intake; program ACTIVE where required; zone ACTIVE; site OPEN for intake; volunteer APPROVED for shift signup; household curbside_eligible; no duplicate OPEN ticket per booking or per site; no duplicate active claim per household per event; shift overlap and run overlap/buffer; site closure guards; program close guards; yield variance review"
    error_id: ERR_PROGRAM_RESTRICTED
    http_status: 409
    applies_to: "constraint-gated endpoints (per-rule errors listed in §1.6)"
  - priority: 11
    category: business_fiscal
    check: "Capacity/quota last: route tree capacity; site stockpile capacity; capacity patch not below stockpile; run input not above stockpile; claim requested_cy within [0.5, cap]; shift role-slot capacity"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "capacity-gated endpoints (per-rule errors listed in §1.6)"
# =============================================================================
# §1.5 API Endpoint Table (60 endpoints)
# =============================================================================
endpoints:
  # --- Program ---
  - method: POST
    path: "/programs"
    description: "Create a recycling program (status DRAFT, posture NORMAL, counters zero)"
    roles: [ProgramAdmin]
    code: 201
    input: [name, season_label, window_start, window_end, "target_diversion_rate?"]
    output: Program
    side_effects: ["status=DRAFT; window_end >= window_start + 7 days else ERR_VALIDATION"]
  - method: GET
    path: "/programs"
    description: "List programs"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner, Resident, Volunteer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Program[]
    side_effects: []
  - method: GET
    path: "/programs/{id}"
    description: "Get a program including computed pool/posture fields"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner, Resident, Volunteer]
    code: 200
    input: []
    output: Program
    side_effects: []
  - method: PATCH
    path: "/programs/{id}"
    description: "Edit DRAFT fields (name/window/target) and drive status transitions PUBLISHED/ACTIVE/CLOSED. OCC-guarded."
    roles: [ProgramAdmin]
    code: 200
    input: ["name?", "window_start?", "window_end?", "target_diversion_rate?", "status?", "expected_program_version"]
    output: Program
    side_effects:
      - "increments Program.version by 1"
      - "status=PUBLISHED requires >=1 zone and >=1 site; creates PROGRAM_PUBLISHED notification"
      - "status=ACTIVE requires now >= window_start"
      - "status=CLOSED requires all close guards (see Program state machine)"
  - method: POST
    path: "/programs/{id}/ops-run"
    description: "Nightly ops checkpoint: expire stale bookings to MISSED, mark elapsed shifts NO_SHOW (auto-suspend at 3), move sites past close_date to CLOSING, expire claims on ended events, recompute posture"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Program
    side_effects:
      - "CONFIRMED bookings with service_date < current date -> MISSED (capacity released)"
      - "SIGNED_UP shifts with end_at < now -> NO_SHOW; volunteer.no_show_count += 1; at 3 volunteer -> SUSPENDED and future SIGNED_UP shifts -> CANCELLED"
      - "OPEN sites with close_date < now -> CLOSING (+SITE_CLOSING notification, future shifts cancelled)"
      - "Claims CONFIRMED/WAITLISTED on events with pickup_end < now -> EXPIRED (allocations released, promotion sweep)"
      - "Posture recomputed; increments Program.version by 1"
  - method: GET
    path: "/programs/{id}/diversion-summary"
    description: "Computed read: live diversion rollup (same algorithm as diversion_rate_rollup) without creating a report"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner]
    code: 200
    input: []
    output: "{ collected_tons: number, diverted_tons: number, disposed_tons: number, diversion_rate: number, grade: string, below_target: boolean }"
    side_effects: []
  - method: GET
    path: "/programs/{id}/notifications"
    description: "List notification log entries for the program (newest first)"
    roles: [ProgramAdmin, SiteSupervisor]
    code: 200
    input: ["kind?", "household_id?", "limit?", "offset?"]
    output: NotificationLog[]
    side_effects: []

  # --- Drop-off sites ---
  - method: POST
    path: "/sites"
    description: "Create a drop-off site (status PLANNED). Program must be DRAFT, PUBLISHED or ACTIVE."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, name, address, capacity_cy, open_date, close_date, "volunteer_slots_per_role?"]
    output: DropOffSite
    side_effects: ["open_date/close_date must lie within the program window and open_date <= close_date else ERR_VALIDATION"]
  - method: GET
    path: "/sites/{id}"
    description: "Get a site including stockpile_cy"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner, Resident, Volunteer]
    code: 200
    input: []
    output: DropOffSite
    side_effects: []
  - method: GET
    path: "/sites"
    description: "List sites, filterable by program"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner, Resident, Volunteer]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: DropOffSite[]
    side_effects: []
  - method: PATCH
    path: "/sites/{id}"
    description: "Edit capacity/dates/slots or transition status (OPEN/SUSPENDED/CLOSING/CLOSED). OCC-guarded."
    roles: [ProgramAdmin, SiteSupervisor]
    code: 200
    input: ["capacity_cy?", "open_date?", "close_date?", "volunteer_slots_per_role?", "status?", "expected_site_version"]
    output: DropOffSite
    side_effects:
      - "increments DropOffSite.version by 1"
      - "capacity_cy edit: new capacity must be >= stockpile_cy else ERR_CAPACITY_BELOW_STOCKPILE"
      - "status transitions per DropOffSite state machine (incl. closure guards and SITE_CLOSING cascade)"

  # --- Service zones ---
  - method: POST
    path: "/zones"
    description: "Create a service zone (status ACTIVE). Program must be DRAFT, PUBLISHED or ACTIVE."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, zone_code, collection_date, daily_tree_capacity]
    output: ServiceZone
    side_effects: ["collection_date must lie within the program window else ERR_VALIDATION; zone_code unique per program else ERR_VALIDATION"]
  - method: GET
    path: "/zones/{id}"
    description: "Get a zone including reserved_trees/remaining_capacity and tonnage projections"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner, Resident, Volunteer]
    code: 200
    input: []
    output: ServiceZone
    side_effects: []
  - method: GET
    path: "/zones"
    description: "List zones, filterable by program"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner, Resident, Volunteer]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: ServiceZone[]
    side_effects: []
  - method: PATCH
    path: "/zones/{id}"
    description: "Reschedule collection_date, change capacity, or suspend/reactivate. OCC-guarded."
    roles: [ProgramAdmin]
    code: 200
    input: ["collection_date?", "daily_tree_capacity?", "status?", "expected_zone_version"]
    output: ServiceZone
    side_effects:
      - "increments ServiceZone.version by 1"
      - "collection_date change requires (current collection_date < now, i.e. a makeup-day move) OR (now <= current collection_date - 48h, inclusive boundary), else ERR_NOTIFICATION_LEAD_TIME; new date must be within the program window and > now"
      - "on reschedule: CONFIRMED bookings' service_date updated to the new date and a ZONE_RESCHEDULED notification is created per affected household"
      - "daily_tree_capacity reduction below current reserved_trees -> ERR_ROUTE_CAPACITY_EXCEEDED"

  # --- Households ---
  - method: POST
    path: "/households"
    description: "Register a household for a program (self-service or admin). curbside_eligible=true, strike_count=0."
    roles: [Anonymous, ProgramAdmin]
    code: 201
    input: [program_id, zone_id, address, contact_email]
    output: Household
    side_effects: ["program must not be CLOSED (else ERR_INVALID_STATE); zone must belong to the program (else ERR_VALIDATION)"]
  - method: GET
    path: "/households/{id}"
    description: "Get a household including strike_count and curbside_eligible"
    roles: [ProgramAdmin, SiteSupervisor, Resident]
    code: 200
    input: []
    output: Household
    side_effects: []
  - method: GET
    path: "/households"
    description: "List households with filters"
    roles: [ProgramAdmin, SiteSupervisor]
    code: 200
    input: ["program_id?", "zone_id?", "curbside_eligible?", "limit?", "offset?"]
    output: Household[]
    side_effects: []

  # --- Curbside bookings ---
  - method: POST
    path: "/bookings"
    description: "Book curbside collection (initial CONFIRMED; service_date = zone.collection_date)"
    roles: [Resident, ProgramAdmin]
    code: 201
    input: [household_id, zone_id, tree_count, size_class, prep_attestation]
    output: CurbsideBooking
    side_effects:
      - "zone.reserved_trees += tree_count; program posture NORMAL required; zone ACTIVE required"
      - "estimated_tons computed; zone projected/collected fields recomputed"
  - method: GET
    path: "/bookings/{id}"
    description: "Get a booking"
    roles: [ProgramAdmin, SiteSupervisor, Resident]
    code: 200
    input: []
    output: CurbsideBooking
    side_effects: []
  - method: GET
    path: "/bookings"
    description: "List bookings with filters"
    roles: [ProgramAdmin, SiteSupervisor]
    code: 200
    input: ["household_id?", "zone_id?", "status?", "limit?", "offset?"]
    output: CurbsideBooking[]
    side_effects: []
  - method: POST
    path: "/bookings/{id}/cancel"
    description: "Cancel a CONFIRMED or MISSED booking; releases reserved capacity when CONFIRMED"
    roles: [Resident, ProgramAdmin]
    code: 200
    input: []
    output: CurbsideBooking
    side_effects: ["zone.reserved_trees -= tree_count when previously CONFIRMED"]
  - method: POST
    path: "/bookings/{id}/reschedule"
    description: "Re-confirm a MISSED booking onto the zone's current collection_date"
    roles: [Resident, ProgramAdmin]
    code: 200
    input: [new_service_date]
    output: CurbsideBooking
    side_effects: ["capacity re-check then reserved_trees += tree_count; service_date updated"]
  - method: POST
    path: "/bookings/{id}/record-outcome"
    description: "Crew records SERVICED (optional actual_tons) or MISSED for a CONFIRMED booking"
    roles: [SiteSupervisor, ProgramAdmin]
    code: 200
    input: [outcome, "actual_tons?"]
    output: CurbsideBooking
    side_effects: ["SERVICED stores actual_tons and recomputes zone.collected_tons_actual; MISSED releases reserved capacity"]

  # --- Intake events ---
  - method: POST
    path: "/intake-events"
    description: "Record a drop-off delivery at a site (append-only; recorded_at = server logical clock)"
    roles: [SiteSupervisor, ProgramAdmin]
    code: 201
    input: [site_id, source_type, tree_count, size_class, "contaminated_cy?", "weighed_tons?"]
    output: IntakeEvent
    side_effects:
      - "site.stockpile_cy += net_volume_cy; site must be OPEN; clock within collection window (inclusive both ends); posture NORMAL required"
      - "contaminated_cy <= gross_volume_cy else ERR_VALIDATION"
  - method: GET
    path: "/intake-events/{id}"
    description: "Get an intake event"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner]
    code: 200
    input: []
    output: IntakeEvent
    side_effects: []
  - method: GET
    path: "/intake-events"
    description: "List intake events with filters"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: IntakeEvent[]
    side_effects: []
  - method: POST
    path: "/intake-events/{id}/void"
    description: "Void a RECORDED intake (compensating action); subtracts net_volume_cy from stockpile"
    roles: [SiteSupervisor, ProgramAdmin]
    code: 200
    input: [reason]
    output: IntakeEvent
    side_effects: ["site.stockpile_cy -= net_volume_cy"]

  # --- Contamination tickets ---
  - method: POST
    path: "/contamination-tickets"
    description: "Report contamination against a booking (curbside) or a site (dumped material); exactly one source"
    roles: [ProgramAdmin, SiteSupervisor, Volunteer]
    code: 201
    input: [program_id, "booking_id?", "site_id?", category, "notes?"]
    output: ContaminationTicket
    side_effects:
      - "program.open_ticket_count += 1; posture recomputed (may flip to RESTRICTED)"
      - "booking-linked tickets require booking status in {CONFIRMED, SERVICED}; duplicate OPEN ticket per booking or per site rejected (ERR_DUPLICATE_TICKET)"
  - method: GET
    path: "/contamination-tickets/{id}"
    description: "Get a ticket"
    roles: [ProgramAdmin, SiteSupervisor, Resident, Volunteer]
    code: 200
    input: []
    output: ContaminationTicket
    side_effects: []
  - method: GET
    path: "/contamination-tickets"
    description: "List tickets with filters"
    roles: [ProgramAdmin, SiteSupervisor]
    code: 200
    input: ["program_id?", "booking_id?", "site_id?", "status?", "limit?", "offset?"]
    output: ContaminationTicket[]
    side_effects: []
  - method: POST
    path: "/contamination-tickets/{id}/adjudicate"
    description: "Adjudicate an OPEN ticket (UPHELD or DISMISSED). SoD: adjudicator != reporter."
    roles: [ProgramAdmin, SiteSupervisor]
    code: 200
    input: [verdict]
    output: ContaminationTicket
    side_effects: ["per ContaminationTicket state machine incl. strike/bar cascade on UPHELD"]
  - method: POST
    path: "/contamination-tickets/{id}/appeal"
    description: "Appeal an UPHELD booking-linked ticket within 72h of adjudication"
    roles: [Resident]
    code: 200
    input: []
    output: ContaminationTicket
    side_effects: []
  - method: POST
    path: "/contamination-tickets/{id}/resolve-appeal"
    description: "Resolve an APPEALED ticket (UPHELD_FINAL or OVERTURNED). SoD: resolver != adjudicator."
    roles: [ProgramAdmin]
    code: 200
    input: [resolution]
    output: ContaminationTicket
    side_effects: ["OVERTURNED: strike revoked, eligibility recomputed, rejected booking restored to CONFIRMED"]

  # --- Chipping runs ---
  - method: POST
    path: "/chipping-runs"
    description: "Schedule a chipping run at a site. Runs at the same site must not overlap and must keep a 2h buffer (gap of exactly 2h is allowed)."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, site_id, scheduled_start, scheduled_end, material_class]
    output: ChippingRun
    side_effects: ["window/buffer validation per §1.4 p9/p10"]
  - method: GET
    path: "/chipping-runs/{id}"
    description: "Get a chipping run including computed theoretical_output_cy/variance_pct"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner]
    code: 200
    input: []
    output: ChippingRun
    side_effects: []
  - method: GET
    path: "/chipping-runs"
    description: "List chipping runs with filters"
    roles: [ProgramAdmin, SiteSupervisor, HaulerPartner]
    code: 200
    input: ["program_id?", "site_id?", "status?", "limit?", "offset?"]
    output: ChippingRun[]
    side_effects: []
  - method: POST
    path: "/chipping-runs/{id}/complete"
    description: "Complete a run with scale data; draws stockpile, credits mulch pool, promotes waitlist"
    roles: [ProgramAdmin, HaulerPartner]
    code: 200
    input: [input_cy, measured_input_tons, contaminated_input_tons, measured_output_cy, "yield_review_confirmed?"]
    output: ChippingRun
    side_effects: ["per ChippingRun state machine: stockpile draw, pool credit, waitlist promotion, CLAIM_PROMOTED notifications"]
  - method: POST
    path: "/chipping-runs/{id}/cancel"
    description: "Cancel a SCHEDULED run"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ChippingRun
    side_effects: []

  # --- Mulch events & claims ---
  - method: POST
    path: "/mulch-events"
    description: "Create a mulch giveback event (status SCHEDULED). pickup window must be >= claim_close_at."
    roles: [ProgramAdmin]
    code: 201
    input: [program_id, name, claim_open_at, claim_close_at, pickup_start, pickup_end, "per_household_cap_cy?"]
    output: MulchEvent
    side_effects: []
  - method: GET
    path: "/mulch-events/{id}"
    description: "Get an event"
    roles: [ProgramAdmin, SiteSupervisor, Resident, Volunteer]
    code: 200
    input: []
    output: MulchEvent
    side_effects: []
  - method: GET
    path: "/mulch-events"
    description: "List events with filters"
    roles: [ProgramAdmin, SiteSupervisor, Resident, Volunteer]
    code: 200
    input: ["program_id?", "status?", "limit?", "offset?"]
    output: MulchEvent[]
    side_effects: []
  - method: PATCH
    path: "/mulch-events/{id}"
    description: "Transition event status (OPEN, CLOSED) per MulchEvent state machine"
    roles: [ProgramAdmin]
    code: 200
    input: [status]
    output: MulchEvent
    side_effects: ["OPEN creates MULCH_EVENT_OPENED notification; CLOSED expires CONFIRMED/WAITLISTED claims and runs promotion sweep"]
  - method: POST
    path: "/mulch-claims"
    description: "Create a mulch claim on an OPEN event; tier derived; allocates immediately or WAITLISTED"
    roles: [Resident, ProgramAdmin]
    code: 201
    input: [event_id, household_id, requested_cy]
    output: MulchClaim
    side_effects: ["per mulch_claim_allocation; tier allocation counters updated when CONFIRMED"]
  - method: GET
    path: "/mulch-claims/{id}"
    description: "Get a claim"
    roles: [ProgramAdmin, SiteSupervisor, Resident]
    code: 200
    input: []
    output: MulchClaim
    side_effects: []
  - method: GET
    path: "/mulch-claims"
    description: "List claims with filters"
    roles: [ProgramAdmin, SiteSupervisor]
    code: 200
    input: ["event_id?", "household_id?", "status?", "limit?", "offset?"]
    output: MulchClaim[]
    side_effects: []
  - method: PATCH
    path: "/mulch-claims/{id}"
    description: "FULFILLED (SiteSupervisor/ProgramAdmin, within pickup window) or CANCELLED (Resident own/ProgramAdmin)"
    roles: [Resident, SiteSupervisor, ProgramAdmin]
    code: 200
    input: [status]
    output: MulchClaim
    side_effects: ["CANCELLED from CONFIRMED releases allocation and runs promotion sweep"]

  # --- Volunteers & shifts ---
  - method: POST
    path: "/volunteers"
    description: "Register a volunteer (status APPLIED)"
    roles: [Anonymous, ProgramAdmin]
    code: 201
    input: [program_id, full_name, email]
    output: Volunteer
    side_effects: ["program must not be CLOSED"]
  - method: GET
