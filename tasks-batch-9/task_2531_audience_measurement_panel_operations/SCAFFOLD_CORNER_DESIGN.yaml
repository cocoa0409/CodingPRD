          setup:
            - "CHAIN C complete with CODE DMA-699, RANK 199, T 1, B 2000, BUDGET 500000, PERSONS 2, SERIAL MT-002098, LABEL RS-C88, opened by stat-opener-99 and published by stat-publisher-99; run PUBLISHED with projected_average_audience 24306, clock 2026-08-11T00:00:00Z."
