            - { call: "POST /ppc/risk-reduction-credits/${crb}/transition", payload: { target_state: "VERIFIED" }, as: FieldAnalyst }
            - { call: "POST /ppc/risk-reduction-credits/${crc}/transition", payload: { target_state: "VERIFIED" }, as: FieldAnalyst }
            - { call: "POST /ppc/evaluation-cycles/${cy_id}/transition", payload: { target_state: "SCORING" }, as: EvaluationCoordinator }
