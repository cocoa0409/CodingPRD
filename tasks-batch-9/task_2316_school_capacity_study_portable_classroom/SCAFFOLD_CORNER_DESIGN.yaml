  # =========================================================================
  # SECTION 6 - errors
  # =========================================================================
  - section: errors
    instances:

      - name: auth_role_and_pagination_envelope_errors
        claim_type: error_triggerable
        grounds: ["errors[ERR_UNAUTHENTICATED]", "errors[ERR_FORBIDDEN_ROLE]", "errors[ERR_INVALID_PAGINATION]", "validations[1]", "validations[2]", "validations[7]"]
        distinguishing_aspect: "The three envelope-level codes must be distinguishable and correctly ordered: missing headers give 401 before anything else is examined, an unknown role string is also 401 rather than 403, a known but unauthorised role gives 403 even when the rest of the request is invalid, and pagination bounds give 422 with ERR_INVALID_PAGINATION rather than ERR_INVALID_REQUEST. Testing the 401 on a route with a bad id proves the auth check precedes existence."
        test_recipe:
          setup: ["one campus so there is a real id to read"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/schools"
              payload: { name: "Northside Middle", grade_configuration: "MIDDLE_68", site_acreage: 10.0, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { school_id: id }
          trigger:
            call: "GET /facilities/schools/00000000-0000-4000-8000-0000000000ff"
            payload: {}
            as: NONE
            as_user_id: "NONE"
          assert:
            - "response status is 401 with data.error_id == \"ERR_UNAUTHENTICATED\" - the missing headers outrank the unknown id"
            - "an unknown role string is authentication, not authorisation: the same read as role SUPERINTENDENT with X-User-ID ghost-1 returns 401 with data.error_id == \"ERR_UNAUTHENTICATED\""
            - "a known but unauthorised role is 403: POST /facilities/schools as FacilitiesPlanner planner-1 with a valid body returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "role outranks body validity: POST /facilities/schools as FacilitiesPlanner planner-1 with an empty body returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\", not 422"
            - "pagination bounds: GET /facilities/schools/${school_id} is unaffected, but GET /facilities/portable-units with limit 0 returns 422 with data.error_id == \"ERR_INVALID_PAGINATION\", as do limit 101 and offset -1"
            - "defaults still apply when the parameters are absent: GET /facilities/portable-units returns 200 with data.limit == 10 and data.offset == 0"

      - name: every_not_found_code_is_entity_specific
        claim_type: error_triggerable
        grounds: ["errors[ERR_SCHOOL_NOT_FOUND]", "errors[ERR_ROOM_NOT_FOUND]", "errors[ERR_SET_ASIDE_NOT_FOUND]", "errors[ERR_PROJECTION_NOT_FOUND]", "errors[ERR_POLICY_NOT_FOUND]", "errors[ERR_STUDY_NOT_FOUND]", "errors[ERR_UNIT_NOT_FOUND]", "errors[ERR_SITE_NOT_FOUND]", "errors[ERR_REQUEST_NOT_FOUND]", "errors[ERR_PERMIT_NOT_FOUND]", "errors[ERR_SCHEDULE_NOT_FOUND]", "errors[ERR_BUDGET_NOT_FOUND]", "errors[ERR_CREW_NOT_FOUND]", "errors[ERR_DISPOSAL_NOT_FOUND]", "validations[4]"]
        distinguishing_aspect: "Fourteen entity types each own a distinct 404 code, and an implementation that returns one generic ERR_NOT_FOUND - or that maps the path segment to the wrong code - fails here. Every read is attempted with the same syntactically valid but unused UUID, so nothing but the route determines the code."
        test_recipe:
          setup: ["an empty district: only the clock is set, so every id below is unused"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
          trigger:
            call: "GET /facilities/schools/00000000-0000-4000-8000-000000000001"
            payload: {}
            as: DistrictAdmin
            as_user_id: "admin-1"
          assert:
            - "response status is 404 with data.error_id == \"ERR_SCHOOL_NOT_FOUND\""
            - "GET /facilities/rooms/00000000-0000-4000-8000-000000000002 returns 404 with data.error_id == \"ERR_ROOM_NOT_FOUND\""
            - "GET /facilities/program-set-asides/00000000-0000-4000-8000-000000000003 returns 404 with data.error_id == \"ERR_SET_ASIDE_NOT_FOUND\""
            - "GET /facilities/enrollment-projections/00000000-0000-4000-8000-000000000004 returns 404 with data.error_id == \"ERR_PROJECTION_NOT_FOUND\""
            - "GET /facilities/class-size-policies/00000000-0000-4000-8000-000000000005 returns 404 with data.error_id == \"ERR_POLICY_NOT_FOUND\""
            - "GET /facilities/capacity-studies/00000000-0000-4000-8000-000000000006 returns 404 with data.error_id == \"ERR_STUDY_NOT_FOUND\""
            - "GET /facilities/portable-units/00000000-0000-4000-8000-000000000007 returns 404 with data.error_id == \"ERR_UNIT_NOT_FOUND\""
            - "GET /facilities/placement-sites/00000000-0000-4000-8000-000000000008 returns 404 with data.error_id == \"ERR_SITE_NOT_FOUND\""
            - "GET /facilities/placement-requests/00000000-0000-4000-8000-000000000009 returns 404 with data.error_id == \"ERR_REQUEST_NOT_FOUND\""
            - "GET /facilities/permits/00000000-0000-4000-8000-00000000000a returns 404 with data.error_id == \"ERR_PERMIT_NOT_FOUND\""
            - "GET /facilities/installation-schedules/00000000-0000-4000-8000-00000000000b returns 404 with data.error_id == \"ERR_SCHEDULE_NOT_FOUND\""
            - "GET /facilities/capital-budgets/00000000-0000-4000-8000-00000000000c returns 404 with data.error_id == \"ERR_BUDGET_NOT_FOUND\""
            - "GET /facilities/installation-crews/00000000-0000-4000-8000-00000000000d returns 404 with data.error_id == \"ERR_CREW_NOT_FOUND\""
            - "GET /facilities/disposal-records/00000000-0000-4000-8000-00000000000e returns 404 with data.error_id == \"ERR_DISPOSAL_NOT_FOUND\""

      - name: uniqueness_codes_are_scope_specific
        claim_type: error_triggerable
        grounds: ["errors[ERR_DUPLICATE_POLICY]", "errors[ERR_DUPLICATE_ROOM]", "errors[ERR_DUPLICATE_ASSET_TAG]", "errors[ERR_DUPLICATE_PAD_CODE]", "validations[32]"]
        distinguishing_aspect: "Four different uniqueness scopes are exercised: policy by band and year, room by campus and number, asset tag district-wide, pad code by campus. The controls matter as much as the collisions - the same room number and the same pad code must be accepted on a second campus, so an implementation that enforces those globally fails even though every collision test passes."
        test_recipe:
          setup: ["two campuses, one policy, one room, one unit and one pad"]
          setup_api_calls:
            - call: "POST /facilities/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/class-size-policies"
              payload: { grade_band: "G7_8", effective_school_year: "2027-28", max_class_size: 28, min_area_sqft_per_seat: 30, lab_area_premium_sqft: 20 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { policy_id: id }
            - call: "POST /facilities/schools"
              payload: { name: "Northside Middle", grade_configuration: "MIDDLE_68", site_acreage: 10.0, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { school_id: id }
            - call: "POST /facilities/schools"
              payload: { name: "Eastvale Middle", grade_configuration: "MIDDLE_68", site_acreage: 10.0, fire_lane_clear_width_ft: 24, electrical_spare_capacity_kw: 40, sewer_spare_connections: 1 }
              as: DistrictAdmin
              as_user_id: "admin-1"
              captures: { other_school_id: id }
            - call: "POST /facilities/rooms"
              payload: { school_id: "${school_id}", room_number: "R101", room_type: "STANDARD_CLASSROOM", area_sqft: 900 }
              as: DistrictAdmin
              as_user_id: "admin-1"
            - call: "POST /facilities/portable-units"
              payload: { asset_tag: "PU-U101", size_class: "SINGLE_24x40", condition_grade: "B", ada_ramp_installed: true, acquisition_cost_cents: 9600000, in_service_year: 2019 }
              as: AssetManager
              as_user_id: "assets-3"
            - call: "POST /facilities/placement-sites"
              payload: { school_id: "${school_id}", pad_code: "PAD-A", pad_length_ft: 60, pad_width_ft: 34, distance_to_fire_lane_ft: 40, electrical_drop_available_kw: 20, sewer_connection_available: false, ada_path_of_travel_compliant: true }
              as: DistrictAdmin
              as_user_id: "admin-1"
          trigger:
            call: "POST /facilities/class-size-policies"
            payload: { grade_band: "G7_8", effective_school_year: "2027-28", max_class_size: 24, min_area_sqft_per_seat: 32, lab_area_premium_sqft: 25 }
            as: DistrictAdmin
            as_user_id: "admin-1"
          assert:
            - "response status is 409 with data.error_id == \"ERR_DUPLICATE_POLICY\" even though every other field differs"
            - "GET /facilities/class-size-policies/${policy_id} returns data.max_class_size == 28, proving the original row was not overwritten"
            - "same campus, same room number: POST /facilities/rooms with school_id ${school_id}, room_number R101, room_type SCIENCE_LAB and area_sqft 1000 returns 409 with data.error_id == \"ERR_DUPLICATE_ROOM\""
            - "different campus, same room number is fine: the same body with school_id ${other_school_id} returns 201"
            - "asset tags are district-wide: POST /facilities/portable-units with asset_tag PU-U101 and size_class DOUBLE_28x64 returns 409 with data.error_id == \"ERR_DUPLICATE_ASSET_TAG\""
            - "same campus, same pad code: POST /facilities/placement-sites with school_id ${school_id} and pad_code PAD-A returns 409 with data.error_id == \"ERR_DUPLICATE_PAD_CODE\""
            - "different campus, same pad code is fine: the same pad body with school_id ${other_school_id} returns 201"

      - name: unit_state_invalid_on_a_second_legacy_placement
        claim_type: error_triggerable
        grounds: ["errors[ERR_UNIT_STATE_INVALID]", "validations[10]", state_machines.PortableUnit]
        distinguishing_aspect: "An already-INSTALLED unit has no declared transition into INSTALLED, so recording a second legacy placement onto a free pad must fail with ERR_UNIT_STATE_INVALID at priority 10 rather than with the pad-occupancy code at priority 31 - the second pad really is empty. The first pad and the campus seat count must be untouched by the rejection."
