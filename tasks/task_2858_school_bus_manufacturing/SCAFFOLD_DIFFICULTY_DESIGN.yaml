      - name: bid_revision_cycle_returns_to_draft_until_round_limit
        grounds:
          - state_machines.Bid.DRAFT_to_SUBMITTED
          - state_machines.Bid.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Bid.REVISION_REQUESTED_to_DRAFT
          - entities.Bid.fields.revision_round
          - entities.BidRevision.fields.is_superseded
          - validations[priority=42]
          - errors[ERR_REVISION_ROUND_LIMIT]
        distinguishing_aspect: |
          The Bid machine is a bounded cycle, not a line: DRAFT -> SUBMITTED -> REVISION_REQUESTED ->
          DRAFT can be traversed three times, and the state a bid may enter depends on a counter
          (revision_round) rather than only on its current status, so the fourth round is refused from
          the same REVISION_REQUESTED/DRAFT state that accepted the third.
        test_recipe:
          setup:
            - "TYPE_C_CONV, DSL-100, TX 2026-2027 PUBLISHED, Solicitation SOL-TX-002 that stays OPEN throughout"
            - "A bid created in DRAFT with revision_round 0 and a round-0 BidRevision"
            - "Three revision rounds appended, each OCC-guarded on the bid's then-current version, with a submit / request-revision cycle between rounds 1 and 2 and between rounds 2 and 3"
