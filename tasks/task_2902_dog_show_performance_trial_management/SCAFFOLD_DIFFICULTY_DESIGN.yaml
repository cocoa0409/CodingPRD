              as: Handler
              as_user_id: "${h1_id}"
              captures: { d3_id: $.data.id }
            - call: "POST /dog-shows/dogs"
              payload: { registration_number: "SR-0004", call_name: "Dune", breed_code: "GOLDEN_RETRIEVER", group_code: "SPORTING", sex: "DOG", birth_date: "2024-05-10", owner_handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
              captures: { d4_id: $.data.id }
            - call: "POST /dog-shows/entries"
              payload: { show_id: "${show_id}", class_id: "${ca_id}", dog_id: "${d1_id}", handler_id: "${h1_id}" }
              as: Handler
              as_user_id: "${h1_id}"
