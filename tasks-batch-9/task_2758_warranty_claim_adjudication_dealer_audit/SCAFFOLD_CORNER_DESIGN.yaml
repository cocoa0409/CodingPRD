          - complexity_profile.entity_topology
        distinguishing_aspect: |
          StateLawProfile declares common_fields false and §1.5 exposes only POST and GET for it, so the read
          model has id and created_at but no updated_at and no version, and no endpoint in the surface can
          mutate a published profile.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-01T00:00:00Z."
            - "One CA profile published."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
