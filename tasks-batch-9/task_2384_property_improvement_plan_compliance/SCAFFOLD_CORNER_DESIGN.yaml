scaffold_corner_design:

  # =========================================================================
  # Guide section 1 — From Table 1 (Entities)
  # =========================================================================
  - section: entities
    instances:
      - name: property_create_pins_reserve_baseline_and_bumps_portfolio_count
        claim_type: creation
        grounds:
          - endpoints["POST /pip/properties"]
          - entities.Property.fields.initial_reserve_balance_cents
          - entities.FranchiseeAccount.fields.portfolio_property_count
          - response_envelope.success
        distinguishing_aspect: "A 201 create returns the full envelope and every system/computed default in one shot: initial_reserve_balance_cents pinned to the supplied 50000000, version 1, and the parent franchisee's portfolio_property_count advanced to 1."
        test_recipe:
          setup:
            - "One franchisee account exists with portfolio_property_count 0."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Ashgrove Lodging LLC", contact_email: "ops@ashgrovel.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
          trigger:
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Ashgrove Downtown", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
          assert:
            - "the call returns 201"
            - "the response carries meta.api_request_id, meta.api_request_timestamp and response_type == \"object\""
            - "Property.${prop_id}.initial_reserve_balance_cents == 50000000 and Property.${prop_id}.reserve_balance_cents == 50000000"
            - "Property.${prop_id}.reserve_contributed_total_cents == 0 and Property.${prop_id}.rooms_out_of_service_current == 0"
            - "Property.${prop_id}.franchise_agreement_status == ACTIVE, compliance_risk_score == 100, compliance_posture == COMPLIANT, open_plan_count == 0"
            - "Property.${prop_id}.version == 1"
            - "FranchiseeAccount.${fr_id}.portfolio_property_count == 1 and FranchiseeAccount.${fr_id}.standing == GOOD"

      - name: plan_get_by_id_returns_stored_scope_aggregates
        claim_type: retrieval
        grounds:
          - endpoints["GET /pip/plans/{id}"]
          - entities.PipPlan.fields.brand_scoped_total_cents
          - entities.PipPlan.fields.funding_requirement_cents
          - calculations.funding_requirement
        distinguishing_aspect: "A DRAFT plan read back by id returns its stored aggregates (one GUEST_FACING item of 2500000 gives funding 2956250) while every issuance-derived field — the three category deadlines and the item's priority_rank — is still null."
        test_recipe:
          setup:
            - "One franchisee, one property, one DRAFT plan carrying a single GUEST_FACING item of 2500000 cents."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Brightwater Hotels LLC", contact_email: "ops@brightwaterh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Brightwater Quay", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "RELICENSING", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-2.4.1", brand_estimated_cost_cents: 2500000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /pip/plans/${plan_id}"
              as: BrandInspector
              as_user_id: "bi-007"
          assert:
            - "the call returns 200 with data.id == ${plan_id} and data.property_id == ${prop_id}"
            - "PipPlan.${plan_id}.status == DRAFT and PipPlan.${plan_id}.dispute_state == NONE"
            - "PipPlan.${plan_id}.scope_item_count == 1 and PipPlan.${plan_id}.brand_scoped_total_cents == 2500000"
            - "PipPlan.${plan_id}.owner_claimed_total_cents == 0 and PipPlan.${plan_id}.funding_requirement_cents == 2956250"
            - "PipPlan.${plan_id}.life_safety_deadline_date == null, guest_facing_deadline_date == null, back_of_house_deadline_date == null"
            - "PipPlan.${plan_id}.issued_by_user_id == null and issued_at == null"
            - "PipItem.${item_id}.deadline_date == null and PipItem.${item_id}.priority_rank == null"

      - name: items_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /pip/items"]
          - response_envelope.pagination_fields
          - validations[priority=23]
        distinguishing_aspect: "Three items filtered by plan_id and paged at limit 2: the first page reports total_count 3 with has_more true and two rows, the second reports has_more false with one row."
        test_recipe:
          setup:
            - "One property with a DRAFT plan carrying three BACK_OF_HOUSE items of 100000 cents each."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Cedarpoint Inns LLC", contact_email: "ops@cedarpointi.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Cedarpoint Plaza", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-1.1.1", brand_estimated_cost_cents: 100000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-1.1.2", brand_estimated_cost_cents: 100000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-1.1.3", brand_estimated_cost_cents: 100000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
          trigger:
            - call: "GET /pip/items?plan_id=${plan_id}&limit=2&offset=0"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
            - call: "GET /pip/items?plan_id=${plan_id}&limit=2&offset=2"
              as: FranchiseeOwner
              as_user_id: "${fr_id}"
          assert:
            - "the first call returns 200 with response_type == \"array\", limit == 2, offset == 0, total_count == 3, has_more == true and exactly 2 rows"
            - "the second call returns 200 with limit == 2, offset == 2, total_count == 3, has_more == false and exactly 1 row"
            - "the three rows across both pages are disjoint and all carry plan_id == ${plan_id}"
            - "PipPlan.${plan_id}.brand_scoped_total_cents == 300000 and PipPlan.${plan_id}.funding_requirement_cents == 341550"

      - name: unknown_ids_return_the_collection_specific_not_found_error
        claim_type: not_found
        grounds:
          - validations[priority=10]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_ITEM_NOT_FOUND]
          - errors[ERR_LEDGER_ENTRY_NOT_FOUND]
        distinguishing_aspect: "Each collection answers its own 404 error_id rather than a shared generic one; the probe id is syntactically valid and belongs to no row."
        test_recipe:
          setup:
            - "Empty database; no seeding is required because every probe targets a non-existent id."
          setup_api_calls: []
          trigger:
            - call: "GET /pip/franchisee-accounts/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_franchisee: $.data.error_id }
            - call: "GET /pip/properties/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_property: $.data.error_id }
            - call: "GET /pip/plans/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_plan: $.data.error_id }
            - call: "GET /pip/items/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_item: $.data.error_id }
            - call: "GET /pip/extension-requests/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_extension: $.data.error_id }
            - call: "GET /pip/capital-budgets/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_budget: $.data.error_id }
            - call: "GET /pip/reserve-draws/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_draw: $.data.error_id }
            - call: "GET /pip/renovation-phases/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_phase: $.data.error_id }
            - call: "GET /pip/contractors/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_contractor: $.data.error_id }
            - call: "GET /pip/contractor-bookings/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_booking: $.data.error_id }
            - call: "GET /pip/inspections/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_inspection: $.data.error_id }
            - call: "GET /pip/punch-list-items/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_punch: $.data.error_id }
            - call: "GET /pip/disputes/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_dispute: $.data.error_id }
            - call: "GET /pip/default-notices/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_notice: $.data.error_id }
            - call: "GET /pip/compliance-ledger-entries/00000000-0000-0000-0000-0000000000ff"
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err_ledger: $.data.error_id }
          assert:
            - "every one of the fifteen calls returns HTTP 404 with response_type == \"error\""
            - "${err_franchisee} == \"ERR_FRANCHISEE_NOT_FOUND\" and ${err_property} == \"ERR_PROPERTY_NOT_FOUND\""
            - "${err_plan} == \"ERR_PLAN_NOT_FOUND\" and ${err_item} == \"ERR_ITEM_NOT_FOUND\""
            - "${err_extension} == \"ERR_EXTENSION_REQUEST_NOT_FOUND\" and ${err_budget} == \"ERR_BUDGET_NOT_FOUND\""
            - "${err_draw} == \"ERR_DRAW_NOT_FOUND\" and ${err_phase} == \"ERR_PHASE_NOT_FOUND\""
            - "${err_contractor} == \"ERR_CONTRACTOR_NOT_FOUND\" and ${err_booking} == \"ERR_BOOKING_NOT_FOUND\""
            - "${err_inspection} == \"ERR_INSPECTION_NOT_FOUND\" and ${err_punch} == \"ERR_PUNCH_NOT_FOUND\""
            - "${err_dispute} == \"ERR_DISPUTE_NOT_FOUND\" and ${err_notice} == \"ERR_NOTICE_NOT_FOUND\""
            - "${err_ledger} == \"ERR_LEDGER_ENTRY_NOT_FOUND\""
            - "GET /pip/plans?property_id=00000000-0000-0000-0000-0000000000ff returns 200 with total_count == 0, never a 404 (validations priority 12)"

      - name: plan_create_missing_standards_edition_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=20]
          - errors[ERR_VALIDATION]
          - endpoints["POST /pip/plans"]
        distinguishing_aspect: "standards_edition is an input field with no default, so omitting it fails at priority 20 with ERR_VALIDATION (422) before any FK or state check runs."
        test_recipe:
          setup:
            - "One franchisee and one property exist."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Dovetail Hotels LLC", contact_email: "ops@dovetailh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Dovetail Market Street", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { err: $.data.error_id }
          assert:
            - "the call returns 422 and ${err} == \"ERR_VALIDATION\""
            - "GET /pip/plans?property_id=${prop_id} returns total_count == 0"
            - "Property.${prop_id}.open_plan_count == 0"

      - name: contractor_and_item_creates_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Contractor.fields.brand_approved
          - entities.Contractor.fields.max_concurrent_bookings
          - entities.PipItem.fields.rooms_affected_count
          - endpoints["POST /pip/contractors"]
        distinguishing_aspect: "Omitting the optional inputs applies the declared defaults exactly: brand_approved false, max_concurrent_bookings 1, rooms_affected_count 0 — not null and not a server-invented value."
        test_recipe:
          setup:
            - "One property with a DRAFT plan exists."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Elmcrest Lodging LLC", contact_email: "ops@elmcrestl.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Elmcrest Terrace", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /pip/contractors"
              payload: { name: "Fernwood Millwork", trade: "FF_AND_E" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { contractor_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "BACK_OF_HOUSE", standards_reference: "BOH-3.2.1", brand_estimated_cost_cents: 400000, room_impacting: false }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { item_id: $.data.id }
          assert:
            - "Contractor.${contractor_id}.brand_approved == false and Contractor.${contractor_id}.max_concurrent_bookings == 1"
            - "PipItem.${item_id}.rooms_affected_count == 0"
            - "PipItem.${item_id}.status == SCOPED, extension_days_granted == 0, is_overdue == false"
            - "PipItem.${item_id}.owner_claimed_cost_cents == null and PipItem.${item_id}.approved_cost_cents == 400000"
            - "PipItem.${item_id}.item_funding_cents == 455400"

      - name: issuance_derives_item_deadlines_ranks_and_funding
        claim_type: computed_fields
        grounds:
          - calculations.category_deadline_schedule
          - calculations.item_priority_ranking
          - calculations.funding_requirement
          - endpoints["POST /pip/plans/{id}/issue"]
        distinguishing_aspect: "Every computed PipItem field is derived server-side at issuance from category alone: the LIFE_SAFETY item takes deadline 2026-10-30 and rank 1 with funding 330000, the GUEST_FACING item takes 2027-04-28 and rank 2 with funding 236500."
        test_recipe:
          setup:
            - "One property with a DRAFT plan carrying a LIFE_SAFETY item of 300000 cents and a GUEST_FACING item of 200000 cents."
            - "The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Foxglove Hotels LLC", contact_email: "ops@foxgloveh.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Foxglove Garden District", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "POST_INSPECTION", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "GUEST_FACING", standards_reference: "GF-1.2.3", brand_estimated_cost_cents: 200000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { gf_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-1.2.3", brand_estimated_cost_cents: 300000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { ls_id: $.data.id }
          trigger:
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-001"
          assert:
            - "PipPlan.${plan_id}.status == ISSUED"
            - "PipPlan.${plan_id}.life_safety_deadline_date == \"2026-10-30\", guest_facing_deadline_date == \"2027-04-28\", back_of_house_deadline_date == \"2027-10-25\""
            - "PipItem.${ls_id}.deadline_date == \"2026-10-30\" and PipItem.${ls_id}.priority_rank == 1"
            - "PipItem.${gf_id}.deadline_date == \"2027-04-28\" and PipItem.${gf_id}.priority_rank == 2 (category rank beats the later creation order of the life-safety item)"
            - "PipItem.${ls_id}.item_funding_cents == 330000 and PipItem.${gf_id}.item_funding_cents == 236500"
            - "PipPlan.${plan_id}.brand_scoped_total_cents == 500000 and PipPlan.${plan_id}.funding_requirement_cents == 566500"
            - "PipItem.${ls_id}.is_overdue == false and PipItem.${gf_id}.is_overdue == false"

      - name: issuance_stamps_issuer_identity_and_logical_clock
        claim_type: system_fields
        grounds:
          - entities.PipPlan.fields.issued_by_user_id
          - entities.PipPlan.fields.issued_at
          - entities.ComplianceLedgerEntry.fields.recorded_at_clock
          - endpoints["POST /_clock/set_current_utc"]
        distinguishing_aspect: "issued_by_user_id and issued_at are system fields taken from the request's X-User-ID and from the logical clock, not from the body: with the clock moved to 2026-02-15 the plan stamps that instant and the category deadlines shift to 2026-05-16 / 2026-11-12 / 2027-05-11."
        test_recipe:
          setup:
            - "One property with a DRAFT plan carrying a single LIFE_SAFETY item of 400000 cents."
            - "The logical clock has been moved to 2026-02-15T09:30:00Z before issuance."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Glenmoor Inns LLC", contact_email: "ops@glenmoori.example" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { fr_id: $.data.id }
            - call: "POST /pip/properties"
              payload: { franchisee_id: "${fr_id}", brand_code: "HRB", name: "Glenmoor Airport West", room_count: 200, adr_baseline_cents: 18000, occupancy_baseline_pct: 0.70, reserve_balance_cents: 50000000, minimum_retention_cents: 5000000 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { prop_id: $.data.id }
            - call: "POST /pip/plans"
              payload: { property_id: "${prop_id}", trigger_type: "TRANSACTION_CHANGE_OF_OWNERSHIP", standards_edition: "2026.1" }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { plan_id: $.data.id }
            - call: "POST /pip/items"
              payload: { plan_id: "${plan_id}", category: "LIFE_SAFETY", standards_reference: "LS-6.1.1", brand_estimated_cost_cents: 400000, room_impacting: false, rooms_affected_count: 0 }
              as: BrandManager
              as_user_id: "bm-001"
              captures: { ls_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-15T09:30:00Z" }
              as: BrandManager
              as_user_id: "bm-001"
          trigger:
            - call: "POST /pip/plans/${plan_id}/issue"
              payload: {}
              as: BrandManager
              as_user_id: "bm-014"
          assert:
            - "PipPlan.${plan_id}.issued_by_user_id == \"bm-014\" (the X-User-ID of the issuing call, not the creating call)"
            - "PipPlan.${plan_id}.issued_at == \"2026-02-15T09:30:00Z\""
            - "PipPlan.${plan_id}.life_safety_deadline_date == \"2026-05-16\""
            - "PipPlan.${plan_id}.guest_facing_deadline_date == \"2026-11-12\" and back_of_house_deadline_date == \"2027-05-11\""
            - "PipItem.${ls_id}.deadline_date == \"2026-05-16\""
            - "GET /pip/compliance-ledger-entries?plan_id=${plan_id} returns one row with recorded_at_clock == \"2026-02-15T09:30:00Z\""

      - name: ledger_entries_are_append_only_without_a_version_field
        claim_type: immutability
        grounds:
          - entities.ComplianceLedgerEntry.common_fields
          - entities.ComplianceLedgerEntry.fields.entry_type
          - endpoints["GET /pip/compliance-ledger-entries"]
        distinguishing_aspect: "ComplianceLedgerEntry declares common_fields false, so its rows expose no version and no updated_at and §1.5 offers only the two GET routes — the SCOPE_ISSUED row minted at issuance can be read but never rewritten."
        test_recipe:
          setup:
            - "One property with a plan carrying a LIFE_SAFETY item of 300000 cents and a LIFE_SAFETY item of 700000 cents, issued at the default clock."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
