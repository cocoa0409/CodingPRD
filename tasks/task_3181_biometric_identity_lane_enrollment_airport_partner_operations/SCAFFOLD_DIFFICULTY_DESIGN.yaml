  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: discount_redemption_invariant_attach_detach_never_decrements
        grounds:
          - entities.PartnerDiscount.fields.redemptions_used
          - state_machines.PartnerDiscount.ACTIVE_to_EXHAUSTED
          - errors[ERR_DISCOUNT_EXHAUSTED]
        distinguishing_aspect: |
          Conserved quantity: redemptions_used is monotone — attach increments,
          detach NEVER decrements. Pinned formula: after n successful attaches
          and any number of detaches, redemptions_used == n. With
          max_redemptions 2: two attaches exhaust the discount; a detach in
          between does not free a slot, so the third attach fails
          ERR_DISCOUNT_EXHAUSTED.
