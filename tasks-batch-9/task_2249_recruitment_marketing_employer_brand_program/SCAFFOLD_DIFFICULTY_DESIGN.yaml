              captures: { tp_id: $.data.id }
            - call: "POST /applications/${app_id}/screen"
              as: RecruitingOps
          trigger:
            - call: "POST /applications/${app_id}/decide"
              payload: { outcome: "QUALIFIED" }
              as: RecruitingOps
          assert:
            - "Before the trigger: MediaFlight.${flight_id}.state == ACTIVE, reserved_cents == 360500, spent_cents == 20000; Channel.${ch1_id}.active_flight_count == 1 and pacing_status == PACING_UNKNOWN; Program.${program_id}.committed_budget_cents == 360500; JobFamily.${family_id}.reserved_cents == 360500"
            - "Hop 1 - Application.${app_id}.state == QUALIFIED, eligible_touch_count == 1, attributed_credit_bp_total == 10000, Touchpoint.${tp_id}.credit_bp == 10000"
            - "Hop 2 - Channel.${ch1_id}.credited_qualified_bp == 10000 and MediaFlight.${flight_id}.qualified_credit_bp == 10000"
            - "Hop 3 - Channel.${ch1_id}.blended_target_cents == 15000, cpqa_cents == 20000 (20000 * 10000 / 10000), pacing threshold == 18000, pacing_status == THROTTLED"
            - "Hop 4 - MediaFlight.${flight_id}.state == PAUSED_PACING, release_reason == PACING_THROTTLE, reserved_cents == 0"
            - "Hop 5 - exactly one new BudgetLedgerEntry for the flight with entry_type RELEASE, bucket FAMILY_DEDICATED, delta_cents -360500"
            - "Program.${program_id}.committed_budget_cents == 0 and JobFamily.${family_id}.reserved_cents == 0"
            - "Channel.${ch1_id}.active_flight_count == 0 but pacing_status is still THROTTLED and idle_since is null - the THROTTLED verdict computed in hop 3 outranks the IDLE verdict of hop 4"
            - "JobPosting.${posting_id}.qualified_count == 1 and Program.${program_id}.last_attribution_recompute_at == 2026-08-02T00:00:00Z"

      - name: compliance_flag_cascade_five_hops_from_review_to_idle_channel
        grounds:
          - state_machines.JobPosting.CLEARED_to_FLAGGED
          - state_machines.JobPosting.PUBLISHED_to_SUSPENDED
          - state_machines.MediaFlight.ACTIVE_to_SUSPENDED_CONTENT
          - entities.JobPosting.fields.suspended_reason
          - entities.Channel.fields.idle_since
          - entities.BudgetLedgerEntry.fields.bucket
        distinguishing_aspect: |
          A different entry point - POST /job-postings/{id}/compliance-review with decision FLAG -
          walks a five-hop chain that shares no edge with the qualification cascade: compliance
          FLAGGED, then content PUBLISHED -> SUSPENDED with suspended_reason COMPLIANCE_FLAG, then
