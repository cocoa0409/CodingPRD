# =============================================================================
# §1.8 SCAFFOLD DIFFICULTY DESIGN — Test Targeting Index
# Newborn Hearing Screening & Follow-Up Tracking (task 2606)
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every setup_api_calls chain starts from an empty DB
# with the logical clock at its default 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: diagnostic_timeliness_applied_vs_chronological_basis_on_one_row
        grounds:
          - calculations.infant_age_basis
          - calculations.milestone_timeliness_status
          - entities.DiagnosticEvaluation.fields.timeliness_status
          - entities.DiagnosticEvaluation.fields.timeliness_status_chronological_basis
          - state_machines.DiagnosticEvaluation.ATTESTED_to_FINALIZED_NO_LOSS
        distinguishing_aspect: |
          The dual variant here lives on the Infant/DiagnosticEvaluation clinical domain: one
          finalize writes ON_TIME under the applied (corrected-age) basis and LATE under the
          chronological basis onto the SAME row, because a 32-week infant carries a 56-day
          prematurity offset.
        test_recipe:
          setup:
            - "Facility BH1 (BIRTH_HOSPITAL, R1) and AC1 (AUDIOLOGY_CLINIC, R1); screener S1 at BH1; audiologists A1 and A2 at AC1."
            - "Infant P born 2026-08-03T08:00:00Z at 32 gestational weeks, nicu_stay_days 0 — so benchmark_age_basis is CORRECTED with prematurity_offset_days 56."
            - "Birth-admission screen REFERs, a DIAGNOSTIC episode supersedes the auto-created RESCREEN episode, and an evaluation is submitted and attested."
            - "Logical clock is moved to 2026-12-11T08:00:00Z — exactly 130 chronological days after birth (74 corrected days)."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: $.data.id }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A2", region_code: "R1" }
              as: ProgramAdmin
              captures: { a2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T10:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-03T08:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 32, nicu_stay_days: 0, guardian_name: "G-P", guardian_contact_phone: "5550001" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { p_id: $.data.id }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${p_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-03T09:00:00Z", left_ear_result: "REFER", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "GET /infants/${p_id}"
              payload: {}
              as: ProgramAdmin
              captures: { p_ver: $.data.version }
            - call: "GET /follow-up-episodes"
              payload: { infant_id: "${p_id}", status: "PENDING_SCHEDULING" }
              as: ProgramAdmin
              captures: { ep_rescreen_id: "$.data[0].id" }
            - call: "POST /follow-up-episodes"
              payload: { infant_id: "${p_id}", episode_type: "DIAGNOSTIC", expected_infant_version: "${p_ver}", supersedes_episode_id: "${ep_rescreen_id}" }
              as: ProgramAdmin
              captures: { ep_diag_id: $.data.id }
            - call: "POST /diagnostic-evaluations"
              payload: { infant_id: "${p_id}", episode_id: "${ep_diag_id}", facility_id: "${ac_id}", performed_by_provider_id: "${a1_id}", evaluation_datetime: "2026-08-03T10:00:00Z", method: "DIAGNOSTIC_ABR" }
              as: Audiologist
              as_user_id: "${a1_id}"
              captures: { ev_id: $.data.id }
            - call: "POST /diagnostic-evaluations/${ev_id}/submit"
              payload: { left_ear_threshold_db: 20, right_ear_threshold_db: 20, outcome: "NO_LOSS" }
              as: Audiologist
              as_user_id: "${a1_id}"
            - call: "POST /diagnostic-evaluations/${ev_id}/attest"
              payload: { decision: "ACCEPT", note: "second reader agrees" }
              as: Audiologist
              as_user_id: "${a2_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-11T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /diagnostic-evaluations/${ev_id}/finalize"
              payload: {}
              as: Audiologist
              as_user_id: "${a1_id}"
            - call: "GET /infants/${p_id}/timeliness"
              payload: {}
              as: ProgramAdmin
          assert:
            - "DiagnosticEvaluation.${ev_id}.age_days_at_finalize == 130"
            - "DiagnosticEvaluation.${ev_id}.timeliness_status == ON_TIME (applied basis: 74 corrected days <= 90)"
            - "DiagnosticEvaluation.${ev_id}.timeliness_status_chronological_basis == LATE (130 days, inside the 45-day grace band 91..135)"
            - "GET /infants/${p_id}/timeliness returns chronological_age_days == 130, prematurity_offset_days == 56, corrected_age_days == 74, effective_age_days == 74, benchmark_age_basis == CORRECTED"
            - "The two variants disagree on one stored row — timeliness_status != timeliness_status_chronological_basis"

      - name: facility_performance_cohort_vs_encounter_basis_diverge_45_vs_70
        grounds:
          - calculations.facility_performance_score
          - entities.Facility.fields.performance_score
          - entities.Facility.fields.encounter_basis_performance_score
          - entities.ScreeningEncounter.fields.before_discharge
          - state_machines.ReportingPeriod.OPEN_to_CLOSED
        distinguishing_aspect: |
          The second dual variant lives on a different entity domain — Facility-level program
          performance, not infant age. Two infants born inside August, one screened before
          discharge and one discharged unscreened, give r1_cohort 0.5000 against r1_encounter
          1.0000, so the same rows publish performance_score 45.00 and
          encounter_basis_performance_score 70.00.
        test_recipe:
          setup:
            - "Facility BH1 (BIRTH_HOSPITAL, R1) with screener S1."
            - "Infant X1 born 2026-08-05T00:00:00Z, screened PASS before discharge; infant X2 born 2026-08-31T12:00:00Z, discharged unscreened on 2026-08-31T20:00:00Z (which mints an INITIAL_SCREEN episode inside the window)."
            - "ReportingPeriod August [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) with submission_due_datetime 2026-09-05T00:00:00Z; BH1 files an on-time report attesting 1 screen / 0 refers, which matches the actuals (variance 0)."
            - "Clock at 2026-09-02T00:00:00Z when the period is closed."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: $.data.id }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_due_datetime: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { per_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-05T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-X1", guardian_contact_phone: "5550011" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { x1_id: $.data.id }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${x1_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "OAE", performed_at: "2026-08-05T04:00:00Z", left_ear_result: "PASS", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T20:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-31T12:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-X2", guardian_contact_phone: "5550012" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { x2_id: $.data.id }
            - call: "POST /infants/${x2_id}/discharge"
              payload: { discharge_datetime: "2026-08-31T20:00:00Z" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { bh_ver: $.data.version }
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh_id}", reporting_period_id: "${per_id}", attested_screened_count: 1, attested_refer_count: 0, expected_facility_version: "${bh_ver}" }
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /reporting-periods/${per_id}/close"
              payload: {}
              as: ProgramAdmin
            - call: "GET /facilities/${bh_id}/performance"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Facility.${bh_id}.performance_score == 45.00 (0.50*0.5000 + 0.30*0.0000 + 0.20*1.0 = 0.4500)"
            - "Facility.${bh_id}.encounter_basis_performance_score == 70.00 (0.50*1.0000 + 0.30*0.0000 + 0.20*1.0 = 0.7000)"
            - "GET /facilities/${bh_id}/performance returns cohort_screened_rate == 0.5000 and encounter_screened_rate == 1.0000 and followup_resolution_rate == 0.0000 and report_timeliness_rate == 1.0"
            - "The two variants differ by exactly 25.00 points on identical rows — the unscreened baby is in the birth cohort denominator but has no encounter inside the window"
            - "FacilityReport.${rep_id}.variance_case_count == 0 and FacilityReport.${rep_id}.assessed_penalty_points == 0"
            - "Facility.${bh_id}.reporting_compliance_status == COMPLIANT"

  - rule_id: combinatorial_formula
    instances:
      - name: performance_score_pinned_rounding_order_63_33_not_63_34
        grounds:
          - calculations.facility_performance_score
          - calculations.facility_performance_score.constants.RATE_DECIMALS
          - calculations.facility_performance_score.constants.SCORE_DECIMALS
          - entities.Facility.fields.performance_score
          - endpoints.GET_facilities_id_performance
        distinguishing_aspect: |
          Mode (b) — pinned rounding ORDER. Three component rates (0.6667, 0.3333, 1.0) are
          weighted and summed at full precision and rounded to cents exactly once, giving
          63.33. Rounding each weighted product to cents first (33.34 + 10.00 + 20.00) gives
          63.34, so an implementation that rounds early is detectably wrong by one cent.
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with audiologist A1."
            - "Three infants born at BH1 inside August: K1 (birth REFER, rescreened PASS -> episode RESOLVED_PASS), K2 (birth REFER, episode still PENDING_SCHEDULING), K3 (never screened, discharged unscreened -> INITIAL_SCREEN episode)."
            - "So cohort_numerator/denominator = 2/3 -> r1_cohort 0.6667; r2 = 1/3 -> 0.3333; encounter basis 2/2 -> 1.0000."
            - "BH1 files an on-time report attesting 2 screens / 2 refers, matching the actuals exactly, so r3 = 1.0."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "AUDIOLOGIST", full_name: "A1", region_code: "R1" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_due_datetime: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { per_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-02T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-K1", guardian_contact_phone: "5550101" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { k1_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${k1_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-02T05:00:00Z", left_ear_result: "REFER", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "GET /follow-up-episodes"
              payload: { infant_id: "${k1_id}", status: "PENDING_SCHEDULING" }
              as: ProgramAdmin
              captures: { ep_k1_id: "$.data[0].id" }
            - call: "POST /clinic-slots"
              payload: { facility_id: "${ac_id}", provider_id: "${a1_id}", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T10:00:00Z", slot_type: "RESCREEN", total_capacity: 1 }
              as: ProgramAdmin
              captures: { slot_k1_id: "$.data.id" }
            - call: "POST /rescreen-appointments"
              payload: { episode_id: "${ep_k1_id}", slot_id: "${slot_k1_id}" }
              as: ProgramAdmin
              captures: { appt_k1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:30:00Z" }
              as: ProgramAdmin
            - call: "POST /screening-encounters"
              payload: { infant_id: "${k1_id}", facility_id: "${ac_id}", performed_by_provider_id: "${a1_id}", encounter_type: "OUTPATIENT_RESCREEN", method: "AABR", performed_at: "2026-08-10T09:15:00Z", left_ear_result: "PASS", right_ear_result: "PASS", episode_id: "${ep_k1_id}", appointment_id: "${appt_k1_id}" }
              as: Audiologist
              as_user_id: "${a1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-11T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-K2", guardian_contact_phone: "5550102" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { k2_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${k2_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-11T05:00:00Z", left_ear_result: "REFER", right_ear_result: "REFER" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-12T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-K3", guardian_contact_phone: "5550103" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { k3_id: "$.data.id" }
            - call: "POST /infants/${k3_id}/discharge"
              payload: { discharge_datetime: "2026-08-12T12:00:00Z" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { bh_ver: "$.data.version" }
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh_id}", reporting_period_id: "${per_id}", attested_screened_count: 2, attested_refer_count: 2, expected_facility_version: "${bh_ver}" }
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { rep_id: "$.data.id" }
          trigger:
            - call: "POST /reporting-periods/${per_id}/close"
              payload: {}
              as: ProgramAdmin
            - call: "GET /facilities/${bh_id}/performance"
              payload: {}
              as: ProgramAuditor
          assert:
            - "GET /facilities/${bh_id}/performance returns cohort_screened_rate == 0.6667, encounter_screened_rate == 1.0000, followup_resolution_rate == 0.3333, report_timeliness_rate == 1.0"
            - "Facility.${bh_id}.performance_score == 63.33 — round2((0.50*0.6667 + 0.30*0.3333 + 0.20*1.0) * 100) = round2(63.3340)"
            - "Facility.${bh_id}.performance_score != 63.34, which is what per-product rounding (33.34 + 10.00 + 20.00) would produce"
            - "Facility.${bh_id}.encounter_basis_performance_score == 80.00 — round2(79.9990)"
            - "FacilityReport.${rep_id}.actual_screened_count == 2 and actual_refer_count == 2 and variance_case_count == 0 and assessed_penalty_points == 0"
            - "Facility.${ac_id}.penalty_points_balance == 6 — AC1 filed nothing, so base_points = 2*0 + 5 = 5, tier 0.25, round_half_up(6.25) = 6 — and Facility.${ac_id}.reporting_compliance_status == WATCH"

      - name: penalty_tier_keyed_on_pre_surcharge_total_assessed_6_balance_12
        grounds:
          - calculations.reporting_penalty_assessment
          - calculations.reporting_penalty_assessment.constants.SURCHARGE_TIER2_MAX
          - calculations.reporting_penalty_assessment.constants.SURCHARGE_TIER3_PCT
          - entities.Facility.fields.penalty_points_balance
          - entities.Facility.fields.reporting_compliance_status
          - endpoints.POST_facilities_id_penalty_adjustments
        distinguishing_aspect: |
          Mode (c) — pinned EVALUATION order of a circular-looking dependency: the surcharge
          tier is read off base + carryover (4 + 6 = 10 -> 50%), but the surcharge multiplies
          base only (4 * 1.5 = 6), and the new balance is carryover + assessed = 12. Keying the
          tier off base alone yields 4 and surcharging the carryover too yields 15, so the three
          orders are mutually distinguishable from one closing run.
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1 and one infant M born 2026-08-05T00:00:00Z who PASSES at birth admission (actual_screened_count 1, actual_refer_count 0)."
            - "A manual penalty adjustment of +6 points is posted first, so carryover_points == 6 and the facility sits at WATCH before the close."
            - "BH1 then files an on-time report attesting 3 screens / 0 refers -> variance_case_count 2 -> base_points 2*2 + 0 = 4."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /reporting-periods"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", submission_due_datetime: "2026-09-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { per_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-05T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-M", guardian_contact_phone: "5550201" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { m_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${m_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "OAE", performed_at: "2026-08-05T04:00:00Z", left_ear_result: "PASS", right_ear_result: "PASS" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "POST /facilities/${bh_id}/penalty-adjustments"
              payload: { points_delta: 6, reason: "prior-period audit finding carried forward" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: ProgramAdmin
            - call: "GET /facilities/${bh_id}"
              payload: {}
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { bh_ver: "$.data.version" }
            - call: "POST /facility-reports"
              payload: { facility_id: "${bh_id}", reporting_period_id: "${per_id}", attested_screened_count: 3, attested_refer_count: 0, expected_facility_version: "${bh_ver}" }
              as: FacilityAdmin
              as_user_id: "${bh_id}"
              captures: { rep_id: "$.data.id" }
          trigger:
