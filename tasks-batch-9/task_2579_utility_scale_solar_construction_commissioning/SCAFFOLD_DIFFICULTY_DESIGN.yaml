          A different entity pair with a different direction of dependency:
          Pile -> GradingArea. Civil turnover of the pad, an entity two levels up
          the hierarchy from the pile, gates a mechanical write; the very same
          drive-result payload is refused with 409 and then accepted, and the
          acceptance is what unlocks the block's mechanical rollup.
        test_recipe:
          setup:
            - "One grading area cleared and graded (status GRADED) but not yet accepted by the owner's engineer"
            - "One block on that area with planned_pile_count 1 and planned_string_count 1, and one PLANNED pile with design_embedment_mm 3000"
          setup_api_calls:
