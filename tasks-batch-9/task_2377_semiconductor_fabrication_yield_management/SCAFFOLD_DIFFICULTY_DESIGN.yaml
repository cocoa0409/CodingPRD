  # =====================================================================
  # R4 — transitive_cascade
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: particle_reading_cascades_five_deep_to_lot_qual_hold
        grounds:
          - state_machines.Excursion.OPEN_to_CONTAINED
          - state_machines.Equipment.PRODUCTIVE_to_DOWN
          - state_machines.Chamber.QUALIFIED_to_DISQUALIFIED
          - state_machines.StepRun.OPEN_to_ABORTED
          - state_machines.Lot.NONE_to_QUAL_HOLD
          - calculations.excursion_severity_score
          - calculations.equipment_capacity_hours_ledger
        distinguishing_aspect: |
          Depth-5 cascade triggered by POST /fab/chambers/{id}/particle-readings: Chamber particle
          reading -> PARTICLE Excursion created and auto-CONTAINED at EQUIPMENT scope (100.0 >=
          PARTICLE_TOOL_DOWN_MULT x 50.0) -> Equipment PRODUCTIVE -> DOWN -> that tool's OPEN
          StepRun -> ABORTED with the full 3.00 h reservation credited back -> the run's Lot
          NONE -> QUAL_HOLD. Its trigger endpoint differs from the ECN-implement cascade instance.
        test_recipe:
          setup:
            - "FLOW-A RELEASED (seq 10 LITHO 2.0h, seq 20 ETCH 3.0h metrology-required, seq 30 LITHO 2.0h) with LITHO-1/CH_L1 and ETCH-1/CH_E1 QUALIFIED at 2026-08-01T00:00:00Z; CH_E1 particle_limit 50.0, particle_count 0.0."
            - "Operator OP-001 certified for LITHO/ETCH/CMP and GOWNED; PLAN-A COMMITTED."
            - "LOT-001 (3 wafers, STANDARD) released, step seq 10 tracked out, and an OPEN step-seq-20 run on CH_E1, so ETCH-1 is PRODUCTIVE with available_capacity_hours 717.00, hours_since_pm 0.0 and CH_E1 OCCUPIED."
            - "No measurement has been recorded on the open run, and no excursion exists."
            - "The logical clock is untouched and reads 2026-08-01T00:00:00Z."
