        distinguishing_aspect: |
          Rounding happens BEFORE comparison, so a ratio that is mathematically below the block
          threshold can still fail: 0.99998 / 0.8000 == 1.249975 rounds half-up at 4 decimals to
          exactly 1.2500 and trips FAIL_SKEW, while 0.99992 / 0.8000 == 1.2499 exactly stays WARN.
