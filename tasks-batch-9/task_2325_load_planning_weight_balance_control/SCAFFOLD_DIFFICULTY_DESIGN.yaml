            - "GET /flights?aircraft_id=${ac1} returns total_count 1"

      - name: audit_final_basis_requires_accepted_sheet
        entity_pair: "LoadAudit depends on LoadSheet"
        dependency: "POST /load-audits with basis == FINAL_BASIS is refused unless a LoadSheet in ACCEPTED or AMENDED status exists on the flight's highest-revision_no plan; DOCUMENTED_BASIS has no such requirement"
        grounds:
          - validations.priority_20
          - calculations.calculate_audit_discrepancy.variants.final_basis
          - state_machines.LoadSheet.transitions.ISSUED_to_ACCEPTED
        distinguishing_aspect: |
          A third entity pair, and the dependency is conditional on a field of the
          request itself rather than on the caller's role or the parent's status:
          the same endpoint with the same actuals is refused for FINAL_BASIS and
          accepted for DOCUMENTED_BASIS against the identical plan. The two
          successful audits then disagree on the cargo figure, because
          documented_cargo_kg counts only CargoItem rows in LOADED status - and the
          consignment only reaches LOADED as a cascade of the very sheet
          acceptance that unlocks FINAL_BASIS. Severity therefore moves from MINOR
          to NONE without a single kilogram of actual weight changing.
        test_recipe:
          setup:
            - "Aircraft HB-AAA with cabin zone OC and holds H1, H4; runway LSGG/04 with the [15, 30) band; STANDARD program; flight at 22 C, 6 kt, DRY."
            - "Plan: OC 4650.00, H1 bags 1450.00, one 400.00 kg GENERAL consignment assigned to H4 and auto-accepted -> base_payload_kg 6500.00, underload_kg 13680.00."
            - "The plan is computed, the flight is therefore LOAD_CONTROLLED, and sheet 1 is issued by lc-01 but not yet presented to the captain."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "OC", kind: "CABIN_ZONE", arm_m: 22.900, max_weight_kg: 8000, running_load_limit_kg_per_m: 2000, length_m: 8.0, seat_capacity: 60 }
              as: LoadControlAdmin
              captures: { oc1: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "H1", kind: "HOLD", arm_m: 9.200, max_weight_kg: 4500, running_load_limit_kg_per_m: 900, length_m: 5.0, seat_capacity: 0 }
              as: LoadControlAdmin
              captures: { h11: $.data.id }
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "H4", kind: "HOLD", arm_m: 24.600, max_weight_kg: 5000, running_load_limit_kg_per_m: 900, length_m: 6.0, seat_capacity: 0 }
              as: LoadControlAdmin
              captures: { h41: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw1: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw1}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp_std: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1710", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id, f1_ver: $.data.version }
            - call: "POST /load-plans"
              payload: { flight_id: "${f1}", expected_flight_version: "${f1_ver}" }
              as: LoadController
              captures: { lp1: $.data.id }
            - call: "POST /pax-lines"
              payload: { load_plan_id: "${lp1}", compartment_id: "${oc1}", male_count: 50, female_count: 0, child_count: 6, infant_count: 4 }
              as: LoadController
            - call: "POST /bag-allocations"
              payload: { load_plan_id: "${lp1}", compartment_id: "${h11}", bag_count: 112, bag_weight_kg: 1450 }
              as: LoadController
            - call: "POST /cargo-items"
              payload: { flight_id: "${f1}", awb_number: "724-12350001", item_kind: "GENERAL", weight_kg: 400, length_m: 0.8, is_dangerous_goods: false }
              as: RampAgent
              captures: { cg1: $.data.id }
            - call: "POST /cargo-items/${cg1}/assign"
              payload: { assigned_compartment_id: "${h41}" }
              as: RampAgent
            - call: "POST /load-plans/${lp1}/compute"
              payload: {}
              as: LoadController
              captures: { lp1_ver: $.data.version }
            - call: "POST /load-sheets"
              payload: { load_plan_id: "${lp1}", expected_load_plan_version: "${lp1_ver}" }
              as: LoadController
              as_user_id: "lc-01"
              captures: { sh1: $.data.id }
          trigger:
            - call: "POST /load-audits"
              payload: { flight_id: "${f1}", basis: "FINAL_BASIS", actual_pax_weight_kg: 4650, actual_bag_weight_kg: 1450, actual_cargo_weight_kg: 400 }
              as: AuditInspector
              as_user_id: "ai-01"
            - call: "POST /load-audits"
              payload: { flight_id: "${f1}", basis: "DOCUMENTED_BASIS", actual_pax_weight_kg: 4650, actual_bag_weight_kg: 1450, actual_cargo_weight_kg: 400 }
              as: AuditInspector
              as_user_id: "ai-01"
              captures: { au1: $.data.id }
            - call: "POST /load-sheets/${sh1}/accept"
              payload: {}
              as: Captain
              as_user_id: "cpt-01"
            - call: "POST /load-audits"
              payload: { flight_id: "${f1}", basis: "FINAL_BASIS", actual_pax_weight_kg: 4650, actual_bag_weight_kg: 1450, actual_cargo_weight_kg: 400 }
              as: AuditInspector
              as_user_id: "ai-01"
              captures: { au2: $.data.id }
          assert:
            - "before the triggers: Flight.${f1}.status == LOAD_CONTROLLED, LoadSheet.${sh1}.status == ISSUED, CargoItem.${cg1}.status == ACCEPTED"
            - "the first FINAL_BASIS call returns 409 with error_id ERR_NO_ACCEPTED_SHEET"
            - "the DOCUMENTED_BASIS call returns 201: LoadAudit.${au1}.pax_delta_kg == 0.00, bag_delta_kg == 0.00, cargo_delta_kg == 400.00"
            - "LoadAudit.${au1}.total_absolute_discrepancy_kg == 400.00, severity == MINOR, status == OPEN, basis == DOCUMENTED_BASIS"
            - "after the acceptance: LoadSheet.${sh1}.status == ACCEPTED, Flight.${f1}.load_release_state == RELEASED, CargoItem.${cg1}.status == LOADED"
            - "the second FINAL_BASIS call returns 201: LoadAudit.${au2}.pax_delta_kg == 0.00, bag_delta_kg == 0.00, cargo_delta_kg == 0.00"
            - "LoadAudit.${au2}.total_absolute_discrepancy_kg == 0.00, severity == NONE, basis == FINAL_BASIS"
            - "GET /flights/${f1}/load-audits returns total_count 2"
            - "LoadAudit.${au1}.total_absolute_discrepancy_kg == 400.00 (the earlier audit is not retro-corrected by the cascade)"

  # ==========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: aircraft_occupancy_closed_interval_touching_collides
        resource_entity: Aircraft
        interval_semantics: "CLOSED [off_block, on_block + 45 min turnaround buffer], inclusive at both ends, capacity 1"
        grounds:
          - validations.priority_32
          - entities.Flight.fields.scheduled_off_block_utc
          - entities.Flight.fields.scheduled_on_block_utc
        distinguishing_aspect: |
          A closed interval with a trailing buffer and a capacity of exactly one:
          two flights on the same airframe collide when they merely touch at an
          endpoint, so a departure at 13:15:00 - precisely 45 minutes after the
          preceding flight's 12:30 on-block - is refused, and 13:16:00 is admitted.
          The rule is then chained on the newly created flight to show the buffer
          moves with it: 16:30:00 (its own on-block 15:45 plus 45) collides and
          16:31:00 does not. The runway keeps two slots per window throughout, so
          nothing here can be confused with the slot rule.
        test_recipe:
          setup:
            - "One B738 airframe HB-AAA; runway LSGG/04 with slot_capacity_per_window 2 and the [15, 30) band; STANDARD program."
            - "Flight LX1720 on HB-AAA, off-block 10:00, on-block 12:30 -> occupancy [10:00:00, 13:15:00], status PLANNING."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw1: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw1}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp_std: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1720", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { flight_number: "LX1722", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T13:15:00Z", scheduled_on_block_utc: "2026-08-15T15:45:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
            - call: "POST /flights"
              payload: { flight_number: "LX1724", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T13:16:00Z", scheduled_on_block_utc: "2026-08-15T15:45:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f2: $.data.id }
            - call: "POST /flights"
              payload: { flight_number: "LX1726", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T16:30:00Z", scheduled_on_block_utc: "2026-08-15T18:00:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
            - call: "POST /flights"
              payload: { flight_number: "LX1728", aircraft_id: "${ac1}", departure_runway_id: "${rw1}", weight_program_id: "${wp_std}", scheduled_off_block_utc: "2026-08-15T16:31:00Z", scheduled_on_block_utc: "2026-08-15T18:00:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f4: $.data.id }
          assert:
            - "the 13:15:00 call returns 409 with error_id ERR_AIRCRAFT_OCCUPANCY_CONFLICT (the intervals touch at exactly one instant)"
            - "the 13:16:00 call returns 201 and Flight.${f2}.status == PLANNING"
            - "the 16:30:00 call returns 409 with error_id ERR_AIRCRAFT_OCCUPANCY_CONFLICT (15:45 + 45 min = 16:30, the buffer of the flight just created)"
            - "the 16:31:00 call returns 201 and Flight.${f4}.status == PLANNING"
            - "GET /flights?aircraft_id=${ac1} returns total_count 3"
            - "Flight.${f4}.allowed_payload_kg == 20180.00 and Flight.${f4}.limiting_factor == MZFW"

      - name: runway_slot_half_open_window_aggregate_capacity
        resource_entity: Runway
        interval_semantics: "HALF-OPEN 10-minute departure window [W, W + 10 min) floored from the top of the hour, aggregate capacity Runway.slot_capacity_per_window across all airframes"
        grounds:
          - validations.priority_33
          - entities.Runway.fields.slot_capacity_per_window
        distinguishing_aspect: |
          Opposite interval semantics to the aircraft rule and a different resource
          entity: the window is half-open, so 10:09:59 still belongs to the
          [10:00, 10:10) window while 10:10:00 already belongs to the next one, and
          the capacity is an aggregate count of 2 over DIFFERENT airframes rather
          than a mutual exclusion on one. Cancelling an earlier flight releases its
          slot, which proves the count filters on status rather than on row
          existence - and the released 10:09:59 instant is then accepted, closing
          the loop on the half-open boundary.
