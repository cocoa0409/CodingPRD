              payload: { funding_cycle_id: "${cyc}", homeowner_name: "Denied App", date_of_birth: "1990-01-01", household_size: 1, household_income_cents: 1000000, is_veteran: false, has_disability: false, ownership_doc_provided: true, occupancy_doc_provided: true, address: "38 Deny St" }
              as: Anonymous
              captures: { app: $.data.id }
          trigger:
            - call: "PATCH /rebuild/applications/${app}"
