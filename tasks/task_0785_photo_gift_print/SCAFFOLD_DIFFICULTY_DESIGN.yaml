              as: CatalogAdmin
              captures: { tmpl: $.data.id }
            - call: "POST /projects"
              payload: { customer_id: "${cust}", template_id: "${tmpl}", title: "A" }
              as: Customer
              as_user_id: "${cust}"
              captures: { projA: $.data.id }
            - call: "POST /projects/${projA}/photos"
              payload: { filename: "a.jpg", width_px: 3000, height_px: 2000, dpi: 300 }
