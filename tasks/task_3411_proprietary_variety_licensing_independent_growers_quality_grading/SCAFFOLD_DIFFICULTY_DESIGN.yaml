              as: SettlementOfficer
            - &k_stmt_g1_post
              call: "GET /licensing/settlement-statements"
              payload: { pool_period_id: "${pool_id}", grower_id: "${g1_id}" }
              as: SettlementOfficer
            - &k_stmt_g2_post
              call: "GET /licensing/settlement-statements"
              payload: { pool_period_id: "${pool_id}", grower_id: "${g2_id}" }
              as: SettlementOfficer
              captures: { s_g2: "$.data[0].id" }
