            - { call: "GET /grants/recommendation-slots", payload: { panel_id: "${tpan}" }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/panels/${tpan}/slate", payload: { ranked_application_ids: ["${appA}", "${appB}"], expected_panel_version: "${tpan_v}" }, as: Panelist, as_user_id: "${tpl1}" }
            - { call: "POST /grants/panels/${tpan}/slate", payload: { ranked_application_ids: ["${appA}", "${appB}"], expected_panel_version: "${tpan_v}" }, as: Panelist, as_user_id: "${tpl1}" }
