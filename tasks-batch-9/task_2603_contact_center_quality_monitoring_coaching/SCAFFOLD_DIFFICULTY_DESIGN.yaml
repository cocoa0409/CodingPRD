# ---------------------------------------------------------------------------
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2603 -- Contact Center Quality Monitoring & Coaching
#
# Nine rule_id blocks from SKILL.md 0.5, two differentiated instances each.
# Every numeric literal in an `assert:` was produced by executing the matching
# SCAFFOLD.yaml 1.3 formula in Python, not estimated.
#
# Reference form F1 (used by most instances), auto_fail_policy
# COMPLIANCE_SECTION_ZERO, min_compliance_item_score 3:
#   DISCLOSE  30.00  max 5  compliance_critical + auto_fail_on_violation
#   GREET     20.00  max 5
#   RESOLVE   35.00  max 5
#   SURVEY    15.00  max 5  allows_not_applicable
# ---------------------------------------------------------------------------
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_evaluation_na_renormalized_vs_fixed_denominator
        grounds:
          - calculations.evaluation_weighted_score
          - entities.Evaluation.fields.weighted_score
          - entities.Evaluation.fields.raw_weighted_score
          - entities.FormBehavior.fields.allows_not_applicable
          - state_machines.Evaluation.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          This instance exercises the two variants of evaluation_weighted_score on a single
          Evaluation row: RENORMALIZED drops the not_applicable SURVEY behavior from numerator
          AND denominator (85.00 applicable weight -> 78.82) while FIXED_DENOMINATOR keeps the
          denominator at 100.00 and pays SURVEY full credit (82.00); the divergence is 3.18
          points on one submit call.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T09:00:00Z"
            - "ACTIVE form F1 with the four behaviors above, guidance_version 1"
            - "agent A-1001, evaluator Eve with max_open_assignments 3"
            - "VOICE interaction I1 on 2026-08-03 10:00->10:10 (600s), csat 4, required_disclosures [RECORDING], consent VERIFIED with RECORDING captured"
            - "OPEN plan over 2026-08-01..2026-08-31, per_agent_target_volume 4, source_mix 50/25/25 (RANDOM cap 2)"
            - "selection sel1 RANDOM on I1, assigned to Eve for 09:00-11:00, DRAFT evaluation e1 opened"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /evaluation-forms"
              payload: { name: "Care Quality", version_label: "2026.08", auto_fail_policy: "COMPLIANCE_SECTION_ZERO", min_compliance_item_score: 3, behaviors: [ { code: "DISCLOSE", label: "Required disclosures", weight_pct: 30.00, compliance_critical: true, auto_fail_on_violation: true, max_points: 5, allows_not_applicable: false, guidance_text: "State the recording disclosure verbatim." }, { code: "GREET", label: "Branded greeting", weight_pct: 20.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Use the branded greeting." }, { code: "RESOLVE", label: "Issue resolution", weight_pct: 35.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Resolve the issue or set a next step." }, { code: "SURVEY", label: "Survey invitation", weight_pct: 15.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: true, guidance_text: "Invite the customer to the survey when eligible." } ] }
              as: QualityManager
              captures: { f1: $.data.id }
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Eve Evaluator", max_open_assignments: 3 }
              as: QualityManager
              captures: { ev1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T10:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 4, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id }
            - call: "POST /interactions/${i1}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "POST /sample-plans"
              payload: { form_id: "${f1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", per_agent_target_volume: 4, source_mix: { random_pct: 50, targeted_pct: 25, customer_flagged_pct: 25 } }
              as: QualityManager
              captures: { pl1: $.data.id }
            - call: "POST /sample-plans/${pl1}/open"
              payload: {}
              as: QualityManager
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i1}", source: "RANDOM" }
              as: QualityManager
              captures: { sel1: $.data.id }
            - call: "POST /sample-selections/${sel1}/assign"
              payload: { assigned_evaluator_id: "${ev1}", review_window_start: "2026-08-05T09:00:00Z", review_window_end: "2026-08-05T11:00:00Z" }
              as: QualityManager
            - call: "POST /evaluations"
              payload: { selection_id: "${sel1}" }
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /evaluations/${e1}/submit"
              payload: { item_scores: { DISCLOSE: 5, GREET: 4, RESOLVE: 3, SURVEY: "NA" } }
              as: QualityEvaluator
              as_user_id: "${ev1}"
          assert:
            - "Evaluation.${e1}.weighted_score == 78.82"
            - "Evaluation.${e1}.raw_weighted_score == 82.00"
            - "Evaluation.${e1}.weighted_score != Evaluation.${e1}.raw_weighted_score (divergence 3.18 caused solely by SURVEY = NA)"
            - "Evaluation.${e1}.auto_fail_triggered == false"
            - "Evaluation.${e1}.compliance_result == PASS"
            - "Evaluation.${e1}.review_status == SUBMITTED and Evaluation.${e1}.feedback_status == PENDING"
            - "SampleSelection.${sel1}.status == EVALUATED"
      - name: dual_variant_agent_index_rolling_vs_duration_weighted
        grounds:
          - calculations.agent_quality_index
          - entities.Agent.fields.quality_index_rolling
          - entities.Agent.fields.quality_index_period
          - entities.Interaction.fields.duration_seconds
          - endpoints[GET /agents/{id}/quality-summary]
        distinguishing_aspect: |
          Different entity domain from the first instance -- the variant pair lives on Agent, not
          Evaluation, and the axis is weighting rather than denominator: over the same two
          evaluations (78.82 on a 600s contact, 52.00 on a 1800s contact) ROLLING_4 reads the
          unweighted mean 65.41 while PERIOD_DURATION_WEIGHTED reads 58.71 because the long poor
          contact dominates the duration weighting.
        test_recipe:
          setup:
            - "same F1 / agent / evaluator / plan prelude as the first instance"
            - "interaction I1 VOICE 600s csat 4 consent VERIFIED, evaluated 78.82 (SURVEY = NA)"
            - "interaction I2 VOICE 2026-08-04 14:00->14:30 (1800s), csat 2, repeat_contact_within_72h true, consent VERIFIED, evaluated 52.00 (DISCLOSE = 0 auto-fail under COMPLIANCE_SECTION_ZERO)"
            - "both interactions sit inside the OPEN plan period, so both feed the period variant"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /evaluation-forms"
              payload: { name: "Care Quality", version_label: "2026.08", auto_fail_policy: "COMPLIANCE_SECTION_ZERO", min_compliance_item_score: 3, behaviors: [ { code: "DISCLOSE", label: "Required disclosures", weight_pct: 30.00, compliance_critical: true, auto_fail_on_violation: true, max_points: 5, allows_not_applicable: false, guidance_text: "State the recording disclosure verbatim." }, { code: "GREET", label: "Branded greeting", weight_pct: 20.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Use the branded greeting." }, { code: "RESOLVE", label: "Issue resolution", weight_pct: 35.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Resolve the issue or set a next step." }, { code: "SURVEY", label: "Survey invitation", weight_pct: 15.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: true, guidance_text: "Invite the customer to the survey when eligible." } ] }
              as: QualityManager
              captures: { f1: $.data.id }
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Eve Evaluator", max_open_assignments: 3 }
              as: QualityManager
              captures: { ev1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T10:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 4, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id }
            - call: "POST /interactions/${i1}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-04T14:00:00Z", ended_at: "2026-08-04T14:30:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 2, repeat_contact_within_72h: true }
              as: QualityManager
              captures: { i2: $.data.id }
            - call: "POST /interactions/${i2}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "POST /sample-plans"
              payload: { form_id: "${f1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", per_agent_target_volume: 4, source_mix: { random_pct: 50, targeted_pct: 25, customer_flagged_pct: 25 } }
              as: QualityManager
              captures: { pl1: $.data.id }
            - call: "POST /sample-plans/${pl1}/open"
              payload: {}
              as: QualityManager
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i1}", source: "RANDOM" }
              as: QualityManager
              captures: { sel1: $.data.id }
            - call: "POST /sample-selections/${sel1}/assign"
              payload: { assigned_evaluator_id: "${ev1}", review_window_start: "2026-08-05T09:00:00Z", review_window_end: "2026-08-05T11:00:00Z" }
              as: QualityManager
            - call: "POST /evaluations"
              payload: { selection_id: "${sel1}" }
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e1: $.data.id }
            - call: "POST /evaluations/${e1}/submit"
              payload: { item_scores: { DISCLOSE: 5, GREET: 4, RESOLVE: 3, SURVEY: "NA" } }
              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i2}", source: "RANDOM" }
              as: QualityManager
              captures: { sel2: $.data.id }
            - call: "POST /sample-selections/${sel2}/assign"
              payload: { assigned_evaluator_id: "${ev1}", review_window_start: "2026-08-05T11:00:00Z", review_window_end: "2026-08-05T13:00:00Z" }
              as: QualityManager
            - call: "POST /evaluations"
              payload: { selection_id: "${sel2}" }
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e2: $.data.id }
          trigger:
            - call: "POST /evaluations/${e2}/submit"
              payload: { item_scores: { DISCLOSE: 0, GREET: 4, RESOLVE: 3, SURVEY: 5 } }
              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "GET /agents/${ag1}/quality-summary"
              payload: {}
              as: QualityManager
          assert:
            - "Evaluation.${e2}.weighted_score == 52.00 and Evaluation.${e2}.auto_fail_triggered == true"
            - "Agent.${ag1}.quality_index_rolling == 65.41"
            - "Agent.${ag1}.quality_index_period == 58.71"
            - "GET /agents/${ag1}/quality-summary -> data.quality_index_rolling == 65.41 and data.quality_index_period == 58.71 and data.evaluations_considered == 2"
            - "quality_index_rolling != quality_index_period (65.41 vs 58.71) on identical evaluation data"

  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_rounding_order_per_item_then_sum_thirds_form
        grounds:
          - calculations.evaluation_weighted_score
          - entities.FormBehavior.fields.max_points
          - entities.FormBehavior.fields.weight_pct
          - entities.Evaluation.fields.weighted_score
        distinguishing_aspect: |
          Mode (b) rounding-order sensitivity: form F2 has five 20.00-weight behaviors scored out
          of 3, so each contribution is the non-terminating 6.666..., and the scaffold's PINNED
          order (round each item to 2dp, then sum) yields 33.35 while the natural
          sum-then-round order yields 33.33 -- a 0.02 divergence produced purely by rounding
          placement, with no threshold or tier involved.
        test_recipe:
          setup:
            - "logical clock at 2026-08-05T09:00:00Z"
            - "ACTIVE form F2 named Chat Quality: EMPATHY, VERIFY, DOCUMENT, OFFER, CLOSE, each weight_pct 20.00 and max_points 3; VERIFY is compliance_critical and auto_fail_on_violation; min_compliance_item_score 1"
            - "agent A-2002, evaluator Cal, CHAT interaction J1 on 2026-08-04 09:00->09:20 consent VERIFIED (no required disclosures)"
            - "OPEN plan over 2026-08-01..2026-08-31 for F2, per_agent_target_volume 2, source_mix 100/0/0 (RANDOM cap 2)"
            - "selection assigned to Cal and DRAFT evaluation opened"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /evaluation-forms"
              payload: { name: "Chat Quality", version_label: "2026.08-F2", auto_fail_policy: "COMPLIANCE_SECTION_ZERO", min_compliance_item_score: 1, behaviors: [ { code: "EMPATHY", label: "Empathy statement", weight_pct: 20.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 3, allows_not_applicable: false, guidance_text: "Acknowledge the customer's situation." }, { code: "VERIFY", label: "Identity verification", weight_pct: 20.00, compliance_critical: true, auto_fail_on_violation: true, max_points: 3, allows_not_applicable: false, guidance_text: "Verify two identity elements." }, { code: "DOCUMENT", label: "Case documentation", weight_pct: 20.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 3, allows_not_applicable: false, guidance_text: "Log the disposition code." }, { code: "OFFER", label: "Next best action", weight_pct: 20.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 3, allows_not_applicable: false, guidance_text: "Offer the relevant self-service option." }, { code: "CLOSE", label: "Closing", weight_pct: 20.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 3, allows_not_applicable: false, guidance_text: "Confirm resolution before closing." } ] }
              as: QualityManager
              captures: { f2: $.data.id }
            - call: "POST /evaluation-forms/${f2}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-2002", full_name: "Ben Agent", team_code: "TEAM-B", hire_date: "2025-06-01T00:00:00Z" }
              as: QualityManager
              captures: { ag2: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Cal Evaluator", max_open_assignments: 3 }
              as: QualityManager
              captures: { ev2: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag2}", channel: "CHAT", started_at: "2026-08-04T09:00:00Z", ended_at: "2026-08-04T09:20:00Z", required_disclosures: [], customer_flagged: false, csat_score: 3, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { j1: $.data.id }
            - call: "POST /interactions/${j1}/consent-review"
              payload: { consent_outcome: "NOT_REQUIRED", captured_disclosures: [] }
              as: ComplianceAuditor
            - call: "POST /sample-plans"
              payload: { form_id: "${f2}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", per_agent_target_volume: 2, source_mix: { random_pct: 100, targeted_pct: 0, customer_flagged_pct: 0 } }
              as: QualityManager
              captures: { pl2: $.data.id }
            - call: "POST /sample-plans/${pl2}/open"
              payload: {}
              as: QualityManager
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl2}", interaction_id: "${j1}", source: "RANDOM" }
              as: QualityManager
              captures: { sel3: $.data.id }
            - call: "POST /sample-selections/${sel3}/assign"
              payload: { assigned_evaluator_id: "${ev2}", review_window_start: "2026-08-05T09:00:00Z", review_window_end: "2026-08-05T11:00:00Z" }
              as: QualityManager
            - call: "POST /evaluations"
              payload: { selection_id: "${sel3}" }
              as: QualityEvaluator
              as_user_id: "${ev2}"
              captures: { e3: $.data.id }
          trigger:
            - call: "POST /evaluations/${e3}/submit"
              payload: { item_scores: { EMPATHY: 1, VERIFY: 1, DOCUMENT: 1, OFFER: 1, CLOSE: 1 } }
              as: QualityEvaluator
              as_user_id: "${ev2}"
          assert:
            - "Evaluation.${e3}.weighted_score == 33.35"
            - "Evaluation.${e3}.raw_weighted_score == 33.35"
            - "Evaluation.${e3}.weighted_score != 33.33 (the value a sum-then-round implementation produces)"
            - "Evaluation.${e3}.auto_fail_triggered == false and Evaluation.${e3}.compliance_result == PASS"
      - name: combinatorial_pinned_tier_before_multiplier_coaching_sizing
        grounds:
          - calculations.coaching_requirement
          - calculations.agent_quality_index
          - entities.CoachingPlan.fields.required_session_count
          - entities.CoachingPlan.fields.escalation_tier
          - entities.CoachingPlan.fields.due_at
          - concurrency_rules[coaching-plan-create-stale-agent]
        distinguishing_aspect: |
          Mode (c) pinned evaluation order, structurally different from the rounding-order
          instance: the tier is selected on the RAW deficit 11.00 (T2) and the 1.25 multiplier is
          applied afterwards, so required_session_count is ceil(13.75 / 2.00) = 7; an
          implementation that re-selected the tier from the adjusted deficit 13.75 would land in
          T3 and compute ceil(13.75 / 1.50) = 10 clamped to 8.
        test_recipe:
          setup:
            - "the full two-evaluation prelude of dual_variant_agent_index_rolling_vs_duration_weighted: agent A-1001 with quality_index_rolling 65.41 and open_compliance_findings 1 after the 52.00 auto-fail evaluation"
            - "logical clock still at 2026-08-05T09:00:00Z"
            - "the agent's current version read back immediately before the OCC-guarded create"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: QualityManager
            - call: "POST /evaluation-forms"
              payload: { name: "Care Quality", version_label: "2026.08", auto_fail_policy: "COMPLIANCE_SECTION_ZERO", min_compliance_item_score: 3, behaviors: [ { code: "DISCLOSE", label: "Required disclosures", weight_pct: 30.00, compliance_critical: true, auto_fail_on_violation: true, max_points: 5, allows_not_applicable: false, guidance_text: "State the recording disclosure verbatim." }, { code: "GREET", label: "Branded greeting", weight_pct: 20.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Use the branded greeting." }, { code: "RESOLVE", label: "Issue resolution", weight_pct: 35.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: false, guidance_text: "Resolve the issue or set a next step." }, { code: "SURVEY", label: "Survey invitation", weight_pct: 15.00, compliance_critical: false, auto_fail_on_violation: false, max_points: 5, allows_not_applicable: true, guidance_text: "Invite the customer to the survey when eligible." } ] }
              as: QualityManager
              captures: { f1: $.data.id }
            - call: "POST /evaluation-forms/${f1}/activate"
              payload: {}
              as: QualityManager
            - call: "POST /agents"
              payload: { external_ref: "A-1001", full_name: "Ada Agent", team_code: "TEAM-A", hire_date: "2025-03-01T00:00:00Z" }
              as: QualityManager
              captures: { ag1: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Eve Evaluator", max_open_assignments: 3 }
              as: QualityManager
              captures: { ev1: $.data.id }
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-03T10:00:00Z", ended_at: "2026-08-03T10:10:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 4, repeat_contact_within_72h: false }
              as: QualityManager
              captures: { i1: $.data.id }
            - call: "POST /interactions/${i1}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "POST /interactions"
              payload: { agent_id: "${ag1}", channel: "VOICE", started_at: "2026-08-04T14:00:00Z", ended_at: "2026-08-04T14:30:00Z", required_disclosures: ["RECORDING"], customer_flagged: false, csat_score: 2, repeat_contact_within_72h: true }
              as: QualityManager
              captures: { i2: $.data.id }
            - call: "POST /interactions/${i2}/consent-review"
              payload: { consent_outcome: "VERIFIED", captured_disclosures: ["RECORDING"] }
              as: ComplianceAuditor
            - call: "POST /sample-plans"
              payload: { form_id: "${f1}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-31T23:59:59Z", per_agent_target_volume: 4, source_mix: { random_pct: 50, targeted_pct: 25, customer_flagged_pct: 25 } }
              as: QualityManager
              captures: { pl1: $.data.id }
            - call: "POST /sample-plans/${pl1}/open"
              payload: {}
              as: QualityManager
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i1}", source: "RANDOM" }
              as: QualityManager
              captures: { sel1: $.data.id }
            - call: "POST /sample-selections/${sel1}/assign"
              payload: { assigned_evaluator_id: "${ev1}", review_window_start: "2026-08-05T09:00:00Z", review_window_end: "2026-08-05T11:00:00Z" }
              as: QualityManager
            - call: "POST /evaluations"
              payload: { selection_id: "${sel1}" }
              as: QualityEvaluator
              as_user_id: "${ev1}"
              captures: { e1: $.data.id }
            - call: "POST /evaluations/${e1}/submit"
              payload: { item_scores: { DISCLOSE: 5, GREET: 4, RESOLVE: 3, SURVEY: "NA" } }
              as: QualityEvaluator
              as_user_id: "${ev1}"
            - call: "POST /sample-selections"
              payload: { plan_id: "${pl1}", interaction_id: "${i2}", source: "RANDOM" }
              as: QualityManager
