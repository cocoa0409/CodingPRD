scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_booking_returns_201_with_computed_quote
        claim_type: Creation
        grounds:
          - entities.Booking.fields.quote_subtotal
          - entities.Booking.fields.deposit_due
          - entities.Booking.fields.travel_fee
          - calculations.estimate_quote
          - calculations.travel_fee
        distinguishing_aspect: "POST /bookings with all required fields returns 201 and a DRAFT/UNPAID Booking with travel_fee 22.50, quote_subtotal 1500.00, deposit_due 375.00 computed."
        test_recipe:
          setup:
            - "Premium package on a booth model; one customer registered. Booking 6h, lead 0, venue 40 miles, no add-ons."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Premium 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-13T00:00:00Z", venue_distance_miles: 40, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Booking.${bk_id}.schedule_status == DRAFT"
            - "Booking.${bk_id}.payment_status == UNPAID"
            - "Booking.${bk_id}.travel_fee == 22.50"
            - "Booking.${bk_id}.quote_subtotal == 1500.00"
            - "Booking.${bk_id}.deposit_due == 375.00"

      - name: get_booking_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /bookings/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB; OperationsManager queries a random UUID."
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_package_missing_required_field_rejected
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=20]"]
        distinguishing_aspect: "POST /packages omitting required base_price returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "A booth model exists; package create omits base_price."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "No Price", included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: create_booth_default_status_available
        claim_type: Defaults
        grounds: [entities.Booth.fields.status]
        distinguishing_aspect: "POST /booths omitting status defaults Booth.status to AVAILABLE."
        test_recipe:
          setup:
            - "A booth model exists; booth created without status."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Booth.${booth_id}.status == AVAILABLE"

      - name: booking_booth_id_computed_null_while_draft
        claim_type: Computed Fields
        grounds: [entities.Booking.fields.booth_id, entities.Booking.fields.schedule_status]
        distinguishing_aspect: "Booking.booth_id is computed (assigned at confirm); a freshly created DRAFT booking has booth_id null."
        test_recipe:
          setup:
            - "Premium package; a booth exists; booking created."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.booth_id == null"
            - "Booking.${bk_id}.version == 1"

      - name: create_booth_model_invalid_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.BoothModel.fields.booth_type, "errors[ERR_INVALID_REQUEST]", "validations[priority=20]"]
        distinguishing_aspect: "POST /booth-models with booth_type not in {OPEN_AIR,ENCLOSED,MIRROR,ROAMING_360} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Booth model create with a bogus booth_type."
          setup_api_calls: []
          trigger:
            - call: "POST /booth-models"
              payload: { name: "Bad", booth_type: "HOLOGRAM", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: booking_event_end_not_after_start_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_INVALID_REQUEST]", "validations[priority=20]", entities.Booking.fields.event_end]
        distinguishing_aspect: "POST /bookings with event_end == event_start returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Premium package and a customer exist; booking with event_end == event_start."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T18:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 422"

      - name: duplicate_booth_asset_tag_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_DUPLICATE_KEY]", "validations[priority=21]", entities.Booth.fields.asset_tag]
        distinguishing_aspect: "POST /booths with an asset_tag already in use returns ERR_DUPLICATE_KEY (409)."
        test_recipe:
          setup:
            - "A booth BTH-001 already exists; a second booth reuses the tag."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
          trigger:
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_KEY"
            - "HTTP status == 409"

      - name: payment_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Payment.common_fields, entities.Payment.fields.kind]
        distinguishing_aspect: "Payment is common_fields:false (append-only): it carries id and created_at only, with no version field and no update endpoint in §1.5."
        test_recipe:
          setup:
            - "A booking with a DEPOSIT payment recorded; read the payment list."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "DEPOSIT", amount: 300.00 }
              as: FinanceClerk
          trigger:
            - call: "GET /bookings/${bk_id}/payments"
              payload: {}
              as: FinanceClerk
              captures: { first_pay_id: $.data.0.id }
          assert:
            - "Payment list has length 1"
            - "Payment.${first_pay_id}.kind == DEPOSIT"
            - "Payment.${first_pay_id}.amount == 300.00"

      - name: booking_create_wrong_package_id_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=10]", entities.Booking.fields.package_id]
        distinguishing_aspect: "POST /bookings referencing a non-existent package_id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "A customer exists; booking references a random package_id."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "00000000-0000-4000-8000-000000000000", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: flat_topology_filtered_list_booths_by_model
        claim_type: Creation
        grounds: [entities.Booth.fields.booth_model_id]
        distinguishing_aspect: "Flat topology: GET /booths?booth_model_id returns only booths whose booth_model_id matches (FK cross-reference integrity)."
        test_recipe:
          setup:
            - "Two booth models; one booth on each. Filter by the first model returns exactly one booth."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model1_id: $.data.id }
            - call: "POST /booth-models"
              payload: { name: "Enclosed", booth_type: "ENCLOSED", footprint_sqft: 60, max_prints_per_hour: 90 }
              as: PlatformAdmin
              captures: { model2_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model1_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth1_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model2_id}", asset_tag: "BTH-002" }
              as: OperationsManager
          trigger:
            - call: "GET /booths?booth_model_id=${model1_id}"
              payload: {}
              as: OperationsManager
              captures: { first_id: $.data.0.id }
          assert:
            - "Booth list length == 1"
            - "Booth.${first_id}.booth_model_id == ${model1_id}"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_unpaid_booking_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.Booking.DRAFT_to_CONFIRMED, "validations[priority=30]"]
        distinguishing_aspect: "Confirm requires payment_status DEPOSIT_PAID; confirming a DRAFT/UNPAID booking returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Premium package, one booth; a DRAFT/UNPAID booking (no deposit paid)."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "Booking.${bk_id}.schedule_status == DRAFT"

      - name: start_service_from_draft_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.CONFIRMED_to_IN_SERVICE, "validations[priority=30]"]
        distinguishing_aspect: "start-service is only valid from CONFIRMED; calling it on a DRAFT booking returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A DRAFT booking that has never been confirmed."
          setup_api_calls:
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /bookings/${bk_id}/start-service"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

      - name: cancel_terminal_completed_booking_rejected
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Booking.DRAFT_to_CANCELLED, state_machines.Booking.CONFIRMED_to_CANCELLED, "validations[priority=30]"]
        distinguishing_aspect: "COMPLETED is terminal on the schedule dimension; cancel from COMPLETED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A COMPLETED, PAID_IN_FULL booking; customer attempts to cancel it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "DEPOSIT", amount: 300.00 }
              as: FinanceClerk
            - call: "POST /bookings/${bk_id}/confirm"
              payload: { expected_booth_version: "${booth_v}" }
              as: OperationsManager
            - call: "POST /bookings/${bk_id}/start-service"
              payload: {}
              as: OperationsManager
            - call: "GET /bookings/${bk_id}/event-logs"
              payload: {}
              as: OperationsManager
              captures: { log_id: $.data.0.id, log_v: $.data.0.version }
            - call: "POST /event-logs/${log_id}/finalize"
              payload: { actual_setup_start: "2026-09-12T18:00:00Z", actual_coverage_start: "2026-09-12T18:00:00Z", actual_coverage_end: "2026-09-12T22:00:00Z", actual_teardown_end: "2026-09-12T22:30:00Z", actual_print_count: 200, expected_eventlog_version: "${log_v}" }
              as: OperationsManager
            - call: "POST /bookings/${bk_id}/payments"
              payload: { kind: "BALANCE", amount: 900.00 }
              as: FinanceClerk
            - call: "POST /bookings/${bk_id}/complete"
              payload: {}
              as: OperationsManager
          trigger:
            - call: "POST /bookings/${bk_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "Booking.${bk_id}.schedule_status == COMPLETED"

      - name: gallery_unpublish_from_draft_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Gallery.PUBLISHED_to_UNPUBLISHED, "validations[priority=30]"]
        distinguishing_aspect: "unpublish is only valid from PUBLISHED; unpublishing a DRAFT gallery returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "A COMPLETED/PAID booking with a DRAFT (never published) Gallery."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /booth-models"
              payload: { name: "Open-Air Mirror", booth_type: "MIRROR", footprint_sqft: 80, max_prints_per_hour: 120 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packages"
              payload: { booth_model_id: "${model_id}", name: "Basic 4hr", base_price: 1200.00, included_hours: 4, included_prints: 300, overtime_rate_per_hour: 150.00, idle_rate_per_hour: 75.00, overage_print_rate: 0.40 }
              as: PlatformAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /booths"
              payload: { booth_model_id: "${model_id}", asset_tag: "BTH-001" }
              as: OperationsManager
              captures: { booth_id: $.data.id, booth_v: $.data.version }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "Cara One" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /bookings"
              payload: { customer_id: "${cust_id}", package_id: "${pkg_id}", event_start: "2026-09-12T18:00:00Z", event_end: "2026-09-12T22:00:00Z", venue_distance_miles: 0, requested_setup_lead_min: 0 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /bookings/${bk_id}/payments"
