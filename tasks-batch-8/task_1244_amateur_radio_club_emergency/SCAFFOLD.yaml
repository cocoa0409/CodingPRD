  - { method: GET, path: "/exam-candidates/{id}", description: "Exam candidate detail", roles: [ClubAdmin, ExamLiaison], code: 200, input: [], output: ExamCandidate, side_effects: [] }
  - { method: POST, path: "/exam-candidates/{id}/check-in", description: "REGISTERED -> CHECKED_IN while session IN_PROGRESS; records checked_in_by_member_id = caller", roles: [ExamLiaison], code: 200, input: [], output: ExamCandidate, side_effects: ["checked_in_by_member_id set", "ExamCandidate.version += 1"] }
  - { method: POST, path: "/exam-candidates/{id}/record-result", description: "CHECKED_IN -> PASSED (score >= 74) or FAILED; recorder must differ from check-in member (SoD); a PASS upgrades a linked member's license_class", roles: [ExamLiaison], code: 200, input: [score_percent], output: ExamCandidate, side_effects: ["ExamCandidate.version += 1", "on PASSED with member_id: member license_class upgraded if element higher, license_expires_at = now + 3650 days"] }
  - { method: POST, path: "/exam-candidates/{id}/mark-no-show", description: "REGISTERED -> NO_SHOW while session IN_PROGRESS", roles: [ExamLiaison], code: 200, input: [], output: ExamCandidate, side_effects: ["ExamCandidate.version += 1"] }

  - { method: POST, path: "/equipment-loans", description: "Check out equipment; Member borrowers create own loans, ClubAdmin may specify member_id; one outstanding loan per item_tag; borrower ACTIVE with GOOD_STANDING", roles: [Member, ClubAdmin], code: 201, input: [item_tag, due_at, estimated_value_cents, "member_id?"], output: EquipmentLoan, side_effects: ["checked_out_at = clock_now"] }
  - { method: GET, path: "/equipment-loans", description: "List equipment loans", roles: [ClubAdmin, Member], code: 200, input: ["member_id?", "item_tag?", "status?", "limit?", "offset?"], output: "EquipmentLoan[]", side_effects: [] }
  - { method: GET, path: "/equipment-loans/{id}", description: "Loan detail including late_fee_cents", roles: [ClubAdmin, Member], code: 200, input: [], output: EquipmentLoan, side_effects: [] }
  - { method: POST, path: "/equipment-loans/{id}/return", description: "ACTIVE/OVERDUE -> RETURNED; computes late_fee_cents; DAMAGED fires privilege -> readiness -> roster cascade", roles: [Member, ClubAdmin], code: 200, input: [return_condition], output: EquipmentLoan, side_effects: ["returned_at = clock_now", "late_fee_cents per calculations.equipment_late_fee", "DAMAGED: member privilege SUSPENDED cascade (readiness -50, roster withdrawal on INELIGIBLE)"] }
  - { method: POST, path: "/equipment-loans/{id}/mark-lost", description: "ACTIVE/OVERDUE -> LOST; late_fee_cents = estimated_value_cents; privilege cascade", roles: [ClubAdmin], code: 200, input: [], output: EquipmentLoan, side_effects: ["late_fee_cents = estimated_value_cents", "member privilege SUSPENDED cascade"] }

  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set call the logical clock reads that default and never falls back to wall-clock time.", roles: [ClubAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["system transitions evaluated in order: Members ACTIVE -> LAPSED (dues_paid_through passed); AntennaSiteAgreement ACTIVE -> EXPIRED (lease_end passed, with repeater/net/readiness cascade); ServedAgencyAgreement ACTIVE -> EXPIRED (effective_end passed, STANDBY activations cancelled); EquipmentLoan ACTIVE -> OVERDUE (due_at passed)"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or entity_backed role id not found" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or ownership sub-check failed (net control / roster owner / borrower)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK references a non-existent resource" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body, missing required field, wrong type, enum value outside the declared set, or unknown/read-only input field supplied" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic invalid from-state for the requested transition (incl. terminal-state lockdown and exam-session window/close violations such as ERR_CANDIDATES_PENDING's siblings)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent entity's current version" }
  - { id: ERR_CALLSIGN_TAKEN, http: 409, condition: "Member callsign already registered (case-insensitive)" }
  - { id: ERR_REPEATER_CALLSIGN_TAKEN, http: 409, condition: "Repeater callsign already registered" }
  - { id: ERR_EVENT_NAME_TAKEN, http: 409, condition: "FieldDayEvent name already exists" }
  - { id: ERR_MEMBERSHIP_NOT_ACTIVE, http: 409, condition: "Operation requires member membership_status == ACTIVE" }
  - { id: ERR_DUES_LAPSED, http: 409, condition: "Reinstate SUSPENDED -> ACTIVE requires dues_paid_through > clock now" }
  - { id: ERR_LICENSE_CLASS_INSUFFICIENT, http: 422, condition: "Actor's license_class ordinal below the required min_license_class / element" }
  - { id: ERR_LICENSE_EXPIRED, http: 422, condition: "Actor's license_expires_at <= clock now" }
  - { id: ERR_ALREADY_CHECKED_IN, http: 409, condition: "Member already has a CheckIn on this net" }
  - { id: ERR_INVALID_TRAFFIC_COUNT, http: 422, condition: "has_traffic false requires traffic_count == 0; has_traffic true requires traffic_count >= 1" }
  - { id: ERR_NET_NOT_OPEN, http: 409, condition: "Check-in target net is not OPEN" }
  - { id: ERR_NET_WINDOW_NOT_STARTED, http: 409, condition: "Net may be opened only within [scheduled_start, scheduled_end)" }
  - { id: ERR_NET_TIME_CONFLICT, http: 409, condition: "Half-open overlap with another SCHEDULED/OPEN net on the same repeater (adjacent allowed)" }
  - { id: ERR_REPEATER_NOT_OPERATIONAL, http: 409, condition: "Net open requires repeater status OPERATIONAL" }
  - { id: ERR_FREQUENCY_OUT_OF_BAND, http: 422, condition: "requested_frequency_mhz outside [144.0,148.0] and [420.0,450.0] MHz" }
  - { id: ERR_NO_COORDINATION_GRANT, http: 409, condition: "Repeater -> OPERATIONAL requires a GRANTED CoordinationRequest" }
  - { id: ERR_SITE_AGREEMENT_INACTIVE, http: 409, condition: "Repeater -> OPERATIONAL requires its AntennaSiteAgreement to be ACTIVE" }
  - { id: ERR_SITE_WINDOW_CONFLICT, http: 409, condition: "Closed-interval lease overlap on the same site_name (touching endpoints conflict)" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Activation create/activate requires the served-agency agreement to be ACTIVE" }
  - { id: ERR_ACTIVATION_IN_PROGRESS, http: 409, condition: "Agreement termination blocked while an ACTIVATED activation exists" }
  - { id: ERR_ACTIVATION_NOT_OPEN, http: 409, condition: "Roster volunteer requires activation in {STANDBY, ACTIVATED}" }
  - { id: ERR_REQUIRED_OPERATORS_EXCEED_AGREEMENT, http: 422, condition: "required_operators > agreement.max_operators" }
  - { id: ERR_SOD_DEMOBILIZE, http: 403, condition: "Demobilizer member id equals activated_by_member_id (segregation of duties)" }
  - { id: ERR_SOD_EXAM_GRADING, http: 403, condition: "Exam result recorder member id equals checked_in_by_member_id (segregation of duties)" }
  - { id: ERR_ROSTER_FULL, http: 409, condition: "confirmed_count >= required_operators at confirm time" }
  - { id: ERR_ROSTER_ENTRY_INELIGIBLE, http: 409, condition: "Member readiness_tier == INELIGIBLE at roster volunteer or confirm" }
  - { id: ERR_ALREADY_ON_ROSTER, http: 409, condition: "Member already has a RosterEntry on this activation" }
  - { id: ERR_DRILL_NOT_IN_PROGRESS, http: 409, condition: "Drill message operations require drill status IN_PROGRESS" }
  - { id: ERR_MESSAGE_NOT_RELAYED, http: 409, condition: "DELIVERED requires the message to have passed through RELAYED (relay_count >= 1)" }
  - { id: ERR_EVENT_NOT_OPEN, http: 409, condition: "Contacts may be logged only while the event is OPEN" }
  - { id: ERR_EVENT_FINALIZED, http: 409, condition: "Duplicate toggling blocked after FINALIZED" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "registered_count >= max_candidates at registration" }
  - { id: ERR_CANDIDATES_PENDING, http: 409, condition: "Session close blocked while candidates remain in {REGISTERED, CHECKED_IN}" }
  - { id: ERR_CANDIDATE_NOT_CHECKED_IN, http: 409, condition: "record-result requires candidate status CHECKED_IN" }
  - { id: ERR_DUPLICATE_CANDIDATE_FRN, http: 409, condition: "FRN already registered within this exam session" }
  - { id: ERR_ITEM_ON_LOAN, http: 409, condition: "Another loan with the same item_tag is ACTIVE or OVERDUE" }
  - { id: ERR_EQUIPMENT_PRIVILEGE_SUSPENDED, http: 409, condition: "Borrower equipment_privilege is SUSPENDED" }
  - { id: ERR_LOAN_WINDOW_INVALID, http: 422, condition: "due_at must be > clock now and <= now + 90 days" }
  - { id: ERR_LOAN_NOT_OUTSTANDING, http: 409, condition: "return/mark-lost requires loan status ACTIVE or OVERDUE" }

roles:
  - name: ClubAdmin
    description: "Club secretary/trustee operations: members, repeaters, coordination, site agreements, served-agency agreements, field day governance, loan loss handling, logical clock"
    identity: opaque
    exclusive_operations: ["member create/suspend/reinstate/renew", "repeater + coordination lifecycle", "site + served-agency agreement lifecycle", "field day event lifecycle + duplicate marking", "equipment mark-lost", "POST /_clock/set_current_utc"]
    shared_operations: ["read endpoints", "net create/cancel", "equipment loan create/return"]
  - name: Member
    description: "Regular club member acting as themselves (X-User-ID == Member.id)"
    identity: "entity_backed:Member"
    exclusive_operations: ["net check-in (self)", "roster volunteer/withdraw (self)", "drill message originate/relay/deliver", "field day contact logging (self)"]
    shared_operations: ["read endpoints", "equipment loan create/return (self)"]
  - name: NetControl
    description: "Member acting as net control station; owns the nets they run (X-User-ID == Member.id == NetSession.net_control_member_id)"
    identity: "entity_backed:Member"
    exclusive_operations: ["net schedule/open/close/cancel for nets where caller is net_control_member_id"]
    shared_operations: ["read endpoints"]
  - name: EmergencyCoordinator
    description: "EC member running activations, rosters, and drills (X-User-ID == Member.id); demobilize must be a different member than the activator"
    identity: "entity_backed:Member"
    exclusive_operations: ["activation create/activate/demobilize/cancel", "roster confirm/revert/release/no-show", "drill create/start/complete/cancel"]
    shared_operations: ["read endpoints"]
  - name: ExamLiaison
    description: "Volunteer-examiner liaison member administering exam sessions (X-User-ID == Member.id); result recorder must differ from the member who checked the candidate in"
    identity: "entity_backed:Member"
    exclusive_operations: ["exam session lifecycle", "candidate register/check-in/record-result/mark-no-show"]
    shared_operations: ["read endpoints"]
