            - "${cr_a} == 2026-08-01T00:00:00.000Z"
            - "the clock write returns HTTP 200 with data null"
            - "${ix_b} == 2026-12-25, ${due_b} == 2027-06-23 and ${cr_b} == 2026-12-25T09:30:00.000Z"
            - "${ix_a2} == 2026-08-01 and ${due_a2} == 2027-01-28 - moving the clock does not retro-edit ${ep_a}"
      - name: episode_close_is_gated_on_an_open_clinical_status
        claim_type: conditional_action
        grounds:
          - endpoints.POST_screening_episodes_episode_id_close
          - validations.priority_8
          - state_machines.ScreeningEpisode.OPEN_to_CLOSED_SUPERSEDED
        distinguishing_aspect: "The close action maps reason onto two different terminal states and is legal exactly once: SUPERSEDED_BY_OTHER_PATHWAY lands on CLOSED_SUPERSEDED, the ledger side effect drops the patient's open_episode_count from 2 to 1 and the priority from HIGH to ROUTINE, and a second close of the same episode returns 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, one patient with two OPEN episodes on different indications"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PracticeAdmin
            - call: "POST /insurance-plans"
