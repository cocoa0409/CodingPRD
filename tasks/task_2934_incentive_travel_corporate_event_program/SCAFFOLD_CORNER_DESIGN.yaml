        second close returns the same id — the program is still ONSITE, so priority 10 does not pre-empt
        priority 11 here.
      - Filing the already-FILED report returns ERR_TAX_REPORT_STATE_INVALID with HTTP 409, and GET /qualifiers/${qa_id}
        still shows tax_status "REPORTED" with reported_award_total_cents unchanged on the program.
      - 'All ten ids are distinct: no probe returns a shared generic conflict code, and each names the
        entity whose state actually blocked the call.'
      - Every rejected call is inert — GET on each targeted row afterwards shows the same version it had
        before the probe.
  - name: business_rule_errors_unreachable_from_any_other_instance_are_triggered_directly
    claim_type: error_triggerability
    grounds:
    - §1.6 ERR_DESTINATION_RISK_TOO_HIGH, ERR_INSPECTION_SCORE_BELOW_MINIMUM, ERR_TIER_BUDGET_EXCEEDED,
      ERR_ADVANCE_PREREQUISITES_UNMET
    - §1.4 priorities 17, 18, 29, 33
    - §1.3 tier_assignment_selector, qualifier_committed_cost
    distinguishing_aspect: |
      The third errors instance, and the one that exists purely to close the coverage gap: these four ids are the only §1.6 entries that no §1.8 instance and no other §1.9 instance reaches. Each needs a fixture shaped against it — a destination whose risk is one point over the cap but whose inspection passed, a destination whose inspection is one point under the floor but whose risk passed, and a deliberately under-funded SILVER tier whose budget is smaller than the committed cost the selector will compute for the qualifier it captures. The gross-up lock and PENDING_REVIEW qualifier then make the advance prerequisite fail while the edge itself is structurally legal, which is the distinction between 422 and 409 on that endpoint.
    test_recipe:
      setup: 'Empty database. A 5000000-cent program is CONTRACTED with three tiers: PLATINUM (threshold
        250000000, budget 2500000), GOLD (150000000, 1600000) and SILVER (tier_rank 4, threshold 120000000,
        budget only 400000, service_load_bp 800, upgrade_allowance_cents 40000). Lisbon (risk 35, inspected
        82) is SELECTED under an EXECUTED hotel contract, so per_person_cost_basis_cents is 431757. Cartagena
        has risk_score 61 and inspection_score 88; Naples has risk_score 40 and inspection_score 69; both
        are INSPECTED but still CANDIDATE. Ana Reyes is QUALIFIED at PLATINUM. Tess Ward (actual_metric
        130000000) has been created but not reviewed, so she is PENDING_REVIEW, and no gross-up policy
        has been recorded.'
