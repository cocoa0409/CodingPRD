            - *k_p1_close
            - *k_p2
            - *k_p2_import
            - *k_p2_close
            - *k_p3
            - *k_p3_import
            - *k_p3_close
            - *k_p4
            - *k_p4_import
            - *k_p4_close
            - *k_inv_open
            - *k_ev_household
            - *k_conclude_ineligible
