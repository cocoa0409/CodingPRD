          Three records on one assembly separate the four comparisons: 40 scratches / 20 digs / 50
          particles / 2 at the limit sits exactly on every bound and PASSES; raising only
          scratch_count_at_limit to 3 breaks the MAX_SCRATCHES_AT_LIMIT constant (which is a global
