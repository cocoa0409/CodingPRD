            - call: "POST /supplement-compliance/ingredients/${ing_soy_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Ginkgo Biloba Extract", ingredient_class: "BOTANICAL", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 120, rdi_mg: 120, contraindication_code: "ANTICOAGULANT" }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_gink_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_gink_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/ingredients"
              payload: { ingredient_name: "Ascorbic Acid", ingredient_class: "VITAMIN", pre_dshea_marketed: true, chemical_alteration: false, daily_intake_mg: 500, rdi_mg: 90 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { ing_c_id: $.data.id }
            - call: "POST /supplement-compliance/ingredients/${ing_c_id}/eligibility-determination"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/products"
              payload: { brand_name: "VitaTrust", product_name: "Botanical Trio", net_quantity_g: 60, servings_per_container: 30 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_id: $.data.id }
            - call: "POST /supplement-compliance/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_soy_id}", amount_per_serving_mg: 80, panel_position: 1 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { line_soy_id: $.data.id }
            - call: "POST /supplement-compliance/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_gink_id}", amount_per_serving_mg: 60, panel_position: 2 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "POST /supplement-compliance/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_c_id}", amount_per_serving_mg: 45, panel_position: 3 }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
            - call: "GET /supplement-compliance/products/${prod_id}"
              payload: {}
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { prod_v1: $.data.version }
            - call: "POST /supplement-compliance/label-panels"
              payload: { product_id: "${prod_id}", expected_product_version: "${prod_v1}", panel_format: "LINEAR", serving_size_text: "2 capsules", serving_weight_g: 2, servings_per_container_declared: 30, effective_from: "2026-09-01", effective_until: "2027-08-31", declared_warning_codes: ["CONTRAINDICATION_ANTICOAGULANT", "PEDIATRIC_KEEP_OUT_OF_REACH"] }
              as: RegulatoryAffairsSpecialist
              as_user_id: "u_ras_01"
              captures: { panel_id: $.data.id }
          trigger:
            - call: "POST /supplement-compliance/label-panels/${panel_id}/validate"
