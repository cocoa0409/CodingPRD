      - name: the_start_infusion_gate_reports_the_missing_lab_ahead_of_the_uncompounded_dose
        claim_type: triggerable
        grounds:
          - validations[priority 71]
          - validations[priority 100]
          - errors[ERR_LAB_RESULT_MISSING]
          - errors[ERR_PREPARATION_NOT_READY]
          - endpoints[POST /lab-results]
        distinguishing_aspect: |
          Two independent readiness gaps are open at once — no RESULTED lab row anywhere for
          the patient and a dose still sitting in REQUESTED — and the 422 at priority 71 must
          be reported before the 409 at priority 100. Filing the lab (which is a create, not
          an update, because LabResult is immutable) closes only the first gap and flips the
          answer to ERR_PREPARATION_NOT_READY, so each error is observed in isolation on the
          identical call, and compounding then lets the same call through.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Standing center, chair, nurse, drug with requires_lab_gate true, a 10-unit lot, MID template, one 70 kg patient with an ACTIVE 6-cycle plan."
            - "Cycle 1 on 2026-08-10 at 540 is authorized and CONFIRMED. The clock moves to 2026-08-10T08:30:00Z, a dose is requested but deliberately NOT compounded, and the visit is checked in."
            - "No LabResult row exists for the patient at all. The clock then moves to 2026-08-10T09:00:00Z, the visit's start minute."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Scheduler
            - call: "POST /infusion-centers"
              payload: { name: "Riverside Infusion Suite", open_minute: 480, close_minute: 1140, turnover_buffer_minutes: 15, urgent_reserve_chair_count: 1, addon_cutoff_minute: 900, lab_validity_hours: 72, stagger_grid_minutes: 15, acuity_slot_minutes: 30 }
              as: Scheduler
              captures: { ctr: $.data.id }
            - call: "POST /chairs"
              payload: { center_id: "${ctr}", label: "A1", chair_type: "STANDARD", status: "AVAILABLE", reserved_for_urgent: false }
              as: Scheduler
              captures: { ch1: $.data.id }
            - call: "POST /nurses"
              payload: { center_id: "${ctr}", full_name: "Nora Ade", acuity_capacity_points: 6, shift_start_minute: 480, shift_end_minute: 1140, status: "ACTIVE" }
              as: Scheduler
              captures: { nr1: $.data.id }
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr1}", lot_number: "LOT-DEC", units_received: 10, expires_on: "2026-12-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot1: $.data.id }
            - call: "POST /appointment-templates"
              payload: { center_id: "${ctr}", drug_id: "${dr1}", dose_tier: "MID" }
              as: Scheduler
              captures: { tp1: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0001", full_name: "Pat One", weight_kg: 70 }
              as: Scheduler
              captures: { pt1: $.data.id }
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt1}", drug_id: "${dr1}", dose_mg_per_kg: 10, total_cycles: 6, premed_waived: false }
              as: MedicalDirector
              captures: { pl1: $.data.id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-10", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
              as: Scheduler
              captures: { ap1: $.data.id }
            - call: "POST /appointments/${ap1}/authorization-requests"
              payload: { payer_name: "Northwind Health" }
              as: AuthorizationSpecialist
              captures: { az1: $.data.id }
            - call: "POST /authorization-requests/${az1}/submit"
              payload: {}
              as: AuthorizationSpecialist
            - call: "POST /authorization-requests/${az1}/decision"
              payload: { decision: "APPROVED", approved_units: 1 }
              as: AuthorizationSpecialist
            - call: "POST /appointments/${ap1}/confirm"
              payload: {}
              as: Scheduler
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T08:30:00Z" }
              as: Scheduler
            - call: "POST /appointments/${ap1}/drug-preparations"
              payload: { units_requested: 1 }
              as: Pharmacist
              captures: { dp1: $.data.id, dp1_status: $.data.status }
            - call: "POST /appointments/${ap1}/check-in"
              payload: {}
              as: Scheduler
