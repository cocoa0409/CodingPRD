            - "After install completion flips the line to VERIFIED, claim1_status == FILED"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: crew_double_booking_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=11]
          - calculations.crew_booked_days
          - entities.InstallTask.fields.end_date
        distinguishing_aspect: |
          Interval semantics: pairwise half-open overlap on the Crew resource — [start, end) means
          a task starting 2026-07-08 exactly when another ends 2026-07-08 is ADJACENT (allowed),
          while [2026-07-09, 2026-07-11) overlapping an existing [2026-07-08, 2026-07-10) task is
          rejected — different semantics than the aggregate site-capacity rule.
        test_recipe:
          setup:
            - "District D1; flat award; PO line qty 10 delivered 2026-07-01; site capacity 5; crew Alpha unbooked; clock 2026-06-20"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-06-20T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /v1/districts", payload: { name: "District D1", annual_cap_cents: 100000000 }, as: ContractorAdmin, captures: { d1: $.data.id } }
            - { call: "POST /v1/school-sites", payload: { district_id: "${d1}", name: "West ES", daily_crew_capacity: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { site1: $.data.id } }
            - { call: "POST /v1/crews", payload: { name: "Crew Alpha" }, as: ContractorAdmin, captures: { crew1: $.data.id } }
            - { call: "POST /v1/bid-specs", payload: { district_id: "${d1}", title: "Spec A", bid_due_date: "2026-04-01", delivery_window_start: "2026-06-15", delivery_window_end: "2026-08-15" }, as: DistrictBuyer, as_user_id: "${d1}", captures: { specA: $.data.id } }
            - { call: "POST /v1/spec-lines", payload: { bid_spec_id: "${specA}", manufacturer: "Acme", model: "Desk-100", qty: 500, max_unit_price_cents: 13000 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { slA: $.data.id } }
            - { call: "POST /v1/bid-specs/${specA}/publish", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/bid-specs/${specA}/close", payload: {}, as: DistrictBuyer, as_user_id: "${d1}" }
            - { call: "POST /v1/awards", payload: { bid_spec_id: "${specA}", district_id: "${d1}", pricing_mode: "AWARD_FLAT", flat_unit_price_cents: 11000, install_rate_cents: 25125, order_by_date: "2026-06-01", warranty_years: 5 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { awardA: $.data.id } }
            - { call: "POST /v1/awards/${awardA}/accept", payload: {}, as: ContractManager }
            - { call: "POST /v1/purchase-orders", payload: { award_id: "${awardA}", po_number: "PO-1", fiscal_year: 2026 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { po1: $.data.id } }
            - { call: "POST /v1/po-lines", payload: { purchase_order_id: "${po1}", spec_line_id: "${slA}", ordered_qty: 10 }, as: DistrictBuyer, as_user_id: "${d1}", captures: { l1: $.data.id } }
            - { call: "POST /v1/purchase-orders/${po1}/accept", payload: {}, as: FulfillmentCoordinator }
            - { call: "POST /v1/shipments", payload: { purchase_order_id: "${po1}", school_site_id: "${site1}", scheduled_date: "2026-07-01", lines: [ { po_line_id: "${l1}", qty: 10 } ] }, as: FulfillmentCoordinator, captures: { ship1: $.data.id } }
            - { call: "POST /v1/shipments/${ship1}/mark-delivered", payload: { lines: [ { po_line_id: "${l1}", delivered_qty: 10, manufacturer: "Acme", model: "Desk-100" } ] }, as: FulfillmentCoordinator }
          trigger:
            - { call: "POST /v1/install-tasks", payload: { shipment_id: "${ship1}", crew_id: "${crew1}", school_site_id: "${site1}", room_label: "W-1", start_date: "2026-07-06", end_date: "2026-07-08", crew_count: 1 }, as: FulfillmentCoordinator, captures: { t1: $.data.id } }
            - { call: "POST /v1/install-tasks", payload: { shipment_id: "${ship1}", crew_id: "${crew1}", school_site_id: "${site1}", room_label: "W-2", start_date: "2026-07-08", end_date: "2026-07-10", crew_count: 1 }, as: FulfillmentCoordinator, captures: { t2: $.data.id, t2_status: $.data.status } }
            - { call: "POST /v1/install-tasks", payload: { shipment_id: "${ship1}", crew_id: "${crew1}", school_site_id: "${site1}", room_label: "W-3", start_date: "2026-07-09", end_date: "2026-07-11", crew_count: 1 }, as: FulfillmentCoordinator, captures: { err3: $.data.error_id } }
            - { call: "GET /v1/crews/${crew1}", payload: {}, as: FulfillmentCoordinator, captures: { booked: $.data.booked_days } }
          assert:
            - "t2_status == SCHEDULED (start 2026-07-08 == prior end 2026-07-08: half-open adjacency allowed)"
            - "err3 == ERR_CREW_DOUBLE_BOOKED ([2026-07-09, 2026-07-11) overlaps [2026-07-08, 2026-07-10) on shared date 2026-07-09)"
            - "booked == 4 (t1: 1 crew x 2 days + t2: 1 crew x 2 days; rejected task booked nothing)"

      - name: site_daily_capacity_aggregate_boundary_exact_vs_over
        grounds:
          - validations[priority=12]
          - calculations.site_daily_load
          - entities.SchoolSite.fields.daily_crew_capacity
        distinguishing_aspect: |
          Interval semantics: aggregate per-date capacity on the SchoolSite resource — loads from
          multiple crews SUM per occupied date and are rejected only when the sum EXCEEDS
          capacity: 2 + 1 == capacity 3 is allowed ('<=' boundary), one more seat (4 > 3) is
          rejected — aggregate-capacity semantics, not pairwise interval adjacency, on a
          different resource entity.
        test_recipe:
          setup:
            - "District D1; site capacity 3; flat award; PO line qty 10 delivered 2026-07-01; three distinct crews (no crew-overlap interference); clock 2026-06-20"
          setup_api_calls:
