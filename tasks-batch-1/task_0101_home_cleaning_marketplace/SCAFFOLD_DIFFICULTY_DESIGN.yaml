            - "Booking.${bk2_id}.status == SCHEDULED"

  # =======================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =======================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_refund_conserves_customer_charge_minus_fee
        grounds:
          - state_machines.Booking.SCHEDULED_to_CANCELLED
          - calculations.reschedule_or_cancel_fee
          - entities.LedgerEntry.fields.amount_cents
        distinguishing_aspect: |
          Conserved quantity: the customer's net cash position. For a CHARGE of 18000
          then a late-band CANCEL at 24h, the compensation must net to a 13500 refund
          (REFUND 18000 minus CHANGE_FEE 4500); the invariant
          (sum of REFUND amount_cents) - (sum of CHANGE_FEE amount_cents) == 13500 holds.
        test_recipe:
          setup:
            - "An 18000 TWO_BR DEEP_CLEAN CLEANER booking, clock set so cancel happens 24h before start (late band 12<=h<48)."
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "2026 Standard", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "TWO_BR" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z", add_ons: ["DEEP_CLEAN"], supplies_provided_by: "CLEANER" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
          trigger:
            - call: "POST /cleaning/bookings/${bk_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cu_id}"
          assert:
            - "Booking.${bk_id}.status == CANCELLED"
            - "Booking.${bk_id}.change_fee_cents == 4500"
            - "a LedgerEntry for booking ${bk_id} with kind REFUND has amount_cents 18000"
            - "a LedgerEntry for booking ${bk_id} with kind CHANGE_FEE has amount_cents -4500"
            - "(sum of REFUND amount_cents) + (sum of CHANGE_FEE amount_cents) for booking ${bk_id} == 13500 (net refund conserved)"

      - name: tip_attach_conserves_payout_total_against_tip
        grounds:
          - calculations.tip_attach
          - calculations.cleaner_payout
          - entities.CleanerPayout.fields.total_cents
        distinguishing_aspect: |
          Different conserved quantity: the cleaner payout total. After completing an
          18000 booking (base_payout 12600) and tipping 2000, total_cents must equal
          base_payout_cents + tip.amount_cents == 14600 exactly — the tip neither
          inflates nor leaks from the payout total.
        test_recipe:
          setup:
            - "An 18000 TWO_BR DEEP_CLEAN CLEANER booking completed (payout base 12600), then a 2000 tip is created."
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "2026 Standard", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "TWO_BR" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z", add_ons: ["DEEP_CLEAN"], supplies_provided_by: "CLEANER" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/bookings/${bk_id}/complete"
              payload: { rating: 5 }
              as: Cleaner
              as_user_id: "${cl_id}"
          trigger:
            - call: "POST /cleaning/tips"
              payload: { booking_id: "${bk_id}", customer_id: "${cu_id}", amount_cents: 2000 }
              as: Customer
              as_user_id: "${cu_id}"
          assert:
            - "the CleanerPayout for booking ${bk_id} has base_payout_cents 12600"
            - "the CleanerPayout for booking ${bk_id} has tip_cents 2000"
            - "the CleanerPayout for booking ${bk_id} has total_cents 14600 (== base_payout_cents + tip amount, conserved)"
