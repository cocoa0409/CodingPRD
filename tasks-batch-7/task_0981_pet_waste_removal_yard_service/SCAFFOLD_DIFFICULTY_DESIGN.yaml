              as: OperationsManager
              captures: { pap_g: $.data.id }
            - call: "POST /api/property-access-profiles/${pap_g}/verify"
              payload: {}
              as: OperationsManager
            - call: "POST /api/subscription-plans"
              payload: { plan_code: "WG", display_name: "WG", visit_frequency: "WEEKLY", applies_to_multifamily: false, base_monthly_fee_cents: 10000, yard_tier_thresholds: [], yard_tier_surcharges_cents: [0], pet_tier_thresholds: [], pet_tier_surcharges_cents: [0] }
              as: OperationsManager
              captures: { pl_g: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /api/subscriptions"
              payload: { customer_id: "${cu_g}", yard_id: "${y_g}", plan_id: "${pl_g}" }
              as: Customer
              as_user_id: "${cu_g}"
              captures: { sub_g: $.data.id }
            - call: "POST /api/subscriptions/${sub_g}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cu_g}"
            - call: "POST /api/technicians"
              payload: { full_name: "TG", employee_code: "T101" }
              as: OperationsManager
              captures: { t_g: $.data.id }
            - call: "POST /api/service-routes"
              payload: { route_code: "RG", service_date: "2026-05-10T00:00:00Z", service_region_code: "R1", assigned_technician_id: "${t_g}", max_visit_capacity: 4 }
              as: OperationsManager
              captures: { rt_g: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_g}", scheduled_date: "2026-05-10T00:00:00Z", scheduled_window_start: "2026-05-10T09:00:00Z", scheduled_window_end: "2026-05-10T12:00:00Z", service_route_id: "${rt_g}" }
              as: OperationsManager
              captures: { v_g1: $.data.id }
            - call: "POST /api/visits"
              payload: { subscription_id: "${sub_g}", scheduled_date: "2026-05-17T00:00:00Z", scheduled_window_start: "2026-05-17T09:00:00Z", scheduled_window_end: "2026-05-17T12:00:00Z" }
              as: OperationsManager
              captures: { v_g2: $.data.id }
          trigger:
