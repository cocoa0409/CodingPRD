              payload: { code: "EPX-XEN-1", name: "Epx Xen", chemistry_family: "EPOXY", moisture_sensitive: false, solvent_content_pct: 5.0, flash_point_c: 80.0, pot_life_minutes: 240, shelf_life_months: 6, spec_min_bond_strength_mpa: 12.0, min_remaining_shelf_life_days: 90 }
