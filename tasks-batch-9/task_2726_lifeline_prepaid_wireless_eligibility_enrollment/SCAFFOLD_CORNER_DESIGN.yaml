          - validations[priority=55]
          - errors[ERR_CASE_NOT_ASSIGNABLE]
          - errors[ERR_CASE_NOT_UNDER_REVIEW]
        distinguishing_aspect: |
          GRANTED is terminal on the SubscriberCase machine and BOTH action endpoints are
          closed from it with DIFFERENT error codes: assign-review yields
          ERR_CASE_NOT_ASSIGNABLE and decide yields ERR_CASE_NOT_UNDER_REVIEW, and the
          already-reinstated enrollment is not reinstated a second time.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with one ACTIVE enrollment; the enrollment is de-enrolled for SUBSCRIBER_REQUEST by the carrier at 2026-08-10T00:00:00Z."
            - "A DE_ENROLLMENT_APPEAL is filed, assigned to REV-1 and granted by PA-1, so the case is GRANTED and the enrollment is ACTIVE with reinstatement_count 1."
          setup_api_calls:
