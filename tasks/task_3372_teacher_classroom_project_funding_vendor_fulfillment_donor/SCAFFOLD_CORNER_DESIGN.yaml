        distinguishing_aspect: "With funded 9000 of 10959, a 2000c donation exceeds the 1959c remaining need and is rejected with ERR_DONATION_EXCEEDS_REMAINING while the clock is still inside the funding window — isolating the fiscal rule from the temporal one."
