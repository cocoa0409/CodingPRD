# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_1609_coffee_roasting_plant_green_coffee
# 9 rules × 2 instances = 18 instances
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥ 2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: landed_cost_provisional_vs_final_basis
        grounds:
          - calculations.calc_landed_cost_at_receipt
          - entities.GreenLot.fields.landed_cost_usd_per_lb
          - entities.Contract.fields.pricing_status
        distinguishing_aspect: |
          GreenLot cost basis — same received lot produces a different
          landed_cost_usd_per_lb depending on whether the parent Contract is
          UNFIXED (provisional: differential alone) or PARTIALLY/FULLY_FIXED
          (final: weighted_avg_fixed_futures + differential) at receipt time.
        test_recipe:
          setup:
            - "Two DIFFERENTIAL_PTBF contracts C1, C2 on the same supplier, identical differentials 0.25 USD/lb, both 10000 lbs."
            - "C1 has NO price-fix events; C2 has one PriceFixEvent of 5000 lbs at futures 1.80000."
            - "Each contract has one ARRIVED shipment of 4000 lbs; both about to be received."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-001", legal_name: "Finca Supplier SA", counterparty_kind: "SUPPLIER", credit_limit_usd: 5000000 }
              as: Trader
              captures: { sup_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_id}/contracts"
              payload: { contract_ref: "C1-UNFIXED", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 10000, differential_usd_per_lb: 0.25, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c1_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_id}/contracts"
              payload: { contract_ref: "C2-FIXED", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 10000, differential_usd_per_lb: 0.25, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c2_id: $.data.id, c2_v0: $.data.version }
            - call: "POST /roastery/contracts/${c2_id}/price-fixes"
              payload: { fix_lbs: 5000, futures_price_usd_per_lb: 1.80000, expected_contract_version: "${c2_v0}" }
              as: Trader
            - call: "POST /roastery/contracts/${c1_id}/shipments"
              payload: { shipment_ref: "SH-C1-001", planned_lbs: 4000, scheduled_arrival: "2026-09-15T10:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh1_id: $.data.id }
            - call: "POST /roastery/contracts/${c2_id}/shipments"
              payload: { shipment_ref: "SH-C2-001", planned_lbs: 4000, scheduled_arrival: "2026-09-15T10:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh2_id: $.data.id }
            - call: "POST /roastery/shipments/${sh1_id}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh1_id}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh2_id}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh2_id}/arrive"
              as: LogisticsCoordinator
          trigger:
            - call: "POST /roastery/shipments/${sh1_id}/receive"
              payload: { received_lbs: 4000, lot_code: "LOT-C1-A", moisture_pct: 11.5, warehouse_location: "WH-A-1" }
              as: WarehouseClerk
            - call: "POST /roastery/shipments/${sh2_id}/receive"
              payload: { received_lbs: 4000, lot_code: "LOT-C2-A", moisture_pct: 11.5, warehouse_location: "WH-A-2" }
              as: WarehouseClerk
            - call: "GET /roastery/green-lots"
              payload: { shipment_id: "${sh1_id}" }
              as: WarehouseClerk
              captures: { lot1_cost: "$.data[0].landed_cost_usd_per_lb" }
            - call: "GET /roastery/green-lots"
              payload: { shipment_id: "${sh2_id}" }
              as: WarehouseClerk
              captures: { lot2_cost: "$.data[0].landed_cost_usd_per_lb" }
          assert:
            - "lot1_cost == 0.25 (provisional basis: differential alone, since C1 is UNFIXED at receipt)"
            - "lot2_cost == 2.05 (final basis: 1.80 weighted_avg_fixed_futures + 0.25 differential)"
            - "lot1_cost != lot2_cost — identical physical receipt produces different cost basis"

      - name: counterparty_exposure_provisional_vs_final
        grounds:
          - calculations.calc_counterparty_open_exposure
          - entities.Counterparty.fields.open_exposure_usd
          - calculations.calc_counterparty_open_exposure.variants
        distinguishing_aspect: |
          Counterparty credit exposure — same portfolio of PTBF contracts +
          hedges yields a different open_exposure_usd under the provisional
          (mark-to-market including unfixed remainder) vs final (only
          already-fixed notional) accounting treatment.
        test_recipe:
          setup:
            - "Counterparty SUP-EXPO with one DIFFERENTIAL_PTBF contract, total 10000 lbs, differential 0.25."
            - "One PriceFixEvent of 4000 lbs at futures 2.00000 already booked → fixed_lbs_accum = 4000, weighted_avg = 2.00000, unpriced_lbs = 6000."
            - "Most recent futures price observed anywhere = 2.00000 (from the fix above)."
            - "No shipments received."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-EXPO", legal_name: "Exporter Ltd", counterparty_kind: "SUPPLIER", credit_limit_usd: 100000 }
              as: Trader
              captures: { sup_e_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_e_id}/contracts"
              payload: { contract_ref: "C-EXPO", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "HG", total_lbs: 10000, differential_usd_per_lb: 0.25, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_e_id: $.data.id, c_e_v0: $.data.version }
            - call: "POST /roastery/contracts/${c_e_id}/price-fixes"
              payload: { fix_lbs: 4000, futures_price_usd_per_lb: 2.00000, expected_contract_version: "${c_e_v0}" }
              as: Trader
          trigger:
            - call: "GET /roastery/counterparties/${sup_e_id}"
              as: Trader
              captures: { expo_val: $.data.open_exposure_usd }
          assert:
            - "provisional variant exposure = unpriced_lbs(6000) * (latest_futures 2.00 + diff 0.25) + fixed_notional(4000 * 2.25) = 13500 + 9000 = 22500.00"
            - "final variant exposure = priced_notional_usd only = 4000 * 2.25 = 9000.00"
            - "The scaffold pins provisional for credit-limit gating (priority 12) and final for margin-call/reporting; both are reachable from the same data and the two numbers differ by the unfixed remainder mark."

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥ 2 instances, different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: blend_allocation_per_component_rounding
        grounds:
          - calculations.calc_blend_allocation
          - entities.RecipeComponent.fields.component_pct
        distinguishing_aspect: |
          Mode (b) nested rounding: each component target is rounded to integer
          lbs individually, then the largest component absorbs the reconciliation
          remainder so the sum exactly equals scheduled_green_lbs. Pinning
          round-then-reconcile produces a different allocation than
          sum-then-round.
        test_recipe:
          setup:
            - "Product P-BLEND with recipe R having three components: 0.334 SHB, 0.333 HG, 0.333 NY2_3 (sums to 1.00000)."
            - "RELEASED GreenLots: SHB lot L1 = 5000 lbs; HG lot L2 = 5000 lbs; NY2_3 lot L3 = 5000 lbs."
            - "scheduled_green_lbs = 1000 (chosen so 0.334 * 1000 = 334, 0.333 * 1000 = 333 each — sum 1000, exact reconcile)."
            - "A second batch scheduled_green_lbs = 1001 (0.334*1001 = 334.334 → 334; 0.333*1001 = 333.333 → 333 each; sum 1000; largest component (SHB, 0.334) absorbs +1 → 335)."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-BL", legal_name: "Blend Supplier", counterparty_kind: "SUPPLIER", credit_limit_usd: 10000000 }
              as: Trader
              captures: { sup_bl_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_bl_id}/contracts"
              payload: { contract_ref: "C-SHB", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 5000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_shb_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_bl_id}/contracts"
              payload: { contract_ref: "C-HG", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "HG", total_lbs: 5000, fixed_price_usd_per_lb: 1.80, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_hg_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_bl_id}/contracts"
              payload: { contract_ref: "C-NY23", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "NY2_3", total_lbs: 5000, fixed_price_usd_per_lb: 1.50, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_ny_id: $.data.id }
            - call: "POST /roastery/contracts/${c_shb_id}/shipments"
              payload: { shipment_ref: "SH-SHB", planned_lbs: 5000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_shb: $.data.id }
            - call: "POST /roastery/contracts/${c_hg_id}/shipments"
              payload: { shipment_ref: "SH-HG", planned_lbs: 5000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_hg: $.data.id }
            - call: "POST /roastery/contracts/${c_ny_id}/shipments"
              payload: { shipment_ref: "SH-NY", planned_lbs: 5000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_ny: $.data.id }
            - call: "POST /roastery/shipments/${sh_shb}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_shb}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_shb}/receive"
              payload: { received_lbs: 5000, lot_code: "LOT-SHB", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/shipments/${sh_hg}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_hg}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_hg}/receive"
              payload: { received_lbs: 5000, lot_code: "LOT-HG", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/shipments/${sh_ny}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_ny}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_ny}/receive"
              payload: { received_lbs: 5000, lot_code: "LOT-NY", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_shb}", panelist_count: 3, score_aroma: 8.5, score_flavor: 8.5, score_aftertaste: 8.5, score_acidity: 8.5, score_body: 8.5, score_balance: 8.5, score_uniformity: 10, score_clean_cup: 10, score_sweetness: 10, score_overall: 8.5, defects_subtracted: 0 }
              as: QAGrader
              captures: { cup_shb: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_shb}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_hg}", panelist_count: 3, score_aroma: 8.5, score_flavor: 8.5, score_aftertaste: 8.5, score_acidity: 8.5, score_body: 8.5, score_balance: 8.5, score_uniformity: 10, score_clean_cup: 10, score_sweetness: 10, score_overall: 8.5, defects_subtracted: 0 }
              as: QAGrader
              captures: { cup_hg: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_hg}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_ny}", panelist_count: 3, score_aroma: 8.5, score_flavor: 8.5, score_aftertaste: 8.5, score_acidity: 8.5, score_body: 8.5, score_balance: 8.5, score_uniformity: 10, score_clean_cup: 10, score_sweetness: 10, score_overall: 8.5, defects_subtracted: 0 }
              as: QAGrader
              captures: { cup_ny: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_ny}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "POST /roastery/roast-profiles"
              payload: { profile_code: "RP-STD", charge_temp_c: 200, target_drop_temp_c: 210, expected_yield_loss_pct: 0.16, shrinkage_alert_band_pct: 0.02 }
              as: HeadRoaster
              captures: { rp_id: $.data.id }
            - call: "POST /roastery/products"
              payload: { sku: "P-BLEND", display_name: "House Blend", channel: "WHOLESALE", target_roast_profile_id: "${rp_id}", freshness_days: 30 }
              as: HeadRoaster
              captures: { prod_id: $.data.id, prod_v0: $.data.version }
            - call: "POST /roastery/products/${prod_id}/recipes"
              as: HeadRoaster
              captures: { rec_id: $.data.id }
            - call: "POST /roastery/recipes/${rec_id}/components"
              payload: { required_grade: "SHB", component_pct: 0.334 }
              as: HeadRoaster
            - call: "POST /roastery/recipes/${rec_id}/components"
              payload: { required_grade: "HG", component_pct: 0.333 }
              as: HeadRoaster
            - call: "POST /roastery/recipes/${rec_id}/components"
              payload: { required_grade: "NY2_3", component_pct: 0.333 }
              as: HeadRoaster
            - call: "POST /roastery/recipes/${rec_id}/approve"
              payload: { expected_product_version: "${prod_v0}" }
              as: HeadRoaster
          trigger:
            - call: "POST /roastery/roast-batches"
              payload: { product_id: "${prod_id}", recipe_id: "${rec_id}", scheduled_green_lbs: 1001 }
              as: RoastOperator
              captures: { batch_id: $.data.id }
            - call: "GET /roastery/roast-batches/${batch_id}/allocations"
              as: RoastOperator
              captures: { alloc0_lbs: "$.data[0].allocated_lbs", alloc1_lbs: "$.data[1].allocated_lbs", alloc2_lbs: "$.data[2].allocated_lbs" }
          assert:
            - "Sum of allocations == 1001 (exactly equals scheduled_green_lbs)"
            - "SHB component allocated_lbs == 335 (0.334*1001 = 334.334 → 334 rounded, then +1 reconcile as largest-pct component)"
            - "HG component allocated_lbs == 333 (0.333*1001 = 333.333 → 333)"
            - "NY2_3 component allocated_lbs == 333"
            - "If the implementation instead summed-then-rounded, SHB would be 334 and the total would be 1000 (not 1001) — the pinned round-per-component-then-reconcile order produces observably different values."

      - name: priced_notional_circular_dependency_pinned_order
        grounds:
          - calculations.calc_priced_notional
          - calculations.calc_weighted_avg_fixed_futures
          - entities.Contract.fields.priced_notional_usd
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: priced_notional_usd depends on
          weighted_avg_fixed_futures_usd, which itself updates on each new
          PriceFixEvent; but the new event's contribution to weighted_avg uses
          the new fix's futures_price, while priced_notional uses the UPDATED
          weighted_avg — the scaffold pins the evaluation order (event appends
          → weighted_avg recomputes → priced_notional recomputes) so the same
          inputs produce a single well-defined value.
        test_recipe:
          setup:
            - "DIFFERENTIAL_PTBF contract C, total 10000 lbs, differential 0.50."
            - "First fix: 4000 lbs @ 1.50; second fix: 6000 lbs @ 2.50 (cumulative reaches total → FULLY_FIXED)."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-CIRC", legal_name: "Circular Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_circ_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_circ_id}/contracts"
              payload: { contract_ref: "C-CIRC", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 10000, differential_usd_per_lb: 0.50, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_circ_id: $.data.id, c_circ_v0: $.data.version }
            - call: "POST /roastery/contracts/${c_circ_id}/price-fixes"
              payload: { fix_lbs: 4000, futures_price_usd_per_lb: 1.50, expected_contract_version: "${c_circ_v0}" }
              as: Trader
              captures: { fix1_id: $.data.id }
            - call: "GET /roastery/contracts/${c_circ_id}"
              as: Trader
              captures: { c_circ_v1: $.data.version, notional_after_1: $.data.priced_notional_usd, wavg_after_1: $.data.weighted_avg_fixed_futures_usd }
          trigger:
            - call: "POST /roastery/contracts/${c_circ_id}/price-fixes"
              payload: { fix_lbs: 6000, futures_price_usd_per_lb: 2.50, expected_contract_version: "${c_circ_v1}" }
              as: Trader
            - call: "GET /roastery/contracts/${c_circ_id}"
              as: Trader
              captures: { notional_final: $.data.priced_notional_usd, wavg_final: $.data.weighted_avg_fixed_futures_usd, status_final: $.data.pricing_status }
          assert:
            - "After fix1: wavg_after_1 == 1.50 and notional_after_1 == 4000 * (1.50 + 0.50) == 8000.00"
            - "After fix2: wavg_final == (4000*1.50 + 6000*2.50) / 10000 == 21000/10000 == 2.10"
            - "notional_final == 10000 * (2.10 + 0.50) == 26000.00 (uses UPDATED weighted_avg, not the per-event contribution sum 8000+15000=23000)"
            - "status_final == FULLY_FIXED"
            - "The pinned order (append event → recompute weighted_avg over all events → recompute notional) is observable: 26000.00 != 23000.00 (the latter is what naive per-event incremental sum would yield)."

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥ 2 instances on different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_parallel_pricing_x_fulfillment
        grounds:
          - state_machines.Contract
          - entities.Contract.fields.pricing_status
          - entities.Contract.fields.fulfillment_status
        distinguishing_aspect: |
          Contract carries two independent state axes (pricing_status ∈
          {UNFIXED, PARTIALLY_FIXED, FULLY_FIXED, NOT_APPLICABLE} ×
          fulfillment_status ∈ {OPEN, PARTIALLY_RECEIVED, FULLY_RECEIVED,
          SHORT_CLOSED, CANCELLED}) that evolve independently — a contract can
          be PARTIALLY_FIXED + PARTIALLY_RECEIVED, and either axis can advance
          without constraining the other's next valid transition.
        test_recipe:
          setup:
            - "PTBF contract total 10000 lbs, differential 0.30."
            - "Step 1: receive one shipment of 4000 lbs → fulfillment PARTIALLY_RECEIVED, pricing still UNFIXED."
            - "Step 2: post price-fix of 3000 lbs → pricing PARTIALLY_FIXED, fulfillment still PARTIALLY_RECEIVED."
            - "Step 3: receive second shipment of 6000 lbs → fulfillment FULLY_RECEIVED, pricing still PARTIALLY_FIXED."
            - "Step 4: post final price-fix of 7000 lbs → pricing FULLY_FIXED, fulfillment still FULLY_RECEIVED."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-PAR", legal_name: "Parallel Supplier", counterparty_kind: "SUPPLIER", credit_limit_usd: 5000000 }
              as: Trader
              captures: { sup_par_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_par_id}/contracts"
              payload: { contract_ref: "C-PAR", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 10000, differential_usd_per_lb: 0.30, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_par_id: $.data.id, c_par_v: $.data.version }
            - call: "POST /roastery/contracts/${c_par_id}/shipments"
              payload: { shipment_ref: "SH-P1", planned_lbs: 4000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_p1: $.data.id }
            - call: "POST /roastery/shipments/${sh_p1}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_p1}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_p1}/receive"
              payload: { received_lbs: 4000, lot_code: "L-P1", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "GET /roastery/contracts/${c_par_id}"
              as: Trader
              captures: { state_s1_pricing: $.data.pricing_status, state_s1_fulfillment: $.data.fulfillment_status, c_par_v1: $.data.version }
            - call: "POST /roastery/contracts/${c_par_id}/price-fixes"
              payload: { fix_lbs: 3000, futures_price_usd_per_lb: 1.80, expected_contract_version: "${c_par_v1}" }
              as: Trader
            - call: "GET /roastery/contracts/${c_par_id}"
              as: Trader
              captures: { state_s2_pricing: $.data.pricing_status, state_s2_fulfillment: $.data.fulfillment_status, c_par_v2: $.data.version }
            - call: "POST /roastery/contracts/${c_par_id}/shipments"
              payload: { shipment_ref: "SH-P2", planned_lbs: 6000, scheduled_arrival: "2026-10-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_p2: $.data.id }
            - call: "POST /roastery/shipments/${sh_p2}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_p2}/arrive"
              as: LogisticsCoordinator
          trigger:
            - call: "POST /roastery/shipments/${sh_p2}/receive"
              payload: { received_lbs: 6000, lot_code: "L-P2", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "GET /roastery/contracts/${c_par_id}"
              as: Trader
              captures: { state_s3_pricing: $.data.pricing_status, state_s3_fulfillment: $.data.fulfillment_status, c_par_v3: $.data.version }
            - call: "POST /roastery/contracts/${c_par_id}/price-fixes"
              payload: { fix_lbs: 7000, futures_price_usd_per_lb: 2.00, expected_contract_version: "${c_par_v3}" }
              as: Trader
            - call: "GET /roastery/contracts/${c_par_id}"
              as: Trader
              captures: { state_s4_pricing: $.data.pricing_status, state_s4_fulfillment: $.data.fulfillment_status }
          assert:
            - "state_s1_pricing == UNFIXED AND state_s1_fulfillment == PARTIALLY_RECEIVED (axes independent: receive moved only fulfillment)"
            - "state_s2_pricing == PARTIALLY_FIXED AND state_s2_fulfillment == PARTIALLY_RECEIVED (fix moved only pricing)"
            - "state_s3_pricing == PARTIALLY_FIXED AND state_s3_fulfillment == FULLY_RECEIVED"
            - "state_s4_pricing == FULLY_FIXED AND state_s4_fulfillment == FULLY_RECEIVED"
            - "Each axis advanced monotonically without constraining the other — this is the parallel shape."

      - name: shipment_branching_dispute_resolution_fork
        grounds:
          - state_machines.Shipment
          - entities.Shipment.fields.dispute_status
        distinguishing_aspect: |
          Shipment.dispute_status branches DISPUTED → {RESOLVED_ACCEPTED,
          RESOLVED_REJECTED} — a fork where each branch produces divergent
          side-effect sets: ACCEPT releases the GreenLot at discounted cost,
          REJECT keeps the lot REJECTED. This is a non-linear branching shape
          (fork with divergent cascades), not a pipeline.
        test_recipe:
          setup:
            - "Two shipments SH-ACC and SH-REJ on separate FIXED_OUTRIGHT contracts (same supplier); both received with 1000 lbs each, both cupped FAIL, both dispute_status = DISPUTED."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-DISP", legal_name: "Dispute Supplier", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_d_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_d_id}/contracts"
              payload: { contract_ref: "C-D1", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "HG", total_lbs: 1000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_d1: $.data.id }
            - call: "POST /roastery/counterparties/${sup_d_id}/contracts"
              payload: { contract_ref: "C-D2", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "HG", total_lbs: 1000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_d2: $.data.id }
            - call: "POST /roastery/contracts/${c_d1}/shipments"
              payload: { shipment_ref: "SH-ACC", planned_lbs: 1000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_acc: $.data.id }
            - call: "POST /roastery/contracts/${c_d2}/shipments"
              payload: { shipment_ref: "SH-REJ", planned_lbs: 1000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_rej: $.data.id }
            - call: "POST /roastery/shipments/${sh_acc}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_acc}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_acc}/receive"
              payload: { received_lbs: 1000, lot_code: "L-ACC", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/shipments/${sh_rej}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_rej}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_rej}/receive"
              payload: { received_lbs: 1000, lot_code: "L-REJ", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_acc}", panelist_count: 3, score_aroma: 6.0, score_flavor: 6.0, score_aftertaste: 6.0, score_acidity: 6.0, score_body: 6.0, score_balance: 6.0, score_uniformity: 10.0, score_clean_cup: 10.0, score_sweetness: 10.0, score_overall: 6.0, defects_subtracted: 6 }
              as: QAGrader
              captures: { cup_acc: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_acc}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_rej}", panelist_count: 3, score_aroma: 6.0, score_flavor: 6.0, score_aftertaste: 6.0, score_acidity: 6.0, score_body: 6.0, score_balance: 6.0, score_uniformity: 10.0, score_clean_cup: 10.0, score_sweetness: 10.0, score_overall: 6.0, defects_subtracted: 6 }
              as: QAGrader
              captures: { cup_rej: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_rej}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
          trigger:
            - call: "POST /roastery/shipments/${sh_acc}/resolve-dispute"
              payload: { outcome: "ACCEPT", discount_pct: 0.30 }
              as: Trader
            - call: "POST /roastery/shipments/${sh_rej}/resolve-dispute"
              payload: { outcome: "REJECT" }
              as: Trader
            - call: "GET /roastery/shipments/${sh_acc}"
              as: Trader
              captures: { disp_acc: $.data.dispute_status }
            - call: "GET /roastery/shipments/${sh_rej}"
              as: Trader
              captures: { disp_rej: $.data.dispute_status }
            - call: "GET /roastery/green-lots"
              payload: { shipment_id: "${sh_acc}" }
              as: Trader
              captures: { lot_acc_status: "$.data[0].lot_status", lot_acc_cost: "$.data[0].landed_cost_usd_per_lb" }
            - call: "GET /roastery/green-lots"
              payload: { shipment_id: "${sh_rej}" }
              as: Trader
              captures: { lot_rej_status: "$.data[0].lot_status" }
          assert:
            - "disp_acc == RESOLVED_ACCEPTED"
            - "disp_rej == RESOLVED_REJECTED"
            - "lot_acc_status == RELEASED (fork branch A: lot returned to usable pool)"
            - "lot_acc_cost == 1.40000 (original 2.00 * (1 - 0.30))"
            - "lot_rej_status == REJECTED (fork branch B: lot stays rejected; no release)"
            - "Same DISPUTED origin, two divergent side-effect sets — branching fork."

  # ===========================================================================
  # Rule 4 — transitive_cascade (≥ 2 instances, different triggers; one depth≥3, other depth≥2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cupping_fail_cascade_to_position_recompute
        grounds:
          - state_machines.Shipment.transitions  # CUP_FAILED
          - state_machines.GreenLot.transitions  # QUARANTINE → REJECTED
          - calculations.calc_warehouse_position
        distinguishing_aspect: |
          Trigger = POST /roastery/cupping-sessions/{id}/finalize with FAIL
          verdict. Chain: CuppingSession finalize → GreenLot.lot_status
          QUARANTINE → REJECTED → Shipment.qc_status PENDING_CUP → CUP_FAILED
          → Shipment.dispute_status NONE → DISPUTED → WarehousePosition
          recompute excludes lot from physical_lbs. Each link caused by the
          previous link, depth = 4.
        test_recipe:
          setup:
            - "One FIXED_OUTRIGHT contract on supplier, one shipment of 2000 lbs received (GreenLot in QUARANTINE)."
            - "Warehouse position before cupping: physical_lbs includes the 2000 lbs quarantined lot."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-CASC", legal_name: "Cascade Supplier", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_c_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_c_id}/contracts"
              payload: { contract_ref: "C-CASC", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 2000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_casc: $.data.id }
            - call: "POST /roastery/contracts/${c_casc}/shipments"
              payload: { shipment_ref: "SH-CASC", planned_lbs: 2000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_casc: $.data.id }
            - call: "POST /roastery/shipments/${sh_casc}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_casc}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_casc}/receive"
              payload: { received_lbs: 2000, lot_code: "L-CASC", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "GET /roastery/warehouse-position"
              as: Trader
              captures: { pos_before: $.data.physical_lbs }
          trigger:
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_casc}", panelist_count: 3, score_aroma: 6.0, score_flavor: 6.0, score_aftertaste: 6.0, score_acidity: 6.0, score_body: 6.0, score_balance: 6.0, score_uniformity: 10.0, score_clean_cup: 10.0, score_sweetness: 10.0, score_overall: 6.0, defects_subtracted: 6 }
              as: QAGrader
              captures: { cup_casc: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_casc}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "GET /roastery/green-lots"
              payload: { shipment_id: "${sh_casc}" }
              as: Trader
              captures: { casc_lot_status: "$.data[0].lot_status" }
            - call: "GET /roastery/shipments/${sh_casc}"
              as: Trader
              captures: { casc_qc: $.data.qc_status, casc_dispute: $.data.dispute_status }
            - call: "GET /roastery/warehouse-position"
              as: Trader
              captures: { pos_after: $.data.physical_lbs }
          assert:
            - "pos_before == 2000 (quarantined lot counted in physical_lbs)"
            - "casc_lot_status == REJECTED (link 1: lot status)"
            - "casc_qc == CUP_FAILED (link 2: shipment qc, caused by lot rejection)"
            - "casc_dispute == DISPUTED (link 3: dispute opens, caused by qc fail)"
            - "pos_after == 0 (link 4: position recompute excludes REJECTED lot)"

      - name: full_fix_auto_lifts_approved_hedges
        grounds:
          - state_machines.Contract.transitions  # → FULLY_FIXED
          - state_machines.FuturesHedge.transitions  # APPROVED → LIFTED (system)
          - calculations.calc_hedge_realized_pnl
        distinguishing_aspect: |
          Trigger = POST /roastery/contracts/{id}/price-fixes that completes the
          fix. Chain: PriceFixEvent appended → Contract.pricing_status →
          FULLY_FIXED → all APPROVED FuturesHedge rows auto-LIFTED with
          exit_price = contract.weighted_avg_fixed_futures_usd → realized_pnl
          computed → Counterparty.open_exposure_usd recomputed. Depth = 3.
        test_recipe:
          setup:
            - "PTBF contract, total 5000 lbs, differential 0.40."
            - "Prior fix: 2000 lbs @ 1.60 (PARTIALLY_FIXED)."
            - "One APPROVED BUY_FUTURES hedge of 3000 lbs at entry 1.65."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-HL", legal_name: "Hedge Lift Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 10000000 }
              as: Trader
              captures: { sup_hl: $.data.id }
            - call: "POST /roastery/counterparties/${sup_hl}/contracts"
              payload: { contract_ref: "C-HL", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 5000, differential_usd_per_lb: 0.40, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_hl: $.data.id, c_hl_v0: $.data.version }
            - call: "POST /roastery/contracts/${c_hl}/price-fixes"
              payload: { fix_lbs: 2000, futures_price_usd_per_lb: 1.60, expected_contract_version: "${c_hl_v0}" }
              as: Trader
            - call: "POST /roastery/contracts/${c_hl}/futures-hedges"
              payload: { hedge_side: "BUY_FUTURES", hedge_lbs: 3000, entry_price_usd_per_lb: 1.65 }
              as: Trader
              as_user_id: "trader-001"
              captures: { hedge_hl: $.data.id }
            - call: "POST /roastery/futures-hedges/${hedge_hl}/approve"
              as: RiskManager
              as_user_id: "risk-001"
            - call: "GET /roastery/contracts/${c_hl}"
              as: Trader
              captures: { c_hl_v1: $.data.version }
          trigger:
            - call: "POST /roastery/contracts/${c_hl}/price-fixes"
              payload: { fix_lbs: 3000, futures_price_usd_per_lb: 1.90, expected_contract_version: "${c_hl_v1}" }
              as: Trader
            - call: "GET /roastery/contracts/${c_hl}"
              as: Trader
              captures: { hl_pricing_status: $.data.pricing_status, hl_wavg: $.data.weighted_avg_fixed_futures_usd }
            - call: "GET /roastery/futures-hedges/${hedge_hl}"
              as: Trader
              captures: { hl_hedge_status: $.data.hedge_status, hl_exit_price: $.data.exit_price_usd_per_lb, hl_pnl: $.data.realized_pnl_usd }
          assert:
            - "hl_pricing_status == FULLY_FIXED (link 1)"
            - "hl_wavg == (2000*1.60 + 3000*1.90) / 5000 == 8900/5000 == 1.78"
            - "hl_hedge_status == LIFTED (link 2: auto-lift cascade)"
            - "hl_exit_price == 1.78 (uses the contract's updated weighted_avg, NOT the original entry or any other price)"
            - "hl_pnl == (1.78 - 1.65) * 3000 == 0.13 * 3000 == 390.00 (link 3: realized_pnl computed from lifted state)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥ 2 instances, different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_version_precedes_credit_limit
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - concurrency_rules[contract-price-fix-stale-version]
        distinguishing_aspect: |
          Category pair: state (priority 7, ERR_STALE_VERSION, HTTP 412) vs
          business_fiscal (priority 12, ERR_CREDIT_LIMIT_EXCEEDED, HTTP 422).
          Both rules are violated by the same request — a stale expected_version
          AND a fix that would exceed credit limit — the state-category error
          MUST win because priority 7 < priority 12.
        test_recipe:
          setup:
            - "PTBF contract on counterparty with credit_limit_usd = 20000 (large enough for the first small fix, small enough to be violated by the second larger fix)."
            - "After fix1 (100 lbs @ 1.50, exposure ≈ 17500 < 20000), contract.version has advanced past the value the client will replay."
            - "Trigger fix of 5000 lbs @ 2.00 with the stale expected_version would (if OCC were bypassed) push provisional exposure to ≈ 22450 > 20000."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-P1", legal_name: "Priority One", counterparty_kind: "SUPPLIER", credit_limit_usd: 20000 }
              as: Trader
              captures: { sup_p1: $.data.id }
            - call: "POST /roastery/counterparties/${sup_p1}/contracts"
              payload: { contract_ref: "C-P1", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 10000, differential_usd_per_lb: 0.25, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_p1: $.data.id, c_p1_v0: $.data.version }
            - call: "POST /roastery/contracts/${c_p1}/price-fixes"
              payload: { fix_lbs: 100, futures_price_usd_per_lb: 1.50, expected_contract_version: "${c_p1_v0}" }
              as: Trader
          trigger:
            - call: "POST /roastery/contracts/${c_p1}/price-fixes"
              payload: { fix_lbs: 5000, futures_price_usd_per_lb: 2.00, expected_contract_version: "${c_p1_v0}" }
              as: Trader
              captures: { p1_err: $.data.error_id }
          assert:
            - "p1_err == ERR_STALE_VERSION (state category, priority 7, wins over the simultaneous business_fiscal priority 12 violation)"
            - "HTTP status == 412"
            - "If the implementation ran the credit-limit check first it would return ERR_CREDIT_LIMIT_EXCEEDED (priority inversion bug)."

      - name: segregation_of_duties_precedes_over_hedge
        grounds:
          - validations[priority=8]
          - validations[priority=25]
        distinguishing_aspect: |
          Category pair: business_safety (priority 8, ERR_SEGREGATION_OF_DUTIES)
          vs business_fiscal (priority 25, ERR_OVER_HEDGE). Both violated —
          approver is the same user who submitted the hedge AND cumulative
          hedge_lbs would exceed unpriced_lbs — the business_safety error MUST
          win because priority 8 < priority 25.
        test_recipe:
          setup:
            - "PTBF contract, total 1000 lbs; no fixes yet → unpriced_lbs = 1000."
            - "Trader trader-001 submits a BUY_FUTURES hedge of 5000 lbs (> 1000 unpriced)."
            - "Same user trader-001 attempts to approve their own hedge — but they lack RiskManager role, so this hits RBAC; we instead use RiskManager risk-001 with X-User-ID equal to the original trader's id to trigger SoD check (see note below)."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-P2", legal_name: "Priority Two", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_p2: $.data.id }
            - call: "POST /roastery/counterparties/${sup_p2}/contracts"
              payload: { contract_ref: "C-P2", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 1000, differential_usd_per_lb: 0.20, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_p2: $.data.id }
            - call: "POST /roastery/contracts/${c_p2}/futures-hedges"
              payload: { hedge_side: "BUY_FUTURES", hedge_lbs: 5000, entry_price_usd_per_lb: 1.80 }
              as: Trader
              as_user_id: "shared-user-001"
              captures: { hedge_p2: $.data.id }
          trigger:
            - call: "POST /roastery/futures-hedges/${hedge_p2}/approve"
              as: RiskManager
              as_user_id: "shared-user-001"
              captures: { p2_err: $.data.error_id }
          assert:
            - "p2_err == ERR_SEGREGATION_OF_DUTIES (business_safety, priority 8, wins)"
            - "HTTP status == 422"
            - "If the implementation ran the over-hedge check first it would return ERR_OVER_HEDGE (priority inversion bug)."

  # ===========================================================================
  # Rule 6 — boundary_precision_check (≥ 2 instances, different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cupping_score_at_exactly_80_passes
        grounds:
          - calculations.calc_cupping_final_score
          - entities.CuppingSession.fields.final_score
        distinguishing_aspect: |
          Metric: cupping final_score. Boundary: PASS requires final_score >= 80.00
          for GREEN_LOT (the comparison is >=, not >). A session whose attribute
          sum minus defects lands exactly on 80.00 MUST yield verdict PASS.
        test_recipe:
          setup:
            - "One GreenLot in QUARANTINE awaiting cupping."
            - "Cupping scores tuned so base - defects = 80.00 exactly (base 82.00 - 2 defects = 80.00)."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-BND", legal_name: "Boundary Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_b_id: $.data.id }
            - call: "POST /roastery/counterparties/${sup_b_id}/contracts"
              payload: { contract_ref: "C-BND", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 1000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_bnd: $.data.id }
            - call: "POST /roastery/contracts/${c_bnd}/shipments"
              payload: { shipment_ref: "SH-BND", planned_lbs: 1000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_bnd: $.data.id }
            - call: "POST /roastery/shipments/${sh_bnd}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_bnd}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_bnd}/receive"
              payload: { received_lbs: 1000, lot_code: "L-BND", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
          trigger:
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_bnd}", panelist_count: 3, score_aroma: 8.0, score_flavor: 8.0, score_aftertaste: 8.0, score_acidity: 8.0, score_body: 8.0, score_balance: 8.0, score_uniformity: 10.0, score_clean_cup: 10.0, score_sweetness: 10.0, score_overall: 8.0, defects_subtracted: 2 }
              as: QAGrader
              captures: { cup_bnd: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_bnd}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "GET /roastery/cupping-sessions/${cup_bnd}"
              as: QAGrader
              captures: { bnd_score: $.data.final_score, bnd_verdict: $.data.session_verdict }
            - call: "GET /roastery/green-lots"
              payload: { shipment_id: "${sh_bnd}" }
              as: Trader
              captures: { bnd_lot_status: "$.data[0].lot_status" }
          assert:
            - "bnd_score == 80.00 (aroma+flavor+aftertaste+acidity+body+balance = 8*6 = 48; uniformity+clean_cup+sweetness = 10*3 = 30; overall = 8; total base = 86; minus defects 6 → 80.00)"
            - "bnd_verdict == PASS (boundary is inclusive: 80.00 >= 80.00 passes)"
            - "bnd_lot_status == RELEASED (lot cascaded out of QUARANTINE)"

      - name: over_fix_boundary_exact_total_vs_one_over
        grounds:
          - validations[priority=13]
          - entities.Contract.fields.fixed_lbs_accum
        distinguishing_aspect: |
          Metric: cumulative fixed_lbs_accum on a PTBF contract. Boundary:
          fix_lbs that brings the cumulative exactly to total_lbs is ACCEPTED
          (transitions to FULLY_FIXED); one lb over is REJECTED with
          ERR_OVER_FIX. Distinct endpoint (POST /contracts/{id}/price-fixes)
          from the cupping boundary (POST /cupping-sessions/{id}/finalize).
        test_recipe:
          setup:
            - "PTBF contract, total_lbs = 1000, differential 0.30, no prior fixes."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-OFB", legal_name: "OverFixBnd", counterparty_kind: "SUPPLIER", credit_limit_usd: 10000000 }
              as: Trader
              captures: { sup_ofb: $.data.id }
            - call: "POST /roastery/counterparties/${sup_ofb}/contracts"
              payload: { contract_ref: "C-OFB", pricing_mode: "DIFFERENTIAL_PTBF", coffee_grade: "SHB", total_lbs: 1000, differential_usd_per_lb: 0.30, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_ofb: $.data.id, c_ofb_v0: $.data.version }
          trigger:
            - call: "POST /roastery/contracts/${c_ofb}/price-fixes"
              payload: { fix_lbs: 1000, futures_price_usd_per_lb: 1.80, expected_contract_version: "${c_ofb_v0}" }
              as: Trader
              captures: { ofb_fix: $.data.id }
            - call: "GET /roastery/contracts/${c_ofb}"
              as: Trader
              captures: { ofb_status: $.data.pricing_status, ofb_fixed: $.data.fixed_lbs_accum, ofb_v1: $.data.version }
            - call: "POST /roastery/contracts/${c_ofb}/price-fixes"
              payload: { fix_lbs: 1, futures_price_usd_per_lb: 1.80, expected_contract_version: "${ofb_v1}" }
              as: Trader
              captures: { ofb_err: $.data.error_id }
          assert:
            - "ofb_fix != null (cumulative 0 + 1000 == total_lbs → ACCEPTED, boundary is inclusive)"
            - "ofb_status == FULLY_FIXED (boundary hit triggers the transition)"
            - "ofb_fixed == 1000"
            - "ofb_err == ERR_INVALID_STATE (contract is FULLY_FIXED; further fix attempts are rejected at state precondition priority 6 — note: the OVER_FIX path is exercised separately in §1.9 over_fix_rejected where the contract is not yet FULLY_FIXED)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (≥ 2 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: roast_start_blocked_by_stale_recipe_version
        grounds:
          - state_machines.RoastBatch.transitions  # SCHEDULED → IN_DRUM
          - state_machines.BlendRecipe.transitions  # APPROVED → SUPERSEDED
        distinguishing_aspect: |
          Entity pair RoastBatch → BlendRecipe: a batch pinned to recipe
          version N cannot transition SCHEDULED → IN_DRUM once that recipe has
          been superseded to version N+1 (BlendRecipe.recipe_version !=
          batch.recipe_version_pinned). Batch's valid transitions depend on
          the linked recipe's current state.
        test_recipe:
          setup:
            - "Product P with recipe R1 APPROVED (version 1)."
            - "RoastBatch B1 scheduled against R1, recipe_version_pinned = 1."
            - "HeadRoaster creates recipe R2 for same product and approves it (R1 → SUPERSEDED, R2 APPROVED with version 2)."
            - "B1 still pinned to version 1."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-XD", legal_name: "Xdep Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_xd: $.data.id }
            - call: "POST /roastery/counterparties/${sup_xd}/contracts"
              payload: { contract_ref: "C-XD", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 5000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_xd: $.data.id }
            - call: "POST /roastery/contracts/${c_xd}/shipments"
              payload: { shipment_ref: "SH-XD", planned_lbs: 5000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_xd: $.data.id }
            - call: "POST /roastery/shipments/${sh_xd}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_xd}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_xd}/receive"
              payload: { received_lbs: 5000, lot_code: "L-XD", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_xd}", panelist_count: 3, score_aroma: 8.5, score_flavor: 8.5, score_aftertaste: 8.5, score_acidity: 8.5, score_body: 8.5, score_balance: 8.5, score_uniformity: 10, score_clean_cup: 10, score_sweetness: 10, score_overall: 8.5, defects_subtracted: 0 }
              as: QAGrader
              captures: { cup_xd: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_xd}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "POST /roastery/roast-profiles"
              payload: { profile_code: "RP-XD", charge_temp_c: 200, target_drop_temp_c: 210, expected_yield_loss_pct: 0.16, shrinkage_alert_band_pct: 0.02 }
              as: HeadRoaster
              captures: { rp_xd: $.data.id }
            - call: "POST /roastery/products"
              payload: { sku: "P-XD", display_name: "Xdep Product", channel: "WHOLESALE", target_roast_profile_id: "${rp_xd}", freshness_days: 30 }
              as: HeadRoaster
              captures: { prod_xd: $.data.id, prod_xd_v0: $.data.version }
            - call: "POST /roastery/products/${prod_xd}/recipes"
              as: HeadRoaster
              captures: { r1_xd: $.data.id }
            - call: "POST /roastery/recipes/${r1_xd}/components"
              payload: { required_grade: "SHB", component_pct: 1.0 }
              as: HeadRoaster
            - call: "POST /roastery/recipes/${r1_xd}/approve"
              payload: { expected_product_version: "${prod_xd_v0}" }
              as: HeadRoaster
            - call: "POST /roastery/roast-batches"
              payload: { product_id: "${prod_xd}", recipe_id: "${r1_xd}", scheduled_green_lbs: 100 }
              as: RoastOperator
              captures: { b1_xd: $.data.id }
            - call: "GET /roastery/products/${prod_xd}"
              as: HeadRoaster
              captures: { prod_xd_v1: $.data.version }
            - call: "POST /roastery/products/${prod_xd}/recipes"
              as: HeadRoaster
              captures: { r2_xd: $.data.id }
            - call: "POST /roastery/recipes/${r2_xd}/components"
              payload: { required_grade: "SHB", component_pct: 1.0 }
              as: HeadRoaster
            - call: "POST /roastery/recipes/${r2_xd}/approve"
              payload: { expected_product_version: "${prod_xd_v1}" }
              as: HeadRoaster
          trigger:
            - call: "POST /roastery/roast-batches/${b1_xd}/start"
              as: RoastOperator
              captures: { xd_err: $.data.error_id }
          assert:
            - "xd_err == ERR_INVALID_STATE or ERR_RECIPE_NOT_APPROVED (batch pinned to SUPERSEDED recipe version cannot start)"
            - "HTTP status is 409 or 422"
            - "RoastBatch B1 production_status remains SCHEDULED"

      - name: financing_pledge_blocked_by_lot_not_released
        grounds:
          - state_machines.GreenLot.transitions  # QUARANTINE → RELEASED gate
          - validations[priority=21]
        distinguishing_aspect: |
          Entity pair FinancingReserve → GreenLot: a FinancingReserve creation
          is rejected when the referenced GreenLot is still in QUARANTINE
          (lot_status != RELEASED). Reserve's valid creation depends on the
          lot's state, a cross-entity precondition.
        test_recipe:
          setup:
            - "GreenLot received but still in QUARANTINE (no cupping session finalized)."
            - "InventoryFinancingLine OPEN with facility_limit_usd = 10000, advance_rate 0.50."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-FIN", legal_name: "Fin Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_fin: $.data.id }
            - call: "POST /roastery/counterparties/${sup_fin}/contracts"
              payload: { contract_ref: "C-FIN", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 1000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_fin: $.data.id }
            - call: "POST /roastery/contracts/${c_fin}/shipments"
              payload: { shipment_ref: "SH-FIN", planned_lbs: 1000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_fin: $.data.id }
            - call: "POST /roastery/shipments/${sh_fin}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_fin}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_fin}/receive"
              payload: { received_lbs: 1000, lot_code: "L-FIN", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/financing-lines"
              payload: { lender_name: "Bank F", facility_limit_usd: 10000, advance_rate_pct: 0.50 }
              as: RiskManager
              captures: { line_fin: $.data.id }
            - call: "GET /roastery/green-lots"
              payload: { shipment_id: "${sh_fin}" }
              as: RiskManager
              captures: { lot_fin_id: "$.data[0].id", lot_fin_status: "$.data[0].lot_status" }
          trigger:
            - call: "POST /roastery/financing-lines/${line_fin}/reserves"
              payload: { green_lot_id: "${lot_fin_id}", reserved_lbs: 500 }
              as: RiskManager
              captures: { fin_err: $.data.error_id }
          assert:
            - "lot_fin_status == QUARANTINE (precondition confirmed)"
            - "fin_err == ERR_LOT_NOT_PLEDGEABLE"
            - "HTTP status == 422"
            - "No FinancingReserve row created; WarehousePosition unchanged"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥ 2 instances, different interval semantics, different resources)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: shipment_arrival_within_delivery_window_inclusive
        grounds:
          - validations[priority=19]
          - entities.Contract.fields.delivery_window_start
          - entities.Contract.fields.delivery_window_end
        distinguishing_aspect: |
          Resource: Contract. Semantics: point-in-closed-interval membership —
          scheduled_arrival is a point, the delivery window is a closed
          interval [start, end] INCLUSIVE at both ends. Arrival at exactly
          start or exactly end is accepted; outside is rejected.
        test_recipe:
          setup:
            - "Contract with delivery_window [2026-09-01T00:00:00Z, 2026-09-30T23:59:59Z]."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-DW", legal_name: "Window Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_dw: $.data.id }
            - call: "POST /roastery/counterparties/${sup_dw}/contracts"
              payload: { contract_ref: "C-DW", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 10000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-09-01T00:00:00Z", delivery_window_end: "2026-09-30T23:59:59Z" }
              as: Trader
              captures: { c_dw: $.data.id }
          trigger:
            - call: "POST /roastery/contracts/${c_dw}/shipments"
              payload: { shipment_ref: "SH-EARLY", planned_lbs: 1000, scheduled_arrival: "2026-08-31T23:59:59Z" }
              as: LogisticsCoordinator
              captures: { dw_err1: $.data.error_id }
            - call: "POST /roastery/contracts/${c_dw}/shipments"
              payload: { shipment_ref: "SH-AT-START", planned_lbs: 1000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { dw_sh1: $.data.id }
            - call: "POST /roastery/contracts/${c_dw}/shipments"
              payload: { shipment_ref: "SH-AT-END", planned_lbs: 1000, scheduled_arrival: "2026-09-30T23:59:59Z" }
              as: LogisticsCoordinator
              captures: { dw_sh2: $.data.id }
            - call: "POST /roastery/contracts/${c_dw}/shipments"
              payload: { shipment_ref: "SH-LATE", planned_lbs: 1000, scheduled_arrival: "2026-10-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { dw_err2: $.data.error_id }
          assert:
            - "dw_err1 == ERR_DELIVERY_WINDOW_VIOLATION (1 second before window opens → rejected)"
            - "dw_sh1 != null (exactly at delivery_window_start → accepted, inclusive lower bound)"
            - "dw_sh2 != null (exactly at delivery_window_end → accepted, inclusive upper bound)"
            - "dw_err2 == ERR_DELIVERY_WINDOW_VIOLATION (1 second after window closes → rejected)"

      - name: contract_aggregate_capacity_overlap
        grounds:
          - validations[priority=30]
          - entities.Contract.fields.total_lbs
        distinguishing_aspect: |
          Resource: Contract. Semantics: aggregate-capacity overlap — the
          contract's fulfillment budget total_lbs is a finite pool; each
          non-CANCELLED shipment's planned_lbs consumes a portion. The rule
          rejects any shipment that would push cumulative non-cancelled
          planned_lbs over total_lbs. Different semantics from
          point-in-interval (this is an aggregate capacity check, not a
          temporal membership check).
        test_recipe:
          setup:
            - "Contract with total_lbs = 5000."
            - "Existing non-cancelled shipment with planned_lbs = 4000."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-AGG", legal_name: "Aggregate Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_agg: $.data.id }
            - call: "POST /roastery/counterparties/${sup_agg}/contracts"
              payload: { contract_ref: "C-AGG", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 5000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_agg: $.data.id }
            - call: "POST /roastery/contracts/${c_agg}/shipments"
              payload: { shipment_ref: "SH-AGG-1", planned_lbs: 4000, scheduled_arrival: "2026-09-15T00:00:00Z" }
              as: LogisticsCoordinator
          trigger:
            - call: "POST /roastery/contracts/${c_agg}/shipments"
              payload: { shipment_ref: "SH-AGG-OK", planned_lbs: 1000, scheduled_arrival: "2026-09-20T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { agg_sh_ok: $.data.id }
            - call: "POST /roastery/contracts/${c_agg}/shipments"
              payload: { shipment_ref: "SH-AGG-OVER", planned_lbs: 1, scheduled_arrival: "2026-09-22T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { agg_err: $.data.error_id }
          assert:
            - "agg_sh_ok != null (cumulative 4000 + 1000 = 5000 == total_lbs; at-capacity is allowed)"
            - "agg_err == ERR_CONTRACT_CAPACITY_EXCEEDED (cumulative 5000 + 1 = 5001 > 5000)"
            - "HTTP status == 422"

  # ===========================================================================
  # Rule 9 — compensating_invariant (≥ 2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: green_lot_mass_conserved_under_void
        grounds:
          - state_machines.RoastBatch.transitions  # SCHEDULED → VOIDED
          - calculations.calc_warehouse_position
        distinguishing_aspect: |
          Conserved quantity: GreenLot.available_lbs (mass). Forward action:
          POST /roastery/roast-batches (allocates N lbs, available_lbs -= N).
          Compensating action: POST /roastery/roast-batches/{id}/void
          (releases allocations, available_lbs += N). Invariant: after
          forward + compensate, available_lbs MUST equal the original value
          exactly — no drift.
        test_recipe:
          setup:
            - "RELEASED GreenLot with received_lbs = 2000, available_lbs = 2000 initially."
            - "Approved recipe (single component 1.0 SHB)."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-INV", legal_name: "Invariant Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_inv: $.data.id }
            - call: "POST /roastery/counterparties/${sup_inv}/contracts"
              payload: { contract_ref: "C-INV", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 5000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_inv: $.data.id }
            - call: "POST /roastery/contracts/${c_inv}/shipments"
              payload: { shipment_ref: "SH-INV", planned_lbs: 2000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_inv: $.data.id }
            - call: "POST /roastery/shipments/${sh_inv}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_inv}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_inv}/receive"
              payload: { received_lbs: 2000, lot_code: "L-INV", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_inv}", panelist_count: 3, score_aroma: 8.5, score_flavor: 8.5, score_aftertaste: 8.5, score_acidity: 8.5, score_body: 8.5, score_balance: 8.5, score_uniformity: 10, score_clean_cup: 10, score_sweetness: 10, score_overall: 8.5, defects_subtracted: 0 }
              as: QAGrader
              captures: { cup_inv: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_inv}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "POST /roastery/roast-profiles"
              payload: { profile_code: "RP-INV", charge_temp_c: 200, target_drop_temp_c: 210, expected_yield_loss_pct: 0.16, shrinkage_alert_band_pct: 0.02 }
              as: HeadRoaster
              captures: { rp_inv: $.data.id }
            - call: "POST /roastery/products"
              payload: { sku: "P-INV", display_name: "Invariant Product", channel: "WHOLESALE", target_roast_profile_id: "${rp_inv}", freshness_days: 30 }
              as: HeadRoaster
              captures: { prod_inv: $.data.id, prod_inv_v0: $.data.version }
            - call: "POST /roastery/products/${prod_inv}/recipes"
              as: HeadRoaster
              captures: { r_inv: $.data.id }
            - call: "POST /roastery/recipes/${r_inv}/components"
              payload: { required_grade: "SHB", component_pct: 1.0 }
              as: HeadRoaster
            - call: "POST /roastery/recipes/${r_inv}/approve"
              payload: { expected_product_version: "${prod_inv_v0}" }
              as: HeadRoaster
            - call: "GET /roastery/green-lots"
              payload: { shipment_id: "${sh_inv}" }
              as: Trader
              captures: { lot_inv_id: "$.data[0].id", lot_inv_avail_before: "$.data[0].available_lbs" }
          trigger:
            - call: "POST /roastery/roast-batches"
              payload: { product_id: "${prod_inv}", recipe_id: "${r_inv}", scheduled_green_lbs: 700 }
              as: RoastOperator
              captures: { batch_inv: $.data.id }
            - call: "GET /roastery/green-lots/${lot_inv_id}"
              as: Trader
              captures: { lot_inv_avail_mid: $.data.available_lbs }
            - call: "POST /roastery/roast-batches/${batch_inv}/void"
              as: RoastOperator
            - call: "GET /roastery/green-lots/${lot_inv_id}"
              as: Trader
              captures: { lot_inv_avail_after: $.data.available_lbs }
          assert:
            - "lot_inv_avail_before == 2000"
            - "lot_inv_avail_mid == 1300 (2000 - 700; forward action debits)"
            - "lot_inv_avail_after == 2000 (compensating void credits back exactly — zero drift)"
            - "RoastBatch production_status == VOIDED; its RoastInputAllocation rows all RELEASED"

      - name: financing_line_utilization_conserved_under_release
        grounds:
          - state_machines.FinancingReserve.transitions  # ACTIVE → RELEASED
          - calculations.calc_financing_reserve_advance
        distinguishing_aspect: |
          Conserved quantity: InventoryFinancingLine.utilized_usd (dollar
          advance). Forward: POST /roastery/financing-lines/{id}/reserves
          (utilized_usd += advance). Compensate: POST
          /roastery/financing-reserves/{rid}/release (utilized_usd -=
          advance). Invariant: utilized_usd after forward+compensate ==
          original value.
        test_recipe:
          setup:
            - "RELEASED GreenLot 1000 lbs, landed_cost 2.00 (collateral 2000)."
            - "FinancingLine advance_rate 0.50 → pledge 1000 lbs yields advance 1000.00."
          setup_api_calls:
            - call: "POST /roastery/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /roastery/counterparties"
              payload: { counterparty_ref: "SUP-U", legal_name: "Util Co", counterparty_kind: "SUPPLIER", credit_limit_usd: 1000000 }
              as: Trader
              captures: { sup_u: $.data.id }
            - call: "POST /roastery/counterparties/${sup_u}/contracts"
              payload: { contract_ref: "C-U", pricing_mode: "FIXED_OUTRIGHT", coffee_grade: "SHB", total_lbs: 1000, fixed_price_usd_per_lb: 2.00, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-31T23:59:59Z" }
              as: Trader
              captures: { c_u: $.data.id }
            - call: "POST /roastery/contracts/${c_u}/shipments"
              payload: { shipment_ref: "SH-U", planned_lbs: 1000, scheduled_arrival: "2026-09-01T00:00:00Z" }
              as: LogisticsCoordinator
              captures: { sh_u: $.data.id }
            - call: "POST /roastery/shipments/${sh_u}/depart"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_u}/arrive"
              as: LogisticsCoordinator
            - call: "POST /roastery/shipments/${sh_u}/receive"
              payload: { received_lbs: 1000, lot_code: "L-U", moisture_pct: 11, warehouse_location: "WH-A" }
              as: WarehouseClerk
            - call: "POST /roastery/cupping-sessions"
              payload: { subject_kind: "GREEN_LOT", subject_id: "${sh_u}", panelist_count: 3, score_aroma: 8.5, score_flavor: 8.5, score_aftertaste: 8.5, score_acidity: 8.5, score_body: 8.5, score_balance: 8.5, score_uniformity: 10, score_clean_cup: 10, score_sweetness: 10, score_overall: 8.5, defects_subtracted: 0 }
              as: QAGrader
              captures: { cup_u: $.data.id }
            - call: "POST /roastery/cupping-sessions/${cup_u}/finalize"
              as: QAGrader
              as_user_id: "qa-001"
            - call: "POST /roastery/financing-lines"
              payload: { lender_name: "Bank U", facility_limit_usd: 10000, advance_rate_pct: 0.50 }
              as: RiskManager
              captures: { line_u: $.data.id }
            - call: "GET /roastery/green-lots"
              payload: { shipment_id: "${sh_u}" }
              as: RiskManager
              captures: { lot_u_id: "$.data[0].id" }
            - call: "GET /roastery/financing-lines/${line_u}"
              as: RiskManager
              captures: { line_u_before: $.data.utilized_usd }
          trigger:
            - call: "POST /roastery/financing-lines/${line_u}/reserves"
              payload: { green_lot_id: "${lot_u_id}", reserved_lbs: 1000 }
              as: RiskManager
              captures: { rsv_u: $.data.id }
            - call: "GET /roastery/financing-lines/${line_u}"
              as: RiskManager
              captures: { line_u_mid: $.data.utilized_usd }
            - call: "POST /roastery/financing-reserves/${rsv_u}/release"
              as: RiskManager
            - call: "GET /roastery/financing-lines/${line_u}"
              as: RiskManager
              captures: { line_u_after: $.data.utilized_usd }
          assert:
            - "line_u_before == 0"
            - "line_u_mid == 1000.00 (1000 lbs * 2.00 * 0.50)"
            - "line_u_after == 0 (release compensates exactly — zero drift)"
            - "FinancingReserve.reserve_status == RELEASED"
