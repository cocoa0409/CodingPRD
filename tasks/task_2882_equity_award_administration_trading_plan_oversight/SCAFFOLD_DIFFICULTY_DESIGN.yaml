# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 2882: Equity Award Administration & Trading Plan Oversight
#
# 9 rule_id blocks x 2 instances = 18 instances.
# Every `grounds:` ref resolves into SCAFFOLD.yaml §1.1-§1.6.
# Every numeric `assert:` literal below was computed by executing the
# corresponding §1.3 formula in code against the pinned setup inputs.
# Canonical actor ids: admin-1 (PlanAdministrator), board-1 (BoardMember),
# officer-1 (DelegatedOfficer), compliance-1 (ComplianceOfficer).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: withholding_method_divergence_share_withhold_vs_sell_to_cover
        grounds:
          - calculations.withholding_mechanics
          - calculations.mobility_tax_allocation
          - state_machines.VestingEvent.PENDING_TAX_to_SETTLED
          - entities.VestingEvent.fields.shares_withheld
          - entities.VestingEvent.fields.shares_sold
          - entities.VestingEvent.fields.residual_cash_cents
        distinguishing_aspect: |
          This instance's two variants live on the VestingEvent settlement domain: the same
          tax bill of 2000000 cents against an identical 1000-share / 5000-cent event
          settles to shares_withheld 400 / shares_sold 0 / residual 0 under SHARE_WITHHOLD
          and to shares_withheld 0 / shares_sold 403 / residual 4925 under SELL_TO_COVER,
          because only the SELL_TO_COVER branch nets COMMISSION_PER_SHARE_CENTS out of the
          per-share proceeds before dividing.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T09:00:00Z; EquityPlan 'Plan A 2026' ACTIVE with 10000000 authorized shares, 200000000 common shares outstanding, burn_rate_limit_bps 500, fungible_ratio_full_value_bps 15000, low_reserve_threshold_bps 1000."
            - "TradingWindow FY2026-Q1 OPEN over [2026-01-05T00:00:00Z, 2026-03-31T00:00:00Z) so the grant issues with grant_date 2026-01-05."
            - "Participant 'Ada Vest' ACTIVE, NON_INSIDER (so no TransactionReport is minted at settlement)."
            - "One RSU Grant of 2000 target shares, GRANTED, carrying two identical TIME tranches of 1000 shares each scheduled 2026-07-01."
            - "One MobilityAssignment US-CA 2026-01-06..2026-06-30 at 4000 bps with 250 workdays, fully contained in the sourcing period [2026-01-05, 2026-07-01], so each event allocates 10000 bps to a single jurisdiction."
            - "Clock advanced to 2026-07-01T12:00:00Z; both tranches vested at fmv_per_share_cents 5000, one with withholding_method SHARE_WITHHOLD and one with SELL_TO_COVER; taxes allocated on both events."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan A 2026", total_authorized_shares: 10000000, common_shares_outstanding: 200000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 500, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 1000, next_earnings_release_at: "2026-02-10T21:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Ada Vest", employee_number: "E-2882-01", home_country_code: "US", home_state_code: "CA", hire_date: "2020-03-02", birth_date: "1985-04-11", insider_status: "NON_INSIDER" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-03-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w1_id: $.data.id }
            - call: "POST /trading-windows/${w1_id}/status"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "RSU", target_shares: 2000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2026-07-01", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 2, vest_type: "TIME", scheduled_vest_date: "2026-07-01", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { t2_id: $.data.id }
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/approve"
              payload: { approval_path: "BOARD" }
              as: BoardMember
              as_user_id: "board-1"
            - call: "POST /grants/${g_id}/issue"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /mobility-assignments"
              payload: { participant_id: "${p_id}", jurisdiction_code: "US-CA", tax_rate_bps: 4000, start_date: "2026-01-06", end_date: "2026-06-30", workdays: 250 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /vesting-tranches/${t1_id}/vest"
              payload: { fmv_per_share_cents: 5000, withholding_method: "SHARE_WITHHOLD" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { ev_sw_id: $.data.id }
            - call: "POST /vesting-tranches/${t2_id}/vest"
              payload: { fmv_per_share_cents: 5000, withholding_method: "SELL_TO_COVER" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { ev_stc_id: $.data.id }
            - call: "POST /vesting-events/${ev_sw_id}/allocate-taxes"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /vesting-events/${ev_stc_id}/allocate-taxes"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
          trigger:
            - call: "POST /vesting-events/${ev_sw_id}/settle"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /vesting-events/${ev_stc_id}/settle"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
          assert:
            - "VestingEvent.${ev_sw_id}.taxable_income_cents == 5000000"
            - "VestingEvent.${ev_sw_id}.total_tax_cents == 2000000"
            - "VestingEvent.${ev_sw_id}.blended_rate_bps == 4000"
            - "VestingEvent.${ev_sw_id}.withholding_method == SHARE_WITHHOLD"
            - "VestingEvent.${ev_sw_id}.shares_withheld == 400"
            - "VestingEvent.${ev_sw_id}.shares_sold == 0"
            - "VestingEvent.${ev_sw_id}.net_shares_delivered == 600"
            - "VestingEvent.${ev_sw_id}.residual_cash_cents == 0"
            - "VestingEvent.${ev_sw_id}.cash_due_cents == 0"
            - "VestingEvent.${ev_stc_id}.total_tax_cents == 2000000"
            - "VestingEvent.${ev_stc_id}.withholding_method == SELL_TO_COVER"
            - "VestingEvent.${ev_stc_id}.shares_withheld == 0"
            - "VestingEvent.${ev_stc_id}.shares_sold == 403"
            - "VestingEvent.${ev_stc_id}.net_shares_delivered == 597"
            - "VestingEvent.${ev_stc_id}.residual_cash_cents == 4925"
            - "VestingEvent.${ev_stc_id}.cash_due_cents == 0"
            - "VestingEvent.${ev_sw_id}.net_shares_delivered != VestingEvent.${ev_stc_id}.net_shares_delivered"
            - "VestingEvent.${ev_stc_id}.shares_sold - VestingEvent.${ev_sw_id}.shares_withheld == 3"
            - "both events satisfy gross_shares == net_shares_delivered + shares_withheld + shares_sold with gross_shares == 1000"

      - name: burn_rate_gross_vs_net_divergence
        grounds:
          - calculations.burn_rate_variants
          - calculations.fungible_weighted_shares
          - state_machines.Grant.PENDING_APPROVAL_to_CANCELLED
          - entities.EquityPlan.fields.gross_burn_rate_bps
          - entities.EquityPlan.fields.net_burn_rate_bps
          - endpoints[GET /equity-plans/{id}/burn-rate-summary]
        distinguishing_aspect: |
          This instance's two variants live on the EquityPlan fiscal-accumulator domain, not
          on VestingEvent settlement: after a 20000-share NSO grant is approved and then
          cancelled against a 1000000-share float, gross_burn_rate_bps stays at 200 because
          fiscal_year_gross_granted_shares is never decremented, while net_burn_rate_bps
          falls to 0 because fiscal_year_returned_shares offsets it.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-02T10:00:00Z; EquityPlan 'Plan B Float' ACTIVE with 5000000 authorized shares, 1000000 common shares outstanding, burn_rate_limit_bps 10000 (non-binding), fungible_ratio_full_value_bps 10000 and low_reserve_threshold_bps 0."
            - "Participant 'Ben Float' ACTIVE."
            - "One NSO Grant of 20000 shares with a single TIME tranche of 20000 shares, APPROVED on the BOARD path (option award types are not fungibility-weighted, so weighted_reserve_shares == 20000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-02-02T10:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan B Float", total_authorized_shares: 5000000, common_shares_outstanding: 1000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 10000, fungible_ratio_full_value_bps: 10000, low_reserve_threshold_bps: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Ben Float", employee_number: "E-2882-02", home_country_code: "US", home_state_code: "NY", hire_date: "2019-06-17", birth_date: "1980-01-09" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "NSO", target_shares: 20000, exercise_price_cents: 3000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2027-02-02", target_shares: 20000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/approve"
              payload: { approval_path: "BOARD" }
              as: BoardMember
              as_user_id: "board-1"
            - call: "GET /equity-plans/${plan_id}/burn-rate-summary"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { gross_after_approve: $.data.gross_burn_rate_bps, net_after_approve: $.data.net_burn_rate_bps }
          trigger:
            - call: "POST /grants/${g_id}/cancel"
              payload: { cancel_reason: "OFFER_RESCINDED" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "GET /equity-plans/${plan_id}/burn-rate-summary"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { gross_after_cancel: $.data.gross_burn_rate_bps, net_after_cancel: $.data.net_burn_rate_bps }
          assert:
            - "${gross_after_approve} == 200"
            - "${net_after_approve} == 200"
            - "${gross_after_cancel} == 200"
            - "${net_after_cancel} == 0"
            - "EquityPlan.${plan_id}.fiscal_year_gross_granted_shares == 20000"
            - "EquityPlan.${plan_id}.fiscal_year_returned_shares == 20000"
            - "EquityPlan.${plan_id}.shares_committed_cumulative == 20000"
            - "EquityPlan.${plan_id}.shares_returned_cumulative == 20000"
            - "EquityPlan.${plan_id}.available_reserve_shares == 5000000"
            - "Grant.${g_id}.weighted_reserve_shares == 0"
            - "Grant.${g_id}.status == CANCELLED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: mobility_allocation_round_then_sum
        grounds:
          - calculations.mobility_tax_allocation
          - entities.TaxAllocation.fields.allocation_bps
          - entities.TaxAllocation.fields.tax_amount_cents
          - entities.VestingEvent.fields.total_tax_cents
          - entities.VestingEvent.fields.blended_rate_bps
          - state_machines.VestingEvent.PENDING_ALLOCATION_to_ALLOCATED
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order matters: three jurisdictions with
          workdays 3/2/2 and rates 4728/4484/4500 bps against taxable_income_cents 5000000
          produce total_tax_cents 2296574 under the pinned round-then-sum order and 2296575
          under sum-then-round, so the one-cent gap falsifies any implementation that
          rounds only once at the end.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T09:00:00Z; EquityPlan 'Plan C Mobility' ACTIVE with 1000000 authorized shares, 200000000 common shares outstanding, burn_rate_limit_bps 500, fungible_ratio_full_value_bps 15000, low_reserve_threshold_bps 0."
            - "TradingWindow FY2026-Q1 OPEN over [2026-01-05T00:00:00Z, 2026-03-31T00:00:00Z) so the grant issues with grant_date 2026-01-05."
            - "Participant 'Cleo Mobile' ACTIVE, NON_INSIDER."
            - "One RSU Grant of 1000 shares, GRANTED, with a single TIME tranche of 1000 shares scheduled 2026-07-01."
            - "Three non-overlapping MobilityAssignment rows of that participant, all fully contained in the sourcing period [2026-01-05, 2026-07-01]: US-CA 2026-01-06..2026-03-05 at 4728 bps with 3 workdays, US-NY 2026-03-06..2026-04-30 at 4484 bps with 2 workdays, GB 2026-05-01..2026-06-30 at 4500 bps with 2 workdays."
            - "Clock advanced to 2026-07-01T12:00:00Z and the tranche vested at fmv_per_share_cents 5000, so taxable_income_cents == 5000000 and the event sits at tax_status PENDING_ALLOCATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan C Mobility", total_authorized_shares: 1000000, common_shares_outstanding: 200000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 500, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Cleo Mobile", employee_number: "E-2882-03", home_country_code: "US", home_state_code: "CA", hire_date: "2021-09-13", birth_date: "1990-02-27" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-03-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w1_id: $.data.id }
            - call: "POST /trading-windows/${w1_id}/status"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "RSU", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2026-07-01", target_shares: 1000 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { t1_id: $.data.id }
            - call: "POST /grants/${g_id}/submit"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /grants/${g_id}/approve"
              payload: { approval_path: "BOARD" }
              as: BoardMember
              as_user_id: "board-1"
            - call: "POST /grants/${g_id}/issue"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /mobility-assignments"
              payload: { participant_id: "${p_id}", jurisdiction_code: "US-CA", tax_rate_bps: 4728, start_date: "2026-01-06", end_date: "2026-03-05", workdays: 3 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /mobility-assignments"
              payload: { participant_id: "${p_id}", jurisdiction_code: "US-NY", tax_rate_bps: 4484, start_date: "2026-03-06", end_date: "2026-04-30", workdays: 2 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /mobility-assignments"
              payload: { participant_id: "${p_id}", jurisdiction_code: "GB", tax_rate_bps: 4500, start_date: "2026-05-01", end_date: "2026-06-30", workdays: 2 }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-01T12:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /vesting-tranches/${t1_id}/vest"
              payload: { fmv_per_share_cents: 5000, withholding_method: "CASH_REMITTANCE" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /vesting-events/${ev_id}/allocate-taxes"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "GET /vesting-events/${ev_id}/tax-allocations"
              payload: {}
              as: PlanAdministrator
              as_user_id: "admin-1"
          assert:
            - "VestingEvent.${ev_id}.taxable_income_cents == 5000000"
            - "VestingEvent.${ev_id}.total_workdays == 7"
            - "GET /vesting-events/${ev_id}/tax-allocations returns total_count == 3"
            - "the TaxAllocation row with jurisdiction_code US-CA has workdays_in_period == 3, allocation_bps == 4286 and tax_amount_cents == 1013210"
            - "the TaxAllocation row with jurisdiction_code US-NY has workdays_in_period == 2, allocation_bps == 2857 and tax_amount_cents == 640539"
            - "the TaxAllocation row with jurisdiction_code GB has workdays_in_period == 2, allocation_bps == 2857 and tax_amount_cents == 642825"
            - "the three allocation_bps values sum to exactly 10000"
            - "VestingEvent.${ev_id}.total_tax_cents == 2296574"
            - "VestingEvent.${ev_id}.total_tax_cents != 2296575"
            - "VestingEvent.${ev_id}.blended_rate_bps == 4593"
            - "VestingEvent.${ev_id}.tax_status == ALLOCATED"
            - "VestingEvent.${ev_id}.settlement_status == PENDING_TAX"

      - name: sell_to_cover_commission_circular_pin
        grounds:
          - calculations.withholding_mechanics
          - calculations.mobility_tax_allocation
          - state_machines.VestingEvent.PENDING_TAX_to_SETTLED
          - entities.VestingEvent.fields.shares_sold
          - entities.VestingEvent.fields.residual_cash_cents
        distinguishing_aspect: |
          Mode (c) - a circular-looking dependency resolved by a pinned evaluation order:
          the SELL_TO_COVER commission is charged per share sold, so shares_sold and the
          proceeds they must cover appear mutually defined; the pinned closed form
          (net_proceeds_per_share first, share count second) yields shares_sold == 560 for
          a 1776000-cent tax at fmv 3200, whereas the naive ceil(T / fmv) fixed point
          yields 555, and residual_cash_cents lands on exactly 2000.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T09:00:00Z; EquityPlan 'Plan D Commission' ACTIVE with 1000000 authorized shares, 200000000 common shares outstanding, burn_rate_limit_bps 500, fungible_ratio_full_value_bps 15000, low_reserve_threshold_bps 0."
            - "TradingWindow FY2026-Q1 OPEN over [2026-01-05T00:00:00Z, 2026-03-31T00:00:00Z)."
            - "Participant 'Dan Cover' ACTIVE, NON_INSIDER."
            - "One RSU Grant of 1500 shares, GRANTED, with a single TIME tranche of 1500 shares scheduled 2026-07-01."
            - "One MobilityAssignment US-NY 2026-01-06..2026-06-30 at 3700 bps with 120 workdays, so the whole 10000 bps allocates to one jurisdiction."
            - "Clock advanced to 2026-07-01T12:00:00Z; tranche vested at fmv_per_share_cents 3200 with withholding_method SELL_TO_COVER; taxes allocated, giving total_tax_cents 1776000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T09:00:00Z" }
              as: PlanAdministrator
              as_user_id: "admin-1"
            - call: "POST /equity-plans"
              payload: { name: "Plan D Commission", total_authorized_shares: 1000000, common_shares_outstanding: 200000000, fiscal_year_start_date: "2026-01-01", current_fiscal_year_label: "FY2026", burn_rate_limit_bps: 500, fungible_ratio_full_value_bps: 15000, low_reserve_threshold_bps: 0 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { plan_id: $.data.id }
            - call: "POST /participants"
              payload: { full_name: "Dan Cover", employee_number: "E-2882-04", home_country_code: "US", home_state_code: "NY", hire_date: "2018-04-02", birth_date: "1988-11-30" }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { p_id: $.data.id }
            - call: "POST /trading-windows"
              payload: { plan_id: "${plan_id}", quarter_label: "FY2026-Q1", open_at: "2026-01-05T00:00:00Z", close_at: "2026-03-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
              captures: { w1_id: $.data.id }
            - call: "POST /trading-windows/${w1_id}/status"
              payload: { action: "OPEN" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
            - call: "POST /grants"
              payload: { plan_id: "${plan_id}", participant_id: "${p_id}", award_type: "RSU", target_shares: 1500 }
              as: PlanAdministrator
              as_user_id: "admin-1"
              captures: { g_id: $.data.id }
            - call: "POST /grants/${g_id}/vesting-tranches"
              payload: { tranche_index: 1, vest_type: "TIME", scheduled_vest_date: "2026-07-01", target_shares: 1500 }
