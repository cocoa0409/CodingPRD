        distinguishing_aspect: "The two PurchaseAgreement dimensions never write to each other: the sweep moves rescission_status OPEN -> EXPIRED and leaves fulfillment_status AWAITING_FUNDING, and funding then moves fulfillment_status to FUNDED and leaves rescission_status EXPIRED. Because this is an all-cash contract (down_payment == total_due) the doc stamp and closing fee are both zeroed and funding is accepted with collected_amount_cents 0 and NO financing application at all."
