      - name: safety_reviewer_alone_may_restrict_a_part_or_decide_a_review_and_others_are_rejected
        claim_type: exclusive_operations
        grounds:
          - roles.SafetyReviewer.exclusive_operations
          - roles.DocumentationEngineer.notes
          - validations[priority=8]
          - endpoints[POST /repair-program/part-catalog-items/{part_id}/restrict]
        distinguishing_aspect: |
          The role that owns the safety cascade cannot create the catalog row it
          restricts, and the role that authors documentation cannot decide or
          publish it — the two write sets are disjoint in both directions.
        test_recipe:
          setup:
            - "Model CRX-R2 and PUBLISHED part SKU-R2-A created by the admin."
          setup_api_calls:
            - call: "POST /repair-program/product-models"
