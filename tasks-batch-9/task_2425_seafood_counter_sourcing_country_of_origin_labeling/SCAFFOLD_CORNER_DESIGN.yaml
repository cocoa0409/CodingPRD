              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "GET /seafood-ops/lots/${lot_id}"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_v: $.data.version }
            - call: "POST /seafood-ops/case-labels"
              payload: { lot_id: "${lot_id}", expected_lot_version: "${lot_v}" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { label_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/record-sales"
              payload: { sold_weight_kg: 4.000 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
          trigger:
            - call: "POST /seafood-ops/lots/${lot_id}/record-sales"
              payload: { sold_weight_kg: 6.001 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { e_sales: $.data.error_id }
            - call: "POST /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_id}", reason: "UNSOLD_FRESH", shrink_weight_kg: 6.500 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { e_shrink: $.data.error_id }
            - call: "POST /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_id}", reason: "UNSOLD_FRESH", shrink_weight_kg: 6.000 }
              as: SeafoodManager
