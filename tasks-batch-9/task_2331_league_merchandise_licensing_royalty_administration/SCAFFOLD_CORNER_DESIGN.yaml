          - concurrency_rules.authorization-create-stale-licensee
          - validations.priority_11
          - errors.ERR_STALE_LICENSEE_VERSION
        distinguishing_aspect: |
          Retailer authorizations guard the LICENSEE version, and a status
          transition on the licensee is exactly the kind of write that invalidates
          a held version: a version read while the row was PROSPECT is a 412
          ERR_STALE_LICENSEE_VERSION after ACTIVATE, with its own error id
          distinct from the agreement and run variants. Priority 11 also puts this
          ahead of the retailer-window check, so no PENDING row is created.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_R3 is created (version 1, PROSPECT); its version is captured; then it is ACTIVATED, which bumps the version"
