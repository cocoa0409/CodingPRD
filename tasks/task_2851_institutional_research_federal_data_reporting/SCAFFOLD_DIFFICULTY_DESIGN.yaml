      - name: publication_half_open_windows_allow_shared_boundary_instant
        grounds:
          - calculations.publication_window_overlap
          - validations[priority=26]
          - errors[ERR_PUBLICATION_WINDOW_OVERLAP]
          - entities.DashboardPublication.fields.effective_from
          - entities.DashboardPublication.fields.effective_to
          - state_machines.DashboardPublication.PUBLISHED_to_WITHDRAWN
        distinguishing_aspect: |
          Publication windows are HALF-OPEN instant intervals scoped to
          (component_id, metric_key), so a successor starting at exactly the incumbent's
          effective_to instant is accepted - the opposite verdict to the shared endpoint in
          frozen_file_closed_coverage_windows_reject_shared_end_date - while an interior
          window is rejected and withdrawing the incumbent frees its window for exact reuse.
        test_recipe:
          setup:
            - "ReportingCycle IPEDS-2027 is FROZEN with one CERTIFIED ENROLLMENT component."
            - "Publication P1 for metric_key TOTAL_HEADCOUNT_FALL is PUBLISHED over the half-open window 2026-11-01T00:00:00Z to 2026-12-01T00:00:00Z."
