        distinguishing_aspect: "Re-activating the same ACTIVE hold returns ERR_HOLD_STATE_INVALID (409) — not ERR_SERIES_ALREADY_ON_HOLD, whose condition requires a DIFFERENT active hold — and the series version does not advance a second time."
