    instances:
      - name: run_cancel_restores_program_committed_budget_cents
        grounds:
          - calculations.commitment_ledger_reconciliation
          - state_machines.ProductionRun.SCHEDULED_to_CANCELLED
          - entities.BrandProgram.fields.committed_budget_cents
