    instances:
      - name: hold_vacated_hearing_state_error_precedes_notice_safety_error
        grounds:
          - validations[priority=36]
          - validations[priority=58]
          - state_machines.PublicHearing.SCHEDULED_to_VACATED
          - entities.PublicHearing.fields.notice_published_at
