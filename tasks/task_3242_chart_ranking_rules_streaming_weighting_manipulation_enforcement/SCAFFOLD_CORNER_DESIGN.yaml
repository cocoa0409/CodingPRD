scaffold_corner_design:
  - section: entities
    instances:
      - name: create_chart_requires_recurrent_rule_fk
        claim_type: required_field
        grounds: [entities.Chart.fields.recurrent_rule_id, "endpoints[POST /charts]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /charts with a recurrent_rule_id that does not resolve returns ERR_NOT_FOUND (404); Chart carries the FK at creation."
        test_recipe:
          setup: ["a recurrent rule exists; a bogus rule id is used in the create call"]
          setup_api_calls:
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-C1", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
          trigger:
            - call: "POST /charts"
              payload: { chart_code: "SNG-C1", title: "Singles C1", chart_kind: "SINGLES", chart_scope: "MAIN", recurrent_rule_id: "00000000-0000-0000-0000-000000000000" }
              as: ChartManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 and error_id == ERR_NOT_FOUND"

      - name: genre_chart_requires_genre_tag_main_forbids_it
        claim_type: type_constraint
        grounds: [entities.Chart.fields.genre_tag, entities.Chart.fields.chart_scope]
        distinguishing_aspect: "GENRE chart created without genre_tag (or MAIN chart with genre_tag) violates the conditional required/forbidden constraint; server rejects the create."
        test_recipe:
          setup: ["recurrent rule exists"]
          setup_api_calls:
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-C2", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
          trigger:
            - call: "POST /charts"
              payload: { chart_code: "GEN-C2", title: "Genre C2", chart_kind: "SINGLES", chart_scope: "GENRE", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { err1: $.data.error_id }
            - call: "POST /charts"
              payload: { chart_code: "MAIN-C2", title: "Main C2", chart_kind: "SINGLES", chart_scope: "MAIN", genre_tag: "pop", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { err2: $.data.error_id }
          assert:
            - "first create (GENRE without genre_tag) rejected 4xx"
            - "second create (MAIN with genre_tag) rejected 4xx"

      - name: sale_batch_default_countable_units_computed_ignores_input
        claim_type: computed_field
        grounds: [entities.SaleBatch.fields.countable_units, calculations.countable_album_units]
        distinguishing_aspect: "countable_units is computed: creating a TICKET_BUNDLE batch yields countable_units == 0 regardless of quantity; caller cannot inject a countable value."
        test_recipe:
          setup: ["label, album title, chart, OPEN week"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /labels"
              payload: { legal_name: "Label E3", account_code: "LBL-E3" }
              as: PlatformAdmin
              captures: { lbl_id: $.data.id }
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-E3", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /titles"
              payload: { upc: "UPC-E3", title: "Album E3", artist_name: "A", product_kind: "ALBUM", genre_tag: "pop", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
              captures: { t_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "ALB-E3", title: "Albums E3", chart_kind: "ALBUMS", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { wk_id: $.data.id }
          trigger:
            - call: "POST /titles/${t_id}/sale-batches"
              payload: { channel: "TICKET_BUNDLE", quantity: 50, buyer_key: "buyer-t", chart_week_id: "${wk_id}" }
              as: ChartOps
              captures: { b_id: $.data.id, b_count: $.data.countable_units }
          assert:
            - "SaleBatch.${b_id}.countable_units == 0 (TICKET_BUNDLE never countable despite quantity 50)"

      - name: get_missing_title_returns_not_found
        claim_type: not_found
        grounds: ["endpoints[GET /titles/{id}]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /titles/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChartManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 and error_id == ERR_NOT_FOUND"

      - name: list_endpoints_paginate_with_envelope_fields
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /titles]"]
        distinguishing_aspect: "GET /titles?limit=1&offset=0 returns response_type array with pagination fields limit/offset/total_count/has_more; defaults limit=10."
        test_recipe:
          setup: ["one label and two titles exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /labels"
              payload: { legal_name: "Label E5", account_code: "LBL-E5" }
              as: PlatformAdmin
              captures: { lbl_id: $.data.id }
            - call: "POST /titles"
              payload: { upc: "UPC-E5-1", title: "T1", artist_name: "A", product_kind: "TRACK", genre_tag: "pop", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
            - call: "POST /titles"
              payload: { upc: "UPC-E5-2", title: "T2", artist_name: "A", product_kind: "TRACK", genre_tag: "pop", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
          trigger:
            - call: "GET /titles"
              payload: { limit: 1, offset: 0 }
              as: ChartManager
              captures: { page: $.data }
          assert:
            - "response envelope carries limit == 1, offset == 0, total_count == 2, has_more == true"

  - section: state_machines
    instances:
      - name: report_double_accept_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.ConsumptionReport, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Accepting an already-ACCEPTED report is not a declared transition from ACCEPTED; second accept returns ERR_INVALID_STATE (409) and no side effects fire."
        test_recipe:
          setup: ["OPEN week, eligible title, ACTIVE DOMESTIC STREAM_ON_DEMAND provider, one ACCEPTED report"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /labels"
              payload: { legal_name: "Label S1", account_code: "LBL-S1" }
              as: PlatformAdmin
              captures: { lbl_id: $.data.id }
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-S1", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /titles"
              payload: { upc: "UPC-S1", title: "Song S1", artist_name: "A", product_kind: "TRACK", genre_tag: "pop", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
              captures: { t_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "SNG-S1", title: "Singles S1", chart_kind: "SINGLES", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { wk_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_code: "DSP-S1", display_name: "DSP S1", feed_kind: "STREAM_ON_DEMAND", territory: "DOMESTIC" }
              as: PlatformAdmin
              captures: { pv_id: $.data.id }
            - call: "POST /providers/${pv_id}/reports"
              payload: { title_product_id: "${t_id}", chart_week_id: "${wk_id}", component_kind: "STREAM_ON_DEMAND_PAID", quantity: 2500, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "s1-a" }
              as: DataProvider
              as_user_id: "${pv_id}"
              captures: { r_id: $.data.id }
            - call: "POST /consumption-reports/${r_id}/accept"
              payload: {}
              as: ChartOps
          trigger:
            - call: "POST /consumption-reports/${r_id}/accept"
              payload: {}
              as: ChartOps
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_INVALID_STATE"
            - "ConsumptionReport.${r_id}.status == ACCEPTED (unchanged)"

      - name: week_lock_before_close_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ChartWeek.OPEN_to_LOCKED, "validations[priority=8]", "errors[ERR_WEEK_NOT_CLOSED]"]
        distinguishing_aspect: "Locking an OPEN week while the logical clock is before closes_at fails with ERR_WEEK_NOT_CLOSED; after clock passes closes_at the same call succeeds."
        test_recipe:
          setup: ["chart (no methodology needed), OPEN week [2026-09-04, 2026-09-11); clock at 2026-09-05"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-S2", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "SNG-S2", title: "Singles S2", chart_kind: "SINGLES", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { wk_id: $.data.id }
          trigger:
            - call: "POST /chart-weeks/${wk_id}/lock"
              payload: {}
              as: ChartManager
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chart-weeks/${wk_id}/lock"
              payload: {}
              as: ChartManager
              captures: { st: $.data.status }
          assert:
            - "first lock: 409 ERR_WEEK_NOT_CLOSED"
            - "second lock after close: ChartWeek.${wk_id}.status == LOCKED"

      - name: compute_without_active_methodology_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ChartWeek.LOCKED_to_COMPUTED, "validations[priority=9]", "errors[ERR_NO_ACTIVE_METHODOLOGY]"]
        distinguishing_aspect: "Compute on a LOCKED week of a chart with no ACTIVE methodology returns ERR_NO_ACTIVE_METHODOLOGY."
        test_recipe:
          setup: ["chart with a DRAFT (never activated) methodology; week locked"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-S3", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "SNG-S3", title: "Singles S3", chart_kind: "SINGLES", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/methodology-versions"
              payload: { version_label: "v1", w_sales: 1.0, w_on_demand: 0.5, w_programmed: 0.2, w_airplay: 0.0001, paid_stream_divisor: 1250, ad_stream_divisor: 3750, prog_stream_divisor: 2500, tea_rate: 10, effective_from: "2026-09-01T00:00:00Z" }
              as: ChartManager
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { wk_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chart-weeks/${wk_id}/lock"
              payload: {}
              as: ChartManager
          trigger:
            - call: "POST /chart-weeks/${wk_id}/compute"
              payload: {}
              as: ChartManager
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_NO_ACTIVE_METHODOLOGY"
            - "ChartWeek.${wk_id}.status == LOCKED (unchanged)"

      - name: terminal_states_lockdown_dispute_and_report
        claim_type: terminal_state_lockdown
        grounds: [state_machines.GenreDispute, state_machines.ConsumptionReport, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "From RESOLVED_UPHELD no further review/resolve transition exists (ERR_INVALID_STATE); from REJECTED no accept transition exists."
        test_recipe:
          setup: ["GENRE chart, title genre pop owned by label, dispute FILED -> UNDER_REVIEW -> RESOLVED_UPHELD; plus a REJECTED report"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /labels"
              payload: { legal_name: "Label S4", account_code: "LBL-S4" }
              as: PlatformAdmin
              captures: { lbl_id: $.data.id }
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-S4", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /titles"
              payload: { upc: "UPC-S4", title: "Song S4", artist_name: "A", product_kind: "TRACK", genre_tag: "pop", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
              captures: { t_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "GEN-S4", title: "Country S4", chart_kind: "SINGLES", chart_scope: "GENRE", genre_tag: "country", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { wk_id: $.data.id }
            - call: "POST /genre-disputes"
              payload: { title_product_id: "${t_id}", chart_id: "${ch_id}", filed_by_label_id: "${lbl_id}", claimed_genre: "country" }
              as: LabelRep
              as_user_id: "${lbl_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /genre-disputes/${dsp_id}/review"
              payload: {}
              as: ChartOps
            - call: "POST /genre-disputes/${dsp_id}/resolve"
              payload: { resolution: "UPHOLD" }
              as: ChartManager
            - call: "POST /providers"
              payload: { provider_code: "DSP-S4", display_name: "DSP S4", feed_kind: "STREAM_ON_DEMAND", territory: "DOMESTIC" }
              as: PlatformAdmin
              captures: { pv_id: $.data.id }
            - call: "POST /providers/${pv_id}/reports"
              payload: { title_product_id: "${t_id}", chart_week_id: "${wk_id}", component_kind: "STREAM_ON_DEMAND_PAID", quantity: 2500, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "s4-a" }
              as: DataProvider
              as_user_id: "${pv_id}"
              captures: { r_id: $.data.id }
            - call: "POST /consumption-reports/${r_id}/reject"
              payload: { reason: "bad data" }
              as: ChartOps
          trigger:
            - call: "POST /genre-disputes/${dsp_id}/review"
              payload: {}
              as: ChartOps
              captures: { err1: $.data.error_id }
            - call: "POST /consumption-reports/${r_id}/accept"
              payload: {}
              as: ChartOps
              captures: { err2: $.data.error_id }
          assert:
            - "review on RESOLVED_UPHELD dispute: 409 ERR_INVALID_STATE"
            - "accept on REJECTED report: 409 ERR_INVALID_STATE"

      - name: publish_assigns_rank_tiebreak_by_title_created_at
        claim_type: side_effect_execution
        grounds: [state_machines.ChartWeek.COMPUTED_to_PUBLISHED, calculations.recurrent_weeks_count]
        distinguishing_aspect: "Publish sorts entries points DESC and breaks exact points ties by title created_at ASC (earlier-created title ranks higher); weeks_on_chart and peak_rank are written."
        test_recipe:
          setup: ["singles chart, ACTIVE methodology; two TRACK titles T_OLD (created first) and T_NEW, each with identical ACCEPTED inputs (sales 10 only) so points tie exactly; week locked and computed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /labels"
              payload: { legal_name: "Label S5", account_code: "LBL-S5" }
              as: PlatformAdmin
              captures: { lbl_id: $.data.id }
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-S5", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /titles"
              payload: { upc: "UPC-S5-OLD", title: "Old", artist_name: "A", product_kind: "TRACK", genre_tag: "pop", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
              captures: { t_old: $.data.id }
            - call: "POST /titles"
              payload: { upc: "UPC-S5-NEW", title: "New", artist_name: "A", product_kind: "TRACK", genre_tag: "pop", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
              captures: { t_new: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "SNG-S5", title: "Singles S5", chart_kind: "SINGLES", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/methodology-versions"
              payload: { version_label: "v1", w_sales: 1.0, w_on_demand: 0.5, w_programmed: 0.2, w_airplay: 0.0001, paid_stream_divisor: 1250, ad_stream_divisor: 3750, prog_stream_divisor: 2500, tea_rate: 10, effective_from: "2026-09-01T00:00:00Z" }
              as: ChartManager
              captures: { mv_id: $.data.id }
            - call: "POST /charts/${ch_id}/methodology-versions/${mv_id}/activate"
              payload: { expected_chart_version: "${ch_ver}" }
              as: ChartManager
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { wk_id: $.data.id }
            - call: "POST /providers"
              payload: { provider_code: "POS-S5", display_name: "POS S5", feed_kind: "SALES", territory: "DOMESTIC" }
              as: PlatformAdmin
              captures: { pv_id: $.data.id }
            - call: "POST /providers/${pv_id}/reports"
              payload: { title_product_id: "${t_old}", chart_week_id: "${wk_id}", component_kind: "SALES", quantity: 10, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "s5-old" }
              as: DataProvider
              as_user_id: "${pv_id}"
              captures: { r_old: $.data.id }
            - call: "POST /providers/${pv_id}/reports"
              payload: { title_product_id: "${t_new}", chart_week_id: "${wk_id}", component_kind: "SALES", quantity: 10, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "s5-new" }
              as: DataProvider
              as_user_id: "${pv_id}"
              captures: { r_new: $.data.id }
            - call: "POST /consumption-reports/${r_old}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /consumption-reports/${r_new}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /chart-weeks/${wk_id}/lock"
              payload: {}
              as: ChartManager
            - call: "POST /chart-weeks/${wk_id}/compute"
              payload: {}
              as: ChartManager
          trigger:
            - call: "POST /chart-weeks/${wk_id}/publish"
              payload: {}
              as: ChartManager
              captures: { entries: $.data }
          assert:
            - "entry for ${t_old}: rank == 1, weeks_on_chart == 1, peak_rank == 1 (created earlier wins the tie)"
            - "entry for ${t_new}: rank == 2, weeks_on_chart == 1, peak_rank == 2"
            - "both entries have points == 10.0000"

      - name: recurrent_sweep_removes_overstay_entry
        claim_type: side_effect_execution
