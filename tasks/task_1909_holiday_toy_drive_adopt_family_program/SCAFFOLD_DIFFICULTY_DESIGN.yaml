  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: gift_receive_four_hop_cascade
        grounds:
          - state_machines.Gift.COMMITTED_to_RECEIVED
          - state_machines.Adoption.CONFIRMED_to_PARTIALLY_RECEIVED
          - state_machines.Child.ADOPTED_to_GIFT_RECEIVED
          - state_machines.Family.MATCHED_to_PARTIALLY_FULFILLED
          - calculations.family_fulfillment_rollup
        distinguishing_aspect: |
          Depth-4 chain originating from POST /gifts/{id}/receive:
          Gift.RECEIVED -> WishItem.RECEIVED -> Child.GIFT_RECEIVED ->
          Family.PARTIALLY_FULFILLED (+ Donor.giving_history_cents increment).
          Each hop is CAUSED by the previous hop's side_effect, not by the
          original trigger.
