            - "second create succeeds at exactly the 45-day boundary (>= is inclusive)"
            - "Campaign.${camp_b}.provisional_unit_cost_cents == 1711 (ceil((850+120)/0.62)=1565 plus ceil(4000*365/10000)=146 changeover amortization)"
            - "half-open adjacency means a same-composition successor could start 2029-03-01 with zero gap (covered in corner design)"

      - name: license_closed_interval_inclusive_end_conflicts
        grounds:
          - validations[priority=15]
          - errors[ERR_LICENSE_TERM_OVERLAP]
          - state_machines.License.NEGOTIATION_to_ACTIVE
        distinguishing_aspect: |
          Resource = License keyed by (device_maker_id, market), interval semantics =
          CLOSED intervals [effective_date, expiry_date] with inclusive ends — the
          exact opposite adjacency rule from tank campaigns: a successor whose
