  - rule_id: transitive_cascade
    instances:
      - name: expire_to_hold_to_customer_strike_to_standing
        grounds:
          - state_machines.Order.AWAITING_PICKUP_to_EXPIRED
          - state_machines.Hold.ACTIVE_to_EXPIRED
          - entities.Customer.fields.no_show_strikes
          - entities.Customer.fields.pickup_standing
          - calculations.no_show_risk_posture
        distinguishing_aspect: |
          Depth-3 cascade from the EXPIRE trigger: POST /orders/{id}/expire moves Order
          AWAITING_PICKUP→EXPIRED (link 1); that Order transition causes Hold ACTIVE→EXPIRED
          (link 2, caused by the order ending); the hold expiry causes Customer.no_show_strikes
          to increment (link 3); the strike increment causes pickup_standing to recompute
          (link 4) — each hop caused by the previous, not by the original call.
        test_recipe:
          setup:
            - "Order O at store S (hold_window 120), one line P x1 picked, AWAITING_PICKUP; Hold active staged 10:00 expires 12:00"
            - "Customer starts at no_show_strikes=1 (one prior expiry), pickup_standing GOOD"
