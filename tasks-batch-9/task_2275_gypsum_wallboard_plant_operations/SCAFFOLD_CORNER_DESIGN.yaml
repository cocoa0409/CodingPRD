            - "§1.5 declares no PATCH, PUT or DELETE route under /plant-ops/stucco-tests"
            - "StuccoTest.${st_id}.sample_seq == 1 and a repeat sample_seq 1 on the same batch would return ERR_INVALID_REQUEST"

      - name: create_lot_with_invalid_source_type_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.GypsumLot.fields.source_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          source_type is constrained to SYNTHETIC | NATURAL, so RECYCLED is rejected with
          ERR_INVALID_REQUEST (400) and no lot is created — the enum is closed even though the
          disposition rule only branches on the two declared values.
        test_recipe:
          setup:
            - "Plant GYP-1 exists."
          setup_api_calls:
            - call: "POST /plant-ops/plants"
              payload: { code: "GYP-1", name: "Front Range Wallboard", calciner_capacity_tph: 60, stucco_silo_capacity_tons: 1200, energy_price_per_mmbtu: 4.20, contribution_margin_per_msf: 38.50 }
