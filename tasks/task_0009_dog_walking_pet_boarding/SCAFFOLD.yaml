scenario: |
  9. Dog Walking & Pet Boarding Platform (Rover/Wag style): Sitter background
  check, GPS tracking, key handoff, recurring schedule, Meet & Greet, insurance
  claims, emergency contact, Sitter Tier

domain_name: "dog-walking-pet-boarding"
api_prefix: "/api/v1"

complexity_profile:
  primary_archetype: "Workflow orchestration"
  secondary_archetype: "Compliance / audit"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Derived field reconciliation"
    - "Scheduled / deferred actions"

  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entities
# =============================================================================
entities:

  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique account email."
        constraints: "Unique across Owners; non-empty."
      - name: full_name
        type: string
        source: input
        description: "Owner full name."
      - name: phone
        type: string
        source: input
        description: "E.164 phone number."
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: "Refund-credit balance owned by this Owner; debited when applied to a Booking, credited when a Booking is CANCELLED with refund_destination=WALLET. Starts at 0; never negative."
        default: 0
        constraints: ">= 0"

  - name: Sitter
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique account email."
        constraints: "Unique across Sitters."
      - name: full_name
        type: string
        source: input
        description: "Sitter full name."
      - name: phone
        type: string
        source: input
        description: "E.164 phone number."
      - name: status
        type: enum
        source: system
        description: "Sitter onboarding/operational status."
        default: APPLIED
        constraints: "One of: APPLIED, BG_CHECK_PENDING, ACTIVE, SUSPENDED, DEACTIVATED."
      - name: tier
        type: enum
        source: computed
        description: "Sitter tier derived from tier_score per sitter_tier_score calculation."
        default: BRONZE
        constraints: "One of: BRONZE, SILVER, GOLD."
      - name: tier_score
        type: integer
        source: computed
        description: "Composite weighted score in [0, 100] produced by sitter_tier_score (§1.3). Recomputed whenever total_completed_bookings, claim_count, total_rating_sum, or total_rating_count changes."
        default: 10
        constraints: "0 <= tier_score <= 100"
      - name: total_completed_bookings
        type: integer
        source: computed
        description: "Count of Bookings with status==COMPLETED whose sitter_id == this Sitter.id."
        default: 0
        constraints: ">= 0"
      - name: total_rating_sum
        type: integer
        source: computed
        description: "Sum of Booking.owner_rating for this Sitter's COMPLETED Bookings whose owner_rating is non-null."
        default: 0
      - name: total_rating_count
        type: integer
        source: computed
        description: "Count of this Sitter's COMPLETED Bookings whose owner_rating is non-null."
        default: 0
      - name: claim_count
        type: integer
        source: computed
        description: "Count of InsuranceClaims with status==PAID whose sitter_id == this Sitter.id (via Booking.sitter_id)."
        default: 0
      - name: pending_payout_cents
        type: integer
        source: computed
        description: "Reserved payouts on this Sitter's CONFIRMED/IN_PROGRESS Bookings. Reduced when a Booking COMPLETES (sitter_payout_cents released) or CANCELS (reservation reversed)."
        default: 0
        constraints: ">= 0"
      - name: suspended_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp when status was last set to SUSPENDED; null when never suspended or after reinstatement."
        default: null

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - name: sitter_id
        type: string
        source: input
        description: "FK -> Sitter.id; the Sitter under check. Exactly one BackgroundCheck row per Sitter (uniqueness enforced)."
      - name: provider
        type: enum
        source: input
        description: "Vendor that conducts the check."
        constraints: "One of: CHECKR, ACCURATE, FIRST_ADVANTAGE."
      - name: status
        type: enum
        source: system
        description: "Background check disposition."
        default: PENDING
        constraints: "One of: PENDING, CLEARED, FLAGGED."
      - name: cleared_at
        type: datetime
        source: system
        description: "ISO 8601 UTC timestamp of CLEARED transition; null otherwise."
        default: null
      - name: flagged_reason
        type: string
        source: input
        description: "Adjuster-supplied reason on FLAG transition; null otherwise."
        default: null

  - name: Pet
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the Pet's owner."
      - name: name
        type: string
        source: input
        description: "Pet name."
      - name: species
        type: enum
        source: input
        description: "Pet species."
        constraints: "One of: DOG, CAT."
      - name: weight_kg
        type: number
        source: input
        description: "Weight in kilograms, used by booking_quote (large pets surcharge in v2; recorded now)."
        constraints: "> 0"
      - name: medical_notes
        type: string
        source: input
        description: "Free-text medical notes."
        default: ""

  - name: EmergencyContact
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the Owner this contact serves."
      - name: full_name
        type: string
        source: input
        description: "Emergency contact full name."
      - name: phone
        type: string
        source: input
        description: "E.164 phone for the contact."
      - name: relationship
        type: enum
        source: input
        description: "Relationship label."
        constraints: "One of: SPOUSE, PARENT, FRIEND, VET, NEIGHBOR, OTHER."
      - name: priority
        type: integer
        source: input
        description: "1=primary, 2=secondary, 3=tertiary. At most one priority=1 contact per Owner."
        constraints: "1 <= priority <= 3"

  - name: MeetAndGreet
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the requesting Owner."
      - name: sitter_id
        type: string
        source: input
        description: "FK -> Sitter.id; the candidate Sitter."
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the pet being introduced."
      - name: scheduled_at
        type: datetime
        source: input
        description: "ISO 8601 UTC when the meet & greet is scheduled."
      - name: status
        type: enum
        source: system
        description: "Meet & Greet lifecycle status."
        default: SCHEDULED
        constraints: "One of: SCHEDULED, COMPLETED_APPROVED, COMPLETED_DECLINED, NO_SHOW, CANCELLED."
      - name: decided_at
        type: datetime
        source: system
        description: "ISO 8601 UTC of the SCHEDULED→COMPLETED_*/NO_SHOW/CANCELLED transition."
        default: null
      - name: notes
        type: string
        source: input
        description: "Free-text notes set on the deciding transition."
        default: ""

  - name: Booking
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the requesting Owner."
      - name: sitter_id
        type: string
        source: input
        description: "FK -> Sitter.id; the booked Sitter."
      - name: pet_id
        type: string
        source: input
        description: "FK -> Pet.id; the pet under care."
      - name: service_type
        type: enum
        source: input
        description: "Type of service."
        constraints: "One of: WALK_30MIN, WALK_60MIN, BOARDING_OVERNIGHT, DAYCARE."
      - name: time_of_day
        type: enum
        source: input
        description: "Time bucket used by booking_quote (§1.3)."
        constraints: "One of: STANDARD, PEAK, OVERNIGHT."
      - name: recurring_cadence
        type: enum
        source: input
        description: "Recurring discount tier used by booking_quote (§1.3). NONE means no discount."
        default: NONE
        constraints: "One of: NONE, WEEKLY, BIWEEKLY."
      - name: start_at
        type: datetime
        source: input
        description: "ISO 8601 UTC service start (inclusive)."
      - name: end_at
        type: datetime
        source: input
        description: "ISO 8601 UTC service end (exclusive); end_at > start_at."
      - name: status
        type: enum
        source: system
        description: "Booking lifecycle status."
        default: REQUESTED
        constraints: "One of: REQUESTED, CONFIRMED, KEY_RECEIVED, IN_PROGRESS, COMPLETED, CANCELLED, REJECTED, EMERGENCY_TERMINATED."
      - name: emergency_surcharge_cents
        type: integer
        source: input
        description: "Caller-declared emergency-booking surcharge (0 by default; ≥ 0). Folded into booking_quote_cents per §1.3."
        default: 0
        constraints: ">= 0"
      - name: booking_quote_cents
        type: integer
        source: computed
        description: "Output of booking_quote (§1.3) at CREATE time. Recomputed when Sitter.tier changes for upcoming Bookings (status==REQUESTED or CONFIRMED) per cascade in §1.2."
        default: 0
        constraints: ">= 0"
      - name: provisional_sitter_payout_cents
        type: integer
        source: computed
        description: "Output of sitter_payout (provisional variant, §1.3) at CONFIRM. Released to Sitter on COMPLETE."
        default: 0
        constraints: ">= 0"
      - name: final_sitter_payout_cents
        type: integer
        source: computed
        description: "Output of sitter_payout (final variant, §1.3) at COMPLETE; folds in tip_cents and incident_deduction_cents."
        default: 0
        constraints: ">= 0"
      - name: tip_cents
        type: integer
        source: input
        description: "Optional tip on COMPLETE transition. Folded into final variant only."
        default: 0
        constraints: ">= 0"
      - name: incident_deduction_cents
        type: integer
        source: input
        description: "Optional incident deduction on COMPLETE transition (e.g., late return). Folded into final variant only."
        default: 0
        constraints: ">= 0"
      - name: owner_rating
        type: integer
        source: input
        description: "Owner rating on COMPLETE. Null when omitted. Folded into Sitter.total_rating_sum/count."
        default: null
        constraints: "1 <= owner_rating <= 5 when present"
      - name: wallet_credit_applied_cents
        type: integer
        source: input
        description: "Owner wallet credit applied at create time. Debited from Owner.wallet_credit_cents on REQUEST; restored on CANCEL/REJECT."
        default: 0
        constraints: ">= 0; must not exceed booking_quote_cents and must not exceed current Owner.wallet_credit_cents."
      - name: cancellation_reason
        type: string
        source: input
        description: "Free-text on CANCELLED / REJECTED / EMERGENCY_TERMINATED transition; null otherwise."
        default: null

  - name: KeyHandoff
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this handoff serves. Exactly one row per Booking (uniqueness enforced)."
      - name: method
        type: enum
        source: input
        description: "How the key is exchanged."
        constraints: "One of: LOCKBOX, IN_PERSON, SMART_LOCK."
      - name: status
        type: enum
        source: system
        description: "Handoff status."
        default: PENDING
        constraints: "One of: PENDING, RECEIVED, RETURNED, LOST."
      - name: lockbox_code
        type: string
        source: input
        description: "Lockbox combination when method==LOCKBOX; null otherwise."
        default: null
      - name: received_at
        type: datetime
        source: system
        description: "ISO 8601 UTC of PENDING→RECEIVED transition; null otherwise."
        default: null

  - name: GpsTrack
    parent: null
    common_fields: false
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking this track point belongs to."
      - name: latitude
        type: number
        source: input
        description: "Decimal degrees."
        constraints: "-90 <= latitude <= 90"
      - name: longitude
        type: number
        source: input
        description: "Decimal degrees."
        constraints: "-180 <= longitude <= 180"
      - name: recorded_at
        type: datetime
        source: input
        description: "ISO 8601 UTC sample time."

  - name: InsuranceClaim
    parent: null
    common_fields: true
    fields:
      - name: booking_id
        type: string
        source: input
        description: "FK -> Booking.id; the booking the incident occurred on. Booking.status MUST be IN_PROGRESS, COMPLETED, or EMERGENCY_TERMINATED at SUBMIT."
      - name: sitter_id_snapshot
        type: string
        source: system
        description: "FK -> Sitter.id; copied from Booking.sitter_id at SUBMIT. Used as the sitter dimension for claim_payout (§1.3)."
      - name: sitter_tier_snapshot
        type: enum
        source: system
        description: "Sitter.tier snapshot at SUBMIT. Pinned so that later tier changes do not retroactively change the deductible."
        constraints: "One of: BRONZE, SILVER, GOLD."
      - name: claim_amount_cents
        type: integer
        source: input
        description: "Owner-declared incident cost."
        constraints: "> 0"
      - name: approved_amount_cents
        type: integer
        source: input
        description: "Adjuster-set approved cost on APPROVE transition; null until then."
        default: null
        constraints: "0 < approved_amount_cents <= claim_amount_cents at APPROVE."
      - name: status
        type: enum
        source: system
        description: "Insurance claim lifecycle."
        default: SUBMITTED
        constraints: "One of: SUBMITTED, UNDER_REVIEW, APPROVED, PAID, DENIED, WITHDRAWN."
      - name: provisional_payout_cents
        type: integer
        source: computed
        description: "Output of claim_payout (provisional variant, §1.3) at SUBMIT. Uses claim_amount_cents."
        default: 0
        constraints: ">= 0"
      - name: final_payout_cents
        type: integer
        source: computed
        description: "Output of claim_payout (final variant, §1.3) at APPROVE. Uses approved_amount_cents."
        default: 0
        constraints: ">= 0"
      - name: adjuster_notes
        type: string
        source: input
        description: "Adjuster notes set on APPROVE / DENY / revert."
        default: ""
      - name: denied_reason
        type: string
        source: input
        description: "Required on DENY transition."
        default: null

# =============================================================================
# §1.2 State Machines
# =============================================================================
state_machines:

  - entity: BackgroundCheck
    initial_state: PENDING
    terminal_states: [CLEARED, FLAGGED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /api/v1/background-checks/{id}/clear"
        actor: PlatformAdmin
        preconditions:
          - "BackgroundCheck.status == PENDING"
        side_effects:
          - "BackgroundCheck.cleared_at := system_clock"
          - "Sitter[id=BackgroundCheck.sitter_id].status: BG_CHECK_PENDING -> ACTIVE (bumps Sitter.version)"
          - "BackgroundCheck.version += 1; BackgroundCheck.updated_at := system_clock"
      - from: PENDING
        to: FLAGGED
        trigger: "POST /api/v1/background-checks/{id}/flag"
        actor: PlatformAdmin
        preconditions:
          - "BackgroundCheck.status == PENDING"
          - "flagged_reason non-empty"
        side_effects:
          - "BackgroundCheck.flagged_reason := input.flagged_reason"
          - "CASCADE-LINK-2: Sitter[id=BackgroundCheck.sitter_id].status: BG_CHECK_PENDING|ACTIVE -> SUSPENDED; Sitter.suspended_at := system_clock; Sitter.version += 1"
          - "CASCADE-LINK-3 (caused by link 2): every Booking whose sitter_id==Sitter.id AND status IN {REQUESTED, CONFIRMED, KEY_RECEIVED} is auto-cancelled — Booking.status := CANCELLED, Booking.cancellation_reason := 'AUTO_SITTER_SUSPENDED', Booking.version += 1"
          - "CASCADE-LINK-4 (caused by link 3): for every Booking auto-cancelled in link 3, Owner[id=Booking.owner_id].wallet_credit_cents += Booking.booking_quote_cents - Booking.wallet_credit_applied_cents (refund principal); Owner.wallet_credit_cents += Booking.wallet_credit_applied_cents (restore previously-applied credit); Owner.version += 1; Sitter.pending_payout_cents -= Booking.provisional_sitter_payout_cents per auto-cancelled Booking"
          - "BackgroundCheck.version += 1; BackgroundCheck.updated_at := system_clock"
        note: "Originates Cascade #1 (depth 4): BackgroundCheck -> Sitter -> Bookings -> Owner.wallet."

  - entity: Sitter
    initial_state: APPLIED
    terminal_states: [DEACTIVATED]
    transitions:
      - from: APPLIED
        to: BG_CHECK_PENDING
        trigger: "POST /api/v1/background-checks (creating a BackgroundCheck for this Sitter)"
        actor: PlatformAdmin
        preconditions:
          - "Sitter.status == APPLIED"
          - "No prior BackgroundCheck exists for this Sitter"
        side_effects:
          - "Sitter.status := BG_CHECK_PENDING; Sitter.version += 1; Sitter.updated_at := system_clock"
      - from: BG_CHECK_PENDING
        to: ACTIVE
        trigger: "Side effect of BackgroundCheck PENDING -> CLEARED"
        actor: system
        preconditions:
          - "Sitter.status == BG_CHECK_PENDING"
          - "BackgroundCheck.status == CLEARED"
        side_effects:
          - "Sitter.status := ACTIVE; Sitter.version += 1; Sitter.updated_at := system_clock"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "Side effect of BackgroundCheck FLAGGED OR side effect of second InsuranceClaim PAID transition"
        actor: system
        preconditions:
          - "Sitter.status == ACTIVE"
        side_effects:
          - "Sitter.status := SUSPENDED; Sitter.suspended_at := system_clock; Sitter.version += 1; Sitter.updated_at := system_clock"
      - from: BG_CHECK_PENDING
        to: SUSPENDED
        trigger: "Side effect of BackgroundCheck FLAGGED"
        actor: system
        preconditions:
          - "Sitter.status == BG_CHECK_PENDING"
        side_effects:
          - "Sitter.status := SUSPENDED; Sitter.suspended_at := system_clock; Sitter.version += 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/v1/sitters/{id}/reinstate"
        actor: PlatformAdmin
        preconditions:
          - "Sitter.status == SUSPENDED"
        side_effects:
          - "Sitter.status := ACTIVE; Sitter.suspended_at := null; Sitter.version += 1; Sitter.updated_at := system_clock"
        note: "Cyclic: SUSPENDED -> ACTIVE re-entry (non-linear shape)."
      - from: ACTIVE
        to: DEACTIVATED
        trigger: "POST /api/v1/sitters/{id}/deactivate"
        actor: PlatformAdmin
        preconditions:
          - "Sitter.status == ACTIVE"
          - "No Booking with sitter_id==Sitter.id has status IN {REQUESTED, CONFIRMED, KEY_RECEIVED, IN_PROGRESS}"
        side_effects:
          - "Sitter.status := DEACTIVATED; Sitter.version += 1"
      - from: SUSPENDED
        to: DEACTIVATED
        trigger: "POST /api/v1/sitters/{id}/deactivate"
        actor: PlatformAdmin
        preconditions:
          - "Sitter.status == SUSPENDED"
        side_effects:
          - "Sitter.status := DEACTIVATED; Sitter.version += 1"

  - entity: MeetAndGreet
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_APPROVED, COMPLETED_DECLINED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED_APPROVED
        trigger: "POST /api/v1/meet-and-greets/{id}/approve"
        actor: Owner
        preconditions:
          - "MeetAndGreet.status == SCHEDULED"
          - "MeetAndGreet.scheduled_at <= system_clock"
          - "Sitter[id=sitter_id].status == ACTIVE"
        side_effects:
          - "MeetAndGreet.status := COMPLETED_APPROVED; MeetAndGreet.decided_at := system_clock; MeetAndGreet.version += 1"
      - from: SCHEDULED
        to: COMPLETED_DECLINED
        trigger: "POST /api/v1/meet-and-greets/{id}/decline"
        actor: Owner
        preconditions:
          - "MeetAndGreet.status == SCHEDULED"
        side_effects:
          - "MeetAndGreet.status := COMPLETED_DECLINED; MeetAndGreet.decided_at := system_clock; MeetAndGreet.version += 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /api/v1/meet-and-greets/{id}/mark-no-show"
        actor: PlatformAdmin
        preconditions:
          - "MeetAndGreet.status == SCHEDULED"
          - "system_clock >= MeetAndGreet.scheduled_at + 60 minutes"
        side_effects:
          - "MeetAndGreet.status := NO_SHOW; MeetAndGreet.decided_at := system_clock; MeetAndGreet.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/v1/meet-and-greets/{id}/cancel"
        actor: Owner
        preconditions:
          - "MeetAndGreet.status == SCHEDULED"
        side_effects:
          - "MeetAndGreet.status := CANCELLED; MeetAndGreet.decided_at := system_clock; MeetAndGreet.version += 1"

  - entity: Booking
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED, REJECTED, EMERGENCY_TERMINATED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /api/v1/bookings/{id}/confirm"
        actor: Sitter
        preconditions:
          - "Booking.status == REQUESTED"
          - "Booking.start_at > system_clock"
          - "Sitter[id=Booking.sitter_id].status == ACTIVE"
          - "BackgroundCheck.status == CLEARED for Booking.sitter_id"
          - "EXISTS MeetAndGreet WHERE owner_id==Booking.owner_id AND sitter_id==Booking.sitter_id AND pet_id==Booking.pet_id AND status==COMPLETED_APPROVED"
        side_effects:
          - "Booking.status := CONFIRMED; Booking.version += 1"
          - "Booking.provisional_sitter_payout_cents := sitter_payout(provisional variant, §1.3)"
          - "Sitter.pending_payout_cents += Booking.provisional_sitter_payout_cents; Sitter.version += 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /api/v1/bookings/{id}/reject"
        actor: Sitter
        preconditions:
          - "Booking.status == REQUESTED"
        side_effects:
          - "Booking.status := REJECTED; Booking.cancellation_reason := input.reason; Booking.version += 1"
          - "Owner.wallet_credit_cents += Booking.wallet_credit_applied_cents (restore applied credit); Owner.version += 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/v1/bookings/{id}/cancel"
        actor: Owner
        preconditions:
          - "Booking.status == REQUESTED"
        side_effects:
          - "Booking.status := CANCELLED; Booking.cancellation_reason := input.reason; Booking.version += 1"
          - "Owner.wallet_credit_cents += Booking.wallet_credit_applied_cents (restore applied credit); Owner.version += 1"
      - from: CONFIRMED
        to: KEY_RECEIVED
        trigger: "POST /api/v1/key-handoffs/{id}/receive"
        actor: Sitter
        preconditions:
          - "Booking.status == CONFIRMED"
          - "EXISTS KeyHandoff WHERE booking_id==Booking.id AND status will transition PENDING -> RECEIVED in this call"
        side_effects:
          - "KeyHandoff.status := RECEIVED; KeyHandoff.received_at := system_clock; KeyHandoff.version += 1"
          - "Booking.status := KEY_RECEIVED; Booking.version += 1"
      - from: KEY_RECEIVED
        to: IN_PROGRESS
        trigger: "POST /api/v1/bookings/{id}/start"
        actor: Sitter
        preconditions:
          - "Booking.status == KEY_RECEIVED"
          - "system_clock >= Booking.start_at"
        side_effects:
          - "Booking.status := IN_PROGRESS; Booking.version += 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/v1/bookings/{id}/complete"
        actor: Sitter
        preconditions:
          - "Booking.status == IN_PROGRESS"
          - "system_clock >= Booking.end_at"
          - "EXISTS KeyHandoff WHERE booking_id==Booking.id AND status==RECEIVED (will be flipped to RETURNED in this call)"
        side_effects:
          - "KeyHandoff.status := RETURNED; KeyHandoff.version += 1"
          - "Booking.tip_cents := input.tip_cents (>=0); Booking.incident_deduction_cents := input.incident_deduction_cents (>=0); Booking.owner_rating := input.owner_rating (1..5 or null)"
          - "Booking.final_sitter_payout_cents := sitter_payout(final variant, §1.3)"
          - "Sitter.pending_payout_cents -= Booking.provisional_sitter_payout_cents; Sitter.pending_payout_cents += Booking.final_sitter_payout_cents (released as completed payout — out of pending bucket conceptually but kept in the same accumulator for invariant purposes); Sitter.total_completed_bookings += 1; if owner_rating not null: Sitter.total_rating_sum += owner_rating, Sitter.total_rating_count += 1; trigger sitter_tier_score recompute; Sitter.version += 1"
          - "Booking.status := COMPLETED; Booking.version += 1"
      - from: IN_PROGRESS
        to: EMERGENCY_TERMINATED
        trigger: "POST /api/v1/bookings/{id}/emergency-terminate"
        actor: Sitter
        preconditions:
          - "Booking.status == IN_PROGRESS"
        side_effects:
          - "Booking.status := EMERGENCY_TERMINATED; Booking.cancellation_reason := input.reason; Booking.version += 1"
          - "Sitter.pending_payout_cents -= Booking.provisional_sitter_payout_cents (no payout on emergency termination); Sitter.version += 1"
          - "Booking.final_sitter_payout_cents := 0"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/v1/bookings/{id}/cancel"
        actor: Owner
        preconditions:
          - "Booking.status == CONFIRMED"
          - "expected_booking_version matches current Booking.version (OCC)"
        side_effects:
          - "Booking.status := CANCELLED; Booking.cancellation_reason := input.reason; Booking.version += 1"
          - "Sitter.pending_payout_cents -= Booking.provisional_sitter_payout_cents; Sitter.version += 1"
          - "Owner.wallet_credit_cents += (Booking.booking_quote_cents - Booking.wallet_credit_applied_cents) (refund principal as wallet credit); Owner.wallet_credit_cents += Booking.wallet_credit_applied_cents (restore previously applied credit). Net: Owner.wallet_credit_cents += Booking.booking_quote_cents; Owner.version += 1"

  - entity: InsuranceClaim
    initial_state: SUBMITTED
    terminal_states: [PAID, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /api/v1/insurance-claims/{id}/start-review"
        actor: ClaimsAdjuster
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
        side_effects:
          - "InsuranceClaim.status := UNDER_REVIEW; InsuranceClaim.version += 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /api/v1/insurance-claims/{id}/approve"
        actor: ClaimsAdjuster
        preconditions:
          - "InsuranceClaim.status == UNDER_REVIEW"
          - "0 < input.approved_amount_cents <= InsuranceClaim.claim_amount_cents"
        side_effects:
          - "InsuranceClaim.approved_amount_cents := input.approved_amount_cents; InsuranceClaim.adjuster_notes := input.adjuster_notes"
          - "InsuranceClaim.final_payout_cents := claim_payout(final variant, §1.3)"
          - "InsuranceClaim.status := APPROVED; InsuranceClaim.version += 1"
      - from: APPROVED
        to: UNDER_REVIEW
        trigger: "POST /api/v1/insurance-claims/{id}/revert"
        actor: ClaimsAdjuster
        preconditions:
          - "InsuranceClaim.status == APPROVED"
        side_effects:
          - "InsuranceClaim.status := UNDER_REVIEW; InsuranceClaim.approved_amount_cents := null; InsuranceClaim.final_payout_cents := 0; InsuranceClaim.version += 1"
        note: "Cyclic shape on InsuranceClaim: APPROVED -> UNDER_REVIEW revert."
      - from: APPROVED
        to: PAID
        trigger: "POST /api/v1/insurance-claims/{id}/pay"
        actor: ClaimsAdjuster
        preconditions:
          - "InsuranceClaim.status == APPROVED"
        side_effects:
          - "InsuranceClaim.status := PAID; InsuranceClaim.version += 1"
          - "CASCADE-LINK-2: Sitter[id=InsuranceClaim.sitter_id_snapshot].claim_count += 1; trigger sitter_tier_score recompute; Sitter.version += 1"
          - "CASCADE-LINK-3 (caused by link 2 — only when tier_score recompute drops Sitter.tier): for every Booking with sitter_id==Sitter.id AND status IN {REQUESTED, CONFIRMED}, Booking.booking_quote_cents := booking_quote(§1.3) using new Sitter.tier; for CONFIRMED Bookings, Booking.provisional_sitter_payout_cents := sitter_payout(provisional variant); Sitter.pending_payout_cents adjusted by delta; Booking.version += 1"
          - "CASCADE-LINK-4 (caused by link 2 — only when Sitter.claim_count crosses 2 AND Sitter.status==ACTIVE): Sitter.status := SUSPENDED (per Sitter SM); Sitter.version += 1"
        note: "Originates Cascade #2 (depth 4 in worst case)."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/v1/insurance-claims/{id}/withdraw"
        actor: Owner
        preconditions:
          - "InsuranceClaim.status == SUBMITTED"
        side_effects:
          - "InsuranceClaim.status := WITHDRAWN; InsuranceClaim.version += 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /api/v1/insurance-claims/{id}/deny"
        actor: ClaimsAdjuster
        preconditions:
          - "InsuranceClaim.status == UNDER_REVIEW"
          - "input.denied_reason non-empty"
        side_effects:
          - "InsuranceClaim.denied_reason := input.denied_reason; InsuranceClaim.adjuster_notes := input.adjuster_notes"
          - "InsuranceClaim.status := DENIED; InsuranceClaim.version += 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-cancel-stale-version
    parent_entity: Booking
    write_endpoint: "POST /api/v1/bookings/{id}/cancel"
    occ_field: "expected_booking_version"
    description: |
      Cancelling a Booking against a stale version is rejected. A cascade
      (BackgroundCheck FLAGGED → Sitter SUSPENDED → Booking auto-CANCELLED,
      or InsuranceClaim PAID → Sitter tier drop → Booking quote recomputed)
      silently advances Booking.version between the client's last read and
      this cancel. The OCC check therefore catches a writer whose view of
      the Booking is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculations
# =============================================================================
calculations:

  - name: booking_quote
    trigger: "On POST /api/v1/bookings (booking creation) and on every cascade-link-3 recompute when Sitter.tier changes."
    algorithm: tiered_pricing
    formula: |
      base_rate_cents = BASE_RATE_BY_SERVICE[Booking.service_type]
      tier_mult       = TIER_MULT[Sitter.tier]           # snapshot at compute time
      time_factor     = TIME_FACTOR[Booking.time_of_day]
      recur_discount  = RECUR_DISCOUNT[Booking.recurring_cadence]

      step1 = round_half_up(base_rate_cents * tier_mult)
      step2 = round_half_up(step1 * time_factor)
      discount_cents  = round_half_up(step2 * recur_discount)
      booking_quote_cents = step2 - discount_cents + Booking.emergency_surcharge_cents
    input_set: "A single Booking row plus the current Sitter.tier of the booked Sitter."
    constants:
      BASE_RATE_BY_SERVICE:
        WALK_30MIN: 2000
        WALK_60MIN: 3500
        BOARDING_OVERNIGHT: 8000
        DAYCARE: 5000
      TIER_MULT:
        BRONZE: 1.00
        SILVER: 1.15
        GOLD: 1.30
      TIME_FACTOR:
        STANDARD: 1.00
        PEAK: 1.20
        OVERNIGHT: 1.30
      RECUR_DISCOUNT:
        NONE: 0.00
        WEEKLY: 0.10
        BIWEEKLY: 0.05
    precision: "Integer cents, round_half_up at every named step (3 round operations: step1, step2, discount_cents)."
    variants: []

  - name: sitter_tier_score
    trigger: "Whenever Sitter.total_completed_bookings, Sitter.total_rating_sum, Sitter.total_rating_count, or Sitter.claim_count changes (i.e., side effect of Booking COMPLETED transition and InsuranceClaim PAID transition)."
    algorithm: weighted_scoring
    formula: |
      # rating: 0..100 scale
      if Sitter.total_rating_count > 0:
        avg_rating = Sitter.total_rating_sum / Sitter.total_rating_count   # float
        rating_score   = round_half_up(avg_rating * 20)                    # round-then-weight
      else:
        rating_score   = 60                                                 # neutral default

      bookings_score   = min(Sitter.total_completed_bookings, BOOKINGS_CAP)
      claim_penalty    = min(Sitter.claim_count * CLAIM_PENALTY, CLAIM_CAP)

      # Pinned rounding order: round each component first, weight, sum the
      # weighted parts, round the sum, THEN subtract penalty. The author MUST
      # apply rounds at exactly these three points — applying a single round at
      # the end produces different integer outputs.
      weighted_sum = rating_score * W_RATING + bookings_score * W_BOOKINGS + BASE
      raw          = round_half_up(weighted_sum)
      tier_score   = max(0, raw - claim_penalty)

      if tier_score >= GOLD_MIN:   tier = GOLD
      elif tier_score >= SILVER_MIN: tier = SILVER
      else:                          tier = BRONZE
    input_set: "A single Sitter row's counters."
    constants:
      W_RATING: 0.5
      W_BOOKINGS: 0.3
      BASE: 10
      CLAIM_PENALTY: 15
      CLAIM_CAP: 45
      BOOKINGS_CAP: 40
      SILVER_MIN: 40
      GOLD_MIN: 70
    precision: "Integer score; round_half_up at the two pinned points (rating_score, weighted_sum) — see formula."
    variants: []

  - name: sitter_payout
    trigger: "Provisional variant fires on Booking REQUESTED -> CONFIRMED. Final variant fires on Booking IN_PROGRESS -> COMPLETED."
    algorithm: forward_looking
    formula: |
      platform_fee_cents = round_half_up(Booking.booking_quote_cents * PLATFORM_FEE_PCT)
      # provisional variant:
      sitter_payout_cents = Booking.booking_quote_cents - platform_fee_cents
      # final variant:
      sitter_payout_cents = max(0, (Booking.booking_quote_cents - platform_fee_cents) + Booking.tip_cents - Booking.incident_deduction_cents)
    input_set: "A single Booking row."
    constants:
      PLATFORM_FEE_PCT: 0.15
    precision: "Integer cents; round_half_up on platform_fee_cents only."
    variants:
      - name: provisional
        when: "On Booking CONFIRM; tip_cents and incident_deduction_cents are not yet known."
        difference: "Ignores tip_cents and incident_deduction_cents entirely; equals booking_quote_cents - platform_fee_cents."
      - name: final
        when: "On Booking COMPLETE; tip_cents and incident_deduction_cents are now known."
        difference: "Adds tip_cents, subtracts incident_deduction_cents, floors at 0. May exceed or fall short of the provisional value."

  - name: claim_payout
    trigger: "Provisional variant fires on InsuranceClaim CREATE (SUBMITTED). Final variant fires on UNDER_REVIEW -> APPROVED."
    algorithm: tiered_pricing
    formula: |
      tier_deductible = TIER_DEDUCTIBLE[InsuranceClaim.sitter_tier_snapshot]
      # provisional variant:
      claim_payout_cents = max(0, min(InsuranceClaim.claim_amount_cents, MAX_PAYOUT_CENTS) - tier_deductible)
      # final variant (requires APPROVED state with approved_amount_cents set):
      claim_payout_cents = max(0, min(InsuranceClaim.approved_amount_cents, MAX_PAYOUT_CENTS) - tier_deductible)
    input_set: "A single InsuranceClaim row, using sitter_tier_snapshot pinned at SUBMIT (NOT the current Sitter.tier)."
    constants:
      TIER_DEDUCTIBLE:
        BRONZE: 10000
        SILVER: 5000
        GOLD: 2500
      MAX_PAYOUT_CENTS: 500000
    precision: "Integer cents; no rounding required (all integer math)."
    variants:
      - name: provisional
        when: "InsuranceClaim SUBMITTED state; uses claim_amount_cents."
        difference: "Owner-declared amount may be reduced by adjuster; provisional payout is an upper bound."
      - name: final
        when: "InsuranceClaim APPROVED state; uses approved_amount_cents."
        difference: "Reflects adjuster's approved cost; always <= provisional_payout_cents."

# =============================================================================
# §1.4 Validations (priority-ordered)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-empty."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /api/v1/owners/register, POST /api/v1/sitters/register"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for the endpoint per §1.7."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-templated id resolves to an existing entity, validated left-to-right (e.g., /bookings/{id} → Booking exists)."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: existence
    check: "FK fields in request body refer to existing entities (owner_id, sitter_id, pet_id, booking_id)."
    error_id: ERR_FK_NOT_FOUND
    http_status: 404
    applies_to: "POST endpoints with FK body fields"

  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition is allowed (per §1.2 preconditions)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC version field expected_<parent>_version matches the parent's current version (when the endpoint requires it per §1.2.1)."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /api/v1/bookings/{id}/cancel"

  - priority: 7
    category: business_safety
    check: "Sitter has a CLEARED BackgroundCheck at the time of MeetAndGreet creation and Booking confirmation."
    error_id: ERR_SITTER_NOT_CLEARED
    http_status: 422
    applies_to: ["POST /api/v1/meet-and-greets", "POST /api/v1/bookings/{id}/confirm"]

  - priority: 8
    category: business_safety
    check: "Booking creation requires an existing MeetAndGreet with status==COMPLETED_APPROVED for the (owner_id, sitter_id, pet_id) tuple AND Sitter.status==ACTIVE."
    error_id: ERR_MEET_AND_GREET_REQUIRED
    http_status: 422
    applies_to: ["POST /api/v1/bookings", "POST /api/v1/bookings/{id}/confirm"]

  - priority: 9
    category: business_referential
    check: "Pet.owner_id == Booking.owner_id at booking creation (cannot book another Owner's pet)."
    error_id: ERR_PET_OWNER_MISMATCH
    http_status: 422
    applies_to: ["POST /api/v1/bookings"]

  - priority: 10
    category: business_temporal
    check: "Sitter calendar: no existing Booking with sitter_id==input.sitter_id AND status NOT IN {COMPLETED, CANCELLED, REJECTED, EMERGENCY_TERMINATED} whose half-open [start_at, end_at + 30 minutes) overlaps the proposed half-open [start_at, end_at)."
    error_id: ERR_SITTER_TIME_CONFLICT
    http_status: 409
    applies_to: ["POST /api/v1/bookings"]
    note: "Half-open interval semantics + 30-minute trailing buffer (Sitter travel time)."

  - priority: 11
    category: business_temporal
    check: "Pet calendar: no existing Booking with pet_id==input.pet_id AND status NOT IN {COMPLETED, CANCELLED, REJECTED, EMERGENCY_TERMINATED} whose closed [start_at, end_at] inclusively intersects the proposed closed [start_at, end_at] (a pet must be in exactly one active booking at any instant)."
    error_id: ERR_PET_TIME_CONFLICT
    http_status: 409
    applies_to: ["POST /api/v1/bookings"]
    note: "Closed inclusive interval semantics; no buffer; different from Sitter overlap (priority 10)."

  - priority: 12
    category: business_constraint
    check: "EmergencyContact uniqueness: at most one EmergencyContact per Owner with priority==1."
    error_id: ERR_PRIMARY_CONTACT_EXISTS
    http_status: 409
    applies_to: ["POST /api/v1/emergency-contacts"]

  - priority: 13
    category: business_constraint
    check: "Exactly one BackgroundCheck per Sitter (create rejected when one already exists)."
    error_id: ERR_BG_CHECK_EXISTS
    http_status: 409
    applies_to: ["POST /api/v1/background-checks"]

  - priority: 14
    category: business_constraint
    check: "Exactly one KeyHandoff per Booking (create rejected when one already exists)."
    error_id: ERR_KEY_HANDOFF_EXISTS
    http_status: 409
    applies_to: ["POST /api/v1/key-handoffs"]

  - priority: 15
    category: business_fiscal
    check: "wallet_credit_applied_cents <= Owner.wallet_credit_cents (cannot apply more credit than balance) AND wallet_credit_applied_cents <= booking_quote_cents (cannot apply more credit than the quote)."
    error_id: ERR_WALLET_INSUFFICIENT
    http_status: 422
    applies_to: ["POST /api/v1/bookings"]

  - priority: 16
    category: business_constraint
    check: "Approved amount on InsuranceClaim APPROVE: 0 < input.approved_amount_cents <= InsuranceClaim.claim_amount_cents."
    error_id: ERR_INVALID_APPROVED_AMOUNT
    http_status: 422
    applies_to: ["POST /api/v1/insurance-claims/{id}/approve"]

  - priority: 17
    category: business_referential
    check: "GpsTrack creation: Booking.status MUST be IN_PROGRESS at the moment of POST."
    error_id: ERR_GPS_BOOKING_NOT_IN_PROGRESS
    http_status: 409
    applies_to: ["POST /api/v1/gps-tracks"]

  - priority: 18
    category: business_constraint
    check: "Request body shape validation: required fields present, enum values from declared set, types correct, non-negative integers where so constrained."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT/PATCH endpoints"

# =============================================================================
# §1.5 Endpoints
# =============================================================================
endpoints:

  # ---- Owners ----
  - method: POST
    path: "/api/v1/owners/register"
    description: "Create a new Owner account."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, phone]
    output: Owner
    side_effects: ["Owner row created with wallet_credit_cents=0, version=1."]

  - method: GET
    path: "/api/v1/owners/{id}"
    description: "Retrieve an Owner by id."
    roles: [Owner, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Owner
    side_effects: []

  - method: GET
    path: "/api/v1/owners"
    description: "List Owners with pagination."
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Owner[]
    side_effects: []

  # ---- Sitters ----
  - method: POST
    path: "/api/v1/sitters/register"
    description: "Create a new Sitter account in APPLIED state."
    roles: [Anonymous]
    code: 201
    input: [email, full_name, phone]
    output: Sitter
    side_effects: ["Sitter row created with status=APPLIED, tier=BRONZE, tier_score=10, version=1."]

  - method: GET
    path: "/api/v1/sitters/{id}"
    description: "Retrieve a Sitter by id."
    roles: [Owner, Sitter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Sitter
    side_effects: []

  - method: GET
    path: "/api/v1/sitters"
    description: "List Sitters with optional status filter (used by Owner discovery)."
    roles: [Owner, Sitter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["status?", "tier?", "limit?", "offset?"]
    output: Sitter[]
    side_effects: []

  - method: POST
    path: "/api/v1/sitters/{id}/reinstate"
    description: "Move SUSPENDED Sitter back to ACTIVE."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Sitter
    side_effects: ["Sitter SUSPENDED -> ACTIVE (per §1.2); Sitter.suspended_at := null; Sitter.version += 1."]

  - method: POST
    path: "/api/v1/sitters/{id}/deactivate"
    description: "Move ACTIVE or SUSPENDED Sitter to terminal DEACTIVATED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Sitter
    side_effects: ["Sitter ACTIVE|SUSPENDED -> DEACTIVATED (per §1.2); Sitter.version += 1."]

  - method: POST
    path: "/api/v1/sitters/{id}/recompute-tier"
    description: "Force a sitter_tier_score recompute (idempotent — same inputs always yield same tier)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Sitter
    side_effects: ["Re-runs sitter_tier_score (§1.3); Sitter.tier_score and Sitter.tier updated; Sitter.version += 1 only when tier_score or tier changes."]

  # ---- BackgroundChecks ----
  - method: POST
    path: "/api/v1/background-checks"
    description: "Create a BackgroundCheck for a Sitter (moves Sitter APPLIED -> BG_CHECK_PENDING)."
    roles: [PlatformAdmin]
    code: 201
    input: [sitter_id, provider]
    output: BackgroundCheck
    side_effects:
      - "BackgroundCheck created with status=PENDING."
      - "Sitter[id=sitter_id].status: APPLIED -> BG_CHECK_PENDING; Sitter.version += 1."

  - method: GET
    path: "/api/v1/background-checks/{id}"
    description: "Retrieve a BackgroundCheck by id."
    roles: [PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []

  - method: GET
    path: "/api/v1/background-checks"
    description: "List BackgroundChecks, optionally filtered by sitter_id (FK reverse-reachability for BackgroundCheck.sitter_id)."
    roles: [PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["sitter_id?", "status?", "limit?", "offset?"]
    output: BackgroundCheck[]
    side_effects: []

  - method: POST
    path: "/api/v1/background-checks/{id}/clear"
    description: "Disposition a PENDING BackgroundCheck as CLEARED."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects:
      - "BackgroundCheck PENDING -> CLEARED."
      - "Sitter[id=BackgroundCheck.sitter_id].status: BG_CHECK_PENDING -> ACTIVE; Sitter.version += 1."

  - method: POST
    path: "/api/v1/background-checks/{id}/flag"
    description: "Disposition a PENDING BackgroundCheck as FLAGGED (triggers Cascade #1)."
    roles: [PlatformAdmin]
    code: 200
    input: [flagged_reason]
    output: BackgroundCheck
    side_effects:
      - "BackgroundCheck PENDING -> FLAGGED."
      - "CASCADE: Sitter -> SUSPENDED -> auto-cancel future Bookings -> refund Owner.wallet_credit_cents (Cascade #1, depth 4)."

  # ---- Pets ----
  - method: POST
    path: "/api/v1/pets"
    description: "Create a Pet for an Owner."
    roles: [Owner]
    code: 201
    input: [owner_id, name, species, weight_kg, "medical_notes?"]
    output: Pet
    side_effects: ["Pet row created."]

  - method: GET
    path: "/api/v1/pets/{id}"
    description: "Retrieve a Pet by id."
    roles: [Owner, Sitter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Pet
    side_effects: []

  - method: GET
    path: "/api/v1/pets"
    description: "List Pets, optionally filtered by owner_id (FK reverse-reachability for Pet.owner_id)."
    roles: [Owner, Sitter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["owner_id?", "limit?", "offset?"]
    output: Pet[]
    side_effects: []

  # ---- EmergencyContacts ----
  - method: POST
    path: "/api/v1/emergency-contacts"
    description: "Create an EmergencyContact for an Owner."
    roles: [Owner]
    code: 201
    input: [owner_id, full_name, phone, relationship, priority]
    output: EmergencyContact
    side_effects: ["EmergencyContact row created."]

  - method: GET
    path: "/api/v1/emergency-contacts/{id}"
    description: "Retrieve an EmergencyContact by id."
    roles: [Owner, PlatformAdmin]
    code: 200
    input: []
    output: EmergencyContact
    side_effects: []

  - method: GET
    path: "/api/v1/emergency-contacts"
    description: "List EmergencyContacts filtered by owner_id (FK reverse-reachability for EmergencyContact.owner_id)."
    roles: [Owner, PlatformAdmin]
    code: 200
    input: ["owner_id?", "limit?", "offset?"]
    output: EmergencyContact[]
    side_effects: []

  # ---- MeetAndGreets ----
  - method: POST
    path: "/api/v1/meet-and-greets"
    description: "Schedule a Meet & Greet between Owner+Pet and Sitter."
    roles: [Owner]
    code: 201
    input: [owner_id, sitter_id, pet_id, scheduled_at, "notes?"]
    output: MeetAndGreet
    side_effects: ["MeetAndGreet row created with status=SCHEDULED."]

  - method: GET
    path: "/api/v1/meet-and-greets/{id}"
    description: "Retrieve a MeetAndGreet by id."
    roles: [Owner, Sitter, PlatformAdmin]
    code: 200
    input: []
    output: MeetAndGreet
    side_effects: []

  - method: GET
    path: "/api/v1/meet-and-greets"
    description: "List MeetAndGreets filtered by any/all of owner_id, sitter_id, pet_id (FK reverse-reachability for all three FKs)."
    roles: [Owner, Sitter, PlatformAdmin]
    code: 200
    input: ["owner_id?", "sitter_id?", "pet_id?", "status?", "limit?", "offset?"]
    output: MeetAndGreet[]
    side_effects: []

  - method: POST
    path: "/api/v1/meet-and-greets/{id}/approve"
    description: "Mark a SCHEDULED MeetAndGreet COMPLETED_APPROVED."
    roles: [Owner]
    code: 200
    input: ["notes?"]
    output: MeetAndGreet
    side_effects: ["MeetAndGreet SCHEDULED -> COMPLETED_APPROVED."]

  - method: POST
    path: "/api/v1/meet-and-greets/{id}/decline"
    description: "Mark a SCHEDULED MeetAndGreet COMPLETED_DECLINED."
    roles: [Owner]
    code: 200
    input: ["notes?"]
    output: MeetAndGreet
    side_effects: ["MeetAndGreet SCHEDULED -> COMPLETED_DECLINED."]

  - method: POST
    path: "/api/v1/meet-and-greets/{id}/mark-no-show"
    description: "Mark a SCHEDULED MeetAndGreet as NO_SHOW (admin-only, requires 60+ minutes since scheduled_at)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MeetAndGreet
    side_effects: ["MeetAndGreet SCHEDULED -> NO_SHOW."]

  - method: POST
    path: "/api/v1/meet-and-greets/{id}/cancel"
    description: "Cancel a SCHEDULED MeetAndGreet."
    roles: [Owner]
    code: 200
    input: ["notes?"]
    output: MeetAndGreet
    side_effects: ["MeetAndGreet SCHEDULED -> CANCELLED."]

  # ---- Bookings ----
  - method: POST
    path: "/api/v1/bookings"
    description: "Create a Booking (REQUESTED) and compute booking_quote_cents (§1.3)."
    roles: [Owner]
    code: 201
    input: [owner_id, sitter_id, pet_id, service_type, time_of_day, "recurring_cadence?", start_at, end_at, "emergency_surcharge_cents?", "wallet_credit_applied_cents?"]
    output: Booking
    side_effects:
      - "Booking row created with status=REQUESTED."
      - "Booking.booking_quote_cents := booking_quote(§1.3)."
      - "Owner.wallet_credit_cents -= wallet_credit_applied_cents; Owner.version += 1 (when wallet_credit_applied_cents > 0)."

  - method: GET
    path: "/api/v1/bookings/{id}"
    description: "Retrieve a Booking by id."
    roles: [Owner, Sitter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/api/v1/bookings"
    description: "List Bookings filtered by any/all of owner_id, sitter_id, pet_id (FK reverse-reachability for all three FKs)."
    roles: [Owner, Sitter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["owner_id?", "sitter_id?", "pet_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/api/v1/bookings/{id}/confirm"
    description: "Sitter confirms a REQUESTED Booking."
    roles: [Sitter]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "Booking REQUESTED -> CONFIRMED."
      - "Booking.provisional_sitter_payout_cents := sitter_payout(provisional)."
      - "Sitter.pending_payout_cents += Booking.provisional_sitter_payout_cents; Sitter.version += 1."

  - method: POST
    path: "/api/v1/bookings/{id}/reject"
    description: "Sitter rejects a REQUESTED Booking."
    roles: [Sitter]
    code: 200
    input: [reason]
    output: Booking
    side_effects:
      - "Booking REQUESTED -> REJECTED."
      - "Owner.wallet_credit_cents += Booking.wallet_credit_applied_cents (restore); Owner.version += 1."

  - method: POST
    path: "/api/v1/bookings/{id}/cancel"
    description: "Cancel a Booking; valid from REQUESTED (no OCC) or CONFIRMED (OCC required)."
    roles: [Owner]
    code: 200
    input: [reason, "expected_booking_version?"]
    output: Booking
    side_effects:
      - "Booking REQUESTED|CONFIRMED -> CANCELLED."
      - "If CONFIRMED-source: Sitter.pending_payout_cents -= Booking.provisional_sitter_payout_cents; Sitter.version += 1."
      - "Owner.wallet_credit_cents += Booking.booking_quote_cents (full refund as wallet credit on CONFIRMED-source cancel) OR Owner.wallet_credit_cents += Booking.wallet_credit_applied_cents (restore only on REQUESTED-source cancel); Owner.version += 1."
      - "Increments Booking.version by 1."

  - method: POST
    path: "/api/v1/bookings/{id}/start"
    description: "Sitter starts the booked service (KEY_RECEIVED -> IN_PROGRESS)."
    roles: [Sitter]
    code: 200
    input: []
    output: Booking
    side_effects: ["Booking KEY_RECEIVED -> IN_PROGRESS."]

  - method: POST
    path: "/api/v1/bookings/{id}/complete"
    description: "Sitter completes the service (IN_PROGRESS -> COMPLETED) with optional tip/rating/incident."
    roles: [Sitter]
    code: 200
    input: ["tip_cents?", "incident_deduction_cents?", "owner_rating?"]
    output: Booking
    side_effects:
      - "Booking IN_PROGRESS -> COMPLETED."
      - "KeyHandoff RECEIVED -> RETURNED."
      - "Booking.final_sitter_payout_cents := sitter_payout(final)."
      - "Sitter counters updated (total_completed_bookings, total_rating_sum, total_rating_count); trigger sitter_tier_score recompute; Sitter.version += 1."

  - method: POST
    path: "/api/v1/bookings/{id}/emergency-terminate"
    description: "Sitter terminates an IN_PROGRESS Booking due to emergency (no payout, no rating)."
    roles: [Sitter]
    code: 200
    input: [reason]
    output: Booking
    side_effects:
      - "Booking IN_PROGRESS -> EMERGENCY_TERMINATED."
      - "Booking.final_sitter_payout_cents := 0."
      - "Sitter.pending_payout_cents -= Booking.provisional_sitter_payout_cents; Sitter.version += 1."

  # ---- KeyHandoffs ----
  - method: POST
    path: "/api/v1/key-handoffs"
    description: "Create a KeyHandoff for a CONFIRMED Booking (status=PENDING)."
    roles: [Owner]
    code: 201
    input: [booking_id, method, "lockbox_code?"]
    output: KeyHandoff
    side_effects: ["KeyHandoff row created with status=PENDING."]

  - method: GET
    path: "/api/v1/key-handoffs/{id}"
    description: "Retrieve a KeyHandoff by id."
    roles: [Owner, Sitter, PlatformAdmin]
    code: 200
    input: []
    output: KeyHandoff
    side_effects: []

  - method: GET
    path: "/api/v1/key-handoffs"
    description: "List KeyHandoffs filtered by booking_id (FK reverse-reachability for KeyHandoff.booking_id)."
    roles: [Owner, Sitter, PlatformAdmin]
    code: 200
    input: ["booking_id?", "status?", "limit?", "offset?"]
    output: KeyHandoff[]
    side_effects: []

  - method: POST
    path: "/api/v1/key-handoffs/{id}/receive"
    description: "Sitter marks the KeyHandoff received (advances Booking CONFIRMED -> KEY_RECEIVED)."
    roles: [Sitter]
    code: 200
    input: []
    output: KeyHandoff
    side_effects:
      - "KeyHandoff PENDING -> RECEIVED; KeyHandoff.received_at := system_clock."
      - "Booking[id=KeyHandoff.booking_id] CONFIRMED -> KEY_RECEIVED."

  # ---- GpsTracks ----
  - method: POST
    path: "/api/v1/gps-tracks"
    description: "Append a GPS sample to an IN_PROGRESS Booking."
    roles: [Sitter]
    code: 201
    input: [booking_id, latitude, longitude, recorded_at]
    output: GpsTrack
    side_effects: ["GpsTrack row appended."]

  - method: GET
    path: "/api/v1/gps-tracks/{id}"
    description: "Retrieve a single GpsTrack sample by id."
    roles: [Owner, Sitter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: []
    output: GpsTrack
    side_effects: []

  - method: GET
    path: "/api/v1/gps-tracks"
    description: "List GpsTracks filtered by booking_id (FK reverse-reachability for GpsTrack.booking_id)."
    roles: [Owner, Sitter, PlatformAdmin, ClaimsAdjuster]
    code: 200
    input: ["booking_id?", "limit?", "offset?"]
    output: GpsTrack[]
    side_effects: []

  # ---- InsuranceClaims ----
  - method: POST
    path: "/api/v1/insurance-claims"
    description: "File an InsuranceClaim against an IN_PROGRESS / COMPLETED / EMERGENCY_TERMINATED Booking."
    roles: [Owner]
    code: 201
    input: [booking_id, claim_amount_cents, "adjuster_notes?"]
    output: InsuranceClaim
    side_effects:
      - "InsuranceClaim row created with status=SUBMITTED."
      - "InsuranceClaim.sitter_id_snapshot := Booking.sitter_id; sitter_tier_snapshot := current Sitter.tier."
      - "InsuranceClaim.provisional_payout_cents := claim_payout(provisional)."

  - method: GET
    path: "/api/v1/insurance-claims/{id}"
    description: "Retrieve an InsuranceClaim by id."
    roles: [Owner, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: []

  - method: GET
    path: "/api/v1/insurance-claims"
    description: "List InsuranceClaims filtered by booking_id (FK reverse-reachability for InsuranceClaim.booking_id) and/or sitter_id_snapshot."
    roles: [Owner, ClaimsAdjuster, PlatformAdmin]
    code: 200
    input: ["booking_id?", "sitter_id_snapshot?", "status?", "limit?", "offset?"]
    output: InsuranceClaim[]
    side_effects: []

  - method: POST
    path: "/api/v1/insurance-claims/{id}/start-review"
    description: "ClaimsAdjuster begins review (SUBMITTED -> UNDER_REVIEW)."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["InsuranceClaim SUBMITTED -> UNDER_REVIEW."]

  - method: POST
    path: "/api/v1/insurance-claims/{id}/approve"
    description: "ClaimsAdjuster approves the claim (UNDER_REVIEW -> APPROVED) with approved_amount_cents."
    roles: [ClaimsAdjuster]
    code: 200
    input: [approved_amount_cents, "adjuster_notes?"]
    output: InsuranceClaim
    side_effects:
      - "InsuranceClaim UNDER_REVIEW -> APPROVED."
      - "InsuranceClaim.approved_amount_cents := input.approved_amount_cents."
      - "InsuranceClaim.final_payout_cents := claim_payout(final)."

  - method: POST
    path: "/api/v1/insurance-claims/{id}/revert"
    description: "ClaimsAdjuster reverts an APPROVED claim back to UNDER_REVIEW (cyclic)."
    roles: [ClaimsAdjuster]
    code: 200
    input: ["adjuster_notes?"]
    output: InsuranceClaim
    side_effects:
      - "InsuranceClaim APPROVED -> UNDER_REVIEW."
      - "InsuranceClaim.approved_amount_cents := null; final_payout_cents := 0."

  - method: POST
    path: "/api/v1/insurance-claims/{id}/pay"
    description: "ClaimsAdjuster marks the APPROVED claim PAID (triggers Cascade #2)."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects:
      - "InsuranceClaim APPROVED -> PAID."
      - "CASCADE: Sitter.claim_count += 1 -> sitter_tier_score recompute -> if tier dropped, recompute booking_quote on REQUESTED/CONFIRMED Bookings; if claim_count crosses 2 AND Sitter.status==ACTIVE, Sitter -> SUSPENDED."

  - method: POST
    path: "/api/v1/insurance-claims/{id}/deny"
    description: "ClaimsAdjuster denies a claim (UNDER_REVIEW -> DENIED)."
    roles: [ClaimsAdjuster]
    code: 200
    input: [denied_reason, "adjuster_notes?"]
    output: InsuranceClaim
    side_effects: ["InsuranceClaim UNDER_REVIEW -> DENIED."]

  - method: POST
    path: "/api/v1/insurance-claims/{id}/withdraw"
    description: "Owner withdraws a SUBMITTED claim."
    roles: [Owner]
    code: 200
    input: []
    output: InsuranceClaim
    side_effects: ["InsuranceClaim SUBMITTED -> WITHDRAWN."]

  # ---- Test-driving (per §1.5 priority ladder, last resort) ----
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Test-driving endpoint: pins the server's notion of 'now' to a given ISO 8601 UTC instant. Required so MeetAndGreet/Booking time-gated transitions can be exercised deterministically."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Server's system_clock := to_iso8601; all subsequent system_clock reads return this value."]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID on an endpoint that requires auth."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "X-User-Role is not permitted for the requested endpoint per §1.7."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-templated resource (Owner, Sitter, Pet, Booking, MeetAndGreet, KeyHandoff, BackgroundCheck, EmergencyContact, InsuranceClaim) does not exist."

  - id: ERR_FK_NOT_FOUND
    http: 404
    condition: "FK in request body (owner_id, sitter_id, pet_id, booking_id) references a non-existent entity."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state from which the requested transition is allowed per §1.2."

  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_booking_version mismatches current Booking.version on POST /api/v1/bookings/{id}/cancel."

  - id: ERR_SITTER_NOT_CLEARED
    http: 422
    condition: "Sitter's BackgroundCheck status is not CLEARED at MeetAndGreet creation or Booking confirmation."

  - id: ERR_MEET_AND_GREET_REQUIRED
    http: 422
    condition: "No MeetAndGreet with status==COMPLETED_APPROVED exists for the (owner_id, sitter_id, pet_id) tuple at Booking creation or confirmation."

  - id: ERR_PET_OWNER_MISMATCH
    http: 422
    condition: "Pet.owner_id != input.owner_id at Booking creation."

  - id: ERR_SITTER_TIME_CONFLICT
    http: 409
    condition: "Sitter's existing non-terminal Bookings overlap the proposed [start_at, end_at) under half-open + 30min trailing buffer semantics."

  - id: ERR_PET_TIME_CONFLICT
    http: 409
    condition: "Pet's existing non-terminal Bookings inclusively intersect the proposed [start_at, end_at] (closed-interval semantics, no buffer)."

  - id: ERR_PRIMARY_CONTACT_EXISTS
    http: 409
    condition: "An EmergencyContact with priority==1 already exists for the Owner at POST /api/v1/emergency-contacts."

  - id: ERR_BG_CHECK_EXISTS
    http: 409
    condition: "A BackgroundCheck already exists for the Sitter at POST /api/v1/background-checks."

  - id: ERR_KEY_HANDOFF_EXISTS
    http: 409
    condition: "A KeyHandoff already exists for the Booking at POST /api/v1/key-handoffs."

  - id: ERR_WALLET_INSUFFICIENT
    http: 422
    condition: "wallet_credit_applied_cents exceeds Owner.wallet_credit_cents or exceeds booking_quote_cents at Booking creation."

  - id: ERR_INVALID_APPROVED_AMOUNT
    http: 422
    condition: "approved_amount_cents <= 0 or > InsuranceClaim.claim_amount_cents at POST /api/v1/insurance-claims/{id}/approve."

  - id: ERR_GPS_BOOKING_NOT_IN_PROGRESS
    http: 409
    condition: "GpsTrack creation rejected because Booking.status != IN_PROGRESS."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Request body missing required fields, wrong types, invalid enum value, or negative integer where >=0 is required."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: Anonymous
    description: "Unauthenticated caller; only registration endpoints accept this role."
    identity: opaque
    exclusive_operations:
      - "POST /api/v1/owners/register"
      - "POST /api/v1/sitters/register"
    shared_operations: []

  - name: Owner
    description: "Pet owner who books services."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /api/v1/pets"
      - "POST /api/v1/emergency-contacts"
      - "POST /api/v1/meet-and-greets"
      - "POST /api/v1/meet-and-greets/{id}/approve"
      - "POST /api/v1/meet-and-greets/{id}/decline"
      - "POST /api/v1/meet-and-greets/{id}/cancel"
      - "POST /api/v1/bookings"
      - "POST /api/v1/bookings/{id}/cancel"
      - "POST /api/v1/key-handoffs"
      - "POST /api/v1/insurance-claims"
      - "POST /api/v1/insurance-claims/{id}/withdraw"
    shared_operations:
      - "GET /api/v1/owners/{id}"
      - "GET /api/v1/sitters/{id}"
      - "GET /api/v1/sitters"
      - "GET /api/v1/pets/{id}"
      - "GET /api/v1/pets"
      - "GET /api/v1/emergency-contacts/{id}"
      - "GET /api/v1/emergency-contacts"
      - "GET /api/v1/meet-and-greets/{id}"
      - "GET /api/v1/meet-and-greets"
      - "GET /api/v1/bookings/{id}"
      - "GET /api/v1/bookings"
      - "GET /api/v1/key-handoffs/{id}"
      - "GET /api/v1/key-handoffs"
      - "GET /api/v1/gps-tracks/{id}"
      - "GET /api/v1/gps-tracks"
      - "GET /api/v1/insurance-claims/{id}"
