            - { call: "POST /bookings", payload: { user_id: "${u1}", instrument_id: "${i1}", grant_id: "${g1}", start_at: "2026-09-02T09:00:00Z", end_at: "2026-09-02T19:00:00Z", priority: "STANDARD" }, as: Researcher, as_user_id: "${u1}", captures: { err2: $.data.error_id } }
          assert:
            - "10-minute booking: error_id == ERR_DURATION_OUT_OF_RANGE (below min 30)"
            - "600-minute booking: error_id == ERR_DURATION_OUT_OF_RANGE (above max 480)"

      - name: duplicate_booking_same_start
        claim_type: violation_to_error
        grounds:
          - "validations[priority=24]"
          - "errors[ERR_DUPLICATE_BOOKING]"
        distinguishing_aspect: "Same user + instrument + start_at with status IN {REQUESTED, APPROVED, IN_PROGRESS} is a duplicate even though the first is only REQUESTED."
        test_recipe:
