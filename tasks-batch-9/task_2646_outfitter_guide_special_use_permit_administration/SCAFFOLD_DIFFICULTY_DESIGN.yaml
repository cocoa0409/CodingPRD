      - name: sweep_guide_lapse_authorization_ratio_cascade
        grounds:
          - endpoints.POST_/osup/_ops/run-daily-compliance-sweep
          - state_machines.Guide.QUALIFIED_to_LAPSED
          - state_machines.GuideAreaAuthorization.AUTHORIZED_to_REVOKED
          - calculations.guide_client_capacity
          - calculations.permit_compliance_derivation
          - entities.Permit.fields.authorized_client_capacity_total
        distinguishing_aspect: |
          TRIGGER: the batch sweep against an advanced logical clock, with no entity named in the
          request at all. DEPTH 5: (1) the guide's certificate is past its expiry so the guide
          moves QUALIFIED -> LAPSED, (2) because the guide lapsed its base_client_capacity is
          recomputed to 0, (3) because the guide lapsed its AUTHORIZED authorization row is revoked
          with reason GUIDE_LAPSED, (4) because that row left the AUTHORIZED set the permit's
          authorized_client_capacity_total is recomputed from 12 to 8, (5) because 8 is below the
          area's party_size_max of 12 on an ACTIVE permit the compliance dimension is re-derived to
          PROBATION. The sweep's pinned step order is load-bearing: step 5 must run after step 4 or
          the revocation is invisible to the ratio check in the same batch.
