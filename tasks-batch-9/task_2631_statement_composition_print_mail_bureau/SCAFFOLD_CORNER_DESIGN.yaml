      - name: dr_readiness_holds_ready_at_the_exact_replication_lag_limit
        claim_type: constants_applied
        grounds: [calculations.dr_site_readiness.constants, endpoints.PATCH_dr_sites_id]
        distinguishing_aspect: "MAX_REPLICATION_LAG_MINUTES 15 is compared with a strict greater-than, so a site replicating at exactly 15 minutes stays READY and only 16 minutes degrades it to STALE."
        test_recipe:
          setup:
            - "DR site DR-C10 created with replication_lag_minutes 15 and a PASS drill recorded at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/dr-sites"
              payload: { site_code: "DR-C10", replication_lag_minutes: 15 }
              as: BureauAdmin
              captures: { c10_site_id: "$.data.id", c10_initial: "$.data.readiness_status" }
            - call: "POST /bureau/dr-sites/${c10_site_id}/drills"
              payload: { result: "PASS" }
              as: BureauAdmin
              captures: { c10_after_drill: "$.data.readiness_status", c10_valid_until: "$.data.readiness_valid_until" }
          trigger:
            - call: "PATCH /bureau/dr-sites/${c10_site_id}"
              payload: { replication_lag_minutes: 16 }
              as: BureauAdmin
              captures: { c10_over: "$.data.readiness_status", c10_over_lag: "$.data.replication_lag_minutes" }
            - call: "PATCH /bureau/dr-sites/${c10_site_id}"
              payload: { replication_lag_minutes: 15 }
              as: BureauAdmin
              captures: { c10_at_limit: "$.data.readiness_status" }
          assert:
            - "${c10_initial} == UNTESTED (no drill yet) and ${c10_after_drill} == READY with ${c10_valid_until} == 2026-08-31T00:00:00Z"
            - "${c10_over} == STALE with ${c10_over_lag} == 16 — one minute over the limit is enough"
            - "${c10_at_limit} == READY again: 15 > 15 is false, so the site at exactly the limit is still ready"
            - "last_drill_result stays PASS and drill_count stays 1 across both PATCH calls — the PATCH only re-evaluates readiness"

      - name: dr_readiness_decays_one_minute_past_validity_and_a_failed_drill_reads_failed
        claim_type: decay_function
        grounds: [calculations.dr_site_readiness, entities.DrSite.fields.readiness_status]
        distinguishing_aspect: "Drill validity is a 720-hour window compared with a strict greater-than: the site is still READY at the exact expiry instant and STALE one minute later, and a fresh FAIL drill restarts the window while pinning readiness to FAILED."
        test_recipe:
          setup:
            - "DR site DR-C11 with replication_lag_minutes 5 and a PASS drill at 2026-08-01T00:00:00Z, giving readiness_valid_until 2026-08-31T00:00:00Z."
          setup_api_calls:
