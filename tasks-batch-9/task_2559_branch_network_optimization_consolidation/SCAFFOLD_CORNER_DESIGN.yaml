        distinguishing_aspect: "The role gate sits at priority 2, above every state and payload rule, so a wrong-role call on a DRAFT case returns ERR_FORBIDDEN_ROLE 403 rather than the state or version error that the same body would earn from the right role — and the shared GET surface stays open to those same roles."
