        claim_type: Segregation of duties
        grounds: [state_machines.Disbursement.PENDING_to_RELEASED, "validations[priority=9]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "The same adjuster who accepted the settlement (accepted_by_user_id == adj) attempting to release the disbursement returns ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["A claim PAID with a PENDING disbursement whose settlement was accepted by adjuster adj; release attempted by that same adjuster."]
