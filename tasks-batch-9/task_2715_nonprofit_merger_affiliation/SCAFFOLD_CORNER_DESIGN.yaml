            - call: "POST /restricted-funds"
              payload: { org_id: "${org_a}", fund_name: "Bequest of an Unknown Friend", fund_type: "TEMP_RESTRICTED", principal_cents: 30000000, accumulated_appreciation_cents: 0, historic_dollar_value_cents: 0, restriction_purpose_code: "SC-SCHOLARSHIPS", restriction_conflict: false, donor_of_record_reachable: false }
              as: CharitableTrustCounsel
