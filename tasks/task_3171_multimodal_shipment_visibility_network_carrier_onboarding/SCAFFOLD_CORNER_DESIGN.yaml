            - call: "POST /shippers/${x1_shp}/shipments"
              payload: { carrier_id: "${x1_car}", connection_id: "${x1_conn}", mode: "TRUCKLOAD", tracking_reference: "OO-2", mode_reference: "PRO-O2", destination_code: "LAX", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
