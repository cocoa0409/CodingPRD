  - rule_id: compensating_invariant
    instances:
      - name: staging_committed_sqft_returns_to_zero_across_hold_lifecycle
        grounds:
          - state_machines.StagingReservation.HELD_to_RELEASED
          - endpoints[POST /staging-reservations/{staging_reservation_id}/release]
          - endpoints[POST /procurement-orders/{procurement_order_id}/install]
          - entities.ModernizationProject.fields.staging_committed_sqft
        distinguishing_aspect: |
          Conserved quantity: ModernizationProject.staging_committed_sqft, which must at every
          instant equal SUM(sqft) over the project's StagingReservation rows in status HELD. Two
          different compensating paths unwind it - an explicit release and an implicit release
          cascaded by order install - and both must restore the ledger exactly, while the released
          rows keep their historical sqft so the audit trail is not rewritten.
        test_recipe:
          setup:
            - "One project with staging_area_sqft 1200."
            - "One car with an APPROVED ScopeOption carrying two ProcurementOrders, both ISSUED."
            - "Order A holds a HELD StagingReservation of 500 sqft; order B holds a HELD StagingReservation of 300 sqft and has been received, so order B is STAGED while its reservation is still HELD."
            - "ModernizationProject.staging_committed_sqft is therefore 800."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false, inspection_lead_days: 10, witness_test_required: false, reinspection_extension_hours: 24, permit_surcharge_pct: 0.0000 }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2, outage_buffer_hours: 4, tenant_notice_lead_hours: 72 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "GOOD", machine_condition: "GOOD", door_equipment_condition: "EXCELLENT" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv1: $.data.version }
            - call: "POST /scope-options"
              payload: { car_id: "${c1_id}", tier: "CONTROLLER_ONLY", base_price_cents: 5000000, expected_project_version: "${pv1}" }
              as: ProjectManager
              captures: { so1_id: $.data.id }
            - call: "POST /scope-options/${so1_id}/submit"
              as: ProjectManager
            - call: "POST /scope-options/${so1_id}/approve"
              as: BuildingRepresentative
              as_user_id: "${p_id}"
            - call: "POST /procurement-orders"
              payload: { scope_option_id: "${so1_id}", item_type: "CONTROLLER", lead_time_days: 30, required_staging_sqft: 500 }
              as: ProjectManager
              captures: { poA_id: $.data.id }
            - call: "POST /procurement-orders"
              payload: { scope_option_id: "${so1_id}", item_type: "MACHINE", lead_time_days: 30, required_staging_sqft: 300 }
              as: ProjectManager
              captures: { poB_id: $.data.id }
            - call: "POST /procurement-orders/${poA_id}/issue"
              as: ProjectManager
            - call: "POST /procurement-orders/${poB_id}/issue"
              as: ProjectManager
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv2: $.data.version }
            - call: "POST /staging-reservations"
              payload: { procurement_order_id: "${poA_id}", sqft: 500, hold_start: "2026-08-05T00:00:00Z", hold_end: "2026-08-20T00:00:00Z", expected_project_version: "${pv2}" }
              as: ServiceManager
              captures: { srA_id: $.data.id }
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv3: $.data.version }
            - call: "POST /staging-reservations"
              payload: { procurement_order_id: "${poB_id}", sqft: 300, hold_start: "2026-08-06T00:00:00Z", hold_end: "2026-08-21T00:00:00Z", expected_project_version: "${pv3}" }
              as: ServiceManager
              captures: { srB_id: $.data.id }
            - call: "POST /procurement-orders/${poB_id}/receive"
              payload: { staging_reservation_id: "${srB_id}" }
              as: ProjectManager
          trigger:
            - call: "POST /staging-reservations/${srA_id}/release"
              as: ProjectManager
            - call: "POST /procurement-orders/${poB_id}/install"
              as: ProjectManager
          assert:
            - "Before either trigger, ModernizationProject.${p_id}.staging_committed_sqft == 800 == 500 + 300, the sum of the two HELD reservations"
            - "After the explicit release, StagingReservation.${srA_id}.status == RELEASED, released_at == 2026-08-01T00:00:00Z, and sqft is STILL 500 - the historical footage is never zeroed"
            - "After the explicit release, staging_committed_sqft == 300, exactly the remaining HELD reservation"
            - "After the explicit release, ProcurementOrder.${poA_id}.status == ORDERED - releasing a hold does not cancel the order"
            - "After the install cascade, StagingReservation.${srB_id}.status == RELEASED with sqft still 300 and released_at == 2026-08-01T00:00:00Z"
            - "After the install cascade, staging_committed_sqft == 0 - the ledger returns exactly to its pre-hold value with no drift from the two different unwind paths"
            - "After the install cascade, ProcurementOrder.${poB_id}.status == INSTALLED and staging_reservation_id == ${srB_id}"
            - "ModernizationProject.${p_id}.downtime_posture == OPEN at every step, and at the end GET /staging-reservations?procurement_order_id=${poA_id}&status=HELD and GET /staging-reservations?procurement_order_id=${poB_id}&status=HELD both return 0 rows"

      - name: approved_scope_value_cents_conserved_across_rescind_and_reapproval
        grounds:
          - endpoints[POST /scope-options/{scope_option_id}/rescind]
          - endpoints[POST /scope-options/{scope_option_id}/approve]
          - entities.ModernizationProject.fields.approved_scope_value_cents
          - validations[priority=15]
        distinguishing_aspect: |
          Conserved quantity: ModernizationProject.approved_scope_value_cents, which must at every
          instant equal SUM(total_price_cents) over the project's ScopeOptions in status APPROVED.
          A rescind is the compensating action for an approve, and the freed budget must become
          usable again by a later approval on a different car. Distinct from the staging ledger
          invariant: a monetary aggregate over ScopeOption rows rather than an area aggregate over
          StagingReservation rows, and it is the quantity the band-15 budget guard reads.
        test_recipe:
          setup:
            - "One project with contract_value_cents 60000000 and three cars in one group, each with a countersigned EquipmentSurvey recommending CONTROLLER_ONLY."
            - "Car 1 has an APPROVED ScopeOption at base_price_cents 5000000 and car 2 an APPROVED ScopeOption at 6000000, both with lead times short enough that escalation_pct is 0.0000, no code triggers, and each subtotal below the first volume break, so total_price_cents equals base_price_cents."
            - "ModernizationProject.approved_scope_value_cents is therefore 11000000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false, inspection_lead_days: 10, witness_test_required: false, reinspection_extension_hours: 24, permit_surcharge_pct: 0.0000 }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2, outage_buffer_hours: 4, tenant_notice_lead_hours: 72 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-2", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 2 }
              as: ProjectManager
              captures: { c2_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-3", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 3 }
              as: ProjectManager
              captures: { c3_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "GOOD", machine_condition: "GOOD", door_equipment_condition: "EXCELLENT" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c2_id}", controller_condition: "GOOD", machine_condition: "GOOD", door_equipment_condition: "EXCELLENT" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s2_id: $.data.id }
            - call: "POST /equipment-surveys/${s2_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c3_id}", controller_condition: "GOOD", machine_condition: "GOOD", door_equipment_condition: "EXCELLENT" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s3_id: $.data.id }
            - call: "POST /equipment-surveys/${s3_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv1: $.data.version }
            - call: "POST /scope-options"
              payload: { car_id: "${c1_id}", tier: "CONTROLLER_ONLY", base_price_cents: 5000000, expected_project_version: "${pv1}" }
              as: ProjectManager
              captures: { so1_id: $.data.id }
            - call: "POST /scope-options/${so1_id}/submit"
              as: ProjectManager
            - call: "POST /scope-options/${so1_id}/approve"
              as: BuildingRepresentative
              as_user_id: "${p_id}"
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv2: $.data.version }
            - call: "POST /scope-options"
              payload: { car_id: "${c2_id}", tier: "CONTROLLER_ONLY", base_price_cents: 6000000, expected_project_version: "${pv2}" }
              as: ProjectManager
              captures: { so2_id: $.data.id }
            - call: "POST /scope-options/${so2_id}/submit"
              as: ProjectManager
            - call: "POST /scope-options/${so2_id}/approve"
              as: BuildingRepresentative
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /scope-options/${so1_id}/rescind"
              as: ProjectManager
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv3: $.data.version }
            - call: "POST /scope-options"
              payload: { car_id: "${c3_id}", tier: "CONTROLLER_ONLY", base_price_cents: 4000000, expected_project_version: "${pv3}" }
              as: ProjectManager
              captures: { so3_id: $.data.id }
            - call: "POST /scope-options/${so3_id}/submit"
              as: ProjectManager
            - call: "POST /scope-options/${so3_id}/approve"
              as: BuildingRepresentative
              as_user_id: "${p_id}"
          assert:
            - "Before the rescind, ScopeOption.${so1_id}.total_price_cents == 5000000, ScopeOption.${so2_id}.total_price_cents == 6000000, and ModernizationProject.${p_id}.approved_scope_value_cents == 11000000"
            - "After the rescind, ScopeOption.${so1_id}.status == SUPERSEDED and its total_price_cents is STILL 5000000 - the frozen price is retained for the audit trail"
            - "After the rescind, approved_scope_value_cents == 6000000, exactly SUM(total_price_cents) over the remaining APPROVED options"
            - "After the rescind, ElevatorCar.${c1_id}.work_status == SCOPED, approved_scope_option_id == null, compliance_status == NOT_EVALUATED"
            - "After the rescind, ElevatorCar.${c2_id}.work_status == PROCURING and approved_scope_option_id == ${so2_id} - the cascade is confined to car 1"
            - "The later approval of ${so3_id} returns HTTP 200 and approved_scope_value_cents == 10000000 == 6000000 + 4000000, proving the rescinded 5000000 was genuinely returned to the budget rather than merely marked spent"
            - "GET /scope-options?car_id=${c1_id}&status=APPROVED returns 0 rows, while the same query for ${c2_id} and ${c3_id} returns one APPROVED option each, and those two total_price_cents sum to approved_scope_value_cents"
            - "ModernizationProject.${p_id}.approved_scope_value_cents <= contract_value_cents == 60000000 at every step, so no band-15 ERR_SCOPE_BUDGET_EXCEEDED is raised"
