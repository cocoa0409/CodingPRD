            - "${pit_posture_1} == OPEN — one issued of two is a ratio of 0.50, below RESTRICTED_RATIO 0.90"
            - "${pit_posture_2} == FROZEN and ${pit_issued} == 2 — the ratio 2/2 == 1.00 reaches FROZEN_RATIO"
