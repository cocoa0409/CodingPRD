      - name: storage_capacity_exceeded_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: storage_load_accepts_exact_capacity_and_rejects_one_more_pallet
          rationale: "ERR_STORAGE_CAPACITY_EXCEEDED is triggered at its exact boundary by the §1.8 boundary_precision_check instance of the same name, which accepts the order that fills storage_capacity_pallets exactly and rejects the pallet after it."
        grounds:
          - "§1.6 declares ERR_STORAGE_CAPACITY_EXCEEDED (422) and §1.3 storage_overlap_load compares the aggregate overlapping pallet load against storage_capacity_pallets with a strict >."

      - name: program_frozen_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: frozen_posture_outranks_delivery_window_violation
          rationale: "ERR_PROGRAM_FROZEN is triggered by the §1.8 priority_pair_validation_conflict instance of the same name, which also proves it outranks the priority-10 delivery-window check on the same request."
        grounds:
          - "§1.4 priority 9 business_safety raises ERR_PROGRAM_FROZEN (422) whenever readiness_posture is FROZEN, ahead of every later business rule."

      - name: gating_milestone_not_complete_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: permit_submit_blocked_until_gating_milestone_complete
          rationale: "ERR_GATING_MILESTONE_NOT_COMPLETE is triggered by the §1.8 cross_entity_state_dependency instance of the same name, which submits against an IN_PROGRESS gating milestone and then succeeds once it is COMPLETE."
        grounds:
          - "§1.2 PermitApplication DRAFT -> SUBMITTED requires the gating Milestone to be COMPLETE, and §1.6 declares ERR_GATING_MILESTONE_NOT_COMPLETE at 422."

      - name: training_room_conflict_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: training_room_rejects_session_inside_thirty_minute_turnover_buffer
          rationale: "ERR_TRAINING_ROOM_CONFLICT is triggered at both buffer edges by the §1.8 resource_temporal_overlap instance of the same name."
        grounds:
          - "§1.3 training_room_occupancy applies TURNOVER_BUFFER_MINUTES 30 symmetrically to the candidate session and §1.6 declares ERR_TRAINING_ROOM_CONFLICT at 422."

      - name: schedule_empty_is_triggerable
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: baseline_schedule_with_zero_milestones_rejected_as_empty_set
          rationale: "ERR_SCHEDULE_EMPTY is triggered by the §1.8 boundary_precision_check instance of the same name, which baselines a program holding zero milestones and then succeeds at exactly one."
        grounds:
          - "§1.2 PLANNING -> BASELINED requires the program to hold at least one Milestone and §1.6 declares ERR_SCHEDULE_EMPTY at 422; §1.3 critical_path_schedule writes no dates for an empty candidate set."

      - name: acting_on_a_block_in_the_wrong_state_returns_invalid_reservation_state
        claim_type: violation_to_error
        grounds:
          - "§1.6 declares ERR_INVALID_RESERVATION_STATE (409) for guaranteeing a non-ACCEPTED block or resolving a block that is not AT_RISK; §1.2 ReservationBlock allows guarantee only from ACCEPTED and resolve-contingency only from AT_RISK."
        distinguishing_aspect: "One error_id covers two different wrong-state paths on the same entity: resolving a block that is ACCEPTED rather than AT_RISK, and guaranteeing a block that is already GUARANTEED."
        test_recipe:
          setup:
            - "Empty DB with the logical clock set to 2026-09-01T00:00:00Z; no PreOpeningProgram exists."
            - "Program 'Cobalt Bay Hotel' baselined by pd-baseline-1 over a single 30-day CONSTRUCTION_COMPLETE milestone, which was started and then completed at clock 2026-10-01: schedule_state CONSTRUCTION_COMPLETE, projected_opening_date_committed 2026-10-15, schedule_slip_days 0, version 2."
            - "Booking opened and one ACCEPTED block for 5 rooms x 2 nights arriving 2026-10-05, so committed_room_nights is 10 and contingency_liability_cents 262500, with commercial_state BOOKING_OPEN."
