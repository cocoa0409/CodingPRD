# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2840 - Construction Manager at Risk & Guaranteed Maximum Price Administration
# Sections and claim_type values are taken from references/claim-extraction-guide.md.
# Corners already exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml are emitted as
# excluded_because stubs naming the §1.8 instance verbatim.
# The Entities row "Immutability" is not applicable: all ten §1.1 entities declare
# common_fields: true, so there is no immutable-entity claim to make.
scaffold_corner_design:

  # ===================================================================
  - section: entities
    instances:
      - name: project_creation_returns_zeroed_money_and_four_initial_states
        claim_type: creation
        grounds:
          - endpoints.POST_/projects
          - entities.CmarProject
          - state_machines.CmarProject.initial_states
        distinguishing_aspect: |
          A freshly registered project must expose ALL FOUR state axes at their initial values
          and every one of its twenty-odd money fields at 0.00 - including proposed_gmp_amount
          and the two contingency pots, which an implementation that only initialises gmp_amount
          leaves as null.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01, precon_fee_amount: 25000.00 }
              as: ProgramAdmin
              captures: { proj: $.data.id, v: $.data.version }
          assert:
            - "the response code is 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"
            - "CmarProject.${proj}.gmp_status == PRECONSTRUCTION"
            - "CmarProject.${proj}.contingency_posture == OPEN"
            - "CmarProject.${proj}.audit_status == NOT_REQUESTED"
            - "CmarProject.${proj}.closeout_status == NOT_STARTED"
            - "CmarProject.${proj}.cm_fee_pct == 0.0400 and insurance_rate == 0.0100, both echoed back at four-decimal ratio precision"
            - "CmarProject.${proj}.precon_fee_amount == 25000.00"
            - "gmp_amount == 0.00, proposed_gmp_amount == 0.00, cost_of_work_budget_total == 0.00, general_conditions_total == 0.00, insurance_amount == 0.00, cm_fee_amount == 0.00"
            - "owner_contingency_original == 0.00, owner_contingency_remaining == 0.00, construction_contingency_original == 0.00, construction_contingency_remaining == 0.00, contingency_drawn_to_cost_total == 0.00"
            - "pending_amendment_count == 0, buyout_savings_trade_level == 0.00, buyout_savings_project_net == 0.00, audit_adjustment_total == 0.00"
            - "provisional_savings_pool == 0.00, provisional_cm_savings_share == 0.00, provisional_owner_savings_share == 0.00, final_savings_pool == 0.00, final_cm_savings_share == 0.00, final_owner_savings_share == 0.00"
            - "${v} == 1 and created_at == updated_at"

      - name: work_package_retrieval_returns_the_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints.GET_/work-packages/{id}
          - entities.WorkPackage
        distinguishing_aspect: |
          A work package may be budgeted during preconstruction, before any guaranteed maximum
          price exists, so the read must return both procurement axes at their initial values
          with awarded_bid_id null and bid_count 0 rather than 404-ing on a project whose
          gmp_status is still PRECONSTRUCTION.
        test_recipe:
          setup:
            - "one CmarProject in gmp_status PRECONSTRUCTION"
            - "one WorkPackage 07-ROOFING with budget_amount 480000.00"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id }
            - call: "POST /work-packages"
              payload: { project_id: "${proj}", trade_division: "07-ROOFING", budget_amount: 480000.00, self_perform_intent: false }
              as: ConstructionManager
              captures: { wp: $.data.id }
          trigger:
            - call: "GET /work-packages/${wp}"
              payload: {}
              as: OwnerRepresentative
          assert:
            - "the response code is 200 with response_type == object"
            - "WorkPackage.${wp}.project_id == ${proj} and trade_division == 07-ROOFING"
            - "WorkPackage.${wp}.budget_amount == 480000.00 and self_perform_intent == false"
            - "WorkPackage.${wp}.procurement_status == BUDGETED and transparency_status == SEALED"
            - "WorkPackage.${wp}.solicitation_opens_at == null, solicitation_closes_at == null, awarded_bid_id == null"
            - "WorkPackage.${wp}.awarded_amount == 0.00, committed_amount == 0.00, replacement_reserve_amount == 0.00, bid_count == 0"
            - "WorkPackage.${wp}.version == 1"

      - name: project_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/projects
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list envelope must report total_count over the WHOLE filtered set and has_more
          relative to the requested window, so a limit of 2 over 3 rows returns 2 rows with
          total_count 3 and has_more true, while offset 2 returns the last row with has_more
          false - an implementation that sets total_count to the page length passes neither.
        test_recipe:
          setup:
            - "three CmarProject rows, all in gmp_status PRECONSTRUCTION"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { p1: $.data.id }
            - call: "POST /projects"
              payload: { name: "Lakeshore Library Renovation", owner_org: "Lakeshore Library District", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { p2: $.data.id }
            - call: "POST /projects"
              payload: { name: "Northgate Transit Center", owner_org: "Northgate Transit Authority", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /projects"
              payload: { limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /projects"
              payload: { limit: 2, offset: 2 }
              as: ProgramAdmin
            - call: "GET /projects"
              payload: { gmp_status: "EXECUTED" }
              as: ProgramAdmin
          assert:
            - "trigger call 1 returns response_type == array with exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger call 2 returns exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "trigger call 3 returns 0 rows with total_count == 0 and has_more == false, because no project has reached EXECUTED"
            - "the three ids ${p1}, ${p2} and ${p3} appear exactly once across trigger calls 1 and 2 combined"

      - name: project_read_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_PROJECT_NOT_FOUND]
          - validations.priority_41_ERR_PROJECT_NOT_FOUND
        distinguishing_aspect: |
          A syntactically valid UUID that names no row must produce ERR_PROJECT_NOT_FOUND with
          404 on the project path, not the generic ERR_RESOURCE_NOT_FOUND - the catalogue
          distinguishes the four hot parents by their own codes.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the response code is 404 with response_type == error and data.error_id == ERR_PROJECT_NOT_FOUND"
            - "GET /work-packages/00000000-0000-4000-8000-000000000000 returns 404 ERR_WORK_PACKAGE_NOT_FOUND"
            - "GET /qualification-items/00000000-0000-4000-8000-000000000000 returns 404 ERR_RESOURCE_NOT_FOUND"

      - name: project_creation_without_cm_fee_pct_is_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_30_ERR_INVALID_REQUEST
          - endpoints.POST_/projects.input
        distinguishing_aspect: |
          cm_fee_pct has source input and no default, so omitting it is a 400 ERR_INVALID_REQUEST
          rather than a silent 0.0000 fee - which would otherwise produce a guaranteed maximum
          price with no fee component at all and still balance the conservation identity.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", insurance_rate: 0.01 }
              as: ProgramAdmin
          assert:
            - "the response code is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /projects returns 0 rows - the rejected write created nothing"
            - "the same call with cm_fee_pct 0.04 added returns 201"

      - name: project_creation_omitting_precon_fee_applies_the_zero_default
        claim_type: defaults
        grounds:
          - entities.CmarProject.fields.precon_fee_amount
          - endpoints.POST_/projects.input
        distinguishing_aspect: |
          precon_fee_amount is the only optional money input on project registration; omitting
          it must yield the declared 0.00 default rather than null, because it is summed into
          nothing but must still be readable as a decimal.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "Lakeshore Library Renovation", owner_org: "Lakeshore Library District", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id }
          assert:
            - "the response code is 201 and CmarProject.${proj}.precon_fee_amount == 0.00, not null"
            - "CmarProject.${proj}.gmp_status == PRECONSTRUCTION and version == 1"

      - name: qualification_item_unit_rate_is_computed_and_supplied_value_input_ignored
        claim_type: computed_fields
        grounds:
          - calculations.allowance_unit_conservation
          - entities.QualificationItem.fields.allowance_unit_rate
          - entities.QualificationItem.fields.remaining_units
        distinguishing_aspect: |
          allowance_unit_rate is source computed as allowance_amount / allocated_units at four
          decimals, so a client-supplied 99.9999 must be discarded in favour of 50.0000, and
          remaining_units must initialise to the full allocation with reconciled_units 0 and
          last_action NONE.
        test_recipe:
          setup:
            - "one CmarProject with a DRAFT BASE GmpProposal"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_100", submitted_cost_of_work: 1000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { projv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${projv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
          trigger:
            - call: "POST /qualification-items"
              payload: { gmp_proposal_id: "${prop}", item_type: "ALLOWANCE", text: "decorative terrazzo flooring at the lobby", allowance_amount: 60000.00, allocated_units: 1200, unit_of_measure: "SF", allowance_unit_rate: 99.9999, reconciled_units: 400 }
              as: ConstructionManager
              captures: { item: $.data.id }
          assert:
            - "the response code is 201 and QualificationItem.${item}.allowance_unit_rate == 50.0000, not the supplied 99.9999"
            - "QualificationItem.${item}.reconciled_units == 0, not the supplied 400"
            - "QualificationItem.${item}.remaining_units == 1200 and reconciled_amount == 0.00 and variance_amount == 0.00"
            - "QualificationItem.${item}.reconciliation_seq == 0 and last_action == NONE and status == OPEN"
            - "QualificationItem.${item}.gmp_proposal_id == ${prop}"

      - name: project_creation_with_client_supplied_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.CmarProject.common_fields
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted; a payload carrying them
          must be answered with a fresh UUID and version 1, never with the client's values,
          because every optimistic-concurrency check in the domain reads that version.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01, id: "11111111-1111-4111-8111-111111111111", version: 77, created_at: "2001-01-01T00:00:00.000Z", gmp_status: "EXECUTED", gmp_amount: 9999999.99 }
              as: ProgramAdmin
              captures: { proj: $.data.id }
          assert:
            - "the response code is 201 and ${proj} != 11111111-1111-4111-8111-111111111111"
            - "CmarProject.${proj}.version == 1, not 77"
            - "CmarProject.${proj}.created_at is the logical clock value 2026-08-01T00:00:00.000Z, not 2001-01-01T00:00:00.000Z"
            - "CmarProject.${proj}.gmp_status == PRECONSTRUCTION, not the supplied EXECUTED"
            - "CmarProject.${proj}.gmp_amount == 0.00, not the supplied 9999999.99"
            - "GET /projects/11111111-1111-4111-8111-111111111111 returns 404 ERR_PROJECT_NOT_FOUND"

      - name: estimate_creation_with_unknown_milestone_code_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.ProgressiveEstimate.fields.milestone_code
          - global_constants.MILESTONE_RANK
          - validations.priority_30_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          milestone_code is constrained to the five ranked design milestones because
          milestone_rank is derived from MILESTONE_RANK; an unranked code such as CD_75 must be
          rejected at the boundary rather than stored with a null rank that would silently
          break every variance-basis selection afterwards.
        test_recipe:
          setup:
            - "one CmarProject in gmp_status PRECONSTRUCTION"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
          trigger:
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "CD_75", submitted_cost_of_work: 1000000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
          assert:
            - "the response code is 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /estimates?project_id=${proj} returns 0 rows"
            - "the same call with milestone_code CD_50 returns 201 with milestone_rank == 3"
            - "a negative submitted_cost_of_work of -1.00 is likewise rejected with 400 ERR_INVALID_REQUEST"

      - name: estimate_creation_naming_an_unknown_project_returns_project_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_50_ERR_PROJECT_NOT_FOUND
          - entities.ProgressiveEstimate.fields.project_id
        distinguishing_aspect: |
          project_id arrives in the BODY here rather than the path, and the body-reference rule
          sits at priority 50 - below the path lookups but above every state check - so an
          unknown parent yields 404 ERR_PROJECT_NOT_FOUND and never the 412 stale-version error,
          even though the optimistic-concurrency field is present and cannot possibly match.
        test_recipe:
          setup:
            - "one CmarProject registered so a real version value is available to send"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, projv1: $.data.version }
          trigger:
            - call: "POST /estimates"
              payload: { project_id: "22222222-2222-4222-8222-222222222222", milestone_code: "SD", submitted_cost_of_work: 900000.00, expected_project_version: "${projv1}" }
              as: ConstructionManager
          assert:
            - "the response code is 404 with data.error_id == ERR_PROJECT_NOT_FOUND"
            - "the response is NOT 412 ERR_STALE_PROJECT_VERSION"
            - "CmarProject.${proj}.version == ${projv1} - the real project was not touched"
            - "GET /estimates returns 0 rows"

      - name: cost_report_line_naming_another_projects_work_package_is_rejected
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - validations.priority_90_ERR_CROSS_PROJECT_REFERENCE
          - entities.CostReport.fields.lines
        distinguishing_aspect: |
          The topology is flat, so nothing in the URL prevents a cost-report line from naming a
          work package that belongs to a different project; referential integrity is a declared
          check rather than a structural guarantee, and it must fire with
          ERR_CROSS_PROJECT_REFERENCE at 422 even though both rows exist and both ids resolve.
        test_recipe:
          setup:
            - "CmarProject A with gmp_status EXECUTED and one OPEN CostReport"
            - "CmarProject B with one WorkPackage 07-ROOFING"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_a: $.data.id, av1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj_a}", milestone_code: "CD_100", submitted_cost_of_work: 1000000.00, expected_project_version: "${av1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj_a}"
              payload: {}
              as: ConstructionManager
              captures: { av2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj_a}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${av2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /cost-reports"
              payload: { project_id: "${proj_a}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
              captures: { cr: $.data.id }
            - call: "POST /projects"
              payload: { name: "Northgate Transit Center", owner_org: "Northgate Transit Authority", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_b: $.data.id }
            - call: "POST /work-packages"
              payload: { project_id: "${proj_b}", trade_division: "07-ROOFING", budget_amount: 480000.00, self_perform_intent: false }
              as: ConstructionManager
              captures: { wp_b: $.data.id }
          trigger:
            - call: "POST /cost-reports/${cr}/lines"
              payload: { cost_code: "07-100", quantity: 1, unit_rate: 5000.00, markup_pct: 0.0000, work_package_id: "${wp_b}", disputed: false }
              as: ConstructionManager
          assert:
            - "the response code is 422 with data.error_id == ERR_CROSS_PROJECT_REFERENCE"
            - "CostReport.${cr}.line_count == 0 and reported_cost_total == 0.00"
            - "the same call with work_package_id omitted returns 201 with line_count == 1 and reported_cost_total == 5000.00"

  # ===================================================================
  - section: state_machines
    instances:
      - name: estimate_creation_mints_draft_at_the_initial_state_with_no_variance_basis
        claim_type: initial_state
        grounds:
          - state_machines.ProgressiveEstimate.status
          - calculations.estimate_milestone_variance
          - endpoints.POST_/estimates
        distinguishing_aspect: |
          The first estimate of a project has no reconciled predecessor, so the variance rule
          must take its NO_BASIS branch - variance_pct exactly 0.0000 with a null
          variance_basis_estimate_id - rather than a null ratio or a divide-by-zero. The row
          is also born DRAFT, never SUBMITTED: creation and submission are two distinct calls.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
          trigger:
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
          assert:
            - "the response code is 201 with data.status == DRAFT"
            - "ProgressiveEstimate.${est}.milestone_rank == 1, the MILESTONE_RANK value for SD"
            - "ProgressiveEstimate.${est}.variance_pct == 0.0000 and variance_basis == NO_BASIS and variance_basis_estimate_id is null"
            - "ProgressiveEstimate.${est}.reconciliation_stale == false and superseded_by_estimate_id is null"
            - "CmarProject.${proj}.gmp_status == PRECONSTRUCTION: creating an estimate does not advance the project axis"

      - name: proposal_submit_advances_the_proposal_and_the_project_axis_together
        claim_type: valid_transition
        grounds:
          - state_machines.GmpProposal.status
          - state_machines.CmarProject.gmp_status
          - endpoints.POST_/gmp-proposals/{id}/submit
        distinguishing_aspect: |
          One call moves two machines: GmpProposal DRAFT -> OWNER_REVIEW and, because the
          proposal_type is BASE, CmarProject PRECONSTRUCTION -> GMP_UNDER_REVIEW. The priced
          figures already live on the proposal row from creation, but NONE of them may be
          copied onto the project yet - submission is not execution.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
          trigger:
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: { cover_note: "GMP proposal for owner review" }
              as: ConstructionManager
          assert:
            - "the response code is 200 with data.status == OWNER_REVIEW and data.proposal_type == BASE"
            - "GmpProposal.${prop}.provisional_fee_amount == 44000.00, insurance_amount == 11440.00, cm_fee_amount == 44457.60 and gmp_amount == 1245897.60, all pinned at creation"
            - "GmpProposal.${prop}.amount_delta == 0.00 and revision_count == 0"
            - "CmarProject.${proj}.gmp_status == GMP_UNDER_REVIEW"
