      - "POST /commercial/part-orders/{orderId}/pick — pick order"
      - "POST /commercial/part-orders/{orderId}/refit — return order to routing"
      - "POST /commercial/part-orders/{orderId}/return — return order"
      - "POST /commercial/core-returns — open core return"
      - "POST /commercial/warranty-registrations — record warranty"
      - "POST /commercial/rep-coverages — assign coverage"
      - "POST /commercial/rep-coverages/{coverageId}/extend and /end — amend coverage"
      - "POST /commercial/vehicles — register vehicle"
      - "POST /commercial/sales-reps — create rep"
      - "POST /commercial/tool-loans — request loan"
    shared_operations:
      - "GET reads across every collection"

  - name: DeliveryDriver
