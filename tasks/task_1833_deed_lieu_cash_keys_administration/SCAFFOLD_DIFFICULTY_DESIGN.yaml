            - "Loan.${loan_id}.status == DEED_IN_LIEU_COMPLETED, servicing_system_synced == true, deficiency_balance_cents == 0, foreclosure_referral_status == WITHDRAWN (hops 3-4)"
            - "SettlementAgreement.${ag_id}.status == COMPLETED"

      - name: report_submit_cascade_to_disbursement_state
