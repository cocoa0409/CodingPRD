  # ---------------------------------------------------------------------------
  - section: complexity_layers
    instances:
      - name: occ_plan_create_stale_leg_version
        claim_type: violation_to_error
        grounds: ["concurrency_rules[plan-create-stale-leg]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "After plan #1 creation bumps FlightLeg.version 1 -> 2, a second plan create carrying the stale expected_leg_version 1 is rejected 412 ERR_STALE_VERSION — deterministic, sequential OCC."
        test_recipe:
          setup: ["Standard stations/aircraft/crew; leg created (version 1)"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAAA", runway_length_m: 2500, alternate_distance_nm: 10, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { sta: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KBBB", runway_length_m: 2500, alternate_distance_nm: 0, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stb: $.data.id } }
            - { call: "POST /dispatch/stations", payload: { iata_code: "KAL1", runway_length_m: 2500, alternate_distance_nm: 90, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { alt1: $.data.id } }
            - { call: "POST /dispatch/aircraft", payload: { tail_no: "N100AA", type_code: "A320", oew_kg: 42000, mzfw_kg: 61000, mtow_kg: 73500, mlw_kg: 64500, fuel_capacity_kg: 19000, cruise_tas_kts: 450, burn_kg_per_hour: 2600, min_runway_m: 1800, lemac_m: 17.0, mac_m: 4.0 }, as: DispatchSupervisor, captures: { ac1: $.data.id } }
            - { call: "POST /dispatch/dispatchers", payload: { name: "Dana One", license_no: "D001", max_active_legs: 6 }, as: DispatchSupervisor, captures: { d1: $.data.id } }
            - { call: "POST /dispatch/captains", payload: { name: "Cole One", license_no: "C001", qualified_type_codes: ["A320"] }, as: DispatchSupervisor, captures: { c1: $.data.id } }
            - { call: "POST /dispatch/legs", payload: { flight_no: "FD830", dep_station_id: "${sta}", arr_station_id: "${stb}", aircraft_id: "${ac1}", captain_id: "${c1}", distance_nm: 1200, sched_dep_utc: "2026-05-01T10:00:00Z", sched_arr_utc: "2026-05-01T12:30:00Z", dispatcher_id: "${d1}" }, as: Dispatcher, as_user_id: "${d1}", captures: { leg1: $.data.id, leg1_v: $.data.version } }
          trigger:
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT", cruise_altitude_ft: 35000, forecast_wind_kts: 30, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { p1: $.data.id, p1_seq: $.data.plan_seq } }
            - { call: "POST /dispatch/plans", payload: { leg_id: "${leg1}", route_code: "DCT ALT DCT", cruise_altitude_ft: 37000, forecast_wind_kts: 10, wind_assumption: "FORECAST", expected_leg_version: "${leg1_v}" }, as: Dispatcher, as_user_id: "${d1}", captures: { stale_err: $.data.error_id } }
          assert:
            - "p1_seq == 1 (first plan succeeded with version 1)"
            - "stale_err == ERR_STALE_VERSION (HTTP 412) — the second request's view (version 1) is stale after the first bumped it to 2"

      - name: occ_weather_replace_stale_station_version
        claim_type: violation_to_error
        grounds: ["concurrency_rules[weather-replace-stale-station]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Weather create bumps Station.version 1 -> 2; first replace (expected 2) succeeds (version -> 3); second replace still carrying 2 is rejected 412 — sequential OCC on the station aggregate."
        test_recipe:
          setup: ["Station KWTH with one ACTIVE package (station version 2 after create+weather)"]
          setup_api_calls:
            - { call: "POST /dispatch/stations", payload: { iata_code: "KWTH", runway_length_m: 2500, alternate_distance_nm: 50, min_ceiling_ft: 200, min_visibility_m: 800 }, as: DispatchSupervisor, captures: { stw: $.data.id } }
            - { call: "POST /dispatch/weather-packages", payload: { station_id: "${stw}", valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 1000, visibility_m: 5000 }, as: DispatchSupervisor, captures: { wx1: $.data.id } }
            - { call: "GET /dispatch/stations/${stw}", as: DispatchSupervisor, captures: { stw_v: $.data.version } }
          trigger:
            - { call: "POST /dispatch/weather-packages/${wx1}/replace", payload: { valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 900, visibility_m: 4500, expected_station_version: "${stw_v}" }, as: DispatchSupervisor, captures: { wx2: $.data.id } }
            - { call: "POST /dispatch/weather-packages/${wx2}/replace", payload: { valid_from_utc: "2026-05-01T09:00:00Z", valid_to_utc: "2026-05-01T13:00:00Z", ceiling_ft: 800, visibility_m: 4000, expected_station_version: "${stw_v}" }, as: DispatchSupervisor, captures: { stale_err: $.data.error_id } }
          assert:
            - "wx2 created (201) with expected_station_version == 2"
            - "stale_err == ERR_STALE_VERSION (HTTP 412) on the replayed version"

