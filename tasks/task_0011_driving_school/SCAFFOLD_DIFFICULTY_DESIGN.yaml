# =============================================================================
# Driving School Appointment Management — Test Targeting Index (§1.8)
# Cross-references §1.1–§1.7 of SCAFFOLD.yaml against the nine Difficulty Rules
# defined in §0.5 of the scaffold-generator skill.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: student_minutes_remaining_provisional_vs_final
        grounds:
          - calculations.minutes_remaining_provisional
          - calculations.minutes_remaining_final
          - entities.Student.fields.minutes_remaining_provisional
          - entities.Student.fields.minutes_remaining_final
          - state_machines.PracticeAppointment.IN_PROGRESS_to_COMPLETED
          - calculations.gps_validation
        distinguishing_aspect: |
          The two variants operate on the Student entity's package balance.
          Provisional deducts every PracticeAppointment in {BOOKED, IN_PROGRESS, COMPLETED}
          using scheduled_minutes; Final deducts only PracticeAppointment.status=COMPLETED
          AND gps_validated=true using recorded_minutes. The variants diverge whenever
          a COMPLETED appointment has gps_validated=false (recorded_minutes=0 but
          scheduled_minutes still consumed by the provisional accounting).
        test_recipe:
          setup:
            - "Create CoursePackage P with total_minutes=2000, total_price_cents=200000, included_simulator_sessions=10, included_exam_attempts=6, per_minute_overage_price_cents=200, per_simulator_session_overage_price_cents=15000"
            - "Create Student S; verify-identity; submit-medical-cert (expires_on far in future); select-package P; sign-contract → S.enrollment_status=ACTIVE, training_stage=THEORY"
            - "Create Instructor I with vehicle_qualifications=[MANUAL_C1]; create Vehicle V with vehicle_type=MANUAL_C1"
            - "Book PracticeAppointment A with student=S, instructor=I, vehicle=V, training_stage=THEORY, scheduled_start_at=clock_now+60min, scheduled_end_at=clock_now+120min (60 min)"
            - "POST /_clock/advance with minutes=70 (now within check-in window)"
            - "POST /practice-appointments/{A.id}/check-in (as I) → A.status=IN_PROGRESS"
            - "POST /_clock/advance with minutes=55 (now past scheduled_end_at)"
          trigger:
            - "POST /practice-appointments/{A.id}/check-out (as I) with gps_track_distance_km=4.99"
          assert:
            - "A.status == 'COMPLETED'"
            - "A.gps_validated == false"
            - "A.recorded_minutes == 0"
            - "GET /students/{S.id} returns Student.minutes_remaining_provisional == 1940"
            - "GET /students/{S.id} returns Student.minutes_remaining_final == 2000"
            - "Student.minutes_remaining_final - Student.minutes_remaining_provisional == 60"

      - name: instructor_working_minutes_provisional_vs_actual
        grounds:
          - calculations.instructor_working_minutes_today_provisional
          - entities.Instructor.fields.working_minutes_today
          - validations[priority=8]
          - state_machines.PracticeAppointment.BOOKED_to_IN_PROGRESS
        distinguishing_aspect: |
          The Instructor working-minutes calculation has two variants on a different entity
          domain (Instructor, not Student). Provisional sums BOOKED + IN_PROGRESS + COMPLETED
          working minutes for the day; Actual sums only COMPLETED. The system gates booking
          on the Provisional variant: a 9th 60-min booking is rejected when 8 prior 60-min
          BOOKED appointments already exist (provisional=480 at limit), even though zero
          appointments have been checked-in (actual=0). A reader who used Actual would
          accept the 9th booking.
        test_recipe:
          setup:
            - "Create CoursePackage P_large with total_minutes=10000, per_minute_overage_price_cents=200, included_simulator_sessions=10, included_exam_attempts=6, total_price_cents=1000000, per_simulator_session_overage_price_cents=15000"
            - "Create 8 distinct Students S1..S8, all activated with package P_large, all training_stage=THEORY"
            - "Create Instructor I with vehicle_qualifications=[MANUAL_C1]"
            - "Create 8 Vehicles V1..V8 with vehicle_type=MANUAL_C1 (one per slot to avoid vehicle conflicts)"
            - "Book 8 PracticeAppointments today with instructor=I, each 60 minutes, in non-adjacent windows: 06:00-07:00, 07:30-08:30, 09:00-10:00, 10:30-11:30, 12:00-13:00, 13:30-14:30, 15:00-16:00, 16:30-17:30 (instructor calendar uses closed intervals; 30-min gaps prevent ERR_INSTRUCTOR_TIME_CONFLICT). All 8 BOOKED."
            - "Do NOT check-in any appointment, so working_minutes_today_actual==0 while working_minutes_today_provisional==480"
            - "Create Student S9 (activated, package=P_large, training_stage=THEORY); create Vehicle V9 (MANUAL_C1)"
          trigger:
            - "POST /practice-appointments with student=S9, instructor=I, vehicle=V9, training_stage=THEORY, scheduled_start_at=18:00 today, scheduled_end_at=19:00 today (60 min)"
          assert:
            - "Response is 403 with error_id == 'ERR_INSTRUCTOR_DAILY_LIMIT_EXCEEDED'"
            - "GET /instructors/{I.id} returns working_minutes_today == 480 (no checked-in appointments contribute, but provisional accounting reaches the cap)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: late_cancellation_fee_tiered_three_inputs
        grounds:
          - calculations.late_cancellation_fee_cents
          - state_machines.PracticeAppointment.BOOKED_to_CANCELLED
          - entities.PracticeAppointment.fields.late_cancellation_fee_cents
          - entities.CoursePackage.fields.per_minute_overage_price_cents
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs (delta_hours, scheduled_minutes,
          per_minute_overage_price_cents) and non-linear interaction (tiered branching:
          <2h=100%, <24h=50%, <72h=0%). Boundaries pinned with strict less-than.
        test_recipe:
          setup:
            - "Create CoursePackage P (total_minutes=2000, per_minute_overage_price_cents=200, total_price_cents=200000, included_simulator_sessions=10, included_exam_attempts=6, per_simulator_session_overage_price_cents=15000)"
            - "Create Student S, activate with package P; create Instructor I (MANUAL_C1), Vehicle V (MANUAL_C1)"
            - "Book PracticeAppointment A with scheduled_start_at = clock_now + 60 minutes, scheduled_end_at = clock_now + 120 minutes (60-min slot)"
          trigger:
            - "POST /practice-appointments/{A.id}/cancel (as Admin) at clock_now (delta_hours = 1.0)"
          assert:
            - "A.status == 'CANCELLED'"
            - "A.late_cancellation_fee_cents == 12000   # 60 minutes * 200 cents/min * 100% tier (delta_hours<2 → tier=100%)"

      - name: simulator_billing_evaluation_order_pinned
        grounds:
          - calculations.simulator_billing
          - entities.SimulatorSession.fields.charged_to_package
          - entities.SimulatorSession.fields.overage_cents
          - entities.Student.fields.simulator_sessions_remaining
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency. The new SimulatorSession's
          charged_to_package value depends on Student.simulator_sessions_remaining,
          which itself is computed from the count of SimulatorSessions in {BOOKED,
          COMPLETED}. Without an evaluation order, the new session would be both
          "in" (counted) and "out" (not counted) of its own remaining computation.
          The scaffold pins: evaluate simulator_sessions_remaining BEFORE inserting
          the new session, so the new session sees the pre-insert count.
        test_recipe:
          setup:
            - "Create CoursePackage P_sim with total_minutes=2000, included_simulator_sessions=2, included_exam_attempts=6, per_minute_overage_price_cents=200, per_simulator_session_overage_price_cents=15000, total_price_cents=200000"
            - "Create Student S, activate with package P_sim"
            - "Book SimulatorSession SS1 (60-min slot in the future) — should be charged_to_package=true, overage_cents=0"
            - "Book SimulatorSession SS2 (different slot) — should be charged_to_package=true, overage_cents=0"
            - "Now Student.simulator_sessions_remaining == 0"
          trigger:
            - "POST /simulator-sessions with student=S, scheduled_start_at=tomorrow 10:00, scheduled_end_at=tomorrow 11:00 (the 3rd session)"
          assert:
            - "Response is 201"
            - "SS3.charged_to_package == false"
            - "SS3.overage_cents == 15000   # equals package.per_simulator_session_overage_price_cents because remaining-BEFORE was 0"
            - "GET /students/{S.id} returns simulator_sessions_remaining == 0   # not -1; pinned floor at 0"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: complaint_in_review_to_escalated_cycle
        grounds:
          - state_machines.Complaint.OPEN_to_IN_REVIEW
          - state_machines.Complaint.IN_REVIEW_to_ESCALATED
          - state_machines.Complaint.ESCALATED_to_IN_REVIEW
          - entities.Complaint.fields.level
          - entities.Complaint.fields.status
        distinguishing_aspect: |
          Complaint's state machine is cyclic: IN_REVIEW → ESCALATED (via /escalate)
          → IN_REVIEW (via /assign-handler at the new level). The same Complaint can
          revisit IN_REVIEW multiple times, each time at a higher level (1→2→3),
          but the level field monotonically increases — bounded cycle.
        test_recipe:
          setup:
            - "Create Student S, activate; file Complaint C with category=BILLING, description='wrong charge'"
            - "C.status=='OPEN', C.level==1"
          trigger:
            - "POST /complaints/{C.id}/assign-handler with handler_id='handler_01', handler_role='ComplaintHandler' (as Admin)"
            - "POST /complaints/{C.id}/escalate (as ComplaintHandler with X-User-ID=handler_01)"
            - "POST /complaints/{C.id}/assign-handler with handler_id='handler_02', handler_role='ComplaintHandler' (as Admin)"
            - "POST /complaints/{C.id}/escalate (as ComplaintHandler with X-User-ID=handler_02)"
          assert:
            - "Complaint after step 1: status=='IN_REVIEW', level==1"
            - "Complaint after step 2: status=='ESCALATED', level==2"
            - "Complaint after step 3: status=='IN_REVIEW', level==2   # cycle observed"
            - "Complaint after step 4: status=='ESCALATED', level==3"
            - "GET /audit-logs?entity_type=Complaint&entity_id={C.id} returns at least 4 entries (ASSIGN_HANDLER, ESCALATE, ASSIGN_HANDLER, ESCALATE)"

      - name: student_active_suspended_cycle
        grounds:
          - state_machines.Student.ACTIVE_to_SUSPENDED
          - state_machines.Student.SUSPENDED_to_ACTIVE
          - entities.Student.fields.enrollment_status
          - entities.Student.fields.suspension_reason
        distinguishing_aspect: |
          Student.enrollment_status has a cyclic sub-graph ACTIVE↔SUSPENDED on a
          DIFFERENT entity from Complaint. The transitions are admin-driven (suspend/
          reinstate). A student can be re-suspended after reinstatement, demonstrating
          that the cycle is unbounded in count (unlike Complaint.level which caps at 3).
        test_recipe:
          setup:
            - "Create Student S; activate (PENDING_VERIFICATION → … → ACTIVE)"
            - "Initial S.enrollment_status == 'ACTIVE', S.suspension_reason == null"
          trigger:
            - "POST /students/{S.id}/suspend"
            - "POST /students/{S.id}/reinstate"
            - "POST /students/{S.id}/suspend"
          assert:
            - "After step 1: Student.enrollment_status == 'SUSPENDED', Student.suspension_reason == 'ADMIN_ACTION'"
            - "After step 2: Student.enrollment_status == 'ACTIVE', Student.suspension_reason == null"
            - "After step 3: Student.enrollment_status == 'SUSPENDED', Student.suspension_reason == 'ADMIN_ACTION'"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: noshow_threshold_cascade_depth4
        grounds:
          - state_machines.PracticeAppointment.BOOKED_to_NO_SHOW
          - state_machines.Student.ACTIVE_to_SUSPENDED
          - entities.Student.fields.no_show_count_this_cycle
          - entities.Student.fields.suspension_reason
          - entities.PracticeAppointment.fields.cancellation_actor_role
        distinguishing_aspect: |
          Depth-4 cascade originating from POST /_sweep/run. Step 1: sweep flips three
          BOOKED appointments to NO_SHOW. Step 2: Student.no_show_count_this_cycle is
          recomputed and reaches 3 (the threshold) — caused by step 1. Step 3:
          Student.enrollment_status flips ACTIVE→SUSPENDED with reason=NO_SHOW_THRESHOLD_BREACH —
          caused by step 2. Step 4: every other BOOKED practice for this student is
          auto-cancelled with cancellation_actor_role='system' — caused by step 3 (the
          suspension), not directly by the sweep. Each link is caused by the previous,
          not by the original trigger.
        test_recipe:
          setup:
            - "Create CoursePackage P (defaults: total_minutes=2000, per_minute_overage_price_cents=200, included_simulator_sessions=10, included_exam_attempts=6, per_simulator_session_overage_price_cents=15000, total_price_cents=200000)"
            - "Create Student S, activate with P (training_stage=THEORY)"
            - "Create Instructor I (MANUAL_C1); create Vehicle V (MANUAL_C1)"
            - "Book PracticeAppointment A: scheduled_start=clock_now+30min, end=clock_now+90min"
            - "Book PracticeAppointment B: scheduled_start=clock_now+150min, end=clock_now+210min (gap 60 min from A — instructor closed-interval safe)"
            - "Book PracticeAppointment C: scheduled_start=clock_now+270min, end=clock_now+330min"
            - "Book PracticeAppointment D (FUTURE, intended for cascade cancel): scheduled_start=clock_now+10 days, end=clock_now+10 days + 60min"
            - "Confirm Student.no_show_count_this_cycle == 0, Student.enrollment_status == 'ACTIVE', D.status == 'BOOKED'"
            - "POST /_clock/advance with minutes=400 (so A, B, C are all past scheduled_end_at + NO_SHOW_GRACE_MINUTES)"
          trigger:
            - "POST /_sweep/run"
          assert:
            - "A.status == 'NO_SHOW'"
            - "B.status == 'NO_SHOW'"
            - "C.status == 'NO_SHOW'"
            - "Student.enrollment_status == 'SUSPENDED'   # cascade step 3"
            - "Student.suspension_reason == 'NO_SHOW_THRESHOLD_BREACH'"
            - "D.status == 'CANCELLED'   # cascade step 4 (caused by suspension)"
            - "D.cancellation_actor_role == 'system'"
            - "D.late_cancellation_fee_cents == 0"

      - name: final_test_pass_completion_cascade_depth4
        grounds:
          - state_machines.ExamAppointment.BOOKED_to_PASSED
          - state_machines.Student.ACTIVE_to_COMPLETED
          - calculations.training_stage_advance
          - entities.Student.fields.training_stage
          - entities.Student.fields.enrollment_status
          - entities.TrainingHourRecord.fields.authority_submission_status
          - entities.TrainingHourRecord.fields.submitted_at
        distinguishing_aspect: |
          Depth-4 cascade from POST /exam-appointments/{id}/record-result with FINAL_TEST + score>=85.
          Step 1: Exam BOOKED→PASSED. Step 2: Student.training_stage HIGHWAY→COMPLETED
          (caused by step 1). Step 3: Student.enrollment_status ACTIVE→COMPLETED
          (caused by step 2 — only fires when training_stage advances to COMPLETED).
          Step 4: every TrainingHourRecord for this student with authority_submission_status=PENDING
          flips to SUBMITTED with submitted_at=clock_now (caused by step 3 — the enrollment
          completion is what triggers the authority submission, not the exam result alone).
          Originating trigger differs from instance 1 (record-result vs sweep).
        test_recipe:
          setup:
            - "Create CoursePackage P (defaults)"
            - "Create Student S, activate with P → training_stage=THEORY"
            - "Create Instructor I_basic with qualifications=[MANUAL_C1]; Vehicle V (MANUAL_C1)"
            - "Book + record THEORY_TEST exam PASSED (score=95) → S.training_stage=BASIC, S.has_passed_theory=true"
            - "Book + execute 10 × 60-min PracticeAppointments at training_stage=BASIC (with check-in/check-out at gps_track_distance_km=10.0 each), creating 10 TrainingHourRecord entries (gps_validated=true, training_stage=BASIC, minutes_recorded=60 each → 600 BASIC minutes)"
            - "Book + record BASIC_TEST exam PASSED (score=85) → S.training_stage=HIGHWAY, S.has_passed_basic_practical=true"
            - "Book + execute 8 × 60-min PracticeAppointments at training_stage=HIGHWAY (with valid GPS), creating 8 more TrainingHourRecord entries (training_stage=HIGHWAY, gps_validated=true, minutes_recorded=60 each → 480 HIGHWAY minutes)"
            - "Confirm: GET /students/{S.id}/training-hours returns totals_validated.BASIC>=600 AND totals_validated.HIGHWAY>=480, and all 18 records have authority_submission_status='PENDING'"
            - "Book ExamAppointment E for S, exam_type=FINAL_TEST, scheduled_at in 1 hour, examiner_id='ex_01'"
            - "Confirm S.enrollment_status == 'ACTIVE', S.training_stage == 'HIGHWAY'"
          trigger:
            - "POST /exam-appointments/{E.id}/record-result with score=90 (as Examiner with X-User-ID='ex_01')"
          assert:
            - "E.status == 'PASSED'"
            - "Student.training_stage == 'COMPLETED'   # cascade step 2"
            - "Student.enrollment_status == 'COMPLETED'   # cascade step 3"
            - "GET /students/{S.id}/training-hours returns every TrainingHourRecord with authority_submission_status == 'SUBMITTED' AND submitted_at != null   # cascade step 4"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_beats_temporal_on_practice_booking
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.Student.ACTIVE_to_SUSPENDED
          - calculations.instructor_calendar_overlap_check
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_temporal (priority 7). When a request
          would simultaneously fail ERR_STUDENT_NOT_ACTIVE (state) AND
          ERR_INSTRUCTOR_TIME_CONFLICT (temporal), state must win — the test asserts
          ERR_STUDENT_NOT_ACTIVE is returned, not the temporal error.
        test_recipe:
          setup:
            - "Create CoursePackage P (defaults); create Student S, activate; create Instructor I (MANUAL_C1); Vehicle V (MANUAL_C1)"
            - "Book PracticeAppointment A: student=S, instructor=I, vehicle=V, training_stage=THEORY, scheduled_start_at=tomorrow 10:00, scheduled_end_at=tomorrow 11:00 → A.status='BOOKED'"
            - "POST /students/{S.id}/suspend → S.enrollment_status='SUSPENDED'"
          trigger:
            - "POST /practice-appointments with student=S, instructor=I, vehicle=V, training_stage=THEORY, scheduled_start_at=tomorrow 10:30, scheduled_end_at=tomorrow 11:30 (overlaps A on instructor)"
          assert:
            - "Response is 409"
            - "error_id == 'ERR_STUDENT_NOT_ACTIVE'   # priority-5 state beats priority-7 temporal"

      - name: referential_beats_fiscal_on_practice_booking
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - calculations.minutes_remaining_provisional
          - entities.PracticeAppointment.fields.vehicle_type
          - entities.Student.fields.training_stage
        distinguishing_aspect: |
          Pair: business_referential (priority 6) vs business_fiscal (priority 10).
          DIFFERENT pair from instance 1. ERR_VEHICLE_TYPE_MISMATCH (referential —
          THEORY-stage students cannot book MOTORCYCLE_E vehicles) AND
          ERR_INSUFFICIENT_PACKAGE_BALANCE (fiscal — minutes_remaining_provisional
          would go negative) both apply on the same request. Referential wins.
        test_recipe:
          setup:
            - "Create CoursePackage P_small with total_minutes=60, per_minute_overage_price_cents=200, included_simulator_sessions=2, included_exam_attempts=4, per_simulator_session_overage_price_cents=15000, total_price_cents=12000"
            - "Create Student S, activate with P_small; S.training_stage=THEORY"
            - "Create Instructor I with qualifications=[MANUAL_C1, MOTORCYCLE_E]; Vehicle V_manual (MANUAL_C1); Vehicle V_motor (MOTORCYCLE_E)"
            - "Book PracticeAppointment A: student=S, instructor=I, vehicle=V_manual, training_stage=THEORY, 60-min slot in the future → A.status='BOOKED'; Student.minutes_remaining_provisional==0"
          trigger:
            - "POST /practice-appointments with student=S, instructor=I, vehicle=V_motor, training_stage=THEORY, scheduled_start_at=tomorrow 14:00, scheduled_end_at=tomorrow 15:00 (60 min, non-overlapping slot)"
          assert:
            - "Response is 400"
            - "error_id == 'ERR_VEHICLE_TYPE_MISMATCH'   # priority-6 referential beats priority-10 fiscal"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: gps_distance_inclusive_minimum_at_check_out
        grounds:
          - calculations.gps_validation
          - entities.PracticeAppointment.fields.gps_validated
          - entities.PracticeAppointment.fields.recorded_minutes
          - state_machines.PracticeAppointment.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          Numeric metric on the check-out endpoint. Boundary semantics: `>=` (inclusive)
          at MIN_DRIVING_KM=5.0. At exactly 5.00 km → gps_validated=true,
          recorded_minutes=scheduled_minutes. A reader using strict `>` would mark
          5.00 as invalid. Distinct endpoint and metric from the count-edge instance below.
        test_recipe:
          setup:
            - "Create CoursePackage P (defaults); create Student S, activate; Instructor I (MANUAL_C1), Vehicle V (MANUAL_C1)"
            - "Book PracticeAppointment A: scheduled_start_at=clock_now+60min, scheduled_end_at=clock_now+120min (60 min)"
            - "POST /_clock/advance with minutes=60 (now within check-in window)"
            - "POST /practice-appointments/{A.id}/check-in"
            - "POST /_clock/advance with minutes=60 (now at scheduled_end_at)"
          trigger:
            - "POST /practice-appointments/{A.id}/check-out with gps_track_distance_km=5.00"
          assert:
            - "A.status == 'COMPLETED'"
            - "A.gps_validated == true   # 5.00 >= MIN_DRIVING_KM (5.0); inclusive boundary"
            - "A.recorded_minutes == 60"

      - name: reschedule_count_limit_at_third_reschedule
        grounds:
          - validations[priority=9]
          - entities.Student.fields.reschedule_count_this_cycle
          - entities.PracticeAppointment.fields.reschedule_of_id
        distinguishing_aspect: |
          Count metric on the reschedule endpoint (NOT the check-out endpoint of
          instance 1). Boundary at exactly RESCHEDULE_LIMIT_PER_CYCLE=3: at count==3
          the next reschedule is rejected. The transition is empty-set semantics
          (no remaining capacity), distinct from the inclusive numeric ≥ above.
        test_recipe:
          setup:
            - "Create CoursePackage P (defaults); Student S, activate; Instructor I (MANUAL_C1), Vehicle V (MANUAL_C1)"
            - "Book PracticeAppointment A: stage=THEORY, scheduled_start_at = tomorrow 09:00, end = tomorrow 10:00 → A.status='BOOKED'"
            - "POST /practice-appointments/{A.id}/reschedule with new_scheduled_start_at=tomorrow 11:00, end=tomorrow 12:00 → creates A1 (reschedule_of_id=A.id), A→CANCELLED. Student.reschedule_count_this_cycle==1"
            - "POST /practice-appointments/{A1.id}/reschedule with new times=tomorrow 13:00-14:00 → A2; count==2"
            - "POST /practice-appointments/{A2.id}/reschedule with new times=tomorrow 15:00-16:00 → A3; count==3"
          trigger:
            - "POST /practice-appointments/{A3.id}/reschedule with new_scheduled_start_at=tomorrow 17:00, new_scheduled_end_at=tomorrow 18:00"
          assert:
            - "Response is 409"
            - "error_id == 'ERR_RESCHEDULE_LIMIT_EXCEEDED'"
            - "A3.status remains 'BOOKED'   # the rejected reschedule must NOT cancel A3"
            - "GET /students/{S.id} returns Student.reschedule_count_this_cycle == 3"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: practice_booking_requires_instructor_active
        grounds:
          - state_machines.Instructor.ACTIVE_to_SUSPENDED
          - validations[priority=5]
          - entities.Instructor.fields.status
          - entities.PracticeAppointment.fields.instructor_id
        distinguishing_aspect: |
          Entity pair: PracticeAppointment ↔ Instructor. The PracticeAppointment
          BOOKED creation transition is gated by Instructor.status==ACTIVE. The two
          entities have no parent-child relationship; the dependency is via foreign-key
          state lookup. Disjoint from instance 2's pair (no shared entity).
        test_recipe:
          setup:
            - "Create CoursePackage P (defaults); Student S, activate"
            - "Create Instructor I with qualifications=[MANUAL_C1]; Vehicle V (MANUAL_C1)"
            - "POST /instructors/{I.id}/suspend → I.status='SUSPENDED'"
          trigger:
            - "POST /practice-appointments with student=S, instructor=I, vehicle=V, training_stage=THEORY, scheduled_start_at=tomorrow 09:00, scheduled_end_at=tomorrow 10:00"
          assert:
            - "Response is 409"
            - "error_id == 'ERR_INSTRUCTOR_NOT_ACTIVE'"

      - name: exam_booking_requires_student_training_stage
        grounds:
          - validations[priority=6]
          - entities.Student.fields.training_stage
          - entities.ExamAppointment.fields.exam_type
          - entities.ExamAppointment.fields.prerequisite_stage
        distinguishing_aspect: |
          Entity pair: ExamAppointment ↔ Student (different from instance 1's
          PracticeAppointment ↔ Instructor pair — no shared entity). The
          ExamAppointment BOOKED creation transition for exam_type=FINAL_TEST
          requires Student.training_stage=='HIGHWAY' (the prerequisite_stage). A
          THEORY-stage student attempting to book FINAL_TEST violates the
          referential-integrity dependency on the cross-entity state.
        test_recipe:
          setup:
            - "Create CoursePackage P (defaults); Student S, activate → S.training_stage='THEORY'"
          trigger:
            - "POST /exam-appointments with student=S, exam_type='FINAL_TEST', scheduled_at=tomorrow 10:00, examiner_id='ex_01'"
          assert:
            - "Response is 400"
            - "error_id == 'ERR_PREREQUISITE_STAGE_NOT_MET'"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: instructor_calendar_closed_interval_adjacent_conflict
        grounds:
          - calculations.instructor_calendar_overlap_check
          - concurrency_rules[instructor]
          - entities.PracticeAppointment.fields.instructor_id
          - entities.PracticeAppointment.fields.scheduled_start_at
          - entities.PracticeAppointment.fields.scheduled_end_at
        distinguishing_aspect: |
          Interval semantics: closed [start, end]. Adjacency at the endpoint counts
          as overlap. Two practices at [10:00, 11:00] and [11:00, 12:00] on the same
          instructor share endpoint 11:00 → ERR_INSTRUCTOR_TIME_CONFLICT. The vehicle
          rule (instance 2) uses different semantics.
        test_recipe:
          setup:
            - "Create Student S1, activate; Instructor I (MANUAL_C1); Vehicles V1 (MANUAL_C1), V2 (MANUAL_C1)"
            - "Book PracticeAppointment A: student=S1, instructor=I, vehicle=V1, training_stage=THEORY, scheduled_start_at=tomorrow 10:00, scheduled_end_at=tomorrow 11:00 → A.status='BOOKED'"
            - "Create Student S2, activate"
          trigger:
            - "POST /practice-appointments with student=S2, instructor=I, vehicle=V2, training_stage=THEORY, scheduled_start_at=tomorrow 11:00, scheduled_end_at=tomorrow 12:00"
          assert:
            - "Response is 409"
            - "error_id == 'ERR_INSTRUCTOR_TIME_CONFLICT'   # closed-interval adjacency at 11:00 counts as overlap"

      - name: vehicle_half_open_with_buffer_conflict
        grounds:
          - calculations.vehicle_buffer_check
          - concurrency_rules[vehicle]
          - entities.PracticeAppointment.fields.vehicle_id
        distinguishing_aspect: |
          Different interval semantics from instance 1 — half-open [start, end) PLUS
          a 15-minute cleaning buffer between any two bookings on the same vehicle.
          Endpoint-touching ([10:00,11:00) then [11:00,12:00)) does NOT overlap, but
          the 0-minute gap is below the 15-min buffer → ERR_VEHICLE_TIME_CONFLICT.
          A 10-minute gap fails too; a ≥15-min gap passes. Different resource (Vehicle,
          not Instructor) and different endpoint than the closed-interval rule.
        test_recipe:
          setup:
            - "Create Student S1, activate; Instructor I1 (MANUAL_C1), Instructor I2 (MANUAL_C1); Vehicle V (MANUAL_C1)"
            - "Book PracticeAppointment A: student=S1, instructor=I1, vehicle=V, training_stage=THEORY, scheduled_start_at=tomorrow 10:00, scheduled_end_at=tomorrow 11:00 → A.status='BOOKED'"
            - "Create Student S2, activate"
          trigger:
            - "POST /practice-appointments with student=S2, instructor=I2, vehicle=V, training_stage=THEORY, scheduled_start_at=tomorrow 11:10, scheduled_end_at=tomorrow 12:10 (10-min gap from A; below 15-min buffer)"
          assert:
            - "Response is 409"
            - "error_id == 'ERR_VEHICLE_TIME_CONFLICT'   # half-open intervals don't overlap, but gap (10 min) < VEHICLE_BUFFER_MINUTES (15)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: practice_minutes_invariant_after_cancel_then_rebook
        grounds:
          - state_machines.PracticeAppointment.BOOKED_to_CANCELLED
          - calculations.minutes_remaining_provisional
          - entities.Student.fields.minutes_remaining_provisional
          - entities.PracticeAppointment.fields.scheduled_minutes
        distinguishing_aspect: |
          Conserved quantity: Student.minutes_remaining_provisional in package minutes.
          Forward action: book A (60 min) — provisional drops by 60. Compensating:
          cancel A — provisional rises by 60 (restored). Re-do: book A2 with same
          60-min duration — provisional drops by 60 again. The invariant pinned as
          a formula: `minutes_remaining_provisional_after_book_A == minutes_remaining_provisional_after_cancel_A_then_book_A2`.
          Distinct conserved quantity from instance 2 (sessions, not minutes).
        test_recipe:
          setup:
            - "Create CoursePackage P with total_minutes=2000, per_minute_overage_price_cents=200, included_simulator_sessions=10, included_exam_attempts=6, per_simulator_session_overage_price_cents=15000, total_price_cents=200000"
            - "Create Student S, activate with P; Instructor I (MANUAL_C1); Vehicles V1, V2 (MANUAL_C1)"
          trigger:
            - "Step A: POST /practice-appointments student=S instructor=I vehicle=V1 training_stage=THEORY scheduled_start_at=tomorrow 10:00 scheduled_end_at=tomorrow 11:00 → record A.id; record GET S.minutes_remaining_provisional as M1"
            - "Step B: POST /practice-appointments/{A.id}/cancel → record GET S.minutes_remaining_provisional as M2"
            - "Step C: POST /practice-appointments student=S instructor=I vehicle=V2 training_stage=THEORY scheduled_start_at=tomorrow 13:00 scheduled_end_at=tomorrow 14:00 (same 60-min duration; new slot avoids vehicle buffer + instructor closed-interval) → record GET S.minutes_remaining_provisional as M3"
          assert:
            - "M1 == 1940   # 2000 - 60"
            - "M2 == 2000   # cancel restores"
            - "M3 == 1940   # rebook same duration"
            - "M3 == M1   # invariant: cancel-then-rebook is the identity for the conserved quantity"

      - name: simulator_sessions_invariant_after_cancel_then_rebook
        grounds:
          - state_machines.SimulatorSession.BOOKED_to_CANCELLED
          - entities.Student.fields.simulator_sessions_remaining
          - entities.SimulatorSession.fields.charged_to_package
        distinguishing_aspect: |
          DIFFERENT conserved quantity from instance 1 (session count, not package
          minutes). Conserved: Student.simulator_sessions_remaining =
          package.included_simulator_sessions - count(SimulatorSession in {BOOKED,
          COMPLETED}). Forward (book) decrements; compensating (cancel) restores;
          re-book decrements again. Cancel-then-rebook leaves remaining unchanged.
        test_recipe:
          setup:
            - "Create CoursePackage P_sim with included_simulator_sessions=10 and per_simulator_session_overage_price_cents=15000 (other fields default)"
            - "Create Student S, activate with P_sim"
          trigger:
            - "Step A: POST /simulator-sessions student=S scheduled_start_at=tomorrow 10:00 scheduled_end_at=tomorrow 11:00 → record SS1.id; record GET S.simulator_sessions_remaining as N1"
            - "Step B: POST /simulator-sessions/{SS1.id}/cancel → record GET S.simulator_sessions_remaining as N2"
            - "Step C: POST /simulator-sessions student=S scheduled_start_at=tomorrow 14:00 scheduled_end_at=tomorrow 15:00 → record SS2.id; record GET S.simulator_sessions_remaining as N3"
          assert:
            - "N1 == 9   # 10 - 1"
            - "N2 == 10   # cancel restores"
            - "N3 == 9   # rebook decrements again"
            - "N3 == N1   # invariant: cancel+rebook conserves the session count"
            - "SS2.charged_to_package == true   # within package allowance"
            - "SS2.overage_cents == 0"
