scenario: |
  2833. Migrant Education Identification & Recruitment (state migrant education program): eligibility determination from qualifying moves for agricultural or fishing work with interview documentation, recruiter assignment to agricultural areas with seasonal timing, certificate of eligibility completion and quality control re-interviews, student record transfer across states through a national exchange, priority for services determination and service plan development, supplemental instruction, summer program and credit accrual support, out-of-school youth identification and alternative service delivery, continuation of eligibility term tracking and reidentification

domain_name: migrant-education-identification-recruitment
api_prefix: "/mep"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # Peer entities linked by explicit FKs, two self-referential edges
  # (Student.prior_record_student_id, EligibilityTerm.superseded_by_term_id,
  # ServicePlan.superseded_by_plan_id, ServiceDelivery.reverses_delivery_id),
  # and a junction entity (RecruiterAssignment) forming a many-to-many between
  # Recruiter and AgriculturalArea. No entity nests inside another's URL path.

  state_machine_shape: cyclic
  # CertificateOfEligibility cycles DRAFT -> SUBMITTED -> QC_SELECTED ->
  # RETURNED_FOR_CORRECTION -> DRAFT. Student carries two independent state
  # dimensions (eligibility_status x service_status) that advance on disjoint
  # triggers. RecordTransferRequest branches INITIATED -> {MATCHED, NO_MATCH}
  # with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many        # Student -> QualifyingMove, ServicePlan, EligibilityTerm
    - many_to_many       # Recruiter <-> AgriculturalArea via RecruiterAssignment
    - self_referential   # Student.prior_record_student_id, EligibilityTerm.superseded_by_term_id,
                         # ServicePlan.superseded_by_plan_id, ServiceDelivery.reverses_delivery_id
    - cross_aggregate    # CertificateOfEligibility -> QualifyingMove, InterviewRecord -> CertificateOfEligibility

  role_model: segregation_of_duties
  # The QualityControlReviewer deciding a CertificateOfEligibility's QC review
  # MUST NOT be the Recruiter who initiated that certificate. Both roles are
  # backed by the same Recruiter entity, so the constraint is an X-User-ID
  # comparison against CertificateOfEligibility.initiating_recruiter_id.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 55 endpoints / 47 error codes / 8 calculations (4 carrying
  # variants) / 6 state machines, two of them non-linear on different entities.
  # 22 of the 55 endpoints are the read surface that makes every declared FK
  # reverse-reachable; the difficulty lives in the eight calculations and the
  # four-hop approval cascade, not in the endpoint count.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================

entities:

  - name: AgriculturalArea
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: human-readable recruitment area label
        constraints: "1..120 chars, required"
      - name: state_code
        type: string
        source: input
        description: two-letter USPS code of the state that owns this area
        constraints: "exactly 2 uppercase letters"
      - name: primary_activity
        type: enum
        source: input
        description: the qualifying work sector that dominates this area
        constraints: "one of {AGRICULTURE, FISHING}"
      - name: peak_season_start_date
        type: string
        source: input
        description: first calendar date (inclusive) of the area's peak qualifying-work season
        constraints: "ISO-8601 date YYYY-MM-DD; must be <= peak_season_end_date"
      - name: peak_season_end_date
        type: string
        source: input
        description: last calendar date (inclusive) of the area's peak qualifying-work season
        constraints: "ISO-8601 date YYYY-MM-DD"
      - name: recruiter_capacity
        type: integer
        source: input
        description: maximum number of RecruiterAssignments of ANY coverage_role that may be in force on any single calendar date, after the handoff buffer is applied. Deliberately asymmetric with assigned_primary_slots_used, which counts PRIMARY rows only
        default: 1
        constraints: ">= 1 and <= 12"
      - name: status
        type: enum
        source: input
        description: whether the area currently accepts new recruiter coverage
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
      - name: assigned_primary_slots_used
        type: integer
        source: computed
        description: "count of RecruiterAssignment rows with area_id = this.id, coverage_role = 'PRIMARY' and status IN {PLANNED, ACTIVE}; the conserved quantity of the assignment create/cancel invariant"
        default: 0

  - name: Recruiter
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: recruiter's name as printed on certificates
        constraints: "1..120 chars, required"
      - name: state_code
        type: string
        source: input
        description: two-letter USPS code of the state employing this recruiter
        constraints: "exactly 2 uppercase letters"
      - name: credential_level
        type: enum
        source: input
        description: recruitment credential; QC_CERTIFIED is required to decide a QualityControlReview
        default: BASIC
        constraints: "one of {BASIC, CERTIFIED, QC_CERTIFIED}"
      - name: status
        type: enum
        source: input
        description: employment standing; only ACTIVE recruiters may receive new assignments
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: active_assignment_count
        type: integer
        source: computed
        description: "count of RecruiterAssignment rows with recruiter_id = this.id and status IN {PLANNED, ACTIVE}"
        default: 0

  - name: RecruiterAssignment
    parent: null
    common_fields: true
    fields:
      - name: recruiter_id
        type: string
        source: input
        description: "FK -> Recruiter.id; the recruiter who will cover the area"
      - name: area_id
        type: string
        source: input
        description: "FK -> AgriculturalArea.id; the area being covered"
      - name: coverage_role
        type: enum
        source: input
        description: PRIMARY assignments must span the area's whole peak season and are the only rows counted by assigned_primary_slots_used; BACKUP assignments skip the peak-season rule but still consume buffered area capacity and are still checked for per-recruiter overlap
        constraints: "one of {PRIMARY, BACKUP}"
      - name: starts_on
        type: string
        source: input
        description: first calendar date of coverage (inclusive)
        constraints: "ISO-8601 date YYYY-MM-DD; must be <= ends_on"
      - name: ends_on
        type: string
        source: input
        description: last calendar date of coverage (INCLUSIVE - the coverage interval is closed at both ends)
        constraints: "ISO-8601 date YYYY-MM-DD"
      - name: status
        type: enum
        source: system
        description: assignment lifecycle position
        default: PLANNED
        constraints: "one of {PLANNED, ACTIVE, COMPLETED, CANCELLED}"
      - name: cancelled_reason
        type: string
        source: input
        description: free-text reason recorded when the assignment is closed with outcome CANCELLED; null otherwise
        default: null
        constraints: "0..240 chars"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: child's legal name
        constraints: "1..120 chars, required"
      - name: birth_date
        type: string
        source: input
        description: date of birth, used for the age-out cap on the final eligibility window
        constraints: "ISO-8601 date YYYY-MM-DD; must be strictly before the logical clock date"
      - name: current_state_code
        type: string
        source: input
        description: two-letter USPS code of the state currently holding the record
        constraints: "exactly 2 uppercase letters"
      - name: area_id
        type: string
        source: input
        description: "FK -> AgriculturalArea.id; the recruitment area the child currently resides in"
      - name: prior_record_student_id
        type: string
        source: system
        description: "FK -> Student.id; the out-of-state predecessor record matched through the national exchange; null until a RecordTransferRequest reaches MATCHED"
        default: null
      - name: schooling_status
        type: enum
        source: input
        description: selects which pfs_priority_score variant applies and which ServicePlan types are permitted
        default: ENROLLED
        constraints: "one of {ENROLLED, OUT_OF_SCHOOL}"
      - name: grade_level
        type: integer
        source: input
        description: current grade; null for out-of-school youth
        default: null
        constraints: "0..12 when present"
      - name: school_days_interrupted
        type: integer
        source: input
        description: instructional days missed because of qualifying moves in the current program year
        default: 0
        constraints: ">= 0 and <= 180"
      - name: math_below_grade
        type: boolean
        source: input
        description: math placement below grade level
        default: false
      - name: reading_below_grade
        type: boolean
        source: input
        description: reading placement below grade level
        default: false
      - name: credit_deficit
        type: integer
        source: input
        description: whole secondary credits short of the expected on-track total
        default: 0
        constraints: ">= 0 and <= 40"
      - name: has_hs_credential
        type: boolean
        source: input
        description: holds a high-school diploma or equivalency; consumed only by the OSY_PATHWAY score variant
        default: false
      - name: primary_language_not_english
        type: boolean
        source: input
        description: home language other than English; consumed only by the OSY_PATHWAY score variant
        default: false
      - name: eligibility_status
        type: enum
        source: system
        description: first of two independent state dimensions; driven by CertificateOfEligibility and EligibilityTerm transitions
        default: NOT_ELIGIBLE
        constraints: "one of {NOT_ELIGIBLE, PENDING_DETERMINATION, ELIGIBLE, CONTINUATION, TERM_EXPIRED}"
      - name: service_status
        type: enum
        source: system
        description: second of two independent state dimensions; driven by ServicePlan transitions and advances independently of eligibility_status
        default: UNSERVED
        constraints: "one of {UNSERVED, PLAN_DRAFTED, RECEIVING_SERVICES, EXITED}"
      - name: pfs_score
        type: integer
        source: computed
        description: priority-for-services score in 0..100 produced by calculations.pfs_priority_score
        default: 0
      - name: pfs_variant
        type: enum
        source: computed
        description: which pfs_priority_score variant produced pfs_score
        default: INTERRUPTION_WEIGHTED
        constraints: "one of {INTERRUPTION_WEIGHTED, OSY_PATHWAY}"
      - name: pfs_flag
        type: boolean
        source: computed
        description: "true when pfs_score >= PFS_SCORE_THRESHOLD (60); selects the 120.00-hour service budget"
        default: false
      - name: eligibility_expires_on
        type: string
        source: computed
        description: mirror of the student's non-terminal EligibilityTerm.term_end_on; null when no term is in status ACTIVE or EXPIRING
        default: null
      - name: total_service_hours_ledger
        type: number
        source: computed
        description: conserved quantity of the delivery/reversal invariant; sum of unreversed forward ServiceDelivery.hours across all of this student's plans
        default: 0.00
        constraints: "2 decimal places"
      - name: transferred_credits_count
        type: number
        source: computed
        description: capped credits accepted from the national exchange; written by transfer_credit_reconciliation
        default: 0.00
        constraints: "2 decimal places"
      - name: locally_accrued_credits
        type: number
        source: computed
        description: sum of credits_awarded on unreversed ServiceDelivery rows attached to CREDIT_ACCRUAL plans of this student
        default: 0.00
        constraints: "2 decimal places"
      - name: total_awarded_credits
        type: number
        source: computed
        description: locally_accrued_credits + transferred_credits_count, evaluated in the pinned order of transfer_credit_reconciliation
        default: 0.00
        constraints: "2 decimal places"

  - name: QualifyingMove
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the child who moved"
      - name: from_state_code
        type: string
        source: input
        description: two-letter USPS code the family departed
        constraints: "exactly 2 uppercase letters"
      - name: to_state_code
        type: string
        source: input
        description: two-letter USPS code the family arrived in
        constraints: "exactly 2 uppercase letters"
      - name: move_date
        type: string
        source: input
        description: calendar date the move completed; anchors the provisional eligibility window
        constraints: "ISO-8601 date YYYY-MM-DD; must be <= the logical clock date"
      - name: work_type
        type: enum
        source: input
        description: sector of the qualifying work sought or obtained
        constraints: "one of {AGRICULTURAL, FISHING, NONE}"
      - name: worker_relationship
        type: enum
        source: input
        description: who performs the qualifying work relative to the child
        constraints: "one of {SELF, PARENT, GUARDIAN, SPOUSE}"
      - name: purpose
        type: enum
        source: input
        description: why the move was made
        constraints: "one of {SEEK_OR_OBTAIN_QUALIFYING_WORK, ACCOMPANY_WORKER}"
      - name: distance_miles
        type: number
        source: input
        description: straight-line distance of the move
        constraints: "> 0, 2 decimal places"
      - name: status
        type: enum
        source: system
        description: adjudication outcome of the move
        default: RECORDED
        constraints: "one of {RECORDED, VERIFIED, REJECTED}"
      - name: adjudicated_on
        type: datetime
        source: system
        description: logical-clock instant the move was adjudicated; null while RECORDED
        default: null
      - name: student_age_at_move
        type: integer
        source: computed
        description: whole years between Student.birth_date and move_date; feeds the COE risk_flag_count
        default: 0

  - name: InterviewRecord
    parent: null
    common_fields: false
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the child the interview documents"
      - name: move_id
        type: string
        source: input
        description: "FK -> QualifyingMove.id; the move the interview documents"
      - name: recruiter_id
        type: string
        source: system
        description: "FK -> Recruiter.id; taken from X-User-ID, never from the request body"
      - name: coe_id
        type: string
        source: input
        description: "FK -> CertificateOfEligibility.id; required when interview_kind = QC_REINTERVIEW, must be null when interview_kind = INITIAL"
        default: null
      - name: interview_kind
        type: enum
        source: input
        description: INITIAL documents the eligibility determination; QC_REINTERVIEW documents the quality-control re-contact
        constraints: "one of {INITIAL, QC_REINTERVIEW}"
      - name: conducted_on
        type: string
        source: input
        description: calendar date the interview took place
        constraints: "ISO-8601 date YYYY-MM-DD; must be <= the logical clock date"
      - name: informant_relationship
        type: enum
        source: input
        description: who supplied the information
        constraints: "one of {PARENT, GUARDIAN, SELF, EMPLOYER, OTHER}"
      - name: corroboration_count
        type: integer
        source: input
        description: number of independent sources that confirmed the move
        default: 0
        constraints: ">= 0 and <= 10"
      - name: outcome
        type: enum
        source: input
        description: whether the documentation supports the eligibility claim
        constraints: "one of {SUPPORTS_ELIGIBILITY, CONTRADICTS_ELIGIBILITY, INCONCLUSIVE}"
      - name: documentation_notes
        type: string
        source: input
        description: narrative record of the interview
        constraints: "1..2000 chars, required"

  - name: CertificateOfEligibility
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the child certified"
      - name: move_id
        type: string
        source: input
        description: "FK -> QualifyingMove.id; the move the certificate rests on"
      - name: initiating_recruiter_id
        type: string
        source: system
        description: "FK -> Recruiter.id; taken from X-User-ID at creation; the segregation-of-duties comparison target for QC decisions"
      - name: residency_date
        type: string
        source: input
        description: calendar date the family established residency in the receiving area; anchors the FINAL eligibility window
        constraints: "ISO-8601 date YYYY-MM-DD; must be >= QualifyingMove.move_date"
      - name: status
        type: enum
        source: system
        description: certificate lifecycle position; cycles back to DRAFT after a failed QC review
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, QC_SELECTED, QC_PASSED, APPROVED, RETURNED_FOR_CORRECTION, INVALIDATED}"
      - name: qc_hold_exempt
        type: boolean
        source: input
        description: when true the certificate is excluded from the quality-control candidate pool
        default: false
      - name: risk_flag_count
        type: integer
        source: computed
        description: "0..3 risk indicators produced by calculations.qc_sample_selection; >= 1 forces mandatory QC selection"
        default: 0
      - name: provisional_eligibility_end_on
        type: string
        source: computed
        description: last day of the PROVISIONAL eligibility window, anchored on QualifyingMove.move_date, written at SUBMITTED; null while DRAFT
        default: null
      - name: eligibility_start_on
        type: string
        source: computed
        description: equal to residency_date; written at APPROVED
        default: null
      - name: eligibility_end_on
        type: string
        source: computed
        description: last day of the FINAL eligibility window, anchored on residency_date and clipped by the age-out cap; written at APPROVED
        default: null
      - name: age_out_capped
        type: boolean
        source: computed
        description: true when the age-out cap, not the 36-month term, determined eligibility_end_on
        default: false
      - name: correction_round_count
        type: integer
        source: system
        description: number of times this certificate has entered RETURNED_FOR_CORRECTION
        default: 0
      - name: invalidation_reason
        type: string
        source: input
        description: reason recorded when an approved certificate is invalidated; null otherwise
        default: null
        constraints: "1..240 chars when present"

  - name: QualityControlReview
    parent: null
    common_fields: true
    fields:
      - name: coe_id
        type: string
        source: system
        description: "FK -> CertificateOfEligibility.id; set when the QC sample selection creates this review"
      - name: reviewer_recruiter_id
        type: string
        source: system
        description: "FK -> Recruiter.id; taken from X-User-ID at decision time; null while OPEN"
        default: null
      - name: reinterview_id
        type: string
        source: input
        description: "FK -> InterviewRecord.id; the QC_REINTERVIEW record the decision rests on; null while OPEN"
        default: null
      - name: status
        type: enum
        source: system
        description: review outcome
        default: OPEN
        constraints: "one of {OPEN, PASSED, FAILED}"
      - name: discrepancy_codes
        type: array
        source: input
        description: list of discrepancy codes recorded with a FAIL decision
        default: []
        constraints: "each element one of {MOVE_DATE, WORK_TYPE, RESIDENCY_DATE, INFORMANT, DISTANCE}; empty on PASS"
      - name: decided_on
        type: datetime
        source: system
        description: logical-clock instant of the decision; null while OPEN
        default: null
      - name: selection_reason
        type: enum
        source: system
        description: why this certificate entered the QC sample
        constraints: "one of {MANDATORY_RISK_FLAG, SAMPLE_QUOTA}"

  - name: RecordTransferRequest
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the record being assembled in the requesting state"
      - name: requesting_state_code
        type: string
        source: input
        description: two-letter USPS code of the state asking for the record
        constraints: "exactly 2 uppercase letters"
      - name: holding_state_code
        type: string
        source: input
        description: two-letter USPS code of the state believed to hold the prior record
        constraints: "exactly 2 uppercase letters; must differ from requesting_state_code"
      - name: exchange_reference
        type: string
        source: input
        description: national exchange correlation string
        constraints: "1..64 chars, required"
      - name: matched_prior_student_id
        type: string
        source: input
        description: "FK -> Student.id; the predecessor record located in the holding state; null until the request reaches MATCHED"
        default: null
      - name: reported_prior_credits
        type: number
        source: input
        description: secondary credits the holding state reports for the predecessor record, before the transfer cap is applied
        default: 0.00
        constraints: ">= 0.00 and <= 40.00, 2 decimal places"
      - name: applied_transferred_credits
        type: number
        source: computed
        description: credits actually posted to the student at RECONCILED, after the tier cap; reversed to 0.00 on REJECTED
        default: 0.00
        constraints: "2 decimal places"
      - name: status
        type: enum
        source: system
        description: exchange lifecycle position; branches at the match step
        default: INITIATED
        constraints: "one of {INITIATED, MATCHED, NO_MATCH, RECEIVED, RECONCILED, REJECTED}"
      - name: rejection_reason
        type: string
        source: input
        description: reason recorded when the exchange result is rejected; null otherwise
        default: null
        constraints: "1..240 chars when present"

  - name: ServicePlan
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the child served"
      - name: plan_type
        type: enum
        source: input
        description: service track; SUPPLEMENTAL_INSTRUCTION requires ENROLLED, OSY_ALTERNATIVE requires OUT_OF_SCHOOL
        constraints: "one of {SUPPLEMENTAL_INSTRUCTION, SUMMER_PROGRAM, CREDIT_ACCRUAL, OSY_ALTERNATIVE}"
      - name: delivery_mode
        type: enum
        source: input
        description: how the service reaches the child
        constraints: "one of {IN_PERSON, VIRTUAL, HOME_BASED, WORKSITE}"
      - name: priority_tier
        type: enum
        source: computed
        description: mirror of Student.pfs_flag at every allocation run; selects the program-year hour budget
        default: NON_PFS
        constraints: "one of {PFS, NON_PFS}"
      - name: allocated_hours
        type: number
        source: computed
        description: this plan's share of the program-year hour budget produced by calculations.service_hours_allocation
        default: 0.00
        constraints: "2 decimal places"
      - name: expected_service_hours
        type: number
        source: computed
        description: equal to allocated_hours after every allocation run; the value coordinators plan against
        default: 0.00
        constraints: "2 decimal places"
      - name: delivered_hours
        type: number
        source: computed
        description: sum of unreversed forward ServiceDelivery.hours attached to this plan
        default: 0.00
        constraints: "2 decimal places"
      - name: status
        type: enum
        source: system
        description: plan lifecycle position
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, SUPERSEDED, CLOSED}"
      - name: superseded_by_plan_id
        type: string
        source: system
        description: "FK -> ServicePlan.id; the later plan of the same plan_type that displaced this one; null otherwise"
        default: null
      - name: closure_reason
        type: enum
        source: input
        description: why the plan left the DRAFT/ACTIVE set
        default: null
        constraints: "one of {COMPLETED, COORDINATOR_CLOSED, ELIGIBILITY_LOST, REIDENTIFICATION_LAPSED, SUPERSEDED}"

  - name: ServiceDelivery
    parent: null
    common_fields: false
    fields:
      - name: plan_id
        type: string
        source: input
        description: "FK -> ServicePlan.id; the plan the session was delivered under"
      - name: reverses_delivery_id
        type: string
        source: system
        description: "FK -> ServiceDelivery.id; set on a reversal record to the forward record it compensates; null on forward records"
        default: null
      - name: delivered_on
        type: string
        source: input
        description: calendar date of the session
        constraints: "ISO-8601 date YYYY-MM-DD; must be <= the logical clock date"
      - name: hours
        type: number
        source: input
        description: instructional hours delivered; a reversal record copies the forward record's hours verbatim
        constraints: "> 0.00, <= 8.00, an exact multiple of 0.25, 2 decimal places"
      - name: service_category
        type: enum
        source: input
        description: what was delivered
        constraints: "one of {INSTRUCTION, COUNSELING, CREDIT_ACCRUAL_SESSION, SUPPORT_SERVICE}"
      - name: credits_awarded
        type: number
        source: input
        description: secondary credits granted by this session; must be 0.00 unless the plan is CREDIT_ACCRUAL
        default: 0.00
        constraints: ">= 0.00 and <= 2.00, an exact multiple of 0.25, 2 decimal places"
      - name: is_reversed
        type: boolean
        source: computed
        description: true once some other ServiceDelivery row carries reverses_delivery_id = this.id
        default: false

  - name: EligibilityTerm
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; the child whose 36-month term this is"
      - name: coe_id
        type: string
        source: input
        description: "FK -> CertificateOfEligibility.id; the approved certificate that opened the term"
      - name: term_start_on
        type: string
        source: computed
        description: copied from CertificateOfEligibility.eligibility_start_on at approval
      - name: term_end_on
        type: string
        source: computed
        description: copied from CertificateOfEligibility.eligibility_end_on at approval; INCLUSIVE last eligible day
      - name: status
        type: enum
        source: system
        description: continuation-of-eligibility position; advanced only by the sweep, the reidentify action, or a certificate invalidation
        default: ACTIVE
        constraints: "one of {ACTIVE, EXPIRING, EXPIRED, REIDENTIFIED, LAPSED, TERMINATED}"
      - name: reidentification_due_on
        type: string
        source: computed
        description: "term_end_on + REIDENTIFICATION_GRACE_DAYS (45); written when the sweep moves the term to EXPIRED; null before that"
        default: null
      - name: superseded_by_term_id
        type: string
        source: system
        description: "FK -> EligibilityTerm.id; the term opened by the reidentifying certificate's approval; null otherwise"
        default: null
      - name: termination_reason
        type: string
        source: system
        description: reason recorded when the term is terminated by a certificate invalidation; null otherwise
        default: null

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================

state_machines:

  - entity: CertificateOfEligibility
    initial_state: DRAFT
    terminal_states: [INVALIDATED]
    note: |
      Non-linear shape (cycle + branch): DRAFT -> SUBMITTED -> QC_SELECTED ->
      RETURNED_FOR_CORRECTION -> DRAFT is a closed loop that may repeat, and
      SUBMITTED forks into either a direct approval (no QC review exists) or the
      QC_SELECTED -> QC_PASSED -> APPROVED leg, with different side-effect sets.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mep/coes/{coe_id}/submit"
        actor: Recruiter
        preconditions:
          - "coe.status == DRAFT"
          - "X-User-ID == coe.initiating_recruiter_id"
          - "QualifyingMove(coe.move_id).status == VERIFIED"
          - "QualifyingMove(coe.move_id).work_type IN {AGRICULTURAL, FISHING} AND QualifyingMove(coe.move_id).purpose IN {SEEK_OR_OBTAIN_QUALIFYING_WORK, ACCOMPANY_WORKER}"
          - "at least one InterviewRecord exists with student_id == coe.student_id AND move_id == coe.move_id AND interview_kind == 'INITIAL' AND outcome == 'SUPPORTS_ELIGIBILITY'"
          - "no other CertificateOfEligibility with the same (student_id, move_id) pair is in status IN {SUBMITTED, QC_SELECTED, QC_PASSED, APPROVED}"
        side_effects:
          - "sets coe.provisional_eligibility_end_on via calculations.coe_eligibility_window, variant provisional_at_submission"
          - "sets coe.risk_flag_count via the risk_flag_count clause of calculations.qc_sample_selection"
          - "sets Student(coe.student_id).eligibility_status = PENDING_DETERMINATION, but only when that student's eligibility_status IN {NOT_ELIGIBLE, TERM_EXPIRED}; Student.version += 1"
          - "increments coe.version by 1"
      - from: RETURNED_FOR_CORRECTION
        to: DRAFT
        trigger: "PATCH /mep/coes/{coe_id}"
        actor: Recruiter
        preconditions:
          - "coe.status IN {DRAFT, RETURNED_FOR_CORRECTION}"
          - "X-User-ID == coe.initiating_recruiter_id"
          - "when residency_date is supplied it is >= QualifyingMove(coe.move_id).move_date"
        side_effects:
          - "applies the supplied residency_date and/or qc_hold_exempt values"
          - "coe.status = DRAFT (no-op when the certificate was already DRAFT); this closes the correction loop"
          - "increments coe.version by 1"
        note: "the cyclic edge; correction_round_count is NOT reset, so the loop count is observable"
      - from: SUBMITTED
        to: QC_SELECTED
        trigger: "POST /mep/qc-selections"
        actor: StateProgramAdmin
        preconditions:
          - "coe.status == SUBMITTED"
          - "coe.qc_hold_exempt == false"
          - "coe is a member of the selected set produced by calculations.qc_sample_selection"
        side_effects:
          - "creates one QualityControlReview row with coe_id = coe.id, status = OPEN, reviewer_recruiter_id = null, reinterview_id = null, discrepancy_codes = [], and selection_reason = MANDATORY_RISK_FLAG when coe.risk_flag_count >= 1 else SAMPLE_QUOTA"
          - "increments coe.version by 1"
      - from: QC_SELECTED
        to: QC_PASSED
        trigger: "POST /mep/qc-reviews/{review_id}/decide with decision = PASS"
        actor: QualityControlReviewer
        preconditions:
          - "QualityControlReview(review_id).status == OPEN"
          - "CertificateOfEligibility(review.coe_id).status == QC_SELECTED"
          - "X-User-ID != coe.initiating_recruiter_id"
          - "Recruiter(X-User-ID).credential_level == QC_CERTIFIED"
          - "InterviewRecord(reinterview_id).interview_kind == 'QC_REINTERVIEW' AND InterviewRecord(reinterview_id).student_id == coe.student_id AND InterviewRecord(reinterview_id).coe_id == coe.id"
          - "discrepancy_codes is absent or an empty array"
        side_effects:
          - "review.status = PASSED, review.reviewer_recruiter_id = X-User-ID, review.reinterview_id = payload.reinterview_id, review.decided_on = logical clock instant, review.discrepancy_codes = []; review.version += 1"
          - "coe.status = QC_PASSED; coe.version += 1"
      - from: QC_SELECTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /mep/qc-reviews/{review_id}/decide with decision = FAIL"
        actor: QualityControlReviewer
        preconditions:
          - "QualityControlReview(review_id).status == OPEN"
          - "CertificateOfEligibility(review.coe_id).status == QC_SELECTED"
          - "X-User-ID != coe.initiating_recruiter_id"
          - "Recruiter(X-User-ID).credential_level == QC_CERTIFIED"
          - "InterviewRecord(reinterview_id).interview_kind == 'QC_REINTERVIEW' AND InterviewRecord(reinterview_id).student_id == coe.student_id AND InterviewRecord(reinterview_id).coe_id == coe.id"
          - "discrepancy_codes contains at least one element"
        side_effects:
          - "review.status = FAILED, review.reviewer_recruiter_id = X-User-ID, review.reinterview_id = payload.reinterview_id, review.discrepancy_codes = payload.discrepancy_codes, review.decided_on = logical clock instant; review.version += 1"
          - "coe.status = RETURNED_FOR_CORRECTION; coe.correction_round_count += 1; coe.provisional_eligibility_end_on = null; coe.version += 1"
          - "cascade hop 2 (caused by the coe transition above, not by the decide call): Student(coe.student_id).eligibility_status is set back to NOT_ELIGIBLE when that student has no EligibilityTerm in status IN {ACTIVE, EXPIRING}, and is left unchanged otherwise; Student.version += 1 only when the value actually changes"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /mep/coes/{coe_id}/approve"
        actor: StateProgramAdmin
        preconditions:
          - "coe.status == SUBMITTED"
          - "no QualityControlReview row exists with coe_id == coe.id and status == OPEN"
        side_effects:
          - "CASCADE-A hop 1: coe.status = APPROVED; coe.eligibility_start_on, coe.eligibility_end_on and coe.age_out_capped are set via calculations.coe_eligibility_window, variant final_at_approval; coe.version += 1"
          - "CASCADE-A hop 2 (caused by hop 1): a new EligibilityTerm row is created with student_id = coe.student_id, coe_id = coe.id, term_start_on = coe.eligibility_start_on, term_end_on = coe.eligibility_end_on, status = ACTIVE, reidentification_due_on = null"
          - "CASCADE-A hop 3 (caused by hop 2's new ACTIVE term, not by the approve call): Student.eligibility_status = ELIGIBLE and Student.eligibility_expires_on = the new term's term_end_on; additionally, when the student holds a term in status REIDENTIFIED with superseded_by_term_id == null, the one with the greatest term_end_on (tie-break: earliest created_at) has its superseded_by_term_id set to the new term's id; Student.version += 1"
          - "CASCADE-A hop 4 (caused by hop 3's Student mutation): calculations.pfs_priority_score is re-run, writing Student.pfs_score, Student.pfs_variant and Student.pfs_flag; then calculations.service_hours_allocation is re-run over every ServicePlan of that student in status IN {DRAFT, ACTIVE}, writing each plan's priority_tier, allocated_hours and expected_service_hours and incrementing each touched plan's version by 1"
        note: "branch A of the fork at SUBMITTED - reached only when the certificate was never drawn into the QC sample"
      - from: QC_PASSED
        to: APPROVED
        trigger: "POST /mep/coes/{coe_id}/approve"
        actor: StateProgramAdmin
        preconditions:
          - "coe.status == QC_PASSED"
        side_effects:
          - "identical CASCADE-A hops 1 through 4 as the SUBMITTED -> APPROVED edge"
          - "the PASSED QualityControlReview row is left untouched, so QualityControlReview.decided_on still records the QC decision instant rather than the approval instant"
        note: "branch B of the fork at SUBMITTED - the quality-controlled leg"
      - from: APPROVED
        to: INVALIDATED
        trigger: "POST /mep/coes/{coe_id}/invalidate"
        actor: StateProgramAdmin
        preconditions:
          - "coe.status == APPROVED"
          - "invalidation_reason is present and 1..240 chars"
        side_effects:
          - "CASCADE-B hop 1: coe.status = INVALIDATED; coe.invalidation_reason = payload.invalidation_reason; coe.version += 1"
          - "CASCADE-B hop 2 (caused by hop 1): every EligibilityTerm with coe_id == coe.id and status IN {ACTIVE, EXPIRING, EXPIRED} moves to TERMINATED with termination_reason = 'CERTIFICATE_INVALIDATED'; each such term.version += 1"
          - "CASCADE-B hop 3 (caused by hop 2's term termination, not by the invalidate call): Student.eligibility_status = TERM_EXPIRED and Student.eligibility_expires_on = null; every ServicePlan of that student in status IN {DRAFT, ACTIVE} moves to CLOSED with closure_reason = ELIGIBILITY_LOST and version += 1; Student.service_status is then re-derived by the Student service_status rule below; Student.version += 1"

  - entity: Student
    initial_state: NOT_ELIGIBLE
    terminal_states: []
    note: |
      Parallel state dimensions on one row. eligibility_status is driven only by
      CertificateOfEligibility and EligibilityTerm transitions; service_status is
      a derived aggregate over the student's ServicePlan rows. The two dimensions
      never read each other, so they advance independently, and eligibility_status
      is additionally cyclic (TERM_EXPIRED -> PENDING_DETERMINATION on
      reidentification).
    transitions:
      - from: NOT_ELIGIBLE
        to: PENDING_DETERMINATION
        trigger: "POST /mep/coes/{coe_id}/submit (side effect)"
        actor: system
        preconditions: ["student.eligibility_status IN {NOT_ELIGIBLE, TERM_EXPIRED}"]
        side_effects: ["Student.version += 1"]
        note: "dimension = eligibility_status"
      - from: PENDING_DETERMINATION
        to: ELIGIBLE
        trigger: "POST /mep/coes/{coe_id}/approve (CASCADE-A hop 3)"
        actor: system
        preconditions: ["an EligibilityTerm for this student was just created in status ACTIVE"]
        side_effects: ["Student.eligibility_expires_on = term.term_end_on", "re-runs pfs_priority_score and service_hours_allocation (CASCADE-A hop 4)", "Student.version += 1"]
        note: "dimension = eligibility_status"
      - from: PENDING_DETERMINATION
        to: NOT_ELIGIBLE
        trigger: "POST /mep/qc-reviews/{review_id}/decide with decision = FAIL (cascade hop 2)"
        actor: system
        preconditions: ["the student has no EligibilityTerm in status IN {ACTIVE, EXPIRING}"]
        side_effects: ["Student.version += 1"]
        note: "dimension = eligibility_status"
      - from: ELIGIBLE
        to: CONTINUATION
        trigger: "POST /mep/eligibility-terms/sweep (term ACTIVE -> EXPIRING)"
        actor: system
        preconditions: ["the student's term moved to EXPIRING in this sweep"]
        side_effects: ["Student.version += 1"]
        note: "dimension = eligibility_status"
      - from: CONTINUATION
        to: TERM_EXPIRED
        trigger: "POST /mep/eligibility-terms/sweep (term EXPIRING -> EXPIRED)"
        actor: system
        preconditions: ["the student's term moved to EXPIRED in this sweep"]
        side_effects: ["Student.eligibility_expires_on = null", "Student.version += 1"]
        note: "dimension = eligibility_status"
      - from: ELIGIBLE
        to: TERM_EXPIRED
        trigger: "POST /mep/coes/{coe_id}/invalidate (CASCADE-B hop 3) or POST /mep/eligibility-terms/sweep when the sweep skips the EXPIRING window entirely"
        actor: system
        preconditions: ["the student's term moved to TERMINATED or EXPIRED"]
        side_effects: ["Student.eligibility_expires_on = null", "every ServicePlan in status IN {DRAFT, ACTIVE} is CLOSED when the trigger was an invalidation", "Student.version += 1"]
        note: "dimension = eligibility_status"
      - from: TERM_EXPIRED
        to: PENDING_DETERMINATION
        trigger: "POST /mep/eligibility-terms/{term_id}/reidentify"
        actor: Recruiter
        preconditions: ["the term being reidentified belongs to this student and was in status EXPIRED"]
        side_effects: ["Student.version += 1"]
        note: "dimension = eligibility_status; this is the cyclic edge that makes reidentification observable"
      - from: UNSERVED
        to: PLAN_DRAFTED
        trigger: "POST /mep/service-plans"
        actor: system
        preconditions: ["the student now has at least one ServicePlan in status DRAFT and none in status ACTIVE"]
        side_effects: ["Student.version += 1"]
        note: |
          dimension = service_status. The whole dimension is re-derived after every
          ServicePlan mutation, in exactly this order:
            (1) no ServicePlan row has ever existed for this student -> UNSERVED
            (2) else any plan in status ACTIVE                       -> RECEIVING_SERVICES
            (3) else any plan in status DRAFT                        -> PLAN_DRAFTED
            (4) else                                                 -> EXITED
          Rule (2) dominates rule (3), so a student holding one ACTIVE and one
          DRAFT plan reads RECEIVING_SERVICES.
      - from: PLAN_DRAFTED
        to: RECEIVING_SERVICES
        trigger: "POST /mep/service-plans/{plan_id}/activate"
        actor: system
        preconditions: ["at least one ServicePlan of this student is now in status ACTIVE"]
        side_effects: ["Student.version += 1"]
        note: "dimension = service_status"
      - from: RECEIVING_SERVICES
        to: PLAN_DRAFTED
        trigger: "POST /mep/service-plans/{plan_id}/close on the last ACTIVE plan while a DRAFT plan remains"
        actor: system
        preconditions: ["no ServicePlan of this student is in status ACTIVE and at least one is in status DRAFT"]
        side_effects: ["Student.version += 1"]
        note: "dimension = service_status; the cyclic edge of this dimension"
      - from: RECEIVING_SERVICES
        to: EXITED
        trigger: "POST /mep/service-plans/{plan_id}/close, or CASCADE-B hop 3, or the lapse cascade of POST /mep/eligibility-terms/sweep"
        actor: system
        preconditions: ["no ServicePlan of this student remains in status IN {DRAFT, ACTIVE}"]
        side_effects: ["Student.version += 1"]
        note: "dimension = service_status"

  - entity: EligibilityTerm
    initial_state: ACTIVE
    terminal_states: [REIDENTIFIED, LAPSED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: EXPIRING
        trigger: "POST /mep/eligibility-terms/sweep"
        actor: StateProgramAdmin
        preconditions:
          - "term.status == ACTIVE"
          - "logical_clock_date <= term.term_end_on AND logical_clock_date >= (term.term_end_on - EXPIRING_WINDOW_DAYS)"
        side_effects:
          - "term.status = EXPIRING; term.version += 1"
          - "Student.eligibility_status = CONTINUATION; Student.version += 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /mep/eligibility-terms/sweep"
        actor: StateProgramAdmin
        preconditions:
          - "term.status == ACTIVE"
          - "logical_clock_date > term.term_end_on"
        side_effects:
          - "term.status = EXPIRED; term.reidentification_due_on = term.term_end_on + REIDENTIFICATION_GRACE_DAYS; term.version += 1"
          - "Student.eligibility_status = TERM_EXPIRED; Student.eligibility_expires_on = null; Student.version += 1"
        note: "reached when no sweep was executed inside the 60-day EXPIRING window"
      - from: EXPIRING
        to: EXPIRED
        trigger: "POST /mep/eligibility-terms/sweep"
        actor: StateProgramAdmin
        preconditions:
          - "term.status == EXPIRING"
          - "logical_clock_date > term.term_end_on"
        side_effects:
          - "term.status = EXPIRED; term.reidentification_due_on = term.term_end_on + REIDENTIFICATION_GRACE_DAYS; term.version += 1"
          - "Student.eligibility_status = TERM_EXPIRED; Student.eligibility_expires_on = null; Student.version += 1"
      - from: EXPIRED
        to: LAPSED
        trigger: "POST /mep/eligibility-terms/sweep"
        actor: StateProgramAdmin
        preconditions:
          - "term.status == EXPIRED"
          - "logical_clock_date > term.reidentification_due_on"
        side_effects:
          - "term.status = LAPSED; term.version += 1"
          - "every ServicePlan of that student in status IN {DRAFT, ACTIVE} moves to CLOSED with closure_reason = REIDENTIFICATION_LAPSED; each plan.version += 1"
          - "Student.service_status is re-derived; Student.version += 1"
      - from: EXPIRED
        to: REIDENTIFIED
        trigger: "POST /mep/eligibility-terms/{term_id}/reidentify"
        actor: Recruiter
        preconditions:
          - "term.status == EXPIRED"
          - "logical_clock_date <= term.reidentification_due_on"
          - "QualifyingMove(new_move_id).status == VERIFIED AND QualifyingMove(new_move_id).student_id == term.student_id"
          - "residency_date >= QualifyingMove(new_move_id).move_date"
        side_effects:
          - "term.status = REIDENTIFIED; term.version += 1"
          - "a new CertificateOfEligibility is created in status DRAFT with student_id = term.student_id, move_id = new_move_id, residency_date = payload.residency_date, initiating_recruiter_id = X-User-ID"
          - "Student.eligibility_status = PENDING_DETERMINATION; Student.version += 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /mep/coes/{coe_id}/invalidate (CASCADE-B hop 2)"
        actor: system
        preconditions: ["term.coe_id == the invalidated certificate's id", "term.status IN {ACTIVE, EXPIRING, EXPIRED}"]
        side_effects: ["term.termination_reason = 'CERTIFICATE_INVALIDATED'; term.version += 1", "triggers CASCADE-B hop 3 on the Student"]
      - from: EXPIRING
        to: TERMINATED
        trigger: "POST /mep/coes/{coe_id}/invalidate (CASCADE-B hop 2)"
        actor: system
        preconditions: ["term.coe_id == the invalidated certificate's id"]
        side_effects: ["term.termination_reason = 'CERTIFICATE_INVALIDATED'; term.version += 1", "triggers CASCADE-B hop 3 on the Student"]
      - from: EXPIRED
        to: TERMINATED
        trigger: "POST /mep/coes/{coe_id}/invalidate (CASCADE-B hop 2)"
        actor: system
        preconditions: ["term.coe_id == the invalidated certificate's id"]
        side_effects: ["term.termination_reason = 'CERTIFICATE_INVALIDATED'; term.version += 1", "triggers CASCADE-B hop 3 on the Student"]

  - entity: RecruiterAssignment
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /mep/recruiter-assignments/{assignment_id}/activate"
        actor: StateProgramAdmin
        preconditions:
          - "assignment.status == PLANNED"
          - "Recruiter(assignment.recruiter_id).status == ACTIVE"
          - "AgriculturalArea(assignment.area_id).status == OPEN"
        side_effects:
          - "assignment.status = ACTIVE; assignment.version += 1"
          - "AgriculturalArea.assigned_primary_slots_used is recomputed; its value does not change because PLANNED and ACTIVE are both inside the counted set; AgriculturalArea.version += 1"
          - "Recruiter.active_assignment_count is recomputed; its value does not change for the same reason; Recruiter.version += 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /mep/recruiter-assignments/{assignment_id}/close with outcome = CANCELLED"
        actor: StateProgramAdmin
        preconditions: ["assignment.status == PLANNED"]
        side_effects:
          - "assignment.status = CANCELLED; assignment.cancelled_reason = payload.cancelled_reason; assignment.version += 1"
          - "AgriculturalArea.assigned_primary_slots_used decreases by exactly 1 when assignment.coverage_role == 'PRIMARY' (and is unchanged for BACKUP), restoring the value it held before this assignment was created; AgriculturalArea.version += 1"
          - "Recruiter.active_assignment_count decreases by exactly 1; Recruiter.version += 1"
        note: "the compensating action of the slot-conservation invariant"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /mep/recruiter-assignments/{assignment_id}/close with outcome = CANCELLED"
        actor: StateProgramAdmin
        preconditions: ["assignment.status == ACTIVE"]
        side_effects:
          - "assignment.status = CANCELLED; assignment.cancelled_reason = payload.cancelled_reason; assignment.version += 1"
          - "AgriculturalArea.assigned_primary_slots_used decreases by exactly 1 when coverage_role == 'PRIMARY'; AgriculturalArea.version += 1"
          - "Recruiter.active_assignment_count decreases by exactly 1; Recruiter.version += 1"
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /mep/recruiter-assignments/{assignment_id}/close with outcome = COMPLETED"
        actor: StateProgramAdmin
        preconditions: ["assignment.status == ACTIVE"]
        side_effects:
          - "assignment.status = COMPLETED; assignment.version += 1"
          - "AgriculturalArea.assigned_primary_slots_used decreases by exactly 1 when coverage_role == 'PRIMARY'; AgriculturalArea.version += 1"
          - "Recruiter.active_assignment_count decreases by exactly 1; Recruiter.version += 1"

  - entity: ServicePlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mep/service-plans/{plan_id}/activate"
        actor: ServiceCoordinator
        preconditions:
          - "plan.status == DRAFT"
          - "Student(plan.student_id).eligibility_status IN {ELIGIBLE, CONTINUATION}"
        side_effects:
          - "plan.status = ACTIVE; plan.version += 1"
          - "calculations.service_hours_allocation is re-run over every ServicePlan of the student in status IN {DRAFT, ACTIVE}, rewriting priority_tier, allocated_hours and expected_service_hours on each and incrementing each touched plan's version by 1"
          - "Student.service_status is re-derived to RECEIVING_SERVICES; Student.version += 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /mep/service-plans (a later plan of the same plan_type for the same student)"
        actor: system
        preconditions: ["plan.status IN {DRAFT, ACTIVE}", "the incoming plan has the same student_id and plan_type"]
        side_effects:
          - "plan.status = SUPERSEDED; plan.closure_reason = SUPERSEDED; plan.superseded_by_plan_id = the new plan's id; plan.version += 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /mep/service-plans (a later plan of the same plan_type for the same student)"
        actor: system
        preconditions: ["plan.status IN {DRAFT, ACTIVE}", "the incoming plan has the same student_id and plan_type"]
        side_effects:
          - "plan.status = SUPERSEDED; plan.closure_reason = SUPERSEDED; plan.superseded_by_plan_id = the new plan's id; plan.version += 1"
          - "Student.service_status is re-derived; Student.version += 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /mep/service-plans/{plan_id}/close"
        actor: ServiceCoordinator
        preconditions: ["plan.status IN {DRAFT, ACTIVE}", "closure_reason IN {COMPLETED, COORDINATOR_CLOSED}"]
        side_effects:
          - "plan.status = CLOSED; plan.closure_reason = payload.closure_reason; plan.version += 1"
          - "calculations.service_hours_allocation is re-run over the student's remaining {DRAFT, ACTIVE} plans"
          - "Student.service_status is re-derived; Student.version += 1"
      - from: DRAFT
        to: CLOSED
        trigger: "POST /mep/service-plans/{plan_id}/close, or CASCADE-B hop 3, or the EXPIRED -> LAPSED sweep cascade"
        actor: ServiceCoordinator | system
        preconditions: ["plan.status IN {DRAFT, ACTIVE}"]
        side_effects:
          - "plan.status = CLOSED; plan.closure_reason = payload.closure_reason for the coordinator trigger, ELIGIBILITY_LOST for CASCADE-B hop 3, REIDENTIFICATION_LAPSED for the sweep cascade; plan.version += 1"
          - "Student.service_status is re-derived; Student.version += 1"

  - entity: RecordTransferRequest
    initial_state: INITIATED
    terminal_states: [NO_MATCH, RECONCILED, REJECTED]
    note: |
      Branching (fork) shape with divergent side-effect sets: the match step
      forks INITIATED into MATCHED (which writes Student.prior_record_student_id)
      or NO_MATCH (which writes nothing on the Student and is terminal).
    transitions:
      - from: INITIATED
        to: MATCHED
        trigger: "POST /mep/transfer-requests/{request_id}/match with matched_prior_student_id supplied"
        actor: ExchangeLiaison
        preconditions:
          - "request.status == INITIATED"
          - "matched_prior_student_id resolves to an existing Student"
          - "matched_prior_student_id != request.student_id"
        side_effects:
          - "request.matched_prior_student_id = payload.matched_prior_student_id; request.status = MATCHED; request.version += 1"
          - "Student(request.student_id).prior_record_student_id = payload.matched_prior_student_id; Student.version += 1"
        note: "branch A"
      - from: INITIATED
        to: NO_MATCH
        trigger: "POST /mep/transfer-requests/{request_id}/match with matched_prior_student_id omitted"
        actor: ExchangeLiaison
        preconditions: ["request.status == INITIATED"]
        side_effects:
          - "request.status = NO_MATCH; request.matched_prior_student_id stays null; request.version += 1"
          - "no Student field is written and Student.version is NOT incremented - this is the observable divergence from branch A"
        note: "branch B, terminal"
      - from: MATCHED
        to: RECEIVED
        trigger: "POST /mep/transfer-requests/{request_id}/receive"
        actor: ExchangeLiaison
        preconditions: ["request.status == MATCHED"]
        side_effects: ["request.status = RECEIVED; request.version += 1"]
      - from: RECEIVED
        to: RECONCILED
        trigger: "POST /mep/transfer-requests/{request_id}/reconcile"
        actor: ExchangeLiaison
        preconditions: ["request.status == RECEIVED"]
        side_effects:
          - "calculations.transfer_credit_reconciliation runs; request.applied_transferred_credits, Student.transferred_credits_count, Student.locally_accrued_credits and Student.total_awarded_credits are written; Student.version += 1"
          - "request.status = RECONCILED; request.version += 1"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /mep/transfer-requests/{request_id}/reject"
        actor: ExchangeLiaison
        preconditions: ["request.status IN {RECEIVED, RECONCILED}", "rejection_reason is present"]
        side_effects:
          - "request.status = REJECTED; request.rejection_reason = payload.rejection_reason; request.version += 1"
          - "Student.transferred_credits_count -= request.applied_transferred_credits; request.applied_transferred_credits = 0.00; Student.total_awarded_credits = Student.locally_accrued_credits + Student.transferred_credits_count; Student.prior_record_student_id = null; Student.version += 1"
        note: "the compensating action of the credit-conservation invariant"
      - from: RECONCILED
        to: REJECTED
        trigger: "POST /mep/transfer-requests/{request_id}/reject"
        actor: ExchangeLiaison
        preconditions: ["request.status IN {RECEIVED, RECONCILED}", "rejection_reason is present"]
        side_effects:
          - "request.status = REJECTED; request.rejection_reason = payload.rejection_reason; request.version += 1"
          - "Student.transferred_credits_count -= request.applied_transferred_credits; request.applied_transferred_credits = 0.00; Student.total_awarded_credits = Student.locally_accrued_credits + Student.transferred_credits_count; Student.prior_record_student_id = null; Student.version += 1"

# ===========================================================================
# 1.2.1 Concurrency Rules  (OCC on a parent's `version` - the only sanctioned
#        write-write conflict mechanism; both entries pass the serial-
#        observability filter because the loser's request would legitimately
#        succeed on its own merits from the state the winner left behind)
# ===========================================================================

concurrency_rules:
  - rule_id: plan-create-stale-student
    parent_entity: Student
    write_endpoint: "POST /mep/service-plans"
    occ_field: "expected_student_version"
    description: |
      Creating a ServicePlan against a Student whose version has advanced since
      the client last read it is rejected with a stale-version error. The rule
      exists because a plan create legitimately supersedes any earlier plan of
      the same plan_type (ServicePlan DRAFT/ACTIVE -> SUPERSEDED), so a second
      create carrying an out-of-date view of the student would silently displace
      work the client never saw. The check is a pure comparison of
      expected_student_version against the stored Student.version.
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-area
    parent_entity: AgriculturalArea
    write_endpoint: "POST /mep/recruiter-assignments"
    occ_field: "expected_area_version"
    description: |
      Creating a RecruiterAssignment against an AgriculturalArea whose version
      has advanced since the client last read it is rejected with a
      stale-version error. Assignment creation consumes area coverage capacity
      and mutates AgriculturalArea.assigned_primary_slots_used, so a client
      holding an out-of-date view of the area is reasoning about a capacity
      picture the server no longer has; a create issued from the current version
      would be accepted on the same inputs whenever capacity still permits.
    error_id: ERR_STALE_AREA_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================

calculations:

  - name: coe_eligibility_window
    trigger: "on the CertificateOfEligibility DRAFT -> SUBMITTED transition (provisional variant) and on the SUBMITTED -> APPROVED / QC_PASSED -> APPROVED transitions (final variant)"
    algorithm: threshold
    formula: |
      # add_months(d, n): the date n calendar months after d keeping the day of
      # month; when the target month has no such day, use the LAST day of the
      # target month. add_years(d, n) is add_months(d, 12*n).
      #
      # PROVISIONAL - anchored on the qualifying move, no age-out clip:
      provisional_eligibility_end_on
          = add_months(QualifyingMove(coe.move_id).move_date, ELIGIBILITY_TERM_MONTHS) - 1 day
      #
      # FINAL - anchored on the residency date, then clipped by the age-out cap:
      eligibility_start_on   = coe.residency_date
      uncapped_end_on        = add_months(coe.residency_date, ELIGIBILITY_TERM_MONTHS) - 1 day
      age_out_on             = add_years(Student(coe.student_id).birth_date, AGE_OUT_AGE) - 1 day
      eligibility_end_on     = min(uncapped_end_on, age_out_on)
      age_out_capped         = (age_out_on < uncapped_end_on)
    input_set: "exactly one QualifyingMove (coe.move_id, which is in status VERIFIED at submit time) and exactly one Student (coe.student_id). No aggregation, no sibling certificates are consulted."
    constants:
      ELIGIBILITY_TERM_MONTHS: 36
      AGE_OUT_AGE: 22
    precision: "whole calendar dates, ISO-8601 YYYY-MM-DD; no rounding involved"
    variants:
      - name: provisional_at_submission
        when: "the DRAFT -> SUBMITTED transition; writes only coe.provisional_eligibility_end_on"
        difference: "anchors on QualifyingMove.move_date and does NOT apply the age-out clip, so a student who ages out inside the window still shows the full 36-month provisional end date"
      - name: final_at_approval
        when: "the SUBMITTED -> APPROVED and QC_PASSED -> APPROVED transitions; writes coe.eligibility_start_on, coe.eligibility_end_on and coe.age_out_capped"
        difference: "anchors on coe.residency_date (always >= move_date) and clips at the day before the student's 22nd birthday, so it diverges from the provisional value whenever residency_date > move_date or whenever the age-out cap binds"

  - name: pfs_priority_score
    trigger: "recomputed and persisted on POST /mep/students, PATCH /mep/students/{student_id}, POST /mep/qualifying-moves/{move_id}/adjudicate, CASCADE-A hop 4 of POST /mep/coes/{coe_id}/approve, CASCADE-B hop 3 of POST /mep/coes/{coe_id}/invalidate, and POST /mep/eligibility-terms/sweep; recomputed WITHOUT persisting on GET /mep/students/{student_id}/pfs-assessment"
    algorithm: weighted_scoring
    formula: |
      recent_verified_moves = count(QualifyingMove m WHERE m.student_id == S.id
                                    AND m.status == 'VERIFIED'
                                    AND m.move_date >= (logical_clock_date - MOVE_RECENCY_WINDOW_DAYS)
                                    AND m.move_date <= logical_clock_date)
      # inclusive on both ends of the 365-day window
      move_band(n) = 0  if n == 0
                     18 if n == 1
                     26 if n == 2
                     30 if n >= 3
      #
      # ---- variant INTERRUPTION_WEIGHTED (S.schooling_status == 'ENROLLED') ----
      move_band_points     = move_band(recent_verified_moves)
      interruption_points  = min(24, ceil(S.school_days_interrupted / 5) * 4)
      academic_points      = (14 if S.math_below_grade else 0) + (14 if S.reading_below_grade else 0)
      credential_points    = 0
      language_points      = 0
      credit_points        = min(18, S.credit_deficit * 3)
      raw                  = move_band_points + interruption_points + academic_points + credit_points
      pfs_score            = min(100, raw)
      floor_applied        = false
      #
      # ---- variant OSY_PATHWAY (S.schooling_status == 'OUT_OF_SCHOOL') ----
      move_band_points     = move_band(recent_verified_moves)
      interruption_points  = min(30, ceil(S.school_days_interrupted / 5) * 6)
      academic_points      = 0            # placement flags are NOT consulted
      credential_points    = 20 if S.has_hs_credential == false else 0
      language_points      = 10 if S.primary_language_not_english else 0
      credit_points        = 0            # credit_deficit is NOT consulted
      raw                  = move_band_points + interruption_points + credential_points + language_points
      pfs_score            = min(100, max(OSY_SCORE_FLOOR, raw))
      floor_applied        = (raw < OSY_SCORE_FLOOR)
      #
      pfs_variant = 'INTERRUPTION_WEIGHTED' if S.schooling_status == 'ENROLLED' else 'OSY_PATHWAY'
      pfs_flag    = (pfs_score >= PFS_SCORE_THRESHOLD)      # >= , NOT >
    input_set: "the Student row itself plus every QualifyingMove of that student in status VERIFIED whose move_date falls in the inclusive 365-day window ending on the logical clock date. Moves in status RECORDED or REJECTED are excluded. No other entity is read."
    constants:
      PFS_SCORE_THRESHOLD: 60
      MOVE_RECENCY_WINDOW_DAYS: 365
      OSY_SCORE_FLOOR: 55
    precision: "integer points; ceil() is applied to the days/5 quotient before multiplication; min/max are applied in the written order"
    variants:
      - name: INTERRUPTION_WEIGHTED
        when: "Student.schooling_status == 'ENROLLED'"
        difference: "consumes math_below_grade, reading_below_grade and credit_deficit; weights interruption at 4 points per 5-day block capped at 24; has no score floor"
      - name: OSY_PATHWAY
        when: "Student.schooling_status == 'OUT_OF_SCHOOL'"
        difference: "ignores the placement flags and credit_deficit entirely, weights interruption at 6 points per 5-day block capped at 30, adds 20 points when no high-school credential is held and 10 for a non-English home language, and clamps the result up to a floor of 55 - so the same stored Student row scores differently under the two variants"

  - name: service_hours_allocation
    trigger: "on the ServicePlan DRAFT -> ACTIVE transition, on every ServicePlan close, on every ServicePlan create (including the supersede path), and as CASCADE-A hop 4 of POST /mep/coes/{coe_id}/approve"
    algorithm: waterfall_allocation
    formula: |
      budget = PROGRAM_YEAR_HOURS_BUDGET_PFS if Student.pfs_flag else PROGRAM_YEAR_HOURS_BUDGET_NON_PFS
      plans  = [ p in ServicePlan WHERE p.student_id == S.id
                 AND p.status IN {DRAFT, ACTIVE} ]
               ordered by p.created_at ASC        # sole sort key; created_at is
                                                 # unique per plan because plan
                                                 # creates are serialised, so no
                                                 # further tie-break is needed
      W = sum(PLAN_TYPE_WEIGHTS[p.plan_type] for p in plans)
      if len(plans) == 0:                        # empty-set edge
          nothing is written; the calculation is a no-op
      elif W == 0:                               # unreachable given the weight
          every p.allocated_hours = 0.00         # table, declared for closure
      else:
          # ROUNDING ORDER IS PINNED: round EACH plan's raw share to 2 decimals
          # with round_half_up FIRST, then sum. "Sum then round" is WRONG here
          # and produces a different distribution.
          for p in plans:
              p.allocated_hours = round_half_up(budget * PLAN_TYPE_WEIGHTS[p.plan_type] / W, 2)
          allocated_sum = sum(p.allocated_hours for p in plans)
          residual      = round_half_up(budget - allocated_sum, 2)   # may be negative
          # the residual (positive or negative) lands entirely on plans[0],
          # i.e. the plan with the EARLIEST created_at
          plans[0].allocated_hours = round_half_up(plans[0].allocated_hours + residual, 2)
      for p in plans:
          p.priority_tier          = 'PFS' if Student.pfs_flag else 'NON_PFS'
          p.expected_service_hours = p.allocated_hours
    input_set: "every ServicePlan of the student in status DRAFT or ACTIVE, ordered by created_at ASC. Plans in status SUPERSEDED or CLOSED are excluded and keep the allocated_hours they last held."
    constants:
      PROGRAM_YEAR_HOURS_BUDGET_PFS: 120.00
      PROGRAM_YEAR_HOURS_BUDGET_NON_PFS: 75.00
      PLAN_TYPE_WEIGHTS:
        SUPPLEMENTAL_INSTRUCTION: 4
        SUMMER_PROGRAM: 3
        CREDIT_ACCRUAL: 2
        OSY_ALTERNATIVE: 3
    precision: "2 decimal places, round_half_up, applied per plan BEFORE summing; the residual is then applied to the earliest-created plan and re-rounded to 2 decimals"

  - name: transfer_credit_reconciliation
    trigger: "on the RecordTransferRequest RECEIVED -> RECONCILED transition"
    algorithm: constraint_propagation
    formula: |
      # This looks circular: the transfer cap percentage is keyed on a credit
      # total that itself includes the transferred credits. The EVALUATION ORDER
      # IS PINNED so the value is well defined, and the tier is NEVER re-derived
      # from the final total.
      #
      # step 1
      locally_accrued = sum(d.credits_awarded
                            for d in ServiceDelivery
                            WHERE ServicePlan(d.plan_id).student_id == S.id
                              AND ServicePlan(d.plan_id).plan_type == 'CREDIT_ACCRUAL'
                              AND d.reverses_delivery_id IS NULL
                              AND d.is_reversed == false)
      # step 2
      uncapped_transferred = request.reported_prior_credits
      # step 3 - the tier key is the PRE-CAP total
      tier_key = locally_accrued + uncapped_transferred
      # step 4 - highest tier whose floor is <= tier_key wins
      cap_pct  = 0.50 if tier_key < 12.00
                 else 0.35 if tier_key < 24.00
                 else 0.25
      # step 5
      capped_transferred = round_half_up(min(uncapped_transferred, cap_pct * tier_key), 2)
      # step 6 - the tier from step 3 is FINAL; do not recompute it from here
      total_awarded_credits = round_half_up(locally_accrued + capped_transferred, 2)
      #
      request.applied_transferred_credits = capped_transferred
      S.locally_accrued_credits           = round_half_up(locally_accrued, 2)
      S.transferred_credits_count         = capped_transferred
      S.total_awarded_credits             = total_awarded_credits
    input_set: "the RecordTransferRequest being reconciled, plus every ServiceDelivery attached to a CREDIT_ACCRUAL ServicePlan of that student that is neither a reversal record (reverses_delivery_id IS NULL) nor itself reversed (is_reversed == false). Plan status is NOT filtered - credits already earned survive plan closure."
    constants:
      TRANSFER_CAP_TIER_1_FLOOR: 0.00
      TRANSFER_CAP_TIER_1_PCT: 0.50
      TRANSFER_CAP_TIER_2_FLOOR: 12.00
      TRANSFER_CAP_TIER_2_PCT: 0.35
      TRANSFER_CAP_TIER_3_FLOOR: 24.00
      TRANSFER_CAP_TIER_3_PCT: 0.25
    precision: "2 decimal places, round_half_up; rounding is applied once at step 5 and once at step 6, never inside the tier lookup"

  - name: qc_sample_selection
    trigger: "on POST /mep/qc-selections; the risk_flag_count clause alone also runs on the CertificateOfEligibility DRAFT -> SUBMITTED transition"
    algorithm: chronological
    formula: |
      # ---- risk_flag_count, written at submit time on each certificate ----
      risk_flag_count(coe) =
            (1 if QualifyingMove(coe.move_id).work_type == 'FISHING' else 0)
          + (1 if EXISTS an InterviewRecord i WHERE i.move_id == coe.move_id
                 AND i.student_id == coe.student_id
                 AND i.interview_kind == 'INITIAL'
                 AND i.outcome == 'INCONCLUSIVE' else 0)
          + (1 if QualifyingMove(coe.move_id).worker_relationship != 'SELF'
                 AND QualifyingMove(coe.move_id).student_age_at_move >= 18 else 0)
      #
      # ---- the selection run ----
      # (a) eligibility filter - the candidate set, as an explicit predicate:
      candidates = [ c in CertificateOfEligibility
                     WHERE c.status == 'SUBMITTED'
                       AND c.qc_hold_exempt == false ]
      # (d) empty-pool fallback:
      if len(candidates) == 0:
          reject the whole request with ERR_NO_QC_CANDIDATES (409); nothing is written
      #
      mandatory = [ c in candidates WHERE c.risk_flag_count >= 1 ]
      target_n  = max(1, ceil(QC_SAMPLE_TARGET_PCT * len(candidates)))
      # (b) ranking expression + (c) tie-break:
      ranked    = candidates ordered by c.risk_flag_count DESC,
                                    then c.created_at ASC
      selected  = set(mandatory) UNION set(ranked[0 : target_n])
      #
      for c in selected ordered by c.created_at ASC:
          c.status = 'QC_SELECTED'
          create QualityControlReview(coe_id = c.id, status = 'OPEN',
              selection_reason = 'MANDATORY_RISK_FLAG' if c.risk_flag_count >= 1
                                 else 'SAMPLE_QUOTA')
      response = { candidate_count: len(candidates), target_n: target_n,
                   selected_count: len(selected),
                   selected_coe_ids: [ids of selected, created_at ASC],
                   review_ids: [ids of the created reviews, same order] }
    input_set: "every CertificateOfEligibility in status SUBMITTED with qc_hold_exempt == false, evaluated against the whole table (the run is state-wide, not scoped to an area or recruiter). Certificates in DRAFT, QC_SELECTED, QC_PASSED, APPROVED, RETURNED_FOR_CORRECTION or INVALIDATED are excluded, as are exempt certificates."
    constants:
      QC_SAMPLE_TARGET_PCT: 0.10
    precision: "target_n is an integer via ceil() then max(1, ...); no monetary rounding"

  - name: area_coverage_occupancy
    trigger: "as a precondition check on POST /mep/recruiter-assignments; the assigned_primary_slots_used clause is additionally recomputed on every RecruiterAssignment activate and close"
    algorithm: interval_merge
    formula: |
      # ---- rule 1: pairwise recruiter conflict, CLOSED intervals, NO buffer ----
      # Applies to EVERY coverage_role. Two closed intervals [s1,e1] and [s2,e2]
      # conflict iff s1 <= e2 AND s2 <= e1. Back-to-back coverage where
      # e1 + 1 day == s2 therefore does NOT conflict.
      existing_r = [ x in RecruiterAssignment WHERE x.recruiter_id == candidate.recruiter_id
                     AND x.status IN {PLANNED, ACTIVE} ]
      if ANY x in existing_r WHERE candidate.starts_on <= x.ends_on
                               AND x.starts_on <= candidate.ends_on:
          reject with ERR_RECRUITER_ASSIGNMENT_OVERLAP (409)
      #
      # ---- rule 2: area aggregate daily occupancy, CLOSED intervals EXPANDED
      #      by a 3-day handoff buffer on each side. EVERY coverage_role
      #      counts here - this is what makes rule 2's geometry different
      #      from rule 1's, not merely a different resource. ----
      existing_a = [ x in RecruiterAssignment WHERE x.area_id == candidate.area_id
                     AND x.status IN {PLANNED, ACTIVE} ]
      for each calendar date d with candidate.starts_on <= d <= candidate.ends_on:
          occ(d) = count(x in existing_a
                         WHERE (x.starts_on - HANDOFF_BUFFER_DAYS) <= d
                           AND d <= (x.ends_on + HANDOFF_BUFFER_DAYS))
      max_occ = max over those d of (occ(d) + 1)     # +1 counts the candidate
      if max_occ > AgriculturalArea(candidate.area_id).recruiter_capacity:
          reject with ERR_AREA_COVERAGE_CAPACITY_EXCEEDED (409)
      #
      # ---- rule 3: peak-season containment, PRIMARY only ----
      if candidate.coverage_role == 'PRIMARY':
          if NOT (candidate.starts_on <= area.peak_season_start_date
                  AND candidate.ends_on >= area.peak_season_end_date):
              reject with ERR_PEAK_SEASON_NOT_COVERED (422)
      #
      # ---- the conserved counters ----
      AgriculturalArea.assigned_primary_slots_used
          = count(x in RecruiterAssignment WHERE x.area_id == area.id
                  AND x.coverage_role == 'PRIMARY'
                  AND x.status IN {PLANNED, ACTIVE})
      Recruiter.active_assignment_count
          = count(x in RecruiterAssignment WHERE x.recruiter_id == recruiter.id
                  AND x.status IN {PLANNED, ACTIVE})
    input_set: "for rule 1, every RecruiterAssignment of the same recruiter in status PLANNED or ACTIVE regardless of area or coverage_role. For rule 2, every RecruiterAssignment of the same area in status PLANNED or ACTIVE, of either coverage_role, each interval widened by HANDOFF_BUFFER_DAYS on both ends. COMPLETED and CANCELLED assignments are excluded from all three rules and from both counters."
    constants:
      HANDOFF_BUFFER_DAYS: 3
    precision: "whole calendar dates; occupancy is evaluated day by day, both interval ends inclusive"

  - name: eligibility_term_sweep
    trigger: "on POST /mep/eligibility-terms/sweep"
    algorithm: chronological
    formula: |
      now_date = the calendar date (UTC) of the logical clock
      # processing order is pinned so the response counters are deterministic
      batch = [ t in EligibilityTerm WHERE t.status IN {ACTIVE, EXPIRING, EXPIRED} ]
              ordered by t.term_end_on ASC, then t.created_at ASC
      expiring_count = expired_count = lapsed_count = 0
      for t in batch:
          if t.status IN {ACTIVE, EXPIRING} AND now_date > t.term_end_on:
              # term_end_on is the INCLUSIVE last eligible day, so the test is
              # strictly-greater; now_date == term_end_on does NOT expire
              t.status = 'EXPIRED'
              t.reidentification_due_on = t.term_end_on + REIDENTIFICATION_GRACE_DAYS
              Student.eligibility_status = 'TERM_EXPIRED'
              Student.eligibility_expires_on = null
              expired_count += 1
          elif t.status == 'ACTIVE'
               AND now_date >= (t.term_end_on - EXPIRING_WINDOW_DAYS)
               AND now_date <= t.term_end_on:
              # >= on the window opening, NOT >
              t.status = 'EXPIRING'
              Student.eligibility_status = 'CONTINUATION'
              expiring_count += 1
          elif t.status == 'EXPIRED' AND now_date > t.reidentification_due_on:
              t.status = 'LAPSED'
              every ServicePlan of that student in status IN {DRAFT, ACTIVE}
                  -> CLOSED with closure_reason = 'REIDENTIFICATION_LAPSED'
              Student.service_status re-derived
              lapsed_count += 1
      # a term can move at most ONE step per sweep call
      response = { swept_count: len(batch), expiring_count: expiring_count,
                   expired_count: expired_count, lapsed_count: lapsed_count,
                   expired_term_ids: [ids moved to EXPIRED in this call, in batch order] }
    input_set: "every EligibilityTerm in status ACTIVE, EXPIRING or EXPIRED, ordered by term_end_on ASC then created_at ASC. Terms in REIDENTIFIED, LAPSED or TERMINATED are excluded. Each term advances at most one status per sweep call."
    constants:
      EXPIRING_WINDOW_DAYS: 60
      REIDENTIFICATION_GRACE_DAYS: 45
    precision: "whole calendar dates; both boundary comparisons are exact (strictly-greater for expiry, greater-or-equal for the EXPIRING window opening)"

  - name: student_service_hours_ledger
    trigger: "on POST /mep/service-deliveries and on POST /mep/service-deliveries/{delivery_id}/reverse"
    algorithm: aggregation
    formula: |
      # A forward record has reverses_delivery_id IS NULL. A reversal record
      # carries reverses_delivery_id = the forward record's id and copies its
      # hours verbatim. Neither the reversal record nor its target counts.
      unreversed(plan) = [ d in ServiceDelivery WHERE d.plan_id == plan.id
                           AND d.reverses_delivery_id IS NULL
                           AND d.is_reversed == false ]
      ServicePlan.delivered_hours = round_half_up(sum(d.hours for d in unreversed(plan)), 2)
      Student.total_service_hours_ledger
          = round_half_up(sum(ServicePlan.delivered_hours
                              for every ServicePlan p WHERE p.student_id == S.id), 2)
      Student.locally_accrued_credits
          = round_half_up(sum(d.credits_awarded for d in unreversed(p)
                              for every ServicePlan p WHERE p.student_id == S.id
                              AND p.plan_type == 'CREDIT_ACCRUAL'), 2)
      Student.total_awarded_credits
          = round_half_up(Student.locally_accrued_credits
                          + Student.transferred_credits_count, 2)
      # CONSERVATION INVARIANT: for any forward record F and its reversal R,
      #   Student.total_service_hours_ledger after (create F, reverse F)
      #   == Student.total_service_hours_ledger before create F,   exactly,
      # because F is excluded via is_reversed and R is excluded via
      # reverses_delivery_id IS NOT NULL. No plan status filter is applied, so
      # closing a plan never moves the ledger either.
    input_set: "every ServiceDelivery attached to any ServicePlan of the student, regardless of plan status; reversal records and reversed forward records are both excluded from the sums."
    constants:
      MAX_HOURS_PER_DELIVERY: 8.00
      HOURS_INCREMENT: 0.25
      MAX_CREDITS_PER_DELIVERY: 2.00
    precision: "2 decimal places, round_half_up applied once per aggregate; hours must be exact multiples of 0.25 so the sums are exact at 2 decimals"

# ===========================================================================
# 1.4 Validation Rules Table (ordered by priority; rows sharing a priority
#     number have disjoint `applies_to` scopes, so the winning error is
#     unambiguous for every single endpoint)
# ===========================================================================

validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present, X-User-Role is one of the five declared roles, and for the entity_backed roles Recruiter / QualityControlReviewer the X-User-ID resolves to an existing Recruiter row"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the target endpoint's declared roles list in section 1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "path-templated resources are resolved left to right; the area id in the path resolves"
    error_id: ERR_AREA_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/areas/{area_id}, PATCH /mep/areas/{area_id}"

  - priority: 3
    category: existence
    check: "the recruiter id in the path resolves"
    error_id: ERR_RECRUITER_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/recruiters/{recruiter_id}, PATCH /mep/recruiters/{recruiter_id}"

  - priority: 3
    category: existence
    check: "the assignment id in the path resolves"
    error_id: ERR_ASSIGNMENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/recruiter-assignments/{assignment_id}, POST /mep/recruiter-assignments/{assignment_id}/activate, POST /mep/recruiter-assignments/{assignment_id}/close"

  - priority: 3
    category: existence
    check: "the student id in the path resolves"
    error_id: ERR_STUDENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/students/{student_id}, PATCH /mep/students/{student_id}, GET /mep/students/{student_id}/pfs-assessment"

  - priority: 3
    category: existence
    check: "the qualifying move id in the path resolves"
    error_id: ERR_MOVE_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/qualifying-moves/{move_id}, POST /mep/qualifying-moves/{move_id}/adjudicate"

  - priority: 3
    category: existence
    check: "the interview record id in the path resolves"
    error_id: ERR_INTERVIEW_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/interview-records/{interview_id}"

  - priority: 3
    category: existence
    check: "the certificate id in the path resolves"
    error_id: ERR_COE_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/coes/{coe_id}, PATCH /mep/coes/{coe_id}, POST /mep/coes/{coe_id}/submit, POST /mep/coes/{coe_id}/approve, POST /mep/coes/{coe_id}/invalidate"

  - priority: 3
    category: existence
    check: "the quality control review id in the path resolves"
    error_id: ERR_QC_REVIEW_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/qc-reviews/{review_id}, POST /mep/qc-reviews/{review_id}/decide"

  - priority: 3
    category: existence
    check: "the eligibility term id in the path resolves"
    error_id: ERR_TERM_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/eligibility-terms/{term_id}, POST /mep/eligibility-terms/{term_id}/reidentify"

  - priority: 3
    category: existence
    check: "the transfer request id in the path resolves"
    error_id: ERR_TRANSFER_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/transfer-requests/{request_id}, POST /mep/transfer-requests/{request_id}/match, POST /mep/transfer-requests/{request_id}/receive, POST /mep/transfer-requests/{request_id}/reconcile, POST /mep/transfer-requests/{request_id}/reject"

  - priority: 3
    category: existence
    check: "the service plan id in the path resolves"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/service-plans/{plan_id}, POST /mep/service-plans/{plan_id}/activate, POST /mep/service-plans/{plan_id}/close"

  - priority: 3
    category: existence
    check: "the service delivery id in the path resolves"
    error_id: ERR_DELIVERY_NOT_FOUND
    http_status: 404
    applies_to: "GET /mep/service-deliveries/{delivery_id}, POST /mep/service-deliveries/{delivery_id}/reverse"

  - priority: 4
    category: business_constraint
    check: "request body shape: every required input field present, enums inside their declared member sets, numbers inside their declared ranges, dates ISO-8601 YYYY-MM-DD, pagination limit in 1..100 and offset >= 0, state codes exactly two uppercase letters, AgriculturalArea.peak_season_start_date <= peak_season_end_date, RecruiterAssignment.starts_on <= ends_on, RecordTransferRequest.holding_state_code != requesting_state_code, InterviewRecord.coe_id present exactly when interview_kind == QC_REINTERVIEW"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints that accept a request body or query parameters"

  - priority: 5
    category: existence
    check: "body-referenced foreign keys resolve, checked in the order the endpoint's input list declares them: area_id, recruiter_id, student_id, move_id, plan_id, coe_id, reinterview_id, matched_prior_student_id, new_move_id"
    error_id: ERR_AREA_NOT_FOUND
    http_status: 404
    applies_to: "POST /mep/recruiter-assignments (area_id), POST /mep/students (area_id)"

  - priority: 5
    category: existence
    check: "body-referenced recruiter_id resolves"
    error_id: ERR_RECRUITER_NOT_FOUND
    http_status: 404
    applies_to: "POST /mep/recruiter-assignments (recruiter_id)"

  - priority: 5
    category: existence
    check: "body-referenced student_id / matched_prior_student_id resolves"
    error_id: ERR_STUDENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /mep/qualifying-moves, POST /mep/interview-records, POST /mep/coes, POST /mep/transfer-requests, POST /mep/transfer-requests/{request_id}/match, POST /mep/service-plans"

  - priority: 5
    category: existence
    check: "body-referenced move_id / new_move_id resolves"
    error_id: ERR_MOVE_NOT_FOUND
    http_status: 404
    applies_to: "POST /mep/interview-records, POST /mep/coes, POST /mep/eligibility-terms/{term_id}/reidentify"

  - priority: 5
    category: existence
    check: "body-referenced coe_id resolves"
    error_id: ERR_COE_NOT_FOUND
    http_status: 404
    applies_to: "POST /mep/interview-records (coe_id, when interview_kind == QC_REINTERVIEW)"

  - priority: 5
    category: existence
    check: "body-referenced reinterview_id resolves"
    error_id: ERR_INTERVIEW_NOT_FOUND
    http_status: 404
    applies_to: "POST /mep/qc-reviews/{review_id}/decide"

  - priority: 5
    category: existence
    check: "body-referenced plan_id resolves"
    error_id: ERR_PLAN_NOT_FOUND
    http_status: 404
    applies_to: "POST /mep/service-deliveries"

  - priority: 6
    category: state
    check: "the certificate is in DRAFT for submit, and in DRAFT or RETURNED_FOR_CORRECTION for PATCH"
    error_id: ERR_COE_NOT_IN_DRAFT
    http_status: 409
    applies_to: "POST /mep/coes/{coe_id}/submit, PATCH /mep/coes/{coe_id}"

  - priority: 6
    category: state
    check: "the certificate is in SUBMITTED (with no OPEN review) or QC_PASSED for approve, in APPROVED for invalidate, and in QC_SELECTED for the QC decision"
    error_id: ERR_COE_INVALID_STATE
    http_status: 409
    applies_to: "POST /mep/coes/{coe_id}/approve, POST /mep/coes/{coe_id}/invalidate, POST /mep/qc-reviews/{review_id}/decide"

  - priority: 6
    category: state
    check: "the review is still OPEN"
    error_id: ERR_QC_REVIEW_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /mep/qc-reviews/{review_id}/decide"

  - priority: 6
    category: state
    check: "the assignment is PLANNED for activate, and PLANNED or ACTIVE for close (COMPLETED requires ACTIVE)"
    error_id: ERR_ASSIGNMENT_INVALID_STATE
    http_status: 409
    applies_to: "POST /mep/recruiter-assignments/{assignment_id}/activate, POST /mep/recruiter-assignments/{assignment_id}/close"

  - priority: 6
    category: state
    check: "the move is still RECORDED"
    error_id: ERR_MOVE_ALREADY_ADJUDICATED
    http_status: 409
    applies_to: "POST /mep/qualifying-moves/{move_id}/adjudicate"

  - priority: 6
    category: state
    check: "the plan is DRAFT for activate and DRAFT or ACTIVE for close"
    error_id: ERR_PLAN_INVALID_STATE
    http_status: 409
    applies_to: "POST /mep/service-plans/{plan_id}/activate, POST /mep/service-plans/{plan_id}/close, POST /mep/service-deliveries (the referenced plan must be ACTIVE)"

  - priority: 6
    category: state
    check: "the term is EXPIRED for reidentify"
    error_id: ERR_TERM_INVALID_STATE
    http_status: 409
    applies_to: "POST /mep/eligibility-terms/{term_id}/reidentify"

  - priority: 6
    category: state
    check: "the transfer request is INITIATED for match, MATCHED for receive, RECEIVED for reconcile, and RECEIVED or RECONCILED for reject"
    error_id: ERR_TRANSFER_INVALID_STATE
    http_status: 409
    applies_to: "POST /mep/transfer-requests/{request_id}/match, POST /mep/transfer-requests/{request_id}/receive, POST /mep/transfer-requests/{request_id}/reconcile, POST /mep/transfer-requests/{request_id}/reject"

  - priority: 7
    category: state
    check: "expected_student_version equals the stored Student.version"
    error_id: ERR_STALE_STUDENT_VERSION
    http_status: 412
    applies_to: "POST /mep/service-plans"

  - priority: 7
    category: state
    check: "expected_area_version equals the stored AgriculturalArea.version"
    error_id: ERR_STALE_AREA_VERSION
    http_status: 412
    applies_to: "POST /mep/recruiter-assignments"

  - priority: 8
    category: business_safety
    check: "segregation of duties: the acting QualityControlReviewer's X-User-ID differs from CertificateOfEligibility.initiating_recruiter_id of the certificate under review"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /mep/qc-reviews/{review_id}/decide"

  - priority: 9
    category: business_safety
    check: "the acting reviewer's Recruiter.credential_level == QC_CERTIFIED"
    error_id: ERR_QC_CREDENTIAL_REQUIRED
    http_status: 403
    applies_to: "POST /mep/qc-reviews/{review_id}/decide"

  - priority: 10
    category: business_safety
    check: "the move qualifies: work_type IN {AGRICULTURAL, FISHING}. A move recorded with work_type == NONE can never be verified nor carry a certificate."
    error_id: ERR_MOVE_NOT_QUALIFYING
    http_status: 422
    applies_to: "POST /mep/qualifying-moves/{move_id}/adjudicate with decision = VERIFIED, POST /mep/coes"

  - priority: 11
    category: business_safety
    check: "the linked move is in status VERIFIED"
    error_id: ERR_MOVE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /mep/coes/{coe_id}/submit, POST /mep/eligibility-terms/{term_id}/reidentify"

  - priority: 12
    category: business_safety
    check: "at least one InterviewRecord exists with the certificate's student_id and move_id, interview_kind == INITIAL and outcome == SUPPORTS_ELIGIBILITY"
    error_id: ERR_INTERVIEW_DOCUMENTATION_MISSING
    http_status: 409
    applies_to: "POST /mep/coes/{coe_id}/submit"

  - priority: 13
    category: business_referential
    check: "the supplied reinterview InterviewRecord has interview_kind == QC_REINTERVIEW, student_id == coe.student_id and coe_id == coe.id"
    error_id: ERR_REINTERVIEW_STUDENT_MISMATCH
    http_status: 422
    applies_to: "POST /mep/qc-reviews/{review_id}/decide"

  - priority: 14
    category: business_referential
    check: "no other certificate for the same (student_id, move_id) pair is in status IN {SUBMITTED, QC_SELECTED, QC_PASSED, APPROVED}"
    error_id: ERR_DUPLICATE_ACTIVE_COE
    http_status: 409
    applies_to: "POST /mep/coes/{coe_id}/submit"

  - priority: 15
    category: business_referential
    check: "matched_prior_student_id differs from the request's own student_id"
    error_id: ERR_TRANSFER_SELF_MATCH
    http_status: 422
    applies_to: "POST /mep/transfer-requests/{request_id}/match"

  - priority: 16
    category: business_referential
    check: "credits_awarded is 0.00 unless the referenced ServicePlan.plan_type == CREDIT_ACCRUAL"
    error_id: ERR_CREDITS_NOT_ALLOWED_FOR_PLAN_TYPE
    http_status: 422
    applies_to: "POST /mep/service-deliveries"

  - priority: 17
    category: business_temporal
    check: "move_date, conducted_on and delivered_on are all <= the logical clock date"
    error_id: ERR_MOVE_DATE_IN_FUTURE
    http_status: 422
    applies_to: "POST /mep/qualifying-moves, POST /mep/interview-records, POST /mep/service-deliveries"

  - priority: 18
    category: business_temporal
    check: "residency_date >= QualifyingMove.move_date of the certificate's move"
    error_id: ERR_RESIDENCY_DATE_BEFORE_MOVE
    http_status: 422
    applies_to: "POST /mep/coes, PATCH /mep/coes/{coe_id}, POST /mep/eligibility-terms/{term_id}/reidentify"

  - priority: 19
    category: business_temporal
    check: "a PRIMARY assignment's closed interval contains the area's whole peak season: starts_on <= peak_season_start_date AND ends_on >= peak_season_end_date. Not checked for BACKUP."
    error_id: ERR_PEAK_SEASON_NOT_COVERED
    http_status: 422
    applies_to: "POST /mep/recruiter-assignments"

  - priority: 20
    category: business_temporal
    check: "the candidate closed interval [starts_on, ends_on] does not intersect any PLANNED or ACTIVE assignment of the same recruiter (no buffer; adjacency where the previous ends_on + 1 day == starts_on is allowed). Applies to every coverage_role."
    error_id: ERR_RECRUITER_ASSIGNMENT_OVERLAP
    http_status: 409
    applies_to: "POST /mep/recruiter-assignments"

  - priority: 21
    category: business_temporal
    check: "the logical clock date is <= the term's reidentification_due_on"
    error_id: ERR_REIDENTIFICATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /mep/eligibility-terms/{term_id}/reidentify"

  - priority: 22
    category: business_constraint
    check: "the target Recruiter.status == ACTIVE"
    error_id: ERR_RECRUITER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /mep/recruiter-assignments, POST /mep/recruiter-assignments/{assignment_id}/activate"

  - priority: 23
    category: business_constraint
    check: "the target AgriculturalArea.status == OPEN"
    error_id: ERR_AREA_NOT_OPEN
    http_status: 409
    applies_to: "POST /mep/recruiter-assignments, POST /mep/recruiter-assignments/{assignment_id}/activate"

  - priority: 24
    category: business_constraint
    check: "Student.eligibility_status IN {ELIGIBLE, CONTINUATION}"
    error_id: ERR_STUDENT_NOT_ELIGIBLE_FOR_SERVICES
    http_status: 409
    applies_to: "POST /mep/service-plans/{plan_id}/activate"

  - priority: 25
    category: business_constraint
    check: "plan_type == OSY_ALTERNATIVE requires Student.schooling_status == OUT_OF_SCHOOL"
    error_id: ERR_OSY_PLAN_REQUIRES_OUT_OF_SCHOOL
    http_status: 422
    applies_to: "POST /mep/service-plans"

  - priority: 26
    category: business_constraint
    check: "plan_type == SUPPLEMENTAL_INSTRUCTION requires Student.schooling_status == ENROLLED"
    error_id: ERR_SUPPLEMENTAL_REQUIRES_ENROLLED
    http_status: 422
    applies_to: "POST /mep/service-plans"

  - priority: 27
    category: business_constraint
    check: "hours > 0.00, hours <= 8.00 and hours is an exact multiple of 0.25; credits_awarded (when present) is <= 2.00 and an exact multiple of 0.25"
    error_id: ERR_INVALID_SERVICE_HOURS
    http_status: 422
    applies_to: "POST /mep/service-deliveries"

  - priority: 28
    category: business_constraint
    check: "the target delivery is a forward record (reverses_delivery_id IS NULL) and is not already reversed (is_reversed == false)"
    error_id: ERR_DELIVERY_NOT_REVERSIBLE
    http_status: 409
    applies_to: "POST /mep/service-deliveries/{delivery_id}/reverse"

  - priority: 29
    category: business_fiscal
    check: "the area's day-by-day occupancy over assignments of EVERY coverage_role, with each existing interval expanded by HANDOFF_BUFFER_DAYS on each side and the candidate counted, never exceeds AgriculturalArea.recruiter_capacity"
    error_id: ERR_AREA_COVERAGE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /mep/recruiter-assignments"

  - priority: 30
    category: business_fiscal
    check: "the quality-control candidate pool (SUBMITTED and not qc_hold_exempt) is non-empty"
    error_id: ERR_NO_QC_CANDIDATES
    http_status: 409
    applies_to: "POST /mep/qc-selections"

# ===========================================================================
# 1.5 API Endpoints
#     Read surface is deliberately wide (12 single-resource GETs + 10 filtered
#     list GETs) because every FK declared in section 1.1 must be reverse
#     reachable and every entity that participates in an FK needs a
#     single-resource GET establishing its collection segment.
#     All list endpoints accept "limit?" (1..100, default 20) and "offset?"
#     (default 0) and return newest-first by created_at, then id.
# ===========================================================================

endpoints:

  # ---- AgriculturalArea -------------------------------------------------
  - method: POST
    path: /mep/areas
    roles: [StateProgramAdmin]
    input: ["name", "state_code", "primary_activity", "peak_season_start_date", "peak_season_end_date", "recruiter_capacity?"]
    output: AgriculturalArea
    success_status: 201
    description: "Open a recruitment area. recruiter_capacity defaults to 2. status defaults to OPEN. assigned_primary_slots_used starts at 0. version starts at 1."
    side_effects: []

  - method: GET
    path: /mep/areas/{area_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: AgriculturalArea
    success_status: 200
    description: "Read one area, including the live assigned_primary_slots_used counter and the current version."
    side_effects: []

  - method: PATCH
    path: /mep/areas/{area_id}
    roles: [StateProgramAdmin]
    input: ["status?", "recruiter_capacity?", "peak_season_start_date?", "peak_season_end_date?"]
    output: AgriculturalArea
    success_status: 200
    description: "Amend an area. Only the four listed fields are writable; any other body key is ignored. Every accepted PATCH bumps version by 1 and refreshes updated_at. Lowering recruiter_capacity below assigned_primary_slots_used is allowed and does not retro-reject existing assignments."
    side_effects: ["AgriculturalArea.version incremented by 1"]

  # ---- Recruiter --------------------------------------------------------
  - method: POST
    path: /mep/recruiters
    roles: [StateProgramAdmin]
    input: ["full_name", "state_code", "credential_level?", "status?"]
    output: Recruiter
    success_status: 201
    description: "Register a recruiter. credential_level defaults to BASIC, status defaults to ACTIVE, active_assignment_count starts at 0."
    side_effects: []

  - method: GET
    path: /mep/recruiters/{recruiter_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: Recruiter
    success_status: 200
    description: "Read one recruiter, including the live active_assignment_count counter."
    side_effects: []

  - method: PATCH
    path: /mep/recruiters/{recruiter_id}
    roles: [StateProgramAdmin]
    input: ["status?", "credential_level?", "full_name?"]
    output: Recruiter
    success_status: 200
    description: "Amend a recruiter. Suspending a recruiter blocks new assignments but leaves existing PLANNED and ACTIVE assignments untouched. Every accepted PATCH bumps version by 1."
    side_effects: ["Recruiter.version incremented by 1"]

  # ---- RecruiterAssignment ---------------------------------------------
  - method: POST
    path: /mep/recruiter-assignments
    roles: [StateProgramAdmin]
    input: ["recruiter_id", "area_id", "coverage_role", "starts_on", "ends_on", "expected_area_version"]
    output: RecruiterAssignment
    success_status: 201
    description: "Assign a recruiter to an area for a closed date interval. expected_area_version must equal the stored AgriculturalArea.version or the write is rejected with ERR_STALE_AREA_VERSION (412). status starts at PLANNED. PRIMARY assignments must additionally span the whole peak season; BACKUP assignments skip that check only. Both roles are checked for per-recruiter unbuffered interval overlap and for buffered area occupancy against recruiter_capacity."
    side_effects:
      - "AgriculturalArea.version incremented by 1"
      - "AgriculturalArea.assigned_primary_slots_used recomputed (PRIMARY only)"
      - "Recruiter.active_assignment_count recomputed"

  - method: GET
    path: /mep/recruiter-assignments/{assignment_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: RecruiterAssignment
    success_status: 200
    description: "Read one assignment."
    side_effects: []

  - method: GET
    path: /mep/recruiter-assignments
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: ["recruiter_id?", "area_id?", "coverage_role?", "status?", "limit?", "offset?"]
    output: "RecruiterAssignment[]"
    success_status: 200
    description: "List assignments, filterable by recruiter_id, area_id, coverage_role and status. Filters combine with AND."
    side_effects: []

  - method: POST
    path: /mep/recruiter-assignments/{assignment_id}/activate
    roles: [StateProgramAdmin]
    input: []
    output: RecruiterAssignment
    success_status: 200
    description: "Move a PLANNED assignment to ACTIVE. Guarded on two other entities: the Recruiter must still be ACTIVE and the AgriculturalArea must still be OPEN at activation time, re-checked against live state rather than the state that existed at creation."
    side_effects: ["Recruiter.active_assignment_count recomputed"]

  - method: POST
    path: /mep/recruiter-assignments/{assignment_id}/close
    roles: [StateProgramAdmin]
    input: ["outcome", "cancelled_reason?"]
    output: RecruiterAssignment
    success_status: 200
    description: "Close an assignment. outcome is COMPLETED (requires ACTIVE) or CANCELLED (allowed from PLANNED or ACTIVE). cancelled_reason is stored only for CANCELLED and ignored for COMPLETED. Closing releases the area capacity slot, restoring assigned_primary_slots_used to its pre-assignment value."
    side_effects:
      - "AgriculturalArea.assigned_primary_slots_used recomputed (PRIMARY only)"
      - "AgriculturalArea.version incremented by 1"
      - "Recruiter.active_assignment_count recomputed"

  # ---- Student ----------------------------------------------------------
  - method: POST
    path: /mep/students
    roles: [Recruiter]
    input: ["full_name", "birth_date", "current_state_code", "area_id", "schooling_status?", "grade_level?", "school_days_interrupted?", "math_below_grade?", "reading_below_grade?", "credit_deficit?", "has_hs_credential?", "primary_language_not_english?"]
    output: Student
    success_status: 201
    description: "Identify a child. schooling_status defaults to ENROLLED, school_days_interrupted and credit_deficit default to 0, all three booleans default to false, grade_level defaults to null. eligibility_status starts at NOT_ELIGIBLE and service_status starts at UNSERVED - the two dimensions advance independently. pfs_score, pfs_variant and pfs_flag are computed immediately (with zero verified moves) and persisted. prior_record_student_id starts null and is only ever written by the exchange match step. version starts at 1."
    side_effects: ["Student.pfs_score / pfs_variant / pfs_flag computed and persisted"]

  - method: GET
    path: /mep/students/{student_id}
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output: Student
    success_status: 200
    description: "Read one student, including both state dimensions, the persisted PFS fields, eligibility_expires_on, total_service_hours_ledger and the three credit counters."
    side_effects: []

  - method: GET
    path: /mep/students
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: ["area_id?", "prior_record_student_id?", "eligibility_status?", "service_status?", "schooling_status?", "pfs_flag?", "limit?", "offset?"]
    output: "Student[]"
    success_status: 200
    description: "List students, filterable by area_id, prior_record_student_id, either state dimension, schooling_status and pfs_flag. Filters combine with AND."
    side_effects: []

  - method: PATCH
    path: /mep/students/{student_id}
    roles: [Recruiter, ServiceCoordinator]
    input: ["current_state_code?", "area_id?", "schooling_status?", "grade_level?", "school_days_interrupted?", "math_below_grade?", "reading_below_grade?", "credit_deficit?", "has_hs_credential?", "primary_language_not_english?"]
    output: Student
    success_status: 200
    description: "Amend the demographic and academic profile. Neither state dimension nor any computed field is writable; supplying eligibility_status, service_status, pfs_score or total_service_hours_ledger in the body is ignored rather than rejected. Every accepted PATCH recomputes and persists pfs_score / pfs_variant / pfs_flag, re-runs service_hours_allocation for the student's DRAFT and ACTIVE plans when pfs_flag changed, and bumps version by 1 (which invalidates any previously read expected_student_version)."
    side_effects:
      - "Student.pfs_score / pfs_variant / pfs_flag recomputed and persisted"
      - "service_hours_allocation re-run over the student's DRAFT and ACTIVE ServicePlans when pfs_flag changed"
      - "Student.version incremented by 1"

  - method: GET
    path: /mep/students/{student_id}/pfs-assessment
    roles: [StateProgramAdmin, Recruiter, QualityControlReviewer, ServiceCoordinator, ExchangeLiaison]
    input: []
    output:
      student_id: string
      pfs_variant: string
      pfs_score: integer
      pfs_flag: boolean
      recent_verified_moves: integer
      move_band_points: integer
      interruption_points: integer
      academic_points: integer
      credential_points: integer
      language_points: integer
      credit_points: integer
      raw_score: integer
      floor_applied: boolean
    success_status: 200
    description: "Computed read that exposes every intermediate term of calculations.pfs_priority_score for the student, evaluated against the current logical clock. Read-only: it persists nothing and never bumps version. The component fields that the active variant does not consume are returned as 0 (academic_points and credit_points under OSY_PATHWAY; credential_points and language_points under INTERRUPTION_WEIGHTED), which is what makes the two variants distinguishable from a single response."
    side_effects: []

  # ---- QualifyingMove ---------------------------------------------------
  - method: POST
