  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_cabinet_version_rejects_the_install_and_the_removal
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.cabinet-module-install-stale
          - endpoints[POST /cabinets/{cabinet_id}/modules]
          - endpoints[POST /cabinets/{cabinet_id}/module-removals]
          - validations[priority=14]
          - errors.ERR_STALE_CABINET_VERSION
        distinguishing_aspect: |
          The §1.2.1 rule for the install endpoint, exercised the way a real client
          hits it: read the cabinet once, then try to place TWO modules from that one
          read. The second call carries a version that was correct a moment ago and
          must be refused with 412 — precisely because slot assignment is
          superseding, an accepted stale write would hand out a slot the first
          writer already filled. The same probe pins the version arithmetic: exactly
          +1 per accepted write on the cabinet, and NO bump on a rejected one, so a
          client can retry with the re-read value and succeed. The removal endpoint
          shares the field and repeats the pattern in reverse.
        test_recipe:
          setup:
            - "An FP16-STD project with an APPROVED revision owns cabinet ${cab} (2 slots); ${m1} and ${m2} are CALIBRATED and uninstalled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP16-STD", pixel_pitch_mm: 5.0, rated_brightness_nits: 5000, environmental_rating: "IP65_FULL", module_width_mm: 320, module_height_mm: 160, module_pixel_cols: 64, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 2, cabinet_weight_kg: 15.36, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 500.00, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "OCC Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 1, cabinet_grid_rows: 1, min_viewing_distance_m: 5.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /drawing-revisions"
              payload: { project_id: "${pj}", structural_load_kg_per_sqm: 160.00, wind_load_kph: 100, mounting_type: "WALL", service_access_side: "FRONT" }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { rev: $.data.id }
            - call: "POST /drawing-revisions/${rev}/review"
              payload: { decision: "APPROVE" }
              as: StructuralReviewer
              as_user_id: "rev-1"
            - call: "POST /cabinets"
              payload: { project_id: "${pj}", grid_row: 1, grid_col: 1 }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { cab: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m1: $.data.id }
            - call: "POST /modules/${m1}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m1}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3292 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "M-2" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { m2: $.data.id }
            - call: "POST /modules/${m2}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${m2}/calibrate"
              payload: { measured_brightness_nits: 4950, measured_color_x: 0.3128, measured_color_y: 0.3290 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m1}", slot_index: 1, expected_cabinet_version: "${v0}" }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m2}", slot_index: 2, expected_cabinet_version: "${v0}" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { err_stale_install: $.data.error_id }
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { v1: $.data.version }
            - call: "POST /cabinets/${cab}/modules"
              payload: { module_id: "${m2}", slot_index: 2, expected_cabinet_version: "${v1}" }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /cabinets/${cab}/module-removals"
              payload: { module_id: "${m2}", expected_cabinet_version: "${v1}" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { err_stale_removal: $.data.error_id }
            - call: "GET /cabinets/${cab}"
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { v2: $.data.version }
            - call: "POST /cabinets/${cab}/module-removals"
              payload: { module_id: "${m2}", expected_cabinet_version: "${v2}" }
              as: ProductionOperator
              as_user_id: "op-1"
          assert:
            - "trigger call 1 -> 201 and ${v1} == ${v0} + 1"
            - "trigger call 2 -> 412 with ${err_stale_install} == 'ERR_STALE_CABINET_VERSION': the version read before the first install is already stale"
            - "after trigger call 2: Cabinet.${cab}.version is still ${v1}, occupied_slot_indexes == [1], installed_module_count == 1, and Module.${m2}.module_state is still CALIBRATED with cabinet_id null — a rejected OCC write changes nothing at all"
            - "trigger call 4 -> 201 with the re-read version: ${v2} == ${v1} + 1, occupied_slot_indexes == [1, 2], cabinet_state == POPULATED"
            - "trigger call 5 -> 412 with ${err_stale_removal} == 'ERR_STALE_CABINET_VERSION': the removal endpoint shares expected_cabinet_version, and ${v1} is two writes behind"
            - "trigger call 7 -> 201: Module.${m2}.module_state back to CALIBRATED, occupied_slot_indexes == [1], and Cabinet.${cab}.version == ${v2} + 1"
            - "Module.${m1}.version incremented exactly once (its install) and Module.${m2}.version exactly twice (install + removal): the OCC field lives on the parent, but each accepted write still bumps its own row"

      - name: stale_contract_version_rejects_the_second_reservation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.spare-reservation-stale
          - endpoints[POST /service-contracts/{service_contract_id}/spare-reservations]
          - endpoints[POST /service-contracts/{service_contract_id}/spare-releases]
          - validations[priority=15]
          - errors.ERR_STALE_CONTRACT_VERSION
        distinguishing_aspect: |
          The second §1.2.1 rule guards a counter rather than a slot map: two
          reservations issued from one read of the contract would both believe
          spare_reserved_count was 0 and the second would overwrite the first's
          increment, so the stale one must be refused with 412 and its own error id
          — ERR_STALE_CONTRACT_VERSION, not the cabinet's code. The release endpoint
          carries the same field, so the reserve/release pair must be driven with a
          fresh read each time, and the refusals must leave the counter, the
          module's reservation link and the contract's version untouched.
        test_recipe:
          setup:
            - "A PENDING SILVER contract ${sc} on a 4x4 FP10-IN project (spare_required_count = ceil(16 * 200 / 10000) = 1) and two CALIBRATED spares ${sp1}, ${sp2}."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /display-models"
              payload: { name: "FP10-IN", pixel_pitch_mm: 10.0, rated_brightness_nits: 5000, environmental_rating: "IP43_INDOOR", module_width_mm: 320, module_height_mm: 320, module_pixel_cols: 32, module_pixel_rows: 32, cabinet_width_mm: 320, cabinet_height_mm: 320, modules_per_cabinet: 1, cabinet_weight_kg: 10.24, price_per_sqm_cents: 1000000, dead_pixel_ppm_limit: 976.56, module_dead_pixel_max: 3, module_cluster_max: 1, reference_color_x: 0.3128, reference_color_y: 0.3290, burn_in_hours_required: 24, max_drive_pct: 90 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { dm: $.data.id }
            - call: "POST /projects"
              payload: { customer_name: "Counter Wall", install_environment: "RETAIL", site_region_code: "NA-W", display_model_id: "${dm}", cabinet_grid_cols: 4, cabinet_grid_rows: 4, min_viewing_distance_m: 10.0, target_brightness_nits: 5000, redundancy_mode: "NONE", output_port_count: 1, port_bandwidth_mbps: 1000, color_depth_bits: 10, refresh_rate_hz: 60, player_count: 1 }
              as: DesignEngineer
              as_user_id: "eng-1"
              captures: { pj: $.data.id }
            - call: "POST /service-contracts"
              payload: { project_id: "${pj}", tier: "SILVER", spare_pct_bp: 200, term_months: 60 }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { sc: $.data.id }
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "SP-1" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { sp1: $.data.id }
            - call: "POST /modules/${sp1}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${sp1}/calibrate"
              payload: { measured_brightness_nits: 4900, measured_color_x: 0.3130, measured_color_y: 0.3292 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules"
              payload: { display_model_id: "${dm}", serial_no: "SP-2" }
              as: ProductionOperator
              as_user_id: "op-1"
              captures: { sp2: $.data.id }
            - call: "POST /modules/${sp2}/pixel-test"
              payload: { dead_pixel_count: 0, max_cluster_size: 0 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "POST /modules/${sp2}/calibrate"
              payload: { measured_brightness_nits: 4850, measured_color_x: 0.3128, measured_color_y: 0.3290 }
              as: ProductionOperator
              as_user_id: "op-1"
            - call: "GET /service-contracts/${sc}"
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { v0: $.data.version }
          trigger:
            - call: "POST /service-contracts/${sc}/spare-reservations"
              payload: { module_id: "${sp1}", expected_service_contract_version: "${v0}" }
              as: ServiceManager
              as_user_id: "svc-1"
            - call: "POST /service-contracts/${sc}/spare-reservations"
              payload: { module_id: "${sp2}", expected_service_contract_version: "${v0}" }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { err_stale_reserve: $.data.error_id }
            - call: "POST /service-contracts/${sc}/spare-releases"
              payload: { module_id: "${sp1}", expected_service_contract_version: "${v0}" }
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { err_stale_release: $.data.error_id }
            - call: "GET /service-contracts/${sc}"
              as: ServiceManager
              as_user_id: "svc-1"
              captures: { v1: $.data.version }
            - call: "POST /service-contracts/${sc}/spare-reservations"
              payload: { module_id: "${sp2}", expected_service_contract_version: "${v1}" }
              as: ServiceManager
              as_user_id: "svc-1"
          assert:
            - "trigger call 1 -> 200: spare_reserved_count == 1, Module.${sp1}.reserved_service_contract_id == ${sc}, and ${v1} == ${v0} + 1"
            - "trigger call 2 -> 412 with ${err_stale_reserve} == 'ERR_STALE_CONTRACT_VERSION' (NOT ERR_STALE_CABINET_VERSION): spare_reserved_count is still 1 and Module.${sp2}.reserved_service_contract_id is still null"
            - "trigger call 3 -> 412 with ${err_stale_release} == 'ERR_STALE_CONTRACT_VERSION': the release endpoint enforces the same field, and ${sp1} remains reserved to ${sc}"
            - "after the two refusals the contract's version is STILL ${v1}: rejected OCC writes never advance the counter or the version"
            - "trigger call 5 -> 200 with the fresh version: spare_reserved_count == 2 and version == ${v1} + 1"
            - "GET /modules?reserved_service_contract_id=${sc} -> total_count == 2"

      - name: burn_in_failure_and_warranty_fulfilment_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.BurnInRun
          - state_machines.ServiceCase
        excluded_because:
          difficulty_instance: burn_in_failure_cascades_cabinet_project_visit
          rationale: |
            The multi-hop chains are the subject of three §1.8 instances that already
            walk them end to end and assert every hop plus the rows that must NOT
            move: burn_in_failure_cascades_cabinet_project_visit (run FAILED ->
            cabinet QUARANTINED -> project BLOCKED -> visit ABORTED),
            warranty_fulfilment_cascades_module_contract_project (case FULFILLED ->
            two module rows -> contract counter/state -> project posture) and
            sign_off_cascades_project_commissioned_contract_active. A §1.9 instance
            could only re-walk the same hops.

