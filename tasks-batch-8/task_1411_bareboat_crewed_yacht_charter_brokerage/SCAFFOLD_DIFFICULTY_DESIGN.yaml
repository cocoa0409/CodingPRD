  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: yacht_block_overlap_vs_buffer_adjacency
        grounds:
          - validations[priority=6]
          - errors[ERR_AVAILABILITY_CONFLICT]
          - errors[ERR_TURNAROUND_BUFFER_VIOLATION]
          - concurrency_rules[block-create-stale-yacht]
        distinguishing_aspect: |
          Resource Yacht, half-open interval semantics + 1-day turnaround
          buffer: [2026-09-15, 2026-09-25) truly overlaps an ACTIVE block
          [2026-09-10, 2026-09-20) -> ERR_AVAILABILITY_CONFLICT; starting
          exactly at the block's exclusive end (2026-09-20, gap 0 < buffer 1)
          -> ERR_TURNAROUND_BUFFER_VIOLATION; starting at 2026-09-21 (gap == 1
          == buffer) is accepted.
        test_recipe:
          setup:
            - "Yacht A (DRAFT is fine for manual blocks); one ACTIVE MAINTENANCE block [2026-09-10, 2026-09-20); yacht version captured at create (1), unchanged after the successful block (2)"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id, ya_v1: $.data.version } }
            - { call: "POST /yachts/${ya_id}/availability-blocks", payload: { block_type: MAINTENANCE, start_date: "2026-09-10", end_date: "2026-09-20", expected_yacht_version: "${ya_v1}" }, as: Operator, as_user_id: "${op_id}", captures: { blk_id: $.data.id } }
            - { call: "GET /yachts/${ya_id}", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { ya_v2: $.data.version } }
          trigger:
            - { call: "POST /yachts/${ya_id}/availability-blocks", payload: { block_type: OPERATOR_HOLD, start_date: "2026-09-15", end_date: "2026-09-25", expected_yacht_version: "${ya_v2}" }, as: Operator, as_user_id: "${op_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /yachts/${ya_id}/availability-blocks", payload: { block_type: OPERATOR_HOLD, start_date: "2026-09-20", end_date: "2026-09-25", expected_yacht_version: "${ya_v2}" }, as: Operator, as_user_id: "${op_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /yachts/${ya_id}/availability-blocks", payload: { block_type: OPERATOR_HOLD, start_date: "2026-09-21", end_date: "2026-09-25", expected_yacht_version: "${ya_v2}" }, as: Operator, as_user_id: "${op_id}", captures: { blk2_id: $.data.id } }
          assert:
            - "err1 == ERR_AVAILABILITY_CONFLICT (true half-open overlap)"
            - "err2 == ERR_TURNAROUND_BUFFER_VIOLATION (disjoint but gap 0 days < TURNAROUND_BUFFER_DAYS 1)"
            - "third trigger succeeds (201): gap 1 day == buffer is sufficient; block ${blk2_id} status == ACTIVE"

      - name: permit_window_closed_containment
        grounds:
          - state_machines.PortPermit.REQUESTED_to_GRANTED
          - validations[priority=6]
          - errors[ERR_PERMIT_WINDOW_INSUFFICIENT]
          - state_machines.ItineraryLeg.PLANNED_to_PERMITTED
        distinguishing_aspect: |
          Resource PortPermit with CLOSED-interval containment semantics
          (different geometry than the yacht calendar's half-open + buffer):
          granting a permit valid 2026-11-03..2026-11-04 for a leg
          2026-11-03..2026-11-05 fails containment by one day; exact closed
          containment 2026-11-03..2026-11-05 grants, and the leg only reaches
          PERMITTED once the earlier REQUESTED permit is DENIED (REQUESTED
          blocks the bubble-up, DENIED does not).
        test_recipe:
          setup:
            - "Accepted agreement on Yacht A, 2026-11-02..2026-11-12; leg Mykonos arrival 2026-11-03 departure 2026-11-05"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-11-02", end_date: "2026-11-12", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag_id: $.data.id } }
            - { call: "POST /charter-agreements/${ag_id}/itinerary-legs", payload: { port_name: "Mykonos", arrival_date: "2026-11-03", departure_date: "2026-11-05" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { leg_id: $.data.id } }
            - { call: "POST /itinerary-legs/${leg_id}/permits", payload: { port_authority_ref: "PA-SHORT", valid_from: "2026-11-03", valid_until: "2026-11-04" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { pp1_id: $.data.id } }
          trigger:
            - { call: "POST /port-permits/${pp1_id}/decide", payload: { outcome: GRANTED }, as: PlatformAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /itinerary-legs/${leg_id}/permits", payload: { port_authority_ref: "PA-EXACT", valid_from: "2026-11-03", valid_until: "2026-11-05" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { pp2_id: $.data.id } }
            - { call: "POST /port-permits/${pp2_id}/decide", payload: { outcome: GRANTED }, as: PlatformAdmin, captures: { pp2_status: $.data.status } }
            - { call: "GET /itinerary-legs/${leg_id}", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { leg_mid: $.data.status } }
            - { call: "POST /port-permits/${pp1_id}/decide", payload: { outcome: DENIED }, as: PlatformAdmin }
            - { call: "GET /itinerary-legs/${leg_id}", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { leg_end: $.data.status } }
          assert:
            - "err == ERR_PERMIT_WINDOW_INSUFFICIENT (closed containment: 2026-11-04 < departure 2026-11-05); permit stays REQUESTED"
            - "pp2_status == GRANTED (exact closed containment valid_from == arrival and valid_until == departure is sufficient)"
            - "leg_mid == PLANNED (a REQUESTED permit still blocks the bubble-up even with one GRANTED)"
            - "leg_end == PERMITTED (after the REQUESTED permit is DENIED: 1 GRANTED, 0 REQUESTED)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: escrow_cash_conservation_under_cancel
        grounds:
          - entities.EscrowAccount.fields.total_funded_cents
          - entities.EscrowAccount.fields.total_released_cents
          - calculations.cancellation_penalty
        distinguishing_aspect: |
          Conserved quantity: client cash in escrow. Forward action (fund
          SIGNING tranche) paired with its compensating action (cancel with full
          settlement) must satisfy total_funded_cents == total_released_cents ==
          1500000 with every held bucket at 0 and movements summing exactly:
          refunds 900000 + operator release 480000 + broker releases 120000.
        test_recipe:
          setup:
            - "Yacht A, 2026-10-30..2026-11-19 (fee 2000000, apa 500000, deposit 500000); SIGNED; only SIGNING funded (1500000: fee bucket 1000000, deposit bucket 500000)"
            - "clock 2026-08-31 -> days 60 -> penalty 600000; retained min(600000, 1000000) = 600000"
          setup_api_calls:
            - { call: "POST /operators", payload: { name: "Op One", home_port: "Athens" }, as: PlatformAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /brokers", payload: { display_name: "CA One", broker_type: CENTRAL_AGENT, license_no: "LIC-CA-1" }, as: PlatformAdmin, captures: { ca_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Cy Client", email: "cy@example.com" }, as: PlatformAdmin, captures: { cl_id: $.data.id } }
            - { call: "POST /clients/${cl_id}/resume/submit", payload: { resume_class: OFFSHORE, skippered_hours: 300 }, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /clients/${cl_id}/resume/review", payload: { outcome: QUALIFIED }, as: PlatformAdmin }
            - { call: "POST /yachts", payload: { name: "Yacht A", charter_type: BAREBOAT, home_port: "Athens", capacity_berths: 8, weekly_base_rate_cents: 700000, min_charter_days: 3, required_resume_class: COASTAL, security_deposit_cents: 500000, pricing_mode: PRO_RATA, listing_central_agent_id: "${ca_id}" }, as: Operator, as_user_id: "${op_id}", captures: { ya_id: $.data.id } }
            - { call: "POST /yachts/${ya_id}/list", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /charter-requests", payload: { client_id: "${cl_id}", yacht_id: "${ya_id}", start_date: "2026-10-30", end_date: "2026-11-19", guests_count: 4 }, as: Client, as_user_id: "${cl_id}", captures: { rq_id: $.data.id } }
            - { call: "POST /charter-requests/${rq_id}/submit", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-requests/${rq_id}/offer", payload: {}, as: CentralAgent, as_user_id: "${ca_id}", captures: { rq_v: $.data.version } }
            - { call: "POST /charter-requests/${rq_id}/accept", payload: { expected_charter_request_version: "${rq_v}" }, as: Client, as_user_id: "${cl_id}", captures: { ag_id: $.data.id } }
            - { call: "POST /charter-agreements/${ag_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_no: "POL-1", coverage_amount_cents: 2000000, valid_from: "2026-10-01", valid_until: "2026-12-01" }, as: CentralAgent, as_user_id: "${ca_id}", captures: { ic_id: $.data.id } }
            - { call: "POST /insurance-certificates/${ic_id}/verify", payload: { outcome: VERIFIED }, as: PlatformAdmin }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: Client, as_user_id: "${cl_id}" }
            - { call: "POST /charter-agreements/${ag_id}/sign", payload: {}, as: CentralAgent, as_user_id: "${ca_id}" }
            - { call: "POST /charter-agreements/${ag_id}/fund", payload: { tranche: SIGNING, amount_cents: 1500000 }, as: Client, as_user_id: "${cl_id}", captures: { esc_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /charter-agreements/${ag_id}/cancel", payload: {}, as: Client, as_user_id: "${cl_id}" }
          assert:
            - "EscrowAccount.${esc_id}: total_funded_cents == 1500000 == total_released_cents (invariant: fund + cancel-refund conserves client cash)"
            - "all held buckets == 0 (held_charter_fee_cents, held_apa_cents, held_deposit_cents, held_gratuity_cents)"
            - "sum(REFUND_TO_CLIENT) == 900000 (fee refund 400000 + deposit refund 500000); sum(RELEASE_*) == 600000 (operator 480000 + central 60000 + retail 60000); 900000 + 600000 == 1500000"
            - "EscrowAccount.${esc_id}.status == CLOSED"

      - name: calendar_block_day_conservation_under_rebook
        grounds:
          - state_machines.AvailabilityBlock.ACTIVE_to_RELEASED
          - state_machines.CharterRequest.OFFERED_to_ACCEPTED
          - entities.CharterRequest.fields.rebooked_from_request_id
        distinguishing_aspect: |
          Conserved quantity: occupied calendar days on the yacht. Cancel
          (releases the 20-day CHARTER block) followed by rebook + accept of the
          same dates (creates an identical 20-day CHARTER block) leaves the
          count and day-coverage of ACTIVE CHARTER blocks exactly unchanged —
          a different conserved quantity than escrow cash.
        test_recipe:
          setup:
            - "Yacht A; client QUALIFIED; request 2026-10-30..2026-11-19 accepted (one ACTIVE CHARTER block, 20 days), then cancelled from PENDING_SIGNATURES"
          setup_api_calls:
