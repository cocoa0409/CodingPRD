      - name: menu_item_approval_disclosure_and_label_violations_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=25].ERR_ALLERGEN_DISCLOSURE_MISSING
          - validations[priority=30].ERR_LABEL_FIELDS_INCOMPLETE
          - entities.MenuItem.label_compliance_status
          - state_machines.MenuItem.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: >
          Both rules are enforced at review only, never at creation or submission, so a
          non-compliant item is allowed to reach UNDER_REVIEW and is bounced by the reviewer. An item
          violating both rules reports the disclosure rule (25 before 30), and the label rule is
          exactly the persisted label_compliance_status being MISSING_FIELDS.
        test_recipe:
          setup:
            - "Identical to the setup_api_calls of window_and_order_advance_walk_the_happy_path_with_clock_gated_rejections through POST /cooks/{id}/onboarding-decision: cook ${cook_id} is ACTIVE in CA whose StatePolicy requires the five label fields cook_name, ingredients, allergens, net_weight, cottage_food_disclaimer. The KITCHEN_INSPECTION document was reviewed by rev-2, so rev-1 may approve. Clock 2026-08-01T00:00:00Z."
            - "Three MenuItems are created and submitted: X with an empty allergen list and no attestation, Y with a label_fields list missing net_weight, Z violating both."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
