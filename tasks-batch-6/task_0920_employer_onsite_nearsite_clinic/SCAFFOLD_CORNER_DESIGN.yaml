          trigger:
            - call: "POST /reporting-periods/${per_id}/finalize"
              payload: {}
              as: ProgramAdmin
            - call: "POST /reporting-periods/${per_id}/restate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /reporting-periods/${per_id}/finalize"
              payload: {}
              as: ProgramAdmin
            - call: "POST /reporting-periods/${per_id}/restate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /reporting-periods/${per_id}/finalize"
              payload: {}
              as: ProgramAdmin
            - call: "POST /reporting-periods/${per_id}/restate"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
