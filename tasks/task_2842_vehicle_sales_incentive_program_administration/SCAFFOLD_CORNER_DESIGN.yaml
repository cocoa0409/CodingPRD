            - call: "GET /incentives/programs/${prog_id}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { pv1: $.data.version }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_a}", program_id: "${prog_id}", claimed_amount_cents: 100000, expected_program_version: "${pv1}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { claim_a: $.data.id, a_vs: $.data.validation_status, a_ps: $.data.payment_status }
            - call: "POST /incentives/claims"
              payload: { delivery_id: "${del_b}", program_id: "${prog_id}", claimed_amount_cents: 100000, expected_program_version: "${pv1}" }
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { claim_b: $.data.id }
            - call: "POST /incentives/payment-batches"
              payload: { batch_code: "CRN-B-GRD", region_code: "EAST", period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-08-15T00:00:00.000Z", scheduled_pay_date: "2026-08-20T00:00:00.000Z" }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /incentives/payment-batches/${batch_id}/schedule-claims"
              payload: { claim_ids: ["${claim_a}"] }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { err_submitted: $.data.error_id }
            - call: "POST /incentives/claims/${claim_a}/adjudicate"
              payload: { decision: "APPROVE" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
              captures: { a_vs_after: $.data.validation_status }
            - call: "POST /incentives/claims/${claim_b}/adjudicate"
              payload: { decision: "REJECT", rejection_error_id: "ERR_DUPLICATE_CLAIM" }
              as: ClaimsAuditor
              as_user_id: "u-auditor-2"
              captures: { b_vs_after: $.data.validation_status, b_amount: $.data.approved_amount_cents }
            - call: "POST /incentives/payment-batches/${batch_id}/schedule-claims"
              payload: { claim_ids: ["${claim_a}"] }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { count_ok: $.data.claim_count, total_ok: $.data.total_cents }
            - call: "POST /incentives/payment-batches/${batch_id}/schedule-claims"
              payload: { claim_ids: ["${claim_b}"] }
              as: IncentiveController
              as_user_id: "u-controller-1"
              captures: { err_rejected: $.data.error_id }
          assert:
            - "${a_vs} == SUBMITTED and ${a_ps} == UNPAID at creation"
            - "${err_submitted} == ERR_CLAIM_NOT_VALIDATED with HTTP 409 — the payment dimension may not leave UNPAID while validation_status is SUBMITTED"
            - "${a_vs_after} == VALIDATED, and the byte-identical retry then succeeds with ${count_ok} == 1 and ${total_ok} == 100000: adjudication is the ONLY thing that changed"
            - "${b_vs_after} == REJECTED with ${b_amount} == 0, and ${err_rejected} == ERR_CLAIM_NOT_VALIDATED — REJECTED is terminal on the validation dimension, so this claim can never be scheduled"
            - "the guard is one-directional: nothing about the payment dimension constrains adjudication, which is why claim B could be rejected while UNPAID"

      - name: unwind_ledger_sync_reconciles_the_programs_derived_money_fields
        claim_type: ledger_sync
        grounds:
          - state_machines.RetailDelivery.VALIDATED_to_UNWOUND.side_effects
          - calculations.program_accrual_ledger
        excluded_because:
          difficulty_instance: unwound_delivery_cascades_four_links_to_the_accrual_ledger
          rationale: "That §1.8 transitive_cascade instance already walks the unwind's four links end to end and reconciles the ancestor's derived fields before and after — claim payment_status -> CHARGED_BACK, the UNWOUND_DEAL Chargeback, the REVERSAL BudgetAccrual row and the recomputed accrued_budget_cents / committed_cents / claimed_units / per_unit_spend_cents, including the deliberate negative accrual residue. A separate §1.9 ledger-sync recipe would assert the same before/after pairs on the same endpoints."

