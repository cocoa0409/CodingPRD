      - name: anonymous_has_exactly_one_permitted_operation
        claim_type: exclusive_operations
        grounds:
          - roles.Anonymous.exclusive_operations
          - roles.Anonymous.shared_operations
          - endpoints[POST /proponents]
        distinguishing_aspect: >-
          Anonymous is the only role with an empty shared_operations list, so it
          cannot even read back the row it just created — self-registration mints
          an identity that must then be presented as X-User-ID under the Proponent
          role. The clock endpoint, shared by all three identified roles, is
          refused to it as well.
        test_recipe:
          setup:
            - "One species exists; the clock is at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
