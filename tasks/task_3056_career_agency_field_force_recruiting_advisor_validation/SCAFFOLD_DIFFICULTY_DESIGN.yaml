  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: duplicated_live_credit_boolean_boundary_at_validation
        grounds:
          - calculations.validation_production_attainment
          - entities.ValidationPeriod.fields.achieved_production_cents
          - state_machines.ValidationPeriod.OPEN_to_PASSED
          - endpoints.POST_/agency/validation-periods/{id}/evaluate
        distinguishing_aspect: |
          A numeric threshold crossing reached twice by a DUPLICATED credit: a window
          required to produce 204000 cents evaluates to PASSED while it carries ONE live
          204000-cent credit and to FAILED once that credit has been voided, so the
          met/not-met boolean flips without any change to required_production_cents —
