            - "ReleaseCycle.${rc_b0_id}.state == EMBARGOED, reached through CORRECTION_CLOSED with zero corrections on file and no caller action between them"
            - "ReleaseCycle.${rc_mg_id}.state == OPEN_REVIEW, because it declares a window that has not yet elapsed"
            - "the window close at 2026-06-30T00:00:00Z is strictly past, so the zero-correction cycle closes and advances to EMBARGOED without any correction being decided"
            - "a cycle holding one PENDING correction whose window has elapsed is refused with ERR_CORRECTIONS_PENDING rather than closing, so the zero-correction cycle is the one that closes"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: reanalysis_grant_requires_hospital_pin_current
        grounds:
          - state_machines.ReanalysisRequest.UNDER_REVIEW_to_GRANTED
          - state_machines.Survey.VERIFIED_to_SUBMITTED
          - state_machines.HospitalReview.CORRECTION_REQUESTED_to_ACCEPTED
          - validations[priority=11]
          - errors.ERR_REANALYSIS_REFERENCE_STALE
        distinguishing_aspect: |
          A reanalysis request's GRANT depends on the state of a DIFFERENT
          entity — the Survey's pinned methodology version must equal the
          Hospital's currently pinned version — so ReanalysisRequest→Survey→
          Hospital is one entity pair and the dependent condition is a pin
          equality, a different pair from the Employer→Grade dependency the
          second instance carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z. A fresh survey is pinned to M_B0 with a reanalysis UNDER_REVIEW, then the hospital is re-pinned to M_MG so the survey's reference becomes stale."
          setup_api_calls:
            - *k_clock
            - *k_meth_main
            - *k_meth_b0
            - *k_meth_mg
            - *k_hp0
            - call: "POST /hospital-safety-rating/hospitals/${p0_id}/methodology-versions"
              payload: { methodology_version_id: "${meth_b0_id}" }
