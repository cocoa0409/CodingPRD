      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: ["entities.SalesOrder", "concurrency_rules", "evaluation", "create", "stale", "order"]
        distinguishing_aspect: "The order's version starts at 1 and increments by exactly 1 on every mutation including cascaded ones: option add -> 2, second option -> 3, confirm -> 4, evaluation create (supersede side effect is separate) -> 5."
        test_recipe:
          setup: ["private-land SW139 order"]
          setup_api_calls:
            - call: "POST /api/home-models"
              payload: { model_code: "SW-139", name: "Slim 139", floor_plan_type: "SINGLE_WIDE", section_count: 1, width_ft: 13.9, length_ft: 66, base_price_cents: 4200000, factory_lead_time_days: 14 }
