              as: Publisher
              as_user_id: "${pubX}"
            - call: "POST /episodes"
              payload: { show_id: "${showX}", title: "EpX", total_ad_slots: 0, offered_positions: [] }
              as: Publisher
              as_user_id: "${pubX}"
              captures: { epX: $.data.id }
            - call: "POST /episodes/${epX}/schedule"
              payload: { scheduled_publish_at: "2026-12-01T00:00:00Z" }
              as: Publisher
