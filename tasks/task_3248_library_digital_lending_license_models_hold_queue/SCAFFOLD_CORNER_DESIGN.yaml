  # ===========================================================================
  - section: rbac
    instances:

      - name: patron_cannot_propose_acquisition_order
        claim_type: rbac_denial
        grounds:
          - roles.Patron
          - endpoints.POST_/lending/acquisition-orders/{id}/propose
        distinguishing_aspect: "The Patron role is absent from the order lifecycle: a propose attempt as Patron fails 403 ERR_FORBIDDEN regardless of payload."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund, patron P0, title T; order in DRAFT."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_p0
            - *k_title
            - *k_order
          trigger:
            - call: "POST /lending/acquisition-orders/${order_id}/propose"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "AcquisitionOrder.${order_id}.status == DRAFT"

      - name: library_admin_cannot_touch_other_library_patrons
        claim_type: rbac_denial
        grounds:
          - roles.LibraryAdmin
        distinguishing_aspect: "Entity-backed ownership: LibraryAdmin acting with X-User-ID of library B cannot register a patron under library A's path — 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Consortium with libraries A and B."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - call: "POST /lending/consortiums/${cons_id}/libraries"
              payload: { name: "Library B", residency_region_codes: ["94301"] }
              as: ConsortiumAdmin
              captures: { libb_id: $.data.id }
          trigger:
            - call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "X-1", full_name: "Cross Library", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${libb_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "GET /lending/libraries/${lib_id}/patrons returns 0 rows"

      - name: patron_cannot_read_other_patron_record
        claim_type: rbac_denial
        grounds:
          - roles.Patron
          - endpoints.GET_/lending/patrons/{id}
        distinguishing_aspect: "Patron self-service is scoped: P0 reading P1's record fails 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L with patrons P0 and P1."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_p0
            - call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-1", full_name: "P1", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat1_id: $.data.id }
          trigger:
            - call: "GET /lending/patrons/${pat1_id}"
              payload: {}
              as: Patron
              as_user_id: "${pat0_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: rbac_denial
        grounds:
          - validations.priority_1_auth
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID fail 401 ERR_UNAUTHENTICATED before role or existence checks."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Consortium exists."
          setup_api_calls:
            - *k_clock
            - *k_cons
          trigger:
            - call: "GET /lending/consortiums/${cons_id}"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: cpc_accrual_reconciles_fund_after_checkout_and_snapshot
        claim_type: derived_field_reconciliation
        grounds:
          - entities.BudgetFund.fields.cpc_accrued_cents
          - calculations.checkout_charge_cpc
        distinguishing_aspect: "Derived-field reconciliation: cpc_accrued_cents on the fund equals the sum of loan.circ_price_charged_cents and the snapshot's cpc_spend_cents after every mutation — 170 after one checkout, 340 after two, never stale."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Consortium (discount 0.15), library L, fund, patrons P0/P1, title TC (cpc 199), CPC license prepaid 5000."
          setup_api_calls:
            - *k_clock
            - *k_cons
            - *k_lib
            - *k_fund
            - *k_p0
            - call: "POST /lending/libraries/${lib_id}/patrons"
              payload: { external_card_number: "P-1", full_name: "P1", postal_code: "94301" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { pat1_id: $.data.id }
            - call: "POST /lending/consortiums/${cons_id}/titles"
              payload: { isbn: "9780000000080", name: "CPC Recon", author: "AR", price_ocou_cents: 5000, metered_time_price_cents: 4000, metered_time_days: 365, metered_circ_price_cents: 3000, metered_circ_count: 26, cpc_price_per_circ_cents: 199, simultaneous_use_price_cents: 9000, simultaneous_use_days: 180 }
              as: ConsortiumAdmin
              captures: { titler_id: $.data.id }
            - call: "POST /lending/acquisition-orders"
              payload: { library_id: "${lib_id}", budget_fund_id: "${fund_id}", title_id: "${titler_id}", model: "COST_PER_CIRC", prepaid_balance_cents: 5000, expected_budget_fund_version: "${fund_v}" }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
              captures: { orderr_id: $.data.id }
            - call: "POST /lending/acquisition-orders/${orderr_id}/propose"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${orderr_id}/approve"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/acquisition-orders/${orderr_id}/fulfill"
              payload: { invoiced_cost_cents: 5000 }
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          trigger:
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat0_id}", title_id: "${titler_id}" }
              as: Patron
              as_user_id: "${pat0_id}"
            - call: "GET /lending/budget-funds/${fund_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
            - call: "POST /lending/loans"
              payload: { patron_id: "${pat1_id}", title_id: "${titler_id}" }
              as: Patron
              as_user_id: "${pat1_id}"
            - call: "GET /lending/budget-funds/${fund_id}"
              payload: {}
              as: LibraryAdmin
              as_user_id: "${lib_id}"
          assert:
            - "after one checkout: cpc_accrued_cents == 170"
            - "after two checkouts: cpc_accrued_cents == 340"
            - "available_committed_cents == 1000000 - 5000 (spent at fulfill) - 340 == 994660"

      - name: epoch_run_is_idempotent_when_nothing_is_due
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints.POST_/lending/_ops/run_epoch
        distinguishing_aspect: "A second epoch at the same clock position with nothing newly due changes no state: all counters in the response are 0 and every entity version is unchanged."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Library L, fund, patron P0, title T, OCOU license; P0 has an ACTIVE loan due 2026-09-22."
          setup_api_calls:
            - *k_clock
