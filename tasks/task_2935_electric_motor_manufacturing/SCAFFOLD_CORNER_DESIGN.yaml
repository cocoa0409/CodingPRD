      - name: flat_topology_cross_references_resolve_between_nameplate_test_and_standard
        claim_type: cross_reference_integrity
        grounds:
          - complexity_profile.entity_topology
          - complexity_profile.relationship_patterns
          - endpoints[GET /nameplates]
          - endpoints[GET /performance-tests]
          - endpoints[GET /motor-designs]
        distinguishing_aspect: |
          A flat topology owes every foreign key a reverse lookup through a filtered list rather
          than a nested URL. The self-referential MotorDesign.supersedes_design_id and the
          cross-aggregate Nameplate.standard_id must both be discoverable this way, with the
          filter matching exactly the rows that carry the key.
        test_recipe:
          setup:
