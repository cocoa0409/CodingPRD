          assert:
            - "MigrationRequest.${mr}.migration_state == BLOCKED"
            - "PortRequest.${pr}.request_state == RESUBMITTED"
            - "SubscriberLine.${line}.number_status == UNASSIGNED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: reservation_half_open_adjacency_allowed_overlap_rejected
        grounds:
          - validations[priority=14]
          - entities.NumberReservation.fields.reserved_until
          - state_machines.NumberReservation.HELD_to_COMMITTED
        distinguishing_aspect: |
          The reservation resource uses half-open interval arithmetic in which a new hold that starts
          exactly at the prior hold's reserved_until is a legal zero-length gap and is accepted, while a
          hold that starts one instant earlier and is contained by the same window is rejected with
          ERR_RESERVATION_WINDOW_OVERLAP, so adjacency is permitted but nesting is not.
        test_recipe:
          setup:
            - "One FAMILY account on pool POOL-A"
            - "A held reservation on mdn 4155551701 covering exactly 2026-09-02T00:00:00Z to 2026-09-17T00:00:00Z"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1717", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/number-reservations"
              payload: { account_id: "${acct}", mdn: "4155551701", pool_code: "POOL-A", reserved_at: "2026-09-02T00:00:00Z", reserved_until: "2026-09-17T00:00:00Z" }
              as: PlatformAdmin
              captures: { r1: $.data.id }
          trigger:
            - call: "POST /portability/number-reservations"
              payload: { account_id: "${acct}", mdn: "4155551702", pool_code: "POOL-A", reserved_at: "2026-09-17T00:00:00Z", reserved_until: "2026-10-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { r2: $.data.id }
            - call: "POST /portability/number-reservations"
              payload: { account_id: "${acct}", mdn: "4155551703", pool_code: "POOL-A", reserved_at: "2026-09-05T00:00:00Z", reserved_until: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "NumberReservation.${r2}.reservation_state == HELD"
            - "response.data.error_id == ERR_RESERVATION_WINDOW_OVERLAP"
            - "Account.${acct}.reserved_mdn_count == 2"
      - name: promo_window_buffered_adjacency_rejected
        grounds:
          - validations[priority=15]
          - calculations.port_in_promo_credit_projection.constants.promo_window_buffer_days
        distinguishing_aspect: |
          The promotional window uses buffered-closed arithmetic rather than the reservation rule's
          half-open arithmetic: a replacement window that starts exactly where the prior window ended
          (a zero-length gap) is rejected with ERR_PROMO_WINDOW_OVERLAP, and only a window starting at
          or after window_end plus the configured 30-day buffer is accepted.
        test_recipe:
          setup:
            - "One FAMILY account and two ACTIVE PREPAID lines"
            - "An existing PROVISIONAL-ACTIVE schedule on the first line spanning 2026-09-02 to 2026-10-02"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1818", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155551801", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line_a: $.data.id }
            - call: "POST /portability/subscriber-lines/${line_a}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155551802", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line_b: $.data.id }
            - call: "POST /portability/subscriber-lines/${line_b}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line_a}"
              as: PlatformAdmin
              captures: { a_v1: $.data.version }
            - call: "POST /portability/promo-credit-schedules"
              payload: { subscriber_line_id: "${line_a}", promo_code: "SWITCH20", monthly_credit_cents: 1000, installment_months: 1, retention_requirement_cycles: 1, window_start: "2026-09-02T00:00:00Z", expected_subscriber_line_version: "${a_v1}" }
              as: CustomerService
              captures: { pcs_a: $.data.id }
            - call: "POST /portability/promo-credit-schedules/${pcs_a}/activate"
              payload: {}
              as: CustomerService
            - call: "GET /portability/subscriber-lines/${line_a}"
              as: PlatformAdmin
              captures: { a_v2: $.data.version }
            - call: "GET /portability/subscriber-lines/${line_b}"
              as: PlatformAdmin
              captures: { b_v1: $.data.version }
          trigger:
            - call: "POST /portability/promo-credit-schedules"
              payload: { subscriber_line_id: "${line_a}", promo_code: "SWITCH20", monthly_credit_cents: 1000, installment_months: 12, retention_requirement_cycles: 12, window_start: "2026-10-02T00:00:00Z", expected_subscriber_line_version: "${a_v2}" }
              as: CustomerService
              captures: { err: $.data.error_id }
            - call: "POST /portability/promo-credit-schedules"
              payload: { subscriber_line_id: "${line_b}", promo_code: "SWITCH20", monthly_credit_cents: 1000, installment_months: 12, retention_requirement_cycles: 12, window_start: "2026-11-01T00:00:00Z", expected_subscriber_line_version: "${b_v1}" }
              as: CustomerService
              captures: { pcs_b: $.data.id }
          assert:
            - "response.data.error_id == ERR_PROMO_WINDOW_OVERLAP"
            - "PromoCreditSchedule.${pcs_b}.schedule_state == PROVISIONAL"
            - "PromoCreditSchedule.${pcs_a}.schedule_state == ACTIVE"

  - rule_id: compensating_invariant
    instances:
      - name: promo_credit_ledger_returns_to_zero_after_clawback
        grounds:
          - calculations.promo_clawback_reversal
          - entities.Account.fields.net_promo_credit_cents
          - state_machines.PromoCreditSchedule.ACTIVE_to_CLAWED_BACK
        distinguishing_aspect: |
          The conserved quantity is the account's net promotional ledger: opening a schedule moves
          promo_credited_cents to 32000 and the compensating claw-back moves promo_clawed_back_cents to
          the same 32000, leaving net_promo_credit_cents at exactly 0 even though the line's installment
          plan balance grew by the reversed amount.
        test_recipe:
          setup:
            - "One FAMILY account whose promo_credited_cents and promo_clawed_back_cents both start at 0"
            - "One ACTIVE PREPAID line with an ACTIVE 40000 device plan"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1919", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155551901", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { v1: $.data.version }
            - call: "POST /portability/device-installment-plans"
              payload: { subscriber_line_id: "${line}", device_model: "Galaxy X1", device_price_cents: 40000, down_payment_cents: 0, installment_months: 20, activation_at: "2026-09-02T00:00:00Z", expected_subscriber_line_version: "${v1}" }
              as: CustomerService
              captures: { dip: $.data.id }
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { v2: $.data.version }
            - call: "POST /portability/promo-credit-schedules"
              payload: { subscriber_line_id: "${line}", promo_code: "SWITCH20", monthly_credit_cents: 1000, installment_months: 12, retention_requirement_cycles: 12, window_start: "2026-09-02T00:00:00Z", expected_subscriber_line_version: "${v2}" }
              as: CustomerService
              captures: { pcs: $.data.id }
            - call: "POST /portability/promo-credit-schedules/${pcs}/activate"
              payload: {}
              as: CustomerService
          trigger:
            - call: "POST /portability/promo-credit-schedules/${pcs}/claw-back"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Account.${acct}.promo_credited_cents == 32000"
            - "Account.${acct}.promo_clawed_back_cents == 32000"
            - "Account.${acct}.net_promo_credit_cents == 0"
            - "PromoCreditSchedule.${pcs}.vested_total_cents == 0"
            - "DeviceInstallmentPlan.${dip}.remaining_balance_cents == 72000"
      - name: reserved_number_inventory_balanced_by_commit
        grounds:
          - entities.Account.fields.reserved_mdn_count
          - state_machines.NumberReservation.HELD_to_COMMITTED
          - entities.NumberReservation.fields.committed_line_id
        distinguishing_aspect: |
          The conserved quantity is the count of held directory numbers rather than any monetary
          balance: a hold moves Account.reserved_mdn_count from 0 to 1 and the compensating commit
          returns it to exactly 0 through the deletion of the hold from the HELD set, leaving the number
          assigned to the line and no reservation outstanding.
        test_recipe:
          setup:
            - "One FAMILY account holding zero reservations"
            - "One ACTIVE POSTPAID line on that account in number_status UNASSIGNED"
            - "A held reservation on pool POOL-B for mdn 4155552002"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "2020", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155552001", billing_mode: "POSTPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/number-reservations"
              payload: { account_id: "${acct}", mdn: "4155552002", pool_code: "POOL-B", reserved_at: "2026-09-01T00:00:00Z", reserved_until: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
              captures: { r: $.data.id }
          trigger:
            - call: "POST /portability/number-reservations/${r}/commit"
              payload: { subscriber_line_id: "${line}" }
              as: PlatformAdmin
          assert:
            - "NumberReservation.${r}.reservation_state == COMMITTED"
            - "NumberReservation.${r}.committed_line_id == ${line}"
            - "Account.${acct}.reserved_mdn_count == 0"
            - "SubscriberLine.${line}.number_status == ASSIGNED"
            - "SubscriberLine.${line}.mdn == \"4155552002\""
