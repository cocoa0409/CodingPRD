      - name: endpoint_route_update_recomputes_schedule_anchor
        claim_type: side_effect_execution
        grounds: ["endpoints[PUT /retail/routes/{id}]", calculations.route_schedule_anchor, entities.Route.fields.schedule_anchor_utc]
        distinguishing_aspect: "Changing visit_weekday through the route update endpoint recomputes schedule_anchor_utc to the latest occurrence of the NEW weekday at 08:00:00Z strictly before the clock — 2026-09-04 for a Friday visit when the clock is Monday 2026-09-07T00:00:00Z."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 created with visit_weekday 1; clock 2026-09-07"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
            - { call: "POST /retail/franchisees/${f_id}/training", payload: { action: ENROLL, training_points: 45 }, as: FranchiseOwner, as_user_id: "${f_id}" }
            - { call: "POST /retail/franchisees/${f_id}/routes", payload: { route_code: R1, route_tier: A, zip_codes: [75001], visit_weekday: 1, truck_label: T-01, inventory_invested_cents: 100000, mix_plan: DIAGNOSTIC_WEIGHTED, territory_model: FRANCHISEE_ASSUMED }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_id: "$.data.id", r1_anchor_mon: "$.data.schedule_anchor_utc" } }
            - { call: "POST /retail/_clock/set_current_utc", payload: { current_utc: "2026-09-07T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "PUT /retail/routes/${r1_id}", payload: { visit_weekday: 5 }, as: FranchiseOwner, as_user_id: "${f_id}", captures: { r1_weekday: "$.data.visit_weekday", r1_anchor_fri: "$.data.schedule_anchor_utc" } }
          assert:
            - "Route.${r1_id}.schedule_anchor_utc == 2026-08-31T08:00:00Z while visit_weekday is 1, the previous Monday"
            - "Route.${r1_id}.visit_weekday == 5 after the update"
            - "Route.${r1_id}.schedule_anchor_utc == 2026-09-04T08:00:00Z, the latest Friday 08:00:00Z strictly before the clock"
            - "the anchor is not 2026-09-07T08:00:00Z, which is after the logical clock"

      - name: endpoint_cross_reference_pledge_requires_existing_account
        claim_type: cross_reference_link
        grounds: ["endpoints[POST /retail/product-orders/{id}/pledges]", "errors[ERR_ACCOUNT_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A pledge names its CreditAccount in the body, and body-referenced ids are validated after path ids: an unknown credit_account_id on an otherwise valid DRAFT order returns ERR_ACCOUNT_NOT_FOUND 404 and creates no SharePledge."
        test_recipe:
          setup: ["Franchisee F CERTIFIED; route R1 IN_SERVICE; product P1 at cost 30000; a DRAFT replenishment order for 2 x P1 under a 60000-cent ceiling"]
          setup_api_calls:
            - { call: "POST /retail/franchisees", payload: { legal_name: "Route 3337 Franchising LLC" }, as: PlatformAdmin, captures: { f_id: "$.data.id" } }
