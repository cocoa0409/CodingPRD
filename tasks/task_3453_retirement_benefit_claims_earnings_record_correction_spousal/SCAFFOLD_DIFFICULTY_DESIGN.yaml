  - name: begin_recovery_gated_on_claim_entitled
    grounds:
    - state_machines.OverpaymentCase.NOTIFIED_to_RECOVERY_ACTIVE
    - validations[priority=6]
    - errors[ERR_INVALID_STATE]
    distinguishing_aspect: 'OverpaymentCase.begin-recovery depends on a DIFFERENT entity pair (OverpaymentCase->BenefitClaim): recovery may only
      start while the claim is ENTITLED. Against a FILED claim it fails with ERR_INVALID_STATE even when the 30-day waiver window has lapsed;
      after the claim is approved the identical call succeeds.'
    test_recipe:
      setup:
      - 'Worker wo: born 1964-06, 5 earnings years; RETIREMENT claim FILED (never approved) at first'
      - Overpayment case for 12000 on that claim, notice issued at default clock 2026-09-01
      setup_api_calls:
