            - call: "POST /resilience/bias/${bia_id}/decide"
              payload: { decision: "APPROVE" }
              as: RiskCommittee
              as_user_id: "${c1_id}"
            - call: "POST /resilience/plans"
              payload: { process_id: "${p_id}", title: "CP", version_no: 1, strategy_type: "WARM_SITE", rto_committed_hours: 8, rpo_committed_hours: 2 }
              as: PlanAuthor
              as_user_id: "${c2_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /resilience/plans/${plan_id}/sections"
