          assert:
            - "${phys} == 1000 and ${inb} == 500 and ${fwd} == 300 and ${spot} == 200"
            - "${expo} == 1200 (1000 + 500 - 300 - 200)"
            - "${val} == 840000 (1200 x 700)"

