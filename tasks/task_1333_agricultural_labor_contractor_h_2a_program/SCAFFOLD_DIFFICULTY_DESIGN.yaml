      - name: recruitment_cutoff_on_date_blocked_next_day_allowed
        grounds:
          - calculations.recruitment_window
          - errors[ERR_DOMESTIC_PREFERENCE_VIOLATION]
          - state_machines.DomesticApplication.APPLIED_to_REJECTED
        distinguishing_aspect: |
          Date boundary on the 50% preference window (different metric than the
          consular count, different endpoint): applied_on == cutoff 2026-09-25
          is INCLUSIVE (REJECT of QUALIFIED blocked, 422), while applied_on ==
          2026-09-26 is outside (REJECT of QUALIFIED succeeds).
        test_recipe:
          setup:
            - "J1 RECRUITING; clock 2026-09-25 (== recruitment_cutoff_date for a 50-day period starting 2026-09-01)"
            - "APP_IN applied on 2026-09-25; APP_OUT applied on 2026-09-26"
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1850, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd1: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd1}", title: "Fall lettuce", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo1: $.data.id } }
            - { call: "POST /h2a/job-orders/${jo1}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/certify", payload: {}, as: ProgramReviewer }
            - { call: "POST /h2a/job-orders/${jo1}/begin-recruitment", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-09-25T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/domestic-applications", payload: { applicant_name: "In Window", contact_phone: "555-0101" }, as: ContractorAdmin, captures: { app_in: $.data.id } }
            - { call: "POST /h2a/_clock/set_current_utc", payload: { to_iso8601: "2026-09-26T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /h2a/job-orders/${jo1}/domestic-applications", payload: { applicant_name: "Out Window", contact_phone: "555-0102" }, as: ContractorAdmin, captures: { app_out: $.data.id } }
          trigger:
            - { call: "POST /h2a/domestic-applications/${app_in}/decide", payload: { decision: "REJECT", qualification: "QUALIFIED" }, as: ContractorAdmin, captures: { in_err: $.data.error_id } }
            - { call: "POST /h2a/domestic-applications/${app_out}/decide", payload: { decision: "REJECT", qualification: "QUALIFIED" }, as: ContractorAdmin, captures: { out_status: $.data.status } }
          assert:
            - "APP_IN (applied_on == cutoff): 422 with error_id == ERR_DOMESTIC_PREFERENCE_VIOLATION — the cutoff date itself is still inside the window (<= inclusive)"
            - "APP_IN status remains APPLIED"
            - "APP_OUT (applied_on == cutoff + 1 day): 200 with status == REJECTED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_create_requires_worker_visa_issued
        grounds:
          - state_machines.WorkerAssignment.transitions
          - state_machines.Worker.PETITIONED_to_VISA_ISSUED
          - errors[ERR_WORKER_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair WorkerAssignment -> Worker: creating the assignment is
          gated on the WORKER's state (must be VISA_ISSUED); a merely
          PETITIONED worker (petition approved, consular step never completed)
          is rejected with ERR_WORKER_INVALID_STATE.
        test_recipe:
          setup:
            - "J1 ACTIVE; petition RCPT-1 APPROVED with W_A and W_B linked; W_A completed consular ISSUED (VISA_ISSUED); W_B still PETITIONED"
          setup_api_calls:
            - { call: "POST /h2a/growers", payload: { legal_name: "Green Acres LLC", fein: "12-3456789", state_code: "CA" }, as: ContractorAdmin, captures: { g1: $.data.id } }
