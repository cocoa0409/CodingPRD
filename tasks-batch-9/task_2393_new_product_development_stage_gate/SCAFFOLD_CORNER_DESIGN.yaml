            - "the first reverse lookup returns total_count 1 with the single row ${gq_d2_id}"
            - "the second reverse lookup returns total_count 1 with the single row ${gq_d3_id}"
            - "Deliverable.${gq_d1_id}.prerequisite_deliverable_id is null, so the chain has a root"
            - "all three rows are still PENDING, so linking is not a transition"

  # ------------------------------------------------------ State machines ----
  - section: state_machines
    instances:
      - name: sm_new_gate_review_starts_scheduled
        claim_type: initial_state
        grounds:
          - state_machines.GateReview.initial_state
          - endpoints[POST /innovation-projects/{id}/gate-reviews]
        distinguishing_aspect: |
          A freshly booked review is SCHEDULED with every computed field at its zero value and
          chair_user_id still null, because the chair is only stamped at close.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 with an empty checklist and one screened SNACK project."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { i_g2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-i1"
              captures: { i_p_id: $.data.id }
            - call: "POST /innovation-projects/${i_p_id}/screen"
              payload: { screening_notes: "Into stage 2." }
              as: GateChair
              as_user_id: "chair-i1"
          trigger:
            - call: "POST /innovation-projects/${i_p_id}/gate-reviews"
              payload: { gate_id: "${i_g2_id}", scheduled_at: "2026-08-12T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-i1"
              captures: { i_gr_id: $.data.id }
          assert:
            - "the response code is 201 and GateReview.${i_gr_id}.status == SCHEDULED"
            - "GateReview.${i_gr_id}.decision is null and closed_at is null and chair_user_id is null"
            - "GateReview.${i_gr_id}.vote_count == 0 and deliverable_completeness_pct == 0.00 and readiness_index == 0.00"
            - "GateReview.${i_gr_id}.conditions is null and conditions_due_at is null"
            - "InnovationProject.${i_p_id}.dev_status == SCREENED, unchanged by booking a review"

      - name: sm_screen_pass_creates_checklist_in_declared_order
        claim_type: side_effect_execution
        grounds:
          - state_machines.InnovationProject.dev_status.IDEA_to_SCREENED
          - calculations.deliverable_completeness_pct.DELIVERABLE_OWNER_MAP
        distinguishing_aspect: |
          Screening is not just a status flip: it materialises one PENDING Deliverable per entry of
          the gate-2 required list, in array order, with owner_function read from
          DELIVERABLE_OWNER_MAP rather than from the caller.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 requiring a concept test, a preliminary business case and a pilot report."
            - "One SNACK LINE_EXTENSION project in dev_status IDEA scoring above the floor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["CONSUMER_CONCEPT_TEST", "PRELIM_BUSINESS_CASE", "PILOT_SCALE_UP_REPORT"], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { cl_g2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-cl"
              captures: { cl_p_id: $.data.id }
          trigger:
            - call: "POST /innovation-projects/${cl_p_id}/screen"
              payload: { screening_notes: "Strong fit with the better-for-you platform." }
              as: GateChair
              as_user_id: "chair-cl"
            - call: "GET /deliverables?project_id=${cl_p_id}&gate_id=${cl_g2_id}"
              as: GateChair
          assert:
            - "InnovationProject.${cl_p_id}.screening_score == 79.00 with screening_decision PASSED and dev_status SCREENED"
            - "InnovationProject.${cl_p_id}.next_gate_number == 2, unchanged by screening"
            - "the list returns total_count 3 ordered CONSUMER_CONCEPT_TEST, PRELIM_BUSINESS_CASE, PILOT_SCALE_UP_REPORT"
            - "the three owner_function values are MARKETING, FINANCE and R_AND_D in that same order"
            - "every row has status PENDING, submission_count 0, evidence_url null and gate_id ${cl_g2_id}"

      - name: sm_conditional_pass_cleared_before_due_unblocks_next_gate
        claim_type: valid_transition
        grounds:
          - state_machines.GateReview.CONDITIONAL_PASS_to_PASSED
          - state_machines.GateReview.SCHEDULED_to_IN_SESSION
          - entities.InnovationProject.fields.open_gate_conditions
        distinguishing_aspect: |
          Clearing conditions inside the due window rewrites the decision to PASSED and drops the
          project's open_gate_conditions latch, which is the only thing that lets the stage-3
          review open; the stage advance itself already happened at the conditional close.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "SNACK gates 2 and 3, both with empty checklists, quorum 1 and no veto functions."
