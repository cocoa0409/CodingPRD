          - "validations[priority=3]"
        distinguishing_aspect: "Booking with a slot_id that does not exist -> ERR_SLOT_NOT_FOUND (404); existence (priority 3) fires before the OCC check (priority 5)."
        test_recipe:
          setup: ["A donor and a real slot exist; book against a DIFFERENT nonexistent slot id while passing the real slot's version (existence check fires first)."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "NoSlot Donor", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-02T08:00:00.000Z", ends_at: "2025-01-02T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { real_slot_v: $.data.version }
          trigger:
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "11111111-1111-4111-8111-111111111111", expected_slot_version: "${real_slot_v}" }
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_SLOT_NOT_FOUND (existence check on slot_id precedes the OCC version check)"

      - name: donor_second_open_appointment_returns_has_open_appointment
        claim_type: violation_to_error
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_DONOR_HAS_OPEN_APPOINTMENT]"
        distinguishing_aspect: "A donor with a SCHEDULED appointment booking a second slot -> ERR_DONOR_HAS_OPEN_APPOINTMENT (409)."
        test_recipe:
          setup: ["A donor already holds one SCHEDULED appointment; book a second different slot."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Two Appts", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-02T08:00:00.000Z", ends_at: "2025-01-02T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { s1: $.data.id, s1v: $.data.version }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-03T08:00:00.000Z", ends_at: "2025-01-03T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { s2: $.data.id, s2v: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${s1}", expected_slot_version: "${s1v}" }
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${s2}", expected_slot_version: "${s2v}" }
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DONOR_HAS_OPEN_APPOINTMENT"

      - name: collect_without_passing_screening_returns_screening_not_passed
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_SCREENING_NOT_PASSED]"
        distinguishing_aspect: "Recording a collection on a CHECKED_IN appointment that has only a FAILED screening -> ERR_SCREENING_NOT_PASSED (409)."
        test_recipe:
          setup: ["A CHECKED_IN appointment whose only screening FAILED (underweight)."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Fail Screen", date_of_birth: "1990-01-01", weight_kg: 48, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${sid}", expected_slot_version: "${sv}" }
              as: IntakeNurse
              captures: { aid: $.data.id }
            - call: "POST /blood-bank/appointments/${aid}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${aid}", hemoglobin_g_dl: 14.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 48, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
              captures: { outcome: $.data.outcome }
          trigger:
            - call: "POST /blood-bank/appointments/${aid}/donations"
              payload: { volume_ml: 450 }
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "the screening outcome was FAIL (UNDERWEIGHT) and no auto-deferral fired"
            - "response error_id == ERR_SCREENING_NOT_PASSED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_correct_slot_version_books_successfully
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[slot-book-stale-version]"
          - entities.AppointmentSlot.fields.booked_count
        distinguishing_aspect: "Booking with expected_slot_version equal to the slot's current version succeeds (201) and bumps slot.version by 1."
        test_recipe:
          setup: ["A fresh slot at version 1; book with expected_slot_version 1."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "OCC OK", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-02T08:00:00.000Z", ends_at: "2025-01-02T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv: $.data.version }
          trigger:
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${sid}", expected_slot_version: "${sv}" }
              as: IntakeNurse
              captures: { aid: $.data.id, astatus: $.data.status }
            - call: "GET /blood-bank/slots/${sid}"
              payload: {}
              as: IntakeNurse
              captures: { sv_after: $.data.version, booked: $.data.booked_count }
          assert:
            - "Appointment.status == SCHEDULED (201 booking)"
            - "AppointmentSlot.${sid}.version == 2 (was 1, bumped by 1) and booked_count == 1"

      - name: occ_stale_slot_version_rejected_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[slot-book-stale-version]"
          - "errors[ERR_STALE_SLOT_VERSION]"
        distinguishing_aspect: "A second booking still carrying the pre-first-booking slot version (stale) -> ERR_STALE_SLOT_VERSION (412); two strictly sequential requests."
        test_recipe:
          setup: ["Slot at version 1. Donor A books (version -> 2). Donor B books still passing the captured version-1 value."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Donor A", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { da: $.data.id }
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Donor B", date_of_birth: "1991-01-01", weight_kg: 70, blood_type: "A_POS" }
              as: IntakeNurse
              captures: { db: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-02T08:00:00.000Z", ends_at: "2025-01-02T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv_stale: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${da}", slot_id: "${sid}", expected_slot_version: "${sv_stale}" }
              as: IntakeNurse
          trigger:
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${db}", slot_id: "${sid}", expected_slot_version: "${sv_stale}" }
              as: IntakeNurse
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_SLOT_VERSION"
            - "HTTP status == 412 (captured slot version is now stale after Donor A's booking)"

      - name: inventory_derived_count_reconciles_after_release
        claim_type: derived_field_reconciliation
        grounds: [calculations.inventory_recount, entities.InventoryBucket.fields.available_count]
        distinguishing_aspect: "After a NEGATIVE test releases one RBC unit, the (O_POS, RBC) bucket's available_count reconciles to exactly 1 via live recount."
        test_recipe:
          setup: ["One O_POS/RBC unit released to AVAILABLE; create the bucket and read its count."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Recon Donor", date_of_birth: "1985-01-01", weight_kg: 75, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${sid}", expected_slot_version: "${sv}" }
              as: IntakeNurse
              captures: { aid: $.data.id }
            - call: "POST /blood-bank/appointments/${aid}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${aid}", hemoglobin_g_dl: 14.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 75, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${aid}/donations"
              payload: { volume_ml: 450 }
              as: IntakeNurse
              captures: { donid: $.data.id }
            - call: "POST /blood-bank/blood-units"
              payload: { donation_id: "${donid}", component: "RBC", din: "DIN-REC-9" }
              as: LabTechnician
            - call: "POST /blood-bank/donations/${donid}/test-results"
              payload: { panel_outcome: "NEGATIVE" }
              as: LabTechnician
            - call: "POST /blood-bank/inventory-buckets"
              payload: { center_id: "${cid}", blood_type: "O_POS", component: "RBC" }
              as: InventoryManager
              captures: { bid: $.data.id }
          trigger:
            - call: "GET /blood-bank/inventory-buckets/${bid}"
              payload: {}
              as: InventoryManager
              captures: { avail: $.data.available_count }
          assert:
            - "InventoryBucket.${bid}.available_count == 1 (live recount over BloodUnit rows)"

      - name: available_unit_auto_expires_on_clock_sweep
        claim_type: scheduled_actions
        grounds: [state_machines.BloodUnit.AVAILABLE_to_EXPIRED, calculations.unit_expiry]
        distinguishing_aspect: "An AVAILABLE WHOLE_BLOOD unit (shelf 35d from 2025-01-01 collection -> expires 2025-02-05) is swept to EXPIRED when the clock advances to 2025-02-05 (>=)."
        test_recipe:
          setup: ["A released WHOLE_BLOOD unit collected 2025-01-01; advance clock to 2025-02-05."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Whole Donor", date_of_birth: "1985-01-01", weight_kg: 75, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
            - call: "POST /blood-bank/slots"
              payload: { center_id: "${cid}", donation_type: "WHOLE", starts_at: "2025-01-01T08:00:00.000Z", ends_at: "2025-01-01T18:00:00.000Z", capacity: 5 }
              as: CenterAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /blood-bank/appointments"
              payload: { donor_id: "${did}", slot_id: "${sid}", expected_slot_version: "${sv}" }
              as: IntakeNurse
              captures: { aid: $.data.id }
            - call: "POST /blood-bank/appointments/${aid}/check-in"
              payload: {}
              as: IntakeNurse
            - call: "POST /blood-bank/health-screenings"
              payload: { appointment_id: "${aid}", hemoglobin_g_dl: 14.0, systolic_bp: 120, pulse_bpm: 70, weight_kg: 75, recent_travel_risk: false, disqualifying_medication: false }
              as: IntakeNurse
            - call: "POST /blood-bank/appointments/${aid}/donations"
              payload: { volume_ml: 450 }
              as: IntakeNurse
              captures: { donid: $.data.id }
            - call: "POST /blood-bank/blood-units"
              payload: { donation_id: "${donid}", component: "WHOLE_BLOOD", din: "DIN-WB-001" }
              as: LabTechnician
              captures: { uid: $.data.id }
            - call: "POST /blood-bank/donations/${donid}/test-results"
              payload: { panel_outcome: "NEGATIVE" }
              as: LabTechnician
          trigger:
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-02-05T00:00:00.000Z" }
              as: CenterAdmin
            - call: "GET /blood-bank/blood-units/${uid}"
              payload: {}
              as: InventoryManager
              captures: { ustatus: $.data.status }
          assert:
            - "BloodUnit.${uid}.status == EXPIRED (current_utc 2025-02-05 >= expires_at 2025-02-05)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_eligibility_after_deferral
        claim_type: immediate
        grounds: [entities.Donor.fields.eligibility_status, state_machines.Deferral]
        distinguishing_aspect: "Raising a deferral immediately flips the donor's eligibility_status in the same request's response (immediate consistency)."
        test_recipe:
          setup: ["An ELIGIBLE donor."]
          setup_api_calls:
            - call: "POST /blood-bank/centers"
              payload: { name: "Metro Blood", region_code: "US-CA" }
              as: CenterAdmin
              captures: { cid: $.data.id }
            - call: "POST /blood-bank/centers/${cid}/clock/advance"
              payload: { to_iso8601: "2025-01-01T00:00:00.000Z" }
              as: CenterAdmin
            - call: "POST /blood-bank/donors"
              payload: { center_id: "${cid}", full_name: "Imm Donor", date_of_birth: "1990-01-01", weight_kg: 70, blood_type: "O_POS" }
              as: IntakeNurse
              captures: { did: $.data.id }
          trigger:
            - call: "POST /blood-bank/deferrals"
              payload: { donor_id: "${did}", category: "HEMOGLOBIN", kind: "TEMPORARY", reason: "low iron", duration_days: 90 }
              as: IntakeNurse
            - call: "GET /blood-bank/donors/${did}"
              payload: {}
              as: IntakeNurse
              captures: { elig: $.data.eligibility_status }
          assert:
            - "Donor.${did}.eligibility_status == TEMP_DEFERRED immediately after the deferral request"

  # ===========================================================================
  # excluded_because stubs — corners already covered by a §1.8 instance
  # ===========================================================================
  - section: state_machines
    instances:
      - name: donation_release_units_become_available_negative_test
        claim_type: Side Effect Execution
        grounds: [state_machines.Donation.COLLECTED_to_RELEASABLE, state_machines.BloodUnit.QUARANTINED_to_AVAILABLE]
        excluded_because:
          difficulty_instance: dual_variant_calc / unit_expiry_collection_anchored_vs_release_anchored
          rationale: "The NEGATIVE-test release path (donation RELEASABLE, units AVAILABLE, platelet release-anchored expiry) is exercised end-to-end by that §1.8 instance."

      - name: recall_cascade_units_recalled_and_inventory_decremented
        claim_type: Cross-entity
        grounds: [state_machines.RecallEvent.OPEN_to_CLOSED, state_machines.BloodUnit.AVAILABLE_to_RECALLED]
        excluded_because:
          difficulty_instance: transitive_cascade / recall_cascade_donation_unit_inventory_deferral_depth4
          rationale: "Recall cascade donation->unit->inventory->deferral is the subject of that §1.8 depth-4 instance."

  - section: calculations
    instances:
      - name: plasma_annual_cap_rounding_order_divergence
        claim_type: Correct Result
        grounds: [calculations.plasma_volume_cap]
        excluded_because:
          difficulty_instance: combinatorial_formula / plasma_annual_cap_round_per_collection_then_sum
          rationale: "The round-then-sum vs sum-then-round divergence and the cap rejection are asserted by that §1.8 instance."

      - name: inter_donation_interval_boundary_exact
        claim_type: Correct Result
        grounds: [calculations.inter_donation_next_eligible_at]
        excluded_because:
          difficulty_instance: boundary_precision_check / interval_exact_56_day_boundary_checkin_inclusive
          rationale: "The exact 56-day >= boundary at check-in is asserted by that §1.8 instance."

  - section: validations
    instances:
      - name: checkin_priority_state_over_eligibility
        claim_type: Priority Ordering
        grounds:
          - "validations[priority=6]"
          - "validations[priority=7]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / checkin_state_before_eligibility
          rationale: "The state-vs-business_safety priority resolution at check-in is the subject of that §1.8 instance."
