# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2508_certified_pre_owned_program_inspection_certification
#
# Breadth probe over SCAFFOLD.yaml 1.1-1.7. Sections and claim_type values come
# from references/claim-extraction-guide.md; nothing else is invented.
#
# Shared conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * The logical clock reads 2026-08-01T00:00:00Z before any call; instances
#     that need another instant call POST /cpo/_clock/set_current_utc first.
#   * Canonical template MPI-172 carries three points:
#       P1 POWERTRAIN CRITICAL reconditioning_allowed false
#       S1 SAFETY     CRITICAL reconditioning_allowed true  (cap 200000)
#       B1 BRAKES     MAJOR    measured 4.0..12.0, reconditioning_allowed true (cap 100000)
#     so point_count == 3 and critical_item_count == 2.
#   * A clean attempt is [{P1 PASS}, {S1 PASS}, {B1 PASS measured_value 8.0}].
#   * Canonical vehicle V1: in_service_date 2022-02-01, odometer 62000,
#     inspected 2026-07-31T09:00:00Z at 62000 miles, approved 2026-08-01 ->
#     fee_charged_cents 120400, coverage [2026-08-01, 2027-08-01),
#     warranty_end_miles 74000, retention_expires_at 2034-08-01.
#   * Bogus ids are literal UUIDs of the form
#     00000000-0000-4000-8000-0000000000NN that no call ever mints.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: dealer_creation_returns_declared_and_default_fields
        claim_type: creation
        grounds:
          - entities.Dealer
          - entities.Dealer.fields.privilege_status
          - entities.Dealer.fields.privilege_reason
          - endpoints[POST /cpo/dealers]
        distinguishing_aspect: |
          A dealer created with only the three input fields comes back 201 carrying every declared
          system and computed field at its declared default in one response: privilege_status ACTIVE,
          privilege_reason null, all eleven counters 0, claim_ratio_variant LIFETIME_CUMULATIVE and
          version 1. Nothing here depends on any other entity, so a failure isolates entity
          materialisation from the pipeline.
        test_recipe:
          setup:
            - "Empty database; the clock stands at its 2026-08-01T00:00:00Z default."
          setup_api_calls: []
          trigger:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
          assert:
            - "response code is 201 and response_type is object"
            - "Dealer.${d1}.name == Coast Motors, franchise_code == FR-1001, region_code == WEST"
            - "Dealer.${d1}.privilege_status == ACTIVE and privilege_reason == null"
            - "Dealer.${d1}.lifetime_submitted_count == 0, lifetime_activated_count == 0, window_activated_count == 0, active_certification_count == 0"
            - "Dealer.${d1}.approved_claim_count_lifetime == 0, approved_claim_count_window == 0, audit_sample_count == 0, audit_fail_count == 0"
            - "Dealer.${d1}.claim_ratio_variant == LIFETIME_CUMULATIVE, claim_ratio_effective == 0.00, audit_fail_rate == 0.00, risk_score == 0"
            - "Dealer.${d1}.fee_billed_cents_total == 0, fee_credited_cents_total == 0, fee_balance_cents == 0"
            - "Dealer.${d1}.version == 1 and id is a bare UUID with no type prefix"

      - name: program_config_retrieval_returns_declared_defaults
        claim_type: retrieval
        grounds:
          - entities.ProgramConfig
          - endpoints[GET /cpo/program-config]
        distinguishing_aspect: |
          The singleton ProgramConfig is readable before anything else exists and reports the exact
          declared defaults every calculation is keyed on. Any drift in a tunable silently rewrites
          fees, coverage and thresholds everywhere, so this is the one read that pins them all.
        test_recipe:
          setup:
            - "Empty database; no PUT /cpo/program-config has ever been issued."
          setup_api_calls: []
          trigger:
            - call: "GET /cpo/program-config"
              payload: {}
              as: ProgramAuditor
          assert:
            - "response code is 200"
            - "ProgramConfig.max_age_days == 2190 and max_odometer_miles == 80000"
            - "ProgramConfig.base_fee_cents == 89900, age_surcharge_free_years == 3, age_surcharge_cents_per_year == 12500"
            - "ProgramConfig.mileage_surcharge_free_miles == 40000, mileage_surcharge_cents_per_10k == 9000, surcharge_cap_pct == 0.35"
            - "ProgramConfig.volume_discount_tiers == [{min_count 0, pct 0.00}, {min_count 10, pct 0.05}, {min_count 50, pct 0.10}]"
            - "ProgramConfig.factory_basic_months == 36, factory_basic_miles == 36000, warranty_extension_months == 12, warranty_extension_miles == 12000"
            - "ProgramConfig.warranty_total_cap_months == 84, warranty_total_cap_miles == 100000, doc_retention_years == 7"
            - "ProgramConfig.claim_ratio_probation_threshold == 0.25, claim_ratio_suspension_threshold == 0.40, probation_claim_share == 0.80"
            - "ProgramConfig.audit_sample_pct == 0.20, audit_sample_min_per_run == 1, audit_fail_suspension_count == 2"
            - "ProgramConfig.inspection_slot_minutes == 120, technician_buffer_minutes == 30, listing_removal_sla_hours == 48"
            - "ProgramConfig.ineligible_title_brands contains SALVAGE, FLOOD, LEMON, REBUILT, ODOMETER_DISCREPANCY and does not contain CLEAN"
            - "ProgramConfig.version == 1"

      - name: checklist_items_listing_filters_and_paginates
        claim_type: listing
        grounds:
          - entities.ChecklistItem
          - endpoints[GET /cpo/checklist-templates/{id}/items]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          The item list honours category and severity filters and limit/offset independently over the
          same three rows: unfiltered reports total_count 3, severity CRITICAL reports 2, category
          BRAKES reports 1, and limit 2 offset 2 returns a single row with has_more false. Filter and
          pagination are computed against the filtered set, not the raw table.
        test_recipe:
          setup:
            - "One DRAFT template MPI-172 carrying the three canonical points; no inspection exists."
          setup_api_calls:
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "S1", category: "SAFETY", severity: "CRITICAL", pass_criteria: "all airbag and restraint systems nominal", reconditioning_allowed: true, max_reconditioning_cost_cents: 200000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "B1", category: "BRAKES", severity: "MAJOR", pass_criteria: "pad thickness within 4.0..12.0 mm", min_measure: 4.0, max_measure: 12.0, reconditioning_allowed: true, max_reconditioning_cost_cents: 100000 }
              as: ProgramAdministrator
          trigger:
            - call: "GET /cpo/checklist-templates/${tpl}/items"
              payload: {}
              as: ProgramAuditor
            - call: "GET /cpo/checklist-templates/${tpl}/items"
              payload: { severity: "CRITICAL" }
              as: ProgramAuditor
            - call: "GET /cpo/checklist-templates/${tpl}/items"
              payload: { category: "BRAKES" }
              as: ProgramAuditor
            - call: "GET /cpo/checklist-templates/${tpl}/items"
              payload: { limit: 2, offset: 2 }
              as: ProgramAuditor
          assert:
            - "trigger call 1 returns 200, response_type array, 3 rows, total_count == 3, has_more == false"
            - "trigger call 2 returns exactly the P1 and S1 rows with total_count == 2"
            - "trigger call 3 returns exactly the B1 row with total_count == 1 and its min_measure == 4.0, max_measure == 12.0"
            - "trigger call 4 returns 1 row with limit == 2, offset == 2, total_count == 3, has_more == false"
            - "GET /cpo/checklist-templates/${tpl} reports point_count == 3 and critical_item_count == 2"

      - name: path_segment_not_found_errors_across_resources
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_DEALER_NOT_FOUND]
          - errors[ERR_VEHICLE_NOT_FOUND]
          - errors[ERR_TEMPLATE_NOT_FOUND]
          - errors[ERR_INSPECTION_NOT_FOUND]
          - errors[ERR_RECONDITIONING_ITEM_NOT_FOUND]
          - errors[ERR_CERTIFICATION_NOT_FOUND]
          - errors[ERR_AUDIT_SAMPLE_NOT_FOUND]
          - errors[ERR_LISTING_NOT_FOUND]
          - errors[ERR_CLAIM_NOT_FOUND]
          - errors[ERR_COMPLAINT_NOT_FOUND]
        distinguishing_aspect: |
          Every one of the ten path-segment 404s is reachable from an empty database with a
          syntactically valid UUID, and each names its own resource rather than a generic
          ERR_NOT_FOUND. Validation priority 5 sits above the priority 8 state checks and the
          priority 9 OCC check, so the syndicate and adjudicate calls 404 on the missing path
          resource even though their bodies are otherwise complete.
        test_recipe:
          setup:
            - "Empty database; no dealer, vehicle, template, inspection, certification, listing, claim, complaint or audit sample exists."
          setup_api_calls: []
          trigger:
            - call: "GET /cpo/dealers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramAdministrator
              captures: { e1: $.data.error_id }
            - call: "GET /cpo/vehicles/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ProgramAdministrator
              captures: { e2: $.data.error_id }
            - call: "GET /cpo/checklist-templates/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ProgramAdministrator
              captures: { e3: $.data.error_id }
            - call: "GET /cpo/inspections/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ProgramAdministrator
              captures: { e4: $.data.error_id }
            - call: "POST /cpo/reconditioning-items/00000000-0000-4000-8000-000000000005/complete"
              payload: { resolution: "WAIVED", waiver_reason: "cosmetic only" }
              as: ProgramAdministrator
              captures: { e5: $.data.error_id }
            - call: "GET /cpo/certifications/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ProgramAdministrator
              captures: { e6: $.data.error_id }
            - call: "POST /cpo/audit-samples/00000000-0000-4000-8000-000000000007/finding"
              payload: { finding: "PASS" }
              as: ProgramAuditor
              captures: { e7: $.data.error_id }
            - call: "POST /cpo/listings/00000000-0000-4000-8000-000000000008/syndicate"
              payload: { expected_certification_version: "${e1}" }
              as: DealerPrincipal
              as_user_id: "00000000-0000-4000-8000-000000000001"
              captures: { e8: $.data.error_id }
            - call: "POST /cpo/warranty-claims/00000000-0000-4000-8000-000000000009/adjudicate"
              payload: { decision: "DENY", denial_reason: "INSUFFICIENT_EVIDENCE" }
              as: ProgramAdministrator
              captures: { e9: $.data.error_id }
            - call: "GET /cpo/complaints/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: CustomerAdvocate
              captures: { e10: $.data.error_id }
          assert:
            - "trigger call 1 returns 404 ERR_DEALER_NOT_FOUND"
            - "trigger call 2 returns 404 ERR_VEHICLE_NOT_FOUND"
            - "trigger call 3 returns 404 ERR_TEMPLATE_NOT_FOUND"
            - "trigger call 4 returns 404 ERR_INSPECTION_NOT_FOUND"
            - "trigger call 5 returns 404 ERR_RECONDITIONING_ITEM_NOT_FOUND"
            - "trigger call 6 returns 404 ERR_CERTIFICATION_NOT_FOUND"
            - "trigger call 7 returns 404 ERR_AUDIT_SAMPLE_NOT_FOUND"
            - "trigger call 8 returns 403 ERR_IDENTITY_NOT_RECOGNIZED because validation priority 3 outranks priority 5: the acting DealerPrincipal id does not resolve either, and no listing is ever touched"
            - "trigger call 9 returns 404 ERR_CLAIM_NOT_FOUND"
            - "trigger call 10 returns 404 ERR_COMPLAINT_NOT_FOUND"
            - "no row of any entity exists after the ten calls"

      - name: listing_syndicate_on_missing_listing_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=5]
          - errors[ERR_LISTING_NOT_FOUND]
          - endpoints[POST /cpo/listings/{id}/syndicate]
        distinguishing_aspect: |
          ERR_LISTING_NOT_FOUND needs a recognised DealerPrincipal identity to get past validation
          priority 3, so it is unreachable from a truly empty database: with a real dealer acting and
          a bogus listing id, priority 5 fires before the priority 9 OCC guard even though
          expected_certification_version is deliberately nonsense.
        test_recipe:
          setup:
            - "One dealer D1 exists; no listing exists."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "GET /cpo/dealers/${d1}"
              payload: {}
              as: ProgramAdministrator
              captures: { d1_ver: $.data.version }
          trigger:
            - call: "POST /cpo/listings/00000000-0000-4000-8000-000000000008/syndicate"
              payload: { expected_certification_version: "${d1_ver}" }
              as: DealerPrincipal
              as_user_id: "${d1}"
          assert:
            - "returns 404 ERR_LISTING_NOT_FOUND"
            - "the response carries no version-conflict information: priority 5 short-circuits before the OCC comparison"

      - name: vehicle_creation_missing_prior_use_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Vehicle.fields.prior_use
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /cpo/vehicles]
        distinguishing_aspect: |
          prior_use is the one Vehicle input with no declared default, so omitting it is a schema
          violation rather than a defaulted create; the request is refused at priority 4 before any
          eligibility rule looks at title_brand, and no Vehicle row is minted.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", owner_count: 1 }
              as: ProgramAdministrator
          assert:
            - "returns 400 ERR_INVALID_REQUEST naming prior_use"
            - "no Vehicle row exists afterwards"

      - name: technician_and_checklist_item_defaults_applied
        claim_type: defaults
        grounds:
          - entities.Technician.fields.credential_status
          - entities.ChecklistItem.fields.min_measure
          - entities.ChecklistItem.fields.max_measure
          - entities.ChecklistItem.fields.max_reconditioning_cost_cents
          - entities.ChecklistItem.fields.reconditioning_allowed
        distinguishing_aspect: |
          Omitting the optional inputs yields the declared defaults rather than nulls: a technician
          created without credential_status is ACTIVE, and an item created without measures is
          unmeasured (min_measure and max_measure null) with max_reconditioning_cost_cents 100000.
          The unmeasured item is what makes a PASS with no measured_value legal later.
        test_recipe:
          setup:
            - "One dealer D1 and one DRAFT template."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
          trigger:
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
              captures: { it1: $.data.id }
          assert:
            - "Technician.${t1}.credential_status == ACTIVE and completed_inspection_count == 0"
            - "Technician.${t1}.dealer_id == ${d1}, taken from the path segment and not from the body"
            - "ChecklistItem.${it1}.min_measure == null and max_measure == null"
            - "ChecklistItem.${it1}.max_reconditioning_cost_cents == 100000"
            - "ChecklistItem.${it1}.reconditioning_allowed == false as supplied, so the default true was not force-applied"

      - name: dealer_counters_recomputed_from_pipeline_activity
        claim_type: computed_fields
        grounds:
          - entities.Dealer.fields.lifetime_submitted_count
          - entities.Dealer.fields.active_certification_count
          - entities.Dealer.fields.fee_billed_cents_total
          - entities.Dealer.fields.fee_balance_cents
          - entities.Certification.fields.certification_number
        distinguishing_aspect: |
          Dealer's computed counters are derived, never written: one submission moves
          lifetime_submitted_count to 1 and active_certification_count to 1 while
          lifetime_activated_count stays 0, and only the approval moves lifetime_activated_count to 1
          and bills 120400 into fee_billed_cents_total. certification_number is minted from the
          post-increment submitted count, so it reads CPO-FR-1001-0001.
        test_recipe:
          setup:
            - "Dealer D1 (franchise_code FR-1001) with technician T1, published MPI-172 and canonical vehicle V1."
            - "V1 carries a PASSED inspection; the clock is at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "S1", category: "SAFETY", severity: "CRITICAL", pass_criteria: "all airbag and restraint systems nominal", reconditioning_allowed: true, max_reconditioning_cost_cents: 200000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "B1", category: "BRAKES", severity: "MAJOR", pass_criteria: "pad thickness within 4.0..12.0 mm", min_measure: 4.0, max_measure: 12.0, reconditioning_allowed: true, max_reconditioning_cost_cents: 100000 }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/vehicles"
              payload: { vin: "1HGCM82633A000001", model_year: 2022, in_service_date: "2022-02-01", odometer_miles: 62000, title_brand: "CLEAN", prior_use: "PERSONAL", owner_count: 1 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1: $.data.id }
            - call: "POST /cpo/inspections"
              payload: { vehicle_id: "${v1}", technician_id: "${t1}", template_id: "${tpl}", started_at: "2026-07-31T09:00:00Z", odometer_at_inspection: 62000 }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { i1: $.data.id }
            - call: "PUT /cpo/inspections/${i1}/results"
              payload: { results: [{ item_code: "P1", outcome: "PASS" }, { item_code: "S1", outcome: "PASS" }, { item_code: "B1", outcome: "PASS", measured_value: 8.0 }] }
              as: InspectionTechnician
              as_user_id: "${t1}"
            - call: "POST /cpo/inspections/${i1}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
            - call: "GET /cpo/vehicles/${v1}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { v1_ver: $.data.version }
          trigger:
            - call: "POST /cpo/certifications"
              payload: { vehicle_id: "${v1}", inspection_id: "${i1}", expected_vehicle_version: "${v1_ver}", documents: [{ doc_type: "TITLE_HISTORY_REPORT", reference: "THR-1" }, { doc_type: "INSPECTION_WORKSHEET", reference: "IW-1" }, { doc_type: "CUSTOMER_DISCLOSURE", reference: "CD-1" }] }
              as: DealerPrincipal
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
            - call: "GET /cpo/dealers/${d1}"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /cpo/certifications/${c1}/approve"
              payload: { decision: "APPROVE" }
              as: ProgramAdministrator
            - call: "GET /cpo/dealers/${d1}"
              payload: {}
              as: ProgramAdministrator
          assert:
            - "Certification.${c1}.certification_number == CPO-FR-1001-0001 and status == SUBMITTED after trigger call 1"
            - "Certification.${c1}.document_count == 3 and fee_charged_cents == 0 while SUBMITTED"
            - "trigger call 2 shows Dealer.${d1}.lifetime_submitted_count == 1, active_certification_count == 1, lifetime_activated_count == 0, fee_billed_cents_total == 0"
            - "trigger call 4 shows Dealer.${d1}.lifetime_activated_count == 1, window_activated_count == 1, fee_billed_cents_total == 120400, fee_credited_cents_total == 0, fee_balance_cents == 120400"
            - "Dealer.${d1}.lifetime_submitted_count is still 1 after approval: it counts submissions, not activations"
            - "Certification.${c1}.fee_charged_cents == 120400, fee_surcharge_cents == 30500, fee_discount_cents == 0"

      - name: certification_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Certification.fields.status
          - entities.Certification.fields.certification_number
          - entities.Certification.fields.dealer_id
          - entities.Certification.fields.submitted_at
        distinguishing_aspect: |
          status, certification_number, dealer_id, submitted_at and fee_charged_cents are all
          source system or computed, so client-supplied values for them are discarded rather than
          honoured or rejected: the row still lands SUBMITTED with a server-minted
          CPO-FR-1001-0001 and dealer_id resolved from X-User-ID, not from the body.
        test_recipe:
          setup:
            - "Dealer D1 (FR-1001), technician T1, published MPI-172, canonical vehicle V1 with a PASSED inspection."
            - "A second dealer D2 (FR-1002) exists so the ignored dealer_id in the body names a real but different dealer."
          setup_api_calls:
            - call: "POST /cpo/dealers"
              payload: { name: "Coast Motors", franchise_code: "FR-1001", region_code: "WEST" }
              as: ProgramAdministrator
              captures: { d1: $.data.id }
            - call: "POST /cpo/dealers"
              payload: { name: "Summit Auto", franchise_code: "FR-1002", region_code: "EAST" }
              as: ProgramAdministrator
              captures: { d2: $.data.id }
            - call: "POST /cpo/dealers/${d1}/technicians"
              payload: { name: "Ada Tech", credential_id: "CR-1", credential_expires_at: "2027-01-01T00:00:00Z", credential_status: "ACTIVE" }
              as: ProgramAdministrator
              captures: { t1: $.data.id }
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tpl: $.data.id }
            - call: "POST /cpo/checklist-templates/${tpl}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates/${tpl}/items"
