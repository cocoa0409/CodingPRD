# §1.9 Scaffold Corner Design - task 2686 Telephone Number Administration & Pooling
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Sections and claim_type values are taken
# verbatim from references/claim-extraction-guide.md. Corners already asserted by a
# §1.8 instance carry an `excluded_because:` stub instead of a test_recipe.
# Default logical clock for every recipe: 2026-08-01T00:00:00Z.
scaffold_corner_design:
  - section: entities
    instances:
      - name: carrier_creation_stamps_default_license_and_readiness_axes
        claim_type: Creation
        grounds: ["entities.Carrier", "endpoints[POST /numbering/carriers]"]
        distinguishing_aspect: "A newly registered Carrier starts on BOTH axes at their initial states (license_status NONE, facilities_readiness_status NOT_SUBMITTED) and is therefore INELIGIBLE, so registration alone never authorizes an allocation."
        test_recipe:
          setup: ["Empty database with the logical clock pinned to 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
          assert:
            - "HTTP 201 and response_type == \"object\""
            - "Carrier.ocn == \"1234\", legal_name == \"Acme Telecom LLC\", carrier_type == \"CLEC\", home_state_code == \"OH\", months_in_operation == 24"
            - "Carrier.license_status == \"NONE\" and Carrier.license_expires_on is null"
            - "Carrier.facilities_readiness_status == \"NOT_SUBMITTED\", switch_clli is null, interconnection_ready == false"
            - "Carrier.eligibility_status == \"INELIGIBLE\", blocks_held_count == 0, reclamation_strike_count == 0, safety_valve_grant_count == 0, probation_until is null"
            - "Carrier.version == 1"

      - name: carrier_retrieval_returns_stored_row_with_eligible_status
        claim_type: Retrieval
        grounds: ["entities.Carrier.fields.eligibility_status", "endpoints[GET /numbering/carriers/{carrier_id}]"]
        distinguishing_aspect: "GET /numbering/carriers/{carrier_id} returns the same row the licensing and readiness events built, with eligibility_status ELIGIBLE computed from the two axes rather than stored by any single call."
        test_recipe:
          setup: ["Carrier A (ocn 1234) has a GRANTED licence expiring 2028-08-01T00:00:00Z and VERIFIED facilities readiness."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "ATTEST", switch_clli: "CLMBOH01DS0", interconnection_ready: true }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
            - call: "POST /numbering/carriers/${a_id}/readiness-events"
              payload: { event: "VERIFY" }
              as: NumberingAdministrator
          trigger:
            - call: "GET /numbering/carriers/${a_id}"
              payload: {}
              as: RegulatoryApprover
          assert:
            - "HTTP 200 and data.id == ${a_id}"
            - "Carrier.license_status == \"GRANTED\" and license_expires_on == \"2028-08-01T00:00:00Z\""
            - "Carrier.facilities_readiness_status == \"VERIFIED\", switch_clli == \"CLMBOH01DS0\", interconnection_ready == true"
            - "Carrier.eligibility_status == \"ELIGIBLE\""

      - name: carrier_listing_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds: ["endpoints[GET /numbering/carriers]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three carriers registered, limit 2 / offset 0 returns exactly 2 rows with total_count 3 and has_more true; offset 2 returns the remaining row with has_more false."
        test_recipe:
          setup: ["Three carriers registered in this order: ocn 1234, ocn 5678, ocn 9012."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "5678", legal_name: "Buckeye Comm Inc", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 36 }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "9012", legal_name: "Scarlet Networks LLC", carrier_type: "WIRELESS", home_state_code: "OH", months_in_operation: 60 }
              as: NumberingAdministrator
          trigger:
            - call: "GET /numbering/carriers"
              payload: { limit: 2, offset: 0 }
              as: NumberingAdministrator
            - call: "GET /numbering/carriers"
              payload: { limit: 2, offset: 2 }
              as: NumberingAdministrator
          assert:
            - "First call: HTTP 200, response_type == \"array\", len(data) == 2, meta pagination limit == 2, offset == 0, total_count == 3, has_more == true"
            - "Second call: len(data) == 1, offset == 2, total_count == 3, has_more == false"
            - "The three ocn values across both pages are exactly {\"1234\", \"5678\", \"9012\"} with no row repeated"

      - name: carrier_not_found_for_unknown_path_id
        claim_type: Not Found
        grounds: ["errors[ERR_CARRIER_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "A syntactically valid but unknown carrier id in the path returns ERR_CARRIER_NOT_FOUND with HTTP 404, not an empty 200 body."
        test_recipe:
          setup: ["No Carrier rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "GET /numbering/carriers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NumberingAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404, response_type == \"error\", data.error_id == \"ERR_CARRIER_NOT_FOUND\""

      - name: block_creation_missing_thousands_digit_returns_invalid_request
        claim_type: Required Fields
        grounds: ["endpoints[POST /numbering/blocks]", "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "thousands_digit carries no default, so omitting it from POST /numbering/blocks returns ERR_INVALID_REQUEST (400) and no NumberBlock row is created."
        test_recipe:
          setup: ["NPA 614 (OH) and rate center COLUMBUS exist; no blocks exist yet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554" }
              as: NumberingAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /numbering/rate-centers/${rc_id}/blocks returns len(data) == 0"

      - name: npa_type_defaults_to_geographic_when_omitted
        claim_type: Defaults
        grounds: ["entities.NPA.fields.npa_type", "endpoints[POST /numbering/npas]"]
        distinguishing_aspect: "Omitting npa_type on POST /numbering/npas yields npa_type GEOGRAPHIC and status ACTIVE, never OVERLAY - OVERLAY is reachable only through a relief ORDER."
        test_recipe:
          setup: ["No NPA rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
          assert:
            - "HTTP 201, NPA.npa_type == \"GEOGRAPHIC\""
            - "NPA.status == \"ACTIVE\", relief_parent_npa_id is null, jeopardy_declared_at is null, permissive_dialing_end_at is null"
            - "NPA.available_block_count == 0 and total_block_count == 0"

      - name: block_label_computed_from_npa_code_nxx_and_thousands_digit
        claim_type: Computed Fields
        grounds: ["entities.NumberBlock.fields.block_label", "endpoints[POST /numbering/blocks]"]
        distinguishing_aspect: "block_label is derived server-side as NPA-NXX-D from the parent NPA.npa_code plus the payload's nxx_code and thousands_digit, so a block loaded under NPA 614 with nxx 554 and digit 3 reads exactly \"614-554-3\"."
        test_recipe:
          setup: ["NPA 614 (OH) with rate center COLUMBUS; no blocks exist yet."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/blocks"
              payload: { npa_id: "${npa_id}", rate_center_id: "${rc_id}", nxx_code: "554", thousands_digit: 3 }
              as: NumberingAdministrator
              captures: { blk_id: "$.data.id" }
          assert:
            - "HTTP 201 and NumberBlock.block_label == \"614-554-3\""
            - "NumberBlock.allocation_status == \"POOL_AVAILABLE\" and routing_status == \"UNROUTED\""
            - "NumberBlock.holder_carrier_id is null, assigned_at is null, activation_due_at is null, activated_at is null"
            - "NumberBlock.contaminated_count == 0, is_pooling_eligible == true, npac_db_version == 0, current_lrn is null"

      - name: block_is_pooling_eligible_computed_at_contamination_ceiling
        claim_type: Computed Fields
        grounds: ["entities.NumberBlock.fields.is_pooling_eligible", "calculations.block_pool_selection.constants.CONTAMINATION_MAX_FOR_POOLING"]
        excluded_because:
          difficulty_instance: boundary_precision_check / contamination_exactly_one_hundred_stays_pooling_eligible
          rationale: "The named §1.8 instance already asserts is_pooling_eligible true at contaminated_count 100 and false at 101 on the same rate center."

      - name: carrier_system_fields_are_server_stamped_on_create
        claim_type: System Fields
        grounds: ["entities.Carrier", "response_envelope.success"]
        distinguishing_aspect: "id, created_at, updated_at and version are stamped by the server on POST /numbering/carriers even though none of them appear in the endpoint's input list, and created_at equals the logical clock rather than wall-clock time."
        test_recipe:
          setup: ["Logical clock pinned to 2026-08-01T00:00:00Z; no carriers exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/carriers"
              payload: { ocn: "5678", legal_name: "Buckeye Comm Inc", carrier_type: "CLEC", home_state_code: "OH" }
              as: NumberingAdministrator
              captures: { b_id: "$.data.id" }
          assert:
            - "HTTP 201 and data.id is a non-empty server-generated identifier"
            - "Carrier.created_at == \"2026-08-01T00:00:00Z\" and updated_at == \"2026-08-01T00:00:00Z\""
            - "Carrier.version == 1"
            - "Carrier.months_in_operation == 0 because the optional input was omitted"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: carrier_type_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.Carrier.fields.carrier_type", "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "carrier_type accepts only {ILEC, CLEC, WIRELESS, VOIP_INTERCONNECTED}; the value \"MOBILE\" is rejected with ERR_INVALID_REQUEST (400) and no Carrier row is created."
        test_recipe:
          setup: ["No carriers exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "MOBILE", home_state_code: "OH" }
              as: NumberingAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /numbering/carriers returns total_count == 0"

      - name: allocation_request_block_count_above_ten_returns_invalid_request
        claim_type: Type Constraints
        grounds: ["entities.AllocationRequest.fields.requested_block_count", "validations[priority=3]"]
        distinguishing_aspect: "requested_block_count is constrained to 1..10, and because ERR_INVALID_REQUEST sits at priority 3 the value 11 is rejected before the priority-13 eligibility gate or the priority-29 filing gate can speak."
        test_recipe:
          setup: ["Carrier A exists but is INELIGIBLE (no licence, no readiness) and has filed no utilization report; NPA 614 with rate center COLUMBUS exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "GET /numbering/rate-centers/${rc_id}"
              payload: {}
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { rc_v: "$.data.version" }
          trigger:
            - call: "POST /numbering/allocation-requests"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", request_type: "GROWTH", requested_block_count: 11, justification: "expansion", expected_rate_center_version: "${rc_v}" }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 400 and data.error_id == \"ERR_INVALID_REQUEST\" (not ERR_CARRIER_NOT_ELIGIBLE, not ERR_UTILIZATION_FILING_REQUIRED)"
            - "GET /numbering/allocation-requests with rate_center_id == ${rc_id} returns total_count == 0"
            - "RateCenter.pending_request_count remains 0"

      - name: public_comment_is_immutable_and_carries_no_version_field
        claim_type: Immutability
        grounds: ["entities.PublicComment", "endpoints[POST /numbering/relief-plans/{plan_id}/comments]"]
        distinguishing_aspect: "PublicComment declares common_fields: false, so its create response exposes id, weight and submitted_at but no version and no updated_at, and §1.5 offers no endpoint that mutates or deletes a filed comment."
        test_recipe:
          setup: ["NPA 614 has no blocks, was manually declared in JEOPARDY, and carries a PLANNING relief plan whose 30-day comment window was opened at 2026-08-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/npas/${npa_id}/jeopardy-declarations"
              payload: { reason: "Administrator projects exhaust inside eight quarters" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas/${npa_id}/relief-plans"
              payload: { planned_relief_type: "UNDETERMINED", comment_window_days: 30 }
              as: NumberingAdministrator
              captures: { plan_id: "$.data.id" }
            - call: "POST /numbering/relief-plans/${plan_id}/transitions"
              payload: { action: "OPEN_COMMENT" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/relief-plans/${plan_id}/comments"
              payload: { commenter_type: "GOVERNMENT", position: "SUPPORT_SPLIT", body: "The county opposes a second code over the same geography." }
              as: PublicCommenter
              as_user_id: "commenter-1"
              captures: { comment_id: "$.data.id" }
          assert:
            - "HTTP 201, PublicComment.weight == 3.0, position == \"SUPPORT_SPLIT\", submitted_at == \"2026-08-01T00:00:00Z\""
            - "The response body contains no `version` key and no `updated_at` key"
            - "GET /numbering/relief-plans/${plan_id}/comments returns len(data) == 1 with data[0].id == ${comment_id}"

      - name: rate_center_creation_requires_an_existing_parent_npa
        claim_type: Parent Relationships
        grounds: ["entities.RateCenter.fields.npa_id", "validations[priority=5]", "errors[ERR_NPA_NOT_FOUND]"]
        distinguishing_aspect: "A body foreign key that resolves to nothing is a priority-5 existence failure: POST /numbering/rate-centers with an unknown npa_id returns ERR_NPA_NOT_FOUND (404) rather than the priority-16 ERR_JURISDICTION_MISMATCH."
        test_recipe:
          setup: ["No NPA rows exist."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
          trigger:
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "00000000-0000-4000-8000-000000000000", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and data.error_id == \"ERR_NPA_NOT_FOUND\""
            - "GET /numbering/rate-centers returns total_count == 0"

      - name: utilization_filing_joins_two_carriers_to_one_rate_center
        claim_type: graph
        grounds: ["complexity_profile.entity_topology", "entities.UtilizationFiling.fields.carrier_id", "endpoints[GET /numbering/utilization-filings]"]
        distinguishing_aspect: "UtilizationFiling is the Carrier x RateCenter junction of the graph topology: two different carriers may each hold one 2026-H1 filing for rate center COLUMBUS, and the filtered list keyed on rate_center_id returns both without violating the per-carrier period uniqueness rule."
        test_recipe:
          setup: ["Carriers A (ocn 1234) and B (ocn 5678) are both licensed and VERIFIED; NPA 614 with rate center COLUMBUS exists."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "1234", legal_name: "Acme Telecom LLC", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 24 }
              as: NumberingAdministrator
              captures: { a_id: "$.data.id" }
            - call: "POST /numbering/carriers/${a_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
              payload: { ocn: "5678", legal_name: "Buckeye Comm Inc", carrier_type: "CLEC", home_state_code: "OH", months_in_operation: 36 }
              as: NumberingAdministrator
              captures: { b_id: "$.data.id" }
            - call: "POST /numbering/carriers/${b_id}/license-actions"
              payload: { action: "GRANT", license_expires_on: "2028-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/npas"
              payload: { npa_code: "614", state_code: "OH", npa_type: "GEOGRAPHIC" }
              as: NumberingAdministrator
              captures: { npa_id: "$.data.id" }
            - call: "POST /numbering/rate-centers"
              payload: { npa_id: "${npa_id}", name: "COLUMBUS", state_code: "OH", lata_code: "324" }
              as: NumberingAdministrator
              captures: { rc_id: "$.data.id" }
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${a_id}", rate_center_id: "${rc_id}", reporting_period: "2026-H1", numbers_assigned: 2000, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 3, forecast_quarters: [1800, 1800, 1800, 1800] }
              as: CarrierRepresentative
              as_user_id: "${a_id}"
              captures: { fa_id: "$.data.id" }
          trigger:
            - call: "POST /numbering/utilization-filings"
              payload: { carrier_id: "${b_id}", rate_center_id: "${rc_id}", reporting_period: "2026-H1", numbers_assigned: 95, numbers_intermediate: 0, numbers_reserved: 0, numbers_aging: 0, numbers_administrative: 0, blocks_held_at_period_end: 1, forecast_quarters: [100, 100, 100, 100] }
              as: CarrierRepresentative
              as_user_id: "${b_id}"
              captures: { fb_id: "$.data.id" }
            - call: "GET /numbering/utilization-filings"
              payload: { rate_center_id: "${rc_id}" }
              as: NumberingAdministrator
          assert:
            - "The second create returns HTTP 201 - the same reporting_period for a DIFFERENT carrier is not ERR_DUPLICATE_FILING_PERIOD"
            - "GET /numbering/utilization-filings?rate_center_id=${rc_id} returns total_count == 2 with ids {${fa_id}, ${fb_id}}"
            - "Both rows read status == \"DRAFT\" and claimed_utilization_pct is null until each is submitted"
  - section: state_machines
    instances:
      - name: carrier_license_grant_moves_none_to_granted
        claim_type: Valid Transition
        grounds: ["state_machines.Carrier.transitions.NONE_to_GRANTED", "endpoints[POST /numbering/carriers/{carrier_id}/license-actions]"]
        distinguishing_aspect: "action=GRANT on a carrier whose license_status is NONE stamps license_status GRANTED and license_expires_on from the payload, yet eligibility_status stays INELIGIBLE because the readiness axis is still NOT_SUBMITTED."
        test_recipe:
          setup: ["Carrier A (ocn 1234) is registered and has taken no licensing or readiness action."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: NumberingAdministrator
            - call: "POST /numbering/carriers"
