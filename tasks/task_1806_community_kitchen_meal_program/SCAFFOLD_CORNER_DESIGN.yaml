          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "lock-forecast with expected_menu_day_version one behind the current MenuDay.version (an item confirm bumped it) is rejected 412 ERR_STALE_VERSION; retry with the fresh version succeeds."
        test_recipe:
          setup: ["Site S; batch ACCEPTED 10; menu day D DRAFT; item I created and allocated; version v_pre captured BEFORE confirm; confirm bumps version."]
          setup_api_calls:
