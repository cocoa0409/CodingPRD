scenario: "Science Center & Planetarium: timed-entry & show scheduling (dome/theater capacity), field-trip & group booking, membership & reciprocal (ASTC), exhibit/feature surcharge, camp & class registration, birthday/event rental, donor/sponsor, accessibility"
domain_name: science-center-planetarium
api_prefix: /

complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
  entity_topology: graph
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display name of the venue (dome, theater, classroom, or rental hall)." }
      - { name: venue_type, type: enum, source: input, description: "Kind of space.", constraints: "one of {DOME, THEATER, GALLERY, CLASSROOM, RENTAL_HALL}" }
      - { name: seated_capacity, type: integer, source: input, description: "Maximum number of occupants for a single show/session in this venue.", constraints: ">= 1" }
      - { name: turnover_buffer_minutes, type: integer, source: input, default: 15, description: "Minutes of cleaning/reset required after a show ends before the next show may begin in the SAME venue.", constraints: ">= 0" }
      - { name: accessible_seats, type: integer, source: input, default: 0, description: "Number of wheelchair-accessible seats included within seated_capacity.", constraints: "0 <= accessible_seats <= seated_capacity" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Lifecycle state; venues are ACTIVE on creation.", constraints: "one of {ACTIVE}" }

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - { name: primary_member_name, type: string, source: input, description: "Name of the primary cardholder." }
      - { name: tier, type: enum, source: input, description: "Membership tier.", constraints: "one of {INDIVIDUAL, FAMILY, PATRON}" }
      - { name: astc_eligible, type: boolean, source: computed, description: "True iff tier is FAMILY or PATRON; only these tiers carry ASTC reciprocal benefits." }
      - { name: home_zip, type: string, source: input, description: "5-digit home postal code of the primary member, used for the ASTC 90-mile reciprocal exclusion." }
      - { name: party_size, type: integer, source: input, default: 1, description: "Number of named admissions on the card (1 for INDIVIDUAL; up to 6 for FAMILY/PATRON).", constraints: "INDIVIDUAL: party_size==1; FAMILY/PATRON: 1<=party_size<=6" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Lifecycle state.", constraints: "one of {PENDING, ACTIVE, EXPIRED, CANCELLED}" }
      - { name: activated_at, type: datetime, source: system, description: "Logical-clock instant the membership became ACTIVE (dues paid). Null while PENDING." }
      - { name: expires_at, type: datetime, source: computed, description: "activated_at + 365 days; null while PENDING. Membership is EXPIRED once the logical clock passes this instant and a sweep runs." }
      - { name: dues_paid_cents, type: integer, source: system, default: 0, description: "Cumulative dues collected on this card." }

  - name: ShowEvent
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the dome/theater the show occupies. Must be a DOME or THEATER venue." }
      - { name: title, type: string, source: input, description: "Show title." }
      - { name: starts_at, type: datetime, source: input, description: "Logical-clock instant the show begins (inclusive)." }
      - { name: ends_at, type: datetime, source: input, description: "Logical-clock instant the show ends (exclusive). Must be strictly after starts_at." }
      - { name: base_price_cents, type: integer, source: input, description: "Per-seat admission price before surcharges and member discounts.", constraints: ">= 0" }
      - { name: feature_surcharge_cents, type: integer, source: input, default: 0, description: "Per-seat premium add-on for special/feature presentations (e.g., laser dome). Applied on top of base_price_cents.", constraints: ">= 0" }
      - { name: seats_sold, type: integer, source: computed, default: 0, description: "Sum of party_size over this show's ShowBookings whose status IN {HELD, CONFIRMED}. Recomputed on every booking transition." }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "Lifecycle state.", constraints: "one of {SCHEDULED, OPEN, SOLD_OUT, CANCELLED, COMPLETED}" }
      - { name: version, type: integer, source: system, description: "OCC version (from common_fields); incremented on every mutation including seats_sold recompute." }

  - name: ShowBooking
    parent: null
    common_fields: true
    fields:
      - { name: show_event_id, type: string, source: input, description: "FK -> ShowEvent.id; the show this booking holds seats in." }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the member card used for pricing, or null for a non-member walk-up booking." }
      - { name: party_size, type: integer, source: input, description: "Number of seats requested in this booking.", constraints: ">= 1" }
      - { name: accessible_seats_requested, type: integer, source: input, default: 0, description: "Of party_size, how many must be wheelchair-accessible seats.", constraints: "0 <= accessible_seats_requested <= party_size" }
      - { name: gross_price_cents, type: integer, source: computed, description: "Total price before member discount = party_size * (base_price_cents + feature_surcharge_cents), snapshotted at hold time." }
      - { name: member_discount_cents, type: integer, source: computed, description: "Discount applied via show_admission_pricing; 0 for non-member bookings." }
      - { name: net_price_cents, type: integer, source: computed, description: "gross_price_cents - member_discount_cents, snapshotted at hold time and frozen on confirm." }
      - { name: expected_show_version, type: integer, source: input, description: "OCC: the ShowEvent.version the client last observed; checked on hold to resolve supersede races on seats." }
      - { name: status, type: enum, source: system, default: HELD, description: "Lifecycle state.", constraints: "one of {HELD, CONFIRMED, CANCELLED, REFUNDED}" }
      - { name: held_at, type: datetime, source: system, description: "Logical-clock instant the hold was created. Hold expires 30 minutes later if not confirmed." }

  - name: GroupBooking
    parent: null
    common_fields: true
    fields:
      - { name: show_event_id, type: string, source: input, description: "FK -> ShowEvent.id; the show this field-trip/group block reserves." }
      - { name: organization_name, type: string, source: input, description: "School or group organization name." }
      - { name: student_count, type: integer, source: input, description: "Number of students/attendees in the group.", constraints: ">= 1" }
      - { name: chaperone_count, type: integer, source: input, description: "Estimated number of accompanying chaperones at request time.", constraints: ">= 0" }
      - { name: actual_student_count, type: integer, source: system, description: "Confirmed head-count of students supplied at confirm time; null until confirmed. Drives the FINAL invoice variant." }
      - { name: actual_chaperone_count, type: integer, source: system, description: "Confirmed chaperone head-count supplied at confirm time; null until confirmed." }
      - { name: total_seats, type: integer, source: computed, description: "student_count + chaperone_count; the seat block this group reserves against show capacity at deposit time." }
      - { name: deposit_cents, type: integer, source: computed, description: "group_invoice_total variant=DEPOSIT output (estimate from student_count/chaperone_count), snapshotted at request time." }
      - { name: balance_cents, type: integer, source: computed, description: "group_invoice_total variant=FINAL output (computed from actual_student_count/actual_chaperone_count) minus deposit_cents, snapshotted when confirmed." }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Lifecycle state.", constraints: "one of {REQUESTED, DEPOSIT_PAID, CONFIRMED, CANCELLED}" }

  - name: ProgramSession
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the classroom this camp/class meets in. Must be a CLASSROOM venue." }
      - { name: title, type: string, source: input, description: "Camp or class title." }
      - { name: program_kind, type: enum, source: input, description: "Whether this is a multi-day camp or a single class.", constraints: "one of {CAMP, CLASS}" }
      - { name: min_age, type: integer, source: input, description: "Minimum participant age in years (inclusive).", constraints: ">= 0" }
      - { name: max_age, type: integer, source: input, description: "Maximum participant age in years (inclusive).", constraints: "max_age >= min_age" }
      - { name: starts_at, type: datetime, source: input, description: "Logical-clock instant the program begins." }
      - { name: capacity, type: integer, source: input, description: "Maximum confirmed enrollments before the waitlist engages.", constraints: ">= 1" }
      - { name: tuition_cents, type: integer, source: input, description: "Per-participant tuition before member discount.", constraints: ">= 0" }
      - { name: enrolled_count, type: integer, source: computed, default: 0, description: "Count of this session's Registrations whose status == ENROLLED. Recomputed on every registration transition." }
      - { name: status, type: enum, source: system, default: ENROLLING, description: "Lifecycle state.", constraints: "one of {ENROLLING, FULL, STARTED, CANCELLED}" }
      - { name: version, type: integer, source: system, description: "OCC version (from common_fields); incremented on every mutation including enrolled_count recompute." }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: program_session_id, type: string, source: input, description: "FK -> ProgramSession.id; the camp/class this registration is for." }
      - { name: membership_id, type: string, source: input, description: "FK -> Membership.id; the member card used for the registration discount, or null for non-member." }
      - { name: participant_name, type: string, source: input, description: "Name of the child/participant." }
      - { name: participant_age, type: integer, source: input, description: "Participant age in years at registration time.", constraints: ">= 0" }
      - { name: tuition_charged_cents, type: integer, source: computed, description: "program_tuition_pricing output, snapshotted at enrollment time." }
      - { name: waitlist_position, type: integer, source: computed, description: "1-based position when status == WAITLISTED, ordered by created_at ASC; null otherwise." }
      - { name: expected_session_version, type: integer, source: input, description: "OCC: the ProgramSession.version the client last observed; checked on enroll to resolve last-seat supersede races." }
      - { name: status, type: enum, source: system, default: WAITLISTED, description: "Lifecycle state.", constraints: "one of {ENROLLED, WAITLISTED, CANCELLED}" }

  - name: RentalEvent
    parent: null
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id; the RENTAL_HALL booked for the private event (birthday/party)." }
      - { name: host_name, type: string, source: input, description: "Name of the party host." }
      - { name: starts_at, type: datetime, source: input, description: "Logical-clock instant the rental window begins (inclusive)." }
      - { name: ends_at, type: datetime, source: input, description: "Logical-clock instant the rental window ends (exclusive). Must be strictly after starts_at." }
      - { name: guest_count, type: integer, source: input, description: "Estimated number of guests at inquiry time.", constraints: ">= 1" }
      - { name: actual_guest_count, type: integer, source: system, description: "Confirmed final guest count supplied at confirm time; null until confirmed. Drives the FINAL quote variant." }
      - { name: base_rental_cents, type: integer, source: input, description: "Flat hall fee before per-guest charges.", constraints: ">= 0" }
      - { name: deposit_cents, type: integer, source: computed, description: "rental_quote variant=DEPOSIT output (25% of the estimated quote), snapshotted at request." }
      - { name: total_cents, type: integer, source: computed, description: "rental_quote variant=FINAL output (computed from actual_guest_count), snapshotted at confirmation." }
      - { name: status, type: enum, source: system, default: INQUIRY, description: "Lifecycle state.", constraints: "one of {INQUIRY, HELD, CONFIRMED, CANCELLED}" }

  - name: Sponsor
    parent: null
    common_fields: true
    fields:
      - { name: org_name, type: string, source: input, description: "Donor or sponsor organization/individual name." }
      - { name: sponsor_kind, type: enum, source: input, description: "Whether this is a one-time donor or a recurring sponsor.", constraints: "one of {DONOR, SPONSOR}" }
      - { name: pledged_cents, type: integer, source: input, description: "Total amount pledged.", constraints: ">= 0" }
      - { name: received_cents, type: integer, source: computed, default: 0, description: "Sum of fulfilled Contribution.amount_cents for this sponsor whose status == RECEIVED." }
      - { name: fulfillment_ratio, type: number, source: computed, description: "received_cents / pledged_cents, rounded to 4 decimals; 0 when pledged_cents == 0." }
      - { name: status, type: enum, source: system, default: PLEDGED, description: "Lifecycle state.", constraints: "one of {PLEDGED, PARTIALLY_FULFILLED, FULFILLED, LAPSED}" }
      - { name: version, type: integer, source: system, description: "OCC version (from common_fields); incremented on every mutation including received_cents recompute." }

  - name: Contribution
    parent: null
    common_fields: false
    fields:
      - { name: sponsor_id, type: string, source: input, description: "FK -> Sponsor.id; the sponsor this payment installment belongs to." }
      - { name: amount_cents, type: integer, source: input, description: "Installment amount.", constraints: ">= 1" }
      - { name: expected_sponsor_version, type: integer, source: input, description: "OCC: the Sponsor.version the client last observed; checked to resolve concurrent fulfillment supersede." }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "Append-only installment record; always RECEIVED on creation. Immutable thereafter.", constraints: "one of {RECEIVED}" }

  - name: AccommodationRequest
    parent: null
    common_fields: true
    fields:
      - { name: subject_type, type: enum, source: input, description: "Which booking type this accessibility accommodation attaches to.", constraints: "one of {SHOW_BOOKING, REGISTRATION, RENTAL}" }
      - { name: show_booking_id, type: string, source: input, description: "FK -> ShowBooking.id; set iff subject_type == SHOW_BOOKING, else null." }
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id; set iff subject_type == REGISTRATION, else null." }
      - { name: rental_event_id, type: string, source: input, description: "FK -> RentalEvent.id; set iff subject_type == RENTAL, else null." }
      - { name: accommodation_kind, type: enum, source: input, description: "Type of accommodation requested.", constraints: "one of {WHEELCHAIR, ASL_INTERPRETER, SENSORY_FRIENDLY, ASSISTIVE_LISTENING}" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Lifecycle state.", constraints: "one of {SUBMITTED, APPROVED, DENIED, FULFILLED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ShowEvent
    initial_state: SCHEDULED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /shows/{id}/open"
        actor: BoxOfficeOperator
        preconditions:
          - "ShowEvent.status == SCHEDULED"
          - "logical clock < ShowEvent.starts_at"
        side_effects:
          - "set ShowEvent.status = OPEN"
          - "increment ShowEvent.version by 1"
        note: "Show becomes bookable."
      - from: OPEN
        to: SOLD_OUT
        trigger: "system: bubble-up when a hold/confirm pushes seats_sold to seated_capacity"
        actor: system
        preconditions:
          - "ShowEvent.seats_sold == Venue.seated_capacity for the show's venue"
        side_effects:
          - "set ShowEvent.status = SOLD_OUT"
          - "increment ShowEvent.version by 1"
        note: "Auto-transition (bubble-up) when last seat is taken."
      - from: SOLD_OUT
        to: OPEN
        trigger: "system: bubble-up when a cancellation frees a seat"
        actor: system
        preconditions:
          - "ShowEvent.seats_sold < Venue.seated_capacity"
        side_effects:
          - "set ShowEvent.status = OPEN"
          - "increment ShowEvent.version by 1"
        note: "Reopen when a CANCELLED booking releases seats — cyclic OPEN<->SOLD_OUT."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /shows/{id}/cancel"
        actor: BoxOfficeOperator
        preconditions:
          - "ShowEvent.status IN {SCHEDULED, OPEN, SOLD_OUT}"
        side_effects:
          - "cascade: every ShowBooking with status IN {HELD, CONFIRMED} on this show -> CANCELLED (releases its seats; net_price_cents becomes refundable)"
          - "cascade hop 2: each cascaded ShowBooking->CANCELLED that has a linked AccommodationRequest (AccommodationRequest.show_booking_id == booking.id) with status IN {SUBMITTED, APPROVED} -> DENIED"
          - "set ShowEvent.seats_sold = 0 after cascade"
          - "set ShowEvent.status = CANCELLED"
          - "increment ShowEvent.version by 1"
        note: "Depth-3 cascade: show cancel -> booking cancel -> accommodation deny."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shows/{id}/cancel"
        actor: BoxOfficeOperator
        preconditions:
          - "ShowEvent.status == SCHEDULED"
        side_effects:
          - "set ShowEvent.status = CANCELLED"
          - "increment ShowEvent.version by 1"
      - from: SOLD_OUT
        to: CANCELLED
        trigger: "POST /shows/{id}/cancel"
        actor: BoxOfficeOperator
        preconditions:
          - "ShowEvent.status == SOLD_OUT"
        side_effects:
          - "cascade: every ShowBooking with status IN {HELD, CONFIRMED} on this show -> CANCELLED"
          - "cascade hop 2: each cascaded booking's linked AccommodationRequest with status IN {SUBMITTED, APPROVED} -> DENIED"
          - "set ShowEvent.seats_sold = 0"
          - "set ShowEvent.status = CANCELLED"
          - "increment ShowEvent.version by 1"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /shows/{id}/complete"
        actor: BoxOfficeOperator
        preconditions:
          - "logical clock >= ShowEvent.ends_at"
          - "ShowEvent.status IN {OPEN, SOLD_OUT}"
        side_effects:
          - "every ShowBooking with status == CONFIRMED stays CONFIRMED (consumed); every HELD booking on this show -> CANCELLED (no-show release)"
          - "set ShowEvent.status = COMPLETED"
          - "increment ShowEvent.version by 1"
      - from: SOLD_OUT
        to: COMPLETED
        trigger: "POST /shows/{id}/complete"
        actor: BoxOfficeOperator
        preconditions:
          - "logical clock >= ShowEvent.ends_at"
          - "ShowEvent.status IN {OPEN, SOLD_OUT}"
        side_effects:
          - "every HELD booking -> CANCELLED; CONFIRMED bookings consumed"
          - "set ShowEvent.status = COMPLETED"
          - "increment ShowEvent.version by 1"

  - entity: ShowBooking
    initial_state: HELD
    terminal_states: [CANCELLED, REFUNDED]
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "POST /show-bookings/{id}/confirm"
        actor: BoxOfficeOperator
        preconditions:
          - "ShowBooking.status == HELD"
          - "logical clock < ShowBooking.held_at + 30 minutes"
          - "linked ShowEvent (ShowBooking.show_event_id == ShowEvent.id) status IN {OPEN, SOLD_OUT}"
        side_effects:
          - "freeze net_price_cents (no recompute on confirm)"
          - "recompute linked ShowEvent.seats_sold (unchanged in count; HELD and CONFIRMED both occupy)"
          - "increment ShowEvent.version by 1"
        note: "Guarded by clock (hold window) and by linked show state."
      - from: HELD
        to: CANCELLED
        trigger: "POST /show-bookings/{id}/cancel OR system hold-expiry sweep"
        actor: BoxOfficeOperator
        preconditions:
          - "ShowBooking.status == HELD"
        side_effects:
          - "release party_size seats: recompute linked ShowEvent.seats_sold"
          - "bubble-up: if linked ShowEvent.status == SOLD_OUT and seats now < capacity -> ShowEvent.status = OPEN"
          - "increment linked ShowEvent.version by 1"
      - from: CONFIRMED
        to: REFUNDED
        trigger: "POST /show-bookings/{id}/refund"
        actor: BoxOfficeOperator
        preconditions:
          - "ShowBooking.status == CONFIRMED"
          - "logical clock < linked ShowEvent.starts_at"
        side_effects:
          - "compensation: release party_size seats; recompute linked ShowEvent.seats_sold; refund net_price_cents (conserved-quantity invariant: cents in == cents out)"
          - "bubble-up: SOLD_OUT -> OPEN if seats now < capacity"
          - "increment linked ShowEvent.version by 1"

  - entity: ProgramSession
    initial_state: ENROLLING
    terminal_states: [CANCELLED, STARTED]
    transitions:
      - from: ENROLLING
        to: FULL
        trigger: "system: bubble-up when enrolled_count reaches capacity"
        actor: system
        preconditions:
          - "ProgramSession.enrolled_count == ProgramSession.capacity"
        side_effects:
          - "set ProgramSession.status = FULL"
          - "increment ProgramSession.version by 1"
      - from: FULL
        to: ENROLLING
        trigger: "system: bubble-up when a cancellation frees a seat and no waitlisted registration is auto-promoted to fill it"
        actor: system
        preconditions:
          - "ProgramSession.enrolled_count < ProgramSession.capacity"
          - "no WAITLISTED Registration remains for this session"
        side_effects:
          - "set ProgramSession.status = ENROLLING"
          - "increment ProgramSession.version by 1"
        note: "Cyclic ENROLLING<->FULL."
      - from: ENROLLING
        to: STARTED
        trigger: "POST /programs/{id}/start"
        actor: ProgramCoordinator
        preconditions:
          - "logical clock >= ProgramSession.starts_at"
          - "ProgramSession.status IN {ENROLLING, FULL}"
        side_effects:
          - "every WAITLISTED Registration on this session -> CANCELLED (waitlist purged at start)"
          - "set ProgramSession.status = STARTED"
          - "increment ProgramSession.version by 1"
      - from: FULL
        to: STARTED
        trigger: "POST /programs/{id}/start"
        actor: ProgramCoordinator
        preconditions:
          - "logical clock >= ProgramSession.starts_at"
          - "ProgramSession.status IN {ENROLLING, FULL}"
        side_effects:
          - "every WAITLISTED Registration on this session -> CANCELLED"
          - "set ProgramSession.status = STARTED"
          - "increment ProgramSession.version by 1"
      - from: ENROLLING
        to: CANCELLED
        trigger: "POST /programs/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "ProgramSession.status IN {ENROLLING, FULL}"
        side_effects:
          - "cascade: every Registration with status IN {ENROLLED, WAITLISTED} -> CANCELLED"
          - "set ProgramSession.enrolled_count = 0"
          - "set ProgramSession.status = CANCELLED"
          - "increment ProgramSession.version by 1"
      - from: FULL
        to: CANCELLED
        trigger: "POST /programs/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "ProgramSession.status IN {ENROLLING, FULL}"
        side_effects:
          - "cascade: every Registration with status IN {ENROLLED, WAITLISTED} -> CANCELLED"
          - "set ProgramSession.enrolled_count = 0"
          - "set ProgramSession.status = CANCELLED"
          - "increment ProgramSession.version by 1"

  - entity: Registration
    initial_state: WAITLISTED
    terminal_states: [CANCELLED]
    transitions:
      - from: WAITLISTED
        to: ENROLLED
        trigger: "POST /registrations (when enrolled_count < capacity at enroll time) OR system promotion sweep"
        actor: ProgramCoordinator
        preconditions:
          - "linked ProgramSession.enrolled_count < linked ProgramSession.capacity"
          - "min_age <= Registration.participant_age <= max_age"
        side_effects:
          - "set Registration.status = ENROLLED"
          - "recompute linked ProgramSession.enrolled_count"
          - "bubble-up: if enrolled_count == capacity -> ProgramSession.status = FULL"
          - "increment linked ProgramSession.version by 1"
      - from: ENROLLED
        to: CANCELLED
        trigger: "POST /registrations/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "Registration.status == ENROLLED"
          - "linked ProgramSession.status IN {ENROLLING, FULL}"
        side_effects:
          - "recompute linked ProgramSession.enrolled_count (decrement)"
          - "cascade promotion hop 2: the WAITLISTED Registration with the lowest created_at on this session -> ENROLLED (fills the freed seat); recompute enrolled_count again"
          - "cascade hop 3: if no WAITLISTED registration remained to promote AND ProgramSession.status == FULL -> ProgramSession.status = ENROLLING"
          - "increment linked ProgramSession.version by 1"
        note: "Depth-3 cascade: cancel -> waitlist promotion -> session reopen."
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /registrations/{id}/cancel"
        actor: ProgramCoordinator
        preconditions:
          - "Registration.status == WAITLISTED"
        side_effects:
          - "recompute waitlist_position for remaining WAITLISTED registrations (each later one shifts down by 1)"

  - entity: GroupBooking
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: DEPOSIT_PAID
        trigger: "POST /group-bookings/{id}/pay-deposit"
        actor: GroupSalesAgent
        preconditions:
          - "GroupBooking.status == REQUESTED"
          - "linked ShowEvent.status IN {OPEN}"
          - "linked ShowEvent.seats_sold + GroupBooking.total_seats <= Venue.seated_capacity"
        side_effects:
          - "reserve total_seats: recompute linked ShowEvent.seats_sold (+= total_seats)"
          - "bubble-up: SOLD_OUT if seats reach capacity"
          - "set GroupBooking.status = DEPOSIT_PAID"
          - "increment linked ShowEvent.version by 1"
      - from: DEPOSIT_PAID
        to: CONFIRMED
        trigger: "POST /group-bookings/{id}/confirm"
        actor: GroupSalesAgent
        preconditions:
          - "GroupBooking.status == DEPOSIT_PAID"
        side_effects:
          - "store actual_student_count, actual_chaperone_count from request"
          - "compute balance_cents via group_invoice_total variant=FINAL minus deposit_cents"
          - "set GroupBooking.status = CONFIRMED"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /group-bookings/{id}/cancel"
        actor: GroupSalesAgent
        preconditions:
          - "GroupBooking.status == REQUESTED"
        side_effects:
          - "set GroupBooking.status = CANCELLED"
      - from: DEPOSIT_PAID
        to: CANCELLED
        trigger: "POST /group-bookings/{id}/cancel"
        actor: GroupSalesAgent
        preconditions:
          - "GroupBooking.status == DEPOSIT_PAID"
        side_effects:
          - "release total_seats: recompute linked ShowEvent.seats_sold (-= total_seats)"
          - "bubble-up: SOLD_OUT -> OPEN if seats now < capacity"
          - "set GroupBooking.status = CANCELLED"
          - "increment linked ShowEvent.version by 1"

  - entity: RentalEvent
    initial_state: INQUIRY
    terminal_states: [CANCELLED]
    transitions:
      - from: INQUIRY
        to: HELD
        trigger: "POST /rentals/{id}/hold"
        actor: EventsManager
        preconditions:
          - "RentalEvent.status == INQUIRY"
          - "no other RentalEvent on the same venue with status IN {HELD, CONFIRMED} whose [starts_at, ends_at) overlaps this one"
        side_effects:
          - "set RentalEvent.status = HELD"
      - from: HELD
        to: CONFIRMED
        trigger: "POST /rentals/{id}/confirm"
        actor: EventsManager
        preconditions:
          - "RentalEvent.status == HELD"
        side_effects:
          - "store actual_guest_count from request"
          - "compute total_cents via rental_quote variant=FINAL"
          - "set RentalEvent.status = CONFIRMED"
      - from: INQUIRY
        to: CANCELLED
        trigger: "POST /rentals/{id}/cancel"
        actor: EventsManager
        preconditions:
          - "RentalEvent.status == INQUIRY"
        side_effects:
          - "set RentalEvent.status = CANCELLED"
      - from: HELD
        to: CANCELLED
        trigger: "POST /rentals/{id}/cancel"
        actor: EventsManager
        preconditions:
          - "RentalEvent.status == HELD"
        side_effects:
          - "release the venue window (other rentals may now hold the slot)"
          - "set RentalEvent.status = CANCELLED"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /rentals/{id}/cancel"
        actor: EventsManager
        preconditions:
          - "RentalEvent.status == CONFIRMED"
          - "logical clock < RentalEvent.starts_at"
        side_effects:
          - "release the venue window"
          - "set RentalEvent.status = CANCELLED"

  - entity: Membership
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /memberships/{id}/activate"
        actor: MembershipClerk
        preconditions:
          - "Membership.status == PENDING"
        side_effects:
          - "set activated_at = logical clock now"
          - "set expires_at = activated_at + 365 days"
          - "add dues to dues_paid_cents"
          - "set astc_eligible = (tier IN {FAMILY, PATRON})"
          - "set Membership.status = ACTIVE"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: membership expiry sweep when logical clock >= expires_at"
        actor: system
        preconditions:
          - "Membership.status == ACTIVE"
          - "logical clock >= Membership.expires_at"
        side_effects:
          - "set Membership.status = EXPIRED"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /memberships/{id}/activate (renewal)"
        actor: MembershipClerk
        preconditions:
          - "Membership.status == EXPIRED"
        side_effects:
          - "set activated_at = logical clock now; expires_at = activated_at + 365 days"
          - "add renewal dues to dues_paid_cents"
          - "set Membership.status = ACTIVE"
        note: "Cyclic ACTIVE<->EXPIRED renewal loop."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: MembershipClerk
        preconditions:
          - "Membership.status IN {ACTIVE, PENDING}"
        side_effects:
          - "set Membership.status = CANCELLED"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: MembershipClerk
        preconditions:
          - "Membership.status == PENDING"
        side_effects:
          - "set Membership.status = CANCELLED"

  - entity: Sponsor
    initial_state: PLEDGED
    terminal_states: [LAPSED]
    transitions:
      - from: PLEDGED
        to: PARTIALLY_FULFILLED
        trigger: "POST /sponsors/{id}/contributions (received_cents now in (0, pledged_cents))"
        actor: DevelopmentOfficer
        preconditions:
          - "Sponsor.status == PLEDGED"
          - "0 < new received_cents < pledged_cents"
        side_effects:
          - "recompute received_cents (sum of RECEIVED contributions)"
          - "recompute fulfillment_ratio"
          - "set Sponsor.status = PARTIALLY_FULFILLED"
          - "increment Sponsor.version by 1"
      - from: PARTIALLY_FULFILLED
        to: FULFILLED
        trigger: "POST /sponsors/{id}/contributions (received_cents reaches pledged_cents)"
        actor: DevelopmentOfficer
        preconditions:
          - "Sponsor.status == PARTIALLY_FULFILLED"
          - "new received_cents >= pledged_cents"
        side_effects:
          - "recompute received_cents and fulfillment_ratio"
          - "set Sponsor.status = FULFILLED"
          - "increment Sponsor.version by 1"
      - from: PLEDGED
        to: FULFILLED
        trigger: "POST /sponsors/{id}/contributions (first installment covers full pledge)"
        actor: DevelopmentOfficer
        preconditions:
          - "Sponsor.status == PLEDGED"
          - "new received_cents >= pledged_cents"
        side_effects:
          - "recompute received_cents and fulfillment_ratio"
          - "set Sponsor.status = FULFILLED"
          - "increment Sponsor.version by 1"
      - from: PLEDGED
        to: LAPSED
        trigger: "POST /sponsors/{id}/lapse"
        actor: DevelopmentOfficer
        preconditions:
          - "Sponsor.status IN {PLEDGED, PARTIALLY_FULFILLED}"
        side_effects:
          - "set Sponsor.status = LAPSED"
          - "increment Sponsor.version by 1"
      - from: PARTIALLY_FULFILLED
        to: LAPSED
        trigger: "POST /sponsors/{id}/lapse"
        actor: DevelopmentOfficer
        preconditions:
          - "Sponsor.status IN {PLEDGED, PARTIALLY_FULFILLED}"
        side_effects:
          - "set Sponsor.status = LAPSED"
          - "increment Sponsor.version by 1"

  - entity: AccommodationRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, FULFILLED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /accommodations/{id}/approve"
        actor: AccessibilityCoordinator
        preconditions:
          - "AccommodationRequest.status == SUBMITTED"
          - "for WHEELCHAIR on SHOW_BOOKING: linked ShowBooking.accessible_seats_requested <= remaining accessible seats on the booking's ShowEvent venue"
        side_effects:
          - "set AccommodationRequest.status = APPROVED"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /accommodations/{id}/deny OR cascade from show/booking cancel"
        actor: AccessibilityCoordinator
        preconditions:
          - "AccommodationRequest.status == SUBMITTED"
        side_effects:
          - "set AccommodationRequest.status = DENIED"
      - from: APPROVED
        to: DENIED
        trigger: "cascade from show cancel -> booking cancel -> accommodation deny"
        actor: system
        preconditions:
          - "AccommodationRequest.status == APPROVED"
          - "linked subject booking transitioned to CANCELLED"
        side_effects:
          - "set AccommodationRequest.status = DENIED"
      - from: APPROVED
        to: FULFILLED
        trigger: "POST /accommodations/{id}/fulfill"
        actor: AccessibilityCoordinator
        preconditions:
          - "AccommodationRequest.status == APPROVED"
        side_effects:
          - "set AccommodationRequest.status = FULFILLED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: show-booking-stale-seat
    parent_entity: ShowEvent
    write_endpoint: "POST /show-bookings"
    occ_field: "expected_show_version"
    description: |
      Creating a ShowBooking against a ShowEvent whose version has advanced
      since the client last observed it is rejected. The new hold would
      legitimately consume the last remaining seats, but another writer has
      already created a hold (advancing the show's version and seats_sold), so
      the current writer's seat-availability view is stale.
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412
  - rule_id: registration-stale-seat
    parent_entity: ProgramSession
    write_endpoint: "POST /registrations"
    occ_field: "expected_session_version"
    description: |
      Creating a Registration that would take the last open seat against a
      ProgramSession whose version has advanced since the client last observed
      it is rejected. Another writer has already enrolled into the final seat
      (advancing the session version and enrolled_count), so the current
      writer's view of seat availability is stale.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
  - rule_id: contribution-stale-fulfillment
    parent_entity: Sponsor
    write_endpoint: "POST /sponsors/{id}/contributions"
    occ_field: "expected_sponsor_version"
    description: |
      Recording a Contribution against a Sponsor whose version has advanced
      since the client last observed it is rejected. Another writer has already
      recorded an installment that legitimately moved the sponsor toward
      FULFILLED (advancing the sponsor version and received_cents), so the
      current writer's view of remaining-pledge is stale.
    error_id: ERR_STALE_SPONSOR_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: show_admission_pricing
    trigger: "POST /show-bookings (hold creation); snapshots gross_price_cents, member_discount_cents, net_price_cents onto the ShowBooking"
    algorithm: tiered_pricing
    formula: |
      per_seat = ShowEvent.base_price_cents + ShowEvent.feature_surcharge_cents
      gross_price_cents = ShowBooking.party_size * per_seat
      # Member discount tier selection (non-linear, branches on membership tier & state):
      if ShowBooking.membership_id is null:
          member_discount_cents = 0
      else:
          m = Membership(ShowBooking.membership_id)
          if m.status != ACTIVE:
              member_discount_cents = 0          # inactive card = no discount
          elif m.tier == PATRON:
              # PATRON: 100% off base, but feature surcharge is NEVER discounted
              member_discount_cents = ShowBooking.party_size * ShowEvent.base_price_cents
          elif m.tier == FAMILY:
              # FAMILY: 50% off the per-seat total (base + surcharge), rounded per-seat
              per_seat_disc = round_half_up(per_seat * 0.50)   # round each seat first
              member_discount_cents = ShowBooking.party_size * per_seat_disc
          else: # INDIVIDUAL
              # INDIVIDUAL: 25% off base only, surcharge full price, rounded per-seat
              per_seat_disc = round_half_up(ShowEvent.base_price_cents * 0.25)
              member_discount_cents = ShowBooking.party_size * per_seat_disc
      net_price_cents = gross_price_cents - member_discount_cents
    input_set: "Single ShowBooking + its ShowEvent + (optional) Membership; membership must be status==ACTIVE to discount."
    constants:
      PATRON_BASE_DISCOUNT_PCT: 1.00
      FAMILY_DISCOUNT_PCT: 0.50
      INDIVIDUAL_BASE_DISCOUNT_PCT: 0.25
    precision: "integer cents; round_half_up applied PER SEAT before multiplying by party_size (round-then-sum, NOT sum-then-round)"
    variants: []

  - name: group_invoice_total
    trigger: "POST /group-bookings sets DEPOSIT (estimate); POST /group-bookings/{id}/confirm sets FINAL (actual head-counts)"
    algorithm: forward_looking
    formula: |
      # grand_total(s_count, c_count) is the same arithmetic for both variants;
      # the variants differ ONLY in which head-counts feed it (estimate vs actual).
      per_seat = ShowEvent.base_price_cents + ShowEvent.feature_surcharge_cents
      free_chaperones = floor(s_count / CHAPERONE_FREE_RATIO)        # 1 free chaperone per 10 students
      billable_chaperones = max(0, c_count - free_chaperones)
      student_seat = round_half_up(per_seat * (1 - GROUP_STUDENT_PCT))   # round per seat
      students_total = s_count * student_seat
      chaperones_total = billable_chaperones * ShowEvent.base_price_cents   # billable chaperones pay base only
      grand_total = students_total + chaperones_total
    input_set: "Single GroupBooking + its ShowEvent; DEPOSIT uses (student_count, chaperone_count), FINAL uses (actual_student_count, actual_chaperone_count)."
    constants:
      CHAPERONE_FREE_RATIO: 10
      GROUP_STUDENT_PCT: 0.30
      DEPOSIT_PCT: 0.25
    precision: "integer cents; round_half_up per student seat then sum; deposit floor()ed to whole cents"
    variants:
      - name: DEPOSIT
        when: "at POST /group-bookings request time (estimate from requested head-counts)"
        difference: "deposit_cents = floor( grand_total(student_count, chaperone_count) * DEPOSIT_PCT ). This is a forward-looking ESTIMATE: the actual head-counts are unknown at request time."
      - name: FINAL
        when: "at POST /group-bookings/{id}/confirm time (actual head-counts supplied)"
        difference: "balance_cents = grand_total(actual_student_count, actual_chaperone_count) - deposit_cents. When actual head-counts differ from the estimate, FINAL diverges from 4x the deposit — estimate (forward-looking) vs actual produce different cents on the same GroupBooking row."

  - name: program_tuition_pricing
    trigger: "POST /registrations (enrollment); snapshots tuition_charged_cents onto the Registration"
    algorithm: threshold
    formula: |
      base = ProgramSession.tuition_cents
      if Registration.membership_id is null:
          tuition_charged_cents = base
      else:
          m = Membership(Registration.membership_id)
          if m.status != ACTIVE:
              tuition_charged_cents = base
          elif m.tier == PATRON:
              tuition_charged_cents = round_half_up(base * (1 - PATRON_TUITION_PCT))
          else: # FAMILY or INDIVIDUAL
              tuition_charged_cents = round_half_up(base * (1 - STD_MEMBER_TUITION_PCT))
      # Sibling/early-bird threshold: if session.enrolled_count (BEFORE this enroll) < EARLY_BIRD_SEATS,
      # apply an additional flat EARLY_BIRD_OFF_CENTS off, floored at 0.
      if enrolled_count_before_this_enroll < EARLY_BIRD_SEATS:
          tuition_charged_cents = max(0, tuition_charged_cents - EARLY_BIRD_OFF_CENTS)
    input_set: "Single Registration + its ProgramSession + (optional) Membership; enrolled_count observed BEFORE this enrollment is committed."
    constants:
      PATRON_TUITION_PCT: 0.40
      STD_MEMBER_TUITION_PCT: 0.15
      EARLY_BIRD_SEATS: 3
      EARLY_BIRD_OFF_CENTS: 1000
    precision: "integer cents; round_half_up on the percent step BEFORE subtracting the flat early-bird amount (evaluation order pinned: percent discount first, then flat early-bird, then floor at 0)"
    variants: []

  - name: rental_quote
    trigger: "POST /rentals sets DEPOSIT (estimate from guest_count); POST /rentals/{id}/confirm sets FINAL (actual_guest_count)"
    algorithm: tiered_pricing
    formula: |
      # grand_total(g) marginal tiering: first GUEST_TIER_1 guests at RATE_1, remainder at RATE_2.
      tier1_guests = min(g, GUEST_TIER_1)
      tier2_guests = max(0, g - GUEST_TIER_1)
      guest_charge = tier1_guests * RATE_1_CENTS + tier2_guests * RATE_2_CENTS
      grand_total = RentalEvent.base_rental_cents + guest_charge
    input_set: "Single RentalEvent; DEPOSIT uses guest_count, FINAL uses actual_guest_count."
    constants:
      GUEST_TIER_1: 20
      RATE_1_CENTS: 500
      RATE_2_CENTS: 300
      DEPOSIT_PCT: 0.25
    precision: "integer cents; marginal tiering, all integer; deposit floor()ed"
    variants:
      - name: DEPOSIT
        when: "at POST /rentals request time (estimate)"
        difference: "deposit_cents = floor( grand_total(guest_count) * DEPOSIT_PCT )."
      - name: FINAL
        when: "at POST /rentals/{id}/confirm time (actual_guest_count supplied)"
        difference: "total_cents = grand_total(actual_guest_count) (full gross invoice). When actual_guest_count differs from guest_count, FINAL diverges from 4x the deposit."

  - name: astc_reciprocal_eligibility
    trigger: "POST /show-bookings when membership used AND ShowBooking is flagged reciprocal_check (computed pre-pricing gate); also GET /memberships/{id}/astc-status"
    algorithm: threshold
    formula: |
      # ASTC 90-mile rule: a reciprocal member from a DIFFERENT institution is admitted free
      # UNLESS their home is within RECIPROCAL_RADIUS_MILES of THIS center (zip-distance proxy).
      # Modeled deterministically by zip prefix: same first-3-digit zip prefix as CENTER_ZIP_PREFIX => within radius.
      if not Membership.astc_eligible:           # only FAMILY/PATRON carry ASTC
          reciprocal_admit = false
      elif Membership.status != ACTIVE:
          reciprocal_admit = false
      elif Membership.home_zip[0:3] == CENTER_ZIP_PREFIX:
          reciprocal_admit = false               # within 90 miles -> NOT reciprocal-free here
      else:
          reciprocal_admit = true
    input_set: "Single Membership vs the center's CENTER_ZIP_PREFIX constant."
    constants:
      CENTER_ZIP_PREFIX: "606"
      RECIPROCAL_RADIUS_MILES: 90
    precision: "boolean; exact string prefix compare on first 3 zip chars"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except GET /_health"
  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right in the path then body FKs"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: existence
    check: "Request body parses and required fields present with correct types/enums"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a state from which this transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version equals the live parent version on supersede-style creates"
    error_id: ERR_STALE_SHOW_VERSION
    http_status: 412
    applies_to: "POST /show-bookings (also ERR_STALE_SESSION_VERSION for POST /registrations, ERR_STALE_SPONSOR_VERSION for POST /sponsors/{id}/contributions)"
  - priority: 7
    category: business_safety
    check: "Accessibility: accessible_seats_requested on a ShowBooking does not exceed the show venue's remaining accessible_seats"
    error_id: ERR_ACCESSIBLE_SEATS_UNAVAILABLE
    http_status: 409
    applies_to: "POST /show-bookings, POST /accommodations/{id}/approve"
  - priority: 8
    category: business_safety
    check: "Program age eligibility: min_age <= participant_age <= max_age for the session"
    error_id: ERR_AGE_INELIGIBLE
    http_status: 422
    applies_to: "POST /registrations"
  - priority: 9
    category: business_constraint
    check: "ShowEvent [starts_at, ends_at) plus the venue's turnover_buffer_minutes must not overlap any other non-cancelled ShowEvent in the SAME venue"
    error_id: ERR_SHOW_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /shows"
  - priority: 10
    category: business_constraint
    check: "RentalEvent [starts_at, ends_at) (closed-open, NO buffer) must not overlap any HELD/CONFIRMED RentalEvent in the same venue"
    error_id: ERR_RENTAL_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /rentals/{id}/hold"
  - priority: 11
    category: business_constraint
    check: "venue_type matches the entity: ShowEvent->{DOME,THEATER}; ProgramSession->CLASSROOM; RentalEvent->RENTAL_HALL"
    error_id: ERR_VENUE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /shows, POST /programs, POST /rentals"
  - priority: 12
    category: business_temporal
    check: "ShowEvent.ends_at strictly after starts_at; RentalEvent.ends_at strictly after starts_at"
    error_id: ERR_INVALID_TIME_WINDOW
    http_status: 422
    applies_to: "POST /shows, POST /rentals"
  - priority: 13
    category: business_temporal
    check: "Hold confirm attempted after the 30-minute hold window elapsed (logical clock)"
    error_id: ERR_HOLD_EXPIRED
    http_status: 409
    applies_to: "POST /show-bookings/{id}/confirm"
  - priority: 14
    category: business_constraint
    check: "party_size composition: INDIVIDUAL membership party_size==1; FAMILY/PATRON 1<=party_size<=6"
    error_id: ERR_PARTY_SIZE_INVALID
    http_status: 422
    applies_to: "POST /memberships"
  - priority: 15
    category: business_fiscal
    check: "Show seats: seats_sold + requested party_size must not exceed venue.seated_capacity"
    error_id: ERR_SHOW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /show-bookings, POST /group-bookings/{id}/pay-deposit"
  - priority: 16
    category: business_fiscal
    check: "Program: enrollment when enrolled_count == capacity is accepted but routed to WAITLISTED, not rejected; explicit over-capacity ENROLL (force) is rejected"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /registrations/{id}/cancel promotion only (internal); enroll auto-waitlists"
  - priority: 17
    category: business_fiscal
    check: "Contribution amount must not push received_cents above pledged_cents (over-fulfillment)"
    error_id: ERR_OVERFULFILLMENT
    http_status: 422
    applies_to: "POST /sponsors/{id}/contributions"
  - priority: 18
    category: existence
    check: "Accommodation subject coherence: exactly one of show_booking_id/registration_id/rental_event_id is present and it matches subject_type"
    error_id: ERR_ACCOMMODATION_SUBJECT_MISMATCH
    http_status: 422
    applies_to: "POST /accommodations"
  - priority: 19
    category: existence
    check: "Pagination: limit within [1,100] and offset >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list (GET collection) endpoints"
  - priority: 20
    category: existence
    check: "Numeric/semantic field-range constraints hold (e.g. seated_capacity >= 1, base_price_cents >= 0, pledged_cents >= 0, party_size >= 1, accessible_seats <= seated_capacity)"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all write endpoints with numeric fields"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Venues ---
  - method: POST
    path: "/venues"
    description: "Create a venue (dome/theater/gallery/classroom/rental hall)."
    roles: [FacilityAdmin]
    code: 201
    input: [name, venue_type, seated_capacity, "turnover_buffer_minutes?", "accessible_seats?"]
    output: Venue
    side_effects: ["create Venue with status ACTIVE"]
  - method: GET
    path: "/venues"
    description: "List venues with pagination, optional venue_type filter."
    roles: [FacilityAdmin, BoxOfficeOperator, ProgramCoordinator, EventsManager, GroupSalesAgent, MembershipClerk, DevelopmentOfficer, AccessibilityCoordinator]
    code: 200
    input: ["venue_type?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []
  - method: GET
    path: "/venues/{id}"
    description: "Fetch a single venue."
    roles: [FacilityAdmin, BoxOfficeOperator, ProgramCoordinator, EventsManager, GroupSalesAgent]
    code: 200
    input: []
    output: Venue
    side_effects: []
  - method: GET
    path: "/venues/{id}/shows"
    description: "List ShowEvents in a venue (FK reverse-reachability for ShowEvent.venue_id)."
    roles: [FacilityAdmin, BoxOfficeOperator, GroupSalesAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: ShowEvent[]
    side_effects: []
  - method: GET
    path: "/venues/{id}/programs"
    description: "List ProgramSessions in a venue (FK reverse-reachability for ProgramSession.venue_id)."
    roles: [FacilityAdmin, ProgramCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: ProgramSession[]
    side_effects: []
  - method: GET
    path: "/venues/{id}/rentals"
    description: "List RentalEvents in a venue (FK reverse-reachability for RentalEvent.venue_id)."
    roles: [FacilityAdmin, EventsManager]
    code: 200
    input: ["limit?", "offset?"]
    output: RentalEvent[]
    side_effects: []

  # --- Memberships ---
  - method: POST
    path: "/memberships"
    description: "Create a membership in PENDING."
    roles: [MembershipClerk]
    code: 201
    input: [primary_member_name, tier, home_zip, "party_size?"]
    output: Membership
    side_effects: ["create Membership status PENDING; compute astc_eligible"]
  - method: GET
    path: "/memberships"
    description: "List memberships with pagination and optional tier/status filter."
    roles: [MembershipClerk, BoxOfficeOperator]
    code: 200
    input: ["tier?", "status?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []
  - method: GET
    path: "/memberships/{id}"
    description: "Fetch a single membership."
    roles: [MembershipClerk, BoxOfficeOperator, ProgramCoordinator]
    code: 200
    input: []
    output: Membership
    side_effects: []
  - method: POST
    path: "/memberships/{id}/activate"
    description: "Activate (or renew) a membership; pay dues."
    roles: [MembershipClerk]
    code: 200
    input: [dues_cents]
    output: Membership
    side_effects: ["set activated_at, expires_at; add dues_paid_cents; set astc_eligible; status -> ACTIVE"]
  - method: POST
    path: "/memberships/{id}/cancel"
    description: "Cancel a membership."
    roles: [MembershipClerk]
    code: 200
    input: []
    output: Membership
    side_effects: ["status -> CANCELLED"]
  - method: GET
    path: "/memberships/{id}/astc-status"
    description: "Computed read: ASTC reciprocal admission eligibility for this membership at the center (astc_reciprocal_eligibility)."
    roles: [MembershipClerk, BoxOfficeOperator]
    code: 200
    input: []
    output: Membership
    side_effects: []

  # --- Shows ---
  - method: POST
    path: "/shows"
    description: "Schedule a show in a DOME/THEATER venue (status SCHEDULED). Overlap+buffer checked."
    roles: [BoxOfficeOperator]
    code: 201
    input: [venue_id, title, starts_at, ends_at, base_price_cents, "feature_surcharge_cents?"]
    output: ShowEvent
    side_effects: ["create ShowEvent status SCHEDULED, seats_sold 0, version 1"]
  - method: GET
    path: "/shows"
    description: "List shows with pagination; optional venue_id and status filter."
    roles: [BoxOfficeOperator, GroupSalesAgent, FacilityAdmin]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: ShowEvent[]
    side_effects: []
  - method: GET
    path: "/shows/{id}"
    description: "Fetch a single show."
    roles: [BoxOfficeOperator, GroupSalesAgent, AccessibilityCoordinator]
    code: 200
    input: []
    output: ShowEvent
    side_effects: []
  - method: POST
    path: "/shows/{id}/open"
    description: "Open a show for bookings."
    roles: [BoxOfficeOperator]
    code: 200
    input: []
    output: ShowEvent
    side_effects: ["status SCHEDULED -> OPEN; version +1"]
  - method: POST
    path: "/shows/{id}/cancel"
    description: "Cancel a show; cascade-cancel bookings and deny their accommodations."
    roles: [BoxOfficeOperator]
    code: 200
    input: []
    output: ShowEvent
    side_effects: ["cascade bookings -> CANCELLED; cascade accommodations -> DENIED; seats_sold 0; status -> CANCELLED; version +1"]
  - method: POST
    path: "/shows/{id}/complete"
    description: "Mark a show completed after it ends; release HELD bookings as no-shows."
    roles: [BoxOfficeOperator]
    code: 200
    input: []
    output: ShowEvent
    side_effects: ["HELD bookings -> CANCELLED; status -> COMPLETED; version +1"]

  # --- Show Bookings ---
  - method: POST
    path: "/show-bookings"
    description: "Create a seat hold on an OPEN show (member or walk-up). OCC on show version."
    roles: [BoxOfficeOperator]
    code: 201
    input: [show_event_id, "membership_id?", party_size, "accessible_seats_requested?", expected_show_version]
    output: ShowBooking
    side_effects: ["snapshot pricing via show_admission_pricing; reserve seats; recompute ShowEvent.seats_sold; bubble-up SOLD_OUT; increment ShowEvent.version by 1"]
  - method: GET
    path: "/show-bookings"
    description: "List show bookings; optional show_event_id and membership_id filter (FK reverse-reachability for ShowBooking.show_event_id and ShowBooking.membership_id)."
    roles: [BoxOfficeOperator, AccessibilityCoordinator]
    code: 200
    input: ["show_event_id?", "membership_id?", "status?", "limit?", "offset?"]
    output: ShowBooking[]
    side_effects: []
  - method: GET
    path: "/show-bookings/{id}"
    description: "Fetch a single show booking."
    roles: [BoxOfficeOperator, AccessibilityCoordinator]
    code: 200
    input: []
    output: ShowBooking
    side_effects: []
  - method: POST
    path: "/show-bookings/{id}/confirm"
    description: "Confirm a HELD booking within its hold window."
    roles: [BoxOfficeOperator]
    code: 200
    input: []
    output: ShowBooking
    side_effects: ["freeze net_price_cents; status -> CONFIRMED; increment ShowEvent.version by 1"]
  - method: POST
    path: "/show-bookings/{id}/cancel"
    description: "Cancel a HELD booking; release seats; bubble-up reopen."
    roles: [BoxOfficeOperator]
    code: 200
    input: []
    output: ShowBooking
    side_effects: ["release seats; recompute ShowEvent.seats_sold; SOLD_OUT->OPEN bubble-up; increment ShowEvent.version by 1"]
  - method: POST
    path: "/show-bookings/{id}/refund"
    description: "Refund a CONFIRMED booking before the show starts; compensation invariant on cents and seats."
    roles: [BoxOfficeOperator]
    code: 200
    input: []
    output: ShowBooking
    side_effects: ["release seats; refund net_price_cents; SOLD_OUT->OPEN bubble-up; status -> REFUNDED; increment ShowEvent.version by 1"]

  # --- Group Bookings ---
  - method: POST
    path: "/group-bookings"
    description: "Request a field-trip/group block on a show (status REQUESTED); compute provisional deposit."
    roles: [GroupSalesAgent]
    code: 201
    input: [show_event_id, organization_name, student_count, chaperone_count]
    output: GroupBooking
    side_effects: ["compute total_seats; compute deposit_cents via group_invoice_total variant DEPOSIT"]
  - method: GET
    path: "/group-bookings"
    description: "List group bookings; optional show_event_id filter (FK reverse-reachability for GroupBooking.show_event_id)."
    roles: [GroupSalesAgent, BoxOfficeOperator]
    code: 200
    input: ["show_event_id?", "status?", "limit?", "offset?"]
    output: GroupBooking[]
    side_effects: []
  - method: GET
    path: "/group-bookings/{id}"
    description: "Fetch a single group booking."
    roles: [GroupSalesAgent]
    code: 200
    input: []
    output: GroupBooking
    side_effects: []
  - method: POST
    path: "/group-bookings/{id}/pay-deposit"
    description: "Pay the deposit and reserve the seat block on the show."
    roles: [GroupSalesAgent]
    code: 200
    input: []
    output: GroupBooking
    side_effects: ["reserve total_seats; recompute ShowEvent.seats_sold; bubble-up SOLD_OUT; status -> DEPOSIT_PAID; increment ShowEvent.version by 1"]
  - method: POST
    path: "/group-bookings/{id}/confirm"
    description: "Confirm the group booking with actual head-counts; compute final balance."
    roles: [GroupSalesAgent]
    code: 200
    input: [actual_student_count, actual_chaperone_count]
    output: GroupBooking
    side_effects: ["store actual head-counts; compute balance_cents via group_invoice_total variant FINAL; status -> CONFIRMED"]
  - method: POST
    path: "/group-bookings/{id}/cancel"
    description: "Cancel a group booking; release reserved seats if any."
    roles: [GroupSalesAgent]
    code: 200
    input: []
    output: GroupBooking
    side_effects: ["release total_seats if DEPOSIT_PAID; recompute ShowEvent.seats_sold; bubble-up reopen; status -> CANCELLED; increment ShowEvent.version by 1"]

  # --- Programs (camps/classes) ---
  - method: POST
    path: "/programs"
    description: "Create a camp/class session in a CLASSROOM venue (status ENROLLING)."
    roles: [ProgramCoordinator]
    code: 201
    input: [venue_id, title, program_kind, min_age, max_age, starts_at, capacity, tuition_cents]
    output: ProgramSession
    side_effects: ["create ProgramSession status ENROLLING, enrolled_count 0, version 1"]
  - method: GET
    path: "/programs"
    description: "List program sessions; optional venue_id and status filter."
    roles: [ProgramCoordinator, MembershipClerk]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: ProgramSession[]
    side_effects: []
  - method: GET
    path: "/programs/{id}"
    description: "Fetch a single program session."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ProgramSession
    side_effects: []
  - method: POST
    path: "/programs/{id}/start"
    description: "Start the program; purge the waitlist."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ProgramSession
    side_effects: ["WAITLISTED registrations -> CANCELLED; status -> STARTED; version +1"]
  - method: POST
    path: "/programs/{id}/cancel"
    description: "Cancel the program; cascade-cancel all registrations."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: ProgramSession
    side_effects: ["cascade registrations -> CANCELLED; enrolled_count 0; status -> CANCELLED; version +1"]

  # --- Registrations ---
  - method: POST
    path: "/registrations"
    description: "Register a participant. Auto-ENROLLED if seats remain, else WAITLISTED. OCC on session version for last-seat supersede."
    roles: [ProgramCoordinator]
    code: 201
    input: [program_session_id, "membership_id?", participant_name, participant_age, expected_session_version]
    output: Registration
    side_effects: ["age check; snapshot tuition via program_tuition_pricing if ENROLLED; recompute enrolled_count; bubble-up FULL; increment ProgramSession.version by 1"]
  - method: GET
    path: "/registrations"
    description: "List registrations; optional program_session_id and membership_id filter (FK reverse-reachability for Registration.program_session_id and Registration.membership_id)."
    roles: [ProgramCoordinator]
    code: 200
    input: ["program_session_id?", "membership_id?", "status?", "limit?", "offset?"]
    output: Registration[]
    side_effects: []
  - method: GET
    path: "/registrations/{id}"
    description: "Fetch a single registration."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: POST
    path: "/registrations/{id}/cancel"
    description: "Cancel a registration; if ENROLLED, promote the head-of-waitlist and possibly reopen the session."
    roles: [ProgramCoordinator]
    code: 200
    input: []
    output: Registration
    side_effects: ["recompute enrolled_count; promote earliest WAITLISTED -> ENROLLED; reopen session if no waitlist remains; increment ProgramSession.version by 1"]

  # --- Rentals ---
  - method: POST
    path: "/rentals"
    description: "Create a rental inquiry on a RENTAL_HALL venue (status INQUIRY); compute provisional deposit."
    roles: [EventsManager]
    code: 201
    input: [venue_id, host_name, starts_at, ends_at, guest_count, base_rental_cents]
    output: RentalEvent
    side_effects: ["compute deposit_cents via rental_quote variant DEPOSIT"]
  - method: GET
    path: "/rentals"
    description: "List rentals; optional venue_id and status filter."
    roles: [EventsManager, FacilityAdmin]
    code: 200
    input: ["venue_id?", "status?", "limit?", "offset?"]
    output: RentalEvent[]
    side_effects: []
  - method: GET
    path: "/rentals/{id}"
    description: "Fetch a single rental."
    roles: [EventsManager]
    code: 200
    input: []
    output: RentalEvent
    side_effects: []
  - method: POST
    path: "/rentals/{id}/hold"
    description: "Hold the rental window; reject if it overlaps another HELD/CONFIRMED rental in the venue."
    roles: [EventsManager]
    code: 200
    input: []
    output: RentalEvent
    side_effects: ["overlap check; status INQUIRY -> HELD"]
  - method: POST
    path: "/rentals/{id}/confirm"
    description: "Confirm a HELD rental with the final guest count; compute final total."
    roles: [EventsManager]
    code: 200
    input: [actual_guest_count]
    output: RentalEvent
    side_effects: ["store actual_guest_count; compute total_cents via rental_quote variant FINAL; status -> CONFIRMED"]
  - method: POST
    path: "/rentals/{id}/cancel"
    description: "Cancel a rental; release the window."
    roles: [EventsManager]
    code: 200
    input: []
    output: RentalEvent
    side_effects: ["release window; status -> CANCELLED"]

  # --- Sponsors / Contributions ---
  - method: POST
    path: "/sponsors"
    description: "Create a donor/sponsor pledge (status PLEDGED)."
    roles: [DevelopmentOfficer]
    code: 201
    input: [org_name, sponsor_kind, pledged_cents]
    output: Sponsor
    side_effects: ["create Sponsor status PLEDGED, received_cents 0, version 1"]
  - method: GET
    path: "/sponsors"
    description: "List sponsors; optional sponsor_kind and status filter."
    roles: [DevelopmentOfficer]
    code: 200
    input: ["sponsor_kind?", "status?", "limit?", "offset?"]
    output: Sponsor[]
    side_effects: []
  - method: GET
    path: "/sponsors/{id}"
    description: "Fetch a single sponsor."
    roles: [DevelopmentOfficer]
    code: 200
    input: []
    output: Sponsor
    side_effects: []
  - method: POST
    path: "/sponsors/{id}/contributions"
    description: "Record a payment installment; OCC on sponsor version; advance fulfillment state."
    roles: [DevelopmentOfficer]
    code: 201
    input: [amount_cents, expected_sponsor_version]
    output: Contribution
    side_effects: ["create Contribution RECEIVED; recompute Sponsor.received_cents and fulfillment_ratio; advance Sponsor status; increment Sponsor.version by 1"]
  - method: GET
    path: "/sponsors/{id}/contributions"
    description: "List a sponsor's contributions (FK reverse-reachability for Contribution.sponsor_id)."
    roles: [DevelopmentOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Contribution[]
    side_effects: []
  - method: POST
    path: "/sponsors/{id}/lapse"
    description: "Mark a sponsor pledge lapsed."
    roles: [DevelopmentOfficer]
    code: 200
    input: []
    output: Sponsor
    side_effects: ["status -> LAPSED; version +1"]

  # --- Accommodations ---
  - method: POST
    path: "/accommodations"
    description: "Submit an accessibility accommodation request against a show booking, registration, or rental."
    roles: [AccessibilityCoordinator]
    code: 201
    input: [subject_type, accommodation_kind, "show_booking_id?", "registration_id?", "rental_event_id?"]
    output: AccommodationRequest
    side_effects: ["create AccommodationRequest status SUBMITTED"]
  - method: GET
    path: "/accommodations"
    description: "List accommodation requests; optional subject filters (FK reverse-reachability for show_booking_id, registration_id, rental_event_id)."
    roles: [AccessibilityCoordinator]
    code: 200
    input: ["show_booking_id?", "registration_id?", "rental_event_id?", "status?", "limit?", "offset?"]
    output: AccommodationRequest[]
    side_effects: []
  - method: GET
    path: "/accommodations/{id}"
    description: "Fetch a single accommodation request."
    roles: [AccessibilityCoordinator]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: []
  - method: POST
    path: "/accommodations/{id}/approve"
    description: "Approve an accommodation; for WHEELCHAIR enforce accessible-seat availability."
    roles: [AccessibilityCoordinator]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: ["accessible-seat check; status -> APPROVED"]
  - method: POST
    path: "/accommodations/{id}/deny"
    description: "Deny an accommodation request."
    roles: [AccessibilityCoordinator]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: ["status -> DENIED"]
  - method: POST
    path: "/accommodations/{id}/fulfill"
    description: "Mark an approved accommodation fulfilled."
    roles: [AccessibilityCoordinator]
    code: 200
    input: []
    output: AccommodationRequest
    side_effects: ["status -> FULFILLED"]

  # --- Test-driving / system ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock to an arbitrary ISO8601 instant. Server startup default is 2026-03-01T00:00:00Z; before any set_current_utc call the clock reads exactly this default and MUST NOT use wall-clock time."
    roles: [FacilityAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance logical clock to to_iso8601"]
  - method: POST
    path: "/_sweeps/run"
    description: "Run deferred sweeps at the current logical clock: expire memberships past expires_at; expire ShowBookings whose hold window elapsed (HELD -> CANCELLED with seat release + bubble-up)."
    roles: [FacilityAdmin]
    code: 200
    input: []
    output: null
    side_effects: ["membership expiry; hold-expiry booking cancel + seat release; SOLD_OUT->OPEN bubble-up"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role." }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation per §1.7." }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path id or body FK) does not exist." }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Body fails to parse, missing required field, or wrong type/enum." }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state from which the requested transition is defined." }
  - { id: ERR_STALE_SHOW_VERSION, http: 412, condition: "expected_show_version != live ShowEvent.version on POST /show-bookings." }
  - { id: ERR_STALE_SESSION_VERSION, http: 412, condition: "expected_session_version != live ProgramSession.version on POST /registrations." }
  - { id: ERR_STALE_SPONSOR_VERSION, http: 412, condition: "expected_sponsor_version != live Sponsor.version on POST /sponsors/{id}/contributions." }
  - { id: ERR_ACCESSIBLE_SEATS_UNAVAILABLE, http: 409, condition: "Requested accessible seats exceed the show venue's remaining accessible_seats." }
  - { id: ERR_AGE_INELIGIBLE, http: 422, condition: "participant_age outside [min_age, max_age] of the session." }
  - { id: ERR_SHOW_TIME_CONFLICT, http: 409, condition: "New show's [starts_at, ends_at)+buffer overlaps an existing non-cancelled show in the same venue." }
  - { id: ERR_RENTAL_TIME_CONFLICT, http: 409, condition: "Rental window overlaps a HELD/CONFIRMED rental in the same venue." }
  - { id: ERR_VENUE_TYPE_MISMATCH, http: 422, condition: "venue_type incompatible with the entity being scheduled." }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "ends_at not strictly after starts_at." }
  - { id: ERR_HOLD_EXPIRED, http: 409, condition: "Confirm attempted after the 30-minute hold window elapsed." }
  - { id: ERR_PARTY_SIZE_INVALID, http: 422, condition: "Membership party_size violates tier composition rule." }
  - { id: ERR_SHOW_CAPACITY_EXCEEDED, http: 409, condition: "seats_sold + requested seats exceeds venue.seated_capacity." }
  - { id: ERR_SESSION_FULL, http: 409, condition: "Internal over-capacity force-enroll attempted (enroll path auto-waitlists instead)." }
  - { id: ERR_OVERFULFILLMENT, http: 422, condition: "Contribution would push received_cents above pledged_cents." }
  - { id: ERR_ACCOMMODATION_SUBJECT_MISMATCH, http: 422, condition: "subject_type does not match exactly one of show_booking_id/registration_id/rental_event_id." }
  - { id: ERR_VALIDATION, http: 422, condition: "Generic semantic validation failure (numeric range/constraint) not covered by a more specific code." }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit/offset out of allowed range (limit 1..100, offset >= 0)." }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FacilityAdmin
    description: "Manages venues and runs system clock/sweep operations."
    identity: opaque
    exclusive_operations:
      - "POST /venues"
      - "POST /_clock/set_current_utc"
      - "POST /_sweeps/run"
    shared_operations:
      - "GET /venues"
      - "GET /venues/{id}"
      - "GET /shows"
      - "GET /rentals"
  - name: BoxOfficeOperator
    description: "Schedules shows and manages individual show bookings."
    identity: opaque
    exclusive_operations:
      - "POST /shows"
      - "POST /shows/{id}/open"
      - "POST /shows/{id}/cancel"
      - "POST /shows/{id}/complete"
      - "POST /show-bookings"
      - "POST /show-bookings/{id}/confirm"
      - "POST /show-bookings/{id}/cancel"
      - "POST /show-bookings/{id}/refund"
    shared_operations:
      - "GET /shows"
      - "GET /shows/{id}"
      - "GET /show-bookings"
      - "GET /show-bookings/{id}"
      - "GET /memberships"
      - "GET /memberships/{id}"
      - "GET /memberships/{id}/astc-status"
      - "GET /group-bookings"
      - "GET /venues"
      - "GET /venues/{id}"
      - "GET /venues/{id}/shows"
  - name: GroupSalesAgent
    description: "Handles field-trip and group block bookings."
    identity: opaque
    exclusive_operations:
      - "POST /group-bookings"
      - "POST /group-bookings/{id}/pay-deposit"
      - "POST /group-bookings/{id}/confirm"
      - "POST /group-bookings/{id}/cancel"
    shared_operations:
      - "GET /group-bookings"
      - "GET /group-bookings/{id}"
      - "GET /shows"
      - "GET /shows/{id}"
      - "GET /venues"
      - "GET /venues/{id}"
      - "GET /venues/{id}/shows"
  - name: MembershipClerk
    description: "Manages memberships and ASTC reciprocal status."
    identity: opaque
    exclusive_operations:
      - "POST /memberships"
      - "POST /memberships/{id}/activate"
      - "POST /memberships/{id}/cancel"
    shared_operations:
      - "GET /memberships"
      - "GET /memberships/{id}"
      - "GET /memberships/{id}/astc-status"
      - "GET /programs"
  - name: ProgramCoordinator
    description: "Manages camp/class sessions and participant registrations."
    identity: opaque
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{id}/start"
      - "POST /programs/{id}/cancel"
      - "POST /registrations"
      - "POST /registrations/{id}/cancel"
    shared_operations:
      - "GET /programs"
      - "GET /programs/{id}"
      - "GET /registrations"
      - "GET /registrations/{id}"
      - "GET /memberships/{id}"
      - "GET /venues"
      - "GET /venues/{id}/programs"
  - name: EventsManager
    description: "Manages private/birthday rental events."
    identity: opaque
    exclusive_operations:
      - "POST /rentals"
      - "POST /rentals/{id}/hold"
      - "POST /rentals/{id}/confirm"
      - "POST /rentals/{id}/cancel"
    shared_operations:
      - "GET /rentals"
      - "GET /rentals/{id}"
      - "GET /venues"
      - "GET /venues/{id}"
      - "GET /venues/{id}/rentals"
  - name: DevelopmentOfficer
    description: "Manages donors/sponsors and their contributions."
    identity: opaque
    exclusive_operations:
      - "POST /sponsors"
      - "POST /sponsors/{id}/contributions"
      - "POST /sponsors/{id}/lapse"
    shared_operations:
