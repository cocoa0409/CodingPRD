# =============================================================================
# Home Security & Alarm Monitoring — Scaffold (§1.0–§1.7)
# Scenario 222
# =============================================================================

scenario: "222. Home Security & Alarm Monitoring: system/sensor inventory, monitoring-plan tier, alarm event/signal routing, false-alarm permit & fines, dispatch (police/fire/medical), test mode, contract term/cancellation, cellular/backup health"

domain_name: home-security-alarm-monitoring
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: posture-driven gating
  secondary_archetype: workflow orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer top-level collections (/accounts, /systems, /sensors, /alarm-events,
  # /dispatches, /permits, /fines, /monitoring-plans) linked by FK fields in
  # request bodies and discoverable via FK filter params on each list endpoint.

  state_machine_shape: posture_driven
  # SecuritySystem.arming_state gates AlarmEvent acceptance; Account.contract_status
  # + communicator_health derive monitoring_status which gates alarm processing;
  # AlarmEvent has a branching fork-join (ROUTED -> {DISPATCHED -> RESOLVED_REAL |
  # RESOLVED_FALSE} and a suppression branch).

  relationship_patterns:
    - one_to_many
    - cross_aggregate

  role_model: peer_roles
  # Subscriber owns their Account/system; MonitoringOperator routes alarms and
  # orders dispatch; Administrator manages plans, contract lifecycle, permits.

  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: MonitoringPlan
    parent: null
    common_fields: false
    # Configuration entity: immutable price-book row. Only id + created_at.
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits" }
      - { name: tier, type: enum, source: input, description: "Plan tier", constraints: "one of {BASIC, PLUS, PRO}; unique across plans" }
      - { name: monthly_fee_cents, type: integer, source: input, description: "Monthly monitoring fee in cents", constraints: ">= 0" }
      - { name: police_dispatch_included, type: boolean, source: input, description: "If true, POLICE dispatch incurs no per-dispatch fee on this tier" }
      - { name: max_sensors, type: integer, source: input, description: "Maximum sensors permitted on a system under this plan", constraints: ">= 1" }
      - { name: cellular_backup_included, type: boolean, source: input, description: "If true, systems on this plan may register a CELLULAR communicator path" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: premises_type, type: enum, source: input, description: "Drives permit fee uplift", constraints: "one of {RESIDENTIAL, COMMERCIAL}" }
      - { name: plan_id, type: string, source: input, description: "FK -> MonitoringPlan.id; the active monitoring plan" }
      - { name: contract_status, type: enum, source: system, description: "Contract lifecycle posture", constraints: "one of {PENDING, ACTIVE, CANCELLATION_REQUESTED, CANCELLED}" }
      - { name: monitoring_status, type: enum, source: computed, description: "Derived service posture gating alarm processing", constraints: "one of {ACTIVE, SUSPENDED, TERMINATED}" }
      - { name: contract_start_utc, type: datetime, source: system, description: "Set when contract activates; null while PENDING" }
      - { name: contract_term_months, type: integer, source: input, description: "Committed term length in months", constraints: ">= 1" }
      - { name: cycle_anchor_utc, type: datetime, source: system, description: "Start of the current 30-day billing cycle; set at activation" }
      - { name: current_tier, type: enum, source: system, description: "Tier of the plan in effect at cycle_anchor (proration baseline)", constraints: "one of {BASIC, PLUS, PRO}" }
      - { name: monitoring_balance_cents, type: integer, source: computed, description: "Accrued monitoring + dispatch charges owed for the current cycle, in cents; never negative" }
      - { name: false_alarm_count_cycle, type: integer, source: computed, description: "Count of non-waived FALSE_ALARM AlarmEvents under this account since the permit cycle anchor" }
      - { name: early_termination_fee_cents, type: integer, source: computed, description: "Fee frozen at cancellation request if term not yet elapsed; 0 once term elapsed or after withdrawal" }

  - name: SecuritySystem
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; owning account" }
      - { name: arming_state, type: enum, source: system, description: "Arm posture gating alarm acceptance", constraints: "one of {DISARMED, ARMED_STAY, ARMED_AWAY}" }
      - { name: test_mode, type: boolean, source: system, description: "When true, alarms are logged but never routed to dispatch", default: false }
      - { name: test_mode_expires_utc, type: datetime, source: system, description: "Auto-clear instant for test mode; null when test_mode is false" }
      - { name: primary_path, type: enum, source: input, description: "Primary communicator path", constraints: "one of {BROADBAND, CELLULAR}" }
      - { name: cellular_signal_dbm, type: integer, source: input, description: "Last reported cellular RSSI in dBm (negative; closer to 0 is stronger)" }
      - { name: backup_battery_pct, type: integer, source: input, description: "Backup battery charge percentage", constraints: "0..100" }
      - { name: last_checkin_minutes_ago, type: integer, source: input, description: "Minutes since the communicator last checked in", constraints: ">= 0" }
      - { name: communicator_health, type: enum, source: computed, description: "Derived health from signal/battery/checkin", constraints: "one of {HEALTHY, DEGRADED, OFFLINE}" }
      - { name: sensor_count, type: integer, source: computed, description: "Number of non-REMOVED Sensor rows under this system" }

  - name: Sensor
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> SecuritySystem.id; owning system" }
      - { name: zone_number, type: integer, source: input, description: "Physical zone identifier", constraints: ">= 1; unique among non-REMOVED sensors within a system" }
      - { name: sensor_type, type: enum, source: input, description: "Sensor kind", constraints: "one of {DOOR, MOTION, GLASS_BREAK, SMOKE, CO, PANIC}" }
      - { name: status, type: enum, source: system, description: "Sensor lifecycle", constraints: "one of {ENROLLED, BYPASSED, REMOVED}" }

  - name: AlarmEvent
    parent: null
    common_fields: true
    fields:
      - { name: system_id, type: string, source: input, description: "FK -> SecuritySystem.id; system that raised the signal" }
      - { name: sensor_id, type: string, source: input, description: "FK -> Sensor.id; the triggering sensor" }
      - { name: signal_type, type: enum, source: input, description: "Raw signal classification", constraints: "one of {BURGLARY, FIRE, MEDICAL, PANIC}" }
      - { name: status, type: enum, source: system, description: "Event lifecycle", constraints: "one of {RECEIVED, ROUTED, DISPATCHED, RESOLVED_REAL, RESOLVED_FALSE, SUPPRESSED}" }
      - { name: routed_service, type: enum, source: system, description: "Service the signal was routed to; null until ROUTED", constraints: "one of {POLICE, FIRE, MEDICAL}" }
      - { name: raised_utc, type: datetime, source: system, description: "Server timestamp when the signal was received" }
      - { name: resolution, type: enum, source: system, description: "Final disposition; null until resolved", constraints: "one of {REAL, FALSE_ALARM}" }
      - { name: chargeable_ordinal, type: integer, source: computed, description: "1-based position of this event among non-waived chargeable false alarms in the account's current permit cycle; null unless resolved FALSE_ALARM" }

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - { name: alarm_event_id, type: string, source: system, description: "FK -> AlarmEvent.id; the event that produced this dispatch" }
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; account billed for the dispatch fee" }
      - { name: service, type: enum, source: system, description: "Responder type", constraints: "one of {POLICE, FIRE, MEDICAL}" }
      - { name: status, type: enum, source: system, description: "Dispatch lifecycle", constraints: "one of {ORDERED, CONFIRMED, CANCELLED}" }
      - { name: fee_cents, type: integer, source: computed, description: "Per-dispatch fee charged to the account when ORDERED; reversed on CANCELLED" }

  - name: Permit
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; permitted account" }
      - { name: permit_number, type: string, source: input, description: "Jurisdiction-issued permit number", constraints: "unique across permits" }
      - { name: status, type: enum, source: system, description: "Permit validity", constraints: "one of {ACTIVE, EXPIRED, REVOKED}" }
      - { name: filed_days_late, type: integer, source: input, description: "Days the permit application was filed past the deadline; drives late penalty", constraints: ">= 0" }
      - { name: cycle_anchor_utc, type: datetime, source: system, description: "Start of the permit's current false-alarm counting cycle; set at issuance" }
      - { name: fee_total_cents, type: integer, source: computed, description: "Issuance fee = base + commercial uplift + late penalty, in cents" }

  - name: Fine
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> Account.id; fined account" }
      - { name: alarm_event_id, type: string, source: system, description: "FK -> AlarmEvent.id; the false alarm that triggered this fine" }
      - { name: amount_cents, type: integer, source: computed, description: "Fine amount from the tiered schedule plus no-permit surcharge, in cents" }
      - { name: settlement_status, type: enum, source: system, description: "Fine lifecycle", constraints: "one of {ASSESSED, PAID, WAIVED}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  - entity: Account
    initial_state: PENDING       # contract_status
    terminal_states: [CANCELLED]
    note: |
      Tracks contract_status. monitoring_status is a derived field (see §1.3
      monitoring_status), NOT a directly-set column: ACTIVE while contract ACTIVE
      and communicator not OFFLINE; SUSPENDED while contract ACTIVE but the
      system is OFFLINE (or while PENDING); TERMINATED once CANCELLED.
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /accounts/{id}/activate"
        actor: Administrator
        preconditions:
          - "contract_status == PENDING"
          - "account has at least one SecuritySystem with sensor_count >= 1"
          - "referenced MonitoringPlan exists"
        side_effects:
          - "Set contract_start_utc = current clock, cycle_anchor_utc = current clock"
          - "Set current_tier = the tier of the account's plan_id"
          - "monitoring_balance_cents recomputed (fresh cycle, see §1.3 monitoring_balance)"

      - from: ACTIVE
        to: CANCELLATION_REQUESTED
        trigger: "POST /accounts/{id}/request-cancellation"
        actor: [Subscriber, Administrator]
        preconditions:
          - "contract_status == ACTIVE"
        side_effects:
          - "Compute early_termination_fee_cents per §1.3 early_termination_fee (frozen at request time)"
          - "increments Account.version by 1"

      - from: CANCELLATION_REQUESTED
        to: ACTIVE
        trigger: "POST /accounts/{id}/withdraw-cancellation"
        actor: [Subscriber, Administrator]
        preconditions:
          - "contract_status == CANCELLATION_REQUESTED"
        side_effects:
          - "Reset early_termination_fee_cents to 0"
          - "increments Account.version by 1"

      - from: CANCELLATION_REQUESTED
        to: CANCELLED
        trigger: "POST /accounts/{id}/finalize-cancellation"
        actor: Administrator
        preconditions:
          - "contract_status == CANCELLATION_REQUESTED"
          - "expected_account_version matches Account.version (OCC)"
        side_effects:
          - "contract_status -> CANCELLED; monitoring_status derives to TERMINATED"
          - "CASCADE step 1: every SecuritySystem under the account -> arming_state DISARMED, test_mode cleared"
          - "CASCADE step 2 (caused by step 1's disarm): each system's still-open (RECEIVED, ROUTED, or DISPATCHED) AlarmEvents -> SUPPRESSED"
          - "CASCADE step 3 (caused by step 2's suppression): each such AlarmEvent's ORDERED Dispatch -> CANCELLED, reversing fee_cents from monitoring_balance_cents"
          - "increments Account.version by 1"
        note: "Finalize forcibly sweeps open events including DISPATCHED ones; there is no separate open-dispatch block on finalize (the change-plan path carries that guard instead, §1.4 priority 15)."

  # ---------------------------------------------------------------------------
  - entity: SecuritySystem
    initial_state: DISARMED       # arming_state
    terminal_states: []
    note: "arming_state is cyclic: DISARMED <-> ARMED_STAY <-> ARMED_AWAY freely while the account is ACTIVE."
    transitions:
      - from: DISARMED
        to: ARMED_AWAY
        trigger: "POST /systems/{id}/arm with mode=ARMED_AWAY"
        actor: Subscriber
        preconditions:
          - "owning Account.contract_status == ACTIVE"
          - "communicator_health != OFFLINE"
          - "test_mode == false"
        side_effects: []

      - from: DISARMED
        to: ARMED_STAY
        trigger: "POST /systems/{id}/arm with mode=ARMED_STAY"
        actor: Subscriber
        preconditions:
          - "owning Account.contract_status == ACTIVE"
          - "communicator_health != OFFLINE"
          - "test_mode == false"
        side_effects: []

      - from: [ARMED_STAY, ARMED_AWAY]
        to: DISARMED
        trigger: "POST /systems/{id}/disarm"
        actor: Subscriber
        preconditions:
          - "arming_state in {ARMED_STAY, ARMED_AWAY}"
        side_effects:
          - "RECEIVED AlarmEvents on this system whose signal_type==BURGLARY (not yet ROUTED) -> RESOLVED_FALSE; FIRE/MEDICAL/PANIC events are unaffected"

      - from: [ARMED_STAY, ARMED_AWAY, DISARMED]
        to: DISARMED
        trigger: "POST /systems/{id}/enter-test-mode"
        actor: [Subscriber, MonitoringOperator]
        preconditions:
          - "owning Account.contract_status == ACTIVE"
          - "TEMPORAL-OVERLAP (half-open [enter, expires) window, adjacency allowed): no test-mode window currently open, i.e. test_mode == false OR current clock >= test_mode_expires_utc. Re-entry exactly at test_mode_expires_utc is permitted; an earlier re-entry is rejected ERR_TEST_MODE_ALREADY_OPEN"
        side_effects:
          - "test_mode -> true; test_mode_expires_utc = current clock + TEST_MODE_WINDOW_MINUTES (120)"
          - "arming_state forced to DISARMED"

  # ---------------------------------------------------------------------------
  - entity: AlarmEvent
    initial_state: RECEIVED       # status
    terminal_states: [RESOLVED_REAL, RESOLVED_FALSE, SUPPRESSED]
    note: |
      Branching fork-join: RECEIVED -> ROUTED -> DISPATCHED -> {RESOLVED_REAL,
      RESOLVED_FALSE} with divergent side-effects per terminal; plus a suppression
      branch RECEIVED -> SUPPRESSED that fires no dispatch.
    transitions:
      - from: RECEIVED
        to: SUPPRESSED
        trigger: "system, at signal receipt (POST /alarm-events)"
        actor: system
        preconditions:
          - "raising SecuritySystem.test_mode == true, OR raising SecuritySystem.arming_state == DISARMED for signal_type==BURGLARY"
        side_effects:
          - "No routing, no dispatch; event logged only"
        note: "Test-mode and disarmed-burglary signals never escalate."

      - from: [RECEIVED, ROUTED, DISPATCHED]
        to: SUPPRESSED
        trigger: "system cascade on account finalize-cancellation (system force-disarm)"
        actor: system
        preconditions:
          - "owning Account.contract_status transitioning to CANCELLED"
        side_effects:
          - "Any ORDERED Dispatch on the event -> CANCELLED with fee_cents reversal (see Dispatch SM)"
        note: "Cascade-only suppression; forcibly terminates open events of any pre-terminal status when the account is cancelled."

      - from: RECEIVED
        to: ROUTED
        trigger: "POST /alarm-events/{id}/route"
        actor: MonitoringOperator
        preconditions:
          - "status == RECEIVED"
          - "raising SecuritySystem.test_mode == false"
          - "owning Account.monitoring_status == ACTIVE"
        side_effects:
          - "Set routed_service per §1.3 signal_routing (BURGLARY/PANIC->POLICE, FIRE->FIRE, MEDICAL->MEDICAL)"

      - from: ROUTED
        to: DISPATCHED
        trigger: "POST /alarm-events/{id}/dispatch"
        actor: MonitoringOperator
        preconditions:
          - "status == ROUTED"
        side_effects:
          - "Create a Dispatch{service=routed_service, status=ORDERED} (account_id = the event's account)"
          - "LEDGER SYNC: charge fee_cents to Account.monitoring_balance_cents per §1.3 dispatch_fee"

      - from: DISPATCHED
        to: RESOLVED_REAL
        trigger: "POST /alarm-events/{id}/resolve with resolution=REAL"
        actor: MonitoringOperator
        preconditions:
          - "status == DISPATCHED"
        side_effects:
          - "resolution -> REAL; linked Dispatch -> CONFIRMED (fee retained)"

      - from: DISPATCHED
        to: RESOLVED_FALSE
        trigger: "POST /alarm-events/{id}/resolve with resolution=FALSE_ALARM"
        actor: MonitoringOperator
        preconditions:
          - "status == DISPATCHED"
        side_effects:
          - "resolution -> FALSE_ALARM; linked Dispatch -> CONFIRMED (fee retained)"
          - "HOP 1: Account.false_alarm_count_cycle increments (non-waived FALSE_ALARM tally rises)"
          - "HOP 2 (caused by the HOP-1 count change): assign this event's chargeable_ordinal = new count; create Fine{amount_cents per §1.3 false_alarm_fine, settlement_status=ASSESSED}"

  # ---------------------------------------------------------------------------
  - entity: Dispatch
    initial_state: ORDERED        # status
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: ORDERED
        to: CONFIRMED
        trigger: "system, when the linked AlarmEvent resolves (REAL or FALSE_ALARM)"
        actor: system
        preconditions:
          - "status == ORDERED"
        side_effects:
          - "Dispatch fee retained on Account.monitoring_balance_cents"

      - from: ORDERED
        to: CANCELLED
        trigger: "POST /dispatches/{id}/cancel OR system cascade on account finalize-cancellation"
        actor: [MonitoringOperator, system]
        preconditions:
          - "status == ORDERED"
        side_effects:
          - "COMPENSATION: reverse fee_cents from Account.monitoring_balance_cents (balance returns to pre-dispatch value)"

  # ---------------------------------------------------------------------------
  - entity: Sensor
    initial_state: ENROLLED       # status
    terminal_states: [REMOVED]
    note: "BYPASSED <-> ENROLLED is a revert cycle; REMOVED is terminal."
    transitions:
      - from: ENROLLED
        to: BYPASSED
        trigger: "POST /sensors/{id}/bypass"
        actor: [Subscriber, Administrator]
        preconditions:
          - "status == ENROLLED"
        side_effects:
          - "Sensor excluded from arming faults but still counts toward sensor_count"

      - from: BYPASSED
        to: ENROLLED
        trigger: "POST /sensors/{id}/restore"
        actor: [Subscriber, Administrator]
        preconditions:
          - "status == BYPASSED"
        side_effects: []

      - from: [ENROLLED, BYPASSED]
        to: REMOVED
        trigger: "POST /sensors/{id}/remove"
        actor: Administrator
        preconditions:
          - "status in {ENROLLED, BYPASSED}"
        side_effects:
          - "COMPENSATION of enrollment: system.sensor_count decremented by 1 (sensor_count conserved across enroll+remove)"

  # ---------------------------------------------------------------------------
  - entity: Permit
    initial_state: ACTIVE         # status
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: Administrator
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "Subsequent false-alarm fines on this account add the no-permit surcharge (see §1.3 false_alarm_fine)"

      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /permits/{id}/expire"
        actor: [Administrator, system]
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "Subsequent false-alarm fines on this account add the no-permit surcharge (see §1.3 false_alarm_fine)"

  # ---------------------------------------------------------------------------
  - entity: Fine
    initial_state: ASSESSED       # settlement_status
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: ASSESSED
        to: PAID
        trigger: "POST /fines/{id}/pay"
        actor: [Subscriber, Administrator]
        preconditions:
          - "settlement_status == ASSESSED"
        side_effects: []

      - from: ASSESSED
        to: WAIVED
        trigger: "POST /fines/{id}/waive"
        actor: Administrator
        preconditions:
          - "settlement_status == ASSESSED"
        side_effects:
          - "Waived fines are excluded from false_alarm_count_cycle going forward, but do NOT renumber already-assigned chargeable_ordinal values on prior events"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: plan-change-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/change-plan"
    occ_field: "expected_account_version"
    description: |
      Changing an Account's monitoring plan mid-cycle records a proration segment
      boundary against the version the client last observed. If the account's
      version has advanced since that read — because another writer already
      committed a plan change (which legitimately supersedes the prior segment and
      re-anchors proration) — the write is rejected as stale. Two strictly
      sequential change-plan calls carrying the same observed version reproduce
      this: the first advances version, the second is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cancel-finalize-stale-account
    parent_entity: Account
    write_endpoint: "POST /accounts/{id}/finalize-cancellation"
    occ_field: "expected_account_version"
    description: |
      Finalizing a cancellation against an Account whose version advanced since the
      operator last read it is rejected. This captures the case where another writer
      has already withdrawn the cancellation (returning the account to ACTIVE and
      bumping version), so the finalize view is stale and would otherwise terminate
      a contract the customer has since chosen to keep.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: monitoring_proration
    trigger: "POST /accounts/{id}/change-plan (mid-cycle tier change); folded into monitoring_balance on every Account read"
    algorithm: chronological
    formula: |
      Pinned FINAL algorithm (chronological, day-by-day):
        The cycle covers days [0, 30) measured from cycle_anchor_utc.
        For each whole day d that has elapsed up to the evaluation instant,
        active_tier(d) = tier in effect at 00:00 UTC of day d (the most recent
        change-plan segment boundary on or before d, else current_tier at anchor).
        daily_charge(d) = round_half_up(plan(active_tier(d)).monthly_fee_cents / 30)
        monitoring_proration = SUM over elapsed days d of daily_charge(d)
      ROUNDING ORDER IS PINNED: round EACH day to cents FIRST, THEN sum. Do NOT sum
      the daily fractions and round once at the end.
    input_set: "Elapsed days from cycle_anchor_utc to the evaluation clock; tier segments from change-plan history"
    constants:
      CYCLE_DAYS: 30
    precision: "integer cents, round_half_up per day"
    variants:
      - name: forward_estimate
        when: "Quoted at change-plan time as a projection over whole-cycle shares"
        difference: "Computes per-SEGMENT (old_tier * elapsed_days/30 + new_tier * remaining_days/30) rounding ONCE per segment, NOT per day; for a BASIC->PLUS change at day 7 (fees 1500/3100) this yields 2727 vs the FINAL day-by-day 2719"
      - name: final_chronological
        when: "Authoritative value folded into monitoring_balance_cents"
        difference: "Per-day round-then-sum as pinned above"

  - name: false_alarm_fine
    trigger: "AlarmEvent DISPATCHED -> RESOLVED_FALSE side-effect (Fine creation)"
    algorithm: tiered_pricing
    formula: |
      Let n = chargeable_ordinal of this false alarm (1-based, see chargeable_ordinal).
      base =
        0                       if n <= FREE_ALLOWANCE            (n in {1,2})
        WARN_FINE_CENTS         if FREE_ALLOWANCE < n <= FREE_ALLOWANCE+WARN_BAND   (n in {3,4,5})
        ESCALATED_FINE_CENTS    if n > FREE_ALLOWANCE+WARN_BAND   (n >= 6)
      surcharge = NO_PERMIT_SURCHARGE_CENTS  if the account has NO Permit in status
                                              ACTIVE at the resolution instant, else 0
      amount_cents = base + surcharge
    input_set: "chargeable_ordinal of this event; account's permit status at resolution"
    constants:
      FREE_ALLOWANCE: 2
      WARN_BAND: 3
      WARN_FINE_CENTS: 5000
      ESCALATED_FINE_CENTS: 10000
      NO_PERMIT_SURCHARGE_CENTS: 7500
    precision: "integer cents"

  - name: chargeable_ordinal
    trigger: "AlarmEvent DISPATCHED -> RESOLVED_FALSE (assigned before fine computation)"
    algorithm: aggregation
    formula: |
      Among the account's AlarmEvents with resolution==FALSE_ALARM whose linked
      Fine.settlement_status != WAIVED and whose raised_utc >= the account's ACTIVE
      Permit cycle_anchor_utc (if no ACTIVE permit, use Account.cycle_anchor_utc),
      order by raised_utc ASC, then created_at ASC as the deterministic tie-break
      (NEVER by id). chargeable_ordinal of THIS event is its 1-based position in that
      ordering (count of non-waived chargeable false alarms at or before this one).
    input_set: "Non-waived FALSE_ALARM events since the permit cycle anchor"
    precision: "integer, 1-based"
    variants:
      - name: net_of_waived
        when: "Authoritative ordinal used to price the fine — the pinned algorithm above"
        difference: "Excludes events whose Fine.settlement_status==WAIVED, so a later false alarm can land in a cheaper tier than its raw chronological position"
      - name: gross_chronological
        when: "Naive count of all FALSE_ALARM events regardless of waiver"
        difference: "Counts WAIVED fines too; for an account whose 1st fine was waived, the 3rd raw false alarm is ordinal 3 (WARN=5000) under gross but ordinal 2 (FREE=0) under the pinned net_of_waived"

  - name: dispatch_fee
    trigger: "AlarmEvent ROUTED -> DISPATCHED (Dispatch creation, LEDGER SYNC onto Account.monitoring_balance_cents)"
    algorithm: threshold
    formula: |
      service = AlarmEvent.routed_service
      fee_cents =
        0                          if service==POLICE AND plan(account.plan_id).police_dispatch_included == true
        POLICE_DISPATCH_FEE_CENTS  if service==POLICE AND police_dispatch_included == false
        FIRE_DISPATCH_FEE_CENTS    if service==FIRE
        MEDICAL_DISPATCH_FEE_CENTS if service==MEDICAL
      On creation: Account.monitoring_balance_cents += fee_cents
      On Dispatch CANCELLED: Account.monitoring_balance_cents -= fee_cents (compensation)
    input_set: "routed_service of the event; police_dispatch_included flag of the account's plan"
    constants:
      POLICE_DISPATCH_FEE_CENTS: 2500
      FIRE_DISPATCH_FEE_CENTS: 4000
      MEDICAL_DISPATCH_FEE_CENTS: 4000
    precision: "integer cents"

  - name: signal_routing
    trigger: "AlarmEvent RECEIVED -> ROUTED (route action); also houses the debounce / test-mode-window temporal constants"
    algorithm: threshold
    formula: |
      routed_service =
        POLICE  if signal_type in {BURGLARY, PANIC}
        FIRE    if signal_type == FIRE
        MEDICAL if signal_type == MEDICAL
      Debounce (buffer semantics): a new alarm-event from the same sensor whose
      raised_utc is within SIGNAL_DEBOUNCE_SECONDS of a still-open (RECEIVED/ROUTED/
      DISPATCHED) prior event from that sensor is rejected (ERR_SIGNAL_DEBOUNCED).
      Events spaced strictly more than SIGNAL_DEBOUNCE_SECONDS apart never collide.
    input_set: "signal_type of the event; raised_utc deltas to prior open events on the same sensor"
    constants:
      SIGNAL_DEBOUNCE_SECONDS: 60
      TEST_MODE_WINDOW_MINUTES: 120
    precision: "enum"

  - name: permit_fee
    trigger: "POST /permits (Permit issuance)"
    algorithm: tiered_pricing
    formula: |
      base = BASE_PERMIT_FEE_CENTS + (COMMERCIAL_UPLIFT_CENTS if account.premises_type==COMMERCIAL else 0)
      late_penalty =
        0                                                              if filed_days_late == 0
        min(round_half_up(BASE_PERMIT_FEE_CENTS * LATE_PCT_PER_PERIOD * ceil(filed_days_late / LATE_PERIOD_DAYS)), LATE_CAP_CENTS)
                                                                       if filed_days_late > 0
      fee_total_cents = base + late_penalty
    input_set: "premises_type of the account; filed_days_late of the permit"
    constants:
      BASE_PERMIT_FEE_CENTS: 5000
      COMMERCIAL_UPLIFT_CENTS: 3000
      LATE_PCT_PER_PERIOD: 0.20
      LATE_PERIOD_DAYS: 30
      LATE_CAP_CENTS: 4000
    precision: "integer cents, round_half_up then cap"

  - name: communicator_health
    trigger: "On SecuritySystem create/telemetry update; recomputed on every system read"
    algorithm: threshold
    formula: |
      primary_ok = (last_checkin_minutes_ago <= CHECKIN_MAX_MINUTES)
      if not primary_ok: communicator_health = OFFLINE
      else:
        signal_ok  = (cellular_signal_dbm >= SIGNAL_MIN_DBM)   # >= boundary, inclusive
        battery_ok = (backup_battery_pct  >= BATTERY_MIN_PCT)  # >= boundary, inclusive
        communicator_health = HEALTHY if (signal_ok AND battery_ok) else DEGRADED
    input_set: "last_checkin_minutes_ago, cellular_signal_dbm, backup_battery_pct"
    constants:
      CHECKIN_MAX_MINUTES: 360
      SIGNAL_MIN_DBM: -85
      BATTERY_MIN_PCT: 20
    precision: "enum"

  - name: early_termination_fee
    trigger: "ACTIVE -> CANCELLATION_REQUESTED (frozen at request); reset to 0 on withdraw"
    algorithm: threshold
    formula: |
      elapsed_months = floor( (request_clock - contract_start_utc) / 30 days )
      remaining_months = max(0, contract_term_months - elapsed_months)
      early_termination_fee_cents =
        0                                                  if remaining_months == 0
        remaining_months * ETF_PER_REMAINING_MONTH_CENTS   if remaining_months > 0
    input_set: "contract_start_utc, contract_term_months, request clock"
    constants:
      ETF_PER_REMAINING_MONTH_CENTS: 2000
    precision: "integer cents"

  - name: monitoring_status
    trigger: "Derived on every Account read and on contract/communicator state change"
    algorithm: aggregation
    formula: |
      if contract_status == CANCELLED:  monitoring_status = TERMINATED
      elif contract_status == PENDING:  monitoring_status = SUSPENDED (no service before activation)
      elif (the account's SecuritySystem with the worst health is OFFLINE):
                                        monitoring_status = SUSPENDED
      else (contract_status in {ACTIVE, CANCELLATION_REQUESTED} and no system OFFLINE):
                                        monitoring_status = ACTIVE
    input_set: "contract_status; communicator_health of the account's systems"
    precision: "enum"

  - name: monitoring_balance
    trigger: "Recomputed on activate, change-plan, dispatch create/cancel, and on every Account read"
    algorithm: aggregation
    formula: |
      monitoring_balance_cents =
        monitoring_proration (FINAL, see monitoring_proration)
        + SUM(Dispatch.fee_cents for dispatches on this account in status ORDERED or CONFIRMED)
      Cancelled dispatches contribute 0. Floor the result at 0 (never negative).
    input_set: "Account proration to date + non-cancelled dispatch fees"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path-referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all path-scoped endpoints

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys (plan_id, account_id, system_id, sensor_id) resolve to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "POST /accounts, POST /systems, POST /sensors, POST /alarm-events, POST /permits"

  - priority: 5
    category: business_referential
    check: "For entity_backed Subscriber, X-User-ID must equal the owning Account.id of the targeted resource"
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "Subscriber-acting endpoints (arm, disarm, request/withdraw cancellation, pay fine)"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: business_safety
    check: "An alarm-event may be ROUTED only when the raising system test_mode==false (test-mode signals never escalate)"
    error_id: ERR_TEST_MODE_ACTIVE
    http_status: 409
    applies_to: "POST /alarm-events/{id}/route"

  - priority: 8
    category: business_safety
    check: "A system may be ARMED only when communicator_health != OFFLINE (cannot arm a system that cannot signal the monitoring center)"
    error_id: ERR_COMMUNICATOR_OFFLINE
    http_status: 409
    applies_to: "POST /systems/{id}/arm"

  - priority: 9
    category: business_constraint
    check: "A CELLULAR primary_path may only be set on a system whose plan has cellular_backup_included==true"
    error_id: ERR_CELLULAR_NOT_ENTITLED
    http_status: 422
    applies_to: "POST /systems, PATCH /systems/{id}"

  - priority: 10
    category: business_constraint
    check: "Enrolling a sensor must not push the system's sensor_count above plan.max_sensors"
    error_id: ERR_SENSOR_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /sensors"

  - priority: 11
    category: business_constraint
    check: "zone_number must be unique among non-REMOVED sensors on the same system"
    error_id: ERR_DUPLICATE_ZONE
    http_status: 409
    applies_to: "POST /sensors"

  - priority: 12
    category: business_constraint
    check: "An account may hold at most one Permit in status ACTIVE at a time"
    error_id: ERR_PERMIT_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /permits"

  - priority: 13
    category: business_temporal
    check: "Test-mode window overlap (half-open [enter, expires) semantics, adjacency allowed): a system already has an open window when current clock < test_mode_expires_utc; entering again before it elapses is rejected. Re-entry exactly at test_mode_expires_utc is allowed."
    error_id: ERR_TEST_MODE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /systems/{id}/enter-test-mode"

  - priority: 14
    category: business_temporal
    check: "Signal debounce window (buffer/gap semantics, NOT interval occupation): a new alarm-event from the same sensor whose raised_utc is within SIGNAL_DEBOUNCE_SECONDS of a still-open (RECEIVED/ROUTED/DISPATCHED) prior event from that sensor is rejected as a duplicate. Events spaced strictly more than 60s apart never collide."
    error_id: ERR_SIGNAL_DEBOUNCED
    http_status: 409
    applies_to: "POST /alarm-events"

  - priority: 15
    category: business_temporal
    check: "change-plan is blocked while any AlarmEvent under the account is in status DISPATCHED (an open responder dispatch must resolve before re-anchoring the proration cycle)"
    error_id: ERR_OPEN_DISPATCH
    http_status: 409
    applies_to: "POST /accounts/{id}/change-plan"

  - priority: 16
    category: state
    check: "OCC: expected_account_version must equal the account's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /accounts/{id}/change-plan, POST /accounts/{id}/finalize-cancellation"

  # Request-body well-formedness. Logically enforced right after auth (before
  # existence), but listed here so it never preempts the priority-conflict rows
  # above; it only fires when the body itself is malformed (missing required
  # field, bad enum member, out-of-range number).
  - priority: 17
    category: existence
    check: "Request body is well-formed: all required input fields present, enum members valid, numeric ranges respected"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST/PATCH endpoints with an input body"

  - priority: 18
    category: business_constraint
    check: "permit_number is unique across all permits (any account)"
    error_id: ERR_DUPLICATE_PERMIT_NUMBER
    http_status: 409
    applies_to: "POST /permits"

# =============================================================================
# §1.5 API Endpoint Table  (flat top-level collections; api_prefix = /)
# =============================================================================
endpoints:
  # ----- MonitoringPlan (configuration) -----
  - method: POST
    path: "/monitoring-plans"
    description: "Create a monitoring plan tier"
    roles: [Administrator]
    code: 201
    input: [tier, monthly_fee_cents, police_dispatch_included, max_sensors, cellular_backup_included]
    output: MonitoringPlan
    side_effects: []

  - method: GET
    path: "/monitoring-plans/{id}"
    description: "Get a monitoring plan"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: []
    output: MonitoringPlan
    side_effects: []

  - method: GET
    path: "/monitoring-plans"
    description: "List monitoring plans"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: ["limit?", "offset?", "tier?"]
    output: MonitoringPlan[]
    side_effects: []

  # ----- Account -----
  - method: POST
    path: "/accounts"
    description: "Create an account (contract PENDING)"
    roles: [Administrator]
    code: 201
    input: [premises_type, plan_id, contract_term_months]
    output: Account
    side_effects:
      - "contract_status=PENDING, monitoring_status derives to SUSPENDED, all balances/counters 0"

  - method: GET
    path: "/accounts/{id}"
    description: "Get account (recomputes monitoring_status, monitoring_balance_cents, false_alarm_count_cycle)"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/accounts"
    description: "List accounts (filtered-list reverse-reachability for Account.plan_id)"
    roles: [Administrator, MonitoringOperator]
    code: 200
    input: ["limit?", "offset?", "plan_id?", "contract_status?"]
    output: Account[]
    side_effects: []

  - method: POST
    path: "/accounts/{id}/activate"
    description: "Activate the contract"
    roles: [Administrator]
    code: 200
    input: []
    output: Account
    side_effects:
      - "contract_status PENDING->ACTIVE; set contract_start_utc, cycle_anchor_utc, current_tier; monitoring_balance recomputed"

  - method: POST
    path: "/accounts/{id}/change-plan"
    description: "Change the account's monitoring plan mid-cycle (records a proration segment; OCC-guarded)"
    roles: [Administrator]
    code: 200
    input: [new_plan_id, expected_account_version]
    output: Account
    side_effects:
      - "Records proration segment boundary at current clock; current_tier updated; monitoring_balance recomputed (FINAL)"
      - "increments Account.version by 1"

  - method: POST
    path: "/accounts/{id}/request-cancellation"
    description: "Request contract cancellation"
    roles: [Subscriber, Administrator]
    code: 200
    input: []
    output: Account
    side_effects:
      - "contract_status ACTIVE->CANCELLATION_REQUESTED; freezes early_termination_fee_cents per §1.3; increments Account.version by 1"

  - method: POST
    path: "/accounts/{id}/withdraw-cancellation"
    description: "Withdraw a pending cancellation request"
    roles: [Subscriber, Administrator]
    code: 200
    input: []
    output: Account
    side_effects:
      - "contract_status CANCELLATION_REQUESTED->ACTIVE; resets early_termination_fee_cents to 0; increments Account.version by 1"

  - method: POST
    path: "/accounts/{id}/finalize-cancellation"
    description: "Finalize cancellation (OCC-guarded; blocked while a dispatch is open)"
    roles: [Administrator]
    code: 200
    input: [expected_account_version]
    output: Account
    side_effects:
      - "contract_status CANCELLATION_REQUESTED->CANCELLED; monitoring_status->TERMINATED"
      - "Cascade: systems DISARMED + test_mode cleared -> open AlarmEvents SUPPRESSED -> ORDERED Dispatches CANCELLED with fee reversal"
      - "increments Account.version by 1"

  # ----- SecuritySystem -----
  - method: POST
    path: "/systems"
    description: "Register a security system on an account"
    roles: [Administrator]
    code: 201
    input: [account_id, primary_path, cellular_signal_dbm, backup_battery_pct, last_checkin_minutes_ago]
    output: SecuritySystem
    side_effects:
      - "arming_state=DISARMED, test_mode=false, communicator_health derived, sensor_count=0"

  - method: GET
    path: "/systems"
    description: "List systems (filtered-list reverse-reachability for SecuritySystem.account_id)"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: ["limit?", "offset?", "account_id?"]
    output: SecuritySystem[]
    side_effects: []

  - method: GET
    path: "/systems/{id}"
    description: "Get a system (recomputes communicator_health, sensor_count)"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: []
    output: SecuritySystem
    side_effects: []

  - method: PATCH
    path: "/systems/{id}"
    description: "Update communicator telemetry / primary path"
    roles: [Administrator, MonitoringOperator]
    code: 200
    input: ["primary_path?", "cellular_signal_dbm?", "backup_battery_pct?", "last_checkin_minutes_ago?"]
    output: SecuritySystem
    side_effects:
      - "communicator_health re-derived; account monitoring_status may flip ACTIVE<->SUSPENDED"

  - method: POST
    path: "/systems/{id}/arm"
    description: "Arm the system (ARMED_STAY or ARMED_AWAY)"
    roles: [Subscriber]
    code: 200
    input: [mode]
    output: SecuritySystem
    side_effects: ["arming_state -> mode"]

  - method: POST
    path: "/systems/{id}/disarm"
    description: "Disarm the system"
    roles: [Subscriber]
    code: 200
    input: []
    output: SecuritySystem
    side_effects:
      - "arming_state -> DISARMED; RECEIVED BURGLARY events on this system -> RESOLVED_FALSE"

  - method: POST
    path: "/systems/{id}/enter-test-mode"
    description: "Enter test mode (alarms logged, never dispatched)"
    roles: [Subscriber, MonitoringOperator]
    code: 200
    input: []
    output: SecuritySystem
    side_effects:
      - "test_mode->true, test_mode_expires_utc set, arming_state forced DISARMED"

  - method: POST
    path: "/systems/{id}/exit-test-mode"
    description: "Exit test mode"
    roles: [Subscriber, MonitoringOperator]
    code: 200
    input: []
    output: SecuritySystem
    side_effects: ["test_mode->false, test_mode_expires_utc cleared"]

  # ----- Sensor -----
  - method: POST
    path: "/sensors"
    description: "Enroll a sensor on a system"
    roles: [Administrator]
    code: 201
    input: [system_id, zone_number, sensor_type]
    output: Sensor
    side_effects: ["status=ENROLLED; system.sensor_count incremented"]

  - method: GET
    path: "/sensors"
    description: "List sensors (filtered-list reverse-reachability for Sensor.system_id)"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: ["limit?", "offset?", "system_id?", "status?"]
    output: Sensor[]
    side_effects: []

  - method: GET
    path: "/sensors/{id}"
    description: "Get a sensor"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: []
    output: Sensor
    side_effects: []

  - method: POST
    path: "/sensors/{id}/bypass"
    description: "Bypass an enrolled sensor"
    roles: [Subscriber, Administrator]
    code: 200
    input: []
    output: Sensor
    side_effects: ["status ENROLLED->BYPASSED"]

  - method: POST
    path: "/sensors/{id}/restore"
    description: "Restore a bypassed sensor"
    roles: [Subscriber, Administrator]
    code: 200
    input: []
    output: Sensor
    side_effects: ["status BYPASSED->ENROLLED"]

  - method: POST
    path: "/sensors/{id}/remove"
    description: "Remove a sensor (terminal)"
    roles: [Administrator]
    code: 200
    input: []
    output: Sensor
    side_effects: ["status->REMOVED; system.sensor_count decremented by 1"]

  # ----- AlarmEvent -----
  - method: POST
    path: "/alarm-events"
    description: "Ingest an alarm signal (creates AlarmEvent; auto-SUPPRESSED under test-mode or disarmed-burglary; debounced per §1.4 priority 14)"
    roles: [MonitoringOperator, Administrator]
    code: 201
    input: [system_id, sensor_id, signal_type]
    output: AlarmEvent
    side_effects:
      - "raised_utc = current clock; status=RECEIVED; auto -> SUPPRESSED if system test_mode or (arming_state==DISARMED and signal_type==BURGLARY)"
      - "Rejected ERR_SIGNAL_DEBOUNCED if within SIGNAL_DEBOUNCE_SECONDS of a still-open prior event from the same sensor"

  - method: GET
    path: "/alarm-events"
    description: "List alarm events (filtered-list reverse-reachability for AlarmEvent.system_id and AlarmEvent.sensor_id)"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: ["limit?", "offset?", "system_id?", "sensor_id?", "status?"]
    output: AlarmEvent[]
    side_effects: []

  - method: GET
    path: "/alarm-events/{id}"
    description: "Get an alarm event"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: []
    output: AlarmEvent
    side_effects: []

  - method: POST
    path: "/alarm-events/{id}/route"
    description: "Route a received signal to a responder service"
    roles: [MonitoringOperator]
    code: 200
    input: []
    output: AlarmEvent
    side_effects: ["status RECEIVED->ROUTED; routed_service set per §1.3 signal_routing"]

  - method: POST
    path: "/alarm-events/{id}/dispatch"
    description: "Order a dispatch for a routed signal"
    roles: [MonitoringOperator]
    code: 200
    input: []
    output: AlarmEvent
    side_effects:
      - "status ROUTED->DISPATCHED; create Dispatch{ORDERED}; charge dispatch_fee to Account.monitoring_balance_cents"

  - method: POST
    path: "/alarm-events/{id}/resolve"
    description: "Resolve a dispatched event REAL or FALSE_ALARM"
    roles: [MonitoringOperator]
    code: 200
    input: [resolution]
    output: AlarmEvent
    side_effects:
      - "status DISPATCHED->RESOLVED_REAL or RESOLVED_FALSE; linked Dispatch->CONFIRMED"
      - "If FALSE_ALARM: increment false_alarm_count_cycle, assign chargeable_ordinal, create Fine per §1.3 false_alarm_fine"

  # ----- Dispatch -----
  - method: GET
    path: "/dispatches"
    description: "List dispatches (filtered-list reverse-reachability for Dispatch.alarm_event_id and Dispatch.account_id)"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: ["limit?", "offset?", "alarm_event_id?", "account_id?", "service?"]
    output: Dispatch[]
    side_effects: []

  - method: GET
    path: "/dispatches/{id}"
    description: "Get a dispatch"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: []
    output: Dispatch
    side_effects: []

  - method: POST
    path: "/dispatches/{id}/cancel"
    description: "Cancel an ordered dispatch (reverses the dispatch fee)"
    roles: [MonitoringOperator]
    code: 200
    input: []
    output: Dispatch
    side_effects:
      - "status ORDERED->CANCELLED; reverse fee_cents from Account.monitoring_balance_cents"

  # ----- Permit -----
  - method: POST
    path: "/permits"
    description: "Issue a false-alarm permit on an account"
    roles: [Administrator]
    code: 201
    input: [account_id, permit_number, filed_days_late]
    output: Permit
    side_effects: ["status=ACTIVE; cycle_anchor_utc set; fee_total_cents computed per §1.3 permit_fee"]

  - method: GET
    path: "/permits"
    description: "List permits (filtered-list reverse-reachability for Permit.account_id)"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: ["limit?", "offset?", "account_id?", "status?"]
    output: Permit[]
    side_effects: []

  - method: GET
    path: "/permits/{id}"
    description: "Get a permit"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: []
    output: Permit
    side_effects: []

  - method: POST
    path: "/permits/{id}/revoke"
    description: "Revoke an active permit"
    roles: [Administrator]
    code: 200
    input: []
    output: Permit
    side_effects: ["status ACTIVE->REVOKED; future false-alarm fines add no-permit surcharge"]

  - method: POST
    path: "/permits/{id}/expire"
    description: "Expire an active permit"
    roles: [Administrator]
    code: 200
    input: []
    output: Permit
    side_effects: ["status ACTIVE->EXPIRED; future false-alarm fines add no-permit surcharge"]

  # ----- Fine -----
  - method: GET
    path: "/fines"
    description: "List fines (filtered-list reverse-reachability for Fine.account_id and Fine.alarm_event_id)"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: ["limit?", "offset?", "account_id?", "alarm_event_id?", "settlement_status?"]
    output: Fine[]
    side_effects: []

  - method: GET
    path: "/fines/{id}"
    description: "Get a fine"
    roles: [Administrator, MonitoringOperator, Subscriber]
    code: 200
    input: []
    output: Fine
    side_effects: []

  - method: POST
    path: "/fines/{id}/pay"
    description: "Pay an assessed fine"
    roles: [Subscriber, Administrator]
    code: 200
    input: []
    output: Fine
    side_effects: ["settlement_status ASSESSED->PAID"]

  - method: POST
    path: "/fines/{id}/waive"
    description: "Waive an assessed fine"
    roles: [Administrator]
    code: 200
    input: []
    output: Fine
    side_effects: ["settlement_status ASSESSED->WAIVED; fine excluded from future false_alarm_count_cycle"]

  # ----- Test-driving endpoint -----
  - method: POST
    path: "/_clock/set"
    description: "Set the server's logical UTC clock (test-driving; outside the public business surface)"
    roles: [Administrator]
    code: 200
    input: [now_utc]
    output: null
    side_effects: ["All subsequent server-stamped timestamps and elapsed-time computations use this clock"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation per §1.7" }
  - { id: ERR_NOT_ACCOUNT_OWNER, http: 403, condition: "Subscriber X-User-ID is not the owning Account.id of the targeted resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 422, condition: "A body-referenced FK (plan_id, account_id, system_id, sensor_id) does not resolve" }
  - { id: ERR_VALIDATION, http: 422, condition: "Missing required field, bad enum value, or out-of-range numeric input" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_account_version does not match the account's current version (OCC)" }
  - { id: ERR_TEST_MODE_ACTIVE, http: 409, condition: "Routing attempted on an event whose system is in test_mode" }
  - { id: ERR_COMMUNICATOR_OFFLINE, http: 409, condition: "Arm attempted on a system whose communicator_health is OFFLINE" }
  - { id: ERR_CELLULAR_NOT_ENTITLED, http: 422, condition: "CELLULAR primary_path on a plan without cellular_backup_included" }
  - { id: ERR_SENSOR_LIMIT_EXCEEDED, http: 409, condition: "Enrolling a sensor would exceed plan.max_sensors" }
  - { id: ERR_DUPLICATE_ZONE, http: 409, condition: "zone_number already used by a non-REMOVED sensor on the system" }
  - { id: ERR_PERMIT_ALREADY_ACTIVE, http: 409, condition: "Account already holds a Permit in status ACTIVE" }
  - { id: ERR_DUPLICATE_PERMIT_NUMBER, http: 409, condition: "permit_number already issued" }
  - { id: ERR_OPEN_DISPATCH, http: 409, condition: "change-plan blocked while an AlarmEvent under the account is DISPATCHED" }
  - { id: ERR_TEST_MODE_ALREADY_OPEN, http: 409, condition: "enter-test-mode while an unexpired test-mode window is still open (temporal overlap)" }
  - { id: ERR_SIGNAL_DEBOUNCED, http: 409, condition: "alarm-event from the same sensor within the debounce buffer of a still-open prior event (temporal overlap)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Subscriber
    description: "The account holder; arms/disarms their own system, manages cancellation requests, pays fines."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /systems/{id}/arm"
      - "POST /systems/{id}/disarm"
    shared_operations:
      - "POST /accounts/{id}/request-cancellation (with Administrator)"
      - "POST /accounts/{id}/withdraw-cancellation (with Administrator)"
      - "POST /systems/{id}/enter-test-mode (with MonitoringOperator)"
      - "POST /systems/{id}/exit-test-mode (with MonitoringOperator)"
      - "POST /sensors/{id}/bypass (with Administrator)"
      - "POST /sensors/{id}/restore (with Administrator)"
      - "POST /fines/{id}/pay (with Administrator)"
      - "GET reads on accounts, systems, sensors, alarm-events, dispatches, permits, fines, monitoring-plans"

  - name: MonitoringOperator
    description: "Central-station operator; ingests signals, routes them, orders/cancels dispatch, resolves events."
    identity: "opaque"
    exclusive_operations:
      - "POST /alarm-events/{id}/route"
      - "POST /alarm-events/{id}/dispatch"
      - "POST /alarm-events/{id}/resolve"
      - "POST /dispatches/{id}/cancel"
    shared_operations:
      - "POST /alarm-events (ingest, with Administrator)"
      - "POST /systems/{id}/enter-test-mode (with Subscriber)"
      - "POST /systems/{id}/exit-test-mode (with Subscriber)"
      - "PATCH /systems/{id} (telemetry, with Administrator)"
      - "GET reads across accounts, systems, sensors, alarm-events, dispatches, permits, fines, monitoring-plans"

  - name: Administrator
    description: "Back-office admin; manages plans, accounts, contract lifecycle, systems, sensors, permits, fine settlement."
    identity: "opaque"
    exclusive_operations:
      - "POST /monitoring-plans"
      - "POST /accounts"
      - "POST /accounts/{id}/activate"
      - "POST /accounts/{id}/change-plan"
      - "POST /accounts/{id}/finalize-cancellation"
      - "POST /systems"
      - "POST /sensors"
      - "POST /sensors/{id}/remove"
      - "POST /permits"
      - "POST /permits/{id}/revoke"
      - "POST /permits/{id}/expire"
      - "POST /fines/{id}/waive"
      - "POST /_clock/set"
    shared_operations:
      - "POST /accounts/{id}/request-cancellation (with Subscriber)"
      - "POST /accounts/{id}/withdraw-cancellation (with Subscriber)"
      - "POST /alarm-events (ingest, with MonitoringOperator)"
      - "PATCH /systems/{id} (telemetry, with MonitoringOperator)"
      - "POST /sensors/{id}/bypass (with Subscriber)"
      - "POST /sensors/{id}/restore (with Subscriber)"
      - "POST /fines/{id}/pay (with Subscriber)"
      - "GET reads across all resources"
