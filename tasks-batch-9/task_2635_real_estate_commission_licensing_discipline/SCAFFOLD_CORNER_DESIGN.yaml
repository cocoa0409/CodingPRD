          The prohibited-term scan runs on the normalized form, so punctuation and spacing cannot hide
          a term ("The Official-Group" normalizes to THEOFFICIALGROUP and still hits OFFICIAL), and the
          hit count is computed at submission but ENFORCED only at review: a hit name is accepted with
          201 and blocked at APPROVE with 422. prohibited_term_hits == 0 is the approval boundary.
        test_recipe:
          setup:
            - "Harbor Realty Group is ACTIVE with Dana Broker ACTIVE and self-supervising"
