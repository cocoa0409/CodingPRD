# §1.9 Scaffold Corner Design — breadth probe over the §1.1-§1.7 surface of
# SCAFFOLD.yaml. Sections and claim_types are taken verbatim from
# references/claim-extraction-guide.md. Corners already asserted by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an `excluded_because:` stub and no
# test_recipe.
scaffold_corner_design:

  - section: entities
    instances:

      - name: client_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds: [endpoints.POST_bureau_clients, entities.Client]
        distinguishing_aspect: "A fully specified Client create returns 201 with every input echoed and every system ledger field seeded to zero at version 1."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned so created_at and updated_at are predictable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-E1", name: "Entity Corner Mutual", sla_turnaround_hours: 36, sla_penalty_rate_cents_per_hour: 1000, sla_penalty_cap_cents: 250000, dr_readiness_required: false, control_total_tolerance_bp: 12, status: "ACTIVE" }
              as: BureauAdmin
              captures: { e1_client_id: "$.data.id", e1_version: "$.data.version" }
          assert:
            - "HTTP 201 with response_type object and a meta block carrying api_request_id and api_request_timestamp"
            - "Every input is echoed: client_code == CL-E1, name == Entity Corner Mutual, sla_turnaround_hours == 36, sla_penalty_rate_cents_per_hour == 1000, sla_penalty_cap_cents == 250000, dr_readiness_required == false, control_total_tolerance_bp == 12, status == ACTIVE"
            - "Every system ledger field is seeded to zero: postage_deposited_cents == 0, postage_committed_cents == 0, postage_escrow_available_cents == 0, paperless_sync_epoch == 0, pending_address_feedback_count == 0, address_feedback_batch_count == 0"
            - "${e1_version} == 1 and created_at == updated_at == 2026-08-01T00:00:00Z"
            - "GET /bureau/clients/${e1_client_id} returns the identical row"

      - name: insert_stock_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds: [endpoints.GET_bureau_insert_stocks_id, entities.InsertStock]
        distinguishing_aspect: "A GET by id returns the stored InsertStock unchanged, including the derived on_hand_count seeded from received_count."
        test_recipe:
          setup:
            - "One InsertStock INS-E2 received at 40 copies with sheets_per_insert 3 and an open-ended effectivity window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/insert-stocks"
              payload: { insert_code: "INS-E2", description: "State disclosure leaflet", jurisdiction_code: "US-CA", effective_from: "2026-07-01T00:00:00Z", sheets_per_insert: 3, received_count: 40 }
              as: BureauAdmin
              captures: { e2_stock_id: "$.data.id" }
          trigger:
            - call: "GET /bureau/insert-stocks/${e2_stock_id}"
              payload: {}
              as: CompositionOperator
              captures: { e2_on_hand: "$.data.on_hand_count", e2_status: "$.data.status" }
          assert:
            - "HTTP 200 with insert_code == INS-E2, description == State disclosure leaflet, jurisdiction_code == US-CA, sheets_per_insert == 3, received_count == 40"
            - "${e2_on_hand} == 40, reserved_count == 0, consumed_count == 0 and ${e2_status} == ACTIVE"
            - "effective_from == 2026-07-01T00:00:00Z and effective_to is null"
            - "The read is available to a non-admin role: CompositionOperator receives 200, not 403"

      - name: press_line_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds: [endpoints.GET_bureau_press_lines, response_envelope.pagination_fields]
        distinguishing_aspect: "total_count reports the whole matching set while has_more is derived from limit plus offset, so page two of three rows reports has_more false."
        test_recipe:
          setup:
            - "Three AVAILABLE press lines PL-E3A, PL-E3B, PL-E3C exist and nothing else."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-E3A", capabilities: ["DUPLEX"], sheets_per_hour: 600, daily_sheet_capacity: 9000 }
              as: BureauAdmin
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-E3B", capabilities: ["DUPLEX", "COLOR"], sheets_per_hour: 900, daily_sheet_capacity: 9000 }
              as: BureauAdmin
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-E3C", capabilities: ["INSERT"], sheets_per_hour: 300, daily_sheet_capacity: 9000, status: "MAINTENANCE" }
              as: BureauAdmin
          trigger:
            - call: "GET /bureau/press-lines?limit=2&offset=0"
              payload: {}
              as: ProductionScheduler
              captures: { e3_first_id: "$.data[0].id", e3_second_id: "$.data[1].id" }
            - call: "GET /bureau/press-lines?limit=2&offset=2"
              payload: {}
              as: ProductionScheduler
              captures: { e3_third_id: "$.data[0].id" }
            - call: "GET /bureau/press-lines?status=AVAILABLE"
              payload: {}
              as: ProductionScheduler
              captures: { e3_available_first: "$.data[0].line_code" }
          assert:
            - "Page one: HTTP 200, response_type array, exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Page two: exactly 1 row, total_count == 3, has_more == false, offset == 2"
            - "The three ids ${e3_first_id}, ${e3_second_id} and ${e3_third_id} are pairwise distinct — no row is repeated or skipped across the two pages"
            - "The filtered read returns exactly 2 rows with total_count == 2 and has_more == false, because PL-E3C is MAINTENANCE; ${e3_available_first} is one of PL-E3A or PL-E3B"

      - name: statement_record_fetch_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds: [errors.ERR_RECORD_NOT_FOUND, validations.priority_10]
        distinguishing_aspect: "An unknown StatementRecord id resolves to the record-specific 404, not a generic not-found."
        test_recipe:
          setup:
            - "Empty database; no StatementRecord has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "GET /bureau/statement-records/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: ClientLiaison
              captures: { e4_error: "$.data.error_id" }
          assert:
            - "HTTP 404 with ${e4_error} == ERR_RECORD_NOT_FOUND"
            - "response_type == error and data carries exactly error_id and message"

      - name: data_file_creation_missing_required_declared_total_returns_invalid_request
        claim_type: required_fields
        grounds: [endpoints.POST_bureau_data_files, validations.priority_5]
        distinguishing_aspect: "declared_control_total_cents has source input and no default, so omitting it is a 422 shape failure rather than a defaulted zero."
        test_recipe:
          setup:
            - "One ACTIVE Client CL-E5 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-E5", name: "Required Field Savings", dr_readiness_required: false }
              as: BureauAdmin
              captures: { e5_client_id: "$.data.id" }
          trigger:
            - call: "POST /bureau/data-files"
              payload: { client_id: "${e5_client_id}", file_name: "e5-no-total.csv", format_spec_code: "DELIMITED", declared_record_count: 3 }
              as: ClientLiaison
              captures: { e5_error: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${e5_error} == ERR_VALIDATION"
            - "No DataFile is created: GET /bureau/clients/${e5_client_id}/data-files returns total_count == 0"

      - name: client_defaults_apply_when_optional_fields_omitted
        claim_type: defaults
        grounds: [entities.Client.fields.sla_turnaround_hours, entities.Client.fields.control_total_tolerance_bp, entities.Client.fields.dr_readiness_required]
        distinguishing_aspect: "Omitting every optional input yields the declared defaults 48 / 2500 / 500000 / true / 5 / ACTIVE, not nulls or zeros."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-E6", name: "Default Value Federal" }
              as: BureauAdmin
              captures: { e6_client_id: "$.data.id", e6_hours: "$.data.sla_turnaround_hours", e6_tolerance: "$.data.control_total_tolerance_bp" }
          assert:
            - "HTTP 201 with ${e6_hours} == 48 and ${e6_tolerance} == 5"
            - "sla_penalty_rate_cents_per_hour == 2500, sla_penalty_cap_cents == 500000, dr_readiness_required == true and status == ACTIVE"
            - "GET /bureau/clients/${e6_client_id} returns the same defaults, proving they were persisted rather than injected into the create response only"

      - name: data_file_actual_totals_are_computed_from_attached_records
        claim_type: computed_fields
        grounds: [calculations.data_file_control_reconciliation, entities.DataFile.fields.actual_control_total_cents]
        distinguishing_aspect: "actual_record_count and actual_control_total_cents are recomputed from the attached StatementRecords at control-check, so a file whose declarations match its rows lands on zero variance and ACCEPTED."
        test_recipe:
          setup:
            - "Client CL-E7 with the default control_total_tolerance_bp of 5."
            - "DataFile e7-clean.csv declares 2 records and 20000 cents; two DELIMITED-valid records of 10000 cents each are attached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-E7", name: "Computed Totals Credit Union", dr_readiness_required: false }
              as: BureauAdmin
              captures: { e7_client_id: "$.data.id" }
            - call: "POST /bureau/data-files"
              payload: { client_id: "${e7_client_id}", file_name: "e7-clean.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 20000 }
              as: ClientLiaison
              captures: { e7_file_id: "$.data.id", e7_initial_actual: "$.data.actual_record_count" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${e7_file_id}", account_ref: "ABC1001", sequence_no: 1, statement_amount_cents: 10000, address_line1: "700 Ledger Lane", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "7001" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${e7_file_id}", account_ref: "ABC1002", sequence_no: 2, statement_amount_cents: 10000, address_line1: "702 Ledger Lane", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "7002" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${e7_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
              captures: { e7_format_errors: "$.data.format_error_count" }
          trigger:
            - call: "POST /bureau/data-files/${e7_file_id}/control-check"
              payload: {}
              as: CompositionOperator
              captures: { e7_actual_count: "$.data.actual_record_count", e7_actual_total: "$.data.actual_control_total_cents", e7_bp: "$.data.control_total_variance_bp" }
          assert:
            - "${e7_initial_actual} == 0 at creation — the computed counters start empty and are not copied from the declarations"
            - "${e7_format_errors} == 0 and the file is FORMAT_VALIDATED before the control check runs"
            - "HTTP 200 with ${e7_actual_count} == 2, ${e7_actual_total} == 20000, record_count_variance == 0, control_total_variance_cents == 0 and ${e7_bp} == 0"
            - "status == ACCEPTED with accepted_at == 2026-08-01T00:00:00Z and amendment_count == 0"

      - name: insert_stock_system_and_ledger_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.InsertStock.fields.on_hand_count, entities.InsertStock.fields.consumed_count]
        distinguishing_aspect: "id, created_at, version and the reservation ledger are server-owned: supplying them on create changes nothing, and on_hand_count is seeded from received_count regardless of what the caller sent."
        test_recipe:
          setup:
            - "Empty database; the clock is pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/insert-stocks"
              payload: { insert_code: "INS-E8", description: "Rate change notice", jurisdiction_code: "US-FED", effective_from: "2026-07-01T00:00:00Z", received_count: 25, id: "99999999-9999-9999-9999-999999999999", created_at: "2020-01-01T00:00:00Z", version: 77, on_hand_count: 5, reserved_count: 4, consumed_count: 3 }
              as: BureauAdmin
              captures: { e8_stock_id: "$.data.id", e8_on_hand: "$.data.on_hand_count", e8_version: "$.data.version" }
          assert:
            - "HTTP 201 and ${e8_stock_id} != 99999999-9999-9999-9999-999999999999 — the id is server-minted"
            - "created_at == 2026-08-01T00:00:00Z (the logical clock), not the supplied 2020-01-01T00:00:00Z, and ${e8_version} == 1, not 77"
            - "${e8_on_hand} == 25 == received_count, reserved_count == 0 and consumed_count == 0 — the supplied ledger values 5 / 4 / 3 are discarded"
            - "sheets_per_insert == 1 by default and status == ACTIVE"

      - name: press_line_creation_with_unknown_status_enum_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.PressLine.fields.status, validations.priority_5]
        distinguishing_aspect: "status accepts only AVAILABLE or MAINTENANCE; a plausible third value is a 422 shape failure, not a silent coercion to the default."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-E9", capabilities: ["DUPLEX"], sheets_per_hour: 600, daily_sheet_capacity: 9000, status: "OFFLINE" }
              as: BureauAdmin
              captures: { e9_error: "$.data.error_id" }
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-E9B", capabilities: ["LASER"], sheets_per_hour: 600, daily_sheet_capacity: 9000 }
              as: BureauAdmin
              captures: { e9b_error: "$.data.error_id" }
          assert:
            - "HTTP 422 with ${e9_error} == ERR_VALIDATION for the unknown status OFFLINE"
            - "HTTP 422 with ${e9b_error} == ERR_VALIDATION for the capability LASER, which is outside {DUPLEX, COLOR, INSERT}"
            - "GET /bureau/press-lines returns total_count == 0 — neither malformed row was persisted"

      - name: client_listing_with_limit_above_maximum_returns_invalid_request
        claim_type: type_constraints
        grounds: [response_envelope.pagination_defaults, validations.priority_5]
        distinguishing_aspect: "limit is bounded at 100, so 101 is rejected with 422 rather than clamped down to the maximum."
        test_recipe:
          setup:
            - "One Client exists so the list would otherwise be non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-E10", name: "Pagination Bounds Bank", dr_readiness_required: false }
              as: BureauAdmin
          trigger:
            - call: "GET /bureau/clients?limit=101"
              payload: {}
              as: BureauAdmin
              captures: { e10_error: "$.data.error_id" }
            - call: "GET /bureau/clients?limit=0"
              payload: {}
              as: BureauAdmin
              captures: { e10b_error: "$.data.error_id" }
            - call: "GET /bureau/clients"
              payload: {}
              as: BureauAdmin
              captures: { e10_code: "$.data[0].client_code" }
          assert:
            - "HTTP 422 with ${e10_error} == ERR_VALIDATION for limit 101 (max is 100)"
            - "HTTP 422 with ${e10b_error} == ERR_VALIDATION for limit 0 (min is 1)"
            - "The unparameterised read succeeds with HTTP 200, limit == 10, offset == 0, total_count == 1 and ${e10_code} == CL-E10"

      - name: scan_event_rows_are_immutable_and_append_only
        claim_type: immutability
        grounds: [entities.ScanEvent, endpoints.POST_bureau_mail_pieces_id_scans]
        distinguishing_aspect: "ScanEvent is declared common_fields false: it has no version and no update endpoint, so a repeated read appends a second unaccepted row instead of mutating the first."
        test_recipe:
          setup:
            - "Client CL-E11 (dr_readiness_required false) with ACTIVE template T-E11 (FIRST_CLASS, sheets_per_document 1, no inserts) and an accepted single-record DataFile."
            - "The job is composed and presorted, then scheduled and started so its single piece is scannable."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-E11", name: "Immutable Audit Bank", dr_readiness_required: false }
              as: BureauAdmin
              captures: { e11_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${e11_client_id}", template_code: "T-E11", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { e11_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${e11_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/press-lines"
              payload: { line_code: "PL-E11", capabilities: ["DUPLEX", "COLOR", "INSERT"], sheets_per_hour: 600, daily_sheet_capacity: 9000 }
              as: BureauAdmin
              captures: { e11_line_id: "$.data.id" }
            - call: "POST /bureau/data-files"
              payload: { client_id: "${e11_client_id}", file_name: "e11.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 9000 }
              as: ClientLiaison
              captures: { e11_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${e11_file_id}", account_ref: "ABC1101", sequence_no: 1, statement_amount_cents: 9000, address_line1: "800 Immutable Road", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "8001" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${e11_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${e11_file_id}/control-check"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${e11_file_id}", template_id: "${e11_template_id}", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { e11_job_id: "$.data.id" }
            - call: "POST /bureau/composition-jobs/${e11_job_id}/presort"
              payload: {}
              as: CompositionOperator
            - call: "GET /bureau/mail-pieces?composition_job_id=${e11_job_id}"
              payload: {}
              as: IntegrityAuditor
              captures: { e11_piece_id: "$.data[0].id", e11_bar: "$.data[0].imb_barcode" }
            - call: "POST /bureau/composition-jobs/${e11_job_id}/schedule"
              payload: { window_start: "2026-08-01T09:00:00Z", press_line_id: "${e11_line_id}" }
              as: ProductionScheduler
              captures: { e11_run_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/print-runs/${e11_run_id}/start"
              payload: {}
              as: ProductionScheduler
          trigger:
            - call: "POST /bureau/mail-pieces/${e11_piece_id}/scans"
              payload: { stage: "PRINT", scanned_barcode: "${e11_bar}", device_code: "SC-01" }
              as: IntegrityAuditor
              captures: { e11_first_accepted: "$.data.accepted", e11_first_reason: "$.data.rejection_reason" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:05:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/mail-pieces/${e11_piece_id}/scans"
              payload: { stage: "PRINT", scanned_barcode: "${e11_bar}", device_code: "SC-01" }
              as: IntegrityAuditor
              captures: { e11_second_accepted: "$.data.accepted", e11_second_reason: "$.data.rejection_reason" }
            - call: "GET /bureau/mail-pieces/${e11_piece_id}/scan-events"
              payload: {}
              as: IntegrityAuditor
              captures: { e11_log_first_stage: "$.data[0].stage", e11_log_second_reason: "$.data[1].rejection_reason" }
          assert:
            - "First read: HTTP 201 with ${e11_first_accepted} == true and ${e11_first_reason} == NONE, scanned_at == 2026-08-01T09:00:00Z"
            - "Second read: HTTP 201 (not an error) with ${e11_second_accepted} == false and ${e11_second_reason} == DUPLICATE_STAGE, scanned_at == 2026-08-01T09:05:00Z"
            - "The log is append-only: the scan-events read returns total_count == 2 with ${e11_log_first_stage} == PRINT still accepted true, and ${e11_log_second_reason} == DUPLICATE_STAGE"
            - "Neither ScanEvent row carries a version field, and §1.5 declares no PATCH or DELETE route under /bureau/mail-pieces/{id}/scans — the audit trail cannot be edited"
            - "The refusal still moved the piece's integrity dimension: MailPiece.${e11_piece_id}.integrity_status == DUPLICATE_SCAN while piece_status stays PRINTED and accepted_scan_count stays 1"

      - name: statement_record_with_unknown_data_file_returns_not_found
        claim_type: parent_relationships
        grounds: [entities.StatementRecord.parent, validations.priority_12]
        distinguishing_aspect: "StatementRecord declares DataFile as its parent, so an unresolvable body data_file_id is the parent's 404 rather than a 422 shape error."
        test_recipe:
          setup:
            - "No DataFile exists at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "22222222-2222-2222-2222-222222222222", account_ref: "ABC1201", sequence_no: 1, statement_amount_cents: 5000, address_line1: "900 Orphan Way", city: "Atlanta", region_code: "GA", postal_code: "30301" }
              as: ClientLiaison
              captures: { e12_error: "$.data.error_id" }
          assert:
            - "HTTP 404 with ${e12_error} == ERR_DATA_FILE_NOT_FOUND"
            - "The 404 outranks the 422 that a well-formed-but-orphaned body would otherwise produce, because priority 12 body-id resolution runs after shape validation and this body is shape-valid"

      - name: composition_job_with_unknown_template_id_returns_not_found
        claim_type: parent_relationships
        grounds: [validations.priority_12, errors.ERR_TEMPLATE_NOT_FOUND]
        distinguishing_aspect: "In a graph topology every body FK is resolved independently: a valid data_file_id paired with a bogus template_id yields the template's own 404."
        test_recipe:
          setup:
            - "Client CL-E13 with an ACCEPTED single-record DataFile, and no template at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-E13", name: "Graph Integrity Trust", dr_readiness_required: false }
              as: BureauAdmin
              captures: { e13_client_id: "$.data.id" }
            - call: "POST /bureau/data-files"
              payload: { client_id: "${e13_client_id}", file_name: "e13.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 4000 }
              as: ClientLiaison
              captures: { e13_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${e13_file_id}", account_ref: "ABC1301", sequence_no: 1, statement_amount_cents: 4000, address_line1: "1000 Graph Court", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "9001" }
              as: ClientLiaison
            - call: "POST /bureau/data-files/${e13_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
            - call: "POST /bureau/data-files/${e13_file_id}/control-check"
              payload: {}
              as: CompositionOperator
          trigger:
            - call: "POST /bureau/composition-jobs"
              payload: { data_file_id: "${e13_file_id}", template_id: "33333333-3333-3333-3333-333333333333", rush_requested: false }
              as: CompositionOperator
              as_user_id: "op-1"
              captures: { e13_error: "$.data.error_id" }
          assert:
            - "HTTP 404 with ${e13_error} == ERR_TEMPLATE_NOT_FOUND — the resolvable data_file_id does not mask the unresolvable template_id"
            - "The DataFile is untouched: GET /bureau/data-files/${e13_file_id} still reads status ACCEPTED, not CONSUMED"
            - "GET /bureau/composition-jobs?data_file_id=${e13_file_id} returns total_count == 0"

      - name: composition_job_billing_fields_are_computed_at_close
        claim_type: computed_fields
        grounds: [entities.CompositionJob.fields.billing_total_cents, calculations.job_billing_total]
        excluded_because:
          difficulty_instance: billing_discount_tier_keyed_on_pre_discount_subtotal
          rationale: "That instance closes a job and asserts every step-1..step-8 billing field as a literal, which is a strict superset of the computed-field claim for CompositionJob's invoice block."

      - name: insert_stock_ledger_fields_track_reservations
        claim_type: computed_fields
        grounds: [entities.InsertStock.fields.reserved_count, entities.InsertStock.fields.consumed_count]
        excluded_because:
          difficulty_instance: insert_stock_conserved_across_composition_reprint_and_manifest
          rationale: "The reservation ledger is read four times across composition, reprint and manifest in that instance, asserting on_hand_count, reserved_count and consumed_count as literals at each stage."

  - section: state_machines
    instances:

      - name: data_file_starts_in_received_with_empty_control_counters
        claim_type: initial_state
        grounds: [state_machines.DataFile.initial_state, entities.DataFile.fields.received_at]
        distinguishing_aspect: "A newly lodged DataFile is RECEIVED with received_at stamped from the logical clock and accepted_at still null."
        test_recipe:
          setup:
            - "One ACTIVE Client CL-S1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-S1", name: "Initial State Insurance", dr_readiness_required: false }
              as: BureauAdmin
              captures: { s1_client_id: "$.data.id" }
          trigger:
            - call: "POST /bureau/data-files"
              payload: { client_id: "${s1_client_id}", file_name: "s1-intake.csv", format_spec_code: "FIXED_WIDTH", declared_record_count: 4, declared_control_total_cents: 40000 }
              as: ClientLiaison
              captures: { s1_file_id: "$.data.id", s1_status: "$.data.status" }
          assert:
            - "HTTP 201 with ${s1_status} == RECEIVED — the declared initial_state, not FORMAT_VALIDATED"
            - "received_at == 2026-08-01T00:00:00Z and accepted_at is null"
            - "actual_record_count == 0, actual_control_total_cents == 0, format_error_count == 0, amendment_count == 0 and version == 1"
            - "GET /bureau/clients/${s1_client_id}/data-files?status=RECEIVED returns total_count == 1 containing ${s1_file_id}"

      - name: validate_format_advances_the_file_to_format_validated
        claim_type: valid_transition
        grounds: [state_machines.DataFile.RECEIVED_to_FORMAT_VALIDATED, calculations.data_file_format_validation]
        distinguishing_aspect: "A file whose every record satisfies the DELIMITED predicate advances RECEIVED -> FORMAT_VALIDATED with format_error_count 0 and its version bumped once."
        test_recipe:
          setup:
            - "Client CL-S2 with a two-record DELIMITED file; both records carry a 3-letter/4-digit account_ref and a 5-digit postal code."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-S2", name: "Valid Transition Bancorp", dr_readiness_required: false }
              as: BureauAdmin
              captures: { s2_client_id: "$.data.id" }
            - call: "POST /bureau/data-files"
              payload: { client_id: "${s2_client_id}", file_name: "s2.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 15000 }
              as: ClientLiaison
              captures: { s2_file_id: "$.data.id", s2_file_v1: "$.data.version" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${s2_file_id}", account_ref: "ABC2001", sequence_no: 1, statement_amount_cents: 7000, address_line1: "1100 Transition Street", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "1101" }
              as: ClientLiaison
              captures: { s2_rec1_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${s2_file_id}", account_ref: "ABC2002", sequence_no: 2, statement_amount_cents: 8000, address_line1: "1102 Transition Street", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "1102" }
              as: ClientLiaison
          trigger:
            - call: "POST /bureau/data-files/${s2_file_id}/validate-format"
              payload: {}
              as: CompositionOperator
              captures: { s2_status: "$.data.status", s2_errors: "$.data.format_error_count" }
          assert:
            - "HTTP 200 with ${s2_status} == FORMAT_VALIDATED and ${s2_errors} == 0"
            - "Per-record side effect: StatementRecord.${s2_rec1_id}.format_valid == true"
            - "accepted_at is still null — only the control check stamps it"
            - "The file version advanced by exactly 1 from ${s2_file_v1}"

      - name: control_check_before_format_validation_is_rejected_as_invalid_state
        claim_type: precondition_enforcement
        grounds: [state_machines.DataFile.FORMAT_VALIDATED_to_ACCEPTED, validations.priority_21]
        distinguishing_aspect: "The control check demands FORMAT_VALIDATED; run against a RECEIVED file it returns 409 and computes no control figures at all, proving the stages are ordered rather than independent."
        test_recipe:
          setup:
            - "Client CL-S3 with a RECEIVED two-record file that has never been format-validated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-S3", name: "Ordered Stage Savings", dr_readiness_required: false }
              as: BureauAdmin
              captures: { s3_client_id: "$.data.id" }
            - call: "POST /bureau/data-files"
              payload: { client_id: "${s3_client_id}", file_name: "s3.csv", format_spec_code: "DELIMITED", declared_record_count: 2, declared_control_total_cents: 12000 }
              as: ClientLiaison
              captures: { s3_file_id: "$.data.id" }
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${s3_file_id}", account_ref: "ABC3001", sequence_no: 1, statement_amount_cents: 6000, address_line1: "1200 Sequence Way", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "1201" }
              as: ClientLiaison
            - call: "POST /bureau/statement-records"
              payload: { data_file_id: "${s3_file_id}", account_ref: "ABC3002", sequence_no: 2, statement_amount_cents: 6000, address_line1: "1202 Sequence Way", city: "Atlanta", region_code: "GA", postal_code: "30301", postal_code_plus4: "1202" }
              as: ClientLiaison
          trigger:
            - call: "POST /bureau/data-files/${s3_file_id}/control-check"
              payload: {}
              as: CompositionOperator
              captures: { s3_error: "$.data.error_id" }
          assert:
            - "HTTP 409 with ${s3_error} == ERR_FILE_INVALID_STATE"
            - "GET /bureau/data-files/${s3_file_id} still reads status RECEIVED with actual_record_count == 0 and actual_control_total_cents == 0 — the rejected call computed nothing"
            - "accepted_at is null and version is unchanged"

      - name: activating_a_higher_version_retires_the_active_sibling
        claim_type: side_effect_execution
        grounds: [state_machines.CompositionTemplate.ACTIVE_to_RETIRED, endpoints.POST_bureau_composition_templates_id_activate]
        distinguishing_aspect: "Activation is a family-scoped cascade: activating version 2 of the same (client_id, template_code) drives version 1 ACTIVE -> RETIRED with retired_at stamped, and only that sibling."
        test_recipe:
          setup:
            - "Client CL-S4 with two DRAFT templates sharing template_code T-S4 at version_no 1 and 2, plus an unrelated template T-S4B version 1 that must not be touched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-S4", name: "Template Family Fidelity", dr_readiness_required: false }
              as: BureauAdmin
              captures: { s4_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${s4_client_id}", template_code: "T-S4", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { s4_v1_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${s4_client_id}", template_code: "T-S4", version_no: 2, duplex_required: true, sheets_per_document: 2, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { s4_v2_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${s4_client_id}", template_code: "T-S4B", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "MARKETING", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { s4_other_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${s4_v1_id}/activate"
              payload: {}
              as: BureauAdmin
              captures: { s4_v1_activated_at: "$.data.activated_at" }
            - call: "POST /bureau/composition-templates/${s4_other_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/composition-templates/${s4_v2_id}/activate"
              payload: {}
              as: BureauAdmin
              captures: { s4_v2_status: "$.data.status", s4_v2_activated_at: "$.data.activated_at" }
          assert:
            - "HTTP 200 with ${s4_v2_status} == ACTIVE and ${s4_v2_activated_at} == 2026-08-02T00:00:00Z"
            - "${s4_v1_activated_at} == 2026-08-01T00:00:00Z and after the cascade GET /bureau/composition-templates/${s4_v1_id} reads status RETIRED with retired_at == 2026-08-02T00:00:00Z"
            - "The cascade is family-scoped: GET /bureau/composition-templates/${s4_other_id} still reads status ACTIVE with retired_at null"
            - "GET /bureau/clients/${s4_client_id}/composition-templates?status=ACTIVE returns total_count == 2 (T-S4 v2 and T-S4B v1)"

      - name: second_activation_of_an_active_template_is_rejected
        claim_type: idempotency
        grounds: [validations.priority_31, errors.ERR_TEMPLATE_INVALID_STATE]
        distinguishing_aspect: "Activation is not idempotent: replaying it on an already ACTIVE version is a 409 rather than a no-op 200, so a duplicated operator click cannot re-stamp activated_at."
        test_recipe:
          setup:
            - "Client CL-S5 with template T-S5 version 1 activated at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-S5", name: "Idempotency Guard Group", dr_readiness_required: false }
              as: BureauAdmin
              captures: { s5_client_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${s5_client_id}", template_code: "T-S5", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { s5_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${s5_template_id}/activate"
              payload: {}
              as: BureauAdmin
              captures: { s5_version_after_activate: "$.data.version" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/composition-templates/${s5_template_id}/activate"
              payload: {}
              as: BureauAdmin
              captures: { s5_error: "$.data.error_id" }
          assert:
            - "HTTP 409 with ${s5_error} == ERR_TEMPLATE_INVALID_STATE"
            - "activated_at is still 2026-08-01T00:00:00Z, not re-stamped to 2026-08-05T00:00:00Z"
            - "The template version is unchanged from ${s5_version_after_activate} — the refused call wrote nothing"

      - name: revoking_an_already_revoked_enrollment_is_rejected
        claim_type: invalid_transitions
        grounds: [validations.priority_30, state_machines.PaperlessEnrollment.ENROLLED_to_REVOKED]
        distinguishing_aspect: "REVOKED accepts no revoke trigger; the second call is a 409 that leaves revoked_at at its original instant."
        test_recipe:
          setup:
            - "Client CL-S7 with one PENDING enrollment for account ABC7001, revoked at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-S7", name: "Revoke Twice Mutual", dr_readiness_required: false }
              as: BureauAdmin
              captures: { s7_client_id: "$.data.id" }
            - call: "POST /bureau/paperless-enrollments"
              payload: { client_id: "${s7_client_id}", account_ref: "ABC7001", channel: "EMAIL" }
              as: ClientLiaison
              captures: { s7_enrollment_id: "$.data.id" }
            - call: "POST /bureau/paperless-enrollments/${s7_enrollment_id}/revoke"
              payload: {}
              as: ClientLiaison
              captures: { s7_revoked_at: "$.data.revoked_at", s7_revoked_epoch: "$.data.revoked_epoch" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-09T00:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/paperless-enrollments/${s7_enrollment_id}/revoke"
              payload: {}
              as: ClientLiaison
              captures: { s7_error: "$.data.error_id" }
          assert:
            - "The first revoke succeeded from PENDING with ${s7_revoked_at} == 2026-08-01T00:00:00Z, ${s7_revoked_epoch} == 0 and suppression_effective == false"
            - "HTTP 409 with ${s7_error} == ERR_ENROLLMENT_INVALID_STATE on the replay"
            - "revoked_at is still 2026-08-01T00:00:00Z — the 2026-08-09 clock did not overwrite it"

      - name: reenrolling_a_revoked_account_loops_the_same_row_back_to_pending
        claim_type: cyclic
        grounds: [state_machines.PaperlessEnrollment.REVOKED_to_PENDING, endpoints.POST_bureau_paperless_enrollments]
        distinguishing_aspect: "Re-enrollment reuses the existing (client_id, account_ref) row instead of minting a second one, clearing every epoch and timestamp so the suppression history cannot leak into the new cycle."
        test_recipe:
          setup:
            - "Client CL-S8 whose account ABC8001 was enrolled, confirmed at sync epoch 1, then revoked."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-S8", name: "Cyclic Enrollment Bank", dr_readiness_required: false }
              as: BureauAdmin
              captures: { s8_client_id: "$.data.id" }
            - call: "POST /bureau/paperless-enrollments"
              payload: { client_id: "${s8_client_id}", account_ref: "ABC8001", channel: "PORTAL" }
              as: ClientLiaison
              captures: { s8_enrollment_id: "$.data.id", s8_v1: "$.data.version" }
            - call: "POST /bureau/clients/${s8_client_id}/paperless-sync"
              payload: { confirm_pending_account_refs: ["ABC8001"] }
              as: ClientLiaison
              captures: { s8_epoch: "$.data.paperless_sync_epoch" }
            - call: "POST /bureau/paperless-enrollments/${s8_enrollment_id}/revoke"
              payload: {}
              as: ClientLiaison
              captures: { s8_status_revoked: "$.data.status" }
          trigger:
            - call: "POST /bureau/paperless-enrollments"
              payload: { client_id: "${s8_client_id}", account_ref: "ABC8001", channel: "EMAIL" }
              as: ClientLiaison
              captures: { s8_reenrolled_id: "$.data.id", s8_reenrolled_status: "$.data.status", s8_reenrolled_epoch: "$.data.enrolled_epoch" }
          assert:
            - "Pre-state: ${s8_epoch} == 1, the enrollment reached ENROLLED with enrolled_epoch 1, and ${s8_status_revoked} == REVOKED"
            - "${s8_reenrolled_id} == ${s8_enrollment_id} — the same row cycled, no duplicate was created and no ERR_DUPLICATE_CODE was raised"
            - "${s8_reenrolled_status} == PENDING with ${s8_reenrolled_epoch} null, revoked_epoch null, confirmed_at null, revoked_at null and suppression_effective false"
            - "channel is updated to EMAIL and the version advanced by exactly 3 from ${s8_v1} (sync confirmation, revoke, re-enrollment)"
            - "GET /bureau/clients/${s8_client_id}/paperless-enrollments returns total_count == 1"

      - name: paperless_sync_confirms_named_pending_enrollments_at_the_new_epoch
        claim_type: side_effect_execution
        grounds: [endpoints.POST_bureau_clients_id_paperless_sync, calculations.paperless_suppression_resolution]
        distinguishing_aspect: "The sync bumps the client epoch FIRST and stamps the new epoch onto the confirmed rows, so enrolled_epoch equals the post-increment value 1 and not the pre-increment 0."
        test_recipe:
          setup:
            - "Client CL-S9 at paperless_sync_epoch 0 with two PENDING enrollments, ABC9001 and ABC9002."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
            - call: "POST /bureau/clients"
              payload: { client_code: "CL-S9", name: "Suppression Sync Savings", dr_readiness_required: false }
              as: BureauAdmin
              captures: { s9_client_id: "$.data.id", s9_epoch_0: "$.data.paperless_sync_epoch" }
            - call: "POST /bureau/paperless-enrollments"
              payload: { client_id: "${s9_client_id}", account_ref: "ABC9001", channel: "EMAIL" }
              as: ClientLiaison
              captures: { s9_first_id: "$.data.id", s9_first_suppression: "$.data.suppression_effective" }
            - call: "POST /bureau/paperless-enrollments"
              payload: { client_id: "${s9_client_id}", account_ref: "ABC9002", channel: "PORTAL" }
              as: ClientLiaison
              captures: { s9_second_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/clients/${s9_client_id}/paperless-sync"
              payload: { confirm_pending_account_refs: ["ABC9001"] }
              as: ClientLiaison
              captures: { s9_epoch_1: "$.data.paperless_sync_epoch" }
            - call: "GET /bureau/paperless-enrollments/${s9_first_id}"
              payload: {}
              as: ClientLiaison
              captures: { s9_first_status: "$.data.status", s9_first_epoch: "$.data.enrolled_epoch", s9_first_confirmed: "$.data.confirmed_at" }
            - call: "GET /bureau/paperless-enrollments/${s9_second_id}"
              payload: {}
              as: ClientLiaison
              captures: { s9_second_status: "$.data.status" }
          assert:
            - "${s9_epoch_0} == 0 before the sync and ${s9_epoch_1} == 1 after it (HTTP 200)"
            - "${s9_first_suppression} == false at creation — a PENDING row never suppresses"
            - "${s9_first_status} == ENROLLED with ${s9_first_epoch} == 1, ${s9_first_confirmed} == 2026-08-03T06:00:00Z and suppression_effective == true"
            - "${s9_second_status} == PENDING with enrolled_epoch null — the sync touched only the named account_ref"
            - "GET /bureau/clients/${s9_client_id}/paperless-enrollments?status=ENROLLED returns total_count == 1"

      - name: out_of_sequence_scan_is_recorded_without_advancing_the_piece
        claim_type: invalid_transitions
        grounds: [endpoints.POST_bureau_mail_pieces_id_scans, state_machines.MailPiece.COMPOSED_to_PRINTED]
        distinguishing_aspect: "An INSERT read on a COMPOSED piece is refused with OUT_OF_SEQUENCE and changes no MailPiece field at all — unlike the DUPLICATE_STAGE refusal, which does move the integrity dimension."
        test_recipe:
          setup:
            - "Client CL-S14 (dr_readiness_required false), ACTIVE template T-S14 (FIRST_CLASS, sheets_per_document 1, no inserts), one accepted single-record file, job composed and presorted, run scheduled and started so the piece is scannable and still COMPOSED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
