      - name: c_settlement_season_conflict_returns_409
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_SETTLEMENT_SEASON_CONFLICT]"
          - "entities.GrowerSettlement.fields.season_label"
        distinguishing_aspect: "Creating a settlement for a (grower, season) that already has a FINALIZED settlement conflicts (409), whereas superseding a PROVISIONAL one is legal (covered by OCC instance's happy path)."
        test_recipe:
          setup: ["grower with lot condemned at intake day; settlement created and FINALIZED"]
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower AI", grower_code: "G-AI" }, as: ShedAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed DT" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "CONDEMNED", diversion_channel: "WASTE" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/growers/${g_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${g_v}" }, as: SettlementClerk, captures: { st_id: "$.data.id" } }
            - { call: "POST /potato-shed/settlements/${st_id}/finalize", payload: {}, as: SettlementClerk, as_user_id: "clerk_one" }
          trigger:
            - { call: "GET /potato-shed/growers/${g_id}", payload: {}, as: SettlementClerk, captures: { g_v2: "$.data.version" } }
            - { call: "POST /potato-shed/growers/${g_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${g_v2}" }, as: SettlementClerk, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_SETTLEMENT_SEASON_CONFLICT (http 409): FINALIZED blocks a new settlement for the same season"
            - "GET /potato-shed/growers/${g_id}/settlements still lists exactly 1 settlement"

  - section: endpoints
    instances:
      - name: c_envelope_success_and_error_shape
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "Success responses carry meta.api_request_id, meta.api_request_timestamp, response_type object|array and data; error responses carry response_type error with data.error_id and data.message."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower AJ", grower_code: "G-AJ" }, as: ShedAdmin }
          trigger:
            - { call: "GET /potato-shed/sheds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: ShedAdmin, captures: { err: "$.data.error_id", msg: "$.data.message" } }
          assert:
            - "grower create: response_type == 'object', meta.api_request_id present, data.id present"
            - "shed 404: response_type == 'error', err == ERR_SHED_NOT_FOUND, msg is a non-empty string"

      - name: c_pagination_limit_offset_interaction
        claim_type: listing
        grounds:
          - "response_envelope.pagination_fields"
          - "endpoints[GET /potato-shed/field-lots]"
        distinguishing_aspect: "limit=1 pages a 2-lot grower list: page 1 has total_count 2 and has_more true, page 2 (offset=1) returns the second lot with has_more false; defaults are limit 10 offset 0."
        test_recipe:
          setup: ["grower with two INTAKE lots (created in order L_first, L_second)"]
          setup_api_calls:
            - { call: "POST /potato-shed/growers", payload: { name: "Grower AK", grower_code: "G-AK" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l_first: "$.data.id" } }
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "YUKON_GOLD", harvest_date: "2026-07-21", original_weight_cwt: 50.00 }, as: IntakeClerk, captures: { l_second: "$.data.id" } }
          trigger:
            - { call: "GET /potato-shed/field-lots", payload: { grower_id: "${g_id}", limit: 1 }, as: StorageManager, captures: { page1_id: "$.data[0].id" } }
            - { call: "GET /potato-shed/field-lots", payload: { grower_id: "${g_id}", limit: 1, offset: 1 }, as: StorageManager, captures: { page2_id: "$.data[0].id" } }
          assert:
