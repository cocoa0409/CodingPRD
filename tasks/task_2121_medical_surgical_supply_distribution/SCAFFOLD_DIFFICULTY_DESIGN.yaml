      - name: contract_effective_period_closed_interval_touching_endpoints_collide
        grounds:
          - validations[priority=17]
          - errors[ERR_CONTRACT_PERIOD_OVERLAP]
          - entities.GpoContract.fields.effective_from
          - entities.GpoContract.fields.effective_to
          - state_machines.GpoContract.PENDING_ACTIVATION_to_ACTIVE
        distinguishing_aspect: |
          Interval semantics B on a DIFFERENT resource entity, the GPO_CONTRACT price
          period: CLOSED on both ends with ZERO buffer, keyed on (item, member class)
          rather than on a room and a date. A successor whose effective_from equals the
          incumbent's effective_to shares exactly one instant and is therefore refused,
          while starting one second later activates cleanly - the opposite of the
          buffered half-open room geometry.
        test_recipe:
          setup:
            - "One AMBIENT case item priced for the ACUTE member class."
            - "Contract CTR-X (2026-01-01T00:00:00Z .. 2026-08-31T23:59:59Z) ACTIVE with a line for that item."
            - "Contract CTR-Y (2026-08-31T23:59:59Z .. 2026-12-31T23:59:59Z) in PENDING_ACTIVATION with a line for the same item and no supersedes_contract_id."
            - "Contract CTR-Z (2026-09-01T00:00:00Z .. 2026-12-31T23:59:59Z) in PENDING_ACTIVATION with a line for the same item and no supersedes_contract_id."
          setup_api_calls:
