            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 2, title: "Beta", gate_profile: "BETA", funded_amount_cents: 5400000, contractor_budget_cents: 600000, acceptance_criteria: ["All biomes complete", "Online co-op", "Localization pass"], depends_on_milestone_id: "${m1_id}" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m2_id: $.data.id }
            - call: "POST /milestones"
              payload: { agreement_id: "${agreement_id}", sequence_index: 3, title: "Gold", gate_profile: "GOLD", funded_amount_cents: 3000000, contractor_budget_cents: 400000, acceptance_criteria: ["Zero blockers", "Cert submission ready"], depends_on_milestone_id: "${m2_id}" }
              as: Developer
              as_user_id: "${studio_id}"
              captures: { m3_id: $.data.id }
            - call: "POST /development-agreements/${agreement_id}/activate"
