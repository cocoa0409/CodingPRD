            - "No application was created by the refused attempt"
            - "The real attempt returns HTTP 201"
            - "FundingApplication.${app_id}.capital_project_id == ${proj_id}"
            - "FundingApplication.${app_id}.status == SUBMITTED"
            - "FundingApplication.${app_id}.amount_requested_cents == 400000000"
            - "FundingApplication.${app_id}.forgiveness_pct == 0.00"
            - "FundingApplication.${app_id}.awarded_cents == null"
            - "CapitalProject.${proj_id}.funding_status == APPLIED"
