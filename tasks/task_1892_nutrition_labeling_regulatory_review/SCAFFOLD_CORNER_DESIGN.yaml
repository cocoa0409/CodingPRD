        distinguishing_aspect: "A request without X-User-ID / X-User-Role headers fails priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/clients", payload: { name: "NoHdr", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER and HTTP status == 400 (test harness omits both headers for this call)"

