      # ---- spam provisional crosses threshold -> SCREENED_OUT (threshold boundary)
      - name: spam_provisional_at_threshold_screens_out
        claim_type: Constants Applied
        grounds:
          - calculations.spam_score
          - entities.SpamRule.fields.spam_score_threshold
          - entities.SpamRule.fields.anonymous_penalty
          - state_machines.Call.handling_status.RINGING_to_SCREENED_OUT
        distinguishing_aspect: "With anonymous_penalty=90 and spam_score_threshold=90, an anonymous call scores exactly 90 >= 90 -> SCREENED_OUT (>= boundary)."
        test_recipe:
          setup:
            - "Account with PUBLISHED 24h script and ACTIVE SpamRule anonymous_penalty=90, spam_score_threshold=90, blocked_area_codes=[]."
            - "Anonymous inbound (caller_id absent) -> provisional score min(100,90)=90 >= 90 -> SCREENED_OUT."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pth", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Thresh", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/spam-rules"
              payload: { account_id: "${acct_id}", blocked_area_codes: [], spam_score_threshold: 90, anonymous_penalty: 90 }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
          trigger:
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", requested_language: "EN" }
              as: PlatformAdmin
              captures: { call_id: $.data.id, score: $.data.spam_score, h: $.data.handling_status }
          assert:
            - "Call.${call_id}.spam_score == 90"
            - "Call.${call_id}.handling_status == \"SCREENED_OUT\""

      # ---- answer_routing tie-break: higher max_concurrent_calls wins on equal load
      - name: routing_tiebreak_prefers_more_headroom
        claim_type: Correct Result
        grounds:
          - calculations.answer_routing
          - entities.Receptionist.fields.max_concurrent_calls
