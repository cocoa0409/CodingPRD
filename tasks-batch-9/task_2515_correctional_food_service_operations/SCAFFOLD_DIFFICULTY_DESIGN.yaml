  # ===========================================================================
  # Rule 3 - non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: diet_order_suspend_reverify_cycle_caps_at_two_reverifications
        grounds:
          - state_machines.DietOrder.ACTIVE_to_SUSPENDED
          - state_machines.DietOrder.SUSPENDED_to_PENDING_VERIFICATION
          - state_machines.DietOrder.PENDING_VERIFICATION_to_ACTIVE
          - entities.DietOrder.fields.reverification_count
          - validations[priority=39]
        distinguishing_aspect: |
          The DietOrder machine is cyclic on a single row: ACTIVE -> SUSPENDED -> PENDING_VERIFICATION
          -> ACTIVE traverses the same state twice, each loop clears verified_by_user_id and verified_at
          back to null and increments reverification_count, and the loop is bounded at
          MAX_REVERIFICATIONS 2 so the third request-reverification is rejected with
          ERR_REVERIFICATION_LIMIT_REACHED while the order stays SUSPENDED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "ServiceContract CFS-2515-NL1 in status ACTIVE with one Facility FAC-NL1."
            - "One IN_CUSTODY Inmate BK-0001 in housing_unit GENERAL at FAC-NL1."
            - "One MEDICAL DietOrder RENAL for that inmate with clinical_indication set, effective_from 2026-08-01T00:00:00Z, effective_to 2026-09-01T00:00:00Z, requested by rd-001, already verified by md-001 so status is ACTIVE and reverification_count is 0."
            - "That order has been suspended once by fs-001, so it is SUSPENDED with reverification_count 0."
          setup_api_calls:
            - call: "POST /cfs/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/service-contracts"
              payload: { contract_code: "CFS-2515-NL1", vendor_name: "Aramark Correctional Services", contracted_kcal_per_meal_day: 2800, contracted_protein_grams_per_meal_day: 55.0, contracted_sodium_mg_cap_per_meal_day: 2400, cost_ceiling_cents_per_meal_day: 320, ld_cents_per_missed_meal: 750, ld_monthly_cap_cents: 5000000, substitution_allowance_pct: 0.30 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { contract_id: $.data.id }
            - call: "POST /cfs/facilities"
              payload: { contract_id: "${contract_id}", facility_code: "FAC-NL1", name: "North Unit Kitchen", sharps_authorized_count: 12, satellite_site_count: 0, blast_chiller_capacity: 2 }
              as: ContractAdministrator
              as_user_id: "ca-001"
              captures: { facility_id: $.data.id }
            - call: "POST /cfs/service-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-001"
            - call: "POST /cfs/inmates"
              payload: { facility_id: "${facility_id}", booking_number: "BK-0001", housing_unit: "GENERAL" }
              as: CorrectionalOfficer
              as_user_id: "co-001"
              captures: { inmate_id: $.data.id, inmate_v: $.data.version }
            - call: "POST /cfs/diet-orders"
              payload: { inmate_id: "${inmate_id}", order_type: "MEDICAL", diet_code: "RENAL", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_inmate_version: "${inmate_v}", clinical_indication: "Stage 3 chronic kidney disease" }
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { order_id: $.data.id }
            - call: "POST /cfs/diet-orders/${order_id}/verify"
              payload: { verification_note: "Chart reviewed" }
              as: MedicalProvider
              as_user_id: "md-001"
            - call: "POST /cfs/diet-orders/${order_id}/suspend"
              payload: { suspension_reason: "Inmate refused three consecutive renal trays" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
          trigger:
            - call: "POST /cfs/diet-orders/${order_id}/request-reverification"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
            - call: "POST /cfs/diet-orders/${order_id}/verify"
              payload: { verification_note: "Re-verified after refusal counselling" }
              as: MedicalProvider
              as_user_id: "md-001"
            - call: "POST /cfs/diet-orders/${order_id}/suspend"
              payload: { suspension_reason: "Second refusal streak" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/diet-orders/${order_id}/request-reverification"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
            - call: "POST /cfs/diet-orders/${order_id}/verify"
              payload: { verification_note: "Second re-verification" }
              as: MedicalProvider
              as_user_id: "md-001"
            - call: "POST /cfs/diet-orders/${order_id}/suspend"
              payload: { suspension_reason: "Third refusal streak" }
              as: FoodServiceSupervisor
              as_user_id: "fs-001"
            - call: "POST /cfs/diet-orders/${order_id}/request-reverification"
              payload: {}
              as: RegisteredDietitian
              as_user_id: "rd-001"
              captures: { limit_error: $.data.error_id }
          assert:
            - "After the first request-reverification the order was PENDING_VERIFICATION with reverification_count == 1, verified_by_user_id == null and verified_at == null"
            - "After the first re-verify DietOrder.${order_id}.status was ACTIVE with verified_by_user_id == 'md-001', verified_at == 2026-08-01T00:00:00Z and verification_expires_at == 2026-08-31T00:00:00Z"
            - "After the second request-reverification DietOrder.${order_id}.reverification_count == 2"
            - "${limit_error} == ERR_REVERIFICATION_LIMIT_REACHED with HTTP 409"
            - "DietOrder.${order_id}.status == SUSPENDED (the rejected loop left the state untouched)"
            - "DietOrder.${order_id}.reverification_count == 2"
            - "DietOrder.${order_id}.suspension_reason == 'Third refusal streak'"
            - "Inmate.${inmate_id}.active_diet_order_count == 0"
            - "Facility.${facility_id}.active_special_diet_count == 0"

      - name: production_batch_qa_axis_loops_back_while_stage_axis_holds_at_chilled
        grounds:
          - state_machines.ProductionBatch.QA_PENDING_to_QA_HELD
          - state_machines.ProductionBatch.QA_HELD_to_QA_PASSED
          - state_machines.ProductionBatch.CHILLED_to_STAGED
          - calculations.cook_chill_compliance
          - validations[priority=32]
        distinguishing_aspect: |
          ProductionBatch (a different entity from DietOrder) carries two parallel state dimensions:
          the production_stage axis walks PLANNED -> COOKED -> CHILLED while the qa_status axis moves
          QA_PENDING -> QA_HELD on an out-of-range CHILL_FINAL and then loops back QA_HELD -> QA_PASSED
          once a later in-range CHILL_FINAL rehabilitates cook_chill_compliant, and the stage axis is
          blocked at CHILLED with ERR_QA_NOT_PASSED until that loop completes.
