              as: Recruiter
              as_user_id: rec-1
              captures: { err: $.data.error_id }
            - call: "POST /api/requisitions/${req_id}/hold"
              payload: { action: RESUME }
              as: HiringManager
              as_user_id: hm-1
            - call: "POST /api/offers/${offer_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: rec-1
              captures: { st: $.data.status }
          assert:
            - "submit while requisition PAUSED -> ERR_REQUISITION_NOT_OPEN; offer stays DRAFT"
            - "after RESUME the identical submit succeeds: Offer.status == PENDING_APPROVAL"
            - "Requisition.committed_budget_cents == 23400000 after the successful submit (fully 18000000 + 5400000 benefits)"

      - name: hire_gated_by_clearance_posture
        grounds:
          - state_machines.Offer.ACCEPTED_to_HIRED
