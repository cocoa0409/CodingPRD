  # ===================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: operating_statement_inclusive_interval_overlap
        grounds:
          - validations[priority=12]
          - entities.DataSubmission.fields.period_end
          - errors[ERR_STATEMENT_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Resource = the engagement's OPERATING_STATEMENT set; semantics =
          INCLUSIVE closed intervals [period_start, period_end], so a second
          statement whose period_start equals the first's period_end
          (2025-12-31) collides, while one starting the next day is clean.
        test_recipe:
          setup:
            - "Engagement IN_PROGRESS; one OPERATING_STATEMENT covering [2025-01-01, 2025-12-31] in SUBMITTED status"
