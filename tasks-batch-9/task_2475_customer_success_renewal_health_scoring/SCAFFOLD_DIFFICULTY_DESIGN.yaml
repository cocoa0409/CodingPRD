  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: health_tier_floor_is_inclusive_at_exactly_fifty
        grounds:
          - calculations.account_health_score
          - calculations.outcome_attainment_index
          - entities.Account.fields.health_tier
        distinguishing_aspect: |
          Metric 1: the TIER_AMBER_FLOOR comparison on snapshot_health_score,
          reached through POST /outcome-goals/{id}/progress. A score of exactly
          50.00 is AMBER because the floor is an inclusive lower bound, and the
          single-point drop to 49.75 is RED.
        test_recipe:
          setup:
            - "ENTERPRISE Account with exactly one usage row of index 40.00 and one CXO ACTIVE economic buyer, so the adoption term is 40.00, support_component 100.00 and exec_engagement_score 50.00."
            - "One OutcomeGoal with weight_bp 10000, target_value 100 and actual_value 14, so outcome_attainment_index is 14.00 and snapshot_health_score lands on exactly 50.00."
          setup_api_calls:
            - call: "POST /csms"
              payload: { full_name: "Ada Lovelace", coverage_specialty: "HIGH_TOUCH", capacity_units_total: 17 }
              as: CsOpsAdmin
              captures: { csm_a_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Northwind Traders", arr_cents: 30000000, segment_band: "ENTERPRISE", contract_start_date: "2026-01-01", contract_end_date: "2026-12-31" }
              as: CsOpsAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/sponsor-contacts"
              payload: { full_name: "Dana Reed", seniority: "CXO", is_economic_buyer: true }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { sponsor_id: $.data.id }
            - call: "POST /accounts/${acct_id}/signals"
              payload: { signal_kind: "USAGE_PERIOD", period_end_date: "2026-07-31", weekly_active_users: 40, licensed_seats: 100, feature_depth_pct: 40.00 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
            - call: "POST /accounts/${acct_id}/outcome-goals"
              payload: { title: "Weekly active analyst ratio", target_value: 100, weight_bp: 10000, actual_value: 14 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
              captures: { goal_id: $.data.id }
          trigger:
            - call: "POST /outcome-goals/${goal_id}/progress"
              payload: { status: "IN_PROGRESS", actual_value: 13 }
              as: CsmUser
              as_user_id: "${csm_a_id}"
          assert:
            - "before the trigger Account.${acct_id}.snapshot_health_score == 50.00 and health_tier == \"AMBER\""
            - "after the trigger OutcomeGoal.${goal_id}.attainment_pct == 13.00 and Account.${acct_id}.outcome_attainment_index == 13.00"
            - "after the trigger Account.${acct_id}.snapshot_health_score == 49.75 and health_tier == \"RED\""
            - "OutcomeGoal.${goal_id}.status == \"IN_PROGRESS\""

      - name: csm_capacity_admission_accepts_an_exact_fit_and_queues_one_unit_short

        grounds:
          - calculations.csm_capacity_conservation
          - calculations.coverage_load_units
          - state_machines.CoverageAssignment.QUEUED_to_COMMITTED
        distinguishing_aspect: |
          Metric 2 on a different endpoint (POST /coverage-assignments): the
          admission test is `capacity_units_available >= load_units`, so a CSM
          with exactly 17 units admits a 17-unit assignment and lands at
          available 0, while a CSM with 16 units leaves the identical assignment
          in QUEUED.
        test_recipe:
          setup:
            - "Csm P: ACTIVE, HIGH_TOUCH, capacity_units_total 17. Csm Q: ACTIVE, HIGH_TOUCH, capacity_units_total 16."
