scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_practice_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.Practice, endpoints]
        distinguishing_aspect: "POST /practices with all required fields returns 201 and a Practice whose monthly_fee_cents echoes input and id/created_at/version are system-minted (version==1)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /practices"
              payload: { name: "P1", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id, pr_v: $.data.version }
          assert:
            - "response_type == object"
            - "Practice.${pr_id}.monthly_fee_cents == 15000"
            - "Practice.${pr_id}.version == 1"

      - name: get_member_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Member, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_NOT_FOUND"

      - name: register_member_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /members/register omitting the required email returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Practice exists."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "P2", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", full_name: "No Email" }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: register_member_default_plan_type_monthly_applied
        claim_type: Defaults
        grounds: [entities.Member.fields.plan_type]
        distinguishing_aspect: "Omitting plan_type at registration applies the default MONTHLY on the Member, and membership_status starts PENDING_PAYMENT."
        test_recipe:
          setup: ["Practice exists."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "P3", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "def@x.com", full_name: "M Def" }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "Member.${m_id}.plan_type == MONTHLY"
            - "Member.${m_id}.membership_status == PENDING_PAYMENT"

      - name: provider_active_panel_count_computed_starts_zero
        claim_type: Computed Fields
        grounds: [entities.Provider.fields.active_panel_count, entities.Provider.fields.panel_load_bucket]
        distinguishing_aspect: "A freshly created Provider has computed active_panel_count==0 and panel_load_bucket==UNDER_TARGET, ignoring any client-supplied value."
        test_recipe:
          setup: ["Practice exists."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "P4", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
          trigger:
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr Z", npi: "2000000001" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
          assert:
            - "Provider.${prov_id}.active_panel_count == 0"
            - "Provider.${prov_id}.panel_load_bucket == UNDER_TARGET"

      - name: create_visit_slot_invalid_interval_returns_validation
        claim_type: Type Constraints
        grounds: [entities.VisitSlot.fields.starts_at, entities.VisitSlot.fields.ends_at, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Creating a VisitSlot with ends_at == starts_at (not strictly after) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["Provider exists."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "P5", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr Y", npi: "2000000002" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
          trigger:
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-05T10:00:00Z", ends_at: "2026-06-05T10:00:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_VALIDATION"

      - name: payment_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Payment]
        distinguishing_aspect: "Payment has common_fields:false — it exposes id and created_at but no version field and no update endpoint; a successful membership charge returns a Payment with charge_kind echoed and no version."
        test_recipe:
          setup: ["Member m with PCP; charge produces a Payment."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "P6", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr X", npi: "2000000003" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "pay@x.com", full_name: "M Pay", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
          trigger:
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
              captures: { pay_id: $.data.id }
          assert:
            - "Payment.${pay_id}.charge_kind == MEMBERSHIP_FEE"
            - "Payment.${pay_id}.outcome == SUCCEEDED"

      - name: provider_member_panel_fk_reverse_list
        claim_type: Parent Relationships
        grounds: [entities.Member.fields.assigned_provider_id]
        distinguishing_aspect: "After assigning m to prov, GET /providers/{id}/members returns an array containing m (FK reverse-reachability for Member.assigned_provider_id)."
        test_recipe:
          setup: ["Member m assigned to prov."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "P7", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr W", npi: "2000000004" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "panel@x.com", full_name: "M Panel", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /providers/${prov_id}/members"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          assert:
            - "response_type == array"
            - "meta.total_count == 1"

      - name: list_members_pagination_envelope
        claim_type: Listing
        grounds: [entities.Member, endpoints]
        distinguishing_aspect: "GET /members returns a paginated array envelope with total_count==2 and has_more==false reflecting the two members created."
        test_recipe:
          setup: ["Two members registered under one practice."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "P8", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "l1@x.com", full_name: "L1", plan_type: "MONTHLY" }
              as: Anonymous
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "l2@x.com", full_name: "L2", plan_type: "MONTHLY" }
              as: Anonymous
          trigger:
            - call: "GET /members"
              payload: { practice_id: "${pr_id}", limit: 10, offset: 0 }
              as: PlatformAdmin
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == false"

  # =========================================================================
  # State Machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_visit_from_completed_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Visit.BOOKED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED visit cannot be cancelled (cancel is defined only from BOOKED): POST /visits/{id}/cancel returns ERR_INVALID_STATE and clinical_status stays COMPLETED."
        test_recipe:
          setup: ["ACTIVE member m with a COMPLETED visit."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "SM1", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr SM1", npi: "3000000001" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "sm1@x.com", full_name: "M SM1", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-02T09:00:00Z", ends_at: "2026-06-02T09:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", slot_id: "${slot_id}", visit_type: "SAME_DAY", expected_slot_version: "${slot_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/check-in"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /visits/${v_id}/complete"
              payload: { service_lines: [ { service_code: "XRAY", units: 1, unit_charge_cents: 9000 } ] }
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /visits/${v_id}/cancel"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"
            - "Visit.${v_id}.clinical_status == COMPLETED"

      - name: referral_deny_then_authorize_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Referral.REQUESTED_to_DENIED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DENIED is terminal: authorizing a DENIED referral returns ERR_INVALID_STATE and referral_status stays DENIED."
        test_recipe:
          setup: ["ACTIVE member m with a DENIED referral."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "SM2", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr SM2", npi: "3000000002" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "sm2@x.com", full_name: "M SM2", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-02T09:00:00Z", ends_at: "2026-06-02T09:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", slot_id: "${slot_id}", visit_type: "SAME_DAY", expected_slot_version: "${slot_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /referrals"
              payload: { member_id: "${m_id}", origin_visit_id: "${v_id}", specialty: "CARDIOLOGY" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/deny"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /referrals/${ref_id}/authorize"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_INVALID_STATE"
            - "Referral.${ref_id}.referral_status == DENIED"

      - name: referral_authorized_expires_via_sweep
        claim_type: Side Effect Execution
        grounds: [state_machines.Referral.AUTHORIZED_to_EXPIRED, entities.Referral.fields.expires_at]
        distinguishing_aspect: "An AUTHORIZED referral whose expires_at has passed (authorized 2026-06-01, +30d=2026-07-01) is moved to EXPIRED by POST /_billing/run_suspension_sweep run at 2026-07-02."
        test_recipe:
          setup: ["ACTIVE member m with an AUTHORIZED referral; clock advanced past expiry."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "SM3", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr SM3", npi: "3000000003" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "sm3@x.com", full_name: "M SM3", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-02T09:00:00Z", ends_at: "2026-06-02T09:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", slot_id: "${slot_id}", visit_type: "SAME_DAY", expected_slot_version: "${slot_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /referrals"
              payload: { member_id: "${m_id}", origin_visit_id: "${v_id}", specialty: "CARDIOLOGY" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/authorize"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_billing/run_suspension_sweep"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Referral.${ref_id}.referral_status == EXPIRED"

      - name: referral_send_after_expiry_returns_referral_expired
        claim_type: Precondition Enforcement
        grounds: [state_machines.Referral.AUTHORIZED_to_SENT, "validations[priority=14]", "errors[ERR_REFERRAL_EXPIRED]"]
        distinguishing_aspect: "Sending an AUTHORIZED referral at exactly expires_at (2026-07-01) returns ERR_REFERRAL_EXPIRED; distinct from the auto-EXPIRE sweep path, the send precondition clock<expires_at fails."
        test_recipe:
          setup: ["ACTIVE member m with an AUTHORIZED referral; clock advanced to exactly expires_at (2026-07-01)."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "SM4", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr SM4", npi: "3000000004" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "sm4@x.com", full_name: "M SM4", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /providers/${prov_id}/visit-slots"
              payload: { slot_type: "IN_PERSON", starts_at: "2026-06-02T09:00:00Z", ends_at: "2026-06-02T09:30:00Z" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /visits"
              payload: { member_id: "${m_id}", slot_id: "${slot_id}", visit_type: "SAME_DAY", expected_slot_version: "${slot_v}" }
              as: Member
              as_user_id: "${m_id}"
              captures: { v_id: $.data.id }
            - call: "POST /referrals"
              payload: { member_id: "${m_id}", origin_visit_id: "${v_id}", specialty: "CARDIOLOGY" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/authorize"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /referrals/${ref_id}/send"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_REFERRAL_EXPIRED"

      - name: message_thread_open_to_escalated_via_sla_breach
        claim_type: Side Effect Execution
        grounds: [state_machines.MessageThread.OPEN_to_ESCALATED, entities.MessageThread.fields.response_deadline]
        distinguishing_aspect: "An OPEN ROUTINE thread (opened 2026-06-01T09:00Z, deadline +24h=2026-06-02T09:00Z) whose deadline has passed is moved to ESCALATED by the sweep run at 2026-06-02T10:00Z."
        test_recipe:
          setup: ["ACTIVE member m opens a ROUTINE thread at 09:00Z; clock advanced past the 24h deadline."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "SM5", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
