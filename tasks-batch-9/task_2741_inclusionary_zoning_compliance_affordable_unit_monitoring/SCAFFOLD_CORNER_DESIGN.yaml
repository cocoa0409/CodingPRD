      - name: the_discount_tier_is_scanned_on_the_post_surcharge_total
        claim_type: boundary_tiered_pricing
        grounds:
          - calculations.in_lieu_fee_assessment
          - entities.InLieuFee.fields.discount_bps_applied
        distinguishing_aspect: |
          The tier scan runs over pre_discount_total_cents, so the 100000000 boundary is crossed
          by the surcharge rather than by the base amount, and the tiers are not monotonic in the
          obligation: 40000 bps prices a 96000000 base with a 3360000 surcharge for a 99360000
          total that lands one tier below the boundary (150 bps) and is assessed 97869600, while
          40500 bps prices a 97200000 base with a 3402000 surcharge for a 100602000 total that
          clears the boundary (400 bps) and is assessed only 96577920. A smaller obligation
          therefore costs 1291680 cents MORE. A 500 bps fractional assessment stays in the
          leading 0 bps tier and is assessed its full 1242000 pre-discount total.
        test_recipe:
          setup:
