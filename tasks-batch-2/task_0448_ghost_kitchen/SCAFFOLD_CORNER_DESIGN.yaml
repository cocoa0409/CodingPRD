        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[order-cancel-stale-order]"]
        distinguishing_aspect: "Cancel carrying a stale expected_order_version (one less than current) returns ERR_STALE_VERSION (412)."
