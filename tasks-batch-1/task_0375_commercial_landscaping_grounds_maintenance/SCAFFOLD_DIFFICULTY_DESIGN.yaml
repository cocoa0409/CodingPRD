              as: AccountManager
              captures: { contract: $.data.id }
            - call: "POST /v1/plans"
              payload: { service_contract_id: "${contract}", service_type: "MOWING", frequency: "WEEKLY", base_rate_cents: 10000 }
              as: AccountManager
              captures: { plan: $.data.id }
            - call: "POST /v1/contracts/${contract}/activate"
              payload: {}
              as: AccountManager
              captures: { cver: $.data.version }
            - call: "POST /v1/crews"
              payload: { service_account_id: "${acct}", name: "Crew A", hourly_rate_cents: 6000 }
              as: AccountManager
              captures: { crew: $.data.id }
            - call: "POST /v1/routes"
              payload: { crew_id: "${crew}", route_date: "2026-06-01", shift_start_minute: 400, shift_end_minute: 800 }
              as: CrewLead
              captures: { route: $.data.id }
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 480, slot_duration_minute: 90, expected_service_contract_version: "${cver}" }
              as: CrewLead
              captures: { v1: $.data.id }
            - call: "GET /v1/contracts/${contract}"
              payload: {}
              as: AccountManager
              captures: { cver2: $.data.version }
          trigger:
            - call: "POST /v1/visits"
              payload: { service_plan_id: "${plan}", route_schedule_id: "${route}", slot_start_minute: 570, slot_duration_minute: 90, expected_service_contract_version: "${cver2}" }
              as: CrewLead
              captures: { v2: $.data.id }
          trigger_note: "Adjacent [570,660) follows [480,570) with end==start; half-open semantics permit it."
          assert:
            - "response.status == 201"
            - "RouteSchedule.${route}.booked_minutes == 180"

