# =============================================================================
# SCAFFOLD — Family Planning Center: Sliding Fee, Confidentiality & Grant Compliance
# Task: task_3123_family_planning_center_sliding_fee_confidentiality_grant
# Difficulty target: above Expert band — dense coupling, every rule instantiated
# =============================================================================

scenario: |
  Family Planning Center Sliding Fee, Confidentiality & Grant Compliance (Planned Parenthood):
  sliding fee scale determination from household size and income with documentation and
  self-declaration rules, federal family planning grant requirements governing
  confidentiality for minors and priority for low-income clients, third-party billing
  coordination where insured patients may request confidential services without an
  explanatory benefit statement, service delivery scope varying by state law and
  affiliate with referral pathways for out-of-scope needs, contraceptive supply
  inventory including long-acting device stock and rapid reinsertion capacity,
  telehealth service provisioning across state lines with licensure constraints,
  grant reporting on encounters, demographics and outcomes, security and privacy
  operations for patients and staff

domain_name: family-planning-center
api_prefix: /family-planning

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Affiliate
    parent: null
    common_fields: true
    fields:
      - { name: affiliate_code, type: string, source: input, description: "Unique affiliate code (e.g. PP-SW-07)" }
      - { name: state_code, type: string, source: input, description: "Two-letter state the affiliate operates in" }
      - { name: grant_cycle_open, type: boolean, source: system, default: true, description: "Whether the federal grant cycle currently accepts new encounters" }
      - { name: low_income_priority_quota, type: integer, source: input, description: "Minimum percentage (0-100) of grant-cycle encounters that must serve patients at or below 100% FPL" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: ServiceCatalogEntry
    parent: Affiliate
    common_fields: true
    fields:
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id; owning affiliate" }
      - { name: service_code, type: string, source: input, description: "Service code (e.g. CONTRACEPTIVE_COUNSELING, LARC_INSERTION, STI_SCREEN)" }
      - { name: in_scope, type: boolean, source: input, description: "Whether affiliate + state law allow in-house delivery" }
      - { name: telehealth_eligible, type: boolean, source: input, default: false, description: "Whether the service may be delivered via telehealth" }
      - { name: full_fee_cents, type: integer, source: input, description: "Undiscounted list price in cents" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED" }

  - name: FeeScheduleTier
    parent: Affiliate
    common_fields: true
    fields:
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id; owning affiliate" }
      - { name: tier_code, type: string, source: input, description: "Tier label A|B|C|D|E" }
      - { name: fpl_pct_min_inclusive, type: integer, source: input, description: "Lower bound of FPL percentage band, inclusive" }
      - { name: fpl_pct_max_exclusive, type: integer, source: input, description: "Upper bound of FPL percentage band, EXCLUSIVE (band is half-open)" }
      - { name: discount_pct, type: integer, source: input, description: "Discount percentage 0..100 applied to full_fee_cents" }
      - { name: nominal_copay_cents, type: integer, source: input, default: 0, description: "Flat copay floor the patient still owes even at 100% discount" }
      - { name: requires_documentation, type: boolean, source: input, description: "Whether this tier may only be assigned from documented income (not self-declared)" }

  - name: Patient
    parent: Affiliate
    common_fields: true
    fields:
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id; registering affiliate" }
      - { name: external_ref, type: string, source: input, description: "Opaque client-facing reference; never the id" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date; minor status derives from logical clock" }
      - { name: is_minor, type: boolean, source: computed, description: "True when logical-clock current date minus date_of_birth < 18 years" }
      - { name: confidentiality_flag, type: boolean, source: input, default: false, description: "Patient requests confidential handling (no EOB to policyholder, restricted staff views)" }
      - { name: insurance_policy_id, type: string, source: input, default: null, description: "Optional third-party policy reference" }
      - { name: status, type: enum, source: system, description: "ACTIVE only; patients are never deleted or archived in this system" }

  - name: HouseholdAssessment
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; assessed patient" }
      - { name: household_size, type: integer, source: input, description: "Count of household members, >= 1" }
      - { name: annual_income_cents, type: integer, source: input, description: "Declared or documented annual income in cents, >= 0" }
      - { name: income_basis, type: enum, source: input, description: "DOCUMENTED | SELF_DECLARED" }
      - { name: fpl_pct, type: integer, source: computed, description: "Income as percentage of federal poverty level for household size (see calculation)" }
      - { name: assigned_tier_code, type: string, source: computed, description: "FeeScheduleTier.tier_code selected by fee_tier_assignment" }
      - { name: effective_from, type: string, source: system, description: "ISO timestamp (logical clock) when the assessment supersedes" }
      - { name: status, type: enum, source: system, description: "CURRENT | SUPERSEDED" }

  - name: Provider
    parent: Affiliate
    common_fields: true
    fields:
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id; employing affiliate" }
      - { name: display_name, type: string, source: input, description: "Provider display name" }
      - { name: provider_type, type: enum, source: input, description: "PHYSICIAN | NP | RN | COUNSELOR" }
      - { name: status, type: enum, source: system, description: "ACTIVE only; provider suspension is out of scope for this system" }

  - name: ProviderLicense
    parent: Provider
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: system, description: "FK -> Provider.id; licensed provider" }
      - { name: state_code, type: string, source: input, description: "State the license authorizes practice in" }
      - { name: valid_from, type: string, source: input, description: "ISO timestamp, license validity start (inclusive)" }
      - { name: valid_until, type: string, source: input, description: "ISO timestamp, license validity end (EXCLUSIVE)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXPIRED (EXPIRED is derived from logical clock vs valid_until; no explicit suspend path exists)" }

  - name: Encounter
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; served patient" }
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id; delivering affiliate (denormalized from patient)" }
      - { name: service_code, type: string, source: input, description: "Service delivered; must exist in affiliate catalog" }
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; delivering provider" }
      - { name: channel, type: enum, source: input, description: "IN_PERSON | TELEHEALTH" }
      - { name: patient_location_state, type: string, source: input, default: null, description: "Two-letter state the patient is physically in during a TELEHEALTH encounter" }
      - { name: scheduled_start, type: string, source: input, description: "ISO timestamp (logical clock domain)" }
      - { name: scheduled_end, type: string, source: input, description: "ISO timestamp; must be > scheduled_start" }
      - { name: assessment_id, type: string, source: system, description: "FK -> HouseholdAssessment.id; pinned CURRENT assessment at scheduling time" }
      - { name: patient_charge_cents, type: integer, source: computed, description: "Discounted charge per sliding_fee_charge calculation" }
      - { name: clinical_status, type: enum, source: system, description: "Parallel dimension 1: SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: billing_status, type: enum, source: system, description: "Parallel dimension 2: UNBILLED | CLAIMED | SETTLED | WAIVED" }

  - name: Claim
    parent: Encounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> Encounter.id; billed encounter" }
      - { name: policy_id, type: string, source: system, description: "Insurance policy reference copied from Patient.insurance_policy_id at submission" }
      - { name: confidential_suppression, type: boolean, source: system, description: "True when EOB suppression applies (minor-consent or confidentiality_flag services)" }
      - { name: billed_cents, type: integer, source: computed, description: "Amount billed to the payer (full_fee - patient_charge when not suppressed)" }
      - { name: paid_cents, type: integer, source: system, default: 0, description: "Cumulative payer payments applied" }
      - { name: recouped_cents, type: integer, source: system, default: 0, description: "Cumulative payer recoupments applied" }
      - { name: net_receivable_cents, type: integer, source: computed, description: "billed_cents - paid_cents + recouped_cents" }
      - { name: submission_round, type: integer, source: system, default: 1, description: "Resubmission counter; increments on each RETURNED -> SUBMITTED loop" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | PAID | DENIED | VOID" }

  - name: ContraceptiveStockLot
    parent: Affiliate
    common_fields: true
    fields:
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id; stocking affiliate" }
      - { name: device_code, type: string, source: input, description: "Device family (IUD_COPPER, IUD_HORMONAL, IMPLANT)" }
      - { name: lot_number, type: string, source: input, description: "Manufacturer lot" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Acquisition cost per unit" }
      - { name: on_hand, type: integer, source: system, description: "Unreserved physical units" }
      - { name: reserved_out, type: integer, source: system, default: 0, description: "Units reserved to scheduled insertions or reinsertions" }
      - { name: expires_on, type: string, source: input, description: "ISO date; lot must not be dispensed on/after this date (logical clock)" }

  - name: DeviceReservation
    parent: Encounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> Encounter.id; insertion encounter holding the reservation" }
      - { name: lot_id, type: string, source: system, description: "FK -> ContraceptiveStockLot.id; reserved lot" }
      - { name: is_rapid_reinsertion, type: boolean, source: input, default: false, description: "True when this reservation is a rapid reinsertion following an expulsion" }
      - { name: expulsion_recorded_at, type: string, source: input, default: null, description: "ISO timestamp of the prior expulsion; required when is_rapid_reinsertion" }
      - { name: status, type: enum, source: system, description: "RESERVED | FULFILLED | RELEASED" }

  - name: ReferralOrder
    parent: Encounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: system, description: "FK -> Encounter.id; originating encounter" }
      - { name: requested_service_code, type: string, source: input, description: "Out-of-scope service the patient needs" }
      - { name: receiving_org, type: string, source: input, description: "External organization name" }
      - { name: reason_code, type: enum, source: system, description: "OUT_OF_SCOPE_STATE_LAW | OUT_OF_SCOPE_AFFILIATE | CAPACITY" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED | COMPLETED | WITHDRAWN" }

  - name: GrantReport
    parent: Affiliate
    common_fields: true
    fields:
      - { name: affiliate_id, type: string, source: system, description: "FK -> Affiliate.id; reporting affiliate" }
      - { name: period_start, type: string, source: input, description: "ISO timestamp, inclusive" }
      - { name: period_end, type: string, source: input, description: "ISO timestamp, EXCLUSIVE (half-open period)" }
      - { name: encounter_count, type: integer, source: computed, description: "Count of COMPLETED encounters whose scheduled_start falls in [period_start, period_end)" }
      - { name: low_income_encounter_count, type: integer, source: computed, description: "COMPLETED encounters in period whose pinned assessment fpl_pct < 100" }
      - { name: minor_encounter_count, type: integer, source: computed, description: "COMPLETED encounters in period whose patient is_minor at encounter scheduled_start" }
      - { name: device_value_cents, type: integer, source: computed, description: "Value of FULFILLED devices in period per device_valuation calculation variant" }
      - { name: valuation_variant, type: enum, source: input, description: "FIFO | WEIGHTED_AVERAGE — pins which device_valuation variant this report uses" }
      - { name: low_income_quota_met, type: boolean, source: computed, description: "low_income_encounter_count * 100 >= encounter_count * affiliate.low_income_priority_quota (0-count period => true)" }
      - { name: amendment_of, type: string, source: input, default: null, description: "FK -> GrantReport.id; set when this report amends a FINALIZED report" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | SUPERSEDED" }

  - name: PrivacyHold
    parent: Patient
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: system, description: "FK -> Patient.id; protected patient" }
      - { name: hold_start, type: string, source: input, description: "ISO timestamp, inclusive" }
      - { name: hold_end, type: string, source: input, description: "ISO timestamp, EXCLUSIVE (half-open)" }
      - { name: scope, type: enum, source: input, description: "RECORD_VIEW | BILLING_CORRESPONDENCE | ALL" }
      - { name: authorized_staff_ids, type: array, source: input, description: "Staff (opaque ids) permitted through the hold; empty array = no one" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Affiliate
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /family-planning/affiliates/{affiliateId}/suspend"
        actor: GrantAdministrator
        preconditions: []
        side_effects:
          - "Every ServiceCatalogEntry of the affiliate in ACTIVE -> SUSPENDED"
          - "Each catalog suspension blocks new Encounters for that service_code (cross-entity gate)"
          - "Each blocked future Encounter creation attempt surfaces ERR_SERVICE_OUT_OF_SCOPE (handled at validation, not by mutating encounters)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /family-planning/affiliates/{affiliateId}/reinstate"
        actor: GrantAdministrator
        preconditions: []
        side_effects:
          - "Every ServiceCatalogEntry in SUSPENDED -> ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /family-planning/affiliates/{affiliateId}/close"
        actor: GrantAdministrator
        preconditions:
          - "No Encounter with clinical_status IN {SCHEDULED, IN_PROGRESS} (ERR_AFFILIATE_HAS_OPEN_ENCOUNTERS)"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /family-planning/affiliates/{affiliateId}/close"
        actor: GrantAdministrator
        preconditions:
          - "No Encounter with clinical_status IN {SCHEDULED, IN_PROGRESS} (ERR_AFFILIATE_HAS_OPEN_ENCOUNTERS)"
        side_effects: []

  - entity: Encounter
    initial_state: "SCHEDULED (clinical) / UNBILLED (billing)"
    terminal_states: ["CANCELLED (clinical) with billing UNBILLED or WAIVED", "COMPLETED (clinical) with billing SETTLED or WAIVED"]
    transitions:
      - from: "SCHEDULED/UNBILLED"
        to: "IN_PROGRESS/UNBILLED"
        trigger: "POST /family-planning/encounters/{encounterId}/start"
        actor: Clinician
        preconditions:
          - "clinical_status == SCHEDULED"
          - "logical clock >= scheduled_start"
        side_effects: []
      - from: "IN_PROGRESS/UNBILLED"
        to: "COMPLETED/UNBILLED"
        trigger: "POST /family-planning/encounters/{encounterId}/complete"
        actor: Clinician
        preconditions:
          - "clinical_status == IN_PROGRESS"
        side_effects:
          - "Every DeviceReservation of this encounter in RESERVED -> FULFILLED; ContraceptiveStockLot.on_hand unchanged, reserved_out -= 1 (the unit leaves stock: on_hand -= 1 AND reserved_out -= 1)"
          - "Affiliate grant-cycle aggregates eligible for recompute at next GrantReport generation"
      - from: "SCHEDULED/UNBILLED"
        to: "CANCELLED/UNBILLED"
        trigger: "POST /family-planning/encounters/{encounterId}/cancel"
        actor: FrontDeskStaff
        preconditions:
          - "clinical_status == SCHEDULED"
        side_effects:
          - "Every DeviceReservation of this encounter in RESERVED -> RELEASED; ContraceptiveStockLot.reserved_out -= 1 (on_hand unchanged — compensating invariant restores reserved pool)"
      - from: "COMPLETED/UNBILLED"
        to: "COMPLETED/CLAIMED"
        trigger: "POST /family-planning/encounters/{encounterId}/claims (Claim creation, status SUBMITTED)"
        actor: BillingSpecialist
        preconditions:
          - "clinical_status == COMPLETED AND billing_status == UNBILLED"
        side_effects:
          - "Claim created; billed_cents computed per claim_billed_amount"
      - from: "COMPLETED/CLAIMED"
        to: "COMPLETED/SETTLED"
        trigger: "POST /family-planning/claims/{claimId}/settle (Claim reaches PAID with net_receivable_cents == 0, or claim DENIED with patient write-off)"
        actor: BillingSpecialist
        preconditions:
          - "Claim.status IN {PAID, DENIED}"
        side_effects: []
      - from: "COMPLETED/UNBILLED"
        to: "COMPLETED/WAIVED"
        trigger: "POST /family-planning/encounters/{encounterId}/waive-billing"
        actor: BillingSpecialist
        preconditions:
          - "Patient.confidentiality_flag == true OR patient is_minor at encounter time (confidential services bypass third-party billing entirely)"
        side_effects: []
      - from: "SCHEDULED-or-COMPLETED / UNBILLED-or-CLAIMED"
        to: "same clinical / same billing (patient_charge recalc)"
        trigger: "system (a new HouseholdAssessment on the same Patient supersedes the pinned one)"
        actor: system
        preconditions:
          - "billing_status IN {UNBILLED, CLAIMED} (SETTLED and WAIVED encounters are never re-priced)"
        side_effects:
          - "patient_charge_cents recomputed under the new CURRENT assessment (assessment_id re-pinned)"
          - "when billing_status == CLAIMED, the encounter's open Claim recomputes billed_cents (chain link 3)"
          - "encounter.version incremented"
        note: "cascade link 2 of the assessment-supersede chain"

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, DENIED, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /family-planning/claims/{claimId}/submit"
        actor: BillingSpecialist
        preconditions:
          - "Encounter.clinical_status == COMPLETED"
          - "confidential_suppression == false (a suppressed claim may never be submitted to a payer)"
        side_effects:
          - "Encounter.billing_status UNBILLED -> CLAIMED"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /family-planning/claims/{claimId}/return"
        actor: BillingSpecialist
        preconditions: []
        side_effects: []
        note: "payer requests correction; cycle back"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /family-planning/claims/{claimId}/resubmit"
        actor: BillingSpecialist
        preconditions:
          - "submission_round < 3 (ERR_CLAIM_RESUBMISSION_EXHAUSTED at round 3)"
        side_effects:
          - "submission_round += 1"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /family-planning/claims/{claimId}/adjudicate"
        actor: BillingSpecialist
        preconditions: []
        side_effects:
          - "paid_cents set per payment application; net_receivable_cents recomputed"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /family-planning/claims/{claimId}/deny"
        actor: BillingSpecialist
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: VOID
        trigger: "POST /family-planning/claims/{claimId}/void"
        actor: BillingSpecialist
        preconditions: []
        side_effects:
          - "Encounter.billing_status CLAIMED -> UNBILLED if it had been flipped by an earlier submit — otherwise unchanged"
      - from: PAID
        to: PAID (recoupment posting)
        trigger: "POST /family-planning/claims/{claimId}/recoup"
        actor: BillingSpecialist
        preconditions:
          - "recoup amount <= paid_cents - recouped_cents (ERR_RECOUPMENT_EXCEEDS_PAID)"
        side_effects:
          - "recouped_cents += amount; net_receivable_cents recomputed (compensating invariant: paid - recouped conserved against billed)"

  - entity: DeviceReservation
    initial_state: RESERVED
    terminal_states: [FULFILLED, RELEASED]
    transitions:
      - from: RESERVED
        to: FULFILLED
        trigger: "system (encounter completes)"
        actor: system
        preconditions: []
        side_effects:
          - "lot.on_hand -= 1 AND lot.reserved_out -= 1"
      - from: RESERVED
        to: RELEASED
        trigger: "system (encounter cancels) OR POST /family-planning/device-reservations/{reservationId}/release"
        actor: "system | SupplyCoordinator"
        preconditions: []
        side_effects:
          - "lot.reserved_out -= 1 (on_hand unchanged)"

  - entity: ReferralOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /family-planning/referral-orders/{referralId}/acknowledge"
        actor: CareCoordinator
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: COMPLETED
        trigger: "POST /family-planning/referral-orders/{referralId}/complete"
        actor: CareCoordinator
        preconditions: []
        side_effects: []
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /family-planning/referral-orders/{referralId}/withdraw"
        actor: CareCoordinator
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: WITHDRAWN
        trigger: "POST /family-planning/referral-orders/{referralId}/withdraw"
        actor: CareCoordinator
        preconditions: []
        side_effects: []

  - entity: GrantReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /family-planning/grant-reports/{reportId}/finalize"
        actor: GrantAdministrator
        preconditions:
          - "period_end <= logical clock now (cannot finalize a period that has not closed)"
        side_effects: []
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (a new GrantReport with amendment_of == this report is created)"
        actor: system
        preconditions: []
        side_effects:
          - "Amending report captures this report's aggregates as baseline; amendment chain depth unrestricted"

  - entity: PrivacyHold
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /family-planning/privacy-holds/{holdId}/release"
        actor: PrivacyOfficer
        preconditions: []
        side_effects: []

  - entity: HouseholdAssessment
    initial_state: CURRENT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: CURRENT
        to: SUPERSEDED
        trigger: "system (a new HouseholdAssessment is created for the same Patient)"
        actor: system
        preconditions: []
        side_effects:
          - "The superseding assessment becomes the patient's only CURRENT assessment"
          - "Cascade: every Encounter of the patient with billing_status IN {UNBILLED, CLAIMED} re-pins assessment_id and recomputes patient_charge_cents (chain link 2)"
          - "Cascade: for every such re-priced encounter whose billing_status == CLAIMED, the open Claim's billed_cents is recomputed and the Claim's updated_at refreshes (chain link 3)"
          - "Cascade: any DRAFT GrantReport of the affiliate whose half-open period covers a re-priced encounter's scheduled_start refreshes its aggregate fields (chain link 4 — encounter_count unchanged; low_income_encounter_count and device_value_cents re-derived)"
        note: "chain: assessment supersede -> encounter reprice -> claim recompute -> DRAFT report refresh"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: assessment-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /family-planning/patients/{patientId}/household-assessments"
    occ_field: "expected_patient_version"
    description: |
      Creating a HouseholdAssessment against a Patient whose version has advanced
      since the client last observed it is rejected. The new assessment legitimately
      supersedes the prior CURRENT one, so a writer holding a stale patient view
      must re-read before superseding.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: report-amend-stale-affiliate
    parent_entity: Affiliate
    write_endpoint: "POST /family-planning/affiliates/{affiliateId}/grant-reports"
    occ_field: "expected_affiliate_version"
    description: |
      Creating a GrantReport (initial or amendment) against an Affiliate whose
      version has advanced since the client last observed it is rejected; the
      writer's view of the affiliate's reporting lineage is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fpl_percentage
    trigger: "HouseholdAssessment creation"
    algorithm: threshold
    formula: |
      fpl_base = FPL_TABLE[household_size]   # annual cents; sizes > 8 use size 8 base + (size-8) * FPL_INCREMENT
      fpl_pct = floor(annual_income_cents * 100 / fpl_base)
      Integer percentage, truncated toward zero. Income exactly equal to the base
      yields exactly 100 (NOT 99).
    constants:
      FPL_TABLE: {1: 1506000, 2: 2044200, 3: 2582400, 4: 3120600, 5: 3658800, 6: 4197000, 7: 4735200, 8: 5273400}
      FPL_INCREMENT: 538200
    precision: "integer percent, floor"
    input_set: "The assessment's own household_size and annual_income_cents"

  - name: fee_tier_assignment
    trigger: "HouseholdAssessment creation, after fpl_percentage"
    algorithm: constraint_propagation
    formula: |
      1. Candidate tiers = affiliate's FeeScheduleTier rows where
         fpl_pct_min_inclusive <= fpl_pct < fpl_pct_max_exclusive  (half-open bands).
      2. Variant filter:
         - income_basis == DOCUMENTED: all candidates eligible.
         - income_basis == SELF_DECLARED: only candidates with requires_documentation == false eligible.
      3. If the eligible set is empty -> ERR_NO_ELIGIBLE_TIER (422).
      4. If multiple candidates remain (overlapping misconfiguration), pick the one
         with the highest discount_pct; tie-break by lowest fpl_pct_min_inclusive,
         then by tier.created_at ASC. Server MUST detect overlap deterministically.
      5. Self-declaration ceiling: a SELF_DECLARED assessment can never receive a
         tier whose discount_pct exceeds SELF_DECLARE_MAX_DISCOUNT_PCT even if the
         tier is marked requires_documentation == false; such tiers are excluded
         from the eligible set for SELF_DECLARED.
    constants:
      SELF_DECLARE_MAX_DISCOUNT_PCT: 80
    input_set: "Affiliate's FeeScheduleTier rows (all statuses — config table has no status)"
    note: "DOCUMENTED vs SELF_DECLARED are the dual variants (Rule 1, instance 1): identical income and household size can yield different assigned_tier_code"

  - name: sliding_fee_charge
    trigger: "Encounter creation; re-run on assessment supersede cascade"
    algorithm: tiered_pricing
    formula: |
      tier = FeeScheduleTier identified by encounter.assessment.assigned_tier_code
      discount = floor(full_fee_cents * tier.discount_pct / 100)     # round DOWN the discount first
      charge = full_fee_cents - discount                              # then subtract
      charge = max(charge, tier.nominal_copay_cents)                  # nominal copay floor
      Evaluation order pinned: per-service rounding of the discount BEFORE any
      summation; a multi-service visit sums the per-service rounded charges
      (round-per-line-then-sum — the alternative sum-then-round is FORBIDDEN).
    precision: "integer cents; floor on discount"
    input_set: "The encounter's service_code row in the affiliate catalog (must be ACTIVE) and the pinned assessment"

  - name: claim_billed_amount
    trigger: "Claim creation; recompute on assessment-supersede cascade link 3"
    algorithm: aggregation
    formula: |
      if confidential_suppression: billed_cents = 0  (claim exists for records only; nothing billed to payer)
      else: billed_cents = full_fee_cents - encounter.patient_charge_cents
      net_receivable_cents = billed_cents - paid_cents + recouped_cents
    precision: "integer cents"
    input_set: "The parent Encounter and the Patient's confidentiality state at claim creation"

  - name: device_valuation
    trigger: "GrantReport generation (DRAFT creation) and amendment"
    algorithm: chronological
    formula: |
      Input set: DeviceReservation rows with status == FULFILLED whose encounter's
      scheduled_start falls in [period_start, period_end), joined to their lot.
      Variant FIFO:
        value fulfilled units in order of each unit's lot created_at ASC, then
        reservation.created_at ASC; value each unit at its own lot.unit_cost_cents.
      Variant WEIGHTED_AVERAGE:
        per device_code, avg_cost = floor(sum(lot.unit_cost_cents * units fulfilled from lot)
        / total units fulfilled of that device_code); device_value = sum over codes of
        avg_cost * units_of_code.
      The two variants produce different device_value_cents whenever lots of the
      same device_code carry different unit_cost_cents (Rule 1, instance 2).
    precision: "integer cents; floor on average"
    input_set: "FULFILLED reservations joined through Encounter.scheduled_start window [period_start, period_end)"
    variants:
      - name: FIFO
        when: "GrantReport.valuation_variant == FIFO"
        difference: "per-unit lot cost in chronological order"
      - name: WEIGHTED_AVERAGE
        when: "GrantReport.valuation_variant == WEIGHTED_AVERAGE"
        difference: "per-device_code weighted mean, floored"

  - name: grant_quota_check
    trigger: "GrantReport generation"
    algorithm: threshold
    formula: |
      if encounter_count == 0: low_income_quota_met = true
      else: low_income_quota_met =
        (low_income_encounter_count * 100) >= (encounter_count * affiliate.low_income_priority_quota)
      Boundary: exact equality counts as MET (>=).
    precision: "integer arithmetic only (no float division)"
    input_set: "COMPLETED encounters with scheduled_start in [period_start, period_end); low-income = pinned assessment fpl_pct < 100 (strictly below — a patient at exactly 100% FPL does NOT count toward the quota)"

  - name: rapid_reinsertion_eligibility
    trigger: "DeviceReservation creation with is_rapid_reinsertion == true"
    algorithm: threshold
    formula: |
      window: (reservation encounter scheduled_start - expulsion_recorded_at) <= RAPID_REINSERTION_WINDOW
      The comparison is inclusive: exactly 30 days is eligible; 30 days + 1 second is not.
      Eligible rapid reinsertions may reserve from lots with expires_on within
      RAPID_LOT_EXPIRY_GRACE_DAYS of the encounter date (grace); normal reservations
      may not use lots expiring before the encounter date at all.
    constants:
      RAPID_REINSERTION_WINDOW: "P30D (30 days)"
      RAPID_LOT_EXPIRY_GRACE_DAYS: 7
    precision: "second precision on timestamps"

  - name: privacy_hold_overlap
    trigger: "PrivacyHold creation"
    algorithm: interval_merge
    formula: |
      Existing ACTIVE holds of the same patient with the SAME scope:
      half-open [hold_start, hold_end). Overlap iff existing.hold_start < new.hold_end
      AND new.hold_start < existing.hold_end. Adjacent intervals (new.hold_start ==
      existing.hold_end) do NOT overlap and do NOT merge — they remain distinct holds.
      Overlapping same-scope holds are REJECTED with ERR_PRIVACY_HOLD_OVERLAP;
      the system never silently merges.
      Different scopes may overlap freely.
    input_set: "Patient's ACTIVE PrivacyHold rows"

  - name: telehealth_licensure_window
    trigger: "Encounter creation with channel == TELEHEALTH"
    algorithm: interval_merge
    formula: |
      The delivering Provider must hold a ProviderLicense where:
        license.state_code == encounter.patient_location_state
        license.status == ACTIVE
        license.valid_from <= encounter.scheduled_start
        license.valid_until >= encounter.scheduled_end   # containment over the WHOLE interval
      A license valid at the start instant but expiring mid-encounter FAILS —
      point-in-time checks are forbidden; the entire half-open encounter interval
      [scheduled_start, scheduled_end) must be contained in the half-open license
      interval [valid_from, valid_until).
    input_set: "Provider's ProviderLicense rows"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission to perform this operation per RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource ids in path must exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Parent Affiliate must be ACTIVE for any child creation (patient, provider, catalog, tier, stock, grant report)"
    error_id: ERR_AFFILIATE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST endpoints under an affiliate scope"

  - priority: 4.5
    category: business_safety
    check: "PrivacyHold enforcement: a staff caller whose X-User-ID is not on authorized_staff_ids of any ACTIVE hold covering the logical-clock now (scope RECORD_VIEW or ALL) may not read or mutate the patient record or any descendant resource (encounters, claims, assessments, holds, reservations, referrals of that patient)"
    error_id: ERR_PRIVACY_HOLD_BLOCKS_ACCESS
    http_status: 403
    applies_to: "all endpoints scoped to a Patient or a patient-descendant resource (encounters, claims, household-assessments, device-reservations, referral-orders of that patient), EXCEPT the privacy-hold management endpoints themselves (POST/GET privacy-holds, release) which are never blocked by a hold"
    note: "Priority conflict pair #1: business_safety (4.5) vs state (5/5.5) — the hold check runs BEFORE state checks on patient-scoped requests so a held record leaks nothing: a state-invalid action on a held patient returns ERR_PRIVACY_HOLD_BLOCKS_ACCESS, not the state error. The hold still loses to auth (1-2) and existence (3-4)."

  - priority: 5
    category: state
    check: "Target resource must be in the correct state for the requested transition"
    error_id: "varies (ERR_INVALID_STATE family)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5.5
    category: state
    check: "Encounter creation requires the patient to hold a CURRENT HouseholdAssessment (the sliding-fee pin is mandatory)"
    error_id: ERR_NO_CURRENT_ASSESSMENT
    http_status: 422
    applies_to: "POST /family-planning/patients/{patientId}/encounters"

  - priority: 6
    category: business_safety
    check: "Confidential-suppression gate: a Claim on an encounter whose patient is_minor (at encounter time) or has confidentiality_flag == true MUST be created with confidential_suppression = true (and therefore billed_cents == 0); submitting ANY claim whose confidential_suppression == true is rejected — suppressed claims may never reach a payer"
    error_id: ERR_CONFIDENTIAL_SERVICE_CANNOT_BILL
    http_status: 422
    applies_to: "POST /family-planning/claims/{claimId}/submit; Claim creation"

  - priority: 7
    category: business_referential
    check: "Encounter service_code must resolve to an ACTIVE ServiceCatalogEntry of the affiliate with in_scope == true; otherwise a ReferralOrder is the correct artifact"
    error_id: ERR_SERVICE_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /family-planning/patients/{patientId}/encounters"

  - priority: 8
    category: business_safety
    check: "Telehealth licensure: TELEHEALTH encounter requires a containing ACTIVE ProviderLicense for patient_location_state (whole-interval containment)"
    error_id: ERR_TELEHEALTH_LICENSE_GAP
    http_status: 422
    applies_to: "POST /family-planning/patients/{patientId}/encounters"
    note: "Priority conflict pair #2: business_referential (7) vs business_safety (8) — an encounter that is BOTH out-of-scope AND license-gapped returns ERR_SERVICE_OUT_OF_SCOPE first"

  - priority: 9
    category: business_temporal
    check: "Encounter interval well-formed: scheduled_end > scheduled_start; both within affiliate grant_cycle_open window (grant_cycle_open must be true at creation)"
    error_id: ERR_INVALID_INTERVAL
    http_status: 400
    applies_to: "POST /family-planning/patients/{patientId}/encounters"

  - priority: 10
    category: business_temporal
    check: "PrivacyHold half-open overlap rejection (same patient, same scope)"
    error_id: ERR_PRIVACY_HOLD_OVERLAP
    http_status: 409
    applies_to: "POST /family-planning/patients/{patientId}/privacy-holds"

  - priority: 11
    category: business_constraint
    check: "DeviceReservation: encounter clinical_status == SCHEDULED (reservations only against not-yet-started encounters); lot has on_hand - reserved_out >= 1; lot not expired vs encounter date (or within grace for eligible rapid reinsertion); rapid-reinsertion window <= 30 days inclusive"
    error_id: "ERR_INVALID_STATE | ERR_STOCK_UNAVAILABLE | ERR_LOT_EXPIRED | ERR_REINSERTION_WINDOW_EXCEEDED"
    http_status: 422
    applies_to: "POST /family-planning/encounters/{encounterId}/device-reservations"

  - priority: 12
    category: business_fiscal
    check: "Claim recoupment: amount <= paid_cents - recouped_cents; payment application: amount <= net_receivable_cents"
    error_id: "ERR_RECOUPMENT_EXCEEDS_PAID | ERR_OVERPAYMENT"
    http_status: 422
    applies_to: "POST /family-planning/claims/{claimId}/recoup; POST /family-planning/claims/{claimId}/adjudicate"
    note: "Priority conflict pair #3 anchor: referential (7) vs fiscal (12) never co-occur on one endpoint; the fiscal pair is exercised on claim endpoints against the safety gate (6): a suppressed claim whose adjudication would overpay returns ERR_CONFIDENTIAL_SERVICE_CANNOT_BILL-class safety errors before fiscal checks"

  - priority: 13
    category: business_fiscal
    check: "GrantReport finalize: period closed; affiliate low-income quota computed; no second DRAFT report for an overlapping half-open period on the same affiliate"
    error_id: "ERR_REPORT_PERIOD_OPEN | ERR_REPORT_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "GrantReport create/finalize endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/family-planning/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time before the first call."
    roles: [GrantAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Re-derive EXPIRED ProviderLicense statuses and Patient.is_minor against the new logical time"]

  # --- Affiliate ---
  - method: POST
    path: "/family-planning/affiliates"
    description: "Register an affiliate"
    roles: [GrantAdministrator]
    code: 201
    input: [affiliate_code, state_code, low_income_priority_quota]
    output: Affiliate
    side_effects: ["status = ACTIVE, grant_cycle_open = true, version = 1"]

  - method: GET
    path: "/family-planning/affiliates"
    description: "List affiliates"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, SupplyCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?", "state_code?"]
    output: "Affiliate[]"
    side_effects: []

  - method: GET
    path: "/family-planning/affiliates/{affiliateId}"
    description: "Get one affiliate"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, SupplyCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: []
    output: Affiliate
    side_effects: []

  - method: POST
    path: "/family-planning/affiliates/{affiliateId}/suspend"
    description: "Suspend affiliate; cascades catalog entries to SUSPENDED"
    roles: [GrantAdministrator]
    code: 200
    input: []
    output: Affiliate
    side_effects: ["catalog entries ACTIVE -> SUSPENDED", "increments Affiliate.version by 1"]

  - method: POST
    path: "/family-planning/affiliates/{affiliateId}/reinstate"
    description: "Reinstate affiliate; cascades catalog entries back to ACTIVE"
    roles: [GrantAdministrator]
    code: 200
    input: []
    output: Affiliate
    side_effects: ["catalog entries SUSPENDED -> ACTIVE", "increments Affiliate.version by 1"]

  - method: POST
    path: "/family-planning/affiliates/{affiliateId}/close"
    description: "Close affiliate (no open encounters)"
    roles: [GrantAdministrator]
    code: 200
    input: []
    output: Affiliate
    side_effects: ["increments Affiliate.version by 1"]

  # --- ServiceCatalogEntry ---
  - method: POST
    path: "/family-planning/affiliates/{id}/service-catalog"
    description: "Add a service to the affiliate catalog"
    roles: [GrantAdministrator]
    code: 201
    input: [service_code, in_scope, "telehealth_eligible?", full_fee_cents]
    output: ServiceCatalogEntry
    side_effects: []

  - method: GET
    path: "/family-planning/affiliates/{id}/service-catalog"
    description: "List catalog entries of an affiliate"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, SupplyCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: "ServiceCatalogEntry[]"
    side_effects: []

  # --- FeeScheduleTier ---
  - method: POST
    path: "/family-planning/affiliates/{id}/fee-tiers"
    description: "Add a sliding-fee tier band"
    roles: [GrantAdministrator]
    code: 201
    input: [tier_code, fpl_pct_min_inclusive, fpl_pct_max_exclusive, discount_pct, "nominal_copay_cents?", requires_documentation]
    output: FeeScheduleTier
    side_effects: []

  - method: GET
    path: "/family-planning/affiliates/{id}/fee-tiers"
    description: "List fee tiers of an affiliate"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, SupplyCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: "FeeScheduleTier[]"
    side_effects: []

  # --- Patient ---
  - method: POST
    path: "/family-planning/affiliates/{id}/patients"
    description: "Register a patient"
    roles: [FrontDeskStaff]
    code: 201
    input: [external_ref, date_of_birth, "confidentiality_flag?", "insurance_policy_id?"]
    output: Patient
    side_effects: ["is_minor computed against logical clock"]

  - method: GET
    path: "/family-planning/affiliates/{id}/patients"
    description: "List patients of an affiliate"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: "Patient[]"
    side_effects: []

  - method: GET
    path: "/family-planning/patients/{patientId}"
    description: "Get one patient (privacy-hold enforced)"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # --- HouseholdAssessment ---
  - method: POST
    path: "/family-planning/patients/{id}/household-assessments"
    description: "Create an assessment; supersedes prior CURRENT; OCC on patient version"
    roles: [FrontDeskStaff]
    code: 201
    input: [household_size, annual_income_cents, income_basis, expected_patient_version]
    output: HouseholdAssessment
    side_effects:
      - "computes fpl_pct and assigned_tier_code"
      - "supersedes prior CURRENT assessment"
      - "cascade: SCHEDULED encounters re-pin + recompute patient_charge_cents"
      - "cascade: open Claims on CLAIMED encounters recompute billed_cents"
      - "increments Patient.version by 1"

  - method: GET
    path: "/family-planning/patients/{id}/household-assessments"
    description: "List assessments of a patient"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: "HouseholdAssessment[]"
    side_effects: []

  # --- Provider / License ---
  - method: POST
    path: "/family-planning/affiliates/{id}/providers"
    description: "Register a provider"
    roles: [GrantAdministrator]
    code: 201
    input: [display_name, provider_type]
    output: Provider
    side_effects: []

  - method: GET
    path: "/family-planning/affiliates/{id}/providers"
    description: "List providers"
    roles: [GrantAdministrator, PrivacyOfficer, CareCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: "Provider[]"
    side_effects: []

  - method: POST
    path: "/family-planning/providers/{id}/licenses"
    description: "Add a state license to a provider"
    roles: [GrantAdministrator]
    code: 201
    input: [state_code, valid_from, valid_until]
    output: ProviderLicense
    side_effects: []

  - method: GET
    path: "/family-planning/providers/{id}/licenses"
    description: "List licenses of a provider"
    roles: [GrantAdministrator, PrivacyOfficer, CareCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?", "state_code?"]
    output: "ProviderLicense[]"
    side_effects: []

  # --- Encounter ---
  - method: POST
    path: "/family-planning/patients/{id}/encounters"
    description: "Schedule an encounter (in-person or telehealth)"
    roles: [FrontDeskStaff]
    code: 201
    input: [service_code, provider_id, channel, "patient_location_state?", scheduled_start, scheduled_end]
    output: Encounter
    side_effects:
      - "pins CURRENT HouseholdAssessment; ERR_NO_CURRENT_ASSESSMENT if none"
      - "computes patient_charge_cents"
      - "clinical_status = SCHEDULED, billing_status = UNBILLED"

  - method: GET
    path: "/family-planning/patients/{id}/encounters"
    description: "List encounters of a patient"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?", "clinical_status?", "billing_status?"]
    output: "Encounter[]"
    side_effects: []

  - method: GET
    path: "/family-planning/affiliates/{id}/encounters"
    description: "List encounters delivered by an affiliate (reverse reachability for Encounter.affiliate_id)"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?", "clinical_status?", "billing_status?"]
    output: "Encounter[]"
    side_effects: []

  - method: GET
    path: "/family-planning/providers/{id}/encounters"
    description: "List encounters delivered by a provider (reverse reachability for Encounter.provider_id)"
    roles: [GrantAdministrator, PrivacyOfficer, CareCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: "Encounter[]"
    side_effects: []

  - method: GET
    path: "/family-planning/household-assessments/{assessmentId}"
    description: "Get one household assessment"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, FrontDeskStaff]
    code: 200
    input: []
    output: HouseholdAssessment
    side_effects: []

  - method: GET
    path: "/family-planning/household-assessments/{id}/encounters"
    description: "List encounters currently pinned to an assessment (reverse reachability for Encounter.assessment_id)"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, FrontDeskStaff]
    code: 200
    input: ["limit?", "offset?"]
    output: "Encounter[]"
    side_effects: []

  - method: GET
    path: "/family-planning/encounters/{encounterId}"
    description: "Get one encounter"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: []
    output: Encounter
    side_effects: []

  - method: POST
    path: "/family-planning/encounters/{encounterId}/start"
    description: "Start an encounter (clock >= scheduled_start)"
    roles: [Clinician]
    code: 200
    input: []
    output: Encounter
    side_effects: ["clinical_status SCHEDULED -> IN_PROGRESS"]

  - method: POST
    path: "/family-planning/encounters/{encounterId}/complete"
    description: "Complete an encounter; fulfills device reservations"
    roles: [Clinician]
    code: 200
    input: []
    output: Encounter
    side_effects: ["clinical_status IN_PROGRESS -> COMPLETED", "device reservations RESERVED -> FULFILLED (lot.on_hand -= 1, lot.reserved_out -= 1)"]

  - method: POST
    path: "/family-planning/encounters/{encounterId}/cancel"
    description: "Cancel a scheduled encounter; releases reservations"
    roles: [FrontDeskStaff]
    code: 200
    input: []
    output: Encounter
    side_effects: ["clinical_status SCHEDULED -> CANCELLED", "device reservations RESERVED -> RELEASED (lot.reserved_out -= 1)"]

  - method: POST
    path: "/family-planning/encounters/{encounterId}/waive-billing"
    description: "Waive third-party billing for a confidential completed encounter"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["billing_status UNBILLED -> WAIVED"]

  # --- Claim ---
  - method: POST
    path: "/family-planning/encounters/{id}/claims"
    description: "Create a DRAFT claim for a completed unbilled encounter"
    roles: [BillingSpecialist]
    code: 201
    input: []
    output: Claim
    side_effects: ["sets confidential_suppression from patient state", "computes billed_cents", "flips encounter billing UNBILLED -> CLAIMED on submit only"]

  - method: GET
    path: "/family-planning/encounters/{id}/claims"
    description: "List claims of an encounter"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/family-planning/claims/{claimId}"
    description: "Get one claim"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/family-planning/claims/{claimId}/submit"
    description: "Submit a DRAFT claim"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status DRAFT -> SUBMITTED", "encounter billing_status UNBILLED -> CLAIMED"]

  - method: POST
    path: "/family-planning/claims/{claimId}/return"
    description: "Payer returns a submitted claim for correction"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status SUBMITTED -> RETURNED"]

  - method: POST
    path: "/family-planning/claims/{claimId}/resubmit"
    description: "Resubmit a returned claim (round < 3)"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status RETURNED -> SUBMITTED", "submission_round += 1"]

  - method: POST
    path: "/family-planning/claims/{claimId}/adjudicate"
    description: "Apply a payer payment"
    roles: [BillingSpecialist]
    code: 200
    input: [amount_cents]
    output: Claim
    side_effects: ["status SUBMITTED -> PAID", "paid_cents += amount_cents", "net_receivable_cents recomputed"]

  - method: POST
    path: "/family-planning/claims/{claimId}/deny"
    description: "Deny a submitted claim"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status SUBMITTED -> DENIED"]

  - method: POST
    path: "/family-planning/claims/{claimId}/void"
    description: "Void a DRAFT claim"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Claim
    side_effects: ["status DRAFT -> VOID"]

  - method: POST
    path: "/family-planning/claims/{claimId}/recoup"
    description: "Payer recoups funds from a PAID claim"
    roles: [BillingSpecialist]
    code: 200
    input: [amount_cents]
    output: Claim
    side_effects: ["recouped_cents += amount_cents", "net_receivable_cents recomputed"]

  - method: POST
    path: "/family-planning/claims/{claimId}/settle"
    description: "Settle encounter billing once claim is PAID (net 0) or DENIED"
    roles: [BillingSpecialist]
    code: 200
    input: []
    output: Encounter
    side_effects: ["encounter billing_status CLAIMED -> SETTLED; requires claim PAID with net_receivable_cents == 0 or DENIED (ERR_CLAIM_NOT_SETTLEABLE otherwise)"]

  # --- Stock & Reservation ---
  - method: POST
    path: "/family-planning/affiliates/{id}/stock-lots"
    description: "Receive a contraceptive stock lot"
    roles: [SupplyCoordinator]
    code: 201
    input: [device_code, lot_number, unit_cost_cents, on_hand, expires_on]
    output: ContraceptiveStockLot
    side_effects: ["reserved_out initialized to 0"]

  - method: GET
    path: "/family-planning/affiliates/{id}/stock-lots"
    description: "List stock lots"
    roles: [GrantAdministrator, SupplyCoordinator, Clinician]
    code: 200
    input: ["limit?", "offset?", "device_code?"]
    output: "ContraceptiveStockLot[]"
    side_effects: []

  - method: GET
    path: "/family-planning/stock-lots/{lotId}"
    description: "Get one stock lot"
    roles: [GrantAdministrator, SupplyCoordinator, Clinician]
    code: 200
    input: []
    output: ContraceptiveStockLot
    side_effects: []

  - method: GET
    path: "/family-planning/stock-lots/{id}/device-reservations"
    description: "List reservations against a lot (reverse reachability for DeviceReservation.lot_id)"
    roles: [GrantAdministrator, SupplyCoordinator, Clinician]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeviceReservation[]"
    side_effects: []

  - method: POST
    path: "/family-planning/encounters/{id}/device-reservations"
    description: "Reserve a device unit for an insertion encounter"
    roles: [SupplyCoordinator]
    code: 201
    input: [lot_id, "is_rapid_reinsertion?", "expulsion_recorded_at?"]
    output: DeviceReservation
    side_effects: ["lot.reserved_out += 1 (on_hand unchanged)", "validates stock/expiry/rapid window"]

  - method: GET
    path: "/family-planning/encounters/{id}/device-reservations"
    description: "List reservations of an encounter"
    roles: [GrantAdministrator, SupplyCoordinator, Clinician]
    code: 200
    input: ["limit?", "offset?"]
    output: "DeviceReservation[]"
    side_effects: []

  - method: POST
    path: "/family-planning/device-reservations/{reservationId}/release"
    description: "Manually release a reservation"
    roles: [SupplyCoordinator]
    code: 200
    input: []
    output: DeviceReservation
    side_effects: ["status RESERVED -> RELEASED", "lot.reserved_out -= 1"]

  # --- ReferralOrder ---
  - method: POST
    path: "/family-planning/encounters/{id}/referral-orders"
    description: "Create a referral for an out-of-scope need discovered during an encounter"
    roles: [Clinician, CareCoordinator]
    code: 201
    input: [requested_service_code, receiving_org, reason_code]
    output: ReferralOrder
    side_effects: []

  - method: GET
    path: "/family-planning/encounters/{id}/referral-orders"
    description: "List referrals of an encounter"
    roles: [GrantAdministrator, PrivacyOfficer, CareCoordinator, Clinician]
    code: 200
    input: ["limit?", "offset?"]
    output: "ReferralOrder[]"
    side_effects: []

  - method: POST
    path: "/family-planning/referral-orders/{referralId}/acknowledge"
    description: "Acknowledge a referral"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: ReferralOrder
    side_effects: ["status OPEN -> ACKNOWLEDGED"]

  - method: POST
    path: "/family-planning/referral-orders/{referralId}/complete"
    description: "Complete an acknowledged referral"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: ReferralOrder
    side_effects: ["status ACKNOWLEDGED -> COMPLETED"]

  - method: POST
    path: "/family-planning/referral-orders/{referralId}/withdraw"
    description: "Withdraw an open or acknowledged referral"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: ReferralOrder
    side_effects: ["status -> WITHDRAWN"]

  # --- GrantReport ---
  - method: POST
    path: "/family-planning/affiliates/{id}/grant-reports"
    description: "Generate a DRAFT grant report (initial or amendment); OCC on affiliate version"
    roles: [GrantAdministrator]
    code: 201
    input: [period_start, period_end, valuation_variant, "amendment_of?", expected_affiliate_version]
    output: GrantReport
    side_effects:
      - "computes encounter_count, low_income_encounter_count, minor_encounter_count, device_value_cents, low_income_quota_met"
      - "when amendment_of set: the amended report FINALIZED -> SUPERSEDED"
      - "increments Affiliate.version by 1"

  - method: GET
    path: "/family-planning/affiliates/{id}/grant-reports"
    description: "List grant reports of an affiliate"
    roles: [GrantAdministrator, PrivacyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "GrantReport[]"
    side_effects: []

  - method: GET
    path: "/family-planning/grant-reports/{reportId}"
    description: "Get one grant report"
    roles: [GrantAdministrator, PrivacyOfficer]
    code: 200
    input: []
    output: GrantReport
    side_effects: []

  - method: GET
    path: "/family-planning/grant-reports/{id}/amendments"
    description: "List amendment reports whose amendment_of is this report (reverse reachability for GrantReport.amendment_of)"
    roles: [GrantAdministrator, PrivacyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "GrantReport[]"
    side_effects: []

  - method: POST
    path: "/family-planning/grant-reports/{reportId}/finalize"
    description: "Finalize a DRAFT report whose period has closed"
    roles: [GrantAdministrator]
    code: 200
    input: []
    output: GrantReport
    side_effects: ["status DRAFT -> FINALIZED"]

  # --- PrivacyHold ---
  - method: POST
    path: "/family-planning/patients/{id}/privacy-holds"
    description: "Place a privacy hold (half-open interval; same-scope overlap rejected)"
    roles: [PrivacyOfficer]
    code: 201
    input: [hold_start, hold_end, scope, authorized_staff_ids]
    output: PrivacyHold
    side_effects: []

  - method: GET
    path: "/family-planning/patients/{id}/privacy-holds"
    description: "List privacy holds of a patient"
    roles: [GrantAdministrator, PrivacyOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "PrivacyHold[]"
    side_effects: []

  - method: POST
    path: "/family-planning/privacy-holds/{holdId}/release"
    description: "Release an active hold"
    roles: [PrivacyOfficer]
    code: 200
    input: []
    output: PrivacyHold
    side_effects: ["status ACTIVE -> RELEASED"]

  - method: GET
    path: "/family-planning/service-catalog/{entryId}"
    description: "Get one service catalog entry"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, SupplyCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: []
    output: ServiceCatalogEntry
    side_effects: []

  - method: GET
    path: "/family-planning/fee-tiers/{tierId}"
    description: "Get one fee schedule tier"
    roles: [GrantAdministrator, PrivacyOfficer, BillingSpecialist, CareCoordinator, SupplyCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: []
    output: FeeScheduleTier
    side_effects: []

  - method: GET
    path: "/family-planning/providers/{providerId}"
    description: "Get one provider"
    roles: [GrantAdministrator, PrivacyOfficer, CareCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/family-planning/licenses/{licenseId}"
    description: "Get one provider license"
    roles: [GrantAdministrator, PrivacyOfficer, CareCoordinator, Clinician, FrontDeskStaff]
    code: 200
    input: []
    output: ProviderLicense
    side_effects: []

  - method: GET
    path: "/family-planning/device-reservations/{reservationId}"
    description: "Get one device reservation"
    roles: [GrantAdministrator, SupplyCoordinator, Clinician]
    code: 200
    input: []
    output: DeviceReservation
    side_effects: []

  - method: GET
    path: "/family-planning/referral-orders/{referralId}"
    description: "Get one referral order"
    roles: [GrantAdministrator, PrivacyOfficer, CareCoordinator, Clinician]
    code: 200
    input: []
    output: ReferralOrder
    side_effects: []

  - method: GET
    path: "/family-planning/privacy-holds/{holdId}"
    description: "Get one privacy hold"
    roles: [GrantAdministrator, PrivacyOfficer]
    code: 200
    input: []
    output: PrivacyHold
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or invalid"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role not permitted for this operation"
  - id: ERR_AFFILIATE_NOT_FOUND
    http: 404
    condition: "Affiliate id does not exist"
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "Patient id does not exist"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "Provider id does not exist"
  - id: ERR_ENCOUNTER_NOT_FOUND
    http: 404
    condition: "Encounter id does not exist"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "Claim id does not exist"
  - id: ERR_LOT_NOT_FOUND
    http: 404
    condition: "Stock lot id does not exist"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "Device reservation id does not exist"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "Referral order id does not exist"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "Grant report id does not exist"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "Privacy hold id does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, wrong type, or enum violation"
  - id: ERR_AFFILIATE_NOT_ACTIVE
    http: 409
    condition: "Child creation requires parent Affiliate ACTIVE"
  - id: ERR_AFFILIATE_HAS_OPEN_ENCOUNTERS
    http: 409
    condition: "Affiliate close blocked by encounters in SCHEDULED or IN_PROGRESS"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits the requested transition"
  - id: ERR_INVALID_INTERVAL
    http: 400
    condition: "scheduled_end <= scheduled_start, hold_end <= hold_start, or period_end <= period_start; or grant cycle closed at creation"
  - id: ERR_NO_CURRENT_ASSESSMENT
    http: 422
    condition: "Encounter creation requires a CURRENT HouseholdAssessment for the patient"
  - id: ERR_NO_ELIGIBLE_TIER
    http: 422
    condition: "No FeeScheduleTier band matches fpl_pct under the income_basis variant filter"
  - id: ERR_SERVICE_OUT_OF_SCOPE
    http: 422
    condition: "service_code missing, not in_scope, or catalog entry SUSPENDED for this affiliate"
  - id: ERR_TELEHEALTH_LICENSE_GAP
    http: 422
    condition: "No ACTIVE ProviderLicense contains the whole encounter interval for patient_location_state"
  - id: ERR_CONFIDENTIAL_SERVICE_CANNOT_BILL
    http: 422
    condition: "Submit attempted on a claim with confidential_suppression == true (minor-consent or confidentiality-flagged patient) — such claims may never reach a payer"
  - id: ERR_CLAIM_RESUBMISSION_EXHAUSTED
    http: 409
    condition: "Resubmit attempted at submission_round == 3"
  - id: ERR_CLAIM_NOT_SETTLEABLE
    http: 409
    condition: "Settle requires claim PAID with net_receivable_cents == 0, or DENIED"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment amount exceeds net_receivable_cents"
  - id: ERR_RECOUPMENT_EXCEEDS_PAID
    http: 422
    condition: "Recoupment amount exceeds paid_cents - recouped_cents"
  - id: ERR_STOCK_UNAVAILABLE
    http: 422
    condition: "Lot has on_hand - reserved_out < 1"
  - id: ERR_LOT_EXPIRED
    http: 422
    condition: "Lot expires before the encounter date (grace only for eligible rapid reinsertion)"
  - id: ERR_REINSERTION_WINDOW_EXCEEDED
    http: 422
    condition: "Rapid reinsertion scheduled more than 30 days after expulsion_recorded_at"
  - id: ERR_PRIVACY_HOLD_BLOCKS_ACCESS
    http: 403
    condition: "Caller not authorized through an ACTIVE privacy hold covering now"
  - id: ERR_PRIVACY_HOLD_OVERLAP
    http: 409
    condition: "Same-patient, same-scope ACTIVE hold overlaps the requested half-open interval"
  - id: ERR_REPORT_PERIOD_OPEN
    http: 409
    condition: "Finalize attempted before period_end (logical clock)"
  - id: ERR_REPORT_PERIOD_OVERLAP
    http: 409
    condition: "Another DRAFT report on this affiliate overlaps the requested half-open period"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent's current version (OCC)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: GrantAdministrator
    description: "Federal grant program administrator; owns affiliate configuration, fee tiers, catalog, providers, stock oversight, grant reporting, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /family-planning/_clock/set_current_utc"
      - "POST /family-planning/affiliates and affiliate lifecycle actions (suspend/reinstate/close)"
      - "POST service-catalog, fee-tiers, providers, licenses"
      - "POST grant-reports and finalize"
    shared_operations:
      - "GET on all resources"

  - name: FrontDeskStaff
    description: "Clinic front desk; registers patients, records household assessments, schedules and cancels encounters"
    identity: opaque
    exclusive_operations:
      - "POST patients"
      - "POST household-assessments"
      - "POST encounters"
      - "POST encounters/{id}/cancel"
    shared_operations:
      - "GET patients, encounters, catalog, tiers"

  - name: Clinician
    description: "Delivering clinician; starts/completes encounters and originates referrals"
    identity: opaque
    exclusive_operations:
      - "POST encounters/{id}/start"
      - "POST encounters/{id}/complete"
    shared_operations:
      - "POST referral-orders (with CareCoordinator)"
      - "GET patients, encounters, stock-lots"

  - name: BillingSpecialist
    description: "Third-party billing; owns claims end-to-end and billing waivers"
    identity: opaque
    exclusive_operations:
      - "POST claims and all claim actions (submit/return/resubmit/adjudicate/deny/void/recoup/settle)"
      - "POST encounters/{id}/waive-billing"
    shared_operations:
      - "GET patients, encounters, claims"

  - name: CareCoordinator
    description: "Referral pathway owner"
    identity: opaque
    exclusive_operations:
      - "POST referral-orders/{id}/acknowledge, complete, withdraw"
    shared_operations:
      - "POST referral-orders (with Clinician)"
      - "GET encounters, referral-orders"

  - name: SupplyCoordinator
    description: "Contraceptive inventory owner; receives lots and manages device reservations"
    identity: opaque
    exclusive_operations:
      - "POST stock-lots"
      - "POST device-reservations and release"
    shared_operations:
      - "GET stock-lots, device-reservations"

  - name: PrivacyOfficer
    description: "Security and privacy operations; owns privacy holds and hold-gated oversight reads"
    identity: opaque
    exclusive_operations:
      - "POST privacy-holds and release"
    shared_operations:
      - "GET on all resources (subject to hold authorization like everyone else)"
