          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Redesignation is legal while applied_cents is 0 and bumps redesignation_count to 1; once a medical draw has consumed part of the gift the same call returns ERR_INVALID_STATE with HTTP 409 and redesignation_count stays at 1."
        test_recipe:
