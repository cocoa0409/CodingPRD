# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Grain Merchandising & Basis Trading — 23 instances across the nine §0.5 rules.
# Every literal in an `assert:` line was computed by executing the matching
# §1.3 `formula:` against its `constants:` before being written here.
# Logical clock startup default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: delivery_settlement_shrink_first_vs_gross_grade
        grounds:
          - calculations.delivery_net_bushels
          - calculations.quality_discount_total
          - calculations.ticket_settlement_value
          - entities.PurchaseContract.fields.settlement_basis
          - entities.DeliveryTicket.fields.net_bushels
        distinguishing_aspect: |
          This dual variant lives on the DeliveryTicket / grain-quality domain: two contracts
          differing only in settlement_basis, graded from byte-identical scale and probe
          readings, yield net_bushels 9858.40 vs 10000.00 and discount_total_usd 1774.51 vs
          2550.00 because SHRINK_FIRST removes moisture as bushels while GROSS_GRADE removes
          it as a cents-per-bushel drying charge.
        test_recipe:
          setup:
            - "One desk with a 5,000,000 USD credit line and one rail-served elevator with 5,000,000 bushels of intake capacity."
            - "One ACTIVE CORN discount schedule carrying all four factor tiers."
            - "One SHORT CORN 2026-12 hedge position with 20 open lots at 448 cents."
            - "One ACTIVE CORN bid at that elevator: basis -32, delivery period 2026-10-01 to 2026-12-31."
            - "Two 50,000-bushel CASH contracts on that bid, identical except that one is SHRINK_FIRST and the other GROSS_GRADE; both are FULLY_PRICED at futures 448 + basis -32 = 416 cents."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD1", name: "Illinois River Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/discount-schedules"
              payload: { commodity_code: "CORN", effective_from: "2026-07-01T00:00:00Z", moisture_standard_pct: 15.0, shrink_factor_pct_per_point: 1.18, tiers: [ { factor: "MOISTURE", direction: "ABOVE", threshold_value: 15.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 2.5 }, { factor: "TEST_WEIGHT", direction: "BELOW", threshold_value: 54.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 3.5 }, { factor: "FOREIGN_MATERIAL", direction: "ABOVE", threshold_value: 3.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 1.5 }, { factor: "DAMAGE", direction: "ABOVE", threshold_value: 5.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 4.0 } ] }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { sch1_id: $.data.id }
            - call: "POST /grain/discount-schedules/${sch1_id}/activate"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 20, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 50000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448, settlement_basis: "SHRINK_FIRST" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c_sf_id: $.data.id }
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 50000, seller_name: "Halberd Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448, settlement_basis: "GROSS_GRADE" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c_gg_id: $.data.id }
          trigger:
            - call: "POST /grain/delivery-tickets"
              payload: { contract_id: "${c_sf_id}", location_id: "${loc1_id}", gross_bushels: 10000, moisture_pct: 16.2, test_weight_lbs: 52.4, foreign_material_pct: 3.7, damage_pct: 6.5 }
              as: GrainInspector
              as_user_id: "u-insp-1"
              captures: { tkt_sf_id: $.data.id }
            - call: "POST /grain/delivery-tickets"
              payload: { contract_id: "${c_gg_id}", location_id: "${loc1_id}", gross_bushels: 10000, moisture_pct: 16.2, test_weight_lbs: 52.4, foreign_material_pct: 3.7, damage_pct: 6.5 }
              as: GrainInspector
              as_user_id: "u-insp-1"
              captures: { tkt_gg_id: $.data.id }
          assert:
            - "DeliveryTicket.${tkt_sf_id}.shrink_pct == 1.416"
            - "DeliveryTicket.${tkt_sf_id}.net_bushels == 9858.40"
            - "DeliveryTicket.${tkt_sf_id}.discount_total_usd == 1774.51"
            - "DeliveryTicket.${tkt_sf_id}.gross_contract_value_usd == 41010.94"
            - "DeliveryTicket.${tkt_sf_id}.service_fee_cents_per_bushel == 3.0"
            - "DeliveryTicket.${tkt_sf_id}.settlement_value_usd == 38940.68"
            - "DeliveryTicket.${tkt_gg_id}.shrink_pct == 0"
            - "DeliveryTicket.${tkt_gg_id}.net_bushels == 10000.00"
            - "DeliveryTicket.${tkt_gg_id}.discount_total_usd == 2550.00"
            - "DeliveryTicket.${tkt_gg_id}.gross_contract_value_usd == 41600.00"
            - "DeliveryTicket.${tkt_gg_id}.settlement_value_usd == 38750.00"
            - "DeliveryTicket.${tkt_sf_id}.net_bushels != DeliveryTicket.${tkt_gg_id}.net_bushels"

      - name: cancellation_damages_market_loss_vs_replacement_cost
        grounds:
          - calculations.cancellation_damages
          - state_machines.PurchaseContract.ACTIVE_to_CANCELLED
          - entities.PurchaseContract.fields.damages_usd
          - entities.HedgePosition.fields.last_settlement_price_cents
        distinguishing_aspect: |
          This dual variant lives on the PurchaseContract / market-damages domain, a different
          entity domain from the DeliveryTicket grading variant: two byte-identical 50,000-bushel
          contracts cancelled against the same 470-cent futures mark settle at 11000.00 under
          MARKET_LOSS (local bid basis -32) and 22250.00 under REPLACEMENT_COST (dearest desk-wide
          bid basis -10 plus the 250.00 admin fee).
        test_recipe:
          setup:
            - "One desk with two elevators; each elevator carries its own ACTIVE CORN bid for the same 2026-10-01..2026-12-31 period — basis -32 at elevator 1, basis -10 at elevator 2."
            - "One SHORT CORN 2026-12 hedge position with 20 lots at 448 cents, marked to 470 cents so last_settlement_price_cents is 470."
            - "Two identical FULLY_PRICED 50,000-bushel CASH contracts at elevator 1, gross unit price 416 cents, zero bushels delivered."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD2", name: "Corn Belt Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV2", name: "Seneca Elevator", intake_capacity_bushels: 5000000, rail_served: false }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc2_id: $.data.id }
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 20, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/bids"
              payload: { location_id: "${loc2_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -10, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid2_id: $.data.id }
            - call: "POST /grain/bids/${bid2_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 50000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c_ml_id: $.data.id }
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 50000, seller_name: "Halberd Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c_rc_id: $.data.id }
            - call: "POST /grain/hedge-positions/${hp1_id}/mark-to-market"
              payload: { settlement_price_cents: 470 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
          trigger:
            - call: "POST /grain/purchase-contracts/${c_ml_id}/cancel"
              payload: { damages_method: "MARKET_LOSS", cancellation_reason: "producer buyout" }
              as: RiskOfficer
              as_user_id: "u-risk-1"
            - call: "POST /grain/purchase-contracts/${c_rc_id}/cancel"
              payload: { damages_method: "REPLACEMENT_COST", cancellation_reason: "producer buyout" }
              as: RiskOfficer
              as_user_id: "u-risk-1"
          assert:
            - "PurchaseContract.${c_ml_id}.status == CANCELLED"
            - "PurchaseContract.${c_ml_id}.damages_usd == 11000.00"
            - "PurchaseContract.${c_rc_id}.status == CANCELLED"
            - "PurchaseContract.${c_rc_id}.damages_usd == 22250.00"
            - "PurchaseContract.${c_ml_id}.damages_usd != PurchaseContract.${c_rc_id}.damages_usd"
            - "HedgePosition.${hp1_id}.lots_committed == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: quality_discount_per_factor_rounding_order
        grounds:
          - calculations.quality_discount_total
          - entities.DiscountSchedule.fields.tiers
          - entities.DeliveryTicket.fields.discount_total_usd
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents. On 4000.24 net bushels
          the TEST_WEIGHT leg extends to 280.0168 and the FOREIGN_MATERIAL leg to 120.0072;
          rounding each to cents first and then summing gives 400.03, while summing the 10.0
          cent-per-bushel rate first and rounding once gives 400.02. The scaffold pins
          round-per-factor-then-sum, so the correct answer is 400.03.
        test_recipe:
          setup:
            - "Same desk, elevator, ACTIVE CORN discount schedule, 20-lot SHORT hedge and ACTIVE basis -32 bid as the shrink-variant instance."
            - "One 50,000-bushel SHRINK_FIRST CASH contract at futures 448 (gross unit price 416 cents)."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD3", name: "Rounding Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/discount-schedules"
              payload: { commodity_code: "CORN", effective_from: "2026-07-01T00:00:00Z", moisture_standard_pct: 15.0, shrink_factor_pct_per_point: 1.18, tiers: [ { factor: "MOISTURE", direction: "ABOVE", threshold_value: 15.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 2.5 }, { factor: "TEST_WEIGHT", direction: "BELOW", threshold_value: 54.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 3.5 }, { factor: "FOREIGN_MATERIAL", direction: "ABOVE", threshold_value: 3.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 1.5 }, { factor: "DAMAGE", direction: "ABOVE", threshold_value: 5.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 4.0 } ] }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { sch1_id: $.data.id }
            - call: "POST /grain/discount-schedules/${sch1_id}/activate"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 20, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 50000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448, settlement_basis: "SHRINK_FIRST" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /grain/delivery-tickets"
              payload: { contract_id: "${c1_id}", location_id: "${loc1_id}", gross_bushels: 4000.24, moisture_pct: 15.0, test_weight_lbs: 52.4, foreign_material_pct: 3.7, damage_pct: 5.0 }
              as: GrainInspector
              as_user_id: "u-insp-1"
              captures: { tkt_id: $.data.id }
          assert:
            - "DeliveryTicket.${tkt_id}.net_bushels == 4000.24"
            - "DeliveryTicket.${tkt_id}.discount_total_usd == 400.03"
            - "DeliveryTicket.${tkt_id}.discount_total_usd != 400.02"
            - "DeliveryTicket.${tkt_id}.gross_contract_value_usd == 16641.00"
            - "DeliveryTicket.${tkt_id}.settlement_value_usd == 16120.96"

      - name: service_fee_tier_keyed_on_pre_fee_gross_value
        grounds:
          - calculations.ticket_settlement_value
          - entities.DeliveryTicket.fields.service_fee_cents_per_bushel
          - entities.DeliveryTicket.fields.net_unit_price_cents
        distinguishing_aspect: |
          Mode (c) — a circular-looking dependency with a pinned evaluation order, structurally
          different from the mode (b) rounding-order instance. The fee tier is keyed on the
          pre-fee gross value 50040.00, which sits in the 2.0-cent tier; the post-fee value
          49800.00 falls back into the 3.0-cent tier, so an implementation that re-derives the
          tier from the post-fee value oscillates. The pinned order fixes the fee at 2.0 cents.
        test_recipe:
          setup:
            - "Same bootstrap desk, elevator, ACTIVE CORN discount schedule, 20-lot SHORT hedge and ACTIVE basis -32 bid."
            - "One 50,000-bushel SHRINK_FIRST CASH contract at futures 449, so gross unit price is 417 cents."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD4", name: "Fee Tier Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/discount-schedules"
              payload: { commodity_code: "CORN", effective_from: "2026-07-01T00:00:00Z", moisture_standard_pct: 15.0, shrink_factor_pct_per_point: 1.18, tiers: [ { factor: "MOISTURE", direction: "ABOVE", threshold_value: 15.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 2.5 }, { factor: "TEST_WEIGHT", direction: "BELOW", threshold_value: 54.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 3.5 }, { factor: "FOREIGN_MATERIAL", direction: "ABOVE", threshold_value: 3.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 1.5 }, { factor: "DAMAGE", direction: "ABOVE", threshold_value: 5.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 4.0 } ] }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { sch1_id: $.data.id }
            - call: "POST /grain/discount-schedules/${sch1_id}/activate"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 20, avg_entry_price_cents: 449 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 50000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 449, settlement_basis: "SHRINK_FIRST" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /grain/delivery-tickets"
              payload: { contract_id: "${c1_id}", location_id: "${loc1_id}", gross_bushels: 12000, moisture_pct: 15.0, test_weight_lbs: 56.0, foreign_material_pct: 2.0, damage_pct: 0.0 }
              as: GrainInspector
              as_user_id: "u-insp-1"
              captures: { tkt_id: $.data.id }
          assert:
            - "DeliveryTicket.${tkt_id}.net_bushels == 12000.00"
            - "DeliveryTicket.${tkt_id}.discount_total_usd == 0.00"
            - "DeliveryTicket.${tkt_id}.gross_contract_value_usd == 50040.00"
            - "DeliveryTicket.${tkt_id}.service_fee_cents_per_bushel == 2.0"
            - "DeliveryTicket.${tkt_id}.net_unit_price_cents == 415"
            - "DeliveryTicket.${tkt_id}.settlement_value_usd == 49800.00"

      - name: margin_call_amount_three_input_nonlinear
        grounds:
          - calculations.mark_to_market_equity
          - calculations.margin_call_amount
          - state_machines.HedgePosition.OPEN_to_MARGIN_CALL
          - entities.MarginCall.fields.call_amount_usd
        distinguishing_aspect: |
          Mode (a) — a formula with four interacting inputs (lots_open, avg_entry_price_cents,
          settlement_price_cents, posted_margin_usd), a per-commodity tiered margin rate and a
          sign branch on side, nested inside max(0, ...). It is neither a rounding-order case
          nor a circular-dependency case, so it exercises a third combinatorial axis: a SHORT
          4-lot CORN position entered at 448 and marked to 500 gives unrealized -10400.00,
          equity -3800.00 below the 6000.00 maintenance floor, and a call of 10400.00.
        test_recipe:
          setup:
            - "One desk with a 16,000 USD credit line."
            - "One SHORT CORN 2026-12 hedge position, 4 lots at 448 cents, posted margin 6600.00."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD5", name: "Thin Credit Desk", credit_line_usd: 16000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/hedge-positions"
