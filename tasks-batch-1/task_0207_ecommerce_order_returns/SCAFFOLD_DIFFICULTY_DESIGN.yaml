            - call: "POST /orders/${ord_id}/checkout"
              payload: { expected_order_version: "${ord_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders/${ord_id}/capture-payment"
              payload: {}
              as: StoreAdmin
              captures: { captured: $.data.captured_total_cents }
            - call: "GET /order-lines/${ol_id}/reservations"
              payload: {}
              as: StoreAdmin
              captures: { res_id: "$.data[0].id" }
            - call: "POST /orders/${ord_id}/shipments"
              payload: { warehouse_id: "${wh_id}", lines: [{ reservation_id: "${res_id}", qty: 1 }] }
              as: WarehouseOperator
              captures: { ship_id: $.data.id }
            - call: "POST /shipments/${ship_id}/ship"
              payload: {}
              as: WarehouseOperator
            - call: "POST /shipments/${ship_id}/deliver"
              payload: {}
              as: WarehouseOperator
            - call: "POST /orders/${ord_id}/returns"
              payload: { reason: "DEFECTIVE", resolution: "REFUND", lines: [{ order_line_id: "${ol_id}", return_qty: 1 }] }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { rma_id: $.data.id }
            - call: "GET /returns/${rma_id}"
              payload: {}
              as: StoreAdmin
              captures: { rma_v: $.data.version }
            - call: "POST /returns/${rma_id}/approve"
              payload: { expected_return_version: "${rma_v}" }
              as: StoreAdmin
          trigger:
            - call: "POST /returns/${rma_id}/settle"
              payload: {}
              as: StoreAdmin
            - call: "GET /orders/${ord_id}"
              payload: {}
              as: StoreAdmin
              captures: { pay_status: $.data.payment_status }
            - call: "GET /returns/${rma_id}/refunds"
              payload: {}
              as: StoreAdmin
              captures: { refund_amt: "$.data[0].amount_cents" }
          assert:
            - "Order.${ord_id}.captured_total_cents == 10000"
            - "Refund.amount_cents == 10000 (DEFECTIVE waives restock; tax 0; shipping not part of refund but was 0)"
            - "Order.${ord_id}.payment_status == REFUNDED  # cumulative ORIGINAL_PAYMENT refund == captured_total → net 0"
