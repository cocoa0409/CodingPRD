              as: CreativeDirector
              as_user_id: "u-cd-1"
              captures: { sc2: $.data.id }
            - call: "POST /ride-systems"
              payload: { project_id: "${proj}", vendor_name: "Vekoma Rides", system_type: "DARK_RIDE_TRACKLESS", vehicle_count: 12, riders_per_vehicle: 8, block_zone_count: 14, cycle_time_seconds: 240, availability_pct: 96, load_efficiency_pct: 90, show_stops_per_hour: 1.5 }
              as: RideEngineer
              as_user_id: "u-eng-1"
              captures: { rs: $.data.id }
            - call: "POST /attraction-projects/${proj}/advance-phase"
              payload: { to_phase: "CONCEPT", expected_project_version: "${pv0}" }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { pv1: $.data.version }
            - call: "POST /ride-systems/${rs}/select"
