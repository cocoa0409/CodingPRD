            - "after the first sweep SearchRequest.${sr_id}.status == PRIMARY_ENGAGED (unchanged) and last_sweep_at == \"2026-08-08T00:00:01Z\""
            - "the second typing request re-entered the cycle: MatchCandidate.${mc1_id}.status == TYPING_REQUESTED, ct_attempt_count == 2, ConfirmatoryTypingRequest.${ct2_id}.attempt_number == 2 and deadline_at == \"2026-08-15T00:00:01Z\""
            - "after the trigger sweep ConfirmatoryTypingRequest.${ct2_id}.status == EXPIRED and MatchCandidate.${mc1_id}.status == EXCLUDED (not TYPING_EXPIRED) because ct_attempt_count == MAX_CT_ATTEMPTS"
            - "the promotion cascade ran: MatchCandidate.${mc3_id}.candidate_role == PRIMARY with promoted_from_rank == 2, and MatchCandidate.${mc1_id}.candidate_role == ARCHIVED_POOL"
            - "SearchRequest.${sr_id}.status == BACKUP_REQUIRED and backup_candidate_count == 0"
            - "MatchCandidate.${mc1_id}.confirmed_score is null throughout - no response was ever filed"

  - rule_id: transitive_cascade
    instances:
      - name: idm_panel_failure_cascades_five_levels_to_backup_promotion
        grounds:
          - state_machines.WorkupCase.clearance_status.IN_PROGRESS_to_FAILED
          - state_machines.WorkupCase.case_status.OPEN_to_ABORTED
          - state_machines.ReimbursementClaim.PROVISIONAL_to_VOID
          - state_machines.MatchCandidate.WORKUP_OPEN_to_DEFERRED
          - state_machines.DonorProfile.AVAILABLE_to_TEMPORARILY_DEFERRED
          - state_machines.SearchRequest.WORKUP_ACTIVE_to_BACKUP_REQUIRED
          - calculations.donor_calendar_conflict_detection
        distinguishing_aspect: |
          Depth-5 chain from a single clearance result, where every link is caused by the link above it
          and not by the original call: (1) the IDM_PANEL item's FAIL drives clearance_status to FAILED;
          (2) because clearance FAILED the case_status becomes ABORTED; (3) because the case aborted its
          PROVISIONAL claim becomes VOID and Patient.committed_cost_cents is re-derived; (4) because the
          case aborted the candidate leaves WORKUP_OPEN for DEFERRED and its donor is temporarily
          deferred with a 90-day DEFERRAL calendar window; (5) because the PRIMARY candidate was
          deferred the promotion cascade lifts the rank-2 BACKUP to PRIMARY and the search becomes
          BACKUP_REQUIRED. The trigger is a clearance result - a different trigger from the
          conditioning-abort cascade below.
        test_recipe:
          setup:
            - "domestic registry with donors D1 (rank 1) and D3 (rank 2), one patient, a DOMESTIC_ONLY search"
            - "D1 taken through confirmatory typing, screening PASS and workup open, so a PROVISIONAL claim of 2072000 cents exists"
            - "clock moved to 2026-09-11T08:00:00Z and the PHYSICAL_EXAM item already resulted PASS"
          setup_api_calls:
            - call: "POST /registry/registries"
              payload: { code: "NMDP-US", name: "National Marrow Donor Program", country_code: "US", currency_code: "USD", fx_rate_to_usd: 1.0000, is_domestic: true, cooperation_tier: 1, ct_response_deadline_hours: 168 }
              as: RegistryOperations
              as_user_id: "ops-1"
              captures: { reg_dom_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0001", age_years: 27, sex: "F", weight_kg: 68.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07", "07"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "05:01"] }, consented_methods: ["PBSC", "MARROW"], ambiguous_loci: ["C"], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d1_id: "$.data.id" }
            - call: "POST /registry/donors"
              payload: { registry_id: "${reg_dom_id}", donor_code: "D-0003", age_years: 55, sex: "M", weight_kg: 91.0, cmv_status: "POSITIVE", hla_typing_registry: { A: ["01:01", "02:01"], B: ["07:02", "15:01"], C: ["07:02", "03:04"], DRB1: ["15:01", "11:01"], DQB1: ["06:02", "02:01"] }, consented_methods: ["PBSC"], ambiguous_loci: [], prior_donation_count: 0 }
              as: DonorRegistryLiaison
              as_user_id: "${reg_dom_id}"
              captures: { d3_id: "$.data.id" }
            - call: "POST /registry/patients"
              payload: { mrn: "MRN-0001", transplant_center_code: "TC-01", country_code: "US", diagnosis_code: "AML", urgency_tier: "HIGH", weight_kg: 70.0, cmv_status: "POSITIVE", hla_typing: { A: ["01:01", "02:01"], B: ["07:02", "08:01"], C: ["07:02", "07:04"], DRB1: ["15:01", "03:01"], DQB1: ["06:02", "02:01"] }, case_budget_cents: 5000000 }
