      - name: emergency_access_five_input_constraint_propagation
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: emergency_access_grade_five_input_boundary_interaction
          rationale: "That §1.8 combinatorial-formula instance already drives all five inputs of calculations.emergency_access_grade_evaluation at their boundaries (width 20.0, grade 12.0, ceil-derived required_turnouts, turnaround flag, conditional bridge clause) and checks that the change propagates to emergency_access_grade and onward to the award and effectuate gates."

      - name: allocation_waterfall_floor_and_cap_interaction
        claim_type: waterfall_allocation
        excluded_because:
          difficulty_instance: minimum_charge_floor_and_cap_together_yield_negative_unallocated_residual
          rationale: "That §1.8 boundary-precision instance already fills the floor bucket first, applies the cap, runs the single redistribution pass and asserts the negative unallocated_residual_cents that over-collection produces, which is the whole waterfall claim set for calculations.annual_assessment_allocation."

      - name: connection_fee_component_rounding_tiers
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: connection_fee_round_per_component_versus_sum_then_round
          rationale: "That §1.8 combinatorial-formula instance already tests each of the four fee components at its rounding boundary and proves that rounding per component differs from rounding the summed exact value, which is the tier-boundary claim for calculations.connection_fee."

      - name: annual_roll_variant_divergence
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: annual_roll_method_variant_divergence_frontage_vs_trip
          rationale: "That §1.8 dual-variant instance already certifies the same parcel set under FRONTAGE_WEIGHTED and TRIP_GENERATION_WEIGHTED and asserts the per-parcel delta and the differing unallocated_residual_cents for calculations.annual_assessment_allocation."

      - name: voting_basis_variant_selection
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: proposal_voting_basis_per_parcel_adopts_assessed_share_rejects
          rationale: "That §1.8 dual-variant instance already shows calculations.member_voting_weight selecting its variant from the proposal's voting_basis (falling back to the association default) and proves the same ballots adopt under PER_PARCEL and fail under ASSESSED_SHARE."

  - section: validations
    instances:

      - name: fiscal_year_duplication_outranks_interval_overlap_while_touching_intervals_pass
        claim_type: temporal_validation
        grounds:
          - validations[priority=42]
          - validations[priority=43]
          - entities.AssessmentRoll.fields.fy_start_date
        distinguishing_aspect: "Consecutive intervals that touch end-to-start (2026-12-31 then 2027-01-01) are accepted, a one-day overlap is rejected with ERR_FISCAL_INTERVAL_OVERLAP, and a submission that both duplicates fiscal_year 2026 and overlaps FY2027 reports ERR_FISCAL_YEAR_ROLL_EXISTS because priority 42 precedes priority 43."
        test_recipe:
          setup:
            - "One Association with a DRAFT FY2026 roll spanning 2026-01-01..2026-12-31 (no parcels are needed: creation does no allocation)."
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Calendar Hill Road Association", reserve_target_cents: 1000000 }
              as: AssociationSecretary
              as_user_id: "sec-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2026, fy_start_date: "2026-01-01", fy_end_date: "2026-12-31", budget_requirement_cents: 4000000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              as_user_id: "clerk-1"
              captures: { roll26: $.data.id }
          trigger:
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2027, fy_start_date: "2027-01-01", fy_end_date: "2027-12-31", budget_requirement_cents: 4100000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              as_user_id: "clerk-1"
              captures: { roll27: $.data.id }
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2028, fy_start_date: "2027-12-31", fy_end_date: "2028-12-31", budget_requirement_cents: 4200000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              as_user_id: "clerk-1"
              captures: { err_overlap: $.data.error_id }
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2026, fy_start_date: "2027-06-01", fy_end_date: "2028-05-31", budget_requirement_cents: 4300000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              as_user_id: "clerk-1"
              captures: { err_dup: $.data.error_id }
            - call: "POST /assessment-rolls"
              payload: { association_id: "${assoc_id}", fiscal_year: 2029, fy_start_date: "2029-12-31", fy_end_date: "2029-01-01", budget_requirement_cents: 4400000, method_variant: "FRONTAGE_WEIGHTED" }
              as: AssessmentClerk
              as_user_id: "clerk-1"
              captures: { err_inverted: $.data.error_id }
          assert:
            - "the FY2027 roll is created with HTTP 201 and status DRAFT: 2026-12-31 to 2027-01-01 merely touches, which validations[priority=43] permits"
            - "the FY2028 attempt starting 2027-12-31 returns HTTP 409 with error_id ERR_FISCAL_INTERVAL_OVERLAP, because that single day is already inside FY2027"
            - "the second FY2026 attempt returns HTTP 409 with error_id ERR_FISCAL_YEAR_ROLL_EXISTS, not ERR_FISCAL_INTERVAL_OVERLAP, even though 2027-06-01..2028-05-31 overlaps FY2027"
            - "the FY2029 attempt with fy_start_date after fy_end_date returns HTTP 409 with error_id ERR_FISCAL_INTERVAL_OVERLAP, the same rule that carries the fy_start_date < fy_end_date clause"
            - "GET /assessment-rolls?association_id=... returns total_count 2, so none of the three rejected submissions persisted a row"

      - name: verify_deed_requires_matching_member_and_parcel_pages
        claim_type: violation_to_error
        grounds:
          - validations[priority=30]
          - validations[priority=16]
          - state_machines.Member.PENDING_DEED_VERIFICATION_to_GOOD_STANDING
        distinguishing_aspect: "verify-deed is a three-way equality: a page matching neither record fails, a page matching the Member row but not the parcel's recorded page also fails, and only the page matching both verifies - after which a repeat call reports ERR_MEMBER_ALREADY_VERIFIED rather than ERR_DEED_MISMATCH."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one segment with parcel A (deed DB150-P01) carrying member MA asserting DB150-P01, and parcel B (deed DB150-P02) carrying member MB asserting DB150-P02X."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
