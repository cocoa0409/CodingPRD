              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exBig_id}/impact-decisions"
              payload: { action: "APPROVE" }
              as: RiskApprover
              as_user_id: "${ra3_id}"
            - call: "POST /exercises"
              payload: { name: "One unit too many", exercise_type: "COMPONENT_FAILOVER", recovery_site_id: "${ss_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-08-21T00:00:00Z", planned_end_at: "2026-08-21T04:00:00Z" }
              as: ResilienceCoordinator
