              as: SchoolSafetyOfficer
          trigger:
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { rep_id: $.data.id }
          assert:
            - "ComplianceReport.${rep_id}.type_attainments[FIRE].completed_count == 3"
            - "ComplianceReport.${rep_id}.type_attainments[EVACUATION].completed_count == 1"
            - "ComplianceReport.${rep_id}.type_attainments[EARTHQUAKE].completed_count == 3"
            - "ComplianceReport.${rep_id}.overall_score_pct == 44.1"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: eop_return_resubmit_cycle
        grounds:
          - state_machines.EmergencyOperationsPlan.SUBMITTED_to_RETURNED
          - state_machines.EmergencyOperationsPlan.RETURNED_to_SUBMITTED
        distinguishing_aspect: |
          EmergencyOperationsPlan supports a revision loop
          DRAFT -> SUBMITTED -> RETURNED -> SUBMITTED -> APPROVED -> ACTIVE;
          a RETURNED plan can be resubmitted (cycle), and resubmission clears
          the prior return_reason.
        test_recipe:
          setup:
            - "Site with CURRENT site plan and a COMPLETED walkthrough inside the window; one EOP drafted"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Draft procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
          trigger:
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: RETURN, return_reason: "Missing reunification section" }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
          assert:
            - "EmergencyOperationsPlan.${eop_id}.status == ACTIVE after the RETURNED -> SUBMITTED -> APPROVED -> ACTIVE loop"
            - "EmergencyOperationsPlan.${eop_id}.return_reason is null/empty after successful resubmission"
            - "EmergencyOperationsPlan.${eop_id}.activated_at is set"

      - name: corrective_action_reopen_cycle
        grounds:
          - state_machines.CorrectiveAction.PENDING_VERIFICATION_to_REOPENED
          - state_machines.CorrectiveAction.REOPENED_to_PENDING_VERIFICATION
        distinguishing_aspect: |
          CorrectiveAction supports a rework loop
          OPEN -> PENDING_VERIFICATION -> REOPENED -> PENDING_VERIFICATION ->
          VERIFIED on a different entity than the EOP cycle; the REOPENED state
          is reachable only via a verify(REOPEN) decision.
        test_recipe:
          setup:
            - "Site with ACTIVE EOP; one FIRE drill completed; AAR submitted by officer-1 and ACCEPTED by principal-1; one corrective action OPEN"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harborview Middle", enrollment_count: 700, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:04:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/complete"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events/${drill_id}/after-action-reviews"
              payload: { findings_summary: "Evacuation orderly; gate signage unclear", overall_rating: MEETS, evacuation_assessment: MET_STANDARD }
              as: SchoolSafetyOfficer
              captures: { aar_id: $.data.id }
            - call: "POST /after-action-reviews/${aar_id}/submit"
              as: SchoolSafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /after-action-reviews/${aar_id}/decide"
              payload: { decision: ACCEPT }
              as: Principal
              as_user_id: "principal-1"
            - call: "POST /after-action-reviews/${aar_id}/corrective-actions"
              payload: { description: "Replace gate signage", priority: HIGH, due_date: "2026-10-15", assignee_name: "Facilities Lead" }
              as: SchoolSafetyOfficer
              captures: { ca_id: $.data.id }
            - call: "POST /corrective-actions/${ca_id}/submit-verification"
              payload: { evidence_note: "Signage ordered and installed" }
              as: SchoolSafetyOfficer
          trigger:
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: { decision: REOPEN, note: "Photo evidence missing" }
              as: DistrictSafetyCoordinator
            - call: "POST /corrective-actions/${ca_id}/submit-verification"
              payload: { evidence_note: "Photo evidence attached" }
              as: SchoolSafetyOfficer
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: { decision: VERIFY }
              as: DistrictSafetyCoordinator
          assert:
            - "CorrectiveAction.${ca_id}.status == VERIFIED after the REOPENED loop"
            - "CorrectiveAction.${ca_id}.evidence_note == \"Photo evidence attached\""
            - "AfterActionReview.${aar_id}.ca_verified_count == 1"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: verification_cascade_closes_review_and_drill
        grounds:
          - state_machines.CorrectiveAction.PENDING_VERIFICATION_to_VERIFIED
          - state_machines.AfterActionReview.ACCEPTED_to_CLOSED
          - state_machines.DrillEvent.COMPLETED_to_CLOSED
        distinguishing_aspect: |
          Depth-3 cascade from a verify trigger: CA -> VERIFIED mutates the
          review's counters; that mutation itself fires the review's
          ACCEPTED -> CLOSED auto-transition; the review's closure then fires
          the drill's COMPLETED -> CLOSED auto-transition.
        test_recipe:
          setup:
            - "Site with ACTIVE EOP; FIRE drill COMPLETED; AAR ACCEPTED (officer-1 submitted, principal-1 accepted); one corrective action PENDING_VERIFICATION"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:04:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/complete"
              as: SchoolSafetyOfficer
            - call: "POST /drill-events/${drill_id}/after-action-reviews"
              payload: { findings_summary: "Good drill", overall_rating: MEETS, evacuation_assessment: MET_STANDARD }
              as: SchoolSafetyOfficer
              captures: { aar_id: $.data.id }
            - call: "POST /after-action-reviews/${aar_id}/submit"
              as: SchoolSafetyOfficer
              as_user_id: "officer-1"
            - call: "POST /after-action-reviews/${aar_id}/decide"
              payload: { decision: ACCEPT }
              as: Principal
              as_user_id: "principal-1"
            - call: "POST /after-action-reviews/${aar_id}/corrective-actions"
              payload: { description: "Replace gate signage", priority: HIGH, due_date: "2026-10-15", assignee_name: "Facilities Lead" }
              as: SchoolSafetyOfficer
              captures: { ca_id: $.data.id }
            - call: "POST /corrective-actions/${ca_id}/submit-verification"
              payload: { evidence_note: "Installed" }
              as: SchoolSafetyOfficer
          trigger:
            - call: "POST /corrective-actions/${ca_id}/verify"
              payload: { decision: VERIFY }
              as: DistrictSafetyCoordinator
          assert:
            - "CorrectiveAction.${ca_id}.status == VERIFIED"
            - "AfterActionReview.${aar_id}.status == CLOSED"
            - "AfterActionReview.${aar_id}.ca_verified_count == 1 and ca_total_count == 1"
            - "DrillEvent.${drill_id}.status == CLOSED"
            - "SchoolSite.${site_id}.drills_completed_count == 1 (CLOSED still feeds the completed bucket)"

      - name: missed_drill_cascade_marks_report_stale
        grounds:
          - state_machines.DrillEvent.SCHEDULED_to_MISSED
          - calculations.compliance_posture_derivation
          - state_machines.ComplianceReport.DRAFT_to_STALE
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger class (clock sweep): the
          sweep flips the drill SCHEDULED -> MISSED; that mutation recomputes
          site counters and posture (MISSED in the current academic year forces
          AT_RISK); the drill mutation also flips the covering DRAFT
          ComplianceReport -> STALE.
        test_recipe:
          setup:
            - "Site with FIRE requirement; one FIRE drill SCHEDULED for 2026-09-10; a DRAFT ComplianceReport covering 2026-08-01..2027-06-30 generated while the drill was still schedulable"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Cedar Grove High", enrollment_count: 1200, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-10", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /compliance-reports"
              payload: { site_id: "${site_id}", period_start: "2026-08-01", period_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-11T00:00:00Z" }
              as: DistrictSafetyCoordinator
          assert:
            - "DrillEvent.${drill_id}.status == MISSED"
            - "SchoolSite.${site_id}.drills_missed_count == 1 and drills_scheduled_count == 0"
            - "SchoolSite.${site_id}.compliance_posture == AT_RISK"
            - "ComplianceReport.${rep_id}.status == STALE"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_roster_add
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ACCOMMODATION_MISSING]
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): adding a roster
          entry to a COMPLETED drill with accommodation_required=true and no
          accommodation plan violates both priority 5 and priority 6; the
          priority-5 ERR_INVALID_STATE must be returned, not
          ERR_ACCOMMODATION_MISSING.
        test_recipe:
          setup:
            - "Site with ACTIVE EOP; one FIRE drill already COMPLETED (empty roster); no AccommodationPlan exists for student stu-9"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Ridgeview Elementary", enrollment_count: 500, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /site-plan-documents"
              payload: { site_id: "${site_id}", document_title: "Floor Plan 2026", issued_on: "2026-07-01", review_by_date: "2027-01-15", coverage_tags: ["FLOOR_PLANS", "ACCESS_POINTS"] }
              as: SchoolSafetyOfficer
            - call: "POST /walkthroughs"
              payload: { site_id: "${site_id}", agency: FIRE, scheduled_date: "2026-07-20" }
              as: SchoolSafetyOfficer
              captures: { walk_id: $.data.id }
            - call: "POST /walkthroughs/${walk_id}/complete"
              payload: { completed_date: "2026-07-20", findings_summary: "OK", recommendations_count: 0 }
              as: FirstResponder
            - call: "POST /emergency-operations-plans"
              payload: { site_id: "${site_id}", title: "EOP 2026", plan_version_label: "v1", content_summary: "Procedures", review_due_date: "2027-08-01" }
              as: SchoolSafetyOfficer
              captures: { eop_id: $.data.id }
            - call: "POST /emergency-operations-plans/${eop_id}/submit"
              as: SchoolSafetyOfficer
            - call: "POST /emergency-operations-plans/${eop_id}/decide"
              payload: { decision: APPROVE }
              as: DistrictSafetyCoordinator
            - call: "POST /emergency-operations-plans/${eop_id}/activate"
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
              payload: { site_id: "${site_id}", drill_type: FIRE, scheduled_date: "2026-09-15", scheduled_start_time: "09:00", duration_minutes: 30, announcement_mode: ANNOUNCED }
              as: SchoolSafetyOfficer
              captures: { drill_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/start"
              as: SchoolSafetyOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:04:00Z" }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events/${drill_id}/complete"
              as: SchoolSafetyOfficer
          trigger:
            - call: "POST /drill-events/${drill_id}/roster-entries"
              payload: { student_ref: "stu-9", accommodation_required: true }
              as: SchoolSafetyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE (not ERR_ACCOMMODATION_MISSING)"
            - "DrillEvent.${drill_id}.roster_total == 0 (no entry created)"

      - name: safety_beats_temporal_on_drill_start
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_NO_ACTIVE_EOP]
          - errors[ERR_DRILL_NOT_TODAY]
        distinguishing_aspect: |
          Error-category pair (business_safety vs business_temporal) —
          different pair than the other Rule-5 instance: starting a drill with
          no ACTIVE EOP AND with logical today != scheduled_date violates both
          priority 6 and priority 7; ERR_NO_ACTIVE_EOP must win.
        test_recipe:
          setup:
            - "Site with FIRE requirement but NO emergency operations plan at all; one FIRE drill SCHEDULED for 2026-09-15; logical clock at 2026-09-14 (wrong day, but BEFORE the scheduled date so the MISSED sweep does not fire)"
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Maplewood K-8", enrollment_count: 850, academic_year_start: "2026-08-01", academic_year_end: "2027-06-30" }
              as: DistrictSafetyCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /drill-requirements"
              payload: { site_id: "${site_id}", drill_type: FIRE, required_per_year: 2, min_spacing_days: 20, target_evac_seconds: 300 }
              as: DistrictSafetyCoordinator
            - call: "POST /drill-events"
