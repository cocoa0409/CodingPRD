        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.VoteInstruction.fields.shares_voted, "endpoints[POST /proxy/vote-instructions]"]
        distinguishing_aspect: "Immediate consistency: the vote-create response itself shows status VALIDATED and shares_voted defaulted to shares_held; a follow-up GET returns identical values with no lag."
        test_recipe:
          setup: ["meeting VOTING_OPEN; a1 6000 COMMON; p1 ACTIVE"]
          setup_api_calls:
            - call: "POST /proxy/meetings"
              payload: { company_name: "Sync Co", ticker: "SYN", meeting_type: "ANNUAL", record_date: "2026-08-10", meeting_datetime: "2026-09-15T16:00:00Z", meeting_mode: "VIRTUAL", quorum_threshold_pct: 0.5, outstanding_shares: 10000 }
              as: ProxyAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /proxy/shareholder-accounts"
              payload: { meeting_id: "${m_id}", holder_name: "Holder One", account_number: "A-1001", share_class: "COMMON", shares_held: 6000 }
              as: TransferAgent
              captures: { a1_id: $.data.id, cn1: $.data.control_number }
            - call: "POST /proxy/meetings/${m_id}/lock-record-date"
              payload: {}
              as: ProxyAdministrator
            - call: "POST /proxy/proposals"
              payload: { meeting_id: "${m_id}", proposal_number: 1, title: "Say on pay", proposal_type: "SAY_ON_PAY", vote_standard: "MAJORITY_OF_VOTES_CAST" }
              as: ProxyAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /proxy/material-distributions/generate"
              payload: { meeting_id: "${m_id}" }
              as: ProxyAdministrator
            - call: "POST /proxy/meetings/${m_id}/open-voting"
              payload: {}
              as: ProxyAdministrator
          trigger:
            - call: "POST /proxy/vote-instructions"
              payload: { meeting_id: "${m_id}", proposal_id: "${p1_id}", account_id: "${a1_id}", channel: "INTERNET", choice: "FOR", control_number: "${cn1}" }
              as: Shareholder
              as_user_id: "${a1_id}"
              captures: { v_id: $.data.id, v_status: $.data.status, v_shares: $.data.shares_voted }
            - call: "GET /proxy/vote-instructions/${v_id}"
              as: ProxyAdministrator
              captures: { g_status: $.data.status, g_shares: $.data.shares_voted }
            - call: "GET /proxy/meetings/${m_id}/quorum?variant=PROVISIONAL"
              as: ProxyAdministrator
              captures: { q_shares: $.data.shares_present }
          assert:
            - "create response: status == VALIDATED and shares_voted == 6000 (default = shares_held; client-sent value absent)"
            - "GET agrees: status == VALIDATED, shares_voted == 6000"
            - "quorum read in the same moment: shares_present == 6000"
