    side_effects: ["plan foh_required / boh_required recomputed"]

  - method: GET
    path: "/api/staffing-plans/{id}/shifts"
    description: "List shifts of a plan"
    roles: [PlatformAdmin, VenueManager]
    code: 200
    input: []
    output: Shift[]
    side_effects: []

  - method: POST
    path: "/api/staffing-plans/{plan_id}/publish"
    description: "Publish the plan"
    roles: [VenueManager]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: ["status -> PUBLISHED"]

  - method: POST
    path: "/api/staffing-plans/{plan_id}/revert"
    description: "Revert plan to draft"
    roles: [VenueManager]
    code: 200
    input: []
    output: StaffingPlan
    side_effects: ["status -> DRAFT"]

  - method: POST
    path: "/api/staffing-plans/{plan_id}/lock"
    description: "Lock the plan"
    roles: [VenueManager]
    code: 200
    input: []
