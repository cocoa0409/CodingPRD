  # =====================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: meet_whole_day_occupation
        grounds:
          - validations[priority=12]
          - state_machines.Meet.DRAFT_to_SCHEDULED
        distinguishing_aspect: |
          Resource = Club, semantics = whole-day occupation with day equality:
          a club may hold at most one meet in SCHEDULED|PAIRINGS_PUBLISHED|IN_PROGRESS
          per calendar date; the same date collides (ERR_MEET_DATE_CONFLICT) while
          the adjacent day is free — no buffer, no time-of-day.
        test_recipe:
          setup:
            - "Season ACTIVE; clubs A,B,C; meet A(host) vs B SCHEDULED on 2026-09-05; second meet C(host) vs A(away) DRAFT on 2026-09-05; third meet C(host) vs A(away) DRAFT on 2026-09-06"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Gamma", school_name: "G HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_c: $.data.id } }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet1: $.data.id } }
            - { call: "POST /api/meets/${meet1}/schedule", payload: {}, as: FederationAdmin }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_c}", away_club_id: "${club_a}", scheduled_date: "2026-09-05", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet2: $.data.id } }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_c}", away_club_id: "${club_a}", scheduled_date: "2026-09-06", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet3: $.data.id } }
          trigger:
            - { call: "POST /api/meets/${meet2}/schedule", payload: {}, as: FederationAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/meets/${meet3}/schedule", payload: {}, as: FederationAdmin, captures: { m3_status: $.data.status } }
          assert:
            - "Same date (2026-09-05) with shared club A: ERR_MEET_DATE_CONFLICT (409) — got ${err}"
            - "Adjacent date (2026-09-06): schedules fine, status SCHEDULED — got ${m3_status} (day-granularity, no buffer)"
            - "Meet.${meet2}.status remains DRAFT"

      - name: proctor_buffered_interval_overlap
        grounds:
          - validations[priority=12]
          - state_machines.ProctorAssignment
        distinguishing_aspect: |
          Resource = Coach, semantics = closed multi-day interval expanded by a 1-day
          rest buffer on each side — different interval arithmetic from the meet
          whole-day rule: a tournament on [09-10, 09-12] blocks a meet on 09-13
          (buffer) but not on 09-14.
        test_recipe:
          setup:
            - "Season ACTIVE; clubs A,B; coach X (club A) holds an ASSIGNED proctor assignment for tournament 2026-09-10..2026-09-12; two meets exist (A vs B on 2026-09-13 and on 2026-09-14, both DRAFT)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id } }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Beta", school_name: "B HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_b: $.data.id } }
            - { call: "POST /api/coaches", payload: { club_id: "${club_a}", full_name: "Coach X", email: "cx@x.com", certification_level: "SENIOR" }, as: FederationAdmin, captures: { coach_x: $.data.id } }
            - { call: "POST /api/tournaments", payload: { season_id: "${season_id}", name: "State Qualifier", start_date: "2026-09-10", end_date: "2026-09-12", entry_fee_cents: 0, capacity: 64 }, as: FederationAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_x}", event_type: "TOURNAMENT", tournament_id: "${t_id}" }, as: FederationAdmin, captures: { asg_t: $.data.id } }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_a}", away_club_id: "${club_b}", scheduled_date: "2026-09-13", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet13: $.data.id } }
            - { call: "POST /api/meets", payload: { season_id: "${season_id}", host_club_id: "${club_b}", away_club_id: "${club_a}", scheduled_date: "2026-09-14", rounds_count: 1, boards_count: 1 }, as: FederationAdmin, captures: { meet14: $.data.id } }
          trigger:
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_x}", event_type: "MEET", meet_id: "${meet13}" }, as: FederationAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /api/proctor-assignments", payload: { coach_id: "${coach_x}", event_type: "MEET", meet_id: "${meet14}" }, as: FederationAdmin, captures: { asg_ok: $.data.id } }
          assert:
            - "Meet on 2026-09-13 (one day after tournament end 09-12): ERR_PROCTOR_DOUBLE_BOOKED (buffer day) — got ${err}"
            - "Meet on 2026-09-14 (two days after): assignment created, id ${asg_ok}"
            - "The meet rule (same-day equality) and this rule (closed interval + 1-day buffer) are different interval semantics on different resources"

  # =====================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ledger_reversal_balance_conservation
        grounds:
          - calculations.club_account_balance
          - entities.LedgerEntry.fields.reversal_of_id
        distinguishing_aspect: |
          Conserved quantity = Club.account_balance_cents (money): posting an
          ADJUSTMENT and then reversing it returns the balance to its pre-post value
          exactly (0 -> +5000 -> 0), with the original row immutable and the
          compensation expressed as a separate REVERSAL row.
        test_recipe:
          setup:
            - "Season ACTIVE; club A balance 0"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S1", start_date: "2026-08-01", end_date: "2027-05-31", dues_deadline: "2026-09-01T00:00:00Z", regular_due_cents: 2500, late_due_cents: 3750, provisional_game_threshold: 4, base_rating: 800, state_bid_slots_per_region: 2, travel_base_cents: 1500 }, as: FederationAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /api/seasons/${season_id}/activate", payload: {}, as: FederationAdmin }
            - { call: "POST /api/clubs", payload: { season_id: "${season_id}", name: "Alpha", school_name: "A HS", region_code: "NE", travel_tier: 1 }, as: FederationAdmin, captures: { club_a: $.data.id, cav: $.data.version } }
            - { call: "POST /api/clubs/${club_a}/ledger-entries", payload: { entry_type: "ADJUSTMENT", amount_cents: 5000, memo: "funding", expected_club_version: "${cav}" }, as: Treasurer, as_user_id: "treasurer-1", captures: { le_id: $.data.id } }
          trigger:
            - { call: "POST /api/ledger-entries/${le_id}/reverse", payload: { memo: "erroneous funding" }, as: Auditor, as_user_id: "auditor-1", captures: { rev_amt: $.data.amount_cents, rev_type: $.data.entry_type } }
            - { call: "GET /api/clubs/${club_a}", as: FederationAdmin, captures: { bal: $.data.account_balance_cents } }
            - { call: "GET /api/ledger-entries/${le_id}", as: FederationAdmin, captures: { orig_amt: $.data.amount_cents, orig_rev_by: $.data.reversed_by_id } }
          assert:
            - "Club.${club_a}.account_balance_cents == 0 (invariant: post + reverse conserves the pre-post balance) — got ${bal}"
            - "REVERSAL entry: entry_type == REVERSAL, amount_cents == -5000, reversal_of_id == ${le_id} (${rev_type}, ${rev_amt})"
            - "Original entry unchanged: amount_cents == 5000 with reversed_by_id set (${orig_amt}, ${orig_rev_by})"

      - name: rating_replay_restore_after_void
        grounds:
          - calculations.rating_replay
          - state_machines.RatingEvent.EFFECTIVE_to_VOIDED
        distinguishing_aspect: |
          Conserved quantity = replayed Player.rating (rating points, not money):
          confirming a rated game then overturning it to an UNRATED result
          (DOUBLE_FORFEIT) voids both RatingEvents and the replay restores each
          player to exactly the pre-confirm rating (1000 and 800) with game counts
          back to 25/30.
        test_recipe:
          setup:
            - "Season threshold 4 ACTIVE; P (club A, 1000/25) vs Q (club B, 800/30); memberships waived; meet IN_PROGRESS; pairing confirmed WHITE_WIN (P 1008, Q 792); dispute raised and UNDER_REVIEW"
