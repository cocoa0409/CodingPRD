      - name: invoice_overdue_dual_recovery_edges
        grounds:
          - state_machines.Invoice.OVERDUE_to_PAID
          - state_machines.Invoice.OVERDUE_to_VOID
          - entities.Partner.fields.credit_hold
        distinguishing_aspect: "the Invoice machine is non-linear in two directions — ISSUED advances to OVERDUE by the logical clock alone, and OVERDUE carries two distinct compensating exits (PAID and VOID) that both restore the partner's billing fields, so one state has divergent exits instead of a single successor."
