            - "the captured ${rev3_deadline} == '2027-02-23' (2026-10-01 + 135 + 10 days) and ${rev3_status} == 'UNDER_REVIEW'"
            - "the captured ${rev2_rev} == 2 and ${rev3_rev} == 3 — ba_revision_number ratchets once per cycle traversal and never resets inside the cycle"
