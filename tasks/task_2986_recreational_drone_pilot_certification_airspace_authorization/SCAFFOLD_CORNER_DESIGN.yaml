          rationale: "Per-line round_half_up before summing, and the surcharge tier selected from the pre-surcharge net, are asserted there against the wrong-order figures."

  - section: validations
    instances:
      - name: requested_ceiling_above_either_hard_cap_returns_the_declared_error
        claim_type: violation_to_error
        grounds:
          - validations.priority_26
          - errors.ERR_ALTITUDE_CEILING_EXCEEDED
          - endpoints.POST_/drone-ops/airspace-authorizations
        distinguishing_aspect: |
          Priority 26 caps requested_ceiling_ft at min(zone.class_ceiling_ft,
          aircraft.max_altitude_ft), so the same declared error must answer whichever of the two
          caps binds. Two requests violate it from opposite directions - one over the zone's
          class ceiling with a high-flying airframe, one over a low airframe's own limit inside a
          generous zone - and both must return ERR_ALTITUDE_CEILING_EXCEEDED at 422 with no
          AirspaceAuthorization row left behind. The pilot is fully insured, so no fiscal
          validation can steal the answer.
        test_recipe:
          setup:
            - "Logical clock at 2026-04-01T00:00:00Z."
            - "One COMMERCIAL pilot CERTIFIED at 2026-04-01T00:00:00Z with an ACTIVE indemnified policy of 2000000 cents effective 2026-04-01 .. 2027-04-01."
            - "Airframe H: 249 g, max_altitude_ft 900, REGISTERED. Airframe L: 249 g, max_altitude_ft 600, REGISTERED."
            - "One class C zone with class_ceiling_ft 700, requires_authorization true, max_concurrent_authorizations 2."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Yara Peck", email: "yara.peck@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-04-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 84 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "High 1", serial_number: "SN-CAP-H1", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { ach: $.data.id }
            - call: "POST /drone-ops/aircraft/${ach}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Low 1", serial_number: "SN-CAP-L1", takeoff_weight_g: 249, max_altitude_ft: 600 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acl: $.data.id }
            - call: "POST /drone-ops/aircraft/${acl}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Puget Underwriters", policy_number: "POL-CAP-01", coverage_limit_cents: 2000000, deductible_cents: 50000, effective_from: "2026-04-01T00:00:00Z", effective_until: "2027-04-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
              as_user_id: "${pid}"
              captures: { polid: $.data.id }
            - call: "POST /drone-ops/insurance-policies/${polid}/verify"
              payload: { outcome: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/airspace-zones"
              payload: { designator: "ZONE-C-CAP", class_code: "C", class_ceiling_ft: 700, requires_authorization: true, max_concurrent_authorizations: 2 }
              as: AirspaceAuthority
              captures: { zid: $.data.id }
            - call: "GET /drone-ops/airspace-zones/${zid}"
              payload: {}
              as: Pilot
              as_user_id: "${pid}"
              captures: { zv: $.data.version }
          trigger:
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${ach}", zone_id: "${zid}", requested_ceiling_ft: 800, window_start: "2026-04-10T09:00:00Z", window_end: "2026-04-10T12:00:00Z", expected_zone_version: "${zv}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { err_zone: $.data.error_id }
            - call: "POST /drone-ops/airspace-authorizations"
              payload: { pilot_id: "${pid}", aircraft_id: "${acl}", zone_id: "${zid}", requested_ceiling_ft: 650, window_start: "2026-04-10T09:00:00Z", window_end: "2026-04-10T12:00:00Z", expected_zone_version: "${zv}" }
              as: Pilot
              as_user_id: "${pid}"
              captures: { err_aircraft: $.data.error_id }
          assert:
            - "first request: HTTP 422 with ${err_zone} == \"ERR_ALTITUDE_CEILING_EXCEEDED\" - 800 > min(700, 900), the zone's class ceiling binds"
            - "second request: HTTP 422 with ${err_aircraft} == \"ERR_ALTITUDE_CEILING_EXCEEDED\" - 650 > min(700, 600), the airframe's own limit binds inside a zone that would have allowed it"
            - "both responses carry response_type \"error\" and a non-empty data.message; neither returns ERR_INVALID_REQUEST (650 and 800 are inside the declared 1..2000 range)"
            - "GET /drone-ops/airspace-authorizations?pilot_id=${pid} returns total_count 0 - a rejected request creates no AirspaceAuthorization row at all"
            - "the zone's version and reserved_slot_count are unchanged, so ${zv} is still current for a later request"

      - name: a_fully_compliant_commercial_flight_clears_every_gate
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_15
          - validations.priority_20
          - validations.priority_24
          - validations.priority_35
          - endpoints.POST_/drone-ops/flights
          - endpoints.POST_/drone-ops/flights/{id}/preflight-check
        distinguishing_aspect: |
          The mirror image of every negative instance: one flight that satisfies all thirty-eight
          validations at once, including the ones only a heavy airframe in controlled airspace
          can reach - remote ID verification, authorization matching and containment, altitude
          ceiling, commercial insurance and indemnification. It pins that a fully compliant
          request is accepted with an empty blocking_findings array rather than merely
          "not rejected", and that the pre-flight record snapshots the class code and effective
          ceiling it actually used.
