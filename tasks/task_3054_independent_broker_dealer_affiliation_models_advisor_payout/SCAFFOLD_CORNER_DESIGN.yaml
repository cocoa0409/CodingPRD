# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3054_independent_broker_dealer_affiliation_models_advisor_payout
# Breadth probe over the §1.1–§1.7 surface that §1.8 does not already exercise.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: branch_create_returns_every_declared_default_field
        claim_type: Creation
        grounds:
          - entities.Branch
          - endpoints.POST_/branches
          - response_envelope.success
        distinguishing_aspect: "A branch created with only the four input fields comes back 201 with state UNSUPERVISED, osj_enabled false, supervising_advisor_count 0, version 1 and system-generated id and timestamps."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Branch.${b_id}.state == UNSUPERVISED and osj_enabled == false"
            - "Branch.${b_id}.supervising_advisor_count == 0 and version == 1"
            - "Branch.${b_id}.current_payout_period_id is null"
            - "the response data carries non-null id, created_at and updated_at, and meta.api_request_id is present"

      - name: branch_create_missing_required_osj_name_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Branch.fields.osj_name
          - validations[priority=1]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "osj_name is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST and no branch is created."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "response_type is error and data carries both error_id and message"
            - "GET /branches returns 0 rows"

      - name: branch_get_with_unknown_id_returns_branch_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/branches/{id}
          - errors.ERR_BRANCH_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "A syntactically valid but unallocated id produces the entity-specific 404 ERR_BRANCH_NOT_FOUND rather than a generic ERR_NOT_FOUND or a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No branch has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /branches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_BRANCH_NOT_FOUND"
            - "the response is not ERR_NOT_FOUND, so the branch-specific not-found error is the one surfaced"

      - name: branches_list_paginates_and_reports_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_/branches
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three branches on file, limit=2&offset=0 returns two rows with total_count 3 and has_more true, while the default call returns all three with limit 10 and offset 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Three branches are created with distinct branch codes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "MID-1", name: "Midtown Practice", transmittal_account: "TA-2210", osj_name: "Midtown OSJ" }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "COA-1", name: "Coastal Practice", transmittal_account: "TA-7788", osj_name: "Coastal OSJ" }
              as: PlatformAdmin
              captures: { b3: $.data.id }
          trigger:
            - call: "GET /branches"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /branches?limit=2&offset=2 returns exactly 1 row with has_more == false"
            - "GET /branches with no query parameters returns 3 rows, limit defaulting to 10 and offset to 0"

      - name: advisor_create_derives_book_portability_ratio
        claim_type: Computed Fields
        grounds:
          - entities.Advisor.fields.book_portability_pct
          - endpoints.POST_/advisors
        distinguishing_aspect: "book_portability_pct is server-computed as book_transferred_cents * 10000 // ingested_book_total_cents, so transferring 300,000,000 of a 500,000,000 book reads 6000 and any client-supplied value is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Branch SUP-1 exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /advisors"
              payload: { advisor_code: "A-1001", crd_number: "1234567", full_name: "Iris Calloway", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 300000000, protocol_eligible: false, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
          assert:
            - "the response status is 201 and Advisor.${a_id}.book_portability_pct == 6000"
            - "Advisor.${a_id}.status == PROSPECT and retention_status == NOT_AT_RISK"
            - "Advisor.${a_id}.t12_production_cents == 0 and outstanding_loan_balance_cents == 0"
            - "Advisor.${a_id}.annual_payout_cap_hit == false and ytd_payout_paid_cents == 0"

      - name: account_create_defaults_balance_and_fee_and_starts_open
        claim_type: Defaults
        grounds:
          - entities.Account.fields.balance_cents
          - entities.Account.fields.annual_fee_cents
          - entities.Account.fields.held_away
          - endpoints.POST_/accounts
        distinguishing_aspect: "Omitting balance_cents, annual_fee_cents and held_away on an account creation yields 0, 0 and false, and the account starts OPEN with fee_levelized false and a null rafee_effective_bps."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Branch SUP-1 with advisor A-1001 ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1001", crd_number: "1234567", full_name: "Iris Calloway", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 400000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id, a_v1: $.data.version }
            - call: "POST /payout-loans"
              payload: { advisor_code: "A-1001", principal_cents: 500000, amortization_rate_bps: 2000, forgiveness_milestone_pct: 90 }
              as: PlatformAdmin
            - call: "POST /advisors/${a_id}/enrollment"
              payload: { expected_advisor_version: "${a_v1}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { a_v2: $.data.version }
            - call: "POST /advisors/${a_id}/affiliation"
              payload: { affiliation_model: "IC", expected_advisor_version: "${a_v2}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
          trigger:
            - call: "POST /accounts"
              payload: { advisor_code: "A-1001", account_number: "A-1001-EQ", account_type: "BROKERAGE" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { ac_id: $.data.id }
          assert:
            - "the response status is 201 and Account.${ac_id}.balance_cents == 0 and annual_fee_cents == 0"
            - "Account.${ac_id}.held_away == false and status == OPEN"
            - "Account.${ac_id}.fee_levelized == false and rafee_effective_bps is null"
            - "Account.${ac_id}.pending_transfer_at is null"

      - name: branch_advisor_links_reverse_reachability_returns_the_branchs_links
        claim_type: Parent Relationships
        grounds:
          - entities.AdvisorBranchLink.fields.branch_code
          - endpoints.GET_/branches/{id}/advisor-links
          - endpoints.POST_/advisor-links
        distinguishing_aspect: "The branch's advisor links are discoverable from the branch id in sub-resource form, returning AdvisorBranchLink[] containing both links and no link belonging to the other branch."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Two branches; one advisor linked to SUP-1 as supervisor and to MID-1 as secondary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /branches"
              payload: { branch_code: "MID-1", name: "Midtown Practice", transmittal_account: "TA-2210", osj_name: "Midtown OSJ" }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1001", crd_number: "1234567", full_name: "Iris Calloway", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 400000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id }
            - call: "POST /advisor-links"
              payload: { advisor_code: "A-1001", branch_code: "SUP-1", is_supervisor: true, assignment_type: "PRIMARY" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { l1: $.data.id }
            - call: "POST /advisor-links"
              payload: { advisor_code: "A-1001", branch_code: "MID-1", is_supervisor: false, assignment_type: "SECONDARY" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { l2: $.data.id }
          trigger:
            - call: "GET /branches/${b1}/advisor-links"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "the response status is 200 and response_type is array"
            - "exactly 1 link is returned, the one whose branch_code is SUP-1 and is_supervisor true"
            - "GET /branches/${b2}/advisor-links returns exactly 1 link whose branch_code is MID-1 and is_supervisor false"
            - "GET /advisor-links?branch_code=SUP-1 returns the same single row, and the supervisor link did not appear under the other branch"# ===========================================================================
  - section: state_machines
    instances:

      - name: advisor_enrollment_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Advisor.PROSPECT_to_ONBOARDING
          - errors.ERR_INVALID_STATE
          - validations[priority=13]
        distinguishing_aspect: "Enrollment is only a PROSPECT -> ONBOARDING edge, so repeating it on an ONBOARDING advisor is rejected with ERR_INVALID_STATE and no state change fires."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Advisor A-1001 has already been enrolled and now reads ONBOARDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1001", crd_number: "1234567", full_name: "Iris Calloway", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 400000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id, a_v1: $.data.version }
            - call: "POST /payout-loans"
              payload: { advisor_code: "A-1001", principal_cents: 500000, amortization_rate_bps: 2000, forgiveness_milestone_pct: 90 }
              as: PlatformAdmin
            - call: "POST /advisors/${a_id}/enrollment"
              payload: { expected_advisor_version: "${a_v1}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { a_v2: $.data.version }
          trigger:
            - call: "POST /advisors/${a_id}/enrollment"
              payload: { expected_advisor_version: "${a_v2}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Advisor.${a_id}.status remains ONBOARDING and its version still reads ${a_v2}"

      - name: enrollment_without_a_transition_loan_returns_no_transition_loan
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Advisor.PROSPECT_to_ONBOARDING
          - errors.ERR_NO_TRANSITION_LOAN
        distinguishing_aspect: "The PROSPECT -> ONBOARDING precondition that a REQUESTED or ACTIVE loan exists is enforced: without a loan the enrollment is refused with ERR_NO_TRANSITION_LOAN, not ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Advisor A-1002 is PROSPECT on branch SUP-1 with no loan on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1002", crd_number: "1234568", full_name: "Noor Beaumont", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 400000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id, a_v1: $.data.version }
          trigger:
            - call: "POST /advisors/${a_id}/enrollment"
              payload: { expected_advisor_version: "${a_v1}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_NO_TRANSITION_LOAN"
            - "error_id != ERR_INVALID_STATE, so the loan precondition is distinct from the state precondition"
            - "Advisor.${a_id}.status is still PROSPECT"
            - "after posting a loan with POST /payout-loans the same call with expected_advisor_version ${a_v1} succeeds and returns ONBOARDING"

      - name: affiliation_with_untransferable_book_returns_portability_error
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Advisor.ONBOARDING_to_ACTIVE
          - errors.ERR_BOOK_PORTABILITY_BELOW_MINIMUM
          - errors.ERR_PORTABILITY_PROTOCOL_FAILURE
          - validations[priority=10]
        distinguishing_aspect: "A 40 percent portability ratio fails both thresholds: it trips ERR_BOOK_PORTABILITY_BELOW_MINIMUM first, and only when the ratio clears 5000 does the missing protocol flag trip ERR_PORTABILITY_PROTOCOL_FAILURE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Branch SUP-1 is ACTIVE. Two ONBOARDING advisors: A-1003 at 4000 bps portability and A-1004 at 6000 bps without protocol eligibility."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /branch-supervisor-enrollments"
              payload: { branch_code: "SUP-1", advisor_code: "A-1003", effective_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { e_id: $.data.id }
            - call: "POST /branch-supervisor-enrollments/${e_id}/state"
              payload: { to_status: "ENROLLED", expected_branch_version: "${b_v}" }
              as: PlatformAdmin
              captures: { b_v2: $.data.version }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1003", crd_number: "1234569", full_name: "Pere Whitlock", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 200000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a3: $.data.id, a3_v1: $.data.version }
            - call: "POST /payout-loans"
              payload: { advisor_code: "A-1003", principal_cents: 500000, amortization_rate_bps: 2000, forgiveness_milestone_pct: 90 }
              as: PlatformAdmin
            - call: "POST /advisors/${a3}/enrollment"
              payload: { expected_advisor_version: "${a3_v1}" }
              as: AdvisorOps
              as_user_id: "${a3}"
              captures: { a3_v2: $.data.version }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1004", crd_number: "1234570", full_name: "Dara Osei", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 300000000, protocol_eligible: false, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a4: $.data.id, a4_v1: $.data.version }
            - call: "POST /payout-loans"
              payload: { advisor_code: "A-1004", principal_cents: 500000, amortization_rate_bps: 2000, forgiveness_milestone_pct: 90 }
              as: PlatformAdmin
            - call: "POST /advisors/${a4}/enrollment"
              payload: { expected_advisor_version: "${a4_v1}" }
              as: AdvisorOps
              as_user_id: "${a4}"
              captures: { a4_v2: $.data.version }
          trigger:
            - call: "POST /advisors/${a3}/affiliation"
              payload: { affiliation_model: "IC", expected_advisor_version: "${a3_v2}" }
              as: AdvisorOps
              as_user_id: "${a3}"
              captures: { err_low: $.data.error_id }
            - call: "POST /advisors/${a4}/affiliation"
              payload: { affiliation_model: "IC", expected_advisor_version: "${a4_v2}" }
              as: AdvisorOps
              as_user_id: "${a4}"
              captures: { err_proto: $.data.error_id }
          assert:
            - "A-1003 has book_portability_pct 4000 and its affiliation returns 422 ERR_BOOK_PORTABILITY_BELOW_MINIMUM"
            - "A-1004 has book_portability_pct 6000, clears the 5000 minimum, and its affiliation returns 403 ERR_PORTABILITY_PROTOCOL_FAILURE"
            - "both advisors remain ONBOARDING"
            - "after PATCH /advisors/${a4} with protocol_eligible true and the current version, the affiliation succeeds and returns ACTIVE"

      - name: departure_with_outstanding_loan_returns_loan_balance_outstanding
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Advisor.ACTIVE_to_DEPARTING
          - errors.ERR_LOAN_BALANCE_OUTSTANDING
          - errors.ERR_PERIOD_NOT_CLOSED
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: "Two departure preconditions sit on the same transition: an outstanding loan trips ERR_LOAN_BALANCE_OUTSTANDING while an OPEN period trips ERR_PERIOD_NOT_CLOSED, and the loan check is reported first."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Branch SUP-1 supervised. Advisor A-1005 is ACTIVE with a 1,000,000 loan and an OPEN September period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /branches"
              payload: { branch_code: "SUP-1", name: "Superset Wealth", transmittal_account: "TA-4471", osj_name: "Superset OSJ" }
              as: PlatformAdmin
              captures: { b_id: $.data.id, b_v: $.data.version }
            - call: "POST /branch-supervisor-enrollments"
              payload: { branch_code: "SUP-1", advisor_code: "A-1005", effective_date: "2026-09-01" }
              as: PlatformAdmin
              captures: { e_id: $.data.id }
            - call: "POST /branch-supervisor-enrollments/${e_id}/state"
              payload: { to_status: "ENROLLED", expected_branch_version: "${b_v}" }
              as: PlatformAdmin
              captures: { b_v2: $.data.version }
            - call: "POST /advisors"
              payload: { advisor_code: "A-1005", crd_number: "1234571", full_name: "Marta Kessler", affiliation_model: "IC", primary_branch_code: "SUP-1", ingested_book_total_cents: 500000000, book_transferred_cents: 400000000, protocol_eligible: true, eo_coverage_level: "STANDARD" }
              as: PlatformAdmin
              captures: { a_id: $.data.id, a_v1: $.data.version }
            - call: "POST /advisor-links"
              payload: { advisor_code: "A-1005", branch_code: "SUP-1", is_supervisor: true, assignment_type: "PRIMARY" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { l_id: $.data.id }
            - call: "POST /payout-loans"
              payload: { advisor_code: "A-1005", principal_cents: 1000000, amortization_rate_bps: 2000, forgiveness_milestone_pct: 99 }
              as: PlatformAdmin
              captures: { ln_id: $.data.id }
            - call: "POST /advisors/${a_id}/enrollment"
              payload: { expected_advisor_version: "${a_v1}" }
              as: AdvisorOps
              as_user_id: "${a_id}"
              captures: { a_v2: $.data.version }
            - call: "POST /advisors/${a_id}/affiliation"
