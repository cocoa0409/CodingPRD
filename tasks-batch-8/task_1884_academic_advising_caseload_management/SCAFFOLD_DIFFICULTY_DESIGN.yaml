# =============================================================================
# Task 1884: §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine rules x 2 instances. All chains replayed against SCAFFOLD.yaml §1.2/§1.4/§1.5.
# Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: caseload_headcount_vs_weighted_ranking
        grounds:
          - calculations.caseload_load
          - entities.Advisor.fields.weighted_load
          - entities.Advisor.fields.assigned_active_count
        distinguishing_aspect: |
          Same advisor pool, same candidate student set: ranking_mode=HEADCOUNT picks
          advisor B (headcount 1 < 2) while ranking_mode=WEIGHTED picks advisor A
          (weighted_load 2 < 3) — the two caseload_load variants on the Advisor domain
          produce different selector winners from identical data.
        test_recipe:
          setup:
            - "Advisor A: two LOW-risk advisees -> assigned_active_count 2, weighted_load 2"
            - "Advisor B: one HIGH-risk advisee (gpa 1.9 + HIGH referral + ACTIVE hold + OPEN intervention = 78) -> headcount 1, weighted_load 3"
            - "Both advisors ACTIVE, serve major CS, max_caseload 5"
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor A", email: "a@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { a_id: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor B", email: "b@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { b_id: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "S1", email: "s1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { s1_id: "$.data.id", s1_v: "$.data.version" } }
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${s1_id}", advisor_id: "${a_id}", expected_student_version: "${s1_v}" }, as: AdvisingDirector }
            - { call: "POST /advising/students", payload: { full_name: "S2", email: "s2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { s2_id: "$.data.id", s2_v: "$.data.version" } }
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${s2_id}", advisor_id: "${a_id}", expected_student_version: "${s2_v}" }, as: AdvisingDirector }
            - { call: "POST /advising/students", payload: { full_name: "S3", email: "s3@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 1.9 }, as: AdvisingDirector, captures: { s3_id: "$.data.id" } }
            - { call: "POST /advising/referrals", payload: { student_id: "${s3_id}", source: "FACULTY", severity: "HIGH", reason: "failing midterm" }, as: FacultyReferrer }
            - { call: "POST /advising/students/${s3_id}/holds", payload: { hold_type: "ADVISING" }, as: AdvisingDirector }
            - { call: "POST /advising/interventions", payload: { student_id: "${s3_id}", intervention_type: "ACADEMIC_COACHING" }, as: AdvisingDirector }
            - { call: "GET /advising/students/${s3_id}", payload: {}, as: AdvisingDirector, captures: { s3_v: "$.data.version" } }
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${s3_id}", advisor_id: "${b_id}", expected_student_version: "${s3_v}" }, as: AdvisingDirector }
            - { call: "POST /advising/students", payload: { full_name: "S4", email: "s4@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.5 }, as: AdvisingDirector, captures: { s4_id: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "S5", email: "s5@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.5 }, as: AdvisingDirector, captures: { s5_id: "$.data.id" } }
          trigger:
            - { call: "POST /advising/advisor-assignments/auto-assign", payload: { student_id: "${s4_id}", ranking_mode: "HEADCOUNT" }, as: AdvisingDirector, captures: { s4_advisor: "$.data.advisor_id" } }
            - { call: "POST /advising/advisor-assignments/auto-assign", payload: { student_id: "${s5_id}", ranking_mode: "WEIGHTED" }, as: AdvisingDirector, captures: { s5_advisor: "$.data.advisor_id" } }
          assert:
            - "s4_advisor == ${b_id} (HEADCOUNT: B has headcount 1 < A's 2)"
            - "s5_advisor == ${a_id} (WEIGHTED after s4 joins B: A weighted_load 2 < B weighted_load 3 + 1 = 4)"
            - "s4_advisor != s5_advisor — same pool, two variants, different winners"

      - name: retention_cohort_vs_term_variant
        grounds:
          - calculations.retention_rate
          - entities.Student.fields.enrolled_term_codes
        distinguishing_aspect: |
          Same four cohort-2025 students: COHORT_PERSISTED reports 2/4 = 0.5000
          (current ENROLLED snapshot) while TERM_OVER_TERM FA25->SP26 reports 1/3 =
          0.3333 (sequential enrolled-term history) — different entity domain
          (reporting vs advisor load) and different numbers from identical rows.
        test_recipe:
          setup:
            - "s1: cohort 2025, terms [FA25, SP26], ENROLLED"
            - "s2: cohort 2025, terms [FA25], ON_LEAVE"
            - "s3: cohort 2025, terms [FA25], INACTIVE"
            - "s4: cohort 2025, terms [SP26], ENROLLED (entered in SP26)"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "R1", email: "r1@x.edu", major_code: "CS", cohort_year: 2025, current_term_code: "FA25", gpa: 3.0 }, as: AdvisingDirector, captures: { r1_id: "$.data.id" } }
            - { call: "PATCH /advising/students/${r1_id}", payload: { current_term_code: "SP26" }, as: AdvisingDirector }
            - { call: "POST /advising/students", payload: { full_name: "R2", email: "r2@x.edu", major_code: "CS", cohort_year: 2025, current_term_code: "FA25", gpa: 3.0 }, as: AdvisingDirector, captures: { r2_id: "$.data.id" } }
            - { call: "PATCH /advising/students/${r2_id}", payload: { care_status: "ON_LEAVE" }, as: AdvisingDirector }
            - { call: "POST /advising/students", payload: { full_name: "R3", email: "r3@x.edu", major_code: "CS", cohort_year: 2025, current_term_code: "FA25", gpa: 3.0 }, as: AdvisingDirector, captures: { r3_id: "$.data.id" } }
            - { call: "PATCH /advising/students/${r3_id}", payload: { care_status: "INACTIVE" }, as: AdvisingDirector }
            - { call: "POST /advising/students", payload: { full_name: "R4", email: "r4@x.edu", major_code: "CS", cohort_year: 2025, current_term_code: "SP26", gpa: 3.0 }, as: AdvisingDirector }
          trigger:
            - { call: "GET /advising/reports/retention", payload: { variant: "COHORT_PERSISTED", cohort_year: 2025 }, as: AdvisingDirector, captures: { cohort_rate: "$.data.rate", cohort_num: "$.data.numerator", cohort_den: "$.data.denominator" } }
            - { call: "GET /advising/reports/retention", payload: { variant: "TERM_OVER_TERM", from_term_code: "FA25", to_term_code: "SP26", cohort_year: 2025 }, as: AdvisingDirector, captures: { term_rate: "$.data.rate", term_num: "$.data.numerator", term_den: "$.data.denominator" } }
          assert:
            - "cohort_num == 2 AND cohort_den == 4 AND cohort_rate == 0.5000"
            - "term_num == 1 AND term_den == 3 AND term_rate == 0.3333"
            - "cohort_rate != term_rate"

  - rule_id: combinatorial_formula
    instances:
      - name: at_risk_score_conditional_bands
        grounds:
          - calculations.at_risk_score
          - entities.Student.fields.at_risk_score
          - entities.Student.fields.risk_tier
        distinguishing_aspect: |
          Mode (a): the score combines >= 3 inputs with non-linear interaction —
          a conditional gpa band branch (gpa 1.9 -> base 40), a max() over open
          referral severities (HIGH -> 20), a capped min() over no-shows
          (2 * 10 = 20), additive weights for OPEN interventions (10) and ACTIVE
          holds (8) — totalling exactly 98 with tier HIGH at the >= 70 band.
        test_recipe:
          setup:
            - "Student: gpa 1.9 (base 40); one HIGH-severity OPEN referral (+20); two NO_SHOW appointments (+20); one OPEN intervention (+10); one ACTIVE hold (+8)"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "C1", email: "c1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 1.9 }, as: AdvisingDirector, captures: { c1_id: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor C", email: "c@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { c_adv: "$.data.id" } }
            - { call: "POST /advising/referrals", payload: { student_id: "${c1_id}", source: "FACULTY", severity: "HIGH", reason: "stopped attending" }, as: FacultyReferrer }
            - { call: "POST /advising/appointments", payload: { student_id: "${c1_id}", advisor_id: "${c_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:30:00Z" }, as: FrontDeskStaff }
            - { call: "POST /advising/appointments", payload: { student_id: "${c1_id}", advisor_id: "${c_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T11:00:00Z", scheduled_end_at: "2026-08-01T11:30:00Z" }, as: FrontDeskStaff }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:11:00Z" }, as: AdvisingDirector }
            - { call: "POST /advising/ops/daily-close", payload: {}, as: AdvisingDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T11:11:00Z" }, as: AdvisingDirector }
            - { call: "POST /advising/ops/daily-close", payload: {}, as: AdvisingDirector }
            - { call: "POST /advising/interventions", payload: { student_id: "${c1_id}", intervention_type: "TUTORING_REFERRAL" }, as: AdvisingDirector }
            - { call: "POST /advising/students/${c1_id}/holds", payload: { hold_type: "FINANCIAL" }, as: AdvisingDirector }
          trigger:
            - { call: "GET /advising/students/${c1_id}", payload: {}, as: AdvisingDirector, captures: { c1_score: "$.data.at_risk_score", c1_tier: "$.data.risk_tier" } }
          assert:
            - "c1_score == 98 (40 base + 20 HIGH referral + 20 two no-shows + 10 one OPEN intervention + 8 one ACTIVE hold)"
            - "c1_tier == \"HIGH\" (98 >= 70)"

      - name: term_credit_per_term_rounding_order
        grounds:
          - calculations.term_credit_mapping
          - entities.DegreePlan.fields.mapped_credits_total
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two terms each summing to
          10.5 credits yield 11 + 11 = 22 under the pinned round-per-term-then-sum
          order, but ROUND_HALF_UP(21.0) = 21 under the rejected sum-then-round
          order; the scaffold pins 22. Different mode from
          at_risk_score_conditional_bands (mode a).
        test_recipe:
          setup:
            - "Student with no degree plan; plan has two terms, each three 3.5-credit courses"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "C2", email: "c2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { c2_id: "$.data.id" } }
          trigger:
            - { call: "POST /advising/students/${c2_id}/degree-plans", payload: { catalog_year: 2024, required_credits: 21, terms: [ { term_code: "FA26", courses: [ { course_code: "BIO1", credits: 3.5 }, { course_code: "CHM1", credits: 3.5 }, { course_code: "MAT1", credits: 3.5 } ] }, { term_code: "SP27", courses: [ { course_code: "BIO2", credits: 3.5 }, { course_code: "CHM2", credits: 3.5 }, { course_code: "MAT2", credits: 3.5 } ] } ] }, as: AdvisingDirector, captures: { c2_plan: "$.data.id", c2_mapped: "$.data.mapped_credits_total" } }
            - { call: "POST /advising/students/${c2_id}/degree-plans/${c2_plan}/submit", payload: {}, as: AdvisingDirector, captures: { c2_status: "$.data.status" } }
          assert:
            - "c2_mapped == 22 (per-term ROUND_HALF_UP(10.5)=11 twice, then summed)"
            - "c2_status == \"SUBMITTED\" (22 >= 21 and each term 11 <= 18)"

  - rule_id: non_linear_state_machine
    instances:
      - name: degree_plan_revision_cycle
        grounds:
          - state_machines.DegreePlan.DRAFT_to_SUBMITTED
          - state_machines.DegreePlan.SUBMITTED_to_DRAFT
          - state_machines.DegreePlan.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          DegreePlan is cyclic: DRAFT -> SUBMITTED -> DRAFT (return) -> SUBMITTED ->
          APPROVED, with a PATCH edit legal only in the re-entered DRAFT; entity
          distinct from the EarlyAlertReferral cycle instance.
        test_recipe:
          setup:
            - "Student with a DRAFT plan: one FA26 term of three 3.5-credit courses (mapped 11 >= required 10)"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "N1", email: "n1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { n1_id: "$.data.id" } }
            - { call: "POST /advising/students/${n1_id}/degree-plans", payload: { catalog_year: 2024, required_credits: 10, terms: [ { term_code: "FA26", courses: [ { course_code: "BIO1", credits: 3.5 }, { course_code: "CHM1", credits: 3.5 }, { course_code: "MAT1", credits: 3.5 } ] } ] }, as: AdvisingDirector, captures: { n1_plan: "$.data.id" } }
          trigger:
            - { call: "POST /advising/students/${n1_id}/degree-plans/${n1_plan}/submit", payload: {}, as: AdvisingDirector, captures: { st1: "$.data.status" } }
            - { call: "POST /advising/students/${n1_id}/degree-plans/${n1_plan}/return", payload: { reason: "add second term" }, as: AdvisingDirector, captures: { st2: "$.data.status" } }
            - { call: "PATCH /advising/students/${n1_id}/degree-plans/${n1_plan}", payload: { terms: [ { term_code: "FA26", courses: [ { course_code: "BIO1", credits: 3.5 }, { course_code: "CHM1", credits: 3.5 }, { course_code: "MAT1", credits: 3.5 } ] }, { term_code: "SP27", courses: [ { course_code: "ENG1", credits: 3.0 } ] } ] }, as: AdvisingDirector, captures: { mapped2: "$.data.mapped_credits_total" } }
            - { call: "POST /advising/students/${n1_id}/degree-plans/${n1_plan}/submit", payload: {}, as: AdvisingDirector, captures: { st3: "$.data.status" } }
            - { call: "POST /advising/students/${n1_id}/degree-plans/${n1_plan}/approve", payload: {}, as: AdvisingDirector, captures: { st4: "$.data.status", v4: "$.data.version" } }
          assert:
            - "st1 == \"SUBMITTED\" AND st2 == \"DRAFT\" (cycle re-entry) AND st3 == \"SUBMITTED\" AND st4 == \"APPROVED\""
            - "mapped2 == 14 (ROUND_HALF_UP(10.5)=11 plus ROUND_HALF_UP(3.0)=3)"
            - "v4 == 6 (create, submit, return, patch, submit, approve)"

      - name: referral_outreach_retry_cycle
        grounds:
          - state_machines.EarlyAlertReferral.OPEN_to_OUTREACH_IN_PROGRESS
          - state_machines.EarlyAlertReferral.OUTREACH_IN_PROGRESS_to_NO_RESPONSE
          - state_machines.EarlyAlertReferral.NO_RESPONSE_to_RESPONDED
        distinguishing_aspect: |
          EarlyAlertReferral is cyclic: OPEN -> OUTREACH_IN_PROGRESS -> NO_RESPONSE
          -> (further outreach) and RESPONDED is reachable from NO_RESPONSE; the
          attempt counter accumulates across loop iterations. Entity distinct from
          the DegreePlan cycle instance.
        test_recipe:
          setup:
            - "Student gpa 3.0; one MEDIUM referral (OPEN, attempt_count 0)"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "N2", email: "n2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { n2_id: "$.data.id" } }
            - { call: "POST /advising/referrals", payload: { student_id: "${n2_id}", source: "STAFF", severity: "MEDIUM", reason: "missed registration" }, as: FacultyReferrer, captures: { n2_ref: "$.data.id" } }
          trigger:
            - { call: "POST /advising/referrals/${n2_ref}/outreach", payload: { outcome: "NO_ANSWER" }, as: AdvisingDirector, captures: { o1: "$.data.status", c1: "$.data.attempt_count" } }
            - { call: "POST /advising/referrals/${n2_ref}/outreach", payload: { outcome: "NO_ANSWER" }, as: AdvisingDirector, captures: { o2: "$.data.status", c2: "$.data.attempt_count" } }
            - { call: "POST /advising/referrals/${n2_ref}/outreach", payload: { outcome: "REACHED" }, as: AdvisingDirector, captures: { o3: "$.data.status", c3: "$.data.attempt_count" } }
          assert:
            - "o1 == \"OUTREACH_IN_PROGRESS\" AND c1 == 1"
            - "o2 == \"NO_RESPONSE\" AND c2 == 2"
            - "o3 == \"RESPONDED\" AND c3 == 3 (REACHED allowed from NO_RESPONSE; no auto-escalation because escalation only triggers on NO_ANSWER reaching 3)"

  - rule_id: transitive_cascade
    instances:
      - name: referral_escalation_cascades_to_clearance_block
        grounds:
          - state_machines.EarlyAlertReferral.OPEN_to_ESCALATED
          - calculations.at_risk_score
          - calculations.advising_requirement
          - calculations.registration_clearance
        distinguishing_aspect: |
          Depth-3 chain from POST escalate: referral -> ESCALATED creates an
          Intervention (link 1); the OPEN intervention recomputes at_risk_score
          60 -> 70 flipping risk_tier to HIGH (link 2); the HIGH flip sets
          advising_required_flag=true, forcing advising_requirement_status REQUIRED
          and registration_clearance BLOCKED (link 3). Trigger distinct from the
          hold-release cascade instance.
        test_recipe:
          setup:
            - "Student gpa 1.5 (base 40) with one HIGH OPEN referral (+20) -> score 60 MEDIUM, clearance CLEARED, requirement NOT_REQUIRED"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "T1", email: "t1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 1.5 }, as: AdvisingDirector, captures: { t1_id: "$.data.id" } }
            - { call: "POST /advising/referrals", payload: { student_id: "${t1_id}", source: "FACULTY", severity: "HIGH", reason: "three absences" }, as: FacultyReferrer, captures: { t1_ref: "$.data.id" } }
          trigger:
            - { call: "POST /advising/referrals/${t1_ref}/escalate", payload: { reason: "unreachable" }, as: AdvisingDirector, captures: { t1_status: "$.data.status" } }
            - { call: "GET /advising/interventions", payload: { student_id: "${t1_id}" }, as: AdvisingDirector, captures: { t1_iv_status: "$.data[0].status", t1_iv_ref: "$.data[0].referral_id", t1_iv_type: "$.data[0].intervention_type" } }
            - { call: "GET /advising/students/${t1_id}", payload: {}, as: AdvisingDirector, captures: { t1_score: "$.data.at_risk_score", t1_tier: "$.data.risk_tier", t1_flag: "$.data.advising_required_flag", t1_req: "$.data.advising_requirement_status", t1_clear: "$.data.registration_clearance" } }
          assert:
            - "t1_status == \"ESCALATED\""
            - "t1_iv_status == \"OPEN\" AND t1_iv_ref == ${t1_ref} AND t1_iv_type == \"ACADEMIC_COACHING\" (link 1)"
            - "t1_score == 70 (60 + 10 intervention) AND t1_tier == \"HIGH\" (link 2)"
            - "t1_flag == true AND t1_req == \"REQUIRED\" AND t1_clear == \"BLOCKED\" (link 3)"

      - name: hold_release_cascades_to_clearance
        grounds:
          - state_machines.RegistrationHold.ACTIVE_to_RELEASED
          - calculations.registration_clearance
        distinguishing_aspect: |
          Depth-2 chain from POST release: hold -> RELEASED (link 1) recomputes
          registration_clearance, flipping it BLOCKED -> CLEARED once no ACTIVE
          holds remain and no REQUIRED advising requirement (link 2); at_risk_score
          drops 18 -> 10 as the hold weight is removed. Trigger distinct from the
          referral-escalation cascade instance.
        test_recipe:
          setup:
            - "Student gpa 3.0 (score 10, LOW, NOT_REQUIRED, CLEARED) with one ACTIVE FINANCIAL hold -> clearance BLOCKED, score 18"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "T2", email: "t2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { t2_id: "$.data.id" } }
            - { call: "POST /advising/students/${t2_id}/holds", payload: { hold_type: "FINANCIAL" }, as: AdvisingDirector, captures: { t2_hold: "$.data.id" } }
            - { call: "GET /advising/students/${t2_id}", payload: {}, as: AdvisingDirector, captures: { t2_pre_clear: "$.data.registration_clearance" } }
          trigger:
            - { call: "POST /advising/students/${t2_id}/holds/${t2_hold}/release", payload: {}, as: AdvisingDirector, captures: { t2_hold_status: "$.data.status" } }
            - { call: "GET /advising/students/${t2_id}", payload: {}, as: AdvisingDirector, captures: { t2_clear: "$.data.registration_clearance", t2_score: "$.data.at_risk_score" } }
          assert:
            - "t2_pre_clear == \"BLOCKED\" (setup consequence of hold creation)"
            - "t2_hold_status == \"RELEASED\" (link 1)"
            - "t2_clear == \"CLEARED\" (link 2) AND t2_score == 10"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: checkin_cancelled_outside_window_state_beats_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair {state, business_temporal}: the appointment is
          CANCELLED (priority 5 state violation) AND the logical clock sits far
          outside the check-in window (priority 8 temporal violation); the higher-
          priority state error ERR_APPOINTMENT_INVALID_STATE must win.
        test_recipe:
          setup:
            - "Appointment 2026-08-01 10:00-10:30 booked then cancelled; logical clock advanced to 2026-08-02 (outside [09:50, 10:10] window)"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "P1", email: "p1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { p1_id: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor P", email: "p@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { p_adv: "$.data.id" } }
            - { call: "POST /advising/appointments", payload: { student_id: "${p1_id}", advisor_id: "${p_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:30:00Z" }, as: FrontDeskStaff, captures: { p_appt: "$.data.id" } }
            - { call: "POST /advising/appointments/${p_appt}/cancel", payload: {}, as: FrontDeskStaff }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: AdvisingDirector }
          trigger:
            - { call: "POST /advising/appointments/${p_appt}/check-in", payload: {}, as: FrontDeskStaff, captures: { p_err: "$.data.error_id" } }
          assert:
            - "p_err == \"ERR_APPOINTMENT_INVALID_STATE\" (state priority 5 beats temporal priority 8)"

      - name: confidential_note_on_inactive_student_state_beats_safety
        grounds:
          - validations[priority=5]
          - validations[priority=6]
        distinguishing_aspect: |
          Error-category pair {state, business_safety}: the student is INACTIVE
          (priority 5 state violation, ERR_STUDENT_INACTIVE) AND the calling
          Advisor is not the assigned advisor attempting a CONFIDENTIAL note
          (priority 6 safety violation, ERR_NOTE_CONFIDENTIALITY_RESTRICTED);
          the state error must win. Pair distinct from {state, business_temporal}.
        test_recipe:
          setup:
            - "Student assigned to advisor A, then moved to care_status INACTIVE; advisor B (also ACTIVE, serves CS) is not assigned"
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor PA", email: "pa@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { pa_id: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor PB", email: "pb@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { pb_id: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "P2", email: "p2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { p2_id: "$.data.id", p2_v: "$.data.version" } }
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${p2_id}", advisor_id: "${pa_id}", expected_student_version: "${p2_v}" }, as: AdvisingDirector }
            - { call: "PATCH /advising/students/${p2_id}", payload: { care_status: "INACTIVE" }, as: AdvisingDirector }
          trigger:
            - { call: "POST /advising/students/${p2_id}/notes", payload: { visibility: "CONFIDENTIAL", body: "sensitive" }, as: Advisor, as_user_id: "${pb_id}", captures: { p2_err: "$.data.error_id" } }
          assert:
            - "p2_err == \"ERR_STUDENT_INACTIVE\" (state priority 5 beats safety priority 6)"

  - rule_id: boundary_precision_check
    instances:
      - name: advisor_capacity_at_max_excluded
        grounds:
          - calculations.caseload_load
          - errors[ERR_NO_ELIGIBLE_ADVISOR]
          - endpoints: "POST /advising/advisor-assignments/auto-assign"
        distinguishing_aspect: |
          Count metric boundary: assigned_active_count == max_caseload - 1 admits
          one more assignment (0 < 1), while count == max_caseload (1 == 1)
          excludes the advisor from the selector pool entirely, leaving an empty
          pool and ERR_NO_ELIGIBLE_ADVISOR on the auto-assign endpoint.
        test_recipe:
          setup:
            - "Single ACTIVE advisor serving CS with max_caseload 1; student s1 already auto-assigned (count 1)"
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor B1", email: "b1@x.edu", major_codes: ["CS"], max_caseload: 1 }, as: AdvisingDirector, captures: { b1_adv: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "BS1", email: "bs1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { bs1_id: "$.data.id" } }
            - { call: "POST /advising/advisor-assignments/auto-assign", payload: { student_id: "${bs1_id}" }, as: AdvisingDirector, captures: { bs1_asg: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "BS2", email: "bs2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { bs2_id: "$.data.id" } }
          trigger:
            - { call: "POST /advising/advisor-assignments/auto-assign", payload: { student_id: "${bs2_id}" }, as: AdvisingDirector, captures: { b_err: "$.data.error_id" } }
            - { call: "GET /advising/advisors/${b1_adv}", payload: {}, as: AdvisingDirector, captures: { b1_count: "$.data.assigned_active_count" } }
          assert:
            - "bs1_asg is non-null (count 0 < max 1 admitted the first assignment)"
            - "b_err == \"ERR_NO_ELIGIBLE_ADVISOR\" (count 1 == max 1 excludes the only advisor)"
            - "b1_count == 1"

      - name: referral_sla_breach_strict_greater_than
        grounds:
          - calculations.outreach_sla_due_at
          - entities.EarlyAlertReferral.fields.is_sla_breached
        distinguishing_aspect: |
          Time metric boundary: at logical time exactly == due_at the referral is
          NOT breached (strict >), while due_at + 1 second IS breached — observed
          through the referral read endpoint, a different metric (timestamp vs
          count) and different endpoint than the capacity boundary instance.
        test_recipe:
          setup:
            - "HIGH referral created at default clock 2026-08-01T00:00:00Z -> due_at 2026-08-03T00:00:00Z (SLA_DAYS_HIGH = 2)"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "BS3", email: "bs3@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { bs3_id: "$.data.id" } }
            - { call: "POST /advising/referrals", payload: { student_id: "${bs3_id}", source: "FACULTY", severity: "HIGH", reason: "quiz failures" }, as: FacultyReferrer, captures: { bs3_ref: "$.data.id", bs3_due: "$.data.due_at" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: AdvisingDirector }
          trigger:
            - { call: "GET /advising/referrals/${bs3_ref}", payload: {}, as: AdvisingDirector, captures: { breach_at_due: "$.data.is_sla_breached" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:01Z" }, as: AdvisingDirector }
            - { call: "GET /advising/referrals/${bs3_ref}", payload: {}, as: AdvisingDirector, captures: { breach_after_due: "$.data.is_sla_breached" } }
          assert:
            - "bs3_due == \"2026-08-03T00:00:00Z\""
            - "breach_at_due == false (now == due_at, strict > not satisfied)"
            - "breach_after_due == true (now = due_at + 1s)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: appointment_requires_student_enrolled
        grounds:
          - validations[priority=9]
          - errors[ERR_STUDENT_NOT_ENROLLED]
        distinguishing_aspect: |
          Entity pair Appointment -> Student: booking is rejected when the
          referenced Student's care_status is ON_LEAVE, even though advisor,
          slot, and payload are all valid.
        test_recipe:
          setup:
            - "Student moved to ON_LEAVE; ACTIVE advisor serving CS"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "X1", email: "x1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { x1_id: "$.data.id" } }
            - { call: "PATCH /advising/students/${x1_id}", payload: { care_status: "ON_LEAVE" }, as: AdvisingDirector }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor X", email: "x@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { x_adv: "$.data.id" } }
          trigger:
            - { call: "POST /advising/appointments", payload: { student_id: "${x1_id}", advisor_id: "${x_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:30:00Z" }, as: FrontDeskStaff, captures: { x_err: "$.data.error_id" } }
          assert:
            - "x_err == \"ERR_STUDENT_NOT_ENROLLED\""

      - name: hold_release_requires_plan_approved
        grounds:
          - state_machines.RegistrationHold.ACTIVE_to_RELEASED
          - errors[ERR_PLAN_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair RegistrationHold -> DegreePlan: releasing a hold with
          requires_approved_plan=true is rejected while the student's only plan is
          SUBMITTED, and succeeds after that plan reaches APPROVED — a different
          entity pair than Appointment -> Student.
        test_recipe:
          setup:
            - "Student with a SUBMITTED degree plan (mapped 11 >= required 10) and an ACTIVE ADVISING hold with requires_approved_plan=true"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "X2", email: "x2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { x2_id: "$.data.id" } }
            - { call: "POST /advising/students/${x2_id}/degree-plans", payload: { catalog_year: 2024, required_credits: 10, terms: [ { term_code: "FA26", courses: [ { course_code: "BIO1", credits: 3.5 }, { course_code: "CHM1", credits: 3.5 }, { course_code: "MAT1", credits: 3.5 } ] } ] }, as: AdvisingDirector, captures: { x2_plan: "$.data.id" } }
            - { call: "POST /advising/students/${x2_id}/degree-plans/${x2_plan}/submit", payload: {}, as: AdvisingDirector }
            - { call: "POST /advising/students/${x2_id}/holds", payload: { hold_type: "ADVISING", requires_approved_plan: true }, as: AdvisingDirector, captures: { x2_hold: "$.data.id" } }
          trigger:
            - { call: "POST /advising/students/${x2_id}/holds/${x2_hold}/release", payload: {}, as: AdvisingDirector, captures: { x2_err: "$.data.error_id" } }
            - { call: "POST /advising/students/${x2_id}/degree-plans/${x2_plan}/approve", payload: {}, as: AdvisingDirector }
            - { call: "POST /advising/students/${x2_id}/holds/${x2_hold}/release", payload: {}, as: AdvisingDirector, captures: { x2_hold_status: "$.data.status" } }
          assert:
            - "x2_err == \"ERR_PLAN_NOT_APPROVED\" (plan only SUBMITTED)"
            - "x2_hold_status == \"RELEASED\" (after approval the gate passes)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: appointment_half_open_adjacency
        grounds:
          - errors[ERR_APPOINTMENT_OVERLAP]
          - calculations.advisor_scheduled_minutes
        distinguishing_aspect: |
          Half-open interval semantics on the Advisor schedule resource: a booking
          whose end equals the existing appointment's start (09:30-10:00 vs
          10:00-10:30) is accepted as adjacent, while 09:45-10:15 intersects and
          is rejected with ERR_APPOINTMENT_OVERLAP.
        test_recipe:
          setup:
            - "Advisor with appointment [10:00, 10:30); student ENROLLED"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "O1", email: "o1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { o1_id: "$.data.id" } }
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor O", email: "o@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { o_adv: "$.data.id" } }
            - { call: "POST /advising/appointments", payload: { student_id: "${o1_id}", advisor_id: "${o_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T10:30:00Z" }, as: FrontDeskStaff, captures: { o_appt1: "$.data.id" } }
            - { call: "POST /advising/appointments", payload: { student_id: "${o1_id}", advisor_id: "${o_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T09:30:00Z", scheduled_end_at: "2026-08-01T10:00:00Z" }, as: FrontDeskStaff, captures: { o_appt2: "$.data.id" } }
          trigger:
            - { call: "POST /advising/appointments", payload: { student_id: "${o1_id}", advisor_id: "${o_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T09:45:00Z", scheduled_end_at: "2026-08-01T10:15:00Z" }, as: FrontDeskStaff, captures: { o_err: "$.data.error_id" } }
            - { call: "GET /advising/advisors/${o_adv}", payload: {}, as: AdvisingDirector, captures: { o_minutes: "$.data.scheduled_minutes" } }
          assert:
            - "o_appt2 is non-null (adjacent end==start accepted under half-open semantics)"
            - "o_err == \"ERR_APPOINTMENT_OVERLAP\" (09:45 < 10:30 and 10:15 > 10:00)"
            - "o_minutes == 60 (two accepted 30-minute bookings; rejected one not counted)"

      - name: dropin_queue_instantaneous_capacity
        grounds:
          - errors[ERR_QUEUE_CAPACITY_REACHED]
          - calculations.queue_position
        distinguishing_aspect: |
          Aggregate point-in-time capacity semantics on the daily queue resource
          (not interval arithmetic): the 4th ticket while 3 are QUEUED/CALLED is
          rejected with ERR_QUEUE_CAPACITY_REACHED, and freeing one slot (leave)
          immediately admits a new ticket — different interval semantics and
          different resource than the advisor-schedule instance.
        test_recipe:
          setup:
            - "Three QUEUED tickets on the default logical date (capacity DROPIN_MAX_ACTIVE_TICKETS = 3)"
          setup_api_calls:
            - { call: "POST /advising/students", payload: { full_name: "Q1", email: "q1@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { q1_id: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "Q2", email: "q2@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { q2_id: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "Q3", email: "q3@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { q3_id: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "Q4", email: "q4@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { q4_id: "$.data.id" } }
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${q1_id}", reason: "schedule question" }, as: FrontDeskStaff, captures: { q_t1: "$.data.id" } }
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${q2_id}", reason: "hold question" }, as: FrontDeskStaff }
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${q3_id}", reason: "plan review" }, as: FrontDeskStaff }
          trigger:
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${q4_id}", reason: "waitlist" }, as: FrontDeskStaff, captures: { q_err: "$.data.error_id" } }
            - { call: "POST /advising/dropin-tickets/${q_t1}/leave", payload: {}, as: FrontDeskStaff }
            - { call: "POST /advising/dropin-tickets", payload: { student_id: "${q4_id}", reason: "waitlist" }, as: FrontDeskStaff, captures: { q_t4_pos: "$.data.position", q_t4_status: "$.data.status" } }
          assert:
            - "q_err == \"ERR_QUEUE_CAPACITY_REACHED\" (3 active == capacity 3)"
            - "q_t4_status == \"QUEUED\" AND q_t4_pos == 4 (position counts all tickets of the day including the LEFT one; slot freed by leave)"

  - rule_id: compensating_invariant
    instances:
      - name: assign_end_conserve_advisor_count
        grounds:
          - calculations.caseload_load
          - state_machines.AdvisorAssignment.ACTIVE_to_ENDED
        distinguishing_aspect: |
          Conserved quantity = assignment COUNT: assigning then ending returns
          advisor.assigned_active_count and weighted_load to their pre-pair values
          (0 and 0), matching the live invariant count(ACTIVE assignments) with
          zero drift.
        test_recipe:
          setup:
            - "Advisor (max 5, serves CS) with no assignments; student gpa 3.0 ENROLLED"
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor I1", email: "i1@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { i1_adv: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "I1", email: "i1s@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { i1_stu: "$.data.id", i1_sv: "$.data.version" } }
            - { call: "GET /advising/advisors/${i1_adv}", payload: {}, as: AdvisingDirector, captures: { i1_pre_count: "$.data.assigned_active_count", i1_pre_load: "$.data.weighted_load" } }
          trigger:
            - { call: "POST /advising/advisor-assignments", payload: { student_id: "${i1_stu}", advisor_id: "${i1_adv}", expected_student_version: "${i1_sv}" }, as: AdvisingDirector, captures: { i1_asg: "$.data.id" } }
            - { call: "POST /advising/advisor-assignments/${i1_asg}/end", payload: {}, as: AdvisingDirector }
            - { call: "GET /advising/advisors/${i1_adv}", payload: {}, as: AdvisingDirector, captures: { i1_post_count: "$.data.assigned_active_count", i1_post_load: "$.data.weighted_load" } }
            - { call: "GET /advising/advisor-assignments", payload: { advisor_id: "${i1_adv}", status: "ACTIVE" }, as: AdvisingDirector }
          assert:
            - "i1_pre_count == 0 AND i1_pre_load == 0"
            - "i1_post_count == 0 AND i1_post_load == 0 (forward + compensating action conserve the count)"
            - "GET advisor-assignments?advisor_id&status=ACTIVE returns total_count == 0 (invariant: field equals live count)"

      - name: book_cancel_conserve_scheduled_minutes
        grounds:
          - calculations.advisor_scheduled_minutes
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = MINUTES SUM (different type than the assignment
          count): booking a 30-minute appointment then cancelling it returns
          advisor.scheduled_minutes from 0 up to 30 and back to exactly 0.
        test_recipe:
          setup:
            - "Advisor with no appointments; student ENROLLED"
          setup_api_calls:
            - { call: "POST /advising/advisors", payload: { full_name: "Advisor I2", email: "i2@x.edu", major_codes: ["CS"], max_caseload: 5 }, as: AdvisingDirector, captures: { i2_adv: "$.data.id" } }
            - { call: "POST /advising/students", payload: { full_name: "I2", email: "i2s@x.edu", major_code: "CS", cohort_year: 2026, current_term_code: "FA26", gpa: 3.0 }, as: AdvisingDirector, captures: { i2_stu: "$.data.id" } }
            - { call: "GET /advising/advisors/${i2_adv}", payload: {}, as: AdvisingDirector, captures: { i2_pre_min: "$.data.scheduled_minutes" } }
          trigger:
            - { call: "POST /advising/appointments", payload: { student_id: "${i2_stu}", advisor_id: "${i2_adv}", term_code: "FA26", scheduled_start_at: "2026-08-01T14:00:00Z", scheduled_end_at: "2026-08-01T14:30:00Z" }, as: FrontDeskStaff, captures: { i2_appt: "$.data.id" } }
            - { call: "GET /advising/advisors/${i2_adv}", payload: {}, as: AdvisingDirector, captures: { i2_mid_min: "$.data.scheduled_minutes" } }
            - { call: "POST /advising/appointments/${i2_appt}/cancel", payload: {}, as: FrontDeskStaff }
            - { call: "GET /advising/advisors/${i2_adv}", payload: {}, as: AdvisingDirector, captures: { i2_post_min: "$.data.scheduled_minutes" } }
          assert:
            - "i2_pre_min == 0"
            - "i2_mid_min == 30 (forward action debited the minutes pool)"
            - "i2_post_min == 0 (compensating cancel restored the conserved sum exactly)"
