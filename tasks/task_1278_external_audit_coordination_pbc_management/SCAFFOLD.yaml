# =============================================================================
# Task 1278: External Audit Coordination & PBC Management
# Corporate controller's office — external audit engagement coordination
# =============================================================================

scenario: |
  External Audit Coordination & PBC Management (corporate controller's office):
  prepared-by-client request list & owner assignment, evidence upload with
  version control & deadline tracking, auditor query log & response turnaround,
  sampling request coordination across locations, audit adjustment &
  passed-adjustment schedule, management representation letter, fee/scope
  change negotiation, timeline & filing deadline alignment

domain_name: external-audit-pbc
api_prefix: /api

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: AuditEngagement
    parent: null
    common_fields: true
    fields:
      - { name: client_name, type: string, source: input, description: "Legal name of the audited entity" }
      - { name: fiscal_year_end, type: string, source: input, description: "Fiscal year end date ISO8601 (YYYY-MM-DD)" }
      - { name: base_fee_cents, type: integer, source: input, description: "Negotiated base audit fee in cents; must be > 0" }
      - { name: materiality_cents, type: integer, source: input, description: "Overall engagement materiality in cents; must be > 0" }
      - { name: filing_deadline, type: string, source: input, description: "Filing deadline ISO8601 date (YYYY-MM-DD); drives timeline alignment" }
      - { name: total_fee_cents, type: integer, source: computed, description: "base_fee_cents + sum of APPROVED FeeChangeRequest.delta_cents" }
      - { name: open_pbc_count, type: integer, source: computed, description: "Count of PBCRequest with status IN {OPEN, IN_PROGRESS, SUBMITTED, REJECTED}" }
      - { name: open_query_count, type: integer, source: computed, description: "Count of AuditorQuery with status IN {OPEN, AWAITING_CLIENT}" }
      - { name: passed_adjustment_total_cents, type: integer, source: computed, description: "Sum of amount_cents over AuditAdjustment with disposition == PASSED" }
      - { name: posture, type: enum, source: computed, description: "Derived: OPEN | CLOSING | LOCKED. LOCKED when RepresentationLetter.status == SIGNED; CLOSING when status == FIELDWORK_COMPLETE; else OPEN" }
      - { name: status, type: enum, source: system, description: "PLANNING | FIELDWORK | FIELDWORK_COMPLETE | REPORT_ISSUED | CANCELLED" }

  - name: Location
    parent: AuditEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; owning engagement" }
      - { name: location_code, type: string, source: input, description: "Short code, unique within engagement" }
      - { name: name, type: string, source: input, description: "Human-readable location name" }
      - { name: materiality_cents, type: integer, source: input, description: "Location-level materiality in cents; must be > 0 and <= engagement.materiality_cents" }

  - name: PBCRequest
    parent: AuditEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; owning engagement" }
      - { name: title, type: string, source: input, description: "Short description of requested evidence" }
      - { name: owner_user_id, type: string, source: input, description: "Controller-office user id (Preparer or Controller) responsible for the request" }
      - { name: due_date, type: string, source: input, description: "Due date ISO8601 (YYYY-MM-DD)" }
      - { name: current_evidence_id, type: string, source: system, description: "FK -> EvidenceUpload.id; latest ACCEPTED evidence; null until first acceptance" }
      - { name: rejection_count, type: integer, source: computed, description: "Number of times the most recent evidence was REJECTED" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_PROGRESS | SUBMITTED | ACCEPTED | REJECTED | FROZEN" }

  - name: EvidenceUpload
    parent: PBCRequest
    common_fields: true
    fields:
      - { name: pbc_request_id, type: string, source: system, description: "FK -> PBCRequest.id; owning PBC request" }
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; denormalized for filtering" }
      - { name: uploader_user_id, type: string, source: system, description: "X-User-ID of the Preparer who uploaded" }
      - { name: version_seq, type: integer, source: system, description: "1-based sequence per PBC request; increments per upload" }
      - { name: file_name, type: string, source: input, description: "Original file name" }
      - { name: file_size_bytes, type: integer, source: input, description: "Size of the uploaded file in bytes; must be > 0 and <= MAX_EVIDENCE_BYTES" }
      - { name: sha256, type: string, source: input, description: "Content hash for tamper evidence; 64 lowercase hex chars" }
      - { name: uploaded_at, type: string, source: system, description: "Logical-clock ISO8601 UTC timestamp at upload" }
      - { name: status, type: enum, source: system, description: "PENDING_REVIEW | ACCEPTED | REJECTED | SUPERSEDED | INVALIDATED" }

  - name: AuditorQuery
    parent: AuditEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; owning engagement" }
      - { name: pbc_request_id, type: string, source: input, description: "FK -> PBCRequest.id; optional link to a PBC request this query challenges; nullable", default: null }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID of the ExternalAuditor raising the query" }
      - { name: subject, type: string, source: input, description: "Query subject line" }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH" }
      - { name: raised_at, type: string, source: system, description: "Logical-clock ISO8601 UTC at raise time" }
      - { name: responded_at, type: string, source: system, description: "Logical-clock ISO8601 UTC at first response; null until responded" }
      - { name: turnaround_hours, type: integer, source: computed, description: "Ceiling of (responded_at - raised_at) in hours; null until responded; computed when first response logged" }
      - { name: status, type: enum, source: system, description: "OPEN | AWAITING_CLIENT | RESPONDED | CLOSED | ESCALATED" }

  - name: SamplingRequest
    parent: AuditEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; owning engagement" }
      - { name: title, type: string, source: input, description: "Sampling request title" }
      - { name: location_ids, type: array, source: input, description: "Array of Location.id; must be non-empty and all ids belong to engagement" }
      - { name: window_start, type: string, source: input, description: "Window start ISO8601 date (YYYY-MM-DD); half-open start" }
      - { name: window_end, type: string, source: input, description: "Window end ISO8601 date (YYYY-MM-DD); exclusive — half-open [start, end)" }
      - { name: sample_size, type: integer, source: input, description: "Number of items to sample per location; must be >= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | DISPATCHED | IN_PROGRESS | COMPLETE | CANCELLED" }

  - name: FieldworkVisit
    parent: AuditEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; owning engagement" }
      - { name: auditor_user_id, type: string, source: input, description: "ExternalAuditor X-User-ID scheduled for the visit" }
      - { name: location_id, type: string, source: input, description: "FK -> Location.id; location being visited" }
      - { name: visit_start, type: string, source: input, description: "Visit start ISO8601 date (YYYY-MM-DD); closed interval start" }
      - { name: visit_end, type: string, source: input, description: "Visit end ISO8601 date (YYYY-MM-DD); closed interval end — inclusive [start, end]" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | CANCELLED" }

  - name: AuditAdjustment
    parent: AuditEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; owning engagement" }
      - { name: proposed_by_user_id, type: string, source: system, description: "X-User-ID of the ExternalAuditor who proposed" }
      - { name: description, type: string, source: input, description: "Nature of the proposed adjustment" }
      - { name: amount_cents, type: integer, source: input, description: "Absolute value in cents; must be > 0" }
      - { name: direction, type: enum, source: input, description: "DEBIT | CREDIT — effect on income" }
      - { name: disposition, type: enum, source: system, description: "PROPOSED | ACCEPTED | REJECTED | PASSED — PASSED means client refused, logged to passed-adjustment schedule" }
      - { name: disposition_rationale, type: string, source: system, description: "Required when disposition moves to REJECTED or PASSED; null otherwise" }
      - { name: disposition_by_user_id, type: string, source: system, description: "X-User-ID of Controller who dispositioned; null until dispositioned" }

  - name: RepresentationLetter
    parent: AuditEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; owning engagement (1:1)" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of Preparer who drafted; SoD-checked against signer" }
      - { name: signed_by_user_id, type: string, source: system, description: "X-User-ID of Controller who signed; null until signed" }
      - { name: signed_at, type: string, source: system, description: "Logical-clock ISO8601 UTC at signing; null until signed" }
      - { name: status, type: enum, source: system, description: "DRAFT | PENDING_SIGNATURE | SIGNED" }

  - name: FeeChangeRequest
    parent: AuditEngagement
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: system, description: "FK -> AuditEngagement.id; owning engagement" }
      - { name: proposed_by_role, type: enum, source: system, description: "Role of proposer: CONTROLLER_OFFICE | AUDITOR" }
      - { name: scope_description, type: string, source: input, description: "Description of scope change driving fee change" }
      - { name: delta_cents, type: integer, source: input, description: "Signed delta in cents; non-zero; positive = increase" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | WITHDRAWN" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AuditEngagement
    initial_state: PLANNING
    terminal_states: [REPORT_ISSUED, CANCELLED]
    transitions:
      - from: PLANNING
        to: FIELDWORK
        trigger: POST /api/audit-engagements/{id}/commence-fieldwork
        actor: Controller
        preconditions:
          - "Engagement must be in PLANNING (ERR_ENGAGEMENT_NOT_IN_PLANNING)"
          - "At least one Location must exist for the engagement (ERR_NO_LOCATIONS_DEFINED)"
        side_effects: []

      - from: FIELDWORK
        to: FIELDWORK_COMPLETE
        trigger: POST /api/audit-engagements/{id}/complete-fieldwork
        actor: ExternalAuditor
        preconditions:
          - "Engagement must be in FIELDWORK (ERR_ENGAGEMENT_NOT_IN_FIELDWORK)"
          - "All PBCRequest with status IN {OPEN, IN_PROGRESS, SUBMITTED, REJECTED} must be empty (ERR_UNRESOLVED_PBC_REQUESTS)"
          - "All AuditorQuery with status IN {OPEN, AWAITING_CLIENT, ESCALATED} must be empty (ERR_UNRESOLVED_QUERIES)"
        side_effects:
          - "posture recomputed → CLOSING"

      - from: FIELDWORK_COMPLETE
        to: REPORT_ISSUED
        trigger: POST /api/audit-engagements/{id}/issue-report
        actor: ExternalAuditor
        preconditions:
          - "Engagement must be in FIELDWORK_COMPLETE (ERR_ENGAGEMENT_NOT_CLOSING)"
          - "RepresentationLetter.status == SIGNED (ERR_REP_LETTER_NOT_SIGNED)"
          - "passed_adjustment_total_cents < materiality_cents (ERR_PASSED_ADJUSTMENTS_EXCEED_MATERIALITY)"
        side_effects:
          - "posture recomputed → LOCKED"

      - from: PLANNING
        to: CANCELLED
        trigger: POST /api/audit-engagements/{id}/cancel
        actor: Controller
        preconditions:
          - "Engagement must be in PLANNING or FIELDWORK (ERR_ENGAGEMENT_NOT_CANCELLABLE)"
        side_effects:
          - "All non-terminal PBCRequest → FROZEN"
          - "All PENDING_REVIEW EvidenceUpload → INVALIDATED"
          - "All non-terminal SamplingRequest → CANCELLED"
          - "All SCHEDULED FieldworkVisit → CANCELLED"
          - "All PROPOSED AuditAdjustment → REJECTED with disposition_rationale='ENGAGEMENT_CANCELLED'"
          - "All PROPOSED FeeChangeRequest → WITHDRAWN"

      - from: FIELDWORK
        to: CANCELLED
        trigger: POST /api/audit-engagements/{id}/cancel
        actor: Controller
        preconditions:
          - "Engagement must be in PLANNING or FIELDWORK (ERR_ENGAGEMENT_NOT_CANCELLABLE)"
        side_effects:
          - "Same cascade as PLANNING → CANCELLED"

  - entity: PBCRequest
    initial_state: OPEN
    terminal_states: [ACCEPTED, FROZEN]
    transitions:
      - from: OPEN
        to: IN_PROGRESS
        trigger: POST /api/pbc-requests/{id}/evidence-uploads
        actor: Preparer
        preconditions:
          - "PBCRequest must be in OPEN or REJECTED (ERR_PBC_NOT_OPEN_FOR_UPLOAD)"
          - "Engagement.status must be FIELDWORK (ERR_ENGAGEMENT_NOT_IN_FIELDWORK)"
          - "Engagement.posture must be OPEN (ERR_ENGAGEMENT_POSTURE_LOCKED)"
          - "X-User-ID must equal PBCRequest.owner_user_id (ERR_NOT_REQUEST_OWNER)"
        side_effects:
          - "EvidenceUpload created with status PENDING_REVIEW, version_seq = (max existing version_seq for this PBCRequest) + 1"
          - "PBCRequest.rejection_count unchanged"

      - from: IN_PROGRESS
        to: SUBMITTED
        trigger: POST /api/pbc-requests/{id}/submit
        actor: Preparer
        preconditions:
          - "PBCRequest must be in IN_PROGRESS (ERR_PBC_NOT_SUBMITTABLE)"
          - "X-User-ID must equal PBCRequest.owner_user_id (ERR_NOT_REQUEST_OWNER)"
          - "At least one EvidenceUpload with status == PENDING_REVIEW exists for this PBCRequest (ERR_NO_PENDING_EVIDENCE)"
        side_effects: []

      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /api/pbc-requests/{id}/review
        actor: ExternalAuditor
        preconditions:
          - "PBCRequest must be in SUBMITTED (ERR_PBC_NOT_UNDER_REVIEW)"
          - "Payload decision == 'ACCEPT'"
        side_effects:
          - "All EvidenceUpload with status == PENDING_REVIEW → ACCEPTED"
          - "All prior EvidenceUpload with status == ACCEPTED → SUPERSEDED (keep the latest only)"
          - "PBCRequest.current_evidence_id set to the latest ACCEPTED EvidenceUpload.id"
          - "PBCRequest.rejection_count reset to 0"
          - "Engagement.open_pbc_count decremented by 1"

      - from: SUBMITTED
        to: REJECTED
        trigger: POST /api/pbc-requests/{id}/review
        actor: ExternalAuditor
        preconditions:
          - "PBCRequest must be in SUBMITTED (ERR_PBC_NOT_UNDER_REVIEW)"
          - "Payload decision == 'REJECT'"
        side_effects:
          - "All EvidenceUpload with status == PENDING_REVIEW → REJECTED"
          - "PBCRequest.rejection_count incremented by 1"

      - from: REJECTED
        to: IN_PROGRESS
        trigger: POST /api/pbc-requests/{id}/evidence-uploads
        actor: Preparer
        preconditions:
          - "PBCRequest must be in OPEN or REJECTED (ERR_PBC_NOT_OPEN_FOR_UPLOAD)"
          - "Engagement.status must be FIELDWORK (ERR_ENGAGEMENT_NOT_IN_FIELDWORK)"
          - "Engagement.posture must be OPEN (ERR_ENGAGEMENT_POSTURE_LOCKED)"
          - "X-User-ID must equal PBCRequest.owner_user_id (ERR_NOT_REQUEST_OWNER)"
        side_effects:
          - "Same as OPEN → IN_PROGRESS"

      - from: OPEN
        to: FROZEN
        trigger: "system (cascade from AuditEngagement CANCELLED or RepresentationLetter SIGNED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: FROZEN
        trigger: "system (cascade from AuditEngagement CANCELLED or RepresentationLetter SIGNED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: FROZEN
        trigger: "system (cascade from AuditEngagement CANCELLED or RepresentationLetter SIGNED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: REJECTED
        to: FROZEN
        trigger: "system (cascade from AuditEngagement CANCELLED or RepresentationLetter SIGNED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EvidenceUpload
    initial_state: PENDING_REVIEW
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED, INVALIDATED]
    transitions:
      - from: PENDING_REVIEW
        to: ACCEPTED
        trigger: "system (cascade from PBCRequest review ACCEPT)"
        actor: system
        preconditions: []
        side_effects:
          - "Earlier ACCEPTED uploads for same PBCRequest → SUPERSEDED"
          - "PBCRequest.current_evidence_id updated"

      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "system (cascade from PBCRequest review REJECT)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system (when a later upload for the same PBCRequest is ACCEPTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING_REVIEW
        to: INVALIDATED
        trigger: "system (cascade from AuditEngagement CANCELLED or RepresentationLetter SIGNED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AuditorQuery
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: AWAITING_CLIENT
        trigger: POST /api/queries/{id}/route-to-client
        actor: ExternalAuditor
        preconditions:
          - "AuditorQuery must be in OPEN (ERR_QUERY_NOT_OPEN)"
        side_effects: []

      - from: AWAITING_CLIENT
        to: RESPONDED
        trigger: POST /api/queries/{id}/respond
        actor: Preparer
        preconditions:
          - "AuditorQuery must be in AWAITING_CLIENT (ERR_QUERY_NOT_AWAITING_CLIENT)"
          - "If AuditorQuery.pbc_request_id is set, X-User-ID must equal PBCRequest.owner_user_id (ERR_NOT_REQUEST_OWNER)"
        side_effects:
          - "responded_at set to current logical-clock UTC"
          - "turnaround_hours computed as ceil((responded_at - raised_at)/3600)"

      - from: RESPONDED
        to: CLOSED
        trigger: POST /api/queries/{id}/close
        actor: ExternalAuditor
        preconditions:
          - "AuditorQuery must be in RESPONDED or ESCALATED (ERR_QUERY_NOT_CLOSABLE)"
        side_effects:
          - "Engagement.open_query_count decremented by 1"

      - from: OPEN
        to: ESCALATED
        trigger: POST /api/queries/{id}/escalate
        actor: ExternalAuditor
        preconditions:
          - "AuditorQuery must be in OPEN or AWAITING_CLIENT (ERR_QUERY_NOT_OPEN)"
        side_effects: []

      - from: AWAITING_CLIENT
        to: ESCALATED
        trigger: POST /api/queries/{id}/escalate
        actor: ExternalAuditor
        preconditions:
          - "AuditorQuery must be in OPEN or AWAITING_CLIENT (ERR_QUERY_NOT_OPEN)"
        side_effects: []

      - from: ESCALATED
        to: CLOSED
        trigger: POST /api/queries/{id}/close
        actor: ExternalAuditor
        preconditions:
          - "AuditorQuery must be in RESPONDED or ESCALATED (ERR_QUERY_NOT_CLOSABLE)"
        side_effects:
          - "Engagement.open_query_count decremented by 1"

  - entity: SamplingRequest
    initial_state: DRAFT
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: DRAFT
        to: DISPATCHED
        trigger: POST /api/sampling-requests/{id}/dispatch
        actor: ExternalAuditor
        preconditions:
          - "SamplingRequest must be in DRAFT (ERR_SAMPLING_NOT_DRAFT)"
          - "window_end must be > window_start (ERR_INVALID_SAMPLING_WINDOW)"
          - "location_ids must be non-empty (ERR_NO_SAMPLING_LOCATIONS)"
          - "For each location_id, no other DISPATCHED or IN_PROGRESS SamplingRequest on the same location with overlapping [window_start, window_end) — half-open (ERR_SAMPLING_WINDOW_OVERLAP)"
        side_effects: []

      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: POST /api/sampling-requests/{id}/start
        actor: Preparer
        preconditions:
          - "SamplingRequest must be in DISPATCHED (ERR_SAMPLING_NOT_DISPATCHED)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETE
        trigger: POST /api/sampling-requests/{id}/complete
        actor: Preparer
        preconditions:
          - "SamplingRequest must be in IN_PROGRESS (ERR_SAMPLING_NOT_IN_PROGRESS)"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: POST /api/sampling-requests/{id}/cancel
        actor: ExternalAuditor
        preconditions:
          - "SamplingRequest must be in DRAFT, DISPATCHED, or IN_PROGRESS (ERR_SAMPLING_NOT_CANCELLABLE)"
        side_effects: []

      - from: DISPATCHED
        to: CANCELLED
        trigger: POST /api/sampling-requests/{id}/cancel
        actor: ExternalAuditor
        preconditions:
          - "SamplingRequest must be in DRAFT, DISPATCHED, or IN_PROGRESS"
        side_effects: []

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: POST /api/sampling-requests/{id}/cancel
        actor: ExternalAuditor
        preconditions:
          - "SamplingRequest must be in DRAFT, DISPATCHED, or IN_PROGRESS"
        side_effects: []

  - entity: FieldworkVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: POST /api/fieldwork-visits/{id}/complete
        actor: ExternalAuditor
        preconditions:
          - "FieldworkVisit must be in SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /api/fieldwork-visits/{id}/cancel
        actor: ExternalAuditor
        preconditions:
          - "FieldworkVisit must be in SCHEDULED (ERR_VISIT_NOT_SCHEDULED)"
        side_effects: []

  - entity: AuditAdjustment
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, REJECTED, PASSED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: POST /api/adjustments/{id}/disposition
        actor: Controller
        preconditions:
          - "AuditAdjustment must be in PROPOSED (ERR_ADJUSTMENT_NOT_PROPOSED)"
          - "Payload disposition == 'ACCEPT'"
          - "Engagement.posture must NOT be LOCKED (ERR_ENGAGEMENT_POSTURE_LOCKED)"
        side_effects:
          - "disposition_by_user_id = X-User-ID"
          - "disposition_rationale = payload rationale if provided, else null"

      - from: PROPOSED
        to: REJECTED
        trigger: POST /api/adjustments/{id}/disposition
        actor: Controller
        preconditions:
          - "AuditAdjustment must be in PROPOSED (ERR_ADJUSTMENT_NOT_PROPOSED)"
          - "Payload disposition == 'REJECT'"
          - "Payload rationale must be present (ERR_RATIONALE_REQUIRED)"
          - "Engagement.posture must NOT be LOCKED (ERR_ENGAGEMENT_POSTURE_LOCKED)"
        side_effects:
          - "disposition_by_user_id = X-User-ID"
          - "disposition_rationale = payload rationale"

      - from: PROPOSED
        to: PASSED
        trigger: POST /api/adjustments/{id}/disposition
        actor: Controller
        preconditions:
          - "AuditAdjustment must be in PROPOSED (ERR_ADJUSTMENT_NOT_PROPOSED)"
          - "Payload disposition == 'PASS'"
          - "Payload rationale must be present (ERR_RATIONALE_REQUIRED)"
          - "Engagement.posture must NOT be LOCKED (ERR_ENGAGEMENT_POSTURE_LOCKED)"
        side_effects:
          - "disposition_by_user_id = X-User-ID"
          - "disposition_rationale = payload rationale"
          - "Engagement.passed_adjustment_total_cents incremented by amount_cents"

  - entity: RepresentationLetter
    initial_state: DRAFT
    terminal_states: [SIGNED]
    transitions:
      - from: DRAFT
        to: PENDING_SIGNATURE
        trigger: POST /api/representation-letters/{id}/submit
        actor: Preparer
        preconditions:
          - "RepresentationLetter must be in DRAFT (ERR_REP_LETTER_NOT_DRAFT)"
          - "Engagement.status must be FIELDWORK_COMPLETE (ERR_ENGAGEMENT_NOT_CLOSING)"
        side_effects:
          - "prepared_by_user_id = X-User-ID"

      - from: PENDING_SIGNATURE
        to: SIGNED
        trigger: POST /api/representation-letters/{id}/sign
        actor: Controller
        preconditions:
          - "RepresentationLetter must be in PENDING_SIGNATURE (ERR_REP_LETTER_NOT_PENDING)"
          - "X-User-ID must NOT equal RepresentationLetter.prepared_by_user_id (ERR_REP_LETTER_SOD_VIOLATION)"
        side_effects:
          - "signed_by_user_id = X-User-ID"
          - "signed_at set to current logical-clock UTC"
          - "Engagement.posture recomputed → LOCKED"
          - "Cascade: All PBCRequest with status IN {OPEN, IN_PROGRESS, SUBMITTED, REJECTED} → FROZEN"
          - "Cascade: All EvidenceUpload with status == PENDING_REVIEW → INVALIDATED"
          - "Cascade: All FeeChangeRequest with status == PROPOSED → WITHDRAWN"

  - entity: FeeChangeRequest
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: POST /api/fee-change-requests/{id}/resolve
        actor: Controller
        preconditions:
          - "FeeChangeRequest must be in PROPOSED (ERR_FEE_CHANGE_NOT_PROPOSED)"
          - "Payload decision == 'APPROVE'"
          - "If proposed_by_role == CONTROLLER_OFFICE, X-User-Role must be ExternalAuditor; if proposed_by_role == AUDITOR, X-User-Role must be Controller (counter-party approval; ERR_FEE_CHANGE_SELF_APPROVAL)"
        side_effects:
          - "Engagement.total_fee_cents incremented by delta_cents"

      - from: PROPOSED
        to: REJECTED
        trigger: POST /api/fee-change-requests/{id}/resolve
        actor: Controller
        preconditions:
          - "FeeChangeRequest must be in PROPOSED (ERR_FEE_CHANGE_NOT_PROPOSED)"
          - "Payload decision == 'REJECT'"
        side_effects: []

      - from: PROPOSED
        to: WITHDRAWN
        trigger: POST /api/fee-change-requests/{id}/withdraw
        actor: Controller
        preconditions:
          - "FeeChangeRequest must be in PROPOSED (ERR_FEE_CHANGE_NOT_PROPOSED)"
          - "X-User-Role must match the original proposer role (ERR_FEE_CHANGE_NOT_PROPOSER)"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: pbc-upload-stale-engagement
    parent_entity: AuditEngagement
    write_endpoint: "POST /api/pbc-requests/{id}/evidence-uploads"
    occ_field: "expected_engagement_version"
    description: |
      Uploading evidence against an AuditEngagement whose version has advanced
      since the client last observed it is rejected. The transition chain from
      rep-letter signing or engagement cancel silently bumps engagement.version
      and cascades freeze/invalidate; a client holding a stale view must not
      attach new evidence to a state it no longer understands.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

  - rule_id: rep-letter-sign-stale-engagement
    parent_entity: AuditEngagement
    write_endpoint: "POST /api/representation-letters/{id}/sign"
    occ_field: "expected_engagement_version"
    description: |
      Signing a RepresentationLetter against an AuditEngagement whose version
      has advanced since the client last observed it is rejected. The sign
      transition cascades LOCKED posture and freezes all open PBCRequests;
      the signer must have observed the latest engagement state.
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: engagement_total_fee
    trigger: "FeeChangeRequest resolution APPROVE, AuditEngagement creation"
    algorithm: aggregation
    formula: |
      engagement.total_fee_cents =
        engagement.base_fee_cents
        + sum(FeeChangeRequest.delta_cents
              WHERE FeeChangeRequest.engagement_id == engagement.id
                AND FeeChangeRequest.status == APPROVED)
    input_set: "FeeChangeRequest rows for this engagement with status == APPROVED only; PROPOSED / REJECTED / WITHDRAWN excluded"
    precision: "integer cents; no rounding"
    variants:
      - name: provisional_total_fee
        when: "Read on GET engagement while FeeChangeRequest rows are still PROPOSED"
        difference: |
          Provisional = base_fee_cents + sum(delta_cents WHERE status IN {PROPOSED, APPROVED}).
          Produces a forward-looking estimate; differs from base+APPROVED whenever
          any PROPOSED fee change exists.
      - name: final_total_fee
        when: "Read on GET engagement when no PROPOSED fee changes remain"
        difference: "Equals base + APPROVED; identical to base formula"

  - name: passed_adjustment_materiality_check
    trigger: "AuditAdjustment disposition PASS, AuditEngagement.issue-report precondition"
    algorithm: threshold
    formula: |
      Let P = engagement.passed_adjustment_total_cents
            = sum(AuditAdjustment.amount_cents
                  WHERE engagement_id == engagement.id AND disposition == PASSED)
      Let T = engagement.materiality_cents
      Issue-report precondition: P < T   (strictly less-than; P == T REJECTS)
      Adjustment disposition PASS precondition: (P + new.amount_cents) allowed unconditionally;
        threshold check happens only at issue-report time.
    input_set: "AuditAdjustment rows with disposition == PASSED only; PROPOSED / ACCEPTED / REJECTED excluded"
    constants:
      BOUNDARY_OPERATOR: "strict_less_than"
    precision: "integer cents; no rounding"
    variants:
      - name: per_location_materiality_check
        when: "When a SamplingRequest is dispatched against a set of locations, each location's exposure is measured against Location.materiality_cents"
        difference: |
          Uses Location.materiality_cents (not engagement-level), and applies
          operator <= (less-than-or-equal): dispatch allowed while per-location
          passed total <= location materiality. Different operator and different
          threshold source.

  - name: query_turnaround_hours
    trigger: "AuditorQuery.respond"
    algorithm: chronological
    formula: |
      elapsed_seconds = iso8601_to_epoch(query.responded_at) - iso8601_to_epoch(query.raised_at)
      turnaround_hours = ceil(elapsed_seconds / 3600)
      Boundary: an exactly-on-the-hour gap (e.g. 7200 s) returns 2, not 3.
    input_set: "single AuditorQuery being responded"
    precision: "integer hours, ceiling; exact-on-the-hour returns the hour count, not hour+1"

  - name: pbc_aging_score
    trigger: "GET /api/pbc-requests list response"
    algorithm: weighted_scoring
    formula: |
      Evaluation order is PINNED (resolves circular-looking dependency):
        Step 1: recency_days = max(0, days_between(latest_evidence.uploaded_at, now()))
                If no evidence exists yet, use days_between(pbc.created_at, now()).
        Step 2: freshness = 1 / (1 + recency_days)          # in (0, 1]
        Step 3: backlog_multiplier = 1 + 0.1 * engagement.open_query_count
        Step 4: pbc_aging_score = round(100 * (1 - freshness) * backlog_multiplier, 2)
      Note: backlog_multiplier depends on open_query_count, which is itself derived
      from queries; we pin that open_query_count is read at Step 3 from the
      CURRENT engagement row (not recomputed inside the formula).
    input_set: "PBCRequest with status IN {OPEN, IN_PROGRESS, SUBMITTED, REJECTED}; uses current logical clock for now()"
    precision: "2 decimal places, round_half_up"

  - name: sampling_window_overlap_check
    trigger: "SamplingRequest.dispatch"
    algorithm: interval_merge
    formula: |
      For each location_id in payload.location_ids:
        existing = SamplingRequest WHERE engagement_id == this.engagement_id
                   AND status IN {DISPATCHED, IN_PROGRESS}
                   AND location_id IN this.location_ids
        overlap if:  new.window_start < existing.window_end
                 AND existing.window_start < new.window_end
        # Half-open [start, end): touching endpoints (new.start == existing.end)
        # do NOT overlap.
    input_set: "SamplingRequest rows for the engagement in DISPATCHED or IN_PROGRESS status only; DRAFT / COMPLETE / CANCELLED excluded"

  - name: fieldwork_visit_overlap_check
    trigger: "FieldworkVisit create"
    algorithm: interval_merge
    formula: |
      For the same auditor_user_id:
        existing = FieldworkVisit WHERE auditor_user_id == new.auditor_user_id
                   AND status == SCHEDULED
        overlap if:  new.visit_start <= existing.visit_end
                 AND existing.visit_start <= new.visit_end
        # Closed intervals [start, end]: adjacent days DO overlap if they share a date.
      Additionally, a 1-day buffer is required between visits by the same auditor:
        reject if 0 < gap_days < 1 where gap_days = days_between(existing.visit_end, new.visit_start)
        when new starts after existing ends. Equivalently, new.visit_start must be at
        least 1 day after every existing.visit_end for the same auditor.
    input_set: "FieldworkVisit rows for the same auditor_user_id in SCHEDULED status only"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role must be permitted for this endpoint per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path-template resource IDs must exist, validated left-to-right"
    error_id: "ERR_ENGAGEMENT_NOT_FOUND | ERR_PBC_NOT_FOUND | ERR_EVIDENCE_NOT_FOUND | ERR_QUERY_NOT_FOUND | ERR_SAMPLING_NOT_FOUND | ERR_VISIT_NOT_FOUND | ERR_ADJUSTMENT_NOT_FOUND | ERR_REP_LETTER_NOT_FOUND | ERR_FEE_CHANGE_NOT_FOUND | ERR_LOCATION_NOT_FOUND"
    http_status: 404
    applies_to: all nested endpoints

  - priority: 4
    category: state
    check: "Engagement posture must NOT be LOCKED for any state-mutating endpoint except issue-report and read endpoints"
    error_id: ERR_ENGAGEMENT_POSTURE_LOCKED
    http_status: 409
    applies_to: "POST /api/pbc-requests, POST /api/pbc-requests/{id}/evidence-uploads, POST /api/pbc-requests/{id}/submit, POST /api/pbc-requests/{id}/review, POST /api/queries, POST /api/sampling-requests, POST /api/fieldwork-visits, POST /api/adjustments, POST /api/adjustments/{id}/disposition, POST /api/fee-change-requests, POST /api/representation-letters, POST /api/representation-letters/{id}/submit"

  - priority: 5
    category: state
    check: "Target resource must be in the required state for this transition"
    error_id: "ERR_PBC_NOT_OPEN_FOR_UPLOAD | ERR_PBC_NOT_SUBMITTABLE | ERR_PBC_NOT_UNDER_REVIEW | ERR_QUERY_NOT_OPEN | ERR_QUERY_NOT_AWAITING_CLIENT | ERR_QUERY_NOT_CLOSABLE | ERR_SAMPLING_NOT_DRAFT | ERR_SAMPLING_NOT_DISPATCHED | ERR_SAMPLING_NOT_IN_PROGRESS | ERR_SAMPLING_NOT_CANCELLABLE | ERR_VISIT_NOT_SCHEDULED | ERR_ADJUSTMENT_NOT_PROPOSED | ERR_REP_LETTER_NOT_DRAFT | ERR_REP_LETTER_NOT_PENDING | ERR_FEE_CHANGE_NOT_PROPOSED | ERR_ENGAGEMENT_NOT_IN_PLANNING | ERR_ENGAGEMENT_NOT_IN_FIELDWORK | ERR_ENGAGEMENT_NOT_CLOSING | ERR_ENGAGEMENT_NOT_CANCELLABLE"
    http_status: 409
    applies_to: "State transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: RepresentationLetter signer must differ from prepared_by_user_id"
    error_id: ERR_REP_LETTER_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /api/representation-letters/{id}/sign"

  - priority: 7
    category: business_safety
    check: "Counter-party approval: FeeChangeRequest must be resolved by the opposite party from proposer"
    error_id: ERR_FEE_CHANGE_SELF_APPROVAL
    http_status: 403
    applies_to: "POST /api/fee-change-requests/{id}/resolve"

  - priority: 8
    category: business_referential
    check: "Owner identity: X-User-ID must equal PBCRequest.owner_user_id for upload/submit; if AuditorQuery.pbc_request_id is set, responder must equal that PBCRequest.owner_user_id"
    error_id: ERR_NOT_REQUEST_OWNER
    http_status: 403
    applies_to: "POST /api/pbc-requests/{id}/evidence-uploads, POST /api/pbc-requests/{id}/submit, POST /api/queries/{id}/respond"

  - priority: 9
    category: business_constraint
    check: "Field shape: file_size_bytes in (0, MAX_EVIDENCE_BYTES]; sha256 matches 64-hex; window_end > window_start; sample_size >= 1; amount_cents > 0; delta_cents != 0; location_ids non-empty; visit_end >= visit_start"
    error_id: "ERR_INVALID_EVIDENCE_FILE | ERR_INVALID_HASH | ERR_INVALID_SAMPLING_WINDOW | ERR_INVALID_SAMPLE_SIZE | ERR_INVALID_ADJUSTMENT_AMOUNT | ERR_INVALID_FEE_DELTA | ERR_NO_SAMPLING_LOCATIONS | ERR_INVALID_VISIT_WINDOW"
    http_status: 400
    applies_to: "Resource-creation POST endpoints"

  - priority: 10
    category: business_constraint
    check: "Sampling window overlap on the same location (half-open)"
    error_id: ERR_SAMPLING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/sampling-requests/{id}/dispatch"

  - priority: 11
    category: business_constraint
    check: "Fieldwork visit overlap for the same auditor (closed intervals + 1-day buffer)"
    error_id: ERR_VISIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /api/fieldwork-visits"

  - priority: 12
    category: business_fiscal
    check: "Issue-report precondition: passed_adjustment_total_cents < materiality_cents"
    error_id: ERR_PASSED_ADJUSTMENTS_EXCEED_MATERIALITY
    http_status: 402
    applies_to: "POST /api/audit-engagements/{id}/issue-report"

  - priority: 13
    category: business_fiscal
    check: "Fee resolution precondition: engagement.total_fee_cents + delta_cents must remain > 0"
    error_id: ERR_FEE_WOULD_GO_NONPOSITIVE
    http_status: 402
    applies_to: "POST /api/fee-change-requests/{id}/resolve"

  - priority: 14
    category: business_temporal
    check: "Deadline alignment: PBCRequest.due_date must be on or before engagement.filing_deadline; FieldworkVisit.visit_end must be before engagement.filing_deadline"
    error_id: ERR_DEADLINE_AFTER_FILING
    http_status: 422
    applies_to: "POST /api/pbc-requests, POST /api/fieldwork-visits"

  - priority: 15
    category: business_temporal
    check: "OCC: expected_engagement_version must match current engagement.version"
    error_id: ERR_STALE_ENGAGEMENT_VERSION
    http_status: 412
    applies_to: "POST /api/pbc-requests/{id}/evidence-uploads, POST /api/representation-letters/{id}/sign"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock to an arbitrary ISO8601 UTC instant. Server boots with logical clock pinned to 2026-08-01T00:00:00Z; this endpoint MUST be used to advance time for any deadline/aging test. The default sits at or before every fixture date."
    roles: [Controller]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: ["logical clock advanced"]

  # --- AuditEngagement ---
  - method: POST
    path: "/api/audit-engagements"
    description: "Create a new audit engagement"
    roles: [Controller]
    code: 201
    input: [client_name, fiscal_year_end, base_fee_cents, materiality_cents, filing_deadline]
    output: AuditEngagement
    side_effects:
      - "status = PLANNING"
      - "total_fee_cents = base_fee_cents"
      - "open_pbc_count = 0"
      - "open_query_count = 0"
      - "passed_adjustment_total_cents = 0"
      - "posture = OPEN"

  - method: GET
    path: "/api/audit-engagements"
    description: "List engagements (paginated)"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuditEngagement[]"
    side_effects: []

  - method: GET
    path: "/api/audit-engagements/{id}"
    description: "Get one engagement"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: []

  - method: POST
    path: "/api/audit-engagements/{id}/commence-fieldwork"
    description: "Transition engagement PLANNING -> FIELDWORK"
    roles: [Controller]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: ["status → FIELDWORK"]

  - method: POST
    path: "/api/audit-engagements/{id}/complete-fieldwork"
    description: "Transition engagement FIELDWORK -> FIELDWORK_COMPLETE; requires zero unresolved PBC requests and zero unresolved queries"
    roles: [ExternalAuditor]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: ["status → FIELDWORK_COMPLETE", "posture → CLOSING"]

  - method: POST
    path: "/api/audit-engagements/{id}/issue-report"
    description: "Issue final audit report; requires signed rep letter and passed-adjustment total strictly below materiality"
    roles: [ExternalAuditor]
    code: 200
    input: []
    output: AuditEngagement
    side_effects: ["status → REPORT_ISSUED", "posture → LOCKED"]

  - method: POST
    path: "/api/audit-engagements/{id}/cancel"
    description: "Cancel engagement (PLANNING or FIELDWORK only); cascades to children"
    roles: [Controller]
    code: 200
    input: []
    output: AuditEngagement
    side_effects:
      - "status → CANCELLED"
      - "Cascade freeze/invalidate/withdraw per state machine"

  # --- Location ---
  - method: POST
    path: "/api/locations"
    description: "Register an audit location"
    roles: [Controller]
    code: 201
    input: [engagement_id, location_code, name, materiality_cents]
    output: Location
    side_effects: []

  - method: GET
    path: "/api/locations"
    description: "List locations; supports filter by engagement_id"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "engagement_id?"]
    output: "Location[]"
    side_effects: []

  - method: GET
    path: "/api/locations/{id}"
    description: "Get a location"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: []
    output: Location
    side_effects: []

  # --- PBCRequest ---
  - method: POST
    path: "/api/pbc-requests"
    description: "Add a PBC request to an engagement"
    roles: [ExternalAuditor]
    code: 201
    input: [engagement_id, title, owner_user_id, due_date]
    output: PBCRequest
    side_effects:
      - "status = OPEN"
      - "rejection_count = 0"
      - "Engagement.open_pbc_count incremented by 1"

  - method: GET
    path: "/api/pbc-requests"
    description: "List PBC requests with optional filters"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "engagement_id?", "status?"]
    output: "PBCRequest[]"
    side_effects: []

  - method: GET
    path: "/api/pbc-requests/{id}"
    description: "Get one PBC request"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: []
    output: PBCRequest
    side_effects: []

  - method: POST
    path: "/api/pbc-requests/{id}/submit"
    description: "Mark PBC as submitted for auditor review"
    roles: [Preparer]
    code: 200
    input: []
    output: PBCRequest
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/api/pbc-requests/{id}/review"
    description: "Auditor accept/reject decision; cascades evidence status"
    roles: [ExternalAuditor]
    code: 200
    input: [decision, "rationale?"]
    output: PBCRequest
    side_effects:
      - "status → ACCEPTED | REJECTED"
      - "Evidence status cascade per state machine"
      - "Engagement.open_pbc_count updated on ACCEPT"

  # --- EvidenceUpload ---
  - method: POST
    path: "/api/pbc-requests/{id}/evidence-uploads"
    description: "Upload a new evidence version for a PBC request; OCC-guarded on engagement.version"
    roles: [Preparer]
    code: 201
    input: [file_name, file_size_bytes, sha256, expected_engagement_version]
    output: EvidenceUpload
    side_effects:
      - "EvidenceUpload created PENDING_REVIEW, version_seq incremented"
      - "PBCRequest status → IN_PROGRESS"
      - "increments AuditEngagement.version by 1"

  - method: GET
    path: "/api/evidence-uploads"
    description: "List evidence uploads; filterable by pbc_request_id or engagement_id"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "pbc_request_id?", "engagement_id?", "status?"]
    output: "EvidenceUpload[]"
    side_effects: []

  - method: GET
    path: "/api/evidence-uploads/{id}"
    description: "Get one evidence upload"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: []
    output: EvidenceUpload
    side_effects: []

  # --- AuditorQuery ---
  - method: POST
    path: "/api/queries"
    description: "Auditor raises a query"
    roles: [ExternalAuditor]
    code: 201
    input: [engagement_id, subject, severity, "pbc_request_id?"]
    output: AuditorQuery
    side_effects:
      - "status = OPEN"
      - "raised_at = logical clock now"
      - "Engagement.open_query_count incremented by 1"

  - method: GET
    path: "/api/queries"
    description: "List queries"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "engagement_id?", "status?"]
    output: "AuditorQuery[]"
    side_effects: []

  - method: GET
    path: "/api/queries/{id}"
    description: "Get one query"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: []
    output: AuditorQuery
    side_effects: []

  - method: POST
    path: "/api/queries/{id}/route-to-client"
    description: "Route query to client for response"
    roles: [ExternalAuditor]
    code: 200
    input: []
    output: AuditorQuery
    side_effects: ["status → AWAITING_CLIENT"]

  - method: POST
    path: "/api/queries/{id}/respond"
    description: "Client responds to query"
    roles: [Preparer]
    code: 200
    input: [response_text]
    output: AuditorQuery
    side_effects:
      - "status → RESPONDED"
      - "responded_at = logical clock now"
      - "turnaround_hours computed"

  - method: POST
    path: "/api/queries/{id}/escalate"
    description: "Escalate an open or awaiting-client query"
    roles: [ExternalAuditor]
    code: 200
    input: []
    output: AuditorQuery
    side_effects: ["status → ESCALATED"]

  - method: POST
    path: "/api/queries/{id}/close"
    description: "Close a responded or escalated query"
    roles: [ExternalAuditor]
    code: 200
    input: []
    output: AuditorQuery
    side_effects:
      - "status → CLOSED"
      - "Engagement.open_query_count decremented by 1"

  # --- SamplingRequest ---
  - method: POST
    path: "/api/sampling-requests"
    description: "Create a sampling request"
    roles: [ExternalAuditor]
    code: 201
    input: [engagement_id, title, location_ids, window_start, window_end, sample_size]
    output: SamplingRequest
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/api/sampling-requests"
    description: "List sampling requests"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "engagement_id?", "status?"]
    output: "SamplingRequest[]"
    side_effects: []

  - method: GET
    path: "/api/sampling-requests/{id}"
    description: "Get one sampling request"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: []
    output: SamplingRequest
    side_effects: []

  - method: POST
    path: "/api/sampling-requests/{id}/dispatch"
    description: "Dispatch a sampling request (overlap check on each location)"
    roles: [ExternalAuditor]
    code: 200
    input: []
    output: SamplingRequest
    side_effects: ["status → DISPATCHED"]

  - method: POST
    path: "/api/sampling-requests/{id}/start"
    description: "Mark sampling in progress"
    roles: [Preparer]
    code: 200
    input: []
    output: SamplingRequest
    side_effects: ["status → IN_PROGRESS"]

  - method: POST
    path: "/api/sampling-requests/{id}/complete"
    description: "Mark sampling complete"
    roles: [Preparer]
    code: 200
    input: []
    output: SamplingRequest
    side_effects: ["status → COMPLETE"]

  - method: POST
    path: "/api/sampling-requests/{id}/cancel"
    description: "Cancel a sampling request"
    roles: [ExternalAuditor]
    code: 200
    input: []
    output: SamplingRequest
    side_effects: ["status → CANCELLED"]

  # --- FieldworkVisit ---
  - method: POST
    path: "/api/fieldwork-visits"
    description: "Schedule a fieldwork visit"
    roles: [ExternalAuditor]
    code: 201
    input: [engagement_id, auditor_user_id, location_id, visit_start, visit_end]
    output: FieldworkVisit
    side_effects: ["status = SCHEDULED"]

  - method: GET
    path: "/api/fieldwork-visits"
    description: "List fieldwork visits"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "engagement_id?", "location_id?", "status?"]
    output: "FieldworkVisit[]"
    side_effects: []

  - method: GET
    path: "/api/fieldwork-visits/{id}"
    description: "Get one fieldwork visit"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: []
    output: FieldworkVisit
    side_effects: []

  - method: POST
    path: "/api/fieldwork-visits/{id}/complete"
    description: "Mark visit completed"
    roles: [ExternalAuditor]
    code: 200
    input: []
    output: FieldworkVisit
    side_effects: ["status → COMPLETED"]

  - method: POST
    path: "/api/fieldwork-visits/{id}/cancel"
    description: "Cancel visit"
    roles: [ExternalAuditor]
    code: 200
    input: []
    output: FieldworkVisit
    side_effects: ["status → CANCELLED"]

  # --- AuditAdjustment ---
  - method: POST
    path: "/api/adjustments"
    description: "Auditor proposes an adjustment"
    roles: [ExternalAuditor]
    code: 201
    input: [engagement_id, description, amount_cents, direction]
    output: AuditAdjustment
    side_effects: ["disposition = PROPOSED"]

  - method: GET
    path: "/api/adjustments"
    description: "List adjustments (incl. passed-adjustment schedule)"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "engagement_id?", "disposition?"]
    output: "AuditAdjustment[]"
    side_effects: []

  - method: GET
    path: "/api/adjustments/{id}"
    description: "Get one adjustment"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: []
    output: AuditAdjustment
    side_effects: []

  - method: POST
    path: "/api/adjustments/{id}/disposition"
    description: "Controller dispositions a proposed adjustment"
    roles: [Controller]
    code: 200
    input: [disposition, "rationale?"]
    output: AuditAdjustment
    side_effects:
      - "disposition → ACCEPTED | REJECTED | PASSED"
      - "If PASSED: Engagement.passed_adjustment_total_cents incremented"

  # --- RepresentationLetter ---
  - method: POST
    path: "/api/representation-letters"
    description: "Create draft representation letter (1:1 per engagement)"
    roles: [Preparer]
    code: 201
    input: [engagement_id]
    output: RepresentationLetter
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/api/representation-letters"
    description: "List representation letters (filterable by engagement_id)"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "engagement_id?"]
    output: "RepresentationLetter[]"
    side_effects: []

  - method: GET
    path: "/api/representation-letters/{id}"
    description: "Get one representation letter"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: []
    output: RepresentationLetter
    side_effects: []

  - method: POST
    path: "/api/representation-letters/{id}/submit"
    description: "Submit draft for signature"
    roles: [Preparer]
    code: 200
    input: []
    output: RepresentationLetter
    side_effects: ["status → PENDING_SIGNATURE", "prepared_by_user_id = X-User-ID"]

  - method: POST
    path: "/api/representation-letters/{id}/sign"
    description: "Controller signs; SoD checked; OCC-guarded"
    roles: [Controller]
    code: 200
    input: [expected_engagement_version]
    output: RepresentationLetter
    side_effects:
      - "status → SIGNED"
      - "signed_by_user_id, signed_at set"
      - "Engagement posture → LOCKED"
      - "Cascade freeze/invalidate per state machine"
      - "increments AuditEngagement.version by 1"

  # --- FeeChangeRequest ---
  - method: POST
    path: "/api/fee-change-requests"
    description: "Propose a fee/scope change"
    roles: [Controller, ExternalAuditor]
    code: 201
    input: [engagement_id, scope_description, delta_cents]
    output: FeeChangeRequest
    side_effects:
      - "status = PROPOSED"
      - "proposed_by_role derived from X-User-Role (Controller → CONTROLLER_OFFICE; ExternalAuditor → AUDITOR)"

  - method: GET
    path: "/api/fee-change-requests"
    description: "List fee change requests"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: ["limit?", "offset?", "engagement_id?", "status?"]
    output: "FeeChangeRequest[]"
    side_effects: []

  - method: GET
    path: "/api/fee-change-requests/{id}"
    description: "Get one fee change request"
    roles: [Controller, Preparer, ExternalAuditor]
    code: 200
    input: []
    output: FeeChangeRequest
    side_effects: []

  - method: POST
    path: "/api/fee-change-requests/{id}/resolve"
    description: "Resolve a fee change request (counter-party only)"
    roles: [Controller, ExternalAuditor]
    code: 200
    input: [decision]
    output: FeeChangeRequest
    side_effects:
      - "status → APPROVED | REJECTED"
      - "If APPROVED: Engagement.total_fee_cents incremented by delta_cents"

  - method: POST
    path: "/api/fee-change-requests/{id}/withdraw"
    description: "Proposer withdraws a pending fee change request"
    roles: [Controller, ExternalAuditor]
    code: 200
    input: []
    output: FeeChangeRequest
    side_effects: ["status → WITHDRAWN"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # Auth
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }

  # Not found
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "AuditEngagement id not found" }
  - { id: ERR_LOCATION_NOT_FOUND, http: 404, condition: "Location id not found" }
  - { id: ERR_PBC_NOT_FOUND, http: 404, condition: "PBCRequest id not found" }
  - { id: ERR_EVIDENCE_NOT_FOUND, http: 404, condition: "EvidenceUpload id not found" }
  - { id: ERR_QUERY_NOT_FOUND, http: 404, condition: "AuditorQuery id not found" }
  - { id: ERR_SAMPLING_NOT_FOUND, http: 404, condition: "SamplingRequest id not found" }
  - { id: ERR_VISIT_NOT_FOUND, http: 404, condition: "FieldworkVisit id not found" }
  - { id: ERR_ADJUSTMENT_NOT_FOUND, http: 404, condition: "AuditAdjustment id not found" }
  - { id: ERR_REP_LETTER_NOT_FOUND, http: 404, condition: "RepresentationLetter id not found" }
  - { id: ERR_FEE_CHANGE_NOT_FOUND, http: 404, condition: "FeeChangeRequest id not found" }

  # State — engagement
  - { id: ERR_ENGAGEMENT_NOT_IN_PLANNING, http: 409, condition: "commence-fieldwork requires engagement in PLANNING" }
  - { id: ERR_ENGAGEMENT_NOT_IN_FIELDWORK, http: 409, condition: "Operation requires engagement in FIELDWORK" }
  - { id: ERR_ENGAGEMENT_NOT_CLOSING, http: 409, condition: "Operation requires engagement in FIELDWORK_COMPLETE (CLOSING posture)" }
  - { id: ERR_ENGAGEMENT_NOT_CANCELLABLE, http: 409, condition: "Cancel requires PLANNING or FIELDWORK" }
  - { id: ERR_ENGAGEMENT_POSTURE_LOCKED, http: 409, condition: "Engagement posture is LOCKED; mutating endpoint forbidden" }
  - { id: ERR_NO_LOCATIONS_DEFINED, http: 409, condition: "commence-fieldwork requires at least one Location" }
  - { id: ERR_UNRESOLVED_PBC_REQUESTS, http: 409, condition: "complete-fieldwork requires zero PBCRequests in OPEN/IN_PROGRESS/SUBMITTED/REJECTED" }
  - { id: ERR_UNRESOLVED_QUERIES, http: 409, condition: "complete-fieldwork requires zero AuditorQuery in OPEN/AWAITING_CLIENT/ESCALATED" }
  - { id: ERR_REP_LETTER_NOT_SIGNED, http: 409, condition: "issue-report requires RepresentationLetter.status == SIGNED" }

  # State — PBC / Evidence / Query / Sampling / Visit / Adjustment / RepLetter / FeeChange
  - { id: ERR_PBC_NOT_OPEN_FOR_UPLOAD, http: 409, condition: "Evidence upload requires PBCRequest in OPEN or REJECTED" }
  - { id: ERR_PBC_NOT_SUBMITTABLE, http: 409, condition: "Submit requires PBCRequest in IN_PROGRESS" }
  - { id: ERR_PBC_NOT_UNDER_REVIEW, http: 409, condition: "Review requires PBCRequest in SUBMITTED" }
  - { id: ERR_NO_PENDING_EVIDENCE, http: 409, condition: "Submit requires at least one PENDING_REVIEW EvidenceUpload" }
  - { id: ERR_QUERY_NOT_OPEN, http: 409, condition: "Operation requires AuditorQuery in OPEN or AWAITING_CLIENT (per endpoint)" }
  - { id: ERR_QUERY_NOT_AWAITING_CLIENT, http: 409, condition: "Respond requires AuditorQuery in AWAITING_CLIENT" }
  - { id: ERR_QUERY_NOT_CLOSABLE, http: 409, condition: "Close requires AuditorQuery in RESPONDED or ESCALATED" }
  - { id: ERR_SAMPLING_NOT_DRAFT, http: 409, condition: "Dispatch requires SamplingRequest in DRAFT" }
  - { id: ERR_SAMPLING_NOT_DISPATCHED, http: 409, condition: "Start requires SamplingRequest in DISPATCHED" }
  - { id: ERR_SAMPLING_NOT_IN_PROGRESS, http: 409, condition: "Complete requires SamplingRequest in IN_PROGRESS" }
  - { id: ERR_SAMPLING_NOT_CANCELLABLE, http: 409, condition: "Cancel requires SamplingRequest in DRAFT/DISPATCHED/IN_PROGRESS" }
  - { id: ERR_VISIT_NOT_SCHEDULED, http: 409, condition: "Complete/cancel requires FieldworkVisit in SCHEDULED" }
  - { id: ERR_ADJUSTMENT_NOT_PROPOSED, http: 409, condition: "Disposition requires AuditAdjustment in PROPOSED" }
  - { id: ERR_REP_LETTER_NOT_DRAFT, http: 409, condition: "Submit requires RepresentationLetter in DRAFT" }
  - { id: ERR_REP_LETTER_NOT_PENDING, http: 409, condition: "Sign requires RepresentationLetter in PENDING_SIGNATURE" }
  - { id: ERR_FEE_CHANGE_NOT_PROPOSED, http: 409, condition: "Resolve/withdraw requires FeeChangeRequest in PROPOSED" }
  - { id: ERR_RATIONALE_REQUIRED, http: 400, condition: "rationale field required when disposition is REJECT or PASS" }

  # Business — safety / SoD
  - { id: ERR_REP_LETTER_SOD_VIOLATION, http: 403, condition: "RepresentationLetter signer must differ from prepared_by_user_id" }
  - { id: ERR_FEE_CHANGE_SELF_APPROVAL, http: 403, condition: "FeeChangeRequest must be resolved by the counter-party, not the proposer" }
  - { id: ERR_FEE_CHANGE_NOT_PROPOSER, http: 403, condition: "Withdraw must be performed by the same role that proposed the FeeChangeRequest" }
  - { id: ERR_NOT_REQUEST_OWNER, http: 403, condition: "X-User-ID does not match PBCRequest.owner_user_id" }

  # Business — shape / constraint
  - { id: ERR_INVALID_EVIDENCE_FILE, http: 400, condition: "file_size_bytes out of range (0, MAX_EVIDENCE_BYTES]" }
  - { id: ERR_INVALID_HASH, http: 400, condition: "sha256 must be 64 lowercase hex characters" }
  - { id: ERR_INVALID_SAMPLING_WINDOW, http: 400, condition: "window_end must be > window_start" }
  - { id: ERR_INVALID_SAMPLE_SIZE, http: 400, condition: "sample_size must be >= 1" }
  - { id: ERR_INVALID_ADJUSTMENT_AMOUNT, http: 400, condition: "amount_cents must be > 0" }
  - { id: ERR_INVALID_FEE_DELTA, http: 400, condition: "delta_cents must be non-zero" }
  - { id: ERR_NO_SAMPLING_LOCATIONS, http: 400, condition: "location_ids array must be non-empty" }
  - { id: ERR_INVALID_VISIT_WINDOW, http: 400, condition: "visit_end must be >= visit_start" }
  - { id: ERR_SAMPLING_WINDOW_OVERLAP, http: 409, condition: "New sampling window overlaps an existing DISPATCHED/IN_PROGRESS sampling request on the same location (half-open)" }
  - { id: ERR_VISIT_WINDOW_OVERLAP, http: 409, condition: "New fieldwork visit overlaps an existing SCHEDULED visit for the same auditor (closed intervals, 1-day buffer)" }
  - { id: ERR_LOCATION_MATERIALITY_TOO_HIGH, http: 422, condition: "Location.materiality_cents must be <= engagement.materiality_cents" }

  # Business — fiscal / temporal
  - { id: ERR_PASSED_ADJUSTMENTS_EXCEED_MATERIALITY, http: 402, condition: "passed_adjustment_total_cents >= materiality_cents at issue-report" }
  - { id: ERR_FEE_WOULD_GO_NONPOSITIVE, http: 402, condition: "Resolution would push total_fee_cents <= 0" }
  - { id: ERR_DEADLINE_AFTER_FILING, http: 422, condition: "PBCRequest.due_date or FieldworkVisit.visit_end after engagement.filing_deadline" }
  - { id: ERR_STALE_ENGAGEMENT_VERSION, http: 412, condition: "expected_engagement_version does not match current engagement.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Controller
    description: "Corporate controller; owns the engagement, signs rep letters, dispositions adjustments, resolves fee changes proposed by auditor"
    identity: opaque
    exclusive_operations:
      - "POST /api/audit-engagements — create engagement"
      - "POST /api/audit-engagements/{id}/commence-fieldwork"
      - "POST /api/audit-engagements/{id}/cancel"
      - "POST /api/locations — create location"
      - "POST /api/adjustments/{id}/disposition — disposition proposed adjustment"
      - "POST /api/representation-letters/{id}/sign — sign rep letter"
      - "POST /api/_clock/set_current_utc — advance logical clock (test-driving)"
    shared_operations:
      - "POST /api/fee-change-requests — propose fee change (as CONTROLLER_OFFICE)"
      - "POST /api/fee-change-requests/{id}/resolve — resolve auditor-proposed change"
      - "POST /api/fee-change-requests/{id}/withdraw — withdraw own proposal"
      - "All GET endpoints"

  - name: Preparer
    description: "Controller-office staff member assigned as owner on PBC requests; uploads evidence, submits PBCs, responds to queries, drafts rep letter"
    identity: opaque
    exclusive_operations:
      - "POST /api/pbc-requests/{id}/evidence-uploads — upload evidence"
      - "POST /api/pbc-requests/{id}/submit"
      - "POST /api/queries/{id}/respond"
      - "POST /api/sampling-requests/{id}/start"
      - "POST /api/sampling-requests/{id}/complete"
      - "POST /api/representation-letters — create draft"
      - "POST /api/representation-letters/{id}/submit"
    shared_operations:
      - "All GET endpoints"

  - name: ExternalAuditor
    description: "External audit firm user; raises PBC requests, queries, sampling requests; proposes adjustments; reviews evidence; completes fieldwork; issues report"
    identity: opaque
    exclusive_operations:
      - "POST /api/pbc-requests — create PBC request"
      - "POST /api/pbc-requests/{id}/review — accept/reject evidence"
      - "POST /api/queries — raise query"
      - "POST /api/queries/{id}/route-to-client"
      - "POST /api/queries/{id}/escalate"
      - "POST /api/queries/{id}/close"
      - "POST /api/sampling-requests — create"
      - "POST /api/sampling-requests/{id}/dispatch"
      - "POST /api/sampling-requests/{id}/cancel"
      - "POST /api/fieldwork-visits — schedule"
      - "POST /api/fieldwork-visits/{id}/complete"
      - "POST /api/fieldwork-visits/{id}/cancel"
      - "POST /api/adjustments — propose adjustment"
      - "POST /api/audit-engagements/{id}/complete-fieldwork"
      - "POST /api/audit-engagements/{id}/issue-report"
    shared_operations:
      - "POST /api/fee-change-requests — propose fee change (as AUDITOR)"
      - "POST /api/fee-change-requests/{id}/resolve — resolve controller-proposed change"
      - "POST /api/fee-change-requests/{id}/withdraw — withdraw own proposal"
      - "All GET endpoints"
