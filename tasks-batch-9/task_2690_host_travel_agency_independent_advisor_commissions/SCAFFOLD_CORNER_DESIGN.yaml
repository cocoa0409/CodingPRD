              captures: { adv_id: $.data.id, adv_v0: $.data.version, linked_con: $.data.consortium_id }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "00000000-0000-4000-8000-000000000000", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
              captures: { err_sched: $.data.error_id }
            - call: "POST /host-agency/advisors/${adv_id}/agreements"
              payload: { split_schedule_id: "${sched_id}", effective_date: "2026-01-01", post_departure_advisor_pct: 0.50, expected_advisor_version: "${adv_v0}" }
              as: HostOperations
              captures: { agr_id: $.data.id }
            - call: "GET /host-agency/advisors"
              payload: { consortium_id: "${con_id}" }
