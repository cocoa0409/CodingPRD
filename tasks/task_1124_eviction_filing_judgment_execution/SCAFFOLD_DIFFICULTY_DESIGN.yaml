            - { call: "POST /api/tenancies", payload: { unit_id: "${u}", tenant_full_name: "T A", monthly_rent_cents: 150000, lease_start_date: "2026-01-01" }, as: Landlord, as_user_id: "${ll}", captures: { t: $.data.id } }
