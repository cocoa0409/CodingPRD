  - name: cyclic_shape_loops_the_lead_back_through_displacement_review
    claim_type: cyclic
    grounds:
    - complexity_profile.state_machine_shape
    - state_machines.Lead.QUOTED_to_DISPLACEMENT_REVIEW
    excluded_because:
      difficulty_instance: non_linear_state_machine / lead_cycles_back_to_displacement_review_on_peak_increase
      rationale: The cyclic-shape claim is the upward revise that sends a QUOTED lead back to DISPLACEMENT_REVIEW
        and forces a second study before re-proposing; the named §1.8 instance walks that loop and asserts
        the hold drop, the negotiation_round bump and the re-approval, which is strictly more than this
        row would test.
  - name: parallel_dimensions_of_room_block_advance_independently
    claim_type: parallel
    grounds:
    - complexity_profile.state_machine_shape
    - entities.RoomBlock.fields.inventory_status
    - entities.RoomBlock.fields.billing_status
    excluded_because:
      difficulty_instance: non_linear_state_machine / room_block_parallel_dimensions_advance_independently
      rationale: RoomBlock carries two orthogonal dimensions and the named §1.8 instance already drives
        inventory_status SETUP->OPEN->CUT_OFF against billing_status UNBILLED->ATTRITION_ASSESSED->SETTLED
        and asserts the combined state at each step.
  - name: cutoff_cascades_down_into_sub_blocks_and_inventory
    claim_type: cascade_down
    grounds:
    - state_machines.RoomBlock.OPEN_to_CUT_OFF
    excluded_because:
      difficulty_instance: transitive_cascade / block_cutoff_cascade_four_hops_through_sub_block_to_inventory
      rationale: The four-hop cutoff cascade (master -> sub-blocks -> BlockNight release -> InventoryDay
        committed_group_rooms) is exactly the named §1.8 instance, including the rule that a sub-block
        release moves no inventory.
  - name: cancel_compensates_every_side_effect_of_sign
    claim_type: compensation
    grounds:
    - state_machines.GroupContract.SIGNED_to_TERMINATED_FORCE_MAJEURE
    - calculations.receivable_conservation
    excluded_because:
      difficulty_instance: compensating_invariant / force_majeure_termination_returns_receivable_to_zero
      rationale: The compensation claim — undo the transition and every side effect reverses with no drift
        — is the named §1.8 instance, which asserts the receivable returns to exactly 0, both charges
        VOIDED and the block released with committed_group_rooms back to 0.
- section: calculations
  instances:
  - name: comp_designation_moves_when_an_earlier_reservation_is_cancelled
    claim_type: chronological
    grounds:
    - calculations.comp_room_entitlement
    - entities.Reservation.fields.is_comp
    - entities.Reservation.fields.rate_cents
    - state_machines.Reservation.PENDING_to_CANCELLED
    distinguishing_aspect: |
      comp_room_entitlement walks the contract's reservations in created_at ASC order and never consults id, and a cancel must re-derive the whole walk rather than patching the cancelled row. With comp_room_ratio 2 the third of four one-night reservations is the comp (floor(2/2) = 1 > 0); after the SECOND reservation is cancelled the walk shifts and the comp designation must move off the third row and onto the fourth, with rate_cents flipping both ways. An implementation that stamps is_comp once at creation keeps the comp on the third row and fails.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; the 'Comp Rich' package (comp_room_ratio 2, room_rate_discount 0.05,
        no rebate); quote base 20000 so contracted_rate_cents == 20000 - 1000 - 0 - 6667 == 12333; contract
        4/4/4 signed and the master block OPEN; four ROOMING_LIST reservations 2026-11-09 -> 2026-11-10
        created in the order Alpha, Bravo, Charlie, Delta
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      - call: POST /group-sales/accounts
        payload: {name: Northwind Manufacturing, market_segment: CORPORATE, billing_contact_email: ap@northwind.example}
        as: SalesManager
