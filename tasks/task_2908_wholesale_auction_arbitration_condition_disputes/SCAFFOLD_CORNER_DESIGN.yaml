      # --- corners already covered by §1.8 -----------------------------------
      - name: repair_allowance_variant_divergence_excluded
        claim_type: variant_divergence
        grounds:
          - calculations.repair_allowance_amount.variants
        excluded_because:
          difficulty_instance: dual_variant_calculation / allowance_negotiated_accept_exceeds_arbitrator_formula
          rationale: "That instance runs identical case data through NEGOTIATED_ACCEPT and shows allowance_cents above computed_award_cents, and its sibling instance allowance_arbitrator_award_clipped_by_severity_formula covers the ARBITRATOR_AWARD side and the delta between them."

      - name: seller_rate_variant_divergence_excluded
        claim_type: variant_divergence
        grounds:
          - calculations.seller_arbitration_rate.variants
        excluded_because:
          difficulty_instance: dual_variant_calculation / seller_rate_rolling_diverges_from_lifetime_and_only_rolling_tiers
          rationale: "That instance places sales inside and outside the 90-day window so the two variants report different rates, and asserts that only the rolling variant moves policy_tier."

      - name: arbitration_window_threshold_boundary_excluded
        claim_type: threshold
        grounds:
          - calculations.arbitration_window_evaluation
        excluded_because:
          difficulty_instance: boundary_condition_cluster / window_boundary_three_way_at_48h_plus_1s_and_plus_4s
          rationale: "That instance probes hours_elapsed at the window, one second past it, and past it again with the PSI extension applied — the full threshold-1 / threshold / threshold+1 triple."

      - name: mileage_limit_threshold_boundary_excluded
        claim_type: threshold
        grounds:
          - calculations.arbitration_window_evaluation.formula
        excluded_because:
          difficulty_instance: boundary_condition_cluster / mileage_limit_inclusive_at_250_and_barred_at_251
          rationale: "That instance asserts the inclusive mileage boundary at exactly 250 miles driven and the rejection at 251."

      - name: min_scorecard_sales_constant_boundary_excluded
        claim_type: constants_applied
        grounds:
          - calculations.seller_arbitration_rate.constants.MIN_SCORECARD_SALES
        excluded_because:
          difficulty_instance: boundary_condition_cluster / min_scorecard_sales_boundary_gates_a_higher_rate_than_the_block_threshold
          rationale: "That instance holds a rate above TIER_BLOCK_BPS at 3 in-window sales and shows the tier stay GOOD_STANDING until the fourth sale lands."

      - name: transport_waterfall_rounding_order_excluded
        claim_type: waterfall_allocation
        grounds:
          - calculations.transport_cost_allocation.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / transport_allocation_per_leg_rounding_order_beats_sum_then_round
          rationale: "That instance uses two legs whose per-leg rounded shares differ from the sum-then-round result, which is the waterfall's ordering claim."

      - name: unwind_payout_waterfall_order_excluded
        claim_type: waterfall_allocation
        grounds:
          - calculations.unwind_payout_totals.formula
        excluded_because:
          difficulty_instance: order_dependent_computation / unwind_payout_fee_offset_measured_against_gross_refund
          rationale: "That instance pins the fee offset to the gross refund of step 1 and drives total_buyer_payout_cents negative, which is exactly the pinned-order claim."

      - name: ledger_conservation_aggregation_excluded
        claim_type: aggregation
        grounds:
          - calculations.sale_ledger_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / sale_ledger_conservation_reverses_a_settled_sale_and_posts_nothing_for_an_unsettled_one
          rationale: "That instance asserts L1 after every write and L2 per party across the settle-then-unwind pair."

      - name: open_claim_counter_aggregation_excluded
        claim_type: aggregation
        grounds:
          - calculations.open_claim_counter_invariant
        excluded_because:
          difficulty_instance: compensating_invariant / open_claim_counters_restored_by_withdraw_and_by_sweep_expiry
          rationale: "That instance asserts C1 through C4 before the claim, while it is open, and after both the withdraw and the sweep-expiry paths."

