              as: CommunityBenefitOfficer
              captures: { iv1: $.data.id }
          trigger:
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac2}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-09T14:00:00Z", ends_at: "2026-04-09T15:00:00Z" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews/${iv1}/cancel"
              payload: { reason: "Clinic asked to reschedule" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac2}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-09T14:00:00Z", ends_at: "2026-04-09T15:00:00Z" }
              as: CommunityBenefitOfficer
            - call: "GET /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", limit: 10, offset: 0 }
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 409 with data.error_id == ERR_DUPLICATE_ORGANIZATION (a second facilitator is used, so the buffer rule at priority 15 cannot be the cause)"
            - "trigger call 2: HTTP 200 with data.status == CANCELLED and cancel_reason stored"
            - "trigger call 3: HTTP 201 — the identical request now satisfies the rule"
            - "trigger call 4: total_count == 2, one CANCELLED and one SCHEDULED row for the same organization_name"

      - name: two_commitments_individually_valid_exceed_party_fte_capacity
        claim_type: Aggregate validation
        grounds:
          - validations.priority_20.ERR_PARTY_FTE_CAPACITY_EXCEEDED
          - calculations.party_committed_fte
        distinguishing_aspect: "Each commitment is individually inside the party's 3000 bp capacity, but the aggregate of PENDING rows is what the rule tests: the second 2000 bp commitment is rejected, and a 1000 bp commitment that exactly fills the capacity is accepted."
        test_recipe:
          setup:
            - "AssessmentCycle in STRATEGY_DEVELOPMENT with one DRAFT strategy (authorized_budget_cents 5000000) and one INTERNAL party whose fte_capacity_bp is 3000"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 24.8, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 15.5, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /responsible-parties"
              payload: { name: "Behavioural Health Clinic Team", party_type: "INTERNAL", fte_capacity_bp: 3000 }
              as: CommunityBenefitOfficer
              captures: { team: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "INPUT_GATHERING" }
              as: CommunityBenefitOfficer
            - call: "POST /stakeholder-interviews"
              payload: { cycle_id: "${cyc}", facilitator_party_id: "${fac}", organization_name: "Riverbend Free Clinic", sector: "SAFETY_NET_PROVIDER", starts_at: "2026-04-06T14:00:00Z", ends_at: "2026-04-06T15:00:00Z" }
              as: CommunityBenefitOfficer
              captures: { iv1: $.data.id }
            - call: "POST /stakeholder-interviews/${iv1}/complete"
              payload: { concern_ratings: { BEHAVIORAL_HEALTH: 5 }, attendee_count: 12 }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "PRIORITIZATION" }
              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates"
              payload: { cycle_id: "${cyc}", indicator_id: "${ind}", hospital_capacity_score: 70 }
              as: CommunityBenefitOfficer
              captures: { cand: $.data.id }
            - call: "POST /priority-candidates/${cand}/score"
              payload: { scoring_variant: "EQUAL_WEIGHT" }
              as: CommunityBenefitOfficer
            - call: "POST /priority-candidates/${cand}/select"
              payload: { selection_rationale: "Highest composite need with hospital capacity to act" }
              as: CommunityBenefitOfficer
              captures: { cand_v: $.data.version }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "STRATEGY_DEVELOPMENT" }
              as: CommunityBenefitOfficer
            - call: "POST /implementation-strategies"
              payload: { candidate_id: "${cand}", title: "Integrated behavioural health access", authorized_budget_cents: 5000000, expected_candidate_version: "${cand_v}" }
              as: CommunityBenefitOfficer
              captures: { strat: $.data.id }
          trigger:
            - call: "POST /resource-commitments"
              payload: { strategy_id: "${strat}", party_id: "${team}", fte_bp: 2000, funding_cents: 100000, effective_from: "2026-10-01", effective_to: "2027-04-01" }
              as: CommunityBenefitOfficer
            - call: "POST /resource-commitments"
              payload: { strategy_id: "${strat}", party_id: "${team}", fte_bp: 2000, funding_cents: 100000, effective_from: "2027-04-01", effective_to: "2027-08-01" }
              as: CommunityBenefitOfficer
            - call: "POST /resource-commitments"
              payload: { strategy_id: "${strat}", party_id: "${team}", fte_bp: 1000, funding_cents: 100000, effective_from: "2027-04-01", effective_to: "2027-08-01" }
              as: CommunityBenefitOfficer
            - call: "GET /responsible-parties/${team}"
              payload: {}
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 201 and ResponsibleParty.${team}.committed_fte_bp == 2000"
            - "trigger call 2: HTTP 409 with data.error_id == ERR_PARTY_FTE_CAPACITY_EXCEEDED — 2000 + 2000 > 3000, even though the windows are disjoint (the FTE figure is date-independent by construction)"
            - "trigger call 3: HTTP 201 — 2000 + 1000 == 3000 is accepted on the inclusive edge"
            - "trigger call 4: data.committed_fte_bp == 3000 and data.fte_capacity_bp == 3000"

      - name: posting_basis_mismatch_rejected_in_both_directions
        claim_type: Conditional validation
        grounds:
          - validations.priority_19.ERR_POSTING_BASIS_MISMATCH
          - calculations.posting_valued_amount.constants
        distinguishing_aspect: "The amount-field rule flips with the category: charge-based categories demand charges_cents >= 1 with direct_cost_cents == 0 and cost-based categories demand the mirror image, so each category rejects the other's shape."
        test_recipe:
          setup:
            - "AssessmentCycle in DRAFT with one OPEN CommunityBenefitReport"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { cyc: $.data.id }
            - call: "POST /community-benefit-reports"
              payload: { cycle_id: "${cyc}", fiscal_year: 2026 }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
              captures: { rep: $.data.id, rep_v: $.data.version }
          trigger:
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "SUBSIDIZED_SERVICES", charges_cents: 500000, direct_cost_cents: 200000, expected_report_version: "${rep_v}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "CASH_AND_INKIND", charges_cents: 500000, direct_cost_cents: 0, expected_report_version: "${rep_v}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "FINANCIAL_ASSISTANCE", charges_cents: 0, direct_cost_cents: 0, expected_report_version: "${rep_v}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
            - call: "POST /expense-postings"
              payload: { report_id: "${rep}", category: "SUBSIDIZED_SERVICES", charges_cents: 500000, direct_cost_cents: 0, expected_report_version: "${rep_v}" }
              as: CommunityBenefitOfficer
              as_user_id: "u_officer_1"
          assert:
            - "trigger call 1: HTTP 409 with data.error_id == ERR_POSTING_BASIS_MISMATCH — a charge-based category may not also carry a direct cost"
            - "trigger call 2: HTTP 409 with data.error_id == ERR_POSTING_BASIS_MISMATCH — a cost-based category may not carry charges"
            - "trigger call 3: HTTP 409 with data.error_id == ERR_POSTING_BASIS_MISMATCH — charge-based categories require charges_cents >= 1, zero is not enough"
            - "trigger call 4: HTTP 201 with data.valued_cents == 160000 (500000 * 0.3200); the three rejections left the report version at ${rep_v} so the same expected_report_version is still current"

      - name: data_point_evidence_window_edges_enforced_against_the_logical_clock
        claim_type: Temporal validation
        grounds:
          - validations.priority_16.ERR_DATA_POINT_OUT_OF_WINDOW
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "The evidence window is closed on both ends and its upper end tracks the logical clock: for fiscal 2026 the lower edge 2023-01-01 is accepted and 2022-12-31 is not, and with the clock at 2026-08-01 a collection date of 2026-08-01 is accepted while 2026-08-02 is rejected."
        test_recipe:
          setup:
            - "logical clock set to 2026-08-01T00:00:00Z"
            - "AssessmentCycle for fiscal_year 2026 in DATA_COLLECTION with one HealthIndicator"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CommunityBenefitOfficer
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
            - call: "POST /assessment-cycles/${cyc}/advance"
              payload: { to_status: "DATA_COLLECTION" }
              as: CommunityBenefitOfficer
            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult depression prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind: $.data.id }
          trigger:
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2022-12-31" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 18.6, collected_on: "2023-01-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "SURVEY", value: 19.2, collected_on: "2026-08-02" }
              as: DataSteward
            - call: "POST /health-indicators/${ind}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "SURVEY", value: 19.2, collected_on: "2026-08-01" }
              as: DataSteward
            - call: "GET /health-indicators/${ind}"
              payload: {}
              as: CommunityBenefitOfficer
          assert:
            - "trigger call 1: HTTP 409 with data.error_id == ERR_DATA_POINT_OUT_OF_WINDOW — the window opens at (2026 - 3)-01-01"
            - "trigger call 2: HTTP 201 on the inclusive lower edge"
            - "trigger call 3: HTTP 409 with data.error_id == ERR_DATA_POINT_OUT_OF_WINDOW — a collection date after the logical clock's calendar date is not evidence yet"
            - "trigger call 4: HTTP 201 on the inclusive upper edge"
            - "trigger call 5: evidence_count == 2 and latest_overall_value == 19.2 (the newest accepted OVERALL row wins), severity_score == 80.00"

      - name: priority_conflict_between_state_and_fiscal_rules
        claim_type: Priority conflict
        excluded_because:
          difficulty_instance: locked_strategy_beats_budget_exceeded_on_commitment_create
          rationale: "The §1.8 priority_pair_validation_conflict instance already violates the priority-11 strategy-lock rule together with the priority-22 budget rule and asserts that the lower-numbered rule's error is returned."

      - name: priority_conflict_between_public_availability_and_report_lock
        claim_type: Priority conflict
        excluded_because:
          difficulty_instance: public_availability_beats_report_not_locked_on_file_return
          rationale: "The §1.8 priority_pair_validation_conflict instance already violates the priority-13 and priority-14 file-return rules simultaneously and asserts ERR_PUBLIC_AVAILABILITY_NOT_MET wins."

      - name: priority_conflict_between_temporal_and_uniqueness_rules
        claim_type: Priority Ordering
        excluded_because:
          difficulty_instance: facilitator_conflict_beats_duplicate_org_on_interview_create
          rationale: "The §1.8 priority_pair_validation_conflict instance already violates the priority-15 facilitator buffer and the priority-18 organisation uniqueness rule in one request and asserts the priority-15 error."

      - name: cross_entity_validation_depends_on_other_entity_state
        claim_type: Cross-entity validation
        excluded_because:
          difficulty_instance: posting_with_strategy_requires_strategy_approved
          rationale: "The §1.8 cross_entity_state_dependency instance already tests both directions of a rule whose validity depends on another entity's state (ERR_STRATEGY_NOT_APPROVED before adoption, success after)."

      - name: cascading_validation_runs_the_prerequisite_check_first
        claim_type: Cascading validation
        excluded_because:
          difficulty_instance: commitment_with_partnership_requires_agreement_executed
          rationale: "The §1.8 cross_entity_state_dependency instance already shows that the partnership-execution check at priority 12 must resolve before the pledge-load arithmetic at priority 21 can be evaluated at all."

  - section: endpoints
    instances:
      - name: responsible_party_create_read_and_filtered_list
        claim_type: Standard CRUD
        grounds:
          - endpoints.POST_/responsible-parties
          - endpoints.GET_/responsible-parties
          - endpoints.GET_/responsible-parties/{party_id}
        distinguishing_aspect: "ResponsibleParty is the scaffold's only cycle-independent registry: create / read / filtered list all work with no cycle in existence, there is no update or delete endpoint, and the party_type filter partitions the registry."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls:
            - call: "GET /responsible-parties"
              payload: { limit: 10, offset: 0 }
              as: CommunityBenefitOfficer
          trigger:
            - call: "POST /responsible-parties"
              payload: { name: "Community Health Office", party_type: "INTERNAL", fte_capacity_bp: 10000 }
              as: CommunityBenefitOfficer
              captures: { fac: $.data.id }
            - call: "POST /responsible-parties"
              payload: { name: "Riverbend Community Coalition", party_type: "PARTNER", fte_capacity_bp: 5000 }
              as: CommunityBenefitOfficer
              captures: { partner: $.data.id }
            - call: "GET /responsible-parties/${fac}"
              payload: {}
              as: PartnerRepresentative
              as_user_id: "${partner}"
            - call: "GET /responsible-parties"
              payload: { party_type: "PARTNER", limit: 10, offset: 0 }
              as: ComplianceOfficer
          assert:
            - "trigger calls 1 and 2: HTTP 201 with committed_fte_bp == 0 and version == 1"
            - "trigger call 3: HTTP 200 and data.id == ${fac}, name == \"Community Health Office\", party_type == INTERNAL, fte_capacity_bp == 10000"
            - "trigger call 4: total_count == 1 and the row is ${partner} — the INTERNAL party is filtered out"
            - "the entity exposes no PUT/PATCH/DELETE endpoint anywhere in §1.5, so capacity is fixed once created"

      - name: progress_evaluation_publish_enforces_cycle_state_and_period_uniqueness
        claim_type: Action endpoint
        grounds:
          - state_machines.ProgressEvaluation.transitions[DRAFT->PUBLISHED].preconditions
          - validations.priority_18.ERR_DUPLICATE_EVALUATION_PERIOD
        distinguishing_aspect: "A ProgressEvaluation may be drafted at any cycle phase but published only once the cycle is ADOPTED, PUBLISHED or FILED; and the duplicate key is the triple (cycle_id, eval_type, period_year), so a MID_CYCLE evaluation for the same year is still allowed."
        test_recipe:
          setup:
            - "one AssessmentCycle in DRAFT"
          setup_api_calls:
            - call: "POST /assessment-cycles"
              payload: { fiscal_year: 2026, service_area_name: "Riverbend County", prior_year_cost_to_charge_ratio: 0.3200, total_operating_expense_cents: 120000000 }
              as: CommunityBenefitOfficer
              captures: { cyc: $.data.id }
          trigger:
            - call: "POST /progress-evaluations"
              payload: { cycle_id: "${cyc}", eval_type: "ANNUAL", period_year: 2027, findings_summary: "Year one results" }
              as: CommunityBenefitOfficer
              captures: { ev_ann: $.data.id }
            - call: "POST /progress-evaluations/${ev_ann}/publish"
              payload: { public_url: "https://riverbendhealth.example.org/chna/2026/annual" }
              as: CommunityBenefitOfficer
            - call: "POST /progress-evaluations"
              payload: { cycle_id: "${cyc}", eval_type: "ANNUAL", period_year: 2027, findings_summary: "Duplicate attempt" }
              as: CommunityBenefitOfficer
            - call: "POST /progress-evaluations"
              payload: { cycle_id: "${cyc}", eval_type: "MID_CYCLE", period_year: 2027, findings_summary: "Mid-cycle check-in" }
              as: CommunityBenefitOfficer
            - call: "GET /assessment-cycles/${cyc}/progress-evaluations"
              payload: { status: "DRAFT", limit: 10, offset: 0 }
              as: PublicViewer
          assert:
            - "trigger call 1: HTTP 201 with data.status == DRAFT, objectives_revised_count == 0, published_at == null, public_url == null"
            - "trigger call 2: HTTP 409 with data.error_id == ERR_INVALID_STATE — the owning cycle is still DRAFT"
            - "trigger call 3: HTTP 409 with data.error_id == ERR_DUPLICATE_EVALUATION_PERIOD"
            - "trigger call 4: HTTP 201 — a different eval_type for the same period_year is a different key"
            - "trigger call 5: total_count == 2 and AssessmentCycle.${cyc}.annual_report_count == 0 — the rejected publish incremented nothing"

      - name: party_type_mismatch_rejected_on_both_link_directions
        claim_type: Cross-reference link
        grounds:
          - validations.priority_6.ERR_PARTY_TYPE_MISMATCH
          - entities.StakeholderInterview.fields.facilitator_party_id
          - entities.PartnershipAgreement.fields.party_id
