              payload: { email: "kid@example.com", full_name: "Robin Kid", role_in_family: "MINOR", expected_account_version: "${av1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { kid_id: $.data.id, kid_token: $.data.invitation_token }
          trigger:
            - call: "POST /monitored-profiles"
              payload: { member_id: "${kid_id}", full_name: "Robin Kid", date_of_birth: "2010-07-14", primary_address: "12 Elm St, Springfield" }
              as: Member
              as_user_id: "${kid_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_MEMBER_NOT_ACTIVE"
            - "GET /members/${kid_id}/monitored-profiles returns total_count == 0"
            - "After POST /members/${kid_id}/activate with the issued token, the same profile creation succeeds with HTTP 201"

  # =========================================================================
  # Section 5 — Endpoints
  # =========================================================================
  - section: endpoints
    instances:

      - name: logical_clock_defaults_to_the_declared_startup_instant
        claim_type: Computed read
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - entities.BillingCycle.fields.starts_at
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-05-01T00:00:00Z, which is what every created_at and cycle boundary is stamped from; the endpoint also reports the previous value so the shift is observable."
        test_recipe:
          setup:
            - "Empty database; no clock call has been made."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T12:30:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { prev: $.data.previous_utc, now: $.data.current_utc }
          assert:
            - "previous_utc == 2026-05-01T00:00:00.000Z — the untouched startup default, never real wall-clock time"
            - "current_utc == 2026-06-10T12:30:00.000Z"
            - "The account created before the shift has created_at == 2026-05-01T00:00:00.000Z"
            - "Its first BillingCycle has starts_at == 2026-05-01T00:00:00.000Z and ends_at == 2026-05-31T00:00:00.000Z"

