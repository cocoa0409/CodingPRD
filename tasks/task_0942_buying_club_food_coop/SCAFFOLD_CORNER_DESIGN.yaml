    claim_type: violation_to_error
    grounds:
    - validations[priority=51]
    - errors[ERR_CREDIT_CAP_EXCEEDED]
    - boundary_semantics.credit_offset_cap
    distinguishing_aspect: 'apply_credit_cents is validated against the cap rather than silently clamped: 30000 against a 26109-cent cap on a 52218-cent pre-credit total is refused at priority 51 and no grant is touched.'
    test_recipe:
      setup:
