        claim_type: Constants Applied
        grounds:
          - calculations.period_funding_settlement
        distinguishing_aspect: "The marginal handling-fee tiers only diverge above 50 000 redeemed containers, which no composition of §1.5 endpoints can reach: each visit is capped at 240 containers and each account at 350 per day, so a tier crossing would need hundreds of accounts and dozens of logical days."
        excluded_because:
          difficulty_instance: period_settlement_pinned_evaluation_order
          rationale: "That §1.8 instance already pins the ten-step evaluation order of period_funding_settlement, including the handling-fee step and its 3-cent first tier, on a volume that §1.5 can actually produce; only the 50 000 and 150 000 container tier boundaries are unreachable, and no additional endpoint is worth adding for a fee tier that a real deployment reaches only in aggregate."

