        distinguishing_aspect: |
          Conserved quantity: the POUCH POPULATION and its verification ledger — a
          set-cardinality invariant rather than money or refill units. Across a failed
          verification and the rework that undoes it, pouch_count never changes and
          MATCH + MISMATCH_COUNT + UNREADABLE + PENDING + VOID always sums to pouch_count,
