# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3095_loss_history_reporting_underwriting_exchange_contribution
#
# Depth probe: 2 instances per §0.5 rule, each grounded in SCAFFOLD.yaml
# §1.1–§1.7 and reproducible from empty-DB via the structured call chains
# below. All times are logical-clock times (default 2026-09-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_count_vs_premium_weighted_diverge_on_same_report
        grounds:
          - calculations.risk_score_dual
          - calculations.risk_certainty_score
          - entities.LossHistoryReport.fields.risk_score_count
          - entities.LossHistoryReport.fields.risk_score_premium_weighted_cents
        distinguishing_aspect: |
          Same matched consumer, same report, two valid risk formulas that
          produce different numbers: the count variant scores 3 zero-payment
          claims higher than 1 large paid claim, while the premium-weighted
          variant does the opposite. Both are persisted side-by-side on
          LossHistoryReport and asserted against literals computed from the
          formula.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default; set explicitly)."
            - "ExchangeRule singleton initialized with defaults (premium_weight_cap_cents=500000, retention_years=7, reciprocity threshold 45)."
            - "Consumer A: Alice (DL ALICE-1), 3 CLOSED_WITHOUT_PAYMENT claims of 0 cents each (loss dates 2025-01-10/2025-02-10/2025-03-10), contributed by carrier C1 in one batch."
            - "Consumer B: Bob (DL BOB-1), 1 CLOSED_WITH_PAYMENT claim of 400000 cents (loss date 2025-01-15), contributed by C1 in the same batch."
            - "C1 therefore ACTIVE (first COMPLETED batch with accepted_count >= 1), lag 0 at inquiry time."
          setup_api_calls:
            - &d_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_rules
              call: "POST /exchange-rules"
              payload: {}
              as: PlatformAdmin
            - &d_c1
              call: "POST /carriers"
              payload: { legal_name: "Covenant Mutual", naic_code: "11111" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - &d_cons_a
              call: "POST /consumers"
              payload: { full_name: "Alice Anderson", date_of_birth: "1985-04-12", address_line: "10 Elm St, Austin TX", driver_license_number: "ALICE-1" }
              as: PlatformAdmin
              captures: { cons_a_id: $.data.id, cons_a_v: $.data.version }
            - &d_cons_b
              call: "POST /consumers"
              payload: { full_name: "Bob Barker", date_of_birth: "1979-11-02", address_line: "20 Oak Ave, Austin TX", driver_license_number: "BOB-1" }
              as: PlatformAdmin
              captures: { cons_b_id: $.data.id, cons_b_v: $.data.version }
            - &d_batch_dual
              call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_a_id}", policy_number: "PA-1", claim_number: "A-001", loss_date: "2025-01-10", loss_type: "COLLISION", cause_of_loss_code: "COL01", paid_amount_cents: 0, claim_status_code: "CLOSED_WITHOUT_PAYMENT", vehicle_identifier: "" }
                  - { consumer_id: "${cons_a_id}", policy_number: "PA-1", claim_number: "A-002", loss_date: "2025-02-10", loss_type: "COMPREHENSIVE", cause_of_loss_code: "COMP2", paid_amount_cents: 0, claim_status_code: "CLOSED_WITHOUT_PAYMENT", vehicle_identifier: "" }
                  - { consumer_id: "${cons_a_id}", policy_number: "PA-1", claim_number: "A-003", loss_date: "2025-03-10", loss_type: "LIABILITY", cause_of_loss_code: "LIAB3", paid_amount_cents: 0, claim_status_code: "CLOSED_WITHOUT_PAYMENT", vehicle_identifier: "" }
                  - { consumer_id: "${cons_b_id}", policy_number: "PB-1", claim_number: "B-001", loss_date: "2025-01-15", loss_type: "COLLISION", cause_of_loss_code: "COL01", paid_amount_cents: 400000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
              captures: { batch_dual_id: $.data.id }
          trigger:
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Alice Anderson", subject_dob: "1985-04-12", subject_address: "10 Elm St, Austin TX", subject_driver_license: "ALICE-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_a: $.data.id, rep_a: $.data.report_id }
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Bob Barker", subject_dob: "1979-11-02", subject_address: "20 Oak Ave, Austin TX", subject_driver_license: "BOB-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_b: $.data.id, rep_b: $.data.report_id }
          assert:
            - "QuoteInquiry.${inq_a}.match_disposition == PROBABLE and match_score == 6150 (EXACT individual 5000 + EXACT address 1000 + 3 included losses x 50)"
            - "LossHistoryReport.${rep_a}.risk_score_certainty == 61.50"
            - "LossHistoryReport.${rep_a}.risk_score_count == 185 (3 x 61.50 = 184.50, round_half_up to 185)"
            - "LossHistoryReport.${rep_a}.risk_score_premium_weighted_cents == 0 (capped paid sum 0)"
            - "LossHistoryReport.${rep_b}.risk_score_certainty == 61.50 (same score 6150: EXACT individual 5000 + EXACT address 1000 + 1 loss x 50)"
            - "LossHistoryReport.${rep_b}.risk_score_count == 62 (1 x 61.50, round_half_up)"
            - "LossHistoryReport.${rep_b}.risk_score_premium_weighted_cents == 246000 (400000 x 61.50 / 100)"
            - "LossHistoryReport.${rep_a}.risk_score_count > LossHistoryReport.${rep_b}.risk_score_count while LossHistoryReport.${rep_a}.risk_score_premium_weighted_cents < LossHistoryReport.${rep_b}.risk_score_premium_weighted_cents — the two variants rank the two consumers in opposite orders"

      - name: contribution_lag_engages_reciprocity_at_inclusive_threshold
        grounds:
          - calculations.contribution_lag
          - entities.Carrier.fields.contribution_lag_days
          - entities.ExchangeRule.fields.reciprocity_lag_threshold_days
        distinguishing_aspect: |
          A second dual-meaning calculation on a different entity domain
          (Carrier, not LossHistoryReport): contribution_lag_days is both a
          reporting field and a gating signal. A lag one day below the
          threshold leaves the carrier ACTIVE; exactly at the threshold the
          same formula flips the carrier to SUSPENDED, and the withheld
          report is the observable consequence.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults (reciprocity_lag_threshold_days=45)."
            - "Carrier C2 ACTIVE with one COMPLETED batch submitted 2026-09-01 (1 accepted claim for consumer Carol)."
            - "Carrier C3 ACTIVE with one COMPLETED batch submitted 2026-09-01."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - &d_c2
              call: "POST /carriers"
              payload: { legal_name: "Meridian Indemnity", naic_code: "22222" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - &d_c3
              call: "POST /carriers"
              payload: { legal_name: "Pioneer General", naic_code: "33333" }
              as: PlatformAdmin
              captures: { c3_id: $.data.id }
            - &d_cons_c
              call: "POST /consumers"
              payload: { full_name: "Carol Cortez", date_of_birth: "1990-01-01", address_line: "5 Pine Rd, Dallas TX", driver_license_number: "CAROL-1" }
              as: PlatformAdmin
              captures: { cons_c_id: $.data.id, cons_c_v: $.data.version }
            - &d_batch_c2
              call: "POST /carriers/${c2_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_c_id}", policy_number: "PC-1", claim_number: "C-001", loss_date: "2025-06-01", loss_type: "PROPERTY", cause_of_loss_code: "PROP1", paid_amount_cents: 120000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c2_id}"
              captures: { batch_c2_id: $.data.id }
            - &d_batch_c3
              call: "POST /carriers/${c3_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_c_id}", policy_number: "PC-2", claim_number: "C-101", loss_date: "2025-07-01", loss_type: "PROPERTY", cause_of_loss_code: "PROP2", paid_amount_cents: 50000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c3_id}"
              captures: { batch_c3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
              captures: { lag44: $.data.current_utc }
          trigger:
            - call: "POST /carriers/${c2_id}/inquiries"
              payload: { subject_name: "Carol Cortez", subject_dob: "1990-01-01", subject_address: "5 Pine Rd, Dallas TX", subject_driver_license: "CAROL-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c2_id}"
              captures: { inq_lag44: $.data.id, rep_lag44: $.data.report_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-17T00:00:00Z" }
              as: PlatformAdmin
              captures: { suspended_ids: $.data.suspended_carrier_ids }
            - call: "POST /carriers/${c2_id}/inquiries"
              payload: { subject_name: "Carol Cortez", subject_dob: "1990-01-01", subject_address: "5 Pine Rd, Dallas TX", subject_driver_license: "CAROL-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c2_id}"
              captures: { inq_lag45: $.data.id }
          assert:
            - "at lag 44 (2026-10-16) Carrier.${c2_id}.status == ACTIVE and QuoteInquiry.${inq_lag44}.report_id is non-null"
            - "at lag 45 (2026-10-17, exactly the threshold) the clock response lists Carrier.${c2_id} in suspended_carrier_ids and Carrier.${c3_id} as well (both lagged 45)"
            - "QuoteInquiry.${inq_lag45}.report_id is null and report_blocked_reason == RECIPROCITY — the same formula value, one day apart, flips report delivery"
            - "LossHistoryReport.${rep_lag44}.risk_score_certainty == 62.00 (EXACT individual 5000 + EXACT address 1000 + Carol's 2 included losses x 50 = 6200)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: identity_match_score_multisignal_threshold_band_ladder
        grounds:
          - calculations.identity_match_score
          - entities.QuoteInquiry.fields.match_score
          - entities.QuoteInquiry.fields.match_disposition
        distinguishing_aspect: |
          Mode (a): a >= 3-input non-linear formula. match_score combines four
          weighted terms (individual grade, vehicle grade, address grade,
          included-loss count) with grade-dependent band ceilings: a FUZZY
          individual grade caps the attainable band at POSSIBLE unless both
          vehicle and address are EXACT, so permuting the grade vector moves
          the same consumer across DEFINITE / PROBABLE / POSSIBLE / UNMATCHED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults."
            - "Consumer Dana: DL DANA-1, address '40 Birch Ln', 0 claims (so loss term is 0 and grade vectors alone decide the band)."
            - "Carrier C1 ACTIVE (a batch with one claim for a second consumer Erin keeps the carrier contributing)."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - *d_c1
            - &d_cons_d
              call: "POST /consumers"
              payload: { full_name: "Dana Draper", date_of_birth: "1988-08-08", address_line: "40 Birch Ln, Plano TX", driver_license_number: "DANA-1" }
              as: PlatformAdmin
              captures: { cons_d_id: $.data.id, cons_d_v: $.data.version }
            - &d_cons_e
              call: "POST /consumers"
              payload: { full_name: "Erin Ellery", date_of_birth: "1992-03-03", address_line: "9 Cedar Ct, Plano TX", driver_license_number: "ERIN-1" }
              as: PlatformAdmin
              captures: { cons_e_id: $.data.id, cons_e_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_e_id}", policy_number: "PE-1", claim_number: "E-001", loss_date: "2025-05-05", loss_type: "OTHER", cause_of_loss_code: "OTH1", paid_amount_cents: 10000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "VIN-ERIN-1" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Dana Draper", subject_dob: "1988-08-08", subject_address: "40 Birch Ln, Plano TX", subject_driver_license: "DANA-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_exact: $.data.id }
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Dana Draper", subject_dob: "1988-08-08", subject_address: "555 Nowhere Pkwy, El Paso TX", subject_driver_license: "", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_fuzzy: $.data.id }
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Dana Draper", subject_dob: "1988-08-08", subject_address: "40 Birch Ln, Plano TX", subject_driver_license: "", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_fuzzy2: $.data.id }
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Xavier Yates", subject_dob: "1970-01-01", subject_address: "1 Nowhere Blvd, El Paso TX", subject_driver_license: "NOBODY-9", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_none: $.data.id }
          assert:
            - "QuoteInquiry.${inq_exact}.individual_match_grade == EXACT, address_match_grade == EXACT, vehicle_match_grade == ABSENT, match_score == 6000 (individual EXACT 5000 + address EXACT 1000 + vehicle ABSENT 0 + 0 losses x 50)"
            - "QuoteInquiry.${inq_exact}.match_disposition == PROBABLE (6000 >= 5500, < 7000)"
            - "QuoteInquiry.${inq_fuzzy}.individual_match_grade == FUZZY (name+DOB match), address_match_grade == ABSENT (stale address), match_score == 1250 (1250 + 0), match_disposition == UNMATCHED (1250 < 4000) — same consumer, no driver license, falls below the reportable floor"
            - "QuoteInquiry.${inq_fuzzy}.matched_consumer_id is null and report_id is null — a FUZZY individual grade without corroborating EXACT signals cannot attribute losses"
            - "QuoteInquiry.${inq_fuzzy2}.individual_match_grade == FUZZY, address_match_grade == EXACT, match_score == 2250 (1250 + 1000), match_disposition == UNMATCHED (2250 < 4000) — the household-ambiguity guard caps a FUZZY-individual bundle at UNMATCHED unless vehicle corroborates"
            - "QuoteInquiry.${inq_none}.match_score == 0, match_disposition == UNMATCHED, report_blocked_reason == NONE"

      - name: risk_score_rounding_order_is_per_claim_cap_then_weight_then_round
        grounds:
          - calculations.risk_score_dual
          - calculations.risk_certainty_score
          - entities.ExchangeRule.fields.premium_weight_cap_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The premium-weighted
          variant caps each claim at premium_weight_cap_cents BEFORE summing,
          then multiplies by the 2-decimal certainty, then rounds half-up to
          integer cents. Cap-after-sum or round-before-weight would give
          different cents; the scaffold pins cap-then-weight-then-round and
          the test pins the exact literals.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults (cap 500000)."
            - "Consumer Fay: DL FAY-1, claims: 900000 cents (over cap), 250000 cents, loss dates 2024-04-01 / 2024-05-01."
            - "Carrier C1 ACTIVE."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - *d_c1
            - &d_cons_f
              call: "POST /consumers"
              payload: { full_name: "Fay Fontaine", date_of_birth: "1980-12-25", address_line: "77 Maple Dr, Irving TX", driver_license_number: "FAY-1" }
              as: PlatformAdmin
              captures: { cons_f_id: $.data.id, cons_f_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_f_id}", policy_number: "PF-1", claim_number: "F-001", loss_date: "2024-04-01", loss_type: "LIABILITY", cause_of_loss_code: "LIAB1", paid_amount_cents: 900000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
                  - { consumer_id: "${cons_f_id}", policy_number: "PF-1", claim_number: "F-002", loss_date: "2024-05-01", loss_type: "COLLISION", cause_of_loss_code: "COL02", paid_amount_cents: 250000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c1_id}"
          trigger:
            - call: "POST /carriers/${c1_id}/inquiries"
              payload: { subject_name: "Fay Fontaine", subject_dob: "1980-12-25", subject_address: "77 Maple Dr, Irving TX", subject_driver_license: "FAY-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${c1_id}"
              captures: { inq_f: $.data.id, rep_f: $.data.report_id }
          assert:
            - "LossHistoryReport.${rep_f}.risk_score_certainty == 61.00 (match_score 6100 = EXACT 5000 + EXACT address 1000 + 2 losses x 50)"
            - "LossHistoryReport.${rep_f}.risk_score_premium_weighted_cents == 457500: (min(900000,500000) + min(250000,500000)) x 61.00 / 100 = 750000 x 0.61 = 457500"
            - "LossHistoryReport.${rep_f}.risk_score_premium_weighted_cents != 701500 — the uncapped sum 1150000 x 0.61 = 701500 is the wrong order"
            - "LossHistoryReport.${rep_f}.claim_count_reported == 2 and risk_score_count == 122 (2 x 61.00)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: carrier_provisional_active_suspended_cycle
        grounds:
          - state_machines.Carrier.PROVISIONAL_to_ACTIVE
          - state_machines.Carrier.ACTIVE_to_SUSPENDED
          - state_machines.Carrier.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          The Carrier machine is cyclic: PROVISIONAL -> ACTIVE on first
          accepted batch, ACTIVE -> SUSPENDED on contribution lag, SUSPENDED
          -> ACTIVE again on a fresh COMPLETED batch. The loop can repeat —
          the test drives the full cycle and asserts each hop's audit event.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults (threshold 45)."
            - "Carrier C4 registered (PROVISIONAL); consumer Grace exists."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - &d_c4
              call: "POST /carriers"
              payload: { legal_name: "Sentinel Casualty", naic_code: "44444" }
              as: PlatformAdmin
              captures: { c4_id: $.data.id }
            - &d_cons_g
              call: "POST /consumers"
              payload: { full_name: "Grace Graves", date_of_birth: "1975-07-19", address_line: "3 Willow Way, Waco TX", driver_license_number: "GRACE-1" }
              as: PlatformAdmin
              captures: { cons_g_id: $.data.id, cons_g_v: $.data.version }
          trigger:
            - call: "POST /carriers/${c4_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_g_id}", policy_number: "PG-1", claim_number: "G-001", loss_date: "2025-09-01", loss_type: "OTHER", cause_of_loss_code: "OTH9", paid_amount_cents: 1000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c4_id}"
              captures: { c4_batch1: $.data.id }
            - call: "GET /carriers/${c4_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c4_status_active: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-17T00:00:00Z" }
              as: PlatformAdmin
              captures: { susp: $.data.suspended_carrier_ids }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-18T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers/${c4_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_g_id}", policy_number: "PG-1", claim_number: "G-002", loss_date: "2026-10-01", loss_type: "OTHER", cause_of_loss_code: "OTH9", paid_amount_cents: 2000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
              as_user_id: "${c4_id}"
              captures: { c4_batch2: $.data.id }
            - call: "GET /carriers/${c4_id}"
              payload: {}
              as: PlatformAdmin
              captures: { c4_status_back: $.data.status, c4_lag_back: $.data.contribution_lag_days }
          assert:
            - "after batch 1, c4_status_active == ACTIVE (PROVISIONAL -> ACTIVE on first COMPLETED batch)"
            - "at 2026-10-17 (lag 46 >= 45) the clock response's suspended_carrier_ids contains Carrier.${c4_id}"
            - "after batch 2 at 2026-10-18, c4_status_back == ACTIVE and c4_lag_back == 0 — SUSPENDED -> ACTIVE on the fresh COMPLETED batch"
            - "GET /audit-events?carrier_id=${c4_id} shows the ordered event_type sequence CARRIER_REACTIVATED (first activation), CARRIER_SUSPENDED, CARRIER_REACTIVATED"

      - name: dispute_resolution_branches_fork_three_distinct_claim_fates
        grounds:
          - state_machines.ConsumerDispute.UNDER_REINVESTIGATION_to_RESOLVED_VERIFIED
          - state_machines.ConsumerDispute.UNDER_REINVESTIGATION_to_RESOLVED_AMENDED
          - state_machines.ConsumerDispute.UNDER_REINVESTIGATION_to_RESOLVED_DELETED
        distinguishing_aspect: |
          The ConsumerDispute machine is a fork: from UNDER_REINVESTIGATION
          three divergent resolutions each carry a different side-effect set —
          VERIFIED_ACCURATE returns the claim to ACTIVE, AMENDED spawns a
          replacement claim (and retires the old one), DELETED withdraws the
          claim. The test files three disputes on three claims and asserts the
          three fates on the claim population.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults."
            - "Carrier C1 ACTIVE; consumer Hank with 3 ACTIVE claims (H-001 paid 100000, H-002 paid 200000, H-003 paid 300000)."
            - "Three disputes filed, one per claim, and all three moved to UNDER_REINVESTIGATION."
          setup_api_calls:
            - *d_clock
            - *d_rules
            - *d_c1
            - &d_cons_h
              call: "POST /consumers"
              payload: { full_name: "Hank Hobbs", date_of_birth: "1969-02-14", address_line: "8 Hickory Hl, Lubbock TX", driver_license_number: "HANK-1" }
              as: PlatformAdmin
              captures: { cons_h_id: $.data.id, cons_h_v: $.data.version }
            - call: "POST /carriers/${c1_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cons_h_id}", policy_number: "PH-1", claim_number: "H-001", loss_date: "2025-01-01", loss_type: "COLLISION", cause_of_loss_code: "COL1", paid_amount_cents: 100000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
                  - { consumer_id: "${cons_h_id}", policy_number: "PH-1", claim_number: "H-002", loss_date: "2025-02-01", loss_type: "COLLISION", cause_of_loss_code: "COL2", paid_amount_cents: 200000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
                  - { consumer_id: "${cons_h_id}", policy_number: "PH-1", claim_number: "H-003", loss_date: "2025-03-01", loss_type: "COLLISION", cause_of_loss_code: "COL3", paid_amount_cents: 300000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
              as: CarrierDataSteward
