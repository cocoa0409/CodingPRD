  # excluded_because stubs — corners already covered by §1.8 difficulty instances
  # ===========================================================================
  - section: calculations
    instances:
      - name: load_sizing_full_load_variant_correct
        claim_type: Variant Divergence
        grounds: [calculations.run_load_sizing]
        excluded_because:
          difficulty_instance: dual_variant_calc / load_sizing_staggered_vs_full_load_diverges
          rationale: "STAGGERED vs FULL_LOAD divergence (25.0 vs 31.0) is the asserted core of that §1.8 instance."

      - name: warranty_refund_usage_variant_correct
        claim_type: Variant Selection
        grounds: [calculations.run_warranty_refund]
        excluded_because:
          difficulty_instance: dual_variant_calc / warranty_refund_calendar_vs_usage_diverges
          rationale: "USAGE refund 200000 vs CALENDAR 216000 is asserted there."

      - name: plan_price_bundle_discount_correct
        claim_type: Correct Result
        grounds: [calculations.run_plan_price]
        excluded_because:
          difficulty_instance: combinatorial_formula / plan_price_tiered_with_bundle_discount_mode_a
          rationale: "66600 bundle-discount result asserted in §1.8."

      - name: repair_invoice_per_line_rounding_correct
        claim_type: Precision
        grounds: [calculations.run_repair_invoice]
        excluded_because:
          difficulty_instance: combinatorial_formula / repair_invoice_rounding_order_mode_b
          rationale: "Per-line-then-sum 436 vs sum-then-round 435 asserted in §1.8."

      - name: compliance_score_threshold_boundary
        claim_type: Constants Applied
        grounds: [calculations.run_compliance_score]
        excluded_because:
          difficulty_instance: boundary_precision_check / compliance_score_threshold_70_inclusive_health
          rationale: "score 63 -> DEGRADED boundary asserted in §1.8."

  - section: state_machines
    instances:
      - name: recall_resolution_cascade_completes_remediation
        claim_type: Side Effect Execution
        grounds: [state_machines.RecallRemediation.SCHEDULED_to_COMPLETED]
        excluded_because:
          difficulty_instance: transitive_cascade / recall_resolve_cascade_depth4_restores_warranty
          rationale: "Dispatch-resolve -> remediation COMPLETED -> posture -> warranty restore is the §1.8 cascade."

      - name: decommission_cancels_plan_visit_cascade
        claim_type: Side Effect Execution
        grounds: [state_machines.Unit.OPERATIONAL_to_DECOMMISSIONED]
        excluded_because:
          difficulty_instance: transitive_cascade / decommission_cascade_depth2_cancels_plan_and_visits
          rationale: "Decommission -> plan CANCELLED -> visit CANCELLED is the §1.8 depth-2 cascade."

  - section: validations
    instances:
      - name: tech_overloaded_at_cap_boundary
        claim_type: Violation -> Error
        grounds: ["validations[priority=16]", "errors[ERR_TECH_OVERLOADED]"]
        excluded_because:
