          PATCH /pace/products/{id} is a status-only mutator and retirement is forward-looking: the
          measure added while the product was ACTIVE keeps pointing at it and keeps its stamped
          pv/sir, while a NEW measure on the same product is refused with 422. The default listing
          also keeps returning the retired row (retirement is not a soft delete) and only a
          status filter separates them.
