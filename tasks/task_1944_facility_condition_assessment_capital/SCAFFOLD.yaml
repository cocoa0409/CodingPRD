    side_effects: []

  - method: POST
    path: "/fca/_clock/set_current_utc"
    description: Test-driving endpoint — set the server logical clock. Startup default is exactly 2026-08-01T00:00:00Z and the clock MUST NOT fall back to wall-clock time before any set call.
    roles: [Consultant]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "current_calendar_year() used by remaining_useful_life reads this clock"

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or invalid X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint per RBAC matrix"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "Body foreign-key id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a state that permits the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_*_version does not match the parent entity's current version"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Approver's X-User-ID equals the submitter's X-User-ID"
  - id: ERR_CODE_SEVERITY_TOO_LOW
    http: 422
    condition: "Code or accessibility violation flagged with severity < 3"
  - id: ERR_YEAR_OUT_OF_RANGE
    http: 422
    condition: "recommended_year < 2026 or planned_year outside the plan horizon"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, invalid enum, or range violation"
  - id: ERR_DUPLICATE
    http: 409
    condition: "Uniqueness violation (plan/deficiency pair or one OPEN cycle per facility)"
  - id: ERR_REFERENTIAL_CONFLICT
    http: 409
    condition: "Referential-state conflict (deficiency on RETIRED system; retire with open deficiencies; bundle/plan mismatch)"
  - id: ERR_PRECONDITION_UNMET
    http: 409
    condition: "Cross-entity precondition unmet (no funded items; unassessed systems; funded work not closed out)"
  - id: ERR_INVALID_BUDGET
    http: 422
    condition: "annual_budget_cents <= 0 or escalation_rate out of range"

roles:
  - name: Consultant
    description: Facility assessment consultant; performs inventory, condition ratings, deficiency findings, verification of corrected work, and refresh-cycle management
    identity: opaque
    exclusive_operations:
      - "POST /fca/clients"
      - "POST /fca/facilities"
      - "POST /fca/asset-systems"
      - "POST /fca/asset-systems/{id}/assess"
      - "POST /fca/deficiencies"
      - "POST /fca/deficiencies/{id}/verify"
      - "POST /fca/deficiencies/{id}/reject-verification"
      - "POST /fca/facilities/{id}/refresh-cycles"
      - "POST /fca/refresh-cycles/{id}/close"
      - "POST /fca/facilities/{id}/recompute"
      - "POST /fca/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
  - name: FacilityManager
    description: Client-side facility manager; accepts/rejects assessments, executes remediation, retires systems
    identity: opaque
    exclusive_operations:
      - "POST /fca/asset-systems/{id}/accept-assessment"
      - "POST /fca/asset-systems/{id}/reject-assessment"
      - "POST /fca/asset-systems/{id}/retire"
      - "POST /fca/deficiencies/{id}/start-remediation"
      - "POST /fca/deficiencies/{id}/complete-remediation"
      - "POST /fca/deficiencies/{id}/defer"
      - "POST /fca/deficiencies/{id}/reopen"
    shared_operations:
      - "all GET endpoints"
  - name: CapitalPlanner
    description: Capital planning analyst; drafts plans, models funding scenarios, bundles and phases projects
    identity: opaque
    exclusive_operations:
      - "POST /fca/capital-plans"
      - "POST /fca/capital-plans/{id}/submit"
      - "POST /fca/capital-plans/{id}/revise"
      - "POST /fca/capital-plans/{id}/archive"
      - "POST /fca/funding-scenarios"
      - "POST /fca/funding-scenarios/{id}/run"
      - "POST /fca/project-bundles"
      - "POST /fca/project-bundles/{id}/attach"
    shared_operations:
      - "all GET endpoints"
  - name: Approver
    description: Client executive approving submitted capital plans; may not approve a plan they themselves submitted (segregation of duties with CapitalPlanner)
    identity: opaque
    exclusive_operations:
      - "POST /fca/capital-plans/{id}/approve"
      - "POST /fca/capital-plans/{id}/reject"
    shared_operations:
      - "all GET endpoints"
