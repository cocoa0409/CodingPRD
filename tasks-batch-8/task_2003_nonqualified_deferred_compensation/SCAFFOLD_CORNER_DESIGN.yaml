              as: BenefitsAdministrator
              captures: { p1_id: $.data.id }
            - call: "POST /api/participants"
              payload: { plan_id: "${plan_id}", employee_ref: "EMP-O2", hire_date: "2023-01-02", initial_eligibility_date: "2026-01-05", annual_compensation_cents: 30000000 }
              as: BenefitsAdministrator
              captures: { p2_id: $.data.id }
            - call: "POST /api/accounts"
              payload: { participant_id: "${p1_id}", plan_id: "${plan_id}" }
              as: BenefitsAdministrator
              captures: { acct1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/deferral-elections"
              payload: { participant_id: "${p1_id}", election_window_id: "${window_id}", election_type: "GENERAL", deferral_percent_bp: 5000, notional_fund_id: "${fund_id}" }
              as: Participant
