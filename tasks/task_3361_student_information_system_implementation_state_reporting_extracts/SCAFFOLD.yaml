# =============================================================================
# SCAFFOLD — Student Information System Implementation & State Reporting Extracts
# Task: task_3361_student_information_system_implementation_state_reporting_extracts
# Difficulty directive: much harder than expert level (dense coupling over 13
# entities, ~63 endpoints, cyclic machines, OCC, dual-variant calcs, rollover saga).
# =============================================================================

scenario: |
  Student Information System Implementation & State Reporting Extracts (PowerSchool): district implementation with school year boundary planning, historical data conversion and scheduling module setup, state reporting extract configuration against each state's unique data collection specifications and submission windows, attendance, discipline and program participation coding rules that must match state definitions, master schedule building support with course catalog, section creation and teacher assignment, parent and student portal provisioning with access controls and grade visibility settings, integration with assessment, food service, transportation and learning platforms with roster synchronization, year-end rollover with promotion, graduation and archival, support escalation during state submission deadlines

domain_name: student-information-system
api_prefix: /sis

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
  entity_topology: flat            # all cross-entity links are FK references in bodies; the only nested routes are attendance-event sub-resources
  state_machine_shape: cyclic      # ReportingExtract revision loop, Enrollment parallel dimensions, IntegrationFeed retry loop, Section reopen-free linear+branch
  relationship_patterns:
    - one_to_many
    - many_to_many                 # Student <-> Section roster links (section sub-actions)
    - self_referential             # ReportingExtract.supersedes_extract_id
    - cross_aggregate              # Enrollment references Student + SchoolYear; Extract references SchoolYear + StateCollectionSpec
  role_model: peer_roles           # PlatformAdmin / DistrictAdmin / Registrar / StateReporter own disjoint write surfaces; PortalUser is a self-scoped reader
  consistency_model: immediate     # every mutation and cascade is atomic in-request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter code of the state whose collection specifications bind this district" }
      - { name: status, type: enum, source: system, description: "IMPLEMENTATION | LIVE | SUSPENDED", default: IMPLEMENTATION, constraints: "initial IMPLEMENTATION" }

  - name: SchoolYear
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; owning district" }
      - { name: label, type: string, source: input, description: "Display label, e.g. 2026-2027" }
      - { name: start_date, type: datetime, source: input, description: "Year window start (inclusive)" }
      - { name: end_date, type: datetime, source: input, description: "Year window end (exclusive); must be > start_date" }
      - { name: instructional_days, type: integer, source: input, description: "Declared instructional-day denominator for ADM funding (e.g. 180); must be > 0" }
      - { name: count_date, type: datetime, source: input, description: "Count-date snapshot instant for COUNT_DATE funding; must satisfy start_date <= count_date < end_date" }
      - { name: status, type: enum, source: system, description: "PLANNING | OPEN | CLOSED_FOR_REPORTING | ROLLED_OVER | ARCHIVED", constraints: "initial PLANNING" }

  - name: StateCollectionSpec
    parent: null
    common_fields: true
    fields:
      - { name: state_code, type: string, source: input, description: "State whose data-collection specification this encodes" }
      - { name: funding_method, type: enum, source: input, description: "ADM | COUNT_DATE — selects which FTE variant feeds extract totals" }
      - { name: attendance_code_map, type: object, source: input, description: "raw_code -> { state_code, absence_weight (0.0|0.5|1.0), is_excused }" }
      - { name: discipline_code_map, type: object, source: input, description: "raw_offense -> { state_offense_code, severity_base }" }
      - { name: program_code_map, type: object, source: input, description: "raw_program_code -> { state_program_code, weight_factor }" }
      - { name: submission_window_opens_at, type: datetime, source: input, description: "Submission window open (inclusive)" }
      - { name: submission_window_closes_at, type: datetime, source: input, description: "Submission window close (EXCLUSIVE — half-open window); must be > opens_at" }
      - { name: chronic_absence_threshold, type: number, source: input, default: 0.10, description: "absence_rate >= threshold => CHRONIC band" }
      - { name: auto_withdraw_streak, type: integer, source: input, default: 10, description: "Consecutive calendar-day unexcused full-day absence streak length used by truancy exit inference" }
      - { name: min_membership_days, type: integer, source: input, default: 10, description: "Extract records with membership_days below this are flagged invalid" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | RETIRED", constraints: "initial DRAFT; at most one PUBLISHED per state_code" }

  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; owning district" }
      - { name: student_number, type: string, source: input, description: "District-scoped student number; unique per district among non-ARCHIVED students" }
      - { name: first_name, type: string, source: input, description: "Given name" }
      - { name: last_name, type: string, source: input, description: "Family name" }
      - { name: birth_date, type: datetime, source: input, description: "Date of birth" }
      - { name: entry_grade_level, type: enum, source: input, description: "KG | 01 | 02 | 03 | 04 | 05 | 06 | 07 | 08 | 09 | 10 | 11 | 12 at district entry" }
      - { name: status, type: enum, source: system, description: "PRE_REGISTERED | ENROLLED | INACTIVE | GRADUATED | ARCHIVED", constraints: "initial PRE_REGISTERED; driven by enrollment/rollover cascades" }

  - name: Course
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id; catalog owner" }
      - { name: course_code, type: string, source: input, description: "Catalog code; unique per district" }
      - { name: title, type: string, source: input, description: "Course title" }
      - { name: credit_hours, type: number, source: input, description: "Credit hours granted on completion; > 0" }
      - { name: grade_band, type: enum, source: input, description: "ELEMENTARY | MIDDLE | HIGH | ALL" }
      - { name: state_course_code, type: string, source: input, description: "State course catalog code for reporting" }

  - name: Section
    parent: null
    common_fields: true
    fields:
      - { name: course_id, type: string, source: input, description: "FK -> Course.id" }
      - { name: school_year_id, type: string, source: input, description: "FK -> SchoolYear.id" }
      - { name: teacher_ref, type: string, source: input, description: "Opaque staff reference of the assigned teacher; nullable until assigned", default: null }
      - { name: term_label, type: string, source: input, description: "Free-form term tag, e.g. SEM_1" }
      - { name: room, type: string, source: input, description: "Room identifier; sections meet DAILY in this room" }
      - { name: period_start_min, type: integer, source: input, description: "Meeting start, minutes after midnight (e.g. 480 = 08:00)" }
      - { name: period_end_min, type: integer, source: input, description: "Meeting end, minutes after midnight; must be > period_start_min" }
      - { name: capacity, type: integer, source: input, description: "Seat count; must be > 0" }
      - { name: roster_count, type: integer, source: computed, default: 0, description: "Read-only count of active roster links; input ignored" }
      - { name: status, type: enum, source: system, description: "DRAFT | COMMITTED | LOCKED | CANCELLED", constraints: "initial DRAFT" }

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: school_year_id, type: string, source: input, description: "FK -> SchoolYear.id" }
      - { name: grade_level, type: enum, source: input, description: "KG | 01 | ... | 12 for this year" }
      - { name: program_code, type: string, source: input, default: null, description: "Raw program participation code; nullable; mapped via the state's PUBLISHED spec program_code_map" }
      - { name: state_program_code, type: string, source: computed, default: null, description: "Mapped state program code; null when program_code is null" }
      - { name: program_weight, type: number, source: computed, default: 1.0, description: "weight_factor from spec map; 1.0 when program_code is null" }
      - { name: entry_date, type: datetime, source: input, description: "Current membership segment start (inclusive); must be within [year.start_date, year.end_date)" }
      - { name: exit_date, type: datetime, source: system, default: null, description: "Current membership segment end (exclusive); null while ACTIVE; input on withdraw optional (truancy inference when omitted)" }
      - { name: prior_segment_days, type: integer, source: system, default: 0, description: "Accumulated membership days from completed earlier segments (re-entry history)" }
      - { name: membership_days, type: integer, source: computed, description: "prior_segment_days + days in current segment [entry_date, exit_date or year.end_date) intersected with year window" }
      - { name: absence_weight_sum, type: number, source: computed, default: 0, description: "Sum of absence_weight over all attendance events plus OSS action_days of APPROVED discipline incidents" }
      - { name: absence_rate, type: number, source: computed, default: 0.0, description: "absence_weight_sum / membership_days; 0.0 when membership_days == 0" }
      - { name: fte_adm, type: number, source: computed, description: "round_half_up(min(1.0, membership_days / instructional_days * program_weight), 3)" }
      - { name: fte_count_date, type: number, source: computed, description: "round_half_up(min(1.0, program_weight), 3) when enrolled on year.count_date (entry_date <= count_date AND (exit_date IS NULL OR exit_date > count_date)), else 0.0" }
      - { name: lifecycle, type: enum, source: system, description: "ACTIVE | WITHDRAWN | COMPLETED", constraints: "initial ACTIVE" }
      - { name: absence_posture, type: enum, source: system, description: "CLEAR | AT_RISK | CHRONIC — auto-derived from absence_rate; independent parallel dimension", constraints: "initial CLEAR" }

  - name: AttendanceEvent
    parent: null
    common_fields: false
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> Enrollment.id; taken from the sub-resource path" }
      - { name: attendance_date, type: datetime, source: input, description: "Date of the attendance mark; must lie inside the enrollment's current segment [entry_date, exit_date or +inf)" }
      - { name: raw_code, type: string, source: input, description: "Raw attendance code; must exist in the district state's PUBLISHED spec attendance_code_map" }
      - { name: state_attendance_code, type: string, source: computed, description: "Mapped state code from the spec" }
      - { name: absence_weight, type: number, source: computed, description: "0.0 | 0.5 | 1.0 from the spec map" }
      - { name: is_excused, type: boolean, source: computed, description: "From the spec map" }

  - name: DisciplineIncident
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: enrollment_id, type: string, source: input, description: "FK -> Enrollment.id; the enrollment the incident is booked against" }
      - { name: incident_date, type: datetime, source: input, description: "Date of the incident; must lie inside the enrollment school-year window" }
      - { name: raw_offense_code, type: string, source: input, description: "Raw offense code; must exist in the district state's PUBLISHED spec discipline_code_map" }
      - { name: action_type, type: enum, source: input, description: "NONE | ISS | OSS | EXPULSION" }
      - { name: action_days, type: integer, source: input, description: "Duration of the disciplinary action; must be 0 when action_type is NONE, else > 0" }
      - { name: state_offense_code, type: string, source: computed, description: "Mapped state offense code" }
      - { name: severity_base, type: integer, source: computed, description: "severity_base from the spec map" }
      - { name: severity_score, type: number, source: computed, description: "severity_base * action_days; variant-capped per severity_score_calc" }
      - { name: status, type: enum, source: system, description: "REPORTED | APPROVED | VOIDED", constraints: "initial REPORTED" }

  - name: ReportingExtract
    parent: null
    common_fields: true
    fields:
      - { name: school_year_id, type: string, source: input, description: "FK -> SchoolYear.id; must be CLOSED_FOR_REPORTING" }
      - { name: collection_spec_id, type: string, source: input, description: "FK -> StateCollectionSpec.id; must be PUBLISHED and its state_code must equal the year's district state_code" }
      - { name: generation, type: integer, source: computed, description: "1 + count of prior extracts for the same (school_year_id, collection_spec_id)" }
      - { name: status, type: enum, source: system, description: "DRAFT | VALIDATED | SUBMITTED | ACCEPTED | REJECTED | SUPERSEDED", constraints: "initial DRAFT" }
      - { name: record_count, type: integer, source: computed, description: "Enrollments of the year in any lifecycle state, snapshotted at creation" }
      - { name: invalid_record_count, type: integer, source: computed, description: "Snapshot records with membership_days < spec.min_membership_days; recomputed by validate" }
      - { name: total_fte_millis, type: integer, source: computed, description: "Sum over snapshot records of round_half_up(fte_variant, 3) * 1000 — round-per-record then sum (pinned order)" }
      - { name: chronic_absentee_count, type: integer, source: computed, description: "Snapshot records whose absence_posture is CHRONIC at extract creation" }
      - { name: escalation_priority, type: enum, source: computed, description: "NONE | STANDARD | URGENT — derived on resolve per escalation_priority_calc", default: NONE }
      - { name: supersedes_extract_id, type: string, source: system, default: null, description: "FK -> ReportingExtract.id; the non-submitted extract this one superseded at creation, if any" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of submission" }

  - name: PortalAccount
    parent: null
    common_fields: true
    fields:
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: account_type, type: enum, source: input, description: "PARENT | STUDENT" }
      - { name: access_level, type: enum, source: input, description: "FULL | GRADES_ONLY | ATTENDANCE_ONLY" }
      - { name: grade_visibility, type: enum, source: input, default: CURRENT_TERM_ONLY, description: "ALL_GRADES | CURRENT_TERM_ONLY | HIDDEN" }
      - { name: status, type: enum, source: system, description: "INVITED | ACTIVE | REVOKED", constraints: "initial INVITED" }

  - name: IntegrationFeed
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: platform, type: enum, source: input, description: "ASSESSMENT | FOOD_SERVICE | TRANSPORTATION | LMS; unique per district" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_SYNC | FAILED", constraints: "initial PENDING" }
      - { name: last_synced_roster_count, type: integer, source: computed, default: null, description: "Count of ENROLLED students in the district at last successful sync" }
      - { name: last_synced_at, type: datetime, source: system, default: null, description: "Logical-clock instant of last successful sync" }

  - name: RolloverRun
    parent: null
    common_fields: true
    fields:
      - { name: district_id, type: string, source: input, description: "FK -> District.id" }
      - { name: source_school_year_id, type: string, source: input, description: "FK -> SchoolYear.id; must be CLOSED_FOR_REPORTING at execute" }
      - { name: target_school_year_id, type: string, source: input, description: "FK -> SchoolYear.id; must be OPEN at execute; must differ from source" }
      - { name: status, type: enum, source: system, description: "PENDING | COMMITTED | COMPENSATED | SUPERSEDED", constraints: "initial PENDING" }
      - { name: promoted_count, type: integer, source: computed, default: 0, description: "Enrollments promoted into the target year" }
      - { name: graduated_count, type: integer, source: computed, default: 0, description: "Grade-12 enrollments completed as graduates" }
      - { name: archived_student_count, type: integer, source: computed, default: 0, description: "INACTIVE students archived by this run" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: District
    initial_state: IMPLEMENTATION
    terminal_states: []
    transitions:
      - from: IMPLEMENTATION
        to: LIVE
        trigger: POST /sis/districts/{id}/activate
        actor: PlatformAdmin
        preconditions: ["district.status == IMPLEMENTATION (else ERR_DISTRICT_NOT_ACTIVATABLE)"]
        side_effects: ["increments District.version by 1"]
      - from: SUSPENDED
        to: LIVE
        trigger: POST /sis/districts/{id}/activate
        actor: PlatformAdmin
        preconditions: ["district.status == SUSPENDED (else ERR_DISTRICT_NOT_ACTIVATABLE)"]
        side_effects: ["increments District.version by 1"]
      - from: LIVE
        to: SUSPENDED
        trigger: POST /sis/districts/{id}/suspend
        actor: PlatformAdmin
        preconditions: ["district.status == LIVE (else ERR_DISTRICT_NOT_LIVE)"]
        side_effects: ["increments District.version by 1"]

  - entity: SchoolYear
    initial_state: PLANNING
    terminal_states: [ARCHIVED]
    transitions:
      - from: PLANNING
        to: OPEN
        trigger: POST /sis/school-years/{id}/open
        actor: DistrictAdmin
        preconditions:
          - "year.status == PLANNING (else ERR_YEAR_NOT_PLANNING)"
          - "district.status == LIVE (else ERR_DISTRICT_NOT_LIVE)"
        side_effects: ["increments SchoolYear.version by 1"]
      - from: OPEN
        to: CLOSED_FOR_REPORTING
        trigger: POST /sis/school-years/{id}/close-for-reporting
        actor: DistrictAdmin
        preconditions: ["year.status == OPEN (else ERR_YEAR_NOT_OPEN)"]
        side_effects: ["increments SchoolYear.version by 1"]
      - from: CLOSED_FOR_REPORTING
        to: ROLLED_OVER
        trigger: "system (during RolloverRun execute)"
        actor: system
        preconditions: []
        side_effects: ["sections of this year in COMMITTED -> LOCKED"]
      - from: ROLLED_OVER
        to: ARCHIVED
        trigger: POST /sis/school-years/{id}/archive
        actor: DistrictAdmin
        preconditions: ["year.status == ROLLED_OVER (else ERR_YEAR_NOT_ROLLED_OVER)"]
        side_effects: ["increments SchoolYear.version by 1"]

  - entity: StateCollectionSpec
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /sis/collection-specs/{id}/publish
        actor: PlatformAdmin
        preconditions:
          - "spec.status == DRAFT (else ERR_SPEC_NOT_DRAFT)"
          - "attendance_code_map, discipline_code_map and program_code_map are all non-empty (else ERR_SPEC_MAPS_INCOMPLETE)"
        side_effects:
          - "any other PUBLISHED spec with the same state_code -> RETIRED (auto-retire cascade)"
          - "increments this spec.version by 1"
      - from: PUBLISHED
        to: RETIRED
        trigger: POST /sis/collection-specs/{id}/retire
        actor: PlatformAdmin
        preconditions: ["spec.status == PUBLISHED (else ERR_SPEC_NOT_PUBLISHED)"]
        side_effects: ["increments spec.version by 1"]

  - entity: Student
    initial_state: PRE_REGISTERED
    terminal_states: [GRADUATED, ARCHIVED]
    transitions:
      - from: PRE_REGISTERED
        to: ENROLLED
        trigger: "system (first enrollment becomes ACTIVE)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: INACTIVE
        trigger: "system (when the student's last ACTIVE enrollment is WITHDRAWN or COMPLETED without promotion)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INACTIVE
        to: ENROLLED
        trigger: "system (on enrollment reenter)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENROLLED
        to: GRADUATED
        trigger: "system (rollover execute completes a grade-12 enrollment)"
        actor: system
        preconditions: []
        side_effects: ["every PortalAccount of this student in INVITED or ACTIVE -> REVOKED"]
      - from: INACTIVE
        to: ARCHIVED
        trigger: "system (rollover execute; student holds no ACTIVE enrollment in the source year)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Section
    initial_state: DRAFT
    terminal_states: [LOCKED, CANCELLED]
    transitions:
      - from: DRAFT
        to: COMMITTED
        trigger: POST /sis/sections/{id}/commit
        actor: Registrar
        preconditions:
          - "section.status == DRAFT (else ERR_SECTION_NOT_DRAFT)"
          - "school year of section is OPEN (else ERR_YEAR_NOT_OPEN)"
          - "teacher_ref is non-null (else ERR_TEACHER_REQUIRED)"
          - "no buffered time overlap with any COMMITTED section of the same year sharing room or teacher_ref (else ERR_SECTION_TIME_OVERLAP)"
          - "roster_count <= capacity"
        side_effects: ["increments Section.version by 1"]
      - from: COMMITTED
        to: LOCKED
        trigger: "system (rollover execute on the section's school year)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: CANCELLED
        trigger: POST /sis/sections/{id}/cancel
        actor: Registrar
        preconditions: ["section.status in {DRAFT, COMMITTED} (else ERR_SECTION_NOT_CANCELLABLE)"]
        side_effects: ["all active roster links removed; roster_count -> 0"]
      - from: COMMITTED
        to: CANCELLED
        trigger: POST /sis/sections/{id}/cancel
        actor: Registrar
        preconditions: ["section.status in {DRAFT, COMMITTED}"]
        side_effects: ["all active roster links removed; roster_count -> 0"]

  - entity: Enrollment
    initial_state: ACTIVE
    terminal_states: [COMPLETED]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: POST /sis/enrollments/{id}/withdraw
        actor: Registrar
        preconditions: ["enrollment.lifecycle == ACTIVE (else ERR_ENROLLMENT_NOT_ACTIVE)"]
        side_effects:
          - "exit_date set (supplied value or truancy inference per truancy_exit_inference)"
          - "prior_segment_days += days in [entry_date, exit_date) intersected with year window"
          - "recompute membership_days, absence_rate, fte_adm, fte_count_date and absence_posture"
          - "if the student holds no other ACTIVE enrollment: Student.status ENROLLED -> INACTIVE"
      - from: WITHDRAWN
        to: ACTIVE
        trigger: POST /sis/enrollments/{id}/reenter
        actor: Registrar
        preconditions:
          - "enrollment.lifecycle == WITHDRAWN (else ERR_ENROLLMENT_NOT_WITHDRAWN)"
          - "reentry_date > current exit_date and reentry_date <= school_year.end_date (else ERR_REENTRY_OUTSIDE_YEAR)"
        side_effects:
          - "entry_date := reentry_date; exit_date := null"
          - "recompute membership_days, absence_rate, fte_adm, fte_count_date and absence_posture"
          - "Student.status INACTIVE -> ENROLLED"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (rollover execute on the enrollment's school year)"
        actor: system
        preconditions: []
        side_effects:
          - "grade 12: Student.status ENROLLED -> GRADUATED (which itself revokes the student's portal accounts)"
          - "grade < 12: a new ACTIVE enrollment is created in the target year with grade_level + 1 and entry_date = target.start_date"
  # Parallel dimension on Enrollment: absence_posture (independent of lifecycle)
  - entity: Enrollment
    initial_state: CLEAR
    terminal_states: []
    transitions:
      - from: CLEAR
        to: AT_RISK
        trigger: "system (after attendance event post, withdraw, reenter, or discipline approve/void recompute)"
        actor: system
        preconditions: ["absence_rate >= AT_RISK_THRESHOLD (0.05) and absence_rate < spec.chronic_absence_threshold"]
        side_effects: []
      - from: AT_RISK
        to: CHRONIC
        trigger: "system (same recompute points)"
        actor: system
        preconditions: ["absence_rate >= spec.chronic_absence_threshold"]
        side_effects: []
      - from: CHRONIC
        to: AT_RISK
        trigger: "system (same recompute points — rate can fall when reentry lengthens membership or an OSS void removes weight)"
        actor: system
        preconditions: ["absence_rate >= AT_RISK_THRESHOLD and absence_rate < spec.chronic_absence_threshold"]
        side_effects: []
      - from: AT_RISK
        to: CLEAR
        trigger: "system (same recompute points)"
        actor: system
        preconditions: ["absence_rate < AT_RISK_THRESHOLD"]
        side_effects: []
      - from: CHRONIC
        to: CLEAR
        trigger: "system (same recompute points)"
        actor: system
        preconditions: ["absence_rate < AT_RISK_THRESHOLD"]
        side_effects: []
      - from: CLEAR
        to: CHRONIC
        trigger: "system (same recompute points)"
        actor: system
        preconditions: ["absence_rate >= spec.chronic_absence_threshold"]
        side_effects: []

  - entity: DisciplineIncident
    initial_state: REPORTED
    terminal_states: [VOIDED]
    transitions:
      - from: REPORTED
        to: APPROVED
        trigger: POST /sis/discipline-incidents/{id}/approve
        actor: Registrar
        preconditions: ["incident.status == REPORTED (else ERR_INCIDENT_NOT_REPORTED)"]
        side_effects:
          - "if action_type == OSS: enrollment.absence_weight_sum += action_days * 1.0, then recompute enrollment.absence_rate and absence_posture"
      - from: REPORTED
        to: VOIDED
        trigger: POST /sis/discipline-incidents/{id}/void
        actor: Registrar
        preconditions: ["incident.status in {REPORTED, APPROVED} (else ERR_INCIDENT_ALREADY_VOIDED)"]
        side_effects: []
      - from: APPROVED
        to: VOIDED
        trigger: POST /sis/discipline-incidents/{id}/void
        actor: Registrar
        preconditions: ["incident.status in {REPORTED, APPROVED}"]
        side_effects:
          - "compensation: if action_type == OSS: enrollment.absence_weight_sum -= action_days * 1.0, then recompute absence_rate and absence_posture"

  - entity: ReportingExtract
    initial_state: DRAFT
    terminal_states: [ACCEPTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: POST /sis/reporting-extracts/{id}/validate
        actor: StateReporter
        preconditions: ["extract.status == DRAFT (else ERR_EXTRACT_NOT_DRAFT)"]
        side_effects: ["recompute invalid_record_count against current enrollment data"]
      - from: VALIDATED
        to: DRAFT
        trigger: POST /sis/reporting-extracts/{id}/reopen
        actor: StateReporter
        preconditions: ["extract.status in {VALIDATED, REJECTED} (else ERR_EXTRACT_NOT_DRAFT)"]
        side_effects: ["escalation_priority := NONE"]
      - from: REJECTED
        to: DRAFT
        trigger: POST /sis/reporting-extracts/{id}/reopen
        actor: StateReporter
        preconditions: ["extract.status in {VALIDATED, REJECTED}"]
        side_effects: ["escalation_priority := NONE"]
      - from: VALIDATED
        to: SUBMITTED
        trigger: POST /sis/reporting-extracts/{id}/submit
        actor: StateReporter
        preconditions:
          - "extract.status == VALIDATED (else ERR_EXTRACT_NOT_VALIDATED)"
          - "logical clock within [spec.submission_window_opens_at, spec.submission_window_closes_at) — half-open (else ERR_SUBMISSION_WINDOW_CLOSED)"
          - "invalid_record_count == 0 (else ERR_EXTRACT_HAS_ERRORS)"
        side_effects: ["submitted_at := current logical clock"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: POST /sis/reporting-extracts/{id}/resolve with outcome == ACCEPTED
        actor: StateReporter
        preconditions: ["extract.status == SUBMITTED (else ERR_EXTRACT_NOT_SUBMITTED)"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /sis/reporting-extracts/{id}/resolve with outcome == REJECTED
        actor: StateReporter
        preconditions: ["extract.status == SUBMITTED"]
        side_effects: ["escalation_priority recomputed per escalation_priority_calc (support escalation near the deadline)"]
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (a new extract is created for the same (school_year_id, collection_spec_id))"
        actor: system
        preconditions: []
        side_effects: ["the new extract records supersedes_extract_id := the most recent superseded extract (latest created_at among those superseded by this creation)"]
      - from: VALIDATED
        to: SUPERSEDED
        trigger: "system (same supersede event)"
        actor: system
        preconditions: []
        side_effects: ["same supersedes_extract_id bookkeeping"]
      - from: REJECTED
        to: SUPERSEDED
        trigger: "system (same supersede event)"
        actor: system
        preconditions: []
        side_effects: ["same supersedes_extract_id bookkeeping"]

  - entity: PortalAccount
    initial_state: INVITED
    terminal_states: [REVOKED]
    transitions:
      - from: INVITED
        to: ACTIVE
        trigger: POST /sis/portal-accounts/{id}/activate
        actor: DistrictAdmin
        preconditions: ["account.status == INVITED (else ERR_PORTAL_ACCOUNT_NOT_INVITED)"]
        side_effects: []
      - from: INVITED
        to: REVOKED
        trigger: POST /sis/portal-accounts/{id}/revoke
        actor: DistrictAdmin
        preconditions: ["account.status in {INVITED, ACTIVE} (else ERR_PORTAL_ACCOUNT_REVOKED)"]
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: POST /sis/portal-accounts/{id}/revoke
        actor: DistrictAdmin
        preconditions: ["account.status in {INVITED, ACTIVE}"]
        side_effects: []
      - from: INVITED
        to: REVOKED
        trigger: "system (student becomes GRADUATED during rollover)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "system (student becomes GRADUATED during rollover)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: IntegrationFeed
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: PENDING
        to: IN_SYNC
        trigger: POST /sis/integration-feeds/{id}/sync (district LIVE)
        actor: DistrictAdmin
        preconditions: ["feed.status in {PENDING, FAILED, IN_SYNC} (terminal states none; sync on any of these is legal)"]
        side_effects: ["last_synced_roster_count := count of ENROLLED students in the district; last_synced_at := current logical clock"]
      - from: PENDING
        to: FAILED
        trigger: POST /sis/integration-feeds/{id}/sync (district not LIVE — business outcome, no error)
        actor: DistrictAdmin
        preconditions: []
        side_effects: []
      - from: FAILED
        to: IN_SYNC
        trigger: POST /sis/integration-feeds/{id}/sync (district LIVE)
        actor: DistrictAdmin
        preconditions: []
        side_effects: ["last_synced_roster_count and last_synced_at refreshed"]
      - from: IN_SYNC
        to: IN_SYNC
        trigger: POST /sis/integration-feeds/{id}/sync (district LIVE — re-sync)
        actor: DistrictAdmin
        preconditions: []
        side_effects: ["last_synced_roster_count and last_synced_at refreshed"]
      - from: IN_SYNC
        to: FAILED
        trigger: POST /sis/integration-feeds/{id}/sync (district SUSPENDED)
        actor: DistrictAdmin
        preconditions: []
        side_effects: []

  - entity: RolloverRun
    initial_state: PENDING
    terminal_states: [COMPENSATED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: COMMITTED
        trigger: POST /sis/rollover-runs/{id}/execute
        actor: DistrictAdmin
        preconditions:
          - "run.status == PENDING (else ERR_ROLLOVER_NOT_PENDING)"
          - "source year.status == CLOSED_FOR_REPORTING (else ERR_SOURCE_YEAR_NOT_CLOSED)"
          - "target year.status == OPEN (else ERR_TARGET_YEAR_NOT_OPEN)"
          - "district.status == LIVE (else ERR_DISTRICT_NOT_LIVE)"
          - "no other COMMITTED run exists for the same source year (else ERR_ROLLOVER_ALREADY_COMMITTED)"
        side_effects:
          - "cascade 1: each ACTIVE source-year enrollment -> COMPLETED"
          - "cascade 2: grade-12 completions flip Student ENROLLED -> GRADUATED; each graduation revokes the student's INVITED/ACTIVE portal accounts"
          - "cascade 3: grade<12 completions create new ACTIVE target-year enrollments (grade_level + 1, entry_date = target.start_date)"
          - "cascade 4: INACTIVE students with no ACTIVE source enrollment -> ARCHIVED"
          - "source year -> ROLLED_OVER; its COMMITTED sections -> LOCKED"
          - "promoted_count / graduated_count / archived_student_count recorded"
          - "increments District.version by 1"
      - from: COMMITTED
        to: COMPENSATED
        trigger: POST /sis/rollover-runs/{id}/compensate
        actor: DistrictAdmin
        preconditions: ["run.status == COMMITTED (else ERR_ROLLOVER_NOT_COMMITTED)"]
        side_effects:
          - "target-year enrollments created by this run are deleted"
          - "source-year enrollments completed by this run return COMPLETED -> ACTIVE (exit_date unchanged)"
          - "students graduated by this run return GRADUATED -> ENROLLED; students archived by this run return ARCHIVED -> INACTIVE"
          - "portal accounts revoked by this run's graduations return REVOKED -> ACTIVE"
          - "source year ROLLED_OVER -> CLOSED_FOR_REPORTING; its LOCKED sections -> COMMITTED"
          - "counters reset to 0; increments District.version by 1"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (a new rollover run is created for the same district)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1 — only true races, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: extract-create-stale-year
    parent_entity: SchoolYear
    write_endpoint: POST /sis/reporting-extracts
    occ_field: expected_school_year_version
    description: |
      Creating a ReportingExtract supersedes the previous non-submitted extract for the
      same (school_year, spec) and bumps SchoolYear.version. A create that carries an
      expected_school_year_version older than the year's current version is stale — its
      view of the year's extract lineage is outdated — and is rejected.
    error_id: ERR_STALE_SCHOOL_YEAR_VERSION
    http_status: 412
  - rule_id: rollover-create-stale-district
    parent_entity: District
    write_endpoint: POST /sis/rollover-runs
    occ_field: expected_district_version
    description: |
      Creating a RolloverRun supersedes any PENDING run for the district and bumps
      District.version. A create that carries an expected_district_version older than
      the district's current version is stale and is rejected.
    error_id: ERR_STALE_DISTRICT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: membership_days_calc
    trigger: "enrollment create, withdraw, reenter, rollover promotion"
    algorithm: aggregation
    formula: |
      segment_start = max(enrollment.entry_date, year.start_date)
      segment_end   = min(enrollment.exit_date, year.end_date)   # exit_date null -> year.end_date
      current_segment_days = max(0, whole calendar days in the HALF-OPEN interval [segment_start, segment_end))
      membership_days = enrollment.prior_segment_days + current_segment_days
    input_set: "the enrollment and its school year"
    constants:
      INTERVAL_SEMANTICS: "half-open [start, end)"
    precision: "integer days"

  - name: fte_calculation
    trigger: "enrollment create, withdraw, reenter, and whenever membership_days or program_weight recompute"
    algorithm: threshold
    formula: |
      base = membership_days / year.instructional_days * enrollment.program_weight
      fte_adm = round_half_up(min(FTE_CAP, base), 3)
      eligible = enrollment.entry_date <= year.count_date AND (enrollment.exit_date IS NULL OR enrollment.exit_date > year.count_date)
      fte_count_date = eligible ? round_half_up(min(FTE_CAP, enrollment.program_weight), 3) : 0.0
      Selection: an extract uses fte_adm when its spec.funding_method == ADM, fte_count_date otherwise.
    input_set: "one enrollment + its school year + program_weight from the district state's PUBLISHED spec"
    constants:
      FTE_CAP: 1.0
    precision: "3 decimal places, round_half_up"
    variants:
      - name: ADM
        when: "spec.funding_method == ADM"
        difference: "prorates membership over the instructional-day denominator — a 100-day enrollment in a 180-day year with weight 1.0 yields 0.556"
      - name: COUNT_DATE
        when: "spec.funding_method == COUNT_DATE"
        difference: "binary snapshot on count_date — the same 100-day enrollment spanning the count date yields 1.000"

  - name: absence_rate_calc
    trigger: "attendance event post, enrollment withdraw/reenter, discipline incident approve/void"
    algorithm: threshold
    formula: |
      Evaluation order is PINNED (circular-looking dependency resolved):
        1. absence_weight_sum = sum of absence_weight over ALL AttendanceEvent rows of the enrollment
             + sum of action_days over APPROVED DisciplineIncident rows of the enrollment with action_type == OSS
        2. membership_days per membership_days_calc (denominator)
        3. absence_rate = membership_days == 0 ? 0.0 : absence_weight_sum / membership_days
        4. band: absence_rate >= spec.chronic_absence_threshold -> CHRONIC;
                 AT_RISK_THRESHOLD <= absence_rate < spec.chronic_absence_threshold -> AT_RISK;
                 absence_rate < AT_RISK_THRESHOLD -> CLEAR
      Boundary: the chronic comparison is >= (a rate of exactly the threshold IS chronic).
    input_set: "attendance events and APPROVED OSS incidents of the enrollment; the district state's PUBLISHED spec supplies thresholds"
    constants:
      AT_RISK_THRESHOLD: 0.05
    precision: "rate carried as exact rational; compare without rounding"

  - name: truancy_exit_inference
    trigger: "POST /sis/enrollments/{id}/withdraw when exit_date is omitted"
    algorithm: chronological
    formula: |
      PINNED evaluation order (resolves the circular-looking dependency between the
      streak, the inferred exit, and the membership window the streak is counted over):
        1. Collect the enrollment's attendance events in the CURRENT segment
           (attendance_date >= entry_date), sorted by attendance_date ASC, tie-break created_at ASC.
        2. Scan for the first run of spec.auto_withdraw_streak CONSECUTIVE CALENDAR DAYS
           each holding an unexcused (is_excused == false) event with absence_weight == 1.0.
        3. inferred exit_date = attendance_date of the Nth event of that first run.
        4. If no run exists, inferred exit_date = current logical clock date.
        5. membership_days then recomputes with that exit (half-open), and absence_weight_sum
           counts events whose attendance_date < exit_date only (events ON the exit date excluded).
      If a supplied exit_date is present, steps 1-4 are skipped.
    input_set: "attendance events of the enrollment's current segment; spec.auto_withdraw_streak"
    constants: {}
    precision: "date granularity (midnight-to-midnight days)"

  - name: extract_snapshot_totals
    trigger: "POST /sis/reporting-extracts (creation snapshot); validate recomputes invalid_record_count only"
    algorithm: aggregation
    formula: |
      record_set = enrollments of the school year in ANY lifecycle state {ACTIVE, WITHDRAWN, COMPLETED}
      record_count = |record_set|
      chronic_absentee_count = |{ e in record_set : e.absence_posture == CHRONIC }|
      total_fte_millis = sum over record_set of ( round_half_up(fte_variant(e), 3) * 1000 )
        where fte_variant is fte_adm or fte_count_date per spec.funding_method
      ROUNDING ORDER PINNED: each per-record fte is rounded to 3 decimals BEFORE summing
        (sum-then-round is a different, rejected order: two 0.444 records total 888 millis, not 889).
      invalid_record_count = |{ e in record_set : e.membership_days < spec.min_membership_days }|
    input_set: "all enrollments of the extract's school year regardless of lifecycle"
    constants: {}
    precision: "per-record 3 decimals round_half_up; totals integer millis"

  - name: severity_score_calc
    trigger: "discipline incident creation"
    algorithm: threshold
    formula: |
      raw = severity_base * action_days
      CAPPED variant:   severity_score = min(raw, SEVERITY_CAP)   when action_type in {NONE, ISS, OSS}
      UNCAPPED variant: severity_score = raw                      when action_type == EXPULSION
      Example: severity_base 25, action_days 6 -> OSS yields 100, EXPULSION yields 150.
    input_set: "one incident; severity_base from the spec discipline_code_map"
    constants:
      SEVERITY_CAP: 100
    precision: "integer"
    variants:
      - name: CAPPED
        when: "action_type in {NONE, ISS, OSS}"
        difference: "result clipped at SEVERITY_CAP (100)"
      - name: UNCAPPED
        when: "action_type == EXPULSION"
        difference: "no clip — the same inputs can exceed the cap (150 vs 100)"

  - name: escalation_priority_calc
    trigger: "ReportingExtract resolve to REJECTED; reopen resets to NONE"
    algorithm: threshold
    formula: |
      hours_to_close = (spec.submission_window_closes_at - current logical clock) in hours
      escalation_priority = URGENT   when hours_to_close <= ESCALATION_WINDOW_HOURS
                          = STANDARD otherwise
      Boundary: exactly 48 hours remaining IS urgent (<= comparison).
    input_set: "the extract's spec window and the logical clock"
    constants:
      ESCALATION_WINDOW_HOURS: 48
    precision: "whole hours, floor"

  - name: roster_seat_tracking
    trigger: "POST /sis/sections/{id}/roster-adds and /roster-drops"
    algorithm: aggregation
    formula: |
      section.roster_count = count of ACTIVE roster links of the section
      roster-add rejected when roster_count >= capacity (ERR_CAPACITY_EXCEEDED) — the == boundary rejects.
      INVARIANT (compensating pair): add(enrollment e) then drop(enrollment e) leaves
      roster_count unchanged versus before the pair.
    input_set: "active roster links of the section"
    constants: {}
    precision: "integer"

  - name: sync_roster_snapshot
    trigger: "POST /sis/integration-feeds/{id}/sync when district is LIVE"
    algorithm: aggregation
    formula: |
      last_synced_roster_count = count of Students of the district with status == ENROLLED
      last_synced_at = current logical clock
      district not LIVE -> feed transitions to FAILED with no counter change (business outcome, not an error).
    input_set: "students of the feed's district"
    constants: {}
    precision: "integer"

  - name: rollover_conservation
    trigger: "RolloverRun execute and compensate"
    algorithm: aggregation
    formula: |
      INVARIANT (compensating pair): execute followed by compensate on the same run restores
        - count of ACTIVE enrollments per school year to the pre-execute value
        - every Student.status to the pre-execute value
        - every portal account status revoked by the run to ACTIVE
        - source SchoolYear.status to CLOSED_FOR_REPORTING and its sections to COMMITTED
      A run that completes execute but whose compensate leaves any of these drifted violates the invariant.
    input_set: "all enrollments/students/sections touched by the run"
    constants: {}
    precision: "integer counts"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: all
  - priority: 2
    category: auth
    check: "Request body well-formed: required fields present, enum values in declared sets, numeric ranges sane"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 3
    category: auth
    check: "Role permitted for this endpoint; PortalUser may only GET the PortalAccount whose id equals X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 4
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with path ids
  - priority: 5
    category: state
    check: "Target resource state preconditions for the requested transition (per-machine ERR_* codes); also District LIVE gates (year open, enrollment create, rollover execute)"
    error_id: "state-specific (ERR_DISTRICT_NOT_LIVE, ERR_YEAR_NOT_OPEN, ERR_YEAR_NOT_PLANNING, ERR_EXTRACT_NOT_VALIDATED, ERR_SECTION_NOT_ROSTERABLE, ERR_PORTAL_ACCOUNT_REVOKED, ...)"
    http_status: 409
    applies_to: state-transition and state-gated endpoints
  - priority: 6
    category: business_referential
    check: "Body foreign keys reference existing entities; cross-district references rejected (student.district_id must equal year.district_id, etc.)"
    error_id: "ERR_REFERENCED_ENTITY_NOT_FOUND | ERR_DISTRICT_MISMATCH"
    http_status: 422
    applies_to: POST endpoints with body FKs
  - priority: 7
    category: business_temporal
    check: "Temporal coherence: end>start; count_date within year; entry within [year.start, year.end); exit within (entry, year.end]; reentry after exit; attendance date inside current segment; school-year windows of one district do not overlap (half-open, adjacency allowed); section buffered overlap (10 min) on shared room/teacher among COMMITTED sections; submission window half-open"
    error_id: "ERR_INVALID_DATE_RANGE | ERR_COUNT_DATE_OUTSIDE_YEAR | ERR_ENTRY_OUTSIDE_YEAR | ERR_WITHDRAWAL_OUTSIDE_YEAR | ERR_REENTRY_OUTSIDE_YEAR | ERR_ATTENDANCE_OUTSIDE_ENROLLMENT | ERR_YEAR_WINDOW_OVERLAP | ERR_SECTION_TIME_OVERLAP | ERR_SUBMISSION_WINDOW_CLOSED"
    http_status: 422
    applies_to: create/transition endpoints carrying dates or intervals
  - priority: 8
    category: business_constraint
    check: "Coding maps and uniqueness: raw codes must map via the district state's PUBLISHED spec (else ERR_UNMAPPED_*; absent PUBLISHED spec -> ERR_SPEC_NOT_PUBLISHED); unique student_number/course_code per district, one ACTIVE-or-WITHDRAWN enrollment per (student, year), one active roster link per (section, enrollment), one feed per (district, platform); section commit requires teacher_ref"
    error_id: "ERR_SPEC_NOT_PUBLISHED | ERR_UNMAPPED_ATTENDANCE_CODE | ERR_UNMAPPED_DISCIPLINE_CODE | ERR_UNMAPPED_PROGRAM_CODE | ERR_DUPLICATE_STUDENT_NUMBER | ERR_DUPLICATE_COURSE_CODE | ERR_DUPLICATE_ENROLLMENT | ERR_DUPLICATE_ROSTER | ERR_DUPLICATE_FEED | ERR_TEACHER_REQUIRED"
    http_status: 422
    applies_to: create endpoints and section commit
  - priority: 9
    category: business_constraint
    check: "Capacity: roster-add allowed only while roster_count < capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: POST /sis/sections/{id}/roster-adds

# =============================================================================
# Table 5 preamble: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time is fixed) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Before any call the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: []

  # --- District ---
  - method: POST
    path: "/sis/districts"
    description: "Create a district in IMPLEMENTATION"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code]
    output: District
    side_effects: ["status = IMPLEMENTATION"]
  - method: GET
    path: "/sis/districts"
    description: "List districts"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "District[]"
    side_effects: []
  - method: GET
    path: "/sis/districts/{id}"
    description: "Get one district (current OCC version readable here)"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: []
    output: District
    side_effects: []
  - method: POST
    path: "/sis/districts/{id}/activate"
    description: "IMPLEMENTATION or SUSPENDED -> LIVE"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: District
    side_effects: ["status -> LIVE", "increments District.version by 1"]
  - method: POST
    path: "/sis/districts/{id}/suspend"
    description: "LIVE -> SUSPENDED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: District
    side_effects: ["status -> SUSPENDED", "increments District.version by 1"]

  # --- SchoolYear ---
  - method: POST
    path: "/sis/school-years"
    description: "Create a school year in PLANNING; half-open [start_date, end_date) windows of one district must not overlap (adjacency allowed)"
    roles: [DistrictAdmin]
    code: 201
    input: [district_id, label, start_date, end_date, instructional_days, count_date]
    output: SchoolYear
    side_effects: ["status = PLANNING"]
  - method: GET
    path: "/sis/school-years"
    description: "List school years"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["district_id?", "status?", "limit?", "offset?"]
    output: "SchoolYear[]"
    side_effects: []
  - method: GET
    path: "/sis/school-years/{id}"
    description: "Get one school year"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: []
    output: SchoolYear
    side_effects: []
  - method: POST
    path: "/sis/school-years/{id}/open"
    description: "PLANNING -> OPEN (requires district LIVE)"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: SchoolYear
    side_effects: ["status -> OPEN", "increments SchoolYear.version by 1"]
  - method: POST
    path: "/sis/school-years/{id}/close-for-reporting"
    description: "OPEN -> CLOSED_FOR_REPORTING"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: SchoolYear
    side_effects: ["status -> CLOSED_FOR_REPORTING", "increments SchoolYear.version by 1"]
  - method: POST
    path: "/sis/school-years/{id}/archive"
    description: "ROLLED_OVER -> ARCHIVED"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: SchoolYear
    side_effects: ["status -> ARCHIVED", "increments SchoolYear.version by 1"]

  # --- StateCollectionSpec ---
  - method: POST
    path: "/sis/collection-specs"
    description: "Create a state collection spec in DRAFT"
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, funding_method, attendance_code_map, discipline_code_map, program_code_map, submission_window_opens_at, submission_window_closes_at, "chronic_absence_threshold?", "auto_withdraw_streak?", "min_membership_days?"]
    output: StateCollectionSpec
    side_effects: ["status = DRAFT"]
  - method: GET
    path: "/sis/collection-specs"
    description: "List specs"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: "StateCollectionSpec[]"
    side_effects: []
  - method: POST
    path: "/sis/collection-specs/{id}/publish"
    description: "DRAFT -> PUBLISHED; auto-retires any other PUBLISHED spec of the same state_code"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: StateCollectionSpec
    side_effects: ["status -> PUBLISHED", "prior PUBLISHED spec for state -> RETIRED"]
  - method: POST
    path: "/sis/collection-specs/{id}/retire"
    description: "PUBLISHED -> RETIRED"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: StateCollectionSpec
    side_effects: ["status -> RETIRED"]

  # --- Student ---
  - method: POST
    path: "/sis/students"
    description: "Register a student (PRE_REGISTERED)"
    roles: [Registrar]
    code: 201
    input: [district_id, student_number, first_name, last_name, birth_date, entry_grade_level]
    output: Student
    side_effects: ["status = PRE_REGISTERED"]
  - method: GET
    path: "/sis/students"
    description: "List students; ARCHIVED students excluded unless status=ARCHIVED is passed"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["district_id?", "status?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []
  - method: GET
    path: "/sis/students/{id}"
    description: "Get one student"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: []
    output: Student
    side_effects: []

  # --- Course ---
  - method: POST
    path: "/sis/courses"
    description: "Create a course catalog entry"
    roles: [Registrar]
    code: 201
    input: [district_id, course_code, title, credit_hours, grade_band, state_course_code]
    output: Course
    side_effects: []
  - method: GET
    path: "/sis/courses"
    description: "List courses"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["district_id?", "limit?", "offset?"]
    output: "Course[]"
    side_effects: []

  # --- Section ---
  - method: POST
    path: "/sis/sections"
    description: "Create a section in DRAFT (course and year must exist and share the district)"
    roles: [Registrar]
    code: 201
    input: [course_id, school_year_id, "teacher_ref?", term_label, room, period_start_min, period_end_min, capacity]
    output: Section
    side_effects: ["status = DRAFT", "roster_count = 0"]
  - method: GET
    path: "/sis/sections"
    description: "List sections"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["school_year_id?", "course_id?", "teacher_ref?", "room?", "status?", "limit?", "offset?"]
    output: "Section[]"
    side_effects: []
  - method: GET
    path: "/sis/courses/{id}"
    description: "Get one course"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: []
    output: Course
    side_effects: []
  - method: GET
    path: "/sis/sections/{id}"
    description: "Get one section"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: []
    output: Section
    side_effects: []
  - method: GET
    path: "/sis/sections/{id}/roster"
    description: "Rostered enrollments of the section (active links only)"
    roles: [DistrictAdmin, Registrar]
    code: 200
    input: []
    output: "Enrollment[]"
    side_effects: []
  - method: POST
    path: "/sis/sections/{id}/commit"
    description: "DRAFT -> COMMITTED; validates year OPEN, teacher present, buffered time overlap, capacity"
    roles: [Registrar]
    code: 200
    input: []
    output: Section
    side_effects: ["status -> COMMITTED", "increments Section.version by 1"]
  - method: POST
    path: "/sis/sections/{id}/cancel"
    description: "DRAFT|COMMITTED -> CANCELLED; clears roster"
    roles: [Registrar]
    code: 200
    input: []
    output: Section
    side_effects: ["status -> CANCELLED", "roster cleared, roster_count -> 0"]
  - method: POST
    path: "/sis/sections/{id}/assign-teacher"
    description: "Assign or replace teacher_ref (null unassigns); allowed in DRAFT or COMMITTED"
    roles: [Registrar]
    code: 200
    input: [teacher_ref]
    output: Section
    side_effects: ["teacher_ref updated", "increments Section.version by 1"]
  - method: POST
    path: "/sis/sections/{id}/roster-adds"
    description: "Add an ACTIVE enrollment to the section roster (DRAFT or COMMITTED section; capacity enforced)"
    roles: [Registrar]
    code: 201
    input: [enrollment_id]
    output: Section
    side_effects: ["roster link created", "roster_count += 1"]
  - method: POST
    path: "/sis/sections/{id}/roster-drops"
    description: "Drop an enrollment from the section roster"
    roles: [Registrar]
    code: 200
    input: [enrollment_id]
    output: Section
    side_effects: ["roster link removed", "roster_count -= 1"]

  # --- Enrollment ---
  - method: POST
    path: "/sis/enrollments"
    description: "Create an ACTIVE enrollment (district LIVE, year OPEN, one enrollment per student per year); program_code mapped via the district state's PUBLISHED spec"
    roles: [Registrar]
    code: 201
    input: [student_id, school_year_id, grade_level, entry_date, "program_code?"]
    output: Enrollment
    side_effects:
      - "lifecycle = ACTIVE; absence_posture = CLEAR"
      - "membership_days, fte_adm, fte_count_date computed"
      - "student PRE_REGISTERED -> ENROLLED"
  - method: GET
    path: "/sis/enrollments"
    description: "List enrollments"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["student_id?", "school_year_id?", "lifecycle?", "absence_posture?", "limit?", "offset?"]
    output: "Enrollment[]"
    side_effects: []
  - method: GET
    path: "/sis/enrollments/{id}"
    description: "Get one enrollment"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: []
    output: Enrollment
    side_effects: []
  - method: POST
    path: "/sis/enrollments/{id}/withdraw"
    description: "ACTIVE -> WITHDRAWN; exit_date supplied or inferred by truancy_exit_inference"
    roles: [Registrar]
    code: 200
    input: ["exit_date?"]
    output: Enrollment
    side_effects:
      - "exit_date set; prior_segment_days accumulated; membership/rate/fte recomputed"
      - "student ENROLLED -> INACTIVE when no other ACTIVE enrollment"
  - method: POST
    path: "/sis/enrollments/{id}/reenter"
    description: "WITHDRAWN -> ACTIVE; opens a new membership segment"
    roles: [Registrar]
    code: 200
    input: [reentry_date]
    output: Enrollment
    side_effects:
      - "entry_date := reentry_date; exit_date := null; recomputes"
      - "student INACTIVE -> ENROLLED"
  - method: POST
    path: "/sis/enrollments/{id}/attendance-events"
    description: "Post an attendance mark to the enrollment (raw code mapped via the district state's PUBLISHED spec; posture recomputed)"
    roles: [Registrar]
    code: 201
    input: [attendance_date, raw_code]
    output: AttendanceEvent
    side_effects: ["state_attendance_code / absence_weight / is_excused mapped", "enrollment.absence_weight_sum, absence_rate, absence_posture recomputed"]
  - method: GET
    path: "/sis/enrollments/{id}/attendance-events"
    description: "List attendance events of the enrollment, ordered attendance_date ASC then created_at ASC"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["limit?", "offset?"]
    output: "AttendanceEvent[]"
    side_effects: []

  # --- DisciplineIncident ---
  - method: POST
    path: "/sis/discipline-incidents"
    description: "Report a discipline incident (raw offense mapped via the district state's PUBLISHED spec; severity_score computed)"
    roles: [Registrar]
    code: 201
    input: [student_id, enrollment_id, incident_date, raw_offense_code, action_type, action_days]
    output: DisciplineIncident
    side_effects: ["state_offense_code / severity_base / severity_score computed", "status = REPORTED"]
  - method: GET
    path: "/sis/discipline-incidents"
    description: "List discipline incidents"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["student_id?", "enrollment_id?", "status?", "limit?", "offset?"]
    output: "DisciplineIncident[]"
    side_effects: []
  - method: GET
    path: "/sis/discipline-incidents/{id}"
    description: "Get one incident"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: []
    output: DisciplineIncident
    side_effects: []
  - method: POST
    path: "/sis/discipline-incidents/{id}/approve"
    description: "REPORTED -> APPROVED; OSS days cascade into the enrollment's absence_weight_sum"
    roles: [Registrar]
    code: 200
    input: []
    output: DisciplineIncident
    side_effects: ["status -> APPROVED", "OSS: enrollment.absence_weight_sum += action_days; rate/posture recomputed"]
  - method: POST
    path: "/sis/discipline-incidents/{id}/void"
    description: "REPORTED|APPROVED -> VOIDED; voiding an APPROVED OSS incident reverses the absence cascade"
    roles: [Registrar]
    code: 200
    input: []
    output: DisciplineIncident
    side_effects: ["status -> VOIDED", "compensation: OSS absence_weight_sum reversed; rate/posture recomputed"]

  # --- ReportingExtract ---
  - method: POST
    path: "/sis/reporting-extracts"
    description: "Create a DRAFT extract snapshot for a CLOSED_FOR_REPORTING year against a PUBLISHED spec of the same state; supersedes prior non-submitted extracts for the same (year, spec); OCC on SchoolYear.version"
    roles: [StateReporter]
    code: 201
    input: [school_year_id, collection_spec_id, expected_school_year_version]
    output: ReportingExtract
    side_effects:
      - "record_count / total_fte_millis / chronic_absentee_count / invalid_record_count snapshotted"
      - "prior DRAFT|VALIDATED|REJECTED extracts for (year, spec) -> SUPERSEDED; supersedes_extract_id recorded"
      - "increments SchoolYear.version by 1"
  - method: GET
    path: "/sis/reporting-extracts"
    description: "List extracts"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["school_year_id?", "collection_spec_id?", "supersedes_extract_id?", "status?", "limit?", "offset?"]
    output: "ReportingExtract[]"
    side_effects: []
  - method: GET
    path: "/sis/reporting-extracts/{id}"
    description: "Get one extract"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: []
    output: ReportingExtract
    side_effects: []
  - method: POST
    path: "/sis/reporting-extracts/{id}/validate"
    description: "DRAFT -> VALIDATED; recomputes invalid_record_count"
    roles: [StateReporter]
    code: 200
    input: []
    output: ReportingExtract
    side_effects: ["status -> VALIDATED", "invalid_record_count recomputed"]
  - method: POST
    path: "/sis/reporting-extracts/{id}/reopen"
    description: "VALIDATED|REJECTED -> DRAFT; clears escalation_priority"
    roles: [StateReporter]
    code: 200
    input: []
    output: ReportingExtract
    side_effects: ["status -> DRAFT", "escalation_priority := NONE"]
  - method: POST
    path: "/sis/reporting-extracts/{id}/submit"
    description: "VALIDATED -> SUBMITTED inside the half-open submission window with zero invalid records"
    roles: [StateReporter]
    code: 200
    input: []
    output: ReportingExtract
    side_effects: ["status -> SUBMITTED", "submitted_at := logical clock"]
  - method: POST
    path: "/sis/reporting-extracts/{id}/resolve"
    description: "SUBMITTED -> ACCEPTED | REJECTED (state authority outcome); REJECTED recomputes escalation_priority"
    roles: [StateReporter]
    code: 200
    input: [outcome]
    output: ReportingExtract
    side_effects: ["status -> outcome", "on REJECTED: escalation_priority per escalation_priority_calc"]

  # --- PortalAccount ---
  - method: POST
    path: "/sis/portal-accounts"
    description: "Provision a parent or student portal account (INVITED)"
    roles: [DistrictAdmin]
    code: 201
    input: [student_id, account_type, access_level, "grade_visibility?"]
    output: PortalAccount
    side_effects: ["status = INVITED"]
  - method: GET
    path: "/sis/portal-accounts"
    description: "List portal accounts"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["student_id?", "status?", "limit?", "offset?"]
    output: "PortalAccount[]"
    side_effects: []
  - method: GET
    path: "/sis/portal-accounts/{id}"
    description: "Get one portal account; PortalUser callers must match the account id"
    roles: [DistrictAdmin, PortalUser]
    code: 200
    input: []
    output: PortalAccount
    side_effects: []
  - method: POST
    path: "/sis/portal-accounts/{id}/activate"
    description: "INVITED -> ACTIVE"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: PortalAccount
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/sis/portal-accounts/{id}/revoke"
    description: "INVITED|ACTIVE -> REVOKED"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: PortalAccount
    side_effects: ["status -> REVOKED"]
  - method: POST
    path: "/sis/portal-accounts/{id}/update-access"
    description: "Update access_level and/or grade_visibility while not REVOKED"
    roles: [DistrictAdmin]
    code: 200
    input: ["access_level?", "grade_visibility?"]
    output: PortalAccount
    side_effects: ["fields updated; increments PortalAccount.version by 1"]

  # --- IntegrationFeed ---
  - method: POST
    path: "/sis/integration-feeds"
    description: "Register an integration feed for a platform (PENDING); one per (district, platform)"
    roles: [DistrictAdmin]
    code: 201
    input: [district_id, platform]
    output: IntegrationFeed
    side_effects: ["status = PENDING"]
  - method: GET
    path: "/sis/integration-feeds"
    description: "List integration feeds"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["district_id?", "platform?", "status?", "limit?", "offset?"]
    output: "IntegrationFeed[]"
    side_effects: []
  - method: GET
    path: "/sis/integration-feeds/{id}"
    description: "Get one feed"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: []
    output: IntegrationFeed
    side_effects: []
  - method: POST
    path: "/sis/integration-feeds/{id}/sync"
    description: "Synchronize the roster snapshot; succeeds only while the district is LIVE, otherwise the feed lands in FAILED"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: IntegrationFeed
    side_effects: ["on success: status -> IN_SYNC, last_synced_roster_count/last_synced_at set; on district not LIVE: status -> FAILED"]

  # --- RolloverRun ---
  - method: POST
    path: "/sis/rollover-runs"
    description: "Create a PENDING rollover run; supersedes any PENDING run of the district; OCC on District.version"
    roles: [DistrictAdmin]
    code: 201
    input: [district_id, source_school_year_id, target_school_year_id, expected_district_version]
    output: RolloverRun
    side_effects: ["prior PENDING runs of the district -> SUPERSEDED", "increments District.version by 1"]
  - method: GET
    path: "/sis/rollover-runs"
    description: "List rollover runs"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: ["district_id?", "source_school_year_id?", "target_school_year_id?", "status?", "limit?", "offset?"]
    output: "RolloverRun[]"
    side_effects: []
  - method: GET
    path: "/sis/rollover-runs/{id}"
    description: "Get one rollover run"
    roles: [PlatformAdmin, DistrictAdmin, Registrar, StateReporter]
    code: 200
    input: []
    output: RolloverRun
    side_effects: []
  - method: POST
    path: "/sis/rollover-runs/{id}/execute"
    description: "PENDING -> COMMITTED; runs the full promotion/graduation/archival cascade"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: RolloverRun
    side_effects: ["see RolloverRun PENDING->COMMITTED side_effects (enrollments, students, portal accounts, source year, sections, counters, District.version)"]
  - method: POST
    path: "/sis/rollover-runs/{id}/compensate"
    description: "COMMITTED -> COMPENSATED; reverses the execute cascade per rollover_conservation"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: RolloverRun
    side_effects: ["see RolloverRun COMMITTED->COMPENSATED side_effects"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing or role not declared" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, malformed value, or enum value outside the declared set" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or PortalUser X-User-ID does not equal the target PortalAccount id" }
  # --- existence ---
  - { id: ERR_DISTRICT_NOT_FOUND, http: 404, condition: "No district with the given id" }
  - { id: ERR_SCHOOL_YEAR_NOT_FOUND, http: 404, condition: "No school year with the given id" }
  - { id: ERR_SPEC_NOT_FOUND, http: 404, condition: "No collection spec with the given id" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "No student with the given id" }
  - { id: ERR_COURSE_NOT_FOUND, http: 404, condition: "No course with the given id" }
  - { id: ERR_SECTION_NOT_FOUND, http: 404, condition: "No section with the given id" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "No enrollment with the given id" }
  - { id: ERR_INCIDENT_NOT_FOUND, http: 404, condition: "No discipline incident with the given id" }
  - { id: ERR_EXTRACT_NOT_FOUND, http: 404, condition: "No reporting extract with the given id" }
  - { id: ERR_PORTAL_ACCOUNT_NOT_FOUND, http: 404, condition: "No portal account with the given id" }
  - { id: ERR_FEED_NOT_FOUND, http: 404, condition: "No integration feed with the given id" }
  - { id: ERR_ROLLOVER_RUN_NOT_FOUND, http: 404, condition: "No rollover run with the given id" }
  - { id: ERR_ROSTER_NOT_FOUND, http: 404, condition: "No active roster link for the given enrollment in this section" }
  # --- state ---
  - { id: ERR_DISTRICT_NOT_ACTIVATABLE, http: 409, condition: "Activate requires district IMPLEMENTATION or SUSPENDED" }
  - { id: ERR_DISTRICT_NOT_LIVE, http: 409, condition: "Operation requires district LIVE (year open, enrollment create, rollover execute, feed sync success path, suspend)" }
  - { id: ERR_YEAR_NOT_PLANNING, http: 409, condition: "Open requires year PLANNING" }
  - { id: ERR_YEAR_NOT_OPEN, http: 409, condition: "Operation requires year OPEN (close-for-reporting, section commit, enrollment create)" }
  - { id: ERR_YEAR_NOT_ROLLED_OVER, http: 409, condition: "Archive requires year ROLLED_OVER" }
  - { id: ERR_SPEC_NOT_DRAFT, http: 409, condition: "Publish requires spec DRAFT" }
  - { id: ERR_SPEC_NOT_PUBLISHED, http: 409, condition: "Operation requires a PUBLISHED spec for the district's state (extract create, attendance/discipline/program code mapping, spec retire)" }
  - { id: ERR_SPEC_MAPS_INCOMPLETE, http: 409, condition: "Publish requires all three code maps non-empty" }
  - { id: ERR_ENROLLMENT_NOT_ACTIVE, http: 409, condition: "Withdraw or roster-add requires enrollment lifecycle ACTIVE" }
  - { id: ERR_ENROLLMENT_NOT_WITHDRAWN, http: 409, condition: "Reenter requires enrollment lifecycle WITHDRAWN" }
  - { id: ERR_SECTION_NOT_DRAFT, http: 409, condition: "Commit requires section DRAFT" }
  - { id: ERR_SECTION_NOT_CANCELLABLE, http: 409, condition: "Cancel requires section DRAFT or COMMITTED" }
  - { id: ERR_SECTION_NOT_ROSTERABLE, http: 409, condition: "Roster-add/drop requires section DRAFT or COMMITTED" }
  - { id: ERR_INCIDENT_NOT_REPORTED, http: 409, condition: "Approve requires incident REPORTED" }
  - { id: ERR_INCIDENT_ALREADY_VOIDED, http: 409, condition: "Incident already VOIDED; no further transitions" }
  - { id: ERR_EXTRACT_NOT_DRAFT, http: 409, condition: "Validate or reopen requires extract DRAFT / VALIDATED-or-REJECTED respectively; also any mutation on SUPERSEDED or ACCEPTED extracts" }
  - { id: ERR_EXTRACT_NOT_VALIDATED, http: 409, condition: "Submit requires extract VALIDATED" }
  - { id: ERR_EXTRACT_NOT_SUBMITTED, http: 409, condition: "Resolve requires extract SUBMITTED" }
  - { id: ERR_EXTRACT_HAS_ERRORS, http: 409, condition: "Submit blocked while invalid_record_count > 0" }
  - { id: ERR_PORTAL_ACCOUNT_NOT_INVITED, http: 409, condition: "Activate requires account INVITED" }
  - { id: ERR_PORTAL_ACCOUNT_REVOKED, http: 409, condition: "Account already REVOKED; no further transitions or updates" }
  - { id: ERR_SOURCE_YEAR_NOT_CLOSED, http: 409, condition: "Rollover execute requires source year CLOSED_FOR_REPORTING" }
  - { id: ERR_TARGET_YEAR_NOT_OPEN, http: 409, condition: "Rollover execute requires target year OPEN" }
  - { id: ERR_ROLLOVER_NOT_PENDING, http: 409, condition: "Execute requires run PENDING" }
  - { id: ERR_ROLLOVER_ALREADY_COMMITTED, http: 409, condition: "Another COMMITTED run already exists for the source year" }
  - { id: ERR_ROLLOVER_NOT_COMMITTED, http: 409, condition: "Compensate requires run COMMITTED" }
  # --- referential / temporal / constraint ---
  - { id: ERR_REFERENCED_ENTITY_NOT_FOUND, http: 422, condition: "A body foreign key references a non-existent entity" }
  - { id: ERR_DISTRICT_MISMATCH, http: 422, condition: "Referenced entities belong to different districts (student vs year, course vs year, enrollment vs student, extract year vs spec state_code)" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "end not after start (school year window, section period, spec submission window)" }
  - { id: ERR_COUNT_DATE_OUTSIDE_YEAR, http: 422, condition: "count_date not within [start_date, end_date)" }
  - { id: ERR_ENTRY_OUTSIDE_YEAR, http: 422, condition: "entry_date not within [year.start_date, year.end_date)" }
  - { id: ERR_WITHDRAWAL_OUTSIDE_YEAR, http: 422, condition: "exit_date must satisfy entry_date < exit_date <= year.end_date" }
  - { id: ERR_REENTRY_OUTSIDE_YEAR, http: 422, condition: "reentry_date must satisfy exit_date < reentry_date <= year.end_date" }
  - { id: ERR_ATTENDANCE_OUTSIDE_ENROLLMENT, http: 422, condition: "attendance_date outside the enrollment's current segment [entry_date, exit_date or +inf)" }
  - { id: ERR_YEAR_WINDOW_OVERLAP, http: 409, condition: "School year window overlaps an existing year of the district; half-open adjacency (end == start) is allowed" }
  - { id: ERR_SECTION_TIME_OVERLAP, http: 409, condition: "Committed section shares room or teacher_ref with the candidate and the gap between windows is < 10 minutes; exact adjacency is rejected" }
  - { id: ERR_SUBMISSION_WINDOW_CLOSED, http: 409, condition: "Logical clock outside the half-open [opens_at, closes_at) submission window" }
  - { id: ERR_UNMAPPED_ATTENDANCE_CODE, http: 422, condition: "raw_code absent from the PUBLISHED spec attendance_code_map" }
  - { id: ERR_UNMAPPED_DISCIPLINE_CODE, http: 422, condition: "raw_offense_code absent from the PUBLISHED spec discipline_code_map" }
  - { id: ERR_UNMAPPED_PROGRAM_CODE, http: 422, condition: "program_code absent from the PUBLISHED spec program_code_map" }
  - { id: ERR_TEACHER_REQUIRED, http: 422, condition: "Section commit requires a non-null teacher_ref" }
  - { id: ERR_DUPLICATE_STUDENT_NUMBER, http: 409, condition: "student_number already used by a non-ARCHIVED student of the district" }
  - { id: ERR_DUPLICATE_COURSE_CODE, http: 409, condition: "course_code already used in the district" }
  - { id: ERR_DUPLICATE_ENROLLMENT, http: 409, condition: "Student already has an enrollment (any lifecycle) in this school year" }
  - { id: ERR_DUPLICATE_ROSTER, http: 409, condition: "Enrollment already actively rostered in this section" }
  - { id: ERR_DUPLICATE_FEED, http: 409, condition: "A feed for this platform already exists in the district" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 409, condition: "roster_count >= capacity; the section is full" }
  # --- OCC ---
  - { id: ERR_STALE_SCHOOL_YEAR_VERSION, http: 412, condition: "expected_school_year_version does not match the school year's current version" }
  - { id: ERR_STALE_DISTRICT_VERSION, http: 412, condition: "expected_district_version does not match the district's current version" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Vendor implementation / operations team; owns districts, state collection specs, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /sis/districts, activate, suspend"
      - "POST /sis/collection-specs, publish, retire"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET list/detail endpoints except portal account detail"
  - name: DistrictAdmin
    description: "District implementation office; owns school years, rollover, portal provisioning, integration feeds"
    identity: opaque
    exclusive_operations:
      - "POST /sis/school-years, open, close-for-reporting, archive"
      - "POST /sis/rollover-runs, execute, compensate"
      - "POST /sis/portal-accounts, activate, revoke, update-access"
      - "POST /sis/integration-feeds, sync"
    shared_operations:
      - "All GET list/detail endpoints including portal account detail"
  - name: Registrar
    description: "School registrar; owns students, course catalog, master schedule sections, enrollment, attendance, discipline"
    identity: opaque
    exclusive_operations:
      - "POST /sis/students"
      - "POST /sis/courses"
      - "POST /sis/sections, commit, cancel, assign-teacher, roster-adds, roster-drops"
      - "POST /sis/enrollments, withdraw, reenter, attendance-events"
      - "POST /sis/discipline-incidents, approve, void"
    shared_operations:
      - "All GET list/detail endpoints except portal account detail"
  - name: StateReporter
    description: "District state-reporting officer; owns reporting extract lifecycle and submission"
    identity: opaque
    exclusive_operations:
      - "POST /sis/reporting-extracts, validate, reopen, submit, resolve"
    shared_operations:
      - "All GET list/detail endpoints except portal account detail"
  - name: PortalUser
    description: "Parent or student portal user; may only read the portal account whose id equals X-User-ID"
    identity: "entity_backed:PortalAccount"
    exclusive_operations: []
    shared_operations:
      - "GET /sis/portal-accounts/{id} — own account only (X-User-ID == account id)"
