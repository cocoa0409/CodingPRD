              payload: { additional_unit_count: 2, inverter_model: "GW2_HOME", firmware_version: "24.6.0", installed_cost_cents: 2600000, expected_battery_system_version: "${sys_v1}" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_new: $.data.id }
          assert:
            - "HTTP status == 201"
            - "BatterySystem.${sys_new}.expands_system_id == ${sys_id}"
            - "BatterySystem.${sys_new}.unit_count == 4"
            - "BatterySystem.${sys_new}.usable_kwh == 54.0"
            - "BatterySystem.${sys_new}.continuous_kw == 20.0"
            - "BatterySystem.${sys_new}.build_status == DESIGN_DRAFT"
            - "BatterySystem.${sys_id}.build_status == SUPERSEDED"
            - "ByodEnrollment.${enr_id}.status == SUSPENDED"
            - "DispatchPerformance.${perf1_id}.status == CANCELLED"
            - "DispatchEvent.${ev1}.enrolled_pledged_kw == 0.0"
      - name: dual_variant_load_sizing_is_exercised
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
          - calculations.load_sizing
        excluded_because:
          difficulty_instance: dual_variant_calc / load_sizing_standard_optional_vs_measured_demand_whole_home
          rationale: "Both sizing variants and their divergence on identical inputs are asserted by the named 1.8 instance."
      - name: clawback_threshold_triggers_a_certification_hold
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
          - entities.InstallerAccount.fields.clawback_count
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_d_second_clawback_suspends_certification_and_holds_pending_designs
          rationale: "Crossing the second-clawback threshold and the resulting hold are asserted by the named 1.8 instance."
      - name: failed_reinspection_fans_out_across_four_entities
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.cross_cutting_complexity_layers
          - state_machines.InterconnectionApplication.PTO_GRANTED_to_PTO_REVOKED
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_failed_reinspection_revokes_pto_suspends_enrollment_cancels_performance
          rationale: "The revoke-suspend-cancel fan-out is asserted end to end by the named 1.8 instance."
  - section: consistency_model
    instances:
      - name: claim_creation_reflects_the_program_ledger_within_the_same_request
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - calculations.program_budget_reservation
          - entities.IncentiveProgram.fields.remaining_budget_cents
        distinguishing_aspect: |
          The declared model is immediate consistency with no background settlement: the 201 body of the claim already carries reserved_amount_cents 423000, and a program read issued straight afterwards already shows remaining 4577000 — no second call, retry or delay is needed to see the encumbrance.
        test_recipe:
          setup:
            - "A 2-unit PWX_A system (usable_kwh 27.0) is INSTALLED with LIMITED_EXPORT approval."
            - "'State Storage Capacity Incentive' has total_budget_cents 5000000, reserved 0 and remaining 5000000."
          setup_api_calls:
            - call: "POST /installers"
              payload: { company_name: "Volt Home Energy", certification_level: "ADVANCED", certified_model_codes: ["PWX_A", "PWX_B", "PWX_C"], certification_expires_on: "2027-06-30" }
              as: ManufacturerWarrantyAgent
              as_user_id: "mfg-agent-1"
              captures: { inst_id: $.data.id }
            - call: "POST /sites"
              payload: { homeowner_name: "R. Ito", utility_territory_code: "TER_WEST", service_panel_amps: 200, floor_area_sqft: 2400, postal_code: "94110", existing_pv_kw_dc: 6.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { site_id: $.data.id }
            - call: "POST /load-calculations"
              payload: { site_id: "${site_id}", method: "NEC_220_82_STANDARD", backup_scope: "ESSENTIAL_LOADS", lighting_area_sqft: 2400, appliance_load_va: 18000, heating_va: 9600, cooling_va: 7200, essential_circuits: [{ label: "KITCHEN", load_kw: 3.5, has_motor: false }, { label: "WELL_PUMP", load_kw: 2.5, has_motor: true }, { label: "LIGHTS", load_kw: 1.2, has_motor: false }, { label: "FRIDGE", load_kw: 0.8, has_motor: false }] }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { lc_id: $.data.id }
            - call: "POST /load-calculations/${lc_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /load-calculations/${lc_id}/review"
              payload: { decision: "APPROVE", reviewer_notes: "Sizing verified." }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
            - call: "POST /battery-systems"
              payload: { site_id: "${site_id}", installer_id: "${inst_id}", load_calculation_id: "${lc_id}", model_code: "PWX_A", unit_count: 2, inverter_model: "GW2_HOME", firmware_version: "24.6.0", installed_cost_cents: 3200000 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_id: $.data.id }
            - call: "POST /battery-systems/${sys_id}/lock-design"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /permits"
              payload: { battery_system_id: "${sys_id}", jurisdiction_code: "AHJ_CITY", plan_set_ref: "PS-2790-A" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { permit_id: $.data.id }
            - call: "POST /permits/${permit_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /permits/${permit_id}/review"
              payload: { decision: "ISSUE", expires_on: "2027-06-30" }
              as: AuthorityHavingJurisdiction
              as_user_id: "ahj-user-1"
            - call: "POST /interconnection-applications"
              payload: { battery_system_id: "${sys_id}", export_mode: "LIMITED_EXPORT", requested_export_kw: 8.0 }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { app_id: $.data.id }
            - call: "POST /interconnection-applications/${app_id}/submit"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /interconnection-applications/${app_id}/review"
              payload: { decision: "APPROVE_TO_INSTALL", approved_export_kw: 8.0 }
              as: UtilityInterconnectionReviewer
              as_user_id: "utility-rev-1"
            - call: "POST /battery-systems/${sys_id}/mark-installed"
              payload: {}
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
            - call: "POST /incentive-programs"
              payload: { name: "State Storage Capacity Incentive", program_type: "STATE_CAPACITY", total_budget_cents: 5000000, tier1_limit_kwh: 20, tier1_rate_cents_per_kwh: 20000, tier2_rate_cents_per_kwh: 10000, per_project_cap_cents: 1500000, stack_priority: 1, max_stack_pct_of_cost_bp: 5000, requires_export_commitment: false, min_capacity_commitment_kw: 5.0 }
              as: RebateAdministrator
              as_user_id: "rebate-admin-1"
              captures: { prog_state: $.data.id }
            - call: "GET /battery-systems/${sys_id}"
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { sys_v1: $.data.version }
          trigger:
            - call: "POST /rebate-claims"
              payload: { battery_system_id: "${sys_id}", program_id: "${prog_state}", capacity_commitment_kw: 8.0, export_commitment: "LIMITED_EXPORT", expected_battery_system_version: "${sys_v1}" }
              as: CertifiedInstaller
              as_user_id: "${inst_id}"
              captures: { claim_id: $.data.id }
            - call: "GET /incentive-programs/${prog_state}"
              as: RebateAdministrator
              as_user_id: "rebate-admin-1"
          assert:
            - "the first trigger returns HTTP status 201 with RebateClaim.${claim_id}.reserved_amount_cents == 423000 in its own response body"
            - "the first trigger's response body already reports RebateClaim.${claim_id}.status == RESERVED"
            - "the second trigger returns HTTP status 200"
            - "IncentiveProgram.${prog_state}.reserved_budget_cents == 423000"
            - "IncentiveProgram.${prog_state}.remaining_budget_cents == 4577000"
            - "BatterySystem.${sys_id}.version == 2"
