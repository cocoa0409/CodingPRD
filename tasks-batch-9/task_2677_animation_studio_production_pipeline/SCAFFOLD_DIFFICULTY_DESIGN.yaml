  # =========================================================================
  # Rule 4 — transitive cascades (depth 4 and depth 3)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: review_close_note_retake_escalates_shot_and_production
        grounds:
          - state_machines.ReviewSession.IN_PROGRESS_to_CLOSED
          - state_machines.DirectorNote.OPEN_to_RETAKE_ISSUED
          - state_machines.ShotStageTask.APPROVED_to_RETAKE
          - calculations.stage_retake_escalation
          - entities.Shot.fields.escalation_flag
          - entities.Production.fields.at_risk_shot_count
        distinguishing_aspect: |
          Depth-4 chain, each link caused by the previous one: closing the session flips the MAJOR note to
          RETAKE_ISSUED (link 1), which drags the APPROVED stage task back to RETAKE and lands it on its
          third revision (link 2), which latches the shot's escalation flag and pushes it out of COMPLETE
          (link 3), which raises the production's at_risk_shot_count (link 4). A MINOR note in the same
          session travels no distance at all.
        test_recipe:
          setup:
            - "Production AD01 is PRODUCTION_ACTIVE with shot AD01_010_0010 (budget 1,000,000 cents)"
            - "the LAYOUT task has already been retaken twice and then approved, so revision_count is 2 and status is APPROVED"
            - "screening room STAGE-1 has 12 seats, a 30-minute turnover buffer and a fresh calibration"
            - "an IN_PROGRESS DIRECTOR_REVIEW session holds one MAJOR note and one MINOR note against that task"
          setup_api_calls:
            - call: "POST /studio/productions"
              payload: { title: "Aurora Drift", production_code: "AD01", format: "FEATURE", budget_cents: 100000000, render_allowance_cents: 5000000, master_color_space: "ACEScg", contingency_pct: 0.10, gate_types: ["SCRIPT"] }
