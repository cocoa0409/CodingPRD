scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: counter_creation_populates_all_computed_defaults
        claim_type: creation
        grounds:
          - entities.Counter
          - endpoints[POST /seafood-ops/counters]
          - response_envelope.success
        distinguishing_aspect: |
          Every one of the Counter's eleven computed fields must come back on the create
          response at its declared default -- posture OPEN, both counts 0, the cycle fields 0
          and 0.00, and all three ledger columns 0 -- alongside the server-minted id,
          created_at stamped from the logical clock, and version 1.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id, counter_v: $.data.version }
          assert:
            - "trigger returns HTTP 201"
            - "Counter.${counter_id}.store_number == \"4120\""
            - "Counter.${counter_id}.department_name == \"Seafood Service Counter\""
            - "Counter.${counter_id}.case_slot_count == 6"
            - "Counter.${counter_id}.posture == OPEN"
            - "Counter.${counter_id}.open_excursion_count == 0"
            - "Counter.${counter_id}.violation_points == 0"
            - "Counter.${counter_id}.verification_cycle_index == 0"
            - "Counter.${counter_id}.last_cycle_required_samples == 0"
            - "Counter.${counter_id}.last_cycle_max_supplier_risk_index == 0.00"
            - "Counter.${counter_id}.shrink_gross_cents == 0"
            - "Counter.${counter_id}.shrink_net_cents == 0"
            - "Counter.${counter_id}.recovered_conversion_cents == 0"
            - "Counter.${counter_id}.created_at == 2026-08-01T08:00:00Z"
            - "Counter.${counter_id}.version == 1"

      - name: lot_retrieval_returns_every_stored_receipt_disclosure
        claim_type: retrieval
        grounds:
          - entities.SupplierLot
          - endpoints[GET /seafood-ops/lots/{lot_id}]
        distinguishing_aspect: |
          A single-lot read must return the receipt disclosures exactly as submitted --
          harvest method, farmed/wild designation, origin and processing country, and both
          frozen flags -- together with remaining_weight_kg initialised to received_weight_kg
          and all three status dimensions at their initial states.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Counter, Supplier and a farmed Tilapia Species registered"
            - "SupplierLot received with processing_country_code CN and previously_frozen true"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Tilapia", scientific_name: "Oreochromis niloticus", acceptable_market_names: ["Tilapia"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: false }
              as: ChainAdmin
              captures: { tilapia_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${tilapia_id}", lot_code: "TIL-0801-R", harvest_method: "AQUACULTURE_POND", production_method: "FARMED", origin_country_code: "EC", processing_country_code: "CN", previously_frozen: true, fresh_claim: false, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1500, retail_price_cents_per_kg: 2100, cooked_retail_price_cents_per_kg: 2400 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
          trigger:
            - call: "GET /seafood-ops/lots/${lot_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-read-9"
              captures: { read_lot: $.data.id }
          assert:
            - "trigger returns HTTP 200"
            - "SupplierLot.${lot_id}.lot_code == \"TIL-0801-R\""
            - "SupplierLot.${lot_id}.harvest_method == AQUACULTURE_POND"
            - "SupplierLot.${lot_id}.production_method == FARMED"
            - "SupplierLot.${lot_id}.origin_country_code == \"EC\""
            - "SupplierLot.${lot_id}.processing_country_code == \"CN\""
            - "SupplierLot.${lot_id}.previously_frozen == true"
            - "SupplierLot.${lot_id}.fresh_claim == false"
            - "SupplierLot.${lot_id}.received_weight_kg == 10.000"
            - "SupplierLot.${lot_id}.remaining_weight_kg == 10.000"
            - "SupplierLot.${lot_id}.received_at == 2026-08-01T08:00:00Z"
            - "SupplierLot.${lot_id}.intake_status == RECEIVED"
            - "SupplierLot.${lot_id}.label_status == UNVERIFIED"
            - "SupplierLot.${lot_id}.chargeback_status == NONE"
            - "SupplierLot.${lot_id}.case_slot == null and SupplierLot.${lot_id}.cased_at == null and SupplierLot.${lot_id}.vacated_at == null"

      - name: lot_listing_filters_by_intake_status_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /seafood-ops/lots]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          The list endpoint must apply the intake_status filter BEFORE paginating: with three
          lots on the counter and one of them CASED, a limit of 1 over the RECEIVED filter
          reports total_count 2 and has_more true, and the offset-1 page reports has_more
          false -- a total_count computed before filtering would read 3.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "three Atlantic Cod SupplierLots on one Counter, created in order A, B, C"
            - "lot A cased into slot 1, so exactly two lots remain in intake_status RECEIVED"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_a: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-B", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_b: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-C", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_c: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_a}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
          trigger:
            - call: "GET /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", intake_status: "RECEIVED", limit: 1, offset: 0 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { page_1_first: "$.data[0].id" }
            - call: "GET /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", intake_status: "RECEIVED", limit: 1, offset: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { page_2_first: "$.data[0].id" }
          assert:
            - "trigger call 1 returns HTTP 200 with response_type == \"array\", total_count == 2, has_more == true and exactly 1 row"
            - "${page_1_first} == ${lot_b}"
            - "trigger call 2 returns total_count == 2, has_more == false and exactly 1 row"
            - "${page_2_first} == ${lot_c}"
            - "${lot_a} appears in neither page (its intake_status is CASED)"

      - name: not_found_sweep_across_all_thirteen_existence_rules
        claim_type: not_found
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
          - validations[priority=16]
          - validations[priority=17]
          - validations[priority=18]
        distinguishing_aspect: |
          Each of the thirteen existence rules must answer with its OWN error code rather than
          a generic 404: the same non-existent id sent to thirteen different single-resource
          reads produces thirteen distinct error_ids, which a shared not-found handler would
          collapse into one.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "empty database; no row of any entity exists"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "GET /seafood-ops/counters/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_counter: $.data.error_id }
            - call: "GET /seafood-ops/suppliers/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_supplier: $.data.error_id }
            - call: "GET /seafood-ops/species/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_species: $.data.error_id }
            - call: "GET /seafood-ops/lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_lot: $.data.error_id }
            - call: "GET /seafood-ops/case-labels/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_label: $.data.error_id }
            - call: "GET /seafood-ops/ad-items/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_item: $.data.error_id }
            - call: "GET /seafood-ops/ice-bed-readings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_reading: $.data.error_id }
            - call: "GET /seafood-ops/excursions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_excursion: $.data.error_id }
            - call: "GET /seafood-ops/verification-samples/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_sample: $.data.error_id }
            - call: "GET /seafood-ops/simp-documents/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_document: $.data.error_id }
            - call: "GET /seafood-ops/certifications/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_certification: $.data.error_id }
            - call: "GET /seafood-ops/shrink-events/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_shrink: $.data.error_id }
            - call: "GET /seafood-ops/violations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ChainAdmin
              captures: { e_violation: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 404"
            - "${e_counter} == ERR_COUNTER_NOT_FOUND"
            - "${e_supplier} == ERR_SUPPLIER_NOT_FOUND"
            - "${e_species} == ERR_SPECIES_NOT_FOUND"
            - "${e_lot} == ERR_LOT_NOT_FOUND"
            - "${e_label} == ERR_CASE_LABEL_NOT_FOUND"
            - "${e_item} == ERR_AD_ITEM_NOT_FOUND"
            - "${e_reading} == ERR_READING_NOT_FOUND"
            - "${e_excursion} == ERR_EXCURSION_NOT_FOUND"
            - "${e_sample} == ERR_SAMPLE_NOT_FOUND"
            - "${e_document} == ERR_SIMP_DOCUMENT_NOT_FOUND"
            - "${e_certification} == ERR_CERTIFICATION_NOT_FOUND"
            - "${e_shrink} == ERR_SHRINK_EVENT_NOT_FOUND"
            - "${e_violation} == ERR_VIOLATION_NOT_FOUND"

      - name: lot_receipt_rejects_missing_required_and_out_of_range_fields
        claim_type: required_fields
        grounds:
          - validations[priority=19]
          - errors.ERR_INVALID_REQUEST
          - endpoints[POST /seafood-ops/lots]
          - endpoints[POST /seafood-ops/counters]
        distinguishing_aspect: |
          Rule 19 covers three separate failure shapes on the same code: an omitted required
          field, an enum value outside the declared member list, and a numeric value outside
          the declared bound -- and it must be reported as ERR_INVALID_REQUEST (400) rather
          than as a downstream business error, because the existence checks above it all pass.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Counter, Supplier and Atlantic Cod Species all registered, so every existence rule passes"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
          trigger:
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { e_missing: $.data.error_id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_TRAWL", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { e_enum: $.data.error_id }
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4130", department_name: "Second Counter", case_slot_count: 0 }
              as: ChainAdmin
              captures: { e_bound: $.data.error_id }
          assert:
            - "every trigger call returns HTTP 400"
            - "${e_missing} == ERR_INVALID_REQUEST (origin_country_code omitted)"
            - "${e_enum} == ERR_INVALID_REQUEST (WILD_TRAWL is not a declared harvest_method member)"
            - "${e_bound} == ERR_INVALID_REQUEST (case_slot_count 0 is below the declared 1..12 bound)"
            - "0 SupplierLot rows exist"
            - "exactly 1 Counter row exists"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.SupplierLot.fields.processing_country_code
          - entities.ShrinkEvent.fields.conversion_requested_kg
          - entities.CaseLabel.fields.sustainability_claim_text
          - calculations.shrink_valuation
        distinguishing_aspect: |
          Three optional inputs must fall back to their declared defaults rather than to a
          language-level zero or an error: processing_country_code to null,
          conversion_requested_kg to 0.000 (with allowance_kg and approved_conversion_kg
          still 0.000 because approve-conversion has not run), and sustainability_claim_text
          to null on a label carrying no certification.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Atlantic Cod SupplierLot received without processing_country_code and cased into slot 1"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /seafood-ops/counters"
              payload: { store_number: "4120", department_name: "Seafood Service Counter", case_slot_count: 6 }
              as: ChainAdmin
              captures: { counter_id: $.data.id }
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801" }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
          trigger:
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_id: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_id}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_id}", reason: "UNSOLD_FRESH", shrink_weight_kg: 2.000 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { se_id: $.data.id }
            - call: "GET /seafood-ops/lots/${lot_id}"
              payload: {}
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_v: $.data.version }
            - call: "POST /seafood-ops/case-labels"
              payload: { lot_id: "${lot_id}", expected_lot_version: "${lot_v}" }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { label_id: $.data.id }
          assert:
            - "SupplierLot.${lot_id}.processing_country_code == null"
            - "ShrinkEvent.${se_id}.conversion_requested_kg == 0.000"
            - "ShrinkEvent.${se_id}.approved_conversion_kg == 0.000"
            - "ShrinkEvent.${se_id}.allowance_kg == 0.000"
            - "ShrinkEvent.${se_id}.status == VALUED"
            - "ShrinkEvent.${se_id}.provisional_value_cents == 3650"
            - "ShrinkEvent.${se_id}.final_value_cents == 0"
            - "ShrinkEvent.${se_id}.recovery_credit_cents == 0"
            - "CaseLabel.${label_id}.certification_id == null"
            - "CaseLabel.${label_id}.sustainability_claim_text == null"
            - "CaseLabel.${label_id}.withdraw_reason == null and CaseLabel.${label_id}.withdrawn_at == null"

      - name: supplier_system_fields_are_server_minted_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Supplier
          - endpoints[POST /seafood-ops/suppliers]
        distinguishing_aspect: |
          id, created_at, updated_at and version are server-minted: a client that submits its
          own id and version alongside the two real inputs must have those keys ignored, and
          created_at must equal the logical clock rather than wall-clock time.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /seafood-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T08:00:00Z" }
              as: ChainAdmin
          trigger:
            - call: "POST /seafood-ops/suppliers"
              payload: { name: "Gulf Bay Dealers", permit_number: "PERMIT-8801", id: "client-chosen-id", version: 77 }
              as: ChainAdmin
              captures: { supplier_id: $.data.id }
          assert:
            - "trigger returns HTTP 201"
            - "${supplier_id} != \"client-chosen-id\""
            - "Supplier.${supplier_id}.version == 1"
            - "Supplier.${supplier_id}.created_at == 2026-08-01T08:00:00Z"
            - "Supplier.${supplier_id}.updated_at == 2026-08-01T08:00:00Z"
            - "Supplier.${supplier_id}.name == \"Gulf Bay Dealers\" and Supplier.${supplier_id}.permit_number == \"PERMIT-8801\""

      - name: species_and_readings_are_immutable_rows_without_version
        claim_type: immutability
        grounds:
          - entities.Species
          - entities.IceBedReading
          - endpoints[GET /seafood-ops/species/{species_id}]
          - endpoints[GET /seafood-ops/ice-bed-readings/{reading_id}]
        distinguishing_aspect: |
          Species and IceBedReading both declare common_fields false: neither carries a
          version or updated_at field, neither has an update endpoint anywhere in the §1.5
          surface, and a probe row survives untouched -- corrections are made by writing a new
          reading, never by editing the old one.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T08:00:00Z"
            - "Counter registered with 6 slots"
            - "one non-breaching IceBedReading of 4.0 C on slot 1, so no excursion exists"
