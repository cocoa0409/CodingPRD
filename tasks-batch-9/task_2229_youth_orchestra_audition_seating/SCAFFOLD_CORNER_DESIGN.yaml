          resolves each one before any state gate: an unknown ensemble_id on POST
          /placements reports ERR_ENSEMBLE_NOT_FOUND (404) rather than the priority-41
          ERR_ENSEMBLE_NOT_ACCEPTING_PLACEMENTS the season's PLANNING status would
