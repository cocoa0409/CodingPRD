        excluded_because:
          difficulty_instance: adjacent_commitment_windows_touching_at_one_endpoint_exceed_the_ash_inventory
          rationale: "That instance uses two windows sharing a single endpoint date and asserts their tonnages are summed, which is the gap-zero adjacency case."

      - name: interwell_and_intrawell_limits_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.background_statistical_limit
        excluded_because:
          difficulty_instance: interwell_vs_intrawell_limit_flips_ssi_verdict
          rationale: "That instance computes both variants over the same data and asserts the two limits and the two verdicts."

      - name: the_recommendation_reads_the_discounted_variant
        claim_type: variant_selection
        grounds:
          - calculations.closure_method_recommendation
        excluded_because:
          difficulty_instance: nominal_vs_discounted_cost_flips_recommended_method
          rationale: "That instance asserts the recommendation follows the discounted pair even though the nominal pair orders the two methods the other way."

      - name: switching_the_comparison_basis_re_reconciles_the_program
        claim_type: reconciliation
        grounds:
          - calculations.background_statistical_limit
          - state_machines.MonitoringProgram.DETECTION_to_ASSESSMENT
        excluded_because:
          difficulty_instance: interwell_vs_intrawell_limit_flips_ssi_verdict
          rationale: "Its second trigger switches the program's comparison_basis mid-scenario and asserts the next evaluation adopts the new variant and drags the program phase and the unit posture with it."

  - section: validations
    instances:
      - name: future_event_dates_are_rejected_while_window_bounds_are_not
        claim_type: violation_to_error
        grounds:
          - validations.priority_12_ERR_FUTURE_DATE_NOT_ALLOWED
          - errors.ERR_FUTURE_DATE_NOT_ALLOWED
        distinguishing_aspect: |
          The no-future-dates rule enumerates a closed list of fields, and the two window-bound pairs are
          deliberately NOT on it: a background window that ends 2026-12-31 must be accepted while the clock
          reads 2026-08-01. An implementation that rejects every future date fails the PATCH, and one that
          checks none of them accepts the three violations. A date equal to the clock date is allowed.
        test_recipe:
          setup:
            - "One GEOTECHNICAL engineer, one hydrogeologist, and the clock at its default 2026-08-01"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0133", unit_name: "Ash Pond 133", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, prog_id: $.data.monitoring_program_id }
          trigger:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0134", unit_name: "Ash Pond 134", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-09-01", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-08-02", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2026-08-02" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { error_id: $.data.error_id }
            - call: "PATCH /ccr/monitoring-programs/${prog_id}"
              payload: { background_window_start_on: "2025-01-01", background_window_end_on: "2026-12-31" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2026-08-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { well_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 422 with error_id ERR_FUTURE_DATE_NOT_ALLOWED and no second DisposalUnit is created"
            - "trigger call 2 returns HTTP 422 with error_id ERR_FUTURE_DATE_NOT_ALLOWED and DisposalUnit.${unit_id}.governing_stability_verdict is still UNASSESSED"
            - "trigger call 3 returns HTTP 422 with error_id ERR_FUTURE_DATE_NOT_ALLOWED"
            - "trigger call 4 returns HTTP 200 with MonitoringProgram.${prog_id}.background_window_end_on == 2026-12-31 — a window bound may sit in the future"
            - "trigger call 5 returns HTTP 201 with MonitoringWell.${well_id}.installed_on == 2026-08-01, exactly the clock date, and well_status == CERTIFIED"
            - "MonitoringProgram.${prog_id}.background_well_count == 1 and downgradient_well_count == 0 after the only successful well creation"

      - name: duplicate_codes_are_refused_while_distinct_codes_are_accepted
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_13_ERR_DUPLICATE_CODE
          - errors.ERR_DUPLICATE_CODE
          - entities.DisposalUnit.fields.unit_code
          - entities.MonitoringWell.fields.well_code
        distinguishing_aspect: |
          The uniqueness rule must refuse the second unit_code and the second license_number while letting
          a one-character variant through, so the check is on the whole code and not on a prefix. The well
          code is scoped to its unit: the same well_code under a second unit is accepted, which separates a
          global unique index from the declared per-unit scope.
        test_recipe:
          setup:
            - "One hydrogeologist and two clean units"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Mia Chen", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { hg_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0135", unit_name: "Ash Pond 135", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_a_id: $.data.id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_a_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { well_a_id: $.data.id }
          trigger:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0135", unit_name: "Ash Pond 135 Duplicate", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT02", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0135B", unit_name: "Ash Pond 135B", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT02", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_b_id: $.data.id }
            - call: "POST /ccr/professionals"
              payload: { full_name: "Other Hydro", license_number: "HG-33003", license_state: "NC", discipline: "HYDROGEOLOGY" }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_a_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 23.00, screen_bottom_ft: 43.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/wells"
              payload: { unit_id: "${unit_b_id}", well_code: "BG-01", well_role: "BACKGROUND", aquifer_zone: "UPPER SAND", screen_top_ft: 22.00, screen_bottom_ft: 42.00, installed_on: "2024-06-01" }
              as: Hydrogeologist
              as_user_id: "${hg_id}"
              captures: { well_b_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 409 with error_id ERR_DUPLICATE_CODE"
            - "trigger call 2 returns HTTP 201: IMP-0135B is a distinct code even though IMP-0135 is a prefix of it"
            - "trigger call 3 returns HTTP 409 with error_id ERR_DUPLICATE_CODE on the professional license_number"
            - "trigger call 4 returns HTTP 409 with error_id ERR_DUPLICATE_CODE: BG-01 already exists under ${unit_a_id}"
            - "trigger call 5 returns HTTP 201 with MonitoringWell.${well_b_id}.unit_id == ${unit_b_id} — the well code is unique per unit, not globally"
            - "MonitoringWell.${well_a_id}.screen_top_ft is still 22.00, so the refused duplicate did not overwrite the original row"

      - name: method_justification_is_required_only_when_the_selection_diverges
        claim_type: conditional_validation
        grounds:
          - validations.priority_44_ERR_METHOD_JUSTIFICATION_REQUIRED
          - calculations.closure_method_recommendation
          - entities.ClosurePlan.fields.selection_justification
        distinguishing_aspect: |
          The justification rule is conditional on a comparison between two fields of the same row: it is
          silent when selected_method equals the computed recommended_method and mandatory when they
          diverge, with a length floor of exactly 30 characters. A 29-character narrative must fail and a
          30-character one must pass, so a `> 30` or truthiness-only check is caught.
        test_recipe:
          setup:
            - "One clean unit whose cost inputs recommend CLOSURE_IN_PLACE by a wide margin"
          setup_api_calls:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0136", unit_name: "Ash Pond 136", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
          trigger:
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0136-A", selected_method: "CLOSURE_BY_REMOVAL", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0136-B", selected_method: "CLOSURE_BY_REMOVAL", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30, selection_justification: "County order requires removal" }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0136-C", selected_method: "CLOSURE_BY_REMOVAL", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30, selection_justification: "County order requires removals" }
              as: UtilityAdmin
              captures: { removal_plan_id: $.data.id }
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0136-D", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { in_place_plan_id: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 422 with error_id ERR_METHOD_JUSTIFICATION_REQUIRED"
            - "trigger call 2 returns HTTP 422 with error_id ERR_METHOD_JUSTIFICATION_REQUIRED: 29 characters is one short of the floor"
            - "trigger call 3 returns HTTP 201 with ClosurePlan.${removal_plan_id}.selection_justification exactly 30 characters long"
            - "ClosurePlan.${removal_plan_id}.recommended_method == CLOSURE_IN_PLACE while selected_method == CLOSURE_BY_REMOVAL"
            - "trigger call 4 returns HTTP 201 with ClosurePlan.${in_place_plan_id}.selection_justification == null and status == DRAFT"
            - "both created plans report in_place_pv_usd_cents == 119600444, removal_pv_usd_cents == 919600444 and cost_variance_pct == 86.99"

      - name: background_data_check_runs_before_the_compliance_measurement_check
        claim_type: cascading_validation
        grounds:
          - validations.priority_41_ERR_INSUFFICIENT_BACKGROUND_DATA
          - validations.priority_42_ERR_NO_COMPLIANCE_MEASUREMENT
          - calculations.background_statistical_limit
          - errors.ERR_INSUFFICIENT_BACKGROUND_DATA
          - errors.ERR_NO_COMPLIANCE_MEASUREMENT
        distinguishing_aspect: |
          A program with a certified network and no results at all violates both checks at once: there are
          fewer than four background values AND no post-window compliance measurement. The background
          check must win, because the comparison cannot even be framed without a limit. The sibling program
