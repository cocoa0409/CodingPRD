# =============================================================================
# PRD-bench scaffold — Social-Media Management Service
# task_0702_social_media_management  (Difficulty: Expert)
# =============================================================================

scenario: |
  702. Social-Media Management Service: client account & channel onboarding, content
  calendar & approval workflow, scheduling & multi-platform publish, community management
  & DM/comment, ad-boost & budget, analytics & reporting, influencer/UGC coordination,
  retainer & package

domain_name: social-media-management
api_prefix: /

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration      # content approval pipeline with branching/revision
  secondary_archetype: pricing_engine            # ad-boost budget metering + retainer/package allocation
  complexity_layers:
    - cascading_side_effects                     # approval -> schedule -> publish -> ledger
    - derived_field_reconciliation               # client budget = retainer + reserved + spent
    - rate_threshold_triggers                     # boost pacing / overspend boundaries
    - optimistic_concurrency                      # OCC on Client.version for boost reservation races

  entity_topology: flat                          # peer entities linked by FK; collection-per-entity URLs
  state_machine_shape: cyclic                    # content approval revision loops; collab negotiation rounds
  relationship_patterns:
    - one_to_many                                # Client -> Channel / ContentItem / BoostCampaign
    - many_to_many                               # ContentItem <-> Channel via ContentTarget
    - cross_aggregate                            # BoostCampaign depends on ContentItem state; ScheduleSlot on Channel state
  role_model: peer_roles                         # AccountManager / ContentCreator / Approver / CommunityAgent / FinanceController / PlatformAdmin
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Client/brand display name" }
      - { name: account_manager_id, type: string, source: input, description: "Opaque AccountManager operator id who owns the account" }
      - { name: status, type: enum, source: system, description: "Lifecycle status", constraints: "ONBOARDING | ACTIVE | SUSPENDED | CHURNED" }
      - { name: retainer_fee_cents, type: integer, source: computed, description: "Monthly retainer fee in cents copied from the active RetainerPackage on activation; 0 while ONBOARDING", default: 0 }
      - { name: boost_budget_limit_cents, type: integer, source: computed, description: "Monthly ad-boost budget ceiling copied from the active RetainerPackage on activation; 0 while ONBOARDING", default: 0 }
      - { name: boost_reserved_cents, type: integer, source: computed, description: "Sum of reserved_budget_cents over BoostCampaign rows of this client whose status IN {RESERVED, RUNNING}", default: 0 }
      - { name: boost_spent_cents, type: integer, source: computed, description: "Sum of spent_budget_cents over BoostCampaign rows of this client whose status IN {RUNNING, COMPLETED}", default: 0 }
      - { name: boost_available_cents, type: integer, source: computed, description: "boost_budget_limit_cents - boost_reserved_cents - boost_spent_cents; never negative", default: 0 }
      - { name: monthly_post_quota, type: integer, source: computed, description: "Max published ContentItems per billing month, copied from active RetainerPackage on activation", default: 0 }
      - { name: posts_published_this_cycle, type: integer, source: computed, description: "Count of ContentItems of this client whose status == PUBLISHED with published_cycle_index == current_cycle_index", default: 0 }
      - { name: current_cycle_index, type: integer, source: system, description: "Deterministic billing-cycle counter, starts at 0, advanced by POST /clients/{id}/cycles/close", default: 0 }
      - { name: open_conversation_count, type: integer, source: computed, description: "Count of Conversation rows of this client's channels whose status == OPEN", default: 0 }

  - name: RetainerPackage
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the owning client" }
      - { name: tier, type: enum, source: input, description: "Package tier", constraints: "STARTER | GROWTH | SCALE" }
      - { name: monthly_retainer_fee_cents, type: integer, source: input, description: "Monthly retainer fee in cents, > 0" }
      - { name: monthly_boost_budget_cents, type: integer, source: input, description: "Monthly ad-boost budget ceiling in cents, >= 0" }
      - { name: monthly_post_quota, type: integer, source: input, description: "Max published posts per billing cycle, >= 1" }
      - { name: included_channels, type: integer, source: input, description: "Max number of channels allowed to reach LIVE under this package, >= 1" }
      - { name: status, type: enum, source: system, description: "Package lifecycle", constraints: "DRAFT | ACTIVE | SUPERSEDED" }

  - name: Channel
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the owning client" }
      - { name: platform, type: enum, source: input, description: "Social platform", constraints: "FACEBOOK | INSTAGRAM | X | LINKEDIN | TIKTOK" }
      - { name: handle, type: string, source: input, description: "Channel handle/username, unique per (client_id, platform)" }
      - { name: status, type: enum, source: system, description: "Onboarding lifecycle", constraints: "PENDING | CONNECTED | LIVE | DISCONNECTED" }
      - { name: min_publish_gap_minutes, type: integer, source: input, description: "Minimum minutes that must separate two schedule slots on this channel", default: 30, constraints: ">= 0" }

  - name: ContentItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the owning client" }
      - { name: author_id, type: string, source: input, description: "Opaque ContentCreator operator id who drafted the item" }
      - { name: title, type: string, source: input, description: "Internal title of the content item" }
      - { name: body, type: string, source: input, description: "Caption/post body text" }
      - { name: status, type: enum, source: system, description: "Approval + publish lifecycle", constraints: "DRAFT | IN_REVIEW | CHANGES_REQUESTED | APPROVED | SCHEDULED | PUBLISHED | ARCHIVED" }
      - { name: revision_round, type: integer, source: computed, description: "Number of times the item has re-entered IN_REVIEW after CHANGES_REQUESTED; starts at 0", default: 0 }
      - { name: published_cycle_index, type: integer, source: system, description: "Client.current_cycle_index captured at the moment of publish; null until PUBLISHED", default: null }
      - { name: scheduled_slot_id, type: string, source: computed, description: "FK -> ScheduleSlot.id; the slot reserved when the item moved to SCHEDULED; null otherwise", default: null }

  - name: ContentTarget
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: content_item_id, type: string, source: input, description: "FK -> ContentItem.id; the content being targeted" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; the destination channel" }
      - { name: publish_state, type: enum, source: system, description: "Per-channel publish fan-out state", constraints: "PENDING | PUBLISHED | FAILED | SKIPPED" }

  - name: ScheduleSlot
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; the channel whose timeline this slot occupies" }
      - { name: content_item_id, type: string, source: input, description: "FK -> ContentItem.id; the content reserved into this slot" }
      - { name: slot_start_utc, type: datetime, source: input, description: "Inclusive start of the publishing window (ISO 8601 UTC)" }
      - { name: duration_minutes, type: integer, source: input, description: "Window length in minutes, >= 1; window is [slot_start_utc, slot_start_utc + duration_minutes)", default: 15 }
      - { name: status, type: enum, source: system, description: "Slot lifecycle", constraints: "RESERVED | FIRED | RELEASED" }

  - name: BoostCampaign
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the budget-owning client" }
      - { name: content_item_id, type: string, source: input, description: "FK -> ContentItem.id; the boosted content" }
      - { name: requested_budget_cents, type: integer, source: input, description: "Daily-cap * duration budget the buyer asks for, in cents, > 0" }
      - { name: daily_cap_cents, type: integer, source: input, description: "Maximum spend per active day in cents, > 0" }
      - { name: duration_days, type: integer, source: input, description: "Planned run length in days, >= 1" }
      - { name: status, type: enum, source: system, description: "Boost lifecycle", constraints: "DRAFT | RESERVED | RUNNING | COMPLETED | CANCELLED" }
      - { name: reserved_budget_cents, type: integer, source: computed, description: "Budget locked against Client.boost_available_cents on reservation; 0 once COMPLETED/CANCELLED", default: 0 }
      - { name: spent_budget_cents, type: integer, source: computed, description: "Cumulative recorded spend, never exceeds reserved_budget_cents at reservation time", default: 0 }
      - { name: days_elapsed, type: integer, source: computed, description: "Count of distinct spend_day_index values recorded so far, used for pacing", default: 0 }
      - { name: current_day_spent_cents, type: integer, source: computed, description: "Sum of amount_cents recorded for the highest spend_day_index seen so far (the current spend day's aggregate)", default: 0 }

  - name: Conversation
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: channel_id, type: string, source: input, description: "FK -> Channel.id; the channel this thread belongs to" }
      - { name: kind, type: enum, source: input, description: "Engagement kind", constraints: "DM | COMMENT" }
      - { name: external_author_handle, type: string, source: input, description: "Handle of the external person who initiated the thread" }
      - { name: status, type: enum, source: system, description: "Triage lifecycle", constraints: "OPEN | ASSIGNED | RESOLVED | ESCALATED" }
      - { name: assigned_agent_id, type: string, source: computed, description: "Opaque CommunityAgent operator id assigned to the thread; null until ASSIGNED", default: null }
      - { name: message_count, type: integer, source: computed, description: "Count of EngagementMessage rows under this conversation", default: 0 }

  - name: EngagementMessage
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: conversation_id, type: string, source: input, description: "FK -> Conversation.id; the parent thread" }
      - { name: direction, type: enum, source: input, description: "Message direction", constraints: "INBOUND | OUTBOUND" }
      - { name: body, type: string, source: input, description: "Message text" }
      - { name: author_agent_id, type: string, source: input, description: "Opaque CommunityAgent operator id for OUTBOUND messages; null for INBOUND", default: null }

  - name: InfluencerCollab
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the sponsoring client" }
      - { name: influencer_handle, type: string, source: input, description: "Handle of the influencer/creator partner" }
      - { name: offer_fee_cents, type: integer, source: input, description: "Current proposed flat fee in cents for the collaboration, > 0" }
      - { name: deliverable_count, type: integer, source: input, description: "Number of UGC deliverables expected, >= 1" }
      - { name: status, type: enum, source: system, description: "Negotiation + delivery lifecycle", constraints: "PROPOSED | COUNTERED | ACCEPTED | DELIVERED | CLOSED | CANCELLED" }
      - { name: negotiation_round, type: integer, source: computed, description: "Number of counter-offers exchanged; starts at 0", default: 0 }
      - { name: approved_asset_count, type: integer, source: computed, description: "Count of UGCAsset rows under this collab whose status == RIGHTS_CLEARED", default: 0 }

  - name: UGCAsset
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: collab_id, type: string, source: input, description: "FK -> InfluencerCollab.id; the parent collaboration" }
      - { name: asset_url, type: string, source: input, description: "URL of the submitted UGC asset" }
      - { name: status, type: enum, source: system, description: "Rights review lifecycle", constraints: "SUBMITTED | RIGHTS_CLEARED | REJECTED" }

  - name: AnalyticsSnapshot
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client the report covers" }
      - { name: cycle_index, type: integer, source: system, description: "Client.current_cycle_index captured at snapshot time" }
      - { name: posts_published, type: integer, source: computed, description: "Count of this client's ContentItems with status == PUBLISHED and published_cycle_index == cycle_index" }
      - { name: boost_spent_cents, type: integer, source: computed, description: "Sum of spent_budget_cents over this client's BoostCampaigns with status IN {RUNNING, COMPLETED} at snapshot time" }
      - { name: engagement_rate_bps, type: number, source: computed, description: "Engagement rate in basis points computed per the engagement_rate calculation" }
      - { name: total_impressions, type: integer, source: input, description: "Externally supplied impression total for the cycle, >= 0" }
      - { name: total_engagements, type: integer, source: input, description: "Externally supplied engagement total for the cycle, >= 0" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the client whose budget the entry moves" }
      - { name: entry_type, type: enum, source: system, description: "Movement category", constraints: "RETAINER_CHARGE | BOOST_RESERVE | BOOST_RELEASE | BOOST_SPEND" }
      - { name: amount_cents, type: integer, source: system, description: "Signed amount in cents; positive consumes budget, negative returns it" }
      - { name: boost_campaign_id, type: string, source: system, description: "FK -> BoostCampaign.id; source campaign for boost entries; null for RETAINER_CHARGE", default: null }
      - { name: cycle_index, type: integer, source: system, description: "Client.current_cycle_index at the time the entry was written" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Client
    field: status
    initial_state: ONBOARDING
    terminal_states: [CHURNED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /clients/{clientId}/activate"
        actor: AccountManager
        preconditions:
          - "Client has exactly one RetainerPackage with status == ACTIVE"
          - "At least one Channel of the client has status == LIVE"
        side_effects:
          - "Copy active RetainerPackage.monthly_retainer_fee_cents -> Client.retainer_fee_cents"
          - "Copy active RetainerPackage.monthly_boost_budget_cents -> Client.boost_budget_limit_cents"
          - "Copy active RetainerPackage.monthly_post_quota -> Client.monthly_post_quota"
          - "Recompute Client.boost_available_cents (= limit - reserved - spent)"
          - "Append LedgerEntry{entry_type=RETAINER_CHARGE, amount_cents=+retainer_fee_cents, cycle_index=Client.current_cycle_index}"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clients/{clientId}/suspend"
        actor: "AccountManager or PlatformAdmin"
        preconditions: []
        side_effects:
          - "Blocks new ContentItem submission, ScheduleSlot reservation, and BoostCampaign reservation"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clients/{clientId}/reinstate"
        actor: "AccountManager or PlatformAdmin"
        preconditions: []
        side_effects: []

      - from: [ONBOARDING, ACTIVE, SUSPENDED]
        to: CHURNED
        trigger: "POST /clients/{clientId}/churn"
        actor: PlatformAdmin
        preconditions:
          - "No BoostCampaign of the client has status IN {RESERVED, RUNNING}"
        side_effects:
          - "All Channels of the client with status != DISCONNECTED -> DISCONNECTED"
          - "All Conversations of the client's channels with status IN {OPEN, ASSIGNED, ESCALATED} -> RESOLVED"

  - entity: RetainerPackage
    field: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /retainer-packages/{packageId}/activate"
        actor: AccountManager
        preconditions:
          - "The owning client has no other RetainerPackage with status == ACTIVE, OR the prior ACTIVE one is superseded by this same call"
        side_effects:
          - "Any prior RetainerPackage of the same client with status == ACTIVE -> SUPERSEDED"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a newer package of the same client is activated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Channel
    field: status
    initial_state: PENDING
    terminal_states: [DISCONNECTED]
    transitions:
      - from: PENDING
        to: CONNECTED
        trigger: "POST /channels/{channelId}/connect"
        actor: AccountManager
        preconditions:
          - "Owning Client.status IN {ONBOARDING, ACTIVE}"
        side_effects: []

      - from: CONNECTED
        to: LIVE
        trigger: "POST /channels/{channelId}/go-live"
        actor: AccountManager
        preconditions:
          - "Count of the client's Channels with status == LIVE < the client's active RetainerPackage.included_channels"
        side_effects: []

      - from: [PENDING, CONNECTED, LIVE]
        to: DISCONNECTED
        trigger: "POST /channels/{channelId}/disconnect or system (client churn)"
        actor: "AccountManager or system"
        preconditions: []
        side_effects:
          - "All ScheduleSlots of this channel with status == RESERVED -> RELEASED"
          - "Each released slot's ContentItem with status == SCHEDULED -> APPROVED and its scheduled_slot_id cleared"

  - entity: ContentItem
    field: status
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /content-items/{contentItemId}/submit"
        actor: ContentCreator
        preconditions:
          - "Owning Client.status == ACTIVE"
          - "ContentItem has at least one ContentTarget"
        side_effects: []

      - from: IN_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /content-items/{contentItemId}/request-changes"
        actor: Approver
        preconditions: []
        side_effects: []

      - from: CHANGES_REQUESTED
        to: IN_REVIEW
        trigger: "POST /content-items/{contentItemId}/resubmit"
        actor: ContentCreator
        preconditions: []
        side_effects:
          - "Increment ContentItem.revision_round by 1"

      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /content-items/{contentItemId}/approve"
        actor: Approver
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: SCHEDULED
        trigger: "POST /content-items/{contentItemId}/schedule"
        actor: AccountManager
        preconditions:
          - "A ScheduleSlot is reserved on a LIVE channel that hosts one of this item's ContentTargets (see Channel temporal-overlap rule)"
        side_effects:
          - "Set ContentItem.scheduled_slot_id to the new ScheduleSlot.id"

      - from: SCHEDULED
        to: APPROVED
        trigger: "POST /content-items/{contentItemId}/unschedule"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "The reserved ScheduleSlot (status == RESERVED) -> RELEASED"
          - "Clear ContentItem.scheduled_slot_id"

      - from: SCHEDULED
        to: PUBLISHED
        trigger: "POST /content-items/{contentItemId}/publish"
        actor: AccountManager
        preconditions:
          - "Owning Client.posts_published_this_cycle < Client.monthly_post_quota"
          - "The reserved ScheduleSlot.status == RESERVED"
        side_effects:
          - "Capture published_cycle_index = Client.current_cycle_index"
          - "Reserved ScheduleSlot -> FIRED"
          - "Each ContentTarget of the item whose channel is LIVE -> publish_state=PUBLISHED; targets on non-LIVE channels -> publish_state=SKIPPED"
          - "Increment Client.posts_published_this_cycle (recomputed from PUBLISHED items in current cycle)"

      - from: [DRAFT, CHANGES_REQUESTED, APPROVED]
        to: ARCHIVED
        trigger: "POST /content-items/{contentItemId}/archive"
        actor: "ContentCreator or AccountManager"
        preconditions:
          - "ContentItem.status != SCHEDULED (must be unscheduled first)"
        side_effects: []

  - entity: ScheduleSlot
    field: status
    initial_state: RESERVED
    terminal_states: [FIRED, RELEASED]
    transitions:
      - from: RESERVED
        to: FIRED
        trigger: "system (parent ContentItem publish)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RESERVED
        to: RELEASED
        trigger: "system (ContentItem unschedule or Channel disconnect)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BoostCampaign
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RESERVED
        trigger: "POST /boost-campaigns/{boostId}/reserve"
        actor: FinanceController
        preconditions:
          - "Owning Client.status == ACTIVE"
          - "Boosted ContentItem.status IN {SCHEDULED, PUBLISHED}"
          - "Client.boost_available_cents >= requested_budget_cents (else ERR_BOOST_BUDGET_EXCEEDED)"
          - "Request body expected_client_version matches Client.version (OCC)"
        side_effects:
          - "Set reserved_budget_cents = requested_budget_cents"
          - "Recompute Client.boost_reserved_cents and Client.boost_available_cents"
          - "Append LedgerEntry{entry_type=BOOST_RESERVE, amount_cents=+requested_budget_cents, boost_campaign_id, cycle_index}"
          - "Increment Client.version by 1"

      - from: RESERVED
        to: RUNNING
        trigger: "POST /boost-campaigns/{boostId}/launch"
        actor: FinanceController
        preconditions:
          - "Boosted ContentItem.status == PUBLISHED"
        side_effects: []

      - from: RUNNING
        to: RUNNING
        trigger: "POST /boost-campaigns/{boostId}/record-spend"
        actor: FinanceController
        preconditions:
          - "spend_day_index >= the highest spend_day_index recorded so far (monotonic non-decreasing)"
          - "bucket_total(spend_day_index) = (sum of prior amounts in that bucket) + amount_cents <= daily_cap_cents (else ERR_DAILY_CAP_EXCEEDED)"
          - "spent_budget_cents + amount_cents <= reserved_budget_cents (else ERR_BOOST_OVERSPEND)"
        side_effects:
          - "Increment spent_budget_cents by amount_cents"
          - "If spend_day_index is a new (previously unseen) value, increment days_elapsed by 1"
          - "Recompute current_day_spent_cents for the highest spend_day_index"
          - "Recompute Client.boost_spent_cents"
          - "Append LedgerEntry{entry_type=BOOST_SPEND, amount_cents=+amount_cents, boost_campaign_id, cycle_index}"

      - from: RUNNING
        to: COMPLETED
        trigger: "POST /boost-campaigns/{boostId}/complete"
        actor: FinanceController
        preconditions: []
        side_effects:
          - "unspent = reserved_budget_cents - spent_budget_cents"
          - "Append LedgerEntry{entry_type=BOOST_RELEASE, amount_cents=-unspent, boost_campaign_id, cycle_index} when unspent > 0"
          - "Set reserved_budget_cents = 0"
          - "Recompute Client.boost_reserved_cents, Client.boost_spent_cents, Client.boost_available_cents"

      - from: [DRAFT, RESERVED]
        to: CANCELLED
        trigger: "POST /boost-campaigns/{boostId}/cancel"
        actor: FinanceController
        preconditions: []
        side_effects:
          - "released = reserved_budget_cents (from RESERVED; 0 from DRAFT)"
          - "Append LedgerEntry{entry_type=BOOST_RELEASE, amount_cents=-released, boost_campaign_id, cycle_index} when released > 0"
          - "Set reserved_budget_cents = 0"
          - "Recompute Client.boost_reserved_cents and Client.boost_available_cents"

  - entity: Conversation
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /conversations/{conversationId}/assign"
        actor: CommunityAgent
        preconditions:
          - "Channel.status == LIVE"
        side_effects:
          - "Set assigned_agent_id = X-User-ID of the acting CommunityAgent"

      - from: [OPEN, ASSIGNED]
        to: ESCALATED
        trigger: "POST /conversations/{conversationId}/escalate"
        actor: CommunityAgent
        preconditions: []
        side_effects: []

      - from: ESCALATED
        to: ASSIGNED
        trigger: "POST /conversations/{conversationId}/assign"
        actor: CommunityAgent
        preconditions: []
        side_effects:
          - "Set assigned_agent_id = X-User-ID of the acting CommunityAgent"

      - from: [ASSIGNED, ESCALATED]
        to: RESOLVED
        trigger: "POST /conversations/{conversationId}/resolve or system (client churn)"
        actor: "CommunityAgent or system"
        preconditions: []
        side_effects: []

  - entity: InfluencerCollab
    field: status
    initial_state: PROPOSED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: [PROPOSED, COUNTERED]
        to: COUNTERED
        trigger: "POST /influencer-collabs/{collabId}/counter"
        actor: AccountManager
        preconditions:
          - "Counter offer_fee_cents > 0"
        side_effects:
          - "Set offer_fee_cents = body.counter_fee_cents"
          - "Increment negotiation_round by 1"

      - from: [PROPOSED, COUNTERED]
        to: ACCEPTED
        trigger: "POST /influencer-collabs/{collabId}/accept"
        actor: AccountManager
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: DELIVERED
        trigger: "POST /influencer-collabs/{collabId}/mark-delivered"
        actor: AccountManager
        preconditions:
          - "approved_asset_count >= deliverable_count (count of UGCAssets with status == RIGHTS_CLEARED)"
        side_effects: []

      - from: DELIVERED
        to: CLOSED
        trigger: "POST /influencer-collabs/{collabId}/close"
        actor: AccountManager
        preconditions: []
        side_effects: []

      - from: [PROPOSED, COUNTERED, ACCEPTED]
        to: CANCELLED
        trigger: "POST /influencer-collabs/{collabId}/cancel"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "All UGCAssets of this collab with status == SUBMITTED -> REJECTED"

  - entity: UGCAsset
    field: status
    initial_state: SUBMITTED
    terminal_states: [RIGHTS_CLEARED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: RIGHTS_CLEARED
        trigger: "POST /ugc-assets/{assetId}/clear-rights"
        actor: AccountManager
        preconditions:
          - "Parent InfluencerCollab.status IN {ACCEPTED, DELIVERED}"
        side_effects:
          - "Recompute parent InfluencerCollab.approved_asset_count"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ugc-assets/{assetId}/reject or system (collab cancel)"
        actor: "AccountManager or system"
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: boost-reserve-stale-client
    parent_entity: Client
    write_endpoint: "POST /boost-campaigns/{boostId}/reserve"
    occ_field: "expected_client_version"
    description: |
      Reserving budget for a BoostCampaign against a Client whose version has
      advanced since the client was last observed is rejected. This captures the
      case where another reservation has already debited boost_available_cents
      (legitimately superseding the prior view), so the current writer's budget
      figure is stale and its reservation would over-commit the monthly ceiling.
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: client_budget_conservation
    trigger: "boost reserve, record-spend, complete, cancel; client activate"
    algorithm: aggregation
    formula: |
      boost_reserved_cents = sum(bc.reserved_budget_cents
                                 for bc in client.boost_campaigns
                                 if bc.status IN {RESERVED, RUNNING})
      boost_spent_cents    = sum(bc.spent_budget_cents
                                 for bc in client.boost_campaigns
                                 if bc.status IN {RUNNING, COMPLETED})
      boost_available_cents = max(0,
        boost_budget_limit_cents - boost_reserved_cents - boost_spent_cents)
      INVARIANT: boost_budget_limit_cents
                 == boost_reserved_cents + boost_spent_cents + boost_available_cents
                 (holds whenever boost_available_cents > 0; clamps to 0 floor only on over-allocation, which validations forbid)
    input_set: "BoostCampaign rows of the client, filtered by status as shown"
    precision: "integer cents, exact"

  - name: boost_pacing_status
    trigger: "boost record-spend"
    algorithm: threshold
    formula: |
      # A record-spend names a spend_day_index (a calendar-day bucket). The daily
      # cap is an AGGREGATE per-day capacity window, NOT a per-call limit:
      #   bucket_total(day) = sum(amount_cents of prior record-spends with the same
      #                           spend_day_index) + this call's amount_cents
      #   if bucket_total(spend_day_index) > daily_cap_cents -> ERR_DAILY_CAP_EXCEEDED  (strict >)
      # spend_day_index must be >= the highest spend_day_index seen so far (monotonic
      # non-decreasing); a new (higher) index opens a fresh bucket.
      # days_elapsed = count of distinct spend_day_index values recorded.
      # current_day_spent_cents = bucket_total for the highest spend_day_index.
      # Reservation ceiling (independent of the daily window):
      #   spent_budget_cents + amount_cents > reserved_budget_cents -> ERR_BOOST_OVERSPEND  (strict >)
      # Pacing diagnostics (not persisted):
      #   expected_to_date = daily_cap_cents * days_elapsed
      #   is_overpacing = (spent_budget_cents > expected_to_date)   # strict >
      #   is_at_pace    = (spent_budget_cents == expected_to_date)  # exact boundary
    constants: {}
    input_set: "the single BoostCampaign being charged, keyed by spend_day_index bucket"
    precision: "integer cents; pacing_ratio is a float, not persisted"

  - name: engagement_rate
    trigger: "POST /clients/{clientId}/analytics-snapshots (snapshot creation)"
    algorithm: weighted_scoring
    formula: |
      if total_impressions == 0:
        engagement_rate_bps = 0           # empty-impression edge: defined as 0, not div-by-zero
      else:
        # round per-component to integer bps, NOT sum-then-round:
        # bps = round_half_up( total_engagements / total_impressions * 10000 )
        engagement_rate_bps = round_half_up(total_engagements * 10000 / total_impressions)
    constants:
      BPS_SCALE: 10000
    input_set: "AnalyticsSnapshot.total_engagements and total_impressions (client-supplied)"
    precision: "integer basis points, round_half_up; the multiply-before-divide order is pinned to avoid truncation"

  - name: collab_settlement_amount
    trigger: "POST /influencer-collabs/{collabId}/close (settlement quote read)"
    algorithm: tiered_pricing
    formula: |
      base = offer_fee_cents                              # final accepted fee
      # Per-deliverable bonus tier applied to approved assets, evaluated in order:
      #   approved_asset_count <= 2  -> bonus_rate = 0.00
      #   3 <= approved_asset_count <= 5 -> bonus_rate = 0.05 on (approved_asset_count - 2) deliverables
      #   approved_asset_count >= 6  -> 0.05 on deliverables 3..5 PLUS 0.10 on deliverables 6..n
      # Bonus is computed per-deliverable then summed (round per-line-item then sum),
      # where each deliverable's nominal value = floor(base / deliverable_count).
      per_deliverable_value = floor(base / deliverable_count)
      tier1 = 0                                            # deliverables 1..2: no bonus
      tier2_units = max(0, min(approved_asset_count, 5) - 2)
      tier3_units = max(0, approved_asset_count - 5)
      bonus = floor(per_deliverable_value * 0.05) * tier2_units
            + floor(per_deliverable_value * 0.10) * tier3_units
      settlement_amount_cents = base + bonus
      EVALUATION ORDER PINNED: compute per_deliverable_value first, floor each
      per-unit bonus, then multiply by unit count, then sum — "round per-line-item
      then sum", NOT "sum then round".
    constants:
      TIER2_RATE: 0.05
      TIER3_RATE: 0.10
      TIER2_FLOOR: 2
      TIER3_FLOOR: 5
    input_set: "InfluencerCollab.offer_fee_cents, deliverable_count, approved_asset_count"
    precision: "integer cents; floor per line item before summing"

  - name: boost_settlement_cost
    trigger: "GET /boost-campaigns/{boostId} (cost figures) and boost complete"
    algorithm: forward_looking
    formula: |
      # Dual-variant cost on a BoostCampaign — a DIFFERENT entity domain than the
      # Client retainer proration. Two valid approaches to "what the boost costs"
      # diverge for identical inputs:
      #   variant provisional_reserved: cost = reserved_budget_cents
      #     (forward-looking: the full reservation is the committed cost the moment
      #      the campaign is RESERVED/RUNNING — used to gate budget availability)
      #   variant final_spent: cost = spent_budget_cents
      #     (settlement: only actually-recorded spend is billed at COMPLETED)
      # final variant uses >=3 inputs with non-linear min/max interaction:
      #   billable = min(spent_budget_cents,
      #                  daily_cap_cents * days_elapsed,    # pacing ceiling
      #                  reserved_budget_cents)             # reservation ceiling
      #   (the three ceilings interact; the smallest binds)
    constants: {}
    input_set: "the single BoostCampaign: reserved_budget_cents, spent_budget_cents, daily_cap_cents, days_elapsed"
    precision: "integer cents, exact"
    variants:
      - name: provisional_reserved
        when: "while RESERVED or RUNNING — budget gating uses the full reservation"
        difference: "cost = reserved_budget_cents (the whole locked amount)"
      - name: final_spent
        when: "at COMPLETED — settlement bills only recorded spend, clamped by pacing and reservation ceilings"
        difference: "cost = min(spent_budget_cents, daily_cap_cents*days_elapsed, reserved_budget_cents)"

  - name: retainer_proration_on_churn
    trigger: "GET /clients/{clientId}/churn-quote (final retainer proration read)"
    algorithm: chronological
    formula: |
      # Forward-looking vs chronological divergence on the SAME retainer fee:
      # variant A (forward_full): the whole cycle's retainer is owed once the
      #   cycle opened, regardless of when churn happens -> owed = retainer_fee_cents
      # variant B (chronological_prorated): owed scales by posts actually published
      #   this cycle against quota:
      #   owed = ceil(retainer_fee_cents * posts_published_this_cycle / monthly_post_quota)
      #   (monthly_post_quota >= 1 guaranteed; if posts_published_this_cycle == 0 -> owed = 0)
      # The churn-quote endpoint returns BOTH figures; settlement uses chronological_prorated.
    constants: {}
    input_set: "Client.retainer_fee_cents, posts_published_this_cycle, monthly_post_quota"
    precision: "integer cents; variant A truncates nothing, variant B uses ceil"
    variants:
      - name: forward_full
        when: "naive read — full cycle retainer owed at cycle open"
        difference: "owed = retainer_fee_cents, independent of usage"
      - name: chronological_prorated
        when: "settlement read — retainer scaled by posts published vs quota"
        difference: "owed = ceil(retainer_fee_cents * posts_published_this_cycle / monthly_post_quota)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every resource id in the path exists (validated left-to-right); a child whose FK parent does not match a referenced path id is treated as not found"
    error_id: "ERR_CLIENT_NOT_FOUND / ERR_CHANNEL_NOT_FOUND / ERR_CONTENT_NOT_FOUND / ERR_BOOST_NOT_FOUND / ERR_CONVERSATION_NOT_FOUND / ERR_COLLAB_NOT_FOUND / ERR_ASSET_NOT_FOUND / ERR_PACKAGE_NOT_FOUND / ERR_SLOT_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with a path id

  - priority: 4
    category: existence
    check: "FK fields in a create body reference an existing parent of the correct type"
    error_id: "ERR_CLIENT_NOT_FOUND / ERR_CHANNEL_NOT_FOUND / ERR_CONTENT_NOT_FOUND / ERR_COLLAB_NOT_FOUND"
    http_status: 404
    applies_to: "POST /channels, POST /content-items, POST /content-targets, POST /schedule-slots, POST /boost-campaigns, POST /conversations, POST /messages, POST /ugc-assets, POST /retainer-packages"

  - priority: 5
    category: business_referential
    check: "On POST /content-targets the channel's client_id must equal the content item's client_id; on POST /schedule-slots and boost reserve the referenced ContentItem and Channel must belong to the same client"
    error_id: ERR_CROSS_CLIENT_REFERENCE
    http_status: 409
    applies_to: "POST /content-targets, POST /schedule-slots, POST /boost-campaigns"

  - priority: 6
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: "ERR_INVALID_STATE (entity-specific message)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: state
    check: "Cross-entity state precondition holds (e.g., content submit requires Client.status==ACTIVE; channel go-live requires owning client not CHURNED; boost launch requires ContentItem PUBLISHED)"
    error_id: "ERR_CLIENT_NOT_ACTIVE / ERR_CONTENT_NOT_PUBLISHED / ERR_CHANNEL_NOT_LIVE"
    http_status: 409
    applies_to: "POST /content-items/{id}/submit, POST /channels/{id}/go-live, POST /boost-campaigns/{id}/launch, POST /conversations/{id}/assign"

  - priority: 8
    category: business_constraint
    check: "Channel handle is unique within (client_id, platform)"
    error_id: ERR_DUPLICATE_HANDLE
    http_status: 409
    applies_to: "POST /channels"

  - priority: 9
    category: business_constraint
    check: "Re-activating a package whose status is already ACTIVE is rejected (the activate transition is defined only from DRAFT; activating a DRAFT package instead auto-supersedes any prior ACTIVE package of the same client). A package in SUPERSEDED yields ERR_INVALID_STATE."
    error_id: ERR_PACKAGE_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /retainer-packages/{id}/activate"

  - priority: 10
    category: business_constraint
    check: "Going LIVE must not exceed the active package included_channels count"
    error_id: ERR_CHANNEL_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /channels/{id}/go-live"

  - priority: 11
    category: business_temporal
    check: "A new ScheduleSlot on a channel must not overlap the half-open window [start, start+duration) of any RESERVED or FIRED slot on the same channel, and must be separated from the nearest such slot by at least channel.min_publish_gap_minutes"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /schedule-slots"

  - priority: 12
    category: business_temporal
    check: "A BoostCampaign record-spend's amount, added to prior spend already in the same spend_day_index bucket, must not push that day's aggregate above daily_cap_cents (a per-day aggregate capacity window, distinct from slot time-geometry intervals). spend_day_index must be monotonic non-decreasing."
    error_id: ERR_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /boost-campaigns/{id}/record-spend"

  - priority: 13
    category: business_constraint
    check: "Publishing is blocked once posts_published_this_cycle has reached monthly_post_quota"
    error_id: ERR_POST_QUOTA_EXCEEDED
    http_status: 409
    applies_to: "POST /content-items/{id}/publish"

  - priority: 14
    category: business_fiscal
    check: "OCC: reserve body expected_client_version must equal Client.version"
    error_id: ERR_STALE_CLIENT_VERSION
    http_status: 412
    applies_to: "POST /boost-campaigns/{id}/reserve"

  - priority: 15
    category: business_fiscal
    check: "Boost reservation requested_budget_cents must not exceed Client.boost_available_cents"
    error_id: ERR_BOOST_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /boost-campaigns/{id}/reserve"

  - priority: 16
    category: business_fiscal
    check: "Cumulative spent_budget_cents + amount_cents must not exceed reserved_budget_cents"
    error_id: ERR_BOOST_OVERSPEND
    http_status: 402
    applies_to: "POST /boost-campaigns/{id}/record-spend"

  - priority: 17
    category: business_constraint
    check: "Collab mark-delivered requires approved_asset_count >= deliverable_count"
    error_id: ERR_DELIVERABLES_NOT_MET
    http_status: 409
    applies_to: "POST /influencer-collabs/{id}/mark-delivered"

  - priority: 18
    category: business_constraint
    check: "Request body required fields present and typed correctly; enum values within declared set; positive-amount and >=1 count constraints honored"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all write endpoints

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clients ----
  - { method: POST, path: "/clients", description: "Create a client account (ONBOARDING)", roles: [AccountManager, PlatformAdmin], code: 201, input: [name, account_manager_id], output: Client, side_effects: ["status=ONBOARDING, current_cycle_index=0, all budget fields 0"] }
  - { method: GET, path: "/clients", description: "List clients", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: ["status?", "account_manager_id?", "limit?", "offset?"], output: "Client[]", side_effects: [] }
  - { method: GET, path: "/clients/{clientId}", description: "Get a client", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: [], output: Client, side_effects: [] }
  - { method: POST, path: "/clients/{clientId}/activate", description: "Activate client (ONBOARDING->ACTIVE)", roles: [AccountManager], code: 200, input: [], output: Client, side_effects: ["copy package terms, append RETAINER_CHARGE ledger entry"] }
  - { method: POST, path: "/clients/{clientId}/suspend", description: "Suspend client", roles: [AccountManager, PlatformAdmin], code: 200, input: [], output: Client, side_effects: ["status->SUSPENDED"] }
  - { method: POST, path: "/clients/{clientId}/reinstate", description: "Reinstate suspended client", roles: [AccountManager, PlatformAdmin], code: 200, input: [], output: Client, side_effects: ["status->ACTIVE"] }
  - { method: POST, path: "/clients/{clientId}/churn", description: "Churn client (terminal)", roles: [PlatformAdmin], code: 200, input: [], output: Client, side_effects: ["disconnect channels, resolve conversations"] }
  - { method: POST, path: "/clients/{clientId}/cycles/close", description: "Close current billing cycle and advance the deterministic cycle clock", roles: [PlatformAdmin, AccountManager], code: 200, input: [], output: Client, side_effects: ["current_cycle_index += 1; posts_published_this_cycle recomputed for new cycle (=0)"] }
  - { method: GET, path: "/clients/{clientId}/churn-quote", description: "Read retainer churn proration (both forward_full and chronological_prorated)", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: [], output: "{ forward_full_cents: integer, chronological_prorated_cents: integer }", side_effects: [] }

  # ---- Retainer Packages ----
  - { method: POST, path: "/retainer-packages", description: "Create a draft retainer package for a client", roles: [AccountManager], code: 201, input: [client_id, tier, monthly_retainer_fee_cents, monthly_boost_budget_cents, monthly_post_quota, included_channels], output: RetainerPackage, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/retainer-packages", description: "List retainer packages (filter by client)", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: ["client_id?", "status?", "limit?", "offset?"], output: "RetainerPackage[]", side_effects: [] }
  - { method: GET, path: "/retainer-packages/{packageId}", description: "Get a retainer package", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: [], output: RetainerPackage, side_effects: [] }
  - { method: POST, path: "/retainer-packages/{packageId}/activate", description: "Activate package (DRAFT->ACTIVE), supersede prior active", roles: [AccountManager], code: 200, input: [], output: RetainerPackage, side_effects: ["prior ACTIVE package->SUPERSEDED"] }

  # ---- Channels ----
  - { method: POST, path: "/channels", description: "Onboard a channel (PENDING)", roles: [AccountManager], code: 201, input: [client_id, platform, handle, "min_publish_gap_minutes?"], output: Channel, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/channels", description: "List channels (filter by client)", roles: [AccountManager, PlatformAdmin, FinanceController, CommunityAgent], code: 200, input: ["client_id?", "status?", "platform?", "limit?", "offset?"], output: "Channel[]", side_effects: [] }
  - { method: GET, path: "/channels/{channelId}", description: "Get a channel", roles: [AccountManager, PlatformAdmin, FinanceController, CommunityAgent], code: 200, input: [], output: Channel, side_effects: [] }
  - { method: POST, path: "/channels/{channelId}/connect", description: "Connect channel (PENDING->CONNECTED)", roles: [AccountManager], code: 200, input: [], output: Channel, side_effects: [] }
  - { method: POST, path: "/channels/{channelId}/go-live", description: "Go live (CONNECTED->LIVE)", roles: [AccountManager], code: 200, input: [], output: Channel, side_effects: ["enforces package included_channels"] }
  - { method: POST, path: "/channels/{channelId}/disconnect", description: "Disconnect channel (->DISCONNECTED)", roles: [AccountManager], code: 200, input: [], output: Channel, side_effects: ["release RESERVED slots; affected SCHEDULED content -> APPROVED"] }

  # ---- Content Items ----
  - { method: POST, path: "/content-items", description: "Create a draft content item", roles: [ContentCreator, AccountManager], code: 201, input: [client_id, author_id, title, body], output: ContentItem, side_effects: ["status=DRAFT, revision_round=0"] }
  - { method: GET, path: "/content-items", description: "List content items (filter by client/status)", roles: [ContentCreator, AccountManager, Approver, PlatformAdmin], code: 200, input: ["client_id?", "status?", "scheduled_slot_id?", "limit?", "offset?"], output: "ContentItem[]", side_effects: [] }
  - { method: GET, path: "/content-items/{contentItemId}", description: "Get a content item", roles: [ContentCreator, AccountManager, Approver, PlatformAdmin], code: 200, input: [], output: ContentItem, side_effects: [] }
  - { method: POST, path: "/content-items/{contentItemId}/submit", description: "Submit for review (DRAFT->IN_REVIEW)", roles: [ContentCreator], code: 200, input: [], output: ContentItem, side_effects: [] }
  - { method: POST, path: "/content-items/{contentItemId}/request-changes", description: "Request changes (IN_REVIEW->CHANGES_REQUESTED)", roles: [Approver], code: 200, input: ["note?"], output: ContentItem, side_effects: [] }
  - { method: POST, path: "/content-items/{contentItemId}/resubmit", description: "Resubmit after changes (CHANGES_REQUESTED->IN_REVIEW)", roles: [ContentCreator], code: 200, input: [], output: ContentItem, side_effects: ["revision_round += 1"] }
  - { method: POST, path: "/content-items/{contentItemId}/approve", description: "Approve (IN_REVIEW->APPROVED)", roles: [Approver], code: 200, input: [], output: ContentItem, side_effects: [] }
  - { method: POST, path: "/content-items/{contentItemId}/schedule", description: "Schedule approved item by reserving a slot (APPROVED->SCHEDULED)", roles: [AccountManager], code: 200, input: [channel_id, slot_start_utc, "duration_minutes?"], output: ContentItem, side_effects: ["reserve ScheduleSlot; set scheduled_slot_id"] }
  - { method: POST, path: "/content-items/{contentItemId}/unschedule", description: "Unschedule (SCHEDULED->APPROVED)", roles: [AccountManager], code: 200, input: [], output: ContentItem, side_effects: ["release slot; clear scheduled_slot_id"] }
  - { method: POST, path: "/content-items/{contentItemId}/publish", description: "Publish (SCHEDULED->PUBLISHED)", roles: [AccountManager], code: 200, input: [], output: ContentItem, side_effects: ["fire slot; fan out ContentTargets; capture published_cycle_index; bump quota counter"] }
  - { method: POST, path: "/content-items/{contentItemId}/archive", description: "Archive (->ARCHIVED)", roles: [ContentCreator, AccountManager], code: 200, input: [], output: ContentItem, side_effects: [] }

  # ---- Content Targets (many-to-many ContentItem<->Channel) ----
  - { method: POST, path: "/content-targets", description: "Attach a content item to a channel as a publish target", roles: [ContentCreator, AccountManager], code: 201, input: [content_item_id, channel_id], output: ContentTarget, side_effects: ["publish_state=PENDING"] }
  - { method: GET, path: "/content-targets", description: "List content targets (filter by content item or channel)", roles: [ContentCreator, AccountManager, Approver, PlatformAdmin], code: 200, input: ["content_item_id?", "channel_id?", "limit?", "offset?"], output: "ContentTarget[]", side_effects: [] }
  - { method: GET, path: "/content-targets/{targetId}", description: "Get a content target", roles: [ContentCreator, AccountManager, Approver, PlatformAdmin], code: 200, input: [], output: ContentTarget, side_effects: [] }

  # ---- Schedule Slots ----
  - { method: GET, path: "/schedule-slots", description: "List schedule slots (filter by channel or content item)", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: ["channel_id?", "content_item_id?", "status?", "limit?", "offset?"], output: "ScheduleSlot[]", side_effects: [] }
  - { method: GET, path: "/schedule-slots/{slotId}", description: "Get a schedule slot", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: [], output: ScheduleSlot, side_effects: [] }

  # ---- Boost Campaigns ----
  - { method: POST, path: "/boost-campaigns", description: "Create a draft boost campaign", roles: [FinanceController, AccountManager], code: 201, input: [client_id, content_item_id, requested_budget_cents, daily_cap_cents, duration_days], output: BoostCampaign, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/boost-campaigns", description: "List boost campaigns (filter by client or content item)", roles: [FinanceController, AccountManager, PlatformAdmin], code: 200, input: ["client_id?", "content_item_id?", "status?", "limit?", "offset?"], output: "BoostCampaign[]", side_effects: [] }
  - { method: GET, path: "/boost-campaigns/{boostId}", description: "Get a boost campaign", roles: [FinanceController, AccountManager, PlatformAdmin], code: 200, input: [], output: BoostCampaign, side_effects: [] }
  - { method: POST, path: "/boost-campaigns/{boostId}/reserve", description: "Reserve budget (DRAFT->RESERVED) with OCC on client", roles: [FinanceController], code: 200, input: [expected_client_version], output: BoostCampaign, side_effects: ["lock budget; recompute client budget; ledger BOOST_RESERVE; Client.version += 1"] }
  - { method: POST, path: "/boost-campaigns/{boostId}/launch", description: "Launch (RESERVED->RUNNING)", roles: [FinanceController], code: 200, input: [], output: BoostCampaign, side_effects: ["requires content PUBLISHED"] }
  - { method: POST, path: "/boost-campaigns/{boostId}/record-spend", description: "Record spend into a per-day bucket (RUNNING->RUNNING). spend_day_index defaults to the current day if omitted.", roles: [FinanceController], code: 200, input: [amount_cents, "spend_day_index?"], output: BoostCampaign, side_effects: ["bucket aggregate checked vs daily_cap; spent += amount; ledger BOOST_SPEND; recompute client spent"] }
  - { method: POST, path: "/boost-campaigns/{boostId}/complete", description: "Complete (RUNNING->COMPLETED), release unspent", roles: [FinanceController], code: 200, input: [], output: BoostCampaign, side_effects: ["ledger BOOST_RELEASE for unspent; recompute client budget"] }
  - { method: POST, path: "/boost-campaigns/{boostId}/cancel", description: "Cancel (DRAFT|RESERVED->CANCELLED), release reservation", roles: [FinanceController], code: 200, input: [], output: BoostCampaign, side_effects: ["ledger BOOST_RELEASE for reserved; recompute client budget"] }

  # ---- Ledger ----
  - { method: GET, path: "/ledger-entries", description: "List ledger entries (filter by client or boost campaign)", roles: [FinanceController, AccountManager, PlatformAdmin], code: 200, input: ["client_id?", "boost_campaign_id?", "entry_type?", "limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/ledger-entries/{entryId}", description: "Get a ledger entry", roles: [FinanceController, AccountManager, PlatformAdmin], code: 200, input: [], output: LedgerEntry, side_effects: [] }

  # ---- Conversations / Community management ----
  - { method: POST, path: "/conversations", description: "Open a community conversation thread", roles: [CommunityAgent, AccountManager], code: 201, input: [channel_id, kind, external_author_handle], output: Conversation, side_effects: ["status=OPEN"] }
  - { method: GET, path: "/conversations", description: "List conversations (filter by channel/status)", roles: [CommunityAgent, AccountManager, PlatformAdmin], code: 200, input: ["channel_id?", "status?", "assigned_agent_id?", "limit?", "offset?"], output: "Conversation[]", side_effects: [] }
  - { method: GET, path: "/conversations/{conversationId}", description: "Get a conversation", roles: [CommunityAgent, AccountManager, PlatformAdmin], code: 200, input: [], output: Conversation, side_effects: [] }
  - { method: POST, path: "/conversations/{conversationId}/assign", description: "Assign/claim conversation (OPEN|ESCALATED->ASSIGNED)", roles: [CommunityAgent], code: 200, input: [], output: Conversation, side_effects: ["assigned_agent_id = acting agent"] }
  - { method: POST, path: "/conversations/{conversationId}/escalate", description: "Escalate (OPEN|ASSIGNED->ESCALATED)", roles: [CommunityAgent], code: 200, input: ["reason?"], output: Conversation, side_effects: [] }
  - { method: POST, path: "/conversations/{conversationId}/resolve", description: "Resolve (ASSIGNED|ESCALATED->RESOLVED)", roles: [CommunityAgent], code: 200, input: [], output: Conversation, side_effects: [] }

  # ---- Engagement Messages (append-only under a conversation) ----
  - { method: POST, path: "/messages", description: "Append a message to a conversation", roles: [CommunityAgent], code: 201, input: [conversation_id, direction, body, "author_agent_id?"], output: EngagementMessage, side_effects: ["Conversation.message_count recomputed"] }
  - { method: GET, path: "/messages", description: "List messages (filter by conversation)", roles: [CommunityAgent, AccountManager, PlatformAdmin], code: 200, input: ["conversation_id?", "direction?", "limit?", "offset?"], output: "EngagementMessage[]", side_effects: [] }
  - { method: GET, path: "/messages/{messageId}", description: "Get a message", roles: [CommunityAgent, AccountManager, PlatformAdmin], code: 200, input: [], output: EngagementMessage, side_effects: [] }

  # ---- Influencer Collabs ----
  - { method: POST, path: "/influencer-collabs", description: "Propose an influencer collaboration (PROPOSED)", roles: [AccountManager], code: 201, input: [client_id, influencer_handle, offer_fee_cents, deliverable_count], output: InfluencerCollab, side_effects: ["status=PROPOSED, negotiation_round=0"] }
  - { method: GET, path: "/influencer-collabs", description: "List collabs (filter by client/status)", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: ["client_id?", "status?", "limit?", "offset?"], output: "InfluencerCollab[]", side_effects: [] }
  - { method: GET, path: "/influencer-collabs/{collabId}", description: "Get a collab", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: [], output: InfluencerCollab, side_effects: [] }
  - { method: POST, path: "/influencer-collabs/{collabId}/counter", description: "Counter-offer (PROPOSED|COUNTERED->COUNTERED)", roles: [AccountManager], code: 200, input: [counter_fee_cents], output: InfluencerCollab, side_effects: ["offer_fee_cents updated; negotiation_round += 1"] }
  - { method: POST, path: "/influencer-collabs/{collabId}/accept", description: "Accept (PROPOSED|COUNTERED->ACCEPTED)", roles: [AccountManager], code: 200, input: [], output: InfluencerCollab, side_effects: [] }
  - { method: POST, path: "/influencer-collabs/{collabId}/mark-delivered", description: "Mark delivered (ACCEPTED->DELIVERED)", roles: [AccountManager], code: 200, input: [], output: InfluencerCollab, side_effects: ["requires approved_asset_count >= deliverable_count"] }
  - { method: POST, path: "/influencer-collabs/{collabId}/close", description: "Close (DELIVERED->CLOSED)", roles: [AccountManager], code: 200, input: [], output: InfluencerCollab, side_effects: [] }
  - { method: POST, path: "/influencer-collabs/{collabId}/cancel", description: "Cancel collab (->CANCELLED)", roles: [AccountManager], code: 200, input: [], output: InfluencerCollab, side_effects: ["SUBMITTED assets -> REJECTED"] }
  - { method: GET, path: "/influencer-collabs/{collabId}/settlement-quote", description: "Read tiered settlement amount for the collab", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: [], output: "{ settlement_amount_cents: integer }", side_effects: [] }

  # ---- UGC Assets ----
  - { method: POST, path: "/ugc-assets", description: "Submit a UGC asset under a collab (SUBMITTED)", roles: [AccountManager], code: 201, input: [collab_id, asset_url], output: UGCAsset, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/ugc-assets", description: "List UGC assets (filter by collab/status)", roles: [AccountManager, PlatformAdmin], code: 200, input: ["collab_id?", "status?", "limit?", "offset?"], output: "UGCAsset[]", side_effects: [] }
  - { method: GET, path: "/ugc-assets/{assetId}", description: "Get a UGC asset", roles: [AccountManager, PlatformAdmin], code: 200, input: [], output: UGCAsset, side_effects: [] }
  - { method: POST, path: "/ugc-assets/{assetId}/clear-rights", description: "Clear rights (SUBMITTED->RIGHTS_CLEARED)", roles: [AccountManager], code: 200, input: [], output: UGCAsset, side_effects: ["collab approved_asset_count recomputed"] }
  - { method: POST, path: "/ugc-assets/{assetId}/reject", description: "Reject asset (SUBMITTED->REJECTED)", roles: [AccountManager], code: 200, input: [], output: UGCAsset, side_effects: [] }

  # ---- Analytics ----
  - { method: POST, path: "/clients/{clientId}/analytics-snapshots", description: "Create an analytics snapshot for the current cycle", roles: [AccountManager, PlatformAdmin], code: 201, input: [total_impressions, total_engagements], output: AnalyticsSnapshot, side_effects: ["engagement_rate_bps computed; posts_published, boost_spent_cents captured"] }
  - { method: GET, path: "/analytics-snapshots", description: "List analytics snapshots (filter by client/cycle)", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: ["client_id?", "cycle_index?", "limit?", "offset?"], output: "AnalyticsSnapshot[]", side_effects: [] }
  - { method: GET, path: "/analytics-snapshots/{snapshotId}", description: "Get an analytics snapshot", roles: [AccountManager, PlatformAdmin, FinanceController], code: 200, input: [], output: AnalyticsSnapshot, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- request / auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/mistyped required field, bad enum, non-positive amount, or count < 1" }
  # --- not found ---
  - { id: ERR_CLIENT_NOT_FOUND, http: 404, condition: "Client id does not exist" }
  - { id: ERR_PACKAGE_NOT_FOUND, http: 404, condition: "RetainerPackage id does not exist" }
  - { id: ERR_CHANNEL_NOT_FOUND, http: 404, condition: "Channel id does not exist" }
  - { id: ERR_CONTENT_NOT_FOUND, http: 404, condition: "ContentItem id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "ScheduleSlot id does not exist" }
  - { id: ERR_BOOST_NOT_FOUND, http: 404, condition: "BoostCampaign id does not exist" }
  - { id: ERR_CONVERSATION_NOT_FOUND, http: 404, condition: "Conversation id does not exist" }
  - { id: ERR_COLLAB_NOT_FOUND, http: 404, condition: "InfluencerCollab id does not exist" }
  - { id: ERR_ASSET_NOT_FOUND, http: 404, condition: "UGCAsset id does not exist" }
  # --- referential / cross-entity ---
  - { id: ERR_CROSS_CLIENT_REFERENCE, http: 409, condition: "Referenced channel/content belong to different clients" }
  # --- state ---
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the entity's current state" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Operation requires owning Client.status == ACTIVE" }
  - { id: ERR_CONTENT_NOT_PUBLISHED, http: 409, condition: "Boost launch requires ContentItem.status == PUBLISHED" }
  - { id: ERR_CHANNEL_NOT_LIVE, http: 409, condition: "Operation requires Channel.status == LIVE" }
  # --- business constraints ---
  - { id: ERR_DUPLICATE_HANDLE, http: 409, condition: "Channel handle already used within (client_id, platform)" }
  - { id: ERR_PACKAGE_ALREADY_ACTIVE, http: 409, condition: "Activate called on a package whose status is already ACTIVE (re-activation; activating a DRAFT package auto-supersedes any prior ACTIVE one instead)" }
  - { id: ERR_CHANNEL_LIMIT_EXCEEDED, http: 409, condition: "Going LIVE would exceed package included_channels" }
  - { id: ERR_POST_QUOTA_EXCEEDED, http: 409, condition: "posts_published_this_cycle already at monthly_post_quota" }
  - { id: ERR_DELIVERABLES_NOT_MET, http: 409, condition: "approved_asset_count < deliverable_count on mark-delivered" }
  # --- temporal ---
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Schedule slot overlaps or violates min_publish_gap_minutes on the channel" }
  - { id: ERR_DAILY_CAP_EXCEEDED, http: 409, condition: "Recorded spend amount exceeds daily_cap_cents" }
  # --- fiscal ---
  - { id: ERR_STALE_CLIENT_VERSION, http: 412, condition: "expected_client_version != Client.version on boost reserve (OCC)" }
  - { id: ERR_BOOST_BUDGET_EXCEEDED, http: 402, condition: "requested_budget_cents > Client.boost_available_cents" }
  - { id: ERR_BOOST_OVERSPEND, http: 402, condition: "spent + amount > reserved_budget_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AccountManager
    description: "Owns client accounts, channel onboarding, content scheduling, influencer collabs"
    identity: opaque
    exclusive_operations:
      - "POST /clients/{id}/activate — Activate client"
      - "POST /retainer-packages — Create package"
      - "POST /retainer-packages/{id}/activate — Activate package"
      - "POST /channels — Onboard channel"
      - "POST /channels/{id}/connect — Connect channel"
      - "POST /channels/{id}/go-live — Channel go-live"
      - "POST /channels/{id}/disconnect — Disconnect channel"
      - "POST /content-items/{id}/schedule — Schedule content"
      - "POST /content-items/{id}/unschedule — Unschedule content"
      - "POST /content-items/{id}/publish — Publish content"
      - "POST /influencer-collabs — Propose collab"
      - "POST /influencer-collabs/{id}/counter — Counter offer"
      - "POST /influencer-collabs/{id}/accept — Accept collab"
      - "POST /influencer-collabs/{id}/mark-delivered — Mark delivered"
      - "POST /influencer-collabs/{id}/close — Close collab"
      - "POST /influencer-collabs/{id}/cancel — Cancel collab"
      - "POST /ugc-assets — Submit UGC asset"
      - "POST /ugc-assets/{id}/clear-rights — Clear rights"
      - "POST /ugc-assets/{id}/reject — Reject asset"
    shared_operations:
      - "POST /clients — Create client (with PlatformAdmin)"
      - "POST /clients/{id}/suspend, /reinstate — (with PlatformAdmin)"
      - "POST /clients/{id}/cycles/close — Close cycle (with PlatformAdmin)"
      - "POST /content-items — Create content (with ContentCreator)"
      - "POST /content-targets — Attach target (with ContentCreator)"
      - "POST /content-items/{id}/archive — Archive (with ContentCreator)"
      - "POST /boost-campaigns — Create boost (with FinanceController)"
      - "POST /conversations — Open conversation (with CommunityAgent)"
      - "POST /clients/{id}/analytics-snapshots — Snapshot (with PlatformAdmin)"
      - "GET endpoints — read access"

  - name: ContentCreator
    description: "Drafts content and drives the revision loop"
    identity: opaque
    exclusive_operations:
      - "POST /content-items/{id}/submit — Submit for review"
      - "POST /content-items/{id}/resubmit — Resubmit after changes"
    shared_operations:
      - "POST /content-items — Create content (with AccountManager)"
      - "POST /content-targets — Attach target (with AccountManager)"
      - "POST /content-items/{id}/archive — Archive (with AccountManager)"
      - "GET content endpoints — read access"

  - name: Approver
    description: "Reviews submitted content; approves or requests changes"
    identity: opaque
    exclusive_operations:
      - "POST /content-items/{id}/approve — Approve"
      - "POST /content-items/{id}/request-changes — Request changes"
    shared_operations:
      - "GET content endpoints — read access"

  - name: CommunityAgent
    description: "Handles DM/comment threads and engagement messages"
    identity: opaque
    exclusive_operations:
      - "POST /conversations/{id}/assign — Assign"
      - "POST /conversations/{id}/escalate — Escalate"
      - "POST /conversations/{id}/resolve — Resolve"
      - "POST /messages — Append message"
    shared_operations:
      - "POST /conversations — Open conversation (with AccountManager)"
      - "GET conversation/message/channel endpoints — read access"

  - name: FinanceController
    description: "Owns ad-boost budget reservation, spend, and ledger"
    identity: opaque
    exclusive_operations:
      - "POST /boost-campaigns/{id}/reserve — Reserve budget (OCC)"
      - "POST /boost-campaigns/{id}/launch — Launch"
      - "POST /boost-campaigns/{id}/record-spend — Record spend"
      - "POST /boost-campaigns/{id}/complete — Complete"
      - "POST /boost-campaigns/{id}/cancel — Cancel"
    shared_operations:
      - "POST /boost-campaigns — Create boost (with AccountManager)"
      - "GET budget/ledger endpoints — read access"

  - name: PlatformAdmin
    description: "Operational superuser for lifecycle + churn"
    identity: opaque
    exclusive_operations:
      - "POST /clients/{id}/churn — Churn client"
    shared_operations:
      - "POST /clients — Create client (with AccountManager)"
      - "POST /clients/{id}/suspend, /reinstate — (with AccountManager)"
      - "POST /clients/{id}/cycles/close — Close cycle (with AccountManager)"
      - "POST /clients/{id}/analytics-snapshots — Snapshot (with AccountManager)"
      - "GET endpoints — read access"
