  - rule_id: non_linear_state_machine
    instances:
      - name: negotiation_cycle_returns_to_proposed_and_exhausts_on_the_third_round
        grounds:
          - state_machines.CreativeAssignment.PROPOSED_to_COUNTERED
          - state_machines.CreativeAssignment.COUNTERED_to_PROPOSED
          - entities.CreativeAssignment.fields.negotiation_round
          - entities.CreativeAssignment.fields.counter_page_rate_cents
          - errors.ERR_NEGOTIATION_ROUNDS_EXHAUSTED
        distinguishing_aspect: |
          Cycle PROPOSED -> COUNTERED -> PROPOSED traversed three times on one assignment: the state
          returns to its starting value while negotiation_round ratchets 1 -> 2 -> 3, the counter fields
          are cleared on every re-entry, and the fourth traversal is refused, so the loop is bounded by
          a counter rather than by the state graph.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "creator 'Wanda Writer' with craft SCRIPT"
            - "GREENLIT title with cover_participation_bps 1500"
