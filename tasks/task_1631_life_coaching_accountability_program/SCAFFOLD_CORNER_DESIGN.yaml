  # ===========================================================================
  # Section: errors (catalog triggerability not covered above/§1.8)
  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_on_failure
        claim_type: violation_to_error
        grounds: [response_envelope, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Error responses use the fixed envelope: response_type 'error' with data.error_id and data.message keys, plus meta block."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /coaching/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /coaching/coaches"
              payload: { display_name: "No Email Coach", credential_level: "ACC", credential_expires_on: "2027-01-01", max_concurrent_clients: 5 }
              as: PracticeManager
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "error_id == ERR_INVALID_REQUEST (missing required email); data.message is a non-empty string; meta.api_request_id present"

      - name: err_session_overlap_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_SESSION_OVERLAP]"]
        excluded_because:
          difficulty_instance: session_overlap_half_open_with_buffer
          rationale: "Asserted as the failure branch of the named §1.8 instance (11:14 booking)."

      - name: err_discovery_call_overlap_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_DISCOVERY_CALL_OVERLAP]"]
        excluded_because:
          difficulty_instance: discovery_call_overlap_closed_interval_no_buffer
          rationale: "Asserted as the failure branch of the named §1.8 instance (10:30 touching booking)."

      - name: err_coach_not_credentialed_triggerable
        claim_type: violation_to_error
        grounds: ["errors[ERR_COACH_NOT_CREDENTIALED]"]
        excluded_because:
          difficulty_instance: session_completion_gated_by_coach_credential
          rationale: "Asserted as the failure branch of the named §1.8 instance."

      - name: err_fit_not_established_triggerable
