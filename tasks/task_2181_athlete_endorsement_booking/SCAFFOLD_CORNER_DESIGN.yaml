scaffold_corner_design:
  - section: entities
    instances:
      - name: athlete_creation_sets_system_defaults
        claim_type: creation
        grounds: ["entities.Athlete.fields.status", "entities.Athlete.fields.active_exclusivity_count", "endpoints[POST /athletes]"]
        distinguishing_aspect: "A fresh Athlete returns 201 with status ACTIVE, active_exclusivity_count 0, exposure_risk_snapshot_score 0, no_show_count 0 and version 1."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
          trigger:
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15, home_market: "US" }
              as: TalentAgent
              captures: { ath_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "Athlete.${ath_id}.status == ACTIVE"
            - "Athlete.${ath_id}.active_exclusivity_count == 0"
            - "Athlete.${ath_id}.exposure_risk_snapshot_score == 0"
            - "Athlete.${ath_id}.no_show_count == 0"
            - "Athlete.${ath_id}.version == 1"
            - "response meta contains api_request_id and api_request_timestamp; response_type == object"

      - name: athlete_home_market_default_applied_when_omitted
        claim_type: defaults
        grounds: ["entities.Athlete.fields.home_market"]
        distinguishing_aspect: "Omitting home_market stores the declared default 'US' rather than null."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
          trigger:
            - call: "POST /athletes"
              payload: { full_name: "Dana Osei", sport: "TRACK", market_tier: "NATIONAL", base_appearance_rate_cents: 250000, commission_pct: 0.2 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
          assert:
            - "Athlete.${ath_id}.home_market == US"
            - "Athlete.${ath_id}.market_tier == NATIONAL"

      - name: athlete_get_by_id_returns_stored_row
        claim_type: retrieval
        grounds: ["endpoints[GET /athletes/{id}]"]
        distinguishing_aspect: "GET /athletes/{id} echoes every stored field of the athlete created in setup, wrapped in the standard object envelope."
        test_recipe:
          setup: ["One athlete on the roster."]
          setup_api_calls:
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
          trigger:
            - call: "GET /athletes/${ath_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "response HTTP status == 200 and response_type == object"
            - "data.id == ${ath_id} and data.base_appearance_rate_cents == 400000"
            - "data.commission_pct == 0.15 and data.sport == BASKETBALL"

      - name: athlete_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_ATHLETE_NOT_FOUND]", "validations[priority=30]"]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /athletes/{id} answers ERR_ATHLETE_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
          trigger:
            - call: "GET /athletes/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: TalentAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response data.error_id == ERR_ATHLETE_NOT_FOUND"
            - "response_type == error"

      - name: opportunity_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=42]", "errors[ERR_INVALID_REQUEST]", "endpoints[POST /opportunities]"]
        distinguishing_aspect: "Dropping the required planned_shoots field from POST /opportunities answers ERR_INVALID_REQUEST with HTTP 400 and creates nothing."
        test_recipe:
          setup: ["One athlete and one brand exist."]
          setup_api_calls:
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "Volt Hydration", category: "BEVERAGE", legal_entity_name: "Volt Hydration Inc", compliance_rating: 45 }
              as: BrandRep
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${brand_id}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, exclusivity_category: "BEVERAGE", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"
            - "GET /opportunities?athlete_id=${ath_id} returns 0 rows"

      - name: opportunity_invalid_enum_territory_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Opportunity.fields.territory", "validations[priority=42]"]
        distinguishing_aspect: "territory 'MOON' is outside {DOMESTIC, NORTH_AMERICA, GLOBAL} and is refused with ERR_INVALID_REQUEST (400) before any FK or business check runs."
        test_recipe:
          setup: ["One athlete and one brand exist."]
          setup_api_calls:
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "Volt Hydration", category: "BEVERAGE", legal_entity_name: "Volt Hydration Inc", compliance_rating: 45 }
              as: BrandRep
              captures: { brand_id: $.data.id }
          trigger:
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${brand_id}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, planned_shoots: 0, exclusivity_category: "BEVERAGE", exclusivity_months: 12, territory: "MOON", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: opportunity_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds: ["endpoints[GET /opportunities]", "response_envelope.pagination_fields"]
        distinguishing_aspect: "With three opportunities for one athlete, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false."
        test_recipe:
          setup: ["One athlete and three brands in different categories, each with one INTAKE opportunity for that athlete."]
          setup_api_calls:
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "Volt Hydration", category: "BEVERAGE", legal_entity_name: "Volt Hydration Inc", compliance_rating: 45 }
              as: BrandRep
              captures: { b1: $.data.id }
            - call: "POST /brands"
              payload: { name: "Kite Footwear", category: "FOOTWEAR", legal_entity_name: "Kite Footwear LLC", compliance_rating: 45 }
              as: BrandRep
              captures: { b2: $.data.id }
            - call: "POST /brands"
              payload: { name: "Gridiron Gaming", category: "GAMING", legal_entity_name: "Gridiron Gaming Ltd", compliance_rating: 45 }
              as: BrandRep
              captures: { b3: $.data.id }
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${b1}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, planned_shoots: 0, exclusivity_category: "BEVERAGE", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${b1}"
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${b2}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, planned_shoots: 0, exclusivity_category: "FOOTWEAR", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${b2}"
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${b3}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, planned_shoots: 0, exclusivity_category: "GAMING", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${b3}"
          trigger:
            - call: "GET /opportunities"
              payload: { athlete_id: "${ath_id}", limit: 2, offset: 0 }
              as: TalentAgent
            - call: "GET /opportunities"
              payload: { athlete_id: "${ath_id}", limit: 2, offset: 2 }
              as: TalentAgent
          assert:
            - "first response returns 2 rows with total_count == 3 and has_more == true"
            - "second response returns 1 row with total_count == 3 and has_more == false"
            - "response_type == array on both calls"

      - name: deliverable_weight_computed_from_type
        claim_type: computed_fields
        grounds: ["entities.Deliverable.fields.weight", "calculations.payout_distribution"]
        distinguishing_aspect: "weight is derived from type at creation: SOCIAL_POST 1, APPEARANCE 4, SHOOT 2 — never supplied by the client."
        test_recipe:
          setup:
            - "Engagement ACTIVE (fee 1400000 / BROADCAST / TIER_B / NORTH_AMERICA, binding_fee_cents 2621400 because no booking was confirmed before countersign)."
            - "A capacity-2 ProductionSlot exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "Volt Hydration", category: "BEVERAGE", legal_entity_name: "Volt Hydration Inc", compliance_rating: 45 }
              as: BrandRep
              captures: { brand_id: $.data.id }
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${brand_id}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, planned_shoots: 0, exclusivity_category: "BEVERAGE", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-screen-1"
            - call: "POST /term-sheets"
              payload: { opportunity_id: "${opp_id}", fee_cents: 1400000, usage_rights_tier: "BROADCAST", usage_term_months: 12, territory: "NORTH_AMERICA", morals_clause_tier: "TIER_B", exclusivity_months: 12, appearance_days: 1 }
              as: TalentAgent
              captures: { ts_id: $.data.id }
            - call: "POST /term-sheets/${ts_id}/submit"
              payload: {}
              as: TalentAgent
            - call: "POST /term-sheets/${ts_id}/accept"
              payload: {}
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/countersign"
              payload: { signed_by_reference: "CS-C-0001" }
              as: FinanceManager
            - call: "POST /production-slots"
              payload: { name: "Studio B", capacity: 2, window_start_at: "2026-09-01T00:00:00Z", window_end_at: "2026-12-31T23:00:00Z" }
              as: TalentAgent
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /deliverables"
              payload: { engagement_id: "${eng_id}", type: "SOCIAL_POST", due_date: "2026-09-20", disclosure_required: false }
              as: TalentAgent
              captures: { d_post: $.data.id }
            - call: "POST /deliverables"
              payload: { engagement_id: "${eng_id}", type: "SHOOT", due_date: "2026-09-16", disclosure_required: false, production_slot_id: "${slot_id}", shoot_start_at: "2026-09-15T09:00:00Z", shoot_end_at: "2026-09-15T13:00:00Z" }
              as: TalentAgent
              captures: { d_shoot: $.data.id }
          assert:
            - "Deliverable.${d_post}.weight == 1"
            - "Deliverable.${d_shoot}.weight == 2"
            - "Deliverable.${d_post}.status == PENDING and line_value_cents == null"
            - "ProductionSlot.${slot_id}.reserved_count == 1"
            - "Engagement.${eng_id}.binding_fee_cents == 2621400"

      - name: ledger_entry_is_immutable_append_only
        claim_type: immutability
        grounds: ["entities.LedgerEntry", "endpoints[GET /engagements/{id}/ledger-entries]"]
        distinguishing_aspect: "LedgerEntry declares common_fields false: rows expose id and created_at but no version or updated_at, and no endpoint mutates an existing row — the reversal is a NEW row."
        test_recipe:
          setup: ["Engagement with one CONFIRMED booking (travel_cost_cents 180500) that is then cancelled."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "Volt Hydration", category: "BEVERAGE", legal_entity_name: "Volt Hydration Inc", compliance_rating: 45 }
              as: BrandRep
              captures: { brand_id: $.data.id }
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${brand_id}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, planned_shoots: 0, exclusivity_category: "BEVERAGE", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-screen-1"
            - call: "POST /term-sheets"
              payload: { opportunity_id: "${opp_id}", fee_cents: 1400000, usage_rights_tier: "BROADCAST", usage_term_months: 12, territory: "NORTH_AMERICA", morals_clause_tier: "TIER_B", exclusivity_months: 12, appearance_days: 1 }
              as: TalentAgent
              captures: { ts_id: $.data.id }
            - call: "POST /term-sheets/${ts_id}/submit"
              payload: {}
              as: TalentAgent
            - call: "POST /term-sheets/${ts_id}/accept"
              payload: {}
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { eng_id: $.data.id, eng_v1: $.data.version }
            - call: "POST /appearance-bookings"
              payload: { engagement_id: "${eng_id}", city: "Chicago", start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T22:00:00Z", travel_buffer_hours: 12, expected_engagement_version: "${eng_v1}" }
              as: TalentAgent
              captures: { bk_id: $.data.id }
            - call: "POST /appearance-bookings/${bk_id}/confirm"
              payload: { travel_cost_cents: 180500 }
              as: TalentAgent
            - call: "POST /appearance-bookings/${bk_id}/cancel"
              payload: { reason_code: "VENUE_CLOSED" }
              as: TalentAgent
          trigger:
            - call: "GET /engagements/${eng_id}/ledger-entries"
              payload: {}
              as: FinanceManager
          assert:
            - "response returns exactly 2 rows, in created_at ASC order"
            - "row 1 entry_type == TRAVEL_ACCRUAL with amount_cents == 180500 and source_entity == AppearanceBooking"
            - "row 2 entry_type == REVERSAL with amount_cents == -180500 and source_entity == AppearanceBooking"
            - "neither row exposes a version or updated_at field"

      - name: term_sheet_requires_existing_opportunity
        claim_type: parent_relationships
        grounds: ["entities.TermSheet.fields.opportunity_id", "validations[priority=44]", "errors[ERR_OPPORTUNITY_NOT_FOUND]"]
        distinguishing_aspect: "POST /term-sheets against an unknown opportunity_id answers ERR_OPPORTUNITY_NOT_FOUND (404), proving the body FK is resolved before any state check."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
          trigger:
            - call: "POST /term-sheets"
              payload: { opportunity_id: "00000000-0000-4000-8000-000000000001", fee_cents: 1400000, usage_rights_tier: "BROADCAST", usage_term_months: 12, territory: "NORTH_AMERICA", morals_clause_tier: "TIER_B", exclusivity_months: 12, appearance_days: 1 }
              as: TalentAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response data.error_id == ERR_OPPORTUNITY_NOT_FOUND"

      - name: opportunity_body_fk_checked_left_to_right_athlete_first
        claim_type: parent_relationships
        grounds: ["validations[priority=44]", "errors[ERR_ATHLETE_NOT_FOUND]", "errors[ERR_BRAND_NOT_FOUND]"]
        distinguishing_aspect: "When BOTH athlete_id and brand_id are unknown, the flat-topology left-to-right FK order yields ERR_ATHLETE_NOT_FOUND (athlete_id is listed first in the endpoint input), never ERR_BRAND_NOT_FOUND."
        test_recipe:
          setup: ["Empty database apart from the clock."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
          trigger:
            - call: "POST /opportunities"
              payload: { athlete_id: "00000000-0000-4000-8000-000000000002", brand_id: "00000000-0000-4000-8000-000000000003", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, planned_shoots: 0, exclusivity_category: "BEVERAGE", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "00000000-0000-4000-8000-000000000003"
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 404"
            - "response data.error_id == ERR_ATHLETE_NOT_FOUND"

  - section: state_machines
    instances:
      - name: cancel_booking_twice_returns_booking_invalid_state
        claim_type: invalid_transitions
        grounds: ["state_machines.AppearanceBooking.HOLD_to_CANCELLED", "validations[priority=56]", "errors[ERR_BOOKING_INVALID_STATE]"]
        distinguishing_aspect: |
          CANCELLED is terminal for AppearanceBooking: a second cancel on the same booking is rejected with ERR_BOOKING_INVALID_STATE (409) and writes no second ledger entry.
        test_recipe:
          setup:
            - "Engagement PENDING_COUNTERSIGN with one booking already CANCELLED from HOLD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TalentAgent
            - call: "POST /athletes"
              payload: { full_name: "Rae Nakamura", sport: "BASKETBALL", market_tier: "GLOBAL", base_appearance_rate_cents: 400000, commission_pct: 0.15 }
              as: TalentAgent
              captures: { ath_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "Volt Hydration", category: "BEVERAGE", legal_entity_name: "Volt Hydration Inc", compliance_rating: 45 }
              as: BrandRep
              captures: { brand_id: $.data.id }
            - call: "POST /opportunities"
              payload: { athlete_id: "${ath_id}", brand_id: "${brand_id}", requested_start_date: "2026-09-01", requested_end_date: "2027-02-28", proposed_fee_cents: 100000, planned_posts: 1, planned_appearances: 0, planned_shoots: 0, exclusivity_category: "BEVERAGE", exclusivity_months: 12, territory: "NORTH_AMERICA", usage_rights_tier: "BROADCAST" }
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { opp_id: $.data.id }
            - call: "POST /opportunities/${opp_id}/screen"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-screen-1"
            - call: "POST /term-sheets"
              payload: { opportunity_id: "${opp_id}", fee_cents: 1400000, usage_rights_tier: "BROADCAST", usage_term_months: 12, territory: "NORTH_AMERICA", morals_clause_tier: "TIER_B", exclusivity_months: 12, appearance_days: 1 }
              as: TalentAgent
              captures: { ts_id: $.data.id }
            - call: "POST /term-sheets/${ts_id}/submit"
              payload: {}
              as: TalentAgent
            - call: "POST /term-sheets/${ts_id}/accept"
              payload: {}
              as: BrandRep
              as_user_id: "${brand_id}"
              captures: { eng_id: $.data.id, eng_v1: $.data.version }
            - call: "POST /appearance-bookings"
              payload: { engagement_id: "${eng_id}", city: "Chicago", start_at: "2026-09-10T14:00:00Z", end_at: "2026-09-10T22:00:00Z", travel_buffer_hours: 12, expected_engagement_version: "${eng_v1}" }
              as: TalentAgent
              captures: { bk_id: $.data.id }
            - call: "POST /appearance-bookings/${bk_id}/cancel"
              payload: { reason_code: "VENUE_CLOSED" }
              as: TalentAgent
          trigger:
            - call: "POST /appearance-bookings/${bk_id}/cancel"
              payload: { reason_code: "VENUE_CLOSED" }
              as: TalentAgent
              captures: { err: $.data.error_id }
          assert:
            - "response HTTP status == 409"
            - "response data.error_id == ERR_BOOKING_INVALID_STATE"
            - "AppearanceBooking.${bk_id}.status == CANCELLED"
            - "GET /engagements/${eng_id}/ledger-entries returns 0 rows (a HOLD cancel never accrued anything)"
      - name: terminate_terminated_engagement_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Engagement.ACTIVE_to_TERMINATED", "validations[priority=55]", "errors[ERR_ENGAGEMENT_ALREADY_TERMINAL]"]
        distinguishing_aspect: |
