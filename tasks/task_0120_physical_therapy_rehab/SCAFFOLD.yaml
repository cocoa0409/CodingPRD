scenario: |
  Physical Therapy Rehabilitation Plan: evaluation/plan/reevaluation, unit-hour
  authorization, home exercise program, Medicare MIPS quality, discharge
  assessment, veteran referral, Capped Plan of Care.

domain_name: physical-therapy-rehab
api_prefix: /episodes

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_deferred_actions

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Patient full name
      - name: date_of_birth
        type: datetime
        source: input
        description: ISO 8601 date of birth (date portion only relevant)
      - name: insurance_type
        type: enum
        source: input
        description: Primary payer category
        constraints: "one of {MEDICARE_PART_B, VA, COMMERCIAL, SELF_PAY}"
      - name: medicare_beneficiary_id
        type: string
        source: input
        description: MBI; required when insurance_type=MEDICARE_PART_B; null otherwise
      - name: va_referral_id
        type: string
        source: input
        description: VA Community Care Network referral id; required when insurance_type=VA
      - name: ytd_capped_amount_cents
        type: integer
        source: computed
        description: Year-to-date dollars (cents) of paid PT charges applied against the Medicare therapy cap for the current calendar year
        default: 0
      - name: status
        type: enum
        source: computed
        description: Patient lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, ARCHIVED}"

  - name: Episode
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: Owning Patient.id
      - name: referring_provider_npi
        type: string
        source: input
        description: 10-digit NPI of referring provider
      - name: body_region
        type: enum
        source: input
        description: Primary anatomical region treated this episode
        constraints: "one of {LUMBAR, CERVICAL, KNEE, SHOULDER, HIP, ANKLE, OTHER}"
      - name: status
        type: enum
        source: computed
        description: Episode lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, EVALUATED, ACTIVE, REEVAL_DUE, DISCHARGE_PENDING, DISCHARGED, CANCELLED}"
      - name: cap_policy
        type: enum
        source: computed
        description: Whether this episode counts against the Medicare therapy cap. Set on Evaluation finalization from Patient.insurance_type.
        constraints: "one of {CAPPED, UNCAPPED}"
      - name: kx_modifier_required
        type: boolean
        source: computed
        description: True once Patient.ytd_capped_amount_cents has crossed the KX threshold; visit charges past the threshold require the KX modifier.
        default: false
      - name: total_authorized_units
        type: integer
        source: computed
        description: Sum of Authorization.unit_quota across all APPROVED, non-EXPIRED authorizations on this episode
        default: 0
      - name: total_committed_units
        type: integer
        source: computed
        description: Sum of Visit.units_billed across Visits in {SIGNED, BILLED} on this episode
        default: 0
      - name: total_reserved_units
        type: integer
        source: computed
        description: Sum of Visit.units_planned across Visits in {SCHEDULED, IN_SESSION} on this episode
        default: 0
      - name: discharge_outcome
        type: enum
        source: computed
        description: Outcome stamped at discharge
        default: null
        constraints: "one of {GOALS_MET, PARTIAL, PLATEAU, ADVERSE_EVENT, PATIENT_WITHDREW, null}"

  - name: Evaluation
    parent: Episode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: Parent Episode.id
      - name: evaluation_type
        type: enum
        source: input
        description: Initial evaluation vs reevaluation
        constraints: "one of {INITIAL, REEVAL}"
      - name: clinician_id
        type: string
        source: input
        description: Therapist.id who performed the evaluation
      - name: complexity
        type: enum
        source: input
        description: APTA-style evaluation complexity (drives the eval CPT)
        constraints: "one of {LOW, MODERATE, HIGH}"
      - name: functional_baseline_score
        type: integer
        source: input
        description: 0-100 functional outcome score at this evaluation (used in MIPS and discharge delta)
      - name: status
        type: enum
        source: computed
        description: Evaluation lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED, AMENDED}"
      - name: finalized_at
        type: datetime
        source: system
        description: ISO 8601 timestamp set on FINALIZE; null in DRAFT
        default: null

  - name: PlanOfCare
    parent: Episode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: Parent Episode.id
      - name: evaluation_id
        type: string
        source: input
        description: Evaluation.id that anchors this plan; MUST be FINALIZED at certification
      - name: certifying_physician_npi
        type: string
        source: input
        description: NPI of physician certifying the plan
      - name: planned_visit_count
        type: integer
        source: input
        description: Expected total visits over the certification window
      - name: planned_units_per_visit
        type: integer
        source: input
        description: Expected billable units per visit (drives the Authorization unit_quota)
      - name: cert_period_start
        type: datetime
        source: input
        description: ISO 8601 start of certification window (date)
      - name: cert_period_end
        type: datetime
        source: input
        description: ISO 8601 end of certification window; MUST be <= cert_period_start + 90 days
      - name: status
        type: enum
        source: computed
        description: Plan lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, CERTIFIED, ACTIVE, EXPIRED, REVOKED}"
      - name: capped_projection_cents
        type: integer
        source: computed
        description: Forward-looking cap impact projection in cents (see calculations.capped_poc_projection)

  - name: Authorization
    parent: Episode
    common_fields: false
    fields:
      - name: episode_id
        type: string
        source: input
        description: Owning Episode.id
      - name: plan_of_care_id
        type: string
        source: input
        description: PlanOfCare.id this authorization is bound to
      - name: source
        type: enum
        source: input
        description: Who granted the authorization. VA referrals are mandatory for insurance_type=VA.
        constraints: "one of {COMMERCIAL_PAYER, MEDICARE_AUTO, VA_REFERRAL}"
      - name: external_reference
        type: string
        source: input
        description: Payer authorization number or VA referral_id; mirrored to Patient.va_referral_id when source=VA_REFERRAL
      - name: unit_quota
        type: integer
        source: input
        description: Total 15-minute units approved by this authorization
      - name: valid_from
        type: datetime
        source: input
        description: ISO 8601 start of authorization window
      - name: valid_through
        type: datetime
        source: input
        description: ISO 8601 inclusive last date the authorization can back a SCHEDULED visit
      - name: status
        type: enum
        source: computed
        description: Authorization lifecycle
        default: APPROVED
        constraints: "one of {APPROVED, EXPIRED, REVOKED}"

  - name: Visit
    parent: Episode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: Owning Episode.id
      - name: plan_of_care_id
        type: string
        source: input
        description: PlanOfCare.id this visit is scheduled under (MUST be ACTIVE at schedule time)
      - name: authorization_id
        type: string
        source: input
        description: Authorization.id consumed by this visit (MUST be APPROVED and cover scheduled_start)
      - name: clinician_id
        type: string
        source: input
        description: Therapist.id who will or did deliver the visit
      - name: scheduled_start
        type: datetime
        source: input
        description: ISO 8601 visit start
      - name: scheduled_end
        type: datetime
        source: input
        description: ISO 8601 visit end; scheduled_end > scheduled_start
      - name: units_planned
        type: integer
        source: input
        description: Units the clinician plans to bill
      - name: timed_minutes
        type: integer
        source: input
        description: Direct one-on-one timed minutes performed (provided on SIGN). Drives 8-minute-rule unit calculation.
        default: 0
      - name: units_billed
        type: integer
        source: computed
        description: Final units billed after applying the 8-minute rule; written on SIGN
        default: 0
      - name: charge_cents
        type: integer
        source: computed
        description: Patient/payer charge in cents at SIGN time
        default: 0
      - name: kx_applied
        type: boolean
        source: computed
        description: Whether the KX modifier was stamped on this visit's claim line
        default: false
      - name: status
        type: enum
        source: computed
        description: Visit lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_SESSION, SIGNED, BILLED, CANCELLED}"

  - name: HomeExerciseProgram
    parent: Episode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: Parent Episode.id
      - name: plan_of_care_id
        type: string
        source: input
        description: Anchoring PlanOfCare.id
      - name: prescribing_clinician_id
        type: string
        source: input
        description: Therapist.id
      - name: exercise_items
        type: array
        source: input
        description: Array of {name, sets, reps, frequency_per_week}; non-empty
      - name: patient_acknowledged_at
        type: datetime
        source: system
        description: ISO 8601 timestamp the patient acknowledged the HEP via POST /home-exercise-programs/{id}/acknowledge
        default: null
      - name: status
        type: enum
        source: computed
        description: HEP lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, ACKNOWLEDGED, SUPERSEDED}"

  - name: MipsMeasure
    parent: Episode
    common_fields: false
    fields:
      - name: episode_id
        type: string
        source: input
        description: Owning Episode.id
      - name: measure_code
        type: enum
        source: input
        description: Quality measure being attested
        constraints: "one of {Q126_PAIN_ASSESSMENT, Q127_FUNCTIONAL_STATUS, Q128_FALL_RISK_SCREEN}"
      - name: visit_id
        type: string
        source: input
        description: Visit.id at which the measure applies
      - name: numerator_met
        type: boolean
        source: input
        description: True if measure action was performed
      - name: exception_reason
        type: enum
        source: input
        description: If numerator_met=false, the documented denominator exception (if any)
        constraints: "one of {NONE, MEDICAL, PATIENT, SYSTEM}"
      - name: scored_at
        type: datetime
        source: system
        description: When the row was created (immutable; entity is append-only)

  - name: DischargeAssessment
    parent: Episode
    common_fields: true
    fields:
      - name: episode_id
        type: string
        source: input
        description: Owning Episode.id; UNIQUE — one discharge per episode
      - name: discharging_clinician_id
        type: string
        source: input
        description: Therapist.id signing the discharge
      - name: discharge_outcome
        type: enum
        source: input
        description: Outcome category
        constraints: "one of {GOALS_MET, PARTIAL, PLATEAU, ADVERSE_EVENT, PATIENT_WITHDREW}"
      - name: final_functional_score
        type: integer
        source: input
        description: 0-100 functional outcome score at discharge
      - name: functional_delta
        type: integer
        source: computed
        description: final_functional_score - latest_finalized_evaluation.functional_baseline_score
      - name: mips_quality_score
        type: number
        source: computed
        description: Episode-level MIPS quality score 0-100 written at discharge (see calculations.mips_quality_score)
      - name: status
        type: enum
        source: computed
        description: Assessment lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, SIGNED}"

  - name: Therapist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Therapist full name
      - name: npi
        type: string
        source: input
        description: 10-digit National Provider Identifier; unique across Therapists
      - name: credential
        type: enum
        source: input
        description: License level
        constraints: "one of {PT, PTA, DPT}"
      - name: can_evaluate
        type: boolean
        source: computed
        description: True iff credential IN {PT, DPT}. PTAs may deliver visits but cannot finalize Evaluations.
        default: false
      - name: status
        type: enum
        source: computed
        description: Lifecycle
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: VeteranReferral
    parent: null
    common_fields: false
    fields:
      - name: patient_id
        type: string
        source: input
        description: Patient.id; Patient.insurance_type MUST be VA
      - name: referring_va_facility_code
        type: string
        source: input
        description: VA facility 3-character code
      - name: authorized_units
        type: integer
        source: input
        description: Units authorized by the VA Community Care Network referral
      - name: valid_from
        type: datetime
        source: input
        description: ISO 8601 inclusive window start
      - name: valid_through
        type: datetime
        source: input
        description: ISO 8601 inclusive window end
      - name: status
        type: enum
        source: computed
        description: Referral lifecycle (append-only beyond CONSUMED/EXPIRED)
        default: ACTIVE
        constraints: "one of {ACTIVE, CONSUMED, EXPIRED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Episode
    initial_state: DRAFT
    terminal_states: [DISCHARGED, CANCELLED]
    transitions:
      - from: DRAFT
        to: EVALUATED
        trigger: "POST /episodes/{id}/evaluations/{evaluation_id}/finalize (first INITIAL finalized)"
        actor: Therapist
        preconditions:
          - "Evaluation.evaluation_type == INITIAL"
          - "Evaluation.clinician_id refers to Therapist with can_evaluate=true"
        side_effects:
          - "Evaluation.status DRAFT -> FINALIZED; Evaluation.finalized_at set to now()"
          - "Episode.cap_policy = CAPPED if Patient.insurance_type == MEDICARE_PART_B else UNCAPPED"

      - from: EVALUATED
        to: ACTIVE
        trigger: "POST /plan-of-cares/{id}/certify"
        actor: Therapist
        preconditions:
          - "PlanOfCare.evaluation_id refers to an Evaluation in {FINALIZED, AMENDED} for the same Episode"
          - "An Authorization in APPROVED status exists on this Episode whose unit_quota >= PlanOfCare.planned_visit_count * PlanOfCare.planned_units_per_visit"
        side_effects:
          - "PlanOfCare.status DRAFT -> CERTIFIED -> ACTIVE (same request)"
          - "calculations.capped_poc_projection runs; PlanOfCare.capped_projection_cents written"
          - "If Episode.cap_policy == CAPPED and capped_projection_cents would push Patient.ytd_capped_amount_cents past KX_THRESHOLD_CENTS, Episode.kx_modifier_required = true"

      - from: ACTIVE
        to: REEVAL_DUE
        trigger: "POST /_clock/advance crossing the 30th day since the latest Evaluation.finalized_at"
        actor: system
        preconditions:
          - "Episode.status == ACTIVE"
          - "now() - latest Evaluation(status IN {FINALIZED, AMENDED}).finalized_at >= 30 days"
        side_effects:
          - "Episode.status -> REEVAL_DUE; further Visit.SCHEDULED transitions blocked with ERR_REEVAL_DUE"

      - from: REEVAL_DUE
        to: ACTIVE
        trigger: "POST /episodes/{id}/evaluations/{evaluation_id}/finalize (REEVAL finalized)"
        actor: Therapist
        preconditions:
          - "Evaluation.evaluation_type == REEVAL"
          - "Evaluation.clinician_id Therapist.can_evaluate=true"
        side_effects:
          - "Evaluation.status DRAFT -> FINALIZED; finalized_at set"
          - "Episode.status -> ACTIVE"

      - from: ACTIVE
        to: DISCHARGE_PENDING
        trigger: "POST /episodes/{id}/discharge-assessments (DRAFT creation)"
        actor: Therapist
        preconditions:
          - "Episode.status == ACTIVE"
          - "No Visit in {SCHEDULED, IN_SESSION} on this episode"
        side_effects:
          - "DischargeAssessment created in DRAFT"

      - from: REEVAL_DUE
        to: DISCHARGE_PENDING
        trigger: "POST /episodes/{id}/discharge-assessments"
        actor: Therapist
        preconditions:
          - "No Visit in {SCHEDULED, IN_SESSION} on this episode"
        side_effects:
          - "DischargeAssessment created in DRAFT"

      - from: DISCHARGE_PENDING
        to: DISCHARGED
        trigger: "POST /discharge-assessments/{id}/sign"
        actor: Therapist
        preconditions:
          - "DischargeAssessment.discharging_clinician_id Therapist.can_evaluate=true"
          - "DischargeAssessment.discharging_clinician_id != latest Evaluation.clinician_id (segregation of duties: signer differs from evaluator)"
        side_effects:
          - "DischargeAssessment.status -> SIGNED"
          - "DischargeAssessment.functional_delta computed"
          - "calculations.mips_quality_score runs; DischargeAssessment.mips_quality_score written"
          - "Episode.discharge_outcome = DischargeAssessment.discharge_outcome"
          - "Episode.status -> DISCHARGED"
          - "All APPROVED Authorization rows on this episode -> EXPIRED"
          - "HomeExerciseProgram in {ISSUED, ACKNOWLEDGED} -> SUPERSEDED"

      - from: DRAFT
        to: CANCELLED
        trigger: "DELETE /episodes/{id}"
        actor: Therapist
        preconditions:
          - "Episode.status == DRAFT (no FINALIZED Evaluation yet)"
        side_effects:
          - "Episode.status -> CANCELLED (terminal)"

  - entity: Evaluation
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /evaluations/{id}/finalize"
        actor: Therapist
        preconditions:
          - "Acting Therapist.can_evaluate == true"
          - "Evaluation.functional_baseline_score within [0,100]"
        side_effects:
          - "finalized_at set"
          - "If evaluation_type == INITIAL and Episode.status == DRAFT, cascade to Episode.DRAFT->EVALUATED"
          - "If evaluation_type == REEVAL and Episode.status == REEVAL_DUE, cascade to Episode.REEVAL_DUE->ACTIVE"
      - from: FINALIZED
        to: AMENDED
        trigger: "POST /evaluations/{id}/amend"
        actor: Therapist
        preconditions:
          - "Same clinician_id as the FINALIZED evaluation"
          - "Episode.status NOT IN {DISCHARGED, CANCELLED}"
        side_effects:
          - "functional_baseline_score may be revised"
          - "If a PlanOfCare in {DRAFT, CERTIFIED, ACTIVE} references this Evaluation, calculations.capped_poc_projection re-runs on that PlanOfCare; PlanOfCare.capped_projection_cents updated; Episode.kx_modifier_required re-derived"

  - entity: PlanOfCare
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /plan-of-cares/{id}/certify"
        actor: Therapist
        preconditions:
          - "Linked Evaluation in {FINALIZED, AMENDED}"
          - "cert_period_end - cert_period_start <= 90 days"
        side_effects:
          - "calculations.capped_poc_projection runs"
      - from: CERTIFIED
        to: ACTIVE
        trigger: "system (same request as certify)"
        actor: system
        preconditions:
          - "At least one APPROVED Authorization on Episode whose [valid_from, valid_through] covers cert_period_start"
        side_effects:
          - "Episode.EVALUATED->ACTIVE cascade if first plan certified"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /_clock/advance crossing cert_period_end"
        actor: system
        preconditions:
          - "now() > cert_period_end"
        side_effects:
          - "Visits in SCHEDULED for this plan -> CANCELLED with reason POC_EXPIRED"
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /plan-of-cares/{id}/revoke"
        actor: Therapist
        preconditions:
          - "Therapist.can_evaluate == true"
        side_effects:
          - "Visits in SCHEDULED on this plan -> CANCELLED with reason POC_REVOKED"

  - entity: Visit
    initial_state: SCHEDULED
    terminal_states: [BILLED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_SESSION
        trigger: "POST /visits/{id}/start"
        actor: Therapist
        preconditions:
          - "Episode.status == ACTIVE (NOT REEVAL_DUE)"
          - "PlanOfCare.status == ACTIVE"
          - "Authorization.status == APPROVED and valid_through >= scheduled_start (date portion)"
          - "Episode.total_reserved_units + Episode.total_committed_units <= Episode.total_authorized_units"
        side_effects:
          - "No quota change (units already reserved at SCHEDULED creation)"
      - from: IN_SESSION
        to: SIGNED
        trigger: "POST /visits/{id}/sign"
        actor: Therapist
        preconditions:
          - "timed_minutes provided, timed_minutes >= 8"
        side_effects:
          - "calculations.billed_units_eight_minute_rule -> Visit.units_billed"
          - "calculations.visit_charge_cents -> Visit.charge_cents"
          - "Episode.total_reserved_units decreases by units_planned; Episode.total_committed_units increases by units_billed"
          - "If Episode.cap_policy == CAPPED: Patient.ytd_capped_amount_cents += charge_cents; if newly crossed KX_THRESHOLD_CENTS, Episode.kx_modifier_required = true and Visit.kx_applied = true"
          - "If Patient.ytd_capped_amount_cents would exceed CAP_HARD_CENTS, visit signs but only the under-cap portion gets kx_applied; over-cap portion records ERR signal via post-sweep"
      - from: SIGNED
        to: BILLED
        trigger: "POST /visits/{id}/submit-claim"
        actor: Biller
        preconditions:
          - "Visit.status == SIGNED"
          - "If Episode.cap_policy == CAPPED and Patient.ytd_capped_amount_cents > KX_THRESHOLD_CENTS at sign time, Visit.kx_applied MUST be true"
        side_effects:
          - "No further unit change"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: Therapist
        preconditions:
          - "Visit.status == SCHEDULED"
        side_effects:
          - "Episode.total_reserved_units decreases by units_planned (release reservation)"
      - from: IN_SESSION
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: Therapist
        preconditions:
          - "Visit.status == IN_SESSION"
        side_effects:
          - "Episode.total_reserved_units decreases by units_planned"

  - entity: HomeExerciseProgram
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /home-exercise-programs/{id}/issue"
        actor: Therapist
        preconditions:
          - "exercise_items non-empty"
          - "PlanOfCare in {ACTIVE}"
        side_effects: []
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /home-exercise-programs/{id}/acknowledge"
        actor: Patient
        preconditions:
          - "HEP.status == ISSUED"
        side_effects:
          - "patient_acknowledged_at set to now()"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "Issuing a new HEP on the same episode (POST /episodes/{id}/home-exercise-programs followed by issue) OR Episode discharge"
        actor: system
        preconditions:
          - "A newer HomeExerciseProgram entered ISSUED on the same Episode, OR Episode -> DISCHARGED"
        side_effects: []
      - from: ACKNOWLEDGED
        to: SUPERSEDED
        trigger: "Same as ISSUED -> SUPERSEDED"
        actor: system
        preconditions:
          - "Same"
        side_effects: []

  - entity: DischargeAssessment
    initial_state: DRAFT
    terminal_states: [SIGNED]
    transitions:
      - from: DRAFT
        to: SIGNED
        trigger: "POST /discharge-assessments/{id}/sign"
        actor: Therapist
        preconditions:
          - "discharging_clinician_id != latest Evaluation.clinician_id"
          - "Therapist.can_evaluate == true"
        side_effects:
          - "calculations.mips_quality_score -> mips_quality_score"
          - "functional_delta computed"
          - "Cascade Episode DISCHARGE_PENDING -> DISCHARGED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two clinicians simultaneously start the same SCHEDULED visit"
    guarantee: "At most one starts; second rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Visit.status transition SCHEDULED -> IN_SESSION"

  - scenario: "Two visits sign concurrently and the second would push Patient.ytd_capped_amount_cents past CAP_HARD_CENTS"
    guarantee: "Both visits SIGN, but the cap-tripping visit MUST have kx_applied=true; race resolved by first-writer-wins on Patient row; loser re-evaluates Episode.kx_modifier_required before completing its sign"
    error_id: ERR_CAP_EXCEEDED
    http_status: 409
    serialization: "Row-level serialization on Patient.ytd_capped_amount_cents; if the second writer's pre-image is stale, it is rejected with ERR_CAP_EXCEEDED"

  - scenario: "Discharge sign races a fresh visit start on the same Episode"
    guarantee: "Exactly one wins. If discharge wins, the start sees Episode != ACTIVE and is rejected."
    error_id: ERR_EPISODE_NOT_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on Episode.status"

  - scenario: "Two issue calls race on the same HEP draft"
    guarantee: "First wins, second rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on HomeExerciseProgram.status"

  - scenario: "Two finalize calls race on the same DRAFT Evaluation"
    guarantee: "First wins, second rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Evaluation.status"

  - scenario: "Two referrals concurrently consume the same VeteranReferral"
    guarantee: "Total units across all linked APPROVED Authorizations cannot exceed VeteranReferral.authorized_units"
    error_id: ERR_VA_REFERRAL_EXHAUSTED
    http_status: 409
    serialization: "Row-level serialization on VeteranReferral.authorized_units consumption"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: billed_units_eight_minute_rule
    trigger: "Visit IN_SESSION -> SIGNED"
    algorithm: threshold
    formula: |
      # 8-Minute Rule (CMS):
      #   minutes < 8          -> 0 units
      #   8 <= minutes <= 22   -> 1 unit
      #   23 <= minutes <= 37  -> 2 units
      #   38 <= minutes <= 52  -> 3 units
      #   53 <= minutes <= 67  -> 4 units
      #   68 <= minutes <= 82  -> 5 units
      #   83 <= minutes <= 97  -> 6 units
      #   ... (each additional 15-minute band adds one unit)
      # Implementation: if minutes < 8 -> 0
      #                 else units = ((minutes - 8) // 15) + 1
      units_billed = 0 if timed_minutes < 8 else ((timed_minutes - 8) // 15) + 1
    input_set: "Single Visit row; timed_minutes provided by the signing clinician"
    constants:
      MIN_TIMED_MIN: 8
      BAND_WIDTH_MIN: 15
    precision: "integer (units are integral)"
    variants: []

  - name: visit_charge_cents
    trigger: "Visit IN_SESSION -> SIGNED, after billed_units_eight_minute_rule"
    algorithm: tiered_pricing
    formula: |
      # Per-unit rate tiers (cents per unit):
      #   credential PT/DPT -> 4200 cents/unit
      #   credential PTA    -> 3500 cents/unit
      # Visit charge:
      #   base = units_billed * rate_for_clinician_credential
      # Add evaluation surcharge IF this is the visit that contains the FINALIZED evaluation
      # (i.e., the linked Evaluation.finalized_at falls within [scheduled_start, scheduled_end]).
      #   complexity LOW      -> +5000 cents
      #   complexity MODERATE -> +7500 cents
      #   complexity HIGH     -> +10500 cents
      # Apply round_half_up to the integer cents total (already integral, no fractional cents).
      raw = units_billed * RATE_BY_CREDENTIAL[clinician.credential]
      if has_eval_in_window:
          raw += EVAL_SURCHARGE_BY_COMPLEXITY[eval.complexity]
      charge_cents = raw  # already integer cents
    input_set: "Visit + Therapist row of clinician_id; any FINALIZED Evaluation whose finalized_at falls inside the visit window"
    constants:
      RATE_PT_DPT_CENTS: 4200
      RATE_PTA_CENTS: 3500
      EVAL_LOW_CENTS: 5000
      EVAL_MODERATE_CENTS: 7500
      EVAL_HIGH_CENTS: 10500
    precision: "integer cents; no rounding"
    variants: []

  - name: capped_poc_projection
    trigger: "PlanOfCare DRAFT->CERTIFIED, and on Evaluation AMENDED if a non-terminal POC references it"
    algorithm: forward_looking
    formula: |
      # Forward-looking projected cap impact for this Plan of Care.
      # Uses the PLAN itself, not delivered visits:
      planned_units_total = planned_visit_count * planned_units_per_visit
      rate = RATE_PT_DPT_CENTS  # plan assumes PT/DPT delivery
      projection = planned_units_total * rate
      # Add a single evaluation surcharge for the anchoring Evaluation.complexity
      projection += EVAL_SURCHARGE_BY_COMPLEXITY[eval.complexity]
      capped_projection_cents = projection
    input_set: "PlanOfCare + anchoring Evaluation; does NOT consult delivered Visits"
    constants:
      RATE_PT_DPT_CENTS: 4200
      EVAL_LOW_CENTS: 5000
      EVAL_MODERATE_CENTS: 7500
      EVAL_HIGH_CENTS: 10500
    precision: "integer cents"
    variants:
      - name: chronological_capped_actual
        when: "Computed for compliance reporting at Episode discharge"
        difference: |
          The actual variant sums SIGNED/BILLED Visit.charge_cents in order of Visit.signed_at
          (chronological) over the cert window. Because real units_billed reflects the 8-minute
          rule applied to actual timed_minutes and the actual clinician credential (which may be
          PTA at 3500 cents/unit), the chronological actual diverges from the forward projection
          even if the planned visit count was met exactly. Pinned order: ascending signed_at;
          ties broken by Visit.id ascending.

  - name: mips_quality_score
    trigger: "DischargeAssessment DRAFT -> SIGNED"
    algorithm: weighted_scoring
    formula: |
      # Episode-level quality score across the three measures Q126/Q127/Q128.
      # For each measure code, find rows on this Episode:
      #   applicable_rows = MipsMeasure rows where exception_reason == NONE
      #   met_rows = applicable_rows where numerator_met == true
      # Per-measure rate:
      #   if applicable_rows is empty -> per-measure rate = null (excluded)
      #   else                       -> per-measure rate = met_rows / applicable_rows
      # Episode score:
      #   denom = count of measure codes with non-null per-measure rate
      #   if denom == 0 -> mips_quality_score = 0.00
      #   else          -> sum_of_per_measure_rates / denom * 100, rounded to 2 decimal places, round_half_up
      # Rounding order: round AFTER aggregation. Do NOT round per-measure rates first.
      pass
    input_set: "All MipsMeasure rows whose episode_id == this Episode.id"
    constants:
      MEASURE_CODES: [Q126_PAIN_ASSESSMENT, Q127_FUNCTIONAL_STATUS, Q128_FALL_RISK_SCREEN]
    precision: "2 decimal places, round_half_up; rounding applied once at the end"
    variants:
      - name: per_measure_round_then_aggregate
        when: "Alternate (REJECTED) interpretation that would round per-measure first then average"
        difference: |
          Per-measure-round-then-aggregate yields a different value when at least one measure
          rate has a third-decimal that rounds up while another rounds down. The scaffold pins
          aggregate-then-round; any implementation rounding per-measure first is incorrect.

  - name: episode_unit_balance
    trigger: "After every Visit lifecycle transition; on Authorization create/revoke"
    algorithm: aggregation
    formula: |
      Episode.total_authorized_units = SUM(Authorization.unit_quota
          WHERE Authorization.episode_id == Episode.id AND Authorization.status == APPROVED)
      Episode.total_reserved_units   = SUM(Visit.units_planned
          WHERE Visit.episode_id == Episode.id AND Visit.status IN {SCHEDULED, IN_SESSION})
      Episode.total_committed_units  = SUM(Visit.units_billed
          WHERE Visit.episode_id == Episode.id AND Visit.status IN {SIGNED, BILLED})
      # Invariant on the quota pool:
      #   total_reserved_units + total_committed_units <= total_authorized_units
      # Sweep ordering: Visit transitions process Visit row first, then recompute Episode rollups,
      # so the new Visit row contributes to the rollup it triggered.
    input_set: "Authorization rows in APPROVED on this Episode; Visit rows on this Episode partitioned by status"
    constants: {}
    precision: "integer units"
    variants: []

  - name: poc_cap_remaining_cents
    trigger: "GET /patients/{id}/cap-status; after Visit SIGN if cap_policy=CAPPED"
    algorithm: threshold
    formula: |
      remaining_to_threshold = max(0, KX_THRESHOLD_CENTS - Patient.ytd_capped_amount_cents)
      remaining_to_hard_cap  = max(0, CAP_HARD_CENTS  - Patient.ytd_capped_amount_cents)
      # KX modifier flips on STRICTLY GREATER than threshold (> not >=):
      kx_required = Patient.ytd_capped_amount_cents > KX_THRESHOLD_CENTS
    input_set: "Patient.ytd_capped_amount_cents only"
    constants:
      KX_THRESHOLD_CENTS: 241000   # $2,410.00 — 2026 Medicare PT/SLP cap threshold
      CAP_HARD_CENTS: 300000       # $3,000.00 — targeted medical review threshold
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: "all except GET /_health"

  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the URL path resolves left-to-right (Patient, Episode, then nested resource)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-id endpoints"

  - priority: 4
    category: existence
    check: "Every id referenced in the request body resolves (evaluation_id, plan_of_care_id, authorization_id, clinician_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /plan-of-cares, POST /visits, POST /authorizations, POST /home-exercise-programs"

  - priority: 5
    category: state
    check: "Target resource in correct status for this operation (e.g., Visit.status==SCHEDULED for /start)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "Parent Episode.status == ACTIVE for new visit scheduling, signing, HEP issue"
    error_id: ERR_EPISODE_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /visits, /visits/{id}/start, /visits/{id}/sign, /episodes/{id}/home-exercise-programs"

  - priority: 7
    category: state
    check: "If Episode.status == REEVAL_DUE, no new Visit may be SCHEDULED until a REEVAL evaluation is finalized"
    error_id: ERR_REEVAL_DUE
    http_status: 409
    applies_to: "POST /visits"

  - priority: 8
    category: business_safety
    check: "Acting Therapist.can_evaluate == true for /finalize on an Evaluation"
    error_id: ERR_THERAPIST_NOT_LICENSED_TO_EVALUATE
    http_status: 403
    applies_to: "POST /evaluations/{id}/finalize, POST /evaluations/{id}/amend"

  - priority: 9
    category: business_safety
    check: "DischargeAssessment.discharging_clinician_id != latest Evaluation.clinician_id (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /discharge-assessments/{id}/sign"

  - priority: 10
    category: business_referential
    check: "If Patient.insurance_type == VA, an Authorization with source=VA_REFERRAL referencing an ACTIVE VeteranReferral MUST exist on the Episode before the first /visits create"
    error_id: ERR_VETERAN_REFERRAL_REQUIRED
    http_status: 422
    applies_to: "POST /visits"

  - priority: 11
    category: business_referential
    check: "Authorization.external_reference, when source=VA_REFERRAL, MUST equal VeteranReferral.id and Patient.va_referral_id"
    error_id: ERR_VA_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /authorizations"

  - priority: 12
    category: business_temporal
    check: "PlanOfCare.cert_period_end - cert_period_start <= 90 days; cert_period_end > cert_period_start"
    error_id: ERR_CERT_PERIOD_TOO_LONG
    http_status: 422
    applies_to: "POST /plan-of-cares, /plan-of-cares/{id}/certify"

  - priority: 13
    category: business_temporal
    check: "Visit.scheduled_start within Authorization [valid_from, valid_through] and within PlanOfCare [cert_period_start, cert_period_end]; both bounds inclusive"
    error_id: ERR_OUT_OF_AUTH_WINDOW
    http_status: 422
    applies_to: "POST /visits"

  - priority: 14
    category: business_temporal
    check: "Visit must not overlap any other Visit in {SCHEDULED, IN_SESSION, SIGNED} for the same clinician_id. Adjacency rule: [scheduled_start, scheduled_end) treated as half-open — back-to-back visits sharing the same instant DO NOT overlap."
    error_id: ERR_CLINICIAN_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /visits"

  - priority: 15
    category: business_temporal
    check: "Visit must not overlap any other Visit in {SCHEDULED, IN_SESSION, SIGNED} for the same patient (via Episode). Adjacency rule: closed intervals [scheduled_start, scheduled_end] — back-to-back visits sharing the same instant DO overlap (patient cannot be in two places)."
    error_id: ERR_PATIENT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /visits"

  - priority: 16
    category: business_constraint
    check: "Total visits scheduled across SCHEDULED+IN_SESSION+SIGNED+BILLED Visits on a PlanOfCare must not exceed PlanOfCare.planned_visit_count"
    error_id: ERR_POC_VISIT_LIMIT
    http_status: 422
    applies_to: "POST /visits"

  - priority: 17
    category: business_fiscal
    check: "Episode.total_reserved_units + Episode.total_committed_units + new_visit.units_planned <= Episode.total_authorized_units"
    error_id: ERR_INSUFFICIENT_UNITS
    http_status: 422
    applies_to: "POST /visits, /visits/{id}/start"

  - priority: 18
    category: business_fiscal
    check: "On Visit /sign with cap_policy=CAPPED: if Patient.ytd_capped_amount_cents + new_visit.charge_cents would exceed CAP_HARD_CENTS, reject. (KX threshold crossing is allowed and merely sets kx_applied=true.)"
    error_id: ERR_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /visits/{id}/sign"

  - priority: 19
    category: business_constraint
    check: "MipsMeasure.exception_reason != NONE requires numerator_met == false"
    error_id: ERR_INVALID_MIPS_EXCEPTION
    http_status: 422
    applies_to: "POST /episodes/{id}/mips-measures"

  - priority: 20
    category: business_constraint
    check: "Pagination params within bounds: 1 <= limit <= 100, offset >= 0"
    error_id: ERR_PAGINATION_RANGE
    http_status: 400
    applies_to: "all GET list endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Therapists ----
  - method: POST
    path: "/therapists"
    description: "Register a therapist"
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, npi, credential]
    output: Therapist
    side_effects: ["Therapist.can_evaluate derived from credential"]

  - method: GET
    path: "/therapists/{therapist_id}"
    description: "Fetch a therapist"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: []
    output: Therapist
    side_effects: []

  - method: GET
    path: "/therapists"
    description: "List therapists"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: ["limit?", "offset?", "credential?"]
    output: "Therapist[]"
    side_effects: []

  # ---- Patients ----
  - method: POST
    path: "/patients"
    description: "Register a patient"
    roles: [ClinicAdmin]
    code: 201
    input: [full_name, date_of_birth, insurance_type, "medicare_beneficiary_id?", "va_referral_id?"]
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}"
    description: "Fetch a patient"
    roles: [ClinicAdmin, Therapist, Biller, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: "/patients/{patient_id}/cap-status"
    description: "Return computed Medicare cap status: ytd_capped_amount_cents, remaining_to_threshold, remaining_to_hard_cap, kx_required"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: []
    output: "object {ytd_capped_amount_cents, remaining_to_threshold_cents, remaining_to_hard_cap_cents, kx_required}"
    side_effects: ["runs calculations.poc_cap_remaining_cents"]

  # ---- Veteran Referrals ----
  - method: POST
    path: "/veteran-referrals"
    description: "Register a VA Community Care referral"
    roles: [ClinicAdmin]
    code: 201
    input: [patient_id, referring_va_facility_code, authorized_units, valid_from, valid_through]
    output: VeteranReferral
    side_effects: []

  - method: GET
    path: "/veteran-referrals/{referral_id}"
    description: "Fetch a VA referral"
    roles: [ClinicAdmin, Therapist]
    code: 200
    input: []
    output: VeteranReferral
    side_effects: []

  # ---- Episodes ----
  - method: POST
    path: "/episodes"
    description: "Open an episode in DRAFT"
    roles: [Therapist]
    code: 201
    input: [patient_id, referring_provider_npi, body_region]
    output: Episode
    side_effects: []

  - method: GET
    path: "/episodes/{episode_id}"
    description: "Fetch episode (includes rolled-up unit counters)"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: []
    output: Episode
    side_effects: ["recomputes episode_unit_balance rollups before responding"]

  - method: GET
    path: "/episodes"
    description: "List episodes"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: ["limit?", "offset?", "patient_id?", "status?"]
    output: "Episode[]"
    side_effects: []

  - method: DELETE
    path: "/episodes/{episode_id}"
    description: "Cancel a DRAFT episode"
    roles: [Therapist]
    code: 204
    input: []
    output: null
    side_effects: ["Episode.DRAFT->CANCELLED"]

  # ---- Evaluations ----
  - method: POST
    path: "/episodes/{episode_id}/evaluations"
    description: "Create an evaluation in DRAFT"
    roles: [Therapist]
    code: 201
    input: [evaluation_type, clinician_id, complexity, functional_baseline_score]
    output: Evaluation
    side_effects: []

  - method: POST
    path: "/evaluations/{evaluation_id}/finalize"
    description: "Finalize an evaluation"
    roles: [Therapist]
    code: 200
    input: ["version?"]
    output: Evaluation
    side_effects: ["Evaluation.DRAFT->FINALIZED", "may cascade Episode.DRAFT->EVALUATED or Episode.REEVAL_DUE->ACTIVE", "sets Episode.cap_policy on first INITIAL finalize"]

  - method: POST
    path: "/evaluations/{evaluation_id}/amend"
    description: "Amend a FINALIZED evaluation"
    roles: [Therapist]
    code: 200
    input: ["functional_baseline_score?", "complexity?", "version?"]
    output: Evaluation
    side_effects: ["Evaluation.FINALIZED->AMENDED", "may re-run capped_poc_projection on non-terminal PlanOfCare"]

  # ---- Plan of Care ----
  - method: POST
    path: "/episodes/{episode_id}/plan-of-cares"
    description: "Create a plan of care in DRAFT"
    roles: [Therapist]
    code: 201
    input: [evaluation_id, certifying_physician_npi, planned_visit_count, planned_units_per_visit, cert_period_start, cert_period_end]
    output: PlanOfCare
    side_effects: []

  - method: POST
    path: "/plan-of-cares/{poc_id}/certify"
    description: "Certify and activate a plan of care"
    roles: [Therapist]
    code: 200
    input: ["version?"]
    output: PlanOfCare
    side_effects: ["PlanOfCare.DRAFT->CERTIFIED->ACTIVE", "runs capped_poc_projection", "may cascade Episode.EVALUATED->ACTIVE", "may set Episode.kx_modifier_required"]

  - method: POST
    path: "/plan-of-cares/{poc_id}/revoke"
    description: "Revoke an active plan of care"
    roles: [Therapist]
    code: 200
    input: ["version?"]
    output: PlanOfCare
    side_effects: ["PlanOfCare.ACTIVE->REVOKED", "SCHEDULED Visits on this plan -> CANCELLED"]

  - method: GET
    path: "/plan-of-cares/{poc_id}"
    description: "Fetch a plan of care"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: []
    output: PlanOfCare
    side_effects: []

  # ---- Authorizations ----
  - method: POST
    path: "/episodes/{episode_id}/authorizations"
    description: "Create an authorization on an episode"
    roles: [ClinicAdmin, Therapist]
    code: 201
    input: [plan_of_care_id, source, external_reference, unit_quota, valid_from, valid_through]
    output: Authorization
    side_effects: ["recomputes Episode.total_authorized_units"]

  - method: GET
    path: "/authorizations/{authorization_id}"
    description: "Fetch an authorization"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: []
    output: Authorization
    side_effects: []

  # ---- Visits ----
  - method: POST
    path: "/episodes/{episode_id}/visits"
    description: "Schedule a visit"
    roles: [Therapist]
    code: 201
    input: [plan_of_care_id, authorization_id, clinician_id, scheduled_start, scheduled_end, units_planned]
    output: Visit
    side_effects: ["recomputes Episode.total_reserved_units"]

  - method: POST
    path: "/visits/{visit_id}/start"
    description: "Mark a visit IN_SESSION"
    roles: [Therapist]
    code: 200
    input: ["version?"]
    output: Visit
    side_effects: ["Visit.SCHEDULED->IN_SESSION"]

  - method: POST
    path: "/visits/{visit_id}/sign"
    description: "Sign a visit; computes units_billed and charge_cents"
    roles: [Therapist]
    code: 200
    input: [timed_minutes, "version?"]
    output: Visit
    side_effects: ["calculations.billed_units_eight_minute_rule", "calculations.visit_charge_cents", "Visit.IN_SESSION->SIGNED", "Patient.ytd_capped_amount_cents += charge_cents if cap_policy=CAPPED", "may set Episode.kx_modifier_required", "recomputes episode_unit_balance"]

  - method: POST
    path: "/visits/{visit_id}/submit-claim"
    description: "Submit a signed visit to the payer"
    roles: [Biller]
    code: 200
    input: ["version?"]
    output: Visit
    side_effects: ["Visit.SIGNED->BILLED"]

  - method: POST
    path: "/visits/{visit_id}/cancel"
    description: "Cancel a scheduled or in-session visit"
    roles: [Therapist]
    code: 200
    input: ["version?"]
    output: Visit
    side_effects: ["Visit.{SCHEDULED,IN_SESSION}->CANCELLED", "releases reserved units"]

  - method: GET
    path: "/visits/{visit_id}"
    description: "Fetch a visit"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: []
    output: Visit
    side_effects: []

  - method: GET
    path: "/episodes/{episode_id}/visits"
    description: "List visits on episode"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Visit[]"
    side_effects: []

  # ---- Home Exercise Program ----
  - method: POST
    path: "/episodes/{episode_id}/home-exercise-programs"
    description: "Draft a HEP"
    roles: [Therapist]
    code: 201
    input: [plan_of_care_id, prescribing_clinician_id, exercise_items]
    output: HomeExerciseProgram
    side_effects: []

  - method: POST
    path: "/home-exercise-programs/{hep_id}/issue"
    description: "Issue the HEP to the patient"
    roles: [Therapist]
    code: 200
    input: ["version?"]
    output: HomeExerciseProgram
    side_effects: ["HEP.DRAFT->ISSUED", "any prior ISSUED/ACKNOWLEDGED HEP on the same Episode -> SUPERSEDED"]

  - method: POST
    path: "/home-exercise-programs/{hep_id}/acknowledge"
    description: "Patient acknowledges the HEP"
    roles: [Patient]
    code: 200
    input: []
    output: HomeExerciseProgram
    side_effects: ["HEP.ISSUED->ACKNOWLEDGED", "patient_acknowledged_at set"]

  # ---- MIPS ----
  - method: POST
    path: "/episodes/{episode_id}/mips-measures"
    description: "Attest a quality measure for a visit on this episode (append-only)"
    roles: [Therapist]
    code: 201
    input: [measure_code, visit_id, numerator_met, exception_reason]
    output: MipsMeasure
    side_effects: []

  - method: GET
    path: "/episodes/{episode_id}/mips-measures"
    description: "List MIPS rows on an episode"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: ["limit?", "offset?"]
    output: "MipsMeasure[]"
    side_effects: []

  # ---- Discharge ----
  - method: POST
    path: "/episodes/{episode_id}/discharge-assessments"
    description: "Open a discharge assessment in DRAFT"
    roles: [Therapist]
    code: 201
    input: [discharging_clinician_id, discharge_outcome, final_functional_score]
    output: DischargeAssessment
    side_effects: ["Episode.ACTIVE|REEVAL_DUE -> DISCHARGE_PENDING"]

  - method: POST
    path: "/discharge-assessments/{discharge_id}/sign"
    description: "Sign discharge; runs MIPS scoring; finalizes Episode"
    roles: [Therapist]
    code: 200
    input: ["version?"]
    output: DischargeAssessment
    side_effects: ["DischargeAssessment.DRAFT->SIGNED", "calculations.mips_quality_score", "Episode.DISCHARGE_PENDING->DISCHARGED", "APPROVED Authorizations -> EXPIRED", "active HEPs -> SUPERSEDED"]

  # ---- Test driver endpoints ----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the system clock to a given ISO 8601 instant. Triggers all time-gated sweeps (POC expiry, reeval-due transition, authorization expiry, VeteranReferral expiry)."
    roles: [ClinicAdmin]
    code: 200
    input: [to]
    output: "object {now}"
    side_effects: ["Episode.ACTIVE->REEVAL_DUE on 30-day gap", "PlanOfCare.ACTIVE->EXPIRED on cert_period_end pass", "Authorization.APPROVED->EXPIRED on valid_through pass", "VeteranReferral.ACTIVE->EXPIRED on valid_through pass"]

  - method: GET
    path: "/_clock"
    description: "Test-only: return the current simulated clock instant"
    roles: [ClinicAdmin, Therapist, Biller]
    code: 200
    input: []
    output: "object {now}"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-Role or X-User-ID header missing/empty"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not authorized for this endpoint"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource id in URL path does not resolve"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body references a resource id that does not resolve"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Operation invoked on a resource not in the required status"
  - id: ERR_EPISODE_NOT_ACTIVE
    http: 409
    condition: "Operation requires Episode.status==ACTIVE; current status is something else"
  - id: ERR_REEVAL_DUE
    http: 409
    condition: "Visit scheduling blocked because Episode.status==REEVAL_DUE"
  - id: ERR_THERAPIST_NOT_LICENSED_TO_EVALUATE
    http: 403
    condition: "Acting Therapist.can_evaluate == false (credential is PTA)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "Discharge signer equals the most recent Evaluation.clinician_id"
  - id: ERR_VETERAN_REFERRAL_REQUIRED
    http: 422
    condition: "Patient.insurance_type==VA but no APPROVED VA_REFERRAL authorization on Episode"
  - id: ERR_VA_REFERENCE_MISMATCH
    http: 422
    condition: "Authorization.external_reference does not match VeteranReferral.id / Patient.va_referral_id"
  - id: ERR_VA_REFERRAL_EXHAUSTED
    http: 409
    condition: "Sum of unit_quota across linked authorizations would exceed VeteranReferral.authorized_units"
  - id: ERR_CERT_PERIOD_TOO_LONG
    http: 422
    condition: "PlanOfCare cert window > 90 days or end <= start"
  - id: ERR_OUT_OF_AUTH_WINDOW
    http: 422
    condition: "Visit.scheduled_start outside Authorization or PlanOfCare validity window"
  - id: ERR_CLINICIAN_DOUBLE_BOOKED
    http: 409
    condition: "Visit overlaps another visit for same clinician under half-open interval semantics"
  - id: ERR_PATIENT_DOUBLE_BOOKED
    http: 409
    condition: "Visit overlaps another visit for same patient under closed-interval semantics"
  - id: ERR_POC_VISIT_LIMIT
    http: 422
    condition: "Visits on a plan would exceed PlanOfCare.planned_visit_count"
  - id: ERR_INSUFFICIENT_UNITS
    http: 422
    condition: "Reserved+committed+new units would exceed Episode.total_authorized_units"
  - id: ERR_CAP_EXCEEDED
    http: 422
    condition: "Sign would push Patient.ytd_capped_amount_cents past CAP_HARD_CENTS"
  - id: ERR_INVALID_MIPS_EXCEPTION
    http: 422
    condition: "MipsMeasure.numerator_met=true paired with exception_reason!=NONE"
  - id: ERR_PAGINATION_RANGE
    http: 400
    condition: "limit/offset out of allowed range"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: supplied version != current entity version"
  - id: ERR_DUPLICATE_NPI
    http: 409
    condition: "Therapist.npi already exists"
  - id: ERR_VALIDATION
    http: 400
    condition: "Generic field-shape validation failure (missing required field, wrong type, enum value not allowed)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Front-office staff who register patients, therapists, and externally-sourced authorizations. Cannot perform clinical operations or sign visits."
    identity: opaque
    exclusive_operations:
      - "POST /therapists"
      - "POST /patients"
      - "POST /veteran-referrals"
      - "POST /_clock/advance"
    shared_operations:
      - "GET /* (read endpoints)"
      - "POST /episodes/{episode_id}/authorizations"

  - name: Therapist
    description: "Clinician — PT/DPT may evaluate and sign discharge; all credentials may schedule, start, sign visits and issue HEPs. The acting Therapist's id must equal X-User-ID."
    identity: entity_backed:Therapist
    exclusive_operations:
      - "POST /episodes"
      - "POST /episodes/{episode_id}/evaluations"
      - "POST /evaluations/{id}/finalize"
      - "POST /evaluations/{id}/amend"
      - "POST /episodes/{episode_id}/plan-of-cares"
      - "POST /plan-of-cares/{id}/certify"
      - "POST /plan-of-cares/{id}/revoke"
      - "POST /episodes/{episode_id}/visits"
      - "POST /visits/{id}/start"
      - "POST /visits/{id}/sign"
      - "POST /visits/{id}/cancel"
      - "POST /episodes/{episode_id}/home-exercise-programs"
      - "POST /home-exercise-programs/{id}/issue"
      - "POST /episodes/{episode_id}/mips-measures"
      - "POST /episodes/{episode_id}/discharge-assessments"
      - "POST /discharge-assessments/{id}/sign"
      - "DELETE /episodes/{id}"
    shared_operations:
      - "GET /* (read endpoints)"
      - "POST /episodes/{episode_id}/authorizations"

  - name: Biller
    description: "Submits claims for signed visits. Cannot perform clinical actions."
    identity: opaque
    exclusive_operations:
      - "POST /visits/{id}/submit-claim"
    shared_operations:
      - "GET /* (read endpoints)"

  - name: Patient
    description: "End-user patient acknowledging their HEP. May read only their own Patient row and their own HEPs."
    identity: entity_backed:Patient
    exclusive_operations:
      - "POST /home-exercise-programs/{id}/acknowledge"
    shared_operations:
      - "GET /patients/{my_id}"
