# =============================================================================
# 1.9 Scaffold Corner Design - breadth coverage index for task 2863
# (Youth Sports Coach Screening & Athlete Safety Compliance)
#
# Section values are the nine sections of references/claim-extraction-guide.md;
# claim_type values are that guide's per-section table rows. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml (SS1.8) appear as excluded_because
# stubs naming the covering SS1.8 instance.
#
# Shared conventions used by every recipe below:
#   * the logical clock is pinned first, so every expiry / window / buffer
#     assertion is deterministic;
#   * ClubAdministrator identity is entity_backed:Club, so as_user_id is the
#     club's own id (${club_a_id});
#   * Member identity is entity_backed:Member, so as_user_id is the member id;
#   * NgbAdmin, SafeSportOfficer, ComplianceAuditor and ScreeningVendor are
#     opaque roles; an as_user_id is supplied only where segregation of duties
#     (validations[priority=25]) makes the acting user observable.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: club_creation_returns_computed_defaults_and_version_one
        claim_type: creation
        grounds:
          - entities.Club
          - endpoints[POST /safesport/clubs]
          - response_envelope.success
        distinguishing_aspect: |
          A chartered club is born with every computed field at its declared default and
          version 1: escrow_balance_cents and total_funded_cents both equal the supplied
          initial_escrow_cents, sanction_status is NONE, compliance_posture is OPEN,
          compliance_score is null and all four counters are 0.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
          trigger:
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 250000 }
              as: NgbAdmin
              captures: { club_new_id: $.data.id, cn_escrow: $.data.escrow_balance_cents, cn_funded: $.data.total_funded_cents, cn_sanction: $.data.sanction_status, cn_posture: $.data.compliance_posture, cn_score: $.data.compliance_score, cn_open: $.data.open_finding_count, cn_crit: $.data.critical_open_finding_count, cn_restricted: $.data.restricted_member_count, cn_active: $.data.active_assignment_count, cn_version: $.data.version }
          assert:
            - "HTTP status is 201"
            - "${cn_escrow} == 250000"
            - "${cn_funded} == 250000"
            - "${cn_sanction} == NONE"
            - "${cn_posture} == OPEN"
            - "${cn_score} == null"
            - "${cn_open} == 0"
            - "${cn_crit} == 0"
            - "${cn_restricted} == 0"
            - "${cn_active} == 0"
            - "${cn_version} == 1"
            - "Club.${club_new_id}.roster_size_attested == 3"
            - "the response body carries meta.api_request_id, meta.api_request_timestamp, response_type == object and data"
      - name: member_retrieval_returns_stored_fields_and_derived_dimensions
        claim_type: retrieval
        grounds:
          - entities.Member
          - endpoints[GET /safesport/members/{member_id}]
          - calculations.screening_tier_assignment
          - calculations.contact_eligibility_derivation
        distinguishing_aspect: |
          The read echoes stored input verbatim AND the derived dimensions a fresh member
          starts with: screening UNSCREENED, membership PENDING, training NEVER,
          contact_eligibility RESTRICTED, eligible_through null, and risk_points 30 with
          required_tier TIER_1 for an ASSISTANT_COACH with no minor-athlete contact and one
          jurisdiction.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' exists"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Ada Pruitt", email: "ada.pruitt@alpha.test", role_type: "ASSISTANT_COACH", has_minor_athlete_contact: false, date_of_birth: "1990-01-15", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_read_id: $.data.id }
          trigger:
            - call: "GET /safesport/members/${m_read_id}"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { r_name: $.data.full_name, r_email: $.data.email, r_role: $.data.role_type, r_club: $.data.club_id, r_points: $.data.risk_points, r_tier: $.data.required_tier, r_screen: $.data.screening_status, r_member: $.data.membership_status, r_train: $.data.training_status, r_contact: $.data.contact_eligibility, r_through: $.data.eligible_through, r_version: $.data.version }
          assert:
            - "${r_name} == Ada Pruitt"
            - "${r_email} == ada.pruitt@alpha.test"
            - "${r_role} == ASSISTANT_COACH"
            - "${r_club} == ${club_a_id}"
            - "${r_points} == 30"
            - "${r_tier} == TIER_1"
            - "${r_screen} == UNSCREENED"
            - "${r_member} == PENDING"
            - "${r_train} == NEVER"
            - "${r_contact} == RESTRICTED"
            - "${r_through} == null"
            - "${r_version} == 1"
      - name: club_member_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /safesport/clubs/{club_id}/members]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three members with limit 2 must report total_count 3 with has_more true on the
          first page and has_more false on the second, and the omitted-limit call must fall
          back to the declared default of 10 rather than returning an unbounded array.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' has exactly three members"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Page One", email: "page.one@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1990-02-01", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_p1_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Page Two", email: "page.two@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1990-03-01", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_p2_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Page Three", email: "page.three@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1990-04-01", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_p3_id: $.data.id }
          trigger:
            - call: "GET /safesport/clubs/${club_a_id}/members"
              payload: { limit: 2, offset: 0 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "GET /safesport/clubs/${club_a_id}/members"
              payload: { limit: 2, offset: 2 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
            - call: "GET /safesport/clubs/${club_a_id}/members"
              payload: {}
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
          assert:
            - "the limit=2 offset=0 response carries response_type == array, total_count 3, has_more true and exactly 2 items"
            - "the limit=2 offset=2 response carries total_count 3, has_more false and exactly 1 item"
            - "the two pages together contain ${m_p1_id}, ${m_p2_id} and ${m_p3_id} with no repeats"
            - "the payload-free response applies limit 10 and offset 0, so total_count is 3, has_more is false and all 3 items are present"
      - name: unknown_member_uuid_read_is_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_MEMBER_NOT_FOUND]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on the member read returns
          ERR_MEMBER_NOT_FOUND with HTTP 404 - not an empty 200 body and not a 422 - and the
          path check runs before any body validation.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one club exists and no member has been created"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
          trigger:
            - call: "GET /safesport/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NgbAdmin
              captures: { nf_error: $.data.error_id, nf_message: $.data.message }
          assert:
            - "${nf_error} == ERR_MEMBER_NOT_FOUND"
            - "HTTP status is 404"
            - "${nf_message} is a non-empty human-readable string"
      - name: member_creation_without_role_type_is_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=6]
          - errors[ERR_VALIDATION]
          - endpoints[POST /safesport/members]
        distinguishing_aspect: |
          role_type has source input and no default, so omitting it must fail with
          ERR_VALIDATION 422 and create nothing - the club member listing is still empty
          afterwards, proving the write was rejected rather than defaulted.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' exists with no members"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
          trigger:
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "No Role", email: "no.role@alpha.test", has_minor_athlete_contact: false, date_of_birth: "1990-05-01", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { rf_error: $.data.error_id }
          assert:
            - "${rf_error} == ERR_VALIDATION"
            - "HTTP status is 422"
            - "GET /safesport/clubs/${club_a_id}/members reports total_count 0"
      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Club.fields.minor_athlete_program
          - entities.TrainingCourse.fields.pass_score
          - entities.ScreeningOrder.fields.expedited
          - endpoints[POST /safesport/clubs/{club_id}/escrow-funding]
        distinguishing_aspect: |
          Three different defaults are exercised in one chain: minor_athlete_program falls
          back to true and initial_escrow_cents to an escrow of 0 on the club, pass_score
          falls back to 80 on the course, and expedited falls back to false on the screening
          order, which is why expedite_cents is 0 and a TIER_1 single-jurisdiction order is
          charged exactly 2500.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "empty database"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
          trigger:
            - call: "POST /safesport/clubs"
              payload: { name: "Default Aquatics", state_code: "OR", roster_size_attested: 2 }
              as: NgbAdmin
              captures: { club_d_id: $.data.id, d_minor: $.data.minor_athlete_program, d_escrow_0: $.data.escrow_balance_cents, d_funded_0: $.data.total_funded_cents }
            - call: "POST /safesport/clubs/${club_d_id}/escrow-funding"
              payload: { amount_cents: 500000 }
              as: ClubAdministrator
              as_user_id: "${club_d_id}"
              captures: { d_escrow_1: $.data.escrow_balance_cents, d_funded_1: $.data.total_funded_cents, club_d_v2: $.data.version }
            - call: "POST /safesport/training-courses"
              payload: { code: "SS101", title: "Abuse Prevention Core", validity_days: 365, delivery_mode: "ONLINE", required_for_tiers: ["TIER_1", "TIER_2", "TIER_3"] }
              as: NgbAdmin
              captures: { d_pass: $.data.pass_score }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_d_id}", full_name: "Deft Owens", email: "deft.owens@default.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1992-06-01", jurisdiction_codes: ["OR"] }
              as: ClubAdministrator
              as_user_id: "${club_d_id}"
              captures: { m_d_id: $.data.id, d_tier: $.data.required_tier }
            - call: "POST /safesport/members/${m_d_id}/screening-orders"
              payload: { expected_club_version: "${club_d_v2}" }
              as: ClubAdministrator
              as_user_id: "${club_d_id}"
              captures: { d_expedited: $.data.expedited, d_expedite_cents: $.data.expedite_cents, d_charged: $.data.charged_cents, d_gross: $.data.gross_subtotal_cents, d_disc: $.data.discount_cents }
          assert:
            - "${d_minor} == true"
            - "${d_escrow_0} == 0"
            - "${d_funded_0} == 0"
            - "${d_escrow_1} == 500000"
            - "${d_funded_1} == 500000"
            - "${club_d_v2} == 2"
            - "${d_pass} == 80"
            - "${d_tier} == TIER_1"
            - "${d_expedited} == false"
            - "${d_expedite_cents} == 0"
            - "${d_gross} == 2500"
            - "${d_disc} == 0"
            - "${d_charged} == 2500"
            - "Club.${club_d_id}.escrow_balance_cents == 497500"
      - name: screening_order_computed_fields_snapshot_member_state_at_order_time
        claim_type: computed_fields
        grounds:
          - entities.ScreeningOrder.fields.tier
          - entities.ScreeningOrder.fields.jurisdiction_count
          - calculations.screening_order_charge
        distinguishing_aspect: |
          tier and jurisdiction_count are computed by snapshotting the member, not accepted
          from the body: a CHAPERONE with minor-athlete contact and two jurisdictions scores
          50 points, so the order is stamped TIER_2 with jurisdiction_count 2, gross 5900,
          no volume discount (5900 < 8000) and charged 5900.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow_balance_cents 500000"
            - "member m_cf is a CHAPERONE with minor-athlete contact and jurisdictions [CA, NV], so risk_points 50 and required_tier TIER_2"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, club_a_v1: $.data.version }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Cara Fenn", email: "cara.fenn@alpha.test", role_type: "CHAPERONE", has_minor_athlete_contact: true, date_of_birth: "1985-07-02", jurisdiction_codes: ["CA", "NV"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_cf_id: $.data.id, cf_points: $.data.risk_points, cf_tier: $.data.required_tier }
          trigger:
            - call: "POST /safesport/members/${m_cf_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${club_a_v1}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_cf_id: $.data.id, cf_o_tier: $.data.tier, cf_o_jc: $.data.jurisdiction_count, cf_gross: $.data.gross_subtotal_cents, cf_disc: $.data.discount_cents, cf_charged: $.data.charged_cents, cf_status: $.data.status }
          assert:
            - "${cf_points} == 50"
            - "${cf_tier} == TIER_2"
            - "${cf_o_tier} == TIER_2"
            - "${cf_o_jc} == 2"
            - "${cf_gross} == 5900"
            - "${cf_disc} == 0"
            - "${cf_charged} == 5900"
            - "${cf_status} == ORDERED"
            - "ScreeningOrder.${so_cf_id}.member_id == ${m_cf_id}"
            - "Club.${club_a_id}.escrow_balance_cents == 494100"
      - name: system_fields_are_server_minted_and_version_increments_per_write
        claim_type: system_fields
        grounds:
          - entities.Club
          - entities.ScreeningOrder.fields.member_id
          - complexity_profile.complexity_layers[optimistic_concurrency]
        distinguishing_aspect: |
          id is a bare UUID with no type prefix, created_at and updated_at are ISO 8601 UTC
          with exactly three fractional digits, version starts at 1 and increments by one on
          every mutation - including the escrow funding that touches nothing else - and
          ScreeningOrder.member_id is taken from the path, never from the body.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' with escrow_balance_cents 500000 and member m_sf"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id, sf_created: $.data.created_at, sf_updated: $.data.updated_at, sf_v1: $.data.version }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Sam Frei", email: "sam.frei@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1994-08-03", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_sf_id: $.data.id }
          trigger:
            - call: "POST /safesport/clubs/${club_a_id}/escrow-funding"
              payload: { amount_cents: 1000 }
              as: NgbAdmin
              captures: { sf_v2: $.data.version, sf_updated_2: $.data.updated_at }
            - call: "POST /safesport/members/${m_sf_id}/screening-orders"
              payload: { expedited: false, expected_club_version: "${sf_v2}" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { so_sf_id: $.data.id, sf_order_member: $.data.member_id, sf_order_v: $.data.version, sf_order_created: $.data.created_at }
          assert:
            - "${club_a_id} is a 36-character UUID with no type prefix"
            - "${sf_created} == 2026-08-01T00:00:00.000Z"
            - "${sf_updated} == 2026-08-01T00:00:00.000Z"
            - "${sf_v1} == 1"
            - "${sf_v2} == 2"
            - "${sf_updated_2} == 2026-08-01T00:00:00.000Z"
            - "${sf_order_member} == ${m_sf_id}"
            - "${sf_order_v} == 1"
            - "${sf_order_created} == 2026-08-01T00:00:00.000Z"
            - "Club.${club_a_id}.version == 3"
      - name: invalid_enum_and_out_of_range_inputs_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=6]
          - entities.Member.fields.role_type
          - response_envelope.pagination_defaults
          - endpoints[POST /safesport/coach-assignments]
        distinguishing_aspect: |
          Three different shape violations all resolve to ERR_VALIDATION 422 at priority 6:
          an undeclared role_type enum member, a limit above the declared maximum of 100,
          and a coach assignment whose season_end is not after its season_start.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "club 'Alpha Aquatics' exists with member m_tc"
          setup_api_calls:
            - call: "POST /safesport/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NgbAdmin
            - call: "POST /safesport/clubs"
              payload: { name: "Alpha Aquatics", state_code: "CA", roster_size_attested: 3, minor_athlete_program: true, initial_escrow_cents: 500000 }
              as: NgbAdmin
              captures: { club_a_id: $.data.id }
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Tyra Cobb", email: "tyra.cobb@alpha.test", role_type: "VOLUNTEER", has_minor_athlete_contact: false, date_of_birth: "1993-09-04", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_tc_id: $.data.id }
          trigger:
            - call: "POST /safesport/members"
              payload: { club_id: "${club_a_id}", full_name: "Bad Enum", email: "bad.enum@alpha.test", role_type: "SUPER_COACH", has_minor_athlete_contact: false, date_of_birth: "1993-10-05", jurisdiction_codes: ["CA"] }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { tc_enum_error: $.data.error_id }
            - call: "GET /safesport/clubs/${club_a_id}/members"
              payload: { limit: 101, offset: 0 }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { tc_limit_error: $.data.error_id }
            - call: "POST /safesport/coach-assignments"
              payload: { member_id: "${m_tc_id}", club_id: "${club_a_id}", team_name: "Backwards Season", season_start: "2027-05-31T00:00:00Z", season_end: "2026-09-01T00:00:00Z" }
              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { tc_season_error: $.data.error_id }
          assert:
            - "${tc_enum_error} == ERR_VALIDATION"
            - "${tc_limit_error} == ERR_VALIDATION"
            - "${tc_season_error} == ERR_VALIDATION"
            - "all three responses carry HTTP status 422 and response_type == error"
