              payload: { project_id: "${proj_id}", entry_type: "SUBCONTRACT_INVOICE", cost_code: "06-100", amount: 10000.10, incurred_at: "2026-08-10T00:00:00.000Z", subcontractor_id: "${sub_frame_id}" }
              as: ProjectManager
              as_user_id: "${pm_id}"
              captures: { ce1_id: $.data.id }
          trigger:
            - call: "POST /cost-entries/${ce1_id}/review"
              payload: { decision: "APPROVE" }
              as: Controller
              as_user_id: "${ctl_a_id}"
            - call: "GET /projects/${proj_id}/contract-position"
              as: PlatformAdmin
          assert:
            - "CostEntry.${ce1_id}.status == APPROVED and approved_by_staff_id == ${ctl_a_id}"
            - "Project.${proj_id}.cost_to_date == 10000.10"
            - "Project.${proj_id}.eligible_cost_pool == 10000.10"
            - "the contract-position response reports variant_applied == \"COST_PLUS\", cost_to_date == 10000.10 and owner_billable_amount == 11800.12"
