            - { call: "POST /hotline/assignments/${as1}/activate", as: ComplianceOfficer, as_user_id: "${s_off}" }
            - { call: "POST /hotline/interviews", payload: { case_id: "${cs1}", interviewee_role: SUBJECT, interviewee_identifier: "s-s1", scheduled_start: "2026-08-05T10:00:00Z", scheduled_end: "2026-08-05T11:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { ivs1: $.data.id } }
            - { call: "POST /hotline/interviews/${ivs1}/conclude", payload: { outcome: CONDUCTED, summary: "Interview conducted on site with the witness present throughout." }, as: Investigator, as_user_id: "${s_inv}" }
            - { call: "POST /hotline/evidence-items", payload: { case_id: "${cs1}", evidence_type: OTHER, description: "Access log archive file", checksum: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc", captured_at: "2026-08-05T00:00:00Z" }, as: Investigator, as_user_id: "${s_inv}", captures: { evs1: $.data.id } }
