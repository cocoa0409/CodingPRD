              payload: { sample_id: "${s_id}", contaminant_id: "${pfos_id}", method: "METHOD_533", reported_ng_per_l: 3.00, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP status is 422"
            - "error envelope error_id == ERR_SAMPLE_NOT_RECEIVED"
            - "error envelope error_id is NOT ERR_CONTAMINANT_NOT_IN_PANEL"
            - "Sample.${s_id}.status is still IN_TRANSIT"
            - "After POST /samples/${s_id}/receive with chain_of_custody_intact true and field_blank_result_ng_per_l 0.50, the identical result submission returns ERR_CONTAMINANT_NOT_IN_PANEL — proving 70 was reachable all along and merely outranked"

      - name: the_qualifying_technology_gate_applies_only_to_the_select_action
        claim_type: conditional_validation
        grounds:
          - validations[priority=96]
          - errors[ERR_NO_QUALIFYING_TECHNOLOGY]
          - state_machines.TreatmentEvaluation.transitions.PILOTING_to_REJECTED_ALL
          - global_constants.MIN_REMOVAL_PCT
        distinguishing_aspect: "One evaluation, two completed pilots, both below the 90.00 removal floor (80.00 and 75.00): the same request body differing only in action must be refused for SELECT and honoured for ABANDON, so the rule is conditional on the action rather than on the pilot evidence count, which is satisfied in both branches."
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01 has an evaluation with a GAC pilot and an IX pilot, both COMPLETED."
            - "GAC removal is (50.00 - 10.00) / 50.00 = 80.00 pct and IX removal is (50.00 - 12.50) / 50.00 = 75.00 pct, so neither reaches MIN_REMOVAL_PCT of 90.00."
            - "MIN_COMPLETED_PILOTS of 2 is satisfied, so priority 95 cannot fire in either branch."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 500000 }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "IX", window_start_at: "2026-05-17T00:00:00.000Z", window_end_at: "2026-05-31T00:00:00.000Z", ebct_min: 3.00, lifecycle_cost_cents: 1800000000, capital_cost_estimate_cents: 520000000, annual_om_estimate_cents: 28000000, residuals_burden_score: 40.00, footprint_score: 85.00, om_complexity_score: 70.00 }
              as: TreatmentEngineer
              captures: { ix_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 10.00, bed_volumes_treated: 25000.00, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 12.50, bed_volumes_treated: 18000.00, spent_media_kg: 300.00 }
              as: TreatmentEngineer
          trigger:
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "SELECT", decision_note: "Attempting to select the least bad option" }
              as: TreatmentEngineer
              captures: { err: "$.data.error_id" }
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "ABANDON", decision_note: "Neither technology clears the removal floor" }
              as: TreatmentEngineer
          assert:
            - "The SELECT attempt returns HTTP 422 with error_id ERR_NO_QUALIFYING_TECHNOLOGY"
            - "Immediately after the refused SELECT: TreatmentEvaluation.${eval_id}.status is still PILOTING"
            - "Immediately after the refused SELECT: TreatmentEvaluation.${eval_id}.selected_technology == null"
            - "Immediately after the refused SELECT: GET /capital-projects?treatment_evaluation_id=${eval_id} returns total_count == 0"
            - "PilotTest.${gac_id}.removal_pct == 80.00 and PilotTest.${ix_id}.removal_pct == 75.00"
            - "The ABANDON attempt returns HTTP 200"
            - "TreatmentEvaluation.${eval_id}.status == REJECTED_ALL"
            - "TreatmentEvaluation.${eval_id}.decision_note == \"Neither technology clears the removal floor\""
            - "EntryPoint.${ep_id}.treatment_status == NONE"
            - "GET /capital-projects?treatment_evaluation_id=${eval_id} still returns total_count == 0"

      - name: the_violation_gate_applies_only_where_a_violation_is_open
        claim_type: conditional_validation
        grounds:
          - validations[priority=90]
          - validations[priority=92]
          - errors[ERR_VIOLATION_PENDING_BLOCKS_REDUCTION]
          - entities.EntryPoint.fields.compliance_posture
        distinguishing_aspect: "Two entry points, both QUARTERLY with exactly one accepted quarter and both short of the four-quarter history, differing only in their accepted concentration and the resulting posture: the VIOLATION_PENDING one is refused at priority 90 while the COMPLIANT one falls through to the history rule at 92 — the same endpoint, the same body, two different error ids, which is what makes rule 90 conditional rather than universal."
        test_recipe:
          setup:
            - "PFOA has an MCL of 4.00 and a trigger level of 2.00; one laboratory with daily capacity 5 serves both entry points."
            - "EPTDS-01 has one accepted 2026Q2 result at 4.50 ng/L and an issued MCL_VIOLATION determination, so its compliance_posture is VIOLATION_PENDING and open_violation_count is 1."
            - "EPTDS-02 has one accepted 2026Q2 result at 1.20 ng/L, giving a ratio of 0.3000, so its compliance_posture is COMPLIANT and open_violation_count is 0."
            - "Both entry points are QUARTERLY because the first accepted result moved them out of INITIAL, and both have fewer than REDUCTION_MIN_QUARTERS_ANNUAL qualifying quarters."
          setup_api_calls:
            - call: "POST /contaminants"
              payload: { code: "PFOA", mcl_ng_per_l: 4.00, trigger_level_ng_per_l: 2.00, required_mrl_ng_per_l: 2.00 }
              as: UtilityAdmin
              captures: { pfoa_id: "$.data.id" }
            - call: "POST /laboratories"
              payload: { name: "Northgate Analytical", certification_id: "CERT-001", certified_methods: ["METHOD_533"], lowest_achievable_dl_ng_per_l: 1.00, certification_expires_on: "2027-12-31T00:00:00.000Z", daily_analysis_capacity: 5 }
              as: UtilityAdmin
              captures: { lab_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /entry-points"
              payload: { label: "EPTDS-02", source_type: "SURFACE_WATER", population_served: 12000 }
              as: UtilityAdmin
              captures: { clean_ep_id: "$.data.id" }
            - call: "POST /samples"
              payload: { entry_point_id: "${ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T08:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-A1" }
              as: SamplingTechnician
              captures: { s1_id: "$.data.id" }
            - call: "POST /samples/${s1_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s1_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s1_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 4.50, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T08:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r1_id: "$.data.id" }
            - call: "POST /lab-results/${r1_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /entry-points/${ep_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ep_v: "$.data.version" }
            - call: "POST /compliance-determinations"
              payload: { entry_point_id: "${ep_id}", contaminant_id: "${pfoa_id}", period_end: "2026Q2", expected_entry_point_version: "${ep_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { det_id: "$.data.id" }
            - call: "POST /compliance-determinations/${det_id}/issue"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /samples"
              payload: { entry_point_id: "${clean_ep_id}", panel_contaminant_ids: ["${pfoa_id}"], monitoring_period: "2026Q2", collected_at: "2026-05-15T09:00:00.000Z", protocol: "LOW_FLOW_GRAB", ptfe_free_kit: true, field_blank_included: true, preservative_lot: "LOT-B1" }
              as: SamplingTechnician
              captures: { s2_id: "$.data.id" }
            - call: "POST /samples/${s2_id}/ship"
              payload: { laboratory_id: "${lab_id}" }
              as: SamplingTechnician
            - call: "POST /samples/${s2_id}/receive"
              payload: { chain_of_custody_intact: true, field_blank_result_ng_per_l: 0.50 }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
            - call: "POST /lab-results"
              payload: { sample_id: "${s2_id}", contaminant_id: "${pfoa_id}", method: "METHOD_533", reported_ng_per_l: 1.20, detection_limit_ng_per_l: 1.00, analyzed_at: "2026-05-20T09:00:00.000Z" }
              as: LaboratoryManager
              as_user_id: "${lab_id}"
              captures: { r2_id: "$.data.id" }
            - call: "POST /lab-results/${r2_id}/review"
              payload: { action: "ACCEPT" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /entry-points/${ep_id}/monitoring-reduction-requests"
              payload: { target_status: "ANNUAL", justification: "Requesting relief while the violation is open" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: "$.data.error_id" }
            - call: "POST /entry-points/${clean_ep_id}/monitoring-reduction-requests"
              payload: { target_status: "ANNUAL", justification: "Requesting relief after one clean quarter" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "The EPTDS-01 request returns HTTP 422 with error_id ERR_VIOLATION_PENDING_BLOCKS_REDUCTION"
            - "EntryPoint.${ep_id}.compliance_posture == VIOLATION_PENDING"
            - "EntryPoint.${ep_id}.open_violation_count == 1"
            - "EntryPoint.${ep_id}.monitoring_status is still QUARTERLY"
            - "EntryPoint.${ep_id}.requested_monitoring_status == null"
            - "ComplianceDetermination.${det_id}.determination == MCL_VIOLATION"
            - "The EPTDS-02 request returns HTTP 422 with error_id ERR_INSUFFICIENT_MONITORING_HISTORY"
            - "EntryPoint.${clean_ep_id}.open_violation_count == 0"
            - "EntryPoint.${clean_ep_id}.consecutive_qualifying_quarters == 1"
            - "EntryPoint.${clean_ep_id}.monitoring_status is still QUARTERLY"
            - "EntryPoint.${clean_ep_id}.requested_monitoring_status == null"

      - name: the_suspension_gate_outranks_the_sampling_material_gate
        claim_type: priority_ordering
        grounds:
          - validations[priority=20]
          - validations[priority=60]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_monitoring_outranks_the_prohibited_sampling_kit_check
          rationale: "The doubly-violating request and the single-violation control that proves the lower rule was reachable are both asserted there."

      - name: the_disposal_route_gate_outranks_the_residuals_budget_gate
        claim_type: priority_conflict
        grounds:
          - validations[priority=62]
          - validations[priority=110]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / prohibited_disposal_route_outranks_the_exhausted_residuals_budget
          rationale: "ERR_DISPOSAL_METHOD_PROHIBITED winning over ERR_RESIDUALS_BUDGET_EXCEEDED on the same shipment is asserted there."

      - name: an_overlapping_pilot_window_is_detected_before_it_is_booked
        claim_type: temporal_validation
        grounds:
          - validations[priority=86]
          - errors[ERR_PILOT_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / pilot_windows_conflict_inside_the_decontamination_buffer_and_pass_at_exactly_48_hours
          rationale: "The buffered-overlap refusal and the exactly-48-hour acceptance are asserted there as a pair."

      - name: individually_valid_analyses_can_breach_the_daily_capacity_together
        claim_type: aggregate_validation
        grounds:
          - validations[priority=94]
          - errors[ERR_LAB_DAILY_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / laboratory_capacity_counts_a_utc_calendar_day_bucket_rather_than_a_rolling_window
          rationale: "The calendar-day bucket boundary and the refusal of the capacity-exceeding submission are asserted there."

      - name: result_creation_validity_depends_on_the_parent_sample_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=34]
          - errors[ERR_SAMPLE_NOT_RECEIVED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / lab_result_creation_reads_the_parent_sample_state_not_its_own
          rationale: "Both the refused IN_TRANSIT-parent case and the accepted RECEIVED-parent case are asserted there."

      - name: manifest_creation_validity_depends_on_the_pilot_state
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=76]
          - errors[ERR_PILOT_NOT_COMPLETED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / residuals_manifest_creation_reads_the_pilot_state_not_its_own
          rationale: "Both the refused RUNNING-pilot case and the accepted COMPLETED-pilot case are asserted there."

  # ===========================================================================
  # Guide section 5 — Endpoints
  #
  # The Bulk action row is skipped: §1.5 declares no bulk endpoint (already
  # noted in this file's header). Every other endpoint pattern row is walked.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: the_capital_project_patch_switches_the_authoritative_bill_variant
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /capital-projects/{id}]
          - entities.CapitalProject.fields.rate_design
          - calculations.rate_impact_analysis.variants
        distinguishing_aspect: "The only update endpoint in §1.5: patching rate_design alone must leave the whole seven-step ladder untouched (rate_impact_pct stays 7.18) while re-pointing monthly_bill_increase_cents from the uniform 341 to the volumetric 340 — both variant values remain readable side by side on the row."
        test_recipe:
          setup:
            - "EntryPoint EPTDS-01 at population 45000 gives 18000 accounts, 1,080,000 annual kgal and 1,026,000,000 cents of current annual revenue."
            - "A GAC-versus-IX evaluation with both pilots completed and GAC selected produces a CapitalProject at capital 680,000,000 and O&M 31,000,000, with no funding and no recovery, so the ladder reads debt 41,586,568 / base 72,586,568 / provisional 7.07 / 150 bp / final 73,675,367 / 7.18."
            - "rate_design is still at its UNIFORM default, so monthly_bill_increase_cents is the uniform 341."
          setup_api_calls:
            - call: "POST /entry-points"
              payload: { label: "EPTDS-01", source_type: "GROUNDWATER", population_served: 45000 }
              as: UtilityAdmin
              captures: { ep_id: "$.data.id" }
            - call: "POST /treatment-evaluations"
              payload: { entry_point_id: "${ep_id}", residuals_budget_cents: 500000 }
              as: TreatmentEngineer
              captures: { eval_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "GAC", window_start_at: "2026-05-01T00:00:00.000Z", window_end_at: "2026-05-15T00:00:00.000Z", ebct_min: 10.00, lifecycle_cost_cents: 2550000000, capital_cost_estimate_cents: 680000000, annual_om_estimate_cents: 31000000, residuals_burden_score: 62.00, footprint_score: 71.00, om_complexity_score: 83.00 }
              as: TreatmentEngineer
              captures: { gac_id: "$.data.id" }
            - call: "POST /pilot-tests"
              payload: { treatment_evaluation_id: "${eval_id}", technology: "IX", window_start_at: "2026-05-17T00:00:00.000Z", window_end_at: "2026-05-31T00:00:00.000Z", ebct_min: 3.00, lifecycle_cost_cents: 1800000000, capital_cost_estimate_cents: 520000000, annual_om_estimate_cents: 28000000, residuals_burden_score: 40.00, footprint_score: 85.00, om_complexity_score: 70.00 }
              as: TreatmentEngineer
              captures: { ix_id: "$.data.id" }
            - call: "POST /pilot-tests/${gac_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${gac_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 1.85, bed_volumes_treated: 25000.00, spent_media_kg: 800.00 }
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/start"
              payload: {}
              as: TreatmentEngineer
            - call: "POST /pilot-tests/${ix_id}/complete"
              payload: { influent_ng_per_l: 50.00, effluent_ng_per_l: 4.00, bed_volumes_treated: 18000.00, spent_media_kg: 300.00 }
              as: TreatmentEngineer
            - call: "POST /treatment-evaluations/${eval_id}/decision"
              payload: { action: "SELECT", decision_note: "GAC scores highest above the removal floor" }
              as: TreatmentEngineer
            - call: "GET /capital-projects?treatment_evaluation_id=${eval_id}"
              payload: {}
              as: FinanceOfficer
              captures: { proj_id: "$.data[0].id" }
          trigger:
            - call: "PATCH /capital-projects/${proj_id}"
