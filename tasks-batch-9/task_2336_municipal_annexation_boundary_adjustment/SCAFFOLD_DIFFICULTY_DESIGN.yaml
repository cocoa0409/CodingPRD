  # =====================================================================================
  # RULE 9 — compensating_invariant
  # Three DIFFERENT conserved quantities:
  #   (a) Petition.qualified_signature_assessed_value_cents,
  #   (b) ServiceProvider.encumbered_capacity_days + PlanOfServices.committed_cost_cents,
  #   (c) Municipality.taxable_assessed_value_cents (posted then reversed by de-annexation).
  # =====================================================================================
  - rule_id: compensating_invariant
    instances:
      - name: consent_withdrawal_restores_petition_signature_value_without_drift
        grounds:
          - calculations.petition_sufficiency
          - entities.Petition.fields.qualified_signature_assessed_value_cents
          - entities.Petition.fields.qualified_signature_owner_count
          - entities.ParcelOwnerConsent.fields.qualified_value_cents
        distinguishing_aspect: |
          Conserved quantity Petition.qualified_signature_assessed_value_cents: adding a third
          consent worth 20,000,000 cents lifts it 70,000,000 -> 90,000,000 and withdrawing that same
          consent must return it to exactly 70,000,000 (70.00%, owner_count 2) — not 69,999,999 and
          not a stale 90,000,000 — while the petition stays SUFFICIENT and the case stays in
          SUFFICIENCY_REVIEW, so the compensation leaves no downstream drift either.
        test_recipe:
          setup:
            - "One StatuteProfile authorizing PETITION_MAJORITY, signature_basis ASSESSED_VALUE, signature_threshold_pct 50.00."
            - "One certified AnnexationCase with parcels 40,000,000 (owner A), 30,000,000 (owner B), 20,000,000 (owner C) and 10,000,000 (owner A) cents."
            - "A petition holding owner A's and owner B's SIGNED consents at 100.00% each, certified SUFFICIENT at 70,000,000 cents / 70.00% / owner_count 2, so the case is in SUFFICIENCY_REVIEW."
            - "Logical clock at 2026-08-01T00:00:00Z, well inside the 180-day circulation window."
