  - rule_id: transitive_cascade
    instances:
      - name: issue_credit_depth4_facility_suspension_holds_sibling_credits
        grounds:
          - state_machines.DocumentaryCredit.APPROVED_to_ISSUED
          - state_machines.FacilityAllocation.OPEN_to_RELEASED
          - state_machines.CreditFacility.ACTIVE_to_SUSPENDED
