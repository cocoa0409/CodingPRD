          rationale: "Asserted as the rejection in that difficulty instance."

  # ===========================================================================
  - section: rbac
    instances:

      - name: program_director_cannot_approve_allocation
        claim_type: "Violation → Error"
        grounds:
          - roles.ProgramDirector
          - roles.MemberCFO
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Exclusive operations bind by ROLE, not just by user: the allocation's own creator calling approve under their ProgramDirector role gets 403 ERR_FORBIDDEN — the endpoint is MemberCFO-only, a different failure from ERR_SEGREGATION_OF_DUTIES."
        test_recipe:
          setup: ["Clock default. Org (reserve_floor 0), program inside window, allocation of 500 created by pd-1."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org RBAC", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v: $.data.version }
            - call: "POST /donated-goods/mission-programs"
              payload: { member_org_id: "${org_id}", name: "Prog RBAC", program_type: "JOB_TRAINING", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", funding_goal_cents: 50000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: $.data.id }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 500, expected_member_org_version: "${org_v}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /donated-goods/funding-allocations/${alloc_id}/approve"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-9"
              captures: { err: $.data.error_id }
          assert:
            - "approve under the ProgramDirector role is rejected with 403 ERR_FORBIDDEN (${err}) — it never reaches the segregation check"
            - "allocation remains PENDING"

      - name: cancel_shared_between_director_and_cfo
        claim_type: "Satisfaction → Pass"
        grounds:
          - roles.ProgramDirector
          - roles.MemberCFO
          - state_machines.FundingAllocation.PENDING_to_CANCELLED
        distinguishing_aspect: "Cancel is a shared operation: both the ProgramDirector and the MemberCFO can cancel PENDING allocations, and each succeeds on a different allocation."
        test_recipe:
          setup: ["Clock default. Org (reserve_floor 0), program inside window, two PENDING allocations (100 and 200)."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Share", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - call: "POST /donated-goods/mission-programs"
              payload: { member_org_id: "${org_id}", name: "Prog Share", program_type: "SUPPORT", start_date: "2026-01-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", funding_goal_cents: 50000 }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { prog_id: $.data.id }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 100, expected_member_org_version: "${org_v0}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { a1: $.data.id }
            - call: "GET /donated-goods/member-orgs/${org_id}"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { org_v1: $.data.version }
            - call: "POST /donated-goods/funding-allocations"
              payload: { mission_program_id: "${prog_id}", amount_cents: 200, expected_member_org_version: "${org_v1}" }
              as: ProgramDirector
              as_user_id: "pd-1"
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /donated-goods/funding-allocations/${a1}/cancel"
              payload: {}
              as: ProgramDirector
              as_user_id: "pd-1"
            - call: "POST /donated-goods/funding-allocations/${a2}/cancel"
              payload: {}
              as: MemberCFO
              as_user_id: "cfo-1"
          assert:
            - "both cancels succeed with 200; FundingAllocation.${a1}.status == CANCELLED and FundingAllocation.${a2}.status == CANCELLED"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:

      - name: supersede_keeps_pinned_item_price_and_cost
        claim_type: version_pinning_on_approval
        grounds:
          - state_machines.ProductionStandard.ACTIVE_to_SUPERSEDED
          - entities.DonatedItem.fields.priced_standard_id
          - entities.DonatedItem.fields.unit_cost_cents
        distinguishing_aspect: "Version pinning: an item priced under standard v1 (price 1000, unit cost 30) keeps both values after v2 supersedes v1 with a different map — the sale still accrues margin 970, not the 1940 that v2's economics would imply."
        test_recipe:
          setup: ["Clock default. Org (STANDARD costing); TEXTILES standard v1 (map A 1000, hourly 1800); one grade-A item priced under v1; then v2 (map A 2000, hourly 3600) supersedes v1."]
          setup_api_calls:
            - call: "POST /donated-goods/member-orgs"
              payload: { name: "Org Pin", costing_method: "STANDARD", reserve_floor_cents: 0, diversion_floor_bps: 7500 }
              as: PlatformAdmin
              captures: { org_id: $.data.id, org_v0: $.data.version }
            - call: "POST /donated-goods/donation-sites"
              payload: { member_org_id: "${org_id}", name: "Site Pin", site_type: "ADC" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { site_id: $.data.id }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 1800, grade_price_map: { A: 1000, B: 700, C: 400 }, price_floor_cents: 100, price_ceiling_cents: 5000, expected_member_org_version: "${org_v0}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { std1: $.data.id }
            - call: "POST /donated-goods/donations"
              payload: { site_id: "${site_id}", donor_name: "DP", item_count_declared: 1 }
              as: DonationAttendant
              as_user_id: "${site_id}"
              captures: { don_id: $.data.id }
            - call: "POST /donated-goods/donations/${don_id}/sort"
              payload: { items: [{ category: "TEXTILES", condition_grade: "A", estimated_value_cents: 100, weight_lbs: 1 }] }
              as: DonationAttendant
              as_user_id: "${site_id}"
            - call: "GET /donated-goods/donated-items"
              payload: { donation_id: "${don_id}" }
              as: StoreAssociate
              captures: { it: $.data.0.id }
            - call: "POST /donated-goods/donated-items/${it}/price"
              payload: {}
              as: StoreAssociate
            - call: "GET /donated-goods/member-orgs/${org_id}"
              payload: {}
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { org_v1: $.data.version }
            - call: "POST /donated-goods/production-standards"
              payload: { member_org_id: "${org_id}", category: "TEXTILES", target_items_per_hour: 60, hourly_cost_cents: 3600, grade_price_map: { A: 2000, B: 1400, C: 800 }, price_floor_cents: 100, price_ceiling_cents: 9000, expected_member_org_version: "${org_v1}" }
              as: MemberAdmin
              as_user_id: "${org_id}"
              captures: { std2: $.data.id }
          trigger:
            - call: "POST /donated-goods/donated-items/${it}/sell"
              payload: {}
              as: StoreAssociate
          assert:
            - "DonatedItem.${it}.priced_standard_id == ${std1} and price_cents == 1000 and unit_cost_cents == 30 after supersession"
            - "ProductionStandard.${std1}.status == SUPERSEDED and ProductionStandard.${std2}.status == ACTIVE"
            - "sale accrues margin 1000 - 30 = 970: GET /donated-goods/member-orgs/${org_id} shows retail_margin_pool_cents == 970 (v2 economics not retro-applied)"

      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: disposal_ticket_diversion_breach_gate
          rationale: "The 3-link disposal cascade is asserted end to end in that difficulty instance."

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: unit_cost_standard_vs_actual_diverge
          rationale: "Both costing variants and their pool divergence are asserted in that difficulty instance."

      - name: layer_ops_run_checkpoint
        claim_type: ops_run_checkpoint
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: donated_item_markdown_self_loop_and_rotation
          rationale: "The weekly markdown checkpoint mechanics (step progression, rotation pull) are asserted in that difficulty instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: unit_cost_standard_vs_actual_diverge
          rationale: "That instance reads both org pools via GET immediately after the sells and asserts the exact accrued values — mutation effects are visible in the next read with no lag."
