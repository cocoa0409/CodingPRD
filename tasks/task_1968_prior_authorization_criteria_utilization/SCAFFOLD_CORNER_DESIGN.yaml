        grounds: ["roles[IntakeSpecialist]", "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "IntakeSpecialist cannot call reviewer-decision (ClinicalReviewer-exclusive): 403 even on a request in the correct state."
