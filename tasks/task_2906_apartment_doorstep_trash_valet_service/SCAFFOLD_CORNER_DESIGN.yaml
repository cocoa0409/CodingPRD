          - entities.CompactorIncident.fields.ack_deadline_at
        distinguishing_aspect: "With no clock call at all, the first write stamps reported_at == 2026-08-01T00:00:00.000Z and ack_deadline_at == 2026-08-01T04:00:00.000Z for a JAM — proving the server reads the fixed logical epoch rather than falling back to wall-clock time."
        test_recipe:
          setup:
            - "An empty database and, deliberately, NO call to POST /valet/_clock/set_current_utc"
            - "One property created as the first write of the test"
          setup_api_calls:
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
