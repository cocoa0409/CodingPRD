      - name: audit_trail_records_mutation_with_actor_and_snapshots
        claim_type: derived_field_reconciliation
        grounds: [entities.AuditEvent, endpoints]
        distinguishing_aspect: "Every mutation emits an append-only AuditEvent with actor role/id and before/after snapshots; the trail for a cancelled policy contains the cancel action with the prior status."
        test_recipe:
          setup: ["One bound policy cancelled by its policyholder."]
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
