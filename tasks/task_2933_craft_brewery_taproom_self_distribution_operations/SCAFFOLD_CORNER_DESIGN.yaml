  # =========================================================================
  # Error-catalog coverage. Codes already exercised elsewhere are not repeated
  # here: ERR_INVALID_REQUEST / ERR_BEER_NOT_FOUND / ERR_TANK_NOT_FOUND (entities),
  # ERR_NOTICE_TRANSITION_INVALID / ERR_BATCH_TRANSITION_INVALID / ERR_RUN_NOT_COMPLETED
  # (state_machines), ERR_SANITATION_BELOW_STANDARD (calculations),
  # ERR_GROWLER_LABEL_INCOMPLETE / ERR_LICENSE_NOT_YET_EFFECTIVE /
  # ERR_TERRITORY_NOT_LICENSED / ERR_WHOLESALER_APPOINTMENT_REQUIRED /
  # ERR_GOOD_CAUSE_REQUIRED / ERR_EVENT_BARREL_CAP_EXCEEDED / ERR_FORBIDDEN_ROLE
  # (validations), ERR_EVENT_PERMIT_NOT_APPROVED / ERR_PERMIT_TRANSITION_INVALID
  # (endpoints), ERR_STALE_BATCH_VERSION / ERR_STALE_LICENSE_VERSION
  # (cross_cutting_complexity_layers), and ERR_ORDER_NOT_ALLOCATED /
  # ERR_SELF_DISTRIBUTION_CAP_EXCEEDED / ERR_TANK_NOT_IDLE / ERR_LABEL_NOT_APPROVED /
  # ERR_TANK_SCHEDULE_CONFLICT / ERR_OFFSITE_EVENT_CAPACITY_EXCEEDED /
  # ERR_LICENSE_NOT_ACTIVE (§1.8 instances).
  - section: errors
    instances:
      - name: singleton_and_header_guards_reject_a_missing_brewery_blank_role_and_duplicates
        claim_type: Triggerable
        grounds:
          - errors.ERR_BREWERY_NOT_FOUND
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_BREWERY_ALREADY_EXISTS
          - errors.ERR_DUPLICATE_CODE
        distinguishing_aspect: "Four different refusals on the cheapest surface in the API: reading the singleton before it exists (404), a role header sent as the empty string which counts as absent (401), a second create of the singleton (409) and a second license for a state_code that is already registered (409)."
        test_recipe:
          setup:
            - "An empty system: no Brewery row exists when the first trigger runs."
            - "The blank-header call sends X-User-ID normally and X-User-Role as the empty string \"\" - not whitespace, not omitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BreweryAdmin
          trigger:
            - call: "GET /brewery"
              payload: {}
              as: BreweryAdmin
              captures: { err_missing: $.data.error_id }
            - call: "GET /brewery"
              payload: {}
              as: ""
              captures: { err_auth: $.data.error_id }
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing II", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-9999" }
              as: BreweryAdmin
              captures: { err_dup_brewery: $.data.error_id }
            - call: "POST /state-licenses"
              payload: { state_code: "ID", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /state-licenses"
              payload: { state_code: "ID", license_type: "WHOLESALER_ONLY", annual_barrel_cap: 0.00, franchise_state: true, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { err_dup_code: $.data.error_id }
          assert:
            - "First call: HTTP 404 with error_id == ERR_BREWERY_NOT_FOUND"
            - "Second call: HTTP 401 with error_id == ERR_UNAUTHENTICATED (a blank role is an absent role)"
            - "Third call: HTTP 201"
            - "Fourth call: HTTP 409 with error_id == ERR_BREWERY_ALREADY_EXISTS and the stored legal_name is still 'Cascade Ridge Brewing'"
            - "Sixth call: HTTP 409 with error_id == ERR_DUPLICATE_CODE"
            - "GET /state-licenses returns total_count == 1"

      - name: unknown_identifiers_resolve_left_to_right_into_entity_specific_not_founds
        claim_type: Triggerable
        grounds:
          - errors.ERR_PACKAGING_RUN_NOT_FOUND
          - errors.ERR_KEG_ASSET_NOT_FOUND
          - errors.ERR_BATCH_NOT_FOUND
          - errors.ERR_STATE_LICENSE_NOT_FOUND
          - errors.ERR_APPOINTMENT_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_REPORT_NOT_FOUND
          - errors.ERR_EVENT_PERMIT_NOT_FOUND
          - validations.priority_16
          - validations.priority_18
        distinguishing_aspect: "Path parameters are resolved before body foreign keys, so a request with BOTH unknown returns the path-parameter 404 (ERR_KEG_ASSET_NOT_FOUND); with a real keg and an unknown body FK the very same endpoint returns ERR_PACKAGING_RUN_NOT_FOUND instead. Every other entity follows the same two-step shape, and each single-entity GET names its own code rather than a generic 404."
        test_recipe:
          setup:
            - "Brewery ACTIVE. KEG-0001 exists and is EMPTY_DIRTY. No PackagingRun exists at all."
            - "00000000-0000-4000-8000-000000000000 is used as the well-formed but unknown UUID."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /keg-assets"
              payload: { keg_serial: "KEG-0001", size_bbl: 0.5 }
              as: CellarOperator
              captures: { keg_id: $.data.id }
          trigger:
            - call: "GET /packaging-runs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CellarOperator
              captures: { err_run_get: $.data.error_id }
            - call: "POST /keg-assets/00000000-0000-4000-8000-000000000000/fill"
              payload: { packaging_run_id: "00000000-0000-4000-8000-000000000000" }
              as: CellarOperator
              captures: { err_path_first: $.data.error_id }
            - call: "POST /keg-assets/${keg_id}/fill"
              payload: { packaging_run_id: "00000000-0000-4000-8000-000000000000" }
              as: CellarOperator
              captures: { err_body_fk: $.data.error_id }
            - call: "GET /batches/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CellarOperator
              captures: { err_batch: $.data.error_id }
            - call: "GET /state-licenses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err_license: $.data.error_id }
            - call: "GET /distributor-appointments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err_appointment: $.data.error_id }
            - call: "GET /distribution-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BreweryAdmin
              captures: { err_order: $.data.error_id }
            - call: "GET /excise-reports/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BreweryAdmin
              captures: { err_report: $.data.error_id }
            - call: "GET /event-permits/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { err_permit: $.data.error_id }
          assert:
            - "First call: HTTP 404 with error_id == ERR_PACKAGING_RUN_NOT_FOUND"
            - "Second call: HTTP 404 with error_id == ERR_KEG_ASSET_NOT_FOUND (the path parameter is checked first)"
            - "Third call: HTTP 404 with error_id == ERR_PACKAGING_RUN_NOT_FOUND (body foreign key)"
            - "The six single-entity reads each return HTTP 404 with their own code: ERR_BATCH_NOT_FOUND, ERR_STATE_LICENSE_NOT_FOUND, ERR_APPOINTMENT_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_REPORT_NOT_FOUND, ERR_EVENT_PERMIT_NOT_FOUND"
            - "No 404 is ever answered with a generic code and no read leaks an empty 200 envelope"
            - "KegAsset.${keg_id}.state == EMPTY_DIRTY and packaging_run_id is null throughout"

      - name: volume_guards_reject_an_over_capacity_yield_and_an_over_batch_run
        claim_type: Triggerable
        grounds:
          - errors.ERR_TANK_CAPACITY_EXCEEDED
          - errors.ERR_UNITS_EXCEED_BATCH_VOLUME
          - validations.priority_56
        distinguishing_aspect: "Two different volume ceilings on one production chain: the tank's capacity_bbl at conditioning and the batch's remaining_bbl at run completion. Each refusal leaves the run PLANNED and the batch's packaged_bbl at 0.000, so neither near-miss consumes volume."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT; tank FV-01 with capacity_bbl 30.00; batch B-1001 BREWING."
            - "One run R-2 with units_planned 40 (HALF_BBL_KEG, 0.5 bbl per unit) is prepared on the conditioned batch, i.e. 20.000 bbl of intent against a 16.000 bbl yield."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
          trigger:
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 31.000 }
              as: CellarOperator
              captures: { err_capacity: $.data.error_id }
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-2", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 40, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run2_id: $.data.id }
            - call: "POST /packaging-runs/${run2_id}/complete"
              payload: { units_produced: 40 }
              as: CellarOperator
              captures: { err_batch_volume: $.data.error_id }
          assert:
            - "Conditioning at 31.000: HTTP 422 with error_id == ERR_TANK_CAPACITY_EXCEEDED, batch stays BREWING with actual_yield_bbl null"
            - "Conditioning at 16.000: HTTP 200, state CONDITIONING, actual_yield_bbl 16.000, remaining_bbl 16.000"
            - "Completing R-2 with 40 units (20.000 bbl against 16.000 remaining): HTTP 422 with error_id == ERR_UNITS_EXCEED_BATCH_VOLUME"
            - "PackagingRun.${run2_id}.state == PLANNED with bbl_removed 0.000 and removed_at_utc null"
            - "Batch.${batch_id}.packaged_bbl == 0.000, remaining_bbl == 16.000, state == CONDITIONING"

      - name: keg_float_guards_reject_a_size_mismatch_an_exhausted_run_an_untapped_pour_and_an_oversized_return
        claim_type: Triggerable
        grounds:
