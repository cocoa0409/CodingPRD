              as: LaborRelationsDirector
              as_user_id: "u_dir_1"
              captures: { cc_meeting: $.data.id }
            - call: "POST /labor-relations/campaign-communications"
              payload: { petition_id: "${pet_id}", channel: "EMAIL", audience_scope: "UNIT_WIDE", planned_delivery_at: "2026-08-25T10:00:00Z", message_summary: "Written version of the same briefing", threat_statement_count: 0, contains_interrogation: false, contains_promise_of_benefit: false, contains_surveillance_reference: false, material_claim_count: 3, unsupported_material_claim_count: 1 }
              as: LaborRelationsDirector
              as_user_id: "u_dir_1"
              captures: { cc_email: $.data.id }
            - call: "POST /labor-relations/campaign-communications/${cc_meeting}/accuracy-review"
              payload: { material_claim_count: 3, unsupported_material_claim_count: 1 }
              as: HRDataAnalyst
            - call: "POST /labor-relations/campaign-communications/${cc_email}/accuracy-review"
              payload: { material_claim_count: 3, unsupported_material_claim_count: 1 }
              as: HRDataAnalyst
          trigger:
            - call: "POST /labor-relations/campaign-communications/${cc_meeting}/submit-for-review"
              payload: {}
              as: LaborRelationsDirector
              as_user_id: "u_dir_1"
            - call: "POST /labor-relations/campaign-communications/${cc_email}/submit-for-review"
              payload: {}
              as: LaborRelationsDirector
              as_user_id: "u_dir_1"
            - call: "POST /labor-relations/supervisors/${sup_a}/train"
              payload: { modules_completed: ["TIPS_BOUNDARIES", "PROHIBITED_CONDUCT", "SOLICITATION_RULES"], quiz_score: 80 }
              as: SupervisorTrainer
            - call: "POST /labor-relations/campaign-communications/${cc_meeting}/submit-for-review"
              payload: {}
              as: LaborRelationsDirector
              as_user_id: "u_dir_1"
          assert:
            - "first trigger call: 409 ERR_PRESENTER_NOT_TRAINED and CampaignCommunication.${cc_meeting}.status stays DRAFT"
            - "second trigger call: 200 and CampaignCommunication.${cc_email}.status == PENDING_LEGAL_REVIEW (the same untrained supervisor's petition, but a non-meeting channel is ungated)"
            - "third trigger call: Supervisor.${sup_a}.training_status == TRAINED, quiz_score == 80 (exactly TRAINING_PASS_SCORE passes), training_attempt_count == 2, certified_at == 2026-08-12T09:00:00Z"
