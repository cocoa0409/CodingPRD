          - state_machines.MatchingGift.REQUESTED_to_FINALIZED
          - entities.Employee.fields.match_consumed_ytd_cents
          - entities.Campaign.fields.raised_cents
        distinguishing_aspect: |
          Depth-3 chain triggered by Donation settle: Donation AUTHORIZED->SETTLED (A) causes the linked
          MatchingGift REQUESTED->FINALIZED (B), and that FINALIZED transition (B) causes Employee
          match_consumed_ytd_cents to be debited (C). Each link is caused by the prior link, not by the
          settle action directly.
        test_recipe:
          setup:
            - "ACTIVE program (match_ratio 0.5, cap 100000); APPROVED charity; LIVE campaign; ACTIVE employee"
            - "AUTHORIZED donation base 40000 with a REQUESTED MatchingGift"
