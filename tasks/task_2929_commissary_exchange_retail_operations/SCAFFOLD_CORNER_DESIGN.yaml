            - "ShopperDelegation.${delegation_id}.status == ACTIVE — an out-of-window sale does not change the grant"
            - "GET /sales with store_id == ${store_id} returns total_count == 0"
            - "Patron.${delegate_id}.card_status == VALID"

      - name: corner_delegation_status_check_precedes_window_check
        claim_type: cascading_validation
        grounds:
          - validations.priority_23_ERR_DELEGATION_NOT_ACTIVE
          - validations.priority_36_ERR_DELEGATION_WINDOW_NOT_COVERING
          - state_machines.ShopperDelegation.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          With the SAME out-of-window geometry as the covering case but the grant
          revoked first, the sale-open call reports ERR_DELEGATION_NOT_ACTIVE, not
          ERR_DELEGATION_WINDOW_NOT_COVERING: the temporal check only runs on a
          delegation that already survived the status check, so the two errors are
          ordered rather than concurrent.
        test_recipe:
          setup:
            - "Same fixture as the out-of-window case: window [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z), clock at 2026-08-05T00:00:00Z."
            - "The delegation is REVOKED before the trigger, so BOTH priority 23 and priority 36 are violated."
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Fort Gordon Commissary", channel: "COMMISSARY", region: "CONUS", surcharge_rate_bp: 500 }
              as: SurchargeFundController
              captures: { store_id: $.data.id }
            - call: "POST /patrons"
