        distinguishing_aspect: "The loyalty view returns a posting_count alongside the balance, so two accepted postings of 400 and 800 read as balance 1200 with count 2."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One program with loyalty_link_enabled, one account and one transaction."
          setup_api_calls:
            - *c_clock
            - *c_partner_b
            - *c_agreement
            - *c_neg
            - *c_exec
            - *c_program
            - *c_app
            - *c_decide
            - *c_acct
