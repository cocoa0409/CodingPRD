    roles: [ProjectManager]
    code: 201
    input: [project_id, estimate_id]
    output: MaterialOrder
    side_effects: ["create MaterialOrder PLACED", "compute ordered_sqft (calc material_order_qty)", "Project workflow_status -> ORDERED"]
  - method: GET
    path: "/material-orders/{id}"
    description: "Fetch a MaterialOrder."
    roles: [ProjectManager, FinanceOfficer]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: []
  - method: GET
    path: "/material-orders"
    description: "List material orders. Reverse-reachability for MaterialOrder.project_id and MaterialOrder.estimate_id."
    roles: [ProjectManager, FinanceOfficer]
    code: 200
    input: ["project_id?", "estimate_id?", "limit?", "offset?"]
    output: MaterialOrder[]
    side_effects: []
  - method: POST
    path: "/material-orders/{id}/confirm"
    description: "Confirm an order with a delivery ETA."
    roles: [ProjectManager]
    code: 200
    input: [delivery_eta_iso]
