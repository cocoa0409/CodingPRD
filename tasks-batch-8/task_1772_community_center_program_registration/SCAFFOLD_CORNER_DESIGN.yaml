  # ---- corners already exercised by 1.8 difficulty instances (stubs) ----
  - section: state_machines_stubs
    instances:
      - name: waitlist_promotion_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.Registration.WAITLISTED_to_ENROLLED]
        excluded_because:
          difficulty_instance: voluntary_drop_promotion_chain
          rationale: "Promotion side effects (promoted_at, payment_due_at, count handoff) asserted hop-by-hop in the named 1.8 instance."
      - name: minimum_enrollment_cancellation_cascade
        claim_type: cascade_down
        grounds: [state_machines.ClassSession.PUBLISHED_to_CANCELLED]
        excluded_because:
          difficulty_instance: sweep_min_enrollment_cancellation_chain
          rationale: "Full cascade (registrations, refunds, credit, contract) asserted in the named 1.8 instance."
      - name: scholarship_approval_commits_budget
        claim_type: side_effect_execution
        grounds: [state_machines.ScholarshipApplication.UNDER_REVIEW_to_APPROVED]
        excluded_because:
          difficulty_instance: scholarship_review_cycle
          rationale: "Approval side effects (approved_pct, decided_by, committed += commitment) asserted at the end of the named 1.8 cycle instance."
      - name: voluntary_refund_tier_side_effects
        claim_type: correct_result
        grounds: [calculations.registration_refund]
        excluded_because:
          difficulty_instance: refund_voluntary_vs_admin_cancellation
          rationale: "50%-tier voluntary refund and 100% admin refund both asserted with literal values in the named 1.8 instance; the 100%/boundary tiers are asserted in refund_first_meeting_start_boundary."
