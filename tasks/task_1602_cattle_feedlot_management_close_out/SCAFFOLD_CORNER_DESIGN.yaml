      - name: ship_from_open_lot_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Lot.MARKETED_to_SHIPPED, "errors[ERR_LOT_NOT_MARKETED]"]
        excluded_because:
          difficulty_instance: ship_state_precondition_beats_withdrawal_safety
          rationale: "The §1.8 priority-conflict instance asserts ERR_LOT_NOT_MARKETED when shipping an OPEN lot (its setup also leaves a withdrawal active, which is what makes it a priority test)."

      - name: claim_pay_after_invoice_credits_owner_balance
        claim_type: side_effect_execution
        grounds: [state_machines.InsuranceClaim.APPROVED_to_PAID]
        distinguishing_aspect: "Pay-branch selection: when the lot already has an OPEN invoice at pay time, the recovery credits Owner.outstanding_balance_cents directly (140000 -> 90000) instead of parking on the lot."
        test_recipe:
          setup: ["Lot L-SM21 (2 heifers, purchase 280000c, arrival 2026-08-01); insured death of 1 head on 2026-08-02 (value 140000c: zero accrued costs, no pen assignments); claim 50000c approved but unpaid; lot marketed, shipped 2026-08-03 (1 head, 700 lbs); close-out confirmed -> OPEN invoice 140000c (death charge only); clock 2026-08-10"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: FeedyardManager
            - call: "POST /feedlot/owners"
              payload: { owner_name: "O-SM21", billing_email: "sm21@x.com" }
              as: FeedyardManager
              captures: { o_id: $.data.id }
            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-SM21", sex_class: "HEIFER", head_count_in: 2, in_weight_total_lbs: 1400, purchase_cost_cents: 280000, arrival_date: "2026-08-01" }
              as: FeedyardManager
              captures: { l_id: $.data.id }
            - call: "POST /feedlot/death-losses"
              payload: { lot_id: "${l_id}", loss_date: "2026-08-02", head_count: 1, cause: "RESPIRATORY", insured: true }
              as: CattleHealthTech
              captures: { d_id: $.data.id }
            - call: "POST /feedlot/insurance-claims"
              payload: { death_loss_id: "${d_id}", claimed_amount_cents: 50000 }
              as: CattleHealthTech
              captures: { c_id: $.data.id }
            - call: "POST /feedlot/insurance-claims/${c_id}/decide"
              payload: { decision: "APPROVE" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /feedlot/lots/${l_id}/market"
              as: FeedyardManager
            - call: "POST /feedlot/lots/${l_id}/ship"
              payload: { ship_date: "2026-08-03", out_weight_total_lbs: 700 }
              as: FeedyardManager
              captures: { lot_v: $.data.version }
            - call: "POST /feedlot/close-outs"
              payload: { lot_id: "${l_id}", pricing_basis: "PER_CARCASS", grid_base_price_cents_per_cwt: 19000, expected_lot_version: "${lot_v}" }
              as: RiskManager
              captures: { co_id: $.data.id }
            - call: "POST /feedlot/close-outs/${co_id}/confirm"
              payload:
                carcass_records:
                  - { hot_carcass_weight_lbs: 450, quality_grade: "CHOICE", yield_grade: 3 }
              as: RiskManager
            - call: "GET /feedlot/owners/${o_id}"
              as: Any
              captures: { bal1: $.data.outstanding_balance_cents }
          trigger:
            - call: "POST /feedlot/insurance-claims/${c_id}/pay"
              as: ClaimsTreasurer
              as_user_id: "tre-1"
              captures: { c_status: $.data.status }
            - call: "GET /feedlot/owners/${o_id}"
              as: Any
              captures: { bal2: $.data.outstanding_balance_cents }
          assert:
            - "bal1 == 140000 (invoice total: death charge 140000, no credit yet because the claim was not PAID at confirm)"
            - "c_status == PAID"
            - "bal2 == 90000 (direct credit: 140000 - min(50000, 140000))"

      - name: death_loss_void_with_open_claim_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.DeathLoss.RECORDED_to_VOIDED", "errors[ERR_VOID_BLOCKED_BY_CLAIMS]"]
        distinguishing_aspect: "Referential guard on the compensating action: a death loss referenced by an InsuranceClaim (any status) cannot be voided — ERR_VOID_BLOCKED_BY_CLAIMS."
        test_recipe:
          setup: ["Lot L-VD1 with an insured death loss (1 head, 2026-08-01) and an UNDER_REVIEW claim against it"]
          setup_api_calls:
            - call: "POST /feedlot/owners"
