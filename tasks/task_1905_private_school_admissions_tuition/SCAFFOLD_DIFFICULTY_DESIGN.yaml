            - { call: "POST /admissions/cycles/${cyc}/run-sweep", payload: {}, as: AdmissionDirector }
          assert:
            - "Hop 1: EnrollmentContract.${conA}.status == LAPSED (response_due_at 2026-11-16T00:00:00Z < clock)"
            - "Hop 2: Application.${appA}.status == EXPIRED"
            - "Hop 3: AidApplication.${aidA}.award_status == RELEASED and GET cycle shows aid_committed_cents == 0 (was 1,820,000 after accept)"
            - "Hop 4: Application.${appB}.status == OFFERED, promoted_from_waitlist == true, offer_expires_at == 2026-11-24T00:00:00Z (sweep clock + 7 days)"
            - "GradeSection.${sec}.seats_held == 1 (the freed seat is immediately re-held by the promoted offer)"
            - "Sweep response: lapsed_contract_count == 1 and promoted_application_ids contains ${appB}"

      - name: deposit_payment_enrollment_cascade
        grounds:
          - state_machines.EnrollmentContract.SIGNED_to_ENROLLED
          - state_machines.Application.CONTRACT_ISSUED_to_ENROLLED
          - entities.Student.fields.source
          - calculations.seat_ledger
        distinguishing_aspect: |
          Depth-3 cascade triggered by a deposit payment (distinct trigger from the
          sweep instance): payment crossing the deposit threshold flips the contract to
          ENROLLED (hop 1) -> the application flips to ENROLLED (hop 2) -> a Student row
          is created with source=ADMISSION (hop 3), which itself feeds future
          sibling_verified computations for the family.
        test_recipe:
          setup:
            - "OPEN cycle, G9 section capacity 1 tuition 3,000,000 pct 1.0; fam-a EARLY application composite 84.0, no aid"
            - "Clock 2026-11-02; close EARLY -> OFFERED; issue-contract -> deposit_amount_cents 300,000, response_due_at 2026-11-16"
