              captures: { series_a_id: $.data.id }
            - call: "POST /trial-series/${series_a_id}/entries"
              payload: { line_id: "${line_a_id}", trial_site_id: "${site_id}", plot_count: 51, planting_window_start: "2027-04-01", planting_window_end: "2027-08-31" }
              as: TrialAgronomist
              captures: { e_a: $.data.id }
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_1", season_year: 2027, plot_design: "RCBD", replication_count: 3, min_locations: 1 }
              as: TrialAgronomist
              captures: { series_b_id: $.data.id }
            - call: "POST /trial-series"
              payload: { program_id: "${prog_id}", stage: "STAGE_2", season_year: 2027, plot_design: "RCBD", replication_count: 3, min_locations: 1 }
              as: TrialAgronomist
