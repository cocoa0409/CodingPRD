  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "A request without X-User-ID / X-User-Role fails with 401 ERR_UNAUTHENTICATED before any role, existence, or state check runs."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /channels"
              payload: {}
              as: Anonymous_missing_headers
              captures: { err: $.data.error_id }
          assert:
            - "response status is 401 and err == ERR_UNAUTHENTICATED"

      - name: invalid_enum_value_returns_invalid_request
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "category \"MOVIES\" is not in {VIDEO, AUDIO, GAME, NEWS, KIDS}; the create fails with 400 ERR_INVALID_REQUEST and no channel is persisted."
        test_recipe:
          setup:
            - "Publisher P exists."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Enum Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
          trigger:
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Bad Enum", category: "MOVIES", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST with http 400"
            - "GET /channels?publisher_id=${pub} returns 0 rows"

      - name: grant_duplicate_period_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors.ERR_GRANT_PERIOD_DUPLICATE
        distinguishing_aspect: "A second OPEN grant for the same channel and period 2026-09 fails with 409 ERR_GRANT_PERIOD_DUPLICATE; a different period (2026-10) on the same channel succeeds."
        test_recipe:
          setup:
            - "Publisher P, channel C PUBLISHED, grant for 2026-09 created."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Dup Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Dup Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /ad-slot-grants"
              payload: { channel_id: "${ch}", period: "2026-09", total_slots: 100 }
              as: PlatformAdmin
          trigger:
            - call: "POST /ad-slot-grants"
              payload: { channel_id: "${ch}", period: "2026-09", total_slots: 200 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /ad-slot-grants"
              payload: { channel_id: "${ch}", period: "2026-10", total_slots: 200 }
              as: PlatformAdmin
              captures: { g2: $.data.id }
          assert:
            - "err == ERR_GRANT_PERIOD_DUPLICATE with http 409"
            - "AdSlotGrant.${g2} created 201 — uniqueness is scoped to (channel, period), not channel alone"

      - name: duplicate_serial_rejected_across_manufacturers
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors.ERR_DUPLICATE_SERIAL
        distinguishing_aspect: "serial_number is globally unique: a second unit with serial 'GLOBAL-1' fails with 409 ERR_DUPLICATE_SERIAL even when created by a different manufacturer for a different model."
        test_recipe:
          setup:
            - "Two manufacturers MA, MB each with a CERTIFIED model; MA has unit serial GLOBAL-1."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "MA TV", royalty_per_device_cents: 300 }
              as: PlatformAdmin
              captures: { ma: $.data.id }
            - call: "POST /manufacturers"
              payload: { legal_name: "MB TV", royalty_per_device_cents: 300 }
              as: PlatformAdmin
              captures: { mb: $.data.id }
            - call: "POST /device-models"
              payload: { manufacturer_id: "${ma}", model_code: "A-1", recovery_policy: "MONETIZATION" }
              as: TvManufacturer
              as_user_id: "${ma}"
              captures: { moda: $.data.id }
            - call: "POST /device-models"
              payload: { manufacturer_id: "${mb}", model_code: "B-1", recovery_policy: "MONETIZATION" }
              as: TvManufacturer
              as_user_id: "${mb}"
              captures: { modb: $.data.id }
            - call: "POST /device-models/${moda}/lab-bookings"
              payload: { bench_code: "B1", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T08:00:00Z" }
              as: TvManufacturer
              as_user_id: "${ma}"
            - call: "POST /device-models/${modb}/lab-bookings"
              payload: { bench_code: "B2", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-01T08:00:00Z" }
              as: TvManufacturer
              as_user_id: "${mb}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /device-models/${moda}/certify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-models/${modb}/certify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /device-units"
              payload: { device_model_id: "${moda}", serial_number: "GLOBAL-1", hardware_cost_cents: 9000, sale_price_cents: 9000 }
              as: TvManufacturer
              as_user_id: "${ma}"
          trigger:
            - call: "POST /device-units"
              payload: { device_model_id: "${modb}", serial_number: "GLOBAL-1", hardware_cost_cents: 9000, sale_price_cents: 9000 }
              as: TvManufacturer
              as_user_id: "${mb}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_SERIAL with http 409"

      - name: review_while_in_review_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors.ERR_REVIEW_IN_PROGRESS
        distinguishing_aspect: "With version 1.0.0 IN_REVIEW, submitting version 1.0.1 fails with 409 ERR_REVIEW_IN_PROGRESS — supersede is only legal against a SUBMITTED (not yet picked-up) version."
        test_recipe:
          setup:
            - "Publisher P, channel C with version V1 IN_REVIEW."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Rev Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Rev Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v0: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v0}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { v1: $.data.id }
            - call: "POST /channel-versions/${v1}/review"
              payload: {}
              as: PlatformAdmin
            - call: "GET /channels/${ch}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch_v1: $.data.version }
          trigger:
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.1", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v1}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_REVIEW_IN_PROGRESS with http 409"
            - "ChannelVersion.${v1}.review_status == IN_REVIEW (not superseded)"

      - name: personalized_impression_on_opted_out_viewer_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors.ERR_PRIVACY_OPTED_OUT
        distinguishing_aspect: "A PERSONALIZED-targeted impression batch naming a viewer whose ad_consent is OPTED_OUT fails with 422 ERR_PRIVACY_OPTED_OUT; after the viewer opts in via PATCH privacy, the identical batch succeeds — the privacy control is live, not a creation-time snapshot."
        test_recipe:
          setup:
            - "Publisher P, channel PUBLISHED, campaign K ACTIVE with targeting_mode PERSONALIZED, budget 100000. Viewer V with default consent NON_PERSONALIZED, later PATCHed to OPTED_OUT for the negative probe."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Priv Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Priv Channel", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 100000, targeting_mode: "PERSONALIZED" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k: $.data.id }
            - call: "POST /campaigns/${k}/schedule"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /campaigns/${k}/start"
              payload: {}
              as: AdOps
            - call: "POST /viewer-accounts"
              payload: { email: "priv@x.com", ad_consent: "OPTED_OUT" }
              as: PlatformAdmin
              captures: { vw: $.data.id }
          trigger:
            - call: "POST /campaigns/${k}/impressions"
              payload: { impression_count: 100, cpm_cents: 1000, viewer_id: "${vw}" }
              as: AdOps
              captures: { err: $.data.error_id }
            - call: "PATCH /viewer-accounts/${vw}/privacy"
              payload: { ad_consent: "PERSONALIZED" }
              as: Viewer
              as_user_id: "${vw}"
            - call: "POST /campaigns/${k}/impressions"
              payload: { impression_count: 100, cpm_cents: 1000, viewer_id: "${vw}" }
              as: AdOps
          assert:
            - "err == ERR_PRIVACY_OPTED_OUT with http 422 (OPTED_OUT viewer blocks personalized measurement)"
            - "After PATCH to PERSONALIZED: the identical impression call succeeds and AdCampaign.${k}.spent_cents == 100 and impressions_delivered == 100"

      - name: statement_dispute_requires_finalized_state
        claim_type: violation_to_error
        grounds:
          - state_machines.RevenueStatement
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "POST /statements/{id}/disputes on an OPEN (provisional) statement fails with 409 ERR_INVALID_STATE; only FINALIZED statements can be disputed."
        test_recipe:
          setup:
            - "Publisher P with an OPEN statement for 2026-09 (generated, not finalized)."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Dsp Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /statements/generate"
              payload: { period: "2026-09" }
              as: PlatformAdmin
            - call: "GET /statements"
              payload: { publisher_id: "${pub}", period: "2026-09" }
              as: PlatformAdmin
              captures: { st: "$.data[0].id" }
          trigger:
            - call: "POST /statements/${st}/disputes"
              payload: { reason: "premature" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE with http 409"
            - "RevenueStatement.${st}.status == OPEN (unchanged)"

      - name: appeal_after_seven_day_window_expires
        claim_type: violation_to_error
        grounds:
          - state_machines.Dispute.DECIDED_to_APPEALED
          - errors.ERR_APPEAL_WINDOW_EXPIRED
        distinguishing_aspect: "Appeal boundary: decided 2026-09-01T00:00:00Z, appeal at decided_at + 7 days exactly (2026-09-08T00:00:00Z) is allowed (inclusive), while 2026-09-09 fails with ERR_APPEAL_WINDOW_EXPIRED."
        test_recipe:
          setup:
            - "Publisher P with REMOVED channel C; dispute D1 decided UPHELD at clock 2026-09-01; dispute D2 (second removal dispute on the same decision trail is not possible, so D2 belongs to a second REMOVED channel C2) decided UPHELD at 2026-09-01 and appealed late."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "App Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "App C1", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { c1: $.data.id, c1_v: $.data.version }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "App C2", category: "VIDEO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { c2: $.data.id, c2_v: $.data.version }
            - call: "POST /channels/${c1}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${c1_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { v1: $.data.id }
            - call: "POST /channels/${c2}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: true, drm: true, trick_play: true }, expected_channel_version: "${c2_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { v2: $.data.id }
            - call: "POST /channel-versions/${v1}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${v1}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channel-versions/${v2}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${v2}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${c1}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channels/${c2}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channels/${c1}/remove"
              payload: { reason: "policy" }
              as: PlatformAdmin
            - call: "POST /channels/${c2}/remove"
              payload: { reason: "policy" }
              as: PlatformAdmin
            - call: "POST /disputes"
              payload: { publisher_id: "${pub}", subject_type: "CHANNEL_REMOVAL", channel_id: "${c1}", reason: "d1" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { d1: $.data.id }
            - call: "POST /disputes"
              payload: { publisher_id: "${pub}", subject_type: "CHANNEL_REMOVAL", channel_id: "${c2}", reason: "d2" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { d2: $.data.id }
            - call: "POST /disputes/${d1}/triage"
              payload: {}
              as: PlatformAdmin
            - call: "POST /disputes/${d1}/request-evidence"
              payload: {}
              as: PlatformAdmin
            - call: "POST /disputes/${d1}/decide"
              payload: { decision: "UPHELD" }
              as: PlatformAdmin
            - call: "POST /disputes/${d2}/triage"
              payload: {}
              as: PlatformAdmin
            - call: "POST /disputes/${d2}/request-evidence"
              payload: {}
              as: PlatformAdmin
            - call: "POST /disputes/${d2}/decide"
              payload: { decision: "UPHELD" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /disputes/${d1}/appeal"
              payload: { reason: "on the boundary" }
              as: Publisher
              as_user_id: "${pub}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /disputes/${d2}/appeal"
              payload: { reason: "one day late" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: $.data.error_id }
          assert:
            - "Dispute.${d1}.status == APPEALED (appeal at exactly decided_at + 7 days is within the inclusive window)"
            - "err == ERR_APPEAL_WINDOW_EXPIRED with http 409 and Dispute.${d2}.status == DECIDED"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: booking_with_unknown_campaign_returns_not_found
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/placement-bookings
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A placement booking whose campaign_id does not exist fails existence validation (404 ERR_NOT_FOUND) before any state, safety, temporal, or fiscal check runs."
        test_recipe:
          setup:
            - "Publisher P exists."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Fk Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
          trigger:
            - call: "POST /placement-bookings"
              payload: { campaign_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", slot_code: "HOME_ROW_1", window_start: "2026-09-10T09:00:00Z", window_end: "2026-09-10T12:00:00Z" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { err: $.data.error_id }
          assert:
            - "response status is 404 and err == ERR_NOT_FOUND"

      - name: campaign_get_returns_pacing_and_measurement_fields
        claim_type: computed_read
        grounds:
          - endpoints.GET_/campaigns/{id}
          - entities.AdCampaign.fields.pacing_delta_cents
        distinguishing_aspect: "The campaign read model includes the derived measurement fields spent_cents, impressions_delivered, expected_spend_cents and pacing_delta_cents alongside stored fields."
        test_recipe:
          setup:
            - "Publisher P, channel PUBLISHED, campaign K DRAFT with budget 40000 and flight covering September."
          setup_api_calls:
            - call: "POST /publishers"
              payload: { legal_name: "Read Pub", default_ad_share_bps: 7000, billing_model: "GROSS_SHARE" }
              as: PlatformAdmin
              captures: { pub: $.data.id }
            - call: "POST /channels"
              payload: { publisher_id: "${pub}", name: "Read Channel", category: "AUDIO", content_rating: "G" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ch: $.data.id, ch_v: $.data.version }
            - call: "POST /channels/${ch}/versions"
              payload: { version_label: "1.0.0", technical_checklist: { deep_linking: false, drm: false, trick_play: false }, expected_channel_version: "${ch_v}" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { ver: $.data.id }
            - call: "POST /channel-versions/${ver}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /channel-versions/${ver}/decide"
              payload: { outcome: "PASS" }
              as: PlatformAdmin
            - call: "POST /channels/${ch}/publish"
              payload: {}
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { publisher_id: "${pub}", channel_id: "${ch}", flight_start: "2026-09-01T00:00:00Z", flight_end: "2026-09-30T00:00:00Z", budget_cents: 40000, targeting_mode: "CONTEXTUAL" }
              as: Publisher
              as_user_id: "${pub}"
              captures: { k: $.data.id }
          trigger:
            - call: "GET /campaigns/${k}"
              payload: {}
              as: Publisher
              as_user_id: "${pub}"
          assert:
            - "response data carries spent_cents == 0, impressions_delivered == 0, expected_spend_cents == 0, pacing_delta_cents == 0"
            - "AdCampaign.${k}.status == DRAFT and budget_cents == 40000"

  # ===========================================================================
  - section: errors
    instances:
      - name: budget_exhausted_rejects_overspending_impression_batch
        claim_type: violation_to_error
        grounds:
