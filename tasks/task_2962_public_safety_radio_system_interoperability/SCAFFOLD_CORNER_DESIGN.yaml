            - "trigger[0] returns HTTP 200 and ProgrammingChangeRequest.${cr_bub_id}.status == DEPLOYED (not DEPLOYING)"
            - "ProgrammingChangeRequest.${cr_bub_id}.deployed_unit_count == 1 and failed_unit_count == 1"
            - "ProgrammingChangeRequest.${cr_bub_id}.deployment_started_at == \"2026-08-02T00:00:00Z\" and deployed_at == \"2026-08-02T00:00:00Z\""
            - "SubscriberUnit.${unit_bub1}.template_id == ${tpl_bub_id} and SubscriberUnit.${unit_bub2}.template_id == ${tpl_bub_id} (the SUSPENDED unit's template_id is left unchanged, and it already pointed at this template)"

      - name: talkgroup_unlock_after_key_compromise_requires_a_keyed_radio
        claim_type: guarded_transitions
        grounds:
          - state_machines.Talkgroup.LOCKED_to_ACTIVE
          - state_machines.Keyset.ACTIVE_to_COMPROMISED
          - validations[priority=14]
          - errors.ERR_KEYSET_NOT_ACTIVE
        distinguishing_aspect: "UNLOCK of a KEY_COMPROMISE-locked talkgroup is guarded by the state of a different entity: it returns HTTP 409 ERR_KEYSET_NOT_ACTIVE while the agency's only radio is KEY_STALE, and returns 200 once a fresh keyset has been loaded onto that radio by OTAR."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Agency GRD owns one ASSIGNED unit rekeyed onto ACTIVE keyset KS-GUARD-1 and one ENCRYPTED talkgroup."
            - "KS-GUARD-1 is then declared COMPROMISED, which sets the unit KEY_STALE and locks the talkgroup with lock_reason KEY_COMPROMISE."
            - "A second keyset KS-GUARD-2 is created and approved but not yet loaded."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Guarded Transition Agency", agency_code: "GRD01", agency_type: "LAW", recorder_retention_days: 180 }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { agency_grd_id: "$.data.id" }
            - call: "POST /radio-system/sites"
              payload: { site_code: "GRD-1", name: "Guard One", channel_capacity: 6, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_grd_id: "$.data.id" }
            - call: "POST /radio-system/templates"
              payload: { template_name: "GRD-BASE-1", target_standard: "P25_PHASE2", talkgroup_slot_count: 4, encryption_required: true }
              as: FleetEngineer
              as_user_id: "fe-1"
              captures: { tpl_grd_id: "$.data.id" }
            - call: "POST /radio-system/templates/${tpl_grd_id}/publish"
              payload: {}
              as: FleetEngineer
              as_user_id: "fe-1"
            - call: "POST /radio-system/talkgroups"
              payload: { owner_agency_id: "${agency_grd_id}", home_site_id: "${site_grd_id}", alias: "GRD-SEC", tg_decimal_id: 1101, kind: "TACTICAL", encryption_mode: "ENCRYPTED" }
              as: AgencyRadioManager
              as_user_id: "${agency_grd_id}"
              captures: { tg_grd_id: "$.data.id" }
            - call: "POST /radio-system/units"
              payload: { agency_id: "${agency_grd_id}", serial_number: "GRD0001", radio_id: 26001, model: "PORTABLE" }
              as: AgencyRadioManager
              as_user_id: "${agency_grd_id}"
              captures: { unit_grd_id: "$.data.id" }
            - call: "POST /radio-system/units/${unit_grd_id}/lifecycle"
              payload: { action: "ASSIGN", template_id: "${tpl_grd_id}" }
              as: AgencyRadioManager
              as_user_id: "${agency_grd_id}"
            - call: "POST /radio-system/keysets"
              payload: { keyset_name: "KS-GUARD-1", algorithm: "AES256", crypto_period_start: "2026-08-01T00:00:00Z", crypto_period_end: "2026-11-01T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { keyset_grd1_id: "$.data.id" }
            - call: "POST /radio-system/keysets/${keyset_grd1_id}/approval"
              payload: { decision: "APPROVE" }
              as: SecurityOfficer
              as_user_id: "so-1"
            - call: "POST /radio-system/otar-campaigns"
              payload: { keyset_id: "${keyset_grd1_id}", agency_id: "${agency_grd_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { campaign_grd1_id: "$.data.id" }
            - call: "POST /radio-system/otar-campaigns/${campaign_grd1_id}/execute"
              payload: {}
              as: KeyCustodian
              as_user_id: "kc-1"
            - call: "POST /radio-system/keysets/${keyset_grd1_id}/compromise"
              payload: {}
              as: SecurityOfficer
              as_user_id: "so-1"
            - call: "POST /radio-system/keysets"
              payload: { keyset_name: "KS-GUARD-2", algorithm: "AES256", crypto_period_start: "2026-08-01T00:00:00Z", crypto_period_end: "2026-11-01T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { keyset_grd2_id: "$.data.id" }
            - call: "POST /radio-system/keysets/${keyset_grd2_id}/approval"
              payload: { decision: "APPROVE" }
              as: SecurityOfficer
              as_user_id: "so-1"
          trigger:
            - call: "POST /radio-system/talkgroups/${tg_grd_id}/status"
              payload: { action: "UNLOCK" }
              as: AgencyRadioManager
              as_user_id: "${agency_grd_id}"
              captures: { guarded_error_id: "$.data.error_id" }
            - call: "POST /radio-system/otar-campaigns"
              payload: { keyset_id: "${keyset_grd2_id}", agency_id: "${agency_grd_id}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }
              as: KeyCustodian
              as_user_id: "kc-1"
              captures: { campaign_grd2_id: "$.data.id" }
            - call: "POST /radio-system/otar-campaigns/${campaign_grd2_id}/execute"
              payload: {}
              as: KeyCustodian
              as_user_id: "kc-1"
            - call: "POST /radio-system/talkgroups/${tg_grd_id}/status"
              payload: { action: "UNLOCK" }
              as: AgencyRadioManager
              as_user_id: "${agency_grd_id}"
          assert:
            - "Baseline after setup: Keyset.${keyset_grd1_id}.status == COMPROMISED and loaded_unit_count == 0; SubscriberUnit.${unit_grd_id}.key_status == KEY_STALE; Talkgroup.${tg_grd_id}.status == LOCKED and lock_reason == KEY_COMPROMISE"
            - "trigger[0] returns HTTP 409 with data.error_id == ERR_KEYSET_NOT_ACTIVE and Talkgroup.${tg_grd_id}.status stays LOCKED"
            - "trigger[2] returns HTTP 200: OtarCampaign.${campaign_grd2_id}.status == COMPLETED, target_unit_count == 1, rekeyed_unit_count == 1, failed_unit_count == 0"
            - "SubscriberUnit.${unit_grd_id}.key_status == KEYED and active_keyset_id == ${keyset_grd2_id}; Keyset.${keyset_grd2_id}.loaded_unit_count == 1"
            - "trigger[3] returns HTTP 200 and Talkgroup.${tg_grd_id}.status == ACTIVE with lock_reason == NONE"

      - name: subscriber_unit_parallel_state_dimensions
        claim_type: parallel
        grounds:
          - state_machines.SubscriberUnit.initial_state
          - entities.SubscriberUnit.fields.provision_status
          - entities.SubscriberUnit.fields.key_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / subscriber_unit_parallel_dimensions_evolve_independently
          rationale: "The parallel-shape claim (provision_status and key_status advance independently and the combined state is correct) is exactly what that §1.8 instance asserts, transition by transition."

      - name: change_request_cyclic_revision_loop
        claim_type: cyclic
        grounds:
          - state_machines.ProgrammingChangeRequest.CHANGES_REQUESTED_to_SUBMITTED
          - validations[priority=37]
        excluded_because:
          difficulty_instance: non_linear_state_machine / change_request_revision_cycle_terminates_at_max_revisions
          rationale: "That §1.8 instance drives the SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED loop and asserts the MAX_REVISIONS termination condition with ERR_REVISION_LIMIT_EXCEEDED."

      - name: keyset_compromise_cascade_down_chain
        claim_type: cascade_down
        grounds:
          - state_machines.Keyset.ACTIVE_to_COMPROMISED
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / keyset_compromise_cascades_five_links_to_patch_release
          rationale: "All five cascade links from the compromise transition, and the fact that only non-terminal children are touched, are asserted end-to-end by that §1.8 instance."

  - section: calculations
    instances:
      - name: coverage_reliability_floors_at_zero_for_zero_coverage
        claim_type: correct_result
        grounds:
          - calculations.site_coverage_reliability
          - endpoints[PATCH /radio-system/sites/{site_id}/coverage]
          - entities.Site.fields.coverage_derate_tier
        distinguishing_aspect: "With covered_test_points 0 of 500 the raw_pct is 0.00, tier C is selected (derate 3.0pp) and the derated value is floored at 0.0 by max(0.0, ...) rather than going negative; coverage_class becomes MARGINAL, not UNRATED, because total_test_points is non-zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Site ZRO-1 with GENERATOR backup and no drive test yet."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "ZRO-1", name: "Zero Coverage One", channel_capacity: 4, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_zro_id: "$.data.id", site_zro_v1: "$.data.version" }
          trigger:
            - call: "PATCH /radio-system/sites/${site_zro_id}/coverage"
              payload: { covered_test_points: 0, total_test_points: 500, expected_site_version: "${site_zro_v1}" }
              as: RFEngineer
              as_user_id: "rf-1"
          assert:
            - "trigger[0] returns HTTP 200"
            - "Site.${site_zro_id}.coverage_reliability_pct == 0.0 (max(0.0, 0.00 - 3.0 - 0.0), never negative)"
            - "Site.${site_zro_id}.coverage_derate_tier == C and coverage_class == MARGINAL"
            - "Site.${site_zro_id}.covered_test_points == 0 and total_test_points == 500"
            - "Site.${site_zro_id}.version == ${site_zro_v1} + 1"

      - name: coverage_class_threshold_at_exactly_ninety_percent
        claim_type: threshold
        grounds:
          - calculations.site_coverage_reliability
          - entities.Site.fields.coverage_class
          - endpoints[PATCH /radio-system/sites/{site_id}/coverage]
        distinguishing_aspect: "GENERAL_MIN_PCT is a >= comparison on the DERATED value: 915/1000 derates to exactly 90.0 and classifies GENERAL, while 914/1000 derates to 89.9 and classifies MARGINAL; both sit in tier B."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; two GENERATOR sites THR-1 and THR-2 with no drive test yet."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/sites"
              payload: { site_code: "THR-1", name: "Threshold One", channel_capacity: 4, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_thr1_id: "$.data.id", site_thr1_v1: "$.data.version" }
            - call: "POST /radio-system/sites"
              payload: { site_code: "THR-2", name: "Threshold Two", channel_capacity: 4, backup_power_type: "GENERATOR" }
              as: SystemAdmin
              as_user_id: "admin-1"
              captures: { site_thr2_id: "$.data.id", site_thr2_v1: "$.data.version" }
          trigger:
            - call: "PATCH /radio-system/sites/${site_thr1_id}/coverage"
              payload: { covered_test_points: 915, total_test_points: 1000, expected_site_version: "${site_thr1_v1}" }
              as: RFEngineer
              as_user_id: "rf-1"
            - call: "PATCH /radio-system/sites/${site_thr2_id}/coverage"
              payload: { covered_test_points: 914, total_test_points: 1000, expected_site_version: "${site_thr2_v1}" }
              as: RFEngineer
              as_user_id: "rf-1"
          assert:
            - "trigger[0] returns HTTP 200; Site.${site_thr1_id}.coverage_reliability_pct == 90.0, coverage_derate_tier == B, coverage_class == GENERAL"
            - "trigger[1] returns HTTP 200; Site.${site_thr2_id}.coverage_reliability_pct == 89.9, coverage_derate_tier == B, coverage_class == MARGINAL"
            - "Neither site is MISSION_CRITICAL (both derated values are below 97.0)"

      - name: governance_standing_read_reports_board_weight_and_quorum
        claim_type: weighted_scoring
        grounds:
          - calculations.governance_vote_weight
          - endpoints[GET /radio-system/agencies/{agency_id}/governance-standing]
        distinguishing_aspect: "Three CURRENT agencies with zero billable units each carry governance_vote_weight 1 (the 1 + floor(0/250) base), so total_eligible_weight is 3 and quorum_weight_required is ceil(3 * 3 / 5) == 2."
        test_recipe:
