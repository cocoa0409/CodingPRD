      - name: compliance_run_dispatches_only_the_most_overdue_tier_and_never_repeats_it
        claim_type: chronological
        grounds:
          - calculations.recert_reminder_selection
          - endpoints[POST /compliance-runs]
        distinguishing_aspect: |
          For a certificate already past expires_at the ranked tier ladder must dispatch exactly ONE tier —
          T_LAPSED, the most overdue — not the four tiers T_180, T_90, T_30 and T_LAPSED it has technically
          passed, so reminder_tiers_sent == ["T_LAPSED"] and reminder_notices_sent_count == 1. A second run
          at the same clock re-dispatches nothing because the tier is already present, and it also reports
          certificates_expired_count 0 because phase 2 has no ISSUED certificate left.
        test_recipe:
          setup:
            - "Baseline jurisdiction with recert_cycle_months 60 and requires_local_registration false / provider prepaid 500000 / EN form / 2-seat site / candidate / REGISTERED proctor / 1-unit EXAM_ONLY batch (expires_at 2027-06-30) with its code assigned."
            - "A certificate issued on 2026-09-12T10:30:00Z from a passing final report, so expires_at is 2031-09-12T10:30:00Z, recert_window_opens_at is 2031-03-16T10:30:00Z and reminder_tiers_sent is []."
            - "The clock is moved to 2031-10-01T00:00:00Z — past expiry, so every tier boundary has been crossed and the batch's own expires_at is long gone."
