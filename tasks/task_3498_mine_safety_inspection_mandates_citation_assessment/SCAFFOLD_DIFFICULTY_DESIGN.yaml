            - call: "POST /msha/contests/${con1}/withdraw"
              payload: {}
              as: OperatorRep
              as_user_id: "${op_id}"
            - call: "POST /msha/penalty-assessments/${asm1}/finalize"
              payload: {}
              as: MSHAAdmin
          assert:
            - "first finalize answers 409 ERR_INVALID_STATE (assessment CONTESTED) even though the window lapsed on 2026-03-12T09:00:00Z"
            - "withdrawal moves the contest to WITHDRAWN and the assessment back to PROPOSED"
            - "second finalize succeeds: PenaltyAssessment.${asm1}.status == FINAL and final_penalty_cents == 194063 (no good-faith: never abated)"
