  # ===========================================================================
  - section: calculations
    instances:

      - name: tally_intro_weights_and_quorum_applied
        claim_type: Constants Applied
        grounds:
          - calculations.vote_tally
          - entities.VoteCampaign.fields.votes_yes_weighted
        distinguishing_aspect: "The INTRODUCTION weight table is observable in the stored tallies: 10 KIDS yes + 4 PARENTS yes + 2 PARENTS no accumulates yes 16.0 (10*1.0 + 4*1.5) out of total 19.0 — segment weights, not raw counts, drive both fields."
        test_recipe:
          setup:
            - "Color Cerulean with an OPEN introduction campaign."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp_id}", voter_segment: KIDS, choice: "YES", count: 10 }
              as: Consumer
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp_id}", voter_segment: PARENTS, choice: "YES", count: 4 }
              as: Consumer
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp_id}", voter_segment: PARENTS, choice: "NO", count: 2 }
              as: Consumer
            - *k_close
          trigger:
            - *k_epoch
          assert:
            - "GET /crayon-works/colors/${c_id}/vote-campaigns shows data[0].votes_yes_weighted == 16.0 and data[0].votes_total_weighted == 19.0"
            - "data[0].turnout_count == 16 (raw ballots, unweighted)"
            - "data[0].outcome == PASSED (16.0 / 19.0 = 0.842 >= 0.55) and Color.${c_id}.status == ACTIVE"

      - name: tally_below_quorum_fails_despite_unanimous_yes
        claim_type: Correct Result
        grounds:
          - calculations.vote_tally
          - entities.VoteCampaign.fields.turnout_count
        distinguishing_aspect: "MIN_TURNOUT 10 gates the ratio: 5 unanimous KIDS yes ballots give ratio 1.0 but turnout 5, so the campaign FAILS and the color stays PROPOSED — the quorum check is independent of sentiment."
        test_recipe:
          setup:
            - "Color Cerulean with an OPEN introduction campaign that receives only 5 ballots."
          setup_api_calls:
            - *k_clock0
            - *k_color
            - *k_camp
            - *k_open
            - *k_epoch
            - call: "POST /crayon-works/votes"
              payload: { campaign_id: "${camp_id}", voter_segment: KIDS, choice: "YES", count: 5 }
              as: Consumer
            - *k_close
          trigger:
            - *k_epoch
          assert:
            - "GET /crayon-works/colors/${c_id}/vote-campaigns shows data[0].outcome == FAILED with turnout_count == 5"
            - "Color.${c_id}.status == PROPOSED (failed introduction loops back)"

