# =============================================================================
# SCAFFOLD.yaml — Municipal Lien Search & Estoppel Ordering (task_1594)
# §1.0–§1.7 seed tables. Difficulty design (§1.8) and corner design (§1.9)
# live in sibling files SCAFFOLD_DIFFICULTY_DESIGN.yaml / SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Municipal Lien Search & Estoppel Ordering (municipal lien search provider):
  jurisdiction identification & department list (utility/code/permit), unpaid
  balance & open violation research, association estoppel letter ordering with
  statutory response deadlines & fee caps, expiration of estoppel & closing date
  coordination, discrepancy resolution & payoff verification, rush order
  handling, result delivery to title/closing agent, liability for missed items.

domain_name: municipal-lien-search
api_prefix: ""

conventions:
  list_ordering: "All list endpoints return items in created_at ASC, with ties (identical logical-clock timestamps) broken by insertion order — the order in which the server accepted the creates. ids are never used for ordering."

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
  entity_topology: flat            # all resources are top-level peers joined by FK references
  state_machine_shape: cyclic      # SearchOrder / ResearchTask / EstoppelOrder all have revert loops
  relationship_patterns:
    - one_to_many                  # SearchOrder -> ResearchTask / EstoppelOrder / Discrepancy / Delivery
    - polymorphic                  # Discrepancy.subject_id -> ResearchTask | EstoppelOrder | SearchOrder
    - cross_aggregate              # SearchOrder pins JurisdictionStatute; EstoppelOrder -> Association
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: advanced_dense
  approximate_counts: { entities: 9, endpoints: 48, errors: 28, state_machines: 5, calculations: 9 }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique jurisdiction code (e.g. FL-DADE)" }
      - { name: name, type: string, source: input, description: "Display name (e.g. Miami-Dade County)" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: rush_daily_capacity, type: integer, source: input, default: 5, description: "Max RUSH SearchOrders per service_date with status not in {CANCELLED} for this jurisdiction" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE; only ACTIVE jurisdictions accept identify-jurisdiction" }

  - name: JurisdictionStatute
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; statute set this window belongs to" }
      - { name: effective_from, type: string, source: input, description: "ISO date (YYYY-MM-DD), inclusive window start" }
      - { name: effective_to, type: string, source: input, description: "ISO date, exclusive window end; null = open-ended" }
      - { name: estoppel_response_days, type: integer, source: input, description: "Statutory calendar-day deadline for associations to respond to an estoppel request" }
      - { name: estoppel_fee_cap_cents, type: integer, source: input, description: "Statutory cap on the estoppel letter fee; 0 means the letter must be issued free of charge" }
      - { name: estoppel_validity_days, type: integer, source: input, description: "Calendar days a received estoppel letter stays valid for closing" }
    constraints: "Half-open windows [effective_from, effective_to) of one jurisdiction must not overlap; adjacency (new.effective_from == old.effective_to) is allowed"

  - name: Department
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; owning jurisdiction" }
      - { name: dept_type, type: enum, source: input, description: "UTILITY | CODE_ENFORCEMENT | PERMIT | TAX_COLLECTOR; unique per jurisdiction among ACTIVE departments" }
      - { name: name, type: string, source: input, description: "Department display name" }
      - { name: research_fee_cents, type: integer, source: input, description: "Base research fee charged when a task completes" }
      - { name: rush_surcharge_cents, type: integer, source: input, default: 0, description: "Additional fee per task on RUSH orders" }
      - { name: supports_rush, type: boolean, source: input, default: true, description: "Whether this department accepts rush turnaround" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE; only ACTIVE departments spawn ResearchTasks" }

  - name: Association
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; jurisdiction whose statute governs this association" }
      - { name: name, type: string, source: input, description: "HOA / condo association name" }
      - { name: management_company, type: string, source: input, description: "Managing agent name" }
      - { name: estoppel_fee_cents, type: integer, source: input, description: "Fee the association quotes for an estoppel letter; must be <= the fee cap of the jurisdiction statute in force at registration" }
      - { name: estoppel_validity_days, type: integer, source: input, description: "Calendar days this association's letters remain valid after receipt" }

  - name: SearchOrder
    parent: null
    common_fields: true
    fields:
      - { name: title_agent_id, type: string, source: system, description: "Opaque TitleAgent operator id, copied from X-User-ID at creation; ownership checked against X-User-ID" }
      - { name: property_address, type: string, source: input, description: "Street address of the subject property" }
      - { name: parcel_number, type: string, source: input, description: "Assessor parcel number; duplicate-window rule applies per parcel" }
      - { name: association_id, type: string, source: input, description: "FK -> Association.id; null when the property is not in an association" }
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id; null until identify-jurisdiction" }
      - { name: rush_candidate_jurisdiction_id, type: string, source: input, description: "Candidate jurisdiction declared at create for RUSH capacity accounting (required for RUSH, null for STANDARD); identify-jurisdiction on a RUSH order must confirm this same jurisdiction" }
      - { name: statute_id, type: string, source: system, description: "FK -> JurisdictionStatute.id; statute covering the clock date at identify-jurisdiction, pinned for the life of the order" }
      - { name: order_class, type: enum, source: input, description: "STANDARD | RUSH" }
      - { name: service_date, type: string, source: input, description: "ISO date the research slot is reserved for; required for RUSH, null for STANDARD" }
      - { name: closing_date, type: string, source: input, description: "ISO date of the scheduled closing; drives estoppel staleness checks" }
      - { name: extended_coverage, type: boolean, source: input, default: false, description: "Purchased extended liability coverage; adds coverage fee at delivery" }
      - { name: status, type: enum, source: system, description: "INTAKE | RESEARCH_IN_PROGRESS | VERIFICATION | READY_FOR_DELIVERY | DELIVERED | CANCELLED" }
      - { name: research_completed_by_user_id, type: string, source: system, description: "X-User-ID that called submit-for-verification; SoD reference for payoff verification" }
      - { name: payoff_verified_by_user_id, type: string, source: system, description: "X-User-ID of the QAReviewer who verified; cleared on any revert to RESEARCH_IN_PROGRESS" }
      - { name: payoff_verified_at, type: datetime, source: system, description: "Clock timestamp of successful verification; null when unverified" }
      - { name: total_payoff_cents, type: integer, source: computed, description: "Sum of unpaid_balance_cents over COMPLETED ResearchTasks + payoff_amount_cents over RECEIVED EstoppelOrders" }
      - { name: total_fees_cents, type: integer, source: computed, description: "Sum of fee_charged_cents over COMPLETED ResearchTasks + lifetime_fees_cents over EstoppelOrders with status in {RECEIVED, EXPIRED}" }
      - { name: pending_claims_cents, type: integer, source: computed, description: "Sum of claimed_amount_cents over Discrepancies with status in {OPEN, UNDER_REVIEW}" }
      - { name: total_liability_cents, type: integer, source: computed, description: "Sum of confirmed_liability_cents over RESOLVED Discrepancies" }

  - name: ResearchTask
    parent: null
    common_fields: true
    fields:
      - { name: search_order_id, type: string, source: system, description: "FK -> SearchOrder.id; owning order" }
      - { name: department_id, type: string, source: system, description: "FK -> Department.id; department this task researches" }
      - { name: dept_type, type: enum, source: system, description: "UTILITY | CODE_ENFORCEMENT | PERMIT | TAX_COLLECTOR; copied from Department at spawn" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_PROGRESS | COMPLETED | UNABLE_TO_REACH | CANCELLED" }
      - { name: findings, type: array, source: input, description: "Recorded findings: [{ finding_kind: UNPAID_UTILITY | CODE_VIOLATION | OPEN_PERMIT | TAX_LIEN, amount_cents: integer, daily_accrual_cents?: number (may be fractional, e.g. 133.5), days_outstanding?: integer, description?: string }]" }
      - { name: findings_recorded, type: boolean, source: system, default: false, description: "True once record-findings has succeeded at least once; required by complete" }
      - { name: unpaid_balance_cents, type: integer, source: computed, description: "Per task_unpaid_balance calculation over current findings" }
      - { name: open_violation_count, type: integer, source: computed, description: "Count of findings with finding_kind == CODE_VIOLATION" }
      - { name: fee_base_cents, type: integer, source: system, description: "Department.research_fee_cents snapshotted at spawn" }
      - { name: fee_rush_surcharge_cents, type: integer, source: system, description: "Department.rush_surcharge_cents snapshotted at spawn" }
      - { name: fee_charged_cents, type: integer, source: computed, description: "fee_base_cents + (order RUSH ? fee_rush_surcharge_cents : 0) while COMPLETED; 0 otherwise" }
      - { name: completed_by_user_id, type: string, source: system, description: "X-User-ID that completed the task; cleared on reopen" }
      - { name: unreachable_reason, type: string, source: input, description: "Reason recorded by mark-unreachable" }

  - name: EstoppelOrder
    parent: null
    common_fields: true
    fields:
      - { name: search_order_id, type: string, source: system, description: "FK -> SearchOrder.id; owning order" }
      - { name: association_id, type: string, source: system, description: "FK -> Association.id; association the letter is ordered from" }
      - { name: status, type: enum, source: system, description: "DRAFT | ORDERED | OVERDUE | RECEIVED | EXPIRED | CANCELLED" }
      - { name: fee_quoted_cents, type: integer, source: input, description: "Fee quoted by the association at place time; must be <= the pinned statute fee cap" }
      - { name: ordered_at, type: datetime, source: system, description: "Clock timestamp of the latest place" }
      - { name: statutory_due_at, type: datetime, source: computed, description: "ordered date + pinned statute estoppel_response_days (23:59:59.000Z on the due date)" }
      - { name: received_at, type: datetime, source: system, description: "Clock timestamp of receipt; null until received" }
      - { name: late_delivery, type: boolean, source: computed, description: "True when receipt happened after statutory_due_at; fee forfeits to 0" }
      - { name: current_fee_cents, type: integer, source: computed, description: "Fee charged for the latest receipt: fee_quoted_cents when on time, 0 when late" }
      - { name: lifetime_fees_cents, type: integer, source: computed, description: "Accumulated fees across all receipts of this estoppel (survives expiry and renewal)" }
      - { name: payoff_amount_cents, type: integer, source: input, description: "Association payoff figure from the received letter" }
      - { name: valid_through, type: string, source: computed, description: "ISO date: received date + Association.estoppel_validity_days; estoppel is current while closing_date <= valid_through" }
      - { name: renewal_count, type: integer, source: system, default: 0, description: "Number of times this estoppel was re-placed from EXPIRED" }

  - name: Discrepancy
    parent: null
    common_fields: true
    fields:
      - { name: search_order_id, type: string, source: input, description: "FK -> SearchOrder.id; order the discrepancy is filed against" }
      - { name: subject_type, type: enum, source: input, description: "SEARCH_ORDER | RESEARCH_TASK | ESTOPPEL_ORDER; polymorphic subject kind" }
      - { name: subject_id, type: string, source: input, description: "Polymorphic reference to the disputed entity; resolved via subject_type (RESEARCH_TASK -> ResearchTask.id, ESTOPPEL_ORDER -> EstoppelOrder.id, SEARCH_ORDER -> SearchOrder.id); must belong to search_order_id" }
      - { name: discrepancy_type, type: enum, source: input, description: "MISSED_ITEM | BALANCE_MISMATCH | PAYOFF_MISMATCH | STALE_ESTOPPEL" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount the filer claims was missed or mis-stated; must be > 0 and <= MAX_CLAIM_CENTS" }
      - { name: description, type: string, source: input, description: "Free-text explanation" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filing TitleAgent; SoD reference for resolution" }
      - { name: post_delivery, type: boolean, source: computed, description: "True when filed while the order was DELIVERED" }
      - { name: status, type: enum, source: system, description: "OPEN | UNDER_REVIEW | RESOLVED" }
      - { name: resolution_outcome, type: enum, source: system, description: "CONFIRMED_CORRECTION | REJECTED_INVALID | VOID_ORDER_CANCELLED; null until resolved" }
      - { name: confirmed_amount_cents, type: integer, source: input, description: "Confirmed missed amount; required and > 0 when resolving a MISSED_ITEM as CONFIRMED_CORRECTION" }
      - { name: confirmed_liability_cents, type: integer, source: computed, description: "min(confirmed_amount_cents, delivery liability cap) for confirmed post-delivery MISSED_ITEM; else 0" }
      - { name: resolved_by_user_id, type: string, source: system, description: "X-User-ID of the resolver; must differ from filed_by_user_id" }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: search_order_id, type: string, source: input, description: "FK -> SearchOrder.id; order being delivered" }
      - { name: status, type: enum, source: system, description: "READY | DELIVERED | ACKNOWLEDGED | SUPERSEDED | VOIDED" }
      - { name: snapshot_payoff_cents, type: integer, source: computed, description: "SearchOrder.total_payoff_cents frozen at deliver time" }
      - { name: snapshot_fees_cents, type: integer, source: computed, description: "SearchOrder.total_fees_cents frozen at deliver time" }
      - { name: coverage_fee_cents, type: integer, source: computed, description: "Extended-coverage fee computed at deliver time; 0 when not purchased" }
      - { name: liability_cap_cents, type: integer, source: computed, description: "Final liability cap per liability_cap calculation, frozen at deliver time" }
      - { name: delivered_at, type: datetime, source: system, description: "Clock timestamp of delivery; null until DELIVERED" }
      - { name: delivered_to_agent_id, type: string, source: system, description: "SearchOrder.title_agent_id copied at deliver time" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SearchOrder
    initial_state: INTAKE
    terminal_states: [CANCELLED]
    transitions:
      - from: INTAKE
        to: RESEARCH_IN_PROGRESS
        trigger: "POST /search-orders/{id}/identify-jurisdiction"
        actor: ResearchAnalyst
        preconditions:
          - "Jurisdiction exists and is ACTIVE (ERR_NOT_FOUND / ERR_INVALID_STATE_TRANSITION)"
          - "A JurisdictionStatute window covers the current clock date (ERR_NO_STATUTE_IN_FORCE)"
          - "If association_id is set: association.jurisdiction_id == requested jurisdiction_id (ERR_ASSOCIATION_JURISDICTION_MISMATCH)"
        side_effects:
          - "jurisdiction_id set; statute_id pinned to the covering statute"
          - "Spawn one ResearchTask (PENDING) per ACTIVE Department of the jurisdiction in Department.created_at ASC order (list order is therefore deterministic), snapshotting fee_base_cents and fee_rush_surcharge_cents"
          - "If association_id is set: spawn EstoppelOrder in DRAFT for that association"
      - from: RESEARCH_IN_PROGRESS
        to: VERIFICATION
        trigger: "POST /search-orders/{id}/submit-for-verification"
        actor: ResearchAnalyst
        preconditions:
          - "Every ResearchTask is COMPLETED or UNABLE_TO_REACH (ERR_TASKS_OUTSTANDING)"
          - "Every EstoppelOrder is RECEIVED (ERR_ESTOPPEL_NOT_CURRENT)"
          - "Every EstoppelOrder has valid_through >= closing_date (ERR_ESTOPPEL_STALE_FOR_CLOSING)"
        side_effects:
          - "research_completed_by_user_id = X-User-ID"
      - from: VERIFICATION
        to: READY_FOR_DELIVERY
        trigger: "POST /search-orders/{id}/verify-payoff"
        actor: QAReviewer
        preconditions:
          - "verified_payoff_total_cents == computed total_payoff_cents (ERR_PAYOFF_MISMATCH)"
          - "X-User-ID != research_completed_by_user_id and != completed_by_user_id of every COMPLETED ResearchTask (ERR_SOD_VIOLATION)"
        side_effects:
          - "payoff_verified_by_user_id = X-User-ID; payoff_verified_at = clock"
      - from: VERIFICATION
        to: RESEARCH_IN_PROGRESS
        trigger: "POST /search-orders/{id}/reject-verification OR system cascade (confirmed pre-delivery discrepancy; estoppel auto-expiry)"
        actor: QAReviewer | system
        preconditions: []
        side_effects:
          - "payoff_verified_by_user_id and payoff_verified_at cleared"
      - from: READY_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /deliveries/{id}/deliver on a READY Delivery of this order"
        actor: QAReviewer
        preconditions:
          - "Delivery.search_order_id == this order and Delivery.status == READY (ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "Delivery snapshot fields written (payoff, fees, coverage_fee, liability_cap); delivered_at = clock; delivered_to_agent_id = title_agent_id"
      - from: READY_FOR_DELIVERY
        to: RESEARCH_IN_PROGRESS
        trigger: "system cascade (confirmed discrepancy; estoppel auto-expiry; PATCH closing_date past an estoppel valid_through)"
        actor: system
        preconditions: []
        side_effects:
          - "payoff_verified_by_user_id and payoff_verified_at cleared"
          - "READY Deliveries of this order -> VOIDED"
      - from: DELIVERED
        to: RESEARCH_IN_PROGRESS
        trigger: "system cascade (Discrepancy resolved CONFIRMED_CORRECTION with post_delivery == true)"
        actor: system
        preconditions: []
        side_effects:
          - "payoff_verified_by_user_id and payoff_verified_at cleared"
          - "Deliveries in {DELIVERED, ACKNOWLEDGED} -> SUPERSEDED"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /search-orders/{id}/cancel (owner TitleAgent only, ERR_NOT_ORDER_OWNER otherwise)"
        actor: TitleAgent
        preconditions: []
        side_effects:
          - "OPEN or UNDER_REVIEW Discrepancies -> RESOLVED with resolution_outcome VOID_ORDER_CANCELLED; pending_claims_cents decremented accordingly"
      - from: RESEARCH_IN_PROGRESS
        to: CANCELLED
        trigger: "POST /search-orders/{id}/cancel"
        actor: TitleAgent
        preconditions: []
        side_effects:
          - "ResearchTasks in {PENDING, IN_PROGRESS, UNABLE_TO_REACH} -> CANCELLED; COMPLETED tasks keep their fees"
          - "EstoppelOrders in {DRAFT, ORDERED, OVERDUE} -> CANCELLED; RECEIVED/EXPIRED estoppels keep lifetime_fees_cents"
          - "OPEN or UNDER_REVIEW Discrepancies -> RESOLVED with resolution_outcome VOID_ORDER_CANCELLED"
      - from: VERIFICATION
        to: CANCELLED
        trigger: "POST /search-orders/{id}/cancel"
        actor: TitleAgent
        preconditions: []
        side_effects: ["Same cascades as RESEARCH_IN_PROGRESS -> CANCELLED"]
      - from: READY_FOR_DELIVERY
        to: CANCELLED
        trigger: "POST /search-orders/{id}/cancel"
        actor: TitleAgent
        preconditions: []
        side_effects: ["Same cascades as RESEARCH_IN_PROGRESS -> CANCELLED", "READY Deliveries -> VOIDED"]

  - entity: ResearchTask
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /research-tasks/{id}/record-findings (first call auto-starts the task)"
        actor: ResearchAnalyst
        preconditions: []
        side_effects: ["findings stored; findings_recorded = true; unpaid_balance_cents and open_violation_count recomputed"]
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /research-tasks/{id}/record-findings (overwrite findings; guarded by OCC expected_research_task_version)"
        actor: ResearchAnalyst
        preconditions: []
        side_effects: ["findings overwritten; unpaid_balance_cents recomputed"]
      - from: UNABLE_TO_REACH
        to: IN_PROGRESS
        trigger: "POST /research-tasks/{id}/record-findings (retry after unreachable)"
        actor: ResearchAnalyst
        preconditions: []
        side_effects: ["unreachable_reason cleared; findings stored; findings_recorded = true"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /research-tasks/{id}/complete"
        actor: ResearchAnalyst
        preconditions: []
        side_effects:
          - "completed_by_user_id = X-User-ID"
          - "fee_charged_cents = fee_base_cents + (order RUSH ? fee_rush_surcharge_cents : 0)"
          - "SearchOrder.total_fees_cents += fee_charged_cents; SearchOrder.total_payoff_cents += unpaid_balance_cents"
      - from: PENDING
        to: UNABLE_TO_REACH
        trigger: "POST /research-tasks/{id}/mark-unreachable"
        actor: ResearchAnalyst
        preconditions: []
        side_effects: ["unreachable_reason set"]
      - from: IN_PROGRESS
        to: UNABLE_TO_REACH
        trigger: "POST /research-tasks/{id}/mark-unreachable"
        actor: ResearchAnalyst
        preconditions: []
        side_effects: ["unreachable_reason set"]
      - from: COMPLETED
        to: IN_PROGRESS
        trigger: "system cascade (Discrepancy with subject_type RESEARCH_TASK resolved CONFIRMED_CORRECTION)"
        actor: system
        preconditions: []
        side_effects:
          - "SearchOrder.total_fees_cents -= fee_charged_cents; fee_charged_cents -> 0"
          - "SearchOrder.total_payoff_cents -= unpaid_balance_cents"
          - "completed_by_user_id cleared"
      - from: PENDING
        to: CANCELLED
        trigger: "system cascade (SearchOrder cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system cascade (SearchOrder cancelled)"
        actor: system
        preconditions: []
        side_effects: []
      - from: UNABLE_TO_REACH
        to: CANCELLED
        trigger: "system cascade (SearchOrder cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: EstoppelOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: ORDERED
        trigger: "POST /estoppel-orders/{id}/place"
        actor: ResearchAnalyst
        preconditions:
          - "0 < fee_quoted_cents <= pinned statute estoppel_fee_cap_cents (ERR_QUOTE_EXCEEDS_STATUTORY_CAP)"
        side_effects:
          - "ordered_at = clock; statutory_due_at = ordered date + statute.estoppel_response_days (end of due day)"
      - from: EXPIRED
        to: ORDERED
        trigger: "POST /estoppel-orders/{id}/place (renewal)"
        actor: ResearchAnalyst
        preconditions:
          - "0 < fee_quoted_cents <= pinned statute estoppel_fee_cap_cents (ERR_QUOTE_EXCEEDS_STATUTORY_CAP)"
        side_effects:
          - "renewal_count += 1; ordered_at and statutory_due_at recomputed; received_at / payoff_amount_cents / valid_through / late_delivery cleared; current_fee_cents -> 0"
      - from: ORDERED
        to: OVERDUE
        trigger: "system sweep on POST /_clock/set_current_utc when clock date > statutory_due_at date and not yet received"
        actor: system
        preconditions: []
        side_effects: []
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /estoppel-orders/{id}/receive"
        actor: ResearchAnalyst
        preconditions:
          - "payoff_amount_cents >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "received_at = clock; late_delivery = false"
          - "current_fee_cents = fee_quoted_cents; lifetime_fees_cents += current_fee_cents"
          - "valid_through = received date + Association.estoppel_validity_days"
          - "SearchOrder.total_payoff_cents += payoff_amount_cents; total_fees_cents += current_fee_cents"
      - from: OVERDUE
        to: RECEIVED
        trigger: "POST /estoppel-orders/{id}/receive (late receipt — statutory fee forfeiture)"
        actor: ResearchAnalyst
        preconditions:
          - "payoff_amount_cents >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "received_at = clock; late_delivery = true"
          - "current_fee_cents = 0; lifetime_fees_cents unchanged"
          - "valid_through = received date + Association.estoppel_validity_days"
          - "SearchOrder.total_payoff_cents += payoff_amount_cents (no fee added)"
      - from: RECEIVED
        to: EXPIRED
        trigger: "system sweep on POST /_clock/set_current_utc when clock date > valid_through and SearchOrder.status not in {DELIVERED, CANCELLED}"
        actor: system
        preconditions: []
        side_effects:
          - "SearchOrder.total_payoff_cents -= payoff_amount_cents"
          - "If SearchOrder.status == VERIFICATION or READY_FOR_DELIVERY: SearchOrder -> RESEARCH_IN_PROGRESS with payoff verification cleared; READY Deliveries -> VOIDED"
      - from: DRAFT
        to: CANCELLED
        trigger: "system cascade (SearchOrder cancelled, or association_id cleared/changed by PATCH)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ORDERED
        to: CANCELLED
        trigger: "system cascade (SearchOrder cancelled, or association_id cleared/changed by PATCH)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: CANCELLED
        trigger: "system cascade (SearchOrder cancelled, or association_id cleared/changed by PATCH)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Discrepancy
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "POST /discrepancies/{id}/start-review"
        actor: QAReviewer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "POST /discrepancies/{id}/resolve"
        actor: QAReviewer
        preconditions:
          - "X-User-ID != filed_by_user_id (ERR_SOD_VIOLATION)"
          - "resolution_outcome CONFIRMED_CORRECTION on MISSED_ITEM requires confirmed_amount_cents > 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "resolved_by_user_id = X-User-ID"
          - "SearchOrder.pending_claims_cents -= claimed_amount_cents"
          - "If CONFIRMED_CORRECTION and post_delivery and discrepancy_type == MISSED_ITEM: confirmed_liability_cents = min(confirmed_amount_cents, liability_cap_cents of the latest Delivery with status in {DELIVERED, ACKNOWLEDGED}); SearchOrder.total_liability_cents += confirmed_liability_cents; SearchOrder DELIVERED -> RESEARCH_IN_PROGRESS cascade"
          - "If CONFIRMED_CORRECTION and subject_type == RESEARCH_TASK: subject task COMPLETED -> IN_PROGRESS cascade (fee and payoff reversal)"
          - "If CONFIRMED_CORRECTION and not post_delivery and SearchOrder.status in {VERIFICATION, READY_FOR_DELIVERY}: SearchOrder -> RESEARCH_IN_PROGRESS cascade"
      - from: OPEN
        to: RESOLVED
        trigger: "system cascade (SearchOrder cancelled)"
        actor: system
        preconditions: []
        side_effects: ["resolution_outcome = VOID_ORDER_CANCELLED; SearchOrder.pending_claims_cents -= claimed_amount_cents"]
      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "system cascade (SearchOrder cancelled)"
        actor: system
        preconditions: []
        side_effects: ["resolution_outcome = VOID_ORDER_CANCELLED; SearchOrder.pending_claims_cents -= claimed_amount_cents"]

  - entity: Delivery
    initial_state: READY
    terminal_states: [ACKNOWLEDGED, SUPERSEDED, VOIDED]
    transitions:
      - from: READY
        to: DELIVERED
        trigger: "POST /deliveries/{id}/deliver"
        actor: QAReviewer
        preconditions:
          - "SearchOrder.status == READY_FOR_DELIVERY (ERR_ORDER_NOT_DELIVERABLE)"
          - "closing_date >= current clock date (ERR_CLOSING_DATE_PASSED)"
        side_effects:
          - "Snapshot: snapshot_payoff_cents, snapshot_fees_cents = order totals"
          - "liability_cap calculation runs: coverage_fee_cents and liability_cap_cents frozen"
          - "delivered_at = clock; delivered_to_agent_id = SearchOrder.title_agent_id"
          - "SearchOrder READY_FOR_DELIVERY -> DELIVERED"
      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /deliveries/{id}/acknowledge (owner TitleAgent only, ERR_NOT_ORDER_OWNER otherwise)"
        actor: TitleAgent
        preconditions: []
        side_effects: []
      - from: DELIVERED
        to: SUPERSEDED
        trigger: "system cascade (SearchOrder DELIVERED -> RESEARCH_IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACKNOWLEDGED
        to: SUPERSEDED
        trigger: "system cascade (SearchOrder DELIVERED -> RESEARCH_IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: READY
        to: VOIDED
        trigger: "system cascade (SearchOrder leaves READY_FOR_DELIVERY without delivery, or order cancelled)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; state-precondition conflicts live in §1.2/§1.4)
# =============================================================================
concurrency_rules:
  - rule_id: order-patch-stale-version
    parent_entity: SearchOrder
    write_endpoint: "PATCH /search-orders/{id}"
    occ_field: expected_search_order_version
    description: |
      A PATCH that carries an expected_search_order_version older than the
      order's current version is rejected: another accepted write (including
      cascaded mutations from task completion, estoppel receipt, or expiry
      sweeps) has advanced the version since the caller last observed the
      order, so the caller's closing_date / association_id edit is based on a
      stale view.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: task-findings-stale-version
    parent_entity: ResearchTask
    write_endpoint: "POST /research-tasks/{id}/record-findings"
    occ_field: expected_research_task_version
    description: |
      A record-findings call whose expected_research_task_version is older
      than the task's current version is rejected: findings overwrite
      semantics mean the later writer would silently discard an update it
      never saw. The stale writer must re-read the task and resubmit.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: task_unpaid_balance
    trigger: "record-findings (and any findings overwrite)"
    algorithm: aggregation
    formula: |
      For each finding f in task.findings:
        if f.finding_kind == CODE_VIOLATION and f.daily_accrual_cents is present and f.days_outstanding is present:
          effective_cents(f) = f.amount_cents + round_half_up(f.daily_accrual_cents * f.days_outstanding)
        else:
          effective_cents(f) = f.amount_cents
      # ROUNDING ORDER PINNED: round each finding to whole cents FIRST, then sum.
      unpaid_balance_cents = sum(effective_cents(f) for f in findings)
      open_violation_count = count(f where f.finding_kind == CODE_VIOLATION)
    input_set: "All findings currently stored on the task, regardless of task status"
    precision: "0 decimal places (integer cents), round_half_up applied per finding before summation"

  - name: order_total_payoff
    trigger: "task complete, task reopen (COMPLETED -> IN_PROGRESS), estoppel receive, estoppel expiry"
    algorithm: aggregation
    formula: |
      total_payoff_cents =
        sum(unpaid_balance_cents over ResearchTasks of the order with status == COMPLETED)
        + sum(payoff_amount_cents over EstoppelOrders of the order with status == RECEIVED)
      # Tasks in PENDING/IN_PROGRESS/UNABLE_TO_REACH/CANCELLED contribute 0.
      # EstoppelOrders in DRAFT/ORDERED/OVERDUE/EXPIRED/CANCELLED contribute 0.
    input_set: "ResearchTask.status == COMPLETED; EstoppelOrder.status == RECEIVED"
    precision: "integer cents"

  - name: estoppel_fee_charge
    trigger: "estoppel receive"
    algorithm: tiered_pricing
    formula: |
      base = min(fee_quoted_cents, pinned_statute.estoppel_fee_cap_cents)
      # placement already enforces fee_quoted_cents <= cap, so base == fee_quoted_cents in practice;
      # the min() is the pinned defense against any path that skips placement validation.
      if late_delivery:
        current_fee_cents = 0        # statutory fee forfeiture on late response
      else:
        current_fee_cents = base
      lifetime_fees_cents += current_fee_cents
    input_set: "The EstoppelOrder being received, its pinned JurisdictionStatute"
    constants:
      LATE_FEE_CENTS: 0
    precision: "integer cents"
    variants:
      - name: on_time
        when: "received date <= statutory_due_at date"
        difference: "current_fee_cents = fee_quoted_cents (cap-clamped)"
      - name: late_forfeiture
        when: "received date > statutory_due_at date (receipt from OVERDUE)"
        difference: "current_fee_cents = 0 regardless of quote — identical quote and payoff produce different fee and different SearchOrder.total_fees_cents"

  - name: order_total_fees
    trigger: "task complete, task reopen, estoppel receive (fee component), delivery snapshot"
    algorithm: aggregation
    formula: |
      total_fees_cents =
        sum(fee_charged_cents over ResearchTasks with status == COMPLETED)
        + sum(lifetime_fees_cents over EstoppelOrders with status in {RECEIVED, EXPIRED})
      # Cancellation never refunds: fees once charged survive order cancellation.
    input_set: "COMPLETED tasks; RECEIVED or EXPIRED estoppels"
    precision: "integer cents"

  - name: liability_cap
    trigger: "delivery deliver (snapshot); order summary (projection)"
    algorithm: threshold
    formula: |
      # CIRCULAR-LOOKING DEPENDENCY — EVALUATION ORDER PINNED (steps must run in this order):
      #   coverage fee depends on the provisional cap; the final cap depends on total fees
      #   which include the coverage fee. Running the steps in any other order is a defect.
      base = order.total_fees_cents                                    # step 1
      provisional_cap = max(MIN_CAP_CENTS,                             # step 2
                            min(LIABILITY_MULTIPLIER * base, MAX_CAP_CENTS))
      coverage_fee_cents = round_half_up(EXTENDED_COVERAGE_RATE * provisional_cap)  # step 3
                           if order.extended_coverage else 0
      total_with_coverage = base + coverage_fee_cents                  # step 4
      final_cap = max(MIN_CAP_CENTS,                                   # step 5
                      min(LIABILITY_MULTIPLIER * total_with_coverage, MAX_CAP_CENTS))
      # Snapshot semantics: frozen on Delivery at deliver time. On the order-summary
      # projection the SAME 5-step algorithm runs over current totals (never reuses
      # the delivered snapshot), so post-delivery fee accrual can raise the projection.
    input_set: "SearchOrder totals at evaluation time"
    constants:
      LIABILITY_MULTIPLIER: 10
      MIN_CAP_CENTS: 25000
      MAX_CAP_CENTS: 100000
      EXTENDED_COVERAGE_RATE: 0.10
    precision: "integer cents, round_half_up for the coverage fee"
    variants:
      - name: standard
        when: "extended_coverage == false"
        difference: "coverage_fee_cents = 0; final_cap = clamp(10 * base)"
      - name: extended
        when: "extended_coverage == true"
        difference: "coverage fee = 10% of provisional cap; final_cap = clamp(10 * (base + coverage_fee))"

  - name: missed_item_liability
    trigger: "discrepancy resolve with CONFIRMED_CORRECTION"
    algorithm: threshold
    formula: |
      # Provisional exposure while the claim is open:
      pending_claims_cents = sum(claimed_amount_cents over Discrepancies with status in {OPEN, UNDER_REVIEW})
      # Confirmed liability for a post-delivery MISSED_ITEM:
      confirmed_liability_cents =
        min(confirmed_amount_cents,
            liability_cap_cents of the latest Delivery with status in {DELIVERED, ACKNOWLEDGED})
      # A confirmed claim on an order with no delivered Delivery yields 0 (unreachable in
      # practice because post-delivery filing requires a delivered Delivery to exist).
    input_set: "The resolved Discrepancy and the order's delivery history"
    constants:
      MAX_CLAIM_CENTS: 25000000
    precision: "integer cents"
    variants:
      - name: provisional
        when: "discrepancy filed, before resolution"
        difference: "exposure counted at the full claimed_amount_cents (bounded by MAX_CLAIM_CENTS at filing), no cap applied"
      - name: confirmed
        when: "resolved CONFIRMED_CORRECTION post-delivery"
        difference: "liability = min(confirmed_amount_cents, delivered liability cap) — the same claimed amount yields a different (cap-limited) number"

  - name: estoppel_timeline
    trigger: "estoppel place, estoppel receive, clock-set sweep"
    algorithm: forward_looking
    formula: |
      statutory_due_at = date(ordered_at) + statute.estoppel_response_days calendar days,
                         at 23:59:59.000Z on the resulting date
      valid_through    = date(received_at) + association.estoppel_validity_days calendar days
      An estoppel is current for closing iff closing_date <= valid_through (inclusive boundary).
      An estoppel is late iff date(received_at) > date(statutory_due_at).
    input_set: "The EstoppelOrder, its pinned JurisdictionStatute, its Association"
    precision: "whole calendar days; all comparisons on ISO dates"

  - name: rush_capacity_check
    trigger: "search-order create with order_class == RUSH"
    algorithm: threshold
    formula: |
      occupant_count = count(SearchOrders where rush_candidate_jurisdiction_id == requested jurisdiction_id
                       AND order_class == RUSH
                       AND service_date == requested service_date
                       AND status != CANCELLED)
      reject iff occupant_count >= jurisdiction.rush_daily_capacity
      # BOUNDARY PINNED: occupant_count == capacity - 1 is accepted; == capacity is rejected.
    input_set: "Non-cancelled RUSH SearchOrders for the same jurisdiction and service_date"
    precision: "integer count"

  - name: service_window_overlap
    trigger: "search-order create"
    algorithm: interval_merge
    formula: |
      window(o) = [date(o.created_at), o.closing_date]   # CLOSED interval, both ends inclusive
      reject iff exists SearchOrder o with o.parcel_number == requested parcel_number
        AND o.status != CANCELLED
        AND date(o.created_at) <= requested closing_date
        AND requested start date (current clock date) <= o.closing_date
      # CLOSED-INTERVAL SEMANTICS: a new order created exactly on the existing order's
      # closing_date still CONFLICTS (adjacency rejected). Cancellation frees the parcel
      # immediately regardless of the old window.
    input_set: "Non-cancelled SearchOrders with the same parcel_number"
    precision: "whole ISO dates"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path and body references resolve (jurisdiction, statute, department, association, order, task, estoppel, discrepancy, delivery)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: state
    check: "Target resource is in a state that permits the transition (includes terminal-state lockdown and ERR_ORDER_NOT_DELIVERABLE on deliver)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 5
    category: auth
    check: "Ownership: PATCH / cancel / acknowledge / file discrepancy require X-User-ID == SearchOrder.title_agent_id (or the delivery's order's title_agent_id)"
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "PATCH /search-orders/{id}, POST /search-orders/{id}/cancel, POST /deliveries/{id}/acknowledge, POST /discrepancies"
  - priority: 6
    category: business_safety
    check: "Segregation of duties: payoff verifier differs from research submitter and from every task completer; discrepancy resolver differs from filer"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /search-orders/{id}/verify-payoff, POST /discrepancies/{id}/resolve"
  - priority: 7
    category: business_referential
    check: "Association belongs to the identified jurisdiction; a statute window covers today at identify time; association registration fee within the in-force cap"
    error_id: "ERR_ASSOCIATION_JURISDICTION_MISMATCH | ERR_NO_STATUTE_IN_FORCE | ERR_FEE_EXCEEDS_STATUTORY_CAP"
    http_status: 422
    applies_to: "identify-jurisdiction, PATCH /search-orders/{id}, POST /associations"
  - priority: 8
    category: business_temporal
    check: "Temporal validity: service_date and closing_date not in the past; statute windows non-overlapping (adjacency allowed); estoppel current for closing at submit-for-verification; closing not passed at deliver"
    error_id: "ERR_SERVICE_DATE_PAST | ERR_CLOSING_DATE_PASSED | ERR_STATUTE_WINDOW_OVERLAP | ERR_ESTOPPEL_STALE_FOR_CLOSING"
    http_status: 422
    applies_to: "create/PATCH search-order, POST /statutes, submit-for-verification, deliver"
  - priority: 9
    category: business_constraint
    check: "Constraint checks: rush supported by all ACTIVE departments; rush daily capacity (>= capacity rejected); parcel service-window overlap; all tasks terminal before verification; estoppels received before verification; findings recorded before complete; subject belongs to order; no READY delivery already exists; estoppel quote within pinned cap"
    error_id: "ERR_RUSH_NOT_SUPPORTED | ERR_RUSH_CAPACITY_FULL | ERR_DUPLICATE_ACTIVE_SEARCH | ERR_TASKS_OUTSTANDING | ERR_ESTOPPEL_NOT_CURRENT | ERR_SUBJECT_NOT_IN_ORDER | ERR_DELIVERY_ALREADY_PENDING | ERR_QUOTE_EXCEEDS_STATUTORY_CAP"
    http_status: 409
    applies_to: "create search-order, submit-for-verification, complete, place, POST /discrepancies, POST /deliveries"
  - priority: 10
    category: business_fiscal
    check: "Fiscal checks: verifier's independent payoff total must equal the computed total; claimed amount within 1..MAX_CLAIM_CENTS"
    error_id: "ERR_PAYOFF_MISMATCH | ERR_CLAIM_AMOUNT_INVALID"
    http_status: 409
    applies_to: "verify-payoff, POST /discrepancies"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. Setting the clock triggers the estoppel sweep: ORDERED past statutory_due_at -> OVERDUE; RECEIVED past valid_through on non-DELIVERED, non-CANCELLED orders -> EXPIRED (with cascades)."
    roles: [ProviderAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["Estoppel OVERDUE/EXPIRED sweep with §1.2 cascades"]

  # --- Jurisdiction / Statute / Department / Association ---
  - method: POST
    path: "/jurisdictions"
    description: "Create a jurisdiction"
    roles: [ProviderAdmin]
    code: 201
    input: [code, name, state_code, "rush_daily_capacity?"]
    output: Jurisdiction
    side_effects: ["status = ACTIVE"]
  - method: GET
    path: "/jurisdictions/{id}"
    description: "Get a jurisdiction"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/jurisdictions/{id}/search-orders"
    description: "List search orders identified to this jurisdiction"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "SearchOrder[]"
    side_effects: []
  - method: POST
    path: "/jurisdictions/{id}/deactivate"
    description: "Deactivate a jurisdiction (new identify-jurisdiction calls into it are rejected)"
    roles: [ProviderAdmin]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: ["status -> INACTIVE"]
  - method: POST
    path: "/statutes"
    description: "Create an effective-dated statute window for a jurisdiction"
    roles: [ProviderAdmin]
    code: 201
    input: [jurisdiction_id, effective_from, effective_to, estoppel_response_days, estoppel_fee_cap_cents, estoppel_validity_days]
    output: JurisdictionStatute
    side_effects: ["ERR_STATUTE_WINDOW_OVERLAP on overlap with an existing window of the same jurisdiction (half-open, adjacency allowed)"]
  - method: GET
    path: "/statutes/{id}"
    description: "Get a statute"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: []
    output: JurisdictionStatute
    side_effects: []
  - method: GET
    path: "/jurisdictions/{id}/statutes"
    description: "List statutes of a jurisdiction"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "JurisdictionStatute[]"
    side_effects: []
  - method: GET
    path: "/statutes/{id}/search-orders"
    description: "List search orders that pinned this statute"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "SearchOrder[]"
    side_effects: []
  - method: POST
    path: "/departments"
    description: "Create a department for a jurisdiction"
    roles: [ProviderAdmin]
    code: 201
    input: [jurisdiction_id, dept_type, name, research_fee_cents, "rush_surcharge_cents?", "supports_rush?"]
    output: Department
    side_effects: ["status = ACTIVE; ERR_DUPLICATE_DEPARTMENT_TYPE when an ACTIVE department with the same dept_type exists"]
  - method: GET
    path: "/departments/{id}"
    description: "Get a department"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: []
    output: Department
    side_effects: []
  - method: GET
    path: "/jurisdictions/{id}/departments"
    description: "List departments of a jurisdiction"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Department[]"
    side_effects: []
  - method: GET
    path: "/departments/{id}/research-tasks"
    description: "List research tasks spawned from this department"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ResearchTask[]"
    side_effects: []
  - method: POST
    path: "/departments/{id}/deactivate"
    description: "Deactivate a department (future identify-jurisdiction calls skip it when spawning tasks)"
    roles: [ProviderAdmin]
    code: 200
    input: []
    output: Department
    side_effects: ["status -> INACTIVE"]
  - method: POST
    path: "/associations"
    description: "Register an association within a jurisdiction"
    roles: [ProviderAdmin]
    code: 201
    input: [jurisdiction_id, name, management_company, estoppel_fee_cents, estoppel_validity_days]
    output: Association
    side_effects: ["ERR_FEE_EXCEEDS_STATUTORY_CAP when estoppel_fee_cents exceeds the cap of the statute covering the current clock date"]
  - method: GET
    path: "/associations/{id}"
    description: "Get an association"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: []
    output: Association
    side_effects: []
  - method: GET
    path: "/jurisdictions/{id}/associations"
    description: "List associations of a jurisdiction"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Association[]"
    side_effects: []
  - method: GET
    path: "/associations/{id}/search-orders"
    description: "List search orders referencing this association"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "SearchOrder[]"
    side_effects: []
  - method: GET
    path: "/associations/{id}/estoppel-orders"
    description: "List estoppel orders placed with this association"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "EstoppelOrder[]"
    side_effects: []

  # --- SearchOrder ---
  - method: POST
    path: "/search-orders"
    description: "Create a search order (INTAKE). For RUSH orders, jurisdiction_id and service_date are required; jurisdiction_id is persisted as rush_candidate_jurisdiction_id and drives capacity accounting — the authoritative jurisdiction_id is assigned by identify-jurisdiction, which for RUSH orders must equal the candidate."
    roles: [TitleAgent]
    code: 201
    input: [property_address, parcel_number, closing_date, order_class, "service_date?", "jurisdiction_id?", "association_id?", "extended_coverage?"]
    output: SearchOrder
    side_effects:
      - "status = INTAKE; title_agent_id = X-User-ID"
      - "RUSH: validates rush support and daily capacity against the candidate jurisdiction_id (ERR_RUSH_NOT_SUPPORTED / ERR_RUSH_CAPACITY_FULL / ERR_SERVICE_DATE_PAST)"
      - "Parcel service-window overlap check (ERR_DUPLICATE_ACTIVE_SEARCH)"
  - method: GET
    path: "/search-orders/{id}"
    description: "Get a search order"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: []
    output: SearchOrder
    side_effects: []
  - method: PATCH
    path: "/search-orders/{id}"
    description: "Update closing_date and/or association_id while the order is in INTAKE, RESEARCH_IN_PROGRESS, VERIFICATION, or READY_FOR_DELIVERY (OCC-guarded; owner TitleAgent only)"
    roles: [TitleAgent]
    code: 200
    input: [expected_search_order_version, "closing_date?", "association_id?"]
    output: SearchOrder
    side_effects:
      - "increments SearchOrder.version by 1"
      - "closing_date change: re-evaluate estoppel staleness — any RECEIVED estoppel with valid_through < new closing_date causes SearchOrder to revert from VERIFICATION/READY_FOR_DELIVERY to RESEARCH_IN_PROGRESS (verification cleared); ERR_CLOSING_DATE_PASSED when the new date is before the clock date"
      - "association_id change: DRAFT/ORDERED/OVERDUE estoppels of the old association -> CANCELLED and a new DRAFT estoppel is spawned; rejected when any estoppel is RECEIVED (ERR_INVALID_STATE_TRANSITION); ERR_ASSOCIATION_JURISDICTION_MISMATCH when the new association belongs to another jurisdiction"
  - method: POST
    path: "/search-orders/{id}/identify-jurisdiction"
    description: "Identify the governing jurisdiction, pin the in-force statute, and spawn research tasks + estoppel draft"
    roles: [ResearchAnalyst]
    code: 200
    input: [jurisdiction_id]
    output: SearchOrder
    side_effects:
      - "INTAKE -> RESEARCH_IN_PROGRESS; statute_id pinned; increments SearchOrder.version by 1"
      - "For RUSH orders: requested jurisdiction_id must equal the create-time capacity candidate (ERR_INVALID_REQUEST otherwise)"
      - "Spawn ResearchTask (PENDING) per ACTIVE department with fee snapshots"
      - "Spawn EstoppelOrder (DRAFT) when association_id is set"
  - method: POST
    path: "/search-orders/{id}/cancel"
    description: "Cancel a non-delivered order (owner only); cascades to tasks, estoppels, discrepancies, deliveries"
    roles: [TitleAgent]
    code: 200
    input: []
    output: SearchOrder
    side_effects: ["status -> CANCELLED with §1.2 cascades"]
  - method: POST
    path: "/search-orders/{id}/submit-for-verification"
    description: "Move order to VERIFICATION once research and estoppels are complete and current"
    roles: [ResearchAnalyst]
    code: 200
    input: []
    output: SearchOrder
    side_effects: ["status -> VERIFICATION; research_completed_by_user_id = X-User-ID"]
  - method: POST
    path: "/search-orders/{id}/verify-payoff"
    description: "QA independently verifies the payoff total (SoD-enforced)"
    roles: [QAReviewer]
    code: 200
    input: [verified_payoff_total_cents]
    output: SearchOrder
    side_effects: ["status -> READY_FOR_DELIVERY; payoff_verified_by_user_id / payoff_verified_at set"]
  - method: POST
    path: "/search-orders/{id}/reject-verification"
    description: "QA rejects verification; order returns to RESEARCH_IN_PROGRESS"
    roles: [QAReviewer]
    code: 200
    input: [reason]
    output: SearchOrder
    side_effects: ["status -> RESEARCH_IN_PROGRESS; verification fields cleared"]
  - method: GET
    path: "/search-orders/{id}/summary"
    description: "Computed read: order totals, current liability-cap projection (5-step algorithm over current totals), task/estoppel/discrepancy/delivery status breakdowns"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: []
    output: "{ total_payoff_cents: integer, total_fees_cents: integer, pending_claims_cents: integer, total_liability_cents: integer, projected_coverage_fee_cents: integer, projected_liability_cap_cents: integer, task_counts: object, estoppel_count: integer, open_discrepancy_count: integer, latest_delivery_status: string }"
    side_effects: []

  # --- ResearchTask ---
  - method: GET
    path: "/search-orders/{id}/research-tasks"
    description: "List research tasks of an order"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ResearchTask[]"
    side_effects: []
  - method: GET
    path: "/research-tasks/{id}"
    description: "Get a research task"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: []
    output: ResearchTask
    side_effects: []
  - method: POST
    path: "/research-tasks/{id}/record-findings"
    description: "Record or overwrite findings (auto-starts PENDING tasks; retries UNABLE_TO_REACH; OCC-guarded)"
    roles: [ResearchAnalyst]
    code: 200
    input: [expected_research_task_version, findings]
    output: ResearchTask
    side_effects:
      - "increments ResearchTask.version by 1"
      - "status PENDING/UNABLE_TO_REACH -> IN_PROGRESS; findings_recorded = true; unpaid_balance_cents recomputed per task_unpaid_balance"
  - method: POST
    path: "/research-tasks/{id}/complete"
    description: "Complete a task once findings are recorded"
    roles: [ResearchAnalyst]
    code: 200
    input: []
    output: ResearchTask
    side_effects: ["status -> COMPLETED; fee_charged_cents computed; order totals updated"]
  - method: POST
    path: "/research-tasks/{id}/mark-unreachable"
    description: "Mark a task UNABLE_TO_REACH with a reason"
    roles: [ResearchAnalyst]
    code: 200
    input: [reason]
    output: ResearchTask
    side_effects: ["status -> UNABLE_TO_REACH; unreachable_reason set"]

  # --- EstoppelOrder ---
  - method: GET
    path: "/search-orders/{id}/estoppel-orders"
    description: "List estoppel orders of an order"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "EstoppelOrder[]"
    side_effects: []
  - method: GET
    path: "/estoppel-orders/{id}"
    description: "Get an estoppel order"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: []
    output: EstoppelOrder
    side_effects: []
  - method: POST
    path: "/estoppel-orders/{id}/place"
    description: "Place the estoppel order with the association (DRAFT -> ORDERED; EXPIRED -> ORDERED renewal)"
    roles: [ResearchAnalyst]
    code: 200
    input: [fee_quoted_cents]
    output: EstoppelOrder
    side_effects: ["ordered_at / statutory_due_at set per estoppel_timeline; renewal_count incremented on renewal"]
  - method: POST
    path: "/estoppel-orders/{id}/receive"
    description: "Record receipt of the estoppel letter (on-time from ORDERED, late from OVERDUE with fee forfeiture)"
    roles: [ResearchAnalyst]
    code: 200
    input: [payoff_amount_cents]
    output: EstoppelOrder
    side_effects: ["status -> RECEIVED; fee charged per estoppel_fee_charge; valid_through set; order totals updated"]
  - method: POST
    path: "/estoppel-orders/{id}/cancel"
    description: "Cancel a DRAFT/ORDERED/OVERDUE estoppel (e.g., association declined)"
    roles: [ResearchAnalyst]
    code: 200
    input: []
    output: EstoppelOrder
    side_effects: ["status -> CANCELLED; no fee impact (never received)"]

  # --- Discrepancy ---
  - method: POST
    path: "/discrepancies"
    description: "File a discrepancy against an order (owner TitleAgent); MISSED_ITEM is only valid post-delivery"
    roles: [TitleAgent]
    code: 201
    input: [search_order_id, subject_type, subject_id, discrepancy_type, claimed_amount_cents, description]
    output: Discrepancy
    side_effects:
      - "status = OPEN; filed_by_user_id = X-User-ID; post_delivery = (order.status == DELIVERED)"
      - "SearchOrder.pending_claims_cents += claimed_amount_cents"
      - "ERR_DISCREPANCY_NOT_APPLICABLE when MISSED_ITEM is filed before delivery or on a CANCELLED order"
  - method: GET
    path: "/discrepancies/{id}"
    description: "Get a discrepancy"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: []
    output: Discrepancy
    side_effects: []
  - method: GET
    path: "/search-orders/{id}/discrepancies"
    description: "List discrepancies of an order"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Discrepancy[]"
    side_effects: []
  - method: POST
    path: "/discrepancies/{id}/start-review"
    description: "QA opens review"
    roles: [QAReviewer]
    code: 200
    input: []
    output: Discrepancy
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/discrepancies/{id}/resolve"
    description: "Resolve a discrepancy (SoD: resolver != filer); confirmed resolutions trigger the correction/liability cascades"
    roles: [QAReviewer]
    code: 200
    input: [resolution_outcome, "confirmed_amount_cents?"]
    output: Discrepancy
    side_effects: ["status -> RESOLVED; pending claims released; cascades per §1.2 Discrepancy resolve"]

  # --- Delivery ---
  - method: POST
    path: "/deliveries"
    description: "Create a READY delivery for a READY_FOR_DELIVERY order; rejected when another READY delivery exists"
    roles: [QAReviewer]
    code: 201
    input: [search_order_id]
    output: Delivery
    side_effects: ["status = READY; ERR_DELIVERY_ALREADY_PENDING when a READY delivery exists; ERR_ORDER_NOT_DELIVERABLE when order not READY_FOR_DELIVERY"]
  - method: GET
    path: "/deliveries/{id}"
    description: "Get a delivery"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: []
    output: Delivery
    side_effects: []
  - method: GET
    path: "/search-orders/{id}/deliveries"
    description: "List deliveries of an order"
    roles: [TitleAgent, ResearchAnalyst, QAReviewer, ProviderAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Delivery[]"
    side_effects: []
  - method: POST
    path: "/deliveries/{id}/deliver"
    description: "Deliver the result package to the title/closing agent; freezes the liability snapshot"
    roles: [QAReviewer]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status -> DELIVERED; snapshots frozen; SearchOrder -> DELIVERED"]
  - method: POST
    path: "/deliveries/{id}/acknowledge"
    description: "Title/closing agent acknowledges receipt"
    roles: [TitleAgent]
    code: 200
    input: []
    output: Delivery
    side_effects: ["status -> ACKNOWLEDGED (owner only)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not allowed for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, non-positive fee_quoted_cents, negative payoff_amount_cents, RUSH without service_date/jurisdiction_id, RUSH identify-jurisdiction with a jurisdiction different from the capacity candidate" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Resource not in a state that permits the transition; includes terminal-state lockdown" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the current version (OCC)" }
  - { id: ERR_NOT_ORDER_OWNER, http: 403, condition: "X-User-ID does not match SearchOrder.title_agent_id for an owner-only operation" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation of duties breached: verifier completed the research, or resolver filed the discrepancy" }
  - { id: ERR_ASSOCIATION_JURISDICTION_MISMATCH, http: 422, condition: "Association belongs to a different jurisdiction than the order's" }
  - { id: ERR_NO_STATUTE_IN_FORCE, http: 422, condition: "No statute window covers the current clock date for the identified jurisdiction" }
  - { id: ERR_FEE_EXCEEDS_STATUTORY_CAP, http: 422, condition: "Association registration fee exceeds the in-force statute cap" }
  - { id: ERR_STATUTE_WINDOW_OVERLAP, http: 422, condition: "Statute window overlaps an existing window of the same jurisdiction (half-open; adjacency allowed)" }
  - { id: ERR_SERVICE_DATE_PAST, http: 422, condition: "RUSH service_date is before the current clock date" }
  - { id: ERR_CLOSING_DATE_PASSED, http: 422, condition: "closing_date is before the current clock date (create, PATCH, or deliver time)" }
  - { id: ERR_RUSH_NOT_SUPPORTED, http: 409, condition: "An ACTIVE department of the jurisdiction does not support rush" }
  - { id: ERR_RUSH_CAPACITY_FULL, http: 409, condition: "occupant_count >= rush_daily_capacity for the jurisdiction and service_date" }
  - { id: ERR_DUPLICATE_ACTIVE_SEARCH, http: 409, condition: "Another non-cancelled order for the same parcel has an overlapping service window" }
  - { id: ERR_DUPLICATE_DEPARTMENT_TYPE, http: 409, condition: "An ACTIVE department with the same dept_type already exists for the jurisdiction" }
  - { id: ERR_TASKS_OUTSTANDING, http: 409, condition: "submit-for-verification with a task still PENDING or IN_PROGRESS" }
  - { id: ERR_ESTOPPEL_NOT_CURRENT, http: 409, condition: "submit-for-verification with an estoppel not in RECEIVED" }
  - { id: ERR_ESTOPPEL_STALE_FOR_CLOSING, http: 422, condition: "An estoppel's valid_through is before closing_date at submit-for-verification" }
  - { id: ERR_QUOTE_EXCEEDS_STATUTORY_CAP, http: 422, condition: "fee_quoted_cents exceeds the pinned statute estoppel_fee_cap_cents (or cap is 0)" }
  - { id: ERR_SUBJECT_NOT_IN_ORDER, http: 409, condition: "Discrepancy subject does not belong to the given search order" }
  - { id: ERR_DISCREPANCY_NOT_APPLICABLE, http: 409, condition: "MISSED_ITEM filed pre-delivery or on a CANCELLED order" }
  - { id: ERR_CLAIM_AMOUNT_INVALID, http: 422, condition: "claimed_amount_cents <= 0 or > MAX_CLAIM_CENTS (25000000)" }
  - { id: ERR_PAYOFF_MISMATCH, http: 409, condition: "verified_payoff_total_cents != computed total_payoff_cents" }
  - { id: ERR_ORDER_NOT_DELIVERABLE, http: 409, condition: "Delivery created or delivered while order is not READY_FOR_DELIVERY" }
  - { id: ERR_DELIVERY_ALREADY_PENDING, http: 409, condition: "A READY delivery already exists for the order" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TitleAgent
    description: "Title/closing agent that orders searches, files discrepancies, and acknowledges deliveries"
    identity: opaque
    exclusive_operations:
      - "POST /search-orders"
      - "PATCH /search-orders/{id}"
      - "POST /search-orders/{id}/cancel"
      - "POST /discrepancies"
      - "POST /deliveries/{id}/acknowledge"
    shared_operations:
      - "All GET endpoints (Any)"
  - name: ResearchAnalyst
    description: "Provider analyst: identifies jurisdiction, works research tasks, places/receives estoppels"
    identity: opaque
    exclusive_operations:
      - "POST /search-orders/{id}/identify-jurisdiction"
      - "POST /search-orders/{id}/submit-for-verification"
      - "POST /research-tasks/{id}/record-findings"
      - "POST /research-tasks/{id}/complete"
      - "POST /research-tasks/{id}/mark-unreachable"
      - "POST /estoppel-orders/{id}/place"
      - "POST /estoppel-orders/{id}/receive"
      - "POST /estoppel-orders/{id}/cancel"
    shared_operations:
      - "All GET endpoints (Any)"
  - name: QAReviewer
    description: "Independent verifier: verifies payoffs, reviews/resolves discrepancies, delivers results"
    identity: opaque
    exclusive_operations:
      - "POST /search-orders/{id}/verify-payoff"
      - "POST /search-orders/{id}/reject-verification"
      - "POST /discrepancies/{id}/start-review"
      - "POST /discrepancies/{id}/resolve"
      - "POST /deliveries"
      - "POST /deliveries/{id}/deliver"
    shared_operations:
      - "All GET endpoints (Any)"
  - name: ProviderAdmin
    description: "Provider back office: maintains jurisdictions, statutes, departments, associations; owns the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /jurisdictions"
      - "POST /statutes"
      - "POST /departments"
      - "POST /associations"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints (Any)"
  - name: Any
    description: "Every authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET endpoints throughout §1.5"
