            - { call: "POST /promo-events", payload: { product_id: "${p1}", promo_type: "OFF_INVOICE", discount_pct_bps: 1000, start_date: "2026-05-01", end_date: "2026-05-31" }, as: SalesRep }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: WholesaleAdmin }
            - { call: "POST /purchase-orders", payload: { retailer_id: "${ret_id}", order_guide_id: "${g1}", lines: [ { product_id: "${p1}", cases_qty: 50, split_units_qty: 0 }, { product_id: "${q1}", cases_qty: 0, split_units_qty: 20 } ] }, as: StoreManager, as_user_id: "${ret_id}", captures: { po_id: $.data.id, po_ver: $.data.version } }
