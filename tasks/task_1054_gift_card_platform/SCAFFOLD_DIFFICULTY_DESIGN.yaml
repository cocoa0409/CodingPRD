          assert:
            - "response.data.error_id == ERR_VELOCITY_EXCEEDED"
            - "GiftCard.${c_id}.balance_cents == 5000"

      - name: max_balance_inclusive_boundary_on_reload
        grounds:
          - "validations[priority=14]"
          - entities.CardProgram.fields.max_balance_cents
          - entities.GiftCard.fields.balance_cents
        distinguishing_aspect: "A reload of 10000 onto a card at balance 90000 lands exactly at max_balance_cents 100000 and is ACCEPTED (inclusive boundary), whereas a reload of 10001 would be rejected ERR_MAX_BALANCE_EXCEEDED — boundary on a currency AMOUNT reached through POST /gift-cards/{id}/reload (a different metric and endpoint than velocity count)."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE (max_balance 100000); one card ACTIVE loaded 90000; no running campaign (no bonus)."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /merchants/${m_id}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /card-programs", payload: { merchant_id: "${m_id}", name: "P", expiry_months: 12, max_balance_cents: 100000, min_load_cents: 500 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { p_id: "$.data.id" } }
            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 90000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
          trigger:
