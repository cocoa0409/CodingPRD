            - call: "POST /wholesale/allocation-runs"
              payload: { period: "2026-09", model_line_id: "${l4_id}", base_units: 5, lookback_start: "2026-06-01T00:00:00Z", lookback_end: "2026-09-01T00:00:00Z", retail_priority_pct: 0 }
              as: RegionalAllocator
