      - name: resale_ask_price_equal_to_cap_accepted_and_one_cent_over_refused
        grounds:
          - calculations.resale_price_cap
          - validations[priority=35]
          - errors.ERR_PRICE_CAP_EXCEEDED
          - state_machines.ResaleListing.LISTED_to_DELISTED
          - concurrency_rules[resale-listing-create-stale-ticket]
        distinguishing_aspect: |
          The cap comparison is ask_price_cents <= cap_price_cents, i.e. equality is
          ACCEPTED. With face 12000 under VENUE_POLICY the cap is
          min(12000 + round_half_up(12000 * 0.30), 12000 + 2500) == 14500, and the three
          adjacent asks 14500 / 14501 / 14499 must resolve to accept / refuse / accept.
          One cent is the entire difference between the first two.
        test_recipe:
          setup:
            - "Event ON_SALE with price_cap_regime VENUE_POLICY; AccessZone GA1; Ada verified with a PAID 12000-cent ticket (unbound is fine for listing)."
