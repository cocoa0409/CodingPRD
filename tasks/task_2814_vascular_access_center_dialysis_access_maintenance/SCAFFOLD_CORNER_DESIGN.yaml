        claim_type: violation_error
        grounds:
          - validations.priority_26_ERR_CONVERSION_NOT_INDICATED
          - state_machines.AccessConversionPlan.DRAFT_to_ACTIVE
        distinguishing_aspect: "The indication gate is an OR of two independent facts about from_access: TUNNELED_CATHETER type, or intervention_burden_score >= 4. A never-intervened AVF satisfies neither, so the DRAFT plan cannot be activated even though the target access is a perfectly convertible PLANNED AVG."
        test_recipe:
          setup:
            - "one IN_USE AVF with zero interventions (burden 0), one PLANNED AVG target and a DRAFT plan between them"
          setup_api_calls:
