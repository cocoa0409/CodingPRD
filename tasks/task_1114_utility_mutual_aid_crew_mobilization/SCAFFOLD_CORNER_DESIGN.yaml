  # ==========================================================================
  # Section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: val_missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "A request without X-User-ID/X-User-Role fails priority-1 auth with 400 before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /mutual-aid/events"
              payload: { event_name: "X", host_utility_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (http 400)"

      - name: val_forbidden_role_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN_FOR_ROLE]"
          - "roles[ProgramAdmin]"
        distinguishing_aspect: "RespondingCoordinator calling the ProgramAdmin-exclusive event activate is rejected 403 even though the event exists."
        test_recipe:
          setup: ["Event OPEN exists"]
          setup_api_calls:
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Host Power", company_code: "HST", role_capability: "BOTH", home_region: "Coastal" }, as: ProgramAdmin, captures: { host_id: "$.data.id" } }
            - { call: "POST /mutual-aid/utility-companies", payload: { name: "Responder Electric", company_code: "RSP", role_capability: "RESPONDING", home_region: "Inland" }, as: ProgramAdmin, captures: { rsp_id: "$.data.id" } }
            - { call: "POST /mutual-aid/events", payload: { event_name: "Hurricane Idalia", host_utility_id: "${host_id}", event_type: "STORM", declared_start_date: "2026-05-02", premium_window_start: "2026-05-02", premium_window_end: "2026-05-20", mobilization_deadline: "2026-05-10T18:00:00Z" }, as: ProgramAdmin, captures: { ev_id: "$.data.id" } }
          trigger:
            - { call: "POST /mutual-aid/events/${ev_id}/activate", payload: {}, as: RespondingCoordinator, as_user_id: "${rsp_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_FORBIDDEN_FOR_ROLE (http 403)"

      - name: val_scope_mismatch_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_SCOPE_MISMATCH]"
        distinguishing_aspect: "A HostCoordinator whose X-User-ID is a DIFFERENT company than the event's host is rejected 403 on confirm_arrival — role alone is not enough."
        test_recipe:
          setup: ["Event ACTIVE (host HST); ACCEPTED request with one COMMITTED crew; second company OTHER exists"]
          setup_api_calls:
