            - call: "POST /nmtc/qeis/${qei_id}/unwind-transactions"
              payload: { call_holder_user_id: "${cde_id}" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { unwind_id: $.data.id }
          assert:
            - "PRECONDITION — QEI.${qei_id}.compliance_years_completed == 6 and compliance_status == COMPLIANT before the first trigger call"
            - "DEPENDENCY UNSATISFIED — the first POST /nmtc/qeis/{id}/unwind-transactions returns 422 with error_id == \"ERR_COMPLIANCE_PERIOD_NOT_COMPLETE\" even though the clock is already at issued_at + 2555 days"
            - "GET /nmtc/qeis/${qei_id}/unwind-transactions returns total_count == 0 after the refusal"
            - "AnnualComplianceTest.${test_y7_id}.result == PASS, measured_pct_direct == 89.47, window_start_at == \"2032-08-30T00:00:00.000Z\", window_end_at == \"2033-08-30T00:00:00.000Z\""
            - "DEPENDENCY SATISFIED — QEI.${qei_id}.compliance_years_completed == 7 and the second unwind request returns 201"
            - "UnwindTransaction.${unwind_id}.status == OPTION_WINDOW_OPEN, option_window_open_at == \"2033-08-30T00:00:00.000Z\", option_window_close_at == \"2033-11-28T00:00:00.000Z\""
            - "UnwindTransaction.${unwind_id}.fund_residual_value_cents == 60000000, put_price_cents == 100000, call_price_cents == 1500000"
            - "UnwindTransaction.${unwind_id}.put_holder_user_id == \"investor-delta\" (taken from the fund, never from the body) and call_holder_user_id == \"${cde_id}\""
            - "QALICB.${qalicb_id}.eligibility_status == RECERTIFICATION_DUE (swept by the year-2 test at 2028-08-31, which is more than 365 days after the 2026-09-01 certification) and every annual test still PASSED at 89.47"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: job_report_periods_are_closed_intervals_so_a_shared_endpoint_instant_collides
        grounds:
          - validations[priority=19]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - endpoints[POST /nmtc/community-benefits-agreements/{id}/job-reports]
          - entities.JobReport.fields.period_start_at
        distinguishing_aspect: |
          Interval semantics under test: CLOSED [period_start_at, period_end_at] with NO buffer,
          on the reporting-period resource of one CommunityBenefitsAgreement. Because both
          endpoints are inclusive, a new report starting on the exact instant an existing report
          ends DOES collide, while a report starting one day later is adjacent and legal. An
          implementation using half-open intervals accepts the colliding request.
        test_recipe:
          setup:
            - "One ACTIVE CommunityBenefitsAgreement with measurement_basis HEADCOUNT."
            - "One JobReport already filed for the CLOSED period 2026-09-01 through 2027-02-28."
            - "Logical clock at 2027-09-01 so both attempted periods are in the past."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/cdes"
              payload: { legal_name: "Delta Community Capital CDE", certification_number: "CDE-2869-014", service_area_scope: "MULTI_STATE" }
              as: CertifyingAgency
              captures: { cde_id: $.data.id }
            - call: "POST /nmtc/allocation-awards"
              payload: { cde_id: "${cde_id}", award_year: 2026, allocation_amount_cents: 5000000000, service_area_state_codes: ["MS", "LA"], min_severe_distress_share_pct: 60.00, substantially_all_method: "DIRECT_TRACING" }
              as: CertifyingAgency
              captures: { award_id: $.data.id }
            - call: "POST /nmtc/allocation-awards/${award_id}/allocation-agreement"
              payload: { signatory_name: "A. Rivers" }
              as: CDESponsor
              as_user_id: "${cde_id}"
            - call: "POST /nmtc/census-tracts"
              payload: { tract_code: "28049000100", state_code: "MS", poverty_rate_pct: 32.00, mfi_ratio_pct: 55.00, unemployment_ratio: 1.80 }
              as: CertifyingAgency
              captures: { tract_id: $.data.id }
            - call: "POST /nmtc/qalicbs"
              payload: { census_tract_id: "${tract_id}", legal_name: "Delta Foods LLC", state_code: "MS", naics_code: "311412" }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { qalicb_id: $.data.id }
            - call: "POST /nmtc/qalicbs/${qalicb_id}/eligibility-tests"
              payload: { gross_income_lic_pct: 72.00, services_lic_pct: 65.00, tangible_property_lic_pct: 88.00, collectibles_pct: 0.00, nonqualified_financial_property_pct: 1.00, location_prong_passed: true }
              as: ComplianceReviewer
              as_user_id: "reviewer-eligibility"
            - call: "POST /nmtc/community-benefits-agreements"
              payload: { qalicb_id: "${qalicb_id}", allocation_award_id: "${award_id}", target_fte_count: 25, wage_floor_cents_per_hour: 1800, local_hire_pct_target: 40.00, measurement_basis: "HEADCOUNT" }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { cba_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: CertifyingAgency
            - call: "POST /nmtc/community-benefits-agreements/${cba_id}/job-reports"
              payload: { period_start_at: "2026-09-01T00:00:00Z", period_end_at: "2027-02-28T00:00:00Z", headcount: 20, qualifying_headcount: 18, total_hours: 46000, qualifying_hours: 45000, local_hires: 12, avg_hourly_wage_cents: 1950 }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { report_1_id: $.data.id }
          trigger:
            - call: "POST /nmtc/community-benefits-agreements/${cba_id}/job-reports"
              payload: { period_start_at: "2027-02-28T00:00:00Z", period_end_at: "2027-08-31T00:00:00Z", headcount: 10, qualifying_headcount: 6, total_hours: 20800, qualifying_hours: 12480, local_hires: 5, avg_hourly_wage_cents: 1750 }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
            - call: "POST /nmtc/community-benefits-agreements/${cba_id}/job-reports"
              payload: { period_start_at: "2027-03-01T00:00:00Z", period_end_at: "2027-08-31T00:00:00Z", headcount: 10, qualifying_headcount: 6, total_hours: 20800, qualifying_hours: 12480, local_hires: 5, avg_hourly_wage_cents: 1750 }
              as: QALICBSponsor
              as_user_id: "sponsor-delta"
              captures: { report_2_id: $.data.id }
          assert:
            - "SHARED ENDPOINT COLLIDES — the first trigger (starting exactly on 2027-02-28, the existing report's end instant) returns 409 with error_id == \"ERR_REPORT_PERIOD_OVERLAP\""
            - "ADJACENT IS LEGAL — the second trigger (starting 2027-03-01, one day after the existing end) returns 201"
            - "JobReport.${report_2_id}.wage_floor_met == false (1750 is below the 1800 cent floor) and period_start_at == \"2027-03-01T00:00:00.000Z\""
            - "GET /nmtc/community-benefits-agreements/${cba_id}/job-reports returns total_count == 2 — the refused report was never persisted"
            - "JobReport.${report_1_id}.period_end_at == \"2027-02-28T00:00:00.000Z\" and wage_floor_met == true (unchanged)"
            - "CommunityBenefitsAgreement.${cba_id}.status == ACTIVE and report_count == 2"

      - name: qalicb_compliance_period_occupancy_is_half_open_with_a_30_day_buffer_and_a_same_award_exemption
        grounds:
          - validations[priority=20]
          - errors[ERR_QALICB_COMPLIANCE_PERIOD_CONFLICT]
          - entities.QEI.fields.issued_at
          - endpoints[POST /nmtc/qlicis]
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource: the seven-year occupancy of a
          QALICB by an award, expressed as the HALF-OPEN window
          [issued_at - 30 days, issued_at + 2555 days + 30 days) with a symmetric 30-day buffer
          and an explicit same-award exemption — versus the closed, unbuffered JobReport periods.
          The contended resource is the QALICB itself, not a reporting calendar, and the conflict
          is only raised for QEIs from a DIFFERENT allocation_award_id.
