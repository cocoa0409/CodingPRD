  - section: rbac
    instances:
      - name: peer_inspectors_and_peer_applicators_cannot_write_to_each_others_rows
        claim_type: peer_roles
        grounds:
          - roles.FieldInspector
          - roles.Applicator
          - validations[priority=30]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: >-
          FieldInspector and Applicator are both entity_backed on Inspector, so two holders of the
          same role are peers: the role check at priority 20 passes and only the ownership check at 30
          separates them. The refusal is 403 ERR_NOT_RESOURCE_OWNER, never 404 and never
          ERR_UNAUTHORIZED — the row is visible to both, just not writable by the wrong one.
        test_recipe:
