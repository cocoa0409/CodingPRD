            - "the vote at exactly 2026-08-15T00:00:00Z fails with ERR_ROUND_DEADLINE_PASSED (409), so ${cast2} is still 1 - the vote row was never appended"
            - "the sweep at the same instant DOES fire: ${st2} == REVISION_REQUESTED, ${swept2} == true and ${dec2} == 2026-08-15T00:00:00Z"
            - "${pst} == REVISION_REQUESTED - a lapsed deadline counts as a revision request with no vote at all"
            - "the round-create with decision_deadline_at exactly equal to the current instant fails with ERR_DEADLINE_IN_PAST (422); one second later succeeds with ${rn} == 2"

      - name: flow_score_sixty_point_zero_passes_and_fifty_nine_point_four_nine_does_not
        grounds:
          - calculations.package_flow_and_accessibility
          - validations.priority_58
          - entities.DesignPackage.fields.flow_capacity_score
          - entities.DesignPackage.fields.accessibility_pass
        distinguishing_aspect: |
          All three accessibility gates use >=, and all three are probed on the
          boundary with the other two held exactly at their minimum. The
          circulation figures are chosen so the score lands on 60.00 exactly
          (117.0 / (300 * 0.65) == 0.6 -> 60.00) and one square metre less lands
          on 59.49 after round_half_up to two decimals (116.0 / 195.0 * 100 ==
          59.487179...). An implementation that rounds to whole numbers reads
          the second case as 59 or 60 and an implementation that rounds half-even
          or truncates gets 59.48. The egress and turning-radius gates are
          probed at 112 vs 111 and 76 vs 75 with the score held at a passing
          value, so exactly one gate fails per request.
        test_recipe:
          setup:
            - "project advanced to phase SCHEMATIC with no design package yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
              payload: { name: "Deep Time Hall", museum_name: "Ridgeline Museum", storyline_title: "Deep Time: Reading the Rock Record", objective_codes: ["OBJ-STRATA", "OBJ-EXTINCTION"], target_open_date: "2027-05-01T00:00:00Z", contract_value_cents: 9000000 }
              as: ProjectManager
              as_user_id: pm-01
              captures: { proj: $.data.id }
            - call: "POST /exhibit-projects/${proj}/advance-phase"
              payload: { to_phase: "SCHEMATIC" }
              as: ProjectManager
              as_user_id: pm-01
          trigger:
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv1: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv1}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 300, circulation_area_sqm: 117.0 }
              as: AccessibilitySpecialist
              as_user_id: acc-01
              captures: { pkgOK: $.data.id, score1: $.data.flow_capacity_score, pass1: $.data.accessibility_pass }
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv2: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv2}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 300, circulation_area_sqm: 116.0 }
              as: AccessibilitySpecialist
              as_user_id: acc-01
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv3: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv3}", stage: "SCHEMATIC", egress_clear_width_cm: 111, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 300, circulation_area_sqm: 117.0 }
              as: AccessibilitySpecialist
              as_user_id: acc-01
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv4: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv4}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 75, peak_visitors_per_hour: 300, circulation_area_sqm: 117.0 }
              as: AccessibilitySpecialist
              as_user_id: acc-01
            - call: "GET /exhibit-projects/${proj}"
              payload: {}
              as: ProjectManager
              as_user_id: pm-01
              captures: { pv5: $.data.version }
            - call: "POST /exhibit-projects/${proj}/design-packages"
              payload: { expected_project_version: "${pv5}", stage: "SCHEMATIC", egress_clear_width_cm: 112, wheelchair_turning_radius_cm: 76, peak_visitors_per_hour: 180, circulation_area_sqm: 95.0 }
              as: AccessibilitySpecialist
              as_user_id: acc-01
              captures: { score5: $.data.flow_capacity_score }
          assert:
            - "call 1 -> 201 with ${score1} == 60.00 and ${pass1} == true; 60.00 >= MIN_FLOW_SCORE 60.0 passes on equality"
            - "call 2 -> ERR_ACCESSIBILITY_REQUIREMENTS_UNMET (422): the score would be 59.49, i.e. round_half_up(59.487179..., 2), and no package row is persisted"
            - "call 3 -> ERR_ACCESSIBILITY_REQUIREMENTS_UNMET: egress 111 < 112 while the score is a passing 60.00"
            - "call 4 -> ERR_ACCESSIBILITY_REQUIREMENTS_UNMET: turning radius 75 < 76 while the score is a passing 60.00"
            - "call 5 -> 201 with ${score5} == 81.20 == round_half_up(95.0 / 117.0 * 100, 2), confirming the two-decimal rounding away from the boundary too"
            - "the three rejections left the project version untouched, so each subsequent expected_project_version read is unchanged except after the two successes"
            - "call 5 supersedes the package created by call 1, because both have stage SCHEMATIC"

      - name: offgassing_verdict_at_the_limit_and_at_exactly_twice_the_limit
        grounds:
          - calculations.material_offgassing_verdict
          - validations.priority_70
          - validations.priority_50
          - state_machines.MaterialSpec.CONSERVATOR_REVIEW_to_CONDITIONAL
        distinguishing_aspect: |
          The verdict has a three-branch pinned order and two different
          thresholds on the same number: the UNSAFE branch fires above TWICE the
          limit, the CONSERVATION_SAFE branch requires at or below the limit,
          and everything between is CONDITIONAL_SAFE. Six specs probe both
          edges - 0.05 == the limit, 0.10 == exactly twice the limit (still not
          UNSAFE, because the test is strictly greater), 0.11 just over, and a
          cure_days one day short of the minimum - plus the fact that the limit
          map is keyed on used_in, so identical chamber numbers are
          CONDITIONAL_SAFE for a CASE_INTERIOR and CONSERVATION_SAFE for a
          GRAPHIC. An UNTESTED Oddy result is UNSAFE regardless of how clean
          the chemistry is, and its spec cannot even reach conservator review.
        test_recipe:
          setup:
            - "project in phase INTERPRETIVE (material specs may be raised from the very first phase)"
            - "six specs created; CASE_INTERIOR limits are VOC 0.05, formaldehyde 0.02, cure 21 days, GRAPHIC limits are VOC 0.80, formaldehyde 0.10, cure 3 days"
