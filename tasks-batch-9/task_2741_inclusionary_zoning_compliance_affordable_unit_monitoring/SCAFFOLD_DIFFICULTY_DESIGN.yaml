  # ===========================================================================
  # RULE 5 — priority-ordered validation conflicts on two different category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: superseded_fee_payment_state_beats_fiscal_overpayment
        conflict_pair: "state (priority 19, ERR_FEE_NOT_PAYABLE) vs business_fiscal (priority 43, ERR_PAYMENT_EXCEEDS_BALANCE)"
        grounds:
          - validations.priority_19
          - validations.priority_43
          - state_machines.InLieuFee.state
          - calculations.substitution_fee_selection
        distinguishing_aspect: |
          Category pair: state vs business_fiscal, both declared on
          POST /iz-compliance/in-lieu-fees/{fee_id}/payments. A single request violates both:
          the assessment was SUPERSEDED by the reinstate compensating action so no payment is
          admissible at all, and the amount 999999999 also exceeds the outstanding balance of
          24467400. The lower-numbered state guard must answer, so the response is
          ERR_FEE_NOT_PAYABLE with HTTP 409 — never ERR_PAYMENT_EXCEEDS_BALANCE with 422.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ordinance IZ-2024-01 and AmiSchedule 2026 published."
            - "Project (R-2, 10 units) ONSITE with agreement recorded and one RENTAL 2-bedroom unit."
            - "The unit is withdrawn, which cascades a SUBSTITUTION InLieuFee of 24467400 cents in state ASSESSED."
            - "The unit is then reinstated, which supersedes that assessment (paid_amount_cents is still 0, so the compensating action is allowed)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/ordinances", payload: { code: "IZ-2024-01", effective_date: "2024-01-01", min_project_units_threshold: 10, set_aside_bps_by_district: { "R-2": 1000, "R-4": 1500, "C-2": 2000 }, gap_basis_cents_by_level: { "5000": 24000000, "8000": 18000000, "12000": 12000000 }, fee_gap_level_bps: 5000, surcharge_bps: 350, surcharge_cap_cents: 5000000, discount_tiers: [ { min_pre_discount_cents: 0, discount_bps: 0 }, { min_pre_discount_cents: 20000000, discount_bps: 150 }, { min_pre_discount_cents: 100000000, discount_bps: 400 } ], fee_due_days: 45, alternative_paths_allowed: ["IN_LIEU_FEE", "OFFSITE"] }, as: ProgramAdministrator, captures: { ord_id: $.data.id } }
            - { call: "POST /iz-compliance/ami-schedules", payload: { effective_year: 2026, median_income_cents_by_size: { "1": 9868000, "2": 11278000, "3": 12669800, "4": 14082000, "5": 15214000 }, utility_allowance_cents_by_bedrooms: { "0": 8500, "1": 11000, "2": 14500, "3": 18000 } }, as: ProgramAdministrator, captures: { ami26_id: $.data.id } }
            - { call: "POST /iz-compliance/projects", payload: { name: "Quarry Bend", zoning_district: "R-2", total_units: 10, approval_date: "2026-01-15" }, as: Developer, as_user_id: "dev-1", captures: { p_id: $.data.id } }
            - { call: "POST /iz-compliance/projects/${p_id}/screen", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/projects/${p_id}/elect-path", payload: { compliance_path: "ONSITE" }, as: Developer, as_user_id: "dev-1" }
            - { call: "POST /iz-compliance/regulatory-agreements", payload: { project_id: "${p_id}", term_years: 45, resale_formula: "AMI_INDEXED", owner_appreciation_share_bps: 2500, max_refinance_ltv_bps: 9000 }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { a_id: $.data.id } }
            - { call: "POST /iz-compliance/regulatory-agreements/${a_id}/record", payload: { doc_number: "DOC-QB-0001", recorded_at: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1" }
            - { call: "POST /iz-compliance/affordable-units", payload: { project_id: "${p_id}", agreement_id: "${a_id}", unit_number: "Q-101", bedrooms: 2, sqft: 900, market_comparable_sqft: 1000, tenure: "RENTAL", affordability_level_bps: 5000 }, as: Developer, as_user_id: "dev-1", captures: { u_id: $.data.id } }
            - { call: "POST /iz-compliance/affordable-units/${u_id}/withdraw", payload: { reason: "Podium redesign removed the unit." }, as: Developer, as_user_id: "dev-1" }
            - { call: "GET /iz-compliance/in-lieu-fees", payload: { project_id: "${p_id}", basis: "SUBSTITUTION" }, as: ProgramAdministrator, captures: { fee_id: "$.data[0].id" } }
            - { call: "POST /iz-compliance/affordable-units/${u_id}/reinstate", payload: {}, as: Developer, as_user_id: "dev-1" }
          trigger:
            - call: "POST /iz-compliance/in-lieu-fees/${fee_id}/payments"
              payload: { amount_cents: 999999999 }
              as: Developer
              as_user_id: "dev-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 with error_id ERR_FEE_NOT_PAYABLE"
            - "the response error_id is NOT ERR_PAYMENT_EXCEEDS_BALANCE even though 999999999 > 24467400"
            - "InLieuFee.${fee_id}.state is still SUPERSEDED and paid_amount_cents is still 0"
            - "Project.${p_id}.onsite_unit_equivalents_bps == 10000 and fee_covered_equivalents_bps == 0 — the rejected payment changed nothing"

