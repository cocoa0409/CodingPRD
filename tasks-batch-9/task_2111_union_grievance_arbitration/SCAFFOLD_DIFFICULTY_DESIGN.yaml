# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every `grounds:` entry resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every numeric assert below was executed against the
# §1.3 formulas and their constants before being written down.
#
# Shared operator identities used throughout:
#   LaborRelationsAnalyst    -> "lr-analyst-01"   (a second analyst "lr-analyst-02")
#   LaborRelationsDirector   -> "lr-dir-01"
#   ChiefNegotiator          -> "chief-neg-01"
#   ArbitrationAdministrator -> "arb-admin-01"
#   UnionSteward / Grievant  -> the Employee id captured in the chain
# The logical clock starts at 2026-08-01T00:00:00Z in every chain below.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: arbitration_estimated_vs_actual_cost_diverge
        grounds:
          - calculations.arbitration_case_cost
          - entities.ArbitrationDemand.fields.estimated_cost_cents
          - entities.ArbitrationDemand.fields.actual_cost_cents
          - state_machines.ArbitrationDemand.ARBITRATOR_SELECTED_to_HEARING_SCHEDULED
        distinguishing_aspect: |
          The dual variant sits on the ArbitrationDemand entity: the forward-looking
          estimate prices a study day, every merely-INVITED witness and a per-day
          transcript charge, while the chronological actual reads only POSTED CostEntry
          rows in four categories, so the same case yields 863250 and 400000.
        test_recipe:
          setup:
            - "Local 2100 agreement with default deadline and authority parameters, tolling enabled."
            - "Clause ART-12 (DISCIPLINE, arbitrable, uncapped, not expedited)."
            - "Supervisor SUP-1, grievant EMP-1 at 3500 cents/hour, witness EMP-2 at 3000 cents/hour, steward STW-1."
            - "Three AAA arbitrators: Ruth Alvarez 250000/day, Ben Chan 200000/day, Cara Dowd 200000/day, all free from 2026-08-01, ceiling 3 cases, 24h travel buffer."
            - "Grievance filed 2026-08-01 and driven through steps 1, 2 and 3, each answered DENIED, then taken to arbitration on 2026-08-14."
            - "A manual COUNSEL cost of 900000 cents borne by the employer is on the ledger."
            - "Ben Chan is the surviving candidate after the union strikes Alvarez and the employer strikes Dowd; the selection cascade has already posted a SYSTEM ARBITRATOR_FEE entry of 400000 cents."
            - "Two testimony slots for EMP-2 on 2026-10-05 are INVITED, never confirmed."
          setup_api_calls:
            - call: "POST /labor-relations/bargaining-units"
              payload: { name: "Municipal Services Local 2100", local_number: "L2100", contract_effective_date: "2025-01-01T00:00:00Z", contract_expiry_date: "2027-12-31T00:00:00Z", tolling_enabled: true }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { bu_id: $.data.id }
            - call: "POST /labor-relations/bargaining-units/${bu_id}/contract-clauses"
              payload: { clause_number: "ART-12", title: "Just Cause Discipline", category: "DISCIPLINE" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { cl_id: $.data.id }
            - call: "POST /labor-relations/employees"
              payload: { bargaining_unit_id: "${bu_id}", full_name: "Dana Fields", employee_number: "SUP-1", hire_date: "2015-03-01T00:00:00Z", seniority_date: "2015-03-01T00:00:00Z", hourly_rate_cents: 4200, classification: "SUPERVISOR" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { sup_id: $.data.id }
            - call: "POST /labor-relations/employees"
              payload: { bargaining_unit_id: "${bu_id}", full_name: "Ray Ortiz", employee_number: "EMP-1", hire_date: "2018-01-08T00:00:00Z", seniority_date: "2018-01-08T00:00:00Z", hourly_rate_cents: 3500, classification: "PRODUCTION", supervisor_id: "${sup_id}" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { emp1_id: $.data.id }
            - call: "POST /labor-relations/employees"
              payload: { bargaining_unit_id: "${bu_id}", full_name: "Nia Brooks", employee_number: "EMP-2", hire_date: "2019-05-06T00:00:00Z", seniority_date: "2019-05-06T00:00:00Z", hourly_rate_cents: 3000, classification: "PRODUCTION", supervisor_id: "${sup_id}" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { emp2_id: $.data.id }
            - call: "POST /labor-relations/employees"
              payload: { bargaining_unit_id: "${bu_id}", full_name: "Ivan Cruz", employee_number: "STW-1", hire_date: "2016-02-01T00:00:00Z", seniority_date: "2016-02-01T00:00:00Z", hourly_rate_cents: 3200, classification: "CLERICAL", supervisor_id: "${sup_id}" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { stw_id: $.data.id }
            - call: "POST /labor-relations/arbitrators"
