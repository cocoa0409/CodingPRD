scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_parcel_creation_returns_201_with_all_derived_fields_initialised
        claim_type: Creation
        grounds:
          - entities.Parcel
          - calculations.parcel_max_design_flow
          - endpoints[POST /parcels]
        distinguishing_aspect: "A 30000 sqft parcel is created with owner_user_id taken from X-User-ID, max_design_flow_gpd 1500 (the cap binds because 30000/20 = 1500), all four ledger fields 0, risk_tier LOW and transfer_hold false."
        test_recipe:
          setup:
            - "Empty database, logical clock at its default 2026-05-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /parcels"
              payload: { apn: "0856-E1", county_code: "OR", site_address: "20 First Street", lot_size_sqft: 30000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Parcel.${p_id}.owner_user_id == u-app-9"
            - "Parcel.${p_id}.max_design_flow_gpd == 1500"
            - "Parcel.${p_id}.permitted_design_flow_gpd == 0"
            - "Parcel.${p_id}.fees_assessed_cents == 0 and fees_paid_cents == 0 and fees_credited_cents == 0 and fee_balance_cents == 0"
            - "Parcel.${p_id}.open_repair_order_count == 0 and water_quality_flag == false and transfer_hold == false"
            - "Parcel.${p_id}.risk_tier == LOW"
            - "Parcel.${p_id}.version == 1"

      - name: corner_parcel_max_design_flow_uses_floor_division_below_the_cap
        claim_type: Computed Fields
        grounds:
          - calculations.parcel_max_design_flow
          - entities.Parcel.fields.max_design_flow_gpd
        distinguishing_aspect: "A 12345 sqft lot yields floor(12345 / 20) = 617 gpd, proving floor division rather than rounding and that the 1500 gpd cap only binds at or above 30000 sqft."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /parcels"
              payload: { apn: "0856-E2", county_code: "WA", site_address: "21 Odd Acre", lot_size_sqft: 12345, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
          assert:
            - "Parcel.${p_id}.max_design_flow_gpd == 617"

      - name: corner_parcel_retrieval_returns_the_stored_entity
        claim_type: Retrieval
        grounds:
          - endpoints[GET /parcels/{id}]
          - entities.Parcel
        distinguishing_aspect: "GET /parcels/{id} echoes exactly the apn, county_code, site_address, lot_size_sqft and water_source supplied at creation, inside the standard success envelope."
        test_recipe:
          setup:
            - "One parcel exists."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-E3", county_code: "OR", site_address: "22 Echo Way", lot_size_sqft: 20000, water_source: "PRIVATE_WELL" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
          trigger:
            - call: "GET /parcels/${p_id}"
              payload: {}
              as: RecordsClerk
              as_user_id: "u-rc-1"
          assert:
            - "HTTP 200"
            - "Parcel.${p_id}.apn == 0856-E3 and county_code == OR and site_address == 22 Echo Way"
            - "Parcel.${p_id}.lot_size_sqft == 20000 and water_source == PRIVATE_WELL"
            - "the response envelope carries meta.api_request_id, meta.api_request_timestamp and response_type == object"

      - name: corner_parcel_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /parcels]
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three parcels in one county and limit 2, offset 0, the list returns 2 items with total_count 3 and has_more true; offset 2 returns 1 item with has_more false."
        test_recipe:
          setup:
            - "Three parcels in county OR."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-E4A", county_code: "OR", site_address: "23 A Street", lot_size_sqft: 20000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
            - call: "POST /parcels"
              payload: { apn: "0856-E4B", county_code: "OR", site_address: "24 B Street", lot_size_sqft: 20000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
            - call: "POST /parcels"
              payload: { apn: "0856-E4C", county_code: "OR", site_address: "25 C Street", lot_size_sqft: 20000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
          trigger:
            - call: "GET /parcels"
              payload: { county_code: "OR", limit: 2, offset: 0 }
              as: RecordsClerk
              as_user_id: "u-rc-1"
            - call: "GET /parcels"
              payload: { county_code: "OR", limit: 2, offset: 2 }
              as: RecordsClerk
              as_user_id: "u-rc-1"
          assert:
            - "the first call returns 2 items with total_count == 3 and has_more == true"
            - "the second call returns 1 item with total_count == 3 and has_more == false"
            - "response_type == array"

      - name: corner_get_parcel_with_unknown_uuid_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_PARCEL_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unknown UUID on GET /parcels/{id} returns ERR_PARCEL_NOT_FOUND with HTTP 404, not an empty 200."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /parcels/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: RecordsClerk
              as_user_id: "u-rc-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PARCEL_NOT_FOUND with HTTP 404"

      - name: corner_create_parcel_missing_required_lot_size_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting lot_size_sqft, which has source input and no default, returns ERR_INVALID_REQUEST with HTTP 400 and creates no Parcel row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /parcels"
              payload: { apn: "0856-E5", county_code: "OR", site_address: "26 Incomplete Court", water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"
            - "GET /parcels returns total_count == 0"

      - name: corner_create_well_with_invalid_enum_well_type_is_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Well.fields.well_type
          - validations[priority=5]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "well_type OBSERVATION is not a member of {DOMESTIC, IRRIGATION, MONITORING} and is rejected with ERR_INVALID_REQUEST 400."
        test_recipe:
          setup:
            - "One parcel exists."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-E6", county_code: "OR", site_address: "27 Enum Road", lot_size_sqft: 20000, water_source: "PRIVATE_WELL" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /wells"
              payload: { parcel_id: "${p_id}", well_type: "OBSERVATION", location_x_ft: 0, location_y_ft: 0, depth_ft: 100 }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST with HTTP 400"

      - name: corner_create_well_under_unknown_parcel_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - errors[ERR_PARCEL_NOT_FOUND]
          - entities.Well.fields.parcel_id
        distinguishing_aspect: "A body foreign key that resolves to nothing produces ERR_PARCEL_NOT_FOUND 404 rather than a dangling Well row."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /wells"
              payload: { parcel_id: "00000000-0000-4000-8000-000000000001", well_type: "DOMESTIC", location_x_ft: 0, location_y_ft: 0, depth_ft: 100 }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PARCEL_NOT_FOUND with HTTP 404"

      - name: corner_water_sample_is_append_only_extra_field_input_ignored
        claim_type: Immutability
        grounds:
          - entities.WaterSample
          - endpoints[POST /wells/{id}/water-samples]
        distinguishing_aspect: "WaterSample declares common_fields false: the created row exposes id and created_at, the API declares no update or delete endpoint for it, and result is computed rather than accepted from the client."
        test_recipe:
          setup:
            - "One parcel with one DOMESTIC well."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-E7", county_code: "OR", site_address: "28 Sample Street", lot_size_sqft: 20000, water_source: "PRIVATE_WELL" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
            - call: "POST /wells"
              payload: { parcel_id: "${p_id}", well_type: "DOMESTIC", location_x_ft: 10, location_y_ft: 10, depth_ft: 100 }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /wells/${w_id}/water-samples"
              payload: { collected_at: "2026-05-01T06:00:00Z", nitrate_mg_l: 1.2, coliform_present: false }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-field"
              captures: { ws_id: $.data.id }
          assert:
            - "HTTP 201 and WaterSample.${ws_id}.id is a dash-formatted UUID with no type prefix"
            - "WaterSample.${ws_id}.result == PASS and exceedance_reasons == []"
            - "WaterSample.${ws_id}.collected_at == 2026-05-01T06:00:00.000Z"
            - "the API declares no PUT, PATCH or DELETE endpoint for water samples"
            - "GET /wells/${w_id}/water-samples returns total_count == 1"

      - name: corner_duplicate_apn_within_same_county_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=20]
          - errors[ERR_DUPLICATE_APN]
        distinguishing_aspect: "Uniqueness is scoped to the (apn, county_code) pair: re-using apn 0856-E8 in county OR is rejected with ERR_DUPLICATE_APN 409, while the same apn in county WA is accepted."
        test_recipe:
          setup:
            - "One parcel with apn 0856-E8 in county OR."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-E8", county_code: "OR", site_address: "29 Twin Trail", lot_size_sqft: 20000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /parcels"
              payload: { apn: "0856-E8", county_code: "OR", site_address: "30 Twin Trail", lot_size_sqft: 20000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { err: $.data.error_id }
            - call: "POST /parcels"
              payload: { apn: "0856-E8", county_code: "WA", site_address: "31 Twin Trail", lot_size_sqft: 20000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p2_id: $.data.id }
          assert:
            - "${err} == ERR_DUPLICATE_APN with HTTP 409"
            - "the second trigger call returns HTTP 201 and Parcel.${p2_id}.county_code == WA"

      - name: corner_duplicate_contractor_license_number_is_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=20]
          - errors[ERR_DUPLICATE_LICENSE_NUMBER]
        distinguishing_aspect: "Contractor.license_number is globally unique, unlike apn which is unique only within a county; a second registration with the same number is rejected with ERR_DUPLICATE_LICENSE_NUMBER 409."
        test_recipe:
          setup:
            - "One contractor registered with licence LIC-0856-Z."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { business_name: "First Septic", license_number: "LIC-0856-Z", license_class: "INSTALLER", license_expires_on: "2030-01-01T00:00:00Z", bond_amount_cents: 1000000 }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /contractors"
              payload: { business_name: "Second Septic", license_number: "LIC-0856-Z", license_class: "PUMPER", license_expires_on: "2031-01-01T00:00:00Z", bond_amount_cents: 2000000 }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_LICENSE_NUMBER with HTTP 409"
            - "Contractor.${c_id}.business_name == First Septic"

      - name: corner_contractor_effective_status_expires_strictly_after_license_date
        claim_type: Computed Fields
        grounds:
          - calculations.contractor_effective_status
          - entities.Contractor.fields.effective_status
        distinguishing_aspect: "effective_status is derived, not stored: with status ACTIVE and license_expires_on 2026-06-01T00:00:00.000Z, a clock at exactly that instant still reads ACTIVE (strict comparison) while one second later reads EXPIRED."
        test_recipe:
          setup:
            - "One ACTIVE contractor whose licence expires on 2026-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /contractors"
              payload: { business_name: "Edge Septic", license_number: "LIC-0856-Y", license_class: "DUAL", license_expires_on: "2026-06-01T00:00:00Z", bond_amount_cents: 1000000 }
              as: HealthOfficer
              as_user_id: "u-ho-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: HealthOfficer
              as_user_id: "u-ho-1"
            - call: "GET /contractors/${c_id}"
              payload: {}
              as: HealthOfficer
              as_user_id: "u-ho-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:01Z" }
              as: HealthOfficer
              as_user_id: "u-ho-1"
            - call: "GET /contractors/${c_id}"
              payload: {}
              as: HealthOfficer
              as_user_id: "u-ho-1"
          assert:
            - "at 2026-06-01T00:00:00Z, Contractor.${c_id}.effective_status == ACTIVE"
            - "at 2026-06-01T00:00:01Z, Contractor.${c_id}.effective_status == EXPIRED"
            - "Contractor.${c_id}.status == ACTIVE in both reads"

      - name: corner_transfer_inspection_expedited_defaults_to_false
        claim_type: Defaults
        grounds:
          - entities.TransferInspection.fields.expedited
          - calculations.transfer_inspection_charges
        distinguishing_aspect: "Omitting the optional expedited flag applies its declared default false, so expedite_fee_cents is 0 and total_due_cents equals subtotal_cents 18500."
        excluded_because:
          difficulty_instance: transfer_certificate_desk_review_conditional_vs_field_verified_satisfactory
          rationale: "The DESK_REVIEW leg of that instance omits expedited and asserts subtotal_cents == 18500 and total_due_cents == 18500, which is exactly the default-applied outcome."

  - section: state_machines
    instances:
      - name: corner_site_evaluation_starts_in_draft_with_empty_perc_holes
        claim_type: Initial State
        grounds:
          - state_machines.SiteEvaluation
          - entities.SiteEvaluation.fields.status
          - entities.SiteEvaluation.fields.perc_holes
        distinguishing_aspect: "A freshly created SiteEvaluation is DRAFT with revision_round 0, an empty perc_holes array, both perc-rate variants null and valid_until set to evaluated_on plus 5 years."
        test_recipe:
          setup:
            - "One parcel exists."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-S1", county_code: "OR", site_address: "32 Draft Drive", lot_size_sqft: 40000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /site-evaluations"
              payload: { parcel_id: "${p_id}", evaluated_on: "2026-04-15T00:00:00Z", soil_group: "LOAMY", depth_to_limiting_layer_in: 48 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se_id: $.data.id }
          assert:
            - "SiteEvaluation.${se_id}.status == DRAFT and revision_round == 0"
            - "SiteEvaluation.${se_id}.perc_holes == []"
            - "SiteEvaluation.${se_id}.preliminary_perc_rate_min_per_in == null and certified_perc_rate_min_per_in == null"
            - "SiteEvaluation.${se_id}.soil_loading_rate_gpd_per_sqft == null"
            - "SiteEvaluation.${se_id}.valid_until == 2031-04-15T00:00:00.000Z"
            - "SiteEvaluation.${se_id}.evaluator_user_id == u-dp-1"

      - name: corner_submit_site_evaluation_from_approved_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SiteEvaluation
          - errors[ERR_INVALID_STATE]
          - validations[priority=10]
        distinguishing_aspect: "APPROVED is not a declared `from` state for the submit trigger, so a second submit on an already approved evaluation returns ERR_INVALID_STATE 409 and leaves revision_round at 1."
        test_recipe:
          setup:
            - "One APPROVED SiteEvaluation with a single valid perc hole."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-S2", county_code: "OR", site_address: "33 Locked Lane", lot_size_sqft: 40000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
            - call: "POST /site-evaluations"
              payload: { parcel_id: "${p_id}", evaluated_on: "2026-04-15T00:00:00Z", soil_group: "LOAMY", depth_to_limiting_layer_in: 48 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se_id: $.data.id }
            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 1, drop_inches: 6, elapsed_minutes: 132, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se_id}/review"
              payload: { decision: "APPROVE", review_note: "Accepted" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
          trigger:
            - call: "POST /site-evaluations/${se_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE with HTTP 409"
            - "SiteEvaluation.${se_id}.status == APPROVED and revision_round == 1"

      - name: corner_submit_site_evaluation_with_only_failed_presoak_holes_is_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=23]
          - errors[ERR_NO_VALID_PERC_HOLES]
          - calculations.perc_rate_evaluation
        distinguishing_aspect: "A hole with presoak_ok false is marked valid false and excluded from both perc-rate variants, so the evaluation has an empty valid set and submit fails with ERR_NO_VALID_PERC_HOLES 422 — the empty-collection edge of the aggregation."
        test_recipe:
          setup:
            - "One DRAFT SiteEvaluation carrying exactly one perc hole whose presoak_ok is false."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-S3", county_code: "OR", site_address: "34 Presoak Place", lot_size_sqft: 40000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
            - call: "POST /site-evaluations"
              payload: { parcel_id: "${p_id}", evaluated_on: "2026-04-15T00:00:00Z", soil_group: "LOAMY", depth_to_limiting_layer_in: 48 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se_id: $.data.id }
            - call: "POST /site-evaluations/${se_id}/perc-holes"
              payload: { hole_number: 1, drop_inches: 6, elapsed_minutes: 132, presoak_ok: false }
              as: DesignProfessional
              as_user_id: "u-dp-1"
          trigger:
            - call: "POST /site-evaluations/${se_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NO_VALID_PERC_HOLES with HTTP 422"
            - "SiteEvaluation.${se_id}.status == DRAFT and revision_round == 0"
            - "SiteEvaluation.${se_id}.preliminary_perc_rate_min_per_in == null and certified_perc_rate_min_per_in == null"

      - name: corner_approving_second_site_evaluation_supersedes_first_and_its_designs
        claim_type: Cascade down
        grounds:
          - state_machines.SiteEvaluation.APPROVED_to_SUPERSEDED
          - state_machines.SystemDesign.APPROVED_to_SUPERSEDED
        distinguishing_aspect: "Approving a second evaluation on the same parcel moves the first APPROVED -> SUPERSEDED and that mutation in turn moves the DRAFT design drawn from it to SUPERSEDED; the second evaluation stays APPROVED."
        test_recipe:
          setup:
            - "One parcel with SiteEvaluation SE1 APPROVED and one DRAFT SystemDesign drawn from SE1, plus a second SiteEvaluation SE2 in SUBMITTED."
          setup_api_calls:
            - call: "POST /parcels"
              payload: { apn: "0856-S4", county_code: "OR", site_address: "35 Supersede Street", lot_size_sqft: 40000, water_source: "PUBLIC_WATER" }
              as: Applicant
              as_user_id: "u-app-9"
              captures: { p_id: $.data.id }
            - call: "POST /site-evaluations"
              payload: { parcel_id: "${p_id}", evaluated_on: "2026-04-15T00:00:00Z", soil_group: "LOAMY", depth_to_limiting_layer_in: 48 }
              as: DesignProfessional
              as_user_id: "u-dp-1"
              captures: { se1_id: $.data.id }
            - call: "POST /site-evaluations/${se1_id}/perc-holes"
              payload: { hole_number: 1, drop_inches: 6, elapsed_minutes: 132, presoak_ok: true }
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se1_id}/submit"
              payload: {}
              as: DesignProfessional
              as_user_id: "u-dp-1"
            - call: "POST /site-evaluations/${se1_id}/review"
              payload: { decision: "APPROVE", review_note: "Accepted" }
              as: EnvironmentalHealthSpecialist
              as_user_id: "u-ehs-review"
              captures: { se1_v: $.data.version }
            - call: "POST /system-designs"
