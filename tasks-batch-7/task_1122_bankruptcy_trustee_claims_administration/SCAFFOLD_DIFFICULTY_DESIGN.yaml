            - call: "POST /trustee/cases/${case_id}/set_bar_date"
              payload: { bar_date: "2026-06-01T00:00:00Z" }
              as: Clerk
            - call: "GET /trustee/cases/${case_id}"
              payload: {}
              as: Trustee
              as_user_id: "trust-0001"
              captures: { case_v2: $.data.version }
            - call: "POST /trustee/cases/${case_id}/fee_applications"
