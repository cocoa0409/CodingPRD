  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: resident_cannot_create_complement_even_with_bogus_refs
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "Authorization (priority 2) precedes existence (priority 4): a Resident-role POST to complement-approvals with a non-existent program_id returns 403 ERR_INSUFFICIENT_PERMISSIONS, never 404."
        test_recipe:
          setup: ["One program exists (to have any data at all)"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1028" }, as: DesignatedInstitutionalOfficial }
          trigger:
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "00000000-0000-0000-0000-000000000000", academic_year_id: "00000000-0000-0000-0000-000000000000", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: Resident, as_user_id: "00000000-0000-0000-0000-000000000000", captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id ERR_INSUFFICIENT_PERMISSIONS (403) — role check fires before the non-existent program_id is ever resolved"

      - name: cross_program_reference_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=10]
          - errors[ERR_CROSS_PROGRAM_REFERENCE]
        distinguishing_aspect: "Assignment whose rotation belongs to a DIFFERENT program than the resident/block is rejected 400 ERR_CROSS_PROGRAM_REFERENCE after all existence and state checks pass."
        test_recipe:
          setup: ["Program 1 with ACTIVE year, APPROVED complement, ACTIVE resident; Program 2 with its own ACTIVE year and a rotation"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1029" }, as: DesignatedInstitutionalOfficial, captures: { prog1: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog1}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr1: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr1}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog1}", academic_year_id: "${yr1}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp1: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp1}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp1}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog1}", entry_academic_year_id: "${yr1}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res1: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res1}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs", payload: { name: "Valley Surgery", specialty: "GENERAL_SURGERY", acgme_program_code: "440-00-1029" }, as: DesignatedInstitutionalOfficial, captures: { prog2: "$.data.id" } }
            - { call: "POST /residency-programs/rotations", payload: { program_id: "${prog2}", name: "Trauma", min_pgy_level: 1, max_residents_per_block: 3 }, as: ProgramCoordinator, captures: { rot2: "$.data.id" } }
            - { call: "GET /residency-programs/schedule-blocks", payload: { academic_year_id: "${yr1}" }, as: ProgramCoordinator, captures: { blk1: "$.data[0].id" } }
          trigger:
            - { call: "POST /residency-programs/rotation-assignments", payload: { resident_id: "${res1}", schedule_block_id: "${blk1}", rotation_id: "${rot2}" }, as: ProgramCoordinator, captures: { err: "$.data.error_id" } }
          assert:
            - "Rejected with error_id ERR_CROSS_PROGRAM_REFERENCE (400): rotation belongs to program 2 while resident and block's year belong to program 1"

      - name: dismiss_justification_length_boundary
        claim_type: violation_to_error
        grounds:
          - errors[ERR_JUSTIFICATION_REQUIRED]
          - state_machines.DutyHourViolation
        distinguishing_aspect: "Dismiss requires justification >= 10 chars: 'too short' (9 chars) fails ERR_JUSTIFICATION_REQUIRED; a 10+ char justification succeeds."
        test_recipe:
          setup: ["Program, ACTIVE year, APPROVED complement, ACTIVE resident; one REST_8H violation FLAGGED (two attested logs 4h apart)"]
          setup_api_calls:
            - { call: "POST /residency-programs", payload: { name: "Metro IM", specialty: "INTERNAL_MEDICINE", acgme_program_code: "140-00-1030" }, as: DesignatedInstitutionalOfficial, captures: { prog: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years", payload: { program_id: "${prog}", year_label: "2026-2027", start_date: "2026-07-01", end_date: "2027-06-30" }, as: ProgramCoordinator, captures: { yr: "$.data.id" } }
            - { call: "POST /residency-programs/academic-years/${yr}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/complement-approvals", payload: { program_id: "${prog}", academic_year_id: "${yr}", pgy_level: 1, approved_positions: 2, annual_funding_budget_cents: 100000000, blended_stipend_cents: 6000000 }, as: ProgramDirector, captures: { comp: "$.data.id" } }
            - { call: "POST /residency-programs/complement-approvals/${comp}/submit", payload: {}, as: ProgramDirector }
            - { call: "POST /residency-programs/complement-approvals/${comp}/approve", payload: {}, as: DesignatedInstitutionalOfficial }
            - { call: "POST /residency-programs/residents", payload: { program_id: "${prog}", entry_academic_year_id: "${yr}", pgy_level: 1, full_name: "R One", email: "r1@x.org", hire_date: "2026-07-01", expected_graduation_date: "2029-06-30" }, as: ProgramCoordinator, captures: { res: "$.data.id" } }
            - { call: "POST /residency-programs/residents/${res}/activate", payload: {}, as: ProgramCoordinator }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-03T00:00:00Z", ended_at: "2026-08-03T08:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l1: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l1}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "POST /residency-programs/duty-hour-logs", payload: { resident_id: "${res}", started_at: "2026-08-03T12:00:00Z", ended_at: "2026-08-03T20:00:00Z" }, as: Resident, as_user_id: "${res}", captures: { l2: "$.data.id" } }
            - { call: "POST /residency-programs/duty-hour-logs/${l2}/attest", payload: {}, as: Resident, as_user_id: "${res}" }
            - { call: "GET /residency-programs/duty-hour-violations", payload: { resident_id: "${res}" }, as: ProgramDirector, captures: { vio: "$.data[0].id" } }
          trigger:
            - { call: "POST /residency-programs/duty-hour-violations/${vio}/dismiss", payload: { justification: "too short" }, as: ProgramDirector, captures: { err: "$.data.error_id" } }
            - { call: "POST /residency-programs/duty-hour-violations/${vio}/dismiss", payload: { justification: "Verified scheduling data-entry error" }, as: ProgramDirector, captures: { vst: "$.data.status" } }
          assert:
            - "Dismiss with a 9-character justification fails with error_id ERR_JUSTIFICATION_REQUIRED (400)"
            - "Dismiss with a >= 10 character justification succeeds: status == DISMISSED, resolution_note records the justification"
            - "Violation count unchanged (1) — dismiss transitions, never deletes"

      - name: pgy_ineligible_rejected_then_satisfied
        claim_type: conditional_validation
        grounds:
          - errors[ERR_PGY_INELIGIBLE]
        distinguishing_aspect: "The PGY rule is conditional on rotation.min_pgy_level: a PGY-1 resident is rejected (422) onto a PGY-3 rotation while a PGY-3 resident with the identical payload shape succeeds."
        test_recipe:
          setup: ["Program, ACTIVE year, APPROVED complement (4 positions), residents R1 (pgy 1) and R3 (pgy 3) ACTIVE; rotation 'Cardiology' min_pgy_level 3 capacity 2; block 1"]
