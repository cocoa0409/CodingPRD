  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: agreement_parallel_dimensions_move_independently
        grounds:
          - state_machines.LicenseAgreement.contract_status
          - state_machines.LicenseAgreement.compliance_posture
          - entities.LicenseAgreement.fields.compliance_posture
          - entities.LicenseAgreement.fields.contract_status
          - calculations.compliance_risk_index
          - calculations.mg_shortfall_assessment
        distinguishing_aspect: |
          PARALLEL shape: LicenseAgreement carries TWO orthogonal state dimensions.
          Suspending the contract (ACTIVE -> SUSPENDED, MarkComplianceOfficer) must
          leave compliance_posture at CLEAR, and the quarter-close posture recompute
          must move posture CLEAR -> PROBATION (index 45 from three 2026Q3 seizures at
          weight 15, decay 1.0) on an agreement that is SUSPENDED, without touching
          contract_status. REINSTATE then restores ACTIVE while posture stays
          PROBATION. A single-dimension implementation collapses these and either
          refuses the recompute on a suspended agreement or resets posture on
          reinstatement. The CLEAR -> PROBATION hop also skips WATCH, which a
          step-at-a-time band walker would get wrong.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z, so QUARTER_OF(clock) == 2026Q3 and quarter-close accepts as_of_quarter 2026Q3"
            - "licensee LIC_F ACTIVE; agreement AGR_F ACTIVE on category JERSEY, MG 1000000, required_advance 250000 fully paid, term 2026-01-01..2027-12-31 (10 -> total_quarters 8, elapsed_quarters 3), no reports so cumulative_royalty_cents == 0"
            - "AGR_F contract_status is moved ACTIVE -> SUSPENDED before the recompute"
            - "three EnforcementActions naming LIC_F are driven REPORTED -> INVESTIGATING -> SEIZURE_ORDERED at 2026Q3, giving 3 * 15 * 1.0 == 45"
