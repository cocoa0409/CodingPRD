# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1236 building materials reuse warehouse
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7; recipes replayed call-by-call
# against §1.2 transitions, §1.4 validations, §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (3 instances, 3 different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: receipt_valuation_guidance_vs_appraisal
        grounds:
          - calculations.receipt_guidance_valuation
          - calculations.receipt_final_valuation
          - entities.TaxReceipt.fields.valuation_method
          - entities.DonationOffer.fields.estimated_value_cents
        distinguishing_aspect: |
          TaxReceipt domain: the same received offer yields three divergent numbers —
          provisional ESTIMATED_GUIDANCE at accept (thrift 30% of rated value = 135000),
          the item-sum path (6 x 90000 = 540000), and the QUALIFIED_APPRAISAL path
          (valued_total_cents taken verbatim as 600000) selected because 540000 >= 500000.
        test_recipe:
          setup:
            - "Category CABINETS: PER_UNIT, base_rate_cents 100000, no hazmat risk"
            - "Donor D; offer of 6 UNIT grade B cabinets is ACCEPTED then RECEIVED by intake user staff-recv-1"
            - "Six items linked to the offer, each priced by override at 90000"
            - "Receipt drafted for the offer"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "CABINETS", display_name: "Cabinets", pricing_model: "PER_UNIT", base_rate_cents: 100000, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/donors"
              payload: { full_name: "D One", donor_type: "INDIVIDUAL", email: "d1@x.com", address_text: "1 Way" }
              as: IntakeStaff
              captures: { donor_id: $.data.id }
            - call: "POST /reuse/donation-offers"
              payload: { donor_id: "${donor_id}", source_type: "DROPOFF", category_id: "${cat_id}", description_text: "6 cabinets", estimated_quantity: 6, quantity_unit: "UNIT", condition_grade: "B", pre_1978_flag: false }
              as: IntakeStaff
              captures: { offer_id: $.data.id }
            - call: "POST /reuse/donation-offers/${offer_id}/review"
              payload: {}
              as: IntakeStaff
            - call: "POST /reuse/donation-offers/${offer_id}/accept"
              payload: {}
              as: IntakeStaff
              captures: { offer_est_value: $.data.estimated_value_cents }
            - call: "POST /reuse/donation-offers/${offer_id}/receive"
              payload: {}
              as: IntakeStaff
              as_user_id: "staff-recv-1"
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "cab 1", condition_grade: "B", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 80, offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { item1_id: $.data.id }
            - call: "POST /reuse/items/${item1_id}/price"
              payload: { price_override_cents: 90000 }
              as: StoreManager
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "cab 2", condition_grade: "B", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 80, offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { item2_id: $.data.id }
            - call: "POST /reuse/items/${item2_id}/price"
              payload: { price_override_cents: 90000 }
              as: StoreManager
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "cab 3", condition_grade: "B", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 80, offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { item3_id: $.data.id }
            - call: "POST /reuse/items/${item3_id}/price"
              payload: { price_override_cents: 90000 }
              as: StoreManager
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "cab 4", condition_grade: "B", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 80, offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { item4_id: $.data.id }
            - call: "POST /reuse/items/${item4_id}/price"
              payload: { price_override_cents: 90000 }
              as: StoreManager
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "cab 5", condition_grade: "B", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 80, offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { item5_id: $.data.id }
            - call: "POST /reuse/items/${item5_id}/price"
              payload: { price_override_cents: 90000 }
              as: StoreManager
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "cab 6", condition_grade: "B", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 80, offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { item6_id: $.data.id }
            - call: "POST /reuse/items/${item6_id}/price"
              payload: { price_override_cents: 90000 }
              as: StoreManager
            - call: "POST /reuse/tax-receipts"
              payload: { offer_id: "${offer_id}" }
              as: IntakeStaff
              captures: { receipt_id: $.data.id }
          trigger:
            - call: "POST /reuse/tax-receipts/${receipt_id}/issue"
              payload: { appraisal_reference: "APR-100", appraisal_value_cents: 600000 }
              as: IntakeStaff
              as_user_id: "staff-issue-1"
              captures: { r_method: $.data.valuation_method, r_total: $.data.valued_total_cents }
            - call: "GET /reuse/donation-offers/${offer_id}"
              as: IntakeStaff
              captures: { offer_final: $.data.final_value_cents, offer_status: $.data.status }
          assert:
            - "TaxReceipt.${receipt_id}.valuation_method == 'QUALIFIED_APPRAISAL' (item sum 540000 >= 500000 threshold)"
            - "TaxReceipt.${receipt_id}.valued_total_cents == 600000 (appraisal verbatim), NOT 540000 (item sum) and NOT 135000 (provisional)"
            - "DonationOffer.${offer_id}.estimated_value_cents == 135000 (provisional ESTIMATED_GUIDANCE at accept: round(100000*6*0.75*0.30))"
            - "DonationOffer.${offer_id}.final_value_cents == 600000 and status == RECEIPTED"

      - name: job_tonnage_estimated_vs_certified
        grounds:
          - calculations.job_tonnage_estimates
          - entities.DeconstructionJob.fields.estimated_diverted_weight_lbs
          - entities.DeconstructionJob.fields.certified_diverted_weight_lbs
        distinguishing_aspect: |
          DeconstructionJob/SalvageBatch domain (different domain from receipt_valuation):
          the ESTIMATED variant sums manifest estimates (500.0) while the CERTIFIED variant
          sums scale-minus-contamination over WEIGHED batches (480.0 - 30.0 = 450.0) —
          same job, same batch, two divergent totals.
        test_recipe:
          setup:
            - "Hazmat-certified technician T1 and lead-certified lead L1 (different people)"
            - "Vehicle V1 available; job J cleared by T1's screening, scheduled 2026-06-10 08:00-16:00 with L1, one ASSIGNED assignment, started"
            - "Batch manifested on J with estimated_weight_lbs 500 in a divertible category"
          setup_api_calls:
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech One", crew_type: "PAID", hourly_rate_cents: 4000, hazmat_certified: true, lead_certified: false }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Lead One", crew_type: "PAID", hourly_rate_cents: 5000, hazmat_certified: false, lead_certified: true }
              as: CrewCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /reuse/vehicles"
              payload: { plate_code: "TRK-1", capacity_lbs: 10000 }
              as: CrewCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Job A", site_address_text: "9 Elm", quoted_fee_cents: 200000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NEGATIVE" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
              captures: { scr_outcome: $.data.outcome }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/schedule"
              payload: { lead_crew_member_id: "${lead_id}", vehicle_id: "${veh_id}", scheduled_start: "2026-06-10T08:00:00Z", scheduled_end: "2026-06-10T16:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/crew-assignments"
              payload: { job_id: "${job_id}", crew_member_id: "${lead_id}", role_on_job: "LEAD", start_at: "2026-06-10T08:00:00Z", end_at: "2026-06-10T12:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/deconstruction-jobs/${job_id}/start"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/categories"
              payload: { code: "LUMBER", display_name: "Lumber", pricing_model: "PER_SQFT", base_rate_cents: 200, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/salvage-batches"
              payload: { job_id: "${job_id}", category_id: "${cat_id}", estimated_weight_lbs: 500 }
              as: CrewCoordinator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /reuse/salvage-batches/${batch_id}/weigh"
              payload: { scale_weight_lbs: 480, contamination_weight_lbs: 30 }
              as: CrewCoordinator
              captures: { b_diverted: $.data.diverted_weight_lbs, b_status: $.data.status }
            - call: "GET /reuse/deconstruction-jobs/${job_id}"
              as: CrewCoordinator
              captures: { j_est: $.data.estimated_diverted_weight_lbs, j_cert: $.data.certified_diverted_weight_lbs }
          assert:
            - "SalvageBatch.${batch_id}.status == WEIGHED and diverted_weight_lbs == 450 (480 - 30)"
            - "DeconstructionJob.${job_id}.estimated_diverted_weight_lbs == 500 (manifest estimate variant)"
            - "DeconstructionJob.${job_id}.certified_diverted_weight_lbs == 450 (certified variant) — variants diverge for identical batches"

      - name: sale_discount_snapshot_vs_live_tier
        grounds:
          - calculations.contractor_discount_pct
          - entities.Sale.fields.tier_snapshot
          - entities.ContractorAccount.fields.discount_tier
        distinguishing_aspect: |
          Sale/ContractorAccount domain (different from receipts and tonnage): sale S1
          snapshots STANDARD at open; another sale then pushes trailing volume to exactly
          2500000 (SILVER); S1 finalized afterwards still bills at the STANDARD snapshot —
          total 107000 vs the 101650 a live-tier recomputation would produce.
        test_recipe:
          setup:
            - "Account C approved with credit_limit 100000000; trailing volume 0"
            - "Item BIG priced by override 2336449 (walk-in-sellable), item SMALL priced 100000"
            - "S1 opened for the account (snapshot STANDARD); S2 opened, loaded with BIG, finalized -> trailing 2500000, tier now SILVER"
          setup_api_calls:
            - call: "POST /reuse/contractor-accounts"
              payload: { company_name: "Ctor C", contact_email: "c@x.com", credit_limit_cents: 100000000 }
              as: WarehouseAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /reuse/contractor-accounts/${acct_id}/approve"
              payload: {}
              as: WarehouseAdmin
            - call: "POST /reuse/categories"
              payload: { code: "PANELS", display_name: "Panels", pricing_model: "PER_UNIT", base_rate_cents: 1000, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "big lot", condition_grade: "A", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 100 }
              as: IntakeStaff
              captures: { big_id: $.data.id }
            - call: "POST /reuse/items/${big_id}/price"
              payload: { price_override_cents: 2336449 }
              as: StoreManager
            - call: "POST /reuse/store-zones"
              payload: { code: "Z1", display_name: "Zone 1", capacity: 10, restock_threshold: 0 }
              as: StoreManager
              captures: { zone_id: $.data.id }
            - call: "POST /reuse/items/${big_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "small lot", condition_grade: "A", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 10 }
              as: IntakeStaff
              captures: { small_id: $.data.id }
            - call: "POST /reuse/items/${small_id}/price"
              payload: { price_override_cents: 100000 }
              as: StoreManager
            - call: "POST /reuse/items/${small_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
            - call: "POST /reuse/sales"
              payload: { sale_channel: "CONTRACTOR_ACCOUNT", contractor_id: "${acct_id}" }
              as: Cashier
              captures: { s1_id: $.data.id, s1_tier: $.data.tier_snapshot }
            - call: "POST /reuse/sales"
              payload: { sale_channel: "CONTRACTOR_ACCOUNT", contractor_id: "${acct_id}" }
              as: Cashier
              captures: { s2_id: $.data.id }
            - call: "POST /reuse/sales/${s2_id}/lines"
              payload: { item_id: "${big_id}" }
              as: Cashier
            - call: "POST /reuse/sales/${s2_id}/finalize"
              payload: {}
              as: Cashier
              captures: { s2_total: $.data.total_cents }
            - call: "GET /reuse/contractor-accounts/${acct_id}"
              as: WarehouseAdmin
              captures: { acct_tier_now: $.data.discount_tier, acct_trailing: $.data.trailing_volume_cents }
          trigger:
            - call: "POST /reuse/sales/${s1_id}/lines"
              payload: { item_id: "${small_id}" }
              as: Cashier
            - call: "POST /reuse/sales/${s1_id}/finalize"
              payload: {}
              as: Cashier
              captures: { s1_total: $.data.total_cents, s1_pct: $.data.discount_pct_applied, s1_sub: $.data.subtotal_cents }
          assert:
            - "Sale.${s1_id}.tier_snapshot == 'STANDARD' (captured at open, excluding the sale itself)"
            - "ContractorAccount.${acct_id}.discount_tier == 'SILVER' and trailing_volume_cents == 2500000 at S1 finalize time"
            - "Sale.${s1_id}.discount_pct_applied == 0 and subtotal_cents == 100000"
            - "Sale.${s1_id}.total_cents == 107000 (= 100000 + round(100000*0.07)); a live-tier variant would give 101650 — snapshot vs live diverge"
            - "Sale.${s2_id}.total_cents == 2500000 (= 2336449 + round(2336449*0.07)=163551)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (3 instances across modes (a), (b), (c))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: list_price_multi_input_stack
        grounds:
          - calculations.item_list_price
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — pricing_model branch
          (PER_SQFT x measure_qty), condition multiplier (C = 0.50), hazmat multiplier
          (1.15 via category flag), and a max() clamp at MIN_LIST_PRICE_CENTS:
          200*12 = 2400 -> *0.50 = 1200 -> *1.15 = 1380.
        test_recipe:
          setup:
            - "Category FLOORING: PER_SQFT, base_rate_cents 200, hazmat_risk_flag true"
            - "A CLEARED screening exists (hazmat-exposed items require it at intake)"
            - "Item: 12 SQFT, grade C, pre_1978_flag false"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "FLOORING", display_name: "Flooring", pricing_model: "PER_SQFT", base_rate_cents: 200, hazmat_risk_flag: true, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech Two", crew_type: "VOLUNTEER", hazmat_certified: true }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Screen host", site_address_text: "1 Oak", quoted_fee_cents: 1000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NEGATIVE" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
              captures: { scr_id: $.data.id, scr_outcome: $.data.outcome }
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "oak floor 12sqft", condition_grade: "C", measure_qty: 12, measure_unit: "SQFT", pre_1978_flag: false, estimated_weight_lbs: 60, screening_id: "${scr_id}" }
              as: IntakeStaff
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /reuse/items/${item_id}/price"
              payload: {}
              as: StoreManager
              captures: { i_list: $.data.list_price_cents, i_cur: $.data.current_price_cents, i_status: $.data.pricing_status }
          assert:
            - "Item.${item_id}.list_price_cents == 1380 (= round_half_up(200*12*0.50*1.15))"
            - "Item.${item_id}.current_price_cents == 1380 and markdown_step == 0"
            - "Item.${item_id}.pricing_status == 'PRICED'"

      - name: sale_totals_per_line_rounding_order
        grounds:
          - calculations.sale_totals
          - entities.SaleLineItem.fields.line_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding with pinned order — round per line THEN sum, then
          discount, then tax. unit 199 x 1.5 = 298.5 -> 299 and 199 x 2.5 = 497.5 -> 498
          give subtotal 797; the forbidden sum-then-round order gives 796. Discount
          round(797*0.10) = 80, tax round(717*0.07) = 50, total 767.
        test_recipe:
          setup:
            - "Category LUMBER2: PER_SQFT (hazmat free); account D approved, credit_limit 100000000, tier STANDARD"
            - "Agreement AG on LUMBER2: discount_pct 0.10, min_quantity 3.0 SQFT, window 2026-01-01..2027-01-01 (OCC version from approve)"
            - "Items I1 (1.5 SQFT) and I2 (2.5 SQFT) both priced by override at 199 and placed"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "LUMBER2", display_name: "Lumber 2", pricing_model: "PER_SQFT", base_rate_cents: 200, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/contractor-accounts"
              payload: { company_name: "Ctor D", contact_email: "d@x.com", credit_limit_cents: 100000000 }
              as: WarehouseAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /reuse/contractor-accounts/${acct_id}/approve"
              payload: {}
              as: WarehouseAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /reuse/bulk-agreements"
              payload: { contractor_id: "${acct_id}", category_id: "${cat_id}", discount_pct: 0.10, min_quantity: 3.0, quantity_unit: "SQFT", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: WarehouseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /reuse/store-zones"
              payload: { code: "Z2", display_name: "Zone 2", capacity: 10, restock_threshold: 0 }
              as: StoreManager
              captures: { zone_id: $.data.id }
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "I1", condition_grade: "A", measure_qty: 1.5, measure_unit: "SQFT", pre_1978_flag: false, estimated_weight_lbs: 5 }
              as: IntakeStaff
              captures: { i1_id: $.data.id }
            - call: "POST /reuse/items/${i1_id}/price"
              payload: { price_override_cents: 199 }
              as: StoreManager
            - call: "POST /reuse/items/${i1_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "I2", condition_grade: "A", measure_qty: 2.5, measure_unit: "SQFT", pre_1978_flag: false, estimated_weight_lbs: 8 }
              as: IntakeStaff
              captures: { i2_id: $.data.id }
            - call: "POST /reuse/items/${i2_id}/price"
              payload: { price_override_cents: 199 }
              as: StoreManager
            - call: "POST /reuse/items/${i2_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
            - call: "POST /reuse/sales"
              payload: { sale_channel: "CONTRACTOR_ACCOUNT", contractor_id: "${acct_id}", agreement_id: "${ag_id}" }
              as: Cashier
              captures: { sale_id: $.data.id }
          trigger:
            - call: "POST /reuse/sales/${sale_id}/lines"
              payload: { item_id: "${i1_id}", quantity: 1.5 }
              as: Cashier
              captures: { l1_total: $.data.line_total_cents }
            - call: "POST /reuse/sales/${sale_id}/lines"
              payload: { item_id: "${i2_id}", quantity: 2.5 }
              as: Cashier
              captures: { l2_total: $.data.line_total_cents }
            - call: "POST /reuse/sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              captures: { s_sub: $.data.subtotal_cents, s_disc: $.data.bulk_discount_cents, s_tax: $.data.tax_cents, s_total: $.data.total_cents }
          assert:
            - "line totals: 299 (= round(199*1.5)) and 498 (= round(199*2.5)) — per-line rounding first"
            - "Sale.${sale_id}.subtotal_cents == 797 (299+498; sum-then-round would yield 796)"
            - "Sale.${sale_id}.discount_pct_applied == 0.10 (agreement beats STANDARD tier) and bulk_discount_cents == 80 (= round(797*0.10))"
            - "Sale.${sale_id}.tax_cents == 50 (= round((797-80)*0.07)) and total_cents == 767"

      - name: discount_snapshot_evaluation_order
        grounds:
          - calculations.contractor_discount_pct
          - calculations.trailing_volume_cents
          - entities.Sale.fields.tier_snapshot
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — discount depends on tier, tier depends on
          trailing volume, trailing volume depends on finalized sale totals. The scaffold
          pins the order: snapshot tier at sale OPEN excluding the current sale; discount
          from the snapshot; trailing updated only after finalize. Finalizing the older
          sale after the account reaches SILVER still yields discount 0 / total 107000.
        test_recipe:
          setup:
            - "Account E approved with credit_limit 100000000"
            - "Sale S1 opened while trailing == 0 (snapshot STANDARD); S2 opens and finalizes a 2336449 line (total 2500000) pushing trailing to the SILVER threshold"
            - "S1 carries a 100000 line and is finalized AFTER the tier change"
          setup_api_calls:
            - call: "POST /reuse/contractor-accounts"
              payload: { company_name: "Ctor E", contact_email: "e@x.com", credit_limit_cents: 100000000 }
              as: WarehouseAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /reuse/contractor-accounts/${acct_id}/approve"
              payload: {}
              as: WarehouseAdmin
            - call: "POST /reuse/categories"
              payload: { code: "PANELS2", display_name: "Panels 2", pricing_model: "PER_UNIT", base_rate_cents: 1000, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/store-zones"
              payload: { code: "Z3", display_name: "Zone 3", capacity: 10, restock_threshold: 0 }
              as: StoreManager
              captures: { zone_id: $.data.id }
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "big", condition_grade: "A", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 100 }
              as: IntakeStaff
              captures: { big_id: $.data.id }
            - call: "POST /reuse/items/${big_id}/price"
              payload: { price_override_cents: 2336449 }
              as: StoreManager
            - call: "POST /reuse/items/${big_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "small", condition_grade: "A", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 10 }
              as: IntakeStaff
              captures: { small_id: $.data.id }
            - call: "POST /reuse/items/${small_id}/price"
              payload: { price_override_cents: 100000 }
              as: StoreManager
            - call: "POST /reuse/items/${small_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
            - call: "POST /reuse/sales"
              payload: { sale_channel: "CONTRACTOR_ACCOUNT", contractor_id: "${acct_id}" }
              as: Cashier
              captures: { s1_id: $.data.id, s1_snap: $.data.tier_snapshot }
            - call: "POST /reuse/sales"
              payload: { sale_channel: "CONTRACTOR_ACCOUNT", contractor_id: "${acct_id}" }
              as: Cashier
              captures: { s2_id: $.data.id }
            - call: "POST /reuse/sales/${s2_id}/lines"
              payload: { item_id: "${big_id}" }
              as: Cashier
            - call: "POST /reuse/sales/${s2_id}/finalize"
              payload: {}
              as: Cashier
          trigger:
            - call: "POST /reuse/sales/${s1_id}/lines"
              payload: { item_id: "${small_id}" }
              as: Cashier
            - call: "POST /reuse/sales/${s1_id}/finalize"
              payload: {}
              as: Cashier
              captures: { s1_total: $.data.total_cents, s1_pct: $.data.discount_pct_applied }
          assert:
            - "Sale.${s1_id}.tier_snapshot == 'STANDARD' (evaluation order step 1: basis excludes the current sale)"
            - "Sale.${s1_id}.discount_pct_applied == 0 and total_cents == 107000 — the snapshot, not the live SILVER tier (0.05), drives the discount"
  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (3 instances, 3 different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: offer_review_info_cycle
        grounds:
          - state_machines.DonationOffer.UNDER_REVIEW_to_NEEDS_INFO
          - state_machines.DonationOffer.NEEDS_INFO_to_UNDER_REVIEW
          - state_machines.DonationOffer.UNDER_REVIEW_to_ACCEPTED
        distinguishing_aspect: |
          DonationOffer (cyclic shape): UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW is a
          true review cycle (not a pipeline); the loop can repeat before ACCEPTED.
        test_recipe:
          setup:
            - "Category TRIM accepting; donor D2; offer grade A DROPOFF created"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "TRIM", display_name: "Trim", pricing_model: "PER_LINEAR_FT", base_rate_cents: 150, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/donors"
              payload: { full_name: "D Two", donor_type: "BUSINESS", email: "d2@x.com", address_text: "2 Way" }
              as: IntakeStaff
              captures: { donor_id: $.data.id }
            - call: "POST /reuse/donation-offers"
              payload: { donor_id: "${donor_id}", source_type: "DROPOFF", category_id: "${cat_id}", description_text: "oak trim", estimated_quantity: 40, quantity_unit: "LINEAR_FT", condition_grade: "A", pre_1978_flag: false }
              as: IntakeStaff
              captures: { offer_id: $.data.id, v0: $.data.version, st0: $.data.status }
          trigger:
            - call: "POST /reuse/donation-offers/${offer_id}/review"
              payload: {}
              as: IntakeStaff
              captures: { st1: $.data.status }
            - call: "POST /reuse/donation-offers/${offer_id}/request-info"
              payload: { review_notes: "need photos" }
              as: IntakeStaff
              captures: { st2: $.data.status }
            - call: "POST /reuse/donation-offers/${offer_id}/resubmit"
              payload: { description_text: "oak trim, photos attached" }
              as: IntakeStaff
              captures: { st3: $.data.status }
            - call: "POST /reuse/donation-offers/${offer_id}/accept"
              payload: {}
              as: IntakeStaff
              captures: { st4: $.data.status, v4: $.data.version, est: $.data.estimated_value_cents }
          assert:
            - "status sequence: OFFERED -> UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW -> ACCEPTED (cycle traversed)"
            - "DonationOffer.${offer_id}.version == 5 after create + 4 transitions"
            - "estimated_value_cents == 1800 (= round(150*40*1.00*0.30))"

      - name: item_parallel_pricing_sales_axes
        grounds:
          - state_machines.Item
          - entities.Item.fields.pricing_status
          - entities.Item.fields.sales_status
        distinguishing_aspect: |
          Item (parallel shape): pricing_status (UNPRICED->PRICED) and sales_status
          (BACKROOM->ON_FLOOR->RESERVED->SOLD->ON_FLOOR via void) are independent axes —
          a sale finalize+void round-trip flips sales_status twice while pricing_status
          stays PRICED and current_price_cents untouched.
        test_recipe:
          setup:
            - "Category DOORS; zone Z4 (capacity 10, threshold 0); item priced by override 5000 and placed"
            - "Walk-in sale reserves, finalizes, then voids"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "DOORS", display_name: "Doors", pricing_model: "PER_UNIT", base_rate_cents: 8000, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/store-zones"
              payload: { code: "Z4", display_name: "Zone 4", capacity: 10, restock_threshold: 0 }
              as: StoreManager
              captures: { zone_id: $.data.id }
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "oak door", condition_grade: "B", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 45 }
              as: IntakeStaff
              captures: { item_id: $.data.id, ps0: $.data.pricing_status, ss0: $.data.sales_status }
          trigger:
            - call: "POST /reuse/items/${item_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
              captures: { place_err: $.data.error_id }
            - call: "POST /reuse/items/${item_id}/price"
              payload: { price_override_cents: 5000 }
              as: StoreManager
              captures: { ps1: $.data.pricing_status }
            - call: "POST /reuse/items/${item_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
              captures: { ss1: $.data.sales_status }
            - call: "POST /reuse/sales"
              payload: { sale_channel: "WALK_IN" }
              as: Cashier
              captures: { sale_id: $.data.id }
            - call: "POST /reuse/sales/${sale_id}/lines"
              payload: { item_id: "${item_id}" }
              as: Cashier
              captures: { line_id: $.data.id }
            - call: "POST /reuse/sales/${sale_id}/finalize"
              payload: { payment_amount_cents: 5350 }
              as: Cashier
              captures: { s_total: $.data.total_cents }
            - call: "GET /reuse/items/${item_id}"
              as: StoreManager
              captures: { ss2: $.data.sales_status, zone2: $.data.zone_id }
            - call: "POST /reuse/sales/${sale_id}/void"
              payload: { void_reason: "customer return" }
              as: StoreManager
            - call: "GET /reuse/items/${item_id}"
              as: StoreManager
              captures: { ss3: $.data.sales_status, ps3: $.data.pricing_status, cur3: $.data.current_price_cents, zone3: $.data.zone_id }
          assert:
            - "First place while UNPRICED fails with ERR_ITEM_NOT_PRICED (axis gate)"
            - "After price: pricing_status == PRICED; after place: sales_status == ON_FLOOR"
            - "Sale.${sale_id}.total_cents == 5350 (= 5000 + round(5000*0.07)); item SOLD with zone_id null"
            - "After void: sales_status == ON_FLOOR in the original zone while pricing_status == PRICED and current_price_cents == 5000 — axes evolved independently"

      - name: job_hazmat_remediation_cycle
        grounds:
          - state_machines.DeconstructionJob.SCREENING_PENDING_to_HAZMAT_HOLD
          - state_machines.DeconstructionJob.HAZMAT_HOLD_to_REMEDIATION_IN_PROGRESS
          - state_machines.DeconstructionJob.REMEDIATION_IN_PROGRESS_to_SCREENING_PENDING
          - state_machines.DeconstructionJob.SCREENING_PENDING_to_CLEARED
        distinguishing_aspect: |
          DeconstructionJob (branching + cycle): a FAILED screening routes to
          HAZMAT_HOLD -> REMEDIATION_IN_PROGRESS -> SCREENING_PENDING and a second
          screening (round 2) clears the job — the loop is repeatable per screening_round.
        test_recipe:
          setup:
            - "Hazmat-certified technician T3; job J3 in SCREENING_PENDING"
          setup_api_calls:
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech Three", crew_type: "PAID", hourly_rate_cents: 4000, hazmat_certified: true }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Job C", site_address_text: "7 Pine", quoted_fee_cents: 150000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
          trigger:
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "POSITIVE", asbestos_result: "NOT_TESTED" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
              captures: { s1_outcome: $.data.outcome, s1_round: $.data.screening_round }
            - call: "GET /reuse/deconstruction-jobs/${job_id}"
              as: CrewCoordinator
              captures: { j_st1: $.data.status }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/begin-remediation"
              payload: {}
              as: CrewCoordinator
              captures: { j_st2: $.data.status }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/complete-remediation"
              payload: {}
              as: CrewCoordinator
              captures: { j_st3: $.data.status }
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NEGATIVE" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
              captures: { s2_outcome: $.data.outcome, s2_round: $.data.screening_round }
            - call: "GET /reuse/deconstruction-jobs/${job_id}"
              as: CrewCoordinator
              captures: { j_st4: $.data.status }
          assert:
            - "Screening 1: outcome FAILED (lead POSITIVE), job -> HAZMAT_HOLD"
            - "Remediation cycle: HAZMAT_HOLD -> REMEDIATION_IN_PROGRESS -> SCREENING_PENDING"
            - "Screening 2: outcome CLEARED with screening_round == 2, job -> CLEARED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (2 instances, different triggers; depth 4 and 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: finalize_cascade_item_zone_account_agreement
        grounds:
          - state_machines.Sale.OPEN_to_FINALIZED
          - state_machines.ContractorAccount.ACTIVE_to_SUSPENDED
          - state_machines.BulkPurchaseAgreement.ACTIVE_to_CANCELLED
          - calculations.zone_occupancy
        distinguishing_aspect: |
          Trigger POST /reuse/sales/{id}/finalize, depth 4: sale FINALIZED -> line item
          RESERVED->SOLD and its zone.current_count decremented (hop 2) -> account
          outstanding += total breaches credit_limit (hop 3) -> account SUSPENDED and its
          ACTIVE agreement CANCELLED (hop 4). Each hop is caused by the previous mutation.
        test_recipe:
          setup:
            - "Account F ACTIVE with credit_limit_cents 90000"
            - "Agreement AG-F on category FIXTURES: discount 0.10, min_quantity 1.0 UNIT, in window"
            - "Item F priced 100000 placed in zone ZF (capacity 5, threshold 0)"
            - "Sale for F with agreement attached; one line for item F"
          setup_api_calls:
            - call: "POST /reuse/categories"
              payload: { code: "FIXTURES", display_name: "Fixtures", pricing_model: "PER_UNIT", base_rate_cents: 5000, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/contractor-accounts"
              payload: { company_name: "Ctor F", contact_email: "f@x.com", credit_limit_cents: 90000 }
              as: WarehouseAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /reuse/contractor-accounts/${acct_id}/approve"
              payload: {}
              as: WarehouseAdmin
              captures: { acct_v: $.data.version }
            - call: "POST /reuse/bulk-agreements"
              payload: { contractor_id: "${acct_id}", category_id: "${cat_id}", discount_pct: 0.10, min_quantity: 1.0, quantity_unit: "UNIT", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: WarehouseAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /reuse/store-zones"
              payload: { code: "ZF", display_name: "Zone F", capacity: 5, restock_threshold: 0 }
              as: StoreManager
              captures: { zone_id: $.data.id }
            - call: "POST /reuse/items"
              payload: { category_id: "${cat_id}", description_text: "fixture", condition_grade: "A", measure_qty: 1, measure_unit: "UNIT", pre_1978_flag: false, estimated_weight_lbs: 30 }
              as: IntakeStaff
              captures: { item_id: $.data.id }
            - call: "POST /reuse/items/${item_id}/price"
              payload: { price_override_cents: 100000 }
              as: StoreManager
            - call: "POST /reuse/items/${item_id}/place"
              payload: { zone_id: "${zone_id}" }
              as: StoreManager
            - call: "POST /reuse/sales"
              payload: { sale_channel: "CONTRACTOR_ACCOUNT", contractor_id: "${acct_id}", agreement_id: "${ag_id}" }
              as: Cashier
              captures: { sale_id: $.data.id }
            - call: "POST /reuse/sales/${sale_id}/lines"
              payload: { item_id: "${item_id}" }
              as: Cashier
          trigger:
            - call: "POST /reuse/sales/${sale_id}/finalize"
              payload: {}
              as: Cashier
              captures: { s_total: $.data.total_cents, s_status: $.data.status }
            - call: "GET /reuse/items/${item_id}"
              as: StoreManager
              captures: { i_ss: $.data.sales_status, i_zone: $.data.zone_id }
            - call: "GET /reuse/store-zones/${zone_id}"
              as: StoreManager
              captures: { z_count: $.data.current_count, z_restock: $.data.restock_recommended }
            - call: "GET /reuse/contractor-accounts/${acct_id}"
              as: WarehouseAdmin
              captures: { a_status: $.data.status, a_reason: $.data.suspension_reason, a_out: $.data.outstanding_balance_cents }
            - call: "GET /reuse/bulk-agreements/${ag_id}"
              as: WarehouseAdmin
              captures: { ag_status: $.data.status }
          assert:
            - "Sale.${sale_id} FINALIZED with total_cents == 96300 (= 100000 - round(100000*0.10) + round(90000*0.07))"
            - "Hop 2: item SOLD with zone_id null; StoreZone.${zone_id}.current_count == 0 and restock_recommended == true (0 <= 0)"
            - "Hop 3: outstanding_balance_cents == 96300 > credit_limit 90000 -> account.status == SUSPENDED with suspension_reason 'CREDIT_LIMIT_BREACH'"
            - "Hop 4: BulkPurchaseAgreement.${ag_id}.status == CANCELLED (caused by the suspension, not by the finalize directly)"

      - name: weigh_cascade_batch_job_report
        grounds:
          - state_machines.SalvageBatch.MANIFESTED_to_WEIGHED
          - calculations.job_tonnage_estimates
          - calculations.diversion_report_close
        distinguishing_aspect: |
          Trigger POST /reuse/salvage-batches/{id}/weigh, depth 3: batch MANIFESTED->
          WEIGHED with diverted weight (hop 1) -> job.certified_diverted_weight_lbs
          incremented (hop 2) -> the OPEN DiversionReport for the stamped period
          recomputes its running totals (hop 3). Different trigger than the finalize chain.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T09:00:00Z; DiversionReport for period 2026-06 OPEN"
            - "Job J2 cleared, scheduled with lead L2 on vehicle V2, one ASSIGNED assignment, started"
            - "Batch B2 manifested on J2 (estimated 500) in divertible category LUMBER3"
          setup_api_calls:
            - call: "POST /reuse/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: WarehouseAdmin
            - call: "POST /reuse/diversion-reports"
              payload: { period: "2026-06" }
              as: WarehouseAdmin
              captures: { rep_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Tech Four", crew_type: "PAID", hourly_rate_cents: 4000, hazmat_certified: true }
              as: CrewCoordinator
              captures: { tech_id: $.data.id }
            - call: "POST /reuse/crew-members"
              payload: { full_name: "Lead Two", crew_type: "PAID", hourly_rate_cents: 5000, lead_certified: true }
              as: CrewCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /reuse/vehicles"
              payload: { plate_code: "TRK-2", capacity_lbs: 12000 }
              as: CrewCoordinator
              captures: { veh_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs"
              payload: { title: "Job B", site_address_text: "5 Ash", quoted_fee_cents: 180000 }
              as: CrewCoordinator
              captures: { job_id: $.data.id }
            - call: "POST /reuse/deconstruction-jobs/${job_id}/request-screening"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/hazmat-screenings"
              payload: { job_id: "${job_id}", lead_result: "NEGATIVE", asbestos_result: "NEGATIVE" }
              as: HazmatTechnician
              as_user_id: "${tech_id}"
            - call: "POST /reuse/deconstruction-jobs/${job_id}/schedule"
              payload: { lead_crew_member_id: "${lead_id}", vehicle_id: "${veh_id}", scheduled_start: "2026-06-12T08:00:00Z", scheduled_end: "2026-06-12T16:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/crew-assignments"
              payload: { job_id: "${job_id}", crew_member_id: "${lead_id}", role_on_job: "LEAD", start_at: "2026-06-12T08:00:00Z", end_at: "2026-06-12T12:00:00Z" }
              as: CrewCoordinator
            - call: "POST /reuse/deconstruction-jobs/${job_id}/start"
              payload: {}
              as: CrewCoordinator
            - call: "POST /reuse/categories"
              payload: { code: "LUMBER3", display_name: "Lumber 3", pricing_model: "PER_SQFT", base_rate_cents: 200, hazmat_risk_flag: false, markdown_after_days: 30, markdown_step_pct: 0.20, markdown_interval_days: 15, max_markdown_steps: 2, floor_price_pct: 0.40, target_turn_days: 45 }
              as: StoreManager
              captures: { cat_id: $.data.id }
            - call: "POST /reuse/salvage-batches"
              payload: { job_id: "${job_id}", category_id: "${cat_id}", estimated_weight_lbs: 500 }
              as: CrewCoordinator
              captures: { batch_id: $.data.id }
          trigger:
            - call: "POST /reuse/salvage-batches/${batch_id}/weigh"
              payload: { scale_weight_lbs: 480, contamination_weight_lbs: 30 }
              as: CrewCoordinator
              captures: { b_div: $.data.diverted_weight_lbs, b_period: $.data.report_period }
            - call: "GET /reuse/deconstruction-jobs/${job_id}"
              as: CrewCoordinator
              captures: { j_cert: $.data.certified_diverted_weight_lbs }
            - call: "GET /reuse/diversion-reports/${rep_id}"
              as: WarehouseAdmin
              captures: { r_total: $.data.total_diverted_lbs, r_sold: $.data.sold_lbs }
          assert:
            - "Hop 1: batch WEIGHED, diverted_weight_lbs == 450, report_period == '2026-06'"
            - "Hop 2: job.certified_diverted_weight_lbs == 450 (caused by the batch's WEIGHED mutation)"
            - "Hop 3: OPEN DiversionReport.${rep_id}.total_diverted_lbs == 450 and sold_lbs == 450 (batch stream credited to retail share)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (3 instances, 3 distinct pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_suspended_finalize
        grounds:
          - validations[priority=7]
          - validations[priority=11]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Pair (state vs business_fiscal): the finalize targets a sale whose account was
          manually SUSPENDED after line-add AND whose credit_limit is 0 (so the fiscal
          credit check would also fail); priority 7 state wins over priority 11 fiscal.
        test_recipe:
          setup:
            - "Account G ACTIVE with credit_limit_cents 0; item priced 5000 placed; sale opened (account ACTIVE at open) with one line"
            - "WarehouseAdmin suspends the account before finalize"
          setup_api_calls:
            - call: "POST /reuse/categories"
