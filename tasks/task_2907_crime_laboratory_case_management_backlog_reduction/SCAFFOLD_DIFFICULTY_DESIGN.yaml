              as: QualityManager
              captures: { m1: $.data.id }
            - call: "POST /lab/methods/${m1}/validate"
              payload: { validation_study_item_count: 24, precision_cv_pct: 2.00, expires_at_utc: "2026-09-01T00:00:00Z" }
              as: QualityManager
            - call: "POST /lab/cases"
              payload: { agency_case_number: "A-2026-1414", submitting_agency: "COUNTY SO", offense_category: "AGG_ASSAULT", suspect_in_custody: false }
