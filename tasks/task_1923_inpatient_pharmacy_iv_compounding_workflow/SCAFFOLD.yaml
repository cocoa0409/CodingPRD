    output: StaffMember
    side_effects: []
  - method: GET
    path: /pharmacy/staff/{id}
    description: "Fetch one staff member"
    roles: [PharmacyAdmin, Prescriber, Pharmacist, PharmacyTechnician, Nurse, DiversionOfficer]
    code: 200
    input: []
    output: StaffMember
    side_effects: []
  - method: GET
    path: /pharmacy/staff
    description: "List staff"
    roles: [PharmacyAdmin, Prescriber, Pharmacist, PharmacyTechnician, Nurse, DiversionOfficer]
    code: 200
    input: ["staff_role?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []
  - method: POST
