            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v4: "$.data.version", unremitted_before: "$.data.unremitted_premium_cents", posture_before: "$.data.oversight_posture" }
            - call: "POST /remittance-statements"
              payload: { agency_id: "${ag_id}", period_start: "2026-07-01", period_end: "2026-07-31", expected_agency_version: "${ag_v4}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { st_id: "$.data.id" }
            - call: "POST /remittance-statements/${st_id}/lines"
              payload: { policy_file_id: "${pf1_id}", reported_gross_premium_cents: 20000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /remittance-statements/${st_id}/lines"
              payload: { policy_file_id: "${pf2_id}", reported_gross_premium_cents: 20000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /remittance-statements/${st_id}/lines"
              payload: { policy_file_id: "${pf3_id}", reported_gross_premium_cents: 20000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "SUBMITTED" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /remittance-statements/${st_id}/state"
              payload: { to_state: "RECONCILED" }
