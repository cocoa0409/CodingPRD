            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g11}", counselor_id: "${c11}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-15T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam11: $.data.id } }
            - { call: "POST /enrollment-campaigns/${cam11}/open", payload: {}, as: BenefitCounselor }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T23:59:59Z" }, as: CarrierAdmin }
          trigger:
            - { call: "POST /enrollment-campaigns/${cam11}/lock", payload: {}, as: BenefitCounselor, captures: { err11a: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns/${cam11}/lock", payload: {}, as: BenefitCounselor }
          assert:
            - "First lock at 2026-09-14T23:59:59Z fails: ${err11a} == ERR_WINDOW_NOT_CLOSED"
            - "Second lock at exactly 2026-09-15T00:00:00Z succeeds: EnrollmentCampaign.${cam11}.status == LOCKED"

      - name: claim_with_zero_remaining_occurrences_auto_denied
        grounds:
          - calculations.claim_payable
          - state_machines.Claim.UNDER_REVIEW_to_DENIED
          - errors[ERR_CAP_EXHAUSTED]
          - entities.Claim.fields.denial_reason
        distinguishing_aspect: |
          Zero-quantity metric (remaining occurrence count), reached via POST
          /claims/{id}/adjudicate (different endpoint and metric from the lock
          probe): when paid occurrences already equal max_occurrences_per_year,
          remaining == 0 is an auto-DENY (CAP_EXHAUSTED), while remaining == 1
          proceeds to partial/full approval — the boundary is at exactly zero.
