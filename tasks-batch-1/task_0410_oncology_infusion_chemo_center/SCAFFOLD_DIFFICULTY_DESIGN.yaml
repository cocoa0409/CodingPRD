  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_conflict_certified_vs_same_nurse
        grounds:
          - validations[priority=7]
          - validations[priority=8]
        distinguishing_aspect: |
          Error-category pair business_safety(7, ERR_NURSE_NOT_CERTIFIED) vs
          business_safety(8, ERR_SAME_NURSE_VERIFICATION): a verify by the SAME,
          UNCERTIFIED preparer nurse violates both; priority 7 wins so the response
          is ERR_NURSE_NOT_CERTIFIED, not ERR_SAME_NURSE_VERIFICATION.
