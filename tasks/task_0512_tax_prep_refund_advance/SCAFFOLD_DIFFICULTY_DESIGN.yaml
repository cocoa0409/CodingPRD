  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: advance_tier_boundary_99999_vs_100000
        grounds:
          - calculations.advance_max_eligible
          - validations[priority=14]
          - entities.TaxReturn.fields.expected_refund_cents
        distinguishing_aspect: "Numeric threshold boundary on the advance tier: expected_refund_cents=99999 yields tier_cap=0 → ERR_ADVANCE_INELIGIBLE, while 100000 (the >= breakpoint) yields tier_cap 50000 and approves; reachable through POST /refund-advances/{id}/underwrite."
        test_recipe:
          setup:
            - "Bank-product office; LOW-risk client; one return expected_refund_cents=99999 and one expected_refund_cents=100000; advances requested 50000 each."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Bound Office", efin: "101010", state_code: "NV", bank_product_enabled: true }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Bd Bob", ssn_last4: "1616", risk_band: "LOW" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2025, expected_refund_cents: 99999 }
              as: FrontDeskAgent
              captures: { ret_below: $.data.id }
            - call: "POST /returns"
              payload: { office_id: "${office_id}", client_id: "${client_id}", tax_year: 2024, return_kind: "PRIOR_YEAR", expected_refund_cents: 100000 }
              as: FrontDeskAgent
              captures: { ret_at: $.data.id }
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_below}", requested_cents: 50000 }
              as: BankProductOfficer
              captures: { adv_below: $.data.id }
            - call: "POST /refund-advances"
              payload: { tax_return_id: "${ret_at}", requested_cents: 50000 }
              as: BankProductOfficer
              captures: { adv_at: $.data.id }
          trigger:
            - call: "POST /refund-advances/${adv_below}/underwrite"
              payload: { decision: "APPROVE" }
              as: BankProductOfficer
              captures: { err: $.data.error_id }
            - call: "POST /refund-advances/${adv_at}/underwrite"
              payload: { decision: "APPROVE" }
              as: BankProductOfficer
              captures: { at_approved: $.data.approved_cents }
          assert:
            - "underwrite ${adv_below} error_id == ERR_ADVANCE_INELIGIBLE (409); RefundAdvance.${adv_below}.status remains REQUESTED"
            - "RefundAdvance.${adv_at}.approved_cents == 50000 and status == APPROVED"

      - name: appointment_checkin_at_exact_start_boundary
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CHECKED_IN
          - errors[ERR_APPOINTMENT_WINDOW_NOT_OPEN]
          - entities.Appointment.fields.start_utc
        distinguishing_aspect: "Empty/edge boundary on a different metric (a clock comparison reachable via POST /appointments/{id}/transition, not the advance numeric tier): check-in is rejected when clock < start_utc but succeeds at clock == start_utc (>= boundary)."
        test_recipe:
          setup:
            - "Office; preparer; client; appointment 2026-06-10T09:00Z–10:00Z; logical clock first at 08:59:59Z, then exactly 09:00:00Z."
          setup_api_calls:
            - call: "POST /offices"
              payload: { name: "Appt Office", efin: "121212", state_code: "MA" }
              as: OfficeManager
              captures: { office_id: $.data.id }
            - call: "POST /credentials"
              payload: { office_id: "${office_id}", ptin: "P77778888", holder_name: "Ap Ann", expires_on: "2027-01-01T00:00:00Z" }
              as: OfficeManager
              captures: { cred_id: $.data.id }
            - call: "POST /offices/${office_id}/preparers"
              payload: { credential_id: "${cred_id}", full_name: "Ap Ann" }
              as: OfficeManager
              captures: { prep_id: $.data.id }
            - call: "POST /offices/${office_id}/clients"
              payload: { full_name: "Ap Cli", ssn_last4: "1717" }
              as: FrontDeskAgent
              captures: { client_id: $.data.id }
            - call: "POST /offices/${office_id}/appointments"
              payload: { client_id: "${client_id}", preparer_id: "${prep_id}", start_utc: "2026-06-10T09:00:00Z", end_utc: "2026-06-10T10:00:00Z" }
              as: FrontDeskAgent
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:59:59Z" }
              as: OfficeManager
          trigger:
            - call: "POST /appointments/${appt_id}/transition"
              payload: { to: "CHECKED_IN" }
              as: FrontDeskAgent
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T09:00:00Z" }
              as: OfficeManager
            - call: "POST /appointments/${appt_id}/transition"
              payload: { to: "CHECKED_IN" }
              as: FrontDeskAgent
          assert:
            - "First transition error_id == ERR_APPOINTMENT_WINDOW_NOT_OPEN (409) at clock 08:59:59Z (< start)"
            - "Second transition succeeds at clock 09:00:00Z (== start, >= boundary): Appointment.${appt_id}.status == CHECKED_IN"

