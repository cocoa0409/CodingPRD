              payload: { dryer_id: "${dryer1}", load_id: "${lb3}", tons: 24.0, starts_at: "2026-09-03T17:00:00Z" }
              as: BuyingPointAdmin
              captures: { err: $.data.error_id }
          assert:
            - "DryerBooking.${bk1} BOOKED with ends_at == 2026-09-03T18:00:00Z"
            - "DryerBooking.${bk2} BOOKED starting exactly at bk1.ends_at (18:00): adjacency ALLOWED under half-open [start, end) semantics; ends_at == 2026-09-04T06:00:00Z"
