      - name: off_price_capacity_outranks_retailer_window_conflict
        grounds:
          - validations.priority_36
          - validations.priority_38
          - errors.ERR_OFF_PRICE_CAPACITY_EXCEEDED
          - errors.ERR_RETAILER_WINDOW_CONFLICT
        distinguishing_aspect: |
          Priority 36 (business_constraint) vs priority 38 (business_temporal) on one
          authorization-creation call. The requested OFF_PRICE window
          2026-06-15..2026-12-31 overlaps BOTH existing OFF_PRICE rows (so the aggregate
          would be 3 > MAX_CONCURRENT_OFF_PRICE 2) AND lies within the 30-day buffer of
          the same retailer_name/channel_class row that ends 2026-06-30. Expected:
