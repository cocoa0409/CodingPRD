  - rule_id: boundary_precision_check
    instances:
      - name: core_hours_threshold_at_and_one_below_forfeits_all_non_core_hours
        grounds:
          - calculations.participation_credit
          - calculations.required_hours_by_family_type
          - entities.ParticipationReport.fields.core_hours_credited
          - entities.WorkAssignment.fields.compliance_flag
        distinguishing_aspect: |
          For a SINGLE_PARENT case (required_core_monthly_hours 80,
          required_monthly_hours 120) a verified core report of exactly 80 hours
          keeps the 40 non-core hours countable and yields compliance_flag NONE,
          while 79 core hours forfeits all 40 non-core hours (not 1 hour of them)
          and yields SHORTFALL with a month total of 79, not 119.
