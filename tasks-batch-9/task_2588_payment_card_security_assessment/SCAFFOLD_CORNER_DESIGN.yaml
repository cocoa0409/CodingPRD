      - name: error_report_creation_gates_and_the_single_report_row_rule
        claim_type: ERR_ROC_ALREADY_EXISTS
        grounds:
          - validations[priority=13]
          - validations[priority=8]
          - errors[ERR_NO_APPLICABLE_REQUIREMENTS]
          - errors[ERR_REQUIREMENT_TESTING_INCOMPLETE]
          - errors[ERR_ROC_ALREADY_EXISTS]
          - errors[ERR_ENGAGEMENT_FROZEN]
        distinguishing_aspect: "The at-most-one-report rule is only observable after a revision returns the engagement to FIELDWORK: a second creation attempt while the engagement is REPORTING answers the priority-9 ERR_INVALID_ENGAGEMENT_STATE instead, so ERR_ROC_ALREADY_EXISTS requires a state where the transition is legal but the row already exists. The same recipe walks the two earlier report gates and shows that a report row freezes the engagement against all child writes."
        test_recipe:
          setup:
            - "Engagement 'Northwind Retail Inc' (L1) is in FIELDWORK with a VALIDATED CDE segment, three sampled components at DC-EAST, an ACTIVE FINAL plan and no requirement rows at all."
