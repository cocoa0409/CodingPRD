            - call: "POST /role-assignments"
              payload: { employee_id: "${ana_id}", job_role_id: "${bar_role_id}", effective_from: "2026-08-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-08-01T00:00:00Z", is_primary: false }
              as: PayrollAdmin
              captures: { ana_bar_id: $.data.id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${zed_id}", job_role_id: "${server_role_id}", effective_from: "2026-08-10T00:00:00Z", is_primary: true }
              as: PayrollAdmin
              captures: { err_sep_assign: $.data.error_id }
            - call: "POST /role-assignments"
              payload: { employee_id: "${zed_id}", job_role_id: "${server_role_id}", effective_from: "2026-07-01T00:00:00Z", tip_credit_notice_acknowledged_at: "2026-07-01T00:00:00Z", is_primary: true }
              as: PayrollAdmin
              captures: { zed_server_id: $.data.id }
