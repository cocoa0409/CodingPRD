            - call: "POST /emergency-overrides/${ovr_idem_id}/activate"
              payload: { authorized_by_operator_id: "${op_mco_id}", override_mode: CRAWL, crawl_text: "Severe thunderstorm warning in effect." }
              as: MasterControlOperator
              as_user_id: "${op_mco_id}"
              captures: { e_reactivate: "$.data.error_id" }
            - call: "POST /regulatory-notifications/${ntf_idem_id}/file"
              payload: { filed_reference: "FCC-2026-08-01-0001", narrative: "Power reduced to 50 percent for antenna de-icing; ERP restored the same day." }
              as: ComplianceOfficer
