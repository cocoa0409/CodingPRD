    output: ReviewScore
    side_effects: ["reviewer_user_id = X-User-ID", "uniqueness (cycle_id, application_id, reviewer_user_id)"]
  - method: GET
    path: "/api/review-scores"
    description: "List scores"
    roles: [ScholarshipCoordinator, CommitteeReviewer]
    code: 200
    input: ["cycle_id?", "application_id?", "limit?", "offset?"]
    output: "ReviewScore[]"
    side_effects: []
  - method: GET
    path: "/api/review-scores/{id}"
    description: "Get a score"
    roles: [ScholarshipCoordinator, CommitteeReviewer]
    code: 200
    input: []
    output: ReviewScore
    side_effects: []
  - method: POST
    path: "/api/review-scores/{id}/submit"
    description: "DRAFT -> SUBMITTED (computes weighted_total; COI rejected)"
    roles: [CommitteeReviewer]
    code: 200
    input: []
    output: ReviewScore
    side_effects: ["weighted_total computed"]
  - method: POST
    path: "/api/review-scores/{id}/recall"
    description: "SUBMITTED -> DRAFT while cycle still SCORING"
    roles: [CommitteeReviewer]
    code: 200
    input: []
    output: ReviewScore
    side_effects: ["weighted_total = null"]

  # --- Award ---
  - method: POST
    path: "/api/awards"
    description: "Create an award offer on a SELECTED application; reserves fund money"
    roles: [ScholarshipCoordinator]
    code: 201
    input: [application_id, student_id, amount_cents]
    output: Award
    side_effects: ["offer_status=OFFERED, funding_status=NONE", "Fund.reserved_cents += amount_cents", "Application SELECTED -> AWARDED", "offer_expires_at = created_at + 14d", "fiscal check ERR_INSUFFICIENT_FUNDS"]
  - method: GET
    path: "/api/awards"
    description: "List awards"
    roles: [ScholarshipCoordinator, Student, FinancialAidOfficer]
    code: 200
    input: ["application_id?", "student_id?", "offer_status?", "limit?", "offset?"]
    output: "Award[]"
    side_effects: []
  - method: GET
    path: "/api/awards/{id}"
    description: "Get an award"
    roles: [ScholarshipCoordinator, Student, FinancialAidOfficer]
    code: 200
    input: []
    output: Award
    side_effects: []
  - method: PATCH
    path: "/api/awards/{id}"
    description: "Adjust amount while OFFERED (OCC-guarded)"
    roles: [ScholarshipCoordinator]
    code: 200
    input: [expected_award_version, "amount_cents?"]
    output: Award
    side_effects: ["Fund.reserved_cents recomputed", "increments Award.version by 1"]
  - method: POST
    path: "/api/awards/{id}/accept"
    description: "Student accepts; OFFERED->ACCEPTED and NONE->ENCUMBERED; stacking-cap check may auto-create adjustments"
    roles: [Student]
    code: 200
    input: []
    output: Award
    side_effects: ["accepted_at = now", "Student totals recomputed", "over_award_recovery_order on excess"]
  - method: POST
    path: "/api/awards/{id}/decline"
    description: "Student declines; reservation released; waitlist promotion fires"
    roles: [Student]
    code: 200
    input: []
    output: Award
    side_effects: ["Fund.reserved_cents -= amount_cents", "waitlist promotion"]
  - method: POST
    path: "/api/awards/{id}/revoke"
    description: "Coordinator revokes an OFFERED/ACCEPTED award"
    roles: [ScholarshipCoordinator]
    code: 200
    input: []
    output: Award
    side_effects: ["reservation release", "waitlist promotion if no CONFIRMED disbursement"]
  - method: POST
    path: "/api/awards/{id}/schedule-split"
    description: "Generate the per-term SCHEDULED disbursement plan per disbursement_split (replaces any CANCELLED-free existing plan only when none exists)"
    roles: [ScholarshipCoordinator]
    code: 200
    input: [term_count]
    output: "Disbursement[]"
    side_effects: ["creates term_count SCHEDULED Disbursements", "ERR_AMOUNT_EXCEEDS_REMAINING if a plan already exists", "ERR_INVALID_STATE unless ACCEPTED"]

  # --- Disbursement ---
  - method: POST
    path: "/api/disbursements"
    description: "Manually schedule a disbursement (closed-interval term overlap check per award over rows with status IN {SCHEDULED, SENT, CONFIRMED})"
    roles: [ScholarshipCoordinator]
    code: 201
    input: [award_id, term_seq, amount_cents, scheduled_date, term_start_date, term_end_date, institution_name]
    output: Disbursement
    side_effects: ["status=SCHEDULED", "overlap check", "remaining-amount check"]
  - method: GET
    path: "/api/disbursements"
    description: "List disbursements"
    roles: [ScholarshipCoordinator, FinancialAidOfficer, Student]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: "Disbursement[]"
    side_effects: []
  - method: GET
    path: "/api/disbursements/{id}"
    description: "Get a disbursement"
    roles: [ScholarshipCoordinator, FinancialAidOfficer, Student]
    code: 200
    input: []
    output: Disbursement
    side_effects: []
  - method: POST
    path: "/api/disbursements/{id}/send"
    description: "SCHEDULED -> SENT (date gate)"
    roles: [ScholarshipCoordinator]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["sent_at, sent_by_user_id recorded"]
  - method: POST
    path: "/api/disbursements/{id}/confirm"
    description: "SENT -> CONFIRMED (segregation: confirmer != sender); triggers Cascade A"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["fund aggregates updated", "award funding_status recomputed", "FULLY_DISBURSED -> ThankYouLetter auto-create -> DonorReport staleness"]
  - method: POST
    path: "/api/disbursements/{id}/mark-returned"
    description: "SENT/CONFIRMED -> RETURNED (money clawed back when from CONFIRMED)"
    roles: [FinancialAidOfficer]
    code: 200
    input: [returned_reason]
    output: Disbursement
    side_effects: ["fund returned_cents += amount when from CONFIRMED", "award funding_status recomputed"]
  - method: POST
    path: "/api/disbursements/{id}/reschedule"
    description: "RETURNED -> SCHEDULED with new date/window (retry cycle)"
    roles: [ScholarshipCoordinator]
    code: 200
    input: [scheduled_date, term_start_date, term_end_date]
    output: Disbursement
    side_effects: ["timestamps cleared", "overlap rechecked"]
  - method: POST
    path: "/api/disbursements/{id}/cancel"
    description: "SCHEDULED -> CANCELLED"
    roles: [ScholarshipCoordinator]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  # --- AwardAdjustment ---
  - method: POST
    path: "/api/award-adjustments"
    description: "Create a DRAFT adjustment (duplicate/over-award/data-error/withdrawal)"
    roles: [ScholarshipCoordinator, FinancialAidOfficer]
    code: 201
    input: [award_id, reason, delta_cents]
    output: AwardAdjustment
    side_effects: ["created_by_user_id = X-User-ID"]
  - method: GET
    path: "/api/award-adjustments"
    description: "List adjustments"
    roles: [ScholarshipCoordinator, FinancialAidOfficer]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: "AwardAdjustment[]"
    side_effects: []
  - method: GET
    path: "/api/award-adjustments/{id}"
    description: "Get an adjustment"
    roles: [ScholarshipCoordinator, FinancialAidOfficer]
    code: 200
    input: []
    output: AwardAdjustment
    side_effects: []
  - method: POST
    path: "/api/award-adjustments/{id}/submit"
    description: "DRAFT -> PENDING_APPROVAL"
    roles: [ScholarshipCoordinator, FinancialAidOfficer]
    code: 200
    input: []
    output: AwardAdjustment
    side_effects: []
  - method: POST
    path: "/api/award-adjustments/{id}/approve"
    description: "PENDING_APPROVAL -> APPLIED (segregation + fiscal floors); applies delta to award"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: AwardAdjustment
    side_effects: ["Award.amount_cents += delta_cents", "fund/student aggregates recomputed", "funding_status may become OVER_DISBURSED", "Cascade B link 2"]
  - method: POST
    path: "/api/award-adjustments/{id}/reject"
    description: "PENDING_APPROVAL -> REJECTED (segregation)"
    roles: [FinancialAidOfficer]
    code: 200
    input: []
    output: AwardAdjustment
    side_effects: []

  # --- RenewalEvaluation ---
  - method: POST
    path: "/api/renewal-evaluations"
    description: "Open a renewal evaluation for a FULLY_DISBURSED renewable award"
    roles: [ScholarshipCoordinator, Student]
    code: 201
    input: [award_id, term_label, reported_gpa_hundredths, reported_credits]
    output: RenewalEvaluation
    side_effects: ["status=PENDING", "gates: program.renewable, award FULLY_DISBURSED, renewal_count < max_renewals, no other open evaluation"]
  - method: GET
    path: "/api/renewal-evaluations"
    description: "List renewal evaluations"
    roles: [ScholarshipCoordinator, Student]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: "RenewalEvaluation[]"
    side_effects: []
  - method: GET
    path: "/api/renewal-evaluations/{id}"
    description: "Get a renewal evaluation"
    roles: [ScholarshipCoordinator, Student]
    code: 200
    input: []
    output: RenewalEvaluation
    side_effects: []
  - method: POST
    path: "/api/renewal-evaluations/{id}/verify"
    description: "PENDING/APPEALED -> VERIFIED_ELIGIBLE or VERIFIED_INELIGIBLE per renewal_threshold_check"
    roles: [ScholarshipCoordinator]
    code: 200
    input: [registrar_gpa_hundredths, registrar_credits]
    output: RenewalEvaluation
    side_effects: ["threshold check (>= inclusive)"]
  - method: POST
    path: "/api/renewal-evaluations/{id}/appeal"
    description: "VERIFIED_INELIGIBLE -> APPEALED (appeal cycle)"
    roles: [ScholarshipCoordinator, Student]
    code: 200
    input: [appeal_note]
    output: RenewalEvaluation
    side_effects: []
  - method: POST
    path: "/api/renewal-evaluations/{id}/finalize-renewal"
    description: "ELIGIBLE+RENEW -> RENEWED (award tranche added); INELIGIBLE+LAPSE -> LAPSED"
    roles: [ScholarshipCoordinator]
    code: 200
    input: [decision]
    output: RenewalEvaluation
    side_effects: ["renewal_count += 1 and amount tranche on RENEW", "fund/stacking recompute"]

  # --- ThankYouLetter ---
  - method: GET
    path: "/api/thank-you-letters"
    description: "List thank-you letters"
    roles: [ScholarshipCoordinator, Student, Donor]
    code: 200
    input: ["award_id?", "status?", "limit?", "offset?"]
    output: "ThankYouLetter[]"
    side_effects: []
  - method: GET
    path: "/api/thank-you-letters/{id}"
    description: "Get a thank-you letter"
    roles: [ScholarshipCoordinator, Student, Donor]
    code: 200
    input: []
    output: ThankYouLetter
    side_effects: []
  - method: POST
    path: "/api/thank-you-letters/{id}/submit"
    description: "REQUIRED/REVISION_REQUESTED -> SUBMITTED"
    roles: [Student]
    code: 200
    input: [content_ref]
    output: ThankYouLetter
    side_effects: []
  - method: POST
    path: "/api/thank-you-letters/{id}/request-revision"
    description: "SUBMITTED -> REVISION_REQUESTED"
    roles: [ScholarshipCoordinator]
    code: 200
    input: []
    output: ThankYouLetter
    side_effects: []
  - method: POST
    path: "/api/thank-you-letters/{id}/approve"
    description: "SUBMITTED -> APPROVED"
    roles: [ScholarshipCoordinator]
    code: 200
    input: []
    output: ThankYouLetter
    side_effects: []
  - method: POST
    path: "/api/thank-you-letters/{id}/deliver"
    description: "APPROVED -> DELIVERED"
    roles: [ScholarshipCoordinator]
    code: 200
    input: []
    output: ThankYouLetter
    side_effects: ["GENERATED DonorReports of the donor -> DRAFT"]
  - method: POST
    path: "/api/thank-you-letters/{id}/waive"
    description: "REQUIRED -> WAIVED (anonymous donors only)"
    roles: [ScholarshipCoordinator]
    code: 200
    input: []
    output: ThankYouLetter
    side_effects: []

  # --- DonorReport ---
  - method: POST
    path: "/api/donor-reports"
    description: "Create a DRAFT donor report for a period"
    roles: [ScholarshipCoordinator]
    code: 201
    input: [donor_id, period_start, period_end]
    output: DonorReport
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/api/donor-reports"
    description: "List donor reports"
    roles: [ScholarshipCoordinator, Donor]
    code: 200
    input: ["donor_id?", "status?", "limit?", "offset?"]
    output: "DonorReport[]"
    side_effects: []
  - method: GET
    path: "/api/donor-reports/{id}"
    description: "Get a donor report"
    roles: [ScholarshipCoordinator, Donor]
    code: 200
    input: []
    output: DonorReport
    side_effects: ["thank_you_complete refreshed on read"]
  - method: POST
    path: "/api/donor-reports/{id}/generate"
    description: "DRAFT -> GENERATED (computes aggregates over the half-open period)"
    roles: [ScholarshipCoordinator]
    code: 200
    input: []
    output: DonorReport
    side_effects: ["donor_report_aggregation computed"]
  - method: POST
    path: "/api/donor-reports/{id}/send"
    description: "GENERATED -> SENT (requires thank_you_complete)"
    roles: [ScholarshipCoordinator]
    code: 200
    input: []
    output: DonorReport
    side_effects: ["sent_at = now"]
  - method: POST
    path: "/api/donor-reports/{id}/acknowledge"
    description: "SENT -> ACKNOWLEDGED (donor self)"
    roles: [Donor]
    code: 200
    input: []
    output: DonorReport
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unknown X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's allowed roles" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Entity-backed identity mismatch (student/donor/reviewer acting on another's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum, score out of 0..100 range, non-positive amount" }
  - { id: ERR_INVALID_DATE_RANGE, http: 400, condition: "close_at <= open_at, ends_on <= starts_on, term_end_date < term_start_date, or extend with new_close_at <= current close_at" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's own state does not permit the transition" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Application create/submit while program not OPEN" }
  - { id: ERR_WINDOW_NOT_OPEN, http: 422, condition: "Publish attempted before application_open_at" }
  - { id: ERR_DEADLINE_PASSED, http: 422, condition: "Submit attempted at or after application_close_at (strict <)" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Non-terminal application already exists for (student_id, program_id)" }
  - { id: ERR_COMPONENT_INCOMPLETE, http: 422, condition: "Submit with a required component not ACCEPTED/WAIVED" }
  - { id: ERR_INELIGIBLE_STUDENT, http: 422, condition: "STRICT program submit with a failed hard criterion (verified score 0.00)" }
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 409, condition: "Review cycle half-open window [starts_on, ends_on) overlaps another cycle of the same program; adjacency (ends_on == starts_on) is allowed" }
  - { id: ERR_REVIEWER_DUPLICATE_SCORE, http: 409, condition: "Same reviewer already has a score for (cycle_id, application_id)" }
  - { id: ERR_CONFLICT_OF_INTEREST, http: 422, condition: "Submitting a score declared conflict_of_interest=true" }
  - { id: ERR_QUORUM_NOT_MET, http: 422, condition: "Deliberation/finalize with an UNDER_REVIEW application below quorum_count scores" }
  - { id: ERR_AWARD_NOT_ACCEPTED, http: 409, condition: "Disbursement create/send against an award not in ACCEPTED + ENCUMBERED/DISBURSING" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 422, condition: "Award offer amount exceeds fund available_cents" }
  - { id: ERR_DISBURSEMENT_WINDOW_OVERLAP, http: 409, condition: "Closed term interval [term_start_date, term_end_date] overlaps another disbursement of the same award whose status is IN {SCHEDULED, SENT, CONFIRMED} (RETURNED and CANCELLED rows free their window; the row being rescheduled excludes itself); sharing one calendar day IS overlap" }
  - { id: ERR_AMOUNT_EXCEEDS_REMAINING, http: 422, condition: "Sum of non-cancelled disbursements would exceed award amount_cents (or split plan already exists)" }
  - { id: ERR_DISBURSEMENT_TOO_EARLY, http: 422, condition: "Send before scheduled_date (current date < scheduled_date)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Adjustment approver == creator, or disbursement confirmer == sender" }
  - { id: ERR_ADJUSTMENT_EXCEEDS_DISBURSED, http: 422, condition: "DUPLICATE/DATA_ERROR clawback would push award amount_cents below net_confirmed (money already out the door); OVER_AWARD/WITHDRAWAL may do so and yield OVER_DISBURSED" }
  - { id: ERR_RENEWAL_NOT_ELIGIBLE, http: 409, condition: "finalize-renewal decision does not match the evaluation's verified status" }
  - { id: ERR_MAX_RENEWALS_REACHED, http: 422, condition: "Renewal evaluation create/finalize when award.renewal_count >= program.max_renewals" }
  - { id: ERR_DUPLICATE_RENEWAL_EVALUATION, http: 409, condition: "An evaluation in a non-terminal status already exists for the award" }
  - { id: ERR_TYL_NOT_WAIVABLE, http: 422, condition: "Waive attempted for a non-anonymous donor" }
  - { id: ERR_REPORT_INCOMPLETE, http: 422, condition: "Send attempted while covered thank-you letters are not all DELIVERED/WAIVED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Student
    description: "Applicant and award recipient; acts only on own records"
    identity: "entity_backed:Student"
    exclusive_operations:
      - "POST /api/awards/{id}/accept, /decline (own awards)"
      - "POST /api/thank-you-letters/{id}/submit (own letters)"
    shared_operations:
      - "POST /api/applications, submit, withdraw (own; shared with ScholarshipCoordinator)"
      - "POST /api/applications/{id}/components, /api/components/{id}/receive (own)"
      - "POST /api/renewal-evaluations, /appeal (own awards)"
      - "GET own student record, applications, awards, disbursements, letters, aid-summary"
  - name: ScholarshipCoordinator
    description: "School scholarship office operator; runs the full workflow except money confirmation and adjustment approval"
    identity: "opaque"
    exclusive_operations:
      - "Student/program/fund/cycle/report create and management, including POST /api/students/{id}/archive"
      - "POST /api/components/{id}/accept, /reject, /waive"
      - "POST /api/applications/{id}/return"
      - "POST /api/review-cycles/{id}/open-scoring, /open-deliberation, /reopen-scoring, /finalize"
      - "POST /api/awards (offer), /revoke, /schedule-split, PATCH amount"
      - "POST /api/disbursements, /send, /reschedule, /cancel"
      - "POST /api/renewal-evaluations/{id}/verify, /finalize-renewal"
      - "POST /api/donor-reports/{id}/generate, /send"
    shared_operations:
      - "POST /api/award-adjustments, /submit (shared with FinancialAidOfficer)"
      - "POST /api/applications, submit, withdraw (on behalf of students)"
      - "GET on all business resources"
  - name: CommitteeReviewer
    description: "Local scholarship committee member; scores applications only"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/review-scores (creates own DRAFT scores)"
      - "POST /api/review-scores/{id}/submit, /recall (own scores only)"
    shared_operations:
      - "GET programs, applications, review-cycles, review-scores"
  - name: FinancialAidOfficer
    description: "Money-movement confirmer and adjustment approver (second pair of eyes)"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/disbursements/{id}/confirm, /mark-returned (never the sender)"
      - "POST /api/award-adjustments/{id}/approve, /reject (never the creator)"
    shared_operations:
      - "POST /api/award-adjustments, /submit (shared with ScholarshipCoordinator)"
      - "GET funds, awards, disbursements, adjustments, students, aid-summary"
  - name: Donor
    description: "Scholarship sponsor; reads own reports and acknowledges them"
    identity: "entity_backed:Donor"
    exclusive_operations:
      - "POST /api/donor-reports/{id}/acknowledge (own reports)"
    shared_operations:
      - "GET own donor record, programs, reports, thank-you letters"
  - name: PlatformAdmin
    description: "System operator for the logical clock and ops-run checkpoint"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/_clock/set_current_utc"
      - "POST /api/_ops/run_daily"
    shared_operations: []
