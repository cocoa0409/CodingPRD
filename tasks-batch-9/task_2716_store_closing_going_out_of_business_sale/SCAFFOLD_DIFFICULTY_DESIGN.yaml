  - rule_id: compensating_invariant
    instances:

      - name: return_unsold_conserves_augmentation_units_accounted
        grounds:
          - calculations.augmentation_unit_conservation
          - state_machines.AugmentationConsignment.RECEIVED_to_RETURNED
          - entities.Store.fields.augmentation_units_accounted
          - entities.InventoryLot.fields.units_returned
          - endpoints[POST /augmentation-consignments/{id}/return-unsold]
        distinguishing_aspect: |
          The conserved quantity is UNITS: Store.augmentation_units_accounted must equal 200 after
          receipt, after a sale of 50 units and after 150 unsold units are returned to the supplier
          — the units only move between units_on_hand, units_sold and units_returned. Everything
          around it legitimately moves (units_initial_total drops 1,400 -> 1,250,
