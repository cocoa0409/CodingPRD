              captures: { zone_id: $.data.id }
            - call: "POST /api/technicians"
              payload: { name: "TechA", depot_zone_id: "${zone_id}", on_shift: true }
              as: PlatformAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /api/technicians"
              payload: { name: "TechB", depot_zone_id: "${zone_id}", on_shift: true }
              as: PlatformAdmin
              captures: { tech_b_id: $.data.id }
            - call: "POST /api/vehicles"
              payload: { vehicle_type: "SCOOTER", qr_code: "QR-RB2", battery_pct: 50, current_zone_id: "${zone_id}" }
              as: PlatformAdmin
              captures: { veh_id: $.data.id, veh_v: $.data.version }
            - call: "POST /api/rebalancing-tasks"
