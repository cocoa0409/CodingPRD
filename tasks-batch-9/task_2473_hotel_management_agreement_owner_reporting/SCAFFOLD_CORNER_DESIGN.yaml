              as: PlatformAdmin
              captures: { tb_v2: $.data.version }
            - call: "POST /hotel-management/agreements/${tb_agr}/budgets"
              payload: { fiscal_year: 2026, budgeted_revenue_cents: 300000000, budgeted_operating_expenses_cents: 20000000, budgeted_capital_ffe_cents: 20000000, expected_agreement_version: "${tb_v2}" }
              as: HotelManagerOps
              captures: { tb_bud: $.data.id }
            - call: "POST /hotel-management/budgets/${tb_bud}/submit"
              payload: {}
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
            - call: "POST /hotel-management/budgets/${tb_bud}/decision"
              payload: { decision: "APPROVE" }
              as: OwnerRep
              as_user_id: "u-owner-1"
          trigger:
            - call: "POST /hotel-management/budgets/${tb_bud}/variance-requests"
              payload: { category: "OPERATING", requested_amount_cents: 1000001, justification: "boiler repair at the tier boundary" }
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
              captures: { tb_v_at: $.data.id }
            - call: "POST /hotel-management/budgets/${tb_bud}/variance-requests"
              payload: { category: "CAPITAL_FFE", requested_amount_cents: 1010000, justification: "guestroom soft goods top-up just over the tier" }
              as: HotelManagerOps
              as_user_id: "u-mgr-1"
              captures: { tb_v_over: $.data.id }
          assert:
            - "VarianceRequest.${tb_v_at}.effective_baseline_cents == 20000000 and variance_pct == 0.050000"
            - "VarianceRequest.${tb_v_at}.approval_level == MANAGER_DISCRETION and status == AUTO_APPROVED with decided_by_user_id null"
            - "VarianceRequest.${tb_v_over}.effective_baseline_cents == 20000000 — the OPERATING approval does not raise the CAPITAL_FFE baseline"
            - "VarianceRequest.${tb_v_over}.variance_pct == 0.050500, approval_level == ASSET_MANAGER and status == PENDING"

