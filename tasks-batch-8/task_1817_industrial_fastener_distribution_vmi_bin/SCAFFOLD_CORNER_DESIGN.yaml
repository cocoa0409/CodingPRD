          - "errors[ERR_INSUFFICIENT_STOCK]"
        distinguishing_aspect: "qty_per_part * kit_count exceeding a component's available_qty returns ERR_INSUFFICIENT_STOCK and no reservation is made (aggregate check across the whole component list)."
