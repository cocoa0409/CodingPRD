      - name: contribution_amount_exactly_equal_to_max_allowed_then_one_cent_over
        grounds:
          - calculations.contribution_allowance.formula
          - validations[priority=29].error_id
          - entities.PacContribution.fields.max_allowed_cents
        distinguishing_aspect: |
          Straddles the inclusive fiscal boundary from both sides in one scenario: amount_cents == max_allowed_cents
          (250000) is accepted, and the very next request for max_allowed_cents + 1 against the shrunken remaining
          headroom is refused, so an implementation using > instead of >= (or forgetting that PENDING_BOARD rows
          already consume headroom) fails exactly one of the two calls.
        test_recipe:
          setup:
            - "One FEDERAL SegregatedFund for 2026 with min_reserve_cents 0 and no receipts (creation never touches the balance)."
            - "One FEDERAL INCUMBENT candidate with voting_alignment_pct 90.00 and committee_relevance_score 80 and no alerts in the district, so support_score is 80.50 and the tier share is 0.50 of the 500000 FEDERAL limit."
