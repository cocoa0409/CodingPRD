            - "both: state == RESOLVED, resolved_at == 2026-08-01T01:41:00.000Z, downtime_minutes == 101, first_response_breached == false"
            - "both: affected_assignment_count == 0 and total_credit_calls == 0 (no ACTIVE assignment on either product)"
            - "both: communication_count == 2 and last_communication_at is the second communication's sent_at"

      - name: hard_throttle_at_exactly_full_consumption_with_zero_overage
        claim_type: threshold
        grounds:
          - calculations.usage_consumption_attribution
