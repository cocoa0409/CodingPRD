        grounds: ["validations[priority=9]", "errors[ERR_ROUTE_CAPACITY_EXCEEDED]", "entities.PickupRoute.fields.total_volume_cuft"]
        distinguishing_aspect: "Truck capacity is inclusive: 60 + 40 == 100 fits exactly; one more cubic foot rejects ERR_ROUTE_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["STAFF driver; three donors; DRAFT route capacity 100"]
          setup_api_calls:
