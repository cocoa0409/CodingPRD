# =====================================================================
# §1.9 Scaffold Corner Design - breadth coverage index
# Task 2870 - Window Treatment Measure-and-Install Franchise
#
# Walk of references/claim-extraction-guide.md section by section against
# this scaffold's §1.1-§1.7 surface. Every corner that SCAFFOLD_DIFFICULTY_DESIGN.yaml
# already asserts is emitted as an `excluded_because:` stub naming the §1.8 instance.
# Names are unique across the union of both design files.
# =====================================================================
scaffold_corner_design:

  # -------------------------------------------------------------------
  # Guide section 1 - Entities (Table 1) + entity_topology: flat
  # -------------------------------------------------------------------
  - section: entities
    instances:
      - name: territory_creation_returns_every_declared_field_at_its_start_value
        claim_type: Creation
        grounds:
          - entities.Territory
          - endpoints.POST_blinds_territories
        distinguishing_aspect: "A territory chartered with every optional input supplied comes back 201 with status ACTIVE, version 1 and all seven derived counters at 0 - none of them is null and none is omitted from the envelope."
        test_recipe:
          setup:
            - "Empty database. No other row of any kind exists."
          setup_api_calls: []
          trigger:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301", "30302"], royalty_rate_pct: 0.0625, lead_capacity_per_week: 7, credit_limit_cents: 750000, liability_window: "LIFETIME" }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id, tv1: $.data.version }
          assert:
            - "201 with Territory.${t1}.legal_name == 'Northgate Blinds LLC' and postal_codes == ['30301', '30302'] in the order supplied"
            - "the six input fields are echoed exactly: royalty_rate_pct == 0.0625, lead_capacity_per_week == 7, credit_limit_cents == 750000, liability_window == LIFETIME"
            - "status == ACTIVE (system field, not accepted from the caller) and the captured ${tv1} == 1"
            - "all seven computed counters are present and 0: open_leads_count, net_sales_cents, royalty_accrued_cents, remake_chargeback_cents, open_order_exposure_cents, available_kit_count, on_loan_kit_count - and lost_kit_count is 0 as well"
            - "id is a bare UUID with no type prefix and created_at == updated_at as an ISO 8601 UTC instant with exactly three fractional digits"

      - name: designer_read_back_is_byte_identical_to_the_create_response
        claim_type: Retrieval
        grounds:
          - entities.Designer
          - endpoints.GET_blinds_designers_id
        distinguishing_aspect: "A GET by id returns the stored row with no re-derivation: the score stamped at hire is still 100, the three incident counters are still 0, and version has NOT advanced merely from being read."
        test_recipe:
          setup:
            - "One ACTIVE territory and one designer hired into it with two certifications."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301", certifications: ["MOTORIZATION", "CHILD_SAFETY"] }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id, dv1: $.data.version }
          trigger:
            - call: "GET /blinds/designers/${d1}"
              as: Designer
              as_user_id: "${d1}"
              captures: { read_version: $.data.version }
          assert:
            - "200 with Designer.${d1}.territory_id == ${t1}, full_name == 'Dana Reed', home_postal_code == '30301' and certifications == ['MOTORIZATION', 'CHILD_SAFETY']"
            - "status == ACTIVE and remeasure_liability_score == 100 (BASE_SCORE), stamped at hire"
            - "remeasure_exception_count == 0, late_sample_return_count == 0 and clean_install_count == 0"
            - "the captured ${read_version} equals the captured ${dv1} == 1 - a read is not a mutation"

      - name: designer_listing_filters_by_territory_and_pages_with_total_count
        claim_type: Listing
        grounds:
          - endpoints.GET_blinds_designers
          - response_envelope.pagination_fields
        distinguishing_aspect: "Filter, limit and offset compose on one list: three designers in territory A and one in territory B, read with territory_id + limit 2 + offset 2, must report total_count 3 (the FILTERED population, not the table) with has_more false and exactly one row."
        test_recipe:
          setup:
            - "Territory A with three designers created in a known order, and territory B with one designer."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/territories"
              payload: { legal_name: "Southbank Blinds LLC", postal_codes: ["30401"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t2: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Eli Voss", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d2: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Fay Ortiz", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d3: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t2}", full_name: "Gus Hale", home_postal_code: "30401" }
              as: Franchisee
              as_user_id: "${t2}"
              captures: { d4: $.data.id }
          trigger:
            - call: "GET /blinds/designers?territory_id=${t1}&limit=2&offset=0"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { page1_first: "$.data[0].id", page1_second: "$.data[1].id" }
            - call: "GET /blinds/designers?territory_id=${t1}&limit=2&offset=2"
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { page2_first: "$.data[0].id" }
          assert:
            - "the first page returns response_type 'array' with exactly 2 rows, total_count 3, limit 2, offset 0 and has_more true"
            - "the second page returns exactly 1 row, total_count 3, limit 2, offset 2 and has_more false"
            - "the pages partition the filtered population with no overlap: the captured ${page1_first}, ${page1_second} and ${page2_first} are three distinct ids and none of them is ${d4}"
            - "the designer of the other territory is excluded by the filter, not by pagination: GET /blinds/designers?territory_id=${t2} returns total_count 1 with the single row ${d4}"
            - "GET /blinds/designers with no filter at all returns total_count 4 and the default limit 10"

      - name: unsupplied_optional_inputs_fall_back_to_their_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Territory.fields.royalty_rate_pct
          - entities.Territory.fields.lead_capacity_per_week
          - entities.Territory.fields.credit_limit_cents
          - entities.Territory.fields.liability_window
          - entities.Lead.fields.child_occupied_dwelling
          - entities.Designer.fields.certifications
        distinguishing_aspect: "Every optional input omitted at once: the territory takes 0.055 / 5 / 2000000 / ROLLING_180D, the designer takes an empty certification array (not null), and the lead takes child_occupied_dwelling false - which is what later makes a CORDED sale legal for that lead."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id, rate: $.data.royalty_rate_pct }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "GET /blinds/leads/${l1}"
              as: Franchisee
              as_user_id: "${t1}"
              captures: { child_flag: $.data.child_occupied_dwelling, lead_status: $.data.status }
          assert:
            - "the captured ${rate} == 0.055 and Territory.${t1}.lead_capacity_per_week == 5, credit_limit_cents == 2000000, liability_window == ROLLING_180D"
            - "Designer.${d1}.certifications == [] - an empty array, not null and not absent"
            - "the defaults are stored, not just echoed back: the captured ${child_flag} == false on a later read of the lead, with ${lead_status} == ROUTED"
            - "GET /blinds/territories/${t1} reports the same four territory defaults as the create response did"

      - name: opening_geometry_and_price_are_computed_and_caller_values_are_impossible_to_inject
        claim_type: Computed Fields
        grounds:
          - entities.Opening.fields.out_of_square_in
          - entities.Opening.fields.ordered_width_in
          - entities.Opening.fields.list_price_cents
          - calculations.opening_finished_dimensions
          - endpoints.POST_blinds_openings
        distinguishing_aspect: "The measurement create endpoint declares NO input for out_of_square_in, ordered_width_in, ordered_height_in, billable_sqft or list_price_cents, so the only way they can be wrong is a bad derivation: an INSIDE opening with a racked frame reports out_of_square 0.500 from the six readings, and its price stays 0 until a fabric is chosen."
        test_recipe:
          setup:
            - "One ACTIVE territory, one designer, one routed lead and one SCHEDULED consultation."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Den bay", room_type: "LIVING_ROOM", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.500, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { o1: $.data.id, oos: $.data.out_of_square_in }
            - call: "PATCH /blinds/openings/${o1}/configuration"
              payload: { fabric_code: "LT-SHEER", lift_system: "CORDED" }
              as: Designer
              as_user_id: "${d1}"
              captures: { price: $.data.list_price_cents }
          assert:
            - "on create the captured ${oos} == 0.500 - max(width spread 0.000, height spread 0.500) - while ordered_width_in == 23.500 (floor of 24.000 - 0.500 to the eighth) and ordered_height_in == 47.750 (floor of the SHORTEST height 48.000 - 0.250)"
            - "on create list_price_cents == 0 and billable_sqft == 0 - pricing does not run at measurement time - and measure_status == MEASURED with install_outcome PENDING and credited false"
            - "after the configuration patch the captured ${price} == 4960: billable 23.500 x 47.750 -> 7.7925 sqft raised to the quarter 8.000, times the LT-SHEER rate 620, plus 0 for CORDED"
            - "billable_sqft == 8.000 is stored alongside the price, and measure_status is now CONFIGURED"
            - "the derived geometry never moved: ordered_width_in is still 23.500 and out_of_square_in is still 0.500 after pricing"

      - name: body_foreign_keys_are_resolved_in_the_declared_input_order
        claim_type: Parent Relationships
        grounds:
          - validations.priority_4_body_foreign_keys
          - endpoints.POST_blinds_consultations
          - endpoints.POST_blinds_openings
        distinguishing_aspect: "entity_topology is flat, so every parent arrives as a body FK and the error is decided by INPUT ORDER, not by which lookup is cheaper: with both lead_id and designer_id unresolvable the consultation create reports ERR_LEAD_NOT_FOUND, because lead_id is declared first."
        test_recipe:
          setup:
            - "One ACTIVE territory with one designer, one routed lead and one SCHEDULED consultation with one measured opening - so that each negative probe has exactly one unresolvable field."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /blinds/consultations"
              payload: { lead_id: "11111111-1111-4111-8111-111111111111", designer_id: "22222222-2222-4222-8222-222222222222", scheduled_start_at: "2026-08-04T14:00:00.000Z", scheduled_end_at: "2026-08-04T15:00:00.000Z", service_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_first_field: $.data.error_id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "22222222-2222-4222-8222-222222222222", scheduled_start_at: "2026-08-04T14:00:00.000Z", scheduled_end_at: "2026-08-04T15:00:00.000Z", service_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_second_field: $.data.error_id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Re-measure", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000, replaces_opening_id: "33333333-3333-4333-8333-333333333333" }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_self_ref: $.data.error_id }
          assert:
            - "both FKs bogus -> 404 with error_id == ERR_LEAD_NOT_FOUND, decided by lead_id being first in the endpoint's declared input list"
            - "lead real, designer bogus -> 404 with error_id == ERR_DESIGNER_NOT_FOUND"
            - "the self-referential FK is checked the same way: an unresolvable replaces_opening_id -> 404 with error_id == ERR_OPENING_NOT_FOUND"
            - "no row was created by any of the three probes: GET /blinds/consultations?designer_id=${d1} returns total_count 1 (${c1}) and GET /blinds/openings?consultation_id=${c1} returns total_count 0"

      - name: enum_and_numeric_domain_breaches_split_across_two_error_ids
        claim_type: Type Constraints
        grounds:
          - validations.priority_7_ERR_INVALID_REQUEST
          - validations.priority_8_ERR_VALUE_OUT_OF_RANGE
          - entities.Opening.fields.room_type
          - entities.Territory.fields.royalty_rate_pct
        distinguishing_aspect: "Shape and domain are two different gates at two different priorities: an undeclared enum member or a malformed instant is ERR_INVALID_REQUEST (7), while a well-typed number outside its declared interval - or an interval whose end does not follow its start - is ERR_VALUE_OUT_OF_RANGE (8)."
        test_recipe:
          setup:
            - "One ACTIVE territory, one designer, one routed lead and one SCHEDULED consultation to hang the openings off."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Sunroom", room_type: "SUNROOM", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_enum: $.data.error_id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Hairline", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 0.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_zero_width: $.data.error_id }
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "Too precise", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.0001, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000, depth_in: 3.000 }
              as: Designer
              as_user_id: "${d1}"
              captures: { err_precision: $.data.error_id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-04T15:00:00.000Z", scheduled_end_at: "2026-08-04T15:00:00.000Z", service_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_empty_window: $.data.error_id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-04T15:00", scheduled_end_at: "2026-08-04T16:00:00.000Z", service_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { err_instant: $.data.error_id }
            - call: "POST /blinds/territories"
              payload: { legal_name: "Overreach Blinds LLC", postal_codes: ["30501"], royalty_rate_pct: 0.1501 }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { err_rate: $.data.error_id }
          assert:
            - "room_type 'SUNROOM' is not a declared member -> 422 with error_id == ERR_INVALID_REQUEST"
            - "a malformed instant without seconds or the Z designator -> 422 with error_id == ERR_INVALID_REQUEST"
            - "width_top_in 0.000 is below the declared floor 0.125 -> 422 with error_id == ERR_VALUE_OUT_OF_RANGE"
            - "width_top_in 24.0001 carries a fourth decimal place -> 422 with error_id == ERR_VALUE_OUT_OF_RANGE"
            - "scheduled_end_at equal to scheduled_start_at is a degenerate interval, not a shape problem -> 422 with error_id == ERR_VALUE_OUT_OF_RANGE"
            - "royalty_rate_pct 0.1501 exceeds the declared ceiling 0.15 -> 422 with error_id == ERR_VALUE_OUT_OF_RANGE, and the boundary value 0.1500 would be accepted"
            - "nothing was written by any probe: GET /blinds/openings?consultation_id=${c1} returns total_count 0 and GET /blinds/consultations?designer_id=${d1} returns total_count 1"

      - name: a_missing_required_field_is_refused_before_any_business_gate_runs
        claim_type: Required Fields
        grounds:
          - validations.priority_7_ERR_INVALID_REQUEST
          - endpoints.POST_blinds_openings
          - validations.priority_35_ERR_INSUFFICIENT_MOUNT_DEPTH
        distinguishing_aspect: "Priority 7 outranks every business rule, so an INSIDE opening that omits depth_in entirely reports ERR_INVALID_REQUEST - NOT the mount-depth error 35 that a present-but-shallow depth would raise. The same request with depth_in 3.000 succeeds, proving nothing else in the payload was at fault."
        test_recipe:
          setup:
            - "One ACTIVE territory, one designer, one routed lead and one SCHEDULED consultation."
          setup_api_calls:
            - call: "POST /blinds/territories"
              payload: { legal_name: "Northgate Blinds LLC", postal_codes: ["30301"] }
              as: Franchisor
              as_user_id: "hq-ops"
              captures: { t1: $.data.id }
            - call: "POST /blinds/designers"
              payload: { territory_id: "${t1}", full_name: "Dana Reed", home_postal_code: "30301" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { d1: $.data.id }
            - call: "POST /blinds/leads"
              payload: { customer_name: "Ana Ruiz", postal_code: "30301", source: "WEB_FORM", requested_at: "2026-08-01T08:00:00.000Z" }
              as: Franchisee
              as_user_id: "${t1}"
              captures: { l1: $.data.id }
            - call: "POST /blinds/consultations"
              payload: { lead_id: "${l1}", designer_id: "${d1}", scheduled_start_at: "2026-08-03T14:00:00.000Z", scheduled_end_at: "2026-08-03T15:00:00.000Z", service_postal_code: "30301" }
              as: Designer
              as_user_id: "${d1}"
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /blinds/openings"
              payload: { consultation_id: "${c1}", label: "No depth", room_type: "OFFICE", mount_type: "INSIDE", width_top_in: 24.000, width_middle_in: 24.000, width_bottom_in: 24.000, height_left_in: 48.000, height_center_in: 48.000, height_right_in: 48.000 }
              as: Designer
              as_user_id: "${d1}"
