# =============================================================================
# §1.9 Scaffold Corner Design — task_2424_high_pressure_processing_tolling_service
# Breadth probe over §1.1–§1.7. Anchors carry the shared world chain; instances
# already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as
# excluded_because: stubs.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: corner_create_customer_returns_201_with_zeroed_counters
        claim_type: Creation
        grounds:
          - endpoints[POST /customers]
          - entities.Customer.fields.trailing_leaker_ppm
          - entities.Customer.fields.chargeback_balance_cents
          - response_envelope.success
        distinguishing_aspect: "A brand-new customer is created with both derived counters at 0 and the success envelope carries meta.api_request_id plus response_type object."
        test_recipe:
          setup:
            - "empty database; logical clock at 2026-08-03T08:00:00Z"
          setup_api_calls:
            - &c_clock { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-03T08:00:00Z" }, as: FacilityAdmin }
          trigger:
            - &c_cust { call: "POST /customers", payload: { name: "Verde Foods", code: "VERDE", billing_email: "ap@verde.example" }, as: FacilityAdmin, captures: { cust_id: $.data.id } }
          assert:
            - "HTTP 201"
            - "Customer.${cust_id}.name == Verde Foods, code == VERDE, billing_email == ap@verde.example"
            - "Customer.${cust_id}.trailing_leaker_ppm == 0 and chargeback_balance_cents == 0"
            - "Customer.${cust_id}.version == 1 and id is a bare UUID with no prefix"
            - "response body has response_type == object and meta.api_request_id present"

      - name: corner_get_vessel_cycle_unknown_id_returns_cycle_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /vessel-cycles/{id}]
          - errors[ERR_CYCLE_NOT_FOUND]
          - validations.p4[GET /vessel-cycles/{id} -> ERR_CYCLE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown UUID on a read path returns the entity-specific 404, not a generic 400."
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; no VesselCycle rows exist"
          setup_api_calls:
            - *c_clock
          trigger:
            - { call: "GET /vessel-cycles/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: PlantScheduler, captures: { e404: $.data.error_id } }
          assert:
            - "HTTP 404 with data.error_id == ERR_CYCLE_NOT_FOUND"
            - "response body has response_type == error"

      - name: corner_create_lot_without_ship_by_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints[POST /lots]
          - entities.Lot.fields.ship_by
          - errors[ERR_INVALID_REQUEST]
          - validations.p3[all -> ERR_INVALID_REQUEST]
        distinguishing_aspect: "ship_by is a required input with no default, so omitting it fails at priority 3 before any cold-room or cold-chain rule is consulted."
        test_recipe:
          setup:
            - "customer VERDE, family RTE_GUAC, cold room CR-1 and a QUALIFIED qualification exist"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - &c_fam { call: "POST /product-families", payload: { family_code: "RTE_GUAC", cross_contamination_group: "RTE_PRODUCE", cleanout_minutes: 45, max_receipt_temp_c: 4.0, max_outbound_temp_c: 4.0, requires_dedicated_cycle: false }, as: FacilityAdmin, captures: { fam_id: $.data.id } }
            - &c_room { call: "POST /cold-rooms", payload: { room_code: "CR-1", capacity_pallets: 2, setpoint_c: 2.0, allowed_family_groups: ["RTE_PRODUCE"] }, as: FacilityAdmin, captures: { room_id: $.data.id } }
            - &c_qual { call: "POST /product-qualifications", payload: { customer_id: "${cust_id}", product_family_id: "${fam_id}", sku_code: "GUAC-500", version_label: "REV-A", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "POUCH", package_burst_pressure_mpa: 660.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}", captures: { qual_id: $.data.id } }
            - &c_submit { call: "POST /product-qualifications/${qual_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - &c_vrun { call: "POST /product-qualifications/${qual_id}/validation-runs", payload: { measured_pressure_mpa: 600.0, measured_hold_time_seconds: 180, achieved_log_reduction: 5.2, package_integrity_result: "PASS", units_tested: 50, leaker_count: 0 }, as: QualityManager, as_user_id: "qm_alice" }
            - *c_vrun
            - &c_qualify { call: "POST /product-qualifications/${qual_id}/decision", payload: { outcome: "QUALIFY" }, as: QualityManager, as_user_id: "qm_alice" }
          trigger:
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-900", unit_count: 100, gross_weight_kg: 70.0, carrier_temp_c: 2.5 }, as: PlantOperator, captures: { e400: $.data.error_id } }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no Lot row was created"

      - name: corner_product_family_defaults_requires_dedicated_cycle_false
        claim_type: Defaults
        grounds:
          - endpoints[POST /product-families]
          - entities.ProductFamily.fields.requires_dedicated_cycle
        distinguishing_aspect: "requires_dedicated_cycle is the only optional input on the family and defaults to false, so a family created without it lets several customers share a cycle."
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z"
          setup_api_calls:
            - *c_clock
          trigger:
            - { call: "POST /product-families", payload: { family_code: "RTE_JUICE", cross_contamination_group: "JUICE", cleanout_minutes: 30, max_receipt_temp_c: 4.0, max_outbound_temp_c: 4.0 }, as: FacilityAdmin, captures: { juice_fam_id: $.data.id } }
          assert:
            - "HTTP 201 and ProductFamily.${juice_fam_id}.requires_dedicated_cycle == false"
            - "ProductFamily.${juice_fam_id}.cleanout_minutes == 30 and cross_contamination_group == JUICE"

      - name: corner_lot_system_fields_ignore_client_supplied_states
        claim_type: System Fields
        grounds:
          - endpoints[POST /lots]
          - entities.Lot.fields.custody_state
          - entities.Lot.fields.units_untreated
          - entities.Lot.fields.segregation_group
        distinguishing_aspect: "custody_state, release_state, the unit ledger and segregation_group are all system/computed: values sent by the client are ignored and the server's own initialization wins."
        test_recipe:
          setup:
            - "customer VERDE, family RTE_GUAC, cold room CR-1 and QUALIFIED qualification GUAC-500 exist"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
          trigger:
            - &c_lot1 { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-001", unit_count: 1000, gross_weight_kg: 640.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { lot1_id: $.data.id } }
          assert:
            - "HTTP 201 and Lot.${lot1_id}.custody_state == AT_DOCK and release_state == NOT_RELEASED"
            - "Lot.${lot1_id}.units_untreated == 1000, units_in_vessel == 0, units_treated == 0, units_disposed == 0"
            - "Lot.${lot1_id}.segregation_group == RTE_PRODUCE (snapshotted from the family behind the qualification)"
            - "Lot.${lot1_id}.version == 1 and created_at == 2026-08-03T08:00:00Z"

      - name: corner_patch_vessel_to_in_use_is_invalid_request
        claim_type: Type Constraints
        grounds:
          - endpoints[PATCH /vessels/{id}]
          - entities.Vessel.fields.status
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "IN_USE is inside the Vessel.status enum but outside the PATCH endpoint's accepted domain {AVAILABLE, MAINTENANCE, DOWN}, so the request is rejected at priority 3 and the stored status is untouched."
        test_recipe:
          setup:
            - "vessel HPP-1 exists with status AVAILABLE"
          setup_api_calls:
            - *c_clock
            - &c_vessel { call: "POST /vessels", payload: { vessel_code: "HPP-1", chamber_volume_liters: 350, max_pressure_mpa: 600.0, pump_ramp_rate_mpa_per_sec: 6.0, decompression_seconds: 12, basket_count: 4, hourly_operating_cost_cents: 90000 }, as: FacilityAdmin, captures: { vessel_id: $.data.id } }
          trigger:
            - { call: "PATCH /vessels/${vessel_id}", payload: { status: "IN_USE" }, as: FacilityAdmin, captures: { e_enum: $.data.error_id } }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "Vessel.${vessel_id}.status == AVAILABLE and Vessel.${vessel_id}.version == 1"

      - name: corner_list_lots_pagination_and_filter_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /lots]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three pallets exist; limit 2 / offset 0 filtered by customer returns 2 rows with total_count 3 and has_more true, and limit 0 is rejected as an invalid request."
        test_recipe:
          setup:
            - "customer VERDE with three pallets PAL-001, PAL-002, PAL-003 in CR-1 (capacity 3), all AT_DOCK"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - { call: "POST /cold-rooms", payload: { room_code: "CR-3", capacity_pallets: 3, setpoint_c: 2.0, allowed_family_groups: ["RTE_PRODUCE"] }, as: FacilityAdmin, captures: { room3_id: $.data.id } }
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room3_id}", pallet_ref: "PAL-001", unit_count: 100, gross_weight_kg: 70.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { p1_id: $.data.id } }
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room3_id}", pallet_ref: "PAL-002", unit_count: 100, gross_weight_kg: 70.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { p2_id: $.data.id } }
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room3_id}", pallet_ref: "PAL-003", unit_count: 100, gross_weight_kg: 70.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { p3_id: $.data.id } }
          trigger:
            - { call: "GET /lots?customer_id=${cust_id}&limit=2&offset=0", as: PlantOperator, captures: { first_page_id: "$.data[0].id" } }
            - { call: "GET /lots?customer_id=${cust_id}&limit=0", as: PlantOperator, captures: { e_page: $.data.error_id } }
          assert:
            - "trigger step 1: HTTP 200, response_type == array, exactly 2 rows, total_count == 3, has_more == true"
            - "trigger step 1: rows are ordered created_at ASC so ${first_page_id} == ${p1_id}"
            - "trigger step 2: HTTP 400 with data.error_id == ERR_INVALID_REQUEST (limit below the minimum of 1)"

      - name: corner_cycle_log_is_write_once_immutable_record
        claim_type: Immutability
        grounds:
          - entities.CycleLog
          - errors[ERR_DUPLICATE_CYCLE_LOG]
          - validations.p8[POST /vessel-cycles/{id}/cycle-logs -> ERR_DUPLICATE_CYCLE_LOG]
          - endpoints[GET /vessel-cycles/{id}/cycle-logs]
        distinguishing_aspect: "CycleLog is declared common_fields: false — there is no update path and no version field, and a second CCP write on the same cycle is refused, so the audit record can never be edited."
        test_recipe:
          setup:
            - "the standard VERDE / RTE_GUAC / HPP-1 / CR-1 world with cycle C1 RUNNING and PAL-001 in the chamber"
            - "one clean CycleLog already written, so the cycle is COMPLETED_CLEAN"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - &c_contract { call: "POST /capacity-contracts", payload: { customer_id: "${cust_id}", season_code: "FY26", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", committed_slots: 5, slot_take_or_pay_cents: 60000, priority_rank: 1, peak_window_start: "2026-10-01T00:00:00Z", peak_window_end: "2026-11-30T23:59:59Z", peak_multiplier: 1.25 }, as: FacilityAdmin, captures: { contract_id: $.data.id } }
            - &c_activate { call: "POST /capacity-contracts/${contract_id}/activate", payload: {}, as: FacilityAdmin }
            - *c_lot1
            - &c_accept1 { call: "POST /lots/${lot1_id}/inspect", payload: { outcome: "ACCEPT", pulp_temp_c: 3.2 }, as: PlantOperator }
            - &c_cycle1 { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${fam_id}", scheduled_start: "2026-08-05T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { cyc1_id: $.data.id, cyc1_v0: $.data.version } }
            - &c_load1 { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 1000, expected_cycle_version: "${cyc1_v0}" }, as: PlantScheduler, captures: { load1_id: $.data.id } }
            - &c_start1 { call: "POST /vessel-cycles/${cyc1_id}/start", payload: {}, as: PlantOperator, as_user_id: "op_bob" }
            - &c_log_clean { call: "POST /vessel-cycles/${cyc1_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 195, come_up_seconds: 104, water_temp_c: 7.5 }, as: PlantOperator, as_user_id: "op_bob", captures: { log1_id: $.data.id } }
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 300, come_up_seconds: 104, water_temp_c: 7.5 }, as: PlantOperator, as_user_id: "op_bob", captures: { e_dup_log: $.data.error_id } }
          assert:
            - "HTTP 409 with data.error_id == ERR_DUPLICATE_CYCLE_LOG"
            - "GET /vessel-cycles/${cyc1_id}/cycle-logs returns exactly 1 row, whose actual_hold_seconds is still 195"
            - "CycleLog.${log1_id} exposes id and created_at only; no version field and no update endpoint exists for it"

      - name: corner_validation_run_under_unknown_qualification_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.ValidationRun.parent
          - endpoints[POST /product-qualifications/{id}/validation-runs]
          - errors[ERR_QUALIFICATION_NOT_FOUND]
        distinguishing_aspect: "ValidationRun is a child of ProductQualification and takes its qualification_id from the path, so an unknown parent id fails path existence at priority 4 before any body rule."
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T08:00:00Z; no ProductQualification rows exist"
          setup_api_calls:
            - *c_clock
          trigger:
            - { call: "POST /product-qualifications/11111111-2222-3333-4444-555555555555/validation-runs", payload: { measured_pressure_mpa: 600.0, measured_hold_time_seconds: 180, achieved_log_reduction: 5.2, package_integrity_result: "PASS", units_tested: 50, leaker_count: 0 }, as: QualityManager, as_user_id: "qm_alice", captures: { e_parent: $.data.error_id } }
          assert:
            - "HTTP 404 with data.error_id == ERR_QUALIFICATION_NOT_FOUND"
            - "no ValidationRun row was created"

      - name: corner_cycle_load_junction_is_readable_from_both_sides
        claim_type: Topology
        grounds:
          - entities.CycleLoad
          - endpoints[GET /cycle-loads]
          - complexity_profile.entity_topology
        distinguishing_aspect: "Lot x VesselCycle is many-to-many through CycleLoad, and the junction is reachable from either side: filtering by lot_id and filtering by cycle_id both return the same single row."
        test_recipe:
          setup:
            - "the standard world with cycle C1 LOADED carrying PAL-001 on the FY26 contract"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
          trigger:
            - { call: "GET /cycle-loads?lot_id=${lot1_id}", as: PlantScheduler, captures: { by_lot_id: "$.data[0].id" } }
            - { call: "GET /cycle-loads?cycle_id=${cyc1_id}", as: PlantScheduler, captures: { by_cycle_id: "$.data[0].id" } }
          assert:
            - "both calls return HTTP 200 with exactly 1 row and total_count == 1"
            - "${by_lot_id} == ${by_cycle_id} == ${load1_id}"
            - "CycleLoad.${load1_id}.lot_id == ${lot1_id} and CycleLoad.${load1_id}.cycle_id == ${cyc1_id} and contract_id == ${contract_id}"

  - section: state_machines
    instances:
      - name: corner_submit_a_qualified_qualification_is_refused
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ProductQualification
          - errors[ERR_INVALID_QUALIFICATION_STATE]
          - validations.p8[POST /product-qualifications/{id}/submit -> ERR_INVALID_QUALIFICATION_STATE]
        distinguishing_aspect: "QUALIFIED has no submit edge, so re-submitting an already-qualified record is refused and neither status nor revision_round moves."
        test_recipe:
          setup:
            - "qualification GUAC-500 REV-A is QUALIFIED after two acceptable validation runs"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
          trigger:
            - { call: "POST /product-qualifications/${qual_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { e_state: $.data.error_id } }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_QUALIFICATION_STATE"
            - "ProductQualification.${qual_id}.status == QUALIFIED and revision_round == 0"

      - name: corner_new_cycle_starts_in_scheduled_with_zero_baskets
        claim_type: Initial State
        grounds:
          - state_machines.VesselCycle.initial_state
          - entities.VesselCycle.fields.baskets_used_total
          - calculations.cycle_time_and_tolling_fee
        distinguishing_aspect: "A freshly scheduled cycle is SCHEDULED with baskets_used_total 0 and utilization 0.00, yet its estimated window is already fixed at 472 s from the vessel's ramp rate."
        test_recipe:
          setup:
            - "vessel HPP-1 (ramp 6.0 MPa/s, decompression 12 s) and family RTE_GUAC exist"
          setup_api_calls:
            - *c_clock
            - *c_fam
            - *c_vessel
          trigger:
            - *c_cycle1
          assert:
            - "HTTP 201 and VesselCycle.${cyc1_id}.state == SCHEDULED"
            - "VesselCycle.${cyc1_id}.baskets_used_total == 0 and utilization_pct == 0.00"
            - "VesselCycle.${cyc1_id}.estimated_cycle_seconds == 472 and scheduled_end == 2026-08-05T09:07:52Z"
            - "VesselCycle.${cyc1_id}.actual_cycle_seconds == null and actual_tolling_fee_cents == null and version == 1"

      - name: corner_terminate_a_dispositioned_cycle_is_refused
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.VesselCycle.terminal_states
          - errors[ERR_INVALID_CYCLE_STATE]
          - endpoints[POST /vessel-cycles/{id}/terminate]
        distinguishing_aspect: "DISPOSITIONED is terminal: terminate is refused and the frozen fee and load allocation are left exactly as the disposition wrote them."
        test_recipe:
          setup:
            - "the standard world with cycle C1 DISPOSITIONED on the clean branch at actual_tolling_fee_cents 12825"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_clean
            - &c_disp { call: "POST /vessel-cycles/${cyc1_id}/disposition", payload: {}, as: QualityManager, as_user_id: "qm_alice" }
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/terminate", payload: { reason: "late cancellation attempt" }, as: PlantScheduler, captures: { e_term: $.data.error_id } }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_CYCLE_STATE"
            - "VesselCycle.${cyc1_id}.state == DISPOSITIONED and actual_tolling_fee_cents == 12825"
            - "CycleLoad.${load1_id}.disposition_state == ALLOCATED and allocated_fee_cents == 12825"

      - name: corner_second_activate_on_an_active_contract_is_refused
        claim_type: Idempotency
        grounds:
          - state_machines.CapacityContract
          - errors[ERR_INVALID_CONTRACT_STATE]
          - endpoints[POST /capacity-contracts/{id}/activate]
        distinguishing_aspect: "Activation is not idempotent: the second call on an ACTIVE contract is refused and the version does not advance a second time."
        test_recipe:
          setup:
            - "contract FY26 for VERDE has been created and activated once"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_contract
            - *c_activate
          trigger:
            - { call: "POST /capacity-contracts/${contract_id}/activate", payload: {}, as: FacilityAdmin, captures: { e_act: $.data.error_id } }
          assert:
            - "HTTP 409 with data.error_id == ERR_INVALID_CONTRACT_STATE"
            - "CapacityContract.${contract_id}.status == ACTIVE and version == 2"
            - "CapacityContract.${contract_id}.available_slots == 5"

      - name: corner_deviation_branch_puts_every_loaded_lot_on_hold
        claim_type: Side Effect Execution
        grounds:
          - state_machines.VesselCycle.RUNNING_to_COMPLETED_DEVIATED
          - entities.Deviation.fields.status
          - entities.Lot.fields.release_state
          - entities.Vessel.fields.cycles_run_count
        distinguishing_aspect: "Every side effect of the DEVIATION branch fires in one request: the CycleLog is appended, the cycle turns COMPLETED_DEVIATED, units move in_vessel -> treated, the vessel is freed and counted, and the pallet is parked ON_HOLD_FOR_TEST behind a new OPEN Deviation."
        test_recipe:
          setup:
            - "the standard world with cycle C1 RUNNING and PAL-001 (1000 units) in the chamber, required hold 180 s"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
          trigger:
            - &c_log_dev { call: "POST /vessel-cycles/${cyc1_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 179, come_up_seconds: 104, water_temp_c: 7.5 }, as: PlantOperator, as_user_id: "op_bob", captures: { dev_log_id: $.data.id } }
          assert:
            - "HTTP 201 and CycleLog.${dev_log_id}.ccp_verdict == DEVIATION with deviation_flags == [SHORT_HOLD] and logged_by_user_id == op_bob"
            - "VesselCycle.${cyc1_id}.state == COMPLETED_DEVIATED and actual_cycle_seconds == 475"
            - "Vessel.${vessel_id}.status == AVAILABLE and cycles_run_count == 1"
            - "Lot.${lot1_id}.custody_state == TREATED, units_treated == 1000, units_in_vessel == 0"
            - "Lot.${lot1_id}.release_state == ON_HOLD_FOR_TEST"
            - "GET /deviations?cycle_id=${cyc1_id} returns exactly 1 row with deviation_type == SHORT_HOLD, severity == MAJOR, worst_shortfall_pct == 0.56, status == OPEN, cycle_load_id == null"

      - name: corner_reprocess_adjudication_returns_units_and_bills_the_customer
        claim_type: Compensation
        grounds:
          - state_machines.Deviation.OPEN_to_ADJUDICATED_REPROCESS
          - calculations.lot_unit_ledger
          - calculations.customer_chargeback_balance
          - entities.ChargebackLine.fields.basis
        distinguishing_aspect: "REPROCESS is a five-link compensation: the cycle is dispositioned and its 11400-cent fee allocated, the load becomes REPROCESSED (still a consumed slot), a REPROCESS chargeback line for half the fee is minted because the root cause is a PKG_ code, and the pallet's 1000 units return to the untreated pool with release_state reset to NOT_RELEASED."
        test_recipe:
          setup:
            - "the standard world with cycle C1 COMPLETED_DEVIATED after a 179 s hold, one OPEN MAJOR SHORT_HOLD deviation, PAL-001 TREATED and ON_HOLD_FOR_TEST"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_dev
            - &c_get_dev { call: "GET /deviations?cycle_id=${cyc1_id}", as: QualityManager, as_user_id: "qm_alice", captures: { dev_id: "$.data[0].id" } }
          trigger:
            - { call: "POST /deviations/${dev_id}/adjudicate", payload: { disposition: "REPROCESS", root_cause_code: "PKG_FILM_SPEC" }, as: QualityManager, as_user_id: "qm_alice" }
            - { call: "GET /chargeback-lines?customer_id=${cust_id}", as: FacilityAdmin, captures: { rep_line_id: "$.data[0].id" } }
          assert:
            - "Deviation.${dev_id}.status == ADJUDICATED_REPROCESS, chargeback_party == CUSTOMER, adjudicated_by_user_id == qm_alice"
            - "VesselCycle.${cyc1_id}.state == DISPOSITIONED and actual_tolling_fee_cents == 11400"
            - "CycleLoad.${load1_id}.disposition_state == REPROCESSED and allocated_fee_cents == 11400"
            - "ChargebackLine.${rep_line_id}.basis == REPROCESS, amount_cents == 5700, status == PENDING, deviation_id == ${dev_id}"
            - "Customer.${cust_id}.chargeback_balance_cents == 5700"
            - "Lot.${lot1_id}.units_untreated == 1000, units_treated == 0, custody_state == IN_COLD_STORAGE, release_state == NOT_RELEASED"
            - "CapacityContract.${contract_id}.consumed_slots == 1, reserved_slots == 0, available_slots == 4"

      - name: corner_inspect_reject_at_the_dock_disposes_the_whole_pallet
        claim_type: Cascade down
        grounds:
          - state_machines.Lot.AT_DOCK_to_REJECTED_AT_DOCK
          - calculations.lot_unit_ledger
          - entities.ColdRoom.fields.occupied_pallets
        distinguishing_aspect: "A refusal at the door moves all 1000 units untreated -> disposed and never charges the cold room, so occupied_pallets stays 0 and the room posture stays NORMAL."
        test_recipe:
          setup:
            - "pallet PAL-001 is AT_DOCK in CR-1 with units_untreated 1000 and ColdRoom.occupied_pallets 0"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_lot1
          trigger:
            - { call: "POST /lots/${lot1_id}/inspect", payload: { outcome: "REJECT", pulp_temp_c: 3.9 }, as: PlantOperator }
          assert:
            - "HTTP 200 and Lot.${lot1_id}.custody_state == REJECTED_AT_DOCK"
            - "Lot.${lot1_id}.units_disposed == 1000 and units_untreated == 0"
            - "Lot.${lot1_id}.units_untreated + units_in_vessel + units_treated + units_disposed == 1000"
            - "ColdRoom.${room_id}.occupied_pallets == 0 and capacity_state == NORMAL"

      - name: corner_supersede_mints_a_draft_and_retires_the_source
        claim_type: Valid Transition
        grounds:
          - state_machines.ProductQualification.QUALIFIED_to_SUPERSEDED
          - entities.ProductQualification.fields.supersedes_qualification_id
          - concurrency_rules[qualification-supersede-stale]
          - endpoints[POST /product-qualifications/{id}/supersede]
        distinguishing_aspect: "The self-referential edge works in one call: the response is the new DRAFT revision whose supersedes_qualification_id points back at the source, the source turns SUPERSEDED, and the new row inherits customer_id and product_family_id without them being sent."
        test_recipe:
          setup:
            - "qualification GUAC-500 REV-A is QUALIFIED (version 5 after submit, two runs and the decision)"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - { call: "GET /product-qualifications/${qual_id}", as: Customer, as_user_id: "${cust_id}", captures: { qual_v: $.data.version } }
          trigger:
            - { call: "POST /product-qualifications/${qual_id}/supersede", payload: { expected_qualification_version: "${qual_v}", sku_code: "GUAC-500", version_label: "REV-B", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "POUCH", package_burst_pressure_mpa: 660.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}", captures: { qual_b_id: $.data.id } }
          assert:
            - "HTTP 201 and ProductQualification.${qual_b_id}.status == DRAFT with revision_round == 0"
            - "ProductQualification.${qual_b_id}.supersedes_qualification_id == ${qual_id}"
            - "ProductQualification.${qual_b_id}.customer_id == ${cust_id} and product_family_id == ${fam_id} (inherited)"
            - "ProductQualification.${qual_b_id}.package_suitability_score == 100.00"
            - "ProductQualification.${qual_id}.status == SUPERSEDED"
            - "GET /product-qualifications?supersedes_qualification_id=${qual_id} returns exactly 1 row"

      - name: corner_accept_on_a_critical_deviation_is_refused
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Deviation.OPEN_to_ADJUDICATED_ACCEPT
          - errors[ERR_DEVIATION_ACCEPT_NOT_PERMITTED]
          - validations.p9[POST /deviations/{id}/adjudicate -> ERR_DEVIATION_ACCEPT_NOT_PERMITTED]
        distinguishing_aspect: "A 170 s hold against a required 180 s is a 5.56% shortfall, at or over the 5.00% CRITICAL line, and a CRITICAL deviation may never be accepted — only reprocessed or rejected."
        test_recipe:
          setup:
            - "the standard world with cycle C1 COMPLETED_DEVIATED after a 170 s hold, so its Deviation is CRITICAL and OPEN"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - { call: "POST /vessel-cycles/${cyc1_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 170, come_up_seconds: 104, water_temp_c: 7.5 }, as: PlantOperator, as_user_id: "op_bob" }
            - *c_get_dev
          trigger:
            - { call: "POST /deviations/${dev_id}/adjudicate", payload: { disposition: "ACCEPT", root_cause_code: "EQUIP_PUMP_FAULT" }, as: QualityManager, as_user_id: "qm_alice", captures: { e_accept: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_DEVIATION_ACCEPT_NOT_PERMITTED"
            - "Deviation.${dev_id}.severity == CRITICAL, worst_shortfall_pct == 5.56, status is still OPEN"
            - "VesselCycle.${cyc1_id}.state is still COMPLETED_DEVIATED"

      - name: corner_ship_syncs_cold_room_occupancy_ledger
        claim_type: Ledger sync
        grounds:
          - state_machines.Lot.TREATED_to_SHIPPED
          - entities.ColdRoom.fields.occupied_pallets
        excluded_because:
          difficulty_instance: non_linear_state_machine / lot_custody_and_release_dimensions_advance_independently
          rationale: "That instance's final asserts pin ColdRoom.occupied_pallets 0 and capacity_state NORMAL immediately after the ship call."

      - name: corner_contract_cycles_back_from_exhausted_to_active
        claim_type: cyclic
        grounds:
          - state_machines.CapacityContract.EXHAUSTED_to_ACTIVE
          - calculations.contract_slot_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / cancel_returns_the_contract_slot_to_available
          rationale: "The EXHAUSTED -> ACTIVE loop and the slot ledger identity are the asserted outcome of that instance."

      - name: corner_lot_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.Lot.custody_state
          - state_machines.Lot.release_state
        excluded_because:
          difficulty_instance: non_linear_state_machine / lot_custody_and_release_dimensions_advance_independently
          rationale: "Independence of the custody and release dimensions is that instance's entire subject."

      - name: corner_cold_room_posture_rederived_from_children
        claim_type: Bubble up
        grounds:
          - entities.ColdRoom.fields.capacity_state
          - state_machines.ColdRoom.AT_CAPACITY_to_NORMAL
        excluded_because:
          difficulty_instance: transitive_cascade / deviation_reject_cascades_to_cold_room_posture
          rationale: "Links L5 and L6 of that cascade assert occupied_pallets 0 and the derived AT_CAPACITY -> NORMAL flip."

  - section: calculations
    instances:
      - name: corner_suitability_score_rounds_only_the_summed_total
        claim_type: Precision
        grounds:
          - calculations.qualification_package_suitability_score
          - entities.ProductQualification.fields.package_suitability_score
        distinguishing_aspect: "Burst margin 11.125, film margin 16.125 and format 17.00 sum to 44.25 with a single rounding step; rounding each component first gives 44.26, so the pinned order is observable to the cent."
        test_recipe:
          setup:
            - "customer VERDE and family RTE_GUAC exist"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
          trigger:
            - &c_qual_low { call: "POST /product-qualifications", payload: { customer_id: "${cust_id}", product_family_id: "${fam_id}", sku_code: "SOUP-200", version_label: "REV-A", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "TRAY_SEALED", package_burst_pressure_mpa: 611.125, film_thickness_micron: 43, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}", captures: { qual_low_id: $.data.id } }
          assert:
            - "HTTP 201 and ProductQualification.${qual_low_id}.package_suitability_score == 44.25"
            - "ProductQualification.${qual_low_id}.package_suitability_score != 44.26 (the per-component rounding answer)"
            - "ProductQualification.${qual_low_id}.status == DRAFT"

      - name: corner_utilization_exactly_sixty_pct_takes_the_softer_surcharge_tier
        claim_type: tiered_pricing
        grounds:
          - calculations.cycle_time_and_tolling_fee
          - entities.VesselCycle.fields.utilization_pct
          - entities.VesselCycle.fields.estimated_tolling_fee_cents
        distinguishing_aspect: "Three of five baskets is exactly 60.00%, and the tier test is strict (<60), so the 8% tier applies rather than the 20% tier: base 10000 + 800 = 10800 gross, 3% credit 324, net 10476 — the 20% reading would produce 11640."
        test_recipe:
          setup:
            - "vessel HPP-3 with 5 baskets (ramp 6.0 MPa/s, decompression 12 s); family RTE_GUAC; QUALIFIED GUAC-500; contract FY26 ACTIVE"
            - "pallet PAL-001 (1000 units) accepted into CR-1; cycle C4 SCHEDULED on HPP-3 at 600 MPa / 180 s"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - { call: "POST /vessels", payload: { vessel_code: "HPP-3", chamber_volume_liters: 440, max_pressure_mpa: 600.0, pump_ramp_rate_mpa_per_sec: 6.0, decompression_seconds: 12, basket_count: 5, hourly_operating_cost_cents: 100000 }, as: FacilityAdmin, captures: { v3_id: $.data.id } }
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${v3_id}", product_family_id: "${fam_id}", scheduled_start: "2026-08-05T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { cyc4_id: $.data.id, cyc4_v0: $.data.version } }
          trigger:
            - { call: "POST /vessel-cycles/${cyc4_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "${contract_id}", baskets_used: 3, units_loaded: 1000, expected_cycle_version: "${cyc4_v0}" }, as: PlantScheduler, captures: { load4_id: $.data.id } }
          assert:
            - "HTTP 201 and VesselCycle.${cyc4_id}.baskets_used_total == 3"
            - "VesselCycle.${cyc4_id}.utilization_pct == 60.00"
            - "VesselCycle.${cyc4_id}.estimated_cycle_seconds == 472 and estimated_tolling_fee_cents == 10476"
            - "VesselCycle.${cyc4_id}.estimated_tolling_fee_cents != 11640 (the answer if 60.00 fell into the 20% tier)"

      - name: corner_peak_multiplier_applied_after_the_remainder_pass
        claim_type: waterfall_allocation
        grounds:
          - calculations.cycle_fee_allocation_across_loads
          - entities.CapacityContract.fields.peak_multiplier
          - entities.CycleLoad.fields.allocated_fee_cents
        distinguishing_aspect: "A cycle scheduled inside the contract's Oct 1 - Nov 30 peak window has its single load's base allocation of 12825 lifted by 1.25 to 16031 (16031.25 rounded half-up), so the sum of allocated fees deliberately exceeds actual_tolling_fee_cents by the uplift."
        test_recipe:
          setup:
            - "the standard world; contract FY26 ACTIVE with peak window 2026-10-01 to 2026-11-30 and peak_multiplier 1.25"
            - "cycle C5 on HPP-1 scheduled 2026-10-15T09:00:00Z with PAL-001 (2 of 4 baskets), started and logged with come-up 104 s and hold 195 s at clock 2026-10-15T09:00:00Z"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${fam_id}", scheduled_start: "2026-10-15T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { cyc5_id: $.data.id, cyc5_v0: $.data.version } }
            - { call: "POST /vessel-cycles/${cyc5_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 1000, expected_cycle_version: "${cyc5_v0}" }, as: PlantScheduler, captures: { load5_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-10-15T09:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /vessel-cycles/${cyc5_id}/start", payload: {}, as: PlantOperator, as_user_id: "op_bob" }
            - { call: "POST /vessel-cycles/${cyc5_id}/cycle-logs", payload: { actual_pressure_mpa: 600.0, actual_hold_seconds: 195, come_up_seconds: 104, water_temp_c: 7.5 }, as: PlantOperator, as_user_id: "op_bob" }
          trigger:
            - { call: "POST /vessel-cycles/${cyc5_id}/disposition", payload: {}, as: QualityManager, as_user_id: "qm_alice" }
          assert:
            - "VesselCycle.${cyc5_id}.actual_cycle_seconds == 491 and actual_tolling_fee_cents == 12825"
            - "CycleLoad.${load5_id}.allocated_fee_cents == 16031 (12825 * 1.25 rounded half-up from 16031.25)"
            - "CycleLoad.${load5_id}.disposition_state == ALLOCATED"
            - "CapacityContract.${contract_id}.consumed_slots == 1 and available_slots == 4"

      - name: corner_take_or_pay_is_zero_when_consumption_equals_min_take
        claim_type: threshold
        grounds:
          - calculations.contract_take_or_pay_shortfall
          - entities.CapacityContract.fields.shortfall_slots
          - errors[ERR_INVALID_CONTRACT_STATE]
        distinguishing_aspect: "committed 1 slot gives min_take ceil(0.80) == 1, and exactly one consumed slot lands on the threshold, so shortfall_slots is 0 and no ChargebackLine is minted at all."
        test_recipe:
          setup:
            - "spot contract FY26-SPOT with committed_slots 1, ACTIVE"
            - "cycle C1 dispositioned clean with PAL-001 booked against FY26-SPOT, so consumed_slots == 1"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - &c_contract_spot { call: "POST /capacity-contracts", payload: { customer_id: "${cust_id}", season_code: "FY26-SPOT", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T23:59:59Z", committed_slots: 1, slot_take_or_pay_cents: 60000, priority_rank: 2, peak_window_start: "2026-10-01T00:00:00Z", peak_window_end: "2026-11-30T23:59:59Z", peak_multiplier: 1.25 }, as: FacilityAdmin, captures: { spot_id: $.data.id } }
            - &c_activate_spot { call: "POST /capacity-contracts/${spot_id}/activate", payload: {}, as: FacilityAdmin }
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "${spot_id}", baskets_used: 2, units_loaded: 1000, expected_cycle_version: "${cyc1_v0}" }, as: PlantScheduler, captures: { spot_load_id: $.data.id } }
            - *c_start1
            - *c_log_clean
            - *c_disp
          trigger:
            - { call: "POST /capacity-contracts/${spot_id}/close", payload: {}, as: FacilityAdmin }
          assert:
            - "HTTP 200 and CapacityContract.${spot_id}.status == CLOSED"
            - "CapacityContract.${spot_id}.consumed_slots == 1, shortfall_slots == 0, take_or_pay_cents == 0"
            - "GET /chargeback-lines?customer_id=${cust_id} returns 0 rows"
            - "Customer.${cust_id}.chargeback_balance_cents == 0"

      - name: corner_take_or_pay_bills_the_full_slot_when_nothing_was_consumed
        claim_type: Correct Result
        grounds:
          - calculations.contract_take_or_pay_shortfall
          - entities.ChargebackLine.fields.basis
          - calculations.customer_chargeback_balance
        distinguishing_aspect: "The same contract shape with consumed_slots 0 yields shortfall_slots 1 and a TAKE_OR_PAY_SHORTFALL line of exactly slot_take_or_pay_cents, with contract_id set and cycle_load_id null."
        test_recipe:
          setup:
            - "spot contract FY26-SPOT with committed_slots 1 and slot_take_or_pay_cents 60000, ACTIVE, never booked"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_contract_spot
            - *c_activate_spot
          trigger:
            - { call: "POST /capacity-contracts/${spot_id}/close", payload: {}, as: FacilityAdmin }
            - { call: "GET /chargeback-lines?customer_id=${cust_id}", as: FacilityAdmin, captures: { top_line_id: "$.data[0].id" } }
          assert:
            - "CapacityContract.${spot_id}.status == CLOSED, shortfall_slots == 1, take_or_pay_cents == 60000"
            - "ChargebackLine.${top_line_id}.basis == TAKE_OR_PAY_SHORTFALL, amount_cents == 60000, status == PENDING"
            - "ChargebackLine.${top_line_id}.contract_id == ${spot_id} and cycle_load_id == null"
            - "Customer.${cust_id}.chargeback_balance_cents == 60000"

      - name: corner_trailing_window_includes_the_ninetieth_day_and_drops_the_ninety_first
        claim_type: Input Set Filtering
        grounds:
          - calculations.customer_package_failure_risk
          - entities.Customer.fields.trailing_leaker_ppm
          - endpoints[POST /operations/day-close]
        distinguishing_aspect: "Both ends of the 90-day window are inclusive: a cycle dispositioned 2026-08-03T08:00:00Z still counts at the 2026-11-01T08:00:00Z day-close (exactly 90 days) and drops out one day later, taking the trailing rate from 3000 to 0."
        test_recipe:
          setup:
            - "the standard world with cycle C1 DISPOSITIONED at 2026-08-03T08:00:00Z and load L1 inspected at 3 leakers in 1000 units"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_clean
            - *c_disp
            - &c_inspect1 { call: "POST /cycle-loads/${load1_id}/inspection", payload: { units_inspected: 1000, leaker_units: 3 }, as: QualityManager, as_user_id: "qm_alice" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-11-01T08:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /operations/day-close", payload: {}, as: FacilityAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-11-02T08:00:00Z" }, as: FacilityAdmin }
            - { call: "POST /operations/day-close", payload: {}, as: FacilityAdmin }
          assert:
            - "after trigger step 2: Customer.${cust_id}.trailing_leaker_ppm == 3000 (the 90th day is inside the window)"
            - "after trigger step 2: the day-close response reports expired_qualification_count == 0 and customers_rescored == 1"
            - "after trigger step 4: Customer.${cust_id}.trailing_leaker_ppm == 0"
            - "CycleLoad.${load1_id}.leaker_ppm == 3000 at both day-closes"

      - name: corner_marginal_package_integrity_makes_a_run_unacceptable
        claim_type: Correct Result
        grounds:
          - entities.ValidationRun.fields.run_verdict
          - entities.ProductQualification.fields.validation_run_acceptable_count
          - endpoints[POST /product-qualifications/{id}/validation-runs]
        distinguishing_aspect: "run_verdict demands package_integrity_result == PASS: a MARGINAL run that meets pressure, hold and log reduction is still UNACCEPTABLE and does not raise validation_run_acceptable_count."
        test_recipe:
          setup:
            - "qualification GUAC-500 REV-A is SUBMITTED with no validation runs"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_qual
            - *c_submit
          trigger:
            - { call: "POST /product-qualifications/${qual_id}/validation-runs", payload: { measured_pressure_mpa: 620.0, measured_hold_time_seconds: 200, achieved_log_reduction: 6.0, package_integrity_result: "MARGINAL", units_tested: 50, leaker_count: 1 }, as: QualityManager, as_user_id: "qm_alice", captures: { marg_run_id: $.data.id } }
          assert:
            - "HTTP 201 and ValidationRun.${marg_run_id}.run_verdict == UNACCEPTABLE"
            - "ValidationRun.${marg_run_id}.recorded_by_user_id == qm_alice"
            - "ProductQualification.${qual_id}.validation_run_acceptable_count == 0"
            - "ProductQualification.${qual_id}.status == UNDER_VALIDATION (the first run still moves the qualification)"

      - name: corner_estimated_and_actual_fee_diverge
        claim_type: Variant Divergence
        grounds:
          - calculations.cycle_time_and_tolling_fee
        excluded_because:
          difficulty_instance: dual_variant_calc / tolling_fee_estimated_vs_actual_same_cycle
          rationale: "That instance asserts 472 s / 11400 estimated against 491 s / 12825 actual on one cycle."

      - name: corner_loyalty_tier_keyed_on_gross_not_base
        claim_type: Constants Applied
        grounds:
          - calculations.cycle_time_and_tolling_fee
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_surcharge_lifts_loyalty_tier_pinned_order
          rationale: "The pinned surcharge-before-credit order and the gross-keyed tier are that instance's asserted 11400-versus-11640 contrast."

      - name: corner_vessel_intervals_merge_on_touching_endpoints
        claim_type: interval_merge
        grounds:
          - calculations.vessel_schedule_window_and_cleanout_gap
        excluded_because:
          difficulty_instance: resource_temporal_overlap / vessel_half_open_windows_and_cleanout_buffer
          rationale: "Touching endpoints, one-second overlap and the cleanout equality boundary are all asserted there."

      - name: corner_slot_ledger_aggregation_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.contract_slot_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / cancel_returns_the_contract_slot_to_available
          rationale: "The reserved/consumed/available identity after a reversal is that instance's conserved quantity."

      - name: corner_leaker_ppm_at_the_chargeback_threshold
        claim_type: threshold
        grounds:
          - calculations.customer_package_failure_risk
        excluded_because:
          difficulty_instance: boundary_precision_check / leaker_ppm_exactly_at_chargeback_threshold
          rationale: "3000 ppm exactly and 2500 ppm just below are asserted there, including the 3103-cent line."

  - section: validations
    instances:
      - name: corner_glass_package_blocks_qualification_even_above_the_score_line
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /product-qualifications/{id}/decision -> ERR_PACKAGE_FORMAT_NOT_PERMITTED]
          - errors[ERR_PACKAGE_FORMAT_NOT_PERMITTED]
          - calculations.qualification_package_suitability_score
        distinguishing_aspect: "Glass scores 0.50*100 + 0.30*100 + 0.20*0 == 80.00, comfortably over the 70.00 line, so the categorical GLASS ban is the only thing that can refuse it."
        test_recipe:
          setup:
            - "customer VERDE and family RTE_GUAC exist"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - { call: "POST /product-qualifications", payload: { customer_id: "${cust_id}", product_family_id: "${fam_id}", sku_code: "JUICE-1L", version_label: "REV-A", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "GLASS", package_burst_pressure_mpa: 660.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}", captures: { glass_id: $.data.id } }
            - { call: "POST /product-qualifications/${glass_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - &c_vrun_glass { call: "POST /product-qualifications/${glass_id}/validation-runs", payload: { measured_pressure_mpa: 600.0, measured_hold_time_seconds: 180, achieved_log_reduction: 5.2, package_integrity_result: "PASS", units_tested: 50, leaker_count: 0 }, as: QualityManager, as_user_id: "qm_alice" }
            - *c_vrun_glass
          trigger:
            - { call: "POST /product-qualifications/${glass_id}/decision", payload: { outcome: "QUALIFY" }, as: QualityManager, as_user_id: "qm_alice", captures: { e_glass: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_PACKAGE_FORMAT_NOT_PERMITTED"
            - "ProductQualification.${glass_id}.package_suitability_score == 80.00 and validation_run_acceptable_count == 2"
            - "ProductQualification.${glass_id}.status is still UNDER_VALIDATION and qualified_at == null"

      - name: corner_zero_burst_margin_reports_the_burst_rule_not_the_score_rule
        claim_type: Priority Ordering
        grounds:
          - validations.p9[POST /product-qualifications/{id}/decision -> ERR_BURST_PRESSURE_INSUFFICIENT]
          - validations.p9[POST /product-qualifications/{id}/decision -> ERR_PACKAGE_NOT_SUITABLE]
          - calculations.qualification_package_suitability_score
        distinguishing_aspect: "burst == pressure violates two same-priority rows at once (margin 0 also caps the score at 50.00); the burst row is listed first, so the specific defect is reported and ERR_PACKAGE_NOT_SUITABLE is suppressed."
        test_recipe:
          setup:
            - "customer VERDE and family RTE_GUAC exist"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - { call: "POST /product-qualifications", payload: { customer_id: "${cust_id}", product_family_id: "${fam_id}", sku_code: "DIP-250", version_label: "REV-A", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "POUCH", package_burst_pressure_mpa: 600.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}", captures: { burst_id: $.data.id } }
            - { call: "POST /product-qualifications/${burst_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - &c_vrun_burst { call: "POST /product-qualifications/${burst_id}/validation-runs", payload: { measured_pressure_mpa: 600.0, measured_hold_time_seconds: 180, achieved_log_reduction: 5.2, package_integrity_result: "PASS", units_tested: 50, leaker_count: 0 }, as: QualityManager, as_user_id: "qm_alice" }
            - *c_vrun_burst
          trigger:
            - { call: "POST /product-qualifications/${burst_id}/decision", payload: { outcome: "QUALIFY" }, as: QualityManager, as_user_id: "qm_alice", captures: { e_burst: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_BURST_PRESSURE_INSUFFICIENT"
            - "data.error_id != ERR_PACKAGE_NOT_SUITABLE even though package_suitability_score == 50.00"
            - "ProductQualification.${burst_id}.status is still UNDER_VALIDATION"

      - name: corner_score_below_seventy_blocks_qualification
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /product-qualifications/{id}/decision -> ERR_PACKAGE_NOT_SUITABLE]
          - errors[ERR_PACKAGE_NOT_SUITABLE]
        distinguishing_aspect: "The SOUP-200 tray scores 44.25 with a legal 11.125 MPa burst margin and a permitted format, so nothing but the composite threshold refuses it."
        test_recipe:
          setup:
            - "customer VERDE and family RTE_GUAC exist; qualification SOUP-200 REV-A is UNDER_VALIDATION with two acceptable runs"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_qual_low
            - { call: "POST /product-qualifications/${qual_low_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - &c_vrun_low { call: "POST /product-qualifications/${qual_low_id}/validation-runs", payload: { measured_pressure_mpa: 600.0, measured_hold_time_seconds: 180, achieved_log_reduction: 5.2, package_integrity_result: "PASS", units_tested: 50, leaker_count: 0 }, as: QualityManager, as_user_id: "qm_alice" }
            - *c_vrun_low
          trigger:
            - { call: "POST /product-qualifications/${qual_low_id}/decision", payload: { outcome: "QUALIFY" }, as: QualityManager, as_user_id: "qm_alice", captures: { e_score: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_PACKAGE_NOT_SUITABLE"
            - "ProductQualification.${qual_low_id}.package_suitability_score == 44.25 and status is still UNDER_VALIDATION"

      - name: corner_one_acceptable_run_is_not_enough_to_qualify
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /product-qualifications/{id}/decision -> ERR_INSUFFICIENT_VALIDATION_RUNS]
          - errors[ERR_INSUFFICIENT_VALIDATION_RUNS]
          - entities.ProductQualification.fields.validation_run_acceptable_count
        distinguishing_aspect: "One PASS run leaves validation_run_acceptable_count at 1 against a minimum of 2, and this row outranks every package rule, so it is reported for a package that would otherwise qualify at 100.00."
        test_recipe:
          setup:
            - "qualification GUAC-500 REV-A is UNDER_VALIDATION with exactly one acceptable run"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_qual
            - *c_submit
            - *c_vrun
          trigger:
            - { call: "POST /product-qualifications/${qual_id}/decision", payload: { outcome: "QUALIFY" }, as: QualityManager, as_user_id: "qm_alice", captures: { e_runs: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_INSUFFICIENT_VALIDATION_RUNS"
            - "ProductQualification.${qual_id}.validation_run_acceptable_count == 1 and package_suitability_score == 100.00"
            - "ProductQualification.${qual_id}.status is still UNDER_VALIDATION"

      - name: corner_fifth_submission_after_four_change_requests_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /product-qualifications/{id}/submit -> ERR_REVISION_LIMIT_REACHED]
          - state_machines.ProductQualification.CHANGES_REQUESTED_to_SUBMITTED
          - entities.ProductQualification.fields.revision_round
        distinguishing_aspect: "revision_round rises only on REQUEST_CHANGES; the fourth round is still resubmittable because the check is <= 3 on the pre-existing value, and only the fifth attempt (revision_round 4) is refused."
        test_recipe:
          setup:
            - "qualification GUAC-500 REV-A has been round-tripped through the revision loop four times"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_qual
            - *c_submit
            - *c_vrun
            - &c_rc { call: "POST /product-qualifications/${qual_id}/decision", payload: { outcome: "REQUEST_CHANGES" }, as: QualityManager, as_user_id: "qm_alice" }
            - *c_submit
            - *c_vrun
            - *c_rc
            - *c_submit
            - *c_vrun
            - *c_rc
            - *c_submit
            - *c_vrun
            - *c_rc
          trigger:
            - { call: "POST /product-qualifications/${qual_id}/submit", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { e_rev: $.data.error_id } }
          assert:
            - "the third resubmit (revision_round == 3) succeeded, proving the bound is inclusive"
            - "HTTP 422 with data.error_id == ERR_REVISION_LIMIT_REACHED"
            - "ProductQualification.${qual_id}.revision_round == 4 and status is still CHANGES_REQUESTED"

      - name: corner_loading_a_superseded_qualification_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /vessel-cycles/{id}/loads -> ERR_QUALIFICATION_NOT_QUALIFIED]
          - errors[ERR_QUALIFICATION_NOT_QUALIFIED]
          - state_machines.ProductQualification.QUALIFIED_to_SUPERSEDED
        distinguishing_aspect: "The pallet was received while its qualification was QUALIFIED; superseding the record retroactively closes the loading door, and the refusal names the qualification rather than the lot."
        test_recipe:
          setup:
            - "the standard world with PAL-001 accepted into CR-1 and cycle C1 SCHEDULED"
            - "qualification GUAC-500 REV-A is then superseded by REV-B, leaving REV-A SUPERSEDED"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - { call: "GET /product-qualifications/${qual_id}", as: Customer, as_user_id: "${cust_id}", captures: { qv: $.data.version } }
            - { call: "POST /product-qualifications/${qual_id}/supersede", payload: { expected_qualification_version: "${qv}", sku_code: "GUAC-500", version_label: "REV-B", pressure_mpa: 600.0, hold_time_seconds: 180, max_water_temp_c: 8.0, package_format: "POUCH", package_burst_pressure_mpa: 660.0, film_thickness_micron: 90, target_log_reduction: 5.0 }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /vessel-cycles/${cyc1_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 1000, expected_cycle_version: "${cyc1_v0}" }, as: PlantScheduler, captures: { e_notq: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_QUALIFICATION_NOT_QUALIFIED"
            - "no CycleLoad row exists and VesselCycle.${cyc1_id}.state is still SCHEDULED"
            - "CapacityContract.${contract_id}.reserved_slots == 0 and available_slots == 5"

      - name: corner_loading_a_foreign_family_lot_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /vessel-cycles/{id}/loads -> ERR_FAMILY_MISMATCH]
          - errors[ERR_FAMILY_MISMATCH]
          - complexity_profile.primary_archetype
        distinguishing_aspect: "One vessel cycle runs a single product family; an RTE_GUAC pallet offered to an RTE_JUICE cycle is refused outright rather than merely re-scheduled, which is the anti-cross-contamination invariant."
        test_recipe:
          setup:
            - "the standard world with PAL-001 (RTE_GUAC) accepted; a second family RTE_JUICE exists"
            - "cycle CJ is scheduled on HPP-1 for RTE_JUICE at 2026-08-07T09:00:00Z, the only cycle on the vessel"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - &c_fam_juice { call: "POST /product-families", payload: { family_code: "RTE_JUICE", cross_contamination_group: "JUICE", cleanout_minutes: 30, max_receipt_temp_c: 4.0, max_outbound_temp_c: 4.0, requires_dedicated_cycle: false }, as: FacilityAdmin, captures: { juice_id: $.data.id } }
            - { call: "POST /vessel-cycles", payload: { vessel_id: "${vessel_id}", product_family_id: "${juice_id}", scheduled_start: "2026-08-07T09:00:00Z", target_pressure_mpa: 600.0, target_hold_seconds: 180 }, as: PlantScheduler, captures: { cycj_id: $.data.id, cycj_v0: $.data.version } }
          trigger:
            - { call: "POST /vessel-cycles/${cycj_id}/loads", payload: { lot_id: "${lot1_id}", contract_id: "${contract_id}", baskets_used: 2, units_loaded: 1000, expected_cycle_version: "${cycj_v0}" }, as: PlantScheduler, captures: { e_fam: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_FAMILY_MISMATCH"
            - "VesselCycle.${cycj_id}.state is still SCHEDULED with baskets_used_total 0"
            - "Lot.${lot1_id}.units_untreated == 1000 (no unit movement)"

      - name: corner_receipt_above_the_family_receipt_temp_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /lots -> ERR_COLD_CHAIN_BREACH]
          - errors[ERR_COLD_CHAIN_BREACH]
          - entities.ProductFamily.fields.max_receipt_temp_c
        distinguishing_aspect: "The inbound gate reads the family through the qualification, not off the lot, and a 5.2 C carrier reading against a 4.0 C limit is refused before the pallet ever occupies the room."
        test_recipe:
          setup:
            - "customer VERDE, family RTE_GUAC (max_receipt_temp_c 4.0), CR-1 and QUALIFIED GUAC-500 exist"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
          trigger:
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-WARM", unit_count: 100, gross_weight_kg: 70.0, carrier_temp_c: 5.2, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { e_cold: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_COLD_CHAIN_BREACH"
            - "no Lot row was created and ColdRoom.${room_id}.occupied_pallets == 0"

      - name: corner_receipt_exactly_at_the_receipt_temp_limit_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - validations.p9[POST /lots -> ERR_COLD_CHAIN_BREACH]
          - entities.ProductFamily.fields.max_receipt_temp_c
        distinguishing_aspect: "The cold-chain comparison is <=, so a carrier reading exactly equal to the 4.0 C limit passes and the pallet is created normally — the one-sided twin of the 5.2 C refusal."
        test_recipe:
          setup:
            - "customer VERDE, family RTE_GUAC (max_receipt_temp_c 4.0), CR-1 and QUALIFIED GUAC-500 exist"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
          trigger:
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room_id}", pallet_ref: "PAL-EDGE", unit_count: 100, gross_weight_kg: 70.0, carrier_temp_c: 4.0, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { edge_lot_id: $.data.id } }
          assert:
            - "HTTP 201 and Lot.${edge_lot_id}.custody_state == AT_DOCK"
            - "Lot.${edge_lot_id}.carrier_temp_c == 4.0 and units_untreated == 100"
            - "no error is returned; ColdRoom.${room_id}.occupied_pallets is still 0 until inspection"

      - name: corner_receipt_into_a_zone_that_disallows_the_group_is_refused
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /lots -> ERR_SEGREGATION_ZONE_VIOLATION]
          - errors[ERR_SEGREGATION_ZONE_VIOLATION]
          - entities.ColdRoom.fields.allowed_family_groups
        distinguishing_aspect: "CR-2 admits only JUICE, so an RTE_PRODUCE pallet is refused on segregation grounds even though its temperature is in spec and the room is empty."
        test_recipe:
          setup:
            - "cold room CR-2 allows only the JUICE group and is empty; QUALIFIED GUAC-500 is in the RTE_PRODUCE group"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - { call: "POST /cold-rooms", payload: { room_code: "CR-2", capacity_pallets: 4, setpoint_c: 2.0, allowed_family_groups: ["JUICE"] }, as: FacilityAdmin, captures: { room2_id: $.data.id } }
          trigger:
            - { call: "POST /lots", payload: { customer_id: "${cust_id}", qualification_id: "${qual_id}", cold_room_id: "${room2_id}", pallet_ref: "PAL-ZONE", unit_count: 100, gross_weight_kg: 70.0, carrier_temp_c: 2.5, ship_by: "2026-08-20T00:00:00Z" }, as: PlantOperator, captures: { e_zone: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_SEGREGATION_ZONE_VIOLATION"
            - "no Lot row was created and ColdRoom.${room2_id}.occupied_pallets == 0"

      - name: corner_outbound_temp_breach_blocks_a_released_pallet
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /lots/{id}/ship -> ERR_OUTBOUND_TEMP_BREACH]
          - errors[ERR_OUTBOUND_TEMP_BREACH]
          - state_machines.Lot.TREATED_to_SHIPPED
        distinguishing_aspect: "Quality release is not a shipping licence: a fully RELEASED pallet on a 4.5 C truck is still refused, the room occupancy is not decremented, and the pallet stays TREATED."
        test_recipe:
          setup:
            - "the standard world; C1 dispositioned clean and PAL-001 RELEASED by qm_alice"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_fam
            - *c_vessel
            - *c_room
            - *c_qual
            - *c_submit
            - *c_vrun
            - *c_vrun
            - *c_qualify
            - *c_contract
            - *c_activate
            - *c_lot1
            - *c_accept1
            - *c_cycle1
            - *c_load1
            - *c_start1
            - *c_log_clean
            - *c_disp
            - &c_get_lot1 { call: "GET /lots/${lot1_id}", as: QualityManager, as_user_id: "qm_alice", captures: { lot1_v: $.data.version } }
            - &c_release1 { call: "POST /lots/${lot1_id}/release-decision", payload: { outcome: "RELEASE", expected_lot_version: "${lot1_v}" }, as: QualityManager, as_user_id: "qm_alice" }
          trigger:
            - { call: "POST /lots/${lot1_id}/ship", payload: { outbound_temp_c: 4.5, carrier_name: "Frostline TRK-77" }, as: PlantOperator, captures: { e_out: $.data.error_id } }
          assert:
            - "HTTP 422 with data.error_id == ERR_OUTBOUND_TEMP_BREACH"
            - "Lot.${lot1_id}.custody_state is still TREATED and release_state == RELEASED"
            - "ColdRoom.${room_id}.occupied_pallets == 1 (the ship cascade did not run)"

      - name: corner_dedicated_cycle_refuses_a_second_customer
        claim_type: Violation → Error
        grounds:
          - validations.p9[POST /vessel-cycles/{id}/loads -> ERR_DEDICATED_CYCLE_REQUIRED]
          - errors[ERR_DEDICATED_CYCLE_REQUIRED]
          - entities.ProductFamily.fields.requires_dedicated_cycle
        distinguishing_aspect: "The first load on a requires_dedicated_cycle family succeeds; the second is refused purely because its lot belongs to a different customer, and the refused contract's slots are untouched."
        test_recipe:
          setup:
            - "family RTE_DED (RTE_PRODUCE group, requires_dedicated_cycle true) with QUALIFIED skus for customers VERDE and NORTE"
            - "each customer has an ACTIVE contract and one accepted pallet in CR-1 (capacity 2)"
            - "cycle CD on HPP-1 already carries VERDE's pallet"
          setup_api_calls:
            - *c_clock
            - *c_cust
            - *c_vessel
            - &c_cust2 { call: "POST /customers", payload: { name: "Norte Fresh", code: "NORTE", billing_email: "ap@norte.example" }, as: FacilityAdmin, captures: { cust2_id: $.data.id } }
            - &c_fam_ded { call: "POST /product-families", payload: { family_code: "RTE_DED", cross_contamination_group: "RTE_PRODUCE", cleanout_minutes: 45, max_receipt_temp_c: 4.0, max_outbound_temp_c: 4.0, requires_dedicated_cycle: true }, as: FacilityAdmin, captures: { ded_id: $.data.id } }
