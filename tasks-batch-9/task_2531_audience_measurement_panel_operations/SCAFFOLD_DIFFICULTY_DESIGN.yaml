            - call: "POST /edit-rule-sets"
              payload: { label: "RS-2026Q3", missing_interval_ascription_minutes: 60, invalid_tuning_max_minutes: 900, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.5, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs8_target_id: "$.data.id" }
            - call: "POST /edit-rule-sets/${rs8_target_id}/publish"
              payload: {}
              as: MethodologyStatistician
            - call: "POST /edit-rule-sets"
              payload: { label: "RS-2026Q4-PROPOSED", missing_interval_ascription_minutes: 30, invalid_tuning_max_minutes: 600, outlier_household_minutes_cap: 1200, outlier_weight_ratio_cap: 2.0, fault_missing_minutes_threshold: 1440 }
              as: MethodologyStatistician
              captures: { rs8_proposed_id: "$.data.id" }
            - call: "GET /markets/${m8_id}"
              payload: {}
              as: MethodologyStatistician
              captures: { m8_v_before_universe: "$.data.version" }
            - call: "POST /universe-estimates"
