            - "the create after reinstate returns 201"
            - "GET /bureau/submissions?insurer_id=${ins_id} returns exactly 1 row"

      - name: return_to_drafting_reverts_cleared_variants_compensation
        claim_type: side_effect_execution
        grounds:
          - state_machines.PolicyForm.IN_REVIEW_to_DRAFTING
        distinguishing_aspect: "Compensation pattern: returning a form to drafting reverts every CLEARED variant's review_status to PENDING while the form leaves IN_REVIEW."
        test_recipe:
          setup:
            - "One form IN_REVIEW with two variants, one CLEARED and one still PENDING."
          setup_api_calls:
            - call: "POST /bureau/forms"
              payload: { form_number: "CP-00-10", form_title: "Ordinance or Law Endorsement", form_kind: "ENDORSEMENT" }
              as: BureauAdmin
              captures: { form_id: $.data.id }
            - call: "POST /bureau/forms/${form_id}/variants"
              payload: { state_code: "CW", variant_text_ref: "txt/cw", effective_from: "2026-10-01T00:00:00Z", effective_to: null }
              as: BureauAdmin
              captures: { v_cw: $.data.id }
            - call: "POST /bureau/forms/${form_id}/variants"
              payload: { state_code: "TX", variant_text_ref: "txt/tx", effective_from: "2026-10-01T00:00:00Z", effective_to: null }
              as: BureauAdmin
              captures: { v_tx: $.data.id }
            - call: "POST /bureau/forms/${form_id}/submit-review"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/variants/${v_cw}/clear"
              payload: {}
              as: BureauActuary
          trigger:
            - call: "POST /bureau/forms/${form_id}/return-to-drafting"
              payload: {}
              as: BureauActuary
          assert:
            - "PolicyForm.${form_id}.form_status == DRAFTING"
            - "FormVariant.${v_cw}.review_status == PENDING (compensated)"
            - "FormVariant.${v_tx}.review_status == PENDING (untouched)"
            - "FormVariant.${v_cw}.publication_status == UNPUBLISHED"

      - name: class_plan_lock_requires_activated_revision_and_no_staged
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ClassPlan.OPEN_to_LOCKED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Locking a plan with a STAGED revision still pending fails with 409 ERR_INVALID_STATE; only after the staged revision activates (superseding the old) does lock succeed."
        test_recipe:
          setup:
            - "Class plan with revision 1 ACTIVATED and revision 2 STAGED with activates_at in the past."
          setup_api_calls:
            - call: "POST /bureau/class-plans"
              payload: { class_plan_code: "CP-PLAN-2", line_of_business: "COMMERCIAL_PROPERTY" }
              as: BureauAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /bureau/class-plans/${plan_id}/revisions"
              payload: { class_count: 12, activates_at: "2026-08-01T00:00:00Z" }
              as: BureauAdmin
              captures: { rev1: $.data.id }
            - call: "POST /bureau/class-plan-revisions/${rev1}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/class-plans/${plan_id}/revisions"
              payload: { class_count: 14, activates_at: "2026-08-15T00:00:00Z" }
              as: BureauAdmin
              captures: { rev2: $.data.id }
          trigger:
            - call: "POST /bureau/class-plans/${plan_id}/lock"
              payload: {}
              as: BureauAdmin
              captures: { err_id: $.data.error_id }
            - call: "POST /bureau/class-plan-revisions/${rev2}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/class-plans/${plan_id}/lock"
              payload: {}
              as: BureauAdmin
          assert:
            - "the first lock returns 409 and error_id == ERR_INVALID_STATE"
            - "after activating revision 2: ClassPlanRevision.${rev1}.revision_status == SUPERSEDED and ClassPlanRevision.${rev2}.revision_status == ACTIVATED"
            - "ClassPlan.${plan_id}.current_revision_id == ${rev2}"
            - "the second lock returns 200 and ClassPlan.${plan_id}.plan_status == LOCKED"

      - name: terminal_circular_superseded_accepts_no_further_publish
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Circular
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "A circular superseded by a later publication is terminal; publishing it again fails with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Circular C1 PUBLISHED; circular C2 created with supersedes_circular_id=C1 and published."
          setup_api_calls:
            - call: "POST /bureau/circulars"
              payload: { circular_number: "CIR-2026-20", subject: "Original notice", implementation_date: "2026-11-01T00:00:00Z" }
              as: BureauAdmin
              captures: { c1: $.data.id }
            - call: "POST /bureau/circulars/${c1}/publish"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/circulars"
              payload: { circular_number: "CIR-2026-21", subject: "Replacement notice", implementation_date: "2026-12-01T00:00:00Z", supersedes_circular_id: "${c1}" }
              as: BureauAdmin
              captures: { c2: $.data.id }
            - call: "POST /bureau/circulars/${c2}/publish"
              payload: {}
              as: BureauAdmin
          trigger:
            - call: "POST /bureau/circulars/${c1}/publish"
              payload: {}
              as: BureauAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "Circular.${c1}.circular_status == SUPERSEDED"
            - "the republish of C1 returns 409 and error_id == ERR_INVALID_STATE"

