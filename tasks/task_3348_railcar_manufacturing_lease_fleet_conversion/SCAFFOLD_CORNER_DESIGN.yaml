        payload:
          lease_contract_id: ${lc_id}
        as: ProductionPlanner
      - call: POST /api/v1/production-lines/LINE-B/changeover
        payload:
          production_order_id: ${po_id}
          scheduled_start_date: '2026-09-05'
          scheduled_end_date: '2026-11-04'
        as: ProductionPlanner
      - call: POST /api/v1/production-orders/${po_id}/complete
        payload:
          completed_qty: 2
