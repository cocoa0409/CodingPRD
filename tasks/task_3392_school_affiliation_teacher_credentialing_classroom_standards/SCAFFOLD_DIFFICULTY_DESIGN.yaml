            - "Y ACCREDITATION submit is rejected with error_id == ERR_CLASSROOM_NONCOMPLIANT (http 422) under NO_FAIL_IN_CYCLE because the 2027-10-15 NONCOMPLIANT audit lies inside the trailing 12-month window [2026-10-20, 2027-10-20]"
            - "SchoolApplication.${ya3}.status == DRAFT (failed submit does not advance the application)"

  - rule_id: combinatorial_formula
    instances:

      - name: dues_marginal_tiers_floor_and_cap
        grounds:
          - calculations.annual_membership_dues
          - entities.School.fields.annual_dues_cents
          - entities.School.fields.total_enrollment
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: three schools pin three different regimes of the same formula — F hits the MIN_DUES floor (raw 48000 -> 60000), G exercises the marginal tier boundary at student 101 plus a 2-classroom surcharge (207200), H hits the MAX_DUES cap as a MEMBER with 1500 students (raw 1568000 -> 1500000)."
        test_recipe:
          setup:
            - "School F: APPLICANT, one classroom with 0 students."
            - "School G: APPLICANT, two classrooms with 60 and 41 students (total 101)."
            - "School H: MEMBER (advanced through the application chain), one classroom with 1500 students and a COMPLIANT audit on file."
          setup_api_calls:
            - *clk_start
            - *cat_create
            - *cat_activate
            - call: "POST /society/schools"
              payload: { name: "F School", display_name: "F Schoolhouse", uses_method_name: false, contact_email: "f@x.org" }
              as: SocietyAdmin
              captures: { f_id: $.data.id }
            - call: "POST /society/classrooms"
              payload: { school_id: "${f_id}", name: "F1", age_level: "EARLY_CHILDHOOD", declared_age_span_years: 3, enrolled_student_count: 0, assistant_count: 1 }
              as: SchoolAdmin
              as_user_id: "${f_id}"
            - call: "GET /society/schools/${f_id}"
              payload: {}
              as: SocietyAdmin
              captures: { f_dues: $.data.annual_dues_cents }
            - call: "POST /society/schools"
              payload: { name: "G School", display_name: "G Schoolhouse", uses_method_name: false, contact_email: "g@x.org" }
              as: SocietyAdmin
              captures: { g_id: $.data.id }
            - call: "POST /society/classrooms"
