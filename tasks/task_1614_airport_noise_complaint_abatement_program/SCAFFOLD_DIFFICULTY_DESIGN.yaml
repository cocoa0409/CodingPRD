  - rule_id: cross_entity_state_dependency
    instances:
      - name: issue_offer_gated_by_study_adoption
        grounds:
          - state_machines.SoundInsulationApplication_Funding.UNFUNDED_to_OFFER_ISSUED
          - state_machines.NoiseStudy.PUBLIC_REVIEW_to_ADOPTED
          - errors[ERR_STUDY_NOT_ADOPTED]
        distinguishing_aspect: |
          Pair SoundInsulationApplication x NoiseStudy: issue-offer on an ELIGIBLE_TIER1
          application is rejected while the parcel's study is PUBLIC_REVIEW, and succeeds
          unchanged once that study is ADOPTED.
        test_recipe:
          setup:
            - "ACTIVE fund FY2027 (20,000,000); study advanced to PUBLIC_REVIEW (not adopted); parcel measured 72.0 / modeled 73.0 RESIDENTIAL; application ELIGIBLE_TIER1 on est 7,777,777"
          setup_api_calls:
            - { call: "POST /noise-program/insulation-funds", payload: { fiscal_year: "FY2027", total_allocation_cents: 20000000, intake_opens_at: "2026-07-01T00:00:00Z", intake_closes_at: "2026-09-30T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Iota", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-700", land_use: "RESIDENTIAL", dnl_db_measured: 72.0, dnl_db_modeled: 73.0, zone_code: "Z7" }, as: StudyCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p_id}", dwelling_type: "SINGLE_FAMILY", rooms_count: 5, est_cost_cents: 7777777 }, as: CommunityLiaison, captures: { app_id: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/record-decision", payload: { decision: "ELIGIBLE_TIER1" }, as: StudyCoordinator }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { fv1: $.data.version } }
          trigger:
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/issue-offer", payload: { expected_fund_version: "${fv1}" }, as: NoiseOfficeAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/adopt", payload: {}, as: NoiseOfficeAdmin }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { fv2: $.data.version } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/issue-offer", payload: { expected_fund_version: "${fv2}" }, as: NoiseOfficeAdmin, captures: { off: $.data.offered_amount_cents, ofs: $.data.funding_status } }
          assert:
            - "err == ERR_STUDY_NOT_ADOPTED while study is PUBLIC_REVIEW"
            - "after adopt: ofs == OFFER_ISSUED and off == 8805555"

      - name: notification_close_gated_by_linked_complaint_terminal
        grounds:
          - state_machines.OperatorNotification.RESPONSE_RECEIVED_to_CLOSED
          - state_machines.NoiseComplaint.CORRELATED_to_CLOSED_SUBSTANTIATED
          - errors[ERR_LINKED_COMPLAINT_OPEN]
        distinguishing_aspect: |
          Pair OperatorNotification x NoiseComplaint: closing a RESPONSE_RECEIVED
          notification whose linked complaint is still UNDER_REVIEW fails; closing the
          complaint first (SUBSTANTIATED) unlocks the notification close, and the
          operator earns on-time credit (closed_at <= due_at).
        test_recipe:
          setup:
            - "Complainant Z1; operator; flight OPERATED 2026-07-15T12:00:00Z zone Z1; complaint occurred 12:02:00Z in UNDER_REVIEW; notification linked to it in RESPONSE_RECEIVED (sent, acknowledged, responded)"
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "Gate One", email: "g1@x.com", address_line: "2 Gate Rd", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/operators", payload: { name: "Air Seven", iata_code: "A7", contact_email: "ops@airseven.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/flight-operations", payload: { flight_number: "A7100", operator_id: "${op_id}", aircraft_type: "B738", engine_class: "STAGE_4", operation_type: "DEPARTURE", runway_code: "09L", scheduled_at: "2026-07-15T11:55:00Z", zone_code: "Z1" }, as: NoiseOfficeAdmin, captures: { fl_id: $.data.id } }
            - { call: "PATCH /noise-program/flight-operations/${fl_id}", payload: { status: "OPERATED", actual_at: "2026-07-15T12:00:00Z" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-15T12:02:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}", captures: { c_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/begin-review", payload: {}, as: NoiseAnalyst, captures: { c_v: $.data.version } }
            - { call: "POST /noise-program/operator-notifications", payload: { operator_id: "${op_id}", complaint_id: "${c_id}", severity: "FORMAL", subject: "Complaint follow-up", body: "Please respond to this complaint." }, as: NoiseAnalyst, captures: { n_id: $.data.id } }
            - { call: "POST /noise-program/operator-notifications/${n_id}/send", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/operator-notifications/${n_id}/acknowledge", payload: {}, as: OperatorRep, as_user_id: "${op_id}" }
            - { call: "POST /noise-program/operator-notifications/${n_id}/respond", payload: { response_text: "We adjusted the climb profile." }, as: OperatorRep, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /noise-program/operator-notifications/${n_id}/close", payload: { closed_outcome: "RESOLVED" }, as: NoiseAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /noise-program/noise-complaints/${c_id}/correlate", payload: { flight_id: "${fl_id}", expected_complaint_version: "${c_v}" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c_id}/close", payload: { outcome: "SUBSTANTIATED" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/operator-notifications/${n_id}/close", payload: { closed_outcome: "RESOLVED" }, as: NoiseAnalyst, captures: { n_st: $.data.status } }
            - { call: "GET /noise-program/operators/${op_id}", payload: {}, as: NoiseAnalyst, captures: { o_ontime: $.data.on_time_responses_90d } }
          assert:
            - "err == ERR_LINKED_COMPLAINT_OPEN (complaint still UNDER_REVIEW)"
            - "n_st == CLOSED after the complaint reaches CLOSED_SUBSTANTIATED"
            - "o_ontime == 1 (closed well before due_at = sent + 10 days)"

      - name: report_submit_gated_by_unclassified_events_in_period
        grounds:
          - state_machines.QuarterlyReport.DRAFT_to_UNDER_REVIEW
          - state_machines.NoiseEvent.SCREENING_to_CLASSIFIED_COMMUNITY
          - errors[ERR_UNCLASSIFIED_EVENTS_REMAIN]
        distinguishing_aspect: |
          Pair QuarterlyReport x NoiseEvent: submit-for-review of the 2026-Q2 report
          fails while one event started in Q2 remains in SCREENING; classifying and
          verifying that event (VERIFIED) releases the gate. Third distinct pair.
        test_recipe:
          setup:
            - "Monitor; one event started 2026-05-15T10:00:00Z (Q2) in SCREENING; DRAFT report for 2026-Q2 (period_end 2026-07-01 <= default clock)"
          setup_api_calls:
            - { call: "POST /noise-program/noise-monitors", payload: { station_code: "MG1", zone_code: "Z1", latitude: 47.1, longitude: -122.3, commissioned_at: "2026-01-01T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { mon_id: $.data.id } }
            - { call: "POST /noise-program/noise-monitors/${mon_id}/events", payload: { started_at: "2026-05-15T10:00:00Z", duration_seconds: 40, lmax_db: 72.0, sel_db: 90.0 }, as: NoiseOfficeAdmin, captures: { e_id: $.data.id } }
            - { call: "POST /noise-program/noise-events/${e_id}/begin-screening", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/quarterly-reports", payload: { quarter_label: "2026-Q2" }, as: NoiseAnalyst, captures: { r_id: $.data.id } }
          trigger:
            - { call: "POST /noise-program/quarterly-reports/${r_id}/submit-for-review", payload: {}, as: NoiseAnalyst, captures: { err: $.data.error_id } }
            - { call: "POST /noise-program/noise-events/${e_id}/classify", payload: { classification: "COMMUNITY" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-events/${e_id}/verify", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/quarterly-reports/${r_id}/submit-for-review", payload: {}, as: NoiseAnalyst, captures: { r_st: $.data.status } }
          assert:
            - "err == ERR_UNCLASSIFIED_EVENTS_REMAIN while the Q2 event is SCREENING"
            - "r_st == UNDER_REVIEW after the event reaches VERIFIED"
            - "QuarterlyReport.${r_id}.events_community_count == 0 (rollup snapshot is frozen at creation, when the event was still SCREENING and thus excluded)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: outage_half_open_intervals_adjacency_allowed
        grounds:
          - entities.MonitorOutage.fields.start_at
          - errors[ERR_OUTAGE_OVERLAP]
          - calculations.monitor_uptime_30d
        distinguishing_aspect: |
          Half-open [start_at, end_at) semantics on NoiseMonitor: an outage starting
          exactly at the previous outage's end (adjacency) is accepted, while an
          interior overlap is rejected with ERR_OUTAGE_OVERLAP.
        test_recipe:
          setup:
            - "Monitor MU-A with outage [2026-07-10T10:00Z, 2026-07-10T11:00Z) recorded"
          setup_api_calls:
            - { call: "POST /noise-program/noise-monitors", payload: { station_code: "MU-A", zone_code: "Z1", latitude: 47.1, longitude: -122.3, commissioned_at: "2026-01-01T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /noise-program/noise-monitors/${m_id}/outages", payload: { start_at: "2026-07-10T10:00:00Z", end_at: "2026-07-10T11:00:00Z", outage_type: "CALIBRATION" }, as: NoiseOfficeAdmin, captures: { o1: $.data.id } }
          trigger:
            - { call: "POST /noise-program/noise-monitors/${m_id}/outages", payload: { start_at: "2026-07-10T11:00:00Z", end_at: "2026-07-10T12:00:00Z", outage_type: "MAINTENANCE" }, as: NoiseOfficeAdmin, captures: { o2: $.data.id } }
            - { call: "POST /noise-program/noise-monitors/${m_id}/outages", payload: { start_at: "2026-07-10T10:30:00Z", end_at: "2026-07-10T11:30:00Z", outage_type: "FAULT" }, as: NoiseOfficeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "o2 created (adjacent [11:00,12:00) after [10:00,11:00) is NOT an overlap under half-open semantics)"
            - "err == ERR_OUTAGE_OVERLAP for [10:30,11:30) (interior intersection)"

      - name: curfew_closed_intervals_touching_minutes_conflict
        grounds:
          - entities.CurfewRule.fields.window_start_minute
          - errors[ERR_CURFEW_WINDOW_OVERLAP]
          - calculations.curfew_compliance_score
        distinguishing_aspect: |
          Closed-interval semantics on CurfewRule (runway resource): windows sharing a
          boundary minute (1300) CONFLICT (both inclusive), season YEAR_ROUND intersects
          WINTER, and applies_to ARRIVAL vs DEPARTURE does not intersect. Different
          interval semantics from the half-open outage rule.
        test_recipe:
          setup:
            - "Rule R1: runway 09L, YEAR_ROUND, [1200,1300], DEPARTURE, effective all 2026"
          setup_api_calls:
            - { call: "POST /noise-program/curfew-rules", payload: { runway_code: "09L", season: "YEAR_ROUND", window_start_minute: 1200, window_end_minute: 1300, applies_to: "DEPARTURE", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NoiseOfficeAdmin, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /noise-program/curfew-rules", payload: { runway_code: "09L", season: "YEAR_ROUND", window_start_minute: 1300, window_end_minute: 1400, applies_to: "DEPARTURE", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NoiseOfficeAdmin, captures: { err_touch: $.data.error_id } }
            - { call: "POST /noise-program/curfew-rules", payload: { runway_code: "09L", season: "WINTER", window_start_minute: 1210, window_end_minute: 1250, applies_to: "DEPARTURE", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NoiseOfficeAdmin, captures: { err_season: $.data.error_id } }
            - { call: "POST /noise-program/curfew-rules", payload: { runway_code: "09L", season: "YEAR_ROUND", window_start_minute: 1301, window_end_minute: 1400, applies_to: "DEPARTURE", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NoiseOfficeAdmin, captures: { ok_gap: $.data.id } }
            - { call: "POST /noise-program/curfew-rules", payload: { runway_code: "09L", season: "YEAR_ROUND", window_start_minute: 1200, window_end_minute: 1300, applies_to: "ARRIVAL", effective_from: "2026-01-01", effective_to: "2026-12-31" }, as: NoiseOfficeAdmin, captures: { ok_arr: $.data.id } }
          assert:
            - "err_touch == ERR_CURFEW_WINDOW_OVERLAP (closed intervals share minute 1300)"
            - "err_season == ERR_CURFEW_WINDOW_OVERLAP (YEAR_ROUND intersects WINTER)"
            - "ok_gap and ok_arr created (gap of one minute; disjoint applies_to scopes escape the conflict)"

  - rule_id: compensating_invariant
    instances:
      - name: fund_conservation_across_issue_decline_reissue_disburse
        grounds:
          - entities.InsulationFund.fields.available_cents
          - state_machines.SoundInsulationApplication_Funding.OFFER_ISSUED_to_OFFER_DECLINED
          - state_machines.SoundInsulationApplication_Funding.GRANT_COMMITTED_to_REIMBURSED
        distinguishing_aspect: |
          Conserved quantity: money. available + reserved + disbursed == 5,000,000 after
          EVERY phase: issue (400,000/4,600,000/0), decline (5,000,000/0/0), re-issue,
          accept, disburse of actual 4,000,000 -> final 3,680,000 disbursed, 920,000
          surplus released (1,320,000/0/3,680,000).
        test_recipe:
          setup:
            - "ACTIVE fund FY2027 (5,000,000); ADOPTED study; RESIDENTIAL parcel measured 66.0/modeled 67.5; application ELIGIBLE_TIER2 on est 5,000,000"
          setup_api_calls:
            - { call: "POST /noise-program/insulation-funds", payload: { fiscal_year: "FY2027", total_allocation_cents: 5000000, intake_opens_at: "2026-07-01T00:00:00Z", intake_closes_at: "2026-09-30T00:00:00Z" }, as: NoiseOfficeAdmin, captures: { fund_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies", payload: { title: "Part150 Kappa", baseline_year: 2025 }, as: StudyCoordinator, captures: { st_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/start-data-collection", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/parcels", payload: { parcel_ref: "P-800", land_use: "RESIDENTIAL", dnl_db_measured: 66.0, dnl_db_modeled: 67.5, zone_code: "Z8" }, as: StudyCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /noise-program/noise-studies/${st_id}/release-draft", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/open-public-comment", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/noise-studies/${st_id}/adopt", payload: {}, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/sound-insulation-applications", payload: { parcel_id: "${p_id}", dwelling_type: "SINGLE_FAMILY", rooms_count: 6, est_cost_cents: 5000000 }, as: CommunityLiaison, captures: { app_id: $.data.id } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/submit", payload: {}, as: CommunityLiaison }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/begin-screening", payload: {}, as: StudyCoordinator }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/record-decision", payload: { decision: "ELIGIBLE_TIER2" }, as: StudyCoordinator }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { fv1: $.data.version } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/issue-offer", payload: { expected_fund_version: "${fv1}" }, as: NoiseOfficeAdmin, captures: { off1: $.data.offered_amount_cents } }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { a1: $.data.available_cents, r1: $.data.reserved_cents, d1: $.data.disbursed_cents, fv2: $.data.version } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/decline-offer", payload: {}, as: CommunityLiaison, captures: { fs_declined: $.data.funding_status } }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { a2: $.data.available_cents, r2: $.data.reserved_cents, fv3: $.data.version } }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/issue-offer", payload: { expected_fund_version: "${fv3}" }, as: NoiseOfficeAdmin }
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/accept-offer", payload: {}, as: CommunityLiaison }
          trigger:
            - { call: "POST /noise-program/sound-insulation-applications/${app_id}/disburse", payload: { actual_cost_cents: 4000000 }, as: NoiseOfficeAdmin, captures: { disb: $.data.disbursed_cents, ffs: $.data.funding_status } }
            - { call: "GET /noise-program/insulation-funds/${fund_id}", payload: {}, as: NoiseOfficeAdmin, captures: { a3: $.data.available_cents, r3: $.data.reserved_cents, d3: $.data.disbursed_cents } }
          assert:
            - "off1 == 4600000 (TIER2 provisional: 4,000,000 + 400,000 + 200,000)"
            - "a1 == 400000 and r1 == 4600000 and d1 == 0 (sum 5,000,000)"
            - "fs_declined == OFFER_DECLINED and a2 == 5000000 and r2 == 0 (compensation released; sum 5,000,000)"
            - "disb == 3680000 (TIER2 final on 4,000,000: 3,200,000 + 320,000 + 160,000) and ffs == REIMBURSED"
            - "a3 == 1320000 and r3 == 0 and d3 == 3680000 (sum 5,000,000; 920,000 surplus released)"

      - name: complainant_counter_conservation_across_close_withdraw_reopen
        grounds:
          - entities.Complainant.fields.open_count
          - state_machines.NoiseComplaint.CLOSED_UNSUBSTANTIATED_to_REOPENED
        distinguishing_aspect: |
          Conserved quantity: per-complainant complaint cardinality. open + closed +
          withdrawn == filed_total at every step across close (0+1+0... wait: 3 filed ->
          close one, withdraw one, reopen the closed one): filed stays 3 while buckets
          move (1/1/1 -> 2/0/1); no complaint is ever lost or double-counted.
        test_recipe:
          setup:
            - "Complainant with 3 complaints: C1 closed UNSUBSTANTIATED, C2 withdrawn, C3 still RECEIVED"
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "Inv One", email: "inv1@x.com", address_line: "8 Sum Ln", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-05T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}", captures: { c1: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-06T08:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { c2: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-07T08:00:00Z", channel: "APP", disturbance_type: "VIBRATION" }, as: Complainant, as_user_id: "${comp_id}", captures: { c3: $.data.id } }
            - { call: "POST /noise-program/noise-complaints/${c1}/begin-review", payload: {}, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c1}/close", payload: { outcome: "UNSUBSTANTIATED" }, as: NoiseAnalyst }
            - { call: "POST /noise-program/noise-complaints/${c2}/withdraw", payload: {}, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "GET /noise-program/complainants/${comp_id}", payload: {}, as: CommunityLiaison, captures: { o1: $.data.open_count, cl1: $.data.closed_count, w1: $.data.withdrawn_count, f1: $.data.filed_total } }
          trigger:
            - { call: "POST /noise-program/noise-complaints/${c1}/reopen", payload: { reason: "changed mind" }, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "GET /noise-program/complainants/${comp_id}", payload: {}, as: CommunityLiaison, captures: { o2: $.data.open_count, cl2: $.data.closed_count, w2: $.data.withdrawn_count, f2: $.data.filed_total } }
          assert:
            - "f1 == 3 and o1 == 1 and cl1 == 1 and w1 == 1 (1+1+1 == 3)"
            - "f2 == 3 and o2 == 2 and cl2 == 0 and w2 == 1 (2+0+1 == 3; reopen compensated the close)"

      - name: operator_notification_conservation_with_auto_close
        grounds:
          - entities.Operator.fields.notifications_draft
          - state_machines.OperatorNotification.DRAFT_to_AUTO_CLOSED
          - state_machines.NoiseComplaint.transitions
        distinguishing_aspect: |
          Conserved quantity: per-operator notification cardinality. draft + open +
          closed == created total (2) across send (draft->open) and complaint-withdraw
          cascade (draft->AUTO_CLOSED): 0 + 1 + 1 == 2.
        test_recipe:
          setup:
            - "Complainant with complaints CA, CB; operator with DRAFT notifications N1 (on CA), N2 (on CB)"
          setup_api_calls:
            - { call: "POST /noise-program/complainants", payload: { full_name: "Inv Two", email: "inv2@x.com", address_line: "9 Sum Ln", zone_code: "Z1" }, as: CommunityLiaison, captures: { comp_id: $.data.id } }
            - { call: "POST /noise-program/operators", payload: { name: "Air Eight", iata_code: "A8", contact_email: "ops@aireight.example" }, as: NoiseOfficeAdmin, captures: { op_id: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-05T08:00:00Z", channel: "WEB", disturbance_type: "LOUD_EVENT" }, as: Complainant, as_user_id: "${comp_id}", captures: { ca: $.data.id } }
            - { call: "POST /noise-program/noise-complaints", payload: { complainant_id: "${comp_id}", occurred_at: "2026-07-06T08:00:00Z", channel: "WEB", disturbance_type: "OTHER" }, as: Complainant, as_user_id: "${comp_id}", captures: { cb: $.data.id } }
            - { call: "POST /noise-program/operator-notifications", payload: { operator_id: "${op_id}", complaint_id: "${ca}", severity: "ADVISORY", subject: "N1", body: "Body one." }, as: NoiseAnalyst, captures: { n1: $.data.id } }
            - { call: "POST /noise-program/operator-notifications", payload: { operator_id: "${op_id}", complaint_id: "${cb}", severity: "ADVISORY", subject: "N2", body: "Body two." }, as: NoiseAnalyst, captures: { n2: $.data.id } }
            - { call: "POST /noise-program/operator-notifications/${n1}/send", payload: {}, as: NoiseAnalyst }
          trigger:
            - { call: "POST /noise-program/noise-complaints/${cb}/withdraw", payload: {}, as: Complainant, as_user_id: "${comp_id}" }
            - { call: "GET /noise-program/operator-notifications/${n2}", payload: {}, as: NoiseAnalyst, captures: { n2_st: $.data.status, n2_out: $.data.closed_outcome } }
            - { call: "GET /noise-program/operators/${op_id}", payload: {}, as: NoiseAnalyst, captures: { od: $.data.notifications_draft, oo: $.data.notifications_open, oc: $.data.notifications_closed, os: $.data.notifications_sent_total } }
          assert:
            - "n2_st == AUTO_CLOSED and n2_out == COMPLAINT_WITHDRAWN (cascade D hop 1)"
            - "od == 0 and oo == 1 and oc == 1 (0+1+1 == 2 created)"
            - "os == 1 (only N1 was ever sent; AUTO_CLOSED from DRAFT does not count)"
