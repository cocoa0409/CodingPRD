  - rule_id: combinatorial_formula
    instances:
      - name: mode_a_seat_weekly_compensation_five_input_nested_max_min
        grounds:
          - calculations.seat_weekly_compensation
          - calculations.seat_weekly_compensation.formula
          - calculations.seat_weekly_compensation.constants.ROUNDING
          - entities.GuildAgreement.fields.mini_room_floor_multiplier
          - entities.GuildAgreement.fields.short_commitment_uplift_pct
          - entities.GuildAgreement.fields.diversity_subsidy_cap_weekly_cents
          - entities.WritersRoom.fields.format
          - entities.WritersRoom.fields.duration_weeks_committed
          - entities.RoomSeat.fields.guild_floor_weekly_cents
          - entities.RoomSeat.fields.weekly_compensation_cents
          - entities.RoomSeat.fields.diversity_subsidy_weekly_cents
          - entities.RoomSeat.fields.studio_charge_weekly_cents
        distinguishing_aspect: |
          Combinatorial mode (a) - five independent inputs living on three different entities
          (level minimum on GuildAgreement, format and duration_weeks_committed on WritersRoom,
          offered amount and diversity_program_funded on RoomSeat, diversity_program_participant on
          Writer) collide inside one nested max/min with two conditional branches, and the single
          round_half_up must be applied to the whole product 450000 * 1.2 * 1.1 rather than once per
          factor. The offered amount (500000) is deliberately BELOW the derived floor (594000) so the
          max() branch is exercised, and the raw subsidy (297000) is deliberately ABOVE the cap
          (250000) so the min() branch is exercised in the same call.
        test_recipe:
          setup:
            - "Agreement AG with STAFF_WRITER minimum 450000, mini_room_floor_multiplier 1.2, short_commitment_weeks_threshold 20, short_commitment_uplift_pct 0.1, diversity_subsidy_pct 0.5, diversity_subsidy_cap_weekly_cents 250000, format_surcharge_pct MINI_ROOM 0.6."
            - "Writer NV with 0 career credits (determined_level STAFF_WRITER) and diversity_program_participant true, holding an availability window 2026-08-15..2027-01-01."
            - "Season SE (staffing window 2026-08-01..2026-09-30, staffing_budget_weekly_cents 5000000)."
            - "Room MR in STAFFING with format MINI_ROOM, seat_capacity 2, duration_weeks_committed 12 (short commitment), 2026-09-01..2026-11-24 (exactly 84 days)."
          setup_api_calls:
            - call: "POST /guild-agreements"
              payload: *AGP
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
              as: GuildAdministrator
              captures: { sr: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Nia Vance", guild_member_id: "GM-2001", agreement_id: "${ag}", career_episodic_credits: 0, diversity_program_participant: true }
              as: GuildAdministrator
              captures: { nv: "$.data.id" }
            - call: "POST /seasons"
              payload: { guild_agreement_id: "${ag}", showrunner_writer_id: "${sr}", title: "Nightfall S1", episode_order: 8, length_format: "ONE_HOUR", production_start_date: "2026-11-02T00:00:00Z", staffing_window_start: "2026-08-01T00:00:00Z", staffing_window_end: "2026-09-30T00:00:00Z", ready_script_target: 1, guarantee_application_mode: "FORWARD_COMMIT", staffing_budget_weekly_cents: 5000000, script_fee_budget_cents: 60000000 }
              as: StudioExecutive
              captures: { se: "$.data.id" }
            - call: "POST /writers/${nv}/availability-windows"
              payload: { start_date: "2026-08-15T00:00:00Z", end_date: "2027-01-01T00:00:00Z", commitment_type: "EXCLUSIVE" }
              as: Writer
              as_user_id: "${nv}"
            - call: "POST /seasons/${se}/rooms"
              payload: { name: "Mini Room", format: "MINI_ROOM", seat_capacity: 2, duration_weeks_committed: 12, start_date: "2026-09-01T00:00:00Z", end_date: "2026-11-24T00:00:00Z", diversity_seats_required: 1 }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { mr: "$.data.id" }
            - call: "POST /rooms/${mr}/open-staffing"
              payload: {}
              as: Showrunner
              as_user_id: "${sr}"
              captures: { mrv: "$.data.version" }
          trigger:
            - call: "POST /rooms/${mr}/seats"
              payload: { writer_id: "${nv}", level_at_hire: "STAFF_WRITER", offered_weekly_compensation_cents: 500000, exclusivity: "EXCLUSIVE", start_date: "2026-09-01T00:00:00Z", end_date: "2026-11-24T00:00:00Z", episodic_guarantee_count: 1, diversity_program_funded: true, expected_room_version: "${mrv}" }
              as: Showrunner
              as_user_id: "${sr}"
              captures: { sa: "$.data.id" }
          assert:
            - "RoomSeat.${sa}.guild_floor_weekly_cents == 594000"
            - "RoomSeat.${sa}.weekly_compensation_cents == 594000"
            - "RoomSeat.${sa}.diversity_subsidy_weekly_cents == 250000"
            - "RoomSeat.${sa}.studio_charge_weekly_cents == 344000"
            - "RoomSeat.${sa}.prorated_commitment_cents == 7128000"
            - "RoomSeat.${sa}.status == OFFERED"
            - "RoomSeat.${sa}.guarantee_slots_remaining == 1"
            - "A per-factor rounding implementation (round(450000*1.2)=540000 then round(540000*1.1)=594000) happens to agree here, but an uncapped subsidy would give 297000 and a floor built from the offered amount would give 500000 - both wrong."

      - name: mode_b_seat_prorated_commitment_pinned_rounding_order
        grounds:
          - calculations.seat_prorated_commitment
          - calculations.seat_prorated_commitment.formula
          - calculations.seat_prorated_commitment.constants.ROUNDING_ORDER
          - calculations.seat_prorated_commitment.note
          - entities.RoomSeat.fields.prorated_commitment_cents
          - entities.RoomSeat.fields.start_date
          - entities.RoomSeat.fields.end_date
        distinguishing_aspect: |
          Combinatorial mode (b) - nested rounding whose ORDER changes the answer. The half-open
          interval 2026-09-01..2026-09-18 is 17 days = 2 full weeks + 3 residual days at a weekly rate
          of 450000 (not a multiple of 7). The pinned order (round the daily rate first, then multiply)
          gives 900000 + 3 * 64286 = 1092858; the rejected order (multiply, then round once) gives
          900000 + round_half_up(1350000/7) = 1092857. A correct implementation must return 1092858 -
          the one-cent gap is the whole point of the instance.
        test_recipe:
          setup:
            - "Agreement AG (STAFF_WRITER minimum 450000) and season SE as in mode (a)."
            - "Writer PQ with 0 career credits and diversity_program_participant false, availability window 2026-08-15..2027-01-01."
            - "Room LR in STAFFING with format IN_PERSON, seat_capacity 3, duration_weeks_committed 26 (no short-commitment uplift), 2026-09-01..2027-03-01."
          setup_api_calls:
            - call: "POST /guild-agreements"
              payload: *AGP
              as: GuildAdministrator
              captures: { ag: "$.data.id" }
            - call: "POST /writers"
              payload: { legal_name: "Sloane Reyes", guild_member_id: "GM-SHOW", agreement_id: "${ag}", career_episodic_credits: 20, is_showrunner_eligible: true }
