            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: FireMarshal
          assert:
            - "LicenseRecord.${lic_id}.status == EXPIRED after sweep"
      - name: compound_plan_posture_fulfilled_when_all_events_complete
        claim_type: compound_state_derivation
        grounds: [state_machines.InspectionPlan, calculations.plan_posture_derive, calculations.plan_requirement_count]
        distinguishing_aspect: "Plan with a single ANNUAL device requires exactly 1 event; completing that event auto-flips plan to FULFILLED (compound derivation from child states)."
        test_recipe:
          setup: ["Published plan over property with one SMOKE_DETECTOR; one event created, started"]
          setup_api_calls:
            - call: "POST /fire-compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
