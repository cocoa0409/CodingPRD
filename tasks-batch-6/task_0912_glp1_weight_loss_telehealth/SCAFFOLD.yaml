scenario: |
  912. Weight-Loss / GLP-1 Telehealth Program: eligibility & BMI/lab screening, provider consult &
  prescription, pharmacy (compounded/branded) routing & prior-auth, subscription & titration schedule,
  side-effect & check-in, coaching/nutrition add-on, insurance vs cash, discontinuation
domain_name: glp1-weight-loss-telehealth
api_prefix: /glp1

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer collection directly under /glp1; parentage is expressed
  # only through FK fields, never through nested URL paths.

  state_machine_shape: parallel
  # Prescription carries two independent axes (clinical_status x fulfillment_status).
  # Additional non-linear shapes present: cyclic (EligibilityScreening re-screen,
  # Consult reschedule, PriorAuthorization appeal, Subscription pause/resume,
  # TitrationStep hold/re-arm) and branching fork-join (TitrationStep escalate |
  # hold | reduce, CheckIn triage, PharmacyOrder cancel-compensation).

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential   # Prescription.supersedes_prescription_id -> Prescription.id

  role_model: segregation_of_duties
  # A dose escalation to level >= 4 requires a second signing clinician who is NOT
  # the prescriber of record.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# Policy constants referenced by state machines, validations and endpoints.
# Every named constant used anywhere in this scaffold has a concrete value
# either here or inside a calculations[].constants block.
# ===========================================================================
policy_constants:
  LOGICAL_CLOCK_DEFAULT_UTC: "2026-05-01T00:00:00Z"   # server startup clock value before any set_current_utc call
  CONSULT_BUFFER_MINUTES: 15        # both sides of a consult window are widened by this before overlap testing
  COACHING_BUFFER_MINUTES: 0        # coaching windows use a plain half-open overlap test, so exact abutment is legal
  MAX_UNITS_PER_ORDER: 4            # ceiling on units_requested and on Prescription.units_per_cycle
  MAX_PA_APPEALS: 2                 # ceiling on PriorAuthorization.appeal_count
  PA_VALIDITY_DAYS: 180             # approved_through_at is decided_at plus this many days
  PAUSE_MAX_DAYS: 60                # ceiling on Subscription.pause_days_used before a pause is refused
  TITRATION_SECOND_SIGNER_MIN_LEVEL: 4   # target dose_level at or above which a second signing clinician is mandatory
  TITRATION_MAX_DOSE_LEVEL: 5       # highest rung of the ladder
  CYCLE_LENGTH_DAYS: 30             # every BillingCycle spans exactly this many days
  COACHING_CREDITS_PER_CYCLE: 4     # credits granted each time a cycle opens while the add-on is enabled
  PAGINATION_DEFAULT_LIMIT: 10
  PAGINATION_MIN_LIMIT: 1
  PAGINATION_MAX_LIMIT: 100

# ===========================================================================
# 1.1 Entity-Relationship Table
# ===========================================================================
entities:

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: contact address, unique across Patients
        constraints: "must contain '@'; unique"
      - name: full_name
        type: string
        source: input
        description: patient legal name
      - name: state_code
        type: string
        source: input
        description: two-letter state of residence; pharmacies must serve this state
        constraints: "exactly 2 uppercase letters"
      - name: height_cm
        type: number
        source: input
        description: standing height in centimetres, used as the BMI denominator
        constraints: "> 0"
      - name: weight_kg
        type: number
        source: input
        description: most recently recorded body weight in kilograms
        constraints: "> 0"
      - name: comorbidity_codes
        type: array
        source: input
        description: list of qualifying comorbidity codes recorded at intake
        default: []
        constraints: "each element one of TYPE_2_DIABETES, HYPERTENSION, DYSLIPIDEMIA, OSA, CVD; no duplicates"
      - name: payment_mode
        type: enum
        source: input
        description: how the program bills this patient
        constraints: "one of INSURANCE, CASH"
      - name: current_bmi
        type: number
        source: computed
        description: "live BMI recomputed from height_cm and weight_kg on create and on every vitals update (calculations.eligibility_bmi_assessment, variant CURRENT_RECHECK)"
      - name: eligibility_status
        type: enum
        source: computed
        description: mirror of the most recently submitted EligibilityScreening.status for this patient
        default: NOT_SCREENED
        constraints: "one of NOT_SCREENED, ELIGIBLE, INELIGIBLE, DEFERRED"
      - name: lifetime_charged_cents
        type: integer
        source: computed
        description: running total of every BillingCycle amount this patient has settled
        default: 0
      - name: lifetime_credited_cents
        type: integer
        source: computed
        description: running total of every settled amount later reversed by a BillingCycle void
        default: 0

  - name: Provider
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: provider display name
      - name: provider_type
        type: enum
        source: input
        description: whether this provider prescribes or delivers coaching
        constraints: "one of CLINICIAN, COACH"
      - name: npi
        type: string
        source: input
        description: national provider identifier; required when provider_type is CLINICIAN, ignored for COACH
        default: null
      - name: licensed_state_codes
        type: array
        source: input
        description: state codes this provider may see patients in
        default: []
        constraints: "each element exactly 2 uppercase letters"
      - name: status
        type: enum
        source: input
        description: operational availability of this provider
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"

  - name: Pharmacy
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: pharmacy display name
      - name: dispense_type
        type: enum
        source: input
        description: whether this pharmacy dispenses compounded or branded product
        constraints: "one of COMPOUNDED, BRANDED"
      - name: served_state_codes
        type: array
        source: input
        description: state codes this pharmacy may ship into
        default: []
        constraints: "each element exactly 2 uppercase letters"
      - name: status
        type: enum
        source: input
        description: operational availability of this pharmacy
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED"

  - name: SupplyLot
    parent: Pharmacy
    common_fields: true
    fields:
      - name: pharmacy_id
        type: string
        source: input
        description: FK -> Pharmacy.id; the pharmacy that physically holds this lot
      - name: lot_code
        type: string
        source: input
        description: manufacturer or compounder lot identifier
      - name: strength_mg
        type: number
        source: input
        description: milligram strength of every unit in this lot; must equal the prescription dose_mg to be routable
        constraints: "> 0"
      - name: total_units
        type: integer
        source: input
        description: physical unit count held in this lot; the conservation base for INV-1
        constraints: ">= 0"
      - name: window_capacity_units
        type: integer
        source: input
        description: maximum units this lot may have committed across any set of overlapping reservation windows
        constraints: ">= 0"
      - name: available_units
        type: integer
        source: computed
        description: units neither reserved nor dispensed; initialised to total_units at creation
      - name: reserved_units
        type: integer
        source: computed
        description: units held by PharmacyOrders in status RESERVED
        default: 0
      - name: dispensed_units
        type: integer
        source: computed
        description: units permanently consumed by PharmacyOrders in status SHIPPED
        default: 0
      - name: expires_at
        type: datetime
        source: input
        description: lot expiry instant; a lot is routable only while expires_at is at least LOT_MIN_SHELF_LIFE_DAYS beyond the clock
      - name: status
        type: enum
        source: input
        description: release posture of the lot
        default: RELEASED
        constraints: "one of RELEASED, QUARANTINED"
  - name: EligibilityScreening
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the patient being screened
      - name: status
        type: enum
        source: system
        description: screening lifecycle state
        default: DRAFT
        constraints: "one of DRAFT, ELIGIBLE, INELIGIBLE, DEFERRED"
      - name: recorded_weight_kg
        type: number
        source: input
        description: weight captured for this screening; frozen into assessed_bmi at submit
        constraints: "> 0"
      - name: recorded_height_cm
        type: number
        source: computed
        description: snapshot of Patient.height_cm taken when the screening row is created
      - name: egfr
        type: number
        source: input
        description: estimated glomerular filtration rate from the lab panel
        constraints: ">= 0"
      - name: a1c_pct
        type: number
        source: input
        description: haemoglobin A1c percentage from the lab panel
        default: null
      - name: lab_collected_at
        type: datetime
        source: input
        description: instant the lab specimen was collected; drives the LAB_VALIDITY_DAYS staleness test
      - name: comorbidity_count
        type: integer
        source: computed
        description: number of entries in Patient.comorbidity_codes at submit time
        default: 0
      - name: assessed_bmi
        type: number
        source: computed
        description: "BMI frozen at submit from recorded_weight_kg and recorded_height_cm (calculations.eligibility_bmi_assessment, variant SCREENING_SNAPSHOT)"
        default: null
      - name: eligibility_band
        type: enum
        source: computed
        description: which qualifying band the frozen BMI landed in
        default: null
        constraints: "null, or one of OBESITY, COMORBID, NONE"
      - name: decision_reason
        type: enum
        source: computed
        description: machine-readable justification for status
        default: null
        constraints: "null, or one of BMI_QUALIFIED, COMORBID_QUALIFIED, BMI_BELOW_BAND, RENAL_EXCLUSION, STALE_LABS"
      - name: submitted_at
        type: datetime
        source: system
        description: clock value at the most recent submit
        default: null
      - name: submit_count
        type: integer
        source: computed
        description: how many times this screening has been submitted; the re-screen cycle counter
        default: 0

  - name: Consult
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the patient attending the consult
      - name: provider_id
        type: string
        source: input
        description: FK -> Provider.id; the clinician holding the slot
      - name: scheduled_start_at
        type: datetime
        source: input
        description: inclusive start of the booked telehealth slot
      - name: scheduled_end_at
        type: datetime
        source: input
        description: exclusive end of the booked telehealth slot
        constraints: "must be strictly after scheduled_start_at"
      - name: status
        type: enum
        source: system
        description: consult lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETED_PRESCRIBED, COMPLETED_DECLINED, NO_SHOW"
      - name: outcome_note
        type: string
        source: input
        description: free-text note supplied when the consult is completed
        default: null
      - name: reschedule_count
        type: integer
        source: computed
        description: number of times this consult has been moved after a NO_SHOW
        default: 0

  - name: Prescription
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the patient the drug is prescribed to
      - name: consult_id
        type: string
        source: input
        description: FK -> Consult.id; the consult that authorised this prescription
      - name: prescriber_provider_id
        type: string
        source: input
        description: FK -> Provider.id; the clinician of record, blocked from acting as second signer
      - name: screening_id
        type: string
        source: input
        description: FK -> EligibilityScreening.id; the frozen screening whose band gates creation
      - name: supersedes_prescription_id
        type: string
        source: computed
        description: FK -> Prescription.id; self-reference to the prescription this one replaced, null when none
        default: null
      - name: drug_family
        type: enum
        source: input
        description: molecule family, selects the dose ladder
        constraints: "one of SEMAGLUTIDE, TIRZEPATIDE"
      - name: units_per_cycle
        type: integer
        source: input
        description: pens dispensed per 30-day cycle
        default: 4
        constraints: "integer between 1 and MAX_UNITS_PER_ORDER (4) inclusive"
      - name: dose_level
        type: integer
        source: computed
        description: current rung on the titration ladder
        default: 1
        constraints: "integer between 1 and TITRATION_MAX_DOSE_LEVEL (5) inclusive"
      - name: dose_mg
        type: number
        source: computed
        description: "milligram strength for the current dose_level (calculations.dose_schedule_lookup)"
      - name: clinical_status
        type: enum
        source: system
        description: clinical axis of the parallel state machine
        default: ACTIVE
        constraints: "one of ACTIVE, HELD, DISCONTINUED"
      - name: fulfillment_status
        type: enum
        source: system
        description: fulfilment axis of the parallel state machine, advanced independently of clinical_status
        default: UNROUTED
        constraints: "one of UNROUTED, ROUTED, DISPENSED, REFILL_DUE"
      - name: active_route_mode
        type: enum
        source: computed
        description: which pricing and pharmacy fork currently applies; seeded from Patient.payment_mode and flipped to CASH when a prior authorisation is denied
        constraints: "one of INSURANCE, CASH"
      - name: last_dose_change_at
        type: datetime
        source: system
        description: clock value when dose_level last changed; the interval baseline for titration readiness
      - name: severity_index_rolling
        type: integer
        source: computed
        description: "worst check-in score in the trailing SEVERITY_WINDOW_DAYS window (calculations.side_effect_severity_index, variant ROLLING_WINDOW)"
        default: 0
      - name: severity_index_since_dose_change
        type: integer
        source: computed
        description: "worst check-in score recorded at or after last_dose_change_at (calculations.side_effect_severity_index, variant SINCE_LAST_DOSE_CHANGE)"
        default: 0
      - name: discontinue_reason
        type: enum
        source: computed
        description: why the prescription left the ACTIVE or HELD clinical state
        default: null
        constraints: "null, or one of PATIENT_REQUEST, CLINICAL, SUPERSEDED"
  - name: TitrationStep
    parent: Prescription
    common_fields: true
    fields:
      - name: prescription_id
        type: string
        source: input
        description: FK -> Prescription.id; the prescription this rung belongs to
      - name: second_signer_provider_id
        type: string
        source: input
        description: FK -> Provider.id; the co-signing clinician recorded when this rung escalated to dose_level 4 or above
        default: null
      - name: step_number
        type: integer
        source: computed
        description: 1-based ordinal of this rung within the prescription
      - name: dose_level
        type: integer
        source: computed
        description: ladder rung this step administers
      - name: dose_mg
        type: number
        source: computed
        description: milligram strength for this rung
      - name: status
        type: enum
        source: system
        description: rung lifecycle state
        default: DUE
        constraints: "one of DUE, ADMINISTERED, HELD, REDUCED"
      - name: earliest_escalation_at
        type: datetime
        source: computed
        description: "planning-view escalation date, always created_at plus TITRATION_MIN_INTERVAL_DAYS (calculations.titration_readiness_interval, variant INTERVAL_ONLY)"
      - name: administered_at
        type: datetime
        source: system
        description: clock value when this rung was escalated past or reduced away from
        default: null
      - name: hold_reason
        type: enum
        source: computed
        description: why this rung was frozen
        default: null
        constraints: "null, or one of SIDE_EFFECT, PROVIDER_HOLD"

  - name: PriorAuthorization
    parent: Prescription
    common_fields: true
    fields:
      - name: prescription_id
        type: string
        source: input
        description: FK -> Prescription.id; the prescription the payer is being asked to cover
      - name: payer_reference
        type: string
        source: input
        description: payer-side case number supplied at submission
      - name: status
        type: enum
        source: system
        description: prior-authorisation lifecycle state
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, DENIED, APPEALED"
      - name: appeal_count
        type: integer
        source: computed
        description: how many appeals have been filed; capped by MAX_PA_APPEALS
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: clock value of the most recent payer decision
        default: null
      - name: denial_reason
        type: string
        source: computed
        description: payer text recorded on the most recent denial
        default: null
      - name: approved_through_at
        type: datetime
        source: computed
        description: decided_at plus PA_VALIDITY_DAYS, set only on approval
        default: null

  - name: PharmacyOrder
    parent: Prescription
    common_fields: true
    fields:
      - name: prescription_id
        type: string
        source: input
        description: FK -> Prescription.id; the prescription being fulfilled
      - name: titration_step_id
        type: string
        source: input
        description: FK -> TitrationStep.id; the rung whose dose this order dispenses
      - name: pharmacy_id
        type: string
        source: computed
        description: FK -> Pharmacy.id; the pharmacy selected by the routing selector at creation
      - name: supply_lot_id
        type: string
        source: computed
        description: FK -> SupplyLot.id; the lot selected by the routing selector at creation
      - name: units_requested
        type: integer
        source: input
        description: pens requested on this order
        constraints: "integer between 1 and MAX_UNITS_PER_ORDER (4) inclusive"
      - name: window_start_at
        type: datetime
        source: input
        description: inclusive start of the shipping window this order occupies on the lot
      - name: window_end_at
        type: datetime
        source: input
        description: exclusive end of the shipping window this order occupies on the lot
        constraints: "must be strictly after window_start_at"
      - name: status
        type: enum
        source: system
        description: fulfilment lifecycle state
        default: CREATED
        constraints: "one of CREATED, RESERVED, SHIPPED, CANCELLED"
      - name: dispense_type_at_route
        type: enum
        source: computed
        description: which product form the routing selector resolved to at creation
        constraints: "one of COMPOUNDED, BRANDED"
      - name: reserved_at
        type: datetime
        source: system
        description: clock value when units were held on the lot
        default: null
      - name: shipped_at
        type: datetime
        source: system
        description: clock value when units were permanently consumed
        default: null
      - name: cancel_reason
        type: enum
        source: computed
        description: why the order was compensated away
        default: null
        constraints: "null, or one of OPERATOR, PA_DENIED, CLINICAL_HOLD"

  - name: Subscription
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the billed patient
      - name: prescription_id
        type: string
        source: input
        description: FK -> Prescription.id; the prescription this subscription bills for
      - name: anchor_at
        type: datetime
        source: input
        description: start instant of billing cycle 1; every later cycle abuts the previous one exactly
      - name: coaching_addon_enabled
        type: boolean
        source: input
        description: whether the nutrition-coaching add-on is purchased
        default: false
      - name: status
        type: enum
        source: system
        description: subscription lifecycle state
        default: ACTIVE
        constraints: "one of ACTIVE, PAUSED, CANCELLED"
      - name: coaching_credits_granted
        type: integer
        source: computed
        description: cumulative credits granted, COACHING_CREDITS_PER_CYCLE per opened cycle while the add-on is enabled
        default: 0
      - name: coaching_credits_reserved
        type: integer
        source: computed
        description: credits held by CoachingSessions in status SCHEDULED
        default: 0
      - name: coaching_credits_consumed
        type: integer
        source: computed
        description: credits burned by CoachingSessions in status COMPLETED
        default: 0
      - name: coaching_credits_forfeited
        type: integer
        source: computed
        description: credits lost to CoachingSessions in status FORFEITED
        default: 0
      - name: coaching_credits_available
        type: integer
        source: computed
        description: "granted minus reserved minus consumed minus forfeited (calculations.coaching_entitlement_balance, variant RESERVED_INCLUSIVE)"
        default: 0
      - name: paused_at
        type: datetime
        source: system
        description: clock value of the current pause, cleared on resume
        default: null
      - name: pause_days_used
        type: integer
        source: computed
        description: cumulative whole days spent paused; capped by PAUSE_MAX_DAYS
        default: 0
      - name: cycle_count
        type: integer
        source: computed
        description: how many BillingCycles have been opened for this subscription
        default: 0
  - name: BillingCycle
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: FK -> Subscription.id; the subscription this cycle bills
      - name: sequence_number
        type: integer
        source: computed
        description: 1-based ordinal of this cycle within the subscription
      - name: period_start_at
        type: datetime
        source: computed
        description: inclusive start of the 30-day billing window
      - name: period_end_at
        type: datetime
        source: computed
        description: exclusive end of the 30-day billing window; equals the next cycle's period_start_at exactly
      - name: status
        type: enum
        source: system
        description: cycle lifecycle state
        default: OPEN
        constraints: "one of OPEN, INVOICED, SETTLED, VOIDED"
      - name: charge_basis
        type: enum
        source: computed
        description: "which pricing reading produced medication_charge_cents (calculations.cycle_medication_charge)"
        default: null
        constraints: "null, or one of CASH_PAY, INSURANCE_ADJUDICATED"
      - name: medication_charge_cents
        type: integer
        source: computed
        description: patient-responsible drug cost for the cycle
        default: 0
      - name: coaching_addon_fee_cents
        type: integer
        source: computed
        description: COACHING_ADDON_FEE_CENTS when the add-on is enabled at invoice time, else 0
        default: 0
      - name: dispensing_fee_cents
        type: integer
        source: computed
        description: DISPENSING_FEE_CENTS unless waived by the subtotal threshold
        default: 0
      - name: adherence_credit_cents
        type: integer
        source: computed
        description: tiered credit earned from triaged check-ins inside the cycle window
        default: 0
      - name: total_due_cents
        type: integer
        source: computed
        description: "invoice total (calculations.cycle_invoice_total)"
        default: 0
      - name: settled_amount_cents
        type: integer
        source: computed
        description: amount actually collected; reset to 0 when a settled cycle is voided
        default: 0
      - name: proration_credit_cents
        type: integer
        source: computed
        description: "unused-days credit recorded when an invoiced cycle is voided by a pause or cancellation (calculations.subscription_proration_credit)"
        default: 0
      - name: coaching_unused_credit_cents
        type: integer
        source: computed
        description: "credit-back for unconsumed coaching credits applied at settle (calculations.coaching_entitlement_balance, variant COMPLETED_ONLY)"
        default: 0
      - name: invoiced_at
        type: datetime
        source: system
        description: clock value when the cycle was invoiced
        default: null
      - name: void_reason
        type: enum
        source: computed
        description: why the cycle was voided
        default: null
        constraints: "null, or one of ADMIN_REVERSAL, SUBSCRIPTION_PAUSED, SUBSCRIPTION_CANCELLED"

  - name: CheckIn
    parent: Prescription
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: FK -> Patient.id; the reporting patient
      - name: prescription_id
        type: string
        source: input
        description: FK -> Prescription.id; the prescription the symptoms relate to
      - name: triaged_by_provider_id
        type: string
        source: system
        description: FK -> Provider.id; the clinician who triaged this report
        default: null
      - name: nausea_score
        type: integer
        source: input
        description: patient-reported nausea intensity
        constraints: "integer between 0 and 3 inclusive"
      - name: vomiting_score
        type: integer
        source: input
        description: patient-reported vomiting intensity
        constraints: "integer between 0 and 3 inclusive"
      - name: dehydration_flag
        type: boolean
        source: input
        description: whether the patient reports signs of dehydration
        default: false
      - name: severity_score
        type: integer
        source: computed
        description: "weighted symptom score for this single report (calculations.side_effect_severity_index)"
        default: 0
      - name: status
        type: enum
        source: system
        description: check-in lifecycle state
        default: SUBMITTED
        constraints: "one of SUBMITTED, CLEARED, ESCALATED, RESOLVED"
      - name: submitted_at
        type: datetime
        source: system
        description: clock value when the report was filed; the window key for severity aggregation
      - name: triaged_at
        type: datetime
        source: system
        description: clock value when a clinician triaged the report
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: clock value when an escalation was closed
        default: null

  - name: CoachingSession
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: FK -> Subscription.id; the entitlement pool this session draws from
      - name: coach_provider_id
        type: string
        source: input
        description: FK -> Provider.id; the coach delivering the session
      - name: billing_cycle_id
        type: string
        source: computed
        description: FK -> BillingCycle.id; the cycle whose window contains scheduled_start_at, resolved at creation
      - name: scheduled_start_at
        type: datetime
        source: input
        description: inclusive start of the coaching slot
      - name: scheduled_end_at
        type: datetime
        source: input
        description: exclusive end of the coaching slot
        constraints: "must be strictly after scheduled_start_at"
      - name: status
        type: enum
        source: system
        description: session lifecycle state
        default: SCHEDULED
        constraints: "one of SCHEDULED, COMPLETED, CANCELLED, FORFEITED"
      - name: completed_at
        type: datetime
        source: system
        description: clock value when the coach marked the session delivered
        default: null

# ===========================================================================
# 1.2 State Machine Table
# ===========================================================================
state_machines:

  - entity: EligibilityScreening
    initial_state: DRAFT
    terminal_states: [ELIGIBLE, INELIGIBLE]
    transitions:
      - from: DRAFT
        to: ELIGIBLE
        trigger: "POST /glp1/screenings/{screening_id}/submit"
        actor: Provider
        preconditions:
          - "Patient referenced by patient_id exists"
          - "clock minus lab_collected_at is strictly less than LAB_VALIDITY_DAYS (90) days"
          - "egfr >= EGFR_EXCLUSION_MIN (30.0)"
          - "assessed_bmi >= BMI_OBESITY_MIN (30.0), or assessed_bmi >= BMI_COMORBID_MIN (27.0) with comorbidity_count >= COMORBIDITY_MIN_COUNT (1)"
        side_effects:
          - "sets assessed_bmi from recorded_weight_kg and recorded_height_cm per calculations.eligibility_bmi_assessment variant SCREENING_SNAPSHOT"
          - "sets comorbidity_count to the length of Patient.comorbidity_codes"
          - "sets eligibility_band to OBESITY when assessed_bmi >= 30.0, otherwise COMORBID"
          - "sets decision_reason to BMI_QUALIFIED or COMORBID_QUALIFIED accordingly"
          - "sets submitted_at to the clock and increments submit_count by 1"
          - "sets Patient.eligibility_status to ELIGIBLE and increments Patient.version by 1"
      - from: DRAFT
        to: INELIGIBLE
        trigger: "POST /glp1/screenings/{screening_id}/submit"
        actor: Provider
        preconditions:
          - "clock minus lab_collected_at is strictly less than LAB_VALIDITY_DAYS (90) days"
          - "egfr < EGFR_EXCLUSION_MIN (30.0), or the BMI band test fails"
        side_effects:
          - "sets assessed_bmi, comorbidity_count, submitted_at, and increments submit_count by 1"
          - "sets eligibility_band to NONE"
          - "sets decision_reason to RENAL_EXCLUSION when egfr < 30.0, else BMI_BELOW_BAND"
          - "sets Patient.eligibility_status to INELIGIBLE and increments Patient.version by 1"
        note: "the renal exclusion is evaluated before the BMI band, so a patient failing both reports RENAL_EXCLUSION"
      - from: DRAFT
        to: DEFERRED
        trigger: "POST /glp1/screenings/{screening_id}/submit"
        actor: Provider
        preconditions:
          - "clock minus lab_collected_at is greater than or equal to LAB_VALIDITY_DAYS (90) days"
        side_effects:
          - "sets decision_reason to STALE_LABS, leaves assessed_bmi and eligibility_band null"
          - "sets submitted_at to the clock and increments submit_count by 1"
          - "sets Patient.eligibility_status to DEFERRED and increments Patient.version by 1"
      - from: DEFERRED
        to: ELIGIBLE
        trigger: "POST /glp1/screenings/{screening_id}/submit"
        actor: Provider
        preconditions:
          - "the submit body carries a fresh lab_collected_at within LAB_VALIDITY_DAYS (90) days of the clock"
          - "egfr >= EGFR_EXCLUSION_MIN (30.0) and the BMI band test passes"
        side_effects:
          - "overwrites egfr, a1c_pct, lab_collected_at and recorded_weight_kg from the submit body"
          - "same assessment side effects as the DRAFT to ELIGIBLE transition; increments submit_count by 1"
        note: "cyclic re-screen path; a DEFERRED screening may be resubmitted any number of times"
      - from: DEFERRED
        to: DEFERRED
        trigger: "POST /glp1/screenings/{screening_id}/submit"
        actor: Provider
        preconditions:
          - "the submit body still carries a lab_collected_at at least LAB_VALIDITY_DAYS (90) days old"
        side_effects:
          - "increments submit_count by 1 and refreshes submitted_at; status and decision_reason stay STALE_LABS"
      - from: DEFERRED
        to: INELIGIBLE
        trigger: "POST /glp1/screenings/{screening_id}/submit"
        actor: Provider
        preconditions:
          - "fresh labs supplied but egfr < 30.0 or the BMI band test fails"
        side_effects:
          - "same side effects as the DRAFT to INELIGIBLE transition; increments submit_count by 1"
  - entity: Consult
    initial_state: SCHEDULED
    terminal_states: [COMPLETED_PRESCRIBED, COMPLETED_DECLINED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED_PRESCRIBED
        trigger: "POST /glp1/consults/{consult_id}/complete with outcome PRESCRIBE"
        actor: Provider
        preconditions:
          - "acting Provider.id equals Consult.provider_id"
          - "Patient.eligibility_status is ELIGIBLE"
        side_effects:
          - "records outcome_note"
          - "releases the provider slot so later Consults may occupy the same window"
      - from: SCHEDULED
        to: COMPLETED_DECLINED
        trigger: "POST /glp1/consults/{consult_id}/complete with outcome DECLINE"
        actor: Provider
        preconditions:
          - "acting Provider.id equals Consult.provider_id"
        side_effects:
          - "records outcome_note; no Prescription may cite this consult"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /glp1/consults/{consult_id}/complete with outcome NO_SHOW"
        actor: Provider
        preconditions:
          - "acting Provider.id equals Consult.provider_id"
        side_effects:
          - "releases the provider slot immediately"
      - from: NO_SHOW
        to: SCHEDULED
        trigger: "POST /glp1/consults/{consult_id}/reschedule"
        actor: Patient
        preconditions:
          - "the new window passes the CONSULT_BUFFER_MINUTES (15) overlap test against every other SCHEDULED Consult of the same provider_id"
        side_effects:
          - "overwrites scheduled_start_at and scheduled_end_at and increments reschedule_count by 1"
        note: "cyclic path; a consult may bounce between SCHEDULED and NO_SHOW without limit"

  - entity: Prescription
    initial_state: "ACTIVE / UNROUTED"
    terminal_states: [DISCONTINUED]
    transitions:
      - from: "clinical ACTIVE"
        to: "clinical HELD"
        trigger: "system, cascaded from POST /glp1/check-ins/{check_in_id}/triage when the triaged severity_score reaches CHECK_IN_HOLD_SCORE (9)"
        actor: system
        preconditions:
          - "clinical_status is ACTIVE"
          - "the triaged CheckIn's severity_score is at least CHECK_IN_HOLD_SCORE (9); a score of 7 or 8 escalates the check-in without touching the prescription"
        side_effects:
          - "sets clinical_status to HELD"
          - "CASCADE hop 2 of 5: the prescription's TitrationStep in status DUE moves to HELD with hold_reason SIDE_EFFECT"
      - from: "clinical HELD"
        to: "clinical ACTIVE"
        trigger: "system, cascaded from POST /glp1/check-ins/{check_in_id}/resolve"
        actor: system
        preconditions:
          - "clinical_status is HELD and no other CheckIn for this prescription is in status ESCALATED"
        side_effects:
          - "sets clinical_status to ACTIVE"
          - "CASCADE hop 3 of 3: the prescription's TitrationStep in status HELD returns to DUE and hold_reason is cleared"
      - from: "clinical ACTIVE or HELD"
        to: "clinical DISCONTINUED"
        trigger: "POST /glp1/prescriptions/{prescription_id}/discontinue"
        actor: Provider
        preconditions:
          - "clinical_status is not already DISCONTINUED"
        side_effects:
          - "sets discontinue_reason from the request body"
          - "every PharmacyOrder for this prescription in status CREATED or RESERVED is cancelled with cancel_reason CLINICAL_HOLD"
          - "every TitrationStep in status DUE or HELD moves to REDUCED with administered_at set to the clock"
      - from: "clinical ACTIVE"
        to: "clinical DISCONTINUED"
        trigger: "system, cascaded from POST /glp1/prescriptions when a newer prescription supersedes this one"
        actor: system
        preconditions:
          - "the superseding prescription cites the same patient_id"
        side_effects:
          - "sets discontinue_reason to SUPERSEDED"
          - "sets the new prescription's supersedes_prescription_id to this prescription's id"
          - "cancels this prescription's PharmacyOrders in status CREATED or RESERVED with cancel_reason CLINICAL_HOLD"
      - from: "fulfillment UNROUTED"
        to: "fulfillment ROUTED"
        trigger: "POST /glp1/pharmacy-orders"
        actor: Provider
        preconditions:
          - "clinical_status is ACTIVE"
          - "the routing selector resolves a non-empty candidate lot set"
        side_effects:
          - "sets fulfillment_status to ROUTED"
          - "increments Prescription.version by 1"
        note: "the fulfilment axis advances independently of the clinical axis; a HELD prescription keeps its fulfilment value. Creating a further PharmacyOrder while fulfillment_status is already ROUTED leaves the axis at ROUTED and is NOT a state error, so one titration rung may carry several open orders against different lots or windows."
      - from: "fulfillment ROUTED"
        to: "fulfillment DISPENSED"
        trigger: "POST /glp1/pharmacy-orders/{pharmacy_order_id}/ship"
        actor: PharmacyOperator
        preconditions:
          - "the order is in status RESERVED"
        side_effects:
          - "sets fulfillment_status to DISPENSED"
      - from: "fulfillment DISPENSED"
        to: "fulfillment REFILL_DUE"
        trigger: "POST /glp1/prescriptions/{prescription_id}/request-refill"
        actor: Patient
        preconditions:
          - "fulfillment_status is DISPENSED"
          - "clinical_status is ACTIVE"
        side_effects:
          - "sets fulfillment_status to REFILL_DUE"
      - from: "fulfillment REFILL_DUE"
        to: "fulfillment ROUTED"
        trigger: "POST /glp1/pharmacy-orders"
        actor: Provider
        preconditions:
          - "clinical_status is ACTIVE"
        side_effects:
          - "sets fulfillment_status back to ROUTED, closing the refill loop"

  - entity: TitrationStep
    initial_state: DUE
    terminal_states: [ADMINISTERED, REDUCED]
    transitions:
      - from: DUE
        to: ADMINISTERED
        trigger: "POST /glp1/titration-steps/{titration_step_id}/escalate"
        actor: Provider
        preconditions:
          - "Prescription.clinical_status is ACTIVE"
          - "no CheckIn for the prescription is in status ESCALATED"
          - "clock minus Prescription.last_dose_change_at in whole days >= the required interval from calculations.titration_readiness_interval"
          - "Prescription.dose_level < TITRATION_MAX_DOSE_LEVEL (5)"
          - "when the target dose_level >= TITRATION_SECOND_SIGNER_MIN_LEVEL (4), second_signer_provider_id is present, references a Provider with provider_type CLINICIAN, and differs from Prescription.prescriber_provider_id"
        side_effects:
          - "sets administered_at to the clock and records second_signer_provider_id when supplied"
          - "increments Prescription.dose_level by 1, recomputes Prescription.dose_mg, sets Prescription.last_dose_change_at to the clock"
          - "recomputes BOTH Prescription.severity_index_rolling and Prescription.severity_index_since_dose_change against the current clock; the since-dose-change index resets to 0 because its window baseline moved to now"
          - "creates the next TitrationStep in status DUE with step_number incremented and earliest_escalation_at set to the clock plus TITRATION_MIN_INTERVAL_DAYS (28) days"
      - from: DUE
        to: HELD
        trigger: "POST /glp1/titration-steps/{titration_step_id}/hold"
        actor: Provider
        preconditions:
          - "Prescription.clinical_status is ACTIVE or HELD"
        side_effects:
          - "sets hold_reason to PROVIDER_HOLD"
          - "no dose_level change and no new step is created"
      - from: DUE
        to: HELD
        trigger: "system, cascaded from a Prescription clinical hold"
        actor: system
        preconditions:
          - "the parent Prescription just moved to clinical_status HELD"
        side_effects:
          - "sets hold_reason to SIDE_EFFECT"
          - "CASCADE hop 3 of 5: every PharmacyOrder citing this titration_step_id in status CREATED or RESERVED is cancelled with cancel_reason CLINICAL_HOLD"
      - from: DUE
        to: REDUCED
        trigger: "POST /glp1/titration-steps/{titration_step_id}/reduce"
        actor: Provider
        preconditions:
          - "Prescription.clinical_status is ACTIVE or HELD"
          - "Prescription.dose_level > 1"
        side_effects:
          - "sets administered_at to the clock"
          - "decrements Prescription.dose_level by 1, recomputes Prescription.dose_mg, sets Prescription.last_dose_change_at to the clock"
          - "creates the next TitrationStep in status DUE at the reduced dose_level with earliest_escalation_at set to the clock plus 28 days"
        note: "branch three of the fork; unlike escalate it requires no second signer and no interval wait"
      - from: HELD
        to: DUE
        trigger: "system, cascaded from POST /glp1/check-ins/{check_in_id}/resolve"
        actor: system
        preconditions:
          - "hold_reason is SIDE_EFFECT and the parent Prescription just returned to clinical_status ACTIVE"
        side_effects:
          - "clears hold_reason; earliest_escalation_at is left unchanged"
      - from: HELD
        to: REDUCED
        trigger: "POST /glp1/titration-steps/{titration_step_id}/reduce"
        actor: Provider
        preconditions:
          - "Prescription.dose_level > 1"
        side_effects:
          - "same side effects as the DUE to REDUCED transition"
  - entity: PriorAuthorization
    initial_state: SUBMITTED
    terminal_states: [APPROVED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /glp1/prior-authorizations/{prior_authorization_id}/decide with decision APPROVED"
        actor: BillingAdmin
        preconditions:
          - "Prescription.clinical_status is ACTIVE or HELD"
        side_effects:
          - "sets decided_at to the clock and approved_through_at to the clock plus PA_VALIDITY_DAYS (180) days"
          - "sets Prescription.active_route_mode to INSURANCE and increments Prescription.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /glp1/prior-authorizations/{prior_authorization_id}/decide with decision DENIED"
        actor: BillingAdmin
        preconditions:
          - "Prescription.clinical_status is ACTIVE or HELD"
        side_effects:
          - "sets decided_at to the clock and records denial_reason"
          - "CASCADE hop 2 of 3: sets Prescription.active_route_mode to CASH and increments Prescription.version by 1"
          - "CASCADE hop 3 of 3: every PharmacyOrder for this prescription whose dispense_type_at_route is BRANDED and whose status is CREATED or RESERVED is cancelled with cancel_reason PA_DENIED, which in turn returns its held units to SupplyLot.available_units"
      - from: DENIED
        to: APPEALED
        trigger: "POST /glp1/prior-authorizations/{prior_authorization_id}/appeal"
        actor: Provider
        preconditions:
          - "appeal_count < MAX_PA_APPEALS (2)"
        side_effects:
          - "increments appeal_count by 1 and clears decided_at and denial_reason"
      - from: APPEALED
        to: APPROVED
        trigger: "POST /glp1/prior-authorizations/{prior_authorization_id}/decide with decision APPROVED"
        actor: BillingAdmin
        preconditions:
          - "Prescription.clinical_status is ACTIVE or HELD"
        side_effects:
          - "same side effects as SUBMITTED to APPROVED"
      - from: APPEALED
        to: DENIED
        trigger: "POST /glp1/prior-authorizations/{prior_authorization_id}/decide with decision DENIED"
        actor: BillingAdmin
        preconditions:
          - "Prescription.clinical_status is ACTIVE or HELD"
        side_effects:
          - "same side effects as SUBMITTED to DENIED"
        note: "cyclic path DENIED to APPEALED to DENIED, bounded by MAX_PA_APPEALS (2)"

  - entity: PharmacyOrder
    initial_state: CREATED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: CREATED
        to: RESERVED
        trigger: "POST /glp1/pharmacy-orders/{pharmacy_order_id}/reserve"
        actor: PharmacyOperator
        preconditions:
          - "acting Pharmacy.id equals PharmacyOrder.pharmacy_id"
          - "Prescription.clinical_status is ACTIVE"
          - "SupplyLot.available_units >= units_requested"
          - "the windowed aggregate test passes: units_requested plus the sum of units_requested over other PharmacyOrders on the same supply_lot_id in status RESERVED whose window overlaps this order's window is <= SupplyLot.window_capacity_units"
        side_effects:
          - "sets reserved_at to the clock"
          - "decrements SupplyLot.available_units and increments SupplyLot.reserved_units by units_requested, leaving total_units unchanged (INV-1)"
      - from: RESERVED
        to: SHIPPED
        trigger: "POST /glp1/pharmacy-orders/{pharmacy_order_id}/ship"
        actor: PharmacyOperator
        preconditions:
          - "acting Pharmacy.id equals PharmacyOrder.pharmacy_id"
          - "Prescription.clinical_status is ACTIVE"
          - "when dispense_type_at_route is BRANDED and Prescription.active_route_mode is INSURANCE, a PriorAuthorization for the prescription is in status APPROVED with approved_through_at at or after the clock"
        side_effects:
          - "sets shipped_at to the clock"
          - "decrements SupplyLot.reserved_units and increments SupplyLot.dispensed_units by units_requested (INV-1 holds)"
          - "sets Prescription.fulfillment_status to DISPENSED"
      - from: CREATED
        to: CANCELLED
        trigger: "POST /glp1/pharmacy-orders/{pharmacy_order_id}/cancel, or system cascade from a PA denial, a clinical hold, or a discontinuation"
        actor: PharmacyOperator
        preconditions:
          - "status is CREATED"
        side_effects:
          - "sets cancel_reason to OPERATOR for the endpoint path, PA_DENIED or CLINICAL_HOLD for the cascade paths"
          - "no SupplyLot counters change because nothing was held yet (INV-1 holds trivially)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /glp1/pharmacy-orders/{pharmacy_order_id}/cancel, or system cascade from a PA denial, a clinical hold, or a discontinuation"
        actor: PharmacyOperator
        preconditions:
          - "status is RESERVED"
        side_effects:
          - "increments SupplyLot.available_units and decrements SupplyLot.reserved_units by units_requested, restoring the pre-reserve split exactly (INV-1 compensating pair)"
          - "sets Prescription.fulfillment_status back to UNROUTED when no other PharmacyOrder for the prescription is in status CREATED or RESERVED"

  - entity: Subscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /glp1/subscriptions/{subscription_id}/pause"
        actor: BillingAdmin
        preconditions:
          - "pause_days_used < PAUSE_MAX_DAYS (60)"
        side_effects:
          - "sets paused_at to the clock"
          - "CASCADE hop 2 of 3: the BillingCycle in status OPEN or INVOICED moves to VOIDED with void_reason SUBSCRIPTION_PAUSED; when it was INVOICED its proration_credit_cents is computed per calculations.subscription_proration_credit"
          - "CASCADE hop 3 of 3: every CoachingSession citing that voided billing_cycle_id in status SCHEDULED moves to FORFEITED, which moves its credit from coaching_credits_reserved to coaching_credits_forfeited (INV-2 holds)"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /glp1/subscriptions/{subscription_id}/resume"
        actor: BillingAdmin
        preconditions:
          - "status is PAUSED"
        side_effects:
          - "adds the whole days between paused_at and the clock to pause_days_used and clears paused_at"
          - "opens a new BillingCycle with period_start_at equal to the clock, period_end_at 30 days later, sequence_number equal to cycle_count plus 1, and increments cycle_count"
          - "grants COACHING_CREDITS_PER_CYCLE (4) credits when coaching_addon_enabled is true"
        note: "cyclic path; a subscription may pause and resume repeatedly until pause_days_used reaches 60"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /glp1/subscriptions/{subscription_id}/cancel"
        actor: Patient
        preconditions:
          - "status is ACTIVE or PAUSED"
        side_effects:
          - "CASCADE hop 2 of 3: the BillingCycle in status OPEN or INVOICED moves to VOIDED with void_reason SUBSCRIPTION_CANCELLED and proration_credit_cents computed when it was INVOICED"
          - "CASCADE hop 3 of 3: every CoachingSession citing that voided billing_cycle_id in status SCHEDULED moves to FORFEITED"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /glp1/subscriptions/{subscription_id}/cancel"
        actor: Patient
        preconditions:
          - "status is PAUSED"
        side_effects:
          - "no cycle exists in OPEN or INVOICED after a pause, so only status and updated_at change"

  - entity: BillingCycle
    initial_state: OPEN
    terminal_states: [VOIDED]
    transitions:
      - from: OPEN
        to: INVOICED
        trigger: "POST /glp1/billing-cycles/{billing_cycle_id}/invoice"
        actor: BillingAdmin
        preconditions:
          - "Subscription.status is ACTIVE"
          - "the clock is at or after period_start_at"
        side_effects:
          - "computes charge_basis, medication_charge_cents, coaching_addon_fee_cents, dispensing_fee_cents, adherence_credit_cents and total_due_cents per calculations.cycle_medication_charge and calculations.cycle_invoice_total"
          - "sets invoiced_at to the clock"
      - from: INVOICED
        to: SETTLED
        trigger: "POST /glp1/billing-cycles/{billing_cycle_id}/settle"
        actor: BillingAdmin
        preconditions:
          - "Subscription.status is ACTIVE"
        side_effects:
          - "computes coaching_unused_credit_cents per calculations.coaching_entitlement_balance variant COMPLETED_ONLY"
          - "sets settled_amount_cents to max(0, total_due_cents minus coaching_unused_credit_cents)"
          - "adds settled_amount_cents to Patient.lifetime_charged_cents (INV-3 forward leg)"
          - "opens the next BillingCycle with period_start_at exactly equal to this cycle's period_end_at, increments Subscription.cycle_count, and grants COACHING_CREDITS_PER_CYCLE (4) credits when coaching_addon_enabled is true"
      - from: SETTLED
        to: VOIDED
        trigger: "POST /glp1/billing-cycles/{billing_cycle_id}/void with void_reason ADMIN_REVERSAL"
        actor: BillingAdmin
        preconditions:
          - "status is SETTLED"
        side_effects:
          - "adds the pre-void settled_amount_cents to Patient.lifetime_credited_cents, then sets settled_amount_cents to 0 (INV-3 compensating leg)"
          - "sets void_reason to ADMIN_REVERSAL"
      - from: OPEN
        to: VOIDED
        trigger: "POST /glp1/billing-cycles/{billing_cycle_id}/void, or system cascade from a subscription pause or cancellation"
        actor: BillingAdmin
        preconditions:
          - "status is OPEN"
        side_effects:
          - "leaves proration_credit_cents at 0 because nothing was invoiced"
          - "sets void_reason to ADMIN_REVERSAL, SUBSCRIPTION_PAUSED or SUBSCRIPTION_CANCELLED depending on the trigger"
      - from: INVOICED
        to: VOIDED
        trigger: "POST /glp1/billing-cycles/{billing_cycle_id}/void, or system cascade from a subscription pause or cancellation"
        actor: BillingAdmin
        preconditions:
          - "status is INVOICED"
        side_effects:
          - "computes proration_credit_cents per calculations.subscription_proration_credit using the clock as the stop instant"
          - "sets void_reason accordingly; Patient.lifetime_charged_cents and Patient.lifetime_credited_cents are untouched because nothing was collected"

  - entity: CheckIn
    initial_state: SUBMITTED
    terminal_states: [CLEARED, RESOLVED]
    transitions:
      - from: SUBMITTED
        to: CLEARED
        trigger: "POST /glp1/check-ins/{check_in_id}/triage"
        actor: Provider
        preconditions:
          - "severity_score < CHECK_IN_ESCALATION_SCORE (7)"
        side_effects:
          - "sets triaged_at to the clock and triaged_by_provider_id to the acting provider"
          - "recomputes Prescription.severity_index_rolling and Prescription.severity_index_since_dose_change"
          - "counts toward the cycle's adherence tier"
      - from: SUBMITTED
        to: ESCALATED
        trigger: "POST /glp1/check-ins/{check_in_id}/triage"
        actor: Provider
        preconditions:
          - "severity_score >= CHECK_IN_ESCALATION_SCORE (7)"
        side_effects:
          - "sets triaged_at to the clock and triaged_by_provider_id to the acting provider"
          - "recomputes both severity indices on the Prescription"
          - "when severity_score >= CHECK_IN_HOLD_SCORE (9) only, CASCADE hop 1 of 5 fires: the Prescription moves from clinical_status ACTIVE to HELD, which holds its DUE TitrationStep, which cancels that step's open PharmacyOrders, which releases their units on the SupplyLot"
          - "when severity_score is 7 or 8 the flag is raised but no cascade fires, so the prescription stays ACTIVE while an ESCALATED check-in remains open"
          - "counts toward the cycle's adherence tier"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /glp1/check-ins/{check_in_id}/resolve"
        actor: Provider
        preconditions:
          - "status is ESCALATED"
        side_effects:
          - "sets resolved_at to the clock"
          - "CASCADE hop 1 of 3: when no other CheckIn for the prescription remains ESCALATED, the Prescription returns to clinical_status ACTIVE, which returns its HELD TitrationStep to DUE"

  - entity: CoachingSession
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, FORFEITED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /glp1/coaching-sessions/{coaching_session_id}/complete"
        actor: Coach
        preconditions:
          - "acting Provider.id equals coach_provider_id"
          - "Subscription.status is ACTIVE"
        side_effects:
          - "sets completed_at to the clock"
          - "decrements Subscription.coaching_credits_reserved and increments Subscription.coaching_credits_consumed by 1 (INV-2 holds)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /glp1/coaching-sessions/{coaching_session_id}/cancel"
        actor: Patient
        preconditions:
          - "status is SCHEDULED"
        side_effects:
          - "decrements Subscription.coaching_credits_reserved and increments Subscription.coaching_credits_available by 1, restoring the pre-booking split exactly (INV-2 compensating pair)"
      - from: SCHEDULED
        to: FORFEITED
        trigger: "system, cascaded from a BillingCycle void caused by a subscription pause or cancellation"
        actor: system
        preconditions:
          - "the session's billing_cycle_id names the cycle that just moved to VOIDED"
        side_effects:
          - "decrements Subscription.coaching_credits_reserved and increments Subscription.coaching_credits_forfeited by 1 (INV-2 holds, availability is not restored)"

# ===========================================================================
# 1.2.1 Concurrency Rules
# ===========================================================================
concurrency_rules:
  - rule_id: prescription-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /glp1/prescriptions"
    occ_field: "expected_patient_version"
    description: |
      Creating a Prescription for a patient whose version has advanced since the client
      last read it is rejected. A new prescription legitimately supersedes the patient's
      standing ACTIVE prescription, so the server cannot distinguish a deliberate
      replacement from a writer acting on a stale view of the chart; the version check
      makes the caller prove it saw the current chart, including any vitals update or
      screening decision that has since landed.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

  - rule_id: pharmacy-order-create-stale-prescription
    parent_entity: Prescription
    write_endpoint: "POST /glp1/pharmacy-orders"
    occ_field: "expected_prescription_version"
    description: |
      Creating a PharmacyOrder against a Prescription whose version has advanced since
      the client last read it is rejected. Routing decisions read active_route_mode,
      dose_mg and dose_level, all of which move when a prior authorisation is decided or
      a titration rung is escalated; a caller holding an older version would route on a
      superseded dose or pricing fork.
    error_id: ERR_STALE_PRESCRIPTION_VERSION
    http_status: 412

# ===========================================================================
# 1.3 Calculation Rules Table
# ===========================================================================
calculations:

  - name: eligibility_bmi_assessment
    trigger: "on POST /glp1/patients and PATCH /glp1/patients/{patient_id}/vitals for the CURRENT_RECHECK variant; on POST /glp1/screenings/{screening_id}/submit for the SCREENING_SNAPSHOT variant"
    algorithm: threshold
    formula: |
      bmi(weight_kg, height_cm):
          meters = height_cm / 100
          raw    = weight_kg / (meters * meters)
          return round_half_up(raw, 1)          # exactly one decimal place

      band(bmi, comorbidity_count):
          if bmi >= BMI_OBESITY_MIN:                                      -> "OBESITY"
          elif bmi >= BMI_COMORBID_MIN and comorbidity_count >= COMORBIDITY_MIN_COUNT: -> "COMORBID"
          else:                                                           -> "NONE"

      screening_decision(egfr, lab_age_days, bmi, comorbidity_count):
          # evaluation order is pinned and total; the first matching clause wins
          1. if lab_age_days >= LAB_VALIDITY_DAYS         -> status DEFERRED,   reason STALE_LABS
          2. elif egfr < EGFR_EXCLUSION_MIN               -> status INELIGIBLE, reason RENAL_EXCLUSION
          3. elif band == "OBESITY"                       -> status ELIGIBLE,   reason BMI_QUALIFIED
          4. elif band == "COMORBID"                      -> status ELIGIBLE,   reason COMORBID_QUALIFIED
          5. else                                         -> status INELIGIBLE, reason BMI_BELOW_BAND

      lab_age_days = floor((clock - lab_collected_at) / 86400 seconds)
    input_set: "comorbidity_count is the length of Patient.comorbidity_codes read at submit time; the clock is the logical clock, defaulting to 2026-05-01T00:00:00Z"
    constants:
      BMI_OBESITY_MIN: 30.0
      BMI_COMORBID_MIN: 27.0
      COMORBIDITY_MIN_COUNT: 1
      EGFR_EXCLUSION_MIN: 30.0
      LAB_VALIDITY_DAYS: 90
    precision: "BMI rounded to 1 decimal place, round_half_up; comparisons use the rounded value"
    variants:
      - name: SCREENING_SNAPSHOT
        when: "written to EligibilityScreening.assessed_bmi at submit and frozen thereafter"
        difference: "uses EligibilityScreening.recorded_weight_kg and EligibilityScreening.recorded_height_cm, the values captured when the screening row was created; later weight changes never move it"
      - name: CURRENT_RECHECK
        when: "written to Patient.current_bmi on patient creation and on every vitals update"
        difference: "uses the live Patient.weight_kg and Patient.height_cm, so it drifts away from the frozen screening value as the patient loses or gains weight"
    note: "the prescription eligibility gate reads the FROZEN screening band only; Patient.current_bmi never gates anything, which is exactly why the two readings can disagree without blocking care"

  - name: dose_schedule_lookup
    trigger: "on Prescription creation, on titration escalate, and on titration reduce"
    algorithm: constraint_propagation
    formula: |
      dose_mg = DOSE_MG_BY_FAMILY_AND_LEVEL[drug_family][dose_level]
      # the routing selector requires SupplyLot.strength_mg == dose_mg exactly
    input_set: "drug_family from the Prescription, dose_level from the Prescription after the transition has adjusted it"
    constants:
      DOSE_MG_BY_FAMILY_AND_LEVEL:
        SEMAGLUTIDE: { 1: 0.25, 2: 0.5, 3: 1.0, 4: 1.7, 5: 2.4 }
        TIRZEPATIDE: { 1: 2.5, 2: 5.0, 3: 7.5, 4: 12.5, 5: 15.0 }
      TITRATION_MAX_DOSE_LEVEL: 5
    precision: "exact table lookup, no rounding"

  - name: titration_readiness_interval
    trigger: "on POST /glp1/titration-steps/{titration_step_id}/escalate for the gate; on TitrationStep creation for the planning field"
    algorithm: threshold
    formula: |
      elapsed_days = floor((clock - Prescription.last_dose_change_at) / 86400 seconds)

      required_interval_days(severity_index_since_dose_change):
          if severity_index_since_dose_change >= TITRATION_TOLERABILITY_TRIGGER_INDEX:
              return TITRATION_EXTENDED_INTERVAL_DAYS
          else:
              return TITRATION_MIN_INTERVAL_DAYS

      ready = elapsed_days >= required_interval_days(...)     # >= , not >
    input_set: "Prescription.last_dose_change_at, which is set at prescription creation and reset on every dose_level change; Prescription.severity_index_since_dose_change"
    constants:
      TITRATION_MIN_INTERVAL_DAYS: 28
      TITRATION_EXTENDED_INTERVAL_DAYS: 42
      TITRATION_TOLERABILITY_TRIGGER_INDEX: 4
    precision: "whole days, floor division"
    variants:
      - name: INTERVAL_ONLY
        when: "written to TitrationStep.earliest_escalation_at when the step row is created"
        difference: "always adds TITRATION_MIN_INTERVAL_DAYS (28) days to the step's created_at, ignoring side-effect history entirely; it is a planning view, never a gate"
      - name: TOLERABILITY_ADJUSTED
        when: "evaluated inside the escalate precondition"
        difference: "stretches the requirement to TITRATION_EXTENDED_INTERVAL_DAYS (42) days whenever severity_index_since_dose_change has reached 4, so an escalate can be rejected on a date that earliest_escalation_at already permits"

  - name: side_effect_severity_index
    trigger: "on POST /glp1/check-ins to set CheckIn.severity_score; on POST /glp1/check-ins/{check_in_id}/triage to recompute both Prescription indices"
    algorithm: weighted_scoring
    formula: |
      severity_score(check_in) = check_in.nausea_score * NAUSEA_WEIGHT
                               + check_in.vomiting_score * VOMITING_WEIGHT
                               + (DEHYDRATION_WEIGHT if check_in.dehydration_flag else 0)
      # range 0 .. 13

      index(candidate_set):
          if candidate_set is empty: return 0
          return max(c.severity_score for c in candidate_set)

      escalates    = severity_score >= CHECK_IN_ESCALATION_SCORE   # >= , not >
      holds_script = severity_score >= CHECK_IN_HOLD_SCORE         # >= , not >
      # An escalation between 7 and 8 inclusive raises the flag WITHOUT freezing the
      # prescription; only a score of 9 or more fires the clinical-hold cascade.
    input_set: "CheckIns whose prescription_id matches and whose status is in {CLEARED, ESCALATED, RESOLVED}; a CheckIn still in SUBMITTED is excluded from both indices because it has not been triaged"
    constants:
      NAUSEA_WEIGHT: 1
      VOMITING_WEIGHT: 2
      DEHYDRATION_WEIGHT: 4
      CHECK_IN_ESCALATION_SCORE: 7
      CHECK_IN_HOLD_SCORE: 9
      SEVERITY_WINDOW_DAYS: 30
    precision: "integers only, no rounding"
    variants:
      - name: ROLLING_WINDOW
        when: "written to Prescription.severity_index_rolling"
        difference: "candidate set is restricted to CheckIns with submitted_at strictly after clock minus SEVERITY_WINDOW_DAYS (30) days and at or before the clock, regardless of dose history"
      - name: SINCE_LAST_DOSE_CHANGE
        when: "written to Prescription.severity_index_since_dose_change and read by titration_readiness_interval"
        difference: "candidate set is restricted to CheckIns with submitted_at at or after Prescription.last_dose_change_at, so a severe report that predates the most recent dose change is invisible to it while still dominating the rolling index"

  - name: cycle_medication_charge
    trigger: "on POST /glp1/billing-cycles/{billing_cycle_id}/invoice"
    algorithm: tiered_pricing
    formula: |
      unit_list_cents = UNIT_PRICE_BRANDED_CENTS if pharmacy_form == "BRANDED"
                        else UNIT_PRICE_COMPOUNDED_CENTS
      per_unit_cents  = round_half_up(unit_list_cents * DOSE_MULTIPLIER[Prescription.dose_level])
      gross_cents     = per_unit_cents * Prescription.units_per_cycle    # round per unit, THEN multiply

      # ---- variant CASH_PAY -------------------------------------------------
      cash_discount_cents = min(CASH_DISCOUNT_MAX_CENTS,
                                round_half_up(gross_cents * CASH_DISCOUNT_PCT))
      cash_due_cents      = gross_cents - cash_discount_cents

      # ---- variant INSURANCE_ADJUDICATED ------------------------------------
      allowed_cents  = min(gross_cents, PLAN_ALLOWED_CAP_CENTS)
      coins_cents    = round_half_up(max(0, allowed_cents - COPAY_CENTS) * COINSURANCE_PCT)
      insured_due    = min(COPAY_CENTS + coins_cents, OOP_MAX_PER_CYCLE_CENTS)

      # ---- fork selection (pinned) ------------------------------------------
      if Prescription.active_route_mode == "INSURANCE":
          charge_basis = "INSURANCE_ADJUDICATED";  medication_charge_cents = insured_due
      else:
          charge_basis = "CASH_PAY";               medication_charge_cents = cash_due_cents
    input_set: "pharmacy_form is Prescription.active_route_mode mapped to product form: INSURANCE routes BRANDED, CASH routes COMPOUNDED. active_route_mode is seeded from Patient.payment_mode at prescription creation, set to INSURANCE by a PA approval, and set to CASH by a PA denial"
    constants:
      UNIT_PRICE_COMPOUNDED_CENTS: 20000
      UNIT_PRICE_BRANDED_CENTS: 25000
      DOSE_MULTIPLIER: { 1: 1.00, 2: 1.00, 3: 1.25, 4: 1.25, 5: 1.50 }
      CASH_DISCOUNT_PCT: 0.15
      CASH_DISCOUNT_MAX_CENTS: 9000
      PLAN_ALLOWED_CAP_CENTS: 42000
      COPAY_CENTS: 3500
      COINSURANCE_PCT: 0.20
      OOP_MAX_PER_CYCLE_CENTS: 9000
    precision: "whole cents throughout, round_half_up; the per-unit price is rounded before it is multiplied by units_per_cycle, never after"
    variants:
      - name: CASH_PAY
        when: "Prescription.active_route_mode is CASH, which is the seeded value for a CASH patient and the value a denied prior authorisation forces on an INSURANCE patient"
        difference: "charges the full compounded list price less a percentage discount capped in absolute cents; no payer cap applies, so the number scales with dose_level and units_per_cycle"
      - name: INSURANCE_ADJUDICATED
        when: "Prescription.active_route_mode is INSURANCE, which requires an APPROVED PriorAuthorization"
        difference: "charges a flat copay plus coinsurance on the payer-allowed amount, which is itself capped at PLAN_ALLOWED_CAP_CENTS and then floored by the per-cycle out-of-pocket maximum, so the number is nearly insensitive to dose_level"

  - name: cycle_invoice_total
    trigger: "on POST /glp1/billing-cycles/{billing_cycle_id}/invoice, immediately after cycle_medication_charge"
    algorithm: waterfall_allocation
    formula: |
      # evaluation order is pinned; every step reads only values fixed by earlier steps
      step 1  medication_charge_cents  = cycle_medication_charge(...)
      step 2  coaching_addon_fee_cents = COACHING_ADDON_FEE_CENTS if Subscription.coaching_addon_enabled else 0
      step 3  subtotal_cents           = medication_charge_cents + coaching_addon_fee_cents
      step 4  dispensing_fee_cents     = 0 if subtotal_cents >= DISPENSING_FEE_WAIVER_SUBTOTAL_CENTS
                                        else DISPENSING_FEE_CENTS
      step 5  triaged_count            = number of CheckIns for Subscription.prescription_id whose
                                         status is CLEARED, ESCALATED or RESOLVED and whose
                                         triaged_at lies in [period_start_at, period_end_at)
              adherence_credit_cents   = 0    if triaged_count == 0
                                         1500 if 1 <= triaged_count <= 2
                                         3000 if triaged_count >= 3
      step 6  total_due_cents          = max(0, subtotal_cents + dispensing_fee_cents
                                                - adherence_credit_cents)
    input_set: "the waiver test in step 4 is evaluated against the subtotal EXCLUDING the dispensing fee, even though the fee is part of the invoice total the patient sees; this resolves the apparent circularity of a fee that is waived on the strength of a total it belongs to"
    constants:
      COACHING_ADDON_FEE_CENTS: 4900
      DISPENSING_FEE_CENTS: 2500
      DISPENSING_FEE_WAIVER_SUBTOTAL_CENTS: 36000
      ADHERENCE_CREDIT_TIER_0_CENTS: 0
      ADHERENCE_CREDIT_TIER_1_2_CENTS: 1500
      ADHERENCE_CREDIT_TIER_3_PLUS_CENTS: 3000
    precision: "whole cents; no rounding occurs in this calculation because every input is already an integer number of cents"

  - name: subscription_proration_credit
    trigger: "on a BillingCycle INVOICED to VOIDED transition, whether that void arrives from the endpoint or as a cascade of a subscription pause or cancellation"
    algorithm: chronological
    formula: |
      days_elapsed = floor((clock - period_start_at) / 86400 seconds)
      days_elapsed = min(max(days_elapsed, 0), CYCLE_LENGTH_DAYS)
      unused_days  = CYCLE_LENGTH_DAYS - days_elapsed

      # PINNED ORDER: round each charge component separately, THEN sum the rounded parts.
      # The rejected reading sums the components first and rounds once; on a 30-day cycle
      # the two readings differ by one cent whenever two components each land on .667.
      credit_medication = round_half_up(medication_charge_cents  * unused_days / CYCLE_LENGTH_DAYS)
      credit_coaching   = round_half_up(coaching_addon_fee_cents * unused_days / CYCLE_LENGTH_DAYS)
      credit_dispensing = round_half_up(dispensing_fee_cents     * unused_days / CYCLE_LENGTH_DAYS)

      proration_credit_cents = credit_medication + credit_coaching + credit_dispensing
    input_set: "only medication_charge_cents, coaching_addon_fee_cents and dispensing_fee_cents participate; adherence_credit_cents is already earned and is never prorated back"
    constants:
      CYCLE_LENGTH_DAYS: 30
    precision: "each component rounded to whole cents with round_half_up before summation; the sum is never rounded again"

  - name: coaching_entitlement_balance
    trigger: "on CoachingSession create, complete, cancel and forfeit for the RESERVED_INCLUSIVE variant; on POST /glp1/billing-cycles/{billing_cycle_id}/settle for the COMPLETED_ONLY variant"
    algorithm: aggregation
    formula: |
      # ---- variant RESERVED_INCLUSIVE (the booking gate) --------------------
      coaching_credits_available = coaching_credits_granted
                                 - coaching_credits_reserved
                                 - coaching_credits_consumed
                                 - coaching_credits_forfeited
      booking allowed only while coaching_credits_available >= 1

      # ---- variant COMPLETED_ONLY (the settle credit-back) ------------------
      unused_for_refund       = max(0, coaching_credits_granted - coaching_credits_consumed)
      coaching_unused_credit_cents = min(unused_for_refund * COACHING_CREDIT_REFUND_CENTS,
                                         COACHING_ADDON_FEE_CENTS)
    input_set: "counters are maintained incrementally on the Subscription row; granted rises by COACHING_CREDITS_PER_CYCLE each time a cycle opens while coaching_addon_enabled is true"
    constants:
      COACHING_CREDITS_PER_CYCLE: 4
      COACHING_CREDIT_REFUND_CENTS: 1000
      COACHING_ADDON_FEE_CENTS: 4900
    precision: "integer credits; cents rounded not at all because the refund rate is a whole number of cents"
    variants:
      - name: RESERVED_INCLUSIVE
        when: "evaluated whenever a CoachingSession is booked, to decide whether the patient still has entitlement"
        difference: "treats a SCHEDULED session as already spent, so a patient with four granted credits and one scheduled session sees three available"
      - name: COMPLETED_ONLY
        when: "evaluated at settle, to decide how much of the add-on fee is credited back"
        difference: "ignores reservations entirely and refunds on granted minus consumed, so the same patient is refunded for three unused credits even though one of them is already committed to a scheduled session"

  - name: supply_lot_routing_selection
    trigger: "on POST /glp1/pharmacy-orders, before the PharmacyOrder row is written"
    algorithm: topological
    formula: |
      required_form = "BRANDED" if Prescription.active_route_mode == "INSURANCE" else "COMPOUNDED"

      candidates = every SupplyLot L such that
          L.status == "RELEASED"
        AND L.strength_mg == Prescription.dose_mg
        AND L.available_units >= request.units_requested
        AND L.expires_at >= clock + LOT_MIN_SHELF_LIFE_DAYS days
        AND Pharmacy(L.pharmacy_id).status == "ACTIVE"
        AND Pharmacy(L.pharmacy_id).dispense_type == required_form
        AND Patient.state_code is a member of Pharmacy(L.pharmacy_id).served_state_codes

      ranking: 1) L.expires_at ASC        (first-expiring, first-out)
               2) L.available_units DESC  (break ties toward the deepest lot)
               3) L.created_at ASC        (final deterministic tie-break; L.id is never consulted)

      empty candidate set -> reject the request with ERR_NO_ELIGIBLE_SUPPLY_LOT
    input_set: "all SupplyLots in the system; no per-pharmacy pre-filter beyond the predicates above"
    constants:
      LOT_MIN_SHELF_LIFE_DAYS: 30
    precision: "exact comparisons; expires_at is compared as an instant, not truncated to a date"
    note: "the selected lot fixes PharmacyOrder.pharmacy_id, PharmacyOrder.supply_lot_id and PharmacyOrder.dispense_type_at_route for the life of the order; a later PA denial does not re-route it, it cancels it"

# ===========================================================================
# Conservation invariants (named quantities that compensating pairs must preserve)
# ===========================================================================
invariants:
  - id: INV-1
    name: supply_lot_unit_conservation
    quantity: "SupplyLot.total_units"
    formula: "SupplyLot.total_units == SupplyLot.available_units + SupplyLot.reserved_units + SupplyLot.dispensed_units"
    forward_action: "POST /glp1/pharmacy-orders/{pharmacy_order_id}/reserve moves units_requested from available_units to reserved_units"
    compensating_action: "POST /glp1/pharmacy-orders/{pharmacy_order_id}/cancel from RESERVED moves the same units back from reserved_units to available_units"
    note: "the identity must hold at every observable point, and after the compensating pair the individual components must equal their pre-forward values, not merely satisfy the sum"

  - id: INV-2
    name: coaching_credit_conservation
    quantity: "Subscription.coaching_credits_granted"
    formula: "Subscription.coaching_credits_granted == Subscription.coaching_credits_available + Subscription.coaching_credits_reserved + Subscription.coaching_credits_consumed + Subscription.coaching_credits_forfeited"
    forward_action: "POST /glp1/coaching-sessions moves one credit from available to reserved"
    compensating_action: "POST /glp1/coaching-sessions/{coaching_session_id}/cancel moves that credit from reserved back to available"
    note: "a forfeit is NOT a compensating action; it moves the credit from reserved to forfeited, preserving the sum while permanently reducing availability"

  - id: INV-3
    name: patient_billing_conservation
    quantity: "net collected cash"
    formula: "Patient.lifetime_charged_cents - Patient.lifetime_credited_cents == sum of BillingCycle.settled_amount_cents over that patient's cycles whose status is SETTLED"
    forward_action: "POST /glp1/billing-cycles/{billing_cycle_id}/settle adds settled_amount_cents to lifetime_charged_cents"
    compensating_action: "POST /glp1/billing-cycles/{billing_cycle_id}/void from SETTLED adds the same amount to lifetime_credited_cents and zeroes settled_amount_cents"
    note: "voids of OPEN or INVOICED cycles touch neither lifetime counter, so the identity is preserved across the pause and cancellation cascades as well"

# ===========================================================================
# 1.4 Validation Rules Table (evaluated strictly in ascending priority order;
#     the first rule that fails determines the response and no later rule runs)
# ===========================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present; X-User-Role is one of Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list in the 1.5 table"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource id in the path exists, validated left to right"
    error_id: "ERR_PATIENT_NOT_FOUND, ERR_PROVIDER_NOT_FOUND, ERR_PHARMACY_RESOURCE_NOT_FOUND, ERR_CLINICAL_RECORD_NOT_FOUND, ERR_FULFILLMENT_RECORD_NOT_FOUND or ERR_BILLING_RECORD_NOT_FOUND depending on the collection"
    http_status: 404
    applies_to: "all endpoints with a path id"

  - priority: 4
    category: auth
    check: "for entity-backed roles the acting X-User-ID owns the target: a Patient acts only on its own rows, a Provider acts only where it is provider_id, prescriber_provider_id or a licensed clinician of record, a Coach acts only where it is coach_provider_id, a PharmacyOperator acts only where its Pharmacy.id equals the order's pharmacy_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /glp1/consults/{consult_id}/complete, POST /glp1/prescriptions/{prescription_id}/discontinue, POST /glp1/pharmacy-orders/{pharmacy_order_id}/reserve, POST /glp1/pharmacy-orders/{pharmacy_order_id}/ship, POST /glp1/coaching-sessions/{coaching_session_id}/complete, POST /glp1/subscriptions/{subscription_id}/cancel"

  - priority: 5
    category: business_constraint
    check: "request body carries every required field, every value matches its declared type, every enum value is a declared member, every bounded integer is inside its range (nausea_score and vomiting_score 0..3, units_per_cycle and units_requested 1..4, limit 1..100, offset >= 0), every interval has end strictly after start, and Provider.npi is present when provider_type is CLINICIAN"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_PATIENT_NOT_FOUND, ERR_PROVIDER_NOT_FOUND, ERR_CLINICAL_RECORD_NOT_FOUND or ERR_BILLING_RECORD_NOT_FOUND depending on the referenced collection"
    http_status: 404
    applies_to: "POST /glp1/screenings, POST /glp1/consults, POST /glp1/prescriptions, POST /glp1/prior-authorizations, POST /glp1/pharmacy-orders, POST /glp1/subscriptions, POST /glp1/check-ins, POST /glp1/coaching-sessions, POST /glp1/supply-lots"

  - priority: 7
    category: business_constraint
    check: "expected_patient_version equals the current Patient.version"
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /glp1/prescriptions"

  - priority: 7
    category: business_constraint
    check: "expected_prescription_version equals the current Prescription.version"
    error_id: ERR_STALE_PRESCRIPTION_VERSION
    http_status: 412
    applies_to: "POST /glp1/pharmacy-orders"

  - priority: 8
    category: state
    check: "the target row is in a state from which the requested transition is declared in 1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 8
    category: state
    check: "Prescription.clinical_status is ACTIVE"
    error_id: ERR_PRESCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /glp1/pharmacy-orders, POST /glp1/pharmacy-orders/{pharmacy_order_id}/reserve, POST /glp1/pharmacy-orders/{pharmacy_order_id}/ship, POST /glp1/titration-steps/{titration_step_id}/escalate, POST /glp1/prescriptions/{prescription_id}/request-refill"

  - priority: 8
    category: state
    check: "Subscription.status is ACTIVE"
    error_id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /glp1/coaching-sessions, POST /glp1/coaching-sessions/{coaching_session_id}/complete, POST /glp1/billing-cycles/{billing_cycle_id}/invoice, POST /glp1/billing-cycles/{billing_cycle_id}/settle"

  - priority: 9
    category: business_safety
    check: "the cited EligibilityScreening has status ELIGIBLE and names the same patient_id as the prescription request"
    error_id: ERR_SCREENING_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /glp1/prescriptions"

  - priority: 9
    category: business_safety
    check: "no CheckIn for the prescription is in status ESCALATED"
    error_id: ERR_OPEN_ESCALATED_CHECK_IN
    http_status: 409
    applies_to: "POST /glp1/titration-steps/{titration_step_id}/escalate"

  - priority: 9
    category: business_safety
    check: "Prescription.dose_level is strictly less than TITRATION_MAX_DOSE_LEVEL (5)"
    error_id: ERR_TITRATION_MAX_DOSE_REACHED
    http_status: 422
    applies_to: "POST /glp1/titration-steps/{titration_step_id}/escalate"

  - priority: 9
    category: business_safety
    check: "second_signer_provider_id is present whenever the target dose_level is at or above TITRATION_SECOND_SIGNER_MIN_LEVEL (4)"
    error_id: ERR_SECOND_SIGNER_REQUIRED
    http_status: 422
    applies_to: "POST /glp1/titration-steps/{titration_step_id}/escalate"

  - priority: 9
    category: business_safety
    check: "the supplied second_signer_provider_id differs from Prescription.prescriber_provider_id and names a Provider whose provider_type is CLINICIAN and whose status is ACTIVE"
    error_id: ERR_SECOND_SIGNER_CONFLICT
    http_status: 403
    applies_to: "POST /glp1/titration-steps/{titration_step_id}/escalate"

  - priority: 9
    category: business_safety
    check: "elapsed whole days since Prescription.last_dose_change_at reach the interval required by calculations.titration_readiness_interval variant TOLERABILITY_ADJUSTED"
    error_id: ERR_TITRATION_INTERVAL_NOT_MET
    http_status: 409
    applies_to: "POST /glp1/titration-steps/{titration_step_id}/escalate"

  - priority: 9
    category: business_safety
    check: "when dispense_type_at_route is BRANDED and Prescription.active_route_mode is INSURANCE, a PriorAuthorization for the prescription is in status APPROVED with approved_through_at at or after the clock"
    error_id: ERR_PRIOR_AUTH_REQUIRED
    http_status: 409
    applies_to: "POST /glp1/pharmacy-orders/{pharmacy_order_id}/ship"

  - priority: 10
    category: business_referential
    check: "the Consult's Provider has provider_type CLINICIAN, status ACTIVE, and lists the Patient's state_code in licensed_state_codes"
    error_id: ERR_PROVIDER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /glp1/consults, POST /glp1/consults/{consult_id}/reschedule"

  - priority: 10
    category: business_referential
    check: "the CoachingSession's coach_provider_id names a Provider whose provider_type is COACH and whose status is ACTIVE"
    error_id: ERR_PROVIDER_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /glp1/coaching-sessions"

  - priority: 11
    category: business_temporal
    check: "the requested window does not collide with any other SCHEDULED Consult of the same provider_id under the CONSULT_BUFFER_MINUTES (15) rule: a collision exists when new.scheduled_start_at < other.scheduled_end_at + 15 minutes AND other.scheduled_start_at < new.scheduled_end_at + 15 minutes"
    error_id: ERR_CONSULT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /glp1/consults, POST /glp1/consults/{consult_id}/reschedule"

  - priority: 11
    category: business_temporal
    check: "the requested window does not collide with any other SCHEDULED CoachingSession of the same coach_provider_id under the zero-buffer half-open rule: a collision exists when new.scheduled_start_at < other.scheduled_end_at AND other.scheduled_start_at < new.scheduled_end_at, so exactly abutting sessions are allowed"
    error_id: ERR_COACH_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /glp1/coaching-sessions"

  - priority: 11
    category: business_temporal
    check: "scheduled_start_at falls inside the half-open window [period_start_at, period_end_at) of exactly one BillingCycle of the subscription whose status is OPEN or INVOICED; that cycle becomes billing_cycle_id"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /glp1/coaching-sessions"

  - priority: 12
    category: business_constraint
    check: "the routing selector in calculations.supply_lot_routing_selection returns a non-empty candidate set"
    error_id: ERR_NO_ELIGIBLE_SUPPLY_LOT
    http_status: 409
    applies_to: "POST /glp1/pharmacy-orders"

  - priority: 12
    category: business_constraint
    check: "units_requested is at most MAX_UNITS_PER_ORDER (4) and at most Prescription.units_per_cycle"
    error_id: ERR_UNITS_EXCEED_LIMIT
    http_status: 422
    applies_to: "POST /glp1/pharmacy-orders"

  - priority: 12
    category: business_constraint
    check: "units_requested plus the sum of units_requested over other RESERVED PharmacyOrders on the same supply_lot_id whose [window_start_at, window_end_at) overlaps this order's window is at most SupplyLot.window_capacity_units"
    error_id: ERR_LOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /glp1/pharmacy-orders/{pharmacy_order_id}/reserve"

  - priority: 12
    category: business_constraint
    check: "PriorAuthorization.appeal_count is strictly less than MAX_PA_APPEALS (2)"
    error_id: ERR_APPEAL_LIMIT_REACHED
    http_status: 422
    applies_to: "POST /glp1/prior-authorizations/{prior_authorization_id}/appeal"

  - priority: 13
    category: business_fiscal
    check: "Subscription.coaching_credits_available is at least 1 under calculations.coaching_entitlement_balance variant RESERVED_INCLUSIVE"
    error_id: ERR_COACHING_CREDITS_EXHAUSTED
    http_status: 402
    applies_to: "POST /glp1/coaching-sessions"

  - priority: 13
    category: business_fiscal
    check: "Subscription.pause_days_used is strictly less than PAUSE_MAX_DAYS (60)"
    error_id: ERR_PAUSE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /glp1/subscriptions/{subscription_id}/pause"

# ===========================================================================
# 1.5 API Endpoint Table
# ===========================================================================
endpoints:

  - method: POST
    path: "/glp1/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to real wall-clock time; every window, expiry and interval rule in this scaffold is evaluated against this logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["advances or rewinds the logical clock; no entity rows are mutated"]

  - method: POST
    path: "/glp1/patients"
    description: "Enrols a patient."
    roles: [PlatformAdmin]
    code: 201
    input: ["email", "full_name", "state_code", "height_cm", "weight_kg", "payment_mode", "comorbidity_codes?"]
    output: Patient
    side_effects: ["computes current_bmi via calculations.eligibility_bmi_assessment variant CURRENT_RECHECK", "sets eligibility_status to NOT_SCREENED"]

  - method: GET
    path: "/glp1/patients/{patient_id}"
    description: "Reads a patient including current_bmi, eligibility_status, the lifetime billing counters and version."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: PATCH
    path: "/glp1/patients/{patient_id}/vitals"
    description: "Records a new weight for the patient."
    roles: [Patient, Provider]
    code: 200
    input: [weight_kg]
    output: Patient
    side_effects: ["recomputes current_bmi via variant CURRENT_RECHECK", "increments Patient.version by 1, which invalidates any expected_patient_version a client captured earlier"]

  - method: POST
    path: "/glp1/providers"
    description: "Registers a clinician or coach."
    roles: [PlatformAdmin]
    code: 201
    input: ["full_name", "provider_type", "licensed_state_codes", "npi?", "status?"]
    output: Provider
    side_effects: []

  - method: POST
    path: "/glp1/pharmacies"
    description: "Registers a dispensing pharmacy."
    roles: [PlatformAdmin]
    code: 201
    input: ["name", "dispense_type", "served_state_codes", "status?"]
    output: Pharmacy
    side_effects: []

  - method: POST
    path: "/glp1/supply-lots"
    description: "Records a physical lot held by a pharmacy."
    roles: [PlatformAdmin]
    code: 201
    input: ["pharmacy_id", "lot_code", "strength_mg", "total_units", "window_capacity_units", "expires_at", "status?"]
    output: SupplyLot
    side_effects: ["initialises available_units to total_units and both reserved_units and dispensed_units to 0, establishing INV-1"]

  - method: GET
    path: "/glp1/supply-lots/{supply_lot_id}"
    description: "Reads a lot including the three unit counters that INV-1 constrains."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: SupplyLot
    side_effects: []

  - method: GET
    path: "/glp1/supply-lots"
    description: "Lists lots, optionally filtered to one pharmacy."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["pharmacy_id?", "status?", "limit?", "offset?"]
    output: SupplyLot[]
    side_effects: []

  - method: POST
    path: "/glp1/screenings"
    description: "Opens a DRAFT eligibility screening and snapshots the patient's height."
    roles: [Provider, Patient]
    code: 201
    input: ["patient_id", "recorded_weight_kg", "egfr", "lab_collected_at", "a1c_pct?"]
    output: EligibilityScreening
    side_effects: ["copies Patient.height_cm into recorded_height_cm", "leaves assessed_bmi, eligibility_band and decision_reason null until submit"]

  - method: GET
    path: "/glp1/screenings/{screening_id}"
    description: "Reads a screening including the frozen assessed_bmi and its decision_reason."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: EligibilityScreening
    side_effects: []

  - method: GET
    path: "/glp1/screenings"
    description: "Lists screenings, optionally filtered by patient."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["patient_id?", "status?", "limit?", "offset?"]
    output: EligibilityScreening[]
    side_effects: []

  - method: POST
    path: "/glp1/screenings/{screening_id}/submit"
    description: "Submits or resubmits a screening for adjudication; any supplied field overwrites the stored one before the decision runs."
    roles: [Provider]
    code: 200
    input: ["recorded_weight_kg?", "egfr?", "a1c_pct?", "lab_collected_at?"]
    output: EligibilityScreening
    side_effects: ["freezes assessed_bmi and eligibility_band per variant SCREENING_SNAPSHOT", "increments submit_count", "mirrors the outcome into Patient.eligibility_status and increments Patient.version by 1"]

  - method: POST
    path: "/glp1/consults"
    description: "Books a telehealth consult slot with a clinician."
    roles: [Patient]
    code: 201
    input: [patient_id, provider_id, scheduled_start_at, scheduled_end_at]
    output: Consult
    side_effects: ["enforces the CONSULT_BUFFER_MINUTES (15) overlap rule against the provider's other SCHEDULED consults"]

  - method: GET
    path: "/glp1/consults/{consult_id}"
    description: "Reads a consult."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Consult
    side_effects: []

  - method: GET
    path: "/glp1/consults"
    description: "Lists consults, optionally filtered by patient or provider."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["patient_id?", "provider_id?", "status?", "limit?", "offset?"]
    output: Consult[]
    side_effects: []

  - method: POST
    path: "/glp1/consults/{consult_id}/complete"
    description: "Closes a consult with outcome PRESCRIBE, DECLINE or NO_SHOW."
    roles: [Provider]
    code: 200
    input: ["outcome", "outcome_note?"]
    output: Consult
    side_effects: ["moves the consult to COMPLETED_PRESCRIBED, COMPLETED_DECLINED or NO_SHOW and releases the provider's slot"]

  - method: POST
    path: "/glp1/consults/{consult_id}/reschedule"
    description: "Moves a no-showed consult back into SCHEDULED at a new window."
    roles: [Patient, Provider]
    code: 200
    input: [scheduled_start_at, scheduled_end_at]
    output: Consult
    side_effects: ["re-runs the 15-minute buffer overlap rule", "increments reschedule_count by 1"]

  - method: POST
    path: "/glp1/prescriptions"
    description: "Issues a prescription off a completed consult and an ELIGIBLE screening."
    roles: [Provider]
    code: 201
    input: ["patient_id", "consult_id", "prescriber_provider_id", "screening_id", "drug_family", "expected_patient_version", "units_per_cycle?"]
    output: Prescription
    side_effects:
      - "seeds dose_level 1, resolves dose_mg via calculations.dose_schedule_lookup, sets last_dose_change_at to the clock"
      - "seeds active_route_mode from Patient.payment_mode"
      - "creates TitrationStep step_number 1 in status DUE with earliest_escalation_at 28 days out"
      - "discontinues the patient's prior ACTIVE prescription with discontinue_reason SUPERSEDED and records supersedes_prescription_id on the new row"
      - "increments Patient.version by 1"

  - method: GET
    path: "/glp1/prescriptions/{prescription_id}"
    description: "Reads a prescription including both parallel status axes, both severity indices and version."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Prescription
    side_effects: []

  - method: GET
    path: "/glp1/prescriptions"
    description: "Lists prescriptions, optionally filtered by patient, consult, prescriber, screening, superseded predecessor or either status axis."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["patient_id?", "consult_id?", "prescriber_provider_id?", "screening_id?", "supersedes_prescription_id?", "clinical_status?", "fulfillment_status?", "limit?", "offset?"]
    output: Prescription[]
    side_effects: []

  - method: POST
    path: "/glp1/prescriptions/{prescription_id}/discontinue"
    description: "Ends a prescription clinically."
    roles: [Provider, Patient]
    code: 200
    input: [discontinue_reason]
    output: Prescription
    side_effects: ["cancels every PharmacyOrder in CREATED or RESERVED with cancel_reason CLINICAL_HOLD, releasing reserved units", "moves every DUE or HELD TitrationStep to REDUCED"]

  - method: POST
    path: "/glp1/prescriptions/{prescription_id}/request-refill"
    description: "Advances the fulfilment axis from DISPENSED to REFILL_DUE without touching the clinical axis."
    roles: [Patient, Provider]
    code: 200
    input: []
    output: Prescription
    side_effects: ["sets fulfillment_status to REFILL_DUE"]

  - method: GET
    path: "/glp1/titration-steps/{titration_step_id}"
    description: "Reads a titration rung including the INTERVAL_ONLY planning date earliest_escalation_at."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: TitrationStep
    side_effects: []

  - method: GET
    path: "/glp1/titration-steps"
    description: "Lists titration rungs; the only discovery channel for the rungs the system creates as a side effect."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["prescription_id?", "second_signer_provider_id?", "status?", "limit?", "offset?"]
    output: TitrationStep[]
    side_effects: []

  - method: POST
    path: "/glp1/titration-steps/{titration_step_id}/escalate"
    description: "Steps the ladder up one rung."
    roles: [Provider]
    code: 200
    input: ["second_signer_provider_id?"]
    output: TitrationStep
    side_effects: ["increments Prescription.dose_level and resets last_dose_change_at", "recomputes severity_index_since_dose_change", "creates the next DUE TitrationStep"]

  - method: POST
    path: "/glp1/titration-steps/{titration_step_id}/hold"
    description: "Freezes a rung on clinical judgement without changing the dose."
    roles: [Provider]
    code: 200
    input: []
    output: TitrationStep
    side_effects: ["sets hold_reason to PROVIDER_HOLD"]

  - method: POST
    path: "/glp1/titration-steps/{titration_step_id}/reduce"
    description: "Steps the ladder down one rung."
    roles: [Provider]
    code: 200
    input: []
    output: TitrationStep
    side_effects: ["decrements Prescription.dose_level and resets last_dose_change_at", "creates the next DUE TitrationStep at the reduced level"]
  - method: POST
    path: "/glp1/prior-authorizations"
    description: "Files a prior authorisation with the payer."
    roles: [Provider]
    code: 201
    input: [prescription_id, payer_reference]
    output: PriorAuthorization
    side_effects: ["lands in status SUBMITTED with appeal_count 0"]

  - method: GET
    path: "/glp1/prior-authorizations/{prior_authorization_id}"
    description: "Reads a prior authorisation."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: PriorAuthorization
    side_effects: []

  - method: GET
    path: "/glp1/prior-authorizations"
    description: "Lists prior authorisations, optionally filtered by prescription."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["prescription_id?", "status?", "limit?", "offset?"]
    output: PriorAuthorization[]
    side_effects: []

  - method: POST
    path: "/glp1/prior-authorizations/{prior_authorization_id}/decide"
    description: "Records the payer's decision on a submitted or appealed authorisation."
    roles: [BillingAdmin]
    code: 200
    input: ["decision", "denial_reason?"]
    output: PriorAuthorization
    side_effects:
      - "on APPROVED sets approved_through_at 180 days out and forces Prescription.active_route_mode to INSURANCE"
      - "on DENIED forces Prescription.active_route_mode to CASH, which then cancels every BRANDED PharmacyOrder still in CREATED or RESERVED, which then releases those units on the lot"
      - "increments Prescription.version by 1"

  - method: POST
    path: "/glp1/prior-authorizations/{prior_authorization_id}/appeal"
    description: "Appeals a denial back to the payer."
    roles: [Provider]
    code: 200
    input: ["payer_reference?"]
    output: PriorAuthorization
    side_effects: ["increments appeal_count by 1 and clears decided_at and denial_reason"]

  - method: POST
    path: "/glp1/pharmacy-orders"
    description: "Routes a fill to a pharmacy and lot chosen by calculations.supply_lot_routing_selection."
    roles: [Provider]
    code: 201
    input: [prescription_id, titration_step_id, units_requested, window_start_at, window_end_at, expected_prescription_version]
    output: PharmacyOrder
    side_effects:
      - "resolves pharmacy_id, supply_lot_id and dispense_type_at_route from the routing selector"
      - "sets Prescription.fulfillment_status to ROUTED"
      - "increments Prescription.version by 1"

  - method: GET
    path: "/glp1/pharmacy-orders/{pharmacy_order_id}"
    description: "Reads a pharmacy order including the routed pharmacy, lot and product form."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: PharmacyOrder
    side_effects: []

  - method: GET
    path: "/glp1/pharmacy-orders"
    description: "Lists pharmacy orders, optionally filtered by prescription, titration rung, pharmacy or lot."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["prescription_id?", "titration_step_id?", "pharmacy_id?", "supply_lot_id?", "status?", "limit?", "offset?"]
    output: PharmacyOrder[]
    side_effects: []

  - method: POST
    path: "/glp1/pharmacy-orders/{pharmacy_order_id}/reserve"
    description: "Holds units on the routed lot for this order's shipping window."
    roles: [PharmacyOperator]
    code: 200
    input: []
    output: PharmacyOrder
    side_effects: ["moves units_requested from SupplyLot.available_units to SupplyLot.reserved_units (INV-1 forward leg)", "enforces the windowed aggregate cap SupplyLot.window_capacity_units"]

  - method: POST
    path: "/glp1/pharmacy-orders/{pharmacy_order_id}/ship"
    description: "Ships a reserved order."
    roles: [PharmacyOperator]
    code: 200
    input: []
    output: PharmacyOrder
    side_effects: ["moves units_requested from reserved_units to dispensed_units", "sets Prescription.fulfillment_status to DISPENSED"]

  - method: POST
    path: "/glp1/pharmacy-orders/{pharmacy_order_id}/cancel"
    description: "Cancels an order that has not shipped."
    roles: [PharmacyOperator, Provider]
    code: 200
    input: []
    output: PharmacyOrder
    side_effects: ["from RESERVED returns units_requested from reserved_units to available_units (INV-1 compensating leg)", "sets cancel_reason to OPERATOR"]

  - method: POST
    path: "/glp1/subscriptions"
    description: "Starts the recurring programme subscription for a prescription."
    roles: [BillingAdmin]
    code: 201
    input: ["patient_id", "prescription_id", "anchor_at", "coaching_addon_enabled?"]
    output: Subscription
    side_effects: ["opens BillingCycle sequence_number 1 spanning [anchor_at, anchor_at + 30 days)", "sets cycle_count to 1", "grants COACHING_CREDITS_PER_CYCLE (4) coaching credits when the add-on is enabled"]

  - method: GET
    path: "/glp1/subscriptions/{subscription_id}"
    description: "Reads a subscription including all five coaching-credit counters that INV-2 constrains."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/glp1/subscriptions"
    description: "Lists subscriptions, optionally filtered by patient or prescription."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["patient_id?", "prescription_id?", "status?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/glp1/subscriptions/{subscription_id}/pause"
    description: "Suspends billing."
    roles: [BillingAdmin, Patient]
    code: 200
    input: []
    output: Subscription
    side_effects: ["voids the OPEN or INVOICED cycle with void_reason SUBSCRIPTION_PAUSED, computing proration_credit_cents when it was INVOICED", "forfeits every SCHEDULED CoachingSession attached to that cycle"]

  - method: POST
    path: "/glp1/subscriptions/{subscription_id}/resume"
    description: "Restarts billing from the current clock."
    roles: [BillingAdmin, Patient]
    code: 200
    input: []
    output: Subscription
    side_effects: ["adds the whole paused days to pause_days_used", "opens a fresh 30-day BillingCycle starting at the clock and grants coaching credits when the add-on is enabled"]

  - method: POST
    path: "/glp1/subscriptions/{subscription_id}/cancel"
    description: "Terminates the subscription."
    roles: [BillingAdmin, Patient]
    code: 200
    input: []
    output: Subscription
    side_effects: ["voids the OPEN or INVOICED cycle with void_reason SUBSCRIPTION_CANCELLED", "forfeits every SCHEDULED CoachingSession attached to that cycle"]

  - method: GET
    path: "/glp1/billing-cycles/{billing_cycle_id}"
    description: "Reads a billing cycle including every charge component and the two credit fields."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: BillingCycle
    side_effects: []

  - method: GET
    path: "/glp1/billing-cycles"
    description: "Lists billing cycles; the only discovery channel for cycles the system opens as a side effect."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["subscription_id?", "status?", "limit?", "offset?"]
    output: BillingCycle[]
    side_effects: []

  - method: POST
    path: "/glp1/billing-cycles/{billing_cycle_id}/invoice"
    description: "Prices the cycle."
    roles: [BillingAdmin]
    code: 200
    input: []
    output: BillingCycle
    side_effects: ["runs calculations.cycle_medication_charge then calculations.cycle_invoice_total and writes charge_basis, the four component fields and total_due_cents"]

  - method: POST
    path: "/glp1/billing-cycles/{billing_cycle_id}/settle"
    description: "Collects the invoiced amount and opens the next cycle."
    roles: [BillingAdmin]
    code: 200
    input: ["payment_reference?"]
    output: BillingCycle
    side_effects: ["computes coaching_unused_credit_cents under variant COMPLETED_ONLY", "sets settled_amount_cents and adds it to Patient.lifetime_charged_cents (INV-3 forward leg)", "opens the next cycle abutting period_end_at exactly and grants coaching credits when enabled"]

  - method: POST
    path: "/glp1/billing-cycles/{billing_cycle_id}/void"
    description: "Voids a cycle; from SETTLED this is the compensating leg of INV-3."
    roles: [BillingAdmin]
    code: 200
    input: [void_reason]
    output: BillingCycle
    side_effects: ["from SETTLED adds settled_amount_cents to Patient.lifetime_credited_cents then zeroes settled_amount_cents", "from INVOICED computes proration_credit_cents", "from OPEN changes only status and void_reason"]

  - method: POST
    path: "/glp1/check-ins"
    description: "Files a side-effect check-in."
    roles: [Patient]
    code: 201
    input: ["patient_id", "prescription_id", "nausea_score", "vomiting_score", "dehydration_flag?"]
    output: CheckIn
    side_effects: ["computes severity_score via calculations.side_effect_severity_index", "sets submitted_at to the clock; the row stays SUBMITTED and is excluded from both Prescription severity indices until triaged"]

  - method: GET
    path: "/glp1/check-ins/{check_in_id}"
    description: "Reads a check-in including its computed severity_score."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: CheckIn
    side_effects: []

  - method: GET
    path: "/glp1/check-ins"
    description: "Lists check-ins, optionally filtered by patient, prescription or triaging clinician."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["patient_id?", "prescription_id?", "triaged_by_provider_id?", "status?", "limit?", "offset?"]
    output: CheckIn[]
    side_effects: []

  - method: POST
    path: "/glp1/check-ins/{check_in_id}/triage"
    description: "Clinician triage; the branch point that either clears the report or escalates it."
    roles: [Provider]
    code: 200
    input: []
    output: CheckIn
    side_effects: ["recomputes both Prescription severity indices", "on escalation holds the Prescription, which holds its DUE rung, which cancels that rung's open orders, which releases their units"]

  - method: POST
    path: "/glp1/check-ins/{check_in_id}/resolve"
    description: "Closes an escalation."
    roles: [Provider]
    code: 200
    input: []
    output: CheckIn
    side_effects: ["when no other ESCALATED check-in remains, returns the Prescription to ACTIVE, which returns its HELD rung to DUE"]

  - method: POST
    path: "/glp1/coaching-sessions"
    description: "Books a coaching session against the subscription's entitlement."
    roles: [Patient]
    code: 201
    input: [subscription_id, coach_provider_id, scheduled_start_at, scheduled_end_at]
    output: CoachingSession
    side_effects: ["resolves billing_cycle_id from the cycle window containing scheduled_start_at", "moves one credit from coaching_credits_available to coaching_credits_reserved (INV-2 forward leg)"]

  - method: GET
    path: "/glp1/coaching-sessions/{coaching_session_id}"
    description: "Reads a coaching session."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: []
    output: CoachingSession
    side_effects: []

  - method: GET
    path: "/glp1/coaching-sessions"
    description: "Lists coaching sessions, optionally filtered by subscription, coach or billing cycle."
    roles: [Patient, Provider, Coach, PharmacyOperator, BillingAdmin, PlatformAdmin]
    code: 200
    input: ["subscription_id?", "coach_provider_id?", "billing_cycle_id?", "status?", "limit?", "offset?"]
    output: CoachingSession[]
    side_effects: []

  - method: POST
    path: "/glp1/coaching-sessions/{coaching_session_id}/complete"
    description: "Marks a session delivered, burning the reserved credit."
    roles: [Coach]
    code: 200
    input: []
    output: CoachingSession
    side_effects: ["moves one credit from coaching_credits_reserved to coaching_credits_consumed"]

  - method: POST
    path: "/glp1/coaching-sessions/{coaching_session_id}/cancel"
    description: "Cancels a scheduled session, returning the credit to the pool."
    roles: [Patient, Coach]
    code: 200
    input: []
    output: CoachingSession
    side_effects: ["moves one credit from coaching_credits_reserved back to coaching_credits_available (INV-2 compensating leg)"]

# ===========================================================================
# 1.6 Error Code Catalog
# ===========================================================================
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the six declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed for the endpoint, or an entity-backed actor is not the owner of the target row"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong type, undeclared enum member, out-of-range integer, end instant not strictly after start instant, npi absent on a CLINICIAN, or void_reason other than ADMIN_REVERSAL on the void endpoint"

  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "a Patient id in the path or body does not resolve"
  - id: ERR_PROVIDER_NOT_FOUND
    http: 404
    condition: "a Provider id in the body does not resolve, including provider_id, prescriber_provider_id, second_signer_provider_id and coach_provider_id"
  - id: ERR_PHARMACY_RESOURCE_NOT_FOUND
    http: 404
    condition: "a Pharmacy or SupplyLot id does not resolve"
  - id: ERR_CLINICAL_RECORD_NOT_FOUND
    http: 404
    condition: "an EligibilityScreening, Consult, Prescription, TitrationStep or CheckIn id does not resolve"
  - id: ERR_FULFILLMENT_RECORD_NOT_FOUND
    http: 404
    condition: "a PriorAuthorization or PharmacyOrder id does not resolve"
  - id: ERR_BILLING_RECORD_NOT_FOUND
    http: 404
    condition: "a Subscription, BillingCycle or CoachingSession id does not resolve"

  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version on POST /glp1/prescriptions does not equal the current Patient.version"
  - id: ERR_STALE_PRESCRIPTION_VERSION
    http: 412
    condition: "expected_prescription_version on POST /glp1/pharmacy-orders does not equal the current Prescription.version"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the row's current state, or a coaching session's start instant falls in no OPEN or INVOICED cycle window"
  - id: ERR_PRESCRIPTION_NOT_ACTIVE
    http: 409
    condition: "the operation requires Prescription.clinical_status ACTIVE but the prescription is HELD or DISCONTINUED"
  - id: ERR_SUBSCRIPTION_NOT_ACTIVE
    http: 409
    condition: "the operation requires Subscription.status ACTIVE but the subscription is PAUSED or CANCELLED"

  - id: ERR_SCREENING_NOT_ELIGIBLE
    http: 409
    condition: "the EligibilityScreening cited by a prescription request is not in status ELIGIBLE, or names a different patient"
  - id: ERR_OPEN_ESCALATED_CHECK_IN
    http: 409
    condition: "a titration escalation is attempted while a CheckIn for the prescription is still in status ESCALATED"
  - id: ERR_TITRATION_INTERVAL_NOT_MET
    http: 409
    condition: "elapsed whole days since Prescription.last_dose_change_at are fewer than the interval required by the TOLERABILITY_ADJUSTED variant"
  - id: ERR_TITRATION_MAX_DOSE_REACHED
    http: 422
    condition: "an escalation is attempted while Prescription.dose_level is already TITRATION_MAX_DOSE_LEVEL (5)"
  - id: ERR_SECOND_SIGNER_REQUIRED
    http: 422
    condition: "an escalation to dose_level 4 or 5 arrives without second_signer_provider_id"
  - id: ERR_SECOND_SIGNER_CONFLICT
    http: 403
    condition: "the supplied second signer is the prescriber of record, is not a CLINICIAN, or is SUSPENDED"
  - id: ERR_PRIOR_AUTH_REQUIRED
    http: 409
    condition: "a BRANDED order on an INSURANCE prescription is shipped without an APPROVED PriorAuthorization still inside approved_through_at"
  - id: ERR_APPEAL_LIMIT_REACHED
    http: 422
    condition: "an appeal is filed when appeal_count already equals MAX_PA_APPEALS (2)"

  - id: ERR_PROVIDER_NOT_ELIGIBLE
    http: 422
    condition: "the consult's provider is not an ACTIVE CLINICIAN licensed in the patient's state_code, or the coaching session's coach is not an ACTIVE COACH"
  - id: ERR_CONSULT_SLOT_CONFLICT
    http: 409
    condition: "the requested consult window collides with another SCHEDULED consult of the same provider once both sides are widened by CONSULT_BUFFER_MINUTES (15)"
  - id: ERR_COACH_SLOT_CONFLICT
    http: 409
    condition: "the requested coaching window strictly overlaps another SCHEDULED session of the same coach; exactly abutting windows do not collide"

  - id: ERR_NO_ELIGIBLE_SUPPLY_LOT
    http: 409
    condition: "the routing selector's candidate set is empty for the required product form, strength, state, shelf life and unit count"
  - id: ERR_LOT_CAPACITY_EXCEEDED
    http: 409
    condition: "reserving would push the units committed across overlapping shipping windows on one lot past SupplyLot.window_capacity_units"
  - id: ERR_UNITS_EXCEED_LIMIT
    http: 422
    condition: "units_requested exceeds MAX_UNITS_PER_ORDER (4) or exceeds Prescription.units_per_cycle"

  - id: ERR_COACHING_CREDITS_EXHAUSTED
    http: 402
    condition: "a coaching session is booked while coaching_credits_available is 0 under the RESERVED_INCLUSIVE reading"
  - id: ERR_PAUSE_LIMIT_EXCEEDED
    http: 422
    condition: "a pause is requested when pause_days_used has already reached PAUSE_MAX_DAYS (60)"

# ===========================================================================
# 1.7 RBAC Matrix
# ===========================================================================
roles:

  - name: Patient
    description: "the enrolled member; books consults and coaching, files check-ins, requests refills, and may end their own prescription or subscription"
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /glp1/consults"
      - "POST /glp1/check-ins"
      - "POST /glp1/coaching-sessions"
    shared_operations:
      - "PATCH /glp1/patients/{patient_id}/vitals (with Provider)"
      - "POST /glp1/consults/{consult_id}/reschedule (with Provider)"
      - "POST /glp1/prescriptions/{prescription_id}/discontinue (with Provider)"
      - "POST /glp1/prescriptions/{prescription_id}/request-refill (with Provider)"
      - "POST /glp1/subscriptions/{subscription_id}/pause, /resume, /cancel (with BillingAdmin)"
      - "POST /glp1/coaching-sessions/{coaching_session_id}/cancel (with Coach)"
      - "every GET endpoint"

  - name: Provider
    description: "the prescribing clinician; adjudicates screenings, completes consults, issues prescriptions, drives titration, triages check-ins and files prior authorisations"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /glp1/screenings/{screening_id}/submit"
      - "POST /glp1/consults/{consult_id}/complete"
      - "POST /glp1/prescriptions"
      - "POST /glp1/titration-steps/{titration_step_id}/escalate, /hold, /reduce"
      - "POST /glp1/prior-authorizations and /glp1/prior-authorizations/{prior_authorization_id}/appeal"
      - "POST /glp1/pharmacy-orders"
      - "POST /glp1/check-ins/{check_in_id}/triage and /resolve"
    shared_operations:
      - "POST /glp1/screenings (with Patient)"
      - "PATCH /glp1/patients/{patient_id}/vitals (with Patient)"
      - "POST /glp1/consults/{consult_id}/reschedule (with Patient)"
      - "POST /glp1/prescriptions/{prescription_id}/discontinue and /request-refill (with Patient)"
      - "POST /glp1/pharmacy-orders/{pharmacy_order_id}/cancel (with PharmacyOperator)"
      - "every GET endpoint"
    note: "segregation of duties: the Provider named as Prescription.prescriber_provider_id is barred from acting as second_signer_provider_id on that prescription's escalations to dose_level 4 or 5"

  - name: Coach
    description: "the nutrition coach; delivers coaching sessions but has no prescribing authority"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /glp1/coaching-sessions/{coaching_session_id}/complete"
    shared_operations:
      - "POST /glp1/coaching-sessions/{coaching_session_id}/cancel (with Patient)"
      - "every GET endpoint"
    note: "X-User-ID must be the id of a Provider row whose provider_type is COACH"

  - name: PharmacyOperator
    description: "the dispensing pharmacy's operator; reserves, ships and cancels orders routed to its own pharmacy"
    identity: "entity_backed:Pharmacy"
    exclusive_operations:
      - "POST /glp1/pharmacy-orders/{pharmacy_order_id}/reserve"
      - "POST /glp1/pharmacy-orders/{pharmacy_order_id}/ship"
    shared_operations:
      - "POST /glp1/pharmacy-orders/{pharmacy_order_id}/cancel (with Provider)"
      - "every GET endpoint"

  - name: BillingAdmin
    description: "the revenue-cycle operator; runs subscriptions, invoices, settlements, voids and payer decisions"
    identity: opaque
    exclusive_operations:
      - "POST /glp1/subscriptions"
      - "POST /glp1/billing-cycles/{billing_cycle_id}/invoice, /settle, /void"
      - "POST /glp1/prior-authorizations/{prior_authorization_id}/decide"
    shared_operations:
      - "POST /glp1/subscriptions/{subscription_id}/pause, /resume, /cancel (with Patient)"
      - "every GET endpoint"

  - name: PlatformAdmin
    description: "the operations administrator; seeds the directory of patients, providers, pharmacies and lots, and drives the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /glp1/patients"
      - "POST /glp1/providers"
      - "POST /glp1/pharmacies"
      - "POST /glp1/supply-lots"
      - "POST /glp1/_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"
