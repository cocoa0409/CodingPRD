  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: credit_apply_cancel_roundtrip
        grounds:
          - calculations.customer_credit_ledger
          - state_machines.ProjectOrder.SUBMITTED_to_CANCELLED
          - entities.Customer.fields.liquidation_credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: credit money (cents). apply_credit(100000) followed by
          order cancellation from SUBMITTED (restocking fee 0) must restore the
          customer ledger exactly: balance = sum(issued final credits) + sum(settled
          CREDIT claims) - sum(credit_applied on non-CANCELLED orders); 800000 ->
          700000 -> 800000 with zero drift.
        test_recipe:
          setup:
            - "Customer with 800000 credit (10-item lot, grade A, appraised 1000000); order with one line qty 10 (unit list 100000, 40% tier) SUBMITTED"
          setup_api_calls:
            - call: "POST /api/dealerships"
