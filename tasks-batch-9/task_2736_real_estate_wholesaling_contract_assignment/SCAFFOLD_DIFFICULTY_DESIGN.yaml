                closing_window_start_at: "2026-09-15T00:00:00Z"
                closing_window_end_at: "2026-09-30T00:00:00Z"
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { pc_id: $.data.id }
            - call: "POST /disclosure-acknowledgements"
              payload: { purchase_contract_id: "${pc_id}", disclosure_template_version: "DISC-2026.1", acknowledged_intent_to_assign: true, acknowledged_unlicensed_status: true, signature_ref: "esig-dana-001" }
              as: Seller
              as_user_id: "${sl_id}"
            - call: "POST /purchase-contracts/${pc_id}/sign"
              payload: {}
              as: Seller
              as_user_id: "${sl_id}"
            - call: "POST /purchase-contracts/${pc_id}/elect-structure"
              payload: { structure_election: "ASSIGNMENT_ELECTED" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { pc_v: $.data.version }
            - call: "POST /cash-buyers"
              payload: { wholesaler_id: "${w_id}", legal_name: "Ridgeline Capital LLC", contact_email: "bids@ridgeline.example" }
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { cb_id: $.data.id }
            - call: "POST /proof-of-funds"
              payload: { cash_buyer_id: "${cb_id}", stated_funds_cents: 25500000, document_ref: "pof-ridgeline-001", expires_at: "2026-12-01T00:00:00Z" }
              as: CashBuyer
              as_user_id: "${cb_id}"
              captures: { pof_id: $.data.id }
            - call: "POST /proof-of-funds/${pof_id}/verify"
              payload: { verification_decision: "VERIFIED", verified_funds_cents: 25500000 }
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "GET /cash-buyers/${cb_id}"
              payload: {}
              as: Wholesaler
              as_user_id: "${w_id}"
              captures: { cb_baseline_committed: $.data.committed_deposit_cents, cb_baseline_tier: $.data.buyer_tier }
          trigger:
            - call: "POST /assignment-offers"
              payload: { purchase_contract_id: "${pc_id}", cash_buyer_id: "${cb_id}", buyer_price_cents: 20000000, buyer_deposit_cents: 1000000, expected_purchase_contract_version: "${pc_v}" }
              as: CashBuyer
              as_user_id: "${cb_id}"
              captures: { ao_id: $.data.id }
            - call: "POST /assignment-offers/${ao_id}/accept"
              payload: {}
              as: Wholesaler
              as_user_id: "${w_id}"
            - call: "POST /purchase-contracts/${pc_id}/cancel"
              payload: { reason: "Seller withdrew after a family decision to retain the property" }
              as: Seller
              as_user_id: "${sl_id}"
            - call: "GET /cash-buyers/${cb_id}"
              payload: {}
              as: Wholesaler
              as_user_id: "${w_id}"
          assert:
            - "Baseline before any offer: CashBuyer.${cb_id}.verified_funds_cents == 25500000, committed_deposit_cents == 0, available_funds_cents == 25500000, active_offer_count == 0, buyer_tier == PRIORITY"
            - "After trigger 1 (offer SUBMITTED): committed_deposit_cents == 1000000, available_funds_cents == 24500000, active_offer_count == 1, buyer_tier == STANDARD because 24500000 < PRIORITY_TIER_MIN_AVAILABLE_CENTS 25000000"
            - "After trigger 2 (offer ACCEPTED, still a live status): committed_deposit_cents == 1000000, available_funds_cents == 24500000, active_offer_count == 1, buyer_tier == STANDARD — acceptance alone releases nothing"
            - "Trigger 3 returns 200: PurchaseContract.${pc_id}.contract_status == CANCELLED, cancelled_at == 2026-08-10T00:00:00Z, cancellation_reason recorded, and AssignmentOffer.${ao_id}.status == LAPSED"
            - "Trigger 4 shows the compensation is exact: committed_deposit_cents == 0, available_funds_cents == 25500000, active_offer_count == 0, buyer_tier == PRIORITY — identical to the captured baseline ${cb_baseline_committed} and ${cb_baseline_tier}"
            - "Invariant Q2 holds at all four checkpoints: committed_deposit_cents equals the sum of buyer_deposit_cents over offers in {SUBMITTED, COUNTERED_BY_WHOLESALER, REVISED_BY_BUYER, ACCEPTED}, and verified_funds_cents == committed_deposit_cents + available_funds_cents"
            - "The cancellation also refunded the escrow (EarnestMoneyDeposit for ${pc_id} is REFUNDED_TO_WHOLESALER with refunded_to_wholesaler_cents 500000) and returned SellerLead.${sl_id}.status to SCREENED, but verified_funds_cents was never altered by the cascade"
