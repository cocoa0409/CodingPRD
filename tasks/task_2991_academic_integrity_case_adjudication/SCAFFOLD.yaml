# ============================================================================
# CONSERVED QUANTITIES (compensating invariants)
# Each must hold after EVERY request, including every failed one.
# ============================================================================
invariants:
  - id: inv-room-minutes-conserved
    quantity: HearingRoom.booked_minutes_total
    statement: "booked_minutes_total always equals the sum over the room's SCHEDULED, CONVENED, DECIDED and ADJOURNED HearingSessions of (session duration in minutes + 2 * room.buffer_minutes). Cancelling a SCHEDULED session releases exactly what scheduling reserved, returning the ledger to its previous value; adjourning does NOT release anything because the room was occupied."
    increment_trigger: "POST /integrity/hearing-sessions"
    compensating_trigger: "POST /integrity/hearing-sessions/{id}/cancel"
  - id: inv-active-sanction-points
    quantity: Student.active_sanction_points
    statement: "active_sanction_points always equals the sum of ladder_rank over the student's Sanctions whose status is exactly IMPOSED. PROPOSED, ACCEPTED, SUPERSEDED, DECLINED, VACATED and COMPLETED sanctions contribute nothing, so imposing then completing returns the counter to its prior value, and imposing then vacating on appeal returns it to the same prior value by a different route."
    increment_trigger: "POST /integrity/sanctions/{id}/impose"
    compensating_triggers:
      - "POST /integrity/sanctions/{id}/complete"
      - "POST /integrity/appeals/{id}/decide with outcome OVERTURNED, REMANDED or SANCTION_REDUCED"
  - id: inv-department-open-cases
    quantity: Department.open_case_count
    statement: "open_case_count always equals the number of Cases whose offering belongs to the department and whose adjudication_status is neither CLOSED nor DISMISSED. Opening a case increments it; dismissing, completing the sanction, or an OVERTURNED appeal decrements it exactly once. A legacy import never increments it."
    increment_trigger: "POST /integrity/cases"
    compensating_triggers:
      - "POST /integrity/cases/{id}/dismiss"
      - "POST /integrity/sanctions/{id}/complete"
      - "POST /integrity/appeals/{id}/decide with outcome OVERTURNED"

# ============================================================================
# CANONICAL FIXTURE SEED
# The numeric literals pinned in §1.3 and in the §1.8/§1.9 design files all
# derive from this seed. Reproduce it exactly.
# ============================================================================
canonical_fixture_seed:
  clock: "2026-08-01T00:00:00Z (the default; several instances move it forward explicitly)"
  departments:
    - "ENGL: enrolled_student_count 2000, faculty_headcount 5"
    - "HIST: enrolled_student_count 1000, faculty_headcount 4"
    - "PHIL: enrolled_student_count 500, faculty_headcount 3"
  faculty:
