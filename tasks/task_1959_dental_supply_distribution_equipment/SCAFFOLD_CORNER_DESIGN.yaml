          assert:
            - "HTTP 403 with error_id == ERR_FORBIDDEN"

      - name: practice_manager_cannot_settle_claim
        claim_type: rbac_deny
        grounds: ["roles[ManufacturerAgent]", "roles[PracticeManager]"]
        distinguishing_aspect: "Settlement is exclusive to ManufacturerAgent; the practice that filed the claim cannot pay itself (403)."
