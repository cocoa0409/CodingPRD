  - rule_id: priority_pair_validation_conflict
    instances:

      - name: session_create_terrain_state_beats_water_right_exceeded
        grounds:
          - validations[priority=12]
          - validations[priority=44]
          - errors[ERR_TERRAIN_STATE_INVALID]
          - errors[ERR_WATER_RIGHT_EXCEEDED]
          - calculations.snowmaking_water_volume
          - entities.SeasonConfig.fields.water_right_seasonal_af
        distinguishing_aspect: |
          Two rules from DIFFERENT error categories are violated by one request: the state check at
          priority 12 (category state, ERR_TERRAIN_STATE_INVALID, 409) and the fiscal check at priority 44
          (category business_fiscal, ERR_WATER_RIGHT_EXCEEDED, 422). The season's water right is set to
          1.000 AF while the request reserves 1.547 AF, and the area is in PATROL_HOLD after a wind cascade,
          so both fire on the same call. The lower priority number must win, which also means the response
          status is 409 rather than 422 - an implementation that runs the cheap arithmetic check first
          reports the wrong code AND the wrong status. Nothing may be persisted either way.
