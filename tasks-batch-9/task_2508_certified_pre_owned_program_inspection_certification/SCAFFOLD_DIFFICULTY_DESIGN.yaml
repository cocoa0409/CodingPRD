          The threshold is probed from both sides inside one adjudication: the pre-claim snapshot 0.00
          is strictly below 0.50 so the payout uses share 1.00, while the post-claim ratio lands
          exactly on 0.50 and must trip PROBATION because the comparison is "at or above". A strict
          greater-than implementation leaves the dealer ACTIVE and still pays 100000, so only the
          privilege field distinguishes the two readings.
