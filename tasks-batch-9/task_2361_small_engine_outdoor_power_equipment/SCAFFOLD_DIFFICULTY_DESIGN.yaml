            - "Model WM-21-BBC RELEASED with a valid PASSED ANSI_B71_1 certification; dealer_share_pct 0.55 with both channel caps at 500 so no cap binds."
            - "Suppliers SUP-CARB / SUP-IGN / SUP-CAST each with one 800-piece lot inspected at 0 defects -> ACCEPTED (sample_size 40, acceptance_number 4 for the MAJOR suppliers, 0 for the CRITICAL casting supplier)."
            - "Machining run on CS-001 closed with cpk 2.1082 >= 1.33 -> CLOSED."
