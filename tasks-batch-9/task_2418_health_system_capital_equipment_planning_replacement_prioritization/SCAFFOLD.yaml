roles:
  - name: CapitalPlanner
    identity: opaque
    description: |
      Capital planning office. X-User-ID is an opaque planner identifier that is not backed by any
      entity; it is recorded on CapitalCycle.allocated_by_user_id and drives the segregation-of-duties
      rule V33. Two distinct planner ids are required to run an allocation and then fund from it.
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST|PATCH /capital/facilities, POST|PATCH /capital/departments"
      - "POST|PATCH /capital/cycles and every cycle stage transition (open-intake, close-intake, score, allocate, commit)"
      - "POST /capital/allocations/{id}/release-contingency"
      - "POST|PATCH /capital/assets, POST /capital/assets/{id}/service-events, POST /capital/assets/{id}/decommission"
      - "POST /capital/requests/{id}/screen, POST /capital/requests/{id}/fund, POST /capital/requests/{id}/withdraw-funding"
      - "POST|PATCH /capital/committee-members, POST|PATCH /capital/gpo-contracts"
      - "POST /capital/requests/{id}/quotes and every vendor-quote action (counter, revise, accept, withdraw)"
      - "POST /capital/installation-projects/{id}/cancel"
    shared_operations: ["every GET endpoint"]

  - name: ClinicalRequester
    identity: "entity_backed:Department"
    description: |
      A clinical department raising replacement requests. X-User-ID is the Department.id, and V05
      rejects any attempt to create, edit, submit or withdraw a request whose department_id differs.
    exclusive_operations:
      - "POST /capital/requests, PATCH /capital/requests/{id}"
      - "POST /capital/requests/{id}/submit, POST /capital/requests/{id}/withdraw"
    shared_operations: ["every GET endpoint"]

  - name: FacilityDirector
    identity: "entity_backed:Facility"
    description: |
      Facility operations leadership owning installation execution. X-User-ID is the Facility.id, and
      V06 rejects any project write whose project.facility_id differs. A director cannot cancel a
      project — cancellation releases capital-relevant windows and is reserved to CapitalPlanner.
    exclusive_operations:
      - "POST /capital/requests/{id}/installation-projects, PATCH /capital/installation-projects/{id}"
      - "POST /capital/installation-projects/{id}/advance-construction"
      - "POST /capital/installation-projects/{id}/advance-equipment"
      - "POST /capital/installation-projects/{id}/go-live"
    shared_operations: ["every GET endpoint"]

  - name: CommitteeMember
    identity: "entity_backed:CommitteeMember"
    description: |
      A seated capital committee member. X-User-ID is the CommitteeMember.id; the seat, facility scope,
      department conflict and sponsorship exclusion of committee_tally step 1 are all resolved from that
      row. Only the CHAIR seat may close voting (V36) and only the SAFETY_OFFICER seat may veto (V35).
    exclusive_operations:
      - "POST /capital/requests/{id}/votes"
      - "POST /capital/requests/{id}/committee-decision"
    shared_operations: ["every GET endpoint"]

  - name: ComplianceAuditor
    identity: opaque
    description: |
      Internal audit. X-User-ID is an opaque auditor identifier. The auditor owns the
      post-implementation utilization audit and nothing else; it may not fund, screen, vote or install.
    exclusive_operations:
      - "POST /capital/requests/{id}/audits"
      - "POST /capital/audits/{id}/collect"
    shared_operations: ["every GET endpoint"]
