              as: ThirdPartyInspector
              as_user_id: "${agency}"
              captures: { i3: "$.data.id" }
            - call: "POST /modular/inspections/${i3}/record-result"
              payload: { result: "PASS", defect_count: 0, severity_max: 0 }
              as: ThirdPartyInspector
