  # ---------------------------------------------------------------------------
  # SECTION: selector_policy (complexity layer)
  # The draw is a policy, not a query: Stage 4 of calculations.sample_selection_rank_score
  # declares a full deterministic ordering per basis and forbids Deal.id as a tie-break.
  # One instance per declared tie-break level, plus one for response ordering.
  # ---------------------------------------------------------------------------
  - section: selector_policy
    instances:

      - name: stratified_score_tie_is_broken_by_segment_rank_ascending
        claim_type: tie_break_ordering
        grounds:
          - calculations.sample_selection_rank_score.formula
          - calculations.sample_selection_rank_score.constants.SEGMENT_RANK
          - endpoints.POST /sampling-frames/{frame_id}/draw
        distinguishing_aspect: "Two deals share every scoring input except segment, so under STRATIFIED_BY_SEGMENT (no segment multiplier) both score exactly 0.9956 and the winner is decided purely by SEGMENT_RANK ascending: ENTERPRISE (1) beats MIDMARKET (2). This is where \"stratification happens in the ordering, not in the score\" becomes observable — an implementation that folds segment into the score would produce two different scores instead."
        test_recipe:
          setup: ["one ACTIVE program with a PRIMARY competitor and two LOST deals of 300000.00 closing 2026-06-15, one ENTERPRISE and one MIDMARKET, both with consented contacts; a sealed STRATIFIED_BY_SEGMENT frame with quota_lost 2"]
