        grounds:
          - state_machines.PartnerAgreement.DRAFT_to_PROVIDER_PROPOSED
          - state_machines.PartnerAgreement.PROVIDER_PROPOSED_to_MERCHANT_COUNTERED
          - state_machines.PartnerAgreement.MERCHANT_COUNTERED_to_PROVIDER_PROPOSED
          - validations[priority=80]
          - entities.PartnerAgreement.fields.round_count
          - entities.NegotiationRound.fields.proposer_role
          - concurrency_rules[propose-stale-agreement]
          - concurrency_rules[counter-stale-agreement]
        distinguishing_aspect: |
          PartnerAgreement re-enters PROVIDER_PROPOSED after leaving it, so the state graph is
          a two-node cycle rather than a forward chain, and the cycle is bounded by
          round_count rather than by state: the 5th round is refused with
          ERR_NEGOTIATION_ROUND_LIMIT even though MERCHANT_COUNTERED -> PROVIDER_PROPOSED is a
          declared transition.
