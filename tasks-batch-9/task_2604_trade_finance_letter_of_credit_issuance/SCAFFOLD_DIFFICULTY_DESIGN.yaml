          A DIFFERENT boundary metric on a DIFFERENT endpoint: a MILLISECOND-RESOLUTION
          TIMESTAMP probed on POST /presentations/{id}/refuse, not a monetary quantity on
          POST /credits/{id}/issue. A refusal stamped exactly at
          2026-09-21T23:59:59.999Z is timely, while one stamped
