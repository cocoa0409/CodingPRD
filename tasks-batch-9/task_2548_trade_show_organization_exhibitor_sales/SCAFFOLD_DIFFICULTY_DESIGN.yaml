            - call: "POST /space-contracts"
              payload: { show_id: "${show_id}", exhibitor_id: "${ex1}", expected_show_version: "${show_v1}", requested_sqft: 400, premium_placement_requested: true, booth_ids: ["${b_a}"] }
              as: SalesRep
              captures: { sc1: $.data.id }
          trigger:
