      - name: equipment_mismatch_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_EQUIPMENT_MISMATCH]"]
        distinguishing_aspect: "Case requiring IVUS cannot schedule onto a room whose equipment_profile lacks IVUS (ERR_EQUIPMENT_MISMATCH 422); a room with IVUS accepts it."
        test_recipe:
          setup: ["URGENT case POSTED with equipment_needs [IVUS]; room R1 without IVUS; room R2 with IVUS; beds B1, B2"]
          setup_api_calls:
