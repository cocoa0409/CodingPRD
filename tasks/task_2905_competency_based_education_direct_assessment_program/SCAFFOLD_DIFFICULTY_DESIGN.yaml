# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2905 — Competency-Based Education & Direct Assessment Program
#
# Nine §0.5 rule_id blocks, two instances each (18 instances total).
# Every `grounds:` entry resolves into SCAFFOLD.yaml §1.1-§1.7.
# Every `setup_api_calls:` / `trigger:` chain runs from an empty database using
# only endpoints declared in §1.5, and every ${var} is bound by an earlier
# `captures:` in the same instance.
# All instants are ISO-8601 UTC with exactly three fractional digits, matching
# §1.1's datetime convention. Every numeric literal in `assert:` was computed by
# executing the relevant §1.3 formula, not estimated.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: attempt_score_provisional_vs_final_two_readers
        grounds:
          - calculations.attempt_final_score
          - entities.AssessmentAttempt.fields.is_provisional_score
          - entities.AssessmentAttempt.fields.score_variant
          - state_machines.AssessmentAttempt.UNDER_REVIEW_to_SCORED_MASTERED
          - entities.Program.fields.irr_tolerance_pct
        distinguishing_aspect: |
          This dual variant lives in the SCORING domain on AssessmentAttempt: the
          PROVISIONAL_SINGLE_READER variant reports reader 1's own 82.00 with
          is_provisional_score true and awards no units, while the
          TWO_READER_MEAN variant on the very same attempt reports 83.00 with
          is_provisional_score false and awards the competency's 4 units — the
          two variants therefore differ by 1.00 percentage point and by whether
          Student.mastered_unit_total moves at all.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program CBE-BSIT with the default mastery threshold 80.00, units_per_credit_hour 3.0 and irr_tolerance_pct 5.00"
            - "competency IT-101 worth 4 units with a PUBLISHED two-reader blueprint of two equally weighted 100-point dimensions"
            - "ACTIVE student enrolled in the program with an ACTIVE subscription term covering 2026-09-01 to 2026-12-01"
            - "two independent CERTIFIED evaluators, neither linked to any mentor appointment"
            - "one attempt on IT-101 already submitted with its integrity attestation, so the attempt sits in UNDER_REVIEW with no scores"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v1}", dimensions: [{ code: "D1", weight: 0.5000, max_score: 100, critical: false }, { code: "D2", weight: 0.5000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 2, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
              captures: { bp1_id: $.data.id }
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /subscription-terms/${term_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /evaluators"
              payload: { full_name: "Reader One", email: "r1@example.edu", certification_level: "SENIOR" }
              as: Registrar
              captures: { ev1_id: $.data.id }
            - call: "POST /evaluators"
              payload: { full_name: "Reader Two", email: "r2@example.edu", certification_level: "SENIOR" }
              as: Registrar
              captures: { ev2_id: $.data.id }
            - call: "POST /assessment-attempts"
              payload: { student_id: "${stu_id}", competency_id: "${c1_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att_id: $.data.id }
            - call: "POST /assessment-attempts/${att_id}/submit"
              payload: { artifact_hash: "hash-it101-a", integrity_attestation_accepted: true, client_fingerprint: "fp-ada-1" }
              as: Student
              as_user_id: "${stu_id}"
          trigger:
            - call: "POST /assessment-attempts/${att_id}/scores"
              payload: { evaluator_id: "${ev1_id}", dimension_scores: [{ code: "D1", score: 82 }, { code: "D2", score: 82 }] }
              as: Evaluator
              as_user_id: "${ev1_id}"
              captures: { s1_pct: $.data.weighted_score_pct }
            - call: "GET /assessment-attempts/${att_id}"
              payload: {}
              as: Registrar
              captures: { prov_pct: $.data.final_score_pct, prov_flag: $.data.is_provisional_score, prov_variant: $.data.score_variant, prov_status: $.data.status }
            - call: "GET /students/${stu_id}"
              payload: {}
              as: Registrar
              captures: { prov_units: $.data.mastered_unit_total }
            - call: "POST /assessment-attempts/${att_id}/scores"
              payload: { evaluator_id: "${ev2_id}", dimension_scores: [{ code: "D1", score: 84 }, { code: "D2", score: 84 }] }
              as: Evaluator
              as_user_id: "${ev2_id}"
              captures: { s2_pct: $.data.weighted_score_pct }
          assert:
            - "${s1_pct} == 82.00"
            - "${s2_pct} == 84.00"
            - "${prov_pct} == 82.00"
            - "${prov_flag} == true"
            - "${prov_variant} == PROVISIONAL_SINGLE_READER"
            - "${prov_status} == UNDER_REVIEW"
            - "${prov_units} == 0"
            - "AssessmentAttempt.${att_id}.final_score_pct == 83.00"
            - "AssessmentAttempt.${att_id}.is_provisional_score == false"
            - "AssessmentAttempt.${att_id}.score_variant == TWO_READER_MEAN"
            - "AssessmentAttempt.${att_id}.status == SCORED_MASTERED"
            - "AssessmentAttempt.${att_id}.mastered_at_utc == 2026-09-01T00:00:00.000Z"
            - "Student.${stu_id}.mastered_unit_total == 4"
            - "Student.${stu_id}.mastered_competency_count == 1"
            - "Student.${stu_id}.cumulative_credit_equivalency == 1.3"
            - "the provisional figure 82.00 and the final figure 83.00 differ, and only the final figure awarded units"

      - name: credit_equivalency_aid_floor_vs_transcript_round
        grounds:
          - calculations.credit_hour_equivalency
          - entities.SubscriptionTerm.fields.credit_equivalency_earned
          - entities.TranscriptRecord.fields.translated_credit_hours
          - entities.Student.fields.cumulative_credit_equivalency
          - calculations.transcript_translation
        distinguishing_aspect: |
          This dual variant lives in the FINANCIAL-AID / ACADEMIC-RECORDS domain
          on SubscriptionTerm and TranscriptRecord, not on scoring: the same 10
          mastered units yield credit_equivalency_earned == 3 under the
          AID_TERM_FLOOR variant and translated_credit_hours == 3.3 under the
          TRANSCRIPT_CUMULATIVE_ROUND variant, a 0.3 credit-hour divergence that
          exists only because one variant floors per term and the other rounds
          half-up cumulatively.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program CBE-BSIT with units_per_credit_hour 3.0"
            - "competencies IT-101 (4 units) and IT-102 (6 units), each with a PUBLISHED single-reader blueprint of two equally weighted 100-point dimensions"
            - "ACTIVE student with an ACTIVE term covering 2026-09-01 to 2026-12-01"
            - "both competencies mastered inside that one term at 85.00, so 10 units sit in a single term"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology", units_per_credit_hour: 3.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v1}", dimensions: [{ code: "D1", weight: 0.5000, max_score: 100, critical: false }, { code: "D2", weight: 0.5000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-102", title: "Systems Analysis", unit_value: 6, level: "CORE" }
              as: Registrar
              captures: { c2_id: $.data.id, c2_v1: $.data.version }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c2_id}", expected_competency_version: "${c2_v1}", dimensions: [{ code: "D1", weight: 0.5000, max_score: 100, critical: false }, { code: "D2", weight: 0.5000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /subscription-terms/${term_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /evaluators"
              payload: { full_name: "Reader One", email: "r1@example.edu", certification_level: "SENIOR" }
              as: Registrar
              captures: { ev1_id: $.data.id }
            - call: "POST /assessment-attempts"
              payload: { student_id: "${stu_id}", competency_id: "${c1_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att1_id: $.data.id }
            - call: "POST /assessment-attempts/${att1_id}/submit"
              payload: { artifact_hash: "hash-it101-a", integrity_attestation_accepted: true, client_fingerprint: "fp-ada-1" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /assessment-attempts/${att1_id}/scores"
              payload: { evaluator_id: "${ev1_id}", dimension_scores: [{ code: "D1", score: 85 }, { code: "D2", score: 85 }] }
              as: Evaluator
              as_user_id: "${ev1_id}"
            - call: "POST /assessment-attempts"
              payload: { student_id: "${stu_id}", competency_id: "${c2_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att2_id: $.data.id }
            - call: "POST /assessment-attempts/${att2_id}/submit"
              payload: { artifact_hash: "hash-it102-a", integrity_attestation_accepted: true, client_fingerprint: "fp-ada-1" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /assessment-attempts/${att2_id}/scores"
              payload: { evaluator_id: "${ev1_id}", dimension_scores: [{ code: "D1", score: 85 }, { code: "D2", score: 85 }] }
              as: Evaluator
              as_user_id: "${ev1_id}"
          trigger:
            - call: "GET /subscription-terms/${term_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { term_units: $.data.units_mastered_in_term, term_credits: $.data.credit_equivalency_earned }
            - call: "POST /transcript-records"
              payload: { student_id: "${stu_id}", purpose: "TRANSFER" }
              as: Registrar
              captures: { tr_id: $.data.id }
          assert:
            - "${term_units} == 10"
            - "${term_credits} == 3"
            - "TranscriptRecord.${tr_id}.total_mastered_units == 10"
            - "TranscriptRecord.${tr_id}.translated_credit_hours == 3.3"
            - "TranscriptRecord.${tr_id}.line_credit_hour_sum == 3.33"
            - "TranscriptRecord.${tr_id}.rounding_residual_credit_hours == 0.03"
            - "TranscriptRecord.${tr_id}.competency_line_count == 2"
            - "Student.${stu_id}.cumulative_credit_equivalency == 3.3"
            - "the aid figure 3 (floor per term) is strictly less than the transcript figure 3.3 (round half-up cumulative) on identical mastery data"

  - rule_id: combinatorial_formula
    instances:
      - name: rubric_sum_then_round_dimension_order
        grounds:
          - calculations.rubric_weighted_score
          - entities.AssessmentBlueprint.fields.dimensions
          - entities.EvaluatorScore.fields.weighted_score_pct
          - entities.EvaluatorScore.fields.critical_fail
          - entities.Program.fields.critical_dimension_min_ratio
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned. Three dimensions whose weights
          0.3400 / 0.3300 / 0.3300 and max_score 7 make sum-then-round and
          round-then-sum disagree — the normative single rounding at step 3 yields
          76.14 while rounding each dimension's contribution first yields 76.15.
          The 0.01 gap is the whole point of the instance, and the critical-flag
          branch is deliberately NOT exercised here (D1's ratio 5/7 = 0.7143 clears
          the 0.70 floor), so the assertion isolates the rounding order alone.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program with the default mastery threshold 80.00, default critical_dimension_min_ratio 0.70 and default attempt_cooloff_hours 48"
            - "competency IT-201 worth 4 units with a single-reader WEIGHTED_PLUS_ALL_CRITICAL blueprint of three dimensions: D1 weight 0.3400 max 7 critical, D2 weight 0.3300 max 7, D3 weight 0.3300 max 7"
            - "ACTIVE student with an ACTIVE term covering 2026-09-01 to 2026-12-01"
            - "one CERTIFIED evaluator and one submitted attempt sitting in UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology" }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-201", title: "Secure Coding Review", unit_value: 4, level: "CORE" }
              as: Registrar
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v1}", dimensions: [{ code: "D1", weight: 0.3400, max_score: 7, critical: true }, { code: "D2", weight: 0.3300, max_score: 7, critical: false }, { code: "D3", weight: 0.3300, max_score: 7, critical: false }], passing_rule: "WEIGHTED_PLUS_ALL_CRITICAL", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /subscription-terms/${term_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /evaluators"
              payload: { full_name: "Reader One", email: "r1@example.edu", certification_level: "SENIOR" }
              as: Registrar
              captures: { ev1_id: $.data.id }
            - call: "POST /assessment-attempts"
              payload: { student_id: "${stu_id}", competency_id: "${c1_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att_id: $.data.id }
            - call: "POST /assessment-attempts/${att_id}/submit"
              payload: { artifact_hash: "hash-it201-a", integrity_attestation_accepted: true, client_fingerprint: "fp-ada-1" }
              as: Student
              as_user_id: "${stu_id}"
          trigger:
            - call: "POST /assessment-attempts/${att_id}/scores"
              payload: { evaluator_id: "${ev1_id}", dimension_scores: [{ code: "D1", score: 5 }, { code: "D2", score: 5 }, { code: "D3", score: 6 }] }
              as: Evaluator
              as_user_id: "${ev1_id}"
              captures: { score_id: $.data.id, pct: $.data.weighted_score_pct, crit: $.data.critical_fail }
          assert:
            - "${pct} == 76.14"
            - "${pct} != 76.15"
            - "${crit} == false"
            - "EvaluatorScore.${score_id}.reader_ordinal == 1"
            - "AssessmentAttempt.${att_id}.final_score_pct == 76.14"
            - "AssessmentAttempt.${att_id}.score_variant == SINGLE_READER_FINAL"
            - "AssessmentAttempt.${att_id}.status == SCORED_NOT_MASTERED"
            - "AssessmentAttempt.${att_id}.cooloff_until_utc == 2026-09-03T00:00:00.000Z"
            - "Student.${stu_id}.mastered_unit_total == 0"

      - name: term_close_refund_evaluation_order
        grounds:
          - calculations.term_close_aid_return
          - state_machines.SubscriptionTerm.ACTIVE_to_LAPSED
          - state_machines.AidDisbursement.DISBURSED_to_RETURNED
          - entities.SubscriptionTerm.fields.net_institutional_charge_cents
          - entities.AidDisbursement.fields.school_return_share_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with a pinned evaluation order.
          school_return_share_cents is a function of net_institutional_charge_cents,
          which is a function of institutional_refund_cents, which is a function of
          earned_pct — yet unearned_aid_cents is taken from GROSS disbursed aid, not
          from the net charge. The pinned order 1-8 is what produces refund 251363,
          net 123637, unearned 134060 and school share 82874; feeding the net charge
          back into step 6, or applying step 8's factor to gross tuition, would give
          different numbers. Unlike the mode (b) instance this one has no rounding
          ambiguity at all — every step rounds once to 0 dp — it is purely about
          which quantity feeds which step.
        test_recipe:
          setup:
            - "logical clock at 2026-09-01T00:00:00.000Z"
            - "PUBLISHED program with units_per_credit_hour 3.0, aid_min_credit_equivalency 1 and the default aid_earned_pct_full_threshold 0.6000"
            - "competency IT-101 worth 4 units with a single-reader blueprint, mastered so the term has earned 1 whole credit-hour equivalency"
            - "ACTIVE student with an ACTIVE term covering 2026-09-01 to 2026-12-01 (91 days) and tuition 375000 cents"
            - "a DISBURSED aid award of 200000 cents on that term"
            - "the clock then advanced to 2026-10-01 so the term can be closed LAPSED after 30 attended days"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /programs"
              payload: { code: "CBE-BSIT", title: "BS Information Technology", units_per_credit_hour: 3.0 }
              as: Registrar
              captures: { prog_id: $.data.id }
            - call: "POST /competencies"
              payload: { program_id: "${prog_id}", code: "IT-101", title: "Relational Data Modeling", unit_value: 4, level: "FOUNDATION" }
              as: Registrar
              captures: { c1_id: $.data.id, c1_v1: $.data.version }
            - call: "POST /assessment-blueprints"
              payload: { competency_id: "${c1_id}", expected_competency_version: "${c1_v1}", dimensions: [{ code: "D1", weight: 1.0000, max_score: 100, critical: false }], passing_rule: "WEIGHTED_ONLY", required_evaluator_count: 1, effective_from_utc: "2026-09-01T00:00:00.000Z" }
              as: Registrar
            - call: "POST /programs/${prog_id}/publish"
              payload: {}
              as: Registrar
            - call: "POST /students"
              payload: { program_id: "${prog_id}", full_name: "Ada Learner", email: "ada@example.edu" }
              as: Registrar
              captures: { stu_id: $.data.id }
            - call: "POST /students/${stu_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /subscription-terms"
              payload: { student_id: "${stu_id}", term_start_utc: "2026-09-01T00:00:00.000Z", term_end_utc: "2026-12-01T00:00:00.000Z", tuition_cents: 375000 }
              as: Registrar
              captures: { term_id: $.data.id }
            - call: "POST /subscription-terms/${term_id}/activate"
              payload: {}
              as: Registrar
            - call: "POST /evaluators"
              payload: { full_name: "Reader One", email: "r1@example.edu", certification_level: "SENIOR" }
              as: Registrar
              captures: { ev1_id: $.data.id }
            - call: "POST /assessment-attempts"
              payload: { student_id: "${stu_id}", competency_id: "${c1_id}" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { att_id: $.data.id }
            - call: "POST /assessment-attempts/${att_id}/submit"
              payload: { artifact_hash: "hash-it101-a", integrity_attestation_accepted: true, client_fingerprint: "fp-ada-1" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /assessment-attempts/${att_id}/scores"
              payload: { evaluator_id: "${ev1_id}", dimension_scores: [{ code: "D1", score: 90 }] }
              as: Evaluator
              as_user_id: "${ev1_id}"
            - call: "GET /subscription-terms/${term_id}"
              payload: {}
              as: FinancialAidOfficer
              captures: { term_v2: $.data.version }
            - call: "POST /aid-disbursements"
              payload: { student_id: "${stu_id}", term_id: "${term_id}", scheduled_amount_cents: 200000, expected_term_version: "${term_v2}" }
              as: FinancialAidOfficer
              captures: { aid_id: $.data.id }
            - call: "POST /aid-disbursements/${aid_id}/disburse"
              payload: {}
              as: FinancialAidOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /subscription-terms/${term_id}/close"
              payload: { outcome: "LAPSED", effective_utc: "2026-10-01T00:00:00.000Z" }
