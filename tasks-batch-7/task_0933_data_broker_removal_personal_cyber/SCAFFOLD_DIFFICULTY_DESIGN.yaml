  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: legal_hold_gate_beats_scan_quota_exhausted
        grounds:
          - validations[priority=13]
          - validations[priority=44]
          - errors[ERR_ACCOUNT_LEGAL_HOLD]
          - errors[ERR_SCAN_QUOTA_EXCEEDED]
          - state_machines.Account.HOLD_OFF_to_HOLD_ON
        distinguishing_aspect: |
          Error-category pair `state` (rung 13, ERR_ACCOUNT_LEGAL_HOLD) versus `business_fiscal`
          (rung 44, ERR_SCAN_QUOTA_EXCEEDED). One POST /scan-runs violates both and must return the
          legal-hold error; legal hold is chosen over suspension precisely because it fires no
          cascade, so exactly two rungs are in conflict.
        test_recipe:
          setup:
            - "A one-scan plan (scan_quota_per_cycle 1), an ACTIVE account, an ACTIVE profile with one identifier."
            - "The single SCAN unit has been consumed by an INITIAL scan that reached COMPLETED at 2026-05-01T00:00:00Z, so scan_units_remaining is 0."
            - "The clock is at 2026-05-09T00:00:00Z, eight whole days later, so the 7-day recurring-scan interval is satisfied and rung 29 does NOT fire."
            - "The account is placed under legal hold."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "SOLO", name: "Solo Micro", monthly_fee_cents: 900, max_members: 1, profile_quota_per_cycle: 1, scan_quota_per_cycle: 1, removal_quota_per_cycle: 5, per_member_removal_subcap: 5 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_micro_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_micro_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield", rescan_cadence_days: 30, two_factor_attested: false }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, prof_v1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${prof_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan1_id: $.data.id }
            - call: "POST /scan-runs/${scan1_id}/start"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /scan-runs/${scan1_id}/complete"
              payload: {}
              as: PrivacyAgent
              as_user_id: "agent-alpha"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-09T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /accounts/${acct_id}/legal-hold"
              payload: { hold_state: "HOLD_ON" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "RECURRING" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == ERR_ACCOUNT_LEGAL_HOLD (rung 13), NOT ERR_SCAN_QUOTA_EXCEEDED (rung 44)"
            - "Account.${acct_id}.scan_units_remaining == 0 — the fiscal rung really was violated as well"
            - "Account.${acct_id}.legal_hold == true"
            - "GET /scan-runs?profile_id=${prof_id} still returns total_count == 1 — no ScanRun row was created"
            - "Lifting the hold with hold_state HOLD_OFF and repeating the call then returns ERR_SCAN_QUOTA_EXCEEDED, proving the two rungs are independently reachable"

      - name: retired_broker_beats_escalation_cap
        grounds:
          - validations[priority=22]
          - validations[priority=33]
          - errors[ERR_BROKER_RETIRED]
          - errors[ERR_ESCALATION_CAP_REACHED]
          - state_machines.RemovalRequest.REJECTED_to_ESCALATED
        distinguishing_aspect: |
          Error-category pair `business_referential` (rung 22, ERR_BROKER_RETIRED) versus
          `business_constraint` (rung 33, ERR_ESCALATION_CAP_REACHED) — a different pair from the
          state/business_fiscal conflict above. One POST /removal-requests/{id}/escalate violates
          both and must return the broker error.
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, ACTIVE profile with one identifier, one broker."
            - "One RemovalRequest driven twice around REJECTED -> ESCALATED -> SUBMITTED -> ACKNOWLEDGED -> REJECTED, so it sits in REJECTED with escalation_count 2."
            - "The broker is then retired."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
