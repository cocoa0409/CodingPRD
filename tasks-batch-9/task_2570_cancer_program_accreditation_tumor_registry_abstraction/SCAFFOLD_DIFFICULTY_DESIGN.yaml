        grounds:
          - state_machines.Abstraction.SUBMITTED_FOR_QA_to_APPROVED
          - state_machines.TumorCase.QA_PENDING_to_COMPLETED
          - calculations.registry_posture
          - state_machines.RegistrySubmission.HOLD_to_DRAFT
          - calculations.abstract_timeliness
          - calculations.abstractor_productivity
          - endpoints[POST /cancer-registry/abstractions/{abstractionId}/qa-decision]
        distinguishing_aspect: |
          A single qa-decision APPROVED propagates four links deep and in the RELEASING direction:
          Abstraction -> APPROVED, TumorCase -> COMPLETED, CancerProgram.overdue_backlog_count
          2 -> 1 flipping registry_posture FROZEN -> OPEN, and every held RegistrySubmission
