              as_user_id: "uw-001"
              captures: { int1: $.data.id }
            - call: "POST /builders-risk/named-insured-interests/${int1}/acknowledge"
              payload: {}
              as: LossPayee
              as_user_id: "${int1}"
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/bind"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/incept"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/claims"
              payload: { policy_id: "${pl1}", peril: "FIRE", loss_date: "2026-11-15T00:00:00Z", description: "Sprinkler head sheared during steel erection" }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { cl1: $.data.id }
          trigger:
            - call: "POST /builders-risk/claims/${cl1}/adjust"
              payload: { outcome: "ADJUST", adjustment_basis: "RECONSTRUCTION_COST", continuing_pm_weeks: 4, loss_items: [ { part_type: "SOFT_COST", gross_loss_cents: 5000000 }, { part_type: "IN_TRANSIT", gross_loss_cents: 25000000 }, { part_type: "MATERIALS_ON_SITE", gross_loss_cents: 40000000 }, { part_type: "WATER_DAMAGE", gross_loss_cents: 12000000 } ] }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { st: $.data.adjustment_status, ind: $.data.indemnity_cents, unc: $.data.uncovered_cents, res: $.data.outstanding_reserve_cents }
          assert:
            - "st == ADJUSTED and ind == 72091360"
            - "allocation_lines has exactly 4 entries in the order [MATERIALS_ON_SITE, IN_TRANSIT, WATER_DAMAGE, SOFT_COST], i.e. ALLOCATION_ORDER and not the request order"
            - "allocated_cents per line: MATERIALS_ON_SITE 33200000, IN_TRANSIT 20000000, WATER_DAMAGE 12960000, SOFT_COST 5931360"
            - "deductible_applied_cents is 10000000 on the MATERIALS_ON_SITE line and 0 on the other three - one deductible per adjustment, on the greatest non-DELAY line"
            - "the SOFT_COST line's covered_basis_cents == 5931360 == 5400000 + 531360, so the continuing-PM amount lands on the existing SOFT_COST line rather than creating a fifth line"
            - "line uncovered_cents: IN_TRANSIT 7000000 (27000000 - 20000000) and 0 on the other three; claim.uncovered_cents == 17000000 == 7000000 + 10000000"
            - "res == 72091360 and Claim.${cl1}.total_incurred_cents == 72091360 with paid_cents == 0"
            - "every CoveragePart still has eroded_cents == 0 and BuildersRiskPolicy.${pl1}.eroded_total_cents == 0 - allocation is not erosion"

      - name: corner_per_line_rounding_versus_sum_then_round
        claim_type: precision
        grounds:
          - calculations.claim_indemnity_allocation.rounding
          - calculations.claim_indemnity_allocation.constants.RECONSTRUCTION_UPLIFT
        excluded_because:
          difficulty_instance: "combinatorial_formula / claim_allocation_round_per_line_then_sum_mode_b"
          rationale: "The §1.8 instance already pins the round-per-line-then-sum order with a fixture whose two loss items differ by exactly one cent from the sum-then-round answer, and it also pins where the continuing-PM rounding happens. A separate §1.9 precision instance would assert the same two literals from a weaker fixture."

      - name: corner_delay_indemnity_waiting_period_threshold
        claim_type: threshold
        grounds:
          - calculations.delay_in_completion_indemnity
          - calculations.delay_in_completion_indemnity.constants.WAITING_PERIOD_DAYS
        excluded_because:
          difficulty_instance: "boundary_precision_check / delay_waiting_period_at_four_five_and_six_raw_days"
          rationale: "The §1.8 instance walks raw delay of 4, 5 and 6 days against the same policy and asserts 0 / 0 / one day of indemnity, which is exactly the threshold-1 / threshold / threshold+1 triple this row calls for."

      - name: corner_facility_overlap_exposure_interval_merge
        claim_type: interval_merge
        grounds:
          - calculations.facility_overlap_exposure
          - entities.TemporaryStorageAssignment.window_start
          - entities.StorageFacility.aggregate_capacity_cents
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / facility_capacity_uses_peak_overlap_and_admits_adjacent_handoffs"
          rationale: "That §1.8 instance already covers all three interval cases on one facility: overlapping assignments summed at the peak instant, an adjacent handoff (gap 0) admitted, and a disjoint pair that never stacks."

      - name: corner_testing_window_separation_interval_merge
        claim_type: interval_merge
        grounds:
          - calculations.testing_window_separation
          - calculations.testing_window_separation.constants.HOT_WORK_BUFFER_HOURS
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / testing_window_hot_work_buffer_is_symmetric_and_rejects_a_one_second_shortfall"
          rationale: "The buffered-interval overlap test, including the exactly-at-buffer acceptance and the one-second shortfall rejection in both directions, is pinned there with literal timestamps."

      - name: corner_extension_premium_constraint_propagation_chain
        claim_type: constraint_propagation
        grounds:
          - calculations.extension_premium_adjustment
          - calculations.extension_premium_adjustment.constants.MAX_CUMULATIVE_EXTENSION_RATIO
        excluded_because:
          difficulty_instance: "combinatorial_formula / extension_premium_pinned_evaluation_order_mode_c"
          rationale: "The §1.8 instance pins the whole propagation chain - cumulative-days ratio, slip factor selection, CAT re-slip load and the resulting AP - in one fixture and shows it reaches a fixed point after the second endorsement, so a separate chain test adds no new literal."

      - name: corner_premium_ledger_running_total_after_reversal
        claim_type: aggregation
        grounds:
          - calculations.premium_ledger_balance
          - entities.PremiumTransaction.sequence_no
          - entities.PremiumTransaction.reverses_sequence_no
        excluded_because:
          difficulty_instance: "compensating_invariant / extension_rescission_conserves_the_premium_ledger_balance"
          rationale: "Running total after an append and after a reversal, plus the invariant that the reversal restores the pre-endorsement balance exactly, are all asserted there with literal cents."

      - name: corner_coverage_erosion_reconciliation_after_reversal
        claim_type: reconciliation
        grounds:
          - calculations.coverage_erosion_reconciliation
          - entities.CoveragePart.eroded_cents
          - entities.BuildersRiskPolicy.eroded_total_cents
        excluded_because:
          difficulty_instance: "compensating_invariant / payment_void_conserves_erosion_and_reserve_across_a_multi_part_claim"
          rationale: "That instance voids one of three payments across two coverage parts and asserts every erosion, reserve and paid figure back to its pre-payment literal, which subsumes a plain reconciliation-after-delete claim."

      - name: corner_referral_threshold_boundary_on_the_risk_score
        claim_type: threshold
        grounds:
          - calculations.project_risk_score
          - calculations.quote_premium.constants.REFERRAL_THRESHOLD
          - state_machines[BuildersRiskPolicy].DRAFT->REFERRED
        excluded_because:
          difficulty_instance: "boundary_precision_check / referral_threshold_at_74_75_and_76_score_points"
          rationale: "The 74 / 75 / 76 triple against REFERRAL_SCORE_THRESHOLD is constructed there from three projects that differ only in insured value, so the boundary is already pinned on both sides."

      - name: corner_claim_basis_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.claim_indemnity_allocation.variants
          - entities.Claim.adjustment_basis
        excluded_because:
          difficulty_instance: "dual_variant_calc / claim_indemnity_reconstruction_cost_versus_actual_loss"
          rationale: "Two identical losses adjusted on RECONSTRUCTION_COST and ACTUAL_LOSS with the exact delta are asserted there, including that the continuing-PM component follows the basis."

      - name: corner_project_risk_score_weighted_components
        claim_type: weighted_scoring
        grounds:
          - calculations.project_risk_score
          - calculations.project_risk_score.variants
        excluded_because:
          difficulty_instance: "dual_variant_calc / project_risk_score_submission_basis_versus_audit_basis"
          rationale: "Component weights, the per-component caps and the 100-point overall cap are all exercised there across both bases, and that instance also proves a weight-input change re-scores only the audit variant."

  - section: validations
    instances:
      - name: corner_duplicate_facility_site_code_is_rejected_on_the_second_register
        claim_type: violation_to_error
        grounds:
          - validations[priority 42].ERR_DUPLICATE_SITE_CODE
          - entities.StorageFacility.site_code
          - endpoints.POST /builders-risk/facilities
        distinguishing_aspect: "site_code uniqueness is global across every StorageFacility row rather than scoped to a policy or a protection class, so a second facility registered with the same code but a different name, distance, capacity and protection class still returns ERR_DUPLICATE_SITE_CODE (409) and leaves the facility count at 1."
        test_recipe:
          setup:
            - "One facility already registered with site_code 'WH-01'."
          setup_api_calls:
            - call: "POST /builders-risk/facilities"
              payload: { name: "Northside Warehouse", site_code: "WH-01", distance_from_site_miles: 12, aggregate_capacity_cents: 500000000, protection_class: "SPRINKLERED" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /builders-risk/facilities"
              payload: { name: "Southside Yard", site_code: "WH-01", distance_from_site_miles: 40, aggregate_capacity_cents: 100000000, protection_class: "NON_SPRINKLERED" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { eid: $.data.error_id }
          assert:
            - "eid == ERR_DUPLICATE_SITE_CODE with HTTP 409"
            - "GET /builders-risk/facilities returns total_count == 1 - the rejected register left no row"
            - "GET /builders-risk/facilities/${f1} still reports name == Northside Warehouse, aggregate_capacity_cents == 500000000 and version == 1, so the collision did not partially overwrite the incumbent"

      - name: corner_a_distinct_site_code_registers_with_active_defaults
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 42].ERR_DUPLICATE_SITE_CODE
          - entities.StorageFacility.status
          - entities.StorageFacility.committed_value_cents
        distinguishing_aspect: "With 'WH-01' already taken, 'WH-02' is accepted and comes back ACTIVE with committed_value_cents == 0, proving the uniqueness check is keyed on the exact code and does not reject on any other shared attribute (both rows share name prefix, distance and protection class)."
        test_recipe:
          setup:
            - "One facility already registered with site_code 'WH-01'."
          setup_api_calls:
            - call: "POST /builders-risk/facilities"
              payload: { name: "Northside Warehouse", site_code: "WH-01", distance_from_site_miles: 12, aggregate_capacity_cents: 500000000, protection_class: "SPRINKLERED" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /builders-risk/facilities"
              payload: { name: "Northside Warehouse Annex", site_code: "WH-02", distance_from_site_miles: 12, aggregate_capacity_cents: 500000000, protection_class: "SPRINKLERED" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { f2: $.data.id, st2: $.data.status, cv2: $.data.committed_value_cents }
          assert:
            - "the register returns HTTP 201 and f2 is a non-null id different from f1"
            - "st2 == ACTIVE and cv2 == 0 - both are server-set, not client-supplied"
            - "GET /builders-risk/facilities returns total_count == 2 with both WH-01 and WH-02 present"

      - name: corner_term_end_before_and_equal_to_term_start_are_both_invalid
        claim_type: violation_to_error
        grounds:
          - validations[priority 45].ERR_DATE_RANGE_INVALID
          - entities.BuildersRiskPolicy.term_start_date
          - entities.BuildersRiskPolicy.term_end_date
        distinguishing_aspect: "The term range check is strict: term_end_date equal to term_start_date is rejected with ERR_DATE_RANGE_INVALID just like an earlier end date, so a >= comparison written as > would pass the equal case."
        test_recipe:
          setup:
            - "One ELIGIBLE project screened grade A."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Cedar Mills Warehouse", site_address: "12 Mill Rd, Cedar", construction_type: "FIRE_RESISTIVE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 400000000, cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-03-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "A" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
          trigger:
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-09-01T00:00:00Z", includes_existing_structure: false, deductible_tier: "STANDARD_25K", limit_cents: 200000000, daily_delay_rate_cents: 0 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { eid1: $.data.error_id }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-08-31T00:00:00Z", includes_existing_structure: false, deductible_tier: "STANDARD_25K", limit_cents: 200000000, daily_delay_rate_cents: 0 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { eid2: $.data.error_id }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2026-09-02T00:00:00Z", includes_existing_structure: false, deductible_tier: "STANDARD_25K", limit_cents: 200000000, daily_delay_rate_cents: 0 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
          assert:
            - "eid1 == ERR_DATE_RANGE_INVALID with HTTP 422 (end equal to start)"
            - "eid2 == ERR_DATE_RANGE_INVALID with HTTP 422 (end before start)"
            - "the third call returns HTTP 201 with original_term_days == 1, so the smallest legal term is one day"
            - "GET /builders-risk/policies?project_id=${p1} returns total_count == 1"

      - name: corner_sublimit_sum_may_equal_the_limit_but_not_pass_it_by_one_cent
        claim_type: aggregate_validation
        grounds:
          - validations[priority 90].ERR_SUBLIMIT_EXCEEDS_LIMIT
          - endpoints.POST /builders-risk/coverage-parts
          - endpoints.PATCH /builders-risk/coverage-parts/{id}
        distinguishing_aspect: "Each sublimit is individually far below limit_cents; only the collective total trips the rule, and the total is allowed to reach limit_cents exactly - 200000000 passes, 200000001 is rejected - on both the create and the patch path."
        test_recipe:
          setup:
            - "One ELIGIBLE project with a DRAFT policy: limit_cents 200000000, daily_delay_rate_cents 0, deductible STANDARD_25K."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Cedar Mills Warehouse", site_address: "12 Mill Rd, Cedar", construction_type: "FIRE_RESISTIVE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 400000000, cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-03-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "A" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-03-20T00:00:00Z", includes_existing_structure: false, deductible_tier: "STANDARD_25K", limit_cents: 200000000, daily_delay_rate_cents: 0 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 150000000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp1: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "IN_TRANSIT", sublimit_cents: 50000000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp2: $.data.id, cp2v: $.data.version }
          trigger:
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "WATER_DAMAGE", sublimit_cents: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { eid1: $.data.error_id }
            - call: "PATCH /builders-risk/coverage-parts/${cp2}"
              payload: { sublimit_cents: 50000001 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { eid2: $.data.error_id }
            - call: "PATCH /builders-risk/coverage-parts/${cp2}"
              payload: { sublimit_cents: 49999999 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp2v2: $.data.version }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "WATER_DAMAGE", sublimit_cents: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp3: $.data.id }
          assert:
            - "the two setup creates both return HTTP 201, so a total of exactly 200000000 == limit_cents is admissible"
            - "eid1 == ERR_SUBLIMIT_EXCEEDS_LIMIT with HTTP 422 - a single extra cent over the limit is rejected even though the part itself is 1 cent"
            - "eid2 == ERR_SUBLIMIT_EXCEEDS_LIMIT with HTTP 422 - the patch path evaluates the sum with the NEW value substituted for the old one"
            - "after the rejected patch, GET /builders-risk/coverage-parts/${cp2} still reports sublimit_cents == 50000000 and version == cp2v (the failed patch neither wrote nor bumped the version)"
            - "cp2v2 == cp2v + 1 and the successful patch reports sublimit_cents == 49999999 with available_cents == 49999999"
            - "the final create returns HTTP 201, so the freed cent is immediately reusable: GET /builders-risk/policies/${pl1}/coverage-parts returns total_count == 3 with sublimits 150000000, 49999999 and 1"

      - name: corner_duplicate_part_type_is_rejected_even_when_the_sum_still_fits
        claim_type: violation_to_error
        grounds:
          - validations[priority 90].ERR_DUPLICATE_COVERAGE_PART
          - entities.CoveragePart.part_type
        distinguishing_aspect: "The one-part-per-part_type rule is checked in any status and independently of the aggregate: a second MATERIALS_ON_SITE part of 1 cent on a policy with 199999999 cents of headroom still returns ERR_DUPLICATE_COVERAGE_PART (409), while the same 1-cent sublimit under a different part_type is accepted."
        test_recipe:
          setup:
            - "One ELIGIBLE project with a DRAFT policy (limit_cents 200000000) carrying a single MATERIALS_ON_SITE part of 1 cent."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Cedar Mills Warehouse", site_address: "12 Mill Rd, Cedar", construction_type: "FIRE_RESISTIVE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 400000000, cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-03-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "A" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-03-20T00:00:00Z", includes_existing_structure: false, deductible_tier: "STANDARD_25K", limit_cents: 200000000, daily_delay_rate_cents: 0 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp1: $.data.id }
          trigger:
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { eid1: $.data.error_id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "IN_TRANSIT", sublimit_cents: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp2: $.data.id }
          assert:
            - "eid1 == ERR_DUPLICATE_COVERAGE_PART with HTTP 409"
            - "the second trigger returns HTTP 201 - the collision is on part_type, not on the sublimit value"
            - "GET /builders-risk/policies/${pl1}/coverage-parts returns total_count == 2"
            - "GET /builders-risk/policies/${pl1} shows a version that advanced by exactly one across the two triggers, so the rejected create did not bump the policy version"

      - name: corner_interest_schedule_caps_the_pct_sum_and_the_payee_priority
        claim_type: aggregate_validation
        grounds:
          - validations[priority 90].ERR_INTEREST_PCT_EXCEEDED
          - validations[priority 90].ERR_DUPLICATE_PAYEE_PRIORITY
          - entities.NamedInsuredInterest.insurable_interest_pct
          - entities.NamedInsuredInterest.loss_payee_priority
        distinguishing_aspect: "With OWNER 60 and GENERAL_CONTRACTOR 40 already on the schedule the pct sum sits at exactly 100, so a LENDER at 1 pct is rejected with ERR_INTEREST_PCT_EXCEEDED (422) while the same LENDER at 0 pct is accepted - and that 0-pct lender is still rejected with ERR_DUPLICATE_PAYEE_PRIORITY (409) if it reuses priority 2."
        test_recipe:
          setup:
            - "One ELIGIBLE project with a DRAFT policy carrying OWNER 60 pct (priority 1) and GENERAL_CONTRACTOR 40 pct (priority 2)."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Cedar Mills Warehouse", site_address: "12 Mill Rd, Cedar", construction_type: "FIRE_RESISTIVE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 400000000, cat_zone: "INLAND", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-03-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "A" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-03-20T00:00:00Z", includes_existing_structure: false, deductible_tier: "STANDARD_25K", limit_cents: 200000000, daily_delay_rate_cents: 0 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
            - call: "POST /builders-risk/named-insured-interests"
              payload: { policy_id: "${pl1}", party_name: "Cedar Mills Owner LLC", party_role: "OWNER", insurable_interest_pct: 60, loss_payee_priority: 1 }
              as: Underwriter
