        claim_type: action_endpoint
        grounds: ["endpoints[\"POST /playtests/sessions/{id}/start\"]", "endpoints[\"POST /playtests/sessions/{id}/complete\"]", state_machines.PlaytestSession]
        distinguishing_aspect: "The action chain assign -> (close study) -> start -> mark-attended -> complete drives one session SCHEDULED -> IN_PROGRESS -> COMPLETED with the booking ending ATTENDED and seats_taken frozen at 1."
        test_recipe:
          setup: ["participant P ENROLLED in study S; moderator M; REMOTE session (2026-08-10 10:00-11:00) with P BOOKED"]
          setup_api_calls:
            - call: "POST /playtests/_clock/set_current_utc"
