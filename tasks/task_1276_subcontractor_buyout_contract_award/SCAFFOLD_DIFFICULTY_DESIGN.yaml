            - call: "POST /gaps/${gap_s}/resolve"
              payload: { resolution_kind: "CONTINGENCY_DRAW", priced_amount_cents: 200000 }
              as: BuyoutLead
          trigger:
            - call: "POST /subcontracts/${sub_m}/award"
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNRESOLVED_LIFE_SAFETY_GAP (business_safety priority 8 outranks the fiscal breach at priority 9, where the headline check would have returned ERR_AWARD_EXCEEDS_BUDGET)"
            - "Subcontract.${sub_m}.status == PENDING_AWARD (blocked; no state drift)"
            - "ScopeGap.${gap_ls}.status == OPEN (the blocking gap remains open)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: authority_cumulative_ratio_exactly_at_ten_percent_boundary
        grounds:
          - calculations.change_authority_check
          - validations[priority=10]
          - errors[ERR_CO_CUMULATIVE_LIMIT]
        distinguishing_aspect: |
          Numeric threshold boundary on POST /change-orders/{id}/approve, with
          the moving denominator the formula pins (cumulative ratio divides by
          contract_value_cents AT APPROVAL TIME): contract 10000000, PM tier
          cumulative limit 0.10. CO-1 of 1000000 lands ratio exactly 0.10
          (inclusive pass); CO-2 of 100000 lands (1000000+100000)/11000000
          exactly 0.10 again (inclusive pass); CO-3 of 100001 lands
          1200001/11100000 = 0.1081 > 0.10 and MUST fail with
          ERR_CO_CUMULATIVE_LIMIT.
        test_recipe:
          setup:
            - "EXECUTED subcontract, contract_value_cents=10000000, SOV APPROVED"
            - "Authority tiers: PM {max_value_cents 2500000, max_cumulative_pct 0.10}; OM unlimited"
            - "CO-1 (1000000) and CO-2 (100000) both APPROVED by ProjectManager — cumulative ratio exactly 0.10 after each"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-BP1", project_number: "BP1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "BP1-26", title: "Mechanical", estimated_budget_cents: 12000000, budgeted_contingency_cents: 0, spec_section: "23 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Nu Mech", contact_email: "n@x.com", base_bid_cents: 10000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_n: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Omicron Mech", contact_email: "o@x.com", base_bid_cents: 10100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_o: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_o}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Nu Mech", source_bid_id: "${bid_n}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: 2500000, max_cumulative_pct: 0.10, roles: ["ProjectManager"] }, { max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_n: $.data.id }
            - call: "POST /subcontracts/${sub_n}/recommend-award"
              payload: { contract_value_cents: 10000000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_n}/award"
              as: OperationsManager
            - call: "POST /subcontracts/${sub_n}/insurance-certificates"
              payload: { certificate_number: "CERT-BP1", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: true, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2027-06-01" }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_n}/issue"
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_n}/execute"
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_n}/schedule-of-values"
              payload: { lines: [{ wbs_code: "01", description: "All", weight_numerator: 1 }] }
              as: BuyoutLead
              captures: { sov_n: $.data.id }
            - call: "POST /schedule-of-values/${sov_n}/approve"
              as: OperationsManager
            - call: "POST /subcontracts/${sub_n}/change-orders"
              payload: { description: "CO-1 at the boundary", amount_cents: 1000000 }
              as: BuyoutLead
              as_user_id: "bl-1"
              captures: { co1: $.data.id }
            - call: "POST /change-orders/${co1}/submit"
              as: BuyoutLead
            - call: "POST /change-orders/${co1}/approve"
              as: ProjectManager
              as_user_id: "pm-1"
              captures: { co1_status: $.data.status }
            - call: "POST /subcontracts/${sub_n}/change-orders"
              payload: { description: "CO-2 still at the boundary", amount_cents: 100000 }
              as: BuyoutLead
              as_user_id: "bl-1"
              captures: { co2: $.data.id }
            - call: "POST /change-orders/${co2}/submit"
              as: BuyoutLead
            - call: "POST /change-orders/${co2}/approve"
              as: ProjectManager
              as_user_id: "pm-1"
              captures: { co2_status: $.data.status }
            - call: "GET /subcontracts/${sub_n}"
              as: BuyoutLead
              captures: { sub_cum_mid: $.data.cumulative_co_cents, sub_val_mid: $.data.contract_value_cents }
          trigger:
            - call: "POST /subcontracts/${sub_n}/change-orders"
              payload: { description: "CO-3 one unit over cumulative", amount_cents: 100001 }
              as: BuyoutLead
              as_user_id: "bl-1"
              captures: { co3: $.data.id }
            - call: "POST /change-orders/${co3}/submit"
              as: BuyoutLead
            - call: "POST /change-orders/${co3}/approve"
              as: ProjectManager
              as_user_id: "pm-1"
              captures: { err: $.data.error_id }
            - call: "GET /change-orders/${co3}"
              as: BuyoutLead
              captures: { co3_status: $.data.status }
          assert:
            - "co1_status == APPROVED (cumulative ratio (0+1000000)/10000000 == 0.10 exactly — boundary is inclusive)"
            - "co2_status == APPROVED (ratio (1000000+100000)/11000000 == 0.10 exactly — moving denominator keeps the boundary reachable)"
            - "sub_cum_mid == 1100000 and sub_val_mid == 11100000 after CO-2"
            - "err == ERR_CO_CUMULATIVE_LIMIT (ratio (1100000+100001)/11100000 == 0.1081 > 0.10 for the PM tier)"
            - "co3_status == PENDING_APPROVAL (rejected approval leaves the CO pending; no contract-value mutation)"

      - name: leveling_empty_candidate_set_after_all_bids_withdrawn
        grounds:
          - calculations.bid_leveling_selection
          - validations[priority=6]
          - errors[ERR_NO_AWARDABLE_BID]
        distinguishing_aspect: |
          Empty-set boundary on a different metric (candidate count) and a
          different endpoint (bid award): when every bid on the package is
          WITHDRAWN, the eligible set is empty and the award is rejected with
          ERR_NO_AWARDABLE_BID — the empty-set check fires BEFORE the
          target-bid status check, so the withdrawn target does not produce
          ERR_BID_NOT_AWARDABLE.
        test_recipe:
          setup:
            - "TradePackage UNDER_LEVELING with exactly two bids, both WITHDRAWN (eligible set empty)"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-BP2", project_number: "BP2", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "BP2-09", title: "Electrical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, spec_section: "26 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Xi Elec", contact_email: "x@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_x: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Omicron Elec", contact_email: "o@x.com", base_bid_cents: 9200000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_o: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_x}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_o}/withdraw"
              as: BuyoutLead
          trigger:
            - call: "POST /trade-packages/${tp_id}/bids/${bid_x}/award"
              as: BuyoutLead
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NO_AWARDABLE_BID (empty eligible candidate set preempts the target-bid WITHDRAWN check)"
            - "TradePackage.${tp_id}.status == UNDER_LEVELING (no state drift)"
            - "Bid.${bid_x}.status == WITHDRAWN and Bid.${bid_o}.status == WITHDRAWN (withdrawn bids remain queryable)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: bid_create_gated_on_trade_package_state
        grounds:
          - state_machines.TradePackage.DRAFT_to_PUBLISHED
          - validations[priority=5]
          - errors[ERR_TRADE_PACKAGE_NOT_ACCEPTING_BIDS]
        distinguishing_aspect: |
          Pair Bid -> TradePackage: POST /trade-packages/{id}/bids is legal only
          while the package is PUBLISHED or UNDER_LEVELING; a bid against a
          DRAFT package is rejected with ERR_TRADE_PACKAGE_NOT_ACCEPTING_BIDS
          while the same payload against an UNDER_LEVELING package succeeds.
        test_recipe:
          setup:
            - "Package A in DRAFT (never published)"
            - "Package B UNDER_LEVELING (published, one bid placed, bidding closed)"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-CE1", project_number: "CE1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "CE1-A", title: "Pkg A", estimated_budget_cents: 5000000, budgeted_contingency_cents: 0, spec_section: "01 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_a: $.data.id }
            - call: "GET /projects/${proj_id}"
              as: BuyoutLead
              captures: { proj_v2: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "CE1-B", title: "Pkg B", estimated_budget_cents: 5000000, budgeted_contingency_cents: 0, spec_section: "02 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v2}" }
              as: BuyoutLead
              captures: { tp_b: $.data.id }
            - call: "POST /trade-packages/${tp_b}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_b}/bids"
              payload: { bidder_name: "Pi One", contact_email: "p1@x.com", base_bid_cents: 4000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_b}/close-bidding"
              as: BuyoutLead
          trigger:
            - call: "POST /trade-packages/${tp_a}/bids"
              payload: { bidder_name: "Pi Two", contact_email: "p2@x.com", base_bid_cents: 4000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { err_a: $.data.error_id }
            - call: "POST /trade-packages/${tp_b}/bids"
              payload: { bidder_name: "Pi Three", contact_email: "p3@x.com", base_bid_cents: 4100000, bid_received_at: "2026-05-15T12:30:00Z" }
              as: BuyoutLead
              captures: { bid_b_ok: $.data.id }
          assert:
            - "err_a == ERR_TRADE_PACKAGE_NOT_ACCEPTING_BIDS (DRAFT package gates Bid creation)"
            - "bid_b_ok != null (UNDER_LEVELING package still accepts bids — the gate is on the parent state set {PUBLISHED, UNDER_LEVELING})"

      - name: change_order_create_gated_on_subcontract_executed_and_sov_approved
        grounds:
          - state_machines.Subcontract.ISSUED_to_EXECUTED
