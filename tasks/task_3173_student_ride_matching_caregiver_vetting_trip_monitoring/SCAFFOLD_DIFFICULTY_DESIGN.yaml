              payload: { check_type: "SEX_OFFENDER_REGISTRY", reference_code: "SOR-1", expires_on: "2027-03-01" }
              as: DistrictAdmin
              captures: { bc3: $.data.id }
          trigger:
            - call: "POST /student-rides/vehicle-inspections/${ins3}/attest"
              payload: {}
              as: DistrictAdmin
              captures: { err_j: $.data.error_id }
          assert:
            - "the attestation is refused with data.error_id == ERR_INVALID_STATE"
            - "Driver.${drv_id}.status reads BACKGROUND_CHECK at the moment of refusal and not INSPECTION"
            - "VehicleInspection.${ins3}.result stays PENDING and seat_credit stays 0"
            - "Driver.${drv_id}.approved_seat_count is unchanged, because a PENDING inspection never contributes seat credit"
            - "POST /student-rides/background-checks/${bc3}/clear followed by the same attestation then succeeds, proving the gate is the driver's roster state and not the inspection's own fields"

