          setup:
            - "Outage UNIT_1 / 1R24 with duration_target_hours 720, dose_budget_total_mrem 5000 and cost_budget_usd 40000000, driven all the way to ONLINE with one approved pattern, one work order that is deferred before startup, and one STATION test satisfied."
            - "No permits were approved, so dose_committed_mrem is 0.00 and the dose variance is -100.00, clamped to 0 by the one-sided penalty."
            - "The review reports actual_duration_hours 780 and actual_cost_usd 42000000: duration variance 8.33 pct, cost variance 5.00 pct, penalty 0.5 * 8.33 + 0.3 * 0 + 0.2 * 5.00 = 5.165, index 94.84."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: StationAdmin
            - call: "POST /outages"
              payload: { station_unit: "UNIT_1", designation: "1R24", duration_target_hours: 720, dose_budget_total_mrem: 5000, cost_budget_usd: 40000000, scope_freeze_at: "2026-08-15T00:00:00.000Z" }
              as: StationAdmin
              captures: { o_id: "$.data.id", o_v1: "$.data.version" }
            - call: "POST /outages/${o_id}/core-load-patterns"
              payload: { cycle_length_mwd_mtu: 18000, fresh_assembly_count: 88, discharge_assembly_count: 80, expected_outage_version: "${o_v1}" }
              as: ReactorEngineer
              as_user_id: "re-alpha"
              captures: { clp_id: "$.data.id" }
            - call: "POST /core-load-patterns/${clp_id}/approve"
