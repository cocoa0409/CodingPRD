          trigger:
            # 15-minute gap after the 11:00 end -> buffer violation
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_s}", simulator_slot_id: "${slot}", phase: "SIMULATOR", event_type: "SESSION", scheduled_start: "2026-08-11T11:15:00Z", scheduled_end: "2026-08-11T13:00:00Z" }, as: TrainingCoordinator, captures: { err: $.data.error_id } }
            # exactly 30-minute gap -> accepted (and slot half-open sees no overlap)
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_s}", simulator_slot_id: "${slot}", phase: "SIMULATOR", event_type: "SESSION", scheduled_start: "2026-08-11T11:30:00Z", scheduled_end: "2026-08-11T13:30:00Z" }, as: TrainingCoordinator, captures: { ev_s2: $.data.id } }
