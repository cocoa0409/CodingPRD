            - call: "POST /fhlb/collateral-verification-reviews/${review_1}/findings"
              payload: { collateral_asset_id: "${asset_sf}", finding_type: "STALE_APPRAISAL", severity: "MINOR" }
              as: CollateralReviewAuditor
