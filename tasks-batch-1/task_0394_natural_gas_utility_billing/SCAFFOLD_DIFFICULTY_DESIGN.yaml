        grounds:
          - state_machines.Account.ACTIVE_to_SHUTOFF_PENDING
          - state_machines.Account.SHUTOFF_PENDING_to_ACTIVE
          - state_machines.ServiceOrder.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = count of non-terminal (SCHEDULED/DISPATCHED) SHUTOFF ServiceOrders for the
          account (an ORDER COUNT, a different conserved type than money). shutoff-notice creates one
