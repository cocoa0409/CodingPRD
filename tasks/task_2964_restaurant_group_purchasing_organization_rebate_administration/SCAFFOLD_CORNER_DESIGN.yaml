      - name: distributor_feed_cannot_act_outside_its_own_distributor_id
        claim_type: unauthorized_role
        grounds:
          - validations[priority=6]
          - roles.DistributorFeed.identity
          - errors.ERR_DISTRIBUTOR_SCOPE_VIOLATION
        distinguishing_aspect: |
          DistributorFeed is entity_backed on Distributor, and the scope rule
          reaches the owner three ways: the distributor_id in a create BODY, the
          letter's distributor_id on a path action, and the parent BATCH's
          distributor_id on a child create. It is role-conditioned, so
          RebateAnalyst may open a batch for any distributor, and it outranks the
          letter-state gate: feeding a foreign batch is a 403, not the
          ERR_LOA_NOT_ACTIVE that the same request would otherwise earn.
