      - name: readiness_journal_lookback_discount_removes_two_entries
        claim_type: input_set_filtering
        grounds:
          - calculations.take_home_readiness_direction_b
          - entities.TakeHomePrivilege.fields.timetable_reconciled
          - errors[ERR_TIMETABLE_LOOKAHEAD_FAILED]
        distinguishing_aspect: "Only entries inside the trailing 28-day journal window are discounted, and the discount is exactly 2.0 for the earliest window entry plus 1.5 for the latest: a patient with two entries aged 5 and 20 days is discounted the full 3.5, while the same patient with a third entry 400 days old is not additionally discounted."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z, advanced to 2026-12-15. One CA program, a Physician, a Nurse, a Medical Director and one admitted patient 105 days in treatment with an ACTIVE 90 mg order."
            - "Two dose rows for that patient are dated 2026-12-01 and 2026-12-10, both CANCELLED, so they sit inside the trailing 28-day journal window without contributing to the Direction A completed-dose term."
          setup_api_calls:
            - *c_clock
            - *c_prog
            - call: "POST /otp/inventory-lots"
              payload: { program_id: "${prog_id}", medication: "METHADONE", lot_number: "LOT-A1", expiration_date: "2027-06-30", quantity_received_mg: 50000.0, dose_potency_mg_per_unit: 1.0, reusable_for_take_home: true }
