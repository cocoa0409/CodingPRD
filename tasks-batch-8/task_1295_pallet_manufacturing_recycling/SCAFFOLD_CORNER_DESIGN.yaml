              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-05T00:00:00Z", spec_id: "${spec_id}", quantity: 1, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /pallet-ops/orders/${o}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: SalesRep
              captures: { ov2: $.data.version }
            - call: "POST /pallet-ops/orders/${o}/allocate"
              payload: { expected_order_version: "${ov2}" }
              as: SalesRep
            - call: "POST /pallet-ops/routes"
              payload: { route_date: "2026-08-05T00:00:00Z", trailer_cube_capacity_cuft: 5000, planned_miles: 40 }
              as: FleetPlanner
              captures: { r: $.data.id }
            - call: "POST /pallet-ops/routes/${r}/stops"
              payload: { stop_sequence: 1, stop_type: "DELIVERY", order_id: "${o}" }
              as: FleetPlanner
              captures: { s: $.data.id }
            - call: "GET /pallet-ops/routes/${r}"
              payload: {}
              as: FleetPlanner
              captures: { rv: $.data.version }
            - call: "POST /pallet-ops/routes/${r}/dispatch"
              payload: { expected_route_version: "${rv}" }
              as: FleetPlanner
            - call: "POST /pallet-ops/route-stops/${s}/arrive"
              payload: {}
              as: FleetPlanner
            - call: "POST /pallet-ops/route-stops/${s}/complete"
              payload: {}
              as: FleetPlanner
          trigger:
            - call: "POST /pallet-ops/customers/${cust_id}/close"
              payload: {}
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POOL_UNITS_OUTSTANDING (409)"
            - "Customer.${cust_id}.status remains ACTIVE"

  # ===========================================================================
  # Section 7: RBAC
  # ===========================================================================
  - section: roles
    instances:
      - name: yard_supervisor_cannot_create_spec
        claim_type: rbac_denial
        grounds: [roles]
        distinguishing_aspect: "YardSupervisor calling POST /pallet-ops/specs (PlantManager-exclusive) gets 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "RBAC-1", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: YardSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED and http status 403"

      - name: sales_rep_cannot_sort_cores
        claim_type: rbac_denial
        grounds: [roles]
        distinguishing_aspect: "SalesRep calling POST /core-units/{id}/sort (YardSupervisor-exclusive) gets 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["batch SORTING with one UNSORTED core"]
          setup_api_calls:
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "RBACCo", agreed_unit_price_cents: 100, manifest_count: 1, estimated_grade_mix: { A: 1.0, B: 0.0, SCRAP: 0.0 } }
              as: ProcurementManager
              captures: { batch_id: $.data.id }
            - call: "POST /pallet-ops/core-batches/${batch_id}/begin-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /pallet-ops/core-units/${c1}/sort"
              payload: { grade: "A" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED and http status 403"
            - "CoreUnit.${c1}.grade remains UNSORTED"

      - name: fleet_planner_cannot_close_batch
        claim_type: rbac_denial
        grounds: [roles]
        distinguishing_aspect: "FleetPlanner calling POST /core-batches/{id}/close (ProcurementManager-exclusive) gets 403 ERR_UNAUTHORIZED — peer-role isolation."
        test_recipe:
          setup: ["batch in AUDIT (all cores sorted)"]
          setup_api_calls:
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "RBACCo2", agreed_unit_price_cents: 100, manifest_count: 1, estimated_grade_mix: { A: 1.0, B: 0.0, SCRAP: 0.0 } }
              as: ProcurementManager
              captures: { batch_id: $.data.id }
            - call: "POST /pallet-ops/core-batches/${batch_id}/begin-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { c1: $.data.id }
            - call: "POST /pallet-ops/core-units/${c1}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-batches/${batch_id}/finish-sorting"
              payload: {}
              as: YardSupervisor
          trigger:
            - call: "POST /pallet-ops/core-batches/${batch_id}/close"
              payload: {}
              as: FleetPlanner
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHORIZED and http status 403"
            - "CorePurchaseBatch.${batch_id}.status remains AUDIT"

      - name: any_role_can_read
        claim_type: rbac_allowance
        grounds: [roles]
        distinguishing_aspect: "Every declared role may perform GET list/detail (shared Any operations) — HeatTreatOperator can GET /pallet-ops/orders."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "ReadAll" }
              as: SalesRep
          trigger:
            - call: "GET /pallet-ops/customers"
              payload: {}
              as: HeatTreatOperator
          assert:
            - "GET succeeds with 200 and returns the customer list (shared read via Any)"

  # ===========================================================================
  # Section 8: Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: occ_stale_order_version_on_confirm
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-confirm-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Second confirm carrying the pre-first-confirm version is rejected 412 ERR_STALE_VERSION; the version advanced by the first confirm is what the stale writer missed."
        test_recipe:
          setup: ["clock set; PINE index; ACTIVE spec; lot 500; customer; DRAFT order (version v)"]
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 500, quality_grade: "NEW" }
              as: PlantManager
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "OCC1" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 1, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o: $.data.id, ov: $.data.version }
          trigger:
            - call: "POST /pallet-ops/orders/${o}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: SalesRep
            - call: "POST /pallet-ops/orders/${o}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: SalesRep
              captures: { err: $.data.error_id }
          assert:
            - "second confirm with the stale expected_order_version returns 412 ERR_STALE_VERSION"
            - "SalesOrder.${o}.version == ov + 1 (exactly one increment from the successful confirm)"

      - name: occ_stale_route_version_on_dispatch
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[route-dispatch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Dispatch carrying the route version observed before a stop was added is rejected 412 — adding a stop bumps DeliveryRoute.version, so the pre-stop view is stale."
        test_recipe:
          setup: ["clock set; PINE index; ACTIVE spec; lot 500; customer; allocated order; PLAN route with one stop; client holds pre-stop version"]
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 500, quality_grade: "NEW" }
              as: PlantManager
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "OCC2" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 1, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /pallet-ops/orders/${o}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: SalesRep
              captures: { ov2: $.data.version }
            - call: "POST /pallet-ops/orders/${o}/allocate"
              payload: { expected_order_version: "${ov2}" }
              as: SalesRep
            - call: "POST /pallet-ops/routes"
              payload: { route_date: "2026-08-10T00:00:00Z", trailer_cube_capacity_cuft: 5000, planned_miles: 40 }
              as: FleetPlanner
              captures: { r: $.data.id, rv_pre: $.data.version }
            - call: "POST /pallet-ops/routes/${r}/stops"
              payload: { stop_sequence: 1, stop_type: "DELIVERY", order_id: "${o}" }
              as: FleetPlanner
          trigger:
            - call: "POST /pallet-ops/routes/${r}/dispatch"
              payload: { expected_route_version: "${rv_pre}" }
              as: FleetPlanner
              captures: { err: $.data.error_id }
          assert:
            - "dispatch with pre-stop version returns 412 ERR_STALE_VERSION"
            - "DeliveryRoute.${r}.status remains PLAN and version > rv_pre (stop creation bumped it)"

      - name: occ_correct_version_succeeds
        claim_type: occ_happy_path
        grounds: ["concurrency_rules[order-allocate-stale-version]"]
        distinguishing_aspect: "Allocate carrying the version returned by confirm succeeds and bumps version again — OCC passes when the observed version is current."
        test_recipe:
          setup: ["clock set; PINE index; ACTIVE spec; lot 500; customer; CONFIRMED order (version captured from confirm response)"]
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 500, quality_grade: "NEW" }
              as: PlantManager
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "OCC3" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 2, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /pallet-ops/orders/${o}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: SalesRep
              captures: { ov2: $.data.version }
          trigger:
            - call: "POST /pallet-ops/orders/${o}/allocate"
              payload: { expected_order_version: "${ov2}" }
              as: SalesRep
          assert:
            - "allocate succeeds with the current version"
            - "SalesOrder.${o}.fulfillment_status == ALLOCATED and version == ov2 + 1"

      - name: list_filter_and_pagination_interaction
        claim_type: pagination_with_filtering
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "Filtered list (grade == SCRAP) paginates within the filtered set: total_count reflects the filter, not the whole table."
        test_recipe:
          setup: ["batch SORTING with 3 cores: 2 SCRAP, 1 A"]
          setup_api_calls:
            - call: "POST /pallet-ops/core-batches"
              payload: { supplier_name: "PageCo", agreed_unit_price_cents: 100, manifest_count: 3, estimated_grade_mix: { A: 0.33, B: 0.0, SCRAP: 0.67 } }
              as: ProcurementManager
              captures: { batch_id: $.data.id }
            - call: "POST /pallet-ops/core-batches/${batch_id}/begin-sorting"
              payload: {}
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { p1: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { p2: $.data.id }
            - call: "POST /pallet-ops/core-units"
              payload: { batch_id: "${batch_id}", species: "PINE" }
              as: YardSupervisor
              captures: { p3: $.data.id }
            - call: "POST /pallet-ops/core-units/${p1}/sort"
              payload: { grade: "SCRAP", condition_notes: "x" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${p2}/sort"
              payload: { grade: "SCRAP", condition_notes: "x" }
              as: YardSupervisor
            - call: "POST /pallet-ops/core-units/${p3}/sort"
              payload: { grade: "A" }
              as: YardSupervisor
          trigger:
            - call: "GET /pallet-ops/core-units"
              payload: { grade: "SCRAP", limit: 1, offset: 0 }
              as: YardSupervisor
          assert:
            - "total_count == 2 (filtered), data has 1 entry, has_more == true"
            - "offset 1 returns the second SCRAP core and has_more == false"

  # ===========================================================================
  # Section 9: Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_confirm_pricing
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.order_pricing]
        distinguishing_aspect: "Immediate consistency: the confirm RESPONSE itself carries subtotal/seasonal/total — no re-read lag, no eventual reconciliation."
        test_recipe:
          setup: ["clock set; PINE index; ACTIVE spec; lot 500; customer; DRAFT order qty 2 grade NEW"]
          setup_api_calls:
            - call: "POST /pallet-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantManager
            - call: "POST /pallet-ops/lumber-index"
              payload: { species: "PINE", price_per_mbf_cents: 400000, effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: ProcurementManager
            - call: "POST /pallet-ops/specs"
              payload: { spec_code: "GMA-48X40-15B", length_in: 48, width_in: 40, height_in: 6.0, board_count: 15, lumber_species: "PINE" }
              as: PlantManager
              captures: { spec_id: $.data.id }
            - call: "POST /pallet-ops/specs/${spec_id}/activate"
              payload: {}
              as: PlantManager
            - call: "POST /pallet-ops/inventory-lots"
              payload: { spec_id: "${spec_id}", origin_type: "NEW_BUILD", quantity_total: 500, quality_grade: "NEW" }
              as: PlantManager
            - call: "POST /pallet-ops/customers"
              payload: { company_name: "ImmCust" }
              as: SalesRep
              captures: { cust_id: $.data.id }
            - call: "POST /pallet-ops/orders"
              payload: { customer_id: "${cust_id}", requested_delivery_date: "2026-08-10T00:00:00Z", spec_id: "${spec_id}", quantity: 2, quality_grade_requested: "NEW" }
              as: SalesRep
              captures: { o: $.data.id, ov: $.data.version }
          trigger:
            - call: "POST /pallet-ops/orders/${o}/confirm"
              payload: { expected_order_version: "${ov}" }
              as: SalesRep
          assert:
            - "confirm response data.subtotal_cents == 3000 (2 * 1500) in the SAME response"
            - "confirm response data.total_cents == 3000 (no seasonal band, no credit)"
            - "a subsequent GET returns identical values (no drift between write and read)"

  # ===========================================================================
  # Stubs: corners already covered by §1.8 instances
  # ===========================================================================
  - section: calculations
    instances:
      - name: settlement_shortage_penalty_applied
        claim_type: correct_result
        grounds: [calculations.settlement_final]
        excluded_because:
          difficulty_instance: core_batch_provisional_vs_final_settlement
          rationale: "The shortage penalty (125 cents) is asserted as part of final_settlement_cents == 2775 in the named §1.8 instance."

      - name: route_margin_skipped_stop_zero_revenue
        claim_type: correct_result
        grounds: [calculations.route_margin_final]
        excluded_because:
          difficulty_instance: route_margin_provisional_vs_final_with_skip
          rationale: "SKIPPED-stop zero revenue is asserted via final_margin_cents == -9200 in the named §1.8 instance."

      - name: ht_required_vs_insufficient_stock_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=8]", "validations[priority=24]"]
        excluded_because:
          difficulty_instance: referential_vs_fiscal_on_allocate
          rationale: "The safety-vs-fiscal priority conflict is the named §1.8 instance itself."

      - name: lumber_window_half_open_edge
        claim_type: boundary_edge
        grounds: [calculations.new_build_unit_cost]
        excluded_because:
          difficulty_instance: lumber_index_half_open_window_boundary
          rationale: "Effective_to exclusion is the named §1.8 boundary instance."
