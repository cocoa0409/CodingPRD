      - name: deployment_prefers_access_infeasible_over_unit_double_booked
        grounds:
          - validations[priority=50]
          - validations[priority=58]
          - errors[ERR_SITE_ACCESS_INFEASIBLE]
          - errors[ERR_UNIT_DOUBLE_BOOKED]
          - entities.AssetUnit.fields.tare_length_ft
          - entities.ServiceSite.fields.max_truck_length_ft
        distinguishing_aspect: |
          A DIFFERENT category pair on a different endpoint: `business_safety` (priority 50) versus
          `business_temporal` (priority 58) on POST /unit-deployments. The physical-fit failure must
          win over the calendar-overlap failure, and two control calls isolate each rule on its own.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z. One account, two OPEN sites: site_wide accepts 40 ft, site_narrow accepts only 24 ft."
            - "One TRAILER_2STALL asset with tare_length_ft 34 — it fits site_wide but not site_narrow."
            - "contract_wide sits on site_wide, contract_narrow on site_narrow; both are QUOTED."
            - "Deployment d1 already holds the asset for 2026-08-03..2026-08-10 in state RESERVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
