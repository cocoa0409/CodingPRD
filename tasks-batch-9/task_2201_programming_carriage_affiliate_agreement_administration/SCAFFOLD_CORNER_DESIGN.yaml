            - "the AuditManager PLACE_HOLD returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "GET /carriage/distributors/${dm_id} returns status == \"ACTIVE\" and version == 3 after the two accepted peer actions"
            - "the same PLACE_HOLD as AffiliateSalesExec, RightsAdministrator or DistributorLiaison each return 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""

      - name: liaison_authority_is_delegated_and_scoped_to_one_operator
