# =============================================================================
# task_2410 — Professional Certification Body Exam & Recertification
# SCAFFOLD.yaml — §1.0 through §1.7
# (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  2410. Professional Certification Body Exam & Recertification (professional certification body): job task analysis driving exam blueprint and item bank development, item writing, review and psychometric performance monitoring with retirement of weak items, eligibility application review for education and experience prerequisites with audit sampling, exam scheduling at test centers or online proctoring with security incidents handling, standard setting, passing score determination and score reporting, certificant registry publication and verification services, recertification through continuing education units or re-examination with cycle tracking, disciplinary process for credential misuse and revocation

domain_name: professional-certification-body
api_prefix: "/"   # flat topology — every collection is a top-level path segment

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - conditional_feature_flags
    - ops_run_checkpoint

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit foreign keys in the
  # request body; no entity is addressed through a parent's URL path. The only
  # nested paths are reverse-reachability reads and action sub-paths.

  state_machine_shape: parallel
  # ExamRegistration carries two independent dimensions (seat_status ×
  # score_status) on the same row; Item and DisciplinaryCase are cyclic;
  # EligibilityApplication is a branching fork-join; RecertificationCycle is
  # compound (status re-derived from its CEUActivity children).

  relationship_patterns:
    - one_to_many          # Program → Item / ExamForm / EligibilityApplication
    - cross_aggregate      # ExamRegistration → EligibilityApplication + ExamForm + ExamSession
    - polymorphic          # audit sampling applies to EligibilityApplication and CEUActivity alike

  role_model: segregation_of_duties
  # An item's reviewer may never be its author; the second approval must come
  # from a third distinct user; an application's auditor may never be one of its
  # dimension verifiers; a CEU audit-verifier may never be the activity's
  # reviewer; a cut-score adopter may never be a panelist on that panel.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: CertificationProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Credential name" }
      - { name: credential_code, type: string, source: input, description: "Short credential code; unique among programs with status IN {DRAFT, ACTIVE}", constraints: "2–12 uppercase chars" }
      - { name: jta_version, type: string, source: input, description: "Job task analysis version that produced this blueprint, e.g. JTA-2026.1" }
      - { name: domain_specs, type: array, source: input, description: "Blueprint rows: [{domain_code, weight_pct, min_operational_items}]", constraints: "1–8 rows; weight_pct integers summing to exactly 100; domain_code unique within the array; min_operational_items >= 0" }
      - { name: form_length, type: integer, source: input, description: "Exact number of entries required in ExamForm.item_ids", constraints: ">= 1" }
      - { name: psychometric_stat_basis, type: enum, source: input, default: OPERATIONAL_ONLY, description: "Which response pool item statistics use", constraints: "POOLED | OPERATIONAL_ONLY" }
      - { name: min_discrimination, type: number, source: input, default: 0.15, description: "Item is flagged LOW_DISCRIMINATION when discrimination_index < this value (strict)" }
      - { name: min_p_value, type: number, source: input, default: 0.20, description: "Item is flagged TOO_HARD when p_value < this value (strict)" }
      - { name: max_p_value, type: number, source: input, default: 0.95, description: "Item is flagged TOO_EASY when p_value > this value (strict)" }
      - { name: min_responses_for_stats, type: integer, source: input, default: 30, description: "Minimum responses in the applied pool before statistics are computed at all" }
      - { name: form_retirement_tolerance_pct, type: integer, source: input, default: 10, description: "A PUBLISHED form moves to NEEDS_REBUILD when retired_item_count*100 > this * len(item_ids)" }
      - { name: min_panelists, type: integer, source: input, default: 5, description: "Minimum submitted panelist ratings before a cut score may be adopted" }
      - { name: panel_trim_count, type: integer, source: input, default: 1, description: "Number of lowest and highest panelist means trimmed before averaging" }
      - { name: cut_score_sem_multiplier, type: number, source: input, default: 0.5, description: "Multiplier applied to the standard error of the trimmed mean when lowering the cut" }
      - { name: accepted_education_credentials, type: array, source: input, description: "Credentials that satisfy the education prerequisite", constraints: "non-empty subset of {DIPLOMA, ASSOCIATE, BACHELOR, MASTER, DOCTORATE}" }
      - { name: education_recency_years, type: integer, source: input, default: 10, description: "Education completion year must be >= current_year - this value" }
      - { name: min_experience_months, type: integer, source: input, default: 24, description: "Minimum experience_months that satisfies the experience prerequisite (>= comparison)" }
      - { name: audit_every_nth, type: integer, source: input, default: 3, description: "Every Nth application to complete both dimension verifications is audit-sampled", constraints: ">= 1" }
      - { name: eligibility_valid_days, type: integer, source: input, default: 365, description: "Days an APPROVED application stays usable for registration" }
      - { name: exam_fee_cents, type: integer, source: input, default: 45000, description: "Fee that must be tendered at registration" }
      - { name: max_attempts_per_cycle, type: integer, source: input, default: 3, description: "Maximum consumed attempts per candidate per program" }
      - { name: retake_wait_days, type: integer, source: input, default: 45, description: "Days that must elapse after a consumed attempt before the next registration" }
      - { name: cycle_length_months, type: integer, source: input, default: 36, description: "Length of a recertification cycle in months" }
      - { name: required_ceu_credits, type: number, source: input, default: 60, description: "Credits a cycle must accumulate to be SATISFIED (>= comparison)" }
      - { name: ceu_credit_accrual_basis, type: enum, source: input, default: STRICT_CYCLE, description: "Which credit-accrual variant the program uses", constraints: "STRICT_CYCLE | CARRYOVER_ALLOWED" }
      - { name: ceu_carryover_max_credits, type: number, source: input, default: 10, description: "Cap on credits carried from a closed cycle into the next one" }
      - { name: recert_grace_days, type: integer, source: input, default: 90, description: "Days after cycle ends_on before an unsatisfied cycle LAPSES" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED" }
      - { name: operational_item_count, type: integer, source: computed, description: "Count of this program's Items with status == OPERATIONAL" }
      - { name: deficient_domain_codes, type: array, source: computed, description: "domain_codes whose OPERATIONAL item count is below min_operational_items, sorted ascending" }
      - { name: blueprint_posture, type: enum, source: computed, description: "COMPLETE when deficient_domain_codes is empty, otherwise DEFICIENT" }
      - { name: verified_application_counter, type: integer, source: computed, default: 0, description: "Monotonic count of applications that have completed both dimension verifications; drives deterministic audit sampling" }
      - { name: certificants_issued_count, type: integer, source: computed, default: 0, description: "Monotonic count of Certificants minted under this program; drives certificate_number sequencing" }

  # ---------------------------------------------------------------------------
  - name: Item
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CertificationProgram.id; the program whose blueprint this item belongs to" }
      - { name: domain_code, type: string, source: input, description: "Must match one domain_code in the program's domain_specs" }
      - { name: cognitive_level, type: enum, source: input, description: "RECALL | APPLICATION | ANALYSIS" }
      - { name: stem, type: string, source: input, description: "Item stem text" }
      - { name: author_user_id, type: string, source: system, description: "X-User-ID of the ItemSpecialist that created the item" }
      - { name: approver_user_ids, type: array, source: computed, description: "Distinct X-User-IDs that have returned decision APPROVE in the current review_round, in call order" }
      - { name: review_round, type: integer, source: system, default: 1, description: "Increments by 1 on every REVISION_REQUESTED -> IN_REVIEW resubmission" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_REVIEW | REVISION_REQUESTED | REJECTED | APPROVED | PRETEST | OPERATIONAL | FLAGGED | RETIRED" }
      - { name: pretest_response_count, type: integer, source: computed, default: 0, description: "Sum of n_responses over ingested batches with is_pretest == true" }
      - { name: pretest_correct_count, type: integer, source: computed, default: 0, description: "Sum of n_correct over batches with is_pretest == true" }
      - { name: pretest_upper_n, type: integer, source: computed, default: 0, description: "Sum of upper_n over batches with is_pretest == true" }
      - { name: pretest_upper_correct, type: integer, source: computed, default: 0, description: "Sum of upper_correct over batches with is_pretest == true" }
      - { name: pretest_lower_n, type: integer, source: computed, default: 0, description: "Sum of lower_n over batches with is_pretest == true" }
      - { name: pretest_lower_correct, type: integer, source: computed, default: 0, description: "Sum of lower_correct over batches with is_pretest == true" }
      - { name: operational_response_count, type: integer, source: computed, default: 0, description: "Sum of n_responses over batches with is_pretest == false" }
      - { name: operational_correct_count, type: integer, source: computed, default: 0, description: "Sum of n_correct over batches with is_pretest == false" }
      - { name: operational_upper_n, type: integer, source: computed, default: 0, description: "Sum of upper_n over batches with is_pretest == false" }
      - { name: operational_upper_correct, type: integer, source: computed, default: 0, description: "Sum of upper_correct over batches with is_pretest == false" }
      - { name: operational_lower_n, type: integer, source: computed, default: 0, description: "Sum of lower_n over batches with is_pretest == false" }
      - { name: operational_lower_correct, type: integer, source: computed, default: 0, description: "Sum of lower_correct over batches with is_pretest == false" }
      - { name: p_value, type: number, source: computed, description: "Proportion correct in the applied pool, 4 decimals; null when stat_basis_applied == INSUFFICIENT_DATA" }
      - { name: discrimination_index, type: number, source: computed, description: "Upper-group proportion minus lower-group proportion in the applied pool, 4 decimals; null when stat_basis_applied == INSUFFICIENT_DATA" }
      - { name: stat_basis_applied, type: enum, source: computed, description: "POOLED | OPERATIONAL_ONLY | INSUFFICIENT_DATA — which pool the last recompute actually used" }
      - { name: flag_reason, type: enum, source: computed, description: "null | LOW_DISCRIMINATION | TOO_EASY | TOO_HARD" }
      - { name: retirement_reason, type: enum, source: input, description: "null | PSYCHOMETRIC | CONTENT_OBSOLETE | EXPOSED | PRETEST_FAILED — set on the transition into RETIRED" }
      - { name: retired_at, type: datetime, source: system, description: "Logical-clock instant the item entered RETIRED; null otherwise" }

  # ---------------------------------------------------------------------------
  - name: ExamForm
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> CertificationProgram.id; the program whose blueprint the form realises" }
      - { name: form_code, type: string, source: input, description: "Form label, unique within the program" }
      - { name: item_ids, type: array, source: input, description: "Ordered ids of the Items on the form; length must equal program.form_length" }
      - { name: pretest_item_ids, type: array, source: input, description: "Subset of item_ids that are unscored pretest positions" }
      - { name: panelist_user_ids, type: array, source: input, description: "X-User-IDs eligible to submit standard-setting ratings for this form", constraints: "distinct; length >= 1" }
      - { name: panel_method, type: enum, source: input, default: MODIFIED_ANGOFF, description: "MODIFIED_ANGOFF | BOOKMARK" }
      - { name: panel_status, type: enum, source: system, description: "OPEN | RATINGS_COMPLETE | ADOPTED" }
      - { name: panel_ratings, type: array, source: computed, description: "[{panelist_user_id, mean_expected_pass_rate, submitted_at}] — one entry per panelist that has submitted" }
      - { name: mean_expected_pass_rate, type: number, source: computed, description: "Trimmed mean of panel_ratings[].mean_expected_pass_rate at adoption, 4 decimals; null before adoption" }
      - { name: raw_cut_score, type: integer, source: computed, description: "Number-correct passing score on the scored positions; null before adoption" }
      - { name: scored_item_count, type: integer, source: computed, description: "len(item_ids) - len(pretest_item_ids)" }
      - { name: retired_item_count, type: integer, source: computed, default: 0, description: "Count of entries in item_ids whose Item.status == RETIRED" }
      - { name: status, type: enum, source: system, description: "ASSEMBLED | CUT_SCORE_SET | PUBLISHED | NEEDS_REBUILD" }

  # ---------------------------------------------------------------------------
  - name: Candidate
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email; unique across all Candidates" }
      - { name: full_name, type: string, source: input, description: "Legal name as it will appear on the credential" }
      - { name: status, type: enum, source: system, description: "ACTIVE | BARRED" }
      - { name: barred_until, type: datetime, source: system, description: "Logical-clock instant the bar expires; null when status == ACTIVE" }
      - { name: bar_reason, type: enum, source: system, description: "null | SECURITY_INCIDENT | DISCIPLINARY" }

  # ---------------------------------------------------------------------------
  - name: EligibilityApplication
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: input, description: "FK -> Candidate.id; the applicant" }
      - { name: program_id, type: string, source: input, description: "FK -> CertificationProgram.id; the program applied for" }
      - { name: education_credential, type: enum, source: input, description: "DIPLOMA | ASSOCIATE | BACHELOR | MASTER | DOCTORATE" }
      - { name: education_completion_year, type: integer, source: input, description: "Four-digit year the credential was completed" }
      - { name: experience_months, type: integer, source: input, description: "Self-reported months of qualifying experience", constraints: ">= 0" }
      - { name: attestation_signed, type: boolean, source: input, description: "Applicant attestation to the code of conduct; must be true" }
      - { name: education_status, type: enum, source: system, description: "PENDING | VERIFIED | FAILED" }
      - { name: experience_status, type: enum, source: system, description: "PENDING | VERIFIED | FAILED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | AUDIT_SELECTED | APPROVED | DENIED | EXPIRED" }
      - { name: verifier_user_ids, type: array, source: computed, description: "[{dimension, user_id}] — one entry per completed dimension verification, in call order" }
      - { name: auditor_user_id, type: string, source: system, description: "X-User-ID that recorded the audit decision; null until audited" }
      - { name: audit_sequence_number, type: integer, source: system, description: "Value of program.verified_application_counter at the moment both dimensions became VERIFIED; null before then" }
      - { name: eligibility_expires_on, type: datetime, source: computed, description: "Set on entry to APPROVED as current_utc + program.eligibility_valid_days; null otherwise" }
      - { name: denial_reason, type: enum, source: system, description: "null | EDUCATION_FAILED | EXPERIENCE_FAILED | AUDIT_FAILED" }
      - { name: attempts_consumed, type: integer, source: computed, default: 0, description: "Count of this application's ExamRegistrations whose seat_status IN {COMPLETED, NO_SHOW}" }

  # ---------------------------------------------------------------------------
  - name: ExamSession
    parent: null
    common_fields: true
    fields:
      - { name: modality, type: enum, source: input, description: "TEST_CENTER | ONLINE_PROCTORED" }
      - { name: center_code, type: string, source: input, description: "Test centre code; required when modality == TEST_CENTER, must be null otherwise" }
      - { name: room_code, type: string, source: input, description: "Room within the centre; required when modality == TEST_CENTER, must be null otherwise" }
      - { name: proctor_pool_code, type: string, source: input, description: "Online proctor pool; required when modality == ONLINE_PROCTORED, must be null otherwise" }
      - { name: starts_at, type: datetime, source: input, description: "Window open instant (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Window close instant; must be strictly after starts_at" }
      - { name: seat_capacity, type: integer, source: input, description: "Maximum concurrently held seats", constraints: ">= 1" }
      - { name: seats_reserved, type: integer, source: computed, default: 0, description: "Count of ExamRegistrations on this session with seat_status IN {SCHEDULED, CHECKED_IN, COMPLETED}" }
      - { name: status, type: enum, source: computed, description: "CLOSED when current_utc >= starts_at; else FULL when seats_reserved >= seat_capacity; else OPEN" }

  # ---------------------------------------------------------------------------
  - name: ExamRegistration
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: computed, description: "FK -> Candidate.id; copied from the application at creation" }
      - { name: application_id, type: string, source: input, description: "FK -> EligibilityApplication.id; the approved application that authorises this sitting" }
      - { name: form_id, type: string, source: input, description: "FK -> ExamForm.id; the form the candidate will receive" }
      - { name: session_id, type: string, source: system, description: "FK -> ExamSession.id; null while seat_status == UNSCHEDULED" }
      - { name: session_ends_at, type: datetime, source: system, description: "Snapshot of the scheduled session's ends_at; retained after cancellation for retake-wait arithmetic; null when never scheduled" }
      - { name: fee_paid_cents, type: integer, source: input, description: "Fee tendered with the registration", constraints: ">= 0" }
      - { name: attempt_number, type: integer, source: computed, description: "1 + count of the candidate's prior consumed attempts on this program" }
      - { name: eligibility_expires_on_snapshot, type: datetime, source: system, description: "Value of the application's eligibility_expires_on pinned at registration creation" }
      - { name: seat_status, type: enum, source: system, description: "UNSCHEDULED | SCHEDULED | CHECKED_IN | COMPLETED | NO_SHOW | CANCELLED" }
      - { name: score_status, type: enum, source: system, description: "NOT_APPLICABLE | PENDING | SCORED | REPORTED | WITHHELD | VOIDED" }
      - { name: score_status_before_hold, type: enum, source: system, description: "score_status captured when a CRITICAL SecurityIncident put the score on hold; null otherwise" }
      - { name: raw_score, type: integer, source: input, description: "Number-correct on the scored positions; null until responses are submitted" }
      - { name: scaled_score, type: integer, source: computed, description: "Equated score on the 200–800 reporting scale; null until responses are submitted" }
      - { name: outcome, type: enum, source: computed, description: "null | PASS | FAIL — PASS when scaled_score >= 500" }
      - { name: form_reassignment_required, type: boolean, source: system, default: false, description: "Set true when a cascade released this seat because the form moved to NEEDS_REBUILD" }

  # ---------------------------------------------------------------------------
  - name: SecurityIncident
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> ExamRegistration.id; the sitting the incident was raised against" }
      - { name: incident_type, type: enum, source: input, description: "PROHIBITED_DEVICE | IMPERSONATION | CONTENT_DISCLOSURE | PROCTOR_INTERRUPTION" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CRITICAL" }
      - { name: description, type: string, source: input, description: "Proctor narrative" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBSTANTIATED | UNSUBSTANTIATED" }
      - { name: outcome_note, type: string, source: input, description: "Adjudicator note; null while OPEN" }
      - { name: placed_hold, type: boolean, source: system, default: false, description: "True when opening this incident moved the registration's score_status to WITHHELD" }

  # ---------------------------------------------------------------------------
  - name: Certificant
    parent: null
    common_fields: true
    fields:
      - { name: candidate_id, type: string, source: system, description: "FK -> Candidate.id; the person holding the credential" }
      - { name: program_id, type: string, source: system, description: "FK -> CertificationProgram.id; the program that issued the credential" }
      - { name: certificate_number, type: string, source: computed, description: "'{credential_code}-{issue_year}-{sequence:05d}' where sequence = program.certificants_issued_count + 1 at minting" }
      - { name: issued_on, type: datetime, source: system, description: "Logical-clock instant the credential was minted" }
      - { name: valid_through, type: datetime, source: computed, description: "issued_on + program.cycle_length_months; extended by every cycle close" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | EXPIRED | REVOKED" }
      - { name: suspension_until, type: datetime, source: system, description: "Instant a SANCTIONED suspension lifts; null unless status == SUSPENDED" }
      - { name: publication_status, type: enum, source: computed, description: "PUBLISHED when status == ACTIVE; WITHHELD when status IN {SUSPENDED, EXPIRED}; REMOVED when status == REVOKED" }
      - { name: ceu_credits_applied, type: number, source: computed, description: "credits_applied of the certificant's cycle with status IN {OPEN, SATISFIED}; 0 when no such cycle exists" }
      - { name: current_cycle_id, type: string, source: system, description: "Id of this certificant's RecertificationCycle with status IN {OPEN, SATISFIED, LAPSED} and the greatest cycle_number; readable via GET /recertification-cycles?certificant_id=<id>; null when every cycle is CLOSED or VOID" }

  # ---------------------------------------------------------------------------
  - name: RecertificationCycle
    parent: null
    common_fields: true
    fields:
      - { name: certificant_id, type: string, source: system, description: "FK -> Certificant.id; the credential holder the cycle belongs to" }
      - { name: reexam_registration_id, type: string, source: system, description: "FK -> ExamRegistration.id; the passing re-examination sitting that satisfied this cycle; null on the CEU path" }
      - { name: cycle_number, type: integer, source: system, description: "1 for the cycle minted with the credential, +1 per close" }
      - { name: starts_on, type: datetime, source: system, description: "Cycle window open instant" }
      - { name: ends_on, type: datetime, source: computed, description: "starts_on + program.cycle_length_months" }
      - { name: grace_ends_on, type: datetime, source: computed, description: "ends_on + program.recert_grace_days" }
      - { name: required_credits, type: number, source: system, description: "Snapshot of program.required_ceu_credits pinned at cycle creation" }
      - { name: accrual_basis_snapshot, type: enum, source: system, description: "Snapshot of program.ceu_credit_accrual_basis pinned at cycle creation: STRICT_CYCLE | CARRYOVER_ALLOWED" }
      - { name: carryover_credits_in, type: number, source: system, default: 0, description: "Credits carried in from the previous cycle's close" }
      - { name: credits_applied, type: number, source: computed, default: 0, description: "Capped, rounded credit total for this cycle, 2 decimals" }
      - { name: carryover_credits_out, type: number, source: computed, default: 0, description: "Credits carried forward at close: min(credits_applied - required_credits, program.ceu_carryover_max_credits), floored at 0" }
      - { name: path, type: enum, source: system, description: "CEU | RE_EXAM" }
      - { name: status, type: enum, source: system, description: "OPEN | SATISFIED | CLOSED | LAPSED | VOID" }
      - { name: reinstatement_fee_cents, type: integer, source: computed, description: "Total due to reinstate a LAPSED cycle; null unless status == LAPSED" }

  # ---------------------------------------------------------------------------
  - name: CEUActivity
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> RecertificationCycle.id; the cycle the credit is claimed against" }
      - { name: activity_date, type: datetime, source: input, description: "Instant the learning activity was completed" }
      - { name: category, type: enum, source: input, description: "LIVE_INSTRUCTION | SELF_STUDY | PRESENTING | PUBLICATION | VOLUNTEER" }
      - { name: provider, type: string, source: input, description: "Provider or publication name" }
      - { name: contact_hours, type: number, source: input, description: "Documented contact hours", constraints: "> 0, at most 2 decimals" }
      - { name: credits_awarded, type: number, source: computed, description: "round_half_up(contact_hours * category multiplier, 2) — before per-category capping" }
      - { name: credits_counted, type: number, source: computed, default: 0, description: "Portion of credits_awarded that survived the per-category cycle cap; 0 when counted == false" }
      - { name: counted, type: boolean, source: computed, default: false, description: "True when status IN {APPROVED, VERIFIED} and activity_date falls in the cycle's accrual window" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | AUDIT_SELECTED | VERIFIED | REVOKED" }
      - { name: reviewer_user_id, type: string, source: system, description: "X-User-ID that recorded the review decision; null while SUBMITTED" }
      - { name: audit_verifier_user_id, type: string, source: system, description: "X-User-ID that recorded the audit verification; null until audited" }
      - { name: review_note, type: string, source: input, description: "Reviewer or auditor note; null when never supplied" }

  # ---------------------------------------------------------------------------
  - name: DisciplinaryCase
    parent: null
    common_fields: true
    fields:
      - { name: certificant_id, type: string, source: input, description: "FK -> Certificant.id; the respondent" }
      - { name: allegation_type, type: enum, source: input, description: "CREDENTIAL_MISUSE | EXAM_MISCONDUCT | CEU_FALSIFICATION | ETHICS_VIOLATION" }
      - { name: description, type: string, source: input, description: "Allegation narrative" }
      - { name: status, type: enum, source: system, description: "OPENED | RESPONSE_REQUESTED | UNDER_REVIEW | CLOSED" }
      - { name: response_round, type: integer, source: system, default: 0, description: "Increments by 1 on every RESPONSE_REQUESTED -> UNDER_REVIEW respondent submission" }
      - { name: response_text, type: string, source: system, description: "Most recent respondent submission; null before the first response" }
      - { name: outcome, type: enum, source: system, description: "null | DISMISSED | SANCTIONED | REVOKED" }
      - { name: sanction_months, type: integer, source: input, description: "Suspension length; required when outcome == SANCTIONED, must be null otherwise", constraints: "1–60" }
      - { name: decided_on, type: datetime, source: system, description: "Logical-clock instant the case was CLOSED; null while open" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the EthicsOfficer that opened the case" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: CertificationProgram
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /programs/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "program.status == DRAFT (else ERR_INVALID_STATE)"
          - "sum of domain_specs[].weight_pct == 100 (else ERR_BLUEPRINT_WEIGHTS_INVALID)"
        side_effects:
          - "Any other CertificationProgram with the same credential_code and status == ACTIVE moves to SUPERSEDED"
          - "recompute blueprint_posture, operational_item_count, deficient_domain_codes"
          - "increments CertificationProgram.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event — another program with the same credential_code is activated"
        actor: system
        preconditions:
          - "the newly activated program has the same credential_code"
        side_effects:
          - "POST /applications against a SUPERSEDED program is rejected with ERR_PROGRAM_NOT_ACTIVE"
          - "existing APPROVED applications remain usable until eligibility_expires_on"
          - "increments CertificationProgram.version by 1"

  # ---------------------------------------------------------------------------
  - entity: Item
    initial_state: DRAFT
    terminal_states: [REJECTED, RETIRED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /items/{id}/submit-for-review"
        actor: ItemSpecialist
        preconditions:
          - "item.status IN {DRAFT, REVISION_REQUESTED} (else ERR_INVALID_STATE)"
          - "acting X-User-ID == item.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approver_user_ids reset to []"
      - from: REVISION_REQUESTED
        to: IN_REVIEW
        trigger: "POST /items/{id}/submit-for-review"
        actor: ItemSpecialist
        preconditions:
          - "acting X-User-ID == item.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "review_round += 1"
          - "approver_user_ids reset to [] — approvals never carry across rounds"
        note: "This is the revision loop: DRAFT -> IN_REVIEW -> REVISION_REQUESTED -> IN_REVIEW."
      - from: IN_REVIEW
        to: IN_REVIEW
        trigger: "POST /items/{id}/review with decision == APPROVE (first approval of the round)"
        actor: ItemSpecialist
        preconditions:
          - "acting X-User-ID != item.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "acting X-User-ID not already in approver_user_ids (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "acting X-User-ID appended to approver_user_ids"
        note: "Two distinct non-author approvals are required; the first leaves the item IN_REVIEW."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /items/{id}/review with decision == APPROVE (second approval of the round)"
        actor: ItemSpecialist
        preconditions:
          - "acting X-User-ID != item.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "acting X-User-ID not already in approver_user_ids (else ERR_SEGREGATION_OF_DUTIES)"
          - "len(approver_user_ids) == 1 before this call"
        side_effects:
          - "acting X-User-ID appended to approver_user_ids (length becomes 2)"
      - from: IN_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /items/{id}/review with decision == REVISE"
        actor: ItemSpecialist
        preconditions:
          - "acting X-User-ID != item.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approver_user_ids reset to [] — a revise request discards partial approvals of the round"
      - from: IN_REVIEW
        to: REJECTED
        trigger: "POST /items/{id}/review with decision == REJECT"
        actor: ItemSpecialist
        preconditions:
          - "acting X-User-ID != item.author_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "item may never appear in a new ExamForm.item_ids (ERR_ITEM_NOT_ELIGIBLE_FOR_FORM)"
      - from: APPROVED
        to: PRETEST
        trigger: "POST /items/{id}/response-batches with is_pretest == true"
        actor: Psychometrician
        preconditions:
          - "item.status IN {APPROVED, PRETEST} (else ERR_ITEM_NOT_ELIGIBLE_FOR_STATS)"
        side_effects:
          - "pretest_* accumulators increased by the batch counts"
          - "calculations.item_statistics then calculations.item_flag_evaluation re-run"
      - from: PRETEST
        to: OPERATIONAL
        trigger: "system event — item_flag_evaluation after a batch ingest yields flag_reason == null and stat_basis_applied != INSUFFICIENT_DATA"
        actor: system
        preconditions:
          - "stat_basis_applied != INSUFFICIENT_DATA"
          - "flag_reason == null"
        side_effects:
          - "CASCADE hop: program.operational_item_count += 1, deficient_domain_codes and blueprint_posture recomputed; a program can flip DEFICIENT -> COMPLETE here"
      - from: PRETEST
        to: RETIRED
        trigger: "system event — item_flag_evaluation after a batch ingest yields flag_reason != null"
        actor: system
        preconditions:
          - "stat_basis_applied != INSUFFICIENT_DATA"
          - "flag_reason != null"
        side_effects:
          - "retirement_reason = PRETEST_FAILED, retired_at = current_utc"
          - "no form cascade — a PRETEST item never occupies a scored position"
      - from: OPERATIONAL
        to: FLAGGED
        trigger: "system event — item_flag_evaluation after a batch ingest yields flag_reason != null"
        actor: system
        preconditions:
          - "stat_basis_applied != INSUFFICIENT_DATA"
        side_effects:
          - "CASCADE hop: program.operational_item_count -= 1; deficient_domain_codes and blueprint_posture recomputed; the program can flip COMPLETE -> DEFICIENT, which in turn blocks POST /forms/{id}/publish with ERR_BLUEPRINT_DEFICIENT"
      - from: FLAGGED
        to: OPERATIONAL
        trigger: "system event — item_flag_evaluation after a further batch ingest yields flag_reason == null"
        actor: system
        preconditions:
          - "stat_basis_applied != INSUFFICIENT_DATA"
        side_effects:
          - "program.operational_item_count += 1; blueprint_posture recomputed"
        note: "OPERATIONAL -> FLAGGED -> OPERATIONAL is the psychometric monitoring cycle."
      - from: FLAGGED
        to: RETIRED
        trigger: "POST /items/{id}/retire"
        actor: Psychometrician
        preconditions:
          - "item.status IN {OPERATIONAL, FLAGGED} (else ERR_INVALID_STATE)"
        side_effects:
          - "retired_at = current_utc; retirement_reason from the request"
          - "CASCADE hop 1: every ExamForm whose item_ids contains this item recomputes retired_item_count"
          - "CASCADE hop 2: each such form with status == PUBLISHED whose retired_item_count*100 > program.form_retirement_tolerance_pct * len(item_ids) moves to NEEDS_REBUILD"
          - "CASCADE hop 3: because the form moved to NEEDS_REBUILD, every ExamRegistration on that form with seat_status == SCHEDULED moves to UNSCHEDULED with form_reassignment_required = true and session_id cleared"
          - "CASCADE hop 4: because those seats were released, each affected ExamSession recomputes seats_reserved and may flip status FULL -> OPEN"
          - "program.operational_item_count -= 1; blueprint_posture recomputed"
      - from: OPERATIONAL
        to: RETIRED
        trigger: "POST /items/{id}/retire"
        actor: Psychometrician
        preconditions:
          - "item.status IN {OPERATIONAL, FLAGGED} (else ERR_INVALID_STATE)"
        side_effects:
          - "identical four-hop cascade as FLAGGED -> RETIRED"

  # ---------------------------------------------------------------------------
  - entity: ExamForm
    initial_state: ASSEMBLED
    terminal_states: [NEEDS_REBUILD]
    transitions:
      - from: ASSEMBLED
        to: CUT_SCORE_SET
        trigger: "POST /forms/{id}/adopt-cut-score"
        actor: Psychometrician
        preconditions:
          - "form.status IN {ASSEMBLED, CUT_SCORE_SET} (else ERR_INVALID_STATE)"
          - "expected_form_version == form.version (else ERR_STALE_VERSION)"
          - "acting X-User-ID not in form.panelist_user_ids (else ERR_SEGREGATION_OF_DUTIES)"
          - "len(form.panel_ratings) >= program.min_panelists AND len(panel_ratings) - 2*program.panel_trim_count >= 1 (else ERR_PANEL_QUORUM_NOT_MET)"
        side_effects:
          - "calculations.angoff_cut_score writes raw_cut_score and mean_expected_pass_rate"
          - "panel_status = ADOPTED"
          - "increments ExamForm.version by 1"
      - from: CUT_SCORE_SET
        to: CUT_SCORE_SET
        trigger: "POST /forms/{id}/adopt-cut-score (re-adoption after further ratings)"
        actor: Psychometrician
        preconditions:
          - "expected_form_version == form.version (else ERR_STALE_VERSION)"
          - "acting X-User-ID not in form.panelist_user_ids (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "raw_cut_score recomputed over the current panel_ratings and supersedes the prior value"
          - "increments ExamForm.version by 1"
        note: "Re-adoption is legitimate while the form is unpublished, which is what makes the OCC guard in §1.2.1 a real race rather than a state precondition."
      - from: CUT_SCORE_SET
        to: PUBLISHED
        trigger: "POST /forms/{id}/publish"
        actor: ProgramAdmin
        preconditions:
          - "form.status == CUT_SCORE_SET (else ERR_INVALID_STATE)"
          - "program.status == ACTIVE (else ERR_PROGRAM_NOT_ACTIVE)"
          - "program.blueprint_posture == COMPLETE (else ERR_BLUEPRINT_DEFICIENT)"
          - "every id in item_ids that is not in pretest_item_ids resolves to an Item with status == OPERATIONAL (else ERR_ITEM_NOT_OPERATIONAL)"
        side_effects:
          - "form becomes selectable by POST /exam-registrations"
      - from: PUBLISHED
        to: NEEDS_REBUILD
        trigger: "system event — cascade hop 2 of Item -> RETIRED"
        actor: system
        preconditions:
          - "retired_item_count*100 > program.form_retirement_tolerance_pct * len(item_ids)"
        side_effects:
          - "CASCADE hop 3: every ExamRegistration on this form with seat_status == SCHEDULED moves to UNSCHEDULED, form_reassignment_required = true, session_id cleared"
          - "no new ExamRegistration may cite this form (ERR_FORM_NOT_PUBLISHED)"

  # ---------------------------------------------------------------------------
  - entity: EligibilityApplication
    initial_state: SUBMITTED
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /applications/{id}/verify (first of the two dimensions)"
        actor: EligibilityReviewer
        preconditions:
          - "application.status IN {SUBMITTED, UNDER_REVIEW} (else ERR_INVALID_STATE)"
          - "the requested dimension is still PENDING (else ERR_DIMENSION_ALREADY_VERIFIED)"
        side_effects:
          - "the named dimension moves to VERIFIED or FAILED per calculations.eligibility_dimension_evaluation"
          - "{dimension, acting X-User-ID} appended to verifier_user_ids"
        note: "Fork: the two dimensions are verified independently and in either order."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /applications/{id}/verify (second dimension, both VERIFIED, sequence not sampled)"
        actor: EligibilityReviewer
        preconditions:
          - "education_status == VERIFIED AND experience_status == VERIFIED after this call"
          - "audit_sequence_number % program.audit_every_nth != 0"
        side_effects:
          - "program.verified_application_counter += 1; audit_sequence_number = that value"
          - "eligibility_expires_on = current_utc + program.eligibility_valid_days"
        note: "Join branch A — divergent side effect set: an expiry stamp is written and registration is unlocked."
      - from: UNDER_REVIEW
        to: AUDIT_SELECTED
        trigger: "POST /applications/{id}/verify (second dimension, both VERIFIED, sequence sampled)"
        actor: EligibilityReviewer
        preconditions:
          - "education_status == VERIFIED AND experience_status == VERIFIED after this call"
          - "audit_sequence_number % program.audit_every_nth == 0"
        side_effects:
          - "program.verified_application_counter += 1; audit_sequence_number = that value"
          - "eligibility_expires_on stays null — registration remains blocked with ERR_APPLICATION_NOT_APPROVED"
        note: "Join branch B — divergent side effect set: no expiry stamp, registration stays locked pending audit."
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /applications/{id}/verify with outcome FAIL on either dimension"
        actor: EligibilityReviewer
        preconditions:
          - "the verified dimension evaluated to FAILED"
        side_effects:
          - "denial_reason = EDUCATION_FAILED or EXPERIENCE_FAILED"
          - "program.verified_application_counter is NOT incremented — only fully verified pairs enter the audit sequence"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /applications/{id}/verify with outcome FAIL on the first dimension"
        actor: EligibilityReviewer
        preconditions:
          - "the verified dimension evaluated to FAILED"
        side_effects:
          - "denial_reason = EDUCATION_FAILED or EXPERIENCE_FAILED"
      - from: AUDIT_SELECTED
        to: APPROVED
        trigger: "POST /applications/{id}/audit-decision with outcome == PASS"
        actor: EligibilityReviewer
        preconditions:
          - "application.status == AUDIT_SELECTED (else ERR_INVALID_STATE)"
          - "acting X-User-ID not present in verifier_user_ids[].user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "auditor_user_id = acting X-User-ID"
          - "eligibility_expires_on = current_utc + program.eligibility_valid_days"
      - from: AUDIT_SELECTED
        to: DENIED
        trigger: "POST /applications/{id}/audit-decision with outcome == FAIL"
        actor: EligibilityReviewer
        preconditions:
          - "acting X-User-ID not present in verifier_user_ids[].user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "auditor_user_id = acting X-User-ID; denial_reason = AUDIT_FAILED"
      - from: APPROVED
        to: EXPIRED
        trigger: "POST /recertification-runs (sweep step 2)"
        actor: system
        preconditions:
          - "current_utc > eligibility_expires_on"
        side_effects:
          - "further POST /exam-registrations citing this application fail with ERR_APPLICATION_NOT_APPROVED"
          - "already-created registrations are unaffected — they carry eligibility_expires_on_snapshot"

  # ---------------------------------------------------------------------------
  - entity: ExamRegistration
    initial_state: "seat_status = UNSCHEDULED, score_status = NOT_APPLICABLE"
    terminal_states: ["seat_status IN {NO_SHOW, CANCELLED}", "score_status IN {REPORTED, VOIDED}"]
    note: "Two independent dimensions on the same row. seat_status tracks the sitting; score_status tracks the result. A CRITICAL SecurityIncident moves score_status without touching seat_status; a form rebuild moves seat_status without touching score_status."
    transitions:
      - from: "seat_status = UNSCHEDULED"
        to: "seat_status = SCHEDULED"
        trigger: "POST /exam-registrations/{id}/schedule"
        actor: Candidate
        preconditions:
          - "seat_status == UNSCHEDULED (else ERR_INVALID_STATE)"
          - "expected_session_version == session.version (else ERR_STALE_VERSION)"
          - "candidate.status == ACTIVE (else ERR_CANDIDATE_BARRED)"
          - "form.status == PUBLISHED (else ERR_FORM_NOT_PUBLISHED)"
          - "session.status != CLOSED, i.e. current_utc < session.starts_at (else ERR_SESSION_CLOSED)"
          - "no candidate-window conflict with another sitting of the same candidate (else ERR_CANDIDATE_WINDOW_CONFLICT)"
          - "session.seats_reserved < session.seat_capacity (else ERR_SESSION_FULL)"
        side_effects:
          - "session_id set; session_ends_at snapshot written"
          - "session.seats_reserved += 1; session.status recomputed (may become FULL)"
          - "increments ExamSession.version by 1"
      - from: "seat_status = SCHEDULED"
        to: "seat_status = UNSCHEDULED"
        trigger: "POST /exam-registrations/{id}/cancel-schedule"
        actor: Candidate
        preconditions:
          - "seat_status == SCHEDULED (else ERR_INVALID_STATE)"
          - "current_utc < session.starts_at (else ERR_SESSION_CLOSED)"
        side_effects:
          - "COMPENSATION: session.seats_reserved -= 1 on the previously held session; session.status recomputed (may flip FULL -> OPEN)"
          - "session_id cleared; session_ends_at retained for retake-wait arithmetic"
          - "increments ExamSession.version by 1"
      - from: "seat_status = SCHEDULED"
        to: "seat_status = UNSCHEDULED"
        trigger: "system event — cascade hop 3 of Item -> RETIRED"
        actor: system
        preconditions:
          - "the registration's form moved to NEEDS_REBUILD"
        side_effects:
          - "form_reassignment_required = true"
          - "session.seats_reserved -= 1 (cascade hop 4); session.status recomputed"
      - from: "seat_status = SCHEDULED"
        to: "seat_status = CHECKED_IN"
        trigger: "POST /exam-registrations/{id}/check-in"
        actor: ExamOperations
        preconditions:
          - "seat_status == SCHEDULED (else ERR_INVALID_STATE)"
          - "candidate.status == ACTIVE (else ERR_CANDIDATE_BARRED)"
          - "session.starts_at - 30 minutes <= current_utc <= session.ends_at (else ERR_CHECKIN_WINDOW_CLOSED)"
          - "form.status == PUBLISHED (else ERR_FORM_NOT_PUBLISHED)"
        side_effects:
          - "score_status moves NOT_APPLICABLE -> PENDING on the same call"
      - from: "seat_status = CHECKED_IN"
        to: "seat_status = COMPLETED"
        trigger: "POST /exam-registrations/{id}/submit-responses"
        actor: ExamOperations
        preconditions:
          - "seat_status == CHECKED_IN (else ERR_INVALID_STATE)"
          - "score_status == PENDING (else ERR_SCORE_UNDER_SECURITY_HOLD when WITHHELD)"
          - "0 <= raw_score <= form.scored_item_count (else ERR_RAW_SCORE_OUT_OF_RANGE)"
        side_effects:
          - "calculations.scaled_score_equating writes scaled_score and outcome"
          - "score_status moves PENDING -> SCORED"
          - "application.attempts_consumed += 1"
      - from: "seat_status = SCHEDULED"
        to: "seat_status = NO_SHOW"
        trigger: "POST /recertification-runs (sweep step 1)"
        actor: system
        preconditions:
          - "current_utc > session.ends_at"
        side_effects:
          - "session.seats_reserved -= 1 (a no-show releases the seat from the occupancy formula)"
          - "application.attempts_consumed += 1 — the attempt is consumed even though no score exists"
      - from: "seat_status = SCHEDULED"
        to: "seat_status = CANCELLED"
        trigger: "system event — cascade hop 3 of SecurityIncident -> SUBSTANTIATED (severity CRITICAL) on a sibling registration"
        actor: system
        preconditions:
          - "the registration's candidate moved to BARRED"
          - "this registration is not the one the incident was raised against"
        side_effects:
          - "session.seats_reserved -= 1 (cascade hop 4); session.status recomputed"
          - "session_id cleared"
      - from: "score_status = NOT_APPLICABLE"
        to: "score_status = PENDING"
        trigger: "POST /exam-registrations/{id}/check-in"
        actor: ExamOperations
        preconditions:
          - "seat_status transition SCHEDULED -> CHECKED_IN succeeded on this call"
        side_effects: []
      - from: "score_status = PENDING"
        to: "score_status = SCORED"
        trigger: "POST /exam-registrations/{id}/submit-responses"
        actor: ExamOperations
        preconditions:
          - "seat_status transition CHECKED_IN -> COMPLETED succeeded on this call"
        side_effects:
          - "scaled_score and outcome written"
      - from: "score_status = SCORED"
        to: "score_status = REPORTED"
        trigger: "POST /exam-registrations/{id}/report-score"
        actor: ExamOperations
        preconditions:
          - "score_status == SCORED (else ERR_INVALID_STATE)"
          - "no SecurityIncident on this registration with status == OPEN (else ERR_SCORE_UNDER_SECURITY_HOLD)"
        side_effects:
          - "CASCADE hop 1 (outcome == PASS only): a Certificant is minted for (candidate, program) with certificate_number from calculations.certificate_number_minting, status ACTIVE, publication_status PUBLISHED"
          - "CASCADE hop 2: because the Certificant was minted, program.certificants_issued_count += 1 and the certificant's valid_through is set to issued_on + program.cycle_length_months"
          - "CASCADE hop 3: because the Certificant exists, RecertificationCycle 1 is opened for it with required_credits and accrual_basis_snapshot pinned from the program, path CEU, carryover_credits_in 0; certificant.current_cycle_id points at it"
          - "outcome == FAIL: no Certificant is minted; the registration is simply REPORTED"
          - "outcome == PASS on a registration whose reexam intent is set (its application's candidate already holds a Certificant with a RE_EXAM cycle): the existing cycle's reexam_registration_id is set and the cycle moves OPEN/LAPSED -> SATISFIED instead of minting a second Certificant"
      - from: "score_status IN {PENDING, SCORED}"
        to: "score_status = WITHHELD"
        trigger: "POST /exam-registrations/{id}/security-incidents with severity == CRITICAL"
        actor: ExamOperations
        preconditions:
          - "score_status IN {PENDING, SCORED} (no hold is placed when NOT_APPLICABLE, REPORTED, VOIDED)"
        side_effects:
          - "score_status_before_hold = the pre-call score_status; incident.placed_hold = true"
      - from: "score_status = WITHHELD"
        to: "score_status = VOIDED"
        trigger: "POST /security-incidents/{id}/adjudicate with outcome == SUBSTANTIATE"
        actor: ExamOperations
        preconditions:
          - "incident.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "CASCADE hop 1: registration.score_status = VOIDED, scaled_score and outcome cleared to null"
          - "CASCADE hop 2 (severity CRITICAL): because the score was voided, candidate.status = BARRED with bar_reason SECURITY_INCIDENT and barred_until = current_utc + 730 days"
          - "CASCADE hop 3: because the candidate is BARRED, every other ExamRegistration of that candidate with seat_status == SCHEDULED moves to CANCELLED"
          - "CASCADE hop 4: because those seats were released, each affected ExamSession recomputes seats_reserved and may flip FULL -> OPEN"
      - from: "score_status = WITHHELD"
        to: "score_status = SCORED"
        trigger: "POST /security-incidents/{id}/adjudicate with outcome == DISMISS"
        actor: ExamOperations
        preconditions:
          - "incident.status == OPEN (else ERR_INVALID_STATE)"
          - "incident.placed_hold == true"
        side_effects:
          - "COMPENSATION: score_status restored to score_status_before_hold; score_status_before_hold cleared to null"
          - "incident.status = UNSUBSTANTIATED; candidate.status untouched"

  # ---------------------------------------------------------------------------
  - entity: SecurityIncident
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, UNSUBSTANTIATED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /security-incidents/{id}/adjudicate with outcome == SUBSTANTIATE"
        actor: ExamOperations
        preconditions:
          - "incident.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "the four-hop cascade documented on ExamRegistration score_status WITHHELD -> VOIDED"
          - "for severity MINOR or MAJOR the cascade stops after hop 1 — the candidate is not barred"
      - from: OPEN
        to: UNSUBSTANTIATED
        trigger: "POST /security-incidents/{id}/adjudicate with outcome == DISMISS"
        actor: ExamOperations
        preconditions:
          - "incident.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "if placed_hold, the registration's score_status is restored from score_status_before_hold"

  # ---------------------------------------------------------------------------
  - entity: Certificant
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /disciplinary-cases/{id}/decide with outcome == SANCTIONED"
        actor: EthicsOfficer
        preconditions:
          - "certificant.status == ACTIVE (else ERR_CERTIFICANT_NOT_ACTIVE)"
        side_effects:
          - "suspension_until = current_utc + sanction_months; publication_status recomputed to WITHHELD"
          - "POST /ceu-activities against the certificant's cycle is rejected with ERR_CERTIFICANT_NOT_ACTIVE"
          - "increments Certificant.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /recertification-runs (sweep step 4)"
        actor: system
        preconditions:
          - "current_utc >= suspension_until"
        side_effects:
          - "suspension_until cleared; publication_status recomputed to PUBLISHED"
        note: "ACTIVE -> SUSPENDED -> ACTIVE is the sanction cycle."
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /recertification-runs (sweep step 3)"
        actor: system
        preconditions:
          - "the certificant's cycle moved OPEN -> LAPSED on this sweep"
        side_effects:
          - "publication_status recomputed to WITHHELD"
          - "GET /registry/verify reports credential_status EXPIRED"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /recertification-cycles/{id}/reinstate"
        actor: Certificant
        preconditions:
          - "the cycle being reinstated is LAPSED and belongs to this certificant"
          - "payment_cents >= cycle.reinstatement_fee_cents (else ERR_REINSTATEMENT_FEE_UNPAID)"
        side_effects:
          - "publication_status recomputed to PUBLISHED"
          - "increments Certificant.version by 1"
      - from: "ACTIVE | SUSPENDED | EXPIRED"
        to: REVOKED
        trigger: "POST /disciplinary-cases/{id}/decide with outcome == REVOKED"
        actor: EthicsOfficer
        preconditions:
          - "certificant.status != REVOKED (else ERR_CERTIFICANT_ALREADY_REVOKED)"
          - "case.response_round >= 1 (else ERR_DUE_PROCESS_INCOMPLETE)"
        side_effects:
          - "CASCADE hop 1: certificant.status = REVOKED, publication_status recomputed to REMOVED, current_cycle_id cleared"
          - "CASCADE hop 2: because the certificant was revoked, every RecertificationCycle of that certificant with status IN {OPEN, SATISFIED, LAPSED} moves to VOID"
          - "CASCADE hop 3: because those cycles were voided, every CEUActivity under them with status IN {APPROVED, AUDIT_SELECTED, VERIFIED} has counted set to false and credits_counted set to 0, and the cycle's credits_applied is recomputed to 0.00"
          - "increments Certificant.version by 1"

  # ---------------------------------------------------------------------------
  - entity: RecertificationCycle
    initial_state: OPEN
    terminal_states: [CLOSED, VOID]
    transitions:
      - from: OPEN
        to: SATISFIED
        trigger: "system event — calculations.ceu_credit_accrual after a CEUActivity status change yields credits_applied >= required_credits"
        actor: system
        preconditions:
          - "cycle.path == CEU"
          - "credits_applied >= required_credits (>= comparison, exact equality satisfies)"
        side_effects:
          - "POST /recertification-cycles/{id}/close becomes available"
        note: "Compound: the cycle's status is re-derived from the aggregate state of its CEUActivity children."
      - from: SATISFIED
        to: OPEN
        trigger: "system event — calculations.ceu_credit_accrual after a CEUActivity is AUDIT_SELECTED or REVOKED yields credits_applied < required_credits"
        actor: system
        preconditions:
          - "credits_applied < required_credits"
        side_effects:
          - "COMPENSATION: the cycle reverts to OPEN and close is rejected with ERR_CREDITS_NOT_SATISFIED"
        note: "OPEN -> SATISFIED -> OPEN is the credit-reconciliation cycle."
      - from: "OPEN | LAPSED"
        to: SATISFIED
        trigger: "system event — cascade of POST /exam-registrations/{id}/report-score with outcome PASS on a RE_EXAM cycle"
        actor: system
        preconditions:
          - "cycle.path == RE_EXAM"
          - "the reported registration's candidate_id == certificant.candidate_id"
        side_effects:
          - "reexam_registration_id set to the reported registration"
      - from: SATISFIED
        to: CLOSED
        trigger: "POST /recertification-cycles/{id}/close"
        actor: Certificant
        preconditions:
          - "cycle.status == SATISFIED (else ERR_CREDITS_NOT_SATISFIED)"
          - "expected_certificant_version == certificant.version (else ERR_STALE_VERSION)"
          - "certificant.status == ACTIVE (else ERR_CERTIFICANT_NOT_ACTIVE)"
        side_effects:
          - "CASCADE hop 1: carryover_credits_out computed per calculations.carryover_computation"
          - "CASCADE hop 2: because the cycle closed, certificant.valid_through += program.cycle_length_months and Certificant.version increments by 1"
          - "CASCADE hop 3: because valid_through advanced, a successor RecertificationCycle is opened with cycle_number+1, starts_on = predecessor.ends_on, carryover_credits_in = predecessor.carryover_credits_out, required_credits and accrual_basis_snapshot re-pinned from the program, and certificant.current_cycle_id repointed to it"
      - from: OPEN
        to: LAPSED
        trigger: "POST /recertification-runs (sweep step 3)"
        actor: system
        preconditions:
          - "current_utc > grace_ends_on (strictly after)"
          - "cycle.status == OPEN"
        side_effects:
          - "calculations.reinstatement_fee_assessment writes reinstatement_fee_cents"
          - "the owning Certificant moves ACTIVE -> EXPIRED"
      - from: LAPSED
        to: OPEN
        trigger: "POST /recertification-cycles/{id}/reinstate"
        actor: Certificant
        preconditions:
          - "cycle.status == LAPSED (else ERR_INVALID_STATE)"
          - "payment_cents >= reinstatement_fee_cents (else ERR_REINSTATEMENT_FEE_UNPAID)"
        side_effects:
          - "grace_ends_on extended by program.recert_grace_days; reinstatement_fee_cents cleared to null"
          - "the owning Certificant moves EXPIRED -> ACTIVE"
      - from: OPEN
        to: OPEN
        trigger: "POST /recertification-cycles/{id}/elect-reexam"
        actor: Certificant
        preconditions:
          - "cycle.status IN {OPEN, LAPSED} (else ERR_INVALID_STATE)"
          - "cycle.path == CEU (else ERR_INVALID_STATE)"
        side_effects:
          - "path = RE_EXAM; required_credits set to 0; every CEUActivity under the cycle with status IN {SUBMITTED, APPROVED, AUDIT_SELECTED, VERIFIED} has counted set to false and credits_counted set to 0; credits_applied recomputed to 0.00"
          - "the cycle can from now on only be satisfied by a passing re-examination"
      - from: "OPEN | SATISFIED | LAPSED"
        to: VOID
        trigger: "system event — cascade hop 2 of Certificant -> REVOKED"
        actor: system
        preconditions:
          - "the owning certificant moved to REVOKED"
        side_effects:
          - "cascade hop 3: every counted CEUActivity under the cycle is decounted and credits_applied recomputed to 0.00"

  # ---------------------------------------------------------------------------
  - entity: CEUActivity
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /ceu-activities/{id}/review with outcome == APPROVE"
        actor: EligibilityReviewer
        preconditions:
          - "activity.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "the owning cycle's status IN {OPEN, SATISFIED} (else ERR_INVALID_STATE)"
        side_effects:
          - "reviewer_user_id = acting X-User-ID; counted = true"
          - "calculations.ceu_credit_accrual re-runs for the cycle, rewriting credits_counted on every activity of the capped categories and cycle.credits_applied"
          - "the cycle may bubble OPEN -> SATISFIED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /ceu-activities/{id}/review with outcome == REJECT"
        actor: EligibilityReviewer
        preconditions:
          - "activity.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "reviewer_user_id = acting X-User-ID; counted stays false, credits_counted stays 0"
      - from: SUBMITTED
        to: AUDIT_SELECTED
        trigger: "POST /ceu-activities/{id}/review with outcome == SELECT_FOR_AUDIT"
        actor: EligibilityReviewer
        preconditions:
          - "activity.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "reviewer_user_id = acting X-User-ID; counted stays false — documentation must be verified before the credit counts"
      - from: APPROVED
        to: AUDIT_SELECTED
        trigger: "POST /ceu-activities/{id}/review with outcome == SELECT_FOR_AUDIT"
        actor: EligibilityReviewer
        preconditions:
          - "activity.status IN {SUBMITTED, APPROVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: counted = false, credits_counted = 0; cycle.credits_applied recomputed"
          - "the cycle may revert SATISFIED -> OPEN"
      - from: AUDIT_SELECTED
        to: VERIFIED
        trigger: "POST /ceu-activities/{id}/audit-verify with outcome == VERIFY"
        actor: EligibilityReviewer
        preconditions:
          - "activity.status == AUDIT_SELECTED (else ERR_INVALID_STATE)"
          - "acting X-User-ID != activity.reviewer_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "audit_verifier_user_id = acting X-User-ID; counted = true; cycle.credits_applied recomputed"
          - "the cycle may bubble OPEN -> SATISFIED"
      - from: AUDIT_SELECTED
        to: REVOKED
        trigger: "POST /ceu-activities/{id}/audit-verify with outcome == REVOKE"
        actor: EligibilityReviewer
        preconditions:
          - "activity.status == AUDIT_SELECTED (else ERR_INVALID_STATE)"
          - "acting X-User-ID != activity.reviewer_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "audit_verifier_user_id = acting X-User-ID; counted stays false; cycle.credits_applied recomputed"

  # ---------------------------------------------------------------------------
  - entity: DisciplinaryCase
    initial_state: OPENED
    terminal_states: [CLOSED]
    transitions:
      - from: "OPENED | UNDER_REVIEW"
        to: RESPONSE_REQUESTED
        trigger: "POST /disciplinary-cases/{id}/request-response"
        actor: EthicsOfficer
        preconditions:
          - "case.status IN {OPENED, UNDER_REVIEW} (else ERR_INVALID_STATE)"
          - "certificant.status != REVOKED (else ERR_CERTIFICANT_ALREADY_REVOKED)"
        side_effects: []
      - from: RESPONSE_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /disciplinary-cases/{id}/respond"
        actor: Certificant
        preconditions:
          - "case.status == RESPONSE_REQUESTED (else ERR_INVALID_STATE)"
          - "acting X-User-ID == case.certificant_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "response_round += 1; response_text overwritten with the submission"
        note: "UNDER_REVIEW -> RESPONSE_REQUESTED -> UNDER_REVIEW is the due-process negotiation loop; response_round counts the rounds."
      - from: "OPENED | UNDER_REVIEW"
        to: CLOSED
        trigger: "POST /disciplinary-cases/{id}/decide"
        actor: EthicsOfficer
        preconditions:
          - "case.status IN {OPENED, UNDER_REVIEW} (else ERR_INVALID_STATE)"
          - "acting X-User-ID != case.opened_by_user_id when outcome == REVOKED (else ERR_SEGREGATION_OF_DUTIES)"
          - "case.response_round >= 1 when outcome IN {SANCTIONED, REVOKED} (else ERR_DUE_PROCESS_INCOMPLETE)"
          - "sanction_months present iff outcome == SANCTIONED (else ERR_INVALID_REQUEST)"
        side_effects:
          - "outcome and decided_on written"
          - "outcome == SANCTIONED: certificant ACTIVE -> SUSPENDED"
          - "outcome == REVOKED: the three-hop revocation cascade documented on Certificant"
          - "outcome == DISMISSED: no certificant mutation"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-seat-stale-session
    parent_entity: ExamSession
    write_endpoint: "POST /exam-registrations/{id}/schedule"
    occ_field: "expected_session_version"
    description: |
      Claiming a seat on an ExamSession whose version has advanced since the
      client last read it is rejected. Seat claims by different registrations
      are all individually legitimate, so the seat count the client based its
      decision on is exactly the thing that can have moved; the stale version
      is the only deterministic signal that the client's view of remaining
      capacity is out of date.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: adopt-cut-score-stale-form
    parent_entity: ExamForm
    write_endpoint: "POST /forms/{id}/adopt-cut-score"
    occ_field: "expected_form_version"
    description: |
      Adopting a cut score against an ExamForm whose version has advanced is
      rejected. Re-adoption is legitimate while the form is unpublished — a
      later adoption supersedes the earlier raw_cut_score — so a writer whose
      view of the form predates the superseding adoption is working from a
      stale panel picture and must re-read before adopting.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: cycle-close-stale-certificant
    parent_entity: Certificant
    write_endpoint: "POST /recertification-cycles/{id}/close"
    occ_field: "expected_certificant_version"
    description: |
      Closing a RecertificationCycle extends the owning Certificant's
      valid_through, so it is rejected when the certificant's version has
      advanced since the client read it. Closing successive cycles is
      legitimate — each close bumps the certificant's version — which is why
      the guard cannot be reduced to a state precondition on the cycle.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:

  # ---------------------------------------------------------------------------
  - name: item_statistics
    algorithm_type: aggregation
    entity: Item
    trigger: "POST /items/{id}/response-batches (every ingest recomputes from the accumulators, never from the batch alone)"
    description: |
      Classical item analysis over one of two response pools. The pool is chosen
      by the owning program's psychometric_stat_basis flag, so the SAME
      accumulators yield two different (p_value, discrimination_index) pairs.
    variants:
      - variant: OPERATIONAL_ONLY
        selected_when: "program.psychometric_stat_basis == OPERATIONAL_ONLY (the default)"
        formula: |
          R  = operational_response_count
          C  = operational_correct_count
          Un = operational_upper_n ; Uc = operational_upper_correct
          Ln = operational_lower_n ; Lc = operational_lower_correct
        note: "Pretest accumulators are ignored entirely, even when they hold the bulk of the responses."
      - variant: POOLED
        selected_when: "program.psychometric_stat_basis == POOLED"
        formula: |
          R  = pretest_response_count + operational_response_count
          C  = pretest_correct_count  + operational_correct_count
          Un = pretest_upper_n + operational_upper_n ; Uc = pretest_upper_correct + operational_upper_correct
          Ln = pretest_lower_n + operational_lower_n ; Lc = pretest_lower_correct + operational_lower_correct
        note: "Pretest evidence is merged in, which can both cross the min_responses_for_stats floor and move both statistics."
    formula: |
      # applied identically to whichever pool the variant selected
      if R < program.min_responses_for_stats or Un == 0 or Ln == 0:
          stat_basis_applied  = "INSUFFICIENT_DATA"
          p_value             = null
          discrimination_index = null
      else:
          stat_basis_applied   = program.psychometric_stat_basis   # POOLED | OPERATIONAL_ONLY
          p_value              = round_half_up(C / R, 4)
          discrimination_index = round_half_up((Uc / Un) - (Lc / Ln), 4)
    precision: "p_value and discrimination_index to 4 decimal places, ROUND_HALF_UP; intermediate quotients are NOT pre-rounded"
    constants:
      min_responses_for_stats: "program.min_responses_for_stats (default 30) — compared with < , so exactly 30 responses DOES compute statistics"
    input_set: "the Item's own accumulator fields only"
    edge_cases:
      - "R exactly equal to min_responses_for_stats computes statistics (the guard is strict <)"
      - "Un == 0 or Ln == 0 forces INSUFFICIENT_DATA even when R is large — no division by zero"
      - "Switching the program flag does NOT retroactively recompute stored items; the new basis applies from the next ingest"

  # ---------------------------------------------------------------------------
  - name: item_flag_evaluation
    algorithm_type: threshold
    entity: Item
    trigger: "immediately after item_statistics on every POST /items/{id}/response-batches"
    description: "First-match-wins flag assignment; the ORDER of the three tests is normative because an item can violate two thresholds at once."
    formula: |
      if stat_basis_applied == "INSUFFICIENT_DATA":
          flag_reason = null            # unknown, not good
      elif discrimination_index < program.min_discrimination:
          flag_reason = "LOW_DISCRIMINATION"
      elif p_value > program.max_p_value:
          flag_reason = "TOO_EASY"
      elif p_value < program.min_p_value:
          flag_reason = "TOO_HARD"
      else:
          flag_reason = null
    precision: "comparisons on the already-rounded 4dp statistics"
    constants:
      min_discrimination: "0.15 — strict <, so exactly 0.1500 does NOT flag"
      max_p_value: "0.95 — strict >, so exactly 0.9500 does NOT flag"
      min_p_value: "0.20 — strict <, so exactly 0.2000 does NOT flag"
    input_set: "the Item's p_value, discrimination_index, stat_basis_applied"
    edge_cases:
      - "An item that is both too easy AND under-discriminating reports LOW_DISCRIMINATION, never TOO_EASY"
      - "discrimination_index exactly 0.1500 with p_value exactly 0.9500 yields flag_reason null"

  # ---------------------------------------------------------------------------
  - name: angoff_cut_score
    algorithm_type: weighted_scoring
    entity: ExamForm
    trigger: "POST /forms/{id}/adopt-cut-score"
    description: |
      Trimmed-mean modified-Angoff cut with a standard-error downward
      adjustment, then a clamp into a defensible band. Multiplication,
      addition/subtraction, division and a nested min/max clamp all appear, and
      the clamp is evaluated LAST.
    formula: |
      means  = [r.mean_expected_pass_rate for r in form.panel_ratings]
      n      = len(means)
      if n < program.min_panelists: -> ERR_PANEL_QUORUM_NOT_MET
      t      = program.panel_trim_count
      if n - 2*t < 1: -> ERR_PANEL_QUORUM_NOT_MET
      sorted_means = sorted(means)                      # ascending; ties keep insertion order
      trimmed      = sorted_means[t : n - t]
      k            = len(trimmed)
      trimmed_mean = round_half_up(sum(trimmed) / k, 6)
      if k == 1:
          sem = 0.0
      else:
          variance = sum((m - trimmed_mean)**2 for m in trimmed) / (k - 1)   # sample variance
          sem      = round_half_up(sqrt(variance) / sqrt(k), 6)
      adjusted     = trimmed_mean - program.cut_score_sem_multiplier * sem
      scored_item_count = len(form.item_ids) - len(form.pretest_item_ids)
      raw          = round_half_up(adjusted * scored_item_count, 0)
      floor_cut    = ceil(0.40 * scored_item_count)
      ceil_cut     = floor(0.90 * scored_item_count)
      raw_cut_score = min(max(raw, floor_cut), ceil_cut)
      mean_expected_pass_rate = trimmed_mean
    precision: "trimmed_mean and sem to 6 dp ROUND_HALF_UP; raw_cut_score is an integer via ROUND_HALF_UP then clamped"
    constants:
      min_panelists: "program.min_panelists (default 5)"
      panel_trim_count: "program.panel_trim_count (default 1) — one lowest AND one highest are dropped"
      cut_score_sem_multiplier: "program.cut_score_sem_multiplier (default 0.5)"
      CUT_FLOOR_RATIO: "0.40 — lower clamp is ceil(0.40 * scored_item_count)"
      CUT_CEILING_RATIO: "0.90 — upper clamp is floor(0.90 * scored_item_count)"
    input_set: "form.panel_ratings (all submitted ratings, one per panelist)"
    edge_cases:
      - "Trimming removes exactly one lowest and one highest even when they are equal in value"
      - "The clamp is applied after the SEM adjustment, so a hostile panel cannot push the cut below 40% of the scored positions"
      - "Re-adoption recomputes over the full current rating set, not incrementally"

  # ---------------------------------------------------------------------------
  - name: scaled_score_equating
    algorithm_type: tiered_pricing
    entity: ExamRegistration
    trigger: "POST /exam-registrations/{id}/submit-responses"
    description: "Two-segment piecewise-linear transformation anchored at the cut, then clamped to the reporting band. The PASS decision is made on the SCALED score, never on the raw score."
    formula: |
      cut   = form.raw_cut_score
      total = form.scored_item_count
      if raw_score >= cut:
          if total == cut: scaled = 800.0
          else:            scaled = 500 + (raw_score - cut) * (800 - 500) / (total - cut)
      else:
          if cut == 0:     scaled = 500.0
          else:            scaled = 200 + raw_score * (500 - 200) / cut
      scaled_score = min(max(round_half_up(scaled, 0), 200), 800)
      outcome      = "PASS" if scaled_score >= 500 else "FAIL"
    precision: "scaled_score is an integer, ROUND_HALF_UP at the final step only"
    constants:
      SCALE_MIN: 200
      SCALE_CUT: 500
      SCALE_MAX: 800
    input_set: "raw_score from the request, form.raw_cut_score, form.scored_item_count"
    edge_cases:
      - "raw_score exactly equal to the cut maps to exactly 500 and PASSES (>= comparison)"
      - "raw_score one below the cut lands below 500 and FAILS"
      - "raw_score 0 maps to exactly 200; raw_score == total maps to exactly 800"

  # ---------------------------------------------------------------------------
  - name: ceu_credit_accrual
    algorithm_type: waterfall_allocation
    entity: RecertificationCycle
    trigger: "any CEUActivity status change under the cycle, POST /recertification-cycles/{id}/elect-reexam, and the Certificant revocation cascade"
    description: |
      Per-category multipliers, per-category per-cycle caps filled in
      chronological order, then a cycle total. The accrual basis flag decides
      both the eligible date window and whether carryover credits count, so the
      same activity set yields two different credits_applied values.
    variants:
      - variant: STRICT_CYCLE
        selected_when: "cycle.accrual_basis_snapshot == STRICT_CYCLE"
        formula: |
          window       = [cycle.starts_on, cycle.ends_on]        # inclusive both ends
          carryover_in = 0.00                                    # carryover is forfeited
      - variant: CARRYOVER_ALLOWED
        selected_when: "cycle.accrual_basis_snapshot == CARRYOVER_ALLOWED"
        formula: |
          window       = [cycle.starts_on - 90 days, cycle.ends_on]   # 90-day look-back
          carryover_in = min(cycle.carryover_credits_in, program.ceu_carryover_max_credits)
    formula: |
      # 1. eligible set
      eligible = [a for a in activities_of(cycle)
                    if a.counted is true
                   and window[0] <= a.activity_date <= window[1]]
      # 2. per-activity award, ROUNDED FIRST (pinned order — rounding precedes capping)
      award(a)     = round_half_up(a.contact_hours * MULTIPLIER[a.category], 2)
      # 3. chronological cap fill: created_at ASC, tie-break activity_date ASC then contact_hours ASC
      remaining    = dict(CATEGORY_CAP)          # only SELF_STUDY and VOLUNTEER are capped
      for a in sorted(eligible, key=(created_at, activity_date, contact_hours)):
          if a.category in CATEGORY_CAP:
              a.credits_counted = min(award(a), remaining[a.category])
              remaining[a.category] -= a.credits_counted
          else:
              a.credits_counted = award(a)
      # 4. cycle total
      credits_applied = round_half_up(sum(a.credits_counted for a in eligible) + carryover_in, 2)
    precision: "each per-activity award ROUND_HALF_UP to 2 dp BEFORE capping; the cycle total ROUND_HALF_UP to 2 dp after summing — rounding the sum of unrounded awards is WRONG"
    constants:
      MULTIPLIER: "{LIVE_INSTRUCTION: 1.0, SELF_STUDY: 0.5, PRESENTING: 2.0, PUBLICATION: 5.0, VOLUNTEER: 0.25}"
      CATEGORY_CAP: "{SELF_STUDY: 20.0, VOLUNTEER: 5.0} credits per cycle; LIVE_INSTRUCTION, PRESENTING and PUBLICATION are uncapped"
      CARRYOVER_LOOKBACK_DAYS: "90 — only under CARRYOVER_ALLOWED"
      ceu_carryover_max_credits: "program.ceu_carryover_max_credits (default 10) — ceiling on carryover_credits_in"
    input_set: "CEUActivity rows under the cycle with counted == true; REJECTED, SUBMITTED, AUDIT_SELECTED and REVOKED activities never count"
    edge_cases:
      - "A capped category fills in created_at order: the activity created first takes the cap headroom, later ones are truncated to the remainder and can receive 0.00"
      - "An activity dated exactly on cycle.starts_on or exactly on cycle.ends_on is inside the window under both variants"
      - "An activity dated 90 days before starts_on counts under CARRYOVER_ALLOWED and is rejected with ERR_ACTIVITY_OUTSIDE_CYCLE under STRICT_CYCLE"
      - "accrual_basis_snapshot is pinned when the cycle opens; flipping the program flag afterwards never re-bases an open cycle"

  # ---------------------------------------------------------------------------
  - name: carryover_computation
    algorithm_type: threshold
    entity: RecertificationCycle
    trigger: "POST /recertification-cycles/{id}/close"
    description: "Surplus credits carried into the successor cycle, capped, and only when the closing cycle's own basis allows it."
    formula: |
      surplus = credits_applied - required_credits
      if cycle.accrual_basis_snapshot == "STRICT_CYCLE" or surplus <= 0:
          carryover_credits_out = 0.00
      else:
          carryover_credits_out = round_half_up(min(surplus, program.ceu_carryover_max_credits), 2)
    precision: "2 dp ROUND_HALF_UP"
    constants:
      ceu_carryover_max_credits: "program.ceu_carryover_max_credits (default 10)"
    input_set: "the closing cycle's credits_applied and required_credits"
    edge_cases:
      - "Exactly meeting required_credits yields 0.00 carryover"
      - "A 25-credit surplus is truncated to the 10-credit ceiling"

  # ---------------------------------------------------------------------------
  - name: reinstatement_fee_assessment
    algorithm_type: tiered_pricing
    entity: RecertificationCycle
    trigger: "POST /recertification-runs, at the moment a cycle moves OPEN -> LAPSED"
    description: |
      Late surcharge first, then a tier lookup. The admin-fee tier is keyed on
      the SUBTOTAL (base + capped surcharge), NOT on the final total, so the
      order of the two steps changes the answer.
    formula: |
      days_late  = (current_date - cycle.grace_ends_on).days        # >= 1 by construction
      surcharge  = min(days_late * LATE_DAY_RATE_CENTS, MAX_SURCHARGE_CENTS)
      subtotal   = BASE_FEE_CENTS + surcharge
      if   subtotal <= 30000: rate = 0.02
      elif subtotal <= 45000: rate = 0.05
      else:                   rate = 0.08
      admin_fee  = round_half_up(rate * subtotal, 0)
      reinstatement_fee_cents = subtotal + admin_fee
    precision: "admin_fee is integer cents, ROUND_HALF_UP; the tier rate is applied to the whole subtotal (average rate, not marginal)"
    constants:
      BASE_FEE_CENTS: 25000
      LATE_DAY_RATE_CENTS: 250
      MAX_SURCHARGE_CENTS: 30000
      TIERS: "subtotal <= 30000 -> 0.02 ; 30000 < subtotal <= 45000 -> 0.05 ; subtotal > 45000 -> 0.08"
    input_set: "current_date and cycle.grace_ends_on"
    edge_cases:
      - "days_late 20 -> surcharge 5000 -> subtotal 30000 -> rate 0.02 -> admin 600 -> total 30600; keying the tier off the total would have chosen 0.05 and produced 31500"
      - "days_late 21 -> surcharge 5250 -> subtotal 30250 -> rate 0.05 -> admin 1513 (0.05*30250 = 1512.5, ROUND_HALF_UP) -> total 31763"
      - "days_late 200 -> surcharge capped at 30000 -> subtotal 55000 -> rate 0.08 -> admin 4400 -> total 59400; the cap makes the fee flat beyond day 120"

  # ---------------------------------------------------------------------------
  - name: blueprint_posture
    algorithm_type: constraint_propagation
    entity: CertificationProgram
    trigger: "program activation and every Item transition into or out of OPERATIONAL"
    description: "Per-domain operational coverage rolled up into a single publish gate."
    formula: |
      operational_item_count = count(items of program with status == "OPERATIONAL")
      deficient_domain_codes = sorted([d.domain_code for d in program.domain_specs
                                        if count(items of program with domain_code == d.domain_code
                                                                  and status == "OPERATIONAL")
                                           < d.min_operational_items])
      blueprint_posture      = "DEFICIENT" if deficient_domain_codes else "COMPLETE"
    precision: "integer counts; deficient_domain_codes sorted ascending for determinism"
    constants:
      min_operational_items: "per-domain, from program.domain_specs"
    input_set: "Items of the program with status == OPERATIONAL (PRETEST, FLAGGED and RETIRED items never count)"
    edge_cases:
      - "A domain with min_operational_items 0 is never deficient"
      - "One item flipping OPERATIONAL -> FLAGGED can flip the whole program COMPLETE -> DEFICIENT and thereby block form publication"

  # ---------------------------------------------------------------------------
  - name: form_retirement_tolerance
    algorithm_type: threshold
    entity: ExamForm
    trigger: "POST /items/{id}/retire (cascade hop 2)"
    description: "Integer-arithmetic percentage comparison — deliberately cross-multiplied to avoid float ratios."
    formula: |
      retired_item_count = count(id in form.item_ids where Item(id).status == "RETIRED")
      needs_rebuild      = retired_item_count * 100 > program.form_retirement_tolerance_pct * len(form.item_ids)
    precision: "pure integer arithmetic; no division, no rounding"
    constants:
      form_retirement_tolerance_pct: "program.form_retirement_tolerance_pct (default 10) — strict >"
    input_set: "every id in form.item_ids, including pretest positions"
    edge_cases:
      - "20 items at 10%: 2 retired gives 200 > 200 == false, the form stays PUBLISHED; the 3rd retirement gives 300 > 200 == true and rebuilds"
      - "Only PUBLISHED forms transition; ASSEMBLED and CUT_SCORE_SET forms merely update retired_item_count"

  # ---------------------------------------------------------------------------
  - name: session_seat_occupancy
    algorithm_type: aggregation
    entity: ExamSession
    trigger: "every schedule, cancel-schedule, no-show sweep and seat-releasing cascade"
    description: "The seat ledger and the derived availability state."
    formula: |
      seats_reserved = count(registrations with session_id == session.id
                             and seat_status IN {"SCHEDULED", "CHECKED_IN", "COMPLETED"})
      status = "CLOSED" if current_utc >= session.starts_at
               else "FULL" if seats_reserved >= session.seat_capacity
               else "OPEN"
    precision: "integer count"
    constants:
      OCCUPYING_SEAT_STATUSES: "{SCHEDULED, CHECKED_IN, COMPLETED} — UNSCHEDULED, NO_SHOW and CANCELLED release the seat"
    input_set: "ExamRegistration rows pointing at the session"
    edge_cases:
      - "CLOSED wins over FULL: a session that is both past its start and full reports CLOSED"
      - "A NO_SHOW releases the seat but still consumes an attempt"

  # ---------------------------------------------------------------------------
  - name: proctor_pool_concurrent_load
    algorithm_type: interval_merge
    entity: ExamSession
    trigger: "POST /exam-sessions with modality == ONLINE_PROCTORED"
    description: "Aggregate capacity check across every ONLINE_PROCTORED session sharing a proctor pool whose window overlaps the new one. Each existing session is individually legal; only the collective load breaches."
    formula: |
      overlapping = [s for s in sessions
                       if s.modality == "ONLINE_PROCTORED"
                      and s.proctor_pool_code == new.proctor_pool_code
                      and new.starts_at < s.ends_at and s.starts_at < new.ends_at]   # half-open
      committed   = sum(s.seat_capacity for s in overlapping)
      if committed + new.seat_capacity > POOL_MAX_CONCURRENT_SEATS: -> ERR_PROCTOR_POOL_CAPACITY_EXCEEDED
    precision: "integer sum"
    constants:
      POOL_MAX_CONCURRENT_SEATS: "50 — strict >, so a total of exactly 50 is accepted"
    input_set: "ONLINE_PROCTORED sessions on the same proctor_pool_code with an overlapping window; TEST_CENTER sessions are excluded even on the same code"
    edge_cases:
      - "Seat CAPACITY is summed, not seats_reserved — an empty session still books its proctors"
      - "Adjacent windows (new.starts_at == existing.ends_at) do not overlap and never contribute"
      - "A total of exactly 50 succeeds; 51 fails"

  # ---------------------------------------------------------------------------
  - name: eligibility_dimension_evaluation
    algorithm_type: threshold
    entity: EligibilityApplication
    trigger: "POST /applications/{id}/verify"
    description: "Per-dimension prerequisite test. The reviewer may only override to FAIL, never to PASS: a submitted outcome of PASS still has to clear the arithmetic."
    formula: |
      current_year = year(current_utc)
      education_ok = application.education_credential in program.accepted_education_credentials
                     and application.education_completion_year >= current_year - program.education_recency_years
      experience_ok = application.experience_months >= program.min_experience_months
      # dimension == EDUCATION
      education_status  = "VERIFIED" if (outcome == "PASS" and education_ok)  else "FAILED"
      # dimension == EXPERIENCE
      experience_status = "VERIFIED" if (outcome == "PASS" and experience_ok) else "FAILED"
    precision: "integer year and month comparisons"
    constants:
      education_recency_years: "program.education_recency_years (default 10) — >= comparison against current_year - N"
      min_experience_months: "program.min_experience_months (default 24) — >= comparison"
    input_set: "the application's own snapshot fields and the program's prerequisite config"
    edge_cases:
      - "experience_months exactly equal to min_experience_months VERIFIES"
      - "education_completion_year exactly current_year - education_recency_years VERIFIES; one year earlier FAILS"
      - "A reviewer submitting PASS for a candidate who does not clear the arithmetic still produces FAILED and denies the application"

  # ---------------------------------------------------------------------------
  - name: audit_sampling_selection
    algorithm_type: chronological
    entity: EligibilityApplication
    trigger: "the POST /applications/{id}/verify call that completes both dimensions with VERIFIED"
    description: "Deterministic every-Nth sampling driven by a program-level monotonic counter, so the sampling depends on the ORDER in which applications complete verification, not on the order in which they were created."
    formula: |
      program.verified_application_counter += 1
      application.audit_sequence_number     = program.verified_application_counter
      selected = (application.audit_sequence_number % program.audit_every_nth == 0)
      status   = "AUDIT_SELECTED" if selected else "APPROVED"
    precision: "integer modulo"
    constants:
      audit_every_nth: "program.audit_every_nth (default 3)"
    input_set: "the program counter at the instant both dimensions became VERIFIED"
    edge_cases:
      - "An application denied on a dimension never increments the counter, so it does not shift the sampling of later applications"
      - "With audit_every_nth == 1 every application is sampled"
      - "The counter is per program: applications under different programs sample independently"

  # ---------------------------------------------------------------------------
  - name: attempt_number_assignment
    algorithm_type: chronological
    entity: ExamRegistration
    trigger: "POST /exam-registrations"
    description: "Attempt sequencing and the retake wait, both derived from consumed attempts on the same application."
    formula: |
      consumed = count(registrations of application with seat_status IN {"COMPLETED", "NO_SHOW"})
      if consumed >= program.max_attempts_per_cycle: -> ERR_MAX_ATTEMPTS_REACHED
      attempt_number = consumed + 1
      last_sitting = max(session_ends_at of registrations of application
                         with seat_status IN {"COMPLETED", "NO_SHOW"})      # null when consumed == 0
      if last_sitting is not null
         and current_utc < last_sitting + program.retake_wait_days: -> ERR_RETAKE_WAIT_ACTIVE
    precision: "integer count; day arithmetic in whole days on UTC instants"
    constants:
      max_attempts_per_cycle: "program.max_attempts_per_cycle (default 3) — >= comparison, so the 4th registration is refused"
      retake_wait_days: "program.retake_wait_days (default 45) — strict <, so exactly 45 days after the sitting is allowed"
    input_set: "sibling registrations of the same EligibilityApplication"
    edge_cases:
      - "A CANCELLED or UNSCHEDULED registration consumes nothing and does not start a retake wait"
      - "A VOIDED score does not un-consume the attempt: seat_status stays COMPLETED"
      - "current_utc exactly last_sitting + 45 days is allowed"

  # ---------------------------------------------------------------------------
  - name: certificate_number_minting
    algorithm_type: chronological
    entity: Certificant
    trigger: "the report-score cascade, hop 1"
    description: "Human-readable certificate number from a per-program monotonic issue counter. Never derived from a UUID."
    formula: |
      program.certificants_issued_count += 1
      certificate_number = f"{program.credential_code}-{year(current_utc)}-{program.certificants_issued_count:05d}"
      issued_on    = date(current_utc)
      valid_through = issued_on + program.cycle_length_months
    precision: "sequence zero-padded to 5 digits"
    constants:
      cycle_length_months: "program.cycle_length_months (default 36)"
    input_set: "the program's issue counter"
    edge_cases:
      - "The counter never resets across calendar years, so numbering is monotonic within a program"
      - "A revoked certificant does not release its number"

  # ---------------------------------------------------------------------------
  - name: cycle_credit_reconciliation
    algorithm_type: projection
    entity: RecertificationCycle
    trigger: "every CEUActivity status change and every cycle-affecting cascade"
    description: "Invariant that keeps the cycle's denormalised ledger equal to the capped sum of its counted children — the field is always re-derived from scratch, never incremented."
    formula: |
      cycle.credits_applied == round_half_up(
          sum(a.credits_counted for a in activities_of(cycle) if a.counted is true)
          + carryover_in_of(cycle), 2)
      cycle.status == "SATISFIED" iff (path == "CEU" and credits_applied >= required_credits)
                                   or (path == "RE_EXAM" and reexam_registration_id is not null)
    precision: "2 dp ROUND_HALF_UP"
    constants:
      required_ceu_credits: "pinned into cycle.required_credits when the cycle opens"
    input_set: "CEUActivity rows under the cycle"
    edge_cases:
      - "Revoking an audited activity lowers credits_applied and can bubble the cycle SATISFIED -> OPEN"
      - "Electing re-exam zeroes required_credits and decounts every activity, so credits_applied becomes 0.00"

# =============================================================================
# §1.4 Validation Rules — evaluated in ascending `priority`, first violation wins
# =============================================================================
validations:

  # --- layer 1: authentication -----------------------------------------------
  - priority: 1
    category: auth
    rule: "X-User-ID header must be present and non-empty on every endpoint except GET /registry/verify"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except GET /registry/verify"

  # --- layer 2: authorization ------------------------------------------------
  - priority: 2
    category: authorization
    rule: "X-Role header must be present and must appear in the endpoint's declared roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints except GET /registry/verify"

  # --- layer 3: existence ----------------------------------------------------
  - priority: 3
    category: existence
    rule: "every path id must resolve to a stored entity"
    error_id: "ERR_PROGRAM_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_FORM_NOT_FOUND | ERR_CANDIDATE_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_CERTIFICANT_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_ACTIVITY_NOT_FOUND | ERR_CASE_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
  - priority: 4
    category: existence
    rule: "every foreign key in a request body must resolve to a stored entity"
    error_id: "the matching ERR_*_NOT_FOUND for the referenced collection"
    http_status: 404
    applies_to: "POST /items, POST /forms, POST /applications, POST /exam-registrations, POST /disciplinary-cases"

  # --- layer 4: ownership ----------------------------------------------------
  - priority: 5
    category: ownership
    rule: "a Candidate-role caller may only act on registrations and applications whose candidate_id equals the acting X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /exam-registrations, /schedule, /cancel-schedule"
  - priority: 6
    category: ownership
    rule: "a Certificant-role caller may only act on cycles, CEU activities and disciplinary cases belonging to a Certificant whose candidate_id equals the acting X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /recertification-cycles/{id}/ceu-activities, /close, /elect-reexam, /reinstate, POST /disciplinary-cases/{id}/respond"

  # --- layer 5: schema -------------------------------------------------------
  - priority: 7
    category: schema
    rule: "all required body fields present; enums within their declared sets; integers non-negative; array sizes within bounds; timestamps ISO-8601"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 8
    category: schema
    rule: "domain_specs[].weight_pct must sum to exactly 100 and domain_code must be unique within the array"
    error_id: ERR_BLUEPRINT_WEIGHTS_INVALID
    http_status: 400
    applies_to: "POST /programs, POST /programs/{id}/activate"
  - priority: 9
    category: schema
    rule: "session starts_at must be strictly before ends_at, and seat_capacity must be >= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /exam-sessions"
  - priority: 10
    category: schema
    rule: "credential_code must be unique among programs with status IN {DRAFT, ACTIVE}"
    error_id: ERR_CREDENTIAL_CODE_TAKEN
    http_status: 409
    applies_to: "POST /programs"

  # --- layer 6: optimistic concurrency --------------------------------------
  - priority: 11
    category: occ
    rule: "expected_<parent>_version must equal the parent's current version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /exam-registrations/{id}/schedule, POST /forms/{id}/adopt-cut-score, POST /recertification-cycles/{id}/close"

  # --- layer 7: state --------------------------------------------------------
  - priority: 12
    category: state
    rule: "the entity must be in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint"
  - priority: 13
    category: state
    rule: "the owning CertificationProgram must be ACTIVE"
    error_id: ERR_PROGRAM_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /applications, POST /forms/{id}/publish, POST /exam-registrations"
  - priority: 14
    category: state
    rule: "the cited ExamForm must be PUBLISHED"
    error_id: ERR_FORM_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /exam-registrations, /schedule, /check-in"
  - priority: 15
    category: state
    rule: "the cited EligibilityApplication must be APPROVED"
    error_id: ERR_APPLICATION_NOT_APPROVED
    http_status: 409
    applies_to: "POST /exam-registrations"
  - priority: 16
    category: state
    rule: "the owning Certificant must be ACTIVE (not SUSPENDED, EXPIRED or REVOKED)"
    error_id: ERR_CERTIFICANT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /recertification-cycles/{id}/ceu-activities, /close, POST /ceu-activities/{id}/review"
  - priority: 17
    category: state
    rule: "a REVOKED Certificant admits no further disciplinary or recertification action"
    error_id: ERR_CERTIFICANT_ALREADY_REVOKED
    http_status: 409
    applies_to: "POST /disciplinary-cases, /request-response, /decide, POST /recertification-cycles/{id}/reinstate"
  - priority: 18
    category: state
    rule: "the requested eligibility dimension must still be PENDING"
    error_id: ERR_DIMENSION_ALREADY_VERIFIED
    http_status: 409
    applies_to: "POST /applications/{id}/verify"

  # --- layer 8: business_safety (segregation of duties, bars, holds) ---------
  - priority: 19
    category: business_safety
    rule: |
      Segregation of duties, evaluated before any temporal or capacity check:
        - an item's reviewer may not be its author_user_id
        - the second approver may not already be in approver_user_ids
        - an application's auditor may not appear in verifier_user_ids[].user_id
        - a CEU audit-verifier may not be the activity's reviewer_user_id
        - a cut-score adopter may not appear in form.panelist_user_ids
        - the officer deciding REVOKED may not be the case's opened_by_user_id
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /items/{id}/review, /submit-for-review, POST /applications/{id}/audit-decision, POST /ceu-activities/{id}/audit-verify, POST /forms/{id}/adopt-cut-score, POST /disciplinary-cases/{id}/decide"
  - priority: 20
    category: business_safety
    rule: "a BARRED Candidate may neither register, schedule nor check in"
    error_id: ERR_CANDIDATE_BARRED
    http_status: 409
    applies_to: "POST /exam-registrations, /schedule, /check-in"
  - priority: 21
    category: business_safety
    rule: "a score may not be reported while an OPEN SecurityIncident exists on the registration, nor may responses be submitted while score_status == WITHHELD"
    error_id: ERR_SCORE_UNDER_SECURITY_HOLD
    http_status: 409
    applies_to: "POST /exam-registrations/{id}/report-score, /submit-responses"

  # --- layer 9: business_referential ----------------------------------------
  - priority: 22
    category: business_referential
    rule: "every item cited in a form must belong to the same program and its domain_code must appear in program.domain_specs"
    error_id: ERR_ITEM_DOMAIN_MISMATCH
    http_status: 422
    applies_to: "POST /forms"
  - priority: 23
    category: business_referential
    rule: "every scored item cited in a form must be APPROVED, PRETEST or OPERATIONAL — never DRAFT, IN_REVIEW, REVISION_REQUESTED, REJECTED or RETIRED"
    error_id: ERR_ITEM_NOT_ELIGIBLE_FOR_FORM
    http_status: 422
    applies_to: "POST /forms"
  - priority: 24
    category: business_referential
    rule: "pretest_item_ids must be a subset of item_ids"
    error_id: ERR_ITEM_NOT_IN_FORM
    http_status: 422
    applies_to: "POST /forms"
  - priority: 25
    category: business_referential
    rule: "a submitted panel rating's panelist_user_id must appear in form.panelist_user_ids"
    error_id: ERR_PANELIST_NOT_ON_PANEL
    http_status: 422
    applies_to: "POST /forms/{id}/panel-ratings"
  - priority: 26
    category: business_referential
    rule: "the cited form and the cited application must belong to the same CertificationProgram"
    error_id: ERR_ELIGIBILITY_PROGRAM_MISMATCH
    http_status: 422
    applies_to: "POST /exam-registrations"

  # --- layer 10: business_temporal ------------------------------------------
  - priority: 27
    category: business_temporal
    rule: "TEST_CENTER sessions sharing (center_code, room_code) may not overlap on the HALF-OPEN interval [starts_at, ends_at): new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at. Adjacency (new.starts_at == existing.ends_at) is ALLOWED."
    error_id: ERR_ROOM_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /exam-sessions with modality == TEST_CENTER"
  - priority: 28
    category: business_temporal
    rule: "a candidate may not hold two seats whose CLOSED windows padded by CANDIDATE_BUFFER_MINUTES = 120 on BOTH sides intersect: new.starts_at - 120min <= existing.ends_at + 120min AND existing.starts_at - 120min <= new.ends_at + 120min. Adjacency is REJECTED, and a 119-minute gap is rejected while a 121-minute gap is allowed."
    error_id: ERR_CANDIDATE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /exam-registrations/{id}/schedule"
  - priority: 29
    category: business_temporal
    rule: "a session whose starts_at has passed (current_utc >= starts_at) admits no new or cancelled seat claims"
    error_id: ERR_SESSION_CLOSED
    http_status: 409
    applies_to: "POST /exam-registrations/{id}/schedule, /cancel-schedule"
  - priority: 30
    category: business_temporal
    rule: "check-in is permitted only within [session.starts_at - 30 minutes, session.ends_at] inclusive"
    error_id: ERR_CHECKIN_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /exam-registrations/{id}/check-in"
  - priority: 31
    category: business_temporal
    rule: "the cited application's eligibility_expires_on must not be in the past at registration time"
    error_id: ERR_ELIGIBILITY_EXPIRED
    http_status: 409
    applies_to: "POST /exam-registrations"
  - priority: 32
    category: business_temporal
    rule: "the retake wait must have elapsed since the latest consumed attempt (strict <, so exactly retake_wait_days later is allowed)"
    error_id: ERR_RETAKE_WAIT_ACTIVE
    http_status: 409
    applies_to: "POST /exam-registrations"
  - priority: 33
    category: business_temporal
    rule: "a CEU activity's activity_date must fall inside the cycle's accrual window (variant-dependent: the 90-day look-back exists only under CARRYOVER_ALLOWED)"
    error_id: ERR_ACTIVITY_OUTSIDE_CYCLE
    http_status: 422
    applies_to: "POST /recertification-cycles/{id}/ceu-activities"

  # --- layer 11: business_constraint ----------------------------------------
  - priority: 34
    category: business_constraint
    rule: "a form may not be published while program.blueprint_posture == DEFICIENT"
    error_id: ERR_BLUEPRINT_DEFICIENT
    http_status: 422
    applies_to: "POST /forms/{id}/publish"
  - priority: 35
    category: business_constraint
    rule: "len(item_ids) must equal program.form_length exactly"
    error_id: ERR_FORM_LENGTH_MISMATCH
    http_status: 422
    applies_to: "POST /forms"
  - priority: 36
    category: business_constraint
    rule: "at least program.min_panelists ratings must exist and at least one rating must survive trimming"
    error_id: ERR_PANEL_QUORUM_NOT_MET
    http_status: 422
    applies_to: "POST /forms/{id}/adopt-cut-score"
  - priority: 37
    category: business_constraint
    rule: "a panelist may submit only one rating per form"
    error_id: ERR_DUPLICATE_PANELIST_RATING
    http_status: 409
    applies_to: "POST /forms/{id}/panel-ratings"
  - priority: 38
    category: business_constraint
    rule: "consumed attempts on the application must be below program.max_attempts_per_cycle"
    error_id: ERR_MAX_ATTEMPTS_REACHED
    http_status: 422
    applies_to: "POST /exam-registrations"
  - priority: 39
    category: business_constraint
    rule: "a cycle may be closed only once credits_applied >= required_credits (CEU path) or a passing re-examination is recorded (RE_EXAM path)"
    error_id: ERR_CREDITS_NOT_SATISFIED
    http_status: 422
    applies_to: "POST /recertification-cycles/{id}/close"
  - priority: 40
    category: business_constraint
    rule: "a REVOKED or SANCTIONED decision requires at least one completed response round"
    error_id: ERR_DUE_PROCESS_INCOMPLETE
    http_status: 422
    applies_to: "POST /disciplinary-cases/{id}/decide"
  - priority: 41
    category: business_constraint
    rule: "raw_score must satisfy 0 <= raw_score <= form.scored_item_count"
    error_id: ERR_RAW_SCORE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /exam-registrations/{id}/submit-responses"
  - priority: 42
    category: business_constraint
    rule: "an item may only receive response batches while its status IN {APPROVED, PRETEST, OPERATIONAL, FLAGGED}"
    error_id: ERR_ITEM_NOT_ELIGIBLE_FOR_STATS
    http_status: 422
    applies_to: "POST /items/{id}/response-batches"
  - priority: 43
    category: business_constraint
    rule: "every scored (non-pretest) position of a form must resolve to an OPERATIONAL item at publication time"
    error_id: ERR_ITEM_NOT_OPERATIONAL
    http_status: 422
    applies_to: "POST /forms/{id}/publish"

  # --- layer 12: business_fiscal --------------------------------------------
  - priority: 44
    category: business_fiscal
    rule: "fee_paid_cents must be >= program.exam_fee_cents"
    error_id: ERR_EXAM_FEE_INSUFFICIENT
    http_status: 402
    applies_to: "POST /exam-registrations"
  - priority: 45
    category: business_fiscal
    rule: "payment_cents must be >= cycle.reinstatement_fee_cents"
    error_id: ERR_REINSTATEMENT_FEE_UNPAID
    http_status: 402
    applies_to: "POST /recertification-cycles/{id}/reinstate"

  # --- layer 13: capacity ---------------------------------------------------
  - priority: 46
    category: capacity
    rule: "session.seats_reserved must be strictly below session.seat_capacity"
    error_id: ERR_SESSION_FULL
    http_status: 409
    applies_to: "POST /exam-registrations/{id}/schedule"
  - priority: 47
    category: capacity
    rule: "the aggregate seat_capacity of overlapping ONLINE_PROCTORED sessions on one proctor pool, including the new one, must not exceed POOL_MAX_CONCURRENT_SEATS = 50"
    error_id: ERR_PROCTOR_POOL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /exam-sessions with modality == ONLINE_PROCTORED"

priority_conflict_notes:
  - "temporal vs capacity: scheduling into a FULL session whose starts_at has already passed returns ERR_SESSION_CLOSED (29) not ERR_SESSION_FULL (46)"
  - "state vs fiscal: registering with an insufficient fee against an unpublished form returns ERR_FORM_NOT_PUBLISHED (14) not ERR_EXAM_FEE_INSUFFICIENT (44)"
  - "safety vs temporal: a BARRED candidate scheduling into a candidate-window conflict returns ERR_CANDIDATE_BARRED (20) not ERR_CANDIDATE_WINDOW_CONFLICT (28)"
  - "referential vs constraint: a form whose item list is both the wrong length and contains a foreign-program item returns ERR_ITEM_DOMAIN_MISMATCH (22) not ERR_FORM_LENGTH_MISMATCH (35)"
  - "occ vs state: a stale expected_form_version on an already-PUBLISHED form returns ERR_STALE_VERSION (11) not ERR_INVALID_STATE (12)"

# =============================================================================
# §1.5 Endpoint Table
# =============================================================================
# `input:` lists BODY fields for POST and QUERY parameters for GET.
# A trailing `?` marks the field optional. Every endpoint additionally requires
# the `X-User-ID` and `X-Role` headers except GET /registry/verify.
# =============================================================================
endpoints:

  # ------------------------------- programs ---------------------------------
  - method: POST
    path: /programs
    roles: [ProgramAdmin]
    input: [name, credential_code, jta_version, domain_specs, form_length, accepted_education_credentials,
            "psychometric_stat_basis?", "min_discrimination?", "min_p_value?", "max_p_value?", "min_responses_for_stats?",
            "form_retirement_tolerance_pct?", "min_panelists?", "panel_trim_count?", "cut_score_sem_multiplier?",
            "education_recency_years?", "min_experience_months?", "audit_every_nth?", "eligibility_valid_days?",
            "exam_fee_cents?", "max_attempts_per_cycle?", "retake_wait_days?", "cycle_length_months?",
            "required_ceu_credits?", "ceu_credit_accrual_basis?", "ceu_carryover_max_credits?", "recert_grace_days?"]
    output: CertificationProgram
    side_effects:
      - "status = DRAFT; blueprint_posture = DEFICIENT unless every domain_spec has min_operational_items 0"
      - "verified_application_counter = 0; certificants_issued_count = 0; operational_item_count = 0"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_BLUEPRINT_WEIGHTS_INVALID, ERR_CREDENTIAL_CODE_TAKEN]

  - method: GET
    path: /programs/{id}
    roles: [ProgramAdmin, ItemSpecialist, Psychometrician, Panelist, EligibilityReviewer, ExamOperations, EthicsOfficer]
    input: []
    output: CertificationProgram
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND]

  - method: GET
    path: /programs
    roles: [ProgramAdmin, ItemSpecialist, Psychometrician, EligibilityReviewer, ExamOperations, EthicsOfficer]
    input: ["credential_code?", "status?", "blueprint_posture?", "limit?", "offset?"]
    output: CertificationProgram[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /programs/{id}/activate
    roles: [ProgramAdmin]
    input: ["activation_note?"]
    output: CertificationProgram
    side_effects:
      - "DRAFT -> ACTIVE; any other ACTIVE program with the same credential_code moves to SUPERSEDED"
      - "blueprint_posture, operational_item_count and deficient_domain_codes recomputed"
      - "increments CertificationProgram.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_BLUEPRINT_WEIGHTS_INVALID, ERR_INVALID_STATE]

  - method: GET
    path: /programs/{id}/items
    roles: [ProgramAdmin, ItemSpecialist, Psychometrician]
    input: ["domain_code?", "status?", "flag_reason?", "limit?", "offset?"]
    output: Item[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /programs/{id}/forms
    roles: [ProgramAdmin, Psychometrician, ExamOperations]
    input: ["status?", "limit?", "offset?"]
    output: ExamForm[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_INVALID_REQUEST]

  # -------------------------------- items -----------------------------------
  - method: POST
    path: /items
    roles: [ItemSpecialist]
    input: [program_id, domain_code, cognitive_level, stem]
    output: Item
    side_effects:
      - "status = DRAFT; review_round = 0; approver_user_ids = []"
      - "author_user_id = acting X-User-ID (a body value is ignored)"
      - "all twelve response accumulators initialised to 0; stat_basis_applied = INSUFFICIENT_DATA"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_ITEM_DOMAIN_MISMATCH]

  - method: GET
    path: /items/{id}
    roles: [ItemSpecialist, Psychometrician, ProgramAdmin]
    input: []
    output: Item
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ITEM_NOT_FOUND]

  - method: GET
    path: /items
    roles: [ItemSpecialist, Psychometrician, ProgramAdmin]
    input: ["program_id?", "domain_code?", "status?", "flag_reason?", "limit?", "offset?"]
    output: Item[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /items/{id}/submit-for-review
    roles: [ItemSpecialist]
    input: ["revision_note?"]
    output: Item
    side_effects:
      - "DRAFT|REVISION_REQUESTED -> IN_REVIEW"
      - "review_round += 1 when arriving from REVISION_REQUESTED"
      - "approver_user_ids reset to []"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ITEM_NOT_FOUND, ERR_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES]

  - method: POST
    path: /items/{id}/review
    roles: [ItemSpecialist]
    input: [decision, "review_note?"]
    output: Item
    side_effects:
      - "decision APPROVE: acting user appended to approver_user_ids; the second distinct approval moves IN_REVIEW -> APPROVED"
      - "decision REVISE: IN_REVIEW -> REVISION_REQUESTED, approver_user_ids reset to []"
      - "decision REJECT: IN_REVIEW -> REJECTED (terminal)"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ITEM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES]

  - method: POST
    path: /items/{id}/response-batches
    roles: [Psychometrician]
    input: [is_pretest, response_count, correct_count, upper_n, upper_correct, lower_n, lower_correct]
    output: Item
    side_effects:
      - "the pretest_* or operational_* accumulators are increased by the batch counts"
      - "calculations.item_statistics recomputes p_value, discrimination_index and stat_basis_applied under the program's psychometric_stat_basis flag"
      - "calculations.item_flag_evaluation recomputes flag_reason"
      - "APPROVED -> PRETEST on the first pretest batch; PRETEST -> OPERATIONAL or PRETEST -> RETIRED(PRETEST_FAILED); OPERATIONAL <-> FLAGGED"
      - "program.operational_item_count, deficient_domain_codes and blueprint_posture recomputed on any OPERATIONAL boundary crossing"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ITEM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_ITEM_NOT_ELIGIBLE_FOR_STATS]

  - method: POST
    path: /items/{id}/retire
    roles: [Psychometrician]
    input: [retirement_reason]
    output: Item
    side_effects:
      - "OPERATIONAL|FLAGGED -> RETIRED; retired_at stamped"
      - "cascade hop 1: every ExamForm citing the item recomputes retired_item_count"
      - "cascade hop 2: a PUBLISHED form over tolerance moves to NEEDS_REBUILD"
      - "cascade hop 3: SCHEDULED registrations on that form move to UNSCHEDULED with form_reassignment_required = true"
      - "cascade hop 4: each affected ExamSession recomputes seats_reserved and status"
      - "program.operational_item_count decremented; blueprint_posture recomputed"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ITEM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE]

  # -------------------------------- forms -----------------------------------
  - method: POST
    path: /forms
    roles: [Psychometrician]
    input: [program_id, form_code, item_ids, panelist_user_ids, panel_method, "pretest_item_ids?"]
    output: ExamForm
    side_effects:
      - "status = ASSEMBLED; panel_status = OPEN; panel_ratings = []"
      - "scored_item_count = len(item_ids) - len(pretest_item_ids); retired_item_count computed from the cited items"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_PROGRAM_NOT_FOUND, ERR_ITEM_NOT_FOUND, ERR_INVALID_REQUEST,
             ERR_ITEM_DOMAIN_MISMATCH, ERR_ITEM_NOT_ELIGIBLE_FOR_FORM, ERR_ITEM_NOT_IN_FORM, ERR_FORM_LENGTH_MISMATCH]

  - method: GET
    path: /forms/{id}
    roles: [Psychometrician, ProgramAdmin, ExamOperations, Panelist]
    input: []
    output: ExamForm
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_FORM_NOT_FOUND]

  - method: GET
    path: /forms
    roles: [Psychometrician, ProgramAdmin, ExamOperations]
    input: ["program_id?", "status?", "panel_status?", "limit?", "offset?"]
    output: ExamForm[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /forms/{id}/panel-ratings
    roles: [Panelist, Psychometrician]
    input: [panelist_user_id, mean_expected_pass_rate]
    output: ExamForm
    side_effects:
      - "{panelist_user_id, mean_expected_pass_rate, submitted_at} appended to panel_ratings"
      - "panel_status becomes RATINGS_COMPLETE once len(panel_ratings) == len(panelist_user_ids)"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_FORM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE,
             ERR_PANELIST_NOT_ON_PANEL, ERR_DUPLICATE_PANELIST_RATING]

  - method: POST
    path: /forms/{id}/adopt-cut-score
    roles: [Psychometrician]
    input: [expected_form_version, "adoption_note?"]
    output: ExamForm
    side_effects:
      - "calculations.angoff_cut_score writes raw_cut_score and mean_expected_pass_rate"
      - "ASSEMBLED|CUT_SCORE_SET -> CUT_SCORE_SET; panel_status = ADOPTED"
      - "increments ExamForm.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_FORM_NOT_FOUND, ERR_INVALID_REQUEST, ERR_STALE_VERSION,
             ERR_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES, ERR_PANEL_QUORUM_NOT_MET]

  - method: POST
    path: /forms/{id}/publish
    roles: [ProgramAdmin]
    input: ["publication_note?"]
    output: ExamForm
    side_effects:
      - "CUT_SCORE_SET -> PUBLISHED; the form becomes selectable by POST /exam-registrations"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_FORM_NOT_FOUND, ERR_INVALID_STATE, ERR_PROGRAM_NOT_ACTIVE,
             ERR_BLUEPRINT_DEFICIENT, ERR_ITEM_NOT_OPERATIONAL]

  # ------------------------------ candidates --------------------------------
  - method: POST
    path: /candidates
    roles: [ExamOperations, EligibilityReviewer]
    input: [email, full_name]
    output: Candidate
    side_effects:
      - "status = ACTIVE; barred_until = null; bar_reason = null"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_CANDIDATE_EMAIL_TAKEN]

  - method: GET
    path: /candidates/{id}
    roles: [ExamOperations, EligibilityReviewer, ProgramAdmin, Candidate, EthicsOfficer]
    input: []
    output: Candidate
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CANDIDATE_NOT_FOUND]

  - method: GET
    path: /candidates
    roles: [ExamOperations, EligibilityReviewer, ProgramAdmin]
    input: ["email?", "status?", "bar_reason?", "limit?", "offset?"]
    output: Candidate[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  # ---------------------------- applications --------------------------------
  - method: POST
    path: /applications
    roles: [Candidate, EligibilityReviewer]
    input: [candidate_id, program_id, education_credential, education_completion_year, experience_months, attestation_signed]
    output: EligibilityApplication
    side_effects:
      - "status = SUBMITTED; education_status = experience_status = PENDING; verifier_user_ids = []"
      - "attempts_consumed = 0; eligibility_expires_on = null; audit_sequence_number = null"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CANDIDATE_NOT_FOUND, ERR_PROGRAM_NOT_FOUND,
             ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_ACTIVE]

  - method: GET
    path: /applications/{id}
    roles: [EligibilityReviewer, Candidate, ExamOperations, ProgramAdmin]
    input: []
    output: EligibilityApplication
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_APPLICATION_NOT_FOUND]

  - method: GET
    path: /applications
    roles: [EligibilityReviewer, Candidate, ExamOperations, ProgramAdmin]
    input: ["candidate_id?", "program_id?", "status?", "education_status?", "experience_status?", "limit?", "offset?"]
    output: EligibilityApplication[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /applications/{id}/verify
    roles: [EligibilityReviewer]
    input: [dimension, outcome, "review_note?"]
    output: EligibilityApplication
    side_effects:
      - "calculations.eligibility_dimension_evaluation sets education_status or experience_status"
      - "{dimension, acting X-User-ID} appended to verifier_user_ids"
      - "SUBMITTED -> UNDER_REVIEW on the first dimension"
      - "on the completing call: calculations.audit_sampling_selection increments program.verified_application_counter, writes audit_sequence_number, and routes to AUDIT_SELECTED or APPROVED"
      - "APPROVED sets eligibility_expires_on = current_utc + program.eligibility_valid_days; AUDIT_SELECTED leaves it null"
      - "a FAILED dimension moves the application straight to DENIED without touching the counter"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_APPLICATION_NOT_FOUND, ERR_INVALID_REQUEST,
             ERR_INVALID_STATE, ERR_DIMENSION_ALREADY_VERIFIED]

  - method: POST
    path: /applications/{id}/audit-decision
    roles: [EligibilityReviewer]
    input: [outcome, "audit_note?"]
    output: EligibilityApplication
    side_effects:
      - "AUDIT_SELECTED -> APPROVED (eligibility_expires_on stamped) or -> DENIED with denial_reason AUDIT_FAILED"
      - "auditor_user_id = acting X-User-ID"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_APPLICATION_NOT_FOUND, ERR_INVALID_REQUEST,
             ERR_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES]

  # ----------------------------- exam sessions ------------------------------
  - method: POST
    path: /exam-sessions
    roles: [ExamOperations]
    input: [modality, starts_at, ends_at, seat_capacity, "center_code?", "room_code?", "proctor_pool_code?"]
    output: ExamSession
    side_effects:
      - "seats_reserved = 0; status computed to OPEN (or CLOSED when starts_at is already in the past)"
      - "TEST_CENTER: the half-open room-window overlap check runs against (center_code, room_code)"
      - "ONLINE_PROCTORED: calculations.proctor_pool_concurrent_load runs against the pool"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST, ERR_ROOM_WINDOW_CONFLICT,
             ERR_PROCTOR_POOL_CAPACITY_EXCEEDED]

  - method: GET
    path: /exam-sessions/{id}
    roles: [ExamOperations, Candidate, ProgramAdmin]
    input: []
    output: ExamSession
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_SESSION_NOT_FOUND]

  - method: GET
    path: /exam-sessions
    roles: [ExamOperations, Candidate, ProgramAdmin]
    input: ["modality?", "center_code?", "room_code?", "proctor_pool_code?", "status?", "limit?", "offset?"]
    output: ExamSession[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  # --------------------------- exam registrations ---------------------------
  - method: POST
    path: /exam-registrations
    roles: [Candidate, ExamOperations]
    input: [application_id, form_id, fee_paid_cents]
    output: ExamRegistration
    side_effects:
      - "candidate_id copied from the application; eligibility_expires_on_snapshot pinned"
      - "calculations.attempt_number_assignment writes attempt_number and enforces the retake wait"
      - "seat_status = UNSCHEDULED; score_status = NOT_APPLICABLE; form_reassignment_required = false"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_APPLICATION_NOT_FOUND, ERR_FORM_NOT_FOUND,
             ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_PROGRAM_NOT_ACTIVE, ERR_FORM_NOT_PUBLISHED,
             ERR_APPLICATION_NOT_APPROVED, ERR_CANDIDATE_BARRED, ERR_ELIGIBILITY_PROGRAM_MISMATCH,
             ERR_ELIGIBILITY_EXPIRED, ERR_RETAKE_WAIT_ACTIVE, ERR_MAX_ATTEMPTS_REACHED, ERR_EXAM_FEE_INSUFFICIENT]

  - method: GET
    path: /exam-registrations/{id}
    roles: [ExamOperations, Candidate, ProgramAdmin, Psychometrician]
    input: []
    output: ExamRegistration
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REGISTRATION_NOT_FOUND]

  - method: GET
    path: /exam-registrations
    roles: [ExamOperations, Candidate, ProgramAdmin, Psychometrician]
    input: ["candidate_id?", "application_id?", "form_id?", "session_id?", "seat_status?", "score_status?", "outcome?", "limit?", "offset?"]
    output: ExamRegistration[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /exam-registrations/{id}/schedule
    roles: [Candidate, ExamOperations]
    input: [session_id, expected_session_version]
    output: ExamRegistration
    side_effects:
      - "UNSCHEDULED -> SCHEDULED; session_id and session_ends_at written"
      - "session.seats_reserved += 1 and session.status recomputed"
      - "increments ExamSession.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REGISTRATION_NOT_FOUND, ERR_SESSION_NOT_FOUND,
             ERR_NOT_RESOURCE_OWNER, ERR_INVALID_REQUEST, ERR_STALE_VERSION, ERR_INVALID_STATE,
             ERR_FORM_NOT_PUBLISHED, ERR_CANDIDATE_BARRED, ERR_CANDIDATE_WINDOW_CONFLICT,
             ERR_SESSION_CLOSED, ERR_SESSION_FULL]

  - method: POST
    path: /exam-registrations/{id}/cancel-schedule
    roles: [Candidate, ExamOperations]
    input: ["cancel_reason?"]
    output: ExamRegistration
    side_effects:
      - "SCHEDULED -> UNSCHEDULED; session_id cleared, session_ends_at retained"
      - "compensating decrement: session.seats_reserved -= 1 and session.status recomputed"
      - "increments ExamSession.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REGISTRATION_NOT_FOUND, ERR_NOT_RESOURCE_OWNER,
             ERR_INVALID_STATE, ERR_SESSION_CLOSED]

  - method: POST
    path: /exam-registrations/{id}/check-in
    roles: [ExamOperations]
    input: ["checkin_note?"]
    output: ExamRegistration
    side_effects:
      - "seat_status SCHEDULED -> CHECKED_IN and score_status NOT_APPLICABLE -> PENDING in one call"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REGISTRATION_NOT_FOUND, ERR_INVALID_STATE,
             ERR_FORM_NOT_PUBLISHED, ERR_CANDIDATE_BARRED, ERR_CHECKIN_WINDOW_CLOSED]

  - method: POST
    path: /exam-registrations/{id}/submit-responses
    roles: [ExamOperations]
    input: [raw_score]
    output: ExamRegistration
    side_effects:
      - "seat_status CHECKED_IN -> COMPLETED; score_status PENDING -> SCORED"
      - "calculations.scaled_score_equating writes scaled_score and outcome"
      - "application.attempts_consumed += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REGISTRATION_NOT_FOUND, ERR_INVALID_REQUEST,
             ERR_INVALID_STATE, ERR_SCORE_UNDER_SECURITY_HOLD, ERR_RAW_SCORE_OUT_OF_RANGE]

  - method: POST
    path: /exam-registrations/{id}/report-score
    roles: [ExamOperations]
    input: ["report_note?"]
    output: ExamRegistration
    side_effects:
      - "score_status SCORED -> REPORTED"
      - "outcome PASS, no prior credential: cascade hop 1 mints a Certificant with calculations.certificate_number_minting"
      - "cascade hop 2: program.certificants_issued_count += 1 and valid_through set from cycle_length_months"
      - "cascade hop 3: RecertificationCycle 1 opened (path CEU) and certificant.current_cycle_id repointed"
      - "outcome PASS on a re-examination: the certificant's RE_EXAM cycle records reexam_registration_id and moves to SATISFIED instead"
      - "outcome FAIL: no credential side effects"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REGISTRATION_NOT_FOUND, ERR_INVALID_STATE,
             ERR_SCORE_UNDER_SECURITY_HOLD]

  # --------------------------- security incidents ---------------------------
  - method: POST
    path: /exam-registrations/{id}/security-incidents
    roles: [ExamOperations]
    input: [incident_type, severity, description]
    output: SecurityIncident
    side_effects:
      - "status = OPEN"
      - "severity CRITICAL with score_status IN {PENDING, SCORED}: score_status_before_hold recorded, score_status -> WITHHELD, placed_hold = true"
      - "an OPEN incident blocks POST /exam-registrations/{id}/report-score"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REGISTRATION_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /exam-registrations/{id}/security-incidents
    roles: [ExamOperations, ProgramAdmin]
    input: ["status?", "severity?", "incident_type?", "limit?", "offset?"]
    output: SecurityIncident[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_REGISTRATION_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /security-incidents/{id}
    roles: [ExamOperations, ProgramAdmin]
    input: []
    output: SecurityIncident
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INCIDENT_NOT_FOUND]

  - method: POST
    path: /security-incidents/{id}/adjudicate
    roles: [ExamOperations]
    input: [outcome, "outcome_note?"]
    output: SecurityIncident
    side_effects:
      - "SUBSTANTIATE: OPEN -> SUBSTANTIATED; cascade hop 1 sets registration.score_status = VOIDED and clears scaled_score and outcome"
      - "SUBSTANTIATE with severity CRITICAL: cascade hop 2 bars the candidate for 730 days; hop 3 cancels the candidate's other SCHEDULED registrations; hop 4 releases those seats"
      - "DISMISS: OPEN -> UNSUBSTANTIATED; the compensating restore puts score_status back to score_status_before_hold"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INCIDENT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE]

  # ------------------------ certificants and registry -----------------------
  - method: GET
    path: /certificants/{id}
    roles: [ProgramAdmin, EthicsOfficer, Certificant, ExamOperations, EligibilityReviewer]
    input: []
    output: Certificant
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CERTIFICANT_NOT_FOUND]

  - method: GET
    path: /certificants
    roles: [ProgramAdmin, EthicsOfficer, Certificant, ExamOperations, EligibilityReviewer]
    input: ["candidate_id?", "program_id?", "status?", "publication_status?", "certificate_number?", "limit?", "offset?"]
    output: Certificant[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: GET
    path: /registry/verify
    roles: [Public]
    input: [certificate_number]
    output: "{ certificate_number: string, credential_code: string, full_name: string, credential_status: string, publication_status: string, issued_on: string, valid_through: string, verified_at: string }"
    side_effects: []
    description: |
      Public verification service — the ONLY endpoint that requires no X-User-ID
      or X-Role header. A certificant whose publication_status is WITHHELD or
      REMOVED is reported as ERR_CERTIFICANT_NOT_FOUND so that suppression is
      indistinguishable from non-existence; a PUBLISHED but EXPIRED credential
      is disclosed with credential_status EXPIRED.
    errors: [ERR_INVALID_REQUEST, ERR_CERTIFICANT_NOT_FOUND]

  - method: GET
    path: /certificants/{id}/recertification-cycles
    roles: [ProgramAdmin, EthicsOfficer, Certificant]
    input: ["status?", "path?", "limit?", "offset?"]
    output: RecertificationCycle[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CERTIFICANT_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /certificants/{id}/disciplinary-cases
    roles: [ProgramAdmin, EthicsOfficer, Certificant]
    input: ["status?", "outcome?", "limit?", "offset?"]
    output: DisciplinaryCase[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CERTIFICANT_NOT_FOUND, ERR_INVALID_REQUEST]

  # ------------------------ recertification cycles --------------------------
  - method: GET
    path: /recertification-cycles/{id}
    roles: [ProgramAdmin, EthicsOfficer, Certificant, EligibilityReviewer]
    input: []
    output: RecertificationCycle
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CYCLE_NOT_FOUND]

  - method: GET
    path: /recertification-cycles
    roles: [ProgramAdmin, EthicsOfficer, Certificant, EligibilityReviewer]
    input: ["certificant_id?", "reexam_registration_id?", "status?", "path?", "limit?", "offset?"]
    output: RecertificationCycle[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /recertification-cycles/{id}/close
    roles: [Certificant, ProgramAdmin]
    input: [expected_certificant_version]
    output: RecertificationCycle
    side_effects:
      - "SATISFIED -> CLOSED; calculations.carryover_computation writes carryover_credits_out"
      - "certificant.valid_through advanced by program.cycle_length_months; increments Certificant.version by 1"
      - "a successor cycle is opened with carryover_credits_in = carryover_credits_out and certificant.current_cycle_id repointed"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CYCLE_NOT_FOUND, ERR_NOT_RESOURCE_OWNER,
             ERR_INVALID_REQUEST, ERR_STALE_VERSION, ERR_CERTIFICANT_NOT_ACTIVE, ERR_CREDITS_NOT_SATISFIED]

  - method: POST
    path: /recertification-cycles/{id}/elect-reexam
    roles: [Certificant]
    input: ["election_note?"]
    output: RecertificationCycle
    side_effects:
      - "path CEU -> RE_EXAM; required_credits set to 0"
      - "every CEUActivity under the cycle is decounted (counted = false, credits_counted = 0) and credits_applied recomputed to 0.00"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CYCLE_NOT_FOUND, ERR_NOT_RESOURCE_OWNER, ERR_INVALID_STATE]

  - method: POST
    path: /recertification-cycles/{id}/reinstate
    roles: [Certificant]
    input: [payment_cents]
    output: RecertificationCycle
    side_effects:
      - "LAPSED -> OPEN; grace_ends_on extended by program.recert_grace_days; reinstatement_fee_cents cleared"
      - "the owning Certificant moves EXPIRED -> ACTIVE and publication_status back to PUBLISHED; increments Certificant.version by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CYCLE_NOT_FOUND, ERR_NOT_RESOURCE_OWNER,
             ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_CERTIFICANT_ALREADY_REVOKED, ERR_REINSTATEMENT_FEE_UNPAID]

  - method: POST
    path: /recertification-cycles/{id}/ceu-activities
    roles: [Certificant]
    input: [activity_date, category, provider, contact_hours]
    output: CEUActivity
    side_effects:
      - "status = SUBMITTED; counted = false; credits_counted = 0.00"
      - "credits_awarded = round_half_up(contact_hours * MULTIPLIER[category], 2) — recorded but not yet counted"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CYCLE_NOT_FOUND, ERR_NOT_RESOURCE_OWNER,
             ERR_INVALID_REQUEST, ERR_INVALID_STATE, ERR_CERTIFICANT_NOT_ACTIVE, ERR_ACTIVITY_OUTSIDE_CYCLE]

  - method: GET
    path: /recertification-cycles/{id}/ceu-activities
    roles: [ProgramAdmin, EligibilityReviewer, Certificant]
    input: ["status?", "category?", "counted?", "limit?", "offset?"]
    output: CEUActivity[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CYCLE_NOT_FOUND, ERR_INVALID_REQUEST]

  - method: GET
    path: /ceu-activities/{id}
    roles: [ProgramAdmin, EligibilityReviewer, Certificant]
    input: []
    output: CEUActivity
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ACTIVITY_NOT_FOUND]

  - method: POST
    path: /ceu-activities/{id}/review
    roles: [EligibilityReviewer]
    input: [outcome, "review_note?"]
    output: CEUActivity
    side_effects:
      - "APPROVE: SUBMITTED -> APPROVED, counted = true"
      - "REJECT: SUBMITTED -> REJECTED, counted stays false"
      - "SELECT_FOR_AUDIT: SUBMITTED|APPROVED -> AUDIT_SELECTED, counted forced to false (compensating decount when arriving from APPROVED)"
      - "reviewer_user_id = acting X-User-ID"
      - "calculations.ceu_credit_accrual re-runs over the whole cycle, rewriting credits_counted on every capped-category activity and cycle.credits_applied"
      - "the cycle may bubble OPEN -> SATISFIED or revert SATISFIED -> OPEN"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ACTIVITY_NOT_FOUND, ERR_INVALID_REQUEST,
             ERR_INVALID_STATE, ERR_CERTIFICANT_NOT_ACTIVE]

  - method: POST
    path: /ceu-activities/{id}/audit-verify
    roles: [EligibilityReviewer]
    input: [outcome, "review_note?"]
    output: CEUActivity
    side_effects:
      - "VERIFY: AUDIT_SELECTED -> VERIFIED, counted = true"
      - "REVOKE: AUDIT_SELECTED -> REVOKED, counted stays false"
      - "audit_verifier_user_id = acting X-User-ID"
      - "calculations.ceu_credit_accrual re-runs and the cycle may bubble OPEN <-> SATISFIED"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_ACTIVITY_NOT_FOUND, ERR_INVALID_REQUEST,
             ERR_INVALID_STATE, ERR_SEGREGATION_OF_DUTIES]

  # --------------------------- disciplinary cases ---------------------------
  - method: POST
    path: /disciplinary-cases
    roles: [EthicsOfficer]
    input: [certificant_id, allegation_type, description]
    output: DisciplinaryCase
    side_effects:
      - "status = OPENED; response_round = 0; opened_by_user_id = acting X-User-ID"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CERTIFICANT_NOT_FOUND, ERR_INVALID_REQUEST,
             ERR_CERTIFICANT_ALREADY_REVOKED]

  - method: GET
    path: /disciplinary-cases/{id}
    roles: [EthicsOfficer, ProgramAdmin, Certificant]
    input: []
    output: DisciplinaryCase
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CASE_NOT_FOUND]

  - method: GET
    path: /disciplinary-cases
    roles: [EthicsOfficer, ProgramAdmin]
    input: ["certificant_id?", "status?", "outcome?", "allegation_type?", "limit?", "offset?"]
    output: DisciplinaryCase[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /disciplinary-cases/{id}/request-response
    roles: [EthicsOfficer]
    input: ["request_note?"]
    output: DisciplinaryCase
    side_effects:
      - "OPENED|UNDER_REVIEW -> RESPONSE_REQUESTED"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CASE_NOT_FOUND, ERR_INVALID_STATE,
             ERR_CERTIFICANT_ALREADY_REVOKED]

  - method: POST
    path: /disciplinary-cases/{id}/respond
    roles: [Certificant]
    input: [response_text]
    output: DisciplinaryCase
    side_effects:
      - "RESPONSE_REQUESTED -> UNDER_REVIEW; response_round += 1"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CASE_NOT_FOUND, ERR_NOT_RESOURCE_OWNER,
             ERR_INVALID_REQUEST, ERR_INVALID_STATE]

  - method: POST
    path: /disciplinary-cases/{id}/decide
    roles: [EthicsOfficer]
    input: [outcome, "sanction_months?", "decision_note?"]
    output: DisciplinaryCase
    side_effects:
      - "OPENED|UNDER_REVIEW -> CLOSED; outcome and decided_on written"
      - "SANCTIONED: certificant ACTIVE -> SUSPENDED with suspension_until = current_utc + sanction_months, publication_status WITHHELD"
      - "REVOKED: cascade hop 1 revokes the certificant and removes it from the registry; hop 2 voids its cycles; hop 3 decounts every counted CEUActivity and zeroes credits_applied"
      - "DISMISSED: no certificant mutation"
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_CASE_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_STATE,
             ERR_SEGREGATION_OF_DUTIES, ERR_CERTIFICANT_NOT_ACTIVE, ERR_CERTIFICANT_ALREADY_REVOKED,
             ERR_DUE_PROCESS_INCOMPLETE]

  # ------------------------- ops / test-driving ------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [ProgramAdmin, ItemSpecialist, Psychometrician, Panelist, EligibilityReviewer, ExamOperations, EthicsOfficer, Candidate, Certificant]
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "sets the logical clock every temporal rule reads"
    description: |
      Test-driving endpoint (§1.5 ladder step 3). The logical clock DEFAULTS to
      2026-08-01T00:00:00Z; every temporal precondition, expiry window, grace
      period, retake wait and check-in window is evaluated against this clock,
      never against wall time. Setting the clock never mutates stored entities —
      only POST /recertification-runs materialises time-driven transitions.
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

  - method: POST
    path: /recertification-runs
    roles: [ProgramAdmin]
    input: ["dry_run?"]
    output: "{ run_at: string, no_show_registration_ids: string[], expired_application_ids: string[], lapsed_cycle_ids: string[], expired_certificant_ids: string[], reactivated_certificant_ids: string[], unbarred_candidate_ids: string[] }"
    side_effects:
      - "step 1 — registrations, created_at ASC: SCHEDULED seats whose session.ends_at has passed move to NO_SHOW, release the seat and consume an attempt"
      - "step 2 — applications, created_at ASC: APPROVED applications past eligibility_expires_on move to EXPIRED"
      - "step 3 — cycles, created_at ASC: OPEN cycles strictly past grace_ends_on move to LAPSED, calculations.reinstatement_fee_assessment stamps reinstatement_fee_cents, and the owning Certificant moves ACTIVE -> EXPIRED with publication_status WITHHELD"
      - "step 4 — certificants, created_at ASC: SUSPENDED certificants whose suspension_until has been reached move back to ACTIVE and BARRED candidates whose barred_until has been reached move back to ACTIVE"
      - "dry_run true reports the same id lists without mutating anything"
    description: |
      Idempotent ops-run checkpoint. The four steps run in the fixed order above
      and each step processes its rows in created_at ASC order, so a cycle that
      lapses in step 3 is never also reactivated in step 4 of the same run.
    errors: [ERR_UNAUTHENTICATED, ERR_FORBIDDEN_ROLE, ERR_INVALID_REQUEST]

# =============================================================================
# §1.6 Error Catalogue
# =============================================================================
errors:
  # --- transport / access ----------------------------------------------------
  - { error_id: ERR_UNAUTHENTICATED,      http_status: 401, category: auth,          message: "Missing or empty X-User-ID header" }
  - { error_id: ERR_FORBIDDEN_ROLE,       http_status: 403, category: authorization, message: "X-Role is not permitted on this endpoint" }
  - { error_id: ERR_NOT_RESOURCE_OWNER,   http_status: 403, category: ownership,     message: "Acting user does not own the addressed resource" }
  - { error_id: ERR_INVALID_REQUEST,      http_status: 400, category: schema,        message: "Malformed body: missing required field, bad enum, or out-of-range value" }
  - { error_id: ERR_STALE_VERSION,        http_status: 412, category: occ,           message: "expected_<parent>_version does not match the parent's current version" }

  # --- existence -------------------------------------------------------------
  - { error_id: ERR_PROGRAM_NOT_FOUND,      http_status: 404, category: existence, message: "No CertificationProgram with that id" }
  - { error_id: ERR_ITEM_NOT_FOUND,         http_status: 404, category: existence, message: "No Item with that id" }
  - { error_id: ERR_FORM_NOT_FOUND,         http_status: 404, category: existence, message: "No ExamForm with that id" }
  - { error_id: ERR_CANDIDATE_NOT_FOUND,    http_status: 404, category: existence, message: "No Candidate with that id" }
  - { error_id: ERR_APPLICATION_NOT_FOUND,  http_status: 404, category: existence, message: "No EligibilityApplication with that id" }
  - { error_id: ERR_SESSION_NOT_FOUND,      http_status: 404, category: existence, message: "No ExamSession with that id" }
  - { error_id: ERR_REGISTRATION_NOT_FOUND, http_status: 404, category: existence, message: "No ExamRegistration with that id" }
  - { error_id: ERR_INCIDENT_NOT_FOUND,     http_status: 404, category: existence, message: "No SecurityIncident with that id" }
  - { error_id: ERR_CERTIFICANT_NOT_FOUND,  http_status: 404, category: existence, message: "No Certificant with that id, or the credential is suppressed from the public registry" }
  - { error_id: ERR_CYCLE_NOT_FOUND,        http_status: 404, category: existence, message: "No RecertificationCycle with that id" }
  - { error_id: ERR_ACTIVITY_NOT_FOUND,     http_status: 404, category: existence, message: "No CEUActivity with that id" }
  - { error_id: ERR_CASE_NOT_FOUND,         http_status: 404, category: existence, message: "No DisciplinaryCase with that id" }

  # --- uniqueness / schema-level business ------------------------------------
  - { error_id: ERR_CREDENTIAL_CODE_TAKEN,     http_status: 409, category: schema, message: "Another DRAFT or ACTIVE program already uses this credential_code" }
  - { error_id: ERR_CANDIDATE_EMAIL_TAKEN,     http_status: 409, category: schema, message: "Another candidate already uses this email" }
  - { error_id: ERR_BLUEPRINT_WEIGHTS_INVALID, http_status: 400, category: schema, message: "domain_specs weights must sum to exactly 100 with unique domain codes" }

  # --- state ----------------------------------------------------------------
  - { error_id: ERR_INVALID_STATE,               http_status: 409, category: state, message: "The entity's current state does not permit this transition" }
  - { error_id: ERR_PROGRAM_NOT_ACTIVE,          http_status: 409, category: state, message: "The certification program is not ACTIVE" }
  - { error_id: ERR_FORM_NOT_PUBLISHED,          http_status: 409, category: state, message: "The exam form is not PUBLISHED" }
  - { error_id: ERR_APPLICATION_NOT_APPROVED,    http_status: 409, category: state, message: "The eligibility application is not APPROVED" }
  - { error_id: ERR_CERTIFICANT_NOT_ACTIVE,      http_status: 409, category: state, message: "The certificant is suspended, expired or revoked" }
  - { error_id: ERR_CERTIFICANT_ALREADY_REVOKED, http_status: 409, category: state, message: "The credential is already revoked and admits no further action" }
  - { error_id: ERR_DIMENSION_ALREADY_VERIFIED,  http_status: 409, category: state, message: "That eligibility dimension has already been decided" }

  # --- business_safety ------------------------------------------------------
  - { error_id: ERR_SEGREGATION_OF_DUTIES,     http_status: 409, category: business_safety, message: "The acting user already holds an incompatible role on this record" }
  - { error_id: ERR_CANDIDATE_BARRED,          http_status: 409, category: business_safety, message: "The candidate is barred from testing" }
  - { error_id: ERR_SCORE_UNDER_SECURITY_HOLD, http_status: 409, category: business_safety, message: "An unresolved security incident blocks this score operation" }

  # --- business_referential -------------------------------------------------
  - { error_id: ERR_ITEM_DOMAIN_MISMATCH,        http_status: 422, category: business_referential, message: "Item belongs to another program or to a domain outside the blueprint" }
  - { error_id: ERR_ITEM_NOT_ELIGIBLE_FOR_FORM,  http_status: 422, category: business_referential, message: "Item is not in a form-eligible status" }
  - { error_id: ERR_ITEM_NOT_IN_FORM,            http_status: 422, category: business_referential, message: "pretest_item_ids must be a subset of item_ids" }
  - { error_id: ERR_PANELIST_NOT_ON_PANEL,       http_status: 422, category: business_referential, message: "The rater is not a panelist on this form" }
  - { error_id: ERR_ELIGIBILITY_PROGRAM_MISMATCH, http_status: 422, category: business_referential, message: "The form and the application belong to different programs" }

  # --- business_temporal ----------------------------------------------------
  - { error_id: ERR_ROOM_WINDOW_CONFLICT,      http_status: 409, category: business_temporal, message: "Another test-centre session already occupies that room window" }
  - { error_id: ERR_CANDIDATE_WINDOW_CONFLICT, http_status: 409, category: business_temporal, message: "The candidate already sits an exam within the 120-minute buffer of that window" }
  - { error_id: ERR_SESSION_CLOSED,            http_status: 409, category: business_temporal, message: "The session has already started" }
  - { error_id: ERR_CHECKIN_WINDOW_CLOSED,     http_status: 409, category: business_temporal, message: "Check-in is only permitted from 30 minutes before start until the session ends" }
  - { error_id: ERR_ELIGIBILITY_EXPIRED,       http_status: 409, category: business_temporal, message: "The application's eligibility period has elapsed" }
  - { error_id: ERR_RETAKE_WAIT_ACTIVE,        http_status: 409, category: business_temporal, message: "The mandatory wait since the last attempt has not elapsed" }
  - { error_id: ERR_ACTIVITY_OUTSIDE_CYCLE,    http_status: 422, category: business_temporal, message: "The activity date falls outside the cycle's accrual window" }

  # --- business_constraint --------------------------------------------------
  - { error_id: ERR_BLUEPRINT_DEFICIENT,     http_status: 422, category: business_constraint, message: "One or more blueprint domains lack the minimum operational items" }
  - { error_id: ERR_FORM_LENGTH_MISMATCH,    http_status: 422, category: business_constraint, message: "item_ids length does not equal the program's form_length" }
  - { error_id: ERR_PANEL_QUORUM_NOT_MET,    http_status: 422, category: business_constraint, message: "Too few panellist ratings to adopt a cut score after trimming" }
  - { error_id: ERR_DUPLICATE_PANELIST_RATING, http_status: 409, category: business_constraint, message: "That panellist has already rated this form" }
  - { error_id: ERR_MAX_ATTEMPTS_REACHED,    http_status: 422, category: business_constraint, message: "The application has consumed its permitted attempts" }
  - { error_id: ERR_CREDITS_NOT_SATISFIED,   http_status: 422, category: business_constraint, message: "The cycle has not met its credit or re-examination requirement" }
  - { error_id: ERR_DUE_PROCESS_INCOMPLETE,  http_status: 422, category: business_constraint, message: "A sanction or revocation requires at least one completed response round" }
  - { error_id: ERR_RAW_SCORE_OUT_OF_RANGE,  http_status: 422, category: business_constraint, message: "raw_score must be between 0 and the form's scored_item_count" }
  - { error_id: ERR_ITEM_NOT_ELIGIBLE_FOR_STATS, http_status: 422, category: business_constraint, message: "The item cannot accept response data in its current status" }
  - { error_id: ERR_ITEM_NOT_OPERATIONAL,    http_status: 422, category: business_constraint, message: "Every scored position must resolve to an OPERATIONAL item" }

  # --- business_fiscal -----------------------------------------------------
  - { error_id: ERR_EXAM_FEE_INSUFFICIENT,     http_status: 402, category: business_fiscal, message: "fee_paid_cents is below the program's exam fee" }
  - { error_id: ERR_REINSTATEMENT_FEE_UNPAID,  http_status: 402, category: business_fiscal, message: "payment_cents is below the assessed reinstatement fee" }

  # --- capacity ------------------------------------------------------------
  - { error_id: ERR_SESSION_FULL,                     http_status: 409, category: capacity, message: "The session has no remaining seats" }
  - { error_id: ERR_PROCTOR_POOL_CAPACITY_EXCEEDED,   http_status: 409, category: capacity, message: "Overlapping online-proctored sessions would exceed the pool's concurrent seat ceiling" }

# =============================================================================
# §1.7 RBAC
# =============================================================================
roles:

  - name: ProgramAdmin
    identity: opaque
    description: "Owns the credential definition and the publish gate."
    exclusive_operations:
      - "POST /programs"
      - "POST /programs/{id}/activate"
      - "POST /forms/{id}/publish"
      - "POST /recertification-runs"
    shared_operations:
      - "GET /programs, GET /programs/{id} and every read endpoint"

  - name: ItemSpecialist
    identity: opaque
    description: "Writes and peer-reviews items. Segregation of duties binds authorship against review."
    exclusive_operations:
      - "POST /items"
      - "POST /items/{id}/submit-for-review"
      - "POST /items/{id}/review"
    shared_operations:
      - "GET /items, GET /items/{id}, GET /programs/{id}/items"

  - name: Psychometrician
    identity: opaque
    description: "Ingests response data, monitors item performance, assembles forms and adopts cut scores."
    exclusive_operations:
      - "POST /items/{id}/response-batches"
      - "POST /items/{id}/retire"
      - "POST /forms"
      - "POST /forms/{id}/adopt-cut-score"
    shared_operations:
      - "POST /forms/{id}/panel-ratings (shared with Panelist)"
      - "GET /items, GET /forms, GET /exam-registrations"

  - name: Panelist
    identity: opaque
    description: "Submits standard-setting judgements. May never adopt the cut score derived from a panel it sat on."
    exclusive_operations: []
    shared_operations:
      - "POST /forms/{id}/panel-ratings (shared with Psychometrician)"
      - "GET /forms/{id}, GET /programs/{id}"

  - name: EligibilityReviewer
    identity: opaque
    description: "Verifies education and experience prerequisites, adjudicates eligibility audits and reviews CEU claims."
    exclusive_operations:
      - "POST /applications/{id}/verify"
      - "POST /applications/{id}/audit-decision"
      - "POST /ceu-activities/{id}/review"
      - "POST /ceu-activities/{id}/audit-verify"
    shared_operations:
      - "POST /candidates and POST /applications (shared with ExamOperations and Candidate)"
      - "GET /applications, GET /recertification-cycles, GET /ceu-activities/{id}"

  - name: ExamOperations
    identity: opaque
    description: "Runs test centres and online proctoring: sessions, check-in, scoring, score release and security incidents."
    exclusive_operations:
      - "POST /exam-sessions"
      - "POST /exam-registrations/{id}/check-in"
      - "POST /exam-registrations/{id}/submit-responses"
      - "POST /exam-registrations/{id}/report-score"
      - "POST /exam-registrations/{id}/security-incidents"
      - "POST /security-incidents/{id}/adjudicate"
    shared_operations:
      - "POST /candidates (shared with EligibilityReviewer)"
      - "POST /exam-registrations, /schedule, /cancel-schedule (shared with Candidate)"

  - name: Candidate
    identity: "entity_backed:Candidate"
    description: "The person seeking the credential. X-User-ID must equal the Candidate.id whose records are being touched."
    exclusive_operations: []
    shared_operations:
      - "POST /applications (shared with EligibilityReviewer)"
      - "POST /exam-registrations, /schedule, /cancel-schedule (shared with ExamOperations)"
      - "GET /applications/{id}, GET /exam-registrations/{id}, GET /exam-sessions, GET /candidates/{id}"

  - name: Certificant
    identity: "entity_backed:Certificant"
    description: "A credential holder maintaining the credential. X-User-ID must equal the Certificant's candidate_id."
    exclusive_operations:
      - "POST /recertification-cycles/{id}/ceu-activities"
      - "POST /recertification-cycles/{id}/elect-reexam"
      - "POST /recertification-cycles/{id}/reinstate"
      - "POST /disciplinary-cases/{id}/respond"
    shared_operations:
      - "POST /recertification-cycles/{id}/close (shared with ProgramAdmin)"
      - "GET /certificants/{id}, GET /certificants/{id}/recertification-cycles, GET /certificants/{id}/disciplinary-cases"

  - name: EthicsOfficer
    identity: opaque
    description: "Opens and decides disciplinary cases. The officer who opened a case may not be the one who revokes on it."
    exclusive_operations:
      - "POST /disciplinary-cases"
      - "POST /disciplinary-cases/{id}/request-response"
      - "POST /disciplinary-cases/{id}/decide"
    shared_operations:
      - "GET /disciplinary-cases, GET /certificants, GET /candidates/{id}"

  - name: Public
    identity: opaque
    description: "Unauthenticated verification consumer. GET /registry/verify is the only endpoint reachable without X-User-ID or X-Role."
    exclusive_operations:
      - "GET /registry/verify"
    shared_operations: []

rbac_notes:
  - "Segregation of duties is enforced on X-User-ID, not on X-Role: two different ItemSpecialist users are required to approve an item, and a third user (the author) may never be either of them."
  - "Role checks (priority 2) always precede ownership checks (priorities 5-6), which always precede segregation-of-duties checks (priority 19)."
