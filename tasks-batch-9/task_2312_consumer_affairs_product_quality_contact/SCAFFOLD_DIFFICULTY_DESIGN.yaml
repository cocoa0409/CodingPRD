      - name: recall_escalation_cascades_signal_to_complaints_to_remedies_to_plant_freeze
        grounds: "§1.2 TrendSignal INVESTIGATION_OPEN -> RECALL_EVALUATION side effects; Complaint -> ON_QUALITY_HOLD; Remedy APPROVED -> VOIDED_BY_HOLD; ProductionLot RELEASED -> HOLD; §1.3 plant_oversight_posture; §1.4 priority 32 ERR_PLANT_UNDER_INVESTIGATION_HOLD"
        distinguishing_aspect: "Fan-OUT cascade of depth 4 driven by a single quality decision. The far end is a *refusal*: an unrelated later POST /production-lots on the same plant is rejected, which is four hops away from the endpoint that was called."
        test_recipe:
          setup:
            - "Logical clock starts at 2026-08-01T00:00:00Z and is advanced to 2026-08-02T00:00:00Z before the ops run."
            - "Staff AG1, SUP1 (TIER_3) and QL1 (QualityLead, TIER_3) exist; Consumer C-1 exists."
            - "The product SKU-MUG has is_regulated_food false, so both severity multipliers stay inert; LOT-B is RELEASED with 100000 units_produced on line L-01 of plant P-CHI."
            - "Three PACKAGING Complaints on LOT-B are all TRIAGED at adjudicated band S2 (weight 2 each), so the lot carries adjudicated_complaint_count 3."
            - "One Remedy on the first complaint is APPROVED with payout_cents 2200, so Consumer C-1 holds goodwill_authorized_cents 2200 and goodwill_outstanding_cents 2200."
            - "A quality ops run has created exactly one LOT-scope TrendSignal on LOT-B and it has been moved to INVESTIGATION_OPEN, so Plant P-CHI.oversight_posture is WATCH with open_investigation_count 1."
