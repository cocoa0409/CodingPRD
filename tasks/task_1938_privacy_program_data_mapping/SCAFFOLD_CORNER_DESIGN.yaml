# =============================================================================
# Scaffold Corner Design (§1.9) — Coverage Index for Non-Difficulty Tests
# task_1938_privacy_program_data_mapping
# Breadth probe over §1.1–§1.7 claims not covered by SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: retention_policy_creation_echoes_fields
        claim_type: creation
        grounds: [entities.RetentionPolicy]
        distinguishing_aspect: "POST with all required fields -> 201; response echoes inputs and carries common fields (id, version 1, created_at)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-2YR", duration_days: 730, disposal_action: ANONYMIZE }
              as: PrivacyAdmin
              captures: { rp: $.data.id, rp_v: $.data.version }
          assert:
            - "201; RetentionPolicy.${rp}.policy_code == RP-2YR, duration_days == 730, disposal_action == ANONYMIZE"
            - "version == 1; id is a server-minted UUID"

      - name: data_element_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.DataElement.fields.category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Category outside the declared enum -> 400 ERR_INVALID_REQUEST; no row created."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "mystery", category: TOPSECRET, classification: INTERNAL }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: notice_defaults_applied
        claim_type: defaults
        grounds: [entities.Notice.fields.effective_to, entities.Notice.fields.status]
        distinguishing_aspect: "Omitting optional effective_to/supersedes_notice_id -> null defaults; new notice starts DRAFT with published_at null."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /privacy/notices"
              payload: { scope: MOBILE_APP, title: "app v1", body: "b", effective_from: "2026-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n: $.data.id, n_to: $.data.effective_to, n_st: $.data.status, n_pub: $.data.published_at, n_sup: $.data.supersedes_notice_id }
          assert:
            - "effective_to == null and supersedes_notice_id == null (defaults)"
            - "status == DRAFT; published_at == null"

      - name: activity_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.ProcessingActivity, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Missing required activity_name -> 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /privacy/processing-activities"
              payload: { business_unit: "Finance", notice_scope: WEBSITE, data_element_ids: [] }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (400)"

      - name: system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.DataElement]
        distinguishing_aspect: "Client-injected id/version are ignored: server-minted id differs, version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL, id: "00000000-0000-0000-0000-000000000000", version: 99 }
              as: DataSteward
              captures: { e_id: $.data.id, e_v: $.data.version }
          assert:
            - "id != 00000000-0000-0000-0000-000000000000 (server-minted)"
            - "version == 1 (injected 99 ignored)"

      - name: computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.ProcessingActivity.fields.risk_score, calculations.activity_risk_score]
        distinguishing_aspect: "Client-supplied risk_score is ignored; server computes the screening value 50 for a single BASIC_CONTACT/INTERNAL element."
        test_recipe:
          setup: ["element email exists"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
          trigger:
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"], risk_score: 999, pia_required: true }
              as: DataSteward
              captures: { a_risk: $.data.risk_score, a_pia: $.data.pia_required }
          assert:
            - "risk_score == 50 (computed), not 999"
            - "pia_required == false (computed), not true"

      - name: purpose_bad_retention_fk_not_found
        claim_type: parent_relationships
        grounds: [entities.Purpose.fields.retention_policy_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body-supplied FK retention_policy_id that does not exist -> 404 ERR_NOT_FOUND (existence p3 before business rules)."
        test_recipe:
          setup: ["activity exists"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /privacy/processing-activities/${a1}/purposes"
              payload: { purpose_type: MARKETING, legal_basis: CONTRACT, retention_policy_id: "11111111-2222-3333-4444-555555555555" }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: get_missing_entity_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /privacy/processing-activities/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: data_systems_listing_pagination
        claim_type: listing
        grounds: [response_envelope, entities.DataSystem]
        distinguishing_aspect: "Pagination fields limit/offset/total_count/has_more behave per envelope defaults over 3 rows."
        test_recipe:
          setup: ["3 data systems created"]
          setup_api_calls:
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-1", hosting_region: US, stores_categories: [FINANCIAL] }
              as: PrivacyAdmin
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-2", hosting_region: EU, stores_categories: [HEALTH] }
              as: PrivacyAdmin
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-3", hosting_region: UK, stores_categories: [BIOMETRIC] }
              as: PrivacyAdmin
          trigger:
            - call: "GET /privacy/data-systems"
              payload: { limit: 2 }
              as: DataSteward
              captures: { page1_len: $.data }
            - call: "GET /privacy/data-systems"
              payload: { limit: 2, offset: 2 }
              as: DataSteward
          assert:
            - "page 1: 2 rows, total_count == 3, has_more == true"
            - "page 2 (offset 2): 1 row, total_count == 3, has_more == false"

      - name: applicability_evaluation_immutability
        claim_type: immutability
        grounds: [entities.ApplicabilityEvaluation]
        distinguishing_aspect: "common_fields: false — evaluation rows carry id + created_at only (no version/updated_at) and expose no mutation endpoints."
        test_recipe:
          setup: ["one state law rule; one evaluation run"]
          setup_api_calls:
            - call: "POST /privacy/state-law-rules"
              payload: { state_code: "CA", law_name: "CCPA", resident_records_threshold: 1, revenue_share_threshold_pct: 100.0, request_deadline_days: 45, extension_days: 45 }
              as: PrivacyAdmin
              captures: { rule: $.data.id }
            - call: "POST /privacy/applicability-evaluations/run"
              payload: { state_revenues: { CA: 0 }, total_revenue_cents: 1000 }
              as: PrivacyAdmin
          trigger:
            - call: "GET /privacy/applicability-evaluations"
              payload: { state_law_rule_id: "${rule}" }
              as: PrivacyAdmin
              captures: { ev_id: "$.data[0].id" }
          assert:
            - "ApplicabilityEvaluation.${ev_id} has id and created_at but NO version and NO updated_at keys"
            - "no PUT/PATCH/DELETE endpoint exists for ApplicabilityEvaluation in §1.5"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: retire_retired_activity_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.ProcessingActivity.ACTIVE_to_RETIRED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "RETIRED is terminal: a second retire -> 409 ERR_INVALID_STATE_TRANSITION, no side effects."
        test_recipe:
          setup: ["activity ACTIVE with one DOCUMENTED purpose"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-1YR", duration_days: 365, disposal_action: DELETE }
              as: PrivacyAdmin
              captures: { rp1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
            - call: "POST /privacy/processing-activities/${a1}/purposes"
              payload: { purpose_type: MARKETING, legal_basis: CONTRACT, retention_policy_id: "${rp1}" }
              as: DataSteward
            - call: "POST /privacy/processing-activities/${a1}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /privacy/processing-activities/${a1}/retire"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /privacy/processing-activities/${a1}/retire"
              payload: {}
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); activity stays RETIRED"

      - name: submit_in_review_assessment_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.PrivacyImpactAssessment.TRIGGERED_to_IN_REVIEW]
        distinguishing_aspect: "Repeating the submit trigger while IN_REVIEW is not idempotent — second submit -> 409."
        test_recipe:
          setup: ["manual PIA on a low-risk activity, submitted once"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
            - call: "POST /privacy/processing-activities/${a1}/assessments"
              payload: {}
              as: DataSteward
              captures: { pia: $.data.id }
            - call: "POST /privacy/assessments/${pia}/submit"
              payload: {}
              as: BusinessOwner
              as_user_id: "bo-1"
          trigger:
            - call: "POST /privacy/assessments/${pia}/submit"
              payload: {}
              as: BusinessOwner
              as_user_id: "bo-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); assessment stays IN_REVIEW"

      - name: approve_rejected_assessment_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.PrivacyImpactAssessment.IN_REVIEW_to_REJECTED]
        distinguishing_aspect: "REJECTED is terminal: approve from REJECTED -> 409."
        test_recipe:
          setup: ["PIA submitted by bo-1 then rejected by lc-1"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
            - call: "POST /privacy/processing-activities/${a1}/assessments"
              payload: {}
              as: DataSteward
              captures: { pia: $.data.id }
            - call: "POST /privacy/assessments/${pia}/submit"
              payload: {}
              as: BusinessOwner
              as_user_id: "bo-1"
            - call: "POST /privacy/assessments/${pia}/reject"
              payload: {}
              as: LegalCounsel
              as_user_id: "lc-1"
          trigger:
            - call: "POST /privacy/assessments/${pia}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "lc-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); assessment stays REJECTED, final_score stays null"

      - name: offboard_rejected_vendor_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.Vendor.ASSESSMENT_to_REJECTED, state_machines.Vendor.APPROVED_to_OFFBOARDED]
        distinguishing_aspect: "REJECTED is terminal for Vendor: offboard from REJECTED -> 409."
        test_recipe:
          setup: ["vendor ASSESSMENT then REJECTED"]
          setup_api_calls:
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "DataPro", home_region: US, processes_categories: [FINANCIAL] }
              as: VendorManager
              captures: { v: $.data.id }
            - call: "POST /privacy/vendors/${v}/submit-assessment"
              payload: {}
              as: VendorManager
            - call: "POST /privacy/vendors/${v}/reject"
              payload: {}
              as: PrivacyAdmin
          trigger:
            - call: "POST /privacy/vendors/${v}/offboard"
              payload: {}
              as: PrivacyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); vendor stays REJECTED"

      - name: new_entities_start_in_initial_states
        claim_type: initial_state
        grounds: [state_machines.ProcessingActivity, state_machines.Vendor, state_machines.VendorContract, state_machines.RightsRequest, state_machines.Purpose, state_machines.Notice]
        distinguishing_aspect: "Creation lands each machine in its declared initial state (DRAFT/ONBOARDING/UNVERIFIED+INTAKE/DOCUMENTED)."
        test_recipe:
          setup: ["minimal fixtures: element, retention policy, consumer"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-1YR", duration_days: 365, disposal_action: DELETE }
              as: PrivacyAdmin
              captures: { rp1: $.data.id }
            - call: "POST /privacy/consumers"
              payload: { email: "tx@x.com", full_name: "TX One", state_code: "TX" }
              as: PrivacyAdmin
              captures: { cons: $.data.id }
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "DataPro", home_region: US, processes_categories: [] }
              as: VendorManager
              captures: { v: $.data.id, v_st: $.data.status, v_ver: $.data.version }
          trigger:
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a_st: $.data.status }
            - call: "POST /privacy/vendors/${v}/contracts"
              payload: { provided_clauses: [DPA], expected_vendor_version: "${v_ver}" }
              as: VendorManager
              captures: { c_st: $.data.status, c_verif: $.data.verification_status }
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "t", body: "b", effective_from: "2026-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n_st: $.data.status }
            - call: "POST /privacy/consumers/${cons}/rights-requests"
              payload: { request_type: ACCESS, requested_categories: [BASIC_CONTACT] }
              as: Consumer
              as_user_id: "${cons}"
              captures: { r_v: $.data.verification_status, r_f: $.data.fulfillment_status }
          assert:
            - "activity DRAFT; contract DRAFT + UNVERIFIED; notice DRAFT; vendor ONBOARDING"
            - "rights request verification_status == UNVERIFIED and fulfillment_status == INTAKE"

      - name: deny_cancels_open_tasks
        claim_type: side_effect_execution
        grounds: [state_machines.RightsRequest.IN_PROGRESS_to_DENIED, state_machines.RequestTask.IN_PROGRESS_to_CANCELLED]
        distinguishing_aspect: "Cascade down on deny: PENDING and IN_PROGRESS tasks -> CANCELLED in created_at ASC order; request -> DENIED."
        test_recipe:
          setup: ["verified request routed to two systems; task[0] IN_PROGRESS, task[1] PENDING"]
          setup_api_calls:
            - call: "POST /privacy/consumers"
              payload: { email: "tx@x.com", full_name: "TX One", state_code: "TX" }
              as: PrivacyAdmin
              captures: { cons: $.data.id }
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-a", hosting_region: US, stores_categories: [FINANCIAL] }
              as: PrivacyAdmin
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-b", hosting_region: US, stores_categories: [FINANCIAL] }
              as: PrivacyAdmin
            - call: "POST /privacy/consumers/${cons}/rights-requests"
              payload: { request_type: DELETION, requested_categories: [FINANCIAL] }
              as: Consumer
              as_user_id: "${cons}"
              captures: { req: $.data.id }
            - call: "POST /privacy/rights-requests/${req}/verify"
              payload: {}
              as: DataSteward
            - call: "POST /privacy/rights-requests/${req}/route"
              payload: {}
              as: DataSteward
            - call: "GET /privacy/rights-requests/${req}/tasks"
              payload: {}
              as: DataSteward
              captures: { t0: "$.data[0].id", t1: "$.data[1].id" }
            - call: "POST /privacy/tasks/${t0}/start"
              payload: {}
              as: DataSteward
          trigger:
            - call: "POST /privacy/rights-requests/${req}/deny"
              payload: { reason: "bad faith" }
              as: LegalCounsel
              captures: { r_f: $.data.fulfillment_status }
            - call: "GET /privacy/tasks/${t0}"
              payload: {}
              as: DataSteward
              captures: { t0_st: $.data.status }
            - call: "GET /privacy/tasks/${t1}"
              payload: {}
              as: DataSteward
              captures: { t1_st: $.data.status }
          assert:
            - "request fulfillment_status == DENIED"
            - "task[0] (was IN_PROGRESS) == CANCELLED; task[1] (was PENDING) == CANCELLED"

      - name: purpose_relink_restores_documented_and_resumes_activity
        claim_type: valid_transition
        grounds: [state_machines.Purpose.CONSENT_STALE_to_DOCUMENTED]
        distinguishing_aspect: "Relink from CONSENT_STALE re-pins the scope's current PUBLISHED notice and bubbles the activity COMPLIANCE_HOLD -> ACTIVE when no other blocker exists."
        test_recipe:
          setup:
            - "notice n1 published (WEBSITE); activity ACTIVE with CONSENT purpose pinned to n1"
            - "n2 published superseding n1 -> purpose CONSENT_STALE, activity COMPLIANCE_HOLD"
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-1YR", duration_days: 365, disposal_action: DELETE }
              as: PrivacyAdmin
              captures: { rp1: $.data.id }
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "v1", body: "b", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n1: $.data.id }
            - call: "POST /privacy/notices/${n1}/publish"
              payload: {}
              as: PrivacyAdmin
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "CRM", business_unit: "Sales", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
            - call: "POST /privacy/processing-activities/${a1}/purposes"
              payload: { purpose_type: MARKETING, legal_basis: CONSENT, retention_policy_id: "${rp1}" }
              as: DataSteward
              captures: { p1: $.data.id }
            - call: "POST /privacy/processing-activities/${a1}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "v2", body: "b2", effective_from: "2026-08-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z", supersedes_notice_id: "${n1}" }
              as: PrivacyAdmin
              captures: { n2: $.data.id }
            - call: "POST /privacy/notices/${n2}/publish"
              payload: {}
              as: PrivacyAdmin
          trigger:
            - call: "POST /privacy/purposes/${p1}/relink"
              payload: {}
              as: DataSteward
              captures: { p_st: $.data.status, p_pin: $.data.pinned_notice_id }
            - call: "GET /privacy/processing-activities/${a1}"
              payload: {}
              as: DataSteward
              captures: { a_st: $.data.status }
          assert:
            - "purpose status == DOCUMENTED and pinned_notice_id == ${n2} (re-pinned to the current PUBLISHED notice)"
            - "activity auto-resumed: status == ACTIVE (no other stale purposes, no open assessment)"

      - name: route_requires_verified_gate
        claim_type: precondition_enforcement
        grounds: [state_machines.RightsRequest.INTAKE_to_ROUTED]
        excluded_because:
          difficulty_instance: rights_request_parallel_dimensions
          rationale: "Asserted as the first trigger step (route while UNVERIFIED -> ERR_REQUEST_NOT_VERIFIED)."

      - name: offboard_conditional_transfer_fanout
        claim_type: side_effect_execution
        grounds: [state_machines.Vendor.APPROVED_to_OFFBOARDED]
        excluded_because:
          difficulty_instance: vendor_offboard_cascade_depth2
          rationale: "PROPOSED->REJECTED vs APPROVED->SUSPENDED conditional fan-out asserted there."
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: vendor_tier_table_boundaries
        claim_type: correct_result
        grounds: [calculations.vendor_risk_tier]
        distinguishing_aspect: "Tier mapping verified at each arm: HIGH-only set {MINOR_DATA}; STANDARD arm {FINANCIAL}/{PRECISE_LOCATION}; LOW arm {BASIC_CONTACT}."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "V-High", home_region: US, processes_categories: [MINOR_DATA] }
              as: VendorManager
              captures: { t_high: $.data.risk_tier }
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "V-Std1", home_region: US, processes_categories: [FINANCIAL] }
              as: VendorManager
              captures: { t_std1: $.data.risk_tier }
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "V-Std2", home_region: US, processes_categories: [PRECISE_LOCATION] }
              as: VendorManager
              captures: { t_std2: $.data.risk_tier }
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "V-Low", home_region: US, processes_categories: [BASIC_CONTACT] }
              as: VendorManager
              captures: { t_low: $.data.risk_tier }
          assert:
            - "[MINOR_DATA] -> HIGH; [FINANCIAL] -> STANDARD; [PRECISE_LOCATION] -> STANDARD; [BASIC_CONTACT] -> LOW"

      - name: contract_clause_gap_set_difference
        claim_type: input_set_filtering
        grounds: [calculations.contract_clause_gap]
        distinguishing_aspect: "HIGH tier requires 5 clauses; providing 2 leaves the sorted difference [AUDIT_RIGHTS, DELETION_ON_EXIT, SUBPROCESSOR_CONSENT]; verify FAILS and the contract stays DRAFT."
        test_recipe:
          setup: ["HIGH vendor ([HEALTH]) created; contract with partial clauses"]
          setup_api_calls:
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "Medidata", home_region: EU, processes_categories: [HEALTH] }
              as: VendorManager
              captures: { v: $.data.id, v_ver: $.data.version }
          trigger:
            - call: "POST /privacy/vendors/${v}/contracts"
              payload: { provided_clauses: [DPA, BREACH_NOTICE_72H], expected_vendor_version: "${v_ver}" }
              as: VendorManager
              captures: { c: $.data.id, c_req: $.data.required_clauses, c_miss: $.data.missing_clauses }
            - call: "POST /privacy/contracts/${c}/verify"
              payload: {}
              as: LegalCounsel
              captures: { c_verif: $.data.verification_status, c_st: $.data.status }
          assert:
            - "required_clauses == [DPA, BREACH_NOTICE_72H, DELETION_ON_EXIT, SUBPROCESSOR_CONSENT, AUDIT_RIGHTS] (HIGH set)"
            - "missing_clauses == [AUDIT_RIGHTS, DELETION_ON_EXIT, SUBPROCESSOR_CONSENT] (sorted by clause code ASC)"
            - "verify -> verification_status == FAILED; status stays DRAFT"

      - name: retention_expiry_literals
        claim_type: correct_result
        grounds: [calculations.retention_expiry, entities.Purpose.fields.retention_expires_at]
        distinguishing_aspect: "created_at (logical clock default 2026-08-01) + duration_days: 365d -> 2027-08-01; a second purpose on a 30d policy -> 2026-08-31."
        test_recipe:
          setup: ["two retention policies (365d, 30d); activity"]
          setup_api_calls:
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-1YR", duration_days: 365, disposal_action: DELETE }
              as: PrivacyAdmin
              captures: { rp365: $.data.id }
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-30D", duration_days: 30, disposal_action: DELETE }
              as: PrivacyAdmin
              captures: { rp30: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /privacy/processing-activities/${a1}/purposes"
              payload: { purpose_type: MARKETING, legal_basis: CONTRACT, retention_policy_id: "${rp365}" }
              as: DataSteward
              captures: { p365_exp: $.data.retention_expires_at }
            - call: "POST /privacy/processing-activities/${a1}/purposes"
              payload: { purpose_type: ANALYTICS, legal_basis: LEGITIMATE_INTEREST, retention_policy_id: "${rp30}" }
              as: DataSteward
              captures: { p30_exp: $.data.retention_expires_at }
          assert:
            - "365-day purpose: retention_expires_at == 2027-08-01T00:00:00.000Z"
            - "30-day purpose: retention_expires_at == 2026-08-31T00:00:00.000Z"

      - name: request_deadline_default_constants
        claim_type: constants_applied
        grounds: [calculations.request_deadline]
        distinguishing_aspect: "No governing rule (TX consumer, no StateLawRule): DEFAULT_DEADLINE_DAYS 45 and DEFAULT_EXTENSION_DAYS 30 apply; applicable_state_code null."
        test_recipe:
          setup: ["TX consumer; TX has no StateLawRule"]
          setup_api_calls:
            - call: "POST /privacy/consumers"
              payload: { email: "tx@x.com", full_name: "TX One", state_code: "TX" }
              as: PrivacyAdmin
              captures: { cons: $.data.id }
          trigger:
            - call: "POST /privacy/consumers/${cons}/rights-requests"
              payload: { request_type: DELETION, requested_categories: [BASIC_CONTACT] }
              as: Consumer
              as_user_id: "${cons}"
              captures: { req: $.data.id, prov: $.data.provisional_due_at, appl: $.data.applicable_state_code }
            - call: "POST /privacy/rights-requests/${req}/verify"
              payload: {}
              as: DataSteward
              captures: { fin: $.data.final_due_at }
          assert:
            - "applicable_state_code == null"
            - "provisional_due_at == 2026-09-15T00:00:00.000Z (default 45d)"
            - "final_due_at == 2026-10-15T00:00:00.000Z (default 45d + 30d extension for DELETION)"

      - name: risk_cap_boundary
        claim_type: constants_applied
        grounds: [calculations.activity_risk_score]
        excluded_because:
          difficulty_instance: risk_formula_mode_a_cap_and_conditionals
          rationale: "RISK_CAP 1000 asserted there (uncapped 1025)."

      - name: routing_selector_order_and_exclusion
        claim_type: correct_result
        grounds: [calculations.request_routing_selection]
        excluded_because:
          difficulty_instance: rights_request_parallel_dimensions
          rationale: "Eligibility intersection, sys-c exclusion, and created_at/system_key tie-break order asserted there."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: unauthenticated_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=1]", "validations[priority=3]"]
        distinguishing_aspect: "Request without auth headers against a non-existent id -> 401 ERR_UNAUTHENTICATED (p1), never 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /privacy/vendors/11111111-2222-3333-4444-555555555555"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (401) — headers absent, so existence is never evaluated"

      - name: role_check_beats_existence
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "Consumer role calling a staff endpoint with a bogus id -> 403 ERR_FORBIDDEN_ROLE (p2) before 404 (p3)."
        test_recipe:
          setup: ["a consumer exists"]
          setup_api_calls:
            - call: "POST /privacy/consumers"
              payload: { email: "tx@x.com", full_name: "TX One", state_code: "TX" }
              as: PrivacyAdmin
              captures: { cons: $.data.id }
          trigger:
            - call: "POST /privacy/vendors/11111111-2222-3333-4444-555555555555/approve"
              payload: {}
              as: Consumer
              as_user_id: "${cons}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE (403) even though the vendor id does not exist"

      - name: duplicate_element_key_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_DUPLICATE_KEY]"]
        distinguishing_aspect: "Second DataElement with the same element_key -> 409 ERR_DUPLICATE_KEY."
        test_recipe:
          setup: ["element email exists"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
          trigger:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: FINANCIAL, classification: CONFIDENTIAL }
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_KEY (409); only one row with element_key email exists"

      - name: inverted_notice_window_rejected_at_publish
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_INVALID_WINDOW]"]
        distinguishing_aspect: "effective_to <= effective_from is accepted at DRAFT creation but rejected at publish -> 422 ERR_INVALID_WINDOW."
        test_recipe:
          setup: ["DRAFT notice with inverted window"]
          setup_api_calls:
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "bad", body: "b", effective_from: "2027-01-01T00:00:00Z", effective_to: "2026-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n: $.data.id }
          trigger:
            - call: "POST /privacy/notices/${n}/publish"
              payload: {}
              as: PrivacyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_WINDOW (422); notice stays DRAFT"

      - name: mechanism_adequacy_conditional_validation
        claim_type: conditional_validation
        grounds: ["validations[priority=8]", "errors[ERR_MECHANISM_NOT_ADEQUATE]"]
        distinguishing_aspect: "EU-source -> US-dest lane rejects mechanism ADEQUACY at approve; the same lane with SCC_2021 approves — the rule fires only for the EU/UK->US lane."
        test_recipe:
          setup:
            - "Vendor APPROVED with EXECUTED contract; source system hosting_region EU; activity ACTIVE"
            - "t1 mechanism ADEQUACY and t2 mechanism SCC_2021, both EU -> US, non-conflicting windows (t1 [2026-03-01, 2026-09-01), t2 [2026-10-01, 2027-02-01))"
          setup_api_calls:
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "DataPro", home_region: US, processes_categories: [FINANCIAL] }
              as: VendorManager
              captures: { v: $.data.id }
            - call: "POST /privacy/vendors/${v}/submit-assessment"
              payload: {}
              as: VendorManager
              captures: { v_ver: $.data.version }
            - call: "POST /privacy/vendors/${v}/contracts"
              payload: { provided_clauses: [DPA, BREACH_NOTICE_72H, DELETION_ON_EXIT], expected_vendor_version: "${v_ver}" }
              as: VendorManager
              captures: { c1: $.data.id }
            - call: "POST /privacy/contracts/${c1}/verify"
              payload: {}
              as: LegalCounsel
            - call: "POST /privacy/contracts/${c1}/execute"
              payload: {}
              as: VendorManager
            - call: "POST /privacy/vendors/${v}/approve"
              payload: {}
              as: PrivacyAdmin
            - call: "POST /privacy/data-systems"
              payload: { system_key: "sys-eu", hosting_region: EU, stores_categories: [FINANCIAL] }
              as: PrivacyAdmin
              captures: { s_eu: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/retention-policies"
              payload: { policy_code: "RP-1YR", duration_days: 365, disposal_action: DELETE }
              as: PrivacyAdmin
              captures: { rp1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Billing", business_unit: "Finance", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
            - call: "POST /privacy/processing-activities/${a1}/purposes"
              payload: { purpose_type: SERVICE_DELIVERY, legal_basis: CONTRACT, retention_policy_id: "${rp1}" }
              as: DataSteward
            - call: "POST /privacy/processing-activities/${a1}/activate"
              payload: {}
              as: DataSteward
            - call: "POST /privacy/transfers"
              payload: { source_system_id: "${s_eu}", vendor_id: "${v}", vendor_contract_id: "${c1}", activity_id: "${a1}", dest_region: US, mechanism: ADEQUACY, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { t1: $.data.id }
            - call: "POST /privacy/transfers"
              payload: { source_system_id: "${s_eu}", vendor_id: "${v}", vendor_contract_id: "${c1}", activity_id: "${a1}", dest_region: US, mechanism: SCC_2021, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-02-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { t2: $.data.id }
          trigger:
            - call: "POST /privacy/transfers/${t1}/assess"
              payload: {}
              as: LegalCounsel
            - call: "POST /privacy/transfers/${t1}/approve"
              payload: {}
              as: LegalCounsel
              captures: { err: $.data.error_id }
            - call: "POST /privacy/transfers/${t2}/assess"
              payload: {}
              as: LegalCounsel
            - call: "POST /privacy/transfers/${t2}/approve"
              payload: {}
              as: LegalCounsel
              captures: { t2_st: $.data.status }
          assert:
            - "t1 (EU->US, ADEQUACY) approve -> error_id ERR_MECHANISM_NOT_ADEQUATE (422); t1 stays UNDER_ASSESSMENT"
            - "t2 (EU->US, SCC_2021) approve -> APPROVED (same lane, adequate mechanism)"

      - name: sod_reject_by_submitter_forbidden
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "SoD applies to reject as well as approve: reviewer whose X-User-ID equals submitted_by_user_id -> 403."
        test_recipe:
          setup: ["manual PIA submitted by bo-2 (IN_REVIEW)"]
          setup_api_calls:
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Newsletter", business_unit: "Marketing", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
            - call: "POST /privacy/processing-activities/${a1}/assessments"
              payload: {}
              as: DataSteward
              captures: { pia: $.data.id }
            - call: "POST /privacy/assessments/${pia}/submit"
              payload: {}
              as: BusinessOwner
              as_user_id: "bo-2"
          trigger:
            - call: "POST /privacy/assessments/${pia}/reject"
              payload: {}
              as: LegalCounsel
              as_user_id: "bo-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (403); assessment stays IN_REVIEW"

      - name: published_notice_gate
        claim_type: cross_entity_validation
        grounds: ["validations[priority=10]", "errors[ERR_NO_PUBLISHED_NOTICE]"]
        excluded_because:
          difficulty_instance: purpose_requires_published_notice
          rationale: "Failure and success paths asserted there."

      - name: contract_executed_gate
        claim_type: cross_entity_validation
        grounds: ["validations[priority=10]", "errors[ERR_CONTRACT_NOT_EXECUTED]"]
        excluded_because:
          difficulty_instance: transfer_approve_requires_executed_contract
          rationale: "VERIFIED-then-EXECUTED approve paths asserted there."

      - name: pia_gate_on_activation
        claim_type: cross_entity_validation
        grounds: ["validations[priority=9]", "errors[ERR_PIA_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: activity_activate_requires_approved_pia
          rationale: "Blocked-then-allowed activation asserted there."

      - name: notice_overlap_and_transfer_buffer
        claim_type: temporal_validation
        grounds: ["validations[priority=11]", "validations[priority=12]"]
        excluded_because:
          difficulty_instance: notice_window_half_open_adjacency
          rationale: "Half-open adjacency vs overlap asserted there; buffer-gap sibling covered by transfer_window_buffer_gap."

      - name: state_vs_sod_priority
        claim_type: priority_conflict
        grounds: ["validations[priority=5]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: state_vs_sod_on_approve
          rationale: "Dual-failure priority asserted there."

      - name: referential_vs_temporal_priority
        claim_type: priority_conflict
        grounds: ["validations[priority=10]", "validations[priority=11]"]
        excluded_because:
          difficulty_instance: referential_vs_temporal_on_transfer_create
          rationale: "Dual-failure priority asserted there."

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_success_and_error
        claim_type: standard_crud
        grounds: [response_envelope]
        distinguishing_aspect: "Success body carries meta.api_request_id + meta.api_request_timestamp + response_type; error body carries data.error_id + data.message with response_type error."
        test_recipe:
          setup: ["one vendor exists"]
          setup_api_calls:
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "DataPro", home_region: US, processes_categories: [] }
              as: VendorManager
              captures: { v: $.data.id }
          trigger:
            - call: "GET /privacy/vendors/${v}"
              payload: {}
              as: DataSteward
            - call: "GET /privacy/vendors/11111111-2222-3333-4444-555555555555"
              payload: {}
              as: DataSteward
              captures: { err: $.data.error_id }
          assert:
            - "success: meta.api_request_id and meta.api_request_timestamp present; response_type == object; data holds the vendor"
            - "error: response_type == error; data.error_id == ERR_NOT_FOUND; data.message present"

      - name: execute_draft_contract_returns_invalid_state
        claim_type: action_endpoint
        grounds: [state_machines.VendorContract.VERIFIED_to_EXECUTED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Execute requires VERIFIED; a DRAFT (never verified) contract -> 409."
        test_recipe:
          setup: ["vendor with a DRAFT contract"]
          setup_api_calls:
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "DataPro", home_region: US, processes_categories: [] }
              as: VendorManager
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /privacy/vendors/${v}/contracts"
              payload: { provided_clauses: [DPA], expected_vendor_version: "${v_ver}" }
              as: VendorManager
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /privacy/contracts/${c1}/execute"
              payload: {}
              as: VendorManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (409); contract stays DRAFT"

      - name: transfer_create_bad_system_fk_not_found
        claim_type: cross_reference_link
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Body FK existence (source_system_id checked in field order) -> 404 when the system id does not exist."
        test_recipe:
          setup: ["vendor, contract, activity all exist"]
          setup_api_calls:
            - call: "POST /privacy/vendors"
              payload: { vendor_name: "DataPro", home_region: US, processes_categories: [] }
              as: VendorManager
              captures: { v: $.data.id, v_ver: $.data.version }
            - call: "POST /privacy/vendors/${v}/contracts"
              payload: { provided_clauses: [DPA], expected_vendor_version: "${v_ver}" }
              as: VendorManager
              captures: { c1: $.data.id }
            - call: "POST /privacy/data-elements"
              payload: { element_key: "email", category: BASIC_CONTACT, classification: INTERNAL }
              as: DataSteward
              captures: { e1: $.data.id }
            - call: "POST /privacy/processing-activities"
              payload: { activity_name: "Billing", business_unit: "Finance", notice_scope: WEBSITE, data_element_ids: ["${e1}"] }
              as: DataSteward
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /privacy/transfers"
              payload: { source_system_id: "11111111-2222-3333-4444-555555555555", vendor_id: "${v}", vendor_contract_id: "${c1}", activity_id: "${a1}", dest_region: EU, mechanism: SCC_2021, effective_from: "2026-03-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND (404); no transfer row created"

      - name: request_overdue_flag_tracks_logical_clock
        claim_type: computed_read
        grounds: [entities.RightsRequest.fields.is_overdue, calculations.request_deadline]
        distinguishing_aspect: "is_overdue flips with the logical clock: false at default 2026-08-01 (due 2026-09-15), true after clock advances to 2026-10-01; unset clock never reads wall time."
        test_recipe:
          setup: ["TX consumer; ACCESS request created (provisional due 2026-09-15)"]
          setup_api_calls:
            - call: "POST /privacy/consumers"
              payload: { email: "tx@x.com", full_name: "TX One", state_code: "TX" }
              as: PrivacyAdmin
              captures: { cons: $.data.id }
            - call: "POST /privacy/consumers/${cons}/rights-requests"
              payload: { request_type: ACCESS, requested_categories: [BASIC_CONTACT] }
              as: Consumer
              as_user_id: "${cons}"
              captures: { req: $.data.id }
          trigger:
            - call: "GET /privacy/rights-requests/${req}"
              payload: {}
              as: DataSteward
              captures: { od_before: $.data.is_overdue }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PrivacyAdmin
            - call: "GET /privacy/rights-requests/${req}"
              payload: {}
              as: DataSteward
              captures: { od_after: $.data.is_overdue }
          assert:
            - "before clock move: is_overdue == false (2026-08-01 < provisional 2026-09-15)"
            - "after clock at 2026-10-01: is_overdue == true"

      - name: notices_filter_by_scope_and_status
        claim_type: standard_crud
        grounds: [entities.Notice]
        distinguishing_aspect: "List filters compose: ?scope=WEBSITE&status=PUBLISHED returns exactly the published WEBSITE notice among DRAFT/SUPERSEDED/other-scope rows."
        test_recipe:
          setup: ["three notices: n1 WEBSITE published, n2 WEBSITE DRAFT, n3 EMPLOYEE published"]
          setup_api_calls:
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "w1", body: "b", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n1: $.data.id }
            - call: "POST /privacy/notices/${n1}/publish"
              payload: {}
              as: PrivacyAdmin
            - call: "POST /privacy/notices"
              payload: { scope: WEBSITE, title: "w2", body: "b", effective_from: "2027-01-01T00:00:00Z" }
              as: PrivacyAdmin
            - call: "POST /privacy/notices"
              payload: { scope: EMPLOYEE, title: "e1", body: "b", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }
              as: PrivacyAdmin
              captures: { n3: $.data.id }
            - call: "POST /privacy/notices/${n3}/publish"
              payload: {}
              as: PrivacyAdmin
          trigger:
            - call: "GET /privacy/notices"
              payload: { scope: WEBSITE, status: PUBLISHED }
              as: PrivacyAdmin
              captures: { hit: "$.data[0].id" }
          assert:
            - "exactly 1 row returned and it is ${n1} (n2 wrong status, n3 wrong scope)"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: err_unauthenticated_missing_headers
        claim_type: violation_to_error
