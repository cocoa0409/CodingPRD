          setup:
            - "Clock at 2026-08-01T00:00:00Z; trust default advance_interest_rate_pct 5.0."
            - "Two loans in one trust, both left in MASTER_SERVICING; loan A monthly_debt_service_usd 65,000.00 so the PI advance cap is 65,000.00."
