      - name: activation_with_another_customers_carrier_account_is_refused
        claim_type: cross_reference_integrity
        grounds:
          - validations.priority_40_ERR_CROSS_REFERENCE_MISMATCH
          - entities.DeviceUnit.fields.carrier_account_id
          - endpoints.POST_/device-units/{id}/activation
        distinguishing_aspect: |
          Flat topology means every foreign key is checked for owner agreement, not merely
          for existence: a CarrierAccount that exists but belongs to customer B cannot
          activate customer A's handset — HTTP 409 ERR_CROSS_REFERENCE_MISMATCH (priority
          40), not the 404 of priority 34 and not a silent success, and both the handset and
          the account are left untouched.
