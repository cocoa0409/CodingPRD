# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Cable/Satellite TV Subscription. Breadth probe over §1.1–§1.7; §1.8-covered
# corners are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Account.fields.lifecycle_status
          - entities.Account.fields.promo_status
        distinguishing_aspect: "POST /accounts with customer_name+service_state_code -> 201, lifecycle_status PROSPECT, promo_status NONE, version 1, tenure_months 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { customer_name: "New Cust", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { life: $.data.lifecycle_status, promo: $.data.promo_status, ver: $.data.version }
          assert:
            - "Account.${life} == PROSPECT"
            - "Account.${promo} == NONE"
            - "Account.${ver} == 1"

      - name: get_account_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Account.fields.customer_name
        distinguishing_aspect: "GET /accounts/{id} returns the stored Account with matching customer_name."
        test_recipe:
          setup:
            - "One account created."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Stored", service_state_code: "NY", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { name: $.data.customer_name }
          assert:
            - "Account.${name} == Stored"

      - name: list_accounts_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Account.fields.lifecycle_status
        distinguishing_aspect: "GET /accounts returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup:
            - "Two accounts created."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "L1", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
            - call: "POST /accounts"
              payload: { customer_name: "L2", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
          trigger:
            - call: "GET /accounts"
              payload: { limit: 1, offset: 0 }
              as: BillingAdmin
          assert:
            - "response_type == array"
            - "meta.total_count >= 2"
            - "has_more == true"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: "GET /accounts/{random-uuid} -> ERR_ACCOUNT_NOT_FOUND 404."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ACCOUNT_NOT_FOUND"

      - name: create_account_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Account.fields.service_state_code
        distinguishing_aspect: "POST /accounts missing service_state_code -> ERR_INVALID_REQUEST 422."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { customer_name: "NoState" }
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: account_contract_term_defaults_to_zero
        claim_type: Defaults
        grounds:
          - entities.Account.fields.contract_term_months
        distinguishing_aspect: "Omitting contract_term_months on POST /accounts applies default 0 (month-to-month)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { customer_name: "Def", service_state_code: "CA" }
              as: CustomerServiceAgent
              captures: { term: $.data.contract_term_months }
          assert:
            - "Account.${term} == 0"

      - name: account_monthly_recurring_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Account.fields.monthly_recurring_cents
          - calculations.monthly_recurring_charge
        distinguishing_aspect: "monthly_recurring_cents is computed (calc monthly_recurring_charge); a fresh PROSPECT account reports 0 and no client input can set it."
        test_recipe:
          setup:
            - "Fresh prospect account, no subscription yet."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "Comp", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { net: $.data.monthly_recurring_cents }
          assert:
            - "Account.${net} == 0"

      - name: subscription_base_fee_snapshot_at_activation
        claim_type: Computed Fields
        grounds:
          - entities.Subscription.fields.base_fee_cents
          - state_machines.Subscription.status.PENDING_to_ACTIVE
        distinguishing_aspect: "Subscription.base_fee_cents is snapshotted from ChannelPackage.monthly_fee_cents (6000) at activation, independent of input."
        test_recipe:
          setup:
            - "Catalog PLUS fee6000. Account prospect."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Snap", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
              captures: { base: $.data.base_fee_cents, st: $.data.status }
          assert:
            - "Subscription.${base} == 6000"
            - "Subscription.${st} == ACTIVE"

      - name: channel_package_invalid_enum_tier_rejected
        claim_type: Type Constraints
        grounds:
          - entities.ChannelPackage.fields.tier_code
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /channel-packages with tier_code GOLD (not in BASIC|PLUS|PREMIER) -> ERR_VALIDATION 422."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /channel-packages"
              payload: { tier_code: "GOLD", name: "Gold", monthly_fee_cents: 7000, channel_count: 200, rank: 2, active: true }
              as: BillingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_VALIDATION"

      - name: catalog_entity_not_found_on_subscribe
        claim_type: Parent Relationships
        grounds:
          - errors[ERR_CATALOG_ENTITY_NOT_FOUND]
          - entities.Subscription.fields.package_id
        distinguishing_aspect: "POST /accounts/{id}/subscriptions referencing a non-existent package_id -> ERR_CATALOG_ENTITY_NOT_FOUND 404."
        test_recipe:
          setup:
            - "Account prospect, no package created."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { customer_name: "NoPkg", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "11111111-1111-4111-8111-111111111111" }
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CATALOG_ENTITY_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: subscribe_twice_second_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Account.lifecycle_status.PROSPECT_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Second POST /accounts/{id}/subscriptions on an already-ACTIVE account (not PROSPECT) -> ERR_INVALID_STATE 409."
        test_recipe:
          setup:
            - "Account ACTIVE with PLUS subscription."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Twice", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: cancel_already_cancelled_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Account.lifecycle_status.ACTIVE_to_CANCELLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Cancel on a CANCELLED account (terminal) -> ERR_INVALID_STATE 409; no further side effects."
        test_recipe:
          setup:
            - "Account ACTIVE (PLUS) then CANCELLED."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "CancelTwice", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/cancel"
              payload: {}
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/cancel"
              payload: {}
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: reactivate_active_account_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Account.lifecycle_status.SUSPENDED_to_ACTIVE
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST /accounts/{id}/reactivate on an ACTIVE (not SUSPENDED) account -> ERR_INVALID_STATE 409."
        test_recipe:
          setup:
            - "Account ACTIVE (PLUS), never suspended."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "React", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/reactivate"
              payload: {}
              as: CustomerServiceAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: dispatch_from_completed_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ServiceVisit.status.DISPATCHED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Dispatch on a COMPLETED visit (terminal) -> ERR_INVALID_STATE 409."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Tech TECH1. Account ACTIVE. INSTALL visit dispatched then completed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T1", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech1: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "VisitT", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "INSTALL", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T10:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
              captures: { vid: $.data.id }
            - call: "POST /accounts/${acct_id}/service-visits/${vid}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech1}"
            - call: "POST /accounts/${acct_id}/service-visits/${vid}/complete"
              payload: { outcome_note: "done" }
              as: FieldTechnician
              as_user_id: "${tech1}"
          trigger:
            - call: "POST /accounts/${acct_id}/service-visits/${vid}/dispatch"
              payload: {}
              as: FieldTechnician
              as_user_id: "${tech1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: complete_from_scheduled_without_dispatch_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ServiceVisit.status.DISPATCHED_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Complete on a SCHEDULED (not DISPATCHED) visit -> ERR_INVALID_STATE 409."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Tech TECH1. Account ACTIVE. SCHEDULED visit, never dispatched."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T1", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech1: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "NoDisp", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T10:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/service-visits/${vid}/complete"
              payload: { outcome_note: "x" }
              as: FieldTechnician
              as_user_id: "${tech1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: visit_cancel_sets_zero_fee
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ServiceVisit.status.SCHEDULED_to_CANCELLED
          - entities.ServiceVisit.fields.truck_roll_fee_cents
        distinguishing_aspect: "Cancel a SCHEDULED visit -> status CANCELLED, truck_roll_fee_cents 0, no billing impact."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Tech TECH1. Account ACTIVE. SCHEDULED SERVICE visit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /technicians"
              payload: { name: "T1", home_state_code: "CA", active: true }
              as: BillingAdmin
              captures: { tech1: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "CancV", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "POST /accounts/${acct_id}/service-visits"
              payload: { visit_type: "SERVICE", window_start: "2026-06-02T09:00:00Z", window_end: "2026-06-02T10:00:00Z", technician_id: "${tech1}" }
              as: CustomerServiceAgent
              captures: { vid: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/service-visits/${vid}/cancel"
              payload: {}
              as: CustomerServiceAgent
              captures: { st: $.data.status, fee: $.data.truck_roll_fee_cents }
          assert:
            - "ServiceVisit.${st} == CANCELLED"
            - "ServiceVisit.${fee} == 0"

      - name: upgrade_supersedes_old_subscription
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Subscription.status.ACTIVE_to_SUPERSEDED
          - entities.Subscription.fields.previous_subscription_id
        distinguishing_aspect: "Upgrade BASIC->PLUS supersedes old subscription (status SUPERSEDED) and new sub has previous_subscription_id set."
        test_recipe:
          setup:
            - "Catalog BASIC(rank1 fee3000), PLUS(rank2 fee6000). Account BASIC ACTIVE."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "BASIC", name: "Basic", monthly_fee_cents: 3000, channel_count: 60, rank: 1, active: true }
              as: BillingAdmin
              captures: { basic_id: $.data.id }
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Up", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${basic_id}" }
              as: CustomerServiceAgent
              captures: { old_sub: $.data.id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { acct_ver: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/subscriptions/${old_sub}/upgrade"
              payload: { package_id: "${plus_id}", expected_account_version: "${acct_ver}" }
              as: CustomerServiceAgent
              captures: { prev: $.data.previous_subscription_id, st: $.data.status }
          assert:
            - "Subscription.${st} == ACTIVE"
            - "prev == ${old_sub}"

      - name: promo_rollback_on_advance_cycle_resets_price
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Account.promo_status.PROMO_ACTIVE_to_ROLLED_BACK
          - calculations.monthly_recurring_charge
        distinguishing_aspect: "advance-cycle past rollback_at_tenure rolls promo to ROLLED_BACK and monthly_recurring returns to catalog 6800 (was 5600 with 20% off the 6000 package = 1200 discount)."
        test_recipe:
          setup:
            - "Catalog PLUS(rank2 fee6000), RSF CA base800 surcharge500. Promo P20(PERCENT_OFF_PACKAGE 0.2, promo_months 1, requires_min_rank2). Account PLUS ACTIVE, P20 ACTIVE (monthly 5600), tenure0."
          setup_api_calls:
            - call: "POST /channel-packages"
              payload: { tier_code: "PLUS", name: "Plus", monthly_fee_cents: 6000, channel_count: 120, rank: 2, active: true }
              as: BillingAdmin
              captures: { plus_id: $.data.id }
            - call: "POST /regional-sports-fee-rules"
              payload: { state_code: "CA", base_fee_cents: 800, premier_surcharge_cents: 500, active: true }
              as: BillingAdmin
            - call: "POST /promotion-offers"
              payload: { code: "P20", discount_kind: "PERCENT_OFF_PACKAGE", percent_off: 0.2, promo_months: 1, requires_min_rank: 2, rollback_protected: false, active: true }
              as: BillingAdmin
              captures: { p20_id: $.data.id }
            - call: "POST /accounts"
              payload: { customer_name: "Roll", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/subscriptions"
              payload: { package_id: "${plus_id}" }
              as: CustomerServiceAgent
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: CustomerServiceAgent
              captures: { acct_ver: $.data.version }
            - call: "POST /accounts/${acct_id}/promotions"
              payload: { promotion_offer_id: "${p20_id}", expected_account_version: "${acct_ver}" }
              as: CustomerServiceAgent
          trigger:
            - call: "POST /accounts/${acct_id}/advance-cycle"
              payload: {}
              as: BillingAdmin
              captures: { promo: $.data.promo_status, net: $.data.monthly_recurring_cents }
          assert:
            - "Account.${promo} == ROLLED_BACK"
            - "Account.${net} == 6800"

      - name: new_account_starts_in_prospect_initial_state
        claim_type: Initial State
        grounds:
          - entities.Account.fields.lifecycle_status
        distinguishing_aspect: "A newly created Account starts in lifecycle_status PROSPECT (the declared initial_state)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /accounts"
              payload: { customer_name: "Init", service_state_code: "CA", contract_term_months: 0 }
              as: CustomerServiceAgent
              captures: { life: $.data.lifecycle_status }
          assert:
            - "Account.${life} == PROSPECT"

      - name: error_cancel_cascade_covered_by_difficulty
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Account.lifecycle_status.ACTIVE_to_CANCELLED
        excluded_because:
          difficulty_instance: transitive_cascade / cancel_cascade_subscription_addon_equipment_depth3
          rationale: "Cancel cascade (subscription terminate, add-on drop, equipment unreturned, recompute) is fully asserted by the named §1.8 instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: regional_sports_fee_premier_surcharge_applied
        claim_type: Correct Result
        grounds:
          - calculations.regional_sports_fee
          - entities.Account.fields.regional_sports_fee_cents
        distinguishing_aspect: "PREMIER(rank3) account in CA -> regional_sports_fee_cents = base 800 + premier_surcharge 500 = 1300."
        test_recipe:
          setup:
            - "Catalog PREMIER(rank3 fee9000). RSF CA base800 surcharge500. Account PREMIER ACTIVE."
          setup_api_calls:
            - call: "POST /channel-packages"
