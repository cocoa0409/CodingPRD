      - name: calibration_beyond_the_buffered_aggregate_ceiling
        claim_type: error_triggerable
        grounds:
          - validations[priority=42]
          - calculations.monitoring_threshold_calibration.constants
          - endpoints[POST /correspondent-banking/monitoring-profiles/{monitoringProfileId}/calibration]
          - errors[ERR_AGGREGATE_THRESHOLD_EXCEEDED]
        distinguishing_aspect: "The ceiling is tested against the BUFFERED aggregate, so a single corridor that has already been clamped to the 500000000.00 per-corridor USD_CEILING still breaks the aggregate rule once the 1.10 buffer is applied. The refused calibration leaves the profile PROVISIONAL with empty corridor_thresholds, and a second profile over a disjoint interval calibrates cleanly at 493350000.00, showing the check is not merely a per-corridor clamp."
        test_recipe:
          setup: ["A DD_IN_PROGRESS UNRATED respondent (rating_factor 1.30) with two profiles over disjoint CLOSED intervals: the first declares a single DE corridor of 400000000.00 per month, the second a single DE corridor of 300000000.00, both at the default tolerance_pct 0.15 and corridor_risk_weight 1.00."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
