      - name: tank_taken_out_of_service_and_returned_round_trips_through_idle
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/tanks/{tankId}/service
          - state_machines.Tank.IDLE_to_OUT_OF_SERVICE
          - state_machines.Tank.OUT_OF_SERVICE_to_IDLE
        distinguishing_aspect: "One endpoint drives three different edges by its action discriminator. TAKE_OUT_OF_SERVICE and RETURN_TO_SERVICE must NOT touch the sanitation fields - only action=CIP increments cip_cycle_count and stamps last_cip_utc - and neither carries a sanitizer reading."
        test_recipe:
          setup:
            - "Brewery ACTIVE. Tank FV-01 IDLE, cip_cycle_count 0, last_cip_utc null."
            - "Clock left at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
