# =============================================================================
# §1.9 Scaffold Corner Design — Apple Packinghouse & CA Storage
# Breadth coverage of every §1.1–§1.7 claim not already probed by §1.8.
# Logical clock default 2026-08-01T00:00:00Z unless a chain sets it.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # From Table 1 (Entities)
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: c_grower_create_read_defaults
        claim_type: creation
        grounds: [entities.Grower]
        distinguishing_aspect: "POST /growers returns 201 with server-minted id, version 1, created_at stamped from the logical clock default; GET returns the same record."
        test_recipe:
          setup: ["empty DB; logical clock unset (default 2026-08-01T00:00:00Z)"]
          setup_api_calls: []
          trigger:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id, g_v: $.data.version, g_ts: $.data.created_at } }
            - { call: "GET /growers/${g1}", payload: {}, as: Admin, captures: { g_name: $.data.name } }
          assert:
            - "g_v == 1"
            - "g_ts == 2026-08-01T00:00:00Z (logical clock default, not wall clock)"
            - "g_name == Grower One"

      - name: c_grower_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.Grower.fields.grower_code, "errors[ERR_UNIQUE_CONSTRAINT_VIOLATION]"]
        distinguishing_aspect: "grower_code uniqueness: second grower with the same code is rejected 409."
        test_recipe:
          setup: ["grower G1 exists"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin }
          trigger:
            - { call: "POST /growers", payload: { name: "Grower Dup", grower_code: "G1" }, as: Admin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNIQUE_CONSTRAINT_VIOLATION (409)"

      - name: c_block_create_unknown_grower_not_found
        claim_type: parent_relationships
        grounds: [entities.OrchardBlock.fields.grower_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Nested creation under a non-existent grower id fails 404 (path ids validated left-to-right)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /growers/00000000-0000-0000-0000-000000000000/blocks", payload: { orchard_name: "Nowhere", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (404)"

      - name: c_lot_create_block_grower_mismatch_rejected
        claim_type: parent_relationships
        grounds: [entities.Lot.fields.block_id, "errors[ERR_BLOCK_GROWER_MISMATCH]"]
        distinguishing_aspect: "A lot referencing another grower's block is rejected with the referential error even though both FK ids exist."
        test_recipe:
          setup: ["growers G1 and G2 exist; block B1 belongs to G1"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers", payload: { name: "Grower Two", grower_code: "G2" }, as: Admin, captures: { g2: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /lots", payload: { grower_id: "${g2}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_BLOCK_GROWER_MISMATCH (409)"

      - name: c_lot_received_at_uses_logical_clock_default
        claim_type: system_fields
        grounds: [entities.Lot.fields.received_at, "endpoints.POST /_clock/set_current_utc"]
        distinguishing_aspect: "received_at is stamped from the logical clock: default 2026-08-01T00:00:00Z before any clock-set, then follows set_current_utc."
        test_recipe:
          setup: ["grower G with block B"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
          trigger:
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { ts1: $.data.received_at } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: Admin }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 3, received_weight_lbs: 2500, avg_color_pct: 70 }, as: ReceivingClerk, captures: { ts2: $.data.received_at } }
          assert:
            - "ts1 == 2026-08-01T00:00:00Z"
            - "ts2 == 2026-08-05T00:00:00Z"

      - name: c_block_list_pagination_defaults
        claim_type: listing
        grounds: [response_envelope, "endpoints.GET /growers/{growerId}/blocks"]
        distinguishing_aspect: "Default pagination limit 10 / offset 0: 11 blocks list as 10 rows with total_count 11 and has_more true; limit=5&offset=10 returns the tail row."
        test_recipe:
          setup: ["grower G with 11 blocks B01..B11"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B01", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B02", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B03", variety: "FUJI", storage_life_days: 240 }, as: ReceivingClerk }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B04", variety: "FUJI", storage_life_days: 240 }, as: ReceivingClerk }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B05", variety: "HONEYCRISP", storage_life_days: 240 }, as: ReceivingClerk }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B06", variety: "HONEYCRISP", storage_life_days: 240 }, as: ReceivingClerk }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B07", variety: "COSMIC_CRISP", storage_life_days: 240 }, as: ReceivingClerk }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B08", variety: "COSMIC_CRISP", storage_life_days: 240 }, as: ReceivingClerk }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B09", variety: "GRANNY_SMITH", storage_life_days: 240 }, as: ReceivingClerk }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B10", variety: "GRANNY_SMITH", storage_life_days: 240 }, as: ReceivingClerk }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B11", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk }
          trigger:
            - { call: "GET /growers/${g1}/blocks", payload: {}, as: Admin, captures: { total: "$.total_count", more: "$.has_more" } }
            - { call: "GET /growers/${g1}/blocks?limit=5&offset=10", payload: {}, as: Admin, captures: { tail_id: "$.data[0].id", more2: "$.has_more" } }
          assert:
            - "first page returns exactly 10 entries (default limit)"
            - "total == 11 and more == true"
            - "tail page returns exactly 1 entry (tail_id == the 11th block's id) and more2 == false"

  # ---------------------------------------------------------------------------
  # From Table 2 (State Machines)
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: c_presize_from_in_storage_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Lot.RECEIVED_to_PRESIZED, "errors[ERR_LOT_INVALID_STATE]"]
        distinguishing_aspect: "Presize is only valid from RECEIVED; an IN_STORAGE lot rejects it."
        test_recipe:
          setup: ["lot L allocated into room R (lot IN_STORAGE)"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator }
          trigger:
            - { call: "POST /lots/${l1}/presize", payload: { size_small_lbs: 500, size_medium_lbs: 2000, size_large_lbs: 1000, presize_cull_lbs: 500 }, as: ReceivingClerk, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_LOT_INVALID_STATE (409)"

      - name: c_diverted_lot_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Lot.RECEIVED_to_DIVERTED, "errors[ERR_LOT_INVALID_STATE]"]
        distinguishing_aspect: "DIVERTED is terminal: presize and allocation attempts on a diverted lot both fail; diverted_weight_lbs recorded."
        test_recipe:
          setup: ["lot L (RECEIVED, 4000 lbs) diverted to juice; room R AVAILABLE"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /lots/${l1}/divert", payload: {}, as: StorageOperator, captures: { diverted: $.data.diverted_weight_lbs } }
          trigger:
            - { call: "POST /lots/${l1}/presize", payload: { size_small_lbs: 500, size_medium_lbs: 2000, size_large_lbs: 1000, presize_cull_lbs: 500 }, as: ReceivingClerk, captures: { err1: $.data.error_id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { err2: $.data.error_id } }
          assert:
            - "diverted == 4000 (full balance diverted)"
            - "err1 == ERR_LOT_INVALID_STATE and err2 == ERR_LOT_INVALID_STATE"

      - name: c_seal_from_available_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CARoom.FILLING_to_SEALED, "errors[ERR_ROOM_INVALID_STATE]"]
        distinguishing_aspect: "Seal requires FILLING with at least one bin; an AVAILABLE room rejects it."
        test_recipe:
          setup: ["room R freshly created (AVAILABLE, 0 bins)"]
          setup_api_calls:
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ROOM_INVALID_STATE (409)"

      - name: c_open_from_filling_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CARoom.SEALED_to_OPENED, "errors[ERR_ROOM_INVALID_STATE]"]
        distinguishing_aspect: "Open requires SEALED; a FILLING room rejects it."
        test_recipe:
          setup: ["room R FILLING with one allocation"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator }
          trigger:
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ROOM_INVALID_STATE (409)"

      - name: c_release_from_sealed_room_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.StorageAllocation.ACTIVE_to_RELEASED, "errors[ERR_ROOM_INVALID_STATE]"]
        distinguishing_aspect: "Manual release requires the room OPENED; releasing while SEALED fails and the allocation stays ACTIVE."
        test_recipe:
          setup: ["lot allocated; room sealed"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
          trigger:
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator, captures: { err: $.data.error_id } }
            - { call: "GET /allocations/${a1}", payload: {}, as: Admin, captures: { a_status: $.data.status } }
          assert:
            - "err == ERR_ROOM_INVALID_STATE (409)"
            - "a_status == ACTIVE (failed release has no side effects)"

      - name: c_run_cancel_then_complete_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PackingRun.SCHEDULED_to_CANCELLED, "errors[ERR_RUN_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: a subsequent complete is rejected."
        test_recipe:
          setup: ["released lot L (4000 lbs balance); spec ACTIVE; pool OPEN; run SCHEDULED"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 1000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
            - { call: "POST /packing-runs/${run1}/cancel", payload: {}, as: PackingSupervisor }
          trigger:
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 5, packed_weight_lbs: 1000, cull_weight_lbs: 0, juice_weight_lbs: 0 }, as: PackingSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_RUN_INVALID_STATE (409)"

      - name: c_superseded_spec_rejects_new_run
        claim_type: side_effect_execution
        grounds: [state_machines.PackagingSpec.ACTIVE_to_SUPERSEDED, "errors[ERR_SPEC_INVALID_STATE]"]
        distinguishing_aspect: "Creating a second spec in the same (customer_name, size_class, pack_style) scope supersedes the first; the SUPERSEDED spec then rejects new runs while the new spec accepts them."
        test_recipe:
          setup: ["released lot L; pool OPEN; spec SP1 ACTIVE"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
          trigger:
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY-V2", grade_min: "FANCY", color_min_pct: 60, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp2: $.data.id } }
            - { call: "GET /specs/${sp1}", payload: {}, as: Admin, captures: { sp1_status: $.data.status } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 1000 }, as: PackingSupervisor, captures: { err: $.data.error_id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp2}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 1000 }, as: PackingSupervisor, captures: { run2: $.data.id } }
          assert:
            - "sp1_status == SUPERSEDED (supersede side effect fired)"
            - "err == ERR_SPEC_INVALID_STATE for the SUPERSEDED spec"
            - "PackingRun.${run2}.status == SCHEDULED (replacement spec works)"

      - name: c_reopen_open_pool_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Pool.CLOSED_to_REOPENED, "errors[ERR_POOL_INVALID_STATE]"]
        distinguishing_aspect: "Reopen is only valid from CLOSED; an OPEN pool rejects it."
        test_recipe:
          setup: ["pool P OPEN"]
          setup_api_calls:
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /pools/${p1}/reopen", payload: {}, as: PoolManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_POOL_INVALID_STATE (409)"

      - name: c_release_released_allocation_rejected
        claim_type: idempotency
        grounds: [state_machines.StorageAllocation.ACTIVE_to_RELEASED, "errors[ERR_ALLOCATION_INVALID_STATE]"]
        distinguishing_aspect: "Releasing an already-RELEASED allocation fails with the allocation state error (the room stays OPENED because a second allocation keeps it non-empty, isolating the allocation-state check)."
        test_recipe:
          setup: ["room with allocations A (lot L1) and B (lot L2); sealed and opened; A released once"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 4, received_weight_lbs: 3000, avg_color_pct: 75 }, as: ReceivingClerk, captures: { l2: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l2}", bins: 4 }, as: StorageOperator, captures: { a2: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
          trigger:
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_ALLOCATION_INVALID_STATE (409)"

      - name: c_advance_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.GrowerSettlement.ACCRUING_to_ADVANCE_PAID, "errors[ERR_SETTLEMENT_INVALID_STATE]", calculations.pool_price]
        distinguishing_aspect: "Second advance on an ADVANCE_PAID settlement fails; also pins the estimated-price floor: with 40 cartons and no sales, estimated price floors at 1000 cents and advance = round_half_up(40 * 1000 * 0.60) = 24000."
        test_recipe:
          setup: ["released lot; spec; OPEN pool; run completed for 4000 lbs with 40 cartons; no sales (estimated price floors at ESTIMATED_PRICE_FLOOR_CENTS)"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 4000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 40, packed_weight_lbs: 4000, cull_weight_lbs: 0, juice_weight_lbs: 0 }, as: PackingSupervisor }
            - { call: "GET /settlements?pool_id=${p1}", payload: {}, as: Admin, captures: { s1: "$.data[0].id" } }
          trigger:
            - { call: "POST /settlements/${s1}/advance", payload: {}, as: PoolManager, captures: { adv: $.data.advance_amount_cents } }
            - { call: "POST /settlements/${s1}/advance", payload: {}, as: PoolManager, captures: { err: $.data.error_id } }
          assert:
            - "adv == 24000 (floor price 1000 applied: net would be -26000)"
            - "err == ERR_SETTLEMENT_INVALID_STATE on the repeat advance"

      - name: c_stub_room_cycle_restart
        claim_type: valid_transition
        grounds: [state_machines.CARoom.OPENED_to_AVAILABLE]
        excluded_because:
          difficulty_instance: ca_room_full_cycle_restart
          rationale: "Cycle restart and post-cycle reuse asserted by the named §1.8 instance."

      - name: c_stub_pool_reopen_loop
        claim_type: valid_transition
        grounds: [state_machines.Pool.CLOSED_to_REOPENED]
        excluded_because:
          difficulty_instance: pool_reopen_revision_loop
          rationale: "Reopen transition, settlement revert, and delta re-close asserted by the named §1.8 instance."

      - name: c_stub_run_lot_gate
        claim_type: precondition_enforcement
        grounds: [state_machines.Lot.IN_STORAGE_to_RELEASED]
        excluded_because:
          difficulty_instance: run_create_requires_released_lot
          rationale: "Cross-entity lot-state gate on run creation asserted by the named §1.8 instance."

      - name: c_stub_advance_pool_gate
        claim_type: precondition_enforcement
        grounds: [state_machines.GrowerSettlement.ACCRUING_to_ADVANCE_PAID]
        excluded_because:
          difficulty_instance: advance_requires_open_pool
          rationale: "Pool-state gate on settlement advance asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  # From Table 3 (Calculations)
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: c_inspection_below_threshold_no_cascade
        claim_type: constants_applied
        grounds: [calculations.disorder_index, entities.CARoom.fields.priority_release]
        distinguishing_aspect: "decay_pct 4.9 is just below the inclusive 5.0 threshold: disorder_index computes (4.15) but the priority-release cascade does NOT fire — planned_open_date and priority_release unchanged."
        test_recipe:
          setup: ["lot allocated; room SEALED (planned_open_date 2026-11-01); allocation must_release_by 2027-03-29 (received + 240d) -> urgency 0"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 5, received_weight_lbs: 4000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 5 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
          trigger:
            - { call: "POST /ca-rooms/${r1}/inspections", payload: { scald_pct: 4.0, bitter_pit_pct: 3.0, decay_pct: 4.9 }, as: StorageOperator, captures: { idx: $.data.disorder_index } }
            - { call: "GET /ca-rooms/${r1}", payload: {}, as: Admin, captures: { pr: $.data.priority_release, pod: $.data.planned_open_date } }
            - { call: "GET /allocations/${a1}", payload: {}, as: Admin, captures: { score: $.data.release_priority_score } }
          assert:
            - "idx == 4.15 (0.2*4 + 0.3*3 + 0.5*4.9)"
            - "pr == false and pod == 2026-11-01T00:00:00Z (no cascade below threshold)"
            - "score == 8.3 (2*4.15; all conditional branches off, urgency 0)"

      - name: c_actual_packout_excludes_voided_runs
        claim_type: input_set_filtering
        grounds: [calculations.packout_percentage, entities.Lot.fields.actual_packout_pct]
        distinguishing_aspect: "actual_packout_pct aggregates only COMPLETED non-VOIDED runs: after two completions it is 82.2; voiding the second run recomputes to 85.0 — VOIDED runs leave the input set."
        test_recipe:
          setup: ["released lot L (19000 lbs); spec; pool; run1 4000 lbs completed (packed 3400 / cull 400 / juice 200, 20 cartons); run2 5000 lbs completed (packed 4000 / cull 500 / juice 500, 25 cartons) on adjacent windows"]
          setup_api_calls:
            - { call: "POST /growers", payload: { name: "Grower One", grower_code: "G1" }, as: Admin, captures: { g1: $.data.id } }
            - { call: "POST /growers/${g1}/blocks", payload: { orchard_name: "Riverview", block_code: "B1", variety: "GALA", storage_life_days: 240 }, as: ReceivingClerk, captures: { b1: $.data.id } }
            - { call: "POST /lots", payload: { grower_id: "${g1}", block_id: "${b1}", received_bin_count: 20, received_weight_lbs: 19000, avg_color_pct: 80 }, as: ReceivingClerk, captures: { l1: $.data.id } }
            - { call: "POST /ca-rooms", payload: { room_code: "R1", bin_capacity: 40, o2_setpoint_pct: 1.5 }, as: StorageOperator, captures: { r1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/allocations", payload: { lot_id: "${l1}", bins: 20 }, as: StorageOperator, captures: { a1: $.data.id } }
            - { call: "POST /ca-rooms/${r1}/atmosphere-readings", payload: { o2_pct: 1.5 }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/seal", payload: { planned_open_date: "2026-11-01T00:00:00Z" }, as: StorageOperator }
            - { call: "POST /ca-rooms/${r1}/open", payload: {}, as: StorageOperator }
            - { call: "POST /allocations/${a1}/release", payload: {}, as: StorageOperator }
            - { call: "POST /specs", payload: { customer_name: "RetailCo", label_code: "RC-TRAY", grade_min: "EXTRA_FANCY", color_min_pct: 66, size_class: "MEDIUM", pack_style: "TRAY" }, as: PoolManager, captures: { sp1: $.data.id } }
            - { call: "POST /pools", payload: { variety: "GALA", grade_class: "EXTRA_FANCY", season: "2026-2027" }, as: PoolManager, captures: { p1: $.data.id } }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T12:00:00Z", input_weight_lbs: 4000 }, as: PackingSupervisor, captures: { run1: $.data.id } }
            - { call: "POST /packing-runs/${run1}/complete", payload: { cartons_produced: 20, packed_weight_lbs: 3400, cull_weight_lbs: 400, juice_weight_lbs: 200 }, as: PackingSupervisor }
            - { call: "POST /packing-runs", payload: { lot_id: "${l1}", spec_id: "${sp1}", pool_id: "${p1}", line_code: "LINE_1", scheduled_start: "2026-08-02T12:00:00Z", scheduled_end: "2026-08-02T16:00:00Z", input_weight_lbs: 5000 }, as: PackingSupervisor, captures: { run2: $.data.id } }
            - { call: "POST /packing-runs/${run2}/complete", payload: { cartons_produced: 25, packed_weight_lbs: 4000, cull_weight_lbs: 500, juice_weight_lbs: 500 }, as: PackingSupervisor }
          trigger:
            - { call: "GET /lots/${l1}", payload: {}, as: Admin, captures: { ap_both: $.data.actual_packout_pct } }
            - { call: "POST /packing-runs/${run2}/void", payload: {}, as: PackingSupervisor }
            - { call: "GET /lots/${l1}", payload: {}, as: Admin, captures: { ap_after: $.data.actual_packout_pct, bal: $.data.weight_balance_lbs } }
          assert:
            - "ap_both == 82.2 (7400 / 9000)"
            - "ap_after == 85.0 (3400 / 4000 — voided run excluded)"
            - "bal == 15000"

      - name: c_stub_packout_variants
        claim_type: correct_result
        grounds: [calculations.packout_percentage]
        excluded_because:
          difficulty_instance: lot_packout_estimated_vs_actual
          rationale: "Both variants and their divergence asserted by the named §1.8 instance."

      - name: c_stub_pool_price_rounding
        claim_type: precision
        grounds: [calculations.pool_price]
        excluded_because:
          difficulty_instance: pool_price_rounding_order_pinned
          rationale: "Pinned rounding order and signed drift asserted by the named §1.8 instance."

      - name: c_stub_settlement_advance_final
        claim_type: correct_result
        grounds: [calculations.settlement_value]
        excluded_because:
          difficulty_instance: settlement_advance_vs_final_payout
          rationale: "Advance vs final settlement amounts asserted by the named §1.8 instance."

      - name: c_stub_release_score_formula
        claim_type: correct_result
        grounds: [calculations.release_priority_score]
        excluded_because:
          difficulty_instance: release_score_weighted_nonlinear
          rationale: "Weighted score with all conditional branches asserted by the named §1.8 instance."

