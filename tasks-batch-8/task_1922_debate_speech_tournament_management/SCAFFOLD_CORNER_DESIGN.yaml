            - "GET /pairings?round_id=${r1} returns total_count == 0"
  # ------------------------------------------------------------- endpoints ---
  - section: endpoints
    instances:
      - name: pagination_limit_offset_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "List endpoints honor limit/offset with the fixed envelope: page 1 of 3 entries (limit 2) shows total_count 3 and has_more true; page 2 (offset 2) shows 1 item and has_more false; meta carries api_request_id."
        test_recipe:
          setup: ["tournament open, division, school with 3 REGISTERED entries"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "PG", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "E-One" }, as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "E-Two" }, as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "E-Three" }, as: SchoolCoach, as_user_id: "${s_a}" }
          trigger:
            - { call: "GET /entries?school_id=${s_a}&limit=2", as: TournamentDirector }
            - { call: "GET /entries?school_id=${s_a}&limit=2&offset=2", as: TournamentDirector }
          assert:
            - "page 1: response_type == array, 2 items, total_count == 3, has_more == true, meta.api_request_id present"
            - "page 2 (offset 2): 1 item, total_count == 3, has_more == false"

  # --------------------------------------------------------------- errors ---
  - section: errors
    instances:
      - name: err_cap_exceeded_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCHOOL_ENTRY_CAP_EXCEEDED]"]
        excluded_because:
          difficulty_instance: per_school_entry_cap_boundary
          rationale: "Asserted as the failure path of the named difficulty instance (5th entry beyond cap 4)."
      - name: err_conflict_of_interest_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_JUDGE_CONFLICT_OF_INTEREST]"]
        excluded_because:
          difficulty_instance: judge_conflict_beats_turnover_on_assign
          rationale: "Asserted as the winning error of the named difficulty instance's dual-violation trigger."
      - name: err_room_double_booked_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROOM_DOUBLE_BOOKED]"]
        excluded_because:
          difficulty_instance: room_half_open_interval_adjacency
          rationale: "Asserted as the failure path of the named difficulty instance (overlapping slot assignment)."
      - name: err_turnover_conflict_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_JUDGE_TURNOVER_CONFLICT]"]
        excluded_because:
          difficulty_instance: judge_buffered_turnover_gap
          rationale: "Asserted as the failure path of the named difficulty instance (15-minute gap assignment)."

  # ----------------------------------------------------------------- rbac ---
  - section: rbac
    instances:
      - name: tabstaff_cannot_publish_results_forbidden
        claim_type: rbac_denial
        grounds: ["roles[TabStaff]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Segregation of duties: publish-results is TournamentDirector-exclusive; TabStaff is rejected with ERR_FORBIDDEN (403) even before the phase check."
        test_recipe:
          setup: ["one tournament in DRAFT"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "RB", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
          trigger:
            - { call: "POST /tournaments/${t}/publish-results", as: TabStaff, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_FORBIDDEN (403)"]

