        claim_type: temporal_validation
        grounds:
          - validations[priority=12]
          - errors[ERR_METHOD_VALIDATION_EXPIRED]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / start_analysis_blocked_by_lapsed_method_validation_on_a_third_entity"
          rationale: "That instance advances the clock across validation_expires_at_utc and asserts both the one-second-before success and the at-expiry refusal, which is the temporal-validation claim for this rule."

      - name: vendor_concurrent_window_capacity_is_an_aggregate_limit
        claim_type: aggregate_validation
        grounds:
          - validations[priority=17]
          - errors[ERR_VENDOR_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / vendor_closed_window_capacity_refuses_a_touching_endpoint"
          rationale: "That instance fills the vendor's concurrent_case_capacity with individually valid engagements and then refuses one whose closed window merely touches an existing endpoint, which is the aggregate-limit claim."

  # ===========================================================================
  # No endpoint in §1.5 is a bulk endpoint (no request body carries an array of
  # operations and no response carries per-item status), so the guide's
  # "Bulk action" row has no applicable instance in this scaffold.
  - section: endpoints
    instances:

      - name: proficiency_test_action_endpoints_enforce_their_declared_order
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /lab/proficiency-tests/{proficiency_test_id}/submit]
          - endpoints[POST /lab/proficiency-tests/{proficiency_test_id}/score]
          - state_machines.ProficiencyTest
          - errors[ERR_PT_INVALID_STATE]
        distinguishing_aspect: "Scoring is refused with 409 ERR_PT_INVALID_STATE while the test is still ASSIGNED; after submit stamps submitted_at_utc the same score body succeeds, writing result PASS, and because the submission preceded due_utc the late_submission override never fires."
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z."
            - "Analyst A1: CHEMISTRY, competency 4, capacity 40.00, training 8.00, QUALIFIED."
            - "Method M1 VALIDATED, CHEMISTRY, standard_hours_per_item 1.00, min_competency_level 2."
            - "ProficiencyTest PT1 for (A1, M1) in cycle 2026-C1 with due_utc 2026-08-15T00:00:00Z, status ASSIGNED."
            - "Hand-executed formula: submitted_at_utc 2026-08-01T00:00:00Z <= due_utc, so late_submission false; score_pct 95.00 >= PT_PASS_PCT (90.0) so result PASS."
          setup_api_calls:
