  - section: calculations
    instances:
      - name: corner_poe_lapse_notice_uses_the_poe_branch_of_the_effective_date_formula
        claim_type: correct_result
        grounds:
          - calculations.poe_program_selection
          - calculations.termination_effective_date
          - state_machines.Dependent.transitions.PENDING_VERIFICATION_to_TERMINATION_PENDING
          - entities.TerminationNotice.fields.origin
          - endpoints[POST /employees/{id}/dependents]
          - endpoints[POST /audit-programs/{id}/run-sweep]
        distinguishing_aspect: "A dependent enrolled 2026-09-05 under a POINT_OF_ENROLLMENT rule with grace_days 30 gets poe_deadline_at 2026-10-05; the POE_LAPSE branch takes 2026-10-05 + 14 grace days = 2026-10-19 and rolls to month end, so effective_date is 2026-10-31 with no response-deadline floor, case_id null and continuation_election_deadline 2026-12-05."
        test_recipe:
          setup:
