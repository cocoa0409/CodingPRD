      - name: corner_incentive_provisional_versus_final_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.interview_incentive_amount.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / incentive_provisional_vs_final_diverge_on_short_interview
          rationale: "The named §1.8 instance runs both variants on the same interview and asserts each amount plus the ledger delta."

      - name: corner_incentive_variant_reconciliation_on_completion
        claim_type: reconciliation
        grounds:
          - calculations.interview_incentive_amount.variants
          - entities.Program.fields.incentive_committed_usd
          - entities.Program.fields.incentive_paid_usd
        excluded_because:
          difficulty_instance: dual_variant_calc / incentive_provisional_vs_final_diverge_on_short_interview
          rationale: "The same §1.8 instance asserts the PROVISIONAL -> FINAL switch removing the committed amount and adding the final amount, i.e. the reconciliation delta."

      - name: corner_loss_trend_basis_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.loss_reason_trend_shares.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / loss_trend_shares_diverge_between_ratified_only_and_include_provisional
          rationale: "The named §1.8 instance queries both bases over identical data and asserts the divergent shares."

      - name: corner_substantiation_precision_rounds_each_item_before_summing
        claim_type: precision
        grounds:
          - calculations.claim_substantiation_score.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / substantiation_rounds_each_evidence_item_before_summing
          rationale: "The named §1.8 instance contrasts round-then-sum (1.41) against sum-then-round (1.42) on three stale items."

      - name: corner_substantiation_level_threshold_boundary
        claim_type: threshold
        grounds:
          - calculations.claim_substantiation_score.constants.ANECDOTAL_MIN
        excluded_because:
          difficulty_instance: boundary_precision_check / substantiation_exactly_at_anecdotal_min_passes_while_one_cent_below_fails
          rationale: "The named §1.8 instance tests exactly 0.90 and 0.89 on the same endpoint pair."

      - name: corner_risk_index_discount_before_conditional_surcharge
