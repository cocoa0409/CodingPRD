          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { legal_name: "Fund E1", ein: "22-5000001", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
