# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1443_student_activities_honor_society
# =============================================================================
scaffold_corner_design:

  # ============================================================
  # Section: entities — creation, retrieval, listing, defaults, computed fields
  # ============================================================
  - section: entities
    instances:
      - name: chapter_create_returns_201_with_initial_fields
        claim_type: creation
        grounds: [entities.Chapter, "endpoints[POST /chapters]"]
        distinguishing_aspect: "POST /chapters returns 201 with status=DRAFT, standing=GOOD_STANDING, fund_balance_cents=0, dues_arrears_cents=0, active_member_count=0, version=1"
        test_recipe:
          setup: ["Empty DB; logical clock default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
          trigger:
            - call: "POST /chapters"
              payload: { school_name: "Init High", charter_number: "NHS-100", advisor_user_id: "adv_100", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id, status: $.data.status, standing: $.data.standing, bal: $.data.fund_balance_cents, arrears: $.data.dues_arrears_cents, members: $.data.active_member_count, ver: $.data.version }
          assert:
            - "HTTP 201"
            - "status == DRAFT"
            - "standing == GOOD_STANDING"
            - "fund_balance_cents == 0"
            - "dues_arrears_cents == 0"
            - "active_member_count == 0"
            - "version == 1"

      - name: chapter_get_by_id_returns_stored_entity
        claim_type: retrieval
        grounds: [entities.Chapter, "endpoints[GET /chapters/{chapterId}]"]
        distinguishing_aspect: "GET /chapters/{id} returns the previously created chapter"
        test_recipe:
          setup: ["One chapter created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Get High", charter_number: "NHS-101", advisor_user_id: "adv_101", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
          trigger:
            - call: "GET /chapters/${ch_id}"
              payload: {}
              as: Advisor
              captures: { name: $.data.school_name, ver: $.data.version }
          assert:
            - "HTTP 200"
            - "school_name == 'Get High'"
            - "version == 1"

      - name: chapter_get_nonexistent_returns_404
        claim_type: not_found
        grounds: [entities.Chapter, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with non-existent UUID returns ERR_NOT_FOUND (404)"
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
          trigger:
            - call: "GET /chapters/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_NOT_FOUND"

      - name: chapter_list_returns_paginated_array
        claim_type: listing
        grounds: [entities.Chapter, "endpoints[GET /chapters]"]
        distinguishing_aspect: "GET /chapters returns paginated list with limit/offset/total_count/has_more"
        test_recipe:
          setup: ["Two chapters created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "P1", charter_number: "NHS-102", advisor_user_id: "adv_102", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "P2", charter_number: "NHS-103", advisor_user_id: "adv_103", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
          trigger:
            - call: "GET /chapters"
              payload: { limit: 10, offset: 0 }
              as: Advisor
          assert:
            - "HTTP 200"
            - "data is an array of length >= 2"
            - "Response envelope contains pagination fields: limit, offset, total_count, has_more"

      - name: member_create_required_field_validation
        claim_type: required_fields
        grounds: [entities.Member.fields.student_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /chapters/{id}/members without required student_id returns 400 ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["Chapter ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Required High", charter_number: "NHS-104", advisor_user_id: "adv_104", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /chapters/${ch_id}/members"
              payload: { full_name: "No StudentID", email: "x@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: member_computed_fields_system_generated
        claim_type: computed_fields
        grounds: [entities.Member.fields.is_officer, entities.Member.fields.probation_strikes, entities.Member.fields.good_standing]
        distinguishing_aspect: "Computed fields (is_officer, probation_strikes, good_standing) are server-derived; client input for them is ignored"
        test_recipe:
          setup: ["Chapter ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Comp High", charter_number: "NHS-105", advisor_user_id: "adv_105", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "S2001", full_name: "Test", email: "t@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
              as: Advisor
              captures: { m_id: $.data.id, is_officer: $.data.is_officer, strikes: $.data.probation_strikes }
          assert:
            - "is_officer == false (server default)"
            - "probation_strikes == 0 (server default)"

      - name: cycle_invalid_enum_semester_rejected
        claim_type: type_constraints
        grounds: [entities.MembershipCycle.fields.semester, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST membership-cycles with semester='AUTUMN' (not in FALL|SPRING) returns 400"
        test_recipe:
          setup: ["Chapter ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Enum High", charter_number: "NHS-106", advisor_user_id: "adv_106", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
            - call: "POST /chapters/${ch_id}/activate"
              payload: {}
              as: ActivitiesDirector
          trigger:
            - call: "POST /chapters/${ch_id}/membership-cycles"
              payload: { cycle_label: "2026-AUTUMN", academic_year: "2026-2027", semester: "AUTUMN", nomination_open_date: "2026-08-01T00:00:00Z", nomination_close_date: "2026-08-15T00:00:00Z", induction_date: "2026-09-01T00:00:00Z" }
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 or 422"
            - "error_id in {ERR_INVALID_REQUEST, ERR_INVALID_FORMAT}"

  # ============================================================
  # Section: state_machines — invalid transitions, initial state, terminal lockdown
  # ============================================================
  - section: state_machines
    instances:
      - name: chapter_invalid_transition_draft_to_dissolved
        claim_type: invalid_transition
        grounds: [state_machines.Chapter, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Chapter cannot transition DRAFT -> DISSOLVED directly; must go through ACTIVE first"
        test_recipe:
          setup: ["Chapter in DRAFT (just created)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Draft High", charter_number: "NHS-107", advisor_user_id: "adv_107", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /chapters/${ch_id}/dissolve"
              payload: {}
              as: ActivitiesDirector
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

      - name: service_hour_entry_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ServiceHourEntry]
        distinguishing_aspect: "Once ServiceHourEntry is REJECTED (terminal), no further transitions are possible"
        test_recipe:
          setup: ["Chapter ACTIVE; Member ACTIVE; entry PENDING_VERIFICATION then REJECTED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Term High", charter_number: "NHS-108", advisor_user_id: "adv_108", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
            - call: "POST /chapters/${ch_id}/activate"
              payload: {}
              as: ActivitiesDirector
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "S2101", full_name: "T", email: "t@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
              as: Advisor
              captures: { m_id: $.data.id }
            - call: "POST /chapters/${ch_id}/members/${m_id}/service-hour-entries"
              payload: { activity_name: "X", service_date: "2026-08-02T00:00:00Z", hours: 2.0, organization: "Y", supervisor_email: "s@x.org" }
              as: Advisor
              captures: { she_id: $.data.id }
            - call: "POST /chapters/${ch_id}/members/${m_id}/service-hour-entries/${she_id}/reject"
              payload: { rejection_reason: "No supervisor confirmation" }
              as: Advisor
          trigger:
            - call: "POST /chapters/${ch_id}/members/${m_id}/service-hour-entries/${she_id}/verify"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE (REJECTED is terminal; verify not allowed)"

      - name: cycle_initial_state_is_planned
        claim_type: initial_state
        grounds: [state_machines.MembershipCycle]
        distinguishing_aspect: "Newly created MembershipCycle starts in PLANNED"
        test_recipe:
          setup: ["Chapter ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Init Cycle High", charter_number: "NHS-109", advisor_user_id: "adv_109", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
            - call: "POST /chapters/${ch_id}/activate"
              payload: {}
              as: ActivitiesDirector
          trigger:
            - call: "POST /chapters/${ch_id}/membership-cycles"
              payload: { cycle_label: "2026-FALL", academic_year: "2026-2027", semester: "FALL", nomination_open_date: "2026-08-01T00:00:00Z", nomination_close_date: "2026-08-15T00:00:00Z", induction_date: "2026-09-01T00:00:00Z" }
              as: Advisor
              captures: { cy_id: $.data.id, status: $.data.status }
          assert:
            - "HTTP 201"
            - "status == PLANNED"

      - name: election_idempotency_double_open_rejected
        claim_type: idempotency
        grounds: [state_machines.OfficerElection.DRAFT_to_OPEN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Second open on already-OPEN election is rejected"
        test_recipe:
          setup: ["Chapter ACTIVE; cycle INDUCTED; election DRAFT then OPEN"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Idem High", charter_number: "NHS-110", advisor_user_id: "adv_110", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
            - call: "POST /chapters/${ch_id}/activate"
              payload: {}
              as: ActivitiesDirector
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "S2201", full_name: "I", email: "i@x.com", grade_level: 12, weighted_gpa: 4.80, unweighted_gpa: 4.00 }
              as: Advisor
              captures: { m_id: $.data.id }
            - call: "POST /chapters/${ch_id}/membership-cycles"
              payload: { cycle_label: "2026-FALL", academic_year: "2026-2027", semester: "FALL", nomination_open_date: "2026-08-01T00:00:00Z", nomination_close_date: "2026-08-15T00:00:00Z", induction_date: "2026-09-01T00:00:00Z" }
              as: Advisor
              captures: { cy_id: $.data.id }
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/open-nominations"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/members/${m_id}/nominate"
              payload: {}
              as: Advisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/close-nominations"
              payload: {}
              as: Advisor
            - call: "GET /chapters/${ch_id}/membership-cycles/${cy_id}/applications"
              payload: {}
              as: Advisor
              captures: { app_id: '$.data[0].id' }
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/applications/${app_id}/approve"
              payload: {}
              as: Advisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: ActivitiesDirector
            - call: "GET /chapters/${ch_id}/membership-cycles/${cy_id}"
              payload: {}
              as: Advisor
              captures: { cy_v: $.data.version }
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/induct"
              payload: { expected_cycle_version: "${cy_v}" }
              as: Advisor
            - call: "POST /chapters/${ch_id}/elections"
              payload: { cycle_id: "${cy_id}", office: "PRESIDENT" }
              as: Advisor
              captures: { el_id: $.data.id }
            - call: "POST /chapters/${ch_id}/elections/${el_id}/open"
              payload: {}
              as: Advisor
          trigger:
            - call: "POST /chapters/${ch_id}/elections/${el_id}/open"
              payload: {}
              as: Advisor
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == ERR_INVALID_STATE"

  # ============================================================
  # Section: calculations — correct results, precision, constants
  # ============================================================
  - section: calculations
    instances:
      - name: election_tally_correct_counting
        claim_type: correct_result
        grounds: [calculations.election_tally]
        distinguishing_aspect: "Tally with 3 CAST votes for A, 2 for B, 1 for C -> winner=A, runoff=false"
        test_recipe:
          setup: ["Election OPEN with 3 candidates and 6 votes"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Tally High", charter_number: "NHS-111", advisor_user_id: "adv_111", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
            - call: "POST /chapters/${ch_id}/activate"
              payload: {}
              as: ActivitiesDirector
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "SA", full_name: "A", email: "a@x.com", grade_level: 12, weighted_gpa: 4.80, unweighted_gpa: 4.00 }
              as: Advisor
              captures: { ma_id: $.data.id }
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "SB", full_name: "B", email: "b@x.com", grade_level: 12, weighted_gpa: 4.80, unweighted_gpa: 4.00 }
              as: Advisor
              captures: { mb_id: $.data.id }
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "SC", full_name: "C", email: "c@x.com", grade_level: 12, weighted_gpa: 4.80, unweighted_gpa: 4.00 }
              as: Advisor
              captures: { mc_id: $.data.id }
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "SV1", full_name: "V1", email: "v1@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
              as: Advisor
              captures: { mv1: $.data.id }
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "SV2", full_name: "V2", email: "v2@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
              as: Advisor
              captures: { mv2: $.data.id }
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "SV3", full_name: "V3", email: "v3@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
              as: Advisor
              captures: { mv3: $.data.id }
            - call: "POST /chapters/${ch_id}/membership-cycles"
              payload: { cycle_label: "2026-FALL", academic_year: "2026-2027", semester: "FALL", nomination_open_date: "2026-08-01T00:00:00Z", nomination_close_date: "2026-08-15T00:00:00Z", induction_date: "2026-09-01T00:00:00Z" }
              as: Advisor
              captures: { cy_id: $.data.id }
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/open-nominations"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/members/${ma_id}/nominate"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/members/${mb_id}/nominate"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/members/${mc_id}/nominate"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/members/${mv1}/nominate"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/members/${mv2}/nominate"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/members/${mv3}/nominate"
              payload: {}
              as: Advisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/close-nominations"
              payload: {}
              as: Advisor
            - call: "GET /chapters/${ch_id}/membership-cycles/${cy_id}/applications"
              payload: {}
              as: Advisor
              captures: { a1: '$.data[0].id', a2: '$.data[1].id', a3: '$.data[2].id', a4: '$.data[3].id', a5: '$.data[4].id', a6: '$.data[5].id' }
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/applications/${a1}/approve"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/applications/${a2}/approve"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/applications/${a3}/approve"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/applications/${a4}/approve"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/applications/${a5}/approve"
              payload: {}
              as: Advisor
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/applications/${a6}/approve"
              payload: {}
              as: Advisor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T12:00:00Z" }
              as: ActivitiesDirector
            - call: "GET /chapters/${ch_id}/membership-cycles/${cy_id}"
              payload: {}
              as: Advisor
              captures: { cy_v: $.data.version }
            - call: "POST /chapters/${ch_id}/membership-cycles/${cy_id}/induct"
              payload: { expected_cycle_version: "${cy_v}" }
              as: Advisor
            - call: "POST /chapters/${ch_id}/elections"
              payload: { cycle_id: "${cy_id}", office: "PRESIDENT" }
              as: Advisor
              captures: { el_id: $.data.id }
            - call: "POST /chapters/${ch_id}/elections/${el_id}/open"
              payload: {}
