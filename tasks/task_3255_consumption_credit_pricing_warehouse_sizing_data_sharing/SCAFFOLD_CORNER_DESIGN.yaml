              as: DataEngineer
              captures: { repl_cwd: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /v1/warehouses/${wh_cwd}/resume"
              payload: {}
              as: DataEngineer
            - call: "POST /v1/warehouse-sessions"
              payload: { warehouse_id: "${wh_cwd}" }
              as: DataEngineer
              captures: { ses_cwd: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:15:00Z" }
              as: PlatformOperator
            - call: "GET /v1/warehouses/${wh_cwd}"
              payload: {}
              as: DataEngineer
              captures: { wh_cwd_v: $.data.version }
            - call: "POST /v1/warehouse-sessions/${ses_cwd}/close"
              payload: { expected_warehouse_version: "${wh_cwd_v}" }
              as: DataEngineer
            - call: "GET /v1/resource-monitors/${mon_cwd}"
              payload: {}
              as: FinanceController
              captures: { used_before: $.data.used_pct }
            - call: "POST /v1/replication-configurations/${repl_cwd}/refresh"
              payload: {}
              as: DataEngineer
          trigger:
            - call: "GET /v1/resource-monitors/${mon_cwd}"
              payload: {}
              as: FinanceController
              captures: { used_after: $.data.used_pct }
          assert:
            - "${used_before} == 0.4"
            - "${used_after} == 0.4"
            - "ResourceMonitor.${mon_cwd}.interval_consumption_credits == 4.0 after the refresh, so the REPLICATION row of 33.41 dollars moved nothing"
            - "Account.${acct_cwd}.posted_consumption_credits_reconciled == 4.0"
      - name: monitor_threshold_exact_boundary_values
        claim_type: Precision
        grounds:
