            - { call: "POST /fleetcare/renewal-quotes/${quote_id}/decline", payload: { reason: "not our contract" }, as: ClubManager, as_user_id: "${club_b}", captures: { scope_quote: "$.data.error_id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_NOISE" }, as: ClubManager, as_user_id: "${club_a}", captures: { ok_call: "$.data.id", ok_status: "$.data.status" } }
            - { call: "GET /fleetcare/contracts/${c_id}/credit-summary", as: ClubManager, as_user_id: "${club_a}", captures: { ok_cap: "$.data.credit_cap_cents" } }
          assert:
