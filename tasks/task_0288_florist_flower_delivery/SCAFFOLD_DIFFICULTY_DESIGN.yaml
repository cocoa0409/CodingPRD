scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (>=2, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_estimate_vs_final_diverge_on_wire_and_subs
        grounds:
          - calculations.compute_quote_estimate
          - calculations.compute_final_total
          - entities.Order.fields.estimated_total_cents
          - entities.Order.fields.final_total_cents
        distinguishing_aspect: |
          The quote-time estimate on the Order EXCLUDES florist wire_surcharge_cents and
          substitution deltas while the fulfillment-time final on the SAME Order INCLUDES
          both, so estimated_total_cents (14300) != final_total_cents (16000) for identical inputs.
        test_recipe:
          setup:
            - "Clock 2026-02-10T08:00:00Z. PREMIUM arrangement base=10000, substitution_policy=FLORIST_CHOICE cap=0.15."
            - "Holiday window 2026-02-14..2026-02-14 surge 1.5, applies_to_standard=false, surge_cutoff_hour 20."
            - "GOLD customer (loyalty 0.10). Zone fee 800, window cap 5. Florist wire_surcharge 500, daily_capacity 5."
            - "Order delivery_date 2026-02-14; quoted, authorized, booked, florist accepted; one accepted FLORIST_CHOICE sub +1200."
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "Z1", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "A-PREM", display_name: "Lux Roses", base_price_cents: 10000, premium_tier: "PREMIUM", substitution_policy: "FLORIST_CHOICE", substitution_cap_pct: 0.15 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/holiday-windows"
              payload: { name: "Valentines", start_date: "2026-02-14", end_date: "2026-02-14", surge_multiplier: 1.5, applies_to_standard: false, surge_cutoff_hour_utc: 20 }
              as: CatalogAdmin
            - call: "POST /floral/customers"
              payload: { email: "g@x.com", full_name: "Gold C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
              payload: { shop_name: "Shop A", covered_zone_id: "${zone_id}", daily_capacity: 5, quality_rating: 4.5, wire_surcharge_cents: 500 }
              as: Dispatcher
              captures: { flor_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", occasion: "ROMANCE", card_message: "Happy V-Day", delivery_date: "2026-02-14", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { ord_v_auth: $.data.version }
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v_auth}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wf_id: $.data.id }
            - call: "GET /floral/orders/${ord_id}/wire-fulfillments"
              payload: {}
              as: Dispatcher
              captures: { wf_real_id: "$.data[0].id" }
            - call: "POST /floral/wire-fulfillments/${wf_real_id}/accept"
              payload: {}
              as: Dispatcher
            - call: "POST /floral/substitutions"
              payload: { order_id: "${ord_id}", florist_id: "${flor_id}", removed_stem: "carnation", added_stem: "peony", price_delta_cents: 1200 }
              as: Florist
              as_user_id: "${flor_id}"
          trigger:
            - call: "POST /floral/orders/${ord_id}/dispatch"
              payload: {}
              as: Florist
              as_user_id: "${flor_id}"
              captures: { final: $.data.final_total_cents, est: $.data.estimated_total_cents }
          assert:
            - "Order.${ord_id}.estimated_total_cents == 14300"
            - "Order.${ord_id}.final_total_cents == 16000"
            - "Order.${ord_id}.final_total_cents != Order.${ord_id}.estimated_total_cents"

      - name: claim_refund_vs_loyalty_promotion_distinct_subjects
        grounds:
          - calculations.compute_claim_refund
          - calculations.promote_loyalty_tier
          - entities.QualityClaim.fields.refund_cents
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: |
          One dual-variant calc scores a REFUND on the QualityClaim domain (reason-weighted
          fraction with floor/cap), the other is a threshold promotion on the Customer domain
          (delivered-count tiers); they operate on different entity domains, not the same metric.
        test_recipe:
          setup:
            - "A DELIVERED order with final_total_cents=5800 (base 5000 STANDARD no surge, delivery 800)."
            - "Customer has exactly 1 delivered order so loyalty stays STANDARD."
            - "An OPEN QualityClaim reason=DAMAGED remedy=REFUND on that order."
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "Z2", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "A-STD", display_name: "Daisy Bunch", base_price_cents: 5000, premium_tier: "STANDARD", substitution_policy: "NONE" }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "s@x.com", full_name: "Std C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
              payload: { shop_name: "Shop B", covered_zone_id: "${zone_id}", daily_capacity: 5, quality_rating: 4.0, wire_surcharge_cents: 0 }
              as: Dispatcher
              captures: { flor_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-03-05", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { ord_v_auth: $.data.version }
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v_auth}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /floral/orders/${ord_id}/wire-fulfillments"
              payload: {}
              as: Dispatcher
              captures: { wf_real_id: "$.data[0].id" }
            - call: "POST /floral/wire-fulfillments/${wf_real_id}/accept"
              payload: {}
              as: Dispatcher
            - call: "POST /floral/orders/${ord_id}/dispatch"
              payload: {}
              as: Florist
              as_user_id: "${flor_id}"
            - call: "POST /floral/orders/${ord_id}/confirm-delivery"
              payload: {}
              as: Florist
              as_user_id: "${flor_id}"
            - call: "POST /floral/claims"
              payload: { order_id: "${ord_id}", customer_id: "${cust_id}", reason: "DAMAGED", requested_remedy: "REFUND" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /floral/claims/${claim_id}/approve"
              payload: {}
              as: Dispatcher
              captures: { refund: $.data.refund_cents }
          assert:
            - "QualityClaim.${claim_id}.refund_cents == 4350"
            - "Customer.${cust_id}.loyalty_tier == STANDARD"
            - "Customer.${cust_id}.lifetime_delivered_count == 1"

  # =========================================================================
  # Rule 2 — combinatorial_formula (>=2, DIFFERENT modes from {a,b,c})
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: estimate_pinned_eval_order_surge_then_discount_then_delivery
        grounds:
          - calculations.compute_quote_estimate
          - entities.HolidayWindow.fields.surge_multiplier
          - entities.Customer.fields.loyalty_tier
        distinguishing_aspect: |
          MODE (c): a circular-looking dependency pinned to one order — surge applies to base
          BEFORE discount, discount applies to the surged subtotal, delivery is added AFTER
          discount (un-surged, un-discounted), wallet credit applied LAST; reordering any step
          changes the cents, so the scaffold fixes the order and the literal 14300 proves it.
        test_recipe:
          setup:
            - "Same GOLD/PREMIUM/Valentines config as rule1 inst1 up to the quote."
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "Z3", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "A-P2", display_name: "Lux2", base_price_cents: 10000, premium_tier: "PREMIUM", substitution_policy: "SAME_VALUE" }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/holiday-windows"
              payload: { name: "Vday2", start_date: "2026-02-14", end_date: "2026-02-14", surge_multiplier: 1.5, applies_to_standard: false, surge_cutoff_hour_utc: 20 }
              as: CatalogAdmin
            - call: "POST /floral/customers"
              payload: { email: "g2@x.com", full_name: "Gold2" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-02-14", window_start_minute: 540, window_end_minute: 720 }
              as: Dispatcher
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Dispatcher
              captures: { est: $.data.estimated_total_cents }
          assert:
            - "Order.${ord_id}.estimated_total_cents == 15800"
            - "Order.${ord_id}.is_same_day == false"

      - name: discount_stacking_additive_then_clamped_min_max
        grounds:
          - calculations.compute_quote_estimate
          - entities.RecurringSchedule.fields.recurring_discount_pct
          - calculations.compute_quote_estimate.constants
        distinguishing_aspect: |
          MODE (a): a >=3-input non-linear formula — loyalty_pct + recurring_pct are summed
          then clamped by min(.,0.30); GOLD(0.10)+recurring(0.25)=0.35 clamps to 0.30, so the
          nested min interacts non-linearly with both inputs and the cap constant.
        test_recipe:
          setup:
            - "GOLD customer; recurring schedule discount 0.25; base 8000 no surge, delivery 600."
            - "Order emitted by the schedule so parent_recurrence_id set; combined discount clamps to 0.30."
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "Z4", base_delivery_fee_cents: 600, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "A-R", display_name: "Recur Mix", base_price_cents: 8000, premium_tier: "STANDARD", substitution_policy: "SAME_VALUE" }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "gr@x.com", full_name: "GoldRecur" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/_inject/set_loyalty_tier"
              payload: { customer_id: "${cust_id}", loyalty_tier: "GOLD" }
              as: Dispatcher
            - call: "POST /floral/recurring-schedules"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", cadence: "MONTHLY", next_delivery_date: "2026-04-10", window_start_minute: 540, window_end_minute: 720, occurrences_remaining: 3, recurring_discount_pct: 0.25 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { sched_id: $.data.id }
            - call: "POST /floral/recurring-schedules/${sched_id}/emit"
              payload: {}
              as: Dispatcher
            - call: "GET /floral/orders?parent_recurrence_id=${sched_id}"
              payload: {}
              as: Dispatcher
              captures: { ord_id: "$.data[0].id" }
          trigger:
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Dispatcher
              captures: { est: $.data.estimated_total_cents }
          assert:
            - "Order.${ord_id}.estimated_total_cents == 6200"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (>=2, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: order_parallel_payment_and_fulfillment_dimensions
        grounds:
          - state_machines.Order.QUOTED_to_BOOKED
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Parallel dimensions on ONE Order row: fulfillment_status advances DRAFT->QUOTED->BOOKED
          on customer triggers while payment_status advances UNPAID->AUTHORIZED independently; once
          booked the order holds fulfillment=BOOKED together with payment=AUTHORIZED.
        test_recipe:
          setup:
            - "Quoted+authorized+booked order; observe the two status fields are independently set."
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "Z5", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "A5", display_name: "Bouquet5", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "p@x.com", full_name: "Par C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
              payload: { shop_name: "Shop5", covered_zone_id: "${zone_id}", daily_capacity: 5 }
              as: Dispatcher
              captures: { flor_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-05-05", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { ord_v_auth: $.data.version }
          trigger:
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v_auth}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { fs: $.data.fulfillment_status, ps: $.data.payment_status }
          assert:
            - "Order.${ord_id}.fulfillment_status == BOOKED"
            - "Order.${ord_id}.payment_status == AUTHORIZED"

      - name: claim_branch_then_redelivery_cycles_new_order
        grounds:
          - state_machines.QualityClaim.OPEN_to_APPROVED
          - state_machines.QualityClaim.APPROVED_to_RESOLVED
          - entities.QualityClaim.fields.redelivery_order_id
        distinguishing_aspect: |
          QualityClaim is branching (OPEN->{APPROVED,REJECTED}) AND cyclic — an APPROVED+REDELIVERY
          resolve spawns a new Order that re-enters the Order pipeline at DRAFT, looping the
          workflow back; this non-linear machine lives on QualityClaim, a different entity than Order.
        test_recipe:
          setup:
            - "A DELIVERED order; OPEN claim reason=WILTED remedy=REDELIVERY approved."
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "Z6", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "A6", display_name: "Bouquet6", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "rd@x.com", full_name: "Redel C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
              payload: { shop_name: "Shop6", covered_zone_id: "${zone_id}", daily_capacity: 5 }
              as: Dispatcher
              captures: { flor_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", card_message: "Get well", delivery_date: "2026-05-15", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { ord_v_auth: $.data.version }
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v_auth}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /floral/orders/${ord_id}/wire-fulfillments"
              payload: {}
              as: Dispatcher
              captures: { wf_real_id: "$.data[0].id" }
            - call: "POST /floral/wire-fulfillments/${wf_real_id}/accept"
              payload: {}
              as: Dispatcher
            - call: "POST /floral/orders/${ord_id}/dispatch"
              payload: {}
              as: Florist
              as_user_id: "${flor_id}"
            - call: "POST /floral/orders/${ord_id}/confirm-delivery"
              payload: {}
              as: Florist
              as_user_id: "${flor_id}"
            - call: "POST /floral/claims"
              payload: { order_id: "${ord_id}", customer_id: "${cust_id}", reason: "WILTED", requested_remedy: "REDELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /floral/claims/${claim_id}/approve"
              payload: {}
              as: Dispatcher
            - call: "GET /floral/orders/${ord_id}"
              payload: {}
              as: Dispatcher
              captures: { ord_v_now: $.data.version }
          trigger:
            - call: "POST /floral/claims/${claim_id}/resolve"
              payload: { expected_order_version: "${ord_v_now}" }
              as: Dispatcher
              captures: { redel_oid: $.data.redelivery_order_id }
          assert:
            - "QualityClaim.${claim_id}.status == RESOLVED"
            - "QualityClaim.${claim_id}.redelivery_order_id is not null"
            - "Order.${redel_oid}.source_order_id == ${ord_id}"
            - "Order.${redel_oid}.fulfillment_status == DRAFT"

  # =========================================================================
  # Rule 4 — transitive_cascade (>=2; one depth>=3, one depth>=2; diff triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_booked_cascades_slot_then_fulfillment_then_florist_load
        grounds:
          - state_machines.Order.BOOKED_to_CANCELLED
          - state_machines.WireFulfillment.ASSIGNED_to_RELEASED
          - entities.DeliverySlot.fields.released
          - entities.WireFulfillment.fields.status
        distinguishing_aspect: |
          Depth-3 chain from ONE trigger (cancel a BOOKED order): cancel -> releases the
          DeliverySlot -> releasing leads to RELEASE of the WireFulfillment -> the WireFulfillment
          release decrements the chosen Florist's daily load; each link is caused by the prior link.
        test_recipe:
          setup:
            - "A BOOKED order with a DeliverySlot and an ASSIGNED WireFulfillment consuming florist daily load."
          setup_api_calls:
            - call: "POST /floral/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Dispatcher
            - call: "POST /floral/zones"
              payload: { zone_code: "Z7", base_delivery_fee_cents: 800, same_day_cutoff_hour_utc: 14, window_capacity_per_slot: 5 }
              as: CatalogAdmin
              captures: { zone_id: $.data.id }
            - call: "POST /floral/arrangements"
              payload: { sku: "A7", display_name: "Bouquet7", base_price_cents: 5000 }
              as: CatalogAdmin
              captures: { arr_id: $.data.id }
            - call: "POST /floral/customers"
              payload: { email: "cx@x.com", full_name: "Cancel C" }
              as: CatalogAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /floral/florists"
              payload: { shop_name: "Shop7", covered_zone_id: "${zone_id}", daily_capacity: 1 }
              as: Dispatcher
              captures: { flor_id: $.data.id }
            - call: "POST /floral/orders"
              payload: { customer_id: "${cust_id}", arrangement_id: "${arr_id}", zone_id: "${zone_id}", delivery_date: "2026-06-05", window_start_minute: 540, window_end_minute: 720 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /floral/orders/${ord_id}/quote"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /floral/_payments/mark_authorized"
              payload: { order_id: "${ord_id}" }
              as: Dispatcher
              captures: { ord_v_auth: $.data.version }
            - call: "POST /floral/orders/${ord_id}/book"
              payload: { expected_order_version: "${ord_v_auth}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_v_book: $.data.version }
          trigger:
            - call: "POST /floral/orders/${ord_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "Order.${ord_id}.fulfillment_status == CANCELLED"
            - "DeliverySlot for ${ord_id}: released == true"
