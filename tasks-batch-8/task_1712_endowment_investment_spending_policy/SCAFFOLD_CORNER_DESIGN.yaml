            - { call: "POST /endowment/payouts", payload: { distribution_id: "${ag_d}", program_code: "LIB-2", program_purpose: RESEARCH, allocated_amount_cents: 200001 }, as: DevelopmentOfficer, captures: { ag_err: $.data.error_id } }
            - { call: "POST /endowment/payouts", payload: { distribution_id: "${ag_d}", program_code: "LIB-3", program_purpose: RESEARCH, allocated_amount_cents: 200000 }, as: DevelopmentOfficer, captures: { ag_p2: $.data.id } }
          assert:
