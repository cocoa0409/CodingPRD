  # ===========================================================================
  # From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:

      - name: precedence_rejects_auth_then_role_then_schema_then_path_then_body_ids
        claim_type: priority_ordering
        grounds:
          - validations[priority 1..5]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Each call violates two rules at once and the lower-priority one is never reported: headerless plus wrong body is 401, wrong role plus wrong body is 403, bad enum plus unknown floor plan is 400, unknown path id plus unknown body FK is the path 404."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; TOW kit reference data and one DRAFT order for dealer D-TOW."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-E1", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 20, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_e1_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-TOW", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { ord_id: $.data.id, ord_v: $.data.version }
          trigger:
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "NOT_A_TYPE", selected_option_ids: [], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: "(no X-User-ID and no X-User-Role header)"
              captures: { e1: $.data.error_id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "${fp_id}", order_type: "NOT_A_TYPE", selected_option_ids: [], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: QualityInspector
              as_user_id: "QI-1"
              captures: { e2: $.data.error_id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "11111111-1111-4111-8111-111111111111", order_type: "NOT_A_TYPE", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { e3: $.data.error_id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_id}", floor_plan_id: "11111111-1111-4111-8111-111111111111", order_type: "STOCK", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_id}"
              captures: { e4: $.data.error_id }
            - call: "POST /unit-orders/22222222-2222-4222-8222-222222222222/production-slots"
              payload: { line_id: "33333333-3333-4333-8333-333333333333", slot_date: "2026-08-05T00:00:00Z", expected_unit_order_version: "${ord_v}" }
              as: ProductionScheduler
              captures: { e5: $.data.error_id }
            - call: "POST /unit-orders/${ord_id}/production-slots"
              payload: { line_id: "33333333-3333-4333-8333-333333333333", slot_date: "2026-08-05T00:00:00Z", expected_unit_order_version: "${ord_v}" }
              as: ProductionScheduler
              captures: { e6: $.data.error_id }
          assert:
            - "e1 == ERR_UNAUTHENTICATED with status 401 — priority 1 outranks the undeclared order_type in the same body"
            - "e2 == ERR_ROLE_NOT_PERMITTED with status 403 — priority 2 outranks the same schema fault, so a wrong-role caller never learns the body is malformed"
            - "e3 == ERR_INVALID_REQUEST with status 400 — priority 3 outranks the non-existent floor_plan_id"
            - "e4 == ERR_FLOOR_PLAN_NOT_FOUND with status 404 once the schema is clean"
            - "e5 == ERR_UNIT_ORDER_NOT_FOUND with status 404 — the path id (priority 4) is resolved before the body line_id (priority 5)"
            - "e6 == ERR_PRODUCTION_LINE_NOT_FOUND with status 404, not ERR_ORDER_NOT_SLOTTABLE: body existence at priority 5 outranks the DRAFT state gate at priority 7"
            - "UnitOrder.${ord_id} is still DRAFT at version 1 and no ProductionSlot exists for it"

      - name: dealer_scope_is_checked_after_existence_and_forbidden_across_dealers
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 6]
          - errors.ERR_DEALER_SCOPE_VIOLATION
        distinguishing_aspect: "Ownership is a cross-entity check between X-User-ID and UnitOrder.dealer_id, and it sits below existence: dealer B probing an id that does not exist gets 404, probing dealer A's real order gets 403, and its own order succeeds."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; TOW kit with two dealers D-A and D-B; one DRAFT order owned by D-A."
          setup_api_calls:
            - call: "POST /floor-plans"
              payload: { model_code: "FP-TOW", chassis_class: "TOWABLE", length_ft: 28, base_msrp_cents: 8000000, base_station_hours: 40.00, base_dry_weight_lbs: 6000, gvwr_lbs: 9000, required_wheelbase_in: 180, electrical_service_amps: 50, fresh_water_capacity_gal: 60 }
              as: PlantAdmin
              captures: { fp_id: $.data.id }
            - call: "POST /option-items"
              payload: { option_code: "OPT-E1", category: "ELECTRICAL", install_station: "ROUGH_IN", price_cents: 100000, weight_lbs: 0, added_station_hours: 1.00, amp_draw: 20, water_demand_gal: 0 }
              as: PlantAdmin
              captures: { opt_e1_id: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-A", region: "CENTRAL", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_a: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-B", region: "EAST", allocation_share_bp: 1500, floor_plan_credit_limit_cents: 100000000, goodwill_budget_cents: 500000 }
              as: PlantAdmin
              captures: { dlr_b: $.data.id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_a}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_a}"
              captures: { ord_a: $.data.id }
          trigger:
            - call: "GET /unit-orders/44444444-4444-4444-8444-444444444444"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_b}"
              captures: { e_nf: $.data.error_id }
            - call: "GET /unit-orders/${ord_a}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_b}"
              captures: { e_scope: $.data.error_id }
            - call: "POST /unit-orders/${ord_a}/submit"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_b}"
              captures: { e_scope_write: $.data.error_id }
            - call: "POST /unit-orders"
              payload: { dealer_id: "${dlr_a}", floor_plan_id: "${fp_id}", order_type: "STOCK", selected_option_ids: ["${opt_e1_id}"], requested_delivery_date: "2026-10-01T00:00:00Z" }
              as: DealerPrincipal
              as_user_id: "${dlr_b}"
              captures: { e_scope_body: $.data.error_id }
            - call: "GET /unit-orders/${ord_a}"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr_a}"
              captures: { own_status: $.data.status }
          assert:
            - "e_nf == ERR_UNIT_ORDER_NOT_FOUND with status 404 — existence at priority 4 precedes ownership at priority 6, so the id space is not leaked"
            - "e_scope == ERR_DEALER_SCOPE_VIOLATION with status 403 on the read"
            - "e_scope_write == ERR_DEALER_SCOPE_VIOLATION with status 403 and UnitOrder.${ord_a}.status is still DRAFT at version 1"
            - "e_scope_body == ERR_DEALER_SCOPE_VIOLATION — supplying a body dealer_id other than X-User-ID is the same violation as addressing a foreign row"
            - "own_status == DRAFT: the identical read by the owning principal succeeds"

      - name: physical_band_rejects_weight_before_amps_before_water
        claim_type: priority_ordering
        grounds:
          - validations[priority 10]
          - validations[priority 11]
          - validations[priority 12]
        distinguishing_aspect: "The three physical ceilings are separate priorities, so an order that breaks all three reports only the weight; each ceiling is inclusive, so exactly 50 A and exactly 30 gal (5000 bp of a 60 gal tank) both pass."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; FP-TOW (gvwr 9000, dry 6000, 50 A, 60 gal so the water ceiling is 30)."
