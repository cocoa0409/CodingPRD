# =============================================================================
# Hospital Surgery Scheduling — Test Targeting Index (§1.8)
#
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules
# in the scaffold-generator skill (§0.5). Every grounds[] entry MUST resolve
# to a declared element in SCAFFOLD.yaml. Every numeric literal in an assert
# was computed from the relevant formula and constants.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_estimate_vs_final_on_settlement
        grounds:
          - calculations.provisional_cost_estimate
          - calculations.final_settlement_cost
          - state_machines.SurgicalCase.APPROVED_to_SCHEDULED
          - state_machines.SurgicalCase.IN_PROGRESS_to_COMPLETED
          - entities.Settlement.fields.estimated_total_amount
          - entities.Settlement.fields.final_total_amount
        distinguishing_aspect: |
          provisional_cost_estimate uses planned_end_minute - planned_start_minute (forward-looking) and final_settlement_cost uses actual_end_minute - actual_start_minute (chronological); when actual interval ≠ planned interval, the SAME Settlement carries two different totals — this dual-variant is on the Settlement entity (cost domain).
        test_recipe:
          setup:
            - "Create OperatingRoom R: room_type=GENERAL_OR, hourly_rate=500.00, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A: staff_role=ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200.00, shift_start_minute=0, shift_end_minute=1440"
            - "Create StaffMember B: staff_role=SCRUB_NURSE, qualifications=[GENERAL], hourly_rate=80.00, shift_start_minute=0, shift_end_minute=1440"
            - "Create InstrumentSet I: specialty=GENERAL"
            - "POST /instrument-sets/{I}/start-sterilization, then /complete-sterilization at current_minute=0 (last_sterilized_at_minute=0, sterilization_status=CLEAN_STERILIZED)"
            - "Create SurgicalCase C: specialty_required=GENERAL, pre_op_assessment_attached=true, informed_consent_verified=true, implant_cost_estimate=0.00"
          trigger:
            - "POST /surgical-cases/{C}/approve"
            - "POST /surgical-cases/{C}/schedule with scheduled_room_id=R, planned_start_minute=0, planned_end_minute=60, staff_assignments=[{A,LEAD_ANESTHESIOLOGIST},{B,SCRUB_NURSE}], instrument_set_id=I"
            - "POST /surgical-cases/{C}/assignments/{*}/confirm for both assignments"
            - "POST /surgical-cases/{C}/start"
            - "POST /_clock/advance with delta_minutes=90 (current_minute -> 90)"
            - "POST /surgical-cases/{C}/complete"
          assert:
            - "Settlement(case_id=C).estimated_total_amount == 930.00  # 500 + 200 + 80 + 150 + 0"
            - "Settlement(case_id=C).final_total_amount == 1710.00     # 1000 + 400 + 160 + 150 + 0"
            - "Settlement(case_id=C).estimated_total_amount != Settlement(case_id=C).final_total_amount"

      - name: staff_workload_planned_vs_actual_on_staff
        grounds:
          - calculations.staff_workload_planned
          - calculations.staff_workload_actual
          - entities.StaffMember.fields.planned_workload_minutes
          - entities.StaffMember.fields.actual_workload_minutes
        distinguishing_aspect: |
          staff_workload_planned counts CaseAssignments in {RESERVED, CONFIRMED, COMPLETED} with their planned interval, while staff_workload_actual counts only COMPLETED assignments using their owning case's actual interval; same staff member, same set of assignments on disk, two different totals — this dual-variant is on the StaffMember entity (workload-minutes domain), distinct from the Settlement cost-domain instance above.
        test_recipe:
          setup:
            - "Create OperatingRoom R: GENERAL_OR, hourly_rate=500.00, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A: ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200.00, shift 0..1440"
            - "Create InstrumentSet I1, I2: specialty=GENERAL; sterilize both at current_minute=0"
            - "Create SurgicalCase C1 (GENERAL, pre_op=true, consent=true) and SurgicalCase C2 (GENERAL, pre_op=true, consent=true)"
            - "Approve, schedule, confirm, start, advance clock to 90, complete C1: planned 0..60 in R with [A LEAD_ANESTHESIOLOGIST], I1; actual_start=0, actual_end=90"
            - "Approve and schedule (do NOT start) C2: planned 100..200 in R with [A LEAD_ANESTHESIOLOGIST], I2 (RESERVED at this point)"
          trigger:
            - "GET /staff/{A}"
          assert:
            - "StaffMember(A).planned_workload_minutes == 160  # 60 (C1 COMPLETED, planned interval 0..60) + 100 (C2 RESERVED, 100..200)"
            - "StaffMember(A).actual_workload_minutes == 90   # only C1 COMPLETED, using actual interval 0..90"
            - "StaffMember(A).planned_workload_minutes != StaffMember(A).actual_workload_minutes"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: provisional_cost_tiered_rate_selection_mode_a
        grounds:
          - calculations.provisional_cost_estimate
          - entities.OperatingRoom.fields.hourly_rate
          - entities.OperatingRoom.fields.room_type
          - entities.StaffMember.fields.hourly_rate
          - entities.StaffMember.fields.staff_role
          - entities.SurgicalCase.fields.implant_cost_estimate
        distinguishing_aspect: |
          provisional_cost_estimate combines four input categories (room rate selected by room_type tier, staff rate selected by staff_role tier, fixed instrument fee, implant cost) with a non-linear ceil(planned_duration_minutes/60) hour-step, then per-component round_half_up before summation — this is mode (a) of Rule 2 (≥3 inputs with tiered-rate selection and conditional hour-step).
        test_recipe:
          setup:
            - "Create OperatingRoom R: room_type=CARDIAC_OR, hourly_rate=1000.00, turnover_buffer_minutes=30, specialty_required=CARDIAC"
            - "Create StaffMember A: ANESTHESIOLOGIST, qualifications=[CARDIAC], hourly_rate=200.00, shift 0..1440"
            - "Create StaffMember S: SCRUB_NURSE, qualifications=[CARDIAC], hourly_rate=80.00, shift 0..1440"
            - "Create StaffMember CN: CIRCULATING_NURSE, qualifications=[CARDIAC], hourly_rate=70.00, shift 0..1440"
            - "Create InstrumentSet I: specialty=CARDIAC; sterilize at current_minute=0"
            - "Create SurgicalCase C: specialty_required=CARDIAC, pre_op_assessment_attached=true, informed_consent_verified=true, implant_cost_estimate=5000.00"
          trigger:
            - "POST /surgical-cases/{C}/approve"
            - "POST /surgical-cases/{C}/schedule with scheduled_room_id=R, planned_start_minute=0, planned_end_minute=180, staff_assignments=[{A,LEAD_ANESTHESIOLOGIST},{S,SCRUB_NURSE},{CN,CIRCULATING_NURSE}], instrument_set_id=I"
          assert:
            - "Settlement(case_id=C).estimated_total_amount == 9200.00  # billable_hours=ceil(180/60)=3; room=3000.00, anesth=600.00, scrub=240.00, circ=210.00, instrument=150.00, implant=5000.00; sum of rounded components"

      - name: insurance_split_rounding_order_mode_b
        grounds:
          - calculations.insurance_split_calculation
          - state_machines.Settlement.PRE_AUTHORIZED_to_ITEMIZED
          - entities.Settlement.fields.insurance_split
          - entities.Settlement.fields.per_payer_amounts
        distinguishing_aspect: |
          insurance_split_calculation pins per-payer round_half_up FIRST then sum, with the primary payer (index 0) absorbing the whole rounding remainder; "round-then-sum" vs "sum-then-round" produce different per-payer cents, and the scaffold pins the order — this is mode (b) of Rule 2 (nested rounding where order matters), distinct from the tiered-selection mode of the previous instance.
        test_recipe:
          setup:
            - "Set up a single-staff GENERAL case D so its final_total_amount lands at 500.05: OperatingRoom R hourly_rate=200.00, StaffMember A ANESTHESIOLOGIST hourly_rate=150.05 with qualifications=[GENERAL] and shift 0..1440, InstrumentSet I (GENERAL, sterilized at 0), SurgicalCase D specialty=GENERAL, planned_start=0, planned_end=60, implant_cost_estimate=0.00, implant_cost_actual=0.00, pre_op=true, consent=true"
            - "Approve, schedule (R, [A LEAD_ANESTHESIOLOGIST], I, planned 0..60), confirm, start, complete D without advancing the clock so actual_end == planned_end == 60 → billable_hours_actual=1, final_total_amount = round(200.00,2) + round(150.05,2) + round(150.00,2) + round(0.00,2) = 500.05"
          trigger:
            - "POST /settlements/{Settlement(case_id=D).id}/pre-authorize with insurance_pre_auth_reference='AUTH-1'"
            - "POST /settlements/{Settlement(case_id=D).id}/itemize with insurance_split=[{payer_id:'PAYER_A', percentage:50},{payer_id:'PAYER_B', percentage:50}]"
          assert:
            - "Settlement(case_id=D).final_total_amount == 500.05"
            - "Settlement(case_id=D).per_payer_amounts[0] == {payer_id:'PAYER_A', amount:250.02}  # round(250.025)=250.03; sum=500.06; remainder=-0.01 absorbed by primary -> 250.02"
            - "Settlement(case_id=D).per_payer_amounts[1] == {payer_id:'PAYER_B', amount:250.03}"
            - "sum(p.amount for p in Settlement(case_id=D).per_payer_amounts) == 500.05"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: surgical_case_branching_at_requested
        grounds:
          - state_machines.SurgicalCase.REQUESTED_to_APPROVED
          - state_machines.SurgicalCase.REQUESTED_to_REJECTED
          - state_machines.SurgicalCase.APPROVED_to_SCHEDULED
          - state_machines.SurgicalCase.APPROVED_to_CANCELLED
          - state_machines.SurgicalCase.SCHEDULED_to_PREEMPTED
        distinguishing_aspect: |
          SurgicalCase exhibits fork-join branching at REQUESTED → {APPROVED, REJECTED} (different actors, different side-effects: APPROVED creates Settlement, REJECTED records rejected_reason) and again at SCHEDULED → {IN_PROGRESS, CANCELLED, PREEMPTED} with divergent cascade side-effects per branch — this is the branching-with-divergent-side-effects shape required by Rule 3.
        test_recipe:
          setup:
            - "Create SurgicalCase C1: specialty=GENERAL, pre_op_assessment_attached=true, informed_consent_verified=true"
            - "Create SurgicalCase C2: specialty=GENERAL, pre_op_assessment_attached=true, informed_consent_verified=true"
          trigger:
            - "POST /surgical-cases/{C1}/approve"
            - "POST /surgical-cases/{C2}/reject with rejected_reason='clinical contraindication'"
          assert:
            - "SurgicalCase(C1).status == 'APPROVED'"
            - "Settlement(case_id=C1).status == 'DRAFT'  # branch APPROVED creates Settlement"
            - "SurgicalCase(C2).status == 'REJECTED'"
            - "SurgicalCase(C2).rejected_reason == 'clinical contraindication'"
            - "no Settlement exists with case_id == C2  # branch REJECTED does NOT create Settlement"

      - name: instrument_set_cyclic_state_machine
        grounds:
          - state_machines.InstrumentSet.SOILED_to_IN_STERILIZATION
          - state_machines.InstrumentSet.IN_STERILIZATION_to_CLEAN_STERILIZED
          - state_machines.InstrumentSet.CLEAN_STERILIZED_to_CHECKED_OUT
          - state_machines.InstrumentSet.CHECKED_OUT_to_SOILED
        distinguishing_aspect: |
          InstrumentSet executes a four-state cycle SOILED → IN_STERILIZATION → CLEAN_STERILIZED → CHECKED_OUT → SOILED with cycle_count incrementing on each completion of sterilization; the same instrument set returns to a state it has already been in — this is the cyclic shape required by Rule 3, on a DIFFERENT entity from the SurgicalCase branching machine above.
        test_recipe:
          setup:
            - "Create OperatingRoom R: GENERAL_OR, hourly_rate=500.00, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A: ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200.00, shift 0..1440"
            - "Create InstrumentSet I: specialty=GENERAL (initial state SOILED, cycle_count=0)"
          trigger:
            - "POST /instrument-sets/{I}/start-sterilization  # SOILED -> IN_STERILIZATION"
            - "POST /instrument-sets/{I}/complete-sterilization  # IN_STERILIZATION -> CLEAN_STERILIZED, cycle_count=1, last_sterilized_at_minute=0"
            - "Create SurgicalCase C: specialty=GENERAL, pre_op=true, consent=true; approve; schedule with R, [A LEAD_ANESTHESIOLOGIST], I, planned 0..60  # CLEAN_STERILIZED -> CHECKED_OUT"
            - "Confirm assignment; start; complete  # CHECKED_OUT -> SOILED"
            - "POST /instrument-sets/{I}/start-sterilization  # SOILED -> IN_STERILIZATION (loop closed)"
          assert:
            - "After complete-sterilization: InstrumentSet(I).sterilization_status == 'CLEAN_STERILIZED' and InstrumentSet(I).cycle_count == 1"
            - "After scheduling C: InstrumentSet(I).sterilization_status == 'CHECKED_OUT' and InstrumentSet(I).current_case_id == C"
            - "After completing C: InstrumentSet(I).sterilization_status == 'SOILED' and InstrumentSet(I).current_case_id == null"
            - "After re-starting sterilization: InstrumentSet(I).sterilization_status == 'IN_STERILIZATION'  # cycle returned to a state previously occupied"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: emergency_preempt_cascade_depth_three
        grounds:
          - state_machines.SurgicalCase.SCHEDULED_to_PREEMPTED
          - state_machines.CaseAssignment.RESERVED_to_PREEMPTED
          - state_machines.InstrumentSet.CHECKED_OUT_to_SOILED
          - state_machines.Settlement.DRAFT_to_REFUNDED
          - calculations.emergency_preemption_selector
          - endpoints.POST_/surgical-cases/emergency-insert
        distinguishing_aspect: |
          POST /surgical-cases/emergency-insert triggers a 3-hop chain originating from a SINGLE action: hop 1 mutates SurgicalCase A (SCHEDULED → PREEMPTED) which itself causes hop 2 (A's CaseAssignments → PREEMPTED) which itself causes hop 3 (A's InstrumentBooking → PREEMPTED, A's InstrumentSet CHECKED_OUT → SOILED, A's Settlement DRAFT → REFUNDED with refund_amount = estimated_total_amount). Each hop is caused by the previous hop's effect, not directly by emergency-insert.
        test_recipe:
          setup:
            - "Create OperatingRoom R: room_type=CARDIAC_OR, hourly_rate=1000.00, turnover_buffer_minutes=30, specialty_required=CARDIAC"
            - "Create StaffMember A1, S1, CN1 (CARDIAC qualifications, shift 0..1440); also A2, S2, CN2 (separate staff for the emergency case to avoid staff conflicts)"
            - "Create InstrumentSet I1, I2: specialty=CARDIAC; sterilize both at current_minute=0"
            - "Create SurgicalCase A: specialty_required=CARDIAC, priority=ROUTINE, pre_op=true, consent=true, implant_cost_estimate=0.00"
            - "Approve A; schedule A in R with [A1 LEAD_ANESTHESIOLOGIST, S1 SCRUB_NURSE, CN1 CIRCULATING_NURSE], instrument_set_id=I1, planned 0..120"
          trigger:
            - "POST /surgical-cases/emergency-insert with patient_id='P-EM', surgery_type='emergency CABG', specialty_required=CARDIAC, scheduled_room_id=R, planned_start_minute=0, planned_end_minute=60, staff_assignments=[{A2,LEAD_ANESTHESIOLOGIST},{S2,SCRUB_NURSE},{CN2,CIRCULATING_NURSE}], instrument_set_id=I2, implant_cost_estimate=0.00"
          assert:
            - "SurgicalCase(A).status == 'PREEMPTED'"
            - "SurgicalCase(A).preempted_by_case_id == new_emergency_case.id"
            - "all CaseAssignments where case_id==A have status == 'PREEMPTED'"
            - "InstrumentBooking where case_id==A has status == 'PREEMPTED'"
            - "InstrumentSet(I1).sterilization_status == 'SOILED' and InstrumentSet(I1).current_case_id == null"
            - "Settlement(case_id=A).status == 'REFUNDED'"
            - "Settlement(case_id=A).refund_amount == 2850.00  # billable_hours=ceil(120/60)=2; room=2000.00, anesth=400.00, scrub=160.00, circ=140.00, instrument=150.00, implant=0.00"
            - "new emergency case status == 'SCHEDULED' and priority == 'EMERGENCY'"

      - name: cancel_cascade_depth_two
        grounds:
          - state_machines.SurgicalCase.SCHEDULED_to_CANCELLED
          - state_machines.CaseAssignment.RESERVED_to_RELEASED
          - state_machines.InstrumentSet.CHECKED_OUT_to_SOILED
          - state_machines.Settlement.DRAFT_to_REFUNDED
          - endpoints.POST_/surgical-cases/{caseId}/cancel
        distinguishing_aspect: |
          POST /surgical-cases/{caseId}/cancel triggers a 2-hop chain from a DIFFERENT action than emergency-insert: hop 1 is SurgicalCase SCHEDULED → CANCELLED; hop 2 is the cascade onto CaseAssignment (RELEASED), InstrumentBooking (RELEASED), InstrumentSet (SOILED), and Settlement (REFUNDED). Originates from /cancel rather than /emergency-insert and uses RELEASED rather than PREEMPTED for assignment cleanup — different propagation pattern and different terminal labels.
        test_recipe:
          setup:
            - "Create OperatingRoom R: GENERAL_OR, hourly_rate=500.00, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A (ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200.00, shift 0..1440), B (SCRUB_NURSE, hourly_rate=80.00, shift 0..1440)"
            - "Create InstrumentSet I: specialty=GENERAL; sterilize at 0"
            - "Create SurgicalCase C: specialty=GENERAL, pre_op=true, consent=true, implant_cost_estimate=0.00"
            - "Approve C; schedule C in R with [A LEAD_ANESTHESIOLOGIST, B SCRUB_NURSE], I, planned 0..60"
          trigger:
            - "POST /surgical-cases/{C}/cancel"
          assert:
            - "SurgicalCase(C).status == 'CANCELLED'"
            - "all CaseAssignments where case_id==C have status == 'RELEASED'"
            - "InstrumentBooking where case_id==C has status == 'RELEASED'"
            - "InstrumentSet(I).sterilization_status == 'SOILED' and InstrumentSet(I).current_case_id == null"
            - "Settlement(case_id=C).status == 'REFUNDED'"
            - "Settlement(case_id=C).refund_amount == 930.00  # 500 + 200 + 80 + 150 + 0"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_qualification
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors.ERR_CASE_NOT_APPROVED
          - errors.ERR_QUALIFICATION_MISMATCH
        distinguishing_aspect: |
          Same /schedule request fails simultaneously: case is still REQUESTED (priority-5 state check ERR_CASE_NOT_APPROVED) AND staff lacks specialty qualification (priority-9 business_safety check ERR_QUALIFICATION_MISMATCH). The state error wins by priority — this conflict pair is (state × business_safety).
        test_recipe:
          setup:
            - "Create OperatingRoom R: GENERAL_OR, hourly_rate=500.00, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember M: ANESTHESIOLOGIST, qualifications=[CARDIAC] (does NOT include GENERAL), hourly_rate=200.00, shift 0..1440"
            - "Create InstrumentSet I: specialty=GENERAL; sterilize at 0"
            - "Create SurgicalCase C: specialty=GENERAL, pre_op_assessment_attached=true, informed_consent_verified=true (do NOT call /approve so C remains in REQUESTED)"
          trigger:
            - "POST /surgical-cases/{C}/schedule with scheduled_room_id=R, planned 0..60, staff_assignments=[{M,LEAD_ANESTHESIOLOGIST}], instrument_set_id=I"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_CASE_NOT_APPROVED'  # state (priority 5) wins over business_safety (priority 9)"

      - name: business_safety_qualification_vs_business_temporal_room
        grounds:
          - validations[priority=9]
          - validations[priority=14]
          - errors.ERR_QUALIFICATION_MISMATCH
          - errors.ERR_ROOM_TIME_CONFLICT
        distinguishing_aspect: |
          Same /schedule request fails simultaneously: staff lacks specialty qualification (priority-9 business_safety ERR_QUALIFICATION_MISMATCH) AND requested room window collides with an already-scheduled case in that room (priority-14 business_temporal ERR_ROOM_TIME_CONFLICT). The qualification error wins by priority — this conflict pair is (business_safety × business_temporal), distinct from the (state × business_safety) pair above.
        test_recipe:
          setup:
            - "Create OperatingRoom R: CARDIAC_OR, hourly_rate=1000.00, turnover_buffer_minutes=30, specialty_required=CARDIAC"
            - "Create StaffMember GoodStaff (ANESTHESIOLOGIST, qualifications=[CARDIAC], hourly_rate=200, shift 0..1440), MismatchStaff (ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200, shift 0..1440)"
            - "Create InstrumentSet I1, I2: specialty=CARDIAC; sterilize both at 0"
            - "Create SurgicalCase C0: specialty=CARDIAC, pre_op=true, consent=true; approve; schedule with R, [GoodStaff LEAD_ANESTHESIOLOGIST], I1, planned 0..120 (this occupies R during [0, 150) including buffer)"
            - "Create SurgicalCase C1: specialty=CARDIAC, pre_op=true, consent=true; approve"
          trigger:
            - "POST /surgical-cases/{C1}/schedule with scheduled_room_id=R, planned 0..60, staff_assignments=[{MismatchStaff,LEAD_ANESTHESIOLOGIST}], instrument_set_id=I2  # overlaps R AND mismatched qualification"
          assert:
            - "response.status_code == 400"
            - "response.data.error_id == 'ERR_QUALIFICATION_MISMATCH'  # business_safety (priority 9) wins over business_temporal (priority 14)"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: sterilization_expiration_72h_boundary_on_get_instrument
        grounds:
          - calculations.sterilization_expiration_check
          - state_machines.InstrumentSet.CLEAN_STERILIZED_to_EXPIRED
          - endpoints.GET_/instrument-sets/{instrumentSetId}
          - endpoints.POST_/_clock/advance
        distinguishing_aspect: |
          The sterilization expiration boundary is inclusive (>= 4320 minutes triggers EXPIRED). At exactly 4319 minutes elapsed, status remains CLEAN_STERILIZED; at exactly 4320 minutes, status flips to EXPIRED. Metric: time elapsed since last_sterilized_at_minute. Endpoint: GET /instrument-sets/{instrumentSetId}.
        test_recipe:
          setup:
            - "Create InstrumentSet I: specialty=GENERAL"
            - "POST /instrument-sets/{I}/start-sterilization at current_minute=0"
            - "POST /instrument-sets/{I}/complete-sterilization at current_minute=0  # last_sterilized_at_minute=0"
          trigger:
            - "POST /_clock/advance with delta_minutes=4319 (current_minute -> 4319)"
            - "GET /instrument-sets/{I}  # call A"
            - "POST /_clock/advance with delta_minutes=1 (current_minute -> 4320)"
            - "GET /instrument-sets/{I}  # call B"
          assert:
            - "call A response.data.sterilization_status == 'CLEAN_STERILIZED'  # 4319 < 4320 → still clean"
            - "call B response.data.sterilization_status == 'EXPIRED'             # 4320 >= 4320 → expired"

      - name: staff_working_hours_720_boundary_on_schedule
        grounds:
          - calculations.staff_working_hours_window
          - validations[priority=17]
          - errors.ERR_STAFF_WORKING_HOURS_EXCEEDED
          - endpoints.POST_/surgical-cases/{caseId}/schedule
        distinguishing_aspect: |
          The staff-working-hours boundary is exclusive (total > 720 rejects). At exactly 720 minutes total in the window, schedule is allowed; at 721 minutes total, schedule is rejected. DIFFERENT METRIC from the sterilization boundary (sum-of-durations vs single-elapsed-time) and DIFFERENT ENDPOINT (/schedule vs GET /instrument-sets).
        test_recipe:
          setup:
            - "Create OperatingRoom R1, R2: GENERAL_OR, hourly_rate=500, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A: ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200, shift 0..1440"
            - "Create InstrumentSet I1, I2, I3: specialty=GENERAL; sterilize all three at current_minute=0"
            - "Create SurgicalCase C1, C2, C3: each specialty=GENERAL, pre_op=true, consent=true; approve all three"
            - "POST /surgical-cases/{C1}/schedule with R1, [A LEAD_ANESTHESIOLOGIST], I1, planned 0..600  # A's window-total = 600 ≤ 720 → succeeds"
          trigger:
            - "POST /surgical-cases/{C2}/schedule with R2, [A LEAD_ANESTHESIOLOGIST], I2, planned 600..720  # A's window-total = 600 + 120 = 720 (exactly at boundary)"
            - "POST /surgical-cases/{C3}/schedule with R1, [A LEAD_ANESTHESIOLOGIST], I3, planned 720..841  # A's window-total = 720 + 121 = 841 (just over boundary)"
          assert:
            - "C2 schedule response.status_code == 200 and SurgicalCase(C2).status == 'SCHEDULED'  # 720 ≤ 720 → allowed"
            - "C3 schedule response.status_code == 422 and response.data.error_id == 'ERR_STAFF_WORKING_HOURS_EXCEEDED'  # 841 > 720 → rejected"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_schedule_depends_on_instrument_sterilization
        grounds:
          - state_machines.SurgicalCase.APPROVED_to_SCHEDULED
          - entities.InstrumentSet.fields.sterilization_status
          - errors.ERR_INSTRUMENT_NOT_STERILIZED
        distinguishing_aspect: |
          SurgicalCase APPROVED → SCHEDULED is gated by InstrumentSet.sterilization_status == CLEAN_STERILIZED. If the booked instrument is in SOILED / IN_STERILIZATION / CHECKED_OUT, schedule fails with ERR_INSTRUMENT_NOT_STERILIZED. Pair: (SurgicalCase × InstrumentSet).
        test_recipe:
          setup:
            - "Create OperatingRoom R: GENERAL_OR, hourly_rate=500.00, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A: ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200, shift 0..1440"
            - "Create InstrumentSet I: specialty=GENERAL (initial state SOILED, never sterilized)"
            - "Create SurgicalCase C: specialty=GENERAL, pre_op=true, consent=true; approve"
          trigger:
            - "POST /surgical-cases/{C}/schedule with R, [A LEAD_ANESTHESIOLOGIST], I, planned 0..60"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_INSTRUMENT_NOT_STERILIZED'"
            - "SurgicalCase(C).status == 'APPROVED'  # transition was rejected"

      - name: case_start_depends_on_assignment_confirmation
        grounds:
          - state_machines.SurgicalCase.SCHEDULED_to_IN_PROGRESS
          - entities.CaseAssignment.fields.status
          - errors.ERR_ASSIGNMENT_NOT_CONFIRMED
        distinguishing_aspect: |
          SurgicalCase SCHEDULED → IN_PROGRESS is gated by every CaseAssignment for that case being CONFIRMED. If any assignment is still RESERVED, /start fails with ERR_ASSIGNMENT_NOT_CONFIRMED. Pair: (SurgicalCase × CaseAssignment) — DIFFERENT entity pair from the InstrumentSet dependency above.
        test_recipe:
          setup:
            - "Create OperatingRoom R: GENERAL_OR, hourly_rate=500.00, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A: ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200, shift 0..1440"
            - "Create InstrumentSet I: specialty=GENERAL; sterilize at 0"
            - "Create SurgicalCase C: specialty=GENERAL, pre_op=true, consent=true; approve; schedule with R, [A LEAD_ANESTHESIOLOGIST], I, planned 0..60  (CaseAssignment is RESERVED, not yet confirmed)"
          trigger:
            - "POST /surgical-cases/{C}/start"
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == 'ERR_ASSIGNMENT_NOT_CONFIRMED'"
            - "SurgicalCase(C).status == 'SCHEDULED'  # transition was rejected"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_turnover_buffer_closed_gap_semantics
        grounds:
          - calculations.room_turnover_buffer_check
          - validations[priority=14]
          - entities.OperatingRoom.fields.turnover_buffer_minutes
          - errors.ERR_ROOM_TIME_CONFLICT
        distinguishing_aspect: |
          OperatingRoom uses a closed-gap interval check: existing_case.end + room.turnover_buffer_minutes <= new_case.start (the buffer must be fully traversed before next case starts). At exactly start = end+buffer, schedule passes; at start = end+buffer-1, schedule is rejected. Resource: OperatingRoom; semantics: closed gap with explicit buffer.
        test_recipe:
          setup:
            - "Create OperatingRoom R: GENERAL_OR, hourly_rate=500.00, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A1, A2: ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200, shift 0..1440 (separate staff to isolate the room-overlap rule)"
            - "Create InstrumentSet I1, I2, I3: specialty=GENERAL; sterilize all three at 0"
            - "Create SurgicalCase C1, C2_pass, C2_fail: specialty=GENERAL, pre_op=true, consent=true; approve all three"
            - "POST /surgical-cases/{C1}/schedule with R, [A1 LEAD_ANESTHESIOLOGIST], I1, planned 0..120  (R occupied [0, 150) including buffer)"
          trigger:
            - "POST /surgical-cases/{C2_pass}/schedule with R, [A2 LEAD_ANESTHESIOLOGIST], I2, planned 150..210  # boundary PASS: 0+120+30 == 150"
            - "POST /surgical-cases/{C2_fail}/schedule with R, [A2 LEAD_ANESTHESIOLOGIST], I3, planned 149..209  # boundary FAIL: 149 < 150"
          assert:
            - "C2_pass schedule response.status_code == 200 and SurgicalCase(C2_pass).status == 'SCHEDULED'"
            - "C2_fail schedule response.status_code == 409 and response.data.error_id == 'ERR_ROOM_TIME_CONFLICT'"

      - name: staff_open_half_overlap_no_buffer
        grounds:
          - validations[priority=15]
          - entities.CaseAssignment.fields.assigned_start_minute
          - entities.CaseAssignment.fields.assigned_end_minute
          - errors.ERR_STAFF_TIME_CONFLICT
        distinguishing_aspect: |
          StaffMember uses a strict half-open interval check WITHOUT any buffer: two CaseAssignments overlap iff a.start < b.end AND b.start < a.end. Adjacent intervals [0,60) and [60,120) on the same staff are allowed (touching is not overlapping); [0,60) and [59,120) are rejected. DIFFERENT interval semantics from the room rule (no buffer, half-open touching), DIFFERENT resource entity (StaffMember vs OperatingRoom).
        test_recipe:
          setup:
            - "Create OperatingRoom R1, R2, R3: GENERAL_OR, hourly_rate=500, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A: ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200, shift 0..1440"
            - "Create InstrumentSet I1, I2, I3: specialty=GENERAL; sterilize all three at 0"
            - "Create SurgicalCase C1, C2_adj_pass, C2_overlap_fail: specialty=GENERAL, pre_op=true, consent=true; approve all three"
            - "POST /surgical-cases/{C1}/schedule with R1, [A LEAD_ANESTHESIOLOGIST], I1, planned 0..60  (A booked [0, 60))"
          trigger:
            - "POST /surgical-cases/{C2_adj_pass}/schedule with R2, [A LEAD_ANESTHESIOLOGIST], I2, planned 60..120  # touches but does not overlap"
            - "POST /surgical-cases/{C2_overlap_fail}/schedule with R3, [A LEAD_ANESTHESIOLOGIST], I3, planned 59..120  # 59 < 60 → overlap"
          assert:
            - "C2_adj_pass schedule response.status_code == 200 and SurgicalCase(C2_adj_pass).status == 'SCHEDULED'  # adjacency allowed (no buffer)"
            - "C2_overlap_fail schedule response.status_code == 409 and response.data.error_id == 'ERR_STAFF_TIME_CONFLICT'"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities (≥2)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: settlement_billing_register_conserved_on_cancel
        grounds:
          - calculations.provisional_cost_estimate
          - state_machines.SurgicalCase.SCHEDULED_to_CANCELLED
          - state_machines.Settlement.DRAFT_to_REFUNDED
          - entities.Settlement.fields.estimated_total_amount
          - entities.Settlement.fields.refund_amount
        distinguishing_aspect: |
          Forward action /schedule writes Settlement.estimated_total_amount = E (provisional cost). Compensating action /cancel sets Settlement.refund_amount = E. Conserved quantity (currency-amount): for any cancelled case, estimated_total_amount - refund_amount == 0.00. Named global invariant: "case billing register goes to zero on cancellation".
        test_recipe:
          setup:
            - "Create OperatingRoom R: GENERAL_OR, hourly_rate=500.00, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A (ANESTHESIOLOGIST, [GENERAL], 200), B (SCRUB_NURSE, [GENERAL], 80); shifts 0..1440"
            - "Create InstrumentSet I: GENERAL; sterilize at 0"
            - "Create SurgicalCase C: specialty=GENERAL, pre_op=true, consent=true, implant_cost_estimate=0.00"
            - "Approve, schedule C with R, [A LEAD_ANESTHESIOLOGIST, B SCRUB_NURSE], I, planned 0..60"
          trigger:
            - "GET /settlements?case_id={C}  # snapshot pre-cancel"
            - "POST /surgical-cases/{C}/cancel"
            - "GET /settlements?case_id={C}  # snapshot post-cancel"
          assert:
            - "pre_cancel.estimated_total_amount == 930.00"
            - "pre_cancel.refund_amount == 0.00"
            - "post_cancel.estimated_total_amount == 930.00  # untouched"
            - "post_cancel.refund_amount == 930.00"
            - "post_cancel.estimated_total_amount - post_cancel.refund_amount == 0.00  # conserved"

      - name: staff_planned_workload_minutes_conserved_on_release
        grounds:
          - calculations.staff_workload_planned
          - state_machines.SurgicalCase.SCHEDULED_to_CANCELLED
          - state_machines.CaseAssignment.RESERVED_to_RELEASED
          - entities.StaffMember.fields.planned_workload_minutes
        distinguishing_aspect: |
          Forward action /schedule creates a RESERVED CaseAssignment; staff_workload_planned counts it (StaffMember.planned_workload_minutes += assignment_duration). Compensating action /cancel transitions the assignment to RELEASED; staff_workload_planned no longer counts it (StaffMember.planned_workload_minutes returns to its pre-create value). Conserved quantity (workload-minutes): pre-schedule and post-release values of planned_workload_minutes are equal — a DIFFERENT conserved quantity (minutes, not currency) from the settlement-register invariant above.
        test_recipe:
          setup:
            - "Create OperatingRoom R: GENERAL_OR, hourly_rate=500.00, turnover_buffer_minutes=30, specialty_required=GENERAL"
            - "Create StaffMember A: ANESTHESIOLOGIST, qualifications=[GENERAL], hourly_rate=200.00, shift 0..1440"
            - "Create InstrumentSet I: GENERAL; sterilize at 0"
            - "Create SurgicalCase C: specialty=GENERAL, pre_op=true, consent=true; approve"
            - "GET /staff/{A}  # snapshot pre-schedule"
          trigger:
            - "POST /surgical-cases/{C}/schedule with R, [A LEAD_ANESTHESIOLOGIST], I, planned 0..60"
            - "GET /staff/{A}  # snapshot post-schedule"
            - "POST /surgical-cases/{C}/cancel"
            - "GET /staff/{A}  # snapshot post-cancel"
          assert:
            - "pre_schedule.planned_workload_minutes == 0"
            - "post_schedule.planned_workload_minutes == 60  # RESERVED CaseAssignment counted"
            - "post_cancel.planned_workload_minutes == 0   # RELEASED CaseAssignment NOT counted"
            - "post_cancel.planned_workload_minutes == pre_schedule.planned_workload_minutes  # conserved"
