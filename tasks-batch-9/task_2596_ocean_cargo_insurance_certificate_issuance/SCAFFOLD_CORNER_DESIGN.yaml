      - name: cascade_effects_are_visible_in_the_response_of_the_call_that_triggered_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /claim-files
          - endpoints.POST /survey-orders
          - endpoints.POST /claim-files/{id}/documents
        distinguishing_aspect: |
          Cross-entity cascades are immediate too: opening a claim flips its
          certificate ISSUED -> CLAIMED, appointing a surveyor advances the claim
          to SURVEY_ORDERED and the surveyor's booked_minutes_total in the same
          request, and appending the third mandatory document flips
          documentation_complete inside the document-creation response. Each
          assertion is read back from the OTHER entity immediately after the
          triggering call, with no second write in between.
        test_recipe:
          setup:
            - "one ISSUED certificate insured for 1155000.00 on the CC-ELEC (S3) class"
            - "one ACTIVE surveyor certified for S3 with travel_buffer_minutes 45"
