            - call: "POST /builders-risk/loss-payments"
              payload: { claim_id: "${cr}", expected_claim_version: "${crv2}", payee_interest_id: "${int1}", part_type: "SOFT_COST", amount_cents: 563999 }
              as: ClaimAdjuster
              as_user_id: "ca-001"
