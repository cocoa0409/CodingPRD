              payload: { legal_name: "Seller", contact_email: "s@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Buyer A", contact_email: "ba@example.com" }
              as: FranchisorOps
              captures: { fr2: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Buyer B", contact_email: "bb@example.com" }
              as: FranchisorOps
              captures: { fr3: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "CC-2", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 C St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /transfer-requests"
              payload: { store_id: "${s1}", buyer_franchisee_id: "${fr2}", sale_price_cents: 40000000, expected_store_version: "${s1_v}" }
              as: Franchisee
              as_user_id: "${fr1}"
          trigger:
            - call: "POST /transfer-requests"
              payload: { store_id: "${s1}", buyer_franchisee_id: "${fr3}", sale_price_cents: 50000000, expected_store_version: "${s1_v}" }
              as: Franchisee
              as_user_id: "${fr1}"
              captures: { err: $.data.error_id }
          assert:
            - "the second create returns 412 and err == ERR_STALE_VERSION (store moved to ${s1_v} + 1)"
            - "GET /stores/${s1}/transfer-requests returns exactly 1 row"

      - name: mandate_lazy_overdue_transition_on_read
        claim_type: scheduled_action
        grounds:
          - state_machines.RemodelMandate.transitions.ISSUED_to_OVERDUE
          - entities.RemodelMandate.fields.due_by
        distinguishing_aspect: "OVERDUE is a scheduled lazy transition: the mandate reads ISSUED at 2026-12-30 and OVERDUE at 2026-12-31T00:00:00Z (due_by inclusive boundary) with no write in between."
        test_recipe:
          setup: ["Logical clock default; assigned territory with OPEN store; mandate ISSUED with due_by 2026-12-31T00:00:00Z."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-CC-3", region: "CC", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da}" }
              as: FranchisorOps
            - call: "POST /franchisees"
              payload: { legal_name: "F1", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "CC-3", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 C St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { s1: $.data.id }
            - call: "POST /remodel-mandates"
              payload: { store_id: "${s1}", due_by: "2026-12-31T00:00:00Z", financing_option: "SELF_FINANCED", estimated_cost_cents: 5000000 }
              as: FranchisorOps
              captures: { m1: $.data.id }
          trigger:
            - call: "GET /remodel-mandates/${m1}"
              payload: {}
              as: FranchisorOps
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /remodel-mandates/${m1}"
              payload: {}
              as: FranchisorOps
          assert:
            - "the first GET reports status == ISSUED"
            - "the second GET (clock at due_by) reports status == OVERDUE"
            - "an OVERDUE mandate can still be rescheduled: POST /remodel-mandates/${m1}/schedule with [2027-01-05, 2027-01-10) returns 200 and status == SCHEDULED"

      - name: store_termination_waives_open_mandates
        claim_type: cascade_down
        grounds:
          - state_machines.Store.transitions.TERMINATION_PENDING_to_TERMINATED
          - state_machines.RemodelMandate.transitions.ISSUED_to_WAIVED
        distinguishing_aspect: "Cascade-down on termination: a store entering TERMINATED waives its ISSUED mandate; the COMPLETED mandate of the same store is untouched (non-terminal children only)."
        test_recipe:
          setup: ["Logical clock at 2026-10-05; assigned territory with OPEN store; mandate M1 COMPLETED (window Sep 20-25, begun and completed); mandate M2 ISSUED; store driven to TERMINATION_PENDING by a FAIL_CRITICAL inspection."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-CC-4", region: "CC", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da}" }
              as: FranchisorOps
            - call: "POST /franchisees"
              payload: { legal_name: "F1", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "CC-4", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 C St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { s1: $.data.id }
            - call: "POST /remodel-mandates"
              payload: { store_id: "${s1}", due_by: "2026-12-31T00:00:00Z", financing_option: "SELF_FINANCED", estimated_cost_cents: 5000000 }
              as: FranchisorOps
              captures: { m1: $.data.id }
            - call: "POST /remodel-mandates/${m1}/schedule"
              payload: { closure_start: "2026-09-20T00:00:00Z", closure_end: "2026-09-25T00:00:00Z" }
              as: DevelopmentAgent
              as_user_id: "${da}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-22T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /remodel-mandates/${m1}/begin"
              payload: {}
              as: Franchisee
              as_user_id: "${fr1}"
            - call: "POST /remodel-mandates/${m1}/complete"
              payload: {}
              as: Franchisee
              as_user_id: "${fr1}"
            - call: "POST /remodel-mandates"
              payload: { store_id: "${s1}", due_by: "2027-06-30T00:00:00Z", financing_option: "SELF_FINANCED", estimated_cost_cents: 3000000 }
              as: FranchisorOps
              captures: { m2: $.data.id }
            - call: "POST /inspections"
              payload: { store_id: "${s1}", scheduled_on: "2026-10-01T00:00:00Z", inspector_ref: "insp-1" }
              as: FranchisorOps
              captures: { i1: $.data.id }
            - call: "POST /inspections/${i1}/record-findings"
              payload: { food_safety_score: 50.0, cleanliness_score: 50.0, operations_score: 50.0, critical_violations: 3 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "POST /inspections/${i1}/finalize"
              payload: {}
              as: FranchisorOps
          trigger:
            - call: "POST /stores/${s1}/terminate"
              payload: {}
              as: FranchisorOps
          assert:
            - "Store.${s1}.status == TERMINATED"
            - "RemodelMandate.${m2}.status == WAIVED (cascade)"
            - "RemodelMandate.${m1}.status == COMPLETED (terminal children untouched)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: store_read_reflects_transfer_completion_immediately
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - state_machines.TransferRequest.transitions.APPROVED_to_COMPLETED
        distinguishing_aspect: "Immediate consistency: the complete endpoint's own response and the very next GET both show Store.franchisee_id flipped to the buyer and the request COMPLETED — no eventual lag anywhere."
        test_recipe:
          setup: ["Logical clock default; territory with OPEN store (seller FR1, age 10y); buyer FR2 with COMPLETED TRANSFER_BUYER enrollment; transfer TR1 advanced (auto to PENDING_APPROVAL) and APPROVED."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-CO-1", region: "CO", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Seller", contact_email: "s@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Buyer", contact_email: "b@example.com" }
              as: FranchisorOps
              captures: { fr2: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "CO-1", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 C St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2016-09-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /transfer-requests"
              payload: { store_id: "${s1}", buyer_franchisee_id: "${fr2}", sale_price_cents: 40000000, expected_store_version: "${s1_v}" }
              as: Franchisee
              as_user_id: "${fr1}"
              captures: { tr1: $.data.id }
            - call: "POST /training-enrollments"
              payload: { franchisee_id: "${fr2}", program_code: "TRANSFER_BUYER", expires_on: "2026-12-31T00:00:00Z" }
              as: FranchisorOps
              captures: { en1: $.data.id }
            - call: "POST /training-enrollments/${en1}/record-result"
              payload: { score: 90 }
              as: FranchisorOps
            - call: "POST /transfer-requests/${tr1}/advance-to-training"
              payload: {}
              as: FranchisorOps
            - call: "POST /transfer-requests/${tr1}/approve"
              payload: {}
              as: FranchisorOps
          trigger:
            - call: "POST /transfer-requests/${tr1}/complete"
              payload: {}
              as: FranchisorOps
            - call: "GET /stores/${s1}"
              payload: {}
              as: FranchisorOps
          assert:
            - "TransferRequest.${tr1}.status == COMPLETED"
            - "Store.${s1}.franchisee_id == ${fr2} (ownership flipped in the same request)"
            - "GET /franchisees/${fr2}/stores returns 1 row; GET /franchisees/${fr1}/stores returns 0 rows"
            - "Franchisee.${fr2}.status == ACTIVE"

      - name: excluded_stubs_note
        claim_type: violation_to_error
        grounds:
          - errors.ERR_IMPACT_STUDY_NOT_FINAL
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / approve_requires_final_impact_study
          rationale: "Asserted as the failure path of the named §1.8 instance."

      - name: excluded_stubs_quorum_boundary
        claim_type: violation_to_error
        grounds:
          - calculations.vote_quorum_check
        excluded_because:
          difficulty_instance: boundary_precision_check / quorum_exactly_two_thirds_passes
          rationale: "The inclusive two-thirds boundary (4 of 6 passes, 3 of 6 fails) is asserted in the named §1.8 instance."

      - name: excluded_stubs_protest_duplicate_window
        claim_type: violation_to_error
        grounds:
          - errors.ERR_STORE_NOT_OPEN
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / referential_beats_temporal_on_protest_filing
          rationale: "The terminated-store protest rejection is asserted as the winning error of the named §1.8 priority-conflict instance."
