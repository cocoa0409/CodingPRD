# =============================================================================
# Task 1369 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Shared fixture prelude used by many instances (referenced as FIXTURE-CORE):
#   hospital, MD physician, PH pharmacist, DIR director, MB microbiologist,
#   IP infection-preventionist, patient P, one unrestricted drug, one restricted
#   drug, one penicillin-class drug. Each instance spells out its own chain.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: hospital_create_applies_defaults
        claim_type: creation_defaults
        grounds:
          - "entities.Hospital"
        distinguishing_aspect: "Creating a hospital with only required fields applies defaults: dot_review_threshold 7, iv_to_po_min_iv_hours 48, antibiogram_min_isolates 30, restricted_auto_expire_hours 72, logical clock 2026-08-01T00:00:00Z."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "Default Hospital", nhsn_facility_id: "NHSN-D" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
          trigger:
            - call: "GET /stewardship/hospitals/${h_id}"
              payload: {}
              as: StewardshipAdmin
          assert:
            - "Hospital.${h_id}.dot_review_threshold == 7"
            - "Hospital.${h_id}.iv_to_po_min_iv_hours == 48"
            - "Hospital.${h_id}.antibiogram_min_isolates == 30"
            - "Hospital.${h_id}.restricted_auto_expire_hours == 72"
            - "Hospital.${h_id}.current_utc == '2026-08-01T00:00:00Z'"

      - name: hospital_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - "entities.Hospital"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with a random UUID that was never created returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /stewardship/hospitals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: StewardshipAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; http 404"

      - name: practitioner_create_missing_required_field
        claim_type: required_fields
        grounds:
          - "entities.Practitioner"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required license_no yields ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["Hospital H exists"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "No License", discipline: "PHYSICIAN" }
              as: StewardshipAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: practitioner_invalid_enum_discipline_rejected
        claim_type: type_constraints
        grounds:
          - "entities.Practitioner.fields.discipline"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "discipline value 'NURSE' (outside declared enum) rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Hospital H exists"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Bad Enum", license_no: "L-X", discipline: "NURSE" }
              as: StewardshipAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: practitioner_computed_standing_fields_initialized
        claim_type: computed_fields
        grounds:
          - "entities.Practitioner.fields.stewardship_standing"
          - "entities.Practitioner.fields.unresolved_noncompliance_count"
        distinguishing_aspect: "New practitioner has stewardship_standing GOOD and unresolved_noncompliance_count 0; client-supplied values for computed fields are ignored."
        test_recipe:
          setup: ["Hospital H exists"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN", is_stewardship_member: false }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
          assert:
            - "Practitioner.${md_id}.stewardship_standing == GOOD"
            - "Practitioner.${md_id}.unresolved_noncompliance_count == 0"
            - "Practitioner.${md_id}.is_active == true"

      - name: patient_case_create_and_retrieve_roundtrip
        claim_type: creation_retrieval
        grounds:
          - "entities.PatientCase"
        distinguishing_aspect: "Created patient case round-trips all input fields; status defaults to ADMITTED."
        test_recipe:
          setup: ["Hospital H; MD physician"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN" }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
          trigger:
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-RT", admitted_at: "2026-08-01T00:00:00Z", ward: "ICU", weight_kg: 82.5, renal_function_crcl: 45, is_immunocompromised: true, has_enteral_access: false }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "GET /stewardship/patient-cases/${p_id}"
              payload: {}
              as: AttendingPhysician
              as_user_id: "${md_id}"
          assert:
            - "PatientCase.${p_id}.mrn == 'MRN-RT'"
            - "PatientCase.${p_id}.ward == 'ICU'"
            - "PatientCase.${p_id}.is_immunocompromised == true"
            - "PatientCase.${p_id}.has_enteral_access == false"
            - "PatientCase.${p_id}.status == ADMITTED"

      - name: antimicrobial_list_filter_by_hospital
        claim_type: listing
        grounds:
          - "entities.Antimicrobial"
          - "endpoints.GET_/stewardship/antimicrobials"
        distinguishing_aspect: "List endpoint filters by hospital_id: drugs of H2 not visible when filtering by H1."
        test_recipe:
          setup: ["H1 with drug D1; H2 with drug D2"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H1", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h1: $.data.id }
            - call: "POST /stewardship/hospitals"
              payload: { name: "H2", nhsn_facility_id: "NHSN-2" }
              as: StewardshipAdmin
              captures: { h2: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h1}", drug_name: "DRUG-A", drug_class: "CEPHALOSPORIN", is_restricted: false, has_po_form: false }
              as: StewardshipAdmin
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h2}", drug_name: "DRUG-B", drug_class: "MACROLIDE", is_restricted: false, has_po_form: true }
              as: StewardshipAdmin
          trigger:
            - call: "GET /stewardship/antimicrobials"
              payload: { hospital_id: "${h1}" }
              as: StewardshipAdmin
          assert:
            - "Response array contains exactly 1 row with drug_name == 'DRUG-A'"
            - "No row with drug_name == 'DRUG-B' present"

      - name: pagination_envelope_fields_present
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints.GET_/stewardship/patient-cases"
        distinguishing_aspect: "List response carries pagination fields limit/offset/total_count/has_more with defaults limit 10 offset 0."
        test_recipe:
          setup: ["Hospital H; MD; 2 patient cases"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN" }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "M1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "M2", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
          trigger:
            - call: "GET /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
          assert:
            - "Response meta contains api_request_id and api_request_timestamp"
            - "Pagination block: total_count == 2, has_more == false, limit == 10, offset == 0"

      - name: susceptibility_result_fk_reverse_reachable
        claim_type: parent_relationships
        grounds:
          - "entities.SusceptibilityResult.fields.culture_report_id"
        distinguishing_aspect: "FK reverse-reachability: GET /stewardship/culture-reports/{id}/susceptibility-results returns the child rows created under that culture."
        test_recipe:
          setup: ["H; MB; MD; patient P; drug D; culture C FINAL with one susceptibility row"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MB", license_no: "L-MB-1", discipline: "MICROBIOLOGIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { mb_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN" }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "AMPICILLIN", drug_class: "NARROW_PENICILLIN", is_restricted: false, has_po_form: true }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/culture-reports"
              payload: { patient_case_id: "${p_id}", specimen_source: "URINE", collected_at: "2026-08-01T00:00:00Z", organism: "E_COLI" }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { c_id: $.data.id }
            - call: "POST /stewardship/culture-reports/${c_id}/susceptibility-results"
              payload: { antimicrobial_id: "${drug_id}", interpretation: "S", mic_value: 2.0 }
              as: Microbiologist
              as_user_id: "${mb_id}"
              captures: { sr_id: $.data.id }
          trigger:
            - call: "GET /stewardship/culture-reports/${c_id}/susceptibility-results"
              payload: {}
              as: Microbiologist
              as_user_id: "${mb_id}"
          assert:
            - "Array contains exactly 1 row with id == ${sr_id}"

      - name: order_system_fields_server_stamped
        claim_type: system_fields
        grounds:
          - "entities.AntibioticOrder"
        distinguishing_aspect: "started_at is server-stamped from the logical clock when an unrestricted order becomes ACTIVE; client cannot set it."
        test_recipe:
          setup: ["H; MD; P; unrestricted drug D; clock at 2026-08-05T10:00:00Z"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN" }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "LEVOFLOXACIN", drug_class: "FLUOROQUINOLONE", is_restricted: false, has_po_form: true }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/_clock/set_current_utc"
              payload: { hospital_id: "${h_id}", to_iso8601: "2026-08-05T10:00:00Z" }
              as: StewardshipAdmin
          trigger:
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "PO", dose_mg: 500, frequency_per_day: 2, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
          assert:
            - "AntibioticOrder.${ord_id}.started_at == '2026-08-05T10:00:00Z'"
            - "AntibioticOrder.${ord_id}.version == 1"

  # ===========================================================================
  # Section: state_machines — valid transitions, invalid transitions,
  # terminal lockdown, initial state, side effects
  # ===========================================================================
  - section: state_machines
    instances:
      - name: approval_decide_approved_happy_path
        claim_type: valid_transition
        grounds:
          - "state_machines.ApprovalRequest.SUBMITTED_to_APPROVED"
        distinguishing_aspect: "Restricted order approval: request APPROVED -> order approval APPROVED, therapy AWAITING_APPROVAL -> ACTIVE with started_at stamped from clock."
        test_recipe:
          setup: ["H; MD requester; PH decider; P; restricted drug; order O PENDING; request AR SUBMITTED"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN" }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "MEROPENEM", drug_class: "CARBAPENEM", is_restricted: true, has_po_form: false }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 1000, frequency_per_day: 3, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/approval-requests"
              payload: { antibiotic_order_id: "${ord_id}", requester_id: "${md_id}", justification: "Suspected ESBL bacteremia per prior cultures" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /stewardship/approval-requests/${ar_id}/decide"
              payload: { decision: "APPROVED", decider_id: "${ph_id}" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
          assert:
            - "ApprovalRequest.${ar_id}.status == APPROVED"
            - "AntibioticOrder.${ord_id}.approval_status == APPROVED"
            - "AntibioticOrder.${ord_id}.therapy_status == ACTIVE"
            - "AntibioticOrder.${ord_id}.started_at == '2026-08-01T00:00:00Z' (default clock; no clock-set performed)"

      - name: approval_decide_denied_cascades_discontinue
        claim_type: side_effect_execution
        grounds:
          - "state_machines.ApprovalRequest.SUBMITTED_to_DENIED"
        distinguishing_aspect: "DENIED decision flips order approval DENIED and therapy DISCONTINUED with stopped_at stamped."
        test_recipe:
          setup: ["H; MD; PH; P; restricted drug; order; AR SUBMITTED"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN" }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "MEROPENEM", drug_class: "CARBAPENEM", is_restricted: true, has_po_form: false }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 1000, frequency_per_day: 3, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/approval-requests"
              payload: { antibiotic_order_id: "${ord_id}", requester_id: "${md_id}", justification: "Suspected ESBL bacteremia per prior cultures" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ar_id: $.data.id }
          trigger:
            - call: "POST /stewardship/approval-requests/${ar_id}/decide"
              payload: { decision: "DENIED", decider_id: "${ph_id}" }
              as: IDPharmacist
              as_user_id: "${ph_id}"
          assert:
            - "ApprovalRequest.${ar_id}.status == DENIED"
            - "AntibioticOrder.${ord_id}.approval_status == DENIED"
            - "AntibioticOrder.${ord_id}.therapy_status == DISCONTINUED"
            - "AntibioticOrder.${ord_id}.stopped_at == '2026-08-01T00:00:00Z'"

      - name: escalated_request_id_pharmacist_cannot_decide
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.ApprovalRequest.ESCALATED_to_APPROVED"
          - "errors[ERR_ESCALATED_REQUIRES_DIRECTOR]"
        distinguishing_aspect: "After escalation, an IDPharmacist decide attempt fails with ERR_ESCALATED_REQUIRES_DIRECTOR even though IDPharmacist may decide SUBMITTED requests."
        test_recipe:
          setup: ["H; MD; PH; DIR; P; restricted order; AR SUBMITTED then ESCALATED"]
          setup_api_calls:
            - call: "POST /stewardship/hospitals"
              payload: { name: "H", nhsn_facility_id: "NHSN-1" }
              as: StewardshipAdmin
              captures: { h_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Dr MD", license_no: "L-MD-1", discipline: "PHYSICIAN" }
              as: StewardshipAdmin
              captures: { md_id: $.data.id }
            - call: "POST /stewardship/practitioners"
              payload: { hospital_id: "${h_id}", full_name: "Pharm PH", license_no: "L-PH-1", discipline: "PHARMACIST", is_stewardship_member: true }
              as: StewardshipAdmin
              captures: { ph_id: $.data.id }
            - call: "POST /stewardship/patient-cases"
              payload: { hospital_id: "${h_id}", mrn: "MRN-1", admitted_at: "2026-08-01T00:00:00Z", ward: "4W", weight_kg: 70, renal_function_crcl: 90 }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { p_id: $.data.id }
            - call: "POST /stewardship/antimicrobials"
              payload: { hospital_id: "${h_id}", drug_name: "MEROPENEM", drug_class: "CARBAPENEM", is_restricted: true, has_po_form: false }
              as: StewardshipAdmin
              captures: { drug_id: $.data.id }
            - call: "POST /stewardship/antibiotic-orders"
              payload: { patient_case_id: "${p_id}", antimicrobial_id: "${drug_id}", prescriber_id: "${md_id}", route: "IV", dose_mg: 1000, frequency_per_day: 3, indication: "EMPIRIC" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /stewardship/approval-requests"
              payload: { antibiotic_order_id: "${ord_id}", requester_id: "${md_id}", justification: "Suspected ESBL bacteremia per prior cultures" }
              as: AttendingPhysician
              as_user_id: "${md_id}"
              captures: { ar_id: $.data.id }
