  - section: validations
    note: >-
      The declared priority ladder is auth 1-2, existence 10-20, business_safety 22, state 30-50, business_safety 52, business_referential 55-56, business_constraint 60-64, business_temporal 65-68, business_constraint 70-71, business_fiscal 72-73. Three priority-conflict PAIRS are named in SCAFFOLD.yaml; the third one (business_referential 56 beating business_constraint 70 on model-run fit) has no counterpart in SCAFFOLD_DIFFICULTY_DESIGN.yaml and is written out in full below.
    instances:
      - name: referential_beats_constraint_on_model_run_fit
        claim_type: priority_conflict
        grounds:
          - "validations priority 56 (business_referential) - every channel in included_channel_ids has at least one non-superseded SpendObservation inside the run's DataWindow, else ERR_NO_SPEND_OBSERVATIONS (422)"
          - "validations priority 70 (business_constraint) - DataWindow.expected_period_count is strictly greater than the largest adstock_max_lag_periods among the included channels, else ERR_LAG_WINDOW_INCOMPLETE (422)"
          - "state_machines ModelRun fit preconditions, listed in the same order as the priority ladder"
        distinguishing_aspect: |
          A four-period window fitted against a channel whose adstock_max_lag_periods is 4 violates BOTH
          rules at once when the window also has no spend rows, and the answer must be the priority-56
          ERR_NO_SPEND_OBSERVATIONS; the second window in the same recipe supplies the spend rows and
          nothing else, and its identical fit then returns ERR_LAG_WINDOW_INCOMPLETE - so the first answer
          cannot be explained by the lag rule being unimplemented.
          
