scenario: "Scofflaw & Registration-Hold Program: violation aggregation & threshold, boot/tow eligibility, DMV registration-hold placement/release, payment/plan & release fee, dispute & hearing, hardship waiver, collections referral, reporting"
domain_name: scofflaw-registration-hold
# Flat, multi-resource API: every business entity is a top-level collection reached by
# its own path (`/violations/{id}`, `/scofflaw-cases/{id}`, ...). api_prefix is the empty
# root so the FK reverse-reachability check resolves each collection segment uniformly.
api_prefix: ""

complexity_profile:
  primary_archetype: posture_driven          # ScofflawCase.case_status (COMPLIANT/SCOFFLAW/RESOLVED) is a derived posture gating boot/tow/hold/collections
  secondary_archetype: compliance_audit       # regulatory thresholds, segregation-of-duties, dispute/hearing due process
  complexity_layers:
    - rate_threshold_triggers                 # scofflaw / boot / tow breakpoints on count and dollars
    - cascading_side_effects                  # payment -> resolve -> hold-release -> vehicle flag (depth 4)
    - dual_variant_calculation                # assessed vs collectible balance; boot vs tow release fee
    - optimistic_concurrency                  # OCC on ScofflawCase.version for plan-create and enforcement-dispatch supersede

  entity_topology: flat                        # peer entities linked by foreign keys, no nested URL ownership tree
  state_machine_shape: parallel                # ScofflawCase evolves case_status x hold_status independently; plus cyclic Violation & PaymentPlan, branching Dispute & BootTowOrder
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties            # four-eyes on boot/tow apply; peer operational roles + entity-backed Owner
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Owner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Registered owner name.
      - name: dmv_customer_id
        type: string
        source: input
        description: DMV customer identifier; unique across owners.
        constraints: unique
      - name: email
        type: string
        source: input
        description: Contact email.
      - name: mailing_state
        type: string
        source: input
        description: Two-letter mailing state code.
      - name: hardship_status
        type: enum
        source: input
        description: "Self-declared hardship status. One of NONE, PENDING, APPROVED."
        default: NONE
        constraints: "enum: NONE | PENDING | APPROVED"

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: owner_id
        type: string
        source: input
        description: "FK -> Owner.id; the registered owner of this vehicle."
      - name: plate_number
        type: string
        source: input
        description: License plate number.
      - name: plate_state
        type: string
        source: input
        description: Two-letter plate issuing state.
      - name: vin
        type: string
        source: input
        description: Vehicle identification number.
      - name: registration_status
        type: enum
        source: input
        description: "DMV registration standing. One of ACTIVE, EXPIRED, SUSPENDED."
        default: ACTIVE
        constraints: "enum: ACTIVE | EXPIRED | SUSPENDED"
      - name: hold_flag
        type: boolean
        source: computed
        description: "True when a DMV registration hold is currently placed on this vehicle. Set by ScofflawCase place-hold / release-hold side effects."
        default: false

  - name: ScofflawCase
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; the vehicle this scofflaw ledger tracks."
      - name: owner_id
        type: string
        source: system
        description: "FK -> Owner.id; denormalized from the vehicle at case creation for ownership checks."
      - name: case_status
        type: enum
        source: computed
        description: "Derived posture. One of COMPLIANT, SCOFFLAW, RESOLVED. Recomputed after every violation/payment/dispute/waiver/referral side effect."
        default: COMPLIANT
        constraints: "enum: COMPLIANT | SCOFFLAW | RESOLVED"
      - name: hold_status
        type: enum
        source: computed
        description: "Independent parallel axis. One of NO_HOLD, HOLD_PLACED, HOLD_RELEASED."
        default: NO_HOLD
        constraints: "enum: NO_HOLD | HOLD_PLACED | HOLD_RELEASED"
      - name: outstanding_count
        type: integer
        source: computed
        description: "Count of violations on this case with status == OUTSTANDING."
        default: 0
      - name: assessed_balance_cents
        type: integer
        source: computed
        description: "Assessed-view liability: sum of current_due over violations whose status IN {OUTSTANDING, DISPUTED}. See calculations.case_balances."
        default: 0
      - name: collectible_balance_cents
        type: integer
        source: computed
        description: "Collectible-view liability: sum of current_due over violations whose status == OUTSTANDING only. See calculations.case_balances."
        default: 0
      - name: eligible_for_boot
        type: boolean
        source: computed
        description: "True when case_status == SCOFFLAW AND outstanding_count >= BOOT_COUNT_THRESHOLD. See calculations.enforcement_eligibility."
        default: false
      - name: eligible_for_tow
        type: boolean
        source: computed
        description: "True when case_status == SCOFFLAW AND collectible_balance_cents >= TOW_AMOUNT_THRESHOLD_CENTS. See calculations.enforcement_eligibility."
        default: false

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: scofflaw_case_id
        type: string
        source: input
        description: "FK -> ScofflawCase.id; the case this citation is filed against."
      - name: citation_number
        type: string
        source: input
        description: Citation/ticket number; unique across violations.
        constraints: unique
      - name: violation_type
        type: enum
        source: input
        description: "Kind of parking/traffic violation. One of METER_EXPIRED, NO_PERMIT, STREET_CLEANING, HANDICAP, FIRE_HYDRANT."
        constraints: "enum: METER_EXPIRED | NO_PERMIT | STREET_CLEANING | HANDICAP | FIRE_HYDRANT"
      - name: fine_amount_cents
        type: integer
        source: input
        description: Base fine amount in cents.
        constraints: ">= 0"
      - name: issued_at
        type: datetime
        source: input
        description: ISO8601 UTC timestamp the citation was issued (starts the dispute window).
      - name: due_at
        type: datetime
        source: input
        description: ISO8601 UTC payment due date; late penalty accrues once the logical clock reaches this instant.
      - name: late_penalty_cents
        type: integer
        source: computed
        description: "round_half_up(fine_amount_cents * LATE_PENALTY_PCT) when clock >= due_at and not penalty-exempt, else 0. See calculations.case_balances."
        default: 0
      - name: paid_amount_cents
        type: integer
        source: computed
        description: "Cumulative amount applied to this violation by payments and settlements."
        default: 0
      - name: credit_cents
        type: integer
        source: computed
        description: "Cumulative hardship-waiver credit applied to this violation (reduces current_due)."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state. One of OUTSTANDING, DISPUTED, PAID, WAIVED, VOIDED, IN_COLLECTIONS."
        default: OUTSTANDING
        constraints: "enum: OUTSTANDING | DISPUTED | PAID | WAIVED | VOIDED | IN_COLLECTIONS"

  - name: Dispute
    parent: null
    common_fields: true
    fields:
      - name: violation_id
        type: string
        source: input
        description: "FK -> Violation.id; the citation being contested."
      - name: officer_id
        type: string
        source: system
        description: "FK -> HearingOfficer.id; assigned when the hearing is scheduled (null until then)."
      - name: reason
        type: string
        source: input
        description: Free-text dispute reason.
      - name: scheduled_start
        type: datetime
        source: system
        description: ISO8601 UTC hearing start; set at schedule/reschedule.
      - name: scheduled_end
        type: datetime
        source: system
        description: ISO8601 UTC hearing end; set at schedule/reschedule.
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock timestamp the dispute was filed.
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock timestamp the hearing decision was recorded.
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state. One of SUBMITTED, SCHEDULED, UPHELD, DISMISSED, WITHDRAWN."
        default: SUBMITTED
        constraints: "enum: SUBMITTED | SCHEDULED | UPHELD | DISMISSED | WITHDRAWN"

  - name: HearingOfficer
    parent: null
    common_fields: false
    fields:
      - name: full_name
        type: string
        source: input
        description: Hearing officer name.

  - name: TowYard
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: Tow-yard name.
      - name: capacity
        type: integer
        source: input
        description: Maximum number of vehicles that may be stored in overlapping intervals.
        constraints: ">= 1"
      - name: occupied_slot_count
        type: integer
        source: computed
        description: "Count of BootTowOrder rows with tow_yard_id == this yard, action_type == TOW, status IN {DISPATCHED, APPLIED}. Conserved across dispatch+release round-trips."
        default: 0

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - name: scofflaw_case_id
        type: string
        source: input
        description: "FK -> ScofflawCase.id; the case this installment plan covers."
      - name: total_amount_cents
        type: integer
        source: input
        description: Total amount the plan will repay in cents.
        constraints: ">= 1"
      - name: installment_count
        type: integer
        source: input
        description: Number of installments after the down payment.
        constraints: "1..PAYMENT_PLAN_MAX_INSTALLMENTS"
      - name: down_payment_cents
        type: integer
        source: input
        description: Up-front down payment in cents.
        constraints: ">= 0"
      - name: installment_amount_cents
        type: integer
        source: computed
        description: "round_half_up((total_amount_cents - down_payment_cents) / installment_count). See calculations.installment_amount."
        default: 0
      - name: paid_to_date_cents
        type: integer
        source: computed
        description: "Down payment plus sum of recorded installments."
        default: 0
      - name: missed_count
        type: integer
        source: computed
        description: "Number of times this plan has been defaulted."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state. One of ACTIVE, COMPLETED, DEFAULTED, CANCELLED."
        default: ACTIVE
        constraints: "enum: ACTIVE | COMPLETED | DEFAULTED | CANCELLED"

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - name: scofflaw_case_id
        type: string
        source: input
        description: "FK -> ScofflawCase.id; the case this payment is applied to."
      - name: amount_cents
        type: integer
        source: input
        description: Payment amount in cents.
        constraints: ">= 1"
      - name: method
        type: enum
        source: input
        description: "Payment method. One of CARD, CASH, CHECK, ACH."
        constraints: "enum: CARD | CASH | CHECK | ACH"
      - name: allocation
        type: array
        source: computed
        description: "Ordered list of {violation_id, applied_cents} entries produced by the waterfall allocation. See calculations.payment_allocation."
      - name: applied_at
        type: datetime
        source: system
        description: Logical-clock timestamp the payment was applied.

  - name: BootTowOrder
    parent: null
    common_fields: true
    fields:
      - name: scofflaw_case_id
        type: string
        source: input
        description: "FK -> ScofflawCase.id; the case this enforcement action targets."
      - name: action_type
        type: enum
        source: input
        description: "Enforcement kind. One of BOOT, TOW."
        constraints: "enum: BOOT | TOW"
      - name: tow_yard_id
        type: string
        source: input
        description: "FK -> TowYard.id; required when action_type == TOW, null for BOOT."
      - name: stored_from
        type: datetime
        source: input
        description: ISO8601 UTC storage interval start (TOW only); used for capacity overlap and storage-fee accrual.
      - name: stored_until
        type: datetime
        source: input
        description: ISO8601 UTC estimated storage interval end (TOW only); used for capacity overlap detection.
      - name: dispatched_by_user_id
        type: string
        source: system
        description: X-User-ID of the EnforcementOfficer who dispatched the order (drives segregation-of-duties on apply).
      - name: applied_by_user_id
        type: string
        source: system
        description: X-User-ID of the EnforcementOfficer who applied the order.
      - name: release_fee_paid
        type: boolean
        source: computed
        description: "True once the current release_fee_cents has been paid via pay-release-fee."
        default: false
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock timestamp the order was released.
      - name: release_fee_cents
        type: integer
        source: computed
        description: "Release fee owed as of the logical clock. BOOT and TOW use different formulas. See calculations.release_fee."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state. One of DISPATCHED, APPLIED, RELEASED, CANCELLED."
        default: DISPATCHED
        constraints: "enum: DISPATCHED | APPLIED | RELEASED | CANCELLED"

  - name: HardshipWaiver
    parent: null
    common_fields: true
    fields:
      - name: scofflaw_case_id
        type: string
        source: input
        description: "FK -> ScofflawCase.id; the case a hardship reduction is requested for."
      - name: hardship_tier
        type: enum
        source: input
        description: "Requested tier. One of TIER_1 (partial, HARDSHIP_TIER_1_PCT) or TIER_2 (full, HARDSHIP_TIER_2_PCT)."
        constraints: "enum: TIER_1 | TIER_2"
      - name: requested_amount_cents
        type: integer
        source: input
        description: Informational amount the owner requests to be waived.
        constraints: ">= 0"
      - name: approved_amount_cents
        type: integer
        source: computed
        description: "Amount actually credited on approval. See calculations.hardship_waiver_amount."
        default: 0
      - name: decided_at
        type: datetime
        source: system
        description: Logical-clock timestamp of the decision.
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state. One of REQUESTED, APPROVED, DENIED."
        default: REQUESTED
        constraints: "enum: REQUESTED | APPROVED | DENIED"

  - name: CollectionsReferral
    parent: null
    common_fields: true
    fields:
      - name: scofflaw_case_id
        type: string
        source: input
        description: "FK -> ScofflawCase.id; the case referred to a collections agency."
      - name: agency_name
        type: string
        source: input
        description: Collections agency name.
      - name: referred_amount_cents
        type: integer
        source: computed
        description: "Snapshot of collectible_balance_cents at referral time. See calculations.referral_amount."
        default: 0
      - name: settled_amount_cents
        type: integer
        source: computed
        description: "Amount recorded on settle; 0 until settled."
        default: 0
      - name: referred_at
        type: datetime
        source: system
        description: Logical-clock timestamp of referral.
      - name: status
        type: enum
        source: computed
        description: "Lifecycle state. One of REFERRED, RECALLED, SETTLED."
        default: REFERRED
        constraints: "enum: REFERRED | RECALLED | SETTLED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ScofflawCase
    initial_state: COMPLIANT
    terminal_states: []
    note: "Two independent parallel dimensions on one row: case_status (COMPLIANT/SCOFFLAW/RESOLVED) evolves via system recompute; hold_status (NO_HOLD/HOLD_PLACED/HOLD_RELEASED) evolves via place-hold/release-hold. Transitions below are grouped by axis."
    transitions:
      # ---- axis: case_status (system-driven by recompute) ----
      - from: COMPLIANT
        to: SCOFFLAW
        trigger: "system recompute after POST /scofflaw-cases/{id}/violations (or any balance-affecting side effect)"
        actor: system
        preconditions:
          - "collectible_balance_cents >= SCOFFLAW_AMOUNT_THRESHOLD_CENTS OR outstanding_count >= SCOFFLAW_COUNT_THRESHOLD"
        side_effects:
          - "recompute eligible_for_boot / eligible_for_tow"
        note: "axis: case_status. Threshold breach is inclusive (>=)."
      - from: SCOFFLAW
        to: COMPLIANT
        trigger: "system recompute after dispute filing / waiver approval / partial payment"
        actor: system
        preconditions:
          - "collectible_balance_cents > 0 AND collectible_balance_cents < SCOFFLAW_AMOUNT_THRESHOLD_CENTS AND outstanding_count < SCOFFLAW_COUNT_THRESHOLD"
        side_effects:
          - "recompute eligible_for_boot / eligible_for_tow (both become false)"
          - "cancel any BootTowOrder still in DISPATCHED status for this case (conditional cascade)"
        note: "axis: case_status. De-escalation."
      - from: SCOFFLAW
        to: RESOLVED
        trigger: "system recompute after final payment / full waiver / settlement"
        actor: system
        preconditions:
          - "collectible_balance_cents == 0"
          - "no BootTowOrder for this case in status IN {DISPATCHED, APPLIED}"
        side_effects:
          - "if hold_status == HOLD_PLACED: set hold_status = HOLD_RELEASED and Vehicle.hold_flag = false (cascade)"
        note: "axis: case_status."
      - from: RESOLVED
        to: SCOFFLAW
        trigger: "system recompute after a new POST /scofflaw-cases/{id}/violations reopens liability"
        actor: system
        preconditions:
          - "collectible_balance_cents >= SCOFFLAW_AMOUNT_THRESHOLD_CENTS OR outstanding_count >= SCOFFLAW_COUNT_THRESHOLD"
        side_effects:
          - "recompute eligible_for_boot / eligible_for_tow"
        note: "axis: case_status. Reopen."
      # ---- axis: hold_status (action-driven) ----
      - from: NO_HOLD
        to: HOLD_PLACED
        trigger: "POST /scofflaw-cases/{id}/place-hold"
        actor: EnforcementOfficer
        preconditions:
          - "case_status == SCOFFLAW"
          - "hold_status == NO_HOLD"
        side_effects:
          - "set Vehicle.hold_flag = true (cross-entity)"
        note: "axis: hold_status."
      - from: HOLD_PLACED
        to: HOLD_RELEASED
        trigger: "POST /scofflaw-cases/{id}/release-hold OR system on case RESOLVED"
        actor: CollectionsAdmin
        preconditions:
          - "hold_status == HOLD_PLACED"
        side_effects:
          - "set Vehicle.hold_flag = false (cross-entity)"
        note: "axis: hold_status."
      - from: HOLD_RELEASED
        to: HOLD_PLACED
        trigger: "POST /scofflaw-cases/{id}/place-hold after a reopened case"
        actor: EnforcementOfficer
        preconditions:
          - "case_status == SCOFFLAW"
          - "hold_status == HOLD_RELEASED"
        side_effects:
          - "set Vehicle.hold_flag = true (cross-entity)"
        note: "axis: hold_status. Re-place after reopen."

  - entity: Violation
    initial_state: OUTSTANDING
    terminal_states: [PAID, WAIVED, VOIDED]
    note: "Cyclic: OUTSTANDING <-> DISPUTED (contest then reinstate)."
    transitions:
      - from: OUTSTANDING
        to: DISPUTED
        trigger: "POST /violations/{id}/disputes"
        actor: Owner
        preconditions:
          - "status == OUTSTANDING"
          - "clock <= issued_at + DISPUTE_WINDOW_DAYS days"
          - "no existing Dispute for this violation in ANY status (one dispute per violation lifetime)"
        side_effects:
          - "create Dispute (SUBMITTED)"
          - "recompute owning ScofflawCase balances (collectible drops by this violation's current_due)"
      - from: DISPUTED
        to: OUTSTANDING
        trigger: "POST /disputes/{id}/decide (DISMISSED), POST /disputes/{id}/withdraw, or hearing dismissal"
        actor: HearingClerk
        preconditions:
          - "owning Dispute transitions to DISMISSED or WITHDRAWN"
        side_effects:
          - "recompute owning ScofflawCase balances (collectible restored) — conserves collectible across the dispute round-trip"
      - from: DISPUTED
        to: VOIDED
        trigger: "POST /disputes/{id}/decide (UPHELD)"
        actor: HearingClerk
        preconditions:
          - "owning Dispute transitions to UPHELD"
        side_effects:
          - "recompute owning ScofflawCase balances (assessed drops)"
      - from: OUTSTANDING
        to: PAID
        trigger: "POST /scofflaw-cases/{id}/payments (waterfall fully covers this violation)"
        actor: Owner
        preconditions:
          - "paid_amount_cents + credit_cents >= fine_amount_cents + late_penalty_cents"
        side_effects:
          - "recompute owning ScofflawCase balances"
      - from: OUTSTANDING
        to: WAIVED
        trigger: "POST /hardship-waivers/{id}/decide (approve, TIER_2)"
        actor: CollectionsAdmin
        preconditions:
          - "approved TIER_2 hardship waiver credits the full current_due"
        side_effects:
          - "recompute owning ScofflawCase balances"
      - from: OUTSTANDING
        to: IN_COLLECTIONS
        trigger: "POST /scofflaw-cases/{id}/collections-referrals"
        actor: CollectionsAdmin
        preconditions:
          - "owning case referred to collections"
        side_effects:
          - "recompute owning ScofflawCase balances (collectible excludes IN_COLLECTIONS)"
      - from: IN_COLLECTIONS
        to: OUTSTANDING
        trigger: "POST /collections-referrals/{id}/recall"
        actor: CollectionsAdmin
        preconditions:
          - "referral recalled"
        side_effects:
          - "recompute owning ScofflawCase balances"
      - from: IN_COLLECTIONS
        to: PAID
        trigger: "POST /collections-referrals/{id}/settle"
        actor: CollectionsAdmin
        preconditions:
          - "referral settled"
        side_effects:
          - "recompute owning ScofflawCase balances"

  - entity: Dispute
    initial_state: SUBMITTED
    terminal_states: [UPHELD, DISMISSED, WITHDRAWN]
    note: "Branching (UPHELD vs DISMISSED have divergent side-effect sets) with a reschedule self-loop while SCHEDULED."
    transitions:
      - from: SUBMITTED
        to: SCHEDULED
        trigger: "POST /disputes/{id}/schedule"
        actor: HearingClerk
        preconditions:
          - "status == SUBMITTED"
          - "linked Violation.status == DISPUTED (cross-entity)"
          - "assigned HearingOfficer has no other SCHEDULED dispute whose [scheduled_start, scheduled_end) overlaps (half-open; adjacency allowed)"
        side_effects:
          - "set officer_id, scheduled_start, scheduled_end"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /disputes/{id}/reschedule"
        actor: HearingClerk
        preconditions:
          - "status == SCHEDULED"
          - "new [scheduled_start, scheduled_end) does not overlap another SCHEDULED dispute on the same officer"
        side_effects:
          - "update scheduled_start, scheduled_end"
        note: "self-loop / cycle."
      - from: SCHEDULED
        to: UPHELD
        trigger: "POST /disputes/{id}/decide (decision=UPHELD)"
        actor: HearingClerk
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "set decided_at"
          - "linked Violation DISPUTED -> VOIDED"
          - "recompute owning ScofflawCase balances"
        note: "branch A."
      - from: SCHEDULED
        to: DISMISSED
        trigger: "POST /disputes/{id}/decide (decision=DISMISSED)"
        actor: HearingClerk
        preconditions:
          - "status == SCHEDULED"
        side_effects:
          - "set decided_at"
          - "linked Violation DISPUTED -> OUTSTANDING"
          - "recompute owning ScofflawCase balances (collectible restored)"
        note: "branch B."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Owner
        preconditions:
          - "status IN {SUBMITTED, SCHEDULED}"
        side_effects:
          - "linked Violation DISPUTED -> OUTSTANDING"
          - "recompute owning ScofflawCase balances (collectible restored)"
      - from: SCHEDULED
        to: WITHDRAWN
        trigger: "POST /disputes/{id}/withdraw"
        actor: Owner
        preconditions:
          - "status IN {SUBMITTED, SCHEDULED}"
        side_effects:
          - "linked Violation DISPUTED -> OUTSTANDING"
          - "recompute owning ScofflawCase balances (collectible restored)"

  - entity: PaymentPlan
    initial_state: ACTIVE
    terminal_states: [COMPLETED, CANCELLED]
    note: "Cyclic: ACTIVE <-> DEFAULTED (default then reinstate)."
    transitions:
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /payment-plans/{id}/record-installment (final installment)"
        actor: Owner
        preconditions:
          - "status == ACTIVE"
          - "paid_to_date_cents + amount_cents >= total_amount_cents"
        side_effects:
          - "set paid_to_date_cents"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "POST /payment-plans/{id}/default"
        actor: CollectionsAdmin
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "increment missed_count"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "POST /payment-plans/{id}/reinstate"
        actor: CollectionsAdmin
        preconditions:
          - "status == DEFAULTED"
        side_effects: []
        note: "cycle back."
      - from: ACTIVE
        to: CANCELLED
        trigger: "system on POST /scofflaw-cases/{id}/payment-plans (a new plan supersedes the prior ACTIVE one)"
        actor: system
        preconditions:
          - "status == ACTIVE"
        side_effects: []
      - from: DEFAULTED
        to: CANCELLED
        trigger: "system on POST /scofflaw-cases/{id}/payment-plans supersede"
        actor: system
        preconditions:
          - "status == DEFAULTED"
        side_effects: []

  - entity: BootTowOrder
    initial_state: DISPATCHED
    terminal_states: [RELEASED, CANCELLED]
    note: "Branching (RELEASED vs CANCELLED). Four-eyes SoD between dispatch and apply."
    transitions:
      - from: DISPATCHED
        to: APPLIED
        trigger: "POST /boot-tow-orders/{id}/apply"
        actor: EnforcementOfficer
        preconditions:
          - "status == DISPATCHED"
          - "X-User-ID != dispatched_by_user_id (segregation of duties)"
        side_effects:
          - "set applied_by_user_id"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /boot-tow-orders/{id}/cancel OR system de-escalation when case leaves SCOFFLAW"
        actor: EnforcementOfficer
        preconditions:
          - "status == DISPATCHED"
        side_effects:
          - "if action_type == TOW: free the tow-yard slot (occupied_slot_count decrements)"
      - from: APPLIED
        to: RELEASED
        trigger: "POST /boot-tow-orders/{id}/release"
        actor: EnforcementOfficer
        preconditions:
          - "status == APPLIED"
          - "release_fee_paid == true"
          - "owning ScofflawCase.collectible_balance_cents == 0"
        side_effects:
          - "set released_at"
          - "if action_type == TOW: free the tow-yard slot (occupied_slot_count decrements) — conserves slots across dispatch+release"

  - entity: HardshipWaiver
    initial_state: REQUESTED
    terminal_states: [APPROVED, DENIED]
    note: "Branching approve/deny."
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /hardship-waivers/{id}/decide (approve=true)"
        actor: CollectionsAdmin
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "compute approved_amount_cents per calculations.hardship_waiver_amount"
          - "TIER_2: each OUTSTANDING violation on the case -> WAIVED; TIER_1: each OUTSTANDING violation credit_cents += round_half_up(current_due * HARDSHIP_TIER_1_PCT)"
          - "recompute owning ScofflawCase balances"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /hardship-waivers/{id}/decide (approve=false)"
        actor: CollectionsAdmin
        preconditions:
          - "status == REQUESTED"
        side_effects:
          - "set decided_at; no balance change"

  - entity: CollectionsReferral
    initial_state: REFERRED
    terminal_states: [RECALLED, SETTLED]
    note: "Branching recall/settle."
    transitions:
      - from: REFERRED
        to: RECALLED
        trigger: "POST /collections-referrals/{id}/recall"
        actor: CollectionsAdmin
        preconditions:
          - "status == REFERRED"
        side_effects:
          - "each IN_COLLECTIONS violation on the case -> OUTSTANDING"
          - "recompute owning ScofflawCase balances"
      - from: REFERRED
        to: SETTLED
        trigger: "POST /collections-referrals/{id}/settle"
        actor: CollectionsAdmin
        preconditions:
          - "status == REFERRED"
        side_effects:
          - "set settled_amount_cents"
          - "each IN_COLLECTIONS violation on the case -> PAID"
          - "recompute owning ScofflawCase balances"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on ScofflawCase.version)
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-supersede-stale-case
    parent_entity: ScofflawCase
    write_endpoint: "POST /scofflaw-cases/{id}/payment-plans"
    occ_field: "expected_scofflaw_case_version"
    description: |
      Creating a PaymentPlan against a ScofflawCase whose version has advanced
      since the client last observed it is rejected. A new plan legitimately
      supersedes (cancels) the prior ACTIVE plan, so a writer holding a stale
      version — one that predates another writer's supersede — is rejected on
      the version mismatch rather than silently cancelling a plan it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: enforcement-dispatch-supersede-stale-case
    parent_entity: ScofflawCase
    write_endpoint: "POST /scofflaw-cases/{id}/boot-tow-orders"
    occ_field: "expected_scofflaw_case_version"
    description: |
      Dispatching a BootTowOrder against a ScofflawCase whose version has
      advanced since the client last read it is rejected. An escalated TOW
      dispatch supersedes a prior still-DISPATCHED BOOT order; a writer whose
      observed case version is stale is rejected on the version mismatch.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: case_balances
    trigger: "recomputed on read of a ScofflawCase and after every violation/payment/dispute/waiver/referral side effect"
    algorithm: aggregation
    formula: |
      for each violation v on the case:
        late_penalty(v) = round_half_up(v.fine_amount_cents * LATE_PENALTY_PCT)
                          if (clock >= v.due_at and v.status in {OUTSTANDING, DISPUTED}) else 0
        current_due(v)  = v.fine_amount_cents + late_penalty(v)
                          - v.paid_amount_cents - v.credit_cents      # floored at 0
      # DUAL VARIANT — same violations, two inclusion sets:
      assessed_balance_cents    = sum( current_due(v) for v where v.status in {OUTSTANDING, DISPUTED} )
      collectible_balance_cents = sum( current_due(v) for v where v.status == OUTSTANDING )
      outstanding_count         = count( v where v.status == OUTSTANDING )
      # ROUNDING ORDER PINNED: compute late_penalty PER VIOLATION (round_half_up),
      # THEN sum. Never sum fines first then apply the rate.
    input_set: "violations on the case; assessed includes {OUTSTANDING, DISPUTED}, collectible includes {OUTSTANDING} only; PAID/WAIVED/VOIDED/IN_COLLECTIONS excluded from both."
    constants:
      LATE_PENALTY_PCT: 0.25
    precision: "integer cents; round_half_up on each violation's late_penalty before summation"
    variants:
      - name: assessed
        when: "showing total exposure including contested citations"
        difference: "includes DISPUTED violations at full current_due"
      - name: collectible
        when: "showing amount the agency may currently collect / that gates scofflaw & tow thresholds"
        difference: "excludes DISPUTED violations entirely"

  - name: enforcement_eligibility
    trigger: "recomputed with case_balances"
    algorithm: threshold
    formula: |
      case_status becomes SCOFFLAW when
        collectible_balance_cents >= SCOFFLAW_AMOUNT_THRESHOLD_CENTS
        OR outstanding_count >= SCOFFLAW_COUNT_THRESHOLD
      eligible_for_boot = (case_status == SCOFFLAW) and (outstanding_count >= BOOT_COUNT_THRESHOLD)
      eligible_for_tow  = (case_status == SCOFFLAW) and (collectible_balance_cents >= TOW_AMOUNT_THRESHOLD_CENTS)
    input_set: "current collectible_balance_cents and outstanding_count of the case"
    constants:
      SCOFFLAW_AMOUNT_THRESHOLD_CENTS: 50000
      SCOFFLAW_COUNT_THRESHOLD: 5
      BOOT_COUNT_THRESHOLD: 5
      TOW_AMOUNT_THRESHOLD_CENTS: 100000
    precision: "integer comparison; all breakpoints inclusive (>=)"

  - name: release_fee
    trigger: "recomputed on read of a BootTowOrder in {APPLIED, RELEASED}; charged before release"
    algorithm: tiered_pricing
    formula: |
      as_of = released_at if status == RELEASED else clock
      if action_type == BOOT:
        release_fee_cents = BOOT_FEE_CENTS + ADMIN_FEE_CENTS
      else:  # TOW
        storage_days = ceil( (as_of - stored_from) / 1 day )     # >= 0
        billable_days = min(storage_days, MAX_STORAGE_DAYS)
        release_fee_cents = TOW_FEE_CENTS + ADMIN_FEE_CENTS
                          + billable_days * DAILY_STORAGE_RATE_CENTS
    input_set: "the order's action_type, stored_from, and the logical clock (or released_at)"
    constants:
      BOOT_FEE_CENTS: 15000
      TOW_FEE_CENTS: 25000
      ADMIN_FEE_CENTS: 5000
      DAILY_STORAGE_RATE_CENTS: 4000
      MAX_STORAGE_DAYS: 30
    precision: "integer cents; ceil on storage_days; min-cap at MAX_STORAGE_DAYS"
    variants:
      - name: boot_release_fee
        when: "action_type == BOOT"
        difference: "flat BOOT_FEE + ADMIN_FEE; no storage accrual"
      - name: tow_release_fee
        when: "action_type == TOW"
        difference: "TOW_FEE + ADMIN_FEE + capped daily storage (nested min with MAX_STORAGE_DAYS)"

  - name: payment_allocation
    trigger: "POST /scofflaw-cases/{id}/payments"
    algorithm: waterfall_allocation
    formula: |
      candidates = violations on case where status == OUTSTANDING
      order candidates by issued_at ASC, tie-break created_at ASC   # never by id
      remaining = amount_cents
      for v in ordered candidates:
        due = current_due(v)
        applied = min(remaining, due)
        v.paid_amount_cents += applied
        remaining -= applied
        record allocation entry {violation_id: v.id, applied_cents: applied}
        if v.paid_amount_cents + v.credit_cents >= v.fine_amount_cents + late_penalty(v):
            v.status -> PAID
      if remaining > 0 after all candidates: reject ERR_OVERPAYMENT (no partial commit)
    input_set: "OUTSTANDING violations only, processed oldest issued_at first"
    constants: {}
    precision: "integer cents; deterministic issued_at ASC then created_at ASC ordering"

  - name: installment_amount
    trigger: "POST /scofflaw-cases/{id}/payment-plans"
    algorithm: aggregation
    formula: |
      installment_amount_cents = round_half_up( (total_amount_cents - down_payment_cents) / installment_count )
      paid_to_date_cents (initial) = down_payment_cents
    input_set: "the plan's total, down payment, and installment_count"
    constants:
      PAYMENT_PLAN_MAX_INSTALLMENTS: 12
      PAYMENT_PLAN_MIN_DOWN_PCT: 0.10
    precision: "integer cents, round_half_up"

  - name: hardship_waiver_amount
    trigger: "POST /hardship-waivers/{id}/decide (approve=true)"
    algorithm: weighted_scoring
    formula: |
      base = sum( current_due(v) for v on case where status == OUTSTANDING )
      if hardship_tier == TIER_2:
        approved_amount_cents = base                      # full forgiveness; violations -> WAIVED
      else:  # TIER_1
        approved_amount_cents = sum( round_half_up( current_due(v) * HARDSHIP_TIER_1_PCT )
                                     for v on case where status == OUTSTANDING )
        # per-violation credit_cents += round_half_up(current_due(v) * HARDSHIP_TIER_1_PCT)
    input_set: "OUTSTANDING violations on the case at decision time"
    constants:
      HARDSHIP_TIER_1_PCT: 0.50
      HARDSHIP_TIER_2_PCT: 1.00
    precision: "integer cents; round_half_up per violation for TIER_1 then sum"
    variants:
      - name: tier_1_partial
        when: "hardship_tier == TIER_1"
        difference: "credits half of each OUTSTANDING violation's current_due; violations stay OUTSTANDING"
      - name: tier_2_full
        when: "hardship_tier == TIER_2"
        difference: "forgives full current_due; violations -> WAIVED"

  - name: referral_amount
    trigger: "POST /scofflaw-cases/{id}/collections-referrals"
    algorithm: aggregation
    formula: |
      referred_amount_cents = collectible_balance_cents at referral time
    input_set: "collectible balance snapshot at referral"
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "acting role is permitted to perform the operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path-referenced resource exists, validated left-to-right"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: all
    description: "Emit the resource-specific 404 (ERR_OWNER_NOT_FOUND, ERR_VEHICLE_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_VIOLATION_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_OFFICER_NOT_FOUND, ERR_TOW_YARD_NOT_FOUND, ERR_PLAN_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_WAIVER_NOT_FOUND, ERR_REFERRAL_NOT_FOUND, ERR_PAYMENT_NOT_FOUND)."
  - priority: 4
    category: auth
    check: "Owner acting on a case/violation resource must own it: ScofflawCase.owner_id == X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /violations/{id}/disputes, POST /disputes/{id}/withdraw, POST /scofflaw-cases/{id}/payments, POST /scofflaw-cases/{id}/payment-plans, POST /scofflaw-cases/{id}/hardship-waivers, POST /boot-tow-orders/{id}/pay-release-fee"
  - priority: 5
    category: state
    check: "target resource is in a state that permits the transition (case_status / violation.status / dispute.status / plan.status / order.status / referral.status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all
    description: "Emit the domain-specific state error where declared: ERR_VIOLATION_NOT_OUTSTANDING, ERR_CASE_NOT_SCOFFLAW, ERR_ORDER_NOT_ACTIVE, ERR_PLAN_NOT_ACTIVE, ERR_HOLD_ALREADY_PLACED, ERR_NO_HOLD_TO_RELEASE, ERR_TERMINAL_STATE."
  - priority: 6
    category: state
    check: "POST /scofflaw-cases/{id}/boot-tow-orders and place-hold require case_status == SCOFFLAW"
    error_id: ERR_CASE_NOT_SCOFFLAW
    http_status: 409
    applies_to: "POST /scofflaw-cases/{id}/boot-tow-orders, POST /scofflaw-cases/{id}/place-hold"
  - priority: 7
    category: state
    check: "scheduling a dispute hearing requires the linked Violation.status == DISPUTED (cross-entity)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /disputes/{id}/schedule"
  - priority: 8
    category: business_temporal
    check: "a dispute may only be filed while clock <= issued_at + DISPUTE_WINDOW_DAYS days (DISPUTE_WINDOW_DAYS = 21)"
    error_id: ERR_DISPUTE_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /violations/{id}/disputes"
  - priority: 9
    category: business_temporal
    check: "collections referral requires the oldest OUTSTANDING violation to be at least COLLECTIONS_MIN_AGE_DAYS old (COLLECTIONS_MIN_AGE_DAYS = 90)"
    error_id: ERR_NOT_YET_REFERABLE
    http_status: 422
    applies_to: "POST /scofflaw-cases/{id}/collections-referrals"
  - priority: 10
    category: business_temporal
    check: "a scheduled hearing interval must not overlap another SCHEDULED dispute on the same HearingOfficer ([start,end) half-open; adjacency allowed)"
    error_id: ERR_OFFICER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /disputes/{id}/schedule, POST /disputes/{id}/reschedule"
  - priority: 11
    category: business_constraint
    check: "a TOW dispatch is rejected when the tow yard already has >= capacity overlapping active tows for the requested [stored_from, stored_until)"
    error_id: ERR_TOW_YARD_FULL
    http_status: 409
    applies_to: "POST /scofflaw-cases/{id}/boot-tow-orders"
  - priority: 12
    category: business_constraint
    check: "a violation may be disputed at most once in its lifetime (any prior Dispute in any status blocks a new one); citation_number / dmv_customer_id uniqueness; at most one REFERRED referral per case"
    error_id: ERR_DISPUTE_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /violations/{id}/disputes"
    description: "Because filing a dispute immediately flips the violation to DISPUTED, the state check (priority 5) fires while a dispute is still active; ERR_DISPUTE_ALREADY_EXISTS is reachable only after the prior dispute is terminal (WITHDRAWN/DISMISSED/UPHELD) and the violation is OUTSTANDING again. Also ERR_REFERRAL_ALREADY_EXISTS for a second REFERRED referral on a case."
  - priority: 13
    category: business_constraint
    check: "payment-plan installment_count must be within 1..PAYMENT_PLAN_MAX_INSTALLMENTS"
    error_id: ERR_INVALID_PLAN_TERMS
    http_status: 422
    applies_to: "POST /scofflaw-cases/{id}/payment-plans"
  - priority: 14
    category: business_safety
    check: "the EnforcementOfficer applying a boot/tow order (X-User-ID) must differ from dispatched_by_user_id (four-eyes)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /boot-tow-orders/{id}/apply"
  - priority: 15
    category: business_fiscal
    check: "boot dispatch requires outstanding_count >= BOOT_COUNT_THRESHOLD; tow dispatch requires collectible_balance_cents >= TOW_AMOUNT_THRESHOLD_CENTS"
    error_id: ERR_BOOT_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /scofflaw-cases/{id}/boot-tow-orders"
    description: "TOW variant emits ERR_TOW_THRESHOLD_NOT_MET."
  - priority: 16
    category: business_fiscal
    check: "payment-plan down_payment_cents must be >= PAYMENT_PLAN_MIN_DOWN_PCT * total_amount_cents"
    error_id: ERR_INSUFFICIENT_DOWN_PAYMENT
    http_status: 422
    applies_to: "POST /scofflaw-cases/{id}/payment-plans"
  - priority: 17
    category: business_fiscal
    check: "a payment must not exceed the case collectible_balance_cents (no overpayment / no partial commit)"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /scofflaw-cases/{id}/payments"
  - priority: 18
    category: business_fiscal
    check: "pay-release-fee amount_cents must equal the order's current release_fee_cents; release requires release_fee_paid AND collectible_balance_cents == 0"
    error_id: ERR_RELEASE_FEE_UNPAID
    http_status: 409
    applies_to: "POST /boot-tow-orders/{id}/pay-release-fee, POST /boot-tow-orders/{id}/release"
    description: "release with outstanding balance emits ERR_BALANCE_OUTSTANDING."
  - priority: 19
    category: business_constraint
    check: "OCC: expected_scofflaw_case_version must equal the case's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /scofflaw-cases/{id}/payment-plans, POST /scofflaw-cases/{id}/boot-tow-orders"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advances logical clock; recomputable time-gated fields re-derive on next read"]

  # ---- Owner ----
  - method: POST
    path: "/owners"
    description: "Register a vehicle owner."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, dmv_customer_id, email, mailing_state, "hardship_status?"]
    output: Owner
    side_effects: []
  - method: GET
    path: "/owners/{id}"
    description: "Fetch an owner."
    roles: [PlatformAdmin, EnforcementOfficer, HearingClerk, CollectionsAdmin, Owner]
    code: 200
    input: []
    output: Owner

  # ---- Vehicle ----
  - method: POST
    path: "/vehicles"
    description: "Register a vehicle."
    roles: [PlatformAdmin]
    code: 201
    input: [owner_id, plate_number, plate_state, vin, "registration_status?"]
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/vehicles/{id}"
    description: "Fetch a vehicle (includes hold_flag)."
    roles: [PlatformAdmin, EnforcementOfficer, HearingClerk, CollectionsAdmin, Owner]
    code: 200
    input: []
    output: Vehicle
  - method: GET
    path: "/vehicles"
    description: "List vehicles; filter by owner_id (reverse-reachability for Vehicle.owner_id)."
    roles: [PlatformAdmin, EnforcementOfficer, HearingClerk, CollectionsAdmin, Owner]
    code: 200
    input: ["owner_id?", "plate_number?", "limit?", "offset?"]
    output: Vehicle[]

  # ---- HearingOfficer ----
  - method: POST
    path: "/hearing-officers"
    description: "Create a hearing officer."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name]
    output: HearingOfficer
    side_effects: []
  - method: GET
    path: "/hearing-officers"
    description: "List hearing officers."
    roles: [PlatformAdmin, HearingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: HearingOfficer[]

  # ---- TowYard ----
  - method: POST
    path: "/tow-yards"
    description: "Create a tow yard with a fixed storage capacity."
    roles: [PlatformAdmin]
    code: 201
    input: [name, capacity]
    output: TowYard
    side_effects: []
  - method: GET
    path: "/tow-yards"
    description: "List tow yards (includes occupied_slot_count)."
    roles: [PlatformAdmin, EnforcementOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: TowYard[]

  # ---- ScofflawCase ----
  - method: POST
    path: "/scofflaw-cases"
    description: "Open a scofflaw case ledger for a vehicle; owner_id is denormalized from the vehicle."
    roles: [PlatformAdmin, EnforcementOfficer]
    code: 201
    input: [vehicle_id]
    output: ScofflawCase
    side_effects: ["copy owner_id from vehicle; initialize case_status=COMPLIANT, hold_status=NO_HOLD"]
  - method: GET
    path: "/scofflaw-cases/{id}"
    description: "Fetch a case; recomputes balances, posture, and eligibility on read."
    roles: [PlatformAdmin, EnforcementOfficer, HearingClerk, CollectionsAdmin, Owner]
    code: 200
    input: []
    output: ScofflawCase
  - method: GET
    path: "/scofflaw-cases"
    description: "List cases; filter by vehicle_id or owner_id (reverse-reachability for both FKs) or case_status."
    roles: [PlatformAdmin, EnforcementOfficer, HearingClerk, CollectionsAdmin, Owner]
    code: 200
    input: ["vehicle_id?", "owner_id?", "case_status?", "limit?", "offset?"]
    output: ScofflawCase[]
  - method: POST
    path: "/scofflaw-cases/{id}/place-hold"
    description: "Place a DMV registration hold (case must be SCOFFLAW)."
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: ScofflawCase
    side_effects: ["hold_status NO_HOLD/HOLD_RELEASED -> HOLD_PLACED", "set Vehicle.hold_flag = true", "increments ScofflawCase.version by 1"]
  - method: POST
    path: "/scofflaw-cases/{id}/release-hold"
    description: "Release a DMV registration hold."
    roles: [CollectionsAdmin, EnforcementOfficer]
    code: 200
    input: ["release_reason?"]
    output: ScofflawCase
    side_effects: ["hold_status HOLD_PLACED -> HOLD_RELEASED", "set Vehicle.hold_flag = false", "increments ScofflawCase.version by 1"]

  # ---- Violation ----
  - method: POST
    path: "/scofflaw-cases/{id}/violations"
    description: "File a citation against a case; recomputes balances and posture (threshold evaluation)."
    roles: [EnforcementOfficer]
    code: 201
    input: [citation_number, violation_type, fine_amount_cents, issued_at, due_at]
    output: Violation
    side_effects: ["recompute case_balances / enforcement_eligibility", "case_status may transition COMPLIANT/RESOLVED -> SCOFFLAW", "increments ScofflawCase.version by 1"]
  - method: GET
    path: "/violations/{id}"
    description: "Fetch a violation (includes computed late_penalty_cents, paid_amount_cents, credit_cents)."
    roles: [PlatformAdmin, EnforcementOfficer, HearingClerk, CollectionsAdmin, Owner]
    code: 200
    input: []
    output: Violation
  - method: GET
    path: "/violations"
    description: "List violations; filter by scofflaw_case_id (reverse-reachability) or status."
    roles: [PlatformAdmin, EnforcementOfficer, HearingClerk, CollectionsAdmin, Owner]
    code: 200
    input: ["scofflaw_case_id?", "status?", "limit?", "offset?"]
    output: Violation[]

  # ---- Dispute (hearing folded in) ----
  - method: POST
    path: "/violations/{id}/disputes"
    description: "File a dispute against a violation (within the dispute window); moves violation to DISPUTED."
    roles: [Owner]
    code: 201
    input: [reason]
    output: Dispute
    side_effects: ["Violation OUTSTANDING -> DISPUTED", "recompute case_balances (collectible drops)", "case_status may de-escalate SCOFFLAW -> COMPLIANT and cancel DISPATCHED orders", "increments ScofflawCase.version by 1"]
  - method: GET
    path: "/disputes/{id}"
    description: "Fetch a dispute."
    roles: [PlatformAdmin, EnforcementOfficer, HearingClerk, CollectionsAdmin, Owner]
    code: 200
    input: []
    output: Dispute
  - method: GET
    path: "/disputes"
    description: "List disputes; filter by violation_id (reverse-reachability), officer_id (reverse-reachability), or status."
    roles: [PlatformAdmin, EnforcementOfficer, HearingClerk, CollectionsAdmin, Owner]
    code: 200
    input: ["violation_id?", "officer_id?", "status?", "limit?", "offset?"]
    output: Dispute[]
  - method: POST
    path: "/disputes/{id}/schedule"
    description: "Schedule a hearing with an officer and a [scheduled_start, scheduled_end) window (overlap-checked)."
    roles: [HearingClerk]
    code: 200
    input: [officer_id, scheduled_start, scheduled_end]
    output: Dispute
    side_effects: ["Dispute SUBMITTED -> SCHEDULED", "assign officer_id and interval"]
  - method: POST
    path: "/disputes/{id}/reschedule"
    description: "Move a scheduled hearing to a new window (overlap-checked)."
    roles: [HearingClerk]
    code: 200
    input: [scheduled_start, scheduled_end]
    output: Dispute
    side_effects: ["update scheduled_start / scheduled_end"]
  - method: POST
    path: "/disputes/{id}/decide"
    description: "Record the hearing decision (UPHELD voids the violation; DISMISSED reinstates it)."
    roles: [HearingClerk]
    code: 200
    input: [decision]
    output: Dispute
    side_effects: ["UPHELD: Violation DISPUTED -> VOIDED; DISMISSED: Violation DISPUTED -> OUTSTANDING", "recompute case_balances", "increments ScofflawCase.version by 1"]
  - method: POST
    path: "/disputes/{id}/withdraw"
    description: "Owner withdraws a dispute; violation reinstated to OUTSTANDING."
    roles: [Owner]
    code: 200
    input: []
    output: Dispute
    side_effects: ["Dispute -> WITHDRAWN", "Violation DISPUTED -> OUTSTANDING", "recompute case_balances", "increments ScofflawCase.version by 1"]

  # ---- Payment ----
  - method: POST
    path: "/scofflaw-cases/{id}/payments"
    description: "Apply a payment; waterfall-allocated oldest-first across OUTSTANDING violations."
    roles: [Owner]
    code: 201
    input: [amount_cents, method]
    output: Payment
    side_effects: ["allocate per calculations.payment_allocation", "fully-covered violations -> PAID", "recompute case_balances", "case_status may -> RESOLVED and cascade hold release + Vehicle.hold_flag=false", "increments ScofflawCase.version by 1"]
  - method: GET
    path: "/payments/{id}"
    description: "Fetch a payment (immutable; includes allocation)."
    roles: [PlatformAdmin, EnforcementOfficer, CollectionsAdmin, Owner]
    code: 200
    input: []
    output: Payment
  - method: GET
    path: "/payments"
    description: "List payments; filter by scofflaw_case_id (reverse-reachability)."
    roles: [PlatformAdmin, EnforcementOfficer, CollectionsAdmin, Owner]
    code: 200
    input: ["scofflaw_case_id?", "limit?", "offset?"]
    output: Payment[]

  # ---- PaymentPlan ----
  - method: POST
    path: "/scofflaw-cases/{id}/payment-plans"
    description: "Create an installment plan (OCC on case version); supersedes any prior ACTIVE plan."
    roles: [Owner]
    code: 201
    input: [expected_scofflaw_case_version, total_amount_cents, installment_count, down_payment_cents]
    output: PaymentPlan
    side_effects: ["cancel any existing ACTIVE/DEFAULTED plan on the case", "compute installment_amount_cents; paid_to_date_cents = down_payment_cents", "increments ScofflawCase.version by 1"]
  - method: GET
    path: "/payment-plans/{id}"
    description: "Fetch a payment plan."
    roles: [PlatformAdmin, CollectionsAdmin, Owner]
    code: 200
    input: []
    output: PaymentPlan
  - method: GET
    path: "/payment-plans"
    description: "List payment plans; filter by scofflaw_case_id (reverse-reachability) or status."
    roles: [PlatformAdmin, CollectionsAdmin, Owner]
    code: 200
    input: ["scofflaw_case_id?", "status?", "limit?", "offset?"]
    output: PaymentPlan[]
  - method: POST
    path: "/payment-plans/{id}/record-installment"
    description: "Record an installment payment; may complete the plan."
    roles: [Owner]
    code: 200
    input: [amount_cents]
    output: PaymentPlan
    side_effects: ["paid_to_date_cents += amount_cents", "status -> COMPLETED when paid_to_date_cents >= total_amount_cents"]
  - method: POST
    path: "/payment-plans/{id}/default"
    description: "Mark a plan defaulted after a missed installment."
    roles: [CollectionsAdmin]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: ["status ACTIVE -> DEFAULTED", "missed_count += 1"]
  - method: POST
    path: "/payment-plans/{id}/reinstate"
    description: "Reinstate a defaulted plan."
    roles: [CollectionsAdmin]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: ["status DEFAULTED -> ACTIVE"]

  # ---- BootTowOrder ----
  - method: POST
    path: "/scofflaw-cases/{id}/boot-tow-orders"
    description: "Dispatch a boot or tow (OCC on case version; case must be SCOFFLAW and threshold-eligible; TOW checks yard capacity)."
    roles: [EnforcementOfficer]
    code: 201
    input: [expected_scofflaw_case_version, action_type, "tow_yard_id?", "stored_from?", "stored_until?"]
    output: BootTowOrder
    side_effects: ["set dispatched_by_user_id from X-User-ID", "TOW: reserve a tow-yard slot (occupied_slot_count += 1); a TOW supersedes a still-DISPATCHED BOOT on the case", "increments ScofflawCase.version by 1"]
  - method: GET
    path: "/boot-tow-orders/{id}"
    description: "Fetch a boot/tow order (includes computed release_fee_cents)."
    roles: [PlatformAdmin, EnforcementOfficer, Owner]
    code: 200
    input: []
    output: BootTowOrder
  - method: GET
    path: "/boot-tow-orders"
    description: "List orders; filter by scofflaw_case_id (reverse-reachability), tow_yard_id (reverse-reachability), or status."
    roles: [PlatformAdmin, EnforcementOfficer, Owner]
    code: 200
    input: ["scofflaw_case_id?", "tow_yard_id?", "status?", "limit?", "offset?"]
    output: BootTowOrder[]
  - method: POST
    path: "/boot-tow-orders/{id}/apply"
    description: "Apply the boot/attach the tow (four-eyes: applier must differ from dispatcher)."
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: BootTowOrder
    side_effects: ["status DISPATCHED -> APPLIED", "set applied_by_user_id"]
  - method: POST
    path: "/boot-tow-orders/{id}/pay-release-fee"
    description: "Pay the current release fee (amount must equal release_fee_cents as of the clock)."
    roles: [Owner]
    code: 200
    input: [amount_cents]
    output: BootTowOrder
    side_effects: ["set release_fee_paid = true"]
  - method: POST
    path: "/boot-tow-orders/{id}/release"
    description: "Release the boot/tow (requires release_fee_paid and case collectible_balance_cents == 0)."
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: BootTowOrder
    side_effects: ["status APPLIED -> RELEASED", "set released_at", "TOW: free tow-yard slot (occupied_slot_count -= 1)"]
  - method: POST
    path: "/boot-tow-orders/{id}/cancel"
    description: "Cancel a dispatched order."
    roles: [EnforcementOfficer]
    code: 200
    input: []
    output: BootTowOrder
    side_effects: ["status DISPATCHED -> CANCELLED", "TOW: free tow-yard slot (occupied_slot_count -= 1)"]

  # ---- HardshipWaiver ----
  - method: POST
    path: "/scofflaw-cases/{id}/hardship-waivers"
    description: "Owner requests a hardship waiver (tiered)."
    roles: [Owner]
    code: 201
    input: [hardship_tier, requested_amount_cents]
    output: HardshipWaiver
    side_effects: []
  - method: GET
    path: "/hardship-waivers/{id}"
    description: "Fetch a hardship waiver."
    roles: [PlatformAdmin, CollectionsAdmin, Owner]
    code: 200
    input: []
    output: HardshipWaiver
  - method: GET
    path: "/hardship-waivers"
    description: "List hardship waivers; filter by scofflaw_case_id (reverse-reachability) or status."
    roles: [PlatformAdmin, CollectionsAdmin, Owner]
    code: 200
    input: ["scofflaw_case_id?", "status?", "limit?", "offset?"]
    output: HardshipWaiver[]
  - method: POST
    path: "/hardship-waivers/{id}/decide"
    description: "Approve or deny a hardship waiver (approve applies the tiered credit)."
    roles: [CollectionsAdmin]
    code: 200
    input: [approve]
    output: HardshipWaiver
    side_effects: ["APPROVED: compute approved_amount_cents; TIER_2 -> violations WAIVED, TIER_1 -> per-violation credit_cents", "recompute case_balances", "increments ScofflawCase.version by 1"]

  # ---- CollectionsReferral ----
  - method: POST
    path: "/scofflaw-cases/{id}/collections-referrals"
    description: "Refer a case to a collections agency (case SCOFFLAW; oldest OUTSTANDING violation aged >= COLLECTIONS_MIN_AGE_DAYS; no active referral)."
    roles: [CollectionsAdmin]
    code: 201
    input: [agency_name]
    output: CollectionsReferral
    side_effects: ["snapshot referred_amount_cents = collectible_balance_cents", "each OUTSTANDING violation -> IN_COLLECTIONS", "recompute case_balances", "increments ScofflawCase.version by 1"]
  - method: GET
    path: "/collections-referrals/{id}"
    description: "Fetch a collections referral."
    roles: [PlatformAdmin, CollectionsAdmin, Owner]
    code: 200
    input: []
    output: CollectionsReferral
  - method: GET
    path: "/collections-referrals"
    description: "List collections referrals; filter by scofflaw_case_id (reverse-reachability) or status."
    roles: [PlatformAdmin, CollectionsAdmin, Owner]
    code: 200
    input: ["scofflaw_case_id?", "status?", "limit?", "offset?"]
    output: CollectionsReferral[]
  - method: POST
    path: "/collections-referrals/{id}/recall"
    description: "Recall a referral; violations return to OUTSTANDING."
    roles: [CollectionsAdmin]
    code: 200
    input: []
    output: CollectionsReferral
    side_effects: ["status REFERRED -> RECALLED", "IN_COLLECTIONS violations -> OUTSTANDING", "recompute case_balances", "increments ScofflawCase.version by 1"]
  - method: POST
    path: "/collections-referrals/{id}/settle"
    description: "Settle a referral; violations marked PAID."
    roles: [CollectionsAdmin]
    code: 200
    input: [settled_amount_cents]
    output: CollectionsReferral
    side_effects: ["status REFERRED -> SETTLED", "set settled_amount_cents", "IN_COLLECTIONS violations -> PAID", "recompute case_balances", "increments ScofflawCase.version by 1"]

  # ---- Reporting ----
  - method: GET
    path: "/reports/scofflaw-summary"
    description: "Aggregate program report."
    roles: [PlatformAdmin, CollectionsAdmin]
    code: 200
    input: ["case_status?"]
    output: "{ total_cases: integer, scofflaw_cases: integer, resolved_cases: integer, total_collectible_cents: integer, total_assessed_cents: integer, holds_placed: integer }"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for the operation, or Owner acting on a case they do not own"
  - id: ERR_VALIDATION
    http: 400
    condition: "missing required field, wrong type, or malformed enum/timestamp"
  - id: ERR_OWNER_NOT_FOUND
    http: 404
    condition: "owner id does not exist"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "vehicle id does not exist"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "scofflaw case id does not exist"
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "violation id does not exist"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "dispute id does not exist"
  - id: ERR_OFFICER_NOT_FOUND
    http: 404
    condition: "hearing officer id does not exist"
  - id: ERR_TOW_YARD_NOT_FOUND
    http: 404
    condition: "tow yard id does not exist"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "payment plan id does not exist"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "boot/tow order id does not exist"
  - id: ERR_WAIVER_NOT_FOUND
    http: 404
    condition: "hardship waiver id does not exist"
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "collections referral id does not exist"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "payment id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition attempted from a state that does not permit it (generic)"
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "operation attempted on a resource already in a terminal state"
  - id: ERR_VIOLATION_NOT_OUTSTANDING
    http: 409
    condition: "dispute/payment target violation is not OUTSTANDING"
  - id: ERR_CASE_NOT_SCOFFLAW
    http: 409
    condition: "boot/tow dispatch or place-hold attempted while case_status != SCOFFLAW"
  - id: ERR_HOLD_ALREADY_PLACED
    http: 409
    condition: "place-hold attempted while hold_status == HOLD_PLACED"
  - id: ERR_NO_HOLD_TO_RELEASE
    http: 409
    condition: "release-hold attempted while hold_status != HOLD_PLACED"
  - id: ERR_ORDER_NOT_ACTIVE
    http: 409
    condition: "apply/release/cancel attempted from an incompatible order status"
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "record-installment/default/reinstate attempted from an incompatible plan status"
  - id: ERR_DISPUTE_WINDOW_EXPIRED
    http: 422
    condition: "dispute filed after issued_at + DISPUTE_WINDOW_DAYS"
  - id: ERR_DISPUTE_ALREADY_EXISTS
    http: 409
    condition: "a second dispute filed while one is already SUBMITTED/SCHEDULED"
  - id: ERR_OFFICER_DOUBLE_BOOKED
    http: 409
    condition: "hearing interval overlaps another SCHEDULED dispute on the same officer"
  - id: ERR_TOW_YARD_FULL
    http: 409
    condition: "tow yard already at capacity for the requested storage interval"
  - id: ERR_BOOT_THRESHOLD_NOT_MET
    http: 422
    condition: "boot dispatch while outstanding_count < BOOT_COUNT_THRESHOLD"
  - id: ERR_TOW_THRESHOLD_NOT_MET
    http: 422
    condition: "tow dispatch while collectible_balance_cents < TOW_AMOUNT_THRESHOLD_CENTS"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "boot/tow applier X-User-ID equals dispatched_by_user_id"
  - id: ERR_RELEASE_FEE_UNPAID
    http: 409
    condition: "release attempted before release_fee_paid, or pay-release-fee amount != release_fee_cents"
  - id: ERR_BALANCE_OUTSTANDING
    http: 409
    condition: "release attempted while collectible_balance_cents > 0"
  - id: ERR_INSUFFICIENT_DOWN_PAYMENT
    http: 422
    condition: "plan down_payment_cents < PAYMENT_PLAN_MIN_DOWN_PCT * total_amount_cents"
  - id: ERR_INVALID_PLAN_TERMS
    http: 422
    condition: "plan installment_count outside 1..PAYMENT_PLAN_MAX_INSTALLMENTS"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "payment amount exceeds collectible_balance_cents"
  - id: ERR_NOT_YET_REFERABLE
    http: 422
    condition: "oldest OUTSTANDING violation younger than COLLECTIONS_MIN_AGE_DAYS"
  - id: ERR_REFERRAL_ALREADY_EXISTS
    http: 409
    condition: "a second referral while one is already REFERRED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_scofflaw_case_version != case.version"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "System administrator: sets the logical clock and provisions owners, vehicles, officers, tow yards, cases; reads everything."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /owners"
      - "POST /vehicles"
      - "POST /hearing-officers"
      - "POST /tow-yards"
    shared_operations:
      - "POST /scofflaw-cases"
      - "GET (all read endpoints)"
      - "GET /reports/scofflaw-summary"
  - name: EnforcementOfficer
    description: "Files citations, opens cases, dispatches/applies/releases/cancels boot & tow, places/releases holds."
    identity: opaque
    exclusive_operations:
      - "POST /scofflaw-cases/{id}/violations"
      - "POST /scofflaw-cases/{id}/boot-tow-orders"
      - "POST /boot-tow-orders/{id}/apply"
      - "POST /boot-tow-orders/{id}/release"
      - "POST /boot-tow-orders/{id}/cancel"
      - "POST /scofflaw-cases/{id}/place-hold"
    shared_operations:
      - "POST /scofflaw-cases"
      - "POST /scofflaw-cases/{id}/release-hold"
      - "GET (case/violation/order read endpoints)"
  - name: HearingClerk
    description: "Schedules, reschedules, and decides dispute hearings."
    identity: opaque
    exclusive_operations:
      - "POST /disputes/{id}/schedule"
      - "POST /disputes/{id}/reschedule"
      - "POST /disputes/{id}/decide"
    shared_operations:
      - "GET (dispute/officer read endpoints)"
  - name: CollectionsAdmin
    description: "Decides hardship waivers, manages collections referrals, defaults/reinstates plans, releases holds."
    identity: opaque
    exclusive_operations:
      - "POST /hardship-waivers/{id}/decide"
      - "POST /scofflaw-cases/{id}/collections-referrals"
      - "POST /collections-referrals/{id}/recall"
      - "POST /collections-referrals/{id}/settle"
      - "POST /payment-plans/{id}/default"
      - "POST /payment-plans/{id}/reinstate"
    shared_operations:
      - "POST /scofflaw-cases/{id}/release-hold"
      - "GET /reports/scofflaw-summary"
      - "GET (read endpoints)"
  - name: Owner
    description: "Vehicle owner acting on their own case: files/withdraws disputes, pays, requests plans & hardship waivers, pays release fees."
    identity: "entity_backed:Owner"
    exclusive_operations:
      - "POST /violations/{id}/disputes"
      - "POST /disputes/{id}/withdraw"
      - "POST /scofflaw-cases/{id}/payments"
      - "POST /scofflaw-cases/{id}/payment-plans"
      - "POST /payment-plans/{id}/record-installment"
      - "POST /scofflaw-cases/{id}/hardship-waivers"
      - "POST /boot-tow-orders/{id}/pay-release-fee"
    shared_operations:
      - "GET (own case/violation/dispute/order read endpoints)"
