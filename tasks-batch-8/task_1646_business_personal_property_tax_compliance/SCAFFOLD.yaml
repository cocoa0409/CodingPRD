# =============================================================================
# Task 1646 — Business Personal Property Tax Compliance
# Scaffold seed tables (§1.0–§1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Business Personal Property Tax Compliance (property tax compliance firm):
  asset listing extract & taxable classification by jurisdiction, rendition
  filing deadline by county & extension, depreciation schedule per assessor
  tables, assessment notice review & appeal decision, tax bill validation &
  payment scheduling, exemption/abatement application & compliance, asset
  disposal reconciliation to reduce assessments, accrual & budget forecast

domain_name: bpp-tax-compliance
api_prefix: /bpp

# =============================================================================
# §0.3 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency     # extension supersede (Rendition.version), forecast supersede (ClientAccount.version)
    - cascading_side_effects     # disposal -> line exclusion -> rendition totals -> forecast staleness; appeal -> notice -> bill -> installments
    - dual_variant_calculation   # depreciation conventions (FULL_YEAR vs HALF_YEAR); forecast variants (NOTICE_BASED vs RENDERED_CONSERVATIVE)
    - scheduled_actions          # logical clock sweeps: deadlines, extension expiry, installment lateness, abatement recertification, exemption cure
  entity_topology: hybrid        # peer entities with FK links; nested collection reads for audit sub-resources
  state_machine_shape: compound  # cyclic (Rendition amendments, Exemption compliance, Abatement recert) + branching (Appeal fork-join) + parallel dimensions (Asset, TaxBill)
  relationship_patterns:
    - one_to_many
    - cross_aggregate            # bill validation reads rendition + notice + exemptions + abatements across aggregates
  role_model: segregation_of_duties  # filer cannot amend own rendition; bill importer cannot validate own bill
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (15 entities)
# =============================================================================
entities:
  - name: ClientAccount
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Client legal entity name" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: forecast_sequence, type: integer, source: system, description: "Count of PUBLISHED forecasts ever generated; increments on each publish", default: 0 }

  - name: Operator
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Operator full name" }
      - { name: operator_role, type: enum, source: input, description: "TAX_ANALYST | SENIOR_MANAGER — maps X-User-Role TaxAnalyst/SeniorManager onto this entity", constraints: "enum: TAX_ANALYST, SENIOR_MANAGER" }

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: county_name, type: string, source: input, description: "County / appraisal district name" }
      - { name: state_code, type: string, source: input, description: "Two-letter state code" }
      - { name: base_deadline_mmdd, type: string, source: input, description: "Rendition base deadline month-day, format MM-DD; deadline date for tax_year Y is date(Y, MM, DD)", constraints: "regex ^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$" }
      - { name: max_extension_days, type: integer, source: input, description: "Maximum days an extension may push the rendition deadline beyond base deadline" }
      - { name: late_penalty_pct_per_month, type: integer, source: input, description: "Late rendition penalty percent per started month" }
      - { name: max_late_penalty_pct, type: integer, source: input, description: "Cap on cumulative late penalty percent" }
      - { name: penalty_base, type: enum, source: input, description: "VALUE_BASE: penalty computed on rendition total assessed value; TAX_BASE: penalty computed on tax amount", constraints: "enum: VALUE_BASE, TAX_BASE" }
      - { name: tax_rate, type: number, source: input, description: "Tax rate applied to taxable value (e.g. 0.02)" }
      - { name: offered_exemption_types, type: array, source: input, description: "Array of exemption types this jurisdiction offers; subset of FREEPORT, POLLUTION_CONTROL, HISTORIC" }
      - { name: max_exemption_pct, type: integer, source: input, description: "Maximum exemption percentage any single application may claim (0-100)" }

  - name: JurisdictionClassRule
    parent: Jurisdiction
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; owning jurisdiction" }
      - { name: category, type: enum, source: input, description: "Asset category this rule classifies", constraints: "enum: MACHINERY, FURNITURE, COMPUTER, VEHICLE, INVENTORY, LEASEHOLD_IMPROVEMENT; unique per jurisdiction" }
      - { name: is_taxable, type: boolean, source: input, description: "Whether this category is taxable in this jurisdiction (drives the rule proposal for classification)" }
      - { name: depreciation_convention, type: enum, source: input, description: "FULL_YEAR: age = tax_year - acquisition_year; HALF_YEAR: age = tax_year - in_service_year - (1 if in_service_date >= July 1 else 0)", constraints: "enum: FULL_YEAR, HALF_YEAR" }
      - { name: percent_good_vector, type: array, source: input, description: "Array of integer percent-good factors indexed by age (index 0 = age 0); e.g. [80,70,60]" }
      - { name: percent_good_floor_pct, type: integer, source: input, description: "Percent-good floor applied when age exceeds the last vector index" }
      - { name: de_minimis_line_cents, type: integer, source: input, description: "Lines with assessed value strictly below this are dropped from the rendition (included=false, exclusion_reason=DEMINIMIS); value equal to the floor is kept" }

  - name: Asset
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> ClientAccount.id; owning client" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; situs jurisdiction where the asset is taxed" }
      - { name: asset_tag, type: string, source: input, description: "Client-side asset tag from the listing extract; unique per client", constraints: "unique per client_id" }
      - { name: category, type: enum, source: input, description: "Asset category", constraints: "enum: MACHINERY, FURNITURE, COMPUTER, VEHICLE, INVENTORY, LEASEHOLD_IMPROVEMENT" }
      - { name: acquisition_cost_cents, type: integer, source: input, description: "Historical acquisition cost in cents (> 0)" }
      - { name: acquisition_date, type: datetime, source: input, description: "Acquisition date (YYYY-MM-DD)" }
      - { name: in_service_date, type: datetime, source: input, description: "Date placed in service (YYYY-MM-DD); drives HALF_YEAR convention" }
      - { name: lifecycle_status, type: enum, source: system, description: "ACTIVE | DISPOSED — parallel state dimension 1", default: "ACTIVE", constraints: "enum: ACTIVE, DISPOSED" }
      - { name: classification_status, type: enum, source: system, description: "UNCLASSIFIED | CLASSIFIED | OVERRIDDEN — parallel state dimension 2", default: "UNCLASSIFIED", constraints: "enum: UNCLASSIFIED, CLASSIFIED, OVERRIDDEN" }
      - { name: taxable_classification, type: enum, source: system, description: "TAXABLE | NON_TAXABLE | EXEMPT_FLAGGED; set by classify action", constraints: "enum: TAXABLE, NON_TAXABLE, EXEMPT_FLAGGED; null until classified" }
      - { name: disposed_date, type: datetime, source: system, description: "Disposal date while a RECORDED/RECONCILED disposal exists; null otherwise" }
      - { name: disposal_proceeds_cents, type: integer, source: system, description: "Proceeds realized on disposal; null until disposed" }

  - name: DisposalRecord
    parent: Asset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; disposed asset (path parameter of the create endpoint)" }
      - { name: disposal_date, type: datetime, source: input, description: "Date the asset left service (YYYY-MM-DD)" }
      - { name: disposal_proceeds_cents, type: integer, source: input, description: "Sale/scrap proceeds in cents (>= 0)" }
      - { name: disposal_status, type: enum, source: system, description: "RECORDED | RECONCILED | REVERSED", default: "RECORDED", constraints: "enum: RECORDED, RECONCILED, REVERSED" }

  - name: Rendition
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> ClientAccount.id; filing client" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; filing jurisdiction" }
      - { name: tax_year, type: integer, source: input, description: "Tax year being rendered", constraints: "unique together (client_id, jurisdiction_id, tax_year)" }
      - { name: rendition_status, type: enum, source: system, description: "DRAFT | FILED | AMENDMENT_OPEN | ACCEPTED", default: "DRAFT", constraints: "enum: DRAFT, FILED, AMENDMENT_OPEN, ACCEPTED" }
      - { name: lines, type: array, source: system, description: "Generated line items: array of { line_no, asset_id, category, acquisition_cost_cents, age_years, percent_good_applied, assessed_value_cents, taxable_classification, included, exclusion_reason }" }
      - { name: total_assessed_value_cents, type: integer, source: computed, description: "Sum of assessed_value_cents over lines with included=true (per-line rounding already applied)", default: 0 }
      - { name: deadline_date, type: datetime, source: computed, description: "Current effective filing deadline: date(tax_year, base_deadline_mmdd), moved by latest GRANTED extension" }
      - { name: is_late_filing, type: boolean, source: computed, description: "True when filed date is strictly after deadline_date", default: false }
      - { name: late_days, type: integer, source: computed, description: "Calendar days between deadline_date and file date; 0 when on time", default: 0 }
      - { name: late_penalty_months, type: integer, source: computed, description: "ceil(late_days / 30); 0 when on time", default: 0 }
      - { name: late_penalty_cents, type: integer, source: computed, description: "Late penalty per late_filing_penalty calculation", default: 0 }
      - { name: filed_at, type: datetime, source: system, description: "Timestamp of the most recent successful file action; null while never filed" }
      - { name: filed_by_operator_id, type: string, source: system, description: "X-User-ID (Operator.id) of the analyst who most recently filed; null while never filed" }
      - { name: amendment_opened_by_operator_id, type: string, source: system, description: "Operator.id who opened the current amendment; null when no amendment is open" }

  - name: FilingExtension
    parent: Rendition
    common_fields: true
    fields:
      - { name: rendition_id, type: string, source: system, description: "FK -> Rendition.id; extended rendition (path parameter of the create endpoint)" }
      - { name: requested_extend_to_date, type: datetime, source: input, description: "Requested new deadline date (YYYY-MM-DD)" }
      - { name: granted_days, type: integer, source: computed, description: "Days beyond the base deadline granted; null while not GRANTED" }
      - { name: extension_status, type: enum, source: system, description: "GRANTED | SUPERSEDED | EXPIRED", constraints: "enum: GRANTED, SUPERSEDED, EXPIRED" }

  - name: AssessmentNotice
    parent: Rendition
    common_fields: true
    fields:
      - { name: rendition_id, type: string, source: system, description: "FK -> Rendition.id; rendition this notice assesses (path parameter of the create endpoint)" }
      - { name: notice_value_cents, type: integer, source: input, description: "Assessed value stated by the county notice (> 0)" }
      - { name: received_date, type: datetime, source: input, description: "Date the notice was received (YYYY-MM-DD)" }
      - { name: protest_deadline_date, type: datetime, source: input, description: "Last date an appeal may be filed (YYYY-MM-DD); filing exactly on this date is allowed" }
      - { name: notice_status, type: enum, source: system, description: "RECEIVED | ACCEPTED | PROTESTED | FINALIZED", default: "RECEIVED", constraints: "enum: RECEIVED, ACCEPTED, PROTESTED, FINALIZED" }
      - { name: final_value_cents, type: integer, source: computed, description: "Final assessed value after acceptance/appeal/board decision; null until FINALIZED" }

  - name: Appeal
    parent: AssessmentNotice
    common_fields: true
    fields:
      - { name: notice_id, type: string, source: system, description: "FK -> AssessmentNotice.id; protested notice (path parameter of the create endpoint)" }
      - { name: claimed_value_cents, type: integer, source: input, description: "Value the client claims (must be <= notice_value_cents)" }
      - { name: grounds, type: string, source: input, description: "Free-text protest grounds" }
      - { name: appeal_status, type: enum, source: system, description: "FILED | HEARING_SCHEDULED | DECIDED | ACCEPTED | ESCALATED | CLOSED | WITHDRAWN", default: "FILED", constraints: "enum: FILED, HEARING_SCHEDULED, DECIDED, ACCEPTED, ESCALATED, CLOSED, WITHDRAWN" }
      - { name: hearing_date, type: datetime, source: system, description: "Scheduled hearing date; null until scheduled" }
      - { name: decision, type: enum, source: system, description: "GRANTED_REDUCTION | DENIED; null until decided", constraints: "enum: GRANTED_REDUCTION, DENIED; null until decided" }
      - { name: decided_value_cents, type: integer, source: system, description: "Value decided at hearing; null until decided" }
      - { name: board_value_cents, type: integer, source: system, description: "Value decided by the board on escalation; null until board decision recorded" }

  - name: TaxBill
    parent: AssessmentNotice
    common_fields: true
    fields:
      - { name: notice_id, type: string, source: system, description: "FK -> AssessmentNotice.id; notice this bill is issued against (path parameter of the create endpoint)" }
      - { name: billed_amount_cents, type: integer, source: input, description: "Amount the county bill states (> 0)" }
      - { name: tax_rate, type: number, source: input, description: "Tax rate printed on the bill (e.g. 0.025)" }
      - { name: due_date, type: datetime, source: input, description: "Bill due date (YYYY-MM-DD); installments are spaced 30 days apart starting at this date" }
      - { name: validated_amount_cents, type: integer, source: computed, description: "System-computed expected tax per tax_bill_validation; null until validated" }
      - { name: variance_cents, type: integer, source: computed, description: "billed_amount_cents - validated_amount_cents; null until validated" }
      - { name: validation_status, type: enum, source: system, description: "PENDING | MATCHED | DISCREPANCY — parallel state dimension 1", default: "PENDING", constraints: "enum: PENDING, MATCHED, DISCREPANCY" }
      - { name: payment_status, type: enum, source: system, description: "UNSCHEDULED | SCHEDULED | PARTIALLY_PAID | PAID | DELINQUENT — parallel state dimension 2, derived from installments", default: "UNSCHEDULED", constraints: "enum: UNSCHEDULED, SCHEDULED, PARTIALLY_PAID, PAID, DELINQUENT" }
      - { name: installments, type: array, source: system, description: "Array of { installment_no, due_date, amount_cents, installment_status (SCHEDULED | LATE | PAID | CANCELLED), paid_date }" }
      - { name: unscheduled_amount_cents, type: integer, source: computed, description: "validated_amount_cents minus sum of installments not in CANCELLED status; null until validated" }
      - { name: created_by_operator_id, type: string, source: system, description: "Operator.id (X-User-ID) who imported the bill" }
      - { name: validated_by_operator_id, type: string, source: system, description: "Operator.id who validated the bill; null until validated" }

  - name: ExemptionApplication
    parent: Asset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; asset the exemption applies to (path parameter of the create endpoint)" }
      - { name: exemption_type, type: enum, source: input, description: "FREEPORT | POLLUTION_CONTROL | HISTORIC", constraints: "enum: FREEPORT, POLLUTION_CONTROL, HISTORIC" }
      - { name: exemption_pct, type: integer, source: input, description: "Percent of assessed value exempted (1-100); must not exceed the jurisdiction max_exemption_pct" }
      - { name: effective_date, type: datetime, source: input, description: "First day the certificate is effective (YYYY-MM-DD); half-open interval start" }
      - { name: expiration_date, type: datetime, source: input, description: "Day the certificate ceases to be effective (YYYY-MM-DD); half-open interval end, must be > effective_date" }
      - { name: application_status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | DENIED | SUSPENDED | REVOKED", default: "DRAFT", constraints: "enum: DRAFT, SUBMITTED, APPROVED, DENIED, SUSPENDED, REVOKED" }
      - { name: suspended_date, type: datetime, source: system, description: "Date suspension began; null unless SUSPENDED. Clock sweep revokes 90 days after this date" }

  - name: AbatementAgreement
    parent: Asset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; abated asset (path parameter of the create endpoint)" }
      - { name: first_tax_year, type: integer, source: input, description: "First covered tax year (closed interval start)" }
      - { name: last_tax_year, type: integer, source: input, description: "Last covered tax year (closed interval end, inclusive); must be >= first_tax_year" }
      - { name: abatement_pct, type: integer, source: input, description: "Percent of assessed value abated per covered year (1-100)" }
      - { name: agreement_status, type: enum, source: system, description: "ACTIVE | RECERTIFICATION_DUE | TERMINATED", default: "ACTIVE", constraints: "enum: ACTIVE, RECERTIFICATION_DUE, TERMINATED" }
      - { name: last_recertified_year, type: integer, source: system, description: "Most recent tax year compliance was recertified; initialized to first_tax_year" }

  - name: AccrualForecast
    parent: ClientAccount
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id; forecast client (path parameter of the create endpoint)" }
      - { name: tax_year, type: integer, source: input, description: "Forecast tax year" }
      - { name: variant, type: enum, source: input, description: "NOTICE_BASED | RENDERED_CONSERVATIVE", constraints: "enum: NOTICE_BASED, RENDERED_CONSERVATIVE" }
      - { name: as_of_date, type: datetime, source: input, description: "Forecast as-of date; must be >= date(tax_year, 01, 01)" }
      - { name: forecasted_liability_cents, type: integer, source: computed, description: "Forecast per accrual_forecast calculation" }
      - { name: component_count, type: integer, source: computed, description: "Number of renditions included in the forecast input set" }
      - { name: forecast_status, type: enum, source: system, description: "PUBLISHED | SUPERSEDED", default: "PUBLISHED", constraints: "enum: PUBLISHED, SUPERSEDED" }
      - { name: needs_regeneration, type: boolean, source: computed, description: "True when an underlying rendition total, notice final value, or rendition set changed after publish", default: false }
      - { name: published_by_operator_id, type: string, source: system, description: "Operator.id who published the forecast" }

  - name: AuditEvent
    parent: ClientAccount
    common_fields: false
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> ClientAccount.id; client whose audit trail this event belongs to" }
      - { name: event_type, type: enum, source: system, description: "DISPOSAL_RECORDED | DISPOSAL_REVERSED | DISPOSAL_RECONCILED | RENDITION_FILED | AMENDMENT_OPENED | AMENDMENT_WITHDRAWN | EXTENSION_GRANTED | EXTENSION_SUPERSEDED | NOTICE_FINALIZED | APPEAL_RESOLVED | BILL_VALIDATED | BILL_REVALIDATED | SCHEDULE_CREATED | SCHEDULE_CANCELLED | INSTALLMENT_PAID | INSTALLMENT_LATE | FORECAST_PUBLISHED | FORECAST_STALENESS_FLAGGED | ABATEMENT_TERMINATED | EXEMPTION_SUSPENDED | EXEMPTION_REVOKED", constraints: "enum of listed event types" }
      - { name: message, type: string, source: system, description: "Human-readable description including the affected entity id" }
      - { name: actor_id, type: string, source: system, description: "X-User-ID of the actor whose action caused the event; 'system' for clock sweeps" }

# =============================================================================
# §1.2 State Machine Table (10 machines)
# =============================================================================
state_machines:
  - entity: Asset
    field: lifecycle_status
    initial_state: ACTIVE
    terminal_states: []
    note: "Parallel dimensions: lifecycle_status (this machine) evolves independently of classification_status (UNCLASSIFIED -> CLASSIFIED | OVERRIDDEN). classify is only allowed while lifecycle_status == ACTIVE; disposal does not alter classification_status."
    transitions:
      - from: ACTIVE
        to: DISPOSED
        trigger: "POST /bpp/assets/{asset_id}/disposals"
        actor: TaxAnalyst
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "disposal_date >= date part of acquisition_date"
          - "disposal_date <= current clock date"
        side_effects:
          - "Creates DisposalRecord in RECORDED status (link 1 of disposal cascade)"
          - "Sets asset.disposed_date and asset.disposal_proceeds_cents"
          - "Link 2: every line referencing this asset on a rendition in DRAFT or AMENDMENT_OPEN with rendition.tax_year whose lien date (Jan 1 of tax_year) is strictly after disposal_date gets included=false and exclusion_reason=DISPOSED; lines whose lien date is on or before disposal_date are unchanged"
          - "Link 3: each touched rendition recomputes total_assessed_value_cents via rendition_total_aggregation and bumps version"
          - "Link 4: every AccrualForecast with forecast_status=PUBLISHED for the same client_id and a tax_year whose lien date is strictly after disposal_date gets needs_regeneration=true and bumps version; each flagging appends AuditEvent FORECAST_STALENESS_FLAGGED"
          - "Appends AuditEvent DISPOSAL_RECORDED on the client"
      - from: DISPOSED
        to: ACTIVE
        trigger: "POST /bpp/disposals/{disposal_id}/reverse"
        actor: TaxAnalyst
        preconditions:
          - "The addressed DisposalRecord.disposal_status == RECORDED"
          - "The disposal is the asset's latest disposal (assets carry at most one RECORDED disposal at a time)"
        side_effects:
          - "DisposalRecord.disposal_status -> REVERSED"
          - "Clears asset.disposed_date and asset.disposal_proceeds_cents"
          - "Every line that was excluded with exclusion_reason=DISPOSED for this asset on a rendition in DRAFT or AMENDMENT_OPEN gets included=true, exclusion_reason=null, and its assessed value recomputed via asset_depreciation"
          - "Each touched rendition recomputes total_assessed_value_cents and bumps version"
          - "Each AccrualForecast flagged by the original disposal (and not yet superseded) keeps needs_regeneration=true"
          - "Appends AuditEvent DISPOSAL_REVERSED on the client"

  - entity: Asset
    field: classification_status
    initial_state: UNCLASSIFIED
    terminal_states: []
    transitions:
      - from: UNCLASSIFIED
        to: CLASSIFIED
        trigger: "POST /bpp/assets/{asset_id}/classify with taxable_classification equal to the class rule proposal (rule.is_taxable=true proposes TAXABLE, false proposes NON_TAXABLE)"
        actor: TaxAnalyst
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "A JurisdictionClassRule exists for (asset.jurisdiction_id, asset.category)"
        side_effects:
          - "Sets taxable_classification"
      - from: UNCLASSIFIED
        to: OVERRIDDEN
        trigger: "POST /bpp/assets/{asset_id}/classify with taxable_classification different from the class rule proposal"
        actor: TaxAnalyst
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "A JurisdictionClassRule exists for (asset.jurisdiction_id, asset.category)"
        side_effects:
          - "Sets taxable_classification"
      - from: [CLASSIFIED, OVERRIDDEN]
        to: CLASSIFIED
        trigger: "POST /bpp/assets/{asset_id}/classify with taxable_classification equal to the class rule proposal"
        actor: TaxAnalyst
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "A JurisdictionClassRule exists for (asset.jurisdiction_id, asset.category)"
        side_effects:
          - "Sets taxable_classification; recomputes the line on any rendition in DRAFT or AMENDMENT_OPEN for the asset's jurisdiction whose lien-date rule includes the asset via asset_depreciation, and recomputes that rendition's total via rendition_total_aggregation"
      - from: [CLASSIFIED, OVERRIDDEN]
        to: OVERRIDDEN
        trigger: "POST /bpp/assets/{asset_id}/classify with taxable_classification different from the class rule proposal"
        actor: TaxAnalyst
        preconditions:
          - "lifecycle_status == ACTIVE"
          - "A JurisdictionClassRule exists for (asset.jurisdiction_id, asset.category)"
        side_effects:
          - "Sets taxable_classification; recomputes the line on any rendition in DRAFT or AMENDMENT_OPEN for the asset's jurisdiction whose lien-date rule includes the asset via asset_depreciation, and recomputes that rendition's total via rendition_total_aggregation"

  - entity: DisposalRecord
    field: disposal_status
    initial_state: RECORDED
    terminal_states: [RECONCILED, REVERSED]
    transitions:
      - from: RECORDED
        to: RECONCILED
        trigger: "system (a rendition of the same client_id and the asset's jurisdiction_id whose lien date is strictly after disposal_date transitions to FILED with this asset's line included=false)"
        actor: system
        preconditions:
          - "The filing rendition excludes this asset's line with exclusion_reason=DISPOSED"
        side_effects:
          - "Appends AuditEvent DISPOSAL_RECONCILED on the client"
      - from: RECORDED
        to: REVERSED
        trigger: "POST /bpp/disposals/{disposal_id}/reverse"
        actor: TaxAnalyst
        preconditions: []
        side_effects:
          - "Drives Asset DISPOSED -> ACTIVE (see Asset machine)"

  - entity: Rendition
    field: rendition_status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /bpp/renditions/{rendition_id}/file"
        actor: TaxAnalyst
        preconditions:
          - "At least one line with included=true"
          - "Every ACTIVE asset of the same (client_id, jurisdiction_id) with acquisition_date strictly before date(tax_year, 1, 1) — i.e. owned on the lien date — has classification_status in {CLASSIFIED, OVERRIDDEN}"
          - "Lines have been generated (generate-lines has run at least once)"
        side_effects:
          - "Computes is_late_filing, late_days, late_penalty_months, late_penalty_cents via late_filing_penalty using the current clock date"
          - "Sets filed_at and filed_by_operator_id from headers"
          - "Marks RECORDED disposals of excluded assets RECONCILED (see DisposalRecord machine)"
          - "Flags needs_regeneration=true on PUBLISHED forecasts for (client_id, tax_year) not already covering this rendition (each flagging appends AuditEvent FORECAST_STALENESS_FLAGGED)"
          - "Appends AuditEvent RENDITION_FILED"
      - from: FILED
        to: AMENDMENT_OPEN
        trigger: "POST /bpp/renditions/{rendition_id}/amendments with action=OPEN"
        actor: SeniorManager
        preconditions:
          - "rendition_status == FILED"
          - "Segregation of duties: actor's X-User-ID != filed_by_operator_id"
        side_effects:
          - "Sets amendment_opened_by_operator_id"
          - "Appends AuditEvent AMENDMENT_OPENED"
      - from: AMENDMENT_OPEN
        to: FILED
        trigger: "POST /bpp/renditions/{rendition_id}/file (re-files the amended rendition; cycle)"
        actor: TaxAnalyst
        preconditions:
          - "At least one line with included=true"
          - "Every in-scope ACTIVE asset has classification_status in {CLASSIFIED, OVERRIDDEN}"
        side_effects:
          - "Same late-filing recomputation as DRAFT -> FILED using the current clock date (lateness is recomputed from deadline_date at each filing)"
          - "Updates filed_at and filed_by_operator_id; clears amendment_opened_by_operator_id"
          - "Flags needs_regeneration=true on PUBLISHED forecasts for (client_id, tax_year) (each flagging appends AuditEvent FORECAST_STALENESS_FLAGGED)"
          - "Appends AuditEvent RENDITION_FILED"
      - from: AMENDMENT_OPEN
        to: FILED
        trigger: "POST /bpp/renditions/{rendition_id}/amendments with action=WITHDRAW (compensating action: discards the amendment)"
        actor: SeniorManager
        preconditions:
          - "rendition_status == AMENDMENT_OPEN"
          - "Segregation of duties: actor's X-User-ID != filed_by_operator_id"
        side_effects:
          - "Regenerates lines from the last filed snapshot: total_assessed_value_cents, is_late_filing, late_days, late_penalty_months, late_penalty_cents all return to the values captured at the last filing"
          - "Clears amendment_opened_by_operator_id"
          - "Appends AuditEvent AMENDMENT_WITHDRAWN"
      - from: FILED
        to: ACCEPTED
        trigger: "system (the linked AssessmentNotice reaches FINALIZED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FilingExtension
    field: extension_status
    initial_state: GRANTED
    terminal_states: [SUPERSEDED, EXPIRED]
    note: "Creation grants immediately when requested_extend_to_date <= base deadline + max_extension_days; beyond that the request is rejected with ERR_EXTENSION_EXCEEDS_MAX (no DENIED record is persisted). A new GRANTED extension supersedes the rendition's previous GRANTED extension."
    transitions:
      - from: GRANTED
        to: SUPERSEDED
        trigger: "system (a new FilingExtension for the same rendition is created and GRANTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Rendition.deadline_date moves to the newly granted requested_extend_to_date"
          - "Appends AuditEvent EXTENSION_SUPERSEDED"
      - from: GRANTED
        to: EXPIRED
        trigger: "system (clock sweep: current date > requested_extend_to_date and rendition still not FILED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: AssessmentNotice
    field: notice_status
    initial_state: RECEIVED
    terminal_states: [FINALIZED]
    transitions:
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /bpp/assessment-notices/{notice_id}/accept"
        actor: TaxAnalyst
        preconditions:
          - "notice_status == RECEIVED"
        side_effects: []
      - from: [RECEIVED, ACCEPTED]
        to: PROTESTED
        trigger: "system (POST /bpp/assessment-notices/{notice_id}/appeals creates an Appeal)"
        actor: system
        preconditions:
          - "Current clock date <= protest_deadline_date (filing exactly on the deadline date is allowed)"
        side_effects: []
      - from: PROTESTED
        to: FINALIZED
        trigger: "system (appeal resolves: Appeal ACCEPTED applies decided_value_cents; Appeal CLOSED from ESCALATED applies board_value_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Sets final_value_cents to the decided or board value"
          - "Linked Rendition FILED -> ACCEPTED"
          - "Every TaxBill of this notice with validation_status != PENDING is revalidated via tax_bill_validation (AuditEvent BILL_REVALIDATED); each revalidated bill cancels installments in SCHEDULED or LATE status and sets unscheduled_amount_cents = validated_amount_cents - sum(PAID installments), then recomputes payment_status"
          - "Every TaxBill of this notice with validation_status == PENDING is left untouched"
          - "Flags needs_regeneration=true on PUBLISHED forecasts for the client and tax year (each flagging appends AuditEvent FORECAST_STALENESS_FLAGGED)"
          - "Appends AuditEvent NOTICE_FINALIZED"
      - from: [RECEIVED, ACCEPTED]
        to: FINALIZED
        trigger: "system (clock sweep: current date > protest_deadline_date and notice not PROTESTED)"
        actor: system
        preconditions: []
        side_effects:
          - "Sets final_value_cents = notice_value_cents"
          - "Linked Rendition FILED -> ACCEPTED"
          - "Appends AuditEvent NOTICE_FINALIZED"

  - entity: Appeal
    field: appeal_status
    initial_state: FILED
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: FILED
        to: HEARING_SCHEDULED
        trigger: "POST /bpp/appeals/{appeal_id}/schedule-hearing"
        actor: AssessorClerk
        preconditions:
          - "appeal_status == FILED"
        side_effects:
          - "Sets hearing_date"
      - from: HEARING_SCHEDULED
        to: DECIDED
        trigger: "POST /bpp/appeals/{appeal_id}/record-decision"
        actor: AssessorClerk
        preconditions:
          - "appeal_status == HEARING_SCHEDULED"
          - "decision == GRANTED_REDUCTION requires decided_value_cents < linked notice's notice_value_cents; decision == DENIED requires decided_value_cents == notice_value_cents"
        side_effects:
          - "Sets decision and decided_value_cents"
      - from: DECIDED
        to: ACCEPTED
        trigger: "POST /bpp/appeals/{appeal_id}/resolve with resolution=ACCEPT (fork branch 1)"
        actor: Client
        preconditions:
          - "appeal_status == DECIDED"
          - "Acting client's X-User-ID == the client_id reached via appeal.notice_id -> AssessmentNotice.rendition_id -> Rendition.client_id"
        side_effects:
          - "Applies decided_value_cents: linked AssessmentNotice PROTESTED -> FINALIZED with final_value_cents = decided_value_cents (cascade link 2: bill revalidation; link 3: installment cancellation — see AssessmentNotice machine)"
          - "Appends AuditEvent APPEAL_RESOLVED"
      - from: DECIDED
        to: ESCALATED
        trigger: "POST /bpp/appeals/{appeal_id}/resolve with resolution=ESCALATE (fork branch 2 — divergent side effects: the notice value is NOT changed and bills are NOT revalidated)"
        actor: Client
        preconditions:
          - "appeal_status == DECIDED"
          - "Acting client's X-User-ID == the client_id reached via appeal.notice_id -> AssessmentNotice.rendition_id -> Rendition.client_id"
        side_effects:
          - "Notice stays PROTESTED; no bill revalidation fires"
      - from: ACCEPTED
        to: CLOSED
        trigger: "POST /bpp/appeals/{appeal_id}/close"
        actor: Client
        preconditions:
          - "appeal_status == ACCEPTED"
          - "Acting client's X-User-ID == the client_id reached via appeal.notice_id -> AssessmentNotice.rendition_id -> Rendition.client_id"
        side_effects: []
      - from: ESCALATED
        to: CLOSED
        trigger: "POST /bpp/appeals/{appeal_id}/close with board_value_cents (join of the fork: the board decision now applies)"
        actor: AssessorClerk
        preconditions:
          - "appeal_status == ESCALATED"
          - "board_value_cents is present and > 0"
        side_effects:
          - "Sets board_value_cents"
          - "Linked AssessmentNotice PROTESTED -> FINALIZED with final_value_cents = board_value_cents (same bill/forecast cascade as the ACCEPT branch)"
          - "Appends AuditEvent APPEAL_RESOLVED"
      - from: [FILED, HEARING_SCHEDULED]
        to: WITHDRAWN
        trigger: "POST /bpp/appeals/{appeal_id}/withdraw"
        actor: TaxAnalyst
        preconditions:
          - "appeal_status in {FILED, HEARING_SCHEDULED}"
        side_effects:
          - "Linked AssessmentNotice returns from PROTESTED to its pre-appeal status (RECEIVED if never accepted, ACCEPTED if it had been accepted)"

  - entity: TaxBill
    field: validation_status
    initial_state: PENDING
    terminal_states: []
    note: "Parallel dimensions: validation_status (this machine) evolves independently of payment_status (derived from installments). Notice finalization can revalidate a bill in MATCHED or DISCREPANCY without any call to validate. payment_status derivation (pinned, evaluated in this order on every installment change): let paid_sum = sum of PAID installment amounts, active = installments in {SCHEDULED, LATE}: (1) paid_sum == 0 and no active -> UNSCHEDULED; (2) no active and unscheduled_amount_cents == 0 -> PAID; (3) no active and unscheduled_amount_cents > 0 -> PARTIALLY_PAID; (4) any LATE installment -> DELINQUENT; (5) paid_sum > 0 -> PARTIALLY_PAID; (6) otherwise -> SCHEDULED."
    transitions:
      - from: PENDING
        to: MATCHED
        trigger: "POST /bpp/tax-bills/{bill_id}/validate with |variance_cents| <= 100"
        actor: SeniorManager
        preconditions:
          - "validation_status == PENDING"
          - "Segregation of duties: actor's X-User-ID != created_by_operator_id"
        side_effects:
          - "Runs tax_bill_validation; sets validated_amount_cents, variance_cents, unscheduled_amount_cents = validated_amount_cents, validated_by_operator_id"
          - "Appends AuditEvent BILL_VALIDATED"
      - from: PENDING
        to: DISCREPANCY
        trigger: "POST /bpp/tax-bills/{bill_id}/validate with |variance_cents| > 100"
        actor: SeniorManager
        preconditions:
          - "validation_status == PENDING"
          - "Segregation of duties: actor's X-User-ID != created_by_operator_id"
        side_effects:
          - "Same computed-field updates as the MATCHED branch"
          - "Appends AuditEvent BILL_VALIDATED"
      - from: [MATCHED, DISCREPANCY]
        to: MATCHED
        trigger: "system (notice finalization cascade revalidates the bill)"
        actor: system
        preconditions: []
        side_effects:
          - "Recomputes validated_amount_cents and variance_cents; cancels SCHEDULED/LATE installments; unscheduled_amount_cents = validated_amount_cents - sum(PAID); payment_status recomputed; AuditEvent BILL_REVALIDATED"
      - from: [MATCHED, DISCREPANCY]
        to: DISCREPANCY
        trigger: "system (notice finalization cascade revalidates the bill)"
        actor: system
        preconditions: []
        side_effects:
          - "Same as the MATCHED auto-branch"

  - entity: TaxBill
    field: payment_status
    initial_state: UNSCHEDULED
    terminal_states: []
    note: "payment_status is a pure derivation over installments, recomputed on every installment change: no non-CANCELLED installments -> UNSCHEDULED; else all non-CANCELLED PAID -> PAID; else any LATE -> DELINQUENT; else any PAID -> PARTIALLY_PAID; else SCHEDULED."
    transitions:
      - from: UNSCHEDULED
        to: SCHEDULED
        trigger: "POST /bpp/tax-bills/{bill_id}/payment-schedule"
        actor: TaxAnalyst
        preconditions:
          - "validation_status in {MATCHED, DISCREPANCY} (paying under protest is allowed: the linked notice may still be PROTESTED)"
          - "validated_amount_cents > 0"
          - "payment_status == UNSCHEDULED"
        side_effects:
          - "Generates installment_count installments per installment_split (equal split, remainder cents to the first installment, due dates 30 days apart starting at bill due_date); unscheduled_amount_cents -> 0"
          - "Appends AuditEvent SCHEDULED_CREATED"
      - from: [SCHEDULED, PARTIALLY_PAID, DELINQUENT]
        to: UNSCHEDULED
        trigger: "POST /bpp/tax-bills/{bill_id}/payment-schedule/cancel"
        actor: TaxAnalyst
        preconditions:
          - "payment_status in {SCHEDULED, PARTIALLY_PAID, DELINQUENT}"
          - "No installment is PAID when cancelling to a clean slate: allowed with PAID installments only when unscheduled remainder covers them — precisely: installments in SCHEDULED or LATE become CANCELLED; PAID installments are kept"
        side_effects:
          - "unscheduled_amount_cents = validated_amount_cents - sum(PAID installments)"
          - "payment_status recomputed by the derivation rule (UNSCHEDULED when nothing PAID, else PARTIALLY_PAID)"
          - "Appends AuditEvent SCHEDULED_CANCELLED"
      - from: [SCHEDULED, PARTIALLY_PAID, DELINQUENT]
        to: PARTIALLY_PAID
        trigger: "POST /bpp/tax-bills/{bill_id}/pay-installment (not all installments PAID after this payment)"
        actor: Client
        preconditions:
          - "installment.installment_status in {SCHEDULED, LATE}"
          - "Acting client's X-User-ID == client reached via bill.notice_id -> AssessmentNotice.rendition_id -> Rendition.client_id"
        side_effects:
          - "installment -> PAID with paid_date = current clock date"
          - "unscheduled_amount_cents unchanged (installment was already scheduled)"
          - "Appends AuditEvent INSTALLMENT_PAID"
      - from: [SCHEDULED, PARTIALLY_PAID, DELINQUENT]
        to: PAID
        trigger: "POST /bpp/tax-bills/{bill_id}/pay-installment (last outstanding installment)"
        actor: Client
        preconditions:
          - "installment.installment_status in {SCHEDULED, LATE}"
          - "Acting client's X-User-ID == the bill's client"
        side_effects:
          - "installment -> PAID; all installments now PAID"
      - from: [SCHEDULED, PARTIALLY_PAID]
        to: DELINQUENT
        trigger: "system (clock sweep: an installment in SCHEDULED has due_date strictly before the current clock date -> installment LATE)"
        actor: system
        preconditions: []
        side_effects:
          - "installment_status SCHEDULED -> LATE"
          - "Appends AuditEvent INSTALLMENT_LATE"

  - entity: ExemptionApplication
    field: application_status
    initial_state: DRAFT
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /bpp/exemption-applications/{application_id}/submit"
        actor: TaxAnalyst
        preconditions:
          - "application_status == DRAFT"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /bpp/exemption-applications/{application_id}/review with decision=APPROVE"
        actor: AssessorClerk
        preconditions:
          - "application_status == SUBMITTED"
        side_effects:
          - "The exemption participates in tax_bill_validation from approval onward"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /bpp/exemption-applications/{application_id}/review with decision=DENY"
        actor: AssessorClerk
        preconditions:
          - "application_status == SUBMITTED"
        side_effects: []
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /bpp/exemption-applications/{application_id}/compliance with action=SUSPEND (compliance failure)"
        actor: AssessorClerk
        preconditions:
          - "application_status == APPROVED"
        side_effects:
          - "Sets suspended_date = current clock date"
          - "The exemption no longer reduces tax_bill_validation while SUSPENDED"
          - "Appends AuditEvent EXEMPTION_SUSPENDED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /bpp/exemption-applications/{application_id}/compliance with action=REINSTATE (cycle)"
        actor: AssessorClerk
        preconditions:
          - "application_status == SUSPENDED"
        side_effects:
          - "Clears suspended_date; exemption reduces tax_bill_validation again"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (clock sweep: current date > suspended_date + 90 days)"
        actor: system
        preconditions: []
        side_effects:
          - "Appends AuditEvent EXEMPTION_REVOKED"

  - entity: AbatementAgreement
    field: agreement_status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: RECERTIFICATION_DUE
        trigger: "system (clock sweep: current date >= Jan 1 of (last_recertified_year + 1) and last_recertified_year + 1 <= last_tax_year)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RECERTIFICATION_DUE
        to: ACTIVE
        trigger: "POST /bpp/abatements/{agreement_id}/recertify (annual compliance cycle)"
        actor: TaxAnalyst
        preconditions:
          - "agreement_status == RECERTIFICATION_DUE"
          - "tax_year == last_recertified_year + 1"
        side_effects:
          - "last_recertified_year = tax_year"
      - from: [ACTIVE, RECERTIFICATION_DUE]
        to: TERMINATED
        trigger: "POST /bpp/abatements/{agreement_id}/terminate"
        actor: AssessorClerk
        preconditions:
          - "agreement_status in {ACTIVE, RECERTIFICATION_DUE}"
        side_effects:
          - "The abatement no longer reduces tax_bill_validation"
          - "Every TaxBill with validation_status in {MATCHED, DISCREPANCY} whose notice's rendition covers this asset's (client_id, jurisdiction_id) and whose tax_year is covered by the agreement interval is revalidated via tax_bill_validation (clawback lands in validated_amount_cents); SCHEDULED/LATE installments are cancelled and unscheduled_amount_cents reset per the bill cascade rule"
          - "Flags needs_regeneration=true on PUBLISHED forecasts for the client whose tax_year is covered by the agreement interval (each flagging appends AuditEvent FORECAST_STALENESS_FLAGGED)"
          - "Appends AuditEvent ABATEMENT_TERMINATED"

  - entity: AccrualForecast
    field: forecast_status
    initial_state: PUBLISHED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: SUPERSEDED
        trigger: "system (a new AccrualForecast for the same (client_id, tax_year) is created and published)"
        actor: system
        preconditions: []
        side_effects:
          - "Superseded forecasts remain readable via the client sub-collection"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only — true CREATE-with-supersede races)
# =============================================================================
concurrency_rules:
  - rule_id: extension-create-stale-rendition
    parent_entity: Rendition
    write_endpoint: "POST /bpp/renditions/{rendition_id}/extensions"
    occ_field: expected_rendition_version
    description: |
      Creating a FilingExtension against a Rendition whose version has advanced
      since the client last observed it is rejected. A granted extension
      legitimately supersedes the prior one and moves deadline_date, so a writer
      holding a stale rendition view must not silently overwrite the newer
      deadline; the stale writer is rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: forecast-create-stale-client
    parent_entity: ClientAccount
    write_endpoint: "POST /bpp/clients/{client_id}/accrual-forecasts"
    occ_field: expected_client_version
    description: |
      Publishing an AccrualForecast against a ClientAccount whose version has
      advanced since the client last observed it is rejected. A new forecast for
      the same (client, tax_year) legitimately supersedes the prior PUBLISHED
      forecast, so a writer holding a stale client view is rejected with
      ERR_STALE_VERSION instead of silently superseding a forecast it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table (6 calculations)
# =============================================================================
calculations:
  - name: asset_depreciation
    trigger: "generate-lines; disposal reverse (line reinstatement); classify changing a line on a DRAFT or AMENDMENT_OPEN rendition"
    algorithm: table_lookup
    formula: |
      Rule R = JurisdictionClassRule for (asset.jurisdiction_id, asset.category).
      Convention FULL_YEAR:
        age = tax_year - year(asset.acquisition_date)
      Convention HALF_YEAR:
        age = tax_year - year(asset.in_service_date) - (1 if asset.in_service_date >= July 1 of its year else 0)
      age is clamped below at 0.
      percent_good =
        R.percent_good_vector[age]            if age < len(R.percent_good_vector)
        R.percent_good_floor_pct              otherwise
      raw = asset.acquisition_cost_cents * percent_good / 100
      assessed_value_cents = round_half_up(raw) to whole cents
      Line inclusion (evaluated after rounding):
        excluded with exclusion_reason=DISPOSED when the asset has a RECORDED or
          RECONCILED disposal with disposal_date strictly before date(tax_year,1,1)
        excluded with exclusion_reason=DEMINIMIS when assessed_value_cents is
          STRICTLY BELOW R.de_minimis_line_cents (equal to the floor is kept)
        excluded with exclusion_reason=NON_TAXABLE when the asset's
          taxable_classification == NON_TAXABLE (UNCLASSIFIED assets use the
          rule proposal: is_taxable=false counts as NON_TAXABLE)
        otherwise included=true
    input_set: "Assets of (client_id, jurisdiction_id) in any lifecycle_status with acquisition_date strictly before date(tax_year, 1, 1) — the asset must have been owned on the lien date; inclusion on a line is then decided by the disposal, de-minimis, and classification rules above"
    constants:
      HALF_YEAR_CUTOFF_MONTH: 7
    precision: "0 decimal places (whole cents), round_half_up applied per line"
    variants:
      - name: full_year_convention
        when: "Rule's depreciation_convention == FULL_YEAR"
        difference: "Age derives from acquisition_date year only; an asset acquired any time in year Y has age = tax_year - Y"
      - name: half_year_convention
        when: "Rule's depreciation_convention == HALF_YEAR"
        difference: "Assets placed in service on or after July 1 depreciate one age step slower; identical asset data yields a smaller age and a larger assessed value than FULL_YEAR"

  - name: rendition_total_aggregation
    trigger: "generate-lines; line inclusion flips from disposal / disposal reverse / classify; amendment withdraw (restore filed snapshot)"
    algorithm: aggregation
    formula: |
      ROUNDING ORDER IS PINNED: round each line FIRST, then sum.
      total_assessed_value_cents = sum over lines where included == true of
        assessed_value_cents (already rounded per line by asset_depreciation)
      The alternative order (sum raw unrounded products, round once at the end)
      is FORBIDDEN: per-line rounding is applied before aggregation.
      Lines are numbered line_no = 1..N in the order produced by sorting the
      in-scope asset set by (acquisition_date ASC, created_at ASC).
    input_set: "lines of the rendition with included == true"
    precision: "0 decimal places (whole cents); rounding happens only at line level"

  - name: late_filing_penalty
    trigger: "rendition file (both DRAFT->FILED and AMENDMENT_OPEN->FILED)"
    algorithm: threshold
    formula: |
      deadline = rendition.deadline_date  (base deadline possibly moved by extension)
      filed_date = current clock date (date part of filed_at)
      late_days = max(0, filed_date - deadline) in whole days
        -- filed exactly ON deadline_date: late_days = 0 (boundary: '>' not '>=')
      penalty_months = ceil(late_days / 30)          -- 1..30 days => 1 month
      penalty_pct = min(penalty_months * J.late_penalty_pct_per_month,
                        J.max_late_penalty_pct)
      Base selection (conditional branch on J.penalty_base):
        VALUE_BASE: base = rendition.total_assessed_value_cents
        TAX_BASE:   base = round_half_up(rendition.total_assessed_value_cents * J.tax_rate)
      late_penalty_cents = round_half_up(base * penalty_pct / 100)
      is_late_filing = (late_days > 0)
    input_set: "the filing rendition and its jurisdiction J"
    constants:
      DAYS_PER_PENALTY_MONTH: 30
    precision: "0 decimal places (whole cents), round_half_up; TAX_BASE applies a nested rounding of the tax base BEFORE the penalty percent"

  - name: tax_bill_validation
    trigger: "POST /bpp/tax-bills/{bill_id}/validate; system revalidation on notice finalization; system revalidation on abatement termination"
    algorithm: constraint_propagation
    formula: |
      EVALUATION ORDER IS PINNED (the exemption cap depends on the gross tax,
      which depends on the value BEFORE the exemption credit — steps must run
      in exactly this order):
      Let V = linked notice value:
        notice_status == FINALIZED -> V = final_value_cents
        otherwise                  -> V = notice_value_cents
      Step 1: gross_cents = round_half_up(V * bill.tax_rate)
      Line share: for an incentive attached to asset X on the notice's
        rendition, V_line(X) = round_half_up(V * line(X).assessed_value_cents /
        rendition.total_assessed_value_cents) using the line from the last
        filing (the rendition total is guaranteed > 0 because filing requires
        at least one included line). For a single-line rendition V_line == V.
      Step 2: exemption_credit_cents = min(
                round_half_up(round_half_up(V_line(Xe) * E.exemption_pct / 100) * bill.tax_rate),
                round_half_up(gross_cents * EXEMPTION_TAX_CAP_PCT / 100))
              where E = the asset-linked APPROVED ExemptionApplication whose
                [effective_date, expiration_date) half-open interval contains
                date(notice tax_year, 1, 1) for an asset Xe on the notice's
                rendition; at most one exemption applies per bill: if several
                qualify, pick the one with the largest exemption_pct; tie-break
                by created_at ASC of the application. If none qualify,
                exemption_credit_cents = 0.
      Step 3: abatement_credit_cents = min(
                round_half_up(round_half_up(V_line(Xa) * A.abatement_pct / 100) * bill.tax_rate),
                gross_cents - exemption_credit_cents)
              where A = the AbatementAgreement with agreement_status in
                {ACTIVE, RECERTIFICATION_DUE} whose closed interval
                [first_tax_year, last_tax_year] contains the notice tax_year
                for an asset Xa on the notice's rendition; at most one applies
                (overlap rules guarantee uniqueness); 0 if none.
      Step 4: late_cents = rendition.late_penalty_cents when J.penalty_base ==
                VALUE_BASE applies at rendition level AND the bill's due_date
                is after the rendition deadline; otherwise late_cents = 0.
                (For the benchmark fixtures: bills imported for a late-filed
                rendition carry late_cents = rendition.late_penalty_cents.)
      validated_amount_cents = gross_cents - exemption_credit_cents
                               - abatement_credit_cents + late_cents
      variance_cents = billed_amount_cents - validated_amount_cents
      validation_status = MATCHED when |variance_cents| <= 100 else DISCREPANCY
    input_set: "the bill, its notice, the notice's rendition, the rendition's client assets, their APPROVED exemptions and ACTIVE/RECERTIFICATION_DUE abatements"
    constants:
      EXEMPTION_TAX_CAP_PCT: 50
      VARIANCE_TOLERANCE_CENTS: 100
    precision: "0 decimal places (whole cents), round_half_up at each numbered step before the next step consumes the value"

  - name: accrual_forecast
    trigger: "POST /bpp/clients/{client_id}/accrual-forecasts"
    algorithm: forward_looking
    formula: |
      Input set S = renditions R with R.client_id == client, R.tax_year ==
        forecast.tax_year, R.rendition_status IN {FILED, AMENDMENT_OPEN, ACCEPTED}
        (DRAFT renditions are EXCLUDED).
      component_count = |S|
      variant NOTICE_BASED (optimistic — county values as noticed):
        for each R in S: N = the latest AssessmentNotice of R (by created_at ASC,
          last one wins); R contributes only when N exists;
          value = N.final_value_cents if N.notice_status == FINALIZED
                  else N.notice_value_cents
          liability += round_half_up(value * R.jurisdiction.tax_rate)
      variant RENDERED_CONSERVATIVE (pessimistic — rendered values plus uplift):
        for each R in S: value = R.total_assessed_value_cents (renditions with
          no notice still contribute);
          liability += round_half_up(round_half_up(value * (100 + UPLIFT_PCT) / 100) * R.jurisdiction.tax_rate)
      forecasted_liability_cents = liability
    input_set: "Renditions of the client in the forecast tax year filtered by status; notices joined per rendition"
    constants:
      UPLIFT_PCT: 10
    precision: "0 decimal places (whole cents), round_half_up per component before summing"
    variants:
      - name: notice_based
        when: "variant == NOTICE_BASED"
        difference: "Uses county-assessed values; renditions without any notice contribute NOTHING; identical data yields a different total than RENDERED_CONSERVATIVE"
      - name: rendered_conservative
        when: "variant == RENDERED_CONSERVATIVE"
        difference: "Uses filed rendition values inflated by UPLIFT_PCT; renditions without notices DO contribute; identical data yields a different total than NOTICE_BASED"

  - name: installment_split
    trigger: "POST /bpp/tax-bills/{bill_id}/payment-schedule"
    algorithm: waterfall_allocation
    formula: |
      n = installment_count (1..4)
      base = floor(validated_amount_cents / n)
      remainder = validated_amount_cents - base * n
      installments ordered by installment_no 1..n:
        installment 1 amount = base + remainder (remainder cents go to the FIRST
          installment — pinned, not the last)
        installments 2..n amount = base
      due dates: installment i due_date = bill.due_date + (i-1) * 30 days
      sum of all installment amounts == validated_amount_cents exactly
    input_set: "the bill's validated_amount_cents"
    constants:
      MAX_INSTALLMENTS: 4
      INSTALLMENT_SPACING_DAYS: 30
    precision: "0 decimal places (whole cents); floor division with remainder assigned to installment_no 1"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present; X-User-Role is one of FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client; for entity_backed roles X-User-ID identifies an existing Operator (TaxAnalyst/SeniorManager) or ClientAccount (Client)"
    error_id: ERR_MISSING_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "The role is permitted for this endpoint per the endpoint's roles list; for Client actions the X-User-ID must own the resource via the FK chain (appeal/bill -> notice -> rendition -> client_id)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 4
    category: existence
    check: "Request body is well-formed: required fields present, enum values valid, integer ranges respected (acquisition_cost_cents > 0, exemption_pct 1-100, abatement_pct 1-100, installment_count 1-4, last_tax_year >= first_tax_year, effective_date < expiration_date), and asset_tag unique per client"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 5
    category: state
    check: "Generic state precondition: the target resource's current state permits the requested transition (reverse a non-RECORDED disposal; classify a DISPOSED asset; recertify an ACTIVE agreement; create a notice on a DRAFT or AMENDMENT_OPEN rendition; submit an exemption application whose linked asset is DISPOSED — cross-entity state gate of ExemptionApplication on Asset)"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "state transition endpoints"
  - priority: 6
    category: state
    check: "Filing a rendition that is already FILED and not in AMENDMENT_OPEN; requesting an extension on a rendition that is not in DRAFT"
    error_id: ERR_RENDITION_ALREADY_FILED
    http_status: 409
    applies_to: "POST /bpp/renditions/{rendition_id}/file; POST /bpp/renditions/{rendition_id}/extensions"
  - priority: 7
    category: state
    check: "Amendment action requires the rendition to be FILED (OPEN) or AMENDMENT_OPEN (WITHDRAW); generate-lines requires DRAFT or AMENDMENT_OPEN"
    error_id: ERR_AMENDMENT_STATE_MISMATCH
    http_status: 409
    applies_to: "POST /bpp/renditions/{rendition_id}/amendments; POST /bpp/renditions/{rendition_id}/generate-lines"
  - priority: 8
    category: state
    check: "Appeal creation requires the notice to be in RECEIVED or ACCEPTED (not PROTESTED, not FINALIZED)"
    error_id: ERR_NOTICE_NOT_APPEALABLE
    http_status: 409
    applies_to: "POST /bpp/assessment-notices/{notice_id}/appeals"
  - priority: 9
    category: state
    check: "Actions on an appeal in a terminal state (CLOSED, WITHDRAWN), or from a state that does not offer the transition (record-decision before hearing, resolve before decision, close from FILED)"
    error_id: ERR_APPEAL_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /bpp/appeals/{appeal_id}/* action endpoints"
  - priority: 10
    category: state
    check: "Bill creation requires notice_status in {ACCEPTED, PROTESTED, FINALIZED} (RECEIVED means the firm has not finished reviewing); validate requires validation_status == PENDING; payment-schedule requires validation_status in {MATCHED, DISCREPANCY} and payment_status == UNSCHEDULED"
    error_id: ERR_BILL_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /bpp/assessment-notices/{notice_id}/tax-bills; POST /bpp/tax-bills/{bill_id}/validate; POST /bpp/tax-bills/{bill_id}/payment-schedule"
  - priority: 11
    category: state
    check: "Segregation of duties: the SeniorManager opening or withdrawing a rendition amendment must not be the operator who filed it (filed_by_operator_id); the SeniorManager validating a bill must not be the operator who imported it (created_by_operator_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /bpp/renditions/{rendition_id}/amendments; POST /bpp/tax-bills/{bill_id}/validate"
  - priority: 12
    category: state
    check: "OCC: expected_rendition_version == current rendition.version (extensions); expected_client_version == current client.version (forecast publish)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bpp/renditions/{rendition_id}/extensions; POST /bpp/clients/{client_id}/accrual-forecasts"
  - priority: 13
    category: business_referential
    check: "Referenced configuration exists: classify and generate-lines require a JurisdictionClassRule for (jurisdiction, category) covering every in-scope asset"
    error_id: ERR_CLASS_RULE_MISSING
    http_status: 422
    applies_to: "POST /bpp/assets/{asset_id}/classify; POST /bpp/renditions/{rendition_id}/generate-lines"
  - priority: 14
    category: business_referential
    check: "The asset's jurisdiction offers the requested exemption_type (offered_exemption_types contains it)"
    error_id: ERR_EXEMPTION_PROGRAM_UNAVAILABLE
    http_status: 422
    applies_to: "POST /bpp/assets/{asset_id}/exemption-applications"
  - priority: 15
    category: business_temporal
    check: "Appeal filing window: current clock date <= notice.protest_deadline_date (filing exactly on the deadline date is allowed)"
    error_id: ERR_PROTEST_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /bpp/assessment-notices/{notice_id}/appeals"
  - priority: 16
    category: business_temporal
    check: "Extension window: current clock date <= rendition.deadline_date (extensions cannot be requested after the effective deadline has passed)"
    error_id: ERR_EXTENSION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /bpp/renditions/{rendition_id}/extensions"
  - priority: 17
    category: business_temporal
    check: "Disposal dates: disposal_date >= date part of asset.acquisition_date and disposal_date <= current clock date"
    error_id: ERR_INVALID_DISPOSAL_DATE
    http_status: 422
    applies_to: "POST /bpp/assets/{asset_id}/disposals"
  - priority: 18
    category: business_constraint
    check: "Uniqueness: at most one rendition per (client_id, jurisdiction_id, tax_year)"
    error_id: ERR_DUPLICATE_RENDITION
    http_status: 409
    applies_to: "POST /bpp/renditions"
  - priority: 19
    category: business_constraint
    check: "At most one class rule per (jurisdiction_id, category)"
    error_id: ERR_DUPLICATE_CLASS_RULE
    http_status: 409
    applies_to: "POST /bpp/class-rules"
  - priority: 20
    category: business_constraint
    check: "Filing completeness: every in-scope ACTIVE asset (owned on the lien date, i.e. acquisition_date strictly before Jan 1 of tax_year) has classification_status in {CLASSIFIED, OVERRIDDEN}"
    error_id: ERR_UNCLASSIFIED_ASSETS
    http_status: 422
    applies_to: "POST /bpp/renditions/{rendition_id}/file"
  - priority: 21
    category: business_constraint
    check: "Filing requires at least one line with included=true"
    error_id: ERR_EMPTY_RENDITION
    http_status: 422
    applies_to: "POST /bpp/renditions/{rendition_id}/file"
  - priority: 22
    category: business_constraint
    check: "Abatement coverage conflict: no other AbatementAgreement for the same asset with agreement_status in {ACTIVE, RECERTIFICATION_DUE} may have a CLOSED year interval intersecting [first_tax_year, last_tax_year] (sharing an endpoint year IS an intersection)"
    error_id: ERR_ABATEMENT_OVERLAP
    http_status: 409
    applies_to: "POST /bpp/assets/{asset_id}/abatements"
  - priority: 23
    category: business_constraint
    check: "Exemption period conflict: no other ExemptionApplication for the same asset and exemption_type with application_status in {SUBMITTED, APPROVED, SUSPENDED} may have a HALF-OPEN date interval [effective_date, expiration_date) intersecting the requested one (expiration_date == effective_date of the other is NOT an intersection)"
    error_id: ERR_EXEMPTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /bpp/assets/{asset_id}/exemption-applications"
  - priority: 24
    category: business_constraint
    check: "Extension ceiling: requested_extend_to_date <= base deadline + jurisdiction.max_extension_days"
    error_id: ERR_EXTENSION_EXCEEDS_MAX
    http_status: 422
    applies_to: "POST /bpp/renditions/{rendition_id}/extensions"
  - priority: 25
    category: business_constraint
    check: "Appeal claim sanity: claimed_value_cents <= notice.notice_value_cents"
    error_id: ERR_CLAIM_EXCEEDS_NOTICE
    http_status: 422
    applies_to: "POST /bpp/assessment-notices/{notice_id}/appeals"
  - priority: 26
    category: business_constraint
    check: "Forecast window sanity: as_of_date >= date(tax_year, 1, 1)"
    error_id: ERR_FORECAST_INPUT_INVALID
    http_status: 422
    applies_to: "POST /bpp/clients/{client_id}/accrual-forecasts"
  - priority: 27
    category: business_temporal
    check: "Clock monotonicity: set-current-utc target must be strictly after the current logical clock value"
    error_id: ERR_CLOCK_MONOTONIC
    http_status: 400
    applies_to: "POST /bpp/_clock/set-current-utc"
  - priority: 28
    category: business_fiscal
    check: "Exemption ceiling: exemption_pct <= jurisdiction.max_exemption_pct for the asset's jurisdiction"
    error_id: ERR_EXEMPTION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /bpp/assets/{asset_id}/exemption-applications"
  - priority: 29
    category: business_fiscal
    check: "Payment scheduling requires validated_amount_cents > 0"
    error_id: ERR_ZERO_SCHEDULE_AMOUNT
    http_status: 422
    applies_to: "POST /bpp/tax-bills/{bill_id}/payment-schedule"

# =============================================================================
# §1.5 API Endpoint Table (56 endpoints)
# =============================================================================
endpoints:
  # --- Client accounts ---
  - method: POST
    path: "/bpp/clients"
    description: "Onboard a client account"
    roles: [FirmAdmin]
    code: 201
    input: [legal_name, contact_email]
    output: ClientAccount
    side_effects: ["forecast_sequence=0"]
  - method: GET
    path: "/bpp/clients/{client_id}"
    description: "Read a client account"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: []
    output: ClientAccount
    side_effects: []
  - method: GET
    path: "/bpp/clients/{id}/accrual-forecasts"
    description: "List forecasts of a client (includes SUPERSEDED)"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["tax_year?", "variant?", "forecast_status?"]
    output: "AccrualForecast[]"
    side_effects: []
  - method: GET
    path: "/bpp/clients/{id}/audit-events"
    description: "List the client's audit trail, ordered by created_at ASC"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["event_type?"]
    output: "AuditEvent[]"
    side_effects: []
  - method: POST
    path: "/bpp/clients/{client_id}/accrual-forecasts"
    description: "Publish an accrual forecast (supersedes the prior PUBLISHED forecast for the same tax_year; OCC on client version)"
    roles: [SeniorManager]
    code: 201
    input: [tax_year, variant, as_of_date, expected_client_version]
    output: AccrualForecast
    side_effects:
      - "Runs accrual_forecast for the given variant"
      - "Prior PUBLISHED forecast for (client_id, tax_year) -> SUPERSEDED"
      - "increments ClientAccount.version by 1"
      - "increments ClientAccount.forecast_sequence by 1"
      - "Appends AuditEvent FORECAST_PUBLISHED"

  # --- Operators ---
  - method: POST
    path: "/bpp/operators"
    description: "Register a firm operator (analyst or senior manager)"
    roles: [FirmAdmin]
    code: 201
    input: [display_name, operator_role]
    output: Operator
    side_effects: []

  # --- Jurisdictions and classification config ---
  - method: POST
    path: "/bpp/jurisdictions"
    description: "Register a taxing jurisdiction (county)"
    roles: [FirmAdmin]
    code: 201
    input: [county_name, state_code, base_deadline_mmdd, max_extension_days, late_penalty_pct_per_month, max_late_penalty_pct, penalty_base, tax_rate, offered_exemption_types, max_exemption_pct]
    output: Jurisdiction
    side_effects: []
  - method: GET
    path: "/bpp/jurisdictions/{jurisdiction_id}"
    description: "Read a jurisdiction"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []
  - method: POST
    path: "/bpp/class-rules"
    description: "Configure the taxable classification + depreciation table for a category in a jurisdiction"
    roles: [FirmAdmin]
    code: 201
    input: [jurisdiction_id, category, is_taxable, depreciation_convention, percent_good_vector, percent_good_floor_pct, de_minimis_line_cents]
    output: JurisdictionClassRule
    side_effects: []
  - method: GET
    path: "/bpp/jurisdictions/{id}/class-rules"
    description: "List class rules of a jurisdiction"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["category?"]
    output: "JurisdictionClassRule[]"
    side_effects: []

  # --- Assets and disposals ---
  - method: POST
    path: "/bpp/assets"
    description: "Import one asset from the client's listing extract"
    roles: [TaxAnalyst]
    code: 201
    input: [client_id, jurisdiction_id, asset_tag, category, acquisition_cost_cents, acquisition_date, in_service_date]
    output: Asset
    side_effects: ["lifecycle_status=ACTIVE", "classification_status=UNCLASSIFIED"]
  - method: GET
    path: "/bpp/assets/{asset_id}"
    description: "Read an asset"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: []
    output: Asset
    side_effects: []
  - method: GET
    path: "/bpp/assets"
    description: "List assets with filters; disposed assets are included only when include_disposed=true"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["client_id?", "jurisdiction_id?", "lifecycle_status?", "classification_status?", "include_disposed?"]
    output: "Asset[]"
    side_effects: []
  - method: POST
    path: "/bpp/assets/{asset_id}/classify"
    description: "Confirm or override the rule-proposed taxable classification"
    roles: [TaxAnalyst]
    code: 200
    input: [taxable_classification]
    output: Asset
    side_effects:
      - "classification_status -> CLASSIFIED when equal to the rule proposal, else OVERRIDDEN"
      - "Recomputes the asset's line on DRAFT / AMENDMENT_OPEN renditions of the same jurisdiction and the rendition total"
  - method: POST
    path: "/bpp/assets/{asset_id}/disposals"
    description: "Record an asset disposal (drives the disposal cascade)"
    roles: [TaxAnalyst]
    code: 201
    input: [disposal_date, disposal_proceeds_cents]
    output: DisposalRecord
    side_effects:
      - "Asset lifecycle ACTIVE -> DISPOSED with the disposal cascade per the Asset state machine"
  - method: GET
    path: "/bpp/assets/{id}/disposals"
    description: "List disposal records of an asset"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["disposal_status?"]
    output: "DisposalRecord[]"
    side_effects: []
  - method: POST
    path: "/bpp/disposals/{disposal_id}/reverse"
    description: "Reverse a RECORDED disposal (compensating action; asset returns to ACTIVE)"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: DisposalRecord
    side_effects: ["DisposalRecord -> REVERSED; Asset DISPOSED -> ACTIVE; excluded lines restored; rendition totals recomputed"]

  # --- Renditions ---
  - method: POST
    path: "/bpp/renditions"
    description: "Open a rendition for (client, jurisdiction, tax_year)"
    roles: [TaxAnalyst]
    code: 201
    input: [client_id, jurisdiction_id, tax_year]
    output: Rendition
    side_effects: ["rendition_status=DRAFT", "deadline_date computed from jurisdiction base_deadline_mmdd"]
  - method: GET
    path: "/bpp/renditions/{rendition_id}"
    description: "Read a rendition including lines and totals"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: []
    output: Rendition
    side_effects: []
  - method: GET
    path: "/bpp/renditions"
    description: "List renditions with filters"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["client_id?", "jurisdiction_id?", "tax_year?", "rendition_status?"]
    output: "Rendition[]"
    side_effects: []
  - method: POST
    path: "/bpp/renditions/{rendition_id}/generate-lines"
    description: "(Re)generate line items from in-scope assets; allowed in DRAFT and AMENDMENT_OPEN"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: Rendition
    side_effects:
      - "Runs asset_depreciation per in-scope asset and rendition_total_aggregation"
      - "Replaces the lines array"
  - method: POST
    path: "/bpp/renditions/{rendition_id}/file"
    description: "File the rendition (or re-file an open amendment)"
    roles: [TaxAnalyst, SeniorManager]
    code: 200
    input: []
    output: Rendition
    side_effects:
      - "rendition_status DRAFT|AMENDMENT_OPEN -> FILED"
      - "Runs late_filing_penalty against the current clock"
      - "Marks RECORDED disposals of lien-excluded assets RECONCILED"
      - "Flags needs_regeneration on PUBLISHED forecasts of (client, tax_year)"
  - method: POST
    path: "/bpp/renditions/{rendition_id}/amendments"
    description: "Open or withdraw an amendment (segregation of duties applies)"
    roles: [SeniorManager]
    code: 200
    input: [action]
    output: Rendition
    side_effects:
      - "action=OPEN: FILED -> AMENDMENT_OPEN"
      - "action=WITHDRAW: AMENDMENT_OPEN -> FILED, restoring the filed snapshot (totals, lateness fields)"

  # --- Filing extensions ---
  - method: POST
    path: "/bpp/renditions/{rendition_id}/extensions"
    description: "Request a filing deadline extension (auto-granted within max_extension_days; supersedes prior GRANTED extension; OCC on rendition version)"
    roles: [TaxAnalyst]
    code: 201
    input: [requested_extend_to_date, expected_rendition_version]
    output: FilingExtension
    side_effects:
      - "GRANTED: prior GRANTED extension -> SUPERSEDED; rendition.deadline_date = requested_extend_to_date; AuditEvent EXTENSION_GRANTED"
      - "increments Rendition.version by 1"
  - method: GET
    path: "/bpp/renditions/{id}/extensions"
    description: "List extension requests of a rendition"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["extension_status?"]
    output: "FilingExtension[]"
    side_effects: []

  # --- Assessment notices ---
  - method: POST
    path: "/bpp/renditions/{rendition_id}/assessment-notices"
    description: "Record the county's assessed value notice against a FILED or ACCEPTED rendition"
    roles: [AssessorClerk]
    code: 201
    input: [notice_value_cents, received_date, protest_deadline_date]
    output: AssessmentNotice
    side_effects: ["notice_status=RECEIVED; requires rendition_status in {FILED, ACCEPTED} (else ERR_INVALID_STATE_TRANSITION)"]
  - method: GET
    path: "/bpp/assessment-notices/{notice_id}"
    description: "Read an assessment notice"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: []
    output: AssessmentNotice
    side_effects: []
  - method: GET
    path: "/bpp/renditions/{id}/assessment-notices"
    description: "List notices of a rendition"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["notice_status?"]
    output: "AssessmentNotice[]"
    side_effects: []
  - method: POST
    path: "/bpp/assessment-notices/{notice_id}/accept"
    description: "Accept the noticed value (no protest)"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: AssessmentNotice
    side_effects: ["notice_status RECEIVED -> ACCEPTED"]

  # --- Appeals ---
  - method: POST
    path: "/bpp/assessment-notices/{notice_id}/appeals"
    description: "File an appeal (protest) against a notice"
    roles: [TaxAnalyst]
    code: 201
    input: [claimed_value_cents, grounds]
    output: Appeal
    side_effects: ["appeal_status=FILED", "notice -> PROTESTED"]
  - method: GET
    path: "/bpp/appeals/{appeal_id}"
    description: "Read an appeal"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: []
    output: Appeal
    side_effects: []
  - method: GET
    path: "/bpp/assessment-notices/{id}/appeals"
    description: "List appeals of a notice"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["appeal_status?"]
    output: "Appeal[]"
    side_effects: []
  - method: POST
    path: "/bpp/appeals/{appeal_id}/schedule-hearing"
    description: "Schedule the appraisal review hearing"
    roles: [AssessorClerk]
    code: 200
    input: [hearing_date]
    output: Appeal
    side_effects: ["appeal_status FILED -> HEARING_SCHEDULED"]
  - method: POST
    path: "/bpp/appeals/{appeal_id}/record-decision"
    description: "Record the hearing decision"
    roles: [AssessorClerk]
    code: 200
    input: [decision, decided_value_cents]
    output: Appeal
    side_effects: ["appeal_status HEARING_SCHEDULED -> DECIDED"]
  - method: POST
    path: "/bpp/appeals/{appeal_id}/resolve"
    description: "Client decision on the hearing outcome: ACCEPT (applies decided value, cascades) or ESCALATE (to board, no value change)"
    roles: [Client]
    code: 200
    input: [resolution]
    output: Appeal
    side_effects:
      - "ACCEPT: DECIDED -> ACCEPTED; notice FINALIZED at decided_value_cents with bill/forecast cascade"
      - "ESCALATE: DECIDED -> ESCALATED; no notice or bill change"
  - method: POST
    path: "/bpp/appeals/{appeal_id}/withdraw"
    description: "Withdraw an appeal before decision"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: Appeal
    side_effects: ["appeal_status -> WITHDRAWN; notice returns to its pre-appeal status (RECEIVED or ACCEPTED)"]
  - method: POST
    path: "/bpp/appeals/{appeal_id}/close"
    description: "Close an ACCEPTED appeal (Client) or close an ESCALATED appeal with the board decision value (AssessorClerk, cascades)"
    roles: [Client, AssessorClerk]
    code: 200
    input: ["board_value_cents?"]
    output: Appeal
    side_effects:
      - "From ACCEPTED (Client): appeal -> CLOSED"
      - "From ESCALATED (AssessorClerk, board_value_cents required): appeal -> CLOSED; notice FINALIZED at board_value_cents with bill/forecast cascade"

  # --- Tax bills and payment scheduling ---
  - method: POST
    path: "/bpp/assessment-notices/{notice_id}/tax-bills"
    description: "Import the county tax bill for a notice"
    roles: [TaxAnalyst, SeniorManager]
    code: 201
    input: [billed_amount_cents, tax_rate, due_date]
    output: TaxBill
    side_effects: ["validation_status=PENDING", "payment_status=UNSCHEDULED", "created_by_operator_id from X-User-ID", "requires notice_status in {ACCEPTED, PROTESTED, FINALIZED} (else ERR_BILL_NOT_ACTIONABLE)"]
  - method: GET
    path: "/bpp/tax-bills/{bill_id}"
    description: "Read a tax bill including installments"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: []
    output: TaxBill
    side_effects: []
  - method: GET
    path: "/bpp/assessment-notices/{id}/tax-bills"
    description: "List bills of a notice"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["validation_status?", "payment_status?"]
    output: "TaxBill[]"
    side_effects: []
  - method: POST
    path: "/bpp/tax-bills/{bill_id}/validate"
    description: "Validate the billed amount against the system-computed expectation (segregation of duties applies)"
    roles: [SeniorManager]
    code: 200
    input: []
    output: TaxBill
    side_effects:
      - "Runs tax_bill_validation; sets validated_amount_cents, variance_cents, unscheduled_amount_cents, validated_by_operator_id"
      - "validation_status -> MATCHED or DISCREPANCY"
  - method: POST
    path: "/bpp/tax-bills/{bill_id}/payment-schedule"
    description: "Generate equal installments per installment_split"
    roles: [TaxAnalyst]
    code: 200
    input: [installment_count]
    output: TaxBill
    side_effects:
      - "Generates installments per installment_split; unscheduled_amount_cents -> 0; payment_status -> SCHEDULED"
  - method: POST
    path: "/bpp/tax-bills/{bill_id}/payment-schedule/cancel"
    description: "Cancel all SCHEDULED/LATE installments (compensating action for payment-schedule)"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: TaxBill
    side_effects: ["SCHEDULED/LATE installments -> CANCELLED; unscheduled_amount_cents = validated - sum(PAID); payment_status recomputed"]
  - method: POST
    path: "/bpp/tax-bills/{bill_id}/pay-installment"
    description: "Mark one installment paid by the owning client"
    roles: [Client]
    code: 200
    input: [installment_no]
    output: TaxBill
    side_effects: ["installment -> PAID with paid_date = current clock date; payment_status recomputed"]

  # --- Exemptions ---
  - method: POST
    path: "/bpp/assets/{asset_id}/exemption-applications"
    description: "Apply for an exemption on an asset (half-open effective period)"
    roles: [TaxAnalyst]
    code: 201
    input: [exemption_type, exemption_pct, effective_date, expiration_date]
    output: ExemptionApplication
    side_effects: ["application_status=DRAFT"]
  - method: GET
    path: "/bpp/exemption-applications/{application_id}"
    description: "Read an exemption application"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: []
    output: ExemptionApplication
    side_effects: []
  - method: GET
    path: "/bpp/assets/{id}/exemption-applications"
    description: "List exemption applications of an asset"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["application_status?", "exemption_type?"]
    output: "ExemptionApplication[]"
    side_effects: []
  - method: POST
    path: "/bpp/exemption-applications/{application_id}/submit"
    description: "Submit the application to the jurisdiction"
    roles: [TaxAnalyst]
    code: 200
    input: []
    output: ExemptionApplication
    side_effects: ["application_status DRAFT -> SUBMITTED"]
  - method: POST
    path: "/bpp/exemption-applications/{application_id}/review"
    description: "Jurisdiction reviews the application"
    roles: [AssessorClerk]
    code: 200
    input: [decision]
    output: ExemptionApplication
    side_effects: ["SUBMITTED -> APPROVED or DENIED"]
  - method: POST
    path: "/bpp/exemption-applications/{application_id}/compliance"
    description: "Compliance actions on an approved exemption: SUSPEND or REINSTATE"
    roles: [AssessorClerk]
    code: 200
    input: [action]
    output: ExemptionApplication
    side_effects: ["SUSPEND: APPROVED -> SUSPENDED (sets suspended_date); REINSTATE: SUSPENDED -> APPROVED"]

  # --- Abatements ---
  - method: POST
    path: "/bpp/assets/{asset_id}/abatements"
    description: "Execute an abatement agreement on an asset (closed tax-year interval)"
    roles: [TaxAnalyst]
    code: 201
    input: [first_tax_year, last_tax_year, abatement_pct]
    output: AbatementAgreement
    side_effects: ["agreement_status=ACTIVE", "last_recertified_year=first_tax_year"]
  - method: GET
    path: "/bpp/abatements/{agreement_id}"
    description: "Read an abatement agreement"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: []
    output: AbatementAgreement
    side_effects: []
  - method: GET
    path: "/bpp/assets/{id}/abatements"
    description: "List abatement agreements of an asset"
    roles: [FirmAdmin, TaxAnalyst, SeniorManager, AssessorClerk, Client]
    code: 200
    input: ["agreement_status?"]
    output: "AbatementAgreement[]"
    side_effects: []
  - method: POST
    path: "/bpp/abatements/{agreement_id}/recertify"
    description: "Recertify annual abatement compliance"
    roles: [TaxAnalyst]
    code: 200
    input: [tax_year]
    output: AbatementAgreement
    side_effects: ["RECERTIFICATION_DUE -> ACTIVE; last_recertified_year = tax_year"]
  - method: POST
    path: "/bpp/abatements/{agreement_id}/terminate"
    description: "Terminate an abatement (triggers clawback revalidation of affected bills)"
    roles: [AssessorClerk]
    code: 200
    input: []
    output: AbatementAgreement
    side_effects: ["agreement_status -> TERMINATED; affected VALIDATED bills revalidated (clawback); their SCHEDULED/LATE installments cancelled"]

  # --- Logical clock (test-driving endpoint) ---
  - method: POST
    path: "/bpp/_clock/set-current-utc"
    description: "Set the logical clock (ISO8601). Startup default before any call is exactly 2026-08-01T00:00:00Z; the server never falls back to wall-clock time. Setting the clock runs the deterministic sweep in this order: (1) extensions EXPIRED, (2) notices past protest deadline FINALIZED, (3) installments -> LATE and bill payment_status recomputed, (4) abatements -> RECERTIFICATION_DUE, (5) SUSPENDED exemptions -> REVOKED past the 90-day cure period."
    roles: [FirmAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Runs the five clock sweeps in the pinned order; each auto-transition appends its AuditEvent"]

# =============================================================================
# §1.6 Error Code Catalog (30 codes)
# =============================================================================
errors:
  - { id: ERR_MISSING_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role value not recognized, or entity_backed id does not resolve" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not in the endpoint's roles list, or Client X-User-ID does not own the resource via the FK chain" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (validated left-to-right)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum member, out-of-range integer, effective_date >= expiration_date, last_tax_year < first_tax_year" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Current state does not offer the requested transition and no more specific state error applies (e.g. reverse a REVERSED disposal, classify a DISPOSED asset, recertify an ACTIVE agreement, create a notice on a DRAFT rendition)" }
  - { id: ERR_RENDITION_ALREADY_FILED, http: 409, condition: "File on a FILED rendition with no open amendment, or extension requested on a rendition not in DRAFT" }
  - { id: ERR_AMENDMENT_STATE_MISMATCH, http: 409, condition: "Amendment OPEN requires FILED; WITHDRAW requires AMENDMENT_OPEN; generate-lines requires DRAFT or AMENDMENT_OPEN" }
  - { id: ERR_NOTICE_NOT_APPEALABLE, http: 409, condition: "Appeal created on a notice in PROTESTED or FINALIZED status" }
  - { id: ERR_APPEAL_NOT_ACTIONABLE, http: 409, condition: "Appeal action not offered from the appeal's current status (e.g. resolve before decision, close from FILED, any action on CLOSED/WITHDRAWN)" }
  - { id: ERR_BILL_NOT_ACTIONABLE, http: 409, condition: "Bill create on a RECEIVED notice; validate when validation_status != PENDING; payment-schedule when validation_status == PENDING or payment_status != UNSCHEDULED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Amendment actor == rendition filer, or bill validator == bill importer" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_rendition_version / expected_client_version does not match the parent's current version (OCC)" }
  - { id: ERR_CLASS_RULE_MISSING, http: 422, condition: "No JurisdictionClassRule for the (jurisdiction, category) pair at classify or generate-lines" }
  - { id: ERR_EXEMPTION_PROGRAM_UNAVAILABLE, http: 422, condition: "The asset's jurisdiction does not offer the requested exemption_type" }
  - { id: ERR_PROTEST_WINDOW_CLOSED, http: 422, condition: "Current clock date is after the notice's protest_deadline_date" }
  - { id: ERR_EXTENSION_WINDOW_CLOSED, http: 422, condition: "Current clock date is after the rendition's effective deadline_date" }
  - { id: ERR_INVALID_DISPOSAL_DATE, http: 422, condition: "disposal_date before the asset's acquisition date or after the current clock date" }
  - { id: ERR_DUPLICATE_RENDITION, http: 409, condition: "A rendition already exists for (client_id, jurisdiction_id, tax_year)" }
  - { id: ERR_DUPLICATE_CLASS_RULE, http: 409, condition: "A class rule already exists for (jurisdiction_id, category)" }
  - { id: ERR_UNCLASSIFIED_ASSETS, http: 422, condition: "Filing with an in-scope ACTIVE asset still UNCLASSIFIED" }
  - { id: ERR_EMPTY_RENDITION, http: 422, condition: "Filing with zero included lines" }
  - { id: ERR_ABATEMENT_OVERLAP, http: 409, condition: "Closed year-interval [first_tax_year, last_tax_year] intersects another ACTIVE/RECERTIFICATION_DUE abatement on the same asset (shared endpoint year counts as overlap)" }
  - { id: ERR_EXEMPTION_PERIOD_OVERLAP, http: 409, condition: "Half-open date interval [effective_date, expiration_date) intersects another SUBMITTED/APPROVED/SUSPENDED application of the same asset and exemption_type (touching endpoints do NOT count)" }
  - { id: ERR_EXTENSION_EXCEEDS_MAX, http: 422, condition: "requested_extend_to_date is beyond base deadline + jurisdiction.max_extension_days" }
  - { id: ERR_CLAIM_EXCEEDS_NOTICE, http: 422, condition: "claimed_value_cents > notice_value_cents" }
  - { id: ERR_FORECAST_INPUT_INVALID, http: 422, condition: "as_of_date before Jan 1 of tax_year" }
  - { id: ERR_CLOCK_MONOTONIC, http: 400, condition: "set-current-utc target not strictly after the current logical clock value" }
  - { id: ERR_EXEMPTION_CAP_EXCEEDED, http: 422, condition: "exemption_pct exceeds the jurisdiction max_exemption_pct" }
  - { id: ERR_ZERO_SCHEDULE_AMOUNT, http: 422, condition: "Payment scheduling on a bill whose validated_amount_cents is 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: FirmAdmin
    description: "Compliance-firm administrator; owns jurisdiction configuration, operators, clients, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /bpp/clients"
      - "POST /bpp/operators"
      - "POST /bpp/jurisdictions"
      - "POST /bpp/class-rules"
      - "POST /bpp/_clock/set-current-utc"
    shared_operations:
      - "All GET endpoints"

  - name: TaxAnalyst
    description: "Firm analyst; imports assets, classifies, files renditions, manages disposals, extensions, notices acceptance, appeals filing, bill import and payment scheduling, exemption applications, abatement recertification"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /bpp/assets"
      - "POST /bpp/assets/{asset_id}/classify"
      - "POST /bpp/assets/{asset_id}/disposals"
      - "POST /bpp/disposals/{disposal_id}/reverse"
      - "POST /bpp/renditions"
      - "POST /bpp/renditions/{rendition_id}/generate-lines"
      - "POST /bpp/renditions/{rendition_id}/extensions"
      - "POST /bpp/assessment-notices/{notice_id}/accept"
      - "POST /bpp/assessment-notices/{notice_id}/appeals"
      - "POST /bpp/appeals/{appeal_id}/withdraw"
      - "POST /bpp/tax-bills/{bill_id}/payment-schedule"
      - "POST /bpp/tax-bills/{bill_id}/payment-schedule/cancel"
      - "POST /bpp/assets/{asset_id}/exemption-applications"
      - "POST /bpp/exemption-applications/{application_id}/submit"
      - "POST /bpp/assets/{asset_id}/abatements"
      - "POST /bpp/abatements/{agreement_id}/recertify"
    shared_operations:
      - "All GET endpoints"
      - "POST /bpp/renditions/{rendition_id}/file (shared with SeniorManager)"
      - "POST /bpp/assessment-notices/{notice_id}/tax-bills (shared with SeniorManager)"

  - name: SeniorManager
    description: "Firm senior manager; approves rendition amendments, validates tax bills, publishes accrual forecasts — segregation of duties against the filing/importing analyst"
    identity: "entity_backed:Operator"
    exclusive_operations:
      - "POST /bpp/renditions/{rendition_id}/amendments"
      - "POST /bpp/tax-bills/{bill_id}/validate"
      - "POST /bpp/clients/{client_id}/accrual-forecasts"
    shared_operations:
      - "All GET endpoints"
      - "POST /bpp/renditions/{rendition_id}/file (senior managers may file; segregation of duties then bars them from amending their own filing)"
      - "POST /bpp/assessment-notices/{notice_id}/tax-bills (senior managers may import; segregation of duties then bars them from validating their own import)"

  - name: AssessorClerk
    description: "County appraisal district clerk (external authority); issues assessment notices, schedules and decides hearings, records board decisions, reviews exemption applications, terminates abatements"
    identity: opaque
    exclusive_operations:
      - "POST /bpp/renditions/{rendition_id}/assessment-notices"
      - "POST /bpp/appeals/{appeal_id}/schedule-hearing"
      - "POST /bpp/appeals/{appeal_id}/record-decision"
      - "POST /bpp/exemption-applications/{application_id}/review"
      - "POST /bpp/exemption-applications/{application_id}/compliance"
      - "POST /bpp/abatements/{agreement_id}/terminate"
    shared_operations:
      - "All GET endpoints"
      - "POST /bpp/appeals/{appeal_id}/close (from ESCALATED only, with board_value_cents)"

  - name: Client
    description: "The firm's client; decides appeal outcomes, closes accepted appeals, pays installments"
    identity: "entity_backed:ClientAccount"
    exclusive_operations:
      - "POST /bpp/appeals/{appeal_id}/resolve"
      - "POST /bpp/tax-bills/{bill_id}/pay-installment"
    shared_operations:
      - "All GET endpoints"
      - "POST /bpp/appeals/{appeal_id}/close (from ACCEPTED only, no board value)"
