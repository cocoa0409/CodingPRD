            - { call: "POST /legs/${leg_a}/assignments", payload: { position: "REAR", escort_id: "${esc_tx}" }, as: Dispatcher, captures: { asg_a: $.data.id } }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_b}", load_description: "jB1", width_inches: 170, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-11T09:00:00Z", window_end_at: "2026-08-11T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-11T09:00:00Z", planned_exit_at: "2026-08-11T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_b}", captures: { job_b1: $.data.id } }
            - { call: "POST /jobs/${job_b1}/quote", payload: {}, as: Dispatcher }
            - { call: "POST /jobs", payload: { carrier_id: "${carrier_b}", load_description: "jB2", width_inches: 150, height_inches: 150, length_inches: 600, gross_weight_lbs: 150000, window_start_at: "2026-08-12T09:00:00Z", window_end_at: "2026-08-12T13:00:00Z", legs: [ { state_code: "TX", sequence_index: 0, distance_miles: 120, planned_entry_at: "2026-08-12T09:00:00Z", planned_exit_at: "2026-08-12T13:00:00Z", map_min_clearance_inches: 180 } ] }, as: CarrierRep, as_user_id: "${carrier_b}", captures: { job_b2: $.data.id } }
          trigger:
