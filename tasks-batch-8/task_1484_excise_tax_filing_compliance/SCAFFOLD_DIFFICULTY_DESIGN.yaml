  - rule_id: boundary_precision_check
    instances:
      - name: deposit_penalty_day5_vs_day6_boundary
        grounds:
          - calculations.late_deposit_penalty
          - entities.Deposit.fields.penalty_cents
        distinguishing_aspect: |
          Metric: days-late count on POST /deposits/{id}/pay. The tier boundary is inclusive at
          5 days (2%) and flips at 6 days (5%): two 10000-cent deposits paid exactly 5 and 6
          calendar days after their due dates yield 200 and 500 cents respectively.
        test_recipe:
          setup:
            - "CA-BOE; DIESEL@24300mc; ACTIVE SAFE_HARBOR registration bonded 1500000"
            - "A 2026-09 return exists (one event dated 2026-09-05 rated); depA due 2026-09-25, depB due 2026-10-10, each scheduled 10000"
