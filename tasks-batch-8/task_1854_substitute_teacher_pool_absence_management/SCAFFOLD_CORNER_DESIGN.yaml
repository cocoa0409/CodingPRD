# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# (task 1854)
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: absence_creation_defaults_and_required_fields
        claim_type: creation_defaults_computed
        grounds:
          - entities.Absence
          - endpoints[POST /absences]
        distinguishing_aspect: "A 3-weekday absence is created with fill_status REPORTED, approval_status NOT_REQUIRED (total_days 3 <= 5), total_days 3, version 1; omitting required end_date is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["District, school, teacher T1 exist; clock 2026-07-29"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-05", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id, fs: $.data.fill_status, ap: $.data.approval_status, td: $.data.total_days, v: $.data.version } }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-10", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { err: $.data.error_id } }
          assert:
            - "Created absence: fill_status == REPORTED, approval_status == NOT_REQUIRED, total_days == 3, version == 1, school_id == ${sch} (denormalized from staff member)"
            - "Missing end_date request rejected with error_id == ERR_INVALID_REQUEST (400)"

      - name: absence_long_term_requires_approval_at_creation
        claim_type: computed_fields
        grounds:
          - entities.Absence.fields.approval_status
          - state_machines.Absence.approval_status
        distinguishing_aspect: "A 6-weekday absence (2026-08-03..2026-08-10) crosses long_term_approval_days 5 and is born with approval_status PENDING while fill_status stays REPORTED — the two dimensions are independent."
        test_recipe:
          setup: ["District defaults; school; teacher T1; clock 2026-07-29"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-10", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id, ap: $.data.approval_status, td: $.data.total_days } }
          assert:
            - "Absence.${abs1}.total_days == 6 and approval_status == PENDING and fill_status == REPORTED"

      - name: substitute_system_status_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Substitute.fields.status
          - endpoints[POST /substitutes]
        distinguishing_aspect: "Client-supplied status on creation is ignored: the substitute is always born PENDING_CLEARANCE with scores 100 and counters 0."
        test_recipe:
          setup: ["District exists"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000, status: "ACTIVE" }, as: DistrictAdmin, captures: { subA: $.data.id, st: $.data.status, score: $.data.reliability_trailing_score } }
          assert:
            - "Substitute.${subA}.status == PENDING_CLEARANCE (input status ignored)"
            - "reliability_lifetime_score == 100 and reliability_trailing_score == 100 and completions_lifetime == 0"

      - name: not_found_for_every_path_resource
        claim_type: not_found
        grounds:
          - errors[ERR_ABSENCE_NOT_FOUND]
          - errors[ERR_SUBSTITUTE_NOT_FOUND]
          - errors[ERR_DISPATCH_BATCH_NOT_FOUND]
          - errors[ERR_PAYROLL_PERIOD_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns the resource-specific 404 error id for each sampled entity type."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /absences/11111111-1111-4111-8111-111111111111", payload: {}, as: DistrictAdmin, captures: { e1: $.data.error_id } }
            - { call: "GET /substitutes/22222222-2222-4222-8222-222222222222", payload: {}, as: DistrictAdmin, captures: { e2: $.data.error_id } }
            - { call: "GET /dispatch-batches/33333333-3333-4333-8333-333333333333", payload: {}, as: DistrictAdmin, captures: { e3: $.data.error_id } }
            - { call: "GET /payroll-periods/44444444-4444-4444-8444-444444444444", payload: {}, as: DistrictAdmin, captures: { e4: $.data.error_id } }
          assert:
            - "e1 == ERR_ABSENCE_NOT_FOUND, e2 == ERR_SUBSTITUTE_NOT_FOUND, e3 == ERR_DISPATCH_BATCH_NOT_FOUND, e4 == ERR_PAYROLL_PERIOD_NOT_FOUND (all http 404)"

      - name: school_budget_fields_initialized
        claim_type: computed_fields
        grounds:
          - entities.School.fields.coverage_budget_available_cents
          - endpoints[POST /schools]
        distinguishing_aspect: "A new school's committed and spent start at 0 and available mirrors the input total."
        test_recipe:
          setup: ["District exists"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
          trigger:
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 500000 }, as: DistrictAdmin, captures: { sch: $.data.id, av: $.data.coverage_budget_available_cents, cm: $.data.coverage_budget_committed_cents, sp: $.data.coverage_budget_spent_cents } }
          assert:
            - "School.${sch}: committed == 0, spent == 0, available == 500000"

  - section: state_machines
    instances:
      - name: assignment_terminal_lockdown_decline_then_respond
        claim_type: invalid_transition
        grounds:
          - state_machines.Assignment.OFFERED_to_DECLINED
          - errors[ERR_ASSIGNMENT_INVALID_STATE]
        distinguishing_aspect: "DECLINED is terminal: a second respond on the same assignment fails with ERR_ASSIGNMENT_INVALID_STATE and no re-dispatch cascade fires twice."
        test_recipe:
          setup: ["Full fixture: district, school (budget 1000000), teacher, coordinator, sub ACTIVE qualified; absence Mon 2026-08-03; manual offer"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "DECLINE" }, as: Substitute, as_user_id: "${subA}" }
          trigger:
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}", captures: { err: $.data.error_id } }
            - { call: "GET /absences/${abs1}", payload: {}, as: DistrictAdmin, captures: { fill: $.data.fill_status } }
          assert:
            - "error_id == ERR_ASSIGNMENT_INVALID_STATE (409)"
            - "Absence.${abs1}.fill_status == DISPATCHING (decline re-dispatch ran once; pool now empty so no new offer)"

      - name: absence_cancel_rejected_while_assigned
        claim_type: invalid_transition
        grounds:
          - state_machines.Absence.ASSIGNED
          - errors[ERR_ABSENCE_INVALID_STATE]
        distinguishing_aspect: "Cancel is only offered from unassigned fill states; an ASSIGNED absence rejects cancel with ERR_ABSENCE_INVALID_STATE until its assignment is cancelled first."
        test_recipe:
          setup: ["Full fixture with accepted assignment (absence ASSIGNED)"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}" }
          trigger:
            - { call: "POST /absences/${abs1}/cancel", payload: {}, as: SchoolCoordinator, as_user_id: "${coord}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ABSENCE_INVALID_STATE (409)"
            - "Absence.${abs1}.fill_status == ASSIGNED (unchanged) and Assignment.${asg1}.status == ACCEPTED (unchanged)"

      - name: pending_approval_gates_dispatch_then_approve_unblocks
        claim_type: guarded_transition
        grounds:
          - state_machines.Absence.approval_status
          - state_machines.Absence.REPORTED_to_DISPATCHING
        distinguishing_aspect: "Cross-dimension guard: a PENDING long absence is invisible to the dispatch batch (no offer, stays REPORTED); only after review APPROVE does the next batch dispatch it and create an offer."
        test_recipe:
          setup: ["District; school; teacher; sub ACTIVE qualified; 6-day absence 2026-08-03..2026-08-10 (PENDING)"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-10", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /dispatch-batches", payload: { district_id: "${dist}", run_for_date: "2026-07-29" }, as: DistrictAdmin, captures: { b1: $.data.id, b1_offers: $.data.offers_created } }
            - { call: "POST /absences/${abs1}/review", payload: { decision: "APPROVE" }, as: DistrictAdmin, captures: { ap: $.data.approval_status } }
          trigger:
            - { call: "POST /dispatch-batches", payload: { district_id: "${dist}", run_for_date: "2026-07-29" }, as: DistrictAdmin, captures: { b2: $.data.id, b2_offers: $.data.offers_created } }
            - { call: "GET /absences/${abs1}", payload: {}, as: DistrictAdmin, captures: { fill: $.data.fill_status } }
          assert:
            - "First batch: offers_created == 0 and absence stayed REPORTED (PENDING approval blocks dispatch)"
            - "After APPROVE: approval_status == APPROVED"
            - "Second batch: offers_created == 1 and Absence.${abs1}.fill_status == DISPATCHING"

      - name: approved_absence_date_edit_forces_reapproval
        claim_type: side_effect_execution
        grounds:
          - state_machines.Absence.approval_status
          - endpoints[PUT /absences/{absenceId}]
        distinguishing_aspect: "Editing an APPROVED long absence's dates reopens approval: approval_status returns to PENDING and dispatch is blocked again until re-reviewed."
        test_recipe:
          setup: ["6-day absence APPROVED; still REPORTED; coordinator holds current version"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-10", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /absences/${abs1}/review", payload: { decision: "APPROVE" }, as: DistrictAdmin }
            - { call: "GET /absences/${abs1}", payload: {}, as: DistrictAdmin, captures: { av: $.data.version } }
          trigger:
            - { call: "PUT /absences/${abs1}", payload: { expected_absence_version: "${av}", end_date: "2026-08-11" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { ap: $.data.approval_status, td: $.data.total_days, v2: $.data.version } }
          assert:
            - "After edit: total_days == 7, approval_status == PENDING (re-approval forced), version advanced by 1"
            - "Absence remains REPORTED and cannot dispatch until re-approved"

      - name: timesheet_reject_resubmit_cycle
        claim_type: cyclic_transition
        grounds:
          - state_machines.Timesheet.SUBMITTED_to_REJECTED
          - state_machines.Timesheet.REJECTED_to_SUBMITTED
          - errors[ERR_TIMESHEET_INVALID_STATE]
        distinguishing_aspect: "The timesheet machine loops: REJECTED -> SUBMITTED via PUT with corrected hours, then APPROVE succeeds; resubmitting a still-SUBMITTED timesheet fails with ERR_TIMESHEET_INVALID_STATE."
        test_recipe:
          setup: ["1-day absence filled, WORKED; one timesheet SUBMITTED"]
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /assignments/${asg1}/report-outcome", payload: { outcome: "WORKED" }, as: SchoolCoordinator, as_user_id: "${coord}" }
            - { call: "POST /timesheets", payload: { assignment_id: "${asg1}", work_date: "2026-08-03", hours_worked: 6.0 }, as: Substitute, as_user_id: "${subA}", captures: { ts1: $.data.id } }
            - { call: "POST /timesheets/${ts1}/review", payload: { decision: "REJECT" }, as: SchoolCoordinator, as_user_id: "${coord}" }
          trigger:
            - { call: "PUT /timesheets/${ts1}", payload: { hours_worked: 8.0 }, as: Substitute, as_user_id: "${subA}", captures: { st1: $.data.status, hrs: $.data.hours_worked } }
            - { call: "PUT /timesheets/${ts1}", payload: { hours_worked: 7.5 }, as: Substitute, as_user_id: "${subA}", captures: { err: $.data.error_id } }
            - { call: "POST /timesheets/${ts1}/review", payload: { decision: "APPROVE" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { st2: $.data.status, si: $.data.streak_index } }
          assert:
            - "Resubmit of REJECTED: status == SUBMITTED with hours_worked == 8.0"
            - "Second resubmit while SUBMITTED: error_id == ERR_TIMESHEET_INVALID_STATE"
            - "After approval: status == APPROVED, streak_index == 1, day_pay_cents == 20000"

      - name: clearance_expiry_and_verify_terminal_rules
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Clearance.PENDING_to_VERIFIED
          - state_machines.Clearance.PENDING_to_EXPIRED
          - errors[ERR_CLEARANCE_INVALID_STATE]
        distinguishing_aspect: "A clearance whose expires_on passes while PENDING becomes EXPIRED (terminal): verifying it afterwards fails with ERR_CLEARANCE_INVALID_STATE, and verify of an already-EXPIRED record can never succeed."
        test_recipe:
          setup: ["Sub exists (not activated); clearance expires 2026-08-02; clock advanced to 2026-08-03 before any verify"]
          setup_api_calls:
