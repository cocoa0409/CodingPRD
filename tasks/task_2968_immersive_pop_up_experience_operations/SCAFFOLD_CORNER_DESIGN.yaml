            - "trigger 6 responds 200 with status == CLEARED: 87.80 >= 78.00 and incident_count 1 <= 2"
            - "trigger 7 responds 201 with incident_count == 5 accepted as a client-supplied opening balance and both readiness figures still 0.00"
            - "trigger 8 reports cert_coverage_pct == 0.00 and BOTH readiness figures == 0.00, not a negative number: raw = 0.4*0 + 0.35*0 + 0.25*0 - 5.0*5 = -25.00, which the clamp lifts to 0.00"

      - name: inspection_outcome_walks_all_five_ordered_branches
        claim_type: threshold
        grounds:
          - calculations.safety_inspection_outcome
          - state_machines.SafetyInspection.transitions[SCHEDULED -> FINALIZED]
        distinguishing_aspect: |
          Five ordered branches whose order is the whole point: branch 1 makes an EGRESS inspection
          with severity NONE and zero findings FAIL on geometry alone, so an implementation that
          tests severity first reports PASS. Two thresholds are inclusive-at-the-edge in opposite
          directions (measured width exactly 90% of the declared width PASSES, findings exactly at
          FINDINGS_MAJOR_MAX is CONDITIONAL not FAIL, findings exactly at FINDINGS_PASS_MAX is PASS
          not CONDITIONAL), and allowed_occupancy_cap is written on every branch while only the
          CONDITIONAL branch copies it into the run.
        test_recipe:
          setup:
            - "The LIGHT CHAIN through run creation on a venue with egress_width_cm 400 (egress_floor_cm 360.00, egress_capacity 197), plus one room of 40 seats at 15 minutes dwell so effective_capacity is 120, and eight SCHEDULED inspections on the run."
