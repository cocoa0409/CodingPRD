      - name: repeating_pack_approval_and_ce_verification_is_rejected
        claim_type: idempotency
        grounds:
          - validations[priority=40]
          - validations[priority=39]
          - errors.ERR_PACK_APPROVAL_STATE_INVALID
          - errors.ERR_CE_ACTIVITY_STATE_INVALID
          - state_machines.CeActivity.VERIFIED_to_REVOKED
          - calculations.perfusionist_ce_ledger
        distinguishing_aspect: |
          Neither approval nor CE verification is idempotent: each is a state machine edge with a
          one-shot from-set, and replaying it must 409 rather than silently re-apply. The CE half is
          the sharper claim because a second VERIFIED would add credit_hours to the ledger twice and
          a second REVOKED would subtract twice - the assertions pin ce_credits_verified after each
          step so a re-applied ledger write is visible, not just the status.
        test_recipe:
          setup:
            - "LEAN BASE chain through assign-perfusionist, then a pack carrying one substitution so approval is required (approval_status PENDING)."
