            - "SittingRoute.${r4}.committed_stops == 1 (C's 08-04 stop landed)"

      - name: tech_visit_buffered_half_open_conflict
        grounds:
          - calculations.technician_schedule_conflict
          - errors[ERR_TECH_SCHEDULE_CONFLICT]
        distinguishing_aspect: |
          Buffered half-open semantics on the technician-schedule resource
          (different interval arithmetic from the closed date intervals): a new
          visit starting exactly at previous end + 30 minutes is allowed, but
          one minute earlier collides with the expanded buffer and is rejected.
        test_recipe:
          setup:
            - "URBAN household; PLANNED coop; three SETUP_INSTALL visits created (BILLABLE, no subscription)"
            - "V1 2026-06-10T09:00:00Z-10:00:00Z assigned to tech-5 (SCHEDULED; buffered occupancy [08:30, 10:30))"
            - "V2 2026-06-10T10:15:00Z-11:15:00Z and V3 2026-06-10T10:30:00Z-11:30:00Z both REQUESTED"
