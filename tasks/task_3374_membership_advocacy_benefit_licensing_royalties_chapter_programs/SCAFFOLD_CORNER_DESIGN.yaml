              as: GovernanceOfficer
              captures: { a39_v2: $.data.version }
            - call: "POST /api/license-agreements/${a39}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 1, reported_sales_cents: 1000000, expected_agreement_version: "${a39_v2}" }
              as: ProviderManager
              as_user_id: "${p39}"
              captures: { s39: $.data.id }
          trigger:
            - call: "POST /api/license-agreements/${a39}/royalty-statements"
              payload: { period_year: 2026, period_quarter: 1, reported_sales_cents: 2000000, expected_agreement_version: "${a39_v2}" }
              as: ProviderManager
              as_user_id: "${p39}"
              captures: { err39: $.data.error_id }
          assert:
            - "status 412, error_id == ERR_STALE_AGREEMENT_VERSION (expected 2 but the agreement is at 3 after the first submission)"
            - "GET /api/license-agreements/${a39}/royalty-statements returns exactly 1 row, still PROVISIONAL with reported_sales_cents == 1000000"

      - name: household_version_increments_on_cascade
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Household
          - state_machines.MembershipTerm.ACTIVE_to_CANCELLED
        distinguishing_aspect: "The cancellation cascade touches the household (lifetime_refunded_cents), so Household.version increments by exactly 1 even though the cancel endpoint's path targets the term — version drift on the parent is observable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; household with a 1-year term, version 1."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/households"
              payload: { state_code: "AR", term_years: 1, primary_full_name: "Eli Earp", primary_date_of_birth: "1964-04-04" }
              as: MemberServicesAgent
              captures: { hh40: $.data.id, hh40_v1: $.data.version }
            - call: "GET /api/households/${hh40}/terms"
              payload: {}
              as: MemberServicesAgent
              captures: { term40: "$.data[0].id" }
          trigger:
            - call: "POST /api/membership-terms/${term40}/cancel"
              payload: { reason: "VOLUNTARY" }
              as: MemberServicesAgent
          assert:
            - "GET /api/households/${hh40} shows version == ${hh40_v1} + 1 (exactly one cascade mutation)"
            - "Household.${hh40}.lifetime_refunded_cents == 1467 and updated_at advanced past created_at"

      - name: room_overlap_and_instructor_errors
        claim_type: violation_to_error
        grounds:
          - errors.ERR_SESSION_OVERLAP
          - errors.ERR_INSTRUCTOR_DOUBLE_BOOKED
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / chapter_room_buffer_semantics"
          rationale: "ERR_SESSION_OVERLAP fires at 11:20 inside the buffer, and ERR_INSTRUCTOR_DOUBLE_BOOKED is exercised (with the contrasting half-open semantics) in resource_temporal_overlap / instructor_half_open_adjacency_semantics."

      - name: prohibited_pair_and_upcoming_campaign_errors
        claim_type: violation_to_error
        grounds:
          - errors.ERR_PROHIBITED_ENTITY_PAIR
          - errors.ERR_CAMPAIGN_NOT_ACTIVE
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / safety_pair_beats_fiscal_balance"
          rationale: "ERR_PROHIBITED_ENTITY_PAIR is the asserted outcome of the named §1.8 instance; ERR_CAMPAIGN_NOT_ACTIVE (UPCOMING side) is asserted in cross_entity_state_dependency / mobilization_requires_active_campaign_window."

      - name: lapsed_member_enrollment_blocked
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MEMBER_NOT_ACTIVE
          - calculations.household_standing
        excluded_because:
          difficulty_instance: "transitive_cascade / renewal_batch_three_hop_cascade"
          rationale: "The enrollment rejection of a lapsed household's member is the observable third link of the named §1.8 cascade instance."

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: cancel_immediately_visible_everywhere
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines.MembershipTerm.ACTIVE_to_CANCELLED
        distinguishing_aspect: "Immediate consistency: the cancel response itself carries refunded_cents 3,921, and the VERY NEXT reads — household and terms list — already show CANCELLED, lifetime_refunded_cents 3,921, and LAPSED standing; no reconciliation delay exists anywhere."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; household with a 3-year term (paid 4,320); clock advanced to 2026-11-15 (months_used 3)."
          setup_api_calls:
            - *c_clock
            - call: "POST /api/households"
              payload: { state_code: "CT", term_years: 3, primary_full_name: "Fay Fenn", primary_date_of_birth: "1965-05-05" }
              as: MemberServicesAgent
              captures: { hh41: $.data.id }
            - call: "GET /api/households/${hh41}/terms"
              payload: {}
              as: MemberServicesAgent
              captures: { term41: "$.data[0].id" }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/membership-terms/${term41}/cancel"
              payload: { reason: "VOLUNTARY" }
              as: MemberServicesAgent
              captures: { refund41: $.data.refunded_cents, status41: $.data.status }
          assert:
            - "the cancel response itself: status == CANCELLED and refunded_cents == 3921"
            - "GET /api/households/${hh41} immediately shows status == LAPSED, lifetime_refunded_cents == 3921, lifetime_collected_cents == 4320"
            - "GET /api/households/${hh41}/terms immediately shows the term CANCELLED with cancelled_at == \"2026-11-15T00:00:00Z\""
            - "GET /api/households/${hh41}/members immediately shows the primary member's in_good_standing == false"
