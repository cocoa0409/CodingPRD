          captures: {ins1_status_after: $.data.status}
        assert: ['${ins1_status} == ''VERIFIED'', the 10000000 limit meeting MIN_LIABILITY_CENTS exactly', '${e_stale} == ''ERR_STALE_DRIVER_VERSION'' with HTTP 412', '${ins_status_mid} == ''VERIFIED'' — the refused filing neither superseded POL-9001 nor changed the driver', '${drv_v3} == ${drv_v2} + 1, the one increment coming from the successful first filing', 'the retry returns HTTP 201 with ${ins2_status} == ''VERIFIED'' and ${ins1_status_after} == ''SUPERSEDED''', 'GET /store-ops/insurance-verifications?driver_id=${drv_id} reports total_count 2']
