          risk_before: $.data.residual_risk_score
          tier_before: $.data.poam_risk_tier
      - call: POST /poam-items/${high_id}/remediation
        payload:
          action: START
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - call: POST /poam-items/${high_id}/remediation
        payload:
          action: SUBMIT_EVIDENCE
        as: CspComplianceLead
        as_user_id: csp-lead-1
      - call: POST /poam-items/${high_id}/remediation
        payload:
          action: VERIFY_CLOSE
        as: ThirdPartyAssessor
        as_user_id: 3pao-1
        captures:
          closed_status: $.data.remediation_status
          reason: $.data.closure_reason
      - call: GET /authorizations/${auth_id}/risk-summary
        as: ProgramBoardReviewer
        as_user_id: board-1
        captures:
          risk_after: $.data.residual_risk_score
          open_after: $.data.open_findings_count
      - call: GET /authorization-packages/${pkg_id}
        as: CspComplianceLead
        as_user_id: csp-lead-1
        captures:
          snapshot: $.data.residual_risk_score_at_submission
      assert:
      - 'the first summary read: residual_risk_score == 10.00 (${risk_before}) with poam_risk_tier ''MODERATE'' (${tier_before})
        and overdue_high_count == 0'
      - the VERIFY_CLOSE response already reports remediation_status 'CLOSED' (${closed_status}) and closure_reason 'REMEDIATED'
        (${reason}) — the transition is not queued
      - 'the summary read issued immediately after it: residual_risk_score == 0.00 (${risk_after}), poam_risk_tier ''NONE''
        and open_findings_count == 0 (${open_after}), on the first attempt and with the logical clock unmoved'
      - 'the stored copy agrees with the computed one in the same instant: stored_residual_risk_score == 0.00 and Authorization.${auth_id}.open_findings_count
        == 0'
      - 'the frozen snapshot does not move: AuthorizationPackage.${pkg_id}.residual_risk_score_at_submission is still 10.00
        (${snapshot}) — immediate consistency applies to derived reads, not to deliberate snapshots'
      - 'PoamItem.${high_id}.risk_disposition == ''NONE'' throughout: the closure moved the remediation dimension only'
