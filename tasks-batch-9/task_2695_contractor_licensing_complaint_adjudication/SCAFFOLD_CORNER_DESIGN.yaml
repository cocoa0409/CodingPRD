          - endpoints[GET /licensing/qualifying-individuals/{id}/exam-results]
        distinguishing_aspect: "ExamResult declares common_fields: false — the §1.5 surface exposes only create and list for it, and the created row carries no version and no updated_at, so a second sitting is a new row rather than an edit."
        test_recipe:
          setup:
            - "clock at 2026-08-01 and one registered qualifier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BoardAdmin
