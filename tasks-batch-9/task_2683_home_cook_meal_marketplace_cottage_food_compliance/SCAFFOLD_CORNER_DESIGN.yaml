# =============================================================================
# 1.9 SCAFFOLD CORNER DESIGN - task_2683 Home-Cook Meal Marketplace &
# Cottage-Food Compliance
#
# Breadth pass over references/claim-extraction-guide.md, walked against this
# scaffold's 1.1-1.7. Nine sections, taxonomy-fixed claim_type values. Corners
# already carried by a named 1.8 instance appear as excluded_because stubs that
# cite that instance by rule_id / name; every other corner carries a full
# replayable test_recipe. Names are unique across 1.8 and 1.9.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION 1 - ENTITIES (1.1): creation, retrieval, listing, not-found,
  # required/default/computed/system fields, type constraints, flat-topology
  # FK integrity. All eleven entities are common_fields: true, so the guide's
  # Immutability row has no applicable subject and is skipped.
  # ===========================================================================
  - section: entities
    instances:

      - name: state_policy_creation_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.StatePolicy
          - endpoints.POST /state-policies
          - response_envelope.success
        distinguishing_aspect: >
          The configuration root of the whole domain. Every one of the seven input fields is
          required (no defaults), and the created row must echo them verbatim alongside the four
          common system fields, wrapped in the 1.0 success envelope with response_type "object".
        test_recipe:
          setup:
            - "Empty system. No StatePolicy exists yet."
          setup_api_calls: []
          trigger:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "response_type == object and meta.api_request_id and meta.api_request_timestamp are present"
            - "StatePolicy.${sp_id}.state_code == CA"
            - "StatePolicy.${sp_id}.cottage_food_annual_cap_cents == 5000000"
            - "StatePolicy.${sp_id}.allowed_kitchen_types == [HOME_COTTAGE, HOME_INSPECTED, COMMERCIAL_SHARED]"
            - "StatePolicy.${sp_id}.tcs_requires_commercial_kitchen == true"
            - "StatePolicy.${sp_id}.max_shelf_life_days_non_refrigerated == 14"
            - "StatePolicy.${sp_id}.label_required_fields has 5 members including cottage_food_disclaimer"
            - "StatePolicy.${sp_id}.cert_validity_max_days == 1825"
            - "StatePolicy.${sp_id}.id, created_at, updated_at are non-null and version == 1"

      - name: cook_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Cook.fields.weekly_capacity_meals
          - entities.Cook.fields.onboarding_status
          - entities.Cook.fields.compliance_standing
          - entities.Cook.fields.safety_score
          - entities.Cook.fields.cap_status
          - endpoints.POST /cooks
        distinguishing_aspect: >
          Self-registration omits the only optional input (weekly_capacity_meals) and must land on
          the declared default 40, while the eight computed fields take their declared defaults in
          one shot: DRAFT / CLEAR / safety_score 100 / UNDER_CAP / four zeroed money counters, with
          verified_kitchen_type still null because no inspection has ever been reviewed.
        test_recipe:
          setup:
            - "StatePolicy CA exists (cap 5,000,000 cents, all three kitchen types allowed)."
            - "No Cook exists yet."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
          trigger:
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Cook.${cook_id}.weekly_capacity_meals == 40 (declared default applied)"
            - "Cook.${cook_id}.onboarding_status == DRAFT"
            - "Cook.${cook_id}.compliance_standing == CLEAR"
            - "Cook.${cook_id}.safety_score == 100"
            - "Cook.${cook_id}.cap_status == UNDER_CAP"
            - "Cook.${cook_id}.ytd_gross_sales_cents == 0"
            - "Cook.${cook_id}.ytd_cottage_revenue_cents == 0"
            - "Cook.${cook_id}.pending_payout_cents == 0"
            - "Cook.${cook_id}.lifetime_paid_cents == 0"
            - "Cook.${cook_id}.verified_kitchen_type == null"
            - "Cook.${cook_id}.standing_reason == null"
            - "Cook.${cook_id}.version == 1"

      - name: cook_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Cook.fields.email
          - validations[priority=5].ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: >
          email carries source input with no default, so its absence is a priority-5 shape failure
          that must be reported before any uniqueness or state-policy lookup runs - the request never
          reaches the ERR_DUPLICATE_COOK_EMAIL or ERR_STATE_POLICY_NOT_FOUND checks.
        test_recipe:
          setup:
            - "StatePolicy CA exists."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
          trigger:
            - call: POST /cooks
              payload: { legal_name: "No Email", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { err_missing: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "${err_missing} == ERR_INVALID_REQUEST"
            - "no Cook row was created"

      - name: cook_creation_rejects_undeclared_enum_and_wrong_type
        claim_type: type_constraints
        grounds:
          - entities.Cook.fields.claimed_kitchen_type
          - entities.Cook.fields.weekly_capacity_meals
          - validations[priority=5].ERR_INVALID_REQUEST
        distinguishing_aspect: >
          Two distinct shape failures on the same endpoint: an enum value outside
          {HOME_COTTAGE, HOME_INSPECTED, COMMERCIAL_SHARED}, and a non-integer in an integer field.
          Both are ERR_INVALID_REQUEST at priority 5, never ERR_KITCHEN_TYPE_NOT_ALLOWED (which only
          fires later, at inspection review, for a value that IS a declared member).
        test_recipe:
          setup:
            - "StatePolicy CA exists and allows all three kitchen types."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
          trigger:
            - call: POST /cooks
              payload: { legal_name: "Garage Cook", email: "garage@example.com", state_code: "CA", claimed_kitchen_type: "GARAGE" }
              as: Anonymous
              captures: { err_enum: "$.data.error_id" }
            - call: POST /cooks
              payload: { legal_name: "Wordy Capacity", email: "wordy@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE", weekly_capacity_meals: "forty" }
              as: Anonymous
              captures: { err_type: "$.data.error_id" }
          assert:
            - "first trigger: HTTP 422 and ${err_enum} == ERR_INVALID_REQUEST"
            - "second trigger: HTTP 422 and ${err_type} == ERR_INVALID_REQUEST"
            - "neither error_id is ERR_KITCHEN_TYPE_NOT_ALLOWED"
            - "no Cook row was created by either call"

      - name: menu_item_label_compliance_status_computed_from_state_policy
        claim_type: computed_fields
        grounds:
          - entities.MenuItem.fields.label_compliance_status
          - entities.MenuItem.fields.review_status
          - entities.MenuItem.fields.revision_round
          - entities.StatePolicy.fields.label_required_fields
          - endpoints.POST /menu-items
        distinguishing_aspect: >
          label_compliance_status is derived at creation by a set-superset test against the cook's
          StatePolicy.label_required_fields, not supplied by the client. Two items created in the same
          breath diverge on that one derived field (MISSING_FIELDS vs COMPLIANT) purely because one
          label_fields array omits net_weight, while both start at review_status DRAFT / revision_round 0.
        test_recipe:
          setup:
            - "StatePolicy CA requires the five label keys cook_name, ingredients, allergens, net_weight, cottage_food_disclaimer."
            - "Cook Dara exists in state CA (onboarding_status DRAFT is sufficient: item creation has no ACTIVE gate)."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id" }
          trigger:
            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Unlabelled Bun", food_category: "BAKED_NON_TCS", allergens: ["WHEAT"], allergen_free_attested: false, shelf_life_days: 5, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 500, label_fields: ["cook_name", "ingredients", "allergens", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_bad_id: "$.data.id" }
            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Fully Labelled Bun", food_category: "BAKED_NON_TCS", allergens: ["WHEAT"], allergen_free_attested: false, shelf_life_days: 5, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 500, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_ok_id: "$.data.id" }
          assert:
            - "both calls return HTTP 201"
            - "MenuItem.${mi_bad_id}.label_compliance_status == MISSING_FIELDS"
            - "MenuItem.${mi_ok_id}.label_compliance_status == COMPLIANT"
            - "MenuItem.${mi_bad_id}.review_status == DRAFT AND MenuItem.${mi_ok_id}.review_status == DRAFT"
            - "MenuItem.${mi_bad_id}.revision_round == 0 AND MenuItem.${mi_ok_id}.revision_round == 0"
            - "MenuItem.${mi_ok_id}.approved_by_user_id == null AND approved_at == null AND delist_reason == null"

      - name: order_system_fields_stamped_from_headers_and_parent_rows
        claim_type: system_fields
        grounds:
          - entities.Order.fields.diner_user_id
          - entities.Order.fields.cook_id
          - entities.Order.fields.unit_price_cents_snapshot
          - entities.Order.fields.effective_year
          - entities.Order.fields.captured_at
          - endpoints.POST /orders
        distinguishing_aspect: >
          Order carries no client-writable owner: diner_user_id comes from the X-User-ID header,
          cook_id is copied from the referenced MenuItem (client values ignored), and
          unit_price_cents_snapshot freezes the menu price at placement. The two capture-time system
          fields (captured_at, effective_year) must still be null at placement, because payment is
          only AUTHORIZED.
        test_recipe:
          setup:
            - "StatePolicy CA exists; logical clock at 2026-08-01T00:00:00Z."
            - "Cook Dara is ACTIVE with verified_kitchen_type HOME_COTTAGE and one APPROVED NON_TCS item priced 610 cents."
            - "One OPEN ProductionWindow (cutoff 2026-08-05T00:00:00Z, handoff 16:00-18:00 on 2026-08-08, capacity 40) and one DOOR_DELIVERY zone."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE", weekly_capacity_meals: 40 }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-9001", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_doc_id: "$.data.id" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { cook_v1: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v1}", kitchen_type_claimed: "HOME_COTTAGE", inspection_date: "2026-06-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_doc_id: "$.data.id" }
            - call: POST /onboarding-documents/${cert_doc_id}/review
              payload: { decision: "VERIFY", note: "certificate valid" }
              as: ComplianceReviewer
              as_user_id: rev-1
            - call: POST /onboarding-documents/${insp_doc_id}/review
              payload: { decision: "PASS", note: "cottage kitchen inspected" }
              as: ComplianceReviewer
              as_user_id: rev-2
            - call: POST /cooks/${cook_id}/onboarding-decision
              payload: { decision: "ACTIVATE" }
              as: ComplianceReviewer
              as_user_id: rev-1
            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Jollof Tray", food_category: "NON_TCS", allergens: ["CELERY"], allergen_free_attested: false, shelf_life_days: 4, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 610, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { mi_id: "$.data.id" }
            - call: POST /menu-items/${mi_id}/submit
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
            - call: POST /menu-items/${mi_id}/review
              payload: { decision: "APPROVE", allergen_review_notes: "celery declared" }
              as: ComplianceReviewer
              as_user_id: rev-1
            - call: POST /production-windows
              payload: { cook_id: "${cook_id}", week_start_date: "2026-08-03", order_cutoff_at: "2026-08-05T00:00:00Z", handoff_start_at: "2026-08-08T16:00:00Z", handoff_end_at: "2026-08-08T18:00:00Z", capacity_meals: 40 }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { pw_id: "$.data.id" }
            - call: POST /delivery-zones
              payload: { state_policy_id: "${sp_id}", zone_code: "CA-DOOR-1", state_code: "CA", service_mode: "DOOR_DELIVERY", postal_codes: ["94110"], max_cold_chain_minutes: 180 }
              as: PlatformAdmin
              captures: { dz_id: "$.data.id" }
          trigger:
            - call: POST /orders
              payload: { menu_item_id: "${mi_id}", production_window_id: "${pw_id}", delivery_zone_id: "${dz_id}", quantity: 2, diner_contact_email: "dx@example.com" }
              as: Diner
              as_user_id: diner-x
              captures: { o_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Order.${o_id}.diner_user_id == diner-x (taken from the X-User-ID header, not the body)"
            - "Order.${o_id}.diner_contact_email == dx@example.com (the body field is a contact address, not the identity)"
            - "Order.${o_id}.cook_id == ${cook_id} (copied from the referenced MenuItem)"
            - "Order.${o_id}.unit_price_cents_snapshot == 610"
            - "Order.${o_id}.routing_mode == null AND pickup_hub_id == null (routing has not run)"
            - "Order.${o_id}.captured_at == null AND effective_year == null (payment is only AUTHORIZED)"
            - "Order.${o_id}.fulfillment_status == PLACED AND payment_status == AUTHORIZED"
            - "Order.${o_id}.id, created_at, updated_at non-null and version == 1"

      - name: state_policy_retrieval_returns_stored_row
        claim_type: retrieval
        grounds:
          - entities.StatePolicy
          - endpoints.GET /state-policies/{id}
        distinguishing_aspect: >
          The public read of the configuration root: an unauthenticated Anonymous caller can fetch
          the policy by id and every stored field round-trips unchanged, including both array fields.
        test_recipe:
          setup:
            - "One StatePolicy for CA exists."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
          trigger:
            - call: GET /state-policies/${sp_id}
              payload: {}
              as: Anonymous
              captures: { read_back_id: "$.data.id" }
          assert:
            - "HTTP 200 and response_type == object"
            - "${read_back_id} == ${sp_id}"
            - "StatePolicy.${sp_id}.state_code == CA AND cert_validity_max_days == 1825"
            - "StatePolicy.${sp_id}.allowed_kitchen_types and label_required_fields round-trip with identical members"

      - name: menu_items_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - entities.MenuItem
          - endpoints.GET /menu-items
          - response_envelope.pagination_fields
        distinguishing_aspect: >
          The list envelope must carry limit / offset / total_count / has_more, and total_count counts
          the whole filtered set rather than the returned page: three items with limit 2 give
          has_more true on page one and has_more false on page two, which is the only way a client
          can tell "no more rows" from "exactly a full page".
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Dara exists in CA."
            - "Dara owns exactly three DRAFT MenuItems."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id" }
            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Item One", food_category: "BAKED_NON_TCS", allergens: ["WHEAT"], allergen_free_attested: false, shelf_life_days: 5, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 500, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Item Two", food_category: "BAKED_NON_TCS", allergens: ["WHEAT"], allergen_free_attested: false, shelf_life_days: 5, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 600, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
            - call: POST /menu-items
              payload: { cook_id: "${cook_id}", name: "Item Three", food_category: "BAKED_NON_TCS", allergens: ["WHEAT"], allergen_free_attested: false, shelf_life_days: 5, requires_refrigeration: false, handoff_mode: "BATCH_COOK_AND_CHILL", unit_price_cents: 700, label_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"] }
              as: Cook
              as_user_id: "${cook_id}"
          trigger:
            - call: GET /menu-items
              payload: { cook_id: "${cook_id}", limit: 2, offset: 0 }
              as: Anonymous
              captures: { page1_first_id: "$.data[0].id" }
            - call: GET /menu-items
              payload: { cook_id: "${cook_id}", limit: 2, offset: 2 }
              as: Anonymous
              captures: { page2_first_id: "$.data[0].id" }
          assert:
            - "both calls return HTTP 200 with response_type == array"
            - "page one carries 2 rows, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "page two carries 1 row, total_count == 3, limit == 2, offset == 2, has_more == false"
            - "${page1_first_id} != ${page2_first_id} (no row is served twice across the two pages)"

      - name: onboarding_documents_listing_filters_by_cook_and_doc_type
        claim_type: listing
        grounds:
          - entities.OnboardingDocument.fields.cook_id
          - entities.OnboardingDocument.fields.doc_type
          - endpoints.GET /onboarding-documents
        distinguishing_aspect: >
          The flat topology has no nested routes, so a child is only discoverable through its
          parent-FK filter. Filtering the same collection by cook_id alone and by cook_id plus
          doc_type must narrow 2 rows to 1, proving the filters compose rather than overwrite.
        test_recipe:
          setup:
            - "StatePolicy CA exists; Cook Dara exists in CA."
            - "Dara has submitted one FOOD_HANDLER_CERT and one KITCHEN_INSPECTION (both review_status SUBMITTED)."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-7100", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_doc_id: "$.data.id" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: ComplianceReviewer
