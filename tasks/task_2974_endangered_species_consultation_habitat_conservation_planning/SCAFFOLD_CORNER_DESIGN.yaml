# ============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# Task 2974 — Endangered Species Consultation & Habitat Conservation Planning
#
# Walk of references/claim-extraction-guide.md's nine sections against this
# scaffold's §1.1-§1.7 surface. Every `section:` and `claim_type:` value below
# comes from that guide; no categories were invented. Corners already asserted
# by a §1.8 instance carry an `excluded_because:` stub instead of a duplicate
# recipe.
#
# Fixture user ids (opaque WildlifeAgency role):
#   fws-user-registrar / fws-user-reviewer / fws-user-issuer /
#   fws-user-approver / fws-user-adjudicator, plus fws-user-auditor for the
#   read-only Auditor role. Segregation of duties needs approver != issuer and
#   adjudicator != issuer, which these ids satisfy.
#
# Canonical fixture (reused by most recipes below, all literals pre-computed):
#   clock 2026-10-01T00:00:00Z; SP-E Gopherus agassizii ENDANGERED
#   (INDIVIDUALS, density 0.40, population 4000, season 4..7) with CHU-1 FINAL
#   in county 06037; SP-T Vireo bellii pusillus THREATENED (density 0.25,
#   population 9000); Mojave Habitat Bank over SP-E, service area [06037],
#   250000 cents/credit, 500.00 credits minted; one Proponent; one NON_FEDERAL
#   ProjectAction, footprint 200.00 acres, county 06037; PD1 (SP-E,
#   FIELD_SURVEY, DETECTED, 10.00 acres, CHU-1, 2026-05-04..2026-05-08) ->
#   PRESENT; PD2 (SP-T, DATABASE_QUERY, DETECTED, 7.35 acres) ->
#   PRESUMED_PRESENT; effect determination -> overlap_pct 8.68, LAA, FORMAL
#   consultation with statutory_days 135 and deadline_at 2027-02-13.
#   Biological opinion -> primary SP-E, exposed_acres 10.00,
#   authorized_take_units 4.00, jeopardy_fraction 0.0010, NO_JEOPARDY,
#   reinitiation_trigger_units 3.60. HCP covered_acres 20.00, term 30 years ->
#   preliminary_mitigation_units 60.00; commitments 45.01 + 14.71 bank credits
#   -> endowment_required_cents 5026514; funding 5026514 -> FULLY_ASSURED;
#   submit -> final_mitigation_units 59.70; APPROVE -> commitments SECURED;
#   permit ITP-000001, term 2026-10-01..2056-10-01, take ledger 0.00/4.00.
# ============================================================================
scaffold_corner_design:

  # ==========================================================================
  # From Table 1 (Entities)
  # ==========================================================================
  - section: entities
    instances:

      - name: species_creation_returns_201_with_registry_defaults
        claim_type: creation
        grounds:
          - entities.Species
          - entities.Species.fields.critical_habitat_designated
          - entities.Species.fields.listing_change_count
          - entities.Species.fields.last_listing_change_at
          - endpoints["POST /species"]
          - response_envelope.success
        distinguishing_aspect: >-
          A species created with all eight required inputs comes back 201 with
          every input echoed verbatim AND the three registry defaults the
          endpoint owns (critical_habitat_designated false, listing_change_count
          0, last_listing_change_at null). An implementation that leaves
          critical_habitat_designated null or omits the counters fails here even
          though it stored the inputs correctly.
        test_recipe:
          setup:
            - "Empty database. Logical clock parked at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
          trigger:
            - call: "POST /species"
              payload: {scientific_name: "Athene cunicularia hypugaea", common_name: "Western burrowing owl", listing_status: "CANDIDATE", take_authorization_unit: "NESTS", take_density_per_acre: 0.12, recovery_unit_population: 21000, survey_season_start_month: 3, survey_season_end_month: 8}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {owl_id: "$.data.id"}
          assert:
            - "HTTP 201 with response_type == 'object' and a meta block carrying api_request_id and api_request_timestamp"
            - "data.scientific_name == 'Athene cunicularia hypugaea', data.common_name == 'Western burrowing owl', data.listing_status == 'CANDIDATE'"
            - "data.take_authorization_unit == 'NESTS', data.take_density_per_acre == 0.12, data.recovery_unit_population == 21000"
            - "data.survey_season_start_month == 3 and data.survey_season_end_month == 8"
            - "data.critical_habitat_designated == false (no CriticalHabitatUnit exists yet)"
            - "data.listing_change_count == 0 and data.last_listing_change_at == null"
            - "data.id, data.created_at, data.updated_at and data.version are all present (Species declares common_fields: true)"

      - name: species_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints["GET /species/{id}"]
          - entities.Species
        distinguishing_aspect: >-
          GET /species/{id} returns the same field values that POST /species
          stored, including the two seasonality integers that only
          calculations.presence_status_derivation consumes, and is readable by
          the Auditor role that can write nothing.
        test_recipe:
          setup:
            - "SP-E registered exactly as in the canonical fixture."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
          trigger:
            - call: "GET /species/${species_e_id}"
              payload: {}
              as: Auditor
              as_user_id: "fws-user-auditor"
              captures: {sci: "$.data.scientific_name", designated: "$.data.critical_habitat_designated"}
          assert:
            - "HTTP 200 and data.scientific_name == 'Gopherus agassizii'"
            - "data.listing_status == 'ENDANGERED', data.take_authorization_unit == 'INDIVIDUALS', data.take_density_per_acre == 0.40"
            - "data.recovery_unit_population == 4000, data.survey_season_start_month == 4, data.survey_season_end_month == 7"
            - "data.critical_habitat_designated == false and data.listing_change_count == 0"

      - name: species_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=7]
          - endpoints["POST /species"]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          Every one of POST /species' eight `input:` entries is required (none
          carries a `?`), so omitting recovery_unit_population is a 400
          ERR_INVALID_REQUEST at validation priority 7 — not a 422, and not a
          silently defaulted 0 that would later divide the jeopardy fraction by
          zero.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
          trigger:
            - call: "POST /species"
              payload: {scientific_name: "Rana draytonii", common_name: "California red-legged frog", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.30, survey_season_start_month: 1, survey_season_end_month: 5}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {err: "$.data.error_id"}
          assert:
            - "the trigger returns ERR_INVALID_REQUEST with HTTP 400"
            - "no Species row is created — a subsequent POST /conservation-banks naming any id still fails, and the registry stays empty"
            - "omitting scientific_name, common_name, listing_status, take_authorization_unit, take_density_per_acre, survey_season_start_month or survey_season_end_month instead produces the same ERR_INVALID_REQUEST (400)"

      - name: species_creation_invalid_enum_or_month_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=7]
          - entities.Species.fields.listing_status
          - entities.Species.fields.survey_season_start_month
          - entities.Species.fields.recovery_unit_population
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          The enum set and the numeric ranges declared in §1.1 constraints are
          enforced at priority 7: a listing_status outside the four declared
          members, a month outside 1..12, a negative density and a
          recovery_unit_population of 0 are each ERR_INVALID_REQUEST (400).
          LISTING_RANK has no entry for an undeclared status, so accepting one
          would silently break the effect-determination ladder.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
          trigger:
            - call: "POST /species"
              payload: {scientific_name: "Rana draytonii", common_name: "California red-legged frog", listing_status: "EXTINCT", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.30, recovery_unit_population: 5000, survey_season_start_month: 1, survey_season_end_month: 5}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {err: "$.data.error_id"}
          assert:
            - "the trigger returns ERR_INVALID_REQUEST with HTTP 400 — 'EXTINCT' is not one of ENDANGERED | THREATENED | PROPOSED | CANDIDATE"
            - "the same body with survey_season_start_month 13 returns ERR_INVALID_REQUEST (400)"
            - "the same body with take_density_per_acre -0.10 returns ERR_INVALID_REQUEST (400) — the constraint is >= 0"
            - "the same body with recovery_unit_population 0 returns ERR_INVALID_REQUEST (400) — the constraint is >= 1"
            - "the same body with take_authorization_unit 'PAIRS' returns ERR_INVALID_REQUEST (400)"

      - name: species_system_counter_input_ignored
        claim_type: system_fields
        grounds:
          - validations[priority=7]
          - entities.Species.fields.listing_change_count
          - entities.Species.fields.critical_habitat_designated
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: >-
          listing_change_count is source: system and critical_habitat_designated
          is source: computed, so neither appears in POST /species' `input:`
          list. Validation priority 7 forbids unknown fields outright, so
          supplying them is a 400 rather than a silently ignored key — this
          pins which of the two plausible readings the implementation must take.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
          trigger:
            - call: "POST /species"
              payload: {scientific_name: "Rana draytonii", common_name: "California red-legged frog", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.30, recovery_unit_population: 5000, survey_season_start_month: 1, survey_season_end_month: 5, listing_change_count: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {err: "$.data.error_id"}
          assert:
            - "the trigger returns ERR_INVALID_REQUEST with HTTP 400 — listing_change_count is not in the endpoint's input list"
            - "the same body carrying critical_habitat_designated true instead returns ERR_INVALID_REQUEST (400)"
            - "the same body carrying id, created_at, updated_at or version returns ERR_INVALID_REQUEST (400)"
            - "with the extra key removed the identical body returns 201 with listing_change_count == 0 and critical_habitat_designated == false"

      - name: critical_habitat_unit_creation_recomputes_species_designation_flag
        claim_type: computed_fields
        grounds:
          - entities.Species.fields.critical_habitat_designated
          - endpoints["POST /species/{id}/critical-habitat-units"]
          - entities.CriticalHabitatUnit.fields.designation_status
        distinguishing_aspect: >-
          critical_habitat_designated is recomputed as `any unit of this species
          has designation_status == FINAL` on every unit create — so a PROPOSED
          unit leaves it false and a later FINAL unit on the same species flips
          it true. An implementation that simply sets the flag on any unit
          create passes the FINAL case and fails the PROPOSED one.
        test_recipe:
          setup:
            - "SP-E and SP-T registered per the canonical fixture."
            - "CHU-1 (FINAL) is created for SP-E; CHU-T1 (PROPOSED) then CHU-T2 (FINAL) are created for SP-T."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /species"
              payload: {scientific_name: "Vireo bellii pusillus", common_name: "Least Bell's vireo", listing_status: "THREATENED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.25, recovery_unit_population: 9000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_t_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-1", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu1_id: "$.data.id"}
            - call: "POST /species/${species_t_id}/critical-habitat-units"
              payload: {unit_code: "CHU-T1", acres: 500.00, county_code: "06037", designation_status: "PROPOSED", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chut1_id: "$.data.id"}
          trigger:
            - call: "GET /species/${species_t_id}"
              payload: {}
              as: Auditor
              as_user_id: "fws-user-auditor"
              captures: {t_designated: "$.data.critical_habitat_designated"}
          assert:
            - "the trigger reports SP-T critical_habitat_designated == false — CHU-T1 is PROPOSED, not FINAL"
            - "GET /species/${species_e_id} reports critical_habitat_designated == true, because CHU-1 is FINAL"
            - "after POST /species/${species_t_id}/critical-habitat-units creates CHU-T2 with designation_status FINAL, GET /species/${species_t_id} reports critical_habitat_designated == true"
            - "GET /species/${species_t_id}/critical-habitat-units then returns exactly 2 rows, CHU-T1 first (created_at ASC)"

      - name: critical_habitat_unit_parent_species_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - endpoints["POST /species/{id}/critical-habitat-units"]
          - errors[ERR_SPECIES_NOT_FOUND]
        distinguishing_aspect: >-
          CriticalHabitatUnit declares parent: Species, so the path id is
          resolved at validation priority 4 — before the body is even shape
          checked. A well-formed unit body under a nonexistent species id is
          ERR_SPECIES_NOT_FOUND (404), never ERR_CRITICAL_HABITAT_UNIT_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty species registry, clock at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
          trigger:
            - call: "POST /species/00000000-0000-4000-8000-000000000000/critical-habitat-units"
              payload: {unit_code: "CHU-X", acres: 120.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {err: "$.data.error_id"}
          assert:
            - "the trigger returns ERR_SPECIES_NOT_FOUND with HTTP 404"
            - "the same call with a malformed body (unit_code omitted) still returns ERR_SPECIES_NOT_FOUND (404), because priority 4 precedes priority 7"

      - name: critical_habitat_units_listing_is_unpaginated_and_ordered
        claim_type: listing
        grounds:
          - endpoints["GET /species/{id}/critical-habitat-units"]
          - response_envelope.pagination_fields
        distinguishing_aspect: >-
          Sub-resource lists are UNPAGINATED per §1.5's convention note: the
          envelope's pagination block is null and every row is returned in
          created_at ASC order. A generator that copies the paginated
          /project-actions envelope onto this endpoint emits total_count and
          has_more where none belong.
        test_recipe:
          setup:
            - "SP-E with CHU-1 (FINAL) created first and CHU-2 (PROPOSED) created second."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {species_e_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-1", acres: 500.00, county_code: "06037", designation_status: "FINAL", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu1_id: "$.data.id"}
            - call: "POST /species/${species_e_id}/critical-habitat-units"
              payload: {unit_code: "CHU-2", acres: 500.00, county_code: "06037", designation_status: "PROPOSED", primary_constituent_elements: ["burrow substrate", "forage cover"]}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
              captures: {chu2_id: "$.data.id"}
          trigger:
            - call: "GET /species/${species_e_id}/critical-habitat-units"
              payload: {}
              as: Auditor
              as_user_id: "fws-user-auditor"
              captures: {first_code: "$.data[0].unit_code", second_code: "$.data[1].unit_code"}
          assert:
            - "HTTP 200 with response_type == 'array' and exactly 2 rows"
            - "data[0].unit_code == 'CHU-1' and data[1].unit_code == 'CHU-2' — created_at ASC, never id order"
            - "the envelope carries a null pagination block: no limit, offset, total_count or has_more values are returned"
            - "data[0].designation_status == 'FINAL', data[1].designation_status == 'PROPOSED', and both rows carry species_id == ${species_e_id}"

      - name: proponent_creation_applies_declared_defaults
        claim_type: defaults
        grounds:
          - endpoints["POST /proponents"]
          - entities.Proponent.fields.is_federal_agency
          - entities.Proponent.fields.compliance_standing_score
          - entities.Proponent.fields.compliance_variant_applied
          - entities.Proponent.fields.open_reinitiation_count
        distinguishing_aspect: >-
          is_federal_agency is the only optional input and defaults to false;
          the three computed/derived fields are seeded to 100.00,
          LIFETIME and 0 respectively. The role is Anonymous — this is the one
          endpoint reachable without an X-User-ID.
        test_recipe:
          setup:
            - "Empty database, clock at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
          trigger:
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example"}
              as: Anonymous
              captures: {new_proponent_id: "$.data.id"}
          assert:
            - "HTTP 201 and data.is_federal_agency == false (the omitted optional input takes its declared default)"
            - "data.compliance_standing_score == 100.00 and data.compliance_variant_applied == 'LIFETIME' — no MonitoringReport exists, so the LIFETIME variant is selected"
            - "data.open_reinitiation_count == 0"
            - "data.org_name == 'Sunrise Logistics Park LLC' and data.contact_email == 'permits@sunrise-park.example'"
            - "supplying contact_email 'permits-sunrise-park.example' (no '@') instead returns ERR_INVALID_REQUEST (400)"

      - name: project_action_creation_seeds_screening_and_pending_determination
        claim_type: defaults
        grounds:
          - endpoints["POST /project-actions"]
          - entities.ProjectAction.fields.status
          - entities.ProjectAction.fields.effect_determination
          - entities.ProjectAction.fields.active_consultation_id
          - entities.ProjectAction.fields.reinitiation_reason
          - state_machines[entity=ProjectAction].initial_state
        distinguishing_aspect: >-
          A fresh action carries six seeded values at once — status SCREENING,
          effect_determination PENDING, total_overlap_acres 0.00, overlap_pct
          0.00, active_consultation_id null and reinitiation_reason NONE. PENDING
          is a distinct enum member from NO_EFFECT: an implementation that
          initialises effect_determination to NO_EFFECT would make an unscreened
          action look cleared.
        test_recipe:
          setup:
            - "One Proponent registered; clock at 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /proponents"
              payload: {org_name: "Sunrise Logistics Park LLC", contact_email: "permits@sunrise-park.example", is_federal_agency: false}
              as: Anonymous
              captures: {proponent_id: "$.data.id"}
          trigger:
            - call: "POST /project-actions"
              payload: {proponent_id: "${proponent_id}", action_name: "Sunrise Park Phase I", action_type: "NON_FEDERAL", footprint_acres: 200.00, county_code: "06037", construction_start_date: "2027-01-01", construction_end_date: "2027-12-31"}
              as: Proponent
              as_user_id: "${proponent_id}"
              captures: {new_action_id: "$.data.id"}
          assert:
            - "HTTP 201 with data.status == 'SCREENING' (the state machine's initial_state)"
            - "data.effect_determination == 'PENDING', not 'NO_EFFECT'"
            - "data.total_overlap_acres == 0.00 and data.overlap_pct == 0.00"
            - "data.active_consultation_id == null and data.reinitiation_reason == 'NONE'"
            - "data.proponent_id == ${proponent_id}, data.footprint_acres == 200.00, data.county_code == '06037'"
            - "GET /project-actions/${new_action_id}/consultations returns 0 rows — screening creates no consultation"
            - "the same body with construction_start_date '2027-12-31' and construction_end_date '2027-01-01' returns ERR_INVALID_REQUEST (400), because start must be <= end"

      - name: body_foreign_keys_are_resolved_flat_with_per_target_error_ids
        claim_type: flat
        grounds:
          - validations[priority=6]
          - errors[ERR_PROPONENT_NOT_FOUND]
          - errors[ERR_SPECIES_NOT_FOUND]
          - errors[ERR_CRITICAL_HABITAT_UNIT_NOT_FOUND]
          - errors[ERR_CONSERVATION_BANK_NOT_FOUND]
        distinguishing_aspect: >-
          The topology is FLAT — every relationship is an explicit FK, and only
          MitigationCommitment / IncidentalTakePermit / MonitoringReport /
          ChangedCircumstanceEvent take their parent from the path. Body FKs are
