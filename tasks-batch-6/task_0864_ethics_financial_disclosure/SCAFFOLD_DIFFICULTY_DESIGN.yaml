scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — dual_variant_calc (>=2, different entity domains)
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: late_penalty_provisional_vs_final
        grounds:
          - calculations.late_filing_penalty
          - state_machines.Statement.DRAFT_to_SUBMITTED
          - state_machines.Statement.SUBMITTED_to_ACCEPTED
          - entities.Penalty.fields.provisional_amount_cents
          - entities.Penalty.fields.assessed_amount_cents
        distinguishing_aspect: |
          Same statement (ELECTED filer, 40 days late) yields two different Penalty amounts:
          PROVISIONAL flat estimate 15000 stamped at submit vs FINAL tiered+category+capped 45000
          at accept — dual-variant on the Penalty/Statement domain.
        test_recipe:
          setup:
            - "Jurisdiction (base_fee 5000, daily 250, cap 50000); ELECTED Filer with CURRENT training; ANNUAL FilingPeriod due 2026-04-15; clock at 2026-05-25 (40 days late); statement submitted late (provisional penalty ACCRUING=15000)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 5000, gift_annual_source_limit_cents: 25000, penalty_base_fee_cents: 5000, penalty_daily_rate_cents: 250, penalty_cap_cents: 50000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: Registrar
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: { score: 100 }
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-04-15T00:00:00Z", label: "CY2025" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "GET /penalties"
              payload: { filer_id: "${filer_id}" }
              as: EthicsOfficer
              captures: { pen_id: "$.data[0].id", prov: "$.data[0].provisional_amount_cents" }
          trigger:
            - call: "POST /statements/${stmt_id}/accept"
              payload: { review_note: "ok" }
              as: EthicsOfficer
          assert:
            - "Penalty.${pen_id}.provisional_amount_cents == 15000"
            - "Penalty.${pen_id}.assessed_amount_cents == 45000"
            - "Penalty.${pen_id}.status == ASSESSED"
            - "Penalty.${pen_id}.provisional_amount_cents != Penalty.${pen_id}.assessed_amount_cents"

      - name: gift_reportable_net_vs_gross
        grounds:
          - calculations.gift_reportable_value
          - entities.GiftReport.fields.reportable_value_cents
          - entities.GiftReport.fields.disclosed_gross_cents
        distinguishing_aspect: |
          Same GiftReport (FMV 6000, consideration 2000) yields NET reportable 4000 (limit check)
          vs GROSS disclosed 6000 (public display) — dual-variant on the GiftReport domain, a
          different entity domain than the Penalty late-filing dual-variant.
        test_recipe:
          setup:
            - "Jurisdiction (single limit 5000); APPOINTED Filer with CURRENT training; no filing period needed."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 5000, gift_annual_source_limit_cents: 25000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ben Clerk", official_title: "Deputy", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          trigger:
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "Acme Corp", gift_kind: "GIFT", received_at: "2026-05-01T12:00:00Z", fair_market_value_cents: 6000, consideration_paid_cents: 2000 }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { gift_id: $.data.id }
          assert:
            - "GiftReport.${gift_id}.reportable_value_cents == 4000"
            - "GiftReport.${gift_id}.disclosed_gross_cents == 6000"
            - "GiftReport.${gift_id}.reportable_value_cents != GiftReport.${gift_id}.disclosed_gross_cents"
            - "Filer.${filer_id}.reportable_gift_total_cents == 4000"

  # =========================================================================
  # Rule 2 — combinatorial_formula (>=2, different modes)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: late_penalty_tiered_category_capped
        grounds:
          - calculations.late_filing_penalty
          - state_machines.Statement.SUBMITTED_to_ACCEPTED
          - entities.Penalty.fields.assessed_amount_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs with tiered-rate selection (tier-3 for 153 days), ELECTED category
          multiplier 2.0, and a nested min() cap — raw 234500 clamps to cap 50000.
        test_recipe:
          setup:
            - "Jurisdiction (base 5000, daily 250, cap 50000); ELECTED Filer CURRENT training; ANNUAL period due 2026-04-15; clock 2026-09-15 (153 days late); statement submitted late."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", penalty_base_fee_cents: 5000, penalty_daily_rate_cents: 250, penalty_cap_cents: 50000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: Registrar
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-04-15T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          trigger:
            - call: "POST /statements/${stmt_id}/accept"
              payload: {}
              as: EthicsOfficer
            - call: "GET /penalties"
              payload: { filer_id: "${filer_id}" }
              as: EthicsOfficer
              captures: { pen_id: "$.data[0].id" }
          assert:
            - "Penalty.${pen_id}.days_late == 153"
            - "Penalty.${pen_id}.assessed_amount_cents == 50000"

      - name: gift_travel_round_per_leg_then_sum
        grounds:
          - calculations.gift_travel_valuation
          - entities.GiftReport.fields.reportable_value_cents
        distinguishing_aspect: |
          Mode (b): rounding order pinned — two legs of 33 miles * 65.5c = 2161.5c each round-per-leg
          to 2162 then sum = 4324; sum-then-round would give 4323. Different mode than the tiered
          late-penalty formula (a) and on a different entity (GiftReport).
        test_recipe:
          setup:
            - "Jurisdiction (single limit 5000); Filer CURRENT training."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 5000, gift_annual_source_limit_cents: 25000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ben Clerk", official_title: "Deputy", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          trigger:
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "ConfOrg", gift_kind: "TRAVEL", received_at: "2026-05-01T00:00:00Z", consideration_paid_cents: 0, travel_legs: [ { nights: 0, nightly_rate_cents: 0, miles: 33 }, { nights: 0, nightly_rate_cents: 0, miles: 33 } ] }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { gift_id: $.data.id }
          assert:
            - "GiftReport.${gift_id}.reportable_value_cents == 4324"
            - "GiftReport.${gift_id}.disclosed_gross_cents == 4324"
            - "GiftReport.${gift_id}.status == REPORTED"

  # =========================================================================
  # Rule 3 — non_linear_state_machine (>=2, different entities)
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: statement_returned_resubmit_cycle
        grounds:
          - state_machines.Statement.SUBMITTED_to_RETURNED_FOR_CORRECTION
          - state_machines.Statement.RETURNED_FOR_CORRECTION_to_SUBMITTED
          - entities.Statement.fields.correction_round
        distinguishing_aspect: |
          Statement traverses SUBMITTED -> RETURNED_FOR_CORRECTION -> SUBMITTED (a revision cycle),
          a non-linear loop on the Statement entity.
        test_recipe:
          setup:
            - "Filer CURRENT training; ANNUAL period due 2026-06-01; clock 2026-05-01; statement submitted on-time then returned (correction_round=1)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "SENIOR_STAFF" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /statements/${stmt_id}/return"
              payload: { correction_note: "fix schedule C" }
              as: EthicsOfficer
          trigger:
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          assert:
            - "Statement.${stmt_id}.status == SUBMITTED"
            - "Statement.${stmt_id}.correction_round == 1"

      - name: investigation_reopen_cycle
        grounds:
          - state_machines.Investigation.OPEN_to_NOT_SUSTAINED
          - state_machines.Investigation.NOT_SUSTAINED_to_OPEN
          - state_machines.Complaint.SCREENED_to_DISMISSED
        distinguishing_aspect: |
          Investigation traverses OPEN -> NOT_SUSTAINED -> OPEN via reopen (a cycle), on the
          Investigation entity — a different entity than the Statement revision cycle.
        test_recipe:
          setup:
            - "Complaint SCREENED; Investigation opened by inv-1 then adjudicated NOT_SUSTAINED by adj-1 (complaint DISMISSED)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /complaints"
              payload: { filer_id: "${filer_id}", allegation: "undisclosed asset", complainant_ref: "cx-9" }
              as: EthicsOfficer
              captures: { complaint_id: $.data.id }
            - call: "POST /complaints/${complaint_id}/screen"
              payload: { decision: "SCREENED" }
              as: EthicsOfficer
            - call: "POST /complaints/${complaint_id}/investigations"
              payload: { scope_note: "review filings" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { inv_id: $.data.id }
            - call: "POST /investigations/${inv_id}/adjudicate"
              payload: { decision: "NOT_SUSTAINED", findings: "no violation" }
              as: Adjudicator
              as_user_id: "adj-1"
          trigger:
            - call: "POST /investigations/${inv_id}/reopen"
              payload: { reopen_reason: "new evidence" }
              as: EthicsOfficer
          assert:
            - "Investigation.${inv_id}.status == OPEN"
            - "Complaint.${complaint_id}.status == SCREENED"

  # =========================================================================
  # Rule 4 — transitive_cascade (>=2, depth>=3 and depth>=2, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_late_statement_penalty_filer_withhold
        grounds:
          - state_machines.Statement.SUBMITTED_to_ACCEPTED
          - state_machines.Penalty.ACCRUING_to_ASSESSED
          - entities.Filer.fields.outstanding_penalty_cents
          - entities.Filer.fields.compliance_status
          - entities.Statement.fields.public_status
        distinguishing_aspect: |
          Depth-3 cascade from statement accept: (1) accept ASSESSES the late Penalty (45000),
          (2) that ASSESS raises Filer.outstanding to 45000 and flips compliance to DELINQUENT,
          (3) DELINQUENT withholds the filer's previously PUBLISHED statement (public_status WITHHELD).
        test_recipe:
          setup:
            - "ELECTED filer with a prior on-time ACCEPTED+PUBLISHED CY2024 statement; a second CY2025 statement submitted 40 days late (provisional penalty ACCRUING); clock at 2026-05-25."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", penalty_base_fee_cents: 5000, penalty_daily_rate_cents: 250, penalty_cap_cents: 50000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: Registrar
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2024-01-01T00:00:00Z", coverage_end: "2024-12-31T00:00:00Z", due_at: "2026-01-15T00:00:00Z", label: "CY2024" }
              as: Registrar
              captures: { periodA_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${periodA_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmtA_id: $.data.id }
            - call: "POST /statements/${stmtA_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /statements/${stmtA_id}/accept"
              payload: {}
              as: EthicsOfficer
            - call: "GET /statements/${stmtA_id}"
              payload: {}
              as: Registrar
              captures: { vA: $.data.version }
            - call: "POST /statements/${stmtA_id}/publish"
              payload: { expected_statement_version: "${vA}", redaction_level: "REDACTED" }
              as: Registrar
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-04-15T00:00:00Z", label: "CY2025" }
              as: Registrar
              captures: { periodB_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: Registrar
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${periodB_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmtB_id: $.data.id }
            - call: "POST /statements/${stmtB_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          trigger:
            - call: "POST /statements/${stmtB_id}/accept"
              payload: {}
              as: EthicsOfficer
            - call: "GET /penalties"
              payload: { filer_id: "${filer_id}", statement_id: "${stmtB_id}" }
              as: EthicsOfficer
              captures: { penB_id: "$.data[0].id" }
          assert:
            - "Penalty.${penB_id}.status == ASSESSED"
            - "Penalty.${penB_id}.assessed_amount_cents == 45000"
            - "Filer.${filer_id}.outstanding_penalty_cents == 45000"
            - "Filer.${filer_id}.compliance_status == DELINQUENT"
            - "Statement.${stmtA_id}.public_status == WITHHELD"

      - name: adjudicate_sustained_complaint_flag_statement
        grounds:
          - state_machines.Investigation.OPEN_to_SUSTAINED
          - state_machines.Complaint.SCREENED_to_SUBSTANTIATED
          - state_machines.Statement.ACCEPTED_to_FLAGGED
        distinguishing_aspect: |
          Depth-2 cascade from investigation adjudicate SUSTAINED: (1) SUSTAINED substantiates the
          parent Complaint, (2) the substantiated Complaint FLAGS its subject Statement (ACCEPTED->FLAGGED).
          Different trigger than the accept cascade.
        test_recipe:
          setup:
            - "Filer with an ACCEPTED CY2025 statement (on-time); a Complaint about that statement, SCREENED; an Investigation opened by inv-1."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", penalty_cap_cents: 50000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: Registrar
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-01-15T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /statements/${stmt_id}/accept"
              payload: {}
              as: EthicsOfficer
            - call: "POST /complaints"
              payload: { filer_id: "${filer_id}", allegation: "omitted asset", statement_id: "${stmt_id}", complainant_ref: "cx-1" }
              as: EthicsOfficer
              captures: { complaint_id: $.data.id }
            - call: "POST /complaints/${complaint_id}/screen"
              payload: { decision: "SCREENED" }
              as: EthicsOfficer
            - call: "POST /complaints/${complaint_id}/investigations"
              payload: { scope_note: "review" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /investigations/${inv_id}/adjudicate"
              payload: { decision: "SUSTAINED", recommended_sanction_cents: 30000, findings: "asset omitted" }
              as: Adjudicator
              as_user_id: "adj-1"
          assert:
            - "Investigation.${inv_id}.status == SUSTAINED"
            - "Investigation.${inv_id}.final_sanction_cents == 30000"
            - "Complaint.${complaint_id}.status == SUBSTANTIATED"
            - "Statement.${stmt_id}.status == FLAGGED"

  # =========================================================================
  # Rule 5 — priority_pair_validation_conflict (>=2, different error-category pairs)
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_invalid_state_beats_delinquent
        grounds:
          - validations[priority=7]
          - validations[priority=14]
        distinguishing_aspect: |
          A single submit both violates state (priority 7, ERR_INVALID_STATE — statement already
          ACCEPTED) and fiscal (priority 14, ERR_FILER_DELINQUENT — outstanding 45000); the state
          error wins. Category pair: state vs business_fiscal.
        test_recipe:
          setup:
            - "ELECTED filer submitted a 40-day-late CY2025 statement and it was ACCEPTED (penalty 45000 ASSESSED -> filer DELINQUENT); statement now ACCEPTED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", penalty_base_fee_cents: 5000, penalty_daily_rate_cents: 250, penalty_cap_cents: 50000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: Registrar
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-04-15T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /statements/${stmt_id}/accept"
              payload: {}
              as: EthicsOfficer
          trigger:
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: gift_training_beats_limit
        grounds:
          - validations[priority=9]
          - validations[priority=13]
        distinguishing_aspect: |
          A single gift report both violates safety (priority 9, ERR_TRAINING_NOT_CURRENT — filer
          training NONE) and constraint (priority 13, ERR_GIFT_LIMIT_EXCEEDED — NET 7000 > limit 5000);
          the safety error wins. Category pair: business_safety vs business_constraint.
        test_recipe:
          setup:
            - "Filer with NO completed training (training_status NONE); jurisdiction single-gift limit 5000."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 5000, gift_annual_source_limit_cents: 25000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ben Clerk", official_title: "Deputy", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
          trigger:
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "Acme Corp", gift_kind: "GIFT", received_at: "2026-05-01T00:00:00Z", fair_market_value_cents: 8000, consideration_paid_cents: 1000 }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TRAINING_NOT_CURRENT"

  # =========================================================================
  # Rule 6 — boundary_precision_check (>=2, different metrics, different endpoints)
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: gift_net_equals_single_limit
        grounds:
          - validations[priority=13]
          - calculations.gift_reportable_value
          - entities.GiftReport.fields.reportable_value_cents
        distinguishing_aspect: |
          NET reportable value exactly equal to the single-gift limit (5000 == 5000) is ALLOWED
          (<=), on POST /gift-reports; a money-threshold boundary.
        test_recipe:
          setup:
            - "Filer CURRENT training; jurisdiction single-gift limit 5000."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", gift_single_limit_cents: 5000, gift_annual_source_limit_cents: 25000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ben Clerk", official_title: "Deputy", filer_category: "APPOINTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
          trigger:
            - call: "POST /gift-reports"
              payload: { filer_id: "${filer_id}", source_name: "Acme Corp", gift_kind: "GIFT", received_at: "2026-05-01T00:00:00Z", fair_market_value_cents: 5000, consideration_paid_cents: 0 }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { gift_id: $.data.id }
          assert:
            - "GiftReport.${gift_id}.reportable_value_cents == 5000"
            - "GiftReport.${gift_id}.status == REPORTED"

      - name: statement_submitted_exactly_at_due
        grounds:
          - calculations.late_filing_penalty
          - state_machines.Statement.DRAFT_to_SUBMITTED
          - entities.Statement.fields.is_late
          - entities.Statement.fields.days_late
        distinguishing_aspect: |
          submitted_at exactly equal to due_at is ON-TIME (submitted_at <= due, days_late 0, no
          penalty), on POST /statements/{id}/submit; a time-instant boundary, a different metric and
          endpoint than the gift money boundary.
        test_recipe:
          setup:
            - "Filer CURRENT training; ANNUAL period due 2026-04-15T00:00:00Z; clock set to exactly 2026-04-15T00:00:00Z."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", penalty_base_fee_cents: 5000, penalty_daily_rate_cents: 250, penalty_cap_cents: 50000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: Registrar
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-04-15T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "GET /penalties"
              payload: { filer_id: "${filer_id}" }
              as: EthicsOfficer
              captures: { total: $.data }
          assert:
            - "Statement.${stmt_id}.is_late == false"
            - "Statement.${stmt_id}.days_late == 0"
            - "GET /penalties?filer_id=${filer_id} total_count == 0"

  # =========================================================================
  # Rule 7 — cross_entity_state_dependency (>=2, different entity pairs)
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: statement_submit_requires_filer_active
        grounds:
          - state_machines.Statement.DRAFT_to_SUBMITTED
          - entities.Filer.fields.status
        distinguishing_aspect: |
          Statement DRAFT->SUBMITTED is gated on the owning Filer.status == ACTIVE; a SEPARATED filer
          cannot submit (ERR_INVALID_STATE). Entity pair Statement->Filer.
        test_recipe:
          setup:
            - "Filer CURRENT training with a DRAFT statement; filer then set to SEPARATED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "SENIOR_STAFF" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-06-01T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
            - call: "PATCH /filers/${filer_id}/status"
              payload: { status: "SEPARATED" }
              as: Registrar
          trigger:
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Statement.${stmt_id}.status == DRAFT"

      - name: investigation_open_requires_complaint_screened
        grounds:
          - state_machines.Investigation.OPEN_to_SUSTAINED
          - entities.Complaint.fields.status
        distinguishing_aspect: |
          Opening an Investigation requires the parent Complaint.status == SCREENED; opening on a
          FILED (unscreened) complaint fails (ERR_INVALID_STATE). Entity pair Investigation->Complaint,
          distinct from Statement->Filer.
        test_recipe:
          setup:
            - "A Complaint in FILED status (not yet screened)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /complaints"
              payload: { filer_id: "${filer_id}", allegation: "conflict", complainant_ref: "cx-2" }
              as: EthicsOfficer
              captures: { complaint_id: $.data.id }
          trigger:
            - call: "POST /complaints/${complaint_id}/investigations"
              payload: { scope_note: "premature" }
              as: Investigator
              as_user_id: "inv-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

  # =========================================================================
  # Rule 8 — resource_temporal_overlap (>=2, different interval semantics, different resources)
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: recusal_overlap_half_open
        grounds:
          - validations[priority=10]
          - entities.RecusalEntry.fields.effective_start
          - entities.RecusalEntry.fields.effective_end
        distinguishing_aspect: |
          Two DECLARED recusals on the same (filer, matter) with HALF-OPEN [start,end) intervals
          [2026-06-01,2026-06-10) and [2026-06-05,2026-06-15) overlap -> ERR_RECUSAL_OVERLAP. Half-open
          semantics on the Filer/matter resource.
        test_recipe:
          setup:
            - "Filer with one DECLARED recusal on matter M1 over [2026-06-01, 2026-06-10)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /recusals"
              payload: { filer_id: "${filer_id}", matter_id: "M1", effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-10T00:00:00Z", reason: "family interest" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { rec1_id: $.data.id }
          trigger:
            - call: "POST /recusals"
              payload: { filer_id: "${filer_id}", matter_id: "M1", effective_start: "2026-06-05T00:00:00Z", effective_end: "2026-06-15T00:00:00Z", reason: "overlap" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_RECUSAL_OVERLAP"

      - name: filing_period_overlap_closed
        grounds:
          - validations[priority=11]
          - entities.FilingPeriod.fields.coverage_start
          - entities.FilingPeriod.fields.coverage_end
        distinguishing_aspect: |
          Two ANNUAL FilingPeriods of the same jurisdiction with CLOSED intervals [2025-01-01,2025-12-31]
          and [2025-12-31,2026-12-31] share the endpoint 2025-12-31 and therefore conflict ->
          ERR_PERIOD_OVERLAP. Closed-interval semantics (touching conflicts), unlike the half-open recusal,
          on the Jurisdiction resource.
        test_recipe:
          setup:
            - "Jurisdiction with one ANNUAL period covering [2025-01-01, 2025-12-31]."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-04-15T00:00:00Z", label: "CY2025" }
              as: Registrar
              captures: { periodA_id: $.data.id }
          trigger:
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-12-31T00:00:00Z", coverage_end: "2026-12-31T00:00:00Z", due_at: "2027-04-15T00:00:00Z", label: "CY2026" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PERIOD_OVERLAP"

  # =========================================================================
  # Rule 9 — compensating_invariant (>=2, different conserved quantities)
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: penalty_outstanding_conserved
        grounds:
          - calculations.outstanding_penalty_ledger
          - state_machines.Penalty.ACCRUING_to_ASSESSED
          - state_machines.Penalty.ASSESSED_to_PAID
          - entities.Filer.fields.outstanding_penalty_cents
        distinguishing_aspect: |
          Conserved money quantity: Filer.outstanding_penalty_cents == sum of assessed_amount_cents
          over ASSESSED penalties. Assess(+45000) then pay(-45000) leaves outstanding == 0 with no drift.
        test_recipe:
          setup:
            - "ELECTED filer with a 40-day-late statement ACCEPTED so a 45000 penalty is ASSESSED (outstanding 45000, DELINQUENT)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board", penalty_base_fee_cents: 5000, penalty_daily_rate_cents: 250, penalty_cap_cents: 50000 }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-25T00:00:00Z" }
              as: Registrar
            - call: "POST /training-records"
              payload: { filer_id: "${filer_id}", course_code: "ETH-101" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { tr_id: $.data.id }
            - call: "POST /training-records/${tr_id}/complete"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /filing-periods"
              payload: { jurisdiction_id: "${jur_id}", statement_type: "ANNUAL", coverage_start: "2025-01-01T00:00:00Z", coverage_end: "2025-12-31T00:00:00Z", due_at: "2026-04-15T00:00:00Z" }
              as: Registrar
              captures: { period_id: $.data.id }
            - call: "POST /statements"
              payload: { filer_id: "${filer_id}", filing_period_id: "${period_id}" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { stmt_id: $.data.id }
            - call: "POST /statements/${stmt_id}/submit"
              payload: {}
              as: Filer
              as_user_id: "${filer_id}"
            - call: "POST /statements/${stmt_id}/accept"
              payload: {}
              as: EthicsOfficer
            - call: "GET /penalties"
              payload: { filer_id: "${filer_id}" }
              as: EthicsOfficer
              captures: { pen_id: "$.data[0].id" }
          trigger:
            - call: "POST /penalties/${pen_id}/pay"
              payload: { payment_ref: "chk-1" }
              as: Filer
              as_user_id: "${filer_id}"
          assert:
            - "Penalty.${pen_id}.status == PAID"
            - "Filer.${filer_id}.outstanding_penalty_cents == 0"
            - "Filer.${filer_id}.compliance_status == COMPLIANT"

      - name: recusal_open_count_conserved
        grounds:
          - state_machines.RecusalEntry.DECLARED_to_RESOLVED
          - entities.Filer.fields.open_recusal_count
        distinguishing_aspect: |
          Conserved COUNT quantity: Filer.open_recusal_count == number of DECLARED recusals.
          Declare two (+1,+1 -> 2) then resolve one (-1 -> 1) leaves count == 1, matching the one
          remaining DECLARED row, no drift. A count invariant, distinct from the money penalty invariant.
        test_recipe:
          setup:
            - "Filer with two DECLARED recusals on distinct matters M1 and M2 (open_recusal_count == 2)."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Metro Ethics Board" }
              as: Registrar
              captures: { jur_id: $.data.id }
            - call: "POST /filers"
              payload: { jurisdiction_id: "${jur_id}", full_name: "Ada Council", official_title: "Councilmember", filer_category: "ELECTED" }
              as: Registrar
              captures: { filer_id: $.data.id }
            - call: "POST /recusals"
              payload: { filer_id: "${filer_id}", matter_id: "M1", effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-10T00:00:00Z" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { rec1_id: $.data.id }
            - call: "POST /recusals"
              payload: { filer_id: "${filer_id}", matter_id: "M2", effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-10T00:00:00Z" }
              as: Filer
              as_user_id: "${filer_id}"
              captures: { rec2_id: $.data.id }
          trigger:
            - call: "POST /recusals/${rec1_id}/resolve"
              payload: { resolution_note: "cleared" }
              as: Filer
              as_user_id: "${filer_id}"
          assert:
            - "RecusalEntry.${rec1_id}.status == RESOLVED"
            - "Filer.${filer_id}.open_recusal_count == 1"
