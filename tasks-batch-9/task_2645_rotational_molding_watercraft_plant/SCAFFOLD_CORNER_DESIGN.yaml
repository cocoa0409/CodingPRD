        distinguishing_aspect: "Each of the four type-constraint families on this scaffold raises a DIFFERENT 422 error id — undeclared enum member ERR_INVALID_ENUM_VALUE, out-of-range count or percentage ERR_INVALID_QUANTITY, reversed bucket window ERR_INVALID_WINDOW, and an enum that is a declared member but disagrees with the parent row ERR_MOLD_SIZE_CLASS_MISMATCH — so a single generic 422 for all four fails this instance."
