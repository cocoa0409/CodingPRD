# =============================================================================
# SCAFFOLD.yaml — Vineyard Management & Custom Farming
# Sections §1.0 – §1.7. (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.)
# =============================================================================

scenario: |
  2767. Vineyard Management & Custom Farming (vineyard management company): block
  inventory by variety, clone, rootstock and trellis system with planting year and
  vine spacing, annual farming plan with pruning, canopy management, irrigation and
  pest program budgets per acre, labor crew scheduling across pruning, suckering,
  leafing and harvest with piece-rate and hourly pay structures, irrigation
  scheduling using soil moisture, evapotranspiration and deficit irrigation strategy
  by quality target, pest and disease monitoring with spray records, re-entry
  intervals and pre-harvest intervals, yield estimation through cluster counts and
  berry sampling for harvest planning, custom farming contracts with per-acre fees,
  cost pass-through and quality incentives, harvest coordination with winery delivery
  windows and picking crew logistics

domain_name: "vineyard-management-custom-farming"
api_prefix: "/"

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Temporal windowing"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  # graph: WorkOrder is a Crew x Block x FarmingPlan junction, HarvestLoad is a
  # Block x Crew x DeliveryWindow junction, Block carries a self-referential
  # replaces_block_id edge (replant lineage), and SprayRecord edges a
  # PestObservation to a Block and a FarmingPlan.

  state_machine_shape: parallel
  # WorkOrder carries two independent state dimensions (execution_status x
  # payroll_status). FarmingPlan is cyclic (SUBMITTED -> DRAFT revision loop,
  # capped at 2 rounds). HarvestLoad is branching (IN_TRANSIT -> {RECEIVED,
  # REJECTED} with divergent side-effect sets). Block/Contract/SprayRecord/
  # IrrigationEvent are linear with system-triggered auto-transitions.

  relationship_patterns:
    - one_to_many          # Vineyard -> Block, Block -> FarmingPlan / SprayRecord / IrrigationEvent
    - many_to_many         # WorkOrder (Crew x Block), HarvestLoad (Block x Crew x DeliveryWindow)
    - self_referential     # Block.replaces_block_id -> Block.id (replant lineage)
    - cross_aggregate      # SprayRecord mutations reach WorkOrder and FarmingPlan ledgers

  role_model: segregation_of_duties
  # A spray may not be applied by its recommender, and may not be verified by
  # either its recommender or its applicator; a farming plan may not be approved
  # by the user who submitted it.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 48 endpoints / 54 error codes / 16 calculations (3 carrying
  # divergent variants) / 8 state machines over 7 entities (WorkOrder declares
  # two independent axes) / 50 ordered validation rules / 7 roles.
  # Density target: every write endpoint either consumes or mutates at least
  # one cross-entity derived ledger.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Vineyard
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: name
        type: string
        source: input
        description: "Ranch name as used on the client contract."
        constraints: "1..120 chars, non-blank"
      - name: owner_legal_name
        type: string
        source: input
        description: "Legal entity that owns the ranch and signs custom-farming contracts."
        constraints: "1..160 chars, non-blank"
      - name: ava_region
        type: string
        source: input
        description: "American Viticultural Area the ranch sits in."
        constraints: "1..80 chars, non-blank"
      - name: client_contact_email
        type: string
        source: input
        description: "Client-side contact address for plan and settlement correspondence."
        constraints: "must contain exactly one '@'"
      - name: block_count
        type: integer
        source: computed
        description: "Count of Block rows with vineyard_id == this Vineyard.id AND farming_status IN {ESTABLISHING, BEARING}. Recomputed on every Block create and on every Block farming_status change."
      - name: managed_acres
        type: number
        source: computed
        description: "Sum of Block.acres over Block rows with vineyard_id == this Vineyard.id AND farming_status IN {ESTABLISHING, BEARING}, rounded to 2 decimals, round_half_up. Recomputed with block_count."
        default: 0.00

  - name: Block
    parent: Vineyard
    common_fields: true
    entity_kind: resource
    fields:
      - name: vineyard_id
        type: string
        source: input
        description: "FK -> Vineyard.id; the ranch that owns this planted block."
      - name: contract_id
        type: string
        source: system
        description: "FK -> CustomFarmingContract.id; set by POST /contracts/{id}/enroll-block, null until the block is enrolled. Never cleared."
        default: null
      - name: replaces_block_id
        type: string
        source: input
        description: "FK -> Block.id; the predecessor block this replant supersedes. Null for original plantings. When supplied at create time the predecessor's farming_status is driven to REMOVED."
        default: null
      - name: block_code
        type: string
        source: input
        description: "Operator-facing block label, unique within the owning Vineyard."
        constraints: "1..24 chars; unique per (vineyard_id, block_code)"
      - name: variety
        type: enum
        source: input
        description: "Wine grape variety planted in the block."
        constraints: "one of {CABERNET_SAUVIGNON, CHARDONNAY, PINOT_NOIR, ZINFANDEL, SYRAH}"
      - name: clone
        type: string
        source: input
        description: "Certified clonal selection identifier, e.g. FPS-08."
        constraints: "1..24 chars, non-blank"
      - name: rootstock
        type: enum
        source: input
        description: "Rootstock the scion is grafted onto."
        constraints: "one of {ROOTSTOCK_1103P, ROOTSTOCK_110R, ROOTSTOCK_SO4, RIPARIA_GLOIRE, ST_GEORGE}"
      - name: trellis_system
        type: enum
        source: input
        description: "Trellis / training system installed in the block."
        constraints: "one of {VSP, SPRAWL, QUADRILATERAL_CORDON, HEAD_TRAINED, GDC}"
      - name: planting_year
        type: integer
        source: input
        description: "Calendar year the block was planted; drives the ESTABLISHING -> BEARING transition."
        constraints: "1900..2100"
      - name: vine_spacing_ft
        type: number
        source: input
        description: "In-row vine spacing in feet."
        constraints: "> 0"
      - name: row_spacing_ft
        type: number
        source: input
        description: "Between-row spacing in feet."
        constraints: "> 0"
      - name: acres
        type: number
        source: input
        description: "Planted acreage of the block."
        constraints: "> 0"
      - name: contracted_acres
        type: number
        source: system
        description: "Acreage enrolled under contract_id, set by POST /contracts/{id}/enroll-block. Null while unenrolled."
        default: null
      - name: per_acre_fee_override
        type: number
        source: system
        description: "Block-specific per-acre management fee that overrides CustomFarmingContract.per_acre_annual_fee for this block. Null means use the contract rate."
        default: null
      - name: vines_per_acre
        type: integer
        source: computed
        description: "floor(43560 / (vine_spacing_ft * row_spacing_ft)). Computed once at create; immutable thereafter."
      - name: vine_count
        type: integer
        source: computed
        description: "floor(vines_per_acre * acres). Computed once at create; immutable thereafter."
      - name: farming_status
        type: enum
        source: system
        description: "Lifecycle of the planting. See §1.2 Block."
        default: "ESTABLISHING"
        constraints: "one of {ESTABLISHING, BEARING, REMOVED}"
      - name: rei_clear_at
        type: datetime
        source: computed
        description: "Maximum of SprayRecord.rei_clear_at over SprayRecord rows with block_id == this Block.id AND spray_status IN {APPLIED, VERIFIED}; null when that set is empty. Recomputed on every spray apply."
        default: null
      - name: phi_clear_at
        type: datetime
        source: computed
        description: "Maximum of SprayRecord.phi_clear_at over SprayRecord rows with block_id == this Block.id AND spray_status IN {APPLIED, VERIFIED}; null when that set is empty. Recomputed on every spray apply."
        default: null
      - name: compliance_posture
        type: enum
        source: computed
        description: "Derived from the logical clock: REENTRY_RESTRICTED when rei_clear_at is not null AND current_utc < rei_clear_at; else PHI_RESTRICTED when phi_clear_at is not null AND current_utc < phi_clear_at; else CLEAR. Evaluated on every read and after every POST /_clock/set_current_utc."
        default: "CLEAR"
        constraints: "one of {CLEAR, REENTRY_RESTRICTED, PHI_RESTRICTED}"
      - name: season_applied_inches
        type: number
        source: computed
        description: "Sum of IrrigationEvent.applied_inches over IrrigationEvent rows with block_id == this Block.id AND irrigation_status == APPLIED, rounded to 3 decimals, round_half_up."
        default: 0.000
      - name: governing_estimate_tons
        type: number
        source: computed
        description: "YieldEstimate.estimated_tons of the governing estimate for this block (see calculations.governing_yield_estimate_selector); 0.00 when the block has no YieldEstimate."
        default: 0.00
      - name: committed_harvest_tons
        type: number
        source: computed
        description: "Sum of HarvestLoad.estimated_tons over HarvestLoad rows with block_id == this Block.id AND load_status IN {PLANNED, IN_TRANSIT}, rounded to 2 decimals, round_half_up."
        default: 0.00
      - name: received_tons
        type: number
        source: computed
        description: "Sum of HarvestLoad.net_tons over HarvestLoad rows with block_id == this Block.id AND load_status == RECEIVED, rounded to 2 decimals, round_half_up."
        default: 0.00
      - name: remaining_estimated_tons
        type: number
        source: computed
        description: "round(governing_estimate_tons - committed_harvest_tons - received_tons, 2), round_half_up. May go negative only through the HARVEST_TOLERANCE allowance."
        default: 0.00
      - name: harvest_posture
        type: enum
        source: computed
        description: "NOT_ESTIMATED when the block has no YieldEstimate; else COMPLETE when remaining_estimated_tons <= 0; else OPEN."
        default: "NOT_ESTIMATED"
        constraints: "one of {NOT_ESTIMATED, OPEN, COMPLETE}"

  - name: CustomFarmingContract
    parent: Vineyard
    common_fields: true
    entity_kind: resource
    fields:
      - name: vineyard_id
        type: string
        source: input
        description: "FK -> Vineyard.id; the ranch this custom-farming agreement covers."
      - name: per_acre_annual_fee
        type: number
        source: input
        description: "Default management fee charged per contracted acre per settlement period."
        constraints: ">= 0"
      - name: cost_pass_through_pct
        type: number
        source: input
        description: "Fraction of direct farming cost billed back to the client on top of the management fee."
        constraints: "0 <= value <= 1"
      - name: quality_incentive_per_ton
        type: number
        source: input
        description: "Incentive paid to the farming company per received ton whose brix_at_receipt >= quality_brix_threshold."
        constraints: ">= 0"
      - name: quality_brix_threshold
        type: number
        source: input
        description: "Degrees brix a received load must reach (>=) to earn the quality incentive."
        constraints: "> 0"
      - name: period_overhead_pool
        type: number
        source: input
        description: "Fixed overhead dollars allocated across enrolled blocks by contracted-acre share in each settlement run."
        constraints: ">= 0"
      - name: period_start
        type: string
        source: input
        description: "Contract coverage start date, YYYY-MM-DD."
      - name: period_end
        type: string
        source: input
        description: "Contract coverage end date, YYYY-MM-DD; must be >= period_start."
      - name: contract_status
        type: enum
        source: system
        description: "Lifecycle of the agreement. See §1.2 CustomFarmingContract."
        default: "DRAFT"
        constraints: "one of {DRAFT, ACTIVE, CLOSED}"
      - name: client_signature_name
        type: string
        source: system
        description: "Name captured from POST /contracts/{id}/activate; null while DRAFT."
        default: null
      - name: enrolled_block_count
        type: integer
        source: computed
        description: "Count of Block rows with contract_id == this CustomFarmingContract.id."
        default: 0
      - name: total_contracted_acres
        type: number
        source: computed
        description: "Sum of Block.contracted_acres over Block rows with contract_id == this CustomFarmingContract.id, rounded to 2 decimals, round_half_up. Denominator of the overhead allocation."
        default: 0.00
      - name: accrued_quality_incentive
        type: number
        source: computed
        description: "Sum of HarvestLoad.quality_incentive_amount over HarvestLoad rows whose block_id belongs to a Block with contract_id == this contract AND load_status == RECEIVED, rounded to 2 decimals, round_half_up."
        default: 0.00
      - name: projected_total_billable
        type: number
        source: computed
        description: "round(management_fee_base + accrued_quality_incentive, 2) where management_fee_base is defined in calculations.contract_management_fee_base. Excludes pass-through and volume discount by design."
        default: 0.00
      - name: settled_period_count
        type: integer
        source: system
        description: "Number of POST /contracts/{id}/settle-period runs completed against this contract."
        default: 0
      - name: last_settlement_total
        type: number
        source: system
        description: "total_billable of the most recent settle-period run; null before the first run."
        default: null

  - name: FarmingPlan
    parent: Block
    common_fields: true
    entity_kind: resource
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> Block.id; the block this annual farming program covers."
      - name: plan_year
        type: integer
        source: input
        description: "Crop year the plan governs; unique per (block_id, plan_year)."
        constraints: "2000..2100"
      - name: quality_target
        type: enum
        source: input
        description: "Fruit quality tier the plan farms to; selects the deficit-irrigation factor."
        constraints: "one of {PREMIUM, STANDARD, BULK}"
      - name: pruning_budget_per_acre
        type: number
        source: input
        description: "Dollars budgeted per acre for the pruning program."
        constraints: ">= 0"
      - name: canopy_budget_per_acre
        type: number
        source: input
        description: "Dollars budgeted per acre for suckering and leafing (canopy management)."
        constraints: ">= 0"
      - name: irrigation_budget_per_acre
        type: number
        source: input
        description: "Dollars budgeted per acre for the irrigation program."
        constraints: ">= 0"
      - name: pest_budget_per_acre
        type: number
        source: input
        description: "Dollars budgeted per acre for the pest and disease program."
        constraints: ">= 0"
      - name: seasonal_water_cap_inches
        type: number
        source: input
        description: "Applied-water ceiling in acre-inches for the crop year; clips irrigation recommendations."
        constraints: ">= 0"
      - name: plan_status
        type: enum
        source: system
        description: "Approval lifecycle. See §1.2 FarmingPlan."
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, APPROVED}"
      - name: revision_count
        type: integer
        source: system
        description: "Number of completed SUBMITTED -> DRAFT revision rounds; capped by MAX_REVISION_ROUNDS."
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the VineyardManager who last submitted the plan; null while never submitted."
        default: null
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Controller who approved the plan; must differ from submitted_by_user_id."
        default: null
      - name: total_budget
        type: number
        source: computed
        description: "See calculations.farming_plan_total_budget."
        default: 0.00
      - name: committed_cost
        type: number
        source: computed
        description: "See calculations.farming_plan_committed_cost."
        default: 0.00
      - name: remaining_budget
        type: number
        source: computed
        description: "round(total_budget - committed_cost, 2), round_half_up."
        default: 0.00
      - name: budget_posture
        type: enum
        source: computed
        description: "See calculations.farming_plan_budget_posture."
        default: "WITHIN_BUDGET"
        constraints: "one of {WITHIN_BUDGET, AT_RISK, EXHAUSTED}"

  - name: LaborCrew
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: crew_name
        type: string
        source: input
        description: "Crew label used on schedules and payroll."
        constraints: "1..80 chars, non-blank"
      - name: pay_structure
        type: enum
        source: input
        description: "Pay basis that selects the labor-cost branch."
        constraints: "one of {PIECE_RATE, HOURLY}"
      - name: crew_size
        type: integer
        source: input
        description: "Number of workers on the crew; multiplies hourly gross and the minimum-wage make-whole floor."
        constraints: ">= 1"
      - name: base_hourly_rate
        type: number
        source: input
        description: "Straight-time hourly rate per worker."
        constraints: ">= 0"
      - name: piece_rate_per_vine
        type: number
        source: input
        description: "Piece-rate dollars per vine worked; 0 for HOURLY crews."
        constraints: ">= 0"
      - name: vines_per_hour_standard
        type: number
        source: input
        description: "Reference productivity used by operators when planning work orders. Not consumed by any calculation."
        constraints: "> 0"
      - name: task_capabilities
        type: array
        source: input
        description: "Task types this crew may be scheduled for."
        constraints: "non-empty subset of {PRUNING, SUCKERING, LEAFING, HARVEST}, no duplicates"
      - name: pest_certified
        type: boolean
        source: input
        description: "True when every member holds a handler certification, which permits entry inside a re-entry interval."
      - name: crew_status
        type: enum
        source: input
        description: "ACTIVE crews may be scheduled; INACTIVE crews may not."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, INACTIVE}"
      - name: scheduled_work_order_count
        type: integer
        source: computed
        description: "Count of WorkOrder rows with crew_id == this LaborCrew.id AND execution_status IN {SCHEDULED, IN_PROGRESS}."
        default: 0

  - name: WorkOrder
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> Block.id; the block the crew works."
      - name: farming_plan_id
        type: string
        source: input
        description: "FK -> FarmingPlan.id; the plan whose budget this work order draws against."
      - name: crew_id
        type: string
        source: input
        description: "FK -> LaborCrew.id; the crew assigned to the task."
      - name: task_type
        type: enum
        source: input
        description: "Vineyard operation performed."
        constraints: "one of {PRUNING, SUCKERING, LEAFING, HARVEST}"
      - name: scheduled_start
        type: datetime
        source: input
        description: "Half-open interval start, ISO 8601 UTC."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Half-open interval end, ISO 8601 UTC; must be > scheduled_start."
      - name: planned_vines
        type: integer
        source: input
        description: "Vines the crew is expected to work; drives the estimated piece-rate gross."
        constraints: ">= 0"
      - name: planned_hours
        type: number
        source: input
        description: "Hours the crew is expected to work; drives the estimated hourly gross and the make-whole floor."
        constraints: "> 0"
      - name: actual_vines
        type: integer
        source: system
        description: "Vines reported at POST /work-orders/{id}/complete; null until completed."
        default: null
      - name: actual_hours
        type: number
        source: system
        description: "Hours reported at POST /work-orders/{id}/complete; null until completed."
        default: null
      - name: execution_status
        type: enum
        source: system
        description: "Field-execution dimension. See §1.2 WorkOrder (execution)."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: payroll_status
        type: enum
        source: system
        description: "Payroll dimension, independent of execution_status. See §1.2 WorkOrder (payroll)."
        default: "NOT_PAYABLE"
        constraints: "one of {NOT_PAYABLE, PENDING, APPROVED, PAID}"
      - name: estimated_labor_cost
        type: number
        source: computed
        description: "See calculations.work_order_labor_cost variant 'estimated'. Frozen at create; never recomputed."
      - name: actual_labor_cost
        type: number
        source: system
        description: "See calculations.work_order_labor_cost variant 'actual' (set at complete) or calculations.work_order_cancellation_pay (set at cancel from IN_PROGRESS). Null otherwise."
        default: null
      - name: cancel_reason
        type: enum
        source: system
        description: "Reason recorded at cancel; REENTRY_RESTRICTION is written by the spray-apply cascade, the other three arrive as operator input."
        default: null
        constraints: "one of {REENTRY_RESTRICTION, WEATHER, CLIENT_REQUEST, CREW_UNAVAILABLE}"
      - name: started_at
        type: datetime
        source: system
        description: "Logical-clock instant of POST /work-orders/{id}/start; null until started."
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant of POST /work-orders/{id}/complete; null until completed."
        default: null

  - name: IrrigationEvent
    parent: Block
    common_fields: true
    entity_kind: resource
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> Block.id; the irrigated block."
      - name: farming_plan_id
        type: string
        source: input
        description: "FK -> FarmingPlan.id; supplies quality_target and seasonal_water_cap_inches."
      - name: scheduled_start
        type: datetime
        source: input
        description: "Planned set start, ISO 8601 UTC."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Planned set end, ISO 8601 UTC; must be > scheduled_start."
      - name: et0_inches
        type: number
        source: input
        description: "Reference evapotranspiration for the interval, in inches."
        constraints: ">= 0"
      - name: crop_coefficient
        type: number
        source: input
        description: "Phenology-stage crop coefficient (Kc)."
        constraints: "> 0"
      - name: soil_moisture_pct
        type: number
        source: input
        description: "Measured volumetric soil moisture, percent."
        constraints: "0 <= value <= 100"
      - name: field_capacity_pct
        type: number
        source: input
        description: "Soil field capacity, percent."
        constraints: "0 <= value <= 100"
      - name: root_zone_depth_in
        type: number
        source: input
        description: "Managed root-zone depth in inches."
        constraints: "> 0"
      - name: effective_rain_inches
        type: number
        source: input
        description: "Effective rainfall credited against the interval, in inches."
        constraints: ">= 0"
      - name: water_unit_cost_per_acre_inch
        type: number
        source: input
        description: "Dollars per acre-inch of applied water."
        constraints: ">= 0"
      - name: deficit_factor
        type: number
        source: computed
        description: "DEFICIT_FACTOR keyed on FarmingPlan.quality_target, copied onto the event at create."
      - name: et_demand_inches
        type: number
        source: computed
        description: "round(et0_inches * crop_coefficient, 3), round_half_up."
      - name: target_inches
        type: number
        source: computed
        description: "round(et_demand_inches * deficit_factor, 3), round_half_up."
      - name: soil_shortfall_inches
        type: number
        source: computed
        description: "round(max(0, (field_capacity_pct - soil_moisture_pct) / 100 * root_zone_depth_in * AVAILABLE_WATER_FRACTION), 3), round_half_up."
      - name: refill_inches
        type: number
        source: computed
        description: "round(soil_shortfall_inches * REFILL_SHARE, 3), round_half_up."
      - name: gross_requirement_inches
        type: number
        source: computed
        description: "max(0.000, round(target_inches + refill_inches - effective_rain_inches, 3)), round_half_up."
      - name: seasonal_allowance_inches
        type: number
        source: computed
        description: "max(0.000, round(FarmingPlan.seasonal_water_cap_inches - Block.season_applied_inches, 3)) measured BEFORE this event is applied. Frozen at create."
      - name: recommended_inches
        type: number
        source: computed
        description: "round(min(gross_requirement_inches, MAX_SET_INCHES, seasonal_allowance_inches), 3), round_half_up. Frozen at create."
      - name: applied_inches
        type: number
        source: system
        description: "Acre-inches actually applied, reported at POST /irrigation-events/{id}/record-applied; null while SCHEDULED."
        default: null
      - name: water_cost
        type: number
        source: computed
        description: "round(applied_inches * Block.acres * water_unit_cost_per_acre_inch, 2), round_half_up; null while SCHEDULED."
        default: null
      - name: irrigation_status
        type: enum
        source: system
        description: "See §1.2 IrrigationEvent."
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, APPLIED}"
      - name: applied_at
        type: datetime
        source: system
        description: "Logical-clock instant of record-applied; null while SCHEDULED."
        default: null

  - name: PestObservation
    parent: Block
    common_fields: false
    entity_kind: event
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> Block.id; the scouted block."
      - name: pest_code
        type: enum
        source: input
        description: "Pest or disease scouted."
        constraints: "one of {POWDERY_MILDEW, VINE_MEALYBUG, BOTRYTIS, LEAFHOPPER}"
      - name: incidence_pct
        type: number
        source: input
        description: "Percent of scouted units showing the pest; compared against action_threshold_pct."
        constraints: "0 <= value <= 100"
      - name: severity_index
        type: integer
        source: input
        description: "Ordinal severity of the infestation."
        constraints: "0 <= value <= 5"
      - name: scouting_note
        type: string
        source: input
        description: "Free-text scouting remark."
        default: null
        constraints: "0..500 chars"
      - name: observed_at
        type: datetime
        source: system
        description: "Logical-clock instant the observation was filed."
      - name: scout_user_id
        type: string
        source: system
        description: "X-User-ID of the Agronomist who filed the observation."
      - name: action_threshold_pct
        type: number
        source: computed
        description: "ACTION_THRESHOLD_PCT keyed on pest_code, copied onto the observation at create. The registered table is fixed: POWDERY_MILDEW 5.0, VINE_MEALYBUG 2.0, BOTRYTIS 3.0, LEAFHOPPER 10.0."
      - name: exceeds_threshold
        type: boolean
        source: computed
        description: "incidence_pct >= action_threshold_pct. A spray recommendation may only cite an observation whose value is true."

  - name: YieldEstimate
    parent: Block
    common_fields: false
    entity_kind: event
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> Block.id; the estimated block."
      - name: method
        type: enum
        source: input
        description: "Estimation method; selects the calculation variant."
        constraints: "one of {CLUSTER_COUNT, BERRY_SAMPLE}"
      - name: sample_date
        type: string
        source: input
        description: "Date the sample was taken, YYYY-MM-DD. Primary sort key of the governing-estimate selector."
      - name: avg_clusters_per_vine
        type: number
        source: input
        description: "Mean cluster count per vine from the sample."
        constraints: ">= 0"
      - name: avg_cluster_weight_lb
        type: number
        source: input
        description: "Historical mean cluster weight in pounds. Required when method == CLUSTER_COUNT, forbidden otherwise."
        default: null
        constraints: "> 0 when present"
      - name: berries_per_cluster
        type: integer
        source: input
        description: "Mean berries per cluster. Required when method == BERRY_SAMPLE, forbidden otherwise."
        default: null
        constraints: "> 0 when present"
      - name: avg_berry_weight_g
        type: number
        source: input
        description: "Mean berry weight in grams. Required when method == BERRY_SAMPLE, forbidden otherwise."
        default: null
        constraints: "> 0 when present"
      - name: days_to_harvest
        type: integer
        source: input
        description: "Days from sample_date to planned harvest; drives the berry-growth lag factor. Required when method == BERRY_SAMPLE, forbidden otherwise."
        default: null
        constraints: ">= 0 when present"
      - name: vine_count_at_estimate
        type: integer
        source: system
        description: "Block.vine_count copied at create so the estimate stays reproducible."
      - name: estimated_tons
        type: number
        source: computed
        description: "See calculations.block_yield_estimate_tons."
      - name: estimated_tons_per_acre
        type: number
        source: computed
        description: "round(estimated_tons / Block.acres, 2), round_half_up."

  - name: SprayRecord
    parent: Block
    common_fields: true
    entity_kind: resource
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> Block.id; the treated block."
      - name: farming_plan_id
        type: string
        source: input
        description: "FK -> FarmingPlan.id; the plan whose pest budget absorbs material_cost."
      - name: pest_observation_id
        type: string
        source: input
        description: "FK -> PestObservation.id; the threshold-exceeding observation that justifies the application."
      - name: product_name
        type: string
        source: input
        description: "Registered product trade name."
        constraints: "1..120 chars, non-blank"
      - name: active_ingredient
        type: string
        source: input
        description: "Active ingredient recorded for the compliance log."
        constraints: "1..120 chars, non-blank"
      - name: rei_hours
        type: integer
        source: input
        description: "Restricted-entry interval in hours from the label."
        constraints: ">= 0"
      - name: phi_days
        type: integer
        source: input
        description: "Pre-harvest interval in days from the label."
        constraints: ">= 0"
      - name: rate_per_acre
        type: number
        source: input
        description: "Application rate per acre in product units."
        constraints: "> 0"
      - name: material_cost
        type: number
        source: input
        description: "Material dollars for the application; joins FarmingPlan.committed_cost once APPLIED."
        constraints: ">= 0"
      - name: spray_status
        type: enum
        source: system
        description: "See §1.2 SprayRecord."
        default: "RECOMMENDED"
        constraints: "one of {RECOMMENDED, APPLIED, VERIFIED}"
      - name: recommended_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Agronomist who created the recommendation."
      - name: applied_by_user_id
        type: string
        source: system
        description: "X-User-ID of the Applicator; must differ from recommended_by_user_id. Null while RECOMMENDED."
        default: null
      - name: verified_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ComplianceOfficer; must differ from both recommended_by_user_id and applied_by_user_id. Null until VERIFIED."
        default: null
      - name: applicator_license_no
        type: string
        source: system
        description: "Applicator license captured at apply; null while RECOMMENDED."
        default: null
      - name: wind_speed_mph
        type: number
        source: system
        description: "Wind speed logged at apply; null while RECOMMENDED."
        default: null
      - name: applied_at
        type: datetime
        source: system
        description: "Logical-clock instant of apply; null while RECOMMENDED."
        default: null
      - name: rei_clear_at
        type: datetime
        source: computed
        description: "applied_at + rei_hours hours; null while RECOMMENDED."
        default: null
      - name: phi_clear_at
        type: datetime
        source: computed
        description: "applied_at + (phi_days * 24) hours; null while RECOMMENDED."
        default: null

  - name: WineryDeliveryWindow
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: winery_name
        type: string
        source: input
        description: "Receiving winery for this delivery slot."
        constraints: "1..120 chars, non-blank"
      - name: window_start
        type: datetime
        source: input
        description: "Closed-interval window open instant, ISO 8601 UTC."
      - name: window_end
        type: datetime
        source: input
        description: "Closed-interval window close instant, ISO 8601 UTC; must be > window_start."
      - name: capacity_tons
        type: number
        source: input
        description: "Tonnage the winery will accept in this window."
        constraints: "> 0"
      - name: committed_tons
        type: number
        source: computed
        description: "See calculations.delivery_window_committed_tons."
        default: 0.00
      - name: remaining_tons
        type: number
        source: computed
        description: "round(capacity_tons - committed_tons, 2), round_half_up."
      - name: window_posture
        type: enum
        source: computed
        description: "utilization = committed_tons / capacity_tons. FULL when utilization >= 1.00; NEARLY_FULL when 0.85 <= utilization < 1.00; else OPEN."
        default: "OPEN"
        constraints: "one of {OPEN, NEARLY_FULL, FULL}"

  - name: HarvestLoad
    parent: null
    common_fields: true
    entity_kind: resource
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> Block.id; the picked block."
      - name: crew_id
        type: string
        source: input
        description: "FK -> LaborCrew.id; the picking crew responsible for the load."
      - name: delivery_window_id
        type: string
        source: input
        description: "FK -> WineryDeliveryWindow.id; the winery slot the load is booked into."
      - name: estimated_tons
        type: number
        source: input
        description: "Tonnage booked against the window and the block estimate at create."
        constraints: "> 0"
      - name: delivery_eta
        type: datetime
        source: input
        description: "Planned arrival instant; must satisfy window_start <= delivery_eta <= window_end (closed interval)."
      - name: load_status
        type: enum
        source: system
        description: "See §1.2 HarvestLoad."
        default: "PLANNED"
        constraints: "one of {PLANNED, IN_TRANSIT, RECEIVED, REJECTED}"
      - name: gross_tons_at_dispatch
        type: number
        source: system
        description: "Field scale reading logged at dispatch; null until dispatched."
        default: null
      - name: dispatched_at
        type: datetime
        source: system
        description: "Logical-clock instant of dispatch; null until dispatched."
        default: null
      - name: gross_tons
        type: number
        source: system
        description: "Winery scale gross tonnage recorded at receive; null unless RECEIVED."
        default: null
      - name: tare_tons
        type: number
        source: system
        description: "Bin and truck tare recorded at receive; null unless RECEIVED."
        default: null
      - name: mog_deduct_pct
        type: number
        source: system
        description: "Material-other-than-grapes deduction fraction recorded at receive; null unless RECEIVED."
        default: null
      - name: brix_at_receipt
        type: number
        source: system
        description: "Degrees brix measured at receive; null unless RECEIVED."
        default: null
      - name: net_tons
        type: number
        source: computed
        description: "See calculations.harvest_load_net_tons. 0.00 when load_status == REJECTED; null while PLANNED or IN_TRANSIT."
        default: null
      - name: quality_incentive_amount
        type: number
        source: computed
        description: "round(net_tons * CustomFarmingContract.quality_incentive_per_ton, 2) when load_status == RECEIVED AND brix_at_receipt >= contract.quality_brix_threshold; 0.00 when RECEIVED below threshold or REJECTED; null while PLANNED or IN_TRANSIT."
        default: null
      - name: received_at
        type: datetime
        source: system
        description: "Logical-clock instant of receive; null unless RECEIVED."
        default: null
      - name: rejected_at
        type: datetime
        source: system
        description: "Logical-clock instant of reject; null unless REJECTED."
        default: null
      - name: rejection_reason
        type: enum
        source: system
        description: "Winery rejection cause recorded at reject; null unless REJECTED."
        default: null
        constraints: "one of {MOG_EXCESS, LOW_BRIX, ROT_DAMAGE, LATE_ARRIVAL}"

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: CustomFarmingContract
    state_field: contract_status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{id}/activate"
        actor: ClientOwner
        preconditions:
          - "contract_status == DRAFT"
          - "enrolled_block_count >= 1 (a contract with no enrolled block cannot be activated)"
          - "X-User-ID equals CustomFarmingContract.vineyard_id (the acting ClientOwner owns the ranch)"
        side_effects:
          - "sets client_signature_name from the request body"
          - "increments CustomFarmingContract.version by 1"
        note: "Enrollment (POST /contracts/{id}/enroll-block) is only permitted while DRAFT, so the block set is frozen at activation."
      - from: ACTIVE
        to: CLOSED
        trigger: "system event: a POST /contracts/{id}/settle-period run with settlement_mode == FINAL whose period_end_date >= CustomFarmingContract.period_end"
        actor: system
        preconditions:
          - "contract_status == ACTIVE"
          - "settlement_mode == FINAL"
          - "period_end_date >= CustomFarmingContract.period_end"
        side_effects:
          - "increments settled_period_count by 1"
          - "sets last_settlement_total to the run's total_billable"
          - "increments CustomFarmingContract.version by 1"
        note: "A PROVISIONAL run, or a FINAL run whose period_end_date is earlier than contract.period_end, leaves contract_status at ACTIVE and still bumps settled_period_count and last_settlement_total. Once CLOSED, POST /harvest-loads against any enrolled block is refused with ERR_CONTRACT_NOT_ACTIVE."

  - entity: FarmingPlan
    state_field: plan_status
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /farming-plans/{id}/submit"
        actor: VineyardManager
        preconditions:
          - "plan_status == DRAFT"
          - "Block.farming_status != REMOVED"
        side_effects:
          - "sets submitted_by_user_id to the request X-User-ID"
          - "increments FarmingPlan.version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /farming-plans/{id}/return-for-revision"
        actor: Controller
        preconditions:
          - "plan_status == SUBMITTED"
          - "revision_count < MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "increments revision_count by 1"
          - "clears submitted_by_user_id to null"
          - "increments FarmingPlan.version by 1"
        note: "Cyclic edge. The third return attempt (revision_count already 2) is refused with ERR_REVISION_LIMIT_REACHED and the plan stays SUBMITTED, so the loop terminates."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /farming-plans/{id}/approve"
        actor: Controller
        preconditions:
          - "plan_status == SUBMITTED"
          - "request X-User-ID != submitted_by_user_id (segregation of duties)"
          - "Block.farming_status != REMOVED"
        side_effects:
          - "sets approved_by_user_id to the request X-User-ID"
          - "drives Block.farming_status ESTABLISHING -> BEARING when plan_year >= Block.planting_year + 3 (bubble-up guarded cascade)"
          - "increments FarmingPlan.version by 1"
        note: "APPROVED is terminal: submit, return-for-revision and approve are all refused afterwards. Work orders, spray records and irrigation events may only cite an APPROVED plan."

  - entity: Block
    state_field: farming_status
    initial_state: ESTABLISHING
    terminal_states: [REMOVED]
    transitions:
      - from: ESTABLISHING
        to: BEARING
        trigger: "system event: POST /farming-plans/{id}/approve on a plan for this block whose plan_year >= planting_year + 3"
        actor: system
        preconditions:
          - "farming_status == ESTABLISHING"
          - "FarmingPlan.plan_year >= Block.planting_year + 3"
        side_effects:
          - "increments Block.version by 1"
        note: "Conditional cascade — approving a plan whose plan_year is earlier than planting_year + 3 leaves the block ESTABLISHING and bumps no Block version."
      - from: ESTABLISHING
        to: REMOVED
        trigger: "system event: POST /blocks carrying replaces_block_id == this Block.id"
        actor: system
        preconditions:
          - "farming_status != REMOVED"
          - "the successor block's vineyard_id equals this Block.vineyard_id"
        side_effects:
          - "recomputes Vineyard.block_count and Vineyard.managed_acres (this block leaves both aggregates)"
          - "increments Block.version by 1"
      - from: BEARING
        to: REMOVED
        trigger: "system event: POST /blocks carrying replaces_block_id == this Block.id"
        actor: system
        preconditions:
          - "farming_status != REMOVED"
          - "the successor block's vineyard_id equals this Block.vineyard_id"
        side_effects:
          - "recomputes Vineyard.block_count and Vineyard.managed_acres"
          - "increments Block.version by 1"
        note: "REMOVED is terminal: farming-plan submit/approve, work-order create, spray apply and harvest-load create all refuse a REMOVED block with ERR_BLOCK_REMOVED."

  - entity: WorkOrder
    state_field: execution_status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: CrewSupervisor
        preconditions:
          - "execution_status == SCHEDULED"
          - "LaborCrew.crew_status == ACTIVE"
          - "Block.rei_clear_at is null OR current_utc >= Block.rei_clear_at OR LaborCrew.pest_certified == true"
        side_effects:
          - "sets started_at to the logical clock instant"
          - "increments WorkOrder.version by 1"
        note: "payroll_status is untouched and stays NOT_PAYABLE — the two dimensions advance independently."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: CrewSupervisor
        preconditions:
          - "execution_status == IN_PROGRESS"
        side_effects:
          - "sets actual_vines, actual_hours and completed_at from the request and the logical clock"
          - "sets actual_labor_cost from calculations.work_order_labor_cost variant 'actual'"
          - "advances payroll_status NOT_PAYABLE -> PENDING"
          - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture (the estimate is replaced by the actual)"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: VineyardManager
        preconditions:
          - "execution_status == SCHEDULED"
        side_effects:
          - "sets cancel_reason from the request body"
          - "leaves actual_labor_cost null and payroll_status at NOT_PAYABLE (no pay is owed for work never started)"
          - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture (the estimate is released)"
          - "recomputes LaborCrew.scheduled_work_order_count"
          - "frees the crew's [scheduled_start, scheduled_end) interval for re-booking"
          - "increments WorkOrder.version by 1"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: VineyardManager
        preconditions:
          - "execution_status == IN_PROGRESS"
        side_effects:
          - "sets cancel_reason from the request body"
          - "sets actual_labor_cost from calculations.work_order_cancellation_pay (MIN_CALL_IN_HOURS reporting-time pay)"
          - "advances payroll_status NOT_PAYABLE -> PENDING (reporting-time pay is owed)"
          - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture"
          - "recomputes LaborCrew.scheduled_work_order_count"
          - "increments WorkOrder.version by 1"
        note: "Compensation pattern with divergent side-effect sets: cancelling from SCHEDULED reverses the commitment entirely, cancelling from IN_PROGRESS substitutes reporting-time pay."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: POST /spray-records/{id}/apply on this WorkOrder's block"
        actor: system
        preconditions:
          - "execution_status == SCHEDULED"
          - "scheduled_start < the block's newly recomputed rei_clear_at"
          - "LaborCrew.pest_certified == false"
        side_effects:
          - "sets cancel_reason to REENTRY_RESTRICTION"
          - "leaves payroll_status at NOT_PAYABLE and actual_labor_cost null"
          - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture"
          - "recomputes LaborCrew.scheduled_work_order_count"
          - "increments WorkOrder.version by 1"
        note: "Conditional cascade — orders whose scheduled_start is at or after the new rei_clear_at, and orders held by a pest_certified crew, stay SCHEDULED. Cancellation order is scheduled_start ASC, then created_at ASC."

  - entity: WorkOrder
    state_field: payroll_status
    initial_state: NOT_PAYABLE
    terminal_states: [PAID]
    transitions:
      - from: NOT_PAYABLE
        to: PENDING
        trigger: "system event: POST /work-orders/{id}/complete, or POST /work-orders/{id}/cancel from execution_status == IN_PROGRESS"
        actor: system
        preconditions:
          - "payroll_status == NOT_PAYABLE"
          - "actual_labor_cost has just been set"
        side_effects:
          - "makes the work order eligible for POST /work-orders/{id}/payroll"
      - from: PENDING
        to: APPROVED
        trigger: "POST /work-orders/{id}/payroll with payroll_action == APPROVE"
        actor: Controller
        preconditions:
          - "payroll_status == PENDING"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /work-orders/{id}/payroll with payroll_action == PAY"
        actor: Controller
        preconditions:
          - "payroll_status == APPROVED"
        side_effects:
          - "increments WorkOrder.version by 1"
        note: "Parallel dimension: this axis is driven only by /payroll, never by /start, /complete or /cancel, and PAY on a PENDING order (skipping APPROVE) is refused with ERR_PAYROLL_STATE_INVALID. A CANCELLED-from-SCHEDULED order is permanently stuck at NOT_PAYABLE, so the combined state (CANCELLED, NOT_PAYABLE) is terminal on both axes."

  - entity: SprayRecord
    state_field: spray_status
    initial_state: RECOMMENDED
    terminal_states: [VERIFIED]
    transitions:
      - from: RECOMMENDED
        to: APPLIED
        trigger: "POST /spray-records/{id}/apply"
        actor: Applicator
        preconditions:
          - "spray_status == RECOMMENDED"
          - "request X-User-ID != recommended_by_user_id (segregation of duties)"
          - "Block.farming_status != REMOVED"
          - "expected_block_version equals the current Block.version (see §1.2.1 spray-apply-stale-block)"
        side_effects:
          - "sets applied_by_user_id, applicator_license_no, wind_speed_mph and applied_at"
          - "sets rei_clear_at = applied_at + rei_hours hours and phi_clear_at = applied_at + phi_days * 24 hours"
          - "recomputes Block.rei_clear_at, Block.phi_clear_at and Block.compliance_posture"
          - "increments Block.version by 1"
          - "auto-CANCELS the block's SCHEDULED work orders that fall inside the new re-entry interval and are held by a crew with pest_certified == false, with cancel_reason REENTRY_RESTRICTION, in scheduled_start ASC then created_at ASC order"
          - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture (material_cost joins the ledger, cancelled work-order estimates leave it)"
          - "increments SprayRecord.version by 1"
        note: "Depth-5 cascade: SprayRecord -> Block compliance fields -> WorkOrder execution_status -> FarmingPlan.committed_cost -> FarmingPlan.budget_posture."
      - from: APPLIED
        to: VERIFIED
        trigger: "POST /spray-records/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "spray_status == APPLIED"
          - "request X-User-ID != recommended_by_user_id AND request X-User-ID != applied_by_user_id (segregation of duties)"
        side_effects:
          - "sets verified_by_user_id"
          - "increments SprayRecord.version by 1"
        note: "Verification is an audit stamp only — Block.rei_clear_at / phi_clear_at were already established at apply, and both APPLIED and VERIFIED records feed those maxima."

  - entity: IrrigationEvent
    state_field: irrigation_status
    initial_state: SCHEDULED
    terminal_states: [APPLIED]
    transitions:
      - from: SCHEDULED
        to: APPLIED
        trigger: "POST /irrigation-events/{id}/record-applied"
        actor: CrewSupervisor
        preconditions:
          - "irrigation_status == SCHEDULED"
          - "Block.farming_status != REMOVED"
        side_effects:
          - "sets applied_inches and applied_at"
          - "sets water_cost = round(applied_inches * Block.acres * water_unit_cost_per_acre_inch, 2)"
          - "recomputes Block.season_applied_inches"
          - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture — water cost is a recorded actual and is NOT budget-gated, so this transition may drive budget_posture to EXHAUSTED"
          - "increments IrrigationEvent.version by 1"
        note: "Every later IrrigationEvent create sees the raised Block.season_applied_inches, so its seasonal_allowance_inches (and therefore recommended_inches) shrinks."

  - entity: HarvestLoad
    state_field: load_status
    initial_state: PLANNED
    terminal_states: [RECEIVED, REJECTED]
    transitions:
      - from: PLANNED
        to: IN_TRANSIT
        trigger: "POST /harvest-loads/{id}/dispatch"
        actor: CrewSupervisor
        preconditions:
          - "load_status == PLANNED"
          - "LaborCrew.crew_status == ACTIVE"
          - "Block.phi_clear_at is null OR current_utc >= Block.phi_clear_at"
        side_effects:
          - "sets gross_tons_at_dispatch and dispatched_at"
          - "increments HarvestLoad.version by 1"
        note: "WineryDeliveryWindow.committed_tons is unchanged — it counts PLANNED and IN_TRANSIT loads alike."
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /harvest-loads/{id}/receive"
        actor: VineyardManager
        preconditions:
          - "load_status == IN_TRANSIT"
        side_effects:
          - "sets gross_tons, tare_tons, mog_deduct_pct, brix_at_receipt and received_at"
          - "sets net_tons from calculations.harvest_load_net_tons"
          - "sets quality_incentive_amount (0.00 when brix_at_receipt < CustomFarmingContract.quality_brix_threshold)"
          - "recomputes Block.committed_harvest_tons, Block.received_tons, Block.remaining_estimated_tons and Block.harvest_posture"
          - "recomputes CustomFarmingContract.accrued_quality_incentive and projected_total_billable"
          - "increments CustomFarmingContract.version by 1"
          - "recomputes WineryDeliveryWindow.committed_tons, remaining_tons and window_posture"
          - "increments WineryDeliveryWindow.version by 1"
          - "increments HarvestLoad.version by 1"
        note: "Depth-4 cascade: HarvestLoad -> Block harvest ledger -> CustomFarmingContract.accrued_quality_incentive -> CustomFarmingContract.projected_total_billable."
      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /harvest-loads/{id}/reject"
        actor: VineyardManager
        preconditions:
          - "load_status == IN_TRANSIT"
        side_effects:
          - "sets rejection_reason and rejected_at"
          - "sets net_tons = 0.00 and quality_incentive_amount = 0.00"
          - "recomputes Block.committed_harvest_tons and Block.remaining_estimated_tons (the booked tonnage returns to the block estimate); Block.received_tons is unchanged"
          - "leaves CustomFarmingContract.accrued_quality_incentive unchanged"
          - "recomputes WineryDeliveryWindow.committed_tons, remaining_tons and window_posture (the booked tonnage returns to the window)"
          - "increments WineryDeliveryWindow.version by 1"
          - "increments HarvestLoad.version by 1"
        note: "Branching with divergent side-effect sets: RECEIVED credits the block and the contract, REJECTED compensates the booking and credits neither. Both branches release the window capacity."

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:

  - rule_id: spray-apply-stale-block
    parent_entity: Block
    write_endpoint: "POST /spray-records/{id}/apply"
    occ_field: "expected_block_version"
    description: |
      Applying a spray to a Block whose version has advanced since the
      Applicator last read it is rejected. Applying a spray is a legitimate
      repeatable operation — a second, different RECOMMENDED record on the
      same block would itself succeed under the natural product semantics —
      but each application rewrites Block.rei_clear_at / phi_clear_at and
      auto-cancels work orders derived from those fields, so an Applicator
      holding a stale view of the block would be mixing a new application
      into a re-entry picture that no longer exists. The Applicator must
      re-read GET /blocks/{id} and resubmit with the observed version.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412

  - rule_id: harvest-load-create-stale-window
    parent_entity: WineryDeliveryWindow
    write_endpoint: "POST /harvest-loads"
    occ_field: "expected_delivery_window_version"
    description: |
      Booking a HarvestLoad into a WineryDeliveryWindow whose version has
      advanced since the client last read it is rejected. Booking additional
      tonnage into a window is a legitimate repeatable operation that
      succeeds on its own merits whenever remaining_tons allows it, so no
      state precondition covers this case; the hazard is that the client's
      capacity arithmetic was computed against a committed_tons figure that
      an intervening booking, receipt or rejection has already moved. The
      client must re-read GET /delivery-windows/{id} and resubmit with the
      observed version.
    error_id: ERR_STALE_DELIVERY_WINDOW_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: block_vine_geometry
    trigger: "POST /blocks — computed once at create, then immutable"
    algorithm: geometric_derivation
    formula: |
      vines_per_acre = floor(SQ_FT_PER_ACRE / (vine_spacing_ft * row_spacing_ft))
      vine_count     = floor(vines_per_acre * acres)
    input_set: "Only the created Block's own vine_spacing_ft, row_spacing_ft and acres. No other entity participates."
    constants:
      SQ_FT_PER_ACRE: 43560
    precision: "both outputs are integers produced by floor(), never round()"
    note: |
      Worked reference: 5.0 x 8.0 ft on 12.5 acres -> floor(43560/40) = 1089
      vines_per_acre and floor(1089 * 12.5) = floor(13612.5) = 13612 vine_count.
      6.0 x 10.0 ft on 4.0 acres -> 726 and 2904. 7.0 x 9.0 ft on 3.6 acres ->
      floor(43560/63) = floor(691.428...) = 691 and floor(2487.6) = 2487. Both
      steps truncate, so a naive round() on either step is observably wrong.

  - name: work_order_labor_cost
    trigger: "POST /work-orders (variant 'estimated', frozen on the row) and POST /work-orders/{id}/complete (variant 'actual')"
    algorithm: threshold
    formula: |
      # vines and hours are supplied by the active variant
      if crew.pay_structure == "PIECE_RATE":
          structure_gross = vines * crew.piece_rate_per_vine
      else:  # HOURLY
          regular_hours  = min(hours, STD_SHIFT_HOURS)
          overtime_hours = max(0, hours - STD_SHIFT_HOURS)
          structure_gross = crew.crew_size * crew.base_hourly_rate
                            * (regular_hours + overtime_hours * OVERTIME_MULTIPLIER)
      minimum_wage_floor = crew.crew_size * MIN_HOURLY_RATE * hours
      gross_pay  = round(max(structure_gross, minimum_wage_floor), 2)
      burden     = round(gross_pay * BURDEN_RATE, 2)
      labor_cost = round(gross_pay + burden, 2)
    input_set: "The WorkOrder's own vines/hours pair for the active variant, plus the referenced LaborCrew's pay_structure, crew_size, base_hourly_rate and piece_rate_per_vine. LaborCrew.vines_per_hour_standard is planning metadata and is NOT an input."
    constants:
      MIN_HOURLY_RATE: 16.50
      STD_SHIFT_HOURS: 8
      OVERTIME_MULTIPLIER: 1.5
      BURDEN_RATE: 0.2850
    precision: "gross_pay, burden and labor_cost each rounded to 2 decimals, round_half_up; burden is computed from the ALREADY-ROUNDED gross_pay"
    variants:
      - name: estimated
        when: "at POST /work-orders, written to estimated_labor_cost and frozen — never recomputed afterwards"
        difference: "consumes planned_vines and planned_hours"
      - name: actual
        when: "at POST /work-orders/{id}/complete, written to actual_labor_cost"
        difference: "consumes actual_vines and actual_hours; identical formula, so the same crew and the same formula yield a different figure whenever the reported work differs from the plan"
    note: |
      Worked references. PIECE_RATE crew (crew_size 12, base_hourly_rate 19.50,
      piece_rate_per_vine 0.65): 13000 vines / 10.0 h -> structure 8450.00,
      floor 1980.00, gross 8450.00, burden 2408.25, labor_cost 10858.25.
      5200 vines / 12.0 h -> 4343.30. 6000 vines / 10.0 h -> 5011.50.
      3000 vines / 8.0 h -> 2505.75. Floor-dominant case 1000 vines / 10.0 h ->
      structure 650.00 but floor 1980.00 wins -> labor_cost 2544.30.
      HOURLY crew (crew_size 8, base_hourly_rate 22.00): 10.0 h -> 8 regular +
      2 overtime -> gross 1936.00, labor_cost 2487.76; 8.0 h -> 1809.28.
      HOURLY crew (crew_size 1, base_hourly_rate 100.00): 8.0 h -> 1028.00;
      0.5 h -> 64.25.

  - name: work_order_cancellation_pay
    trigger: "POST /work-orders/{id}/cancel when execution_status == IN_PROGRESS"
    algorithm: threshold
    formula: |
      gross_pay  = round(crew.crew_size * MIN_HOURLY_RATE * MIN_CALL_IN_HOURS, 2)
      burden     = round(gross_pay * BURDEN_RATE, 2)
      labor_cost = round(gross_pay + burden, 2)
    input_set: "Only the referenced LaborCrew.crew_size. Neither planned nor actual vines/hours participate — reporting-time pay is a flat statutory guarantee."
    constants:
      MIN_HOURLY_RATE: 16.50
      MIN_CALL_IN_HOURS: 4
      BURDEN_RATE: 0.2850
    precision: "2 decimal places, round_half_up"
    note: "Worked reference: crew_size 12 -> gross 792.00, burden 225.72, labor_cost 1017.72. Cancelling the same order from SCHEDULED instead leaves actual_labor_cost null (0.00 contribution to the plan ledger)."

  - name: farming_plan_total_budget
    trigger: "POST /farming-plans — computed at create from the four per-acre budget lines"
    algorithm: aggregation
    formula: |
      per_acre_total = pruning_budget_per_acre + canopy_budget_per_acre
                       + irrigation_budget_per_acre + pest_budget_per_acre
      total_budget   = round(per_acre_total * Block.acres, 2)
    input_set: "The FarmingPlan's own four per-acre budget fields and the referenced Block.acres (NOT contracted_acres)."
    constants: {}
    precision: "2 decimal places, round_half_up"
    note: "Worked references: (420.00 + 310.00 + 180.00 + 265.00) * 12.5 = 14687.50; (100.00 + 60.00 + 37.00 + 60.00) * 4.0 = 1028.00."

  - name: farming_plan_committed_cost
    trigger: "recomputed on POST /work-orders, /work-orders/{id}/complete, /work-orders/{id}/cancel, /spray-records/{id}/apply and /irrigation-events/{id}/record-applied"
    algorithm: aggregation
    formula: |
      labor = 0
      for wo in WorkOrder where wo.farming_plan_id == plan.id:
          if wo.execution_status in ("SCHEDULED", "IN_PROGRESS"):
              labor += wo.estimated_labor_cost
          elif wo.execution_status == "COMPLETED":
              labor += wo.actual_labor_cost
          elif wo.execution_status == "CANCELLED":
              labor += (wo.actual_labor_cost if wo.actual_labor_cost is not None else 0)
      materials = sum(sr.material_cost for sr in SprayRecord
                      where sr.farming_plan_id == plan.id
                      and sr.spray_status in ("APPLIED", "VERIFIED"))
      water     = sum(ie.water_cost for ie in IrrigationEvent
                      where ie.farming_plan_id == plan.id
                      and ie.irrigation_status == "APPLIED")
      committed_cost   = round(labor + materials + water, 2)
      remaining_budget = round(total_budget - committed_cost, 2)
    input_set: "State-filtered: open work orders contribute their frozen estimate, completed ones their actual, cancelled ones only the reporting-time pay actually owed; RECOMMENDED sprays and SCHEDULED irrigation events contribute nothing."
    constants: {}
    precision: "2 decimal places, round_half_up"
    note: |
      Worked reference (plan total_budget 14687.50): two SCHEDULED work orders
      with estimates 10858.25 and 2505.75 -> committed_cost 13364.00,
      remaining_budget 1323.50. After the first is auto-cancelled by a spray
      apply carrying material_cost 812.50 -> committed_cost 3318.25,
      remaining_budget 11369.25.

  - name: farming_plan_budget_posture
    trigger: "recomputed together with farming_plan_committed_cost"
    algorithm: threshold
    formula: |
      if total_budget == 0:
          budget_posture = "EXHAUSTED" if committed_cost > 0 else "WITHIN_BUDGET"
      else:
          utilization = committed_cost / total_budget          # unrounded ratio
          if   utilization <= AT_RISK_FLOOR:   budget_posture = "WITHIN_BUDGET"
          elif utilization <= EXHAUSTED_FLOOR: budget_posture = "AT_RISK"
          else:                                budget_posture = "EXHAUSTED"
    input_set: "The plan's own total_budget and committed_cost."
    constants:
      AT_RISK_FLOOR: 0.80
      EXHAUSTED_FLOOR: 1.00
    precision: "the ratio is NOT rounded before comparison; both comparisons are <= (inclusive upper edge)"
    note: |
      Worked references: 13364.00 / 14687.50 = 0.90980... -> AT_RISK.
      3318.25 / 14687.50 = 0.22592... -> WITHIN_BUDGET. 1028.00 / 1028.00 =
      1.00 exactly -> AT_RISK (not EXHAUSTED, because EXHAUSTED_FLOOR is
      inclusive). Only an applied irrigation event can push a plan past 1.00,
      because POST /work-orders is budget-gated and record-applied is not.

  - name: irrigation_recommended_inches
    trigger: "POST /irrigation-events — every derived field is computed at create and frozen"
    algorithm: constraint_propagation
    formula: |
      deficit_factor           = DEFICIT_FACTOR[FarmingPlan.quality_target]
      et_demand_inches         = round(et0_inches * crop_coefficient, 3)
      target_inches            = round(et_demand_inches * deficit_factor, 3)
      soil_shortfall_inches    = round(max(0, (field_capacity_pct - soil_moisture_pct) / 100
                                              * root_zone_depth_in * AVAILABLE_WATER_FRACTION), 3)
      refill_inches            = round(soil_shortfall_inches * REFILL_SHARE, 3)
      gross_requirement_inches = max(0.000, round(target_inches + refill_inches
                                                  - effective_rain_inches, 3))
      seasonal_allowance_inches = max(0.000, round(FarmingPlan.seasonal_water_cap_inches
                                                   - Block.season_applied_inches, 3))
      recommended_inches       = round(min(gross_requirement_inches, MAX_SET_INCHES,
                                           seasonal_allowance_inches), 3)
    input_set: "The IrrigationEvent's own sensor and weather inputs, FarmingPlan.quality_target and seasonal_water_cap_inches, and Block.season_applied_inches as it stands BEFORE this event exists (only APPLIED events feed it)."
    constants:
      AVAILABLE_WATER_FRACTION: 0.16
      REFILL_SHARE: 0.50
      MAX_SET_INCHES: 1.500
      DEFICIT_FACTOR: { PREMIUM: 0.55, STANDARD: 0.75, BULK: 1.00 }
    precision: "3 decimal places, round_half_up, rounded at every intermediate step as written"
    note: |
      Worked references, all with et0_inches 1.40, crop_coefficient 0.72,
      soil_moisture_pct 42, field_capacity_pct 60, root_zone_depth_in 36,
      effective_rain_inches 0.10, seasonal_water_cap_inches 9.000,
      Block.season_applied_inches 0.000 -> et_demand 1.008,
      soil_shortfall 1.037, refill 0.519. PREMIUM: target 0.554, gross 0.973,
      recommended 0.973. STANDARD on the identical inputs: target 0.756,
      gross 1.175, recommended 1.175 — the quality target alone moves the
      answer. MAX_SET clamp (BULK, et0 2.60, kc 0.95, soil 30, fc 60, rz 48,
      rain 0.00): gross 3.622 -> recommended 1.500. Seasonal clamp (allowance
      0.500 after prior applications): recommended 0.500. Fully-charged soil
      with rain (et0 0.50, kc 0.60, PREMIUM, soil 60 == fc 60, rain 1.00):
      target 0.165, refill 0.000, gross 0.000 -> recommended 0.000.

  - name: block_yield_estimate_tons
    trigger: "POST /blocks/{id}/yield-estimates"
    algorithm: forward_looking
    formula: |
      total_clusters = vine_count_at_estimate * avg_clusters_per_vine
      if method == "CLUSTER_COUNT":
          estimated_tons = round(total_clusters * avg_cluster_weight_lb / LB_PER_TON, 2)
      else:  # BERRY_SAMPLE
          cluster_weight_lb = (berries_per_cluster * avg_berry_weight_g) / G_PER_LB
          growth_factor     = 1 + BERRY_GROWTH_RATE_PER_DAY * days_to_harvest
          estimated_tons    = round(total_clusters * cluster_weight_lb * growth_factor
                                    / LB_PER_TON, 2)
      estimated_tons_per_acre = round(estimated_tons / Block.acres, 2)
    input_set: "The YieldEstimate's own sample fields plus vine_count_at_estimate, which is Block.vine_count frozen at create so a later replant cannot retro-change a filed estimate."
    constants:
      LB_PER_TON: 2000
      G_PER_LB: 453.592
      BERRY_GROWTH_RATE_PER_DAY: 0.004
    precision: |
      estimated_tons: 2 decimals, round_half_up, applied ONCE to the final tonnage.
      No intermediate rounding: in the BERRY_SAMPLE branch, rounding
      cluster_weight_lb to 4 decimals first yields 68.96 instead of the correct
      68.97 for the reference inputs below.
    variants:
      - name: cluster_count
        when: "method == CLUSTER_COUNT — the mid-season estimate using historical cluster weights"
        difference: "multiplies by the supplied avg_cluster_weight_lb directly; berries_per_cluster, avg_berry_weight_g and days_to_harvest MUST be absent"
      - name: berry_sample
        when: "method == BERRY_SAMPLE — the late-season estimate that derives cluster weight from berry counts and projects berry growth to harvest"
        difference: "derives cluster weight from berries_per_cluster * avg_berry_weight_g / G_PER_LB and inflates it by the days_to_harvest growth factor; avg_cluster_weight_lb MUST be absent"
    note: |
      Worked references on the same Block (vine_count_at_estimate 13612,
      acres 12.5, avg_clusters_per_vine 32). CLUSTER_COUNT with
      avg_cluster_weight_lb 0.42 -> 435584 clusters -> estimated_tons 91.47,
      estimated_tons_per_acre 7.32. BERRY_SAMPLE with berries_per_cluster 95,
      avg_berry_weight_g 1.35, days_to_harvest 30 (growth_factor 1.120) ->
      estimated_tons 68.97, estimated_tons_per_acre 5.52. Identical vines and
      identical cluster counts, 22.50 tons apart.

  - name: governing_yield_estimate_selector
    trigger: "recomputed whenever a YieldEstimate is filed for the block, and read by Block.governing_estimate_tons, remaining_estimated_tons and harvest_posture"
    algorithm: chronological
    formula: |
      candidates = YieldEstimate where block_id == block.id
      if candidates is empty:
          governing_estimate_tons = 0.00
          harvest_posture         = "NOT_ESTIMATED"
      else:
          governing = max(candidates, key = (sample_date, created_at))
          # primary key: latest sample_date; tie-break: latest created_at
          governing_estimate_tons = governing.estimated_tons
    input_set: "Every YieldEstimate on the block regardless of method — the newest sample governs, not the largest or the most conservative."
    constants: {}
    precision: "no arithmetic; selection only"
    note: "The tie-break is created_at, never id. Two estimates filed with the same sample_date resolve to the one filed later, so filing a CLUSTER_COUNT estimate after a BERRY_SAMPLE estimate for the same sample_date moves governing_estimate_tons back up."

  - name: harvest_load_net_tons
    trigger: "POST /harvest-loads/{id}/receive (and set to 0.00 by POST /harvest-loads/{id}/reject)"
    algorithm: arithmetic_deduction
    formula: |
      net_tons = round((gross_tons - tare_tons) * (1 - mog_deduct_pct), 2)
      if brix_at_receipt >= CustomFarmingContract.quality_brix_threshold:
          quality_incentive_amount = round(net_tons
              * CustomFarmingContract.quality_incentive_per_ton, 2)
      else:
          quality_incentive_amount = 0.00
    input_set: "The load's own weigh-tag readings, plus the quality terms of the CustomFarmingContract reached through Block.contract_id. HarvestLoad.estimated_tons and gross_tons_at_dispatch do NOT participate."
    constants: {}
    precision: "2 decimal places, round_half_up"
    note: "Worked references: gross 13.10, tare 0.70, mog 0.00 -> net_tons 12.40; with brix 25.1 against threshold 24.5 and quality_incentive_per_ton 45.00 -> quality_incentive_amount 558.00. Same weigh tag with mog_deduct_pct 0.02 -> net_tons 12.15. brix exactly 24.5 against threshold 24.5 earns the incentive (>= boundary)."

  - name: delivery_window_committed_tons
    trigger: "recomputed on POST /harvest-loads, /harvest-loads/{id}/receive and /harvest-loads/{id}/reject"
    algorithm: aggregation
    formula: |
      committed_tons = round(sum(hl.estimated_tons for hl in HarvestLoad
                                 where hl.delivery_window_id == window.id
                                 and hl.load_status in ("PLANNED", "IN_TRANSIT")), 2)
      remaining_tons = round(capacity_tons - committed_tons, 2)
      utilization    = committed_tons / capacity_tons
      window_posture = "FULL"        if utilization >= FULL_FLOOR
                       else "NEARLY_FULL" if utilization >= NEARLY_FULL_FLOOR
                       else "OPEN"
    input_set: "State-filtered on the booking states only: dispatching a load does not change committed_tons, while receiving or rejecting it releases the booking. net_tons never enters this figure."
    constants:
      NEARLY_FULL_FLOOR: 0.85
      FULL_FLOOR: 1.00
    precision: "tonnage to 2 decimals, round_half_up; utilization compared unrounded"
    note: "Invariant: committed_tons + remaining_tons == capacity_tons at every observable instant. Worked reference: capacity 40.00 with one PLANNED load of 12.40 -> committed 12.40, remaining 27.60, utilization 0.31 -> OPEN."

  - name: contract_management_fee_base
    trigger: "recomputed on POST /contracts/{id}/enroll-block and read by both projected_total_billable and every settle-period run"
    algorithm: aggregation
    formula: |
      management_fee_base = round(sum(
          coalesce(block.per_acre_fee_override, contract.per_acre_annual_fee)
          * block.contracted_acres
          for block in Block where block.contract_id == contract.id), 2)
    input_set: "Every enrolled Block, including blocks whose farming_status has since become REMOVED — the fee follows the contracted acreage, not the living vines."
    constants: {}
    precision: "2 decimal places, round_half_up, applied once to the sum"
    note: "Worked reference: three blocks at 12.5 / 4.0 / 3.6 contracted acres against per_acre_annual_fee 950.00 -> 11875.00 + 3800.00 + 3420.00 = 19095.00."

  - name: contract_period_direct_cost
    trigger: "POST /contracts/{id}/settle-period, as the first stage of the settlement"
    algorithm: waterfall_allocation
    formula: |
      enrolled = [b for b in Block where b.contract_id == contract.id]
      direct_cost_total = 0
      for block in sorted(enrolled, key = created_at ASC):
          block_labor = sum(wo.actual_labor_cost for wo in WorkOrder
                            where wo.block_id == block.id
                            and wo.execution_status == "COMPLETED")
          block_materials = sum(sr.material_cost for sr in SprayRecord
                                where sr.block_id == block.id
                                and sr.spray_status in ("APPLIED", "VERIFIED"))
          block_water = sum(ie.water_cost for ie in IrrigationEvent
                            where ie.block_id == block.id
                            and ie.irrigation_status == "APPLIED")
          overhead_share_raw = (contract.period_overhead_pool * block.contracted_acres
                                / contract.total_contracted_acres)      # NOT rounded
          direct_cost_total += round(block_labor + block_materials + block_water
                                     + overhead_share_raw, 2)           # rounded PER BLOCK
    input_set: "State-filtered: only COMPLETED work orders (a CANCELLED order's reporting-time pay never reaches the client), only APPLIED/VERIFIED sprays, only APPLIED irrigation events. An enrolled block with no qualifying activity still absorbs its overhead share."
    constants: {}
    precision: |
      Each block's direct cost is rounded to 2 decimals BEFORE it joins the total;
      the total is not re-rounded. Allocating the pool first and rounding once at
      the end gives a different answer.
    note: |
      Worked reference. period_overhead_pool 1000.00 over contracted acres
      12.5 / 4.0 / 3.6 (total_contracted_acres 20.1) -> unrounded shares
      621.8905..., 199.0049..., 179.1044... . With block 1 carrying labor
      4343.30, materials 812.50 and water 472.50, and blocks 2 and 3 carrying
      no activity, the per-block figures are 6250.19, 199.00 and 179.10 and
      direct_cost_total is 6628.29. Summing the raw values first and rounding
      once yields 6628.30 — a 0.01 divergence the settlement must not produce.
      With an empty activity set and period_overhead_pool 0.00 the result is
      0.00, not an error.

  - name: contract_period_settlement
    trigger: "POST /contracts/{id}/settle-period"
    algorithm: tiered_pricing
    formula: |
      direct_cost_total   = calculations.contract_period_direct_cost
      management_fee_base = calculations.contract_management_fee_base
      pass_through = round(direct_cost_total * contract.cost_pass_through_pct
                           * pass_through_share, 2)   # share set by the variant
      tier_basis = round(management_fee_base + pass_through, 2)
      volume_discount_pct = 0.00 if tier_basis <  TIER_1_FLOOR
                            else 0.03 if tier_basis <  TIER_2_FLOOR
                            else 0.05
      volume_discount   = round(management_fee_base * volume_discount_pct, 2)
      quality_incentive = contract.accrued_quality_incentive if variant is FINAL else 0.00
      total_billable    = round(management_fee_base + pass_through
                                - volume_discount + quality_incentive, 2)
    input_set: "The contract's own commercial terms, the direct-cost roll-up above, and — for the FINAL variant only — accrued_quality_incentive from RECEIVED loads whose brix cleared the threshold."
    constants:
      TIER_1_FLOOR: 15000
      TIER_2_FLOOR: 20000
      PROVISIONAL_PASS_THROUGH_SHARE: 0.50
    precision: |
      2 decimal places, round_half_up. Evaluation order is load-bearing on two
      counts: (a) the tier is keyed on management_fee_base + pass_through
      BEFORE the discount and EXCLUDING quality_incentive, while the discount
      itself is applied to management_fee_base alone; (b) pass_through is
      rounded before it enters tier_basis.
    variants:
      - name: provisional
        when: "settlement_mode == PROVISIONAL — an interim invoice issued mid-period"
        difference: "pass_through_share is PROVISIONAL_PASS_THROUGH_SHARE (0.50) and quality_incentive is forced to 0.00 because fruit quality is not yet known; contract_status stays ACTIVE"
      - name: final
        when: "settlement_mode == FINAL — the period-closing invoice"
        difference: "pass_through_share is 1.00 and quality_incentive is the contract's accrued_quality_incentive; when period_end_date >= contract.period_end the contract also transitions ACTIVE -> CLOSED"
    note: |
      Worked reference on identical stored data (management_fee_base 19095.00,
      direct_cost_total 6628.29, cost_pass_through_pct 0.08,
      accrued_quality_incentive 558.00). FINAL: pass_through 530.26,
      tier_basis 19625.26 -> 0.03, volume_discount 572.85, total_billable
      19610.41. PROVISIONAL: pass_through 265.13, tier_basis 19360.13 -> 0.03,
      volume_discount 572.85, quality_incentive 0.00, total_billable 18787.28.
      The two variants diverge by 823.13 on the same data. Two order traps:
      including quality_incentive in tier_basis would give 20183.26 -> the
      0.05 tier -> volume_discount 954.75; and applying the discount to
      tier_basis instead of management_fee_base would give 588.76.
      Empty-set reference: a contract with a single 5.0-acre enrolled block,
      period_overhead_pool 0.00 and no activity settles to direct_cost_total
      0.00, pass_through 0.00, management_fee_base 4750.00, tier_basis 4750.00
      -> volume_discount_pct 0.00, total_billable 4750.00.

  - name: spray_interval_clearances
    trigger: "POST /spray-records/{id}/apply"
    algorithm: interval_merge
    formula: |
      spray.rei_clear_at = spray.applied_at + spray.rei_hours hours
      spray.phi_clear_at = spray.applied_at + spray.phi_days * 24 hours
      qualifying = [s for s in SprayRecord where s.block_id == block.id
                    and s.spray_status in ("APPLIED", "VERIFIED")]
      block.rei_clear_at = max(s.rei_clear_at for s in qualifying) or null
      block.phi_clear_at = max(s.phi_clear_at for s in qualifying) or null
      # entry and harvest are permitted at the clearance instant itself
      entry_permitted   = block.rei_clear_at is null or current_utc >= block.rei_clear_at
      harvest_permitted = block.phi_clear_at is null or current_utc >= block.phi_clear_at
    input_set: "Only APPLIED and VERIFIED spray records on that block; a RECOMMENDED record imposes no restriction. The block-level clearance is the maximum, so a later spray with a short interval never shortens an earlier long one."
    constants: {}
    precision: "whole seconds, ISO 8601 UTC; both comparisons are >= so the clearance instant itself is permitted"
    note: "Worked reference: applied_at 2026-08-02T06:00:00Z with rei_hours 72 and phi_days 21 -> rei_clear_at 2026-08-05T06:00:00Z and phi_clear_at 2026-08-23T06:00:00Z. Starting a work order at exactly 2026-08-05T06:00:00Z is permitted; one second earlier is refused with ERR_REENTRY_INTERVAL_ACTIVE."

  - name: crew_schedule_conflict_detection
    trigger: "POST /work-orders, before the budget check"
    algorithm: interval_merge
    formula: |
      for existing in WorkOrder where existing.crew_id == new.crew_id
                      and existing.execution_status in ("SCHEDULED", "IN_PROGRESS"):
          gap = 0 if existing.block_id == new.block_id
                else TRAVEL_BUFFER_MINUTES minutes
          if new.scheduled_start < existing.scheduled_end + gap \
             and existing.scheduled_start < new.scheduled_end + gap:
              reject with ERR_CREW_SCHEDULE_CONFLICT
    input_set: "Only SCHEDULED and IN_PROGRESS work orders for the same crew; COMPLETED and CANCELLED orders free their interval. Orders for other crews never conflict."
    constants:
      TRAVEL_BUFFER_MINUTES: 60
    precision: "intervals are half-open [scheduled_start, scheduled_end); comparisons are strict <"
    note: |
      Two different interval geometries live in this scaffold and must not be
      conflated. Crew scheduling is half-open with a travel buffer: back-to-back
      orders on the SAME block (gap 0) where one ends exactly when the next
      starts do NOT conflict, while the identical pair on DIFFERENT blocks does
      conflict until 60 minutes separate them. WineryDeliveryWindow booking is
      the other geometry — a CLOSED containment test on delivery_eta plus an
      aggregate tonnage capacity that permits unlimited overlap (see
      validations ERR_DELIVERY_ETA_OUTSIDE_WINDOW and
      ERR_WINDOW_CAPACITY_EXCEEDED).

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (Ordered by Priority)
# -----------------------------------------------------------------------------
# Evaluation is strictly ascending by `priority`. The first rule whose condition
# is violated determines the response; no later rule is evaluated. Within a
# single priority number, sub-checks run in the order written.
validations:

  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank, and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "the request's X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"

  - priority: 30
    category: business_constraint
    check: "request body schema: every required field present, every field of the declared JSON type, every enum value inside its declared set, every numeric inside its declared range, no unknown fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 31
    category: business_constraint
    check: "interval sanity: scheduled_end > scheduled_start (POST /work-orders, POST /irrigation-events); window_end > window_start (POST /delivery-windows); period_end >= period_start (POST /contracts)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /work-orders, POST /irrigation-events, POST /delivery-windows, POST /contracts"

  - priority: 32
    category: business_constraint
    check: "method-conditional yield fields: method == CLUSTER_COUNT requires avg_cluster_weight_lb and forbids berries_per_cluster, avg_berry_weight_g and days_to_harvest; method == BERRY_SAMPLE requires all three of those and forbids avg_cluster_weight_lb"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /blocks/{id}/yield-estimates"

  - priority: 33
    category: business_constraint
    check: "pay-structure coherence: piece_rate_per_vine > 0 is required when pay_structure == PIECE_RATE and must equal 0 when pay_structure == HOURLY"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /crews"

  - priority: 34
    category: business_constraint
    check: "weigh-tag sanity: tare_tons < gross_tons and 0 <= mog_deduct_pct <= 1"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "POST /harvest-loads/{id}/receive"

  - priority: 35
    category: business_constraint
    check: "pagination: limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 40
    category: existence
    check: "every id in the request path resolves to a stored row, validated left to right: Vineyard -> ERR_VINEYARD_NOT_FOUND, Block -> ERR_BLOCK_NOT_FOUND, CustomFarmingContract -> ERR_CONTRACT_NOT_FOUND, FarmingPlan -> ERR_PLAN_NOT_FOUND, LaborCrew -> ERR_CREW_NOT_FOUND, WorkOrder -> ERR_WORK_ORDER_NOT_FOUND, SprayRecord -> ERR_SPRAY_NOT_FOUND, IrrigationEvent -> ERR_IRRIGATION_EVENT_NOT_FOUND, WineryDeliveryWindow -> ERR_DELIVERY_WINDOW_NOT_FOUND, HarvestLoad -> ERR_HARVEST_LOAD_NOT_FOUND"
    error_id: ERR_BLOCK_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying a path id"
    note: "The listed error_id is the representative code; the concrete code is selected by which path segment failed to resolve. See §1.6 for the full set."

  - priority: 45
    category: existence
    check: "every foreign key in the request body resolves, checked in this fixed order: vineyard_id, replaces_block_id, block_id, contract_id, farming_plan_id, crew_id, delivery_window_id, pest_observation_id (-> ERR_PEST_OBSERVATION_NOT_FOUND)"
    error_id: ERR_PEST_OBSERVATION_NOT_FOUND
    http_status: 404
    applies_to: "POST /blocks, POST /contracts, POST /contracts/{id}/enroll-block, POST /farming-plans, POST /work-orders, POST /irrigation-events, POST /spray-records, POST /harvest-loads"
    note: "The listed error_id is the representative code; the concrete code is selected by which body FK failed to resolve."

  - priority: 50
    category: auth
    check: "when X-User-Role is ClientOwner, X-User-ID equals the Vineyard.id reached from the target resource (Vineyard.id itself, or CustomFarmingContract.vineyard_id)"
    error_id: ERR_VINEYARD_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "GET /vineyards/{id}, GET /contracts/{id}, GET /contracts, POST /contracts/{id}/activate"

  - priority: 52
    category: auth
    check: "when X-User-Role is CrewSupervisor, X-User-ID equals the LaborCrew.id referenced by the target WorkOrder.crew_id or HarvestLoad.crew_id"
    error_id: ERR_CREW_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "POST /work-orders/{id}/start, POST /work-orders/{id}/complete, POST /irrigation-events/{id}/record-applied, POST /harvest-loads/{id}/dispatch"
    note: "POST /irrigation-events/{id}/record-applied carries no crew reference, so the check is vacuously satisfied there and the rule only bites on the three crew-bearing endpoints."

  - priority: 55
    category: state
    check: "expected_block_version equals the current Block.version of the spray record's block (§1.2.1 spray-apply-stale-block)"
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412
    applies_to: "POST /spray-records/{id}/apply"

  - priority: 56
    category: state
    check: "expected_delivery_window_version equals the current WineryDeliveryWindow.version of the referenced window (§1.2.1 harvest-load-create-stale-window)"
    error_id: ERR_STALE_DELIVERY_WINDOW_VERSION
    http_status: 412
    applies_to: "POST /harvest-loads"

  - priority: 60
    category: state
    check: "CustomFarmingContract.contract_status == DRAFT"
    error_id: ERR_CONTRACT_NOT_DRAFT
    http_status: 409
    applies_to: "POST /contracts/{id}/enroll-block, POST /contracts/{id}/activate"

  - priority: 61
    category: state
    check: "the governing CustomFarmingContract.contract_status == ACTIVE — the contract named in the path for settle-period, or the contract reached through Block.contract_id for a harvest-load booking"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /contracts/{id}/settle-period, POST /harvest-loads"

  - priority: 62
    category: state
    check: "FarmingPlan.plan_status == DRAFT"
    error_id: ERR_PLAN_NOT_DRAFT
    http_status: 409
    applies_to: "POST /farming-plans/{id}/submit"

  - priority: 63
    category: state
    check: "FarmingPlan.plan_status == SUBMITTED"
    error_id: ERR_PLAN_NOT_SUBMITTED
    http_status: 409
    applies_to: "POST /farming-plans/{id}/approve, POST /farming-plans/{id}/return-for-revision"

  - priority: 64
    category: state
    check: "FarmingPlan.revision_count < MAX_REVISION_ROUNDS (2)"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /farming-plans/{id}/return-for-revision"

  - priority: 65
    category: state
    check: "the referenced FarmingPlan.plan_status == APPROVED"
    error_id: ERR_PLAN_NOT_APPROVED
    http_status: 409
    applies_to: "POST /work-orders, POST /irrigation-events, POST /spray-records"

  - priority: 66
    category: state
    check: "the referenced Block.farming_status != REMOVED — including the block named by replaces_block_id on POST /blocks, which must not already be REMOVED"
    error_id: ERR_BLOCK_REMOVED
    http_status: 409
    applies_to: "POST /blocks, POST /blocks/{id}/pest-observations, POST /blocks/{id}/yield-estimates, POST /farming-plans, POST /farming-plans/{id}/submit, POST /farming-plans/{id}/approve, POST /work-orders, POST /irrigation-events, POST /irrigation-events/{id}/record-applied, POST /spray-records, POST /spray-records/{id}/apply, POST /harvest-loads"

  - priority: 67
    category: state
    check: "WorkOrder.execution_status == SCHEDULED"
    error_id: ERR_WORK_ORDER_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /work-orders/{id}/start"

  - priority: 68
    category: state
    check: "WorkOrder.execution_status == IN_PROGRESS"
    error_id: ERR_WORK_ORDER_NOT_IN_PROGRESS
    http_status: 409
    applies_to: "POST /work-orders/{id}/complete"

  - priority: 69
    category: state
    check: "WorkOrder.execution_status is neither COMPLETED nor CANCELLED"
    error_id: ERR_WORK_ORDER_TERMINAL
    http_status: 409
    applies_to: "POST /work-orders/{id}/cancel"

  - priority: 70
    category: state
    check: "payroll_action == APPROVE requires payroll_status == PENDING; payroll_action == PAY requires payroll_status == APPROVED"
    error_id: ERR_PAYROLL_STATE_INVALID
    http_status: 409
    applies_to: "POST /work-orders/{id}/payroll"

  - priority: 71
    category: state
    check: "SprayRecord.spray_status == RECOMMENDED"
    error_id: ERR_SPRAY_NOT_RECOMMENDED
    http_status: 409
    applies_to: "POST /spray-records/{id}/apply"

  - priority: 72
    category: state
    check: "SprayRecord.spray_status == APPLIED"
    error_id: ERR_SPRAY_NOT_APPLIED
    http_status: 409
    applies_to: "POST /spray-records/{id}/verify"

  - priority: 73
    category: state
    check: "IrrigationEvent.irrigation_status == SCHEDULED"
    error_id: ERR_IRRIGATION_NOT_SCHEDULED
    http_status: 409
    applies_to: "POST /irrigation-events/{id}/record-applied"

  - priority: 74
    category: state
    check: "HarvestLoad.load_status == PLANNED"
    error_id: ERR_LOAD_NOT_PLANNED
    http_status: 409
    applies_to: "POST /harvest-loads/{id}/dispatch"

  - priority: 75
    category: state
    check: "HarvestLoad.load_status == IN_TRANSIT"
    error_id: ERR_LOAD_NOT_IN_TRANSIT
    http_status: 409
    applies_to: "POST /harvest-loads/{id}/receive, POST /harvest-loads/{id}/reject"

  - priority: 76
    category: state
    check: "the referenced LaborCrew.crew_status == ACTIVE"
    error_id: ERR_CREW_INACTIVE
    http_status: 409
    applies_to: "POST /work-orders, POST /work-orders/{id}/start, POST /harvest-loads, POST /harvest-loads/{id}/dispatch"

  - priority: 80
    category: business_safety
    check: "segregation of duties: the request X-User-ID differs from FarmingPlan.submitted_by_user_id on plan approve; from SprayRecord.recommended_by_user_id on spray apply; and from both recommended_by_user_id and applied_by_user_id on spray verify"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /farming-plans/{id}/approve, POST /spray-records/{id}/apply, POST /spray-records/{id}/verify"

  - priority: 85
    category: business_safety
    check: "a work order whose scheduled_start falls before the block's current rei_clear_at may only be booked for a crew with pest_certified == true"
    error_id: ERR_CREW_NOT_PEST_CERTIFIED
    http_status: 409
    applies_to: "POST /work-orders"

  - priority: 86
    category: business_safety
    check: "starting a work order requires current_utc >= Block.rei_clear_at unless the crew has pest_certified == true; the clearance instant itself is permitted"
    error_id: ERR_REENTRY_INTERVAL_ACTIVE
    http_status: 409
    applies_to: "POST /work-orders/{id}/start"

  - priority: 87
    category: business_safety
    check: "harvest must clear the pre-harvest interval: on POST /harvest-loads, delivery_eta >= Block.phi_clear_at; on dispatch, current_utc >= Block.phi_clear_at. The clearance instant itself is permitted, and a null phi_clear_at imposes no restriction."
    error_id: ERR_PREHARVEST_INTERVAL_ACTIVE
    http_status: 409
    applies_to: "POST /harvest-loads, POST /harvest-loads/{id}/dispatch"

  - priority: 88
    category: business_safety
    check: "the cited PestObservation.exceeds_threshold == true — a spray may not be recommended below the pest's action threshold"
    error_id: ERR_ACTION_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /spray-records"

  - priority: 90
    category: business_temporal
    check: "the crew's [scheduled_start, scheduled_end) interval does not conflict with any of its SCHEDULED or IN_PROGRESS work orders, using gap 0 for the same block and TRAVEL_BUFFER_MINUTES (60) for a different block (see calculations.crew_schedule_conflict_detection)"
    error_id: ERR_CREW_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders"

  - priority: 91
    category: business_temporal
    check: "window_start <= delivery_eta <= window_end (closed interval, both ends inclusive)"
    error_id: ERR_DELIVERY_ETA_OUTSIDE_WINDOW
    http_status: 409
    applies_to: "POST /harvest-loads"

  - priority: 95
    category: business_referential
    check: "no other FarmingPlan exists with the same (block_id, plan_year)"
    error_id: ERR_DUPLICATE_PLAN_FOR_BLOCK_YEAR
    http_status: 409
    applies_to: "POST /farming-plans"

  - priority: 96
    category: business_referential
    check: "no other Block exists with the same (vineyard_id, block_code)"
    error_id: ERR_DUPLICATE_BLOCK_CODE
    http_status: 409
    applies_to: "POST /blocks"

  - priority: 97
    category: business_referential
    check: "the referenced FarmingPlan.block_id equals the request's block_id — a plan may not be charged for work on a different block"
    error_id: ERR_PLAN_BLOCK_MISMATCH
    http_status: 409
    applies_to: "POST /work-orders, POST /irrigation-events, POST /spray-records"

  - priority: 98
    category: business_referential
    check: "on POST /contracts/{id}/enroll-block, Block.vineyard_id equals CustomFarmingContract.vineyard_id; on POST /blocks, the block named by replaces_block_id has the same vineyard_id as the new block"
    error_id: ERR_VINEYARD_MISMATCH
    http_status: 409
    applies_to: "POST /contracts/{id}/enroll-block, POST /blocks"

  - priority: 99
    category: business_referential
    check: "Block.contract_id is null — a block may only be enrolled under one contract"
    error_id: ERR_BLOCK_ALREADY_ENROLLED
    http_status: 409
    applies_to: "POST /contracts/{id}/enroll-block"

  - priority: 100
    category: business_referential
    check: "CustomFarmingContract.enrolled_block_count >= 1"
    error_id: ERR_NO_ENROLLED_BLOCKS
    http_status: 409
    applies_to: "POST /contracts/{id}/activate"

  - priority: 101
    category: business_referential
    check: "the referenced Block.contract_id is not null — unenrolled fruit cannot be booked for winery delivery"
    error_id: ERR_BLOCK_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /harvest-loads"

  - priority: 102
    category: business_referential
    check: "the referenced Block has at least one YieldEstimate (Block.harvest_posture != NOT_ESTIMATED)"
    error_id: ERR_NO_YIELD_ESTIMATE
    http_status: 409
    applies_to: "POST /harvest-loads"

  - priority: 103
    category: business_referential
    check: "the requested task is within the crew's capabilities: task_type is in LaborCrew.task_capabilities on POST /work-orders, and \"HARVEST\" is in LaborCrew.task_capabilities on POST /harvest-loads"
    error_id: ERR_CREW_TASK_MISMATCH
    http_status: 409
    applies_to: "POST /work-orders, POST /harvest-loads"

  - priority: 110
    category: business_fiscal
    check: "round(FarmingPlan.committed_cost + this order's estimated_labor_cost, 2) <= FarmingPlan.total_budget — equality is permitted"
    error_id: ERR_PLAN_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /work-orders"
    note: "Deliberately NOT applied to POST /irrigation-events/{id}/record-applied: applied water is a recorded actual, which is how budget_posture EXHAUSTED becomes reachable."

  - priority: 111
    category: business_fiscal
    check: "round(WineryDeliveryWindow.committed_tons + estimated_tons, 2) <= WineryDeliveryWindow.capacity_tons — equality is permitted; overlapping delivery_eta values are allowed, only the aggregate tonnage is capped"
    error_id: ERR_WINDOW_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /harvest-loads"

  - priority: 112
    category: business_fiscal
    check: "round(Block.committed_harvest_tons + Block.received_tons + estimated_tons, 2) <= round(Block.governing_estimate_tons * HARVEST_TOLERANCE, 2) with HARVEST_TOLERANCE 1.10 — equality is permitted"
    error_id: ERR_HARVEST_EXCEEDS_ESTIMATE
    http_status: 409
    applies_to: "POST /harvest-loads"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
# api_prefix is "/", so every collection sits at the URL root. Every path
# placeholder is spelled {id}.
endpoints:

  # --- Vineyard -------------------------------------------------------------
  - method: POST
    path: "/vineyards"
    description: "Register a client ranch."
    roles: [VineyardManager]
    code: 201
    input: [name, owner_legal_name, ava_region, client_contact_email]
    output: Vineyard
    side_effects:
      - "initializes block_count to 0 and managed_acres to 0.00"
      - "sets version to 1"

  - method: GET
    path: "/vineyards/{id}"
    description: "Read one ranch, including its live block_count and managed_acres."
    roles: [VineyardManager, Controller, ClientOwner]
    code: 200
    input: []
    output: Vineyard
    side_effects: []

  # --- Block ----------------------------------------------------------------
  - method: POST
    path: "/blocks"
    description: "Plant a block. Supplying replaces_block_id records a replant and retires the predecessor."
    roles: [VineyardManager]
    code: 201
    input: [vineyard_id, block_code, variety, clone, rootstock, trellis_system, planting_year, vine_spacing_ft, row_spacing_ft, acres, "replaces_block_id?"]
    output: Block
    side_effects:
      - "computes vines_per_acre and vine_count per calculations.block_vine_geometry and freezes both"
      - "sets farming_status to ESTABLISHING, compliance_posture to CLEAR and harvest_posture to NOT_ESTIMATED"
      - "when replaces_block_id is supplied, drives that Block ESTABLISHING|BEARING -> REMOVED and increments its version by 1"
      - "recomputes Vineyard.block_count and Vineyard.managed_acres"
      - "sets version to 1"

  - method: GET
    path: "/blocks/{id}"
    description: "Read one block, including rei_clear_at, phi_clear_at, compliance_posture, the harvest ledger and the version needed for expected_block_version."
    roles: [VineyardManager, Agronomist, Applicator, ComplianceOfficer, Controller, CrewSupervisor]
    code: 200
    input: []
    output: Block
    side_effects: []

  - method: GET
    path: "/blocks"
    description: "List blocks, filterable by ranch, contract, replant predecessor and farming status."
    roles: [VineyardManager, Agronomist, Applicator, ComplianceOfficer, Controller, CrewSupervisor]
    code: 200
    input: ["vineyard_id?", "contract_id?", "replaces_block_id?", "farming_status?", "limit?", "offset?"]
    output: Block[]
    side_effects: []

  - method: POST
    path: "/blocks/{id}/pest-observations"
    description: "File a scouting observation against a block."
    roles: [Agronomist]
    code: 201
    input: [pest_code, incidence_pct, severity_index, "scouting_note?"]
    output: PestObservation
    side_effects:
      - "copies ACTION_THRESHOLD_PCT[pest_code] onto action_threshold_pct"
      - "sets exceeds_threshold to incidence_pct >= action_threshold_pct"
      - "sets observed_at from the logical clock and scout_user_id from X-User-ID"

  - method: GET
    path: "/blocks/{id}/pest-observations"
    description: "List the scouting observations filed against a block, newest observed_at first."
    roles: [VineyardManager, Agronomist, Applicator, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: PestObservation[]
    side_effects: []

  - method: POST
    path: "/blocks/{id}/yield-estimates"
    description: "File a cluster-count or berry-sample yield estimate for a block."
    roles: [VineyardManager, Agronomist]
    code: 201
    input: [method, sample_date, avg_clusters_per_vine, "avg_cluster_weight_lb?", "berries_per_cluster?", "avg_berry_weight_g?", "days_to_harvest?"]
    output: YieldEstimate
    side_effects:
      - "freezes vine_count_at_estimate from Block.vine_count"
      - "computes estimated_tons and estimated_tons_per_acre per calculations.block_yield_estimate_tons"
      - "recomputes Block.governing_estimate_tons, remaining_estimated_tons and harvest_posture per calculations.governing_yield_estimate_selector"
      - "increments Block.version by 1"

  - method: GET
    path: "/blocks/{id}/yield-estimates"
    description: "List the yield estimates filed for a block, newest sample_date first."
    roles: [VineyardManager, Agronomist, Controller]
    code: 200
    input: ["limit?", "offset?"]
    output: YieldEstimate[]
    side_effects: []

  # --- CustomFarmingContract ------------------------------------------------
  - method: POST
    path: "/contracts"
    description: "Draft a custom-farming agreement for a ranch."
    roles: [VineyardManager]
    code: 201
    input: [vineyard_id, per_acre_annual_fee, cost_pass_through_pct, quality_incentive_per_ton, quality_brix_threshold, period_overhead_pool, period_start, period_end]
    output: CustomFarmingContract
    side_effects:
      - "sets contract_status to DRAFT and settled_period_count to 0"
      - "initializes enrolled_block_count 0, total_contracted_acres 0.00, accrued_quality_incentive 0.00, projected_total_billable 0.00"
      - "sets version to 1"

  - method: GET
    path: "/contracts/{id}"
    description: "Read one contract, including accrued_quality_incentive and projected_total_billable."
    roles: [VineyardManager, Controller, ClientOwner]
    code: 200
    input: []
    output: CustomFarmingContract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List contracts, filterable by ranch and status."
    roles: [VineyardManager, Controller, ClientOwner]
    code: 200
    input: ["vineyard_id?", "contract_status?", "limit?", "offset?"]
    output: CustomFarmingContract[]
    side_effects: []

  - method: POST
    path: "/contracts/{id}/enroll-block"
    description: "Enroll a block under a DRAFT contract at a stated contracted acreage, optionally at a block-specific per-acre fee. Returns the updated Block."
    roles: [VineyardManager]
    code: 200
    input: [block_id, contracted_acres, "per_acre_fee_override?"]
    output: Block
    side_effects:
      - "sets Block.contract_id, Block.contracted_acres and Block.per_acre_fee_override"
      - "increments Block.version by 1"
      - "recomputes CustomFarmingContract.enrolled_block_count and total_contracted_acres"
      - "recomputes CustomFarmingContract.projected_total_billable via calculations.contract_management_fee_base"
      - "increments CustomFarmingContract.version by 1"

  - method: POST
    path: "/contracts/{id}/activate"
    description: "Client countersigns the contract, moving it DRAFT -> ACTIVE and freezing the enrolled block set."
    roles: [ClientOwner]
    code: 200
    input: [client_signature_name]
    output: CustomFarmingContract
    side_effects:
      - "sets contract_status to ACTIVE and stores client_signature_name"
      - "increments CustomFarmingContract.version by 1"

  - method: POST
    path: "/contracts/{id}/settle-period"
    description: "Run a settlement for the contract period and return the full statement. settlement_mode selects the PROVISIONAL or FINAL variant of calculations.contract_period_settlement."
    roles: [Controller]
    code: 200
    input: [settlement_mode, period_end_date]
    output: "{ contract_id: string, settlement_mode: string, period_end_date: string, direct_cost_total: number, management_fee_base: number, pass_through: number, tier_basis: number, volume_discount_pct: number, volume_discount: number, quality_incentive: number, total_billable: number, contract_status: string }"
    side_effects:
      - "evaluates calculations.contract_period_direct_cost and calculations.contract_period_settlement"
      - "increments CustomFarmingContract.settled_period_count by 1 and stores total_billable in last_settlement_total"
      - "transitions contract_status ACTIVE -> CLOSED when settlement_mode == FINAL and period_end_date >= CustomFarmingContract.period_end"
      - "increments CustomFarmingContract.version by 1"

  # --- FarmingPlan ----------------------------------------------------------
  - method: POST
    path: "/farming-plans"
    description: "Draft the annual farming program for one block and crop year."
    roles: [VineyardManager, Agronomist]
    code: 201
    input: [block_id, plan_year, quality_target, pruning_budget_per_acre, canopy_budget_per_acre, irrigation_budget_per_acre, pest_budget_per_acre, seasonal_water_cap_inches]
    output: FarmingPlan
    side_effects:
      - "computes total_budget per calculations.farming_plan_total_budget"
      - "sets plan_status DRAFT, revision_count 0, committed_cost 0.00, remaining_budget = total_budget, budget_posture WITHIN_BUDGET"
      - "sets version to 1"

  - method: GET
    path: "/farming-plans/{id}"
    description: "Read one farming plan, including committed_cost, remaining_budget and budget_posture."
    roles: [VineyardManager, Agronomist, Controller]
    code: 200
    input: []
    output: FarmingPlan
    side_effects: []

  - method: GET
    path: "/farming-plans"
    description: "List farming plans, filterable by block, crop year and status."
    roles: [VineyardManager, Agronomist, Controller]
    code: 200
    input: ["block_id?", "plan_year?", "plan_status?", "limit?", "offset?"]
    output: FarmingPlan[]
    side_effects: []

  - method: POST
    path: "/farming-plans/{id}/submit"
    description: "Submit a DRAFT plan for controller review."
    roles: [VineyardManager]
    code: 200
    input: ["submission_note?"]
    output: FarmingPlan
    side_effects:
      - "sets plan_status to SUBMITTED and submitted_by_user_id to X-User-ID"
      - "increments FarmingPlan.version by 1"

  - method: POST
    path: "/farming-plans/{id}/return-for-revision"
    description: "Send a SUBMITTED plan back to DRAFT for rework; at most MAX_REVISION_ROUNDS (2) rounds are permitted."
    roles: [Controller]
    code: 200
    input: [revision_note]
    output: FarmingPlan
    side_effects:
      - "sets plan_status to DRAFT, increments revision_count by 1 and clears submitted_by_user_id"
      - "increments FarmingPlan.version by 1"

  - method: POST
    path: "/farming-plans/{id}/approve"
    description: "Approve a SUBMITTED plan. The approver must not be the submitter."
    roles: [Controller]
    code: 200
    input: ["approval_note?"]
    output: FarmingPlan
    side_effects:
      - "sets plan_status to APPROVED and approved_by_user_id to X-User-ID"
      - "drives Block.farming_status ESTABLISHING -> BEARING when plan_year >= Block.planting_year + 3 and increments Block.version by 1"
      - "increments FarmingPlan.version by 1"

  # --- LaborCrew ------------------------------------------------------------
  - method: POST
    path: "/crews"
    description: "Register a labor crew with its pay structure and task capabilities."
    roles: [VineyardManager]
    code: 201
    input: [crew_name, pay_structure, crew_size, base_hourly_rate, piece_rate_per_vine, vines_per_hour_standard, task_capabilities, pest_certified, "crew_status?"]
    output: LaborCrew
    side_effects:
      - "defaults crew_status to ACTIVE when omitted"
      - "initializes scheduled_work_order_count to 0"
      - "sets version to 1"

  - method: GET
    path: "/crews/{id}"
    description: "Read one crew, including its live scheduled_work_order_count."
    roles: [VineyardManager, Controller, CrewSupervisor]
    code: 200
    input: []
    output: LaborCrew
    side_effects: []

  # --- WorkOrder ------------------------------------------------------------
  - method: POST
    path: "/work-orders"
    description: "Schedule a crew onto a block for a pruning, suckering, leafing or harvest task, drawing against an APPROVED farming plan."
    roles: [VineyardManager]
    code: 201
    input: [block_id, farming_plan_id, crew_id, task_type, scheduled_start, scheduled_end, planned_vines, planned_hours]
    output: WorkOrder
    side_effects:
      - "computes estimated_labor_cost per calculations.work_order_labor_cost variant 'estimated' and freezes it"
      - "sets execution_status SCHEDULED and payroll_status NOT_PAYABLE"
      - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture"
      - "recomputes LaborCrew.scheduled_work_order_count"
      - "sets version to 1"

  - method: GET
    path: "/work-orders/{id}"
    description: "Read one work order, including both state dimensions and both cost figures."
    roles: [VineyardManager, Controller, CrewSupervisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/work-orders"
    description: "List work orders, filterable by block, crew, plan, execution status and payroll status."
    roles: [VineyardManager, Controller, CrewSupervisor]
    code: 200
    input: ["block_id?", "crew_id?", "farming_plan_id?", "execution_status?", "payroll_status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []

  - method: POST
    path: "/work-orders/{id}/start"
    description: "Crew supervisor starts the scheduled task. Refused while the block's re-entry interval is open unless the crew is pest_certified."
    roles: [CrewSupervisor]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "sets execution_status to IN_PROGRESS and started_at from the logical clock"
      - "leaves payroll_status at NOT_PAYABLE"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Report the work actually performed, which replaces the frozen estimate on the plan ledger and opens payroll."
    roles: [CrewSupervisor]
    code: 200
    input: [actual_vines, actual_hours]
    output: WorkOrder
    side_effects:
      - "sets execution_status COMPLETED, actual_vines, actual_hours and completed_at"
      - "computes actual_labor_cost per calculations.work_order_labor_cost variant 'actual'"
      - "advances payroll_status NOT_PAYABLE -> PENDING"
      - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture"
      - "recomputes LaborCrew.scheduled_work_order_count"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a scheduled or in-progress work order. Cancelling in progress substitutes reporting-time pay."
    roles: [VineyardManager]
    code: 200
    input: [cancel_reason]
    output: WorkOrder
    side_effects:
      - "sets execution_status CANCELLED and cancel_reason"
      - "from IN_PROGRESS only: sets actual_labor_cost per calculations.work_order_cancellation_pay and advances payroll_status NOT_PAYABLE -> PENDING"
      - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture"
      - "recomputes LaborCrew.scheduled_work_order_count"
      - "increments WorkOrder.version by 1"

  - method: POST
    path: "/work-orders/{id}/payroll"
    description: "Advance the payroll dimension: payroll_action APPROVE moves PENDING -> APPROVED, PAY moves APPROVED -> PAID."
    roles: [Controller]
    code: 200
    input: [payroll_action, "payroll_note?"]
    output: WorkOrder
    side_effects:
      - "advances payroll_status without touching execution_status"
      - "increments WorkOrder.version by 1"

  # --- IrrigationEvent ------------------------------------------------------
  - method: POST
    path: "/irrigation-events"
    description: "Schedule an irrigation set; the deficit-irrigation recommendation is computed and frozen at create."
    roles: [VineyardManager, Agronomist]
    code: 201
    input: [block_id, farming_plan_id, scheduled_start, scheduled_end, et0_inches, crop_coefficient, soil_moisture_pct, field_capacity_pct, root_zone_depth_in, effective_rain_inches, water_unit_cost_per_acre_inch]
    output: IrrigationEvent
    side_effects:
      - "copies deficit_factor from DEFICIT_FACTOR[FarmingPlan.quality_target]"
      - "computes et_demand_inches, target_inches, soil_shortfall_inches, refill_inches, gross_requirement_inches, seasonal_allowance_inches and recommended_inches per calculations.irrigation_recommended_inches and freezes them"
      - "sets irrigation_status to SCHEDULED"
      - "sets version to 1"

  - method: GET
    path: "/irrigation-events/{id}"
    description: "Read one irrigation event, including every derived water figure."
    roles: [VineyardManager, Agronomist, CrewSupervisor]
    code: 200
    input: []
    output: IrrigationEvent
    side_effects: []

  - method: GET
    path: "/irrigation-events"
    description: "List irrigation events, filterable by block, plan and status."
    roles: [VineyardManager, Agronomist, CrewSupervisor]
    code: 200
    input: ["block_id?", "farming_plan_id?", "irrigation_status?", "limit?", "offset?"]
    output: IrrigationEvent[]
    side_effects: []

  - method: POST
    path: "/irrigation-events/{id}/record-applied"
    description: "Record the water actually applied. Not budget-gated — applied water is a recorded actual."
    roles: [VineyardManager, CrewSupervisor]
    code: 200
    input: [applied_inches]
    output: IrrigationEvent
    side_effects:
      - "sets irrigation_status APPLIED, applied_inches, applied_at and water_cost"
      - "recomputes Block.season_applied_inches and increments Block.version by 1"
      - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture, which may become EXHAUSTED"
      - "increments IrrigationEvent.version by 1"

  # --- SprayRecord ----------------------------------------------------------
  - method: POST
    path: "/spray-records"
    description: "Recommend a pesticide application, citing a threshold-exceeding scouting observation."
    roles: [Agronomist]
    code: 201
    input: [block_id, farming_plan_id, pest_observation_id, product_name, active_ingredient, rei_hours, phi_days, rate_per_acre, material_cost]
    output: SprayRecord
    side_effects:
      - "sets spray_status RECOMMENDED and recommended_by_user_id from X-User-ID"
      - "leaves FarmingPlan.committed_cost untouched — material_cost only joins the ledger at apply"
      - "sets version to 1"

  - method: GET
    path: "/spray-records/{id}"
    description: "Read one spray record, including the derived rei_clear_at and phi_clear_at and the full segregation-of-duties trail."
    roles: [VineyardManager, Agronomist, Applicator, ComplianceOfficer]
    code: 200
    input: []
    output: SprayRecord
    side_effects: []

  - method: GET
    path: "/spray-records"
    description: "List spray records, filterable by block, plan, cited observation and status."
    roles: [VineyardManager, Agronomist, Applicator, ComplianceOfficer]
    code: 200
    input: ["block_id?", "farming_plan_id?", "pest_observation_id?", "spray_status?", "limit?", "offset?"]
    output: SprayRecord[]
    side_effects: []

  - method: POST
    path: "/spray-records/{id}/apply"
    description: "Log the application. expected_block_version must carry the Block.version last observed via GET /blocks/{id} (§1.2.1 spray-apply-stale-block). The applicator may not be the recommender."
    roles: [Applicator]
    code: 200
    input: [applicator_license_no, wind_speed_mph, expected_block_version]
    output: SprayRecord
    side_effects:
      - "sets spray_status APPLIED, applied_by_user_id, applicator_license_no, wind_speed_mph and applied_at"
      - "computes rei_clear_at and phi_clear_at per calculations.spray_interval_clearances"
      - "recomputes Block.rei_clear_at, Block.phi_clear_at and Block.compliance_posture"
      - "increments Block.version by 1"
      - "auto-cancels the block's SCHEDULED work orders inside the new re-entry interval held by crews with pest_certified == false, with cancel_reason REENTRY_RESTRICTION, in scheduled_start ASC then created_at ASC order, incrementing each WorkOrder.version by 1"
      - "recomputes FarmingPlan.committed_cost, remaining_budget and budget_posture"
      - "recomputes LaborCrew.scheduled_work_order_count for each affected crew"
      - "increments SprayRecord.version by 1"

  - method: POST
    path: "/spray-records/{id}/verify"
    description: "Compliance officer countersigns an applied record. The verifier may be neither the recommender nor the applicator."
    roles: [ComplianceOfficer]
    code: 200
    input: ["verification_note?"]
    output: SprayRecord
    side_effects:
      - "sets spray_status VERIFIED and verified_by_user_id"
      - "increments SprayRecord.version by 1"

  # --- WineryDeliveryWindow -------------------------------------------------
  - method: POST
    path: "/delivery-windows"
    description: "Open a winery receiving slot with a closed time window and a tonnage capacity."
    roles: [VineyardManager]
    code: 201
    input: [winery_name, window_start, window_end, capacity_tons]
    output: WineryDeliveryWindow
    side_effects:
      - "initializes committed_tons 0.00, remaining_tons = capacity_tons and window_posture OPEN"
      - "sets version to 1"

  - method: GET
    path: "/delivery-windows/{id}"
    description: "Read one delivery window, including committed_tons, remaining_tons, window_posture and the version needed for expected_delivery_window_version."
    roles: [VineyardManager, Controller, CrewSupervisor]
    code: 200
    input: []
    output: WineryDeliveryWindow
    side_effects: []

  # --- HarvestLoad ----------------------------------------------------------
  - method: POST
    path: "/harvest-loads"
    description: "Book a picking load into a winery delivery window. expected_delivery_window_version must carry the WineryDeliveryWindow.version last observed via GET /delivery-windows/{id} (§1.2.1 harvest-load-create-stale-window)."
    roles: [VineyardManager]
    code: 201
    input: [block_id, crew_id, delivery_window_id, estimated_tons, delivery_eta, expected_delivery_window_version]
    output: HarvestLoad
    side_effects:
      - "sets load_status to PLANNED"
      - "recomputes WineryDeliveryWindow.committed_tons, remaining_tons and window_posture"
      - "increments WineryDeliveryWindow.version by 1"
      - "recomputes Block.committed_harvest_tons and remaining_estimated_tons and increments Block.version by 1"
      - "sets version to 1"

  - method: GET
    path: "/harvest-loads/{id}"
    description: "Read one harvest load, including the weigh tag, net_tons and quality_incentive_amount."
    roles: [VineyardManager, Controller, CrewSupervisor]
    code: 200
    input: []
    output: HarvestLoad
    side_effects: []

  - method: GET
    path: "/harvest-loads"
    description: "List harvest loads, filterable by block, crew, delivery window and status."
    roles: [VineyardManager, Controller, CrewSupervisor]
    code: 200
    input: ["block_id?", "crew_id?", "delivery_window_id?", "load_status?", "limit?", "offset?"]
    output: HarvestLoad[]
    side_effects: []

  - method: POST
    path: "/harvest-loads/{id}/dispatch"
    description: "Send the load to the winery. Refused while the block's pre-harvest interval is still open."
    roles: [CrewSupervisor]
    code: 200
    input: [gross_tons_at_dispatch]
    output: HarvestLoad
    side_effects:
      - "sets load_status IN_TRANSIT, gross_tons_at_dispatch and dispatched_at"
      - "leaves WineryDeliveryWindow.committed_tons unchanged"
      - "increments HarvestLoad.version by 1"

  - method: POST
    path: "/harvest-loads/{id}/receive"
    description: "Record the winery weigh tag and quality reading, crediting the block and the contract."
    roles: [VineyardManager]
    code: 200
    input: [gross_tons, tare_tons, mog_deduct_pct, brix_at_receipt]
    output: HarvestLoad
    side_effects:
      - "sets load_status RECEIVED, the four weigh-tag fields and received_at"
      - "computes net_tons and quality_incentive_amount per calculations.harvest_load_net_tons"
      - "recomputes Block.committed_harvest_tons, received_tons, remaining_estimated_tons and harvest_posture, and increments Block.version by 1"
      - "recomputes CustomFarmingContract.accrued_quality_incentive and projected_total_billable, and increments CustomFarmingContract.version by 1"
      - "recomputes WineryDeliveryWindow.committed_tons, remaining_tons and window_posture, and increments WineryDeliveryWindow.version by 1"
      - "increments HarvestLoad.version by 1"

  - method: POST
    path: "/harvest-loads/{id}/reject"
    description: "Record a winery rejection, returning the booked tonnage to both the block estimate and the window capacity."
    roles: [VineyardManager]
    code: 200
    input: [rejection_reason]
    output: HarvestLoad
    side_effects:
      - "sets load_status REJECTED, rejection_reason, rejected_at, net_tons 0.00 and quality_incentive_amount 0.00"
      - "recomputes Block.committed_harvest_tons and remaining_estimated_tons, and increments Block.version by 1"
      - "leaves CustomFarmingContract.accrued_quality_incentive unchanged"
      - "recomputes WineryDeliveryWindow.committed_tons, remaining_tons and window_posture, and increments WineryDeliveryWindow.version by 1"
      - "increments HarvestLoad.version by 1"

  # --- Test-driving endpoint ------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every re-entry-interval, pre-harvest-interval and timestamp side effect reads. The server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time."
    roles: [VineyardManager, Agronomist, Applicator, ComplianceOfficer, Controller, CrewSupervisor, ClientOwner]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects:
      - "re-evaluates Block.compliance_posture for every block on the next read"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- authentication / authorization ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing or blank, or X-User-Role is not one of the seven declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_VINEYARD_OWNERSHIP_REQUIRED
    http: 403
    condition: "a ClientOwner acts on a Vineyard or CustomFarmingContract whose vineyard_id differs from the request X-User-ID"
  - id: ERR_CREW_OWNERSHIP_REQUIRED
    http: 403
    condition: "a CrewSupervisor acts on a WorkOrder or HarvestLoad whose crew_id differs from the request X-User-ID"

  # --- request shape --------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown field, enum value outside its set, number outside its range, scheduled_end <= scheduled_start, window_end <= window_start, period_end < period_start, method-inconsistent yield-estimate fields, pay-structure/piece-rate mismatch, tare_tons >= gross_tons, mog_deduct_pct outside 0..1, or pagination limit outside 1..100 / negative offset"

  # --- existence ------------------------------------------------------------
  - id: ERR_VINEYARD_NOT_FOUND
    http: 404
    condition: "no Vineyard with the given id (path segment or vineyard_id body field)"
  - id: ERR_BLOCK_NOT_FOUND
    http: 404
    condition: "no Block with the given id (path segment, block_id or replaces_block_id body field)"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no CustomFarmingContract with the given id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "no FarmingPlan with the given id (path segment or farming_plan_id body field)"
  - id: ERR_CREW_NOT_FOUND
    http: 404
    condition: "no LaborCrew with the given id (path segment or crew_id body field)"
  - id: ERR_WORK_ORDER_NOT_FOUND
    http: 404
    condition: "no WorkOrder with the given id"
  - id: ERR_SPRAY_NOT_FOUND
    http: 404
    condition: "no SprayRecord with the given id"
  - id: ERR_IRRIGATION_EVENT_NOT_FOUND
    http: 404
    condition: "no IrrigationEvent with the given id"
  - id: ERR_DELIVERY_WINDOW_NOT_FOUND
    http: 404
    condition: "no WineryDeliveryWindow with the given id (path segment or delivery_window_id body field)"
  - id: ERR_HARVEST_LOAD_NOT_FOUND
    http: 404
    condition: "no HarvestLoad with the given id"
  - id: ERR_PEST_OBSERVATION_NOT_FOUND
    http: 404
    condition: "no PestObservation with the given pest_observation_id"

  # --- optimistic concurrency (§1.2.1) --------------------------------------
  - id: ERR_STALE_BLOCK_VERSION
    http: 412
    condition: "expected_block_version on POST /spray-records/{id}/apply does not equal the current Block.version"
  - id: ERR_STALE_DELIVERY_WINDOW_VERSION
    http: 412
    condition: "expected_delivery_window_version on POST /harvest-loads does not equal the current WineryDeliveryWindow.version"

  # --- state preconditions --------------------------------------------------
  - id: ERR_CONTRACT_NOT_DRAFT
    http: 409
    condition: "enroll-block or activate attempted on a contract whose contract_status is not DRAFT"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "settle-period attempted on a contract that is not ACTIVE, or a harvest load booked against a block whose contract is DRAFT or CLOSED"
  - id: ERR_PLAN_NOT_DRAFT
    http: 409
    condition: "submit attempted on a plan whose plan_status is not DRAFT"
  - id: ERR_PLAN_NOT_SUBMITTED
    http: 409
    condition: "approve or return-for-revision attempted on a plan whose plan_status is not SUBMITTED"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "return-for-revision attempted when revision_count has already reached MAX_REVISION_ROUNDS (2)"
  - id: ERR_PLAN_NOT_APPROVED
    http: 409
    condition: "a work order, irrigation event or spray recommendation cites a FarmingPlan whose plan_status is not APPROVED"
  - id: ERR_BLOCK_REMOVED
    http: 409
    condition: "an operation targets a Block whose farming_status is REMOVED, or replaces_block_id names an already-REMOVED block"
  - id: ERR_WORK_ORDER_NOT_SCHEDULED
    http: 409
    condition: "start attempted on a work order whose execution_status is not SCHEDULED"
  - id: ERR_WORK_ORDER_NOT_IN_PROGRESS
    http: 409
    condition: "complete attempted on a work order whose execution_status is not IN_PROGRESS"
  - id: ERR_WORK_ORDER_TERMINAL
    http: 409
    condition: "cancel attempted on a work order that is already COMPLETED or CANCELLED"
  - id: ERR_PAYROLL_STATE_INVALID
    http: 409
    condition: "payroll_action APPROVE on a work order whose payroll_status is not PENDING, or PAY on one whose payroll_status is not APPROVED"
  - id: ERR_SPRAY_NOT_RECOMMENDED
    http: 409
    condition: "apply attempted on a spray record whose spray_status is not RECOMMENDED"
  - id: ERR_SPRAY_NOT_APPLIED
    http: 409
    condition: "verify attempted on a spray record whose spray_status is not APPLIED"
  - id: ERR_IRRIGATION_NOT_SCHEDULED
    http: 409
    condition: "record-applied attempted on an irrigation event whose irrigation_status is not SCHEDULED"
  - id: ERR_LOAD_NOT_PLANNED
    http: 409
    condition: "dispatch attempted on a harvest load whose load_status is not PLANNED"
  - id: ERR_LOAD_NOT_IN_TRANSIT
    http: 409
    condition: "receive or reject attempted on a harvest load whose load_status is not IN_TRANSIT"
  - id: ERR_CREW_INACTIVE
    http: 409
    condition: "the referenced LaborCrew.crew_status is INACTIVE"

  # --- segregation of duties ------------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the acting X-User-ID already holds an incompatible role on this record: plan submitter approving it, spray recommender applying it, or spray recommender/applicator verifying it"

  # --- safety / compliance --------------------------------------------------
  - id: ERR_CREW_NOT_PEST_CERTIFIED
    http: 409
    condition: "a work order whose scheduled_start falls inside the block's open re-entry interval is booked for a crew with pest_certified false"
  - id: ERR_REENTRY_INTERVAL_ACTIVE
    http: 409
    condition: "start attempted while current_utc is earlier than Block.rei_clear_at and the crew is not pest_certified"
  - id: ERR_PREHARVEST_INTERVAL_ACTIVE
    http: 409
    condition: "a harvest load's delivery_eta is earlier than Block.phi_clear_at, or dispatch is attempted while current_utc is earlier than Block.phi_clear_at"
  - id: ERR_ACTION_THRESHOLD_NOT_MET
    http: 409
    condition: "a spray recommendation cites a PestObservation whose exceeds_threshold is false"

  # --- temporal constraints -------------------------------------------------
  - id: ERR_CREW_SCHEDULE_CONFLICT
    http: 409
    condition: "the crew's half-open [scheduled_start, scheduled_end) interval conflicts with one of its SCHEDULED or IN_PROGRESS work orders, allowing for the 60-minute travel buffer between different blocks"
  - id: ERR_DELIVERY_ETA_OUTSIDE_WINDOW
    http: 409
    condition: "delivery_eta falls outside the window's closed [window_start, window_end] interval"

  # --- referential integrity ------------------------------------------------
  - id: ERR_DUPLICATE_PLAN_FOR_BLOCK_YEAR
    http: 409
    condition: "a FarmingPlan already exists for the same (block_id, plan_year)"
  - id: ERR_DUPLICATE_BLOCK_CODE
    http: 409
    condition: "a Block already exists with the same (vineyard_id, block_code)"
  - id: ERR_PLAN_BLOCK_MISMATCH
    http: 409
    condition: "the referenced FarmingPlan.block_id differs from the request's block_id"
  - id: ERR_VINEYARD_MISMATCH
    http: 409
    condition: "a block is enrolled under a contract belonging to a different vineyard, or replaces_block_id names a block on a different vineyard"
  - id: ERR_BLOCK_ALREADY_ENROLLED
    http: 409
    condition: "the block's contract_id is already set"
  - id: ERR_NO_ENROLLED_BLOCKS
    http: 409
    condition: "activate attempted on a contract with enrolled_block_count 0"
  - id: ERR_BLOCK_NOT_ENROLLED
    http: 409
    condition: "a harvest load is booked for a block whose contract_id is null"
  - id: ERR_NO_YIELD_ESTIMATE
    http: 409
    condition: "a harvest load is booked for a block with harvest_posture NOT_ESTIMATED"
  - id: ERR_CREW_TASK_MISMATCH
    http: 409
    condition: "task_type is not in the crew's task_capabilities, or a harvest load is booked for a crew whose task_capabilities omit HARVEST"

  # --- fiscal / capacity ----------------------------------------------------
  - id: ERR_PLAN_BUDGET_EXCEEDED
    http: 409
    condition: "the new work order's estimated_labor_cost would push FarmingPlan.committed_cost above total_budget; equality is permitted"
  - id: ERR_WINDOW_CAPACITY_EXCEEDED
    http: 409
    condition: "the booking would push WineryDeliveryWindow.committed_tons above capacity_tons; equality is permitted"
  - id: ERR_HARVEST_EXCEEDS_ESTIMATE
    http: 409
    condition: "the booking would push the block's committed plus received tonnage above governing_estimate_tons * HARVEST_TOLERANCE (1.10); equality is permitted"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:

  - name: VineyardManager
    description: "Farming-company operations lead: owns the block inventory, contracts, crews, scheduling and winery logistics."
    identity: "opaque"
    exclusive_operations:
      - "POST /vineyards"
      - "POST /blocks"
      - "POST /contracts"
      - "POST /contracts/{id}/enroll-block"
      - "POST /crews"
      - "POST /work-orders"
      - "POST /work-orders/{id}/cancel"
      - "POST /delivery-windows"
      - "POST /harvest-loads"
      - "POST /harvest-loads/{id}/receive"
      - "POST /harvest-loads/{id}/reject"
    shared_operations:
      - "POST /blocks/{id}/yield-estimates (with Agronomist)"
      - "POST /farming-plans (with Agronomist)"
      - "POST /irrigation-events (with Agronomist)"
      - "POST /irrigation-events/{id}/record-applied (with CrewSupervisor)"
      - "POST /farming-plans/{id}/submit"
      - "POST /_clock/set_current_utc (with every role)"
      - "every GET endpoint declared in §1.5"

  - name: Agronomist
    description: "Viticulturist who scouts pests, writes the farming program, plans irrigation and recommends applications."
    identity: "opaque"
    exclusive_operations:
      - "POST /blocks/{id}/pest-observations"
      - "POST /spray-records"
    shared_operations:
      - "POST /farming-plans (with VineyardManager)"
      - "POST /blocks/{id}/yield-estimates (with VineyardManager)"
      - "POST /irrigation-events (with VineyardManager)"
      - "POST /_clock/set_current_utc (with every role)"
      - "GET /blocks/{id}, GET /blocks, GET /blocks/{id}/pest-observations, GET /blocks/{id}/yield-estimates, GET /farming-plans/{id}, GET /farming-plans, GET /irrigation-events/{id}, GET /irrigation-events, GET /spray-records/{id}, GET /spray-records"

  - name: Applicator
    description: "Licensed pesticide handler who performs applications in the field."
    identity: "opaque"
    exclusive_operations:
      - "POST /spray-records/{id}/apply"
    shared_operations:
      - "POST /_clock/set_current_utc (with every role)"
      - "GET /blocks/{id}, GET /blocks, GET /blocks/{id}/pest-observations, GET /spray-records/{id}, GET /spray-records"

  - name: ComplianceOfficer
    description: "Regulatory auditor who countersigns application records and monitors re-entry and pre-harvest intervals."
    identity: "opaque"
    exclusive_operations:
      - "POST /spray-records/{id}/verify"
    shared_operations:
      - "POST /_clock/set_current_utc (with every role)"
      - "GET /blocks/{id}, GET /blocks, GET /blocks/{id}/pest-observations, GET /spray-records/{id}, GET /spray-records"

  - name: Controller
    description: "Financial controller who approves farming plans, releases payroll and runs contract settlements."
    identity: "opaque"
    exclusive_operations:
      - "POST /farming-plans/{id}/approve"
      - "POST /farming-plans/{id}/return-for-revision"
      - "POST /work-orders/{id}/payroll"
      - "POST /contracts/{id}/settle-period"
    shared_operations:
      - "POST /_clock/set_current_utc (with every role)"
      - "GET /vineyards/{id}, GET /contracts/{id}, GET /contracts, GET /blocks/{id}, GET /blocks, GET /blocks/{id}/yield-estimates, GET /farming-plans/{id}, GET /farming-plans, GET /crews/{id}, GET /work-orders/{id}, GET /work-orders, GET /delivery-windows/{id}, GET /harvest-loads/{id}, GET /harvest-loads"

  - name: CrewSupervisor
    description: "Field foreman of one labor crew; starts and completes that crew's work orders and dispatches its loads."
    identity: "entity_backed:LaborCrew"
    exclusive_operations:
      - "POST /work-orders/{id}/start"
      - "POST /work-orders/{id}/complete"
      - "POST /harvest-loads/{id}/dispatch"
    shared_operations:
      - "POST /irrigation-events/{id}/record-applied (with VineyardManager)"
      - "POST /_clock/set_current_utc (with every role)"
      - "GET /blocks/{id}, GET /blocks, GET /crews/{id}, GET /work-orders/{id}, GET /work-orders, GET /irrigation-events/{id}, GET /irrigation-events, GET /delivery-windows/{id}, GET /harvest-loads/{id}, GET /harvest-loads"
    note: "X-User-ID is a LaborCrew.id. The ownership check at validations priority 52 compares it against WorkOrder.crew_id / HarvestLoad.crew_id."

  - name: ClientOwner
    description: "The ranch-owning client; countersigns the custom-farming contract and reads its own ranch and settlements."
    identity: "entity_backed:Vineyard"
    exclusive_operations:
      - "POST /contracts/{id}/activate"
    shared_operations:
      - "POST /_clock/set_current_utc (with every role)"
      - "GET /vineyards/{id}, GET /contracts/{id}, GET /contracts"
    note: "X-User-ID is a Vineyard.id. The ownership check at validations priority 50 compares it against Vineyard.id / CustomFarmingContract.vineyard_id. A ClientOwner has no access to blocks, plans, crews, work orders, sprays, irrigation events, delivery windows or harvest loads."
