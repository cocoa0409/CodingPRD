  - rule_id: resource_temporal_overlap
    instances:
      - name: census_day_single_attribution_across_transferred_units
        grounds:
          - calculations.census_day_classification
          - validations[priority=82,ERR_CENSUS_DAY_ALREADY_CLAIMED]
          - entities.CensusDay.fields.per_diem_claim_id
          - endpoints.POST_/svh/residents/{id}/transfer
          - endpoints.POST_/svh/per-diem-claims/{id}/correct
        distinguishing_aspect: |
          One resident-day is a non-shareable resource: the 31 August days split 15 to unit A and 16
          to unit B at the transfer boundary, so the two claims must total exactly 31 days
          (177855 + 189712) with no date claimed twice and none dropped. The correcting claim
          against the PAID unit-A claim must re-price at 15 days, not 31 — an implementation that
          re-scans the resident rather than the care unit produces 367567 and double-bills the
          federal program for the days already paid on unit B.
        test_recipe:
          setup:
            - "One RECOGNIZED VeteransHome with two CERTIFIED NURSING CareUnits A and B, each licensed_bed_count 2 and per_diem_rate_cents 11857."
            - "One Resident admitted 2026-08-01 into unit A with an ACTIVE NURSING CarePlan."
            - "A census run through 2026-08-15 produced 15 RESIDENT_DAY rows attributed to unit A."
            - "The resident transfers to unit B effective 2026-08-16, and a census run through 2026-08-31 produces 16 more rows attributed to unit B."
