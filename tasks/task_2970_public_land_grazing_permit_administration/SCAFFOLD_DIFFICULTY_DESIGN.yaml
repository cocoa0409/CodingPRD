              as: RangeSpecialist
              as_user_id: "u_spec_1"
              captures: { d6_id: "$.data.id" }
            - call: "POST /permit-decisions/${d6_id}/complete-environmental-review"
              payload: { nepa_findings_summary: "Environmental assessment finds no significant impact from a 20 percent reduction." }
              as: RangeSpecialist
              as_user_id: "u_spec_1"
            - call: "POST /permit-decisions/${d6_id}/finalize"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /permit-decisions/${d6_id}/appeals"
              payload: { appellant_permittee_id: "${m6_id}", stay_requested: false, statement_of_reasons: "The reduction exceeds what the monitoring record supports." }
              as: Permittee
              as_user_id: "${m6_id}"
              captures: { ap6_id: "$.data.id" }
            - call: "POST /appeal-cases/${ap6_id}/docket"
              payload: {}
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
            - call: "POST /appeal-cases/${ap6_id}/decide"
              payload: { appeal_outcome: "REMAND", decision_rationale: "Remanded for additional utilization data." }
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
            - call: "POST /permit-decisions/${d6_id}/finalize"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
            - call: "POST /appeal-cases/${ap6_id}/decide"
              payload: { appeal_outcome: "REMAND", decision_rationale: "Remanded a second time for a riparian narrative." }
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
            - call: "POST /permit-decisions/${d6_id}/finalize"
              payload: {}
              as: AuthorizedOfficer
              as_user_id: "u_officer_1"
          trigger:
            - call: "POST /appeal-cases/${ap6_id}/decide"
              payload: { appeal_outcome: "REMAND", decision_rationale: "A third remand attempt." }
              as: AppealsAdjudicator
              as_user_id: "u_judge_1"
          assert:
            - "the third REMAND returns HTTP 409 with error.error_id == ERR_APPEAL_REMAND_LIMIT_EXCEEDED"
            - "AppealCase.${ap6_id}.remand_count == 2"
            - "AppealCase.${ap6_id}.appeal_status == UNDER_REVIEW"
            - "AppealCase.${ap6_id}.adjudicator_id == u_judge_1"
            - "PermitDecision.${d6_id}.decision_status == FINAL"
            - "PermitDecision.${d6_id}.deciding_officer_id == u_officer_1"

  - rule_id: transitive_cascade
    instances:
      - name: drought_closure_five_hop_cascade
        grounds:
          - calculations.emergency_reduction_reallocation
          - calculations.use_bill_amount
          - calculations.permittee_outstanding_balance
          - state_machines.Allotment.OPEN_to_RESTRICTED
          - state_machines.GrazingBill.ISSUED_to_VOIDED
          - entities.AnnualOperatingInstruction.fields.authorized_aums_at_issue
        distinguishing_aspect: |
          Depth 5, triggered by POST /closure-orders: the order sets
          Allotment.stocking_adjustment_pct 0.3000, WHICH forces effective_capacity_aums to
          floor(1200*0.70)=840, WHICH re-authorizes the ISSUED AOI to
          floor(300*0.70)=210, WHICH supersedes the unpaid 54100-cent bill with a 36120-cent
          REVISED_USE bill, WHICH drops Permittee.outstanding_balance_cents to 36120 — each hop
          caused by the previous one, not by the closure order directly.
