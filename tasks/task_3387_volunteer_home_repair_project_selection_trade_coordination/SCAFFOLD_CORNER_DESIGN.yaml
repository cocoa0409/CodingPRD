              payload: { visit_start: "2026-10-05T08:00:00Z", visit_end: "2026-10-05T12:00:00Z" }
              as: TradePartner
              as_user_id: "${contr}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN (TradePartner is not in the schedule endpoint's roles despite owning the order)"
            - "TradeWorkOrder.${wo}.status == APPROVED"

      - name: sponsor_rep_cannot_commit_for_other_sponsor
        claim_type: RBAC Denial
        grounds:
          - roles.SponsorRep
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "SponsorRep identity is the Sponsor id: posting a commitment naming a different sponsor_id is ERR_NOT_RESOURCE_OWNER, while the matching call succeeds."
        test_recipe:
