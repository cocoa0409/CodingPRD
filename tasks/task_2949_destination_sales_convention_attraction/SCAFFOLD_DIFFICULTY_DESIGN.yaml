          assert:
            - "baseline: ${bayside_peak_baseline} == 300, ${bayside_nights_baseline} == 600, ${coverage_baseline} == 30.00"
            - "before the withdraw: ${harbor_peak_before} == 100, ${harbor_nights_before} == 200, ${coverage_before} == 40.00, ${opp_peak_before} == 400"
            - "${beta_status} == WITHDRAWN with ${beta_peak} == 0 and ${beta_nights} == 0"
            - "compensation: ${harbor_peak_after} == 0, ${harbor_nights_after} == 0, ${coverage_after} == 30.00, ${opp_peak_after} == 300 - exactly the baseline values"
