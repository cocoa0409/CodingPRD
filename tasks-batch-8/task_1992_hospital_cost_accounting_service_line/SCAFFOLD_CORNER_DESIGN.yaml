# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Hospital Cost Accounting & Service-Line Margin
# Breadth probe over §1.1–§1.7 claims not already covered by §1.8.
# Instance names are unique across BOTH design files.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section 1: Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: service_line_creation_defaults_applied
        claim_type: creation
        grounds: [entities.ServiceLine, "endpoints[POST /cost-accounting/service-lines]"]
        distinguishing_aspect: "Creating a ServiceLine returns 201 with status ACTIVE and computed rollups initialized to 0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl: $.data.id }
          trigger:
            - call: "GET /cost-accounting/service-lines/${sl}"
              payload: {}
              as: FinanceController
          assert:
            - "ServiceLine.${sl}.status == ACTIVE"
            - "ServiceLine.${sl}.total_direct_cost == 0 and total_revenue == 0 and contribution_margin == 0"

      - name: service_line_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.ServiceLine.fields.code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "ServiceLine.code is unique; a second create with the same code is rejected."
        test_recipe:
          setup: ["ServiceLine ORTHO exists"]
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
          trigger:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Ortho Duplicate", code: "ORTHO", base_direct_cost: 100.00, budgeted_volume: 10 }
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: cost_center_minutes_capacity_required_when_minutes_measure
        claim_type: required_fields
        grounds: [entities.CostCenter.fields.practical_capacity_minutes, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "capacity_measure=MINUTES without practical_capacity_minutes is rejected."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES" }
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: cost_center_computed_rate_not_stored_input
        claim_type: computed_fields
        grounds: [entities.CostCenter.fields.allocated_cost, calculations.case_costing]
        distinguishing_aspect: "Capacity rate is derived (allocated_cost / capacity), never client-settable; sending a rate field is rejected as unknown input."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000, capacity_rate: 9.99 }
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST (capacity_rate is not a declared input)"

      - name: activity_cost_line_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.ActivityCostLine]
        distinguishing_aspect: "ActivityCostLine has common_fields: false and no update endpoint; it carries id + created_at only."
        test_recipe:
          setup:
            - "Full costing setup with a DRAFT case and one activity line"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { ccp: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { ph: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { dg: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "M", service_line_id: "${sl}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${ccp}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m}/approve"
              payload: {}
              as: FinanceController
              captures: { m_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl}", physician_id: "${ph}", drg_id: "${dg}", cost_model_id: "${m}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { c: $.data.id }
            - call: "POST /cost-accounting/cases/${c}/activity-lines"
              payload: { cost_center_id: "${cc}", quantity: 100 }
              as: CostAnalyst
              captures: { line: $.data.id }
          trigger:
            - call: "GET /cost-accounting/cases/${c}/activity-lines"
              payload: {}
              as: CostAnalyst
          assert:
            - "ActivityCostLine.${line} has id and created_at but no updated_at and no version field"

      - name: case_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints[GET /cost-accounting/cases/{id}]"]
        distinguishing_aspect: "GET of a random UUID case id returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cost-accounting/cases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: case_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /cost-accounting/cases]"]
        distinguishing_aspect: "List endpoint returns pagination fields limit/offset/total_count/has_more with defaults limit=10 offset=0."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /cost-accounting/cases"
              payload: {}
              as: FinanceController
          assert:
            - "response envelope contains meta.api_request_id, response_type == 'array'"
            - "pagination block present with total_count == 0 and has_more == false"

      - name: physician_margin_report_excludes_voided_and_draft
        claim_type: computed_fields
        grounds: [calculations.physician_margin_report]
        distinguishing_aspect: "Report input set filters status IN {POSTED, LOCKED}: a VOIDED and a DRAFT case are excluded; only the POSTED case counts."
        test_recipe:
          setup:
            - "Full ORTHO setup; Case A posted (100 min, factor 1.0, rev 30000); Case B posted then voided (50 min, rev 10000); Case C left DRAFT (25 min, rev 5000)"
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { ccp: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { ph: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { dg: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "M", service_line_id: "${sl}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${ccp}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m}/approve"
              payload: {}
              as: FinanceController
              captures: { m_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl}", physician_id: "${ph}", drg_id: "${dg}", cost_model_id: "${m}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { ca: $.data.id }
            - call: "POST /cost-accounting/cases/${ca}/activity-lines"
              payload: { cost_center_id: "${cc}", quantity: 100 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${ca}/post"
              payload: { expected_model_version: "${m_v}" }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl}", physician_id: "${ph}", drg_id: "${dg}", cost_model_id: "${m}", period: "2026-08", expected_reimbursement: 10000.00 }
              as: CostAnalyst
              captures: { cb: $.data.id }
            - call: "POST /cost-accounting/cases/${cb}/activity-lines"
              payload: { cost_center_id: "${cc}", quantity: 50 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${cb}/post"
              payload: { expected_model_version: "${m_v}" }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${cb}/void"
              payload: {}
              as: CostAnalyst
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl}", physician_id: "${ph}", drg_id: "${dg}", cost_model_id: "${m}", period: "2026-08", expected_reimbursement: 5000.00 }
              as: CostAnalyst
              captures: { cc_draft: $.data.id }
            - call: "POST /cost-accounting/cases/${cc_draft}/activity-lines"
              payload: { cost_center_id: "${cc}", quantity: 25 }
              as: CostAnalyst
          trigger:
            - call: "GET /cost-accounting/reports/physician-margin"
              payload: { physician_id: "${ph}", period: "2026-08" }
              as: FinanceController
          assert:
            - "report.case_count == 1 (only the POSTED case; VOIDED and DRAFT excluded)"
            - "report.total_revenue == 30000.00"
            - "report.total_cost == 30000.00 - margin: total_cost == 16150.00 (base 9000 + activity 150.00 + overhead 7000.00)"

  # ===========================================================================
  # Section 2: State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: cost_model_approve_from_active_rejected
        claim_type: invalid_transition
        grounds: [state_machines.CostModel, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approve requires DRAFT; approving an already-ACTIVE model returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Model M approved ACTIVE"]
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { ccp: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "M", service_line_id: "${sl}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${ccp}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m}/approve"
              payload: {}
              as: FinanceController
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /cost-accounting/cost-models/${m}/approve"
              payload: {}
              as: FinanceController
              captures: { m_v: $.data.version }
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: cost_model_terminal_superseded_no_further_transition
        claim_type: terminal_state_lockdown
        grounds: [state_machines.CostModel]
        distinguishing_aspect: "A SUPERSEDED model is terminal: archiving it or approving it again fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Model M1 ACTIVE; Model M2 DRAFT with supersedes_model_id=M1; approve M2 -> M1 SUPERSEDED"]
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { ccp: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "M1", service_line_id: "${sl}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${ccp}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m1: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m1}/approve"
              payload: {}
              as: FinanceController
              captures: { m1_v: $.data.version }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "M2", service_line_id: "${sl}", allocation_basis: "TDABC", rate_factor: 1.10, overhead_cost_center_id: "${ccp}", effective_period: "2026-02", supersedes_model_id: "${m1}" }
              as: CostAnalyst
              captures: { m2: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m2}/approve"
              payload: {}
              as: FinanceController
              captures: { m2_v: $.data.version }
          trigger:
            - call: "POST /cost-accounting/cost-models/${m1}/archive"
              payload: {}
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (SUPERSEDED is terminal)"
            - "GET /cost-accounting/cost-models/${m1} still returns the model with status SUPERSEDED"

      - name: case_void_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Case, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Void requires POSTED; voiding a DRAFT case fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Case in DRAFT under an ACTIVE model"]
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Orthopedic Surgery", code: "ORTHO", base_direct_cost: 9000.00, budgeted_volume: 120 }
              as: FinanceController
              captures: { sl: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "OR Minutes", code: "ORMINS", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 12000.00, capacity_measure: "MINUTES", practical_capacity_minutes: 8000 }
              as: FinanceController
              captures: { cc: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { ccp: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000001", full_name: "Dr. One", specialty: "Orthopedics" }
              as: FinanceController
              captures: { ph: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "470", description: "Major joint", target_cost: 750.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { dg: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "M", service_line_id: "${sl}", allocation_basis: "TDABC", rate_factor: 1.00, overhead_cost_center_id: "${ccp}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m}/approve"
              payload: {}
              as: FinanceController
              captures: { m_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl}", physician_id: "${ph}", drg_id: "${dg}", cost_model_id: "${m}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { c: $.data.id }
          trigger:
            - call: "POST /cost-accounting/cases/${c}/void"
              payload: {}
              as: CostAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: case_lock_requires_fresh_model_version
        claim_type: precondition_enforcement
        grounds: [state_machines.Case.POSTED_to_LOCKED, "errors[ERR_CASE_STALE_MODEL]"]
        distinguishing_aspect: "Lock is rejected when the case's version_at_post no longer equals the current model version (a refresh apply bumped the model after posting)."
        test_recipe:
          setup:
            - "CARD RVU setup with case C posted (model v2); refresh approved+applied advancing model to v3; case C recomputed to version_at_post 3 — to exercise the stale path, lock is attempted on a case whose version_at_post lags. Construct: post case, then propose+approve+apply a SECOND refresh that does NOT touch the case's period (period filter excludes it) so version_at_post stays 2 while model.version advances to 3."
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Cardiology", code: "CARD", base_direct_cost: 10000.00, budgeted_volume: 60 }
              as: FinanceController
              captures: { sl: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Laboratory", code: "LAB", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 5000.00, capacity_measure: "RVU", total_rvu: 2.0 }
              as: FinanceController
              captures: { cc_lab: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { ccp: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000002", full_name: "Dr. Two", specialty: "Cardiology" }
              as: FinanceController
              captures: { ph: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "291", description: "Heart failure", target_cost: 30000.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { dg: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "CARD-RVU", service_line_id: "${sl}", allocation_basis: "RVU", rate_factor: 1.00, overhead_cost_center_id: "${ccp}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m}/approve"
              payload: {}
              as: FinanceController
              captures: { m_v: $.data.version }
            - call: "POST /cost-accounting/cases"
              payload: { service_line_id: "${sl}", physician_id: "${ph}", drg_id: "${dg}", cost_model_id: "${m}", period: "2026-08", expected_reimbursement: 30000.00 }
              as: CostAnalyst
              captures: { c: $.data.id }
            - call: "POST /cost-accounting/cases/${c}/activity-lines"
              payload: { cost_center_id: "${cc_lab}", quantity: 4 }
              as: CostAnalyst
            - call: "POST /cost-accounting/cases/${c}/post"
              payload: { expected_model_version: "${m_v}" }
              as: CostAnalyst
            - call: "POST /cost-accounting/cost-model-refreshes"
              payload: { model_id: "${m}", period: "2026-09", proposed_rates: [ { cost_center_id: "${cc_lab}", allocated_cost: 5100.00, total_rvu: 2.0 } ], data_quality_score: 95.0 }
              as: CostAnalyst
              captures: { r: $.data.id }
            - call: "POST /cost-accounting/cost-model-refreshes/${r}/approve"
              payload: { expected_model_version: "${m_v}" }
              as: FinanceController
            - call: "POST /cost-accounting/cost-model-refreshes/${r}/apply"
              payload: {}
              as: FinanceController
          trigger:
            - call: "POST /cost-accounting/cases/${c}/lock"
              payload: {}
              as: FinanceController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CASE_STALE_MODEL (case version_at_post 2, model.version 3; refresh period 2026-09 did not recompute the 2026-08 case)"

      - name: budget_period_lock_cascades_cases_to_locked
        claim_type: side_effect_execution
        grounds: [state_machines.BudgetPeriod.OPEN_to_LOCKED, state_machines.Case.POSTED_to_LOCKED]
        distinguishing_aspect: "Locking a BudgetPeriod cascades all POSTED cases of that period+pool to LOCKED (cascade down side effect)."
        test_recipe:
          setup: ["CARD RVU setup; case C posted 2026-08; BudgetPeriod PERIOP/2026-08 OPEN"]
          setup_api_calls:
            - call: "POST /cost-accounting/service-lines"
              payload: { name: "Cardiology", code: "CARD", base_direct_cost: 10000.00, budgeted_volume: 60 }
              as: FinanceController
              captures: { sl: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Laboratory", code: "LAB", cost_type: "INDIRECT", cost_behavior: "VARIABLE", allocated_cost: 5000.00, capacity_measure: "RVU", total_rvu: 2.0 }
              as: FinanceController
              captures: { cc_lab: $.data.id }
            - call: "POST /cost-accounting/cost-centers"
              payload: { name: "Periop", code: "PERIOP", cost_type: "OVERHEAD", cost_behavior: "FIXED", allocated_cost: 7000.00, capacity_measure: "NONE" }
              as: FinanceController
              captures: { ccp: $.data.id }
            - call: "POST /cost-accounting/physicians"
              payload: { npi: "1000000002", full_name: "Dr. Two", specialty: "Cardiology" }
              as: FinanceController
              captures: { ph: $.data.id }
            - call: "POST /cost-accounting/drgs"
              payload: { drg_code: "291", description: "Heart failure", target_cost: 30000.00, base_rate: 30000.00 }
              as: FinanceController
              captures: { dg: $.data.id }
            - call: "POST /cost-accounting/cost-models"
              payload: { name: "CARD-RVU", service_line_id: "${sl}", allocation_basis: "RVU", rate_factor: 1.00, overhead_cost_center_id: "${ccp}", effective_period: "2026-01" }
              as: CostAnalyst
              captures: { m: $.data.id }
            - call: "POST /cost-accounting/cost-models/${m}/approve"
              payload: {}
              as: FinanceController
