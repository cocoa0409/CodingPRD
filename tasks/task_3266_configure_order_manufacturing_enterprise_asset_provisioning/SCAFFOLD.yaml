scenario: |
  Configure-to-Order Manufacturing & Enterprise Asset Provisioning (Dell Technologies): online and account-team configuration with component compatibility rules and lead time visibility, build-to-order manufacturing with component allocation and order sequencing by promised ship date, enterprise account programs with locked configurations, custom images and asset tagging applied in the factory, asset reporting with serial number to purchase order mapping delivered to the customer's asset management system, drop shipment to individual employee addresses with staged deployment schedules, support entitlement tiers including next business day and onsite response with parts stocking, component shortage substitution requiring customer approval, end-of-life recycling and asset recovery programs

domain_name: cto-asset-provisioning
api_prefix: /api

# Structural DNA of this benchmark (§0.3)
complexity_profile:
  primary_archetype: graph_constraint        # component compatibility DAG drives config validation
  secondary_archetype: quota_allocation      # finite component stock reserved/committed/released
  complexity_layers:
    - optimistic_concurrency                 # OCC on Configuration.version and Component.version
    - cascading_side_effects                 # order submit -> build job -> allocation -> shortage
    - dual_variant_calculation               # provisional vs committed lead time; estimated vs final recovery credit
    - version_pinning_on_approval            # locked configuration templates pin component revisions
  entity_topology: hybrid                    # account->program->template tree + flat component/compat graph
  state_machine_shape: parallel              # Order carries build_status x ship_status; cyclic substitution loop elsewhere
  relationship_patterns:
    - one_to_many
    - many_to_many                           # Component <-> Component via CompatibilityRule junction
    - cross_aggregate                        # BuildJob references Component stock pool; Asset references OrderLine
  role_model: segregation_of_duties          # customer approves substitution; ops allocates; manager locks program configs
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CustomerAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal company name" }
      - { name: account_tier, type: enum, source: input, description: "STANDARD | PREMIER | FEDERAL — drives discount schedule" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding receivable" }
      - { name: outstanding_cents, type: integer, source: computed, default: 0, description: "Sum of order totals for orders in SUBMITTED..SHIPPED build_status, minus settled recovery credits" }
      - { name: recovery_credit_cents, type: integer, source: computed, default: 0, description: "Net recovery credit issued minus reversed, per calc recovery_credit_reconciliation" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED" }

  - name: AccountProgram
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; owning enterprise account" }
      - { name: name, type: string, source: input, description: "Program name, e.g. 'Field Engineering Fleet'" }
      - { name: locked, type: boolean, source: computed, default: false, description: "True once program is locked; locks cascade to its ConfigurationTemplates" }
      - { name: asset_tag_prefix, type: string, source: input, description: "Prefix stamped on every Asset.asset_tag produced under this program" }
      - { name: custom_image_ref, type: string, source: input, description: "Factory OS image identifier applied to program builds" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | LOCKED | RETIRED" }

  - name: ChassisModel
    parent: null
    common_fields: true
    fields:
      - { name: model_code, type: string, source: input, description: "Unique model code, e.g. 'LAT-7440', 'PWR-R760'" }
      - { name: category, type: enum, source: input, description: "LAPTOP | DESKTOP | SERVER | WORKSTATION" }
      - { name: base_price_cents, type: integer, source: input, description: "Bare chassis price before components" }
      - { name: build_duration_hours, type: integer, source: input, description: "Factory build time for one unit of this chassis" }
      - { name: status, type: enum, source: system, default: "CATALOG", description: "CATALOG | EOL" }

  - name: Component
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique component SKU" }
      - { name: kind, type: enum, source: input, description: "CPU | MEMORY | STORAGE | GPU | NIC | PSU | WIFI | DISPLAY | OS_IMAGE" }
      - { name: price_cents, type: integer, source: input, description: "Unit price" }
      - { name: lead_time_days, type: integer, source: input, description: "Supplier replenishment lead time used by lead_time_estimation" }
      - { name: stock_on_hand, type: integer, source: input, default: 0, description: "Physical units in the component pool" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Units allocated to BuildJobs in ALLOCATED or BUILDING state" }
      - { name: available_units, type: integer, source: computed, description: "= stock_on_hand - reserved_units; invariant target of allocation compensating invariant" }
      - { name: revision, type: string, source: input, description: "Hardware revision code, e.g. 'A02'; locked templates pin this" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EOL" }

  - name: CompatibilityRule
    parent: null
    common_fields: false
    fields:
      - { name: chassis_model_id, type: string, source: input, description: "FK -> ChassisModel.id; chassis scope of the rule" }
      - { name: component_id, type: string, source: input, description: "FK -> Component.id; subject component" }
      - { name: rule_type, type: enum, source: input, description: "ALLOWED | REQUIRES | EXCLUDES | MIN_QTY" }
      - { name: other_component_id, type: string, source: input, description: "FK -> Component.id; target component for REQUIRES/EXCLUDES rules; null for ALLOWED/MIN_QTY" }
      - { name: min_qty, type: integer, source: input, description: "Minimum quantity of component_id when rule_type=MIN_QTY; otherwise null" }

  - name: ConfigurationTemplate
    parent: AccountProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> AccountProgram.id; owning program" }
      - { name: name, type: string, source: input, description: "Template name, e.g. 'Standard Field Laptop'" }
      - { name: chassis_model_id, type: string, source: input, description: "FK -> ChassisModel.id; chassis this template builds on" }
      - { name: pinned_components, type: array, source: input, description: "Array of { component_id, revision, qty }; once program is locked these pin exact component revisions" }
      - { name: pinned_image_ref, type: string, source: input, description: "Custom image applied in factory; defaults to program.custom_image_ref when null" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PUBLISHED | LOCKED | RETIRED" }

  - name: Configuration
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; owning account" }
      - { name: template_id, type: string, source: input, description: "FK -> ConfigurationTemplate.id; null for ad-hoc online configs" }
      - { name: chassis_model_id, type: string, source: input, description: "FK -> ChassisModel.id" }
      - { name: component_selections, type: array, source: input, description: "Array of { component_id, qty } chosen components" }
      - { name: compatibility_ok, type: boolean, source: computed, default: false, description: "True when every CompatibilityRule for the chassis passes over component_selections" }
      - { name: lead_time_estimate_days, type: integer, source: computed, description: "Provisional lead time from calc lead_time_estimation (provisional variant)" }
      - { name: committed_lead_time_days, type: integer, source: computed, description: "Committed lead time from calc lead_time_estimation (committed variant), set on order submission" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | VALIDATED | LOCKED | SUPERSEDED" }

  - name: Order
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; purchasing account" }
      - { name: po_number, type: string, source: input, description: "Customer purchase order number; appears on asset reports" }
      - { name: build_status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | ALLOCATED | IN_PRODUCTION | BUILT | ON_HOLD | CANCELLED (parallel dimension 1)" }
      - { name: ship_status, type: enum, source: system, default: "PENDING", description: "PENDING | STAGED | PARTIALLY_SHIPPED | SHIPPED | DELIVERED (parallel dimension 2)" }
      - { name: promised_ship_date, type: datetime, source: computed, description: "From calc promised_ship_date at submission; sequencing key for build queue" }
      - { name: total_cents, type: integer, source: computed, description: "From calc order_pricing; nested rounding pinned per-line-then-sum" }
      - { name: discount_cents, type: integer, source: computed, description: "Enterprise discount portion of total per order_pricing" }
      - { name: submitted_at, type: datetime, source: system, description: "Timestamp of DRAFT->SUBMITTED; null until submitted" }

  - name: OrderLine
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; owning order" }
      - { name: configuration_id, type: string, source: input, description: "FK -> Configuration.id; the validated configuration being purchased" }
      - { name: qty, type: integer, source: input, description: "Units ordered; must be >= 1" }
      - { name: line_total_cents, type: integer, source: computed, description: "Rounded per-line price from order_pricing before order-level aggregation" }
      - { name: ship_to_mode, type: enum, source: input, description: "SINGLE_ADDRESS | DROP_SHIP_EMPLOYEES" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | FULFILLED | CANCELLED" }

  - name: BuildJob
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; owning order" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; line this job builds" }
      - { name: sequence_rank, type: integer, source: computed, description: "Build queue rank from calc build_queue_sequencing; lower builds first" }
      - { name: qty, type: integer, source: system, description: "Copied from OrderLine.qty at job creation" }
      - { name: shortage_component_id, type: string, source: system, description: "FK -> Component.id; component whose shortage blocked this job; null when none" }
      - { name: status, type: enum, source: system, default: "QUEUED", description: "QUEUED | ALLOCATED | BUILDING | COMPLETE | SHORTAGE_BLOCKED | CANCELLED" }

  - name: SubstitutionRequest
    parent: BuildJob
    common_fields: true
    fields:
      - { name: build_job_id, type: string, source: input, description: "FK -> BuildJob.id; blocked job needing substitution" }
      - { name: original_component_id, type: string, source: input, description: "FK -> Component.id; shorted component" }
      - { name: proposed_component_id, type: string, source: input, description: "FK -> Component.id; compatible replacement" }
      - { name: price_delta_cents, type: integer, source: computed, description: "= proposed.price_cents - original.price_cents; can be negative" }
      - { name: round, type: integer, source: system, default: 1, description: "Negotiation round; increments on each re-propose (cyclic loop)" }
      - { name: status, type: enum, source: system, default: "PENDING", description: "PENDING | APPROVED | REJECTED | SUPERSEDED" }

  - name: DeploymentWave
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; owning order" }
      - { name: wave_label, type: string, source: input, description: "Human label, e.g. 'Wave 1 - Austin'" }
      - { name: ship_window_start, type: datetime, source: input, description: "Half-open interval start [start, end) for this wave's drop shipments" }
      - { name: ship_window_end, type: datetime, source: input, description: "Half-open interval end (exclusive)" }
      - { name: destinations, type: array, source: input, description: "Array of { employee_ref, address, units }; per-employee drop-ship targets" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | RELEASED | SHIPPED | RECEIVED | CANCELLED" }

  - name: Asset
    parent: OrderLine
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; line this unit fulfills" }
      - { name: serial_number, type: string, source: system, description: "Factory-stamped serial, unique; key of serial->PO asset report" }
      - { name: asset_tag, type: string, source: system, description: "Program asset_tag_prefix + zero-padded sequence, e.g. 'FE-000123'" }
      - { name: image_applied_ref, type: string, source: system, description: "Custom image actually flashed in factory" }
      - { name: destination_employee_ref, type: string, source: system, description: "Employee this unit drop-shipped to; null for SINGLE_ADDRESS" }
      - { name: status, type: enum, source: system, default: "STAGED", description: "STAGED | IN_TRANSIT | DELIVERED | RECOVERY_REQUESTED | RECOVERED" }

  - name: SupportEntitlement
    parent: OrderLine
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; covered line" }
      - { name: tier, type: enum, source: input, description: "BASIC | NBD | ONSITE_4H — next business day vs onsite response" }
      - { name: coverage_start, type: datetime, source: input, description: "Closed interval start (inclusive)" }
      - { name: coverage_end, type: datetime, source: input, description: "Closed interval end (inclusive)" }
      - { name: parts_stocking_required, type: boolean, source: input, default: false, description: "When true, response SLA requires dedicated parts stock reservation" }
      - { name: reserved_part_component_id, type: string, source: input, description: "FK -> Component.id; part stocked for this entitlement when parts_stocking_required" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | EXPIRED | CANCELLED" }

  - name: AssetRecoveryRequest
    parent: CustomerAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> CustomerAccount.id; owning account" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; unit being returned" }
      - { name: program_kind, type: enum, source: input, description: "RECYCLE | RESALE_CREDIT — recycling vs asset recovery with credit" }
      - { name: estimated_credit_cents, type: integer, source: computed, description: "Provisional credit at intake (estimated variant)" }
      - { name: final_credit_cents, type: integer, source: computed, description: "Final credit after grading (final variant); null until RECEIVED" }
      - { name: status, type: enum, source: system, default: "INITIATED", description: "INITIATED | LABEL_ISSUED | RECEIVED | CREDITED | RECYCLED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Configuration
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /api/configurations/{id}/validate"
        actor: CustomerUser
        preconditions:
          - "account status == ACTIVE"
          - "every CompatibilityRule for chassis_model_id satisfied by component_selections (ALLOWED membership, REQUIRES closure, EXCLUDES absence, MIN_QTY)"
          - "no selected component has status == EOL"
        side_effects:
          - "compatibility_ok = true"
          - "recompute lead_time_estimate_days (provisional variant)"
      - from: VALIDATED
        to: LOCKED
        trigger: "POST /api/configurations/{id}/lock"
        actor: AccountManager
        preconditions:
          - "configuration.template_id != null"
          - "template's program status == LOCKED"
          - "every template pinned_components entry present in component_selections with matching revision"
        side_effects:
          - "component_selections frozen; further edits require unlock"
      - from: LOCKED
        to: DRAFT
        trigger: "POST /api/configurations/{id}/unlock"
        actor: AccountManager
        preconditions:
          - "no Order referencing this configuration exists with build_status in {SUBMITTED, ALLOCATED, IN_PRODUCTION}"
        side_effects:
          - "compatibility_ok = false (must re-validate before reuse)"
        note: "Cyclic loop LOCKED -> DRAFT -> VALIDATED -> LOCKED"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /api/configurations (create with supersedes_configuration_id)"
        actor: CustomerUser
        preconditions:
          - "old configuration not referenced by any Order with build_status not in {DRAFT, CANCELLED}"
        side_effects:
          - "new configuration created in DRAFT; increments nothing on old beyond status flip"

  - entity: Order
    initial_state: DRAFT(build)/PENDING(ship)
    terminal_states: [CANCELLED(build), DELIVERED(ship)]
    transitions:
      - from: "build DRAFT"
        to: "build SUBMITTED"
        trigger: "POST /api/orders/{id}/submit"
        actor: CustomerUser
        preconditions:
          - "expected_configuration_version OCC check passes for every line's configuration"
          - "every line's configuration status in {VALIDATED, LOCKED}"
          - "account.outstanding_cents + computed order total <= account.credit_limit_cents"
        side_effects:
          - "recompute committed lead time per configuration (committed variant) and set Order.promised_ship_date"
          - "create one BuildJob per OrderLine in QUEUED, sequence_rank assigned by build_queue_sequencing"
          - "account.outstanding_cents += total_cents"
      - from: "build SUBMITTED"
        to: "build ALLOCATED"
        trigger: "POST /api/build-jobs/{id}/allocate on every QUEUED job of the order"
        actor: FactoryOps
        preconditions:
          - "for every required component of the job's configuration: component.available_units >= required qty"
        side_effects:
          - "each component.reserved_units += required qty (which recomputes available_units)"
          - "bubble up: when all jobs ALLOCATED, order build_status -> ALLOCATED"
      - from: "build ALLOCATED"
        to: "build IN_PRODUCTION"
        trigger: "POST /api/build-jobs/{id}/start on the lowest sequence_rank ALLOCATED job"
        actor: FactoryOps
        preconditions:
          - "job.sequence_rank is the minimum among ALLOCATED jobs of the account's factory queue"
        side_effects:
          - "component.reserved_units -= consumed qty; component.stock_on_hand -= consumed qty"
          - "bubble up: order build_status -> IN_PRODUCTION on first job start"
      - from: "build IN_PRODUCTION"
        to: "build BUILT"
        trigger: "POST /api/build-jobs/{id}/complete on the last non-terminal job"
        actor: FactoryOps
        preconditions: []
        side_effects:
          - "mint Asset records (serial_number, asset_tag from program prefix, image_applied_ref) one per unit of the line"
          - "Asset rows created with status STAGED"
          - "bubble up: order build_status -> BUILT; ship_status stays PENDING"
      - from: "ship PENDING"
        to: "ship STAGED"
        trigger: "POST /api/deployment-waves/{id}/release on any wave of the order"
        actor: AccountManager
        preconditions:
          - "order build_status == BUILT"
          - "wave ship window does not overlap another non-CANCELLED wave of the same order (half-open [start,end) semantics)"
        side_effects:
          - "wave.status -> RELEASED; order ship_status -> STAGED"
      - from: "ship STAGED"
        to: "ship PARTIALLY_SHIPPED"
        trigger: "POST /api/deployment-waves/{id}/ship"
        actor: FactoryOps
        preconditions:
          - "wave.status == RELEASED"
          - "current logical clock within [ship_window_start, ship_window_end)"
        side_effects:
          - "Assets covered by wave destinations: status STAGED -> IN_TRANSIT with destination_employee_ref set"
      - from: "ship PARTIALLY_SHIPPED"
        to: "ship SHIPPED"
        trigger: "POST /api/deployment-waves/{id}/ship on the final RELEASED wave"
        actor: FactoryOps
        preconditions:
          - "no other wave of the order remains in {PLANNED, RELEASED}"
        side_effects:
          - "account.outstanding_cents unchanged (still receivable until DELIVERED)"
      - from: "ship SHIPPED"
        to: "ship DELIVERED"
        trigger: "POST /api/deployment-waves/{id}/receive on final in-flight wave"
        actor: CustomerUser
        preconditions: []
        side_effects:
          - "Assets IN_TRANSIT -> DELIVERED"
          - "account.outstanding_cents -= total_cents (receivable settled)"
      - from: "build SUBMITTED"
        to: "build ON_HOLD"
        trigger: "POST /api/substitution-requests (auto-created by shortage detection) while order has SHORTAGE_BLOCKED job"
        actor: system
        preconditions: []
        side_effects:
          - "order ship_status frozen; waves may not be released while ON_HOLD"
        note: "entered via cascade from BuildJob.SHORTAGE_BLOCKED, not direct API"
      - from: "build ON_HOLD"
        to: "build SUBMITTED"
        trigger: "system (automatic when last SHORTAGE_BLOCKED job of the order leaves SHORTAGE_BLOCKED via substitution approval)"
        actor: system
        preconditions: []
        side_effects: []
      - from: "build DRAFT"
        to: "build CANCELLED"
        trigger: "POST /api/orders/{id}/cancel"
        actor: CustomerUser
        preconditions: []
        side_effects: []
      - from: "build SUBMITTED"
        to: "build CANCELLED"
        trigger: "POST /api/orders/{id}/cancel"
        actor: CustomerUser
        preconditions:
          - "no BuildJob of the order in {ALLOCATED, BUILDING, COMPLETE}"
        side_effects:
          - "QUEUED jobs -> CANCELLED"
          - "account.outstanding_cents -= total_cents (compensates submission debit)"

  - entity: BuildJob
    initial_state: QUEUED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: QUEUED
        to: ALLOCATED
        trigger: "POST /api/build-jobs/{id}/allocate"
        actor: FactoryOps
        preconditions:
          - "order build_status == SUBMITTED"
          - "for every required component: component.available_units >= required qty (boundary: >= permits exact-fit allocation)"
        side_effects:
          - "component.reserved_units += required qty for each required component"
      - from: ALLOCATED
        to: BUILDING
        trigger: "POST /api/build-jobs/{id}/start"
        actor: FactoryOps
        preconditions:
          - "job.sequence_rank == min over ALLOCATED jobs of the same factory queue (tie-break: BuildJob.created_at ASC)"
        side_effects:
          - "component.reserved_units -= consumed qty; component.stock_on_hand -= consumed qty"
      - from: BUILDING
        to: COMPLETE
        trigger: "POST /api/build-jobs/{id}/complete"
        actor: FactoryOps
        preconditions: []
        side_effects:
          - "mint qty Asset rows under the OrderLine with serial_number, asset_tag, image_applied_ref"
      - from: QUEUED
        to: SHORTAGE_BLOCKED
        trigger: "system (automatic during allocate when any required component available_units < required qty)"
        actor: system
        preconditions: []
        side_effects:
          - "shortage_component_id set to the component with the largest shortfall (tie-break: Component.created_at ASC)"
          - "auto-create SubstitutionRequest PENDING against this job"
          - "cascade: order build_status -> ON_HOLD"
      - from: SHORTAGE_BLOCKED
        to: QUEUED
        trigger: "system (automatic when its SubstitutionRequest is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "job's effective component list swaps original for proposed"
          - "cascade: if no sibling job remains SHORTAGE_BLOCKED, order build_status -> SUBMITTED"
      - from: QUEUED
        to: CANCELLED
        trigger: "POST /api/orders/{id}/cancel (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SubstitutionRequest
    initial_state: PENDING
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /api/substitution-requests/{id}/approve"
        actor: CustomerUser
        preconditions:
          - "X-User-ID resolves to the CustomerAccount that owns the order (segregation: approver must be the customer, not FactoryOps)"
          - "proposed component status == ACTIVE and passes all CompatibilityRules of the chassis in place of the original"
        side_effects:
          - "cascade: build job SHORTAGE_BLOCKED -> QUEUED with swapped component"
          - "order.total_cents += price_delta_cents * job qty; account.outstanding_cents adjusted likewise"
        note: "when the order is no longer ON_HOLD (stale approval) the transition is rejected with ERR_INVALID_STATE; when the order is ON_HOLD but the positive price delta would push account.outstanding_cents over credit_limit_cents the approval is rejected with ERR_CREDIT_LIMIT_EXCEEDED — state (priority 4) outranks business_fiscal (priority 10)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/substitution-requests/{id}/reject"
        actor: CustomerUser
        preconditions: []
        side_effects:
          - "build job stays SHORTAGE_BLOCKED; order stays ON_HOLD"
      - from: REJECTED
        to: PENDING
        trigger: "POST /api/substitution-requests/{id}/repropose"
        actor: FactoryOps
        preconditions:
          - "new proposed_component_id differs from the rejected one"
        side_effects:
          - "round += 1; price_delta_cents recomputed"
        note: "cyclic negotiation loop PENDING -> REJECTED -> PENDING until approval"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (automatic when a newer SubstitutionRequest is created for the same build job)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeploymentWave
    initial_state: PLANNED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /api/deployment-waves/{id}/release"
        actor: AccountManager
        preconditions:
          - "order build_status == BUILT"
          - "no overlap with another wave of the same order in {PLANNED, RELEASED, SHIPPED}: half-open [start,end); adjacent waves where end == other's start do NOT overlap"
        side_effects:
          - "order ship_status PENDING -> STAGED"
      - from: RELEASED
        to: SHIPPED
        trigger: "POST /api/deployment-waves/{id}/ship"
        actor: FactoryOps
        preconditions:
          - "current logical clock within [ship_window_start, ship_window_end)"
        side_effects:
          - "covered Assets STAGED -> IN_TRANSIT"
      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /api/deployment-waves/{id}/receive"
        actor: CustomerUser
        preconditions: []
        side_effects:
          - "covered Assets IN_TRANSIT -> DELIVERED"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/deployment-waves/{id}/cancel"
        actor: AccountManager
        preconditions: []
        side_effects: []

  - entity: SupportEntitlement
    initial_state: ACTIVE
    terminal_states: [EXPIRED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when logical clock passes coverage_end, closed interval inclusive of the end instant)"
        actor: system
        preconditions: []
        side_effects:
          - "when parts_stocking_required: reserved_part component.reserved_units -= 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/support-entitlements/{id}/cancel"
        actor: AccountManager
        preconditions: []
        side_effects:
          - "when parts_stocking_required: reserved_part component.reserved_units -= 1"

  - entity: AssetRecoveryRequest
    initial_state: INITIATED
    terminal_states: [CREDITED, RECYCLED, CANCELLED]
    transitions:
      - from: INITIATED
        to: LABEL_ISSUED
        trigger: "POST /api/asset-recovery-requests/{id}/issue-label"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "estimated_credit_cents computed (estimated variant of recovery_credit_reconciliation)"
          - "asset.status DELIVERED -> RECOVERY_REQUESTED"
      - from: LABEL_ISSUED
        to: RECEIVED
        trigger: "POST /api/asset-recovery-requests/{id}/receive"
        actor: PlatformAdmin
        preconditions:
          - "asset.status == RECOVERY_REQUESTED"
        side_effects:
          - "final_credit_cents computed (final variant) from graded condition"
      - from: RECEIVED
        to: CREDITED
        trigger: "POST /api/asset-recovery-requests/{id}/credit"
        actor: PlatformAdmin
        preconditions:
          - "program_kind == RESALE_CREDIT"
        side_effects:
          - "account.recovery_credit_cents += final_credit_cents"
          - "asset.status -> RECOVERED"
      - from: RECEIVED
        to: RECYCLED
        trigger: "POST /api/asset-recovery-requests/{id}/recycle"
        actor: PlatformAdmin
        preconditions:
          - "program_kind == RECYCLE"
        side_effects:
          - "asset.status -> RECOVERED"
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /api/asset-recovery-requests/{id}/cancel"
        actor: CustomerUser
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: order-submit-stale-configuration
    parent_entity: Configuration
    write_endpoint: "POST /api/orders/{id}/submit"
    occ_field: "expected_configuration_version"
    description: |
      Submitting an Order whose referenced Configuration has advanced in version
      since the client last observed it is rejected, because an intervening edit
      (unlock + re-validate) may have changed component_selections the client
      priced against. The OCC check on Configuration.version turns the
      create-with-supersede hazard into a deterministic stale-version rejection.
    error_id: ERR_STALE_CONFIGURATION_VERSION
    http_status: 412
  - rule_id: component-restock-stale-version
    parent_entity: Component
    write_endpoint: "POST /api/components/{id}/restock"
    occ_field: "expected_component_version"
    description: |
      Restocking a Component whose version has advanced since the client read
      stock_on_hand is rejected, because an intervening allocation cycle already
      consumed units and the client's replenishment quantity was computed from a
      stale pool view.
    error_id: ERR_STALE_COMPONENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lead_time_estimation
    trigger: "provisional: on Configuration validation; committed: on Order submission"
    algorithm: forward_looking
    formula: |
      provisional_days = max over selected components of (component.lead_time_days
                           when component.available_units < selected qty, else 0)
                       + chassis.build_duration_hours / 24 (floor)
      committed_days   = same max, but uses stock_on_hand instead of available_units
                       (committed variant ignores other orders' reservations)
    input_set: "components in configuration.component_selections; chassis from configuration.chassis_model_id"
    constants:
      HOURS_PER_DAY: 24
    precision: "integer days, floor for build hours"
    variants:
      - name: provisional
        when: "configuration validation, pre-order quote"
        difference: "uses available_units (net of reservations) — pessimistic"
      - name: committed
        when: "order submission"
        difference: "uses stock_on_hand (gross) — optimistic; differs whenever other jobs hold reservations"

  - name: promised_ship_date
    trigger: "on Order submission"
    algorithm: threshold
    formula: |
      base = submitted_at + committed_lead_time_days (max over lines' configurations)
      if account_tier == FEDERAL: buffer_days = 2 elif PREMIER: 1 else: 0
      if any line qty >= QTY_BULK_THRESHOLD: buffer_days += 3
      promised_ship_date = base + buffer_days
    input_set: "order lines, their configurations' committed lead times, account tier"
    constants:
      QTY_BULK_THRESHOLD: 50
    precision: "datetime, day granularity"
    variants: []

  - name: order_pricing
    trigger: "on Order submission and on substitution approval (price delta)"
    algorithm: tiered_pricing
    formula: |
      per line: unit_price = chassis.base_price_cents + sum(component.price_cents * qty)
                line_pre_discount = unit_price * line.qty
                discount_pct = tier table on account_tier AND order line count
                line_total_cents = round_half_up(line_pre_discount * (1 - discount_pct))   # ROUND PER LINE FIRST
      order.total_cents = sum(line_total_cents)                                            # THEN SUM
      order.discount_cents = sum(line_pre_discount) - order.total_cents
    input_set: "order lines with configurations' selections, chassis prices, account tier"
    constants:
      DISCOUNT_STANDARD: 0.00
      DISCOUNT_PREMIER: 0.08
      DISCOUNT_FEDERAL: 0.12
    precision: "integer cents, round_half_up PER LINE before order sum — pinned order; sum-then-round is FORBIDDEN"
    variants: []

  - name: build_queue_sequencing
    trigger: "on Order submission (job creation) and on every job completion"
    algorithm: weighted_scoring
    formula: |
      score(job) = 0.6 * days_until(order.promised_ship_date, now)
                 + 0.3 * (1 / order_line_count_of_order)
                 + 0.1 * tier_weight(order.account_tier)     # FEDERAL=3, PREMIER=2, STANDARD=1
      sequence_rank = rank by score DESC; tie-break: job.created_at ASC
    input_set: "all BuildJobs with status in {QUEUED, ALLOCATED} across all accounts"
    constants:
      WEIGHT_PROMISE: 0.6
      WEIGHT_LINE_COUNT: 0.3
      WEIGHT_TIER: 0.1
    precision: "score kept at 4 decimal places for ranking only; rank is integer"
    variants: []

  - name: support_sla_response_hours
    trigger: "on SupportEntitlement creation and on a service-due evaluation"
    algorithm: threshold
    formula: |
      BASIC:     response_hours = 72, onsite = false
      NBD:       response_hours = 24, onsite = false   # next business day boundary: report before 17:00 local rolls to next day
      ONSITE_4H: response_hours = 4,  onsite = true    # requires parts_stocking_required = true when chassis category == SERVER
    input_set: "entitlement tier, chassis category of covered line"
    constants:
      NBD_CUTOFF_HOUR: 17
    precision: "integer hours"
    variants: []

  - name: recovery_credit_reconciliation
    trigger: "estimated: on label issuance; final: on receipt/grading; reconcile: on credit"
    algorithm: aggregation
    formula: |
      estimated = round_half_up(0.30 * asset line unit price at order time)
      final     = graded_pct * original unit price, graded_pct in {0.10 poor, 0.25 fair, 0.45 good}
      on CREDITED: account.recovery_credit_cents += final; outstanding unaffected
    input_set: "the asset's OrderLine unit price, grading outcome"
    constants:
      ESTIMATE_PCT: 0.30
      GRADE_POOR: 0.10
      GRADE_FAIR: 0.25
      GRADE_GOOD: 0.45
    precision: "integer cents, round_half_up"
    variants:
      - name: estimated
        when: "label issued, pre-grading"
        difference: "flat 30% estimate"
      - name: final
        when: "received and graded"
        difference: "grade-keyed percentage — differs from estimated whenever grade is not exactly equivalent to 30%"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted to invoke this endpoint per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path-referenced resources exist, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: state, check: "Target resource in a state from which the requested transition is defined", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 5, category: state, check: "OCC expected_*_version matches parent's current version", error_id: ERR_STALE_CONFIGURATION_VERSION, http_status: 412, applies_to: "POST /api/orders/{id}/submit" }
  - { priority: 5, category: state, check: "OCC expected_component_version matches current Component.version", error_id: ERR_STALE_COMPONENT_VERSION, http_status: 412, applies_to: "POST /api/components/{id}/restock" }
  - { priority: 5, category: state, check: "Shipment-side actions are frozen while the order is ON_HOLD with a PENDING substitution", error_id: ERR_SHORTAGE_PENDING, http_status: 409, applies_to: "POST /api/deployment-waves/{id}/release, POST /api/deployment-waves/{id}/ship" }
  - { priority: 6, category: business_constraint, check: "Configuration component_selections satisfy every CompatibilityRule (ALLOWED/REQUIRES/EXCLUDES/MIN_QTY) for the chassis", error_id: ERR_COMPATIBILITY_VIOLATION, http_status: 422, applies_to: "POST /api/configurations/{id}/validate" }
  - { priority: 7, category: business_constraint, check: "No selected component is EOL; chassis not EOL", error_id: ERR_COMPONENT_EOL, http_status: 422, applies_to: "POST /api/configurations/{id}/validate" }
  - { priority: 8, category: business_constraint, check: "Lock requires program LOCKED and template pinned revisions present in selections", error_id: ERR_PROGRAM_LOCK_VIOLATION, http_status: 422, applies_to: "POST /api/configurations/{id}/lock" }
  - { priority: 9, category: business_referential, check: "Configuration referenced by a live Order cannot be unlocked or superseded", error_id: ERR_CONFIGURATION_IN_USE, http_status: 409, applies_to: "POST /api/configurations/{id}/unlock, POST /api/configurations" }
  - { priority: 10, category: business_fiscal, check: "account.outstanding_cents + order total <= account.credit_limit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 402, applies_to: "POST /api/orders/{id}/submit, POST /api/substitution-requests/{id}/approve (positive price delta only)" }
  - { priority: 11, category: business_constraint, check: "Every required component has available_units >= required qty for allocation (boundary: >= permits exact fit)", error_id: ERR_INSUFFICIENT_COMPONENT_STOCK, http_status: 422, applies_to: "POST /api/build-jobs/{id}/allocate" }
  - { priority: 12, category: business_constraint, check: "Build start allowed only for min sequence_rank ALLOCATED job", error_id: ERR_BUILD_OUT_OF_SEQUENCE, http_status: 422, applies_to: "POST /api/build-jobs/{id}/start" }
  - { priority: 13, category: business_temporal, check: "Deployment wave window [start,end) does not overlap another live wave of the same order; adjacency (end == start) is permitted", error_id: ERR_WAVE_WINDOW_OVERLAP, http_status: 422, applies_to: "POST /api/orders/{id}/deployment-waves, POST /api/deployment-waves/{id}/release" }
  - { priority: 14, category: business_temporal, check: "Wave ship action only within [ship_window_start, ship_window_end)", error_id: ERR_OUTSIDE_SHIP_WINDOW, http_status: 422, applies_to: "POST /api/deployment-waves/{id}/ship" }
  - { priority: 15, category: business_constraint, check: "Proposed substitution component passes chassis CompatibilityRules and differs from original", error_id: ERR_SUBSTITUTION_INCOMPATIBLE, http_status: 422, applies_to: "POST /api/substitution-requests/{id}/approve, POST /api/substitution-requests/{id}/repropose" }
  - { priority: 16, category: business_safety, check: "ONSITE_4H entitlement on SERVER chassis requires parts_stocking_required = true and reserved part stock available", error_id: ERR_PARTS_STOCKING_REQUIRED, http_status: 422, applies_to: "POST /api/support-entitlements" }
  - { priority: 17, category: business_temporal, check: "Entitlement coverage window [coverage_start, coverage_end] closed interval must not duplicate an ACTIVE entitlement for the same order line and tier", error_id: ERR_ENTITLEMENT_OVERLAP, http_status: 422, applies_to: "POST /api/support-entitlements" }
  - { priority: 18, category: business_referential, check: "AssetRecoveryRequest asset must be in DELIVERED status", error_id: ERR_ASSET_NOT_RECOVERABLE, http_status: 422, applies_to: "POST /api/asset-recovery-requests" }
  - { priority: 19, category: business_constraint, check: "OrderLine qty >= 1; drop-ship destinations total units must equal line qty when ship_to_mode == DROP_SHIP_EMPLOYEES", error_id: ERR_INVALID_ORDER_QUANTITY, http_status: 422, applies_to: "POST /api/orders/{id}/lines, POST /api/orders/{id}/deployment-waves" }
  - { priority: 20, category: business_constraint, check: "Required request fields present with correct types and enum membership", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

