scaffold_difficulty_design:
  # =================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_estimate_vs_actual_on_cancel
        grounds:
          - calculations.cancellation_refund
          - calculations.per_shipment_value
          - state_machines.Subscription.lifecycle=ACTIVE_to_lifecycle=CANCELLED
        distinguishing_aspect: |
          On the Subscription/Charge domain: cancel-preview's estimate includes the SOURCING shipment
          (count of non-{DELIVERED,CANCELLED} = 4 -> 8700) while cancel's actual excludes it
          (count of {SCHEDULED,SKIPPED} = 3 -> 6525); same data, two inclusion algorithms diverge.
        test_recipe:
          setup:
            - "WEEKLY plan (base 6000); DELUXE + vase subscription -> renewal_price 8700, per_shipment_value 2175."
            - "Cycle-1 has 4 SCHEDULED shipments; charge #1 CAPTURED; shipment index 1 moved to SOURCING; none DELIVERED."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000, default_style: "ROUND" }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c1@x.com", full_name: "C One" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "DELUXE", vase_addon: true, start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/charges"
              as: BillingAdmin
              captures: { charge1_id: "$.data[0].id" }
            - call: "POST /charges/${charge1_id}/simulate-payment"
              payload: { outcome: "SUCCEEDED" }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { sh2_id: "$.data[1].id" }
            - call: "POST /shipments/${sh2_id}/source"
              payload: {}
              as: FulfillmentOps
          trigger:
            - call: "GET /subscriptions/${sub_id}/cancel-preview"
              as: Customer
              as_user_id: "${cust_id}"
              captures: { est: "$.data.estimated_refund_cents" }
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: { refund_destination: "WALLET" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /customers/${cust_id}"
              as: PlatformAdmin
              captures: { wallet: "$.data.wallet_credit_cents" }
          assert:
            - "cancel-preview estimated_refund_cents == 8700 (4 shipments not DELIVERED/CANCELLED x 2175)"
            - "Customer.${cust_id}.wallet_credit_cents == 6525 (actual: 3 {SCHEDULED} shipments x 2175)"
            - "estimate 8700 != actual 6525 — the SOURCING shipment is refundable in estimate but forfeit in actual"

      - name: stem_reserved_vs_committed_valuation
        grounds:
          - calculations.stem_valuation
          - entities.StemAllocation.fields.reserved_value_cents
          - entities.StemAllocation.fields.committed_value_cents
          - state_machines.StemAllocation.RESERVED_to_COMMITTED
        distinguishing_aspect: |
          On the StemAllocation/StemLot domain (distinct from cancellation_refund's Subscription domain):
          reserved_value_cents is fixed at reserve-time age 0 (=1000) while committed_value_cents re-evaluates
          shrinkage at commit-time age 48h (0.15) -> 850; same allocation, two valuation algorithms diverge.
        test_recipe:
          setup:
            - "Lot L (unit_cost 50, shelf_life 96h) sourced 2026-03-04T00:00:00Z; usable_until 2026-03-08T00:00:00Z."
            - "Shipment sh1 SOURCING with a 20-stem RESERVED allocation created at clock 2026-03-04 (age 0)."
            - "Clock advanced to 2026-03-06 (age 48h) before commit."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c2@x.com", full_name: "C Two" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { sh1_id: "$.data[0].id" }
            - call: "POST /stem-lots"
              payload: { variety: "ROSE", grade: "A", quantity_total: 100, unit_cost_cents: 50, sourced_at: "2026-03-04T00:00:00Z", shelf_life_hours: 96 }
              as: FulfillmentOps
              captures: { lot_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${sh1_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/allocations"
              payload: { lot_id: "${lot_id}", quantity_reserved: 20, hold_start: "2026-03-04T08:00:00Z", hold_end: "2026-03-04T10:00:00Z" }
              as: FulfillmentOps
              captures: { alloc_id: "$.data.id", rv: "$.data.reserved_value_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-06T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /shipments/${sh1_id}/confirm-sourced"
              payload: { substitution_applied: false }
              as: FulfillmentOps
            - call: "GET /shipments/${sh1_id}/allocations"
              as: FulfillmentOps
              captures: { cv: "$.data[0].committed_value_cents", st: "$.data[0].status" }
          assert:
            - "StemAllocation.${alloc_id}.reserved_value_cents == 1000 (20 x 50, shrinkage 0 at age 0)"
            - "StemAllocation.${alloc_id}.committed_value_cents == 850 (20 x 50 x 0.85, shrinkage 0.15 at age 48h)"
            - "reserved 1000 != committed 850 — valuation variant selected by allocation state"

  # =================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: renewal_price_floor_and_cap_nonlinear
        grounds:
          - calculations.renewal_price
          - entities.Subscription.fields.renewal_price_cents
          - entities.Plan.fields.base_fee_cents
        distinguishing_aspect: |
          Mode (a): renewal_price = max(gross - min(round(gross*disc), 1000), 2000) has >=3 inputs
          (base, size upcharge, vase upcharge, discount) with nested min/max; with gross=1500, disc=0 the
          max() floor dominates and returns 2000, not the raw 1500.
        test_recipe:
          setup:
            - "MONTHLY plan base 1500; PETITE, no vase, no discount -> gross 1500 below MIN_PRICE_CENTS 2000."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Mini Monthly", cadence: "MONTHLY", base_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c3@x.com", full_name: "C Three" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "PETITE", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id", price: "$.data.renewal_price_cents" }
          assert:
            - "Subscription.${sub_id}.renewal_price_cents == 2000 (gross 1500 floored up by max() to MIN_PRICE_CENTS)"

      - name: shipment_stem_cost_line_then_sum_rounding
        grounds:
          - calculations.shipment_stem_cost
          - entities.Shipment.fields.stem_cost_cents
          - state_machines.Shipment.SOURCING_to_SOURCED
        distinguishing_aspect: |
          Mode (b): two committed allocation lines each valued 100 -> round_half_up(100*1.375)=138 each;
          per-line-then-sum = 276, whereas sum-then-round = round_half_up(200*1.375)=275; the per-line order is pinned.
        test_recipe:
          setup:
            - "Lot L (unit_cost 25) fresh; shipment sh1 SOURCING with two RESERVED allocations of 4 stems each (line value 100)."
            - "Clock 2026-03-04T12:00:00Z (age 12h < 24 -> shrinkage 0, committed_value 100 each)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c4@x.com", full_name: "C Four" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { sh1_id: "$.data[0].id" }
            - call: "POST /stem-lots"
              payload: { variety: "ROSE", grade: "A", quantity_total: 200, unit_cost_cents: 25, sourced_at: "2026-03-04T00:00:00Z", shelf_life_hours: 240 }
              as: FulfillmentOps
              captures: { lot_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${sh1_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/allocations"
              payload: { lot_id: "${lot_id}", quantity_reserved: 4, hold_start: "2026-03-04T13:00:00Z", hold_end: "2026-03-04T14:00:00Z" }
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/allocations"
              payload: { lot_id: "${lot_id}", quantity_reserved: 4, hold_start: "2026-03-04T15:00:00Z", hold_end: "2026-03-04T16:00:00Z" }
              as: FulfillmentOps
          trigger:
            - call: "POST /shipments/${sh1_id}/confirm-sourced"
              payload: { substitution_applied: false }
              as: FulfillmentOps
              captures: { cost: "$.data.stem_cost_cents" }
          assert:
            - "Shipment.${sh1_id}.stem_cost_cents == 276 (round(137.5)+round(137.5)); NOT 275 (round(275.0))"

  # =================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: subscription_parallel_lifecycle_and_billing_axes
        grounds:
          - state_machines.Subscription.lifecycle=ACTIVE_to_lifecycle=PAUSED
          - state_machines.Subscription.billing=CURRENT_to_billing=PAST_DUE
          - entities.Subscription.fields.lifecycle_status
          - entities.Subscription.fields.billing_status
        distinguishing_aspect: |
          Parallel dimensions on ONE Subscription row: pause moves the lifecycle axis to PAUSED while a failed
          payment independently moves the billing axis to PAST_DUE; the two axes hold values set by different triggers.
        test_recipe:
          setup:
            - "ACTIVE/CURRENT subscription with a PENDING cycle-1 charge."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c5@x.com", full_name: "C Five" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/charges"
              as: BillingAdmin
              captures: { charge1_id: "$.data[0].id" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/pause"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /charges/${charge1_id}/simulate-payment"
              payload: { outcome: "FAILED" }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              as: PlatformAdmin
              captures: { lc: "$.data.lifecycle_status", bs: "$.data.billing_status" }
          assert:
            - "Subscription.${sub_id}.lifecycle_status == PAUSED (set by pause, unaffected by payment failure)"
            - "Subscription.${sub_id}.billing_status == PAST_DUE (set by payment failure, unaffected by pause)"

      - name: shipment_branch_sourced_vs_substituted
        grounds:
          - state_machines.Shipment.SOURCING_to_SOURCED
          - state_machines.Shipment.SOURCING_to_SUBSTITUTED
          - entities.Shipment.fields.substitution_applied
        distinguishing_aspect: |
          Branching fork from SOURCING: one shipment takes SOURCED (substitution_applied stays false) and a
          sibling takes SUBSTITUTED (substitution_applied set true) — divergent to-state and side effect from the same from-state.
        test_recipe:
          setup:
            - "Two cycle-1 shipments in SOURCING; a SubstitutionRule ROSE->TULIP allowed exists."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c6@x.com", full_name: "C Six" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { sh0_id: "$.data[0].id", sh1_id: "$.data[1].id" }
            - call: "POST /substitution-rules"
              payload: { from_variety: "ROSE", to_variety: "TULIP", allowed: true }
              as: PlatformAdmin
            - call: "POST /shipments/${sh0_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/source"
              payload: {}
              as: FulfillmentOps
          trigger:
            - call: "POST /shipments/${sh0_id}/confirm-sourced"
              payload: { substitution_applied: false }
              as: FulfillmentOps
              captures: { s0: "$.data.status", sub0: "$.data.substitution_applied" }
            - call: "POST /shipments/${sh1_id}/confirm-sourced"
              payload: { substitution_applied: true, from_variety: "ROSE", to_variety: "TULIP" }
              as: FulfillmentOps
              captures: { s1: "$.data.status", sub1: "$.data.substitution_applied" }
          assert:
            - "Shipment.${sh0_id}.status == SOURCED and substitution_applied == false (BRANCH A)"
            - "Shipment.${sh1_id}.status == SUBSTITUTED and substitution_applied == true (BRANCH B)"

  # =================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cancel_subscription_cascade_to_lot_depth3
        grounds:
          - state_machines.Subscription.lifecycle=ACTIVE_to_lifecycle=CANCELLED
          - state_machines.Shipment.SCHEDULED_to_CANCELLED
          - state_machines.StemAllocation.RESERVED_to_RELEASED
          - calculations.stem_availability
        distinguishing_aspect: |
          Depth-3 chain from a Subscription cancel: cancel -> Shipment CANCELLED -> StemAllocation RELEASED ->
          StemLot.quantity_available restored; each hop is caused by the previous, not by the original action.
        test_recipe:
          setup:
            - "Subscription with shipment sh1 in SOURCING holding a 24-stem RESERVED allocation from lot L (total 100, available 76)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c7@x.com", full_name: "C Seven" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { sh1_id: "$.data[0].id" }
            - call: "POST /stem-lots"
              payload: { variety: "ROSE", grade: "A", quantity_total: 100, unit_cost_cents: 40, sourced_at: "2026-03-04T00:00:00Z", shelf_life_hours: 240 }
              as: FulfillmentOps
              captures: { lot_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-04T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /shipments/${sh1_id}/source"
              payload: {}
              as: FulfillmentOps
            - call: "POST /shipments/${sh1_id}/allocations"
              payload: { lot_id: "${lot_id}", quantity_reserved: 24, hold_start: "2026-03-04T13:00:00Z", hold_end: "2026-03-04T14:00:00Z" }
              as: FulfillmentOps
              captures: { alloc_id: "$.data.id" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: { refund_destination: "WALLET" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /shipments/${sh1_id}"
              as: FulfillmentOps
              captures: { sh_status: "$.data.status" }
            - call: "GET /shipments/${sh1_id}/allocations"
              as: FulfillmentOps
              captures: { alloc_status: "$.data[0].status" }
            - call: "GET /stem-lots/${lot_id}"
              as: FulfillmentOps
              captures: { avail: "$.data.quantity_available" }
          assert:
            - "Subscription.${sub_id}.lifecycle_status == CANCELLED"
            - "Shipment.${sh1_id}.status == CANCELLED (hop 1)"
            - "StemAllocation.${alloc_id}.status == RELEASED (hop 2)"
            - "StemLot.${lot_id}.quantity_available == 100 (hop 3: restored to quantity_total)"

      - name: payment_fail_cascade_to_scheduled_shipments_depth2
        grounds:
          - state_machines.Charge.PENDING_to_FAILED
          - state_machines.Subscription.billing=CURRENT_to_billing=PAST_DUE
          - state_machines.Shipment.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (payment FAILED): Charge FAILED -> Subscription.billing_status
          PAST_DUE -> current-cycle SCHEDULED shipments CANCELLED; propagation runs charge->subscription->shipment.
        test_recipe:
          setup:
            - "ACTIVE subscription with 4 SCHEDULED cycle-1 shipments and a PENDING renewal charge."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c8@x.com", full_name: "C Eight" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/charges"
              as: BillingAdmin
              captures: { charge1_id: "$.data[0].id" }
          trigger:
            - call: "POST /charges/${charge1_id}/simulate-payment"
              payload: { outcome: "FAILED" }
              as: BillingAdmin
            - call: "GET /subscriptions/${sub_id}"
              as: BillingAdmin
              captures: { bs: "$.data.billing_status" }
            - call: "GET /subscriptions/${sub_id}/shipments"
              as: PlatformAdmin
              captures: { st0: "$.data[0].status" }
          assert:
            - "Charge.${charge1_id}.status == FAILED"
            - "Subscription.${sub_id}.billing_status == PAST_DUE (hop 1)"
            - "Shipment[0] of the subscription has status == CANCELLED (hop 2: SCHEDULED shipments auto-cancelled)"

  # =================================================================
  # Rule 5 — validation priority conflicts across different pairs
  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: change_state_beats_fiscal
        grounds:
          - validations[priority=40]
          - validations[priority=65]
          - state_machines.Subscription.lifecycle=ACTIVE_to_lifecycle=CANCELLED
        distinguishing_aspect: |
          Category pair {state(40), business_fiscal(65)}: changing a subscription that is BOTH CANCELLED
          (state) and PAST_DUE (fiscal) returns ERR_INVALID_STATE, because state precedes fiscal.
        test_recipe:
          setup:
            - "Subscription made PAST_DUE (payment failed) then CANCELLED; so lifecycle=CANCELLED AND billing=PAST_DUE."
          setup_api_calls:
            - call: "POST /plans"
              payload: { name: "Weekly Classic", cadence: "WEEKLY", base_fee_cents: 6000 }
              as: PlatformAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /customers"
              payload: { email: "c9@x.com", full_name: "C Nine" }
              as: PlatformAdmin
              captures: { cust_id: "$.data.id" }
            - call: "POST /subscriptions"
              payload: { customer_id: "${cust_id}", plan_id: "${plan_id}", size: "ORIGINAL", start_date: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { sub_id: "$.data.id" }
            - call: "GET /subscriptions/${sub_id}/charges"
              as: BillingAdmin
              captures: { charge1_id: "$.data[0].id" }
            - call: "POST /charges/${charge1_id}/simulate-payment"
              payload: { outcome: "FAILED" }
              as: BillingAdmin
            - call: "POST /subscriptions/${sub_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /subscriptions/${sub_id}"
              as: PlatformAdmin
              captures: { sub_v: "$.data.version" }
          trigger:
            - call: "POST /subscriptions/${sub_id}/change"
              payload: { size: "DELUXE", expected_subscription_version: "${sub_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "change returns error_id == ERR_INVALID_STATE (state priority 40 beats business_fiscal ERR_BILLING_PAST_DUE priority 65)"

      - name: skip_referential_beats_temporal
        grounds:
          - validations[priority=50]
          - validations[priority=55]
          - errors[ERR_NOT_OWNER]
          - errors[ERR_SKIP_WINDOW_CLOSED]
        distinguishing_aspect: |
          Category pair {business_referential(50), business_temporal(55)}: a non-owner skipping a shipment
          that is also past its skip cutoff returns ERR_NOT_OWNER, because ownership precedes the time window.
        test_recipe:
          setup:
