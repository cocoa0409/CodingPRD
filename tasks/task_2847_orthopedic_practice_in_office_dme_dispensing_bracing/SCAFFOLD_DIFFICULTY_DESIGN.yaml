            - "${s1_received} == 10 and ${s1_on_hand} == 10 and ${s1_reserved} == 2 and ${s1_dispensed} == 0 and ${s1_restocked} == 0"
            - "${s1_accounted} == 10 == ${s1_received} (reserving does not move on_hand_qty, so reserved units are not a second addend)"
            - "${s2_reserved} == 0 and ${s2_on_hand} == 10 and ${s2_dispensed} == 0"
