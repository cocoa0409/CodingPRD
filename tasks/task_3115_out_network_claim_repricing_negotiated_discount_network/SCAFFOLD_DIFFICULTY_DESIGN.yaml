            - "FeeInvoice.${fi1_id}.gross_fee_cents == 5000 (claim S savings 32000 -> raw 7400 capped at 5000)"
            - "FeeInvoice.${fi2_id} voided: status == VOIDED"
            - "FeeInvoice.${fi1_id}.aggregate_fee_cents == 5000 after FI2 void (back to the FI1-only value; conserved over the issue/void pair)"
            - "Claim T fee was 1250 (savings 5000 x 0.25) while FI2 was issued — verified via FI2.gross_fee_cents == 1250 before void"

      - name: settlement_void_preserves_current_offer_quantity
        grounds:
          - state_machines.SettlementAgreement.PENDING_SIGNATURES_to_VOIDED
          - state_machines.NegotiationCase
          - entities.NegotiationCase.fields.current_offer_cents
        distinguishing_aspect: |
          Different conserved quantity: the negotiation case's offer ledger
          (current_offer_cents and round_count) must be invariant across the
          accept + void-before-signature compensation pair — the case returns to
          COUNTERED with current_offer_cents == 50000 and round_count == 1,
          bit-identical to its pre-accept values.
        test_recipe:
          setup:
            - "Claim U PRICED (33000 fixture). Case: offer 30000, counter 50000 (round_count 1, current 50000, COUNTERED), payer accepts (ACCEPTED, settlement created)."
          setup_api_calls:
            - call: "POST /payer-clients"
              payload: { payer_name: "P1", fee_percent: 0.25, fee_cap_cents_per_claim: 5000 }
              as: OpsAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /providers"
              payload: { npi: "1000000018", legal_name: "PR1", tin: "T1" }
              as: NetworkAdmin
              captures: { pr1_id: $.data.id }
            - call: "POST /medicare-fee-schedule"
              payload: { procedure_code: "99283", region_code: "R1", base_rate_cents: 10000, geographic_adjustment_factor: 1.10, effective_year: 2026 }
              as: NetworkAdmin
            - call: "POST /repricing-policies"
              payload: { payer_client_id: "${p1_id}", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", methodology: "PERCENT_OF_MEDICARE", percent_of_medicare: 1.50, priority: 1 }
              as: PayerAdmin
              as_user_id: "${p1_id}"
            - call: "POST /claims"
              payload: { payer_client_id: "${p1_id}", provider_id: "${pr1_id}", external_claim_ref: "U1", claim_type: "PROFESSIONAL", network_status: "OUT_OF_NETWORK", service_date: "2026-09-10T00:00:00Z", patient_responsibility_cents: 0 }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_u_id: $.data.id, claim_u_v: $.data.version }
            - call: "POST /claims/${claim_u_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /claims/${claim_u_id}/reprice"
              payload: { expected_claim_version: "${claim_u_v} + 1" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases"
              payload: { claim_id: "${claim_u_id}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { case_u_id: $.data.id, case_u_v: $.data.version }
            - call: "POST /negotiation-cases/${case_u_id}/offer"
              payload: { offer_cents: 30000, expected_case_version: "${case_u_v}" }
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "POST /negotiation-cases/${case_u_id}/counter"
              payload: { counter_cents: 50000 }
              as: ProviderRep
              as_user_id: "${pr1_id}"
            - call: "POST /negotiation-cases/${case_u_id}/accept"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "GET /settlement-agreements"
              payload: { negotiation_case_id: "${case_u_id}" }
              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { sa_u_id: "$.data[0].id" }
          trigger:
            - call: "POST /settlement-agreements/${sa_u_id}/void"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
            - call: "GET /negotiation-cases/${case_u_id}"
              payload: {}
              as: PayerRep
              as_user_id: "${p1_id}"
          assert:
            - "NegotiationCase.${case_u_id}.status == COUNTERED"
            - "NegotiationCase.${case_u_id}.current_offer_cents == 50000 (invariant preserved across accept+void)"
            - "NegotiationCase.${case_u_id}.round_count == 1 (invariant preserved)"
            - "Claim.${claim_u_id}.status remains PRICED (no settle cascade fired)"
