# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index) - task 1202
# Canonical fixture: program PAP-LYMX (cap 900000, 100 units/enrollment,
# 30 units/shipment, duration 90d, screening validity 90d, appeal window 30d,
# renewal window 30d, lot buffer 30d, patient-direct allowed), budget period
# 2026-01-01..2026-12-31 allocated 1000000 unless an instance says otherwise.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: utilization_dual_basis_posture_divergence
        grounds:
          - calculations.program_utilization_and_posture
          - entities.AssistanceProgram.fields.posture
          - endpoints."GET /pap/programs/{id}/utilization"
        distinguishing_aspect: |
          Same program data yields two divergent utilizations: the forward-looking
          committed basis reads 90.00 (driving posture RESTRICTED) while the
          chronological disbursed basis reads 0.00 - budget-domain dual variant.
        test_recipe:
          setup:
            - "Clock at 2026-05-01; program with max_annual_benefit_cents 900000, unit cost '100.0000', 100 units/enrollment; budget period allocated 1000000"
            - "One patient fully verified and approved; enrollment cap 900000 committed; no shipments yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /pap/programs"
              payload: { name: "PAP-LYMX", product_name: "Lymxtra 100mg", unit_cost_per_unit: "100.0000", max_units_per_enrollment: 100, max_units_per_shipment: 30, max_annual_benefit_cents: 900000, enrollment_duration_days: 90, screening_validity_days: 90, appeal_window_days: 30, renewal_window_days: 30, lot_expiry_buffer_days: 30, allow_patient_direct_shipment: true }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /pap/budget-periods"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-12-31", allocated_cents: 1000000 }
              as: ProgramAdministrator
            - call: "POST /pap/patients"
              payload: { full_name: "Ann Arbor", date_of_birth: "1980-04-12", state_code: "OH" }
              as: CaseWorker
              captures: { pat_id: $.data.id }
            - call: "POST /pap/screenings"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", household_size: 1, income_basis: "PRIOR_YEAR", prior_year_income_cents: 3000000, insurance_status: "UNINSURED" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "PROOF_OF_INCOME", file_reference: "s3://docs/poi1.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { doc1: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "IDENTITY", file_reference: "s3://docs/id1.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { doc2: $.data.id }
            - call: "POST /pap/documents/${doc1}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/documents/${doc2}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/screenings/${scr_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /pap/screenings/${scr_id}/decision"
              payload: { decision: "VERIFIED" }
              as: CaseWorker
            - call: "POST /pap/applications"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", screening_id: "${scr_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { app_id: $.data.id }
            - call: "POST /pap/applications/${app_id}/claim"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /pap/applications/${app_id}/decision"
              payload: { decision: "APPROVED" }
              as: CaseWorker
              as_user_id: "cw_1"
              captures: { enr_id: $.data.enrollment_id }
          trigger:
            - call: "GET /pap/programs/${prog_id}/utilization"
              payload: {}
              as: ProgramAdministrator
              captures: { committed_pct: $.data.utilization_committed_basis_pct, disbursed_pct: $.data.utilization_disbursed_basis_pct, posture: $.data.posture }
          assert:
            - "utilization_committed_basis_pct == '90.00' (committed 900000 + disbursed 0 over allocated 1000000)"
            - "utilization_disbursed_basis_pct == '0.00' (no deliveries yet - same data, divergent variant)"
            - "posture == 'RESTRICTED' derived from the committed basis only"
            - "Enrollment.${enr_id}.benefit_cap_cents == 900000"

      - name: income_basis_variant_divergence
        grounds:
          - calculations.annualized_household_income
          - calculations.fpl_percent_and_eligibility
          - entities.EligibilityScreening.fields.income_basis
        distinguishing_aspect: |
          Same patient, same household: YTD_ANNUALIZED (2000000 cents over 4 months
          -> 6000000 annualized -> fpl 383.39 -> ELIGIBLE) diverges from PRIOR_YEAR
          (6300000 -> fpl 402.56 -> INELIGIBLE) - patient/screening-domain dual
          variant, distinct from the budget-domain utilization variant.
        test_recipe:
          setup:
            - "Clock at 2026-05-01; program + budget period created"
            - "Patient has TWO screenings for the same program: scr_ytd (basis YTD_ANNUALIZED) and scr_py (basis PRIOR_YEAR), both with accepted documents and SUBMITTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /pap/programs"
              payload: { name: "PAP-LYMX", product_name: "Lymxtra 100mg", unit_cost_per_unit: "100.0000", max_units_per_enrollment: 100, max_units_per_shipment: 30, max_annual_benefit_cents: 900000, enrollment_duration_days: 90, screening_validity_days: 90, appeal_window_days: 30, renewal_window_days: 30, lot_expiry_buffer_days: 30, allow_patient_direct_shipment: true }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /pap/budget-periods"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-12-31", allocated_cents: 1000000 }
              as: ProgramAdministrator
            - call: "POST /pap/patients"
              payload: { full_name: "Bob Bauer", date_of_birth: "1975-11-02", state_code: "MI" }
              as: CaseWorker
              captures: { pat_id: $.data.id }
            - call: "POST /pap/screenings"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", household_size: 1, income_basis: "YTD_ANNUALIZED", ytd_income_cents: 2000000, ytd_months_elapsed: 4, insurance_status: "UNINSURED" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { scr_ytd: $.data.id, fpl_ytd: $.data.fpl_percent, ann_ytd: $.data.annualized_income_cents }
            - call: "POST /pap/screenings"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", household_size: 1, income_basis: "PRIOR_YEAR", prior_year_income_cents: 6300000, insurance_status: "UNINSURED" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { scr_py: $.data.id, fpl_py: $.data.fpl_percent }
            - call: "POST /pap/screenings/${scr_ytd}/documents"
              payload: { doc_type: "PROOF_OF_INCOME", file_reference: "s3://docs/poi-ytd.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { d1y: $.data.id }
            - call: "POST /pap/screenings/${scr_ytd}/documents"
              payload: { doc_type: "IDENTITY", file_reference: "s3://docs/id-ytd.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { d2y: $.data.id }
            - call: "POST /pap/documents/${d1y}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/documents/${d2y}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/screenings/${scr_ytd}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /pap/screenings/${scr_py}/documents"
              payload: { doc_type: "PROOF_OF_INCOME", file_reference: "s3://docs/poi-py.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { d1p: $.data.id }
            - call: "POST /pap/screenings/${scr_py}/documents"
              payload: { doc_type: "IDENTITY", file_reference: "s3://docs/id-py.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { d2p: $.data.id }
            - call: "POST /pap/documents/${d1p}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/documents/${d2p}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/screenings/${scr_py}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
          trigger:
            - call: "POST /pap/screenings/${scr_ytd}/decision"
              payload: { decision: "VERIFIED" }
              as: CaseWorker
              captures: { st_ytd: $.data.status }
            - call: "POST /pap/screenings/${scr_py}/decision"
              payload: { decision: "VERIFIED" }
              as: CaseWorker
              captures: { py_err: $.data.error_id }
          assert:
            - "EligibilityScreening.${scr_ytd}.annualized_income_cents == 6000000 (2000000/4*12)"
            - "EligibilityScreening.${scr_ytd}.fpl_percent == '383.39'"
            - "scr_ytd verification succeeds: status == VERIFIED (383.39 <= 400.00)"
            - "EligibilityScreening.${scr_py}.fpl_percent == '402.56'"
            - "scr_py verification rejected: error_id == ERR_PATIENT_INELIGIBLE (402.56 > 400.00) - same patient, opposite outcome purely from the income-basis variant"

  # ---------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: benefit_cap_nested_min_conditional
        grounds:
          - calculations.enrollment_benefit_cap_cents
          - entities.Enrollment.fields.benefit_cap_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction - nested
          min(annual cap, units x unit cost) then a conditional underinsured
          scaling: min(900000, 100*10000) * (1 - 0.60) = 360000 for an
          UNDERINSURED household of 4.
        test_recipe:
          setup:
            - "Clock 2026-05-01; program (annual cap 900000, unit '100.0000', 100 units) + budget period 1000000"
            - "Patient UNDERINSURED household_size 4, prior_year income 8000000 (fpl 248.83 <= 500.00 -> ELIGIBLE), insurance_coverage_pct '0.60'; docs incl. INSURANCE_VERIFICATION accepted; application claimed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /pap/programs"
              payload: { name: "PAP-LYMX", product_name: "Lymxtra 100mg", unit_cost_per_unit: "100.0000", max_units_per_enrollment: 100, max_units_per_shipment: 30, max_annual_benefit_cents: 900000, enrollment_duration_days: 90, screening_validity_days: 90, appeal_window_days: 30, renewal_window_days: 30, lot_expiry_buffer_days: 30, allow_patient_direct_shipment: true }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /pap/budget-periods"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-12-31", allocated_cents: 1000000 }
              as: ProgramAdministrator
            - call: "POST /pap/patients"
              payload: { full_name: "Cara Chen", date_of_birth: "1990-01-30", state_code: "WA" }
              as: CaseWorker
              captures: { pat_id: $.data.id }
            - call: "POST /pap/screenings"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", household_size: 4, income_basis: "PRIOR_YEAR", prior_year_income_cents: 8000000, insurance_status: "UNDERINSURED", insurance_coverage_pct: "0.60" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { scr_id: $.data.id, fpl: $.data.fpl_percent }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "PROOF_OF_INCOME", file_reference: "s3://docs/poi-c.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { dc1: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "IDENTITY", file_reference: "s3://docs/id-c.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { dc2: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "INSURANCE_VERIFICATION", file_reference: "s3://docs/ins-c.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { dc3: $.data.id }
            - call: "POST /pap/documents/${dc1}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/documents/${dc2}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/documents/${dc3}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/screenings/${scr_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /pap/screenings/${scr_id}/decision"
              payload: { decision: "VERIFIED" }
              as: CaseWorker
            - call: "POST /pap/applications"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", screening_id: "${scr_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { app_id: $.data.id }
            - call: "POST /pap/applications/${app_id}/claim"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
          trigger:
            - call: "POST /pap/applications/${app_id}/decision"
              payload: { decision: "APPROVED" }
              as: CaseWorker
              as_user_id: "cw_1"
              captures: { enr_id: $.data.enrollment_id }
            - call: "GET /pap/enrollments/${enr_id}"
              payload: {}
              as: CaseWorker
              captures: { cap: $.data.benefit_cap_cents }
          assert:
            - "EligibilityScreening.${scr_id}.fpl_percent == '248.83'"
            - "EligibilityScreening.${scr_id}.fpl_limit_cents == 3215000 (1565000 + 3*550000)"
            - "Enrollment.${enr_id}.benefit_cap_cents == 360000 (min(900000, 1000000) * (1 - 0.60))"

      - name: per_event_vs_per_line_rounding_order
        grounds:
          - calculations.shipment_value_cents
          - calculations.dispense_event_value_cents
          - entities.Shipment.fields.dispensed_value_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where the pinned order matters - shipment value
          rounds PER LINE (6 units x $12.3456 -> 7407 cents) while dispensed value
          rounds PER EVENT (3+3 units -> 3704+3704 = 7408 cents); identical units,
          one cent apart, and the scaffold pins both orders explicitly.
        test_recipe:
          setup:
            - "Clock 2026-05-01; standard program + period; patient approved (cap 900000, 100 units)"
            - "One lot: 100 units at unit_cost_per_unit '12.3456', expiry 2027-01-01"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /pap/programs"
              payload: { name: "PAP-LYMX", product_name: "Lymxtra 100mg", unit_cost_per_unit: "100.0000", max_units_per_enrollment: 100, max_units_per_shipment: 30, max_annual_benefit_cents: 900000, enrollment_duration_days: 90, screening_validity_days: 90, appeal_window_days: 30, renewal_window_days: 30, lot_expiry_buffer_days: 30, allow_patient_direct_shipment: true }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /pap/budget-periods"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-12-31", allocated_cents: 1000000 }
              as: ProgramAdministrator
            - call: "POST /pap/patients"
              payload: { full_name: "Dee Dua", date_of_birth: "1988-07-19", state_code: "TX" }
              as: CaseWorker
              captures: { pat_id: $.data.id }
            - call: "POST /pap/screenings"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", household_size: 1, income_basis: "PRIOR_YEAR", prior_year_income_cents: 3000000, insurance_status: "UNINSURED" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "PROOF_OF_INCOME", file_reference: "s3://docs/poi-d.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { dd1: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "IDENTITY", file_reference: "s3://docs/id-d.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { dd2: $.data.id }
            - call: "POST /pap/documents/${dd1}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/documents/${dd2}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/screenings/${scr_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
            - call: "POST /pap/screenings/${scr_id}/decision"
              payload: { decision: "VERIFIED" }
              as: CaseWorker
            - call: "POST /pap/applications"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", screening_id: "${scr_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { app_id: $.data.id }
            - call: "POST /pap/applications/${app_id}/claim"
              payload: {}
              as: CaseWorker
              as_user_id: "cw_1"
            - call: "POST /pap/applications/${app_id}/decision"
              payload: { decision: "APPROVED" }
              as: CaseWorker
              as_user_id: "cw_1"
              captures: { enr_id: $.data.enrollment_id }
            - call: "POST /pap/inventory-lots"
              payload: { program_id: "${prog_id}", lot_number: "LOT-A", quantity_received: 100, unit_cost_per_unit: "12.3456", expiry_date: "2027-01-01" }
              as: ProgramAdministrator
              captures: { lot_id: $.data.id }
            - call: "POST /pap/shipments"
              payload: { enrollment_id: "${enr_id}", quantity_units: 6, destination: "PATIENT", idempotency_key: "ship-r1" }
              as: CaseWorker
              captures: { shp_id: $.data.id, shp_value: $.data.value_cents }
            - call: "POST /pap/shipments/${shp_id}/dispatch"
              payload: {}
              as: CaseWorker
            - call: "POST /pap/shipments/${shp_id}/deliver"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
          trigger:
            - call: "POST /pap/shipments/${shp_id}/dispense-events"
              payload: { lot_id: "${lot_id}", quantity: 3 }
              as: PharmacyDispenser
              captures: { ev1_value: $.data.value_cents }
            - call: "POST /pap/shipments/${shp_id}/dispense-events"
              payload: { lot_id: "${lot_id}", quantity: 3 }
              as: PharmacyDispenser
              captures: { ev2_value: $.data.value_cents }
            - call: "GET /pap/shipments/${shp_id}"
              payload: {}
              as: PharmacyDispenser
              captures: { disp_total: $.data.dispensed_value_cents }
          assert:
            - "Shipment.${shp_id}.value_cents == 7407 (per-line rounding of 6 x 12.3456)"
            - "first DispenseEvent.value_cents == 3704 and second == 3704 (per-event rounding of 3 x 12.3456)"
            - "Shipment.${shp_id}.dispensed_value_cents == 7408 (sum of per-event rounds)"
            - "7408 != 7407: the two pinned rounding orders diverge by exactly one cent for identical units"

  # ---------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: screening_revision_cycle
        grounds:
          - state_machines.EligibilityScreening.REJECTED_to_DRAFT
          - state_machines.EligibilityScreening.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          Cyclic machine on EligibilityScreening: DRAFT -> SUBMITTED -> REJECTED
          -> DRAFT -> SUBMITTED -> VERIFIED; the loop back to DRAFT is the
          non-linear edge, and documents survive the cycle.
        test_recipe:
          setup:
            - "Clock 2026-05-01; program + period; patient with DRAFT screening and two accepted docs"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /pap/programs"
              payload: { name: "PAP-LYMX", product_name: "Lymxtra 100mg", unit_cost_per_unit: "100.0000", max_units_per_enrollment: 100, max_units_per_shipment: 30, max_annual_benefit_cents: 900000, enrollment_duration_days: 90, screening_validity_days: 90, appeal_window_days: 30, renewal_window_days: 30, lot_expiry_buffer_days: 30, allow_patient_direct_shipment: true }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
            - call: "POST /pap/budget-periods"
              payload: { program_id: "${prog_id}", period_start: "2026-01-01", period_end: "2026-12-31", allocated_cents: 1000000 }
              as: ProgramAdministrator
            - call: "POST /pap/patients"
              payload: { full_name: "Eli Egan", date_of_birth: "1969-03-03", state_code: "NM" }
              as: CaseWorker
              captures: { pat_id: $.data.id }
            - call: "POST /pap/screenings"
              payload: { patient_id: "${pat_id}", program_id: "${prog_id}", household_size: 1, income_basis: "PRIOR_YEAR", prior_year_income_cents: 3000000, insurance_status: "UNINSURED" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "PROOF_OF_INCOME", file_reference: "s3://docs/poi-e.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { de1: $.data.id }
            - call: "POST /pap/screenings/${scr_id}/documents"
              payload: { doc_type: "IDENTITY", file_reference: "s3://docs/id-e.pdf" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { de2: $.data.id }
            - call: "POST /pap/documents/${de1}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/documents/${de2}/review"
              payload: { decision: "ACCEPTED" }
              as: CaseWorker
            - call: "POST /pap/screenings/${scr_id}/submit"
              payload: {}
              as: Patient
              as_user_id: "${pat_id}"
          trigger:
            - call: "POST /pap/screenings/${scr_id}/decision"
              payload: { decision: "REJECTED", rejection_reason: "income documentation blurry" }
              as: CaseWorker
