          One request violates both the target-state guard (priority 8: allocations may only be added to a
          PLANNED run) and the mass-fit guard (priority 32: 200.000 MT requested against a lot with 50.000 MT
          remaining). Only ERR_INVALID_RUN_STATE may surface, and the companion call proves the loser is
