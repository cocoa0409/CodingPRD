            - "Property.${p1}.open_disclosure_obligation_count == 0 — a DRAFT profile is not an obligation either"

      - name: score_clamp_never_reports_a_negative_disclosure_score
        claim_type: weighted_scoring
        grounds:
          - calculations.channel_disclosure_score
          - entities.ChannelDisclosureProfile.disclosure_score
        excluded_because:
          difficulty_instance: disclosure_score_capability_penalty_is_max_not_sum
          rationale: "That §1.8 combinatorial_formula instance already builds the incapable-channel profile whose raw arithmetic is 0 + 0 + 0 + 10 - 30 = -20 and asserts disclosure_score == 0 and != -20, i.e. the single trailing clamp, alongside the max-not-sum penalty mode — a separate clamp instance would repeat those exact literals."

      - name: posture_thresholds_are_strict_less_than_at_sixty
        claim_type: threshold
        grounds:
          - calculations.property_disclosure_posture
          - entities.Property.disclosure_posture
        excluded_because:
          difficulty_instance: disclosure_score_exactly_at_flag_threshold_sixty_does_not_flag
          rationale: "The §1.8 boundary_precision_check instance tests the DISCLOSURE_FLAG_THRESHOLD from both sides with pre-computed scores (60 stays AT_RISK and DEPLOYED, 59 and 50 go NON_COMPLIANT and FLAGGED), which is precisely the threshold-boundary claim for this calculation."

      - name: roll_in_commission_tiers_are_selected_by_the_post_roll_in_rate
        claim_type: tiered_pricing
        grounds:
          - calculations.revenue_impact_roll_in
          - endpoints[POST /revenue-impact-models]
        excluded_because:
          difficulty_instance: roll_in_commission_tier_keyed_on_post_roll_in_adr_not_baseline
          rationale: "That §1.8 combinatorial_formula (mode c) instance walks every commission tier boundary with literal ADRs and shows the FULL scenario crossing from the 1800 bps tier into the 2100 bps tier (commission 7867 rather than the naive 6743), covering tier selection, marginal rate and cross-tier straddling in one place."

      - name: refund_variants_diverge_on_the_same_folio_line
        claim_type: variant_divergence
        grounds:
          - calculations.complaint_refund_entitlement
        excluded_because:
          difficulty_instance: complaint_refund_full_fee_versus_disclosure_gap_differential
          rationale: "The §1.8 dual_variant_calc instance computes both variants against the canonical folio and asserts the exact delta (FULL_FEE_REFUND 2600 on the EXEMPT WIFI line versus DISCLOSURE_GAP_DIFFERENTIAL 3367 on the RESORT line, which is neither 10170 nor the proportional 3368), so the divergence is already pinned."

      - name: refund_variant_is_chosen_by_complaint_reason_not_by_the_caller
        claim_type: variant_selection
        grounds:
          - calculations.complaint_refund_entitlement.variants
          - endpoints[POST /guest-complaints/{id}/substantiate]
        excluded_because:
          difficulty_instance: complaint_refund_full_fee_versus_disclosure_gap_differential
          rationale: "Variant selection is asserted inside that same §1.8 instance: substantiate takes no input at all, and the recorded refund_variant is derived purely from complaint_reason (MISSTATED_AMOUNT alone selects DISCLOSURE_GAP_DIFFERENTIAL), so there is no independent selection surface left to test."

      - name: itemization_reconciles_the_quote_against_the_folio_ledger
        claim_type: reconciliation
        grounds:
          - calculations.quote_variance_reconciliation
          - calculations.booking_fee_subtotal.variants
        excluded_because:
          difficulty_instance: booking_quote_per_night_rounding_versus_folio_stay_aggregation
          rationale: "That §1.8 dual_variant_calc instance is the reconciliation test: it asserts the quote variant 17552, the folio variant 17550, the resulting quote_folio_variance_cents of -3 and the tolerance gate that keeps the booking out of DISPUTED, which is the whole provisional-to-final delta story."

      - name: folio_tax_precision_differs_from_quote_tax_precision
        claim_type: precision
        grounds:
          - calculations.folio_line_taxability
          - calculations.booking_quoted_total
        excluded_because:
          difficulty_instance: folio_tax_rounded_per_line_versus_quote_tax_rounded_once
          rationale: "The §1.8 combinatorial_formula (mode b) instance already contrasts the two rounding orders on identical data — four per-line roundings summing to 18002 against one aggregate rounding of 18003 — and asserts each line's tax_cents individually, which is the precision claim for both calculations."

