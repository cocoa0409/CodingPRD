              as: QualityEngineer
            - &a_u2_stage
              call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0002" }
              as: QualityEngineer
              captures: { u2_id: $.data.id }
            - &a_u2_torque
              call: "POST /engine-units/${u2_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 22.0 }, { station: 2, torque_nm: 22.1 }, { station: 3, torque_nm: 21.9 }, { station: 4, torque_nm: 22.2 }] }
              as: QualityEngineer
            - &a_u2_hot
              call: "POST /engine-units/${u2_id}/hot-test"
              payload: { measured_rpm: 3400, measured_emission_g_per_kwh: 5.60 }
              as: QualityEngineer
            - &a_u2_release
              call: "POST /engine-units/${u2_id}/release"
              payload: {}
              as: QualityEngineer
            - &a_u3_stage
              call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0003" }
              as: QualityEngineer
              captures: { u3_id: $.data.id }
            - &a_u3_torque
              call: "POST /engine-units/${u3_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 22.0 }, { station: 2, torque_nm: 22.1 }, { station: 3, torque_nm: 21.9 }, { station: 4, torque_nm: 22.2 }] }
              as: QualityEngineer
            - &a_u3_hot
              call: "POST /engine-units/${u3_id}/hot-test"
              payload: { measured_rpm: 3400, measured_emission_g_per_kwh: 5.60 }
              as: QualityEngineer
            - &a_u3_release
              call: "POST /engine-units/${u3_id}/release"
              payload: {}
              as: QualityEngineer
            - &a_bo_version_read
              call: "GET /build-orders/${bo_id}"
              payload: {}
              as: ProductionPlanner
              captures: { bo_v_now: $.data.version }
          trigger:
            - &a_alloc_run
              call: "POST /build-orders/${bo_id}/allocations/run"
              payload: { expected_build_order_version: "${bo_v_now}" }
              as: ProductionPlanner
          assert:
            - "BuildOrder.${bo_id}.built_quantity == 3"
            - "BuildOrder.${bo_id}.staged_quantity == 0"
            - "BuildOrder.${bo_id}.allocated_dealer_units == 2"
            - "BuildOrder.${bo_id}.allocated_mass_retail_units == 1"
            - "BuildOrder.${bo_id}.unallocated_units == 0"
            - "BuildOrder.${bo_id}.allocation_status == ALLOCATED"
            - "BuildOrder.${bo_id}.allocation_run_at == 2026-08-03T08:00:00Z"
            - "the remainder unit went to DEALER because 0.65 > 0.35, not because of any row id ordering"
            - "BuildOrder.${bo_id}.version == ${bo_v_now} + 1"
            - "EngineUnit.${u1_id}.build_state == RELEASED and EngineUnit.${u1_id}.conformance_state == CONFORMING"
            - "EngineUnit.${u1_id}.hot_test_emission_threshold == 5.63"
            - "BuildOrder.${bo_id}.status == IN_PRODUCTION (3 built < 6 planned)"

      - name: carry_cost_total_committed_never_reselects_tier
        grounds:
          - calculations.build_carry_cost
          - entities.BuildOrder.fields.build_value_cents
          - entities.BuildOrder.fields.total_committed_cents
        distinguishing_aspect: |
          MODE (c) — circular-looking dependency with a pinned evaluation order:
          total_committed_cents = build_value_cents + carry_cost_cents, and the carry
          cost comes from a tier keyed on a value, so a naive implementation re-tiers
          from the total. With 950 units at 21000 cents the build value is 19950000
          (MEDIUM, 0.0030) but the total reaches 21386400, ABOVE CARRY_TIER_2_CEILING
          20000000. The pinned order keeps carry_rate at 0.0030; re-tiering from the
          total would yield 0.0020 and carry_cost_cents 957600.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z."
            - "Family 2027-EPA-208SS with platform 208SS; model WM-21-BBC (standard_cost_cents 21000) RELEASED with a valid PASSED certification."
            - "RUNNING line L-CARRY-C of 500 units/week capacity, dedicated to this order (950 over a 2-week span = 475 per week)."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_model
            - *a_safety
            - *a_model_release
            - call: "POST /assembly-lines"
              payload: { line_code: "L-CARRY-C", supported_product_lines: ["WALK_MOWER"], weekly_capacity_units: 500, changeover_gap_weeks: 1, status: "RUNNING" }
              as: PlantAdmin
              captures: { line_c_id: $.data.id }
          trigger:
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_c_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 2, planned_quantity: 950 }
              as: ProductionPlanner
              captures: { bo_c_id: $.data.id }
          assert:
            - "BuildOrder.${bo_c_id}.build_value_cents == 19950000"
            - "BuildOrder.${bo_c_id}.carry_weeks == 24"
            - "BuildOrder.${bo_c_id}.carry_rate == 0.0030"
            - "BuildOrder.${bo_c_id}.carry_cost_cents == 1436400"
            - "BuildOrder.${bo_c_id}.total_committed_cents == 21386400"
            - "BuildOrder.${bo_c_id}.total_committed_cents > 20000000 while carry_rate stays 0.0030 — the tier is never re-selected from the total"
            - "BuildOrder.${bo_c_id}.carry_cost_cents != 957600 (the value a total-keyed tier would have produced)"

  # ===========================================================================
  # Rule 3 — non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: engine_unit_parallel_build_and_conformance_dimensions
        grounds:
          - state_machines.EngineUnit.STAGED_to_ASSEMBLED
          - state_machines.EngineUnit.ASSEMBLED_to_STAGED
          - state_machines.EngineUnit.ASSEMBLED_to_HOT_TESTED
          - state_machines.EngineUnit.HOT_TESTED_to_RELEASED
          - entities.EngineUnit.fields.build_state
          - entities.EngineUnit.fields.conformance_state
          - calculations.torque_conformance
        distinguishing_aspect: |
          PARALLEL state dimensions on EngineUnit: build_state advances STAGED ->
          ASSEMBLED on the torque record REGARDLESS of the readings, while
          conformance_state independently flips PENDING -> NONCONFORMING; the rework
          cycle then drives build_state backwards to STAGED and conformance_state back
          to PENDING, so the same row visits (ASSEMBLED, NONCONFORMING),
          (STAGED, PENDING) and (RELEASED, CONFORMING) — a combination no single linear
          enum could express.
        test_recipe:
          setup:
            - "Canonical prelude: clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS CERTIFIED; platform 208SS posture OPEN (torque spec 22.0 Nm +/- 5% over 4 fasteners -> inclusive band [20.90, 23.10]); model WM-21-BBC RELEASED; L1 RUNNING; CB-001 / IG-001 / CS-001 ACCEPTED; machining run CLOSED at cpk 2.1082."
            - "Build order bo (planned 6) RELEASED; unit SN-0001 STAGED with conformance PENDING and rework_count 0."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
          trigger:
            - call: "POST /engine-units/${u1_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 22.0 }, { station: 2, torque_nm: 22.1 }, { station: 3, torque_nm: 21.9 }, { station: 4, torque_nm: 23.2 }] }
              as: QualityEngineer
            - call: "POST /engine-units/${u1_id}/rework"
              payload: {}
              as: QualityEngineer
            - *a_u1_torque
            - *a_u1_hot
            - *a_u1_release
          assert:
            - "immediately after the failing torque record the unit read build_state == ASSEMBLED with conformance_state == NONCONFORMING and out_of_spec_fastener_count == 1 (only the 23.2 Nm reading is outside [20.90, 23.10])"
            - "immediately after the rework the unit read build_state == STAGED, conformance_state == PENDING, rework_count == 1, torque_readings == null, out_of_spec_fastener_count == null"
            - "EngineUnit.${u1_id}.build_state == RELEASED"
            - "EngineUnit.${u1_id}.conformance_state == CONFORMING"
            - "EngineUnit.${u1_id}.rework_count == 1"
            - "EngineUnit.${u1_id}.out_of_spec_fastener_count == 0"
            - "EngineUnit.${u1_id}.hot_test_emission_threshold == 5.63"
            - "BuildOrder.${bo_id}.built_quantity == 1 and BuildOrder.${bo_id}.staged_quantity == 0"

      - name: certification_family_audit_hold_cycle_returns_to_certified
        grounds:
          - state_machines.CertificationFamily.CERTIFIED_to_AUDIT_HOLD
          - state_machines.CertificationFamily.AUDIT_HOLD_to_DURABILITY_TESTING
          - state_machines.CertificationFamily.SUBMITTED_to_CERTIFIED
          - state_machines.BuildOrder.HELD_to_IN_PRODUCTION
          - entities.CertificationFamily.fields.cumulative_audit_failures
          - entities.CertificationFamily.fields.audit_hold_at
        distinguishing_aspect: |
          CYCLIC shape on CertificationFamily (a different entity from instance 1's
          EngineUnit): CERTIFIED -> AUDIT_HOLD -> DURABILITY_TESTING ->
          DURABILITY_COMPLETE -> SUBMITTED -> CERTIFIED closes the loop, and the second
          pass through certify runs the COMPENSATION arm that restores the HELD build
          order to status_before_hold while cumulative_audit_failures stays at 1 (the
          loop counter is never reset by re-certification, which is what makes the
          second failure terminal).
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED and platform 208SS posture OPEN."
            - "Build order bo (planned 6) IN_PRODUCTION with two RELEASED units SN-0001 / SN-0002 -> built_quantity 2."
            - "A SCHEDULED production line audit for week 2026-09-14 with required_sample_size max(2, ceil(2 * 0.02)) = 2."
            - "That audit is recorded as 2 of 2 units failed -> failure_rate 1.0000 > 0.25 -> FAILED, driving the family to AUDIT_HOLD with audit_hold_at 2026-08-03T08:00:00Z, the model to SUSPENDED and the order to HELD with status_before_hold IN_PRODUCTION."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
            - *a_u1_torque
            - *a_u1_hot
            - *a_u1_release
            - *a_u2_stage
            - *a_u2_torque
            - *a_u2_hot
            - *a_u2_release
            - &a_audit_schedule
              call: "POST /build-orders/${bo_id}/line-audits"
              payload: { audit_week: "2026-09-14" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
              captures: { audit_id: $.data.id }
            - &a_audit_fail
              call: "POST /line-audits/${audit_id}/record"
              payload: { units_tested: 2, units_failed: 2, max_measured_emission_g_per_kwh: 5.60 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
          trigger:
            - call: "GET /certification-families/${fam_id}"
              payload: {}
              as: CertificationEngineer
              captures: { fam_v_hold: $.data.version }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_id}", scheduled_start_at: "2026-09-01T09:00:00Z", scheduled_end_at: "2026-09-22T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v_hold}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur2_id: $.data.id }
            - call: "POST /durability-tests/${dur2_id}/complete"
              payload: { accumulated_hours: 500, final_emission_g_per_kwh: 6.40 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - *a_submit
            - *a_certify
          assert:
            - "CertificationFamily.${fam_id}.status == CERTIFIED (the loop closed)"
            - "CertificationFamily.${fam_id}.cumulative_audit_failures == 1 (never reset by re-certification)"
            - "CertificationFamily.${fam_id}.deterioration_factor == 1.2800 and certified_emission_g_per_kwh == 5.12"
            - "EnginePlatform.${plat_id}.certification_posture == OPEN"
            - "BuildOrder.${bo_id}.status == IN_PRODUCTION (restored from status_before_hold)"
            - "BuildOrder.${bo_id}.status_before_hold == null"
            - "BuildOrder.${bo_id}.held_reason == null"
            - "ProductModel.${model_id}.status == SUSPENDED (certification does NOT auto-release a suspended model)"
            - "BuildOrder.${bo_id}.allocated_dealer_units == 0 and BuildOrder.${bo_id}.allocated_mass_retail_units == 0 and BuildOrder.${bo_id}.unallocated_units == 2 and allocation_status == UNALLOCATED (allocation counters are NOT restored by the compensation)"
            - "DurabilityTestRun.${dur_id}.status == COMPLETED and DurabilityTestRun.${dur2_id}.status == COMPLETED (two completed runs on one family)"

      - name: component_lot_branch_reject_then_deviation_accept
        grounds:
          - state_machines.ComponentLot.RECEIVED_to_ACCEPTED
          - state_machines.ComponentLot.RECEIVED_to_REJECTED
          - state_machines.ComponentLot.REJECTED_to_DEVIATION_ACCEPTED
          - state_machines.ComponentLot.ACCEPTED_to_QUARANTINED
          - entities.ComponentLot.fields.deviation_flag
          - validations[priority=30]
        distinguishing_aspect: |
          BRANCHING fork with divergent side-effect sets on ComponentLot (a third
          entity, neither EngineUnit nor CertificationFamily): RECEIVED forks to
          ACCEPTED (accepted_qty = lot_quantity - defects_found, streak++) or to
          REJECTED (accepted_qty 0, streak reset, sibling-quarantine cascade), and the
          REJECTED arm then re-joins the releasable population through
          DEVIATION_ACCEPTED, which recomputes accepted_qty to 198 and sets
          deviation_flag true — a taint the ACCEPTED arm never carries.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z."
            - "Supplier SUP-CARB APPROVED at NORMAL; lot CB-001 (800 pieces, sample 40) inspected with 0 defects -> ACCEPTED with accepted_qty 800; lot CB-002 (200 pieces, sample 10, acceptance_number 1) still RECEIVED."
          setup_api_calls:
            - *a_clock
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_lot_carb2
          trigger:
            - *a_inspect_carb2_reject
            - &a_lot_carb2_deviation
              call: "POST /component-lots/${lot_carb2_id}/deviation-accept"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-ravi"
          assert:
            - "ComponentLot.${lot_carb2_id}.status == DEVIATION_ACCEPTED"
            - "ComponentLot.${lot_carb2_id}.accepted_qty == 198 (200 - 2 defects)"
            - "ComponentLot.${lot_carb2_id}.remaining_qty == 198"
            - "ComponentLot.${lot_carb2_id}.consumed_qty == 0"
            - "ComponentLot.${lot_carb2_id}.deviation_flag == true"
            - "ComponentLot.${lot_carb2_id}.inspected_by_user_id == qe-mika and deviation_approved_by_user_id == co-ravi (two different users, so validations[priority=30] passes)"
            - "ComponentLot.${lot_carb_id}.status == QUARANTINED (the ACCEPTED arm was dragged down by the reject cascade)"
            - "ComponentLot.${lot_carb_id}.accepted_qty == 800 and remaining_qty == 800 and deviation_flag == false"
            - "Supplier.${sup_carb_id}.rolling_defect_ppm == 40000 (the deviation acceptance deliberately does NOT revise the supplier's defect rate)"
            - "Supplier.${sup_carb_id}.approval_status == PROBATION"

  # ===========================================================================
  # Rule 4 — transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: audit_failure_five_level_family_cascade
        grounds:
          - state_machines.ProductionLineAudit.SCHEDULED_to_FAILED
          - state_machines.CertificationFamily.CERTIFIED_to_AUDIT_HOLD
          - state_machines.EnginePlatform.OPEN_to_RESTRICTED
          - state_machines.ProductModel.RELEASED_to_SUSPENDED
          - state_machines.BuildOrder.IN_PRODUCTION_to_HELD
          - calculations.audit_outcome_evaluation
          - calculations.platform_certification_posture
        distinguishing_aspect: |
          Depth-5 chain from POST /line-audits/{id}/record: (1) the audit row goes
          FAILED, (2) BECAUSE it failed the family goes AUDIT_HOLD, (3) BECAUSE the
          family left CERTIFIED the platform posture projects to RESTRICTED and the
          RELEASED model is SUSPENDED, (4) BECAUSE the model was suspended its
          IN_PRODUCTION order is HELD, (5) BECAUSE the order was held its non-released
          unit is QUARANTINED and its allocation counters are reset. Each link is caused
          by the previous link, not by the original call.
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED and platform posture OPEN."
            - "Build order bo (planned 6) IN_PRODUCTION with SN-0001 and SN-0002 RELEASED (built_quantity 2), an allocation run standing at 1 dealer / 1 mass-retail / 0 unallocated, and SN-0003 STAGED with conformance PENDING."
            - "A SCHEDULED line audit for week 2026-09-14 with required_sample_size 2."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
            - *a_u1_torque
            - *a_u1_hot
            - *a_u1_release
            - *a_u2_stage
            - *a_u2_torque
            - *a_u2_hot
            - *a_u2_release
            - *a_bo_version_read
            - *a_alloc_run
            - *a_u3_stage
            - *a_audit_schedule
          trigger:
            - *a_audit_fail
          assert:
            - "L1 — ProductionLineAudit.${audit_id}.status == FAILED with failure_rate == 1.0000 and failure_reason == FAILURE_RATE_EXCEEDED"
            - "L2 — CertificationFamily.${fam_id}.status == AUDIT_HOLD, cumulative_audit_failures == 1, audit_hold_at == 2026-08-03T08:00:00Z"
            - "L3a — EnginePlatform.${plat_id}.certification_posture == RESTRICTED"
            - "L3b — ProductModel.${model_id}.status == SUSPENDED"
            - "L4 — BuildOrder.${bo_id}.status == HELD with status_before_hold == IN_PRODUCTION and a non-null held_reason"
            - "L5a — EngineUnit.${u3_id}.conformance_state == QUARANTINED while its build_state stays STAGED"
            - "L5b — BuildOrder.${bo_id}.allocated_dealer_units == 0, allocated_mass_retail_units == 0, unallocated_units == 2, allocation_status == UNALLOCATED, allocation_run_at == null"
            - "EngineUnit.${u1_id}.conformance_state == CONFORMING and EngineUnit.${u2_id}.conformance_state == CONFORMING (released units are not quarantined)"
            - "BuildOrder.${bo_id}.built_quantity == 2 and staged_quantity == 1 (the cascade moves no unit between build states)"

      - name: lot_rejection_supplier_probation_quarantine_cascade
        grounds:
          - state_machines.ComponentLot.RECEIVED_to_REJECTED
          - state_machines.Supplier.APPROVED_to_PROBATION
          - state_machines.ComponentLot.ACCEPTED_to_QUARANTINED
          - state_machines.EngineUnit.conformance_PENDING_to_QUARANTINED
          - calculations.supplier_defect_ppm
          - calculations.supplier_inspection_level_ladder
        distinguishing_aspect: |
          Depth-4 chain from a DIFFERENT trigger — POST /component-lots/{id}/inspect:
          (1) CB-002 is REJECTED against its frozen acceptance_number, (2) BECAUSE the
          rejection re-pools the supplier's defect rate to 40000 ppm the supplier goes
          PROBATION at TIGHTENED, (3) BECAUSE the supplier crossed the probation
          threshold its sibling lot CB-001 with remaining_qty > 0 is QUARANTINED,
          (4) BECAUSE CB-001 was quarantined the STAGED unit built from it is moved to
          conformance QUARANTINED. Propagation runs supplier-scoped, so the other two
          suppliers' lots are untouched.
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED, order bo RELEASED and unit SN-0001 STAGED (consuming one piece each from CB-001 and IG-001, so CB-001 reads consumed_qty 1 / remaining_qty 799)."
            - "Lot CB-002 (200 pieces, sample 10, acceptance_number 1) received from SUP-CARB and still RECEIVED."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
            - *a_lot_carb2
          trigger:
            - *a_inspect_carb2_reject
          assert:
            - "L1 — ComponentLot.${lot_carb2_id}.status == REJECTED with defect_ppm == 200000 and accepted_qty == 0"
            - "L2 — Supplier.${sup_carb_id}.rolling_defect_ppm == 40000, approval_status == PROBATION, incoming_inspection_level == TIGHTENED, consecutive_accepted_lots == 0"
            - "L3 — ComponentLot.${lot_carb_id}.status == QUARANTINED (was ACCEPTED with remaining_qty 799 > 0)"
            - "L4 — EngineUnit.${u1_id}.conformance_state == QUARANTINED while build_state stays STAGED"
            - "ComponentLot.${lot_ign_id}.status == ACCEPTED and ComponentLot.${lot_cast_id}.status == ACCEPTED (different suppliers, untouched)"
            - "Supplier.${sup_ign_id}.approval_status == APPROVED and Supplier.${sup_cast_id}.approval_status == APPROVED"
            - "ComponentLot.${lot_carb_id}.consumed_qty == 1 and remaining_qty == 799 (quarantine does not return pieces)"
            - "BuildOrder.${bo_id}.staged_quantity == 1 and built_quantity == 0"

      - name: supersede_backorder_substitution_fill_rate_cascade
        grounds:
          - state_machines.ServicePart.ACTIVE_to_SUPERSEDED
          - state_machines.PartsFulfillmentRequest.BACKORDERED_to_SUBSTITUTED
          - calculations.supersession_chain_resolution
          - calculations.parts_fill_rate_and_promise
          - entities.ServicePart.fields.fill_rate_pct
        distinguishing_aspect: |
          Depth-3 chain from a THIRD trigger — POST /service-parts/{id}/supersede:
          (1) PN-CARB-KIT-1 goes SUPERSEDED, (2) BECAUSE it was superseded its open
          BACKORDERED request is re-pointed to the successor as SUBSTITUTED with a
          re-promised ship date, (3) BECAUSE that request moved, the successor's
          on_hand_qty drops to 4 and BOTH parts' request counters and fill_rate_pct are
          recomputed (predecessor 100.00 from 1 filled / 0 backordered, successor 100.00
          from 1 substituted).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS."
            - "Service part PN-CARB-KIT-1 (CARBURETOR_KIT, on_hand_qty 1, dealer lead 2 days, mass-retail lead 5 days, 10 committed years after last production year 2027) and its successor PN-CARB-KIT-2 (same platform, on_hand_qty 5)."
            - "Dealer request A for 1 piece settled FILLED against the single on-hand piece (promised 2026-08-05), leaving on_hand_qty 0; dealer request B for 1 piece is BACKORDERED with promised_ship_date 2026-08-24 (clock + BACKORDER_PROMISE_DAYS 21)."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - &a_part1
              call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-CARB-KIT-1", category: "CARBURETOR_KIT", on_hand_qty: 1, committed_availability_years: 10, last_production_year: 2027, dealer_lead_time_days: 2, mass_retail_lead_time_days: 5 }
              as: PlantAdmin
              captures: { part1_id: $.data.id }
            - &a_part2
              call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-CARB-KIT-2", category: "CARBURETOR_KIT", on_hand_qty: 5, committed_availability_years: 10, last_production_year: 2027, dealer_lead_time_days: 2, mass_retail_lead_time_days: 5 }
              as: PlantAdmin
              captures: { part2_id: $.data.id }
            - &a_req_filled
              call: "POST /parts-requests"
              payload: { service_part_id: "${part1_id}", requested_quantity: 1, channel: "DEALER" }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
              captures: { req_a_id: $.data.id }
            - &a_req_backordered
              call: "POST /parts-requests"
              payload: { service_part_id: "${part1_id}", requested_quantity: 1, channel: "DEALER" }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
              captures: { req_b_id: $.data.id }
          trigger:
            - call: "POST /service-parts/${part1_id}/supersede"
              payload: { successor_part_id: "${part2_id}" }
              as: PlantAdmin
          assert:
            - "L1 — ServicePart.${part1_id}.status == SUPERSEDED with superseded_by_part_id == ${part2_id}"
            - "L2 — PartsFulfillmentRequest.${req_b_id}.status == SUBSTITUTED, shipped_from_part_id == ${part2_id}, promised_ship_date == 2026-08-05 (clock date 2026-08-03 + successor dealer lead 2 days)"
            - "L3a — ServicePart.${part2_id}.on_hand_qty == 4"
            - "L3b — ServicePart.${part2_id}.substituted_request_count == 1, backordered_request_count == 0, fill_rate_pct == 100.00"
            - "L3c — ServicePart.${part1_id}.filled_request_count == 1, substituted_request_count == 0, backordered_request_count == 0, fill_rate_pct == 100.00"
            - "PartsFulfillmentRequest.${req_a_id}.status == FILLED with shipped_from_part_id == ${part1_id} and promised_ship_date == 2026-08-05 (untouched by the cascade)"
            - "ServicePart.${part1_id}.on_hand_qty == 0"

  # ===========================================================================
  # Rule 5 — priority-pair validation conflicts across four DIFFERENT
  #          error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: expired_safety_certification_outranks_uncertified_platform
        grounds:
          - validations[priority=35]
          - validations[priority=43]
          - errors[ERR_SAFETY_CERTIFICATION_EXPIRED]
          - errors[ERR_FAMILY_NOT_CERTIFIED]
        distinguishing_aspect: |
          Category pair business_safety(35) vs business_referential(43) on
          POST /build-orders/{id}/release. The order simultaneously carries an expired
          safety certification AND sits on a platform whose posture is still PENDING, so
          both rules are live; only the safety error may surface. The setup exploits the
          asymmetry that model release checks 34/35 but NOT posture, so a model can be
          RELEASED and an order PLANNED long before the emission family is certified.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; family 2027-EPA-208SS left in DRAFT, so platform 208SS reads certification_posture PENDING."
            - "Model WM-P1-MOWER (WALK_MOWER, DUAL) with a PASSED ANSI_B71_1 certification tested 2026-07-15 and expiring 2026-08-10; the model is RELEASED at the 2026-08-03 clock, which is legal because release checks only 34/35 and never the platform posture."
            - "Line L1 RUNNING; PRE_SEASON order for week 2026-09-14 in PLANNED."
            - "Clock advanced to 2026-08-20T08:00:00Z, so the certification is now 10 days expired."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "WM-P1-MOWER", product_line: "WALK_MOWER", channel: "DUAL", blade_brake_type: "BLADE_BRAKE_CLUTCH", operator_presence_type: "BAIL", warranty_months: 36, standard_cost_cents: 21000, msrp_cents: 59900, dealer_share_pct: 0.55, dealer_cap_units: 500, mass_retail_cap_units: 500 }
              as: PlantAdmin
              captures: { model_p1_id: $.data.id }
            - call: "POST /safety-certifications"
              payload: { product_model_id: "${model_p1_id}", standard_code: "ANSI_B71_1", blade_stop_time_ms: 2600, opc_stop_time_ms: 900, tested_on: "2026-07-15", expires_on: "2026-08-10" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
              captures: { cert_p1_id: $.data.id }
            - call: "POST /product-models/${model_p1_id}/release"
              payload: {}
              as: PlantAdmin
            - *a_line
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_p1_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 1, planned_quantity: 4 }
              as: ProductionPlanner
              captures: { bo_p1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /build-orders/${bo_p1_id}/release"
              payload: {}
              as: ProductionPlanner
          assert:
            - "the response is 409 with error_id ERR_SAFETY_CERTIFICATION_EXPIRED (priority 35), NOT ERR_FAMILY_NOT_CERTIFIED (priority 43)"
            - "BuildOrder.${bo_p1_id}.status == PLANNED and released_at == null"
            - "EnginePlatform.${plat_id}.certification_posture == PENDING (the lower-priority violation is real but unreported)"
            - "SafetyCertification.${cert_p1_id}.result == PASSED with expires_on == 2026-08-10 (the certification passed; it merely lapsed)"
            - "ProductModel.${model_p1_id}.status == RELEASED (release predates the expiry)"

      - name: completed_order_state_outranks_quantity_quota
        grounds:
          - validations[priority=25]
          - validations[priority=60]
          - errors[ERR_BUILD_ORDER_NOT_ACCEPTING_UNITS]
          - errors[ERR_BUILD_ORDER_QUANTITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair state(25) vs business_fiscal(60) — a pair disjoint from
          instance 1's (safety, referential) — on POST /engine-units. Filling a
          one-unit order drives it to COMPLETED, which makes the state rule and the
          quota rule fire on the very same next call (staged 0 + built 1 + 1 = 2 > 1);
          the state error must win.
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED, model WM-21-BBC RELEASED, L1 RUNNING, CB-001 / IG-001 / CS-001 ACCEPTED and the machining run CLOSED."
            - "Order bo_q for week 2026-09-14 with planned_quantity 1, RELEASED."
            - "Unit SN-Q-01 staged, torque-recorded in band, hot-tested and released -> built_quantity 1 == planned_quantity 1, so the order is COMPLETED (terminal)."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 1, planned_quantity: 1 }
              as: ProductionPlanner
              captures: { bo_q_id: $.data.id }
            - call: "POST /build-orders/${bo_q_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_q_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-Q-01" }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { u_q_id: $.data.id }
            - call: "POST /engine-units/${u_q_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 22.0 }, { station: 2, torque_nm: 22.1 }, { station: 3, torque_nm: 21.9 }, { station: 4, torque_nm: 22.2 }] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units/${u_q_id}/hot-test"
              payload: { measured_rpm: 3400, measured_emission_g_per_kwh: 5.60 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /engine-units/${u_q_id}/release"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
          trigger:
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_q_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-Q-02" }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "the response is 409 with error_id ERR_BUILD_ORDER_NOT_ACCEPTING_UNITS (priority 25), NOT ERR_BUILD_ORDER_QUANTITY_EXCEEDED (priority 60)"
            - "BuildOrder.${bo_q_id}.status == COMPLETED with built_quantity == 1 and staged_quantity == 0"
            - "no EngineUnit exists with serial_number SN-Q-02"
            - "ComponentLot.${lot_carb_id}.consumed_qty == 1 and remaining_qty == 799 (the rejected call consumed nothing)"

      - name: rejected_lot_safety_outranks_quantity_quota
        grounds:
          - validations[priority=40]
          - validations[priority=60]
          - errors[ERR_COMPONENT_LOT_NOT_RELEASABLE]
          - errors[ERR_BUILD_ORDER_QUANTITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_safety(40) vs business_fiscal(60) — the fiscal side is
          shared with instance 2 but the safety side makes it a distinct pair, and the
          winning error is different. A one-unit order already holds its single staged
          unit (so the quota rule is live) while the carburetor lot offered for the next
          unit was REJECTED at incoming inspection (so the safety rule is live). The
          releasability check outranks the quota check.
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED and the machining run CLOSED."
            - "Order bo_r for week 2026-09-14 with planned_quantity 1, RELEASED, and unit SN-R-01 already STAGED (staged_quantity 1, built_quantity 0), so any further unit breaks the quota."
            - "Lot CB-002 (200 pieces, sample 10, acceptance_number 1) inspected with 2 defects -> REJECTED, dragging SUP-CARB to PROBATION and CB-001 to QUARANTINED."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 1, planned_quantity: 1 }
              as: ProductionPlanner
              captures: { bo_r_id: $.data.id }
            - call: "POST /build-orders/${bo_r_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_r_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-R-01" }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { u_r_id: $.data.id }
            - *a_lot_carb2
            - *a_inspect_carb2_reject
          trigger:
            - call: "POST /engine-units"
              payload: { build_order_id: "${bo_r_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_carb2_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-R-02" }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "the response is 409 with error_id ERR_COMPONENT_LOT_NOT_RELEASABLE (priority 40), NOT ERR_BUILD_ORDER_QUANTITY_EXCEEDED (priority 60)"
            - "BuildOrder.${bo_r_id}.staged_quantity == 1 and built_quantity == 0 and status == IN_PRODUCTION"
            - "ComponentLot.${lot_carb2_id}.status == REJECTED with remaining_qty == 0"
            - "no EngineUnit exists with serial_number SN-R-02"

      - name: changeover_conflict_outranks_line_capacity
        grounds:
          - validations[priority=51]
          - validations[priority=59]
          - errors[ERR_LINE_CHANGEOVER_CONFLICT]
          - errors[ERR_LINE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair business_temporal(51) vs business_fiscal(59) — a fourth distinct
          pair — on POST /build-orders. The rejected order both lands one week away from
          a different product line's occupied week (changeover) and demands 1000 units in
          a single week against a 500-unit line (capacity). Temporal coherence is checked
          before capacity, so the changeover error is the only observable one.
        test_recipe:
          setup:
            - "Canonical prelude with the family CERTIFIED; line L1 RUNNING supports WALK_MOWER and SNOW_THROWER with weekly_capacity_units 500 and changeover_gap_weeks 1."
            - "A RELEASED WALK_MOWER model plus a PLANNED WALK_MOWER order of 1 unit occupying week 2026-09-21."
            - "A second model SN-P4-THROWER (SNOW_THROWER, DUAL, TWO_HAND, ENGINE_KILL) RELEASED behind a PASSED ANSI_B71_3 certification."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2026-09-21", week_span: 1, planned_quantity: 1 }
              as: ProductionPlanner
              captures: { bo_walk_id: $.data.id }
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "SN-P4-THROWER", product_line: "SNOW_THROWER", channel: "DUAL", blade_brake_type: "ENGINE_KILL", operator_presence_type: "TWO_HAND", warranty_months: 36, standard_cost_cents: 33000, msrp_cents: 89900, dealer_share_pct: 0.60, dealer_cap_units: 800, mass_retail_cap_units: 800 }
              as: PlantAdmin
              captures: { model_snow_id: $.data.id }
            - call: "POST /safety-certifications"
              payload: { product_model_id: "${model_snow_id}", standard_code: "ANSI_B71_3", blade_stop_time_ms: 2600, opc_stop_time_ms: 900, tested_on: "2026-07-15", expires_on: "2027-07-15" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "POST /product-models/${model_snow_id}/release"
              payload: {}
              as: PlantAdmin
          trigger:
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_snow_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2026-09-28", week_span: 1, planned_quantity: 1000 }
              as: ProductionPlanner
          assert:
            - "the response is 409 with error_id ERR_LINE_CHANGEOVER_CONFLICT (priority 51), NOT ERR_LINE_CAPACITY_EXCEEDED (priority 59)"
            - "the rejected order would have loaded ceil(1000 / 1) == 1000 units into week 2026-09-28 against weekly_capacity_units 500, so the capacity rule was genuinely violated too"
            - "BuildOrder.${bo_walk_id}.status == PLANNED (untouched)"
            - "GET /build-orders?assembly_line_id=${line_id} returns total_count == 1"

  # ===========================================================================
  # Rule 6 — boundary / precision checks on four different metrics at four
  #          different endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: cpk_exactly_at_critical_capability_gate
        grounds:
          - calculations.machining_capability_index
          - state_machines.MachiningRun.OPEN_to_CLOSED
          - state_machines.MachiningRun.OPEN_to_CAPABILITY_HOLD
          - validations[priority=38]
        distinguishing_aspect: |
          Metric = the capability index Cpk on POST /machining-runs/{id}/close, decided
          against the CRITICAL gate 1.33 with an INCLUSIVE comparison. The same five
          measurements (sample standard deviation 0.005000, mean 65.000000) are closed
          against two spec windows that differ by 0.00015 mm, landing Cpk on exactly
          1.3300 (CLOSED) and on 1.3200 (CAPABILITY_HOLD) — proving both the inclusive
          gate and the 4-decimal rounding of the index.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS."
            - "Supplier SUP-CAST APPROVED with casting lots CS-001 and CS-002 (800 pieces each) both ACCEPTED at 0 defects."
            - "Two OPEN CYLINDER_BORE machining runs: run A with limits 64.98005 / 65.01995 and run B with limits 64.98020 / 65.01980."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_cast_id}", lot_code: "CS-002", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_cast2_id: $.data.id }
            - call: "POST /component-lots/${lot_cast2_id}/inspect"
              payload: { defects_found: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /machining-runs"
              payload: { engine_platform_id: "${plat_id}", casting_lot_id: "${lot_cast_id}", component_type: "CYLINDER_BORE", lsl_mm: 64.98005, usl_mm: 65.01995 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { mrun_a_id: $.data.id }
            - call: "POST /machining-runs"
              payload: { engine_platform_id: "${plat_id}", casting_lot_id: "${lot_cast2_id}", component_type: "CYLINDER_BORE", lsl_mm: 64.98020, usl_mm: 65.01980 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { mrun_b_id: $.data.id }
          trigger:
            - call: "POST /machining-runs/${mrun_a_id}/close"
              payload: { measurements: [65.0050, 64.9950, 65.0050, 64.9950, 65.0000] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /machining-runs/${mrun_b_id}/close"
              payload: { measurements: [65.0050, 64.9950, 65.0050, 64.9950, 65.0000] }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "MachiningRun.${mrun_a_id}.mean_mm == 65.000000 and sigma_mm == 0.005000 (sample standard deviation, n-1 = 4)"
            - "MachiningRun.${mrun_a_id}.cpk == 1.3300 — exactly the CRITICAL gate — and status == CLOSED"
            - "MachiningRun.${mrun_b_id}.cpk == 1.3200 and status == CAPABILITY_HOLD"
            - "MachiningRun.${mrun_b_id}.mean_mm == 65.000000 and sigma_mm == 0.005000 (identical statistics; only the 0.00015 mm tighter window flips the outcome)"
            - "the pair proves the gate is cpk >= 1.33 inclusive, not strictly greater"

      - name: audit_failure_rate_exactly_at_quarter_threshold
        grounds:
          - calculations.audit_outcome_evaluation
          - state_machines.ProductionLineAudit.SCHEDULED_to_PASSED
          - state_machines.ProductionLineAudit.SCHEDULED_to_FAILED
