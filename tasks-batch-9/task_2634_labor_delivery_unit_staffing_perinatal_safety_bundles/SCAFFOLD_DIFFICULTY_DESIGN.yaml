            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-IND-4181", gestational_age_weeks: 39, indication_code: "GDM_CONTROLLED", requested_start_utc: "2026-08-20T18:30:00Z", expected_labor_minutes: 120 }
              as: PatientAccessCoordinator
              captures: { bk_inside_buffer: $.data.id }
            - call: POST /induction-bookings
              payload: { unit_id: "${unit_id}", patient_record_code: "PRC-IND-4182", gestational_age_weeks: 39, indication_code: "GDM_CONTROLLED", requested_start_utc: "2026-08-20T18:45:00Z", expected_labor_minutes: 120 }
              as: PatientAccessCoordinator
              captures: { bk_touching: $.data.id }
