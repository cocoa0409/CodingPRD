          - entities.RecoveryGroup.fields.projected_recovery_minutes
          - entities.RecoveryGroup.fields.recovery_sequence
          - entities.DependencyEdge.fields.edge_kind
        distinguishing_aspect: |
          Mode (a): three interacting inputs (per-node weights, edge kind filter, path maximisation)
          with no linear closed form — the answer is max over paths, and a SOFT edge that would make
          APP-EDGE -> APP-CORE -> AST-DB1 -> AST-NET1 the longest chain at 137 minutes is excluded by
          the HARD-only filter, so the group projects 92 minutes.
