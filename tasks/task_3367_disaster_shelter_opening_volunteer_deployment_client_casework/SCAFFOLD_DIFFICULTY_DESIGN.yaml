  - rule_id: transitive_cascade
    instances:
      - name: shelter_close_recalls_deployments_and_recounts_region
        grounds:
          - state_machines.ShelterOperation.CONSOLIDATING_to_CLOSED
          - state_machines.VolunteerDeployment.ON_SHIFT_to_RECALLED
          - calculations.region_volunteer_counts
          - entities.Region.fields.deployed_volunteer_count
        distinguishing_aspect: |
          Depth-3 chain whose trigger is shelter closure: closing the shelter recalls the
