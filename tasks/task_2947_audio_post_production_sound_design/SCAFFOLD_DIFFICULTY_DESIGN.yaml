  - rule_id: compensating_invariant
    instances:

      - name: booking_release_restores_hour_and_cost_ledger_without_drift
        grounds:
          - state_machines.MixStageBooking.RESERVED_to_RELEASED
          - calculations.stage_hours_ledger
          - calculations.project_billing_total
          - entities.Project.fields.stage_hours_available
          - errors.ERR_STAGE_WINDOW_CONFLICT
        distinguishing_aspect: |
          Release is the exact inverse of reserve, and it must be inverse REPEATEDLY: after
          create -> release -> create -> release the project is bit-for-bit back at
          stage_hours_reserved 0.00, stage_hours_available 40.00, stage_cost_subtotal_cents 0 and
          billing_total_cents 0, with two RELEASED bookings on the books contributing nothing —
          and the freed window is re-bookable, proving RELEASED left the occupancy set too.
        test_recipe:
          setup:
            - "Stage at 120000 cents/hour with a 45-minute changeover; mixer certified THEATRICAL."
            - "STANDARD project, stage_hours_authorized 40.00, picture LOCKED, no other cost components."
            - "The same window 2026-09-14T10:00:00Z -> 13:00:00Z is booked twice, released each time."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /mix-stages"
              payload: { room_code: "STAGE_L", display_name: "Stage L", hourly_rate_cents: 120000, supports_remote_review: true, changeover_minutes: 45 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { stage_id: $.data.id }
            - call: "POST /mixers"
              payload: { full_name: "Lou Mixer", certified_platforms: ["THEATRICAL"], max_daily_hours: 10.00 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { mixer_one_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Feature Tau", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z", turnaround_class: "STANDARD", stage_hours_authorized: 40.00 }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/picture-lock"
              payload: {}
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { billing_at_rest: $.data.billing_total_cents }
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v_first: $.data.version, available_at_rest: $.data.stage_hours_available }
          trigger:
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v_first}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_one_id}", booking_type: "FINAL_MIX", platform: "THEATRICAL", window_start_utc: "2026-09-14T10:00:00Z", window_end_utc: "2026-09-14T13:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { booking_one_id: $.data.id, reserved_one: $.data.reserved_hours }
            - call: "POST /mix-bookings/${booking_one_id}/release"
              payload: { release_reason: "client postponed the mix" }
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "GET /projects/${proj_id}"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_v_second: $.data.version, available_after_first_release: $.data.stage_hours_available }
            - call: "POST /mix-bookings"
              payload: { expected_project_version: "${proj_v_second}", project_id: "${proj_id}", mix_stage_id: "${stage_id}", mixer_id: "${mixer_one_id}", booking_type: "FINAL_MIX", platform: "THEATRICAL", window_start_utc: "2026-09-14T10:00:00Z", window_end_utc: "2026-09-14T13:00:00Z", client_attendance: "ONSITE" }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { booking_two_id: $.data.id, reserved_two: $.data.reserved_hours }
            - call: "POST /mix-bookings/${booking_two_id}/release"
              payload: { release_reason: "client postponed again" }
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { billing_after: $.data.billing_total_cents, subtotal_after: $.data.stage_cost_subtotal_cents }
          assert:
            - "while the first booking is RESERVED: Project.${proj_id}.stage_hours_reserved == 3.00, stage_hours_available == 37.00, stage_cost_subtotal_cents == 360000, billing_total_cents == 360000"
            - "MixStageBooking.${booking_one_id}.status == RELEASED with release_reason == 'client postponed the mix'"
            - "after the first release: Project.${proj_id}.stage_hours_reserved == 0.00 and stage_hours_available == 40.00"
            - "the second create on the SAME window succeeds (RELEASED bookings left the occupancy set)"
            - "MixStageBooking.${booking_two_id}.reserved_hours == 3.00"
            - "MixStageBooking.${booking_two_id}.status == RELEASED after the second release"
            - "final: Project.${proj_id}.stage_hours_reserved == 0.00"
            - "final: Project.${proj_id}.stage_hours_consumed == 0.00"
            - "final: Project.${proj_id}.stage_hours_available == 40.00 (exactly the pre-booking value, no drift)"
            - "final: GET /projects/${proj_id}/ledger .stage_cost_subtotal_cents == 0"
            - "final: GET /projects/${proj_id}/ledger .billing_total_cents == 0"
            - "GET /mix-bookings?project_id=${proj_id}&status=RELEASED returns exactly 2 bookings"

      - name: license_accrual_reversal_is_exact_and_never_negative
        grounds:
          - state_machines.LibraryAsset.ACTIVE_to_REVOKED
          - state_machines.AssetUsage.CLEARED_to_UNLICENSED
          - calculations.asset_usage_clearance
          - calculations.license_risk_score
          - calculations.project_billing_total
        distinguishing_aspect: |
          Revoking one asset must reverse exactly that asset's accrual and nothing else: the
          project's license_fee_accrued_cents falls 140000 -> 40000 (never below zero, never
          double-subtracted), the untouched second asset's usage keeps its 40000, the STALE stem
          package still contributes its 6000 conform fee, and the two risk variants move in
          opposite directions (intake 40.00 -> 20.00 as a cleared usage leaves, audit 40.00 -> 70.00
          as the unlicensed penalty lands).
        test_recipe:
          setup:
            - "Two RIGHTS_MANAGED WORLDWIDE assets with no expiry: asset A fee 25000, asset B fee 20000."
            - "Locked STANDARD project with one CONFORMED stem package (two 120-second cues, conform_fee_cents 6000)."
            - "Usage of asset A: 100 seconds -> 4 billable units -> 100000 cents, CLEARED."
            - "Usage of asset B: 60 seconds -> 2 billable units -> 40000 cents, CLEARED."
            - "Before the trigger: license_fee_accrued_cents 140000, billing_total_cents 146000, intake 40.00, audit 40.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "POST /library-assets"
              payload: { asset_code: "RM-A", kind: "MUSIC_LIBRARY", license_type: "RIGHTS_MANAGED", territory_scope: "WORLDWIDE", fee_cents: 25000 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { asset_a_id: $.data.id }
            - call: "POST /library-assets"
              payload: { asset_code: "RM-B", kind: "FOLEY", license_type: "RIGHTS_MANAGED", territory_scope: "WORLDWIDE", fee_cents: 20000 }
              as: FacilityAdmin
              as_user_id: "admin-1"
              captures: { asset_b_id: $.data.id }
            - call: "POST /projects"
              payload: { title: "Feature Upsilon", client_name: "Distributor Co", client_user_id: "client-user-1", delivery_deadline_utc: "2026-12-31T00:00:00Z", turnaround_class: "STANDARD", stage_hours_authorized: 40.00 }
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/picture-lock"
              payload: {}
              as: PostSupervisor
              as_user_id: "sup-1"
            - call: "POST /stem-packages"
              payload: { project_id: "${proj_id}", reel_label: "R1", stem_layout: "5_1", includes_me_stems: false }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_id: $.data.id, sp_v0: $.data.version }
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v0}", cue_number: "1M1", duration_seconds: 120, source: "LIBRARY" }
              as: SoundEditor
              as_user_id: "editor-1"
            - call: "GET /stem-packages/${sp_id}"
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { sp_v1: $.data.version }
            - call: "POST /stem-packages/${sp_id}/music-cues"
              payload: { expected_stem_package_version: "${sp_v1}", cue_number: "1M2", duration_seconds: 120, source: "LIBRARY" }
              as: SoundEditor
              as_user_id: "editor-1"
            - call: "POST /stem-packages/${sp_id}/conform"
              payload: {}
              as: SoundEditor
              as_user_id: "editor-1"
            - call: "POST /asset-usages"
              payload: { library_asset_id: "${asset_a_id}", stem_package_id: "${sp_id}", usage_seconds: 100, territory_declared: "WORLDWIDE" }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { usage_a_id: $.data.id, fee_a: $.data.accrued_fee_cents }
            - call: "POST /asset-usages"
              payload: { library_asset_id: "${asset_b_id}", stem_package_id: "${sp_id}", usage_seconds: 60, territory_declared: "WORLDWIDE" }
              as: SoundEditor
              as_user_id: "editor-1"
              captures: { usage_b_id: $.data.id, fee_b: $.data.accrued_fee_cents }
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { accrued_before: $.data.license_fee_accrued_cents, billing_before: $.data.billing_total_cents, intake_before: $.data.license_risk_score_intake, audit_before: $.data.license_risk_score_audit }
          trigger:
            - call: "POST /library-assets/${asset_a_id}/revoke"
              payload: { revocation_reason: "licence terminated by the publisher" }
              as: FacilityAdmin
              as_user_id: "admin-1"
            - call: "GET /projects/${proj_id}/ledger"
              as: PostSupervisor
              as_user_id: "sup-1"
              captures: { accrued_after: $.data.license_fee_accrued_cents, billing_after: $.data.billing_total_cents, intake_after: $.data.license_risk_score_intake, audit_after: $.data.license_risk_score_audit }
          assert:
            - "before the revoke: GET /projects/${proj_id}/ledger .license_fee_accrued_cents == 140000 and .billing_total_cents == 146000"
            - "AssetUsage.${usage_a_id}.accrued_fee_cents == 0 with clearance_status == UNLICENSED and unlicensed_reason == ASSET_REVOKED"
            - "AssetUsage.${usage_b_id}.accrued_fee_cents == 40000 with clearance_status == CLEARED (untouched)"
            - "LibraryAsset.${asset_b_id}.status == ACTIVE"
            - "GET /projects/${proj_id}/ledger .license_fee_accrued_cents == 40000 (exactly 140000 - 100000)"
            - "GET /projects/${proj_id}/ledger .license_fee_accrued_cents >= 0 (no double subtraction)"
            - "GET /projects/${proj_id}/ledger .conform_fee_total_cents == 6000 (the STALE package keeps its conform fee)"
            - "GET /projects/${proj_id}/ledger .billing_total_cents == 46000"
            - "GET /projects/${proj_id}/ledger .license_risk_score_intake == 20.00 (was 40.00)"
            - "GET /projects/${proj_id}/ledger .license_risk_score_audit == 70.00 (was 40.00)"
            - "StemPackage.${sp_id}.status == STALE with stale_reason == LICENSE_REVOKED"
            - "Project.${proj_id}.unlicensed_usage_count == 1 and Project.${proj_id}.posture == RESTRICTED"
