            - call: "POST /fleet/vehicles/${v2_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - call: "POST /fleet/vehicles/${v3_id}/stage"
              payload: { depot_id: "${d_id}" }
              as: FleetOperations
            - *c_cy1
            - *c_bs1
            - *c_sch1
            - *c_start1
            - *c_comp1
            - call: "POST /fleet/depots/${d_id}/cycles"
              payload: { vehicle_id: "${v2_id}", service_kind: "CHARGE" }
              as: DepotTechnician
              captures: { c2_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/bay-slots"
              payload: { service_type: "CHARGE", bay_index: 1, start_utc: "2026-06-01T00:00:00Z", duration_seconds: 1800, vehicle_id: "${v2_id}", cycle_id: "${c2_id}" }
              as: DepotTechnician
              captures: { bs2_id: $.data.id }
            - call: "POST /fleet/depots/${d_id}/cycles/${c2_id}/schedule"
