      - name: bid_revisions_on_unknown_parent_bid_return_bid_not_found
        claim_type: parent_relationships
        grounds:
          - entities.BidRevision.parent
          - endpoints[GET /bids/{id}/revisions]
          - endpoints[POST /bids/{id}/revisions]
          - validations[priority=8]
        distinguishing_aspect: |
          BidRevision is the one parented entity and it is addressed only under its parent's path, so
          every operation addressed under an unknown parent bid — the revisions collection read, submit
          and request-revision — fails with the parent's ERR_BID_NOT_FOUND at priority 8, before any
          state precondition (24) or OCC check (19) is consulted.
        test_recipe:
          setup:
            - "Empty database — no Bid row exists"
          setup_api_calls: []
          trigger:
            - call: "GET /bids/00000000-0000-0000-0000-0000000000d1/revisions"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { err_list_parent: $.data.error_id }
            - call: "POST /bids/00000000-0000-0000-0000-0000000000d1/submit"
              payload: {}
              as: SalesEngineer
              as_user_id: "sales-01"
              captures: { err_submit_parent: $.data.error_id }
            - call: "POST /bids/00000000-0000-0000-0000-0000000000d1/request-revision"
              payload: {}
              as: ContractsAdmin
              as_user_id: "contracts-01"
              captures: { err_reqrev_parent: $.data.error_id }
          assert:
            - "all three calls fail 404 ERR_BID_NOT_FOUND (priority 8), never a state or OCC error — existence outranks every business check"
            - "no BidRevision row is created and no Bid row comes into existence"

      - name: bus_unit_computed_configuration_fields_on_creation
