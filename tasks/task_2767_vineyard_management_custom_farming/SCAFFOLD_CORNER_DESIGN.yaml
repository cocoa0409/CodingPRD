            - "CustomFarmingContract.${c1_id}.contract_status == ACTIVE"
            - "CustomFarmingContract.${c1_id}.client_signature_name == Dana Ridgecrest"
            - "CustomFarmingContract.${c1_id}.version == 3"
            - "CustomFarmingContract.${c1_id}.enrolled_block_count == 1"
            - "CustomFarmingContract.${c1_id}.settled_period_count == 0"

      - name: contract_activate_without_enrolled_blocks_rejected
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=100]
          - errors[ERR_NO_ENROLLED_BLOCKS]
          - state_machines.CustomFarmingContract.DRAFT_to_ACTIVE
        distinguishing_aspect: "A DRAFT contract with enrolled_block_count 0 cannot be activated: POST /contracts/{id}/activate returns ERR_NO_ENROLLED_BLOCKS at HTTP 409 and contract_status stays DRAFT with version 1."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 that has NOT been enrolled."
            - "DRAFT contract C1 for that vineyard with enrolled_block_count 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /contracts"
              payload: { vineyard_id: "${v1_id}", per_acre_annual_fee: 950.00, cost_pass_through_pct: 0.08, quality_incentive_per_ton: 45.00, quality_brix_threshold: 24.5, period_overhead_pool: 1000.00, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /contracts/${c1_id}/activate"
              payload: { client_signature_name: "Dana Ridgecrest" }
              as: ClientOwner
              as_user_id: "${v1_id}"
              captures: { act_error: $.data.error_id }
            - call: "GET /contracts/${c1_id}"
              payload: {}
              as: Controller
              as_user_id: "u-ctl-1"
              captures: { c1_status: $.data.contract_status, c1_v: $.data.version }
          assert:
            - "HTTP status is 409"
            - "error_id == ERR_NO_ENROLLED_BLOCKS"
            - "CustomFarmingContract.${c1_id}.contract_status == DRAFT"
            - "CustomFarmingContract.${c1_id}.client_signature_name is null"
            - "CustomFarmingContract.${c1_id}.version == 1"

      - name: contract_activate_twice_returns_contract_not_draft
        claim_type: idempotency
        grounds:
          - validations[priority=60]
          - errors[ERR_CONTRACT_NOT_DRAFT]
          - state_machines.CustomFarmingContract.DRAFT_to_ACTIVE
        distinguishing_aspect: "The second POST /contracts/{id}/activate on the same contract returns ERR_CONTRACT_NOT_DRAFT at HTTP 409 and leaves version at 3 — activation is not idempotent-by-replay, it is state-guarded."
        test_recipe:
          setup:
            - "Vineyard Ridgecrest Ranch with block B-12 enrolled under contract C1, which has already been activated (version 3)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: VineyardManager
              as_user_id: "u-vm-1"
            - call: "POST /vineyards"
              payload: { name: "Ridgecrest Ranch", owner_legal_name: "Ridgecrest Vineyards LLC", ava_region: "Paso Robles", client_contact_email: "ops@ridgecrest.example" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /blocks"
              payload: { vineyard_id: "${v1_id}", block_code: "B-12", variety: "CABERNET_SAUVIGNON", clone: "FPS-08", rootstock: "ROOTSTOCK_1103P", trellis_system: "VSP", planting_year: 2018, vine_spacing_ft: 5.0, row_spacing_ft: 8.0, acres: 12.5 }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { b1_id: $.data.id }
            - call: "POST /contracts"
              payload: { vineyard_id: "${v1_id}", per_acre_annual_fee: 950.00, cost_pass_through_pct: 0.08, quality_incentive_per_ton: 45.00, quality_brix_threshold: 24.5, period_overhead_pool: 1000.00, period_start: "2026-01-01", period_end: "2026-12-31" }
              as: VineyardManager
              as_user_id: "u-vm-1"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts/${c1_id}/enroll-block"
              payload: { block_id: "${b1_id}", contracted_acres: 12.5 }
