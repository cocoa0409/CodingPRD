              as_user_id: "tech-rb5"
              captures: { cyc_rb5: $.data.id }
          trigger:
            - call: "POST /cleanroom/cleaning-cycles/${cyc_rb5}/verify"
              payload: {}
              as: QualityAssurance
              as_user_id: "tech-rb5"
              captures: { err_rb5: $.data.error_id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_rb5}/verify"
              payload: {}
              as: QualityAssurance
              as_user_id: "qa-rb5"
          assert:
            - "Verify by QualityAssurance carrying X-User-ID == performed_by (tech-rb5): HTTP 403 error_id == ERR_SEGREGATION_OF_DUTIES"
            - "Verify by QualityAssurance with X-User-ID qa-rb5 (!= tech-rb5): succeeds, CleaningCycle.${cyc_rb5}.status == VERIFIED AND verified_by_user_id == 'qa-rb5'"

  # ===========================================================================
  # Section: cross_cutting — complexity layers in play.
  # ===========================================================================
  - section: cross_cutting
    instances:
      - name: occ_stale_batch_version_on_release
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[batch-release-stale-batch]"
          - "errors[ERR_STALE_BATCH_VERSION]"
        distinguishing_aspect: "A release carrying expected_batch_version stale by one (captured before an intervening traveler completion bumped the batch) is rejected 412 ERR_STALE_BATCH_VERSION at priority 4, before any state check."
        test_recipe:
          setup: ["Room CR-X1 certified+cleaning+IN_CONTROL; batch B-X1 IN_PROGRESS with traveler step 1 COMPLETE and step 2 IN_PROGRESS; client captured batch version v after step 1 completed but before step 2 completes (completion bumps version)"]
          setup_api_calls:
            - call: "POST /cleanroom/rooms"
              payload: { room_code: "CR-X1", iso_class: "ISO_8", particle_alert_limit: 3500000, particle_action_limit: 3520000, viable_alert_limit: 100, viable_action_limit: 200, recert_interval_days: 180 }
              as: QualityAssurance
              captures: { room_x1: $.data.id, room_x1_v: $.data.version }
            - call: "POST /cleanroom/cleaning-programs"
              payload: { cleanroom_id: "${room_x1}", method_code: "MOP-X1", required_consecutive_passes: 1 }
              as: QualityAssurance
              captures: { prog_x1: $.data.id }
            - call: "POST /cleanroom/cleaning-programs/${prog_x1}/activate"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/cleaning-programs/${prog_x1}/cycles"
              payload: { result: "PASS" }
              as: EnvironmentTech
              captures: { cyc_x1: $.data.id }
            - call: "POST /cleanroom/cleaning-cycles/${cyc_x1}/verify"
              payload: {}
              as: QualityAssurance
            - call: "POST /cleanroom/rooms/${room_x1}/certifications"
              payload: { executed_at: "2026-08-01T00:00:00Z", location_mean_values: [10, 20], expected_room_version: "${room_x1_v}" }
              as: QualityAssurance
            - call: "POST /cleanroom/personnel"
              payload: { employee_code: "EMP-X1", full_name: "Ecks One", role_title: "Assembler" }
              as: QualityAssurance
              captures: { pers_x1: $.data.id }
            - call: "POST /cleanroom/gowning-qualifications"
              payload: { personnel_id: "${pers_x1}", cleanroom_id: "${room_x1}" }
              as: QualityAssurance
            - call: "POST /cleanroom/batches"
              payload: { cleanroom_id: "${room_x1}", batch_number: "B-X1", product_code: "PWB-X1" }
              as: ProductionOperator
              as_user_id: "op-x1"
              captures: { batch_x1: $.data.id }
            - call: "POST /cleanroom/batches/${batch_x1}/travelers"
              payload: { step_sequence: 1, step_description: "Step one" }
              as: ProductionOperator
              as_user_id: "op-x1"
              captures: { trav_x1a: $.data.id }
            - call: "POST /cleanroom/batches/${batch_x1}/travelers"
              payload: { step_sequence: 2, step_description: "Step two" }
              as: ProductionOperator
              as_user_id: "op-x1"
              captures: { trav_x1b: $.data.id }
            - call: "POST /cleanroom/travelers/${trav_x1a}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-x1"
            - call: "POST /cleanroom/travelers/${trav_x1a}/complete"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-x1"
            - call: "GET /cleanroom/batches/${batch_x1}"
              as: QualityAssurance
              captures: { batch_x1_v_stale: $.data.version }
            - call: "POST /cleanroom/travelers/${trav_x1b}/start"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-x1"
            - call: "POST /cleanroom/travelers/${trav_x1b}/complete"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-x1"
          trigger:
            - call: "POST /cleanroom/batches/${batch_x1}/release"
              payload: { expected_batch_version: "${batch_x1_v_stale}" }
              as: QualityAssurance
              as_user_id: "qa-x1"
              captures: { err_x1: $.data.error_id }
          assert:
            - "HTTP 412 error_id == ERR_STALE_BATCH_VERSION  (batch version advanced when step 2 completed and the batch auto-transitioned to COMPLETE)"
            - "AssemblyBatch.${batch_x1}.status == COMPLETE  (release did not fire)"

      - name: audit_scope_window_half_open_membership
        claim_type: derived_field_reconciliation
        grounds:
          - "calculations.audit_scope_record_count"
        distinguishing_aspect: "Samples at exactly window_start are IN scope, at exactly window_end are OUT (half-open [start, end)); the audit's scope count reflects this membership rule."
