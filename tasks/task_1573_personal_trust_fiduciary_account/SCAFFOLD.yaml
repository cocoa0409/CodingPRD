scenario: "Personal Trust & Fiduciary Account Administration (bank trust department): account acceptance & trust document interpretation, discretionary distribution request & committee approval, investment policy & fiduciary standard adherence, principal vs income allocation & accounting, beneficiary communication & annual statement, tax return (1041) coordination & filing, trustee fee calculation & disclosure, termination & final distribution"

domain_name: personal-trust-fiduciary
api_prefix: /trusts

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: TrustAccount
    parent: null
    common_fields: true
    fields:
      - { name: trust_name, type: string, source: input, description: "Legal name of the trust" }
      - { name: trust_type, type: enum, source: input, description: "REVOCABLE | IRREVOCABLE | TESTAMENTARY | CHARITABLE" }
      - { name: grantor_name, type: string, source: input, description: "Grantor / settlor full name" }
      - { name: governing_state, type: string, source: input, description: "Two-letter state code of governing law" }
      - { name: ein, type: string, source: input, description: "Trust employer identification number (XX-XXXXXXX)" }
      - { name: fiscal_year_end_month, type: integer, source: input, description: "Fiscal year end month 1-12; 12 means calendar tax year Jan 1 - Dec 31" }
      - { name: distribution_standard, type: enum, source: input, description: "HEMS | SUPPORT | DISCRETIONARY - governs permitted purpose_category values" }
      - { name: status, type: enum, source: system, description: "DRAFT | UNDER_ACCEPTANCE_REVIEW | ACCEPTANCE_DECLINED | ACTIVE | SUSPENDED | TERMINATING | TERMINATED | CLOSED" }
      - { name: accepted_at, type: datetime, source: system, description: "Set when status enters ACTIVE; null otherwise" }
      - { name: income_balance_cents, type: integer, source: computed, description: "Sum of LedgerEntry.amount_cents where bucket=INCOME; default 0" }
      - { name: principal_balance_cents, type: integer, source: computed, description: "Sum of LedgerEntry.amount_cents where bucket=PRINCIPAL; default 0" }
      - { name: reserved_income_cents, type: integer, source: computed, description: "Sum of income_portion_cents over DistributionRequests in {VOTING, APPROVED}; default 0" }
      - { name: reserved_principal_cents, type: integer, source: computed, description: "Sum of principal_portion_cents over DistributionRequests in {VOTING, APPROVED}; default 0" }
      - { name: available_income_cents, type: integer, source: computed, description: "= income_balance_cents - reserved_income_cents" }
      - { name: available_principal_cents, type: integer, source: computed, description: "= principal_balance_cents - reserved_principal_cents" }
      - { name: total_market_value_cents, type: integer, source: computed, description: "= sum(InvestmentHolding.market_value_cents over all holdings) + income_balance_cents + principal_balance_cents" }
      - { name: pending_distribution_count, type: integer, source: computed, description: "Count of DistributionRequests in {SUBMITTED, UNDER_REVIEW, INFORMATION_REQUESTED, VOTING, APPROVED}; mutation of this field bumps version" }

  - name: TrustDocument
    parent: null
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> TrustAccount.id; owning trust" }
      - { name: version_number, type: integer, source: input, description: "Document version; unique per trust_id" }
      - { name: prior_document_id, type: string, source: input, description: "FK -> TrustDocument.id; prior superseded version, null for v1" }
      - { name: summary, type: string, source: input, description: "Free-text instrument summary" }
      - { name: per_stirpes, type: boolean, source: input, description: "Set at interpretation: deceased shares pass to descendants (true) or lapse pro-rata to surviving class members (false)" }
      - { name: interpretation_notes, type: string, source: input, description: "Trust officer's recorded interpretation of dispositive provisions" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | INTERPRETED | APPROVED | REJECTED | SUPERSEDED" }
      - { name: submitted_at, type: datetime, source: system, description: "Set on DRAFT->SUBMITTED" }
      - { name: approved_at, type: datetime, source: system, description: "Set on INTERPRETED->APPROVED" }
      - { name: rejected_reason, type: string, source: system, description: "Recorded on INTERPRETED->REJECTED" }

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> TrustAccount.id; owning trust" }
      - { name: full_name, type: string, source: input, description: "Beneficiary legal name" }
      - { name: beneficiary_class, type: enum, source: input, description: "INCOME | REMAINDER" }
      - { name: share_bps, type: integer, source: input, description: "Share of class in basis points; ACTIVE members of a class must sum to exactly 10000" }
      - { name: date_of_birth, type: string, source: input, description: "ISO date YYYY-MM-DD" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DECEASED; default ACTIVE" }
      - { name: deceased_at, type: string, source: system, description: "Date of death recorded by mark-deceased" }

  - name: CommitteeMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Committee member name (bank-level trust committee)" }
      - { name: term_start, type: string, source: input, description: "ISO date, service term start" }
      - { name: term_end, type: string, source: input, description: "ISO date, service term end" }
      - { name: status, type: enum, source: system, description: "ACTIVE | INACTIVE; default ACTIVE" }

  - name: DistributionRequest
    parent: null
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> TrustAccount.id; owning trust" }
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; requesting beneficiary" }
      - { name: amount_cents, type: integer, source: input, description: "Requested gross amount; must be > 0" }
      - { name: allocation_source, type: enum, source: input, description: "INCOME_ONLY | PRINCIPAL_ONLY | INCOME_FIRST | PRINCIPAL_FIRST" }
      - { name: purpose_category, type: enum, source: input, description: "HEALTH | EDUCATION | MAINTENANCE | SUPPORT | TRAVEL | LUXURY | OTHER" }
      - { name: purpose_note, type: string, source: input, description: "Free-text purpose detail" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | INFORMATION_REQUESTED | VOTING | APPROVED | DECLINED | DISBURSED | WITHDRAWN | CANCELLED" }
      - { name: income_portion_cents, type: integer, source: computed, description: "Reserved from income at open-voting per allocation_source waterfall; 0 until VOTING" }
      - { name: principal_portion_cents, type: integer, source: computed, description: "Reserved from principal at open-voting; 0 until VOTING" }
      - { name: approve_count, type: integer, source: computed, description: "CommitteeVote APPROVE tally; reset at open-voting" }
      - { name: decline_count, type: integer, source: computed, description: "CommitteeVote DECLINE tally" }
      - { name: abstain_count, type: integer, source: computed, description: "CommitteeVote ABSTAIN tally" }
      - { name: committee_size_snapshot, type: integer, source: computed, description: "Count of ACTIVE CommitteeMembers captured at open-voting" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the TrustOfficer who opened voting" }
      - { name: decision_at, type: datetime, source: system, description: "Set when status enters APPROVED or DECLINED" }
      - { name: disbursed_at, type: datetime, source: system, description: "Set on APPROVED->DISBURSED" }
      - { name: cancelled_reason, type: string, source: system, description: "Recorded on any transition into CANCELLED" }

  - name: CommitteeVote
    parent: null
    common_fields: false
    fields:
      - { name: distribution_request_id, type: string, source: input, description: "FK -> DistributionRequest.id; request voted on" }
      - { name: committee_member_id, type: string, source: system, description: "FK -> CommitteeMember.id; equals X-User-ID header of the casting CommitteeMember" }
      - { name: vote, type: enum, source: input, description: "APPROVE | DECLINE | ABSTAIN" }

  - name: InvestmentPolicyStatement
    parent: null
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> TrustAccount.id; owning trust" }
      - { name: effective_from, type: string, source: input, description: "ISO date; half-open window start (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "ISO date; half-open window end (exclusive); windows may abut (a.effective_to == b.effective_from) but never overlap" }
      - { name: equity_target_pct, type: number, source: input, description: "Target equity weight percent, e.g. 60.00" }
      - { name: equity_band_pct, type: number, source: input, description: "Tolerance band +/- percent around equity target" }
      - { name: fixed_income_target_pct, type: number, source: input, description: "Target fixed-income weight percent" }
      - { name: fixed_income_band_pct, type: number, source: input, description: "Tolerance band +/- percent around fixed-income target" }
      - { name: alternatives_allowed, type: boolean, source: input, description: "Whether ALTERNATIVE asset class holdings are permitted" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUPERSEDED" }
      - { name: activated_at, type: datetime, source: system, description: "Set on DRAFT->ACTIVE" }

  - name: InvestmentHolding
    parent: null
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> TrustAccount.id; owning trust" }
      - { name: asset_class, type: enum, source: input, description: "EQUITY | FIXED_INCOME | CASH_EQUIVALENT | ALTERNATIVE" }
      - { name: ticker, type: string, source: input, description: "Security ticker; unique per trust (purchases merge into the existing row with same ticker)" }
      - { name: units, type: integer, source: input, description: "Whole units held; > 0 at purchase" }
      - { name: unit_price_cents, type: integer, source: input, description: "Latest known price per unit in cents" }
      - { name: market_value_cents, type: integer, source: computed, description: "= units * unit_price_cents (exact integer)" }
      - { name: cost_basis_cents, type: integer, source: computed, description: "Accumulated purchase cost; reduced pro-rata on sell (round_half_up on basis * units_sold / units_before)" }
      - { name: priced_at, type: datetime, source: system, description: "Timestamp associated with the latest unit_price_cents (create time or update-price priced_at)" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED; CLOSED when units reach 0; a later purchase of the same ticker reopens" }

  - name: ComplianceReview
    parent: null
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: system, description: "FK -> TrustAccount.id; owning trust" }
      - { name: investment_policy_statement_id, type: string, source: system, description: "FK -> InvestmentPolicyStatement.id; the ACTIVE IPS breached" }
      - { name: asset_class, type: enum, source: system, description: "Asset class whose measured weight breached its band" }
      - { name: direction, type: enum, source: computed, description: "OVERWEIGHT (raw > target+band) | UNDERWEIGHT (raw < target-band); only OVERWEIGHT reviews block new purchases of the class" }
      - { name: measured_weight_pct, type: number, source: computed, description: "Display value: round_half_up(raw_ratio * 100, 2); breach comparison uses the UNROUNDED ratio" }
      - { name: band_limit_pct, type: number, source: computed, description: "The band edge breached: target + band (overweight) or target - band (underweight)" }
      - { name: severity, type: enum, source: computed, description: "CRITICAL only when OVERWEIGHT and unrounded weight > target + 2*band; all other breaches are STANDARD" }
      - { name: status, type: enum, source: system, description: "OPEN | REMEDIATION_PLANNED | ESCALATED | RESOLVED" }
      - { name: remediation_note, type: string, source: input, description: "Remediation plan text recorded at plan-remediation" }
      - { name: resolved_at, type: datetime, source: system, description: "Set on transition to RESOLVED" }

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> TrustAccount.id; owning trust" }
      - { name: entry_kind, type: enum, source: input, description: "RECEIPT | DISBURSEMENT | FEE | DISTRIBUTION | TAX_PAYMENT | INVESTMENT_PURCHASE | INVESTMENT_SALE | ADJUSTMENT" }
      - { name: bucket, type: enum, source: system, description: "INCOME | PRINCIPAL; derived from receipt_type for RECEIPT rows, explicit input only for ADJUSTMENT rows" }
      - { name: amount_cents, type: integer, source: input, description: "Signed amount; receipts positive, disbursements/fees/distributions negative" }
      - { name: receipt_type, type: enum, source: input, description: "INITIAL_FUNDING | INTEREST | ORDINARY_DIVIDEND | RENTAL_INCOME | MINERAL_ROYALTY | CAPITAL_GAIN_DISTRIBUTION | SALE_PROCEEDS; required when entry_kind=RECEIPT" }
      - { name: value_date, type: string, source: input, description: "ISO date the entry is effective for fiscal-year attribution" }
      - { name: description, type: string, source: input, description: "Free-text memo" }
      - { name: source_entity_type, type: enum, source: system, description: "DISTRIBUTION_REQUEST | FEE_ASSESSMENT | TAX_RETURN_FILING | TERMINATION_CASE | INVESTMENT_HOLDING | MANUAL; polymorphic tag" }
      - { name: source_entity_id, type: string, source: system, description: "Polymorphic reference id (no FK constraint; resolved via source_entity_type), null for MANUAL" }

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> TrustAccount.id; owning trust" }
      - { name: period_start, type: string, source: input, description: "ISO date, closed interval start" }
      - { name: period_end, type: string, source: input, description: "ISO date, closed interval end" }
      - { name: variant, type: enum, source: input, description: "PROVISIONAL (base = current total_market_value at calculation time) | FINAL (base = market value as of period_end using latest priced_at <= period_end)" }
      - { name: base_market_value_cents, type: integer, source: computed, description: "Fee base per variant rule" }
      - { name: annual_fee_cents, type: integer, source: computed, description: "Tiered annual fee before quartering" }
      - { name: assessed_fee_cents, type: integer, source: computed, description: "round_half_up(annual_fee/4), floored at MIN_QUARTERLY_FEE_CENTS" }
      - { name: income_portion_cents, type: integer, source: computed, description: "round_half_up(assessed_fee_cents * 0.5)" }
      - { name: principal_portion_cents, type: integer, source: computed, description: "= assessed_fee_cents - income_portion_cents" }
      - { name: status, type: enum, source: system, description: "CALCULATED | DISCLOSED | DISPUTED | POSTED | REVERSED" }
      - { name: calculated_by_user_id, type: string, source: system, description: "X-User-ID of creator" }
      - { name: disclosed_by_user_id, type: string, source: system, description: "X-User-ID of discloser; poster must differ (segregation of duties)" }
      - { name: posted_by_user_id, type: string, source: system, description: "X-User-ID of poster" }
      - { name: disclosed_at, type: datetime, source: system, description: "Set on CALCULATED->DISCLOSED; objection window measured from here" }
      - { name: dispute_reason, type: string, source: input, description: "Beneficiary objection text" }

  - name: AnnualStatement
    parent: null
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> TrustAccount.id; owning trust" }
      - { name: fiscal_year, type: integer, source: input, description: "Calendar fiscal year, e.g. 2026 (fiscal_year_end_month=12)" }
      - { name: opening_income_cents, type: integer, source: computed, description: "Sum of INCOME LedgerEntry.amount_cents with value_date < fiscal_year-01-01" }
      - { name: opening_principal_cents, type: integer, source: computed, description: "Same window, bucket=PRINCIPAL" }
      - { name: receipts_income_cents, type: integer, source: computed, description: "Sum of positive INCOME entries with value_date in [fiscal_year-01-01, fiscal_year-12-31]" }
      - { name: receipts_principal_cents, type: integer, source: computed, description: "Same window, bucket=PRINCIPAL" }
      - { name: disbursements_cents, type: integer, source: computed, description: "Absolute sum of negative non-DISTRIBUTION, non-FEE entries in the year window" }
      - { name: fees_cents, type: integer, source: computed, description: "Absolute sum of FEE entries in the year window" }
      - { name: distributions_cents, type: integer, source: computed, description: "Absolute sum of DISTRIBUTION entries in the year window" }
      - { name: closing_income_cents, type: integer, source: computed, description: "= opening_income_cents + all signed INCOME entries in the year window" }
      - { name: closing_principal_cents, type: integer, source: computed, description: "Same, bucket=PRINCIPAL" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | DELIVERED | ACKNOWLEDGED | DISPUTED | SUPERSEDED" }
      - { name: delivered_at, type: datetime, source: system, description: "Set on FINALIZED->DELIVERED; objection window measured from here" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Set on DELIVERED->ACKNOWLEDGED" }
      - { name: dispute_reason, type: string, source: input, description: "Beneficiary objection text" }

  - name: TaxReturnFiling
    parent: null
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> TrustAccount.id; owning trust" }
      - { name: tax_year, type: integer, source: input, description: "Form 1041 tax year; one filing per (trust_id, tax_year) ever" }
      - { name: tentative_dni_cents, type: integer, source: computed, description: "TENTATIVE variant: DNI over entries posted at compute-tentative time" }
      - { name: dni_cents, type: integer, source: computed, description: "FINAL variant: distributable net income computed at prepare time" }
      - { name: elected_65day_amount_cents, type: integer, source: input, description: "Amount of next-year distributions elected into tax_year (65-day rule); default 0" }
      - { name: distribution_deduction_cents, type: integer, source: computed, description: "= min(dni_cents, distributions disbursed in tax_year + elected_65day_amount_cents)" }
      - { name: exemption_cents, type: integer, source: computed, description: "Complex-trust exemption, constant 30000 cents" }
      - { name: trust_taxable_income_cents, type: integer, source: computed, description: "= dni_cents - distribution_deduction_cents - exemption_cents" }
      - { name: status, type: enum, source: system, description: "DATA_COLLECTION | PREPARED | UNDER_REVIEW | FILED | ACCEPTED | AMENDMENT_REQUIRED" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of preparer; reviewer must differ (segregation of duties)" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewing TaxSpecialist" }
      - { name: amendment_number, type: integer, source: system, description: "0 on initial filing; incremented by begin-amendment" }
      - { name: filed_at, type: datetime, source: system, description: "Set on UNDER_REVIEW->FILED" }
      - { name: accepted_at, type: datetime, source: system, description: "Set on FILED->ACCEPTED" }

  - name: TerminationCase
    parent: null
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: system, description: "FK -> TrustAccount.id; created by POST /trusts/{id}/terminate" }
      - { name: status, type: enum, source: system, description: "INITIATED | LIABILITIES_RESERVED | TAX_CLEARANCE_RECEIVED | FINAL_ACCOUNTING_APPROVED | DISTRIBUTED | CLOSED" }
      - { name: reason, type: string, source: input, description: "Termination reason recorded at initiation" }
      - { name: initiated_by_user_id, type: string, source: system, description: "X-User-ID of the terminator; final-accounting approver must differ (segregation of duties)" }
      - { name: reserve_taxes_cents, type: integer, source: input, description: "Reserve withheld from principal for final taxes" }
      - { name: reserve_fees_cents, type: integer, source: input, description: "Reserve withheld from principal for final trustee fees" }
      - { name: distributable_income_cents, type: integer, source: computed, description: "= income_balance_cents at distribute time (income class)" }
      - { name: distributable_principal_cents, type: integer, source: computed, description: "= principal_balance_cents - reserve_taxes_cents - reserve_fees_cents at distribute time (remainder class)" }
      - { name: distribution_lines, type: array, source: computed, description: "Per-beneficiary payout lines [{beneficiary_id, beneficiary_class, amount_cents}], income class first, then remainder class, each ordered by beneficiary created_at ASC" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of final-accounting approver" }
      - { name: distributed_at, type: datetime, source: system, description: "Set on FINAL_ACCOUNTING_APPROVED->DISTRIBUTED" }

state_machines:
  - entity: TrustAccount
    initial_state: DRAFT
    terminal_states: [ACCEPTANCE_DECLINED, CLOSED]
    transitions:
      - from: DRAFT
        to: UNDER_ACCEPTANCE_REVIEW
        trigger: POST /trusts/{id}/submit-for-acceptance
        actor: TrustOfficer
        preconditions: []
        side_effects: ["TrustAccount.version increments by 1"]
      - from: UNDER_ACCEPTANCE_REVIEW
        to: ACTIVE
        trigger: POST /trusts/{id}/accept
        actor: TrustExecutive
        preconditions:
          - "At least one TrustDocument with trust_id = this trust has status APPROVED (ERR_DOCUMENT_NOT_APPROVED)"
          - "For every beneficiary_class with >=1 ACTIVE Beneficiary, sum(share_bps over ACTIVE members of that class) == 10000 (ERR_SHARE_SUM_INVALID)"
        side_effects:
          - "accepted_at = current clock"
          - "TrustAccount.version increments by 1"
      - from: UNDER_ACCEPTANCE_REVIEW
        to: ACCEPTANCE_DECLINED
        trigger: POST /trusts/{id}/decline-acceptance
        actor: TrustExecutive
        preconditions: []
        side_effects: ["TrustAccount.version increments by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /trusts/{id}/suspend OR system (automatic when a ComplianceReview with severity CRITICAL is created)"
        actor: TrustExecutive
        preconditions: []
        side_effects:
          - "TrustAccount.version increments by 1"
          - "note: suspension does NOT cancel non-terminal DistributionRequests; it blocks open-voting, disburse, holdings purchase, and ledger posting"
      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /trusts/{id}/reinstate
        actor: TrustExecutive
        preconditions:
          - "Zero ComplianceReviews with trust_id = this trust and status in {OPEN, REMEDIATION_PLANNED, ESCALATED} (ERR_UNRESOLVED_COMPLIANCE_REVIEWS)"
        side_effects: ["TrustAccount.version increments by 1"]
      - from: ACTIVE
        to: TERMINATING
        trigger: POST /trusts/{id}/terminate
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "Cascade hop 1: every DistributionRequest of this trust in {SUBMITTED, UNDER_REVIEW, INFORMATION_REQUESTED, VOTING, APPROVED} transitions to CANCELLED with cancelled_reason=TRUST_TERMINATING"
          - "Cascade hop 2: each such cancellation releases its reservation, recomputing reserved_income_cents/reserved_principal_cents (and therefore available_*); pending_distribution_count becomes 0"
          - "Cascade hop 3: a TerminationCase is created in INITIATED with initiated_by_user_id = X-User-ID, using the post-release balances as its starting snapshot inputs"
          - "TrustAccount.version increments by 1"
      - from: TERMINATING
        to: TERMINATED
        trigger: "system (automatic when the linked TerminationCase reaches DISTRIBUTED)"
        actor: system
        preconditions: ["TerminationCase.trust_id = this trust reaches DISTRIBUTED"]
        side_effects: ["TrustAccount.version increments by 1"]
      - from: TERMINATED
        to: CLOSED
        trigger: "system (automatic when the linked TerminationCase reaches CLOSED)"
        actor: system
        preconditions: ["TerminationCase.trust_id = this trust reaches CLOSED"]
        side_effects: ["TrustAccount.version increments by 1"]

  - entity: TrustDocument
    initial_state: DRAFT
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /trusts/documents/{id}/submit
        actor: TrustOfficer
        preconditions: ["TrustAccount of trust_id is in {DRAFT, UNDER_ACCEPTANCE_REVIEW, ACTIVE} (ERR_TRUST_NOT_ACTIVE otherwise)"]
        side_effects: ["submitted_at = current clock"]
      - from: SUBMITTED
        to: INTERPRETED
        trigger: POST /trusts/documents/{id}/interpret
        actor: TrustOfficer
        preconditions: []
        side_effects: ["per_stirpes and interpretation_notes recorded"]
      - from: INTERPRETED
        to: APPROVED
        trigger: POST /trusts/documents/{id}/approve
        actor: TrustExecutive
        preconditions: []
        side_effects:
          - "Any other TrustDocument of the same trust_id in APPROVED transitions to SUPERSEDED"
          - "approved_at = current clock"
      - from: INTERPRETED
        to: REJECTED
        trigger: POST /trusts/documents/{id}/reject-interpretation
        actor: TrustExecutive
        preconditions: []
        side_effects: ["rejected_reason recorded"]
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when another TrustDocument of the same trust_id is APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Beneficiary
    initial_state: ACTIVE
    terminal_states: [DECEASED]
    transitions:
      - from: ACTIVE
        to: DECEASED
        trigger: POST /trusts/beneficiaries/{id}/mark-deceased
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "deceased_at recorded"
          - "Cascade hop 1: this beneficiary's DistributionRequests in {SUBMITTED, UNDER_REVIEW, INFORMATION_REQUESTED, VOTING, APPROVED} transition to CANCELLED with cancelled_reason=BENEFICIARY_DECEASED"
          - "Cascade hop 2: each cancellation releases its income/principal reservation on TrustAccount (reserved_* recomputed)"
          - "Cascade hop 3: if the APPROVED TrustDocument of the trust has per_stirpes=false, share_reallocation runs over the deceased's class (surviving ACTIVE members absorb the share; sum of share_bps stays 10000); if per_stirpes=true, shares are unchanged"

  - entity: CommitteeMember
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: POST /trusts/committee-members/{id}/deactivate
        actor: TrustExecutive
        preconditions: []
        side_effects: ["Existing CommitteeVotes already cast remain counted; the member can no longer cast new votes"]

  - entity: DistributionRequest
    initial_state: SUBMITTED
    terminal_states: [DECLINED, DISBURSED, WITHDRAWN, CANCELLED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: POST /trusts/distribution-requests/{id}/start-review
        actor: TrustOfficer
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: INFORMATION_REQUESTED
        trigger: POST /trusts/distribution-requests/{id}/request-information
        actor: TrustOfficer
        preconditions: []
        side_effects: []
      - from: INFORMATION_REQUESTED
        to: UNDER_REVIEW
        trigger: POST /trusts/distribution-requests/{id}/provide-information
        actor: Beneficiary
        preconditions: ["X-User-ID == beneficiary_id of the request (ERR_NOT_OWN_RESOURCE)"]
        side_effects: []
        note: "UNDER_REVIEW -> INFORMATION_REQUESTED -> UNDER_REVIEW is an unbounded cycle"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /trusts/distribution-requests/{id}/withdraw
        actor: Beneficiary
        preconditions: ["X-User-ID == beneficiary_id (ERR_NOT_OWN_RESOURCE)"]
        side_effects: ["TrustAccount.pending_distribution_count decrements by 1; TrustAccount.version increments by 1"]
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: POST /trusts/distribution-requests/{id}/withdraw
        actor: Beneficiary
        preconditions: ["X-User-ID == beneficiary_id (ERR_NOT_OWN_RESOURCE)"]
        side_effects: ["TrustAccount.pending_distribution_count decrements by 1; TrustAccount.version increments by 1"]
      - from: INFORMATION_REQUESTED
        to: WITHDRAWN
        trigger: POST /trusts/distribution-requests/{id}/withdraw
        actor: Beneficiary
        preconditions: ["X-User-ID == beneficiary_id (ERR_NOT_OWN_RESOURCE)"]
        side_effects: ["TrustAccount.pending_distribution_count decrements by 1; TrustAccount.version increments by 1"]
      - from: UNDER_REVIEW
        to: VOTING
        trigger: POST /trusts/distribution-requests/{id}/open-voting
        actor: TrustOfficer
        preconditions:
          - "TrustAccount.status == ACTIVE (ERR_TRUST_NOT_ACTIVE)"
          - "Beneficiary.status == ACTIVE (ERR_BENEFICIARY_NOT_ACTIVE)"
          - "purpose_category is permitted by trust.distribution_standard: HEMS permits {HEALTH, EDUCATION, MAINTENANCE, SUPPORT}; SUPPORT permits {HEALTH, MAINTENANCE, SUPPORT}; DISCRETIONARY permits all (ERR_PURPOSE_OUTSIDE_STANDARD)"
          - "Count of CommitteeMembers with status ACTIVE >= 3 (ERR_COMMITTEE_QUORUM_UNAVAILABLE)"
          - "Reservation waterfall per allocation_source succeeds against available_income_cents/available_principal_cents (ERR_INSUFFICIENT_AVAILABLE_BALANCE): INCOME_ONLY requires amount <= available_income; PRINCIPAL_ONLY requires amount <= available_principal; INCOME_FIRST reserves min(amount, available_income) from income and the remainder from principal, requiring remainder <= available_principal; PRINCIPAL_FIRST mirrors"
        side_effects:
          - "income_portion_cents / principal_portion_cents set per the reservation waterfall"
          - "TrustAccount.reserved_income_cents += income_portion_cents; reserved_principal_cents += principal_portion_cents; available_* recomputed; TrustAccount.version increments by 1"
          - "committee_size_snapshot = count of ACTIVE CommitteeMembers; approve_count/decline_count/abstain_count = 0; opened_by_user_id recorded"
      - from: VOTING
        to: APPROVED
        trigger: "system (automatic inside POST /trusts/distribution-requests/{id}/vote when approve_count reaches quorum)"
        actor: system
        preconditions: ["approve_count >= 3 after tallying the just-cast vote"]
        side_effects:
          - "decision_at = current clock; reservation remains in place"
      - from: VOTING
        to: DECLINED
        trigger: "system (automatic inside POST /trusts/distribution-requests/{id}/vote when decline_count reaches 3, or when total votes cast == committee_size_snapshot and approve_count < 3)"
        actor: system
        preconditions: []
        side_effects:
          - "decision_at = current clock"
          - "Reservation released: TrustAccount.reserved_* reduced by this request's portions; available_* recomputed; TrustAccount.version increments by 1; pending_distribution_count decrements by 1"
      - from: APPROVED
        to: DISBURSED
        trigger: POST /trusts/distribution-requests/{id}/disburse
        actor: TrustOperationsOfficer
        preconditions:
          - "Request status == APPROVED (ERR_REQUEST_NOT_APPROVED)"
          - "TrustAccount.status == ACTIVE (ERR_TRUST_NOT_ACTIVE)"
        side_effects:
          - "Cascade hop 1: LedgerEntry rows appended - one DISTRIBUTION/INCOME row of -income_portion_cents when > 0 and one DISTRIBUTION/PRINCIPAL row of -principal_portion_cents when > 0, value_date = current clock date, source_entity_type=DISTRIBUTION_REQUEST"
          - "Cascade hop 2: TrustAccount income_balance_cents/principal_balance_cents recomputed from the ledger; reserved_* released for this request; pending_distribution_count decrements; TrustAccount.version increments by 1"
          - "Cascade hop 3: every AnnualStatement of this trust in {DRAFT, FINALIZED} whose fiscal_year contains the disbursement value_date transitions to SUPERSEDED (stale totals)"
          - "disbursed_at = current clock"
      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /trusts/distribution-requests/{id}/cancel OR system (trust terminate / beneficiary deceased)
        actor: TrustOfficer
        preconditions: []
        side_effects: ["pending_distribution_count decrements; TrustAccount.version increments by 1"]
      - from: UNDER_REVIEW
        to: CANCELLED
        trigger: POST /trusts/distribution-requests/{id}/cancel OR system
        actor: TrustOfficer
        preconditions: []
        side_effects: ["pending_distribution_count decrements; TrustAccount.version increments by 1"]
      - from: INFORMATION_REQUESTED
        to: CANCELLED
        trigger: POST /trusts/distribution-requests/{id}/cancel OR system
        actor: TrustOfficer
        preconditions: []
        side_effects: ["pending_distribution_count decrements; TrustAccount.version increments by 1"]
      - from: VOTING
        to: CANCELLED
        trigger: POST /trusts/distribution-requests/{id}/cancel OR system
        actor: TrustOfficer
        preconditions: []
        side_effects: ["Reservation released (reserved_* reduced, available_* recomputed); pending_distribution_count decrements; TrustAccount.version increments by 1"]
      - from: APPROVED
        to: CANCELLED
        trigger: POST /trusts/distribution-requests/{id}/cancel OR system
        actor: TrustOfficer
        preconditions: []
        side_effects: ["Reservation released (reserved_* reduced, available_* recomputed); pending_distribution_count decrements; TrustAccount.version increments by 1"]

  - entity: InvestmentPolicyStatement
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: POST /trusts/investment-policy-statements/{id}/activate
        actor: InvestmentManager
        preconditions:
          - "Half-open window [effective_from, effective_to) does not overlap any OTHER statement of the same trust in {DRAFT, ACTIVE} (ERR_IPS_PERIOD_OVERLAP); abutting windows (a.effective_to == b.effective_from) are permitted"
          - "TrustAccount.status in {ACTIVE, SUSPENDED} (ERR_TRUST_NOT_ACTIVE otherwise)"
        side_effects:
          - "The currently ACTIVE statement of the same trust (if any) transitions to SUPERSEDED"
          - "activated_at = current clock; an immediate drift check runs (ips_drift_measurement), opening a ComplianceReview per breaching class"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when another statement of the same trust is activated)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InvestmentHolding
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: POST /trusts/investment-holdings/{id}/sell (units == current units)
        actor: InvestmentManager
        preconditions: []
        side_effects: ["units = 0; market_value_cents = 0"]
      - from: CLOSED
        to: OPEN
        trigger: POST /trusts/investment-holdings (purchase of same ticker for same trust merges and reopens)
        actor: InvestmentManager
        preconditions: []
        side_effects: ["units/cost_basis accumulate; unit_price_cents set to purchase price"]

  - entity: ComplianceReview
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: REMEDIATION_PLANNED
        trigger: POST /trusts/compliance-reviews/{id}/plan-remediation
        actor: InvestmentManager
        preconditions: []
        side_effects: ["remediation_note recorded"]
      - from: REMEDIATION_PLANNED
        to: RESOLVED
        trigger: POST /trusts/compliance-reviews/{id}/resolve
        actor: InvestmentManager
        preconditions: ["Current unrounded weight of asset_class is back within [target - band, target + band] inclusive (ERR_DRIFT_STILL_BREACHED)"]
        side_effects: ["resolved_at = current clock"]
      - from: OPEN
        to: RESOLVED
        trigger: POST /trusts/compliance-reviews/{id}/resolve
        actor: InvestmentManager
        preconditions: ["Current unrounded weight of asset_class is back within band inclusive (ERR_DRIFT_STILL_BREACHED)"]
        side_effects: ["resolved_at = current clock"]
      - from: OPEN
        to: ESCALATED
        trigger: POST /trusts/compliance-reviews/{id}/escalate
        actor: TrustExecutive
        preconditions: []
        side_effects: []
      - from: REMEDIATION_PLANNED
        to: ESCALATED
        trigger: POST /trusts/compliance-reviews/{id}/escalate
        actor: TrustExecutive
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: RESOLVED
        trigger: POST /trusts/compliance-reviews/{id}/resolve
        actor: InvestmentManager
        preconditions: ["Current unrounded weight of asset_class is back within band inclusive (ERR_DRIFT_STILL_BREACHED)"]
        side_effects: ["resolved_at = current clock"]

  - entity: FeeAssessment
    initial_state: CALCULATED
    terminal_states: [REVERSED]
    transitions:
      - from: CALCULATED
        to: DISCLOSED
        trigger: POST /trusts/fee-assessments/{id}/disclose
        actor: TrustOperationsOfficer
        preconditions: []
        side_effects: ["disclosed_by_user_id = X-User-ID; disclosed_at = current clock"]
      - from: DISCLOSED
        to: POSTED
        trigger: POST /trusts/fee-assessments/{id}/post
        actor: TrustOperationsOfficer
        preconditions:
          - "X-User-ID != disclosed_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "income_portion_cents <= TrustAccount.available_income_cents AND principal_portion_cents <= TrustAccount.available_principal_cents (ERR_FEE_EXCEEDS_AVAILABLE_BALANCE)"
        side_effects:
          - "LedgerEntry FEE/INCOME row of -income_portion_cents and FEE/PRINCIPAL row of -principal_portion_cents appended (source_entity_type=FEE_ASSESSMENT)"
          - "TrustAccount balances and available_* recomputed; TrustAccount.version increments by 1; posted_by_user_id recorded"
          - "Every AnnualStatement of this trust in {DRAFT, FINALIZED} whose fiscal_year contains value_date of the new entries transitions to SUPERSEDED"
      - from: DISCLOSED
        to: DISPUTED
        trigger: POST /trusts/fee-assessments/{id}/dispute
        actor: Beneficiary
        preconditions:
          - "X-User-ID is the id of an ACTIVE Beneficiary of the same trust (ERR_NOT_OWN_RESOURCE)"
          - "current clock <= disclosed_at + 30 days (ERR_OBJECTION_WINDOW_EXPIRED)"
        side_effects: ["dispute_reason recorded"]
      - from: DISPUTED
        to: CALCULATED
        trigger: POST /trusts/fee-assessments/{id}/recalculate
        actor: TrustOperationsOfficer
        preconditions: []
        side_effects: ["All computed amount fields recalculated per trustee_fee_assessment with current inputs; disclosed_* cleared"]
        note: "DISCLOSED -> DISPUTED -> CALCULATED is an unbounded recalculation cycle"
      - from: POSTED
        to: REVERSED
        trigger: POST /trusts/fee-assessments/{id}/reverse
        actor: TrustExecutive
        preconditions: []
        side_effects:
          - "Offsetting LedgerEntry ADJUSTMENT rows appended: +income_portion_cents to INCOME and +principal_portion_cents to PRINCIPAL (source_entity_type=FEE_ASSESSMENT)"
          - "TrustAccount balances recomputed; net effect of post+reverse on every balance is exactly zero; TrustAccount.version increments by 1"

  - entity: AnnualStatement
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: POST /trusts/annual-statements/{id}/finalize
        actor: TrustOfficer
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: DELIVERED
        trigger: POST /trusts/annual-statements/{id}/deliver
        actor: TrustOfficer
        preconditions: []
        side_effects: ["delivered_at = current clock"]
      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: POST /trusts/annual-statements/{id}/acknowledge
        actor: Beneficiary
        preconditions: ["X-User-ID is the id of an ACTIVE Beneficiary of the same trust (ERR_NOT_OWN_RESOURCE)"]
        side_effects: ["acknowledged_at = current clock"]
      - from: DELIVERED
        to: DISPUTED
        trigger: POST /trusts/annual-statements/{id}/dispute
        actor: Beneficiary
        preconditions:
          - "X-User-ID is the id of an ACTIVE Beneficiary of the same trust (ERR_NOT_OWN_RESOURCE)"
          - "current clock <= delivered_at + 30 days (ERR_OBJECTION_WINDOW_EXPIRED)"
        side_effects: ["dispute_reason recorded"]
      - from: DISPUTED
        to: DRAFT
        trigger: POST /trusts/annual-statements/{id}/regenerate
        actor: TrustOfficer
        preconditions: []
        side_effects: ["All computed totals recomputed from the current ledger per statement_totals; delivered_at/dispute_reason cleared"]
        note: "DELIVERED -> DISPUTED -> DRAFT is an unbounded regeneration cycle"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a LedgerEntry with value_date inside this statement's fiscal_year is appended by any workflow)"
        actor: system
        preconditions: []
        side_effects: []
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (same staleness rule as DRAFT -> SUPERSEDED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TaxReturnFiling
    initial_state: DATA_COLLECTION
    terminal_states: [ACCEPTED]
    transitions:
      - from: DATA_COLLECTION
        to: DATA_COLLECTION
        trigger: POST /trusts/tax-return-filings/{id}/compute-tentative
        actor: TaxSpecialist
        preconditions: []
        side_effects: ["tentative_dni_cents recomputed (TENTATIVE variant of dni_and_distribution_deduction)"]
      - from: DATA_COLLECTION
        to: PREPARED
        trigger: POST /trusts/tax-return-filings/{id}/prepare
        actor: TaxSpecialist
        preconditions:
          - "Every FeeAssessment of this trust with variant=FINAL, status not REVERSED, and period overlapping tax_year has status POSTED (ERR_UNPOSTED_FEE_ASSESSMENTS)"
          - "elected_65day_amount_cents <= sum of amounts disbursed with value_date in [tax_year+1-01-01, tax_year+1-03-06] for this trust (ERR_INVALID_ELECTION_AMOUNT)"
        side_effects:
          - "dni_cents, distribution_deduction_cents, trust_taxable_income_cents computed (FINAL variant); prepared_by_user_id = X-User-ID"
      - from: PREPARED
        to: UNDER_REVIEW
        trigger: POST /trusts/tax-return-filings/{id}/submit-for-review
        actor: TaxSpecialist
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: FILED
        trigger: POST /trusts/tax-return-filings/{id}/approve-review
        actor: TaxSpecialist
        preconditions: ["X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["reviewed_by_user_id = X-User-ID; filed_at = current clock"]
      - from: FILED
        to: ACCEPTED
        trigger: POST /trusts/tax-return-filings/{id}/record-acceptance
        actor: TaxSpecialist
        preconditions: []
        side_effects: ["accepted_at = current clock"]
      - from: FILED
        to: AMENDMENT_REQUIRED
        trigger: POST /trusts/tax-return-filings/{id}/require-amendment
        actor: TaxSpecialist
        preconditions: []
        side_effects: []
      - from: AMENDMENT_REQUIRED
        to: DATA_COLLECTION
        trigger: POST /trusts/tax-return-filings/{id}/begin-amendment
        actor: TaxSpecialist
        preconditions: []
        side_effects: ["amendment_number increments by 1; prepared_by_user_id/reviewed_by_user_id cleared"]
        note: "FILED -> AMENDMENT_REQUIRED -> DATA_COLLECTION is an unbounded amendment cycle"

  - entity: TerminationCase
    initial_state: INITIATED
    terminal_states: [CLOSED]
    transitions:
      - from: INITIATED
        to: LIABILITIES_RESERVED
        trigger: POST /trusts/termination-cases/{id}/reserve-liabilities
        actor: TrustOfficer
        preconditions: ["reserve_taxes_cents + reserve_fees_cents <= TrustAccount.available_principal_cents (ERR_INSUFFICIENT_AVAILABLE_BALANCE)"]
        side_effects: ["reserve amounts recorded"]
      - from: LIABILITIES_RESERVED
        to: TAX_CLEARANCE_RECEIVED
        trigger: POST /trusts/termination-cases/{id}/record-tax-clearance
        actor: TaxSpecialist
        preconditions: ["Every TaxReturnFiling of this trust has status ACCEPTED (ERR_UNFILED_TAX_RETURNS)"]
        side_effects: []
      - from: TAX_CLEARANCE_RECEIVED
        to: FINAL_ACCOUNTING_APPROVED
        trigger: POST /trusts/termination-cases/{id}/approve-final-accounting
        actor: TrustExecutive
        preconditions: ["X-User-ID != initiated_by_user_id (ERR_SEGREGATION_OF_DUTIES)"]
        side_effects: ["approved_by_user_id recorded"]
      - from: FINAL_ACCOUNTING_APPROVED
        to: DISTRIBUTED
        trigger: POST /trusts/termination-cases/{id}/distribute
        actor: TrustOperationsOfficer
        preconditions: []
        side_effects:
          - "final_distribution_waterfall executes: distributable_income_cents and distributable_principal_cents computed; distribution_lines built (income class lines first, then remainder class, each ordered by beneficiary created_at ASC)"
          - "LedgerEntry DISTRIBUTION rows appended per line (income lines to INCOME bucket, remainder lines to PRINCIPAL bucket; reserves remain as principal balance)"
          - "TrustAccount balances recomputed; TrustAccount transitions TERMINATING -> TERMINATED; TrustAccount.version increments by 1"
          - "distributed_at = current clock"
      - from: DISTRIBUTED
        to: CLOSED
        trigger: POST /trusts/termination-cases/{id}/close
        actor: TrustOfficer
        preconditions:
          - "The AnnualStatement of this trust for the fiscal_year containing distributed_at has status ACKNOWLEDGED (ERR_FINAL_STATEMENT_NOT_ACKNOWLEDGED)"
          - "The TaxReturnFiling of this trust for the tax_year containing distributed_at has status ACCEPTED (ERR_UNFILED_TAX_RETURNS)"
        side_effects: ["TrustAccount transitions TERMINATED -> CLOSED; TrustAccount.version increments by 1"]

concurrency_rules:
  - rule_id: request-create-stale-trust
    parent_entity: TrustAccount
    write_endpoint: "POST /trusts/distribution-requests"
    occ_field: "expected_trust_account_version"
    description: |
      Creating a DistributionRequest against a TrustAccount whose version has
      advanced since the client last observed it is rejected. A prior request
      creation (or any balance-affecting cascade) legitimately advanced the
      trust's version and mutated pending_distribution_count/available_*; the
      current writer's view of available funds is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: holding-create-stale-trust
    parent_entity: TrustAccount
    write_endpoint: "POST /trusts/investment-holdings"
    occ_field: "expected_trust_account_version"
    description: |
      Purchasing an InvestmentHolding against a TrustAccount whose version has
      advanced since the client last observed it is rejected. A prior purchase
      legitimately debited principal cash and advanced the trust version; the
      current writer's view of the cash position is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: trustee_fee_assessment
    trigger: "POST /trusts/fee-assessments (create) and POST /trusts/fee-assessments/{id}/recalculate"
    algorithm: tiered_pricing
    formula: |
      1. base_market_value_cents per variant:
         - PROVISIONAL: TrustAccount.total_market_value_cents at calculation time (current prices).
         - FINAL: for each holding, use the unit_price_cents of the latest price observation with
           priced_at <= period_end 23:59:59Z (create price counts); base = sum(holding MV at those
           as-of prices) + (income_balance_cents + principal_balance_cents as currently posted).
      2. annual_fee_cents = tier1 + tier2 + tier3 where
         tier1 = min(base, 100000000) * 0.01
         tier2 = min(max(base - 100000000, 0), 200000000) * 0.0075
         tier3 = max(base - 300000000, 0) * 0.005
      3. quarterly = round_half_up(annual_fee_cents / 4, 0 decimals)
      4. assessed_fee_cents = max(quarterly, MIN_QUARTERLY_FEE_CENTS)
      5. income_portion_cents = round_half_up(assessed_fee_cents * 0.5, 0 decimals)
         principal_portion_cents = assessed_fee_cents - income_portion_cents
    input_set: "All InvestmentHoldings of the trust (any status) plus current INCOME/PRINCIPAL cash balances"
    constants:
      TIER1_CAP_CENTS: 100000000
      TIER2_CAP_CENTS: 300000000
      TIER1_BPS_RATE: 0.01
      TIER2_BPS_RATE: 0.0075
      TIER3_BPS_RATE: 0.005
      MIN_QUARTERLY_FEE_CENTS: 125000
      INCOME_SPLIT_RATE: 0.5
    precision: "integer cents; round_half_up at each named step; multiplication by rates uses exact decimal arithmetic"
    variants:
      - name: PROVISIONAL
        when: "estimate for disclosure/planning before the period closes"
        difference: "base uses CURRENT market value at calculation time"
      - name: FINAL
        when: "authoritative fee for the closed period"
        difference: "base uses as-of period_end prices; identical holdings can therefore yield a different fee"

  - name: receipt_allocation
    trigger: "POST /trusts/ledger-entries with entry_kind=RECEIPT"
    algorithm: waterfall_allocation
    formula: |
      Classification of a receipt amount A by receipt_type (UPIA-style):
        INITIAL_FUNDING            -> 100% PRINCIPAL
        INTEREST                   -> 100% INCOME
        ORDINARY_DIVIDEND          -> 100% INCOME
        RENTAL_INCOME              -> income = round_half_up(A * 0.90), principal = A - income
        MINERAL_ROYALTY            -> income = round_half_up(A * 0.10), principal = A - income
        CAPITAL_GAIN_DISTRIBUTION  -> 100% PRINCIPAL
        SALE_PROCEEDS              -> 100% PRINCIPAL
      A 100% classification appends ONE LedgerEntry; a split classification appends TWO rows
      (INCOME row first, PRINCIPAL row second). Rounding remainder always lands in PRINCIPAL.
    input_set: "the single receipt being posted"
    constants:
      RENTAL_INCOME_SHARE: 0.90
      MINERAL_INCOME_SHARE: 0.10
    precision: "integer cents, round_half_up on the income share; principal takes the remainder"

  - name: account_balances
    trigger: "every LedgerEntry append, every DistributionRequest reservation/release, every holding purchase/sale/price update"
    algorithm: aggregation
    formula: |
      income_balance_cents    = sum(LedgerEntry.amount_cents where bucket=INCOME) over the trust
      principal_balance_cents = sum(LedgerEntry.amount_cents where bucket=PRINCIPAL)
      reserved_income_cents    = sum(income_portion_cents) over DistributionRequests in {VOTING, APPROVED}
      reserved_principal_cents = sum(principal_portion_cents) over the same set
      available_* = balance - reserved
      total_market_value_cents = sum(InvestmentHolding.market_value_cents) + income_balance_cents + principal_balance_cents
      Recomputed immediately and synchronously on every contributing mutation.
    input_set: "all LedgerEntry rows of the trust; DistributionRequests in {VOTING, APPROVED}; all holdings"
    precision: "integer cents; no rounding"

  - name: ips_drift_measurement
    trigger: "POST /trusts/investment-holdings/{id}/update-price, POST /trusts/{id}/run-compliance-check, POST /trusts/investment-policy-statements/{id}/activate"
    algorithm: threshold
    formula: |
      For asset_class C in {EQUITY, FIXED_INCOME}: class_mv = sum(market_value_cents of holdings with
      asset_class=C); raw = class_mv / total_market_value_cents (exact decimal, unrounded).
      Breach(over)  iff raw  > (target + band)/100     -- equality at the band edge is NOT a breach
      Breach(under) iff raw  < (target - band)/100
      measured_weight_pct stored = round_half_up(raw * 100, 2)  (display only; never used for the decision)
      severity = CRITICAL iff raw > (target + 2*band)/100 or raw < (target - 2*band)/100, else STANDARD.
      On breach with no existing non-RESOLVED review for (trust, class): open a ComplianceReview.
      On breach with an existing non-RESOLVED review for (trust, class): update that review in place
      (direction, measured_weight_pct, band_limit_pct, severity) - never create a duplicate.
      A CRITICAL review additionally transitions TrustAccount ACTIVE -> SUSPENDED.
      Purchases of a class are blocked (ERR_IPS_DRIFT_BREACH) only while an OVERWEIGHT non-RESOLVED
      review exists for that class; buying into an UNDERWEIGHT class is the remediation path and is allowed.
      If no ACTIVE IPS exists for the trust, the check is a no-op.
      If total_market_value_cents == 0 the check is a no-op (division by zero guard).
    input_set: "holdings of the trust; the ACTIVE InvestmentPolicyStatement"
    precision: "raw ratio unrounded for decisions; 2-decimal round_half_up for stored display"

  - name: committee_quorum_tally
    trigger: "POST /trusts/distribution-requests/{id}/vote"
    algorithm: threshold
    formula: |
      QUORUM = 3. After appending the vote and recomputing tallies:
        if approve_count >= QUORUM            -> request APPROVED
        elif decline_count >= QUORUM          -> request DECLINED
        elif (approve+decline+abstain) == committee_size_snapshot and approve_count < QUORUM -> DECLINED
      A member whose status is INACTIVE may not vote; votes already cast remain counted even if the
      member is later deactivated (committee_size_snapshot is not recomputed).
    input_set: "CommitteeVote rows of the request; committee_size_snapshot captured at open-voting"
    constants:
      QUORUM: 3
    precision: "integer counts; boundary is >= 3 (exactly 3 approvals approves)"

  - name: share_reallocation
    trigger: "POST /trusts/beneficiaries/{id}/mark-deceased when the trust's APPROVED TrustDocument has per_stirpes=false"
    algorithm: weighted_scoring
    formula: |
      Let D = deceased.share_bps, survivors = ACTIVE Beneficiaries of the same class, S = sum(survivor.share_bps).
      For each survivor i: raw_i = D * share_i / S; floor_i = floor(raw_i); frac_i = raw_i - floor_i.
      leftover = D - sum(floor_i). Distribute leftover one basis point at a time to the survivors with
      the largest frac_i; ties broken by beneficiary created_at ASC (never by id).
      Invariant: sum of share_bps over ACTIVE members of the class == 10000 before and after.
    input_set: "ACTIVE Beneficiaries of the deceased's beneficiary_class for the same trust"
    precision: "integer basis points; floor then largest-remainder"

  - name: dni_and_distribution_deduction
    trigger: "POST /trusts/tax-return-filings/{id}/compute-tentative (TENTATIVE) and /prepare (FINAL)"
    algorithm: chronological
    formula: |
      Evaluation order is PINNED (steps must execute in this sequence):
      1. gross_income = sum of positive INCOME LedgerEntry rows with value_date inside the tax year
         (RECEIPT rows only; excludes ADJUSTMENT reversals of fees).
      2. income_expenses = absolute sum of FEE/INCOME rows with value_date inside the tax year.
      3. dni = gross_income - income_expenses.
      4. paid = absolute sum of DISTRIBUTION rows with value_date inside the tax year.
      5. distribution_deduction = min(dni, paid + elected_65day_amount_cents).
      6. trust_taxable_income = dni - distribution_deduction - EXEMPTION_CENTS.
      TENTATIVE uses the ledger as posted at compute-tentative time; FINAL recomputes at prepare time,
      so receipts posted between the two calls change FINAL relative to TENTATIVE.
    input_set: "LedgerEntry rows of the trust whose value_date falls in [tax_year-01-01, tax_year-12-31] (fiscal_year_end_month=12)"
    constants:
      EXEMPTION_CENTS: 30000
      ELECTION_WINDOW_END_MONTH_DAY: "03-06"
    precision: "integer cents; no rounding"
    variants:
      - name: TENTATIVE
        when: "planning estimate during DATA_COLLECTION"
        difference: "snapshot of entries posted so far"
      - name: FINAL
        when: "at prepare, before review"
        difference: "includes all entries posted up to prepare time; identical tax year can yield different dni"

  - name: final_distribution_waterfall
    trigger: "POST /trusts/termination-cases/{id}/distribute"
    algorithm: waterfall_allocation
    formula: |
      distributable_income    = TrustAccount.income_balance_cents (at distribute time)
      distributable_principal = principal_balance_cents - reserve_taxes_cents - reserve_fees_cents
      PINNED: lines are built over every Beneficiary of the class with share_bps > 0 (both ACTIVE and
      DECEASED-with-per_stirpes estates receive), using current share_bps at distribute time:
        line_i = round_half_up(distributable * share_bps_i / 10000)   -- per-line rounding FIRST
      delta = distributable - sum(lines). Apply delta (may be negative) to the line of the beneficiary
      with the largest share_bps in that class; tie-break by beneficiary created_at ASC (never by id).
      Income pool pays the INCOME class; principal pool pays the REMAINDER class.
      distribution_lines order: INCOME-class lines first, then REMAINDER-class lines, each created_at ASC.
    input_set: "Beneficiaries of the trust (both classes), current share_bps, balances and reserves"
    precision: "integer cents; round each line to cents (already integer) then reconcile the delta"

  - name: statement_totals
    trigger: "POST /trusts/annual-statements (generate) and /regenerate"
    algorithm: aggregation
    formula: |
      Window W = [fiscal_year-01-01, fiscal_year-12-31] inclusive (fiscal_year_end_month=12).
      opening_*  = sum of signed LedgerEntry amounts with value_date < W.start, per bucket.
      receipts_* = sum of POSITIVE entries with value_date in W, per bucket.
      disbursements_cents = abs(sum of negative entries in W with entry_kind not in {DISTRIBUTION, FEE}).
      fees_cents = abs(sum of FEE entries in W). distributions_cents = abs(sum of DISTRIBUTION entries in W).
      closing_* = opening_* + sum of ALL signed entries in W, per bucket.
    input_set: "all LedgerEntry rows of the trust, partitioned by value_date vs the fiscal-year window"
    precision: "integer cents; no rounding"

validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: business_constraint, check: "Request shape: required fields present, enum values valid, integer cents > 0 where required, date strings valid, effective_from < effective_to, units > 0, share_bps in 1..10000, limit in 1..100, version_number unique per trust for TrustDocument", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 3, category: auth, check: "Role is authorized for this endpoint per RBAC matrix", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: auth, check: "Identity and segregation-of-duties: Beneficiary may act only on own requests/own trust's statements and fee assessments (ERR_NOT_OWN_RESOURCE); fee poster != discloser, tax reviewer != preparer, final-accounting approver != termination initiator (ERR_SEGREGATION_OF_DUTIES)", error_id: ERR_NOT_OWN_RESOURCE, http_status: 403, applies_to: "POST provide-information, withdraw, acknowledge, dispute, post, approve-review, approve-final-accounting" }
  - { priority: 5, category: existence, check: "Path ids exist, validated left-to-right; trust id missing -> ERR_TRUST_NOT_FOUND; any other path or body FK id missing -> ERR_RESOURCE_NOT_FOUND", error_id: ERR_TRUST_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 6, category: state, check: "Target entity in a valid from-state for the requested transition (ERR_INVALID_STATE); trust-gated child operations require TrustAccount.status == ACTIVE (ERR_TRUST_NOT_ACTIVE); vote requires request VOTING (ERR_REQUEST_NOT_VOTING); disburse requires APPROVED (ERR_REQUEST_NOT_APPROVED); voting member must be ACTIVE (ERR_MEMBER_NOT_ACTIVE); reinstate requires zero non-RESOLVED ComplianceReviews (ERR_UNRESOLVED_COMPLIANCE_REVIEWS); resolve requires drift cured (ERR_DRIFT_STILL_BREACHED); OCC endpoints reject stale expected_trust_account_version (ERR_STALE_VERSION)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "Fiduciary/compliance gates: purpose_category permitted by distribution_standard (ERR_PURPOSE_OUTSIDE_STANDARD); purchase of an asset class with a non-RESOLVED OVERWEIGHT ComplianceReview is blocked (ERR_IPS_DRIFT_BREACH); a single holding's post-trade market value must not exceed 25% of total_market_value_cents - strictly greater is rejected, equality allowed (ERR_CONCENTRATION_LIMIT_EXCEEDED)", error_id: ERR_PURPOSE_OUTSIDE_STANDARD, http_status: 422, applies_to: "POST open-voting, POST /trusts/investment-holdings" }
  - { priority: 8, category: business_temporal, check: "IPS half-open windows of the same trust in {DRAFT, ACTIVE} must not overlap, abut allowed (ERR_IPS_PERIOD_OVERLAP); FINAL FeeAssessment periods must tile with no gap and no overlap - period_start == prior FINAL period_end + 1 day (ERR_FEE_PERIOD_NOT_CONTIGUOUS); one non-SUPERSEDED AnnualStatement per (trust, fiscal_year) (ERR_STATEMENT_YEAR_EXISTS); one TaxReturnFiling per (trust, tax_year) (ERR_DUPLICATE_TAX_YEAR); objection windows are 30 days from disclosed_at/delivered_at inclusive (ERR_OBJECTION_WINDOW_EXPIRED); elected 65-day amount must not exceed sums disbursed in [next-year-01-01, next-year-03-06] (ERR_INVALID_ELECTION_AMOUNT)", error_id: ERR_IPS_PERIOD_OVERLAP, http_status: 409, applies_to: "POST create/activate/dispute/prepare endpoints" }
  - { priority: 9, category: business_referential, check: "Body FK targets must belong to the same trust as the operation (ERR_CROSS_TRUST_REFERENCE); beneficiary must be ACTIVE (ERR_BENEFICIARY_NOT_ACTIVE); acceptance requires an APPROVED TrustDocument (ERR_DOCUMENT_NOT_APPROVED)", error_id: ERR_CROSS_TRUST_REFERENCE, http_status: 422, applies_to: "POST distribution-requests, open-voting, accept" }
  - { priority: 10, category: business_constraint, check: "Aggregate and uniqueness constraints: ACTIVE class share_bps must sum to exactly 10000 at accept (ERR_SHARE_SUM_INVALID); one vote per (request, member) (ERR_DUPLICATE_VOTE); LedgerEntry is immutable - PUT/PATCH/DELETE rejected (ERR_LEDGER_IMMUTABLE); open-voting requires >= 3 ACTIVE CommitteeMembers (ERR_COMMITTEE_QUORUM_UNAVAILABLE); termination tax clearance requires all filings ACCEPTED (ERR_UNFILED_TAX_RETURNS); prepare requires all overlapping FINAL FeeAssessments POSTED (ERR_UNPOSTED_FEE_ASSESSMENTS)", error_id: ERR_SHARE_SUM_INVALID, http_status: 422, applies_to: "accept, vote, open-voting, record-tax-clearance, prepare, PUT ledger-entries" }
  - { priority: 11, category: business_fiscal, check: "Funds checks last: reservation waterfall and termination reserves must fit available balances (ERR_INSUFFICIENT_AVAILABLE_BALANCE); fee portions must fit available balances at post (ERR_FEE_EXCEEDS_AVAILABLE_BALANCE)", error_id: ERR_INSUFFICIENT_AVAILABLE_BALANCE, http_status: 422, applies_to: "open-voting, reserve-liabilities, post, holdings purchase" }

endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving endpoint: sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [TrustExecutive], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: [] }

  - { method: POST, path: "/trusts", description: "Create a trust account in DRAFT", roles: [TrustOfficer], code: 201, input: [trust_name, trust_type, grantor_name, governing_state, ein, fiscal_year_end_month, distribution_standard], output: TrustAccount, side_effects: [] }
  - { method: GET, path: "/trusts", description: "List trust accounts", roles: [TrustOfficer, TrustExecutive, InvestmentManager, TrustOperationsOfficer, TaxSpecialist], code: 200, input: ["status?", "trust_type?", "limit?", "offset?"], output: "TrustAccount[]", side_effects: [] }
  - { method: GET, path: "/trusts/{id}", description: "Read a trust account", roles: [TrustOfficer, TrustExecutive, InvestmentManager, TrustOperationsOfficer, TaxSpecialist], code: 200, input: [], output: TrustAccount, side_effects: [] }
  - { method: POST, path: "/trusts/{id}/submit-for-acceptance", description: "DRAFT -> UNDER_ACCEPTANCE_REVIEW", roles: [TrustOfficer], code: 200, input: [], output: TrustAccount, side_effects: ["increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/{id}/accept", description: "UNDER_ACCEPTANCE_REVIEW -> ACTIVE; requires APPROVED document and balanced class shares", roles: [TrustExecutive], code: 200, input: [], output: TrustAccount, side_effects: ["sets accepted_at", "increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/{id}/decline-acceptance", description: "UNDER_ACCEPTANCE_REVIEW -> ACCEPTANCE_DECLINED", roles: [TrustExecutive], code: 200, input: [reason], output: TrustAccount, side_effects: ["increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/{id}/suspend", description: "ACTIVE -> SUSPENDED", roles: [TrustExecutive], code: 200, input: [reason], output: TrustAccount, side_effects: ["increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/{id}/reinstate", description: "SUSPENDED -> ACTIVE; blocked while any review is non-RESOLVED", roles: [TrustExecutive], code: 200, input: [], output: TrustAccount, side_effects: ["increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/{id}/terminate", description: "ACTIVE -> TERMINATING; cancels non-terminal distribution requests, releases their reservations, creates TerminationCase INITIATED", roles: [TrustOfficer, TrustExecutive], code: 200, input: [reason], output: TrustAccount, side_effects: ["cancels non-terminal DistributionRequests (reservations released)", "creates TerminationCase INITIATED", "increments TrustAccount.version by 1"] }

  - { method: POST, path: "/trusts/documents", description: "Create a trust document DRAFT", roles: [TrustOfficer], code: 201, input: [trust_id, version_number, "prior_document_id?", "summary?"], output: TrustDocument, side_effects: [] }
  - { method: GET, path: "/trusts/documents", description: "List trust documents", roles: [TrustOfficer, TrustExecutive, InvestmentManager, TrustOperationsOfficer, TaxSpecialist], code: 200, input: ["trust_id?", "prior_document_id?", "status?", "limit?", "offset?"], output: "TrustDocument[]", side_effects: [] }
  - { method: GET, path: "/trusts/documents/{id}", description: "Read a trust document", roles: [TrustOfficer, TrustExecutive, InvestmentManager, TrustOperationsOfficer, TaxSpecialist], code: 200, input: [], output: TrustDocument, side_effects: [] }
  - { method: POST, path: "/trusts/documents/{id}/submit", description: "DRAFT -> SUBMITTED", roles: [TrustOfficer], code: 200, input: [], output: TrustDocument, side_effects: [] }
  - { method: POST, path: "/trusts/documents/{id}/interpret", description: "SUBMITTED -> INTERPRETED; records per_stirpes and interpretation notes", roles: [TrustOfficer], code: 200, input: [per_stirpes, interpretation_notes], output: TrustDocument, side_effects: [] }
  - { method: POST, path: "/trusts/documents/{id}/approve", description: "INTERPRETED -> APPROVED; supersedes prior APPROVED document of the same trust", roles: [TrustExecutive], code: 200, input: [], output: TrustDocument, side_effects: ["prior APPROVED TrustDocument of same trust -> SUPERSEDED"] }
  - { method: POST, path: "/trusts/documents/{id}/reject-interpretation", description: "INTERPRETED -> REJECTED", roles: [TrustExecutive], code: 200, input: [rejected_reason], output: TrustDocument, side_effects: [] }

  - { method: POST, path: "/trusts/beneficiaries", description: "Add a beneficiary (trust must be DRAFT, UNDER_ACCEPTANCE_REVIEW, or ACTIVE)", roles: [TrustOfficer], code: 201, input: [trust_id, full_name, beneficiary_class, share_bps, date_of_birth], output: Beneficiary, side_effects: [] }
  - { method: GET, path: "/trusts/beneficiaries", description: "List beneficiaries", roles: [TrustOfficer, TrustExecutive, InvestmentManager, TrustOperationsOfficer, TaxSpecialist], code: 200, input: ["trust_id?", "status?", "beneficiary_class?", "limit?", "offset?"], output: "Beneficiary[]", side_effects: [] }
  - { method: GET, path: "/trusts/beneficiaries/{id}", description: "Read a beneficiary", roles: [TrustOfficer, TrustExecutive, InvestmentManager, TrustOperationsOfficer, TaxSpecialist], code: 200, input: [], output: Beneficiary, side_effects: [] }
  - { method: POST, path: "/trusts/beneficiaries/{id}/mark-deceased", description: "ACTIVE -> DECEASED; cancels the beneficiary's non-terminal requests, runs share reallocation when per_stirpes=false", roles: [TrustOfficer], code: 200, input: [deceased_at], output: Beneficiary, side_effects: ["cancels beneficiary's non-terminal DistributionRequests (reservations released)", "share_reallocation over the deceased's class when per_stirpes=false"] }

  - { method: POST, path: "/trusts/committee-members", description: "Create a trust committee member (ACTIVE)", roles: [TrustExecutive], code: 201, input: [full_name, term_start, term_end], output: CommitteeMember, side_effects: [] }
  - { method: GET, path: "/trusts/committee-members", description: "List committee members", roles: [TrustOfficer, TrustExecutive, InvestmentManager, TrustOperationsOfficer, TaxSpecialist, CommitteeMember], code: 200, input: ["status?", "limit?", "offset?"], output: "CommitteeMember[]", side_effects: [] }
  - { method: GET, path: "/trusts/committee-members/{id}", description: "Read a committee member", roles: [TrustOfficer, TrustExecutive, InvestmentManager, TrustOperationsOfficer, TaxSpecialist, CommitteeMember], code: 200, input: [], output: CommitteeMember, side_effects: [] }
  - { method: POST, path: "/trusts/committee-members/{id}/deactivate", description: "ACTIVE -> INACTIVE", roles: [TrustExecutive], code: 200, input: [], output: CommitteeMember, side_effects: [] }

  - { method: POST, path: "/trusts/distribution-requests", description: "Create a discretionary distribution request (SUBMITTED). Beneficiary role must equal beneficiary_id; TrustOfficer may file on behalf. Trust must be ACTIVE (ERR_TRUST_NOT_ACTIVE). OCC-guarded on TrustAccount.version.", roles: [Beneficiary, TrustOfficer], code: 201, input: [trust_id, beneficiary_id, amount_cents, allocation_source, purpose_category, "purpose_note?", expected_trust_account_version], output: DistributionRequest, side_effects: ["TrustAccount.pending_distribution_count increments by 1", "increments TrustAccount.version by 1"] }
  - { method: GET, path: "/trusts/distribution-requests", description: "List distribution requests", roles: [TrustOfficer, TrustExecutive, TrustOperationsOfficer, CommitteeMember], code: 200, input: ["trust_id?", "beneficiary_id?", "status?", "limit?", "offset?"], output: "DistributionRequest[]", side_effects: [] }
  - { method: GET, path: "/trusts/distribution-requests/{id}", description: "Read a distribution request", roles: [TrustOfficer, TrustExecutive, TrustOperationsOfficer, CommitteeMember, Beneficiary], code: 200, input: [], output: DistributionRequest, side_effects: [] }
  - { method: POST, path: "/trusts/distribution-requests/{id}/start-review", description: "SUBMITTED -> UNDER_REVIEW", roles: [TrustOfficer], code: 200, input: [], output: DistributionRequest, side_effects: [] }
  - { method: POST, path: "/trusts/distribution-requests/{id}/request-information", description: "UNDER_REVIEW -> INFORMATION_REQUESTED", roles: [TrustOfficer], code: 200, input: [info_request_note], output: DistributionRequest, side_effects: [] }
  - { method: POST, path: "/trusts/distribution-requests/{id}/provide-information", description: "INFORMATION_REQUESTED -> UNDER_REVIEW (request owner only)", roles: [Beneficiary], code: 200, input: [info_response_note], output: DistributionRequest, side_effects: [] }
  - { method: POST, path: "/trusts/distribution-requests/{id}/open-voting", description: "UNDER_REVIEW -> VOTING; validates purpose standard, quorum availability, beneficiary ACTIVE, trust ACTIVE; applies reservation waterfall and snapshots committee size", roles: [TrustOfficer], code: 200, input: [], output: DistributionRequest, side_effects: ["reserves income/principal portions on TrustAccount", "snapshots committee_size_snapshot", "increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/distribution-requests/{id}/vote", description: "Cast a committee vote; auto-decides APPROVED at 3 approves, DECLINED at 3 declines or full ballot without quorum", roles: [CommitteeMember], code: 201, input: [vote], output: CommitteeVote, side_effects: ["appends CommitteeVote", "updates tallies", "on decision: APPROVED keeps reservation, DECLINED releases reservation and decrements pending_distribution_count", "increments TrustAccount.version by 1 on decision"] }
  - { method: GET, path: "/trusts/votes", description: "List committee votes", roles: [TrustOfficer, TrustExecutive, CommitteeMember], code: 200, input: ["distribution_request_id?", "committee_member_id?", "limit?", "offset?"], output: "CommitteeVote[]", side_effects: [] }
  - { method: GET, path: "/trusts/votes/{id}", description: "Read a committee vote", roles: [TrustOfficer, TrustExecutive, CommitteeMember], code: 200, input: [], output: CommitteeVote, side_effects: [] }
  - { method: POST, path: "/trusts/distribution-requests/{id}/disburse", description: "APPROVED -> DISBURSED; posts DISTRIBUTION ledger rows, releases reservation, supersedes stale DRAFT/FINALIZED statements of the affected fiscal year", roles: [TrustOperationsOfficer], code: 200, input: [], output: DistributionRequest, side_effects: ["appends DISTRIBUTION LedgerEntry rows per bucket", "recomputes TrustAccount balances and reservations", "supersedes stale AnnualStatements", "increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/distribution-requests/{id}/withdraw", description: "SUBMITTED/UNDER_REVIEW/INFORMATION_REQUESTED -> WITHDRAWN (owner only)", roles: [Beneficiary], code: 200, input: [], output: DistributionRequest, side_effects: ["decrements pending_distribution_count", "increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/distribution-requests/{id}/cancel", description: "Any non-terminal state -> CANCELLED; releases any reservation", roles: [TrustOfficer], code: 200, input: [cancelled_reason], output: DistributionRequest, side_effects: ["releases reservation if any", "decrements pending_distribution_count", "increments TrustAccount.version by 1"] }

  - { method: POST, path: "/trusts/investment-policy-statements", description: "Create an IPS in DRAFT with a half-open effective window. Trust must be DRAFT, UNDER_ACCEPTANCE_REVIEW, ACTIVE, or SUSPENDED.", roles: [InvestmentManager], code: 201, input: [trust_id, effective_from, effective_to, equity_target_pct, equity_band_pct, fixed_income_target_pct, fixed_income_band_pct, alternatives_allowed], output: InvestmentPolicyStatement, side_effects: [] }
  - { method: GET, path: "/trusts/investment-policy-statements", description: "List investment policy statements", roles: [TrustOfficer, TrustExecutive, InvestmentManager], code: 200, input: ["trust_id?", "status?", "limit?", "offset?"], output: "InvestmentPolicyStatement[]", side_effects: [] }
  - { method: GET, path: "/trusts/investment-policy-statements/{id}", description: "Read an IPS", roles: [TrustOfficer, TrustExecutive, InvestmentManager], code: 200, input: [], output: InvestmentPolicyStatement, side_effects: [] }
  - { method: POST, path: "/trusts/investment-policy-statements/{id}/activate", description: "DRAFT -> ACTIVE; supersedes the currently ACTIVE statement; runs an immediate drift check", roles: [InvestmentManager], code: 200, input: [], output: InvestmentPolicyStatement, side_effects: ["prior ACTIVE IPS -> SUPERSEDED", "runs ips_drift_measurement"] }

  - { method: POST, path: "/trusts/investment-holdings", description: "Purchase a holding: merges into same-ticker row (reopens if CLOSED), debits principal cash via INVESTMENT_PURCHASE ledger row. Trust must be ACTIVE or SUSPENDED (trading to cure a breach must remain possible while suspended). OCC-guarded on TrustAccount.version.", roles: [InvestmentManager], code: 201, input: [trust_id, asset_class, ticker, units, unit_price_cents, expected_trust_account_version], output: InvestmentHolding, side_effects: ["appends INVESTMENT_PURCHASE/PRINCIPAL LedgerEntry of -(units*unit_price_cents)", "recomputes TrustAccount balances and total_market_value_cents", "increments TrustAccount.version by 1"] }
  - { method: GET, path: "/trusts/investment-holdings", description: "List holdings", roles: [TrustOfficer, TrustExecutive, InvestmentManager], code: 200, input: ["trust_id?", "asset_class?", "status?", "limit?", "offset?"], output: "InvestmentHolding[]", side_effects: [] }
  - { method: GET, path: "/trusts/investment-holdings/{id}", description: "Read a holding", roles: [TrustOfficer, TrustExecutive, InvestmentManager], code: 200, input: [], output: InvestmentHolding, side_effects: [] }
  - { method: POST, path: "/trusts/investment-holdings/{id}/update-price", description: "Update unit price (trust ACTIVE or SUSPENDED); recomputes market value, trust TMV, and runs drift check (may open ComplianceReview; CRITICAL auto-suspends the trust)", roles: [InvestmentManager], code: 200, input: [unit_price_cents, priced_at], output: InvestmentHolding, side_effects: ["recomputes market_value_cents and TrustAccount.total_market_value_cents", "runs ips_drift_measurement", "increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/investment-holdings/{id}/sell", description: "Sell units (trust ACTIVE or SUSPENDED); proceeds credit PRINCIPAL via INVESTMENT_SALE row; units reaching 0 closes the holding", roles: [InvestmentManager], code: 200, input: [units], output: InvestmentHolding, side_effects: ["appends INVESTMENT_SALE/PRINCIPAL LedgerEntry of +(units*unit_price_cents)", "reduces cost_basis pro-rata (round_half_up)", "recomputes TrustAccount balances/TMV", "increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/{id}/run-compliance-check", description: "Runs ips_drift_measurement on demand; opens ComplianceReviews for breaching classes", roles: [InvestmentManager, TrustOfficer], code: 200, input: [], output: "{ opened_review_count: integer, opened_review_ids: string[] }", side_effects: ["may create ComplianceReview rows", "CRITICAL review suspends the trust"] }

  - { method: GET, path: "/trusts/compliance-reviews", description: "List compliance reviews", roles: [TrustOfficer, TrustExecutive, InvestmentManager], code: 200, input: ["trust_id?", "investment_policy_statement_id?", "status?", "limit?", "offset?"], output: "ComplianceReview[]", side_effects: [] }
  - { method: GET, path: "/trusts/compliance-reviews/{id}", description: "Read a compliance review", roles: [TrustOfficer, TrustExecutive, InvestmentManager], code: 200, input: [], output: ComplianceReview, side_effects: [] }
  - { method: POST, path: "/trusts/compliance-reviews/{id}/plan-remediation", description: "OPEN -> REMEDIATION_PLANNED", roles: [InvestmentManager], code: 200, input: [remediation_note], output: ComplianceReview, side_effects: [] }
  - { method: POST, path: "/trusts/compliance-reviews/{id}/resolve", description: "OPEN/REMEDIATION_PLANNED/ESCALATED -> RESOLVED; requires drift cured", roles: [InvestmentManager], code: 200, input: [], output: ComplianceReview, side_effects: ["sets resolved_at"] }
  - { method: POST, path: "/trusts/compliance-reviews/{id}/escalate", description: "OPEN/REMEDIATION_PLANNED -> ESCALATED", roles: [TrustExecutive], code: 200, input: [], output: ComplianceReview, side_effects: [] }

  - { method: POST, path: "/trusts/ledger-entries", description: "Post a manual RECEIPT or ADJUSTMENT; RECEIPT rows are classified into INCOME/PRINCIPAL per receipt_allocation (a split receipt appends two rows). Trust must be ACTIVE or TERMINATING.", roles: [TrustOperationsOfficer], code: 201, input: [trust_id, entry_kind, amount_cents, value_date, "receipt_type?", "bucket?", "description?"], output: "LedgerEntry[]", side_effects: ["appends 1-2 LedgerEntry rows", "recomputes TrustAccount balances/TMV", "supersedes stale DRAFT/FINALIZED AnnualStatements of the value_date's fiscal year", "increments TrustAccount.version by 1"] }
  - { method: GET, path: "/trusts/ledger-entries", description: "List ledger entries", roles: [TrustOfficer, TrustExecutive, TrustOperationsOfficer, TaxSpecialist], code: 200, input: ["trust_id?", "bucket?", "entry_kind?", "limit?", "offset?"], output: "LedgerEntry[]", side_effects: [] }
  - { method: GET, path: "/trusts/ledger-entries/{id}", description: "Read a ledger entry", roles: [TrustOfficer, TrustExecutive, TrustOperationsOfficer, TaxSpecialist], code: 200, input: [], output: LedgerEntry, side_effects: [] }
  - { method: PUT, path: "/trusts/ledger-entries/{id}", description: "Ledger is append-only: always rejected with ERR_LEDGER_IMMUTABLE (405)", roles: [TrustOperationsOfficer], code: 200, input: [], output: null, side_effects: [] }

  - { method: POST, path: "/trusts/fee-assessments", description: "Calculate a trustee fee for a period (variant PROVISIONAL or FINAL). Trust must be ACTIVE or TERMINATING. FINAL periods must tile gap-free; only FINAL rows participate in the tiling rule.", roles: [TrustOperationsOfficer], code: 201, input: [trust_id, period_start, period_end, variant], output: FeeAssessment, side_effects: ["computes trustee_fee_assessment fields"] }
  - { method: GET, path: "/trusts/fee-assessments", description: "List fee assessments", roles: [TrustOfficer, TrustExecutive, TrustOperationsOfficer], code: 200, input: ["trust_id?", "status?", "limit?", "offset?"], output: "FeeAssessment[]", side_effects: [] }
  - { method: GET, path: "/trusts/fee-assessments/{id}", description: "Read a fee assessment", roles: [TrustOfficer, TrustExecutive, TrustOperationsOfficer, Beneficiary], code: 200, input: [], output: FeeAssessment, side_effects: [] }
  - { method: POST, path: "/trusts/fee-assessments/{id}/disclose", description: "CALCULATED -> DISCLOSED; records discloser identity and starts the 30-day objection window", roles: [TrustOperationsOfficer], code: 200, input: [], output: FeeAssessment, side_effects: ["records disclosed_by_user_id and disclosed_at"] }
  - { method: POST, path: "/trusts/fee-assessments/{id}/post", description: "DISCLOSED -> POSTED; poster must differ from discloser; appends FEE ledger rows to both buckets", roles: [TrustOperationsOfficer], code: 200, input: [], output: FeeAssessment, side_effects: ["appends FEE/INCOME and FEE/PRINCIPAL LedgerEntry rows", "recomputes TrustAccount balances", "supersedes stale AnnualStatements", "increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/fee-assessments/{id}/dispute", description: "DISCLOSED -> DISPUTED within 30 days (beneficiary of the trust)", roles: [Beneficiary], code: 200, input: [dispute_reason], output: FeeAssessment, side_effects: [] }
  - { method: POST, path: "/trusts/fee-assessments/{id}/recalculate", description: "DISPUTED -> CALCULATED; recomputes all amount fields", roles: [TrustOperationsOfficer], code: 200, input: [], output: FeeAssessment, side_effects: ["recomputes trustee_fee_assessment fields"] }
  - { method: POST, path: "/trusts/fee-assessments/{id}/reverse", description: "POSTED -> REVERSED; appends offsetting ADJUSTMENT rows restoring both buckets exactly", roles: [TrustExecutive], code: 200, input: [reason], output: FeeAssessment, side_effects: ["appends offsetting ADJUSTMENT LedgerEntry rows", "recomputes TrustAccount balances", "increments TrustAccount.version by 1"] }

  - { method: POST, path: "/trusts/annual-statements", description: "Generate a beneficiary annual statement (DRAFT) with totals computed per statement_totals. Trust must be ACTIVE, SUSPENDED, TERMINATING, or TERMINATED.", roles: [TrustOfficer], code: 201, input: [trust_id, fiscal_year], output: AnnualStatement, side_effects: ["computes statement_totals fields"] }
  - { method: GET, path: "/trusts/annual-statements", description: "List annual statements", roles: [TrustOfficer, TrustExecutive, TrustOperationsOfficer], code: 200, input: ["trust_id?", "fiscal_year?", "status?", "limit?", "offset?"], output: "AnnualStatement[]", side_effects: [] }
  - { method: GET, path: "/trusts/annual-statements/{id}", description: "Read an annual statement", roles: [TrustOfficer, TrustExecutive, TrustOperationsOfficer, Beneficiary], code: 200, input: [], output: AnnualStatement, side_effects: [] }
  - { method: POST, path: "/trusts/annual-statements/{id}/finalize", description: "DRAFT -> FINALIZED", roles: [TrustOfficer], code: 200, input: [], output: AnnualStatement, side_effects: [] }
  - { method: POST, path: "/trusts/annual-statements/{id}/deliver", description: "FINALIZED -> DELIVERED; starts the 30-day objection window", roles: [TrustOfficer], code: 200, input: [], output: AnnualStatement, side_effects: ["sets delivered_at"] }
  - { method: POST, path: "/trusts/annual-statements/{id}/acknowledge", description: "DELIVERED -> ACKNOWLEDGED (beneficiary of the trust)", roles: [Beneficiary], code: 200, input: [], output: AnnualStatement, side_effects: ["sets acknowledged_at"] }
  - { method: POST, path: "/trusts/annual-statements/{id}/dispute", description: "DELIVERED -> DISPUTED within 30 days", roles: [Beneficiary], code: 200, input: [dispute_reason], output: AnnualStatement, side_effects: [] }
  - { method: POST, path: "/trusts/annual-statements/{id}/regenerate", description: "DISPUTED -> DRAFT; recomputes all totals from the current ledger", roles: [TrustOfficer], code: 200, input: [], output: AnnualStatement, side_effects: ["recomputes statement_totals fields"] }

  - { method: POST, path: "/trusts/tax-return-filings", description: "Open a Form 1041 filing (DATA_COLLECTION); one per (trust, tax_year). Trust must be ACTIVE, SUSPENDED, TERMINATING, or TERMINATED.", roles: [TaxSpecialist], code: 201, input: [trust_id, tax_year], output: TaxReturnFiling, side_effects: [] }
  - { method: GET, path: "/trusts/tax-return-filings", description: "List tax filings", roles: [TrustOfficer, TrustExecutive, TaxSpecialist], code: 200, input: ["trust_id?", "tax_year?", "status?", "limit?", "offset?"], output: "TaxReturnFiling[]", side_effects: [] }
  - { method: GET, path: "/trusts/tax-return-filings/{id}", description: "Read a tax filing", roles: [TrustOfficer, TrustExecutive, TaxSpecialist], code: 200, input: [], output: TaxReturnFiling, side_effects: [] }
  - { method: POST, path: "/trusts/tax-return-filings/{id}/compute-tentative", description: "Recompute tentative_dni_cents over entries posted so far; stays in DATA_COLLECTION", roles: [TaxSpecialist], code: 200, input: [], output: TaxReturnFiling, side_effects: ["recomputes tentative_dni_cents"] }
  - { method: POST, path: "/trusts/tax-return-filings/{id}/prepare", description: "DATA_COLLECTION -> PREPARED; computes FINAL DNI, distribution deduction, taxable income; validates 65-day election and posted fees", roles: [TaxSpecialist], code: 200, input: ["elected_65day_amount_cents?"], output: TaxReturnFiling, side_effects: ["computes dni_cents, distribution_deduction_cents, trust_taxable_income_cents", "records prepared_by_user_id"] }
  - { method: POST, path: "/trusts/tax-return-filings/{id}/submit-for-review", description: "PREPARED -> UNDER_REVIEW", roles: [TaxSpecialist], code: 200, input: [], output: TaxReturnFiling, side_effects: [] }
  - { method: POST, path: "/trusts/tax-return-filings/{id}/approve-review", description: "UNDER_REVIEW -> FILED; reviewer must differ from preparer", roles: [TaxSpecialist], code: 200, input: [], output: TaxReturnFiling, side_effects: ["records reviewed_by_user_id and filed_at"] }
  - { method: POST, path: "/trusts/tax-return-filings/{id}/record-acceptance", description: "FILED -> ACCEPTED", roles: [TaxSpecialist], code: 200, input: [], output: TaxReturnFiling, side_effects: ["sets accepted_at"] }
  - { method: POST, path: "/trusts/tax-return-filings/{id}/require-amendment", description: "FILED -> AMENDMENT_REQUIRED", roles: [TaxSpecialist], code: 200, input: [reason], output: TaxReturnFiling, side_effects: [] }
  - { method: POST, path: "/trusts/tax-return-filings/{id}/begin-amendment", description: "AMENDMENT_REQUIRED -> DATA_COLLECTION; increments amendment_number", roles: [TaxSpecialist], code: 200, input: [], output: TaxReturnFiling, side_effects: ["increments amendment_number", "clears prepared_by/reviewed_by"] }

  - { method: GET, path: "/trusts/termination-cases", description: "List termination cases", roles: [TrustOfficer, TrustExecutive, TrustOperationsOfficer, TaxSpecialist], code: 200, input: ["trust_id?", "status?", "limit?", "offset?"], output: "TerminationCase[]", side_effects: [] }
  - { method: GET, path: "/trusts/termination-cases/{id}", description: "Read a termination case", roles: [TrustOfficer, TrustExecutive, TrustOperationsOfficer, TaxSpecialist], code: 200, input: [], output: TerminationCase, side_effects: [] }
  - { method: POST, path: "/trusts/termination-cases/{id}/reserve-liabilities", description: "INITIATED -> LIABILITIES_RESERVED; records tax/fee reserves withheld from principal", roles: [TrustOfficer], code: 200, input: [reserve_taxes_cents, reserve_fees_cents], output: TerminationCase, side_effects: [] }
  - { method: POST, path: "/trusts/termination-cases/{id}/record-tax-clearance", description: "LIABILITIES_RESERVED -> TAX_CLEARANCE_RECEIVED; all filings must be ACCEPTED", roles: [TaxSpecialist], code: 200, input: [], output: TerminationCase, side_effects: [] }
  - { method: POST, path: "/trusts/termination-cases/{id}/approve-final-accounting", description: "TAX_CLEARANCE_RECEIVED -> FINAL_ACCOUNTING_APPROVED; approver must differ from initiator", roles: [TrustExecutive], code: 200, input: [], output: TerminationCase, side_effects: ["records approved_by_user_id"] }
  - { method: POST, path: "/trusts/termination-cases/{id}/distribute", description: "FINAL_ACCOUNTING_APPROVED -> DISTRIBUTED; runs final_distribution_waterfall, posts per-line DISTRIBUTION rows, terminates the trust", roles: [TrustOperationsOfficer], code: 200, input: [], output: TerminationCase, side_effects: ["computes distribution_lines", "appends DISTRIBUTION LedgerEntry rows per line", "TrustAccount TERMINATING -> TERMINATED", "increments TrustAccount.version by 1"] }
  - { method: POST, path: "/trusts/termination-cases/{id}/close", description: "DISTRIBUTED -> CLOSED; requires final statement ACKNOWLEDGED and final 1041 ACCEPTED; closes the trust", roles: [TrustOfficer], code: 200, input: [], output: TerminationCase, side_effects: ["TrustAccount TERMINATED -> CLOSED", "increments TrustAccount.version by 1"] }

errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request body: missing required field, invalid enum, non-positive amount/units, bad date, effective_from >= effective_to, duplicate version_number per trust, limit out of 1..100" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's role list" }
  - { id: ERR_NOT_OWN_RESOURCE, http: 403, condition: "Entity-backed role acts on a resource it does not own (Beneficiary acting on another beneficiary's request or another trust's statement/fee)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same user attempts both halves of a controlled step: fee disclose+post, tax prepare+review, termination initiate+approve-final-accounting" }
  - { id: ERR_TRUST_NOT_FOUND, http: 404, condition: "The trust id in the path does not exist" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Any non-trust path id or body FK id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity is not in a valid from-state for the requested transition (including terminal-state lockdown)" }
  - { id: ERR_TRUST_NOT_ACTIVE, http: 409, condition: "Trust-gated operation attempted while TrustAccount.status is not ACTIVE (or not in the operation's allowed status set)" }
  - { id: ERR_REQUEST_NOT_VOTING, http: 409, condition: "Vote cast on a request not in VOTING" }
  - { id: ERR_REQUEST_NOT_APPROVED, http: 409, condition: "Disburse attempted on a request not in APPROVED" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Vote cast by a CommitteeMember whose status is INACTIVE" }
  - { id: ERR_UNRESOLVED_COMPLIANCE_REVIEWS, http: 409, condition: "Reinstate attempted while any ComplianceReview of the trust is OPEN, REMEDIATION_PLANNED, or ESCALATED" }
  - { id: ERR_DRIFT_STILL_BREACHED, http: 409, condition: "Resolve attempted while the unrounded class weight is still outside the IPS band" }
  - { id: ERR_FINAL_STATEMENT_NOT_ACKNOWLEDGED, http: 409, condition: "Termination close attempted before the final AnnualStatement is ACKNOWLEDGED" }
  - { id: ERR_PURPOSE_OUTSIDE_STANDARD, http: 422, condition: "purpose_category not permitted by the trust's distribution_standard" }
  - { id: ERR_IPS_DRIFT_BREACH, http: 422, condition: "Purchase of an asset class that has a non-RESOLVED ComplianceReview" }
  - { id: ERR_CONCENTRATION_LIMIT_EXCEEDED, http: 422, condition: "Post-trade holding market value strictly greater than 25% of total_market_value_cents" }
  - { id: ERR_IPS_PERIOD_OVERLAP, http: 409, condition: "IPS half-open window overlaps another DRAFT/ACTIVE statement of the same trust (abutting is allowed)" }
  - { id: ERR_FEE_PERIOD_NOT_CONTIGUOUS, http: 409, condition: "FINAL FeeAssessment period overlaps or leaves a gap versus the latest non-REVERSED FINAL period (period_start must equal prior period_end + 1 day)" }
  - { id: ERR_STATEMENT_YEAR_EXISTS, http: 409, condition: "A non-SUPERSEDED AnnualStatement already exists for (trust_id, fiscal_year)" }
  - { id: ERR_DUPLICATE_TAX_YEAR, http: 409, condition: "A TaxReturnFiling already exists for (trust_id, tax_year)" }
  - { id: ERR_OBJECTION_WINDOW_EXPIRED, http: 422, condition: "Dispute attempted more than 30 days after disclosed_at/delivered_at" }
  - { id: ERR_INVALID_ELECTION_AMOUNT, http: 422, condition: "elected_65day_amount_cents exceeds distributions disbursed in [tax_year+1-01-01, tax_year+1-03-06]" }
  - { id: ERR_CROSS_TRUST_REFERENCE, http: 422, condition: "Body FK references an entity belonging to a different trust" }
  - { id: ERR_BENEFICIARY_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE beneficiary (e.g. open-voting for a DECEASED beneficiary's request)" }
  - { id: ERR_DOCUMENT_NOT_APPROVED, http: 409, condition: "Trust acceptance attempted with no APPROVED TrustDocument" }
  - { id: ERR_SHARE_SUM_INVALID, http: 422, condition: "ACTIVE members of a beneficiary class do not sum to exactly 10000 bps at acceptance" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "CommitteeMember has already cast a vote on this request" }
  - { id: ERR_LEDGER_IMMUTABLE, http: 405, condition: "PUT/PATCH/DELETE attempted on the append-only ledger" }
  - { id: ERR_COMMITTEE_QUORUM_UNAVAILABLE, http: 422, condition: "Fewer than 3 ACTIVE CommitteeMembers at open-voting" }
  - { id: ERR_UNFILED_TAX_RETURNS, http: 409, condition: "Tax clearance or termination close attempted while a TaxReturnFiling is not ACCEPTED" }
  - { id: ERR_UNPOSTED_FEE_ASSESSMENTS, http: 409, condition: "Prepare attempted while a FINAL FeeAssessment overlapping the tax year is not POSTED (and not REVERSED)" }
  - { id: ERR_INSUFFICIENT_AVAILABLE_BALANCE, http: 422, condition: "Reservation waterfall or reserve amount exceeds available income/principal" }
  - { id: ERR_FEE_EXCEEDS_AVAILABLE_BALANCE, http: 422, condition: "Fee portions exceed available balances at post time" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_trust_account_version does not match the trust's current version (OCC)" }

roles:
  - name: TrustOfficer
    description: "Bank trust officer; administers accounts, documents, beneficiaries, distribution workflow up to opening votes, statements, termination initiation"
    identity: opaque
    exclusive_operations: [submit-for-acceptance, create/interpret documents, create/mark-deceased beneficiaries, start-review, request-information, open-voting, cancel requests, generate/finalize/deliver/regenerate statements, reserve-liabilities, close termination cases]
    shared_operations: [create trusts, create distribution requests on behalf of beneficiaries, read all entities, run-compliance-check]
  - name: TrustExecutive
    description: "Senior fiduciary executive; acceptance decisions, document approval, suspension/reinstatement, escalation, committee management, fee reversal, final accounting approval, clock control"
    identity: opaque
    exclusive_operations: [accept, decline-acceptance, suspend, reinstate, approve/reject documents, create/deactivate committee members, escalate reviews, reverse fee assessments, approve-final-accounting, set clock]
    shared_operations: [read all entities, terminate trusts]
  - name: InvestmentManager
    description: "Manages investment policy statements, holdings, prices, and compliance remediation"
    identity: opaque
    exclusive_operations: [create/activate IPS, buy/sell/price holdings, plan-remediation, resolve reviews]
    shared_operations: [read trusts, holdings, reviews, run-compliance-check]
  - name: TrustOperationsOfficer
    description: "Back-office poster; ledger receipts/adjustments, fee calculation/disclosure/posting, disbursements, final distribution execution"
    identity: opaque
    exclusive_operations: [post ledger entries, create/disclose/post/recalculate fee assessments, disburse approved requests, execute termination distribute]
    shared_operations: [read all entities]
  - name: TaxSpecialist
    description: "Prepares and reviews Form 1041 filings; records tax clearance"
    identity: opaque
    exclusive_operations: [create/compute/prepare/review/file/amend tax filings, record-tax-clearance]
    shared_operations: [read trusts, ledger, filings]
  - name: CommitteeMember
    description: "Trust committee member; casts votes on distribution requests. X-User-ID equals the CommitteeMember id."
    identity: "entity_backed:CommitteeMember"
    exclusive_operations: [vote]
    shared_operations: [read requests, votes, members]
  - name: Beneficiary
    description: "Trust beneficiary; files own distribution requests, responds to information requests, acknowledges/disputes statements, disputes fees. X-User-ID equals the Beneficiary id."
    identity: "entity_backed:Beneficiary"
    exclusive_operations: [provide-information, withdraw own requests, acknowledge/dispute statements, dispute fee assessments]
    shared_operations: [create own distribution requests, read own requests/statements/assessments]
