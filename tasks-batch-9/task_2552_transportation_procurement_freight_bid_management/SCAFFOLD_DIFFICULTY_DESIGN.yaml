            - "at sample 6 (after the second trigger call) — tender_count == 6, rejection_pct == 16.67 (1/6 = 16.666... rounded half-up at 2dp, never 16.66 and never 17.00), acceptance_pct == 83.33"
            - "at sample 6 the record unwound to status LIVE, AwardAllocation.${alloc_a_id}.status == ACTIVE and Lane.${lane_a_id}.status == AWARDED"
            - "the SYSTEM MiniBid created at the boundary still exists with status REQUESTED — the unwind restores routing, not the rebid request"

