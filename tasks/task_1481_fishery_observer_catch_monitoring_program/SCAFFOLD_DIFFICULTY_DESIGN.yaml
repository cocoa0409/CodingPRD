          trigger than the ops-run invoice sweep): EMEnrollment APPROVED->ACTIVE
          (hop 1) flips Vessel.monitoring_mode -> ELECTRONIC_MONITORING (hop 1
          side effect), which voids every ISSUED|ACCEPTED SelectionNotice of the
          vessel (hop 2), which cancels each voided notice's Deployment in
          SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY with day release (hop 3). The
          notices are voided BECAUSE the vessel flipped, and the deployments are
          cancelled BECAUSE their notices were voided — not by the activate call
          directly.
