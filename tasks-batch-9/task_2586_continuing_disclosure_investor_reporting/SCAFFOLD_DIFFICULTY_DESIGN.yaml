            - "${fa_submitted_at} == \"2026-09-16T00:00:00Z\" and ${fb_submitted_at} == \"2026-09-17T00:00:00Z\""
            - "${na_status} == FILED_TIMELY, ${na_days} == 0, ${na_filed_by} == \"${fa_id}\" — the boundary day itself is inside the window because the comparison is <="
