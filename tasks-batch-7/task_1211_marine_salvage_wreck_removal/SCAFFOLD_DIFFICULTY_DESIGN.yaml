            - { call: "POST /permits", payload: { casualty_id: "${cas_id}", agency_type: COAST_GUARD, valid_from: "2026-05-01T00:00:00Z", valid_to: "2026-06-30T00:00:00Z" }, as: EnvironmentalOfficer, as_user_id: "env-01", captures: { pm_cg: $.data.id } }
            - { call: "POST /permits/${pm_cg}/grant", payload: {}, as: EnvironmentalOfficer, as_user_id: "env-01" }
            - { call: "POST /phases", payload: { contract_id: "${ct_id}", phase_type: WRECK_REMOVAL, planned_duration_hours: 96 }, as: SalvageMaster, as_user_id: "sm-01", captures: { ph_id: $.data.id } }
          trigger:
            - { call: "POST /phases/${ph_id}/activate", payload: { weather_window_id: "${ww_id}", charter_ids: ["${ch_id}"] }, as: SalvageMaster, as_user_id: "sm-01", captures: { err: $.data.error_id } }
