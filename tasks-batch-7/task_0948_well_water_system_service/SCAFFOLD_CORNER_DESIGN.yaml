      - name: corner_calc_duty_cycle_bands_drive_the_designed_maintenance_interval
        claim_type: Constants Applied
        grounds: ["calculations.duty_cycle_ratio", "calculations.duty_cycle_class", "calculations.maintenance_interval_days", "calculations.maintenance_next_due_at", "entities.MaintenancePlan.fields.interval_days_as_designed"]
        distinguishing_aspect: |
          Both duty-cycle band bounds are INCLUSIVE and both are visible one step later
          in the plan interval: drawdown 10.0 gives round_half_up(30/10.0, 2) = 3.00 ->
          LOW -> 365 days; drawdown 5.0 gives exactly 6.00 -> MODERATE -> 270 days;
          drawdown 4.99 gives round_half_up(30/4.99, 2) = 6.01 -> HIGH -> 180 days.
          With the clock at 2026-06-01T00:00:00Z the three plans' next_due_at are
          2027-06-01, 2027-02-26 and 2026-11-28 at 00:00:00.000Z. An implementation
          that treats the band bounds as exclusive files 10.0 as MODERATE and 5.0 as
          HIGH, shortening both intervals by one band.
        test_recipe:
          setup:
            - "One account, one property and three wells created with pressure_tank_drawdown_gallons 10.0, 5.0 and 4.99, media NONE on all three."
            - "Logical clock held at 2026-06-01T00:00:00Z for the whole instance so every plan's created_at, last_service_date and next_due_at are exactly derivable."
          setup_api_calls:
            - call: "POST /water-service/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
