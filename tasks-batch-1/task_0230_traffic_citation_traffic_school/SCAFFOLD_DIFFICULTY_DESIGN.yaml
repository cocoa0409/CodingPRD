              payload: { jurisdiction_id: "${jid}", license_number: "D11LIC", full_name: "En Eleven" }
              as: CourtClerk
              captures: { d11: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d11}", citation_number: "C-PV2", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
              captures: { c11: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${c11}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${c11}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-11T00:00:00Z" }
