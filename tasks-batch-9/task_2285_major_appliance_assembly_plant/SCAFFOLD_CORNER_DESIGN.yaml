              as: EngineeringLead
              as_user_id: "eng-1"
            - call: "POST /engineering-changes/${eca_id}/start-review"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-1"
            - call: "POST /engineering-changes/${eca_id}/decide"
              payload: { decision: "APPROVE" }
              as: EngineeringLead
              as_user_id: "eng-2"
            - call: "POST /engineering-changes"
              payload: { model_variant_id: "${wmx_id}", affected_part_id: "${p_door_id}", target_line_id: "${line_id}", bom_position_code: "POS-DOOR", cut_in_sequence_index: 5 }
              as: EngineeringLead
              as_user_id: "eng-1"
              captures: { ecb_id: $.data.id }
            - call: "POST /engineering-changes/${ecb_id}/submit"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-1"
            - call: "POST /engineering-changes/${ecb_id}/start-review"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-1"
            - call: "POST /engineering-changes/${ecb_id}/decide"
              payload: { decision: "APPROVE" }
              as: EngineeringLead
              as_user_id: "eng-2"
          trigger:
            - call: "POST /engineering-changes/${eca_id}/cut-in"
              payload: {}
              as: EngineeringLead
              as_user_id: "eng-2"
              captures: { err_c1_id: $.data.error_id }
            - &c_stop1
              call: "POST /lines/${line_id}/stop"
              payload: { reason: "ENGINEERING_CHANGE" }
              as: LineOperator
            - call: "POST /engineering-changes/${eca_id}/cut-in"
              payload: {}
