      - name: weekly_hours_exactly_40_no_overtime_and_48_hard_cap
        grounds:
          - calculations.worker_weekly_hours
          - endpoints."POST /farm/labor-shifts/{id}/assignments"
        distinguishing_aspect: |
          Metric: cumulative ISO-week hours on the assignment endpoint (fourth distinct
          metric/endpoint pair). Exactly 40.00h accrues 0.00 overtime; exactly 48.00h is still
          assignable; any further assignment (making 50.00h) is rejected
          ERR_WEEKLY_HOURS_EXCEEDED — equality allowed, strictly-above rejected.
        test_recipe:
          setup:
            - "Worker W1 (PACK_CREW certified); six PUBLISHED PACK_CREW shifts Mon 2026-08-03 .. Sat 2026-08-08, each 07:00-15:00 (8h); a seventh Sunday shift 2026-08-09 07:00-09:00 (2h)"
          setup_api_calls:
            - { call: "POST /farm/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: FarmManager }
            - { call: "POST /farm/workers", payload: { full_name: "W One", certifications: ["PACK_CREW"], hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { w1: "$.data.id" } }
            - { call: "POST /farm/labor-shifts", payload: { shift_date: "2026-08-03", role_type: "PACK_CREW", start_at: "2026-08-03T07:00:00Z", end_at: "2026-08-03T15:00:00Z", headcount_required: 1, planned_hourly_rate_cents: 2200 }, as: LaborPlanner, captures: { sh1: "$.data.id" } }
