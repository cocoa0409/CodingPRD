              as_user_id: "staff-lin"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "RouteSegment.${seg2}.federal_permit_status == REQUIRED"
            - "RouteSegment.${seg2}.federal_permit_agency == null"

      - name: examiner_deciding_the_docket_unauthorized
        claim_type: unauthorized_operation_denied
        grounds:
          - roles.CommissionStaff.exclusive_operations
          - roles.HearingExaminer.exclusive_operations
        distinguishing_aspect: "The examiner who closed the record cannot also grant the certificate: the decision endpoint rejects HearingExaminer with ERR_UNAUTHORIZED (403) at priority 2, before the record-closed and presiding checks it would otherwise reach, and no Certificate row is minted."
        test_recipe:
          setup:
            - "Application ACCEPTED with the evidentiary record closed"
          setup_api_calls: *cPRE
          trigger:
            - *c25
            - *c26
            - *c27
