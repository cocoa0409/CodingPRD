            - "GET /recalls/${r_id}/status-reports -> total_count == 2"
            - "The row with period_index == 2 has report_kind == PERIODIC, status == PENDING, period_start == 2026-09-10T00:00:00.000Z and due_at == 2026-09-17T00:00:00.000Z"
