              payload: { branch_id: "${b_id}", product_id: "${p1_id}", on_hand_qty: 5, factory_lead_time_days: 5 }
              as: BranchManager
              captures: { bs1_id: $.data.id }
            - call: "POST /motion/branch-stocks"
              payload: { branch_id: "${b_id}", product_id: "${p2_id}", on_hand_qty: 5, factory_lead_time_days: 5 }
              as: BranchManager
            - call: "POST /motion/orders"
              payload: { customer_id: "${c_id}", branch_id: "${b_id}" }
