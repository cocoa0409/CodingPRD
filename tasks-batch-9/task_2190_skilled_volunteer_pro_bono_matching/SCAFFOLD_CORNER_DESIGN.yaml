          trigger:
            - {call: "POST /_clock/set_current_utc", as: ProgramManager, as_user_id: "pm-1", payload: {to_iso8601: "not-a-timestamp"}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\" - not ERR_CLOCK_REGRESSION"
            - "a following POST /_clock/set_current_utc with to_iso8601 \"2026-08-01T00:00:01Z\" returns HTTP 200, proving the clock never left the startup default"
      - name: endpoint_create_project_request_missing_required_skill_code_rejected
