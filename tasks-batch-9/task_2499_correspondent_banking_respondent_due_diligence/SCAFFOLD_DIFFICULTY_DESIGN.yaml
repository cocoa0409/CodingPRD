            - "RespondentBank.${j_id}.risk_rating == LOW and RespondentBank.${j_id}.dd_state == APPROVED"

      - name: refresh_windows_are_half_open_so_adjacency_is_legal_and_the_interior_overlap_409_outranks_the_buffer_422
        grounds:
          - validations[priority=38]
          - validations[priority=40]
          - entities.PeriodicRefresh.fields.window_start
          - entities.PeriodicRefresh.fields.scheduled_due_date
          - state_machines.PeriodicRefresh.IN_PROGRESS_to_COMPLETED
        distinguishing_aspect: |
          The opposite interval convention from the monitoring-profile instance on the same clock:
          PeriodicRefresh windows are HALF-OPEN, so a new cycle starting exactly at a SCHEDULED
          cycle's scheduled_due_date is accepted, whereas the CLOSED monitoring interval rejects the
          identical geometry. It also separates the two temporal rules that a single payload can
          break at once: window_start 2026-11-10T00:00:00Z sits 11 days after a COMPLETED cycle's
          scheduled_due_date, so on its own it is the 422 ERR_REFRESH_BUFFER_VIOLATION; extending
          only the far end of that same window until it also overlaps the SCHEDULED cycle must flip
          the answer to the 409 ERR_REFRESH_WINDOW_OVERLAP (PRECEDENCE PAIR P4, priority 38 before
          priority 40) rather than keeping the 422.
        test_recipe:
          setup: >
            JurisdictionProfile DE (basel_aml_index 4.0, PERMITTED, NONE, secrecy_flag false,
            corridor_risk_weight 1.00, max_permitted_risk_rating HIGH). Respondent K home DE,
            expected_monthly_volume_usd 2000000.00, expected_monthly_count 100,
            nested_activity_permitted false, licensed, one VERIFIED 100.00% DE natural-person owner,
            eight self_rating 3 rows assessed ONBOARDING_PROVISIONAL: control_score 60.00,
            control_credit 0.2250, inherent 14.00, residual 10.85, risk_rating LOW, approved at
            clock 2026-08-01T00:00:00Z. Cycle 1 is scheduled over the HALF-OPEN window
            [2026-08-01T00:00:00Z, 2026-10-30T00:00:00Z), STARTed at the same instant, and then
            genuinely completed at clock 2026-08-03T00:00:00Z: questionnaire v2 carries self_rating
            2 in all eight domains with assessed_rating 3 overlaid on all eight (priority 33
            requires every row to carry one under REFRESH_FINAL) giving computed_control_score
            60.00, the REFRESH_FINAL risk assessment is taken at 2026-08-03T00:00:00Z (>= started_at)
            and COMPLETE then writes last_approved_at 2026-08-03T00:00:00Z and refresh_due_date
            add_months(2026-08-03, 36) = 2029-08-03T00:00:00Z. Cycle 2 is then scheduled over
            [2026-12-15T00:00:00Z, 2027-03-15T00:00:00Z) - 46 days clear of cycle 1's
            scheduled_due_date, so outside the 30-day post-completion buffer - which leaves the
            respondent in REFRESH_DUE with one COMPLETED and one SCHEDULED cycle on file.
