            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /wt/delivery-orders/${x3_o}/dispatch", payload: {}, as: AccountManager }
            - { call: "POST /wt/delivery-orders/${x3_o}/confirm-delivery", payload: { delivered_gal: 55 }, as: WaterChemist }
            - { call: "POST /wt/delivery-orders/${x3_o}/close", payload: { returned_residual_gal: 0 }, as: WaterChemist }
            - call: "POST /wt/invoices"
              payload: { account_id: "${x3_acct}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: AccountManager
              captures: { x3_inv: $.data.id }
          trigger:
            - { call: "POST /wt/invoices/${x3_inv}/issue", payload: {}, as: AccountManager }
            - call: "GET /wt/accounts/${x3_acct}"
              payload: {}
              as: AccountManager
            - { call: "POST /wt/invoices/${x3_inv}/pay", payload: {}, as: CustomerContact, as_user_id: "${x3_acct}" }
            - call: "GET /wt/accounts/${x3_acct}"
              payload: {}
              as: AccountManager
          assert:
            - "after issue: CustomerAccount.${x3_acct}.open_balance_cents == 5500"
            - "after pay: CustomerAccount.${x3_acct}.open_balance_cents == 0"
            - "Invoice.${x3_inv}.status == PAID"

  # ===========================================================================
  # Section: consistency_model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_mutation_visible_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate model: the POST response body itself reflects the mutation (status transitions, computed fields) without a follow-up GET — verified on lockout and on telemetry post."
        test_recipe:
          setup: ["ONLINE station"]
          setup_api_calls:
            - { call: "POST /wt/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /wt/accounts"
              payload: { account_name: "Imm2 Co" }
              as: AccountManager
              captures: { m1_acct: $.data.id }
            - call: "POST /wt/assets"
              payload: { account_id: "${m1_acct}", asset_tag: "CT-M1", asset_type: "BOILER", recirculation_rate_gpm: 100, system_volume_gal: 500, metallurgy: "MILD_STEEL" }
              as: WaterChemist
              captures: { m1_asset: $.data.id }
            - call: "POST /wt/products"
              payload: { product_code: "M1-1", active_pct: 10, container_size_gal: 55, unit_price_cents_per_gal: 100, contract_price_cents_per_gal: 90 }
              as: PlatformAdmin
              captures: { m1_prod: $.data.id }
            - call: "POST /wt/feed-stations"
              payload: { asset_id: "${m1_asset}", product_id: "${m1_prod}", capacity_cap_ml_per_min: 50 }
              as: WaterChemist
              captures: { m1_fs: $.data.id }
            - { call: "POST /wt/feed-stations/${m1_fs}/bring-online", payload: {}, as: WaterChemist }
          trigger:
            - call: "POST /wt/feed-stations/${m1_fs}/lockout"
              payload: {}
              as: WaterChemist
            - call: "POST /wt/feed-stations/${m1_fs}/telemetry"
              payload: { recorded_at: "2026-08-01T00:30:00Z", feed_pulses: 1000, ml_per_pulse: 2.0, level_gal: 49 }
              as: WaterChemist
              captures: { m1_err: $.data.error_id }
          assert:
            - "lockout response body has status == LOCKED_OUT (no re-read needed)"
            - "telemetry post on LOCKED_OUT station error_id == ERR_INVALID_STATE"
