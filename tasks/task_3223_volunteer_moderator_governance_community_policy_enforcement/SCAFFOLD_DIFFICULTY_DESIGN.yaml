# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3223_volunteer_moderator_governance_community_policy_enforcement
#
# Machine-readable index of every difficulty feature the scaffold claims to
# exhibit, cross-referenced from §1.1–§1.7 against the nine Difficulty Rules of
# §0.5. Nine rule_id blocks, two instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (>= 2 instances, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: health_index_rounded_per_report
        grounds:
          - calculations.community_health_index
          - calculations.open_report_weight
          - entities.Community.fields.health_index
          - entities.Community.fields.open_report_weight
        distinguishing_aspect: |
          The community domain. The pinned reading rounds each OPEN report's tier
          weight to 2 dp before summing, so three tier-1 reports give 0.99 and a
          health index of 99.01; the superseded reading sums first and rounds once,
          giving 1.00 and 99.00. The assertion pins 99.01, which the superseded
          reading cannot produce.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community holding three OPEN tier-1 content reports against the same published post, with no sanctions and no brigade clusters."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/posts"
              payload: { author_account_id: "user-ap", title: "Alpha post", body: "Body", post_type: "TEXT" }
              as: Account
              as_user_id: "user-ap"
              captures:
                post_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "POST", content_source_id: "${post_id}", reporter_account_id: "rep-1", report_reason_code: "SPAM", resolution_tier: 1 }
              as: Account
              as_user_id: "rep-1"
              captures:
                rep_1: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "POST", content_source_id: "${post_id}", reporter_account_id: "rep-2", report_reason_code: "HARASSMENT", resolution_tier: 1 }
              as: Account
              as_user_id: "rep-2"
              captures:
                rep_2: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "POST", content_source_id: "${post_id}", reporter_account_id: "rep-3", report_reason_code: "HATE_SPEECH", resolution_tier: 1 }
              as: Account
              as_user_id: "rep-3"
              captures:
                rep_3: $.data.id
          trigger:
            - call: "GET /api/communities/${alpha_id}"
              payload: {}
              as: Account
              as_user_id: "mod-alpha"
          assert:
            - "the response status is 200"
            - "Community.${alpha_id}.open_report_weight == 0.99"
            - "Community.${alpha_id}.health_index == 99.01"
            - "Community.${alpha_id}.health_index != 99.00"
            - "Community.${alpha_id}.state == ACTIVE"
            - "GET /api/communities/${alpha_id}/content-reports?status=OPEN returns exactly 3 rows"

      - name: enforcement_tier_fractional_index
        grounds:
          - calculations.account_sanction_index
          - calculations.enforcement_tier
          - entities.Account.fields.account_sanction_index
          - state_machines.Community.ACTIVE_to_RESTRICTED
        distinguishing_aspect: |
          The account domain. The pinned reading counts an ACTIVE row that is not
          counted account-wide once it is 30 days old, producing a two-thirds
          numerator and an index of 0.67; the superseded reading counts only
          account-wide rows and produces one third, or 0.33. The two-thirds index
          crosses the 0.60 gate that moves the community into RESTRICTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-11-01T00:00:00Z. One ACTIVE community, one ACTIVE top moderator, and one account carrying three ACTIVE sanctions, two of which are more than 30 days old."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-target", community_id: "${alpha_id}", decision_outcome: "MUTE_ISSUED" }
              as: PlatformAdmin
              captures:
                sanction_1: $.data.id
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-target", community_id: "${alpha_id}", decision_outcome: "BAN_ISSUED" }
              as: PlatformAdmin
              captures:
                sanction_2: $.data.id
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-target", community_id: "${alpha_id}", decision_outcome: "WARNING_ISSUED" }
              as: PlatformAdmin
              captures:
                sanction_3: $.data.id
          trigger:
            - call: "GET /api/accounts/u-target"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the response status is 200"
            - "Account.u-target.account_sanction_index == 0.67"
            - "Account.u-target.account_sanction_index != 0.33"
            - "GET /api/accounts/u-target/sanctions?status=ACTIVE returns exactly 3 rows"
            - "Community.${alpha_id}.state == RESTRICTED"
            - "Community.${alpha_id}.state != ACTIVE"
            - "Account.u-target.karma_points == 97"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (>= 2 instances, different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: effective_tier_band_added_on_every_low_band
        grounds:
          - calculations.effective_enforcement_tier
          - entities.ContentDecision.fields.dissection_band
          - entities.ContentDecision.fields.requires_cross_power_approval
          - state_machines.ContentDecision.RECORDED_to_AUDITED
        distinguishing_aspect: |
          Mode (a) — three or more inputs with a conditional branch on entity state
          and nested clamping. The pinned reading adds dissection_band to the
          outcome base on every band, so LOCK at band 1 lands on tier 4 while LOCK
          at band 3 lands on tier 5 and becomes cross-power reviewable; the
          superseded reading adds the band only from band 3 and leaves the
          material-edit LOCK below the review threshold.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with an ACTIVE top moderator and two OPEN backlog items on the same subject account."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "src-a", subject_account_id: "u-target", signal_severity_band: 4, detection_confidence: 0.75, overlap_ratio: 0.10, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_a: $.data.id
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "src-b", subject_account_id: "u-target", signal_severity_band: 4, detection_confidence: 0.70, overlap_ratio: 0.10, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_b: $.data.id
          trigger:
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_a}", decision_outcome: "LOCK", decision_confidence: 0.75, dissection_band: 1, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_low: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_b}", decision_outcome: "LOCK", decision_confidence: 0.70, dissection_band: 3, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_high: $.data.id
          assert:
            - "ContentDecision.${dec_low}.effective_enforcement_tier == 4"
            - "ContentDecision.${dec_low}.requires_cross_power_approval == false"
            - "ContentDecision.${dec_high}.effective_enforcement_tier == 5"
            - "ContentDecision.${dec_high}.requires_cross_power_approval == true"
            - "ContentDecision.${dec_low}.effective_enforcement_tier != 3"

      - name: protest_quorum_ceiling_half_then_minimum
        grounds:
          - calculations.protest_quorum_requirement
          - entities.ProtestEvent.fields.required_quorum_count
          - entities.Community.fields.active_moderator_count
          - state_machines.ProtestEvent.REQUESTED_to_COORDINATED
        distinguishing_aspect: |
          Mode (b)-adjacent integer nesting pinned as an explicit evaluation order:
          ceil(active_moderator_count / 2) is taken first and max(2, ...) second.
          With five ACTIVE moderators the pinned reading requires 3 approvals while
          the superseded floor variant requires only 2, so the same two-approval
          request is accepted under one reading and rejected with ERR_QUORUM_NOT_MET
          under the other.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community holding five ACTIVE moderators and one REQUESTED protest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: {}
              as: PlatformAdmin
              captures:
                mod_a_row: $.data[0].id
                mod_a_v: $.data[0].moderator_version
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-b", display_name: "Mod B", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_b_row: $.data.id
                alpha_v3: $.data.version
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-c", display_name: "Mod C", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v3}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_c_row: $.data.id
                alpha_v4: $.data.version
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-d", display_name: "Mod D", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v4}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_d_row: $.data.id
                alpha_v5: $.data.version
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-e", display_name: "Mod E", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v5}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_e_row: $.data.id
                alpha_v6: $.data.version
            - call: "POST /api/communities/${alpha_id}/protests"
              payload: { requested_access_mode: "READ_ONLY", conflicting_cross_power_account_ids: [], expected_community_version: "${alpha_v6}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                protest_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/approvals"
              payload: { moderator_id: "${mod_b_row}", approving_account_id: "mod-b" }
              as: Moderator
              as_user_id: "mod-b"
              captures:
                protest_v2: $.data.version
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/approvals"
              payload: { moderator_id: "${mod_c_row}", approving_account_id: "mod-c" }
              as: Moderator
              as_user_id: "mod-c"
              captures:
                protest_v3: $.data.version
          trigger:
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/coordinate"
              payload: {}
              as: Moderator
              as_user_id: "mod-a"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 409 and error_id == ERR_QUORUM_NOT_MET"
            - "GET /api/communities/${alpha_id}/protests/${protest_id} reports quorum_approval_count == 2 and required_quorum_count == 3"
            - "ProtestEvent.${protest_id}.status == REQUESTED"
            - "Community.${alpha_id}.state == ACTIVE"
            - "Community.${alpha_id}.active_moderator_count == 5"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (>= 2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: succession_dispute_block_and_revert_cycle
        grounds:
          - state_machines.TeamSuccession.PENDING_HANDOVER_to_DISCUSSION
          - state_machines.TeamSuccession.DISCUSSION_to_HANDOVER_BLOCKED
          - state_machines.TeamSuccession.HANDOVER_BLOCKED_to_PENDING_HANDOVER
          - state_machines.TeamSuccession.DISCUSSION_to_DISCUSSION
        distinguishing_aspect: |
          TeamSuccession cycles PENDING_HANDOVER -> DISCUSSION -> HANDOVER_BLOCKED
          -> PENDING_HANDOVER and also carries a DISCUSSION self-loop that counts
          rounds, so the same row re-enters the blocked state repeatedly. A linear
          A-to-B-to-C pipeline cannot produce discussion_round_count 4 on a row whose
          blocked_by_moderator_id has been set and cleared twice.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with two ACTIVE moderators and one PENDING_HANDOVER succession."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: {}
              as: PlatformAdmin
              captures:
                mod_a_row: $.data[0].id
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-b", display_name: "Mod B", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_b_row: $.data.id
                alpha_v3: $.data.version
            - call: "POST /api/communities/${alpha_id}/successions"
              payload: { expected_community_version: "${alpha_v3}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                succ_id: $.data.id
          trigger:
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/discussions"
              payload: { round_note: "Round one by mod-a" }
              as: Moderator
              as_user_id: "mod-a"
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/discussions"
              payload: { round_note: "Round two by mod-b" }
              as: Moderator
              as_user_id: "mod-b"
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/disputes"
              payload: { dispute_note: "mod-a disputes the handover" }
              as: Moderator
              as_user_id: "mod-a"
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/prevent"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/discussions"
              payload: { round_note: "Round three by mod-b after the revert" }
              as: Moderator
              as_user_id: "mod-b"
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/disputes"
              payload: { dispute_note: "mod-a disputes again" }
              as: Moderator
              as_user_id: "mod-a"
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/prevent"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/discussions"
              payload: { round_note: "Round four by mod-b" }
              as: Moderator
              as_user_id: "mod-b"
          assert:
            - "TeamSuccession.${succ_id}.state == DISCUSSION"
            - "TeamSuccession.${succ_id}.discussion_round_count == 4"
            - "TeamSuccession.${succ_id}.previous_state == DISCUSSION"
            - "TeamSuccession.${succ_id}.blocked_by_moderator_id == null"

      - name: appeal_watchdog_referral_toggle_cycle
        grounds:
          - state_machines.Appeal.SUBMITTED_to_UNDER_WATCH
          - state_machines.Appeal.UNDER_WATCH_to_SUBMITTED
          - entities.Appeal.fields.referral_count
          - entities.Appeal.fields.last_referred_at_utc
        distinguishing_aspect: |
          Appeal cycles SUBMITTED -> UNDER_WATCH -> SUBMITTED with a monotone
          referral_count that the revert never resets, so the same row is referred
          and returned repeatedly while the surviving counter records the round
          trips. No linear pipeline produces referral_count 3 on a row that is back
          in SUBMITTED.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with an ACTIVE top moderator, one banned account whose sanction is ACTIVE, and one appeal filed and submitted against that sanction."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "src-a", subject_account_id: "u-target", signal_severity_band: 5, detection_confidence: 0.90, overlap_ratio: 0.20, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_a: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_a}", decision_outcome: "BAN_ISSUED", decision_confidence: 0.90, dissection_band: 0, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_a: $.data.id
            - call: "GET /api/accounts/u-target/sanctions"
              payload: { status: "ACTIVE", community_id: "${alpha_id}" }
              as: PlatformAdmin
              captures:
                san_target: $.data[0].id
            - call: "POST /api/accounts/u-target/appeals"
              payload: { sanction_id: "${san_target}", ground_code: "ANALYSIS_ERROR", new_evidence_url: null, sanction_misapplication_present: false }
              as: PlatformAdmin
              captures:
                appeal_id: $.data.id
            - call: "POST /api/accounts/u-target/appeals/${appeal_id}/submit"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/community-administration/appeal-referrals"
              payload: { appeal_id: "${appeal_id}", note: "Referral one" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/appeal-referrals"
              payload: { appeal_id: "${appeal_id}", note: "Return one" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/appeal-referrals"
              payload: { appeal_id: "${appeal_id}", note: "Referral two" }
              as: PlatformAdmin
          assert:
            - "Appeal.${appeal_id}.state == UNDER_WATCH"
            - "Appeal.${appeal_id}.referral_count == 3"
            - "Appeal.${appeal_id}.last_referred_at_utc != null"
            - "Appeal.${appeal_id}.decision_reason_code == null"
            - "AccountSanction.${san_target}.status == ACTIVE"

  # ===========================================================================
  # Rule 4 — transitive_cascade (>= 2 instances, different triggers, depth >= 3 and >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: decision_sanction_lift_chain_depth_three
        grounds:
          - state_machines.ContentDecision.RECORDED_to_AUDITED
          - state_machines.ContentDecision.AUDITED_to_REVISED
          - state_machines.AccountSanction.ACTIVE_to_LIFTED
          - state_machines.ContentReport.RESOLVED_to_OPEN
          - state_machines.Community.RESTRICTED_to_ACTIVE
          - entities.Community.fields.health_index
          - entities.Community.fields.restricted_since_utc
        distinguishing_aspect: |
          Depth 3 from the audit trigger: the audit moves the decision RECORDED ->
          AUDITED, which is the only precondition that admits the revision, which
          alone lifts the sanction and reopens the report, which alone lets the
          reinstatement return the community to ACTIVE. The revision is refused with
          ERR_INVALID_STATE while the decision is still RECORDED, so no link can be
          skipped and each link is caused by the one before it.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community that a gate-5 decision has already moved into RESTRICTED, with its ban ACTIVE and its report RESOLVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/posts"
              payload: { author_account_id: "u-target", title: "Alpha post", body: "Body", post_type: "TEXT" }
              as: Account
              as_user_id: "u-target"
              captures:
                post_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "POST", content_source_id: "${post_id}", reporter_account_id: "rep-1", report_reason_code: "VIOLENCE", resolution_tier: 1 }
              as: Account
              as_user_id: "rep-1"
              captures:
                rep_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "${post_id}", subject_account_id: "u-target", signal_severity_band: 5, detection_confidence: 0.90, overlap_ratio: 0.40, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_a: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_a}", decision_outcome: "BAN_ISSUED", decision_confidence: 0.90, dissection_band: 0, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_id: $.data.id
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-target", community_id: "${alpha_id}", decision_outcome: "MUTE_ISSUED" }
              as: PlatformAdmin
              captures:
                san_counter: $.data.id
          trigger:
            - call: "POST /api/community-administration/decision-revisions"
              payload: { decision_id: "${dec_id}" }
              as: PlatformAdmin
              captures:
                error_id: $.data.error_id
            - call: "POST /api/community-administration/decision-audits"
              payload: { decision_id: "${dec_id}" }
              as: PlatformAdmin
              captures:
                dec_audited: $.data.status
            - call: "POST /api/community-administration/decision-revisions"
              payload: { decision_id: "${dec_id}" }
              as: PlatformAdmin
            - call: "POST /api/communities/${alpha_id}/reinstatement-requests"
              payload: {}
              as: Moderator
              as_user_id: "mod-alpha"
          assert:
            - "the first revision attempt is rejected with error_id == ERR_INVALID_STATE and ContentDecision.${dec_id}.status == RECORDED"
            - "ContentDecision.${dec_audited} resolves to status AUDITED"
            - "ContentDecision.${dec_id}.status == REVISED"
            - "the ban issued by ${dec_id} has status == LIFTED and sanitized_on_utc != null"
            - "GET /api/communities/${alpha_id}/content-reports?status=OPEN returns exactly 1 row, the report ${rep_id}"
            - "GET /api/accounts/u-target/sanctions?status=ACTIVE returns exactly 1 row, the counter sanction ${san_counter}"
            - "Account.u-target.account_sanction_index == 0.50"
            - "Community.${alpha_id}.state == ACTIVE and Community.${alpha_id}.restricted_since_utc == null"

      - name: escalation_revive_appeal_grant_chain_depth_two
        grounds:
          - state_machines.BrigadingCluster.ESCALATED_to_DETECTED
          - state_machines.Appeal.UNDER_WATCH_to_GRANTED
          - state_machines.AccountSanction.ACTIVE_to_LIFTED
          - calculations.brigade_penalty_points
          - entities.Account.fields.karma_points
        distinguishing_aspect: |
          Depth 2 from a different trigger than the audit chain: the brigade revival
          moves the cluster ESCALATED -> DETECTED, and that mutation alone is what
          pulls the community's health index up onto the threshold line; only after
          it does the watchdog deadline lapse into the GRANTED transition whose own
          side effect lifts the sanction and restores karma. The revival lifts
          nothing by itself, so the second link is caused by the first.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community holding two ESCALATED brigade clusters of band 5, an ACTIVE top moderator, a banned account whose sanction is ACTIVE, and an appeal referred once and still inside its deadline."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/brigade-clusters"
              payload: { internal_link_count: 12, external_link_count: 12, participant_count: 60, legitimate_participant_count: 6 }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                cluster_a: $.data.id
            - call: "POST /api/communities/${alpha_id}/brigade-clusters"
              payload: { internal_link_count: 12, external_link_count: 12, participant_count: 60, legitimate_participant_count: 6 }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                cluster_b: $.data.id
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${cluster_a}", sanction_ladder: "BAN" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${cluster_b}", sanction_ladder: "BAN" }
              as: PlatformAdmin
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "src-appeal", subject_account_id: "u-target", signal_severity_band: 5, detection_confidence: 0.90, overlap_ratio: 0.20, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                item_appeal: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_appeal}", decision_outcome: "BAN_ISSUED", decision_confidence: 0.90, dissection_band: 0, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                dec_appeal: $.data.id
            - call: "GET /api/accounts/u-target/sanctions"
              payload: { status: "ACTIVE", community_id: "${alpha_id}" }
              as: PlatformAdmin
              captures:
                san_target: $.data[0].id
            - call: "POST /api/accounts/u-target/appeals"
              payload: { sanction_id: "${san_target}", ground_code: "MODERATOR_MISCONDUCT", new_evidence_url: null, sanction_misapplication_present: false }
              as: PlatformAdmin
              captures:
                appeal_id: $.data.id
            - call: "POST /api/accounts/u-target/appeals/${appeal_id}/submit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/community-administration/appeal-referrals"
              payload: { appeal_id: "${appeal_id}", note: "First referral" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/community-administration/appeal-referrals"
              payload: { appeal_id: "${appeal_id}", note: "Second referral" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/brigade-revivals"
              payload: { cluster_id: "${cluster_b}" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-20T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "Appeal.${appeal_id}.referral_count == 2 before the clock advance"
            - "the revival succeeds and GET /api/communities/${alpha_id}/brigade-clusters?status=ESCALATED returns exactly 1 row, the cluster ${cluster_a}"
            - "Appeal.${appeal_id}.state == GRANTED and Appeal.${appeal_id}.decision_reason_code == MISCONDUCT_CONFIRMED"
            - "AccountSanction.${san_target}.status == LIFTED and sanitized_on_utc != null"
            - "Account.u-target.karma_points == 100"
            - "Account.u-target.account_sanction_index == 0.00"
            - "Community.${alpha_id}.health_index == 70.00"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (>= 2 instances, different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: segregation_of_duties_precedes_existence
        grounds:
          - validations[priority=3]
          - validations[priority=4]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_COMMUNITY_NOT_FOUND]
          - state_machines.TeamSuccession.DISCUSSION_to_HANDOVER_BLOCKED
        distinguishing_aspect: |
          The business_safety versus existence pair. A self-dispute aimed at a
          succession id that does not exist fails both checks, and priority 3 means
          the answer is ERR_SEGREGATION_OF_DUTIES rather than ERR_COMMUNITY_NOT_FOUND.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with an ACTIVE top moderator and a succession already in DISCUSSION whose most recent round was authored by mod-a."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/successions"
              payload: { expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                succ_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/successions/${succ_id}/discussions"
              payload: { round_note: "Opening round authored by mod-a" }
              as: Moderator
              as_user_id: "mod-a"
          trigger:
            - call: "POST /api/communities/00000000-0000-4000-8000-000000000000/successions/00000000-0000-4000-8000-000000000001/disputes"
              payload: { dispute_note: "Self-dispute against an unknown succession" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 403 and error_id == ERR_SEGREGATION_OF_DUTIES"
            - "error_id != ERR_COMMUNITY_NOT_FOUND"
            - "error_id != ERR_NOT_FOUND"
            - "error_id != ERR_INVALID_STATE"
            - "TeamSuccession.${succ_id}.state == DISCUSSION"

      - name: stale_version_precedes_invalid_state
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_STALE_VERSION]
          - errors[ERR_INVALID_STATE]
          - concurrency_rules[succession-create-stale-community]
        distinguishing_aspect: |
          The business_fiscal versus state pair. A succession is created carrying a
          stale expected_community_version while the community is no longer ACTIVE,
          so both the version check and the state gate fail, and priority 5 means the
          answer is ERR_STALE_VERSION with 412 rather than ERR_INVALID_STATE with 409.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One PROTEST_RESTRICTED community with two ACTIVE moderators whose two accounts together moderate two communities."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: {}
              as: PlatformAdmin
              captures:
                mod_a_row: $.data[0].id
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-b", display_name: "Mod B", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_b_row: $.data.id
                alpha_v3: $.data.version
            - call: "POST /api/communities"
              payload: { name: "r/Beta", description: "Beta community" }
              as: Account
              as_user_id: "mod-b"
              captures:
                beta_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/protests"
              payload: { requested_access_mode: "READ_ONLY", conflicting_cross_power_account_ids: [], expected_community_version: "${alpha_v3}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                protest_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/approvals"
              payload: { moderator_id: "${mod_a_row}", approving_account_id: "mod-a" }
              as: Moderator
              as_user_id: "mod-a"
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/approvals"
              payload: { moderator_id: "${mod_b_row}", approving_account_id: "mod-b" }
              as: Moderator
              as_user_id: "mod-b"
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/coordinate"
              payload: {}
              as: Moderator
              as_user_id: "mod-a"
          trigger:
            - call: "POST /api/communities/${alpha_id}/successions"
              payload: { expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "error_id != ERR_INVALID_STATE"
            - "GET /api/communities/${alpha_id}/successions returns 0 rows"
            - "Community.${alpha_id}.state == PROTEST_RESTRICTED"
            - "GET /api/communities/${alpha_id} reports version > 1, so the pinned expected_community_version 1 is genuinely stale"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (>= 2 instances, different metrics and endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: brigade_overlap_threshold_at_exactly_thirty_hundredths
        grounds:
          - state_machines.BrigadingCluster.DETECTED_to_ESCALATED
          - calculations.brigading_overlap_ratio
          - entities.BrigadingCluster.fields.evidence_complete
          - errors[ERR_BRIGADE_EVIDENCE_INCOMPLETE]
        distinguishing_aspect: |
          A numeric threshold crossing on overlap_ratio where the inclusive and
          exclusive readings differ by one hundredth: 3 legitimate participants out
          of 10 yields exactly 0.30 and must be escalation-eligible, while 4 out of
          10 yields 0.40 and must not.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with two DETECTED brigade clusters, one at overlap exactly 0.30 and one at 0.40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/brigade-clusters"
              payload: { internal_link_count: 5, external_link_count: 5, participant_count: 10, legitimate_participant_count: 3 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                cluster_edge: $.data.id
            - call: "POST /api/communities/${alpha_id}/brigade-clusters"
              payload: { internal_link_count: 5, external_link_count: 5, participant_count: 10, legitimate_participant_count: 4 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                cluster_below: $.data.id
          trigger:
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${cluster_edge}", sanction_ladder: "WARNING" }
              as: PlatformAdmin
            - call: "POST /api/community-administration/brigade-escalations"
              payload: { cluster_id: "${cluster_below}", sanction_ladder: "WARNING" }
              as: PlatformAdmin
              captures:
                error_id: $.data.error_id
          assert:
            - "GET /api/communities/${alpha_id}/brigade-clusters/${cluster_edge} reports overlap_ratio == 0.30 and evidence_complete == true"
            - "BrigadingCluster.${cluster_edge}.status == ESCALATED"
            - "GET /api/communities/${alpha_id}/brigade-clusters/${cluster_below} reports overlap_ratio == 0.40 and evidence_complete == false"
            - "the second escalation returns 409 with error_id == ERR_BRIGADE_EVIDENCE_INCOMPLETE"
            - "BrigadingCluster.${cluster_below}.status == DETECTED"

      - name: inactivity_window_at_exactly_ninety_days
        grounds:
          - calculations.moderator_inactivity_expiry
          - entities.Community.fields.inactive_moderator_count
          - state_machines.Moderator.ACTIVE_to_REMOVED_FOR_INACTIVITY
          - entities.Community.fields.health_index
          - entities.Community.fields.active_top_moderator_count
          - entities.Community.fields.active_moderator_count
          - errors[ERR_INACTIVITY_REMOVAL_NOT_JUSTIFIED]
          - validations[priority=12]
        distinguishing_aspect: |
          A numeric day-count boundary on a different metric and endpoint from the
          overlap ratio: the 90-day inactivity window is inclusive, so an anchor
          exactly 90 days before the logical clock is inside it and inside it exactly
          one day earlier, while the same moderator two days later is outside and the
          removal is refused as unjustified.
        test_recipe:
          setup:
            - "Logical clock at 2026-12-15T00:00:00Z. One ACTIVE community with two ACTIVE moderators, the regular moderator's action anchor set to exactly 2026-09-16T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: {}
              as: PlatformAdmin
              captures:
                mod_a_row: $.data[0].id
                mod_a_v: $.data[0].moderator_version
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-b", display_name: "Mod B", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_b_row: $.data.id
                mod_b_v: $.data.version
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-16T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities/${alpha_id}/rules"
              payload: { rule_code: "R-B", rule_text: "Mod B rule", rule_band: 1, is_sitewide_floor: false, expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-b"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/communities/${alpha_id}"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/communities/${alpha_id}/moderators/${mod_b_row}/remove"
              payload: { expected_moderator_version: "${mod_b_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                b_v_next: $.data.version
          assert:
            - "Community.${alpha_id}.inactive_moderator_count == 1, the anchor being exactly 90 days before the clock"
            - "the removal succeeds with status 200 and Moderator.${mod_b_row}.status == REMOVED_FOR_INACTIVITY with removal_reason_code == INACTIVITY"
            - "Community.${alpha_id}.inactive_moderator_count == 0 after the removal"
            - "after POST /_clock/set_current_utc to 2026-12-15T23:59:59Z, Community.${alpha_id}.inactive_moderator_count == 0 because the only overdue moderator is no longer ACTIVE"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (>= 2 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: moderator_demotion_requires_active_top_moderator
        grounds:
          - state_machines.Moderator.ACTIVE_to_DEMOTED
          - entities.Community.fields.active_top_moderator_count
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Moderator -> Community. The demote transition's state precondition depends
          on a derived count of the parent community, so the same endpoint on the
          same target row succeeds while another ACTIVE top moderator exists and
          fails with ERR_INVALID_STATE once the team has none.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with mod-a appointed top and mod-b appointed top, so active_top_moderator_count is 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: {}
              as: PlatformAdmin
              captures:
                mod_a_row: $.data[0].id
                mod_a_v: $.data[0].moderator_version
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-b", display_name: "Mod B", moderator_role: "TOP_MODERATOR", expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_b_row: $.data.id
                mod_b_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/moderators/${mod_a_row}/resign"
              payload: { expected_moderator_version: "${mod_a_v}" }
              as: Moderator
              as_user_id: "mod-a"
          trigger:
            - call: "POST /api/communities/${alpha_id}/moderators/${mod_b_row}/demote"
              payload: { expected_moderator_version: "${mod_b_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_STALE_VERSION"
            - "GET /api/communities/${alpha_id}/moderators/${mod_a_row} reports status == RESIGNED"
            - "GET /api/communities/${alpha_id} reports active_top_moderator_count == 1 and active_moderator_count == 1"
            - "Moderator.${mod_b_row}.status == ACTIVE and Moderator.${mod_b_row}.moderator_role == TOP_MODERATOR"

      - name: coordinator_approval_requires_active_moderator_row
        grounds:
          - state_machines.ProtestEvent.REQUESTED_to_COORDINATED
          - entities.Moderator.fields.status
          - entities.Community.fields.active_moderator_count
          - calculations.protest_distinct_power_count
          - errors[ERR_QUORUM_NOT_MET]
        distinguishing_aspect: |
          ProtestEvent -> Moderator, with the Moderator row's status deciding whether
          a recorded approval still counts. The same approval rows are written in both
          runs, but once one approving moderator is resigned the quorum drops and the
          coordinate call is refused, so the outcome is caused by the moderator's
          state rather than by the protest's own data.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with two ACTIVE moderators and a REQUESTED protest already carrying 2 approvals."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: {}
              as: PlatformAdmin
              captures:
                mod_a_row: $.data[0].id
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-b", display_name: "Mod B", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_b_row: $.data.id
                mod_b_v: $.data.version
                alpha_v3: $.data.version
            - call: "POST /api/communities"
              payload: { name: "r/Beta", description: "Beta community" }
              as: Account
              as_user_id: "mod-b"
              captures:
                beta_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/protests"
              payload: { requested_access_mode: "READ_ONLY", conflicting_cross_power_account_ids: [], expected_community_version: "${alpha_v3}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                protest_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/approvals"
              payload: { moderator_id: "${mod_a_row}", approving_account_id: "mod-a" }
              as: Moderator
              as_user_id: "mod-a"
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/approvals"
              payload: { moderator_id: "${mod_b_row}", approving_account_id: "mod-b" }
              as: Moderator
              as_user_id: "mod-b"
            - call: "POST /api/communities/${alpha_id}/moderators/${mod_b_row}/resign"
              payload: { expected_moderator_version: "${mod_b_v}" }
              as: Moderator
              as_user_id: "mod-b"
          trigger:
            - call: "POST /api/communities/${alpha_id}/protests/${protest_id}/coordinate"
              payload: {}
              as: Moderator
              as_user_id: "mod-a"
              captures:
                error_id: $.data.error_id
          assert:
            - "the response status is 409 and error_id == ERR_QUORUM_NOT_MET"
            - "GET /api/protests/${protest_id}/approvals returns exactly 2 approval rows"
            - "GET /api/communities/${alpha_id}/moderators/${mod_b_row} reports status == RESIGNED"
            - "ProtestEvent.${protest_id}.quorum_approval_count == 1 and required_quorum_count == 2"
            - "Community.${alpha_id}.state == ACTIVE and Community.${alpha_id}.active_moderator_count == 1"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (>= 2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: protest_restriction_cooldown_rejects_overlapping_request
        grounds:
          - state_machines.ProtestEvent.REQUESTED_to_COORDINATED
          - state_machines.Community.PROTEST_RESTRICTED_to_ACTIVE
          - entities.Community.fields.restricted_since_utc
          - state_machines.Community.ACTIVE_to_PROTEST_RESTRICTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Closed-interval semantics with an exact touch point. A second protest is
          refused while the first restriction interval is still open, including at
          the instant restricted_since_utc was set; once the first protest ends the
          second coordinates immediately, so adjacency at the boundary is accepted
          and only true overlap is rejected.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One community holding a COORDINATED READ_ONLY protest, so its restriction interval is open, plus a second REQUESTED protest with 2 approvals."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-a"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "GET /api/communities/${alpha_id}/moderators"
              payload: {}
              as: PlatformAdmin
              captures:
                mod_a_row: $.data[0].id
            - call: "POST /api/communities/${alpha_id}/moderators"
              payload: { moderator_account_id: "mod-b", display_name: "Mod B", moderator_role: "REGULAR_MODERATOR", expected_community_version: "${alpha_v}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                mod_b_row: $.data.id
                alpha_v3: $.data.version
            - call: "POST /api/communities"
              payload: { name: "r/Beta", description: "Beta community" }
              as: Account
              as_user_id: "mod-b"
              captures:
                beta_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/protests"
              payload: { requested_access_mode: "READ_ONLY", conflicting_cross_power_account_ids: [], expected_community_version: "${alpha_v3}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                protest_one: $.data.id
            - call: "POST /api/communities/${alpha_id}/protests/${protest_one}/approvals"
              payload: { moderator_id: "${mod_a_row}", approving_account_id: "mod-a" }
              as: Moderator
              as_user_id: "mod-a"
            - call: "POST /api/communities/${alpha_id}/protests/${protest_one}/approvals"
              payload: { moderator_id: "${mod_b_row}", approving_account_id: "mod-b" }
              as: Moderator
              as_user_id: "mod-b"
            - call: "POST /api/communities/${alpha_id}/protests/${protest_one}/coordinate"
              payload: {}
              as: Moderator
              as_user_id: "mod-a"
              captures:
                alpha_v4: $.data.version
            - call: "POST /api/communities/${alpha_id}/protests"
              payload: { requested_access_mode: "RESTRICTED", conflicting_cross_power_account_ids: [], expected_community_version: "${alpha_v4}" }
              as: Moderator
              as_user_id: "mod-a"
              captures:
                protest_two: $.data.id
            - call: "POST /api/communities/${alpha_id}/protests/${protest_two}/approvals"
              payload: { moderator_id: "${mod_a_row}", approving_account_id: "mod-a" }
              as: Moderator
              as_user_id: "mod-a"
            - call: "POST /api/communities/${alpha_id}/protests/${protest_two}/approvals"
              payload: { moderator_id: "${mod_b_row}", approving_account_id: "mod-b" }
              as: Moderator
              as_user_id: "mod-b"
          trigger:
            - call: "POST /api/communities/${alpha_id}/protests/${protest_two}/coordinate"
              payload: {}
              as: Moderator
              as_user_id: "mod-a"
              captures:
                error_id: $.data.error_id
            - call: "POST /api/communities/${alpha_id}/protests/${protest_one}/end"
              payload: {}
              as: Moderator
              as_user_id: "mod-a"
            - call: "POST /api/communities/${alpha_id}/protests/${protest_two}/coordinate"
              payload: {}
              as: Moderator
              as_user_id: "mod-a"
          assert:
            - "the first coordinate attempt returns 409 with error_id == ERR_INVALID_STATE"
            - "ProtestEvent.${protest_two}.status == REQUESTED after the rejection"
            - "after the end call Community.${alpha_id}.restricted_since_utc == null and Community.${alpha_id}.state == ACTIVE"
            - "the second coordinate attempt succeeds and ProtestEvent.${protest_two}.status == COORDINATED"
            - "Community.${alpha_id}.state == PROTEST_RESTRICTED"

      - name: moderation_action_window_on_publication_age
        grounds:
          - calculations.content_legitimacy_score
          - entities.AutoDetectionBacklogItem.fields.published_at_utc
          - entities.ContentReport.fields.status
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Half-open threshold semantics on a different resource, keyed on how many
          whole days have elapsed between published_at_utc and the logical clock, so
          the window's edge is a day-count boundary rather than an instant. The same
          detection parameters bite differently at age 0 and at age 3 because the
          report this very detection creates is counted in the recompute, and an
          out-of-enum source_type inside the same window is refused as a request-shape
          error instead of an overlap conflict.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with an ACTIVE top moderator, no prior detections and no prior reports."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
          trigger:
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "src-fresh", subject_account_id: "u-target", signal_severity_band: 2, detection_confidence: 0.75, overlap_ratio: 0.10, published_at_utc: "2026-09-15T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_fresh: $.data.id
                fresh_score: $.data.legitimacy_score
                fresh_band: $.data.legitimacy_band
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "POST", content_source_id: "src-fresh", reporter_account_id: "rep-1", report_reason_code: "SPAM", resolution_tier: 1 }
              as: Account
              as_user_id: "rep-1"
              captures:
                rep_fresh: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "POST", content_source_id: "src-fresh", reporter_account_id: "rep-2", report_reason_code: "SPAM", resolution_tier: 1 }
              as: Account
              as_user_id: "rep-2"
              captures:
                rep_fresh_2: $.data.id
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "src-fresh", subject_account_id: "u-target", signal_severity_band: 2, detection_confidence: 0.75, overlap_ratio: 0.10, published_at_utc: "2026-09-15T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_aged: $.data.id
                aged_score: $.data.legitimacy_score
                aged_band: $.data.legitimacy_band
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POLL", source_id: "src-enum", subject_account_id: "u-target", signal_severity_band: 2, detection_confidence: 0.75, overlap_ratio: 0.10, published_at_utc: "2026-09-15T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                error_id: $.data.error_id
          assert:
            - "the first detection returns status 201 with fresh_score == 48 and fresh_band == MID"
            - "after the two reports are filed, the third detection returns status 201 with aged_score == 39 and aged_band == MID"
            - "the fourth detection returns status 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /api/communities/${alpha_id}/automated-detection-backlog-items returns exactly 2 rows"
            - "GET /api/communities/${alpha_id}/content-reports?status=OPEN returns exactly 2 rows"

  # ===========================================================================
  # Rule 9 — compensating_invariant (>= 2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: karma_and_sanction_index_conserved_across_reinstate_then_lift
        grounds:
          - entities.Account.fields.karma_points
          - entities.Account.fields.account_sanction_index
          - state_machines.AccountSanction.LIFTED_to_ACTIVE
          - state_machines.AccountSanction.ACTIVE_to_LIFTED
          - calculations.account_sanction_index
          - errors[ERR_ACTIVE_SANCTION_CONFLICT]
        distinguishing_aspect: |
          The conserved quantity is the pair of account-level values karma_points and
          account_sanction_index taken together across two accounts, and the
          compensating pair is a reinstatement followed by the lift it is paired with.
          Restoring the sanction returns both accounts to the values the lift had
          just produced, and the paired operation is refused with
          ERR_ACTIVE_SANCTION_CONFLICT when the sanction it would reinstate is
          already ACTIVE, so no drift can leak into the named quantities.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with an ACTIVE top moderator, a warning-sanctioned account, and a banned account whose appeal has just been granted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-target", community_id: "${alpha_id}", decision_outcome: "WARNING_ISSUED" }
              as: PlatformAdmin
              captures:
                san_target: $.data.id
            - call: "POST /api/community-administration/account-sanctions"
              payload: { account_id: "u-banned", community_id: "${alpha_id}", decision_outcome: "BAN_ISSUED" }
              as: PlatformAdmin
              captures:
                san_banned: $.data.id
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "src-a", subject_account_id: "u-banned", signal_severity_band: 5, detection_confidence: 0.90, overlap_ratio: 0.20, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_a: $.data.id
            - call: "POST /api/accounts/u-banned/appeals"
              payload: { sanction_id: "${san_banned}", ground_code: "ANALYSIS_ERROR", new_evidence_url: null, sanction_misapplication_present: false }
              as: PlatformAdmin
              captures:
                appeal_id: $.data.id
            - call: "POST /api/accounts/u-banned/appeals/${appeal_id}/submit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/accounts/u-banned/appeals/${appeal_id}/decide"
              payload: { decision: "GRANT" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/accounts/u-banned"
              payload: {}
              as: PlatformAdmin
            - call: "GET /api/accounts/u-target"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/community-administration/sanction-reinstatements"
              payload: { sanction_id: "${san_banned}" }
              as: PlatformAdmin
            - call: "GET /api/accounts/u-banned"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/community-administration/sanction-reinstatements"
              payload: { sanction_id: "${san_banned}" }
              as: PlatformAdmin
              captures:
                error_id: $.data.error_id
          assert:
            - "after the appeal grant Account.karma_points reads 97 and account_sanction_index reads 0.50"
            - "the reinstatement returns status 200 and AccountSanction.${san_banned}.status == ACTIVE with sanitized_on_utc == null"
            - "Account.u-banned.karma_points == 97 and Account.u-banned.account_sanction_index == 0.50"
            - "Account.u-target.karma_points == 97 and Account.u-target.account_sanction_index == 0.50"
            - "the second reinstatement returns 409 with error_id == ERR_ACTIVE_SANCTION_CONFLICT"
            - "Account.u-banned.karma_points == 97 and Account.u-target.karma_points == 97, both unchanged by the rejected second reinstatement"

      - name: open_report_count_conserved_across_revision_of_removal
        grounds:
          - entities.Community.fields.open_report_weight
          - entities.Community.fields.health_index
          - state_machines.ContentReport.RESOLVED_to_OPEN
          - state_machines.ContentReport.RESOLVED_to_RESOLVED_LOCKED
          - state_machines.ContentDecision.AUDITED_to_REVISED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A different conserved quantity: the count of OPEN reports in the community
          and the health index derived from it. Recording the decision and then
          revising it returns the count, the weight and the health index to the
          pre-decision values, while a LOCK outcome pins exactly one of the two
          reports in the terminal RESOLVED_LOCKED state so the compensating revision
          reaches the other and the count settles one higher than it would if the
          revision had reached both.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-15T00:00:00Z. One ACTIVE community with an ACTIVE top moderator, one published post and two OPEN tier-3 content reports against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/communities"
              payload: { name: "r/Alpha", description: "Alpha community" }
              as: Account
              as_user_id: "mod-alpha"
              captures:
                alpha_id: $.data.id
                alpha_v: $.data.version
            - call: "POST /api/communities/${alpha_id}/posts"
              payload: { author_account_id: "u-target", title: "Alpha post", body: "Body", post_type: "TEXT" }
              as: Account
              as_user_id: "u-target"
              captures:
                post_id: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "POST", content_source_id: "${post_id}", reporter_account_id: "rep-1", report_reason_code: "VIOLENCE", resolution_tier: 3 }
              as: Account
              as_user_id: "rep-1"
              captures:
                rep_remove: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-reports"
              payload: { content_source_type: "POST", content_source_id: "${post_id}", reporter_account_id: "rep-2", report_reason_code: "HATE_SPEECH", resolution_tier: 3 }
              as: Account
              as_user_id: "rep-2"
              captures:
                rep_lock: $.data.id
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "${rep_remove}", subject_account_id: "u-target", signal_severity_band: 5, detection_confidence: 0.90, overlap_ratio: 0.20, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_remove: $.data.id
            - call: "POST /api/communities/${alpha_id}/automated-detection-backlog-items"
              payload: { source_type: "POST", source_id: "${rep_lock}", subject_account_id: "u-target", signal_severity_band: 5, detection_confidence: 0.90, overlap_ratio: 0.20, published_at_utc: "2026-09-12T00:00:00Z" }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                item_lock: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_remove}", decision_outcome: "REMOVE", decision_confidence: 0.90, dissection_band: 0, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_remove: $.data.id
            - call: "POST /api/communities/${alpha_id}/content-decisions"
              payload: { auto_detection_backlog_item_id: "${item_lock}", decision_outcome: "LOCK", decision_confidence: 0.90, dissection_band: 0, precedent_approval_count: 0 }
              as: Moderator
              as_user_id: "mod-alpha"
              captures:
                dec_lock: $.data.id
            - call: "POST /api/community-administration/decision-audits"
              payload: { decision_id: "${dec_remove}" }
              as: PlatformAdmin
              captures:
                audited_status: $.data.status
            - call: "POST /api/community-administration/decision-audits"
              payload: { decision_id: "${dec_lock}" }
              as: PlatformAdmin
              captures:
                audited_lock_status: $.data.status
          trigger:
            - call: "POST /api/community-administration/decision-revisions"
              payload: { decision_id: "${dec_remove}" }
              as: PlatformAdmin
            - call: "GET /api/communities/${alpha_id}/content-reports"
              payload: {}
              as: PlatformAdmin
          assert:
            - "before the revision GET /api/communities/${alpha_id}/content-reports?status=OPEN returns 0 rows"
            - "after the revision ContentReport.${rep_remove}.status == OPEN and ContentReport.${rep_lock}.status == RESOLVED_LOCKED"
            - "GET /api/communities/${alpha_id}/content-reports?status=OPEN returns exactly 1 row, the report ${rep_remove}"
            - "Community.${alpha_id}.open_report_weight == 0.67"
            - "Community.${alpha_id}.health_index == 99.33"
            - "Community.${alpha_id}.health_index != 100.00"