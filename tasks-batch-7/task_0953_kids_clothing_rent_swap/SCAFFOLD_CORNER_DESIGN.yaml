            - "slots_occupied == 1"
            - "slots_permanently_consumed == 0"
            - "swaps_remaining == 1"
            - "pause_days_remaining_period == 30"
            - "pause_days_remaining_lifetime == 90"
            - "credit_balance_cents == 0"
