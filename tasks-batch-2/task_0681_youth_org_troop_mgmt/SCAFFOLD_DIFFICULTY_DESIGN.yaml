# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Youth Organization & Troop Management — Expert
# 9 rule_ids x >= 2 instances = 18 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ------------------------------------------------------------------ Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: dues_proration_youth_vs_adult_rate
        grounds:
          - calculations.dues_proration
          - entities.Member.fields.member_type
          - entities.Council.fields.youth_dues_cents
          - entities.Council.fields.adult_dues_cents
        distinguishing_aspect: |
          Same issued_on month, two member types: YOUTH uses youth_dues_cents and
          ADULT uses adult_dues_cents — the variant lives on the Member domain and
          produces different DuesInvoice.amount_cents for identical month inputs.
        test_recipe:
          setup:
            - "Council with youth_dues_cents=12000, adult_dues_cents=4500, program_year=2026."
            - "A CHARTERED-irrelevant PROVISIONAL troop with one YOUTH and one ADULT member, both PENDING."
            - "Clock at default 2026-04-01T00:00:00Z (unused; proration keys on issued_on, not clock)."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Lakeshore Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-101", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Y One", birthdate: "2014-05-01" }
              as: TroopLeader
              captures: { youth_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "ADULT", full_name: "A One", birthdate: "1985-05-01" }
              as: TroopLeader
              captures: { adult_id: $.data.id }
          trigger:
            - call: "POST /members/${youth_id}/dues-invoices"
              payload: { issued_on: "2026-06-15" }
              as: TroopLeader
              captures: { youth_inv_id: $.data.id }
            - call: "POST /members/${adult_id}/dues-invoices"
              payload: { issued_on: "2026-06-15" }
              as: TroopLeader
              captures: { adult_inv_id: $.data.id }
          assert:
            - "DuesInvoice.${youth_inv_id}.amount_cents == 7000"   # 12000*7/12, months_remaining=7
            - "DuesInvoice.${adult_inv_id}.amount_cents == 2625"   # 4500*7/12 = 2625
            - "DuesInvoice.${youth_inv_id}.amount_cents != DuesInvoice.${adult_inv_id}.amount_cents"

      - name: recharter_sweep_projected_vs_settled_balance
        grounds:
          - calculations.recharter_balance_sweep
          - state_machines.FundraiserOrder.PLACED_to_FILLED
          - validations[priority=15]
        distinguishing_aspect: |
          The PROJECTED variant counts commissions from PLACED+FILLED orders while the
          SETTLED variant (the recharter eligibility gate) counts only FILLED-order
          commissions — same TROOP_DUES ledger, two inclusion sets, divergent eligible
          total on the Troop domain (distinct from the Member-domain dues variant above).
        test_recipe:
          setup:
            - "Council charter_fee_cents=30000; one LIVE fundraiser unit_price_cents=500, total_inventory_units=2000."
            - "Troop has one PLACED order (150u, commission 12500) plus one FILLED order (150u, commission 12500)."
            - "SETTLED TROOP_DUES = 12500 (FILLED only) < 30000 charter fee, so recharter is gated."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Pine Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-201", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Seller", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { seller_id: $.data.id }
            - call: "POST /councils/${council_id}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 2000 }
              as: CouncilRegistrar
              captures: { fr_id: $.data.id, fr_v: $.data.version }
            - call: "POST /fundraisers/${fr_id}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { fr_v2: $.data.version }
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr_id}", troop_id: "${troop_id}", seller_member_id: "${seller_id}", units: 150, expected_fundraiser_version: "${fr_v2}" }
              as: TroopLeader
              captures: { order_filled_id: $.data.id, fr_v3: $.data.version }
            - call: "POST /fundraiser-orders/${order_filled_id}/fill"
              payload: {}
              as: TroopLeader
            - call: "GET /fundraisers/${fr_id}"
              payload: {}
              as: CouncilRegistrar
              captures: { fr_v4: $.data.version }
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr_id}", troop_id: "${troop_id}", seller_member_id: "${seller_id}", units: 150, expected_fundraiser_version: "${fr_v4}" }
              as: TroopLeader
              captures: { order_placed_id: $.data.id }
            - call: "GET /troops/${troop_id}"
              payload: {}
              as: CouncilRegistrar
              captures: { troop_v: $.data.version }
          trigger:
            - call: "POST /troops/${troop_id}/recharter"
              payload: { expected_troop_version: "${troop_v}" }
              as: CouncilRegistrar
              captures: { rc_error: $.data.error_id }
          assert:
            # SETTLED=12500 (only the FILLED order) < 30000 charter fee -> gated even though PROJECTED=25000
            - "rc_error == ERR_INSUFFICIENT_TROOP_FUNDS"
            - "Troop.${troop_id}.charter_status == PROVISIONAL"

  # ------------------------------------------------------------------ Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: commission_marginal_tier_straddle_three_inputs
        grounds:
          - calculations.fundraiser_troop_commission
          - entities.FundraiserOrder.fields.units
          - entities.Fundraiser.fields.unit_price_cents
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — units, unit_price_cents, and the
          marginal tier schedule combine through nested min/max so a 600-unit order
          straddles all three tiers (RATE1/RATE2/RATE3), not a single linear rate.
        test_recipe:
          setup:
            - "LIVE fundraiser unit_price_cents=500, total_inventory_units=2000."
            - "One order of 600 units straddling tiers 1 (1-100), 2 (101-500), 3 (501+)."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Tier Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-301", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Seller", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { seller_id: $.data.id }
            - call: "POST /councils/${council_id}/fundraisers"
              payload: { product: "POPCORN", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 2000 }
              as: CouncilRegistrar
              captures: { fr_id: $.data.id }
            - call: "POST /fundraisers/${fr_id}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { fr_v2: $.data.version }
          trigger:
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr_id}", troop_id: "${troop_id}", seller_member_id: "${seller_id}", units: 600, expected_fundraiser_version: "${fr_v2}" }
              as: TroopLeader
              captures: { order_id: $.data.id }
          assert:
            # t1=100*500*.15=7500 ; t2=400*500*.20=40000 ; t3=100*500*.25=12500 ; sum=60000
            - "FundraiserOrder.${order_id}.troop_commission_cents == 60000"
            - "FundraiserOrder.${order_id}.gross_cents == 300000"

      - name: recharter_sweep_evaluation_order_pinned
        grounds:
          - calculations.recharter_balance_sweep
          - state_machines.Troop.PROVISIONAL_to_CHARTERED
          - calculations.council_fund_balances
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — the
          recharter first computes settled TROOP_DUES, gates on it, THEN debits
          charter_fee_cents from TROOP_DUES and credits COUNCIL_CASH; reversing the
          order would let the debit deplete the very balance the gate reads. Order is
          fixed: read-gate, then debit, then credit.
        test_recipe:
          setup:
            - "Troop with READY posture (>=5 youth registered, >=2 cleared+trained leaders) and settled TROOP_DUES >= 30000."
            - "Achieved via 5 paid youth (full dues) and 2 cleared+trained leaders, plus one FILLED fundraiser order seeding settled dues."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Order Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-401", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /councils/${council_id}/fundraisers"
              payload: { product: "COOKIES", unit_price_cents: 500, unit_cost_cents: 200, total_inventory_units: 2000 }
              as: CouncilRegistrar
              captures: { fr_id: $.data.id }
            - call: "POST /fundraisers/${fr_id}/go-live"
              payload: {}
              as: CouncilRegistrar
              captures: { fr_v2: $.data.version }
            # One FILLED 600u order => commission 60000 settled into TROOP_DUES (>= 30000 charter fee)
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Seller", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { seller_id: $.data.id }
            - call: "POST /fundraiser-orders"
              payload: { fundraiser_id: "${fr_id}", troop_id: "${troop_id}", seller_member_id: "${seller_id}", units: 600, expected_fundraiser_version: "${fr_v2}" }
              as: TroopLeader
              captures: { order_id: $.data.id }
            - call: "POST /fundraiser-orders/${order_id}/fill"
              payload: {}
              as: TroopLeader
            # 5 registered youth: register seller + 4 more youth, pay full dues to flip them REGISTERED
            - call: "POST /members/${seller_id}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv0: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv0}", member_id: "${seller_id}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Y2", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { y2: $.data.id }
            - call: "POST /members/${y2}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv2: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv2}", member_id: "${y2}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Y3", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { y3: $.data.id }
            - call: "POST /members/${y3}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv3: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv3}", member_id: "${y3}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Y4", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { y4: $.data.id }
            - call: "POST /members/${y4}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv4: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv4}", member_id: "${y4}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Y5", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { y5: $.data.id }
            - call: "POST /members/${y5}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv5: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv5}", member_id: "${y5}", amount_cents: 12000 }
              as: CouncilRegistrar
            # 2 cleared+trained leaders
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "ADULT", full_name: "L1", birthdate: "1980-01-01" }
              as: TroopLeader
              captures: { l1: $.data.id }
            - call: "POST /members/${l1}/leader-credentials"
              payload: { requested_by_user_id: "leader-bob" }
              as: TroopLeader
              captures: { lc1: $.data.id }
            - call: "POST /leader-credentials/${lc1}/start-bgcheck"
              payload: {}
              as: CouncilRegistrar
            - call: "POST /leader-credentials/${lc1}/resolve-bgcheck"
              payload: { outcome: "CLEAR" }
              as: CouncilRegistrar
              as_user_id: "registrar-amy"
            - call: "POST /leader-credentials/${lc1}/complete-training"
              payload: {}
              as: CouncilRegistrar
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "ADULT", full_name: "L2", birthdate: "1980-01-01" }
              as: TroopLeader
              captures: { l2: $.data.id }
            - call: "POST /members/${l2}/leader-credentials"
              payload: { requested_by_user_id: "leader-bob" }
              as: TroopLeader
              captures: { lc2: $.data.id }
            - call: "POST /leader-credentials/${lc2}/start-bgcheck"
              payload: {}
              as: CouncilRegistrar
            - call: "POST /leader-credentials/${lc2}/resolve-bgcheck"
              payload: { outcome: "CLEAR" }
              as: CouncilRegistrar
              as_user_id: "registrar-amy"
            - call: "POST /leader-credentials/${lc2}/complete-training"
              payload: {}
              as: CouncilRegistrar
            - call: "GET /troops/${troop_id}"
              payload: {}
              as: CouncilRegistrar
              captures: { troop_v: $.data.version }
          trigger:
            - call: "POST /troops/${troop_id}/recharter"
              payload: { expected_troop_version: "${troop_v}" }
              as: CouncilRegistrar
              captures: { troop_v_after: $.data.version }
          assert:
            - "Troop.${troop_id}.charter_status == CHARTERED"
            # settled TROOP_DUES before sweep = 60000 (commission) + 60000 (5x12000 dues) = 120000; after debit = 90000
            - "Troop.${troop_id}.dues_account_cents == 90000"
            - "Council.${council_id}.fund_cash_cents == 330000"   # 600*500 fill gross 300000 + 30000 charter sweep

  # ------------------------------------------------------------------ Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: advancement_submitted_returned_resubmit_cycle
        grounds:
          - state_machines.Advancement.SUBMITTED_to_RETURNED
          - state_machines.Advancement.RETURNED_to_SUBMITTED
          - state_machines.Advancement.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Advancement is cyclic: SUBMITTED -> RETURNED -> SUBMITTED loops before
          terminal APPROVED, exercising a revision loop on the Advancement entity
          (distinct entity from the parallel-dimension machine below).
        test_recipe:
          setup:
            - "A REGISTERED youth with a RANK advancement, all requirements signed, currently SUBMITTED then RETURNED."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Cyc Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-501", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Adv Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { youth_id: $.data.id }
            - call: "POST /members/${youth_id}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${youth_id}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /members/${youth_id}/advancements"
              payload: { kind: "RANK", target: "TENDERFOOT", requirements_total: 2 }
              as: TroopLeader
              captures: { adv_id: $.data.id }
            - call: "POST /advancements/${adv_id}/sign-requirement"
              payload: {}
              as: TroopLeader
            - call: "POST /advancements/${adv_id}/sign-requirement"
              payload: {}
              as: TroopLeader
            - call: "POST /advancements/${adv_id}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "leader-bob"
            - call: "POST /advancements/${adv_id}/return"
              payload: {}
              as: CouncilRegistrar
          trigger:
            - call: "POST /advancements/${adv_id}/submit"
              payload: {}
              as: TroopLeader
              as_user_id: "leader-bob"
              captures: { st: $.data.status }
            - call: "POST /advancements/${adv_id}/approve"
              payload: {}
              as: CouncilRegistrar
              as_user_id: "registrar-amy"
          assert:
            - "Advancement.${adv_id}.status == APPROVED"   # loop closed RETURNED->SUBMITTED->APPROVED
            - "Member.${youth_id}.rank == TENDERFOOT"

      - name: event_registration_parallel_permission_health_dimensions
        grounds:
          - state_machines.EventRegistration.HOLD_to_HOLD
          - entities.EventRegistration.fields.permission_status
          - entities.EventRegistration.fields.health_status
        distinguishing_aspect: |
          EventRegistration carries two independent parallel dimensions
          (permission_status, health_status) that evolve on the same row via separate
          triggers before status can reach CONFIRMED — a parallel state machine on a
          different entity than the cyclic Advancement above.
        test_recipe:
          setup:
            - "A REGISTERED youth and an OPEN event (capacity 5, requires_health_form true) with a HOLD registration."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Par Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-601", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Ev Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { youth_id: $.data.id }
            - call: "POST /members/${youth_id}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${youth_id}", amount_cents: 12000 }
              as: CouncilRegistrar
            - call: "POST /troops/${troop_id}/events"
              payload: { title: "Summer Camp", starts_at: "2026-07-01T09:00:00Z", ends_at: "2026-07-03T17:00:00Z", capacity: 5, requires_health_form: true }
              as: TroopLeader
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/registrations"
              payload: { member_id: "${youth_id}" }
              as: TroopLeader
              captures: { reg_id: $.data.id }
            - call: "POST /event-registrations/${reg_id}/sign-permission"
              payload: {}
              as: TroopLeader
          trigger:
            - call: "POST /event-registrations/${reg_id}/file-health"
              payload: {}
              as: TroopLeader
              captures: { health: $.data.health_status, perm: $.data.permission_status }
            - call: "POST /event-registrations/${reg_id}/confirm"
              payload: {}
              as: TroopLeader
          assert:
            - "EventRegistration.${reg_id}.permission_status == SIGNED"
            - "EventRegistration.${reg_id}.health_status == ON_FILE"
            - "EventRegistration.${reg_id}.status == CONFIRMED"
            - "Event.${event_id}.confirmed_count == 1"

  # ------------------------------------------------------------------ Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: payment_paid_registered_troop_posture_depth3
        grounds:
          - state_machines.Member.PENDING_to_REGISTERED
          - entities.Troop.fields.registered_youth_count
          - entities.Troop.fields.recharter_posture
        distinguishing_aspect: |
          Depth-3 chain triggered by a Payment: posting payment -> DuesInvoice.status
          flips to PAID -> that flip drives Member.registration_status to REGISTERED ->
          which recomputes Troop.registered_youth_count and recharter_posture. Each hop
          is caused by the prior hop, not by the payment directly.
        test_recipe:
          setup:
            - "PENDING youth with an OPEN DuesInvoice (amount 12000) under a fresh troop."
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "Cas Council", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { council_id: $.data.id }
            - call: "POST /councils/${council_id}/troops"
              payload: { unit_number: "U-701", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { troop_id: $.data.id }
            - call: "POST /troops/${troop_id}/members"
              payload: { member_type: "YOUTH", full_name: "Cas Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { youth_id: $.data.id }
            - call: "POST /members/${youth_id}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
          trigger:
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${youth_id}", amount_cents: 12000 }
              as: CouncilRegistrar
          assert:
            - "DuesInvoice.${inv}.status == PAID"
            - "Member.${youth_id}.registration_status == REGISTERED"
            - "Troop.${troop_id}.registered_youth_count == 1"

      - name: event_cancel_cascades_registration_and_count_depth2
        grounds:
