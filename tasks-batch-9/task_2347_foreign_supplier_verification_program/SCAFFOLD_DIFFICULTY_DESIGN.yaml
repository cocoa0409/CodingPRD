            - "AT boundary — first probe retained_record_count == 1"
            - "AT boundary — first probe rescinded_record_count == 0"
            - "ONE SECOND PAST boundary — second probe available_for_inspection_count == 0"
            - "ONE SECOND PAST boundary — second probe expired_record_count == 1"
            - "ONE SECOND PAST boundary — second probe retained_record_count == 1"

  # ---------------------------------------------------------------------------
  # RULE 7 — cross_entity_state_dependency
  # Four DIFFERENT entity pairs gate four different writes:
  #   (SupplierFoodPair <- QualifiedIndividual), (VerificationRecord <-
  #   VerificationActivity), (CorrectiveAction <- VerificationRecord),
  #   (EntrySubmission <- ForeignSupplier).
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: pair_approval_blocked_by_lapsed_designated_qi
        grounds:
          - validations[priority=26]
          - state_machines.QualifiedIndividual.transitions.ACTIVE_to_LAPSED
          - state_machines[SupplierFoodPair.verification_status].transitions.HAZARD_ANALYZED_to_VERIFICATION_APPROVED
          - endpoints["POST /fsvp/supplier-food-pairs/{id}/verification-approval"]
        distinguishing_aspect: "Entity pair (SupplierFoodPair <- QualifiedIndividual): the pair itself is in HAZARD_ANALYZED and every pair-local precondition is satisfiable, yet the write fails with ERR_QI_DESIGNATION_INVALID purely because the designated QI's own state machine moved ACTIVE -> LAPSED; re-designating the QI is the only way to unblock the pair."
        test_recipe:
          setup:
            - "Importer with QI Ada Ruiz designated, an APPROVED supplier, and pair P1 whose hazard analysis is APPROVED (verification_status HAZARD_ANALYZED)."
            - "Ada Ruiz is then LAPSED by the compliance office; she remains pair.designated_qi_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
            - call: "POST /fsvp/foreign-suppliers"
              payload: { importer_id: "${imp}", name: "Rio Verde SA", country_code: "PE", facility_registration_number: "FRN-PE-77001", regulatory_compliance_status: "NO_ADVERSE_FINDINGS" }
              as: ComplianceOfficer
              captures: { sup: $.data.id }
            - call: "POST /fsvp/foreign-suppliers/${sup}/evaluation"
              payload: { decision: "APPROVE", performance_basis_note: "No adverse FDA findings and two acceptable prior audits on file" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/foods"
              payload: { importer_id: "${imp}", food_name: "Frozen mango chunks", fda_product_code: "20-MAN-01", is_raw_agricultural_commodity: false, intended_consumer_group: "GENERAL", ready_to_eat: true }
              as: ComplianceOfficer
              captures: { food1: $.data.id }
            - call: "POST /fsvp/supplier-food-pairs"
              payload: { importer_id: "${imp}", supplier_id: "${sup}", food_id: "${food1}", designated_qi_id: "${qi_a}" }
              as: ComplianceOfficer
              captures: { pair1: $.data.id, pair1_v: $.data.version }
            - call: "POST /fsvp/hazard-analyses"
              payload: { pair_id: "${pair1}", expected_pair_version: "${pair1_v}", methodology_note: "Codex hazard identification for frozen ready-to-eat fruit" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { ha1: $.data.id }
            - call: "POST /fsvp/hazard-analyses/${ha1}/hazards"
              payload: { hazard_type: "BIOLOGICAL", hazard_name: "Listeria monocytogenes", severity: 4, probability: 3, control_owner: "FOREIGN_SUPPLIER" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/hazard-analyses/${ha1}/approval"
              payload: { approval_note: "Hazard analysis complete for this supplier and food combination" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "LAPSE", note: "Training certificate expired during the internal program review" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /fsvp/supplier-food-pairs/${pair1}/verification-approval"
              payload: { approval_note: "Approval attempted by the designated but now lapsed qualified individual" }
              as: QualifiedIndividual
              as_user_id: "${qi_a}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_QI_DESIGNATION_INVALID"
            - "SupplierFoodPair.${pair1}.verification_status == HAZARD_ANALYZED"
            - "SupplierFoodPair.${pair1}.entry_eligibility_status == PENDING"
            - "QualifiedIndividual.${qi_a}.status == LAPSED"
            - "Importer.${imp}.qualified_individual_designated == false"
            - "Importer.${imp}.program_status == NON_COMPLIANT"

