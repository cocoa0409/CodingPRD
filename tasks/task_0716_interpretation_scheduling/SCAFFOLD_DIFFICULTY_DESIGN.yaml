              as: PlatformAdmin
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/requests"
              payload: { client_id: "${hosp_id}", language_pair_id: "${lp_id}", modality: "PHONE", required_tier: "MEDICAL", scheduling_mode: "ON_DEMAND" }
              as: ClientAccount
              as_user_id: "${hosp_id}"
              captures: { req_id: $.data.id, req_v: $.data.version }
            - call: "POST /interpretation/requests/${req_id}/dispatch"
              payload: { expected_request_version: "${req_v}" }
              as: CoordinatorOps
              captures: { asg_id: $.data.id }
            - call: "POST /interpretation/assignments/${asg_id}/accept"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
            - call: "POST /interpretation/assignments/${asg_id}/start-session"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /interpretation/sessions/${sess_id}/connect"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
            - call: "POST /interpretation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T09:20:00Z" }
              as: PlatformAdmin
            - call: "POST /interpretation/sessions/${sess_id}/end"
              payload: {}
              as: Interpreter
              as_user_id: "${itp_id}"
          trigger:
            - call: "POST /interpretation/invoices"
              payload: { client_id: "${hosp_id}" }
              as: CoordinatorOps
              captures: { inv_id: $.data.id }
          assert:
            - "Assignment.${asg_id}.lifecycle_status == COMPLETED"
            - "Assignment.${asg_id}.billing_status == INVOICED"
            - "The lifecycle dimension reached COMPLETED at end-session while billing only became INVOICED at the later invoice sweep — two independent axes on one row."

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: interpreter_deactivation_cascade_depth3
        grounds:
