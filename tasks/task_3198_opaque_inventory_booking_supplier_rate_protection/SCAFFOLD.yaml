roles:
  - name: PlatformAdmin
    description: "Platform operator administering suppliers, properties, rate windows, disclosure zones, customers, and fraud flags"
    identity: opaque
    exclusive_operations:
      - "POST /opaque/suppliers, /suspend, /reinstate, /terminate"
      - "POST /opaque/properties"
      - "POST /opaque/rate-windows, /close"
      - "POST /opaque/disclosure-zones"
      - "POST /opaque/customers"
      - "POST /opaque/fraud-flags, /uphold, /dismiss"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints across suppliers, properties, rate-windows, customers, opaque-bids, bookings, complaint-cases, settlement-batches, fraud-flags, disclosure-zones"
      - "POST /opaque/opaque-bids/{id}/evaluate"
  - name: Customer
    description: "End customer placing opaque bids and owning bookings and complaints"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /opaque/opaque-bids"
      - "POST /opaque/opaque-bids/{id}/withdraw"
    shared_operations:
      - "GET /opaque/opaque-bids, /{id} (own only)"
      - "GET /opaque/bookings, /{id} (own only)"
      - "POST /opaque/complaint-cases (against own bookings)"
      - "GET /opaque/complaint-cases, /{id} (own only)"
      - "GET /opaque/disclosure-zones"
      - "GET /opaque/customers/{id} (self only)"
  - name: CustomerService
    description: "Customer-service operator handling complaints, service failures, goodwill, and bid evaluation on the customer's behalf"
    identity: opaque
    exclusive_operations:
      - "POST /opaque/complaint-cases/{id}/start-review, /resolve, /reject"
      - "POST /opaque/bookings/{id}/mark-service-failure, /grant-goodwill"
    shared_operations:
      - "POST /opaque/complaint-cases"
      - "POST /opaque/opaque-bids/{id}/evaluate"
      - "GET endpoints across suppliers, properties, rate-windows, customers, opaque-bids, bookings, complaint-cases, fraud-flags"
  - name: FinanceOps
    description: "Finance operator running supplier settlement"
    identity: opaque
    exclusive_operations:
      - "POST /opaque/settlement-batches, /reselect, /approve, /void, /mark-paid"
    shared_operations:
      - "GET endpoints across suppliers, properties, rate-windows, customers, bookings, settlement-batches"
