          setup:
            - "An RN license under board OH has a PATIENT-sourced BOUNDARY_VIOLATION complaint whose single EMPLOYER_PERSONNEL evidence request was produced, referred to a proceeding."
            - "Three members bm-s1, bm-s2 and bm-s3 are seated, the hearing convened on 2026-09-15 and the floor froze at PROBATION."
            - "bm-s1 and bm-s2 voted FINE while bm-s3 voted REPRIMAND, so the tally adopted FINE."
