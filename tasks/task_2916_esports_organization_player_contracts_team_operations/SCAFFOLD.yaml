    roles: [LeagueAdmin]
    code: 200
    input: [suspension_reason]
    output: PlayerContract
    side_effects: ["contract_status ACTIVE -> SUSPENDED", "every SCHEDULED PracticeBlock listing this player -> CANCELLED with cancel_reason CONTRACT_SUSPENDED", "cap charge stays committed on the Organization", "version incremented"]
  - method: POST
    path: "/contracts/{id}/wellness-report"
