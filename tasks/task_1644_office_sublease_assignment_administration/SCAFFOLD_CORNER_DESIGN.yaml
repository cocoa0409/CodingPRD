  # ===========================================================================
  # Section: state_machines — excluded stubs (corners already covered by §1.8)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_deemed_approval_timer_covered
        claim_type: valid_transition
        grounds: ["state_machines.TransferRequest.SUBMITTED_to_DEEMED_APPROVED"]
        excluded_because:
          difficulty_instance: boundary_precision_check / deemed_approval_timer_boundary_one_minute
          rationale: "The deemed-approval valid transition (including the reminder pre-arm and exact-instant boundary) is asserted end-to-end by the named §1.8 instance."
      - name: corner_supersession_cascade_covered
        claim_type: side_effect_execution
        grounds: ["state_machines.DemisedArea.CERTIFIED_to_SUPERSEDED"]
        excluded_because:
          difficulty_instance: transitive_cascade / measurement_revision_two_hop_supersession_cascade
          rationale: "Supersession side effects (status flip + superseded_by_id link) asserted by the named §1.8 instance."
      - name: corner_recognition_cascade_covered
        claim_type: side_effect_execution
        grounds: ["state_machines.RecognitionAgreement.PARTIALLY_SIGNED_to_FULLY_EXECUTED"]
        excluded_because:
          difficulty_instance: transitive_cascade / recognition_signature_three_hop_cascade
          rationale: "The landlord-first signature order and all three cascade hops are asserted by the named §1.8 instance; the reversed order is separately covered by cascading_side_effect_chain_end_to_end in this file."
      - name: corner_settlement_overlap_covered
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_ACTIVE]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / settlement_period_overlap_half_open_adjacency
          rationale: "Half-open overlap rejection and adjacency acceptance asserted by the named §1.8 instance."
      - name: corner_conditional_join_and_rescind_covered
        claim_type: invalid_transition
        grounds: ["state_machines.ConsentReview.GRANTED_WITH_CONDITIONS_to_RESCINDED"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / consent_review_conditional_fork_join_and_rescind_cycle
          rationale: "The reject-armed rescission path is asserted by the named §1.8 instance; the all-accept join path is separately covered by condition_acceptance_join_grants_consent in this file."

