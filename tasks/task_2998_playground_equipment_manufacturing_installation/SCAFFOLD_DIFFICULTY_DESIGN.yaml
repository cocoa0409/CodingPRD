  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: pledge_collect_then_refund_conserves_project_funds_and_allocations
        grounds:
          - calculations.fundraising_allocation
          - state_machines.FundraisingPledge.PLEDGED_to_COLLECTED
          - state_machines.FundraisingPledge.COLLECTED_to_REFUNDED
          - entities.DesignProject.fields.funds_collected_cents
          - entities.DesignProject.fields.alloc_permit_freight_cents
          - entities.DesignProject.fields.alloc_contingency_cents
        distinguishing_aspect: |
          A refund is the exact compensating action for a collect: after collect(60000),
          collect(58105) and refund(58105) the four waterfall buckets must return to their exact
          post-first-collect values (49250 / 10750 / 0 / 0), not to some incrementally patched
          approximation, because the calculation is a FULL recompute. The four buckets must sum to
          funds_collected_cents at all five checkpoints, and the second refund must drain them to
          all-zero rather than leaving the first bucket stuck full.
        test_recipe:
          setup:
            - "A deck-only project 'Larkspur Green' in DESIGN_APPROVED with an ISSUED FIRM quote: subtotal_cents 68855, freight_cents 49250, total_cents 118105."
            - "Bucket targets follow from that quote: target_1 (PERMIT_AND_FREIGHT) = 49250, target_2 (SURFACING) = round_half_up(68855 * 0.2) = 13771, target_3 (STRUCTURE) = 68855 - 13771 = 55084, CONTINGENCY untargeted."
            - "No pledges yet, so funds_collected_cents == 0 and all four buckets are 0. Clock 2026-08-01, deadline 2026-12-31."
          setup_api_calls:
            - call: "POST /playground/standards"
              payload: { code: "ASTM_F1487", edition_year: 2024, effective_from: "2024-01-01", min_use_zone_clearance_cm: 183, max_fall_height_cm_toddler: 122, max_fall_height_cm_preschool: 152, max_fall_height_cm_school_age: 244, requires_accessible_route: false }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { std1_id: $.data.id }
            - call: "POST /playground/standards/${std1_id}/activate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/component-models"
              payload: { sku: "DECK-TDL-122", category: "DECK", age_group: "TODDLER_6_23M", deck_height_cm: 122, use_zone_footprint_cm: 183, color_options: ["CEDAR", "SKY_BLUE"], unit_price_cents: 64350, hardware_bag_count: 6, warranty_years: 15, parts_support_until_year: 2040, accessible_transfer_ready: true }
              as: ManufacturerAdmin
              as_user_id: "admin-1"
              captures: { m_deck_id: $.data.id }
            - call: "POST /playground/component-models/${m_deck_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /playground/projects"
