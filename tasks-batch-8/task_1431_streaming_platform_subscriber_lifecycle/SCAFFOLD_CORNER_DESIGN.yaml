scaffold_corner_design:
  # ==========================================================================
  # §1 — Entities
  # ==========================================================================
  - section: entities
    instances:
      - name: plan_creation_required_fields
        claim_type: creation
        grounds:
          - "entities.Plan"
          - "endpoints.POST_/v1/plans"
        distinguishing_aspect: "POST /v1/plans with all required fields returns 201 and the plan_id is set."
        test_recipe:
          setup: ["Empty DB; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/plans"
              payload: { plan_code: "STD", display_name: "Standard", tier: "STANDARD", monthly_price_cents: 1500, trial_days: 7, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_id: $.data.plan_id }
          assert:
            - "Plan created with tier == STANDARD, monthly_price_cents == 1500, is_archived == false"

      - name: plan_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.Plan.fields.plan_code"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Missing required plan_code returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/plans"
              payload: { display_name: "Standard", tier: "STANDARD", monthly_price_cents: 1500, trial_days: 7, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: account_email_uniqueness_enforced
        claim_type: type_constraints
        grounds:
          - "entities.Account.fields.email"
        distinguishing_aspect: "Second account with the same email is rejected."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/accounts"
              payload: { email: "dup@x.com", full_name: "First", country_code: "US" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/accounts"
              payload: { email: "dup@x.com", full_name: "Second", country_code: "US" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_REQUEST"

      - name: account_computed_outstanding_balance_field
        claim_type: computed_fields
        grounds:
          - "entities.Account.fields.outstanding_balance_cents"
        distinguishing_aspect: "outstanding_balance_cents is computed; client-supplied value is ignored."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/accounts"
              payload: { email: "cb@x.com", full_name: "CB", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
          assert:
            - "Account.${acc_id}.outstanding_balance_cents == 0 (system-initialized, not from input)"

      - name: get_plan_not_found_returns_404
        claim_type: not_found
        grounds:
          - "endpoints.GET_/v1/plans/{id}"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET with non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/plans/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_NOT_FOUND"

      - name: profile_list_supports_pagination
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints.GET_/v1/profiles"
        distinguishing_aspect: "GET /v1/profiles returns paginated list with limit/offset/total_count/has_more."
        test_recipe:
          setup:
            - "Plan BASIC; Account A; 2 profiles"
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 5, max_households: 2 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "pg@x.com", full_name: "PG", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc_id}", display_name: "P1", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc_id}", display_name: "P2", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/profiles?account_id=${acc_id}&limit=1&offset=0"
              payload: {}
              as: PlatformAdmin
          assert:
            - "response contains pagination fields limit, offset, total_count, has_more"
            - "total_count == 2"

      - name: billing_event_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - "entities.BillingEvent"
        distinguishing_aspect: "BillingEvent has common_fields: false — no update endpoint exists; only POST and GET."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/billing-events"
              payload: {}
              as: PlatformAdmin
          assert:
            - "GET returns empty list (total_count == 0)"
            - "No PUT/PATCH/DELETE endpoint declared for /v1/billing-events — immutability is structural"

  # ==========================================================================
  # §2 — State Machines
  # ==========================================================================
  - section: state_machines
    instances:
      - name: cancel_from_already_cancelled_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.Subscription.transitions"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Second cancel on a CANCELLED subscription returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Subscription ACTIVE, then CANCELLED"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "c1@x.com", full_name: "C One", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id }
            - call: "POST /v1/subscriptions/${sub_id}/cancel"
              payload: { cancel_reason: "USER_REQUESTED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/subscriptions/${sub_id}/cancel"
              payload: { cancel_reason: "USER_REQUESTED" }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE"

      - name: subscription_initial_state_trialing_when_trial_days_positive
        claim_type: initial_state
        grounds:
          - "state_machines.Subscription"
        distinguishing_aspect: "New subscription on plan with trial_days > 0 starts in TRIALING."
        test_recipe:
          setup: ["Plan with trial_days=14"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "TRIAL", display_name: "Trial", tier: "BASIC", monthly_price_cents: 1000, trial_days: 14, max_profiles: 1, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "c2@x.com", full_name: "C Two", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
          trigger:
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id }
          assert:
            - "Subscription.${sub_id}.subscription_status == TRIALING"
            - "Subscription.${sub_id}.trial_end_utc == 2026-08-15T00:00:00Z"

      - name: terminal_state_lockdown_on_cancelled_subscription
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.Subscription"
        distinguishing_aspect: "From CANCELLED (terminal), no further transitions succeed."
        test_recipe:
          setup: ["Subscription CANCELLED"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "c3@x.com", full_name: "C Three", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id, sub_v: $.data.version }
            - call: "POST /v1/subscriptions/${sub_id}/cancel"
              payload: { cancel_reason: "USER_REQUESTED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/subscriptions/${sub_id}/pause"
              payload: { duration_months: 1 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (CANCELLED is terminal)"

      - name: idempotent_second_accept_fails
        claim_type: idempotency
        grounds:
          - "state_machines.SaveOffer.PRESENTED_to_ACCEPTED"
        distinguishing_aspect: "Same trigger (accept) on the same SaveOffer twice — second returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["SaveOffer PRESENTED on ACTIVE subscription"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "c4@x.com", full_name: "C Four", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id }
            - call: "POST /v1/save-offers"
              payload: { subscription_id: "${sub_id}", offer_type: "PAUSE_1M" }
              as: PlatformAdmin
              captures: { offer_id: $.data.save_offer_id }
            - call: "POST /v1/save-offers/${offer_id}/accept"
              payload: {}
              as: Subscriber
              as_user_id: "${acc_id}"
          trigger:
            - call: "POST /v1/save-offers/${offer_id}/accept"
              payload: {}
              as: Subscriber
              as_user_id: "${acc_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_INVALID_STATE (offer already ACCEPTED)"

      - name: cascade_account_suspend_deactivates_profiles
        claim_type: cascade_down
        grounds:
          - "state_machines.Account.ACTIVE_to_SUSPENDED"
          - "state_machines.Profile.ACTIVE_to_DEACTIVATED"
        distinguishing_aspect: "Suspending an Account cascades to deactivate all its profiles."
        test_recipe:
          setup: ["Account with 2 ACTIVE profiles"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 5, max_households: 2 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "c5@x.com", full_name: "C Five", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc_id}", display_name: "P1", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
              captures: { p1_id: $.data.profile_id }
            - call: "POST /v1/profiles"
              payload: { account_id: "${acc_id}", display_name: "P2", is_kids: false, household_id: "hh-1" }
              as: PlatformAdmin
              captures: { p2_id: $.data.profile_id }
          trigger:
            - call: "POST /v1/accounts/${acc_id}/suspend"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Account.${acc_id}.account_status == SUSPENDED"
            - "Profile.${p1_id}.profile_status == DEACTIVATED"
            - "Profile.${p2_id}.profile_status == DEACTIVATED"

      - name: guarded_transition_unsuspend_requires_zero_balance
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.Account.SUSPENDED_to_ACTIVE"
          - "validations[priority=11]"
        distinguishing_aspect: "Unsuspend with outstanding_balance > 0 returns ERR_OUTSTANDING_BALANCE."
        test_recipe:
          setup: ["Account SUSPENDED with outstanding_balance_cents > 0 (via prior dunning exhaustion)"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "c6@x.com", full_name: "C Six", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id }
            - call: "POST /v1/accounts/${acc_id}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc_id}", subscription_id: "${sub_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "x", notes: "unpaid" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/accounts/${acc_id}/unsuspend"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "err_id == ERR_OUTSTANDING_BALANCE"

  # ==========================================================================
  # §3 — Calculations
  # ==========================================================================
  - section: calculations
    instances:
      - name: proration_preview_rounding_half_up
        claim_type: correct_result
        grounds:
          - "calculations.proration_on_upgrade"
        distinguishing_aspect: "Round-half-up on a fractional-cent result: 3000c plan, 7 days remaining of 30 → credit = round_half_up(3000*7/30)=700."
        test_recipe:
          setup: ["Plan BASIC 3000c; Subscription ACTIVE; clock 2026-08-24 (7 days remaining in 30-day period)"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/plans"
              payload: { plan_code: "PREMIUM", display_name: "Premium", tier: "PREMIUM", monthly_price_cents: 6000, trial_days: 0, max_profiles: 5, max_households: 2 }
              as: PlatformAdmin
              captures: { plan_prem_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "calc@x.com", full_name: "Calc", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-24T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/subscriptions/${sub_id}/proration-preview"
              payload: { target_plan_id: "${plan_prem_id}" }
              as: PlatformAdmin
          assert:
            - "unused_credit_cents == 700"
            - "prorated_charge_cents == 1400"
            - "net_charge_cents == 700"

      - name: retention_sweep_sets_retained_flags
        claim_type: input_set_filtering
        grounds:
          - "calculations.signup_cohort_retention"
        distinguishing_aspect: "Day-30 sweep flips retained_at_day_30 only for subscriptions still in {TRIALING, ACTIVE, PAST_DUE, PAUSED}; CANCELLED subscriptions remain false."
        test_recipe:
          setup: ["Two subscriptions: one ACTIVE at day+30, one CANCELLED at day+5"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "r1@x.com", full_name: "R1", country_code: "US" }
              as: PlatformAdmin
              captures: { acc1_id: $.data.account_id }
            - call: "POST /v1/accounts"
              payload: { email: "r2@x.com", full_name: "R2", country_code: "US" }
              as: PlatformAdmin
              captures: { acc2_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc1_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub1_id: $.data.subscription_id, attr1_id: $.data.signup_attribution_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc2_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub2_id: $.data.subscription_id, attr2_id: $.data.signup_attribution_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/subscriptions/${sub2_id}/cancel"
              payload: { cancel_reason: "USER_REQUESTED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/_sweeps/run"
              payload: { advance_to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "SignupAttribution.${attr1_id}.retained_at_day_30 == true (still ACTIVE at day+30)"
            - "SignupAttribution.${attr2_id}.retained_at_day_30 == false (CANCELLED before day+30)"

      - name: dunning_backoff_constants_applied
        claim_type: constants_applied
        grounds:
          - "calculations.dunning_backoff_schedule"
        distinguishing_aspect: "MAX_ATTEMPTS=5 enforced: 5th CHARGE_FAILED triggers EXPIRED."
        test_recipe:
          setup: ["Subscription ACTIVE; four prior CHARGE_FAILED events"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/plans"
              payload: { plan_code: "BASIC", display_name: "Basic", tier: "BASIC", monthly_price_cents: 3000, trial_days: 0, max_profiles: 2, max_households: 1 }
              as: PlatformAdmin
              captures: { plan_basic_id: $.data.plan_id }
            - call: "POST /v1/accounts"
              payload: { email: "d5@x.com", full_name: "D Five", country_code: "US" }
              as: PlatformAdmin
              captures: { acc_id: $.data.account_id }
            - call: "POST /v1/subscriptions"
              payload: { account_id: "${acc_id}", plan_id: "${plan_basic_id}" }
              as: PlatformAdmin
              captures: { sub_id: $.data.subscription_id }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc_id}", subscription_id: "${sub_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f1", notes: "" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc_id}", subscription_id: "${sub_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f2", notes: "" }
              as: PlatformAdmin
            - call: "POST /v1/billing-events"
              payload: { account_id: "${acc_id}", subscription_id: "${sub_id}", event_type: "CHARGE_FAILED", amount_cents: 3000, external_reference: "f3", notes: "" }
              as: PlatformAdmin
