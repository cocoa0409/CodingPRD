          setup:
            - "One US Creator with payout_method BANK_TRANSFER, follower_count 10000, watch_time_minutes_365d 240000, evaluated to ELIGIBLE, and a VERIFIED W9 TaxProfile with tin_provided true so the withholding rate is 0 bps."
            - "A TIPS RevenueProduct (5000/5000, min_payable_cents 0) accrued one event of gross_amount_cents 40000, so creator_share_cents == 20000."
            - "Period 2026-07 is CLOSED and its statement FINALIZED with net_payable_cents 20000, so available_balance_cents == 20000."
            - "A Payout exists with payable_before_fee_cents 20000, tier T1, fee_cents 200 and amount_cents 19800; it has been submitted and failed twice with a retry after each failure, so state == PROCESSING, retry_count == 2, Creator.consecutive_payment_failures == 2, and the ledger holds ACCRUAL +20000 plus three PAYOUT_DEBIT/-PAYOUT_FEE pairs and two PAYOUT_REVERSAL +20000 entries, netting ledger_balance_cents == 0."
