            - "the full APPROVE returns error_id == ERR_MARGIN_CEILING_EXCEEDED with http_status 422 and SpecialPricingRequest.${spr_mc_id}.status stays SUBMITTED with approved_extra_margin_pct == null"
            - "the PARTIAL decision succeeds: SpecialPricingRequest.${spr_mc_id}.status == PARTIALLY_APPROVED, approved_extra_margin_pct == 0.02, decided_by_user_id == u_dir_1"
            - "OrderInvoice.${inv_mc_id}.margin_pct == 0.1800, volume_band == NONE, invoice_amount_cents == 3280000, margin_value_cents == 720000"
            - "the resolved margin sits exactly on TIER_MARGIN_CEILING_PCT[REGISTERED] and is not clamped below it"

      - name: partner_cannot_submit_another_partners_registration
        claim_type: triggerable
        grounds:
          - validations[priority=4]
