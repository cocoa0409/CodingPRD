scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: art_budget_provisional_vs_final_on_project
        grounds:
          - calculations.art_budget_computation
          - entities.CapitalProject.fields.art_budget_cents
          - state_machines.CapitalProject.DRAFT_to_BUDGET_CERTIFIED
        distinguishing_aspect: "On CapitalProject, the PROVISIONAL art budget (200000000*0.01 = 2000000, from the estimate) diverges from the FINAL art budget (150000000*0.01 = 1500000, from the certified budget) for the same project."
        test_recipe:
          setup:
            - "A CapitalProject created with construction_budget_cents=200000000 and percent_rate=0.01, still DRAFT (provisional art_budget_cents=2000000)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Riverfront Plaza", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 150000000 }
              as: ProgramAdmin
          assert:
            - "CapitalProject.${proj_id}.art_budget_cents == 1500000"
            - "CapitalProject.${proj_id}.status == BUDGET_CERTIFIED"
            - "The provisional value before certify was 2000000; the FINAL variant replaced it with 1500000."

      - name: submission_composite_mean_vs_trimmed
        grounds:
          - calculations.submission_composite_score
          - entities.Submission.fields.composite_score
          - state_machines.ArtistCall.CLOSED_to_TABULATED
        distinguishing_aspect: "On Submission, with 3 counted scores the TRIMMED variant yields composite_score=69.00 (drops 77.5 and 63.25) which diverges from the MEAN variant 69.92 — dual-variant on a different entity domain than CapitalProject."
        test_recipe:
          setup:
            - "A BUDGET_CERTIFIED project (art_budget 2000000) with a commission, an RFP call (quorum_min=3), 3 non-recused panelists, and 1 submission scored by all three."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Transit Hub", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Atrium Sculpture", allocation_cents: 1000000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 3 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Ada Lin", email: "ada@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P2" }
              as: ProgramAdmin
              captures: { pan2: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P3" }
              as: ProgramAdmin
              captures: { pan3: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 900000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 80, feasibility: 70, community_impact: 60, durability: 50 }
              as: Panelist
              as_user_id: "${pan1}"
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan2}", artistic_merit: 90, feasibility: 60, community_impact: 80, durability: 70 }
              as: Panelist
              as_user_id: "${pan2}"
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan3}", artistic_merit: 60, feasibility: 90, community_impact: 50, durability: 45 }
              as: Panelist
              as_user_id: "${pan3}"
            - call: "POST /calls/${call_id}/close"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /calls/${call_id}/tabulate"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Submission.${sub_id}.composite_score == 69.00"
            - "Submission.${sub_id}.status == SCORED"
            - "The MEAN variant would have produced 69.92; TRIMMED (69.00) was selected because counted scores (3) >= TRIM_MIN."

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: composite_weighted_with_durability_gate
        grounds:
          - calculations.submission_composite_score
          - state_machines.Submission.SUBMITTED_to_DISQUALIFIED
          - entities.Score.fields.weighted_value
        distinguishing_aspect: "Mode (a): a 4-input weighted sum with a non-linear conditional branch — mean durability 28.33 < DURABILITY_FLOOR=40 overrides the weighted result and forces composite_score=0 / DISQUALIFIED."
        test_recipe:
          setup:
            - "A certified project with a commission, RFP call (quorum_min=3), 3 non-recused panelists, and one submission whose durability scores average below the floor."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Library Court", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Mural", allocation_cents: 1000000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 3 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Boro Kite", email: "boro@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P2" }
              as: ProgramAdmin
              captures: { pan2: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P3" }
              as: ProgramAdmin
              captures: { pan3: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 900000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 90, feasibility: 90, community_impact: 90, durability: 30 }
              as: Panelist
              as_user_id: "${pan1}"
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan2}", artistic_merit: 85, feasibility: 85, community_impact: 85, durability: 35 }
              as: Panelist
              as_user_id: "${pan2}"
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan3}", artistic_merit: 80, feasibility: 80, community_impact: 80, durability: 20 }
              as: Panelist
              as_user_id: "${pan3}"
            - call: "POST /calls/${call_id}/close"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /calls/${call_id}/tabulate"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Submission.${sub_id}.composite_score == 0"
            - "Submission.${sub_id}.status == DISQUALIFIED"

      - name: milestone_rounding_order_remainder
        grounds:
          - calculations.milestone_allocation
          - entities.Milestone.fields.amount_cents
          - concurrency_rules[milestone-schedule-stale-contract]
        distinguishing_aspect: "Mode (b): round-per-line then remainder pins the highest-sequence milestone to 333335 (=1000001-333333-333333), whereas naive rounding of every line would drift to 333333 and under-sum the contract."
        test_recipe:
          setup:
            - "An ACTIVE-eligible DRAFT contract for a contracted commission with contract_amount_cents=1000001, ready to schedule three milestones."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Civic Center", construction_budget_cents: 400000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 400000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Fountain", allocation_cents: 1500000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFQ", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Cira Vale", email: "cira@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 1000001 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 80, feasibility: 80, community_impact: 80, durability: 80 }
              as: Panelist
              as_user_id: "${pan1}"
            - call: "POST /calls/${call_id}/close"
              payload: {}
              as: ProgramAdmin
            - call: "POST /calls/${call_id}/tabulate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /commissions/${comm_id}/award"
              payload: { submission_id: "${sub_id}" }
              as: ProgramAdmin
            - call: "POST /commissions/${comm_id}/contracts"
              payload: { submission_id: "${sub_id}", contract_amount_cents: 1000001 }
              as: ProgramAdmin
              captures: { contract_id: $.data.id, ctv0: $.data.version }
          trigger:
            - call: "POST /contracts/${contract_id}/milestone-schedule"
              payload: { milestones: [{ sequence: 1, title: "Design", pct: 0.3333 }, { sequence: 2, title: "Fabrication", pct: 0.3333 }, { sequence: 3, title: "Delivery", pct: 0.3334 }], expected_contract_version: "${ctv0}" }
              as: ProgramAdmin
              captures: { m1_id: "$.data[0].id", m2_id: "$.data[1].id", m3_id: "$.data[2].id" }
          assert:
            - "Milestone.${m1_id}.amount_cents == 333333"
            - "Milestone.${m2_id}.amount_cents == 333333"
            - "Milestone.${m3_id}.amount_cents == 333335"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: submission_revision_cycle_back_to_submitted
        grounds:
          - state_machines.Submission.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Submission.REVISION_REQUESTED_to_SUBMITTED
          - entities.Submission.fields.status
        distinguishing_aspect: "Submission cycles SUBMITTED -> REVISION_REQUESTED -> SUBMITTED on the same row (a true cycle), not a one-way pipeline."
        test_recipe:
          setup:
            - "A certified project with a commission, an OPEN call (deadline 2026-06-01, clock at default 2026-03-01), an artist, and one SUBMITTED submission."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Overlook", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Gateway", allocation_cents: 900000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Dee Oro", email: "dee@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 800000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /submissions/${sub_id}/request-revision"
              payload: {}
              as: ProgramAdmin
            - call: "POST /submissions/${sub_id}/resubmit"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
          assert:
            - "Submission.${sub_id}.status == SUBMITTED"

      - name: artwork_location_and_condition_parallel_dimensions
        grounds:
          - state_machines.Artwork.FABRICATED_to_INSTALLED
          - state_machines.Artwork.GOOD_to_NEEDS_TREATMENT
          - entities.Artwork.fields.condition_status
        distinguishing_aspect: "On one Artwork, condition_status advances to NEEDS_TREATMENT while location_status independently advances to INSTALLED — two parallel state dimensions on the same row."
        test_recipe:
          setup:
            - "A registered AVAILABLE site and a DONATION artwork in location_status=FABRICATED, condition_status=GOOD."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "North Plaza", address: "1 North St" }
              as: Registrar
              captures: { site_id: $.data.id }
            - call: "POST /artworks"
              payload: { title: "Bronze Heron", acquisition_type: "DONATION", appraised_value_cents: 500000 }
              as: Registrar
              captures: { art_id: $.data.id }
          trigger:
            - call: "POST /artworks/${art_id}/conservation-records"
              payload: { record_type: "INSPECTION", condition_after: "NEEDS_TREATMENT", notes: "surface corrosion" }
              as: Registrar
            - call: "POST /artworks/${art_id}/install"
              payload: { site_id: "${site_id}", install_date: "2026-04-01T00:00:00Z" }
              as: Registrar
          assert:
            - "Artwork.${art_id}.location_status == INSTALLED"
            - "Artwork.${art_id}.condition_status == NEEDS_TREATMENT"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: milestone_pay_fabrication_fulfillment_cascade
        grounds:
          - state_machines.Milestone.SUBMITTED_to_PAID
          - state_machines.Contract.ACTIVE_to_COMPLETED
          - state_machines.Artwork.FABRICATION_to_FABRICATED
          - state_machines.Commission.CONTRACTED_to_FULFILLED
        distinguishing_aspect: "Depth-4 chain: Milestone->PAID mutates Contract.paid; Contract reaching full COMPLETES; COMPLETED fabricates the Artwork; FABRICATED fulfills the Commission — each hop caused only by the prior."
        test_recipe:
          setup:
            - "A contracted commission with an ACTIVE contract (contract_amount 1000000, single milestone pct=1.0 in SUBMITTED), whose synthesized Artwork is in FABRICATION."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Waterworks", construction_budget_cents: 400000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 400000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Cascade Piece", allocation_cents: 1000000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFQ", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Ely Cast", email: "ely@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 1000000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 80, feasibility: 80, community_impact: 80, durability: 80 }
              as: Panelist
              as_user_id: "${pan1}"
            - call: "POST /calls/${call_id}/close"
              payload: {}
              as: ProgramAdmin
            - call: "POST /calls/${call_id}/tabulate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /commissions/${comm_id}/award"
              payload: { submission_id: "${sub_id}" }
              as: ProgramAdmin
            - call: "POST /commissions/${comm_id}/contracts"
              payload: { submission_id: "${sub_id}", contract_amount_cents: 1000000 }
              as: ProgramAdmin
              captures: { contract_id: $.data.id, ctv0: $.data.version }
            - call: "POST /contracts/${contract_id}/milestone-schedule"
              payload: { milestones: [{ sequence: 1, title: "Full", pct: 1.0 }], expected_contract_version: "${ctv0}" }
              as: ProgramAdmin
              captures: { m1_id: "$.data[0].id" }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "GET /artworks"
              payload: { contract_id: "${contract_id}" }
              as: ProgramAdmin
              captures: { art_id: "$.data[0].id" }
            - call: "POST /milestones/${m1_id}/submit"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
          trigger:
            - call: "POST /milestones/${m1_id}/approve"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Milestone.${m1_id}.status == PAID"
            - "Contract.${contract_id}.paid_cents == 1000000"
            - "Contract.${contract_id}.status == COMPLETED"
            - "Artwork.${art_id}.location_status == FABRICATED"
            - "Commission.${comm_id}.status == FULFILLED"

      - name: commission_cancel_call_submission_withdraw_cascade
        grounds:
          - state_machines.Commission.OPEN_to_CANCELLED
          - state_machines.ArtistCall.OPEN_to_CANCELLED
          - state_machines.Submission.SUBMITTED_to_WITHDRAWN
        distinguishing_aspect: "Depth-3 chain from a different trigger: cancel Commission -> Call CANCELLED -> Submission WITHDRAWN, and budget is released back to the project."
        test_recipe:
          setup:
            - "A certified project (art_budget 2000000) with a commission (allocation 500000, committed 500000), an OPEN call, and one SUBMITTED submission."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Eastgate", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Beacon", allocation_cents: 500000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Fen Ray", email: "fen@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 400000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /commissions/${comm_id}/cancel"
              payload: {}
              as: ProgramAdmin
          assert:
            - "Commission.${comm_id}.status == CANCELLED"
            - "ArtistCall.${call_id}.status == CANCELLED"
            - "Submission.${sub_id}.status == WITHDRAWN"
            - "CapitalProject.${proj_id}.committed_cents == 0"
            - "CapitalProject.${proj_id}.uncommitted_cents == 2000000"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_commission_create
        grounds:
          - validations[priority=40]
          - validations[priority=90]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Dual failure state(project DRAFT, not BUDGET_CERTIFIED) + business_fiscal(allocation 3000000 > provisional art_budget 2000000) resolves to ERR_INVALID_STATE (priority 40 < 90)."
        test_recipe:
          setup:
            - "A CapitalProject still in DRAFT with provisional art_budget_cents=2000000 (construction 200000000 * 0.01)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Draftwater", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, pv0: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Too Big", allocation_cents: 3000000, expected_project_version: "${pv0}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_INVALID_STATE"
            - "trigger[0] response http_status == 409"

      - name: referential_beats_temporal_on_submission_create
        grounds:
          - validations[priority=60]
          - validations[priority=70]
          - errors[ERR_DUPLICATE_SUBMISSION]
        distinguishing_aspect: "Dual failure business_referential(same artist's second submission) + business_temporal(clock past deadline) resolves to ERR_DUPLICATE_SUBMISSION (priority 60 < 70) — a different category pair than state/fiscal."
        test_recipe:
          setup:
            - "A certified project, commission, OPEN call (deadline 2026-06-01), an artist with one existing SUBMITTED submission, and the clock advanced to 2026-06-02 (past the deadline)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Southbank", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Riverwalk", allocation_cents: 900000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Gus Hale", email: "gus@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 700000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 750000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_DUPLICATE_SUBMISSION"
            - "trigger[0] response http_status == 409"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: allocation_equal_budget_ok_one_cent_over_fails
        grounds:
          - validations[priority=90]
          - calculations.budget_ledger
          - errors[ERR_ALLOCATION_EXCEEDS_BUDGET]
        distinguishing_aspect: "Budget-cents boundary at POST /commissions: allocation exactly == remaining (2000000) is accepted (<=); one cent more (2000001) is rejected — a precise <= edge."
        test_recipe:
          setup:
            - "A certified project (art_budget 2000000) with one commission already allocating exactly 2000000 (committed 2000000, uncommitted 0)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Fullbudget", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Exact", allocation_cents: 2000000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm1_id: $.data.id }
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: ProgramAdmin
              captures: { pv2: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "OneOver", allocation_cents: 1, expected_project_version: "${pv2}" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "CapitalProject.${proj_id}.committed_cents == 2000000"
            - "trigger[0] response.data.error_id == ERR_ALLOCATION_EXCEEDS_BUDGET"

      - name: quorum_below_min_blocks_tabulation
        grounds:
          - validations[priority=55]
          - state_machines.ArtistCall.CLOSED_to_TABULATED
          - errors[ERR_QUORUM_NOT_MET]
        distinguishing_aspect: "Panelist-COUNT boundary at POST /tabulate: 1 scorer < quorum_min=2 rejects tabulation (exactly 2 would pass) — a different metric and endpoint than the budget-cents boundary."
        test_recipe:
          setup:
            - "A certified project, commission, CLOSED call with quorum_min=2 but only 1 non-recused panelist who scored the single submission."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Quorumtest", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Panel Piece", allocation_cents: 900000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFP", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 2 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Hana Ober", email: "hana@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 800000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 80, feasibility: 80, community_impact: 80, durability: 80 }
              as: Panelist
              as_user_id: "${pan1}"
            - call: "POST /calls/${call_id}/close"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /calls/${call_id}/tabulate"
              payload: {}
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_QUORUM_NOT_MET"
            - "ArtistCall.${call_id}.status == CLOSED"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: milestone_submit_requires_contract_active
        grounds:
          - state_machines.Milestone.PENDING_to_SUBMITTED
          - entities.Contract.fields.status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Milestone.submit (from valid PENDING) is blocked because the parent Contract is DRAFT, not ACTIVE — Milestone's transition depends on Contract state (Milestone <-> Contract)."
        test_recipe:
          setup:
            - "A contracted commission with a DRAFT (not yet activated) contract carrying one PENDING milestone (pct=1.0)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Draftcon", construction_budget_cents: 400000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 400000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Standby", allocation_cents: 1000000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /commissions/${comm_id}/calls"
              payload: { call_type: "RFQ", submission_deadline: "2026-06-01T00:00:00Z", quorum_min: 1 }
              as: ProgramAdmin
              captures: { call_id: $.data.id }
            - call: "POST /artists"
              payload: { display_name: "Ivo Lund", email: "ivo@x.com" }
              as: ProgramAdmin
              captures: { artist_id: $.data.id }
            - call: "POST /calls/${call_id}/panelists"
              payload: { evaluator_name: "P1" }
              as: ProgramAdmin
              captures: { pan1: $.data.id }
            - call: "POST /calls/${call_id}/submissions"
              payload: { artist_id: "${artist_id}", proposed_budget_cents: 1000000 }
              as: Artist
              as_user_id: "${artist_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/scores"
              payload: { panelist_id: "${pan1}", artistic_merit: 80, feasibility: 80, community_impact: 80, durability: 80 }
              as: Panelist
              as_user_id: "${pan1}"
            - call: "POST /calls/${call_id}/close"
              payload: {}
              as: ProgramAdmin
            - call: "POST /calls/${call_id}/tabulate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /commissions/${comm_id}/award"
              payload: { submission_id: "${sub_id}" }
              as: ProgramAdmin
            - call: "POST /commissions/${comm_id}/contracts"
              payload: { submission_id: "${sub_id}", contract_amount_cents: 1000000 }
              as: ProgramAdmin
              captures: { contract_id: $.data.id, ctv0: $.data.version }
            - call: "POST /contracts/${contract_id}/milestone-schedule"
              payload: { milestones: [{ sequence: 1, title: "Full", pct: 1.0 }], expected_contract_version: "${ctv0}" }
              as: ProgramAdmin
              captures: { m1_id: "$.data[0].id" }
          trigger:
            - call: "POST /milestones/${m1_id}/submit"
              payload: {}
              as: Artist
              as_user_id: "${artist_id}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_INVALID_STATE"
            - "Milestone.${m1_id}.status == PENDING"

      - name: loan_approve_requires_artwork_not_deaccessioned
        grounds:
          - state_machines.Loan.REQUESTED_to_APPROVED
          - entities.Artwork.fields.location_status
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Loan.approve (from valid REQUESTED) is blocked because the linked Artwork is DEACCESSIONED — Loan's transition depends on Artwork state (Loan <-> Artwork), a different pair than Milestone <-> Contract."
        test_recipe:
          setup:
            - "A DONATION artwork with a REQUESTED loan, then the artwork is deaccessioned (allowed while the loan is only REQUESTED)."
          setup_api_calls:
            - call: "POST /artworks"
              payload: { title: "Glass Wave", acquisition_type: "DONATION", appraised_value_cents: 300000 }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/loans"
              payload: { borrower_name: "City Museum", loan_start: "2026-05-01T00:00:00Z", loan_end: "2026-05-20T00:00:00Z" }
              as: Registrar
              captures: { loan_id: $.data.id }
            - call: "POST /artworks/${art_id}/deaccession"
              payload: { deaccession_method: "TRANSFER" }
              as: Registrar
          trigger:
            - call: "POST /loans/${loan_id}/approve"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_INVALID_STATE"
            - "Loan.${loan_id}.status == REQUESTED"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: site_install_occupied_interval_conflict
        grounds:
          - validations[priority=72]
          - state_machines.Site.AVAILABLE_to_OCCUPIED
          - errors[ERR_SITE_INTERVAL_CONFLICT]
        distinguishing_aspect: "A second install at 2026-05-01 collides with the first artwork's half-open occupancy interval [2026-04-01, +inf) on the same Site — adjacency-allowed half-open semantics on the Site resource."
        test_recipe:
          setup:
            - "One AVAILABLE site, a DONATION artwork already INSTALLED there since 2026-04-01 (site OCCUPIED), and a second FABRICATED DONATION artwork."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Center Court", address: "5 Center" }
              as: Registrar
              captures: { site_id: $.data.id }
            - call: "POST /artworks"
              payload: { title: "First Piece", acquisition_type: "DONATION", appraised_value_cents: 200000 }
              as: Registrar
              captures: { art1_id: $.data.id }
            - call: "POST /artworks/${art1_id}/install"
              payload: { site_id: "${site_id}", install_date: "2026-04-01T00:00:00Z" }
              as: Registrar
            - call: "POST /artworks"
              payload: { title: "Second Piece", acquisition_type: "DONATION", appraised_value_cents: 200000 }
              as: Registrar
              captures: { art2_id: $.data.id }
          trigger:
            - call: "POST /artworks/${art2_id}/install"
              payload: { site_id: "${site_id}", install_date: "2026-05-01T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_SITE_INTERVAL_CONFLICT"
            - "Artwork.${art2_id}.location_status == FABRICATED"

      - name: loan_buffer_gap_conflict
        grounds:
          - validations[priority=74]
          - entities.Loan.fields.loan_start
          - errors[ERR_LOAN_INTERVAL_CONFLICT]
        distinguishing_aspect: "A non-overlapping loan starting 2026-05-10 sits only 10 days after a loan ending 2026-04-30, inside the 30-day LOAN_BUFFER_DAYS gap — closed-interval + buffer semantics on the Artwork loan resource, unlike the Site half-open rule."
        test_recipe:
          setup:
            - "A DONATION artwork with one REQUESTED loan over [2026-04-01, 2026-04-30]."
          setup_api_calls:
            - call: "POST /artworks"
              payload: { title: "Traveling Totem", acquisition_type: "DONATION", appraised_value_cents: 600000 }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/loans"
              payload: { borrower_name: "Museum A", loan_start: "2026-04-01T00:00:00Z", loan_end: "2026-04-30T00:00:00Z" }
              as: Registrar
              captures: { loan1_id: $.data.id }
          trigger:
            - call: "POST /artworks/${art_id}/loans"
              payload: { borrower_name: "Museum B", loan_start: "2026-05-10T00:00:00Z", loan_end: "2026-05-20T00:00:00Z" }
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response.data.error_id == ERR_LOAN_INTERVAL_CONFLICT"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: budget_conserved_on_commission_cancel
        grounds:
          - calculations.budget_ledger
          - state_machines.Commission.OPEN_to_CANCELLED
          - entities.CapitalProject.fields.uncommitted_cents
        distinguishing_aspect: "Conserved quantity = budget cents: create commission (commit 800000) then cancel returns committed_cents to 0 and uncommitted_cents to 2000000, so art_budget_cents == uncommitted + committed holds."
        test_recipe:
          setup:
            - "A certified project (art_budget 2000000) with one OPEN commission allocating 800000 (committed 800000, uncommitted 1200000)."
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Ledgerpark", construction_budget_cents: 200000000, percent_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/certify"
              payload: { certified_construction_budget_cents: 200000000 }
              as: ProgramAdmin
              captures: { pv1: $.data.version }
            - call: "POST /projects/${proj_id}/commissions"
              payload: { title: "Reversible", allocation_cents: 800000, expected_project_version: "${pv1}" }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
          trigger:
            - call: "POST /commissions/${comm_id}/cancel"
              payload: {}
              as: ProgramAdmin
          assert:
            - "CapitalProject.${proj_id}.committed_cents == 0"
            - "CapitalProject.${proj_id}.uncommitted_cents == 2000000"
            - "CapitalProject.${proj_id}.art_budget_cents == 2000000"

      - name: site_slot_conserved_on_deaccession
        grounds:
          - state_machines.Site.OCCUPIED_to_AVAILABLE
          - state_machines.Artwork.INSTALLED_to_DEACCESSIONED
          - entities.Site.fields.current_artwork_id
        distinguishing_aspect: "Conserved quantity = site occupancy slots (integer): install occupies the site (slot 1), deaccession frees it (slot 0, current_artwork_id null) — a different conserved-quantity type than budget cents."
        test_recipe:
          setup:
            - "One AVAILABLE site with a DONATION artwork INSTALLED there since 2026-04-01 (site OCCUPIED, current_artwork_id set)."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Harbor Point", address: "9 Harbor" }
              as: Registrar
              captures: { site_id: $.data.id }
            - call: "POST /artworks"
              payload: { title: "Tidal Arc", acquisition_type: "DONATION", appraised_value_cents: 700000 }
              as: Registrar
              captures: { art_id: $.data.id }
            - call: "POST /artworks/${art_id}/install"
              payload: { site_id: "${site_id}", install_date: "2026-04-01T00:00:00Z" }
              as: Registrar
          trigger:
            - call: "POST /artworks/${art_id}/deaccession"
              payload: { deaccession_method: "SALE", deaccession_proceeds_cents: 250000 }
              as: Registrar
          assert:
            - "Artwork.${art_id}.location_status == DEACCESSIONED"
            - "Site.${site_id}.status == AVAILABLE"
            - "Site.${site_id}.current_artwork_id == null"
