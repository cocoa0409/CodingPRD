      - name: order_billing_and_fulfillment_dimensions_advance_independently
        grounds:
          - state_machines.SupportSurfaceOrder.APPROVED_to_DELIVERED
          - state_machines.SupportSurfaceOrder.COMMITTED_to_RECONCILED
          - entities.SupportSurfaceOrder.fields.fulfillment_status
          - entities.SupportSurfaceOrder.fields.billing_status
          - entities.SupportSurface.fields.available_from
          - concurrency_rules[order-approve-stale-unit]
        distinguishing_aspect: |
          SupportSurfaceOrder carries two parallel state dimensions on one row:
          POST /deliver advances fulfillment_status APPROVED -> DELIVERED while
          billing_status stays exactly ENCUMBERED, and POST /reconcile advances
          billing_status COMMITTED -> RECONCILED while fulfillment_status stays
          exactly RETURNED. A single-dimension implementation cannot produce the
          intermediate pair (DELIVERED, ENCUMBERED).
        test_recipe:
          setup:
            - "Unit 7W exists with rental_budget_cap_cents 500000."
            - "SupportSurface BED-003 is an AVAILABLE ALTERNATING_PRESSURE bed at daily_rate_cents 20000."
            - "Patient MRN-D1 is ADMITTED on 7W."
            - "A 5-day order (2026-08-01T00:00:00Z .. 2026-08-06T00:00:00Z) exists with projected 100000, fee 5000 and authorized_cost_cents 105000, still (REQUESTED, UNBILLED)."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "7W", name: "Seven West", bed_count: 24, rental_budget_cap_cents: 500000 }
              as: WocProgramDirector
              captures: { u1_id: "$.data.id" }
            - call: "POST /patients"
              payload: { mrn: "MRN-D1", unit_id: "${u1_id}", admitted_at: "2026-07-30T00:00:00Z" }
              as: UnitCharge
              as_user_id: "${u1_id}"
              captures: { p1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-003", surface_class: "ALTERNATING_PRESSURE", daily_rate_cents: 20000, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-06T00:00:00Z", authorized_days: 5 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v: "$.data.version" }
          trigger:
            - call: "POST /support-surface-orders/${o1_id}/approve"
              payload: { expected_unit_version: "${u1_v}" }
              as: MaterialsCoordinator
            - call: "POST /support-surface-orders/${o1_id}/deliver"
              payload: { delivered_at: "2026-08-01T00:00:00Z" }
              as: MaterialsCoordinator
            - call: "POST /support-surface-orders/${o1_id}/return"
              payload: { actual_return_at: "2026-08-04T00:00:00Z" }
              as: MaterialsCoordinator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemOperator
            - call: "POST /support-surface-orders/${o1_id}/reconcile"
              payload: {}
              as: MaterialsCoordinator
          assert:
            - "After approve: SupportSurfaceOrder.${o1_id}.fulfillment_status == APPROVED and billing_status == ENCUMBERED — approve is the only call that moves both dimensions"
            - "After approve: Unit.${u1_id}.rental_encumbered_cents == 105000 and Unit.${u1_id}.rental_available_cents == 395000"
            - "After deliver: SupportSurfaceOrder.${o1_id}.fulfillment_status == DELIVERED AND billing_status == ENCUMBERED (unchanged) — the pair (DELIVERED, ENCUMBERED) must be observable"
            - "After deliver: Unit.${u1_id}.rental_encumbered_cents == 105000 (deliver moves no money)"
            - "After return: SupportSurfaceOrder.${o1_id}.fulfillment_status == RETURNED, billing_status == COMMITTED, actual_cost_cents == 63000 (3 billable days at 20000 = 60000 projected, tier-2 fee 3000)"
            - "After return: Unit.${u1_id}.rental_encumbered_cents == 0, rental_committed_cents == 63000, rental_released_cents == 42000, rental_available_cents == 437000"
            - "After reconcile: SupportSurfaceOrder.${o1_id}.billing_status == RECONCILED AND fulfillment_status == RETURNED (unchanged) — the pair (RETURNED, RECONCILED) proves reconcile touches only dimension 2"
            - "After reconcile: Unit.${u1_id}.rental_committed_cents == 63000 and rental_available_cents == 437000, both unchanged — reconcile moves no money"
            - "After reconcile: SupportSurface.${s1_id}.status == AVAILABLE because the clock 2026-08-05T00:00:00Z is past available_from 2026-08-04T12:00:00Z (actual_return_at + RECLEAN_BUFFER_HOURS 12)"

  - rule_id: transitive_cascade
    instances:
      - name: validate_hapi_cascades_case_rca_unit_posture_and_order_hold
        grounds:
          - state_machines.SkinAssessment.PENDING_VALIDATION_to_VALIDATED
          - state_machines.PressureInjuryCase.OPEN_to_CLASSIFIED_HAPI
          - state_machines.PressureInjuryCase.CLASSIFIED_HAPI_to_RCA_REQUIRED
          - entities.Unit.fields.open_hapi_rca_count
          - entities.Unit.fields.survey_posture
          - entities.SupportSurfaceOrder.fields.requires_director_override
          - entities.SupportSurfaceOrder.fields.posture_hold_applied_at
          - calculations.poa_determination
        distinguishing_aspect: |
          One POST /skin-assessments/{id}/validate propagates FIVE hops deep and
          each hop is caused by the previous hop's mutation, not by the original
          call: assessment VALIDATED -> case CLASSIFIED_HAPI -> case RCA_REQUIRED
          -> Unit.open_hapi_rca_count reaches 2 and survey_posture flips to
          RESTRICTED -> a pre-existing REQUESTED rental order on that unit gets
          requires_director_override = true. The terminal hop lands on an entity
          (SupportSurfaceOrder) the validate call never names.
        test_recipe:
          setup:
            - "Unit 7W exists with rental_budget_cap_cents 500000, open_hapi_rca_count 1 and survey_posture OPEN (one HAPI case already carried from an earlier consult)."
            - "WocNurse Nina (stager) and WocNurse Omar (validator) are both CERTIFIED with certification_eligibility_score 64.00."
            - "Patients MRN-H1 and MRN-H2 were both ADMITTED on 7W at 2026-07-20T00:00:00Z, so the POA window closed at 2026-07-21T00:00:00Z."
            - "MRN-H1's SACRUM assessment is already VALIDATED as HAPI, driving PressureInjuryCase K1 to RCA_REQUIRED and Unit.open_hapi_rca_count to 1."
            - "A REQUESTED SupportSurfaceOrder for MRN-H1 exists with requires_director_override false and posture_hold_applied_at null."
            - "MRN-H2's HEEL_LEFT assessment is PENDING_VALIDATION with case K2 at OPEN."
            - "The logical clock is at its 2026-08-01T00:00:00Z default."
