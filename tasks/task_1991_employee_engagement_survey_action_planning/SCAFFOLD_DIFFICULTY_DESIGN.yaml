            - call: "GET /engagement/report-snapshots"
              payload: { cycle_id: "${rd_cyc}", unit_id: "${rd_unit}", scope: "DIRECT" }
              as: PeopleAnalyst
              captures: { rd_snap: "$.data[0].overall_score" }
          assert:
            - "dimension_scores.PURPOSE == 58.33 (52.5 / 0.9 rounded half-up at 2dp)"
            - "dimension_scores.GROWTH == 41.67 (87.5 / 2.1)"
            - "dimension_scores.BELONGING == 66.67 (220.0 / 3.3)"
