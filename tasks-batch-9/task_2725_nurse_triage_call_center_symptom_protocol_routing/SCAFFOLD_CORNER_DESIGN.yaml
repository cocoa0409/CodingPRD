            - "${vclass} == OVERTRIAGE"
            - "${vpoints} == 6"
            - "ComplianceAuditRecord.${audit_id}.outcome_ordinal == 2"
            - "ComplianceAuditRecord.${audit_id}.disposition_level_ordinal == 4"
            - "Disposition.${disposition_id}.audit_status == OUTCOME_RECORDED"
            - "Disposition.${disposition_id}.advice_status == AUTHORIZED"
            - "${audited} == 1"
            - "${strict_rate} == 0.0"
            - "${band_rate} == 0.0"
            - "${over_count} == 1"
            - "${under_count} == 0"
            - "${points_total} == 6"
            - "${posture} == NORMAL"
            - "Practice.${practice_id}.open_variance_count == 0"

