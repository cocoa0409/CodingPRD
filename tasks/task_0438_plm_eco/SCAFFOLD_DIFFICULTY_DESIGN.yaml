              payload: { change_request_id: "${ci1_ecr}", effectivity_date: "2026-02-01T00:00:00Z", required_approvals: 1 }
              as: ChangeAdmin
              as_user_id: "ca1"
              captures: { ci1_eco: $.data.id }
            - call: "POST /plm/change-orders/${ci1_eco}/affected-items"
