scenario: "665. Mobile Mechanic & On-Site Auto Repair (YourMechanic/Wrench style): symptom/diagnostic request & quote, mechanic dispatch & territory/route, on-site vs tow-to-shop, parts sourcing & markup, inspection report & add-on approval, warranty & callback, fleet account, payment"
domain_name: mobile-mechanic-onsite-repair
api_prefix: /

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - resource_temporal_overlap
    - version_pinning_on_approval

  entity_topology: flat
  # Peer entities (ServiceRequest, Quote, Mechanic, JobVisit, PartLine,
  # InspectionFinding, FleetAccount, Payment, WarrantyClaim) linked by FK
  # references rather than deep URL nesting. Mechanic/FleetAccount span across
  # many ServiceRequests as cross-cutting references.

  state_machine_shape: branching
  # ServiceRequest forks at dispatch into the on-site branch vs the
  # tow-to-shop branch with divergent side-effect sets; JobVisit carries two
  # independent parallel dimensions (visit_status x payment leg via Payment).
  # WarrantyClaim adds a revision cycle (UNDER_REVIEW -> INFO_REQUESTED ->
  # UNDER_REVIEW). Quote carries an approval revision loop
  # (SENT -> REVISION_REQUESTED -> SENT).

  relationship_patterns:
    - one_to_many        # ServiceRequest -> PartLine, ServiceRequest -> InspectionFinding
    - cross_aggregate    # JobVisit references Mechanic across aggregate boundary; Payment references FleetAccount
    - polymorphic        # (not used)

  role_model: peer_roles
  # Customer owns ServiceRequests; Mechanic owns JobVisits/InspectionFindings;
  # Dispatcher owns dispatch + territory/route; FleetManager owns the fleet
  # account ledger. PlatformAdmin (opaque) seeds parts catalog / clock.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Unique login email; lowercased on store."
        constraints: "unique (case-insensitive); non-empty"
      - name: full_name
        type: string
        source: input
        description: "Customer display name."
      - name: home_zone_code
        type: string
        source: input
        description: "Service zone the customer's address falls in (e.g. Z1). Used to match dispatch territory."
        constraints: "one of the declared zone codes Z1..Z9"
      - name: fleet_account_id
        type: string
        source: input
        description: "FK -> FleetAccount.id; nullable. When set, this customer's requests bill to the fleet ledger and receive the fleet labor discount."
        default: null
      - name: status
        type: enum
        source: system
        description: "Customer lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: FleetAccount
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Fleet company name."
      - name: credit_limit_cents
        type: integer
        source: input
        description: "Maximum outstanding (unpaid) balance the fleet may carry, in cents."
        constraints: ">= 0"
      - name: labor_discount_pct
        type: number
        source: input
        description: "Fraction (0..0.40) subtracted from labor subtotal for member requests."
        constraints: "0 <= labor_discount_pct <= 0.40"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of total_due_cents over all Payment rows with status IN {INVOICED} for member requests; debited on invoice, credited on settlement. Derived ledger field."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Fleet account lifecycle. SUSPENDED blocks new fleet-billed requests."
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"

  - name: Mechanic
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Mechanic name."
      - name: zone_code
        type: string
        source: input
        description: "Territory the mechanic serves (e.g. Z1). A request is dispatchable to this mechanic only if its zone matches."
        constraints: "one of the declared zone codes Z1..Z9"
      - name: skill_tier
        type: enum
        source: input
        description: "Capability tier. TIER1 handles diagnostics + light repair; TIER2 adds complex repair; TIER3 adds tow-to-shop coordination."
        constraints: "one of {TIER1, TIER2, TIER3}"
      - name: labor_rate_cents_per_hour
        type: integer
        source: input
        description: "Hourly labor rate for this mechanic, in cents."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Mechanic availability lifecycle."
        default: AVAILABLE
        constraints: "one of {AVAILABLE, OFF_DUTY}"

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the requesting customer."
      - name: vehicle_vin
        type: string
        source: input
        description: "17-char vehicle identification number."
        constraints: "length == 17"
      - name: symptom_text
        type: string
        source: input
        description: "Free-text symptom description supplied at intake."
      - name: zone_code
        type: string
        source: system
        description: "Service zone for dispatch; copied from the customer's home_zone_code at creation."
      - name: severity
        type: enum
        source: input
        description: "Self-reported urgency at intake. EMERGENCY requests rank ahead of ROUTINE during dispatch selection."
        default: ROUTINE
        constraints: "one of {ROUTINE, URGENT, EMERGENCY}"
      - name: fleet_account_id
        type: string
        source: system
        description: "FK -> FleetAccount.id; nullable. Copied from the customer's fleet_account_id at creation (snapshot); null for retail customers."
        default: null
      - name: routing_mode
        type: enum
        source: system
        description: "Set at dispatch when the branch is chosen. ON_SITE for in-field repair; TOW_TO_SHOP for shop transfer."
        default: null
        constraints: "one of {ON_SITE, TOW_TO_SHOP} once dispatched, else null"
      - name: estimate_total_cents
        type: integer
        source: computed
        description: "Provisional grand total from the approved Quote (labor estimate + estimated parts + tow fee). Set when the Quote is approved. See calc quote_estimate_total."
        default: null
      - name: final_total_cents
        type: integer
        source: computed
        description: "Final grand total computed at job completion from actual logged labor hours + actual PartLine rows + approved add-ons + tow fee. See calc final_job_total."
        default: null
      - name: status
        type: enum
        source: system
        description: "ServiceRequest lifecycle state."
        default: INTAKE
        constraints: "one of {INTAKE, QUOTED, APPROVED, DISPATCHED, IN_PROGRESS, AWAITING_ADDON_APPROVAL, COMPLETED, CANCELLED}"

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; the request this quote prices."
      - name: diagnosis_text
        type: string
        source: input
        description: "Mechanic/dispatcher diagnosis summary."
      - name: estimated_labor_hours
        type: number
        source: input
        description: "Estimated labor hours for the job."
        constraints: "> 0"
      - name: estimated_parts_cents
        type: integer
        source: input
        description: "Estimated parts cost (already marked up) in cents."
        constraints: ">= 0"
      - name: tow_fee_cents
        type: integer
        source: input
        description: "Flat tow fee if routing_mode would be TOW_TO_SHOP; 0 for on-site quotes."
        default: 0
        constraints: ">= 0"
      - name: labor_rate_cents_per_hour
        type: integer
        source: input
        description: "Labor rate snapshot used for this quote, in cents/hour."
        constraints: "> 0"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "Computed estimate grand total stored on the quote. See calc quote_estimate_total."
        default: null
      - name: status
        type: enum
        source: system
        description: "Quote lifecycle. Supports a revision loop SENT -> REVISION_REQUESTED -> SENT."
        default: DRAFT
        constraints: "one of {DRAFT, SENT, REVISION_REQUESTED, APPROVED, REJECTED, SUPERSEDED}"

  - name: JobVisit
    parent: null
    common_fields: true
    fields:
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; the request being serviced."
      - name: mechanic_id
        type: string
        source: input
        description: "FK -> Mechanic.id; the dispatched mechanic."
      - name: scheduled_start_utc
        type: datetime
        source: input
        description: "Planned on-site arrival time (ISO 8601 UTC)."
      - name: scheduled_end_utc
        type: datetime
        source: input
        description: "Planned on-site departure time (ISO 8601 UTC). Treated as a half-open interval [start, end) for on-site overlap detection."
        constraints: "scheduled_end_utc > scheduled_start_utc"
      - name: routing_mode
        type: enum
        source: input
        description: "ON_SITE or TOW_TO_SHOP; chosen at dispatch and copied to ServiceRequest.routing_mode."
        constraints: "one of {ON_SITE, TOW_TO_SHOP}"
      - name: logged_labor_hours
        type: number
        source: input
        description: "Actual labor hours logged at completion."
        default: null
        constraints: ">= 0 when set"
      - name: visit_status
        type: enum
        source: system
        description: "JobVisit lifecycle (work dimension), independent of the request's Payment leg."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, EN_ROUTE, ON_SITE_WORKING, AT_SHOP, FINISHED, ABORTED}"

  - name: PartLine
    parent: null
    common_fields: true
    fields:
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; the request this part is sourced for."
      - name: catalog_part_id
        type: string
        source: input
        description: "FK -> CatalogPart.id; the catalog part being sourced."
      - name: quantity
        type: integer
        source: input
        description: "Units sourced."
        constraints: "> 0"
      - name: unit_cost_cents
        type: integer
        source: system
        description: "Wholesale unit cost snapshot copied from CatalogPart.wholesale_cost_cents at sourcing time."
      - name: unit_price_cents
        type: integer
        source: computed
        description: "Marked-up unit price per the tiered parts markup. See calc part_line_markup."
        default: null
      - name: line_total_cents
        type: integer
        source: computed
        description: "unit_price_cents * quantity. See calc part_line_markup."
        default: null
      - name: is_addon
        type: boolean
        source: input
        description: "True if this part belongs to an inspection add-on (requires customer approval before it counts toward final_total_cents)."
        default: false
      - name: status
        type: enum
        source: system
        description: "PartLine lifecycle."
        default: SOURCED
        constraints: "one of {SOURCED, INSTALLED, VOIDED}"

  - name: CatalogPart
    parent: null
    common_fields: false
    fields:
      - name: sku
        type: string
        source: input
        description: "Catalog SKU; unique."
        constraints: "unique; non-empty"
      - name: name
        type: string
        source: input
        description: "Part display name."
      - name: wholesale_cost_cents
        type: integer
        source: input
        description: "Wholesale (pre-markup) unit cost in cents."
        constraints: "> 0"

  - name: InspectionFinding
    parent: null
    common_fields: true
    fields:
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; the request inspected on-site."
      - name: job_visit_id
        type: string
        source: input
        description: "FK -> JobVisit.id; the visit during which the finding was recorded."
      - name: description
        type: string
        source: input
        description: "Finding description (e.g. worn brake pads)."
      - name: recommended_part_id
        type: string
        source: input
        description: "FK -> CatalogPart.id; nullable. Part recommended for the add-on repair."
        default: null
      - name: recommended_quantity
        type: integer
        source: input
        description: "Recommended part quantity for the add-on."
        default: 0
        constraints: ">= 0"
      - name: add_on_labor_hours
        type: number
        source: input
        description: "Extra labor hours the add-on repair would take."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Finding approval lifecycle."
        default: PROPOSED
        constraints: "one of {PROPOSED, APPROVED, DECLINED}"

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; the request being billed (1:1)."
      - name: fleet_account_id
        type: string
        source: system
        description: "FK -> FleetAccount.id; nullable. Copied from ServiceRequest.fleet_account_id at invoice time; routes the charge to the fleet ledger when set."
        default: null
      - name: total_due_cents
        type: integer
        source: system
        description: "Amount billed; copied from ServiceRequest.final_total_cents at invoice time."
      - name: method
        type: enum
        source: input
        description: "Settlement method."
        constraints: "one of {CARD, FLEET_CREDIT}"
      - name: status
        type: enum
        source: system
        description: "Payment leg lifecycle (parallel to JobVisit.visit_status)."
        default: INVOICED
        constraints: "one of {INVOICED, SETTLED, REFUNDED}"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: service_request_id
        type: string
        source: input
        description: "FK -> ServiceRequest.id; the completed request the claim is filed against."
      - name: reason_text
        type: string
        source: input
        description: "Customer's description of the recurring/related fault."
      - name: filed_at_utc
        type: datetime
        source: system
        description: "Logical-clock timestamp when the claim was filed."
      - name: callback_visit_id
        type: string
        source: system
        description: "FK -> JobVisit.id; nullable. The free callback visit created when the claim is approved."
        default: null
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle with a revision loop UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW."
        default: UNDER_REVIEW
        constraints: "one of {UNDER_REVIEW, INFO_REQUESTED, APPROVED, DENIED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceRequest
    initial_state: INTAKE
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: INTAKE
        to: QUOTED
        trigger: "POST /service-requests/{id}/quotes (Quote sent)"
        actor: Mechanic
        preconditions:
          - "ServiceRequest.status == INTAKE"
          - "Customer.status == ACTIVE"
        side_effects:
          - "creates a Quote in status SENT (its quoted_total_cents computed via quote_estimate_total)"
          - "ServiceRequest.status -> QUOTED"
          - "increments ServiceRequest.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /quotes/{id}/request-revision then POST /service-requests/{id}/quotes (replacement Quote)"
        actor: Customer
        preconditions:
          - "ServiceRequest.status == QUOTED"
        side_effects:
          - "the current SENT Quote -> REVISION_REQUESTED; a replacement Quote may be sent, superseding the prior (prior -> SUPERSEDED)"
        note: "Quote revision loop keeps ServiceRequest in QUOTED while the Quote cycles SENT -> REVISION_REQUESTED -> SENT."
      - from: QUOTED
        to: APPROVED
        trigger: "POST /quotes/{id}/approve"
        actor: Customer
        preconditions:
          - "ServiceRequest.status == QUOTED"
          - "the target Quote.status == SENT"
          - "if ServiceRequest.fleet_account_id is set, FleetAccount.status == ACTIVE"
        side_effects:
          - "Quote.status -> APPROVED; version-pin: the approved quote's input fields are frozen"
          - "ServiceRequest.estimate_total_cents <- approved Quote.quoted_total_cents"
          - "ServiceRequest.status -> APPROVED"
          - "increments ServiceRequest.version by 1"
      - from: APPROVED
        to: DISPATCHED
        trigger: "POST /service-requests/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "ServiceRequest.status == APPROVED"
          - "selected Mechanic.status == AVAILABLE"
          - "selected Mechanic.zone_code == ServiceRequest.zone_code"
          - "if routing_mode == TOW_TO_SHOP then Mechanic.skill_tier == TIER3"
          - "the JobVisit's [scheduled_start_utc, scheduled_end_utc) does not overlap an existing non-terminal ON_SITE JobVisit for the same mechanic (on-site overlap rule)"
        side_effects:
          - "creates a JobVisit (visit_status SCHEDULED) bound to the selected Mechanic"
          - "ServiceRequest.routing_mode <- JobVisit.routing_mode"
          - "ServiceRequest.status -> DISPATCHED"
          - "increments ServiceRequest.version by 1"
        note: "Branch point: ON_SITE vs TOW_TO_SHOP diverge in downstream side-effects (see JobVisit machine)."
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /job-visits/{id}/start-work (visit reaches ON_SITE_WORKING or AT_SHOP)"
        actor: Mechanic
        preconditions:
          - "ServiceRequest.status == DISPATCHED"
          - "JobVisit.visit_status IN {EN_ROUTE}"
        side_effects:
          - "ServiceRequest.status -> IN_PROGRESS"
          - "increments ServiceRequest.version by 1"
      - from: IN_PROGRESS
        to: AWAITING_ADDON_APPROVAL
        trigger: "POST /service-requests/{id}/inspection-findings (first PROPOSED finding submitted)"
        actor: Mechanic
        preconditions:
          - "ServiceRequest.status == IN_PROGRESS"
          - "at least one InspectionFinding in PROPOSED exists after this submission"
        side_effects:
          - "ServiceRequest.status -> AWAITING_ADDON_APPROVAL"
          - "increments ServiceRequest.version by 1"
      - from: AWAITING_ADDON_APPROVAL
        to: IN_PROGRESS
        trigger: "POST /service-requests/{id}/resolve-addons (all PROPOSED findings decided)"
        actor: Customer
        preconditions:
          - "ServiceRequest.status == AWAITING_ADDON_APPROVAL"
          - "no InspectionFinding for this request remains in PROPOSED after this call"
        side_effects:
          - "each APPROVED finding spawns a PartLine (is_addon=true, status SOURCED) and adds add_on_labor_hours to the visit add-on labor accumulator"
          - "ServiceRequest.status -> IN_PROGRESS"
          - "increments ServiceRequest.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /job-visits/{id}/finish"
        actor: Mechanic
        preconditions:
          - "ServiceRequest.status == IN_PROGRESS"
          - "no InspectionFinding for this request remains in PROPOSED"
          - "JobVisit.logged_labor_hours is set (>= 0)"
        side_effects:
          - "computes ServiceRequest.final_total_cents via final_job_total"
          - "all SOURCED PartLine rows for the request -> INSTALLED"
          - "JobVisit.visit_status -> FINISHED"
          - "creates a Payment (status INVOICED, total_due_cents <- final_total_cents)"
          - "if Payment.fleet_account_id set: FleetAccount.outstanding_balance_cents += total_due_cents (ledger debit)"
          - "ServiceRequest.status -> COMPLETED"
          - "increments ServiceRequest.version by 1"
      - from: INTAKE
        to: CANCELLED
        trigger: "POST /service-requests/{id}/cancel"
        actor: Customer
        preconditions:
          - "ServiceRequest.status IN {INTAKE, QUOTED, APPROVED}"
        side_effects:
          - "any SENT/REVISION_REQUESTED Quote -> SUPERSEDED"
          - "ServiceRequest.status -> CANCELLED"
          - "increments ServiceRequest.version by 1"
        note: "Same cancel transition is permitted from INTAKE, QUOTED, and APPROVED (pre-dispatch only)."

  - entity: JobVisit
    initial_state: SCHEDULED
    terminal_states: [FINISHED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /job-visits/{id}/depart"
        actor: Mechanic
        preconditions:
          - "JobVisit.visit_status == SCHEDULED"
          - "Mechanic.status == AVAILABLE"
        side_effects:
          - "JobVisit.visit_status -> EN_ROUTE"
          - "increments JobVisit.version by 1"
      - from: EN_ROUTE
        to: ON_SITE_WORKING
        trigger: "POST /job-visits/{id}/start-work (routing_mode == ON_SITE)"
        actor: Mechanic
        preconditions:
          - "JobVisit.visit_status == EN_ROUTE"
          - "JobVisit.routing_mode == ON_SITE"
        side_effects:
          - "JobVisit.visit_status -> ON_SITE_WORKING"
          - "drives ServiceRequest.status DISPATCHED -> IN_PROGRESS"
          - "increments JobVisit.version by 1"
        note: "ON_SITE branch."
      - from: EN_ROUTE
        to: AT_SHOP
        trigger: "POST /job-visits/{id}/start-work (routing_mode == TOW_TO_SHOP)"
        actor: Mechanic
        preconditions:
          - "JobVisit.visit_status == EN_ROUTE"
          - "JobVisit.routing_mode == TOW_TO_SHOP"
        side_effects:
          - "JobVisit.visit_status -> AT_SHOP"
          - "drives ServiceRequest.status DISPATCHED -> IN_PROGRESS"
          - "increments JobVisit.version by 1"
        note: "TOW_TO_SHOP branch; convergent next states (both reach FINISHED via /finish)."
      - from: ON_SITE_WORKING
        to: FINISHED
        trigger: "POST /job-visits/{id}/finish"
        actor: Mechanic
        preconditions:
          - "JobVisit.visit_status == ON_SITE_WORKING"
          - "ServiceRequest.status == IN_PROGRESS"
          - "no InspectionFinding remains PROPOSED"
        side_effects:
          - "JobVisit.visit_status -> FINISHED (drives ServiceRequest IN_PROGRESS -> COMPLETED)"
          - "increments JobVisit.version by 1"
      - from: AT_SHOP
        to: FINISHED
        trigger: "POST /job-visits/{id}/finish"
        actor: Mechanic
        preconditions:
          - "JobVisit.visit_status == AT_SHOP"
          - "ServiceRequest.status == IN_PROGRESS"
          - "no InspectionFinding remains PROPOSED"
        side_effects:
          - "JobVisit.visit_status -> FINISHED (drives ServiceRequest IN_PROGRESS -> COMPLETED)"
          - "increments JobVisit.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "POST /job-visits/{id}/abort"
        actor: Dispatcher
        preconditions:
          - "JobVisit.visit_status IN {SCHEDULED, EN_ROUTE}"
        side_effects:
          - "JobVisit.visit_status -> ABORTED"
          - "ServiceRequest.status reverts DISPATCHED -> APPROVED (re-dispatchable); ServiceRequest.routing_mode reset to null"
          - "increments JobVisit.version by 1 and ServiceRequest.version by 1"
        note: "Compensation: undoes the dispatch side-effect so the request can be re-dispatched."

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [APPROVED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /service-requests/{id}/quotes"
        actor: Mechanic
        preconditions:
          - "ServiceRequest.status == INTAKE OR (ServiceRequest.status == QUOTED with the prior Quote in REVISION_REQUESTED)"
        side_effects:
          - "Quote.quoted_total_cents computed via quote_estimate_total"
          - "Quote.status -> SENT"
      - from: SENT
        to: REVISION_REQUESTED
        trigger: "POST /quotes/{id}/request-revision"
        actor: Customer
        preconditions:
          - "Quote.status == SENT"
          - "ServiceRequest.status == QUOTED"
        side_effects:
          - "Quote.status -> REVISION_REQUESTED"
          - "increments Quote.version by 1"
        note: "Revision cycle: a replacement Quote (SENT) supersedes this one."
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "POST /service-requests/{id}/quotes (replacement sent)"
        actor: Mechanic
        preconditions:
          - "Quote.status == REVISION_REQUESTED"
        side_effects:
          - "Quote.status -> SUPERSEDED; new Quote created in SENT"
          - "increments Quote.version by 1"
      - from: SENT
        to: APPROVED
        trigger: "POST /quotes/{id}/approve"
        actor: Customer
        preconditions:
          - "Quote.status == SENT"
          - "ServiceRequest.status == QUOTED"
          - "if ServiceRequest.fleet_account_id set, FleetAccount.status == ACTIVE"
        side_effects:
          - "Quote.status -> APPROVED (version-pinned)"
          - "drives ServiceRequest QUOTED -> APPROVED"
          - "increments Quote.version by 1"
      - from: SENT
        to: REJECTED
        trigger: "POST /quotes/{id}/reject"
        actor: Customer
        preconditions:
          - "Quote.status == SENT"
        side_effects:
          - "Quote.status -> REJECTED"
          - "increments Quote.version by 1"

  - entity: WarrantyClaim
    initial_state: UNDER_REVIEW
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /warranty-claims/{id}/request-info"
        actor: Dispatcher
        preconditions:
          - "WarrantyClaim.status == UNDER_REVIEW"
        side_effects:
          - "WarrantyClaim.status -> INFO_REQUESTED"
          - "increments WarrantyClaim.version by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /warranty-claims/{id}/supply-info"
        actor: Customer
        preconditions:
          - "WarrantyClaim.status == INFO_REQUESTED"
        side_effects:
          - "WarrantyClaim.status -> UNDER_REVIEW"
          - "increments WarrantyClaim.version by 1"
        note: "Revision loop: claim can cycle UNDER_REVIEW <-> INFO_REQUESTED any number of rounds."
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: Dispatcher
        preconditions:
          - "WarrantyClaim.status == UNDER_REVIEW"
          - "the referenced ServiceRequest.status == COMPLETED"
          - "claim filed within WARRANTY_WINDOW_DAYS of the request's completion (filed_at_utc - request completion <= window)"
        side_effects:
          - "creates a free callback JobVisit (visit_status SCHEDULED, routing_mode ON_SITE) for the same mechanic/zone; WarrantyClaim.callback_visit_id set"
          - "WarrantyClaim.status -> APPROVED"
          - "increments WarrantyClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: Dispatcher
        preconditions:
          - "WarrantyClaim.status == UNDER_REVIEW"
        side_effects:
          - "WarrantyClaim.status -> DENIED"
          - "increments WarrantyClaim.version by 1"

  - entity: Payment
    initial_state: INVOICED
    terminal_states: [REFUNDED]
    transitions:
      - from: INVOICED
        to: SETTLED
        trigger: "POST /payments/{id}/settle"
        actor: FleetManager
        preconditions:
          - "Payment.status == INVOICED"
          - "if method == FLEET_CREDIT, the acting FleetManager owns Payment.fleet_account_id"
        side_effects:
          - "Payment.status -> SETTLED"
          - "if Payment.fleet_account_id set: FleetAccount.outstanding_balance_cents -= total_due_cents (ledger credit; conserves the ledger invariant)"
          - "increments Payment.version by 1"
      - from: INVOICED
        to: REFUNDED
        trigger: "POST /payments/{id}/refund"
        actor: Dispatcher
        preconditions:
          - "Payment.status == INVOICED"
        side_effects:
          - "Payment.status -> REFUNDED"
          - "if Payment.fleet_account_id set: FleetAccount.outstanding_balance_cents -= total_due_cents (ledger credit; compensates the invoice debit)"
          - "increments Payment.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-approve-stale-request
    parent_entity: ServiceRequest
    write_endpoint: "POST /quotes/{id}/approve"
    occ_field: "expected_service_request_version"
    description: |
      Approving a Quote against a ServiceRequest whose version has advanced
      since the client last observed it is rejected. This captures the case
      where a replacement Quote was sent (the prior quote superseded, the
      request's version bumped) so the approver's view of the request is stale.
      The new SENT quote may itself legitimately be approved, so a second
      sequential approve carrying the old version is rejected on stale version,
      not on a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: dispatch-stale-request
    parent_entity: ServiceRequest
    write_endpoint: "POST /service-requests/{id}/dispatch"
    occ_field: "expected_service_request_version"
    description: |
      Dispatching a ServiceRequest whose version has advanced since the
      dispatcher last read it is rejected on stale version. A dispatch
      legitimately could be retried against the current request, so the loser
      carrying the stale version fails OCC rather than a state precondition.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: part_line_markup
    trigger: "on PartLine creation (POST /service-requests/{id}/part-lines) and when add-on findings spawn PartLines via resolve-addons"
    algorithm: tiered_pricing
    formula: |
      # Marginal tiered markup over WHOLESALE unit cost (cents). The markup
      # rate is selected by the unit wholesale cost band, marginal per band:
      #   band A: first  0..5000 cents of wholesale  -> markup 0.45
      #   band B: next   5001..20000 cents           -> markup 0.30
      #   band C: above  20000 cents                 -> markup 0.18
      # markup_cents = round_half_up over the MARGINAL sum, computed per-band,
      # then summed (NOT a single average rate). Then:
      #   unit_price_cents = unit_cost_cents + markup_cents
      #   line_total_cents = unit_price_cents * quantity
      def unit_price(wc):
          a = min(wc, 5000)
          b = min(max(wc - 5000, 0), 15000)
          c = max(wc - 20000, 0)
          markup = round_half_up(a*0.45 + b*0.30 + c*0.18)   # cents, half-up
          return wc + markup
    input_set: "single CatalogPart wholesale_cost_cents snapshot per line; quantity is a positive integer; markup applies per unit then multiplied by quantity (round per-unit BEFORE multiplying)."
    constants:
      BAND_A_CAP_CENTS: 5000
      BAND_B_CAP_CENTS: 20000
      BAND_A_RATE: 0.45
      BAND_B_RATE: 0.30
      BAND_C_RATE: 0.18
    precision: "markup rounded to whole cents, round_half_up, computed per UNIT before multiplying by quantity"

  - name: quote_estimate_total
    trigger: "on Quote send (POST /service-requests/{id}/quotes); stored as Quote.quoted_total_cents and copied to ServiceRequest.estimate_total_cents on approval"
    algorithm: forward_looking
    formula: |
      # PROVISIONAL estimate from quote INPUT fields only (no actual logged
      # hours, no actual PartLines). Labor is billed on estimated hours; parts
      # are the mechanic's estimated_parts_cents (already marked up upstream).
      labor_cents = round_half_up(estimated_labor_hours * labor_rate_cents_per_hour)
      labor_after_fleet = labor_cents
      if service_request.fleet_account_id is set:
          labor_after_fleet = round_half_up(labor_cents * (1 - FleetAccount.labor_discount_pct))
      quoted_total_cents = labor_after_fleet + estimated_parts_cents + tow_fee_cents
    input_set: "the quote's own input fields plus the snapshotted FleetAccount.labor_discount_pct when ServiceRequest.fleet_account_id is set; excludes any actual JobVisit hours or PartLine rows."
    constants: {}
    precision: "labor rounded to whole cents half-up; fleet discount applied to labor subtotal then rounded half-up; parts and tow added as-is"
    variants:
      - name: estimate
        when: "computed at quote send / approval (forward-looking from estimated_labor_hours and estimated_parts_cents)"
        difference: "uses estimated inputs; ignores actual logged hours and actual PartLine totals"
      - name: final
        when: "computed at job completion (see final_job_total)"
        difference: "final_job_total uses ACTUAL logged_labor_hours + add-on hours and ACTUAL installed PartLine line_totals, which generally diverge from the estimate"

  - name: final_job_total
    trigger: "on JobVisit finish (POST /job-visits/{id}/finish); stored as ServiceRequest.final_total_cents"
    algorithm: aggregation
    formula: |
      # FINAL total from ACTUALS. Labor = (base logged hours + sum of
      # add_on_labor_hours over APPROVED InspectionFindings) * mechanic rate.
      base_hours = job_visit.logged_labor_hours
      addon_hours = sum(f.add_on_labor_hours for f in findings if f.status == APPROVED)
      total_hours = base_hours + addon_hours
      labor_cents = round_half_up(total_hours * mechanic.labor_rate_cents_per_hour)
      labor_after_fleet = labor_cents
      if service_request.fleet_account_id is set:
          labor_after_fleet = round_half_up(labor_cents * (1 - FleetAccount.labor_discount_pct))
      # Parts: SUM over installed PartLine.line_total_cents (status != VOIDED),
      # where each line_total was already computed per part_line_markup
      # (round-per-unit-then-multiply). Sum the already-rounded line totals.
      parts_cents = sum(pl.line_total_cents for pl in part_lines if pl.status != VOIDED)
      tow_cents = approved_quote.tow_fee_cents if routing_mode == TOW_TO_SHOP else 0
      final_total_cents = labor_after_fleet + parts_cents + tow_cents
    input_set: "JobVisit.logged_labor_hours + add_on_labor_hours of APPROVED findings; PartLine rows with status IN {SOURCED, INSTALLED} (i.e. status != VOIDED) for the request; tow_fee_cents from the approved quote only when routing_mode == TOW_TO_SHOP."
    constants: {}
    precision: "labor total rounded once after summing hours (sum-hours-then-round), half-up; parts summed from already-rounded per-line totals (round-per-line-then-sum); fleet discount applied to labor subtotal then rounded half-up"

  - name: fleet_credit_headroom
    trigger: "on Quote approval when ServiceRequest.fleet_account_id is set; re-checked at invoice (finish) time"
    algorithm: threshold
    formula: |
      # Headroom check: a fleet-billed request may proceed only if the
      # projected new outstanding balance does NOT exceed the credit limit.
      # At approval the projection uses the ESTIMATE; at finish it uses FINAL.
      projected = FleetAccount.outstanding_balance_cents + projected_charge_cents
      allowed = (projected <= FleetAccount.credit_limit_cents)   # boundary: <= passes, > fails
    input_set: "FleetAccount.outstanding_balance_cents (live), plus projected_charge_cents = ServiceRequest.estimate_total_cents at approval / final_total_cents at finish."
    constants: {}
    precision: "integer cents; the boundary is inclusive — projected == credit_limit_cents PASSES, projected == credit_limit_cents + 1 FAILS"
    variants:
      - name: at_approval
        when: "checked during quote approval"
        difference: "uses estimate_total_cents as projected_charge_cents"
      - name: at_invoice
        when: "checked during job finish before the ledger debit"
        difference: "uses final_total_cents as projected_charge_cents; final may differ from estimate so a request that passed at approval can fail here"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /_clock/set_current_utc and POST /catalog-parts which still require headers"

  - priority: 2
    category: auth
    check: "acting role is permitted for the operation per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "all path-referenced resources exist (validated left-to-right); body FK references resolve"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids or body FKs"

  - priority: 4
    category: business_referential
    check: "acting entity_backed user owns the resource (Customer owns its ServiceRequest; FleetManager owns the Payment's fleet_account_id; Mechanic owns the JobVisit)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"

  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_constraint
    check: "request body is structurally valid: required fields present, enums in range, numeric fields satisfy constraints (quantity > 0, hours > 0, vin length 17, etc.)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/transition endpoints with a body"

  - priority: 7
    category: business_constraint
    check: "on dispatch, the selected mechanic's zone_code matches ServiceRequest.zone_code"
    error_id: ERR_ZONE_MISMATCH
    http_status: 409
    applies_to: "POST /service-requests/{id}/dispatch"

  - priority: 8
    category: business_safety
    check: "on dispatch with routing_mode == TOW_TO_SHOP, the selected mechanic's skill_tier == TIER3"
    error_id: ERR_INSUFFICIENT_SKILL_TIER
    http_status: 409
    applies_to: "POST /service-requests/{id}/dispatch"

  - priority: 9
    category: business_temporal
    check: "on dispatch with routing_mode == ON_SITE, the new JobVisit interval [start,end) does not overlap an existing non-terminal ON_SITE JobVisit for the same mechanic (half-open: touching at a boundary is allowed)"
    error_id: ERR_VISIT_OVERLAP
    http_status: 409
    applies_to: "POST /service-requests/{id}/dispatch"

  - priority: 10
    category: business_temporal
    check: "on warranty claim approval, the callback JobVisit interval [start,end) does not overlap (with a CALLBACK_BUFFER_MINUTES buffer on each side) any existing non-terminal JobVisit for the same mechanic (buffered overlap)"
    error_id: ERR_CALLBACK_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/approve"

  - priority: 11
    category: business_temporal
    check: "warranty claim filed within WARRANTY_WINDOW_DAYS of request completion"
    error_id: ERR_WARRANTY_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/approve"

  - priority: 12
    category: business_fiscal
    check: "fleet credit headroom: projected outstanding balance <= credit_limit_cents (estimate at approval, final at finish)"
    error_id: ERR_FLEET_CREDIT_EXCEEDED
    http_status: 402
    applies_to: "POST /quotes/{id}/approve, POST /job-visits/{id}/finish"

  - priority: 13
    category: business_constraint
    check: "fleet account active when a fleet-billed request is approved or settled"
    error_id: ERR_FLEET_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /quotes/{id}/approve, POST /payments/{id}/settle"

  - priority: 14
    category: state
    check: "OCC: expected_<parent>_version matches current parent.version on guarded writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /quotes/{id}/approve, POST /service-requests/{id}/dispatch"

  - priority: 15
    category: state
    check: "on job-visit finish, no InspectionFinding for the request remains in PROPOSED (all add-ons resolved)"
    error_id: ERR_ADDONS_UNRESOLVED
    http_status: 409
    applies_to: "POST /job-visits/{id}/finish"

  - priority: 16
    category: business_constraint
    check: "on resolve-addons, the decisions list covers exactly the findings currently in PROPOSED (no PROPOSED finding omitted, no decision referencing a non-PROPOSED or unrelated finding)"
    error_id: ERR_VALIDATION_PENDING
    http_status: 422
    applies_to: "POST /service-requests/{id}/resolve-addons"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- system / test-driving ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-04-01T00:00:00Z; the clock never falls back to wall-clock time. All filed_at/window comparisons read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced/reset to the supplied instant"]

  - method: POST
    path: "/catalog-parts"
    description: "Seed/define a catalog part with wholesale cost."
    roles: [PlatformAdmin]
    code: 201
    input: [sku, name, wholesale_cost_cents]
    output: CatalogPart
    side_effects: ["CatalogPart created"]

  - method: GET
    path: "/catalog-parts/{id}"
    description: "Fetch a catalog part."
    roles: [PlatformAdmin, Mechanic, Dispatcher]
    code: 200
    input: []
    output: CatalogPart
    side_effects: []

  # ---- fleet accounts ----
  - method: POST
    path: "/fleet-accounts"
    description: "Create a fleet account."
    roles: [PlatformAdmin]
    code: 201
    input: [company_name, credit_limit_cents, labor_discount_pct]
    output: FleetAccount
    side_effects: ["FleetAccount created in ACTIVE with outstanding_balance_cents=0"]

  - method: GET
    path: "/fleet-accounts/{id}"
    description: "Fetch a fleet account (includes computed outstanding_balance_cents)."
    roles: [PlatformAdmin, FleetManager]
    code: 200
    input: []
    output: FleetAccount
    side_effects: []

  - method: POST
    path: "/fleet-accounts/{id}/suspend"
    description: "Suspend a fleet account (blocks new fleet-billed approvals/settlements)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FleetAccount
    side_effects: ["FleetAccount.status -> SUSPENDED", "increments FleetAccount.version by 1"]

  - method: GET
    path: "/fleet-accounts/{id}/payments"
    description: "List Payments billed to this fleet account (reverse-reachability for Payment.fleet_account_id)."
    roles: [PlatformAdmin, FleetManager]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  # ---- customers ----
  - method: POST
    path: "/customers"
    description: "Register a customer; home_zone_code and optional fleet_account_id."
    roles: [PlatformAdmin]
    code: 201
    input: ["email", "full_name", "home_zone_code", "fleet_account_id?"]
    output: Customer
    side_effects: ["Customer created in ACTIVE"]

  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer."
    roles: [PlatformAdmin, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers/{id}/service-requests"
    description: "List service requests for a customer (reverse-reachability for ServiceRequest.customer_id)."
    roles: [PlatformAdmin, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceRequest[]
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List customers, optionally filtered by fleet (reverse-reachability for Customer.fleet_account_id)."
    roles: [PlatformAdmin, FleetManager]
    code: 200
    input: ["fleet_account_id?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # ---- mechanics ----
  - method: POST
    path: "/mechanics"
    description: "Create a mechanic with zone, skill tier, labor rate."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, zone_code, skill_tier, labor_rate_cents_per_hour]
    output: Mechanic
    side_effects: ["Mechanic created in AVAILABLE"]

  - method: GET
    path: "/mechanics/{id}"
    description: "Fetch a mechanic."
    roles: [PlatformAdmin, Dispatcher, Mechanic]
    code: 200
    input: []
    output: Mechanic
    side_effects: []

  - method: GET
    path: "/mechanics/{id}/job-visits"
    description: "List job visits for a mechanic (reverse-reachability for JobVisit.mechanic_id)."
    roles: [PlatformAdmin, Dispatcher, Mechanic]
    code: 200
    input: ["limit?", "offset?"]
    output: JobVisit[]
    side_effects: []

  # ---- service requests ----
  - method: POST
    path: "/service-requests"
    description: "Customer files a diagnostic/symptom request. zone_code and fleet_account_id snapshotted from the customer."
    roles: [Customer]
    code: 201
    input: ["customer_id", "vehicle_vin", "symptom_text", "severity?"]
    output: ServiceRequest
    side_effects: ["ServiceRequest created in INTAKE; zone_code <- Customer.home_zone_code; fleet_account_id <- Customer.fleet_account_id"]

  - method: GET
    path: "/service-requests/{id}"
    description: "Fetch a service request (includes estimate_total_cents/final_total_cents/version)."
    roles: [PlatformAdmin, Customer, Mechanic, Dispatcher]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: []

  - method: GET
    path: "/service-requests"
    description: "List service requests, optionally filtered by customer or fleet (reverse-reachability for ServiceRequest.fleet_account_id and ServiceRequest.customer_id)."
    roles: [PlatformAdmin, Dispatcher, FleetManager]
    code: 200
    input: ["customer_id?", "fleet_account_id?", "limit?", "offset?"]
    output: ServiceRequest[]
    side_effects: []

  - method: POST
    path: "/service-requests/{id}/quotes"
    description: "Mechanic sends a quote for the request (also used to send a replacement after a revision request)."
    roles: [Mechanic]
    code: 201
    input: ["diagnosis_text", "estimated_labor_hours", "estimated_parts_cents", "labor_rate_cents_per_hour", "tow_fee_cents?"]
    output: Quote
    side_effects: ["Quote created in SENT with quoted_total_cents (quote_estimate_total)", "ServiceRequest INTAKE->QUOTED (first send); replacement supersedes prior REVISION_REQUESTED quote", "increments ServiceRequest.version by 1"]

  - method: GET
    path: "/service-requests/{id}/quotes"
    description: "List quotes for a request (reverse-reachability for Quote.service_request_id)."
    roles: [PlatformAdmin, Customer, Mechanic, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: POST
    path: "/service-requests/{id}/dispatch"
    description: "Dispatcher assigns a mechanic and chooses routing_mode (ON_SITE/TOW_TO_SHOP), creating a JobVisit. OCC-guarded on the request version."
    roles: [Dispatcher]
    code: 201
    input: [mechanic_id, routing_mode, scheduled_start_utc, scheduled_end_utc, expected_service_request_version]
    output: JobVisit
    side_effects: ["JobVisit created in SCHEDULED", "ServiceRequest APPROVED->DISPATCHED; routing_mode set", "increments ServiceRequest.version by 1"]

  - method: POST
    path: "/service-requests/{id}/part-lines"
    description: "Mechanic sources a (non-add-on) part for the request; markup applied."
    roles: [Mechanic]
    code: 201
    input: [catalog_part_id, quantity]
    output: PartLine
    side_effects: ["PartLine created in SOURCED with unit_price_cents/line_total_cents via part_line_markup; unit_cost_cents snapshotted from CatalogPart"]

  - method: GET
    path: "/service-requests/{id}/part-lines"
    description: "List part lines for a request (reverse-reachability for PartLine.service_request_id)."
    roles: [PlatformAdmin, Customer, Mechanic, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: PartLine[]
    side_effects: []

  - method: GET
    path: "/part-lines/{id}"
    description: "Fetch a single part line."
    roles: [PlatformAdmin, Customer, Mechanic, Dispatcher]
    code: 200
    input: []
    output: PartLine
    side_effects: []

  - method: GET
    path: "/part-lines"
    description: "List part lines, optionally filtered by catalog part or request (reverse-reachability for PartLine.catalog_part_id and PartLine.service_request_id)."
    roles: [PlatformAdmin, Mechanic, Dispatcher]
    code: 200
    input: ["catalog_part_id?", "service_request_id?", "limit?", "offset?"]
    output: PartLine[]
    side_effects: []

  - method: POST
    path: "/service-requests/{id}/inspection-findings"
    description: "Mechanic records an on-site inspection finding (add-on proposal). First PROPOSED finding moves request IN_PROGRESS->AWAITING_ADDON_APPROVAL."
    roles: [Mechanic]
    code: 201
    input: ["job_visit_id", "description", "recommended_part_id?", "recommended_quantity?", "add_on_labor_hours?"]
    output: InspectionFinding
    side_effects: ["InspectionFinding created in PROPOSED", "ServiceRequest IN_PROGRESS->AWAITING_ADDON_APPROVAL on first PROPOSED", "increments ServiceRequest.version by 1"]

  - method: GET
    path: "/service-requests/{id}/inspection-findings"
    description: "List inspection findings for a request (reverse-reachability for InspectionFinding.service_request_id)."
    roles: [PlatformAdmin, Customer, Mechanic, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: InspectionFinding[]
    side_effects: []

  - method: GET
    path: "/inspection-findings/{id}"
    description: "Fetch a single inspection finding."
    roles: [PlatformAdmin, Customer, Mechanic, Dispatcher]
    code: 200
    input: []
    output: InspectionFinding
    side_effects: []

  - method: GET
    path: "/inspection-findings"
    description: "List inspection findings, optionally filtered by visit, recommended part, or request (reverse-reachability for InspectionFinding.job_visit_id and InspectionFinding.recommended_part_id)."
    roles: [PlatformAdmin, Mechanic, Dispatcher]
    code: 200
    input: ["job_visit_id?", "recommended_part_id?", "service_request_id?", "limit?", "offset?"]
    output: InspectionFinding[]
    side_effects: []

  - method: POST
    path: "/service-requests/{id}/resolve-addons"
    description: "Customer approves/declines all proposed findings in one call; approved findings spawn add-on PartLines + add-on labor. Returns the request."
    roles: [Customer]
    code: 200
    input: [decisions]
    output: ServiceRequest
    side_effects: ["each finding -> APPROVED/DECLINED per decisions", "APPROVED finding with a recommended_part_id spawns a PartLine (is_addon=true, SOURCED) via part_line_markup", "ServiceRequest AWAITING_ADDON_APPROVAL->IN_PROGRESS when none remain PROPOSED", "increments ServiceRequest.version by 1"]

  - method: POST
    path: "/service-requests/{id}/cancel"
    description: "Customer cancels a pre-dispatch request (INTAKE/QUOTED/APPROVED)."
    roles: [Customer]
    code: 200
    input: []
    output: ServiceRequest
    side_effects: ["any SENT/REVISION_REQUESTED quote -> SUPERSEDED", "ServiceRequest -> CANCELLED", "increments ServiceRequest.version by 1"]

  # ---- quotes ----
  - method: GET
    path: "/quotes/{id}"
    description: "Fetch a quote."
    roles: [PlatformAdmin, Customer, Mechanic, Dispatcher]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/quotes/{id}/approve"
    description: "Customer approves a SENT quote. OCC-guarded on the request version; runs fleet headroom + fleet-active checks."
    roles: [Customer]
    code: 200
    input: [expected_service_request_version]
    output: Quote
    side_effects: ["Quote SENT->APPROVED (version-pinned)", "ServiceRequest QUOTED->APPROVED; estimate_total_cents <- quoted_total_cents", "increments ServiceRequest.version by 1"]

  - method: POST
    path: "/quotes/{id}/reject"
    description: "Customer rejects a SENT quote."
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote SENT->REJECTED", "increments Quote.version by 1"]

  - method: POST
    path: "/quotes/{id}/request-revision"
    description: "Customer asks for a revised quote; quote moves SENT->REVISION_REQUESTED (request stays QUOTED)."
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["Quote SENT->REVISION_REQUESTED", "increments Quote.version by 1"]

  # ---- job visits ----
  - method: GET
    path: "/job-visits/{id}"
    description: "Fetch a job visit."
    roles: [PlatformAdmin, Customer, Mechanic, Dispatcher]
    code: 200
    input: []
    output: JobVisit
    side_effects: []

  - method: GET
    path: "/job-visits"
    description: "List job visits, optionally filtered by request or mechanic (reverse-reachability for JobVisit.service_request_id and JobVisit.mechanic_id)."
    roles: [PlatformAdmin, Dispatcher, Mechanic]
    code: 200
    input: ["service_request_id?", "mechanic_id?", "limit?", "offset?"]
    output: JobVisit[]
    side_effects: []

  - method: POST
    path: "/job-visits/{id}/depart"
    description: "Mechanic departs to the job; SCHEDULED->EN_ROUTE."
    roles: [Mechanic]
    code: 200
    input: []
    output: JobVisit
    side_effects: ["JobVisit SCHEDULED->EN_ROUTE", "increments JobVisit.version by 1"]

  - method: POST
    path: "/job-visits/{id}/start-work"
    description: "Mechanic begins work; EN_ROUTE->ON_SITE_WORKING (ON_SITE) or ->AT_SHOP (TOW_TO_SHOP); drives request DISPATCHED->IN_PROGRESS."
    roles: [Mechanic]
    code: 200
    input: []
    output: JobVisit
    side_effects: ["JobVisit EN_ROUTE->ON_SITE_WORKING|AT_SHOP", "ServiceRequest DISPATCHED->IN_PROGRESS", "increments JobVisit.version and ServiceRequest.version by 1"]

  - method: POST
    path: "/job-visits/{id}/finish"
    description: "Mechanic finishes; logs labor hours; computes final_total_cents; installs parts; creates Payment; drives request->COMPLETED."
    roles: [Mechanic]
    code: 200
    input: [logged_labor_hours, payment_method]
    output: JobVisit
    side_effects: ["JobVisit ->FINISHED", "final_job_total computed and stored on ServiceRequest.final_total_cents", "fleet headroom (at_invoice) re-checked", "SOURCED PartLines ->INSTALLED", "Payment created INVOICED; fleet ledger debited if fleet-billed", "ServiceRequest IN_PROGRESS->COMPLETED", "increments JobVisit/ServiceRequest versions by 1"]

  - method: POST
    path: "/job-visits/{id}/abort"
    description: "Dispatcher aborts a SCHEDULED/EN_ROUTE visit; reverts the request to APPROVED for re-dispatch."
    roles: [Dispatcher]
    code: 200
    input: []
    output: JobVisit
    side_effects: ["JobVisit ->ABORTED", "ServiceRequest DISPATCHED->APPROVED; routing_mode reset to null", "increments JobVisit/ServiceRequest versions by 1"]

  # ---- payments ----
  - method: GET
    path: "/payments/{id}"
    description: "Fetch a payment."
    roles: [PlatformAdmin, Customer, FleetManager, Dispatcher]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: GET
    path: "/service-requests/{id}/payments"
    description: "List payments for a request (reverse-reachability for Payment.service_request_id)."
    roles: [PlatformAdmin, Customer, FleetManager, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/payments/{id}/settle"
    description: "Settle an invoiced payment; fleet credit settlements require fleet-active and fleet ownership; credits the ledger."
    roles: [FleetManager, Customer]
    code: 200
    input: []
    output: Payment
    side_effects: ["Payment INVOICED->SETTLED", "fleet ledger credited if fleet-billed", "increments Payment.version by 1"]

  - method: POST
    path: "/payments/{id}/refund"
    description: "Dispatcher refunds an invoiced payment; credits the fleet ledger to compensate the invoice debit."
    roles: [Dispatcher]
    code: 200
    input: []
    output: Payment
    side_effects: ["Payment INVOICED->REFUNDED", "fleet ledger credited if fleet-billed", "increments Payment.version by 1"]

  # ---- warranty claims ----
  - method: POST
    path: "/service-requests/{id}/warranty-claims"
    description: "Customer files a warranty claim against a COMPLETED request; filed_at_utc stamped from the clock."
    roles: [Customer]
    code: 201
    input: [reason_text]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim created in UNDER_REVIEW; filed_at_utc <- clock"]

  - method: GET
    path: "/service-requests/{id}/warranty-claims"
    description: "List warranty claims for a request (reverse-reachability for WarrantyClaim.service_request_id)."
    roles: [PlatformAdmin, Customer, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: GET
    path: "/warranty-claims/{id}"
    description: "Fetch a warranty claim."
    roles: [PlatformAdmin, Customer, Dispatcher]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims, optionally filtered by callback visit or request (reverse-reachability for WarrantyClaim.callback_visit_id and WarrantyClaim.service_request_id)."
    roles: [PlatformAdmin, Dispatcher]
    code: 200
    input: ["callback_visit_id?", "service_request_id?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: POST
    path: "/warranty-claims/{id}/request-info"
    description: "Dispatcher requests more info; UNDER_REVIEW->INFO_REQUESTED."
    roles: [Dispatcher]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim UNDER_REVIEW->INFO_REQUESTED", "increments WarrantyClaim.version by 1"]

  - method: POST
    path: "/warranty-claims/{id}/supply-info"
    description: "Customer supplies requested info; INFO_REQUESTED->UNDER_REVIEW."
    roles: [Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim INFO_REQUESTED->UNDER_REVIEW", "increments WarrantyClaim.version by 1"]

  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Dispatcher approves the claim; creates a free callback JobVisit (buffered slot check + warranty window check)."
    roles: [Dispatcher]
    code: 200
    input: [mechanic_id, scheduled_start_utc, scheduled_end_utc]
    output: WarrantyClaim
    side_effects: ["creates a free callback JobVisit (SCHEDULED, ON_SITE)", "WarrantyClaim ->APPROVED; callback_visit_id set", "increments WarrantyClaim.version by 1"]

  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Dispatcher denies the claim; UNDER_REVIEW->DENIED."
    roles: [Dispatcher]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["WarrantyClaim ->DENIED", "increments WarrantyClaim.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "acting role not permitted for the operation per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-referenced resource or body FK does not exist"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "entity_backed acting user is not the owner of the targeted resource"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "transition not defined from the resource's current state"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, enum out of range, or numeric constraint violated (quantity<=0, hours<=0, vin length != 17, labor_discount_pct out of [0,0.40], scheduled_end <= scheduled_start)"
  - id: ERR_ZONE_MISMATCH
    http: 409
    condition: "dispatched mechanic.zone_code != ServiceRequest.zone_code"
  - id: ERR_INSUFFICIENT_SKILL_TIER
    http: 409
    condition: "TOW_TO_SHOP dispatch to a mechanic whose skill_tier != TIER3"
  - id: ERR_VISIT_OVERLAP
    http: 409
    condition: "on-site dispatch interval overlaps an existing non-terminal ON_SITE visit for the same mechanic (half-open)"
  - id: ERR_CALLBACK_SLOT_CONFLICT
    http: 409
    condition: "callback visit interval (with buffer) overlaps an existing non-terminal visit for the same mechanic"
  - id: ERR_WARRANTY_WINDOW_EXPIRED
    http: 409
    condition: "warranty claim approved more than WARRANTY_WINDOW_DAYS after request completion"
  - id: ERR_FLEET_CREDIT_EXCEEDED
    http: 402
    condition: "projected fleet outstanding balance would exceed credit_limit_cents (at approval or at finish)"
  - id: ERR_FLEET_ACCOUNT_SUSPENDED
    http: 409
    condition: "fleet-billed approval or settlement attempted while the FleetAccount is SUSPENDED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_service_request_version does not match current ServiceRequest.version on a guarded write"
  - id: ERR_ADDONS_UNRESOLVED
    http: 409
    condition: "finishing a visit while one or more InspectionFindings remain PROPOSED"
  - id: ERR_VALIDATION_PENDING
    http: 422
    condition: "resolve-addons decisions list omits a finding still in PROPOSED, or references a finding not in PROPOSED"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Owns service requests; approves/rejects/revises quotes; resolves add-ons; files & supplies warranty info; settles card payments."
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /service-requests"
      - "POST /quotes/{id}/approve"
      - "POST /quotes/{id}/reject"
      - "POST /quotes/{id}/request-revision"
      - "POST /service-requests/{id}/resolve-addons"
      - "POST /service-requests/{id}/cancel"
      - "POST /service-requests/{id}/warranty-claims"
      - "POST /warranty-claims/{id}/supply-info"
    shared_operations:
      - "POST /payments/{id}/settle"   # shared with FleetManager
      - "GET reads on owned resources"

  - name: Mechanic
    description: "Sends quotes, sources parts, records inspection findings, drives the job visit (depart/start-work/finish)."
    identity: "entity_backed:Mechanic"
    exclusive_operations:
      - "POST /service-requests/{id}/quotes"
      - "POST /service-requests/{id}/part-lines"
      - "POST /service-requests/{id}/inspection-findings"
      - "POST /job-visits/{id}/depart"
      - "POST /job-visits/{id}/start-work"
      - "POST /job-visits/{id}/finish"
    shared_operations:
      - "GET reads on mechanics / job-visits / catalog-parts"

  - name: Dispatcher
    description: "Assigns mechanics & routing (territory/route), aborts visits, refunds, and adjudicates warranty claims."
    identity: "opaque"
    exclusive_operations:
      - "POST /service-requests/{id}/dispatch"
      - "POST /job-visits/{id}/abort"
      - "POST /payments/{id}/refund"
      - "POST /warranty-claims/{id}/request-info"
      - "POST /warranty-claims/{id}/approve"
      - "POST /warranty-claims/{id}/deny"
    shared_operations:
      - "GET reads on service-requests / quotes / job-visits / warranty-claims"

  - name: FleetManager
    description: "Manages the fleet ledger; settles fleet-credit payments for the fleet accounts it owns."
    identity: "entity_backed:FleetAccount"
    exclusive_operations: []
    shared_operations:
      - "POST /payments/{id}/settle"   # shared with Customer; fleet-credit settlements restricted to the owning FleetManager
      - "GET /fleet-accounts/{id}"
      - "GET /fleet-accounts/{id}/payments"

  - name: PlatformAdmin
    description: "Operational seeding: catalog parts, fleet accounts, customers, mechanics, logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /catalog-parts"
      - "POST /fleet-accounts"
      - "POST /fleet-accounts/{id}/suspend"
      - "POST /customers"
      - "POST /mechanics"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads (broad operational visibility)"

# Domain constants surfaced for downstream generators:
constants:
  WARRANTY_WINDOW_DAYS: 30
  CALLBACK_BUFFER_MINUTES: 30
  CLOCK_DEFAULT_UTC: "2026-04-01T00:00:00Z"
  ZONE_CODES: [Z1, Z2, Z3, Z4, Z5, Z6, Z7, Z8, Z9]
