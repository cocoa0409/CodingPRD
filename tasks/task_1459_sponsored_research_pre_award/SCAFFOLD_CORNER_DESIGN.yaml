            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv2: $.data.version } }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/negotiation-offers", payload: { expected_proposal_version: "${pv2}", origin: "SPONSOR", offered_total_cents: 14000000 }, as: OSPDirector, captures: { o1: $.data.id } }
            - call: "POST /pre-award/proposals/${prop_id}/negotiation-offers"
              payload: { expected_proposal_version: "${pv2}", origin: "INSTITUTION", offered_total_cents: 14500000 }
              as: OSPDirector
              captures: { err: $.data.error_id }
          assert:
            - "o1 created (round_index 1)"
            - "err == ERR_STALE_VERSION"

      - name: submit_idempotent_replay
        claim_type: idempotency
        grounds: [entities.SubmissionPackage.fields.idempotency_key, state_machines.Proposal.INSTITUTIONALLY_APPROVED_to_SUBMITTED]
        distinguishing_aspect: "Replaying submit with the same idempotency_key returns the original package (identical portal_confirmation_code) and does not advance proposal.version; a different key hits the state precondition (ERR_PROPOSAL_INVALID_STATE)."
        test_recipe:
          setup: ["proposal INSTITUTIONALLY_APPROVED"]
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Idem", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv1}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/approve-institutional", payload: {}, as: OSPDirector, as_user_id: "director-1" }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/submit", payload: { idempotency_key: "idem-1" }, as: OSPDirector, captures: { code1: $.data.portal_confirmation_code } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { v_after_submit: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/submit", payload: { idempotency_key: "idem-1" }, as: OSPDirector, captures: { code2: $.data.portal_confirmation_code } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { v_after_replay: $.data.version } }
            - { call: "GET /pre-award/proposals/${prop_id}/submission-packages", payload: {}, as: OSPDirector, captures: { only_pkg: "$.data[0].portal_confirmation_code" } }
            - call: "POST /pre-award/proposals/${prop_id}/submit"
              payload: { idempotency_key: "idem-2" }
              as: OSPDirector
              captures: { err: $.data.error_id }
          assert:
            - "code2 == code1 and v_after_replay == v_after_submit (replay is side-effect-free)"
            - "the submission-packages list contains exactly 1 entry (total_count == 1) and only_pkg == code1"
            - "err == ERR_PROPOSAL_INVALID_STATE (different key on an already-submitted proposal)"

      - name: version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Proposal.fields.version]
        distinguishing_aspect: "create -> PATCH -> budget-line add walks Proposal.version 1 -> 2 -> 3, one increment per mutation including cascaded edits."
        test_recipe:
          setup: ["opportunity, eligible PI"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
          trigger:
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "V", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00 }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id, v1: $.data.version }
            - { call: "PATCH /pre-award/proposals/${prop_id}", payload: { title: "V2" }, as: PI, as_user_id: "${pi_id}", captures: { v2: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "TRAVEL", description: "t", fiscal_year: 2027, amount_cents: 100, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { v3: $.data.version } }
          assert:
            - "v1 == 1 and v2 == 2 and v3 == 3"

      - name: enhanced_scoring_threshold_boundary
        claim_type: rate_threshold_triggers
        grounds: [calculations.subrecipient_risk_score, entities.SubrecipientCommitment.fields.subaward_amount_cents]
        distinguishing_aspect: "The enhanced variant engages exactly at subaward_amount_cents >= 25000000: a 25000000 commitment on a MEDIUM org (40) verifies as 55/ENHANCED, while 24999999 verifies as 40/STANDARD — one cent flips the algorithm variant."
        test_recipe:
          setup: ["opportunity, eligible PI; org NOT_REQUIRED + 4 findings (standard 40, MEDIUM); proposal DRAFT with commitment A 25000000 (ack true) and commitment B 24999999 (ack false)"]
          setup_api_calls:
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/subrecipient-orgs", payload: { legal_name: "Thresh", uei: "UEI-THR1", single_audit_status: "NOT_REQUIRED", audit_finding_count: 4 }, as: SubrecipientManager, captures: { org_id: $.data.id, org_tier: $.data.risk_tier } }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Thresh", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 10.00, fa_base_type: "MTDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /pre-award/proposals/${prop_id}/subrecipient-commitments"
              payload: { subrecipient_org_id: "${org_id}", subaward_amount_cents: 25000000, statement_of_work_received: true, budget_received: true, enhanced_monitoring_acknowledged: true }
              as: PreAwardAnalyst
              captures: { comm_a: $.data.id }
            - call: "POST /pre-award/proposals/${prop_id}/subrecipient-commitments"
              payload: { subrecipient_org_id: "${org_id}", subaward_amount_cents: 24999999, statement_of_work_received: true, budget_received: true, enhanced_monitoring_acknowledged: false }
              as: PreAwardAnalyst
              captures: { comm_b: $.data.id }
          trigger:
            - { call: "POST /pre-award/subrecipient-commitments/${comm_a}/verify", payload: {}, as: SubrecipientManager, captures: { a_score: $.data.verified_risk_snapshot_score, a_mon: $.data.monitoring_level } }
            - { call: "POST /pre-award/subrecipient-commitments/${comm_b}/verify", payload: {}, as: SubrecipientManager, captures: { b_score: $.data.verified_risk_snapshot_score, b_mon: $.data.monitoring_level } }
          assert:
            - "org_tier == MEDIUM (standard variant)"
            - "a_score == 55 and a_mon == ENHANCED (>= 25000000 engages enhanced variant; 40 + 15 tiered HIGH)"
            - "b_score == 40 and b_mon == STANDARD (24999999 stays standard; MEDIUM needs no acknowledgment)"

      - name: jit_budget_amendment_stales_pinned_snapshot
        claim_type: cascading_side_effects
        grounds: [entities.Proposal.fields.pinned_budget_snapshot_id, entities.Proposal.fields.budget_amended_since_approval, "errors[ERR_STALE_BUDGET_SNAPSHOT]", state_machines.Proposal.AWARDED_to_AWARDED]
        distinguishing_aspect: "Version-pinning on approval: a JIT budget amendment (line add + re-finalize in JIT_REQUESTED) supersedes the snapshot pinned at institutional approval, so mark-ready fails ERR_STALE_BUDGET_SNAPSHOT until approve-institutional re-pins from AWARDED; then mark-ready succeeds."
        test_recipe:
          setup: ["proposal SUBMITTED (snapshot pinned at approval); FINAL 54% rate exists"]
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01", initial_status: "FINAL" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Pin", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv1: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv1}" }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/route", payload: {}, as: PreAwardAnalyst, as_user_id: "analyst-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/approve-institutional", payload: {}, as: OSPDirector, as_user_id: "director-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/submit", payload: { idempotency_key: "sub-pin-1" }, as: OSPDirector }
            - { call: "POST /pre-award/proposals/${prop_id}/jit-notices", payload: { sponsor_reference: "NIH-JIT-2", due_in_days: 14 }, as: OSPDirector }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "TRAVEL", description: "jit add", fiscal_year: 2027, amount_cents: 500000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { amended_flag: $.data.budget_amended_since_approval, pv2: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv2}" }, as: PreAwardAnalyst, captures: { s2_idx: $.data.snapshot_index } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv3: $.data.version } }
            - { call: "POST /pre-award/proposals/${prop_id}/negotiation-offers", payload: { expected_proposal_version: "${pv3}", origin: "SPONSOR", offered_total_cents: 16000000 }, as: OSPDirector, captures: { offer_id: $.data.id } }
            - { call: "POST /pre-award/negotiation-offers/${offer_id}/accept", payload: {}, as: OSPDirector }
            - { call: "GET /pre-award/proposals/${prop_id}/award-handoffs", payload: {}, as: OSPDirector, captures: { handoff_id: "$.data[0].id" } }
            - call: "POST /pre-award/award-handoffs/${handoff_id}/mark-ready"
              payload: {}
              as: OSPDirector
              captures: { err: $.data.error_id }
            - { call: "POST /pre-award/proposals/${prop_id}/approve-institutional", payload: {}, as: OSPDirector, as_user_id: "director-1" }
            - call: "POST /pre-award/award-handoffs/${handoff_id}/mark-ready"
              payload: {}
              as: OSPDirector
              captures: { h_status: $.data.status, h_final_indirect: $.data.final_indirect_cents }
          assert:
            - "amended_flag == true and s2_idx == 2 (JIT amendment superseded the pinned snapshot)"
            - "err == ERR_STALE_BUDGET_SNAPSHOT (pinned snapshot 1 is no longer CURRENT)"
            - "h_status == READY after the AWARDED-state re-approval re-pins snapshot 2"
            - "h_final_indirect == 5670000 (FINAL_BASIS on direct 10500000 at 54%)"

      - name: cascading_side_effects_coverage
        claim_type: cascading_side_effects
        grounds: [state_machines.ComplianceReview.PENDING_to_DISAPPROVED, state_machines.FundingOpportunity.PUBLISHED_to_INTAKE_CLOSED]
        excluded_because:
          difficulty_instance: disapprove_cascade_releases_cost_share
          rationale: "N-level cascades are asserted end-to-end by the three §1.8 transitive_cascade instances (disapprove, accept, deadline sweep)."

  # ---------------------------------------------------------------------------
  # Section: consistency_model
  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: finalize_response_matches_immediate_reread
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.indirect_cost]
        distinguishing_aspect: "Immediate consistency: the finalize response's totals equal a same-instant GET of the proposal's computed fields — no lag, no reconciliation pass."
        test_recipe:
          setup: ["opportunity (no cost-share), eligible PI, 54% rate; proposal with PERSONNEL 10000000 and TRAVEL 500000"]
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
              captures: { opp_id: $.data.id }
            - call: "POST /pre-award/principal-investigators"
              payload: { full_name: "P", department_code: "BIO", rank: "FULL", delinquent_report_count: 0 }
              as: OSPSystemAdmin
              captures: { pi_id: $.data.id }
            - { call: "POST /pre-award/fa-rate-agreements", payload: { rate_type: "ON_CAMPUS_RESEARCH", rate_pct: 54.00, effective_start_on: "2026-01-01", effective_end_on: "2029-01-01" }, as: OSPDirector }
            - call: "POST /pre-award/proposals"
              payload: { opportunity_id: "${opp_id}", pi_id: "${pi_id}", title: "Cons", activity_code: "RESEARCH_ON_CAMPUS", project_start_on: "2026-09-01", project_end_on: "2027-08-31", pi_effort_pct: 20.00, fa_base_type: "TDC" }
              as: PI
              as_user_id: "${pi_id}"
              captures: { prop_id: $.data.id }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "PERSONNEL", description: "s", fiscal_year: 2027, amount_cents: 10000000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "POST /pre-award/proposals/${prop_id}/budget-lines", payload: { category: "TRAVEL", description: "t", fiscal_year: 2027, amount_cents: 500000, is_cost_share: false }, as: PreAwardAnalyst }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv: $.data.version } }
          trigger:
            - { call: "POST /pre-award/proposals/${prop_id}/budget-finalizations", payload: { expected_proposal_version: "${pv}" }, as: PreAwardAnalyst, captures: { s_direct: $.data.total_direct_cents, s_indirect: $.data.total_indirect_cents, s_req: $.data.total_request_cents, s_id: $.data.id } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { p_direct: $.data.total_direct_cents, p_indirect: $.data.total_indirect_cents, p_req: $.data.total_request_cents, p_snap: $.data.current_snapshot_id } }
          assert:
            - "s_direct == 10500000 and s_indirect == 5670000 and s_req == 16170000"
            - "p_direct == s_direct and p_indirect == s_indirect and p_req == s_req and p_snap == s_id (write is visible immediately)"
