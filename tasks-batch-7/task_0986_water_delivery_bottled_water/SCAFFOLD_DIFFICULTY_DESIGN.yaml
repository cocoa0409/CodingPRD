      - name: skip_credit_expires_at_boundary
        grounds:
          - state_machines.SkipCredit.PENDING_to_EXPIRED
          - validations[priority=14]
        distinguishing_aspect: |
          Boundary on time metric: SkipCredit.expires_at with strict < comparison
          for the apply precondition. At expires_at exactly, the credit has expired;
          one second before, it is still applicable. Distinct metric (time vs count)
          and distinct endpoint (skip-credits apply vs invoices issue).
        test_recipe:
          setup:
            - "SkipCredit SC1 created at 2026-05-01T00:00:00Z; expires_at = 2026-07-30T00:00:00Z (90 days)"
