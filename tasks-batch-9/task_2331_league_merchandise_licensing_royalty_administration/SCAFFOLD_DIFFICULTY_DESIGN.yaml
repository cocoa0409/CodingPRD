  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: exclusive_territory_grants_half_open_adjacency_and_channel_disjointness
        grounds:
          - validations.priority_35
          - errors.ERR_TERRITORY_EXCLUSIVITY_CONFLICT
          - entities.TerritoryGrant.fields.effective_to
          - entities.TerritoryGrant.fields.channel_class
        distinguishing_aspect: |
          Territory exclusivity is a HALF-OPEN interval test on two dimensions at once.
          A grant starting exactly on the incumbent's effective_to (2026-07-01) is
          ACCEPTED because touching endpoints do not overlap, while a grant starting one
          day earlier (2026-06-30) is REJECTED with ERR_TERRITORY_EXCLUSIVITY_CONFLICT
          — a one-day shift flips the verdict. The same rejected window is then ACCEPTED
          on a different channel_class, proving the check is (territory, channel,
          interval) and not just (territory, interval). Closed-interval semantics reject
          the 2026-07-01 grant; ignoring channel_class rejects the ECOMMERCE grant.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "three ACTIVE licensees LIC_W1 / LIC_W2 / LIC_W3, each with its own EXCLUSIVE DRAFT agreement on category JERSEY, term 2026-01-01..2027-12-31 (grants may be issued before countersignature, so no advance or activation is needed)"
            - "LIC_W1's agreement already holds a GRANTED grant for US / DEPARTMENT over the half-open window [2026-01-01, 2026-07-01)"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Westgate Apparel", contact_email: "ops@westgate.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_w1: $.data.id }
            - call: "POST /licensing/licensees/${lic_w1}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_w1}", category_id: "${cat_jersey}", exclusivity_mode: "EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_w1: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Northline Outfitters", contact_email: "ops@northline.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_w2: $.data.id }
            - call: "POST /licensing/licensees/${lic_w2}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_w2}", category_id: "${cat_jersey}", exclusivity_mode: "EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_w2: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Eastport Sportswear", contact_email: "ops@eastport.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_w3: $.data.id }
            - call: "POST /licensing/licensees/${lic_w3}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements"
              payload: { licensee_id: "${lic_w3}", category_id: "${cat_jersey}", exclusivity_mode: "EXCLUSIVE", minimum_guarantee_cents: 1000000, required_advance_cents: 250000, term_start_date: "2026-01-01", term_end_date: "2027-12-31", central_licensing_flag: false }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_w3: $.data.id }
            - call: "POST /licensing/agreements/${agr_w1}/territory-grants"
              payload: { territory_code: "US", channel_class: "DEPARTMENT", effective_from: "2026-01-01", effective_to: "2026-07-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { grant_w1: $.data.id }
          trigger:
            - call: "POST /licensing/agreements/${agr_w2}/territory-grants"
              payload: { territory_code: "US", channel_class: "DEPARTMENT", effective_from: "2026-07-01", effective_to: "2027-01-01" }
              as: LeagueLicensingManager
