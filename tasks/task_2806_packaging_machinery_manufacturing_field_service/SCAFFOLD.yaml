scenario: |
  2806. Packaging Machinery Manufacturing & Field Service (packaging equipment original equipment
  manufacturer): application engineering with customer product testing and machine configuration
  selection, build-to-order manufacturing with long-lead component procurement and slot scheduling,
  factory acceptance testing with the customer's product and containers before shipment,
  installation, site acceptance testing and operator training with performance guarantee criteria,
  change parts and format kits for new container sizes with lead times, service contracts, remote
  diagnostics and preventive maintenance visits, spare parts stocking recommendations and
  obsolescence notices, warranty claims tied to product variation versus machine defect

domain_name: packaging-machinery-oem
api_prefix: /packaging-oem

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Every entity is a top-level collection under /packaging-oem with explicit FK fields in the
  # request body; no entity is addressed through a nested ownership path. Cross-entity coupling is
  # expressed by FK + state preconditions, not by URL nesting.

  state_machine_shape: parallel
  # MachineOrder carries two independent state dimensions (fulfillment_status x commercial_status);
  # ProductTrial is cyclic (TESTING -> RETEST_REQUIRED -> TESTING); WarrantyClaim is branching
  # fork-join (SUBMITTED -> {PRODUCT_VARIATION_REVIEW, DEFECT_REVIEW} -> ADJUDICATED) with
  # divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic

  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: customer legal entity name
        constraints: "1..120 chars, non-empty after trim"
      - name: region_code
        type: enum
        source: input
        description: service region the customer plant sits in; must match FieldEngineer.region_code for on-site visits
        constraints: "one of {NA, EU, APAC, LATAM}"
      - name: product_variation_pct
        type: number
        source: input
        description: |
          contractually declared run-to-run variation of the customer's own product/containers,
          in percent. Derates the nameplate rate under the PRODUCT_ADJUSTED guarantee basis and
          drives warranty cause attribution.
        constraints: "0.00 <= product_variation_pct <= 40.00, 2 decimals"
      - name: status
        type: enum
        source: system
        description: customer account state
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: open_order_count
        type: integer
        source: computed
        description: count of MachineOrder rows for this customer whose fulfillment_status NOT IN {ACCEPTED, CANCELLED}

  - name: MachineModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: OEM catalog code
        constraints: "unique across MachineModel, 3..32 chars"
      - name: machine_family
        type: enum
        source: input
        description: functional family of the machine
        constraints: "one of {FILLER, CAPPER, LABELER, CARTONER}"
      - name: nameplate_rate_cpm
        type: integer
        source: input
        description: catalog nameplate throughput in containers per minute at spec product
        constraints: ">= 1"
      - name: guarantee_efficiency_pct
        type: number
        source: input
        description: contractual efficiency floor used by the performance guarantee test (attainment threshold)
        constraints: "50.00 <= guarantee_efficiency_pct <= 100.00, 2 decimals"
      - name: base_price_cents
        type: integer
        source: input
        description: catalog equipment list price in cents
        constraints: ">= 0"
      - name: min_container_diameter_mm
        type: integer
        source: input
        description: smallest container diameter the base machine handles without a format kit
        constraints: ">= 1"
      - name: max_container_diameter_mm
        type: integer
        source: input
        description: largest container diameter the base machine handles without a format kit
        constraints: ">= min_container_diameter_mm"
      - name: lifecycle_status
        type: enum
        source: system
        description: catalog lifecycle; OBSOLETE models cannot back new MachineOrder rows
        default: ACTIVE
        constraints: "one of {ACTIVE, OBSOLETE}"
      - name: open_defect_review_count
        type: integer
        source: computed
        description: |
          count of WarrantyClaim rows with defect_review_done == true whose installed_machine_id
          resolves to an InstalledMachine whose machine_order_id resolves to a MachineOrder with
          machine_model_id == this model; incremented by the DEFECT branch of the claim fork
        default: 0

  - name: ProductTrial
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; the customer whose product is being trialled"
      - name: machine_model_id
        type: string
        source: input
        description: "FK -> MachineModel.id; candidate model under evaluation"
      - name: product_name
        type: string
        source: input
        description: customer product designation used on the trial report
        constraints: "1..80 chars"
      - name: container_family
        type: string
        source: input
        description: container format family code (e.g. PET-500, GLASS-330) the trial ran with
        constraints: "1..32 chars"
      - name: container_diameter_mm
        type: integer
        source: input
        description: container diameter of the trialled container
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: application-engineering trial state
        default: SUBMITTED
        constraints: "one of {SUBMITTED, TESTING, RETEST_REQUIRED, PASSED, REJECTED}"
      - name: retest_count
        type: integer
        source: system
        description: number of times the trial re-entered TESTING from RETEST_REQUIRED
        default: 0
        constraints: ">= 0; a third retest is refused (MAX_RETESTS = 2)"
      - name: measured_rate_cpm
        type: integer
        source: input
        description: throughput measured on the trial rig with the customer's product, in containers per minute
        constraints: ">= 0; supplied on each result submission"
      - name: config_recommendation
        type: enum
        source: computed
        description: |
          machine configuration selection derived from measured_rate_cpm vs MachineModel.nameplate_rate_cpm
          and Customer.product_variation_pct (see calculations.trial_config_recommendation)
        default: PENDING
        constraints: "one of {PENDING, STANDARD, HEAVY_DUTY, NOT_FEASIBLE}"
      - name: rate_ratio_pct
        type: number
        source: computed
        description: measured_rate_cpm / MachineModel.nameplate_rate_cpm * 100, 2 decimals, round_half_up

  - name: MachineOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; buyer of the machine"
      - name: machine_model_id
        type: string
        source: input
        description: "FK -> MachineModel.id; configured base model"
      - name: product_trial_id
        type: string
        source: input
        description: "FK -> ProductTrial.id; the PASSED application-engineering trial this order is engineered from"
      - name: fulfillment_status
        type: enum
        source: system
        description: build/ship/accept dimension of the order (independent of commercial_status)
        default: DRAFT
        constraints: "one of {DRAFT, ENGINEERED, SLOTTED, IN_BUILD, FAT_PASSED, FAT_FAILED, SHIPPED, INSTALLED, ACCEPTED, CANCELLED}"
      - name: commercial_status
        type: enum
        source: system
        description: money dimension of the order (independent of fulfillment_status)
        default: QUOTED
        constraints: "one of {QUOTED, PO_RECEIVED, INVOICED, PAID, WRITTEN_OFF}"
      - name: guarantee_basis
        type: enum
        source: input
        description: |
          which performance-guarantee algorithm the site acceptance test is scored under; pinned on
          the order at creation and never mutated
        default: NAMEPLATE
        constraints: "one of {NAMEPLATE, PRODUCT_ADJUSTED}"
      - name: equipment_price_cents
        type: integer
        source: input
        description: negotiated equipment price in cents (may differ from MachineModel.base_price_cents)
        constraints: ">= 0"
      - name: change_parts_price_cents
        type: integer
        source: input
        description: price in cents of change parts sold inside the original order
        default: 0
        constraints: ">= 0"
      - name: discount_tier
        type: enum
        source: computed
        description: volume tier selected from the pre-fee subtotal (see calculations.order_total_rollup)
        default: NONE
        constraints: "one of {NONE, T1, T2, T3}"
      - name: commissioning_fee_cents
        type: integer
        source: computed
        description: installation + training fee in cents, derived from discount_tier (see calculations.order_total_rollup)
        default: 0
      - name: order_total_cents
        type: integer
        source: computed
        description: equipment_price_cents + change_parts_price_cents + commissioning_fee_cents (evaluation order pinned in calculations.order_total_rollup)
        default: 0
      - name: rework_days
        type: integer
        source: system
        description: cumulative build days added by FAT failures; feeds BuildSlot end_date extension
        default: 0
        constraints: ">= 0"
      - name: fat_failure_count
        type: integer
        source: system
        description: number of FAT AcceptanceTest rows on this order whose status is FAILED
        default: 0
        constraints: ">= 0; a third FAT failure forces fulfillment_status CANCELLED"

  - name: ProductionLine
    parent: null
    common_fields: true
    fields:
      - name: line_code
        type: string
        source: input
        description: factory production line code
        constraints: "unique across ProductionLine, 2..24 chars"
      - name: machine_family
        type: enum
        source: input
        description: the only machine_family this line can build
        constraints: "one of {FILLER, CAPPER, LABELER, CARTONER}"
      - name: changeover_buffer_days
        type: integer
        source: input
        description: mandatory idle days appended to every occupied slot before the next slot may start
        constraints: ">= 0"
      - name: capacity_days_per_quarter
        type: integer
        source: input
        description: build-day budget the line may commit per rolling booking horizon
        constraints: ">= 1"
      - name: committed_slot_days
        type: integer
        source: computed
        description: |
          sum of BuildSlot.slot_days for slots on this line whose status IN
          {RESERVED, CONFIRMED, IN_BUILD, REWORK_HOLD}; conserved-quantity ledger
        default: 0
      - name: status
        type: enum
        source: system
        description: line availability
        default: OPEN
        constraints: "one of {OPEN, MAINTENANCE}"

  - name: BuildSlot
    parent: null
    common_fields: true
    fields:
      - name: machine_order_id
        type: string
        source: input
        description: "FK -> MachineOrder.id; the order this slot builds"
      - name: production_line_id
        type: string
        source: input
        description: "FK -> ProductionLine.id; the line the slot occupies"
      - name: start_date
        type: string
        source: input
        description: first build day, ISO 8601 date (inclusive)
        constraints: "YYYY-MM-DD"
      - name: end_date
        type: string
        source: system
        description: exclusive end of the occupied interval, ISO 8601 date; initialised to start_date + slot_days
        constraints: "YYYY-MM-DD; interval is half-open [start_date, end_date)"
      - name: requested_slot_days
        type: integer
        source: input
        description: build days requested by production planning
        constraints: ">= 1"
      - name: slot_days
        type: integer
        source: computed
        description: requested_slot_days + MachineOrder.rework_days at the time of the last recompute
      - name: status
        type: enum
        source: system
        description: slot lifecycle
        default: RESERVED
        constraints: "one of {RESERVED, CONFIRMED, IN_BUILD, REWORK_HOLD, DISPLACED, RELEASED, COMPLETED}"
      - name: superseded_by_slot_id
        type: string
        source: system
        description: "FK -> BuildSlot.id; set on a RELEASED slot when a replacement slot supersedes it"
        default: null

  - name: LongLeadComponent
    parent: null
    common_fields: true
    fields:
      - name: machine_order_id
        type: string
        source: input
        description: "FK -> MachineOrder.id; the order this procurement line belongs to"
      - name: part_number
        type: string
        source: input
        description: supplier part number
        constraints: "1..40 chars"
      - name: lead_time_days
        type: integer
        source: input
        description: quoted supplier lead time in days from purchase-order release
        constraints: ">= 0"
      - name: po_released_on
        type: string
        source: system
        description: ISO 8601 date the purchase order was released; null until release
        default: null
      - name: promised_date
        type: string
        source: computed
        description: po_released_on + lead_time_days, ISO 8601 date; null until release
        default: null
      - name: status
        type: enum
        source: system
        description: procurement state
        default: PLANNED
        constraints: "one of {PLANNED, ON_ORDER, RECEIVED}"

  - name: AcceptanceTest
    parent: null
    common_fields: true
    fields:
      - name: machine_order_id
        type: string
        source: input
        description: "FK -> MachineOrder.id; the order under test"
      - name: kind
        type: enum
        source: input
        description: FAT runs at the factory before shipment, SAT runs on the customer site after installation
        constraints: "one of {FAT, SAT}"
      - name: scheduled_on
        type: string
        source: input
        description: ISO 8601 date the test is booked for
        constraints: "YYYY-MM-DD"
      - name: customer_product_supplied
        type: boolean
        source: input
        description: whether the customer's own product was supplied for the run
        default: false
      - name: containers_supplied_count
        type: integer
        source: input
        description: number of the customer's own containers supplied for the run
        default: 0
        constraints: ">= 0"
      - name: measured_rate_cpm
        type: integer
        source: input
        description: throughput measured during the run, containers per minute; supplied at finalize
        default: 0
        constraints: ">= 0"
      - name: measured_efficiency_pct
        type: number
        source: input
        description: measured mechanical efficiency during the run in percent; supplied at finalize
        default: 0
        constraints: "0.00 <= measured_efficiency_pct <= 100.00, 2 decimals"
      - name: operators_trained_count
        type: integer
        source: input
        description: operators signed off in the training log; only meaningful for kind == SAT
        default: 0
        constraints: ">= 0"
      - name: required_operators_trained
        type: integer
        source: input
        description: operator-training headcount the contract demands for SAT sign-off
        default: 0
        constraints: ">= 0"
      - name: attainment_pct
        type: number
        source: computed
        description: performance-guarantee attainment in percent (see calculations.guarantee_attainment)
        default: 0
      - name: guarantee_met
        type: boolean
        source: computed
        description: attainment_pct >= MachineModel.guarantee_efficiency_pct
        default: false
      - name: status
        type: enum
        source: system
        description: test lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_PROGRESS, PASSED, FAILED}"

  - name: InstalledMachine
    parent: null
    common_fields: true
    fields:
      - name: machine_order_id
        type: string
        source: input
        description: "FK -> MachineOrder.id; the order that produced this machine"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; owner of the installed asset"
      - name: serial_number
        type: string
        source: input
        description: OEM serial number stamped at installation
        constraints: "unique across InstalledMachine, 4..32 chars"
      - name: current_format_family
        type: string
        source: system
        description: container family the machine is currently set up for; updated when a FormatKit is delivered
      - name: remote_diagnostics_enabled
        type: boolean
        source: input
        description: whether the machine streams telemetry for remote diagnostic visits
        default: false
      - name: status
        type: enum
        source: system
        description: asset lifecycle
        default: INSTALLED
        constraints: "one of {INSTALLED, ACCEPTED}"
      - name: open_claim_count
        type: integer
        source: computed
        description: count of WarrantyClaim rows on this machine whose status IN {SUBMITTED, PRODUCT_VARIATION_REVIEW, DEFECT_REVIEW}

  - name: FormatKit
    parent: null
    common_fields: true
    fields:
      - name: installed_machine_id
        type: string
        source: input
        description: "FK -> InstalledMachine.id; the machine the change parts are cut for"
      - name: container_family
        type: string
        source: input
        description: new container family the kit enables
        constraints: "1..32 chars"
      - name: container_diameter_mm
        type: integer
        source: input
        description: container diameter the kit enables
        constraints: ">= 1"
      - name: components
        type: array
        source: input
        description: |
          change-part component lines; each element is
          { part_number: string, lead_time_days: integer >= 0, unit_price_cents: integer >= 0, qty: integer >= 1 }
        default: []
      - name: component_count
        type: integer
        source: computed
        description: number of elements in components
        default: 0
      - name: quoted_lead_time_days
        type: integer
        source: computed
        description: kit delivery lead time in days (see calculations.format_kit_lead_time)
        default: 0
      - name: price_cents
        type: integer
        source: computed
        description: kit price in cents (see calculations.format_kit_price)
        default: 0
      - name: status
        type: enum
        source: system
        description: kit lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, QUOTED, ORDERED, DELIVERED}"

  - name: ServiceContract
    parent: null
    common_fields: true
    fields:
      - name: installed_machine_id
        type: string
        source: input
        description: "FK -> InstalledMachine.id; the covered asset"
      - name: tier
        type: enum
        source: input
        description: coverage tier; drives goodwill split and PM entitlement
        constraints: "one of {BRONZE, SILVER, GOLD}"
      - name: start_date
        type: string
        source: input
        description: first covered day, ISO 8601 date (inclusive)
        constraints: "YYYY-MM-DD"
      - name: end_date
        type: string
        source: input
        description: last covered day, ISO 8601 date (inclusive)
        constraints: "YYYY-MM-DD; end_date > start_date"
      - name: pm_visits_included
        type: integer
        source: input
        description: preventive-maintenance visits included in the contract fee
        constraints: ">= 0"
      - name: pm_visits_used
        type: integer
        source: computed
        description: count of PreventiveMaintenanceVisit rows on this contract whose status IN {SCHEDULED, BILLABLE_HOLD, COMPLETED} and visit_type == PM
        default: 0
      - name: goodwill_budget_initial_cents
        type: integer
        source: input
        description: goodwill pot in cents the OEM may absorb on this contract over its term
        constraints: ">= 0"
      - name: goodwill_budget_cents
        type: integer
        source: computed
        description: |
          remaining goodwill pot in cents; conserved-quantity ledger, always equal to
          goodwill_budget_initial_cents - sum(WarrantyClaim.goodwill_charged_cents for claims on this
          contract whose status == ADJUDICATED)
        default: 0
        constraints: ">= 0"
      - name: coverage_posture
        type: enum
        source: computed
        description: |
          derived gate over child service operations; OPEN while goodwill_budget_cents > RESTRICT_THRESHOLD_CENTS,
          RESTRICTED while 0 < goodwill_budget_cents <= RESTRICT_THRESHOLD_CENTS, BUDGET_EXHAUSTED at exactly 0
        default: OPEN
        constraints: "one of {OPEN, RESTRICTED, BUDGET_EXHAUSTED}"
      - name: status
        type: enum
        source: system
        description: contract lifecycle
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, EXPIRED, TERMINATED}"

  - name: FieldEngineer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: engineer name
        constraints: "1..80 chars"
      - name: region_code
        type: enum
        source: input
        description: region the engineer may be dispatched in for on-site visits
        constraints: "one of {NA, EU, APAC, LATAM}"
      - name: certifications
        type: array
        source: input
        description: array of machine_family strings the engineer is certified on (e.g. ["FILLER","CAPPER"])
        default: []
      - name: travel_buffer_minutes
        type: integer
        source: input
        description: informational travel allowance recorded on the engineer record; not used in overlap arithmetic
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: dispatch availability
        default: AVAILABLE
        constraints: "one of {AVAILABLE, ON_LEAVE}"

  - name: PreventiveMaintenanceVisit
    parent: null
    common_fields: true
    fields:
      - name: service_contract_id
        type: string
        source: input
        description: "FK -> ServiceContract.id; contract the visit is booked under"
      - name: field_engineer_id
        type: string
        source: input
        description: "FK -> FieldEngineer.id; engineer occupying the window; null for REMOTE_DIAGNOSTIC visits"
        default: null
      - name: visit_type
        type: enum
        source: input
        description: PM = scheduled preventive maintenance, REMOTE_DIAGNOSTIC = telemetry session, CORRECTIVE = breakdown call
        constraints: "one of {PM, REMOTE_DIAGNOSTIC, CORRECTIVE}"
      - name: start_ts
        type: datetime
        source: input
        description: window start, ISO 8601 UTC with three fractional digits (inclusive endpoint)
      - name: end_ts
        type: datetime
        source: input
        description: window end, ISO 8601 UTC with three fractional digits (inclusive endpoint); end_ts > start_ts
      - name: status
        type: enum
        source: system
        description: visit lifecycle
        default: SCHEDULED
        constraints: "one of {SCHEDULED, BILLABLE_HOLD, COMPLETED, CANCELLED}"
      - name: billable
        type: boolean
        source: computed
        description: true when the visit consumes no contract entitlement and must be invoiced (see calculations.pm_visit_billability)
        default: false
      - name: findings_code
        type: enum
        source: input
        description: outcome code recorded at completion
        default: NONE
        constraints: "one of {NONE, OK, WEAR_FOUND, FAULT_FOUND}"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - name: installed_machine_id
        type: string
        source: input
        description: "FK -> InstalledMachine.id; the machine the failure occurred on"
      - name: service_contract_id
        type: string
        source: input
        description: "FK -> ServiceContract.id; contract whose goodwill pot funds any OEM share"
      - name: failure_summary
        type: string
        source: input
        description: short description of the failure
        constraints: "1..200 chars"
      - name: claimed_cost_cents
        type: integer
        source: computed
        description: sum of WarrantyClaimLine.amount_cents for lines on this claim
        default: 0
      - name: product_variation_review_done
        type: boolean
        source: system
        description: PRODUCT_VARIATION branch of the fork has been signed off
        default: false
      - name: defect_review_done
        type: boolean
        source: system
        description: DEFECT branch of the fork has been signed off
        default: false
      - name: cause
        type: enum
        source: computed
        description: adjudicated root-cause classification (see calculations.claim_cause_classification)
        default: UNDETERMINED
        constraints: "one of {UNDETERMINED, PRODUCT_VARIATION, MACHINE_DEFECT, MIXED}"
      - name: oem_share_cents
        type: integer
        source: computed
        description: OEM-borne share in cents (see calculations.claim_cost_apportionment)
        default: 0
      - name: customer_share_cents
        type: integer
        source: computed
        description: customer-borne share in cents; oem_share_cents + customer_share_cents == claimed_cost_cents
        default: 0
      - name: goodwill_charged_cents
        type: integer
        source: computed
        description: portion of oem_share_cents debited from ServiceContract.goodwill_budget_cents at adjudication
        default: 0
      - name: status
        type: enum
        source: system
        description: claim lifecycle (branching fork-join)
        default: SUBMITTED
        constraints: "one of {SUBMITTED, PRODUCT_VARIATION_REVIEW, DEFECT_REVIEW, ADJUDICATED, REJECTED, VOID}"

  - name: WarrantyClaimLine
    parent: null
    common_fields: false
    fields:
      - name: warranty_claim_id
        type: string
        source: input
        description: "FK -> WarrantyClaim.id; parent claim"
      - name: line_label
        type: string
        source: input
        description: cost line label (labour, part, freight, ...)
        constraints: "1..60 chars"
      - name: amount_cents
        type: integer
        source: input
        description: line cost in cents
        constraints: ">= 1"
      - name: defect_attribution_pct
        type: number
        source: input
        description: share of this line attributed to machine defect (vs the customer's product variation), in percent
        constraints: "0.00 <= defect_attribution_pct <= 100.00, 2 decimals"
      - name: oem_line_share_cents
        type: integer
        source: computed
        description: per-line OEM share in cents, rounded to whole cents before summation (see calculations.claim_cost_apportionment)
        default: 0

  - name: StockingRecommendation
    parent: null
    common_fields: true
    fields:
      - name: installed_machine_id
        type: string
        source: input
        description: "FK -> InstalledMachine.id; machine the spares list is cut for"
      - name: part_number
        type: string
        source: input
        description: spare part number
        constraints: "1..40 chars"
      - name: annual_usage_qty
        type: integer
        source: input
        description: observed or estimated annual consumption quantity
        constraints: ">= 0"
      - name: unit_lead_time_days
        type: integer
        source: input
        description: replenishment lead time in days for this part
        constraints: ">= 0"
      - name: criticality
        type: enum
        source: input
        description: line-stop criticality class of the part
        constraints: "one of {A, B, C}"
      - name: obsolescence_status
        type: enum
        source: system
        description: obsolescence notice state published by the OEM for this part
        default: ACTIVE
        constraints: "one of {ACTIVE, NOTICE_ISSUED, LAST_TIME_BUY, OBSOLETE}"
      - name: basis
        type: enum
        source: input
        description: which stocking algorithm produced recommended_qty
        constraints: "one of {LEAD_TIME_DEMAND, SERVICE_LEVEL}"
      - name: recommended_qty
        type: integer
        source: computed
        description: recommended shelf quantity (see calculations.spare_stocking_qty)
        default: 0
      - name: status
        type: enum
        source: system
        description: recommendation lifecycle; a newer recommendation for the same machine supersedes the prior ACTIVE one
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED}"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: ProductTrial
    initial_state: SUBMITTED
    terminal_states: [PASSED, REJECTED]
    note: |
      Cyclic shape: TESTING -> RETEST_REQUIRED -> TESTING. The loop is bounded by
      MAX_TRIAL_RETESTS = 2; the third RETEST request is refused.
    transitions:
      - from: SUBMITTED
        to: TESTING
        trigger: "POST /packaging-oem/product-trials/{productTrialId}/start-testing"
        actor: ApplicationEngineer
        preconditions:
          - "ProductTrial.status == SUBMITTED"
          - "Customer.status == ACTIVE for ProductTrial.customer_id"
          - "MachineModel.lifecycle_status == ACTIVE for ProductTrial.machine_model_id"
          - "MachineModel.min_container_diameter_mm <= ProductTrial.container_diameter_mm <= MachineModel.max_container_diameter_mm"
        side_effects:
          - "ProductTrial.updated_at refreshed and ProductTrial.version incremented by 1"
      - from: RETEST_REQUIRED
        to: TESTING
        trigger: "POST /packaging-oem/product-trials/{productTrialId}/start-testing"
        actor: ApplicationEngineer
        preconditions:
          - "ProductTrial.status == RETEST_REQUIRED"
          - "ProductTrial.retest_count < MAX_TRIAL_RETESTS (2)"
        side_effects:
          - "ProductTrial.retest_count incremented by 1"
          - "ProductTrial.version incremented by 1"
        note: "the cycle edge; retest_count is the loop counter and never resets"
      - from: TESTING
        to: PASSED
        trigger: "POST /packaging-oem/product-trials/{productTrialId}/record-result with outcome == PASS"
        actor: ApplicationEngineer
        preconditions:
          - "ProductTrial.status == TESTING"
          - "computed config_recommendation != NOT_FEASIBLE (see calculations.trial_config_recommendation)"
        side_effects:
          - "ProductTrial.measured_rate_cpm set from the request body"
          - "ProductTrial.rate_ratio_pct recomputed (calculations.trial_config_recommendation)"
          - "ProductTrial.config_recommendation recomputed to STANDARD or HEAVY_DUTY"
      - from: TESTING
        to: RETEST_REQUIRED
        trigger: "POST /packaging-oem/product-trials/{productTrialId}/record-result with outcome == RETEST"
        actor: ApplicationEngineer
        preconditions:
          - "ProductTrial.status == TESTING"
          - "ProductTrial.retest_count < MAX_TRIAL_RETESTS (2)"
        side_effects:
          - "ProductTrial.measured_rate_cpm set from the request body"
          - "ProductTrial.rate_ratio_pct and config_recommendation recomputed"
      - from: TESTING
        to: REJECTED
        trigger: "POST /packaging-oem/product-trials/{productTrialId}/record-result with outcome == REJECT"
        actor: ApplicationEngineer
        preconditions:
          - "ProductTrial.status == TESTING"
        side_effects:
          - "ProductTrial.measured_rate_cpm set from the request body"
          - "ProductTrial.config_recommendation set to NOT_FEASIBLE"
      - from: RETEST_REQUIRED
        to: REJECTED
        trigger: "POST /packaging-oem/product-trials/{productTrialId}/record-result with outcome == REJECT"
        actor: ApplicationEngineer
        preconditions:
          - "ProductTrial.status == RETEST_REQUIRED"
        side_effects:
          - "ProductTrial.config_recommendation set to NOT_FEASIBLE"

  - entity: MachineOrder
    dimension: fulfillment_status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, CANCELLED]
    note: |
      Parallel dimension 1 of 2 on MachineOrder. fulfillment_status and commercial_status advance
      independently; several transitions in each dimension are guarded by the other dimension's
      current value, but neither dimension's transition ever mutates the other.
    transitions:
      - from: DRAFT
        to: ENGINEERED
        trigger: "POST /packaging-oem/machine-orders/{machineOrderId}/engineer"
        actor: ApplicationEngineer
        preconditions:
          - "MachineOrder.fulfillment_status == DRAFT"
          - "ProductTrial.status == PASSED for MachineOrder.product_trial_id"
          - "ProductTrial.customer_id == MachineOrder.customer_id"
          - "ProductTrial.machine_model_id == MachineOrder.machine_model_id"
          - "MachineModel.lifecycle_status == ACTIVE"
        side_effects:
          - "MachineOrder.discount_tier, commissioning_fee_cents and order_total_cents computed by calculations.order_total_rollup"
          - "Customer.open_order_count recomputed"
      - from: ENGINEERED
        to: SLOTTED
        trigger: "system side effect of POST /packaging-oem/build-slots/{buildSlotId}/confirm"
        actor: system
        preconditions:
          - "MachineOrder.fulfillment_status == ENGINEERED"
        side_effects:
          - "MachineOrder.version incremented by 1"
        note: "bubble-up from BuildSlot; the order never advances to SLOTTED on its own"
      - from: SLOTTED
        to: IN_BUILD
        trigger: "system side effect of POST /packaging-oem/build-slots/{buildSlotId}/start-build"
        actor: system
        preconditions:
          - "MachineOrder.fulfillment_status == SLOTTED"
        side_effects:
          - "MachineOrder.version incremented by 1"
      - from: FAT_FAILED
        to: IN_BUILD
        trigger: "system side effect of POST /packaging-oem/build-slots/{buildSlotId}/start-build on the REWORK_HOLD slot"
        actor: system
        preconditions:
          - "MachineOrder.fulfillment_status == FAT_FAILED"
          - "BuildSlot.status == REWORK_HOLD for the slot named in the request path"
        side_effects:
          - "MachineOrder.version incremented by 1"
        note: "rework cycle edge in the fulfillment dimension"
      - from: IN_BUILD
        to: FAT_PASSED
        trigger: "system side effect of POST /packaging-oem/acceptance-tests/{acceptanceTestId}/finalize where kind == FAT and guarantee_met == true"
        actor: system
        preconditions:
          - "MachineOrder.fulfillment_status == IN_BUILD"
        side_effects:
          - "the order's BuildSlot in status IN_BUILD transitions to COMPLETED"
          - "ProductionLine.committed_slot_days recomputed for that slot's line (COMPLETED slots leave the committed set)"
      - from: IN_BUILD
        to: FAT_FAILED
        trigger: "system side effect of POST /packaging-oem/acceptance-tests/{acceptanceTestId}/finalize where kind == FAT and guarantee_met == false"
        actor: system
        preconditions:
          - "MachineOrder.fulfillment_status == IN_BUILD"
        side_effects:
          - "MachineOrder.fat_failure_count incremented by 1"
          - "MachineOrder.rework_days increased by REWORK_DAYS_PER_FAT_FAILURE (7)"
          - "cascade hop 2: the order's IN_BUILD BuildSlot transitions to REWORK_HOLD and its slot_days/end_date are recomputed from the new rework_days"
          - "cascade hop 3: that slot's ProductionLine.committed_slot_days is recomputed, and every later slot on the same line whose start_date now falls inside [slot.start_date, slot.end_date + changeover_buffer_days) transitions RESERVED|CONFIRMED -> DISPLACED"
          - "cascade hop 4: each DISPLACED slot leaves the committed set, so ProductionLine.committed_slot_days is recomputed again after the displacement sweep"
          - "if MachineOrder.fat_failure_count reaches MAX_FAT_FAILURES (3), MachineOrder.fulfillment_status is set to CANCELLED instead of FAT_FAILED and the order's REWORK_HOLD/IN_BUILD slot is RELEASED"
      - from: FAT_PASSED
        to: SHIPPED
        trigger: "POST /packaging-oem/machine-orders/{machineOrderId}/ship"
        actor: ProductionPlanner
        preconditions:
          - "MachineOrder.fulfillment_status == FAT_PASSED"
          - "every LongLeadComponent with machine_order_id == MachineOrder.id has status == RECEIVED"
          - "MachineOrder.commercial_status IN {PO_RECEIVED, INVOICED, PAID}"
        side_effects:
          - "MachineOrder.version incremented by 1"
      - from: SHIPPED
        to: INSTALLED
        trigger: "system side effect of POST /packaging-oem/installed-machines"
        actor: system
        preconditions:
          - "MachineOrder.fulfillment_status == SHIPPED"
        side_effects:
          - "InstalledMachine row created in status INSTALLED with current_format_family = ProductTrial.container_family of the order's trial"
      - from: INSTALLED
        to: ACCEPTED
        trigger: "system side effect of POST /packaging-oem/acceptance-tests/{acceptanceTestId}/finalize where kind == SAT and guarantee_met == true and operators_trained_count >= required_operators_trained"
        actor: system
        preconditions:
          - "MachineOrder.fulfillment_status == INSTALLED"
        side_effects:
          - "the InstalledMachine for this order transitions INSTALLED -> ACCEPTED"
          - "Customer.open_order_count recomputed"

  - entity: MachineOrder
    dimension: commercial_status
    initial_state: QUOTED
    terminal_states: [PAID, WRITTEN_OFF]
    note: "Parallel dimension 2 of 2 on MachineOrder; advanced only by POST /machine-orders/{id}/commercial-advance."
    transitions:
      - from: QUOTED
        to: PO_RECEIVED
        trigger: "POST /packaging-oem/machine-orders/{machineOrderId}/commercial-advance with target_status == PO_RECEIVED"
        actor: PlatformAdmin
        preconditions:
          - "MachineOrder.commercial_status == QUOTED"
          - "MachineOrder.fulfillment_status NOT IN {DRAFT, CANCELLED}"
        side_effects:
          - "MachineOrder.version incremented by 1"
      - from: PO_RECEIVED
        to: INVOICED
        trigger: "POST /packaging-oem/machine-orders/{machineOrderId}/commercial-advance with target_status == INVOICED"
        actor: PlatformAdmin
        preconditions:
          - "MachineOrder.commercial_status == PO_RECEIVED"
          - "MachineOrder.fulfillment_status IN {FAT_PASSED, SHIPPED, INSTALLED, ACCEPTED}"
        side_effects:
          - "MachineOrder.version incremented by 1"
      - from: INVOICED
        to: PAID
        trigger: "POST /packaging-oem/machine-orders/{machineOrderId}/commercial-advance with target_status == PAID"
        actor: PlatformAdmin
        preconditions:
          - "MachineOrder.commercial_status == INVOICED"
        side_effects:
          - "MachineOrder.version incremented by 1"
      - from: INVOICED
        to: WRITTEN_OFF
        trigger: "POST /packaging-oem/machine-orders/{machineOrderId}/commercial-advance with target_status == WRITTEN_OFF"
        actor: PlatformAdmin
        preconditions:
          - "MachineOrder.commercial_status == INVOICED"
        side_effects:
          - "MachineOrder.version incremented by 1"

  - entity: BuildSlot
    initial_state: RESERVED
    terminal_states: [RELEASED, COMPLETED, DISPLACED]
    transitions:
      - from: null
        to: RESERVED
        trigger: "POST /packaging-oem/build-slots"
        actor: ProductionPlanner
        preconditions:
          - "MachineOrder.fulfillment_status == ENGINEERED for machine_order_id"
          - "ProductionLine.status == OPEN"
          - "ProductionLine.machine_family == MachineModel.machine_family of the order's model"
          - "request body carries expected_machine_order_version equal to MachineOrder.version"
          - "no LongLeadComponent of this order has status == PLANNED (all purchase orders released)"
          - "start_date >= max(LongLeadComponent.promised_date) over the order's components (calculations.slot_earliest_start)"
          - "no overlap with another slot on the same line under buffer-extended half-open arithmetic (validations priority 47, ERR_SLOT_OVERLAP)"
          - "ProductionLine.committed_slot_days + slot_days <= ProductionLine.capacity_days_per_quarter"
        side_effects:
          - "BuildSlot.slot_days computed as requested_slot_days + MachineOrder.rework_days"
          - "BuildSlot.end_date computed as start_date + slot_days days (half-open interval)"
          - "any existing BuildSlot of the same machine_order_id in status RESERVED transitions to RELEASED with superseded_by_slot_id set to the new slot id"
          - "ProductionLine.committed_slot_days recomputed for the line (new slot enters the committed set, any superseded slot leaves it)"
          - "MachineOrder.version incremented by 1"
      - from: RESERVED
        to: CONFIRMED
        trigger: "POST /packaging-oem/build-slots/{buildSlotId}/confirm"
        actor: ProductionPlanner
        preconditions:
          - "BuildSlot.status == RESERVED"
          - "MachineOrder.fulfillment_status == ENGINEERED"
          - "MachineOrder.commercial_status IN {PO_RECEIVED, INVOICED, PAID}"
          - "ProductionLine.status == OPEN"
        side_effects:
          - "cascade hop 2: MachineOrder.fulfillment_status ENGINEERED -> SLOTTED"
          - "ProductionLine.committed_slot_days unchanged (RESERVED and CONFIRMED are both committed states)"
      - from: CONFIRMED
        to: IN_BUILD
        trigger: "POST /packaging-oem/build-slots/{buildSlotId}/start-build"
        actor: ProductionPlanner
        preconditions:
          - "BuildSlot.status == CONFIRMED"
          - "MachineOrder.fulfillment_status == SLOTTED"
          - "every LongLeadComponent of the order has status == RECEIVED"
        side_effects:
          - "cascade hop 2: MachineOrder.fulfillment_status SLOTTED -> IN_BUILD"
      - from: REWORK_HOLD
        to: IN_BUILD
        trigger: "POST /packaging-oem/build-slots/{buildSlotId}/start-build"
        actor: ProductionPlanner
        preconditions:
          - "BuildSlot.status == REWORK_HOLD"
          - "MachineOrder.fulfillment_status == FAT_FAILED"
        side_effects:
          - "cascade hop 2: MachineOrder.fulfillment_status FAT_FAILED -> IN_BUILD"
        note: "rework cycle edge on BuildSlot"
      - from: IN_BUILD
        to: REWORK_HOLD
        trigger: "system side effect of a failed FAT finalize (see MachineOrder IN_BUILD -> FAT_FAILED)"
        actor: system
        preconditions:
          - "BuildSlot.status == IN_BUILD"
        side_effects:
          - "BuildSlot.slot_days recomputed as requested_slot_days + MachineOrder.rework_days"
          - "BuildSlot.end_date recomputed as start_date + slot_days days"
          - "ProductionLine.committed_slot_days recomputed"
          - "later slots on the same line colliding with the extended interval transition to DISPLACED"
      - from: IN_BUILD
        to: COMPLETED
        trigger: "system side effect of a passed FAT finalize (see MachineOrder IN_BUILD -> FAT_PASSED)"
        actor: system
        preconditions:
          - "BuildSlot.status == IN_BUILD"
        side_effects:
          - "ProductionLine.committed_slot_days recomputed (COMPLETED leaves the committed set)"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /packaging-oem/build-slots/{buildSlotId}/release"
        actor: ProductionPlanner
        preconditions:
          - "BuildSlot.status == RESERVED"
        side_effects:
          - "ProductionLine.committed_slot_days recomputed (compensating credit of exactly slot_days)"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /packaging-oem/build-slots/{buildSlotId}/release"
        actor: ProductionPlanner
        preconditions:
          - "BuildSlot.status == CONFIRMED"
        side_effects:
          - "ProductionLine.committed_slot_days recomputed (compensating credit of exactly slot_days)"
          - "MachineOrder.fulfillment_status SLOTTED -> ENGINEERED (the order loses its slot)"
      - from: RESERVED
        to: DISPLACED
        trigger: "system side effect of the FAT-failure displacement sweep on the same ProductionLine"
        actor: system
        preconditions:
          - "BuildSlot.status == RESERVED"
          - "BuildSlot.start_date < extended_end_date + ProductionLine.changeover_buffer_days of the reworked slot"
        side_effects:
          - "ProductionLine.committed_slot_days recomputed (DISPLACED leaves the committed set)"
      - from: CONFIRMED
        to: DISPLACED
        trigger: "system side effect of the FAT-failure displacement sweep on the same ProductionLine"
        actor: system
        preconditions:
          - "BuildSlot.status == CONFIRMED"
          - "BuildSlot.start_date < extended_end_date + ProductionLine.changeover_buffer_days of the reworked slot"
        side_effects:
          - "ProductionLine.committed_slot_days recomputed"
          - "MachineOrder.fulfillment_status SLOTTED -> ENGINEERED for the displaced slot's order"

  - entity: LongLeadComponent
    initial_state: PLANNED
    terminal_states: [RECEIVED]
    transitions:
      - from: PLANNED
        to: ON_ORDER
        trigger: "POST /packaging-oem/long-lead-components/{longLeadComponentId}/release-po"
        actor: ProductionPlanner
        preconditions:
          - "LongLeadComponent.status == PLANNED"
          - "MachineOrder.fulfillment_status NOT IN {DRAFT, CANCELLED}"
        side_effects:
          - "LongLeadComponent.po_released_on set to the logical clock's UTC date"
          - "LongLeadComponent.promised_date set to po_released_on + lead_time_days days"
      - from: ON_ORDER
        to: RECEIVED
        trigger: "POST /packaging-oem/long-lead-components/{longLeadComponentId}/receive"
        actor: ProductionPlanner
        preconditions:
          - "LongLeadComponent.status == ON_ORDER"
          - "logical clock UTC date >= LongLeadComponent.promised_date (ERR_COMPONENT_NOT_DUE otherwise)"
        side_effects:
          - "LongLeadComponent.version incremented by 1"

  - entity: AcceptanceTest
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /packaging-oem/acceptance-tests"
        actor: QualityInspector
        preconditions:
          - "kind == FAT requires MachineOrder.fulfillment_status == IN_BUILD"
          - "kind == SAT requires MachineOrder.fulfillment_status == INSTALLED (which already implies a PASSED FAT exists for the order) AND scheduled_on on or after the PASSED FAT's scheduled_on for the same machine_order_id (ERR_SAT_BEFORE_FAT otherwise)"
          - "no AcceptanceTest of the same kind and machine_order_id has status IN {SCHEDULED, IN_PROGRESS}"
        side_effects:
          - "AcceptanceTest row created in status SCHEDULED"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /packaging-oem/acceptance-tests/{acceptanceTestId}/start"
        actor: QualityInspector
        preconditions:
          - "AcceptanceTest.status == SCHEDULED"
          - "customer_product_supplied == true (ERR_CUSTOMER_PRODUCT_REQUIRED otherwise)"
          - "kind == FAT requires containers_supplied_count >= MIN_FAT_CONTAINERS (500); kind == SAT requires containers_supplied_count >= MIN_SAT_CONTAINERS (200)"
        side_effects:
          - "AcceptanceTest.customer_product_supplied and containers_supplied_count stored from the request body"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /packaging-oem/acceptance-tests/{acceptanceTestId}/finalize where the computed guarantee_met == true"
        actor: QualityInspector
        preconditions:
          - "AcceptanceTest.status == IN_PROGRESS"
          - "kind == SAT requires operators_trained_count >= required_operators_trained (ERR_OPERATOR_TRAINING_INCOMPLETE otherwise)"
        side_effects:
          - "AcceptanceTest.attainment_pct and guarantee_met computed by calculations.guarantee_attainment"
          - "kind == FAT: MachineOrder.fulfillment_status IN_BUILD -> FAT_PASSED and the order's IN_BUILD slot -> COMPLETED (then ProductionLine.committed_slot_days recomputed)"
          - "kind == SAT: MachineOrder.fulfillment_status INSTALLED -> ACCEPTED and the order's InstalledMachine INSTALLED -> ACCEPTED"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /packaging-oem/acceptance-tests/{acceptanceTestId}/finalize where the computed guarantee_met == false"
        actor: QualityInspector
        preconditions:
          - "AcceptanceTest.status == IN_PROGRESS"
          - "kind == SAT requires operators_trained_count >= required_operators_trained (ERR_OPERATOR_TRAINING_INCOMPLETE otherwise)"
        side_effects:
          - "AcceptanceTest.attainment_pct and guarantee_met computed by calculations.guarantee_attainment"
          - "kind == FAT: the four-hop cascade documented under MachineOrder IN_BUILD -> FAT_FAILED fires"
          - "kind == SAT: MachineOrder and InstalledMachine are left unchanged; only the test row moves to FAILED"

  - entity: FormatKit
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /packaging-oem/format-kits/{formatKitId}/quote"
        actor: ServiceManager
        preconditions:
          - "FormatKit.status == DRAFT"
          - "FormatKit.component_count >= 1 (ERR_KIT_HAS_NO_COMPONENTS otherwise)"
          - "InstalledMachine.status == ACCEPTED for installed_machine_id (ERR_MACHINE_NOT_ACCEPTED otherwise)"
        side_effects:
          - "FormatKit.quoted_lead_time_days computed by calculations.format_kit_lead_time"
          - "FormatKit.price_cents computed by calculations.format_kit_price"
      - from: QUOTED
        to: ORDERED
        trigger: "POST /packaging-oem/format-kits/{formatKitId}/order"
        actor: CustomerContact
        preconditions:
          - "FormatKit.status == QUOTED"
          - "X-User-ID equals InstalledMachine.customer_id of the kit's machine"
        side_effects:
          - "FormatKit.version incremented by 1"
      - from: ORDERED
        to: DELIVERED
        trigger: "POST /packaging-oem/format-kits/{formatKitId}/deliver"
        actor: ServiceManager
        preconditions:
          - "FormatKit.status == ORDERED"
          - "logical clock UTC date >= FormatKit.updated_at date of the ORDERED transition + FormatKit.quoted_lead_time_days days (ERR_KIT_LEAD_TIME_NOT_ELAPSED otherwise)"
        side_effects:
          - "InstalledMachine.current_format_family set to FormatKit.container_family"
          - "InstalledMachine.version incremented by 1"

  - entity: ServiceContract
    initial_state: DRAFT
    terminal_states: [EXPIRED, TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /packaging-oem/service-contracts/{serviceContractId}/activate"
        actor: ServiceManager
        preconditions:
          - "ServiceContract.status == DRAFT"
          - "InstalledMachine.status == ACCEPTED for installed_machine_id"
          - "ServiceContract.start_date <= logical clock UTC date <= ServiceContract.end_date"
        side_effects:
          - "ServiceContract.goodwill_budget_cents set to goodwill_budget_initial_cents"
          - "ServiceContract.coverage_posture computed by calculations.coverage_posture"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /packaging-oem/service-contracts/{serviceContractId}/expire"
        actor: ServiceManager
        preconditions:
          - "ServiceContract.status == ACTIVE"
          - "logical clock UTC date > ServiceContract.end_date (ERR_CONTRACT_NOT_EXPIRABLE otherwise)"
        side_effects:
          - "every PreventiveMaintenanceVisit of this contract in status IN {SCHEDULED, BILLABLE_HOLD} transitions to CANCELLED"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /packaging-oem/service-contracts/{serviceContractId}/terminate"
        actor: ServiceManager
        preconditions:
          - "ServiceContract.status == ACTIVE"
          - "no WarrantyClaim on this contract has status IN {SUBMITTED, PRODUCT_VARIATION_REVIEW, DEFECT_REVIEW} (ERR_CLAIM_STILL_OPEN otherwise)"
        side_effects:
          - "every PreventiveMaintenanceVisit of this contract in status IN {SCHEDULED, BILLABLE_HOLD} transitions to CANCELLED"

  - entity: PreventiveMaintenanceVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: "POST /packaging-oem/pm-visits"
        actor: ServiceManager
        preconditions:
          - "ServiceContract.status == ACTIVE for service_contract_id"
          - "ServiceContract.coverage_posture != BUDGET_EXHAUSTED (ERR_COVERAGE_EXHAUSTED otherwise)"
          - "ServiceContract.coverage_posture == RESTRICTED forbids visit_type == CORRECTIVE (ERR_POSTURE_RESTRICTED)"
          - "visit_type IN {PM, CORRECTIVE} requires a non-null field_engineer_id (ERR_ENGINEER_REQUIRED)"
          - "visit_type == REMOTE_DIAGNOSTIC requires InstalledMachine.remote_diagnostics_enabled == true (ERR_REMOTE_DIAGNOSTICS_DISABLED)"
          - "FieldEngineer.status == AVAILABLE"
          - "FieldEngineer.certifications contains the MachineModel.machine_family of the covered machine (ERR_ENGINEER_NOT_CERTIFIED)"
          - "FieldEngineer.region_code == Customer.region_code resolved via ServiceContract -> InstalledMachine -> Customer (ERR_ENGINEER_REGION_MISMATCH)"
          - "start_ts and end_ts fall inside [ServiceContract.start_date T00:00:00.000Z, ServiceContract.end_date T23:59:59.999Z]"
          - "no closed-interval collision with another visit of the same engineer (validations priority 48, ERR_ENGINEER_DOUBLE_BOOKED)"
        side_effects:
          - "PreventiveMaintenanceVisit.billable computed by calculations.pm_visit_billability"
          - "ServiceContract.pm_visits_used recomputed"
      - from: SCHEDULED
        to: BILLABLE_HOLD
        trigger: "system side effect of the goodwill-exhaustion cascade (see WarrantyClaim SUBMITTED/*_REVIEW -> ADJUDICATED)"
        actor: system
        preconditions:
          - "PreventiveMaintenanceVisit.status == SCHEDULED"
          - "ServiceContract.coverage_posture transitioned to BUDGET_EXHAUSTED in this request"
        side_effects:
          - "PreventiveMaintenanceVisit.billable set to true"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /packaging-oem/pm-visits/{pmVisitId}/complete"
        actor: ServiceManager
        preconditions:
          - "PreventiveMaintenanceVisit.status == SCHEDULED"
          - "logical clock UTC timestamp >= PreventiveMaintenanceVisit.end_ts (ERR_VISIT_NOT_ELAPSED otherwise)"
        side_effects:
          - "PreventiveMaintenanceVisit.findings_code stored from the request body"
          - "ServiceContract.pm_visits_used recomputed"
      - from: BILLABLE_HOLD
        to: COMPLETED
        trigger: "POST /packaging-oem/pm-visits/{pmVisitId}/complete"
        actor: ServiceManager
        preconditions:
          - "PreventiveMaintenanceVisit.status == BILLABLE_HOLD"
          - "logical clock UTC timestamp >= PreventiveMaintenanceVisit.end_ts"
        side_effects:
          - "PreventiveMaintenanceVisit.findings_code stored from the request body"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /packaging-oem/pm-visits/{pmVisitId}/cancel"
        actor: ServiceManager
        preconditions:
          - "PreventiveMaintenanceVisit.status == SCHEDULED"
        side_effects:
          - "the engineer's closed interval is freed, so a later visit may occupy it"
          - "ServiceContract.pm_visits_used recomputed"
      - from: BILLABLE_HOLD
        to: CANCELLED
        trigger: "POST /packaging-oem/pm-visits/{pmVisitId}/cancel"
        actor: ServiceManager
        preconditions:
          - "PreventiveMaintenanceVisit.status == BILLABLE_HOLD"
        side_effects:
          - "ServiceContract.pm_visits_used recomputed"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [ADJUDICATED, REJECTED, VOID]
    note: |
      Branching fork-join: the PRODUCT_VARIATION and DEFECT reviews are two independent branches with
      divergent side-effect sets; adjudication is the join and requires both branch booleans true.
      status records whichever branch was signed off FIRST and is not moved by the second sign-off.
    transitions:
      - from: SUBMITTED
        to: PRODUCT_VARIATION_REVIEW
        trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/reviews/product-variation"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
          - "WarrantyClaim.product_variation_review_done == false"
          - "at least one WarrantyClaimLine exists for this claim (ERR_CLAIM_HAS_NO_LINES otherwise)"
        side_effects:
          - "WarrantyClaim.product_variation_review_done set to true"
          - "WarrantyClaim.claimed_cost_cents recomputed as the sum of its lines"
        note: "branch A side-effect set: money roll-up only; MachineModel is untouched"
      - from: DEFECT_REVIEW
        to: DEFECT_REVIEW
        trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/reviews/product-variation"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == DEFECT_REVIEW"
          - "WarrantyClaim.product_variation_review_done == false"
          - "at least one WarrantyClaimLine exists for this claim"
        side_effects:
          - "WarrantyClaim.product_variation_review_done set to true"
          - "WarrantyClaim.claimed_cost_cents recomputed as the sum of its lines"
          - "status stays DEFECT_REVIEW (the first branch signed off owns the status field)"
      - from: SUBMITTED
        to: DEFECT_REVIEW
        trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/reviews/defect"
        actor: QualityInspector
        preconditions:
          - "WarrantyClaim.status == SUBMITTED"
          - "WarrantyClaim.defect_review_done == false"
          - "at least one WarrantyClaimLine exists for this claim (ERR_CLAIM_HAS_NO_LINES otherwise)"
        side_effects:
          - "WarrantyClaim.defect_review_done set to true"
          - "MachineModel.open_defect_review_count incremented by 1 for the model behind this machine's order"
        note: "branch B side-effect set: cross-aggregate counter on MachineModel; claimed_cost_cents untouched"
      - from: PRODUCT_VARIATION_REVIEW
        to: PRODUCT_VARIATION_REVIEW
        trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/reviews/defect"
        actor: QualityInspector
        preconditions:
          - "WarrantyClaim.status == PRODUCT_VARIATION_REVIEW"
          - "WarrantyClaim.defect_review_done == false"
        side_effects:
          - "WarrantyClaim.defect_review_done set to true"
          - "MachineModel.open_defect_review_count incremented by 1"
          - "status stays PRODUCT_VARIATION_REVIEW"
      - from: PRODUCT_VARIATION_REVIEW
        to: ADJUDICATED
        trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/adjudicate with resolution == APPROVE"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status IN {PRODUCT_VARIATION_REVIEW, DEFECT_REVIEW}"
          - "WarrantyClaim.product_variation_review_done == true AND WarrantyClaim.defect_review_done == true (ERR_CLAIM_REVIEWS_INCOMPLETE otherwise)"
          - "ServiceContract.status == ACTIVE"
        side_effects:
          - "WarrantyClaim.cause computed by calculations.claim_cause_classification"
          - "WarrantyClaim.oem_share_cents / customer_share_cents / per-line oem_line_share_cents computed by calculations.claim_cost_apportionment"
          - "WarrantyClaim.goodwill_charged_cents computed by calculations.claim_goodwill_charge"
          - "cascade hop 2: ServiceContract.goodwill_budget_cents decreased by goodwill_charged_cents"
          - "cascade hop 3: ServiceContract.coverage_posture recomputed; if it becomes BUDGET_EXHAUSTED every SCHEDULED PreventiveMaintenanceVisit on the contract transitions to BILLABLE_HOLD with billable = true"
      - from: DEFECT_REVIEW
        to: ADJUDICATED
        trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/adjudicate with resolution == APPROVE"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == DEFECT_REVIEW"
          - "WarrantyClaim.product_variation_review_done == true AND WarrantyClaim.defect_review_done == true"
          - "ServiceContract.status == ACTIVE"
        side_effects:
          - "identical to the PRODUCT_VARIATION_REVIEW -> ADJUDICATED join edge (same three-hop cascade)"
      - from: PRODUCT_VARIATION_REVIEW
        to: REJECTED
        trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/adjudicate with resolution == REJECT"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status IN {PRODUCT_VARIATION_REVIEW, DEFECT_REVIEW}"
          - "WarrantyClaim.product_variation_review_done == true AND WarrantyClaim.defect_review_done == true"
        side_effects:
          - "WarrantyClaim.cause computed by calculations.claim_cause_classification"
          - "WarrantyClaim.oem_share_cents set to 0 and customer_share_cents set to claimed_cost_cents"
          - "ServiceContract.goodwill_budget_cents unchanged"
      - from: DEFECT_REVIEW
        to: REJECTED
        trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/adjudicate with resolution == REJECT"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == DEFECT_REVIEW"
          - "WarrantyClaim.product_variation_review_done == true AND WarrantyClaim.defect_review_done == true"
        side_effects:
          - "same as the PRODUCT_VARIATION_REVIEW -> REJECTED edge"
      - from: ADJUDICATED
        to: VOID
        trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/void"
        actor: ServiceManager
        preconditions:
          - "WarrantyClaim.status == ADJUDICATED"
          - "ServiceContract.status == ACTIVE"
        side_effects:
          - "compensating action: ServiceContract.goodwill_budget_cents increased by exactly WarrantyClaim.goodwill_charged_cents"
          - "WarrantyClaim.goodwill_charged_cents set to 0, oem_share_cents set to 0, customer_share_cents set to 0"
          - "ServiceContract.coverage_posture recomputed; visits in BILLABLE_HOLD whose contract posture returns to OPEN or RESTRICTED transition back to SCHEDULED with billable recomputed"
          - "MachineModel.open_defect_review_count decreased by 1 (the defect review is withdrawn with the claim)"

  - entity: StockingRecommendation
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /packaging-oem/stocking-recommendations"
        actor: ServiceManager
        preconditions:
          - "InstalledMachine.status == ACCEPTED for installed_machine_id"
          - "request body carries expected_installed_machine_version equal to InstalledMachine.version"
        side_effects:
          - "any StockingRecommendation with the same installed_machine_id and part_number in status ACTIVE transitions to SUPERSEDED"
          - "StockingRecommendation.recommended_qty computed by calculations.spare_stocking_qty"
          - "InstalledMachine.version incremented by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /packaging-oem/stocking-recommendations/{stockingRecommendationId}/obsolescence-notice"
        actor: ServiceManager
        preconditions:
          - "StockingRecommendation.status == ACTIVE"
          - "notice_type is a forward move in {ACTIVE -> NOTICE_ISSUED -> LAST_TIME_BUY -> OBSOLETE} (ERR_OBSOLESCENCE_REGRESSION otherwise)"
        side_effects:
          - "StockingRecommendation.obsolescence_status set to notice_type"
          - "StockingRecommendation.recommended_qty recomputed by calculations.spare_stocking_qty with the new obsolescence multiplier"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: build-slot-create-stale-order
    parent_entity: MachineOrder
    write_endpoint: "POST /packaging-oem/build-slots"
    occ_field: "expected_machine_order_version"
    description: |
      Creating a BuildSlot against a MachineOrder whose version has advanced since the client last
      observed it is rejected. A slot create legitimately supersedes the order's prior RESERVED slot
      (releasing it and re-crediting the line's committed_slot_days), so a planner working from a
      stale view of the order would silently discard a slot booked from a newer view.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
  - rule_id: stocking-recommendation-create-stale-machine
    parent_entity: InstalledMachine
    write_endpoint: "POST /packaging-oem/stocking-recommendations"
    occ_field: "expected_installed_machine_version"
    description: |
      Creating a StockingRecommendation against an InstalledMachine whose version has advanced since
      the client last observed it is rejected. A new recommendation supersedes the prior ACTIVE
      recommendation for the same part, so a stale view would supersede a list the service manager
      has never seen.
    error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: trial_config_recommendation
    trigger: "POST /packaging-oem/product-trials/{productTrialId}/record-result (all three outcomes)"
    algorithm: threshold
    formula: |
      rate_ratio_pct      = round_half_up(measured_rate_cpm / MachineModel.nameplate_rate_cpm * 100, 2)
      effective_ratio_pct = round_half_up(rate_ratio_pct - Customer.product_variation_pct, 2)
      if outcome == REJECT:            config_recommendation = NOT_FEASIBLE
      elif effective_ratio_pct >= 90.00: config_recommendation = STANDARD
      elif effective_ratio_pct >= 75.00: config_recommendation = HEAVY_DUTY
      else:                              config_recommendation = NOT_FEASIBLE
    input_set: "the trial's own measured_rate_cpm from the request body, the MachineModel referenced by ProductTrial.machine_model_id, and the Customer referenced by ProductTrial.customer_id"
    constants:
      STANDARD_RATIO_FLOOR_PCT: 90.00
      HEAVY_DUTY_RATIO_FLOOR_PCT: 75.00
    precision: "percentages 2 decimal places, round_half_up; both comparisons are >= (an effective_ratio_pct of exactly 90.00 is STANDARD, exactly 75.00 is HEAVY_DUTY)"

  - name: order_total_rollup
    trigger: "POST /packaging-oem/machine-orders/{machineOrderId}/engineer (DRAFT -> ENGINEERED)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED and MUST be executed exactly in these four steps. The fee depends
      # on a discount tier, and the tier looks like it should depend on the order total (which itself
      # contains the fee) - that circularity is resolved by keying the tier on the PRE-FEE subtotal
      # only. Deriving the tier from order_total_cents is WRONG.
      step 1: pre_fee_subtotal_cents = equipment_price_cents + change_parts_price_cents
      step 2: discount_tier =
                T3 if pre_fee_subtotal_cents >= 150000000
                T2 if 75000000  <= pre_fee_subtotal_cents < 150000000
                T1 if 25000000  <= pre_fee_subtotal_cents <  75000000
                NONE otherwise
      step 3: fee_pct = { NONE: 6.00, T1: 5.00, T2: 4.00, T3: 3.00 }[discount_tier]
              commissioning_fee_cents = round_half_up(pre_fee_subtotal_cents * fee_pct / 100)
      step 4: order_total_cents = pre_fee_subtotal_cents + commissioning_fee_cents
    input_set: "only the order's own equipment_price_cents and change_parts_price_cents; no other order contributes"
    constants:
      T1_FLOOR_CENTS: 25000000
      T2_FLOOR_CENTS: 75000000
      T3_FLOOR_CENTS: 150000000
      FEE_PCT_NONE: 6.00
      FEE_PCT_T1: 5.00
      FEE_PCT_T2: 4.00
      FEE_PCT_T3: 3.00
    precision: "commissioning_fee_cents is a whole number of cents, round_half_up on the single multiplication in step 3; tier boundaries are >= (exactly 25000000 is T1)"

  - name: guarantee_attainment
    trigger: "POST /packaging-oem/acceptance-tests/{acceptanceTestId}/finalize (both FAT and SAT)"
    algorithm: weighted_scoring
    formula: |
      # variant selected by MachineOrder.guarantee_basis of the test's order
      if guarantee_basis == NAMEPLATE:
          reference_rate_cpm = MachineModel.nameplate_rate_cpm
      else:  # PRODUCT_ADJUSTED
          reference_rate_cpm = MachineModel.nameplate_rate_cpm * (1 - Customer.product_variation_pct / 100)
      attainment_pct = round_half_up(measured_rate_cpm / reference_rate_cpm * measured_efficiency_pct, 2)
      guarantee_met  = attainment_pct >= MachineModel.guarantee_efficiency_pct
    input_set: "the finalizing test's own measured_rate_cpm and measured_efficiency_pct, the MachineModel of the order, and (PRODUCT_ADJUSTED only) the Customer.product_variation_pct of the order's customer"
    constants:
      REFERENCE_RATE_FLOOR_CPM: 1
    precision: |
      single round_half_up to 2 decimals applied once, after the full expression
      (measured_rate_cpm / reference_rate_cpm * measured_efficiency_pct); no intermediate rounding.
      The pass test is >= : an attainment_pct of exactly MachineModel.guarantee_efficiency_pct passes.
    variants:
      - name: NAMEPLATE
        when: "MachineOrder.guarantee_basis == NAMEPLATE"
        difference: "reference_rate_cpm is the catalog nameplate rate; the customer's product variation is ignored, so a variable product depresses attainment"
      - name: PRODUCT_ADJUSTED
        when: "MachineOrder.guarantee_basis == PRODUCT_ADJUSTED"
        difference: "reference_rate_cpm is the nameplate rate derated by Customer.product_variation_pct, so identical run data yields a strictly higher attainment_pct whenever product_variation_pct > 0"

  - name: format_kit_lead_time
    trigger: "POST /packaging-oem/format-kits/{formatKitId}/quote (DRAFT -> QUOTED)"
    algorithm: constraint_propagation
    formula: |
      max_component_lead_days = max(c.lead_time_days for c in components)          # components is non-empty by precondition
      total_qty               = sum(c.qty for c in components)
      assembly_days           = ceil(total_qty / KIT_ASSEMBLY_QTY_PER_DAY)
      family_change_days      = FAMILY_CHANGE_DAYS if FormatKit.container_family != InstalledMachine.current_format_family else SAME_FAMILY_DAYS
      out_of_range_days       = OUT_OF_RANGE_DAYS if (FormatKit.container_diameter_mm < MachineModel.min_container_diameter_mm
                                                     or FormatKit.container_diameter_mm > MachineModel.max_container_diameter_mm) else 0
      quoted_lead_time_days   = min(MAX_QUOTED_LEAD_DAYS,
                                    max(max_component_lead_days + family_change_days,
                                        assembly_days + out_of_range_days + MIN_KIT_LEAD_DAYS))
    input_set: "the kit's own components array, the InstalledMachine's current_format_family, and the MachineModel diameter window reached through InstalledMachine -> MachineOrder -> MachineModel"
    constants:
      KIT_ASSEMBLY_QTY_PER_DAY: 4
      FAMILY_CHANGE_DAYS: 10
      SAME_FAMILY_DAYS: 3
      OUT_OF_RANGE_DAYS: 15
      MIN_KIT_LEAD_DAYS: 5
      MAX_QUOTED_LEAD_DAYS: 180
    precision: "integer days; ceil on assembly_days; the outer min caps the quote at 180 days"

  - name: format_kit_price
    trigger: "POST /packaging-oem/format-kits/{formatKitId}/quote (DRAFT -> QUOTED)"
    algorithm: aggregation
    formula: |
      # ROUNDING ORDER IS PINNED: round EACH component line to whole cents FIRST, THEN sum.
      # Summing the raw products and rounding once at the end is WRONG and can differ by cents.
      for each component c in components (iterated in the array order supplied at creation):
          line_cents(c) = round_half_up(c.unit_price_cents * c.qty * (1 + KIT_MARKUP_PCT / 100))
      price_cents = sum(line_cents(c) for c in components) + KIT_ENGINEERING_FEE_CENTS
    input_set: "the kit's own components array only"
    constants:
      KIT_MARKUP_PCT: 17.50
      KIT_ENGINEERING_FEE_CENTS: 120000
    precision: "whole cents; round_half_up per component line, then integer summation; engineering fee added last"

  - name: claim_cause_classification
    trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/adjudicate (both APPROVE and REJECT)"
    algorithm: weighted_scoring
    formula: |
      claimed_cost_cents   = sum(line.amount_cents for line in WarrantyClaimLine of this claim)
      weighted_defect_pct  = round_half_up(sum(line.amount_cents * line.defect_attribution_pct) / claimed_cost_cents, 2)
      cause = MACHINE_DEFECT    if weighted_defect_pct >= 80.00
              PRODUCT_VARIATION if weighted_defect_pct <= 20.00
              MIXED             otherwise
    input_set: "every WarrantyClaimLine with warranty_claim_id == this claim, no status filter (lines are immutable, common_fields: false)"
    constants:
      DEFECT_CAUSE_FLOOR_PCT: 80.00
      VARIATION_CAUSE_CEILING_PCT: 20.00
    precision: "weighted_defect_pct to 2 decimals, round_half_up; boundaries are inclusive on both ends (exactly 80.00 is MACHINE_DEFECT, exactly 20.00 is PRODUCT_VARIATION)"

  - name: claim_cost_apportionment
    trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/adjudicate (both APPROVE and REJECT)"
    algorithm: waterfall_allocation
    formula: |
      # ROUNDING ORDER IS PINNED: apportion and round EACH line to whole cents FIRST, THEN sum the
      # rounded line shares. Apportioning the claim total once (sum of amounts x weighted pct) is
      # WRONG - it can differ by cents from the pinned per-line order.
      for each WarrantyClaimLine line of this claim (iterated by created_at ASC):
          effective_pct(line)          = base or discounted attribution per the selected variant below
          oem_line_share_cents(line)   = round_half_up(line.amount_cents * effective_pct(line) / 100)
      oem_share_cents      = sum(oem_line_share_cents(line) for all lines)      # if resolution == REJECT: 0
      customer_share_cents = claimed_cost_cents - oem_share_cents
    input_set: "every WarrantyClaimLine with warranty_claim_id == this claim, iterated created_at ASC; plus Customer.product_variation_pct reached through WarrantyClaim -> InstalledMachine -> Customer"
    constants:
      VARIATION_TOLERANCE_PCT: 5.00
    precision: "whole cents; round_half_up per line, then integer summation; customer_share_cents is the exact residual so oem_share_cents + customer_share_cents == claimed_cost_cents always"
    variants:
      - name: STRICT_DEFECT
        when: "Customer.product_variation_pct <= VARIATION_TOLERANCE_PCT (5.00)"
        difference: "effective_pct(line) == line.defect_attribution_pct verbatim; the customer's product is inside tolerance so no discount is applied to the OEM's share"
      - name: VARIATION_DISCOUNTED
        when: "Customer.product_variation_pct > VARIATION_TOLERANCE_PCT (5.00)"
        difference: |
          effective_pct(line) = round_half_up(line.defect_attribution_pct
                                              * (1 - (Customer.product_variation_pct - 5.00) / 100), 2)
          i.e. the OEM's share of every line is shaved in proportion to how far the customer's product
          variation exceeds tolerance, so identical claim lines yield a strictly smaller oem_share_cents

  - name: claim_goodwill_charge
    trigger: "POST /packaging-oem/warranty-claims/{warrantyClaimId}/adjudicate with resolution == APPROVE"
    algorithm: threshold
    formula: |
      tier_share_pct        = { BRONZE: 50.00, SILVER: 75.00, GOLD: 100.00 }[ServiceContract.tier]
      tier_absorbed_cents   = round_half_up(oem_share_cents * tier_share_pct / 100)
      goodwill_charged_cents = min(tier_absorbed_cents, ServiceContract.goodwill_budget_cents)
    input_set: "the adjudicating claim's oem_share_cents (already computed by claim_cost_apportionment in the same request) and the ServiceContract's tier and current goodwill_budget_cents"
    constants:
      TIER_SHARE_PCT_BRONZE: 50.00
      TIER_SHARE_PCT_SILVER: 75.00
      TIER_SHARE_PCT_GOLD: 100.00
    precision: "whole cents, round_half_up on the tier multiplication; the min() clamp means goodwill_budget_cents can reach exactly 0 but never go negative"

  - name: goodwill_ledger
    trigger: "every ServiceContract.goodwill_budget_cents mutation (claim adjudication APPROVE, claim void)"
    algorithm: aggregation
    formula: |
      goodwill_budget_cents = goodwill_budget_initial_cents
                              - sum(WarrantyClaim.goodwill_charged_cents
                                    for claims where service_contract_id == this contract
                                    and status == ADJUDICATED)
    input_set: "WarrantyClaim rows of this contract with status == ADJUDICATED only; REJECTED, VOID, SUBMITTED, PRODUCT_VARIATION_REVIEW and DEFECT_REVIEW claims contribute 0"
    constants: {}
    precision: "whole cents; this identity is the conserved-quantity invariant and MUST hold after every adjudication and every void"

  - name: coverage_posture
    trigger: "ServiceContract activation and every goodwill_budget_cents mutation"
    algorithm: threshold
    formula: |
      coverage_posture = BUDGET_EXHAUSTED if goodwill_budget_cents == 0
                         RESTRICTED      if 0 < goodwill_budget_cents <= RESTRICT_THRESHOLD_CENTS
                         OPEN            otherwise
    input_set: "the contract's own goodwill_budget_cents"
    constants:
      RESTRICT_THRESHOLD_CENTS: 50000
    precision: "integer cents; the RESTRICTED band is inclusive at its upper edge (exactly 50000 remaining is RESTRICTED, 50001 is OPEN)"

  - name: pm_visit_billability
    trigger: "POST /packaging-oem/pm-visits (creation) and every visit status change that alters the contract's PM count"
    algorithm: threshold
    formula: |
      if visit_type == PM:
          prior_pm_count = count(PreventiveMaintenanceVisit v of this contract
                                 where v.visit_type == PM
                                 and v.status IN {SCHEDULED, BILLABLE_HOLD, COMPLETED}
                                 and v.id != this visit's id)
          billable = prior_pm_count >= ServiceContract.pm_visits_included
      elif visit_type == CORRECTIVE:
          billable = not (ServiceContract.tier == GOLD and ServiceContract.coverage_posture == OPEN)
      else:  # REMOTE_DIAGNOSTIC
          billable = (ServiceContract.tier == BRONZE)
    input_set: "sibling PreventiveMaintenanceVisit rows of the same contract with status IN {SCHEDULED, BILLABLE_HOLD, COMPLETED}; CANCELLED visits are excluded and free their entitlement slot"
    constants: {}
    precision: "boolean; the PM entitlement comparison is >= (with pm_visits_included == 2 the third PM is billable, the second is not)"

  - name: spare_stocking_qty
    trigger: "POST /packaging-oem/stocking-recommendations and POST /packaging-oem/stocking-recommendations/{stockingRecommendationId}/obsolescence-notice"
    algorithm: forward_looking
    formula: |
      obsolescence_multiplier = { ACTIVE: 1.00, NOTICE_ISSUED: 1.50, LAST_TIME_BUY: 3.00, OBSOLETE: 0.00 }[obsolescence_status]
      daily_usage             = annual_usage_qty / 365          # exact rational, no rounding here
      # variant selected by StockingRecommendation.basis
      if basis == LEAD_TIME_DEMAND:
          safety_factor = { A: 0.50, B: 0.25, C: 0.10 }[criticality]
          raw = daily_usage * unit_lead_time_days * (1 + safety_factor) * obsolescence_multiplier
      else:  # SERVICE_LEVEL
          service_factor = { A: 1.60, B: 1.30, C: 1.05 }[criticality]
          raw = daily_usage * (unit_lead_time_days + REVIEW_PERIOD_DAYS) * service_factor * obsolescence_multiplier
      recommended_qty = ceil(raw)
    input_set: "the recommendation's own annual_usage_qty, unit_lead_time_days, criticality, basis and obsolescence_status; no sibling rows participate"
    constants:
      REVIEW_PERIOD_DAYS: 30
      DAYS_PER_YEAR: 365
    precision: "single ceil applied once to the fully evaluated product; no intermediate rounding. An OBSOLETE part yields exactly 0 regardless of usage."
    variants:
      - name: LEAD_TIME_DEMAND
        when: "StockingRecommendation.basis == LEAD_TIME_DEMAND"
        difference: "covers lead-time demand only, inflated by a criticality safety factor of 0.50/0.25/0.10"
      - name: SERVICE_LEVEL
        when: "StockingRecommendation.basis == SERVICE_LEVEL"
        difference: "covers lead time PLUS a 30-day review period and applies a larger criticality service factor of 1.60/1.30/1.05, so it returns a strictly larger quantity than LEAD_TIME_DEMAND for identical inputs whenever annual_usage_qty > 0"

  - name: slot_days_and_end_date
    trigger: "POST /packaging-oem/build-slots and every BuildSlot mutation caused by a change in MachineOrder.rework_days"
    algorithm: aggregation
    formula: |
      slot_days = requested_slot_days + MachineOrder.rework_days
      end_date  = start_date + slot_days days        # half-open: end_date is the first FREE day
    input_set: "the slot's own requested_slot_days and the current MachineOrder.rework_days of its order"
    constants:
      REWORK_DAYS_PER_FAT_FAILURE: 7
    precision: "integer days; dates are ISO 8601 calendar dates with no timezone arithmetic"

  - name: slot_earliest_start
    trigger: "POST /packaging-oem/build-slots (validation of start_date)"
    algorithm: interval_merge
    formula: |
      candidate_components = LongLeadComponent rows with machine_order_id == order.id
                             and status IN {ON_ORDER, RECEIVED}
      if candidate_components is empty:
          earliest_start = logical clock UTC date
      else:
          earliest_start = max(c.promised_date for c in candidate_components)
      reject the create with ERR_SLOT_BEFORE_COMPONENTS when start_date < earliest_start
    input_set: "LongLeadComponent rows of the order with status IN {ON_ORDER, RECEIVED}; PLANNED components block the create outright via a separate precondition"
    constants: {}
    precision: "date comparison, inclusive: start_date == earliest_start is accepted"

  - name: line_slot_collision
    trigger: "POST /packaging-oem/build-slots and the FAT-failure displacement sweep"
    algorithm: interval_merge
    formula: |
      # Half-open day intervals [start_date, end_date) on a ProductionLine, each incumbent extended
      # forward by the line's changeover_buffer_days. Adjacency is NOT free: a slot starting exactly
      # on an incumbent's end_date collides whenever changeover_buffer_days > 0.
      incumbents = BuildSlot rows with production_line_id == this line
                   and status IN {RESERVED, CONFIRMED, IN_BUILD, REWORK_HOLD}
                   and id != this slot's id
      collides(new, inc) = (new.start_date < add_days(inc.end_date, line.changeover_buffer_days))
                           and (inc.start_date < add_days(new.end_date, line.changeover_buffer_days))
      reject with ERR_SLOT_OVERLAP when any incumbent collides
    input_set: "sibling BuildSlot rows on the same production_line_id in the four committed statuses; RELEASED, DISPLACED and COMPLETED slots never collide"
    constants: {}
    precision: "day granularity, half-open intervals, symmetric buffer applied to both sides of the comparison"

  - name: engineer_visit_collision
    trigger: "POST /packaging-oem/pm-visits"
    algorithm: interval_merge
    formula: |
      # CLOSED inclusive timestamp intervals [start_ts, end_ts] on a FieldEngineer, with NO buffer.
      # Touching endpoints DO collide: a visit starting at exactly the incumbent's end_ts is rejected.
      incumbents = PreventiveMaintenanceVisit rows with field_engineer_id == this engineer
                   and status IN {SCHEDULED, BILLABLE_HOLD}
      collides(new, inc) = (new.start_ts <= inc.end_ts) and (inc.start_ts <= new.end_ts)
      reject with ERR_ENGINEER_DOUBLE_BOOKED when any incumbent collides
    input_set: "sibling PreventiveMaintenanceVisit rows of the same field_engineer_id with status IN {SCHEDULED, BILLABLE_HOLD}; COMPLETED and CANCELLED visits never collide; REMOTE_DIAGNOSTIC visits have field_engineer_id == null and never participate"
    constants: {}
    precision: "millisecond granularity ISO 8601 UTC, closed intervals on both endpoints"

  - name: line_committed_days_ledger
    trigger: "every BuildSlot create, status change, or slot_days recompute"
    algorithm: aggregation
    formula: |
      ProductionLine.committed_slot_days =
          sum(BuildSlot.slot_days for slots where production_line_id == this line
              and status IN {RESERVED, CONFIRMED, IN_BUILD, REWORK_HOLD})
    input_set: "BuildSlot rows on the line in the four committed statuses; RELEASED, DISPLACED and COMPLETED slots contribute 0"
    constants: {}
    precision: "integer days; this identity is the conserved-quantity invariant and MUST hold after every slot create, release, supersede, displacement and rework extension"

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (ordered by priority; lower number wins when a
#     single request violates several rows)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and non-blank (X-User-ID may be omitted only for the Anonymous-free surface, i.e. never - every endpoint requires both headers)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the X-User-Role value is one of the six declared roles AND appears in the called endpoint's roles list in 1.5"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body/query shape: required fields present, types correct, enum members valid, numeric ranges honored, end after start, limit in [1,100], offset >= 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 4
    category: existence
    check: |
      every referenced resource exists, validated left-to-right: path ids first (in path order), then
      body foreign keys in the order they appear in the endpoint's input list. Each miss raises that
      entity's own 404 code (ERR_CUSTOMER_NOT_FOUND, ERR_MACHINE_MODEL_NOT_FOUND,
      ERR_PRODUCT_TRIAL_NOT_FOUND, ERR_MACHINE_ORDER_NOT_FOUND, ERR_PRODUCTION_LINE_NOT_FOUND,
      ERR_BUILD_SLOT_NOT_FOUND, ERR_COMPONENT_NOT_FOUND, ERR_ACCEPTANCE_TEST_NOT_FOUND,
      ERR_INSTALLED_MACHINE_NOT_FOUND, ERR_FORMAT_KIT_NOT_FOUND, ERR_SERVICE_CONTRACT_NOT_FOUND,
      ERR_FIELD_ENGINEER_NOT_FOUND, ERR_PM_VISIT_NOT_FOUND, ERR_WARRANTY_CLAIM_NOT_FOUND,
      ERR_CLAIM_LINE_NOT_FOUND, ERR_STOCKING_RECOMMENDATION_NOT_FOUND)
    error_id: ERR_MACHINE_ORDER_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: auth
    check: "for CustomerContact calls the acting X-User-ID equals the Customer.id that owns the target resource (resolved via ProductTrial.customer_id, MachineOrder.customer_id, or FormatKit -> InstalledMachine.customer_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /product-trials, GET /machine-orders/{machineOrderId}, POST /format-kits/{formatKitId}/order, POST /warranty-claims"
  - priority: 6
    category: state
    check: "Customer.status == ACTIVE"
    error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    applies_to: "POST /product-trials/{productTrialId}/start-testing, POST /machine-orders"
  - priority: 7
    category: state
    check: "MachineModel.lifecycle_status == ACTIVE"
    error_id: ERR_MODEL_OBSOLETE
    http_status: 409
    applies_to: "POST /product-trials/{productTrialId}/start-testing, POST /machine-orders/{machineOrderId}/engineer"
  - priority: 8
    category: state
    check: "the ProductTrial is in the state the requested transition allows (SUBMITTED or RETEST_REQUIRED for start-testing; TESTING or RETEST_REQUIRED for record-result)"
    error_id: ERR_INVALID_TRIAL_STATE
    http_status: 409
    applies_to: "POST /product-trials/{productTrialId}/start-testing, POST /product-trials/{productTrialId}/record-result"
  - priority: 9
    category: state
    check: "ProductTrial.status == PASSED for the order's product_trial_id"
    error_id: ERR_TRIAL_NOT_PASSED
    http_status: 409
    applies_to: "POST /machine-orders/{machineOrderId}/engineer"
  - priority: 10
    category: state
    check: "MachineOrder.fulfillment_status == ENGINEERED"
    error_id: ERR_ORDER_NOT_ENGINEERED
    http_status: 409
    applies_to: "POST /build-slots"
  - priority: 11
    category: state
    check: "MachineOrder.fulfillment_status is the value the requested transition starts from (engineer needs DRAFT, ship needs FAT_PASSED, installed-machine create needs SHIPPED, FAT create needs IN_BUILD, SAT create needs INSTALLED, commercial-advance needs the matching commercial_status)"
    error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    applies_to: "POST /machine-orders/{machineOrderId}/engineer, POST /machine-orders/{machineOrderId}/ship, POST /machine-orders/{machineOrderId}/commercial-advance, POST /acceptance-tests, POST /installed-machines"
  - priority: 12
    category: state
    check: "ProductionLine.status == OPEN"
    error_id: ERR_LINE_NOT_OPEN
    http_status: 409
    applies_to: "POST /build-slots, POST /build-slots/{buildSlotId}/confirm"
  - priority: 13
    category: state
    check: "no LongLeadComponent of the order has status == PLANNED (every purchase order is released)"
    error_id: ERR_COMPONENT_PO_NOT_RELEASED
    http_status: 409
    applies_to: "POST /build-slots"
  - priority: 14
    category: state
    check: "the BuildSlot is in the state the requested transition starts from (RESERVED for confirm, CONFIRMED or REWORK_HOLD for start-build, RESERVED or CONFIRMED for release)"
    error_id: ERR_INVALID_SLOT_STATE
    http_status: 409
    applies_to: "POST /build-slots/{buildSlotId}/confirm, POST /build-slots/{buildSlotId}/start-build, POST /build-slots/{buildSlotId}/release"
  - priority: 15
    category: state
    check: "MachineOrder.commercial_status IN {PO_RECEIVED, INVOICED, PAID} - the parallel commercial dimension gates slot confirmation"
    error_id: ERR_COMMERCIAL_STATUS_BLOCKS_CONFIRM
    http_status: 409
    applies_to: "POST /build-slots/{buildSlotId}/confirm"
  - priority: 16
    category: state
    check: "every LongLeadComponent of the order has status == RECEIVED"
    error_id: ERR_COMPONENTS_NOT_RECEIVED
    http_status: 409
    applies_to: "POST /build-slots/{buildSlotId}/start-build, POST /machine-orders/{machineOrderId}/ship"
  - priority: 17
    category: state
    check: "the LongLeadComponent is in the state the requested transition starts from (PLANNED for release-po, ON_ORDER for receive)"
    error_id: ERR_INVALID_COMPONENT_STATE
    http_status: 409
    applies_to: "POST /long-lead-components/{longLeadComponentId}/release-po, POST /long-lead-components/{longLeadComponentId}/receive"
  - priority: 18
    category: temporal
    check: "for kind == SAT, scheduled_on >= the scheduled_on of the order's PASSED FAT - site acceptance can never be dated before the factory test it depends on"
    error_id: ERR_SAT_BEFORE_FAT
    http_status: 422
    applies_to: "POST /acceptance-tests"
  - priority: 19
    category: state
    check: "the AcceptanceTest is in the state the requested transition starts from (SCHEDULED for start, IN_PROGRESS for finalize)"
    error_id: ERR_INVALID_TEST_STATE
    http_status: 409
    applies_to: "POST /acceptance-tests/{acceptanceTestId}/start, POST /acceptance-tests/{acceptanceTestId}/finalize"
  - priority: 20
    category: state
    check: "InstalledMachine.status == ACCEPTED"
    error_id: ERR_MACHINE_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /format-kits/{formatKitId}/quote, POST /service-contracts/{serviceContractId}/activate, POST /stocking-recommendations"
  - priority: 21
    category: state
    check: "the FormatKit is in the state the requested transition starts from (DRAFT for quote, QUOTED for order, ORDERED for deliver)"
    error_id: ERR_INVALID_KIT_STATE
    http_status: 409
    applies_to: "POST /format-kits/{formatKitId}/quote, POST /format-kits/{formatKitId}/order, POST /format-kits/{formatKitId}/deliver"
  - priority: 22
    category: state
    check: "ServiceContract.status == ACTIVE"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /pm-visits, POST /warranty-claims/{warrantyClaimId}/adjudicate, POST /warranty-claims/{warrantyClaimId}/void"
  - priority: 23
    category: state
    check: "the ServiceContract is in the state the requested transition starts from (DRAFT for activate, ACTIVE for expire and terminate)"
    error_id: ERR_INVALID_CONTRACT_STATE
    http_status: 409
    applies_to: "POST /service-contracts/{serviceContractId}/activate, POST /service-contracts/{serviceContractId}/expire, POST /service-contracts/{serviceContractId}/terminate"
  - priority: 24
    category: state
    check: "no WarrantyClaim on the contract has status IN {SUBMITTED, PRODUCT_VARIATION_REVIEW, DEFECT_REVIEW}"
    error_id: ERR_CLAIM_STILL_OPEN
    http_status: 409
    applies_to: "POST /service-contracts/{serviceContractId}/terminate"
  - priority: 25
    category: state
    check: "FieldEngineer.status == AVAILABLE"
    error_id: ERR_ENGINEER_ON_LEAVE
    http_status: 409
    applies_to: "POST /pm-visits"
  - priority: 26
    category: state
    check: "the PreventiveMaintenanceVisit is in the state the requested transition starts from (SCHEDULED or BILLABLE_HOLD for complete and cancel)"
    error_id: ERR_INVALID_VISIT_STATE
    http_status: 409
    applies_to: "POST /pm-visits/{pmVisitId}/complete, POST /pm-visits/{pmVisitId}/cancel"
  - priority: 27
    category: state
    check: "the WarrantyClaim is in the state the requested transition starts from (SUBMITTED or the sibling review state for a branch sign-off, a review state for adjudicate, ADJUDICATED for void) and the branch being signed off is not already done"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /warranty-claims/{warrantyClaimId}/reviews/product-variation, POST /warranty-claims/{warrantyClaimId}/reviews/defect, POST /warranty-claims/{warrantyClaimId}/adjudicate, POST /warranty-claims/{warrantyClaimId}/void, POST /warranty-claim-lines"
  - priority: 28
    category: state
    check: "both product_variation_review_done and defect_review_done are true (the fork-join point)"
    error_id: ERR_CLAIM_REVIEWS_INCOMPLETE
    http_status: 409
    applies_to: "POST /warranty-claims/{warrantyClaimId}/adjudicate"
  - priority: 29
    category: state
    check: "StockingRecommendation.status == ACTIVE"
    error_id: ERR_INVALID_RECOMMENDATION_STATE
    http_status: 409
    applies_to: "POST /stocking-recommendations/{stockingRecommendationId}/obsolescence-notice"
  - priority: 30
    category: state
    check: "expected_machine_order_version equals the current MachineOrder.version (OCC, concurrency_rules.build-slot-create-stale-order)"
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    applies_to: "POST /build-slots"
  - priority: 31
    category: state
    check: "expected_installed_machine_version equals the current InstalledMachine.version (OCC, concurrency_rules.stocking-recommendation-create-stale-machine)"
    error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412
    applies_to: "POST /stocking-recommendations"
  - priority: 32
    category: business_safety
    check: "customer_product_supplied == true - no acceptance test may run without the customer's own product"
    error_id: ERR_CUSTOMER_PRODUCT_REQUIRED
    http_status: 422
    applies_to: "POST /acceptance-tests/{acceptanceTestId}/start"
  - priority: 33
    category: business_safety
    check: "containers_supplied_count >= 500 for kind == FAT, >= 200 for kind == SAT"
    error_id: ERR_INSUFFICIENT_CONTAINERS
    http_status: 422
    applies_to: "POST /acceptance-tests/{acceptanceTestId}/start"
  - priority: 34
    category: business_safety
    check: "operators_trained_count >= required_operators_trained for kind == SAT (no site sign-off with an untrained crew)"
    error_id: ERR_OPERATOR_TRAINING_INCOMPLETE
    http_status: 422
    applies_to: "POST /acceptance-tests/{acceptanceTestId}/finalize"
  - priority: 35
    category: business_safety
    check: "FieldEngineer.certifications contains the MachineModel.machine_family of the covered machine"
    error_id: ERR_ENGINEER_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /pm-visits"
  - priority: 36
    category: business_safety
    check: "InstalledMachine.remote_diagnostics_enabled == true when visit_type == REMOTE_DIAGNOSTIC"
    error_id: ERR_REMOTE_DIAGNOSTICS_DISABLED
    http_status: 422
    applies_to: "POST /pm-visits"
  - priority: 37
    category: business_temporal
    check: "logical clock UTC date >= LongLeadComponent.promised_date"
    error_id: ERR_COMPONENT_NOT_DUE
    http_status: 422
    applies_to: "POST /long-lead-components/{longLeadComponentId}/receive"
  - priority: 38
    category: business_temporal
    check: "start_date >= max(promised_date) over the order's ON_ORDER/RECEIVED components (calculations.slot_earliest_start)"
    error_id: ERR_SLOT_BEFORE_COMPONENTS
    http_status: 422
    applies_to: "POST /build-slots"
  - priority: 39
    category: business_temporal
    check: "logical clock UTC date >= the date the kit entered ORDERED plus FormatKit.quoted_lead_time_days days"
    error_id: ERR_KIT_LEAD_TIME_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /format-kits/{formatKitId}/deliver"
  - priority: 40
    category: business_temporal
    check: "ServiceContract.start_date <= logical clock UTC date <= ServiceContract.end_date at activation"
    error_id: ERR_CONTRACT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /service-contracts/{serviceContractId}/activate"
  - priority: 41
    category: business_temporal
    check: "logical clock UTC date > ServiceContract.end_date before the contract may be expired"
    error_id: ERR_CONTRACT_NOT_EXPIRABLE
    http_status: 422
    applies_to: "POST /service-contracts/{serviceContractId}/expire"
  - priority: 42
    category: business_temporal
    check: "[start_ts, end_ts] lies inside [ServiceContract.start_date T00:00:00.000Z, ServiceContract.end_date T23:59:59.999Z]"
    error_id: ERR_VISIT_OUTSIDE_CONTRACT_TERM
    http_status: 422
    applies_to: "POST /pm-visits"
  - priority: 43
    category: business_temporal
    check: "logical clock UTC timestamp >= PreventiveMaintenanceVisit.end_ts"
    error_id: ERR_VISIT_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /pm-visits/{pmVisitId}/complete"
  - priority: 44
    category: business_constraint
    check: "ProductTrial.retest_count < 2 before another RETEST or another start-testing from RETEST_REQUIRED"
    error_id: ERR_TRIAL_RETEST_LIMIT
    http_status: 409
    applies_to: "POST /product-trials/{productTrialId}/record-result, POST /product-trials/{productTrialId}/start-testing"
  - priority: 45
    category: business_constraint
    check: "MachineModel.min_container_diameter_mm <= container_diameter_mm <= MachineModel.max_container_diameter_mm"
    error_id: ERR_CONTAINER_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /product-trials/{productTrialId}/start-testing"
  - priority: 46
    category: business_constraint
    check: "ProductionLine.machine_family == MachineModel.machine_family of the order's model"
    error_id: ERR_LINE_FAMILY_MISMATCH
    http_status: 422
    applies_to: "POST /build-slots"
  - priority: 47
    category: business_constraint
    check: "no committed slot on the line collides under buffer-extended half-open arithmetic (calculations.line_slot_collision)"
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /build-slots"
  - priority: 48
    category: business_constraint
    check: "no SCHEDULED/BILLABLE_HOLD visit of the same engineer collides under closed-interval arithmetic (calculations.engineer_visit_collision)"
    error_id: ERR_ENGINEER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /pm-visits"
  - priority: 49
    category: business_constraint
    check: "no AcceptanceTest of the same kind for the same order is already in status IN {SCHEDULED, IN_PROGRESS}"
    error_id: ERR_DUPLICATE_ACCEPTANCE_TEST
    http_status: 409
    applies_to: "POST /acceptance-tests"
  - priority: 50
    category: business_constraint
    check: "FormatKit.component_count >= 1 (an empty components array cannot be quoted)"
    error_id: ERR_KIT_HAS_NO_COMPONENTS
    http_status: 422
    applies_to: "POST /format-kits/{formatKitId}/quote"
  - priority: 51
    category: business_constraint
    check: "at least one WarrantyClaimLine exists for the claim before either review branch may be signed off"
    error_id: ERR_CLAIM_HAS_NO_LINES
    http_status: 422
    applies_to: "POST /warranty-claims/{warrantyClaimId}/reviews/product-variation, POST /warranty-claims/{warrantyClaimId}/reviews/defect"
  - priority: 52
    category: business_constraint
    check: "notice_type is strictly forward in the chain ACTIVE -> NOTICE_ISSUED -> LAST_TIME_BUY -> OBSOLETE"
    error_id: ERR_OBSOLESCENCE_REGRESSION
    http_status: 422
    applies_to: "POST /stocking-recommendations/{stockingRecommendationId}/obsolescence-notice"
  - priority: 53
    category: business_constraint
    check: "field_engineer_id is non-null when visit_type IN {PM, CORRECTIVE}"
    error_id: ERR_ENGINEER_REQUIRED
    http_status: 422
    applies_to: "POST /pm-visits"
  - priority: 54
    category: business_constraint
    check: "serial_number is unique across InstalledMachine, and line_code / model_code are unique across their own entities"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /installed-machines, POST /production-lines, POST /machine-models"
  - priority: 55
    category: business_referential
    check: "ProductTrial.customer_id == MachineOrder.customer_id AND ProductTrial.machine_model_id == MachineOrder.machine_model_id"
    error_id: ERR_TRIAL_ORDER_MISMATCH
    http_status: 422
    applies_to: "POST /machine-orders/{machineOrderId}/engineer"
  - priority: 56
    category: business_referential
    check: "FieldEngineer.region_code == Customer.region_code resolved through ServiceContract -> InstalledMachine -> Customer"
    error_id: ERR_ENGINEER_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /pm-visits"
  - priority: 57
    category: business_referential
    check: "ServiceContract.installed_machine_id == the claim's installed_machine_id"
    error_id: ERR_CONTRACT_MACHINE_MISMATCH
    http_status: 422
    applies_to: "POST /warranty-claims"
  - priority: 58
    category: business_referential
    check: "InstalledMachine.machine_order_id == the order named in the request AND InstalledMachine.customer_id == MachineOrder.customer_id"
    error_id: ERR_MACHINE_ORDER_CUSTOMER_MISMATCH
    http_status: 422
    applies_to: "POST /installed-machines"
  - priority: 59
    category: business_fiscal
    check: "ProductionLine.committed_slot_days + this slot's slot_days <= ProductionLine.capacity_days_per_quarter"
    error_id: ERR_LINE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /build-slots"
  - priority: 60
    category: business_fiscal
    check: "ServiceContract.coverage_posture != BUDGET_EXHAUSTED"
    error_id: ERR_COVERAGE_EXHAUSTED
    http_status: 402
    applies_to: "POST /pm-visits"
  - priority: 61
    category: business_fiscal
    check: "ServiceContract.coverage_posture == RESTRICTED forbids visit_type == CORRECTIVE"
    error_id: ERR_POSTURE_RESTRICTED
    http_status: 402
    applies_to: "POST /pm-visits"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/packaging-oem/customers"
    description: "register a customer plant"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, region_code, product_variation_pct]
    output: Customer
    side_effects: ["Customer created with status ACTIVE and open_order_count 0"]
  - method: GET
    path: "/packaging-oem/customers/{customerId}"
    description: "read one customer"
    roles: [PlatformAdmin, ApplicationEngineer, ProductionPlanner, QualityInspector, ServiceManager, CustomerContact]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: POST
    path: "/packaging-oem/customers/{customerId}/suspend"
    description: "suspend a customer account (credit hold)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["Customer.status set to SUSPENDED"]
  - method: POST
    path: "/packaging-oem/machine-models"
    description: "publish a catalog machine model"
    roles: [PlatformAdmin]
    code: 201
    input: [model_code, machine_family, nameplate_rate_cpm, guarantee_efficiency_pct, base_price_cents, min_container_diameter_mm, max_container_diameter_mm]
    output: MachineModel
    side_effects: ["MachineModel created with lifecycle_status ACTIVE and open_defect_review_count 0"]
  - method: GET
    path: "/packaging-oem/machine-models/{machineModelId}"
    description: "read one machine model"
    roles: [PlatformAdmin, ApplicationEngineer, ProductionPlanner, QualityInspector, ServiceManager, CustomerContact]
    code: 200
    input: []
    output: MachineModel
    side_effects: []
  - method: POST
    path: "/packaging-oem/machine-models/{machineModelId}/obsolete"
    description: "mark a catalog model obsolete"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: MachineModel
    side_effects: ["MachineModel.lifecycle_status set to OBSOLETE"]
  - method: POST
    path: "/packaging-oem/production-lines"
    description: "create a factory production line"
    roles: [PlatformAdmin]
    code: 201
    input: [line_code, machine_family, changeover_buffer_days, capacity_days_per_quarter]
    output: ProductionLine
    side_effects: ["ProductionLine created with status OPEN and committed_slot_days 0"]
  - method: GET
    path: "/packaging-oem/production-lines/{productionLineId}"
    description: "read one production line including its committed_slot_days ledger"
    roles: [PlatformAdmin, ProductionPlanner, ApplicationEngineer, QualityInspector]
    code: 200
    input: []
    output: ProductionLine
    side_effects: []
  - method: POST
    path: "/packaging-oem/production-lines/{productionLineId}/maintenance-hold"
    description: "take a line out of service"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ProductionLine
    side_effects: ["ProductionLine.status set to MAINTENANCE"]
  - method: POST
    path: "/packaging-oem/field-engineers"
    description: "register a field service engineer"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, region_code, certifications, "travel_buffer_minutes?"]
    output: FieldEngineer
    side_effects: ["FieldEngineer created with status AVAILABLE"]
  - method: GET
    path: "/packaging-oem/field-engineers/{fieldEngineerId}"
    description: "read one field engineer"
    roles: [PlatformAdmin, ServiceManager]
    code: 200
    input: []
    output: FieldEngineer
    side_effects: []
  - method: POST
    path: "/packaging-oem/field-engineers/{fieldEngineerId}/leave"
    description: "put an engineer on leave"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: FieldEngineer
    side_effects: ["FieldEngineer.status set to ON_LEAVE"]
  - method: POST
    path: "/packaging-oem/_clock/set_current_utc"
    description: |
      test-driving endpoint: move the server's logical clock. The clock's startup default is exactly
      2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and
      MUST NOT fall back to real wall-clock time. Every date/deadline rule in this scaffold
      (component promised_date, kit lead time, contract term, visit completion) reads this clock.
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock set to to_iso8601; no entity rows are mutated"]

  - method: POST
    path: "/packaging-oem/product-trials"
    description: "open an application-engineering product trial"
    roles: [ApplicationEngineer, CustomerContact]
    code: 201
    input: [customer_id, machine_model_id, product_name, container_family, container_diameter_mm]
    output: ProductTrial
    side_effects: ["ProductTrial created in status SUBMITTED with retest_count 0 and config_recommendation PENDING"]
  - method: GET
    path: "/packaging-oem/product-trials"
    description: "list trials, filterable by customer, model and status"
    roles: [ApplicationEngineer, PlatformAdmin, CustomerContact]
    code: 200
    input: ["customer_id?", "machine_model_id?", "status?", "limit?", "offset?"]
    output: ProductTrial[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/product-trials/{productTrialId}"
    description: "read one trial"
    roles: [ApplicationEngineer, PlatformAdmin, CustomerContact]
    code: 200
    input: []
    output: ProductTrial
    side_effects: []
  - method: POST
    path: "/packaging-oem/product-trials/{productTrialId}/start-testing"
    description: "move a trial onto the rig (also the retest cycle edge)"
    roles: [ApplicationEngineer]
    code: 200
    input: []
    output: ProductTrial
    side_effects: ["status -> TESTING", "retest_count incremented by 1 when the previous state was RETEST_REQUIRED"]
  - method: POST
    path: "/packaging-oem/product-trials/{productTrialId}/record-result"
    description: "record a trial run outcome and recompute the configuration recommendation"
    roles: [ApplicationEngineer]
    code: 200
    input: [measured_rate_cpm, outcome]
    output: ProductTrial
    side_effects: ["measured_rate_cpm stored", "rate_ratio_pct and config_recommendation recomputed by calculations.trial_config_recommendation", "status -> PASSED | RETEST_REQUIRED | REJECTED per outcome"]

  - method: POST
    path: "/packaging-oem/machine-orders"
    description: "create a build-to-order machine order against a trial"
    roles: [ApplicationEngineer]
    code: 201
    input: [customer_id, machine_model_id, product_trial_id, equipment_price_cents, "change_parts_price_cents?", "guarantee_basis?"]
    output: MachineOrder
    side_effects: ["MachineOrder created with fulfillment_status DRAFT, commercial_status QUOTED, version 1", "Customer.open_order_count recomputed"]
  - method: GET
    path: "/packaging-oem/machine-orders"
    description: "list orders, filterable by customer, model, trial and either status dimension"
    roles: [ApplicationEngineer, ProductionPlanner, QualityInspector, ServiceManager, PlatformAdmin, CustomerContact]
    code: 200
    input: ["customer_id?", "machine_model_id?", "product_trial_id?", "fulfillment_status?", "commercial_status?", "limit?", "offset?"]
    output: MachineOrder[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/machine-orders/{machineOrderId}"
    description: "read one order including both status dimensions, the priced roll-up and version"
    roles: [ApplicationEngineer, ProductionPlanner, QualityInspector, ServiceManager, PlatformAdmin, CustomerContact]
    code: 200
    input: []
    output: MachineOrder
    side_effects: []
  - method: POST
    path: "/packaging-oem/machine-orders/{machineOrderId}/engineer"
    description: "release the order to engineering and price the roll-up"
    roles: [ApplicationEngineer]
    code: 200
    input: []
    output: MachineOrder
    side_effects: ["fulfillment_status DRAFT -> ENGINEERED", "discount_tier, commissioning_fee_cents and order_total_cents computed by calculations.order_total_rollup", "increments MachineOrder.version by 1"]
  - method: POST
    path: "/packaging-oem/machine-orders/{machineOrderId}/commercial-advance"
    description: "advance the independent commercial dimension"
    roles: [PlatformAdmin]
    code: 200
    input: [target_status]
    output: MachineOrder
    side_effects: ["commercial_status advanced to target_status", "increments MachineOrder.version by 1"]
  - method: POST
    path: "/packaging-oem/machine-orders/{machineOrderId}/ship"
    description: "ship a FAT-passed machine"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: MachineOrder
    side_effects: ["fulfillment_status FAT_PASSED -> SHIPPED", "increments MachineOrder.version by 1"]

  - method: POST
    path: "/packaging-oem/long-lead-components"
    description: "add a long-lead procurement line to an order"
    roles: [ProductionPlanner]
    code: 201
    input: [machine_order_id, part_number, lead_time_days]
    output: LongLeadComponent
    side_effects: ["LongLeadComponent created in status PLANNED with null po_released_on and null promised_date"]
  - method: GET
    path: "/packaging-oem/long-lead-components"
    description: "list procurement lines, filterable by order and status"
    roles: [ProductionPlanner, ApplicationEngineer, PlatformAdmin]
    code: 200
    input: ["machine_order_id?", "status?", "limit?", "offset?"]
    output: LongLeadComponent[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/long-lead-components/{longLeadComponentId}"
    description: "read one procurement line including its promised_date"
    roles: [ProductionPlanner, ApplicationEngineer, PlatformAdmin]
    code: 200
    input: []
    output: LongLeadComponent
    side_effects: []
  - method: POST
    path: "/packaging-oem/long-lead-components/{longLeadComponentId}/release-po"
    description: "release the purchase order and stamp the promised date from the logical clock"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: LongLeadComponent
    side_effects: ["status PLANNED -> ON_ORDER", "po_released_on set to the logical clock UTC date", "promised_date set to po_released_on + lead_time_days days"]
  - method: POST
    path: "/packaging-oem/long-lead-components/{longLeadComponentId}/receive"
    description: "book the component into the factory (only on or after its promised date)"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: LongLeadComponent
    side_effects: ["status ON_ORDER -> RECEIVED"]

  - method: POST
    path: "/packaging-oem/build-slots"
    description: |
      reserve a build slot on a production line. Supersedes the order's prior RESERVED slot; requires
      the OCC field expected_machine_order_version to match MachineOrder.version.
    roles: [ProductionPlanner]
    code: 201
    input: [machine_order_id, production_line_id, start_date, requested_slot_days, expected_machine_order_version]
    output: BuildSlot
    side_effects:
      - "BuildSlot created in status RESERVED with slot_days and end_date from calculations.slot_days_and_end_date"
      - "any prior RESERVED slot of the same order -> RELEASED with superseded_by_slot_id set"
      - "ProductionLine.committed_slot_days recomputed by calculations.line_committed_days_ledger"
      - "increments MachineOrder.version by 1"
  - method: GET
    path: "/packaging-oem/build-slots"
    description: "list build slots, filterable by order, line, status and supersede link"
    roles: [ProductionPlanner, ApplicationEngineer, QualityInspector, PlatformAdmin]
    code: 200
    input: ["machine_order_id?", "production_line_id?", "status?", "superseded_by_slot_id?", "limit?", "offset?"]
    output: BuildSlot[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/build-slots/{buildSlotId}"
    description: "read one build slot including slot_days and end_date"
    roles: [ProductionPlanner, ApplicationEngineer, QualityInspector, PlatformAdmin]
    code: 200
    input: []
    output: BuildSlot
    side_effects: []
  - method: POST
    path: "/packaging-oem/build-slots/{buildSlotId}/confirm"
    description: "commit the slot; bubbles the order up to SLOTTED"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: BuildSlot
    side_effects: ["status RESERVED -> CONFIRMED", "MachineOrder.fulfillment_status ENGINEERED -> SLOTTED"]
  - method: POST
    path: "/packaging-oem/build-slots/{buildSlotId}/start-build"
    description: "start (or restart after rework) the build on this slot"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: BuildSlot
    side_effects: ["status CONFIRMED|REWORK_HOLD -> IN_BUILD", "MachineOrder.fulfillment_status SLOTTED -> IN_BUILD or FAT_FAILED -> IN_BUILD"]
  - method: POST
    path: "/packaging-oem/build-slots/{buildSlotId}/release"
    description: "release a reserved or confirmed slot back to the line"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: BuildSlot
    side_effects: ["status RESERVED|CONFIRMED -> RELEASED", "ProductionLine.committed_slot_days credited by exactly slot_days", "a CONFIRMED release also moves MachineOrder.fulfillment_status SLOTTED -> ENGINEERED"]

  - method: POST
    path: "/packaging-oem/acceptance-tests"
    description: "book a factory (FAT) or site (SAT) acceptance test for an order"
    roles: [QualityInspector]
    code: 201
    input: [machine_order_id, kind, scheduled_on, "required_operators_trained?"]
    output: AcceptanceTest
    side_effects: ["AcceptanceTest created in status SCHEDULED"]
  - method: GET
    path: "/packaging-oem/acceptance-tests"
    description: "list acceptance tests, filterable by order, kind and status"
    roles: [QualityInspector, ApplicationEngineer, ProductionPlanner, ServiceManager, PlatformAdmin]
    code: 200
    input: ["machine_order_id?", "kind?", "status?", "limit?", "offset?"]
    output: AcceptanceTest[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/acceptance-tests/{acceptanceTestId}"
    description: "read one acceptance test including attainment_pct and guarantee_met"
    roles: [QualityInspector, ApplicationEngineer, ProductionPlanner, ServiceManager, PlatformAdmin]
    code: 200
    input: []
    output: AcceptanceTest
    side_effects: []
  - method: POST
    path: "/packaging-oem/acceptance-tests/{acceptanceTestId}/start"
    description: "start the run; the customer's own product and containers must be on site"
    roles: [QualityInspector]
    code: 200
    input: [customer_product_supplied, containers_supplied_count]
    output: AcceptanceTest
    side_effects: ["status SCHEDULED -> IN_PROGRESS", "customer_product_supplied and containers_supplied_count stored"]
  - method: POST
    path: "/packaging-oem/acceptance-tests/{acceptanceTestId}/finalize"
    description: "score the run against the performance guarantee and fire the downstream cascade"
    roles: [QualityInspector]
    code: 200
    input: [measured_rate_cpm, measured_efficiency_pct, "operators_trained_count?"]
    output: AcceptanceTest
    side_effects:
      - "attainment_pct and guarantee_met computed by calculations.guarantee_attainment under the order's guarantee_basis variant"
      - "status IN_PROGRESS -> PASSED | FAILED"
      - "FAT pass: order -> FAT_PASSED and its IN_BUILD slot -> COMPLETED, then ProductionLine.committed_slot_days recomputed"
      - "FAT fail: the four-hop rework cascade (order rework_days, slot REWORK_HOLD + extension, line ledger, displacement sweep) fires"
      - "SAT pass: order -> ACCEPTED and its InstalledMachine -> ACCEPTED"

  - method: POST
    path: "/packaging-oem/installed-machines"
    description: "record the installation of a shipped machine on the customer site"
    roles: [ServiceManager]
    code: 201
    input: [machine_order_id, customer_id, serial_number, "remote_diagnostics_enabled?"]
    output: InstalledMachine
    side_effects: ["InstalledMachine created in status INSTALLED with current_format_family from the order's trial", "MachineOrder.fulfillment_status SHIPPED -> INSTALLED"]
  - method: GET
    path: "/packaging-oem/installed-machines"
    description: "list installed assets, filterable by order, customer and status"
    roles: [ServiceManager, QualityInspector, PlatformAdmin, CustomerContact]
    code: 200
    input: ["machine_order_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: InstalledMachine[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/installed-machines/{installedMachineId}"
    description: "read one installed asset including current_format_family and version"
    roles: [ServiceManager, QualityInspector, PlatformAdmin, CustomerContact]
    code: 200
    input: []
    output: InstalledMachine
    side_effects: []

  - method: POST
    path: "/packaging-oem/format-kits"
    description: "draft a change-parts / format kit for a new container size"
    roles: [ServiceManager]
    code: 201
    input: [installed_machine_id, container_family, container_diameter_mm, components]
    output: FormatKit
    side_effects: ["FormatKit created in status DRAFT with component_count = len(components), quoted_lead_time_days 0 and price_cents 0"]
  - method: GET
    path: "/packaging-oem/format-kits"
    description: "list format kits, filterable by machine and status"
    roles: [ServiceManager, PlatformAdmin, CustomerContact]
    code: 200
    input: ["installed_machine_id?", "status?", "limit?", "offset?"]
    output: FormatKit[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/format-kits/{formatKitId}"
    description: "read one kit including its quoted lead time and price"
    roles: [ServiceManager, PlatformAdmin, CustomerContact]
    code: 200
    input: []
    output: FormatKit
    side_effects: []
  - method: POST
    path: "/packaging-oem/format-kits/{formatKitId}/quote"
    description: "price the kit and quote its delivery lead time"
    roles: [ServiceManager]
    code: 200
    input: []
    output: FormatKit
    side_effects: ["status DRAFT -> QUOTED", "quoted_lead_time_days computed by calculations.format_kit_lead_time", "price_cents computed by calculations.format_kit_price"]
  - method: POST
    path: "/packaging-oem/format-kits/{formatKitId}/order"
    description: "customer accepts the kit quote"
    roles: [CustomerContact]
    code: 200
    input: []
    output: FormatKit
    side_effects: ["status QUOTED -> ORDERED"]
  - method: POST
    path: "/packaging-oem/format-kits/{formatKitId}/deliver"
    description: "deliver and fit the kit; the machine's current format family changes"
    roles: [ServiceManager]
    code: 200
    input: []
    output: FormatKit
    side_effects: ["status ORDERED -> DELIVERED", "InstalledMachine.current_format_family set to the kit's container_family", "increments InstalledMachine.version by 1"]

  - method: POST
    path: "/packaging-oem/service-contracts"
    description: "draft a service contract over an installed machine"
    roles: [ServiceManager]
    code: 201
    input: [installed_machine_id, tier, start_date, end_date, pm_visits_included, goodwill_budget_initial_cents]
    output: ServiceContract
    side_effects: ["ServiceContract created in status DRAFT with goodwill_budget_cents 0 and coverage_posture OPEN"]
  - method: GET
    path: "/packaging-oem/service-contracts"
    description: "list contracts, filterable by machine and status"
    roles: [ServiceManager, PlatformAdmin, CustomerContact]
    code: 200
    input: ["installed_machine_id?", "status?", "limit?", "offset?"]
    output: ServiceContract[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/service-contracts/{serviceContractId}"
    description: "read one contract including the goodwill ledger and coverage posture"
    roles: [ServiceManager, PlatformAdmin, CustomerContact]
    code: 200
    input: []
    output: ServiceContract
    side_effects: []
  - method: POST
    path: "/packaging-oem/service-contracts/{serviceContractId}/activate"
    description: "activate coverage and fund the goodwill pot"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status DRAFT -> ACTIVE", "goodwill_budget_cents set to goodwill_budget_initial_cents", "coverage_posture computed by calculations.coverage_posture"]
  - method: POST
    path: "/packaging-oem/service-contracts/{serviceContractId}/expire"
    description: "expire a contract whose term has passed"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status ACTIVE -> EXPIRED", "every SCHEDULED/BILLABLE_HOLD visit of the contract -> CANCELLED"]
  - method: POST
    path: "/packaging-oem/service-contracts/{serviceContractId}/terminate"
    description: "terminate a contract early (no open claims allowed)"
    roles: [ServiceManager]
    code: 200
    input: []
    output: ServiceContract
    side_effects: ["status ACTIVE -> TERMINATED", "every SCHEDULED/BILLABLE_HOLD visit of the contract -> CANCELLED"]

  - method: POST
    path: "/packaging-oem/pm-visits"
    description: "book a preventive-maintenance, remote-diagnostic or corrective visit"
    roles: [ServiceManager]
    code: 201
    input: [service_contract_id, "field_engineer_id?", visit_type, start_ts, end_ts]
    output: PreventiveMaintenanceVisit
    side_effects: ["visit created in status SCHEDULED", "billable computed by calculations.pm_visit_billability", "ServiceContract.pm_visits_used recomputed"]
  - method: GET
    path: "/packaging-oem/pm-visits"
    description: "list visits, filterable by contract, engineer and status"
    roles: [ServiceManager, PlatformAdmin, CustomerContact]
    code: 200
    input: ["service_contract_id?", "field_engineer_id?", "status?", "limit?", "offset?"]
    output: PreventiveMaintenanceVisit[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/pm-visits/{pmVisitId}"
    description: "read one visit including its billable flag"
    roles: [ServiceManager, PlatformAdmin, CustomerContact]
    code: 200
    input: []
    output: PreventiveMaintenanceVisit
    side_effects: []
  - method: POST
    path: "/packaging-oem/pm-visits/{pmVisitId}/complete"
    description: "close out a visit after its window has elapsed"
    roles: [ServiceManager]
    code: 200
    input: [findings_code]
    output: PreventiveMaintenanceVisit
    side_effects: ["status SCHEDULED|BILLABLE_HOLD -> COMPLETED", "findings_code stored", "ServiceContract.pm_visits_used recomputed"]
  - method: POST
    path: "/packaging-oem/pm-visits/{pmVisitId}/cancel"
    description: "cancel a visit and free the engineer's window"
    roles: [ServiceManager]
    code: 200
    input: []
    output: PreventiveMaintenanceVisit
    side_effects: ["status SCHEDULED|BILLABLE_HOLD -> CANCELLED", "the engineer's closed interval is freed", "ServiceContract.pm_visits_used recomputed"]

  - method: POST
    path: "/packaging-oem/warranty-claims"
    description: "open a warranty claim on an installed machine"
    roles: [ServiceManager, CustomerContact]
    code: 201
    input: [installed_machine_id, service_contract_id, failure_summary]
    output: WarrantyClaim
    side_effects: ["WarrantyClaim created in status SUBMITTED with both review booleans false and cause UNDETERMINED", "InstalledMachine.open_claim_count recomputed"]
  - method: GET
    path: "/packaging-oem/warranty-claims"
    description: "list claims, filterable by machine, contract and status"
    roles: [ServiceManager, QualityInspector, PlatformAdmin, CustomerContact]
    code: 200
    input: ["installed_machine_id?", "service_contract_id?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/warranty-claims/{warrantyClaimId}"
    description: "read one claim including the apportioned shares and goodwill charge"
    roles: [ServiceManager, QualityInspector, PlatformAdmin, CustomerContact]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/packaging-oem/warranty-claim-lines"
    description: "add an immutable cost line to a claim"
    roles: [ServiceManager]
    code: 201
    input: [warranty_claim_id, line_label, amount_cents, defect_attribution_pct]
    output: WarrantyClaimLine
    side_effects: ["WarrantyClaimLine created with oem_line_share_cents 0 (populated at adjudication)", "WarrantyClaim.claimed_cost_cents recomputed"]
  - method: GET
    path: "/packaging-oem/warranty-claim-lines"
    description: "list claim lines, filterable by claim"
    roles: [ServiceManager, QualityInspector, PlatformAdmin, CustomerContact]
    code: 200
    input: ["warranty_claim_id?", "limit?", "offset?"]
    output: WarrantyClaimLine[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/warranty-claim-lines/{claimLineId}"
    description: "read one claim line including its apportioned oem_line_share_cents"
    roles: [ServiceManager, QualityInspector, PlatformAdmin, CustomerContact]
    code: 200
    input: []
    output: WarrantyClaimLine
    side_effects: []
  - method: POST
    path: "/packaging-oem/warranty-claims/{warrantyClaimId}/reviews/product-variation"
    description: "sign off the product-variation branch of the claim fork"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["product_variation_review_done set to true", "claimed_cost_cents recomputed from the lines", "status SUBMITTED -> PRODUCT_VARIATION_REVIEW (unchanged if the defect branch already owns the status)"]
  - method: POST
    path: "/packaging-oem/warranty-claims/{warrantyClaimId}/reviews/defect"
    description: "sign off the machine-defect branch of the claim fork"
    roles: [QualityInspector]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["defect_review_done set to true", "MachineModel.open_defect_review_count incremented by 1", "status SUBMITTED -> DEFECT_REVIEW (unchanged if the variation branch already owns the status)"]
  - method: POST
    path: "/packaging-oem/warranty-claims/{warrantyClaimId}/adjudicate"
    description: "join the fork: classify the cause, apportion the cost and charge goodwill"
    roles: [ServiceManager]
    code: 200
    input: [resolution]
    output: WarrantyClaim
    side_effects:
      - "cause computed by calculations.claim_cause_classification"
      - "per-line oem_line_share_cents, oem_share_cents and customer_share_cents computed by calculations.claim_cost_apportionment"
      - "APPROVE: goodwill_charged_cents computed by calculations.claim_goodwill_charge and debited from ServiceContract.goodwill_budget_cents"
      - "APPROVE: ServiceContract.coverage_posture recomputed; on BUDGET_EXHAUSTED every SCHEDULED visit of the contract -> BILLABLE_HOLD with billable true"
      - "status -> ADJUDICATED | REJECTED"
  - method: POST
    path: "/packaging-oem/warranty-claims/{warrantyClaimId}/void"
    description: "void an adjudicated claim and reverse its goodwill charge"
    roles: [ServiceManager]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "status ADJUDICATED -> VOID"
      - "ServiceContract.goodwill_budget_cents credited by exactly goodwill_charged_cents, then coverage_posture recomputed"
      - "BILLABLE_HOLD visits of the contract return to SCHEDULED with billable recomputed when the posture leaves BUDGET_EXHAUSTED"
      - "goodwill_charged_cents, oem_share_cents and customer_share_cents reset to 0"
      - "MachineModel.open_defect_review_count decremented by 1"

  - method: POST
    path: "/packaging-oem/stocking-recommendations"
    description: |
      publish a spare-parts stocking recommendation for a machine. Supersedes the prior ACTIVE
      recommendation for the same part; requires expected_installed_machine_version to match.
    roles: [ServiceManager]
    code: 201
    input: [installed_machine_id, part_number, annual_usage_qty, unit_lead_time_days, criticality, basis, expected_installed_machine_version]
    output: StockingRecommendation
    side_effects:
      - "prior ACTIVE recommendation for the same machine and part_number -> SUPERSEDED"
      - "recommended_qty computed by calculations.spare_stocking_qty under the requested basis variant"
      - "increments InstalledMachine.version by 1"
  - method: GET
    path: "/packaging-oem/stocking-recommendations"
    description: "list stocking recommendations, filterable by machine, part and status"
    roles: [ServiceManager, PlatformAdmin, CustomerContact]
    code: 200
    input: ["installed_machine_id?", "part_number?", "status?", "limit?", "offset?"]
    output: StockingRecommendation[]
    side_effects: []
  - method: GET
    path: "/packaging-oem/stocking-recommendations/{stockingRecommendationId}"
    description: "read one stocking recommendation including recommended_qty"
    roles: [ServiceManager, PlatformAdmin, CustomerContact]
    code: 200
    input: []
    output: StockingRecommendation
    side_effects: []
  - method: POST
    path: "/packaging-oem/stocking-recommendations/{stockingRecommendationId}/obsolescence-notice"
    description: "publish an obsolescence notice and re-cut the recommended quantity"
    roles: [ServiceManager]
    code: 200
    input: [notice_type]
    output: StockingRecommendation
    side_effects: ["obsolescence_status set to notice_type", "recommended_qty recomputed by calculations.spare_stocking_qty with the new obsolescence multiplier"]

errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    when: "the X-User-Role or X-User-ID header is absent or blank"
  - error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    when: "the caller's role is not listed in the called endpoint's roles"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    when: "malformed body or query: missing required field, wrong type, unknown enum member, out-of-range number, end before start, limit outside [1,100], negative offset"
  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    when: "a CustomerContact addresses a resource that does not roll up to their own Customer row"
  - error_id: ERR_CUSTOMER_NOT_FOUND
    http_status: 404
    when: "the referenced customer_id does not exist"
  - error_id: ERR_MACHINE_MODEL_NOT_FOUND
    http_status: 404
    when: "the referenced machine_model_id does not exist"
  - error_id: ERR_PRODUCT_TRIAL_NOT_FOUND
    http_status: 404
    when: "the referenced product trial does not exist"
  - error_id: ERR_MACHINE_ORDER_NOT_FOUND
    http_status: 404
    when: "the referenced machine order does not exist"
  - error_id: ERR_PRODUCTION_LINE_NOT_FOUND
    http_status: 404
    when: "the referenced production line does not exist"
  - error_id: ERR_BUILD_SLOT_NOT_FOUND
    http_status: 404
    when: "the referenced build slot does not exist"
  - error_id: ERR_COMPONENT_NOT_FOUND
    http_status: 404
    when: "the referenced long-lead component does not exist"
  - error_id: ERR_ACCEPTANCE_TEST_NOT_FOUND
    http_status: 404
    when: "the referenced acceptance test does not exist"
  - error_id: ERR_INSTALLED_MACHINE_NOT_FOUND
    http_status: 404
    when: "the referenced installed machine does not exist"
  - error_id: ERR_FORMAT_KIT_NOT_FOUND
    http_status: 404
    when: "the referenced format kit does not exist"
  - error_id: ERR_SERVICE_CONTRACT_NOT_FOUND
    http_status: 404
    when: "the referenced service contract does not exist"
  - error_id: ERR_FIELD_ENGINEER_NOT_FOUND
    http_status: 404
    when: "the referenced field engineer does not exist"
  - error_id: ERR_PM_VISIT_NOT_FOUND
    http_status: 404
    when: "the referenced maintenance visit does not exist"
  - error_id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http_status: 404
    when: "the referenced warranty claim does not exist"
  - error_id: ERR_CLAIM_LINE_NOT_FOUND
    http_status: 404
    when: "the referenced warranty claim line does not exist"
  - error_id: ERR_STOCKING_RECOMMENDATION_NOT_FOUND
    http_status: 404
    when: "the referenced stocking recommendation does not exist"
  - error_id: ERR_CUSTOMER_SUSPENDED
    http_status: 409
    when: "the owning Customer is SUSPENDED and the request would create new commercial exposure"
  - error_id: ERR_MODEL_OBSOLETE
    http_status: 409
    when: "the referenced MachineModel lifecycle_status is OBSOLETE"
  - error_id: ERR_INVALID_TRIAL_STATE
    http_status: 409
    when: "the product trial is not in a state that admits the requested transition"
  - error_id: ERR_TRIAL_RETEST_LIMIT
    http_status: 409
    when: "a retest is requested but retest_count already equals MAX_TRIAL_RETESTS"
  - error_id: ERR_TRIAL_NOT_PASSED
    http_status: 409
    when: "an order is engineered against a trial that is not PASSED"
  - error_id: ERR_INVALID_ORDER_STATE
    http_status: 409
    when: "the machine order's fulfillment_status does not admit the requested transition"
  - error_id: ERR_ORDER_NOT_ENGINEERED
    http_status: 409
    when: "a build slot is requested for an order that has not reached ENGINEERED"
  - error_id: ERR_COMMERCIAL_STATUS_BLOCKS_CONFIRM
    http_status: 409
    when: "a slot confirmation is attempted while the order's commercial_status is still QUOTED"
  - error_id: ERR_INVALID_SLOT_STATE
    http_status: 409
    when: "the build slot is not in a state that admits the requested transition"
  - error_id: ERR_LINE_NOT_OPEN
    http_status: 409
    when: "the target production line's status is MAINTENANCE"
  - error_id: ERR_SLOT_OVERLAP
    http_status: 409
    when: "the requested slot interval, widened by the line's changeover buffer, overlaps a live slot on the same line"
  - error_id: ERR_INVALID_COMPONENT_STATE
    http_status: 409
    when: "the long-lead component is not in a state that admits the requested transition"
  - error_id: ERR_COMPONENT_PO_NOT_RELEASED
    http_status: 409
    when: "receipt is recorded for a component whose purchase order was never released"
  - error_id: ERR_COMPONENTS_NOT_RECEIVED
    http_status: 409
    when: "the build is started while at least one long-lead component of the order is not RECEIVED"
  - error_id: ERR_INVALID_TEST_STATE
    http_status: 409
    when: "the acceptance test is not in a state that admits the requested transition"
  - error_id: ERR_DUPLICATE_ACCEPTANCE_TEST
    http_status: 409
    when: "a second live test of the same kind already exists for the order"
  - error_id: ERR_SAT_BEFORE_FAT
    http_status: 422
    when: "a SAT is scheduled on a date earlier than the order's PASSED factory acceptance test"
  - error_id: ERR_MACHINE_NOT_ACCEPTED
    http_status: 409
    when: "a service contract, format kit or claim is opened against a machine that is not ACCEPTED"
  - error_id: ERR_INVALID_KIT_STATE
    http_status: 409
    when: "the format kit is not in a state that admits the requested transition"
  - error_id: ERR_INVALID_CONTRACT_STATE
    http_status: 409
    when: "the service contract is not in a state that admits the requested transition"
  - error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    when: "a visit or claim is filed against a contract that is not ACTIVE"
  - error_id: ERR_CLAIM_STILL_OPEN
    http_status: 409
    when: "the contract is terminated while it still carries a claim that is not ADJUDICATED, REJECTED or VOID"
  - error_id: ERR_INVALID_VISIT_STATE
    http_status: 409
    when: "the maintenance visit is not in a state that admits the requested transition"
  - error_id: ERR_ENGINEER_ON_LEAVE
    http_status: 409
    when: "the nominated field engineer's status is ON_LEAVE"
  - error_id: ERR_ENGINEER_DOUBLE_BOOKED
    http_status: 409
    when: "the requested visit window touches another live visit of the same engineer"
  - error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    when: "the warranty claim is not in a state that admits the requested transition"
  - error_id: ERR_CLAIM_REVIEWS_INCOMPLETE
    http_status: 409
    when: "adjudication is attempted before both fork branches have signed off"
  - error_id: ERR_INVALID_RECOMMENDATION_STATE
    http_status: 409
    when: "the stocking recommendation is SUPERSEDED and can no longer be amended"
  - error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    when: "a natural key (customer code, model_code, line_code, serial_number, part number within a machine) is reused"
  - error_id: ERR_LINE_CAPACITY_EXCEEDED
    http_status: 409
    when: "the slot's days would push the line's committed_slot_days past capacity_days_per_quarter"
  - error_id: ERR_STALE_ORDER_VERSION
    http_status: 412
    when: "expected_machine_order_version does not match the order's current version"
  - error_id: ERR_STALE_MACHINE_VERSION
    http_status: 412
    when: "expected_installed_machine_version does not match the machine's current version"
  - error_id: ERR_CUSTOMER_PRODUCT_REQUIRED
    http_status: 422
    when: "a factory or site acceptance test is started without the customer's own product supplied"
  - error_id: ERR_INSUFFICIENT_CONTAINERS
    http_status: 422
    when: "the supplied container count is below the kind-specific minimum (500 for FAT, 200 for SAT)"
  - error_id: ERR_OPERATOR_TRAINING_INCOMPLETE
    http_status: 422
    when: "a site acceptance test is finalized with fewer trained operators than required_operators_trained"
  - error_id: ERR_ENGINEER_NOT_CERTIFIED
    http_status: 422
    when: "the nominated engineer's certifications do not cover the machine family under contract"
  - error_id: ERR_ENGINEER_REGION_MISMATCH
    http_status: 422
    when: "the nominated engineer's region_code differs from the owning customer's region_code"
  - error_id: ERR_ENGINEER_REQUIRED
    http_status: 422
    when: "an on-site visit type is booked with no field_engineer_id"
  - error_id: ERR_REMOTE_DIAGNOSTICS_DISABLED
    http_status: 422
    when: "a REMOTE_DIAGNOSTIC visit is booked on a machine whose remote_diagnostics_enabled is false"
  - error_id: ERR_CONTRACT_WINDOW_INVALID
    http_status: 422
    when: "the contract's end_date is not strictly after its start_date"
  - error_id: ERR_VISIT_OUTSIDE_CONTRACT_TERM
    http_status: 422
    when: "the visit window falls outside the contract's [start_date, end_date] term"
  - error_id: ERR_VISIT_NOT_ELAPSED
    http_status: 422
    when: "a visit is completed before its end_ts relative to the logical clock"
  - error_id: ERR_CONTRACT_NOT_EXPIRABLE
    http_status: 422
    when: "expiry is requested while the logical clock is still on or before the contract's end_date"
  - error_id: ERR_SLOT_BEFORE_COMPONENTS
    http_status: 422
    when: "the requested slot start_date precedes the earliest start implied by long-lead component promises"
  - error_id: ERR_LINE_FAMILY_MISMATCH
    http_status: 422
    when: "the production line's machine_family differs from the ordered model's machine_family"
  - error_id: ERR_COMPONENT_NOT_DUE
    http_status: 422
    when: "a purchase order is released for a component whose promised_date precedes the logical clock"
  - error_id: ERR_TRIAL_ORDER_MISMATCH
    http_status: 422
    when: "the cited trial belongs to a different customer or a different machine model than the order"
  - error_id: ERR_MACHINE_ORDER_CUSTOMER_MISMATCH
    http_status: 422
    when: "the installed machine's customer_id differs from the originating order's customer_id"
  - error_id: ERR_CONTRACT_MACHINE_MISMATCH
    http_status: 422
    when: "the claim's service contract does not cover the claim's installed machine"
  - error_id: ERR_CONTAINER_OUT_OF_RANGE
    http_status: 422
    when: "the kit's container_diameter_mm lies outside the model's supported diameter band and no out-of-range surcharge path applies"
  - error_id: ERR_KIT_HAS_NO_COMPONENTS
    http_status: 422
    when: "a format kit is quoted while its components list is empty"
  - error_id: ERR_KIT_LEAD_TIME_NOT_ELAPSED
    http_status: 422
    when: "delivery is recorded before the quoted lead time has elapsed from the order date"
  - error_id: ERR_CLAIM_HAS_NO_LINES
    http_status: 422
    when: "adjudication is attempted on a claim that carries no cost lines"
  - error_id: ERR_OBSOLESCENCE_REGRESSION
    http_status: 422
    when: "an obsolescence notice would move the part backwards along ACTIVE -> NOTICE_ISSUED -> LAST_TIME_BUY -> OBSOLETE"
  - error_id: ERR_COVERAGE_EXHAUSTED
    http_status: 402
    when: "a goodwill charge is requested while the contract's coverage_posture is BUDGET_EXHAUSTED"
  - error_id: ERR_POSTURE_RESTRICTED
    http_status: 402
    when: "a non-corrective visit is booked while the contract's coverage_posture is RESTRICTED"

roles:
  - name: PlatformAdmin
    identity: opaque
    description: "OEM platform operator; seeds customers, models, lines and engineers, advances the logical clock and reads everything"
  - name: ApplicationEngineer
    identity: opaque
    description: "runs customer product trials, recommends the machine configuration and engineers machine orders"
  - name: ProductionPlanner
    identity: opaque
    description: "owns long-lead procurement, build-slot scheduling on production lines and the build/ship transitions"
  - name: QualityInspector
    identity: opaque
    description: "runs factory and site acceptance testing and owns the machine-defect branch of warranty adjudication"
  - name: ServiceManager
    identity: opaque
    description: "owns installed machines, format kits, service contracts, maintenance visits, warranty claims and stocking recommendations"
  - name: CustomerContact
    identity: entity_backed:Customer
    description: |
      the customer's own representative. Scoped by X-User-ID to the Customer row whose id equals the header value;
      may read only resources that roll up to that customer, may accept a format-kit quote and may open a warranty
      claim on their own machine. Any cross-customer access yields ERR_NOT_RESOURCE_OWNER.
