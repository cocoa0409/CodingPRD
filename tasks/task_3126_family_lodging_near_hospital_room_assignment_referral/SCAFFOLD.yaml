# =============================================================================
# SCAFFOLD.yaml — task_3126_family_lodging_near_hospital_room_assignment_referral
# Family Lodging Near Hospital (Ronald McDonald House Charities style)
# =============================================================================

scenario: |
  Family Lodging Near Hospital Room Assignment & Referral Verification (Ronald
  McDonald House Charities): referral verification from the treating hospital
  confirming a child's admission or outpatient treatment, room assignment
  prioritization by distance from home, medical acuity and length of expected
  stay with waitlist management, house rules covering illness screening, guest
  limits and shared kitchen use, volunteer meal program scheduling with food
  safety requirements, length-of-stay review and transition planning for
  extended stays, family contribution requests that are never a condition of
  stay, family room and mobile care unit programs operating inside hospitals,
  donation of goods and in-kind supply management

domain_name: family-lodging-hospital-referral
api_prefix: /api

# =============================================================================
# Complexity Profile (hardest supported profile, per request)
# =============================================================================
complexity_profile:
  primary_archetype: quota / allocation        # finite rooms competed for via scored waitlist, offer holds, preemption-free promotion
  secondary_archetype: compliance / audit      # referral verification with segregation of duties, illness screening, food safety attestation
  complexity_layers:
    - optimistic_concurrency                   # OCC on Family.version (stay-request create-with-supersede) and StayRequest.version (offer respond)
    - cascading_side_effects                   # referral revocation -> request verification failure -> offer rescission -> re-offer; checkout -> room release -> promotion
    - ops_run_checkpoint                       # assignment sweep (expire offers, promote waitlist) and stay-review sweep (length-of-stay flagging)
    - selector_policy                          # waitlist ranking (verified_score DESC, created_at ASC) and room selector (bed_count ASC, room_number ASC)
  entity_topology: hybrid                      # flat peers (Family, Hospital, House) + FK cross-references + sub-resource collections
  state_machine_shape: cyclic                  # offer-decline re-waitlist loop; stay extension/review loop; volunteer-group recertify loop; parallel dimensions on StayRequest
  relationship_patterns:
    - one_to_many
    - cross_aggregate                          # Stay -> Referral gating; MealShift -> VolunteerGroup gating; CareSpaceBooking -> Referral at same hospital
  role_model: segregation_of_duties            # referral creator may not verify own referral; peer roles own disjoint workflows
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Hospital
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hospital name" }
      - { name: city, type: string, source: input, description: "Hospital city" }

  - name: House
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "House name" }
      - { name: city, type: string, source: input, description: "House city" }
      - { name: associated_hospital_id, type: string, source: input, description: "FK -> Hospital.id; the treating hospital this lodging house primarily serves" }
      - { name: posture, type: enum, source: computed, description: "OPEN | NEAR_CAPACITY | FULL — derived from occupancy ratio per house_occupancy_posture" }
      - { name: occupied_room_count, type: integer, source: computed, description: "Rooms with a non-terminal Stay (occupied flag true)" }
      - { name: available_room_count, type: integer, source: computed, description: "Rooms with status AVAILABLE, not occupied, and not reserved by an OFFERED StayRequest" }
      - { name: reserved_room_count, type: integer, source: computed, description: "Rooms held by an OFFERED StayRequest (offered_room_id set)" }

  - name: Room
    parent: House
    common_fields: true
    fields:
      - { name: house_id, type: string, source: system, description: "FK -> House.id; parent house from path" }
      - { name: room_number, type: string, source: input, description: "Room number, unique within house" }
      - { name: bed_count, type: integer, source: input, description: "Number of beds; used by room_selector" }
      - { name: occupancy_limit, type: integer, source: input, description: "Max simultaneous REGISTERED overnight guests on a Stay in this room" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | MAINTENANCE | OFFLINE" }
      - { name: occupied, type: boolean, source: computed, default: false, description: "True while a non-terminal Stay occupies this room" }

  - name: Family
    parent: null
    common_fields: true
    fields:
      - { name: family_name, type: string, source: input, description: "Family surname / household label" }
      - { name: primary_contact_name, type: string, source: input, description: "Primary contact person" }
      - { name: home_city, type: string, source: input, description: "Home city" }
      - { name: distance_miles, type: number, source: input, description: "One-way distance from home to the treating hospital in miles; eligibility requires >= 50" }
      - { name: child_patient_name, type: string, source: input, description: "Name of the child patient" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; referred family" }
      - { name: hospital_id, type: string, source: input, description: "FK -> Hospital.id; treating hospital; HospitalReferrer callers must pass their own id" }
      - { name: treating_unit, type: string, source: input, description: "Treating unit / ward" }
      - { name: care_type, type: enum, source: input, description: "INPATIENT | OUTPATIENT — confirms admission or outpatient treatment" }
      - { name: acuity_level, type: enum, source: input, description: "LOW | MODERATE | HIGH | CRITICAL — hospital-attested medical acuity" }
      - { name: attending_clinician, type: string, source: input, description: "Attending clinician name" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | DECLINED | REVOKED | EXPIRED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creator; segregation of duties: verifier must differ" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the verifier; null until verified or declined" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock timestamp of verification; null until verified" }
      - { name: valid_until, type: datetime, source: computed, description: "verified_at + 30 days; null until verified" }

  - name: StayRequest
    parent: null
    common_fields: true
    fields:
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; requesting family" }
      - { name: house_id, type: string, source: input, description: "FK -> House.id; target house" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; supporting referral (must belong to family_id)" }
      - { name: expected_nights, type: integer, source: input, description: "Expected length of stay in nights; > 0" }
      - { name: self_reported_acuity, type: enum, source: input, description: "LOW | MODERATE | HIGH | CRITICAL — family's self-report, feeds provisional score" }
      - { name: verification_status, type: enum, source: system, description: "UNVERIFIED | VERIFICATION_OK | VERIFICATION_FAILED — parallel state dimension" }
      - { name: assignment_status, type: enum, source: system, description: "WAITLISTED | OFFERED | ACCEPTED | FULFILLED | CANCELLED — parallel state dimension" }
      - { name: provisional_score, type: number, source: computed, description: "Priority score from self-reported acuity; set at creation" }
      - { name: verified_score, type: number, source: computed, description: "Priority score from referral acuity; null until verification_status == VERIFICATION_OK" }
      - { name: offered_room_id, type: string, source: system, description: "FK -> Room.id; null unless assignment_status == OFFERED" }
      - { name: offer_expires_at, type: datetime, source: system, description: "Logical clock + 48h at offer time; null unless OFFERED" }
      - { name: waitlisted_since, type: datetime, source: system, description: "Logical-clock timestamp of the most recent entry into WAITLISTED" }
      - { name: superseded_by_request_id, type: string, source: system, description: "Set when CANCELLED due to create-with-supersede; null otherwise" }

  - name: Stay
    parent: null
    common_fields: true
    fields:
      - { name: stay_request_id, type: string, source: system, description: "FK -> StayRequest.id; originating request" }
      - { name: family_id, type: string, source: system, description: "FK -> Family.id; copied from request" }
      - { name: room_id, type: string, source: system, description: "FK -> Room.id; occupied room (changed by relocation)" }
      - { name: check_in_date, type: string, source: system, description: "Logical-clock calendar date (YYYY-MM-DD) at check-in" }
      - { name: expected_check_out_date, type: string, source: system, description: "check_in_date + expected_nights; extended by approved extensions" }
      - { name: actual_check_out_date, type: string, source: system, description: "Logical-clock date at check-out; null until CHECKED_OUT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | UNDER_REVIEW | TRANSITION_PLANNED | RELOCATION_REQUIRED | CHECKED_OUT" }
      - { name: approved_extension_count, type: integer, source: system, default: 0, description: "Number of approved extensions; further extension requests rejected at 2 (transition plan required)" }
      - { name: pending_extension_nights, type: integer, source: system, description: "Nights requested by the open extension request; null unless UNDER_REVIEW with an extension pending" }
      - { name: transition_plan_notes, type: string, source: system, description: "Transition plan text; null until TRANSITION_PLANNED" }
      - { name: review_reason, type: enum, source: system, description: "EXTENSION_REQUEST | STAY_LENGTH | REFERRAL_REVOKED; null when not UNDER_REVIEW" }

  - name: GuestRegistration
    parent: Stay
    common_fields: true
    fields:
      - { name: stay_id, type: string, source: system, description: "FK -> Stay.id; parent stay from path" }
      - { name: guest_name, type: string, source: input, description: "Guest full name" }
      - { name: relationship, type: string, source: input, description: "Relationship to patient" }
      - { name: is_overnight, type: boolean, source: input, description: "Overnight guests count against the room occupancy_limit" }
      - { name: status, type: enum, source: system, description: "REGISTERED | DEPARTED (DEPARTED set by stay check-out cascade)" }

  - name: IllnessScreening
    parent: Stay
    common_fields: false
    fields:
      - { name: stay_id, type: string, source: system, description: "FK -> Stay.id; parent stay from path" }
      - { name: temperature_tenths_c, type: integer, source: input, description: "Temperature in tenths of a degree C (e.g. 380 = 38.0C)" }
      - { name: symptom_count, type: integer, source: input, description: "Number of reported symptoms; >= 0" }
      - { name: notes, type: string, source: input, description: "Free-text notes; optional", default: "" }
      - { name: result, type: enum, source: computed, description: "PASS | FAIL per screening_result calculation" }
      - { name: screened_at, type: datetime, source: system, description: "Logical-clock timestamp of screening" }

  - name: ContributionRequest
    parent: Stay
    common_fields: true
    fields:
      - { name: stay_id, type: string, source: system, description: "FK -> Stay.id; parent stay from path" }
      - { name: nightly_rate_cents, type: integer, source: input, description: "Suggested nightly contribution in cents; > 0" }
      - { name: planned_nights, type: integer, source: input, description: "Nights the request covers; > 0" }
      - { name: hardship_tier, type: enum, source: input, description: "NONE | PARTIAL | FULL — NONE factor 1.0, PARTIAL 0.5, FULL 0.0" }
      - { name: per_night_cents, type: integer, source: computed, description: "round_half_up(nightly_rate_cents * hardship_factor) — pinned rounding per contribution_amount" }
      - { name: requested_amount_cents, type: integer, source: computed, description: "per_night_cents * planned_nights at creation; re-anchored to settled_amount_cents at stay check-out" }
      - { name: settled_amount_cents, type: integer, source: computed, description: "per_night_cents * actual_nights; null until the stay checks out" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Sum of recorded payments" }
      - { name: waived_cents, type: integer, source: computed, default: 0, description: "Amount waived by HouseManager" }
      - { name: forgiven_cents, type: integer, source: computed, default: 0, description: "Outstanding remainder forgiven at check-out (contributions are never a condition of stay)" }
      - { name: outstanding_cents, type: integer, source: computed, description: "requested_amount_cents - paid_cents - waived_cents - forgiven_cents" }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIALLY_PAID | PAID | WAIVED | FORGIVEN" }

  - name: VolunteerGroup
    parent: null
    common_fields: true
    fields:
      - { name: group_name, type: string, source: input, description: "Volunteer group name" }
      - { name: contact_email, type: string, source: input, description: "Contact email" }
      - { name: certified_until, type: string, source: system, description: "Food-safety certification valid-through date (YYYY-MM-DD); null until certified" }
      - { name: certification_status, type: enum, source: computed, description: "UNCERTIFIED (certified_until null) | CERTIFIED (certified_until >= current logical date) | EXPIRED (certified_until < current logical date)" }

  - name: MealShift
    parent: House
    common_fields: true
    fields:
      - { name: house_id, type: string, source: system, description: "FK -> House.id; parent house from path" }
      - { name: shift_date, type: string, source: input, description: "Meal date (YYYY-MM-DD)" }
      - { name: meal_type, type: enum, source: input, description: "BREAKFAST | LUNCH | DINNER" }
      - { name: servings_planned, type: integer, source: input, description: "Planned servings; > 0" }
      - { name: status, type: enum, source: system, description: "OPEN | CLAIMED | COMPLETED | CANCELLED" }
      - { name: claimed_by_group_id, type: string, source: system, description: "FK -> VolunteerGroup.id; null unless CLAIMED or COMPLETED" }
      - { name: servings_served, type: integer, source: system, description: "Actual servings; null until COMPLETED" }
      - { name: food_safety_attested, type: boolean, source: system, description: "Attestation recorded at completion; null until COMPLETED" }

  - name: CareSpace
    parent: Hospital
    common_fields: true
    fields:
      - { name: hospital_id, type: string, source: system, description: "FK -> Hospital.id; parent hospital from path" }
      - { name: space_name, type: string, source: input, description: "Space name" }
      - { name: space_type, type: enum, source: input, description: "FAMILY_ROOM | MOBILE_CARE_UNIT" }
      - { name: capacity, type: integer, source: input, description: "Maximum party size per booking; > 0" }

  - name: CareSpaceBooking
    parent: CareSpace
    common_fields: true
    fields:
      - { name: care_space_id, type: string, source: system, description: "FK -> CareSpace.id; parent care space from path" }
      - { name: family_id, type: string, source: input, description: "FK -> Family.id; booking family" }
      - { name: start_at, type: datetime, source: input, description: "Booking start (ISO8601 UTC)" }
      - { name: end_at, type: datetime, source: input, description: "Booking end (ISO8601 UTC); must be strictly after start_at" }
      - { name: party_size, type: integer, source: input, description: "Number of people; must be <= CareSpace.capacity" }
      - { name: status, type: enum, source: system, description: "CONFIRMED | CANCELLED" }

  - name: InKindDonation
    parent: House
    common_fields: true
    fields:
      - { name: house_id, type: string, source: system, description: "FK -> House.id; parent house from path" }
      - { name: donor_name, type: string, source: input, description: "Donor name" }
      - { name: supply_category, type: enum, source: input, description: "HYGIENE_KIT | PANTRY_STAPLE | CLEANING_SUPPLY | BABY_SUPPLY" }
      - { name: quantity_received, type: integer, source: input, description: "Units received; > 0" }
      - { name: quantity_distributed, type: integer, source: computed, default: 0, description: "Units distributed so far" }
      - { name: status, type: enum, source: system, description: "RECEIVED | PARTIALLY_DISTRIBUTED | DEPLETED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Referral
    initial_state: PENDING
    terminal_states: [DECLINED, REVOKED, EXPIRED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /api/referrals/{id}/verify with decision=APPROVE"
        actor: HouseManager | ProgramAdmin
        preconditions:
          - "Referral status == PENDING (ERR_INVALID_STATE)"
          - "X-User-ID != referral.created_by_user_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "verified_at = current logical clock; verified_by_user_id = X-User-ID; valid_until = verified_at + 30 days"
          - "Every StayRequest with referral_id == this referral and verification_status == UNVERIFIED: verification_status -> VERIFICATION_OK and verified_score computed per stay_request_priority_score (verified variant)"
      - from: PENDING
        to: DECLINED
        trigger: "POST /api/referrals/{id}/verify with decision=DECLINE"
        actor: HouseManager | ProgramAdmin
        preconditions:
          - "Referral status == PENDING (ERR_INVALID_STATE)"
          - "X-User-ID != referral.created_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Every StayRequest with referral_id == this referral and verification_status == UNVERIFIED: verification_status -> VERIFICATION_FAILED"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /api/referrals/{id}/revoke"
        actor: HospitalReferrer | ProgramAdmin
        preconditions:
          - "Referral status == VERIFIED (ERR_INVALID_STATE)"
          - "HospitalReferrer caller: referral.hospital_id == X-User-ID (ownership, ERR_FORBIDDEN)"
        side_effects:
          - "Hop 1 — every StayRequest with referral_id == this referral and verification_status == VERIFICATION_OK: verification_status -> VERIFICATION_FAILED"
          - "Hop 2 — for each such request whose assignment_status == OFFERED: offer rescinded (assignment_status -> WAITLISTED, offered_room_id -> null, offer_expires_at -> null, waitlisted_since := current logical clock); the room reservation is released"
          - "Hop 3 — each room freed by hop 2 is immediately re-offered to the highest-ranked eligible waitlisted request at that house per waitlist_ranking + room_selector (assignment_status -> OFFERED, offered_room_id set, offer_expires_at = clock + 48h); no-op when no eligible request"
          - "Every Stay whose stay_request_id chains to this referral AND whose status is exactly ACTIVE: status -> UNDER_REVIEW with review_reason = REFERRAL_REVOKED (stays in UNDER_REVIEW, TRANSITION_PLANNED, or RELOCATION_REQUIRED are not moved)"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system (run-assignment-sweep: referral VERIFIED with valid_until < current logical clock)"
        actor: system
        preconditions: []
        side_effects:
          - "Same hop 1/2/3 cascade as VERIFIED -> REVOKED"

  - entity: StayRequest
    initial_state: "verification_status=UNVERIFIED; assignment_status=WAITLISTED (parallel dimensions)"
    terminal_states: [FULFILLED, CANCELLED]   # assignment_status terminal values
    transitions:
      - from: "(creation)"
        to: "UNVERIFIED/WAITLISTED or VERIFICATION_OK/WAITLISTED"
        trigger: "POST /api/stay-requests"
        actor: FamilyContact | HouseManager | ProgramAdmin
        preconditions:
          - "family.distance_miles >= 50 (ERR_DISTANCE_INELIGIBLE)"
          - "referral.family_id == request.family_id (ERR_REFERRAL_FAMILY_MISMATCH)"
          - "expected_family_version == Family.version (OCC, ERR_STALE_VERSION)"
          - "FamilyContact caller: family_id == X-User-ID (ownership, ERR_FORBIDDEN)"
        side_effects:
          - "provisional_score computed (provisional variant of stay_request_priority_score)"
          - "If referral.status == VERIFIED: verification_status = VERIFICATION_OK and verified_score computed; else UNVERIFIED"
          - "Every other StayRequest of the same family with assignment_status in {WAITLISTED, OFFERED} is superseded -> CANCELLED with superseded_by_request_id set; an OFFERED request's room reservation is released (offered_room_id -> null) with no re-offer"
          - "Increments Family.version by 1"
          - "waitlisted_since := current logical clock"
      - from: WAITLISTED
        to: OFFERED
        trigger: "POST /api/stay-requests/{id}/offer OR system promotion (run-assignment-sweep / cascade re-offer)"
        actor: HouseManager | ProgramAdmin | system
        preconditions:
          - "assignment_status == WAITLISTED (ERR_INVALID_STATE)"
          - "verification_status == VERIFICATION_OK (ERR_REFERRAL_NOT_VERIFIED)"
          - "Target room: house_id match (ERR_ROOM_HOUSE_MISMATCH), status == AVAILABLE, occupied == false, and not reserved by another OFFERED request (ERR_ROOM_NOT_AVAILABLE)"
        side_effects:
          - "offered_room_id set; offer_expires_at = clock + 48h; House.reserved_room_count recomputed"
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /api/stay-requests/{id}/respond with decision=ACCEPT"
        actor: FamilyContact
        preconditions:
          - "assignment_status == OFFERED (ERR_INVALID_STATE)"
          - "offer_expires_at >= current logical clock (ERR_OFFER_EXPIRED)"
          - "expected_stay_request_version == StayRequest.version (OCC, ERR_STALE_VERSION)"
          - "request.family_id == X-User-ID (ownership, ERR_FORBIDDEN)"
        side_effects:
          - "Increments StayRequest.version by 1"
      - from: OFFERED
        to: WAITLISTED
        trigger: "POST /api/stay-requests/{id}/respond with decision=DECLINE"
        actor: FamilyContact
        preconditions:
          - "Same as OFFERED -> ACCEPTED (state, expiry, OCC, ownership)"
        side_effects:
          - "offered_room_id -> null; offer_expires_at -> null; waitlisted_since := current logical clock; room reservation released (no re-offer)"
          - "Increments StayRequest.version by 1"
      - from: OFFERED
        to: WAITLISTED
        trigger: "system (run-assignment-sweep: offer_expires_at < current logical clock)"
        actor: system
        preconditions: []
        side_effects:
          - "offered_room_id -> null; offer_expires_at -> null; waitlisted_since := current logical clock; room reservation released (sweep later re-offers the freed room in the same run)"
      - from: ACCEPTED
        to: FULFILLED
        trigger: "POST /api/stay-requests/{id}/check-in"
        actor: HouseManager | ProgramAdmin
        preconditions:
          - "assignment_status == ACCEPTED (ERR_INVALID_STATE)"
          - "Offered room still status == AVAILABLE and occupied == false (ERR_ROOM_NOT_AVAILABLE)"
        side_effects:
          - "Stay created: status ACTIVE, room_id = offered_room_id, check_in_date = current logical date, expected_check_out_date = check_in_date + expected_nights"
          - "Room.occupied -> true; House occupied_room_count / available_room_count / posture recomputed"
      - from: "WAITLISTED | OFFERED"
        to: CANCELLED
        trigger: "POST /api/stay-requests/{id}/cancel"
        actor: FamilyContact | HouseManager | ProgramAdmin
        preconditions:
          - "assignment_status in {WAITLISTED, OFFERED} (ERR_INVALID_STATE)"
          - "FamilyContact caller: request.family_id == X-User-ID (ERR_FORBIDDEN)"
        side_effects:
          - "If OFFERED: room reservation released (offered_room_id -> null, offer_expires_at -> null), no re-offer"

  - entity: Stay
    initial_state: ACTIVE
    terminal_states: [CHECKED_OUT]
    transitions:
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "POST /api/stays/{id}/request-extension"
        actor: FamilyContact | HouseManager
        preconditions:
          - "status == ACTIVE (ERR_STAY_NOT_ACTIVE)"
          - "approved_extension_count < 2 (ERR_TRANSITION_PLAN_REQUIRED)"
          - "Referral of the originating StayRequest must be status == VERIFIED (ERR_REFERRAL_NOT_VERIFIED)"
          - "FamilyContact caller: stay.family_id == X-User-ID (ERR_FORBIDDEN)"
        side_effects:
          - "pending_extension_nights = additional_nights; review_reason = EXTENSION_REQUEST"
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: "system (run-stay-review-sweep: current logical date - check_in_date >= 21 nights)"
        actor: system
        preconditions: []
        side_effects:
          - "review_reason = STAY_LENGTH"
      - from: ACTIVE
        to: RELOCATION_REQUIRED
        trigger: "system (occupied Room set to OFFLINE via POST /api/rooms/{id}/set-status)"
        actor: system
        preconditions: []
        side_effects:
          - "Room.occupied -> false for the offlined room; House occupancy recomputed"
      - from: RELOCATION_REQUIRED
        to: ACTIVE
        trigger: "POST /api/stays/{id}/review with decision=RELOCATE"
        actor: HouseManager | ProgramAdmin
        preconditions:
          - "status == RELOCATION_REQUIRED (ERR_INVALID_STATE)"
          - "relocation_room_id present, same house as the old room, status AVAILABLE, occupied == false, not reserved (ERR_ROOM_NOT_AVAILABLE)"
        side_effects:
          - "room_id := relocation_room_id; new Room.occupied -> true; House occupancy recomputed"
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: "POST /api/stays/{id}/review with decision=APPROVE_EXTENSION or DENY_EXTENSION"
        actor: HouseManager | ProgramAdmin
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "APPROVE_EXTENSION requires review_reason == EXTENSION_REQUEST (ERR_INVALID_STATE)"
        side_effects:
          - "APPROVE_EXTENSION: expected_check_out_date += pending_extension_nights; approved_extension_count += 1; pending_extension_nights -> null; review_reason -> null"
          - "DENY_EXTENSION: pending_extension_nights -> null; review_reason -> null"
      - from: UNDER_REVIEW
        to: TRANSITION_PLANNED
        trigger: "POST /api/stays/{id}/review with decision=PLAN_TRANSITION"
        actor: HouseManager | ProgramAdmin
        preconditions:
          - "status == UNDER_REVIEW (ERR_INVALID_STATE)"
          - "transition_plan_notes present (ERR_INVALID_REQUEST)"
        side_effects:
          - "transition_plan_notes set; pending_extension_nights -> null"
      - from: TRANSITION_PLANNED
        to: ACTIVE
        trigger: "POST /api/stays/{id}/review with decision=APPROVE_EXTENSION (plan revised, stay continues)"
        actor: HouseManager | ProgramAdmin
        preconditions:
          - "status == TRANSITION_PLANNED (ERR_INVALID_STATE)"
          - "approved_extension_count < 2 (ERR_TRANSITION_PLAN_REQUIRED)"
          - "Referral of the originating StayRequest must be status == VERIFIED (ERR_REFERRAL_NOT_VERIFIED)"
        side_effects:
          - "transition_plan_notes -> null; review_reason -> null"
      - from: "ACTIVE | UNDER_REVIEW | TRANSITION_PLANNED | RELOCATION_REQUIRED"
        to: CHECKED_OUT
        trigger: "POST /api/stays/{id}/check-out"
        actor: HouseManager | ProgramAdmin
        preconditions:
          - "status != CHECKED_OUT (ERR_INVALID_STATE)"
          - "Checkout is NEVER blocked by unpaid, unwaived contribution requests (contributions are never a condition of stay)"
        side_effects:
          - "actual_check_out_date = current logical date"
          - "Hop 1 — Room.occupied -> false for stay.room_id (no-op when status was RELOCATION_REQUIRED)"
          - "Hop 2 — the released room triggers House recomputation and an immediate promotion: the highest-ranked eligible waitlisted request at that house (per waitlist_ranking) moves WAITLISTED -> OFFERED holding this room; no-op when none eligible"
          - "Every GuestRegistration on the stay with status REGISTERED -> DEPARTED"
          - "Every ContributionRequest on the stay with status in {OPEN, PARTIALLY_PAID}: settled_amount_cents = per_night_cents * actual_nights (actual_nights = actual_check_out_date - check_in_date), requested_amount_cents := settled_amount_cents, forgiven_cents = resulting outstanding_cents, outstanding_cents := 0, status -> FORGIVEN"

  - entity: Room
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /api/rooms/{id}/set-status target_status=MAINTENANCE"
        actor: HouseManager | ProgramAdmin
        preconditions:
          - "status == AVAILABLE (ERR_INVALID_STATE); occupied == false (ERR_ROOM_NOT_AVAILABLE); not reserved by an OFFERED request (ERR_ROOM_NOT_AVAILABLE)"
        side_effects: ["House available_room_count recomputed"]
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /api/rooms/{id}/set-status target_status=AVAILABLE"
        actor: HouseManager | ProgramAdmin
        preconditions: ["status == MAINTENANCE or OFFLINE (ERR_INVALID_STATE)"]
        side_effects: ["House available_room_count recomputed"]
      - from: "AVAILABLE | MAINTENANCE"
        to: OFFLINE
        trigger: "POST /api/rooms/{id}/set-status target_status=OFFLINE"
        actor: HouseManager | ProgramAdmin
        preconditions: ["status != OFFLINE (ERR_INVALID_STATE)"]
        side_effects:
          - "If occupied: the occupying Stay -> RELOCATION_REQUIRED and Room.occupied -> false"
          - "Any OFFERED StayRequest holding this room: offer rescinded -> WAITLISTED, reservation released (no re-offer)"
          - "House occupancy recomputed"

  - entity: GuestRegistration
    initial_state: REGISTERED
    terminal_states: [DEPARTED]
    transitions:
      - from: REGISTERED
        to: DEPARTED
        trigger: "system (stay check-out cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ContributionRequest
    initial_state: OPEN
    terminal_states: [PAID, WAIVED, FORGIVEN]
    transitions:
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "POST /api/contribution-requests/{id}/record-payment with amount_cents < outstanding_cents"
        actor: FamilyContact | HouseManager
        preconditions:
          - "status in {OPEN, PARTIALLY_PAID} (ERR_INVALID_STATE)"
          - "amount_cents <= outstanding_cents (ERR_OVERPAYMENT)"
          - "FamilyContact caller: stay.family_id == X-User-ID (ERR_FORBIDDEN)"
        side_effects: ["paid_cents += amount_cents; outstanding_cents recomputed"]
      - from: PARTIALLY_PAID
        to: PARTIALLY_PAID
        trigger: "POST /api/contribution-requests/{id}/record-payment with amount_cents < outstanding_cents"
        actor: FamilyContact | HouseManager
        preconditions: ["Same as OPEN -> PARTIALLY_PAID"]
        side_effects: ["paid_cents += amount_cents; outstanding_cents recomputed"]
      - from: "OPEN | PARTIALLY_PAID"
        to: PAID
        trigger: "POST /api/contribution-requests/{id}/record-payment with amount_cents == outstanding_cents"
        actor: FamilyContact | HouseManager
        preconditions: ["Same as OPEN -> PARTIALLY_PAID"]
        side_effects: ["paid_cents += amount_cents; outstanding_cents := 0"]
      - from: "OPEN | PARTIALLY_PAID"
        to: WAIVED
        trigger: "POST /api/contribution-requests/{id}/waive"
        actor: HouseManager | ProgramAdmin
        preconditions: ["status in {OPEN, PARTIALLY_PAID} (ERR_INVALID_STATE)"]
        side_effects: ["waived_cents = outstanding_cents; outstanding_cents := 0"]
      - from: "OPEN | PARTIALLY_PAID"
        to: FORGIVEN
        trigger: "system (stay check-out cascade)"
        actor: system
        preconditions: []
        side_effects: ["settled_amount_cents computed; requested_amount_cents re-anchored; forgiven_cents = outstanding; outstanding_cents := 0"]

  - entity: VolunteerGroup
    initial_state: UNCERTIFIED
    terminal_states: []
    transitions:
      - from: "UNCERTIFIED | CERTIFIED | EXPIRED"
        to: CERTIFIED
        trigger: "POST /api/volunteer-groups/{id}/certify"
        actor: ProgramAdmin
        preconditions: ["certified_until must be a valid YYYY-MM-DD date (ERR_INVALID_REQUEST)"]
        side_effects:
          - "certified_until set; certification_status recomputed against the current logical date (CERTIFIED when certified_until >= current date, EXPIRED when certified_until < current date — a past-dated certification lands as EXPIRED)"

  - entity: MealShift
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: CLAIMED
        trigger: "POST /api/meal-shifts/{id}/claim"
        actor: VolunteerCoordinator
        preconditions:
          - "status == OPEN (ERR_INVALID_STATE)"
          - "VolunteerGroup.certification_status != UNCERTIFIED (ERR_FOOD_SAFETY_CERT_REQUIRED)"
          - "VolunteerGroup.certified_until >= shift.shift_date (ERR_FOOD_SAFETY_CERT_EXPIRED)"
        side_effects: ["claimed_by_group_id set"]
      - from: CLAIMED
        to: OPEN
        trigger: "POST /api/meal-shifts/{id}/cancel on a CLAIMED shift (volunteer released the shift)"
        actor: VolunteerCoordinator | HouseManager | ProgramAdmin
        preconditions: ["status == CLAIMED (ERR_INVALID_STATE)"]
        side_effects: ["claimed_by_group_id -> null"]
      - from: OPEN
        to: CANCELLED
        trigger: "POST /api/meal-shifts/{id}/cancel on an OPEN shift"
        actor: VolunteerCoordinator | HouseManager | ProgramAdmin
        preconditions: ["status == OPEN (ERR_INVALID_STATE)"]
        side_effects: []
      - from: CLAIMED
        to: COMPLETED
        trigger: "POST /api/meal-shifts/{id}/complete"
        actor: VolunteerCoordinator | HouseManager
        preconditions:
          - "status == CLAIMED (ERR_INVALID_STATE)"
          - "food_safety_attested == true (ERR_FOOD_SAFETY_ATTESTATION_REQUIRED)"
          - "servings_served > 0 (ERR_INVALID_REQUEST)"
        side_effects: ["servings_served and food_safety_attested recorded"]

  - entity: CareSpaceBooking
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /api/care-space-bookings/{id}/cancel"
        actor: FamilyContact | HouseManager
        preconditions:
          - "status == CONFIRMED (ERR_INVALID_STATE)"
          - "FamilyContact caller: booking.family_id == X-User-ID (ERR_FORBIDDEN)"
        side_effects: ["Booked window freed for future overlap checks"]

  - entity: InKindDonation
    initial_state: RECEIVED
    terminal_states: [DEPLETED]
    transitions:
      - from: RECEIVED
        to: PARTIALLY_DISTRIBUTED
        trigger: "POST /api/in-kind-donations/{id}/distribute with quantity < remaining"
        actor: HouseManager | ProgramAdmin
        preconditions:
          - "status in {RECEIVED, PARTIALLY_DISTRIBUTED} (ERR_DONATION_DEPLETED)"
          - "quantity <= quantity_received - quantity_distributed (ERR_INSUFFICIENT_SUPPLY)"
        side_effects: ["quantity_distributed += quantity; house supply rollup recomputed"]
      - from: PARTIALLY_DISTRIBUTED
        to: PARTIALLY_DISTRIBUTED
        trigger: "POST /api/in-kind-donations/{id}/distribute with quantity < remaining"
        actor: HouseManager | ProgramAdmin
        preconditions: ["Same as RECEIVED -> PARTIALLY_DISTRIBUTED"]
        side_effects: ["quantity_distributed += quantity; house supply rollup recomputed"]
      - from: "RECEIVED | PARTIALLY_DISTRIBUTED"
        to: DEPLETED
        trigger: "POST /api/in-kind-donations/{id}/distribute with quantity == remaining"
        actor: HouseManager | ProgramAdmin
        preconditions: ["Same as RECEIVED -> PARTIALLY_DISTRIBUTED"]
        side_effects: ["quantity_distributed := quantity_received; house supply rollup recomputed"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: stay-request-create-stale-family
    parent_entity: Family
    write_endpoint: "POST /api/stay-requests"
    occ_field: "expected_family_version"
    description: |
      Creating a StayRequest against a Family whose version has advanced since
      the client last observed it is rejected. Creating a request legitimately
      supersedes the family's prior WAITLISTED/OFFERED requests and bumps
      Family.version, so a writer holding a stale family view must be rejected
      rather than silently superseding state it never saw.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: offer-respond-stale-request
    parent_entity: StayRequest
    write_endpoint: "POST /api/stay-requests/{id}/respond"
    occ_field: "expected_stay_request_version"
    description: |
      Responding to an offer with an expected_stay_request_version that does not
      match the request's current version is rejected. Offering, score
      recomputation, or a prior response each advance StayRequest.version, so a
      stale response is refused before any state evaluation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: stay_request_priority_score
    trigger: "StayRequest creation (provisional variant); referral verification cascade (verified variant)"
    algorithm: weighted_scoring
    formula: |
      band = band_of(family.distance_miles): [50,100) -> 40; [100,250) -> 60; >= 250 -> 80
      mult = { LOW: 1.0, MODERATE: 1.25, HIGH: 1.5, CRITICAL: 2.0 }[acuity]
      stay_factor = min(30, expected_nights) / 30
      score = min(100.0, band * mult + 20.0 * stay_factor)
      Round the final score to 2 decimal places, round_half_up.
    input_set: "The StayRequest plus its Family (distance_miles). Provisional variant reads self_reported_acuity; verified variant reads the linked Referral.acuity_level."
    constants:
      STAY_FACTOR_CAP_NIGHTS: 30
      STAY_FACTOR_WEIGHT: 20.0
      SCORE_CAP: 100.0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "At StayRequest creation; acuity = self_reported_acuity"
        difference: "Uses unverified self-report; stored on provisional_score"
      - name: verified
        when: "When the linked Referral is VERIFIED (at creation if already verified, else on the verification cascade)"
        difference: "Uses hospital-attested Referral.acuity_level; stored on verified_score; identical inputs can yield a different number than provisional"

  - name: contribution_amount
    trigger: "ContributionRequest creation (estimated); stay check-out (settled)"
    algorithm: aggregation
    formula: |
      factor = { NONE: 1.0, PARTIAL: 0.5, FULL: 0.0 }[hardship_tier]
      per_night_cents = round_half_up_to_int(nightly_rate_cents * factor)
      PINNED ROUNDING ORDER: round per night first, then multiply by nights.
      estimated (at creation):  requested_amount_cents = per_night_cents * planned_nights
      settled (at check-out):   settled_amount_cents  = per_night_cents * actual_nights
      At check-out, requested_amount_cents is re-anchored to settled_amount_cents.
    input_set: "The ContributionRequest; actual_nights = actual_check_out_date - check_in_date on the parent Stay."
    constants: {}
    precision: "integer cents; per-night round_half_up (502.5 -> 503)"
    variants:
      - name: estimated
        when: "Creation; uses planned_nights"
        difference: "requested_amount_cents reflects the plan"
      - name: settled
        when: "Stay check-out; uses actual_nights"
        difference: "settled_amount_cents reflects the real stay length and re-anchors requested_amount_cents; identical rates produce different totals when actual != planned"

  - name: waitlist_ranking
    trigger: "run-assignment-sweep promotion phase; cascade re-offer (referral revocation, check-out)"
    algorithm: chronological
    formula: |
      Eligibility: StayRequest with house_id == house AND assignment_status == WAITLISTED
                   AND verification_status == VERIFICATION_OK.
      Ranking: verified_score DESC; tie-break waitlisted_since ASC (earliest first);
               final tie-break created_at ASC.
      Empty candidate set: no promotion (not an error).
    input_set: "All StayRequests at the house in the eligibility set above."
    constants: {}
    precision: "n/a (ordering rule)"

  - name: room_selector
    trigger: "Every promotion / offer that must pick a room (sweep, cascade re-offer)"
    algorithm: constraint_propagation
    formula: |
      Eligible rooms: house match, status == AVAILABLE, occupied == false,
                      not reserved by any OFFERED StayRequest.
      Selection: bed_count ASC; tie-break room_number ASC (lexicographic).
      Empty candidate set: no offer made (not an error).
    input_set: "All Rooms of the house."
    constants: {}
    precision: "n/a (selection rule)"

  - name: assignment_capacity_snapshot
    trigger: "run-assignment-sweep"
    algorithm: constraint_propagation
    formula: |
      PINNED EVALUATION ORDER (circular-looking dependency made explicit):
      1. Expire offers first: every OFFERED request with offer_expires_at < current
         logical clock -> WAITLISTED (releases its room reservation).
      2. Expire referrals: VERIFIED referrals with valid_until < current logical
         clock -> EXPIRED (runs its revocation cascade).
      3. Snapshot capacity: capacity = count of rooms that are AVAILABLE,
         occupied == false, unreserved AFTER steps 1-2.
      4. Promote in waitlist_ranking order, one room per request via room_selector;
         each promotion decrements the snapshot by 1; stop when snapshot == 0 or
         the eligible request set is exhausted.
      The snapshot is taken once per sweep; offers made inside step 4 do not
      re-enter the same sweep's candidate set.
    input_set: "All OFFERED requests of the house, all VERIFIED referrals linked to requests of the house, all rooms and WAITLISTED requests of the house."
    constants: { OFFER_TTL_HOURS: 48 }
    precision: "n/a"

  - name: screening_result
    trigger: "POST /api/stays/{id}/screenings"
    algorithm: threshold
    formula: |
      result = PASS when symptom_count == 0 AND temperature_tenths_c < 380
      result = FAIL otherwise (boundary: temperature_tenths_c == 380 FAILS; strictly below passes)
      Same-day clearance: a stay has kitchen/guest clearance on calendar date D
      when a screening exists with screened_at date == D and result == PASS.
    input_set: "The new screening record only."
    constants: { FEVER_THRESHOLD_TENTHS_C: 380 }
    precision: "integer tenths of a degree"

  - name: house_occupancy_posture
    trigger: "Room create/set-status, offer made/rescinded/expired, check-in, check-out, relocation"
    algorithm: threshold
    formula: |
      denominator = count(Room of house with status == AVAILABLE)   # occupied rooms keep status AVAILABLE
      if denominator == 0: posture = FULL
      ratio = occupied_room_count / denominator
      posture = FULL when ratio == 1.0; NEAR_CAPACITY when 0.9 <= ratio < 1.0; OPEN when ratio < 0.9
      occupied_room_count = rooms with occupied == true
      reserved_room_count = rooms held by an OFFERED StayRequest
      available_room_count = count(status AVAILABLE AND occupied == false AND not reserved)
    input_set: "All Rooms of the house; all OFFERED StayRequests of the house."
    constants: { NEAR_CAPACITY_THRESHOLD: 0.9 }
    precision: "ratio compared exactly; boundary 0.9 is inclusive for NEAR_CAPACITY"

  - name: stay_length_review
    trigger: "run-stay-review-sweep"
    algorithm: chronological
    formula: |
      For every Stay of the house with status == ACTIVE:
        nights_at_house = current logical date - check_in_date (calendar days)
        if nights_at_house >= 21: Stay -> UNDER_REVIEW with review_reason = STAY_LENGTH
      Boundary: exactly 21 nights is flagged; 20 is not.
    input_set: "Stays of the house with status == ACTIVE."
    constants: { REVIEW_THRESHOLD_NIGHTS: 21 }
    precision: "whole calendar days"

  - name: room_stay_overlap
    trigger: "offer, check-in, relocation"
    algorithm: interval_merge
    formula: |
      Room occupancy is a half-open interval [check_in_date, actual_check_out_date).
      Same-day turnover is allowed: a check-out on date D frees the room for a
      check-in on date D. Any offer/check-in/relocation targeting a room with
      occupied == true (or reserved by another OFFERED request) is rejected
      with ERR_ROOM_NOT_AVAILABLE.
    input_set: "The target Room and the requesting StayRequest/Stay."
    constants: {}
    precision: "calendar-day granularity for stays"

  - name: care_space_conflict_window
    trigger: "POST /api/care-spaces/{id}/bookings"
    algorithm: interval_merge
    formula: |
      Every CONFIRMED booking blocks [start_at, end_at + 30 minutes) on its
      CareSpace (a 30-minute cleaning buffer follows each booking).
      A new booking [s, e) conflicts when s < blocked_end AND e > blocked_start
      for any existing CONFIRMED booking's blocked window.
      Adjacency at exactly the buffer end is allowed: start_at == prior.end_at + 30min
      is accepted; one minute earlier is rejected with ERR_CARE_SPACE_CONFLICT.
    input_set: "CONFIRMED bookings of the CareSpace; CANCELLED bookings do not block."
    constants: { CLEANING_BUFFER_MINUTES: 30 }
    precision: "minute granularity"

  - name: supply_inventory_rollup
    trigger: "InKindDonation creation; distribute; GET /api/houses/{id}/supply-inventory"
    algorithm: aggregation
    formula: |
      For each supply_category:
        on_hand[category] = sum(quantity_received - quantity_distributed)
                            over all InKindDonations of the house in that category
      on_hand is never negative: distributions are rejected at ERR_INSUFFICIENT_SUPPLY
      when quantity > remaining on the donation.
    input_set: "All InKindDonations of the house (all statuses; DEPLETED contributes 0)."
    constants: {}
    precision: "integer units"

  - name: contribution_ledger_invariant
    trigger: "record-payment, waive, check-out forgiveness"
    algorithm: aggregation
    formula: |
      INVARIANT (conserved quantity): for every ContributionRequest, at all times:
        requested_amount_cents == paid_cents + waived_cents + forgiven_cents + outstanding_cents
      Check-out re-anchors requested_amount_cents to settled_amount_cents BEFORE
      computing forgiven_cents, so the invariant holds across the settle step too.
    input_set: "The ContributionRequest."
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 0
    category: existence
    check: "Request body well-formed: all required fields present, no unknown fields, field types and enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role recognized"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for the endpoint; entity-backed ownership (FamilyContact acts on own family resources, HospitalReferrer on own hospital); segregation of duties: referral verifier X-User-ID != referral.created_by_user_id"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints (SoD failure returns ERR_SEGREGATION_OF_DUTIES, 403)"
  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right; OCC expected_*_version matches the parent's current version"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints (OCC mismatch returns ERR_STALE_VERSION, 412)"
  - priority: 4
    category: state
    check: "Target resource in a valid from-state for the transition: StayRequest offer/respond/cancel/check-in states; Stay non-terminal for guests/screenings/extension/review; offer not expired; referral VERIFIED where required; donation not DEPLETED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (stay-specific: ERR_STAY_NOT_ACTIVE; expired offer: ERR_OFFER_EXPIRED; unverified referral: ERR_REFERRAL_NOT_VERIFIED; depleted donation: ERR_DONATION_DEPLETED)"
  - priority: 5
    category: business_safety
    check: "Safety gates: same-day PASS illness screening for guest registration; volunteer group certified (and certification valid through shift date) to claim a meal shift; food-safety attestation required to complete a shift"
    error_id: ERR_SCREENING_NOT_CLEARED
    http_status: 422
    applies_to: "guest registration (ERR_SCREENING_NOT_CLEARED); meal-shift claim (ERR_FOOD_SAFETY_CERT_REQUIRED / ERR_FOOD_SAFETY_CERT_EXPIRED); meal-shift complete (ERR_FOOD_SAFETY_ATTESTATION_REQUIRED)"
  - priority: 6
    category: business_constraint
    check: "Constraint satisfaction: distance eligibility (>= 50 miles); room occupancy limit for overnight guests; care-space capacity; room occupancy/reservation conflicts; care-space buffered overlap; one non-terminal referral per (family_id, hospital_id); one meal shift per (house, shift_date, meal_type); extension count limit"
    error_id: ERR_DISTANCE_INELIGIBLE
    http_status: 422
    applies_to: "stay-request creation (ERR_DISTANCE_INELIGIBLE); guests (ERR_GUEST_LIMIT_EXCEEDED); bookings (ERR_CAPACITY_EXCEEDED, ERR_CARE_SPACE_CONFLICT); offer/check-in/relocate (ERR_ROOM_NOT_AVAILABLE); referrals (ERR_DUPLICATE_ACTIVE_REFERRAL, 409); meal shifts (ERR_DUPLICATE_MEAL_SHIFT, 409); request-extension (ERR_TRANSITION_PLAN_REQUIRED, 409)"
  - priority: 7
    category: business_referential
    check: "Cross-entity referential fit: referral belongs to the family; room belongs to the request's house; booking family holds a VERIFIED referral at the care space's hospital"
    error_id: ERR_REFERRAL_FAMILY_MISMATCH
    http_status: 422
    applies_to: "stay-request creation (ERR_REFERRAL_FAMILY_MISMATCH); offer/relocate (ERR_ROOM_HOUSE_MISMATCH); care-space bookings (ERR_BOOKING_REFERRAL_MISMATCH)"
  - priority: 8
    category: business_temporal
    check: "Temporal sanity: booking end_at strictly after start_at; expected_nights > 0"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "care-space bookings; stay-request creation"
  - priority: 9
    category: business_fiscal
    check: "Fiscal/quantity caps: payment amount <= outstanding_cents; distribution quantity <= donation remaining"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "record-payment (ERR_OVERPAYMENT); distribute (ERR_INSUFFICIENT_SUPPLY)"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Logical clock advanced; lazy date-derived fields evaluate against the new clock on next access"]

  # --- Hospital ---
  - method: POST
    path: "/api/hospitals"
    description: "Create a treating-hospital partner"
    roles: [ProgramAdmin]
    code: 201
    input: [name, city]
    output: Hospital
    side_effects: []
  - method: GET
    path: "/api/hospitals/{id}"
    description: "Get a hospital"
    roles: [ProgramAdmin, HouseManager, HospitalReferrer, FamilyContact, VolunteerCoordinator]
    code: 200
    input: []
    output: Hospital
    side_effects: []
  - method: GET
    path: "/api/hospitals/{id}/houses"
    description: "List houses associated with a hospital"
    roles: [ProgramAdmin, HouseManager, HospitalReferrer, FamilyContact, VolunteerCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: House[]
    side_effects: []
  - method: GET
    path: "/api/hospitals/{id}/referrals"
    description: "List referrals issued by a hospital"
    roles: [ProgramAdmin, HouseManager, HospitalReferrer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: GET
    path: "/api/hospitals/{id}/care-spaces"
    description: "List care spaces (family rooms / mobile care units) inside a hospital"
    roles: [ProgramAdmin, HouseManager, HospitalReferrer, FamilyContact, VolunteerCoordinator]
    code: 200
    input: ["space_type?", "limit?", "offset?"]
    output: CareSpace[]
    side_effects: []

  # --- House / Room ---
  - method: POST
    path: "/api/houses"
    description: "Create a lodging house"
    roles: [ProgramAdmin]
    code: 201
    input: [name, city, associated_hospital_id]
    output: House
    side_effects: ["posture computed per house_occupancy_posture (FULL while the house has no AVAILABLE rooms); counts zeroed"]
  - method: GET
    path: "/api/houses/{id}"
    description: "Get a house with derived occupancy fields"
    roles: [ProgramAdmin, HouseManager, HospitalReferrer, FamilyContact, VolunteerCoordinator]
    code: 200
    input: []
    output: House
    side_effects: []
  - method: GET
    path: "/api/houses/{id}/supply-inventory"
    description: "Computed per-category on-hand supply rollup"
    roles: [ProgramAdmin, HouseManager]
    code: 200
    input: []
    output: { HYGIENE_KIT: integer, PANTRY_STAPLE: integer, CLEANING_SUPPLY: integer, BABY_SUPPLY: integer }
    side_effects: []
  - method: POST
    path: "/api/houses/{id}/rooms"
    description: "Add a room to a house"
    roles: [ProgramAdmin, HouseManager]
    code: 201
    input: [room_number, bed_count, occupancy_limit]
    output: Room
    side_effects: ["status AVAILABLE; House posture recomputed"]
  - method: GET
    path: "/api/houses/{id}/rooms"
    description: "List rooms of a house"
    roles: [ProgramAdmin, HouseManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Room[]
    side_effects: []
  - method: GET
    path: "/api/rooms/{id}"
    description: "Get a room"
    roles: [ProgramAdmin, HouseManager]
    code: 200
    input: []
    output: Room
    side_effects: []
  - method: GET
    path: "/api/rooms/{id}/stay-requests"
    description: "List stay requests currently holding an offer on this room"
    roles: [ProgramAdmin, HouseManager]
    code: 200
    input: ["limit?", "offset?"]
    output: StayRequest[]
    side_effects: []
  - method: POST
    path: "/api/rooms/{id}/set-status"
    description: "Transition a room between AVAILABLE / MAINTENANCE / OFFLINE; OFFLINE cascades to occupying stay and holding offers"
    roles: [ProgramAdmin, HouseManager]
    code: 200
    input: [target_status]
    output: Room
    side_effects:
      - "Room state machine transitions; offlining an occupied room flags its Stay RELOCATION_REQUIRED and releases occupation; OFFERED holds on the room are rescinded to WAITLISTED; House recomputed"

  # --- Family ---
  - method: POST
    path: "/api/families"
    description: "Register a family"
    roles: [ProgramAdmin, HouseManager]
    code: 201
    input: [family_name, primary_contact_name, home_city, distance_miles, child_patient_name]
    output: Family
    side_effects: []
  - method: GET
    path: "/api/families/{id}"
    description: "Get a family"
    roles: [ProgramAdmin, HouseManager, FamilyContact]
    code: 200
    input: []
    output: Family
    side_effects: []
  - method: GET
    path: "/api/families/{id}/referrals"
    description: "List referrals for a family"
    roles: [ProgramAdmin, HouseManager, FamilyContact, HospitalReferrer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: GET
    path: "/api/families/{id}/stay-requests"
    description: "List stay requests of a family"
    roles: [ProgramAdmin, HouseManager, FamilyContact]
    code: 200
    input: ["assignment_status?", "limit?", "offset?"]
    output: StayRequest[]
    side_effects: []
  - method: GET
    path: "/api/families/{id}/care-space-bookings"
    description: "List care-space bookings of a family"
    roles: [ProgramAdmin, HouseManager, FamilyContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CareSpaceBooking[]
    side_effects: []

  # --- Referral ---
  - method: POST
    path: "/api/referrals"
    description: "Hospital issues a referral confirming a child's admission or outpatient treatment; at most one non-terminal referral per (family_id, hospital_id)"
    roles: [HospitalReferrer, ProgramAdmin]
    code: 201
    input: [family_id, hospital_id, treating_unit, care_type, acuity_level, attending_clinician]
    output: Referral
    side_effects: ["status PENDING; created_by_user_id recorded from X-User-ID"]
  - method: GET
    path: "/api/referrals/{id}"
    description: "Get a referral"
    roles: [ProgramAdmin, HouseManager, HospitalReferrer, FamilyContact]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: POST
    path: "/api/referrals/{id}/verify"
    description: "House-side verification decision (APPROVE or DECLINE); verifier must differ from creator"
    roles: [HouseManager, ProgramAdmin]
    code: 200
    input: [decision, "notes?"]
    output: Referral
    side_effects:
      - "APPROVE: status VERIFIED, verified_at/valid_until stamped, linked UNVERIFIED StayRequests -> VERIFICATION_OK with verified_score computed"
      - "DECLINE: status DECLINED, linked UNVERIFIED StayRequests -> VERIFICATION_FAILED"
  - method: POST
    path: "/api/referrals/{id}/revoke"
    description: "Issuing hospital revokes a verified referral; cascades verification failure, offer rescission, and room re-offer"
    roles: [HospitalReferrer, ProgramAdmin]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "Hop 1: linked StayRequests VERIFICATION_OK -> VERIFICATION_FAILED"
      - "Hop 2: OFFERED requests among them rescinded -> WAITLISTED, room reservation released"
      - "Hop 3: freed rooms immediately re-offered per waitlist_ranking + room_selector"
      - "Stays chained to this referral with status exactly ACTIVE -> UNDER_REVIEW (review_reason REFERRAL_REVOKED)"

  # --- StayRequest ---
  - method: POST
    path: "/api/stay-requests"
    description: "Create a stay request (create-with-supersede of the family's prior WAITLISTED/OFFERED requests); OCC on Family.version"
    roles: [FamilyContact, HouseManager, ProgramAdmin]
    code: 201
    input: [family_id, house_id, referral_id, expected_nights, self_reported_acuity, expected_family_version]
    output: StayRequest
    side_effects:
      - "provisional_score computed; verified_score computed when the referral is already VERIFIED"
      - "Prior WAITLISTED/OFFERED requests of the family -> CANCELLED (superseded_by_request_id set); offered room released"
      - "Increments Family.version by 1"
  - method: GET
    path: "/api/stay-requests/{id}"
    description: "Get a stay request"
    roles: [ProgramAdmin, HouseManager, FamilyContact]
    code: 200
    input: []
    output: StayRequest
    side_effects: []
  - method: GET
    path: "/api/stay-requests"
    description: "List stay requests, filterable by house, family, referral, assignment status"
    roles: [ProgramAdmin, HouseManager, FamilyContact]
    code: 200
    input: ["house_id?", "family_id?", "referral_id?", "assignment_status?", "limit?", "offset?"]
    output: StayRequest[]
    side_effects: []
  - method: POST
    path: "/api/stay-requests/{id}/offer"
    description: "Offer a specific room to a waitlisted, verified request"
    roles: [HouseManager, ProgramAdmin]
    code: 200
    input: [room_id]
    output: StayRequest
    side_effects: ["assignment_status -> OFFERED; offered_room_id set; offer_expires_at = clock + 48h; House recomputed"]
  - method: POST
    path: "/api/stay-requests/{id}/respond"
    description: "Family accepts or declines an offer; OCC on StayRequest.version"
    roles: [FamilyContact]
    code: 200
    input: [decision, expected_stay_request_version]
    output: StayRequest
    side_effects:
      - "ACCEPT -> ACCEPTED; DECLINE -> WAITLISTED (room released, no re-offer)"
      - "Increments StayRequest.version by 1"
  - method: POST
    path: "/api/stay-requests/{id}/cancel"
    description: "Cancel a waitlisted or offered request"
    roles: [FamilyContact, HouseManager, ProgramAdmin]
    code: 200
    input: []
    output: StayRequest
    side_effects: ["assignment_status -> CANCELLED; offered room released if OFFERED"]
  - method: POST
    path: "/api/stay-requests/{id}/check-in"
    description: "Check an accepted family into the offered room; creates the Stay"
    roles: [HouseManager, ProgramAdmin]
    code: 201
    input: []
    output: Stay
    side_effects:
      - "Stay created ACTIVE with check_in_date = logical date, expected_check_out_date = check_in_date + expected_nights"
      - "StayRequest -> FULFILLED; Room.occupied -> true; House recomputed"

  # --- Stay ---
  - method: GET
    path: "/api/stays/{id}"
    description: "Get a stay"
    roles: [ProgramAdmin, HouseManager, FamilyContact]
    code: 200
    input: []
    output: Stay
    side_effects: []
  - method: GET
    path: "/api/stays"
    description: "List stays, filterable"
    roles: [ProgramAdmin, HouseManager]
    code: 200
    input: ["family_id?", "room_id?", "stay_request_id?", "status?", "limit?", "offset?"]
    output: Stay[]
    side_effects: []
  - method: POST
    path: "/api/stays/{id}/guests"
    description: "Register a guest; overnight guests count against the room occupancy limit; requires same-day PASS screening"
    roles: [FamilyContact, HouseManager]
    code: 201
    input: [guest_name, relationship, is_overnight]
    output: GuestRegistration
    side_effects: ["status REGISTERED"]
  - method: GET
    path: "/api/stays/{id}/guests"
    description: "List guest registrations of a stay"
    roles: [ProgramAdmin, HouseManager, FamilyContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GuestRegistration[]
    side_effects: []
  - method: POST
    path: "/api/stays/{id}/screenings"
    description: "Record a daily illness screening; result computed from temperature and symptom count"
    roles: [HouseManager, ProgramAdmin]
    code: 201
    input: [temperature_tenths_c, symptom_count, "notes?"]
    output: IllnessScreening
    side_effects: ["result computed per screening_result"]
  - method: GET
    path: "/api/stays/{id}/screenings"
    description: "List illness screenings of a stay"
    roles: [ProgramAdmin, HouseManager, FamilyContact]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: IllnessScreening[]
    side_effects: []
  - method: POST
    path: "/api/stays/{id}/request-extension"
    description: "Request additional nights; routes the stay into UNDER_REVIEW"
    roles: [FamilyContact, HouseManager]
    code: 200
    input: [additional_nights]
    output: Stay
    side_effects: ["Stay ACTIVE -> UNDER_REVIEW; pending_extension_nights set; review_reason EXTENSION_REQUEST"]
  - method: POST
    path: "/api/stays/{id}/review"
    description: "Review decision: APPROVE_EXTENSION / DENY_EXTENSION / PLAN_TRANSITION / RELOCATE"
    roles: [HouseManager, ProgramAdmin]
    code: 200
    input: [decision, "transition_plan_notes?", "relocation_room_id?"]
    output: Stay
    side_effects:
      - "APPROVE_EXTENSION from UNDER_REVIEW: expected_check_out_date += pending_extension_nights, approved_extension_count += 1, -> ACTIVE"
      - "DENY_EXTENSION: -> ACTIVE with no date change"
      - "PLAN_TRANSITION: -> TRANSITION_PLANNED with notes"
      - "APPROVE_EXTENSION from TRANSITION_PLANNED: -> ACTIVE (plan revised, stay continues)"
      - "RELOCATE from RELOCATION_REQUIRED: room_id switched, new room occupied, -> ACTIVE"
  - method: POST
    path: "/api/stays/{id}/check-out"
    description: "Check out a stay; never blocked by unpaid contributions; cascades room release, promotion, guest departure, contribution settlement/forgiveness"
    roles: [HouseManager, ProgramAdmin]
    code: 200
    input: []
    output: Stay
    side_effects:
      - "actual_check_out_date stamped; Room.occupied -> false"
      - "Freed room immediately re-offered to the highest-ranked eligible waitlisted request (if any)"
      - "REGISTERED guests -> DEPARTED"
      - "OPEN/PARTIALLY_PAID contribution requests settled and FORGIVEN"

  # --- ContributionRequest ---
  - method: POST
    path: "/api/stays/{id}/contribution-requests"
    description: "Create a suggested contribution request for a stay (never a condition of stay)"
    roles: [HouseManager, ProgramAdmin]
    code: 201
    input: [nightly_rate_cents, planned_nights, hardship_tier]
    output: ContributionRequest
    side_effects: ["per_night_cents and requested_amount_cents computed (estimated variant); status OPEN"]
  - method: GET
    path: "/api/stays/{id}/contribution-requests"
    description: "List contribution requests of a stay"
    roles: [ProgramAdmin, HouseManager, FamilyContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ContributionRequest[]
    side_effects: []
  - method: GET
    path: "/api/contribution-requests/{id}"
    description: "Get a contribution request"
    roles: [ProgramAdmin, HouseManager, FamilyContact]
    code: 200
    input: []
    output: ContributionRequest
    side_effects: []
  - method: POST
    path: "/api/contribution-requests/{id}/record-payment"
    description: "Record a payment toward a contribution request"
    roles: [FamilyContact, HouseManager]
    code: 200
    input: [amount_cents]
    output: ContributionRequest
    side_effects: ["paid_cents += amount_cents; status -> PARTIALLY_PAID or PAID; outstanding_cents recomputed"]
  - method: POST
    path: "/api/contribution-requests/{id}/waive"
    description: "Waive the outstanding balance of a contribution request"
    roles: [HouseManager, ProgramAdmin]
    code: 200
    input: []
    output: ContributionRequest
    side_effects: ["waived_cents = outstanding_cents; outstanding_cents := 0; status WAIVED"]

  # --- Volunteer meal program ---
  - method: POST
    path: "/api/volunteer-groups"
    description: "Register a volunteer group"
    roles: [VolunteerCoordinator, ProgramAdmin]
    code: 201
    input: [group_name, contact_email]
    output: VolunteerGroup
    side_effects: ["certification_status UNCERTIFIED"]
  - method: GET
    path: "/api/volunteer-groups/{id}"
    description: "Get a volunteer group"
    roles: [VolunteerCoordinator, ProgramAdmin, HouseManager]
    code: 200
    input: []
    output: VolunteerGroup
    side_effects: []
  - method: POST
    path: "/api/volunteer-groups/{id}/certify"
    description: "Certify a volunteer group for food safety through a date"
    roles: [ProgramAdmin]
    code: 200
    input: [certified_until]
    output: VolunteerGroup
    side_effects: ["certified_until set; certification_status recomputed against the logical clock"]
  - method: GET
    path: "/api/volunteer-groups/{id}/meal-shifts"
    description: "List meal shifts claimed by a volunteer group"
    roles: [VolunteerCoordinator, ProgramAdmin, HouseManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: MealShift[]
    side_effects: []
  - method: POST
    path: "/api/houses/{id}/meal-shifts"
    description: "Schedule a volunteer meal shift; unique per (house, shift_date, meal_type)"
    roles: [HouseManager, ProgramAdmin]
    code: 201
    input: [shift_date, meal_type, servings_planned]
    output: MealShift
    side_effects: ["status OPEN"]
  - method: GET
    path: "/api/houses/{id}/meal-shifts"
    description: "List meal shifts at a house"
    roles: [HouseManager, ProgramAdmin, VolunteerCoordinator]
    code: 200
    input: ["shift_date?", "status?", "limit?", "offset?"]
    output: MealShift[]
    side_effects: []
  - method: POST
    path: "/api/meal-shifts/{id}/claim"
    description: "Volunteer group claims an open shift; requires valid food-safety certification through the shift date"
    roles: [VolunteerCoordinator]
    code: 200
    input: [volunteer_group_id]
    output: MealShift
    side_effects: ["status CLAIMED; claimed_by_group_id set"]
  - method: POST
    path: "/api/meal-shifts/{id}/complete"
    description: "Complete a claimed shift with a food-safety attestation"
    roles: [VolunteerCoordinator, HouseManager]
    code: 200
    input: [servings_served, food_safety_attested]
    output: MealShift
    side_effects: ["status COMPLETED; servings_served and attestation recorded"]
  - method: POST
    path: "/api/meal-shifts/{id}/cancel"
    description: "Cancel an open shift (terminal) or release a claimed shift back to OPEN"
    roles: [VolunteerCoordinator, HouseManager, ProgramAdmin]
    code: 200
    input: []
    output: MealShift
    side_effects: ["CLAIMED -> OPEN (claim cleared) or OPEN -> CANCELLED"]

  # --- Care spaces (family room / mobile care unit inside hospitals) ---
  - method: POST
    path: "/api/hospitals/{id}/care-spaces"
    description: "Create a family room or mobile care unit inside a hospital"
    roles: [ProgramAdmin]
    code: 201
    input: [space_name, space_type, capacity]
    output: CareSpace
    side_effects: []
  - method: GET
    path: "/api/care-spaces/{id}"
    description: "Get a care space"
    roles: [ProgramAdmin, HouseManager, HospitalReferrer, FamilyContact, VolunteerCoordinator]
    code: 200
    input: []
    output: CareSpace
    side_effects: []
  - method: POST
    path: "/api/care-spaces/{id}/bookings"
    description: "Book a care space; requires a VERIFIED referral at this hospital; 30-minute cleaning buffer between bookings"
    roles: [FamilyContact, HouseManager]
    code: 201
    input: [family_id, start_at, end_at, party_size]
    output: CareSpaceBooking
    side_effects: ["status CONFIRMED"]
  - method: GET
    path: "/api/care-spaces/{id}/bookings"
    description: "List bookings of a care space"
    roles: [ProgramAdmin, HouseManager, HospitalReferrer, FamilyContact, VolunteerCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CareSpaceBooking[]
    side_effects: []
  - method: POST
    path: "/api/care-space-bookings/{id}/cancel"
    description: "Cancel a confirmed booking; frees the window"
    roles: [FamilyContact, HouseManager]
    code: 200
    input: []
    output: CareSpaceBooking
    side_effects: ["status CANCELLED"]

  # --- In-kind donations ---
  - method: POST
    path: "/api/houses/{id}/in-kind-donations"
    description: "Record a donation of goods"
    roles: [HouseManager, ProgramAdmin]
    code: 201
    input: [donor_name, supply_category, quantity_received]
    output: InKindDonation
    side_effects: ["status RECEIVED; supply rollup recomputed"]
  - method: GET
    path: "/api/houses/{id}/in-kind-donations"
    description: "List in-kind donations of a house"
    roles: [HouseManager, ProgramAdmin]
    code: 200
    input: ["supply_category?", "status?", "limit?", "offset?"]
    output: InKindDonation[]
    side_effects: []
  - method: POST
    path: "/api/in-kind-donations/{id}/distribute"
    description: "Distribute units from a donation"
    roles: [HouseManager, ProgramAdmin]
    code: 200
    input: [quantity]
    output: InKindDonation
    side_effects: ["quantity_distributed += quantity; status -> PARTIALLY_DISTRIBUTED or DEPLETED; supply rollup recomputed"]

  # --- Ops-run checkpoints ---
  - method: POST
    path: "/api/houses/{id}/run-assignment-sweep"
    description: "Assignment epoch: expire stale offers and referrals, then promote the waitlist into freed capacity per assignment_capacity_snapshot"
    roles: [HouseManager, ProgramAdmin]
    code: 200
    input: []
    output: { expired_offer_ids: "string[]", expired_referral_ids: "string[]", promoted_request_ids: "string[]" }
    side_effects: ["Offer expiries, referral expiries with their cascades, waitlist promotions in ranking order"]
  - method: POST
    path: "/api/houses/{id}/run-stay-review-sweep"
    description: "Stay-review epoch: flag ACTIVE stays at or past 21 nights for length-of-stay review"
    roles: [HouseManager, ProgramAdmin]
    code: 200
    input: []
    output: { flagged_stay_ids: "string[]" }
    side_effects: ["ACTIVE stays with nights_at_house >= 21 -> UNDER_REVIEW (review_reason STAY_LENGTH)"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, unknown field, invalid enum value or type" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or entity-backed ownership check failed" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Referral verifier X-User-ID equals referral.created_by_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource in a wrong state for the requested transition" }
  - { id: ERR_STAY_NOT_ACTIVE, http: 409, condition: "Stay not ACTIVE where ACTIVE is required (request-extension, and stay-state gating on guest/screening-adjacent flows)" }
  - { id: ERR_OFFER_EXPIRED, http: 409, condition: "Respond attempted after offer_expires_at" }
  - { id: ERR_DONATION_DEPLETED, http: 409, condition: "Distribute attempted on a DEPLETED donation" }
  - { id: ERR_REFERRAL_NOT_VERIFIED, http: 409, condition: "Offer or stay extension requires verification_status VERIFICATION_OK / referral VERIFIED" }
  - { id: ERR_SCREENING_NOT_CLEARED, http: 422, condition: "Guest registration without a same-day PASS illness screening" }
  - { id: ERR_FOOD_SAFETY_CERT_REQUIRED, http: 422, condition: "Meal-shift claim by an UNCERTIFIED volunteer group, or completion without attestation" }
  - { id: ERR_FOOD_SAFETY_CERT_EXPIRED, http: 422, condition: "Meal-shift claim where certified_until < shift_date" }
  - { id: ERR_FOOD_SAFETY_ATTESTATION_REQUIRED, http: 422, condition: "Meal-shift completion with food_safety_attested != true" }
  - { id: ERR_DISTANCE_INELIGIBLE, http: 422, condition: "Stay request for a family with distance_miles < 50" }
  - { id: ERR_GUEST_LIMIT_EXCEEDED, http: 422, condition: "Overnight guest registration would exceed the room occupancy_limit" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Care-space booking party_size exceeds the space capacity" }
  - { id: ERR_ROOM_NOT_AVAILABLE, http: 409, condition: "Room occupied, reserved by another OFFERED request, or not AVAILABLE" }
  - { id: ERR_ROOM_HOUSE_MISMATCH, http: 422, condition: "Offered/relocated room does not belong to the request's house" }
  - { id: ERR_CARE_SPACE_CONFLICT, http: 409, condition: "Booking overlaps a CONFIRMED booking's buffered window on the same care space" }
  - { id: ERR_DUPLICATE_MEAL_SHIFT, http: 409, condition: "A meal shift already exists for (house, shift_date, meal_type)" }
  - { id: ERR_DUPLICATE_ACTIVE_REFERRAL, http: 409, condition: "A non-terminal (PENDING or VERIFIED) referral already exists for (family_id, hospital_id)" }
  - { id: ERR_REFERRAL_FAMILY_MISMATCH, http: 422, condition: "Stay request's referral_id belongs to a different family" }
  - { id: ERR_BOOKING_REFERRAL_MISMATCH, http: 422, condition: "Care-space booking family lacks a VERIFIED referral at the care space's hospital" }
  - { id: ERR_INVALID_DATE_RANGE, http: 422, condition: "end_at not strictly after start_at, or expected_nights <= 0" }
  - { id: ERR_TRANSITION_PLAN_REQUIRED, http: 409, condition: "Extension requested when approved_extension_count >= 2; a transition plan must be put in place first" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment amount exceeds outstanding_cents" }
  - { id: ERR_INSUFFICIENT_SUPPLY, http: 422, condition: "Distribution quantity exceeds the donation's remaining units" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Charity platform administrator; configures houses, hospitals, care spaces; certifies volunteer groups; segregated from referral creation when verifying"
    identity: opaque
    exclusive_operations:
      - "POST /api/houses, POST /api/hospitals, POST /api/hospitals/{id}/care-spaces"
      - "POST /api/volunteer-groups/{id}/certify"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "Referral create/verify/revoke; house operations; sweeps; most reads"

  - name: HouseManager
    description: "House operations manager; runs rooms, offers, check-in/out, screenings, reviews, contributions, meal shifts, donations"
    identity: opaque
    exclusive_operations:
      - "POST /api/stay-requests/{id}/offer, POST /api/stay-requests/{id}/check-in (with ProgramAdmin)"
      - "POST /api/stays/{id}/screenings, POST /api/stays/{id}/review"
      - "POST /api/contribution-requests/{id}/waive"
      - "POST /api/houses/{id}/in-kind-donations, POST /api/in-kind-donations/{id}/distribute"
      - "POST /api/houses/{id}/run-assignment-sweep, POST /api/houses/{id}/run-stay-review-sweep (with ProgramAdmin)"
    shared_operations:
      - "Referral verification; guest registration; payments; bookings; reads"

  - name: HospitalReferrer
    description: "Referring clinician coordinator at a treating hospital; X-User-ID equals the Hospital id; owns referral issuance and revocation for that hospital"
    identity: "entity_backed:Hospital"
    exclusive_operations:
      - "POST /api/referrals (hospital_id must equal X-User-ID)"
      - "POST /api/referrals/{id}/revoke (referral.hospital_id must equal X-User-ID)"
    shared_operations:
      - "GET /api/hospitals/{id}/referrals, GET /api/referrals/{id}, care-space reads"

  - name: FamilyContact
    description: "Primary contact of a guest family; X-User-ID equals the Family id"
    identity: "entity_backed:Family"
    exclusive_operations:
      - "POST /api/stay-requests/{id}/respond (only role allowed to answer offers)"
    shared_operations:
      - "POST /api/stay-requests (own family), cancel (own), guest registration (own stay), request-extension (own stay), record-payment (own), care-space bookings (own family), own-resource reads"

  - name: VolunteerCoordinator
    description: "Coordinator for volunteer meal groups; claims and completes meal shifts"
    identity: opaque
    exclusive_operations:
      - "POST /api/volunteer-groups (with ProgramAdmin)"
      - "POST /api/meal-shifts/{id}/claim"
    shared_operations:
      - "Meal-shift complete/cancel; meal program reads"
