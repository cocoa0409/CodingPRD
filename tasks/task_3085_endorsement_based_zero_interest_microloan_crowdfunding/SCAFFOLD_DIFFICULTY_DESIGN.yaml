  - rule_id: resource_temporal_overlap
    instances:
      - name: private_window_expiry_boundary
        grounds:
          - state_machines.LoanApplication.PRIVATE_FUNDRAISING_to_EXPIRED_PRIVATE
          - entities.LoanApplication.fields.private_deadline
        distinguishing_aspect: |
          Interval semantics — strict-deadline expiry: an endorsement at
          exactly private_deadline (<=) succeeds; one instant past it the
          sweep expires the application (>). The 15-day private window on
          LoanApplication rejects late occupancy, unlike the loan-level
          grace-window semantics in the sibling instance.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Borrower with 3 accepts; approved self-endorsed application 300000 / 4 months opened to private at 2026-09-01 (private_deadline 2026-09-16T00:00:00Z). Lender with 500000 balance."
