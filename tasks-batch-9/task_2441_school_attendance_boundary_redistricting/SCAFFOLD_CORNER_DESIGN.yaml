    claim_type: valid_transition
    grounds:
    - state_machines.BoundaryScenario.REVISION_to_UNDER_REVIEW
    - complexity_profile.state_machine_shape
    excluded_because:
      difficulty_instance: non_linear_state_machine / scenario_engagement_revision_loop_returns_to_under_review
      rationale: The cyclic UNDER_REVIEW -> REVISION -> UNDER_REVIEW round trip, the COMMENT_CYCLE revision_reason and the TRIAGED -> ADDRESSED comment leg are all asserted by the named §1.8 instance.
  - name: adoption_parallel_state_dimensions_move_independently
    claim_type: side_effect_execution
    grounds:
    - state_machines.AdoptionRecord.TRANSFER_WINDOW_OPEN_to_TRANSFER_WINDOW_CLOSED
    - complexity_profile.state_machine_shape
    excluded_because:
      difficulty_instance: non_linear_state_machine / adoption_transfer_window_dimension_moves_independently_of_implementation
      rationale: The parallel-shape claim - transfer_window_status and implementation_status advancing without touching each other - is the whole subject of the named §1.8 instance.
  - name: adoption_cascade_rejects_siblings_and_dismisses_their_comments
    claim_type: side_effect_execution
    grounds:
    - state_machines.BoundaryScenario.DRAFT_to_REJECTED
    - state_machines.PublicComment.SUBMITTED_to_DISMISSED
    excluded_because:
      difficulty_instance: transitive_cascade / adoption_cascades_three_links_to_sibling_comments
      rationale: The cascade-down side effect and its conditional third link on sibling comments are asserted link by link in the named §1.8 instance.
  - name: rescind_compensates_every_activation_side_effect
    claim_type: side_effect_execution
    grounds:
    - state_machines.AdoptionRecord.IN_EFFECT_to_RESCINDED
    - entities.School.fields.enrolled_students_of_record
    excluded_because:
      difficulty_instance: compensating_invariant / rescind_restores_district_enrolled_of_record_exactly
      rationale: The compensation pattern - undo transition reverses every original side effect with no drift - is asserted at three observation points by the named §1.8 instance.
- section: calculations
  instances:
  - name: capacity_utilization_counts_program_seats_over_effective_capacity
    claim_type: correct_result
    grounds:
    - calculations.school_capacity_utilization
    - calculations.area_enrollment_projection
    - entities.School.fields.effective_capacity_seats
    - entities.BoundaryScenario.fields.max_utilization_pct
    - endpoints[GET /redistricting/scenarios/{id}/impact-analysis]
    distinguishing_aspect: Utilization is projected students PLUS the program seats hosted at that school, over effective_capacity_seats - not raw core capacity and not students alone. Cedar carries 271 + 181 projected students and 30 DUAL_LANGUAGE seats against 540 effective seats (500 core + 40 portables, admitted because portables_count_toward_capacity is true) = 89.26; Birch carries 136 against 400 = 34.00. Dropping the program seats would give 83.70 and using core capacity alone would give 96.40, so all three inputs are pinned by one number.
    test_recipe:
      setup:
      - The Riverbend study is in SCENARIO_DEVELOPMENT with a COMPLETE COHORT_SURVIVAL run projecting 271 / 181 / 136 students for A-01 / A-02 / A-03.
      - Scenario A assigns A-01 and A-02 to Cedar Elementary and A-03 to Birch Elementary, and places 30 DUAL_LANGUAGE seats at Cedar.
      - portables_count_toward_capacity is true on the study, so Cedar's effective capacity is 540 and Birch's is 400.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/studies
        payload:
          name: 2028 Elementary Boundary Study
          district_name: Riverbend USD
          target_school_year: 2028
          horizon_years: 5
          capacity_target_low_pct: 85.0
          capacity_target_high_pct: 100.0
          portables_count_toward_capacity: true
          required_program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          st_id: $.data.id
      - call: POST /redistricting/studies/${st_id}/schools
        payload:
          name: Cedar Elementary
          level: ELEMENTARY
          core_capacity_seats: 500
          portable_capacity_seats: 40
          program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          s1_id: $.data.id
      - call: POST /redistricting/studies/${st_id}/schools
        payload:
          name: Birch Elementary
          level: ELEMENTARY
          core_capacity_seats: 400
          portable_capacity_seats: 0
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          s2_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-01
          grade_band: ELEMENTARY
          current_school_id: ${s1_id}
          resident_student_count: 300
          frl_student_count: 90
          ell_student_count: 40
          median_household_income_usd: 78000
          annual_absorption_cap_units: 120
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 0.6
            bus_minutes: 10
            has_safe_route: true
          - school_id: ${s2_id}
            walk_distance_miles: 2.2
            bus_minutes: 22
            has_safe_route: false
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a1_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-02
          grade_band: ELEMENTARY
          current_school_id: ${s1_id}
          resident_student_count: 200
          frl_student_count: 100
          ell_student_count: 30
          median_household_income_usd: 52000
          annual_absorption_cap_units: 150
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 1.4
            bus_minutes: 9
            has_safe_route: false
          - school_id: ${s2_id}
            walk_distance_miles: 0.8
            bus_minutes: 12
            has_safe_route: true
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a2_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-03
          grade_band: ELEMENTARY
          current_school_id: ${s2_id}
          resident_student_count: 150
          frl_student_count: 30
          ell_student_count: 10
          median_household_income_usd: 96000
          annual_absorption_cap_units: 90
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 3.0
            bus_minutes: 26
            has_safe_route: false
          - school_id: ${s2_id}
            walk_distance_miles: 0.9
            bus_minutes: 14
            has_safe_route: true
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a3_id: $.data.id
      - call: POST /redistricting/area-adjacencies
        payload:
          area_id: ${a1_id}
          neighbor_area_id: ${a2_id}
          shared_boundary_length_ft: 5200
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/area-adjacencies
        payload:
          area_id: ${a2_id}
          neighbor_area_id: ${a3_id}
          shared_boundary_length_ft: 4100
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/studies/${st_id}/lock-data
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
      - call: GET /redistricting/studies/${st_id}
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          st_v1: $.data.version
      - call: POST /redistricting/studies/${st_id}/projection-runs
        payload:
          variant: COHORT_SURVIVAL
          expected_study_version: ${st_v1}
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          run_cs_id: $.data.id
      - call: POST /redistricting/scenarios
        payload:
          study_id: ${st_id}
          projection_run_id: ${run_cs_id}
          name: Scenario A
          program_placements:
          - program_type: DUAL_LANGUAGE
            school_id: ${s1_id}
            seats: 30
          impact_variant: RESIDENT_BASED
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          sc_id: $.data.id
          sc_id_v0: $.data.version
      - call: POST /redistricting/assignments
        payload:
          scenario_id: ${sc_id}
          area_id: ${a1_id}
          assigned_school_id: ${s1_id}
          expected_scenario_version: ${sc_id_v0}
        as: DistrictPlanner
        as_user_id: planner-1
      - call: GET /redistricting/scenarios/${sc_id}
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          sc_id_v1: $.data.version
      - call: POST /redistricting/assignments
        payload:
          scenario_id: ${sc_id}
          area_id: ${a2_id}
          assigned_school_id: ${s1_id}
          expected_scenario_version: ${sc_id_v1}
        as: DistrictPlanner
        as_user_id: planner-1
      - call: GET /redistricting/scenarios/${sc_id}
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          sc_id_v2: $.data.version
      - call: POST /redistricting/assignments
        payload:
          scenario_id: ${sc_id}
          area_id: ${a3_id}
          assigned_school_id: ${s2_id}
          expected_scenario_version: ${sc_id_v2}
        as: DistrictPlanner
        as_user_id: planner-1
      trigger:
      - call: POST /redistricting/scenarios/${sc_id}/submit-for-review
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
      - call: GET /redistricting/scenarios/${sc_id}/impact-analysis
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
      assert:
      - The submit returns HTTP 200 and BoundaryScenario.${sc_id}.status == UNDER_REVIEW
      - BoundaryScenario.${sc_id}.total_assigned_students == 588
      - BoundaryScenario.${sc_id}.max_utilization_pct == 89.26
      - School.${s1_id}.effective_capacity_seats == 540 and School.${s2_id}.effective_capacity_seats == 400
      - The impact-analysis per_school entry for ${s1_id} reports utilization_pct == 89.26
      - The impact-analysis per_school entry for ${s2_id} reports utilization_pct == 34.00
      - The impact-analysis critical_school_ids == [] and contiguity_ok == true
  - name: projection_excludes_withdrawn_developments_from_the_pipeline
    claim_type: input_set_filtering
    grounds:
    - calculations.area_enrollment_projection
    - state_machines.HousingDevelopment.PROPOSED_to_WITHDRAWN
    - entities.ProjectionRun.fields.area_projections
    - endpoints[POST /redistricting/studies/{id}/projection-runs]
    distinguishing_aspect: 'The DEVELOPMENT_WEIGHTED inclusion set admits every entitlement stage EXCEPT WITHDRAWN, so a withdrawn development contributes nothing even though its units, yield and buildout are unchanged: A-01 gets 271 base + 12.60 from Willow Ridge only = 284. A server that applied ENTITLEMENT_WEIGHT_WITHDRAWN 0.00 rather than skipping the row would reach the same total here, but one that forgot the filter entirely would report 15.73 / 287 and a study total of 604.'
    test_recipe:
      setup:
      - 'The Riverbend study is DATA_LOCKED and area A-01 carries two housing developments: ''Willow Ridge'' (120 SINGLE_FAMILY units, first occupancy 2027-01-01, 24-month buildout, PROPOSED) and ''Cinder Row'' (50 TOWNHOME units, first occupancy 2027-06-01, 12-month buildout).'
      - Cinder Row has been advanced PROPOSED -> WITHDRAWN, so only Willow Ridge remains in the pipeline. A-01's absorption cap of 120 units is not breached at any probe window while both rows exist (peak 110.00).
      - The clock reads 2026-09-01T00:00:00Z, so with horizon_years 5 the horizon ends 2031-08-31 and both developments are fully occupied (occ clamps to 1.00).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/studies
        payload:
          name: 2028 Elementary Boundary Study
          district_name: Riverbend USD
          target_school_year: 2028
          horizon_years: 5
          capacity_target_low_pct: 85.0
          capacity_target_high_pct: 100.0
          portables_count_toward_capacity: true
          required_program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          st_id: $.data.id
      - call: POST /redistricting/studies/${st_id}/schools
        payload:
          name: Cedar Elementary
          level: ELEMENTARY
          core_capacity_seats: 500
          portable_capacity_seats: 40
          program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          s1_id: $.data.id
      - call: POST /redistricting/studies/${st_id}/schools
        payload:
          name: Birch Elementary
          level: ELEMENTARY
          core_capacity_seats: 400
          portable_capacity_seats: 0
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          s2_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-01
          grade_band: ELEMENTARY
          current_school_id: ${s1_id}
          resident_student_count: 300
          frl_student_count: 90
          ell_student_count: 40
          median_household_income_usd: 78000
          annual_absorption_cap_units: 120
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 0.6
            bus_minutes: 10
            has_safe_route: true
          - school_id: ${s2_id}
            walk_distance_miles: 2.2
            bus_minutes: 22
            has_safe_route: false
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a1_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-02
          grade_band: ELEMENTARY
          current_school_id: ${s1_id}
          resident_student_count: 200
          frl_student_count: 100
          ell_student_count: 30
          median_household_income_usd: 52000
          annual_absorption_cap_units: 150
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 1.4
            bus_minutes: 9
            has_safe_route: false
          - school_id: ${s2_id}
            walk_distance_miles: 0.8
            bus_minutes: 12
            has_safe_route: true
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a2_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${st_id}
          area_code: A-03
          grade_band: ELEMENTARY
          current_school_id: ${s2_id}
          resident_student_count: 150
          frl_student_count: 30
          ell_student_count: 10
          median_household_income_usd: 96000
          annual_absorption_cap_units: 90
          travel_options:
          - school_id: ${s1_id}
            walk_distance_miles: 3.0
            bus_minutes: 26
            has_safe_route: false
          - school_id: ${s2_id}
            walk_distance_miles: 0.9
            bus_minutes: 14
            has_safe_route: true
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          a3_id: $.data.id
      - call: POST /redistricting/area-adjacencies
        payload:
          area_id: ${a1_id}
          neighbor_area_id: ${a2_id}
          shared_boundary_length_ft: 5200
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/area-adjacencies
        payload:
          area_id: ${a2_id}
          neighbor_area_id: ${a3_id}
          shared_boundary_length_ft: 4100
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/studies/${st_id}/lock-data
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/planning-areas/${a1_id}/housing-developments
        payload:
          name: Willow Ridge
          unit_type: SINGLE_FAMILY
          total_units: 120
          first_occupancy_date: '2027-01-01T00:00:00Z'
          buildout_months: 24
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          dwa_id: $.data.id
      - call: POST /redistricting/planning-areas/${a1_id}/housing-developments
        payload:
          name: Cinder Row
          unit_type: TOWNHOME
          total_units: 50
          first_occupancy_date: '2027-06-01T00:00:00Z'
          buildout_months: 12
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          dwb_id: $.data.id
      - call: POST /redistricting/housing-developments/${dwb_id}/entitlement-advance
        payload:
          to_status: WITHDRAWN
        as: DistrictPlanner
        as_user_id: planner-1
      - call: GET /redistricting/studies/${st_id}
        payload: {}
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          stw_v: $.data.version
      trigger:
      - call: POST /redistricting/studies/${st_id}/projection-runs
        payload:
          variant: DEVELOPMENT_WEIGHTED
          expected_study_version: ${stw_v}
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          rw_id: $.data.id
      assert:
      - The run returns HTTP 201 with ProjectionRun.${rw_id}.status == COMPLETE and variant == DEVELOPMENT_WEIGHTED
      - ProjectionRun.${rw_id}.area_projections entry for ${a1_id} has base_students == 271 and development_students == 12.60 and projected_students == 284
      - ProjectionRun.${rw_id}.area_projections entry for ${a2_id} has development_students == 0.00 and projected_students == 181
      - ProjectionRun.${rw_id}.area_projections entry for ${a3_id} has development_students == 0.00 and projected_students == 136
      - ProjectionRun.${rw_id}.projected_total_students == 601
      - HousingDevelopment.${dwb_id}.entitlement_status == WITHDRAWN
      - GET /redistricting/planning-areas/${a1_id}/housing-developments with entitlement_status PROPOSED returns total_count == 1
  - name: utilization_one_seat_below_the_critical_threshold_is_accepted
    claim_type: constants_applied
    grounds:
    - calculations.school_capacity_utilization
    - validations[priority=72]
    - errors[ERR_SCHOOL_CAPACITY_CRITICAL]
    - endpoints[PATCH /redistricting/schools/{id}]
    distinguishing_aspect: 'CRITICAL_UTILIZATION_PCT is 110.0 and the test is >=, so 109.78 must pass. Aspen''s core capacity is raised from 500 to 501 seats, which changes nothing else in the scenario: the same 542 projected students and 8 program seats now give round_half_up(100 * 550 / 501, 2) == 109.78 and the submit succeeds. This is the threshold-minus-epsilon side of the boundary, reached by moving the DENOMINATOR rather than the roll.'
    test_recipe:
      setup:
      - The Westvale study is in SCENARIO_DEVELOPMENT with portables_count_toward_capacity false, so Aspen's 60 portable seats never enter the denominator.
      - Scenario 'Stress Corner' puts E-01 (271 projected) and E-02 (271 projected) on Aspen with 8 DUAL_LANGUAGE seats, and E-03 (90 projected) on Larch; Aspen therefore carries 550 seats of demand.
      - Aspen's core_capacity_seats is patched from 500 to 501 before the submit, so its effective capacity is 501 rather than 500.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T00:00:00Z'
        as: DistrictPlanner
        as_user_id: planner-1
      - call: POST /redistricting/studies
        payload:
          name: 2028 Capacity Stress Study
          district_name: Westvale USD
          target_school_year: 2028
          horizon_years: 5
          capacity_target_low_pct: 85.0
          capacity_target_high_pct: 100.0
          portables_count_toward_capacity: false
          required_program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          wt_id: $.data.id
      - call: POST /redistricting/studies/${wt_id}/schools
        payload:
          name: Aspen Elementary
          level: ELEMENTARY
          core_capacity_seats: 500
          portable_capacity_seats: 60
          program_types:
          - DUAL_LANGUAGE
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          w1_id: $.data.id
      - call: POST /redistricting/studies/${wt_id}/schools
        payload:
          name: Larch Elementary
          level: ELEMENTARY
          core_capacity_seats: 900
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          w2_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${wt_id}
          area_code: E-01
          grade_band: ELEMENTARY
          current_school_id: ${w1_id}
          resident_student_count: 300
          frl_student_count: 90
          ell_student_count: 30
          median_household_income_usd: 72000
          annual_absorption_cap_units: 200
          travel_options:
          - school_id: ${w1_id}
            walk_distance_miles: 0.5
            bus_minutes: 10
            has_safe_route: true
          - school_id: ${w2_id}
            walk_distance_miles: 2.4
            bus_minutes: 24
            has_safe_route: false
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          f1_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${wt_id}
          area_code: E-02
          grade_band: ELEMENTARY
          current_school_id: ${w1_id}
          resident_student_count: 300
          frl_student_count: 80
          ell_student_count: 25
          median_household_income_usd: 76000
          annual_absorption_cap_units: 200
          travel_options:
          - school_id: ${w1_id}
            walk_distance_miles: 0.6
            bus_minutes: 11
            has_safe_route: true
          - school_id: ${w2_id}
            walk_distance_miles: 1.9
            bus_minutes: 20
            has_safe_route: false
        as: DistrictPlanner
        as_user_id: planner-1
        captures:
          f2_id: $.data.id
      - call: POST /redistricting/planning-areas
        payload:
          study_id: ${wt_id}
          area_code: E-03
          grade_band: ELEMENTARY
          current_school_id: ${w2_id}
          resident_student_count: 100
          frl_student_count: 20
          ell_student_count: 5
          median_household_income_usd: 98000
          annual_absorption_cap_units: 200
          travel_options:
          - school_id: ${w1_id}
            walk_distance_miles: 2.6
            bus_minutes: 25
