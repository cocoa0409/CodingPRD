            - "One ACTIVE A_ONLY program committing 1000.00 lbs at 1.85 with a 0.40 penalty, and one OPEN 2026-W36 week starting 2026-08-31."
            - "One 2000.00 lb lot harvested 2026-08-31, GRADED at 1200 / 700 / 100 and advanced only as far as PRECOOLED."
            - "One allocation run has already created the PROVISIONAL 1000.00 lb A allocation and moved the week to ALLOCATED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
