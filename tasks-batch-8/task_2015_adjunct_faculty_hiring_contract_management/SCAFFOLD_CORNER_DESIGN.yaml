# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — task_2015_adjunct_faculty_hiring_contract_management
# §1.9 Coverage Index: every testable claim of §1.1–§1.7 NOT already covered
# by SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8). Sections follow the
# claim-extraction-guide taxonomy.
#
# Shared fixture literals (each instance still carries its own full chain):
#   TERM 2026FA: 2026-08-24..2026-12-11 (110 days, 15 whole weeks),
#   early census 2026-09-14, late census 2026-11-02, load_cap 4.50.
#   PCH schedule: base 200000, step 5000 cap 5, window [2026-08-01, 2027-01-31).
#   Section 3.0 wch x chv 1.00 -> load 3.00, gross 9,000,000.
#   Pre-census payable 905,000; late @09-14 payable 2,250,000; late @10-19
#   payable 4,663,636. DAYS_WEIGHTED 4-period split of 9,000,000:
#   [2290909, 2290909, 2290909, 2127273]. EQUAL_SPLIT of 450,000: 4 x 112500.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: department_creation_applies_defaults_and_system_fields
        claim_type: creation_defaults_system_fields
        grounds: [entities.Department, "endpoints: POST /adjunct-hr/departments"]
        distinguishing_aspect: "Omitting active applies default true; server mints id, created_at, updated_at, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /adjunct-hr/departments"
              payload: { code: "GEOG", name: "Geography", contact_hour_value: 1.25 }
              as: HRAdmin
              captures: { dept_id: $.data.id, active: $.data.active, ver: $.data.version }
          assert:
            - "Department.active == true (default applied)"
            - "Department.version == 1 and id is a server-minted bare UUID (no type prefix)"

      - name: department_duplicate_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE]", entities.Department.fields.code]
        distinguishing_aspect: "Second department with the same code -> ERR_DUPLICATE 409; uniqueness is global, not per-name."
        test_recipe:
          setup: ["Department GEOG exists"]
          setup_api_calls:
            - call: "POST /adjunct-hr/departments"
              payload: { code: "GEOG", name: "Geography", contact_hour_value: 1.00 }
              as: HRAdmin
          trigger:
            - call: "POST /adjunct-hr/departments"
              payload: { code: "GEOG", name: "Geology Duplicate", contact_hour_value: 2.00 }
              as: HRAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE"

      - name: department_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID -> 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /adjunct-hr/departments/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: HRAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and HTTP status 404"

      - name: term_creation_invalid_date_span
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_INVALID_DATE_RANGE]", entities.TermConfig.fields.end_date]
        distinguishing_aspect: "Term with 10-day span (< 14 day minimum) rejected; census ordering violation also rejected on a second attempt."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026WI", start_date: "2026-01-05", end_date: "2026-01-14", early_census_date: "2026-01-08", late_census_date: "2026-01-12", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "TRM", name: "TermDept", contact_hour_value: 1.00 }
              as: HRAdmin
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026SP", start_date: "2026-01-12", end_date: "2026-05-08", early_census_date: "2026-04-01", late_census_date: "2026-02-01", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "first create error_id == ERR_INVALID_DATE_RANGE (span 10 days < 14)"
            - "second create error_id == ERR_INVALID_DATE_RANGE (early_census 2026-04-01 > late_census 2026-02-01 violates start <= early < late <= end)"

      - name: term_duplicate_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Term code uniqueness enforced independently of department codes (different entity, same error)."
        test_recipe:
          setup: ["Term 2026FA exists"]
          setup_api_calls:
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
          trigger:
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-25", end_date: "2026-12-12", early_census_date: "2026-09-15", late_census_date: "2026-11-03", load_cap_units: 6.00 }
              as: HRAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE"

      - name: section_natural_key_uniqueness
        claim_type: violation_to_error
        grounds: [entities.CourseSection.fields.section_code, "validations[priority=9]"]
        distinguishing_aspect: "(term_code, course_code, section_code) triple is unique; same course_code in a different term is allowed."
        test_recipe:
          setup: ["Department + term exist; section (2026FA, PSY-101, 01) exists"]
          setup_api_calls:
            - call: "POST /adjunct-hr/departments"
              payload: { code: "PSYC", name: "Psychology", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2027SP", start_date: "2027-01-11", end_date: "2027-05-07", early_census_date: "2027-02-01", late_census_date: "2027-03-29", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term2_id: $.data.id }
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026FA", course_code: "PSY-101", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 20, min_enrollment: 5 }
              as: DepartmentChair
          trigger:
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026FA", course_code: "PSY-101", section_code: "01", weekly_contact_hours: 4.0, credit_hours: 4, enrollment: 10, min_enrollment: 2 }
              as: DepartmentChair
              captures: { err: $.data.error_id }
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2027SP", course_code: "PSY-101", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 10, min_enrollment: 2 }
              as: DepartmentChair
              captures: { sec2: $.data.id }
          assert:
            - "duplicate triple rejected with error_id == ERR_DUPLICATE"
            - "same course+section in a different term succeeds (2027SP section created)"

      - name: payroll_entry_immutable_no_update_endpoint
        claim_type: immutability
        grounds: [entities.PayrollEntry]
        distinguishing_aspect: "PayrollEntry has common_fields=false: response carries id and created_at but no version/updated_at, and no PUT/PATCH/DELETE endpoint exists for it."
        test_recipe:
          setup: ["a posted PayrollEntry exists (via payroll close over an ACTIVE contract)"]
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "IMMU", name: "ImmutableDept", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 9.00 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_id}/open", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/rate-schedules"
              payload: { department_id: "${dept_id}", education_tier: "MASTERS", rate_basis: "PER_COURSE", base_rate_cents: 450000, longevity_step_cents: 0, longevity_step_cap: 0, effective_start_date: "2026-08-01", effective_end_date: "2027-01-31" }
              as: HRAdmin
              captures: { sched_id: $.data.id }
            - { call: "POST /adjunct-hr/rate-schedules/${sched_id}/publish", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Immu Pool", min_education_tier: "MASTERS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Olga Adjunct", applicant_email: "olga@x.edu", claimed_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app_id: $.data.id }
            - { call: "POST /adjunct-hr/applications/${app_id}/start-review", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRANSCRIPT", evidence_ref: "ev-t-olga", verified_education_tier: "MASTERS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_t: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "BACKGROUND_CHECK", evidence_ref: "ev-b-olga" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_b: $.data.id }
            - call: "POST /adjunct-hr/credentials"
              payload: { application_id: "${app_id}", kind: "TRAINING", evidence_ref: "ev-tr-olga" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { cred_tr: $.data.id }
            - { call: "POST /adjunct-hr/credentials/${cred_t}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_b}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/credentials/${cred_tr}/verify", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - call: "POST /adjunct-hr/applications/${app_id}/approve"
              payload: {}
              as: HRReviewer
              as_user_id: "hr_reviewer_2"
              captures: { faculty_id: $.data.hired_faculty_id }
            - call: "POST /adjunct-hr/sections"
              payload: { department_id: "${dept_id}", term_code: "2026FA", course_code: "IMM-101", section_code: "01", weekly_contact_hours: 3.0, credit_hours: 3, enrollment: 20, min_enrollment: 5 }
              as: DepartmentChair
              captures: { section_id: $.data.id }
            - call: "GET /adjunct-hr/faculty/${faculty_id}"
              payload: {}
              as: HRAdmin
              captures: { fv: $.data.version }
            - call: "POST /adjunct-hr/contracts"
              payload: { faculty_id: "${faculty_id}", section_id: "${section_id}", rate_schedule_id: "${sched_id}", expected_faculty_version: "${fv}" }
              as: DepartmentChair
              captures: { contract_id: $.data.id }
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/payroll-periods"
              payload: { period_code: "2026FA-P1", start_date: "2026-08-24", end_date: "2026-09-20" }
              as: PayrollOfficer
              captures: { p1: $.data.id }
            - { call: "POST /adjunct-hr/payroll-periods/${p1}/lock", payload: {}, as: PayrollOfficer }
            - { call: "POST /adjunct-hr/payroll-periods/${p1}/close", payload: {}, as: PayrollOfficer }
          trigger:
            - call: "GET /adjunct-hr/contracts/${contract_id}/payroll-entries"
              payload: {}
              as: PayrollOfficer
              captures: { entry_id: "$.data[0].id" }
          assert:
            - "PayrollEntry response has id and created_at but no version field (common_fields: false)"
            - "PayrollEntry.entry_kind == ACCRUAL and amount_cents == 450000 (only one period exists at close time, so the EQUAL_SPLIT schedule assigns the full payable to P1)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: posting_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.AdjunctPoolPosting]
        distinguishing_aspect: "A newly created posting is DRAFT and rejects application filing until published."
        test_recipe:
          setup: ["department + term exist; posting created but never published"]
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "DRFT", name: "DraftDept", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Draft Pool", min_education_tier: "BACHELORS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id, status: $.data.posting_status }
          trigger:
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Pia Adjunct", applicant_email: "pia@x.edu", claimed_education_tier: "BACHELORS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { err: $.data.error_id }
          assert:
            - "created posting_status == DRAFT"
            - "application against DRAFT posting rejected with error_id == ERR_POSTING_NOT_OPEN"

      - name: posting_terminal_archived_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.AdjunctPoolPosting]
        distinguishing_aspect: "From ARCHIVED every action (suspend/resume/close/archive/publish) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["posting walked DRAFT -> OPEN -> CLOSED -> ARCHIVED"]
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "ARCH", name: "ArchiveDept", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_id}/open", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Arch Pool", min_education_tier: "BACHELORS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - { call: "POST /adjunct-hr/postings/${posting_id}/close", payload: {}, as: DepartmentChair }
            - { call: "POST /adjunct-hr/postings/${posting_id}/archive", payload: {}, as: DepartmentChair }
          trigger:
            - call: "POST /adjunct-hr/postings/${posting_id}/suspend"
              payload: {}
              as: DepartmentChair
              captures: { err1: $.data.error_id }
            - call: "POST /adjunct-hr/postings/${posting_id}/publish"
              payload: {}
              as: DepartmentChair
              captures: { err2: $.data.error_id }
          assert:
            - "suspend from ARCHIVED -> error_id == ERR_INVALID_STATE"
            - "publish from ARCHIVED -> error_id == ERR_INVALID_STATE"

      - name: posting_archive_blocked_by_in_flight_application
        claim_type: precondition_enforcement
        grounds: ["validations[priority=18]", "errors[ERR_REFERENCE_IN_USE]", state_machines.AdjunctPoolPosting.CLOSED_to_ARCHIVED]
        distinguishing_aspect: "Archive of a CLOSED posting with an UNDER_REVIEW application -> ERR_REFERENCE_IN_USE."
        test_recipe:
          setup: ["posting CLOSED; one application UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "BLCK", name: "BlockDept", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_id}/open", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Block Pool", min_education_tier: "BACHELORS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "Quinn Adjunct", applicant_email: "quinn@x.edu", claimed_education_tier: "BACHELORS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app_id: $.data.id }
            - { call: "POST /adjunct-hr/applications/${app_id}/start-review", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
            - { call: "POST /adjunct-hr/postings/${posting_id}/close", payload: {}, as: DepartmentChair }
          trigger:
            - call: "POST /adjunct-hr/postings/${posting_id}/archive"
              payload: {}
              as: DepartmentChair
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENCE_IN_USE"
            - "AdjunctPoolPosting.${posting_id}.posting_status == CLOSED (unchanged)"

      - name: posting_close_expires_submitted_applications_cascade
        claim_type: side_effect_execution
        grounds: [state_machines.AdjunctPoolPosting.OPEN_to_CLOSED, state_machines.AdjunctApplication.SUBMITTED_to_EXPIRED]
        distinguishing_aspect: "Closing an OPEN posting cascades SUBMITTED applications to EXPIRED while an UNDER_REVIEW application survives."
        test_recipe:
          setup: ["posting OPEN with application A1 SUBMITTED and application A2 UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /adjunct-hr/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: HRAdmin }
            - call: "POST /adjunct-hr/departments"
              payload: { code: "CASC", name: "CascadeDept", contact_hour_value: 1.00 }
              as: HRAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /adjunct-hr/terms"
              payload: { code: "2026FA", start_date: "2026-08-24", end_date: "2026-12-11", early_census_date: "2026-09-14", late_census_date: "2026-11-02", load_cap_units: 4.50 }
              as: HRAdmin
              captures: { term_id: $.data.id }
            - { call: "POST /adjunct-hr/terms/${term_id}/open", payload: {}, as: HRAdmin }
            - call: "POST /adjunct-hr/postings"
              payload: { department_id: "${dept_id}", term_code: "2026FA", title: "Cascade Pool", min_education_tier: "BACHELORS", open_date: "2026-06-01", close_date: "2026-07-15" }
              as: DepartmentChair
              captures: { posting_id: $.data.id }
            - { call: "POST /adjunct-hr/postings/${posting_id}/publish", payload: {}, as: DepartmentChair }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "A One", applicant_email: "a1@x.edu", claimed_education_tier: "BACHELORS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app1: $.data.id }
            - call: "POST /adjunct-hr/applications"
              payload: { posting_id: "${posting_id}", applicant_name: "A Two", applicant_email: "a2@x.edu", claimed_education_tier: "BACHELORS" }
              as: HRReviewer
              as_user_id: "hr_reviewer_1"
              captures: { app2: $.data.id }
            - { call: "POST /adjunct-hr/applications/${app2}/start-review", payload: {}, as: HRReviewer, as_user_id: "hr_reviewer_1" }
          trigger:
            - { call: "POST /adjunct-hr/postings/${posting_id}/close", payload: {}, as: DepartmentChair }
            - call: "GET /adjunct-hr/applications/${app1}"
              payload: {}
              as: HRReviewer
              captures: { st1: $.data.application_status }
            - call: "GET /adjunct-hr/applications/${app2}"
              payload: {}
              as: HRReviewer
              captures: { st2: $.data.application_status }
          assert:
            - "A1.application_status == EXPIRED (conditional cascade hit SUBMITTED only)"
            - "A2.application_status == UNDER_REVIEW (unaffected — conditional cascade spares non-SUBMITTED states)"

      - name: application_approve_creates_faculty_side_effect
        claim_type: side_effect_execution
