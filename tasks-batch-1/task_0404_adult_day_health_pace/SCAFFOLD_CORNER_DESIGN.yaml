# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Adult Day Health & PACE Program — Expert tier
# Breadth probe over §1.1–§1.7; §1.8 depth instances are referenced via
# excluded_because stubs where they already cover a corner.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_program_returns_defaults
        claim_type: Creation
        grounds:
          - entities.Program.fields.status
          - entities.Program.fields.enrolled_count
        distinguishing_aspect: "POST /pace/programs with required fields returns 201, status OPEN, enrolled_count 0, version 1, and lock_in_days defaulting to 30 when omitted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id, ver: $.data.version }
          assert:
            - "response.status == 201"
            - "Program.${prog}.status == OPEN"
            - "Program.${prog}.enrolled_count == 0"
            - "Program.${prog}.version == 1"
            - "Program.${prog}.lock_in_days == 30"

      - name: create_program_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.Program.fields.medicaid_monthly_rate_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /pace/programs omitting medicaid_monthly_rate_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: get_participant_not_found
        claim_type: Not Found
        grounds:
          - entities.Participant
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /pace/participants/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pace/participants/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_participant_unknown_program_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Participant.fields.program_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "POST /pace/participants with a program_id that does not exist returns ERR_NOT_FOUND (404), validated before creation."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /pace/participants"
              payload: { program_id: "00000000-0000-4000-8000-000000000000", full_name: "X", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: participant_system_fields_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Participant.fields.status
          - entities.Participant.fields.ledger_billed_cents
        distinguishing_aspect: "POST /pace/participants ignores any client-supplied status / ledger_billed_cents; the created participant is APPLICANT with ledger_billed_cents 0."
        test_recipe:
          setup: ["A program exists."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Ign", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
          assert:
            - "Participant.${p}.status == APPLICANT"
            - "Participant.${p}.ledger_billed_cents == 0"
            - "Participant.${p}.version == 1"

      - name: list_participants_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Participant
          - endpoints
        distinguishing_aspect: "GET /pace/participants returns an array envelope with pagination fields total_count and has_more, filterable by program_id."
        test_recipe:
          setup: ["A program with one participant."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "One", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
          trigger:
            - call: "GET /pace/participants"
              payload: { program_id: "${prog}" }
              as: ProgramAdmin
          assert:
            - "response.response_type == array"
            - "response.meta has total_count == 1 and has_more == false"

      - name: capitation_immutable_event_admin_count_computed
        claim_type: Computed Fields
        grounds:
          - entities.MedicationOrder.fields.administered_count
          - entities.MedicationAdministration
        distinguishing_aspect: "MedicationAdministration is common_fields:false (no version/update); recording a GIVEN administration increments MedicationOrder.administered_count and the event itself is immutable."
        test_recipe:
          setup: ["ENROLLED participant with an ACTIVE med order and a CHECKED_IN attendance day."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000, lock_in_days: 30, loc_validity_days: 365 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "Med", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc: $.data.id }
            - call: "POST /pace/loc-assessments/${loc}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}" }
              as: IntakeCoordinator
              captures: { cp: $.data.id }
            - call: "POST /pace/care-plans/${cp}/goals"
              payload: { discipline: "RN", description: "G" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "SW" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "MEDICAL_DIRECTOR" }
              as: MedicalDirector
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/participants/${p}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
            - call: "POST /pace/medication-orders"
              payload: { participant_id: "${p}", care_plan_id: "${cp}", drug_name: "Insulin", daily_doses: 2 }
              as: NurseStaff
              captures: { mo: $.data.id }
            - call: "POST /pace/medication-orders/${mo}/activate"
              payload: {}
              as: NurseStaff
            - call: "POST /pace/attendance-days"
              payload: { participant_id: "${p}", service_date: "2026-06-02" }
              as: NurseStaff
              captures: { d: $.data.id }
            - call: "POST /pace/attendance-days/${d}/check-in"
              payload: {}
              as: NurseStaff
          trigger:
            - call: "POST /pace/medication-administrations"
              payload: { medication_order_id: "${mo}", attendance_day_id: "${d}", outcome: "GIVEN", administered_at: "2026-06-02T09:00:00Z" }
              as: NurseStaff
              captures: { adm: $.data.id }
            - call: "GET /pace/medication-orders/${mo}"
              payload: {}
              as: NurseStaff
              captures: { count: $.data.administered_count }
          assert:
            - "MedicationOrder.${mo}.administered_count == 1"

      - name: transport_invalid_enum_direction
        claim_type: Type Constraints
        grounds:
          - entities.TransportLeg.fields.direction
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /pace/transport-legs with direction not in {PICKUP, DROPOFF} returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A participant with a SCHEDULED attendance day."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "T", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/attendance-days"
              payload: { participant_id: "${p}", service_date: "2026-06-02" }
              as: NurseStaff
              captures: { d: $.data.id }
          trigger:
            - call: "POST /pace/transport-legs"
              payload: { attendance_day_id: "${d}", direction: "SIDEWAYS", window_start_min: 480, window_end_min: 540, vehicle_id: "VAN1" }
              as: NurseStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: enrollment_fk_reverse_reachability_filtered_list
        claim_type: flat
        grounds:
          - entities.Enrollment.fields.participant_id
          - endpoints
        distinguishing_aspect: "GET /pace/enrollments?participant_id={id} returns the participant's enrollments as an array (FK reverse-reachability for Enrollment.participant_id); the cascade-created OPEN enrollment is discoverable only here."
        test_recipe:
          setup: ["An ENROLLED participant (one OPEN enrollment created by the enroll cascade)."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000, lock_in_days: 30, loc_validity_days: 365 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "E", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc: $.data.id }
            - call: "POST /pace/loc-assessments/${loc}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}" }
              as: IntakeCoordinator
              captures: { cp: $.data.id }
            - call: "POST /pace/care-plans/${cp}/goals"
              payload: { discipline: "RN", description: "G" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "SW" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "MEDICAL_DIRECTOR" }
              as: MedicalDirector
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/participants/${p}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
          trigger:
            - call: "GET /pace/enrollments"
              payload: { participant_id: "${p}" }
              as: BillingSpecialist
          assert:
            - "response.response_type == array"
            - "response.data[0].status == OPEN"
            - "response.data[0].participant_id == ${p}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: certify_already_certified_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.LevelOfCareAssessment.PENDING_to_CERTIFIED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Certifying a LevelOfCareAssessment already CERTIFIED returns ERR_INVALID_STATE (409); no participant state change."
        test_recipe:
          setup: ["A CERTIFIED loc-assessment."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "L", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc: $.data.id }
            - call: "POST /pace/loc-assessments/${loc}/certify"
              payload: {}
              as: MedicalDirector
          trigger:
            - call: "POST /pace/loc-assessments/${loc}/certify"
              payload: {}
              as: MedicalDirector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminal_disenrolled_cannot_enroll_again
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Participant.DISENROLLMENT_PENDING_to_DISENROLLED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A DISENROLLED participant (terminal) cannot be re-enrolled: POST enroll returns ERR_INVALID_STATE (409) because status is not ELIGIBLE."
        test_recipe:
          setup: ["A participant fully disenrolled (DISENROLLED)."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000, lock_in_days: 30, loc_validity_days: 365 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "D", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/loc-assessments"
              payload: { participant_id: "${p}", nf_score: 75, assessed_on: "2026-05-01" }
              as: IntakeCoordinator
              captures: { loc: $.data.id }
            - call: "POST /pace/loc-assessments/${loc}/certify"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}" }
              as: IntakeCoordinator
              captures: { cp: $.data.id }
            - call: "POST /pace/care-plans/${cp}/goals"
              payload: { discipline: "RN", description: "G" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "RN" }
              as: NurseStaff
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "SW" }
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/sign"
              payload: { discipline: "MEDICAL_DIRECTOR" }
              as: MedicalDirector
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /pace/care-plans/${cp}/activate"
              payload: {}
              as: MedicalDirector
            - call: "POST /pace/participants/${p}/enroll"
              payload: { enrollment_effective_date: "2026-06-01" }
              as: IntakeCoordinator
            - call: "POST /pace/disenrollment-requests"
              payload: { participant_id: "${p}", kind: "VOLUNTARY", reason_code: "MOVED", requested_effective_date: "2026-08-01" }
              as: IntakeCoordinator
              captures: { dr: $.data.id }
            - call: "POST /pace/disenrollment-requests/${dr}/approve"
              payload: {}
              as: MedicalDirector
            - call: "GET /pace/participants/${p}"
              payload: {}
              as: BillingSpecialist
              captures: { pv: $.data.version }
            - call: "POST /pace/disenrollment-requests/${dr}/finalize"
              payload: { expected_participant_version: "${pv}" }
              as: BillingSpecialist
          trigger:
            - call: "POST /pace/participants/${p}/enroll"
              payload: { enrollment_effective_date: "2026-09-01" }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: submit_care_plan_without_goals_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CarePlan.DRAFT_to_IN_REVIEW
          - validations[priority=12]
          - errors[ERR_CARE_PLAN_NO_GOALS]
        distinguishing_aspect: "Submitting a DRAFT care plan with goal_count 0 returns ERR_CARE_PLAN_NO_GOALS (409)."
        test_recipe:
          setup: ["A DRAFT care plan with no goals."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "C", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/care-plans"
              payload: { participant_id: "${p}" }
              as: IntakeCoordinator
              captures: { cp: $.data.id }
          trigger:
            - call: "POST /pace/care-plans/${cp}/submit"
              payload: {}
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_CARE_PLAN_NO_GOALS"

      - name: no_show_cascades_transport_cancel
        claim_type: side_effect_execution
        grounds:
          - state_machines.AttendanceDay.SCHEDULED_to_NO_SHOW
          - entities.TransportLeg.fields.status
        distinguishing_aspect: "Marking a SCHEDULED attendance day NO_SHOW cascades all its PLANNED TransportLeg rows to CANCELLED (conditional cascade: only PLANNED legs)."
        test_recipe:
          setup: ["A SCHEDULED attendance day with one PLANNED transport leg."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "NS", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/attendance-days"
              payload: { participant_id: "${p}", service_date: "2026-06-02" }
              as: NurseStaff
              captures: { d: $.data.id }
            - call: "POST /pace/transport-legs"
              payload: { attendance_day_id: "${d}", direction: "PICKUP", window_start_min: 480, window_end_min: 540, vehicle_id: "VAN1" }
              as: NurseStaff
              captures: { leg: $.data.id }
          trigger:
            - call: "POST /pace/attendance-days/${d}/no-show"
              payload: {}
              as: NurseStaff
            - call: "GET /pace/transport-legs/${leg}"
              payload: {}
              as: NurseStaff
              captures: { leg_status: $.data.status }
          assert:
            - "AttendanceDay.${d}.status == NO_SHOW"
            - "TransportLeg.${leg}.status == CANCELLED"

      - name: complete_from_scheduled_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AttendanceDay.CHECKED_IN_to_COMPLETED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Completing a SCHEDULED (not CHECKED_IN) attendance day returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A SCHEDULED attendance day (never checked in)."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "S", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
              captures: { p: $.data.id }
            - call: "POST /pace/attendance-days"
              payload: { participant_id: "${p}", service_date: "2026-06-02" }
              as: NurseStaff
              captures: { d: $.data.id }
          trigger:
            - call: "POST /pace/attendance-days/${d}/complete"
              payload: {}
              as: NurseStaff
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: idt_incomplete_blocks_activation
        claim_type: precondition_enforcement
        grounds:
          - state_machines.CarePlan.IN_REVIEW_to_ACTIVE
          - calculations.idt_completeness
          - errors[ERR_IDT_INCOMPLETE]
        distinguishing_aspect: "Activating an IN_REVIEW care plan missing a required discipline signature (only RN signed of {RN, SW, MEDICAL_DIRECTOR}) returns ERR_IDT_INCOMPLETE (409)."
        test_recipe:
          setup: ["An IN_REVIEW care plan with one goal but only the RN signature present."]
          setup_api_calls:
            - call: "POST /pace/programs"
              payload: { name: "P", state_code: "CA", daily_census_capacity: 20, max_roster: 100, medicaid_monthly_rate_cents: 350000, medicare_monthly_rate_cents: 280000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /pace/participants"
              payload: { program_id: "${prog}", full_name: "I", date_of_birth: "1955-01-01", dual_eligible: true }
              as: IntakeCoordinator
