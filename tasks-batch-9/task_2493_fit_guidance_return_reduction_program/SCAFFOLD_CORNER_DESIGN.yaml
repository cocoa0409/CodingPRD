      - name: quality_resolve_writes_negative_chargeback_and_penalizes_vendor
        claim_type: constants_applied
        grounds:
          - calculations.return_case_cost_postings
          - calculations.vendor_reliability_score
          - state_machines.ReturnCase.status.QUALITY_REVIEW_to_RESOLVED_REFUNDED
          - entities.Vendor.fields.quality_chargeback_count
        distinguishing_aspect: |
          The QUALITY family is the only branch that appends a sixth, NEGATIVE posting:
          VENDOR_CHARGEBACK_CREDIT = -round(4000 * 2295 / 10000) = -918, and it books 17 handling
          minutes (17 * 62 = 1054) instead of the FIT branch's 9. The signed sum is therefore
          795 + 1054 + 34 + 0 + 67 - 918 = 1032. The same resolve raises the vendor's
          quality_chargeback_count to 1, so reliability_score_bp drops by exactly
          QUALITY_CHARGEBACK_PENALTY_BP to 9500 - still ACTIVE, because 9500 is not below
          VENDOR_PROBATION_BP - while fit_return_count stays 0 and the item stays NORMAL.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH (reliability 10000) with one LISTED TOPS item priced 2295; TOPS 30-day default policy."
            - "One shopper with one delivered line of quantity 1 (gross 2295) and a QUALITY_DEFECT case in QUALITY_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-c5@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "QUALITY_DEFECT" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /fit-program/return-cases/${case_id}/classify"
              payload: { reason_code: "QUALITY_DEFECT" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
              captures: { classified_status: $.data.status }
          trigger:
            - call: "POST /fit-program/return-cases/${case_id}/resolve"
              payload: { item_condition: "RESELLABLE_A" }
              as: ReturnsAuditor
              as_user_id: "auditor-2"
              captures: { resolved_status: $.data.status, refund: $.data.refund_amount_cents, total_cost: $.data.total_cost_cents }
            - call: "GET /fit-program/return-cases/${case_id}/cost-postings"
              payload: {}
              as: ReturnsAuditor
              as_user_id: "auditor-2"
              captures: { p5_component: "$.data[5].component", p5_amount: "$.data[5].amount_cents" }
            - call: "GET /fit-program/vendors/${vendor_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { chargebacks: $.data.quality_chargeback_count, reliability: $.data.reliability_score_bp, vendor_status: $.data.status }
          assert:
            - "${classified_status} == \"QUALITY_REVIEW\""
            - "${resolved_status} == \"RESOLVED_REFUNDED\""
            - "${refund} == 2295"
            - "${total_cost} == 1032"
            - "count(ReturnCostPosting where return_case_id == ${case_id}) == 6"
            - "${p5_component} == \"VENDOR_CHARGEBACK_CREDIT\""
            - "${p5_amount} == -918"
            - "ReturnCostPosting[component == \"PROCESSING_LABOR\"].amount_cents == 1054"
            - "ReturnCostPosting[component == \"REFURB_REPACK\"].amount_cents == 34"
            - "ReturnCostPosting[component == \"MARKDOWN_LOSS\"].amount_cents == 0"
            - "${chargebacks} == 1"
            - "${reliability} == 9500"
            - "${vendor_status} == \"ACTIVE\""
            - "Vendor.${vendor_id}.correction_round_count == 0"
            - "CatalogItem.${item_id}.total_return_count == 1"
            - "CatalogItem.${item_id}.fit_return_count == 0"
            - "CatalogItem.${item_id}.chronic_return_score_bp == 0"
            - "CatalogItem.${item_id}.fit_watch_state == \"NORMAL\""
            - "CatalogItem.${item_id}.return_cost_accrued_cents == 1032"

      - name: return_cost_component_rounding_order_is_pinned
        claim_type: precision
        grounds:
          - calculations.return_case_cost_postings.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / return_cost_rounded_per_component_then_summed
          rationale: "That instance is built on a gross whose per-component fractions all round up, so round-per-component-then-sum and sum-then-round differ, and it asserts every individual posting amount plus the total."

      - name: restocking_fee_tier_boundary_read_off_gross_line
        claim_type: correct_result
        grounds:
          - calculations.return_refund_and_restocking_fee
        excluded_because:
          difficulty_instance: combinatorial_formula / restocking_tier_keyed_on_gross_line_not_refund
          rationale: "That instance sits on a gross that straddles RESTOCK_TIER_2_CENTS once the fee is deducted, proving the tier is keyed on gross_line_cents and not on refund_amount_cents."

      - name: fit_recommendation_confidence_floor_equality_still_emits
        claim_type: correct_result
        grounds:
          - calculations.fit_recommendation.constants.CONFIDENCE_FLOOR_BP
        excluded_because:
          difficulty_instance: dual_variant_calc / fit_recommendation_history_vs_population_divergence
          rationale: "That instance lands the history_weighted confidence exactly on CONFIDENCE_FLOOR_BP 6000 and asserts suppressed == false, pinning the strict < comparison at the boundary."

      - name: fit_recommendation_variant_divergence_on_identical_data
        claim_type: variant_divergence
        grounds:
          - calculations.fit_recommendation.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / fit_recommendation_history_vs_population_divergence
          rationale: "That instance reads both variants off one stored dataset and asserts two different confidence_bp values and variant_applied echoes."

      - name: savings_report_variant_selection_by_query_parameter
        claim_type: variant_selection
        grounds:
          - calculations.intervention_savings.variants
          - endpoints[GET /fit-program/interventions/{id}/savings-report]
        excluded_because:
          difficulty_instance: dual_variant_calc / intervention_savings_attributed_vs_cohort_chronological_divergence
          rationale: "That instance calls the report with the variant parameter omitted, set to deployment_attributed and set to cohort_chronological, and asserts the stored Intervention row keeps the default-variant numbers."

      - name: mapping_coverage_counts_only_verified_spec_points
        claim_type: input_set_filtering
        grounds:
          - calculations.mapping_coverage
        excluded_because:
          difficulty_instance: boundary_precision_check / coverage_exactly_at_minimum_publishes_guidance
          rationale: "That instance maps 4 of 5 VERIFIED size points for coverage_bp exactly 8000 with unmapped_size_labels [\"XS\"], which is the input-set and floor-division corner of this calculation."

  - section: validations
    instances:
      - name: undeclared_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
          - rbac.roles
        distinguishing_aspect: |
          Priority 1 requires X-User-Role to be one of the five declared roles, so a request
          carrying the plausible-but-undeclared role SizingIntern is rejected 401
          ERR_UNAUTHENTICATED before any role-permission check can turn it into a 403, and no
          vendor row is created.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
          trigger:
            - call: "POST /fit-program/vendors"
              payload: { name: "Rogue Apparel", brand_code: "ROGE", correction_budget_cents: 1000 }
              as: SizingIntern
              as_user_id: "intern-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == \"ERR_UNAUTHENTICATED\""
            - "http_status == 401"
            - "count(Vendor where brand_code == \"ROGE\") == 0"

      - name: duplicate_brand_code_returns_duplicate_resource_key
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_RESOURCE_KEY]
          - entities.Vendor.fields.brand_code
        distinguishing_aspect: |
          brand_code is declared unique across Vendor, so a second vendor reusing NRTH returns
          409 ERR_DUPLICATE_RESOURCE_KEY even with a different name, and exactly one vendor row
          survives.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; Vendor NRTH already registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
          trigger:
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Studio", brand_code: "NRTH", correction_budget_cents: 5000 }
              as: MerchOpsAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == \"ERR_DUPLICATE_RESOURCE_KEY\""
            - "http_status == 409"
            - "count(Vendor where brand_code == \"NRTH\") == 1"
            - "Vendor.${vendor_id}.name == \"Northwind Apparel\""
            - "Vendor.${vendor_id}.correction_budget_cents == 250000"

      - name: pagination_limit_above_maximum_returns_invalid_pagination
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          limit 101 exceeds the declared maximum of 100 and offset -1 is below the declared
          minimum, so each list call returns 400 ERR_INVALID_PAGINATION instead of being clamped
          to the boundary, while limit 100 on the same collection succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; Vendor NRTH with one item so the collection is non-empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
          trigger:
            - call: "GET /fit-program/catalog-items"
              payload: { limit: 101, offset: 0 }
              as: MerchOpsAdmin
              captures: { over_err: $.data.error_id }
            - call: "GET /fit-program/catalog-items"
              payload: { limit: 10, offset: -1 }
              as: MerchOpsAdmin
              captures: { neg_err: $.data.error_id }
            - call: "GET /fit-program/catalog-items"
              payload: { limit: 100, offset: 0 }
              as: MerchOpsAdmin
              captures: { ok_total: $.total_count, ok_limit: $.limit }
          assert:
            - "${over_err} == \"ERR_INVALID_PAGINATION\""
            - "${neg_err} == \"ERR_INVALID_PAGINATION\""
            - "http_status == 400"
            - "${ok_total} == 1"
            - "${ok_limit} == 100"

      - name: second_case_on_the_same_order_line_returns_duplicate_return_case
        claim_type: violation_to_error
        grounds:
          - validations[priority=16]
          - errors[ERR_DUPLICATE_RETURN_CASE]
          - entities.ReturnCase.fields.order_line_id
        distinguishing_aspect: |
          Priority 16 blocks a second case while the first is in any live or resolved state, so a
          repeat request on a line whose case is still TRIAGE returns 409
          ERR_DUPLICATE_RETURN_CASE and the shopper's return_case_count stays 1 - the rejected
          attempt does not inflate the abuse rate.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH, one LISTED TOPS item, TOPS 30-day default policy, one shopper with one delivered line and one case already in TRIAGE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-v4@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "FIT_TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_1_id: $.data.id }
          trigger:
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "CHANGE_OF_MIND" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == \"ERR_DUPLICATE_RETURN_CASE\""
            - "http_status == 409"
            - "count(ReturnCase where order_line_id == ${line_id}) == 1"
            - "ReturnCase.${case_1_id}.status == \"TRIAGE\""
            - "ReturnCase.${case_1_id}.reason_code == \"FIT_TOO_SMALL\""
            - "CustomerProfile.${customer_id}.return_case_count == 1"
            - "CustomerProfile.${customer_id}.return_rate_bp == 10000"

      - name: case_creation_without_a_covering_policy_returns_no_return_policy
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_NO_RETURN_POLICY]
          - calculations.effective_return_policy_resolution
        distinguishing_aspect: |
          The only policy row in the database is a BOTTOMS default, so the candidate set for a
          TOPS line is empty and the request fails 422 ERR_NO_RETURN_POLICY. Priority 14 cannot
          fire first here because return_deadline_at is undefined until a policy has been
          resolved, and no ReturnCase row is written at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item; the only ReturnPolicy row is a BOTTOMS CATEGORY_DEFAULT."
            - "One shopper with one delivered TOPS line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-v5@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "BOTTOMS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { bottoms_policy_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "FIT_TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${err_id} == \"ERR_NO_RETURN_POLICY\""
            - "http_status == 422"
            - "count(ReturnCase where order_line_id == ${line_id}) == 0"
            - "OrderLine.${line_id}.status == \"DELIVERED\""
            - "CustomerProfile.${customer_id}.return_case_count == 0"
            - "ReturnPolicy.${bottoms_policy_id}.category_code == \"BOTTOMS\""

      - name: second_specification_while_revision_in_flight_returns_conflict
        claim_type: violation_to_error
        grounds:
          - validations[priority=18]
          - errors[ERR_SPEC_REVISION_IN_FLIGHT]
          - entities.MeasurementSpec.fields.status
        distinguishing_aspect: |
          Priority 18 rejects a second specification while the item still has one in DRAFT,
          SUBMITTED or CORRECTION_REQUESTED, so a vendor cannot bypass the correction loop by
          filing a fresh specification: the call returns 409 ERR_SPEC_REVISION_IN_FLIGHT and the
          item keeps exactly one specification.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one TOPS item whose first specification is SUBMITTED and not yet verified."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/measurement-specs"
              payload: { item_id: "${item_id}", size_system: "US_ALPHA", base_size_label: "S", fabric_stretch_class: "RIGID", size_points: [{ size_label: "S", sort_index: 0, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }, { size_label: "M", sort_index: 1, chest_mm: 880, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }], grade_rules: [{ measurement_point: "CHEST", increment_mm: 40, tolerance_pct_bp: 1250, tolerance_abs_mm: 3 }] }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { spec_1_id: $.data.id }
            - call: "POST /fit-program/measurement-specs/${spec_1_id}/submit"
              payload: {}
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { spec_1_status: $.data.status }
          trigger:
            - call: "POST /fit-program/measurement-specs"
              payload: { item_id: "${item_id}", size_system: "US_NUMERIC", base_size_label: "2", fabric_stretch_class: "STRETCH", size_points: [{ size_label: "2", sort_index: 0, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }, { size_label: "4", sort_index: 1, chest_mm: 880, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }], grade_rules: [{ measurement_point: "CHEST", increment_mm: 40, tolerance_pct_bp: 1250, tolerance_abs_mm: 3 }] }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${spec_1_status} == \"SUBMITTED\""
            - "${err_id} == \"ERR_SPEC_REVISION_IN_FLIGHT\""
            - "http_status == 409"
            - "count(MeasurementSpec where item_id == ${item_id}) == 1"
            - "MeasurementSpec.${spec_1_id}.size_system == \"US_ALPHA\""

      - name: mapping_pair_naming_a_label_outside_the_spec_returns_size_label_not_in_spec
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_SIZE_LABEL_NOT_IN_SPEC]
          - calculations.mapping_coverage
          - concurrency_rules.mapping-create-stale-item
        distinguishing_aspect: |
          Priority 21 runs before the coverage floor at priority 28, so a pair naming
          spec_size_label "XXL" - a label the VERIFIED specification does not contain - fails 422
          ERR_SIZE_LABEL_NOT_IN_SPEC even though the item, chart and expected_item_version are all
          valid, and no SizeChartMapping row is written and fit_readiness stays UNVERIFIED.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item carrying a VERIFIED 2-point specification (S, M) and a STANDARDIZED 2-row TOPS chart (S, M)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/measurement-specs"
              payload: { item_id: "${item_id}", size_system: "US_ALPHA", base_size_label: "S", fabric_stretch_class: "RIGID", size_points: [{ size_label: "S", sort_index: 0, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }, { size_label: "M", sort_index: 1, chest_mm: 880, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }], grade_rules: [{ measurement_point: "CHEST", increment_mm: 40, tolerance_pct_bp: 1250, tolerance_abs_mm: 3 }] }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /fit-program/measurement-specs/${spec_id}/submit"
              payload: {}
              as: VendorUser
              as_user_id: "${vendor_id}"
            - call: "POST /fit-program/measurement-specs/${spec_id}/verify"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
