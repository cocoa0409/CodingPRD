      - name: fuzzy_duplicate_closed_window_boundary
        grounds:
          - calculations.duplicate_detection
          - entities.CarrierInvoice.fields.duplicate_flag
        distinguishing_aspect: |
          Interval semantics: closed sliding window |invoice_date diff| <= 7 days
          (BOTH ends inclusive) combined with an amount ratio <= 50bp — a different
          resource (CarrierInvoice) and different geometry (symmetric closed window)
          than the half-open contract window. Diff of exactly 7 days flags FUZZY;
          8 days (or amount off by >50bp) does not.
        test_recipe:
          setup:
            - "Standard USD chain; reference invoice INV-0001 (billed 87500, invoice_date 2026-08-03) captured"
            - "INV-0010 billed 87500 dated 2026-08-10 (diff exactly 7 days, equal amount)"
            - "INV-0011 billed 90000 dated 2026-08-11 (diff 8 days; amount ratio 277bp > 50bp)"
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", payment_terms_days: 14, remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_number: "INV-0001", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 87500, lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 75000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 7500 }, { charge_code: "LIFTGATE", billed_amount_minor: 5000 } ] }
              as: AuditAnalyst
              captures: { inv1: $.data.id }
            - { call: "POST /fap/invoices/${inv1}/capture", payload: {}, as: AuditAnalyst }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_number: "INV-0010", invoice_date: "2026-08-10", currency: "USD", billed_total_minor: 87500, lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 75000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 7500 }, { charge_code: "LIFTGATE", billed_amount_minor: 5000 } ] }
              as: AuditAnalyst
              captures: { inv10: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", invoice_number: "INV-0011", invoice_date: "2026-08-11", currency: "USD", billed_total_minor: 90000, lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 77000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 8000 }, { charge_code: "LIFTGATE", billed_amount_minor: 5000 } ] }
              as: AuditAnalyst
              captures: { inv11: $.data.id }
          trigger:
            - call: "POST /fap/invoices/${inv10}/capture"
              payload: {}
              as: AuditAnalyst
              captures: { f10: $.data.duplicate_flag }
            - call: "POST /fap/invoices/${inv11}/capture"
              payload: {}
              as: AuditAnalyst
              captures: { f11: $.data.duplicate_flag }
          assert:
            - "INV-0010 duplicate_flag == FUZZY (date diff exactly 7 days is inside the closed window, amount ratio 0bp <= 50bp)"
            - "INV-0011 duplicate_flag == NONE (date diff 8 days outside, and ratio 277bp > 50bp)"

  - rule_id: compensating_invariant
    instances:
      - name: run_lock_unlock_money_conservation
        grounds:
          - state_machines.PaymentRun.LOCKED_to_DRAFT
          - calculations.run_discount_tier
          - entities.CarrierInvoice.fields.scheduled_minor
        distinguishing_aspect: |
          Conserved quantity: monetary allocation. For every invoice,
          paid_minor + scheduled_minor + (approved_amount_minor - paid_minor - scheduled_minor)
          is invariantly equal to approved_amount_minor; lock computes discounts and
          unlock (the compensating action) deletes items and returns run totals and
          every invoice's payment_status/scheduled_minor to their pre-lock values with
          zero drift.
        test_recipe:
          setup:
            - "Standard USD chain; invoice INV-0001 CLEARED (approved 87500, UNPAID)"
            - "Run created, item added, then LOCKED and UNLOCKED"
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
              payload: { name: "Acme", home_country: "US", home_currency: "USD" }
              as: FapAdmin
              captures: { cl: $.data.id }
            - { call: "POST /fap/clients/${cl}/activate", payload: {}, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/carriers"
              payload: { scac_code: "CARR", legal_name: "Carrier One", country: "US", billing_currency: "USD", payment_terms_days: 14, remit_email: "r@c.example" }
              as: FapAdmin
              captures: { ca: $.data.id }
            - { call: "POST /fap/carriers/${ca}/approve_onboard", payload: {}, as: FapAdmin }
            - call: "POST /fap/carriers/${ca}/rate-contracts"
              payload:
                name: "C1"
                currency: "USD"
                lanes:
                  - { origin_country: "US", dest_country: "CA", mode: "LTL", weight_breaks: [ { min_kg: 0, rate_per_kg_minor: 150 } ], fuel_surcharge_pct_bp: 1000, accessorials: [ { code: "LIFTGATE", flat_minor: 5000, cap_pct_bp: 2000 } ], minimum_charge_minor: 20000 }
                effective_from: "2026-08-01"
                effective_to: "2026-12-31"
              as: FapAdmin
              captures: { rc: $.data.id, rc_v: $.data.version }
            - { call: "POST /fap/rate-contracts/${rc}/activate", payload: { expected_rate_contract_version: "${rc_v}" }, as: FapAdmin }
            - call: "POST /fap/clients/${cl}/shipments"
              payload: { carrier_id: "${ca}", pro_number: "PRO-1001", ship_date: "2026-08-02", origin_country: "US", dest_country: "CA", mode: "LTL", actual_weight_kg: 500, accessorials_rendered: ["LIFTGATE"] }
              as: AuditAnalyst
              captures: { sh: $.data.id }
            - call: "POST /fap/clients/${cl}/invoices"
              payload: { carrier_id: "${ca}", shipment_id: "${sh}", invoice_number: "INV-0001", invoice_date: "2026-08-03", currency: "USD", billed_total_minor: 87500, lines: [ { charge_code: "BASE_FREIGHT", billed_amount_minor: 75000 }, { charge_code: "FUEL_SURCHARGE", billed_amount_minor: 7500 }, { charge_code: "LIFTGATE", billed_amount_minor: 5000 } ] }
              as: AuditAnalyst
              captures: { inv: $.data.id }
            - { call: "POST /fap/invoices/${inv}/capture", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/rate", payload: {}, as: AuditAnalyst }
            - { call: "POST /fap/invoices/${inv}/finalize_audit", payload: {}, as: AuditAnalyst }
            - call: "POST /fap/clients/${cl}/payment-runs"
              payload: { run_date: "2026-08-10", currency: "USD" }
              as: FinanceController
              captures: { run: $.data.id, run_v: $.data.version }
            - call: "POST /fap/payment-runs/${run}/items"
              payload: { expected_payment_run_version: "${run_v}", invoice_id: "${inv}" }
              as: FinanceController
              captures: { item: $.data.id }
            - { call: "POST /fap/payment-runs/${run}/lock", payload: {}, as: FinanceController }
          trigger:
            - call: "POST /fap/payment-runs/${run}/unlock"
              payload: {}
              as: FinanceController
              captures: { run_st: $.data.status, run_gross: $.data.gross_total_minor, run_tot: $.data.total_minor }
            - call: "GET /fap/invoices/${inv}"
              payload: {}
              as: FinanceController
              captures: { inv_pay: $.data.payment_status, inv_sched: $.data.scheduled_minor, inv_appr: $.data.approved_amount_minor }
            - call: "GET /fap/payment-runs/${run}/items"
              payload: {}
              as: FinanceController
              captures: { n_items: $.data }
          assert:
            - "PaymentRun.${run}: status DRAFT, gross_total_minor == 0, total_minor == 0 after compensation"
            - "CarrierInvoice.${inv}: payment_status == UNPAID, scheduled_minor == 0, approved_amount_minor == 87500 unchanged"
            - "Invariant holds: paid_minor (0) + scheduled_minor (0) + open (87500) == approved_amount_minor (87500), identical before lock and after unlock"
            - "Item set empty after unlock (items deleted)"

      - name: allocation_replace_percentage_conservation
        grounds:
          - calculations.cost_allocation_split
          - entities.CostAllocation.fields.allocated_minor
        distinguishing_aspect: |
          Conserved quantity: the per-line split — sum(percentage_bp) == 10000 and
          sum(allocated_minor) == line amount — must survive a replace of the
          allocation set. First set [5000/5000] allocates 37500/37500; replacing with
          [3333/3333/3334] yields 24998/24998/25004 (remainder -1 lands on the largest
          share), still summing to exactly 75000 with zero drift. Different conserved
          quantity (percentage split) than the payment-money invariant.
        test_recipe:
          setup:
            - "Standard USD chain; invoice INV-0001 CLEARED with BASE_FREIGHT line rated 75000"
            - "GL accounts 4000 (BU-NORTH), 4100 (BU-SOUTH), 4200 (BU-WEST)"
          setup_api_calls:
            - { call: "POST /fap/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FapAdmin }
            - call: "POST /fap/clients"
