  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: account_suspend_depth5_scan_entitlement_release
        grounds:
          - state_machines.Account.ACTIVE_to_SUSPENDED
          - state_machines.MonitoredProfile.ACTIVE_to_PAUSED
          - state_machines.ScanRun.QUEUED_to_CANCELLED
          - entities.EntitlementLedgerEntry.fields.reason_code
          - entities.Account.fields.scan_units_remaining
        distinguishing_aspect: |
          Depth-5 chain triggered by Account ACTIVE -> SUSPENDED, where each link is caused by the
          previous one: suspending the account pauses the profile, pausing the profile cancels its
          QUEUED scan, cancelling the scan appends a SCAN RELEASE ledger row, and that ledger row
          raises Account.scan_units_remaining. Nothing in the chain is a direct fan-out from the
          original suspend call.
        test_recipe:
          setup:
            - "FAMILY plan (scan_quota_per_cycle 12), ACTIVE account, primary member ACTIVE."
            - "One ACTIVE MonitoredProfile with one identifier; one ScanRun still in QUEUED holding one SCAN unit."
            - "One ACTIVE VPN add-on (seats_total 2) with one BOUND DeviceSeat, so the fan-out branch is observable too."
            - "Clock at the startup default 2026-05-01T00:00:00Z throughout."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { plan_family_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_family_id}", primary_member_email: "owner@example.com", primary_member_full_name: "Dana Owner" }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_id: $.data.id, owner_id: $.data.primary_member_id }
            - call: "POST /monitored-profiles"
              payload: { member_id: "${owner_id}", full_name: "Dana Owner", date_of_birth: "1984-03-02", primary_address: "12 Elm St, Springfield", rescan_cadence_days: 30, two_factor_attested: false }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { prof_id: $.data.id, prof_v1: $.data.version }
            - call: "POST /monitored-profiles/${prof_id}/identifiers"
              payload: { identifier_type: "EMAIL", identifier_value: "dana@example.com", expected_profile_version: "${prof_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /monitored-profiles/${prof_id}/activate"
              payload: {}
              as: AccountOwner
              as_user_id: "${owner_id}"
            - call: "POST /accounts/${acct_id}/addons"
              payload: { addon_type: "VPN", seats_total: 2, per_seat_fee_cents: 300 }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { addon_id: $.data.id, addon_v1: $.data.version }
            - call: "POST /device-seats"
              payload: { addon_id: "${addon_id}", member_id: "${owner_id}", device_label: "Dana Laptop", expected_addon_version: "${addon_v1}" }
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { seat_id: $.data.id }
            - call: "POST /scan-runs"
              payload: { profile_id: "${prof_id}", kind: "INITIAL" }
              as: PrivacyAgent
              as_user_id: "agent-alpha"
              captures: { scan_id: $.data.id }
            - call: "GET /accounts/${acct_id}"
              as: AccountOwner
              as_user_id: "${owner_id}"
              captures: { pre_scan_remaining: $.data.scan_units_remaining }
          trigger:
            - call: "POST /accounts/${acct_id}/suspend"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { acct_status: $.data.status, post_scan_remaining: $.data.scan_units_remaining }
          assert:
            - "Before the trigger: Account.${acct_id}.scan_units_granted == 12, scan_units_consumed == 1, scan_units_released == 0, scan_units_remaining == 11"
            - "HOP 1: Account.${acct_id}.status == SUSPENDED and suspended_at == 2026-05-01T00:00:00.000Z"
            - "HOP 2: MonitoredProfile.${prof_id}.status == PAUSED"
            - "HOP 3: ScanRun.${scan_id}.status == CANCELLED and entitlement_units_held == 0"
            - "HOP 4: GET /entitlement-ledger?account_id=${acct_id}&resource_type=SCAN&entry_type=RELEASE returns total_count == 1 with amount == 1 and reason_code == SCAN_CANCELLED"
            - "HOP 5: Account.${acct_id}.scan_units_released == 1 and scan_units_remaining == 12"
            - "BRANCH: AddOnSubscription.${addon_id}.status == SUSPENDED and seats_bound == 0 and seats_available == 2"
            - "BRANCH: DeviceSeat.${seat_id}.status == VOIDED, bind_count == 1 (binding history preserved) and released_at is null"
            - "MonitoredProfile.${prof_id} still holds its PROFILE unit: Account.${acct_id}.profile_units_consumed == 1 and profile_units_released == 0"

      - name: authorization_revoke_depth4_void_and_refund
        grounds:
          - state_machines.Member.GRANTED_to_REVOKED
          - state_machines.RemovalRequest.DRAFTED_to_VOIDED
          - calculations.removal_entitlement_draw
          - entities.Member.fields.removal_units_consumed_this_cycle
          - entities.Account.fields.removal_units_remaining
        distinguishing_aspect: |
          Depth-4 chain from a completely different trigger (Member GRANTED -> REVOKED, not an
          Account transition): the revocation voids only the DRAFTED request, the void releases that
          request's REMOVAL unit into the ledger, and the ledger row moves both
          Account.removal_units_remaining and Member.removal_units_consumed_this_cycle. The
          ACKNOWLEDGED request on the sibling exposure is provably untouched.
        test_recipe:
