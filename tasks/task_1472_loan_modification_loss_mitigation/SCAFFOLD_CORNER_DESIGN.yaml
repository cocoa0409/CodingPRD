  # =====================================================================
  # Section: calculations
  # =====================================================================
  - section: calculations
    instances:
      - name: verified_income_input_set_filtering_and_multi_source_sum
        claim_type: input_set_filtering
        grounds: ["calculations.verified_gross_monthly_income"]
        distinguishing_aspect: "Only ACCEPTED income-bearing documents count: a REJECTED tax return, a BANK_STATEMENT, and the HARDSHIP_AFFIDAVIT contribute 0; paystub 433333 + P&L 40000 = 473333."
        test_recipe:
          setup:
            - "Application ACKNOWLEDGED with: accepted biweekly paystub 200000 (433333), accepted PROFIT_LOSS 240000/6 (40000), REJECTED tax return 99999900, accepted bank statement and affidavit"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Sara S", email: "sara@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CALC1", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_id: $.data.id, loan_v: $.data.version } }
            - { call: "POST /loans/${loan_id}/applications", payload: { expected_loan_version: "${loan_v}", hardship_type: "INCOME_REDUCTION", stated_monthly_income_cents: 470000 }, as: Borrower, as_user_id: "${b_id}", captures: { app_id: $.data.id } }
            - { call: "POST /applications/${app_id}/acknowledge", as: LossMitAgent }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 200000, pay_frequency: "BIWEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_pay: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "PROFIT_LOSS", ytd_net_income_cents: 240000, ytd_months: 6 }, as: Borrower, as_user_id: "${b_id}", captures: { d_pl: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "TAX_RETURN", annual_gross_cents: 99999900 }, as: Borrower, as_user_id: "${b_id}", captures: { d_tax: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "BANK_STATEMENT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_bank: $.data.id } }
            - { call: "POST /applications/${app_id}/documents", payload: { doc_type: "HARDSHIP_AFFIDAVIT" }, as: Borrower, as_user_id: "${b_id}", captures: { d_aff: $.data.id } }
            - { call: "POST /documents/${d_pay}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_pl}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_tax}/reject", payload: { rejection_reason: "illegible" }, as: LossMitAgent }
            - { call: "POST /documents/${d_bank}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_aff}/accept", as: LossMitAgent }
          trigger:
            - { call: "GET /applications/${app_id}", as: LossMitAgent, captures: { v_income: $.data.verified_monthly_income_cents, v_status: $.data.status } }
          assert:
            - "verified_monthly_income_cents == 473333 (433333 paystub + 40000 P&L; rejected tax return and non-income docs excluded)"
            - "v_status == COMPLETE_PACKAGE (INCOME_PROOF satisfied by paystub and P&L despite the rejected tax return)"

      - name: income_frequency_multiplier_constants
        claim_type: constants_applied
        grounds: ["calculations.verified_gross_monthly_income"]
        distinguishing_aspect: "The FREQ constants are applied exactly: SEMIMONTHLY 100000 -> 200000 (x2); WEEKLY 100000 -> 433333 (x 52/12 with half-up rounding of the repeating cent)."
        test_recipe:
          setup: ["two loans, each with an application holding one accepted paystub of 100000 at the given frequency"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Tim T", email: "tim@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CALC2A", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_a: $.data.id, loan_a_v: $.data.version } }
            - { call: "POST /loans", payload: { borrower_id: "${b_id}", loan_number: "LN-CALC2B", property_state_code: "CA", unpaid_principal_balance_cents: 20000000, interest_rate_bp: 600, remaining_term_months: 240, delinquency_days: 150 }, as: ServicingAdmin, captures: { loan_b: $.data.id, loan_b_v: $.data.version } }
            - { call: "POST /loans/${loan_a}/applications", payload: { expected_loan_version: "${loan_a_v}", hardship_type: "OTHER", stated_monthly_income_cents: 1 }, as: Borrower, as_user_id: "${b_id}", captures: { app_a: $.data.id } }
            - { call: "POST /loans/${loan_b}/applications", payload: { expected_loan_version: "${loan_b_v}", hardship_type: "OTHER", stated_monthly_income_cents: 1 }, as: Borrower, as_user_id: "${b_id}", captures: { app_b: $.data.id } }
            - { call: "POST /applications/${app_a}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 100000, pay_frequency: "SEMIMONTHLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_a: $.data.id } }
            - { call: "POST /applications/${app_b}/documents", payload: { doc_type: "PAYSTUB", gross_per_period_cents: 100000, pay_frequency: "WEEKLY", pay_period_end_date: "2026-07-31" }, as: Borrower, as_user_id: "${b_id}", captures: { d_b: $.data.id } }
            - { call: "POST /documents/${d_a}/accept", as: LossMitAgent }
            - { call: "POST /documents/${d_b}/accept", as: LossMitAgent }
          trigger:
            - { call: "GET /applications/${app_a}", as: LossMitAgent, captures: { inc_a: $.data.verified_monthly_income_cents } }
            - { call: "GET /applications/${app_b}", as: LossMitAgent, captures: { inc_b: $.data.verified_monthly_income_cents } }
          assert:
            - "SEMIMONTHLY: inc_a == 200000"
            - "WEEKLY: inc_b == 433333 (100000 * 52/12 = 433333.33 -> half-up 433333)"

      - name: waterfall_stops_at_first_success_in_rank_order
        claim_type: correct_result
        grounds: ["calculations.waterfall_modified_payment"]
        distinguishing_aspect: "With two eligible programs, the waterfall evaluates in waterfall_rank ASC and STOPS at the first success: STD_MOD (rank 1) is selected and FLEX_MOD (rank 2) never gets a step row, even though FLEX would also qualify (its pi 120246 <= its target 120833)."
        test_recipe:
          setup:
            - "Fixture A application COMPLETE_PACKAGE; programs STD_MOD rank 1 and FLEX_MOD rank 2 both ACTIVE, delinquency 150 within both bands"
          setup_api_calls:
            - { call: "POST /borrowers", payload: { full_name: "Ursula U", email: "ursula@x.com" }, as: ServicingAdmin, captures: { b_id: $.data.id } }
