  # ===========================================================================
  # Section: consistency_model (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, entities.Protocol.fields.settled_fee_cents]
        distinguishing_aspect: "Same-request and immediate-read consistency: the create response carries server-minted fields, and a GET issued right after determination reflects the settled fee and bumped version with no lag."
        test_recipe:
          setup: ["Investigator; protocol P submitted with consent document"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr IC", email: "ic@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "IC Study", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { p: $.data.id, v_create: $.data.version }
            - call: "POST /irb/protocols/${p}/consent-documents"
              payload: { file_ref: "s3://consent/ic.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
          trigger:
            - call: "POST /irb/protocols/${p}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
              captures: { v_after: $.data.version }
            - call: "GET /irb/protocols/${p}"
              as: IrbCoordinator
          assert:
            - "Create response carried version == 1 and server-minted id/created_at"
            - "Determination response already shows settled_fee_cents == 150000 and determined_review_level == EXPEDITED"
            - "Immediate GET agrees: settled_fee_cents == 150000, version == ${v_after} > ${v_create}"
