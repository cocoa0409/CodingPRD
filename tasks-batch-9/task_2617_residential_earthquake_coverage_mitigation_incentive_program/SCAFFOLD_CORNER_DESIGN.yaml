        distinguishing_aspect: "The three stages must be applied in the declared order: the scope cap truncates the estimate first, the income-tier match percentage is rounded half-up second, and MAX_GRANT_CENTS clamps last - and a structure whose SCOPE_COST_CAP is 0 is refused outright rather than awarded 0."
