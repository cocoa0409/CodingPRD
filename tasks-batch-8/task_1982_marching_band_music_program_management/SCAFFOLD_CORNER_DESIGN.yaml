            - { call: "POST /band/students/${s_b}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "FC", grade: 11, section: "BRASS" }, as: BandDirector, captures: { s_c: $.data.id } }
            - { call: "POST /band/students/${s_c}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/fundraisers", payload: { program_id: "${prog}", name: "Car Wash", goal_cents: 50000 }, as: BoosterTreasurer, captures: { fr: $.data.id } }
          trigger:
            - { call: "POST /band/fundraisers/${fr}/close", payload: { raised_cents: 10001, participant_hours: [ { student_id: "${s_a}", hours: 1 }, { student_id: "${s_b}", hours: 1 }, { student_id: "${s_c}", hours: 1 } ] }, as: BoosterTreasurer }
            - { call: "GET /band/students/${s_a}", payload: {}, as: Any }
            - { call: "GET /band/students/${s_b}", payload: {}, as: Any }
            - { call: "GET /band/students/${s_c}", payload: {}, as: Any }
          assert:
            - "Student.${s_a}.account_balance_cents == -3334 (equal fractions tie broken by created_at ASC)"
            - "Student.${s_b}.account_balance_cents == -3334"
            - "Student.${s_c}.account_balance_cents == -3333"
            - "Fundraiser.${fr}.allocated_credit_cents == 10001 == raised_cents (lossless)"
      - name: music_budget_input_set_excludes_quoted
        claim_type: input_set_filtering
        grounds: [calculations.music_budget_check]
        distinguishing_aspect: "QUOTED and REJECTED arrangements do not count against music_spent_cents; only purchase moves the needle."
        test_recipe:
          setup: ["program music budget 40000; arrangement A cost 35000 QUOTED"]
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "MB", music_budget_cents: 40000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/arrangements", payload: { program_id: "${prog}", title: "A", arranger: "X", license_type: "STANDARD", cost_cents: 35000, rights_end: "2026-12-01T00:00:00Z" }, as: BandDirector, as_user_id: "dir-1", captures: { arr_a: $.data.id } }
