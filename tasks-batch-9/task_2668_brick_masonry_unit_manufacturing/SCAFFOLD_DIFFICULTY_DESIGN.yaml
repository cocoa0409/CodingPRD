            - "${err_low} == ERR_PALLET_COUNT_INSUFFICIENT with HTTP 422 - the fiscal rule was masked, not absent"
            - "${o1_fulfillment} == PACKAGED and ${o1_freight} == FINALIZED once 20 pallets and 40 bands are supplied"
            - "${fin} == 58619 - final freight recomputed from 20*60 + 40*3.0 + 9600*4.5 == 44520 lb == 22.26 tons, base 56095, 4.5 percent surcharge 2524"
