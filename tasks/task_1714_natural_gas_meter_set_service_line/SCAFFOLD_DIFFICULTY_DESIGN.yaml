      - name: crew_capacity_exact_fit_then_overflow
        grounds:
          - state_machines.CrewBooking.REQUESTED_to_CONFIRMED
          - errors[ERR_CREW_CAPACITY_EXCEEDED]
          - entities.FieldCrew.fields.daily_capacity_minutes
        distinguishing_aspect: |
          Aggregate-capacity boundary on a DIFFERENT metric (minutes vs a 480-minute crew-day):
          a 480-minute booking confirms (== capacity is allowed), and any further booking that
          day — even 30 minutes with buffer satisfied — is rejected. Endpoint: crew-bookings
          confirm, distinct from the purge-leak-test endpoint of the sibling instance.
        test_recipe:
          setup:
            - "clock 2026-08-01; DRAFT application; crew daily_capacity_minutes=480; booking A 2026-08-10 09:00–17:00 (540–1020, exactly 480 min) CONFIRMED; booking B 17:30–18:00 (1050–1080, 30 min) REQUESTED — buffer satisfied (1050 >= 1020+30)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: SystemAdmin }
