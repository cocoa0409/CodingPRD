# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth coverage of SCAFFOLD.yaml 1.1-1.7 claims not already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Logical clock defaults to 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: site_creation_defaults_and_envelope
        claim_type: defaults
        grounds:
          - "entities.ClientSite.fields.retention_years"
          - "response_envelope"
        distinguishing_aspect: "Omitting retention_years applies default 30; the success envelope carries meta.api_request_id, response_type == object, and data."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
          assert:
            - "ClientSite.${site}.retention_years == 30 (default applied)"
            - "ClientSite.${site}.version == 1 and id is a bare UUID without type prefix"
            - "response envelope has meta.api_request_id, meta.api_request_timestamp, response_type == 'object'"

      - name: site_create_unknown_field_rejected
        claim_type: computed_fields
        grounds:
          - "validations[priority=3]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Strict schema: a client-supplied computed/unknown field (headcount on a site) is rejected, not silently ignored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /ih/sites", payload: { name: "X", industry_code: "332812", headcount: 5 }, as: FirmAdmin, captures: { err: $.data.error_id } }
          assert:
            - "http 400 with error_id ERR_INVALID_REQUEST (unknown field rejected)"

      - name: employee_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - "entities.Employee.fields.full_name"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /ih/employees without full_name fails schema validation before any existence check."
        test_recipe:
          setup: ["one site"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
          trigger:
            - { call: "POST /ih/employees", payload: { site_id: "${site}", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { err: $.data.error_id } }
          assert:
            - "http 400 ERR_INVALID_REQUEST (full_name missing)"

      - name: limit_unique_key_duplicate_rejected
        claim_type: type_constraints
        grounds:
          - "entities.ExposureLimit.fields.uniqueness"
          - "errors[ERR_DUPLICATE_LIMIT]"
        distinguishing_aspect: "Second limit with the same (analyte_code, basis, limit_type) triple is a 409; the same analyte under a different basis or limit_type is accepted."
        test_recipe:
          setup: ["one PB/OSHA_PEL/TWA8 limit exists"]
          setup_api_calls:
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
          trigger:
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "ACGIH_TLV", limit_type: "TWA8", limit_mg_m3: 0.025 }, as: FirmAdmin, captures: { lim2: $.data.id } }
          assert:
            - "duplicate triple: http 409 ERR_DUPLICATE_LIMIT"
            - "different basis: 201 created (${lim2}) — uniqueness is per (analyte_code, basis, limit_type)"

      - name: pump_serial_unique_per_site
        claim_type: type_constraints
        grounds:
          - "entities.Pump.fields.serial_number"
          - "errors[ERR_DUPLICATE_PUMP_SERIAL]"
        distinguishing_aspect: "Pump serial uniqueness is scoped per site: duplicate within the site is 409, same serial at another site is 201."
        test_recipe:
          setup: ["two sites; pump P-001 at site 1"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Site 1", industry_code: "332812" }, as: FirmAdmin, captures: { site1: $.data.id } }
            - { call: "POST /ih/sites", payload: { name: "Site 2", industry_code: "332812" }, as: FirmAdmin, captures: { site2: $.data.id } }
            - { call: "POST /ih/pumps", payload: { site_id: "${site1}", serial_number: "P-001" }, as: FirmAdmin, captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /ih/pumps", payload: { site_id: "${site1}", serial_number: "P-001" }, as: FirmAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /ih/pumps", payload: { site_id: "${site2}", serial_number: "P-001" }, as: FirmAdmin, captures: { p2: $.data.id } }
          assert:
            - "same site duplicate: http 409 ERR_DUPLICATE_PUMP_SERIAL"
            - "other site same serial: 201 (${p2})"

      - name: membership_duplicate_rejected
        claim_type: type_constraints
        grounds:
          - "entities.SEGMembership.fields.uniqueness"
          - "errors[ERR_DUPLICATE_MEMBERSHIP]"
        distinguishing_aspect: "A second membership for the same (seg_id, employee_id) pair is 409; headcount stays 1."
        test_recipe:
          setup: ["site, limit, SEG, employee, one existing membership"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
          trigger:
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { err: $.data.error_id } }
          assert:
            - "http 409 ERR_DUPLICATE_MEMBERSHIP"
            - "SimilarExposureGroup.${seg}.headcount == 1 (failed insert did not inflate the counter)"

      - name: seg_analyte_must_match_limit
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ANALYTE_MISMATCH]"
          - "entities.SimilarExposureGroup.fields.analyte_code"
        distinguishing_aspect: "SEG whose analyte_code differs from its ExposureLimit's analyte_code is rejected 422 at creation (referential coherence at write time)."
        test_recipe:
          setup: ["site and a PB limit"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
          trigger:
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Welders", analyte_code: "CR", exposure_limit_id: "${lim}", task_description: "welding" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { err: $.data.error_id } }
          assert:
            - "http 422 ERR_ANALYTE_MISMATCH"

      - name: blank_personal_conditional_fields
        claim_type: required_fields
        grounds:
          - "validations[priority=3]"
          - "entities.FieldSample.fields.sample_type"
        distinguishing_aspect: "Conditional requiredness: PERSONAL without pump_id is 400; FIELD_BLANK carrying pump_id is also 400 (forbidden field)."
        test_recipe:
          setup: ["SEG H=1 with APPROVED plan; pump P1 with calibration C1"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { plan: $.data.id } }
            - { call: "POST /ih/sampling-plans/${plan}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans/${plan}/approve", payload: {}, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-001" }, as: FirmAdmin, captures: { p1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pre_calibration_id: "${c1}", collection_date: "2026-08-03", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { err1: $.data.error_id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "FIELD_BLANK", pump_id: "${p1}", collection_date: "2026-08-03", start_minute: 0, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { err2: $.data.error_id } }
          assert:
            - "PERSONAL missing pump_id: http 400 ERR_INVALID_REQUEST"
            - "FIELD_BLANK with forbidden pump_id: http 400 ERR_INVALID_REQUEST"

      - name: not_found_and_error_envelope
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "response_envelope"
        distinguishing_aspect: "GET on a nonexistent UUID returns 404 ERR_NOT_FOUND in the standard error envelope (response_type == error, data.error_id)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /ih/segs/22222222-2222-2222-2222-222222222222", payload: {}, as: IndustrialHygienist, captures: { err: $.data.error_id } }
          assert:
            - "http 404, data.error_id == ERR_NOT_FOUND, response_type == 'error'"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: plan_submit_after_approve_rejected
        claim_type: invalid_transition
        grounds:
          - "state_machines.SamplingPlan"
          - "errors[ERR_PLAN_INVALID_STATE]"
        distinguishing_aspect: "submit is defined only from DRAFT; an APPROVED plan resubmitted returns 409 and stays APPROVED."
        test_recipe:
          setup: ["SEG H=1; plan APPROVED"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { plan: $.data.id } }
            - { call: "POST /ih/sampling-plans/${plan}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans/${plan}/approve", payload: {}, as: CIHDirector, as_user_id: u_cih_1 }
          trigger:
            - { call: "POST /ih/sampling-plans/${plan}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { err: $.data.error_id } }
          assert:
            - "http 409 ERR_PLAN_INVALID_STATE; SamplingPlan.${plan}.status remains APPROVED"

      - name: plan_approve_sod_same_user_rejected
        claim_type: precondition_enforcement
        grounds:
          - "state_machines.SamplingPlan.PENDING_APPROVAL_to_APPROVED"
          - "errors[ERR_SOD_PLAN_APPROVER]"
        distinguishing_aspect: "Segregation of duties: the approver's X-User-ID equals the creator's — forbidden even though the approver holds the CIHDirector role."
        test_recipe:
          setup: ["SEG H=1; plan PENDING_APPROVAL created by u_ih_1"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { plan: $.data.id } }
            - { call: "POST /ih/sampling-plans/${plan}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
          trigger:
            - { call: "POST /ih/sampling-plans/${plan}/approve", payload: {}, as: CIHDirector, as_user_id: u_ih_1, captures: { err: $.data.error_id } }
          assert:
            - "http 403 ERR_SOD_PLAN_APPROVER (role is valid; the same-person constraint fires)"
            - "SamplingPlan.${plan}.status remains PENDING_APPROVAL and approved_by_user_id is null"

      - name: sample_seal_twice_rejected
        claim_type: idempotency
        grounds:
          - "state_machines.FieldSample.COLLECTED_to_SEALED"
          - "errors[ERR_SAMPLE_INVALID_STATE]"
        distinguishing_aspect: "Sealing an already-SEALED sample is a 409, not a silent no-op — the transition consumes its from-state."
        test_recipe:
          setup: ["SEG H=1; APPROVED plan; one COLLECTED sample"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { plan: $.data.id } }
            - { call: "POST /ih/sampling-plans/${plan}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans/${plan}/approve", payload: {}, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-001" }, as: FirmAdmin, captures: { p1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c1: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${c1}", collection_date: "2026-08-03", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { s1: $.data.id } }
            - { call: "POST /ih/field-samples/${s1}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1 }
          trigger:
            - { call: "POST /ih/field-samples/${s1}/seal", payload: {}, as: FieldTechnician, as_user_id: u_tech_1, captures: { err: $.data.error_id } }
          assert:
            - "http 409 ERR_SAMPLE_INVALID_STATE; FieldSample.${s1}.status remains SEALED and version increments only once"

      - name: sample_invalidate_terminal_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.FieldSample"
          - "errors[ERR_SAMPLE_INVALID_STATE]"
        distinguishing_aspect: "Manual invalidate from INVALIDATED (terminal) is rejected; only the system may invalidate ANALYZED samples (blank contamination)."
        test_recipe:
          setup: ["SEG H=1; APPROVED plan; one sample already INVALIDATED manually"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/exposure-limits", payload: { analyte_code: "PB", basis: "OSHA_PEL", limit_type: "TWA8", limit_mg_m3: 0.05 }, as: FirmAdmin, captures: { lim: $.data.id } }
            - { call: "POST /ih/segs", payload: { site_id: "${site}", name: "Painters", analyte_code: "PB", exposure_limit_id: "${lim}", task_description: "spray line" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { seg: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/seg-memberships", payload: { seg_id: "${seg}", employee_id: "${e1}" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans", payload: { seg_id: "${seg}", purpose: "INITIAL", planned_start_date: "2026-08-03", planned_end_date: "2026-08-14" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { plan: $.data.id } }
            - { call: "POST /ih/sampling-plans/${plan}/submit", payload: {}, as: IndustrialHygienist, as_user_id: u_ih_1 }
            - { call: "POST /ih/sampling-plans/${plan}/approve", payload: {}, as: CIHDirector, as_user_id: u_cih_1 }
            - { call: "POST /ih/pumps", payload: { site_id: "${site}", serial_number: "P-001" }, as: FirmAdmin, captures: { p1: $.data.id } }
            - { call: "POST /ih/pump-calibrations", payload: { pump_id: "${p1}", pre_flow_lpm: 2.0 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { c1: $.data.id } }
            - { call: "POST /ih/field-samples", payload: { sampling_plan_id: "${plan}", sample_type: "PERSONAL", employee_id: "${e1}", pump_id: "${p1}", pre_calibration_id: "${c1}", collection_date: "2026-08-03", start_minute: 480, duration_minutes: 240 }, as: FieldTechnician, as_user_id: u_tech_1, captures: { s1: $.data.id } }
            - { call: "POST /ih/field-samples/${s1}/invalidate", payload: { reason: "dropped" }, as: IndustrialHygienist, as_user_id: u_ih_1 }
          trigger:
            - { call: "POST /ih/field-samples/${s1}/invalidate", payload: { reason: "again" }, as: IndustrialHygienist, as_user_id: u_ih_1, captures: { err: $.data.error_id } }
          assert:
            - "http 409 ERR_SAMPLE_INVALID_STATE; FieldSample.${s1} stays INVALIDATED with reason MANUAL"

      - name: clearance_decide_twice_rejected
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.MedicalClearance"
          - "errors[ERR_CLEARANCE_INVALID_STATE]"
        distinguishing_aspect: "decide is valid only from REQUESTED; a second decide on a DENIED clearance is 409."
        test_recipe:
          setup: ["employee with a REQUESTED clearance, decided DENIED"]
          setup_api_calls:
            - { call: "POST /ih/sites", payload: { name: "Apex Coating", industry_code: "332812" }, as: FirmAdmin, captures: { site: $.data.id } }
            - { call: "POST /ih/employees", payload: { site_id: "${site}", full_name: "E One", external_ref: "E1", job_title: "Painter" }, as: FirmAdmin, captures: { e1: $.data.id } }
            - { call: "POST /ih/medical-clearances", payload: { employee_id: "${e1}" }, as: SiteSafetyManager, as_user_id: u_ssm_1, captures: { clr: $.data.id } }
            - { call: "POST /ih/medical-clearances/${clr}/decide", payload: { decision: "DENIED" }, as: CIHDirector, as_user_id: u_cih_1 }
          trigger:
            - { call: "POST /ih/medical-clearances/${clr}/decide", payload: { decision: "CLEARED" }, as: CIHDirector, as_user_id: u_cih_1, captures: { err: $.data.error_id } }
          assert:
            - "http 409 ERR_CLEARANCE_INVALID_STATE; MedicalClearance.${clr}.status remains DENIED"

      - name: fit_test_terminal_lockdown
        claim_type: terminal_lockdown
        grounds:
          - "state_machines.RespiratorFitTest"
          - "errors[ERR_FIT_TEST_NOT_RECORDABLE]"
        excluded_because:
          difficulty_instance: fit_result_state_beats_clearance_safety
          rationale: "That §1.8 instance records a result on a FAILED (terminal) fit test and asserts ERR_FIT_TEST_NOT_RECORDABLE."

      - name: plan_auto_lab_complete
        claim_type: side_effect_execution
        grounds:
