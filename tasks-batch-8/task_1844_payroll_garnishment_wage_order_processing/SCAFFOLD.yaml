    path: "/orders/{orderId}/terminate"
    description: "Terminate an order (mid-order termination, satisfaction close, employee separation)"
    roles: [payroll_manager]
    code: 200
    input: [termination_reason]
    output: GarnishmentOrder
    side_effects: ["→TERMINATED; remit_posture=CLOSED", "AuditLogEntry (order.terminate)"]

  - method: POST
    path: "/orders/{orderId}/refund"
    description: "Error correction: refund over-withheld amount to employee (append-only REFUND event)"
    roles: [payroll_manager]
    code: 200
    input: [refund_amount_cents, reason, payroll_run_id]
    output: WithholdingEvent
    side_effects:
      - "Append REFUND WithholdingEvent (amount_cents negative) tagged to payroll_run_id"
      - "GarnishmentOrder.refunded_cents += amount; remaining_balance_cents recomputed"
      - "Remittance sweep: if the refunded WITHHOLD event was already in a PENDING remittance, the remittance amount_due_cents is recomputed; if it reaches 0 the remittance auto-cancels"
      - "If order was SATISFIED and refund makes remaining_balance_cents > 0: order does NOT reopen (SATISFIED is terminal); refund only restores the conserved balance ledger"
      - "AuditLogEntry (order.refund)"

  - method: GET
    path: "/orders/{orderId}/events"
    description: "List withholding events for an order (append-only log, chronological)"
    roles: [employer_payroll_admin, payroll_specialist, payroll_manager, compliance_auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "WithholdingEvent[]"
    side_effects: []

  # --- PayrollRun / PayStatement ---
  - method: POST
    path: "/payroll-runs"
    description: "Create payroll run"
    roles: [payroll_specialist]
    code: 201
    input: [employer_id, period_start, period_end, pay_date, expected_employer_version]
    output: PayrollRun
    side_effects: ["status=OPEN", "AuditLogEntry (run.create)"]

  - method: GET
    path: "/payroll-runs/{runId}"
    description: "Get payroll run"
    roles: [employer_payroll_admin, payroll_specialist, payroll_manager, compliance_auditor]
    code: 200
    input: []
    output: PayrollRun
    side_effects: []

  - method: GET
    path: "/employers/{employerId}/payroll-runs"
    description: "List payroll runs for employer"
    roles: [employer_payroll_admin, payroll_specialist, payroll_manager, compliance_auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "PayrollRun[]"
    side_effects: []

  - method: POST
    path: "/payroll-runs/{runId}/statements"
    description: "Add pay statement to an OPEN run"
    roles: [payroll_specialist]
    code: 201
    input: [employee_id, gross_earnings_cents, mandatory_deductions_cents, "hours_worked?"]
    output: PayStatement
    side_effects: ["disposable_earnings_cents computed", "AuditLogEntry (statement.create)"]

  - method: GET
    path: "/payroll-runs/{runId}/statements"
    description: "List statements of a run"
    roles: [employer_payroll_admin, payroll_specialist, payroll_manager, compliance_auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "PayStatement[]"
    side_effects: []

  - method: GET
    path: "/statements/{statementId}"
    description: "Get a pay statement (with computation_breakdown)"
    roles: [employer_payroll_admin, payroll_specialist, payroll_manager, compliance_auditor]
    code: 200
    input: []
    output: PayStatement
    side_effects: []

  - method: POST
    path: "/payroll-runs/{runId}/pay"
    description: "Pay the run: run the withholding waterfall, post events, finalize statements"
    roles: [payroll_specialist]
    code: 200
    input: [expected_employer_version]
    output: PayrollRun
    side_effects: ["withholding_waterfall per statement", "OPEN→PAID", "Employer.version += 1", "order SATISFIED auto-transitions", "AuditLogEntry (run.pay)"]

  - method: POST
    path: "/payroll-runs/{runId}/void"
    description: "Void an OPEN run with no posted events"
    roles: [payroll_specialist]
    code: 200
    input: []
    output: PayrollRun
    side_effects: ["OPEN→VOIDED", "Employer.version += 1", "AuditLogEntry (run.void)"]

  - method: GET
    path: "/payroll-runs/{runId}/events"
    description: "List withholding events posted by a run"
    roles: [employer_payroll_admin, payroll_specialist, payroll_manager, compliance_auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "WithholdingEvent[]"
    side_effects: []

  # --- Remittance ---
  - method: POST
    path: "/remittances"
    description: "Create remittance: sweep unassigned WITHHOLD events (from ACTIVE/ANSWER_FILED orders) for (authority, run)"
    roles: [payroll_specialist]
    code: 201
    input: [employer_id, authority_id, payroll_run_id]
    output: Remittance
    side_effects:
      - "amount_due_cents = sum of swept unassigned WITHHOLD events"
      - "member_event_ids recorded; due_date computed from run.pay_date + employer.remittance_timing at creation"
      - "AuditLogEntry (remittance.create)"

  - method: GET
    path: "/remittances/{remittanceId}"
    description: "Get remittance"
    roles: [employer_payroll_admin, payroll_specialist, payroll_manager, compliance_auditor]
    code: 200
    input: []
    output: Remittance
    side_effects: []

  - method: GET
    path: "/employers/{employerId}/remittances"
    description: "List remittances for employer (filterable)"
    roles: [employer_payroll_admin, payroll_specialist, payroll_manager, compliance_auditor]
    code: 200
    input: ["authority_id?", "payroll_run_id?", "status?", "limit?", "offset?"]
    output: "Remittance[]"
    side_effects: []

  - method: POST
    path: "/remittances/{remittanceId}/confirm"
    description: "Confirm payment sent to agency; LATE if past due_date. Segregation of duties: confirmer's X-User-ID must differ from the X-User-ID that paid the run."
    roles: [payroll_manager]
    code: 200
    input: []
    output: Remittance
    side_effects: ["PENDING→CONFIRMED | LATE_CONFIRMED", "AuditLogEntry (remittance.confirm)"]

  - method: POST
    path: "/remittances/{remittanceId}/cancel"
    description: "Cancel a PENDING remittance whose member events have all been refunded"
    roles: [payroll_manager]
    code: 200
    input: []
    output: Remittance
    side_effects: ["PENDING→CANCELLED", "AuditLogEntry (remittance.cancel)"]

  # --- Audit ---
  - method: GET
    path: "/employers/{employerId}/audit-log"
    description: "List audit log entries (append-only, hash-chained; supports verify=true to recompute chain)"
    roles: [employer_payroll_admin, payroll_manager, compliance_auditor]
    code: 200
    input: ["entity_type?", "entity_id?", "verify?", "limit?", "offset?"]
    output: "AuditLogEntry[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/malformed X-User-ID or X-User-Role" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted; includes segregation-of-duties violation on remittance confirm by the same user who paid the run" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist within the employer scope" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload, missing required field, bad enum, bad date" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not legal from current state (incl. terminal lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current parent version (OCC)" }
  - { id: ERR_CASE_NUMBER_PATTERN, http: 422, condition: "case_number fails issuing authority's accepted_case_number_pattern" }
  - { id: ERR_STATE_RULE_MISSING, http: 422, condition: "No StateRule row for employee.work_state_code" }
  - { id: ERR_AUTHORITY_MISMATCH, http: 422, condition: "authority_type incompatible with order_type" }
  - { id: ERR_DUPLICATE_ACTIVE_ORDER, http: 409, condition: "Same employee, same (order_type, case_number), other order non-terminal" }
  - { id: ERR_EMPLOYEE_TERMINATED_INELIGIBLE, http: 409, condition: "Employee has termination_date set; blocks order intake, activation, statement creation" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "Run period overlaps or abuts-violates existing non-voided run window, or period_end < period_start, or TX statement missing hours_worked" }
  - { id: ERR_INVALID_DEDUCTIONS, http: 422, condition: "mandatory_deductions_cents >= gross_earnings_cents or negative amounts" }
  - { id: ERR_RUN_EMPTY, http: 422, condition: "Pay requested on a run with zero statements" }
  - { id: ERR_RUN_HAS_POSTED_EVENTS, http: 409, condition: "Void requested on a run that already posted WITHHOLD events (only possible after pay, which is terminal — guard is on PAID)" }
  - { id: ERR_REFUND_EXCEEDS_WITHHELD, http: 422, condition: "refund_amount_cents > net withheld (withheld_cents - refunded_cents), or refund on order with zero withheld" }
  - { id: ERR_SUSPEND_LIMIT_EXCEEDED, http: 409, condition: "Order already suspended MAX_SUSPENSIONS (3) times" }
  - { id: ERR_REMITTANCE_EMPTY, http: 409, condition: "Confirm on a remittance whose effective amount is 0 (all members refunded)" }
  - { id: ERR_NO_REMITTABLE_EVENTS, http: 409, condition: "create-remittance finds no unassigned WITHHOLD events for (authority, run) from ACTIVE/ANSWER_FILED orders" }
  - { id: ERR_DUPLICATE_REMITTANCE, http: 409, condition: "A remittance already exists for (authority_id, payroll_run_id)" }
  - { id: ERR_AUDIT_CHAIN_BROKEN, http: 409, condition: "GET /audit-log?verify=true recomputation mismatch" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: employer_payroll_admin
    description: "Employer-level administrator: configures employer, state rules, authorities; owns the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /employers"
      - "PATCH /employers/{id}"
      - "POST /state-rules"
      - "POST /authorities"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /employees (shared with payroll_specialist)"
      - "All GET endpoints"

  - name: payroll_specialist
    description: "Payroll operations specialist: runs intake, notification, activation, payroll runs, remittance creation"
    identity: "opaque"
    exclusive_operations:
      - "POST /employees/{id}/orders"
      - "POST /orders/{id}/validate, /reject, /notify, /activate"
      - "POST /payroll-runs, /statements, /pay, /void"
      - "POST /remittances (create)"
    shared_operations:
      - "POST /employees (shared with employer_payroll_admin)"
      - "All GET endpoints"

  - name: payroll_manager
    description: "Payroll manager: court answers, suspensions, terminations, refunds, remittance confirmation/cancel — separated from run-pay duties"
    identity: "opaque"
    exclusive_operations:
      - "POST /orders/{id}/suspend, /resume, /answer, /terminate, /refund"
      - "POST /employees/{id}/terminate"
      - "POST /remittances/{id}/confirm, /cancel"
    shared_operations:
      - "All GET endpoints"

  - name: compliance_auditor
    description: "Read-only compliance/audit role; verifies the hash-chained audit log"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints (including GET /audit-log with verify=true)"
