  - rule_id: non_linear_state_machine
    instances:
      - name: build_zone_parallel_campaign_and_construction_dimensions
        grounds:
          - state_machines.BuildZone.campaign_status
          - state_machines.BuildZone.construction_status
          - entities.BuildZone.fields.suspension_reason
          - endpoints["POST /build-zones/{id}/extend-deadline"]
          - endpoints["POST /build-zones/{id}/suspension"]
        distinguishing_aspect: |
          BuildZone carries two independent state dimensions on one row: campaign_status walks
          PREREG_OPEN -> PREREG_EXTENDED -> QUALIFIED while construction_status separately walks
          NOT_STARTED -> SEQUENCED -> IN_CONSTRUCTION -> SUSPENDED -> IN_CONSTRUCTION, and the
          SUSPENDED detour never rewinds campaign_status out of QUALIFIED, so the machine is not
          a single ordered chain.
        test_recipe:
          setup:
            - "Campaign with max_deadline_extensions 2 and extension_grant_days 30, preregistration closing 2026-09-30T23:59:00Z."
            - "One zone with household_count 10, threshold_pct 10.00 and required_permit_types [ROW]."
            - "One SERVICEABLE address with one PENDING preorder, so the provisional rate is 10.00."
            - "ROW permit APPROVED and one pole request ATTACHED after a 12000-cent quote, so the zone can actually start construction."
            - "One extend-deadline granted while the window is still open, pushing prereg_deadline_at to 2026-10-30T23:59:00Z, then the clock moved to 2026-11-01T00:00:00Z and qualification-run executed."
