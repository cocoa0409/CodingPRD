              as: Anonymous
              captures: { learner_id: $.data.id }
            - call: "POST /courses"
              payload: { instructor_id: "${inst_id}", title: "Bound", list_price_cents: 0, passing_score_pct: 0.70, completion_threshold_pct: 1.00 }
              as: Instructor
              as_user_id: "${inst_id}"
