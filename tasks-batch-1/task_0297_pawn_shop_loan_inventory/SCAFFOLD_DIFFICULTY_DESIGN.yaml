scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: resale_list_vs_floor_diverge_on_inventory_item
        grounds:
          - calculations.resale_pricing
          - entities.InventoryItem.fields.list_price_cents
          - entities.InventoryItem.fields.floor_price_cents
          - state_machines.Loan.IN_GRACE_to_FORFEITED
        distinguishing_aspect: |
          On the InventoryItem domain, list_price (forward markup on appraised_value) and floor_price
          (cost-recovery = cost_basis) are computed from identical forfeiture inputs yet differ:
          list_price_cents == 54000 while floor_price_cents == 25200.
        test_recipe:
          setup:
            - "FL schedule (interest 1000bps, storage 500c, setup 200c, term 30d, grace 30d, ltv 5000bps, max_periods 4)."
            - "Clock at 2026-01-01; item appraised at 40000c; loan originated (principal 20000c)."
            - "Clock advanced to 2026-03-02 (60 days, == grace_end_at); loan forfeited."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Dana Borrower", gov_id_number: "ID-D1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Gold ring" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id }
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: ShopManager
          trigger:
            - call: "POST /pawn/loans/${loan_id}/forfeit"
              payload: {}
              as: ShopManager
            - call: "GET /pawn/inventory?source_loan_id=${loan_id}"
              payload: {}
              as: ShopManager
              captures: { inv_id: "$.data[0].id", list_p: "$.data[0].list_price_cents", floor_p: "$.data[0].floor_price_cents" }
          assert:
            - "InventoryItem.${inv_id}.list_price_cents == 54000"
            - "InventoryItem.${inv_id}.floor_price_cents == 25200"
            - "InventoryItem.${inv_id}.list_price_cents != InventoryItem.${inv_id}.floor_price_cents"

      - name: extension_fee_vs_full_payoff_diverge_on_loan
        grounds:
          - calculations.redemption_payoff
          - calculations.redemption_payoff.variants.extension_fee
          - state_machines.Loan.ACTIVE_to_ACTIVE
          - entities.FinanceTransaction.fields.amount_cents
        distinguishing_aspect: |
          On the Loan domain, the base redemption_payoff (20000+200+1*2500 == 22700 at day 30) and its
          extension_fee variant (one period only == 2500) compute from the same loan with different formulas;
          the EXTENSION_FEE transaction amount (2500) is strictly less than the full payoff (22700).
        test_recipe:
          setup:
            - "FL schedule as above; loan originated at 2026-01-01 with principal 20000c."
            - "Clock advanced to 2026-01-31 (day 30); loan still ACTIVE/IN_GRACE."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Eve Borrower", gov_id_number: "ID-E1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Watch" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id, loan_v: $.data.version }
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00.000Z" }
              as: ShopManager
            - call: "GET /pawn/loans/${loan_id}/payoff"
              payload: {}
              as: LoanOfficer
              captures: { payoff_pre: $.data.payoff_cents }
          trigger:
            - call: "POST /pawn/loans/${loan_id}/extend"
              payload: { expected_loan_version: "${loan_v}" }
              as: LoanOfficer
              as_user_id: "officer-1"
            - call: "GET /pawn/loans/${loan_id}/transactions"
              payload: {}
              as: LoanOfficer
              captures: { ext_amount: "$.data[1].amount_cents", ext_kind: "$.data[1].kind" }
          assert:
            - "the GET payoff before extension (payoff_pre) == 22700"
            - "the EXTENSION_FEE FinanceTransaction.amount_cents == 2500"
            - "2500 != 22700 (extension fee diverges from full payoff on the same loan)"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: payoff_round_per_period_then_multiply_mode_b
        grounds:
          - calculations.redemption_payoff
          - entities.Loan.fields.principal_cents
          - entities.StateRateSchedule.fields.monthly_storage_fee_cents
        distinguishing_aspect: |
          MODE (b) nested-rounding-order: payoff rounds interest PER PERIOD then multiplies by period count
          (round(20000*0.10)=2000 +500 =2500 per period; *2 periods => 5000) which the scaffold pins ahead of
          round(principal*rate*periods). With principal 20000 over 2 periods payoff == 25200.
        test_recipe:
          setup:
            - "FL schedule; loan principal 20000c originated 2026-01-01."
            - "Clock advanced to 2026-03-01 (day 59 -> ceil(59/30)=2 periods); loan IN_GRACE."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Finn Borrower", gov_id_number: "ID-F1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Ring" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id }
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: ShopManager
          trigger:
            - call: "GET /pawn/loans/${loan_id}/payoff"
              payload: {}
              as: LoanOfficer
              captures: { payoff: $.data.payoff_cents, periods: $.data.total_periods, pp: $.data.per_period_charge_cents }
          assert:
            - "per_period_charge_cents == 2500"
            - "total_periods == 2"
            - "payoff_cents == 25200"

      - name: layaway_schedule_floor_then_remainder_mode_b
        grounds:
          - calculations.layaway_schedule
          - entities.LayawayInstallment.fields.amount_cents
          - entities.LayawayInstallment.fields.sequence
        distinguishing_aspect: |
          MODE (b) nested-rounding-order on a DIFFERENT metric: deposit is round_half_up while each non-final
          installment is FLOOR(remaining/n) and the FINAL installment absorbs the remainder, pinning floor-then-remainder
          over even-split. For list 54100, n=3: deposit 10820, installments [14426, 14426, 14428].
        test_recipe:
          setup:
            - "An AVAILABLE forfeited InventoryItem with list_price_cents == 54100 (appraised 40075 -> 40075*1.35=54101.25 -> $541.00 -> 54100)."
            - "Layaway created with installment_count 3; deposit 10820 collected."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Gina Buyer", gov_id_number: "ID-G1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Necklace" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40075 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id }
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/loans/${loan_id}/forfeit"
              payload: {}
              as: ShopManager
            - call: "GET /pawn/inventory?source_loan_id=${loan_id}"
              payload: {}
              as: ShopManager
              captures: { inv_id: "$.data[0].id" }
          trigger:
            - call: "POST /pawn/layaway-plans"
              payload: { inventory_item_id: "${inv_id}", customer_id: "${cust_id}", installment_count: 3, reserved_until_at: "2026-06-01T00:00:00.000Z" }
              as: ShopManager
              captures: { plan_id: $.data.id, deposit: $.data.deposit_cents, total: $.data.total_price_cents }
            - call: "GET /pawn/layaway-plans/${plan_id}/installments"
              payload: {}
              as: ShopManager
              captures: { i1: "$.data[0].amount_cents", i3: "$.data[2].amount_cents" }
          assert:
            - "LayawayPlan.${plan_id}.total_price_cents == 54100"
            - "LayawayPlan.${plan_id}.deposit_cents == 10820"
            - "installment[sequence=1].amount_cents == 14426"
            - "installment[sequence=3].amount_cents == 14428"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: loan_extension_self_loop_cycle
        grounds:
          - state_machines.Loan.ACTIVE_to_ACTIVE
          - entities.Loan.fields.periods_charged
          - entities.Loan.fields.term_end_at
        distinguishing_aspect: |
          CYCLE on the Loan entity: ACTIVE -> ACTIVE self-loop via extend; two consecutive extensions keep status
          ACTIVE while periods_charged climbs 0 -> 1 -> 2, proving a non-linear self-loop (not a forward A->B->C pipeline).
        test_recipe:
          setup:
            - "FL schedule; loan principal 20000 originated 2026-01-01, version 1."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Hank Borrower", gov_id_number: "ID-H1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Bracelet" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id, v1: $.data.version }
            - call: "POST /pawn/loans/${loan_id}/extend"
              payload: { expected_loan_version: "${v1}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /pawn/loans/${loan_id}/extend"
              payload: { expected_loan_version: "${v2}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { st: $.data.status, pc: $.data.periods_charged }
          assert:
            - "Loan.${loan_id}.status == ACTIVE"
            - "Loan.${loan_id}.periods_charged == 2"

      - name: layaway_installment_self_loop_then_complete
        grounds:
          - state_machines.LayawayPlan.ACTIVE_to_ACTIVE
          - state_machines.LayawayPlan.ACTIVE_to_COMPLETED
          - entities.LayawayPlan.fields.paid_cents
        distinguishing_aspect: |
          CYCLE on the DIFFERENT LayawayPlan entity: ACTIVE -> ACTIVE installment self-loop, then ACTIVE -> COMPLETED
          on the final installment. With list 54000, n=4: paid climbs 10800 -> 21600 -> 32400 -> 43200 -> 54000 and the
          plan stays ACTIVE through the loop, completing only on the 4th installment.
        test_recipe:
          setup:
            - "An AVAILABLE InventoryItem list_price 54000; layaway n=4 created (deposit 10800, installments 4x10800)."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: false }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Iris Buyer", gov_id_number: "ID-I1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Coin set" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id }
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/loans/${loan_id}/forfeit"
              payload: {}
              as: ShopManager
            - call: "GET /pawn/inventory?source_loan_id=${loan_id}"
              payload: {}
              as: ShopManager
              captures: { inv_id: "$.data[0].id" }
            - call: "POST /pawn/layaway-plans"
              payload: { inventory_item_id: "${inv_id}", customer_id: "${cust_id}", installment_count: 4, reserved_until_at: "2026-09-01T00:00:00.000Z" }
              as: ShopManager
              captures: { plan_id: $.data.id }
            - call: "POST /pawn/layaway-plans/${plan_id}/installments"
              payload: { amount_cents: 10800 }
              as: ShopManager
              captures: { s1: $.data.status }
            - call: "POST /pawn/layaway-plans/${plan_id}/installments"
              payload: { amount_cents: 10800 }
              as: ShopManager
              captures: { s2: $.data.status }
            - call: "POST /pawn/layaway-plans/${plan_id}/installments"
              payload: { amount_cents: 10800 }
              as: ShopManager
              captures: { s3: $.data.status }
          trigger:
            - call: "POST /pawn/layaway-plans/${plan_id}/installments"
              payload: { amount_cents: 10800 }
              as: ShopManager
              captures: { s4: $.data.status, paid: $.data.paid_cents }
          assert:
            - "after installments 1-3 the plan status was ACTIVE each time (self-loop)"
            - "LayawayPlan.${plan_id}.status == COMPLETED"
            - "LayawayPlan.${plan_id}.paid_cents == 54000"

  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: police_execute_cascade_depth3
        grounds:
          - state_machines.PoliceHold.ACTIVE_to_EXECUTED
          - state_machines.Loan.ACTIVE_to_VOIDED
          - entities.FinanceTransaction.fields.amount_cents
          - entities.CashDrawer.fields.balance_cents
        distinguishing_aspect: |
          DEPTH-3 cascade from the police-execute trigger: execute mutates the PoliceHold (EXECUTED) -> that mutation
          forces the source Loan to VOIDED -> the Loan void itself appends a VOID_REVERSAL FinanceTransaction (+20000)
          -> which itself bumps the CashDrawer balance back to 0. Each hop is caused by the prior hop.
        test_recipe:
          setup:
            - "FL shop police_reporting_enabled true; loan principal 20000 active; drawer at -20000 after disbursement."
            - "LawEnforcement places an ACTIVE PoliceHold on the collateral (loan -> POLICE_HELD)."
          setup_api_calls:
            - call: "POST /pawn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ShopManager
            - call: "POST /pawn/state-schedules"
              payload: { state_code: "FL", monthly_interest_bps: 1000, monthly_storage_fee_cents: 500, setup_fee_cents: 200, term_days: 30, grace_days: 30, max_principal_cents: 5000000, max_periods_total: 4, loan_to_value_bps: 5000, layaway_buffer_days: 7 }
              as: ShopManager
            - call: "POST /pawn/shops"
              payload: { name: "FL Branch", state_code: "FL", police_reporting_enabled: true }
              as: ShopManager
              captures: { shop_id: $.data.id }
            - call: "POST /pawn/storage-bins"
              payload: { shop_id: "${shop_id}", label: "A-1", capacity: 5 }
              as: ShopManager
              captures: { bin_id: $.data.id }
            - call: "POST /pawn/customers"
              payload: { full_name: "Jack Suspect", gov_id_number: "ID-J1" }
              as: LoanOfficer
              captures: { cust_id: $.data.id }
            - call: "POST /pawn/items"
              payload: { shop_id: "${shop_id}", customer_id: "${cust_id}", description: "Stolen camera", serial_number: "SN-9" }
              as: LoanOfficer
              captures: { item_id: $.data.id }
            - call: "POST /pawn/items/${item_id}/appraise"
              payload: { appraised_value_cents: 40000 }
              as: Appraiser
              as_user_id: "appraiser-1"
            - call: "POST /pawn/loans"
              payload: { shop_id: "${shop_id}", pawn_item_id: "${item_id}", storage_bin_id: "${bin_id}" }
              as: LoanOfficer
              as_user_id: "officer-1"
              captures: { loan_id: $.data.id }
            - call: "POST /pawn/police-holds"
