# =============================================================================
# §1.9 Scaffold Corner Design — task 2367
# Breadth coverage of every testable claim in §1.1–§1.7 that §1.8 does not
# already probe. Sections and claim_type values come only from
# references/claim-extraction-guide.md.
# Every numeric literal in `assert:` was produced by executing the matching
# §1.3 formula as code.
# The non-existent-id literal used throughout is
# 00000000-0000-4000-8000-000000000000 (a well-formed UUID that is never minted).
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: patient_creation_returns_envelope_with_computed_is_minor
        claim_type: Creation
        grounds:
          - entities.Patient
          - entities.Patient.fields.is_minor
          - endpoints[POST /behavioral-health/patients]
          - response_envelope.success
        distinguishing_aspect: "A single POST /behavioral-health/patients with all four required fields returns 201 with the §1.0 success envelope, echoes every input field, and derives is_minor from age_years without any client hint."
        test_recipe:
          setup:
            - "Empty database; the logical clock is left at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-CR1", legal_name: "Create Adult", age_years: 18, gender_care_category: "NONBINARY" }
              as: ComplianceOfficer
              captures: { p_cr1: $.data.id }
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-CR2", legal_name: "Create Minor", age_years: 17, gender_care_category: "FEMALE" }
              as: ComplianceOfficer
              captures: { p_cr2: $.data.id }
          assert:
            - "both calls return HTTP 201 with response_type == \"object\" and meta.api_request_id and meta.api_request_timestamp present"
            - "Patient.${p_cr1}.mrn == \"MRN-2367-CR1\", legal_name == \"Create Adult\", age_years == 18, gender_care_category == \"NONBINARY\""
            - "Patient.${p_cr1}.is_minor == false (18 is not below the minor boundary) and Patient.${p_cr2}.is_minor == true (17 is)"
            - "both patients report active_hold_count == 0 and version == 1"

      - name: unit_retrieval_returns_derived_posture_closed_with_no_beds
        claim_type: Retrieval
        grounds:
          - entities.Unit
          - entities.Unit.fields.posture
          - endpoints[GET /behavioral-health/units/{id}]
        distinguishing_aspect: "GET /behavioral-health/units/{id} returns the stored input fields plus every derived counter; a unit with zero beds reads posture CLOSED and all four counters 0, which is the documented zero-bed starting state."
        test_recipe:
          setup:
            - "One unit created with no beds; clock at its startup default."
          setup_api_calls:
            - call: "POST /behavioral-health/units"
              payload: { name: "Ward 11 Shell", gender_mixing_policy: "SEPARATE_BY_WING", seclusion_room_count: 2 }
              as: ComplianceOfficer
              captures: { u_r: $.data.id }
          trigger:
            - call: "GET /behavioral-health/units/${u_r}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP 200 with response_type == \"object\""
            - "Unit.${u_r}.name == \"Ward 11 Shell\", gender_mixing_policy == \"SEPARATE_BY_WING\", seclusion_room_count == 2"
            - "Unit.${u_r}.licensed_placement_bed_count == 0, raw_available_bed_count == 0, occupied_bed_count == 0, effective_available_bed_count == 0"
            - "Unit.${u_r}.posture == \"CLOSED\" and active_seclusion_count == 0 and open_rights_violation_count == 0 and version == 1"

      - name: bed_listing_under_unit_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /behavioral-health/units/{id}/beds]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The Bed sub-resource list honours limit/offset and reports total_count over the whole filtered set, with has_more true only while unreturned rows remain; the bed_type filter narrows total_count itself."
        test_recipe:
          setup:
            - "One unit with three beds: two STANDARD (421-A, 422-A) and one SECLUSION (423-S)."
          setup_api_calls:
            - call: "POST /behavioral-health/units"
              payload: { name: "Ward 12 Paging", gender_mixing_policy: "MIXED_ALLOWED", seclusion_room_count: 1 }
              as: ComplianceOfficer
              captures: { u_pg: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u_pg}", room_number: "421", wing_code: "A", bed_label: "A", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { b_pg1: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u_pg}", room_number: "422", wing_code: "A", bed_label: "A", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { b_pg2: $.data.id }
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u_pg}", room_number: "423", wing_code: "B", bed_label: "S", bed_type: "SECLUSION" }
              as: ComplianceOfficer
              captures: { b_pg3: $.data.id }
          trigger:
            - call: "GET /behavioral-health/units/${u_pg}/beds?limit=2&offset=0"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
            - call: "GET /behavioral-health/units/${u_pg}/beds?limit=2&offset=2"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
            - call: "GET /behavioral-health/units/${u_pg}/beds?bed_type=SECLUSION"
              payload: { bed_type: "SECLUSION" }
              as: ComplianceOfficer
          assert:
            - "the first page returns HTTP 200 with response_type == \"array\", 2 rows, limit == 2, offset == 0, total_count == 3, has_more == true"
            - "the second page returns 1 row with offset == 2, total_count == 3, has_more == false"
            - "the two pages together return exactly the three bed ids ${b_pg1}, ${b_pg2} and ${b_pg3} with no duplicates"
            - "the bed_type == \"SECLUSION\" filter returns 1 row whose id == ${b_pg3} and total_count == 1 and has_more == false"

      - name: unknown_ids_return_entity_specific_not_found_errors
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_PATIENT_NOT_FOUND]
          - errors[ERR_UNIT_NOT_FOUND]
          - errors[ERR_EVALUATION_NOT_FOUND]
          - errors[ERR_ADMISSION_NOT_FOUND]
          - errors[ERR_HOLD_NOT_FOUND]
        distinguishing_aspect: "Each of the five path-segment existence rules returns its own entity-specific 404 code rather than a shared generic one, so the five reads against the same never-minted UUID produce five distinct error_id values."
        test_recipe:
          setup:
            - "Empty database; no id has ever been minted, so 00000000-0000-4000-8000-000000000000 resolves to nothing in any collection."
          setup_api_calls: []
          trigger:
            - call: "GET /behavioral-health/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { nf_patient: $.data.error_id }
            - call: "GET /behavioral-health/units/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { nf_unit: $.data.error_id }
            - call: "GET /behavioral-health/evaluations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { nf_eval: $.data.error_id }
            - call: "GET /behavioral-health/admissions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { nf_adm: $.data.error_id }
            - call: "GET /behavioral-health/holds/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              captures: { nf_hold: $.data.error_id }
          assert:
            - "all five responses are HTTP 404 with response_type == \"error\" and a non-empty data.message"
            - "${nf_patient} == \"ERR_PATIENT_NOT_FOUND\" and ${nf_unit} == \"ERR_UNIT_NOT_FOUND\""
            - "${nf_eval} == \"ERR_EVALUATION_NOT_FOUND\" and ${nf_adm} == \"ERR_ADMISSION_NOT_FOUND\" and ${nf_hold} == \"ERR_HOLD_NOT_FOUND\""
            - "the five error_id values are pairwise distinct"

      - name: missing_required_body_fields_rejected_with_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /behavioral-health/patients]
          - endpoints[POST /behavioral-health/units]
        distinguishing_aspect: "Every field declared source: input without a default is required: omitting Patient.age_years or Unit.gender_mixing_policy is rejected 400 ERR_INVALID_REQUEST before any row is written, so the collections stay empty."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-RQ", legal_name: "Missing Age", gender_care_category: "MALE" }
              as: ComplianceOfficer
              captures: { rq_patient: $.data.error_id }
            - call: "POST /behavioral-health/units"
              payload: { name: "Ward 13 Incomplete", seclusion_room_count: 1 }
              as: ComplianceOfficer
              captures: { rq_unit: $.data.error_id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "No License" }
              as: ComplianceOfficer
              captures: { rq_clin: $.data.error_id }
          assert:
            - "all three responses are HTTP 400 with response_type == \"error\""
            - "${rq_patient} == \"ERR_INVALID_REQUEST\" and ${rq_unit} == \"ERR_INVALID_REQUEST\" and ${rq_clin} == \"ERR_INVALID_REQUEST\""
            - "GET /behavioral-health/units returns total_count == 0 and GET /behavioral-health/clinicians returns total_count == 0 (nothing was persisted)"

      - name: omitted_optional_search_fields_apply_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Admission.fields.search_items_secured_count
          - entities.Admission.fields.contraband_found
          - entities.Bed.fields.status
          - entities.Admission.fields.placement_status
          - entities.Admission.fields.discharge_plan_status
        distinguishing_aspect: "Fields carrying a declared default are populated with that default when omitted: a new Bed reads status AVAILABLE, a new Admission reads placement_status PENDING_PLACEMENT / safety_search_status PENDING / discharge_plan_status NOT_STARTED / observation_staff_quarter_hours 0 / rights_violation_flag false, and a safety search that omits search_items_secured_count and contraband_found records 0 and false."
        test_recipe:
          setup:
            - "One unit with a single STANDARD bed; clock set to 2026-09-03T08:00:00Z."
            - "One adult patient with an evaluation scoring 8 (MODERATE, recommended VOLUNTARY) signed at that instant."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Rosa Kim", staff_role: "CHARGE_NURSE", license_number: "LIC-RN-2367-1" }
              as: ComplianceOfficer
              captures: { c_rn: $.data.id }
            - call: "POST /behavioral-health/units"
              payload: { name: "Ward 14 Defaults", gender_mixing_policy: "MIXED_ALLOWED", seclusion_room_count: 0 }
              as: ComplianceOfficer
              captures: { u_df: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-DF", legal_name: "Default Fields", age_years: 29, gender_care_category: "MALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_df: $.data.id }
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_df}", danger_to_self: false, danger_to_others: true, grave_disability: true, capacity_present: true, clinical_summary: "Agitation, retains capacity." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_df: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_df}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
          trigger:
            - call: "POST /behavioral-health/beds"
              payload: { unit_id: "${u_df}", room_number: "431", wing_code: "A", bed_label: "A", bed_type: "STANDARD" }
              as: ComplianceOfficer
              captures: { b_df: $.data.id }
            - call: "POST /behavioral-health/admissions"
              payload: { patient_id: "${p_df}", evaluation_id: "${e_df}", unit_id: "${u_df}", requested_legal_status: "VOLUNTARY" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { a_df: $.data.id }
            - call: "POST /behavioral-health/admissions/${a_df}/safety-search"
              payload: { search_type: "VISUAL", search_witness_clinician_id: "${c_int}", search_items_secured_count: 0, contraband_found: false, outcome: "COMPLETED" }
              as: ChargeNurse
              as_user_id: "${c_rn}"
          assert:
            - "Bed.${b_df}.status == \"AVAILABLE\" (system default, never supplied in the body)"
            - "Admission.${a_df}.placement_status == \"PENDING_PLACEMENT\", safety_search_status was \"PENDING\" before the search, discharge_plan_status == \"NOT_STARTED\""
            - "Admission.${a_df}.observation_staff_quarter_hours == 0 and rights_violation_flag == false and bed_id == null and placed_at == null"
            - "after the search Admission.${a_df}.search_items_secured_count == 0 and contraband_found == false (both defaults applied on omission)"
            - "after the search Admission.${a_df}.safety_search_status == \"COMPLETED\" and search_performed_by_clinician_id == ${c_rn}"

      - name: computed_acuity_score_recomputed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.EmergencyEvaluation.fields.acuity_score
          - entities.EmergencyEvaluation.fields.prior_admission_count_30d
          - calculations.acuity_score_and_tier
        distinguishing_aspect: "acuity_score, acuity_tier, recommended_status and prior_admission_count_30d are source: computed and are not declared inputs: supplying them in the body cannot move them, and the stored values are exactly what acuity_score_and_tier yields from the four booleans."
        test_recipe:
          setup:
            - "One adult patient with no prior admissions; clock set to 2026-09-03T08:00:00Z."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-CF", legal_name: "Computed Fields", age_years: 51, gender_care_category: "FEMALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_cf: $.data.id }
          trigger:
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_cf}", danger_to_self: false, danger_to_others: true, grave_disability: true, capacity_present: false, clinical_summary: "Danger to others plus grave disability, capacity absent.", acuity_score: 1, acuity_tier: "LOW", recommended_status: "NO_ADMISSION", prior_admission_count_30d: 9 }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_cf: $.data.id }
          assert:
            - "EmergencyEvaluation.${e_cf}.acuity_score == 11 (5 for danger_to_others + 3 for grave_disability + 3 for absent capacity), not the supplied 1"
            - "EmergencyEvaluation.${e_cf}.acuity_tier == \"MODERATE\", not the supplied \"LOW\""
            - "EmergencyEvaluation.${e_cf}.recommended_status == \"INVOLUNTARY_HOLD\", not the supplied \"NO_ADMISSION\""
            - "EmergencyEvaluation.${e_cf}.prior_admission_count_30d == 0, not the supplied 9"
            - "the four declared input booleans are stored as sent: danger_to_self == false, danger_to_others == true, grave_disability == true, capacity_present == false"

      - name: system_fields_minted_server_side_input_ignored
        claim_type: System Fields
        grounds:
          - entities.HoldOrder.fields.initiated_by_clinician_id
          - entities.HoldOrder.fields.status
          - entities.EmergencyEvaluation.fields.evaluation_started_at
          - complexity_profile.role_model
        distinguishing_aspect: "id, created_at, updated_at, version and every source: system field are minted by the server: a hold initiation that tries to set status ACTIVE, certifying_clinician_id and initiated_by_clinician_id is stored as PENDING_CERTIFICATION with initiated_by_clinician_id taken from the X-User-ID header and certifying_clinician_id null."
        test_recipe:
          setup:
            - "Two clinicians exist: an intake clinician and a psychiatrist; clock set to 2026-09-03T08:00:00Z."
            - "One adult patient with an evaluation scoring 7 (MODERATE, recommended INVOLUNTARY_HOLD) signed at that instant."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Alma Reyes", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-1" }
              as: ComplianceOfficer
              captures: { c_psa: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-SF", legal_name: "System Fields", age_years: 26, gender_care_category: "MALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_sf: $.data.id }
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_sf}", danger_to_self: true, danger_to_others: false, grave_disability: false, capacity_present: false, clinical_summary: "Suicidal ideation, capacity absent." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_sf: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_sf}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
          trigger:
            - call: "POST /behavioral-health/holds"
              payload: { patient_id: "${p_sf}", evaluation_id: "${e_sf}", hold_type: "EMERGENCY_72H", id: "00000000-0000-4000-8000-000000000000", status: "ACTIVE", version: 47, initiated_by_clinician_id: "${c_psa}", certifying_clinician_id: "${c_psa}", certified_at: "2026-09-03T07:00:00Z" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { h_sf: $.data.id }
          assert:
            - "HoldOrder.${h_sf}.id != \"00000000-0000-4000-8000-000000000000\" and version == 1, not 47"
            - "HoldOrder.${h_sf}.status == \"PENDING_CERTIFICATION\", not the supplied \"ACTIVE\""
            - "HoldOrder.${h_sf}.initiated_by_clinician_id == ${c_int} (from the X-User-ID header), not the supplied ${c_psa}"
            - "HoldOrder.${h_sf}.certifying_clinician_id == null and certified_at == null"
            - "HoldOrder.${h_sf}.created_at is present in ISO 8601 UTC with three fractional digits, and Patient.${p_sf}.active_hold_count == 0 (an uncertified hold is not active)"
            - "EmergencyEvaluation.${e_sf}.evaluation_started_at == \"2026-09-03T08:00:00.000Z\" (logical clock, never wall clock)"

      - name: invalid_enum_and_out_of_range_values_rejected
        claim_type: Type Constraints
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.Patient.fields.age_years
          - entities.CourtHearing.fields.duration_minutes
          - entities.HoldOrder.fields.hold_type
        distinguishing_aspect: "Enum membership, integer ranges and the two literal-pin constraints are all schema-level: gender_care_category \"OTHER\", age_years 130, hold_type EXTENSION_14D on POST /holds and requested_hold_type EMERGENCY_72H on POST /petitions are each rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One intake clinician and one psychiatrist; clock set to 2026-09-03T08:00:00Z."
            - "One adult patient with a SIGNED evaluation scoring 7 (recommended INVOLUNTARY_HOLD) and an ACTIVE certified EMERGENCY_72H hold on it."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Bo Fenn", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-2" }
              as: ComplianceOfficer
              captures: { c_psb: $.data.id }
            - call: "POST /behavioral-health/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-TC", legal_name: "Type Constraint", age_years: 40, gender_care_category: "MALE" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { p_tc: $.data.id }
            - call: "POST /behavioral-health/evaluations"
              payload: { patient_id: "${p_tc}", danger_to_self: true, danger_to_others: false, grave_disability: false, capacity_present: false, clinical_summary: "Suicidal ideation, capacity absent." }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { e_tc: $.data.id }
            - call: "POST /behavioral-health/evaluations/${e_tc}/sign"
              payload: {}
              as: IntakeClinician
              as_user_id: "${c_int}"
            - call: "POST /behavioral-health/holds"
              payload: { patient_id: "${p_tc}", evaluation_id: "${e_tc}", hold_type: "EMERGENCY_72H" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { h_tc: $.data.id }
            - call: "POST /behavioral-health/holds/${h_tc}/certify"
              payload: { certification_note: "Independent certification." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psb}"
          trigger:
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-TC2", legal_name: "Bad Enum", age_years: 40, gender_care_category: "OTHER" }
              as: ComplianceOfficer
              captures: { tc_enum: $.data.error_id }
            - call: "POST /behavioral-health/patients"
              payload: { mrn: "MRN-2367-TC3", legal_name: "Bad Age", age_years: 130, gender_care_category: "MALE" }
              as: ComplianceOfficer
              captures: { tc_range: $.data.error_id }
            - call: "POST /behavioral-health/holds"
              payload: { patient_id: "${p_tc}", evaluation_id: "${e_tc}", hold_type: "EXTENSION_14D" }
              as: IntakeClinician
              as_user_id: "${c_int}"
              captures: { tc_holdtype: $.data.error_id }
            - call: "POST /behavioral-health/petitions"
              payload: { hold_id: "${h_tc}", requested_hold_type: "EMERGENCY_72H", petition_grounds: "Wrong requested class." }
              as: AttendingPsychiatrist
              as_user_id: "${c_psb}"
              captures: { tc_pettype: $.data.error_id }
          assert:
            - "all four responses are HTTP 400 with error_id == \"ERR_INVALID_REQUEST\": ${tc_enum}, ${tc_range}, ${tc_holdtype} and ${tc_pettype}"
            - "the enum rejection is decided at priority 3, before the existence checks: no Patient row named \"Bad Enum\" exists"
            - "GET /behavioral-health/holds?patient_id=${p_tc} returns total_count == 1 (only the legitimate EMERGENCY_72H hold)"
