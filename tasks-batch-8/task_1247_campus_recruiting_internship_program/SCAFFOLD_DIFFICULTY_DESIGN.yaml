            - call: "POST /campus-recruiting/seasons"
              payload: { name: "SB", application_open_at: "2026-05-10T00:00:00Z", application_close_at: "2026-05-20T00:00:00Z", interview_window_start_at: "2026-06-01T00:00:00Z", interview_window_end_at: "2026-06-30T23:59:59Z", offer_window_open_at: "2026-07-01T00:00:00Z", offer_window_close_at: "2026-07-31T23:59:59Z", shortlist_score_threshold: 10, stipend_budget_cents: 1000000, deadline_policy_mode: "BUSINESS_HOURS" }
              as: RecruitingAdmin
              captures: { sidB: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sidB}/school-targets"
