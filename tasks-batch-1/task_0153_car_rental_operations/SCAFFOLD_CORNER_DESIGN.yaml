# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index) — Car Rental Operations
# Breadth probe: enumerates testable claims the §1.1-§1.7 surface declares that
# §1.8 does not already cover. Same seven-point contract and §1.5 gates as §1.8.
# Negative-test triggers capture $.data.error_id so the linter relaxes role/
# payload checks (the test verifies rejection).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_location_returns_201_with_all_fields
        claim_type: Creation
        grounds:
          - "entities.Location"
          - "endpoints"
        distinguishing_aspect: "POST /locations with all required fields returns 201 and a Location whose code/name/fee fields echo the input and whose id/created_at/version are system-minted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /locations"
              payload: { code: "JFK", name: "New York JFK", one_way_drop_fee_cents: 7000, young_driver_surcharge_per_day_cents: 2000 }
              as: FleetManager
              captures: { loc: $.data.id, ver: $.data.version }
          assert:
            - "response http_status == 201"
            - "Location.${loc}.code == JFK"
            - "Location.${loc}.one_way_drop_fee_cents == 7000"
            - "Location.${loc}.version == 1"

      - name: create_vehicle_class_initializes_counts_to_zero
        claim_type: Computed Fields
        grounds:
          - "entities.VehicleClass.fields.total_count"
          - "entities.VehicleClass.fields.available_count"
        distinguishing_aspect: "A freshly created VehicleClass with no vehicles has total_count == 0 and available_count == 0 (computed, not input)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /vehicle-classes"
              payload: { code: "SUV", tier_rank: 3, daily_rate_cents: 8000, weekly_rate_cents: 49000, included_miles_per_day: 150, overage_per_mile_cents: 35, ldw_per_day_cents: 2000, pai_per_day_cents: 1000 }
              as: FleetManager
              captures: { cls: $.data.id }
          assert:
            - "VehicleClass.${cls}.total_count == 0"
            - "VehicleClass.${cls}.available_count == 0"

      - name: add_vehicle_bumps_class_counts_to_one
        claim_type: Computed Fields
        grounds:
          - "entities.Vehicle"
          - "calculations.class_availability_reconcile"
        distinguishing_aspect: "Adding one AVAILABLE vehicle to a class drives that class's total_count and available_count to 1 via reconcile."
        test_recipe:
          setup: ["One location and one ECON class with zero vehicles."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
          trigger:
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh: $.data.id }
            - call: "GET /vehicle-classes/${cls_econ}"
              payload: {}
              as: FleetManager
          assert:
            - "Vehicle.${veh}.status == AVAILABLE"
            - "VehicleClass.${cls_econ}.total_count == 1"
            - "VehicleClass.${cls_econ}.available_count == 1"

      - name: get_vehicle_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "entities.Vehicle"
        distinguishing_aspect: "GET /vehicles/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /vehicles/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FleetManager
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 404"
            - "response data.error_id == ERR_NOT_FOUND"

      - name: create_reservation_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.Reservation"
        distinguishing_aspect: "POST /reservations omitting required class_id returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A member and location exist; class_id deliberately omitted from the reservation body."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z" }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: create_reservation_dropoff_before_pickup_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - "errors[ERR_INVALID_REQUEST]"
          - "entities.Reservation.fields.dropoff_at"
        distinguishing_aspect: "dropoff_at not strictly after pickup_at is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A member, location and ECON class exist."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-04T10:00:00Z", dropoff_at: "2026-07-01T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 400"
            - "response data.error_id == ERR_INVALID_REQUEST"

      - name: reservation_rental_days_min_one_for_sub_day
        claim_type: Computed Fields
        grounds:
          - "entities.Reservation.fields.rental_days"
        distinguishing_aspect: "A 6-hour window yields rental_days == 1 (ceil with a 1-day floor)."
        test_recipe:
          setup: ["A member, location and ECON class exist; reservation spans 6 hours."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-01T16:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res: $.data.id }
          assert:
            - "Reservation.${res}.rental_days == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_reservation_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - "state_machines.Reservation.QUOTED_to_CONFIRMED"
          - "errors[ERR_INVALID_STATE]"
          - "validations[priority=5]"
        distinguishing_aspect: "Confirming a reservation already in CONFIRMED is rejected with ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A CONFIRMED reservation with one available ECON vehicle."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
          trigger:
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_INVALID_STATE"

      - name: cancel_after_grace_window_returns_grace_expired
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Reservation.CONFIRMED_to_CANCELLED"
          - "errors[ERR_GRACE_WINDOW_EXPIRED]"
          - "validations[priority=10]"
        distinguishing_aspect: "Cancelling a CONFIRMED reservation after current_utc > hold_expires_at is rejected with ERR_GRACE_WINDOW_EXPIRED (409)."
        test_recipe:
          setup: ["A CONFIRMED reservation; clock advanced to pickup_at + 3h (past the 120-min grace)."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: RentalAgent
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T13:00:00Z" }
              as: RentalAgent
          trigger:
            - call: "POST /reservations/${res1}/cancel"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_GRACE_WINDOW_EXPIRED"

      - name: no_show_within_grace_returns_within_grace
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.Reservation.CONFIRMED_to_NO_SHOW"
          - "errors[ERR_WITHIN_GRACE]"
          - "validations[priority=9]"
        distinguishing_aspect: "Declaring no-show while current_utc <= hold_expires_at is rejected with ERR_WITHIN_GRACE (409)."
        test_recipe:
          setup: ["A CONFIRMED reservation; clock at pickup_at + 30min (still inside the 120-min grace)."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: RentalAgent
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T10:30:00Z" }
              as: RentalAgent
          trigger:
            - call: "POST /reservations/${res1}/no-show"
              payload: {}
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_WITHIN_GRACE"

      - name: close_with_odometer_rollback_returns_rollback
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RentalAgreement.OPEN_to_CLOSED"
          - "errors[ERR_ODOMETER_ROLLBACK]"
          - "validations[priority=11]"
        distinguishing_aspect: "Closing with odometer_in < odometer_out is rejected with ERR_ODOMETER_ROLLBACK (409)."
        test_recipe:
          setup: ["An OPEN agreement with odometer_out 1000."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: false, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
            - call: "POST /rental-agreements"
              payload: { reservation_id: "${res1}", vehicle_id: "${veh1}", odometer_out: 1000, fuel_out_eighths: 8 }
              as: RentalAgent
              captures: { agr1: $.data.id }
          trigger:
            - call: "POST /rental-agreements/${agr1}/close"
              payload: { odometer_in: 900, fuel_in_eighths: 8 }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_ODOMETER_ROLLBACK"

      - name: close_with_filed_total_incident_requires_writeoff
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RentalAgreement.OPEN_to_CLOSED"
          - "errors[ERR_TOTAL_LOSS_REQUIRES_WRITEOFF]"
          - "validations[priority=12]"
        distinguishing_aspect: "Closing an agreement carrying a FILED TOTAL incident is rejected with ERR_TOTAL_LOSS_REQUIRES_WRITEOFF (409)."
        test_recipe:
          setup: ["An OPEN agreement with a FILED TOTAL incident assessed 500000."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
              payload: { member_id: "${mem1}", pickup_location_id: "${loc_lax}", dropoff_location_id: "${loc_lax}", class_id: "${cls_econ}", pickup_at: "2026-07-01T10:00:00Z", dropoff_at: "2026-07-04T10:00:00Z", ldw_selected: true, pai_selected: false }
              as: RentalAgent
              captures: { res1: $.data.id }
            - call: "POST /reservations/${res1}/confirm"
              payload: {}
              as: RentalAgent
            - call: "POST /vehicles/${veh1}/hold"
              payload: { reservation_id: "${res1}", expected_vehicle_version: "${veh1_ver}" }
              as: RentalAgent
            - call: "POST /rental-agreements"
              payload: { reservation_id: "${res1}", vehicle_id: "${veh1}", odometer_out: 1000, fuel_out_eighths: 8 }
              as: RentalAgent
              captures: { agr1: $.data.id }
            - call: "POST /incident-reports"
              payload: { agreement_id: "${agr1}", severity: "TOTAL", assessed_damage_cents: 500000 }
              as: RentalAgent
          trigger:
            - call: "POST /rental-agreements/${agr1}/close"
              payload: { odometer_in: 1100, fuel_in_eighths: 8 }
              as: RentalAgent
              captures: { err: $.data.error_id }
          assert:
            - "response http_status == 409"
            - "response data.error_id == ERR_TOTAL_LOSS_REQUIRES_WRITEOFF"

      - name: writeoff_without_total_incident_returns_no_total
        claim_type: Precondition Enforcement
        grounds:
          - "state_machines.RentalAgreement.OPEN_to_WRITE_OFF"
          - "errors[ERR_NO_TOTAL_INCIDENT]"
          - "validations[priority=13]"
        distinguishing_aspect: "Writing off an agreement with no TOTAL incident is rejected with ERR_NO_TOTAL_INCIDENT (409)."
        test_recipe:
          setup: ["An OPEN agreement with no incidents."]
          setup_api_calls:
            - call: "POST /locations"
              payload: { code: "LAX", name: "Los Angeles", one_way_drop_fee_cents: 4500, young_driver_surcharge_per_day_cents: 1000 }
              as: FleetManager
              captures: { loc_lax: $.data.id }
            - call: "POST /vehicle-classes"
              payload: { code: "ECON", tier_rank: 1, daily_rate_cents: 5000, weekly_rate_cents: 28000, included_miles_per_day: 200, overage_per_mile_cents: 25, ldw_per_day_cents: 1500, pai_per_day_cents: 800 }
              as: FleetManager
              captures: { cls_econ: $.data.id }
            - call: "POST /vehicles"
              payload: { location_id: "${loc_lax}", class_id: "${cls_econ}", plate: "LAX-001", odometer_miles: 1000, fuel_level_eighths: 8 }
              as: FleetManager
              captures: { veh1: $.data.id, veh1_ver: $.data.version }
            - call: "POST /members"
              payload: { email: "m1@x.com", full_name: "M One", driver_age: 30 }
              as: RentalAgent
              captures: { mem1: $.data.id }
            - call: "POST /reservations"
