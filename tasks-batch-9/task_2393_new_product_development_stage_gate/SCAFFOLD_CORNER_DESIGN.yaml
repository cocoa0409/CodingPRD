            - "the owner's call does not return 409 ERR_DUPLICATE_FUNCTION_VOTE"
            - "the bystander's call returns 409 with error_id ERR_DUPLICATE_FUNCTION_VOTE"
            - "GET /gate-reviews/${sod_gr_id}/votes returns total_count 1 and GateReview.${sod_gr_id}.vote_count == 1"
            - "GateReview.${sod_gr_id}.status remains IN_SESSION and quorum 2 is still unmet"

      - name: val_window_ownership_beats_presentation_lead_time
        claim_type: priority_ordering
        grounds:
          - validations[priority 10].ERR_WINDOW_RETAILER_MISMATCH
