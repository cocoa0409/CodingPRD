              as_user_id: "${mb_id}"
            - call: "POST /stewardship/culture-reports/${c_id}/finalize"
              payload: {}
              as: Microbiologist
              as_user_id: "${mb_id}"
          trigger:
            - call: "POST /stewardship/conversion-opportunities/detect"
              payload: { antibiotic_order_id: "${ord_id}", opportunity_kind: "DEESCALATION", suggested_antimicrobial_id: "${drug2_id}" }
