  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: retrade_then_cancel_conserves_revised_avm_to_null
        grounds:
          - state_machines.Transaction.INSPECTION_to_INSPECTION
          - state_machines.Transaction.INSPECTION_to_CANCELLED
          - entities.Property.fields.revised_avm_value
        distinguishing_aspect: "Conserved quantity: Property.revised_avm_value. A re-trade sets revised_avm_value = avm_value_snapshot - retrade_amount; the compensating cancel reverts it so the invariant Property.revised_avm_value == null holds again (the property's effective valuation returns to its pre-retrade baseline, no drift)."
        test_recipe:
          setup:
            - "Transaction at INSPECTION; a 12000 re-trade applied -> revised_avm_value=498000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "s17@x.com", full_name: "S Seventeen" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
            - call: "POST /properties"
              payload: { seller_id: "${seller_id}", address_line: "17 Main", zip_code: "90001", bedrooms: 3, living_area_sqft: 1800, comp_median_value: 500000, market_trend_pct: 0.02 }
              as: PricingAnalyst
              captures: { prop_id: $.data.id }
            - call: "POST /properties/${prop_id}/offers"
              payload: { service_fee_pct: 0.05 }
              as: PricingAnalyst
              captures: { offer_id: $.data.id }
            - call: "POST /offers/${offer_id}/accept"
              payload: {}
              as: Seller
              as_user_id: "${seller_id}"
              captures: { txn_id: $.data.id }
            - call: "GET /offers/${offer_id}/assessment"
              payload: {}
              as: OperationsAdmin
              captures: { assess_id: "$.data[0].id" }
            - call: "POST /assessments/${assess_id}/finalize"
              payload: { roof_condition: "GOOD", hvac_condition: "GOOD", foundation_condition: "GOOD" }
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/schedule-close"
              payload: { close_date: "2026-03-15T00:00:00Z", leaseback_days: 0, final_concession: 0 }
              as: Seller
              as_user_id: "${seller_id}"
            - call: "POST /transactions/${txn_id}/start-inspection"
              payload: {}
              as: OperationsAdmin
            - call: "POST /transactions/${txn_id}/retrade"
              payload: { retrade_amount: 12000 }
              as: PricingAnalyst
          trigger:
            - call: "POST /transactions/${txn_id}/cancel"
              payload: { cancel_reason: "seller backed out" }
              as: Seller
              as_user_id: "${seller_id}"
          assert:
            - "Transaction.${txn_id}.status == CANCELLED"
            - "Property.${prop_id}.revised_avm_value == null"
            - "Property.${prop_id}.status == VALUED"

      - name: reissue_supersede_conserves_single_active_offer_count
        grounds:
          - state_machines.Property.UNDER_OFFER_to_UNDER_OFFER
          - state_machines.Offer.ISSUED_to_SUPERSEDED
          - entities.Property.fields.active_offer_id
          - concurrency_rules[reissue-offer-stale-property]
        distinguishing_aspect: "Conserved quantity: the count of non-terminal Offers bound to a Property (exactly one). Issuing a re-issue (forward action) plus superseding the prior (compensating action) keeps the invariant count(Offers where status==ISSUED for property)==1 — a different conserved quantity (an integer cardinality) than the revised_avm monetary value above."
        test_recipe:
          setup:
            - "Property UNDER_OFFER with one ISSUED offer; Property.version observed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: OperationsAdmin
            - call: "POST /sellers"
              payload: { email: "s18@x.com", full_name: "S Eighteen" }
              as: OperationsAdmin
              captures: { seller_id: $.data.id }
