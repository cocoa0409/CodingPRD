            - "DisclosureStatement.${dis1_id}.mitigation_required == false"
            - "the second validation attempt returns HTTP 200"
            - "CmeAccreditation.${acc1_id}.validation_status == VALIDATED"
            - "CmeAccreditation.${acc1_id}.awarded_credits == 0.50"
            - "CmeAccreditation.${acc1_id}.validated_by_member_id == ${mb_chair2_id}"
            - "CmeAccreditation.${acc1_id}.validated_at == 2026-01-05T00:00:00Z"
            - "Conference.${conf_id}.cme_minutes_allocated == 30"
            - "Conference.${conf_id}.cme_minutes_available == 570"

  # ===========================================================================
  # RULE 8 — resource_temporal_overlap  (3 instances; three DIFFERENT resource
  #          entities - room, chair CommitteeMember, presenter Author - and three
  #          DIFFERENT interval semantics: half-open, turnaround-padded, closed)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: room_intervals_are_half_open_so_touching_is_legal
        grounds:
          - calculations.session_room_overlap
          - entities.Session.fields.room_code
          - state_machines.Session.(create)_to_PLANNED
          - endpoints.POST./sessions
        distinguishing_aspect: |
          The room resource uses HALF-OPEN intervals: a session starting exactly
          when the previous one in the same room ends is accepted, while an overlap
          of a single minute is rejected with ERR_ROOM_TIME_CONFLICT (409). Each
          candidate is chaired by a different member, so the chair rule cannot be
          the reason for either verdict.
        test_recipe:
          setup:
            - "Clock 2026-01-05T00:00:00Z; Conference GOS26 driven to REVIEW_CLOSED with one SUBMITTED abstract and no reviews."
            - "Three ACTIVE chairs with COI declared: Cho, Dana and Erik."
            - "Session A occupies room HALL-A from 2026-09-01T09:00:00Z to 2026-09-01T10:00:00Z under chair Cho."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ConferenceAdmin
            - call: "POST /conferences"
              payload: { name: "Global Oncology Summit 2026", code: "GOS26", event_start_utc: "2026-09-01T08:00:00Z", event_end_utc: "2026-09-03T18:00:00Z", abstract_deadline_utc: "2026-03-01T23:59:00Z", review_deadline_utc: "2026-05-01T23:59:00Z", program_freeze_utc: "2026-08-15T00:00:00Z", oral_slot_capacity: 3, poster_slot_capacity: 2, workshop_slot_capacity: 1, cme_minutes_pool_total: 600 }
              as: ConferenceAdmin
              captures: { conf_id: "$.data.id" }
            - call: "POST /categories"
              payload: { conference_id: "${conf_id}", code: "EDU", name: "Education Research", max_word_count: 300, allowed_formats: ["ORAL", "POSTER"], requires_structured_body: false, min_reviews_required: 2, discrepancy_threshold: 4.00, cme_eligible: false }
              as: ConferenceAdmin
              captures: { cat_edu_id: "$.data.id" }
            - call: "POST /authors"
              payload: { full_name: "Ada Rivera", email: "ada@lab.example", affiliation: "Northline University" }
              as: ConferenceAdmin
              captures: { au_ada_id: "$.data.id" }
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Cho Bekele", email: "cho@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology", "immunotherapy"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair_id: "$.data.id" }
            - call: "POST /conflict-declarations"
              payload: { member_id: "${mb_chair_id}", conflict_subject_type: "NONE", conflict_type: "NONE" }
              as: ConferenceAdmin
            - call: "POST /committee-members/${mb_chair_id}/status-transitions"
              payload: { to_status: "ACTIVE" }
              as: ConferenceAdmin
            - call: "POST /committee-members"
              payload: { conference_id: "${conf_id}", full_name: "Dana Petit", email: "dana@panel.example", member_role: "CHAIR", expertise_keywords: ["oncology", "ethics"], max_review_load: 4, calibration_bias: 0.00 }
              as: ConferenceAdmin
              captures: { mb_chair2_id: "$.data.id" }
