      - name: blockage_credit_stops_at_the_forty_percent_cap
        claim_type: threshold
        grounds:
          - "calculations.delivery_fee"
          - "entities.DeliveryMission.fields.blocked_minutes"
          - "entities.DeliveryOrder.fields.settled_fee_cents"
          - "calculations.exception_reason_mapping"
          - "entities.Merchant.fields.settlement_variance_cents"
        distinguishing_aspect: >-
          The blockage credit is a capped linear term, not an open-ended one: 90 blocked minutes would earn
          720 cents at 8 cents per minute but the cap floor(gross * 0.4) == 428 binds first, so the
          settlement of a 1071-cent gross is round_half_up((1071 - 428) * 0.95) == 611, and because the
