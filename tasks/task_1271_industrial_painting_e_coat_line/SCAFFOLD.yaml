# =============================================================================
# SCAFFOLD.yaml — Task 1271: Industrial Painting & E-Coat Line (e-coat job coater)
# §1.0–§1.7 (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  generate task hard than expert level! 1271. Industrial Painting & E-Coat Line
  (e-coat job coater): color/spec & film-build standard, pretreatment stage
  monitoring & titration, hanger density & line-speed scheduling, cure oven
  profile & recheck, adhesion/impact test & lot hold, color change & purge cost
  allocation, VOC permit & emission accounting, rework strip & repaint charge

domain_name: industrial-ecoating
api_prefix: /ecoat

# Step 0: Complexity Profile --------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration   # multi-stage coating pipeline with rework branching
  secondary_archetype: compliance_audit       # VOC permit accounting, lot holds, segregation of duties
  complexity_layers:
    - optimistic_concurrency        # OCC on PaintLine.version guards run-slot scheduling
    - cascading_side_effects        # titration → stage → line posture; QC fail → hold → rework order
    - dual_variant_calculation      # purge cost allocation; VOC metered vs theoretical
    - rate_threshold_triggers       # film-build window, titration range, VOC cap, oven capacity
  entity_topology: flat                       # peer resources joined by FKs; no nested create paths
  state_machine_shape: cyclic                 # Lot rework loop; PretreatmentStage compliance loop
  relationship_patterns:
    - one_to_many                   # Customer→Lot, PaintLine→PretreatmentStage/RunSlot/ColorChange, VocPermit→EmissionEntry
    - self_referential              # OvenCycle.recheck_of_id → OvenCycle.id
    - cross_aggregate               # RunSlot references Lot + PaintLine; EmissionEntry references Lot/ColorChange
  role_model: segregation_of_duties # quality test recorder may not release the same lot
  consistency_model: immediate      # all cascades atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer (OEM jobber) name" }

  - name: CoatingSpec
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: color_code, type: string, source: input, description: "Color identifier, e.g. RAL9005" }
      - { name: film_build_min_um, type: number, source: input, description: "Minimum acceptable dry film thickness (microns), inclusive" }
      - { name: film_build_max_um, type: number, source: input, description: "Maximum acceptable dry film thickness (microns), inclusive" }
      - { name: cure_metal_temp_c, type: number, source: input, description: "Required peak metal temperature in cure oven (°C), inclusive threshold" }
      - { name: cure_minutes_at_temp, type: integer, source: input, description: "Required minutes at-or-above cure_metal_temp_c, inclusive threshold" }
      - { name: adhesion_class_min, type: integer, source: input, description: "Minimum cross-hatch adhesion class to PASS (integer 0-5), inclusive" }
      - { name: impact_joules_min, type: number, source: input, description: "Minimum impact resistance (J) to PASS, inclusive" }
      - { name: voc_g_per_l, type: number, source: input, description: "VOC content of the coating material, grams per liter" }
      - { name: area_dm2_per_part, type: number, source: input, description: "Coated surface area per part (dm²); drives charges and theoretical VOC" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED — at most one ACTIVE spec per (customer_id, color_code); creating a new ACTIVE spec for the same pair supersedes the old", constraints: "enum {ACTIVE, SUPERSEDED}; unique ACTIVE per (customer_id, color_code)" }

  - name: PaintLine
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Line name" }
      - { name: current_color_code, type: string, source: input, description: "Color currently loaded in the e-coat tank" }
      - { name: line_speed_fpm, type: number, source: input, description: "Conveyor line speed, feet per minute; mutable via set-line-speed when no slot RUNNING" }
      - { name: hanger_capacity_parts, type: integer, source: input, description: "Maximum parts per hanger (physical rack capacity)" }
      - { name: allocation_policy, type: enum, source: input, description: "Purge cost allocation policy: FULL_TO_NEXT_LOT | PRO_RATA_BY_PARTS", constraints: "enum {FULL_TO_NEXT_LOT, PRO_RATA_BY_PARTS}; immutable after creation" }
      - { name: posture, type: enum, source: computed, default: RUNNING, description: "RUNNING | CHEM_HOLD — derived: CHEM_HOLD while any PretreatmentStage of this line is OUT_OF_RANGE or ADJUSTING; RUNNING otherwise", constraints: "enum {RUNNING, CHEM_HOLD}" }

  - name: CureOven
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Oven name" }
      - { name: max_loads, type: integer, source: input, description: "Maximum number of mutually overlapping cure cycles (aggregate capacity; closed-interval overlap counting)" }

  - name: PretreatmentStage
    parent: null
    common_fields: true
    fields:
      - { name: paint_line_id, type: string, source: input, description: "FK -> PaintLine.id; line this tank stage belongs to" }
      - { name: stage_name, type: string, source: input, description: "Stage name, e.g. alkaline_clean, zinc_phosphate" }
      - { name: sequence_no, type: integer, source: input, description: "Order of the stage in the pretreatment tunnel (1-based)" }
      - { name: chemical_family, type: string, source: input, description: "Chemical family label, e.g. CLEANER, PHOSPHATE, SEALER" }
      - { name: conc_min_gpl, type: number, source: input, description: "Minimum acceptable titration concentration (g/L), inclusive" }
      - { name: conc_max_gpl, type: number, source: input, description: "Maximum acceptable titration concentration (g/L), inclusive" }
      - { name: status, type: enum, source: computed, default: IN_RANGE, description: "IN_RANGE | OUT_OF_RANGE | ADJUSTING — driven by titration readings and adjustments", constraints: "enum {IN_RANGE, OUT_OF_RANGE, ADJUSTING}" }

  - name: TitrationReading
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: stage_id, type: string, source: input, description: "FK -> PretreatmentStage.id; stage measured" }
      - { name: measured_conc_gpl, type: number, source: input, description: "Measured concentration (g/L), must be >= 0" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID header of the ProcessChemist who recorded the reading" }
      - { name: in_range, type: boolean, source: computed, description: "conc_min_gpl <= measured_conc_gpl <= conc_max_gpl (both bounds inclusive)" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer owning the parts" }
      - { name: spec_id, type: string, source: input, description: "FK -> CoatingSpec.id; coating standard this lot must meet" }
      - { name: part_quantity, type: integer, source: input, description: "Total parts received in the lot (> 0)" }
      - { name: scrapped_quantity, type: integer, source: system, default: 0, description: "Parts scrapped during rework strip; cumulative" }
      - { name: passed_quantity, type: integer, source: system, default: 0, description: "Parts released as good; set at release to part_quantity - scrapped_quantity" }
      - { name: outstanding_quantity, type: integer, source: computed, description: "= part_quantity - scrapped_quantity - passed_quantity; parts still to be painted/released" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Number of completed strip-and-repaint cycles; incremented on complete-strip; MAX_REWORK_COUNT = 2" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED → QUEUED → SCHEDULED → ON_LINE → CURING → CURE_FAILED/QC_PENDING → QC_HOLD → STRIPPING → QUEUED (rework cycle); terminals RELEASED, SCRAPPED, CANCELLED", constraints: "enum {RECEIVED, QUEUED, SCHEDULED, ON_LINE, CURING, CURE_FAILED, QC_PENDING, QC_HOLD, STRIPPING, RELEASED, SCRAPPED, CANCELLED}" }
      - { name: base_charge_cents, type: integer, source: computed, default: 0, description: "Set at accept: part_quantity × round_half_up(area_dm2_per_part × BASE_COAT_RATE_CENTS_PER_DM2)" }
      - { name: purge_alloc_cents, type: integer, source: computed, default: 0, description: "Cumulative purge-cost allocations from color changes" }
      - { name: rework_charge_cents, type: integer, source: computed, default: 0, description: "Cumulative approved+completed rework charges" }
      - { name: total_charge_cents, type: integer, source: computed, default: 0, description: "= base_charge_cents + purge_alloc_cents + rework_charge_cents; finalized at release" }

  - name: RunSlot
    parent: null
    common_fields: true
    fields:
      - { name: paint_line_id, type: string, source: input, description: "FK -> PaintLine.id; line the lot is scheduled on" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot being painted" }
      - { name: start_utc, type: datetime, source: input, description: "Planned window start (half-open interval [start_utc, end_utc))" }
      - { name: end_utc, type: datetime, source: input, description: "Planned window end (exclusive); must be > start_utc" }
      - { name: parts_per_hanger, type: integer, source: input, description: "Planned hanger density; 1..paint_line.hanger_capacity_parts" }
      - { name: planned_line_speed_fpm, type: number, source: system, description: "Snapshot of PaintLine.line_speed_fpm at creation" }
      - { name: predicted_film_build_um, type: number, source: computed, description: "round_half_up(FILM_TRANSFER_K / planned_line_speed_fpm × density_factor(parts_per_hanger), 1); must lie within spec film window at creation" }
      - { name: voc_projected_kg, type: number, source: computed, description: "Theoretical VOC reserved on the permit while SCHEDULED (see voc_emission_theoretical)" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED → RUNNING → COMPLETED; SCHEDULED → CANCELLED", constraints: "enum {SCHEDULED, RUNNING, COMPLETED, CANCELLED}" }

  - name: OvenCycle
    parent: null
    common_fields: false   # immutable event; rechecks are new OvenCycle rows
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot cured" }
      - { name: oven_id, type: string, source: input, description: "FK -> CureOven.id; oven used" }
      - { name: recheck_of_id, type: string, source: input, description: "FK -> OvenCycle.id; optional — set when this cycle is a recheck of a failed cycle", constraints: "nullable; referenced cycle must have verdict FAIL and no existing recheck child" }
      - { name: entered_at, type: datetime, source: input, description: "Load-in timestamp (closed interval bound — touching counts as overlap)" }
      - { name: exited_at, type: datetime, source: input, description: "Load-out timestamp; must be > entered_at" }
      - { name: min_metal_temp_c, type: number, source: input, description: "Lowest recorded part metal temperature during the cycle (°C)" }
      - { name: minutes_at_or_above_temp, type: integer, source: input, description: "Minutes the part metal temperature stayed at-or-above spec.cure_metal_temp_c" }
      - { name: verdict, type: enum, source: computed, description: "PASS iff min_metal_temp_c >= spec.cure_metal_temp_c AND minutes_at_or_above_temp >= spec.cure_minutes_at_temp; else FAIL", constraints: "enum {PASS, FAIL}" }

  - name: QualityTest
    parent: null
    common_fields: false   # immutable event
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; lot sampled" }
      - { name: test_type, type: enum, source: input, description: "ADHESION | IMPACT", constraints: "enum {ADHESION, IMPACT}" }
      - { name: measured_value, type: number, source: input, description: "Adhesion class (0-5) or impact joules, per test_type" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the QcInspector who recorded the test; feeds segregation-of-duties check at release" }
      - { name: verdict, type: enum, source: computed, description: "ADHESION: PASS iff measured_value >= spec.adhesion_class_min; IMPACT: PASS iff measured_value >= spec.impact_joules_min; else FAIL", constraints: "enum {PASS, FAIL}" }

  - name: ReworkOrder
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; auto-created when a QualityTest verdict is FAIL" }
      - { name: parts_to_rework, type: integer, source: system, description: "= lot.part_quantity - lot.scrapped_quantity - lot.passed_quantity at creation" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT → APPROVED → COMPLETED", constraints: "enum {DRAFT, APPROVED, COMPLETED}" }
      - { name: strip_cost_cents, type: integer, source: computed, description: "At approve: STRIP_BASE_CENTS + STRIP_PER_PART_CENTS × parts_to_rework" }
      - { name: repaint_charge_cents, type: integer, source: computed, description: "At complete-strip: (parts_to_rework - scrapped_quantity) × round_half_up(area_dm2_per_part × REPAINT_RATE_CENTS_PER_DM2 × REWORK_MULTIPLIER) — per-part rounding pinned, see rework_charge calc" }
      - { name: scrapped_quantity, type: integer, source: input, description: "Parts scrapped instead of stripped; supplied at complete-strip; 0 <= value <= parts_to_rework" }
      - { name: total_charge_cents, type: integer, source: computed, description: "= strip_cost_cents + repaint_charge_cents; added to lot.rework_charge_cents at complete-strip" }

  - name: ColorChange
    parent: null
    common_fields: false   # atomic event record
    fields:
      - { name: paint_line_id, type: string, source: input, description: "FK -> PaintLine.id; line being changed over" }
      - { name: from_color_code, type: string, source: system, description: "Snapshot of line.current_color_code before the change" }
      - { name: to_color_code, type: string, source: input, description: "New color to load; must differ from current color" }
      - { name: window_start_utc, type: datetime, source: input, description: "Changeover window start" }
      - { name: window_end_utc, type: datetime, source: input, description: "Changeover window end; must be > window_start_utc; a PURGE_BUFFER_MIN=30 minute buffer after window_end also blocks run slots" }
      - { name: purge_solvent_liters, type: number, source: input, description: "Purge solvent consumed (L), > 0" }
      - { name: purge_cost_cents, type: integer, source: computed, description: "= round_half_up(purge_solvent_liters × SOLVENT_COST_CENTS_PER_L) + PURGE_FIXED_CENTS" }
      - { name: purge_voc_kg, type: number, source: computed, description: "= round_half_up(purge_solvent_liters × PURGE_SOLVENT_VOC_G_PER_L / 1000, 3)" }
      - { name: allocation_method, type: enum, source: system, description: "Copied from PaintLine.allocation_policy at creation: FULL_TO_NEXT_LOT | PRO_RATA_BY_PARTS", constraints: "enum {FULL_TO_NEXT_LOT, PRO_RATA_BY_PARTS}" }

  - name: VocPermit
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: datetime, source: input, description: "Permit period start (inclusive)" }
      - { name: period_end, type: datetime, source: input, description: "Permit period end (exclusive); must be > period_start" }
      - { name: cap_kg, type: number, source: input, description: "Maximum VOC emissions allowed in the period (kg)" }
      - { name: used_kg, type: number, source: computed, default: 0, description: "= sum of voc_kg over all EmissionEntry rows of this permit; 3-decimal half-up arithmetic per entry" }
      - { name: reserved_kg, type: number, source: computed, default: 0, description: "= sum of voc_projected_kg over RunSlots in SCHEDULED or RUNNING whose lot's spec period maps to this permit; released on cancel/complete" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE → EXCEEDED (automatic when used_kg > cap_kg after any posting) ; ACTIVE|EXCEEDED → CLOSED via close after period_end", constraints: "enum {ACTIVE, EXCEEDED, CLOSED}" }

  - name: EmissionEntry
    parent: null
    common_fields: false   # append-only ledger
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> VocPermit.id; permit whose period contains the entry timestamp" }
      - { name: source_type, type: enum, source: system, description: "PAINT_USAGE_METERED | PURGE_SOLVENT | STRIP_SOLVENT | CLOSEOUT_ADJUSTMENT", constraints: "enum {PAINT_USAGE_METERED, PURGE_SOLVENT, STRIP_SOLVENT, CLOSEOUT_ADJUSTMENT}" }
      - { name: source_lot_id, type: string, source: system, description: "FK -> Lot.id; nullable — set for PAINT_USAGE_METERED and STRIP_SOLVENT entries", constraints: "nullable" }
      - { name: source_color_change_id, type: string, source: system, description: "FK -> ColorChange.id; nullable — set for PURGE_SOLVENT entries", constraints: "nullable" }
      - { name: voc_kg, type: number, source: computed, description: "Signed kilograms of VOC; 3 decimals, round_half_up; CLOSEOUT_ADJUSTMENT may be negative" }
      - { name: entry_variant, type: enum, source: system, description: "METERED | THEORETICAL | ADJUSTMENT — which voc_emission variant produced this entry", constraints: "enum {METERED, THEORETICAL, ADJUSTMENT}" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Lot
    initial_state: RECEIVED
    terminal_states: [RELEASED, SCRAPPED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: QUEUED
        trigger: "POST /ecoat/lots/{id}/accept"
        actor: LineScheduler
        preconditions:
          - "lot.status == RECEIVED (else ERR_INVALID_STATE)"
          - "lot.spec.status == ACTIVE (else ERR_SPEC_NOT_ACTIVE)"
        side_effects:
          - "base_charge_cents = part_quantity × round_half_up(spec.area_dm2_per_part × BASE_COAT_RATE_CENTS_PER_DM2)"

      - from: QUEUED
        to: SCHEDULED
        trigger: "POST /ecoat/run-slots (side effect on the referenced lot)"
        actor: LineScheduler
        preconditions:
          - "lot.status == QUEUED (else ERR_LOT_NOT_QUEUED)"
        side_effects:
          - "RunSlot row created in SCHEDULED"

      - from: SCHEDULED
        to: QUEUED
        trigger: "POST /ecoat/run-slots/{id}/cancel (side effect on the lot)"
        actor: LineScheduler
        preconditions: []
        side_effects:
          - "lot returns to QUEUED; voc reservation released on the permit"

      - from: SCHEDULED
        to: ON_LINE
        trigger: "POST /ecoat/run-slots/{id}/start (side effect on the lot)"
        actor: LineScheduler
        preconditions:
          - "slot.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "paint_line.posture == RUNNING (else ERR_LINE_ON_CHEM_HOLD)"
        side_effects: []

      - from: ON_LINE
        to: CURING
        trigger: "POST /ecoat/run-slots/{id}/complete (side effect on the lot)"
        actor: LineScheduler
        preconditions:
          - "slot.status == RUNNING (else ERR_INVALID_STATE)"
        side_effects:
          - "PAINT_USAGE_METERED EmissionEntry posted (metered variant)"
          - "permit.reserved_kg -= slot.voc_projected_kg; permit.used_kg += entry.voc_kg; if used_kg > cap_kg → permit.status → EXCEEDED"

      - from: CURING
        to: QC_PENDING
        trigger: "POST /ecoat/oven-cycles with verdict PASS and no recheck_of_id"
        actor: QcInspector
        preconditions:
          - "lot.status == CURING"
        side_effects: []

      - from: CURING
        to: CURE_FAILED
        trigger: "POST /ecoat/oven-cycles with verdict FAIL and no recheck_of_id"
        actor: QcInspector
        preconditions:
          - "lot.status == CURING"
        side_effects: []

      - from: CURE_FAILED
        to: QC_PENDING
        trigger: "POST /ecoat/oven-cycles (recheck: recheck_of_id set) with verdict PASS"
        actor: QcInspector
        preconditions:
          - "lot.status == CURE_FAILED"
          - "referenced cycle verdict == FAIL and has no existing recheck child (else ERR_RECHECK_NOT_ALLOWED)"
        side_effects: []

      - from: QC_PENDING
        to: QC_HOLD
        trigger: "POST /ecoat/quality-tests with verdict FAIL (side effect on the lot)"
        actor: QcInspector
        preconditions:
          - "lot.status == QC_PENDING"
        side_effects:
          - "lot.status → QC_HOLD"
          - "auto-create ReworkOrder for the lot in DRAFT with parts_to_rework = lot.outstanding_quantity (cascade hop 2)"

      - from: QC_PENDING
        to: RELEASED
        trigger: "POST /ecoat/lots/{id}/release"
        actor: QualityManager
        preconditions:
          - "lot.status == QC_PENDING (else ERR_INVALID_STATE)"
          - "≥1 PASS QualityTest of type ADHESION recorded after the lot's latest PASS OvenCycle (else ERR_TESTS_INCOMPLETE)"
          - "≥1 PASS QualityTest of type IMPACT recorded after the lot's latest PASS OvenCycle (else ERR_TESTS_INCOMPLETE)"
          - "X-User-ID of the releasing QualityManager != recorded_by_user_id of every QualityTest on this lot in the current cure epoch (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "passed_quantity = part_quantity - scrapped_quantity"
          - "total_charge_cents = base_charge_cents + purge_alloc_cents + rework_charge_cents"

      - from: QC_HOLD
        to: STRIPPING
        trigger: "POST /ecoat/rework-orders/{id}/approve (side effect on the lot)"
        actor: QualityManager
        preconditions:
          - "rework_order.status == DRAFT (else ERR_INVALID_STATE)"
          - "lot.rework_count < MAX_REWORK_COUNT (2) (else ERR_REWORK_LIMIT_EXCEEDED)"
        side_effects:
          - "strip_cost_cents computed on the ReworkOrder"

      - from: STRIPPING
        to: QUEUED
        trigger: "POST /ecoat/rework-orders/{id}/complete-strip with scrapped_quantity < parts_to_rework"
        actor: QualityManager
        preconditions:
          - "rework_order.status == APPROVED (else ERR_INVALID_STATE)"
          - "0 <= scrapped_quantity <= parts_to_rework (else ERR_PART_ACCOUNT_MISMATCH)"
        side_effects:
          - "lot.scrapped_quantity += scrapped_quantity"
          - "lot.rework_count += 1"
          - "repaint_charge_cents + total_charge_cents computed; lot.rework_charge_cents += total_charge_cents"
          - "STRIP_SOLVENT EmissionEntry posted for (parts_to_rework - scrapped_quantity) stripped parts; permit.used_kg += entry.voc_kg; if used_kg > cap_kg → permit.status → EXCEEDED"
          - "lot re-enters QUEUED and may be scheduled again (rework cycle)"
        note: "This is the cycle edge QUEUED→…→QC_HOLD→STRIPPING→QUEUED."

      - from: STRIPPING
        to: SCRAPPED
        trigger: "POST /ecoat/rework-orders/{id}/complete-strip with scrapped_quantity == parts_to_rework"
        actor: QualityManager
        preconditions:
          - "rework_order.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "lot.scrapped_quantity += scrapped_quantity (now == part_quantity - passed_quantity)"
          - "no repaint charge (repaint_charge_cents = 0); strip cost still applies"

      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /ecoat/lots/{id}/cancel"
        actor: LineScheduler
        preconditions: []
        side_effects: []

      - from: QUEUED
        to: CANCELLED
        trigger: "POST /ecoat/lots/{id}/cancel"
        actor: LineScheduler
        preconditions: []
        side_effects: []

  - entity: PretreatmentStage
    initial_state: IN_RANGE
    terminal_states: []
    transitions:
      - from: IN_RANGE
        to: OUT_OF_RANGE
        trigger: "POST /ecoat/titration-readings with in_range == false"
        actor: ProcessChemist
        preconditions: []
        side_effects:
          - "stage.status → OUT_OF_RANGE"
          - "paint_line.posture → CHEM_HOLD (cascade hop 2) and paint_line.version += 1"

      - from: OUT_OF_RANGE
        to: ADJUSTING
        trigger: "POST /ecoat/pretreatment-stages/{id}/adjustments"
        actor: ProcessChemist
        preconditions:
          - "stage.status == OUT_OF_RANGE (else ERR_INVALID_STATE)"
        side_effects:
          - "stage.status → ADJUSTING; line posture remains CHEM_HOLD"

      - from: ADJUSTING
        to: IN_RANGE
        trigger: "POST /ecoat/titration-readings with in_range == true"
        actor: ProcessChemist
        preconditions: []
        side_effects:
          - "stage.status → IN_RANGE"
          - "if no other stage of the line is OUT_OF_RANGE or ADJUSTING: paint_line.posture → RUNNING (cascade hop 2) and paint_line.version += 1"

      - from: ADJUSTING
        to: OUT_OF_RANGE
        trigger: "POST /ecoat/titration-readings with in_range == false"
        actor: ProcessChemist
        preconditions: []
        side_effects:
          - "stage.status → OUT_OF_RANGE; line posture stays CHEM_HOLD"
        note: "A reading while stage is IN_RANGE that is in-range leaves status unchanged; a reading while OUT_OF_RANGE (no adjustment yet) never returns the stage to IN_RANGE — adjustment is mandatory (cycle IN_RANGE→OUT_OF_RANGE→ADJUSTING→IN_RANGE)."

  - entity: RunSlot
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RUNNING
        trigger: "POST /ecoat/run-slots/{id}/start"
        actor: LineScheduler
        preconditions:
          - "slot.status == SCHEDULED (else ERR_INVALID_STATE)"
          - "paint_line.posture == RUNNING (else ERR_LINE_ON_CHEM_HOLD)"
        side_effects: []

      - from: RUNNING
        to: COMPLETED
        trigger: "POST /ecoat/run-slots/{id}/complete"
        actor: LineScheduler
        preconditions:
          - "slot.status == RUNNING (else ERR_INVALID_STATE)"
        side_effects:
          - "lot.status → CURING"
          - "PAINT_USAGE_METERED EmissionEntry (voc_emission_metered)"
          - "permit.reserved_kg -= slot.voc_projected_kg; permit.used_kg += entry.voc_kg"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /ecoat/run-slots/{id}/cancel"
        actor: LineScheduler
        preconditions:
          - "slot.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "lot.status → QUEUED"
          - "permit.reserved_kg -= slot.voc_projected_kg (compensating action; see voc_reservation_conservation invariant)"

  - entity: ReworkOrder
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /ecoat/rework-orders/{id}/approve"
        actor: QualityManager
        preconditions:
          - "rework_order.status == DRAFT (else ERR_INVALID_STATE)"
          - "lot.rework_count < 2 (else ERR_REWORK_LIMIT_EXCEEDED)"
        side_effects:
          - "strip_cost_cents computed"
          - "lot.status → STRIPPING"

      - from: APPROVED
        to: COMPLETED
        trigger: "POST /ecoat/rework-orders/{id}/complete-strip"
        actor: QualityManager
        preconditions:
          - "rework_order.status == APPROVED (else ERR_INVALID_STATE)"
          - "0 <= scrapped_quantity <= parts_to_rework (else ERR_PART_ACCOUNT_MISMATCH)"
        side_effects:
          - "repaint_charge_cents, total_charge_cents computed"
          - "lot.scrapped_quantity, lot.rework_count, lot.rework_charge_cents updated"
          - "lot.status → QUEUED (partial strip) or SCRAPPED (full scrap)"
          - "STRIP_SOLVENT EmissionEntry posted"

  - entity: CoatingSpec
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when POST /ecoat/coating-specs creates a new spec for the same (customer_id, color_code))"
        actor: system
        preconditions: []
        side_effects:
          - "prior ACTIVE spec for the pair → SUPERSEDED; its version += 1"

  - entity: VocPermit
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: EXCEEDED
        trigger: "system (automatic after any EmissionEntry posting that makes used_kg > cap_kg, including the close reconciliation)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /ecoat/voc-permits/{id}/close"
        actor: PlantAdmin
        preconditions:
          - "permit.status in {ACTIVE, EXCEEDED} (else ERR_PERMIT_PERIOD_CLOSED)"
          - "current logical clock > permit.period_end (else ERR_PERMIT_NOT_EXPIRED)"
        side_effects:
          - "CLOSEOUT_ADJUSTMENT EmissionEntry posted = theoretical total − metered total (cascade hop 1)"
          - "used_kg recomputed (hop 2); if used_kg > cap_kg → status → EXCEEDED instead of CLOSED (hop 3)"

      - from: EXCEEDED
        to: CLOSED
        trigger: "POST /ecoat/voc-permits/{id}/close"
        actor: PlantAdmin
        preconditions:
          - "current logical clock > permit.period_end (else ERR_PERMIT_NOT_EXPIRED)"
        side_effects:
          - "CLOSEOUT_ADJUSTMENT entry posted; used_kg recomputed; status lands CLOSED only if used_kg <= cap_kg, else stays EXCEEDED"

  - entity: PaintLine
    initial_state: RUNNING
    terminal_states: []
    transitions:
      - from: RUNNING
        to: CHEM_HOLD
        trigger: "system (automatic when any PretreatmentStage of the line leaves IN_RANGE)"
        actor: system
        preconditions: []
        side_effects:
          - "run-slot start is gated while posture == CHEM_HOLD (ERR_LINE_ON_CHEM_HOLD)"

      - from: CHEM_HOLD
        to: RUNNING
        trigger: "system (automatic when the last non-IN_RANGE stage returns to IN_RANGE)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: run-slot-create-stale-line
    parent_entity: PaintLine
    write_endpoint: "POST /ecoat/run-slots"
    occ_field: expected_paint_line_version
    description: |
      Creating a RunSlot against a PaintLine whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just scheduled a slot (which legitimately commits the
      line's capacity, VOC reservation and color state) and the current
      writer's view of the line is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: film_build_estimation
    trigger: "POST /ecoat/run-slots (at creation; result stored on RunSlot.predicted_film_build_um)"
    algorithm: threshold
    formula: |
      density_factor = 1.00 if parts_per_hanger <= 20
                       0.95 if 21 <= parts_per_hanger <= 40
                       0.88 if parts_per_hanger >= 41
      predicted_film_build_um = round_half_up(FILM_TRANSFER_K / line_speed_fpm × density_factor, 1)
      eligible iff spec.film_build_min_um <= predicted_film_build_um <= spec.film_build_max_um
      (both bounds inclusive); else reject ERR_FILM_BUILD_OUT_OF_WINDOW
    input_set: "the lot's ACTIVE spec film window, PaintLine.line_speed_fpm snapshot, request parts_per_hanger"
    constants:
      FILM_TRANSFER_K: 220.0
      TIER1_MAX_PARTS: 20
      TIER2_MAX_PARTS: 40
      TIER1_FACTOR: 1.00
      TIER2_FACTOR: 0.95
      TIER3_FACTOR: 0.88
    precision: "1 decimal place, round_half_up"

  - name: titration_range_check
    trigger: "POST /ecoat/titration-readings"
    algorithm: threshold
    formula: |
      in_range = (stage.conc_min_gpl <= measured_conc_gpl <= stage.conc_max_gpl)   # both bounds inclusive
    input_set: "the referenced stage's range; the measured value"
    precision: "inputs compared as given (numbers, no rounding)"

  - name: cure_verdict
    trigger: "POST /ecoat/oven-cycles"
    algorithm: threshold
    formula: |
      verdict = PASS iff min_metal_temp_c >= spec.cure_metal_temp_c
                     AND minutes_at_or_above_temp >= spec.cure_minutes_at_temp
              else FAIL   # both bounds inclusive
    input_set: "the lot's spec cure parameters; the cycle's recorded profile summary"
    precision: "inputs compared as given"

  - name: quality_verdict
    trigger: "POST /ecoat/quality-tests"
    algorithm: threshold
    formula: |
      ADHESION: PASS iff measured_value >= spec.adhesion_class_min
      IMPACT:   PASS iff measured_value >= spec.impact_joules_min
      else FAIL   # inclusive thresholds
    input_set: "the lot's spec test minima; the measured value"
    precision: "inputs compared as given"

  - name: purge_cost_and_allocation
    trigger: "POST /ecoat/color-changes (cost + VOC at creation; allocation applied to lots at the same instant)"
    algorithm: waterfall_allocation
    formula: |
      purge_cost_cents = round_half_up(purge_solvent_liters × SOLVENT_COST_CENTS_PER_L) + PURGE_FIXED_CENTS
      purge_voc_kg     = round_half_up(purge_solvent_liters × PURGE_SOLVENT_VOC_G_PER_L / 1000, 3)
      allocation target set = all Lots with status == QUEUED whose spec.color_code == to_color_code
        FULL_TO_NEXT_LOT: the entire purge_cost_cents goes to the single target lot with
          earliest created_at (tie-break: part_quantity DESC); lot.purge_alloc_cents += purge_cost_cents.
          If the target set is empty the cost stays unallocated (no error, no partial write).
        PRO_RATA_BY_PARTS: order target lots by created_at ASC (tie-break part_quantity DESC);
          for every lot except the last: share = round_half_up(purge_cost_cents × lot.part_quantity / Σ target part_quantity);
          the last lot receives the remainder purge_cost_cents − Σ previous shares,
          so Σ allocations == purge_cost_cents exactly (no rounding drift).
          If the target set is empty the cost stays unallocated.
    input_set: "ColorChange inputs; QUEUED lots whose spec color matches to_color_code"
    constants:
      SOLVENT_COST_CENTS_PER_L: 450
      PURGE_FIXED_CENTS: 12000
      PURGE_SOLVENT_VOC_G_PER_L: 880
      PURGE_BUFFER_MIN: 30
    precision: "money integer cents (round_half_up); VOC 3 decimals round_half_up"
    variants:
      - name: full_to_next_lot
        when: "PaintLine.allocation_policy == FULL_TO_NEXT_LOT"
        difference: "one lot absorbs 100% of the purge cost"
      - name: pro_rata_by_parts
        when: "PaintLine.allocation_policy == PRO_RATA_BY_PARTS"
        difference: "cost split by part_quantity with per-lot rounding and remainder to the last lot — identical inputs yield different per-lot charges than full_to_next_lot"

  - name: voc_emission_metered
    trigger: "POST /ecoat/run-slots/{id}/complete (PAINT_USAGE_METERED entry)"
    algorithm: aggregation
    formula: |
      voc_kg = round_half_up(paint_used_liters × spec.voc_g_per_l / 1000, 3)
    input_set: "metered paint liters from the request; the lot's spec.voc_g_per_l"
    precision: "3 decimal places, round_half_up"
    variants:
      - name: metered
        when: "runtime posting on run-slot completion"
        difference: "uses the operator-reported metered liters"

  - name: voc_emission_theoretical
    trigger: "POST /ecoat/run-slots (projection reserved on the permit) and POST /ecoat/voc-permits/{id}/close (reconciliation)"
    algorithm: forward_looking
    formula: |
      avg_film_um = (spec.film_build_min_um + spec.film_build_max_um) / 2
      theoretical_liters = outstanding_parts × spec.area_dm2_per_part × avg_film_um × 1e-5
                           / (SOLIDS_FRACTION × TRANSFER_EFFICIENCY)
      voc_kg = round_half_up(theoretical_liters × spec.voc_g_per_l / 1000, 3)
      outstanding_parts = lot.part_quantity − lot.scrapped_quantity − lot.passed_quantity
    input_set: "lots painted in the permit period (completed run slots) at close; the scheduling lot at reservation"
    constants:
      SOLIDS_FRACTION: 0.35
      TRANSFER_EFFICIENCY: 0.95
    precision: "3 decimal places, round_half_up"
    variants:
      - name: theoretical
        when: "reservation at schedule time; reconciliation at permit close"
        difference: "derives consumption from part area and film window instead of metered liters — identical production yields different kg than the metered variant"

  - name: voc_closeout_reconciliation
    trigger: "POST /ecoat/voc-permits/{id}/close"
    algorithm: aggregation
    formula: |
      theoretical_total = Σ voc_emission_theoretical(lot) over lots with a COMPLETED run slot
                          whose completion timestamp falls in [period_start, period_end)
      metered_total     = Σ voc_kg over this permit's EmissionEntry rows with source_type == PAINT_USAGE_METERED
      adjustment_kg     = round_half_up(theoretical_total − metered_total, 3)   # may be negative
      post one EmissionEntry { source_type: CLOSEOUT_ADJUSTMENT, entry_variant: ADJUSTMENT, voc_kg: adjustment_kg }
      used_kg = Σ all entries; if used_kg > cap_kg → status EXCEEDED (even during close), else CLOSED
    input_set: "the permit's entries and the period's completed lots"
    precision: "3 decimal places, round_half_up"

  - name: voc_cap_projection_check
    trigger: "POST /ecoat/run-slots and POST /ecoat/color-changes"
    algorithm: threshold
    formula: |
      permit = the VocPermit with status != CLOSED and period_start <= current_clock < period_end
               (half-open period; none → ERR_NO_ACTIVE_PERMIT)
      reject ERR_VOC_CAP_EXCEEDED iff used_kg + reserved_kg + new_emission_kg > cap_kg
      — strictly greater; landing exactly on cap_kg is allowed.
      (run-slot: new_emission = voc_projected_kg added to reserved; color-change: purge_voc_kg added to used)
    input_set: "the covering permit; the proposed emission"
    precision: "3-decimal comparison on rounded values"

  - name: strip_emission
    trigger: "POST /ecoat/rework-orders/{id}/complete-strip (STRIP_SOLVENT entry)"
    algorithm: aggregation
    formula: |
      stripped_parts = parts_to_rework − scrapped_quantity
      voc_kg = round_half_up(stripped_parts × STRIP_SOLVENT_L_PER_PART × STRIP_SOLVENT_VOC_G_PER_L / 1000, 3)
    input_set: "the ReworkOrder's parts_to_rework and the request's scrapped_quantity"
    constants:
      STRIP_SOLVENT_L_PER_PART: 0.5
      STRIP_SOLVENT_VOC_G_PER_L: 900
    precision: "3 decimal places, round_half_up"

  - name: rework_charge
    trigger: "POST /ecoat/rework-orders/{id}/approve (strip part) and POST /ecoat/rework-orders/{id}/complete-strip (repaint part)"
    algorithm: tiered_pricing
    formula: |
      strip_cost_cents    = STRIP_BASE_CENTS + STRIP_PER_PART_CENTS × parts_to_rework
      repaint_per_part    = round_half_up(spec.area_dm2_per_part × REPAINT_RATE_CENTS_PER_DM2 × REWORK_MULTIPLIER)
      repaint_charge_cents = repaint_per_part × (parts_to_rework − scrapped_quantity)
      total_charge_cents  = strip_cost_cents + repaint_charge_cents
      ROUNDING ORDER PINNED: the per-part repaint amount is rounded to whole cents FIRST
      (round_half_up), THEN multiplied by the repainted part count. The alternative order
      (multiply raw value by count, then round) yields different cents and is NOT used.
    input_set: "the ReworkOrder, its lot's spec.area_dm2_per_part, scrapped_quantity"
    constants:
      STRIP_BASE_CENTS: 25000
      STRIP_PER_PART_CENTS: 300
      REPAINT_RATE_CENTS_PER_DM2: 85
      REWORK_MULTIPLIER: 1.33
    precision: "integer cents, round_half_up at the pinned step"

  - name: base_charge
    trigger: "POST /ecoat/lots/{id}/accept"
    algorithm: aggregation
    formula: |
      base_charge_cents = part_quantity × round_half_up(spec.area_dm2_per_part × BASE_COAT_RATE_CENTS_PER_DM2)
    constants:
      BASE_COAT_RATE_CENTS_PER_DM2: 110
    precision: "integer cents, round_half_up per part then multiply (same pinned order as rework_charge)"

  - name: lot_charge_finalization
    trigger: "POST /ecoat/lots/{id}/release"
    algorithm: aggregation
    formula: |
      total_charge_cents = base_charge_cents + purge_alloc_cents + rework_charge_cents
      passed_quantity    = part_quantity − scrapped_quantity
      INVARIANT (part accountability): part_quantity == passed_quantity + scrapped_quantity + outstanding_quantity
      at all times; a full rework cycle (strip + repaint + release) conserves the accounted part total.
    input_set: "the lot's own charge accumulators"
    precision: "integer cents"

  - name: run_slot_overlap
    trigger: "POST /ecoat/run-slots"
    algorithm: interval_merge
    formula: |
      Two slots on the same PaintLine in status SCHEDULED or RUNNING conflict iff
        existing.start_utc < new.end_utc AND new.start_utc < existing.end_utc
      HALF-OPEN semantics: [start_utc, end_utc) — back-to-back adjacency
      (existing.end_utc == new.start_utc) is ALLOWED.
    input_set: "non-terminal RunSlots of the same line"

  - name: color_change_window_conflict
    trigger: "POST /ecoat/color-changes"
    algorithm: interval_merge
    formula: |
      A RunSlot in status SCHEDULED or RUNNING on the same line conflicts iff
        slot.start_utc < window_end_utc + PURGE_BUFFER_MIN AND slot.end_utc > window_start_utc
      BUFFERED semantics: unlike run_slot_overlap, a slot starting within 30 minutes AFTER
      window_end_utc still conflicts (purge/cure-down buffer).
    input_set: "non-terminal RunSlots of the same line; the requested changeover window"

  - name: oven_capacity_check
    trigger: "POST /ecoat/oven-cycles"
    algorithm: interval_merge
    formula: |
      overlap(existing, new) = existing.entered_at <= new.exited_at AND existing.exited_at >= new.entered_at
      CLOSED-interval semantics: touching endpoints (exited_at == entered_at) COUNT as overlapping.
      reject ERR_OVEN_CAPACITY_FULL iff count(existing overlapping cycles on this oven) + 1 > oven.max_loads
      AGGREGATE-capacity semantics: overlaps are allowed up to max_loads (not pairwise-exclusive).
    input_set: "all OvenCycles of the referenced oven"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "acting role is listed in the endpoint's roles; segregation-of-duties: the releasing QualityManager's X-User-ID must differ from every QualityTest.recorded_by_user_id of the lot in the current cure epoch"
    error_id: "ERR_FORBIDDEN / ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "all endpoints; SoD specifically POST /ecoat/lots/{id}/release"

  - priority: 3
    category: existence
    check: "request body is well-formed: required fields present, enums valid, numbers in domain range (e.g. part_quantity > 0, end_utc > start_utc, measured_conc_gpl >= 0)"
    error_id: "ERR_INVALID_REQUEST / ERR_MEASUREMENT_INVALID"
    http_status: 400
    applies_to: "all endpoints with a body"

  - priority: 4
    category: existence
    check: "path ids exist, validated left-to-right; body FK ids (customer_id, spec_id, paint_line_id, lot_id, oven_id, stage_id, recheck_of_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource references"

  - priority: 5
    category: existence
    check: "OCC: expected_paint_line_version equals PaintLine.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /ecoat/run-slots"

  - priority: 6
    category: state
    check: "target resources are in a state that allows the operation (lot QUEUED for scheduling, slot SCHEDULED for start/cancel, slot RUNNING for complete, rework order DRAFT/APPROVED, spec ACTIVE at accept, permit period live for close, recheck parent FAIL and childless, no RUNNING slot for set-line-speed)"
    error_id: "ERR_INVALID_STATE / ERR_LOT_NOT_QUEUED / ERR_SPEC_NOT_ACTIVE / ERR_RECHECK_NOT_ALLOWED / ERR_PERMIT_NOT_EXPIRED / ERR_PERMIT_PERIOD_CLOSED / ERR_LINE_BUSY / ERR_TESTS_INCOMPLETE / ERR_CURE_NOT_PASSED"
    http_status: 409
    applies_to: "state-transition and guarded endpoints"

  - priority: 7
    category: business_safety
    check: "chemical safety gate: every PretreatmentStage of the line must be IN_RANGE to schedule a run slot; line posture must be RUNNING to start one"
    error_id: "ERR_STAGE_OUT_OF_RANGE / ERR_LINE_ON_CHEM_HOLD"
    http_status: 409
    applies_to: "POST /ecoat/run-slots, POST /ecoat/run-slots/{id}/start"

  - priority: 8
    category: business_temporal
    check: "interval conflicts: run-slot half-open overlap; color-change buffered-window conflict; oven closed-interval aggregate capacity"
    error_id: "ERR_RUN_SLOT_OVERLAP / ERR_COLOR_CHANGE_CONFLICT / ERR_OVEN_CAPACITY_FULL"
    http_status: 409
    applies_to: "POST /ecoat/run-slots, POST /ecoat/color-changes, POST /ecoat/oven-cycles"

  - priority: 9
    category: business_constraint
    check: "process constraints: predicted film build inside spec window; parts_per_hanger <= hanger_capacity_parts; lot color matches line.current_color_code; rework_count < MAX_REWORK_COUNT; scrapped_quantity within parts_to_rework"
    error_id: "ERR_FILM_BUILD_OUT_OF_WINDOW / ERR_HANGER_DENSITY_EXCEEDED / ERR_COLOR_MISMATCH / ERR_REWORK_LIMIT_EXCEEDED / ERR_PART_ACCOUNT_MISMATCH"
    http_status: 422
    applies_to: "POST /ecoat/run-slots, POST /ecoat/rework-orders/{id}/approve, POST /ecoat/rework-orders/{id}/complete-strip"

  - priority: 10
    category: business_fiscal
    check: "VOC permit: a covering non-CLOSED permit exists; used_kg + reserved_kg + new emission <= cap_kg (equality allowed)"
    error_id: "ERR_NO_ACTIVE_PERMIT / ERR_VOC_CAP_EXCEEDED"
    http_status: 409
    applies_to: "POST /ecoat/run-slots, POST /ecoat/color-changes"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Customer ---
  - method: POST
    path: "/ecoat/customers"
    description: "Create a Customer"
    roles: [PlantAdmin]
    code: 201
    input: [name]
    output: Customer
    side_effects: []

  - method: GET
    path: "/ecoat/customers/{id}"
    description: "Get a Customer"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- CoatingSpec ---
  - method: POST
    path: "/ecoat/coating-specs"
    description: "Create a CoatingSpec (supersedes the ACTIVE spec for the same customer+color)"
    roles: [PlantAdmin]
    code: 201
    input: [customer_id, color_code, film_build_min_um, film_build_max_um, cure_metal_temp_c, cure_minutes_at_temp, adhesion_class_min, impact_joules_min, voc_g_per_l, area_dm2_per_part]
    output: CoatingSpec
    side_effects:
      - "prior ACTIVE spec with same (customer_id, color_code) → SUPERSEDED (version += 1)"

  - method: GET
    path: "/ecoat/coating-specs/{id}"
    description: "Get a CoatingSpec"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: CoatingSpec
    side_effects: []

  - method: GET
    path: "/ecoat/coating-specs"
    description: "List CoatingSpecs, optional filters"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: ["customer_id?", "color_code?"]
    output: CoatingSpec[]
    side_effects: []

  # --- PaintLine ---
  - method: POST
    path: "/ecoat/paint-lines"
    description: "Create a PaintLine"
    roles: [PlantAdmin]
    code: 201
    input: [name, current_color_code, line_speed_fpm, hanger_capacity_parts, allocation_policy]
    output: PaintLine
    side_effects: ["posture = RUNNING, version = 1"]

  - method: GET
    path: "/ecoat/paint-lines/{id}"
    description: "Get a PaintLine"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: PaintLine
    side_effects: []

  - method: POST
    path: "/ecoat/paint-lines/{id}/set-line-speed"
    description: "Change conveyor line speed (rejected while a slot is RUNNING)"
    roles: [LineScheduler]
    code: 200
    input: [line_speed_fpm]
    output: PaintLine
    side_effects: ["increments PaintLine.version by 1"]

  - method: GET
    path: "/ecoat/paint-lines/{id}/pretreatment-stages"
    description: "List the PretreatmentStages of a line (FK reverse lookup)"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: PretreatmentStage[]
    side_effects: []

  # --- CureOven ---
  - method: POST
    path: "/ecoat/cure-ovens"
    description: "Create a CureOven"
    roles: [PlantAdmin]
    code: 201
    input: [name, max_loads]
    output: CureOven
    side_effects: []

  - method: GET
    path: "/ecoat/cure-ovens/{id}"
    description: "Get a CureOven"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: CureOven
    side_effects: []

  # --- PretreatmentStage / titration ---
  - method: POST
    path: "/ecoat/pretreatment-stages"
    description: "Create a PretreatmentStage for a line"
    roles: [PlantAdmin]
    code: 201
    input: [paint_line_id, stage_name, sequence_no, chemical_family, conc_min_gpl, conc_max_gpl]
    output: PretreatmentStage
    side_effects: ["status = IN_RANGE"]

  - method: GET
    path: "/ecoat/pretreatment-stages/{id}"
    description: "Get a PretreatmentStage"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: PretreatmentStage
    side_effects: []

  - method: POST
    path: "/ecoat/pretreatment-stages/{id}/adjustments"
    description: "Record a chemical addition; stage must be OUT_OF_RANGE, moves to ADJUSTING"
    roles: [ProcessChemist]
    code: 200
    input: [chemical_added_kg]
    output: PretreatmentStage
    side_effects: ["stage.status → ADJUSTING"]

  - method: POST
    path: "/ecoat/titration-readings"
    description: "Record a titration reading; flips stage status per range check and cascades line posture"
    roles: [ProcessChemist]
    code: 201
    input: [stage_id, measured_conc_gpl]
    output: TitrationReading
    side_effects:
      - "in_range computed (inclusive bounds)"
      - "stage status transition per state machine; paint_line.posture re-derived (version += 1 on change)"

  - method: GET
    path: "/ecoat/pretreatment-stages/{id}/titration-readings"
    description: "List readings of a stage (FK reverse lookup), ordered by created_at ASC"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: TitrationReading[]
    side_effects: []

  # --- Lot ---
  - method: POST
    path: "/ecoat/lots"
    description: "Book a production Lot"
    roles: [LineScheduler]
    code: 201
    input: [customer_id, spec_id, part_quantity]
    output: Lot
    side_effects: ["status = RECEIVED"]

  - method: GET
    path: "/ecoat/lots/{id}"
    description: "Get a Lot"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/ecoat/lots"
    description: "List Lots with optional filters and pagination, ordered by created_at ASC"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: ["customer_id?", "spec_id?", "status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: POST
    path: "/ecoat/lots/{id}/accept"
    description: "Accept a received lot into the production queue (computes base charge)"
    roles: [LineScheduler]
    code: 200
    input: []
    output: Lot
    side_effects: ["status → QUEUED; base_charge_cents computed"]

  - method: POST
    path: "/ecoat/lots/{id}/cancel"
    description: "Cancel a lot in RECEIVED or QUEUED"
    roles: [LineScheduler]
    code: 200
    input: []
    output: Lot
    side_effects: ["status → CANCELLED"]

  - method: POST
    path: "/ecoat/lots/{id}/release"
    description: "Release a QC-passed lot (segregation of duties enforced)"
    roles: [QualityManager]
    code: 200
    input: []
    output: Lot
    side_effects: ["status → RELEASED; passed_quantity and total_charge_cents finalized"]

  # --- RunSlot ---
  - method: POST
    path: "/ecoat/run-slots"
    description: "Schedule a lot on a line (OCC on the line; film-build, hanger, color, chemistry, overlap and VOC gates)"
    roles: [LineScheduler]
    code: 201
    input: [paint_line_id, lot_id, start_utc, end_utc, parts_per_hanger, expected_paint_line_version]
    output: RunSlot
    side_effects:
      - "increments PaintLine.version by 1"
      - "lot.status → SCHEDULED"
      - "predicted_film_build_um and voc_projected_kg computed; permit.reserved_kg += voc_projected_kg"

  - method: GET
    path: "/ecoat/run-slots/{id}"
    description: "Get a RunSlot"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: RunSlot
    side_effects: []

  - method: GET
    path: "/ecoat/run-slots"
    description: "List RunSlots with optional filters"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: ["paint_line_id?", "lot_id?"]
    output: RunSlot[]
    side_effects: []

  - method: POST
    path: "/ecoat/run-slots/{id}/start"
    description: "Start a scheduled slot (line posture must be RUNNING)"
    roles: [LineScheduler]
    code: 200
    input: []
    output: RunSlot
    side_effects: ["status → RUNNING; lot.status → ON_LINE"]

  - method: POST
    path: "/ecoat/run-slots/{id}/complete"
    description: "Complete a running slot; posts the metered VOC entry and releases the reservation"
    roles: [LineScheduler]
    code: 200
    input: [paint_used_liters]
    output: RunSlot
    side_effects:
      - "status → COMPLETED; lot.status → CURING"
      - "PAINT_USAGE_METERED EmissionEntry; permit.reserved_kg -= voc_projected_kg; permit.used_kg += entry.voc_kg; EXCEEDED check"

  - method: POST
    path: "/ecoat/run-slots/{id}/cancel"
    description: "Cancel a scheduled slot (compensates the VOC reservation)"
    roles: [LineScheduler]
    code: 200
    input: []
    output: RunSlot
    side_effects: ["status → CANCELLED; lot.status → QUEUED; permit.reserved_kg -= voc_projected_kg"]

  # --- OvenCycle ---
  - method: POST
    path: "/ecoat/oven-cycles"
    description: "Record a cure cycle (or a recheck of a failed cycle); computes the verdict and advances the lot"
    roles: [QcInspector]
    code: 201
    input: [lot_id, oven_id, entered_at, exited_at, min_metal_temp_c, minutes_at_or_above_temp, "recheck_of_id?"]
    output: OvenCycle
    side_effects:
      - "verdict computed (inclusive thresholds); oven aggregate capacity enforced (closed intervals)"
      - "PASS: lot CURING → QC_PENDING (or CURE_FAILED → QC_PENDING for a recheck); FAIL: lot CURING → CURE_FAILED"

  - method: GET
    path: "/ecoat/oven-cycles/{id}"
    description: "Get an OvenCycle"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: OvenCycle
    side_effects: []

  - method: GET
    path: "/ecoat/oven-cycles"
    description: "List OvenCycles with optional filters (incl. recheck chain lookup), ordered by created_at ASC"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: ["lot_id?", "oven_id?", "recheck_of_id?"]
    output: OvenCycle[]
    side_effects: []

  # --- QualityTest ---
  - method: POST
    path: "/ecoat/quality-tests"
    description: "Record an adhesion or impact test; FAIL cascades to lot hold + auto rework order"
    roles: [QcInspector]
    code: 201
    input: [lot_id, test_type, measured_value]
    output: QualityTest
    side_effects:
      - "verdict computed vs spec minimum (inclusive)"
      - "FAIL: lot → QC_HOLD; ReworkOrder auto-created in DRAFT (parts_to_rework = lot.outstanding_quantity)"

  - method: GET
    path: "/ecoat/lots/{id}/quality-tests"
    description: "List quality tests of a lot (FK reverse lookup), ordered by created_at ASC"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: QualityTest[]
    side_effects: []

  # --- ReworkOrder ---
  - method: GET
    path: "/ecoat/rework-orders/{id}"
    description: "Get a ReworkOrder"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: ReworkOrder
    side_effects: []

  - method: GET
    path: "/ecoat/lots/{id}/rework-orders"
    description: "List rework orders of a lot (FK reverse lookup), ordered by created_at ASC"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: ReworkOrder[]
    side_effects: []

  - method: POST
    path: "/ecoat/rework-orders/{id}/approve"
    description: "Approve a DRAFT rework order; computes strip cost; lot moves to STRIPPING"
    roles: [QualityManager]
    code: 200
    input: []
    output: ReworkOrder
    side_effects: ["status → APPROVED; strip_cost_cents computed; lot.status → STRIPPING"]

  - method: POST
    path: "/ecoat/rework-orders/{id}/complete-strip"
    description: "Finish stripping; computes repaint charge, scraps parts, posts strip VOC, re-queues or scraps the lot"
    roles: [QualityManager]
    code: 200
    input: [scrapped_quantity]
    output: ReworkOrder
    side_effects:
      - "status → COMPLETED; repaint_charge_cents + total_charge_cents computed (pinned rounding)"
      - "lot.scrapped_quantity += scrapped_quantity; lot.rework_count += 1; lot.rework_charge_cents += total_charge_cents"
      - "lot.status → QUEUED (scrapped < parts_to_rework) or SCRAPPED (scrapped == parts_to_rework)"
      - "STRIP_SOLVENT EmissionEntry; permit.used_kg += entry.voc_kg; EXCEEDED check"

  # --- ColorChange ---
  - method: POST
    path: "/ecoat/color-changes"
    description: "Execute a color changeover: purge cost computed and allocated, purge VOC posted, line color switched"
    roles: [LineScheduler]
    code: 201
    input: [paint_line_id, to_color_code, purge_solvent_liters, window_start_utc, window_end_utc]
    output: ColorChange
    side_effects:
      - "purge_cost_cents + purge_voc_kg computed; allocation per line.allocation_policy to QUEUED lots of the new color"
      - "PURGE_SOLVENT EmissionEntry; permit.used_kg += purge_voc_kg; EXCEEDED check"
      - "paint_line.current_color_code = to_color_code; increments PaintLine.version by 1"

  - method: GET
    path: "/ecoat/color-changes/{id}"
    description: "Get a ColorChange"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: ColorChange
    side_effects: []

  - method: GET
    path: "/ecoat/color-changes"
    description: "List ColorChanges with optional line filter"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: ["paint_line_id?"]
    output: ColorChange[]
    side_effects: []

  # --- VocPermit / EmissionEntry ---
  - method: POST
    path: "/ecoat/voc-permits"
    description: "Register a VOC permit period"
    roles: [PlantAdmin]
    code: 201
    input: [period_start, period_end, cap_kg]
    output: VocPermit
    side_effects: ["status = ACTIVE, used_kg = 0, reserved_kg = 0"]

  - method: GET
    path: "/ecoat/voc-permits/{id}"
    description: "Get a VocPermit"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: VocPermit
    side_effects: []

  - method: POST
    path: "/ecoat/voc-permits/{id}/close"
    description: "Close a permit period: posts the theoretical-vs-metered reconciliation adjustment and settles status"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: VocPermit
    side_effects:
      - "CLOSEOUT_ADJUSTMENT EmissionEntry (theoretical_total − metered_total)"
      - "used_kg recomputed; status → CLOSED (used <= cap) or EXCEEDED (used > cap)"

  - method: GET
    path: "/ecoat/voc-permits/{id}/emission-entries"
    description: "List the emission ledger entries of a permit (FK reverse lookup)"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: EmissionEntry[]
    side_effects: []

  - method: GET
    path: "/ecoat/emission-entries"
    description: "List emission entries with optional filters"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: ["permit_id?", "source_lot_id?", "source_color_change_id?"]
    output: EmissionEntry[]
    side_effects: []

  - method: GET
    path: "/ecoat/emission-entries/{id}"
    description: "Get an EmissionEntry"
    roles: [PlantAdmin, LineScheduler, ProcessChemist, QcInspector, QualityManager]
    code: 200
    input: []
    output: EmissionEntry
    side_effects: []

  # --- Test-driving clock ---
  - method: POST
    path: "/ecoat/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced; used by permit period lookup and close eligibility"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header, or undeclared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Authenticated role is not in the endpoint's allowed roles" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Releasing QualityManager's X-User-ID equals the recorded_by_user_id of a quality test on the lot in the current cure epoch" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, or malformed body (e.g. end_utc <= start_utc, part_quantity <= 0)" }
  - { id: ERR_MEASUREMENT_INVALID, http: 422, condition: "Measured value outside its physical domain (e.g. negative concentration)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist (validated left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_paint_line_version does not match PaintLine.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failed (e.g. cancel a COMPLETED slot, release a lot not in QC_PENDING, adjust a stage not OUT_OF_RANGE, set line speed while a slot is RUNNING)" }
  - { id: ERR_LOT_NOT_QUEUED, http: 409, condition: "Run-slot creation requires the lot in QUEUED status" }
  - { id: ERR_SPEC_NOT_ACTIVE, http: 409, condition: "Lot accept requires an ACTIVE coating spec (SUPERSEDED specs rejected)" }
  - { id: ERR_LINE_BUSY, http: 409, condition: "set-line-speed rejected while a RunSlot is RUNNING on the line" }
  - { id: ERR_STAGE_OUT_OF_RANGE, http: 409, condition: "Scheduling rejected: a pretreatment stage of the line is OUT_OF_RANGE or ADJUSTING" }
  - { id: ERR_LINE_ON_CHEM_HOLD, http: 409, condition: "Run-slot start rejected: line posture is CHEM_HOLD" }
  - { id: ERR_RUN_SLOT_OVERLAP, http: 409, condition: "Half-open window collides with another SCHEDULED/RUNNING slot on the same line" }
  - { id: ERR_COLOR_CHANGE_CONFLICT, http: 409, condition: "Changeover window (+30 min post-buffer) collides with a SCHEDULED/RUNNING slot on the line" }
  - { id: ERR_OVEN_CAPACITY_FULL, http: 409, condition: "Closed-interval overlapping oven cycles would exceed oven.max_loads" }
  - { id: ERR_RECHECK_NOT_ALLOWED, http: 409, condition: "recheck_of_id references a PASS cycle, or a cycle that already has a recheck child" }
  - { id: ERR_FILM_BUILD_OUT_OF_WINDOW, http: 422, condition: "predicted_film_build_um outside the spec's inclusive [min, max] film window" }
  - { id: ERR_HANGER_DENSITY_EXCEEDED, http: 422, condition: "parts_per_hanger exceeds PaintLine.hanger_capacity_parts" }
  - { id: ERR_COLOR_MISMATCH, http: 409, condition: "Lot's spec color differs from the line's current_color_code; a color change is required first" }
  - { id: ERR_REWORK_LIMIT_EXCEEDED, http: 422, condition: "Approve rejected: lot.rework_count has reached MAX_REWORK_COUNT (2)" }
  - { id: ERR_PART_ACCOUNT_MISMATCH, http: 422, condition: "scrapped_quantity out of range [0, parts_to_rework]" }
  - { id: ERR_TESTS_INCOMPLETE, http: 409, condition: "Release rejected: no PASS adhesion and/or impact test recorded after the latest PASS oven cycle" }
  - { id: ERR_CURE_NOT_PASSED, http: 409, condition: "Quality test rejected: lot is not in QC_PENDING (cure profile not passed)" }
  - { id: ERR_NO_ACTIVE_PERMIT, http: 409, condition: "No non-CLOSED VocPermit covers the current logical clock time" }
  - { id: ERR_VOC_CAP_EXCEEDED, http: 409, condition: "used_kg + reserved_kg + new emission would exceed cap_kg (strictly greater; equality allowed)" }
  - { id: ERR_PERMIT_NOT_EXPIRED, http: 409, condition: "Permit close rejected: current logical clock is not past period_end" }
  - { id: ERR_PERMIT_PERIOD_CLOSED, http: 409, condition: "Operation targets a CLOSED permit" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant administrator: master data (customers, specs, lines, ovens, stages), VOC permits and closeout, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /ecoat/customers"
      - "POST /ecoat/coating-specs"
      - "POST /ecoat/paint-lines"
      - "POST /ecoat/cure-ovens"
      - "POST /ecoat/pretreatment-stages"
      - "POST /ecoat/voc-permits"
      - "POST /ecoat/voc-permits/{id}/close"
      - "POST /ecoat/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: LineScheduler
    description: "Production scheduler: books lots, schedules/starts/completes/cancels run slots, sets line speed, executes color changes"
    identity: opaque
    exclusive_operations:
      - "POST /ecoat/lots"
      - "POST /ecoat/lots/{id}/accept"
      - "POST /ecoat/lots/{id}/cancel"
      - "POST /ecoat/run-slots"
      - "POST /ecoat/run-slots/{id}/start"
      - "POST /ecoat/run-slots/{id}/complete"
      - "POST /ecoat/run-slots/{id}/cancel"
      - "POST /ecoat/paint-lines/{id}/set-line-speed"
      - "POST /ecoat/color-changes"
    shared_operations: ["all GET endpoints"]

  - name: ProcessChemist
    description: "Tank chemist: records titration readings and chemical adjustments"
    identity: opaque
    exclusive_operations:
      - "POST /ecoat/titration-readings"
      - "POST /ecoat/pretreatment-stages/{id}/adjustments"
    shared_operations: ["all GET endpoints"]

  - name: QcInspector
    description: "Quality technician: records oven cure cycles (incl. rechecks) and adhesion/impact tests"
    identity: opaque
    exclusive_operations:
      - "POST /ecoat/oven-cycles"
      - "POST /ecoat/quality-tests"
    shared_operations: ["all GET endpoints"]

  - name: QualityManager
    description: "Quality manager: approves/completes rework orders and releases lots; may not release a lot whose tests they recorded (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /ecoat/rework-orders/{id}/approve"
      - "POST /ecoat/rework-orders/{id}/complete-strip"
      - "POST /ecoat/lots/{id}/release"
    shared_operations: ["all GET endpoints"]
