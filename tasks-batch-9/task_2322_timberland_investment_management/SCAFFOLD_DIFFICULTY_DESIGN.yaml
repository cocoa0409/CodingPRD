  - rule_id: boundary_precision_check
    instances:
      - name: available_tons_boundary_allows_exact_4647_12_and_rejects_4647_13
        grounds:
          - "validations[priority=80]"
          - calculations.stand_cruise_volume
          - entities.Stand.fields.available_tons
        distinguishing_aspect: |
          Equality is explicitly allowed by the priority-80 rule, so a request for exactly
          4647.12 tons must succeed and drive available_tons to 0.00, while 4647.13 — one
          hundredth of a ton more — must fail with ERR_INSUFFICIENT_AVAILABLE_TONS / 422.
          Because the rejected call performs no write, Stand.version is unchanged and the
          SAME captured expected_stand_version is still valid for the accepted call, which
          proves the rejection happened at validation time and not at the OCC gate.
