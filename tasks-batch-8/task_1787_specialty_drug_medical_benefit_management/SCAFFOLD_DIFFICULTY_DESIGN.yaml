  - rule_id: cross_entity_state_dependency
    instances:
      - name: claim_gated_by_auth_state
        grounds:
          - state_machines.InfusionClaim.SUBMITTED_to_APPROVED_FOR_PAYMENT
          - validations[priority=5.5]
          - errors[ERR_AUTH_NOT_APPROVED]
        distinguishing_aspect: |
          Entity pair (InfusionClaim -> PriorAuthorization): a claim cannot leave
          SUBMITTED unless its auth is APPROVED; while the auth is merely
          SUBMITTED the claim is rejected, after approval the identical claim
          succeeds.
        test_recipe:
          setup:
            - "Drug (rate 500, unit 10, vial 100, VIAL, sourcing EITHER, max 2000), ASP 500 from 2026-01-01, ACTIVE policy C50, provider"
            - "Auth exists but is still SUBMITTED at first claim attempt"
