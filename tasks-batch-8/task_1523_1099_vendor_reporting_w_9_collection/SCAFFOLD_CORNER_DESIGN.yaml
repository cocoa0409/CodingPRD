            - { call: "POST /tax1099/vendors", payload: { legal_name: "Deact V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "15 Z", address_city: "Boerne", address_state: "TX", address_postal: "78006" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Deact V", submitted_tin: "852852852", submitted_tin_type: "SSN", signature_name: "D" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
