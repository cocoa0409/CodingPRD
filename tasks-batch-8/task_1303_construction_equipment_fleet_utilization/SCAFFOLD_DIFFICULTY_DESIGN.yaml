# =============================================================================
# Task 1303 — Construction Equipment Fleet & Utilization
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rules x >=2 instances = 23 instances. All chains replayed against
# SCAFFOLD.yaml §1.2 / §1.4 / §1.6; every ${var} is bound by an earlier
# captures: line; every numeric assert was computed by executing the §1.3
# formula with round-half-up semantics.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (3 instances, 3 different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: own_vs_rent_variants_diverge_on_mixed_idle_window
        grounds:
          - calculations.own_vs_rent
          - calculations.rental_allocation
          - entities.AssignmentCharge.fields.own_cost_cents
          - entities.AssignmentCharge.fields.rent_cost_cents
          - entities.AssignmentCharge.fields.cheaper_variant
        distinguishing_aspect: |
          Dual-variant divergence on the AssignmentCharge (assignment-cost
          ledger) domain: for the identical chargeable window Mon 2026-08-03..
          Wed 2026-08-05 with one idle day, the OWN variant (usage-sensitive:
          allocated 25000 + 16h*900 wear + 3*4200 fixed = 52000) and the RENT
          variant (usage-insensitive flat: 3*(12000+1500) = 40500) produce
          different costs, and cheaper_variant resolves to RENT.
        test_recipe:
          setup:
            - "Class C1: daily_rate_cents=10000, external_daily_rate_cents=12000, weekend_multiplier_bp=5000, idle_day_multiplier_bp=5000, service_interval_hours=10000"
            - "Project P1 OPEN with equipment_budget_cents=100000000; Equipment E1 OWNED, IDLE, SERVICE_OK"
            - "Assignment A1 [2026-08-03, 2026-08-09) ACTIVE since 2026-08-03; readings: 08-03 8000 milli, 08-04 0 milli (idle), 08-05 8000 milli"
            - "Logical clock at 2026-08-06T09:00:00Z so close_date is 2026-08-06 and the chargeable window is exactly 08-03..08-05 (3 days)"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-320", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-A", name: "Project A", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-1", class_id: "${c1_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e1_id: $.data.id, e1_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e1_id}", project_id: "${p1_id}", start_date: "2026-08-03", end_date: "2026-08-09", expected_equipment_version: "${e1_v}" }
              as: FleetAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /fleet/assignments/${a1_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e1_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e1_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e1_id}/readings"
              payload: { recorded_date: "2026-08-05", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/assignments/${a1_id}/close"
              payload: { close_reason: "COMPLETED" }
              as: FleetAdmin
            - call: "GET /fleet/assignments/${a1_id}/charges"
              as: FleetAdmin
              captures: { ch_alloc: "$.data[0].allocated_cents", ch_own: "$.data[0].own_cost_cents", ch_rent: "$.data[0].rent_cost_cents", ch_cheaper: "$.data[0].cheaper_variant" }
          assert:
            - "AssignmentCharge[0].allocated_cents == 25000 (10000 + idle 5000 + 10000)"
            - "Assignment.${a1_id}.billable_days == 3 and idle_days == 1 and engine_hours_billed_milli == 16000"
            - "AssignmentCharge[0].own_cost_cents == 52000 (25000 + round(16*900)=14400 + 3*4200=12600)"
            - "AssignmentCharge[0].rent_cost_cents == 40500 (3*12000 + 3*1500)"
            - "AssignmentCharge[0].own_cost_cents != AssignmentCharge[0].rent_cost_cents (variants diverge on identical window)"
            - "AssignmentCharge[0].cheaper_variant == RENT"
            - "Project.${p1_id}.billed_total_cents == 25000"

      - name: residual_value_sale_vs_scrap_variants_diverge
        grounds:
          - calculations.residual_value
          - state_machines.Equipment.IDLE_to_DISPOSED
        distinguishing_aspect: |
          Dual-variant divergence on the Equipment (asset disposal) domain:
          two units with identical acquisition_cost_cents=5800000, class
          salvage 100000 / expected_life_hours 480; unit A disposed via SALE
          (STRAIGHT_LINE: age 12 of 24 months -> residual 2950000) vs unit B
          disposed via SCRAP (HOUR_BASED: 120 of 480 hours -> residual
          4375000). Same cost basis, different variants, different residuals.
        test_recipe:
          setup:
            - "Logical clock pinned at 2026-08-01T00:00:00Z"
            - "Class C2: expected_life_hours=480, salvage_value_cents=100000, service_interval_hours=10000 (no auto-WO interference)"
            - "Equipment EA and EB both OWNED, acquisition_cost_cents=5800000, acquisition_date 2025-08-01, useful_life_months=24"
            - "EB has 5 ACCEPTED readings of 24000 milli each (total 120000 milli = 120 engine hours); EA has zero hours"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "DOZ-D6", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 480, salvage_value_cents: 100000 }
              as: FleetAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-A", class_id: "${c2_id}", ownership: "OWNED", acquisition_cost_cents: 5800000, acquisition_date: "2025-08-01", useful_life_months: 24 }
              as: FleetAdmin
              captures: { ea_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-B", class_id: "${c2_id}", ownership: "OWNED", acquisition_cost_cents: 5800000, acquisition_date: "2025-08-01", useful_life_months: 24 }
              as: FleetAdmin
              captures: { eb_id: $.data.id }
            - call: "POST /fleet/equipment/${eb_id}/readings"
              payload: { recorded_date: "2026-07-20", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${eb_id}/readings"
              payload: { recorded_date: "2026-07-21", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${eb_id}/readings"
              payload: { recorded_date: "2026-07-22", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${eb_id}/readings"
              payload: { recorded_date: "2026-07-23", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${eb_id}/readings"
              payload: { recorded_date: "2026-07-24", engine_hours_delta_milli: 24000, fuel_used_milliliters: 12000 }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/equipment/${ea_id}/dispose"
              payload: { disposal_method: "SALE" }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${eb_id}/dispose"
              payload: { disposal_method: "SCRAP" }
              as: FleetAdmin
            - call: "GET /fleet/equipment/${ea_id}"
              as: FleetAdmin
              captures: { ea_residual: $.data.residual_value_cents }
            - call: "GET /fleet/equipment/${eb_id}"
              as: FleetAdmin
              captures: { eb_residual: $.data.residual_value_cents }
          assert:
            - "Equipment.${ea_id}.availability_status == DISPOSED and residual_value_cents == 2950000 (5800000 - round(5700000*12/24)=2850000)"
            - "Equipment.${eb_id}.availability_status == DISPOSED and residual_value_cents == 4375000 (5800000 - round(5700000*120/480)=1425000)"
            - "Equipment.${ea_id}.residual_value_cents != Equipment.${eb_id}.residual_value_cents (STRAIGHT_LINE vs HOUR_BASED diverge on identical cost basis)"
            - "Both residuals >= class salvage_value_cents == 100000 (floor not binding here)"

      - name: utilization_elapsed_vs_billing_diverge_over_suspended_window
        grounds:
          - calculations.utilization_rate
          - entities.Assignment.fields.utilization_elapsed_bp
          - entities.Assignment.fields.utilization_billing_bp
          - state_machines.Assignment.ACTIVE_to_SUSPENDED
          - state_machines.Assignment.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Dual-variant divergence on the Assignment utilization metric domain:
          a window [2026-08-03, 2026-08-10) containing one fully SUSPENDED day
          (2026-08-05) yields utilization_elapsed_bp == 4286 (denominator 7
          calendar days) vs utilization_billing_bp == 5000 (denominator 6
          chargeable days) on the same 24000 milli engine hours.
        test_recipe:
          setup:
            - "Class C3: daily_rate_cents=10000, weekend_multiplier_bp=5000, idle_day_multiplier_bp=5000, service_interval_hours=10000"
            - "Project P3 OPEN, budget 100000000; Equipment E3 OWNED"
            - "Assignment A3 [2026-08-03, 2026-08-10) ACTIVE from 2026-08-03; SUSPENDED 2026-08-04T12:00Z (mark-down) through 2026-08-06T09:00Z (repair complete reactivates it)"
            - "ACCEPTED readings: 08-03 8000, 08-04 4000, 08-06 4000, 08-07 8000, 08-08 0, 08-09 0 (total 24000 milli; explicit zero readings on the two weekend chargeable days)"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-330", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c3_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-C", name: "Project C", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-3", class_id: "${c3_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e3_id: $.data.id, e3_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e3_id}", project_id: "${p3_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e3_v}" }
              as: FleetAdmin
              captures: { a3_id: $.data.id }
            - call: "POST /fleet/assignments/${a3_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e3_id}/readings"
              payload: { recorded_date: "2026-08-03", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e3_id}/readings"
              payload: { recorded_date: "2026-08-04", engine_hours_delta_milli: 4000, fuel_used_milliliters: 2000 }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T12:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e3_id}/mark-down"
              as: FleetAdmin
            - call: "POST /fleet/mechanics"
              payload: { mechanic_code: "MECH-1", name: "Mac One", home_project_id: "${p3_id}" }
              as: FleetAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /fleet/work-orders"
              payload: { equipment_id: "${e3_id}", kind: "REPAIR", notes: "hydraulic leak" }
              as: FleetAdmin
              captures: { w3_id: $.data.id }
            - call: "POST /fleet/work-orders/${w3_id}/dispatch"
              payload: { mechanic_id: "${m1_id}" }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/work-orders/${w3_id}/start"
              as: Mechanic
              as_user_id: "${m1_id}"
            - call: "POST /fleet/work-orders/${w3_id}/complete"
              as: Mechanic
              as_user_id: "${m1_id}"
            - call: "POST /fleet/equipment/${e3_id}/readings"
              payload: { recorded_date: "2026-08-06", engine_hours_delta_milli: 4000, fuel_used_milliliters: 2000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e3_id}/readings"
              payload: { recorded_date: "2026-08-07", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e3_id}/readings"
              payload: { recorded_date: "2026-08-08", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e3_id}/readings"
              payload: { recorded_date: "2026-08-09", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/assignments/${a3_id}/close"
              payload: { close_reason: "COMPLETED" }
              as: FleetAdmin
            - call: "GET /fleet/assignments/${a3_id}"
              as: FleetAdmin
              captures: { a3_elapsed: $.data.utilization_elapsed_bp, a3_billing: $.data.utilization_billing_bp }
          assert:
            - "Assignment.${a3_id}.status == CLOSED"
            - "Assignment.${a3_id}.billable_days == 6 (08-03, 08-04 partial, 08-06 partial, 08-07, 08-08, 08-09; 08-05 fully suspended excluded)"
            - "Assignment.${a3_id}.engine_hours_billed_milli == 24000"
            - "Assignment.${a3_id}.utilization_elapsed_bp == 4286 (round_half_up(24000*10000/(7*8000))) — denominator counts all 7 calendar days incl. suspended 08-05"
            - "Assignment.${a3_id}.utilization_billing_bp == 5000 (24000*10000/(6*8000)) — denominator counts only 6 chargeable days"
            - "utilization_elapsed_bp != utilization_billing_bp (variants diverge because a suspended day exists in the window)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (3 instances across modes (a), (b), (c))
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rental_allocation_weekend_then_idle_multiplier_stacking
        grounds:
          - calculations.rental_allocation
          - entities.AssignmentCharge.fields.allocated_cents
        distinguishing_aspect: |
          Mode (a) combinatorial: >=3 inputs (daily_rate, weekend_multiplier,
          idle_multiplier, per-day telematics) with conditional branches and
          PINNED stacking order. A Saturday that is also idle charges
          round(round(9999*6667/10000)*5000/10000) = round(6666*0.5) = 3333;
          the opposite application order would give round(round(9999*0.5)*0.6667)
          = round(5000*0.6667) = 3334 — the scaffold pins weekend-first.
        test_recipe:
          setup:
            - "Class C4: daily_rate_cents=9999, weekend_multiplier_bp=6667, idle_day_multiplier_bp=5000, service_interval_hours=10000"
            - "Project P4 OPEN budget 100000000; Equipment E4 OWNED; Assignment A4 [2026-08-07(Fri), 2026-08-11) ACTIVE"
            - "Readings: 08-07 8000, 08-08 0 (Sat idle), 08-09 0 (Sun idle), 08-10 8000; clock 2026-08-11 at close"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "GRD-140", daily_rate_cents: 9999, external_daily_rate_cents: 12000, weekend_multiplier_bp: 6667, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c4_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-D", name: "Project D", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-4", class_id: "${c4_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e4_id: $.data.id, e4_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e4_id}", project_id: "${p4_id}", start_date: "2026-08-07", end_date: "2026-08-11", expected_equipment_version: "${e4_v}" }
              as: FleetAdmin
              captures: { a4_id: $.data.id }
            - call: "POST /fleet/assignments/${a4_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e4_id}/readings"
              payload: { recorded_date: "2026-08-07", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e4_id}/readings"
              payload: { recorded_date: "2026-08-08", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e4_id}/readings"
              payload: { recorded_date: "2026-08-09", engine_hours_delta_milli: 0, fuel_used_milliliters: 0 }
              as: FleetAdmin
            - call: "POST /fleet/equipment/${e4_id}/readings"
              payload: { recorded_date: "2026-08-10", engine_hours_delta_milli: 8000, fuel_used_milliliters: 4000 }
              as: FleetAdmin
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T09:00:00Z" }
              as: FleetAdmin
          trigger:
            - call: "POST /fleet/assignments/${a4_id}/close"
              payload: { close_reason: "COMPLETED" }
              as: FleetAdmin
            - call: "GET /fleet/assignments/${a4_id}/charges"
              as: FleetAdmin
              captures: { c4_alloc: "$.data[0].allocated_cents" }
          assert:
            - "Assignment.${a4_id}.billable_days == 4 and idle_days == 2"
            - "AssignmentCharge[0].allocated_cents == 26664 (Fri 9999 + Sat 3333 + Sun 3333 + Mon 9999)"
            - "Saturday/Sunday per-day charge == 3333: weekend multiplier applied FIRST (round(9999*6667/10000)=6666) then idle (round(6666*0.5)=3333); idle-first would yield 3334 and MUST NOT"

      - name: damage_chargeback_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.damage_chargeback
          - state_machines.DamageReport.FILED_to_ASSESSED
          - entities.DamageReport.fields.assessed_charge_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: with abuse_flag=true (multiplier 15000 bp)
          and two 3-cent line items, per-line-then-sum gives
          round(3*1.5)+round(3*1.5) = 5+5 = 10 cents, while the forbidden
          sum-then-round order gives round(6*1.5) = 9 cents — the scaffold pins
          per-line rounding BEFORE summation, so assessed_charge_cents == 10.
        test_recipe:
          setup:
            - "Class C5, Project P5 OPEN budget 100000000, Equipment E5 OWNED ON_RENT at P5 via ACTIVE assignment A5"
            - "DamageReport D5 FILED against E5/P5 with abuse_flag=true and line_items [{desc a, 3}, {desc b, 3}]"
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FleetAdmin
            - call: "POST /fleet/equipment-classes"
              payload: { class_code: "EXC-350", daily_rate_cents: 10000, external_daily_rate_cents: 12000, weekend_multiplier_bp: 5000, idle_day_multiplier_bp: 5000, service_interval_hours: 10000, idle_alert_utilization_bp: 3000, expected_life_hours: 10000, salvage_value_cents: 500000 }
              as: FleetAdmin
              captures: { c5_id: $.data.id }
            - call: "POST /fleet/projects"
              payload: { project_code: "PRJ-E", name: "Project E", equipment_budget_cents: 100000000 }
              as: FleetAdmin
              captures: { p5_id: $.data.id }
            - call: "POST /fleet/equipment"
              payload: { unit_tag: "UNIT-5", class_id: "${c5_id}", ownership: "OWNED", acquisition_cost_cents: 10000000, acquisition_date: "2026-01-01", useful_life_months: 60 }
              as: FleetAdmin
              captures: { e5_id: $.data.id, e5_v: $.data.version }
            - call: "POST /fleet/assignments"
              payload: { equipment_id: "${e5_id}", project_id: "${p5_id}", start_date: "2026-08-03", end_date: "2026-08-10", expected_equipment_version: "${e5_v}" }
              as: FleetAdmin
              captures: { a5_id: $.data.id }
            - call: "POST /fleet/assignments/${a5_id}/activate"
              as: FleetAdmin
            - call: "POST /fleet/damage-reports"
              payload: { equipment_id: "${e5_id}", project_id: "${p5_id}", description: "bucket teeth bent", abuse_flag: true, line_items: [{ description: "tooth A", amount_cents: 3 }, { description: "tooth B", amount_cents: 3 }] }
              as: FleetAdmin
              captures: { d5_id: $.data.id }
          trigger:
            - call: "POST /fleet/damage-reports/${d5_id}/assess"
              as: FleetAdmin
              captures: { d5_assessed: $.data.assessed_charge_cents }
          assert:
            - "DamageReport.${d5_id}.status == ASSESSED"
            - "DamageReport.${d5_id}.assessed_charge_cents == 10 (per-line round_half_up(3*15000/10000)=5 twice, summed AFTER rounding)"
            - "assessed_charge_cents != 9 (the sum-then-round alternative round(6*1.5) is FORBIDDEN by the pinned rounding order)"

      - name: own_vs_rent_pinned_evaluation_order_from_allocation
        grounds:
          - calculations.own_vs_rent
          - calculations.rental_allocation
          - entities.AssignmentCharge.fields.own_cost_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency broken by pinned evaluation
          order: own_cost_cents consumes billable_days / idle_days /
          engine_hours_billed_milli ALREADY computed by rental_allocation
          (step 1), then adds wear and fixed ownership (steps 2-3). Exact
          decomposition: own 60800 == allocated 26000 + wear 20h*900=18000 +
