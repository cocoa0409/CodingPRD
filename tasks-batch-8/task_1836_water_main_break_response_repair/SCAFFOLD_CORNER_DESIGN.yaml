            - "Sample at exactly +20h is accepted with test_outcome PASS (boundary inclusive)"

      - name: correlate_outside_6h_window_rejected
        claim_type: violation_to_error
        grounds: [calculations.correlation_eligibility, "errors[ERR_CORRELATION_WINDOW]"]
        distinguishing_aspect: "Anomaly observed 7 hours before the report's creation falls outside the ±6h correlation window -> ERR_CORRELATION_WINDOW."
        test_recipe:
          setup: ["Segment; anomaly observed 2026-07-31T17:00:00Z; break report created at clock 2026-08-01T00:00:00Z and confirmed"]
          setup_api_calls:
