              payload: { family_code: "FAM-EP", name: "Expired Exposure Platform", launch_date: "2021-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 12000, reserve_cap_cents: 15000000, engineering_estimate_rate_ppm: 4000 }
