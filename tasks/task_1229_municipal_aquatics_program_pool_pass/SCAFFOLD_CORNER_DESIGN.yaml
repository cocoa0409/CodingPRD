  # =========================================================================
  # Section: errors
  # =========================================================================
  - section: errors
    instances:

      - name: err_invalid_state_reachable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "ERR_INVALID_STATE is reachable by attempting an invalid state transition (already covered by admission_enter_twice)."
        excluded_because:
          difficulty_instance: non_linear_state_machine / facility_posture_cycle_open_closed_open
          rationale: "Invalid-state rejection is exercised by admission_enter_twice_returns_invalid_state corner; difficulty cycle instance covers the cycle."

      - name: err_stale_version_reachable
        claim_type: violation_to_error
        grounds:
          - errors[ERR_STALE_VERSION]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_vs_business_safety_banned_enter_on_closed
          rationale: "Stale version covered by occ_stale_version_rental_approve_returns_412 corner instance."

