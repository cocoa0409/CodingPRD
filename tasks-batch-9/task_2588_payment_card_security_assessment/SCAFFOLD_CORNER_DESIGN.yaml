          assert:
            - "All fourteen calls return HTTP 404"
            - "${e_assessor} == ERR_ASSESSOR_NOT_FOUND, ${e_vendor} == ERR_ASV_VENDOR_NOT_FOUND, ${e_engagement} == ERR_ENGAGEMENT_NOT_FOUND, ${e_segment} == ERR_SEGMENT_NOT_FOUND"
            - "${e_component} == ERR_COMPONENT_NOT_FOUND, ${e_plan} == ERR_SAMPLING_PLAN_NOT_FOUND, ${e_requirement} == ERR_REQUIREMENT_NOT_FOUND, ${e_evidence} == ERR_EVIDENCE_NOT_FOUND"
            - "${e_ccw} == ERR_CCW_NOT_FOUND, ${e_remediation} == ERR_REMEDIATION_ITEM_NOT_FOUND, ${e_roc} == ERR_ROC_NOT_FOUND"
            - "${e_cycle} == ERR_SCAN_CYCLE_NOT_FOUND, ${e_finding} == ERR_SCAN_FINDING_NOT_FOUND, ${e_change} == ERR_CHANGE_LOG_ENTRY_NOT_FOUND"
            - "The fourteen error_id values are pairwise distinct"
            - "Every list endpoint still returns total_count 0 for its collection - none of the probes created anything"

      - name: error_body_reference_existence_is_resolved_after_the_path_identifier
        claim_type: ERR_*_NOT_FOUND
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_COMPONENT_NOT_FOUND]
        distinguishing_aspect: "Priority 4 (path ids) runs before priority 5 (body ids): a change-log write that names both an unknown engagement in the path and an unknown component in the body answers ERR_ENGAGEMENT_NOT_FOUND, and only once the path resolves does the body reference surface as ERR_COMPONENT_NOT_FOUND. The same ladder makes an unknown lead_assessor_id answer ERR_ASSESSOR_NOT_FOUND rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "One engagement 'Northwind Retail Inc' exists in SCOPING with lead Dana Reyes and no components."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Northwind Retail Inc", merchant_level: "L1", assessment_year: 2026, acquirer_name: "First Coast Bank", fieldwork_start_date: "2026-08-10", fieldwork_end_date: "2026-08-28", approved_budget_amount: 200000.00, lead_assessor_id: "${lead_id}", qa_reviewer_id: "${qa_id}" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /engagements/ffffffff-ffff-4fff-8fff-ffffffffffff/change-log-entries"
              payload: { change_type: "COMPONENT_ADDED_TO_CDE", description: "A host was joined to the cardholder network.", affects_scope: true, component_id: "ffffffff-ffff-4fff-8fff-ffffffffffff" }
              as: ClientRepresentative
              captures: { err_path_first: $.data.error_id }
            - call: "POST /engagements/${eng_id}/change-log-entries"
              payload: { change_type: "COMPONENT_ADDED_TO_CDE", description: "A host was joined to the cardholder network.", affects_scope: true, component_id: "ffffffff-ffff-4fff-8fff-ffffffffffff" }
              as: ClientRepresentative
              captures: { err_body_second: $.data.error_id }
            - call: "POST /engagements"
              payload: { client_legal_name: "Harbor Fuel Stops LLC", merchant_level: "L1", assessment_year: 2026, acquirer_name: "Second Harbor Bank", fieldwork_start_date: "2026-11-02", fieldwork_end_date: "2026-11-20", approved_budget_amount: 200000.00, lead_assessor_id: "ffffffff-ffff-4fff-8fff-ffffffffffff" }
              as: PlatformAdmin
              captures: { err_body_lead: $.data.error_id }
            - call: "POST /engagements/${eng_id}/network-segments"
              payload: { name: "CDE-CORE", segment_class: "CDE", parent_segment_id: "ffffffff-ffff-4fff-8fff-ffffffffffff" }
              as: LeadAssessor
              as_user_id: "${lead_id}"
              captures: { err_body_parent: $.data.error_id }
          assert:
            - "The first call returns HTTP 404 with ${err_path_first} == ERR_ENGAGEMENT_NOT_FOUND - the unresolvable component in the body is never reached"
            - "The second call returns HTTP 404 with ${err_body_second} == ERR_COMPONENT_NOT_FOUND once the path resolves"
            - "The third call returns HTTP 404 with ${err_body_lead} == ERR_ASSESSOR_NOT_FOUND, and no engagement is created for 'Harbor Fuel Stops LLC'"
            - "The fourth call returns HTTP 404 with ${err_body_parent} == ERR_SEGMENT_NOT_FOUND for the unresolvable parent_segment_id"
            - "GET /change-log-entries?engagement_id=${eng_id} returns total_count 0 and GET /network-segments?engagement_id=${eng_id} returns total_count 0"
            - "GET /engagements returns total_count 1"

      - name: error_natural_key_uniqueness_on_both_create_and_amend
        claim_type: ERR_DUPLICATE_*
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE_ASSESSOR_EMAIL]
          - errors[ERR_DUPLICATE_VENDOR_NAME]
        distinguishing_aspect: "Assessor.email and AsvVendor.name are unique across the whole platform and the rule is declared on the PATCH endpoints as well as the POST ones, so renaming an existing row into a taken value is refused exactly like a duplicate registration - and re-sending a row's own current value is not a collision with itself."
        test_recipe:
          setup:
            - "Assessors Dana Reyes (dana.reyes@qsa.example) and Kim Vance (kim.vance@qsa.example) exist; vendors 'Northstar ASV' and 'Bluewater ASV' exist."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /asv-vendors"
              payload: { name: "Northstar ASV", approval_expires_at: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { vendor_1_id: $.data.id }
            - call: "POST /asv-vendors"
              payload: { name: "Bluewater ASV", approval_expires_at: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { vendor_2_id: $.data.id, vendor_2_v1: $.data.version }
          trigger:
            - call: "POST /assessors"
              payload: { full_name: "Dana R. Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2028-01-31T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { err_dup_email_create: $.data.error_id }
            - call: "PATCH /assessors/${qa_id}"
              payload: { email: "dana.reyes@qsa.example" }
              as: PlatformAdmin
              captures: { err_dup_email_patch: $.data.error_id }
            - call: "POST /asv-vendors"
              payload: { name: "Northstar ASV", approval_expires_at: "2028-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { err_dup_vendor_create: $.data.error_id }
            - call: "PATCH /asv-vendors/${vendor_2_id}"
              payload: { name: "Northstar ASV" }
              as: PlatformAdmin
              captures: { err_dup_vendor_patch: $.data.error_id }
            - call: "PATCH /asv-vendors/${vendor_2_id}"
              payload: { name: "Bluewater ASV", approval_expires_at: "2028-06-30T00:00:00Z" }
              as: PlatformAdmin
              captures: { vendor_2_v2: $.data.version }
          assert:
            - "${err_dup_email_create} == ERR_DUPLICATE_ASSESSOR_EMAIL with HTTP 422, and GET /assessors returns total_count 2"
            - "${err_dup_email_patch} == ERR_DUPLICATE_ASSESSOR_EMAIL; Assessor.${qa_id}.email is still kim.vance@qsa.example and its version is unchanged by the refusal"
            - "${err_dup_vendor_create} == ERR_DUPLICATE_VENDOR_NAME with HTTP 422, and GET /asv-vendors returns total_count 2"
            - "${err_dup_vendor_patch} == ERR_DUPLICATE_VENDOR_NAME; AsvVendor.${vendor_2_id}.name is still 'Bluewater ASV'"
            - "The final PATCH returns HTTP 200 - re-sending the row's own name is not a self-collision - with approval_expires_at == 2028-06-30T00:00:00Z and ${vendor_2_v2} == ${vendor_2_v1} + 1"
            - "AsvVendor.${vendor_1_id} is untouched throughout: name 'Northstar ASV', approval_expires_at 2027-12-31T00:00:00Z"

      - name: error_unapproved_vendor_outranks_the_duplicate_quarter_label
        claim_type: ERR_ASV_NOT_APPROVED
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - errors[ERR_ASV_NOT_APPROVED]
          - errors[ERR_DUPLICATE_QUARTER_LABEL]
        distinguishing_aspect: "One request violates both the referential vendor-approval rule (priority 7) and the duplicate quarter_label constraint (priority 13); the ladder makes ERR_ASV_NOT_APPROVED the answer, and only after the vendor is swapped does the duplicate label surface. The lapsed vendor is lapsed by clock arithmetic alone - its stored approval_status is still APPROVED."
        test_recipe:
          setup:
            - "AsvVendor 'Northstar ASV' has approval_expires_at 2027-12-31T00:00:00Z, so effective_approval is APPROVED at the 2026-08-01 clock."
            - "AsvVendor 'Lapsed Scan Co' has approval_expires_at 2026-07-01T00:00:00Z, so effective_approval is EXPIRED at the same clock while approval_status is still APPROVED."
            - "Engagement 'Northwind Retail Inc' already holds ScanCycle '2026-Q3' with window_start 2026-07-01T00:00:00Z (window_end 2026-09-29T00:00:00Z)."
          setup_api_calls:
            - call: "POST /assessors"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: false }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
            - call: "POST /assessors"
              payload: { full_name: "Kim Vance", email: "kim.vance@qsa.example", certification_expires_at: "2027-06-30T00:00:00Z", qa_qualified: true }
              as: PlatformAdmin
              captures: { qa_id: $.data.id }
            - call: "POST /engagements"
