        distinguishing_aspect: "LIBRARY variant: 3000 sqft * 450 = 1,350,000 is below the 2,500,000 floor, so the floor binds — cap 2,500,000, while a 1000-student school exceeds the floor at 16,700,000."
        test_recipe:
          setup: ["FY2027; library applicant urban 3000 sqft with direct snapshot 300/1000"]
          setup_api_calls:
            - call: "POST /erate/funding-cycles"
              payload: { label: "FY2027", window_open_date: "2026-10-01", window_close_date: "2027-03-31", service_delivery_deadline: "2027-06-30" }
              as: ProgramAdmin
              captures: { cyc: $.data.id }
            - call: "POST /erate/applicants"
              payload: { name: "Carnegie Public Library", entity_type: "LIBRARY", urban_rural: "URBAN", square_feet: 3000 }
              as: ProgramAdmin
              captures: { lib: $.data.id }
            - call: "POST /erate/nslp-snapshots"
              payload: { applicant_id: "${lib}", funding_cycle_id: "${cyc}", total_students: 1000, free_lunch_eligible_students: 300, cep_participating: false }
              as: ProgramAdmin
          trigger:
            - call: "GET /erate/applicants/${lib}/budget-summary"
              payload: { funding_cycle_id: "${cyc}" }
              as: Any
              captures: { cap: $.data.c2_cap_cents, avail: $.data.c2_available_cents, r2: $.data.discount_rate_c2_pct }
          assert:
            - "cap == 2500000 (floor binds over 450 * 3000 = 1,350,000)"
            - "avail == 2500000 with zero committed"
            - "r2 == 50 (share 30.00, band [20,35) C2_URBAN)"

