          Pair {state (P4) vs business_constraint capacity (P12)}: a placement into a SUSPENDED
          full home violates both ERR_HOME_NOT_LICENSED/ERR_INVALID_STATE-class and ERR_NO_BEDS;
          the higher-priority licensing/state check (P6 ERR_HOME_NOT_LICENSED) wins over capacity.
