            - "${email_after} == new@patch.example, ${limit_after_email} == 500000, ${phone_after_email} == +1-202-555-0132"
            - "${v_after_email} == 2"
            - "${limit_after_limit} == 750000 and ${email_after_limit} == new@patch.example"
            - "${v_after_limit} == 3"
            - "Subscriber.${sub_id}.legal_name == Corner Patch Ltd and account_status == ACTIVE and outstanding_balance_cents == 0"

