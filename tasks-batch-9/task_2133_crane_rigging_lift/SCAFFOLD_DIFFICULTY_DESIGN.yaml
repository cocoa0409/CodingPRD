        distinguishing_aspect: |
          LiftPlan carries two independent state dimensions AND a cycle inside one of them:
          field_status walks LIFTING -> WIND_HOLD -> LIFTING -> WIND_HOLD -> LIFTING twice
          while plan_status never leaves RELEASED, proving the dimensions evolve independently
          rather than as one combined pipeline.
