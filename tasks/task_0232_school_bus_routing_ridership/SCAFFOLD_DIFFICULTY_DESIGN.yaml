              captures: { rep_id: $.data.id, rep_status: $.data.status }
          assert:
            - "Response status == 201"
            - "MissedBusReport.${rep_id}.status == OPEN (filed AT deadline 07:20:00Z is inside the inclusive window)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: start_boarding_requires_active_driver_assignment
        grounds:
          - state_machines.BusTrip.SCHEDULED_to_BOARDING
          - entities.DriverAssignment.fields.status
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair BusTrip -> DriverAssignment: a BusTrip may only move SCHEDULED->
          BOARDING when ITS DriverAssignment.status == ACTIVE. A trip whose assignment
          was SUPERSEDED by a substitute is rejected with ERR_ASSIGNMENT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "District + Route OPEN + stop; PRIMARY assignment P (ACTIVE) gets superseded by a SUBSTITUTE; a SCHEDULED trip pinned to the now-SUPERSEDED primary."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Primary Drv" }
              as: TransportAdmin
              captures: { drv_p: $.data.id }
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Sub Drv", is_substitute: true }
              as: TransportAdmin
              captures: { drv_s: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_p}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_p: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_p}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "GET /routes/${r_id}"
              as: TransportAdmin
              captures: { r_v1: $.data.version }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_s}", role: "SUBSTITUTE", replaces_assignment_id: "${asg_p}", expected_route_version: "${r_v1}" }
              as: TransportAdmin
              captures: { asg_s: $.data.id }
          trigger:
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_p}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_ASSIGNMENT_NOT_ACTIVE (asg_p was SUPERSEDED by the substitute)"
            - "DriverAssignment.${asg_p}.status == SUPERSEDED"

      - name: tap_requires_approved_application_on_route
        grounds:
          - validations[priority=13]
          - entities.RidershipApplication.fields.status
          - entities.RidershipApplication.fields.assigned_route_id
          - state_machines.BusTrip.SCHEDULED_to_BOARDING
        distinguishing_aspect: |
          A DIFFERENT entity pair TapEvent -> RidershipApplication: a tap is rejected
          unless the tapped Student has an APPROVED RidershipApplication whose
          assigned_route_id is this trip's Route. A student with only a SUBMITTED (not
          APPROVED) application is rejected with ERR_NOT_ASSIGNED_RIDER.
        test_recipe:
          setup:
            - "District + Route OPEN + Driver PRIMARY ACTIVE + stop; a BOARDING trip; a student with rfid RF-X who has only a SUBMITTED (un-approved) application on the route."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop_id: $.data.id }
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Unapproved", grade: 5, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-X" }
              as: TransportAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", requested_route_id: "${r_id}", requested_stop_id: "${stop_id}" }
              as: TransportAdmin
              captures: { app_id: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /bus-trips/${trip_id}/taps"
              payload: { rfid_uid: "RF-X", direction: "TAP_ON", stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_NOT_ASSIGNED_RIDER (application is SUBMITTED, not APPROVED)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: driver_double_booked_in_flight_overlap
        grounds:
          - validations[priority=10.5]
          - state_machines.BusTrip.SCHEDULED_to_BOARDING
          - entities.Driver.fields.status
        distinguishing_aspect: |
          Resource = Driver, interval semantics = point-capacity-1 over the 'in-flight'
          status window: a Driver may run at most ONE BOARDING/IN_TRANSIT trip at a time.
          Starting a second trip for the same driver while the first is still in-flight is
          rejected with ERR_DRIVER_DOUBLE_BOOKED. (Contrast: instance 2 is a 1-D timeline
          ordering rule, not a point-capacity rule.)
        test_recipe:
          setup:
            - "District + two Routes each OPEN with a stop; ONE driver holds a PRIMARY ACTIVE assignment on EACH route; both routes have a SCHEDULED trip; the first trip is already BOARDING (driver in-flight)."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "RA", seat_capacity: 20 }
              as: TransportAdmin
              captures: { ra_id: $.data.id, ra_v0: $.data.version }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "RB", seat_capacity: 20 }
              as: TransportAdmin
              captures: { rb_id: $.data.id, rb_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${ra_id}", label: "A1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /stops"
              payload: { route_id: "${rb_id}", label: "B1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Busy Drv" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${ra_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${ra_v0}" }
              as: TransportAdmin
              captures: { asg_a: $.data.id }
            - call: "POST /routes/${rb_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${rb_v0}" }
              as: TransportAdmin
              captures: { asg_b: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${ra_id}", driver_assignment_id: "${asg_a}" }
              as: TransportAdmin
              captures: { trip_a: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${rb_id}", driver_assignment_id: "${asg_b}" }
              as: TransportAdmin
              captures: { trip_b: $.data.id }
            - call: "POST /bus-trips/${trip_a}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /bus-trips/${trip_b}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_DRIVER_DOUBLE_BOOKED (trip_a is in-flight BOARDING)"

      - name: stop_time_order_timeline_inversion
        grounds:
          - validations[priority=6.5]
          - entities.Stop.fields.scheduled_departure
          - entities.Stop.fields.sequence
        distinguishing_aspect: |
          Resource = Route's stop timeline, interval semantics = strictly-increasing 1-D
          ordering (adjacency/inversion), DIFFERENT arithmetic from the driver
          point-capacity rule. Adding a seq-2 stop whose scheduled_departure (06:55Z) is
          earlier than the seq-1 stop (07:00Z) inverts the timeline and is rejected with
          ERR_STOP_TIME_ORDER.
        test_recipe:
          setup:
            - "District + Route OPEN; one existing stop seq1 @ 07:00Z."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20 }
              as: TransportAdmin
              captures: { r_id: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
          trigger:
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S2", lat: 40.01, lng: -75.0, sequence: 2, scheduled_departure: "2026-09-01T06:55:00Z" }
              as: TransportAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 422"
            - "data.error_id == ERR_STOP_TIME_ORDER (seq-2 time 06:55Z precedes seq-1 time 07:00Z)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: tap_on_then_off_conserves_onboard_count
        grounds:
          - calculations.onboard_count_projection
          - entities.BusTrip.fields.onboard_count
          - state_machines.BusTrip.IN_TRANSIT_to_COMPLETED
          - validations[priority=12]
        distinguishing_aspect: |
          Conserved quantity = BusTrip.onboard_count. Forward TAP_ON (+1) paired with the
          compensating TAP_OFF (-1) for the same student leaves onboard_count back at its
          pre-tap value (0), which is the exact invariant complete requires
          (onboard_count == 0). Formula: onboard_count = |{TAP_ON} - {TAP_OFF}| per student.
        test_recipe:
          setup:
            - "District + Route OPEN + Driver PRIMARY ACTIVE + stops seq1/seq2; a BOARDING trip; an APPROVED rider (rfid RF-R) on the route."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0, walk_threshold_miles: 1.5 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
              captures: { stop1: $.data.id }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S2", lat: 40.01, lng: -75.0, sequence: 2, scheduled_departure: "2026-09-01T07:10:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /students"
              payload: { district_id: "${d_id}", parent_id: "par-1", full_name: "Rider", grade: 5, home_lat: 40.05, home_lng: -75.0, rfid_uid: "RF-R" }
              as: TransportAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /ridership-applications"
              payload: { district_id: "${d_id}", student_id: "${stu_id}", requested_route_id: "${r_id}", requested_stop_id: "${stop1}" }
              as: TransportAdmin
              captures: { app_id: $.data.id }
            - call: "POST /ridership-applications/${app_id}/start-review"
              payload: {}
              as: TransportAdmin
            - call: "POST /ridership-applications/${app_id}/approve"
              payload: {}
              as: TransportAdmin
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "POST /bus-trips/${trip_id}/taps"
              payload: { rfid_uid: "RF-R", direction: "TAP_ON", stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
              captures: { onboard_after_on: $.data.bus_trip_id }
            - call: "GET /bus-trips/${trip_id}"
              as: Driver
              as_user_id: "${drv_id}"
              captures: { count_on: $.data.onboard_count }
            - call: "POST /bus-trips/${trip_id}/depart-stop"
              payload: { stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /bus-trips/${trip_id}/taps"
              payload: { rfid_uid: "RF-R", direction: "TAP_OFF", stop_sequence: 2 }
              as: Driver
              as_user_id: "${drv_id}"
            - call: "GET /bus-trips/${trip_id}"
              as: Driver
              as_user_id: "${drv_id}"
              captures: { count_off: $.data.onboard_count }
          assert:
            - "BusTrip.${trip_id}.onboard_count == 1 after TAP_ON"
            - "BusTrip.${trip_id}.onboard_count == 0 after the compensating TAP_OFF (conserved back to pre-tap value)"

      - name: board_then_complete_conserves_driver_availability
        grounds:
          - state_machines.BusTrip.SCHEDULED_to_BOARDING
          - state_machines.BusTrip.IN_TRANSIT_to_COMPLETED
          - entities.Driver.fields.status
        distinguishing_aspect: |
          A DIFFERENT conserved quantity = Driver availability (count of AVAILABLE drivers).
          Forward start-boarding (Driver AVAILABLE->ON_DUTY) paired with the compensating
          complete (Driver ON_DUTY->AVAILABLE) leaves the driver back at AVAILABLE — the
          on-duty count returns to its pre-trip baseline of 0.
        test_recipe:
          setup:
            - "District + Route OPEN + Driver PRIMARY ACTIVE + stops seq1@07:00 seq2@07:10; a SCHEDULED trip. Driver starts AVAILABLE. After start-boarding then depart-stop 1, the trip is IN_TRANSIT with current_stop_sequence==2 (the final stop), so complete is reachable with onboard_count 0 (no taps)."
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D1", school_lat: 40.0, school_lng: -75.0 }
              as: TransportAdmin
              captures: { d_id: $.data.id }
            - call: "POST /routes"
              payload: { district_id: "${d_id}", name: "R1", seat_capacity: 20 }
              as: TransportAdmin
              captures: { r_id: $.data.id, r_v0: $.data.version }
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S1", lat: 40.0, lng: -75.0, sequence: 1, scheduled_departure: "2026-09-01T07:00:00Z" }
              as: TransportAdmin
            - call: "POST /stops"
              payload: { route_id: "${r_id}", label: "S2", lat: 40.01, lng: -75.0, sequence: 2, scheduled_departure: "2026-09-01T07:10:00Z" }
              as: TransportAdmin
            - call: "POST /drivers"
              payload: { district_id: "${d_id}", full_name: "Drv A" }
              as: TransportAdmin
              captures: { drv_id: $.data.id, drv_status0: $.data.status }
            - call: "POST /routes/${r_id}/driver-assignments"
              payload: { driver_id: "${drv_id}", role: "PRIMARY", expected_route_version: "${r_v0}" }
              as: TransportAdmin
              captures: { asg_id: $.data.id }
            - call: "POST /bus-trips"
              payload: { route_id: "${r_id}", driver_assignment_id: "${asg_id}" }
              as: TransportAdmin
              captures: { trip_id: $.data.id }
            - call: "POST /bus-trips/${trip_id}/start-boarding"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "GET /drivers/${drv_id}"
              as: TransportAdmin
              captures: { status_onduty: $.data.status }
            - call: "POST /bus-trips/${trip_id}/depart-stop"
              payload: { stop_sequence: 1 }
              as: Driver
              as_user_id: "${drv_id}"
          trigger:
            - call: "POST /bus-trips/${trip_id}/complete"
              payload: {}
              as: Driver
              as_user_id: "${drv_id}"
            - call: "GET /drivers/${drv_id}"
              as: TransportAdmin
              captures: { status_final: $.data.status }
          assert:
            - "Driver.${drv_id}.status == ON_DUTY after start-boarding"
            - "Driver.${drv_id}.status == AVAILABLE after complete (conserved back to the pre-trip baseline)"
