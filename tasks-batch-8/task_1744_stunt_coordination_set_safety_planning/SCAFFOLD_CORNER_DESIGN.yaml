      - name: cc_occ_budget_amend_stale_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[production-budget-amend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC rule production-budget-amend-stale-version: budget amendments legitimately supersede each other while posture stays SETUP, so only the version check rejects the stale second amendment (412)."
        test_recipe:
          setup: ["fresh production at version 1"]
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "P", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id, prod_v: $.data.version }
          trigger:
            - call: "PATCH /api/productions/${prod_id}/budget"
              payload: { total_budget_cents: 20000000, expected_production_version: "${prod_v}" }
              as: ProductionExecutive
              captures: { bud1: $.data.total_budget_cents }
            - call: "PATCH /api/productions/${prod_id}/budget"
              payload: { total_budget_cents: 30000000, expected_production_version: "${prod_v}" }
              as: ProductionExecutive
              captures: { err: $.data.error_id }
            - call: "GET /api/productions/${prod_id}"
              as: ProductionExecutive
              captures: { bud_final: $.data.total_budget_cents }
          assert:
            - "bud1 == 20000000 (first amendment succeeded and bumped version to 2)"
            - "err == ERR_STALE_VERSION, http 412 on the second amendment carrying the pre-amendment version"
            - "bud_final == 20000000 (rejected amendment changed nothing)"

