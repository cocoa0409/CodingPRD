      - name: corner_missing_role_header_returns_unauthenticated
        claim_type: auth_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1]
        distinguishing_aspect: |
          A request with no X-User-Role / X-User-ID headers, and a request whose X-User-Role is a
          string outside the five declared roles, both return ERR_UNAUTHENTICATED 401 — the
          unknown role is an authentication failure at priority 1, not a 403 at priority 2.
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: "<no identity headers>"
              captures: { x1_err_none: $.data.error_id }
            - call: "POST /publishers"
              payload: { name: "Meridian Academic Press", publisher_code: "MERID", country_code: "NL" }
              as: "<X-User-Role: ProvostOffice, an undeclared role>"
              captures: { x1_err_unknown: $.data.error_id }
          assert:
            - "${x1_err_none} == ERR_UNAUTHENTICATED"
            - "the first response returned HTTP 401"
            - "${x1_err_unknown} == ERR_UNAUTHENTICATED"
            - "the second response returned HTTP 401"
            - "no Publisher row was created"

