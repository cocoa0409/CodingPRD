            - "If a notice had previously been OPEN it would be DISCHARGED (counter reset at the boundary)"

      - name: group_sale_flag_at_exactly_eight_tickets
        grounds:
          - validations[priority=7]
          - entities.TicketOrder.fields.is_group_sale
        distinguishing_aspect: |
          Different metric (ticket count, an integer count boundary) via a
          different endpoint (ticket-order create): at exactly 8 tickets
          is_group_sale MUST be true; at 7 it MUST be false; the boundary is
