              as: Registrar
              captures: { u1_after: "$.data.credit_status" }
          assert:
            - "Before the trigger: Student.${stu_id}.pla_credits_reserved == 0, pla_credits_awarded == 0, pla_credits_posted == 6, pla_upper_division_committed == 6"
            - "Before the trigger: PlaClaim.${claim_u2}.assessment_status == CAP_BLOCKED with hold_reason == UPPER_DIVISION_CAP, and PlaClaim.${claim_p3}.assessment_status == CAP_BLOCKED with hold_reason == PLA_CAP"
            - "PlaClaim.${claim_u1}.credit_status == REVERSED, posted_credits == 0, and assessment_status is still AWARDED with credits_awarded still 6"
            - "Exact restoration: Student.${stu_id}.pla_credits_posted == 0, pla_credits_awarded == 6, pla_upper_division_committed == 0 — byte-for-byte the pre-posting ledger"
            - "Selective unblock: PlaClaim.${claim_u2}.assessment_status == SUBMITTED with hold_reason == null, because upper_division_remaining went from 0 back to 6 and 3 <= 6"
            - "PlaClaim.${claim_p3}.assessment_status is still CAP_BLOCKED with hold_reason == PLA_CAP: the reversal left reserved_inclusive consumption unchanged, and after U2 re-reserves 3 the remaining is 12 - (3 + 6 + 0) == 3 < 9"
            - "Student.${stu_id}.pla_credits_reserved == 3 (from the unblock alone; the reversal itself reserves nothing)"
            - "The four counters still reconcile: pla_credits_reserved + pla_credits_awarded + pla_credits_posted == 3 + 6 + 0 == 9 <= effective_pla_cap_credits 12"
            - "Re-posting ${claim_u1} for term 2027SP returns 200 and rebuilds the posted ledger exactly (posted 6, awarded 0, upper_division_committed 6), while ${claim_u2} STAYS SUBMITTED — the compensation is exact on the ledger but deliberately not symmetric on the sibling claim it released"

      - name: appeal_remand_fixed_refund_leaves_a_600_cent_discount_residue
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_REMANDED
          - state_machines.PlaClaim.fee_status.PARTIALLY_PAID_to_PARTIALLY_PAID
          - calculations.withdrawal_refund_settlement
          - calculations.assessment_fee_invoice_total
          - entities.FeeInvoice.fields.refunded_cents
          - entities.FeeInvoice.fields.recompute_count
          - endpoints[POST /appeals/{appeal_id}/decide]
        distinguishing_aspect: |
          The remand refunds exactly APPEAL_FILING_FEE_CENTS 6000, but removing the
          6000 appeal line also removes the 600 of tier-2 discount that line had
          earned, so the compensation is provably imperfect by exactly 600 cents:
          balance_due_cents lands on 600 and fee_status stays PARTIALLY_PAID. The
          STEP 4 excess sweep must NOT fire (it only absorbs negative balances),
          and refunding "everything the appeal cost the student" (6600) is wrong.
        test_recipe:
          setup:
            - "Program BSCS-APL with pla_max_credits 30 allowing PORTFOLIO; Course CS150 (6 credits, LOWER) with OC1 weight_bp 8000 and OC2 weight_bp 2000, mastery 7000."
            - "FacultyAssessor E-9001 (CS, rank 2, appeal_panel_member false) and E-9002 (CS, rank 3, appeal_panel_member true)."
            - "A PORTFOLIO claim for 6 credits with TWO artifacts: invoice subtotal 30000, discount_bp 1000, total 27000, paid in full."
            - "Rubric OC1 2/4 and OC2 2/4 gives verified_coverage_bp 5000, so the assessor recommendation is FAIL and the coordinator denies the claim."
            - "The student appeals: the 6000 filing-fee line lifts the subtotal to 36000, discount to 3600 and the total to 32400, so 5400 more is paid and the invoice returns to PAID at 32400."
            - "Reviewer E-9002 is assigned (appeal_panel_member, in-department, and absent from prior_scorer_assessor_ids [E-9001])."
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "BSCS-APL", title: "BS Computer Science", total_credits_required: 120, residency_min_credits: 30, pla_max_credits: 30, pla_max_pct_bp: 2500, pla_upper_division_max_credits: 6, allowed_source_types: ["PORTFOLIO"], status: "ACTIVE" }
              as: PlaCoordinator
              captures: { prog_id: "$.data.id" }
            - call: "POST /courses"
              payload: { course_code: "CS150", title: "Intro Programming", department_code: "CS", credits: 6, level: "LOWER", pla_eligible: true, learning_outcomes: [{ outcome_code: "OC1", description: "Design", weight_bp: 8000, mastery_threshold_bp: 7000 }, { outcome_code: "OC2", description: "Test", weight_bp: 2000, mastery_threshold_bp: 7000 }] }
              as: PlaCoordinator
              captures: { course_id: "$.data.id" }
            - call: "GET /learning-outcomes?course_id=${course_id}"
              as: PlaCoordinator
              captures: { oc1_id: "$.data[0].id", oc2_id: "$.data[1].id" }
            - call: "POST /students"
              payload: { student_number: "S-1001", full_name: "Ada Reyes", program_id: "${prog_id}", enrollment_status: "MATRICULATED", transfer_credits_accepted: 0, institutional_credits_earned: 60 }
              as: PlaCoordinator
              captures: { stu_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9001", full_name: "Dr Nia Ford", department_code: "CS", credential_rank: 2, max_concurrent_assignments: 3, appeal_panel_member: false, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr1_id: "$.data.id" }
            - call: "POST /faculty-assessors"
              payload: { employee_number: "E-9002", full_name: "Dr Omar Diaz", department_code: "CS", credential_rank: 3, max_concurrent_assignments: 3, appeal_panel_member: true, status: "ACTIVE" }
              as: PlaCoordinator
              captures: { asr2_id: "$.data.id" }
            - call: "POST /pla-claims"
              payload: { student_id: "${stu_id}", course_id: "${course_id}", source_type: "PORTFOLIO", credits_requested: 6, rush_requested: false }
              as: Student
              as_user_id: "${stu_id}"
              captures: { claim_id: "$.data.id" }
            - call: "POST /portfolios"
              payload: { claim_id: "${claim_id}", narrative: "Eight years of production Python" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Billing service", evidence_uri: "s3://ev/1", outcome_mappings: [{ learning_outcome_id: "${oc1_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/artifacts"
              payload: { artifact_type: "WORK_PRODUCT", title: "Regression suite", evidence_uri: "s3://ev/2", outcome_mappings: [{ learning_outcome_id: "${oc2_id}", alignment: "PRIMARY" }] }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /portfolios/${pf_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_id}/submit"
              as: Student
              as_user_id: "${stu_id}"
            - call: "GET /fee-invoices?claim_id=${claim_id}"
              as: PlaCoordinator
              captures: { inv_id: "$.data[0].id", base_total: "$.data[0].total_cents" }
            - call: "POST /fee-invoices/${inv_id}/payments"
              payload: { amount_cents: 27000, method: "CARD" }
              as: Student
              as_user_id: "${stu_id}"
            - call: "POST /pla-claims/${claim_id}/assessor-assignments"
              payload: { assessor_id: "${asr1_id}" }
              as: PlaCoordinator
              captures: { asg_id: "$.data.id" }
            - call: "POST /assessor-assignments/${asg_id}/accept"
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/rubric-scores"
              payload: { learning_outcome_id: "${oc1_id}", points_awarded: 2, narrative: "Partial" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/rubric-scores"
              payload: { learning_outcome_id: "${oc2_id}", points_awarded: 2, narrative: "Partial" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
            - call: "POST /assessor-assignments/${asg_id}/complete"
              payload: { recommendation: "FAIL" }
              as: FacultyAssessor
              as_user_id: "${asr1_id}"
              captures: { verified_bp: "$.data.verified_coverage_bp" }
            - call: "POST /pla-claims/${claim_id}/deny"
              payload: { denial_reason: "Coverage 5000 bp is below the 7000 bp threshold" }
              as: PlaCoordinator
              captures: { deadline: "$.data.appeal_deadline_at" }
            - call: "POST /appeals"
              payload: { claim_id: "${claim_id}", grounds: "The assessor never opened the test report artifact" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { appeal_id: "$.data.id", prior_scorers: "$.data.prior_scorer_assessor_ids" }
            - call: "GET /fee-invoices/${inv_id}"
              as: PlaCoordinator
              captures: { appeal_total: "$.data.total_cents", appeal_balance: "$.data.balance_due_cents" }
            - call: "POST /fee-invoices/${inv_id}/payments"
              payload: { amount_cents: 5400, method: "CARD" }
              as: Student
              as_user_id: "${stu_id}"
              captures: { paid_after_top_up: "$.data.paid_cents", bal_after_top_up: "$.data.balance_due_cents" }
            - call: "POST /appeals/${appeal_id}/assign-reviewer"
              payload: { reviewer_assessor_id: "${asr2_id}" }
              as: PlaCoordinator
          trigger:
            - call: "POST /appeals/${appeal_id}/decide"
              payload: { decision: "REMANDED", decision_note: "Reassess with the full artifact set" }
              as: AppealReviewer
              as_user_id: "${asr2_id}"
              captures: { appeal_status: "$.data.status" }
          assert:
            - "Before the trigger: FeeInvoice.${inv_id}.subtotal_cents == 36000 (15000 + 15000 + 0 + 6000), discount_bp == 1000, discount_cents == 3600, total_cents == 32400, paid_cents == 32400, refunded_cents == 0, balance_due_cents == 0, and PlaClaim.${claim_id}.fee_status == PAID"
            - "Before the trigger: PlaClaim.${claim_id}.assessment_status == APPEAL_PENDING, appeal_count == 1, appeal_deadline_at == 2026-08-15T00:00:00Z (2026-08-01T00:00:00Z + APPEAL_WINDOW_HOURS 336), and Appeal.${appeal_id}.prior_scorer_assessor_ids == [${asr1_id}]"
            - "Appeal.${appeal_id}.status == REMANDED with decided_at == 2026-08-01T00:00:00Z"
            - "PlaClaim.${claim_id}.assessment_status == UNDER_ASSESSMENT with verified_coverage_bp == null, assessor_recommendation == null, denial_reason == null and appeal_deadline_at == null"
            - "Student.${stu_id}.pla_credits_reserved == 6 (the reservation is re-taken; remaining_reserved_inclusive was 30, so the claim does NOT land in CAP_BLOCKED)"
            - "The appeal line is gone: FeeInvoice.${inv_id}.subtotal_cents == 30000, discount_bp == 1000, discount_cents == 3000, total_cents == 27000"
            - "The refund is the FIXED filing fee: FeeInvoice.${inv_id}.refunded_cents == 6000, not 6600 and not 5400"
            - "The residue is exactly the discount the appeal line earned: balance_due_cents == 27000 - 0 - (32400 - 6000) == 600, which equals discount_cents 3600 - 3000"
            - "PlaClaim.${claim_id}.fee_status == PARTIALLY_PAID — it does NOT return to PAID, because paid_cents - refunded_cents (26400) < total_cents (27000)"
            - "STEP 4 of the fee calculation did not fire: the balance is positive, so no extra cents were swept into refunded_cents"
            - "FeeInvoice.${inv_id}.recompute_count increased by 1 for the remand recompute"
            - "A fresh AUTO_REPLACEMENT AssessorAssignment exists for ${claim_id} whose assessor_id is NOT ${asr1_id} (the prior scorer is permanently excluded from the claim)"
            - "Paying the remaining 600 returns PlaClaim.${claim_id}.fee_status to PAID with FeeInvoice.${inv_id}.balance_due_cents 0"
