            - call: "POST /cases"
              payload: { allegation_type: "UNLICENSED_PRACTICE", complainant_name: "Anonymous Tip Line", received_on: "2026-07-01T00:00:00Z", unlicensed_respondent_name: "Vic Marlow" }
