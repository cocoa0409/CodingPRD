      - name: every_code_triggerable_labor_ceiling_and_ticket_state_codes
        claim_type: every_code_triggerable
        grounds:
          - errors.ERR_LABOR_HOURS_EXCEED_LIMIT
          - errors.ERR_TICKET_INVALID_STATE
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / ticket_state_gate_outranks_labor_hour_ceiling_on_resolve"
          rationale: "That §1.8 instance already fires both codes from one request pair - a resolve on a PARTS_HOLD ticket carrying 9 labor hours returns ERR_TICKET_INVALID_STATE, and the same 9 hours on an ONSITE ticket returns ERR_LABOR_HOURS_EXCEED_LIMIT - so each code is proven triggerable there."

      - name: every_code_triggerable_dispatch_certification_and_region_codes
        claim_type: every_code_triggerable
        grounds:
          - errors.ERR_TECHNICIAN_NOT_CERTIFIED
          - errors.ERR_TECHNICIAN_REGION_MISMATCH
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / critical_certification_gate_outranks_region_mismatch_on_dispatch"
          rationale: "Both dispatch codes are already triggered there: an L1 out-of-region technician on a CRITICAL ticket returns ERR_TECHNICIAN_NOT_CERTIFIED, and an L3 out-of-region technician returns ERR_TECHNICIAN_REGION_MISMATCH."

      - name: every_code_triggerable_read_containment_and_interval_overlap_codes
        claim_type: every_code_triggerable
        grounds:
          - errors.ERR_READ_OUTSIDE_PERIOD
          - errors.ERR_READ_INTERVAL_OVERLAP
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / read_period_containment_outranks_coverage_interval_overlap"
          rationale: "That instance submits one read that violates both containment and overlap (returns ERR_READ_OUTSIDE_PERIOD) and a second that violates only overlap (returns ERR_READ_INTERVAL_OVERLAP), covering both codes."

      - name: every_code_triggerable_secure_release_and_meterability_codes
        claim_type: every_code_triggerable
        grounds:
          - errors.ERR_SECURE_RELEASE_NOT_CONFIGURED
          - errors.ERR_DEVICE_NOT_METERABLE
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / device_activation_gated_on_site_secure_release_state"
          rationale: "Activation of a NETWORKED device at an unreleased site returns ERR_SECURE_RELEASE_NOT_CONFIGURED there, and the meter read taken against that still-NETWORKED device returns ERR_DEVICE_NOT_METERABLE, so both codes are proven triggerable."

      - name: every_code_triggerable_open_exception_backlog_code
        claim_type: every_code_triggerable
        grounds:
          - errors.ERR_PERIOD_HAS_OPEN_EXCEPTIONS
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / period_close_gated_on_meter_read_exception_backlog"
          rationale: "The close attempt while one swept device still carries an EXCEPTION read returns ERR_PERIOD_HAS_OPEN_EXCEPTIONS there, and the same close succeeds once the exception is resolved."

      - name: every_code_triggerable_dispatch_window_conflict_code
        claim_type: every_code_triggerable
        grounds:
          - errors.ERR_DISPATCH_WINDOW_CONFLICT
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / technician_dispatch_windows_conflict_after_travel_buffer_inflation"
          rationale: "The second dispatch to the same technician inside the travel-buffer-inflated window returns ERR_DISPATCH_WINDOW_CONFLICT there, with the adjacent-but-clear window accepted in the same recipe."

