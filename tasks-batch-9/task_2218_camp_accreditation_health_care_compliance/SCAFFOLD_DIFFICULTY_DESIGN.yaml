  - rule_id: transitive_cascade
    instances:

      - name: finalize_scoring_cascade_freezes_camp_and_rejects_verified_self_assessment
        grounds:
          - endpoints.POST_/accreditation/visits/{visitId}/finalize-scoring
          - calculations.deficiency_penalty_and_deadline
          - calculations.camp_compliance_posture
          - state_machines.WrittenPlan.VERIFIED_to_REVALIDATION_REQUIRED
          - state_machines.StandardEvaluation.VERIFIED_to_REJECTED
          - entities.Camp.fields.health_intake_status
          - calculations.camp_risk_index
        distinguishing_aspect: |
          A five-hop chain that starts at a visit and ends inside a document the visit
          never names: visit SCORED -> Deficiency rows created -> camp
          penalty_point_balance 20 -> compliance_posture FROZEN plus
          health_intake_status SUSPENDED -> the VERIFIED HEALTH_CARE WrittenPlan
          knocked to REVALIDATION_REQUIRED -> the StandardEvaluation citing that plan
          knocked from VERIFIED to REJECTED. Hop 5 lands on the self axis of a row
          whose visit axis the same call locked, and the deficiencies that caused it
          were raised on two entirely different standards.
