      - name: payment_void_conserves_erosion_and_reserve_across_a_multi_part_claim
        grounds:
          - calculations.coverage_erosion_reconciliation
          - state_machines.LossPayment.ISSUED_to_VOIDED
          - entities.CoveragePart.fields.available_cents
          - entities.Claim.fields.outstanding_reserve_cents
          - validations[priority=38].ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          A different conserved quantity from the ledger instance: the erosion identity
          policy.eroded_total_cents == sum(CoveragePart.eroded_cents) == sum(ISSUED
          LossPayment.amount_cents) == claim.paid_cents, plus the per-part identity
          available_cents + eroded_cents == sublimit_cents and the claim identity
          total_incurred_cents == indemnity_cents. Two payments land on two different coverage
          parts and only the second is voided, so the compensation must unwind exactly one part
          while leaving the other eroded - a whole-claim reset would pass a single-payment test but
          fails here. The VOIDED row is retained and contributes 0.
        test_recipe:
          setup:
            - "FX-A policy IN_FORCE with MATERIALS_ON_SITE 1000000000, IN_TRANSIT 200000000 and SOFT_COST 300000000 parts."
            - "Claim CR adjusted on RECONSTRUCTION_COST with continuing_pm_weeks 6 over MATERIALS_ON_SITE 45678920 and IN_TRANSIT 12345670: covered bases 49333234 and 13333324, pm 563999 on a synthetic SOFT_COST line, the 10000000 occurrence deductible landing on the largest line, so allocations are 39333234 / 13333324 / 563999 and indemnity is 53230557."
            - "Payment P1 of 39333234 against MATERIALS_ON_SITE and payment P2 of 563999 against SOFT_COST, both ISSUED by ca-001."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Harborline Logistics Center", site_address: "410 Dock Rd, Newport", construction_type: "NON_COMBUSTIBLE", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 2000000000, cat_zone: "WIND_TIER_2", planned_start_date: "2026-09-01T00:00:00Z", projected_completion_date: "2027-06-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { p1: $.data.id }
            - call: "POST /builders-risk/projects/${p1}/screen"
              payload: { engineering_grade: "B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { p1v: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${p1}", expected_project_version: "${p1v}", term_start_date: "2026-09-01T00:00:00Z", term_end_date: "2027-06-30T00:00:00Z", includes_existing_structure: false, deductible_tier: "ELEVATED_100K", limit_cents: 2500000000, daily_delay_rate_cents: 1200000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pl1: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "MATERIALS_ON_SITE", sublimit_cents: 1000000000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp_mos: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "IN_TRANSIT", sublimit_cents: 200000000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp_it: $.data.id }
            - call: "POST /builders-risk/coverage-parts"
              payload: { policy_id: "${pl1}", part_type: "SOFT_COST", sublimit_cents: 300000000 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { cp_soft: $.data.id }
            - call: "POST /builders-risk/named-insured-interests"
              payload: { policy_id: "${pl1}", party_name: "Harborline Owner LLC", party_role: "OWNER", insurable_interest_pct: 100, loss_payee_priority: 1 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { int1: $.data.id }
            - call: "POST /builders-risk/named-insured-interests/${int1}/acknowledge"
              payload: {}
              as: LossPayee
              as_user_id: "${int1}"
            - call: "POST /builders-risk/policies/${pl1}/quote"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/bind"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/policies/${pl1}/incept"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /builders-risk/claims"
              payload: { policy_id: "${pl1}", peril: "FIRE", loss_date: "2027-01-18T00:00:00Z", description: "Fire across staged materials and an inbound shipment" }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { cr: $.data.id }
            - call: "POST /builders-risk/claims/${cr}/adjust"
              payload: { outcome: "ADJUST", adjustment_basis: "RECONSTRUCTION_COST", continuing_pm_weeks: 6, loss_items: [{ part_type: "MATERIALS_ON_SITE", gross_loss_cents: 45678920 }, { part_type: "IN_TRANSIT", gross_loss_cents: 12345670 }] }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { ind_cr: $.data.indemnity_cents, crv: $.data.version }
            - call: "POST /builders-risk/loss-payments"
              payload: { claim_id: "${cr}", expected_claim_version: "${crv}", payee_interest_id: "${int1}", part_type: "MATERIALS_ON_SITE", amount_cents: 39333234 }
              as: ClaimAdjuster
              as_user_id: "ca-001"
              captures: { pay1: $.data.id }
            - call: "GET /builders-risk/claims/${cr}"
              payload: {}
