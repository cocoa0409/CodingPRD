# =============================================================================
# §1.9 Scaffold Corner Design — Film & TV Tax Incentive Application
# Breadth coverage: every testable claim of §1.1–§1.7 not already covered by
# §1.8. Claims covered by a difficulty instance are emitted as
# excluded_because stubs. All chains replay from empty-DB; default logical
# clock is 2026-08-01T00:00:00Z (inside the standard GA window).
# =============================================================================
scaffold_corner_design:
  # ------------------------------------------------------------- entities ---
  - section: entities
    instances:
      - name: program_create_applies_system_defaults
        claim_type: creation
        grounds:
          - "entities.JurisdictionProgram.fields.status"
          - "entities.JurisdictionProgram.fields.allocated_credit_cents"
          - "entities.JurisdictionProgram.fields.remaining_cap_cents"
        distinguishing_aspect: "A freshly created program is DRAFT with allocated_credit_cents == 0, remaining_cap_cents == annual_cap_cents, and version == 1, regardless of request content."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { st: $.data.status, alloc: $.data.allocated_credit_cents, rem: $.data.remaining_cap_cents, ver: $.data.version } }
          assert:
            - "HTTP 201; status == DRAFT; allocated_credit_cents == 0; remaining_cap_cents == 100000000; version == 1; id is a UUID"
      - name: production_create_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Production.fields.production_type"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "production_type outside {FEATURE, SERIES, DOCUMENTARY, COMMERCIAL} is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["production company registered"]
          setup_api_calls:
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
          trigger:
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Blockbuster", production_type: "BLOCKBUSTER", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400); no production persisted (GET /api/productions?production_company_id=${co_id} returns empty array)"
      - name: spend_entry_default_is_resident_labor_false
        claim_type: defaults
        grounds:
          - "entities.SpendEntry.fields.is_resident_labor"
        distinguishing_aspect: "Omitting is_resident_labor defaults it to false, so a BTL entry of 100000000 qualifies with effective_amount_cents == 100000000 (no uplift)."
        test_recipe:
          setup: ["GA program OPEN; application APPROVED; vendor VERIFIED"]
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_id}/claim-review", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/applications/${app_id}/approve", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-2" }
            - { call: "POST /api/vendors", payload: { production_id: "${prod_id}", legal_name: "Savannah Grip & Electric", tax_id: "47-2201988", residency_jurisdiction: "GA" }, as: Producer, as_user_id: "${co_id}", captures: { vend_id: $.data.id } }
            - { call: "POST /api/vendors/${vend_id}/review-residency", payload: { decision: "VERIFIED" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
          trigger:
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-D-001", category: "BTL", spend_date: "2026-10-05T00:00:00Z", amount_cents: 100000000 }, as: Producer, as_user_id: "${co_id}", captures: { e_id: $.data.id, flag: $.data.is_resident_labor } }
            - { call: "POST /api/spend-entries/${e_id}/review", payload: { decision: "QUALIFY" }, as: FilmOfficeReviewer, as_user_id: "reviewer-1", captures: { eff: $.data.effective_amount_cents } }
          assert:
            - "Create response: is_resident_labor == false (default applied)"
            - "After QUALIFY: effective_amount_cents == 100000000 (no resident uplift when the flag defaulted false)"
      - name: spend_entry_missing_required_amount_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.SpendEntry.fields.amount_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Omitting required field amount_cents on spend-entry create yields ERR_INVALID_REQUEST (400) before any stateful evaluation."
        test_recipe:
          setup: ["GA program OPEN; application APPROVED; vendor VERIFIED"]
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", external_invoice_ref: "INV-X-001", category: "BTL", spend_date: "2026-10-05T00:00:00Z" }, as: Producer, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400) — missing amount_cents surfaces as a shape error, not a 404/409"
      - name: get_application_not_found_returns_404
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET on a well-formed but nonexistent application UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: FilmOfficeAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"
      - name: list_applications_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
          - "endpoints[GET /api/applications]"
        distinguishing_aspect: "With 2 applications and limit=1, page 1 returns total_count == 2, has_more == true, and page 2 (offset=1) returns the second record with has_more == false."
        test_recipe:
          setup: ["GA program OPEN; one production; two applications exist? No — second application for same (production, program) is blocked, so use two productions each with one application"]
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_a: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Okefenokee Nights", production_type: "SERIES", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 200000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_b: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_a}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications", payload: { production_id: "${prod_b}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 150000000 }, as: Producer, as_user_id: "${co_id}" }
          trigger:
            - { call: "GET /api/applications", payload: { jurisdiction_program_id: "${prog_id}", limit: 1, offset: 0 }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "GET /api/applications", payload: { jurisdiction_program_id: "${prog_id}", limit: 1, offset: 1 }, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
          assert:
            - "Page 1: data array length 1, total_count == 2, has_more == true"
            - "Page 2: data array length 1, total_count == 2, has_more == false; the two pages contain disjoint application ids"
      - name: computed_field_input_rejected
        claim_type: computed_fields
        grounds:
          - "entities.SpendEntry.fields.effective_amount_cents"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Passing the computed field effective_amount_cents in a create body is an unknown field and yields ERR_INVALID_REQUEST — clients cannot write computed state."
        test_recipe:
          setup: ["GA program OPEN; application APPROVED; vendor VERIFIED"]
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
          trigger:
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", external_invoice_ref: "INV-C-001", category: "BTL", spend_date: "2026-10-05T00:00:00Z", amount_cents: 1000, effective_amount_cents: 999999 }, as: Producer, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST (http 400) — computed/system fields are not writable"
      - name: application_create_with_unknown_production_returns_not_found
        claim_type: parent_relationships
        grounds:
          - "entities.IncentiveApplication.fields.production_id"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "A body FK that does not resolve (bogus production_id) yields ERR_NOT_FOUND (404), validated before business rules."
        test_recipe:
          setup: ["GA program exists"]
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
          trigger:
            - { call: "POST /api/applications", payload: { production_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (http 404)"

  # ------------------------------------------------------- state machines ---
  - section: state_machines
    instances:
      - name: initial_states_on_creation
        claim_type: initial_state
        grounds:
          - "state_machines.IncentiveApplication"
          - "state_machines.Vendor"
          - "state_machines.SpendEntry"
          - "state_machines.AuditPackage"
          - "state_machines.ClawbackCase"
        distinguishing_aspect: "Every newly created entity starts in its declared initial state: application DRAFT, vendor UNVERIFIED, spend entry PENDING_REVIEW, audit package ENGAGED, clawback case OPENED (certificate ISSUED at issuance, transfer PROPOSED at proposal)."
        test_recipe:
          setup: ["GA program OPEN; company + production; application APPROVED; vendor verified"]
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id, prog_st: $.data.status } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id, app_st: $.data.status } }
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
            - { call: "POST /api/applications/${app_id}/claim-review", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-1" }
            - { call: "POST /api/applications/${app_id}/approve", payload: {}, as: FilmOfficeReviewer, as_user_id: "reviewer-2" }
            - { call: "POST /api/vendors", payload: { production_id: "${prod_id}", legal_name: "Savannah Grip & Electric", tax_id: "47-2201988", residency_jurisdiction: "GA" }, as: Producer, as_user_id: "${co_id}", captures: { vend_id: $.data.id, vend_st: $.data.residency_status } }
          trigger:
            - { call: "POST /api/spend-entries", payload: { application_id: "${app_id}", vendor_id: "${vend_id}", external_invoice_ref: "INV-I-001", category: "BTL", spend_date: "2026-10-05T00:00:00Z", amount_cents: 1000 }, as: Producer, as_user_id: "${co_id}", captures: { ent_st: $.data.status } }
            - { call: "POST /api/audit-packages", payload: { application_id: "${app_id}" }, as: CPAAuditor, as_user_id: "cpa-1", captures: { pkg_st: $.data.status } }
          assert:
            - "JurisdictionProgram initial: DRAFT (captured at create, before transition)"
            - "IncentiveApplication initial: DRAFT; Vendor initial: UNVERIFIED; SpendEntry initial: PENDING_REVIEW; AuditPackage initial: ENGAGED"
      - name: submit_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - "state_machines.IncentiveApplication.DRAFT_to_SUBMITTED"
          - "errors[ERR_INVALID_STATE_TRANSITION]"
        distinguishing_aspect: "Submit is not idempotent: a second submit on a SUBMITTED application fails with ERR_INVALID_STATE_TRANSITION and no state change."
        test_recipe:
          setup: ["GA program OPEN; application created"]
          setup_api_calls:
            - { call: "POST /api/jurisdiction-programs", payload: { jurisdiction_code: "GA", program_name: "GA Film Credit FY27", fiscal_year: "FY2027", window_opens_at: "2026-08-01T00:00:00Z", window_closes_at: "2027-07-01T00:00:00Z", annual_cap_cents: 100000000, minimum_qualified_spend_cents: 10000000, base_rate_standard: 0.25, base_rate_elevated: 0.30, elevated_tier_threshold_cents: 200000000, atl_cap_pct: 0.40, resident_uplift_pct: 0.025, transfer_price_floor_pct: 0.90, vendor_verification_validity_days: 365, appeal_window_days: 30, daily_interest_rate: 0.0005, credit_validity_days: 1095, transfer_proposal_validity_days: 14 }, as: FilmOfficeAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /api/jurisdiction-programs/${prog_id}/transition", payload: { to_state: "OPEN" }, as: FilmOfficeAdmin }
            - { call: "POST /api/production-companies", payload: { legal_name: "Peachtree Pictures LLC", fein: "58-1002003", contact_email: "ops@peachtree.example" }, as: Producer, captures: { co_id: $.data.id } }
            - { call: "POST /api/productions", payload: { production_company_id: "${co_id}", title: "Atlantic Crossing", production_type: "FEATURE", scheduled_start_date: "2026-09-01T00:00:00Z", scheduled_wrap_date: "2026-12-15T00:00:00Z", total_budget_cents: 400000000 }, as: Producer, as_user_id: "${co_id}", captures: { prod_id: $.data.id } }
            - { call: "POST /api/applications", payload: { production_id: "${prod_id}", jurisdiction_program_id: "${prog_id}", estimated_qualified_spend_cents: 250000000 }, as: Producer, as_user_id: "${co_id}", captures: { app_id: $.data.id } }
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}" }
          trigger:
            - { call: "POST /api/applications/${app_id}/submit", payload: {}, as: Producer, as_user_id: "${co_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION (http 409); status remains SUBMITTED with the original submitted_at"
      - name: denied_application_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
