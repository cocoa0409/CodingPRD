scenario: |
  931. Virtual-Address & Mail-Scanning (CMRA): box/plan & Form 1583, mail receipt & scan/forward,
  package acceptance & notification, shredding & check-deposit, registered-agent add-on,
  plan tier & overage, USPS compliance & ID, cancellation
domain_name: virtual-address-cmra
api_prefix: "/"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  # Box is the aggregate root (Box -> Recipient -> Form1583/IdDocument, Box -> MailItem -> ScanJob/
  # DispositionRequest/CheckDeposit), crossed by flat peer references (MailItem.carrier_rule_id,
  # MailItem.forward_shipment_id, CheckDeposit.matched_recipient_id) and one self-referential edge
  # (Recipient.guarantor_recipient_id).

  state_machine_shape: parallel
  # MailItem carries three independent axes (handling_status x storage_status x billing_status);
  # Box carries two (service_status x compliance_status); Recipient carries two
  # (roster_status x release_eligibility). Cycles appear on Box.service_status,
  # Recipient.roster_status, ScanJob.status (capped retries) and CheckDeposit.status.

  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  # A ComplianceOfficer user id that opened a ComplianceReview may not resolve it; a Notary user id
  # that notarized a Form1583 may not accept it.

  consistency_model: immediate

constants:
  DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"
  USPS_ROSTER_CAP: 12
  FORM_1583_VALIDITY_DAYS: 1825
  ID_DOC_EXPIRY_GRACE_DAYS: 0
  SCAN_JOB_MAX_PAGES: 25
  SCAN_REQUEST_MAX_PAGES: 200
  MAX_SCAN_RETRIES: 2
  NOTIFICATION_SLA_HOURS: 24
  SOP_NOTIFICATION_SLA_HOURS: 4
  SOP_STORAGE_EXEMPT: true
  SOP_SCAN_QUOTA_BYPASS: true
  CONSOLIDATION_MIN_ITEMS: 3
  CONSOLIDATION_DISCOUNT_PCT: 0.15
  FORWARD_BRACKET_1_MAX_LB: 1.0
  FORWARD_BRACKET_1_CENTS: 850
  FORWARD_BRACKET_2_MAX_LB: 5.0
  FORWARD_BRACKET_2_CENTS: 1750
  FORWARD_BRACKET_3_MAX_LB: 20.0
  FORWARD_BRACKET_3_CENTS: 3900
  FORWARD_BRACKET_4_CENTS: 7200
  SERVICE_MULTIPLIER_ECONOMY: 1.00
  SERVICE_MULTIPLIER_PRIORITY: 1.45
  SERVICE_MULTIPLIER_EXPRESS: 2.20
  CHECK_MAX_AMOUNT_CENTS: 500000
  BATCH_MAX_TOTAL_CENTS: 2500000
  BATCH_MAX_CHECKS: 25
  BATCH_CUTOFF_HOUR_UTC: 21
  NOTICE_PERIOD_DAYS: 30
  FINAL_FORWARD_WINDOW_DAYS: 15
  ABANDONMENT_RTS_DAYS: 10
  RETENTION_FLOOR_DAYS: 30
  RA_DEFAULT_RETENTION_DAYS: 1095
  BILLING_CYCLE_LENGTH_DAYS: 30
  PRORATION_DAYS_PER_CYCLE: 30
  LOYALTY_TIER_1_MIN_CENTS: 15000
  LOYALTY_TIER_1_PCT: 0.05
  LOYALTY_TIER_2_MIN_CENTS: 40000
  LOYALTY_TIER_2_PCT: 0.10
  SCAN_TIER_MULTIPLIER_COVER: 1
  SCAN_TIER_MULTIPLIER_INTERIOR: 1
  SCAN_TIER_MULTIPLIER_OCR: 2
  DISPOSITION_RANK_DEPOSIT: 1
  DISPOSITION_RANK_FORWARD: 2
  DISPOSITION_RANK_RETURN: 3
  DISPOSITION_RANK_SHRED: 4
  MONEY_ROUNDING: "round_half_up to whole cents"
  PAYEE_NORMALIZATION: "uppercase, strip leading/trailing spaces, collapse internal runs of spaces to one, delete the characters . , ' and -"

gate_precedence:
  description: |
    Two global write gates exist. They are evaluated in the order listed below and the FIRST one
    whose condition holds wins; the loser's error is never returned for that request. Both gates sit
    inside the §1.4 ladder at the priorities named here (11 and 17), so their ordering is machine-checkable.
  gates:
    - gate_id: box_suspension_gate
      ladder_priority: 11
      condition: "Box.service_status == SUSPENDED"
      error_id: ERR_BOX_SUSPENDED
      gated_operations:
        - "POST /mail-items/{id}/scan-jobs"
        - "POST /mail-items/{id}/dispositions"
        - "POST /dispositions/{id}/execute"
        - "POST /boxes/{id}/forward-shipments"
        - "POST /forward-shipments/{id}/ship"
        - "POST /deposit-batches/{id}/checks"
        - "POST /boxes/{id}/recipients"
        - "POST /boxes/{id}/plan-change"
      exempt_operations:
        - "POST /boxes/{id}/mail-items"
        - "POST /mail-items/{id}/match"
        - "POST /mail-items/{id}/refuse"
        - "POST /mail-items/{id}/notify"
        - "POST /mail-items/{id}/package-acceptance"
        - "POST /boxes/{id}/cancellation"
      sop_carve_out: |
        When the target MailItem.item_class == SOP and the Box has an active RegisteredAgentService,
        POST /mail-items/{id}/scan-jobs with scan_tier COVER or INTERIOR is exempt from
        this gate. SOP items are NOT exempt from the Form 1583 gate below.
    - gate_id: form_1583_gate
      ladder_priority: 17
      condition: |
        The MailItem's matched Recipient does not have release_eligibility == RELEASABLE.
        Decomposed into three ordered rungs 17/18/19 (see §1.4): no ACCEPTED Form1583 ->
        ERR_FORM_1583_INCOMPLETE; the recipient has never had a document of doc_class PHOTO or of
        doc_class ADDRESS reach VERIFIED -> ERR_ID_DOCUMENT_SET_INCOMPLETE; both classes have been
        verified at some point but the current governing document of at least one class has since
        become EXPIRED -> ERR_ID_DOCUMENT_EXPIRED.
      gated_operations:
        - "POST /mail-items/{id}/scan-jobs (scan_tier INTERIOR or OCR only)"
        - "POST /mail-items/{id}/dispositions"
        - "POST /dispositions/{id}/execute"
        - "POST /boxes/{id}/forward-shipments"
        - "POST /deposit-batches/{id}/checks"
      exempt_operations:
        - "POST /boxes/{id}/mail-items"
        - "POST /mail-items/{id}/match"
        - "POST /mail-items/{id}/notify"
        - "POST /mail-items/{id}/scan-jobs (scan_tier COVER only)"
      sop_carve_out: |
        None. An SOP item may be cover-scanned and notified with no Form 1583, but it may not be
        forwarded, opened, deposited or shredded until its matched Recipient is RELEASABLE.

conservation_invariants:
  - invariant_id: quota_tranche_partition
    scope: "one BillingCycle, one unit_type"
    formula: |
      sum(UsageLedgerEntry.quantity WHERE tranche == IN_TIER) +
      sum(UsageLedgerEntry.quantity WHERE tranche == OVERAGE)
        == BillingCycle.<unit_type>_consumed
      AND sum(quantity WHERE tranche == IN_TIER)
        == min(BillingCycle.<unit_type>_consumed, included(unit_type) as defined by the
           overage_metering calculation; note included(STORAGE_DAY) == 0)
    note: "Holds after every metering event and after POST /boxes/{id}/billing-cycles/close."
  - invariant_id: deposit_money_partition
    scope: "one DepositBatch"
    formula: |
      DepositBatch.received_amount_cents ==
        DepositBatch.deposited_amount_cents +
        DepositBatch.returned_amount_cents +
        DepositBatch.held_amount_cents
  - invariant_id: mail_custody_cardinality
    scope: "one Box"
    formula: |
      count(MailItem WHERE storage_status IN {FREE_WINDOW, ACCRUING}) +
      count(MailItem WHERE storage_status == RELEASED) +
      count(MailItem WHERE storage_status == DESTROYED)
        == count(MailItem WHERE box_id == Box.id)
    note: "Every MailItem sits in exactly one custody bucket; no item is ever in two or in none."
  - invariant_id: refund_waterfall_conservation
    scope: "one CancellationRequest"
    formula: |
      CancellationRequest.refund_total_cents +
      CancellationRequest.applied_to_overage_cents +
      CancellationRequest.forfeited_cents
        == CancellationRequest.prepaid_at_request_cents +
           CancellationRequest.deposit_held_cents
  - invariant_id: storage_day_time_partition
    scope: "one MailItem"
    formula: |
      MailItem.free_storage_days_used + MailItem.billable_storage_days
        == total_custody_days(MailItem)
      where total_custody_days = floor((custody_end - MailItem.received_at) / 86400 seconds),
      custody_end = MailItem.released_at when storage_status IN {RELEASED, DESTROYED},
      else the current logical clock.

entities:
  - name: PlanTier
    parent: null
    common_fields: false
    fields:
      - name: tier_code
        type: enum
        source: input
        description: Plan tier identifier.
        constraints: "one of BASIC, PLUS, BUSINESS, ENTERPRISE; unique across PlanTier"
      - name: name
        type: string
        source: input
        description: Human-readable tier name.
      - name: rank
        type: integer
        source: input
        description: Ordinal used to decide whether a plan change is an upgrade or a downgrade.
        constraints: "1..4; higher rank == richer tier; unique across PlanTier"
      - name: monthly_fee_cents
        type: integer
        source: input
        description: Recurring fee charged at the start of each 30-day billing cycle.
        constraints: ">= 0"
      - name: included_recipients
        type: integer
        source: input
        description: Recipients that may hold roster_status AUTHORIZED without a per-recipient charge.
        constraints: ">= 1"
      - name: included_scan_pages
        type: integer
        source: input
        description: Scan pages included per billing cycle before overage metering starts.
        constraints: ">= 0"
      - name: included_forwards
        type: integer
        source: input
        description: ForwardShipments included per billing cycle before overage metering starts.
        constraints: ">= 0"
      - name: included_storage_days
        type: integer
        source: input
        description: Free storage window per MailItem, in whole days, measured from received_at.
        constraints: ">= 0"
      - name: overage_scan_page_cents
        type: integer
        source: input
        description: Per-page rate applied to scan pages beyond included_scan_pages.
        constraints: ">= 0"
      - name: overage_forward_cents
        type: integer
        source: input
        description: Per-shipment rate applied to forwards beyond included_forwards.
        constraints: ">= 0"
      - name: overage_storage_day_cents
        type: integer
        source: input
        description: Per-piece-per-day rate applied to storage days beyond included_storage_days.
        constraints: ">= 0"
      - name: overage_recipient_cents
        type: integer
        source: input
        description: Per-cycle rate applied to each AUTHORIZED recipient beyond included_recipients.
        constraints: ">= 0"
      - name: allows_overage
        type: boolean
        source: input
        description: When false, any request that would consume a unit beyond the included quota is rejected instead of metered as overage.
        default: true

  - name: CarrierRule
    parent: null
    common_fields: false
    fields:
      - name: carrier_code
        type: enum
        source: input
        description: Delivering carrier this rule governs.
        constraints: "one of USPS, UPS, FEDEX, DHL, AMAZON; unique across CarrierRule"
      - name: dim_divisor
        type: integer
        source: input
        description: Divisor used to convert cubic inches to dimensional pounds.
        constraints: ">= 1"
      - name: max_length_plus_girth_in
        type: number
        source: input
        description: Oversize refusal threshold; an item whose length_in + girth exceeds this value is refused.
        constraints: "> 0"
      - name: max_actual_weight_lb
        type: number
        source: input
        description: Maximum actual weight the facility accepts from this carrier.
        constraints: "> 0"
      - name: accepts_signature_required
        type: boolean
        source: input
        description: Whether the facility may sign for this carrier's signature-required parcels at all.
        default: true
      - name: acceptance_fee_cents
        type: integer
        source: input
        description: Flat handling fee charged when a package from this carrier is accepted.
        constraints: ">= 0"
      - name: base_rate_cents_per_lb
        type: integer
        source: input
        description: Per-billable-pound rate used by the package acceptance price calculation.
        constraints: ">= 0"

  - name: Box
    parent: null
    common_fields: true
    fields:
      - name: box_number
        type: string
        source: input
        description: Mailbox number at the CMRA facility.
        constraints: "unique across Box; non-empty"
      - name: plan_tier_id
        type: string
        source: input
        description: "FK -> PlanTier.id; the tier currently in force for this box."
      - name: pending_plan_tier_id
        type: string
        source: system
        description: "FK -> PlanTier.id; nullable; a downgrade recorded mid-cycle that takes effect at the next billing-cycle close."
      - name: holder_name
        type: string
        source: input
        description: Legal name of the account holder who signs the agreement.
      - name: holder_email
        type: string
        source: input
        description: Contact address used for package and SOP notifications.
      - name: security_deposit_cents
        type: integer
        source: input
        description: Refundable deposit collected at setup; enters the cancellation refund waterfall.
        default: 0
        constraints: ">= 0"
      - name: extra_recipient_slots
        type: integer
        source: input
        description: Purchased roster slots added on top of PlanTier.included_recipients.
        default: 0
        constraints: ">= 0"
      - name: prepaid_balance_cents
        type: integer
        source: input
        description: Prepaid credit on the account, debited by cycle charges.
        default: 0
        constraints: ">= 0"
      - name: service_status
        type: enum
        source: system
        description: Lifecycle axis of the box.
        default: PENDING_SETUP
        constraints: "one of PENDING_SETUP, ACTIVE, SUSPENDED, CLOSING, CLOSED"
      - name: compliance_status
        type: enum
        source: system
        description: USPS compliance axis of the box; evolves independently of service_status.
        default: COMPLIANT
        constraints: "one of COMPLIANT, UNDER_REVIEW, NON_COMPLIANT"
      - name: suspended_reason
        type: enum
        source: system
        description: Why the box is suspended; NONE whenever service_status != SUSPENDED.
        default: NONE
        constraints: "one of NONE, COMPLIANCE_REVIEW, USPS_ORDER"
      - name: activated_at
        type: datetime
        source: system
        description: Logical-clock instant at which service_status first became ACTIVE.
      - name: cycle_anchor_date
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) of activation; every BillingCycle period_start is cycle_anchor_date + 30*n days."
      - name: outstanding_overage_cents
        type: integer
        source: computed
        description: Sum of amount_cents over UsageLedgerEntry rows with tranche == OVERAGE whose BillingCycle.status == OPEN for this box.
      - name: roster_authorized_count
        type: integer
        source: computed
        description: Count of Recipient rows for this box with roster_status == AUTHORIZED.
      - name: release_gate_state
        type: enum
        source: computed
        description: Winning global gate for this box per gate_precedence; OPEN when neither gate holds.
        constraints: "one of OPEN, GATED_SUSPENDED, GATED_LIFECYCLE"

  - name: Recipient
    parent: Box
    common_fields: true
    fields:
      - name: box_id
        type: string
        source: input
        description: "FK -> Box.id; the mailbox whose roster carries this recipient."
      - name: legal_name
        type: string
        source: input
        description: Name exactly as it appears on the recipient's Form 1583.
        constraints: non-empty
      - name: recipient_kind
        type: enum
        source: input
        description: Kind of roster member.
        constraints: "one of INDIVIDUAL, BUSINESS, MINOR"
      - name: dba_aliases
        type: array
        source: input
        description: Additional names (DBA / trade names) that mail and checks may be addressed to.
        default: []
      - name: guarantor_recipient_id
        type: string
        source: input
        description: "FK -> Recipient.id; nullable; the adult guarantor for a MINOR recipient. Required when recipient_kind == MINOR, forbidden otherwise."
      - name: signature_authorization_on_file
        type: boolean
        source: input
        description: Whether the recipient has authorized the CMRA to sign for signature-required parcels on their behalf.
        default: false
      - name: roster_status
        type: enum
        source: system
        description: Roster membership axis.
        default: PENDING
        constraints: "one of PENDING, AUTHORIZED, SUSPENDED, REMOVED"
      - name: release_eligibility
        type: enum
        source: computed
        description: Derived Form 1583 / identification axis; RELEASABLE only when the recipient may lawfully receive released mail.
        default: BLOCKED
        constraints: "one of BLOCKED, RELEASABLE"
      - name: blocked_reason
        type: enum
        source: computed
        description: Which clause of the Form 1583 gate currently blocks release; NONE when release_eligibility == RELEASABLE.
        default: NO_ACCEPTED_1583
        constraints: "one of NONE, NO_ACCEPTED_1583, ID_SET_INCOMPLETE, ID_EXPIRED, GUARANTOR_BLOCKED, ROSTER_NOT_AUTHORIZED"
      - name: form_1583_accepted_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent Form1583 transition into ACCEPTED for this recipient; null when none.

  - name: Form1583
    parent: Recipient
    common_fields: true
    fields:
      - name: recipient_id
        type: string
        source: input
        description: "FK -> Recipient.id; the roster member this application covers."
      - name: home_address_line
        type: string
        source: input
        description: Applicant's residence address as declared on the form.
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: Application lifecycle.
        default: DRAFT
        constraints: "one of DRAFT, NOTARIZED, ACCEPTED, REJECTED, EXPIRED"
      - name: notarized_at
        type: datetime
        source: system
        description: Logical-clock instant of notarization.
      - name: notary_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the Notary who notarized the form.
      - name: accepted_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) on which a ComplianceOfficer accepted the form."
      - name: expires_on
        type: string
        source: computed
        description: "accepted_on + FORM_1583_VALIDITY_DAYS, as YYYY-MM-DD; the form becomes EXPIRED once the clock date is strictly greater than this."
      - name: accepted_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplianceOfficer who accepted the form.
      - name: rejection_reason
        type: enum
        source: input
        description: Reason recorded when the form is rejected.
        constraints: "one of ADDRESS_MISMATCH, ILLEGIBLE, NAME_MISMATCH, INCOMPLETE_ID; required on reject, null otherwise"

  - name: IdDocument
    parent: Recipient
    common_fields: true
    fields:
      - name: recipient_id
        type: string
        source: input
        description: "FK -> Recipient.id; owner of this identification document."
      - name: doc_class
        type: enum
        source: input
        description: Which of the two USPS-required classes this document satisfies.
        constraints: "one of PHOTO, ADDRESS"
      - name: doc_type
        type: enum
        source: input
        description: Concrete document type.
        constraints: "one of DRIVERS_LICENSE, PASSPORT, STATE_ID, UTILITY_BILL, LEASE, VOTER_CARD, VEHICLE_REGISTRATION"
      - name: expires_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) after which the document is no longer acceptable."
      - name: status
        type: enum
        source: system
        description: Monotone verification axis; once EXPIRED or SUPERSEDED a document never returns to VERIFIED.
        default: PENDING_REVIEW
        constraints: "one of PENDING_REVIEW, VERIFIED, EXPIRED, SUPERSEDED"
      - name: verified_at
        type: datetime
        source: system
        description: Logical-clock instant at which an operator marked the document VERIFIED.

  - name: MailItem
    parent: Box
    common_fields: true
    fields:
      - name: box_id
        type: string
        source: input
        description: "FK -> Box.id; the mailbox the piece was addressed to."
      - name: addressee_name
        type: string
        source: input
        description: Name printed on the piece, before roster matching.
        constraints: non-empty
      - name: matched_recipient_id
        type: string
        source: system
        description: "FK -> Recipient.id; nullable; set by POST /mail-items/{id}/match, cleared never."
      - name: item_class
        type: enum
        source: input
        description: Physical/legal class of the piece.
        constraints: "one of LETTER, FLAT, PACKAGE, SOP"
      - name: carrier_rule_id
        type: string
        source: input
        description: "FK -> CarrierRule.id; nullable; required when item_class IN {PACKAGE, SOP} (both arrive through a carrier), forbidden for LETTER and FLAT."
      - name: signature_required
        type: boolean
        source: input
        description: Whether the carrier demands a signature at handover.
        default: false
      - name: actual_weight_lb
        type: number
        source: input
        description: Scale weight of the piece in pounds.
        constraints: ">= 0"
      - name: length_in
        type: number
        source: input
        description: Longest dimension in inches.
        constraints: ">= 0"
      - name: width_in
        type: number
        source: input
        description: Second dimension in inches.
        constraints: ">= 0"
      - name: height_in
        type: number
        source: input
        description: Third dimension in inches.
        constraints: ">= 0"
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant at which the piece was logged into the facility.
      - name: accepted_at
        type: datetime
        source: system
        description: Logical-clock instant at which a PACKAGE or SOP was accepted from the carrier; null for LETTER/FLAT.
      - name: released_at
        type: datetime
        source: system
        description: Logical-clock instant at which storage_status left FREE_WINDOW/ACCRUING; null while the piece is still in custody.
      - name: handling_status
        type: enum
        source: system
        description: Custody/disposition axis.
        default: RECEIVED
        constraints: "one of RECEIVED, AWAITING_CLEARANCE, HELD, PENDING_DISPOSITION, FORWARDED, SHREDDED, DEPOSITED, RETURNED, REFUSED"
      - name: storage_status
        type: enum
        source: system
        description: Storage-economics axis; advances independently of handling_status.
        default: FREE_WINDOW
        constraints: "one of FREE_WINDOW, ACCRUING, RELEASED, DESTROYED"
      - name: billing_status
        type: enum
        source: system
        description: Metering axis; advances independently of the other two axes.
        default: UNBILLED
        constraints: "one of UNBILLED, METERED, BILLED, WRITTEN_OFF"
      - name: notification_status
        type: enum
        source: system
        description: Notification-obligation axis for PACKAGE and SOP pieces.
        default: NOT_REQUIRED
        constraints: "one of NOT_REQUIRED, PENDING, SENT, BREACHED"
      - name: notification_due_at
        type: datetime
        source: computed
        description: Deadline for the notification obligation; null when notification_status == NOT_REQUIRED.
      - name: notified_at
        type: datetime
        source: system
        description: Logical-clock instant at which the notification was actually sent.
      - name: interior_scan_consent
        type: boolean
        source: input
        description: Standing consent to open the envelope for INTERIOR/OCR scanning.
        default: false
      - name: forward_shipment_id
        type: string
        source: system
        description: "FK -> ForwardShipment.id; nullable; set when the piece is placed on a consolidation."
      - name: billable_weight_lb
        type: number
        source: computed
        description: "Set at intake to actual_weight_lb for every piece, then recomputed at package acceptance for item_class IN {PACKAGE, SOP} as max(actual_weight_lb, dimensional weight). Drives both the acceptance fee and the forwarding weight bracket."
      - name: package_acceptance_fee_cents
        type: integer
        source: computed
        description: Handling fee charged at package acceptance.
      - name: free_storage_days_used
        type: integer
        source: computed
        description: Whole custody days charged at zero, capped at PlanTier.included_storage_days.
      - name: billable_storage_days
        type: integer
        source: computed
        description: Whole custody days beyond the free window, metered as STORAGE_DAY usage.
      - name: refusal_reason
        type: enum
        source: input
        description: Reason recorded when the piece is refused.
        constraints: "one of NOT_ON_ROSTER, OVERSIZE, CARRIER_NOT_ACCEPTED, HOLDER_REQUEST; required on refuse, null otherwise"

  - name: ScanJob
    parent: MailItem
    common_fields: true
    fields:
      - name: mail_item_id
        type: string
        source: input
        description: "FK -> MailItem.id; the piece being imaged."
      - name: scan_tier
        type: enum
        source: input
        description: Imaging tier; COVER is exterior only, INTERIOR opens the piece, OCR adds a searchable text layer.
        constraints: "one of COVER, INTERIOR, OCR"
      - name: requested_pages
        type: integer
        source: input
        description: Total pages the requester asked for across the whole split group.
        constraints: "1 <= requested_pages <= SCAN_REQUEST_MAX_PAGES"
      - name: split_index
        type: integer
        source: system
        description: 1-based position of this job inside its split group.
        constraints: ">= 1"
      - name: split_group_size
        type: integer
        source: system
        description: Number of jobs the request was split into.
        constraints: ">= 1"
      - name: page_count
        type: integer
        source: system
        description: Pages assigned to this job; every job but the last carries exactly SCAN_JOB_MAX_PAGES.
        constraints: "1 <= page_count <= SCAN_JOB_MAX_PAGES"
      - name: status
        type: enum
        source: system
        description: Imaging lifecycle with capped retries.
        default: QUEUED
        constraints: "one of QUEUED, IN_PROGRESS, COMPLETED, FAILED, ABANDONED"
      - name: retry_count
        type: integer
        source: system
        description: Number of times this job has been re-queued after a failure.
        default: 0
        constraints: "0 <= retry_count <= MAX_SCAN_RETRIES"
      - name: billed_pages_in_tier
        type: integer
        source: computed
        description: Pages of this job charged against the plan's included_scan_pages.
      - name: billed_pages_overage
        type: integer
        source: computed
        description: Pages of this job charged at PlanTier.overage_scan_page_cents.
      - name: charge_cents
        type: integer
        source: computed
        description: Money charged for this job at COMPLETED.

  - name: DispositionRequest
    parent: MailItem
    common_fields: true
    fields:
      - name: mail_item_id
        type: string
        source: input
        description: "FK -> MailItem.id; the piece whose terminal disposition is requested."
      - name: disposition_type
        type: enum
        source: input
        description: Which terminal disposition is being requested.
        constraints: "one of FORWARD, SHRED, DEPOSIT, RETURN"
      - name: precedence_rank
        type: integer
        source: computed
        description: "Fixed precedence of disposition_type: DEPOSIT 1, FORWARD 2, RETURN 3, SHRED 4 (lower wins)."
      - name: status
        type: enum
        source: system
        description: Request lifecycle.
        default: PENDING
        constraints: "one of PENDING, EXECUTED, CANCELLED, SUPERSEDED"
      - name: resolution_reason
        type: enum
        source: system
        description: Why the request left PENDING.
        default: NONE
        constraints: "one of NONE, EXECUTED, LOST_PRECEDENCE, GATE_SUSPENSION, HOLDER_CANCELLED"
      - name: executed_at
        type: datetime
        source: system
        description: Logical-clock instant at which the disposition was carried out.

  - name: ForwardShipment
    parent: Box
    common_fields: true
    fields:
      - name: box_id
        type: string
        source: input
        description: "FK -> Box.id; the mailbox whose pieces are being consolidated."
      - name: service_level
        type: enum
        source: input
        description: Shipping speed selected by the holder.
        constraints: "one of ECONOMY, PRIORITY, EXPRESS"
      - name: destination_address
        type: string
        source: input
        description: Free-text ship-to address.
        constraints: non-empty
      - name: status
        type: enum
        source: system
        description: Shipment lifecycle; a shipment is priced at creation.
        default: PRICED
        constraints: "one of PRICED, SHIPPED, CANCELLED"
      - name: item_count
        type: integer
        source: computed
        description: Number of MailItem rows whose forward_shipment_id equals this shipment.
      - name: excluded_item_count
        type: integer
        source: computed
        description: Number of requested pieces that failed consolidation eligibility and were left off the shipment.
      - name: total_weight_lb
        type: number
        source: computed
        description: Sum of billable_weight_lb over the pieces actually on the shipment.
      - name: base_price_cents
        type: integer
        source: computed
        description: Sum of per-item bracket price times service multiplier, each item rounded to whole cents before summing.
      - name: consolidation_discount_cents
        type: integer
        source: computed
        description: Discount applied to base_price_cents when item_count >= CONSOLIDATION_MIN_ITEMS.
      - name: total_price_cents
        type: integer
        source: computed
        description: base_price_cents - consolidation_discount_cents.
      - name: shipped_at
        type: datetime
        source: system
        description: Logical-clock instant at which the shipment left the facility.

  - name: CheckDeposit
    parent: MailItem
    common_fields: true
    fields:
      - name: mail_item_id
        type: string
        source: input
        description: "FK -> MailItem.id; the piece the check arrived in."
      - name: deposit_batch_id
        type: string
        source: system
        description: "FK -> DepositBatch.id; the batch the check was logged into; set at creation and never cleared."
      - name: matched_recipient_id
        type: string
        source: system
        description: "FK -> Recipient.id; nullable; the roster member whose legal_name or dba_aliases matched the payee."
      - name: payee_name_on_check
        type: string
        source: input
        description: Payee line exactly as printed on the check.
        constraints: non-empty
      - name: amount_cents
        type: integer
        source: input
        description: Face amount of the check.
        constraints: "1 <= amount_cents"
      - name: endorsed
        type: boolean
        source: input
        description: Whether the check bears the recipient's endorsement on the reverse.
        default: false
      - name: match_mode
        type: enum
        source: computed
        description: Which matching variant produced matched_recipient_id.
        default: NONE
        constraints: "one of NONE, EXACT_LEGAL, ALIAS"
      - name: status
        type: enum
        source: system
        description: Check lifecycle; a HELD check can re-enter MATCHED once an alias is added.
        default: RECEIVED
        constraints: "one of RECEIVED, MATCHED, DEPOSITED, HELD, RETURNED"
      - name: hold_reason
        type: enum
        source: system
        description: Why a check is held or returned.
        default: NONE
        constraints: "one of NONE, PAYEE_MISMATCH, NOT_ENDORSED"

  - name: DepositBatch
    parent: Box
    common_fields: true
    fields:
      - name: box_id
        type: string
        source: input
        description: "FK -> Box.id; the mailbox whose checks this batch carries."
      - name: business_date
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the batch is booked to."
      - name: closed
        type: boolean
        source: system
        description: Whether the batch has been closed for the day.
        default: false
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant of closure; null while open.
      - name: status
        type: enum
        source: computed
        description: OPEN while closed == false, CLOSED once closed == true.
        default: OPEN
        constraints: "one of OPEN, CLOSED"
      - name: check_count
        type: integer
        source: computed
        description: Number of CheckDeposit rows whose deposit_batch_id equals this batch.
      - name: received_amount_cents
        type: integer
        source: computed
        description: Sum of amount_cents over all CheckDeposit rows created against this batch, in any status.
      - name: deposited_amount_cents
        type: integer
        source: computed
        description: Sum of amount_cents over attached checks with status == DEPOSITED.
      - name: returned_amount_cents
        type: integer
        source: computed
        description: Sum of amount_cents over attached checks with status == RETURNED.
      - name: held_amount_cents
        type: integer
        source: computed
        description: Sum of amount_cents over all CheckDeposit rows created against this batch whose status IN {RECEIVED, MATCHED, HELD}, i.e. neither deposited nor returned.

  - name: RegisteredAgentService
    parent: Box
    common_fields: true
    fields:
      - name: box_id
        type: string
        source: input
        description: "FK -> Box.id; the mailbox carrying the registered-agent add-on."
      - name: jurisdiction_code
        type: string
        source: input
        description: Two-letter state code whose statute governs service-of-process retention.
        constraints: "exactly 2 uppercase letters"
      - name: retention_days
        type: integer
        source: input
        description: Statutory retention period for SOP documents in this jurisdiction.
        default: 1095
        constraints: ">= 1"
      - name: active
        type: boolean
        source: system
        description: Whether the add-on is currently in force.
        default: true
      - name: deactivated_at
        type: datetime
        source: system
        description: Logical-clock instant at which the add-on was switched off; null while active.
      - name: sop_count
        type: integer
        source: computed
        description: Number of MailItem rows on this box with item_class == SOP.

  - name: ComplianceReview
    parent: Box
    common_fields: true
    fields:
      - name: box_id
        type: string
        source: input
        description: "FK -> Box.id; the mailbox under review."
      - name: reason
        type: enum
        source: input
        description: Why the review was opened.
        constraints: "one of ID_EXPIRY, USPS_AUDIT, ROSTER_ANOMALY, PAYMENT"
      - name: status
        type: enum
        source: system
        description: Review lifecycle.
        default: OPEN
        constraints: "one of OPEN, SUSPENDED, RESOLVED"
      - name: opened_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplianceOfficer who opened the review.
      - name: resolved_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplianceOfficer who resolved it; must differ from opened_by_user_id.
      - name: resolution
        type: enum
        source: input
        description: Outcome recorded at resolution.
        default: NONE
        constraints: "one of NONE, CLEARED, ESCALATED_CLOSURE; required on resolve"
      - name: resolved_at
        type: datetime
        source: system
        description: Logical-clock instant of resolution.

  - name: BillingCycle
    parent: Box
    common_fields: true
    fields:
      - name: box_id
        type: string
        source: input
        description: "FK -> Box.id; the mailbox this cycle bills."
      - name: cycle_index
        type: integer
        source: system
        description: 1-based ordinal of the cycle since activation.
        constraints: ">= 1"
      - name: period_start
        type: string
        source: system
        description: "Inclusive first calendar date (YYYY-MM-DD) of the cycle."
      - name: period_end
        type: string
        source: system
        description: "Exclusive last calendar date (YYYY-MM-DD) of the cycle; period_end == period_start + BILLING_CYCLE_LENGTH_DAYS days."
      - name: status
        type: enum
        source: system
        description: Cycle lifecycle.
        default: OPEN
        constraints: "one of OPEN, CLOSING, CLOSED"
      - name: plan_tier_id_at_close
        type: string
        source: system
        description: Value of Box.plan_tier_id at the moment the cycle was closed; null while OPEN.
      - name: scan_pages_consumed
        type: integer
        source: computed
        description: Total SCAN_PAGE units metered in this cycle.
        default: 0
      - name: forwards_consumed
        type: integer
        source: computed
        description: Total FORWARD units metered in this cycle.
        default: 0
      - name: storage_days_consumed
        type: integer
        source: computed
        description: Total STORAGE_DAY units metered in this cycle.
        default: 0
      - name: recipients_consumed
        type: integer
        source: computed
        description: Total RECIPIENT units metered in this cycle.
        default: 0
      - name: base_fee_cents
        type: integer
        source: computed
        description: PlanTier.monthly_fee_cents in force at close.
        default: 0
      - name: overage_total_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this cycle's UsageLedgerEntry rows with tranche == OVERAGE.
        default: 0
      - name: proration_charge_cents
        type: integer
        source: computed
        description: Mid-cycle upgrade charge booked into this cycle.
        default: 0
      - name: proration_credit_cents
        type: integer
        source: computed
        description: Mid-cycle upgrade credit for the unused remainder of the old tier.
        default: 0
      - name: loyalty_discount_cents
        type: integer
        source: computed
        description: Discount keyed on the pre-discount total; see the box_monthly_charge calculation for the pinned evaluation order.
        default: 0
      - name: total_charge_cents
        type: integer
        source: computed
        description: Final amount billed for this cycle.
        default: 0

  - name: UsageLedgerEntry
    parent: BillingCycle
    common_fields: false
    fields:
      - name: billing_cycle_id
        type: string
        source: system
        description: "FK -> BillingCycle.id; the open cycle this consumption was metered into."
      - name: mail_item_id
        type: string
        source: system
        description: "FK -> MailItem.id; nullable; the piece the consumption is attributable to."
      - name: unit_type
        type: enum
        source: system
        description: Which quota bucket was consumed.
        constraints: "one of SCAN_PAGE, FORWARD, STORAGE_DAY, RECIPIENT"
      - name: tranche
        type: enum
        source: system
        description: Whether the units fell inside the plan allowance or beyond it.
        constraints: "one of IN_TIER, OVERAGE"
      - name: quantity
        type: integer
        source: system
        description: Units consumed by this entry.
        constraints: ">= 1"
      - name: unit_rate_cents
        type: integer
        source: system
        description: Rate applied per unit; always 0 when tranche == IN_TIER.
      - name: amount_cents
        type: integer
        source: system
        description: quantity * unit_rate_cents.
      - name: source_event
        type: enum
        source: system
        description: Which transition appended this entry.
        constraints: "one of SCAN_COMPLETED, FORWARD_SHIPPED, STORAGE_ACCRUAL, RECIPIENT_AUTHORIZED, PLAN_CHANGE"

  - name: CancellationRequest
    parent: Box
    common_fields: true
    fields:
      - name: box_id
        type: string
        source: input
        description: "FK -> Box.id; the mailbox being closed."
      - name: forwarding_address
        type: string
        source: input
        description: Address to which the final forward is sent.
        constraints: non-empty
      - name: requested_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) taken from the logical clock at request time."
      - name: notice_end_date
        type: string
        source: computed
        description: "requested_on + NOTICE_PERIOD_DAYS days; service ends at the start of this date."
      - name: final_forward_deadline
        type: string
        source: computed
        description: "notice_end_date + FINAL_FORWARD_WINDOW_DAYS days; the last date on which a final forward may ship."
      - name: abandonment_date
        type: string
        source: computed
        description: "final_forward_deadline + ABANDONMENT_RTS_DAYS days; on or after this date unclaimed non-SOP pieces are returned to sender."
      - name: destruction_eligible_on
        type: string
        source: computed
        description: "abandonment_date + RETENTION_FLOOR_DAYS days; the earliest date remaining non-SOP pieces may be destroyed."
      - name: status
        type: enum
        source: system
        description: Cancellation lifecycle.
        default: REQUESTED
        constraints: "one of REQUESTED, FINAL_FORWARD, FINALIZED, WITHDRAWN"
      - name: prepaid_at_request_cents
        type: integer
        source: system
        description: Snapshot of Box.prepaid_balance_cents at the instant the request was created.
      - name: deposit_held_cents
        type: integer
        source: system
        description: Snapshot of Box.security_deposit_cents at the instant the request was created.
      - name: applied_to_overage_cents
        type: integer
        source: computed
        description: Portion of the waterfall consumed by outstanding overage.
        default: 0
      - name: refund_total_cents
        type: integer
        source: computed
        description: Money actually returned to the holder at finalization.
        default: 0
      - name: forfeited_cents
        type: integer
        source: computed
        description: Portion retained by the CMRA; nonzero only when the box was closed under ESCALATED_CLOSURE.
        default: 0

state_machines:
  - entity: Box
    axis: service_status
    initial_state: PENDING_SETUP
    terminal_states: [CLOSED]
    transitions:
      - from: PENDING_SETUP
        to: ACTIVE
        trigger: "POST /boxes/{id}/activate"
        actor: CmraOperator
        preconditions:
          - "Box.service_status == PENDING_SETUP"
        side_effects:
          - "sets Box.activated_at to the current logical clock"
          - "sets Box.cycle_anchor_date to the calendar date of the current logical clock"
          - "creates BillingCycle with cycle_index 1, status OPEN, period_start == cycle_anchor_date, period_end == period_start + BILLING_CYCLE_LENGTH_DAYS days"
          - "increments Box.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /compliance-reviews/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Box.service_status == ACTIVE"
          - "ComplianceReview.status == OPEN and ComplianceReview.box_id == Box.id"
        side_effects:
          - "sets Box.suspended_reason to COMPLIANCE_REVIEW"
          - "sets Box.release_gate_state to GATED_SUSPENDED"
          - "CASCADE HOP 2 of the seven-hop chain compliance_suspension_cascade; hops 3 to 7 are pinned in order on state_machines.ComplianceReview.OPEN_to_SUSPENDED"
          - "increments Box.version by 1"
        note: "Hops 3 to 7 are declared, in order, on ComplianceReview.OPEN_to_SUSPENDED, DispositionRequest.PENDING_to_CANCELLED, MailItem.PENDING_DISPOSITION_to_HELD, MailItem.FREE_WINDOW_to_ACCRUING, Recipient.AUTHORIZED_to_SUSPENDED and Recipient.RELEASABLE_to_BLOCKED."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /compliance-reviews/{id}/resolve with resolution CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "Box.service_status == SUSPENDED"
          - "ComplianceReview.status == SUSPENDED"
          - "the acting X-User-ID differs from ComplianceReview.opened_by_user_id"
        side_effects:
          - "sets Box.suspended_reason to NONE"
          - "recomputes Box.release_gate_state"
          - "every Recipient of this box with roster_status == SUSPENDED returns to AUTHORIZED"
          - "increments Box.version by 1"
        note: "Re-entry into ACTIVE; the service_status axis is cyclic."
      - from: SUSPENDED
        to: CLOSING
        trigger: "POST /compliance-reviews/{id}/resolve with resolution ESCALATED_CLOSURE"
        actor: ComplianceOfficer
        preconditions:
          - "Box.service_status == SUSPENDED"
          - "ComplianceReview.status == SUSPENDED"
          - "the acting X-User-ID differs from ComplianceReview.opened_by_user_id"
          - "no CancellationRequest for this box has status IN {REQUESTED, FINAL_FORWARD}"
        side_effects:
          - "creates a CancellationRequest with status REQUESTED, forwarding_address set to the literal ADDRESS_ON_FILE, requested_on set to the clock date, prepaid_at_request_cents and deposit_held_cents snapshotted from the box"
          - "sets Box.suspended_reason to USPS_ORDER"
          - "increments Box.version by 1"
      - from: ACTIVE
        to: CLOSING
        trigger: "POST /boxes/{id}/cancellation"
        actor: BoxHolder
        preconditions:
          - "Box.service_status == ACTIVE"
          - "no CancellationRequest for this box has status IN {REQUESTED, FINAL_FORWARD}"
        side_effects:
          - "creates a CancellationRequest with status REQUESTED"
          - "increments Box.version by 1"
      - from: CLOSING
        to: ACTIVE
        trigger: "POST /boxes/{id}/cancellation/withdraw"
        actor: BoxHolder
        preconditions:
          - "Box.service_status == CLOSING"
          - "the box's CancellationRequest has status IN {REQUESTED, FINAL_FORWARD}"
        side_effects:
          - "sets the CancellationRequest status to WITHDRAWN"
          - "increments Box.version by 1"
        note: "Second re-entry edge into ACTIVE."
      - from: CLOSING
        to: CLOSED
        trigger: "POST /boxes/{id}/cancellation/finalize"
        actor: CmraOperator
        preconditions:
          - "Box.service_status == CLOSING"
          - "the box's CancellationRequest has status FINAL_FORWARD"
          - "the clock date is >= CancellationRequest.destruction_eligible_on"
          - "no MailItem of this box has item_class == SOP with storage_status IN {FREE_WINDOW, ACCRUING} while an active RegisteredAgentService retention period is still running"
        side_effects:
          - "every remaining MailItem with item_class != SOP and storage_status IN {FREE_WINDOW, ACCRUING} moves storage_status to DESTROYED and handling_status to SHREDDED"
          - "runs the refund_waterfall calculation and writes CancellationRequest.applied_to_overage_cents, refund_total_cents, forfeited_cents"
          - "sets the CancellationRequest status to FINALIZED"
          - "closes the OPEN BillingCycle"
          - "increments Box.version by 1"

  - entity: Box
    axis: compliance_status
    initial_state: COMPLIANT
    terminal_states: []
    transitions:
      - from: COMPLIANT
        to: UNDER_REVIEW
        trigger: "POST /boxes/{id}/compliance-reviews"
        actor: ComplianceOfficer
        preconditions:
          - "Box.compliance_status == COMPLIANT"
          - "Box.service_status IN {ACTIVE, SUSPENDED, CLOSING}"
        side_effects:
          - "creates a ComplianceReview with status OPEN and opened_by_user_id set to the acting X-User-ID"
          - "increments Box.version by 1"
      - from: UNDER_REVIEW
        to: NON_COMPLIANT
        trigger: "POST /compliance-reviews/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "Box.compliance_status == UNDER_REVIEW"
        side_effects:
          - "runs the service_status ACTIVE -> SUSPENDED transition on the same request"
          - "increments Box.version by 1"
      - from: UNDER_REVIEW
        to: COMPLIANT
        trigger: "POST /compliance-reviews/{id}/resolve with resolution CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "Box.compliance_status == UNDER_REVIEW"
          - "ComplianceReview.status == OPEN"
          - "the acting X-User-ID differs from ComplianceReview.opened_by_user_id"
        side_effects:
          - "increments Box.version by 1"
      - from: NON_COMPLIANT
        to: COMPLIANT
        trigger: "POST /compliance-reviews/{id}/resolve with resolution CLEARED"
        actor: ComplianceOfficer
        preconditions:
          - "Box.compliance_status == NON_COMPLIANT"
          - "ComplianceReview.status == SUSPENDED"
          - "the acting X-User-ID differs from ComplianceReview.opened_by_user_id"
        side_effects:
          - "runs the service_status SUSPENDED -> ACTIVE transition on the same request"
          - "increments Box.version by 1"
      - from: NON_COMPLIANT
        to: UNDER_REVIEW
        trigger: "POST /boxes/{id}/compliance-reviews"
        actor: ComplianceOfficer
        preconditions:
          - "Box.compliance_status == NON_COMPLIANT"
          - "no ComplianceReview of this box has status IN {OPEN, SUSPENDED}"
        side_effects:
          - "creates a second ComplianceReview with status OPEN"
          - "increments Box.version by 1"
        note: "Loop edge: the compliance axis re-enters UNDER_REVIEW without passing through COMPLIANT."

  - entity: Recipient
    axis: roster_status
    initial_state: PENDING
    terminal_states: [REMOVED]
    transitions:
      - from: PENDING
        to: AUTHORIZED
        trigger: "POST /form-1583/{id}/accept"
        actor: ComplianceOfficer
        preconditions:
          - "Recipient.roster_status == PENDING"
          - "Form1583.status == NOTARIZED and Form1583.recipient_id == Recipient.id"
        side_effects:
          - "sets Recipient.form_1583_accepted_at to the current logical clock"
          - "appends a UsageLedgerEntry with unit_type RECIPIENT, quantity 1, tranche IN_TIER when the box's AUTHORIZED count after this transition is <= PlanTier.included_recipients + Box.extra_recipient_slots, else tranche OVERAGE at PlanTier.overage_recipient_cents"
          - "re-derives Recipient.release_eligibility"
          - "increments Recipient.version by 1"
      - from: AUTHORIZED
        to: SUSPENDED
        trigger: "system, cascaded from Box.service_status ACTIVE -> SUSPENDED"
        actor: system
        preconditions:
          - "Recipient.roster_status == AUTHORIZED"
        side_effects:
          - "re-derives Recipient.release_eligibility to BLOCKED with blocked_reason GUARANTOR_BLOCKED when the recipient is a MINOR whose guarantor is also suspended"
          - "increments Recipient.version by 1"
      - from: SUSPENDED
        to: AUTHORIZED
        trigger: "system, cascaded from Box.service_status SUSPENDED -> ACTIVE"
        actor: system
        preconditions:
          - "Recipient.roster_status == SUSPENDED"
        side_effects:
          - "re-derives Recipient.release_eligibility"
          - "increments Recipient.version by 1"
        note: "Cycle: AUTHORIZED -> SUSPENDED -> AUTHORIZED."
      - from: PENDING
        to: REMOVED
        trigger: "POST /recipients/{id}/remove"
        actor: CmraOperator
        preconditions:
          - "Recipient.roster_status == PENDING"
          - "no Recipient of this box has guarantor_recipient_id == Recipient.id with roster_status != REMOVED"
        side_effects:
          - "increments Recipient.version by 1"
      - from: AUTHORIZED
        to: REMOVED
        trigger: "POST /recipients/{id}/remove"
        actor: CmraOperator
        preconditions:
          - "Recipient.roster_status == AUTHORIZED"
          - "no MailItem of this box has matched_recipient_id == Recipient.id with handling_status IN {AWAITING_CLEARANCE, HELD, PENDING_DISPOSITION}"
          - "no Recipient of this box has guarantor_recipient_id == Recipient.id with roster_status != REMOVED"
        side_effects:
          - "sets Recipient.release_eligibility to BLOCKED with blocked_reason NO_ACCEPTED_1583"
          - "increments Recipient.version by 1"
      - from: SUSPENDED
        to: REMOVED
        trigger: "POST /recipients/{id}/remove"
        actor: CmraOperator
        preconditions:
          - "Recipient.roster_status == SUSPENDED"
          - "no Recipient of this box has guarantor_recipient_id == Recipient.id with roster_status != REMOVED"
        side_effects:
          - "increments Recipient.version by 1"

  - entity: Recipient
    axis: release_eligibility
    initial_state: BLOCKED
    terminal_states: []
    transitions:
      - from: BLOCKED
        to: RELEASABLE
        trigger: "system, re-derived at the end of POST /form-1583/{id}/accept, POST /id-documents/{id}/verify, POST /_clock/set_current_utc and POST /compliance-reviews/{id}/resolve"
        actor: system
        preconditions:
          - "the recipient has a Form1583 with status ACCEPTED"
          - "governing(PHOTO) and governing(ADDRESS) both exist, where governing(D) is the recipient's IdDocument of doc_class D with status IN {VERIFIED, EXPIRED} and the greatest verified_at, tie-broken by created_at ASC"
          - "governing(PHOTO).status == VERIFIED and governing(ADDRESS).status == VERIFIED"
          - "Recipient.roster_status == AUTHORIZED"
          - "when recipient_kind == MINOR, the guarantor Recipient identified by guarantor_recipient_id has release_eligibility == RELEASABLE"
        side_effects:
          - "sets Recipient.blocked_reason to NONE"
          - "re-derives release_eligibility for every Recipient whose guarantor_recipient_id == Recipient.id"
          - "CASCADE: every MailItem with matched_recipient_id == Recipient.id and handling_status == AWAITING_CLEARANCE moves to HELD"
          - "increments Recipient.version by 1"
      - from: RELEASABLE
        to: BLOCKED
        trigger: "system, re-derived when any precondition above stops holding (id expiry on clock advance, Form1583 expiry, roster suspension, guarantor blocked)"
        actor: system
        preconditions:
          - "at least one of the RELEASABLE preconditions no longer holds"
        side_effects:
          - "sets Recipient.blocked_reason to the first failing clause in the order NO_ACCEPTED_1583, ID_SET_INCOMPLETE, ID_EXPIRED, GUARANTOR_BLOCKED, ROSTER_NOT_AUTHORIZED"
          - "CASCADE: every MailItem with matched_recipient_id == Recipient.id and handling_status == HELD moves back to AWAITING_CLEARANCE"
          - "increments Recipient.version by 1"
        note: "Re-entrant axis: BLOCKED -> RELEASABLE -> BLOCKED -> RELEASABLE is reachable by verifying a fresh ADDRESS document after the old one expires."

  - entity: Form1583
    axis: status
    initial_state: DRAFT
    terminal_states: [REJECTED, EXPIRED]
    transitions:
      - from: DRAFT
        to: NOTARIZED
        trigger: "POST /form-1583/{id}/notarize"
        actor: Notary
        preconditions:
          - "Form1583.status == DRAFT"
        side_effects:
          - "sets Form1583.notarized_at to the current logical clock and notary_user_id to the acting X-User-ID"
          - "increments Form1583.version by 1"
      - from: NOTARIZED
        to: ACCEPTED
        trigger: "POST /form-1583/{id}/accept"
        actor: ComplianceOfficer
        preconditions:
          - "Form1583.status == NOTARIZED"
          - "the acting X-User-ID differs from Form1583.notary_user_id"
          - "the recipient has at least one IdDocument with doc_class PHOTO and status VERIFIED"
        side_effects:
          - "sets accepted_on to the clock date, accepted_by_user_id to the acting X-User-ID and expires_on to accepted_on + FORM_1583_VALIDITY_DAYS days"
          - "CASCADE HOP 2 of chain form_1583_clearance_cascade: Recipient.roster_status PENDING -> AUTHORIZED"
          - "after this recipient's own release_eligibility is re-derived, release_eligibility is re-derived for every Recipient whose guarantor_recipient_id equals this recipient's id"
          - "increments Form1583.version by 1"
        note: "Acceptance requires only the PHOTO document, so a recipient can be ACCEPTED while still missing the ADDRESS document."
      - from: NOTARIZED
        to: REJECTED
        trigger: "POST /form-1583/{id}/reject"
        actor: ComplianceOfficer
        preconditions:
          - "Form1583.status == NOTARIZED"
          - "rejection_reason is supplied"
        side_effects:
          - "sets Form1583.rejection_reason"
          - "increments Form1583.version by 1"
      - from: ACCEPTED
        to: EXPIRED
        trigger: "system, evaluated whenever the logical clock advances"
        actor: system
        preconditions:
          - "the clock date is strictly greater than Form1583.expires_on"
        side_effects:
          - "CASCADE: the owning Recipient re-derives release_eligibility to BLOCKED with blocked_reason NO_ACCEPTED_1583"
          - "increments Form1583.version by 1"

  - entity: IdDocument
    axis: status
    initial_state: PENDING_REVIEW
    terminal_states: [EXPIRED, SUPERSEDED]
    transitions:
      - from: PENDING_REVIEW
        to: VERIFIED
        trigger: "POST /id-documents/{id}/verify"
        actor: CmraOperator
        preconditions:
          - "IdDocument.status == PENDING_REVIEW"
          - "the clock date is <= IdDocument.expires_on"
        side_effects:
          - "sets verified_at to the current logical clock"
          - "every other IdDocument of the same recipient with the same doc_class and status VERIFIED moves to SUPERSEDED"
          - "re-derives the owning Recipient.release_eligibility"
          - "increments IdDocument.version by 1"
      - from: VERIFIED
        to: SUPERSEDED
        trigger: "system, cascaded when a newer IdDocument of the same recipient and doc_class is verified"
        actor: system
        preconditions:
          - "IdDocument.status == VERIFIED"
        side_effects:
          - "increments IdDocument.version by 1"
      - from: VERIFIED
        to: EXPIRED
        trigger: "system, evaluated whenever the logical clock advances"
        actor: system
        preconditions:
          - "the clock date is strictly greater than IdDocument.expires_on + ID_DOC_EXPIRY_GRACE_DAYS days"
        side_effects:
          - "re-derives the owning Recipient.release_eligibility"
          - "increments IdDocument.version by 1"
        note: "Monotone: an EXPIRED or SUPERSEDED document never returns to VERIFIED, even if the clock is later set backwards."
      - from: PENDING_REVIEW
        to: EXPIRED
        trigger: "system, evaluated whenever the logical clock advances"
        actor: system
        preconditions:
          - "the clock date is strictly greater than IdDocument.expires_on + ID_DOC_EXPIRY_GRACE_DAYS days"
        side_effects:
          - "increments IdDocument.version by 1"

  - entity: MailItem
    axis: handling_status
    initial_state: RECEIVED
    terminal_states: [FORWARDED, SHREDDED, DEPOSITED, RETURNED, REFUSED]
    transitions:
      - from: RECEIVED
        to: AWAITING_CLEARANCE
        trigger: "POST /mail-items/{id}/match"
        actor: CmraOperator
        preconditions:
          - "MailItem.handling_status == RECEIVED"
          - "the supplied Recipient belongs to MailItem.box_id and has roster_status IN {PENDING, AUTHORIZED, SUSPENDED}"
          - "the normalized addressee_name equals the recipient's normalized legal_name or one of its normalized dba_aliases, using PAYEE_NORMALIZATION"
          - "the supplied Recipient has release_eligibility == BLOCKED"
        side_effects:
          - "sets MailItem.matched_recipient_id"
          - "increments MailItem.version by 1"
      - from: RECEIVED
        to: HELD
        trigger: "POST /mail-items/{id}/match"
        actor: CmraOperator
        preconditions:
          - "MailItem.handling_status == RECEIVED"
          - "the supplied Recipient belongs to MailItem.box_id and has roster_status IN {PENDING, AUTHORIZED, SUSPENDED}"
          - "the normalized addressee_name equals the recipient's normalized legal_name or one of its normalized dba_aliases, using PAYEE_NORMALIZATION"
          - "the supplied Recipient has release_eligibility == RELEASABLE"
        side_effects:
          - "sets MailItem.matched_recipient_id"
          - "increments MailItem.version by 1"
      - from: RECEIVED
        to: REFUSED
        trigger: "POST /mail-items/{id}/refuse"
        actor: CmraOperator
        preconditions:
          - "MailItem.handling_status == RECEIVED"
          - "refusal_reason is supplied"
        side_effects:
          - "sets MailItem.refusal_reason"
          - "sets storage_status to RELEASED and released_at to the current logical clock"
          - "sets billing_status to WRITTEN_OFF when billing_status == UNBILLED"
          - "increments MailItem.version by 1"
      - from: AWAITING_CLEARANCE
        to: HELD
        trigger: "system, cascaded from Recipient.release_eligibility BLOCKED -> RELEASABLE"
        actor: system
        preconditions:
          - "MailItem.handling_status == AWAITING_CLEARANCE"
          - "the matched Recipient has release_eligibility == RELEASABLE"
        side_effects:
          - "CASCADE HOP 5 of chain form_1583_clearance_cascade; notification_status is NOT touched here, it is owned solely by POST /mail-items/{id}/package-acceptance"
          - "re-evaluates the storage_status axis"
          - "increments MailItem.version by 1"
      - from: HELD
        to: AWAITING_CLEARANCE
        trigger: "system, cascaded from Recipient.release_eligibility RELEASABLE -> BLOCKED"
        actor: system
        preconditions:
          - "MailItem.handling_status == HELD"
          - "the matched Recipient has release_eligibility == BLOCKED"
        side_effects:
          - "increments MailItem.version by 1"
        note: "Cycle edge: HELD -> AWAITING_CLEARANCE -> HELD is reachable by letting a PHOTO document expire and then verifying a fresh one."
      - from: HELD
        to: PENDING_DISPOSITION
        trigger: "POST /mail-items/{id}/dispositions"
        actor: BoxHolder
        preconditions:
          - "MailItem.handling_status == HELD"
        side_effects:
          - "creates a DispositionRequest with status PENDING"
          - "suspends evaluation of the storage_status axis: while handling_status == PENDING_DISPOSITION the FREE_WINDOW -> ACCRUING transition is not evaluated, although total_custody_days keeps counting elapsed clock time"
          - "increments MailItem.version by 1"
      - from: PENDING_DISPOSITION
        to: HELD
        trigger: "POST /dispositions/{id}/cancel, or system cascade when the box is suspended"
        actor: BoxHolder | system
        preconditions:
          - "MailItem.handling_status == PENDING_DISPOSITION"
          - "no DispositionRequest for this item remains in status PENDING after the triggering write"
        side_effects:
          - "CASCADE HOP 4 of chain compliance_suspension_cascade"
          - "CASCADE HOP 5: resumes evaluation of the storage_status axis; when total_custody_days is now strictly greater than PlanTier.included_storage_days the storage_status axis runs FREE_WINDOW -> ACCRUING"
          - "increments MailItem.version by 1"
      - from: PENDING_DISPOSITION
        to: FORWARDED
        trigger: "POST /forward-shipments/{id}/ship"
        actor: CmraOperator
        preconditions:
          - "MailItem.handling_status == PENDING_DISPOSITION"
          - "MailItem.forward_shipment_id == the shipment being shipped"
          - "the item's winning DispositionRequest has disposition_type FORWARD and status PENDING"
        side_effects:
          - "sets the winning DispositionRequest to EXECUTED with resolution_reason EXECUTED"
          - "sets storage_status to RELEASED and released_at to the current logical clock"
          - "increments MailItem.version by 1"
      - from: PENDING_DISPOSITION
        to: SHREDDED
        trigger: "POST /dispositions/{id}/execute with disposition_type SHRED"
        actor: CmraOperator
        preconditions:
          - "MailItem.handling_status == PENDING_DISPOSITION"
          - "the DispositionRequest has disposition_type SHRED and status PENDING"
          - "MailItem.item_class != SOP or the box has no active RegisteredAgentService whose retention period still covers this item"
        side_effects:
          - "sets storage_status to DESTROYED and released_at to the current logical clock"
          - "increments MailItem.version by 1"
      - from: PENDING_DISPOSITION
        to: DEPOSITED
        trigger: "POST /deposit-batches/{id}/close"
        actor: CmraOperator
        preconditions:
          - "MailItem.handling_status == PENDING_DISPOSITION"
          - "the item's winning DispositionRequest has disposition_type DEPOSIT and status PENDING"
          - "a CheckDeposit for this item has status MATCHED and belongs to the batch being closed"
        side_effects:
          - "sets the winning DispositionRequest to EXECUTED"
          - "sets storage_status to RELEASED and released_at to the current logical clock"
          - "increments MailItem.version by 1"
      - from: PENDING_DISPOSITION
        to: RETURNED
        trigger: "POST /dispositions/{id}/execute with disposition_type RETURN"
        actor: CmraOperator
        preconditions:
          - "MailItem.handling_status == PENDING_DISPOSITION"
          - "the DispositionRequest has disposition_type RETURN and status PENDING"
        side_effects:
          - "sets storage_status to RELEASED and released_at to the current logical clock"
          - "increments MailItem.version by 1"

  - entity: MailItem
    axis: storage_status
    initial_state: FREE_WINDOW
    terminal_states: [RELEASED, DESTROYED]
    transitions:
      - from: FREE_WINDOW
        to: ACCRUING
        trigger: "system, evaluated whenever the logical clock advances or when handling_status returns to HELD"
        actor: system
        preconditions:
          - "MailItem.storage_status == FREE_WINDOW"
          - "MailItem.handling_status IN {RECEIVED, AWAITING_CLEARANCE, HELD}"
          - "total_custody_days for this item is strictly greater than PlanTier.included_storage_days"
          - "MailItem.item_class != SOP (SOP items are exempt per SOP_STORAGE_EXEMPT)"
        side_effects:
          - "CASCADE HOP 6 of chain compliance_suspension_cascade: appends a UsageLedgerEntry with unit_type STORAGE_DAY into the box's OPEN BillingCycle and increments BillingCycle.storage_days_consumed"
          - "sets MailItem.billing_status to METERED when it was UNBILLED"
          - "increments MailItem.version by 1"
      - from: FREE_WINDOW
        to: RELEASED
        trigger: "system, cascaded from any handling_status transition into FORWARDED, DEPOSITED, RETURNED or REFUSED"
        actor: system
        preconditions:
          - "MailItem.storage_status == FREE_WINDOW"
        side_effects:
          - "sets released_at and freezes free_storage_days_used and billable_storage_days"
          - "increments MailItem.version by 1"
      - from: ACCRUING
        to: RELEASED
        trigger: "system, cascaded from any handling_status transition into FORWARDED, DEPOSITED, RETURNED or REFUSED"
        actor: system
        preconditions:
          - "MailItem.storage_status == ACCRUING"
        side_effects:
          - "sets released_at and freezes free_storage_days_used and billable_storage_days"
          - "increments MailItem.version by 1"
      - from: FREE_WINDOW
        to: DESTROYED
        trigger: "system, cascaded from handling_status -> SHREDDED"
        actor: system
        preconditions:
          - "MailItem.storage_status == FREE_WINDOW"
        side_effects:
          - "sets released_at"
          - "increments MailItem.version by 1"
      - from: ACCRUING
        to: DESTROYED
        trigger: "system, cascaded from handling_status -> SHREDDED"
        actor: system
        preconditions:
          - "MailItem.storage_status == ACCRUING"
        side_effects:
          - "sets released_at"
          - "increments MailItem.version by 1"

  - entity: MailItem
    axis: billing_status
    initial_state: UNBILLED
    terminal_states: [BILLED, WRITTEN_OFF]
    transitions:
      - from: UNBILLED
        to: METERED
        trigger: "system, on the first UsageLedgerEntry whose mail_item_id is this item"
        actor: system
        preconditions:
          - "MailItem.billing_status == UNBILLED"
        side_effects:
          - "increments MailItem.version by 1"
      - from: METERED
        to: BILLED
        trigger: "POST /boxes/{id}/billing-cycles/close"
        actor: PlatformAdmin
        preconditions:
          - "MailItem.billing_status == METERED"
          - "every UsageLedgerEntry for this item belongs to the BillingCycle being closed"
        side_effects:
          - "increments MailItem.version by 1"
      - from: METERED
        to: WRITTEN_OFF
        trigger: "POST /boxes/{id}/cancellation/finalize when the cancellation was created by an ESCALATED_CLOSURE resolution"
        actor: CmraOperator
        preconditions:
          - "MailItem.billing_status == METERED"
        side_effects:
          - "increments MailItem.version by 1"
      - from: UNBILLED
        to: WRITTEN_OFF
        trigger: "POST /mail-items/{id}/refuse"
        actor: CmraOperator
        preconditions:
          - "MailItem.billing_status == UNBILLED"
        side_effects:
          - "increments MailItem.version by 1"

  - entity: ScanJob
    axis: status
    initial_state: QUEUED
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: QUEUED
        to: IN_PROGRESS
        trigger: "POST /scan-jobs/{id}/start"
        actor: CmraOperator
        preconditions:
          - "ScanJob.status == QUEUED"
        side_effects:
          - "increments ScanJob.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /scan-jobs/{id}/complete"
        actor: CmraOperator
        preconditions:
          - "ScanJob.status == IN_PROGRESS"
        side_effects:
          - "runs the scan_page_charge calculation and writes billed_pages_in_tier, billed_pages_overage and charge_cents"
          - "appends one UsageLedgerEntry with unit_type SCAN_PAGE and tranche IN_TIER when billed_pages_in_tier > 0, and a second with tranche OVERAGE when billed_pages_overage > 0"
          - "increments BillingCycle.scan_pages_consumed by ScanJob.page_count, except when MailItem.item_class == SOP and SOP_SCAN_QUOTA_BYPASS is true, in which case no counter moves and no UsageLedgerEntry is appended"
          - "sets MailItem.billing_status to METERED when it was UNBILLED"
          - "increments ScanJob.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /scan-jobs/{id}/fail"
        actor: CmraOperator
        preconditions:
          - "ScanJob.status == IN_PROGRESS"
          - "ScanJob.retry_count < MAX_SCAN_RETRIES"
        side_effects:
          - "increments ScanJob.version by 1"
      - from: IN_PROGRESS
        to: ABANDONED
        trigger: "POST /scan-jobs/{id}/fail"
        actor: CmraOperator
        preconditions:
          - "ScanJob.status == IN_PROGRESS"
          - "ScanJob.retry_count == MAX_SCAN_RETRIES"
        side_effects:
          - "no UsageLedgerEntry is appended; an abandoned job consumes no quota"
          - "increments ScanJob.version by 1"
      - from: FAILED
        to: QUEUED
        trigger: "POST /scan-jobs/{id}/retry"
        actor: CmraOperator
        preconditions:
          - "ScanJob.status == FAILED"
          - "ScanJob.retry_count < MAX_SCAN_RETRIES"
        side_effects:
          - "increments ScanJob.retry_count by 1"
          - "increments ScanJob.version by 1"
        note: "Cycle: QUEUED -> IN_PROGRESS -> FAILED -> QUEUED, capped at MAX_SCAN_RETRIES loops."

  - entity: DispositionRequest
    axis: status
    initial_state: PENDING
    terminal_states: [EXECUTED, CANCELLED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: EXECUTED
        trigger: "POST /dispositions/{id}/execute, POST /forward-shipments/{id}/ship or POST /deposit-batches/{id}/close"
        actor: CmraOperator
        preconditions:
          - "DispositionRequest.status == PENDING"
          - "the request is the winner on its MailItem, i.e. no other PENDING DispositionRequest on the same item has a strictly lower precedence_rank"
        side_effects:
          - "sets resolution_reason to EXECUTED and executed_at to the current logical clock"
          - "drives the MailItem handling_status into the matching terminal state"
          - "increments DispositionRequest.version by 1"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system, when POST /mail-items/{id}/dispositions creates a request with a strictly lower precedence_rank on the same item"
        actor: system
        preconditions:
          - "DispositionRequest.status == PENDING"
          - "the incoming request has a strictly lower precedence_rank"
        side_effects:
          - "sets resolution_reason to LOST_PRECEDENCE"
          - "increments DispositionRequest.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /dispositions/{id}/cancel, or system cascade from Box.service_status ACTIVE -> SUSPENDED"
        actor: BoxHolder | system
        preconditions:
          - "DispositionRequest.status == PENDING"
        side_effects:
          - "sets resolution_reason to HOLDER_CANCELLED for the endpoint trigger, or GATE_SUSPENSION for the cascade"
          - "CASCADE HOP 4 of chain compliance_suspension_cascade: because no PENDING request remains, the MailItem handling_status returns PENDING_DISPOSITION -> HELD"
          - "increments DispositionRequest.version by 1"

  - entity: ForwardShipment
    axis: status
    initial_state: PRICED
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: PRICED
        to: SHIPPED
        trigger: "POST /forward-shipments/{id}/ship"
        actor: CmraOperator
        preconditions:
          - "ForwardShipment.status == PRICED"
          - "ForwardShipment.item_count >= 1"
        side_effects:
          - "sets shipped_at to the current logical clock"
          - "every MailItem on the shipment moves handling_status PENDING_DISPOSITION -> FORWARDED"
          - "appends one UsageLedgerEntry with unit_type FORWARD, quantity 1, tranche IN_TIER or OVERAGE per the overage_metering calculation"
          - "increments BillingCycle.forwards_consumed by 1"
          - "increments ForwardShipment.version by 1"
      - from: PRICED
        to: CANCELLED
        trigger: "POST /forward-shipments/{id}/cancel"
        actor: BoxHolder
        preconditions:
          - "ForwardShipment.status == PRICED"
        side_effects:
          - "clears forward_shipment_id on every MailItem attached to the shipment"
          - "sets ForwardShipment.item_count to 0"
          - "increments ForwardShipment.version by 1"

  - entity: CheckDeposit
    axis: status
    initial_state: RECEIVED
    terminal_states: [DEPOSITED, RETURNED]
    transitions:
      - from: RECEIVED
        to: MATCHED
        trigger: "POST /deposit-batches/{id}/checks"
        actor: CmraOperator
        preconditions:
          - "the payee_match calculation resolves a Recipient on the same box"
          - "CheckDeposit.endorsed == true"
        side_effects:
          - "sets matched_recipient_id and match_mode to EXACT_LEGAL or ALIAS"
          - "increments DepositBatch.received_amount_cents and held_amount_cents by amount_cents"
          - "increments DepositBatch.version by 1"
      - from: RECEIVED
        to: HELD
        trigger: "POST /deposit-batches/{id}/checks"
        actor: CmraOperator
        preconditions:
          - "the payee_match calculation resolves no Recipient, or CheckDeposit.endorsed == false"
        side_effects:
          - "sets hold_reason to PAYEE_MISMATCH or NOT_ENDORSED"
          - "increments DepositBatch.received_amount_cents and held_amount_cents by amount_cents"
          - "increments DepositBatch.version by 1"
      - from: HELD
        to: MATCHED
        trigger: "POST /check-deposits/{id}/rematch"
        actor: CmraOperator
        preconditions:
          - "CheckDeposit.status == HELD"
          - "the payee_match calculation now resolves a Recipient on the same box"
          - "CheckDeposit.endorsed == true"
        side_effects:
          - "sets matched_recipient_id, match_mode and hold_reason NONE"
          - "increments CheckDeposit.version by 1"
        note: "Re-entry edge: a check held for PAYEE_MISMATCH becomes depositable once the recipient's dba_aliases gain the payee name."
      - from: HELD
        to: RETURNED
        trigger: "POST /check-deposits/{id}/return"
        actor: CmraOperator
        preconditions:
          - "CheckDeposit.status == HELD"
        side_effects:
          - "moves amount_cents from DepositBatch.held_amount_cents to DepositBatch.returned_amount_cents"
          - "increments CheckDeposit.version by 1"
      - from: MATCHED
        to: DEPOSITED
        trigger: "POST /deposit-batches/{id}/close"
        actor: CmraOperator
        preconditions:
          - "CheckDeposit.status == MATCHED"
          - "DepositBatch.closed == false"
        side_effects:
          - "moves amount_cents from DepositBatch.held_amount_cents to DepositBatch.deposited_amount_cents"
          - "drives the MailItem handling_status PENDING_DISPOSITION -> DEPOSITED ONLY when that item is in PENDING_DISPOSITION with a PENDING DEPOSIT DispositionRequest; otherwise the item axes are untouched"
          - "increments CheckDeposit.version by 1"

  - entity: ComplianceReview
    axis: status
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /compliance-reviews/{id}/suspend"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReview.status == OPEN"
          - "Box.service_status == ACTIVE"
        side_effects:
          - "CASCADE HOP 1 of chain compliance_suspension_cascade. The seven hops run in EXACTLY this order and each hop is caused by the one before it."
          - "HOP 1: ComplianceReview.status OPEN -> SUSPENDED"
          - "HOP 2: because the review suspended, Box.service_status ACTIVE -> SUSPENDED (suspended_reason COMPLIANCE_REVIEW) and Box.compliance_status UNDER_REVIEW -> NON_COMPLIANT"
          - "HOP 3: because the box is SUSPENDED, every DispositionRequest whose MailItem.box_id == Box.id and status == PENDING -> CANCELLED with resolution_reason GATE_SUSPENSION"
          - "HOP 4: because no PENDING request remains on them, those MailItems move handling_status PENDING_DISPOSITION -> HELD"
          - "HOP 5: because those MailItems re-entered HELD, their storage_status axis is re-evaluated; any whose total_custody_days is strictly greater than PlanTier.included_storage_days runs FREE_WINDOW -> ACCRUING, appending a STORAGE_DAY UsageLedgerEntry and incrementing BillingCycle.storage_days_consumed"
          - "HOP 6: because the box is SUSPENDED, every Recipient with roster_status AUTHORIZED -> SUSPENDED"
          - "HOP 7: because those Recipients left AUTHORIZED, release_eligibility re-derives RELEASABLE -> BLOCKED, which moves every MailItem of theirs with handling_status HELD -> AWAITING_CLEARANCE"
          - "increments ComplianceReview.version by 1"
      - from: OPEN
        to: RESOLVED
        trigger: "POST /compliance-reviews/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReview.status == OPEN"
          - "the acting X-User-ID differs from ComplianceReview.opened_by_user_id"
          - "resolution is CLEARED"
        side_effects:
          - "sets resolved_by_user_id, resolution and resolved_at"
          - "Box.compliance_status UNDER_REVIEW -> COMPLIANT"
          - "increments ComplianceReview.version by 1"
      - from: SUSPENDED
        to: RESOLVED
        trigger: "POST /compliance-reviews/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "ComplianceReview.status == SUSPENDED"
          - "the acting X-User-ID differs from ComplianceReview.opened_by_user_id"
        side_effects:
          - "sets resolved_by_user_id, resolution and resolved_at"
          - "when resolution == CLEARED, Box.service_status SUSPENDED -> ACTIVE and Box.compliance_status NON_COMPLIANT -> COMPLIANT"
          - "when resolution == ESCALATED_CLOSURE, Box.service_status SUSPENDED -> CLOSING"
          - "increments ComplianceReview.version by 1"

  - entity: CancellationRequest
    axis: status
    initial_state: REQUESTED
    terminal_states: [FINALIZED, WITHDRAWN]
    transitions:
      - from: REQUESTED
        to: FINAL_FORWARD
        trigger: "system, evaluated whenever the logical clock advances"
        actor: system
        preconditions:
          - "CancellationRequest.status == REQUESTED"
          - "the clock date is >= CancellationRequest.notice_end_date"
        side_effects:
          - "increments CancellationRequest.version by 1"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /boxes/{id}/cancellation/withdraw"
        actor: BoxHolder
        preconditions:
          - "CancellationRequest.status == REQUESTED"
        side_effects:
          - "Box.service_status CLOSING -> ACTIVE"
          - "increments CancellationRequest.version by 1"
      - from: FINAL_FORWARD
        to: WITHDRAWN
        trigger: "POST /boxes/{id}/cancellation/withdraw"
        actor: BoxHolder
        preconditions:
          - "CancellationRequest.status == FINAL_FORWARD"
          - "the clock date is <= CancellationRequest.final_forward_deadline"
        side_effects:
          - "Box.service_status CLOSING -> ACTIVE"
          - "increments CancellationRequest.version by 1"
      - from: FINAL_FORWARD
        to: FINALIZED
        trigger: "POST /boxes/{id}/cancellation/finalize"
        actor: CmraOperator
        preconditions:
          - "CancellationRequest.status == FINAL_FORWARD"
          - "the clock date is >= CancellationRequest.destruction_eligible_on"
          - "no SOP MailItem on this box is still inside its RegisteredAgentService retention period"
        side_effects:
          - "runs the refund_waterfall calculation"
          - "Box.service_status CLOSING -> CLOSED"
          - "increments CancellationRequest.version by 1"

  - entity: BillingCycle
    axis: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSING
        trigger: "POST /boxes/{id}/billing-cycles/close"
        actor: PlatformAdmin
        preconditions:
          - "BillingCycle.status == OPEN"
          - "the clock date is >= BillingCycle.period_end"
        side_effects:
          - "freezes plan_tier_id_at_close and base_fee_cents"
          - "runs the overage_metering and box_monthly_charge calculations"
          - "increments BillingCycle.version by 1"
      - from: CLOSING
        to: CLOSED
        trigger: "system, immediately after the CLOSING side effects complete inside the same request"
        actor: system
        preconditions:
          - "BillingCycle.status == CLOSING"
        side_effects:
          - "writes total_charge_cents and debits Box.prepaid_balance_cents by min(total_charge_cents, Box.prepaid_balance_cents)"
          - "every MailItem of the box with billing_status METERED moves to BILLED"
          - "creates the next BillingCycle with cycle_index + 1, status OPEN, period_start == this cycle's period_end, and all four quota counters reset to 0"
          - "increments BillingCycle.version by 1"

concurrency_rules:
  - rule_id: disposition-create-stale-mail-item
    parent_entity: MailItem
    write_endpoint: "POST /mail-items/{id}/dispositions"
    occ_field: "expected_mail_item_version"
    description: |
      Creating a DispositionRequest against a MailItem whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer has already lodged a
      terminal disposition on the piece which, under the precedence rule, may legitimately supersede
      the one being lodged now, so the current writer's view of the piece is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: plan-change-stale-box
    parent_entity: Box
    write_endpoint: "POST /boxes/{id}/plan-change"
    occ_field: "expected_box_version"
    description: |
      Changing the plan tier of a Box whose version has advanced since the client last read it is
      rejected. Proration is computed against the tier and the cycle position the client believed
      were in force, so a stale view would book the wrong credit and charge.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: forward-create-stale-box
    parent_entity: Box
    write_endpoint: "POST /boxes/{id}/forward-shipments"
    occ_field: "expected_box_version"
    description: |
      Creating a ForwardShipment against a Box whose version has advanced since the client last read
      it is rejected. Consolidation pricing and the eligible-item set are derived from the box state
      the client observed, and another writer may already have consolidated some of those pieces.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: check-add-stale-batch
    parent_entity: DepositBatch
    write_endpoint: "POST /deposit-batches/{id}/checks"
    occ_field: "expected_deposit_batch_version"
    description: |
      Adding a CheckDeposit to a DepositBatch whose version has advanced since the client last read
      it is rejected. The per-batch amount and count caps are evaluated against the batch totals the
      client observed, and another writer may already have consumed the remaining headroom.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: package_billable_weight
    trigger: "POST /mail-items/{id}/package-acceptance"
    algorithm: threshold
    formula: |
      dim_weight_lb   = ceil((length_in * width_in * height_in) / CarrierRule.dim_divisor)
      billable_weight_lb = max(actual_weight_lb, dim_weight_lb)
    input_set: "the MailItem being accepted (item_class IN {PACKAGE, SOP}) and the CarrierRule referenced by MailItem.carrier_rule_id"
    constants: {}
    precision: "dim_weight_lb is a whole pound (ceiling); billable_weight_lb keeps 1 decimal place"
    variants:
      - name: ACTUAL_WEIGHT
        when: "actual_weight_lb >= dim_weight_lb"
        difference: "billable_weight_lb == actual_weight_lb; the cubic dimensions never enter the price"
      - name: DIMENSIONAL_WEIGHT
        when: "dim_weight_lb > actual_weight_lb"
        difference: "billable_weight_lb == dim_weight_lb; a light bulky parcel prices above its scale weight"

  - name: package_acceptance_fee
    trigger: "POST /mail-items/{id}/package-acceptance, immediately after package_billable_weight"
    algorithm: tiered_pricing
    formula: |
      if MailItem.item_class == SOP:
          package_acceptance_fee_cents = 0
      else:
          package_acceptance_fee_cents = round_half_up(
              CarrierRule.acceptance_fee_cents
              + billable_weight_lb * CarrierRule.base_rate_cents_per_lb
          )
    input_set: "the MailItem being accepted plus its CarrierRule; SOP items are handled free of charge as part of the registered-agent add-on"
    constants: {}
    precision: "whole cents, round_half_up"
    note: "Combinatorial mode (a): three inputs (acceptance_fee_cents, base_rate_cents_per_lb, billable_weight_lb) with a max() nested inside billable_weight_lb and a conditional branch on item_class."

  - name: package_oversize_check
    trigger: "POST /mail-items/{id}/package-acceptance, before any pricing"
    algorithm: threshold
    formula: |
      girth_in           = 2 * (width_in + height_in)
      length_plus_girth  = length_in + girth_in
      oversize = (length_plus_girth > CarrierRule.max_length_plus_girth_in)
              or (actual_weight_lb  > CarrierRule.max_actual_weight_lb)
    input_set: "the MailItem being accepted and its CarrierRule"
    constants: {}
    precision: "inches and pounds to 1 decimal place"
    note: "Both comparisons are STRICTLY greater: an item exactly at max_length_plus_girth_in is accepted, an item one tenth of an inch above it is refused with ERR_PACKAGE_OVERSIZE."

  - name: scan_job_split
    trigger: "POST /mail-items/{id}/scan-jobs"
    algorithm: aggregation
    formula: |
      job_count = ceil(requested_pages / SCAN_JOB_MAX_PAGES)
      for i in 1 .. job_count:
          page_count(i) = SCAN_JOB_MAX_PAGES              if i < job_count
          page_count(i) = requested_pages - (job_count - 1) * SCAN_JOB_MAX_PAGES   if i == job_count
      split_index(i) = i ; split_group_size = job_count
    input_set: "the single scan request; jobs are created in ascending split_index order"
    constants:
      SCAN_JOB_MAX_PAGES: 25
      SCAN_REQUEST_MAX_PAGES: 200
    precision: "whole pages"
    note: "requested_pages == 25 yields exactly one job (boundary is <=, not <); requested_pages == 26 yields two jobs of 25 and 1. requested_pages > SCAN_REQUEST_MAX_PAGES is rejected with ERR_VALIDATION."

  - name: scan_page_charge
    trigger: "POST /scan-jobs/{id}/complete"
    algorithm: waterfall_allocation
    formula: |
      if MailItem.item_class == SOP and SOP_SCAN_QUOTA_BYPASS:
          billed_pages_in_tier = 0 ; billed_pages_overage = 0 ; charge_cents = 0
      else:
          remaining_included    = max(0, PlanTier.included_scan_pages
                                          - BillingCycle.scan_pages_consumed)
          billed_pages_in_tier  = min(ScanJob.page_count, remaining_included)
          billed_pages_overage  = ScanJob.page_count - billed_pages_in_tier
          multiplier            = SCAN_TIER_MULTIPLIER_COVER    if scan_tier == COVER
                                  SCAN_TIER_MULTIPLIER_INTERIOR if scan_tier == INTERIOR
                                  SCAN_TIER_MULTIPLIER_OCR      if scan_tier == OCR
          charge_cents = billed_pages_overage
                         * PlanTier.overage_scan_page_cents * multiplier
    input_set: "the ScanJob being completed, the box's BillingCycle with status OPEN, and the PlanTier currently in force (Box.plan_tier_id, not pending_plan_tier_id)"
    constants:
      SCAN_TIER_MULTIPLIER_COVER: 1
      SCAN_TIER_MULTIPLIER_INTERIOR: 1
      SCAN_TIER_MULTIPLIER_OCR: 2
      SOP_SCAN_QUOTA_BYPASS: true
    precision: "whole cents"
    variants:
      - name: IN_TIER
        when: "BillingCycle.scan_pages_consumed + ScanJob.page_count <= PlanTier.included_scan_pages"
        difference: "charge_cents == 0 and only an IN_TIER UsageLedgerEntry at unit_rate_cents 0 is appended"
      - name: OVERAGE
        when: "BillingCycle.scan_pages_consumed + ScanJob.page_count > PlanTier.included_scan_pages"
        difference: "the job straddles the allowance; two UsageLedgerEntry rows are appended (IN_TIER for the part inside, OVERAGE for the remainder) and charge_cents is nonzero"

  - name: storage_days
    trigger: "read of any MailItem, and whenever the logical clock advances"
    algorithm: interval_merge
    formula: |
      custody_end = MailItem.released_at            if storage_status IN {RELEASED, DESTROYED}
                    current logical clock           otherwise
      total_custody_days   = floor((custody_end - MailItem.received_at) / 86400 seconds)
      free_storage_days_used  = min(total_custody_days, PlanTier.included_storage_days)
      billable_storage_days   = total_custody_days - free_storage_days_used
    input_set: "the single MailItem plus the PlanTier in force on its box"
    constants:
      SOP_STORAGE_EXEMPT: true
    precision: "whole days, floor"
    variants:
      - name: STANDARD
        when: "MailItem.item_class IN {LETTER, FLAT, PACKAGE}"
        difference: "days beyond included_storage_days are billable"
      - name: SOP_EXEMPT
        when: "MailItem.item_class == SOP and SOP_STORAGE_EXEMPT is true"
        difference: "free_storage_days_used == total_custody_days and billable_storage_days == 0, no matter how long custody runs"
    note: "The FREE_WINDOW -> ACCRUING transition fires only when total_custody_days is STRICTLY greater than included_storage_days: at exactly included_storage_days the item is still free."

  - name: storage_overage_charge
    trigger: "the MailItem storage_status FREE_WINDOW -> ACCRUING transition, and once per additional whole day thereafter"
    algorithm: aggregation
    formula: |
      new_billable_days = billable_storage_days(now) - billable_storage_days(at last metering)
      amount_cents      = new_billable_days * PlanTier.overage_storage_day_cents
    input_set: "the MailItem, its PlanTier, and the UsageLedgerEntry rows already written for this item with unit_type STORAGE_DAY"
    constants: {}
    precision: "whole cents"

  - name: forward_item_price
    trigger: "POST /boxes/{id}/forward-shipments"
    algorithm: tiered_pricing
    formula: |
      for each eligible item:
          bracket_cents = FORWARD_BRACKET_1_CENTS if billable_weight_lb <= FORWARD_BRACKET_1_MAX_LB
                          FORWARD_BRACKET_2_CENTS if billable_weight_lb <= FORWARD_BRACKET_2_MAX_LB
                          FORWARD_BRACKET_3_CENTS if billable_weight_lb <= FORWARD_BRACKET_3_MAX_LB
                          FORWARD_BRACKET_4_CENTS otherwise
          multiplier    = SERVICE_MULTIPLIER_ECONOMY  if service_level == ECONOMY
                          SERVICE_MULTIPLIER_PRIORITY if service_level == PRIORITY
                          SERVICE_MULTIPLIER_EXPRESS  if service_level == EXPRESS
          item_price_cents = round_half_up(bracket_cents * multiplier)
      base_price_cents = sum over eligible items of item_price_cents
    input_set: "the MailItem rows that passed consolidation_eligibility, ordered by MailItem.created_at ASC"
    constants:
      FORWARD_BRACKET_1_MAX_LB: 1.0
      FORWARD_BRACKET_1_CENTS: 850
      FORWARD_BRACKET_2_MAX_LB: 5.0
      FORWARD_BRACKET_2_CENTS: 1750
      FORWARD_BRACKET_3_MAX_LB: 20.0
      FORWARD_BRACKET_3_CENTS: 3900
      FORWARD_BRACKET_4_CENTS: 7200
      SERVICE_MULTIPLIER_ECONOMY: 1.00
      SERVICE_MULTIPLIER_PRIORITY: 1.45
      SERVICE_MULTIPLIER_EXPRESS: 2.20
    precision: "whole cents, round_half_up"
    note: |
      Combinatorial mode (b) — the rounding ORDER is pinned and load-bearing. Each item's price is
      rounded to whole cents BEFORE the sum ("round per line item, then sum"). Summing the unrounded
      products and rounding once at the end is WRONG and produces a different total: three PRIORITY
      items at 1750 cents give round_half_up(2537.5) * 3 == 2538 * 3 == 7614 under the pinned order,
      versus round_half_up(7612.5) == 7613 under sum-then-round. Bracket boundaries are inclusive
      upper bounds: exactly 5.0 lb sits in bracket 2, 5.1 lb sits in bracket 3.

  - name: consolidation_eligibility
    trigger: "POST /boxes/{id}/forward-shipments, before forward_item_price"
    algorithm: constraint_propagation
    formula: |
      an item id supplied in mail_item_ids is ELIGIBLE iff all of:
        MailItem.box_id == the path box_id
        MailItem.handling_status == PENDING_DISPOSITION
        the item's winning DispositionRequest has disposition_type FORWARD and status PENDING
        MailItem.storage_status IN {FREE_WINDOW, ACCRUING}
        MailItem.forward_shipment_id is null
        MailItem.item_class != SOP
        the item's matched Recipient has release_eligibility == RELEASABLE
      eligible items are attached to the shipment; ineligible ones are left off
      item_count          = number of eligible items
      excluded_item_count = number of supplied ids that were ineligible
    input_set: "the mail_item_ids array supplied in the request body"
    constants: {}
    precision: "whole counts"
    note: "Partial consolidation: an ineligible item does NOT abort the shipment and does NOT count toward CONSOLIDATION_MIN_ITEMS. A request in which EVERY supplied id is ineligible is rejected with ERR_ITEM_NOT_CONSOLIDATABLE."

  - name: consolidation_discount
    trigger: "POST /boxes/{id}/forward-shipments, after forward_item_price"
    algorithm: threshold
    formula: |
      if item_count >= CONSOLIDATION_MIN_ITEMS:
          consolidation_discount_cents = round_half_up(base_price_cents * CONSOLIDATION_DISCOUNT_PCT)
      else:
          consolidation_discount_cents = 0
      total_price_cents = base_price_cents - consolidation_discount_cents
    input_set: "the shipment's eligible items only"
    constants:
      CONSOLIDATION_MIN_ITEMS: 3
      CONSOLIDATION_DISCOUNT_PCT: 0.15
    precision: "whole cents, round_half_up"
    note: "Boundary is >=: exactly 3 eligible items earn the discount, 2 eligible items plus 1 excluded item do not."

  - name: notification_sla_due
    trigger: "POST /mail-items/{id}/package-acceptance"
    algorithm: threshold
    formula: |
      if MailItem.item_class == SOP and the box has a RegisteredAgentService with active == true:
          notification_due_at = MailItem.accepted_at + SOP_NOTIFICATION_SLA_HOURS hours
      else:
          notification_due_at = MailItem.accepted_at + NOTIFICATION_SLA_HOURS hours
      notification_status becomes BREACHED when the logical clock is STRICTLY greater than
      notification_due_at while notified_at is still null
    input_set: "the accepted MailItem and the box's RegisteredAgentService, if any"
    constants:
      NOTIFICATION_SLA_HOURS: 24
      SOP_NOTIFICATION_SLA_HOURS: 4
    precision: "whole hours"
    variants:
      - name: STANDARD_PACKAGE
        when: "item_class == PACKAGE, or item_class == SOP with no active RegisteredAgentService"
        difference: "24-hour clock"
      - name: SOP_STATUTORY
        when: "item_class == SOP with an active RegisteredAgentService"
        difference: "4-hour same-business-day clock; the same acceptance instant produces a due time 20 hours earlier"

  - name: payee_match
    trigger: "POST /deposit-batches/{id}/checks and POST /check-deposits/{id}/rematch"
    algorithm: projection
    formula: |
      norm(x) = uppercase(x), trim, collapse internal space runs to one space,
                delete the characters . , ' and -            # PAYEE_NORMALIZATION
      candidates = Recipient rows with box_id == DepositBatch.box_id
                   and roster_status IN {PENDING, AUTHORIZED, SUSPENDED}
      exact = candidates where norm(legal_name) == norm(payee_name_on_check)
      alias = candidates where any a in dba_aliases has norm(a) == norm(payee_name_on_check)
      if exact is non-empty:  matched = exact ordered by created_at ASC, first row ; match_mode = EXACT_LEGAL
      elif alias is non-empty: matched = alias ordered by created_at ASC, first row ; match_mode = ALIAS
      else:                    matched = null ; match_mode = NONE
    input_set: "Recipient rows on the same Box; REMOVED recipients are excluded"
    constants:
      PAYEE_NORMALIZATION: "uppercase, strip leading/trailing spaces, collapse internal runs of spaces to one, delete the characters . , ' and -"
    precision: "exact string equality after normalization; no similarity scoring is used"
    variants:
      - name: EXACT_LEGAL
        when: "at least one candidate's normalized legal_name equals the normalized payee"
        difference: "match_mode == EXACT_LEGAL and the alias set is never consulted, even if an alias on a different recipient also matches"
      - name: ALIAS
        when: "no candidate's legal_name matches but at least one dba_aliases entry does"
        difference: "match_mode == ALIAS; this is the branch a HELD check re-enters through POST /check-deposits/{id}/rematch after an alias is added"

  - name: deposit_caps
    trigger: "POST /deposit-batches/{id}/checks"
    algorithm: threshold
    formula: |
      reject with ERR_DEPOSIT_CAP_EXCEEDED when any holds:
        amount_cents > CHECK_MAX_AMOUNT_CENTS
        DepositBatch.received_amount_cents + amount_cents > BATCH_MAX_TOTAL_CENTS
        DepositBatch.check_count >= BATCH_MAX_CHECKS
      reject with ERR_BATCH_CUTOFF_PASSED when
        hour_utc(current logical clock) >= BATCH_CUTOFF_HOUR_UTC
    input_set: "the batch's current totals plus the incoming check"
    constants:
      CHECK_MAX_AMOUNT_CENTS: 500000
      BATCH_MAX_TOTAL_CENTS: 2500000
      BATCH_MAX_CHECKS: 25
      BATCH_CUTOFF_HOUR_UTC: 21
    precision: "whole cents, whole counts, whole hours"
    note: "A check of exactly CHECK_MAX_AMOUNT_CENTS is accepted (strict >); a batch already holding exactly BATCH_MAX_CHECKS checks rejects the next one (>=); a request at exactly 21:00:00Z is rejected (>=)."

  - name: overage_metering
    trigger: "every consumption event: ScanJob COMPLETED, ForwardShipment SHIPPED, MailItem storage accrual, Recipient AUTHORIZED"
    algorithm: waterfall_allocation
    formula: |
      included(unit_type) = PlanTier.included_scan_pages     for SCAN_PAGE
                            PlanTier.included_forwards       for FORWARD
                            0                                for STORAGE_DAY
                            PlanTier.included_recipients + Box.extra_recipient_slots for RECIPIENT
      # STORAGE_DAY is 0 on purpose: PlanTier.included_storage_days is a PER-ITEM free window that
      # the storage_days calculation has already subtracted, so every day that reaches the ledger is
      # by construction already outside the allowance. Applying included_storage_days a second time
      # here would grant the free window twice.
      consumed(unit_type) = BillingCycle.<unit_type>_consumed before this event
      remaining = max(0, included(unit_type) - consumed(unit_type))
      in_tier   = min(quantity, remaining)
      overage   = quantity - in_tier
      if overage > 0 and PlanTier.allows_overage == false:
          reject the whole request with ERR_QUOTA_EXHAUSTED and write nothing
      append UsageLedgerEntry(unit_type, IN_TIER,  in_tier,  unit_rate_cents = 0)          if in_tier > 0
      append UsageLedgerEntry(unit_type, OVERAGE, overage, unit_rate_cents = overage rate) if overage > 0
      then increment BillingCycle.<unit_type>_consumed by quantity
    input_set: "the OPEN BillingCycle of the box and the PlanTier referenced by Box.plan_tier_id"
    constants: {}
    precision: "whole units and whole cents"
    note: "Conservation invariant quota_tranche_partition: after every event the IN_TIER and OVERAGE quantities for a unit_type sum exactly to BillingCycle.<unit_type>_consumed, and the IN_TIER sum equals min(consumed, included(unit_type)). For STORAGE_DAY that means the IN_TIER sum is always 0 and BillingCycle.storage_days_consumed counts BILLABLE days only."

  - name: roster_capacity
    trigger: "POST /boxes/{id}/recipients"
    algorithm: threshold
    formula: |
      effective_cap = min(PlanTier.included_recipients + Box.extra_recipient_slots, USPS_ROSTER_CAP)
      occupied      = count(Recipient with box_id == Box.id
                            and roster_status IN {PENDING, AUTHORIZED, SUSPENDED})
      reject with ERR_ROSTER_CAP_EXCEEDED when occupied >= effective_cap
    input_set: "Recipient rows on this box; REMOVED recipients free their slot"
    constants:
      USPS_ROSTER_CAP: 12
    precision: "whole counts"
    note: "Boundary is >=: with effective_cap 3 the fourth create is rejected while the third succeeds."

  - name: plan_change_proration
    trigger: "POST /boxes/{id}/plan-change"
    algorithm: chronological
    formula: |
      old_tier = PlanTier referenced by Box.plan_tier_id
      new_tier = PlanTier referenced by the request body
      cycle    = the box's BillingCycle with status OPEN
      days_elapsed   = (clock date - cycle.period_start) in whole days      # >= 0
      days_remaining = PRORATION_DAYS_PER_CYCLE - days_elapsed              # clamped to >= 0

      UPGRADE  (new_tier.rank > old_tier.rank):
          proration_credit_cents = round_half_up(
              old_tier.monthly_fee_cents * days_remaining / PRORATION_DAYS_PER_CYCLE)
          proration_charge_cents = round_half_up(
              new_tier.monthly_fee_cents * days_remaining / PRORATION_DAYS_PER_CYCLE)
          Box.plan_tier_id := new_tier.id immediately
          Box.pending_plan_tier_id := null

      DOWNGRADE (new_tier.rank < old_tier.rank):
          proration_credit_cents = 0
          proration_charge_cents = 0
          Box.plan_tier_id unchanged
          Box.pending_plan_tier_id := new_tier.id     # applied at the next cycle close

      SAME RANK (new_tier.rank == old_tier.rank): rejected with ERR_VALIDATION
    input_set: "the box's OPEN BillingCycle, the old PlanTier and the new PlanTier"
    constants:
      PRORATION_DAYS_PER_CYCLE: 30
    precision: "whole cents, round_half_up, rounded exactly once"
    variants:
      - name: UPGRADE_IMMEDIATE
        when: "new_tier.rank > old_tier.rank"
        difference: "the tier changes in the same request and both proration amounts are booked into the OPEN cycle"
      - name: DOWNGRADE_DEFERRED
        when: "new_tier.rank < old_tier.rank"
        difference: "the tier does NOT change now; the identical request body produces zero proration and a pending change that lands at the next close"
    note: |
      Rounding ORDER is load-bearing and pinned: multiply the WHOLE monthly fee by days_remaining and
      divide by PRORATION_DAYS_PER_CYCLE, then round ONCE. Rounding a daily rate first and then
      multiplying is WRONG: a 6000-cent tier with 11 days remaining gives
      round_half_up(6000 * 11 / 30) == 2200 under the pinned order, versus
      round_half_up(6000/30) * 11 == 200 * 11 == 2200 here but
      a 6100-cent tier gives round_half_up(6100 * 11 / 30) == 2237 versus
      round_half_up(6100/30) * 11 == 203 * 11 == 2233 — a 4-cent divergence.

  - name: downgrade_recipient_truevup
    trigger: "the BillingCycle CLOSING -> CLOSED transition, when Box.pending_plan_tier_id is not null"
    algorithm: aggregation
    formula: |
      Box.plan_tier_id := Box.pending_plan_tier_id ; Box.pending_plan_tier_id := null
      new_cap  = new PlanTier.included_recipients + Box.extra_recipient_slots
      excess   = max(0, Box.roster_authorized_count - new_cap)
      if excess > 0:
          append UsageLedgerEntry into the NEWLY OPENED cycle with unit_type RECIPIENT,
          tranche OVERAGE, quantity = excess,
          unit_rate_cents = new PlanTier.overage_recipient_cents,
          source_event = PLAN_CHANGE
    input_set: "the box's AUTHORIZED recipients and the newly effective PlanTier"
    constants: {}
    precision: "whole counts and whole cents"

  - name: box_monthly_charge
    trigger: "the BillingCycle OPEN -> CLOSING transition"
    algorithm: tiered_pricing
    formula: |
      STEP 1  subtotal_cents = base_fee_cents
                             + overage_total_cents
                             + proration_charge_cents
                             - proration_credit_cents
      STEP 2  pct = LOYALTY_TIER_2_PCT if subtotal_cents >= LOYALTY_TIER_2_MIN_CENTS
                    LOYALTY_TIER_1_PCT if subtotal_cents >= LOYALTY_TIER_1_MIN_CENTS
                    0                  otherwise
              loyalty_discount_cents = round_half_up(subtotal_cents * pct)
      STEP 3  total_charge_cents = subtotal_cents - loyalty_discount_cents
    input_set: "the BillingCycle being closed and its own UsageLedgerEntry rows"
    constants:
      LOYALTY_TIER_1_MIN_CENTS: 15000
      LOYALTY_TIER_1_PCT: 0.05
      LOYALTY_TIER_2_MIN_CENTS: 40000
      LOYALTY_TIER_2_PCT: 0.10
    precision: "whole cents, round_half_up"
    note: |
      Combinatorial mode (c) — circular-looking dependency with a PINNED evaluation order. The
      loyalty tier is keyed on the STEP 1 pre-discount subtotal, never on total_charge_cents.
      Re-keying on the post-discount total would be circular and would demote a subtotal of exactly
      LOYALTY_TIER_2_MIN_CENTS out of its own tier. Tier boundaries are >=: a subtotal of exactly
      40000 earns 10 percent, 39999 earns 5 percent.

  - name: refund_waterfall
    trigger: "POST /boxes/{id}/cancellation/finalize"
    algorithm: waterfall_allocation
    formula: |
      pool = CancellationRequest.prepaid_at_request_cents
           + CancellationRequest.deposit_held_cents
      STEP 1 applied_to_overage_cents = min(pool, Box.outstanding_overage_cents)
      STEP 2 remainder                = pool - applied_to_overage_cents
      STEP 3 forfeited_cents          = remainder when this box has a ComplianceReview with
                                        resolution == ESCALATED_CLOSURE, else 0
      STEP 4 refund_total_cents       = remainder - forfeited_cents
    input_set: "the CancellationRequest snapshots and the box's outstanding overage at finalization"
    constants: {}
    precision: "whole cents"
    note: "Conservation invariant refund_waterfall_conservation: refund_total_cents + applied_to_overage_cents + forfeited_cents == pool, exactly, in every branch."

  - name: cancellation_dates
    trigger: "POST /boxes/{id}/cancellation, and the ESCALATED_CLOSURE side effect that creates one"
    algorithm: interval_merge
    formula: |
      notice_end_date         = requested_on            + NOTICE_PERIOD_DAYS days
      final_forward_deadline  = notice_end_date         + FINAL_FORWARD_WINDOW_DAYS days
      abandonment_date        = final_forward_deadline  + ABANDONMENT_RTS_DAYS days
      destruction_eligible_on = abandonment_date        + RETENTION_FLOOR_DAYS days
    input_set: "the single CancellationRequest"
    constants:
      NOTICE_PERIOD_DAYS: 30
      FINAL_FORWARD_WINDOW_DAYS: 15
      ABANDONMENT_RTS_DAYS: 10
      RETENTION_FLOOR_DAYS: 30
    precision: "whole calendar days"
    note: |
      All four comparisons are inclusive on the lower edge: REQUESTED -> FINAL_FORWARD fires when
      clock_date >= notice_end_date; a withdrawal is allowed while clock_date <= final_forward_deadline;
      return-to-sender applies when clock_date >= abandonment_date; finalization requires
      clock_date >= destruction_eligible_on. requested_on 2026-05-02 therefore yields
      notice_end_date 2026-06-01, final_forward_deadline 2026-06-16, abandonment_date 2026-06-26 and
      destruction_eligible_on 2026-07-26.

  - name: sop_retention_deadline
    trigger: "POST /boxes/{id}/cancellation/finalize and POST /dispositions/{id}/execute with disposition_type SHRED"
    algorithm: threshold
    formula: |
      if MailItem.item_class == SOP and the box has a RegisteredAgentService with active == true:
          retention_until = date(MailItem.received_at) + RegisteredAgentService.retention_days days
      else:
          retention_until = CancellationRequest.destruction_eligible_on
      destruction of the item is refused while clock_date < retention_until
    input_set: "the MailItem, the box's RegisteredAgentService and the box's CancellationRequest"
    constants:
      RA_DEFAULT_RETENTION_DAYS: 1095
    precision: "whole calendar days"
    variants:
      - name: STANDARD_RETENTION
        when: "item_class != SOP, or the box has no active RegisteredAgentService"
        difference: "the item may be destroyed once the cancellation retention floor is reached"
      - name: SOP_STATUTORY_RETENTION
        when: "item_class == SOP with an active RegisteredAgentService"
        difference: "the statutory jurisdiction period survives cancellation and blocks finalization with ERR_RA_RETENTION_ACTIVE, even after destruction_eligible_on has passed"

  - name: release_eligibility_derivation
    trigger: "POST /form-1583/{id}/accept, POST /id-documents/{id}/verify, POST /_clock/set_current_utc, POST /compliance-reviews/{id}/resolve, POST /compliance-reviews/{id}/suspend"
    algorithm: constraint_propagation
    formula: |
      evaluate the clauses in THIS order and stop at the first failure:
        C1 the recipient has a Form1583 with status ACCEPTED     -> else BLOCKED / NO_ACCEPTED_1583
        define governing(D) for D in {PHOTO, ADDRESS} =
             among this recipient's IdDocument rows with doc_class == D and status IN
             {VERIFIED, EXPIRED}, the row with the greatest verified_at;
             tie-break created_at ASC; null when no such row exists
        C2 governing(PHOTO) is not null and governing(ADDRESS) is not null
                                                                  -> else BLOCKED / ID_SET_INCOMPLETE
        C3 governing(PHOTO).status == VERIFIED and governing(ADDRESS).status == VERIFIED
                                                                  -> else BLOCKED / ID_EXPIRED
        C4 recipient_kind != MINOR, or the guarantor Recipient has release_eligibility RELEASABLE
                                                                  -> else BLOCKED / GUARANTOR_BLOCKED
        C5 roster_status == AUTHORIZED                            -> else BLOCKED / ROSTER_NOT_AUTHORIZED
      all clauses pass -> RELEASABLE with blocked_reason NONE
    input_set: "the recipient's Form1583 rows, IdDocument rows and, for MINOR recipients, the guarantor's derived eligibility"
    constants: {}
    precision: "exact clause ordering; the reported blocked_reason is the FIRST failing clause, not the last"
    note: |
      C2 and C3 are separately reachable BECAUSE governing(D) admits EXPIRED rows. C2 fails only
      when a class was never verified at all (Form1583 acceptance needs only a VERIFIED PHOTO, so an
      ACCEPTED form with no ADDRESS document ever filed reaches ID_SET_INCOMPLETE). C3 fails when
      both classes were verified but the governing row of one class has since aged past its
      expires_on. Had C2 been written over status == VERIFIED alone, C3 would have been dead code:
      an expiring document would have removed itself from C2 first.

  - name: id_document_effective_status
    trigger: "read of any IdDocument, and whenever the logical clock advances"
    algorithm: decay_function
    formula: |
      if status IN {EXPIRED, SUPERSEDED}: status is FINAL and never changes again
      elif clock_date > expires_on + ID_DOC_EXPIRY_GRACE_DAYS days: status := EXPIRED
      else: status is unchanged
    input_set: "the single IdDocument and the logical clock"
    constants:
      ID_DOC_EXPIRY_GRACE_DAYS: 0
    precision: "whole calendar days, STRICTLY greater"
    note: "Monotone: a document whose expires_on is 2026-06-30 is still VERIFIED on 2026-06-30 and EXPIRED on 2026-07-01; setting the clock back to 2026-06-15 afterwards does NOT restore VERIFIED."

  - name: effective_gate_state
    trigger: "every gated write, evaluated at ladder priorities 11 and 12"
    algorithm: projection
    formula: |
      if Box.service_status == SUSPENDED:                 release_gate_state = GATED_SUSPENDED
      elif Box.service_status IN {PENDING_SETUP, CLOSED}: release_gate_state = GATED_LIFECYCLE
      else:                                               release_gate_state = OPEN
    input_set: "the single Box"
    constants: {}
    precision: "exact enum"
    note: "Pins the gate_precedence block: the suspension gate is evaluated before the lifecycle gate, and BOTH are evaluated before the Form 1583 gate at priorities 17-19."

  - name: disposition_precedence
    trigger: "POST /mail-items/{id}/dispositions"
    algorithm: topological
    formula: |
      precedence_rank(DEPOSIT) = DISPOSITION_RANK_DEPOSIT
      precedence_rank(FORWARD) = DISPOSITION_RANK_FORWARD
      precedence_rank(RETURN)  = DISPOSITION_RANK_RETURN
      precedence_rank(SHRED)   = DISPOSITION_RANK_SHRED
      let P = the existing DispositionRequest rows on this MailItem with status PENDING
      if P is empty: the incoming request is created PENDING
      elif min(precedence_rank over P) > precedence_rank(incoming):
          every row in P moves to SUPERSEDED with resolution_reason LOST_PRECEDENCE
          and the incoming request is created PENDING
      else:
          reject with ERR_DISPOSITION_CONFLICT
    input_set: "PENDING DispositionRequest rows on the same MailItem"
    constants:
      DISPOSITION_RANK_DEPOSIT: 1
      DISPOSITION_RANK_FORWARD: 2
      DISPOSITION_RANK_RETURN: 3
      DISPOSITION_RANK_SHRED: 4
    precision: "whole ranks; lower rank wins"
    note: "An incoming request of EQUAL rank to a pending one is rejected, not treated as idempotent: SHRED then SHRED gives ERR_DISPOSITION_CONFLICT, while SHRED then DEPOSIT supersedes the shred."

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "the first templated resource in the path exists; the error_id is the one belonging to that resource type (ERR_BOX_NOT_FOUND, ERR_RECIPIENT_NOT_FOUND, ERR_FORM_1583_NOT_FOUND, ERR_ID_DOCUMENT_NOT_FOUND, ERR_MAIL_ITEM_NOT_FOUND, ERR_SCAN_JOB_NOT_FOUND, ERR_DISPOSITION_NOT_FOUND, ERR_FORWARD_SHIPMENT_NOT_FOUND, ERR_DEPOSIT_BATCH_NOT_FOUND, ERR_CHECK_DEPOSIT_NOT_FOUND, ERR_COMPLIANCE_REVIEW_NOT_FOUND, ERR_BILLING_CYCLE_NOT_FOUND)"
    error_id: ERR_BOX_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a templated path segment"
  - priority: 4
    category: existence
    check: "a sub-collection addressed under the primary resource resolves; e.g. POST /boxes/{id}/registered-agent/deactivate requires an existing RegisteredAgentService and POST /boxes/{id}/cancellation/finalize requires an existing CancellationRequest"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /boxes/{id}/registered-agent/deactivate, POST /boxes/{id}/cancellation/withdraw, POST /boxes/{id}/cancellation/finalize, POST /boxes/{id}/billing-cycles/close"
  - priority: 5
    category: existence
    check: "a plan_tier_id or new_plan_tier_id supplied in the request body resolves to a PlanTier"
    error_id: ERR_PLAN_TIER_NOT_FOUND
    http_status: 404
    applies_to: "POST /boxes, POST /boxes/{id}/plan-change"
  - priority: 6
    category: existence
    check: "a carrier_rule_id supplied in the request body resolves to a CarrierRule"
    error_id: ERR_CARRIER_RULE_NOT_FOUND
    http_status: 404
    applies_to: "POST /boxes/{id}/mail-items"
  - priority: 7
    category: existence
    check: "a recipient_id, mail_item_id or guarantor_recipient_id supplied in the request body resolves, and every id inside mail_item_ids resolves to a MailItem"
    error_id: ERR_RECIPIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /mail-items/{id}/match, POST /boxes/{id}/recipients, POST /deposit-batches/{id}/checks, POST /boxes/{id}/forward-shipments"
  - priority: 8
    category: auth
    check: "scope ownership: a BoxHolder's X-User-ID must equal the Box.id the request targets (directly or through the target resource's box_id); a Recipient's X-User-ID must equal MailItem.matched_recipient_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "every endpoint whose roles list includes BoxHolder or Recipient"
  - priority: 9
    category: business_constraint
    check: "every required body field is present with the declared type and inside its declared numeric range (including 1 <= requested_pages <= SCAN_REQUEST_MAX_PAGES, amount_cents >= 1, jurisdiction_code exactly two uppercase letters, new_plan_tier_id.rank != current rank, carrier_rule_id present for item_class IN {PACKAGE, SOP} and absent for LETTER and FLAT)"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "every POST, PUT and PATCH"
  - priority: 10
    category: business_constraint
    check: "every enum-valued body field carries a declared member. This rung applies to EXACTLY these fields and no others: PlanTier.tier_code, CarrierRule.carrier_code, Recipient.recipient_kind, Form1583.rejection_reason, IdDocument.doc_class, IdDocument.doc_type, MailItem.item_class, MailItem.refusal_reason, ScanJob.scan_tier, DispositionRequest.disposition_type, ForwardShipment.service_level, ComplianceReview.reason, ComplianceReview.resolution, and every enum-valued query filter (handling_status, storage_status, roster_status, release_eligibility, status, unit_type, tranche, doc_class, item_class, service_status). No other field routes here; a non-enum field with a bad value routes to ERR_VALIDATION at priority 9."
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "every endpoint that accepts one of the listed fields"
  - priority: 11
    category: business_safety
    check: "GLOBAL GATE A (gate_precedence.box_suspension_gate) — the target Box has service_status SUSPENDED and the operation is in the gate's gated_operations list and is not covered by the SOP carve-out"
    error_id: ERR_BOX_SUSPENDED
    http_status: 409
    applies_to: "the gated_operations list of gate_precedence.box_suspension_gate"
  - priority: 12
    category: state
    check: "GLOBAL GATE B — the target Box has service_status PENDING_SETUP or CLOSED and the operation requires an in-service box"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every write under /boxes/{id}/ and every write on a resource whose box is PENDING_SETUP or CLOSED, except POST /boxes/{id}/activate and POST /boxes/{id}/recipients"
  - priority: 13
    category: state
    check: "the supplied expected_<parent>_version equals the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mail-items/{id}/dispositions, POST /boxes/{id}/plan-change, POST /boxes/{id}/forward-shipments, POST /deposit-batches/{id}/checks"
  - priority: 14
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state machine"
  - priority: 15
    category: auth
    check: "segregation of duties — the acting X-User-ID differs from ComplianceReview.opened_by_user_id on resolve, and from Form1583.notary_user_id on accept"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /compliance-reviews/{id}/resolve, POST /form-1583/{id}/accept"
  - priority: 16
    category: business_referential
    check: "the recipient supplied to match belongs to the item's box, has roster_status != REMOVED, and the normalized addressee_name equals the recipient's normalized legal_name or one of its normalized dba_aliases"
    error_id: ERR_RECIPIENT_NOT_ON_ROSTER
    http_status: 409
    applies_to: "POST /mail-items/{id}/match"
  - priority: 17
    category: business_safety
    check: "GLOBAL GATE C1 (gate_precedence.form_1583_gate, clause C1) — the matched Recipient has no Form1583 with status ACCEPTED"
    error_id: ERR_FORM_1583_INCOMPLETE
    http_status: 409
    applies_to: "the gated_operations list of gate_precedence.form_1583_gate"
  - priority: 18
    category: business_safety
    check: "GLOBAL GATE C2 — the matched Recipient holds an ACCEPTED Form1583 but governing(PHOTO) or governing(ADDRESS) is null, i.e. that document class has never reached VERIFIED"
    error_id: ERR_ID_DOCUMENT_SET_INCOMPLETE
    http_status: 409
    applies_to: "the gated_operations list of gate_precedence.form_1583_gate"
  - priority: 19
    category: business_safety
    check: "GLOBAL GATE C3 — governing(PHOTO) and governing(ADDRESS) both exist but at least one of them has status EXPIRED"
    error_id: ERR_ID_DOCUMENT_EXPIRED
    http_status: 409
    applies_to: "the gated_operations list of gate_precedence.form_1583_gate"
  - priority: 20
    category: business_safety
    check: "an SOP item requires an active RegisteredAgentService on its box before it can be accepted, scanned or notified"
    error_id: ERR_RA_SERVICE_REQUIRED
    http_status: 403
    applies_to: "POST /mail-items/{id}/package-acceptance, POST /mail-items/{id}/scan-jobs, POST /mail-items/{id}/notify when MailItem.item_class == SOP"
  - priority: 21
    category: business_safety
    check: "an INTERIOR or OCR scan requires MailItem.interior_scan_consent == true"
    error_id: ERR_SCAN_CONSENT_REQUIRED
    http_status: 403
    applies_to: "POST /mail-items/{id}/scan-jobs"
  - priority: 22
    category: business_safety
    check: "a signature_required package requires the matched Recipient to have signature_authorization_on_file == true"
    error_id: ERR_SIGNATURE_AUTHORIZATION_MISSING
    http_status: 403
    applies_to: "POST /mail-items/{id}/package-acceptance"
  - priority: 23
    category: business_constraint
    check: "a signature_required package from a carrier whose CarrierRule.accepts_signature_required is false cannot be accepted"
    error_id: ERR_CARRIER_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /mail-items/{id}/package-acceptance"
  - priority: 24
    category: business_constraint
    check: "package_oversize_check does not trip"
    error_id: ERR_PACKAGE_OVERSIZE
    http_status: 422
    applies_to: "POST /mail-items/{id}/package-acceptance"
  - priority: 25
    category: business_referential
    check: "a recipient_kind MINOR carries a guarantor_recipient_id pointing at a non-MINOR recipient on the same box; a non-MINOR recipient carries none"
    error_id: ERR_GUARANTOR_REQUIRED
    http_status: 422
    applies_to: "POST /boxes/{id}/recipients"
  - priority: 26
    category: business_constraint
    check: "roster_capacity does not trip"
    error_id: ERR_ROSTER_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /boxes/{id}/recipients"
  - priority: 27
    category: business_constraint
    check: "disposition_precedence resolves without conflict, i.e. the incoming request's precedence_rank is strictly lower than every PENDING rank on the item"
    error_id: ERR_DISPOSITION_CONFLICT
    http_status: 409
    applies_to: "POST /mail-items/{id}/dispositions"
  - priority: 28
    category: business_constraint
    check: "a retry is refused once the job has been abandoned"
    error_id: ERR_SCAN_RETRY_EXHAUSTED
    http_status: 409
    applies_to: "POST /scan-jobs/{id}/retry"
  - priority: 29
    category: business_temporal
    check: "the logical clock hour (UTC) is strictly less than BATCH_CUTOFF_HOUR_UTC"
    error_id: ERR_BATCH_CUTOFF_PASSED
    http_status: 409
    applies_to: "POST /deposit-batches/{id}/checks"
  - priority: 30
    category: business_referential
    check: "payee_match resolves a Recipient"
    error_id: ERR_PAYEE_MISMATCH
    http_status: 422
    applies_to: "POST /check-deposits/{id}/rematch"
  - priority: 31
    category: business_fiscal
    check: "deposit_caps does not trip on the per-check amount, the per-batch total or the per-batch count"
    error_id: ERR_DEPOSIT_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /deposit-batches/{id}/checks"
  - priority: 32
    category: business_constraint
    check: "at least one supplied mail_item_id passes consolidation_eligibility"
    error_id: ERR_ITEM_NOT_CONSOLIDATABLE
    http_status: 422
    applies_to: "POST /boxes/{id}/forward-shipments"
  - priority: 33
    category: business_constraint
    check: "no CancellationRequest for this box has status REQUESTED or FINAL_FORWARD"
    error_id: ERR_CANCELLATION_ALREADY_PENDING
    http_status: 409
    applies_to: "POST /boxes/{id}/cancellation"
  - priority: 34
    category: business_safety
    check: "sop_retention_deadline has passed for every SOP item still in custody"
    error_id: ERR_RA_RETENTION_ACTIVE
    http_status: 409
    applies_to: "POST /boxes/{id}/cancellation/finalize, POST /dispositions/{id}/execute with disposition_type SHRED"
  - priority: 35
    category: business_temporal
    check: "the clock date is >= CancellationRequest.destruction_eligible_on"
    error_id: ERR_RETENTION_FLOOR_NOT_REACHED
    http_status: 409
    applies_to: "POST /boxes/{id}/cancellation/finalize"
  - priority: 36
    category: business_fiscal
    check: "overage_metering does not need to write an OVERAGE tranche on a PlanTier whose allows_overage is false"
    error_id: ERR_QUOTA_EXHAUSTED
    http_status: 402
    applies_to: "POST /scan-jobs/{id}/complete, POST /forward-shipments/{id}/ship, POST /form-1583/{id}/accept"

endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: sets the server's logical clock. Before any call the logical clock reads exactly 2026-05-01T00:00:00Z (DEFAULT_CLOCK_UTC) and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "re-derives IdDocument.status per id_document_effective_status (monotone)"
      - "re-derives Form1583 ACCEPTED -> EXPIRED"
      - "re-derives Recipient.release_eligibility and cascades MailItem HELD <-> AWAITING_CLEARANCE"
      - "re-derives MailItem storage_status FREE_WINDOW -> ACCRUING and appends STORAGE_DAY usage"
