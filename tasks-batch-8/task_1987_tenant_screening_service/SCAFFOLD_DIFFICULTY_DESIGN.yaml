            - "second verify: identity_status == VERIFIED AND status == DRAFT AND identity_attempts == 2 — captured ${s_pass} == VERIFIED, ${attempts_after} == 2"
            - "after submit: status == SUBMITTED AND identity_status == VERIFIED (identity dimension untouched) AND criteria_id == ${cr} — captured ${status_after} == SUBMITTED, ${identity_after} == VERIFIED, ${pinned} == ${cr}"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: dispute_correction_cascade_reopens_decision
        grounds:
          - state_machines.Dispute.UNDER_REINVESTIGATION_to_RESOLVED_CORRECTED
          - state_machines.ScreeningReport.UNDER_DISPUTE_to_AMENDED
          - calculations.screening_recommendation
          - entities.ScreeningApplication.fields.requires_reconsideration
        distinguishing_aspect: |
          Depth-4 chain originating at dispute resolution: resolve(CORRECTED) mutates the ScreeningRecord
          (DISPUTED -> REMOVED); that mutation flips the ScreeningReport (UNDER_DISPUTE -> AMENDED) and
          recomputes included_record_count; the report mutation re-runs screening_recommendation on the
          ScreeningApplication (RECOMMEND_DENY -> RECOMMEND_APPROVE); the recommendation flip sets
          requires_reconsideration = true. Each hop is caused by the previous hop's mutation, and the
          originating trigger differs from the suspension cascade instance.
