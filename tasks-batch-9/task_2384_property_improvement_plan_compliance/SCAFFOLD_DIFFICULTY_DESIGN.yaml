            - "after the second call: PipPlan.${plan_id}.dispute_state == DISPUTE_RESOLVED_UPHELD and PipPlan.${plan_id}.status == OWNER_ACKNOWLEDGED"
            - "after the third call: PipPlan.${plan_id}.dispute_state == DISPUTE_OPEN and PipPlan.${plan_id}.status == OWNER_ACKNOWLEDGED"
            - "ScopeDispute.${dispute1_id}.status == RESOLVED_UPHELD and ScopeDispute.${dispute2_id}.status == FILED"
            - "PipItem.${gf_id}.approved_cost_cents == 1000000 (UPHOLD moves no cost)"
            - "PipItem.${gf_id}.owner_claimed_cost_cents == 450000 (the most recently filed claim)"
            - "PipPlan.${plan_id}.brand_scoped_total_cents == 1000000 and PipPlan.${plan_id}.owner_claimed_total_cents == 450000"

  # =========================================================================
  # Rule 4 — transitive cascades from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cost_revision_cascade_five_links_to_franchisee_standing
        grounds:
          - state_machines.ScopeDispute.FILED_to_RESOLVED_REVISED
          - state_machines.CapitalBudget.LOCKED_to_UNDERFUNDED
          - calculations.funding_requirement
          - calculations.item_priority_ranking
          - calculations.compliance_risk_score
          - calculations.compliance_posture_derivation
          - entities.FranchiseeAccount.fields.standing
        distinguishing_aspect: |
          Depth-5 cascade triggered by POST /pip/disputes/{id}/resolve with REVISE, where each
          link is caused by the previous one: item.approved_cost_cents -> plan
          funding_requirement and priority ranks -> CapitalBudget LOCKED to UNDERFUNDED ->
          Property risk score and posture -> FranchiseeAccount.standing.
        test_recipe:
          setup:
            - "One property with a plan holding GUEST_FACING item A of 4000000 cents and GUEST_FACING item B of 5000000 cents."
            - "Plan issued and acknowledged; funding_requirement_cents is 10642500 (4730000 + 5912500) at contingency 0.10."
            - "A capital budget authorising exactly 10642500 cents is approved and LOCKED, so funding_gap_cents is 0, the property score is 100 and the franchisee standing is GOOD."
            - "Before the trigger, priority_rank is 1 on item B (5000000) and 2 on item A (4000000)."
            - "The owner has filed a cost dispute on item A claiming 9000000 cents."
          setup_api_calls:
            - call: "POST /pip/franchisee-accounts"
              payload: { legal_name: "Ironwood Hospitality LLC", contact_email: "cap@ironwoodhosp.example" }
              as: BrandManager
