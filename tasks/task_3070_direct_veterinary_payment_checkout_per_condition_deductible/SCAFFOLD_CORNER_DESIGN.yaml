              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - *k_rec
            - &k_clock_dl
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vetpay/appeals/${a_id}/submit-records"
              payload: { medical_record_ids: ["${mr0_id}"] }
              as: HospitalStaff
              as_user_id: "${h_id}"
          assert:
            - "submit at exactly records_due_at succeeds: ClaimAppeal.${a_id}.status == UNDER_REVIEW"
            - "MedicalRecord.${mr0_id}.appeal_id == ${a_id}"

      - name: clock_default_is_fixed_not_wall_clock
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_/vetpay/_clock/set_current_utc
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z: a filing with effective 2026-09-01 can be filed and becomes EFFECTIVE immediately at the default clock, proving no wall-clock fallback."
        test_recipe:
          setup:
            - "Fresh server, no clock call issued."
          setup_api_calls: []
          trigger:
            - &k_def_f
              call: "POST /vetpay/rate-filings"
              payload: { territory_code: "941", state_code: "CA", species: "DOG", base_monthly_premium_cents: 100000, age_band_multipliers: { "0": 1.0 }, filing_effective_date: "2026-09-01", regulator_reference: "CA-2026-DEF" }
              as: RateFilingAdmin
              captures: { df_id: $.data.id }
            - &k_def_file
              call: "POST /vetpay/rate-filings/${df_id}/file"
              payload: {}
              as: RateFilingAdmin
            - &k_def_read
              call: "GET /vetpay/rate-filings/${df_id}"
              payload: {}
              as: RateFilingAdmin
          assert:
            - "file succeeds (filing_effective_date 2026-09-01 is NOT retroactive at the default clock)"
            - "TerritoryRateFiling.${df_id}.status == EFFECTIVE at the default clock 2026-09-01T00:00:00Z"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: adjudication_totals_visible_in_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the adjudicate response body itself carries the fully computed totals and the bumped version; no follow-up read is required to observe the effects."
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting; claim C (50000 DXA) SUBMITTED."
          setup_api_calls:
            - *k_clock
            - *k_f1
            - *k_f1_file
            - *k_hosp
            - *k_approve
            - *k_train
            - *k_pol
            - *k_clock_full
            - *k_claim
          trigger:
            - call: "POST /vetpay/claims/${c_id}/adjudicate"
              payload: { expected_claim_version: "${c_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "the adjudicate 200 response body has status == ADJUDICATED, version == ${c_v} + 1"
            - "the same response body carries eligible_cents == 50000, deductible_applied_cents == 20000, reimbursement_cents == 27000, member_responsibility_cents == 23000"
            - "a subsequent GET /vetpay/claims/${c_id} returns identical totals (no drift between write-response and read)"
