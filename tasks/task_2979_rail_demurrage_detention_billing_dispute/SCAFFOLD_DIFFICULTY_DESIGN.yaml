              as_user_id: "adj-r7i2-a"
            - call: "POST /demurrage/regulatory-complaints"
              payload: { demurrage_dispute_id: "${dsp_id}", complaint_type: "BILLING_PRACTICE", docket_narrative: "Filed after a first-round denial without appealing." }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_appeal: $.data.error_id }
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/disputes/${dsp_id}/appeal"
              payload: { appeal_narrative: "The switch list proves a carrier hold." }
