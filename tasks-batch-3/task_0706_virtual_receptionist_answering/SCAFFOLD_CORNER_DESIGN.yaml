            - "error_id == \"ERR_NO_AVAILABILITY_WINDOW\""
            - "Receptionist.${rec_id}.status == \"OFFLINE\""

      # ---- guarded: go-offline blocked while a call is in progress
      - name: go_offline_with_active_call_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Receptionist.status.AVAILABLE_to_OFFLINE
          - errors[ERR_RECEPTIONIST_BUSY]
          - entities.Receptionist.fields.active_call_count
        distinguishing_aspect: "go-offline while active_call_count > 0 -> ERR_RECEPTIONIST_BUSY (409)."
        test_recipe:
          setup:
            - "Receptionist AVAILABLE with one IN_PROGRESS call (active_call_count 1)."
          setup_api_calls:
            - call: "POST /va/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /va/service-plans"
              payload: { name: "Pbusy", billing_model: "PER_CALL", base_fee_cents: 0, overage_rate_cents: 50, overage_tier2_rate_cents: 50, hard_cap_overage_cents: 100000, included_calls: 100, overage_tier2_threshold: 100 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /va/accounts"
              payload: { business_name: "Busy", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /va/call-scripts"
              payload: { account_id: "${acct_id}", greeting_en: "hi", business_open_minute: 0, business_close_minute: 1440 }
              as: AccountOwner
              as_user_id: "${acct_id}"
              captures: { script_id: $.data.id }
            - call: "POST /va/call-scripts/${script_id}/publish"
              payload: {}
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /va/receptionists"
              payload: { display_name: "Eng", languages: ["EN"], max_concurrent_calls: 5 }
              as: PlatformAdmin
              captures: { rec_id: $.data.id }
            - call: "POST /va/receptionists/${rec_id}/availability-windows"
              payload: { start_minute: 0, end_minute: 1440 }
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/receptionists/${rec_id}/go-online"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls"
              payload: { account_id: "${acct_id}", caller_id: "5550001", requested_language: "EN" }
              as: Receptionist
              as_user_id: "${rec_id}"
              captures: { call_id: $.data.id }
            - call: "POST /va/calls/${call_id}/answer"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
            - call: "POST /va/calls/${call_id}/start"
              payload: {}
              as: Receptionist
              as_user_id: "${rec_id}"
          trigger:
