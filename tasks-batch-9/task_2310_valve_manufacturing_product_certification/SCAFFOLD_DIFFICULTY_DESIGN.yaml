    instances:
      - name: foundry_quality_index_empty_lot_set_reads_one_hundred
        grounds:
          - calculations.foundry_quality_index
          - endpoints[GET /valve-mfg/foundries/{id}]
        distinguishing_aspect: |
          Metric: the foundry quality index over an empty lot set. reject_rate is 0.0000 by definition (not a
          zero score and not a division error), so the index reads exactly 100.00 and the band is ACTIVE —
          the degenerate-denominator boundary, observed on a read endpoint.
        test_recipe:
          setup:
            - "A freshly created foundry with no heat lots and no qualifications at all."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-10", name: "Kappa Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
          trigger:
            - call: "GET /valve-mfg/foundries/${f_id}"
              payload: {}
              as: Any
          assert:
            - "Foundry.${f_id}.total_lot_count == 0"
            - "Foundry.${f_id}.rejected_lot_count == 0"
            - "Foundry.${f_id}.revoked_qualification_count == 0"
            - "Foundry.${f_id}.quality_index == 100.00"
            - "Foundry.${f_id}.status == ACTIVE"

      - name: test_hold_seconds_exact_minimum_at_bore_band_upper_edge
        grounds:
          - calculations.required_test_envelope
          - validations[priority=56]
          - endpoints[POST /valve-mfg/valve-units/{id}/test-records]
        distinguishing_aspect: |
          Metric: required_hold_seconds banded on bore_size_mm. Bore is exactly 150 mm, the upper edge of the
          50 < bore <= 150 band, so the requirement is 60 s and not the next band's 120 s; hold_seconds 60 is
          accepted and 59 is refused. Different metric and a different endpoint from the quality-index instance.
        test_recipe:
          setup:
            - "A RELEASED BALL model at class 300 with bore_size_mm exactly 150 (the band's upper edge)."
            - "A unit built from a released lot's component, advanced to build_status ASSEMBLED."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-11", name: "Lambda Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications"
              payload: { foundry_id: "${f_id}", process: "CASTING", material_grade: "CF8M", max_pressure_class: 600, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: ProcurementSpecialist
              captures: { q_id: $.data.id }
            - call: "POST /valve-mfg/foundry-qualifications/${q_id}/actions"
              payload: { action: "QUALIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-B150", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 150, seat_type: "METAL", base_break_torque_nm: 500.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-1101", material_grade: "CF8M", process: "CASTING", qty_received_kg: 600.000, mtr_document_ref: "MTR-1101", carbon_equivalent_pct: 0.35, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/components"
              payload: { heat_lot_id: "${l_id}", target_model_id: "${m_id}", component_type: "BODY", net_weight_kg: 180.000 }
              as: ProcurementSpecialist
              captures: { c_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses"
              payload: { license_code: "MON-11", facility_code: "FAC-1", scope_valve_types: ["BALL"], lead_auditor_user_id: "aud-1", audit_window_start: "2026-07-01T00:00:00Z", audit_window_end: "2026-07-31T00:00:00Z" }
              as: QualityManager
              captures: { lic_id: $.data.id }
            - call: "POST /valve-mfg/valve-units"
              payload: { model_id: "${m_id}", body_component_id: "${c_id}", monogram_license_id: "${lic_id}", serial_number: "SN-B150-1" }
              as: ProductEngineer
              captures: { u_id: $.data.id }
            - call: "POST /valve-mfg/valve-units/${u_id}/build-actions"
              payload: { action: "ADVANCE", to_build_status: "MACHINED" }
              as: TestTechnician
              as_user_id: "tech-3"
            - call: "POST /valve-mfg/valve-units/${u_id}/build-actions"
              payload: { action: "ADVANCE", to_build_status: "ASSEMBLED" }
              as: TestTechnician
              as_user_id: "tech-3"
          trigger:
            - call: "POST /valve-mfg/valve-units/${u_id}/test-records"
              payload: { test_type: "SHELL", test_bench_code: "BENCH-5", started_at: "2026-08-01T08:00:00Z", ended_at: "2026-08-01T09:00:00Z", test_pressure_bar: 80.0, hold_seconds: 60, result: "PASS" }
              as: TestTechnician
              as_user_id: "tech-3"
              captures: { rec_id: $.data.id, req_hold: $.data.required_hold_seconds }
            - call: "POST /valve-mfg/valve-units/${u_id}/test-records"
              payload: { test_type: "SEAT", test_bench_code: "BENCH-5", started_at: "2026-08-01T09:00:00Z", ended_at: "2026-08-01T10:00:00Z", test_pressure_bar: 60.0, hold_seconds: 59, result: "PASS" }
              as: TestTechnician
              as_user_id: "tech-3"
              captures: { err: $.data.error_id }
          assert:
            - "${req_hold} == 60"
            - "${req_hold} != 120"
            - "TestRecord.${rec_id}.required_pressure_bar == 76.7"
            - "${err} == ERR_TEST_HOLD_TIME_SHORT"
            - "HTTP status == 422"
            - "ValveUnit.${u_id}.cert_status == TESTS_IN_PROGRESS"

      - name: grant_at_exactly_four_open_minor_findings_partitions_closeout
        grounds:
          - validations[priority=74]
          - state_machines.MonogramLicense.APPLIED_to_GRANTED
          - state_machines.MonogramLicense.APPLIED_to_CONDITIONAL
          - calculations.license_compliance_posture
        distinguishing_aspect: |
          Metric: open_minor_finding_count against MINOR_FINDING_CONDITIONAL_THRESHOLD 5. At exactly 4 the
          plain GRANT branch is the legal one and GRANT_CONDITIONAL is refused, proving the partition sits at
          5 rather than 4. Third distinct metric and third distinct endpoint in this rule.
        test_recipe:
          setup:
            - "A license whose audit ran and closed with exactly four open MINOR findings and no MAJOR findings."
          setup_api_calls:
            - call: "POST /valve-mfg/monogram-licenses"
              payload: { license_code: "MON-12", facility_code: "FAC-4", scope_valve_types: ["BUTTERFLY"], lead_auditor_user_id: "aud-3", audit_window_start: "2026-07-01T00:00:00Z", audit_window_end: "2026-07-31T00:00:00Z" }
              as: QualityManager
              captures: { lic_id: $.data.id }
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/actions"
              payload: { action: "START_AUDIT" }
              as: MonogramAuditor
              as_user_id: "aud-3"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/finding-entries"
              payload: { entry_action: "RAISE", severity: "MINOR" }
              as: MonogramAuditor
              as_user_id: "aud-3"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/finding-entries"
              payload: { entry_action: "RAISE", severity: "MINOR" }
              as: MonogramAuditor
              as_user_id: "aud-3"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/finding-entries"
              payload: { entry_action: "RAISE", severity: "MINOR" }
              as: MonogramAuditor
              as_user_id: "aud-3"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/finding-entries"
              payload: { entry_action: "RAISE", severity: "MINOR" }
              as: MonogramAuditor
              as_user_id: "aud-3"
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/actions"
              payload: { action: "CLOSE_AUDIT" }
              as: MonogramAuditor
              as_user_id: "aud-3"
          trigger:
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/actions"
              payload: { action: "GRANT_CONDITIONAL" }
              as: MonogramAuditor
              as_user_id: "aud-3"
              captures: { err: $.data.error_id }
            - call: "POST /valve-mfg/monogram-licenses/${lic_id}/actions"
              payload: { action: "GRANT" }
              as: MonogramAuditor
              as_user_id: "aud-3"
          assert:
            - "${err} == ERR_MINOR_FINDING_THRESHOLD"
            - "HTTP status == 409"
            - "MonogramLicense.${lic_id}.open_minor_finding_count == 4"
            - "MonogramLicense.${lic_id}.license_status == GRANTED"
            - "MonogramLicense.${lic_id}.compliance_posture == COMPLIANT"
            - "MonogramLicense.${lic_id}.conditional_expires_at == null"
            - "MonogramLicense.${lic_id}.granted_at == 2026-08-01T00:00:00Z"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: unit_certification_blocked_by_frozen_license_posture
        grounds:
          - validations[priority=44]
          - calculations.license_compliance_posture
          - state_machines.MonogramLicense.GRANTED_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair ValveUnit <- MonogramLicense: the unit itself is fully TESTS_PASSED and its own dimensions
          permit CERTIFY, yet the transition is refused purely because a *different* entity — its license — has
