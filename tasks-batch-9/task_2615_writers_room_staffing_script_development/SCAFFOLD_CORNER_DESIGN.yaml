            - "Trigger call 3 returns 201 with AvailabilityWindow.${aw14}.writer_id == ${w3} even though the acting role is GuildAdministrator - declaring a window on a writer's behalf is a declared shared operation"
            - "Trigger call 4 returns 200 with Episode.${ep1}.credit_status == SUBMISSIONS_CLOSED and provisional_credit_shares == { ${w1}: 100 }: the GuildAdministrator closes the window without being the season's showrunner"
