      - name: parallel_dimensions_of_one_artifact_case_row_advance_independently
        claim_type: parallel
        grounds:
          - state_machines.ArtifactCase.status
          - state_machines.ArtifactCase.mount_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_status_and_mount_status_are_two_independent_dimensions_of_one_row
          rationale: "The named §1.8 instance drives mount_status to MOUNT_DESIGN and then moves the conservation dimension CONSERVATOR_REVIEW -> APPROVED across it, asserting that neither dimension is reset or blocked by the other."

      - name: the_design_revision_cycle_reverts_the_project_phase_and_denies_requested_windows
        claim_type: cyclic
        grounds:
          - state_machines.ExhibitProject.FABRICATION_to_DESIGN_DEV
          - state_machines.DesignPackage.IN_REVIEW_to_REVISION_REQUESTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / project_phase_reverts_out_of_fabrication_and_then_re_advances
          rationale: "The named §1.8 instance takes the phase out of FABRICATION on a DESIGN_DEV revision, asserts the REQUESTED windows are denied with DESIGN_REVISION_REOPENED, and then re-advances through the same edge."

      - name: the_review_round_has_three_exits_each_with_its_own_side_effect_set
        claim_type: side_effect_execution
        grounds:
          - state_machines.ReviewRound.transitions
          - state_machines.DesignPackage.status
        excluded_because:
          difficulty_instance: non_linear_state_machine / one_open_review_round_has_three_exits_with_three_different_side_effect_sets
          rationale: "The named §1.8 instance drives the same OPEN round to APPROVED, to REVISION_REQUESTED and to VETOED and asserts the three distinct side-effect sets, including the veto counter that freezes the project."

      - name: voiding_an_approved_drawing_cascades_into_the_case_and_the_mount_dimension
        claim_type: side_effect_execution
        grounds:
          - state_machines.ShopDrawing.APPROVED_to_VOID
          - state_machines.ArtifactCase.APPROVED_to_DRAFT
          - state_machines.ArtifactCase.MOUNT_FABRICATED_to_MOUNT_DESIGN
        excluded_because:
          difficulty_instance: transitive_cascade / material_rejection_cascades_four_links_to_the_ledger_and_the_zone_slot_ledger
          rationale: "The named §1.8 instance follows the four-link chain material REJECTED -> drawing VOID -> case DRAFT plus mount step-back -> zone slot released and project ledger reversed."

      - name: completing_an_install_window_promotes_only_its_own_zones_reserved_artifacts
        claim_type: side_effect_execution
        grounds:
          - state_machines.Artifact.RESERVED_to_PLACED
          - state_machines.InstallWindow.IN_PROGRESS_to_COMPLETED
          - entities.GalleryZone.fields.occupancy_state
        excluded_because:
          difficulty_instance: transitive_cascade / window_completion_cascades_to_zone_occupancy_and_only_that_zones_artifacts
          rationale: "The named §1.8 instance completes a window on one zone while a sibling zone of the same project holds its own reserved artifacts, and asserts that only the completed zone's artifacts reach PLACED."

  - section: calculations
    instances:
      - name: the_case_envelope_reads_only_reserved_or_placed_artifacts_of_that_one_case
        claim_type: input_set_filtering
        grounds:
          - calculations.case_environmental_envelope.input_set
          - entities.ArtifactCase.fields.placed_artifact_count
          - entities.ArtifactCase.fields.required_rh_min_pct
        distinguishing_aspect: |
          Three artifacts of the same project exist with three different and
          mutually incompatible conservation bands, and only ONE of them is in the
          input set of case C-01: the second is UNPLACED and the third is placed in a
          sibling case in the same gallery zone. If the implementation aggregates by
          project instead of by assigned_case_id, or forgets the placement_status
          filter, C-01's derived floor rises above 45.0 and its allowed_lux drops
          below 50.0 immediately. The rejected fourth call adds the sharpest test:
          a placement that fails the feasibility gate must leave NO trace in the
          input set, so the envelope after the 422 is byte-for-byte the envelope
          before it and the candidate artifact is still UNPLACED with a null
          assigned_case_id.
        test_recipe:
          setup:
            - "project in DESIGN_DEV; zone Z-A; artifacts 2019.14.3 (45-55 RH, 50 lux, ENHANCED), 2019.14.4 (50-52 RH, 30 lux, ENHANCED) and 2019.14.5 (48-51 RH, 20 lux, HIGH_VALUE); case C-01 (ENHANCED, 50 +/- 2 RH, 50 lux) holding 2019.14.3; case C-02 (HIGH_VALUE, 49.5 +/- 1.0 RH, 20 lux) holding 2019.14.5"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProjectManager
            - call: "POST /exhibit-projects"
