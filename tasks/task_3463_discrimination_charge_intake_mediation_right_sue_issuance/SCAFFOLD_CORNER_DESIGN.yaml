  - section: endpoints
    instances:
      - name: amend_happy_path_bumps_version
        claim_type: standard_crud
        grounds: ["endpoints: POST /eeoc/charges/{id}/amend", "concurrency_rules[charge-amend-stale-version]"]
        distinguishing_aspect: "a well-formed amend with the current version succeeds: version increments 1 -> 2, the untouched fields (basis_codes, employer snapshot) are preserved, and the case_status is unchanged."
        test_recipe:
          setup: ["DOCKETED charge, version 1 captured at creation"]
          setup_api_calls:
            - call: "POST /eeoc/employers"
              payload: { legal_name: "Amend Co", state_code: "FL", employee_count_current: 40 }
              as: IntakeOfficer
              captures: { emp_am2: $.data.id }
