            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "wood", uri: "s3://r4/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager }
          trigger:
            - { call: "POST /arc/applications/${app}/decide", payload: { conditions: [] }, as: Homeowner, as_user_id: "${owner_a}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHORIZED (HTTP 403); application remains UNDER_REVIEW"

      - name: applicant_cannot_vote_on_own_application
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Segregation of duties: the applicant acting as CommitteeMember on their own application is rejected 403 ERR_SEGREGATION_OF_DUTIES; the same ballot from a different owner succeeds."
