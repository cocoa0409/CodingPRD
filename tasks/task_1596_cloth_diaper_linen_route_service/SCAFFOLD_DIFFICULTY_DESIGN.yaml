            - { call: "GET /api/starter-kits?subscription_id=${sub_id}", as: PlatformAdmin, captures: { kit_id: "$.data[0].id" } }
            - { call: "POST /api/starter-kits/${kit_id}/events", payload: { event_type: "ISSUE" }, as: PlantOperator }
