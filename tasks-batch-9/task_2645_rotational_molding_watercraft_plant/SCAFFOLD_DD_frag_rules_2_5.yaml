          than branching (MoldingCycle) or looping through intermediate build
          states (FinishedUnit). Re-entering SEALED is not idempotent — the
          second seal recomputes the quote over a line set that grew while the
          trailer was open, and cube_utilization_pct crossing 60.00 -> 80.00
