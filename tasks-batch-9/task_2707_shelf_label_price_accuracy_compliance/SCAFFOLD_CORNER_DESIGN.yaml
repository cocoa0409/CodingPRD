              as: PricingAdmin
              captures: { jur_can: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S-SI", name: "Single Item Store", jurisdiction_id: "${jur_si}" }
              as: PricingAdmin
              captures: { store_si: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S-100", name: "Per Hundred Store", jurisdiction_id: "${jur_100}" }
              as: PricingAdmin
              captures: { store_100: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S-CAN", name: "Canonical Store", jurisdiction_id: "${jur_can}" }
              as: PricingAdmin
              captures: { store_can: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-SI", jurisdiction_id: "${jur_si}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_si}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_si: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-100", jurisdiction_id: "${jur_100}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_100}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_100: $.data.id }
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-CAN", jurisdiction_id: "${jur_can}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_can}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_can: $.data.id }
          trigger:
            - call: "POST /price-integrity/price-change-files/${file_si}/lines"
              payload: { item_upc: "00000000002001", item_description: "Cheese 12oz", category_code: "DAIRY", old_retail_cents: 1199, new_retail_cents: 1000, net_content_qty: 12, net_content_uom: "OZ" }
              as: PricingAdmin
              captures: { l_si: $.data.id, si_price: $.data.unit_price_display_cents, si_uom: $.data.unit_price_basis_uom, si_qty: $.data.unit_price_basis_qty }
            - call: "POST /price-integrity/price-change-files/${file_100}/lines"
              payload: { item_upc: "00000000002002", item_description: "Napkins 250ct", category_code: "PAPER", old_retail_cents: 1299, new_retail_cents: 1000, net_content_qty: 250, net_content_uom: "CT" }
              as: PricingAdmin
              captures: { l_100: $.data.id, c_price: $.data.unit_price_display_cents, c_uom: $.data.unit_price_basis_uom, c_qty: $.data.unit_price_basis_qty }
            - call: "POST /price-integrity/price-change-files/${file_100}/lines"
              payload: { item_upc: "00000000002003", item_description: "Coffee 26oz", category_code: "GROCERY", old_retail_cents: 599, new_retail_cents: 499, net_content_qty: 26, net_content_uom: "OZ" }
              as: PricingAdmin
              captures: { l_fb: $.data.id, f_price: $.data.unit_price_display_cents, f_uom: $.data.unit_price_basis_uom, f_qty: $.data.unit_price_basis_qty }
            - call: "POST /price-integrity/price-change-files/${file_can}/lines"
              payload: { item_upc: "00000000002004", item_description: "Coffee 26oz", category_code: "GROCERY", old_retail_cents: 599, new_retail_cents: 499, net_content_qty: 26, net_content_uom: "OZ" }
              as: PricingAdmin
              captures: { l_can: $.data.id, k_price: $.data.unit_price_display_cents, k_uom: $.data.unit_price_basis_uom, k_qty: $.data.unit_price_basis_qty }
          assert:
            - "PER_SINGLE_ITEM: ${si_qty} == 1, ${si_uom} == EACH, ${si_price} == 1000 — the 12 OZ net content is ignored entirely"
            - "PER_100_COUNT on a CT item: ${c_qty} == 2.5, ${c_uom} == 100CT, ${c_price} == 400 (1000 / 2.5)"
            - "PER_100_COUNT on a WEIGHT item (fallback): ${f_qty} == 1.625, ${f_uom} == LB, ${f_price} == 307 (499 / 1.625 == 307.0769..., ROUND_HALF_UP at 0 cent-decimals)"
            - "${k_price} == ${f_price} == 307 and ${k_uom} == ${f_uom} == LB — the PER_100_COUNT fallback is byte-identical to PER_UNIT_MEASURE_CANONICAL for non-COUNT families"
            - "None of the four lines has a rounded basis: 1.625 is stored, never 1.63 (1.63 would give 306 and fail this test)"

      - name: corner_label_task_due_at_and_overdue_flag_at_the_exact_instant
        claim_type: correct_result
        grounds:
          - calculations.label_task_due_at
          - entities.LabelTask.fields.due_at
          - entities.LabelTask.fields.overdue
        distinguishing_aspect: "due_at is the owning file's effective_date plus the jurisdiction's grace_period_hours (not the task's scheduled_end_at), and `overdue` is re-derived on every read with an inclusive comparison, so clock_now == due_at is already overdue while one second earlier is not."
        test_recipe:
          setup:
            - "Jurisdiction grace_period_hours 48, file effective_date 2026-08-03T00:00:00Z, so due_at == 2026-08-05T00:00:00Z."
            - "One DISTRIBUTED file, one line, one LabelTask scheduled 2026-08-02T09:00:00Z..10:00:00Z, created at clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", grace_period_hours: 48 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-LA1", full_name: "Lee Label", role_code: "LABEL_ASSOCIATE" }
              as: PricingAdmin
              captures: { la1: $.data.id }
            - call: "POST /price-integrity/associates/${la1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/price-change-files"
              payload: { file_number: "PCF-1001", jurisdiction_id: "${jur_a}", effective_date: "2026-08-03T00:00:00Z", scope_store_ids: ["${store_a}"], priority: "ROUTINE" }
              as: PricingAdmin
              captures: { file_a: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/lines"
              payload: { item_upc: "00000000002001", item_description: "Cheese 12oz", category_code: "DAIRY", old_retail_cents: 1199, new_retail_cents: 1000, net_content_qty: 12, net_content_uom: "OZ" }
              as: PricingAdmin
              captures: { line_1: $.data.id }
            - call: "POST /price-integrity/price-change-files/${file_a}/distribute"
              as: PricingAdmin
              captures: { file_a_v: $.data.version }
            - call: "POST /price-integrity/price-change-files/${file_a}/label-tasks"
              payload: { store_id: "${store_a}", price_change_line_id: "${line_1}", aisle_id: "${aisle_a1}", assigned_associate_id: "${la1}", scheduled_start_at: "2026-08-02T09:00:00Z", scheduled_end_at: "2026-08-02T10:00:00Z", expected_price_change_file_version: "${file_a_v}" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { task_1: $.data.id, due: $.data.due_at, od_at_create: $.data.overdue }
          trigger:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T23:59:59Z" }
              as: PricingAdmin
            - call: "GET /price-integrity/label-tasks/${task_1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { od_before: $.data.overdue }
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PricingAdmin
            - call: "GET /price-integrity/label-tasks/${task_1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { od_at: $.data.overdue }
            - call: "POST /price-integrity/label-tasks/${task_1}/print"
              as: LabelAssociate
              as_user_id: "${la1}"
            - call: "POST /price-integrity/label-tasks/${task_1}/place"
              payload: { observed_shelf_price_cents: 1000 }
              as: LabelAssociate
              as_user_id: "${la1}"
              captures: { od_after_place: $.data.overdue }
          assert:
            - "${due} == 2026-08-05T00:00:00Z (2026-08-03T00:00:00Z + 48h), not 2026-08-02T10:00:00Z"
            - "${od_at_create} == false and ${od_before} == false at 2026-08-04T23:59:59Z"
            - "${od_at} == true at exactly 2026-08-05T00:00:00Z — the comparison is >=, not >"
            - "${od_after_place} == false with the clock still at 2026-08-05T00:00:00Z: placement_status PLACED leaves the {UNPLACED, REJECTED} set, so the second conjunct fails"
            - "GET /price-integrity/label-tasks?store_id=${store_a}&overdue=true returns total_count 1 at 2026-08-05T00:00:00Z before the placement and total_count 0 after it"

      - name: corner_rate_variant_selection_falls_back_to_the_jurisdiction_default
        claim_type: variant_selection
        grounds:
          - calculations.scanner_audit_error_rate.variants
          - entities.Jurisdiction.fields.default_rate_variant
          - entities.ScannerAudit.fields.rate_variant_applied
        distinguishing_aspect: "Both rates are always stored, and only `rate_variant_applied` decides the outcome: on an identical four-line scan set an omitted rate_variant takes the jurisdiction default NET_OVERCHARGE and PASSes, while an explicit GROSS_MISMATCH on the twin audit FAILs — proving the selection is per-call with a jurisdiction fallback, not a global setting."
        test_recipe:
          setup:
            - "Jurisdiction with default_rate_variant NET_OVERCHARGE and scanner_error_rate_threshold_pct 25.0; two aisles so the two audits do not collide on the aisle window rule."
            - "Each audit gets the same four lines: one OVERCHARGE (+199), one UNDERCHARGE (-100), two MATCH."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", default_rate_variant: "NET_OVERCHARGE", scanner_error_rate_threshold_pct: 25.0 }
              as: PricingAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { aisle_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A02", category_code: "BAKERY" }
