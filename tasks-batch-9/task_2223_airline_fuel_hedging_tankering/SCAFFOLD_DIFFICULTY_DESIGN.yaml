            - "HedgeInstrument.${fail_inst_id}.cumulative_hedge_change_usd == -79994.00"
            - "neither instrument leaves accounting_status UNDESIGNATED, so the FAIL raises no PolicyException and HedgePolicy.${policy_id}.open_exception_count == 0"
            - "HedgeProgram.${prog_id}.coverage_pct_delta == 18.18"

      - name: station_days_cover_min_boundary_and_rounding_lift
        grounds:
          - calculations.station_supply_posture
          - entities.Station.fields.days_cover
          - entities.Station.fields.supply_posture
          - entities.HedgePolicy.fields.min_days_cover
        distinguishing_aspect: |
          days_cover is rounded to two decimals BEFORE the tier comparison, so 299999
          gallons over 100000 daily liftings (2.99999) is lifted to 3.00 and lands in
          WATCH rather than SHORT, and 599999 gallons (5.99999) is lifted to 6.00 and
          lands in NORMAL; equality with min_days_cover is WATCH, never SHORT, and
          equality with twice min_days_cover is NORMAL, never WATCH.
        test_recipe:
          setup:
            - "One ACTIVE HedgePolicy with min_days_cover 3.00."
            - "One Station ORD with avg_daily_liftings_gallons 100000, consortium_member false and inventory_gallons 0."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-BP3", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
              as: RiskPolicyAdmin
            - call: "POST /fuel/stations"
              payload: { iata_code: "ORD", name: "Chicago OHare", into_plane_fee_usd_per_gal: 0.0450, avg_daily_liftings_gallons: 100000, consortium_member: false }
              as: RiskPolicyAdmin
              captures: { ord_id: $.data.id }
          trigger:
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 299000, reason: "Step 1: just under the floor" }
              as: FuelOpsController
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 999, reason: "Step 2: one gallon under the floor" }
              as: FuelOpsController
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 1, reason: "Step 3: exactly at the floor" }
              as: FuelOpsController
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 299000, reason: "Step 4: just under twice the floor" }
              as: FuelOpsController
            - call: "POST /fuel/stations/${ord_id}/inventory-adjustments"
              payload: { delta_gallons: 999, reason: "Step 5: one gallon under twice the floor" }
              as: FuelOpsController
          assert:
            - "after step 1: Station.${ord_id}.inventory_gallons == 299000, effective_inventory_gallons == 299000, days_cover == 2.99, supply_posture == SHORT"
            - "after step 2: Station.${ord_id}.inventory_gallons == 299999, days_cover == 3.00, supply_posture == WATCH (rounding lifted 2.99999 to the floor)"
            - "after step 3: Station.${ord_id}.inventory_gallons == 300000, days_cover == 3.00, supply_posture == WATCH (exact equality is never SHORT)"
            - "after step 4: Station.${ord_id}.inventory_gallons == 599000, days_cover == 5.99, supply_posture == WATCH"
            - "after step 5: Station.${ord_id}.inventory_gallons == 599999, days_cover == 6.00, supply_posture == NORMAL (rounding lifted 5.99999 to twice the floor)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: execute_blocked_by_suspended_counterparty
        grounds:
          - validations[priority=15]
          - entities.Counterparty.fields.status
          - errors.ERR_COUNTERPARTY_NOT_APPROVED
          - endpoints.POST_counterparties_id_credit_review
        distinguishing_aspect: |
          The instrument is PROPOSED and its program is ACTIVE, so every state gate on the
          two rows named in the request path is satisfied; execution still fails because a
          third row - the facing Counterparty - was downgraded to credit_rating BB and is
          therefore SUSPENDED. Restoring the rating to A makes the identical call succeed
          with no change to the instrument or the program.
        test_recipe:
          setup:
            - "One ACTIVE HedgeProgram, consumption_basis_gallons 11000000, with one PROPOSED 2000000-gallon SWAP."
            - "The facing Counterparty has been credit-reviewed to BB and is SUSPENDED, credit_limit_usd 1000000.00."
          setup_api_calls:
            - call: "POST /fuel/hedge-policies"
              payload: { policy_code: "FY27-CE1", fiscal_year: 2027, max_coverage_pct: 60.00, min_coverage_pct: 15.00, max_single_counterparty_pct: 45.00, permitted_instrument_types: ["SWAP", "COLLAR", "CALL_OPTION"], max_earnings_volatility_usd: 500000.00, max_tankering_uplift_gallons: 12000, min_days_cover: 3.00, eligible_fleet_types: ["NARROWBODY", "WIDEBODY", "REGIONAL"] }
