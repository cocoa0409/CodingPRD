      - name: negotiation_with_under_review_brand_returns_brand_not_negotiable
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_BRAND_NOT_NEGOTIABLE]
        distinguishing_aspect: "Channel-conflict guard: a brand UNDER_REVIEW (open divestiture) cannot be folded into a combined negotiation -> ERR_BRAND_NOT_NEGOTIABLE."
        test_recipe:
          setup: ["Retailer R; Brand B1 ACTIVE; non-core Brand B2 UNDER_REVIEW via open divestiture"]
          setup_api_calls:
