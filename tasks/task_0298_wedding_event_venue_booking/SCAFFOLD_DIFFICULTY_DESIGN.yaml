scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: provisional_vs_final_event_charge_on_booking
        grounds:
          - calculations.provisional_event_charge
          - calculations.final_event_charge
          - state_machines.Booking.HELD_to_CONFIRMED
          - state_machines.Booking.CONFIRMED_to_GUARANTEED
          - entities.Booking.fields.event_charge_cents
        distinguishing_aspect: |
          Same Booking, two algorithms: provisional uses expected_guest_count (120, floored to
          fb_minimum_cents), final uses guaranteed_count (150, above floor) — event_charge_cents
          changes from 3135200 to 3464600. Domain = Booking event accounting.
        test_recipe:
          setup:
            - "Venue(STANDARD, fm_fee 0.0), DUAL Space cap 200 rental 500000, GOLD Package per_head 15000 fb_min 2000000 svc 0.22 tax 0.08, Coordinator, Client, clock 2026-06-01"
            - "Booking expected_guest_count=120, event 2026-09-12, ceremony+reception holds on the DUAL space, placed and confirmed (deposit 783800 paid)"
            - "All required-COI vendors cleared; about to guarantee guaranteed_count=150"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Lakeside Manor", cancellation_tier: "STANDARD", force_majeure_fee_pct: 0.0 }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "Grand Hall", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 60 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Dana Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Pat Client", email: "pat@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v0: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v1: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v1}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "RECEPTION", expected_booking_version: "${v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/payments"
              payload: { direction: "INBOUND", amount_cents: 783800, method: "ACH" }
              as: FinanceOfficer
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { charge_after_confirm: $.data.event_charge_cents }
          trigger:
            - call: "POST /bookings/${booking_id}/guarantee"
              payload: { guaranteed_count: 150 }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { charge_after_guarantee: $.data.event_charge_cents }
          assert:
            - "Booking.${booking_id}.event_charge_cents == 3135200 immediately after confirm (provisional, F&B floor binds)"
            - "Booking.${booking_id}.event_charge_cents == 3464600 after guarantee (final, 150 heads above floor)"
            - "the two charges differ: 3464600 != 3135200"

      - name: client_cancel_vs_force_majeure_refund_retention
        grounds:
          - calculations.cancellation_refund
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.RescheduleRequest.PROPOSED_to_APPROVED
          - entities.Venue.fields.force_majeure_fee_pct
          - entities.Venue.fields.cancellation_tier
        distinguishing_aspect: |
          Refund retention computed two ways on the Venue policy domain: client cancel uses the
          (tier x status) retention_table (STANDARD/CONFIRMED=0.25 -> retain 195950 of 783800),
          while force-majeure approval uses Venue.force_majeure_fee_pct instead — a different
          conserved-money formula on the same paid amount.
        test_recipe:
          setup:
            - "Two sibling bookings each confirmed with deposit 783800 paid: booking A cancelled by client; booking B reschedule-approved as FORCE_MAJEURE (Venue.force_majeure_fee_pct=0.10)"
            - "Venue cancellation_tier=STANDARD"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Riverbank", cancellation_tier: "STANDARD", force_majeure_fee_pct: 0.10 }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "Hall A", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_a: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "Hall B", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_b: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord X", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Client R", email: "r@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { bkA: $.data.id, a_v1: $.data.version }
            - call: "POST /bookings/${bkA}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { a_v2: $.data.version }
            - call: "POST /bookings/${bkA}/holds"
              payload: { space_id: "${space_a}", block_role: "CEREMONY", expected_booking_version: "${a_v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { a_v3: $.data.version }
            - call: "POST /bookings/${bkA}/holds"
              payload: { space_id: "${space_a}", block_role: "RECEPTION", expected_booking_version: "${a_v3}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${bkA}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${bkA}/payments"
              payload: { direction: "INBOUND", amount_cents: 783800, method: "ACH" }
              as: FinanceOfficer
            - call: "POST /bookings/${bkA}/confirm"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /bookings/${bkA}/cancel"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { a_pay_status: $.data.payment_status }
          assert:
            - "after cancel, the booking's OUTBOUND refund Payment.amount_cents == 587850 (paid 783800 minus retained 195950 at STANDARD/CONFIRMED 0.25)"
            - "Booking.${bkA}.amount_paid_cents == 195950 (net inbound after refund)"
            - "this client-cancel retention (0.25) is NOT the force_majeure_fee_pct (0.10) path"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fb_floor_max_with_service_then_tax_nesting
        grounds:
          - calculations.provisional_event_charge
          - entities.Package.fields.fb_minimum_cents
          - entities.Package.fields.service_charge_pct
          - entities.Package.fields.tax_pct
          - state_machines.Booking.HELD_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a): non-linear with >=3 inputs — fb_subtotal = max(heads*per_head, fb_minimum) feeds
          service = round(fb_subtotal*svc_pct), then tax = round((fb_subtotal+service)*tax_pct); the
          max() floor and the nested service-into-tax dependency make it non-linear in heads.
        test_recipe:
          setup:
            - "GOLD package per_head 15000, fb_min 2000000, svc 0.22, tax 0.08; DUAL space rental 500000; booking expected 120 heads (120*15000=1800000 < 2000000 floor binds)"
            - "Booking placed, deposit paid, confirmed"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V2", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "Hall", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", email: "c2@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v1: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v3: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "RECEPTION", expected_booking_version: "${v3}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/payments"
              payload: { direction: "INBOUND", amount_cents: 783800, method: "ACH" }
              as: FinanceOfficer
          trigger:
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { charge: $.data.event_charge_cents }
          assert:
            - "Booking.${booking_id}.event_charge_cents == 3135200"
            - "fb_subtotal floored to 2000000 (not 1800000), service == 440000, tax == 195200, rental == 500000"

      - name: milestone_waterfall_remainder_to_final
        grounds:
          - calculations.milestone_schedule
          - entities.PaymentMilestone.fields.amount_due_cents
          - entities.PaymentMilestone.fields.sequence
          - state_machines.Booking.HELD_to_CONFIRMED
        distinguishing_aspect: |
          Mode (b): pinned rounding order — deposit=round(total*0.25), interim=round(total*0.35),
          FINAL=total-deposit-interim absorbs the remainder so the three sum EXACTLY to total
          (3135200 = 783800+1097320+1254080); rounding FINAL independently would drift by the residual.
        test_recipe:
          setup:
            - "Same confirmed booking with provisional event_charge_cents == 3135200; three milestones built by milestone_schedule"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V3", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "Hall", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", email: "c3@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v1: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v3: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "RECEPTION", expected_booking_version: "${v3}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/payments"
              payload: { direction: "INBOUND", amount_cents: 783800, method: "ACH" }
              as: FinanceOfficer
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "GET /bookings/${booking_id}/milestones"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
          assert:
            - "milestone sequence 1 (DEPOSIT) amount_due_cents == 783800"
            - "milestone sequence 2 (INTERIM) amount_due_cents == 1097320"
            - "milestone sequence 3 (FINAL) amount_due_cents == 1254080"
            - "sum of the three amount_due_cents == 3135200 (exact, remainder absorbed by FINAL)"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: reschedule_request_negotiation_cycle
        grounds:
          - state_machines.RescheduleRequest.PROPOSED_to_COUNTERED
          - state_machines.RescheduleRequest.COUNTERED_to_PROPOSED
          - entities.RescheduleRequest.fields.supersedes_request_id
          - entities.RescheduleRequest.fields.request_status
        distinguishing_aspect: |
          RescheduleRequest is cyclic: PROPOSED -> COUNTERED -> (client re-proposes a superseding
          round) -> PROPOSED again, with the superseded request flipped to WITHDRAWN. A loop on the
          RescheduleRequest entity, distinct from the parallel-axis Booking machine below.
        test_recipe:
          setup:
            - "Confirmed booking owned by client; client proposes round 1; coordinator counters; client re-proposes round 2 superseding the countered round 1"
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "V4", cancellation_tier: "STANDARD" }
              as: VenueAdmin
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/spaces"
              payload: { name: "Hall", space_kind: "DUAL", max_capacity: 200, base_rental_cents: 500000, turnover_buffer_minutes: 0 }
              as: VenueAdmin
              captures: { space_id: $.data.id }
            - call: "POST /venues/${venue_id}/packages"
              payload: { tier: "GOLD", per_head_cents: 15000, fb_minimum_cents: 2000000, service_charge_pct: 0.22, tax_pct: 0.08 }
              as: VenueAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /venues/${venue_id}/coordinators"
              payload: { full_name: "Coord", active_booking_cap: 8 }
              as: VenueAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "C", email: "c4@x.com" }
              as: VenueAdmin
              captures: { client_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: VenueAdmin
            - call: "POST /bookings"
              payload: { client_id: "${client_id}", venue_id: "${venue_id}", package_id: "${pkg_id}", event_date: "2026-09-12", ceremony_start: "2026-09-12T20:00:00Z", ceremony_end: "2026-09-12T21:00:00Z", reception_start: "2026-09-12T21:00:00Z", reception_end: "2026-09-13T02:00:00Z", expected_guest_count: 120 }
              as: Client
              as_user_id: "${client_id}"
              captures: { booking_id: $.data.id, v1: $.data.version }
            - call: "POST /bookings/${booking_id}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v2: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "CEREMONY", expected_booking_version: "${v2}" }
              as: Coordinator
              as_user_id: "${coord_id}"
              captures: { v3: $.data.version }
            - call: "POST /bookings/${booking_id}/holds"
              payload: { space_id: "${space_id}", block_role: "RECEPTION", expected_booking_version: "${v3}" }
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/place-hold"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/payments"
              payload: { direction: "INBOUND", amount_cents: 783800, method: "ACH" }
              as: FinanceOfficer
            - call: "POST /bookings/${booking_id}/confirm"
              payload: {}
              as: Coordinator
              as_user_id: "${coord_id}"
            - call: "POST /bookings/${booking_id}/reschedule-requests"
              payload: { reason_kind: "CLIENT_REQUEST", proposed_event_date: "2026-10-10", proposed_ceremony_start: "2026-10-10T20:00:00Z", proposed_ceremony_end: "2026-10-10T21:00:00Z", proposed_reception_start: "2026-10-10T21:00:00Z", proposed_reception_end: "2026-10-11T02:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { req1: $.data.id }
            - call: "POST /reschedule-requests/${req1}/counter"
              payload: { proposed_event_date: "2026-10-17", proposed_ceremony_start: "2026-10-17T20:00:00Z", proposed_ceremony_end: "2026-10-17T21:00:00Z", proposed_reception_start: "2026-10-17T21:00:00Z", proposed_reception_end: "2026-10-18T02:00:00Z" }
              as: Coordinator
              as_user_id: "${coord_id}"
          trigger:
            - call: "POST /bookings/${booking_id}/reschedule-requests"
              payload: { reason_kind: "CLIENT_REQUEST", proposed_event_date: "2026-10-24", proposed_ceremony_start: "2026-10-24T20:00:00Z", proposed_ceremony_end: "2026-10-24T21:00:00Z", proposed_reception_start: "2026-10-24T21:00:00Z", proposed_reception_end: "2026-10-25T02:00:00Z", supersedes_request_id: "${req1}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { req2: $.data.id }
          assert:
            - "RescheduleRequest.${req1}.request_status == WITHDRAWN (superseded by round 2)"
            - "RescheduleRequest.${req2}.request_status == PROPOSED (new round, loop back to PROPOSED)"
            - "RescheduleRequest.${req2}.supersedes_request_id == ${req1}"

      - name: booking_parallel_status_axes_evolve_independently
        grounds:
          - state_machines.Booking.HELD_to_CONFIRMED
          - entities.Booking.fields.booking_status
          - entities.Booking.fields.payment_status
        distinguishing_aspect: |
          Booking carries two independent axes: posting a deposit drives payment_status UNPAID->
          DEPOSIT_PAID while booking_status is unaffected (still HELD), then confirm advances
          booking_status HELD->CONFIRMED while payment_status stays DEPOSIT_PAID. Parallel dimensions
          on the Booking entity, distinct from the cyclic RescheduleRequest above.
        test_recipe:
          setup:
            - "Booking placed (HELD); deposit 783800 posted (payment_status DEPOSIT_PAID, booking_status still HELD); then confirmed"
          setup_api_calls:
