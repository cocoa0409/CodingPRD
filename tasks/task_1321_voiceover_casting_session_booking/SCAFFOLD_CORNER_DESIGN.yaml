scaffold_corner_design:
  # ==================================================================
  # Section: entities
  # ==================================================================
  - section: entities
    instances:
      - name: talent_creation_required_fields
        claim_type: creation
        grounds: [entities.Talent]
        distinguishing_aspect: "POST /api/talents with all required fields returns 201 and server-minted id, created_at, version=1"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { t_id: $.data.id, t_version: $.data.version }
          assert:
            - "Talent.id is a UUID"
            - "Talent.version == 1"
            - "Talent.roster_status == ACTIVE"

      - name: talent_missing_required_email_returns_invalid_request
        claim_type: required_field
        grounds: [entities.Talent]
        distinguishing_aspect: "POST /api/talents without email returns ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: talent_default_roster_status_applied
        claim_type: defaults
        grounds: [entities.Talent.fields.roster_status]
        distinguishing_aspect: "roster_status defaults to ACTIVE when omitted (it's source=system so always set)"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { t_id: $.data.id }
          assert:
            - "Talent.roster_status == ACTIVE"

      - name: project_computed_buyout_quote_input_ignored
        claim_type: computed_field
        grounds: [entities.Project.fields.buyout_quote_cents]
        distinguishing_aspect: "Client-supplied buyout_quote_cents in POST /api/projects payload is ignored; field remains null until open_casting computes it"
        test_recipe:
          setup: ["empty DB; client exists"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z", buyout_quote_cents: 999999 }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
          assert:
            - "Project.buyout_quote_cents IS null (input ignored)"

      - name: talent_invalid_enum_returns_invalid_request
        claim_type: type_constraint
        grounds: [entities.Talent.fields.voice_profile]
        distinguishing_aspect: "Invalid enum value for voice_profile returns ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "SUPER_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: project_term_months_required_for_term_usage
        claim_type: type_constraint
        grounds: [entities.Project.fields.term_months]
        distinguishing_aspect: "usage_type=TERM without term_months returns ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["empty DB; client exists"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "TERM", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_nonexistent_talent_returns_not_found
        claim_type: not_found
        grounds: [entities.Talent]
        distinguishing_aspect: "GET /api/talents/{uuid} for non-existent id returns ERR_NOT_FOUND 404"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/talents/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: list_talents_pagination_shape
        claim_type: listing
        grounds: [entities.Talent]
        distinguishing_aspect: "GET /api/talents returns envelope with pagination fields (limit, offset, total_count, has_more)"
        test_recipe:
          setup: ["3 talents exist"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/talents"
              payload: { stage_name: "T1", email: "t1@x.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
            - call: "POST /api/talents"
              payload: { stage_name: "T2", email: "t2@x.com", voice_profile: "FEMALE_LIGHT", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
            - call: "POST /api/talents"
              payload: { stage_name: "T3", email: "t3@x.com", voice_profile: "NONBINARY", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
          trigger:
            - call: "GET /api/talents"
              payload: {}
              as: CastingDirector
          assert:
            - "response.meta has api_request_id"
            - "response has total_count field"
            - "total_count == 3"
            - "has_more == false when limit=10 (default)"

      - name: project_parent_client_link
        claim_type: parent_relationship
        grounds: [entities.Project.parent]
        distinguishing_aspect: "POST /api/projects with non-existent client_id returns ERR_NOT_FOUND"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/projects"
              payload: { client_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

  # ==================================================================
  # Section: state_machines
  # ==================================================================
  - section: state_machines
    instances:
      - name: project_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.Project]
        distinguishing_aspect: "Newly created Project starts in DRAFT"
        test_recipe:
          setup: ["client exists"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
          trigger:
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
          assert:
            - "Project.status == DRAFT"

      - name: project_open_casting_from_casting_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Project.CASTING_to_CAST]
        distinguishing_aspect: "Calling open_casting on a project already in CASTING fails"
        test_recipe:
          setup: ["project in CASTING"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
          trigger:
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: project_terminal_cancelled_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Project]
        distinguishing_aspect: "Cancelled project rejects further transitions (open_casting)"
        test_recipe:
          setup: ["project CANCELLED"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id, p_ver: $.data.version }
            - call: "POST /api/projects/${project_id}/cancel"
              payload: { expected_project_version: "${p_ver}" }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: self_audition_terminal_selected_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.SelfAudition]
        distinguishing_aspect: "SELECTED audition cannot be rejected"
        test_recipe:
          setup: ["audition SELECTED after project cast"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
              payload: { company_name: "Acme", contact_email: "c@acme.com", billing_email: "b@acme.com" }
              as: CastingDirector
              captures: { client_id: $.data.id }
            - call: "POST /api/talents"
              payload: { stage_name: "Vox", email: "v@t.com", voice_profile: "MALE_DEEP", languages: ["en"], union_status: "UNION", base_session_fee_cents: 80000 }
              as: CastingDirector
              captures: { talent_id: $.data.id }
            - call: "POST /api/projects"
              payload: { client_id: "${client_id}", title: "P", product_category: "TECH", usage_type: "DIGITAL", spots_count: 1, brief_text: "b", audition_deadline: "2026-08-10T00:00:00Z" }
              as: Client
              as_user_id: "${client_id}"
              captures: { project_id: $.data.id }
            - call: "POST /api/projects/${project_id}/open_casting"
              payload: {}
              as: CastingDirector
            - call: "POST /api/projects/${project_id}/self_auditions"
              payload: { talent_id: "${talent_id}", audio_file_url: "https://x/a.mp3" }
              as: Talent
              as_user_id: "${talent_id}"
              captures: { aud_id: $.data.id }
            - call: "POST /api/projects/${project_id}/select_talent"
              payload: { self_audition_id: "${aud_id}" }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /api/self_auditions/${aud_id}/reject"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: session_complete_before_end_at_returns_temporal_violation
        claim_type: precondition_enforcement
        grounds: [state_machines.Session.transitions]
        distinguishing_aspect: "Completing a session before end_at returns ERR_TEMPORAL_VIOLATION"
        test_recipe:
          setup: ["session CONFIRMED, clock before end_at"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/clients"
