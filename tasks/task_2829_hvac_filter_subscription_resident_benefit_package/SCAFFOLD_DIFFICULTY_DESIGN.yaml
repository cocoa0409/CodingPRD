          Machine = Subscription, exercising the PARALLEL dimension pair plus the
          installation_posture cycle NON_INSTALL_SUSPECTED -> NON_INSTALL_CONFIRMED ->
          REMEDIATED -> COMPLIANT and the commercial cycle ACTIVE -> SUSPENDED -> ACTIVE.
          The posture dimension keeps advancing while status is SUSPENDED (send-notice and
          confirm both land during suspension), proving neither dimension gates the other.
