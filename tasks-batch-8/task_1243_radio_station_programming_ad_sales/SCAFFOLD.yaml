    input: [station_id, advertiser_name, order_kind, "trade_agreement_id?", flight_start, flight_end, rate_tier, reprice_policy, daypart_targets]
    output: Order
    side_effects: ["created_by_user_id stamped from X-User-ID"]
  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: []
    output: Order
    side_effects: []
  - method: GET
    path: "/orders"
    description: "List orders"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: ["station_id?", "trade_agreement_id?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []
  - method: POST
    path: "/orders/{id}/submit"
    description: "Submit a DRAFT order (creator SalesRep only)"
    roles: [SalesRep]
    code: 200
    input: []
    output: Order
    side_effects: ["status -> SUBMITTED; increments version"]
  - method: POST
    path: "/orders/{id}/approve"
    description: "Approve a SUBMITTED order (approver must differ from creator)"
    roles: [SalesManager]
    code: 200
    input: []
    output: Order
    side_effects: ["status -> APPROVED; increments version"]
  - method: POST
    path: "/orders/{id}/reject"
    description: "Reject a SUBMITTED order"
    roles: [SalesManager]
    code: 200
    input: []
    output: Order
    side_effects: ["status -> REJECTED; increments version"]
  - method: POST
    path: "/orders/{id}/activate"
    description: "Activate an APPROVED order (clock must be inside the flight)"
    roles: [SalesManager]
    code: 200
    input: []
    output: Order
    side_effects: ["status -> ACTIVE; increments version"]
  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an APPROVED/ACTIVE order; cascades spots to CANCELLED with trade REVERSALs"
    roles: [SalesRep, SalesManager]
    code: 200
    input: []
    output: Order
    side_effects: ["status -> CANCELLED; SCHEDULED/MAKE_GOOD_PENDING spots -> CANCELLED; TRADE REVERSAL ledger entries; agreement EXHAUSTED -> ACTIVE when credit freed"]
  - method: POST
    path: "/orders/{id}/complete"
    description: "Complete an ACTIVE order after flight end with no open obligations"
    roles: [SalesManager]
    code: 200
    input: []
    output: Order
    side_effects: ["status -> COMPLETED; increments version"]

  # --- DailyLog ---
  - method: POST
    path: "/logs"
    description: "Create a daily log (DRAFT); unique per (station, log_date)"
    roles: [TrafficDirector]
    code: 201
    input: [station_id, log_date]
    output: DailyLog
    side_effects: ["posture DRAFT"]
  - method: GET
    path: "/logs/{id}"
    description: "Get a log"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: []
    output: DailyLog
    side_effects: []
  - method: GET
    path: "/logs"
    description: "List logs"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: ["station_id?", "clock_id?", "posture?", "log_date?", "limit?", "offset?"]
    output: DailyLog[]
    side_effects: []
  - method: POST
    path: "/logs/{id}/lock"
    description: "Lock a DRAFT log (OCC on expected_log_version); pins the ACTIVE clock covering the weekday"
    roles: [TrafficDirector]
    code: 200
    input: [expected_log_version]
    output: DailyLog
    side_effects: ["posture -> LOCKED; clock_id/clock_version pinned; increments DailyLog.version by 1"]
  - method: POST
    path: "/logs/{id}/music-placements"
    description: "Place a song on a LOCKED log; enforces separation rules and spin caps"
    roles: [ProgramDirector, TrafficDirector]
    code: 201
    input: [song_id, hour]
    output: DailyLog
    side_effects: ["appends to music_placements with next placed_seq; increments DailyLog.version by 1"]
  - method: POST
    path: "/logs/{id}/as-run-import"
    description: "Import the as-run log (LOCKED -> AS_RUN); unlisted SCHEDULED units become missed with discrepancies"
    roles: [TrafficDirector]
    code: 200
    input: [aired_spot_ids, aired_live_read_ids, aired_barter_avail_ids]
    output: DailyLog
    side_effects: ["spot/live-read/avail status sweep; MISSED -> MAKE_GOOD_PENDING + Discrepancy; trade REVERSALs; UNFILLED_BARTER under-coverage sweep; increments DailyLog.version by 1"]
  - method: POST
    path: "/logs/{id}/begin-reconciliation"
    description: "AS_RUN -> RECONCILING"
    roles: [TrafficDirector]
    code: 200
    input: []
    output: DailyLog
    side_effects: ["increments DailyLog.version by 1"]
  - method: POST
    path: "/logs/{id}/reopen"
    description: "RECONCILING -> LOCKED (schedule edits) or RECONCILED -> RECONCILING (re-audit)"
    roles: [TrafficDirector]
    code: 200
    input: []
    output: DailyLog
    side_effects: ["increments DailyLog.version by 1; clears reconciled_by_user_id when reverting from RECONCILED"]
  - method: POST
    path: "/logs/{id}/reconcile"
    description: "RECONCILING -> RECONCILED; requires zero unresolved discrepancies"
    roles: [TrafficDirector]
    code: 200
    input: []
    output: DailyLog
    side_effects: ["reconciled_by_user_id set; increments DailyLog.version by 1"]
  - method: POST
    path: "/logs/{id}/issue-affidavit"
    description: "RECONCILED -> AFFIDAVIT_ISSUED (BillingAdmin; issuer != reconciler); reprices REPRICED spots and computes affidavit_total_cents"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: DailyLog
    side_effects: ["REPRICED_AT_AFFIDAVIT spots repriced; trade ADJUSTMENT deltas appended; affidavit_total_cents computed; affidavit_issued_by_user_id set; increments DailyLog.version by 1"]
  - method: POST
    path: "/logs/{id}/close"
    description: "AFFIDAVIT_ISSUED -> CLOSED"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: DailyLog
    side_effects: ["increments DailyLog.version by 1"]

  # --- Spot ---
  - method: POST
    path: "/spots"
    description: "Book a spot onto a log (OCC on expected_order_version); computes unit rate; optional preemption cascade"
    roles: [SalesRep, TrafficDirector]
    code: 201
    input: [order_id, log_id, daypart, hour, duration_sec, expected_order_version, "unit_rate_override_cents?", "allow_below_floor?", "allow_preemption?", "event_id?"]
    output: Spot
    side_effects: ["spot created SCHEDULED; TRADE DEBIT ledger entry; Order.units_scheduled recomputed; increments Order.version by 1; preemption cascade when requested and hour full"]
  - method: GET
    path: "/spots/{id}"
    description: "Get a spot"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: []
    output: Spot
    side_effects: []
  - method: GET
    path: "/spots"
    description: "List spots (filterable, paginated)"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: ["station_id?", "order_id?", "log_id?", "event_id?", "status?", "daypart?", "limit?", "offset?"]
    output: Spot[]
    side_effects: []
  - method: POST
    path: "/spots/{id}/cancel"
    description: "Cancel a SCHEDULED spot (log posture permitting)"
    roles: [TrafficDirector]
    code: 200
    input: []
    output: Spot
    side_effects: ["status -> CANCELLED; TRADE REVERSAL; Order.units_scheduled recomputed"]
  - method: POST
    path: "/spots/{id}/reschedule"
    description: "Resolve a make-good by creating a successor spot (no preemption allowed)"
    roles: [TrafficDirector]
    code: 201
    input: [target_log_id, target_daypart, target_hour, duration_sec]
    output: Spot
    side_effects: ["original -> RESOLVED; successor Spot created (makeup_of_spot_id set, fresh rate, TRADE -> new DEBIT); linked MISSED_SPOT discrepancy auto-RESOLVED"]
  - method: POST
    path: "/spots/{id}/issue-credit"
    description: "Resolve a make-good by issuing a credit (no successor spot)"
    roles: [BillingAdmin]
    code: 200
    input: ["note?"]
    output: Spot
    side_effects: ["status -> RESOLVED; linked MISSED_SPOT discrepancy auto-RESOLVED"]

  # --- BarterAvail ---
  - method: POST
    path: "/barter-avails"
    description: "Schedule a network barter avail (OCC on expected_clearance_version)"
    roles: [TrafficDirector]
    code: 201
    input: [clearance_id, log_id, hour, duration_sec, expected_clearance_version]
    output: BarterAvail
    side_effects: ["consumes hour SPOT_BREAK pool; increments SyndicationClearance.version by 1"]
  - method: GET
    path: "/barter-avails/{id}"
    description: "Get a barter avail"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: []
    output: BarterAvail
    side_effects: []
  - method: GET
    path: "/barter-avails"
    description: "List barter avails"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: ["station_id?", "clearance_id?", "log_id?", "status?", "limit?", "offset?"]
    output: BarterAvail[]
    side_effects: []

  # --- EndorsementContract ---
  - method: POST
    path: "/endorsement-contracts"
    description: "Create an endorsement contract (DRAFT)"
    roles: [SalesRep]
    code: 201
    input: [station_id, advertiser_name, host_name, program_weekdays, program_start_hour, program_end_hour, reads_per_week, start_date, end_date]
    output: EndorsementContract
    side_effects: ["contracted_reads_total computed"]
  - method: GET
    path: "/endorsement-contracts/{id}"
    description: "Get a contract"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: []
    output: EndorsementContract
    side_effects: []
  - method: GET
    path: "/endorsement-contracts"
    description: "List contracts"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: EndorsementContract[]
    side_effects: []
  - method: POST
    path: "/endorsement-contracts/{id}/activate"
    description: "Activate a DRAFT contract (clock must be inside [start_date, end_date])"
    roles: [SalesManager]
    code: 200
    input: []
    output: EndorsementContract
    side_effects: ["status -> ACTIVE; increments version"]
  - method: POST
    path: "/endorsement-contracts/{id}/close"
    description: "Close after end_date: COMPLETED if reads_completed >= contracted_reads_total else BREACHED"
    roles: [SalesManager]
    code: 200
    input: []
    output: EndorsementContract
    side_effects: ["status -> COMPLETED | BREACHED; increments version"]
  - method: POST
    path: "/endorsement-contracts/{id}/cancel"
    description: "Cancel a contract; cascades SCHEDULED live reads to CANCELLED"
    roles: [SalesRep, SalesManager]
    code: 200
    input: []
    output: EndorsementContract
    side_effects: ["status -> CANCELLED; SCHEDULED LiveReads -> CANCELLED"]

  # --- LiveRead ---
  - method: POST
    path: "/live-reads"
    description: "Schedule a live read inside the contract's program window"
    roles: [TrafficDirector]
    code: 201
    input: [contract_id, log_id, hour, "duration_sec?"]
    output: LiveRead
    side_effects: ["consumes hour LIVE_READ_WINDOW pool"]
  - method: GET
    path: "/live-reads/{id}"
    description: "Get a live read"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: []
    output: LiveRead
    side_effects: []
  - method: GET
    path: "/live-reads"
    description: "List live reads"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: ["station_id?", "contract_id?", "log_id?", "status?", "limit?", "offset?"]
    output: LiveRead[]
    side_effects: []
  - method: POST
    path: "/live-reads/{id}/reschedule"
    description: "Resolve a missed live read by creating a successor inside the program window"
    roles: [TrafficDirector]
    code: 201
    input: [target_log_id, target_hour]
    output: LiveRead
    side_effects: ["original -> RESOLVED; successor created (makeup_of_live_read_id set); linked MISSED_READ discrepancy auto-RESOLVED"]
  - method: POST
    path: "/live-reads/{id}/issue-credit"
    description: "Resolve a missed live read with a credit (no successor)"
    roles: [BillingAdmin]
    code: 200
    input: ["note?"]
    output: LiveRead
    side_effects: ["status -> RESOLVED; linked MISSED_READ discrepancy auto-RESOLVED"]

  # --- Discrepancy ---
  - method: GET
    path: "/discrepancies/{id}"
    description: "Get a discrepancy"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: []
    output: Discrepancy
    side_effects: []
  - method: GET
    path: "/discrepancies"
    description: "List discrepancies"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: ["station_id?", "log_id?", "spot_id?", "live_read_id?", "barter_avail_id?", "status?", "discrepancy_kind?", "limit?", "offset?"]
    output: Discrepancy[]
    side_effects: []
  - method: POST
    path: "/discrepancies/{id}/resolve"
    description: "Explicitly resolve an UNFILLED_BARTER discrepancy"
    roles: [TrafficDirector]
    code: 200
    input: ["note?"]
    output: Discrepancy
    side_effects: ["status -> RESOLVED; log unresolved_discrepancy_count recomputed"]
  - method: POST
    path: "/discrepancies/{id}/waive"
    description: "Waive an UNFILLED_BARTER discrepancy (other kinds -> ERR_DISCREPANCY_NOT_WAIVABLE)"
    roles: [BillingAdmin]
    code: 200
    input: ["note?"]
    output: Discrepancy
    side_effects: ["status -> WAIVED; log unresolved_discrepancy_count recomputed"]

  # --- RemoteEvent (remote broadcast & event sponsorship packages) ---
  - method: POST
    path: "/remote-events"
    description: "Create a remote broadcast sponsorship package (PLANNED)"
    roles: [SalesRep]
    code: 201
    input: [station_id, event_name, sponsor_name, event_date, spot_units_promised, package_price_cents]
    output: RemoteEvent
    side_effects: []
  - method: GET
    path: "/remote-events/{id}"
    description: "Get a remote event"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: []
    output: RemoteEvent
    side_effects: []
  - method: GET
    path: "/remote-events"
    description: "List remote events"
    roles: [ProgramDirector, TrafficDirector, SalesRep, SalesManager, BillingAdmin]
    code: 200
    input: ["station_id?", "status?", "limit?", "offset?"]
    output: RemoteEvent[]
    side_effects: []
  - method: POST
    path: "/remote-events/{id}/confirm"
    description: "Confirm a PLANNED event (event_date must not be in the past)"
    roles: [SalesManager]
    code: 200
    input: []
    output: RemoteEvent
    side_effects: ["status -> CONFIRMED"]
  - method: POST
    path: "/remote-events/{id}/cancel"
    description: "Cancel a PLANNED/CONFIRMED event (tagged spots stand)"
    roles: [SalesManager]
    code: 200
    input: []
    output: RemoteEvent
    side_effects: ["status -> CANCELLED"]
  - method: POST
    path: "/remote-events/{id}/settle"
    description: "Settle a CONFIRMED event once the event date's log has an issued affidavit; DELIVERED iff spots_delivered >= spot_units_promised"
    roles: [SalesManager]
    code: 200
    input: []
    output: RemoteEvent
    side_effects: ["status -> DELIVERED | DEFAULTED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_BAD_REQUEST, http: 400, condition: "Malformed request: missing required field, type mismatch, invalid enum member, incoherent date range (period_end < period_start, flight_end < flight_start, effective_to < effective_from, end_hour <= start_hour), non-positive amounts" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or role unknown" }
  - { id: ERR_ROLE_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint per RBAC matrix" }
  - { id: ERR_NOT_ORDER_OWNER, http: 403, condition: "Order submit (or SalesRep-initiated cancel) by a user other than created_by_user_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Approver == order creator, or affidavit issuer == reconciler" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist (including as-run import ids not on the log)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not declared from the entity's current state (incl. terminal-state lockdown)" }
  - { id: ERR_LOG_POSTURE_BLOCKED, http: 409, condition: "Log posture does not allow the operation (bookings/edits need DRAFT or LOCKED; music placements need LOCKED)" }
  - { id: ERR_ORDER_NOT_ACTIVE, http: 409, condition: "Spot booking against an order not in ACTIVE status" }
  - { id: ERR_UNRESOLVED_DISCREPANCIES, http: 409, condition: "Reconcile attempted while unresolved_discrepancy_count > 0" }
  - { id: ERR_NO_ACTIVE_CLOCK, http: 422, condition: "Log lock finds no ACTIVE FormatClock whose applies_weekdays cover weekday(log_date)" }
  - { id: ERR_TRADE_AGREEMENT_REQUIRED, http: 422, condition: "TRADE order without trade_agreement_id (or CASH order carrying one)" }
  - { id: ERR_TRADE_AGREEMENT_INACTIVE, http: 409, condition: "Trade submit/approve/booking against a SUSPENDED or CLOSED agreement" }
  - { id: ERR_TRADE_CREDIT_EXCEEDED, http: 402, condition: "Projected DEBIT or negative ADJUSTMENT would drive available_cents below 0" }
  - { id: ERR_SONG_NOT_ACTIVE, http: 409, condition: "Music placement references a RETIRED song" }
  - { id: ERR_CATEGORY_RETIRED, http: 409, condition: "Music placement references a song whose category is RETIRED" }
  - { id: ERR_CLEARANCE_NOT_CLEARED, http: 409, condition: "Barter avail scheduling against a clearance not in CLEARED status" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Live read scheduling against a contract not in ACTIVE status" }
  - { id: ERR_SPIN_SEPARATION_VIOLATION, http: 422, condition: "Same-song placement closer than min_song_separation_min (checked before artist separation)" }
  - { id: ERR_ARTIST_SEPARATION_VIOLATION, http: 422, condition: "Same-artist placement closer than min_artist_separation_min" }
  - { id: ERR_CLEARANCE_WINDOW_VIOLATION, http: 422, condition: "Barter avail outside clearance weekday set, hour window, or effective range" }
  - { id: ERR_CONTRACT_WINDOW_VIOLATION, http: 422, condition: "Live read outside contract program weekdays, hour window, or date range" }
  - { id: ERR_DAYPART_HOUR_MISMATCH, http: 422, condition: "Spot hour not in the daypart's DAYPART_HOURS set" }
  - { id: ERR_SPOT_OUTSIDE_FLIGHT, http: 422, condition: "Spot air_date outside the order's [flight_start, flight_end]" }
  - { id: ERR_FLIGHT_WINDOW_INVALID, http: 422, condition: "Clock-gated window check failed at activate/close (order flight or contract window not current)" }
  - { id: ERR_LOG_ALREADY_EXISTS, http: 409, condition: "A DailyLog already exists for (station_id, log_date)" }
  - { id: ERR_CLOCK_WEEKDAY_OVERLAP, http: 409, condition: "Activating a clock whose applies_weekdays intersect another ACTIVE clock of the station" }
  - { id: ERR_RATE_WINDOW_OVERLAP, http: 409, condition: "New ACTIVE rate card entry overlaps an existing ACTIVE entry on (station, daypart) with intersecting weekday_set and effective window" }
  - { id: ERR_CLEARANCE_WINDOW_OVERLAP, http: 409, condition: "Clearing a clearance whose weekday set, half-open hour window, and effective range all intersect a CLEARED clearance" }
  - { id: ERR_CATEGORY_SPIN_CAP_EXCEEDED, http: 422, condition: "Placement would exceed the song's category max_spins_per_day for the log" }
  - { id: ERR_DISCREPANCY_NOT_WAIVABLE, http: 422, condition: "Waive (or explicit resolve) attempted on MISSED_SPOT/MISSED_READ; only UNFILLED_BARTER is manually resolvable/waivable" }
  - { id: ERR_DAYPART_UNITS_EXHAUSTED, http: 422, condition: "Booking would exceed the order's daypart_targets units for that daypart" }
  - { id: ERR_PREEMPTION_NOT_ALLOWED, http: 409, condition: "allow_preemption requested for an order whose rate_tier is not FIXED" }
  - { id: ERR_HOUR_CAPACITY_EXCEEDED, http: 409, condition: "Hour pool (units or seconds) cannot fit the new unit even after permitted preemption" }
  - { id: ERR_NO_RATE_CARD, http: 422, condition: "No ACTIVE RateCardEntry matches (station, daypart, weekday, air_date)" }
  - { id: ERR_RATE_FLOOR_VIOLATION, http: 422, condition: "unit_rate_override_cents below min_rate_cents without SalesManager allow_below_floor" }

# =============================================================================
# Table 7: RBAC Matrix (all roles opaque — no persisted user entity)
# =============================================================================
roles:
  - name: ProgramDirector
    description: "Programming side: format clocks, music library & categories, syndication clearances, music placements"
    identity: opaque
    exclusive_operations:
      - "POST /clocks, POST /clocks/{id}/activate, POST /clocks/{id}/retire"
      - "POST /music-categories, POST /music-categories/{id}/retire"
      - "POST /songs, POST /songs/{id}/retire"
      - "POST /clearances, POST /clearances/{id}/clear, POST /clearances/{id}/disaffirm"
    shared_operations:
      - "All GET endpoints"
      - "POST /logs/{id}/music-placements (with TrafficDirector)"
      - "POST /_clock/set_current_utc"

  - name: TrafficDirector
    description: "Traffic side: logs lifecycle through reconciliation, spot/avail/live-read scheduling, discrepancy resolution"
    identity: opaque
    exclusive_operations:
      - "POST /logs, POST /logs/{id}/lock, POST /logs/{id}/as-run-import, POST /logs/{id}/begin-reconciliation, POST /logs/{id}/reopen, POST /logs/{id}/reconcile"
      - "POST /spots/{id}/cancel, POST /spots/{id}/reschedule"
      - "POST /barter-avails"
      - "POST /live-reads, POST /live-reads/{id}/reschedule"
      - "POST /discrepancies/{id}/resolve"
    shared_operations:
      - "All GET endpoints"
      - "POST /spots (with SalesRep)"
      - "POST /logs/{id}/music-placements (with ProgramDirector)"
      - "POST /_clock/set_current_utc"

  - name: SalesRep
    description: "Sales side: orders (create/submit/cancel own), trade agreements, endorsement contracts, remote event packages"
    identity: opaque
    exclusive_operations:
      - "POST /orders, POST /orders/{id}/submit"
      - "POST /endorsement-contracts"
      - "POST /remote-events"
    shared_operations:
      - "All GET endpoints"
      - "POST /trade-agreements (with SalesManager)"
      - "POST /orders/{id}/cancel (own orders; with SalesManager)"
      - "POST /endorsement-contracts/{id}/cancel (with SalesManager)"
      - "POST /spots (with TrafficDirector)"
      - "POST /_clock/set_current_utc"

  - name: SalesManager
    description: "Sales management: stations, rate card, ratings books, order approval/activation/completion, contract activation/close, remote event confirm/settle, below-floor rate override"
    identity: opaque
    exclusive_operations:
      - "POST /stations"
      - "POST /ratings-books, POST /ratings-books/{id}/publish"
      - "POST /rate-card-entries, POST /rate-card-entries/{id}/retire"
      - "POST /orders/{id}/approve, POST /orders/{id}/reject, POST /orders/{id}/activate, POST /orders/{id}/complete"
      - "POST /endorsement-contracts/{id}/activate, POST /endorsement-contracts/{id}/close"
      - "POST /remote-events/{id}/confirm, POST /remote-events/{id}/cancel, POST /remote-events/{id}/settle"
      - "unit_rate_override_cents below min_rate_cents with allow_below_floor == true on POST /spots"
    shared_operations:
      - "All GET endpoints"
      - "POST /trade-agreements (with SalesRep)"
      - "POST /orders/{id}/cancel (with SalesRep)"
      - "POST /endorsement-contracts/{id}/cancel (with SalesRep)"
      - "POST /_clock/set_current_utc"

  - name: BillingAdmin
    description: "Billing/compliance: trade ledger adjustments, agreement suspend/close, make-good credits, discrepancy waivers, affidavit issuance and log close"
    identity: opaque
    exclusive_operations:
      - "POST /trade-agreements/{id}/ledger-entries"
      - "POST /trade-agreements/{id}/suspend, POST /trade-agreements/{id}/close"
      - "POST /spots/{id}/issue-credit, POST /live-reads/{id}/issue-credit"
      - "POST /discrepancies/{id}/waive"
      - "POST /logs/{id}/issue-affidavit, POST /logs/{id}/close"
