# =============================================================================
# SCAFFOLD — Values-Led Sourcing Standards, Flavor Lifecycle & Franchise Scoop Shops
# §1.0–§1.7 (difficulty/corner designs live in sibling files)
# =============================================================================

scenario: |
  Values-Led Sourcing Standards, Flavor Lifecycle & Franchise Scoop Shops (Ben & Jerry's): ingredient sourcing commitments including fair trade certification, dairy program premiums and supplier social criteria with audit verification, dairy farm program payments above commodity price tied to environmental and animal welfare practices, flavor development, limited batch introduction and retirement decisions with fan-driven revival requests, independent board authority over social mission with the parent company holding operational control, franchise scoop shop program with site approval, product supply and a partner shop model for nonprofit operators, activism campaign approval processes and their interaction with retail partners, packaging and ingredient claim substantiation across certifications, plant production scheduling for chunk and swirl-heavy formulations

domain_name: values-led-creamery
api_prefix: /creamery

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers: [optimistic_concurrency, cascading_side_effects, dual_variant_calculation, rate_threshold_triggers]
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Supplier legal name" }
      - { name: country_code, type: string, source: input, description: "ISO 3166-1 alpha-2 country of operation" }
      - { name: ingredient_category, type: enum, source: input, description: "Primary category supplied", constraints: "DAIRY | COCOA | SUGAR | VANILLA | NUTS | FRUIT | CHUNK_INCLUSION" }
      - { name: status, type: enum, source: system, default: PROSPECT, description: "PROSPECT | APPROVED | SUSPENDED | TERMINATED" }
      - { name: social_criteria_score, type: integer, source: computed, default: null, description: "0-100 composite from the most recent VERIFIED audit; null until first verified audit" }

  - name: SourcingCommitment
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; taken from the create path" }
      - { name: ingredient_category, type: enum, source: input, description: "Category this commitment covers", constraints: "DAIRY | COCOA | SUGAR | VANILLA | NUTS | FRUIT | CHUNK_INCLUSION" }
      - { name: fair_trade_required, type: boolean, source: input, description: "Whether fair-trade certification is contractually required" }
      - { name: min_social_score, type: integer, source: input, description: "0-100 minimum supplier social score demanded by this commitment" }
      - { name: premium_over_commodity_pct, type: number, source: input, description: "Premium over commodity price pledged for compliant volume" }
      - { name: effective_from, type: datetime, source: input, description: "Commitment window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Commitment window end (exclusive for lapse evaluation)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUPERSEDED | LAPSED" }

  - name: Certification
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; taken from the create path" }
      - { name: scheme, type: enum, source: input, description: "Certification scheme", constraints: "FAIR_TRADE | ORGANIC | NON_GMO | B_CORP | RAINFOREST_ALLIANCE" }
      - { name: certificate_number, type: string, source: input, description: "External certificate identifier" }
      - { name: ingredient_scope, type: enum, source: input, description: "Scope the certificate covers", constraints: "DAIRY | COCOA | SUGAR | VANILLA | NUTS | FRUIT | CHUNK_INCLUSION | PACKAGING | WHOLE_COMPANY" }
      - { name: issued_at, type: datetime, source: input, description: "Validity window start (inclusive, half-open window)" }
      - { name: valid_until, type: datetime, source: input, description: "Validity window end (exclusive, half-open window)" }
      - { name: declared_coverage_pct, type: number, source: input, description: "Supplier-declared share (0-100) of scoped volume covered" }
      - { name: verified_coverage_pct, type: number, source: system, default: null, description: "Verifier-confirmed coverage, set at verify" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | VERIFIED | EXPIRED | REVOKED" }

  - name: Audit
    parent: Supplier
    common_fields: true
    fields:
      - { name: supplier_id, type: string, source: system, description: "FK -> Supplier.id; taken from the create path" }
      - { name: scheduled_for, type: datetime, source: input, description: "Planned audit date" }
      - { name: auditor_user_id, type: string, source: system, default: null, description: "X-User-ID of the SustainabilityAuditor who started the audit" }
      - { name: labor_score, type: integer, source: system, default: null, description: "0-100 labor dimension, recorded at complete" }
      - { name: environment_score, type: integer, source: system, default: null, description: "0-100 environment dimension, recorded at complete" }
      - { name: community_score, type: integer, source: system, default: null, description: "0-100 community dimension, recorded at complete" }
      - { name: findings_count, type: integer, source: system, default: null, description: "Number of non-conformance findings, recorded at complete" }
      - { name: composite_score, type: integer, source: computed, default: null, description: "round_half_up(0.4*labor_score + 0.3*environment_score + 0.3*community_score)" }
      - { name: outcome, type: enum, source: computed, default: null, description: "PASS | FAIL; PASS iff composite_score >= 70 AND findings_count <= 2" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | IN_PROGRESS | COMPLETED | VERIFIED" }

  - name: FarmProgramEnrollment
    parent: null
    common_fields: true
    fields:
      - { name: farm_name, type: string, source: input, description: "Dairy farm name" }
      - { name: region, type: string, source: input, description: "Farm region code" }
      - { name: herd_size, type: integer, source: input, description: "Number of cows" }
      - { name: season_year, type: integer, source: input, description: "Program season year" }
      - { name: baseline_volume_liters, type: integer, source: input, description: "Annual baseline liters; volume above it earns the marginal excess bonus" }
      - { name: env_practice_score, type: integer, source: system, default: null, description: "0-100 environmental practice score, set at assess" }
      - { name: welfare_practice_score, type: integer, source: system, default: null, description: "0-100 animal welfare score, set at assess" }
      - { name: blended_score, type: integer, source: computed, default: null, description: "round_half_up(0.5*env_practice_score + 0.5*welfare_practice_score)" }
      - { name: status, type: enum, source: system, default: ENROLLED, description: "ENROLLED | ASSESSED" }
      - { name: total_approved_cents, type: integer, source: computed, default: 0, description: "Sum of gross_amount_cents over payments in status APPROVED or PAID" }

  - name: PremiumPayment
    parent: FarmProgramEnrollment
    common_fields: true
    fields:
      - { name: enrollment_id, type: string, source: system, description: "FK -> FarmProgramEnrollment.id; taken from the create path" }
      - { name: period, type: enum, source: input, description: "Payment quarter", constraints: "Q1 | Q2 | Q3 | Q4" }
      - { name: declared_volume_liters, type: integer, source: input, description: "Farm-declared volume for the period" }
      - { name: metered_volume_liters, type: integer, source: system, default: null, description: "Metered volume, set at finalize" }
      - { name: non_conformance_count, type: integer, source: system, default: 0, description: "Practice non-conformance count, set at finalize; each deducts 2 premium points" }
      - { name: commodity_price_cents_per_liter, type: integer, source: input, description: "Commodity price baseline in cents per liter" }
      - { name: calc_variant, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL (declared volume, no deductions) | FINAL (metered volume, deductions)" }
      - { name: premium_pct, type: number, source: computed, default: null, description: "Effective premium percentage after tier selection and deductions" }
      - { name: gross_amount_cents, type: integer, source: computed, default: null, description: "Computed premium amount per farm_premium_payment" }
      - { name: status, type: enum, source: system, default: CALCULATED, description: "CALCULATED | APPROVED | PAID | VOIDED" }

  - name: Flavor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Flavor name" }
      - { name: base_type, type: enum, source: input, description: "Base type", constraints: "DAIRY | NON_DAIRY" }
      - { name: chunk_load_pct, type: number, source: input, description: "0-100 inclusion (chunk) load percentage" }
      - { name: swirl_load_pct, type: number, source: input, description: "0-100 swirl load percentage" }
      - { name: pint_price_cents, type: integer, source: input, description: "Unit price per pint in cents" }
      - { name: status, type: enum, source: system, default: DEVELOPMENT, description: "DEVELOPMENT | TEST_BATCH | LIMITED_RUN | CORE_LINE | RETIRED | REVIVED" }
      - { name: retired_at, type: datetime, source: system, default: null, description: "Logical clock time of retirement; revival window measured from this" }
      - { name: claim_type, type: enum, source: system, default: NONE, description: "NONE | FAIR_TRADE_SOURCING | ORGANIC_INGREDIENTS | NON_GMO | CLIMATE_POSITIVE" }
      - { name: claim_status, type: enum, source: system, default: UNCLAIMED, description: "UNCLAIMED | SUBSTANTIATED | PUBLISHED | CHALLENGED | RETRACTED; parallel dimension independent of status" }
      - { name: claim_certification_ids, type: array, source: system, default: [], description: "Certification ids cited by the current substantiation" }
      - { name: claim_coverage_declared_pct, type: number, source: computed, default: null, description: "DECLARED-basis coverage: mean of declared_coverage_pct over all cited certifications, 2dp round_half_up" }
      - { name: claim_coverage_verified_pct, type: number, source: computed, default: null, description: "VERIFIED-basis coverage: mean of verified_coverage_pct over cited certifications with status VERIFIED (0 if none), 2dp round_half_up" }

  - name: RevivalRequest
    parent: Flavor
    common_fields: true
    fields:
      - { name: flavor_id, type: string, source: system, description: "FK -> Flavor.id; taken from the create path" }
      - { name: fan_email, type: string, source: input, description: "Email of the fan who opened the request" }
      - { name: title, type: string, source: input, description: "Revival campaign title" }
      - { name: signature_count, type: integer, source: system, default: 0, description: "Total verified signatures" }
      - { name: signer_emails, type: array, source: system, default: [], description: "Emails that have signed; enforces one signature per email" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | QUALIFIED | ADOPTED | DECLINED" }
      - { name: qualified_at, type: datetime, source: system, default: null, description: "Logical clock time when the signature threshold was reached" }

  - name: ProductionSlot
    parent: null
    common_fields: true
    fields:
      - { name: plant_code, type: enum, source: input, description: "Production plant", constraints: "VT_WATERBURY | VT_ST_ALBANS | NL_HELLENDOORN" }
      - { name: flavor_id, type: string, source: input, description: "FK -> Flavor.id; flavor being scheduled" }
      - { name: production_date, type: string, source: input, description: "ISO date yyyy-mm-dd of the production run" }
      - { name: shift, type: enum, source: input, description: "DAY | NIGHT" }
      - { name: planned_pints, type: integer, source: input, description: "Planned pint count for the run" }
      - { name: capacity_units, type: integer, source: computed, default: null, description: "ceil(planned_pints/100 x chunk_factor x swirl_factor) per slot_capacity_consumption" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | CONFIRMED | COMPLETED | CANCELLED" }

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Campaign title" }
      - { name: issue_area, type: enum, source: input, description: "Activism issue area", constraints: "CLIMATE | RACIAL_JUSTICE | FAIR_TRADE | DEMOCRACY | LGBTQ_RIGHTS" }
      - { name: retail_partner_impact, type: enum, source: input, description: "Expected impact on retail partners", constraints: "NONE | LOW | HIGH" }
      - { name: proposer_user_id, type: string, source: system, description: "X-User-ID of the IndependentBoardMember who created the campaign" }
      - { name: approval_status, type: enum, source: system, default: BOARD_REVIEW, description: "BOARD_REVIEW | BOARD_APPROVED | BOARD_REJECTED | OPS_SCHEDULED | LAUNCHED | WITHDRAWN" }
      - { name: retail_notice_status, type: enum, source: system, description: "NOT_REQUIRED (impact NONE) | PENDING | DISPATCHED; parallel dimension", default: PENDING }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the board member who cast the board decision" }

  - name: ScoopShop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shop name" }
      - { name: operator_type, type: enum, source: input, description: "FRANCHISEE | NONPROFIT_PARTNER" }
      - { name: nonprofit_verified, type: boolean, source: input, default: false, description: "Whether nonprofit status is verified (partner shop model)" }
      - { name: city, type: string, source: input, description: "Shop city" }
      - { name: country_code, type: string, source: input, description: "Shop country" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum confirmed-but-unpaid order exposure" }
      - { name: franchise_fee_cents, type: integer, source: computed, default: null, description: "3500000 for FRANCHISEE; 0 for NONPROFIT_PARTNER (partner shop fee waived)" }
      - { name: status, type: enum, source: system, default: SITE_REVIEW, description: "SITE_REVIEW | SITE_APPROVED | OPERATING | SUSPENDED | CLOSED" }

  - name: ShopSupplyOrder
    parent: ScoopShop
    common_fields: true
    fields:
      - { name: scoop_shop_id, type: string, source: system, description: "FK -> ScoopShop.id; taken from the create path" }
      - { name: production_date, type: string, source: input, description: "ISO date yyyy-mm-dd the product is produced for" }
      - { name: allocated_plant_code, type: enum, source: system, default: null, description: "Plant allocated at allocate: VT_WATERBURY | VT_ST_ALBANS | NL_HELLENDOORN" }
      - { name: lines, type: array, source: input, description: "Array of {flavor_id, quantity_pints}; each element's flavor_id references Flavor.id" }
      - { name: total_pints, type: integer, source: computed, default: null, description: "Sum of quantity_pints over lines" }
      - { name: total_cents, type: integer, source: computed, default: null, description: "Round per line then sum, partner discount 15%; per supply_order_total" }
      - { name: status, type: enum, source: system, default: PLACED, description: "PLACED | CONFIRMED | ALLOCATED | DELIVERED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Supplier
    initial_state: PROSPECT
    terminal_states: [TERMINATED]
    transitions:
      - { from: PROSPECT, to: APPROVED, trigger: "system (POST /creamery/audits/{id}/verify with outcome PASS)", actor: system, preconditions: ["audit.status == COMPLETED", "audit.outcome == PASS"], side_effects: ["Supplier.social_criteria_score := audit.composite_score", "increments Supplier.version by 1"] }
      - { from: SUSPENDED, to: APPROVED, trigger: "system (POST /creamery/audits/{id}/verify with outcome PASS)", actor: system, preconditions: ["audit.outcome == PASS"], side_effects: ["Supplier.social_criteria_score := audit.composite_score", "increments Supplier.version by 1"], note: "A later passing audit reinstates a suspended supplier" }
      - { from: APPROVED, to: SUSPENDED, trigger: "POST /creamery/suppliers/{id}/suspend", actor: SourcingManager, preconditions: [], side_effects: ["increments Supplier.version by 1"], note: "Manual suspension preserves commitments and certifications" }
      - { from: PROSPECT, to: SUSPENDED, trigger: "system (POST /creamery/audits/{id}/verify with outcome FAIL)", actor: system, preconditions: ["audit.outcome == FAIL"], side_effects: ["Supplier.social_criteria_score := audit.composite_score", "every Certification of this supplier in PENDING or VERIFIED -> REVOKED", "every Flavor with claim_status SUBSTANTIATED or PUBLISHED citing any of those certifications -> claim_status CHALLENGED", "every SourcingCommitment of this supplier in ACTIVE -> LAPSED", "increments Supplier.version by 1"], note: "Audit-fail cascade, depth 3: audit verify -> supplier suspension -> certification revocation -> claim challenge" }
      - { from: APPROVED, to: SUSPENDED, trigger: "system (POST /creamery/audits/{id}/verify with outcome FAIL)", actor: system, preconditions: ["audit.outcome == FAIL"], side_effects: ["same audit-fail cascade as PROSPECT->SUSPENDED", "increments Supplier.version by 1"] }
      - { from: PROSPECT, to: TERMINATED, trigger: "POST /creamery/suppliers/{id}/terminate", actor: SourcingManager, preconditions: [], side_effects: ["increments Supplier.version by 1"] }
      - { from: APPROVED, to: TERMINATED, trigger: "POST /creamery/suppliers/{id}/terminate", actor: SourcingManager, preconditions: [], side_effects: ["increments Supplier.version by 1"] }
      - { from: SUSPENDED, to: TERMINATED, trigger: "POST /creamery/suppliers/{id}/terminate", actor: SourcingManager, preconditions: [], side_effects: ["increments Supplier.version by 1"] }
      - { from: SUSPENDED, to: APPROVED, trigger: "POST /creamery/suppliers/{id}/reinstate", actor: SourcingManager, preconditions: [], side_effects: ["increments Supplier.version by 1"], note: "Manual reinstate; LAPSED commitments are NOT resurrected" }

  - entity: SourcingCommitment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, LAPSED]
    transitions:
      - { from: ACTIVE, to: SUPERSEDED, trigger: "system (POST /creamery/suppliers/{id}/commitments creating a new commitment with the same ingredient_category)", actor: system, preconditions: [], side_effects: ["prior commitment for the same (supplier_id, ingredient_category) moves to SUPERSEDED so exactly one ACTIVE commitment exists per (supplier_id, ingredient_category)"] }
      - { from: ACTIVE, to: LAPSED, trigger: "system (logical clock advance past effective_to, evaluated on POST /creamery/_clock/set_current_utc and lazily on read)", actor: system, preconditions: ["current logical time > effective_to"], side_effects: [] }
      - { from: ACTIVE, to: LAPSED, trigger: "system (audit-fail cascade on the parent Supplier)", actor: system, preconditions: [], side_effects: [] }

  - entity: Certification
    initial_state: PENDING
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - { from: PENDING, to: VERIFIED, trigger: "POST /creamery/certifications/{id}/verify", actor: AuditVerifier, preconditions: ["supplier.status != TERMINATED"], side_effects: ["sets verified_coverage_pct from input"] }
      - { from: PENDING, to: REVOKED, trigger: "POST /creamery/certifications/{id}/revoke", actor: AuditVerifier, preconditions: [], side_effects: ["every Flavor with claim_status SUBSTANTIATED or PUBLISHED citing this certification -> claim_status CHALLENGED"] }
      - { from: VERIFIED, to: REVOKED, trigger: "POST /creamery/certifications/{id}/revoke", actor: AuditVerifier, preconditions: [], side_effects: ["every Flavor with claim_status SUBSTANTIATED or PUBLISHED citing this certification -> claim_status CHALLENGED"] }
      - { from: PENDING, to: REVOKED, trigger: "system (audit-fail cascade on the parent Supplier)", actor: system, preconditions: [], side_effects: ["claim challenge cascade as manual revoke"] }
      - { from: VERIFIED, to: REVOKED, trigger: "system (audit-fail cascade on the parent Supplier)", actor: system, preconditions: [], side_effects: ["claim challenge cascade as manual revoke"] }
      - { from: PENDING, to: EXPIRED, trigger: "system (logical clock advance past valid_until, evaluated on POST /creamery/_clock/set_current_utc and lazily on read)", actor: system, preconditions: ["current logical time > valid_until"], side_effects: ["every Flavor with claim_status PUBLISHED citing this certification -> claim_status RETRACTED"] }
      - { from: VERIFIED, to: EXPIRED, trigger: "system (logical clock advance past valid_until)", actor: system, preconditions: ["current logical time > valid_until"], side_effects: ["every Flavor with claim_status PUBLISHED citing this certification -> claim_status RETRACTED"], note: "Clock cascade, depth 2: clock advance -> certification expiry -> claim retraction" }

  - entity: Audit
    initial_state: SCHEDULED
    terminal_states: [VERIFIED]
    transitions:
      - { from: SCHEDULED, to: IN_PROGRESS, trigger: "POST /creamery/audits/{id}/start", actor: SustainabilityAuditor, preconditions: ["supplier.status != TERMINATED"], side_effects: ["sets auditor_user_id from X-User-ID"] }
      - { from: IN_PROGRESS, to: COMPLETED, trigger: "POST /creamery/audits/{id}/complete", actor: SustainabilityAuditor, preconditions: ["X-User-ID == audit.auditor_user_id"], side_effects: ["computes composite_score per audit_social_composite", "computes outcome PASS|FAIL"] }
      - { from: COMPLETED, to: VERIFIED, trigger: "POST /creamery/audits/{id}/verify", actor: AuditVerifier, preconditions: ["X-User-ID != audit.auditor_user_id (segregation of duties)"], side_effects: ["Supplier.social_criteria_score := composite_score", "outcome PASS -> supplier transition to APPROVED", "outcome FAIL -> supplier audit-fail cascade to SUSPENDED"] }

  - entity: FarmProgramEnrollment
    initial_state: ENROLLED
    terminal_states: []
    transitions:
      - { from: ENROLLED, to: ASSESSED, trigger: "POST /creamery/enrollments/{id}/assess", actor: DairyProgramManager, preconditions: [], side_effects: ["sets env_practice_score and welfare_practice_score", "computes blended_score"] }
      - { from: ASSESSED, to: ASSESSED, trigger: "POST /creamery/enrollments/{id}/assess", actor: DairyProgramManager, preconditions: [], side_effects: ["re-sets scores and blended_score; existing payments are NOT recomputed"], note: "re-assessment self-loop" }

  - entity: PremiumPayment
    initial_state: CALCULATED
    terminal_states: [PAID, VOIDED]
    transitions:
      - { from: CALCULATED, to: CALCULATED, trigger: "POST /creamery/premium-payments/{id}/finalize", actor: DairyProgramManager, preconditions: ["calc_variant == PROVISIONAL"], side_effects: ["sets metered_volume_liters and non_conformance_count", "calc_variant := FINAL", "recomputes premium_pct and gross_amount_cents per farm_premium_payment FINAL variant"] }
      - { from: CALCULATED, to: APPROVED, trigger: "POST /creamery/premium-payments/{id}/approve", actor: DairyProgramManager, preconditions: ["calc_variant == FINAL (else ERR_PAYMENT_NOT_FINAL)"], side_effects: ["FarmProgramEnrollment.total_approved_cents += gross_amount_cents", "increments enrollment version via cascade update"] }
      - { from: APPROVED, to: PAID, trigger: "POST /creamery/premium-payments/{id}/pay", actor: ParentOpsController, preconditions: [], side_effects: [] }
      - { from: CALCULATED, to: VOIDED, trigger: "POST /creamery/premium-payments/{id}/void", actor: DairyProgramManager, preconditions: [], side_effects: [] }
      - { from: APPROVED, to: VOIDED, trigger: "POST /creamery/premium-payments/{id}/void", actor: DairyProgramManager, preconditions: [], side_effects: ["FarmProgramEnrollment.total_approved_cents -= gross_amount_cents (compensating reversal)"] }

  - entity: Flavor
    initial_state: DEVELOPMENT
    terminal_states: []
    transitions:
      - { from: DEVELOPMENT, to: TEST_BATCH, trigger: "POST /creamery/flavors/{id}/promote {target_state: TEST_BATCH}", actor: FlavorManager, preconditions: [], side_effects: ["increments Flavor.version by 1"] }
      - { from: TEST_BATCH, to: LIMITED_RUN, trigger: "POST /creamery/flavors/{id}/promote {target_state: LIMITED_RUN}", actor: FlavorManager, preconditions: [], side_effects: ["increments Flavor.version by 1"], note: "limited batch introduction" }
      - { from: LIMITED_RUN, to: CORE_LINE, trigger: "POST /creamery/flavors/{id}/promote {target_state: CORE_LINE}", actor: FlavorManager, preconditions: [], side_effects: ["increments Flavor.version by 1"] }
      - { from: LIMITED_RUN, to: RETIRED, trigger: "POST /creamery/flavors/{id}/retire", actor: ParentOpsController, preconditions: [], side_effects: ["sets retired_at from logical clock", "every ShopSupplyOrder in PLACED, CONFIRMED or ALLOCATED whose lines contain this flavor -> CANCELLED (releasing plant-day capacity)", "every ProductionSlot of this flavor in PLANNED or CONFIRMED -> CANCELLED", "if claim_status == PUBLISHED -> RETRACTED", "increments Flavor.version by 1"], note: "retirement is operational control: ParentOpsController" }
      - { from: CORE_LINE, to: RETIRED, trigger: "POST /creamery/flavors/{id}/retire", actor: ParentOpsController, preconditions: [], side_effects: ["same retire cascade as LIMITED_RUN->RETIRED"] }
      - { from: REVIVED, to: RETIRED, trigger: "POST /creamery/flavors/{id}/retire", actor: ParentOpsController, preconditions: [], side_effects: ["same retire cascade as LIMITED_RUN->RETIRED"] }
      - { from: RETIRED, to: REVIVED, trigger: "system (POST /creamery/revival-requests/{id}/adopt on a QUALIFIED request)", actor: system, preconditions: ["revival_request.status == QUALIFIED"], side_effects: ["increments Flavor.version by 1"], note: "fan-driven revival; adoption is a social-mission decision reserved to the independent board" }
      - { from: REVIVED, to: CORE_LINE, trigger: "POST /creamery/flavors/{id}/return-to-line", actor: FlavorManager, preconditions: [], side_effects: ["increments Flavor.version by 1"], note: "closes the cycle CORE_LINE -> RETIRED -> REVIVED -> CORE_LINE" }

  - entity: Flavor.claim_status
    initial_state: UNCLAIMED
    terminal_states: []
    transitions:
      - { from: UNCLAIMED, to: SUBSTANTIATED, trigger: "POST /creamery/flavors/{id}/substantiate-claim", actor: FlavorManager, preconditions: ["all cited certification ids exist", "expected_flavor_version == Flavor.version (OCC)"], side_effects: ["sets claim_type, claim_certification_ids", "computes claim_coverage_declared_pct and claim_coverage_verified_pct per claim_coverage", "increments Flavor.version by 1"], note: "supersedes any prior claim on the flavor" }
      - { from: CHALLENGED, to: SUBSTANTIATED, trigger: "POST /creamery/flavors/{id}/substantiate-claim", actor: FlavorManager, preconditions: ["as UNCLAIMED->SUBSTANTIATED"], side_effects: ["as UNCLAIMED->SUBSTANTIATED"], note: "re-substantiation loop" }
      - { from: RETRACTED, to: SUBSTANTIATED, trigger: "POST /creamery/flavors/{id}/substantiate-claim", actor: FlavorManager, preconditions: ["as UNCLAIMED->SUBSTANTIATED"], side_effects: ["as UNCLAIMED->SUBSTANTIATED"] }
      - { from: SUBSTANTIATED, to: PUBLISHED, trigger: "POST /creamery/flavors/{id}/publish-claim", actor: FlavorManager, preconditions: ["flavor.status in {LIMITED_RUN, CORE_LINE} (else ERR_FLAVOR_NOT_PUBLISHABLE)", "claim_coverage_verified_pct >= CLAIM_COVERAGE_THRESHOLD[claim_type] (else ERR_CLAIM_COVERAGE_INSUFFICIENT)", "every cited certification status == VERIFIED (else ERR_CERT_NOT_VERIFIED)", "scope rule per claim_coverage (else ERR_CERT_SCOPE_MISMATCH)"], side_effects: ["increments Flavor.version by 1"] }
      - { from: SUBSTANTIATED, to: CHALLENGED, trigger: "POST /creamery/flavors/{id}/challenge-claim", actor: IndependentBoardMember, preconditions: [], side_effects: ["increments Flavor.version by 1"], note: "board polices mission claims" }
      - { from: PUBLISHED, to: CHALLENGED, trigger: "POST /creamery/flavors/{id}/challenge-claim or certification-revoke cascade", actor: IndependentBoardMember, preconditions: [], side_effects: ["increments Flavor.version by 1"] }
      - { from: PUBLISHED, to: RETRACTED, trigger: "system (flavor retire cascade or certification EXPIRED cascade)", actor: system, preconditions: [], side_effects: ["increments Flavor.version by 1"] }

  - entity: RevivalRequest
    initial_state: OPEN
    terminal_states: [ADOPTED, DECLINED]
    transitions:
      - { from: OPEN, to: QUALIFIED, trigger: "system (POST /creamery/revival-requests/{id}/sign when signature_count reaches REVIVAL_SIGNATURE_THRESHOLD)", actor: system, preconditions: ["signature_count >= 500 after this signature"], side_effects: ["sets qualified_at from logical clock"], note: "threshold is inclusive: exactly 500 qualifies" }
      - { from: QUALIFIED, to: ADOPTED, trigger: "POST /creamery/revival-requests/{id}/adopt", actor: IndependentBoardMember, preconditions: [], side_effects: ["Flavor of flavor_id transitions RETIRED -> REVIVED"] }
      - { from: OPEN, to: DECLINED, trigger: "POST /creamery/revival-requests/{id}/decline", actor: IndependentBoardMember, preconditions: [], side_effects: [] }
      - { from: QUALIFIED, to: DECLINED, trigger: "POST /creamery/revival-requests/{id}/decline", actor: IndependentBoardMember, preconditions: [], side_effects: [] }

  - entity: ProductionSlot
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - { from: PLANNED, to: CONFIRMED, trigger: "POST /creamery/production-slots/{id}/confirm", actor: PlantScheduler, preconditions: ["flavor.status in {TEST_BATCH, LIMITED_RUN, CORE_LINE} (else ERR_FLAVOR_NOT_SCHEDULABLE)", "plant-shift capacity check per slot_capacity_consumption"], side_effects: [] }
      - { from: PLANNED, to: CANCELLED, trigger: "POST /creamery/production-slots/{id}/cancel", actor: PlantScheduler, preconditions: [], side_effects: ["releases reserved capacity_units from the (plant_code, production_date, shift) pool"] }
      - { from: CONFIRMED, to: CANCELLED, trigger: "POST /creamery/production-slots/{id}/cancel", actor: PlantScheduler, preconditions: [], side_effects: ["releases reserved capacity_units"] }
      - { from: PLANNED, to: CANCELLED, trigger: "system (flavor retire cascade)", actor: system, preconditions: [], side_effects: ["releases reserved capacity_units"] }
      - { from: CONFIRMED, to: CANCELLED, trigger: "system (flavor retire cascade)", actor: system, preconditions: [], side_effects: ["releases reserved capacity_units"] }
      - { from: CONFIRMED, to: COMPLETED, trigger: "system (logical clock advance past production_date)", actor: system, preconditions: ["current logical date > production_date"], side_effects: [] }

  - entity: Campaign.approval_status
    initial_state: BOARD_REVIEW
    terminal_states: [BOARD_REJECTED, WITHDRAWN]
    transitions:
      - { from: BOARD_REVIEW, to: BOARD_APPROVED, trigger: "POST /creamery/campaigns/{id}/board-decision {approve: true}", actor: IndependentBoardMember, preconditions: ["X-User-ID != campaign.proposer_user_id (segregation of duties)"], side_effects: ["sets decided_by_user_id"] }
      - { from: BOARD_REVIEW, to: BOARD_REJECTED, trigger: "POST /creamery/campaigns/{id}/board-decision {approve: false}", actor: IndependentBoardMember, preconditions: ["X-User-ID != campaign.proposer_user_id"], side_effects: ["sets decided_by_user_id"] }
      - { from: BOARD_APPROVED, to: OPS_SCHEDULED, trigger: "POST /creamery/campaigns/{id}/schedule-ops", actor: ParentOpsController, preconditions: [], side_effects: [], note: "operational control belongs to the parent company" }
      - { from: OPS_SCHEDULED, to: LAUNCHED, trigger: "POST /creamery/campaigns/{id}/launch", actor: ParentOpsController, preconditions: ["retail_notice_status != PENDING (else ERR_RETAIL_NOTICES_PENDING)"], side_effects: [] }
      - { from: BOARD_APPROVED, to: WITHDRAWN, trigger: "POST /creamery/campaigns/{id}/veto", actor: IndependentBoardMember, preconditions: [], side_effects: [], note: "independent board veto overrides parent operational scheduling" }
      - { from: OPS_SCHEDULED, to: WITHDRAWN, trigger: "POST /creamery/campaigns/{id}/veto", actor: IndependentBoardMember, preconditions: [], side_effects: [] }
      - { from: LAUNCHED, to: WITHDRAWN, trigger: "POST /creamery/campaigns/{id}/veto", actor: IndependentBoardMember, preconditions: [], side_effects: [] }

  - entity: Campaign.retail_notice_status
    initial_state: "NOT_REQUIRED if retail_partner_impact == NONE else PENDING"
    terminal_states: [NOT_REQUIRED, DISPATCHED]
    transitions:
      - { from: PENDING, to: DISPATCHED, trigger: "POST /creamery/campaigns/{id}/dispatch-retail-notices", actor: ParentOpsController, preconditions: ["approval_status in {BOARD_APPROVED, OPS_SCHEDULED}"], side_effects: [] }

  - entity: ScoopShop
    initial_state: SITE_REVIEW
    terminal_states: [CLOSED]
    transitions:
      - { from: SITE_REVIEW, to: SITE_APPROVED, trigger: "POST /creamery/scoop-shops/{id}/approve-site", actor: FranchiseAdmin, preconditions: [], side_effects: [] }
      - { from: SITE_REVIEW, to: CLOSED, trigger: "POST /creamery/scoop-shops/{id}/reject-site", actor: FranchiseAdmin, preconditions: [], side_effects: [], note: "site rejection closes the application" }
      - { from: SITE_APPROVED, to: OPERATING, trigger: "POST /creamery/scoop-shops/{id}/open", actor: FranchiseAdmin, preconditions: ["operator_type == FRANCHISEE OR nonprofit_verified == true (else ERR_NONPROFIT_VERIFICATION_REQUIRED)"], side_effects: [] }
      - { from: OPERATING, to: SUSPENDED, trigger: "POST /creamery/scoop-shops/{id}/suspend", actor: FranchiseAdmin, preconditions: [], side_effects: [] }
      - { from: SUSPENDED, to: OPERATING, trigger: "POST /creamery/scoop-shops/{id}/reopen", actor: FranchiseAdmin, preconditions: [], side_effects: [], note: "OPERATING <-> SUSPENDED cycle" }

  - entity: ShopSupplyOrder
    initial_state: PLACED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - { from: PLACED, to: CONFIRMED, trigger: "POST /creamery/supply-orders/{id}/confirm", actor: FranchiseAdmin, preconditions: ["shop.status == OPERATING (else ERR_SHOP_NOT_OPERATING)", "every line flavor status in {LIMITED_RUN, CORE_LINE} (else ERR_ORDER_FLAVOR_UNAVAILABLE)", "total_cents <= shop.credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"], side_effects: [] }
      - { from: CONFIRMED, to: ALLOCATED, trigger: "POST /creamery/supply-orders/{id}/allocate", actor: PlantScheduler, preconditions: ["plant-day capacity check per supply_order_total constants (else ERR_ORDER_CAPACITY_EXCEEDED)"], side_effects: ["sets allocated_plant_code", "reserves total_pints in the (allocated_plant_code, production_date) pint pool"] }
      - { from: ALLOCATED, to: DELIVERED, trigger: "POST /creamery/supply-orders/{id}/deliver", actor: ShopOperator, preconditions: ["X-User-ID == order.scoop_shop_id"], side_effects: [] }
      - { from: PLACED, to: CANCELLED, trigger: "POST /creamery/supply-orders/{id}/cancel", actor: ShopOperator, preconditions: ["X-User-ID == order.scoop_shop_id"], side_effects: [] }
      - { from: CONFIRMED, to: CANCELLED, trigger: "POST /creamery/supply-orders/{id}/cancel", actor: ShopOperator, preconditions: ["X-User-ID == order.scoop_shop_id"], side_effects: [] }
      - { from: ALLOCATED, to: CANCELLED, trigger: "POST /creamery/supply-orders/{id}/cancel", actor: ShopOperator, preconditions: ["X-User-ID == order.scoop_shop_id"], side_effects: ["releases total_pints from the (allocated_plant_code, production_date) pool (compensating reversal)"] }
      - { from: PLACED, to: CANCELLED, trigger: "system (flavor retire cascade)", actor: system, preconditions: [], side_effects: [] }
      - { from: CONFIRMED, to: CANCELLED, trigger: "system (flavor retire cascade)", actor: system, preconditions: [], side_effects: [] }
      - { from: ALLOCATED, to: CANCELLED, trigger: "system (flavor retire cascade)", actor: system, preconditions: [], side_effects: ["releases total_pints from the plant-day pool"] }

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: commitment-supersede-stale-supplier
    parent_entity: Supplier
    write_endpoint: "POST /creamery/suppliers/{id}/commitments"
    occ_field: expected_supplier_version
    description: |
      Creating a SourcingCommitment against a Supplier whose version has advanced
      since the client last observed it is rejected. Creating a commitment
      legitimately supersedes the prior ACTIVE commitment for the same category,
      so a stale view of the supplier would supersede a commitment the client
      never saw; the stale expected_supplier_version is rejected instead.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: claim-substantiate-stale-flavor
    parent_entity: Flavor
    write_endpoint: "POST /creamery/flavors/{id}/substantiate-claim"
    occ_field: expected_flavor_version
    description: |
      Substantiating a claim against a Flavor whose version has advanced since
      the client last observed it is rejected. A new substantiation supersedes
      the flavor's current claim state, so a stale view would silently replace
      a claim the client never saw; the stale expected_flavor_version is
      rejected instead.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: farm_premium_payment
    trigger: "on POST /creamery/enrollments/{id}/premium-payments (PROVISIONAL variant) and on POST /creamery/premium-payments/{id}/finalize (FINAL variant)"
    algorithm: tiered_pricing
    formula: |
      inputs: enrollment.blended_score B, enrollment.baseline_volume_liters BASE,
              volume V (see variants), commodity_price_cents_per_liter P,
              non_conformance_count NC (see variants)
      tier_pct(B) = 0 if B < 60; 5 if 60 <= B < 75; 8 if 75 <= B < 90; 12 if B >= 90
      deduction_pct = 2 * NC
      eff_pct = max(0, tier_pct(B) - deduction_pct)
      if tier_pct(B) == 0: gross_cents = 0        # below program bar: no premium, no bonus
      else:
        base_vol   = min(V, BASE)
        excess_vol = max(0, V - BASE)
        gross_cents = round_half_up( base_vol   * P * eff_pct / 100
                                   + excess_vol * P * (eff_pct + 1) / 100 )
      premium_pct = eff_pct ; gross_amount_cents = gross_cents
    input_set: "the parent FarmProgramEnrollment (must be ASSESSED so blended_score is set) and the payment's volume/price inputs"
    constants:
      TIER1_MIN: 60
      TIER1_PCT: 5
      TIER2_MIN: 75
      TIER2_PCT: 8
      TIER3_MIN: 90
      TIER3_PCT: 12
      NON_CONFORMANCE_DEDUCTION_PCT: 2
      EXCESS_VOLUME_BONUS_PCT: 1
    precision: "gross_amount_cents integer cents, round_half_up; tier boundaries inclusive at the lower bound (B == 60 earns 5%)"
    variants:
      - name: PROVISIONAL
        when: "at payment creation"
        difference: "V = declared_volume_liters; NC = 0 (no non-conformance deductions)"
      - name: FINAL
        when: "after POST /premium-payments/{id}/finalize"
        difference: "V = metered_volume_liters; NC = non_conformance_count from finalize input"

  - name: supply_order_total
    trigger: "on POST /creamery/scoop-shops/{id}/supply-orders (computed once at creation)"
    algorithm: aggregation
    formula: |
      discount_pct = 0.15 if shop.operator_type == NONPROFIT_PARTNER else 0
      for each line: line_cents = round_half_up( flavor.pint_price_cents * line.quantity_pints * (1 - discount_pct) )
      total_cents = sum(line_cents)            # PINNED ORDER: round per line, THEN sum
      total_pints = sum(line.quantity_pints)
    input_set: "the order's lines resolved against current Flavor.pint_price_cents and the parent ScoopShop.operator_type"
    constants:
      PARTNER_DISCOUNT_PCT: 0.15
      PLANT_DAY_ORDER_CAPACITY_PINTS: { VT_WATERBURY: 12000, VT_ST_ALBANS: 9000, NL_HELLENDOORN: 7000 }
    precision: "line amounts rounded to integer cents round_half_up BEFORE summation; rounding order is pinned and observable (round-per-line-then-sum differs from sum-then-round)"
    variants: []

  - name: claim_coverage
    trigger: "on POST /creamery/flavors/{id}/substantiate-claim"
    algorithm: aggregation
    formula: |
      cited = certifications whose id in claim_certification_ids
      claim_coverage_declared_pct = round_half_up_2dp( mean(c.declared_coverage_pct for c in cited) )
      verified_set = [c in cited if c.status == VERIFIED]
      claim_coverage_verified_pct = round_half_up_2dp( mean(c.verified_coverage_pct for c in verified_set) ) if verified_set else 0
      publish scope rule: if flavor.base_type == DAIRY, at least one cited certification must have
        ingredient_scope in {DAIRY, WHOLE_COMPANY}; if base_type == NON_DAIRY, at least one cited
        certification must have ingredient_scope not in {DAIRY} (WHOLE_COMPANY qualifies)
    input_set: "certifications cited by the substantiation; status filter VERIFIED applies only to the verified basis"
    constants:
      CLAIM_COVERAGE_THRESHOLD: { FAIR_TRADE_SOURCING: 95, ORGANIC_INGREDIENTS: 100, NON_GMO: 90, CLIMATE_POSITIVE: 100 }
    precision: "2 decimal places, round_half_up; publish gate is inclusive (coverage == threshold passes)"
    variants:
      - name: DECLARED
        when: "supplier-reported basis (informational)"
        difference: "uses declared_coverage_pct over ALL cited certifications regardless of certification status"
      - name: VERIFIED
        when: "verification basis; the only basis the publish gate accepts"
        difference: "uses verified_coverage_pct over cited certifications with status == VERIFIED only; empty set yields 0"

  - name: audit_social_composite
    trigger: "on POST /creamery/audits/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      composite_score = round_half_up( 0.4*labor_score + 0.3*environment_score + 0.3*community_score )
      outcome = PASS if (composite_score >= 70 AND findings_count <= 2) else FAIL
    input_set: "the three dimension scores and findings_count recorded at complete"
    constants:
      WEIGHT_LABOR: 0.4
      WEIGHT_ENVIRONMENT: 0.3
      WEIGHT_COMMUNITY: 0.3
      PASS_COMPOSITE_MIN: 70
      PASS_MAX_FINDINGS: 2
    precision: "composite_score integer, round_half_up; pass boundary inclusive at 70"
    variants: []

  - name: slot_capacity_consumption
    trigger: "on POST /creamery/production-slots and re-checked on POST /creamery/production-slots/{id}/confirm"
    algorithm: threshold
    formula: |
      chunk_factor = 1.5 if flavor.chunk_load_pct >= 20 else 1.0
      swirl_factor = 1.25 if flavor.swirl_load_pct >= 15 else 1.0
      capacity_units = ceil( planned_pints / 100 * chunk_factor * swirl_factor )
      pool check: sum(capacity_units over ProductionSlots with status in {PLANNED, CONFIRMED}
                    for the same (plant_code, production_date, shift)) + new capacity_units
                    <= PLANT_SHIFT_CAPACITY_UNITS[plant_code]   else ERR_PLANT_CAPACITY_EXCEEDED
    input_set: "the slot's flavor (formulation) and all sibling slots in the same discrete (plant_code, production_date, shift) bucket"
    constants:
      CHUNK_HEAVY_THRESHOLD_PCT: 20
      CHUNK_FACTOR: 1.5
      SWIRL_HEAVY_THRESHOLD_PCT: 15
      SWIRL_FACTOR: 1.25
      PLANT_SHIFT_CAPACITY_UNITS: { VT_WATERBURY: 1000, VT_ST_ALBANS: 800, NL_HELLENDOORN: 600 }
    precision: "capacity_units integer, ceil after multiplication; factors multiply (chunk 1.5 x swirl 1.25 = 1.875)"
    variants: []

  - name: revival_qualification
    trigger: "on POST /creamery/revival-requests/{id}/sign"
    algorithm: threshold
    formula: |
      eligibility at create: flavor.status == RETIRED (else ERR_FLAVOR_NOT_RETIRED)
        AND current logical time <= flavor.retired_at + REVIVAL_WINDOW_DAYS days (else ERR_REVIVAL_WINDOW_EXPIRED)
      on sign: signature_count += count; if signature_count >= REVIVAL_SIGNATURE_THRESHOLD
        then status := QUALIFIED and qualified_at := current logical time
    input_set: "the revival request and its parent flavor's retired_at"
    constants:
      REVIVAL_SIGNATURE_THRESHOLD: 500
      REVIVAL_WINDOW_DAYS: 730
    precision: "threshold inclusive: exactly 500 signatures qualifies; 499 does not"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "acting role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: auth, check: "ownership: ShopOperator's X-User-ID equals the ScoopShop id of the path (or of the order's scoop_shop_id); audit complete requires X-User-ID == auditor_user_id", error_id: ERR_FORBIDDEN_OWNERSHIP, http_status: 403, applies_to: ["POST /creamery/scoop-shops/{id}/supply-orders", "GET /creamery/scoop-shops/{id}/supply-orders", "GET /creamery/scoop-shops/{id} (ShopOperator)", "GET /creamery/supply-orders/{id} (ShopOperator)", "POST /creamery/supply-orders/{id}/deliver", "POST /creamery/supply-orders/{id}/cancel", "POST /creamery/audits/{id}/complete"] }
  - { priority: 4, category: auth, check: "segregation of duties: audit verify X-User-ID != auditor_user_id", error_id: ERR_SOD_AUDITOR_VERIFY, http_status: 403, applies_to: ["POST /creamery/audits/{id}/verify"] }
  - { priority: 5, category: auth, check: "segregation of duties: board-decision X-User-ID != campaign.proposer_user_id", error_id: ERR_SOD_CAMPAIGN_PROPOSER, http_status: 403, applies_to: ["POST /creamery/campaigns/{id}/board-decision"] }
  - { priority: 6, category: existence, check: "path resources exist, validated left-to-right (supplier, then child; shop, then order; etc.)", error_id: ERR_SUPPLIER_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_ENROLLMENT_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_FLAVOR_NOT_FOUND | ERR_REVIVAL_REQUEST_NOT_FOUND | ERR_SLOT_NOT_FOUND | ERR_CAMPAIGN_NOT_FOUND | ERR_SHOP_NOT_FOUND | ERR_ORDER_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 7, category: existence, check: "request-body references exist: order lines' flavor_id values, substantiate-claim certification_ids", error_id: ERR_FLAVOR_NOT_FOUND | ERR_CERTIFICATION_NOT_FOUND, http_status: 404, applies_to: ["POST /creamery/scoop-shops/{id}/supply-orders", "POST /creamery/flavors/{id}/substantiate-claim"] }
  - { priority: 8, category: state, check: "OCC: expected_supplier_version == Supplier.version / expected_flavor_version == Flavor.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /creamery/suppliers/{id}/commitments", "POST /creamery/flavors/{id}/substantiate-claim"] }
  - { priority: 9, category: state, check: "state-machine preconditions: transition listed for the entity's current state; named variants: ERR_SUPPLIER_NOT_APPROVED (commitment create requires APPROVED), ERR_SHOP_NOT_OPERATING, ERR_FLAVOR_NOT_RETIRED, ERR_PAYMENT_NOT_FINAL, ERR_RETAIL_NOTICES_PENDING, ERR_FLAVOR_NOT_SCHEDULABLE, ERR_FLAVOR_NOT_PUBLISHABLE", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints" }
  - { priority: 10, category: business_safety, check: "claim publish: claim_coverage_verified_pct >= CLAIM_COVERAGE_THRESHOLD[claim_type]", error_id: ERR_CLAIM_COVERAGE_INSUFFICIENT, http_status: 422, applies_to: ["POST /creamery/flavors/{id}/publish-claim"] }
  - { priority: 11, category: business_constraint, check: "certification half-open window [issued_at, valid_until) overlap for same (supplier_id, scheme, ingredient_scope) among PENDING/VERIFIED; adjacency (valid_until == issued_at) allowed", error_id: ERR_CERT_WINDOW_OVERLAP, http_status: 409, applies_to: ["POST /creamery/suppliers/{id}/certifications"] }
  - { priority: 12, category: business_constraint, check: "window validity: valid_until > issued_at; effective_to > effective_from", error_id: ERR_CERT_WINDOW_INVALID | ERR_COMMITMENT_WINDOW_INVALID, http_status: 422, applies_to: ["POST /creamery/suppliers/{id}/certifications", "POST /creamery/suppliers/{id}/commitments"] }
  - { priority: 13, category: business_constraint, check: "production_date not before current logical date", error_id: ERR_SLOT_DATE_PAST, http_status: 422, applies_to: ["POST /creamery/production-slots"] }
  - { priority: 14, category: business_constraint, check: "one signature per email per revival request", error_id: ERR_DUPLICATE_SIGNATURE, http_status: 409, applies_to: ["POST /creamery/revival-requests/{id}/sign"] }
  - { priority: 15, category: business_temporal, check: "revival create within REVIVAL_WINDOW_DAYS of flavor.retired_at", error_id: ERR_REVIVAL_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /creamery/flavors/{id}/revival-requests"] }
  - { priority: 16, category: business_temporal, check: "logical clock may not move backwards", error_id: ERR_CLOCK_REGRESSION, http_status: 422, applies_to: ["POST /creamery/_clock/set_current_utc"] }
  - { priority: 17, category: business_referential, check: "claim publish: every cited certification status == VERIFIED", error_id: ERR_CERT_NOT_VERIFIED, http_status: 422, applies_to: ["POST /creamery/flavors/{id}/publish-claim"] }
  - { priority: 18, category: business_referential, check: "claim publish: ingredient scope rule per claim_coverage formula", error_id: ERR_CERT_SCOPE_MISMATCH, http_status: 422, applies_to: ["POST /creamery/flavors/{id}/publish-claim"] }
  - { priority: 19, category: business_referential, check: "order confirm: every line flavor status in {LIMITED_RUN, CORE_LINE}", error_id: ERR_ORDER_FLAVOR_UNAVAILABLE, http_status: 422, applies_to: ["POST /creamery/supply-orders/{id}/confirm"] }
  - { priority: 20, category: business_fiscal, check: "slot create/confirm: plant-shift capacity_units pool not exceeded", error_id: ERR_PLANT_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /creamery/production-slots", "POST /creamery/production-slots/{id}/confirm"] }
  - { priority: 21, category: business_fiscal, check: "order allocate: plant-day pint pool not exceeded", error_id: ERR_ORDER_CAPACITY_EXCEEDED, http_status: 422, applies_to: ["POST /creamery/supply-orders/{id}/allocate"] }
  - { priority: 22, category: business_fiscal, check: "order confirm: total_cents <= shop.credit_limit_cents", error_id: ERR_CREDIT_LIMIT_EXCEEDED, http_status: 422, applies_to: ["POST /creamery/supply-orders/{id}/confirm"] }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/creamery/_clock/set_current_utc", description: "Advance the logical clock; server default before any call is exactly 2026-09-01T00:00:00Z (never wall-clock). Side effects: certification expiry, commitment lapse, slot completion evaluations", roles: [ParentOpsController], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["certifications past valid_until -> EXPIRED (+ claim retraction cascade)", "commitments past effective_to -> LAPSED", "CONFIRMED slots past production_date -> COMPLETED"] }

  - { method: POST, path: "/creamery/suppliers", description: "Register a supplier (PROSPECT)", roles: [SourcingManager], code: 201, input: [name, country_code, ingredient_category], output: Supplier, side_effects: [] }
  - { method: GET, path: "/creamery/suppliers/{id}", description: "Read one supplier", roles: [SourcingManager, SustainabilityAuditor, AuditVerifier, DairyProgramManager, FlavorManager, IndependentBoardMember, ParentOpsController, FranchiseAdmin], code: 200, input: [], output: Supplier, side_effects: [] }
  - { method: POST, path: "/creamery/suppliers/{id}/suspend", description: "Manually suspend an APPROVED supplier (preserves commitments/certifications)", roles: [SourcingManager], code: 200, input: [], output: Supplier, side_effects: ["increments Supplier.version by 1"] }
  - { method: POST, path: "/creamery/suppliers/{id}/reinstate", description: "Reinstate a SUSPENDED supplier to APPROVED", roles: [SourcingManager], code: 200, input: [], output: Supplier, side_effects: ["increments Supplier.version by 1"] }
  - { method: POST, path: "/creamery/suppliers/{id}/terminate", description: "Terminate a supplier (terminal)", roles: [SourcingManager], code: 200, input: [], output: Supplier, side_effects: ["increments Supplier.version by 1"] }
  - { method: POST, path: "/creamery/suppliers/{id}/commitments", description: "Create a sourcing commitment (lands ACTIVE; supersedes the existing ACTIVE commitment for the same ingredient_category). OCC: expected_supplier_version required", roles: [SourcingManager], code: 201, input: [ingredient_category, fair_trade_required, min_social_score, premium_over_commodity_pct, effective_from, effective_to, expected_supplier_version], output: SourcingCommitment, side_effects: ["supersedes prior ACTIVE commitment same (supplier, category)", "increments Supplier.version by 1"] }
  - { method: GET, path: "/creamery/suppliers/{id}/commitments", description: "List a supplier's commitments", roles: [SourcingManager, ParentOpsController], code: 200, input: ["status?", "limit?", "offset?"], output: "SourcingCommitment[]", side_effects: [] }
  - { method: POST, path: "/creamery/suppliers/{id}/certifications", description: "Register a certification (PENDING); half-open window overlap rejected", roles: [SourcingManager], code: 201, input: [scheme, certificate_number, ingredient_scope, issued_at, valid_until, declared_coverage_pct], output: Certification, side_effects: [] }
  - { method: GET, path: "/creamery/suppliers/{id}/certifications", description: "List a supplier's certifications", roles: [SourcingManager, AuditVerifier, FlavorManager], code: 200, input: ["status?", "limit?", "offset?"], output: "Certification[]", side_effects: [] }
  - { method: POST, path: "/creamery/certifications/{id}/verify", description: "Verify a PENDING certification; sets verified_coverage_pct", roles: [AuditVerifier], code: 200, input: [verified_coverage_pct], output: Certification, side_effects: [] }
  - { method: POST, path: "/creamery/certifications/{id}/revoke", description: "Revoke a certification; citing claims challenged", roles: [AuditVerifier], code: 200, input: [], output: Certification, side_effects: ["citing flavors claim_status SUBSTANTIATED|PUBLISHED -> CHALLENGED"] }
  - { method: POST, path: "/creamery/suppliers/{id}/audits", description: "Schedule an audit of a supplier", roles: [SourcingManager], code: 201, input: [scheduled_for], output: Audit, side_effects: [] }
  - { method: GET, path: "/creamery/suppliers/{id}/audits", description: "List a supplier's audits", roles: [SourcingManager, SustainabilityAuditor, AuditVerifier], code: 200, input: ["limit?", "offset?"], output: "Audit[]", side_effects: [] }
  - { method: POST, path: "/creamery/audits/{id}/start", description: "Start a SCHEDULED audit; records auditor_user_id", roles: [SustainabilityAuditor], code: 200, input: [], output: Audit, side_effects: ["sets auditor_user_id from X-User-ID"] }
  - { method: POST, path: "/creamery/audits/{id}/complete", description: "Complete an IN_PROGRESS audit with dimension scores; computes composite and outcome; only the starting auditor may complete", roles: [SustainabilityAuditor], code: 200, input: [labor_score, environment_score, community_score, findings_count], output: Audit, side_effects: ["computes composite_score and outcome per audit_social_composite"] }
  - { method: POST, path: "/creamery/audits/{id}/verify", description: "Verify a COMPLETED audit (verifier != auditor); PASS approves supplier, FAIL triggers audit-fail cascade", roles: [AuditVerifier], code: 200, input: [], output: Audit, side_effects: ["Supplier.social_criteria_score := composite_score", "PASS -> supplier APPROVED", "FAIL -> supplier SUSPENDED + certifications REVOKED + citing claims CHALLENGED + commitments LAPSED"] }

  - { method: POST, path: "/creamery/enrollments", description: "Enroll a dairy farm in the farm program (ENROLLED)", roles: [DairyProgramManager], code: 201, input: [farm_name, region, herd_size, season_year, baseline_volume_liters], output: FarmProgramEnrollment, side_effects: [] }
  - { method: GET, path: "/creamery/enrollments/{id}", description: "Read one enrollment", roles: [DairyProgramManager, ParentOpsController], code: 200, input: [], output: FarmProgramEnrollment, side_effects: [] }
  - { method: POST, path: "/creamery/enrollments/{id}/assess", description: "Record practice scores; computes blended_score; allowed from ENROLLED and ASSESSED", roles: [DairyProgramManager], code: 200, input: [env_practice_score, welfare_practice_score], output: FarmProgramEnrollment, side_effects: ["computes blended_score"] }
  - { method: POST, path: "/creamery/enrollments/{id}/premium-payments", description: "Create a premium payment (CALCULATED, PROVISIONAL variant); enrollment must be ASSESSED", roles: [DairyProgramManager], code: 201, input: [period, declared_volume_liters, commodity_price_cents_per_liter], output: PremiumPayment, side_effects: ["computes premium_pct and gross_amount_cents per farm_premium_payment PROVISIONAL"] }
  - { method: GET, path: "/creamery/enrollments/{id}/premium-payments", description: "List an enrollment's premium payments", roles: [DairyProgramManager, ParentOpsController], code: 200, input: ["limit?", "offset?"], output: "PremiumPayment[]", side_effects: [] }
  - { method: GET, path: "/creamery/premium-payments/{id}", description: "Read one premium payment", roles: [DairyProgramManager, ParentOpsController], code: 200, input: [], output: PremiumPayment, side_effects: [] }
  - { method: POST, path: "/creamery/premium-payments/{id}/finalize", description: "Finalize a PROVISIONAL payment with metered volume and non-conformance count; recomputes FINAL variant", roles: [DairyProgramManager], code: 200, input: [metered_volume_liters, non_conformance_count], output: PremiumPayment, side_effects: ["calc_variant := FINAL", "recomputes premium_pct and gross_amount_cents per farm_premium_payment FINAL"] }
  - { method: POST, path: "/creamery/premium-payments/{id}/approve", description: "Approve a FINAL payment; adds gross to enrollment total_approved_cents", roles: [DairyProgramManager], code: 200, input: [], output: PremiumPayment, side_effects: ["FarmProgramEnrollment.total_approved_cents += gross_amount_cents"] }
  - { method: POST, path: "/creamery/premium-payments/{id}/pay", description: "Pay an APPROVED payment (parent company operational control)", roles: [ParentOpsController], code: 200, input: [], output: PremiumPayment, side_effects: [] }
  - { method: POST, path: "/creamery/premium-payments/{id}/void", description: "Void a CALCULATED or APPROVED payment; voiding APPROVED reverses the enrollment total", roles: [DairyProgramManager], code: 200, input: [], output: PremiumPayment, side_effects: ["if APPROVED: FarmProgramEnrollment.total_approved_cents -= gross_amount_cents"] }

  - { method: POST, path: "/creamery/flavors", description: "Create a flavor (DEVELOPMENT, claim UNCLAIMED)", roles: [FlavorManager], code: 201, input: [name, base_type, chunk_load_pct, swirl_load_pct, pint_price_cents], output: Flavor, side_effects: [] }
  - { method: GET, path: "/creamery/flavors/{id}", description: "Read one flavor", roles: [FlavorManager, PlantScheduler, ParentOpsController, IndependentBoardMember, FranchiseAdmin, ShopOperator, Fan, SourcingManager], code: 200, input: [], output: Flavor, side_effects: [] }
  - { method: POST, path: "/creamery/flavors/{id}/promote", description: "Advance lifecycle: DEVELOPMENT->TEST_BATCH->LIMITED_RUN->CORE_LINE", roles: [FlavorManager], code: 200, input: [target_state], output: Flavor, side_effects: ["increments Flavor.version by 1"] }
  - { method: POST, path: "/creamery/flavors/{id}/retire", description: "Retire a flavor from LIMITED_RUN, CORE_LINE or REVIVED; cascades to orders, slots, claims", roles: [ParentOpsController], code: 200, input: [], output: Flavor, side_effects: ["sets retired_at", "open orders containing flavor -> CANCELLED", "PLANNED/CONFIRMED slots of flavor -> CANCELLED", "claim PUBLISHED -> RETRACTED", "increments Flavor.version by 1"] }
  - { method: POST, path: "/creamery/flavors/{id}/return-to-line", description: "Return a REVIVED flavor to CORE_LINE", roles: [FlavorManager], code: 200, input: [], output: Flavor, side_effects: ["increments Flavor.version by 1"] }
  - { method: POST, path: "/creamery/flavors/{id}/substantiate-claim", description: "Substantiate a packaging/ingredient claim against cited certifications; supersedes current claim state; OCC: expected_flavor_version required", roles: [FlavorManager], code: 200, input: [claim_type, certification_ids, expected_flavor_version], output: Flavor, side_effects: ["sets claim_type and claim_certification_ids", "computes claim_coverage_declared_pct and claim_coverage_verified_pct per claim_coverage", "claim_status -> SUBSTANTIATED", "increments Flavor.version by 1"] }
  - { method: POST, path: "/creamery/flavors/{id}/publish-claim", description: "Publish a SUBSTANTIATED claim; gated by flavor status, verified coverage threshold, cert status and scope", roles: [FlavorManager], code: 200, input: [], output: Flavor, side_effects: ["claim_status -> PUBLISHED", "increments Flavor.version by 1"] }
  - { method: POST, path: "/creamery/flavors/{id}/challenge-claim", description: "Independent board challenges a SUBSTANTIATED or PUBLISHED claim", roles: [IndependentBoardMember], code: 200, input: [], output: Flavor, side_effects: ["claim_status -> CHALLENGED", "increments Flavor.version by 1"] }

  - { method: POST, path: "/creamery/flavors/{id}/revival-requests", description: "Open a fan revival request for a RETIRED flavor within the revival window", roles: [Fan], code: 201, input: [fan_email, title], output: RevivalRequest, side_effects: [] }
  - { method: GET, path: "/creamery/flavors/{id}/revival-requests", description: "List revival requests for a flavor", roles: [Fan, FlavorManager, IndependentBoardMember], code: 200, input: ["status?", "limit?", "offset?"], output: "RevivalRequest[]", side_effects: [] }
  - { method: POST, path: "/creamery/revival-requests/{id}/sign", description: "Sign an OPEN revival request (one signature per email); reaching 500 auto-qualifies", roles: [Fan], code: 200, input: [fan_email, "count?"], output: RevivalRequest, side_effects: ["signature_count += count", "if signature_count >= 500: status QUALIFIED and qualified_at set"] }
  - { method: POST, path: "/creamery/revival-requests/{id}/adopt", description: "Board adopts a QUALIFIED revival request; flavor RETIRED -> REVIVED", roles: [IndependentBoardMember], code: 200, input: [], output: RevivalRequest, side_effects: ["Flavor transitions RETIRED -> REVIVED"] }
  - { method: POST, path: "/creamery/revival-requests/{id}/decline", description: "Board declines an OPEN or QUALIFIED revival request", roles: [IndependentBoardMember], code: 200, input: [], output: RevivalRequest, side_effects: [] }

  - { method: POST, path: "/creamery/production-slots", description: "Schedule a production run; chunk/swirl-heavy formulations consume extra capacity units; plant-shift pool checked", roles: [PlantScheduler], code: 201, input: [plant_code, flavor_id, production_date, shift, planned_pints], output: ProductionSlot, side_effects: ["computes capacity_units per slot_capacity_consumption"] }
  - { method: GET, path: "/creamery/production-slots", description: "List production slots with filters", roles: [PlantScheduler, FlavorManager], code: 200, input: ["flavor_id?", "plant_code?", "production_date?", "status?", "limit?", "offset?"], output: "ProductionSlot[]", side_effects: [] }
  - { method: GET, path: "/creamery/production-slots/{id}", description: "Read one production slot", roles: [PlantScheduler, FlavorManager], code: 200, input: [], output: ProductionSlot, side_effects: [] }
  - { method: POST, path: "/creamery/production-slots/{id}/confirm", description: "Confirm a PLANNED slot; flavor must be TEST_BATCH/LIMITED_RUN/CORE_LINE; capacity re-checked", roles: [PlantScheduler], code: 200, input: [], output: ProductionSlot, side_effects: [] }
  - { method: POST, path: "/creamery/production-slots/{id}/cancel", description: "Cancel a PLANNED or CONFIRMED slot; releases capacity units", roles: [PlantScheduler], code: 200, input: [], output: ProductionSlot, side_effects: ["releases reserved capacity_units"] }

  - { method: POST, path: "/creamery/campaigns", description: "Propose an activism campaign (lands in BOARD_REVIEW); proposer_user_id recorded from X-User-ID", roles: [IndependentBoardMember], code: 201, input: [title, issue_area, retail_partner_impact], output: Campaign, side_effects: ["retail_notice_status := NOT_REQUIRED if impact NONE else PENDING"] }
  - { method: GET, path: "/creamery/campaigns/{id}", description: "Read one campaign", roles: [IndependentBoardMember, ParentOpsController, FlavorManager], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: POST, path: "/creamery/campaigns/{id}/board-decision", description: "Board approve/reject; decider must differ from proposer", roles: [IndependentBoardMember], code: 200, input: [approve], output: Campaign, side_effects: ["sets decided_by_user_id"] }
  - { method: POST, path: "/creamery/campaigns/{id}/schedule-ops", description: "Parent company schedules operations for a BOARD_APPROVED campaign", roles: [ParentOpsController], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: POST, path: "/creamery/campaigns/{id}/dispatch-retail-notices", description: "Dispatch retail-partner notices (PENDING -> DISPATCHED) once board-approved", roles: [ParentOpsController], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: POST, path: "/creamery/campaigns/{id}/launch", description: "Launch an OPS_SCHEDULED campaign; requires notices dispatched when impact is not NONE", roles: [ParentOpsController], code: 200, input: [], output: Campaign, side_effects: [] }
  - { method: POST, path: "/creamery/campaigns/{id}/veto", description: "Independent board veto withdraws a campaign from BOARD_APPROVED, OPS_SCHEDULED or LAUNCHED", roles: [IndependentBoardMember], code: 200, input: [], output: Campaign, side_effects: ["approval_status -> WITHDRAWN"] }

  - { method: POST, path: "/creamery/scoop-shops", description: "Register a franchise/partner scoop shop application (SITE_REVIEW)", roles: [FranchiseAdmin], code: 201, input: [name, operator_type, "nonprofit_verified?", city, country_code, credit_limit_cents], output: ScoopShop, side_effects: ["computes franchise_fee_cents (3500000 FRANCHISEE, 0 NONPROFIT_PARTNER)"] }
  - { method: GET, path: "/creamery/scoop-shops/{id}", description: "Read one scoop shop", roles: [FranchiseAdmin, ShopOperator, ParentOpsController], code: 200, input: [], output: ScoopShop, side_effects: [] }
  - { method: POST, path: "/creamery/scoop-shops/{id}/approve-site", description: "Approve the site (SITE_REVIEW -> SITE_APPROVED)", roles: [FranchiseAdmin], code: 200, input: [], output: ScoopShop, side_effects: [] }
  - { method: POST, path: "/creamery/scoop-shops/{id}/reject-site", description: "Reject the site (SITE_REVIEW -> CLOSED)", roles: [FranchiseAdmin], code: 200, input: [], output: ScoopShop, side_effects: [] }
  - { method: POST, path: "/creamery/scoop-shops/{id}/open", description: "Open a SITE_APPROVED shop; partner shops require nonprofit_verified", roles: [FranchiseAdmin], code: 200, input: [], output: ScoopShop, side_effects: [] }
  - { method: POST, path: "/creamery/scoop-shops/{id}/suspend", description: "Suspend an OPERATING shop", roles: [FranchiseAdmin], code: 200, input: [], output: ScoopShop, side_effects: [] }
  - { method: POST, path: "/creamery/scoop-shops/{id}/reopen", description: "Reopen a SUSPENDED shop", roles: [FranchiseAdmin], code: 200, input: [], output: ScoopShop, side_effects: [] }
  - { method: POST, path: "/creamery/scoop-shops/{id}/supply-orders", description: "Place a supply order for own shop (PLACED); total computed at creation", roles: [ShopOperator], code: 201, input: [production_date, lines], output: ShopSupplyOrder, side_effects: ["computes total_pints and total_cents per supply_order_total"] }
  - { method: GET, path: "/creamery/scoop-shops/{id}/supply-orders", description: "List a shop's supply orders", roles: [FranchiseAdmin, ShopOperator], code: 200, input: ["status?", "limit?", "offset?"], output: "ShopSupplyOrder[]", side_effects: [] }
  - { method: GET, path: "/creamery/supply-orders/{id}", description: "Read one supply order", roles: [FranchiseAdmin, ShopOperator, PlantScheduler], code: 200, input: [], output: ShopSupplyOrder, side_effects: [] }
  - { method: POST, path: "/creamery/supply-orders/{id}/confirm", description: "Confirm a PLACED order; requires shop OPERATING, flavors orderable, within credit limit", roles: [FranchiseAdmin], code: 200, input: [], output: ShopSupplyOrder, side_effects: [] }
  - { method: POST, path: "/creamery/supply-orders/{id}/allocate", description: "Allocate a CONFIRMED order to a plant-day pint pool", roles: [PlantScheduler], code: 200, input: [plant_code], output: ShopSupplyOrder, side_effects: ["sets allocated_plant_code", "reserves total_pints in the (plant_code, production_date) pool"] }
  - { method: POST, path: "/creamery/supply-orders/{id}/deliver", description: "Mark an ALLOCATED order delivered (own shop)", roles: [ShopOperator], code: 200, input: [], output: ShopSupplyOrder, side_effects: [] }
  - { method: POST, path: "/creamery/supply-orders/{id}/cancel", description: "Cancel a PLACED, CONFIRMED or ALLOCATED order (own shop); releases reserved capacity", roles: [ShopOperator], code: 200, input: [], output: ShopSupplyOrder, side_effects: ["if ALLOCATED: releases total_pints from the plant-day pool"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "ShopOperator acts on another shop's resources, or a non-starting auditor completes an audit" }
  - { id: ERR_SOD_AUDITOR_VERIFY, http: 403, condition: "AuditVerifier's X-User-ID equals the audit's auditor_user_id" }
  - { id: ERR_SOD_CAMPAIGN_PROPOSER, http: 403, condition: "Board-decision X-User-ID equals campaign.proposer_user_id" }
  - { id: ERR_SUPPLIER_NOT_FOUND, http: 404, condition: "Supplier id does not exist" }
  - { id: ERR_CERTIFICATION_NOT_FOUND, http: 404, condition: "Certification id does not exist (path or claim citation)" }
  - { id: ERR_AUDIT_NOT_FOUND, http: 404, condition: "Audit id does not exist" }
  - { id: ERR_ENROLLMENT_NOT_FOUND, http: 404, condition: "Enrollment id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "PremiumPayment id does not exist" }
  - { id: ERR_FLAVOR_NOT_FOUND, http: 404, condition: "Flavor id does not exist (path, order line, or slot reference)" }
  - { id: ERR_REVIVAL_REQUEST_NOT_FOUND, http: 404, condition: "RevivalRequest id does not exist" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "ProductionSlot id does not exist" }
  - { id: ERR_CAMPAIGN_NOT_FOUND, http: 404, condition: "Campaign id does not exist" }
  - { id: ERR_SHOP_NOT_FOUND, http: 404, condition: "ScoopShop id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "ShopSupplyOrder id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field or malformed value" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value not in the declared set" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition is defined" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_SUPPLIER_NOT_APPROVED, http: 409, condition: "Commitment create requires supplier.status == APPROVED" }
  - { id: ERR_CERT_WINDOW_OVERLAP, http: 409, condition: "Certification window overlaps another PENDING/VERIFIED cert of same (supplier, scheme, ingredient_scope); adjacency allowed" }
  - { id: ERR_CERT_WINDOW_INVALID, http: 422, condition: "valid_until <= issued_at" }
  - { id: ERR_COMMITMENT_WINDOW_INVALID, http: 422, condition: "effective_to <= effective_from" }
  - { id: ERR_PLANT_CAPACITY_EXCEEDED, http: 422, condition: "Slot capacity_units would push the (plant, date, shift) pool past PLANT_SHIFT_CAPACITY_UNITS" }
  - { id: ERR_ORDER_CAPACITY_EXCEEDED, http: 422, condition: "Order total_pints would push the (plant, production_date) pool past PLANT_DAY_ORDER_CAPACITY_PINTS" }
  - { id: ERR_SLOT_DATE_PAST, http: 422, condition: "Slot production_date is before the current logical date" }
  - { id: ERR_DUPLICATE_SIGNATURE, http: 409, condition: "fan_email already signed this revival request" }
  - { id: ERR_REVIVAL_WINDOW_EXPIRED, http: 422, condition: "Revival create after flavor.retired_at + 730 days" }
  - { id: ERR_FLAVOR_NOT_RETIRED, http: 409, condition: "Revival request create requires flavor.status == RETIRED" }
  - { id: ERR_FLAVOR_NOT_SCHEDULABLE, http: 409, condition: "Slot confirm requires flavor.status in TEST_BATCH, LIMITED_RUN or CORE_LINE" }
  - { id: ERR_FLAVOR_NOT_PUBLISHABLE, http: 409, condition: "Claim publish requires flavor.status in LIMITED_RUN or CORE_LINE" }
  - { id: ERR_PAYMENT_NOT_FINAL, http: 409, condition: "Approve requires calc_variant == FINAL" }
  - { id: ERR_CLAIM_COVERAGE_INSUFFICIENT, http: 422, condition: "claim_coverage_verified_pct below the claim type threshold at publish" }
  - { id: ERR_CERT_NOT_VERIFIED, http: 422, condition: "A cited certification is not in VERIFIED status at publish" }
  - { id: ERR_CERT_SCOPE_MISMATCH, http: 422, condition: "Cited certifications do not satisfy the flavor base_type scope rule at publish" }
  - { id: ERR_ORDER_FLAVOR_UNAVAILABLE, http: 422, condition: "Order confirm: a line flavor is not in LIMITED_RUN or CORE_LINE" }
  - { id: ERR_SHOP_NOT_OPERATING, http: 409, condition: "Order confirm requires shop.status == OPERATING" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Order confirm: total_cents exceeds shop.credit_limit_cents" }
  - { id: ERR_RETAIL_NOTICES_PENDING, http: 409, condition: "Campaign launch while retail_notice_status == PENDING" }
  - { id: ERR_NONPROFIT_VERIFICATION_REQUIRED, http: 422, condition: "Partner shop open requires nonprofit_verified == true" }
  - { id: ERR_CLOCK_REGRESSION, http: 422, condition: "set_current_utc to a time before the current logical time" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - { name: SourcingManager, description: "Owns suppliers, commitments, certifications, and audit scheduling", identity: opaque, exclusive_operations: ["create/suspend/reinstate/terminate supplier", "create commitment", "create certification", "schedule audit"], shared_operations: ["read supplier", "list commitments/certifications/audits"] }
  - { name: SustainabilityAuditor, description: "Performs supplier audits; cannot verify own audit", identity: opaque, exclusive_operations: ["start audit", "complete audit"], shared_operations: ["read supplier", "list audits"] }
  - { name: AuditVerifier, description: "Verifies audits and certifications; independent from SourcingManager and the performing auditor", identity: opaque, exclusive_operations: ["verify audit", "verify certification", "revoke certification"], shared_operations: ["read supplier", "list audits/certifications"] }
  - { name: DairyProgramManager, description: "Runs the dairy farm program: enrollments, assessments, premium calculation/approval/void", identity: opaque, exclusive_operations: ["create enrollment", "assess enrollment", "create/finalize/approve/void premium payment"], shared_operations: ["read enrollment/payment"] }
  - { name: FlavorManager, description: "Owns flavor lifecycle promotion, claim substantiation/publish, and revival return-to-line", identity: opaque, exclusive_operations: ["create flavor", "promote flavor", "return-to-line", "substantiate claim", "publish claim"], shared_operations: ["read flavor", "list revival requests", "list production slots"] }
  - { name: PlantScheduler, description: "Schedules plant production and allocates supply orders to plant-day capacity", identity: opaque, exclusive_operations: ["create/confirm/cancel production slot", "allocate supply order"], shared_operations: ["read flavor", "read supply order", "list production slots"] }
  - { name: IndependentBoardMember, description: "Independent board: sole authority over social-mission decisions (campaign approval/veto, revival adoption, claim challenges)", identity: opaque, exclusive_operations: ["create campaign", "board decision", "campaign veto", "adopt/decline revival", "challenge claim"], shared_operations: ["read campaign", "read flavor", "read supplier"] }
  - { name: ParentOpsController, description: "Parent company operational control: flavor retirement, campaign ops scheduling/launch, premium disbursement, logical clock", identity: opaque, exclusive_operations: ["retire flavor", "schedule ops", "dispatch retail notices", "launch campaign", "pay premium", "advance clock"], shared_operations: ["read supplier/commitment/enrollment/payment/campaign/shop"] }
  - { name: FranchiseAdmin, description: "Manages the scoop shop program: applications, site approval, openings, suspensions, order confirmation", identity: opaque, exclusive_operations: ["create scoop shop", "approve/reject site", "open/suspend/reopen shop", "confirm supply order"], shared_operations: ["read shop", "list/read supply orders"] }
  - { name: ShopOperator, description: "Operator of one scoop shop; X-User-ID equals the ScoopShop id", identity: "entity_backed:ScoopShop", exclusive_operations: ["place supply order", "deliver order", "cancel order"], shared_operations: ["read own shop", "list/read own orders", "read flavor"] }
  - { name: Fan, description: "Ice-cream fan; opens and signs flavor revival requests", identity: opaque, exclusive_operations: ["create revival request", "sign revival request"], shared_operations: ["read flavor", "list revival requests"] }
