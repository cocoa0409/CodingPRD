      - name: environmental_threshold_operator_precision
        grounds:
          - calculations.environmental_posture_evaluation
          - entities.StorageZone.fields.breach_streak
        distinguishing_aspect: |
          Metric: environmental threshold operators; endpoint: POST
          /storage-zones/{id}/readings. Temperature uses STRICT > (exactly 24.0 is
          in range) while humidity uses INCLUSIVE >= (exactly 60.0 is a breach) —
          the asymmetric operator pair is observable through breach_streak.
        test_recipe:
          setup:
            - "Zone Z with default thresholds (temp_high 24.0, humidity_high 60.0); posture OPEN, breach_streak 0"
          setup_api_calls:
            - { call: "POST /storage-zones", payload: { zone_code: "Z1", name: "Vault A" }, as: Registrar, captures: { z: $.data.id } }
          trigger:
            - { call: "POST /storage-zones/${z}/readings", payload: { recorded_at: "2026-08-01T01:00:00Z", temperature_c: 24.0, humidity_pct: 50.0 }, as: SystemAdmin, captures: { k1: $.data.breach_streak, p1: $.data.posture } }
            - { call: "POST /storage-zones/${z}/readings", payload: { recorded_at: "2026-08-01T02:00:00Z", temperature_c: 24.1, humidity_pct: 50.0 }, as: SystemAdmin, captures: { k2: $.data.breach_streak } }
            - { call: "POST /storage-zones/${z}/readings", payload: { recorded_at: "2026-08-01T03:00:00Z", temperature_c: 20.0, humidity_pct: 60.0 }, as: SystemAdmin, captures: { k3: $.data.breach_streak, p3: $.data.posture } }
          assert:
            - "temp exactly 24.0 (== temp_high): not a breach — breach_streak == 0 (${k1}), posture OPEN (${p1})"
            - "temp 24.1 (> temp_high): breach — breach_streak == 1 (${k2})"
            - "humidity exactly 60.0 (>= humidity_high): breach even with temp in range — breach_streak == 2 (${k3})"
            - "posture still OPEN (${p3}) — two breaches sit inside the hysteresis band (< 3)"

