  # ---------- filtered collection lists ----------
  - method: GET
    path: "/cbb/enrollments"
    description: "Paginated enrollment list with filters; default order created_at ASC."
    roles: [IntakeCoordinator, MedicalDirector, BillingAdministrator, PlatformAdmin]
