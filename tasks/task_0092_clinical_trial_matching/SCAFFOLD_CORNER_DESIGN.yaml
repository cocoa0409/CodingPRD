              payload: { action: "APPROVE" }
              as: IRBReviewer
              as_user_id: "sponsor-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "response.data.error_id == ERR_SEGREGATION_OF_DUTIES"
            - "IRBReview.${review_id}.decision == PENDING"

