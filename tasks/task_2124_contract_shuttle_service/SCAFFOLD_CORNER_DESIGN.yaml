              payload: { fleet_code: "SHV-2501", seat_capacity: 20, is_ada_accessible: false, odometer_km: 800, service_interval_km: 20000 }
              as: FleetManager
              captures: { vt1: $.data.id }
            - call: "POST /drivers"
              payload: { full_name: "Cascade Driver", license_class: "CDL_B", ada_certified: false, max_duty_minutes_per_day: 480 }
              as: OpsPlanner
              captures: { dt1: $.data.id }
            - call: "POST /routes/${rt1}/publish"
              payload: { service_date: "2026-09-02" }
              as: OpsPlanner
            - call: "GET /trips"
              payload: { route_id: "${rt1}", service_date: "2026-09-02" }
              as: OpsPlanner
              captures: { tt1: "$.data[0].id", tt2: "$.data[1].id" }
