      - name: irrigation_window_overlap_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=31]
          - errors[ERR_IRRIGATION_WINDOW_OVERLAP]
        distinguishing_aspect: "Covered by the resource_temporal_overlap depth instance, which drives the same 409 at the half-open boundary."
        excluded_because:
          difficulty_instance: resource_temporal_overlap / irrigation_window_half_open_overlap_on_property
          rationale: "The depth instance already exercises ERR_IRRIGATION_WINDOW_OVERLAP at the abutting and the intersecting boundary on the same property; a plain breadth repeat would add no distinguishable observation."

      - name: device_transfer_locked_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=23]
          - errors[ERR_DEVICE_TRANSFER_LOCKED]
        distinguishing_aspect: "Covered by the five-hop transfer cascade depth instance, whose PENDING transfer locks the device against a second transfer and against monitor-mode writes."
        excluded_because:
          difficulty_instance: transitive_cascade / transfer_accept_five_hop_cascade
          rationale: "The depth instance holds a PENDING DeviceTransfer and already asserts the locked-device refusal along with the downstream cascade, so the breadth variant is redundant."

      - name: policy_terminated_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=36]
          - errors[ERR_POLICY_TERMINATED]
        distinguishing_aspect: "Covered by the cross_entity_state_dependency depth instance, which submits a claim against a TERMINATED policy."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / terminated_policy_blocks_claim_submission
          rationale: "That instance already isolates the terminated-policy refusal from the otherwise-valid claim payload, including the pass case before termination."

      - name: annual_payout_cap_exceeded_error
        claim_type: Violation → Error
        grounds:
          - validations[priority=45]
          - errors[ERR_ANNUAL_PAYOUT_CAP_EXCEEDED]
        distinguishing_aspect: "Covered by the priority-pair depth instance that violates the claim-state gate and the payout cap in one request."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / claim_state_beats_payout_cap
          rationale: "The depth instance triggers the cap alone and then in combination with the higher-priority state gate, which subsumes the single-error breadth check."

      - name: mode_transition_and_snooze_cooldown_errors
        claim_type: Violation → Error
        grounds:
          - validations[priority=24]
          - validations[priority=25]
          - errors[ERR_MODE_TRANSITION_FORBIDDEN]
          - errors[ERR_SNOOZE_COOLDOWN_ACTIVE]
        distinguishing_aspect: "Covered by the priority-pair depth instance that violates the forbidden mode transition and the snooze cooldown in the same command."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / mode_transition_beats_snooze_cooldown
          rationale: "Both error ids are already reached there — the cooldown alone and then masked by the forbidden transition — so a breadth repeat would observe nothing new."

