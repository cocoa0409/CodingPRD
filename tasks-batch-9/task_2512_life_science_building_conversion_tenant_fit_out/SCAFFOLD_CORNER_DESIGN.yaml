              as: LandlordAssetManager
              captures: { sc_ex_id: "$.data.id" }
            - call: "POST /buildings/${b_id}/conversion-approval"
              payload: {}
              as: LandlordAssetManager
            - call: "POST /conversion-scope-items/${sc_ex_id}/complete"
              payload: {}
