              as: ChannelManager
              as_user_id: "${cp}"
              captures: { cc: $.data.id }
            - call: "POST /battery-ecosystem/counterfeit-cases/${cc}/resolve"
              payload: { verdict: "CONFIRMED", evidence_score: 95 }
              as: ComplianceEngineer
              as_user_id: "ce-bob"
          trigger:
            - call: "POST /battery-ecosystem/listings/${li}/transition"
