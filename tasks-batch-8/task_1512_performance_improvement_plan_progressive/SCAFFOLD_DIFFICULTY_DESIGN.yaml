  # ===========================================================================
  # Rule 8: resource_temporal_overlap — different interval semantics.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rating_cycle_half_open_overlap_rejected_adjacent_allowed
        grounds:
          - entities.RatingCycle
          - validations[priority=11]
        distinguishing_aspect: |
          Interval semantics: half-open [window_start, window_end) on the
          HROrgUnit resource. Two cycles where one starts strictly inside
          another's window must be rejected; a cycle whose window_start
          equals an existing cycle's window_end (adjacent, zero overlap)
          must be accepted. Reachable through POST rating-cycles.
        test_recipe:
          setup:
            - "Org unit OU1"
            - "Rating cycle RC1 [2026-01-01, 2026-07-01) exists"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/employees"
              payload: { full_name: "HRBP", email: "h@x.com", job_family: "OPERATIONS", job_level: 7 }
              as: HRSystemAdmin
              captures: { hrbp_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/rating-cycles"
              payload: { label: "2026-H1", window_start: "2026-01-01T00:00:00Z", window_end: "2026-07-01T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { cycle1: $.data.id }
          trigger:
            - call: "POST /hr-org-units/${ou_id}/rating-cycles"
              payload: { label: "overlap", window_start: "2026-06-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { err: $.data.error_id }
            - call: "POST /hr-org-units/${ou_id}/rating-cycles"
              payload: { label: "2026-H2", window_start: "2026-07-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: HRBusinessPartner
              as_user_id: "${hrbp_id}"
              captures: { cycle2: $.data.id }
          assert:
            - "First trigger returns HTTP 409 with ERR_INVALID_STATE (overlap detected: 2026-06-01 < 2026-07-01 = RC1.window_end)"
            - "Second trigger returns HTTP 201 (adjacent half-open boundary allowed)"
