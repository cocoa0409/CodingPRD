scaffold_corner_design:

  # =========================================================================
  - section: Entities
    instances:
      - name: corner_fee_plan_creation_returns_envelope_and_all_fields
        claim_type: Creation
        grounds:
          - entities.FeePlan
          - endpoints.POST./fee-plans
        distinguishing_aspect: "POST /fee-plans with FLAT model and all required fields returns 201 with a FeePlan whose pricing_model, flat_pct_bps and flat_fixed_cents echo the input and id/created_at are system-stamped."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /fee-plans"
              payload: { name: "Standard Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
          assert:
            - "response status == 201"
            - "data.pricing_model == FLAT"
            - "data.flat_pct_bps == 290"
            - "data.flat_fixed_cents == 30"
            - "data.chargeback_fee_cents == 1500"
            - "data.id is a non-empty string"

      - name: corner_fee_plan_default_chargeback_fee_applied
        claim_type: Defaults
        grounds:
          - entities.FeePlan.fields.chargeback_fee_cents
          - endpoints.POST./fee-plans
        distinguishing_aspect: "Omitting chargeback_fee_cents on a FLAT fee plan applies the declared default of 1500."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /fee-plans"
              payload: { name: "No CB Fee", pricing_model: "FLAT", flat_pct_bps: 200, flat_fixed_cents: 25 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
          assert:
            - "data.chargeback_fee_cents == 1500"

      - name: corner_merchant_registration_defaults_and_initial_status
        claim_type: Defaults
        grounds:
          - entities.Merchant.fields.onboarding_status
          - entities.Merchant.fields.payout_method
          - endpoints.POST./merchants
        distinguishing_aspect: "Registering a merchant without payout_method applies default BANK_ACCOUNT, sets onboarding_status=PENDING_REVIEW, and zeroes computed balances."
        test_recipe:
          setup:
            - "A FeePlan exists."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /merchants"
              payload: { legal_name: "New Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
          assert:
            - "response status == 201"
            - "data.onboarding_status == PENDING_REVIEW"
            - "data.payout_method == BANK_ACCOUNT"
            - "data.available_balance_cents == 0"
            - "data.reserved_balance_cents == 0"

      - name: corner_merchant_retrieval_returns_stored_entity
        claim_type: Retrieval
        grounds:
          - entities.Merchant
          - endpoints.GET./merchants/{id}
        distinguishing_aspect: "GET /merchants/{id} returns the merchant whose id was just created, with legal_name and mcc matching the registration input."
        test_recipe:
          setup:
            - "A registered merchant exists."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Lookup Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
          trigger:
            - call: "GET /merchants/${m_id}"
              payload: {}
              as: PlatformOperator
          assert:
            - "response status == 200"
            - "data.id == ${m_id}"
            - "data.legal_name == Lookup Co"
            - "data.mcc == 5812"

      - name: corner_merchant_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Merchant
          - endpoints.GET./merchants/{id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "GET /merchants/{id} for a non-existent UUID returns ERR_NOT_FOUND with HTTP 404."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /merchants/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: corner_merchant_listing_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Merchant
          - endpoints.GET./merchants
        distinguishing_aspect: "GET /merchants?limit=2 with three merchants present returns exactly 2 items, total_count=3 and has_more=true in pagination fields."
        test_recipe:
          setup:
            - "Three merchants registered on the same fee plan."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "A Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 10000 }
              as: Anonymous
            - call: "POST /merchants"
              payload: { legal_name: "B Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 10000 }
              as: Anonymous
            - call: "POST /merchants"
              payload: { legal_name: "C Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 10000 }
              as: Anonymous
          trigger:
            - call: "GET /merchants?limit=2&offset=0"
              payload: {}
              as: PlatformOperator
          assert:
            - "response status == 200"
            - "len(data) == 2"
            - "meta/pagination total_count == 3"
            - "meta/pagination has_more == true"

      - name: corner_merchant_list_filter_by_fee_plan
        claim_type: Listing
        grounds:
          - entities.Merchant.fields.fee_plan_id
          - endpoints.GET./merchants
        distinguishing_aspect: "GET /merchants?fee_plan_id=X returns only merchants whose fee_plan_id equals X, excluding merchants on a different plan."
        test_recipe:
          setup:
            - "Two fee plans; one merchant on each."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Plan A", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_a: $.data.id }
            - call: "POST /fee-plans"
              payload: { name: "Plan B", pricing_model: "FLAT", flat_pct_bps: 100, flat_fixed_cents: 10 }
              as: PlatformOperator
              captures: { plan_b: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "On A", mcc: "5812", fee_plan_id: "${plan_a}", requested_monthly_volume_cents: 10000 }
              as: Anonymous
              captures: { m_a: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "On B", mcc: "5812", fee_plan_id: "${plan_b}", requested_monthly_volume_cents: 10000 }
              as: Anonymous
              captures: { m_b: $.data.id }
          trigger:
            - call: "GET /merchants?fee_plan_id=${plan_a}"
              payload: {}
              as: PlatformOperator
          assert:
            - "response status == 200"
            - "every returned merchant has fee_plan_id == ${plan_a}"
            - "merchant ${m_b} is NOT in the returned list"

      - name: corner_merchant_missing_required_legal_name
        claim_type: Required Fields
        grounds:
          - entities.Merchant.fields.legal_name
          - endpoints.POST./merchants
          - errors.ERR_VALIDATION
        distinguishing_aspect: "POST /merchants omitting the required legal_name returns ERR_VALIDATION (400)."
        test_recipe:
          setup:
            - "A FeePlan exists."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /merchants"
              payload: { mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 10000 }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 400"
            - "data.error_id == ERR_VALIDATION"

      - name: corner_merchant_fk_fee_plan_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Merchant.fields.fee_plan_id
          - endpoints.POST./merchants
          - errors.ERR_FK_NOT_FOUND
        distinguishing_aspect: "POST /merchants with a fee_plan_id that references no FeePlan returns ERR_FK_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB (no fee plans)."
          setup_api_calls: []
          trigger:
            - call: "POST /merchants"
              payload: { legal_name: "Dangling", mcc: "5812", fee_plan_id: "00000000-0000-0000-0000-000000000000", requested_monthly_volume_cents: 10000 }
              as: Anonymous
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_FK_NOT_FOUND"

      - name: corner_charge_computed_fields_ignored_on_create
        claim_type: Computed Fields
        grounds:
          - entities.Charge.fields.captured_amount_cents
          - entities.Charge.fields.auth_status
          - endpoints.POST./merchants/{id}/charges
        distinguishing_aspect: "Authorizing a charge sets auth_status=AUTHORIZED, settlement_status=PENDING and captured_amount_cents=0 (computed), regardless of input; only auth_amount_cents and card_last4 are accepted."
        test_recipe:
          setup:
            - "An APPROVED LOW-risk merchant."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Charge Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
          trigger:
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 7000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
          assert:
            - "response status == 201"
            - "data.auth_status == AUTHORIZED"
            - "data.settlement_status == PENDING"
            - "data.captured_amount_cents == 0"
            - "data.refunded_amount_cents == 0"
            - "data.processing_fee_cents == 0"

      - name: corner_ledger_entry_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.LedgerEntry
          - endpoints.GET./merchants/{id}/ledger-entries
        distinguishing_aspect: "LedgerEntry is common_fields:false (immutable): there is no POST/PUT/PATCH ledger-entry endpoint in §1.5; ledger entries are only readable via GET /merchants/{id}/ledger-entries."
        test_recipe:
          setup:
            - "An APPROVED merchant that has had one funded batch, producing FUNDING + RESERVE_HOLD ledger entries."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Ledger Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "MEDIUM" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
          trigger:
            - call: "GET /merchants/${m_id}/ledger-entries"
              payload: {}
              as: PlatformOperator
          assert:
            - "response status == 200"
            - "data is an array containing at least one LedgerEntry with entry_type == RESERVE_HOLD"
            - "no LedgerEntry has a version field (LedgerEntry is common_fields:false / immutable)"

  # =========================================================================
  - section: State Machines
    instances:
      - name: corner_charge_void_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.Charge.AUTHORIZED_PENDING_to_VOIDED_PENDING
          - endpoints.POST./charges/{id}/void
        distinguishing_aspect: "POST /charges/{id}/void on an AUTHORIZED charge moves auth_status to VOIDED while settlement_status stays PENDING."
        test_recipe:
          setup:
            - "An APPROVED merchant with an AUTHORIZED charge of 5000."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Void Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 5000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
          trigger:
            - call: "POST /charges/${ch_id}/void"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
          assert:
            - "response status == 200"
            - "data.auth_status == VOIDED"
            - "data.settlement_status == PENDING"

      - name: corner_merchant_reject_initial_to_terminal
        claim_type: Valid Transition
        grounds:
          - state_machines.Merchant.PENDING_REVIEW_to_REJECTED
          - endpoints.POST./merchants/{id}/risk-reviews/{rid}/reject
        distinguishing_aspect: "Rejecting an OPEN risk review moves the merchant onboarding_status PENDING_REVIEW -> REJECTED (terminal)."
        test_recipe:
          setup:
            - "A PENDING_REVIEW merchant with its auto-created OPEN risk review."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Reject Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
          trigger:
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/reject"
              payload: { notes: "incomplete docs" }
              as: UnderwritingOfficer
          assert:
            - "response status == 200"
            - "data.onboarding_status == REJECTED"

      - name: corner_merchant_suspend_reinstate_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.Merchant.APPROVED_to_SUSPENDED
          - state_machines.Merchant.SUSPENDED_to_APPROVED
          - endpoints.POST./merchants/{id}/reinstate
        distinguishing_aspect: "An APPROVED merchant suspended then reinstated returns to onboarding_status=APPROVED, and version increments on each transition."
        test_recipe:
          setup:
            - "An APPROVED LOW merchant."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Cycle Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
              captures: { v_after_approve: $.data.version }
            - call: "POST /merchants/${m_id}/suspend"
              payload: {}
              as: UnderwritingOfficer
              captures: { v_after_suspend: $.data.version }
          trigger:
            - call: "POST /merchants/${m_id}/reinstate"
              payload: {}
              as: UnderwritingOfficer
              captures: { v_after_reinstate: $.data.version }
          assert:
            - "data.onboarding_status == APPROVED after reinstate"
            - "${v_after_reinstate} == ${v_after_suspend} + 1"

      - name: corner_charge_void_invalid_from_captured
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Charge.AUTHORIZED_PENDING_to_CAPTURED_PENDING
          - endpoints.POST./charges/{id}/void
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Voiding a charge that has already been CAPTURED (auth_status=CAPTURED) is rejected with ERR_INVALID_STATE (409) since void is only defined from AUTHORIZED."
        test_recipe:
          setup:
            - "An APPROVED merchant with a captured charge."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "VC Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 5000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 5000 }
              as: MerchantUser
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /charges/${ch_id}/void"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: corner_dispute_acknowledge_twice_idempotency_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Dispute.OPEN_to_UNDER_REVIEW
          - endpoints.POST./disputes/{id}/acknowledge
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Acknowledging a dispute a second time (already UNDER_REVIEW) is rejected with ERR_INVALID_STATE because acknowledge is only defined from OPEN."
        test_recipe:
          setup:
            - "A SETTLED charge with an OPEN dispute that has been acknowledged once."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30, chargeback_fee_cents: 1500 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformOperator
            - call: "POST /merchants"
              payload: { legal_name: "Ack Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/approve"
              payload: { assigned_risk_band: "LOW" }
              as: UnderwritingOfficer
              captures: { m_v: $.data.version }
            - call: "POST /merchants/${m_id}/charges"
              payload: { auth_amount_cents: 10000, card_last4: "4242" }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { ch_id: $.data.id }
            - call: "POST /charges/${ch_id}/capture"
              payload: { amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
            - call: "POST /merchants/${m_id}/settlement-batches"
              payload: { business_date: "2026-01-01" }
              as: PlatformOperator
              captures: { batch_id: $.data.id }
            - call: "POST /settlement-batches/${batch_id}/settle"
              payload: { expected_merchant_version: "${m_v}" }
              as: PlatformOperator
            - call: "POST /charges/${ch_id}/disputes"
              payload: { disputed_amount_cents: 10000 }
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { dispute_id: $.data.id }
            - call: "POST /disputes/${dispute_id}/acknowledge"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /disputes/${dispute_id}/acknowledge"
              payload: {}
              as: MerchantUser
              as_user_id: "${m_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: corner_merchant_reject_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Merchant.PENDING_REVIEW_to_REJECTED
          - endpoints.POST./merchants/{id}/suspend
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "After a merchant is REJECTED (terminal), attempting to suspend it is rejected with ERR_INVALID_STATE since no transition leaves REJECTED."
        test_recipe:
          setup:
            - "A merchant rejected at underwriting."
          setup_api_calls:
            - call: "POST /fee-plans"
              payload: { name: "Flat", pricing_model: "FLAT", flat_pct_bps: 290, flat_fixed_cents: 30 }
              as: PlatformOperator
              captures: { plan_id: $.data.id }
            - call: "POST /merchants"
              payload: { legal_name: "Term Co", mcc: "5812", fee_plan_id: "${plan_id}", requested_monthly_volume_cents: 50000 }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "GET /merchants/${m_id}/risk-reviews"
              payload: {}
              as: UnderwritingOfficer
              captures: { rr_id: "$.data[0].id" }
            - call: "POST /merchants/${m_id}/risk-reviews/${rr_id}/reject"
              payload: {}
              as: UnderwritingOfficer
          trigger:
            - call: "POST /merchants/${m_id}/suspend"
              payload: {}
              as: UnderwritingOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: corner_charge_capture_initial_settlement_axis_stays_pending
        claim_type: Initial State
        grounds:
          - entities.Charge.fields.settlement_status
          - state_machines.Charge.initial_state
          - endpoints.POST./merchants/{id}/charges
        distinguishing_aspect: "A newly authorized charge starts in the parallel initial composite state AUTHORIZED / PENDING with settlement_batch_id null."
        test_recipe:
          setup:
            - "An APPROVED merchant."
          setup_api_calls:
            - call: "POST /fee-plans"
