            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "2 Elm St", lot_kind: "RESIDENTIAL_DRIVEWAY" }, as: OfficeAdmin, captures: { pb: "$.data.id" } }
            - { call: "POST /api/assessments", payload: { property_id: "${pa}", measured_area_sqft: 900, crack_linear_ft: 10, pothole_count: 1, pothole_area_sqft: 2, oil_spot_area_sqft: 0, slope_severity: "NONE" }, as: Estimator, captures: { a_id: "$.data.id" } }
