# =============================================================================
# Task 1179: Railcar Repair Shop & AAR Billing — scaffold seed tables
# =============================================================================

scenario: |
  generate task hard than expert level! 1179. Railcar Repair Shop & AAR Billing (AAR-certified repair shop): inbound car inspection & defect coding, repair authorization & rule-based responsibility (owner vs handling line), AAR price master & billing repair card submission, exception/dispute handling & counter-billing, parts inventory & wheelset management, shop capacity scheduling & car dwell, quality/warranty on repairs, mobile repair vs shop routing

domain_name: railcar-repair-aar-billing
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation
  # BRC money: provisional estimate vs final billing produce divergent amounts
  # for identical work; counter-billing reconciles the two ledgers.
  secondary_archetype: compliance_audit
  # AAR responsibility rules, condemnable-defect safety gates, warranty windows,
  # segregation of duties between repair foreman and quality inspector.
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
  entity_topology: flat
  # flat peer collections at root; shop scoping via shop_id FK + filters
  # (hybrid notes: BRC self-supersession and cross-aggregate refs remain)
  # tree under Shop + self-referential BRC supersession + cross-aggregate refs
  state_machine_shape: parallel
  # WorkOrder carries two independent axes (auth_status x exec_status);
  # BRC / Inspection / Wheelset / CounterBill machines are cyclic on top.
  relationship_patterns:
    - one_to_many
    - self_referential        # BillingRepairCard.supersedes_brc_id
    - cross_aggregate         # WorkOrder -> ShopSlot, RepairLine -> PriceMasterEntry
  role_model: segregation_of_duties
  # QA reviewer must differ from WO creator; authorization party is rule-determined.
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Shop
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Shop display name" }
      - { name: stalls, type: integer, source: input, description: "Number of repair stalls; capacity denominator" }
      - { name: stall_daily_hours, type: integer, source: input, default: 8, description: "Bookable hours per stall per calendar day" }
      - { name: dwell_free_hours, type: integer, source: input, default: 48, description: "Free dwell hours after arrival before charges accrue" }
      - { name: dwell_rate_cents_per_hour, type: integer, source: input, description: "Dwell charge rate applied to billable hours" }
      - { name: warranty_days, type: integer, source: input, default: 90, description: "Warranty claim window measured from WorkOrder completion" }
      - { name: counter_window_days, type: integer, source: input, default: 30, description: "Days after BRC submission during which counter-bills are accepted" }
      - { name: owner_watch_threshold_cents, type: integer, source: input, default: 1000000, description: "Outstanding balance at which a CarOwner flips to CREDIT_WATCH" }
      - { name: current_posture, type: enum, source: computed, description: "OPEN | CONSTRAINED | FULL — derived per calendar day from reserved/occupied slot hours vs stalls*stall_daily_hours" }

  - name: CarOwner
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: name, type: string, source: input, description: "Owner company name" }
      - { name: scac_code, type: string, source: input, description: "Owner SCAC / mark code" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Ledger balance: += net owner share on BRC accept; -= owner share of honored warranty credits; -= net settled amount on settle" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | CREDIT_WATCH (outstanding_balance_cents > shop.owner_watch_threshold_cents)" }

  - name: HandlingLine
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: name, type: string, source: input, description: "Railroad / handling line name" }
      - { name: mark, type: string, source: input, description: "Reporting mark of the handling line" }
      - { name: outstanding_balance_cents, type: integer, source: computed, description: "Ledger balance mirror of CarOwner for line-responsible billing" }

  - name: Railcar
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: reporting_mark, type: string, source: input, description: "Car reporting mark" }
      - { name: car_number, type: string, source: input, description: "Car number; unique per shop together with reporting_mark" }
      - { name: owner_id, type: string, source: input, description: "FK -> CarOwner.id; car owner" }
      - { name: handling_line_id, type: string, source: input, description: "FK -> HandlingLine.id; delivering/handling railroad" }
      - { name: built_date, type: string, source: input, description: "Car build date YYYY-MM-DD" }
      - { name: arrived_at, type: datetime, source: system, description: "Logical-clock timestamp at registration" }
      - { name: departed_at, type: datetime, source: system, description: "Logical-clock timestamp at departure; null until departed" }
      - { name: status, type: enum, source: system, description: "ARRIVED | IN_SHOP | READY_FOR_DEPARTURE | DEPARTED" }
      - { name: shop_delay_hours, type: number, source: computed, description: "Accumulated hours spent in QA_REVIEW across this car's work orders (shop-responsible delay)" }
      - { name: projected_dwell_charge_cents, type: integer, source: computed, description: "Forward-looking dwell charge pinned at slot assignment / mobile dispatch" }
      - { name: dwell_charge_cents, type: integer, source: computed, description: "Final chronological dwell charge computed at depart" }

  - name: Inspection
    parent: Railcar
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: system, description: "FK -> Railcar.id; inspected car" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | COMPLETED | REOPENED" }
      - { name: inspector_user_id, type: string, source: system, description: "X-User-ID of the creating CarInspector (audit)" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time of latest completion" }
      - { name: reopened_count, type: integer, source: system, default: 0, description: "Number of COMPLETED -> REOPENED cycles" }

  - name: DefectFinding
    parent: Inspection
    common_fields: true
    fields:
      - { name: inspection_id, type: string, source: system, description: "FK -> Inspection.id; parent inspection" }
      - { name: aar_defect_code, type: string, source: input, description: "AAR defect code, format AAR-NNNN" }
      - { name: defect_group, type: enum, source: input, description: "WHEELSET | AIR_HOSE | COUPLER | SAFETY_APPLIANCE | STRUCTURAL | BRAKE_BEAM | DOOR | OTHER" }
      - { name: cause_code, type: enum, source: input, description: "WEAR | HANDLING_DAMAGE | ACCIDENT | UNKNOWN" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | CONDEMNABLE" }
      - { name: location, type: string, source: input, description: "Car location of the defect (e.g., 'B-end truck')" }
      - { name: status, type: enum, source: system, description: "OPEN | ESTIMATED | AUTHORIZED | REPAIRED | DECLINED" }

  - name: WorkOrder
    parent: Railcar
    common_fields: true
    fields:
      - { name: railcar_id, type: string, source: input, description: "FK -> Railcar.id; car under repair" }
      - { name: inspection_id, type: string, source: input, description: "FK -> Inspection.id; source inspection (must be COMPLETED)" }
      - { name: routing, type: enum, source: input, description: "SHOP | MOBILE" }
      - { name: auth_status, type: enum, source: system, description: "DRAFT | PENDING_AUTHORIZATION | AUTHORIZED | REJECTED | CANCELLED" }
      - { name: exec_status, type: enum, source: system, description: "NOT_STARTED | SHOP_QUEUED | MOBILE_DISPATCHED | IN_PROGRESS | QA_REVIEW | COMPLETED | CANCELLED" }
      - { name: responsible_party, type: enum, source: computed, description: "OWNER | HANDLING_LINE | SHARED — majority of line estimate sums at submit; tie -> OWNER" }
      - { name: owner_share_pct, type: integer, source: computed, description: "Owner percentage for the WO (100, 0, or per-line mix summarized at WO level as owner-line share of estimate total)" }
      - { name: estimate_total_cents, type: integer, source: computed, description: "Sum of line estimate_total_cents (provisional pricing)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Sum of line final_total_cents after completion" }
      - { name: assigned_slot_id, type: string, source: system, description: "FK -> ShopSlot.id; reserved slot (SHOP routing); null otherwise" }
      - { name: mobile_crew_id, type: string, source: system, description: "Crew identifier supplied at dispatch (MOBILE routing)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating RepairForeman (SoD anchor)" }
      - { name: authorized_at, type: datetime, source: system, description: "Logical-clock time of authorization" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock time of QA pass (exec COMPLETED)" }
      - { name: qa_review_entered_at, type: datetime, source: system, description: "When exec entered QA_REVIEW; QA delay accrues from here" }
      - { name: rework_count, type: integer, source: system, default: 0, description: "Number of QA fail rework loops" }

  - name: RepairLine
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; parent work order" }
      - { name: defect_finding_id, type: string, source: input, description: "FK -> DefectFinding.id; defect this line repairs" }
      - { name: job_code, type: string, source: input, description: "AAR job code; resolved against the price master" }
      - { name: price_master_entry_id, type: string, source: system, description: "FK -> PriceMasterEntry.id; entry effective at estimate time" }
      - { name: planned_parts, type: array, source: input, description: "Planned parts [{part_item_id, quantity}] reserved at authorization" }
      - { name: actual_labor_hours, type: number, source: system, description: "Actual hours reported at work-order completion" }
      - { name: actual_parts, type: array, source: system, description: "Actual consumed parts [{part_item_id, quantity}] reported at completion" }
      - { name: estimate_labor_cents, type: integer, source: computed, description: "round_half_up(standard_labor_hours * labor_rate at estimate entry)" }
      - { name: estimate_material_cents, type: integer, source: computed, description: "sum(planned qty * PartItem.unit_price_cents)" }
      - { name: estimate_total_cents, type: integer, source: computed, description: "estimate_labor_cents + estimate_material_cents" }
      - { name: final_labor_cents, type: integer, source: computed, description: "round_half_up(actual_labor_hours * rate), rate from routing and entry effective at completion" }
      - { name: final_material_cents, type: integer, source: computed, description: "sum(actual qty * PartItem.unit_price_cents)" }
      - { name: final_total_cents, type: integer, source: computed, description: "final_labor_cents + final_material_cents" }
      - { name: responsible_party, type: enum, source: computed, description: "OWNER | HANDLING_LINE | SHARED per decision table at submit" }
      - { name: owner_pct, type: integer, source: computed, description: "Owner percentage 0 | 50 | 100 per decision table" }
      - { name: status, type: enum, source: system, description: "ESTIMATED | AUTHORIZED | FINALIZED | CANCELLED" }

  - name: PriceMasterEntry
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: job_code, type: string, source: input, description: "AAR job code this entry prices" }
      - { name: description, type: string, source: input, description: "Human description of the job" }
      - { name: labor_rate_cents_per_hour, type: integer, source: input, description: "Shop labor rate" }
      - { name: mobile_labor_rate_cents_per_hour, type: integer, source: input, description: "Mobile labor rate" }
      - { name: standard_labor_hours, type: number, source: input, description: "AAR standard hours used for estimates" }
      - { name: mobile_trip_surcharge_cents, type: integer, source: input, description: "Flat surcharge applied once per mobile work order" }
      - { name: mobile_eligible, type: boolean, source: input, description: "Whether this job may be routed MOBILE" }
      - { name: shared_split, type: boolean, source: input, default: false, description: "If true, responsibility is SHARED 50/50 regardless of wear-group rules" }
      - { name: effective_from, type: string, source: input, description: "First effective date YYYY-MM-DD (closed interval start)" }
      - { name: effective_to, type: string, source: input, description: "Last effective date YYYY-MM-DD (closed interval end)" }

  - name: PartItem
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: part_number, type: string, source: input, description: "Part number; unique per shop" }
      - { name: description, type: string, source: input, description: "Part description" }
      - { name: unit_price_cents, type: integer, source: input, description: "Unit material price used in estimates and finals" }
      - { name: on_hand_qty, type: integer, source: input, description: "Physical quantity on hand; mutated by adjust/consume" }
      - { name: reserved_qty, type: integer, source: system, default: 0, description: "Quantity reserved by authorized work orders" }
      - { name: available_qty, type: integer, source: computed, description: "on_hand_qty - reserved_qty; invariant >= 0" }
      - { name: reorder_threshold, type: integer, source: input, description: "Reorder flag level on available_qty" }
      - { name: status, type: enum, source: computed, description: "ACTIVE | REORDER_NEEDED (available_qty <= reorder_threshold) | DEPLETED (on_hand_qty == 0)" }

  - name: Wheelset
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: serial_number, type: string, source: input, description: "Wheelset serial; unique per shop" }
      - { name: flange_thickness_mm, type: number, source: input, description: "Latest flange measurement in mm (3-decimal precision)" }
      - { name: tread_wear_mm, type: number, source: input, description: "Latest tread wear in mm (3-decimal precision)" }
      - { name: status, type: enum, source: system, description: "IN_STOCK | MOUNTED | REMOVED | CONDEMNED" }
      - { name: mounted_railcar_id, type: string, source: system, description: "FK -> Railcar.id; car the wheelset is mounted on; null otherwise" }

  - name: ShopSlot
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: stall_id, type: string, source: input, description: "Stall identifier (e.g., 'S1')" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (half-open interval start)" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (half-open interval end)" }
      - { name: status, type: enum, source: system, description: "OPEN | RESERVED | OCCUPIED | RELEASED | BLOCKED" }
      - { name: reserved_work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; occupying work order; null when OPEN/RELEASED/BLOCKED" }

  - name: BillingRepairCard
    parent: WorkOrder
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; billed work order (must be exec COMPLETED)" }
      - { name: supersedes_brc_id, type: string, source: system, description: "FK -> BillingRepairCard.id; prior DRAFT superseded by this card; null otherwise" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DISPUTED | ACCEPTED | SETTLED | WITHDRAWN | SUPERSEDED" }
      - { name: mobile_surcharge_cents, type: integer, source: computed, description: "Trip surcharge for MOBILE routing (from earliest-created line's entry); 0 for SHOP" }
      - { name: submitted_total_cents, type: integer, source: computed, description: "sum(line final totals) + mobile_surcharge_cents; pinned at submit" }
      - { name: owner_total_cents, type: integer, source: computed, description: "sum of line owner shares (+ surcharge to WO majority party)" }
      - { name: handling_line_total_cents, type: integer, source: computed, description: "sum of line handling shares (+ surcharge when line-responsible)" }
      - { name: net_settled_cents, type: integer, source: computed, description: "submitted_total_cents - sum(accepted counter credits); invariant anchor" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock time of submission" }
      - { name: dispute_window_ends_at, type: datetime, source: computed, description: "submitted_at + shop.counter_window_days" }

  - name: BrcLine
    parent: BillingRepairCard
    common_fields: true
    fields:
      - { name: brc_id, type: string, source: system, description: "FK -> BillingRepairCard.id; parent card" }
      - { name: repair_line_id, type: string, source: system, description: "FK -> RepairLine.id; source repair line" }
      - { name: job_code, type: string, source: system, description: "Snapshot of the repair line job code" }
      - { name: final_amount_cents, type: integer, source: system, description: "Snapshot of RepairLine.final_total_cents" }
      - { name: owner_share_cents, type: integer, source: computed, description: "round_half_up(final_amount_cents * owner_pct / 100)" }
      - { name: handling_share_cents, type: integer, source: computed, description: "final_amount_cents - owner_share_cents (remainder to handling)" }
      - { name: accepted_credit_cents, type: integer, source: system, default: 0, description: "Sum of accepted counter-bill credits on this line" }
      - { name: warranty_credit_cents, type: integer, source: system, default: 0, description: "Sum of honored warranty credits on this line" }

  - name: CounterBill
    parent: BillingRepairCard
    common_fields: true
    fields:
      - { name: brc_id, type: string, source: system, description: "FK -> BillingRepairCard.id; disputed card" }
      - { name: items, type: array, source: input, description: "Counter items [{brc_line_id, counter_amount_cents, reason}]" }
      - { name: total_countered_cents, type: integer, source: computed, description: "Sum of item amounts" }
      - { name: status, type: enum, source: system, description: "OPEN | ACCEPTED | REBUTTED | WITHDRAWN | EXPIRED" }
      - { name: filed_by_role, type: string, source: system, description: "Role of the filer (CarOwnerRep | HandlingLineRep)" }
      - { name: filed_by_id, type: string, source: system, description: "X-User-ID of the filer" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock time of filing" }

  - name: WarrantyClaim
    parent: Shop
    common_fields: true
    fields:
      - { name: shop_id, type: string, source: system, description: "FK -> Shop.id; owning shop" }
      - { name: repair_line_id, type: string, source: input, description: "FK -> RepairLine.id; failed repair line (must be FINALIZED)" }
      - { name: failure_defect_group, type: enum, source: input, description: "Defect group of the new failure; must match the original line's defect group" }
      - { name: description, type: string, source: input, description: "Failure description" }
      - { name: claimed_rework_cost_cents, type: integer, source: input, description: "Claimed cost of rework" }
      - { name: credit_cents, type: integer, source: computed, description: "Honored credit per warranty_credit calculation" }
      - { name: status, type: enum, source: system, description: "FILED | VALIDATED | HONORED | DENIED" }
      - { name: filed_by_role, type: string, source: system, description: "Role of the filer" }
      - { name: filed_by_id, type: string, source: system, description: "X-User-ID of the filer" }
      - { name: appeal_count, type: integer, source: system, default: 0, description: "Number of DENIED -> FILED appeals" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Inspection
    initial_state: IN_PROGRESS
    terminal_states: []
    transitions:
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /inspections/{id}/complete"
        actor: CarInspector
        preconditions:
          - "inspection.status == IN_PROGRESS or REOPENED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "inspection.completed_at = logical clock now"
      - from: REOPENED
        to: COMPLETED
        trigger: "POST /inspections/{id}/complete"
        actor: CarInspector
        preconditions: []
        side_effects:
          - "inspection.completed_at = logical clock now"
      - from: COMPLETED
        to: REOPENED
        trigger: "POST /inspections/{id}/reopen"
        actor: RepairForeman
        preconditions:
          - "No referencing WorkOrder has auth_status in {PENDING_AUTHORIZATION, AUTHORIZED} (else ERR_INSPECTION_LOCKED)"
        side_effects:
          - "inspection.reopened_count += 1"
    note: "Cyclic: COMPLETED -> REOPENED -> COMPLETED loops allowed while unlocked."

  - entity: DefectFinding
    initial_state: OPEN
    terminal_states: [REPAIRED, DECLINED]
    transitions:
      - from: OPEN
        to: ESTIMATED
        trigger: "POST /work-orders/{id}/lines (line references this finding)"
        actor: RepairForeman
        preconditions:
          - "finding.status == OPEN (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: ESTIMATED
        to: AUTHORIZED
        trigger: "cascade from WorkOrder authorize"
        actor: system
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: REPAIRED
        trigger: "cascade from WorkOrder qa-review PASS"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESTIMATED
        to: OPEN
        trigger: "cascade from WorkOrder cancel or reject (compensation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: OPEN
        trigger: "cascade from WorkOrder cancel of an authorized-but-not-started work order (compensation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: DECLINED
        trigger: "POST /inspections/{id}/defects/{defectId}/decline"
        actor: RepairForeman
        preconditions:
          - "finding.status == OPEN (a finding referenced by a line cannot be declined)"
        side_effects: []

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [REJECTED, CANCELLED]
    note: "Axis auth_status. Parallel to exec_status axis: both evolve independently; cross-axis guards noted per transition."
    transitions:
      - from: DRAFT
        to: PENDING_AUTHORIZATION
        trigger: "POST /work-orders/{id}/submit"
        actor: RepairForeman
        preconditions:
          - "auth_status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "inspection (work_order.inspection_id) status == COMPLETED (else ERR_INSPECTION_NOT_COMPLETED)"
          - "at least one RepairLine exists (else ERR_WORK_ORDER_NO_LINES)"
          - "if routing == MOBILE: every line's price entry mobile_eligible == true (else ERR_MOBILE_ROUTE_NOT_ELIGIBLE)"
        side_effects:
          - "run responsibility_determination per line; set line.responsible_party / owner_pct"
          - "set work_order.responsible_party (majority by line estimate sums; tie -> OWNER) and owner_share_pct"
      - from: PENDING_AUTHORIZATION
        to: AUTHORIZED
        trigger: "POST /work-orders/{id}/authorize"
        actor: CarOwnerRep | HandlingLineRep
        preconditions:
          - "OCC: expected_work_order_version == work_order.version (else ERR_STALE_WORK_ORDER_VERSION)"
          - "auth_status == PENDING_AUTHORIZATION (else ERR_INVALID_STATE_TRANSITION)"
          - "acting party matches work_order.responsible_party: OWNER or SHARED -> CarOwnerRep with X-User-ID == railcar.owner_id; HANDLING_LINE -> HandlingLineRep with X-User-ID == railcar.handling_line_id (else ERR_RESPONSIBILITY_MISMATCH)"
          - "parts availability: for every planned part, PartItem.available_qty >= planned qty (else ERR_PART_STOCK_INSUFFICIENT)"
        side_effects:
          - "authorized_at = now; increments WorkOrder.version by 1"
          - "cascade: each RepairLine ESTIMATED -> AUTHORIZED; each DefectFinding ESTIMATED -> AUTHORIZED"
          - "cascade: PartItem.reserved_qty += planned qty per line part (reserve)"
          - "cascade: PartItem.status recompute (may flip ACTIVE -> REORDER_NEEDED when available_qty <= reorder_threshold)"
      - from: PENDING_AUTHORIZATION
        to: PENDING_AUTHORIZATION
        trigger: "POST /work-orders/{id}/revise-estimate"
        actor: RepairForeman
        preconditions:
          - "OCC: expected_work_order_version == work_order.version (else ERR_STALE_WORK_ORDER_VERSION)"
          - "auth_status == PENDING_AUTHORIZATION (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "re-resolve each line's price entry against the price master at current clock date (ERR_PRICE_MASTER_GAP if none)"
          - "recompute estimate_* fields and work_order.estimate_total_cents"
          - "increments WorkOrder.version by 1"
        note: "Self-loop re-estimate; version bump makes in-flight authorizations stale."
      - from: PENDING_AUTHORIZATION
        to: REJECTED
        trigger: "POST /work-orders/{id}/reject"
        actor: CarOwnerRep | HandlingLineRep
        preconditions:
          - "auth_status == PENDING_AUTHORIZATION (else ERR_INVALID_STATE_TRANSITION)"
          - "acting party matches work_order.responsible_party (else ERR_RESPONSIBILITY_MISMATCH)"
        side_effects:
          - "cascade: exec_status -> CANCELLED; lines -> CANCELLED; findings ESTIMATED -> OPEN"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: RepairForeman
        preconditions:
          - "exec_status in {NOT_STARTED, SHOP_QUEUED, MOBILE_DISPATCHED} (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "exec_status -> CANCELLED; lines -> CANCELLED; findings ESTIMATED -> OPEN"
          - "if assigned_slot_id: ShopSlot RESERVED -> RELEASED, reserved_work_order_id = null"
          - "release any part reservations (compensation; reserved_qty -= planned qty)"
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: RepairForeman
        preconditions:
          - "exec_status in {NOT_STARTED, SHOP_QUEUED, MOBILE_DISPATCHED} (work not yet IN_PROGRESS; else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "exec_status -> CANCELLED; lines AUTHORIZED -> CANCELLED; findings AUTHORIZED -> OPEN"
          - "if assigned_slot_id: ShopSlot RESERVED -> RELEASED, reserved_work_order_id = null"
          - "release part reservations (compensation; reserved_qty -= planned qty; PartItem.status recompute)"

  - entity: WorkOrder
    initial_state: NOT_STARTED
    terminal_states: [COMPLETED, CANCELLED]
    note: "Axis exec_status. Requires auth_status == AUTHORIZED for all forward movement. QA_REVIEW -> IN_PROGRESS rework loop makes this axis cyclic."
    transitions:
      - from: NOT_STARTED
        to: SHOP_QUEUED
        trigger: "POST /work-orders/{id}/assign-slot"
        actor: RepairForeman
        preconditions:
          - "auth_status == AUTHORIZED (else ERR_INVALID_STATE_TRANSITION)"
          - "routing == SHOP (else ERR_INVALID_STATE_TRANSITION)"
          - "slot exists and status == OPEN (else ERR_INVALID_STATE_TRANSITION)"
          - "temporal: no same-stall slot in {RESERVED, OCCUPIED} whose half-open window overlaps (else ERR_SLOT_OVERLAP)"
          - "constraint: slot window hours >= sum of lines' standard_labor_hours (else ERR_SLOT_WINDOW_TOO_SHORT)"
        side_effects:
          - "slot OPEN -> RESERVED; slot.reserved_work_order_id = work_order.id; work_order.assigned_slot_id = slot.id"
          - "compute railcar.projected_dwell_charge_cents (projected variant of dwell_charge)"
      - from: NOT_STARTED
        to: MOBILE_DISPATCHED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: RepairForeman
        preconditions:
          - "auth_status == AUTHORIZED (else ERR_INVALID_STATE_TRANSITION)"
          - "routing == MOBILE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "work_order.mobile_crew_id = input"
          - "compute railcar.projected_dwell_charge_cents (mobile projection: now + sum standard hours)"
      - from: SHOP_QUEUED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: RepairForeman
        preconditions:
          - "exec_status == SHOP_QUEUED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "slot RESERVED -> OCCUPIED"
          - "railcar.status -> IN_SHOP (increments Railcar.version)"
      - from: MOBILE_DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: RepairForeman
        preconditions:
          - "exec_status == MOBILE_DISPATCHED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: IN_PROGRESS
        to: QA_REVIEW
        trigger: "POST /work-orders/{id}/complete"
        actor: RepairForeman
        preconditions:
          - "exec_status == IN_PROGRESS (else ERR_INVALID_STATE_TRANSITION)"
          - "line_actuals covers every non-cancelled line (else ERR_INVALID_REQUEST)"
        side_effects:
          - "record actual_labor_hours and actual_parts per line"
          - "qa_review_entered_at = now"
      - from: QA_REVIEW
        to: COMPLETED
        trigger: "POST /work-orders/{id}/qa-review with result=PASS"
        actor: QualityInspector
        preconditions:
          - "exec_status == QA_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "SoD: X-User-ID != work_order.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "completed_at = now; railcar.shop_delay_hours += hours(qa_review_entered_at -> now)"
          - "cascade: each RepairLine AUTHORIZED -> FINALIZED; run final_brc_line_pricing per line; findings AUTHORIZED -> REPAIRED"
          - "cascade: consume parts — PartItem.on_hand_qty -= consumed qty, reserved_qty -= planned qty; PartItem.status recompute (may flip to DEPLETED when on_hand_qty == 0)"
          - "cascade: slot OCCUPIED -> RELEASED (SHOP routing); reserved_work_order_id = null"
          - "cascade: if no sibling work order of this railcar has exec_status outside {COMPLETED, CANCELLED}: railcar.status -> READY_FOR_DEPARTURE"
      - from: QA_REVIEW
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/qa-review with result=FAIL"
        actor: QualityInspector
        preconditions:
          - "exec_status == QA_REVIEW (else ERR_INVALID_STATE_TRANSITION)"
          - "SoD: X-User-ID != work_order.created_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "railcar.shop_delay_hours += hours(qa_review_entered_at -> now); rework_count += 1"
        note: "Rework cycle: QA fail returns to IN_PROGRESS; delay already accrued."

  - entity: RepairLine
    initial_state: ESTIMATED
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: ESTIMATED
        to: AUTHORIZED
        trigger: "cascade from WorkOrder authorize"
        actor: system
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: FINALIZED
        trigger: "cascade from WorkOrder qa-review PASS"
        actor: system
        preconditions: []
        side_effects:
          - "run final_brc_line_pricing; set final_labor_cents / final_material_cents / final_total_cents"
      - from: ESTIMATED
        to: CANCELLED
        trigger: "cascade from WorkOrder cancel or reject"
        actor: system
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: CANCELLED
        trigger: "cascade from WorkOrder cancel"
        actor: system
        preconditions: []
        side_effects:
          - "release part reservations for this line"

  - entity: Wheelset
    initial_state: IN_STOCK
    terminal_states: [CONDEMNED]
    transitions:
      - from: IN_STOCK
        to: MOUNTED
        trigger: "POST /wheelsets/{id}/mount"
        actor: RepairForeman
        preconditions:
          - "wheelset.status == IN_STOCK (else ERR_INVALID_STATE_TRANSITION)"
          - "railcar (input railcar_id) status == IN_SHOP (else ERR_CAR_NOT_IN_SHOP)"
        side_effects:
          - "mounted_railcar_id = railcar_id"
      - from: MOUNTED
        to: REMOVED
        trigger: "POST /wheelsets/{id}/remove"
        actor: RepairForeman
        preconditions:
          - "wheelset.status == MOUNTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "mounted_railcar_id = null"
      - from: REMOVED
        to: IN_STOCK
        trigger: "POST /wheelsets/{id}/evaluate (within limits)"
        actor: QualityInspector
        preconditions:
          - "wheelset.status == REMOVED (else ERR_INVALID_STATE_TRANSITION)"
          - "wheelset_condemnation: flange_thickness_mm > 28.0 AND tread_wear_mm < 9.5"
        side_effects:
          - "store new measurements"
        note: "Reclaim loop makes this machine cyclic: IN_STOCK -> MOUNTED -> REMOVED -> IN_STOCK."
      - from: REMOVED
        to: CONDEMNED
        trigger: "POST /wheelsets/{id}/evaluate (beyond limits)"
        actor: QualityInspector
        preconditions:
          - "wheelset.status == REMOVED (else ERR_INVALID_STATE_TRANSITION)"
          - "wheelset_condemnation: flange_thickness_mm <= 28.0 OR tread_wear_mm >= 9.5"
        side_effects:
          - "store new measurements"
      - from: IN_STOCK
        to: CONDEMNED
        trigger: "POST /wheelsets/{id}/evaluate (beyond limits)"
        actor: QualityInspector
        preconditions:
          - "wheelset.status == IN_STOCK (else ERR_INVALID_STATE_TRANSITION)"
          - "wheelset_condemnation: flange_thickness_mm <= 28.0 OR tread_wear_mm >= 9.5"
        side_effects:
          - "store new measurements"

  - entity: ShopSlot
    initial_state: OPEN
    terminal_states: [RELEASED, BLOCKED]
    transitions:
      - from: OPEN
        to: RESERVED
        trigger: "cascade from WorkOrder assign-slot"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: OCCUPIED
        trigger: "cascade from WorkOrder start"
        actor: system
        preconditions: []
        side_effects: []
      - from: OCCUPIED
        to: RELEASED
        trigger: "cascade from WorkOrder qa-review PASS"
        actor: system
        preconditions: []
        side_effects: []
      - from: RESERVED
        to: RELEASED
        trigger: "cascade from WorkOrder cancel"
        actor: system
        preconditions: []
        side_effects: []
      - from: OPEN
        to: BLOCKED
        trigger: "POST /shop-slots/{id}/block"
        actor: ShopAdmin
        preconditions:
          - "slot.status == OPEN (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []

  - entity: Railcar
    initial_state: ARRIVED
    terminal_states: [DEPARTED]
    transitions:
      - from: ARRIVED
        to: IN_SHOP
        trigger: "cascade from WorkOrder start (SHOP routing)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_SHOP
        to: READY_FOR_DEPARTURE
        trigger: "cascade from WorkOrder qa-review PASS when no sibling work order has exec_status outside {COMPLETED, CANCELLED}"
        actor: system
        preconditions: []
        side_effects: []
      - from: ARRIVED
        to: DEPARTED
        trigger: "POST /railcars/{id}/depart"
        actor: YardClerk
        preconditions:
          - "no work order of this railcar has exec_status outside {COMPLETED, CANCELLED} (else ERR_OPEN_WORK_ORDERS)"
          - "safety: no DefectFinding on this car's inspections with severity == CONDEMNABLE and status outside {REPAIRED, DECLINED} (else ERR_UNRESOLVED_SAFETY_DEFECT)"
        side_effects:
          - "departed_at = now; run dwell_charge actual variant; set dwell_charge_cents"
      - from: READY_FOR_DEPARTURE
        to: DEPARTED
        trigger: "POST /railcars/{id}/depart"
        actor: YardClerk
        preconditions:
          - "safety: no unresolved CONDEMNABLE finding (else ERR_UNRESOLVED_SAFETY_DEFECT)"
        side_effects:
          - "departed_at = now; run dwell_charge actual variant; set dwell_charge_cents"

  - entity: BillingRepairCard
    initial_state: DRAFT
    terminal_states: [SETTLED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /billing-repair-cards/{id}/submit"
        actor: BillingClerk
        preconditions:
          - "brc.status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
          - "work_order.exec_status == COMPLETED (else ERR_WORK_ORDER_NOT_COMPLETED)"
        side_effects:
          - "submitted_at = now; dispute_window_ends_at = submitted_at + shop.counter_window_days"
          - "pin submitted_total_cents / owner_total_cents / handling_line_total_cents"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /billing-repair-cards/{id}/counter-bills (counter created)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: SUBMITTED
        trigger: "system (automatic when the last active CounterBill — OPEN or REBUTTED — resolves to ACCEPTED / WITHDRAWN / EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute net_settled_cents"
        note: "Cyclic: SUBMITTED <-> DISPUTED may repeat across counter-billing rounds."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /billing-repair-cards/{id}/accept"
        actor: CarOwnerRep | HandlingLineRep
        preconditions:
          - "brc.status == SUBMITTED (else ERR_INVALID_STATE_TRANSITION)"
          - "no CounterBill of this BRC in {OPEN, REBUTTED} (else ERR_COUNTER_BILL_ACTIVE)"
          - "acting party matches work_order.responsible_party (else ERR_RESPONSIBILITY_MISMATCH)"
        side_effects:
          - "CarOwner.outstanding_balance_cents += (owner_total_cents - owner share of accepted counter credits); HandlingLine.outstanding_balance_cents += (handling_line_total_cents - handling share of accepted counter credits) — net posting, since counters always resolve before acceptance"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "system (deemed acceptance during sweep: now > dispute_window_ends_at and no counter in {OPEN, REBUTTED})"
        actor: system
        preconditions: []
        side_effects:
          - "balance posting identical to manual accept"
      - from: ACCEPTED
        to: SETTLED
        trigger: "POST /billing-repair-cards/{id}/settle"
        actor: BillingClerk
        preconditions:
          - "brc.status == ACCEPTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "CarOwner.outstanding_balance_cents -= (owner_total_cents - owner share of credits); HandlingLine likewise — balances return toward zero"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "cascade from POST /billing-repair-cards creating a newer draft for the same work order"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /billing-repair-cards/{id}/withdraw"
        actor: BillingClerk
        preconditions:
          - "brc.status == DRAFT (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /billing-repair-cards/{id}/withdraw"
        actor: BillingClerk
        preconditions:
          - "no CounterBill of this BRC in {OPEN, REBUTTED} (else ERR_COUNTER_BILL_ACTIVE)"
        side_effects: []

  - entity: CounterBill
    initial_state: OPEN
    terminal_states: [ACCEPTED, WITHDRAWN, EXPIRED]
    transitions:
      - from: OPEN
        to: ACCEPTED
        trigger: "POST /counter-bills/{id}/accept"
        actor: BillingClerk
        preconditions:
          - "counter_bill.status == OPEN or REBUTTED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "cascade hop 1: each item's BrcLine.accepted_credit_cents += counter_amount_cents"
          - "cascade hop 2 (caused by hop 1): BRC.net_settled_cents recomputed = submitted_total_cents - sum(accepted credits)"
          - "cascade hop 3 (caused by hop 2): if no remaining active counters, BRC DISPUTED -> SUBMITTED"
          - "balances are not touched here: counter resolution always precedes BRC acceptance, so the credit is netted into the BRC-accept balance posting"
      - from: REBUTTED
        to: ACCEPTED
        trigger: "POST /counter-bills/{id}/accept"
        actor: BillingClerk
        preconditions: []
        side_effects:
          - "same credit cascade as OPEN -> ACCEPTED"
      - from: OPEN
        to: REBUTTED
        trigger: "POST /counter-bills/{id}/rebut"
        actor: BillingClerk
        preconditions:
          - "counter_bill.status == OPEN (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: REBUTTED
        to: OPEN
        trigger: "POST /counter-bills/{id}/revise"
        actor: CarOwnerRep | HandlingLineRep
        preconditions:
          - "counter_bill.status == REBUTTED (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID == counter_bill.filed_by_id (else ERR_RESPONSIBILITY_MISMATCH)"
          - "within dispute window (else ERR_COUNTER_BILL_WINDOW_CLOSED)"
        side_effects:
          - "replace items; recompute total_countered_cents and re-check ceilings"
        note: "Negotiation cycle: OPEN -> REBUTTED -> OPEN may repeat within the dispute window."
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /counter-bills/{id}/withdraw"
        actor: CarOwnerRep | HandlingLineRep
        preconditions:
          - "counter_bill.status in {OPEN, REBUTTED} (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID == counter_bill.filed_by_id (else ERR_RESPONSIBILITY_MISMATCH)"
        side_effects:
          - "cascade: if no remaining active counters, BRC DISPUTED -> SUBMITTED"
      - from: REBUTTED
        to: WITHDRAWN
        trigger: "POST /counter-bills/{id}/withdraw"
        actor: CarOwnerRep | HandlingLineRep
        preconditions:
          - "X-User-ID == counter_bill.filed_by_id (else ERR_RESPONSIBILITY_MISMATCH)"
        side_effects:
          - "cascade: if no remaining active counters, BRC DISPUTED -> SUBMITTED"
      - from: OPEN
        to: EXPIRED
        trigger: "system (sweep: now > dispute_window_ends_at + counter_window_days grace)"
        actor: system
        preconditions: []
        side_effects:
          - "cascade: if no remaining active counters, BRC DISPUTED -> SUBMITTED"

  - entity: WarrantyClaim
    initial_state: FILED
    terminal_states: [HONORED, DENIED]
    transitions:
      - from: FILED
        to: VALIDATED
        trigger: "POST /warranty-claims/{id}/validate"
        actor: QualityInspector
        preconditions:
          - "claim.status == FILED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: VALIDATED
        to: HONORED
        trigger: "POST /warranty-claims/{id}/honor"
        actor: BillingClerk
        preconditions:
          - "claim.status == VALIDATED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "run warranty_credit: credit_cents = min(repair_line final_total - accepted counters - prior warranty credits, claimed_rework_cost_cents)"
          - "cascade: BrcLine.warranty_credit_cents += credit_cents (line on the BRC built from this repair line, if any)"
          - "cascade: CarOwner/HandlingLine outstanding_balance_cents -= party share of credit"
      - from: FILED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: QualityInspector
        preconditions:
          - "claim.status == FILED or VALIDATED (else ERR_INVALID_STATE_TRANSITION)"
        side_effects: []
      - from: VALIDATED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: QualityInspector
        preconditions: []
        side_effects: []
      - from: DENIED
        to: FILED
        trigger: "POST /warranty-claims/{id}/appeal"
        actor: CarOwnerRep | HandlingLineRep
        preconditions:
          - "claim.status == DENIED (else ERR_INVALID_STATE_TRANSITION)"
          - "X-User-ID == claim.filed_by_id (else ERR_RESPONSIBILITY_MISMATCH)"
          - "still within warranty window (else ERR_WARRANTY_WINDOW_EXPIRED)"
        side_effects:
          - "appeal_count += 1"
        note: "Appeal cycle: FILED -> DENIED -> FILED may repeat within the warranty window."

# =============================================================================
# Section 1.2.1: Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: cr-wo-create-stale-railcar
    parent_entity: Railcar
    write_endpoint: "POST /work-orders"
    occ_field: "expected_railcar_version"
    description: |
      Creating a WorkOrder against a Railcar whose version has advanced since
      the client last observed it is rejected. Work-order creation legitimately
      supersedes an existing DRAFT work order on the same railcar, so the only
      stale-view guard is the railcar version observed before another writer's
      create landed.
    error_id: ERR_STALE_RAILCAR_VERSION
    http_status: 412
  - rule_id: cr-authorize-stale-estimate
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/authorize"
    occ_field: "expected_work_order_version"
    description: |
      Authorizing a WorkOrder whose version has advanced since the responsible
      party reviewed the estimate (e.g., a revise-estimate re-priced lines while
      staying in PENDING_AUTHORIZATION) is rejected: approval must pin the exact
      estimate version that was reviewed.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412
  - rule_id: cr-revise-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/revise-estimate"
    occ_field: "expected_work_order_version"
    description: |
      Re-estimating a WorkOrder whose version has advanced since the foreman's
      last read is rejected, so two successive re-pricing passes cannot silently
      interleave.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412
  - rule_id: cr-brc-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /billing-repair-cards"
    occ_field: "expected_work_order_version"
    description: |
      Creating a draft BillingRepairCard supersedes any existing DRAFT card for
      the same work order; doing so against a work-order version the client has
      not observed (e.g., another clerk just created a draft, which bumps the
      work order's version) is rejected as stale.
    error_id: ERR_STALE_WORK_ORDER_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_line_pricing
    trigger: "RepairLine creation (POST /work-orders/{id}/lines) and revise-estimate"
    algorithm: tiered_pricing
    formula: |
      entry = PriceMasterEntry where entry.job_code == line.job_code
              AND entry.effective_from <= current_date <= entry.effective_to
              (if none: ERR_PRICE_MASTER_GAP; windows are non-overlapping so at most one matches)
      estimate_labor_cents = round_half_up(entry.standard_labor_hours * entry.labor_rate_cents_per_hour)
      estimate_material_cents = sum(p.quantity * PartItem[p.part_item_id].unit_price_cents for p in line.planned_parts)
      estimate_total_cents = estimate_labor_cents + estimate_material_cents
    input_set: "The new RepairLine, its planned_parts, the price master entry effective at the current logical-clock date"
    constants:
      ROUNDING: "round_half_up to whole cents"
    precision: "whole cents, round_half_up"
    variants:
      - name: provisional
        when: "estimate time (this calculation)"
        difference: "uses standard_labor_hours and the entry effective at estimate date; never uses mobile rate or surcharge"
      - name: final
        when: "finalization (see final_brc_line_pricing)"
        difference: "uses actual hours/parts, routing-dependent rate, entry effective at completion date"

  - name: final_brc_line_pricing
    trigger: "WorkOrder qa-review PASS (line FINALIZED); results flow into BillingRepairCard lines at draft creation"
    algorithm: chronological
    formula: |
      entry_final = PriceMasterEntry where job_code matches AND effective_at(work_order.completed_at date)
      rate = (work_order.routing == MOBILE) ? entry_final.mobile_labor_rate_cents_per_hour
                                            : entry_final.labor_rate_cents_per_hour
      final_labor_cents = round_half_up(line.actual_labor_hours * rate)
      final_material_cents = sum(a.quantity * PartItem[a.part_item_id].unit_price_cents for a in line.actual_parts)
      final_total_cents = final_labor_cents + final_material_cents
    input_set: "AUTHORIZED RepairLines of the completing WorkOrder; price master as of completed_at; PartItem unit prices at finalization"
    constants:
      ROUNDING: "round_half_up to whole cents"
    precision: "whole cents, round_half_up"
    variants:
      - name: final
        when: "completion (this calculation)"
        difference: "actual hours and parts, mobile rate when routing == MOBILE, entry effective at completion date — may differ from estimate entry if a window boundary was crossed mid-repair"
      - name: provisional
        when: "estimate time (see estimate_line_pricing)"
        difference: "standard hours at estimate-date shop rate"

  - name: responsibility_determination
    trigger: "WorkOrder submit (per RepairLine)"
    algorithm: decision_table
    formula: |
      Evaluate rules in order; FIRST match wins:
      R1: defect.cause_code == HANDLING_DAMAGE  -> HANDLING_LINE, owner_pct = 0
      R2: line price entry shared_split == true -> SHARED, owner_pct = 50
      R3: defect.defect_group == SAFETY_APPLIANCE -> OWNER, owner_pct = 100
      R4: defect.defect_group in {WHEELSET, AIR_HOSE, COUPLER} -> OWNER, owner_pct = 100
      R5: defect.defect_group == STRUCTURAL
          AND hours(railcar.arrived_at -> inspection.completed_at) <= INTERCHANGE_DAMAGE_WINDOW_HOURS
          -> HANDLING_LINE, owner_pct = 0
      R6: default -> OWNER, owner_pct = 100
      WorkOrder.responsible_party = party owning the larger sum of line estimate_total_cents
      (OWNER sums lines with owner_pct >= 50); tie -> OWNER.
    input_set: "All RepairLines of the WorkOrder with their DefectFinding, resolved price entry, parent Railcar.arrived_at and Inspection.completed_at"
    constants:
      INTERCHANGE_DAMAGE_WINDOW_HOURS: 24
    precision: "integer percentages; hours compared at 3-decimal precision"

  - name: dwell_charge
    trigger: "projected variant at assign-slot / dispatch; actual variant at railcar depart; dwell-summary read recomputes actual live"
    algorithm: forward_looking
    formula: |
      actual_hours = hours(railcar.arrived_at -> railcar.departed_at)        # 2-decimal fractional hours
      billable_hours = max(0, actual_hours - dwell_free_hours - railcar.shop_delay_hours)
      dwell_charge_cents = round_half_up(billable_hours * shop.dwell_rate_cents_per_hour)
      Boundary: actual_hours - shop_delay_hours <= dwell_free_hours  ->  0 (strictly greater bills).
    input_set: "Railcar arrival/departure timestamps, accumulated shop_delay_hours (QA_REVIEW durations), Shop dwell config"
    constants:
      FREE_HOURS_SOURCE: "shop.dwell_free_hours (default 48)"
    precision: "hours at 2 decimals; whole cents round_half_up"
    variants:
      - name: projected
        when: "assign-slot (SHOP) or dispatch (MOBILE)"
        difference: "forward-looking: projected_release = slot.ends_at (SHOP) or now + sum(standard_labor_hours) (MOBILE); billable = max(0, hours(arrived_at -> projected_release) - free); stored as railcar.projected_dwell_charge_cents"
      - name: actual
        when: "depart"
        difference: "chronological: uses true departed_at and subtracts shop_delay_hours; stored as railcar.dwell_charge_cents"

  - name: brc_total_aggregation
    trigger: "BillingRepairCard draft creation and submit (pins totals)"
    algorithm: aggregation
    formula: |
      # Rounding order is pinned: per-component, per-line, THEN sum. Never sum-then-round.
      for each BrcLine:
        owner_share_cents = round_half_up(final_amount_cents * owner_pct / 100)
        handling_share_cents = final_amount_cents - owner_share_cents   # remainder to handling line
      mobile_surcharge_cents = (routing == MOBILE) ? earliest-created line's entry.mobile_trip_surcharge_cents : 0
      submitted_total_cents = sum(final_amount_cents over lines) + mobile_surcharge_cents
      owner_total_cents = sum(owner_share_cents) + (mobile_surcharge_cents if work_order.responsible_party in {OWNER, SHARED} else 0)
      handling_line_total_cents = submitted_total_cents - owner_total_cents
      net_settled_cents = submitted_total_cents - sum(accepted counter credits)
    input_set: "BrcLines of the card (FINALIZED repair lines only), WorkOrder.routing, earliest-created line's price entry (tie-break: RepairLine.created_at ASC)"
    constants:
      ROUNDING_ORDER: "per-line round_half_up before summation"
    precision: "whole cents, round_half_up"

  - name: counter_bill_ceiling
    trigger: "CounterBill create and revise"
    algorithm: threshold
    formula: |
      Per-line: item.counter_amount_cents <= brc_line.final_amount_cents
                - brc_line.accepted_credit_cents - brc_line.warranty_credit_cents
                (else ERR_CREDIT_EXCEEDS_REMAINING)
      Aggregate: sum(total_countered_cents of all ACCEPTED counters on BRC)
                 + sum(total_countered_cents of all OPEN/REBUTTED counters on BRC)
                 + this bill's total_countered_cents
                 <= floor(AGGREGATE_COUNTER_CAP_PCT * brc.submitted_total_cents)
                 (else ERR_COUNTER_BILL_EXCEEDS_CEILING)
      Boundary: exactly at the aggregate cap is ALLOWED (<=).
    input_set: "All CounterBills of the BRC with status in {OPEN, REBUTTED, ACCEPTED}; all BrcLines"
    constants:
      AGGREGATE_COUNTER_CAP_PCT: 0.60
    precision: "whole cents; floor on the cap product"

  - name: warranty_credit
    trigger: "WarrantyClaim honor"
    algorithm: conditional_cap
    formula: |
      # Evaluation order is pinned to break the circular appearance:
      # (1) base from line final, (2) subtract accepted counters, (3) subtract prior
      # honored warranty credits, (4) cap at claimed rework cost.
      base = repair_line.final_total_cents
      remaining = base - brc_line.accepted_credit_cents - brc_line.warranty_credit_cents
      credit_cents = min(remaining, claim.claimed_rework_cost_cents)
      Party shares of the credit split by the line's owner_pct:
        owner_credit = round_half_up(credit_cents * owner_pct / 100); handling_credit = credit_cents - owner_credit
      Eligibility (checked at create): filed_at <= work_order.completed_at + shop.warranty_days (inclusive);
        claim.failure_defect_group == original defect's defect_group (else ERR_WARRANTY_NOT_APPLICABLE);
        repair_line.status == FINALIZED; no other claim on the same line in {FILED, VALIDATED}
        (else ERR_WARRANTY_CLAIM_ACTIVE).
    input_set: "The WarrantyClaim, its RepairLine + DefectFinding, the BrcLine referencing that repair line (if a BRC exists), WorkOrder.completed_at"
    constants:
      WINDOW_SOURCE: "shop.warranty_days (default 90)"
    precision: "whole cents, round_half_up"

  - name: shop_capacity_posture
    trigger: "WorkOrder create (intake gate); Shop read (current_posture)"
    algorithm: threshold
    formula: |
      For the current logical-clock calendar day d:
        booked_hours = sum over ShopSlots of this shop with status in {RESERVED, OCCUPIED}
                       whose half-open window [starts_at, ends_at) intersects day d
                       of hours(overlap(window, d))
        capacity_hours = shop.stalls * shop.stall_daily_hours
        posture = FULL if booked_hours >= capacity_hours
                  else CONSTRAINED if booked_hours >= 0.85 * capacity_hours
                  else OPEN
      WorkOrder create is rejected when posture == FULL (ERR_SHOP_AT_CAPACITY).
      Boundary: booked_hours == capacity_hours is FULL (>=).
    input_set: "ShopSlots of the shop in {RESERVED, OCCUPIED} intersecting the current day; Shop.stalls and stall_daily_hours"
    constants:
      CONSTRAINED_RATIO: 0.85
    precision: "hours at 2 decimals"

  - name: wheelset_condemnation
    trigger: "Wheelset evaluate"
    algorithm: threshold
    formula: |
      condemn if flange_thickness_mm <= MIN_FLANGE_MM OR tread_wear_mm >= MAX_TREAD_WEAR_MM
      Boundary: flange exactly 28.0 -> CONDEMNED (<=); tread exactly 9.5 -> CONDEMNED (>=).
      REMOVED wheelset within both limits -> IN_STOCK (reclaimed); IN_STOCK beyond limits -> CONDEMNED.
    input_set: "The evaluated Wheelset's latest measurements"
    constants:
      MIN_FLANGE_MM: 28.0
      MAX_TREAD_WEAR_MM: 9.5
    precision: "mm at 3 decimals"

  - name: parts_availability
    trigger: "WorkOrder authorize (reserve), qa-review PASS (consume), cancel (release), parts adjust (restock/write-off)"
    algorithm: aggregation
    formula: |
      Invariant: PartItem.available_qty == PartItem.on_hand_qty - PartItem.reserved_qty, always >= 0.
      reserve(q): require available_qty >= q (else ERR_PART_STOCK_INSUFFICIENT); reserved_qty += q
      consume(q): on_hand_qty -= q; reserved_qty -= q            # available_qty unchanged by consumption
      release(q): reserved_qty -= q                              # available_qty restored
      adjust(delta): on_hand_qty += delta; rejected if resulting on_hand_qty < reserved_qty (ERR_PART_STOCK_INSUFFICIENT)
      status: DEPLETED if on_hand_qty == 0; else REORDER_NEEDED if available_qty <= reorder_threshold; else ACTIVE
      Boundary: available_qty == reorder_threshold is REORDER_NEEDED (<=).
    input_set: "The PartItem and the reserving/consuming/releasing RepairLine part tuples"
    constants: {}
    precision: "integer units"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per endpoint roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Scoped party checks: authorize/accept/counter actions require the acting entity-backed party to match the resource's responsible party; counter withdraw/revise and warranty appeal require X-User-ID == filed_by_id"
    error_id: ERR_RESPONSIBILITY_MISMATCH
    http_status: 403
    applies_to: "authorize, reject, brc accept, counter-bill create/withdraw/revise, warranty-claim create/appeal"
  - priority: 4
    category: auth
    check: "Segregation of duties: qa-review actor X-User-ID must differ from work_order.created_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /work-orders/{id}/qa-review"
  - priority: 5
    category: existence
    check: "Path resource ids exist within the shop, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 6
    category: existence
    check: "Body references exist: inspection_id, slot_id, defect_finding_id, part ids in planned_parts/line_actuals, work_order_id, brc_line_id in counter items, repair_line_id, railcar_id (mount)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "endpoints with body references"
  - priority: 7
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version on OCC-guarded writes"
    error_id: "ERR_STALE_RAILCAR_VERSION | ERR_STALE_WORK_ORDER_VERSION"
    http_status: 412
    applies_to: "work-orders create, authorize, revise-estimate; billing-repair-cards create"
  - priority: 8
    category: state
    check: "Target resource is in a from-state of the requested transition"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 9
    category: state
    check: "Cross-entity state guards: WO create requires inspection COMPLETED (ERR_INSPECTION_NOT_COMPLETED); BRC create/submit require WO exec COMPLETED (ERR_WORK_ORDER_NOT_COMPLETED); wheelset mount requires railcar IN_SHOP (ERR_CAR_NOT_IN_SHOP); depart requires all WOs terminal (ERR_OPEN_WORK_ORDERS); inspection reopen blocked while referenced by PENDING/AUTHORIZED WO (ERR_INSPECTION_LOCKED)"
    error_id: "ERR_INSPECTION_NOT_COMPLETED | ERR_WORK_ORDER_NOT_COMPLETED | ERR_CAR_NOT_IN_SHOP | ERR_OPEN_WORK_ORDERS | ERR_INSPECTION_LOCKED"
    http_status: 409
    applies_to: "work-orders create/submit, billing-repair-cards create/submit, wheelset mount, railcar depart, inspection reopen"
  - priority: 10
    category: business_safety
    check: "Depart blocked while any DefectFinding on the car has severity CONDEMNABLE and status outside {REPAIRED, DECLINED}"
    error_id: ERR_UNRESOLVED_SAFETY_DEFECT
    http_status: 409
    applies_to: "POST /railcars/{id}/depart"
  - priority: 11
    category: business_referential
    check: "Code references resolvable: aar_defect_code matches AAR-NNNN and enums are valid (ERR_INVALID_DEFECT_CODE); a price master entry effective at the needed date exists for the job_code (ERR_PRICE_MASTER_GAP)"
    error_id: "ERR_INVALID_DEFECT_CODE | ERR_PRICE_MASTER_GAP"
    http_status: 422
    applies_to: "defect create, line create, revise-estimate"
  - priority: 12
    category: business_temporal
    check: "Temporal rules: slot window must not overlap a same-stall RESERVED/OCCUPIED slot (ERR_SLOT_OVERLAP); slot must end in the future (ERR_SLOT_IN_PAST); price windows for the same job_code must not overlap (ERR_PRICE_WINDOW_OVERLAP); counter create/revise within dispute window (ERR_COUNTER_BILL_WINDOW_CLOSED); warranty claim/appeal within warranty window (ERR_WARRANTY_WINDOW_EXPIRED)"
    error_id: "ERR_SLOT_OVERLAP | ERR_SLOT_IN_PAST | ERR_PRICE_WINDOW_OVERLAP | ERR_COUNTER_BILL_WINDOW_CLOSED | ERR_WARRANTY_WINDOW_EXPIRED"
    http_status: 409
    applies_to: "assign-slot, shop-slots create, price-master-entries create, counter-bills create/revise, warranty-claims create/appeal"
  - priority: 13
    category: business_constraint
    check: "Constraint rules: intake gate when posture FULL (ERR_SHOP_AT_CAPACITY); slot hours >= sum of standard hours (ERR_SLOT_WINDOW_TOO_SHORT); MOBILE routing requires all entries mobile_eligible (ERR_MOBILE_ROUTE_NOT_ELIGIBLE); parts availability (ERR_PART_STOCK_INSUFFICIENT); single active BRC per work order (ERR_BRC_ALREADY_ACTIVE); single active counter per BRC (ERR_COUNTER_BILL_ACTIVE); single active claim per line (ERR_WARRANTY_CLAIM_ACTIVE); warranty group match (ERR_WARRANTY_NOT_APPLICABLE); part_number / wheelset serial uniqueness (ERR_DUPLICATE_PART_NUMBER / ERR_DUPLICATE_WHEELSET_SERIAL); WO submit requires lines (ERR_WORK_ORDER_NO_LINES)"
    error_id: "ERR_SHOP_AT_CAPACITY | ERR_SLOT_WINDOW_TOO_SHORT | ERR_MOBILE_ROUTE_NOT_ELIGIBLE | ERR_PART_STOCK_INSUFFICIENT | ERR_BRC_ALREADY_ACTIVE | ERR_COUNTER_BILL_ACTIVE | ERR_WARRANTY_CLAIM_ACTIVE | ERR_WARRANTY_NOT_APPLICABLE | ERR_DUPLICATE_PART_NUMBER | ERR_DUPLICATE_WHEELSET_SERIAL | ERR_WORK_ORDER_NO_LINES"
    http_status: 409
    applies_to: "work-orders create/submit/authorize, assign-slot, billing-repair-cards create, counter-bills create, warranty-claims create, parts create, wheelsets create"
  - priority: 14
    category: business_fiscal
    check: "Fiscal ceilings: aggregate counter cap floor(0.60 * submitted_total_cents) (ERR_COUNTER_BILL_EXCEEDS_CEILING); per-line remaining after counters and warranty credits (ERR_CREDIT_EXCEEDS_REMAINING)"
    error_id: "ERR_COUNTER_BILL_EXCEEDS_CEILING | ERR_CREDIT_EXCEEDS_REMAINING"
    http_status: 409
    applies_to: "counter-bills create/revise"

# =============================================================================
# Section 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is 2026-05-01T00:00:00Z; before any set call the clock reads exactly that instant and never falls back to wall-clock time."
    roles: [ShopAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequent system timestamps use this clock"]

  # --- Shop & configuration ---
  - method: POST
    path: "/shops"
    description: "Create a Shop"
    roles: [ShopAdmin]
    code: 201
    input: [name, stalls, "stall_daily_hours?", "dwell_free_hours?", dwell_rate_cents_per_hour, "warranty_days?", "counter_window_days?", "owner_watch_threshold_cents?"]
    output: Shop
    side_effects: ["config defaults applied; current_posture = OPEN"]
  - method: GET
    path: "/shops/{id}"
    description: "Get a Shop including computed current_posture"
    roles: [Any]
    code: 200
    input: []
    output: Shop
    side_effects: []
  - method: POST
    path: "/shops/{id}/sweep"
    description: "Apply time-based system transitions: BRC deemed acceptance (SUBMITTED past dispute window with no active counters -> ACCEPTED) and CounterBill expiry (OPEN/REBUTTED past window + grace -> EXPIRED)"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: Shop
    side_effects: ["CounterBill expiry first, then BRC deemed acceptance; BRC DISPUTED -> SUBMITTED when counters expire; balances posted on acceptance"]
  - method: POST
    path: "/car-owners"
    description: "Register a CarOwner in a shop"
    roles: [ShopAdmin]
    code: 201
    input: [shop_id, name, scac_code]
    output: CarOwner
    side_effects: ["outstanding_balance_cents = 0; status = ACTIVE"]
  - method: GET
    path: "/car-owners"
    description: "List CarOwners"
    roles: [Any]
    code: 200
    input: ["shop_id?", "status?"]
    output: "CarOwner[]"
    side_effects: []
  - method: GET
    path: "/car-owners/{id}"
    description: "Get a CarOwner"
    roles: [Any]
    code: 200
    input: []
    output: CarOwner
    side_effects: []
  - method: POST
    path: "/handling-lines"
    description: "Register a HandlingLine in a shop"
    roles: [ShopAdmin]
    code: 201
    input: [shop_id, name, mark]
    output: HandlingLine
    side_effects: ["outstanding_balance_cents = 0"]
  - method: GET
    path: "/handling-lines"
    description: "List HandlingLines"
    roles: [Any]
    code: 200
    input: ["shop_id?"]
    output: "HandlingLine[]"
    side_effects: []
  - method: GET
    path: "/handling-lines/{id}"
    description: "Get a HandlingLine"
    roles: [Any]
    code: 200
    input: []
    output: HandlingLine
    side_effects: []
  - method: POST
    path: "/price-master-entries"
    description: "Create a price master entry; per (shop, job_code) closed effective windows must not overlap"
    roles: [ShopAdmin]
    code: 201
    input: [shop_id, job_code, description, labor_rate_cents_per_hour, mobile_labor_rate_cents_per_hour, standard_labor_hours, mobile_trip_surcharge_cents, mobile_eligible, "shared_split?", effective_from, effective_to]
    output: PriceMasterEntry
    side_effects: ["ERR_PRICE_WINDOW_OVERLAP on overlapping closed window for same job_code"]
  - method: GET
    path: "/price-master-entries"
    description: "List price master entries"
    roles: [Any]
    code: 200
    input: ["shop_id?", "job_code?"]
    output: "PriceMasterEntry[]"
    side_effects: []
  - method: GET
    path: "/price-master-entries/{id}"
    description: "Get a price master entry"
    roles: [Any]
    code: 200
    input: []
    output: PriceMasterEntry
    side_effects: []
  - method: POST
    path: "/parts"
    description: "Create a PartItem"
    roles: [ShopAdmin]
    code: 201
    input: [shop_id, part_number, description, unit_price_cents, on_hand_qty, reorder_threshold]
    output: PartItem
    side_effects: ["reserved_qty = 0; status computed; ERR_DUPLICATE_PART_NUMBER per shop"]
  - method: GET
    path: "/parts"
    description: "List PartItems"
    roles: [Any]
    code: 200
    input: ["shop_id?", "status?"]
    output: "PartItem[]"
    side_effects: []
  - method: GET
    path: "/parts/{id}"
    description: "Get a PartItem"
    roles: [Any]
    code: 200
    input: []
    output: PartItem
    side_effects: []
  - method: POST
    path: "/parts/{id}/adjust"
    description: "Restock (positive delta) or write off (negative delta); rejected if resulting on_hand_qty < reserved_qty"
    roles: [PartsClerk]
    code: 200
    input: [delta_qty, reason]
    output: PartItem
    side_effects: ["on_hand_qty += delta_qty; status recompute; ERR_PART_STOCK_INSUFFICIENT if below reserved"]
  - method: POST
    path: "/wheelsets"
    description: "Register a Wheelset"
    roles: [PartsClerk]
    code: 201
    input: [shop_id, serial_number, flange_thickness_mm, tread_wear_mm]
    output: Wheelset
    side_effects: ["status = IN_STOCK; ERR_DUPLICATE_WHEELSET_SERIAL per shop"]
  - method: GET
    path: "/wheelsets"
    description: "List Wheelsets"
    roles: [Any]
    code: 200
    input: ["shop_id?", "status?", "mounted_railcar_id?"]
    output: "Wheelset[]"
    side_effects: []
  - method: GET
    path: "/wheelsets/{id}"
    description: "Get a Wheelset"
    roles: [Any]
    code: 200
    input: []
    output: Wheelset
    side_effects: []
  - method: POST
    path: "/wheelsets/{id}/mount"
    description: "Mount an IN_STOCK wheelset onto a railcar that is IN_SHOP"
    roles: [RepairForeman]
    code: 200
    input: [railcar_id]
    output: Wheelset
    side_effects: ["status -> MOUNTED; mounted_railcar_id set"]
  - method: POST
    path: "/wheelsets/{id}/remove"
    description: "Remove a MOUNTED wheelset"
    roles: [RepairForeman]
    code: 200
    input: []
    output: Wheelset
    side_effects: ["status -> REMOVED; mounted_railcar_id = null"]
  - method: POST
    path: "/wheelsets/{id}/evaluate"
    description: "Record measurements and apply wheelset_condemnation; REMOVED within limits reclaims to IN_STOCK; beyond limits condemns"
    roles: [QualityInspector]
    code: 200
    input: [flange_thickness_mm, tread_wear_mm]
    output: Wheelset
    side_effects: ["store measurements; status transition per wheelset_condemnation"]
  - method: POST
    path: "/shop-slots"
    description: "Create a bookable slot window (half-open [starts_at, ends_at)) on a stall"
    roles: [ShopAdmin]
    code: 201
    input: [shop_id, stall_id, starts_at, ends_at]
    output: ShopSlot
    side_effects: ["status = OPEN; ERR_SLOT_IN_PAST if ends_at <= now; ERR_INVALID_REQUEST if ends_at <= starts_at"]
  - method: GET
    path: "/shop-slots"
    description: "List ShopSlots"
    roles: [Any]
    code: 200
    input: ["shop_id?", "stall_id?", "status?", "reserved_work_order_id?"]
    output: "ShopSlot[]"
    side_effects: []
  - method: GET
    path: "/shop-slots/{id}"
    description: "Get a ShopSlot"
    roles: [Any]
    code: 200
    input: []
    output: ShopSlot
    side_effects: []
  - method: POST
    path: "/shop-slots/{id}/block"
    description: "Block an OPEN slot (maintenance)"
    roles: [ShopAdmin]
    code: 200
    input: []
    output: ShopSlot
    side_effects: ["status -> BLOCKED"]

  # --- Railcar ---
  - method: POST
    path: "/railcars"
    description: "Register an inbound railcar; arrived_at = logical clock now"
    roles: [YardClerk]
    code: 201
    input: [shop_id, reporting_mark, car_number, owner_id, handling_line_id, built_date]
    output: Railcar
    side_effects: ["status = ARRIVED; shop_delay_hours = 0; dwell fields null"]
  - method: GET
    path: "/railcars"
    description: "List Railcars"
    roles: [Any]
    code: 200
    input: ["shop_id?", "owner_id?", "handling_line_id?", "status?"]
    output: "Railcar[]"
    side_effects: []
  - method: GET
    path: "/railcars/{id}"
    description: "Get a Railcar"
    roles: [Any]
    code: 200
    input: []
    output: Railcar
    side_effects: []
  - method: POST
    path: "/railcars/{id}/depart"
    description: "Depart a railcar; computes actual dwell charge"
    roles: [YardClerk]
    code: 200
    input: []
    output: Railcar
    side_effects: ["departed_at = now; status -> DEPARTED; run dwell_charge actual variant"]
  - method: GET
    path: "/railcars/{id}/dwell-summary"
    description: "Computed dwell read: live actual hours, shop delay, billable hours, charge, and pinned projection"
    roles: [Any]
    code: 200
    input: []
    output: { actual_dwell_hours: number, shop_delay_hours: number, billable_hours: number, dwell_charge_cents: integer, projected_dwell_charge_cents: integer }
    side_effects: []

  # --- Inspection & defects ---
  - method: POST
    path: "/railcars/{id}/inspections"
    description: "Open an inspection on a railcar"
    roles: [CarInspector]
    code: 201
    input: []
    output: Inspection
    side_effects: ["status = IN_PROGRESS; inspector_user_id = X-User-ID"]
  - method: GET
    path: "/railcars/{id}/inspections"
    description: "List inspections of a railcar"
    roles: [Any]
    code: 200
    input: []
    output: "Inspection[]"
    side_effects: []
  - method: GET
    path: "/inspections/{id}"
    description: "Get an Inspection"
    roles: [Any]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/defects"
    description: "Add an AAR-coded defect finding"
    roles: [CarInspector]
    code: 201
    input: [aar_defect_code, defect_group, cause_code, severity, location]
    output: DefectFinding
    side_effects: ["status = OPEN; ERR_INVALID_DEFECT_CODE on bad code/enum"]
  - method: GET
    path: "/inspections/{id}/defects"
    description: "List defect findings of an inspection"
    roles: [Any]
    code: 200
    input: ["status?", "severity?"]
    output: "DefectFinding[]"
    side_effects: []
  - method: POST
    path: "/inspections/{id}/defects/{defectId}/decline"
    description: "Decline an OPEN finding (not referenced by any repair line)"
    roles: [RepairForeman]
    code: 200
    input: []
    output: DefectFinding
    side_effects: ["status -> DECLINED"]
  - method: POST
    path: "/inspections/{id}/complete"
    description: "Complete an inspection (from IN_PROGRESS or REOPENED)"
    roles: [CarInspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status -> COMPLETED; completed_at = now"]
  - method: POST
    path: "/inspections/{id}/reopen"
    description: "Reopen a COMPLETED inspection; locked while referenced by a PENDING/AUTHORIZED work order"
    roles: [RepairForeman]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status -> REOPENED; reopened_count += 1"]

  # --- Work orders & repair lines ---
  - method: POST
    path: "/work-orders"
    description: "Create a WorkOrder from a COMPLETED inspection; supersedes any existing DRAFT work order on the same railcar; OCC-guarded on Railcar.version; intake-gated by shop posture"
    roles: [RepairForeman]
    code: 201
    input: [railcar_id, inspection_id, routing, expected_railcar_version]
    output: WorkOrder
    side_effects:
      - "auth_status = DRAFT; exec_status = NOT_STARTED; created_by_user_id = X-User-ID"
      - "existing DRAFT work order on this railcar -> auth_status CANCELLED, exec_status CANCELLED (supersede)"
      - "increments Railcar.version by 1"
      - "ERR_SHOP_AT_CAPACITY when today's posture is FULL"
      - "ERR_INSPECTION_NOT_COMPLETED unless inspection COMPLETED"
  - method: GET
    path: "/work-orders"
    description: "List WorkOrders"
    roles: [Any]
    code: 200
    input: ["railcar_id?", "inspection_id?", "assigned_slot_id?", "auth_status?", "exec_status?"]
    output: "WorkOrder[]"
    side_effects: []
  - method: GET
    path: "/work-orders/{id}"
    description: "Get a WorkOrder"
    roles: [Any]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/lines"
    description: "Add a repair line (DRAFT only); resolves price entry effective today and runs estimate_line_pricing"
    roles: [RepairForeman]
    code: 201
    input: [defect_finding_id, job_code, "planned_parts?"]
    output: RepairLine
    side_effects:
      - "line ESTIMATED; finding OPEN -> ESTIMATED"
      - "recompute work_order.estimate_total_cents; increments WorkOrder.version by 1"
      - "ERR_PRICE_MASTER_GAP when no effective entry for job_code"
  - method: GET
    path: "/work-orders/{id}/lines"
    description: "List repair lines of a work order"
    roles: [Any]
    code: 200
    input: []
    output: "RepairLine[]"
    side_effects: []
  - method: GET
    path: "/repair-lines/{id}"
    description: "Get a RepairLine"
    roles: [Any]
    code: 200
    input: []
    output: RepairLine
    side_effects: []
  - method: GET
    path: "/repair-lines"
    description: "List RepairLines across work orders"
    roles: [Any]
    code: 200
    input: ["price_master_entry_id?", "defect_finding_id?", "status?"]
    output: "RepairLine[]"
    side_effects: []
  - method: POST
    path: "/work-orders/{id}/submit"
    description: "Submit for authorization; runs responsibility_determination"
    roles: [RepairForeman]
    code: 200
    input: []
    output: WorkOrder
    side_effects:
      - "auth_status -> PENDING_AUTHORIZATION; increments WorkOrder.version by 1"
      - "set line.responsible_party / owner_pct and work_order.responsible_party / owner_share_pct"
      - "ERR_WORK_ORDER_NO_LINES when empty; ERR_MOBILE_ROUTE_NOT_ELIGIBLE when a line's entry is not mobile_eligible"
  - method: POST
    path: "/work-orders/{id}/authorize"
    description: "Responsible party authorizes the estimate; OCC version-pinning on the reviewed estimate"
    roles: [CarOwnerRep, HandlingLineRep]
    code: 200
    input: [expected_work_order_version]
    output: WorkOrder
    side_effects:
      - "auth_status -> AUTHORIZED; authorized_at = now; increments WorkOrder.version by 1"
      - "cascade: lines -> AUTHORIZED; findings -> AUTHORIZED; part reservations created; PartItem.status recompute"
  - method: POST
    path: "/work-orders/{id}/reject"
    description: "Responsible party rejects the estimate"
    roles: [CarOwnerRep, HandlingLineRep]
    code: 200
    input: ["reason?"]
    output: WorkOrder
    side_effects: ["auth_status -> REJECTED; exec_status -> CANCELLED; lines -> CANCELLED; findings ESTIMATED -> OPEN; increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/revise-estimate"
    description: "Re-resolve price entries at the current date and recompute estimates while PENDING_AUTHORIZATION; OCC-guarded"
    roles: [RepairForeman]
    code: 200
    input: [expected_work_order_version]
    output: WorkOrder
    side_effects: ["recompute estimate_* fields; increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/assign-slot"
    description: "Reserve a slot for a SHOP work order; half-open overlap rule per stall; pins projected dwell charge"
    roles: [RepairForeman]
    code: 200
    input: [slot_id]
    output: WorkOrder
    side_effects:
      - "exec_status NOT_STARTED -> SHOP_QUEUED; slot OPEN -> RESERVED"
      - "railcar.projected_dwell_charge_cents computed (projected dwell variant)"
      - "increments WorkOrder.version by 1"
  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: "Dispatch a mobile crew for a MOBILE work order; pins projected dwell charge"
    roles: [RepairForeman]
    code: 200
    input: [mobile_crew_id]
    output: WorkOrder
    side_effects: ["exec_status NOT_STARTED -> MOBILE_DISPATCHED; increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/start"
    description: "Begin work: SHOP_QUEUED or MOBILE_DISPATCHED -> IN_PROGRESS"
    roles: [RepairForeman]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["slot RESERVED -> OCCUPIED (SHOP); railcar.status -> IN_SHOP (SHOP); increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Foreman reports completion with per-line actuals; moves to QA_REVIEW"
    roles: [RepairForeman]
    code: 200
    input: [line_actuals]
    output: WorkOrder
    side_effects: ["record actual_labor_hours/actual_parts; qa_review_entered_at = now; exec_status -> QA_REVIEW; increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/qa-review"
    description: "Quality gate; SoD: reviewer must differ from work order creator"
    roles: [QualityInspector]
    code: 200
    input: [result, "notes?"]
    output: WorkOrder
    side_effects:
      - "PASS: exec_status -> COMPLETED; lines FINALIZED with final pricing; parts consumed; slot RELEASED; findings REPAIRED; railcar.shop_delay_hours accrued; railcar -> READY_FOR_DEPARTURE when no open sibling WOs"
      - "FAIL: exec_status -> IN_PROGRESS; rework_count += 1; shop_delay_hours accrued"
      - "increments WorkOrder.version by 1"
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a non-in-progress work order; compensating release of slot and part reservations"
    roles: [RepairForeman]
    code: 200
    input: ["reason?"]
    output: WorkOrder
    side_effects: ["auth/exec -> CANCELLED; lines -> CANCELLED; findings ESTIMATED/AUTHORIZED -> OPEN; slot RESERVED -> RELEASED; reserved parts released; increments WorkOrder.version by 1"]

  # --- Billing repair cards ---
  - method: POST
    path: "/billing-repair-cards"
    description: "Create a draft BRC from a COMPLETED work order; supersedes an existing DRAFT card for the same work order; OCC-guarded on WorkOrder.version"
    roles: [BillingClerk]
    code: 201
    input: [work_order_id, expected_work_order_version]
    output: BillingRepairCard
    side_effects:
      - "status = DRAFT; BrcLines snapshot each FINALIZED RepairLine; run brc_total_aggregation"
      - "existing DRAFT card for this work order -> SUPERSEDED; supersedes_brc_id set"
      - "increments WorkOrder.version by 1"
      - "ERR_BRC_ALREADY_ACTIVE when a non-DRAFT non-terminal card exists (must withdraw first)"
  - method: GET
    path: "/billing-repair-cards"
    description: "List BillingRepairCards"
    roles: [Any]
    code: 200
    input: ["work_order_id?", "status?", "supersedes_brc_id?"]
    output: "BillingRepairCard[]"
    side_effects: []
  - method: GET
    path: "/billing-repair-cards/{id}"
    description: "Get a BillingRepairCard"
    roles: [Any]
    code: 200
    input: []
    output: BillingRepairCard
    side_effects: []
  - method: GET
    path: "/billing-repair-cards/{id}/lines"
    description: "List lines of a BRC"
    roles: [Any]
    code: 200
    input: []
    output: "BrcLine[]"
    side_effects: []
  - method: GET
    path: "/brc-lines/{id}"
    description: "Get a BrcLine"
    roles: [Any]
    code: 200
    input: []
    output: BrcLine
    side_effects: []
  - method: GET
    path: "/brc-lines"
    description: "List BrcLines"
    roles: [Any]
    code: 200
    input: ["repair_line_id?", "brc_id?"]
    output: "BrcLine[]"
    side_effects: []
  - method: POST
    path: "/billing-repair-cards/{id}/submit"
    description: "Submit a draft BRC; pins totals and opens the dispute window"
    roles: [BillingClerk]
    code: 200
    input: []
    output: BillingRepairCard
    side_effects: ["status -> SUBMITTED; submitted_at = now; dispute_window_ends_at computed"]
  - method: POST
    path: "/billing-repair-cards/{id}/accept"
    description: "Responsible party accepts a SUBMITTED card with no active counters; posts net party balances"
    roles: [CarOwnerRep, HandlingLineRep]
    code: 200
    input: []
    output: BillingRepairCard
    side_effects: ["status -> ACCEPTED; owner/handling balances += respective totals minus accepted counter-credit shares"]
  - method: POST
    path: "/billing-repair-cards/{id}/withdraw"
    description: "Withdraw a DRAFT or SUBMITTED card (no active counters)"
    roles: [BillingClerk]
    code: 200
    input: []
    output: BillingRepairCard
    side_effects: ["status -> WITHDRAWN"]
  - method: POST
    path: "/billing-repair-cards/{id}/settle"
    description: "Mark an ACCEPTED card paid; balances reduced by net settled amounts"
    roles: [BillingClerk]
    code: 200
    input: []
    output: BillingRepairCard
    side_effects: ["status -> SETTLED; owner/handling balances -= net party shares"]

  # --- Counter-bills ---
  - method: POST
    path: "/billing-repair-cards/{id}/counter-bills"
    description: "File a counter-bill against a SUBMITTED/DISPUTED BRC within the dispute window"
    roles: [CarOwnerRep, HandlingLineRep]
    code: 201
    input: [items]
    output: CounterBill
    side_effects:
      - "status = OPEN; filed_by_* recorded; BRC SUBMITTED -> DISPUTED"
      - "ceiling checks: aggregate 60% cap (ERR_COUNTER_BILL_EXCEEDS_CEILING) evaluated before per-line remaining (ERR_CREDIT_EXCEEDS_REMAINING)"
      - "ERR_COUNTER_BILL_ACTIVE when another counter is OPEN/REBUTTED; ERR_COUNTER_BILL_WINDOW_CLOSED after dispute_window_ends_at"
  - method: GET
    path: "/billing-repair-cards/{id}/counter-bills"
    description: "List counter-bills of a BRC"
    roles: [Any]
    code: 200
    input: ["status?"]
    output: "CounterBill[]"
    side_effects: []
  - method: GET
    path: "/counter-bills/{id}"
    description: "Get a CounterBill"
    roles: [Any]
    code: 200
    input: []
    output: CounterBill
    side_effects: []
  - method: POST
    path: "/counter-bills/{id}/accept"
    description: "Shop accepts a counter-bill; credits cascade to lines, BRC net, and (on no remaining active counters) BRC status"
    roles: [BillingClerk]
    code: 200
    input: []
    output: CounterBill
    side_effects: ["status -> ACCEPTED; BrcLine.accepted_credit_cents += amounts; BRC.net_settled_cents recomputed; BRC DISPUTED -> SUBMITTED when no active counters remain; balance effect deferred to BRC accept (net posting)"]
  - method: POST
    path: "/counter-bills/{id}/rebut"
    description: "Shop rebuts an OPEN counter-bill"
    roles: [BillingClerk]
    code: 200
    input: ["rebuttal_note?"]
    output: CounterBill
    side_effects: ["status -> REBUTTED"]
  - method: POST
    path: "/counter-bills/{id}/revise"
    description: "Filer revises a REBUTTED counter-bill (negotiation round); ceilings re-checked"
    roles: [CarOwnerRep, HandlingLineRep]
    code: 200
    input: [items]
    output: CounterBill
    side_effects: ["status REBUTTED -> OPEN; items replaced; total_countered_cents recomputed"]
  - method: POST
    path: "/counter-bills/{id}/withdraw"
    description: "Filer withdraws an OPEN/REBUTTED counter-bill"
    roles: [CarOwnerRep, HandlingLineRep]
    code: 200
    input: []
    output: CounterBill
    side_effects: ["status -> WITHDRAWN; BRC DISPUTED -> SUBMITTED when no active counters remain"]

  # --- Warranty claims ---
  - method: POST
    path: "/warranty-claims"
    description: "File a warranty claim against a FINALIZED repair line within the warranty window"
    roles: [CarOwnerRep, HandlingLineRep]
    code: 201
    input: [repair_line_id, failure_defect_group, claimed_rework_cost_cents, description]
    output: WarrantyClaim
    side_effects: ["status = FILED; ERR_WARRANTY_WINDOW_EXPIRED / ERR_WARRANTY_NOT_APPLICABLE / ERR_WARRANTY_CLAIM_ACTIVE per rules"]
  - method: GET
    path: "/warranty-claims"
    description: "List WarrantyClaims"
    roles: [Any]
    code: 200
    input: ["shop_id?", "repair_line_id?", "status?"]
    output: "WarrantyClaim[]"
    side_effects: []
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Get a WarrantyClaim"
    roles: [Any]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/warranty-claims/{id}/validate"
    description: "Quality inspector validates a claim"
    roles: [QualityInspector]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> VALIDATED"]
  - method: POST
    path: "/warranty-claims/{id}/honor"
    description: "Billing clerk honors a VALIDATED claim; warranty_credit runs and cascades"
    roles: [BillingClerk]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> HONORED; credit_cents computed; BrcLine.warranty_credit_cents += credit; party balances decreased by credit shares"]
  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Quality inspector denies a claim"
    roles: [QualityInspector]
    code: 200
    input: ["reason?"]
    output: WarrantyClaim
    side_effects: ["status -> DENIED"]
  - method: POST
    path: "/warranty-claims/{id}/appeal"
    description: "Filer appeals a DENIED claim within the warranty window"
    roles: [CarOwnerRep, HandlingLineRep]
    code: 200
    input: ["note?"]
    output: WarrantyClaim
    side_effects: ["status DENIED -> FILED; appeal_count += 1"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, malformed, or role not declared" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum literal, negative/zero quantities, ends_at <= starts_at" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is valid but not permitted for this endpoint" }
  - { id: ERR_RESPONSIBILITY_MISMATCH, http: 403, condition: "Acting entity-backed party does not match the resource's determined responsible party, or non-filer attempts withdraw/revise/appeal" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "qa-review actor X-User-ID equals work_order.created_by_user_id" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist within the shop" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body-supplied reference (inspection, slot, defect, part, work order, brc line, repair line, railcar) does not exist" }
  - { id: ERR_STALE_RAILCAR_VERSION, http: 412, condition: "expected_railcar_version does not match the railcar's current version on work-order create" }
  - { id: ERR_STALE_WORK_ORDER_VERSION, http: 412, condition: "expected_work_order_version does not match the work order's current version on authorize / revise-estimate / BRC create" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Target resource is not in a from-state of the requested transition" }
  - { id: ERR_INSPECTION_NOT_COMPLETED, http: 409, condition: "Work-order create or submit references an inspection not in COMPLETED" }
  - { id: ERR_INSPECTION_LOCKED, http: 409, condition: "Inspection reopen blocked: referenced by a PENDING_AUTHORIZATION or AUTHORIZED work order" }
  - { id: ERR_WORK_ORDER_NOT_COMPLETED, http: 409, condition: "BRC create/submit requires the work order exec_status COMPLETED" }
  - { id: ERR_CAR_NOT_IN_SHOP, http: 409, condition: "Wheelset mount requires the railcar status IN_SHOP" }
  - { id: ERR_OPEN_WORK_ORDERS, http: 409, condition: "Depart blocked: a work order of this railcar is not in {COMPLETED, CANCELLED}" }
  - { id: ERR_UNRESOLVED_SAFETY_DEFECT, http: 409, condition: "Depart blocked: a CONDEMNABLE finding is neither REPAIRED nor DECLINED" }
  - { id: ERR_INVALID_DEFECT_CODE, http: 422, condition: "aar_defect_code fails the AAR-NNNN format or defect_group/cause_code/severity enum is invalid" }
  - { id: ERR_PRICE_MASTER_GAP, http: 422, condition: "No price master entry effective for the job_code at the required date" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Assign-slot window overlaps a same-stall slot in {RESERVED, OCCUPIED}; half-open adjacency (ends_at == starts_at) is allowed" }
  - { id: ERR_SLOT_IN_PAST, http: 409, condition: "Slot creation with ends_at at or before the logical clock now" }
  - { id: ERR_PRICE_WINDOW_OVERLAP, http: 409, condition: "Closed effective window overlaps another entry for the same shop+job_code" }
  - { id: ERR_COUNTER_BILL_WINDOW_CLOSED, http: 409, condition: "Counter create/revise after BRC dispute_window_ends_at" }
  - { id: ERR_WARRANTY_WINDOW_EXPIRED, http: 409, condition: "Claim or appeal after work_order.completed_at + shop.warranty_days (inclusive boundary)" }
  - { id: ERR_SHOP_AT_CAPACITY, http: 409, condition: "Work-order intake rejected: today's booked_hours >= capacity_hours (posture FULL)" }
  - { id: ERR_SLOT_WINDOW_TOO_SHORT, http: 409, condition: "Slot window hours < sum of the work order's lines' standard_labor_hours" }
  - { id: ERR_MOBILE_ROUTE_NOT_ELIGIBLE, http: 409, condition: "MOBILE work order submit with a line whose price entry is not mobile_eligible" }
  - { id: ERR_PART_STOCK_INSUFFICIENT, http: 409, condition: "Authorize requires available_qty >= planned qty for every part; also blocks part adjust below reserved_qty" }
  - { id: ERR_BRC_ALREADY_ACTIVE, http: 409, condition: "A non-DRAFT, non-terminal BRC already exists for the work order" }
  - { id: ERR_COUNTER_BILL_ACTIVE, http: 409, condition: "An OPEN or REBUTTED counter-bill already exists on the BRC / blocks BRC accept-with-active-counter" }
  - { id: ERR_WARRANTY_CLAIM_ACTIVE, http: 409, condition: "A FILED or VALIDATED claim already exists on the same repair line" }
  - { id: ERR_WARRANTY_NOT_APPLICABLE, http: 409, condition: "failure_defect_group differs from the original defect group, or line not FINALIZED" }
  - { id: ERR_DUPLICATE_PART_NUMBER, http: 409, condition: "part_number already exists within the shop" }
  - { id: ERR_DUPLICATE_WHEELSET_SERIAL, http: 409, condition: "serial_number already exists within the shop" }
  - { id: ERR_WORK_ORDER_NO_LINES, http: 409, condition: "Submit requires at least one repair line" }
  - { id: ERR_COUNTER_BILL_EXCEEDS_CEILING, http: 409, condition: "Aggregate countered total would exceed floor(0.60 * submitted_total_cents)" }
  - { id: ERR_CREDIT_EXCEEDS_REMAINING, http: 409, condition: "Per-line counter amount exceeds final_amount minus accepted credits minus honored warranty credits" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ShopAdmin
    description: "Shop superuser for configuration: shop creation, price master, slots, parts catalog, owner/line registry, clock and sweep"
    identity: opaque
    exclusive_operations:
      - "POST /shops"
      - "POST /_clock/set_current_utc"
      - "POST /shops/{id}/sweep"
      - "POST /car-owners"
      - "POST /handling-lines"
      - "POST /price-master-entries"
      - "POST /parts"
      - "POST /shop-slots"
      - "POST /shop-slots/{id}/block"
    shared_operations: ["all GET endpoints"]
  - name: YardClerk
    description: "Yard operations: registers inbound railcars and departs them"
    identity: opaque
    exclusive_operations:
      - "POST /railcars"
      - "POST /railcars/{id}/depart"
    shared_operations: ["all GET endpoints"]
  - name: CarInspector
    description: "Performs inbound inspections and AAR defect coding; may not authorize or QA repairs (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /railcars/{id}/inspections"
      - "POST /inspections/{id}/defects"
      - "POST /inspections/{id}/complete"
    shared_operations: ["all GET endpoints"]
  - name: RepairForeman
    description: "Builds and runs work orders: lines, submit, slot assignment, dispatch, start, complete, cancel; reopens inspections; mounts/removes wheelsets; cannot qa-review a work order they created"
    identity: opaque
    exclusive_operations:
      - "POST /work-orders and all work-order actions except qa-review and authorize/reject"
      - "POST /inspections/{id}/reopen"
      - "POST /inspections/{id}/defects/{defectId}/decline"
      - "POST /wheelsets/{id}/mount and remove"
    shared_operations: ["all GET endpoints"]
  - name: QualityInspector
    description: "Quality gate: qa-review, wheelset evaluation/condemnation, warranty validation/denial; independent of work-order creation"
    identity: opaque
    exclusive_operations:
      - "POST /work-orders/{id}/qa-review"
      - "POST /wheelsets/{id}/evaluate"
      - "POST /warranty-claims/{id}/validate and deny"
    shared_operations: ["all GET endpoints"]
  - name: PartsClerk
    description: "Parts crib: stock adjustments and wheelset registration"
    identity: opaque
    exclusive_operations:
      - "POST /parts/{id}/adjust"
      - "POST /wheelsets"
    shared_operations: ["all GET endpoints"]
  - name: BillingClerk
    description: "Billing desk: BRC lifecycle, counter-bill accept/rebut, warranty honoring; cannot file counter-bills or claims"
    identity: opaque
    exclusive_operations:
      - "POST /billing-repair-cards and submit/withdraw/settle"
      - "POST /counter-bills/{id}/accept and rebut"
      - "POST /warranty-claims/{id}/honor"
    shared_operations: ["all GET endpoints"]
  - name: CarOwnerRep
    description: "Car owner's agent: authorizes owner-responsible estimates, accepts BRCs, files/withdraws counter-bills, files/appeals warranty claims"
    identity: entity_backed:CarOwner
    exclusive_operations:
      - "POST authorize/reject when work_order.responsible_party is OWNER or SHARED (X-User-ID must equal railcar.owner_id)"
      - "POST brc accept / counter-bill create, revise, withdraw / warranty-claim create, appeal as the owning party"
    shared_operations: ["all GET endpoints"]
  - name: HandlingLineRep
    description: "Handling railroad's agent: same party operations as CarOwnerRep when responsibility is HANDLING_LINE"
    identity: entity_backed:HandlingLine
    exclusive_operations:
      - "POST authorize/reject when work_order.responsible_party is HANDLING_LINE (X-User-ID must equal railcar.handling_line_id)"
      - "POST brc accept / counter-bill create, revise, withdraw / warranty-claim create, appeal as the handling party"
    shared_operations: ["all GET endpoints"]
  - name: Any
    description: "Wildcard for read endpoints: any request carrying a valid declared role and user id may read"
    identity: opaque
    exclusive_operations: []
    shared_operations: ["all GET endpoints"]
