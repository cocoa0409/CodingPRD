              as: SignatureReviewer
              as_user_id: "${rv1}"
              captures: { replay_err: $.data.error_id }
          assert:
            - "HTTP 409; data.error_id == \"ERR_REVIEW_ALREADY_SUBMITTED\""
            - "GET /vote-by-mail/signature-reviews/${sr1} returns decision == \"MATCH\", similarity_score == 80, confidence_score == 0.8000"
            - "GET /vote-by-mail/return-envelopes/${en1} returns signature_status == \"ACCEPTED\" and review_round_count == 1"
            - "GET /vote-by-mail/reviewers/${rv1} returns active_review_count == 0 and completed_review_count == 1"

      - name: second_completion_of_a_remake_returns_remake_state_invalid
