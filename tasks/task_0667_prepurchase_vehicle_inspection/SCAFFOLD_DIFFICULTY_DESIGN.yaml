        grounds:
          - validations[priority=7]
          - validations[priority=15]
          - state_machines.InspectionOrder.REPORTED_to_DELIVERED
        distinguishing_aspect: |
          Delivering an order that is both not in REPORTED state AND unpaid violates the state rule
          (priority 7, category state, ERR_INVALID_STATE) and the fiscal rule (priority 15, business_fiscal,
          ERR_PAYMENT_REQUIRED); the lower-priority state error wins. Category pair: state vs business_fiscal.
        test_recipe:
          setup:
            - "A DRAFT order exists, UNPAID (workflow not REPORTED, payment not in {PAID,INVOICED})."
          setup_api_calls:
