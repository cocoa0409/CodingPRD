              as: BureauAdmin
              captures: { x4_shut_id: "$.data.id", x4_shut_status: "$.data.status" }
            - call: "POST /bureau/entry-facilities"
              payload: { facility_code: "EF-X4-OPEN", facility_type: "SCF", tray_capacity_per_window: 10, discount_bp_first_class: 850, discount_bp_marketing: 400 }
              as: BureauAdmin
              captures: { x4_open_id: "$.data.id" }
            - call: "POST /bureau/composition-templates"
              payload: { client_id: "${x4_client_id}", template_code: "T-X4", version_no: 1, duplex_required: false, sheets_per_document: 1, color_pages_per_document: 0, mail_class_preference: "FIRST_CLASS", required_insert_codes: [], variable_content_rules: [] }
              as: BureauAdmin
              captures: { x4_template_id: "$.data.id" }
            - call: "POST /bureau/composition-templates/${x4_template_id}/activate"
              payload: {}
              as: BureauAdmin
            - call: "POST /bureau/data-files"
              payload: { client_id: "${x4_client_id}", file_name: "x4.csv", format_spec_code: "DELIMITED", declared_record_count: 1, declared_control_total_cents: 9000 }
