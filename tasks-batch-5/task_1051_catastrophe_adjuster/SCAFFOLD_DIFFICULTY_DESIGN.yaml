scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_bill_method_divergence
        grounds:
          - calculations.fee_bill_amount
          - entities.FeeBill.fields.billing_method
          - entities.FeeBill.fields.total_cents
        distinguishing_aspect: |
          On the FeeBill/Assignment domain: the SAME work-complete assignment billed via
          FEE_SCHEDULE yields total_cents=387500 while a superseding TIME_AND_EXPENSE bill
          yields total_cents=109250 — two valid billing algorithms, different money.
        test_recipe:
          setup:
            - "Adjuster with an ACTIVE FL ALL_LINES license; HURRICANE (CAT) ACV claim in FL"
            - "Assignment accepted; inspection completed; estimate rcv_total=10000000 approved (Claim.rcv_cents=10000000); report submitted (work_status=WORK_COMPLETE)"
            - "Two TimeEntries logged: 6.0h/exp 15000 and 4.5h/exp 5000; FeeSchedule canonical rate card"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A One", email: "a1@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-1", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /fee-schedules", payload: { name: "STD", tier1_max_rcv_cents: 5000000, tier2_max_rcv_cents: 25000000, tier1_flat_fee_cents: 30000, tier2_flat_fee_cents: 60000, tier3_flat_fee_cents: 100000, rcv_pct_bps: 250, pct_cap_cents: 20000000, hourly_rate_cents: 8500, cat_peril_multiplier_bps: 12500 }, as: BillingManager, captures: { fs_id: $.data.id } }
            - { call: "POST /claims", payload: { claim_number: "C-1", policyholder_name: "PH", loss_state: "FL", peril_type: "HURRICANE", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T11:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /estimates", payload: { inspection_id: "${insp_id}", claim_id: "${claim_id}", line_items: [ { description: "Roof", rcv_cents: 10000000, depreciation_pct: 20 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_id: $.data.id } }
            - { call: "POST /estimates/${est_id}/approve", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "Full roof", photo_count: 4 }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id } }
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /time-entries", payload: { assignment_id: "${asg_id}", work_date: "2026-07-02T00:00:00Z", activity: "INSPECTION", hours: 6.0, expense_cents: 15000 }, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /time-entries", payload: { assignment_id: "${asg_id}", work_date: "2026-07-03T00:00:00Z", activity: "REPORT", hours: 4.5, expense_cents: 5000 }, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "GET /assignments/${asg_id}", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { asg_ver1: $.data.version } }
          trigger:
            - { call: "POST /fee-bills", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", fee_schedule_id: "${fs_id}", billing_method: "FEE_SCHEDULE", expected_assignment_version: "${asg_ver1}" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { bill_fs_id: $.data.id, bill_fs_total: $.data.total_cents } }
            - { call: "GET /assignments/${asg_id}", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { asg_ver2: $.data.version } }
            - { call: "POST /fee-bills", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", fee_schedule_id: "${fs_id}", billing_method: "TIME_AND_EXPENSE", expected_assignment_version: "${asg_ver2}" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { bill_te_id: $.data.id, bill_te_total: $.data.total_cents } }
          assert:
            - "FeeBill(${bill_fs_id}).total_cents == 387500"
            - "FeeBill(${bill_te_id}).total_cents == 109250"
            - "FeeBill(${bill_fs_id}).total_cents != FeeBill(${bill_te_id}).total_cents"
            - "FeeBill(${bill_fs_id}).status == VOID  (superseded by the T&E bill)"

      - name: estimate_rcv_vs_acv_net_payable
        grounds:
          - calculations.estimate_valuation
          - entities.Claim.fields.policy_type
          - entities.Estimate.fields.net_payable_cents
        distinguishing_aspect: |
          On the Estimate/Claim valuation domain: identical line_items produce net_payable_cents=20002
          under an RCV-policy claim and net_payable_cents=10002 under an ACV-policy claim.
        test_recipe:
          setup:
            - "One adjuster with ACTIVE FL license"
            - "Claim R (policy_type=RCV) and Claim V (policy_type=ACV), both FL/HAIL"
            - "Each claim has its own accepted assignment + completed inspection; a DRAFT estimate with line_items [{10001,50%},{10001,50%}]"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A Two", email: "a2@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-2", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /claims", payload: { claim_number: "C-R", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "RCV" }, as: DeskExaminer, captures: { claim_r: $.data.id } }
            - { call: "POST /claims", payload: { claim_number: "C-V", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_v: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_r}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_r: $.data.id } }
            - { call: "POST /assignments/${asg_r}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_r}", claim_id: "${claim_r}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_r: $.data.id } }
            - { call: "POST /inspections/${insp_r}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_r}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /assignments", payload: { claim_id: "${claim_v}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_v: $.data.id } }
            - { call: "POST /assignments/${asg_v}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_v}", claim_id: "${claim_v}", scheduled_start: "2026-07-05T09:00:00Z", scheduled_end: "2026-07-05T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_v: $.data.id } }
            - { call: "POST /inspections/${insp_v}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_v}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
          trigger:
            - { call: "POST /estimates", payload: { inspection_id: "${insp_r}", claim_id: "${claim_r}", line_items: [ { description: "L1", rcv_cents: 10001, depreciation_pct: 50 }, { description: "L2", rcv_cents: 10001, depreciation_pct: 50 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_r: $.data.id, np_r: $.data.net_payable_cents } }
            - { call: "POST /estimates", payload: { inspection_id: "${insp_v}", claim_id: "${claim_v}", line_items: [ { description: "L1", rcv_cents: 10001, depreciation_pct: 50 }, { description: "L2", rcv_cents: 10001, depreciation_pct: 50 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_v: $.data.id, np_v: $.data.net_payable_cents } }
          assert:
            - "Estimate(${est_r}).net_payable_cents == 20002"
            - "Estimate(${est_v}).net_payable_cents == 10002"
            - "Estimate(${est_r}).rcv_total_cents == 20002 AND Estimate(${est_r}).acv_total_cents == 10002 (both variants computed regardless of policy)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: fee_schedule_tiered_cat_multiplier
        grounds:
          - calculations.fee_bill_amount
          - entities.FeeSchedule.fields.cat_peril_multiplier_bps
          - entities.Claim.fields.peril_type
        distinguishing_aspect: |
          Mode (a): >=3 interacting inputs with non-linear combination — tiered flat-fee
          selection by RCV, a min-capped percent component, and a conditional CAT multiplier;
          rcv=10000000 + HURRICANE gives floor((60000+250000)*1.25)=387500, not a linear scale.
        test_recipe:
          setup:
            - "Work-complete HURRICANE(CAT) ACV FL assignment; Claim.rcv_cents=10000000; canonical FeeSchedule"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A Three", email: "a3@x.com", adjuster_type: "CAT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-3", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /fee-schedules", payload: { name: "STD", tier1_max_rcv_cents: 5000000, tier2_max_rcv_cents: 25000000, tier1_flat_fee_cents: 30000, tier2_flat_fee_cents: 60000, tier3_flat_fee_cents: 100000, rcv_pct_bps: 250, pct_cap_cents: 20000000, hourly_rate_cents: 8500, cat_peril_multiplier_bps: 12500 }, as: BillingManager, captures: { fs_id: $.data.id } }
            - { call: "POST /claims", payload: { claim_number: "C-3", policyholder_name: "PH", loss_state: "FL", peril_type: "HURRICANE", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T11:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /estimates", payload: { inspection_id: "${insp_id}", claim_id: "${claim_id}", line_items: [ { description: "Roof", rcv_cents: 10000000, depreciation_pct: 0 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_id: $.data.id } }
            - { call: "POST /estimates/${est_id}/approve", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "s", photo_count: 2 }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id } }
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "GET /assignments/${asg_id}", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { asg_ver: $.data.version } }
          trigger:
            - { call: "POST /fee-bills", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", fee_schedule_id: "${fs_id}", billing_method: "FEE_SCHEDULE", expected_assignment_version: "${asg_ver}" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { bill_id: $.data.id } }
          assert:
            - "FeeBill(${bill_id}).subtotal_cents == 387500"
            - "FeeBill(${bill_id}).total_cents == 387500"

      - name: estimate_perline_rounding_order
        grounds:
          - calculations.estimate_valuation
          - entities.Estimate.fields.acv_total_cents
        distinguishing_aspect: |
          Mode (b): rounding order matters — round_half_up PER LINE then sum gives
          acv_total_cents=10002, whereas sum-then-round of the same lines gives 10001; the
          scaffold pins per-line rounding.
        test_recipe:
          setup:
            - "Accepted FL/HAIL/ACV assignment with completed inspection"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A Four", email: "a4@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-4", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /claims", payload: { claim_number: "C-4", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
          trigger:
            - { call: "POST /estimates", payload: { inspection_id: "${insp_id}", claim_id: "${claim_id}", line_items: [ { description: "L1", rcv_cents: 10001, depreciation_pct: 50 }, { description: "L2", rcv_cents: 10001, depreciation_pct: 50 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_id: $.data.id } }
          assert:
            - "Estimate(${est_id}).acv_total_cents == 10002  (per-line round_half_up(5000.5)=5001 twice; NOT 10001)"
            - "Estimate(${est_id}).recoverable_depreciation_cents == 10000"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: report_revision_cycle
        grounds:
          - state_machines.Report.SUBMITTED_to_REVISION_REQUESTED
          - state_machines.Report.REVISION_REQUESTED_to_SUBMITTED
          - entities.Report.fields.revision_count
        distinguishing_aspect: |
          Report is cyclic: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED returns to a prior
          state with revision_count incremented to 1 — a revision loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Field adjuster A and QA reviewer B (distinct Adjusters)"
            - "Report SUBMITTED for A's completed inspection; then QA-revision requested (Inspection REOPENED)"
            - "A restarts and re-completes the inspection so it is COMPLETED again"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A5", email: "a5@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /adjusters", payload: { full_name: "B5", email: "b5@x.com", adjuster_type: "STAFF", home_state: "FL" }, as: LicensingAdmin, captures: { qa_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-5", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /claims", payload: { claim_number: "C-5", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "ACV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /estimates", payload: { inspection_id: "${insp_id}", claim_id: "${claim_id}", line_items: [ { description: "L1", rcv_cents: 50000, depreciation_pct: 10 } ] }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { est_id: $.data.id } }
            - { call: "POST /estimates/${est_id}/approve", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports", payload: { inspection_id: "${insp_id}", assignment_id: "${asg_id}", scope_narrative: "v1", photo_count: 3 }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_id: $.data.id } }
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /reports/${rpt_id}/qa-decision", payload: { decision: "REVISION_REQUESTED", qa_notes: "add elevations" }, as: QAReviewer, as_user_id: "${qa_id}" }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections/${insp_id}/complete", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
          trigger:
            - { call: "POST /reports/${rpt_id}/submit", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { rpt_status: $.data.status, rpt_rev: $.data.revision_count } }
          assert:
            - "Report(${rpt_id}).status == SUBMITTED  (looped back from REVISION_REQUESTED)"
            - "Report(${rpt_id}).revision_count == 1"

      - name: assignment_parallel_dimensions
        grounds:
          - entities.Assignment.fields.work_status
          - entities.Assignment.fields.billing_status
          - state_machines.Assignment.NOT_BILLED_to_BILLED
        distinguishing_aspect: |
          Assignment carries two independent state axes on one row: after a fee bill is submitted
          the billing_status advances to BILLED while work_status stays WORK_COMPLETE — the two
          dimensions evolve independently.
        test_recipe:
          setup:
            - "Work-complete FL/HAIL/RCV assignment; canonical FeeSchedule; Claim.rcv_cents approved"
          setup_api_calls:
            - { call: "POST /adjusters", payload: { full_name: "A6", email: "a6@x.com", adjuster_type: "INDEPENDENT", home_state: "FL" }, as: LicensingAdmin, captures: { adj_id: $.data.id } }
            - { call: "POST /licenses", payload: { adjuster_id: "${adj_id}", state_code: "FL", license_number: "FL-6", license_type: "ALL_LINES", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: LicensingAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licenses/${lic_id}/activate", payload: {}, as: LicensingAdmin }
            - { call: "POST /fee-schedules", payload: { name: "STD", tier1_max_rcv_cents: 5000000, tier2_max_rcv_cents: 25000000, tier1_flat_fee_cents: 30000, tier2_flat_fee_cents: 60000, tier3_flat_fee_cents: 100000, rcv_pct_bps: 250, pct_cap_cents: 20000000, hourly_rate_cents: 8500, cat_peril_multiplier_bps: 12500 }, as: BillingManager, captures: { fs_id: $.data.id } }
            - { call: "POST /claims", payload: { claim_number: "C-6", policyholder_name: "PH", loss_state: "FL", peril_type: "HAIL", policy_type: "RCV" }, as: DeskExaminer, captures: { claim_id: $.data.id } }
            - { call: "POST /assignments", payload: { claim_id: "${claim_id}", adjuster_id: "${adj_id}" }, as: DeskExaminer, captures: { asg_id: $.data.id } }
            - { call: "POST /assignments/${asg_id}/accept", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
            - { call: "POST /inspections", payload: { assignment_id: "${asg_id}", claim_id: "${claim_id}", scheduled_start: "2026-07-02T09:00:00Z", scheduled_end: "2026-07-02T10:00:00Z" }, as: FieldAdjuster, as_user_id: "${adj_id}", captures: { insp_id: $.data.id } }
            - { call: "POST /inspections/${insp_id}/start", payload: {}, as: FieldAdjuster, as_user_id: "${adj_id}" }
