          - validations[priority=10]
          - errors[ERR_CYCLE_STATE_INVALID]
        distinguishing_aspect: "OBSERVATION_FINALIZED is the only declared from-state for the award transition, so awarding a DOCS_VERIFIED cycle returns ERR_CYCLE_STATE_INVALID (409) at priority 10 — before the priority 26/27/28/52 award gates are ever evaluated — and stamps no awarded_on."
