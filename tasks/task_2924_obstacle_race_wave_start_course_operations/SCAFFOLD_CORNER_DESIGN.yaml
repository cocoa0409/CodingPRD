      - name: the_role_gate_rejects_the_call_before_the_body_is_ever_parsed
        claim_type: Priority Ordering
        grounds:
          - validations[priority 2]
          - validations[priority 4]
        distinguishing_aspect: "One request violates both the role gate (priority 2) and the schema gate (priority 4); the response must be 403 ERR_FORBIDDEN_ROLE, and the same malformed body sent by the right role then produces 422 ERR_INVALID_REQUEST, proving the ordering rather than a coincidence."
        test_recipe:
          setup:
            - "No domain rows are needed; the logical clock is left at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ocr/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PermitOfficer
          trigger:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "NONE", land_use_zone: "AG-2" }
              as: ObstacleMarshal
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "NONE", land_use_zone: "AG-2" }
              as: PermitOfficer
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "NONE", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
          assert:
            - "The first trigger call returns 403 with data.error_id == ERR_FORBIDDEN_ROLE, not 422 ERR_INVALID_REQUEST, even though protected_acreage_sqm and restoration_bond_cents are both missing"
            - "The second trigger call returns 422 with data.error_id == ERR_INVALID_REQUEST, naming the missing fields"
            - "The third trigger call returns 201 with Venue.${venue_id}.site_posture == OPEN and bond_held_cents == 1000000"
            - "GET /ocr/venues returns exactly one row: neither refused call persisted a Venue"

      - name: the_progression_gate_outranks_the_disturbed_area_gate_on_one_call
        claim_type: Priority conflict
        grounds:
          - validations[priority 25]
          - validations[priority 29]
          - errors[ERR_PROGRESSION_TOO_FLAT]
          - errors[ERR_DISTURBED_AREA_EXCEEDED]
        distinguishing_aspect: "Both design gates fire on the same validate call and the priority-25 422 must win over the priority-29 409; the same venue is then used to show each error alone, so the ordering claim cannot be satisfied by an implementation that only ever raises one of them."
        test_recipe:
          setup:
            - "A venue with an APPROVED permit capped at max_disturbed_area_sqm 5000."
            - "Course A carries three dry stations of 1600 sqm each with difficulty ratings 5, 5, 5, so its progression score is 0.00 and the venue's disturbed area is 4800."
            - "Course B carries three dry stations of 500 sqm each with ratings 3, 5, 7, so its progression score is 2.00 and the venue's disturbed area rises to 6300 — above the permit cap."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "NONE", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
