  # ===========================================================================
  # Section 7 — RBAC (Table 7 claims)
  # ===========================================================================
  - section: rbac
    instances:
      - name: dispatcher_cannot_manage_bases
        claim_type: role_denied
        grounds:
          - roles.Dispatcher
          - roles.OpsAdmin
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: |
          Base config is OpsAdmin-exclusive: a Dispatcher POST /bases is denied
          403 ERR_UNAUTHORIZED_ROLE, while the same Dispatcher may read the base
          (shared GET) — exclusive vs shared operation split on one resource.
        test_recipe:
          setup: ["Base exists (created by OpsAdmin)"]
          setup_api_calls:
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
          trigger:
            - call: "POST /bases"
              payload: { name: "H2", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "GET /bases/${base_id}"
              as: Dispatcher
              captures: { read_ok: $.data.id }
          assert:
            - "trigger capture err == ERR_UNAUTHORIZED_ROLE (Dispatcher lacks the exclusive POST /bases)"
            - "trigger capture read_ok == ${base_id} (shared GET allowed for Dispatcher)"

      - name: booking_agent_cannot_create_flights
        claim_type: role_denied
        grounds:
          - roles.BookingAgent
          - roles.Dispatcher
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: |
          Flight scheduling is Dispatcher-exclusive: a BookingAgent with a
          perfectly valid flight payload is denied 403 before any gate runs.
        test_recipe:
          setup: ["Base, route, aircraft, pilot all exist"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: BookingAgent
              captures: { err: $.data.error_id }
          assert:
            - "trigger capture err == ERR_UNAUTHORIZED_ROLE (403; role check priority 3 precedes all business gates)"
            - "GET /flights?base_id=${base_id} shows zero flights (denied create persisted nothing)"

      - name: complaint_endpoints_role_restricted
        claim_type: role_denied
        grounds:
          - roles.CommunityReporter
          - roles.ComplianceOfficer
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: |
          The complaint workflow splits roles both ways: the CommunityReporter
          who filed a complaint cannot REVIEW it (ComplianceOfficer-exclusive),
          and the ComplianceOfficer cannot file one (CommunityReporter-exclusive).
        test_recipe:
          setup: ["Base; complaint C1 filed by a CommunityReporter"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /complaints"
              payload: { base_id: "${base_id}", zone: "VILLAGE", observed_at: "2026-08-02T10:00:00Z", description: "noise", reporter_ref: "r1" }
              as: CommunityReporter
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /complaints/${c1}/events"
              payload: { event_type: "REVIEW" }
              as: CommunityReporter
              captures: { err1: $.data.error_id }
            - call: "POST /complaints"
              payload: { base_id: "${base_id}", zone: "RIM", observed_at: "2026-08-02T11:00:00Z", description: "more noise", reporter_ref: "r9" }
              as: ComplianceOfficer
              captures: { err2: $.data.error_id }
            - call: "POST /complaints/${c1}/events"
              payload: { event_type: "REVIEW" }
              as: ComplianceOfficer
              captures: { st: $.data.status }
          assert:
            - "trigger capture err1 == ERR_UNAUTHORIZED_ROLE (filer cannot transition own complaint)"
            - "trigger capture err2 == ERR_UNAUTHORIZED_ROLE (officer cannot file complaints)"
            - "trigger capture st == UNDER_REVIEW (correct role succeeds)"

      - name: opsadmin_cannot_file_complaints
        claim_type: role_denied
        grounds:
          - roles.OpsAdmin
          - roles.CommunityReporter
          - errors[ERR_UNAUTHORIZED_ROLE]
        distinguishing_aspect: |
          Even the configuration superuser is off the complaint surface:
          OpsAdmin POST /complaints is denied 403 — exclusive_operations are
          narrowly scoped, not hierarchical.
        test_recipe:
          setup: ["Base exists"]
          setup_api_calls:
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
          trigger:
            - call: "POST /complaints"
              payload: { base_id: "${base_id}", zone: "AIRPORT", observed_at: "2026-08-02T10:00:00Z", description: "noise", reporter_ref: "r1" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger capture err == ERR_UNAUTHORIZED_ROLE (POST /complaints is CommunityReporter-only)"

      - name: pilot_duty_days_scoped_to_self
        claim_type: role_denied
        grounds:
          - roles.Pilot
          - validations[priority=3]
          - errors[ERR_UNAUTHORIZED_ROLE]
          - entities.DutyDay.fields.pilot_id
        distinguishing_aspect: |
          The entity-backed Pilot identity scopes duty-day reads: P1 querying
          pilot_id=${p1} succeeds, while P1 querying ${p2}'s ledger (or reading
          its row by id) is denied 403 ERR_UNAUTHORIZED_ROLE.
        test_recipe:
          setup: ["Pilots P1, P2; F1 assigned to P1 dep 2026-08-03T14:00:00Z (upserts P1's DutyDay for 2026-08-03)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { p1: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat Two", certificate_no: "C2" }
              as: OpsAdmin
              captures: { p2: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${p1}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { f1: $.data.id }
            - call: "GET /duty-days?pilot_id=${p1}&duty_date=2026-08-03"
              as: Dispatcher
              captures: { dd1: "$.data[0].id" }
          trigger:
            - call: "GET /duty-days?pilot_id=${p1}"
              as: Pilot
              as_user_id: "${p1}"
              captures: { own_rows: "$.data[0].pilot_id" }
            - call: "GET /duty-days?pilot_id=${p2}"
              as: Pilot
              as_user_id: "${p1}"
              captures: { err1: $.data.error_id }
            - call: "GET /duty-days/${dd1}"
              as: Pilot
              as_user_id: "${p2}"
              captures: { err2: $.data.error_id }
          assert:
            - "trigger capture own_rows == ${p1} (Pilot reads own ledger)"
            - "trigger capture err1 == ERR_UNAUTHORIZED_ROLE (filtered list scoped to another pilot_id)"
            - "trigger capture err2 == ERR_UNAUTHORIZED_ROLE (direct row read of another pilot's DutyDay)"

      - name: dispatch_segregation_of_duties
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=17]
          - errors[ERR_SEGREGATION_OF_DUTY]
          - entities.Flight.fields.created_by_user_id
          - entities.Flight.fields.dispatched_by_user_id
        distinguishing_aspect: |
          Segregation of duties is tracked by X-User-ID: the dispatcher who
          created the flight (disp-1) cannot dispatch it (403
          ERR_SEGREGATION_OF_DUTY), while a different dispatcher (disp-2) can —
          and dispatched_by_user_id records who did.
        test_recipe:
          setup: ["Flight created by disp-1, carried to MANIFEST_CLOSED (empty manifest), pilot acked; clock at departure 2026-08-03T14:00:00Z"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { flight_id: $.data.id }
            - { call: "POST /flights/${flight_id}/events", payload: { event_type: "OPEN_BOARDING" }, as: Dispatcher, as_user_id: "disp-1" }
            - call: "GET /flights/${flight_id}"
              as: Dispatcher
              captures: { f_ver: $.data.version }
            - { call: "POST /flights/${flight_id}/close-manifest", payload: { expected_flight_version: "${f_ver}" }, as: Dispatcher, as_user_id: "disp-1" }
            - { call: "POST /flights/${flight_id}/events", payload: { event_type: "PILOT_ACK" }, as: Pilot, as_user_id: "${pilot_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OpsAdmin }
          trigger:
            - call: "POST /flights/${flight_id}/events"
              payload: { event_type: "DISPATCH" }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { err: $.data.error_id }
            - call: "POST /flights/${flight_id}/events"
              payload: { event_type: "DISPATCH" }
              as: Dispatcher
              as_user_id: "disp-2"
              captures: { st: $.data.status, disp_by: $.data.dispatched_by_user_id }
          assert:
            - "trigger capture err == ERR_SEGREGATION_OF_DUTY (disp-1 created the flight; 403 at priority 17)"
            - "trigger capture st == DISPATCHED and disp_by == disp-2 (different dispatcher succeeds and is recorded)"

  # ===========================================================================
  # Section 8 — Cross-Cutting Complexity Layers
  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_flight_assignment_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[flight-assignment-stale-version]
          - validations[priority=5]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          OCC on Flight.version via PATCH /flights/{id}/assignment: the first
          patch carrying the observed version succeeds and bumps version 1 -> 2;
          replaying a second patch with the original (now stale) version fails
          412 ERR_STALE_VERSION and changes nothing.
        test_recipe:
          setup: ["Pilots P1, P2; aircraft A1, A2; flight F (P1, A1) dep 2026-08-03T14:00:00Z; version 1 captured at creation"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { a1: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N2", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { a2: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { p1: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat Two", certificate_no: "C2" }
              as: OpsAdmin
              captures: { p2: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${a1}", pilot_id: "${p1}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { f1: $.data.id, f_v: $.data.version }
          trigger:
            - call: "PATCH /flights/${f1}/assignment"
              payload: { expected_flight_version: "${f_v}", pilot_id: "${p2}" }
              as: Dispatcher
              captures: { ok_pilot: $.data.pilot_id, ok_ver: $.data.version }
            - call: "PATCH /flights/${f1}/assignment"
              payload: { expected_flight_version: "${f_v}", aircraft_id: "${a2}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "GET /flights/${f1}"
              as: Dispatcher
              captures: { final_ac: $.data.aircraft_id, final_ver: $.data.version }
          assert:
            - "trigger capture ok_pilot == ${p2} and ok_ver == ${f_v} + 1 (correct version accepted, version incremented)"
            - "trigger capture err == ERR_STALE_VERSION (replayed pre-mutation version rejected, 412)"
            - "trigger capture final_ac == ${a1} and final_ver == ${f_v} + 1 (stale write applied nothing)"

      - name: occ_close_manifest_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[manifest-close-stale-version]
          - validations[priority=5]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          OCC on Flight.version via POST /flights/{id}/close-manifest: closing
          with expected_flight_version one behind the current version fails 412
          with the flight still BOARDING; closing with the exact version
          succeeds and increments the version.
        test_recipe:
          setup: ["Flight dep 2026-08-03T14:00:00Z in BOARDING (zero passengers); current version captured after OPEN_BOARDING"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-03T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - { call: "POST /flights/${flight_id}/events", payload: { event_type: "OPEN_BOARDING" }, as: Dispatcher }
            - call: "GET /flights/${flight_id}"
              as: Dispatcher
              captures: { f_v: $.data.version }
          trigger:
            - call: "POST /flights/${flight_id}/close-manifest"
              payload: { expected_flight_version: "${f_v} - 1" }
              as: Dispatcher
              captures: { err: $.data.error_id }
            - call: "POST /flights/${flight_id}/close-manifest"
              payload: { expected_flight_version: "${f_v}" }
              as: Dispatcher
              captures: { st: $.data.status, ver: $.data.version, fuel: $.data.manifested_fuel_lb }
          assert:
            - "trigger capture err == ERR_STALE_VERSION (one-behind version, 412)"
            - "trigger capture st == MANIFEST_CLOSED and ver == ${f_v} + 1 (exact version closes and bumps)"
            - "trigger capture fuel == 300 (empty manifest: budget 1100 >= fuel_required 300)"

      - name: occ_booking_move_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[booking-move-stale-version]
          - validations[priority=5]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          OCC on Booking.version via POST /bookings/{id}/move: after confirm
          bumped the version to 2, a move carrying version 1 fails 412; the
          retry with the fresh version succeeds (equal-price target -> zero
          delta, no additional card) and bumps to 3.
        test_recipe:
          setup: ["F1 dep Wednesday 2026-08-05T14:00, F2 dep Thursday 2026-08-06T14:00 (same route, no season -> identical 25000 quote); B1 on F1 CONFIRMED paid 25000"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-05T14:00:00Z" }
              as: Dispatcher
              captures: { f1: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-06T14:00:00Z" }
              as: Dispatcher
              captures: { f2: $.data.id }
            - call: "POST /bookings"
              payload: { flight_id: "${f1}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 150 } ] }
              as: BookingAgent
              captures: { b1: $.data.id, b_v: $.data.version }
            - { call: "POST /bookings/${b1}/confirm", payload: { card_amount_cents: 25000 }, as: BookingAgent }
          trigger:
            - call: "POST /bookings/${b1}/move"
              payload: { new_flight_id: "${f2}", expected_booking_version: "${b_v}" }
              as: BookingAgent
              captures: { err: $.data.error_id }
            - call: "POST /bookings/${b1}/move"
              payload: { new_flight_id: "${f2}", expected_booking_version: "${b_v} + 1" }
              as: BookingAgent
              captures: { st: $.data.status, new_flight: $.data.flight_id, ver: $.data.version, total: $.data.quoted_total_cents, paid: $.data.paid_cents }
          assert:
            - "trigger capture err == ERR_STALE_VERSION (b_v was captured at creation; confirm advanced it — stale)"
            - "trigger capture st == CONFIRMED and new_flight == ${f2} and ver == ${b_v} + 2"
            - "trigger capture total == 25000 and paid == 25000 (delta 0 -> no additional_card_cents required, no refund)"

      - name: occ_base_config_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[base-config-stale-version]
          - validations[priority=5]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: |
          OCC on Base.version via PATCH /bases/{id}: the first config update
          with the observed version applies and bumps to 2; a replayed update
          with the stale version fails 412 leaving hold_expire_minutes at 45.
        test_recipe:
          setup: ["Base created (version 1 captured)"]
          setup_api_calls:
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id, b_v: $.data.version }
          trigger:
            - call: "PATCH /bases/${base_id}"
              payload: { expected_base_version: "${b_v}", hold_expire_minutes: 45 }
              as: OpsAdmin
              captures: { ok_hold: $.data.hold_expire_minutes, ok_ver: $.data.version }
            - call: "PATCH /bases/${base_id}"
              payload: { expected_base_version: "${b_v}", hold_expire_minutes: 50 }
              as: OpsAdmin
              captures: { err: $.data.error_id }
            - call: "GET /bases/${base_id}"
              as: OpsAdmin
              captures: { final_hold: $.data.hold_expire_minutes, final_ver: $.data.version }
          assert:
            - "trigger capture ok_hold == 45 and ok_ver == ${b_v} + 1"
            - "trigger capture err == ERR_STALE_VERSION (412 on the replayed stale version)"
            - "trigger capture final_hold == 45 and final_ver == ${b_v} + 1 (second update never applied)"

      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "transitive_cascade / complaint_quota_route_suspension_cascade"
          rationale: "N-level cascade verification (complaint -> route -> flight -> booking -> credit) plus the weather cascade are asserted end-to-end by the two §1.8 transitive_cascade instances; §1.9 adds the aircraft-ground cascade in state_machines.aircraft_ground_cascade_cancels_boarding_flight."

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "dual_variant_calc / manifest_provisional_estimate_vs_final_actual"
          rationale: "Both declared dual-variant pairs (manifest W&B, pilot duty) with their divergent outputs are asserted by the two §1.8 dual_variant_calc instances."

      - name: layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: "boundary_precision_check / duty_limit_exact_boundary_allows_and_exceeds_rejects"
          rationale: "Threshold-at-boundary behavior is pinned by §1.8 (480-minute flight gate, exact seat fill); §1.9 adds the remaining rate/threshold surfaces (load tiers, 840 span, refund tiers, complaint window) as calculations-section instances."

  # ===========================================================================
  # Section 9 — Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutation_result_visible_in_same_response
        claim_type: immediate
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - entities.Booking.fields.refunded_card_cents
          - entities.Booking.fields.status
        distinguishing_aspect: |
          Consistency is immediate: the CANCEL response body itself carries the
          new status and the full settlement (refunded_card_cents 25000,
          retained 0, credited 0) — no re-read is needed to observe the
          mutation or its side effects.
        test_recipe:
          setup: ["Booking 1 pax quote 25000 CONFIRMED on flight dep 2026-08-05T14:00:00Z; clock 2026-08-03T00:00:00Z (>= 1440 min before departure -> full refund tier)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: OpsAdmin }
            - call: "POST /bases"
              payload: { name: "GCN", quiet_hours_start_min_utc: 60, quiet_hours_end_min_utc: 780, current_waiver_version: "WAV-1" }
              as: OpsAdmin
              captures: { base_id: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R1", tier: "SHORT", duration_minutes: 25, base_seat_price_cents: 25000, fuel_required_lb: 300, min_altitude_ft: 500, noise_sensitive: false, noise_zones: [], min_aircraft_noise_class: "ANY" }
              as: OpsAdmin
              captures: { route_id: $.data.id }
            - call: "POST /aircraft"
              payload: { tail_number: "N1", seat_capacity: 4, empty_weight_lb: 1500, empty_moment_lb_in: 82500, max_takeoff_weight_lb: 2600, fuel_arm_inches: 60, seat_arms_inches: [40, 40, 80, 80], cg_forward_limit_in: 52, cg_aft_limit_in: 57, noise_class: "QUIET" }
              as: OpsAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /pilots"
              payload: { display_name: "Pat One", certificate_no: "C1" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /flights"
              payload: { base_id: "${base_id}", route_id: "${route_id}", aircraft_id: "${ac_id}", pilot_id: "${pilot_id}", scheduled_departure_utc: "2026-08-05T14:00:00Z" }
              as: Dispatcher
              captures: { flight_id: $.data.id }
            - call: "POST /bookings"
              payload: { flight_id: "${flight_id}", contact_name: "A", contact_email: "a@x.com", passengers: [ { full_name: "P0", declared_weight_lb: 150 } ] }
              as: BookingAgent
              captures: { booking_id: $.data.id }
            - { call: "POST /bookings/${booking_id}/confirm", payload: { card_amount_cents: 25000 }, as: BookingAgent }
          trigger:
            - call: "POST /bookings/${booking_id}/events"
              payload: { event_type: "CANCEL" }
              as: BookingAgent
              captures: { st: $.data.status, refunded: $.data.refunded_card_cents, fee: $.data.retained_fee_cents, credited: $.data.credited_cents }
          assert:
            - "trigger captures from the CANCEL response itself: st == CANCELLED, refunded == 25000, fee == 0, credited == 0"
            - "the seat release is visible without delay: a subsequent GET /flights/${flight_id} shows seats_booked == 0 (same logical instant, no reconciliation lag)"

  # ===========================================================================
  # Section 6 — Errors (Table 6: every catalog error is triggerable)
  # Stubs below cite the §1.8 instance that already triggers the error; all
  # other catalog errors are triggered by §1.9 instances in the sections above.
  # ===========================================================================
  - section: errors
    instances:
      - name: error_pilot_flight_time_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_PILOT_FLIGHT_TIME_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / duty_limit_exact_boundary_allows_and_exceeds_rejects"
          rationale: "Triggered by the third POST /flights in the named §1.8 instance (480 + 240 > 480)."

      - name: error_season_overlap
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEASON_OVERLAP]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / season_half_open_adjacency_and_end_exclusive_pricing"
          rationale: "Triggered by the S3 create colliding with S1 in the named §1.8 instance."

      - name: error_seat_capacity_exceeded
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEAT_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / seat_capacity_exact_fill_then_overflow"
          rationale: "Triggered by the fifth-seat booking in the named §1.8 instance."

      - name: error_route_suspended
        claim_type: violation_to_error
        grounds: ["errors[ERR_ROUTE_SUSPENDED]"]
        excluded_because:
          difficulty_instance: "transitive_cascade / complaint_quota_route_suspension_cascade"
          rationale: "Triggered by scheduling on the auto-suspended route in the named §1.8 instance's final call."

      - name: error_invalid_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / confirm_state_beats_payment_mismatch"
          rationale: "Triggered as the winning error of the named §1.8 priority instance; additionally exercised by §1.9 terminal-lockdown and invalid-transition instances."

      - name: error_weather_hold_active
        claim_type: violation_to_error
        grounds: ["errors[ERR_WEATHER_HOLD_ACTIVE]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / dispatch_gated_by_base_weather_posture"
          rationale: "Triggered by the DISPATCH under WEATHER_HOLD in the named §1.8 instance; §1.9 adds the OPEN_BOARDING leg in validations.open_boarding_blocked_during_weather_hold."

      - name: error_aircraft_turn_conflict
