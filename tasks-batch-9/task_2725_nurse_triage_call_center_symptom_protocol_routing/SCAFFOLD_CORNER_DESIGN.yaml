  # ==========================================================================
  - section: consistency_model
    instances:

      - name: completion_ledger_is_readable_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.call_advice_fee
          - calculations.practice_after_hours_invoice
          - endpoints[POST /triage-calls/{id}/complete]
        distinguishing_aspect: "The declared consistency model is immediate, so there is no lag to tolerate: the completion response itself already carries billable_minutes 15 and advice_fee_cents 63, and the very next invoice read shows advice_subtotal_cents 63 and billed_advice_minutes_total 15 with a 0% credit tier — no second read, no retry and no recomputation trigger is needed to make the denormalised practice ledger agree."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; acuity 70 ED_NOW call handled by nurse_a. handle_minutes 12 -> billable ceil(12/5)*5 = 15 -> fee round_half_up(15 * 4225 / 1000) = 63 cents, which sits in the 0% credit tier (<= 99)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, audit_period_start_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
            - call: "POST /nurses"
              payload: { full_name: "Nora Vance", seniority_level: 3, max_concurrent_calls: 2, high_risk_cap: 2 }
              as: PlatformAdmin
              captures: { nurse_a_id: $.data.id }
            - call: "POST /nurses/${nurse_a_id}/licenses"
              payload: { state_code: "CA", license_number: "CA-11111", expires_on: "2027-01-31" }
              as: PlatformAdmin
            - call: "POST /nurses/${nurse_a_id}/shifts"
              payload: { start_utc: "2026-08-03T12:00:00Z", end_utc: "2026-08-03T20:00:00Z" }
              as: PlatformAdmin
            - call: "POST /symptom-protocols"
              payload: { code: "CHEST_PAIN", title: "Chest Pain In Adults", base_severity: 62, min_age_years: 0, max_age_years: 120, pregnancy_sensitive: false, emergency_override: false, min_disposition_level: "HOME_CARE" }
              as: PlatformAdmin
              captures: { protocol_id: $.data.id }
            - call: "POST /practices/${practice_id}/patients"
              payload: { full_name: "Dana Reyes", dob: "1990-03-15", sex: "FEMALE", phone: "+14155550100", mrn: "MRN-0001" }
              as: PlatformAdmin
              captures: { patient_id: $.data.id }
            - call: "POST /triage-calls"
              payload: { practice_id: "${practice_id}", caller_name: "Dana Reyes", caller_phone: "+14155550100", caller_state_code: "CA", caller_relationship: "SELF", reason_text: "chest discomfort" }
              as: IntakeAgent
              captures: { call_id: $.data.id }
            - call: "POST /triage-calls/${call_id}/match-patient"
              payload: { patient_id: "${patient_id}", match_method: "MRN" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "CONFIRMED", red_flag_count: 1, confirmed_pregnancy_status: "NOT_PREGNANT" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { assessment_id: $.data.id }
            - call: "GET /triage-calls/${call_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { call_version: $.data.version }
            - call: "POST /dispositions"
              payload: { call_id: "${call_id}", assessment_id: "${assessment_id}", final_level: "ED_NOW", expected_call_version: "${call_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { disposition_id: $.data.id }
            - call: "GET /practices/${practice_id}/after-hours-invoice"
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              captures: { before_subtotal: $.data.advice_subtotal_cents, before_minutes: $.data.billed_advice_minutes_total, before_total: $.data.invoice_total_cents }
          trigger:
            - call: "POST /triage-calls/${call_id}/complete"
              payload: { handle_minutes: 12 }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { done_status: $.data.status, done_minutes: $.data.billable_minutes, done_fee: $.data.advice_fee_cents, done_handle: $.data.handle_minutes }
            - call: "GET /practices/${practice_id}/after-hours-invoice"
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              captures: { after_subtotal: $.data.advice_subtotal_cents, after_minutes: $.data.billed_advice_minutes_total, after_credit_pct: $.data.coverage_credit_pct, after_total: $.data.invoice_total_cents }
          assert:
            - "${before_subtotal} == 0"
            - "${before_minutes} == 0"
            - "${before_total} == 0"
            - "${done_status} == CLOSED"
            - "${done_handle} == 12"
            - "${done_minutes} == 15"
            - "${done_fee} == 63"
            - "${after_subtotal} == 63"
            - "${after_minutes} == 15"
            - "${after_credit_pct} == 0"
            - "${after_total} == 63"
            - "Practice.${practice_id}.advice_fee_accrued_cents == 63"
            - "Practice.${practice_id}.billed_advice_minutes_total == 15"
            - "Nurse.${nurse_a_id}.active_call_load == 0"
