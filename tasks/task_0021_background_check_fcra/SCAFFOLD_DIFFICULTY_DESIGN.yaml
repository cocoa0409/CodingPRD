          BackgroundCheckOrder has a compound (aggregate) shape on the BackgroundCheckOrder
          entity: its status is derived from the parallel states of three child Verifications.
          A single child REPORT pushes the parent PENDING -> IN_REVIEW; the third REPORT
          pushes it IN_REVIEW -> COMPLETE. Not a linear A→B→C pipeline on Order alone.
