  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: vehicle_shift_window_overlap_half_open
        grounds:
          - errors.ERR_SHIFT_OVERLAP
        distinguishing_aspect: |
          Resource = CareTeam. Interval semantics = half-open [window_start,
          window_end). Two shifts for the SAME care team overlap iff
          s1 < e2 AND s2 < e1. Back-to-back shifts (e1 == s2) do NOT overlap
          under half-open semantics.
        test_recipe:
          setup:
            - "CareTeam rostered in market; existing VehicleShift [10:00, 18:00)."
          setup_api_calls:
            - call: "POST /dh/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dh/markets"
              payload: { market_code: "DFW-N", display_name: "DFW N", polygon_geojson: "{\"type\":\"Polygon\",\"coordinates\":[[[-97.5,32.5],[-96.5,32.5],[-96.5,33.5],[-97.5,33.5],[-97.5,32.5]]]}", response_window_minutes_urgent: 60, response_window_minutes_standard: 240 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /dh/care-teams"
              payload: { market_id: "${mkt_id}", app_user_id: "app-N", tech_user_id: "tech-N", supervising_physician_user_id: "md-N", skill_tags: ["POCT"] }
              as: Dispatcher
              captures: { team_id: $.data.id }
            - call: "POST /dh/vehicle-shifts"
              payload: { care_team_id: "${team_id}", market_id: "${mkt_id}", vehicle_plate: "TX-N1", window_start: "2026-09-15T10:00:00Z", window_end: "2026-09-15T18:00:00Z" }
              as: Dispatcher
              captures: { shift_1: $.data.id }
          trigger:
            - call: "POST /dh/vehicle-shifts"
              payload: { care_team_id: "${team_id}", market_id: "${mkt_id}", vehicle_plate: "TX-N2", window_start: "2026-09-15T18:00:00Z", window_end: "2026-09-15T23:00:00Z" }
              as: Dispatcher
              captures: { shift_2: $.data.id }
            - call: "POST /dh/vehicle-shifts"
              payload: { care_team_id: "${team_id}", market_id: "${mkt_id}", vehicle_plate: "TX-N3", window_start: "2026-09-15T17:59:59Z", window_end: "2026-09-15T23:00:00Z" }
              as: Dispatcher
              captures: { error_id: $.data.error_id }
          assert:
            - "VehicleShift ${shift_2} created (back-to-back [18:00,23:00) does NOT overlap [10:00,18:00) under half-open semantics)"
            - "VehicleShift ${shift_1}.status == SCHEDULED"
            - "VehicleShift ${shift_2}.status == SCHEDULED"
            - "Third call returns ERR_SHIFT_OVERLAP (HTTP 409) because 17:59:59 < 18:00"

      - name: market_response_window_payer_contract_temporal_membership
        grounds:
          - entities.PayerContract.fields.effective_from
          - entities.PayerContract.fields.effective_to
          - errors.ERR_CONTRACT_NOT_IN_FORCE
          - calculations.claim_cap_check
        distinguishing_aspect: |
          Different interval semantics from shift overlap: this is a
          point-in-interval membership test (encounter.ended_at must satisfy
          effective_from <= ended_at < effective_to) on the PayerContract
