          assert:
            - "before the triggers MaintenanceTask.${mt}.status == SCHEDULED"
            - "trigger 1 returns HTTP status 200 with data.current_utc == \"2026-08-09T00:00:00Z\""
            - "after trigger 2 MaintenanceTask.${mt}.status == OVERDUE"
            - "after trigger 2 MaintenanceTask.${mt}.breach_kind == DATE"
            - "after trigger 2 Outlet.${o}.overdue_task_count == 1"
            - "after trigger 2 Outlet.${o}.service_posture == RESTRICTED"

      - name: service_hold_release_allowed_once_the_sanitation_task_is_completed
        claim_type: conditional_action
        grounds:
          - endpoints[POST /fountain-network/dispenser-units/{id}/service-hold]
          - validations[priority 15 ERR_SANITATION_OVERDUE]
        distinguishing_aspect: "The release gate looks only for SANITATION tasks still in OVERDUE, so completing the overdue sanitation task first turns the same RELEASE call from refused into a success that returns the unit to IN_SERVICE."
        test_recipe:
          setup:
            - "One unit on SERVICE_HOLD whose SANITATION task is OVERDUE; the task is then completed by tech-1."
