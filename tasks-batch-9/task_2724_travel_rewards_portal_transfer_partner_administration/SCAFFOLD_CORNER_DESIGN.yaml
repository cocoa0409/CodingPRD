            - call: "POST /rewards/inventory-offers"
              payload: { agency_partner_id: "${ag_id}", itinerary_code: "LAX-SYD-34", depart_at: "2026-11-12T22:00:00Z", return_at: "2026-11-26T06:00:00Z", net_rate_cents: 60000, agency_public_price_cents: 80000, agency_public_seats: 4, portal_seats: 2, tax_cents: 5000 }
              as: AgencySupplier
