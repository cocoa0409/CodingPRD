          - state_machines.Developer.transitions.ELIGIBLE_to_SUSPENDED
          - state_machines.SyndicationFund.transitions.OPEN_to_FROZEN
          - calculations.sponsor_eligibility
          - calculations.fund_posture
        distinguishing_aspect: "Three dependent hops rather than a fan-out: resolving a review on the second project mutates that Project to DISTRESSED; the resulting pair of distressed projects is what re-derives the Developer to SUSPENDED; and the two distressed projects are what drive the fund's posture all the way to FROZEN."
