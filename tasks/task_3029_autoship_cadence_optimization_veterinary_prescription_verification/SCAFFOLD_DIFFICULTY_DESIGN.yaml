          assert:
            - "the conserved quantity is PharmacySite.cold_pack_committed_units at ${site_j1}, which read ${site_j1_before} == 0 before the trigger"
            - "the forward action commits exactly the shipment's reservation: cold_pack_committed_units == 56, matching Shipment.${ship_j1}.cold_pack_units and ColdPackReservation.units"
            - "the compensating action returns it to the pre-action value: after POST /v1/orders/${order_j1}/cancel, PharmacySite.${site_j1}.cold_pack_committed_units == ${site_j1_before} == 0"
            - "the invariant holds exactly: committed_units_after_cancel == committed_units_before_ship, with no residual value"
            - "the released reservation is terminal: ColdPackReservation for Shipment.${ship_j1} reads reservation_status RELEASED"
            - "a cascade that ran end to end but left cold_pack_committed_units at 56 would fail this invariant, and the site could then never be closed under the cold_pack_committed_units == 0 precondition"

