scaffold_corner_design:

  # =========================================================================
  # Section 1 — Entities (§1.1)
  # =========================================================================
  - section: entities
    instances:
      - name: terminal_creation_returns_common_fields_and_declared_defaults
        claim_type: Creation
        grounds:
          - entities.Terminal
          - endpoints[POST /ltl/terminals]
          - entities.Terminal.fields.calibration_interval_captures
        distinguishing_aspect: "A terminal created with only code and name is born CALIBRATED with calibration_interval_captures 250, captures_since_calibration 0, last_capture_at null, version 1, and created_at stamped from the default logical clock 2026-08-01T00:00:00.000Z (no clock call in the chain)."
        test_recipe:
          setup:
            - "Empty database; the logical clock has never been set, so it reads its declared default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /ltl/terminals"
              payload: { code: "TRM1", name: "Chicago Dock" }
              as: PricingAnalyst
              captures: { trm1: "$.data.id" }
          assert:
            - "trigger returns 201 with response_type object and meta.api_request_id present"
            - "Terminal.${trm1}.code == TRM1"
            - "Terminal.${trm1}.calibration_interval_captures == 250"
            - "Terminal.${trm1}.captures_since_calibration == 0"
            - "Terminal.${trm1}.dimensioner_status == CALIBRATED"
            - "Terminal.${trm1}.last_capture_at == null"
            - "Terminal.${trm1}.version == 1"
            - "Terminal.${trm1}.created_at == 2026-08-01T00:00:00.000Z"
            - "Terminal.${trm1}.id is a bare UUID with no type prefix"

      - name: customer_creation_applies_declared_field_defaults
        claim_type: Defaults
        grounds:
          - entities.Customer
          - entities.Customer.fields.education_strike_interval
          - entities.Customer.fields.dispute_window_days
          - endpoints[POST /ltl/customers]
        distinguishing_aspect: "Omitting education_strike_interval yields 3 and education_threshold_strikes 3; the customer starts OPEN / NONE with both liability indices 0.00, offender_tier TIER_0, dispute_window_days 30, offender_strike_count 0 and active_program_type null."
        test_recipe:
          setup:
            - "Logical clock set to 2026-08-01T00:00:00Z; empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PricingAnalyst
          trigger:
            - call: "POST /ltl/customers"
              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v: "$.data.version" }
          assert:
            - "Customer.${cust1}.education_strike_interval == 3"
            - "Customer.${cust1}.education_threshold_strikes == 3"
            - "Customer.${cust1}.education_status == NONE"
            - "Customer.${cust1}.education_required_at == null"
            - "Customer.${cust1}.billing_posture == OPEN"
            - "Customer.${cust1}.offender_strike_count == 0"
            - "Customer.${cust1}.liability_index_rolling == 0.00"
            - "Customer.${cust1}.liability_index_lifetime == 0.00"
            - "Customer.${cust1}.offender_tier == TIER_0"
            - "Customer.${cust1}.dispute_window_days == 30"
            - "Customer.${cust1}.active_program_type == null"
            - "Customer.${cust1}.version == 1"

      - name: shipment_retrieval_returns_stored_and_snapshotted_fields
        claim_type: Retrieval
        grounds:
          - endpoints[GET /ltl/shipments/{id}]
          - entities.Shipment.fields.rate_program_id
          - entities.Shipment.fields.tariff_version_id
          - entities.Shipment.fields.line_count
        distinguishing_aspect: "GET /ltl/shipments/{id} echoes the tendered fields and the two snapshots taken at creation (rate_program_id = the ACTIVE program, tariff_version_id = the PUBLISHED standard effective at pickup_at) together with line_count 1, declared_total_weight_lb 400 and the pre-billing zeros."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; terminal TRM1; customer ACME with an ACTIVE CLASS_BASED program on published NMFC-2026A; shipment PROE001 with one 400 lb class 70 line (4 pieces 48.0x40.0x48.0), not yet billed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/terminals"
              payload: { code: "TRM1", name: "Chicago Dock" }
              as: PricingAnalyst
              captures: { trm1: "$.data.id" }
            - call: "POST /ltl/customers"
              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v: "$.data.version" }
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id" }
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "156600", description: "Machine parts, boxed", classification_basis: "DENSITY_BASED" }
              as: PricingAnalyst
              captures: { cp1: "$.data.id" }
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs"
              payload: { customer_id: "${cust1}", program_type: "CLASS_BASED", base_rate_per_cwt_cents: 4200, discount_pct: 0.35, min_charge_cents: 12500 }
              as: PricingAnalyst
              captures: { rp1: "$.data.id" }
            - call: "POST /ltl/rate-programs/${rp1}/approve"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs/${rp1}/activate"
              payload: { expected_customer_version: "${cust1_v}" }
              as: PricingAnalyst
            - call: "POST /ltl/shipments"
              payload: { customer_id: "${cust1}", origin_terminal_id: "${trm1}", pro_number: "PROE001", pickup_at: "2026-01-10T08:00:00Z", bol_declared_total_weight_lb: 400 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { sh1: "$.data.id" }
            - call: "POST /ltl/shipments/${sh1}/lines"
              payload: { line_no: 1, commodity_profile_id: "${cp1}", declared_class_code: 70, declared_weight_lb: 400, pieces: 4, declared_length_in: 48.0, declared_width_in: 40.0, declared_height_in: 48.0 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { ln1: "$.data.id" }
          trigger:
            - call: "GET /ltl/shipments/${sh1}"
              payload: {}
              as: PricingAnalyst
              captures: { sh1_echo: "$.data.id" }
          assert:
            - "Shipment.${sh1}.pro_number == PROE001"
            - "Shipment.${sh1}.rate_program_id == ${rp1}"
            - "Shipment.${sh1}.tariff_version_id == ${tv1}"
            - "Shipment.${sh1}.customer_id == ${cust1}"
            - "Shipment.${sh1}.origin_terminal_id == ${trm1}"
            - "Shipment.${sh1}.line_count == 1"
            - "Shipment.${sh1}.declared_total_weight_lb == 400"
            - "Shipment.${sh1}.class_status == DECLARED"
            - "Shipment.${sh1}.billing_status == UNBILLED"
            - "Shipment.${sh1}.original_charge_cents == 0"
            - "Shipment.${sh1}.assessed_total_cents == 0"
            - "Shipment.${sh1}.billed_at == null"
            - "Shipment.${sh1}.measured_total_weight_lb == null"
            - "ShipmentLine.${ln1}.declared_cubic_ft == 213.33"
            - "ShipmentLine.${ln1}.declared_density_pcf == 1.88"
            - "ShipmentLine.${ln1}.effective_class_code == 70"

      - name: shipment_line_listing_paginates_with_declared_envelope
        claim_type: Listing
        grounds:
          - endpoints[GET /ltl/shipment-lines]
          - response_envelope.pagination_defaults
          - response_envelope.pagination_fields
        distinguishing_aspect: "With 12 lines on one shipment the default page returns 10 rows with total_count 12 and has_more true, while limit=10&offset=10 returns the remaining 2 rows with has_more false — proving total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; customer ACME with an ACTIVE CLASS_BASED program on published NMFC-2026A; shipment PROE002 carrying 12 lines (line_no 1..12), each 100 lb declared class 100, 1 piece 40.0x40.0x40.0. The setup chain below shows line_no 1 and line_no 12; line_no 2..11 are created by the same call with the same body and an incrementing line_no."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/terminals"
              payload: { code: "TRM1", name: "Chicago Dock" }
              as: PricingAnalyst
              captures: { trm1: "$.data.id" }
            - call: "POST /ltl/customers"
              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v: "$.data.version" }
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id" }
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "156600", description: "Machine parts, boxed", classification_basis: "DENSITY_BASED" }
              as: PricingAnalyst
              captures: { cp1: "$.data.id" }
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs"
              payload: { customer_id: "${cust1}", program_type: "CLASS_BASED", base_rate_per_cwt_cents: 4200, discount_pct: 0.35, min_charge_cents: 12500 }
              as: PricingAnalyst
              captures: { rp1: "$.data.id" }
            - call: "POST /ltl/rate-programs/${rp1}/approve"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs/${rp1}/activate"
              payload: { expected_customer_version: "${cust1_v}" }
              as: PricingAnalyst
            - call: "POST /ltl/shipments"
              payload: { customer_id: "${cust1}", origin_terminal_id: "${trm1}", pro_number: "PROE002", pickup_at: "2026-01-10T08:00:00Z", bol_declared_total_weight_lb: 1200 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { sh1: "$.data.id" }
            - call: "POST /ltl/shipments/${sh1}/lines"
              payload: { line_no: 1, commodity_profile_id: "${cp1}", declared_class_code: 100, declared_weight_lb: 100, pieces: 1, declared_length_in: 40.0, declared_width_in: 40.0, declared_height_in: 40.0 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { ln1: "$.data.id" }
            - call: "POST /ltl/shipments/${sh1}/lines"
              payload: { line_no: 12, commodity_profile_id: "${cp1}", declared_class_code: 100, declared_weight_lb: 100, pieces: 1, declared_length_in: 40.0, declared_width_in: 40.0, declared_height_in: 40.0 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { ln12: "$.data.id" }
          trigger:
            - call: "GET /ltl/shipment-lines"
              payload: { shipment_id: "${sh1}" }
              as: PricingAnalyst
              captures: { first_row: "$.data[0].line_no" }
            - call: "GET /ltl/shipment-lines"
              payload: { shipment_id: "${sh1}", limit: 10, offset: 10 }
              as: PricingAnalyst
              captures: { page2_first: "$.data[0].line_no" }
          assert:
            - "trigger[1] returns response_type array with exactly 10 rows (default limit 10, default offset 0)"
            - "trigger[1] total_count == 12 and has_more == true"
            - "trigger[2] returns exactly 2 rows"
            - "trigger[2] total_count == 12 and has_more == false"
            - "Shipment.${sh1}.line_count == 12"
            - "Shipment.${sh1}.declared_total_weight_lb == 1200"
            - "ShipmentLine.${ln1}.declared_cubic_ft == 37.04"
            - "ShipmentLine.${ln1}.declared_density_pcf == 2.70"
            - "ShipmentLine.${ln1}.effective_class_code == 100"

      - name: capture_event_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.CaptureEvent
          - entities.CreditMemo
          - endpoints[GET /ltl/capture-events/{id}]
        distinguishing_aspect: "CaptureEvent and CreditMemo declare common_fields false: the retrieved row carries id and created_at but no version and no updated_at, and §1.5 declares no update or delete endpoint for either — the terminal's evidence record can never be edited."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; terminal TRM1; customer ACME with an ACTIVE CLASS_BASED program on published NMFC-2026A; shipment PROE003 (one 400 lb class 70 line, 4 pieces 48.0x40.0x48.0) billed, then captured at 520 lb."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/terminals"
              payload: { code: "TRM1", name: "Chicago Dock" }
              as: PricingAnalyst
              captures: { trm1: "$.data.id" }
            - call: "POST /ltl/customers"
              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v: "$.data.version" }
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id" }
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "156600", description: "Machine parts, boxed", classification_basis: "DENSITY_BASED" }
              as: PricingAnalyst
              captures: { cp1: "$.data.id" }
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs"
              payload: { customer_id: "${cust1}", program_type: "CLASS_BASED", base_rate_per_cwt_cents: 4200, discount_pct: 0.35, min_charge_cents: 12500 }
              as: PricingAnalyst
              captures: { rp1: "$.data.id" }
            - call: "POST /ltl/rate-programs/${rp1}/approve"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs/${rp1}/activate"
              payload: { expected_customer_version: "${cust1_v}" }
              as: PricingAnalyst
            - call: "POST /ltl/shipments"
              payload: { customer_id: "${cust1}", origin_terminal_id: "${trm1}", pro_number: "PROE003", pickup_at: "2026-01-10T08:00:00Z", bol_declared_total_weight_lb: 400 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { sh1: "$.data.id" }
            - call: "POST /ltl/shipments/${sh1}/lines"
              payload: { line_no: 1, commodity_profile_id: "${cp1}", declared_class_code: 70, declared_weight_lb: 400, pieces: 4, declared_length_in: 48.0, declared_width_in: 40.0, declared_height_in: 48.0 }
              as: Shipper
              as_user_id: "${cust1}"
            - call: "POST /ltl/shipments/${sh1}/bill"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/capture-events"
              payload: { shipment_id: "${sh1}", device_type: "COMBINED", measured_total_weight_lb: 520, line_measurements: [{line_no: 1, measured_weight_lb: 520, measured_length_in: 48.0, measured_width_in: 40.0, measured_height_in: 48.0}] }
              as: TerminalOperator
              as_user_id: "${trm1}"
              captures: { ce1: "$.data.id" }
          trigger:
            - call: "GET /ltl/capture-events/${ce1}"
              payload: {}
              as: ClassificationAuditor
              as_user_id: "aud-1"
              captures: { ce_echo: "$.data.id" }
          assert:
            - "CaptureEvent.${ce1} response has no version field and no updated_at field"
            - "CaptureEvent.${ce1}.created_at == 2026-01-10T08:00:00.000Z"
            - "CaptureEvent.${ce1}.captured_at == 2026-01-10T08:00:00Z"
            - "CaptureEvent.${ce1}.captured_by_user_id == ${trm1}"
            - "CaptureEvent.${ce1}.terminal_id == ${trm1}"
            - "CaptureEvent.${ce1}.capture_sequence == 1"
            - "no PUT / PATCH / DELETE endpoint for /ltl/capture-events/{id} exists in the endpoint table"
            - "no PUT / PATCH / DELETE endpoint for /ltl/credit-memos/{id} exists in the endpoint table"

      - name: commodity_profile_min_class_floor_is_max_of_three_characteristics
        claim_type: Computed Fields
        grounds:
          - entities.CommodityProfile.fields.min_class_floor
          - calculations.line_class_resolution
          - endpoints[POST /ltl/commodity-profiles]
        distinguishing_aspect: "min_class_floor is the max of the three characteristic floors, not their sum and not the last one supplied: HAZMAT 125 / NON_STACKABLE 92.5 / HIGH 100 yields 125, while STANDARD / STACKABLE / LOW yields 0."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; a DRAFT NMFC-2026A tariff version exists (profiles may be added before publication)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id" }
          trigger:
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "049500", description: "Corrosive liquids, drummed", classification_basis: "DENSITY_BASED", handling_code: "HAZMAT", stowability_code: "NON_STACKABLE", liability_code: "HIGH" }
              as: PricingAnalyst
              captures: { cp_haz: "$.data.id" }
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "156600", description: "Machine parts, boxed", classification_basis: "DENSITY_BASED", handling_code: "STANDARD", stowability_code: "STACKABLE", liability_code: "LOW" }
              as: PricingAnalyst
              captures: { cp_std: "$.data.id" }
          assert:
            - "CommodityProfile.${cp_haz}.min_class_floor == 125"
            - "CommodityProfile.${cp_haz}.fixed_class_code == null"
            - "CommodityProfile.${cp_std}.min_class_floor == 0"
            - "CommodityProfile.${cp_std}.classification_basis == DENSITY_BASED"
            - "TariffVersion.${tv1}.status == DRAFT"

      - name: line_class_floor_overrides_dense_declared_class
        claim_type: Computed Fields
        grounds:
          - entities.ShipmentLine.fields.class_floor_applied
          - entities.ShipmentLine.fields.effective_class_code
          - calculations.line_class_resolution
          - calculations.shipment_charge
        distinguishing_aspect: "A 29.99 pcf line declared class 60 on a HAZMAT profile rates at the 125 floor with class_floor_applied true, so the bill is 91742 rather than the 44036 the declared class alone would produce."
        test_recipe:
          setup:
            - "Logical clock 2026-01-10T08:00:00Z; terminal TRM1; customer ACME with an ACTIVE CLASS_BASED program (4200 c/cwt, 35%, 12500 minimum) on published NMFC-2026A."
            - "Commodity profile CP_HAZ carries handling HAZMAT (floor 125); shipment PROE004 has one line 3055 lb declared class 60, 22 pieces of 20.0x20.0x20.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/terminals"
              payload: { code: "TRM1", name: "Chicago Dock" }
              as: PricingAnalyst
              captures: { trm1: "$.data.id" }
            - call: "POST /ltl/customers"
              payload: { account_code: "ACME", name: "Acme Mfg" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v: "$.data.version" }
            - call: "POST /ltl/tariff-versions"
