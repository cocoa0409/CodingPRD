              captures: { run_1_id: $.data.id }
          assert:
            - "response status is 201 and data.variant == \"PROVISIONAL\" and data.status == \"ACTIVE\""
            - "data.effective_background_lbs_yr == 6000.00 and data.margin_of_safety_lbs_yr == 6000.00"
            - "data.allocable_load_lbs_yr == 48000.00"
            - "data.point_pool_lbs_yr == 27360.00 and data.nonpoint_pool_lbs_yr == 18240.00"
            - "data.wla_total_lbs_yr == 27360.00 and data.la_total_lbs_yr == 18240.00"
            - "data.reserve_allocation_lbs_yr == 2400.00 and data.included_source_count == 4"
            - "data.allocations has length 4 with the two POINT rows first, ordered City WWTP then Village WWTP"
            - "data.allocations entries carry allocated_load_lbs_yr 21888.00, 5472.00, 13680.00, 4560.00 in that order"
            - "6000.00 + 6000.00 + 27360.00 + 18240.00 + 2400.00 == 60000.00 (background + margin of safety + WLA + LA + reserve equals the loading capacity)"
            - "GET /source-assessments/${sa_p1_id} returns data.allocated_load_lbs_yr == 21888.00 and data.allocation_run_id == ${run_1_id}"
            - "GET /source-assessments/${sa_n2_id} returns data.allocated_load_lbs_yr == 4560.00"
            - "GET /tmdl-assessments/${t_id} returns data.allocable_load_lbs_yr == 48000.00 and data.wla_total_lbs_yr == 27360.00"
            - "GET /watersheds/${w_id} returns data.reserve_pool_lbs == 2400.00"

      - name: allocation_run_with_only_excluded_sources_is_rejected
        claim_type: input_set_filtering
        grounds:
          - calculations.wasteload_allocation_run.input_set
          - validations[priority=25]
          - errors[ERR_NO_INCLUDED_SOURCES]
        distinguishing_aspect: "EXCLUDED rows are invisible to the allocation: with two EXCLUDED sources and nothing else the run is refused with ERR_NO_INCLUDED_SOURCES, and once one row is re-inventoried the run allocates the whole point pool to it while the EXCLUDED row still receives nothing."
        test_recipe:
          setup:
            - "Watershed SCR with a compliance-point reach R_OUT."
            - "TMDL-P-2026 is DRAFT with LC 60000.00, MOS 0.1000 and background 6000.00, carrying two EXCLUDED sources only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /watersheds"
              payload: { name: "Scioto Headwaters", state_code: "OH", watershed_code: "SCR", pollutant: "TOTAL_PHOSPHORUS", baseline_year: 2020, baseline_load_lbs_yr: 120000.00, eligible_zone_codes: ["Z1", "Z2"] }
              as: ProgramAdministrator
              captures: { w_id: $.data.id }
            - call: "POST /reaches"
              payload: { watershed_id: "${w_id}", reach_code: "R_OUT", trading_zone_code: "Z2", reach_class: "COMPLIANCE_POINT", delivery_factor: 1.0000 }
              as: TmdlAnalyst
              captures: { r_out_id: $.data.id }
            - call: "POST /tmdl-assessments"
              payload: { watershed_id: "${w_id}", assessment_code: "TMDL-P-2026", loading_capacity_lbs_yr: 60000.00, margin_of_safety_pct: 0.1000, background_load_lbs_yr: 6000.00, period_start_date: "2026-01-01", period_end_date: "2035-12-31" }
              as: TmdlAnalyst
              captures: { t_id: $.data.id, t_ver1: $.data.version }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_out_id}", source_name: "Decommissioned Outfall", source_type: "POINT", existing_load_lbs_yr: 40000.00, controllability_index: 0.9000, status: "EXCLUDED" }
              as: TmdlAnalyst
              captures: { sa_x1_id: $.data.id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_out_id}", source_name: "Retired Feedlot", source_type: "NONPOINT", existing_load_lbs_yr: 10000.00, controllability_index: 0.2000, status: "EXCLUDED" }
              as: TmdlAnalyst
              captures: { sa_x2_id: $.data.id }
          trigger:
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-EMPTY", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver1}" }
              as: TmdlAnalyst
              captures: { err: $.data.error_id }
            - call: "POST /source-assessments"
              payload: { tmdl_assessment_id: "${t_id}", reach_id: "${r_out_id}", source_name: "Village WWTP", source_type: "POINT", existing_load_lbs_yr: 5000.00, controllability_index: 0.5000, status: "INVENTORIED" }
              as: TmdlAnalyst
              captures: { sa_p_id: $.data.id }
            - call: "POST /tmdl-assessments/${t_id}/allocation-runs"
              payload: { run_label: "RUN-1", method: "PRO_RATA_BY_EXISTING_LOAD", expected_tmdl_assessment_version: "${t_ver1}" }
              as: TmdlAnalyst
              captures: { run_1_id: $.data.id }
          assert:
            - "trigger call 1 responds 422 with data.error_id == \"ERR_NO_INCLUDED_SOURCES\""
            - "after trigger call 1, GET /allocation-runs?tmdl_assessment_id=${t_id} returns meta.total_count == 0"
            - "trigger call 3 responds 201 with data.included_source_count == 1"
            - "trigger call 3 data.allocable_load_lbs_yr == 48000.00, data.point_pool_lbs_yr == 27360.00, data.nonpoint_pool_lbs_yr == 18240.00"
            - "trigger call 3 data.wla_total_lbs_yr == 27360.00 (the single INVENTORIED point source takes the whole point pool)"
            - "trigger call 3 data.la_total_lbs_yr == 0.00 and data.reserve_allocation_lbs_yr == 20640.00 (the empty nonpoint pool is absorbed by the reserve)"
            - "trigger call 3 data.allocations has length 1 referencing ${sa_p_id}"
            - "GET /source-assessments/${sa_x1_id} returns data.allocated_load_lbs_yr is null and data.allocation_run_id is null"
            - "GET /source-assessments/${sa_x2_id} returns data.allocated_load_lbs_yr is null"

      - name: allocation_rounds_each_source_before_summing_the_pool_totals
        claim_type: precision
        grounds:
          - calculations.wasteload_allocation_run.precision
          - entities.AllocationRun.fields.wla_total_lbs_yr
        distinguishing_aspect: "Per-source rounding happens before summation, so wla_total_lbs_yr can legitimately differ from point_pool_lbs_yr by a cent and the residue lands in reserve_allocation_lbs_yr."
        excluded_because:
          difficulty_instance: allocation_pool_round_then_sum_not_sum_then_round
          rationale: "That §1.8 instance uses the ALT fixture where round-then-sum yields wla_total 23899.54 against a point pool of 23899.53, pinning both the per-source values and the balancing reserve term."

      - name: allocable_load_at_the_zero_and_negative_boundary
        claim_type: threshold
        grounds:
          - calculations.wasteload_allocation_run
          - validations[priority=27]
          - errors[ERR_ALLOCABLE_LOAD_NEGATIVE]
        distinguishing_aspect: "Exactly 0.00 allocable load is a legal run that allocates 0.00 to every source, while -0.01 is refused — the boundary sits between the two."
        excluded_because:
          difficulty_instance: allocable_load_exactly_zero_accepted_but_one_cent_negative_rejected
          rationale: "That §1.8 instance runs the LC 1000.00 / MOS 0.1000 fixture at background 900.00 and 900.01 and asserts the accepted all-zero run and the 422 rejection one cent later."

      - name: allocation_background_differs_between_the_two_variants
        claim_type: variant_divergence
        grounds:
          - calculations.wasteload_allocation_run.variants
          - entities.AllocationRun.fields.effective_background_lbs_yr
        distinguishing_aspect: "The PROVISIONAL variant trusts the analyst's background estimate while the FINAL variant averages the monitored BACKGROUND-reach samples, so the same sources receive different allocations."
        excluded_because:
          difficulty_instance: allocation_background_variant_provisional_vs_final_divergence
          rationale: "That §1.8 instance runs both variants on identical source data (background 6000.00 versus the monitored 4429.00) and pins each variant's pools, per-source allocations and reserve term."

      - name: allocation_variant_is_selected_from_the_assessment_status_at_run_time
        claim_type: variant_selection
        grounds:
          - calculations.wasteload_allocation_run.variants
          - entities.AllocationRun.fields.variant
          - state_machines.TmdlAssessment.PUBLIC_COMMENT_to_APPROVED
        distinguishing_aspect: "variant is not a client input: it is PROVISIONAL while the assessment is DRAFT / PUBLIC_COMMENT / REVISION and FINAL once it is APPROVED, decided at the moment the run is created."
        excluded_because:
          difficulty_instance: allocation_background_variant_provisional_vs_final_divergence
          rationale: "That §1.8 instance creates the first run before approval and the second after approval on the same assessment, asserting variant PROVISIONAL then FINAL without ever supplying a variant input."

      - name: settled_delivery_reconciles_the_proposed_delta_into_the_permit_ledger
        claim_type: reconciliation
        grounds:
          - calculations.credit_transaction_delivery.variants
          - calculations.permit_compliance_reconciliation
        distinguishing_aspect: "When the variant switches from proposed to settled the delta must flow through the batch buckets, the reserve pool and the permit's credit_applied_lbs without drift."
        excluded_because:
          difficulty_instance: credit_delivery_proposed_vs_settled_variant_divergence
          rationale: "That §1.8 instance proposes at gross 500.00 (delivered 202.50) then settles at verified_ratio 0.7500 (settled gross 375.00, delivered 151.88) and asserts the reconciled batch, reserve-pool and permit figures."

      - name: permit_limit_tier_selection_uses_the_final_limit_and_the_declared_relief_constants
        claim_type: tiered_pricing
        grounds:
          - calculations.permit_effluent_limit_derivation
          - calculations.permit_effluent_limit_derivation.constants
          - entities.Permit.fields.schedule_tier
        distinguishing_aspect: "The tier comes from the reduction measured against the FINAL limit, never against the interim relief it produces, and each tier's relief fraction and year count are applied afterwards."
        excluded_because:
          difficulty_instance: permit_limit_tier_relief_pinned_evaluation_order_across_three_tiers
          rationale: "That §1.8 instance derives three permits landing in TIER_A, TIER_B and TIER_C (reductions 8.80, 27.04, 90.88) and pins each interim limit and compliance_schedule_end_date."

      - name: delivery_path_ratio_is_the_product_of_downstream_delivery_factors
        claim_type: topological
        grounds:
          - calculations.geographic_eligibility_path
          - entities.CreditTransaction.fields.delivery_ratio
          - entities.CreditTransaction.fields.path_reach_count
        distinguishing_aspect: "The generating reach's own delivery_factor is excluded from the product: R_UP -> R_MID yields delivery_ratio 0.9000 and path_reach_count 2, not 0.7200."
        excluded_because:
          difficulty_instance: credit_delivery_proposed_vs_settled_variant_divergence
          rationale: "That §1.8 instance trades from a project on R_UP to a permit on R_MID and asserts delivery_ratio 0.9000 with path_reach_count 2 before applying the ratios."

      - name: adaptive_review_verdict_follows_the_achieved_reduction_threshold
        claim_type: correct_result
        grounds:
          - calculations.watershed_response_evaluation
          - entities.AdaptiveReview.fields.achieved_reduction_pct
          - entities.AdaptiveReview.fields.verdict
        distinguishing_aspect: "achieved_reduction_pct is measured against the watershed baseline load and compared with interim_target_pct, so 108067.63 observed gives 19.89 and OFF_TRACK while 98422.25 gives 35.96 and ON_TRACK."
        excluded_because:
          difficulty_instance: adaptive_review_off_track_cascade_watershed_to_transaction_to_batch_and_permit
          rationale: "That §1.8 instance finalizes a review over a single 108067.63 compliance-point sample and asserts observed_load_lbs_yr, achieved_reduction_pct 19.89 and verdict OFF_TRACK before the cascade."

      - name: adaptive_review_counts_only_accepted_compliance_point_samples_in_window
        claim_type: input_set_filtering
        grounds:
          - calculations.watershed_response_evaluation.input_set
          - entities.AdaptiveReview.fields.sample_count
        distinguishing_aspect: "PROVISIONAL and REJECTED samples, and samples on HEADWATER / MAINSTEM / BACKGROUND reaches, are excluded even when they fall inside the window, so a window full of them evaluates as an empty set."
        excluded_because:
          difficulty_instance: adaptive_review_empty_qualifying_set_yields_indeterminate_not_off_track
          rationale: "That §1.8 instance stocks the window with disqualified samples of every kind and asserts sample_count 0 with verdict INDETERMINATE and null loads rather than OFF_TRACK."

      - name: permit_compliance_gap_is_reported_load_less_the_applicable_limit_and_credits
        claim_type: correct_result
        grounds:
          - calculations.permit_compliance_reconciliation
          - calculations.permit_effluent_limit_derivation
          - endpoints[POST /permits/{permit_id}/annual-report]
        distinguishing_aspect: "The gap is measured against applicable_limit_lbs_yr (the interim limit while a schedule is running), not the final limit: reporting 25000.00 against an interim 23916.00 with zero credits gives a gap of 1084.00 and SHORTFALL, and the floor at zero makes an under-report IN_COMPLIANCE with gap 0.00 rather than a negative number."
