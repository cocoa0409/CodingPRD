  # =========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: fifth_contu_free_fill_clears_while_the_sixth_parks_in_copyright_hold
        grounds:
          - calculations.copyright_rule_of_five_counter
          - entities.CopyrightClearance.fields.sequence_in_year
          - entities.CopyrightClearance.fields.method
          - state_machines.IllRequest.SUBMITTED_to_SOURCING
          - state_machines.IllRequest.SUBMITTED_to_COPYRIGHT_HOLD
        distinguishing_aspect: |
          The metric is the (issn, calendar_year) counted_fill_count against
          COPYRIGHT_LIMIT_FREE_FILLS, probed on POST /ill/requests: at counted_fill_count 4 the fifth
          request still clears with a CONTU_FREE clearance numbered sequence_in_year 5, and at
          counted_fill_count 5 the sixth request creates no clearance at all and parks in
          COPYRIGHT_HOLD — the comparison is strictly-less-than, so five fills are free and the sixth
          is not.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, so current_year is 2026 and the recency window admits publication years 2022 through 2026."
            - "Patron P-8010 with max_open_requests 10 so the request cap cannot fire before the copyright branch."
            - "Partner NORTHU with supplies_electronic true on a COPY rota holding one entry quoted 1500 cents / 2 days."
            - "BibItem ART-1: item_type ARTICLE, issn 1234-5678, journal_title Journal of Applied Optics, publication_year 2024 — inside the recency window, so its fills count."
            - "Four COPY requests already taken in for ART-1, each with pages_requested 12 and delivery_mode ELECTRONIC, producing CONTU_FREE clearances numbered 1 through 4; counted_fill_count for (1234-5678, 2026) is 4."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LibraryAdmin
              as_user_id: "admin-01"
