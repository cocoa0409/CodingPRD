  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: corner_occ_stale_registration_version_rejected_then_supersedes
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[renewal-application-stale-registration]', 'errors[ERR_STALE_REGISTRATION_VERSION]', entities.BrandRegistration.fields.version]
        distinguishing_aspect: "Filing a renewal bumps the record from version 1 to 2, so a second filing still carrying expected_registration_version 1 is refused 412 ERR_STALE_REGISTRATION_VERSION, while the same filing with the refreshed version 2 succeeds and rejects the earlier pending filing as SUPERSEDED_BY_LATER_RENEWAL."
        test_recipe:
          setup: ["Owner A holds recorded brand 'OC' LEFT_RIB CATTLE MT at version 1 and has filed one RENEWAL against it, taking the record to version 2."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "OCC Ranch", mailing_state: "MT", contact_email: "occ@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "OC", position_code: "LEFT_RIB", species_class: "CATTLE", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications/${app_a}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
            - call: "POST /brand-inspection/brand-applications/${app_a}/record"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-02"
              captures: { reg_a: "$.data.id", reg_v1: "$.data.version" }
            - call: "POST /brand-inspection/brand-registrations/${reg_a}/renewal-applications"
              payload: { owner_id: "${own_a}", expected_registration_version: "${reg_v1}" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_r1: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/brand-registrations/${reg_a}/renewal-applications"
              payload: { owner_id: "${own_a}", expected_registration_version: "${reg_v1}" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { err_id: "$.data.error_id" }
            - call: "GET /brand-inspection/brand-registrations/${reg_a}"
              payload: {}
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { reg_v2: "$.data.version" }
            - call: "POST /brand-inspection/brand-registrations/${reg_a}/renewal-applications"
              payload: { owner_id: "${own_a}", expected_registration_version: "${reg_v2}" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_r2: "$.data.id", app_r2_status: "$.data.status" }
          assert:
            - "${reg_v1} == 1"
            - "the first trigger call responds HTTP 412 and ${err_id} == ERR_STALE_REGISTRATION_VERSION"
            - "${reg_v2} == 2"
            - "${app_r2_status} == SUBMITTED"
            - "BrandApplication.${app_r1}.status == REJECTED and BrandApplication.${app_r1}.rejection_reason == SUPERSEDED_BY_LATER_RENEWAL"
            - "BrandRegistration.${reg_a}.version == 3"

      - name: corner_occ_stale_inspector_version_rejected
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[schedule-order-stale-inspector]', 'errors[ERR_STALE_INSPECTOR_VERSION]', 'endpoints[''POST /brand-inspection/inspection-orders/{id}/schedule'']']
        distinguishing_aspect: "Scheduling bumps the inspector from version 1 to 2, so a second, entirely non-overlapping assignment still carrying expected_inspector_version 1 is refused 412 ERR_STALE_INSPECTOR_VERSION even though every business rule for it would pass."
        test_recipe:
          setup: ["District T-OCCI with one inspector at version 1; order 1 is then SCHEDULED for 2026-08-10T09:00:00Z to 2026-08-10T10:00:00Z, taking the inspector to version 2; order 2 is REQUESTED for 2026-08-14."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "OCC Inspector Ranch", mailing_state: "MT", contact_email: "occi@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-OCCI", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_o: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "OI-001", home_territory_id: "${terr_o}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", insp_v1: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_o}", inspection_purpose: "SALE", requested_window_start_at: "2026-08-10T08:00:00Z", requested_window_end_at: "2026-08-10T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_1: "$.data.id" }
            - call: "POST /brand-inspection/inspection-orders/${ord_1}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-10T09:00:00Z", scheduled_end_at: "2026-08-10T10:00:00Z", expected_inspector_version: "${insp_v1}" }
              as: BoardAdmin
            - call: "POST /brand-inspection/inspection-orders"
              payload: { owner_id: "${own_a}", territory_id: "${terr_o}", inspection_purpose: "MOVEMENT", requested_window_start_at: "2026-08-14T08:00:00Z", requested_window_end_at: "2026-08-14T17:00:00Z" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { ord_2: "$.data.id" }
          trigger:
            - call: "POST /brand-inspection/inspection-orders/${ord_2}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-14T09:00:00Z", scheduled_end_at: "2026-08-14T10:00:00Z", expected_inspector_version: "${insp_v1}" }
              as: BoardAdmin
              captures: { err_id: "$.data.error_id" }
            - call: "GET /brand-inspection/inspectors/${insp_1}"
              payload: {}
              as: BoardAdmin
              captures: { insp_v2: "$.data.version" }
            - call: "POST /brand-inspection/inspection-orders/${ord_2}/schedule"
              payload: { inspector_id: "${insp_1}", scheduled_start_at: "2026-08-14T09:00:00Z", scheduled_end_at: "2026-08-14T10:00:00Z", expected_inspector_version: "${insp_v2}" }
              as: BoardAdmin
              captures: { ord2_status: "$.data.schedule_status" }
          assert:
            - "${insp_v1} == 1"
            - "the first trigger call responds HTTP 412 and ${err_id} == ERR_STALE_INSPECTOR_VERSION"
            - "${insp_v2} == 2"
            - "${ord2_status} == SCHEDULED"
            - "Inspector.${insp_1}.version == 3 and Inspector.${insp_1}.active_assignment_count == 2"

      - name: corner_version_increments_on_every_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.Inspector.fields.status, 'endpoints[''POST /brand-inspection/inspectors/{id}/status'']']
        distinguishing_aspect: "Inspector.version starts at 1 and advances by exactly one per mutation: two status changes take it to 3, and updated_at moves while created_at does not."
        test_recipe:
          setup: ["District T-VER with one freshly commissioned inspector at version 1."]
          setup_api_calls:
            - call: "POST /brand-inspection/territories"
              payload: { territory_code: "T-VER", state_code: "MT", travel_surcharge_cents: 2500, impound_capacity_head: 100 }
              as: BoardAdmin
              captures: { terr_v: "$.data.id" }
            - call: "POST /brand-inspection/inspectors"
              payload: { badge_number: "VR-001", home_territory_id: "${terr_v}", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: BoardAdmin
              captures: { insp_1: "$.data.id", v1: "$.data.version", created1: "$.data.created_at" }
          trigger:
            - call: "POST /brand-inspection/inspectors/${insp_1}/status"
              payload: { status: "SUSPENDED" }
              as: BoardAdmin
              captures: { v2: "$.data.version" }
            - call: "POST /brand-inspection/inspectors/${insp_1}/status"
              payload: { status: "RETIRED" }
              as: BoardAdmin
              captures: { v3: "$.data.version", st3: "$.data.status", created3: "$.data.created_at" }
          assert:
            - "${v1} == 1 and ${v2} == 2 and ${v3} == 3"
            - "${st3} == RETIRED"
            - "${created3} == ${created1}"
            - "Inspector.${insp_1}.updated_at is strictly later than or equal to created_at and is an ISO 8601 UTC timestamp with three fractional digits"

      - name: corner_sweep_lapses_registration_and_rejects_pending_renewal
        claim_type: ops_run_checkpoint
        grounds: [state_machines.BrandRegistration.ACTIVE_to_GRACE, state_machines.BrandRegistration.GRACE_to_LAPSED, 'endpoints[''POST /brand-inspection/_ops/delinquency-sweep'']']
        distinguishing_aspect: "The board epoch advances only when the sweep runs: the first sweep at 2031-08-01 moves the expired record ACTIVE to GRACE, and the second at 2031-10-30 moves it GRACE to LAPSED and rejects the pending renewal with rejection_reason PRIOR_REGISTRATION_LAPSED."
        test_recipe:
          setup: ["Owner A holds a recorded brand expiring 2031-07-31T00:00:00Z with a SUBMITTED renewal filed one day past expiry for 15000 cents."]
          setup_api_calls:
            - call: "POST /brand-inspection/owners"
              payload: { legal_name: "Sweep Ranch", mailing_state: "MT", contact_email: "sweep@example.test" }
              as: BoardAdmin
              captures: { own_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "SW", position_code: "RIGHT_HIP", species_class: "SHEEP", state_code: "MT" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_a: "$.data.id" }
            - call: "POST /brand-inspection/brand-applications/${app_a}/begin-examination"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-01"
            - call: "POST /brand-inspection/brand-applications/${app_a}/record"
              payload: {}
              as: BrandRecorder
              as_user_id: "recorder-02"
              captures: { reg_a: "$.data.id", reg_v: "$.data.version", reg_exp: "$.data.expires_on" }
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2031-08-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/brand-registrations/${reg_a}/renewal-applications"
              payload: { owner_id: "${own_a}", expected_registration_version: "${reg_v}" }
              as: LivestockOwner
              as_user_id: "${own_a}"
              captures: { app_r: "$.data.id", renew_fee: "$.data.assessed_filing_fee_cents" }
          trigger:
            - call: "POST /brand-inspection/_ops/delinquency-sweep"
              payload: {}
              as: FeeAdministrator
              as_user_id: "fee-01"
              captures: { graced1: "$.data.graced_registration_count", lapsed1: "$.data.lapsed_registration_count", swept_at1: "$.data.swept_at" }
            - call: "POST /brand-inspection/_clock/set_current_utc"
              payload: { to_iso8601: "2031-10-30T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /brand-inspection/_ops/delinquency-sweep"
              payload: {}
              as: FeeAdministrator
              as_user_id: "fee-01"
              captures: { graced2: "$.data.graced_registration_count", lapsed2: "$.data.lapsed_registration_count" }
          assert:
            - "${reg_exp} == 2031-07-31T00:00:00.000Z"
            - "${renew_fee} == 15000"
            - "${graced1} == 1 and ${lapsed1} == 0 and ${swept_at1} == 2031-08-01T00:00:00.000Z"
            - "${graced2} == 0 and ${lapsed2} == 1"
            - "BrandRegistration.${reg_a}.status == LAPSED"
            - "BrandApplication.${app_r}.status == REJECTED and BrandApplication.${app_r}.rejection_reason == PRIOR_REGISTRATION_LAPSED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: corner_immediate_consistency_cascade_visible_without_replay
