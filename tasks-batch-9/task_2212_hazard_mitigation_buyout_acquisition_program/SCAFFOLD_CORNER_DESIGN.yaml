      - name: duplicate_project_codes_are_global_while_duplicate_apns_are_scoped_to_the_project
        claim_type: standard_crud
        grounds:
          - validations.priority_67
          - validations.priority_68
          - endpoints.POST_mitigation_projects
          - endpoints.POST_mitigation_projects_project_id_parcels
        distinguishing_aspect: |
          The two uniqueness rules have different scopes: project_code collides across the whole
          program (ERR_DUPLICATE_PROJECT_CODE) while apn collides only inside one project, so the very
          same parcel number that is refused in project A is accepted in project B. The pair shows the
          scope of a uniqueness key is itself a claim, not an implementation detail.
        test_recipe:
          setup:
            - "Two DRAFT MitigationProjects with distinct project_codes; the first has one parcel with apn APN-SHARED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
              payload: { project_code: "EP-DUP-A", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj_a: "$.data.id" }
            - call: "POST /mitigation-projects"
              payload: { project_code: "EP-DUP-B", grant_program: "FMA", subrecipient_name: "Riverbend County", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { proj_b: "$.data.id" }
            - call: "POST /mitigation-projects/${proj_a}/parcels"
              payload: { project_id: "${proj_a}", apn: "APN-SHARED", site_address: "4101 River Rd", acreage: 0.34, occupancy_type: "VACANT", structure_type: "NONE" }
              as: SubrecipientCoordinator
              as_user_id: "${proj_a}"
              captures: { pa1: "$.data.id" }
          trigger:
            - call: "POST /mitigation-projects"
              payload: { project_code: "EP-DUP-A", grant_program: "HMGP", disaster_declaration_number: "DR-4711-XX", subrecipient_name: "Someone Else", total_federal_share_cap_cents: 100000000, period_of_performance_end_date: "2029-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects/${proj_a}/parcels"
              payload: { project_id: "${proj_a}", apn: "APN-SHARED", site_address: "4103 River Rd", acreage: 0.50, occupancy_type: "VACANT", structure_type: "NONE" }
              as: SubrecipientCoordinator
              as_user_id: "${proj_a}"
            - call: "POST /mitigation-projects/${proj_b}/parcels"
              payload: { project_id: "${proj_b}", apn: "APN-SHARED", site_address: "4102 River Rd", acreage: 0.41, occupancy_type: "VACANT", structure_type: "NONE" }
              as: SubrecipientCoordinator
              as_user_id: "${proj_b}"
              captures: { pb1: "$.data.id" }
          assert:
            - "trigger call 1 returns 409 with data.error_id == ERR_DUPLICATE_PROJECT_CODE"
            - "trigger call 2 returns 409 with data.error_id == ERR_DUPLICATE_APN"
            - "trigger call 3 returns 201 with Parcel.${pb1}.apn == APN-SHARED and project_id == ${proj_b}"
            - "GET /mitigation-projects returns total_count == 2"
            - "GET /parcels?project_id=${proj_a} returns total_count == 1"

      - name: a_second_disconnection_for_the_same_utility_type_on_one_work_order_is_refused
        claim_type: standard_crud
        grounds:
          - validations.priority_70
          - endpoints.POST_demolition_work_orders_work_order_id_utility_disconnections
          - entities.UtilityDisconnection.fields.utility_type
        distinguishing_aspect: |
          The four utility types form a per-work-order set, so a repeated ELECTRIC row is refused with
          ERR_DUPLICATE_UTILITY_TYPE even while the work order is still short of the four confirmations
          it needs - and the same utility type is freely creatable on a second work order for the same
          parcel, because the key is the work order and not the parcel.
        test_recipe:
          setup:
            - "One DRAFT project with one parcel, an ACTIVE contractor, and one ISSUED work order carrying an ELECTRIC disconnection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /mitigation-projects"
              payload: { project_code: "EP-DUPUT-1", grant_program: "FMA", subrecipient_name: "City of Riverbend", total_federal_share_cap_cents: 500000000, period_of_performance_end_date: "2028-12-31" }
