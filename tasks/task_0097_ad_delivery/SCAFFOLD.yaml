# =============================================================================
# task_0097_ad_delivery — Internet Advertising Delivery System (Scaffold)
# =============================================================================

scenario: |
  Internet advertising delivery system: advertiser account management with account hierarchy
  (MCC / sub-account), advertiser qualification verification (business-license /
  industry-special-qualification for medical / financial / education), credit-line for post-pay
  accounts, account-status (active/suspended/closed) management, and multi-user role-permission
  within an account; campaign plan (budget / bid / targeting) with campaign and ad-group structure,
  daily-and-lifetime budget, bidding strategy (CPC/CPM/CPA/oCPX), targeting attributes
  (geo / demographic / interest / behavior / device / time-of-day / remarketing-audience),
  frequency capping, and pacing strategy (standard / accelerated); creative review with
  creative-asset upload (image / video / native / HTML5), industry-specific compliance rules
  (no-misleading-claim / required-disclaimer / prohibited-category), automated pre-screening and
  human review pipeline, rejection-reason feedback, appeal workflow, and creative-version
  archiving; auction engine with real-time bidding (RTB) for external exchange and internal-inventory
  auction, generalized second-price or VCG-style pricing rules, ranking-score combining bid and
  quality-score and predicted-CTR, floor-price enforcement, brand-safety and frequency filters in
  the auction path, and bid-shading where applicable; impression-and-click billing with impression
  and click logging with deduplication, invalid-traffic (IVT) detection and exclusion,
  conversion attribution windows, billing-event aggregation, and reconciliation with publisher
  when applicable; effect attribution with click-through and view-through attribution, multi-touch
  attribution models (last-click / position-based / data-driven), conversion-event ingestion
  (web pixel / app SDK / server-to-server / offline upload), cross-device identity stitching, and
  attribution-report generation; account-balance deduction and recharge with real-time balance
  deduction per billable event, low-balance alert and pause-on-zero, prepaid-recharge and
  post-pay-invoice modes, refund and adjustment workflow, tax handling, and consumption-statement
  issuance; event-driven synchronization with payment, ad-exchange, measurement-partner (MMP), and
  anti-fraud service systems; audit logging for creative-review decisions and balance adjustments.

domain_name: ad-delivery
api_prefix: /advertisers

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation       # GSP vs VCG pricing; LCA vs position-based attribution
    - cascading_side_effects         # account close -> campaigns paused -> ad-groups paused -> creatives archived
    - rate_threshold_triggers        # low-balance alert, frequency cap, IVT score breach, daily-budget exhaustion
    - derived_field_reconciliation   # consumed-budget aggregated from BillingEvent ledger
    - selector_policy                # auction winner selection from candidate ad-group pool
  entity_topology: hybrid
  state_machine_shape: branching
  parallel_dimensions:
    - "Account: status x billing_posture (status in {ACTIVE,SUSPENDED,CLOSED} x balance_state in {HEALTHY,LOW_BALANCE,ZERO_BALANCE})"
  relationship_patterns:
    - one_to_many
    - self_referential            # Account.parent_account_id for MCC hierarchy
    - cross_aggregate             # BillingEvent references AdGroup, Creative, Conversion across aggregates
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Advertiser
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Advertiser UUID" }
      - { name: parent_account_id, type: string, source: input, description: "Parent MCC id for sub-account; null for top-level MCC or independent account" }
      - { name: account_type, type: enum, source: input, description: "MCC | SUB_ACCOUNT | INDEPENDENT" }
      - { name: legal_name, type: string, source: input, description: "Registered business name" }
      - { name: business_license_number, type: string, source: input, description: "Business license registration number" }
      - { name: industry_category, type: enum, source: input, description: "GENERAL | MEDICAL | FINANCIAL | EDUCATION" }
      - { name: special_qualifications, type: array, source: input, description: "Array of QualificationDoc ids; required when industry_category != GENERAL" }
      - { name: qualification_status, type: enum, source: computed, description: "UNVERIFIED | UNDER_REVIEW | VERIFIED | REJECTED" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | SUSPENDED | CLOSED", constraints: "initial PENDING -> ACTIVE on first verification" }
      - { name: billing_mode, type: enum, source: input, description: "PREPAY | POSTPAY" }
      - { name: credit_line_cents, type: integer, source: input, description: "Credit limit for POSTPAY mode; 0 for PREPAY", default: 0 }
      - { name: balance_cents, type: integer, source: computed, description: "Real-time available balance (prepay deposit minus consumption; postpay can go negative within credit_line)" }
      - { name: consumed_cents, type: integer, source: computed, description: "Cumulative finalized BillingEvent.cost_cents this account" }
      - { name: balance_state, type: enum, source: computed, description: "HEALTHY | LOW_BALANCE | ZERO_BALANCE (parallel dimension to status)" }
      - { name: low_balance_threshold_cents, type: integer, source: input, default: 10000, description: "Cents below which LOW_BALANCE alert fires" }
      - { name: tax_rate_bps, type: integer, source: input, default: 0, description: "Tax rate in basis points (10000 = 100%)" }
      - { name: created_seq, type: integer, source: system, description: "Global monotonic sequence for FIFO tie-breaking" }

  - name: QualificationDoc
