        claim_type: Segregation of duties
        grounds: ["validations[priority=10]", "errors[ERR_SEGREGATION_OF_DUTIES]", "entities.PPAPSubmission.fields.submitted_by_user_id", "state_machines.PPAPSubmission.SUBMITTED_to_UNDER_REVIEW"]
