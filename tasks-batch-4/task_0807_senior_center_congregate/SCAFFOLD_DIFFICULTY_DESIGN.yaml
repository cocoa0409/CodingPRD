              as: CenterAdmin
              captures: { p2: "$.data.id" }
            - call: "POST /participants"
              payload: { full_name: "B3", birth_date: "1950-05-05T00:00:00Z", gender: "OTHER", ethnicity: "HISPANIC", race: "MULTI", poverty_status: "DECLINED", lives_alone: true, rural: true, veteran: false }
              as: CenterAdmin
              captures: { p3: "$.data.id" }
            - call: "POST /meal-service-days"
              payload: { service_date: "2026-03-22T12:00:00Z", site_name: "Main Hall", capacity: 2 }
              as: CenterAdmin
              captures: { sd: "$.data.id", v0: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p1}", expected_service_day_version: "${v0}" }
              as: Coordinator
              captures: { r1: "$.data.id" }
            - call: "GET /meal-service-days/${sd}"
              payload: {}
              as: Coordinator
              captures: { v1: "$.data.version" }
            - call: "POST /meal-reservations"
              payload: { service_day_id: "${sd}", participant_id: "${p2}", expected_service_day_version: "${v1}" }
              as: Coordinator
