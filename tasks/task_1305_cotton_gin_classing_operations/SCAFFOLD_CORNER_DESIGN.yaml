              payload: { season: "2026", expected_grower_version: "${gv}" }
              as: CoopAccountant
              captures: { st: $.data.id }
          assert:
            - "Settlement.${st}.lint_value_cents == 30000 (only the 2026 bale) and ginning_charge_cents == -5750 (only the 2026 entry)"
            - "seed_credit_cents == 137500 (2026 module est_seed 5500 x 25c; the 2025 unsold module is out of scope)"
            - "patronage_cents == 1150; net_payable_cents == 162900"
            - "Grower.${g}.credit_balance_cents == -11500 (ledger spans both seasons; the settlement scope does not)"

      - name: storage_free_day_boundary
        claim_type: correct_result
        grounds: [calculations.storage_charge, entities.WarehouseReceipt.fields.storage_start_date]
        distinguishing_aspect: "the 15th stored day is still free and the 16th costs 12 cents: shipping at days_stored == 15 posts no STORAGE_CHARGE entry at all, days_stored == 16 posts exactly -12."
        test_recipe:
          setup: ["grower; warehouse (2 docks); module with two 500-lb bales, both receipted at the default clock 2026-08-01; two confirmed orders O1 (bale1) and O2 (bale2)"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C37", legal_name: "Storage Farm" }
              as: CoopAdmin
              captures: { g: $.data.id }
            - call: "POST /gin-ops/warehouses"
              payload: { name: "WH-ST", capacity_bales: 5, dock_count: 2 }
              as: CoopAdmin
              captures: { w: $.data.id }
            - call: "POST /gin-ops/gin-shifts"
              payload: { season: "2026", stand_label: "STAND-ST" }
              as: GinOperator
              captures: { s: $.data.id }
