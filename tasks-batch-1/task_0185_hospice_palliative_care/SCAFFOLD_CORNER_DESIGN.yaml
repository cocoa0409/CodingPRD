          - entities.CarePlan.fields.idg_members
          - errors[ERR_IDG_INCOMPLETE]
          - endpoints["POST /hospice/care-plans"]
        distinguishing_aspect: "A CarePlan whose idg_members omits COUNSELOR returns ERR_IDG_INCOMPLETE (422)."
        test_recipe:
          setup:
