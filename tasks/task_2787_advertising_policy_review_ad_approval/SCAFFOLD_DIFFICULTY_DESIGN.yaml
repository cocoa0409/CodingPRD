              payload: { country_code: "US", disposition: "ALLOWED_WITH_DISCLAIMER", severity_multiplier: 1.20 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Pinebrook Lending Co", country_code: "US", industry_code: "CONSUMER_CREDIT" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "Rev Regulated US", queue_specialties: ["REGULATED_CERT"], country_authorizations: ["US"], max_concurrent_claims: 2 }
              as: PolicyAdmin
