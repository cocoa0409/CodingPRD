# =============================================================================
# task_2354 — §1.9 Scaffold Corner Design (breadth probe)
# Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md; nothing outside that taxonomy is used.
# Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml carry an
# `excluded_because:` stub and no test_recipe.
#
# Reusable prelude referenced by name in `setup:` prose:
#   MINI-3 = POST /fraud/customers + POST /fraud/devices + POST /fraud/addresses
#   BOOT-W = MINI-3 plus WEIGHTED pack P1 (rule BEH_FAST_CHECKOUT=20, floors
#            40.00 / 60.00, window [2026-07-01, 2027-01-01)) and ACTIVE model M1
#            (intercept 0.05, slope 1.20). Under BOOT-W a checkout with
#            session_seconds 30 / cart_item_count 3 yields rule_score 20, and
#            model_raw_probability 0.4021 -> model_points 53.25 -> blended 39.95
#            (APPROVE) while 0.5417 -> 70.00 -> 50.00 (REVIEW).
#
# Placeholder closure: BOOT-W is the canonical 13-call prelude spelled out in
# full under state_machines / chargeback_initial_state_is_received_with_
# guarantee_not_applicable. Any instance whose `setup:` names MINI-3 or BOOT-W
# inherits that prelude's captures verbatim — cust_id, dev_id, addr_id, pack_id,
# model_id — and its `setup_api_calls:` list only the delta beyond it.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: customer_creation_applies_declared_defaults_and_envelope
        claim_type: creation
        grounds:
          - entities.Customer
          - endpoints[POST /fraud/customers]
          - response_envelope.success
        distinguishing_aspect: "A create with only the two required inputs must return 201 with response_type object, version 1, and every defaulted field materialised: tier STANDARD, account_status ACTIVE, ato_posture CLEAR, all five counters 0, good_customer_flag false, locked_reason null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/customers"
              payload: { email: "bare@example.com", home_country: "US" }
              as: CheckoutService
              captures: { cust_id: $.data.id, cust_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "response body has keys meta.api_request_id, meta.api_request_timestamp, response_type, data"
            - "response_type == \"object\""
            - "Customer.${cust_id}.email == \"bare@example.com\""
            - "Customer.${cust_id}.home_country == \"US\""
            - "Customer.${cust_id}.tier == STANDARD"
            - "Customer.${cust_id}.account_status == ACTIVE"
            - "Customer.${cust_id}.ato_posture == CLEAR"
            - "Customer.${cust_id}.locked_reason == null"
            - "Customer.${cust_id}.lifetime_net_approved_cents == 0"
            - "Customer.${cust_id}.approved_count == 0"
            - "Customer.${cust_id}.declined_count == 0"
            - "Customer.${cust_id}.confirmed_fraud_count == 0"
            - "Customer.${cust_id}.failed_login_count == 0"
            - "Customer.${cust_id}.good_customer_flag == false"
            - "${cust_v} == 1"
            - "Customer.${cust_id}.created_at == 2026-08-01T00:00:00Z"

      - name: device_retrieval_returns_stored_row_with_zeroed_counters
        claim_type: retrieval
        grounds:
          - entities.DeviceProfile
          - endpoints[GET /fraud/devices/{id}]
        distinguishing_aspect: "GET by id returns exactly the stored row: the two inputs echoed, reputation NEW, and all three derived counters at 0 because no assessment or auth event references the device yet."
        test_recipe:
          setup:
            - "One device exists with device_hash 'dev-corner-001', tz_offset_minutes -300, emulator_flag omitted."
          setup_api_calls:
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-corner-001", tz_offset_minutes: -300 }
              as: CheckoutService
              captures: { dev_id: $.data.id }
          trigger:
            - call: "GET /fraud/devices/${dev_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP status == 200"
            - "DeviceProfile.${dev_id}.device_hash == \"dev-corner-001\""
            - "DeviceProfile.${dev_id}.tz_offset_minutes == -300"
            - "DeviceProfile.${dev_id}.emulator_flag == false"
            - "DeviceProfile.${dev_id}.reputation == NEW"
            - "DeviceProfile.${dev_id}.distinct_customer_count == 0"
            - "DeviceProfile.${dev_id}.approved_use_count == 0"
            - "DeviceProfile.${dev_id}.fraud_confirmed_count == 0"

      - name: analyst_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /fraud/analysts]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three analysts stored, limit=2/offset=0 returns 2 rows with total_count 3 and has_more true, and limit=2/offset=2 returns 1 row with total_count 3 and has_more false — total_count counts the whole filtered set, not the page."
        test_recipe:
          setup:
            - "Three analysts exist: AN1 (JUNIOR), AN2 (SENIOR) and LEAD1 (LEAD)."
          setup_api_calls:
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1 Junior", seniority: "JUNIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id }
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN2 Senior", seniority: "SENIOR", skill_families: ["DEVICE"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an2_id: $.data.id }
            - call: "POST /fraud/analysts"
              payload: { display_name: "LEAD1", seniority: "LEAD", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 3 }
              as: PlatformAdmin
              captures: { lead_id: $.data.id }
          trigger:
            - call: "GET /fraud/analysts"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
              captures: { page1_first_id: "$.data[0].id" }
            - call: "GET /fraud/analysts"
              payload: { limit: 2, offset: 2 }
              as: PlatformAdmin
              captures: { page2_first_id: "$.data[0].id" }
          assert:
            - "First trigger call: HTTP status == 200, response_type == \"array\", total_count == 3, has_more == true, limit == 2, offset == 0, and data length == 2"
            - "Second trigger call: total_count == 3, has_more == false, offset == 2, and data length == 1"
            - "${page1_first_id} == ${an1_id}"
            - "${page2_first_id} == ${lead_id}"
            - "GET /fraud/analysts with no limit/offset returns limit == 10 and offset == 0"
            - "GET /fraud/analysts?seniority=LEAD returns total_count == 1 with data[0].id == ${lead_id}"

      - name: device_lookup_with_unknown_uuid_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_DEVICE_NOT_FOUND]
          - endpoints[GET /fraud/devices/{id}]
          - response_envelope.error
        distinguishing_aspect: "A syntactically valid but unknown UUID yields 404 ERR_DEVICE_NOT_FOUND in the error envelope (response_type \"error\", data.error_id, data.message), not an empty 200 and not a 422."
        test_recipe:
          setup:
            - "Empty database — no DeviceProfile rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /fraud/devices/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
          assert:
            - "HTTP status == 404"
            - "response_type == \"error\""
            - "data.error_id == ERR_DEVICE_NOT_FOUND"
            - "data.message is a non-empty string"

      - name: assessment_missing_required_amount_cents_rejected
        claim_type: required_fields
        grounds:
          - entities.CheckoutAssessment.fields.amount_cents
          - validations[priority=14]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "amount_cents has source input with no default, so omitting it fails request-shape validation at 422 ERR_VALIDATION — and it fails there even though no ACTIVE rule pack exists, proving request_shape (priorities 14-20) runs ahead of business_referential (priority 64)."
        test_recipe:
          setup:
            - "MINI-3 only: a customer, a device and an address exist so the existence checks at priorities 10-13 pass."
            - "No RulePack and no RiskModel exist at all."
          setup_api_calls:
            - call: "POST /fraud/customers"
              payload: { email: "shape@example.com", home_country: "US" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-shape-001", tz_offset_minutes: -480 }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "100 Main St", postal_code: "94105", country_code: "US" }
              as: CheckoutService
              captures: { addr_id: $.data.id }
          trigger:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_VALIDATION"
            - "data.error_id != ERR_NO_ACTIVE_RULE_PACK"
            - "GET /fraud/checkout-assessments?customer_id=${cust_id} returns total_count == 0"

      - name: address_classification_defaults_to_residential_when_omitted
        claim_type: defaults
        grounds:
          - entities.AddressRecord.fields.classification
          - calculations.address_intelligence_recompute
        distinguishing_aspect: "Omitting classification yields RESIDENTIAL, which drives drop_risk_state CLEAN and reshipper_confidence 0.00; supplying PO_BOX on a second address yields WATCH and 0.10, so the default is a real value rather than null."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/addresses"
              payload: { line1: "1 Default Way", postal_code: "94105", country_code: "US" }
              as: CheckoutService
              captures: { addr_default_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "PO Box 9", postal_code: "94105", country_code: "US", classification: "PO_BOX" }
              as: CheckoutService
              captures: { addr_pobox_id: $.data.id }
          assert:
            - "AddressRecord.${addr_default_id}.classification == RESIDENTIAL"
            - "AddressRecord.${addr_default_id}.canonical_address_id == ${addr_default_id}"
            - "AddressRecord.${addr_default_id}.canonical_parent_address_id == null"
            - "AddressRecord.${addr_default_id}.drop_risk_state == CLEAN"
            - "AddressRecord.${addr_default_id}.reshipper_confidence == 0.00"
            - "AddressRecord.${addr_pobox_id}.classification == PO_BOX"
            - "AddressRecord.${addr_pobox_id}.drop_risk_state == WATCH"
            - "AddressRecord.${addr_pobox_id}.reshipper_confidence == 0.10"

      - name: customer_ledger_counters_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.Customer.fields.lifetime_net_approved_cents
          - entities.Customer.fields.approved_count
          - entities.Customer.fields.good_customer_flag
          - endpoints[POST /fraud/customers]
        distinguishing_aspect: "The five counters and good_customer_flag are source computed; a create that supplies approved_count 99, lifetime_net_approved_cents 999999 and good_customer_flag true must persist 0 / 0 / false — the client cannot seed its own good-customer standing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/customers"
              payload: { email: "seed@example.com", home_country: "US", tier: "BUSINESS", approved_count: 99, lifetime_net_approved_cents: 999999, good_customer_flag: true, confirmed_fraud_count: 7, account_status: "LOCKED" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
          assert:
            - "Customer.${cust_id}.tier == BUSINESS"
            - "Customer.${cust_id}.approved_count == 0"
            - "Customer.${cust_id}.lifetime_net_approved_cents == 0"
            - "Customer.${cust_id}.confirmed_fraud_count == 0"
            - "Customer.${cust_id}.good_customer_flag == false"
            - "Customer.${cust_id}.account_status == ACTIVE"

      - name: address_system_fields_generated_input_ignored
        claim_type: system_fields
        grounds:
          - entities.AddressRecord
          - endpoints[POST /fraud/addresses]
        distinguishing_aspect: "id, created_at, updated_at and version are server-generated: a create that supplies all four gets a server UUID different from the submitted one, created_at equal to the logical clock, and version 1."
        test_recipe:
          setup:
            - "The logical clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/addresses"
              payload: { line1: "2 System Way", postal_code: "94105", country_code: "US", id: "11111111-1111-1111-1111-111111111111", created_at: "2001-01-01T00:00:00Z", updated_at: "2001-01-01T00:00:00Z", version: 42 }
              as: PlatformAdmin
              captures: { addr_id: $.data.id, addr_v: $.data.version }
          assert:
            - "${addr_id} != \"11111111-1111-1111-1111-111111111111\""
            - "AddressRecord.${addr_id}.created_at == 2026-08-01T00:00:00Z"
            - "AddressRecord.${addr_id}.updated_at == 2026-08-01T00:00:00Z"
            - "${addr_v} == 1"

      - name: analyst_seniority_outside_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Analyst.fields.seniority
          - entities.Analyst.fields.shift_capacity_cases
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Both declared constraints on Analyst are enforced independently: seniority PRINCIPAL is outside {JUNIOR, SENIOR, LEAD} and shift_capacity_cases 0 breaks '>= 1'; each returns 422 ERR_VALIDATION and persists nothing."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/analysts"
              payload: { display_name: "Bad Seniority", seniority: "PRINCIPAL", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
            - call: "POST /fraud/analysts"
              payload: { display_name: "Zero Capacity", seniority: "JUNIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 0 }
              as: PlatformAdmin
            - call: "POST /fraud/analysts"
              payload: { display_name: "Empty Skills", seniority: "JUNIOR", skill_families: [], shift_capacity_cases: 2 }
              as: PlatformAdmin
          assert:
            - "All three trigger calls: HTTP status == 422 and data.error_id == ERR_VALIDATION"
            - "GET /fraud/analysts returns total_count == 0"

      - name: fraud_rule_is_immutable_with_no_version_or_update_endpoint
        claim_type: immutability
        grounds:
          - entities.FraudRule
          - endpoints[GET /fraud/rule-packs/{id}/rules]
          - endpoints[GET /fraud/rules/{id}]
        distinguishing_aspect: "FraudRule declares common_fields false: its rows expose no version and no updated_at, and §1.5 declares no PUT/PATCH/DELETE for /fraud/rules — a pack's rule set is corrected by authoring a new DRAFT pack, never by editing a rule in place."
        test_recipe:
          setup:
            - "A DRAFT pack exists with one rule BEH_FAST_CHECKOUT (BEHAVIORAL, 20 points, evaluation_order 10)."
          setup_api_calls:
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-immutable", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          trigger:
            - call: "GET /fraud/rule-packs/${pack_id}/rules"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          assert:
            - "HTTP status == 200 and total_count == 1"
            - "data[0].code == BEH_FAST_CHECKOUT"
            - "data[0].signal_family == BEHAVIORAL"
            - "data[0].points == 20"
            - "data[0].evaluation_order == 10"
            - "data[0].hard_decline == false"
            - "data[0].rule_pack_id == ${pack_id}"
            - "data[0] has no \"version\" key"
            - "data[0] has no \"updated_at\" key"
            - "RulePack.${pack_id}.rule_count == 1"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint whose path matches /fraud/rules or /fraud/rule-packs/{id}/rules"

      - name: rule_creation_under_unknown_rule_pack_returns_404
        claim_type: parent_relationships
        grounds:
          - entities.FraudRule.parent
          - errors[ERR_RULE_PACK_NOT_FOUND]
          - endpoints[POST /fraud/rule-packs/{id}/rules]
        distinguishing_aspect: "FraudRule declares parent RulePack, so the parent id in the path is resolved before any request-shape work: an unknown pack id returns 404 ERR_RULE_PACK_NOT_FOUND rather than 422, even when the rule body itself is valid."
        test_recipe:
          setup:
            - "Empty database — no RulePack rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/rule-packs/00000000-0000-0000-0000-000000000000/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_RULE_PACK_NOT_FOUND"
            - "data.error_id != ERR_VALIDATION"

      - name: assessment_with_unknown_device_fk_returns_404
        claim_type: flat
        grounds:
          - complexity_profile.entity_topology
          - entities.CheckoutAssessment.fields.device_profile_id
          - errors[ERR_DEVICE_NOT_FOUND]
        distinguishing_aspect: "Under the flat topology every FK on CheckoutAssessment is validated by lookup, not by shape: a real customer and real addresses combined with an unknown device_profile_id return 404 ERR_DEVICE_NOT_FOUND, and no assessment row is created."
        test_recipe:
          setup:
            - "MINI-3 exists, so customer_id, shipping_address_id and billing_address_id all resolve."
            - "No ACTIVE rule pack exists, which is irrelevant because existence checks run at priorities 10-13."
          setup_api_calls:
            - call: "POST /fraud/customers"
              payload: { email: "fk@example.com", home_country: "US" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "100 Main St", postal_code: "94105", country_code: "US" }
              as: CheckoutService
              captures: { addr_id: $.data.id }
          trigger:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "00000000-0000-0000-0000-000000000000", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_DEVICE_NOT_FOUND"
            - "GET /fraud/checkout-assessments?customer_id=${cust_id} returns total_count == 0"

      - name: rule_pack_window_with_until_equal_to_from_rejected
        claim_type: type_constraints
        grounds:
          - entities.RulePack.fields.effective_until
          - validations[priority=70]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: "effective_until > effective_from is strict: a window whose end equals its start is rejected with 422 ERR_INVALID_WINDOW at creation time, before the pack ever reaches activation where the freeze-buffer overlap test lives."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-zero-window", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2026-07-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          assert:
            - "HTTP status == 422"
            - "data.error_id == ERR_INVALID_WINDOW"
            - "GET /fraud/rule-packs returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: chargeback_initial_state_is_received_with_guarantee_not_applicable
        claim_type: initial_state
        grounds:
          - state_machines.ChargebackRecord.initial_state
          - entities.ChargebackRecord.fields.guarantee_state
          - endpoints[POST /fraud/chargebacks]
        distinguishing_aspect: "Creating a chargeback lands in RECEIVED with guarantee_state NOT_APPLICABLE and all three guarantee money fields 0 — the guarantee waterfall and the fraud ledger cascade fire only on the LOST transition, so creation alone must leave the customer ledger and the assessment outcome_label untouched."
        test_recipe:
          setup:
            - "BOOT-W, plus one assessment A1 (amount_cents 20000, model_raw_probability 0.4021) scored to DECIDED_APPROVE with blended_score 39.95."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/customers"
              payload: { email: "cb-init@example.com", home_country: "US" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-cb-init", tz_offset_minutes: -480 }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "10 Ledger Ln", postal_code: "94105", country_code: "US" }
              as: CheckoutService
              captures: { addr_id: $.data.id }
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P1", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
            - call: "POST /fraud/risk-models"
              payload: { model_version_label: "M1", calibration_intercept: 0.05, calibration_slope: 1.20 }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { model_id: $.data.id }
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PUBLISH_SHADOW" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PROMOTE" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { asmt_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/chargebacks"
              payload: { assessment_id: "${asmt_id}", reason_code: "FRAUD_CNP", amount_cents: 20000, liability_shift: false, received_at: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
              captures: { cb_id: $.data.id, cb_v: $.data.version }
          assert:
            - "HTTP status == 201"
            - "ChargebackRecord.${cb_id}.state == RECEIVED"
            - "ChargebackRecord.${cb_id}.guarantee_state == NOT_APPLICABLE"
            - "ChargebackRecord.${cb_id}.guarantee_denial_reason == null"
            - "ChargebackRecord.${cb_id}.guarantee_eligible_cents == 0"
            - "ChargebackRecord.${cb_id}.guarantee_fee_cents == 0"
            - "ChargebackRecord.${cb_id}.guarantee_reimbursed_cents == 0"
            - "ChargebackRecord.${cb_id}.resolved_at == null"
            - "${cb_v} == 1"
            - "CheckoutAssessment.${asmt_id}.outcome_label == UNKNOWN (still the default — creation labels nothing)"
            - "CheckoutAssessment.${asmt_id}.state == DECIDED_APPROVE"
            - "Customer.${cust_id}.lifetime_net_approved_cents == 20000"
            - "Customer.${cust_id}.confirmed_fraud_count == 0"

      - name: chargeback_transition_from_won_terminal_state_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.ChargebackRecord.terminal_states
          - state_machines.ChargebackRecord.transitions[REPRESENTED->WON]
          - errors[ERR_CHARGEBACK_TRANSITION_INVALID]
        distinguishing_aspect: "WON is terminal: after REPRESENT then WIN, a LOSE on the same record returns 409 ERR_CHARGEBACK_TRANSITION_INVALID and none of the LOST cascade runs, so the customer ledger keeps the full approved amount and outcome_label stays LEGIT rather than flipping to FRAUD."
        test_recipe:
          setup:
            - "As in chargeback_initial_state_is_received_with_guarantee_not_applicable: BOOT-W, assessment A1 (20000) DECIDED_APPROVE, chargeback CB1 in RECEIVED with reason_code FRAUD_CNP."
          setup_api_calls:
            - call: "POST /fraud/chargebacks/${cb_id}/transition"
              payload: { action: "REPRESENT", evidence_note: "AVS match and device history attached" }
              as: PlatformAdmin
            - call: "POST /fraud/chargebacks/${cb_id}/transition"
              payload: { action: "WIN" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/chargebacks/${cb_id}/transition"
              payload: { action: "LOSE" }
              as: PlatformAdmin
          assert:
            - "The WIN call returned 200 with ChargebackRecord.${cb_id}.state == WON, resolved_at == 2026-08-02T00:00:00Z and guarantee_state == NOT_APPLICABLE"
            - "CheckoutAssessment.${asmt_id}.outcome_label == LEGIT after the WIN"
            - "Trigger call: HTTP status == 409 and data.error_id == ERR_CHARGEBACK_TRANSITION_INVALID"
            - "ChargebackRecord.${cb_id}.state == WON (unchanged)"
            - "CheckoutAssessment.${asmt_id}.outcome_label == LEGIT (still not FRAUD)"
            - "Customer.${cust_id}.lifetime_net_approved_cents == 20000"
            - "Customer.${cust_id}.confirmed_fraud_count == 0"

      - name: chargeback_represent_applied_twice_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ChargebackRecord.transitions[RECEIVED->REPRESENTED]
          - errors[ERR_CHARGEBACK_TRANSITION_INVALID]
        distinguishing_aspect: "REPRESENT is not idempotent-by-replay: the second REPRESENT is refused with 409 rather than silently succeeding, and the first evidence_note is preserved instead of being overwritten by the retry's note."
        test_recipe:
          setup:
            - "BOOT-W plus assessment A1 (20000) DECIDED_APPROVE plus chargeback CB1 in RECEIVED (as in the initial_state instance)."
          setup_api_calls:
            - call: "POST /fraud/chargebacks/${cb_id}/transition"
              payload: { action: "REPRESENT", evidence_note: "first submission" }
              as: PlatformAdmin
          trigger:
            - call: "POST /fraud/chargebacks/${cb_id}/transition"
              payload: { action: "REPRESENT", evidence_note: "duplicate submission" }
              as: PlatformAdmin
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_CHARGEBACK_TRANSITION_INVALID"
            - "ChargebackRecord.${cb_id}.state == REPRESENTED"
            - "ChargebackRecord.${cb_id}.evidence_note == \"first submission\""
            - "ChargebackRecord.${cb_id}.version == 2"

      - name: assessment_scored_twice_rejected_without_double_ledger_movement
        claim_type: idempotency
        grounds:
          - state_machines.CheckoutAssessment.transitions[PENDING_SIGNALS->DECIDED_APPROVE]
          - errors[ERR_ASSESSMENT_ALREADY_SCORED]
          - endpoints[POST /fraud/checkout-assessments/{id}/score]
        distinguishing_aspect: "A retried score call on a terminal assessment returns 409 ERR_ASSESSMENT_ALREADY_SCORED, and none of the eight scoring side effects replay: approved_count stays 1, lifetime_net_approved_cents stays 20000, and RiskModel.scored_assessment_count stays 1."
        test_recipe:
          setup:
            - "BOOT-W plus assessment A1 (amount_cents 20000, model_raw_probability 0.4021) already scored to DECIDED_APPROVE with blended_score 39.95."
          setup_api_calls:
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
          trigger:
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_ASSESSMENT_ALREADY_SCORED"
            - "CheckoutAssessment.${asmt_id}.state == DECIDED_APPROVE"
            - "CheckoutAssessment.${asmt_id}.blended_score == 39.95"
            - "CheckoutAssessment.${asmt_id}.decision == APPROVE"
            - "Customer.${cust_id}.approved_count == 1"
            - "Customer.${cust_id}.lifetime_net_approved_cents == 20000"
            - "RiskModel.${model_id}.scored_assessment_count == 1"
            - "DeviceProfile.${dev_id}.approved_use_count == 1"

      - name: posture_clear_to_clear_precondition_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Customer.ato_posture.transitions[CONTAINED->CLEAR]
          - errors[ERR_CUSTOMER_POSTURE_INVALID]
          - endpoints[POST /fraud/customers/{id}/posture]
        distinguishing_aspect: "Clearing ato_posture is guarded by 'posture == CONTAINED', not merely by the target value: asking for CLEAR on a customer already at CLEAR is a 409 ERR_CUSTOMER_POSTURE_INVALID no-op rather than an accepted idempotent write, so version does not move and failed_login_count is not reset."
        test_recipe:
          setup:
            - "One customer exists, freshly created, so ato_posture == CLEAR, failed_login_count == 0 and version == 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/customers"
              payload: { email: "posture@example.com", home_country: "US" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /fraud/customers/${cust_id}/posture"
              payload: { ato_posture: "CLEAR" }
              as: PlatformAdmin
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_CUSTOMER_POSTURE_INVALID"
            - "Customer.${cust_id}.ato_posture == CLEAR"
            - "Customer.${cust_id}.version == 1"
            - "Customer.${cust_id}.account_status == ACTIVE"

      - name: analyst_shift_change_requeues_the_held_case
        claim_type: cascade_down
        grounds:
          - state_machines.ReviewCase.transitions[ASSIGNED->QUEUED]
          - entities.Analyst.fields.status
          - entities.ReviewCase.fields.requeue_count
          - endpoints[POST /fraud/analysts/{id}/shift]
        distinguishing_aspect: "Moving an analyst OFF_SHIFT is a two-link downward cascade from Analyst to every case it holds: the case returns to QUEUED with assigned_analyst_id cleared and requeue_count 1, and the analyst's open_case_count is reset to 0 (not merely decremented), which is what restores the review_capacity_ledger invariant."
        test_recipe:
          setup:
            - "BOOT-W plus assessment A2 with model_raw_probability 0.5417 (model_points 70.00, rule_score 20 -> blended_score 50.00 REVIEW), amount_cents 20000, so ReviewCase C1 is created QUEUED with primary_signal_family BEHAVIORAL and priority_score 27.00 (25.00 + 2.00)."
            - "Analyst AN1 exists: JUNIOR, skill_families [BEHAVIORAL], shift_capacity_cases 2, status AVAILABLE, version 1."
            - "C1 has been explicitly assigned to AN1, so C1.state == ASSIGNED and AN1.open_case_count == 1."
          setup_api_calls:
            - call: "POST /fraud/analysts"
              payload: { display_name: "AN1", seniority: "JUNIOR", skill_families: ["BEHAVIORAL"], shift_capacity_cases: 2 }
              as: PlatformAdmin
              captures: { an1_id: $.data.id, an1_v: $.data.version }
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.5417 }
              as: CheckoutService
              captures: { asmt2_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt2_id}/score"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${asmt2_id}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
              captures: { case_id: "$.data[0].id" }
            - call: "POST /fraud/review-cases/${case_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
          trigger:
            - call: "POST /fraud/analysts/${an1_id}/shift"
              payload: { status: "OFF_SHIFT" }
              as: PlatformAdmin
          assert:
            - "HTTP status == 200"
            - "Analyst.${an1_id}.status == OFF_SHIFT"
            - "Analyst.${an1_id}.open_case_count == 0"
            - "Analyst.${an1_id}.resolved_case_count == 0"
            - "ReviewCase.${case_id}.state == QUEUED"
            - "ReviewCase.${case_id}.assigned_analyst_id == null"
            - "ReviewCase.${case_id}.assigned_at == null"
            - "ReviewCase.${case_id}.requeue_count == 1"
            - "ReviewCase.${case_id}.priority_score == 27.00 (the requeue does not re-price the case)"
            - "CheckoutAssessment.${asmt2_id}.state == IN_REVIEW (the assessment is untouched by the requeue)"

      - name: risk_model_shadow_reject_returns_to_draft_and_clears_counts
        claim_type: compensation
        grounds:
          - state_machines.RiskModel.transitions[SHADOW->DRAFT]
          - state_machines.RiskModel.transitions[DRAFT->SHADOW]
          - errors[ERR_MODEL_TRANSITION_INVALID]
        distinguishing_aspect: "REJECT is a compensating transition, not a terminal one: the cold-start DRAFT -> SHADOW path (null training cutoff) can be undone back to DRAFT with training_segment_counts cleared to null, and from DRAFT a PROMOTE is then refused with 409 because promotion is reachable only from SHADOW."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/risk-models"
              payload: { model_version_label: "M-cold", calibration_intercept: 0.05, calibration_slope: 1.20 }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { model_id: $.data.id }
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PUBLISH_SHADOW" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          trigger:
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "REJECT" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PROMOTE" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
          assert:
            - "The PUBLISH_SHADOW setup call returned 200 with status SHADOW even though trained_on_chargeback_cutoff_at is null (cold-start branch bypasses TRAINING)"
            - "First trigger call: HTTP status == 200, RiskModel.${model_id}.status == DRAFT, training_segment_counts == null, promoted_at == null, version == 3"
            - "Second trigger call: HTTP status == 409 and data.error_id == ERR_MODEL_TRANSITION_INVALID"
            - "RiskModel.${model_id}.status == DRAFT (unchanged) and version == 3"

      - name: score_rejected_when_pinned_rule_pack_retired_by_successor
        claim_type: guarded_transitions
        grounds:
          - state_machines.CheckoutAssessment.transitions[PENDING_SIGNALS->DECIDED_APPROVE].preconditions
          - state_machines.RulePack.transitions[ACTIVE->RETIRED]
          - errors[ERR_RULE_PACK_NOT_ACTIVE]
        distinguishing_aspect: "The rule_pack.status == ACTIVE guard is re-evaluated at score time, not at assessment creation: an assessment pinned to P1 while P1 was ACTIVE becomes unscorable with 409 ERR_RULE_PACK_NOT_ACTIVE once activating P2 cascades P1 to RETIRED, and the pinned rule_pack_id is never silently repointed at P2."
        test_recipe:
          setup:
            - "BOOT-W (pack P1 ACTIVE with window [2026-07-01, 2027-01-01)) plus a PENDING_SIGNALS assessment A3 pinned to P1."
            - "A successor pack P2 exists in DRAFT with window [2027-01-01T01:00:00Z, 2027-06-01T00:00:00Z) — a 3600s gap, exactly the activation freeze buffer, so activation is permitted."
          setup_api_calls:
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { asmt3_id: $.data.id }
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P2", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2027-01-01T01:00:00Z", effective_until: "2027-06-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack2_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack2_id}/rules"
              payload: { code: "BEH_FAST_CHECKOUT", signal_family: "BEHAVIORAL", points: 20, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack2_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
          trigger:
            - call: "POST /fraud/checkout-assessments/${asmt3_id}/score"
              payload: {}
              as: CheckoutService
          assert:
            - "The P2 activation returned 200 with RulePack.${pack2_id}.status == ACTIVE and RulePack.${pack_id}.status == RETIRED"
            - "Trigger call: HTTP status == 409 and data.error_id == ERR_RULE_PACK_NOT_ACTIVE"
            - "CheckoutAssessment.${asmt3_id}.state == PENDING_SIGNALS"
            - "CheckoutAssessment.${asmt3_id}.rule_pack_id == ${pack_id}"
            - "CheckoutAssessment.${asmt3_id}.blended_score == null and decision == null"
            - "Customer.${cust_id}.approved_count is unchanged by the failed score"

      - name: chargeback_loss_cascades_to_customer_ledger_and_review_queue
        claim_type: cascade_down
        grounds:
          - state_machines.ChargebackRecord.transitions[REPRESENTED->LOST]
          - calculations.review_case_priority_score
        excluded_because:
          difficulty_instance: chargeback_loss_reprices_open_review_queue
          rationale: "The five-link LOST cascade (outcome_label FRAUD -> ledger decrement -> good_customer_flag flip -> priority_score re-pricing of every open case) is asserted end-to-end there, including the 52.50 -> 32.50 re-price and the guarantee split 15000/375/14625."

      - name: ato_containment_cascades_to_in_review_assessments
        claim_type: cross_entity
        grounds:
          - state_machines.Customer.ato_posture.transitions[WATCH->CONTAINED]
          - state_machines.ReviewCase.transitions[QUEUED->RESOLVED_DECLINE]
        excluded_because:
          difficulty_instance: ato_containment_auto_declines_in_review_orders
          rationale: "The four-link containment chain from the third failed challenge through account_status LOCKED, IN_REVIEW assessments forced to DECIDED_DECLINE with reason ATO_CONTAINMENT, and their cases to RESOLVED_DECLINE is fully asserted there."

      - name: customer_parallel_state_axes_change_independently
        claim_type: parallel
        grounds:
          - state_machines.Customer.account_status
          - state_machines.Customer.ato_posture
        excluded_because:
          difficulty_instance: customer_parallel_axes_progress_independently
          rationale: "The two-axis independence claim (ato_posture reaching CONTAINED while account_status is separately LOCKED, and clearing one axis leaving the other in place) is the whole subject of that non_linear_state_machine instance."

      - name: review_case_cycles_back_to_assigned_after_escalation
        claim_type: cyclic
        grounds:
          - state_machines.ReviewCase.transitions[ASSIGNED->ESCALATED]
          - state_machines.ReviewCase.transitions[ESCALATED->ASSIGNED]
        excluded_because:
          difficulty_instance: review_case_escalation_cycle_returns_to_assigned
          rationale: "The ASSIGNED -> ESCALATED -> ASSIGNED cycle, the escalation_count 1 that survives it, and the 32.50 -> 47.50 priority re-price are asserted there."

  # ===========================================================================
  - section: calculations
    instances:

      - name: velocity_window_threshold_fires_only_at_the_third_prior_attempt
        claim_type: threshold
        grounds:
          - calculations.velocity_signal_window
          - calculations.rule_score_evaluation
          - global_constants.VELOCITY_CUSTOMER_WINDOW_SECONDS
        distinguishing_aspect: "VEL_CUSTOMER_1H is '>= 3 PRIOR assessments, self excluded, state NOT filtered': the third checkout of the hour sees only 2 siblings and stays APPROVE at 31.95, while the fourth sees 3 — two of them still PENDING_SIGNALS — and crosses into REVIEW at 43.95. Unscored attempts counting toward velocity is the whole point."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one customer, one device, one address."
            - "Pack P-VEL is ACTIVE (WEIGHTED 0.40/0.60, floors 40.00/60.00, window [2026-07-01, 2027-01-01)) holding exactly one rule VEL_CUSTOMER_1H (VELOCITY, 30 points, evaluation_order 10, not hard_decline), so no behavioural or identity rule can contaminate rule_score."
            - "Model M1 is ACTIVE (intercept 0.05, slope 1.20); every assessment uses model_raw_probability 0.4021 -> model_points 53.25."
            - "A1 and A2 are created and deliberately left in PENDING_SIGNALS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fraud/customers"
              payload: { email: "vel@example.com", home_country: "US" }
              as: CheckoutService
              captures: { cust_id: $.data.id }
            - call: "POST /fraud/devices"
              payload: { device_hash: "dev-vel-001", tz_offset_minutes: -480 }
              as: CheckoutService
              captures: { dev_id: $.data.id }
            - call: "POST /fraud/addresses"
              payload: { line1: "20 Velocity Rd", postal_code: "94105", country_code: "US" }
              as: CheckoutService
              captures: { addr_id: $.data.id }
            - call: "POST /fraud/rule-packs"
              payload: { version_label: "P-VEL", blend_mode: "WEIGHTED", rule_weight: 0.40, model_weight: 0.60, review_floor_score: 40.00, decline_floor_score: 60.00, effective_from: "2026-07-01T00:00:00Z", effective_until: "2027-01-01T00:00:00Z" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { pack_id: $.data.id }
            - call: "POST /fraud/rule-packs/${pack_id}/rules"
              payload: { code: "VEL_CUSTOMER_1H", signal_family: "VELOCITY", points: 30, evaluation_order: 10, hard_decline: false }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/rule-packs/${pack_id}/activate"
              payload: {}
              as: PolicyEngineer
              as_user_id: "eng-approver-2"
            - call: "POST /fraud/risk-models"
              payload: { model_version_label: "M1", calibration_intercept: 0.05, calibration_slope: 1.20 }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
              captures: { model_id: $.data.id }
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PUBLISH_SHADOW" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/risk-models/${model_id}/lifecycle"
              payload: { action: "PROMOTE" }
              as: PolicyEngineer
              as_user_id: "eng-author-1"
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { a1_id: $.data.id }
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { a2_id: $.data.id }
            - call: "POST /fraud/checkout-assessments"
              payload: { customer_id: "${cust_id}", device_profile_id: "${dev_id}", shipping_address_id: "${addr_id}", billing_address_id: "${addr_id}", amount_cents: 20000, card_bin: "411111", ip_country: "US", session_seconds: 30, cart_item_count: 3, model_raw_probability: 0.4021 }
              as: CheckoutService
              captures: { a3_id: $.data.id }
          trigger:
            - call: "POST /fraud/checkout-assessments/${a3_id}/score"
              payload: {}
