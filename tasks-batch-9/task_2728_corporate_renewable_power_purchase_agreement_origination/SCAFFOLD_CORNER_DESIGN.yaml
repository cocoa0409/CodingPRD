      - name: duplicate_allocation_blocks_a_live_share_but_not_a_withdrawn_one
        claim_type: violation_error
        grounds:
          - validations.priority_26_ERR_DUPLICATE_ALLOCATION
          - endpoints.POST_/ppa/deals/{id}/allocations
          - endpoints.POST_/ppa/allocations/{id}/decision
          - entities.DealAllocation.fields.status
        distinguishing_aspect: |
          Uniqueness here is scoped by status, not by the pair of ids. While the buyer
          holds a PROPOSED share a second proposal is refused, but once that share is
          WITHDRAWN the same buyer may propose a different size on the same deal - and
          the withdrawn row must survive as history rather than be overwritten. An
          implementation with a plain unique index on (deal_id, offtaker_id) cannot
          express this, and one that deletes on withdrawal loses the audit trail.
        test_recipe:
          setup:
            - "CHAIN A with the QUALIFIED Northwind buyer, a 100 MW project and a 25.000 MW deal that has been issued as a term sheet, so allocations are legal."
