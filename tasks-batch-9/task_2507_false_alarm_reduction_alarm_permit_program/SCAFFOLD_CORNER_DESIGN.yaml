              payload: { reported_dispatch_count: 2, reported_cancellation_count: 0, ecv_attempt_count: 1 }
              as: AlarmCompanyOperator
              as_user_id: "${company_id}"
              captures: { repA_v3: $.data.version, repA_corr1: $.data.correction_count }
            - &k_repA_flag2
