  - rule_id: resource_temporal_overlap
    instances:
      - name: room_window_half_open_touching_endpoints_allowed_but_one_minute_overlap_refused
        grounds:
          - validations[priority=25]
          - errors[ERR_ROOM_WINDOW_OVERLAP]
          - entities.RoomAssignment.fields.started_at
          - entities.RoomAssignment.fields.completed_at
        distinguishing_aspect: |
          The contended resource is the ROOM and the interval is HALF-OPEN, so a hand-off where one
          attendant finishes at 10:30:00.000Z and the next starts at exactly 10:30:00.000Z is legal,
          while backing the second start off by one minute to 10:29 makes the windows overlap and the
          completion is refused. Any implementation using closed intervals rejects the legal hand-off.
