            - "Brand.${brand}.counted_unit_count == 20 and coverage_status == COVERED and coverage_reason == COVERED_BY_UNIT_COUNT"
            - "Brand.${brand}.compliance_posture == COMPLIANT and standard_item_count == 1"

      - name: establishment_permanently_closed_is_terminal_and_rejects_reopening
        claim_type: terminal_state_lockdown
        grounds:
