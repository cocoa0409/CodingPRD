            - "recognized_ramped_cents == 1000000 and recognized_flat_cents == 1000000 (4 full years elapsed; final year absorbs rounding)"
            - "recognized_revenue_cents == 1000000"

  # ===========================================================================
  - section: calculations
    instances:
      - name: quote_without_published_schedule_returns_no_published_pricing
        claim_type: Input Set Filtering
        grounds:
          - calculations.calc_unit_price_quote
          - errors.ERR_NO_PUBLISHED_PRICING
        distinguishing_aspect: "The quote input set requires a PUBLISHED schedule with effective_from <= now; a part with no schedule at all yields ERR_NO_PUBLISHED_PRICING 422, not a zero price."
        test_recipe:
          setup: ["One part, no pricing schedule ever published."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LM386N-4", description: "Audio amp", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { c1_part: $.data.id }
          trigger:
            - call: "POST /pricing/quote"
              payload: { part_id: "${c1_part}", quantity: 10, channel: "DIRECT_ONLINE" }
              as: ChannelManager
              captures: { c1_err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_PUBLISHED_PRICING, HTTP 422"

      - name: schedule_supersede_switches_quote_price
        claim_type: Correct Result
        grounds:
          - calculations.calc_unit_price_quote
          - entities.PricingSchedule.fields.status
        distinguishing_aspect: "Publishing a second schedule supersedes the first: quotes immediately price from the new schedule (120 cents) and the old one reads SUPERSEDED in the part's schedule list."
        test_recipe:
          setup: ["Part with schedule S1 (effective 2026-08-01, 100 cents) published first."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "TL081CP", description: "JFET op amp", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR" }
              as: SupplyPlanner
              captures: { c2_part: $.data.id, c2_v1: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${c2_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${c2_v1}" }
              as: ChannelManager
            - call: "GET /parts/${c2_part}"
              payload: {}
              as: ChannelManager
              captures: { c2_v2: $.data.version }
          trigger:
            - call: "POST /pricing-schedules"
              payload: { part_id: "${c2_part}", effective_from: "2026-08-15T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 120 }], expected_part_version: "${c2_v2}" }
              as: ChannelManager
              captures: { c2_s2: $.data.id }
            - call: "POST /pricing/quote"
              payload: { part_id: "${c2_part}", quantity: 10, channel: "DIRECT_FIELD" }
              as: ChannelManager
              captures: { c2_price: $.data.unit_price_cents }
          assert:
            - "quote after supersede: unit_price_cents == 120 (the new schedule), not 100"
            - "GET /parts/${c2_part}/pricing-schedules: exactly 2 schedules; the 100-cent one has status SUPERSEDED, the 120-cent one PUBLISHED"
            - "part version advanced twice (create 1 -> publish 2 -> publish 3): GET /parts/${c2_part} shows version == 3"

      - name: buffer_posture_threshold_boundaries
        claim_type: Constants Applied
        grounds:
          - calculations.calc_buffer_position
          - entities.Part.fields.posture
        distinguishing_aspect: "Posture thresholds are inclusive at their lower bound: coverage exactly 0.75 is WATCH (not SHORTAGE) and exactly 1.0 is NORMAL (not WATCH) — receipts of 1170 then 390 against a 1560 target land exactly on both."
        test_recipe:
          setup: ["Part demand 40, buffer 1.5 -> target 1560. Pool with 5000 units."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LM339N", description: "Quad comparator", package_family: "PDIP", process_technology: "ANALOG_BIPOLAR", demand_rate_units_per_week: 40, buffer_multiple: 1.5 }
              as: SupplyPlanner
              captures: { c3_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 5000 }
              as: SupplyPlanner
              captures: { c3_pool: $.data.id }
            - call: "POST /parts/${c3_part}/receipts"
              payload: { capacity_pool_id: "${c3_pool}", units: 1170 }
              as: SupplyPlanner
          trigger:
            - call: "GET /parts/${c3_part}/inventory-position"
              payload: {}
              as: SupplyPlanner
              captures: { c3_cov_low: $.data.coverage_trailing, c3_pos_low: $.data.posture }
            - call: "POST /parts/${c3_part}/receipts"
              payload: { capacity_pool_id: "${c3_pool}", units: 390 }
              as: SupplyPlanner
            - call: "GET /parts/${c3_part}/inventory-position"
              payload: {}
              as: SupplyPlanner
              captures: { c3_cov_high: $.data.coverage_trailing, c3_pos_high: $.data.posture }
          assert:
            - "at on_hand 1170: coverage_trailing == 0.75 exactly and posture == WATCH (0.75 is inclusive in WATCH)"
            - "at on_hand 1560: coverage_trailing == 1.0 exactly and posture == NORMAL (1.0 is inclusive in NORMAL)"
            - "target_trailing_units == 1560 throughout"

      - name: ltb_price_locks_to_notice_date_schedule
        claim_type: Correct Result
        grounds:
          - calculations.calc_ltb_unit_price
          - entities.LifetimeBuy.fields.unit_price_cents
        distinguishing_aspect: "Chronological selector: the lifetime buy locks the price from the schedule effective at the NOTICE date (300 cents, effective 2026-08-01), not the schedule current at LTB placement (200 cents, effective 2026-08-15)."
        test_recipe:
          setup:
            - "Part demand 40/wk (LTB minimum 40*52 = 2080 units); on_hand 3000; S1 effective 2026-08-01 at 300 cents; S2 effective 2026-08-15 at 200 cents (S1 superseded)."
            - "EOL notice with notice_date 2026-08-10 (last_order 2027-02-06, last_ship 2027-05-07): between the two effective dates, so the notice-date price is S1's 300."
            - "Customer STRATEGIC / DIRECT_FIELD, credit 10000000."
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "LM317T-STEEL", description: "Regulator steel can", package_family: "TO39", process_technology: "ANALOG_BIPOLAR", demand_rate_units_per_week: 40, buffer_multiple: 1.5 }
              as: SupplyPlanner
              captures: { c4_part: $.data.id, c4_v0: $.data.version }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "ANALOG_BIPOLAR", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 5000 }
              as: SupplyPlanner
              captures: { c4_pool: $.data.id }
            - call: "POST /parts/${c4_part}/receipts"
              payload: { capacity_pool_id: "${c4_pool}", units: 3000 }
              as: SupplyPlanner
              captures: { c4_v1: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${c4_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 300 }], expected_part_version: "${c4_v1}" }
              as: ChannelManager
            - call: "GET /parts/${c4_part}"
              payload: {}
              as: ChannelManager
              captures: { c4_v2: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${c4_part}", effective_from: "2026-08-15T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 200 }], expected_part_version: "${c4_v2}" }
              as: ChannelManager
            - call: "POST /parts/${c4_part}/eol-notices"
              payload: { notice_date: "2026-08-10T00:00:00Z", last_order_date: "2027-02-06T00:00:00Z", last_ship_date: "2027-05-07T00:00:00Z", reason: "Package EOL" }
              as: SupplyPlanner
              captures: { c4_notice: $.data.id }
            - call: "POST /customers"
              payload: { name: "Legacy Systems", tier: "STRATEGIC", channel: "DIRECT_FIELD", credit_limit_cents: 10000000 }
              as: ChannelManager
              captures: { c4_cust: $.data.id }
          trigger:
            - call: "POST /lifetime-buys"
              payload: { eol_notice_id: "${c4_notice}", part_id: "${c4_part}", customer_id: "${c4_cust}", quantity: 2080 }
              as: Customer
              as_user_id: "${c4_cust}"
              captures: { c4_ltb: $.data.id, c4_price: $.data.unit_price_cents, c4_val: $.data.ltb_value_cents }
          assert:
            - "unit_price_cents == 300 (schedule effective at notice_date 2026-08-10), NOT 200 (the price current at placement)"
            - "ltb_value_cents == 624000 (300 * 2080)"
            - "status == APPROVED on creation"
            - "GET /parts/${c4_part}: reserved_units == 2080 (lifetime buy reserves stock at creation)"

      - name: allocation_tie_break_uses_order_created_at
        claim_type: Correct Result
        grounds:
          - calculations.calc_allocation_awards
          - calculations.calc_priority_score
        distinguishing_aspect: "Two STANDARD customers tie at score 40 with no design-win bonus; the waterfall's deterministic tie-break is SalesOrder.created_at ASC — the earlier-created order takes the last 10 units, the later one gets a zero-award entry."
        test_recipe:
          setup: ["Shortage part: demand 40, buffer 1.5 (target 1560), on_hand 10. Two STANDARD / DIRECT_FIELD customers with credit 1000000; orders of 10 units each submitted, the first created at 2026-09-01 and the second at 2026-09-02 (logical clock advanced between creations) — both BACKORDERED."]
          setup_api_calls:
            - call: "POST /parts"
              payload: { part_number: "TLV2371IDBVR", description: "RRIO single", package_family: "SOT23", process_technology: "CMOS_180NM", demand_rate_units_per_week: 40, buffer_multiple: 1.5 }
              as: SupplyPlanner
              captures: { c5_part: $.data.id }
            - call: "POST /capacity-pools"
              payload: { site_name: "DFAB", process_technology: "CMOS_180NM", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-01T00:00:00Z", total_units: 500 }
              as: SupplyPlanner
              captures: { c5_pool: $.data.id }
            - call: "POST /parts/${c5_part}/receipts"
              payload: { capacity_pool_id: "${c5_pool}", units: 10 }
              as: SupplyPlanner
              captures: { c5_v1: $.data.version }
            - call: "POST /pricing-schedules"
              payload: { part_id: "${c5_part}", effective_from: "2026-08-01T00:00:00Z", tiers: [{ min_qty: 1, unit_price_cents: 100 }], expected_part_version: "${c5_v1}" }
              as: ChannelManager
            - call: "POST /customers"
              payload: { name: "Early Bird", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { c5_cust1: $.data.id }
            - call: "POST /customers"
              payload: { name: "Late Comer", tier: "STANDARD", channel: "DIRECT_FIELD", credit_limit_cents: 1000000 }
              as: ChannelManager
              captures: { c5_cust2: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${c5_cust1}", lines: [{ part_id: "${c5_part}", quantity: 10 }] }
              as: Customer
              as_user_id: "${c5_cust1}"
              captures: { c5_o1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { customer_id: "${c5_cust2}", lines: [{ part_id: "${c5_part}", quantity: 10 }] }
              as: Customer
              as_user_id: "${c5_cust2}"
              captures: { c5_o2: $.data.id }
            - call: "POST /orders/${c5_o1}/submit"
              payload: {}
              as: Customer
              as_user_id: "${c5_cust1}"
            - call: "POST /orders/${c5_o2}/submit"
