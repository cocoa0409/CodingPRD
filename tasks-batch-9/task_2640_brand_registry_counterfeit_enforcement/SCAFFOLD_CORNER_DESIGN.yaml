            - "${claim_v2} is ${claim_v1} + 1 (opening PKG-1 bumped the claim) and InfringementClaim.${claim_id}.substantiation_score is still 85.00"
            - "the retry returns HTTP 201 with status ASSEMBLING, item_count 0, required_type_coverage 0 and completeness_score 0.0000"
            - "InfringementClaim.${claim_id}.version is ${claim_v2} + 1 after the successful create and both ${pkg1_id} and ${pkg2_id} are ASSEMBLING"

      - name: alias_link_with_a_stale_canonical_seller_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[alias-link-stale-canonical-seller]
          - errors[ERR_STALE_SELLER_VERSION]
        distinguishing_aspect: "Absorbing the first alias bumps the canonical row, so linking a second alias on the version read beforehand is ERR_STALE_SELLER_VERSION (412) — and the same link on the refreshed version returns 200, since a canonical seller may absorb any number of aliases."
        test_recipe:
          setup:
            - "A canonical seller and two alias candidates, all ACTIVE with zero strike points"
            - "The first alias is linked quoting the canonical seller's version 1"
