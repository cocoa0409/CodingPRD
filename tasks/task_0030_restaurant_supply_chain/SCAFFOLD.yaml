# =============================================================================
# Restaurant Chain Supply Chain System — SCAFFOLD (v1)
#
# Central kitchen production planning, store ordering, delivery route planning,
# inventory replenishment, near-expiry alerting, loss accounting, cost
# allocation, and event-driven synchronization with POS/ERP/finance/logistics.
# =============================================================================

scenario: |
  Restaurant chain supply chain system: central kitchen production planning with
  demand forecasting based on store orders, recipe-based ingredient explosion,
  production batch scheduling, equipment capacity constraints, and shelf-life-aware
  production sequencing; store ordering with store-level catalog permission,
  ordering window enforcement, minimum and maximum order quantity, order
  modification and cutoff rules, and order consolidation; delivery route planning
  with multi-store route optimization, vehicle capacity and temperature-zone
  constraints, time-window delivery requirements, driver assignment, and dynamic
  re-routing on exception; automatic inventory replenishment with safety-stock
  thresholds, replenishment cycle configuration, sales-velocity-based dynamic
  adjustment, replenishment order generation, and approval bypass rules for
  low-amount orders; near-expiry alerting with expiration-date tracking by batch,
  tiered alert thresholds, store-side promotion or transfer routing, mandatory
  disposal rules, and disposal record archiving; loss accounting with loss-cause
  classification (spoilage/damage/theft/preparation), responsibility attribution,
  financial-impact recording, periodic loss-rate analysis, and abnormal-loss
  investigation; cost allocation with central kitchen cost allocation to stores,
  transportation cost sharing rules, indirect cost allocation by sales or order
  volume, and inter-store transfer cost handling; event-driven synchronization
  with POS, ERP, finance, and logistics systems; audit logging for inventory
  adjustments and loss records.

domain_name: restaurant-supply-chain
api_prefix: /supply-chain

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
    - scheduled_deferred_actions

  entity_topology: graph
  # Recipe ↔ Ingredient is many-to-many through RecipeIngredient; StoreOrder ↔
  # ProductionBatch ↔ DeliveryRoute form a DAG of cross-aggregate references.

  state_machine_shape: branching
  # StoreOrder: DRAFT → SUBMITTED → CONSOLIDATED / CANCELLED
  # ProductionBatch: PLANNED → SCHEDULED → IN_PRODUCTION → COMPLETED / FAILED
  # DeliveryRoute: PLANNED → DISPATCHED → IN_TRANSIT → COMPLETED / EXCEPTION → REROUTED
  # ReplenishmentRule: ACTIVE → SUSPENDED (cyclic between active and suspended)

  relationship_patterns:
    - many_to_many              # Recipe ↔ Ingredient via RecipeIngredient
    - one_to_many               # Store → StoreOrder, StoreOrder → OrderLine
    - cross_aggregate           # ProductionBatch references aggregated OrderLines from many StoreOrders
    - polymorphic               # AuditLogEntry.target_type ∈ {InventoryBatch, LossRecord}

  role_model: peer_roles
  # CentralKitchenPlanner owns production; StoreManager owns store-side ops;
  # Driver owns route execution; FinanceController owns cost allocation and
  # loss approval. PlatformAdmin is opaque hierarchical override.

  consistency_model: immediate
  # All cascades execute within the same request; cross-system sync events are
  # emitted into the audit log but not awaited.

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code,            type: string,   source: input,    description: "Public store code, e.g. S-001; case-sensitive unique." }
      - { name: name,                  type: string,   source: input,    description: "Display name." }
      - { name: temperature_zone,      type: enum,     source: input,    description: "Storage capability: AMBIENT | CHILLED | FROZEN | MIXED.", constraints: "AMBIENT|CHILLED|FROZEN|MIXED" }
      - { name: catalog_permission,    type: array,    source: input,    description: "Allow-list of recipe_ids this store may order; empty array = no permission." }
      - { name: order_window_open_minute,  type: integer, source: input, description: "Minute-of-day (0..1439) when daily ordering window opens (UTC)." }
      - { name: order_window_close_minute, type: integer, source: input, description: "Minute-of-day (0..1439) when ordering window closes; must be > open." }
      - { name: cutoff_minutes_before_close, type: integer, source: input, default: 60, description: "Modifications/cancellations forbidden within this many minutes of close." }
      - { name: low_amount_bypass_cents, type: integer, source: input, default: 50000, description: "Replenishment orders strictly below this total auto-approve." }
      - { name: avg_daily_sales_cents, type: integer,  source: computed, description: "Read-only: rolling 7-day mean of fulfilled order line value, in cents." }
      - { name: status,                type: enum,     source: system,   description: "ACTIVE | SUSPENDED.", constraints: "ACTIVE|SUSPENDED" }

  - name: Recipe
    parent: null
    common_fields: true
    fields:
      - { name: recipe_code,           type: string,   source: input,    description: "Public recipe code; unique across the chain." }
      - { name: name,                  type: string,   source: input,    description: "Display name." }
      - { name: temperature_zone,      type: enum,     source: input,    description: "Required storage zone: AMBIENT | CHILLED | FROZEN.", constraints: "AMBIENT|CHILLED|FROZEN" }
      - { name: shelf_life_hours,      type: integer,  source: input,    description: "Hours from production complete to expiry; > 0." }
      - { name: production_minutes_per_unit, type: number, source: input, description: "Equipment-minutes per unit produced; > 0." }
      - { name: equipment_class,       type: enum,     source: input,    description: "Equipment class required: OVEN | FRYER | MIXER | ASSEMBLY.", constraints: "OVEN|FRYER|MIXER|ASSEMBLY" }
      - { name: unit_price_cents,      type: integer,  source: input,    description: "Selling price per unit, in cents (used for cost allocation)." }
      - { name: status,                type: enum,     source: system,   description: "ACTIVE | RETIRED.", constraints: "ACTIVE|RETIRED" }

  - name: Ingredient
    parent: null
    common_fields: true
    fields:
      - { name: sku,                   type: string,   source: input,    description: "Stock-keeping unit; unique." }
      - { name: name,                  type: string,   source: input,    description: "Display name." }
      - { name: unit,                  type: string,   source: input,    description: "Base unit (e.g. kg, l, ea)." }
      - { name: shelf_life_hours,      type: integer,  source: input,    description: "Raw shelf life from receipt; > 0." }
      - { name: unit_cost_cents,       type: integer,  source: input,    description: "Standard cost per base unit, in cents." }

  - name: RecipeIngredient
    parent: null
    common_fields: false           # immutable junction
    fields:
      - { name: recipe_id,             type: string,   source: input,    description: "FK Recipe.id." }
      - { name: ingredient_id,         type: string,   source: input,    description: "FK Ingredient.id." }
      - { name: quantity_per_unit,     type: number,   source: input,    description: "Base-unit quantity required to produce one Recipe unit; > 0." }

  - name: StoreOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id,              type: string,   source: input,    description: "FK Store.id." }
      - { name: target_delivery_date,  type: string,   source: input,    description: "ISO date (YYYY-MM-DD) of intended delivery." }
      - { name: submitted_at,          type: datetime, source: system,   description: "Set when status moves to SUBMITTED." }
      - { name: cancelled_at,          type: datetime, source: system,   description: "Set when status moves to CANCELLED." }
      - { name: total_units,           type: integer,  source: computed, description: "Sum of quantity over all OrderLines." }
      - { name: total_value_cents,     type: integer,  source: computed, description: "Sum of OrderLine.line_value_cents (provisional valuation)." }
      - { name: consolidation_batch_id, type: string,  source: system,   description: "FK ProductionBatch.id once consolidated; null otherwise." }
      - { name: status,                type: enum,     source: system,   description: "DRAFT | SUBMITTED | CONSOLIDATED | DELIVERED | CANCELLED.", constraints: "DRAFT|SUBMITTED|CONSOLIDATED|DELIVERED|CANCELLED" }

  - name: OrderLine
    parent: StoreOrder
    common_fields: false           # immutable; drafted via store-order endpoints
    fields:
      - { name: store_order_id,        type: string,   source: system,   description: "FK StoreOrder.id." }
      - { name: recipe_id,             type: string,   source: input,    description: "FK Recipe.id; must be in store's catalog_permission." }
      - { name: quantity,              type: integer,  source: input,    description: "Units ordered; >= MIN_ORDER_UNITS, <= MAX_ORDER_UNITS." }
      - { name: line_value_cents,      type: integer,  source: computed, description: "quantity × Recipe.unit_price_cents, locked at submission time." }

  - name: ProductionBatch
    parent: null
    common_fields: true
    fields:
      - { name: recipe_id,             type: string,   source: input,    description: "FK Recipe.id; one batch per recipe per planning run." }
      - { name: planned_units,         type: integer,  source: computed, description: "Sum of consolidated OrderLine.quantity across SUBMITTED orders for the target date." }
      - { name: forecast_units,        type: integer,  source: computed, description: "Demand forecast (forward-looking) for the target date; may differ from planned_units." }
      - { name: equipment_minutes,     type: number,   source: computed, description: "planned_units × Recipe.production_minutes_per_unit." }
      - { name: scheduled_start_at,    type: datetime, source: computed, description: "Server-assigned start; assigned by shelf-life-aware sequencing." }
      - { name: scheduled_end_at,      type: datetime, source: computed, description: "scheduled_start_at + equipment_minutes (rounded up to whole minutes)." }
      - { name: produced_at,           type: datetime, source: system,   description: "Set when batch transitions to COMPLETED (production complete time)." }
      - { name: expires_at,            type: datetime, source: computed, description: "produced_at + Recipe.shelf_life_hours; null until COMPLETED." }
      - { name: target_delivery_date,  type: string,   source: input,    description: "ISO date the batch is consolidated for." }
      - { name: status,                type: enum,     source: system,   description: "PLANNED | SCHEDULED | IN_PRODUCTION | COMPLETED | FAILED.", constraints: "PLANNED|SCHEDULED|IN_PRODUCTION|COMPLETED|FAILED" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_code,          type: string,   source: input,    description: "Unique vehicle code." }
      - { name: capacity_units,        type: integer,  source: input,    description: "Total unit capacity; > 0." }
      - { name: temperature_zones,     type: array,    source: input,    description: "Subset of {AMBIENT, CHILLED, FROZEN}; non-empty." }
      - { name: status,                type: enum,     source: system,   description: "AVAILABLE | ASSIGNED | OUT_OF_SERVICE.", constraints: "AVAILABLE|ASSIGNED|OUT_OF_SERVICE" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id,            type: string,   source: input,    description: "FK Vehicle.id." }
      - { name: driver_user_id,        type: string,   source: input,    description: "Opaque user id of the assigned driver." }
      - { name: planned_stops,         type: array,    source: input,    description: "Ordered list of objects {store_id, time_window_start, time_window_end, batch_ids[]}." }
      - { name: total_units_loaded,    type: integer,  source: computed, description: "Sum of batch units loaded across stops; must be ≤ vehicle capacity." }
      - { name: required_zones,        type: array,    source: computed, description: "Set-union of zones across all batches loaded; must ⊆ Vehicle.temperature_zones." }
      - { name: target_delivery_date,  type: string,   source: input,    description: "ISO date. All ProductionBatches loaded must share this date." }
      - { name: dispatched_at,         type: datetime, source: system,   description: "Set on DISPATCHED transition." }
      - { name: completed_at,          type: datetime, source: system,   description: "Set on COMPLETED transition." }
      - { name: exception_reason,      type: string,   source: input,    description: "Free-text reason on EXCEPTION transition; null otherwise." }
      - { name: status,                type: enum,     source: system,   description: "PLANNED | DISPATCHED | IN_TRANSIT | COMPLETED | EXCEPTION | REROUTED.", constraints: "PLANNED|DISPATCHED|IN_TRANSIT|COMPLETED|EXCEPTION|REROUTED" }

  - name: InventoryBatch
    parent: Store
    common_fields: true
    fields:
      - { name: store_id,              type: string,   source: system,   description: "FK Store.id." }
      - { name: recipe_id,             type: string,   source: input,    description: "FK Recipe.id." }
      - { name: production_batch_id,   type: string,   source: input,    description: "FK ProductionBatch.id (origin batch)." }
      - { name: quantity_on_hand,      type: integer,  source: computed, description: "Current units; decremented by sales, transfers, losses, disposal." }
      - { name: received_at,           type: datetime, source: system,   description: "When DeliveryRoute completion delivered this stock." }
      - { name: expires_at,            type: datetime, source: system,   description: "Copied from ProductionBatch.expires_at at receipt." }
      - { name: alert_tier,            type: enum,     source: computed, description: "NONE | TIER1 | TIER2 | TIER3 (most urgent); derived from hours_to_expiry.", constraints: "NONE|TIER1|TIER2|TIER3" }
      - { name: status,                type: enum,     source: system,   description: "ON_HAND | DEPLETED | DISPOSED | TRANSFERRED_OUT.", constraints: "ON_HAND|DEPLETED|DISPOSED|TRANSFERRED_OUT" }

  - name: ReplenishmentRule
    parent: Store
    common_fields: true
    fields:
      - { name: store_id,              type: string,   source: system,   description: "FK Store.id." }
      - { name: recipe_id,             type: string,   source: input,    description: "FK Recipe.id; one rule per (store, recipe)." }
      - { name: safety_stock_units,    type: integer,  source: input,    description: "Reorder when inventory ≤ this; >= 0." }
      - { name: replenish_to_units,    type: integer,  source: input,    description: "Target stock level after replenishment; > safety_stock_units." }
      - { name: cycle_hours,           type: integer,  source: input,    description: "Minimum hours between replenishment evaluations for this rule; > 0." }
      - { name: velocity_multiplier,   type: number,   source: computed, description: "Read-only: 1.0 baseline; recomputed per ops-run from rolling sales velocity." }
      - { name: last_evaluated_at,     type: datetime, source: system,   description: "Last replenishment-sweep tick at which this rule fired or was skipped." }
      - { name: status,                type: enum,     source: system,   description: "ACTIVE | SUSPENDED.", constraints: "ACTIVE|SUSPENDED" }

  - name: LossRecord
    parent: Store
    common_fields: true
    fields:
      - { name: store_id,              type: string,   source: system,   description: "FK Store.id." }
      - { name: inventory_batch_id,    type: string,   source: input,    description: "FK InventoryBatch.id." }
      - { name: quantity_lost,         type: integer,  source: input,    description: "Units lost; > 0 and ≤ batch quantity_on_hand at time of recording." }
      - { name: cause,                 type: enum,     source: input,    description: "SPOILAGE | DAMAGE | THEFT | PREPARATION.", constraints: "SPOILAGE|DAMAGE|THEFT|PREPARATION" }
      - { name: responsibility_user_id, type: string,  source: input,    description: "Opaque user id attributed for the loss; required when cause ∈ {DAMAGE, THEFT, PREPARATION}, must be null when cause = SPOILAGE." }
      - { name: financial_impact_cents, type: integer, source: computed, description: "quantity_lost × Recipe.unit_price_cents at the time of recording, locked." }
      - { name: is_abnormal,           type: boolean,  source: computed, description: "True if event-level loss-rate threshold crossed at time of recording." }
      - { name: investigation_status,  type: enum,     source: system,   description: "NONE | PENDING | RESOLVED. Becomes PENDING automatically when is_abnormal=true.", constraints: "NONE|PENDING|RESOLVED" }
      - { name: status,                type: enum,     source: system,   description: "RECORDED | APPROVED | REVERSED.", constraints: "RECORDED|APPROVED|REVERSED" }

  - name: AuditLogEntry
    parent: null
    common_fields: false           # immutable, append-only
    fields:
      - { name: target_type,           type: enum,     source: system,   description: "InventoryBatch | LossRecord | StoreOrder | ProductionBatch | DeliveryRoute.", constraints: "InventoryBatch|LossRecord|StoreOrder|ProductionBatch|DeliveryRoute" }
      - { name: target_id,             type: string,   source: system,   description: "id of the target entity." }
      - { name: action,                type: string,   source: system,   description: "Short verb (e.g. ADJUST_STOCK, RECORD_LOSS, APPROVE_LOSS, DISPATCH_ROUTE, EXCEPTION_REROUTE, REPLENISHMENT_GENERATE)." }
      - { name: actor_role,            type: string,   source: system,   description: "Role string of the request actor." }
      - { name: actor_user_id,         type: string,   source: system,   description: "X-User-ID of the request actor." }
      - { name: payload,               type: object,   source: system,   description: "Frozen JSON snapshot of relevant fields before/after the change." }
      - { name: external_systems,      type: array,    source: system,   description: "Subset of {POS, ERP, FINANCE, LOGISTICS} the action is synchronized with." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: StoreOrder
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:

      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /supply-chain/store-orders/{id}/submit"
        actor: StoreManager
        preconditions:
          - "Now is within Store.order_window_open_minute..order_window_close_minute (UTC, minute-of-day)."
          - "Store.status == ACTIVE."
          - "OrderLine count >= 1."
          - "Every OrderLine.recipe_id ∈ Store.catalog_permission."
          - "Every OrderLine.quantity is in [MIN_ORDER_UNITS, MAX_ORDER_UNITS]."
        side_effects:
          - "Each OrderLine.line_value_cents = quantity × Recipe.unit_price_cents (locked)."
          - "StoreOrder.total_units, total_value_cents recomputed."
          - "submitted_at = now()."
          - "AuditLogEntry appended (action=SUBMIT_ORDER, external_systems=[POS,ERP])."

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /supply-chain/store-orders/{id}/cancel"
        actor: StoreManager
        preconditions:
          - "Now is at least Store.cutoff_minutes_before_close before order_window_close_minute (otherwise ERR_ORDER_CUTOFF_PASSED)."
        side_effects:
          - "cancelled_at = now()."
          - "AuditLogEntry appended."

      - from: SUBMITTED
        to: CANCELLED
        trigger: "POST /supply-chain/store-orders/{id}/cancel"
        actor: StoreManager
        preconditions:
          - "Now is at least Store.cutoff_minutes_before_close before order_window_close_minute (otherwise ERR_ORDER_CUTOFF_PASSED)."
          - "consolidation_batch_id is null (cannot cancel after consolidation)."
        side_effects:
          - "cancelled_at = now()."
          - "AuditLogEntry appended."

      - from: SUBMITTED
        to: CONSOLIDATED
        trigger: "POST /supply-chain/production-batches/consolidate (consolidation sweep)"
        actor: CentralKitchenPlanner
        preconditions:
          - "StoreOrder.target_delivery_date == request.target_delivery_date."
          - "Store.status == ACTIVE (cross-entity dependency: Store)."
        side_effects:
          - "consolidation_batch_id is set per (recipe_id, target_delivery_date)."
          - "ProductionBatch records are created/updated (planned_units recomputed)."
          - "AuditLogEntry appended."

      - from: CONSOLIDATED
        to: DELIVERED
        trigger: "POST /supply-chain/delivery-routes/{id}/complete"
        actor: Driver
        preconditions:
          - "DeliveryRoute that carries this StoreOrder's stop transitions PLANNED→…→COMPLETED."
        side_effects:
          - "InventoryBatch rows are created at the receiving Store (cascade depth ≥ 3 — see §1.3.replenishment_signal)."
          - "AuditLogEntry appended."

  - entity: ProductionBatch
    initial_state: PLANNED
    terminal_states: [COMPLETED, FAILED]
    transitions:

      - from: PLANNED
        to: SCHEDULED
        trigger: "POST /supply-chain/production-batches/{id}/schedule"
        actor: CentralKitchenPlanner
        preconditions:
          - "Equipment-class capacity for the chosen window has remaining minutes ≥ equipment_minutes (otherwise ERR_EQUIPMENT_CAPACITY_EXCEEDED)."
          - "Shelf-life-aware ordering: scheduled_start_at + equipment_minutes + Recipe.shelf_life_hours ≥ target_delivery_date 23:59 UTC (otherwise ERR_SHELF_LIFE_INSUFFICIENT)."
        side_effects:
          - "scheduled_start_at, scheduled_end_at written (per shelf_life_sequencing calculation §1.3)."
          - "AuditLogEntry appended (external_systems=[ERP])."

      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "POST /supply-chain/production-batches/{id}/start"
        actor: CentralKitchenPlanner
        preconditions: ["now() >= scheduled_start_at (use POST /_clock/advance to reach)."]
        side_effects: ["AuditLogEntry appended."]

      - from: IN_PRODUCTION
        to: COMPLETED
        trigger: "POST /supply-chain/production-batches/{id}/complete"
        actor: CentralKitchenPlanner
        preconditions: ["now() >= scheduled_start_at."]
        side_effects:
          - "produced_at = now()."
          - "expires_at = produced_at + Recipe.shelf_life_hours."
          - "Linked StoreOrders may transition CONSOLIDATED→DELIVERED via subsequent DeliveryRoute completion."
          - "AuditLogEntry appended (external_systems=[ERP,LOGISTICS])."

      - from: IN_PRODUCTION
        to: FAILED
        trigger: "POST /supply-chain/production-batches/{id}/fail"
        actor: CentralKitchenPlanner
        preconditions: []
        side_effects:
          - "Linked StoreOrders that were CONSOLIDATED revert to SUBMITTED with consolidation_batch_id cleared (compensating cascade — see §1.3.compensation_invariant)."
          - "AuditLogEntry appended."

  - entity: DeliveryRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:

      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /supply-chain/delivery-routes/{id}/dispatch"
        actor: CentralKitchenPlanner
        preconditions:
          - "Vehicle.status == AVAILABLE (cross-entity dependency: Vehicle)."
          - "total_units_loaded ≤ Vehicle.capacity_units (otherwise ERR_VEHICLE_CAPACITY_EXCEEDED)."
          - "required_zones ⊆ Vehicle.temperature_zones (otherwise ERR_TEMPERATURE_ZONE_INCOMPATIBLE)."
          - "Every loaded ProductionBatch is in COMPLETED state (cross-entity dependency: ProductionBatch)."
          - "Each planned_stops[i].time_window_start < time_window_end and stops do not overlap on the same vehicle (otherwise ERR_DELIVERY_WINDOW_OVERLAP)."
        side_effects:
          - "Vehicle.status flips AVAILABLE→ASSIGNED."
          - "dispatched_at = now()."
          - "AuditLogEntry appended (external_systems=[LOGISTICS])."

      - from: DISPATCHED
        to: IN_TRANSIT
        trigger: "POST /supply-chain/delivery-routes/{id}/depart"
        actor: Driver
        preconditions: ["Driver X-User-ID matches driver_user_id."]
        side_effects: ["AuditLogEntry appended."]

      - from: IN_TRANSIT
        to: COMPLETED
        trigger: "POST /supply-chain/delivery-routes/{id}/complete"
        actor: Driver
        preconditions: ["Driver X-User-ID matches driver_user_id."]
        side_effects:
          - "completed_at = now()."
          - "Vehicle.status flips ASSIGNED→AVAILABLE."
          - "For each stop: an InventoryBatch is created at the receiving Store, copying ProductionBatch.expires_at."
          - "Each linked StoreOrder transitions CONSOLIDATED→DELIVERED."
          - "AuditLogEntry appended (external_systems=[LOGISTICS,POS])."

      - from: IN_TRANSIT
        to: EXCEPTION
        trigger: "POST /supply-chain/delivery-routes/{id}/raise-exception"
        actor: Driver
        preconditions: ["exception_reason is non-empty."]
        side_effects:
          - "AuditLogEntry appended (external_systems=[LOGISTICS])."

      - from: EXCEPTION
        to: REROUTED
        trigger: "POST /supply-chain/delivery-routes/{id}/reroute"
        actor: CentralKitchenPlanner
        preconditions:
          - "Replacement Vehicle (request.replacement_vehicle_id) is AVAILABLE."
          - "Replacement vehicle satisfies capacity and temperature-zone constraints."
        side_effects:
          - "Original Vehicle.status flips ASSIGNED→AVAILABLE."
          - "Replacement Vehicle.status flips AVAILABLE→ASSIGNED."
          - "vehicle_id is updated; planned_stops are preserved."
          - "AuditLogEntry appended (action=EXCEPTION_REROUTE, external_systems=[LOGISTICS])."

      - from: REROUTED
        to: IN_TRANSIT
        trigger: "POST /supply-chain/delivery-routes/{id}/depart"
        actor: Driver
        preconditions: ["Driver X-User-ID matches driver_user_id."]
        side_effects: ["AuditLogEntry appended."]

  - entity: InventoryBatch
    initial_state: ON_HAND
    terminal_states: [DEPLETED, DISPOSED, TRANSFERRED_OUT]
    transitions:

      - from: ON_HAND
        to: DEPLETED
        trigger: "POST /supply-chain/inventory-batches/{id}/adjust  (with delta that brings quantity_on_hand to 0)"
        actor: StoreManager
        preconditions: ["quantity_on_hand + delta == 0."]
        side_effects:
          - "AuditLogEntry appended (action=ADJUST_STOCK)."
          - "If alert_tier was TIER3, an automatic TIER3-to-DISPOSED transition is NOT triggered (depleted ≠ disposed)."

      - from: ON_HAND
        to: DISPOSED
        trigger: "POST /supply-chain/inventory-batches/{id}/dispose"
        actor: StoreManager
        preconditions:
          - "alert_tier == TIER3 OR now() >= expires_at (mandatory disposal)."
        side_effects:
          - "A LossRecord is auto-created with cause=SPOILAGE, quantity_lost=quantity_on_hand."
          - "AuditLogEntry appended (action=DISPOSE_STOCK)."
          - "DisposalRecord (immutable archival) is appended via AuditLogEntry payload."

      - from: ON_HAND
        to: TRANSFERRED_OUT
        trigger: "POST /supply-chain/inventory-batches/{id}/transfer"
        actor: StoreManager
        preconditions:
          - "Destination Store.status == ACTIVE (cross-entity dependency: Store)."
          - "Destination Store.temperature_zone supports Recipe.temperature_zone."
          - "alert_tier ∈ {TIER1, TIER2} (TIER3 must be disposed; NONE has no near-expiry justification)."
        side_effects:
          - "A new InventoryBatch is created at the destination store with copied expires_at and equal quantity_on_hand."
          - "AuditLogEntry appended (action=INTER_STORE_TRANSFER, external_systems=[FINANCE])."

  - entity: LossRecord
    initial_state: RECORDED
    terminal_states: [APPROVED, REVERSED]
    transitions:

      # Recording (POST /loss-records) IMMEDIATELY decrements
      # InventoryBatch.quantity_on_hand by quantity_lost — the inventory
      # reflects the loss as soon as it is recorded. APPROVED and REVERSED
      # are accounting-state transitions; only REVERSED restores the stock.
      - from: RECORDED
        to: APPROVED
        trigger: "POST /supply-chain/loss-records/{id}/approve"
        actor: FinanceController
        preconditions:
          - "If is_abnormal == true, investigation_status MUST be RESOLVED (otherwise ERR_INVESTIGATION_PENDING)."
        side_effects:
          - "AuditLogEntry appended (action=APPROVE_LOSS, external_systems=[FINANCE])."
          - "No further change to InventoryBatch.quantity_on_hand (already decremented at RECORDED creation)."

      - from: RECORDED
        to: REVERSED
        trigger: "POST /supply-chain/loss-records/{id}/reverse"
        actor: FinanceController
        preconditions: []
        side_effects:
          - "InventoryBatch.quantity_on_hand incremented by quantity_lost (compensates the decrement at recording)."
          - "AuditLogEntry appended."

  - entity: ReplenishmentRule
    initial_state: ACTIVE
    terminal_states: []
    transitions:

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /supply-chain/replenishment-rules/{id}/suspend"
        actor: StoreManager
        preconditions: []
        side_effects: ["AuditLogEntry appended."]

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /supply-chain/replenishment-rules/{id}/activate"
        actor: StoreManager
        preconditions: []
        side_effects: ["AuditLogEntry appended."]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:

  - scenario: "Two planners simultaneously schedule the same ProductionBatch onto overlapping equipment-minute windows that would together exceed equipment-class capacity."
    guarantee: "At most one schedule succeeds; the other is rejected. The capacity check is serialized so the second writer sees the first writer's reservation."
    error_id: ERR_EQUIPMENT_CAPACITY_EXCEEDED
    http_status: 409
    serialization: "First-writer-wins on equipment-class minute reservation per scheduled day."

  - scenario: "Two planners simultaneously dispatch DeliveryRoutes that share the same Vehicle."
    guarantee: "Only the first dispatch transitions Vehicle.status AVAILABLE→ASSIGNED; the second loses."
    error_id: ERR_VEHICLE_NOT_AVAILABLE
    http_status: 409
    serialization: "First-writer-wins on Vehicle.status."

  - scenario: "Driver completes a DeliveryRoute while a planner simultaneously triggers reroute for the same exception."
    guarantee: "Exactly one operation succeeds; loser's state precondition is no longer met."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on DeliveryRoute.status; uses optimistic version field."

  - scenario: "Store manager submits the same StoreOrder twice in rapid succession (e.g., double-clicked Submit)."
    guarantee: "Only the first submit transitions DRAFT→SUBMITTED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on StoreOrder.status."

  - scenario: "Replenishment sweep and a manager-initiated manual replenishment both try to generate a replenishment StoreOrder for the same (store_id, recipe_id, cycle window)."
    guarantee: "At most one replenishment StoreOrder per (store_id, recipe_id, cycle window); second attempt is rejected."
    error_id: ERR_REPLENISHMENT_DUPLICATE
    http_status: 409
    serialization: "First-writer-wins on the (store_id, recipe_id, last_evaluated_at-bucketed-by-cycle_hours) tuple."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: ingredient_explosion_planned
    trigger: "POST /supply-chain/production-batches/consolidate (per ProductionBatch row)"
    algorithm: aggregation
    formula: |
      ingredient_demand[ingredient_id] =
        sum_over_OrderLines(
          OrderLine.quantity ×
          RecipeIngredient.quantity_per_unit
        )
        WHERE OrderLine.store_order_id IN
              StoreOrder.{status==SUBMITTED, target_delivery_date==request.target_delivery_date}
          AND RecipeIngredient.recipe_id == OrderLine.recipe_id
      group by RecipeIngredient.ingredient_id
    input_set: |
      All OrderLines belonging to StoreOrders with status=SUBMITTED and matching
      target_delivery_date. Excludes DRAFT, CANCELLED, CONSOLIDATED, DELIVERED.
      Cancelled lines are excluded. Tie-break: aggregation result ordered by
      ingredient_id ascending in response.
    constants: {}
    precision: "integer multiplication then sum; ingredient quantities expressed in milligrams (integer) to avoid float drift."

  - name: ingredient_explosion_forecast
    trigger: "GET /supply-chain/production-batches/{id}/forecast"
    algorithm: forward_looking
    formula: |
      forecast_units[recipe_id] =
        sum_over_Stores(
          ROUND_HALF_UP(
            Store.avg_daily_sales_cents / Recipe.unit_price_cents *
            FORECAST_HORIZON_DAYS *
            ReplenishmentRule.velocity_multiplier
          )
        )
        WHERE Store.status == ACTIVE
          AND ReplenishmentRule.{store_id==Store.id, recipe_id==recipe_id, status==ACTIVE}
      forecast_ingredient_demand[ingredient_id] =
        sum_over_recipes( forecast_units[recipe_id] × RecipeIngredient.quantity_per_unit )
    input_set: |
      Projection from rolling sales velocity. Identical recipe set as
      ingredient_explosion_planned but inputs are forecast units, not order-line
      units. The two algorithms produce different aggregate values for the same
      target date — this is the dual-variant pair.
    constants:
      FORECAST_HORIZON_DAYS: 1
    precision: "ROUND_HALF_UP to integer units; intermediate values in floating multiplication, rounded once at the per-recipe boundary."
    variants:
      - name: planned_vs_forecast
        when: "Comparing same target_delivery_date with same store population"
        difference: "ingredient_explosion_planned uses actual SUBMITTED OrderLine units; ingredient_explosion_forecast projects from sales velocity. They generally yield different ingredient demand totals — planners reconcile manually."

  - name: shelf_life_sequencing
    trigger: "POST /supply-chain/production-batches/{id}/schedule"
    algorithm: topological
    formula: |
      # All PLANNED batches awaiting scheduling for the same target_delivery_date
      # are placed on the equipment timeline.
      #
      # Sort key (ascending):
      #   1. Recipe.shelf_life_hours      (shorter shelf life FIRST — produced LATER)
      # Wait — produce shorter-life items LATER so they reach stores fresher.
      # Equivalent expressed by descending start time:
      #
      # ordered_batches = SORT_ASC(PLANNED_batches, key=Recipe.shelf_life_hours)
      # then schedule from latest possible slot backwards on each equipment line:
      #   for batch in ordered_batches (shortest shelf_life first):
      #     pick latest free contiguous window of length equipment_minutes on
      #     equipment_class line such that
      #       window.start + equipment_minutes + shelf_life_hours
      #         >= target_delivery_date 23:59 UTC
      #
      # Tie-break when shelf_life_hours equal: Recipe.recipe_code ascending.
    input_set: |
      All ProductionBatch rows with status==PLANNED and matching
      target_delivery_date. Equipment-class capacity per day is 8 hours
      (480 minutes) per equipment_class.
    constants:
      EQUIPMENT_MINUTES_PER_CLASS_PER_DAY: 480
    precision: "minutes (integer); all rounding via ceil() of equipment_minutes."

  - name: provisional_cost_allocation
    trigger: "POST /supply-chain/production-batches/{id}/complete"
    algorithm: weighted_scoring
    formula: |
      # Per-batch production cost is allocated to receiving stores.
      ingredient_cost_cents = sum_over_RecipeIngredient(
        Recipe.{this batch}.RecipeIngredient.quantity_per_unit *
        Ingredient.unit_cost_cents *
        ProductionBatch.planned_units
      )
      total_cost_cents = ingredient_cost_cents + BATCH_SETUP_FEE_CENTS
      # ingredient_cost is per-unit-scaled; BATCH_SETUP_FEE_CENTS is a fixed per
      # batch overhead that must be split by share — it is the source of
      # fractional per-store allocations.
      for store in receiving_stores(batch):
        store_share = OrderLine.quantity_for(store, batch) / ProductionBatch.planned_units
        per_store_raw = total_cost_cents * store_share         # may be non-integer
        per_store_alloc = ROUND_HALF_UP(per_store_raw)         # PINNED: round per-store FIRST
        store.provisional_allocated_cost_cents += per_store_alloc
      # PINNED ROUNDING ORDER:
      #   1. Multiply total_cost_cents × store_share (no intermediate round).
      #   2. Round per-store via round_half_up to integer cents.
      #   3. Sum rounded per-store allocations.
      #   4. If sum != total_cost_cents, assign the remainder to the store with
      #      the largest store_share. Tie-break: lowest Store.store_code wins.
    input_set: |
      Receiving stores for a batch are exactly the stores whose SUBMITTED
      StoreOrders contributed OrderLines that are part of this batch. Excludes
      stores whose orders later CANCELLED before consolidation.
    constants:
      BATCH_SETUP_FEE_CENTS: 100
    precision: "Integer cents. Round-half-up at the per-store boundary; sum-then-distribute remainder to top-share store (tie-break: lowest store_code)."

  - name: final_cost_allocation
    trigger: "POST /supply-chain/cost-allocations/run (period close)"
    algorithm: chronological
    formula: |
      # For period [period_start, period_end):
      # 1. Direct production cost: sum of provisional allocations on
      #    ProductionBatch.completed_at within the period.
      # 2. Transportation cost: distributed across stops on a route by
      #    TRANSPORT_DISTRIBUTION (UNITS_LOADED — see variant).
      # 3. Indirect cost (overhead): allocated by INDIRECT_BASIS where
      #    base ∈ {SALES_VALUE, ORDER_VOLUME}.
      # 4. Inter-store transfer cost: charged to the SENDING store at
      #    Recipe.unit_price_cents × quantity_transferred × TRANSFER_OVERHEAD_RATE,
      #    refunded to RECEIVING store.
      #
      # Final = Direct + Transport + Indirect + Transfer
      # Order of operations is chronological: each event (batch completion,
      # delivery completion, transfer, sale) is processed by event timestamp,
      # ascending, and contributes to running per-store accumulators.
      # Tie-break on identical timestamps: AuditLogEntry.id ascending.
    input_set: |
      Events within [period_start, period_end). Excludes REVERSED LossRecords.
      INDIRECT_BASIS is a config value chosen at /run time: either
      SALES_VALUE (uses StoreOrder.total_value_cents) or ORDER_VOLUME (uses
      StoreOrder.total_units count). They produce different final allocations
      for the same period and stores — the dual-variant pair.
    constants:
      TRANSFER_OVERHEAD_RATE: 0.10
      INDIRECT_OVERHEAD_PCT: 0.15
    precision: "Integer cents; round per (store, cost_bucket) pair, then sum. Remainder to top-volume store."
    variants:
      - name: indirect_basis_sales_vs_volume
        when: "Period contains stores with materially different price-per-unit profiles"
        difference: "INDIRECT_BASIS=SALES_VALUE charges in proportion to revenue; INDIRECT_BASIS=ORDER_VOLUME charges in proportion to unit count. Same inputs, different per-store final allocations."

  - name: replenishment_signal
    trigger: "POST /supply-chain/_sweep/replenish (ops-run checkpoint)"
    algorithm: threshold
    formula: |
      for rule in ReplenishmentRule WHERE status==ACTIVE:
        if (now() - rule.last_evaluated_at).hours < rule.cycle_hours:
          continue                 # cycle not yet elapsed
        on_hand = sum( InventoryBatch.quantity_on_hand
                       WHERE store_id == rule.store_id
                         AND recipe_id == rule.recipe_id
                         AND status == ON_HAND )
        if on_hand <= rule.safety_stock_units:        # <=, NOT <
          target = rule.replenish_to_units
          velocity_adjusted = ceil(target * rule.velocity_multiplier)
          shortfall = velocity_adjusted - on_hand
          # Generate replenishment StoreOrder (status=DRAFT) with one OrderLine
          # of {recipe_id, quantity=shortfall}. If total_value_cents <
          # Store.low_amount_bypass_cents the order is auto-submitted bypassing
          # human approval; otherwise it stays DRAFT awaiting StoreManager.
        rule.last_evaluated_at = now()
    input_set: |
      All ACTIVE ReplenishmentRules whose cycle has elapsed at sweep time.
      Excludes SUSPENDED rules. Boundary: on_hand == safety_stock_units triggers
      replenishment (uses <=, not strict <).
    constants:
      MIN_REPLENISHMENT_UNITS: 1
    precision: "Units are integer. velocity_multiplier multiplied then ceil()'d."

  - name: near_expiry_alert_tier
    trigger: "POST /supply-chain/_sweep/expiry-alerts (ops-run checkpoint)"
    algorithm: threshold
    formula: |
      for batch in InventoryBatch WHERE status==ON_HAND:
        h = (batch.expires_at - now()).hours
        if h <= 0:
          batch.alert_tier = TIER3        # mandatory disposal
        elif h <= TIER2_HOURS:            # <=, not <
          batch.alert_tier = TIER2        # mandatory disposal candidate
        elif h <= TIER1_HOURS:            # <=, not <
          batch.alert_tier = TIER1        # promotion or transfer recommended
        else:
          batch.alert_tier = NONE
    input_set: |
      All ON_HAND InventoryBatch rows. Boundaries are inclusive (<=), so a batch
      with h == TIER1_HOURS is TIER1, not NONE.
    constants:
      TIER1_HOURS: 24
      TIER2_HOURS: 8
    precision: "Hour comparison via integer hours; floor((expires_at - now()).total_seconds() / 3600)."

  - name: abnormal_loss_detection
    trigger: "POST /supply-chain/loss-records (record creation)"
    algorithm: threshold
    formula: |
      # Compute event-level loss rate at the receiving store:
      window_start = now() - LOSS_WINDOW_HOURS
      window_losses_units = sum( LossRecord.quantity_lost
                                 WHERE store_id == this.store_id
                                   AND created_at >= window_start
                                   AND status != REVERSED )
      window_throughput_units = sum( OrderLine.quantity
                                     WHERE store_id (via StoreOrder) == this.store_id
                                       AND StoreOrder.status == DELIVERED
                                       AND StoreOrder.updated_at >= window_start )
      loss_rate = window_losses_units / max(window_throughput_units, 1)
      this.is_abnormal = (loss_rate > ABNORMAL_LOSS_THRESHOLD)   # strict >, not >=
      if this.is_abnormal:
        this.investigation_status = PENDING
    input_set: |
      Loss events in the rolling window of LOSS_WINDOW_HOURS (default 168 hours
      = 7 days), excluding REVERSED records. Throughput is DELIVERED units in
      the same window. Strict-greater-than semantics on the threshold.
    constants:
      ABNORMAL_LOSS_THRESHOLD: 0.05    # 5%
      LOSS_WINDOW_HOURS: 168
    precision: "Loss rate computed in floating point; comparison uses strict >."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present",                                  error_id: ERR_AUTH_REQUIRED,                http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "X-User-Role is a known role from §1.7",                                      error_id: ERR_INVALID_ROLE,                 http_status: 401, applies_to: "all" }
  - { priority: 3,  category: auth,                 check: "Role permitted for this endpoint",                                            error_id: ERR_FORBIDDEN,                    http_status: 403, applies_to: "all" }
  - { priority: 4,  category: existence,            check: "Path-referenced resource(s) exist (left-to-right)",                           error_id: ERR_NOT_FOUND,                    http_status: 404, applies_to: "all" }
  - { priority: 5,  category: existence,            check: "Body-referenced FK ids resolve to existing rows",                             error_id: ERR_REFERENCE_NOT_FOUND,          http_status: 404, applies_to: "all" }
  - { priority: 6,  category: state,                check: "Target resource is in a state from which the requested transition is legal",  error_id: ERR_INVALID_STATE,                http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7,  category: state,                check: "OCC version match when client supplied 'version'",                            error_id: ERR_STALE_VERSION,                http_status: 409, applies_to: "PATCH/PUT and select POSTs" }
  # Business — safety / compliance
  - { priority: 8,  category: business_safety,      check: "InventoryBatch with alert_tier=TIER3 cannot be transferred (must be disposed)", error_id: ERR_TIER3_DISPOSAL_REQUIRED,    http_status: 422, applies_to: "POST /inventory-batches/{id}/transfer" }
  - { priority: 9,  category: business_safety,      check: "Recipe.temperature_zone must be supported by destination Store.temperature_zone on transfer",  error_id: ERR_TEMPERATURE_ZONE_INCOMPATIBLE, http_status: 422, applies_to: "POST /inventory-batches/{id}/transfer, POST /delivery-routes/{id}/dispatch" }
  - { priority: 10, category: business_safety,      check: "Approving an abnormal LossRecord requires investigation_status==RESOLVED",   error_id: ERR_INVESTIGATION_PENDING,        http_status: 422, applies_to: "POST /loss-records/{id}/approve" }
  # Business — referential / topology
  - { priority: 11, category: business_referential, check: "Every OrderLine.recipe_id is in Store.catalog_permission",                    error_id: ERR_CATALOG_PERMISSION_DENIED,    http_status: 422, applies_to: "POST /store-orders/{id}/lines, POST /store-orders/{id}/submit" }
  - { priority: 12, category: business_referential, check: "Every loaded ProductionBatch is in COMPLETED state",                          error_id: ERR_BATCH_NOT_READY,              http_status: 422, applies_to: "POST /delivery-routes/{id}/dispatch" }
  - { priority: 13, category: business_referential, check: "Driver X-User-ID matches DeliveryRoute.driver_user_id",                       error_id: ERR_DRIVER_MISMATCH,              http_status: 403, applies_to: "POST /delivery-routes/{id}/depart, /complete, /raise-exception" }
  # Business — temporal
  - { priority: 14, category: business_temporal,    check: "Now is inside [Store.order_window_open_minute, order_window_close_minute] (UTC minute-of-day)", error_id: ERR_ORDER_WINDOW_CLOSED, http_status: 422, applies_to: "POST /store-orders/{id}/submit" }
  - { priority: 15, category: business_temporal,    check: "Now is at least Store.cutoff_minutes_before_close before order_window_close_minute", error_id: ERR_ORDER_CUTOFF_PASSED,  http_status: 422, applies_to: "POST /store-orders/{id}/cancel, PATCH /store-orders/{id}" }
  - { priority: 16, category: business_temporal,    check: "DeliveryRoute planned_stops time-windows do not overlap on the same Vehicle (half-open intervals [start, end))", error_id: ERR_DELIVERY_WINDOW_OVERLAP, http_status: 422, applies_to: "POST /delivery-routes, POST /delivery-routes/{id}/dispatch" }
  - { priority: 17, category: business_temporal,    check: "Shelf-life sufficiency: scheduled_start_at + equipment_minutes + Recipe.shelf_life_hours >= target_delivery_date 23:59 UTC", error_id: ERR_SHELF_LIFE_INSUFFICIENT, http_status: 422, applies_to: "POST /production-batches/{id}/schedule" }
  # Business — constraint
  - { priority: 18, category: business_constraint,  check: "Equipment-class capacity not exceeded on the chosen day",                      error_id: ERR_EQUIPMENT_CAPACITY_EXCEEDED,  http_status: 422, applies_to: "POST /production-batches/{id}/schedule" }
  - { priority: 19, category: business_constraint,  check: "DeliveryRoute total_units_loaded <= Vehicle.capacity_units",                    error_id: ERR_VEHICLE_CAPACITY_EXCEEDED,    http_status: 422, applies_to: "POST /delivery-routes, POST /delivery-routes/{id}/dispatch" }
  - { priority: 20, category: business_constraint,  check: "Vehicle.status == AVAILABLE on dispatch",                                       error_id: ERR_VEHICLE_NOT_AVAILABLE,        http_status: 409, applies_to: "POST /delivery-routes/{id}/dispatch, /reroute" }
  - { priority: 21, category: business_constraint,  check: "OrderLine.quantity in [MIN_ORDER_UNITS=1, MAX_ORDER_UNITS=10000]",              error_id: ERR_QUANTITY_OUT_OF_RANGE,        http_status: 422, applies_to: "POST /store-orders/{id}/lines" }
  - { priority: 22, category: business_constraint,  check: "responsibility_user_id present iff cause ∈ {DAMAGE, THEFT, PREPARATION}",       error_id: ERR_RESPONSIBILITY_REQUIRED,      http_status: 422, applies_to: "POST /loss-records" }
  - { priority: 23, category: business_constraint,  check: "Replenishment cycle elapsed (now() - last_evaluated_at >= cycle_hours)",        error_id: ERR_REPLENISHMENT_CYCLE_NOT_ELAPSED, http_status: 422, applies_to: "POST /replenishment-rules/{id}/manual-replenish" }
  # Business — fiscal
  - { priority: 24, category: business_fiscal,      check: "quantity_lost <= InventoryBatch.quantity_on_hand at recording time",            error_id: ERR_LOSS_EXCEEDS_ON_HAND,         http_status: 422, applies_to: "POST /loss-records" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- Stores ---
  - { method: POST,   path: "/supply-chain/stores",                              description: "Create store",                                  roles: [PlatformAdmin],                                                  code: 201, input: [store_code, name, temperature_zone, catalog_permission, order_window_open_minute, order_window_close_minute, "cutoff_minutes_before_close?", "low_amount_bypass_cents?"], output: Store, side_effects: ["AuditLogEntry"] }
  - { method: GET,    path: "/supply-chain/stores",                              description: "List stores",                                   roles: [PlatformAdmin, CentralKitchenPlanner, FinanceController],        code: 200, input: ["limit?", "offset?", "status?"],                  output: "Store[]" }
  - { method: GET,    path: "/supply-chain/stores/{id}",                         description: "Read store",                                    roles: [PlatformAdmin, CentralKitchenPlanner, FinanceController, StoreManager], code: 200, input: [], output: Store }
  - { method: PATCH,  path: "/supply-chain/stores/{id}",                         description: "Update store catalog permission / windows",     roles: [PlatformAdmin],                                                  code: 200, input: ["catalog_permission?", "order_window_open_minute?", "order_window_close_minute?", "cutoff_minutes_before_close?", "low_amount_bypass_cents?", "version?"], output: Store, side_effects: ["AuditLogEntry"] }

  # --- Recipes & ingredients ---
  - { method: POST,   path: "/supply-chain/recipes",                             description: "Create recipe",                                 roles: [CentralKitchenPlanner],                                          code: 201, input: [recipe_code, name, temperature_zone, shelf_life_hours, production_minutes_per_unit, equipment_class, unit_price_cents], output: Recipe }
  - { method: GET,    path: "/supply-chain/recipes",                             description: "List recipes",                                  roles: [PlatformAdmin, CentralKitchenPlanner, StoreManager],             code: 200, input: ["limit?", "offset?", "status?"], output: "Recipe[]" }
  - { method: GET,    path: "/supply-chain/recipes/{id}",                        description: "Read recipe",                                   roles: [PlatformAdmin, CentralKitchenPlanner, StoreManager],             code: 200, input: [], output: Recipe }
  - { method: POST,   path: "/supply-chain/ingredients",                         description: "Create ingredient",                             roles: [CentralKitchenPlanner],                                          code: 201, input: [sku, name, unit, shelf_life_hours, unit_cost_cents], output: Ingredient }
  - { method: POST,   path: "/supply-chain/recipes/{id}/ingredients",            description: "Attach RecipeIngredient (BOM line)",            roles: [CentralKitchenPlanner],                                          code: 201, input: [ingredient_id, quantity_per_unit], output: RecipeIngredient }

  # --- Store orders ---
  - { method: POST,   path: "/supply-chain/store-orders",                        description: "Create draft store order",                      roles: [StoreManager],                                                   code: 201, input: [target_delivery_date], output: StoreOrder }
  - { method: POST,   path: "/supply-chain/store-orders/{id}/lines",             description: "Append order line (DRAFT only)",                roles: [StoreManager],                                                   code: 201, input: [recipe_id, quantity], output: OrderLine }
  - { method: POST,   path: "/supply-chain/store-orders/{id}/submit",            description: "Submit order (DRAFT→SUBMITTED)",                roles: [StoreManager],                                                   code: 200, input: ["version?"], output: StoreOrder, side_effects: ["lock OrderLine.line_value_cents", "POS+ERP sync via audit log"] }
  - { method: POST,   path: "/supply-chain/store-orders/{id}/cancel",            description: "Cancel order",                                  roles: [StoreManager],                                                   code: 200, input: ["version?"], output: StoreOrder }
  - { method: PATCH,  path: "/supply-chain/store-orders/{id}",                   description: "Modify draft order header",                     roles: [StoreManager],                                                   code: 200, input: ["target_delivery_date?", "version?"], output: StoreOrder }
  - { method: GET,    path: "/supply-chain/store-orders",                        description: "List store orders (filterable)",                roles: [PlatformAdmin, CentralKitchenPlanner, StoreManager],             code: 200, input: ["limit?", "offset?", "store_id?", "status?", "target_delivery_date?"], output: "StoreOrder[]" }
  - { method: GET,    path: "/supply-chain/store-orders/{id}",                   description: "Read store order",                              roles: [PlatformAdmin, CentralKitchenPlanner, StoreManager],             code: 200, input: [], output: StoreOrder }

  # --- Production batches ---
  - { method: POST,   path: "/supply-chain/production-batches/consolidate",      description: "Consolidate SUBMITTED orders for a date into ProductionBatches", roles: [CentralKitchenPlanner],                          code: 201, input: [target_delivery_date], output: "ProductionBatch[]", side_effects: ["StoreOrder.SUBMITTED→CONSOLIDATED", "compute planned_units, equipment_minutes", "ingredient_explosion_planned"] }
  - { method: GET,    path: "/supply-chain/production-batches",                  description: "List production batches",                       roles: [CentralKitchenPlanner, FinanceController],                       code: 200, input: ["limit?", "offset?", "status?", "target_delivery_date?"], output: "ProductionBatch[]" }
  - { method: GET,    path: "/supply-chain/production-batches/{id}",             description: "Read production batch",                         roles: [CentralKitchenPlanner, FinanceController],                       code: 200, input: [], output: ProductionBatch }
  - { method: GET,    path: "/supply-chain/production-batches/{id}/forecast",    description: "Forecast variant (forward_looking)",            roles: [CentralKitchenPlanner],                                          code: 200, input: [], output: "ProductionBatchForecast" }
  - { method: POST,   path: "/supply-chain/production-batches/{id}/schedule",    description: "Schedule batch (PLANNED→SCHEDULED)",            roles: [CentralKitchenPlanner],                                          code: 200, input: ["preferred_start_at?", "version?"], output: ProductionBatch, side_effects: ["shelf_life_sequencing", "equipment-minute reservation"] }
  - { method: POST,   path: "/supply-chain/production-batches/{id}/start",       description: "Start production (SCHEDULED→IN_PRODUCTION)",    roles: [CentralKitchenPlanner],                                          code: 200, input: [], output: ProductionBatch }
  - { method: POST,   path: "/supply-chain/production-batches/{id}/complete",    description: "Complete production (IN_PRODUCTION→COMPLETED)", roles: [CentralKitchenPlanner],                                          code: 200, input: [], output: ProductionBatch, side_effects: ["set produced_at, expires_at", "provisional_cost_allocation"] }
  - { method: POST,   path: "/supply-chain/production-batches/{id}/fail",        description: "Fail production (IN_PRODUCTION→FAILED)",        roles: [CentralKitchenPlanner],                                          code: 200, input: [], output: ProductionBatch, side_effects: ["revert linked StoreOrders CONSOLIDATED→SUBMITTED"] }

  # --- Vehicles & delivery routes ---
  - { method: POST,   path: "/supply-chain/vehicles",                            description: "Register vehicle",                              roles: [PlatformAdmin],                                                  code: 201, input: [vehicle_code, capacity_units, temperature_zones], output: Vehicle }
  - { method: GET,    path: "/supply-chain/vehicles",                            description: "List vehicles",                                 roles: [PlatformAdmin, CentralKitchenPlanner],                           code: 200, input: ["limit?", "offset?", "status?"], output: "Vehicle[]" }
  - { method: POST,   path: "/supply-chain/delivery-routes",                     description: "Plan a delivery route (PLANNED)",               roles: [CentralKitchenPlanner],                                          code: 201, input: [vehicle_id, driver_user_id, planned_stops, target_delivery_date], output: DeliveryRoute }
  - { method: GET,    path: "/supply-chain/delivery-routes",                     description: "List delivery routes",                          roles: [CentralKitchenPlanner, Driver],                                  code: 200, input: ["limit?", "offset?", "status?", "driver_user_id?"], output: "DeliveryRoute[]" }
  - { method: POST,   path: "/supply-chain/delivery-routes/{id}/dispatch",       description: "Dispatch route (PLANNED→DISPATCHED)",           roles: [CentralKitchenPlanner],                                          code: 200, input: ["version?"], output: DeliveryRoute }
  - { method: POST,   path: "/supply-chain/delivery-routes/{id}/depart",         description: "Driver departs (DISPATCHED|REROUTED→IN_TRANSIT)", roles: [Driver],                                                       code: 200, input: [], output: DeliveryRoute }
  - { method: POST,   path: "/supply-chain/delivery-routes/{id}/complete",       description: "Driver completes (IN_TRANSIT→COMPLETED)",       roles: [Driver],                                                         code: 200, input: [], output: DeliveryRoute, side_effects: ["create InventoryBatch per stop", "StoreOrder.CONSOLIDATED→DELIVERED"] }
  - { method: POST,   path: "/supply-chain/delivery-routes/{id}/raise-exception", description: "Raise exception (IN_TRANSIT→EXCEPTION)",       roles: [Driver],                                                         code: 200, input: [exception_reason], output: DeliveryRoute }
  - { method: POST,   path: "/supply-chain/delivery-routes/{id}/reroute",        description: "Reroute (EXCEPTION→REROUTED)",                  roles: [CentralKitchenPlanner],                                          code: 200, input: [replacement_vehicle_id], output: DeliveryRoute }

  # --- Inventory batches ---
  - { method: GET,    path: "/supply-chain/inventory-batches",                   description: "List inventory at a store (filterable)",        roles: [StoreManager, CentralKitchenPlanner, FinanceController],         code: 200, input: ["limit?", "offset?", "store_id?", "status?", "alert_tier?"], output: "InventoryBatch[]" }
  - { method: POST,   path: "/supply-chain/inventory-batches/{id}/adjust",       description: "Adjust quantity (delta, with reason)",           roles: [StoreManager],                                                   code: 200, input: [delta, reason, "version?"], output: InventoryBatch, side_effects: ["AuditLogEntry"] }
  - { method: POST,   path: "/supply-chain/inventory-batches/{id}/transfer",     description: "Transfer to peer store",                         roles: [StoreManager],                                                   code: 200, input: [destination_store_id], output: InventoryBatch, side_effects: ["create destination InventoryBatch", "FINANCE sync via audit log"] }
  - { method: POST,   path: "/supply-chain/inventory-batches/{id}/dispose",      description: "Mandatory disposal (TIER3 or expired)",          roles: [StoreManager],                                                   code: 200, input: [], output: InventoryBatch, side_effects: ["auto-create LossRecord cause=SPOILAGE"] }

  # --- Replenishment rules ---
  - { method: POST,   path: "/supply-chain/replenishment-rules",                 description: "Create replenishment rule",                      roles: [StoreManager],                                                   code: 201, input: [recipe_id, safety_stock_units, replenish_to_units, cycle_hours], output: ReplenishmentRule }
  - { method: GET,    path: "/supply-chain/replenishment-rules",                 description: "List replenishment rules",                       roles: [StoreManager, CentralKitchenPlanner],                            code: 200, input: ["limit?", "offset?", "store_id?", "status?"], output: "ReplenishmentRule[]" }
  - { method: POST,   path: "/supply-chain/replenishment-rules/{id}/suspend",    description: "Suspend rule",                                   roles: [StoreManager],                                                   code: 200, input: ["version?"], output: ReplenishmentRule }
  - { method: POST,   path: "/supply-chain/replenishment-rules/{id}/activate",   description: "Activate rule",                                  roles: [StoreManager],                                                   code: 200, input: ["version?"], output: ReplenishmentRule }
  - { method: POST,   path: "/supply-chain/replenishment-rules/{id}/manual-replenish", description: "Manually trigger replenishment for this rule (cycle must have elapsed)", roles: [StoreManager],                          code: 201, input: [], output: StoreOrder }

  # --- Loss records ---
  - { method: POST,   path: "/supply-chain/loss-records",                        description: "Record a loss (creates record in RECORDED, decrements InventoryBatch.quantity_on_hand)", roles: [StoreManager],                                                   code: 201, input: [inventory_batch_id, quantity_lost, cause, "responsibility_user_id?"], output: LossRecord, side_effects: ["decrement InventoryBatch.quantity_on_hand by quantity_lost", "abnormal_loss_detection", "AuditLogEntry"] }
  - { method: GET,    path: "/supply-chain/loss-records",                        description: "List loss records",                              roles: [StoreManager, FinanceController, CentralKitchenPlanner],         code: 200, input: ["limit?", "offset?", "store_id?", "cause?", "is_abnormal?", "investigation_status?", "status?"], output: "LossRecord[]" }
  - { method: POST,   path: "/supply-chain/loss-records/{id}/approve",           description: "Approve loss (RECORDED→APPROVED)",               roles: [FinanceController],                                              code: 200, input: ["version?"], output: LossRecord }
  - { method: POST,   path: "/supply-chain/loss-records/{id}/reverse",           description: "Reverse loss (RECORDED→REVERSED)",               roles: [FinanceController],                                              code: 200, input: ["version?"], output: LossRecord, side_effects: ["restore InventoryBatch.quantity_on_hand"] }
  - { method: POST,   path: "/supply-chain/loss-records/{id}/resolve-investigation", description: "Mark abnormal loss investigation_status=RESOLVED", roles: [FinanceController],                                          code: 200, input: ["resolution_notes?", "version?"], output: LossRecord }

  # --- Cost allocation & audit ---
  - { method: POST,   path: "/supply-chain/cost-allocations/run",                description: "Run final period cost allocation (chronological)", roles: [FinanceController],                                            code: 200, input: [period_start, period_end, indirect_basis], output: "CostAllocationResult" }
  - { method: GET,    path: "/supply-chain/audit-log",                           description: "List audit log entries (filterable)",            roles: [PlatformAdmin, FinanceController],                               code: 200, input: ["limit?", "offset?", "target_type?", "target_id?", "action?"], output: "AuditLogEntry[]" }

  # --- Test-driving endpoints (Testability-completeness §1.5) ---
  - { method: POST,   path: "/supply-chain/_clock/advance",                      description: "Advance the simulated clock (test-only)",        roles: [PlatformAdmin],                                                  code: 200, input: [to_iso8601], output: "ClockState" }
  - { method: POST,   path: "/supply-chain/_sweep/expiry-alerts",                description: "Run the near-expiry alert sweep (ops-run checkpoint)", roles: [PlatformAdmin],                                              code: 200, input: [], output: "ExpirySweepResult", side_effects: ["update InventoryBatch.alert_tier"] }
  - { method: POST,   path: "/supply-chain/_sweep/replenish",                    description: "Run replenishment sweep (ops-run checkpoint)",   roles: [PlatformAdmin],                                                  code: 200, input: [], output: "ReplenishmentSweepResult", side_effects: ["generate replenishment StoreOrders"] }
  - { method: POST,   path: "/supply-chain/_events/emit",                        description: "Emit a synthetic external event (POS sale, ERP update) for tests", roles: [PlatformAdmin],                              code: 200, input: [system, payload], output: "EventEmissionResult" }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # Auth / existence
  - { id: ERR_AUTH_REQUIRED,                  http: 401, condition: "Missing X-User-Role or X-User-ID header." }
  - { id: ERR_INVALID_ROLE,                   http: 401, condition: "X-User-Role is not a known role from §1.7." }
  - { id: ERR_FORBIDDEN,                      http: 403, condition: "Role lacks permission for this endpoint." }
  - { id: ERR_NOT_FOUND,                      http: 404, condition: "Path-referenced resource does not exist." }
  - { id: ERR_REFERENCE_NOT_FOUND,            http: 404, condition: "Body-referenced foreign-key id does not resolve." }

  # State / OCC
  - { id: ERR_INVALID_STATE,                  http: 409, condition: "Target resource is not in a state from which the requested transition is allowed." }
  - { id: ERR_STALE_VERSION,                  http: 409, condition: "Client-supplied 'version' does not match server-side version field." }

  # Store / order rules
  - { id: ERR_CATALOG_PERMISSION_DENIED,      http: 422, condition: "OrderLine.recipe_id is not in Store.catalog_permission." }
  - { id: ERR_ORDER_WINDOW_CLOSED,            http: 422, condition: "Submit attempted outside the daily ordering window." }
  - { id: ERR_ORDER_CUTOFF_PASSED,            http: 422, condition: "Modification or cancellation attempted within cutoff_minutes_before_close of window close." }
  - { id: ERR_QUANTITY_OUT_OF_RANGE,          http: 422, condition: "OrderLine.quantity outside [MIN_ORDER_UNITS, MAX_ORDER_UNITS]." }

  # Production / shelf life / equipment
  - { id: ERR_EQUIPMENT_CAPACITY_EXCEEDED,    http: 422, condition: "Scheduling would push equipment-class minutes-per-day above EQUIPMENT_MINUTES_PER_CLASS_PER_DAY." }
  - { id: ERR_SHELF_LIFE_INSUFFICIENT,        http: 422, condition: "scheduled_start_at + equipment_minutes + shelf_life_hours < target_delivery_date 23:59 UTC." }

  # Delivery / vehicle
  - { id: ERR_VEHICLE_NOT_AVAILABLE,          http: 409, condition: "Vehicle.status != AVAILABLE on dispatch or reroute." }
  - { id: ERR_VEHICLE_CAPACITY_EXCEEDED,      http: 422, condition: "DeliveryRoute total_units_loaded > Vehicle.capacity_units." }
  - { id: ERR_TEMPERATURE_ZONE_INCOMPATIBLE,  http: 422, condition: "required_zones not subset of Vehicle.temperature_zones, or destination Store zone unsuitable." }
  - { id: ERR_DELIVERY_WINDOW_OVERLAP,        http: 422, condition: "Two stops on the same Vehicle have overlapping half-open time windows [start, end)." }
  - { id: ERR_BATCH_NOT_READY,                http: 422, condition: "Loaded ProductionBatch is not in COMPLETED state." }
  - { id: ERR_DRIVER_MISMATCH,                http: 403, condition: "Driver X-User-ID does not match DeliveryRoute.driver_user_id." }

  # Inventory / disposal / transfer
  - { id: ERR_TIER3_DISPOSAL_REQUIRED,        http: 422, condition: "InventoryBatch alert_tier=TIER3 must be disposed; transfer is forbidden." }

  # Loss
  - { id: ERR_RESPONSIBILITY_REQUIRED,        http: 422, condition: "responsibility_user_id presence does not match cause (required for DAMAGE/THEFT/PREPARATION; forbidden for SPOILAGE)." }
  - { id: ERR_LOSS_EXCEEDS_ON_HAND,           http: 422, condition: "quantity_lost > InventoryBatch.quantity_on_hand at recording time." }
  - { id: ERR_INVESTIGATION_PENDING,          http: 422, condition: "Approval attempted on abnormal LossRecord whose investigation_status != RESOLVED." }

  # Replenishment
  - { id: ERR_REPLENISHMENT_CYCLE_NOT_ELAPSED, http: 422, condition: "Manual replenishment within cycle_hours of last_evaluated_at." }
  - { id: ERR_REPLENISHMENT_DUPLICATE,        http: 409, condition: "A replenishment StoreOrder for (store_id, recipe_id, current cycle window) already exists." }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Hierarchical override; manages stores, vehicles, ingredients, and runs the test-driving endpoints."
    identity: opaque
    exclusive_operations:
      - "POST /supply-chain/stores"
      - "POST /supply-chain/vehicles"
      - "POST /supply-chain/_clock/advance"
      - "POST /supply-chain/_sweep/expiry-alerts"
      - "POST /supply-chain/_sweep/replenish"
      - "POST /supply-chain/_events/emit"
    shared_operations:
      - "GET on stores, recipes, vehicles, store-orders, audit-log"

  - name: CentralKitchenPlanner
    description: "Owns recipe catalog, ingredients, BOM, production batches, and route planning."
    identity: opaque
    exclusive_operations:
      - "POST /supply-chain/recipes"
      - "POST /supply-chain/ingredients"
      - "POST /supply-chain/recipes/{id}/ingredients"
      - "POST /supply-chain/production-batches/consolidate"
      - "POST /supply-chain/production-batches/{id}/schedule"
      - "POST /supply-chain/production-batches/{id}/start"
      - "POST /supply-chain/production-batches/{id}/complete"
      - "POST /supply-chain/production-batches/{id}/fail"
      - "POST /supply-chain/delivery-routes"
      - "POST /supply-chain/delivery-routes/{id}/dispatch"
      - "POST /supply-chain/delivery-routes/{id}/reroute"
    shared_operations:
      - "GET on most resources"

  - name: StoreManager
    description: "Acts as a Store; owns the store's orders, inventory adjustments, transfers, replenishment rules, and loss recording."
    identity: "entity_backed:Store"
    exclusive_operations:
      - "POST /supply-chain/store-orders"
      - "POST /supply-chain/store-orders/{id}/lines"
      - "POST /supply-chain/store-orders/{id}/submit"
      - "POST /supply-chain/store-orders/{id}/cancel"
      - "PATCH /supply-chain/store-orders/{id}"
      - "POST /supply-chain/inventory-batches/{id}/adjust"
      - "POST /supply-chain/inventory-batches/{id}/transfer"
      - "POST /supply-chain/inventory-batches/{id}/dispose"
      - "POST /supply-chain/replenishment-rules"
      - "POST /supply-chain/replenishment-rules/{id}/suspend"
      - "POST /supply-chain/replenishment-rules/{id}/activate"
      - "POST /supply-chain/replenishment-rules/{id}/manual-replenish"
      - "POST /supply-chain/loss-records"
    shared_operations:
      - "GET on this store's resources only (server filters by X-User-ID == Store.id)"
    notes: |
      Ownership: when X-User-Role is StoreManager, X-User-ID equals Store.id.
      All store-scoped endpoints reject if the targeted resource's store_id !=
      X-User-ID with ERR_FORBIDDEN. PATCH /stores is reserved for PlatformAdmin.

  - name: Driver
    description: "Executes a DeliveryRoute. Identity is the opaque user id stored on DeliveryRoute.driver_user_id."
    identity: opaque
    exclusive_operations:
      - "POST /supply-chain/delivery-routes/{id}/depart"
      - "POST /supply-chain/delivery-routes/{id}/complete"
      - "POST /supply-chain/delivery-routes/{id}/raise-exception"
    shared_operations:
      - "GET on assigned routes (server filters by X-User-ID == DeliveryRoute.driver_user_id)"

  - name: FinanceController
    description: "Approves losses, runs cost allocation, reads audit log."
    identity: opaque
    exclusive_operations:
      - "POST /supply-chain/loss-records/{id}/approve"
      - "POST /supply-chain/loss-records/{id}/reverse"
      - "POST /supply-chain/loss-records/{id}/resolve-investigation"
      - "POST /supply-chain/cost-allocations/run"
    shared_operations:
      - "GET on stores, store-orders, production-batches, inventory-batches, loss-records, audit-log"
