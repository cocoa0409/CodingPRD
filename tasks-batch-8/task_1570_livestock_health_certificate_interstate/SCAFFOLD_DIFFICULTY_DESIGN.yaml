  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_blocks_safety_on_issue
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - state_machines.Certificate.PENDING_REVIEW_to_ISSUED
        distinguishing_aspect: |
          Pair state-vs-business_safety: issuing a REJECTED certificate whose
          premises is simultaneously under QUARANTINE_HOLD must surface the
          priority-6 state error ERR_CERTIFICATE_NOT_PENDING_REVIEW, not the
          priority-7 safety error ERR_PREMISES_DISEASE_HOLD.
        test_recipe:
          setup:
            - "Standard fixtures; clock 2026-08-10; certificate submitted then REJECTED"
            - "ACTIVE quarantine order placed on the origin premises (disease_status QUARANTINE_HOLD)"
          setup_api_calls:
            - call: "POST /api/premises"
              payload: { name: "Ranch G", county: "Yolo", state_code: "CA", species_code: "CATTLE", initial_head_count: 20, disease_status: "MONITORED" }
              as: ProgramAdmin
              captures: { prem_id: $.data.id }
