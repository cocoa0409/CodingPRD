      - name: participant_cannot_wire_others_settlement_forbidden
        claim_type: rbac_exclusive_denial
        grounds: ['roles[ParticipantLender]', 'errors[ERR_NOT_RESOURCE_OWNER]', 'validations[priority=3]']
        distinguishing_aspect: "Ownership-scoped: ParticipantLender P1 reporting P2's settlement wire -> 403 ERR_NOT_RESOURCE_OWNER (not merely role-forbidden)."
