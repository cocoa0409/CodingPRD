            - { call: "POST /yard/stand-assignments", payload: { row_id: "${row_id}", job_id: "${j_id}", stands_used: 3, start_date: "2026-08-02", end_date: "2026-09-30", expected_yard_row_version: "${row_v}" }, as: YardManager }
            - { call: "POST /yard/lift-slots", payload: { job_id: "${j_id}", kind: "HAUL_OUT", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", vessel_displacement_tons: 20 }, as: YardManager, captures: { slot_id: $.data.id } }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T08:30:00Z" }, as: YardManager }
            - { call: "POST /yard/lift-slots/${slot_id}/complete", payload: {}, as: YardManager }
            - { call: "POST /yard/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T12:00:00Z" }, as: YardManager }
            - { call: "POST /yard/ops/run-daily-close", payload: {}, as: YardManager, captures: { posted: $.data.storage_entries_posted } }
          trigger:
            - { call: "GET /yard/refit-jobs/${j_id}/statement", payload: {}, as: Accountant, captures: { store: $.data.storage_charges_cents, days: $.data.lay_days } }
          assert:
            - "lay_days == 31 (2026-08-02 through 2026-09-01 inclusive)"
            - "exactly 2 storage entries posted (lay-day indexes 1 and 31)"
            - "storage_charges_cents == 112000 (2 x 40 x 1400)"

