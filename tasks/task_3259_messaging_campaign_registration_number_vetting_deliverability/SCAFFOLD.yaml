  - name: SystemDriver
    description: "Test/system driver emitting carrier outcomes and feedback events"
    identity: opaque
    exclusive_operations:
      - "POST messages/{id}/delivery_outcome"
      - "POST feedback_events"
    shared_operations: ["GET messages"]
