      - name: a_default_fans_out_to_five_entity_types_with_no_read_after_write_lag
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /tennis/matches/{id}/default
          - calculations.league_standings_ledger_invariant
        distinguishing_aspect: "This is the widest single request in the domain — one call writes the Match, issues a Strike, recomputes both Teams and touches the League — and under an immediate model every one of those surfaces must be correct on the first read, including the counters an eventually-consistent implementation would rebuild in the background. The ledger invariants are the sharp part: they are asserted at every observation point, so a half-propagated fan-out is detectable by arithmetic alone rather than by waiting."
        test_recipe:
          setup:
            - "The league is IN_PLAY with fixture 1 confirmed for 2026-08-15T18:00:00Z between two two-player teams, and the clock reads 2026-08-15T21:00:00Z so the fixture may be defaulted."
