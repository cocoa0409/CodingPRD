  # =================================================================== Endpoints
  - section: endpoints
    instances:
      - name: troop_ledger_subresource_returns_entries
        claim_type: Computed read
        grounds: [endpoints, entities.FundLedgerEntry.fields.account]
        distinguishing_aspect: "GET /troops/{id}/ledger returns the troop's FundLedgerEntry rows as an array after a payment credits TROOP_DUES."
        test_recipe:
          setup: ["A troop with one POSTED payment crediting TROOP_DUES."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "E1", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "E-1", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "YOUTH", full_name: "E Youth", birthdate: "2013-03-03" }
              as: TroopLeader
              captures: { mid: $.data.id }
            - call: "POST /members/${mid}/dues-invoices"
              payload: { issued_on: "2026-01-01" }
              as: CouncilRegistrar
              captures: { inv: $.data.id }
            - call: "POST /payments"
              payload: { invoice_id: "${inv}", member_id: "${mid}", amount_cents: 12000 }
              as: CouncilRegistrar
          trigger:
            - call: "GET /troops/${tid}/ledger"
              payload: { account: "TROOP_DUES" }
              as: CouncilRegistrar
          assert:
            - "meta.total_count == 1"

  # =================================================================== Errors
  - section: errors
    instances:
      - name: insufficient_inventory_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INSUFFICIENT_INVENTORY]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / inventory_exact_available_units_boundary
          rationale: "ERR_INSUFFICIENT_INVENTORY triggered as the +1 over-allocation path of the named §1.8 boundary instance."

      - name: booth_conflict_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_BOOTH_CONFLICT]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / booth_half_open_overlap_same_location
          rationale: "ERR_BOOTH_CONFLICT is asserted in the named §1.8 overlap instance."

      - name: stale_version_recharter_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[recharter-stale-troop]"]
        excluded_because:
          difficulty_instance: cross_cutting / occ_recharter_stale_version
          rationale: "OCC stale-version on recharter is exercised by the cross-cutting OCC instance below."

  # =================================================================== RBAC
  - section: rbac
    instances:
      - name: troopleader_cannot_recharter
        claim_type: role_denied
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "A TroopLeader calling POST /troops/{id}/recharter (a CouncilRegistrar-exclusive op) gets ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["A PROVISIONAL troop."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "R1", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "R-1", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "GET /troops/${tid}"
              payload: {}
              as: CouncilRegistrar
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /troops/${tid}/recharter"
              payload: { expected_troop_version: "${tv}" }
              as: TroopLeader
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"

      - name: troopleader_cannot_resolve_bgcheck
        claim_type: role_denied
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]", state_machines.LeaderCredential.PENDING_to_CLEARED]
        distinguishing_aspect: "A TroopLeader calling POST /leader-credentials/{id}/resolve-bgcheck (CouncilRegistrar-exclusive) gets ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["An ADULT member with a PENDING bgcheck."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "R2", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
            - call: "POST /councils/${cid}/troops"
              payload: { unit_number: "R-2", program_type: "SCOUTS" }
              as: CouncilRegistrar
              captures: { tid: $.data.id }
            - call: "POST /troops/${tid}/members"
              payload: { member_type: "ADULT", full_name: "Adult R", birthdate: "1980-01-01" }
              as: TroopLeader
              captures: { mid: $.data.id }
            - call: "POST /members/${mid}/leader-credentials"
              payload: { requested_by_user_id: "leader-bob" }
              as: TroopLeader
              captures: { lc: $.data.id }
            - call: "POST /leader-credentials/${lc}/start-bgcheck"
              payload: {}
              as: CouncilRegistrar
          trigger:
            - call: "POST /leader-credentials/${lc}/resolve-bgcheck"
              payload: { outcome: "CLEAR" }
              as: TroopLeader
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_FORBIDDEN_ROLE"

      - name: unauthenticated_missing_headers
        claim_type: role_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with an unknown X-User-Role returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /councils"
              payload: { name: "R3", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: Ghost
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_UNAUTHENTICATED"

      - name: segregation_resolve_own_bgcheck_covered
        claim_type: Segregation of duties
        grounds: ["validations[priority=7]", roles]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / approve_state_beats_segregation_conflict
          rationale: "Segregation-of-duties on approval is exercised in the named §1.8 priority instance (and the dedicated SoD corner below)."

      - name: segregation_resolve_own_bgcheck_direct
        claim_type: Segregation of duties
        grounds: ["validations[priority=7]", state_machines.LeaderCredential.PENDING_to_CLEARED, "errors[ERR_SEGREGATION_OF_DUTIES]"]
        distinguishing_aspect: "Resolving a bgcheck where acting X-User-ID equals requested_by_user_id returns ERR_SEGREGATION_OF_DUTIES (the requester cannot clear their own credential)."
        test_recipe:
          setup: ["ADULT member with PENDING bgcheck requested_by_user_id='registrar-amy'."]
          setup_api_calls:
            - call: "POST /councils"
              payload: { name: "R4", charter_fee_cents: 30000, youth_dues_cents: 12000, adult_dues_cents: 4500, program_year: 2026 }
              as: CouncilRegistrar
              captures: { cid: $.data.id }
