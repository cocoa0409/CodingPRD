              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CERTIFICATE_STOPPED with HTTP 409"
            - "TransferRequest.${t}.status remains APPROVED (no rollback, no settlement)"
            - "Certificate.${cert}.status == LOST_REPORTED"
            - "source Position.certificated_shares remains 100"

      - name: accrual_blocked_by_suspended_issuer
        grounds:
          - state_machines.DividendDeclaration.DECLARED_to_ACCRUED
          - state_machines.Issuer.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair DividendDeclaration -> Issuer (a different pair from
          settle_blocked_by_stopped_certificate): the clock-driven record-lock transition is
          gated on Issuer.status == ACTIVE; while the issuer is SUSPENDED the declaration stays
          DECLARED and no payments materialize, even past record_date.
        test_recipe:
          setup:
            - "Issuer outstanding 100; account holds 100 shares; declaration record 2026-09-01, payable 2026-09-15"
            - "Issuer SUSPENDED before the record date"
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Omicron Co", cusip: "000000015", ticker: "OMCO", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
