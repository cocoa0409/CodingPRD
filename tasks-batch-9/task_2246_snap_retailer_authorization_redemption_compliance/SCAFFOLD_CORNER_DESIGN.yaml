              as_user_id: "fns-analyst-1"
              captures: { t_period: $.data.error_id }
            - call: "POST /sanction-cases/${case_id}/determination"
              payload: { sanction_type: "TEMPORARY_DISQUALIFICATION" }
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { t_reply_open: $.data.error_id }
            - *k_clock_0811
            - call: "POST /sanction-cases/${case_id}/reply"
              payload: { reply_text: "Late reply." }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { t_reply_closed: $.data.error_id }
            - *k_det_tdq
            - *k_clock_0821
            - call: "POST /sanction-cases/${case_id}/administrative-review"
              payload: { grounds_text: "Filed one day late." }
              as: RetailerOwner
              as_user_id: "${owner_id}"
              captures: { t_review_closed: $.data.error_id }
            - *k_finalize_h
            - call: "POST /sanction-cases/${case_id}/enforce"
              payload: {}
              as: FnsAdmin
              as_user_id: "fns-admin-1"
              captures: { t_enforce: $.data.error_id }
          assert:
            - "${t_visit} == ERR_VISIT_WINDOW_NOT_OPEN (409) and the visit stays SCHEDULED"
            - "${t_period} == ERR_PERIOD_NOT_ELAPSED (409) and the period stays OPEN"
            - "${t_reply_open} == ERR_REPLY_WINDOW_OPEN (409) while the clock is before reply_due"
            - "${t_reply_closed} == ERR_REPLY_WINDOW_CLOSED (409) at the reply_due instant"
            - "${t_review_closed} == ERR_ADMIN_REVIEW_WINDOW_CLOSED (409) at 2026-08-21, one day past the 10-day review deadline"
            - "${t_enforce} == ERR_ENFORCEMENT_NOT_DUE (409) because effective_date is 30 days past finalization"
            - "the six error_ids are pairwise distinct"

    # ------------------------------------------------------------------------
