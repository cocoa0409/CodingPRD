          assert:
            - "before the trigger: AssetClassSlot.${slot_lc_id}.status == PENDING_REPLACEMENT, FundReplacementProposal.${prop_lc_id}.status == APPROVED with notice_delivered_at null, FundReplacementProposal.${prop_rival_id}.status == UNDER_REVIEW (it was created after the approval, so the approve-time withdrawal cascade could not reach it), and Plan.occupied_menu_slots == 5, reserved_menu_slots == 1, available_menu_slots == 0"
