  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_retouch_approve
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - state_machines.RetouchOrder.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          Error-category pair STATE (priority 8, ERR_RETOUCH_NOT_APPROVED on complete) vs
          BUSINESS_FISCAL (priority 12, ERR_INSUFFICIENT_RETOUCH_CREDIT on approve). Approving an
          already-DONE retouch order while credit is also insufficient must return the higher-priority
          STATE error, not the fiscal one.
        test_recipe:
          setup:
            - "Session CAPTURE_OPEN, budget 1000 (small). RT created REQUESTED with net 1500 (>1000)."
            - "We attempt to APPROVE: state precondition is satisfied (REQUESTED) so the fiscal check fires alone here — to force a conflict we instead drive RT to a non-approvable state first."
            - "Concretely: a second RETOUCH order RT2 with net 1500 against a budget-1000 session, already APPROVED is impossible; so we reject RT first then attempt approve to surface state(8) over fiscal(12)."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Holly School", scheduled_date: "2026-05-09T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 1000 }
