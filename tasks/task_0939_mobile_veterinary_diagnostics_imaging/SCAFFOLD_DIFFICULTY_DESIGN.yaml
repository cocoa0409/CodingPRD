      - name: charge_line_reversal_and_trip_reallocation_conserve_invoice_total
        grounds:
          - conservation_invariants.INV_MONEY_INVOICE_TOTAL
          - calculations.invoice_total_cents
          - calculations.study_trip_share_cents
          - state_machines.ChargeLine.ACTIVE_to_REVERSED
          - state_machines.Equipment.calibration.VALID_to_QUARANTINED
        distinguishing_aspect: |
          Conserved quantity #3 is MONEY, and the compensating action is an
          equipment quarantine that reverses one study's lines while RE-PRICING
          the survivor's. Invoice.total_cents must equal the sum of the ACTIVE
          lines at both observation points — 66436 before and 39655 after — even
          though the survivor's own charge went UP from 33218 to 39655.
        test_recipe:
          setup:
            - "one clinic on a PER_STUDY_LIST contract"
            - "two ULTRASOUND studies at the SAME stop but acquired on TWO DIFFERENT calibrated modality units"
            - "both studies read, FINALIZED and posted to one OPEN invoice"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /clinics"
              payload: { name: "Ledger Vet", address_zone: "Z20" }
              as: PlatformAdmin
              captures: { cl_m: $.data.id }
            - call: "POST /contracts"
              payload: { clinic_id: "${cl_m}", kind: "PER_STUDY_LIST", valid_from: "2026-05-01T00:00:00Z", valid_until: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /mobile-units"
              payload: { name: "Van M" }
              as: PlatformAdmin
              captures: { un_m: $.data.id }
            - call: "POST /equipment"
              payload: { modality: "ULTRASOUND", serial_label: "US-MA", assigned_unit_id: "${un_m}" }
              as: PlatformAdmin
              captures: { eq_a: $.data.id }
            - call: "POST /equipment/${eq_a}/calibrate"
              payload: { calibration_valid_from: "2026-05-01T00:00:00Z", calibration_valid_until: "2026-05-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /equipment"
              payload: { modality: "ULTRASOUND", serial_label: "US-MB", assigned_unit_id: "${un_m}" }
              as: PlatformAdmin
              captures: { eq_b: $.data.id }
            - call: "POST /equipment/${eq_b}/calibrate"
              payload: { calibration_valid_from: "2026-05-01T00:00:00Z", calibration_valid_until: "2026-05-29T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /technicians"
              payload: { full_name: "Rui Alves", certified_modalities: ["ULTRASOUND"] }
              as: PlatformAdmin
              captures: { tc_m: $.data.id }
            - call: "POST /specialists"
              payload: { full_name: "Dr Haddad", modality_privileges: ["ULTRASOUND"], species_privileges: ["CANINE"], stat_eligible: false }
              as: PlatformAdmin
              captures: { sp_m: $.data.id }
            - call: "POST /routes"
              payload: { mobile_unit_id: "${un_m}", technician_id: "${tc_m}", service_date: "2026-05-04", shift_start_minute: 480, shift_end_minute: 900 }
              as: Scheduler
              captures: { rt_m: $.data.id, rtm_v1: $.data.version }
            - call: "POST /routes/${rt_m}/stops"
              payload: { clinic_id: "${cl_m}", planned_arrival_minute: 540, service_minutes: 45, drive_minutes_from_prev: 20, stop_priority: "ROUTINE", expected_route_version: "${rtm_v1}" }
              as: Scheduler
              captures: { st_m: $.data.id }
            - call: "POST /referrals"
              payload: { clinic_id: "${cl_m}", patient_name: "Duke", species: "CANINE", study_kind: "MOBILE", requested_modality: "ULTRASOUND", priority: "ROUTINE", clinical_history: "staging scan" }
              as: ClinicUser
              as_user_id: "${cl_m}"
              captures: { rf_m: $.data.id }
            - call: "POST /referrals/${rf_m}/accept"
              payload: {}
              as: Scheduler
            - call: "POST /appointments"
              payload: { referral_id: "${rf_m}", route_stop_id: "${st_m}" }
              as: Scheduler
              captures: { ap_m: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_m}", modality: "ULTRASOUND", body_region: "ABDOMEN" }
              as: ClinicUser
              as_user_id: "${cl_m}"
              captures: { mx: $.data.id }
            - call: "POST /studies"
              payload: { appointment_id: "${ap_m}", modality: "ULTRASOUND", body_region: "THORAX" }
              as: ClinicUser
              as_user_id: "${cl_m}"
              captures: { my: $.data.id }
            - call: "POST /routes/${rt_m}/publish"
              payload: {}
              as: Scheduler
            - call: "POST /routes/${rt_m}/dispatch"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_m}"
            - call: "POST /route-stops/${st_m}/arrive"
              payload: {}
              as: FieldTech
              as_user_id: "${tc_m}"
            - call: "POST /studies/${mx}/acquire"
              payload: { equipment_id: "${eq_a}", technician_id: "${tc_m}", image_count: 9 }
              as: FieldTech
              as_user_id: "${tc_m}"
            - call: "POST /studies/${my}/acquire"
              payload: { equipment_id: "${eq_b}", technician_id: "${tc_m}", image_count: 9 }
              as: FieldTech
              as_user_id: "${tc_m}"
            - call: "POST /studies/${mx}/qc"
              payload: { qc_result: "ACCEPTED" }
              as: FieldTech
              as_user_id: "${tc_m}"
            - call: "POST /studies/${my}/qc"
              payload: { qc_result: "ACCEPTED" }
              as: FieldTech
              as_user_id: "${tc_m}"
            - call: "GET /studies/${mx}"
              payload: {}
              as: Scheduler
              captures: { mx_v: $.data.version }
            - call: "POST /read-assignments"
              payload: { study_id: "${mx}", specialist_id: "${sp_m}", expected_study_version: "${mx_v}" }
              as: Scheduler
              captures: { ag_mx: $.data.id }
            - call: "POST /read-assignments/${ag_mx}/accept"
              payload: {}
              as: Specialist
              as_user_id: "${sp_m}"
            - call: "POST /reports"
              payload: { study_id: "${mx}", kind: "FINAL", findings: "splenic mass" }
              as: Specialist
              as_user_id: "${sp_m}"
              captures: { rp_mx: $.data.id }
            - call: "POST /reports/${rp_mx}/publish"
              payload: {}
              as: Specialist
              as_user_id: "${sp_m}"
            - call: "GET /studies/${my}"
              payload: {}
              as: Scheduler
              captures: { my_v: $.data.version }
            - call: "POST /read-assignments"
              payload: { study_id: "${my}", specialist_id: "${sp_m}", expected_study_version: "${my_v}" }
              as: Scheduler
              captures: { ag_my: $.data.id }
            - call: "POST /read-assignments/${ag_my}/accept"
              payload: {}
              as: Specialist
              as_user_id: "${sp_m}"
            - call: "POST /reports"
              payload: { study_id: "${my}", kind: "FINAL", findings: "no thoracic metastasis" }
              as: Specialist
              as_user_id: "${sp_m}"
              captures: { rp_my: $.data.id }
            - call: "POST /reports/${rp_my}/publish"
              payload: {}
              as: Specialist
              as_user_id: "${sp_m}"
            - call: "POST /invoices"
              payload: { clinic_id: "${cl_m}", period_start: "2026-05-01", period_end: "2026-05-31" }
              as: BillingAdmin
              captures: { iv_m: $.data.id, ivm_v1: $.data.version }
            - call: "POST /invoices/${iv_m}/post-study"
              payload: { study_id: "${mx}", expected_invoice_version: "${ivm_v1}" }
              as: BillingAdmin
              captures: { ivm_v2: $.data.version }
            - call: "POST /invoices/${iv_m}/post-study"
              payload: { study_id: "${my}", expected_invoice_version: "${ivm_v2}" }
              as: BillingAdmin
              captures: { total_before: $.data.total_cents }
          trigger:
            - call: "POST /qc-checks"
              payload: { equipment_id: "${eq_a}", performed_by_technician_id: "${tc_m}", result: "FAIL", note: "probe fault on unit A only" }
              as: FieldTech
              as_user_id: "${tc_m}"
              captures: { aff_m: $.data.affected_study_count }
            - call: "GET /invoices/${iv_m}"
              payload: {}
              as: BillingAdmin
              captures: { total_after: $.data.total_cents }
          assert:
            - "${total_before} == 66436"
            - "${aff_m} == 1"
            - "${total_after} == 39655"
            - "Study.${mx}.workflow_status == REPEAT_PENDING"
            - "Study.${mx}.billing_status == REVERSED"
            - "Study.${my}.workflow_status == FINALIZED"
            - "Study.${my}.billing_status == POSTED"
            - "Study.${my}.trip_share_cents == 12500"
            - "Study.${my}.admin_fee_cents == 1155"
            - "Study.${my}.total_price_cents == 39655"
            - "Equipment.${eq_b}.calibration_status == VALID"
            - "GET /charge-lines?invoice_id=${iv_m}&status=ACTIVE returns exactly 3 rows whose amount_cents sum to 39655"
            - "GET /charge-lines?invoice_id=${iv_m}&status=REVERSED returns exactly 3 rows"
            - "the survivor got MORE expensive (33218 -> 39655) while the invoice total FELL, and Invoice.total_cents still equals the sum of ACTIVE lines exactly"



