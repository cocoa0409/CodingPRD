  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: pci_weighted_scoring_with_caps
        claim_type: correct_result
        grounds: [calculations.pavement_condition_index]
        distinguishing_aspect: "Weighted scoring with per-factor caps: catastrophic damage (crack 200ft, pothole 100 sqft, oil 100 sqft on 1000 sqft, STEEP) saturates every cap -> PCI == 0, while the moderate fixture (1200/40/10/5/NONE) yields exactly 80."
        test_recipe:
          setup: ["Two properties with assessments of different severity"]
          setup_api_calls:
            - { call: "POST /api/customers", payload: { name: "Dana Homeowner", customer_type: "RESIDENTIAL", email: "dana@example.com", phone: "555-9001" }, as: OfficeAdmin, captures: { c_id: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "1 Elm St", lot_kind: "RESIDENTIAL_DRIVEWAY" }, as: OfficeAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /api/properties", payload: { customer_id: "${c_id}", address: "9 Elm St", lot_kind: "RESIDENTIAL_DRIVEWAY" }, as: OfficeAdmin, captures: { p2: "$.data.id" } }
          trigger:
            - { call: "POST /api/assessments", payload: { property_id: "${p1}", measured_area_sqft: 1200, crack_linear_ft: 40, pothole_count: 2, pothole_area_sqft: 10, oil_spot_area_sqft: 5, slope_severity: "NONE" }, as: Estimator, captures: { pci_mid: "$.data.pavement_condition_index" } }
            - { call: "POST /api/assessments", payload: { property_id: "${p2}", measured_area_sqft: 1000, crack_linear_ft: 200, pothole_count: 12, pothole_area_sqft: 100, oil_spot_area_sqft: 100, slope_severity: "STEEP" }, as: Estimator, captures: { pci_low: "$.data.pavement_condition_index" } }
          assert:
            - "Moderate: PCI == 80 (deductions 13 + 6 + 1 + 0)"
            - "Catastrophic: raw deductions 80/70/30 saturate caps 40/35/15; slope 10 -> PCI == max(0, 100-40-35-15-10) == 0"

      - name: seal_tier_boundary_1000_and_5000
        claim_type: constants_applied
        grounds: [calculations.job_pricing]
        distinguishing_aspect: "Average-rate tier selection at exact boundaries: area 1000 prices at tier-1 30c (30000c), area 5000 at tier-2 24c (120000c) — not the next tier."
        test_recipe:
          setup: ["Two properties, assessments exactly 1000 and 5000 sqft, STANDARD material, seal-only quotes"]
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OfficeAdmin }
