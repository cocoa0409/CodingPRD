  - section: state_machines
    instances:
      - name: corner_routing_guide_draft_to_published_transition
        claim_type: valid_transition
        grounds:
          - state_machines.RoutingGuide.DRAFT_to_PUBLISHED
          - endpoints[POST /compliance/routing-guides/{id}/publish]
        distinguishing_aspect: "With all four preconditions satisfied the guide moves DRAFT -> PUBLISHED, published_at takes the logical clock value 2026-08-01T00:00:00Z and published_by_user_id takes the acting X-User-ID co-1."
        test_recipe:
          setup:
            - "Clock at 2026-08-01. One DRAFT guide with exactly one requirement and effective_from 2026-08-20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /compliance/routing-guides"
              payload: { guide_code: "RG-2026-V", title: "Valid Transition Guide", scope_code: "APPAREL", effective_from: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { g_id: $.data.id }
            - call: "POST /compliance/routing-guides/${g_id}/requirements"
              payload: { requirement_code: "PKG-02", domain: "PACKAGING", severity_tier: "TIER_2", min_evidence_count: 1, fixed_fee_cents: 20000, per_unit_recovery_cents: 25, handling_pct: 3.00, min_fee_cents: 45000, cap_cents: 400000 }
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /compliance/routing-guides/${g_id}/publish"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Response HTTP status == 200"
            - "RoutingGuide.${g_id}.status == PUBLISHED"
            - "RoutingGuide.${g_id}.published_at == 2026-08-01T00:00:00Z"
            - "RoutingGuide.${g_id}.published_by_user_id == 'co-1'"
            - "RoutingGuide.${g_id}.effective_until == null"
            - "RoutingGuide.${g_id}.version is strictly greater than its value read immediately before the publish call"
            - "GET /compliance/routing-guides?status=PUBLISHED returns total_count == 1"

