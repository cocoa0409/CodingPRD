# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task: task_3140_laboratory_accreditation_inspection_proficiency_testing
# 9 rules x 2 instances = 18 instances. All clock starts default to
# 2026-09-01T00:00:00Z unless a chain sets the clock explicitly.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: pt_standing_per_event_vs_rolling_uus_sequence
        grounds:
          - calculations.pt_standing_per_event
          - calculations.pt_standing_rolling
          - entities.DisciplineEnrollment.fields.standing_per_event
          - entities.DisciplineEnrollment.fields.standing_rolling
        distinguishing_aspect: "The two PT standing variants are computed over the same GRADED event sequence but different window semantics: after gradings U,U,S the per-event variant (last event only) reads SATISFACTORY while the rolling variant (>=2 of last 3, needs len>=2) stays UNSATISFACTORY — same data, two different results on the PTResult/DisciplineEnrollment domain."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Lab L ENROLLED with one ACTIVE CHEMISTRY enrollment E (one section, checklist assigned; no personnel needed here)."
            - "PT subscription on E with analytes [{name: glucose, critical: true}, {name: sodium, critical: false}]."
            - "Three shipments graded in order: U ([100,79] -> 50.0 UNSATISFACTORY), U ([90,70] -> 50.0 UNSATISFACTORY), S ([100,80] -> 100.0 SATISFACTORY)."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Delta Diagnostics", clia_number: "45D0000001" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Core Chemistry", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /pt-subscriptions"
              payload: { enrollment_id: "${enr_id}", analytes: [{ name: "glucose", critical: true }, { name: "sodium", critical: false }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-A" }
              as: PTCoordinator
              captures: { sh1: $.data.id }
            - call: "POST /pt-results"
              payload: { shipment_id: "${sh1}", collected_at: "2026-09-02T00:00:00Z", analyte_scores: [{ name: "glucose", score: 100 }, { name: "sodium", score: 79 }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "GET /pt-investigations"
              payload: { enrollment_id: "${enr_id}" }
              as: AccreditationOfficer
              captures: { inv1_id: "$.data[0].id" }
            - call: "POST /pt-investigations/${inv1_id}/resolve"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-B" }
              as: PTCoordinator
              captures: { sh2: $.data.id }
            - call: "POST /pt-results"
              payload: { shipment_id: "${sh2}", collected_at: "2026-09-02T12:00:00Z", analyte_scores: [{ name: "glucose", score: 90 }, { name: "sodium", score: 70 }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "POST /pt-shipments"
              payload: { subscription_id: "${sub_id}", event_code: "C-2026-C" }
              as: PTCoordinator
              captures: { sh3: $.data.id }
            - call: "POST /pt-results"
              payload: { shipment_id: "${sh3}", collected_at: "2026-09-03T00:00:00Z", analyte_scores: [{ name: "glucose", score: 100 }, { name: "sodium", score: 80 }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
          trigger:
            - call: "GET /enrollments/${enr_id}"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "DisciplineEnrollment.${enr_id}.standing_per_event == SATISFACTORY"
            - "DisciplineEnrollment.${enr_id}.standing_rolling == UNSATISFACTORY"
            - "DisciplineEnrollment.${enr_id}.unsuccessful_event_streak == 1 (the third event was UNSATISFACTORY and nothing reset it)"
            - "The second grading auto-created exactly one new PTInvestigation in OPEN (visible via GET /pt-investigations?enrollment_id=${enr_id} returning 2 rows total)"

      - name: provisional_vs_final_decision_divergence_on_same_cycle
        grounds:
          - calculations.provisional_decision
          - calculations.deficiency_burden_score
          - state_machines.InspectionCycle.FINDINGS_ISSUED_to_DECIDED
        distinguishing_aspect: "On the InspectionCycle domain, provisional_decision (computed at issue-findings treating all unresolved findings as staying unresolved) reads CONDITIONAL for burden 4, but after the laboratory's responses are accepted the final decision under the same officer authority is ACCREDITED — two valid decision algorithms over one cycle produce different outcomes at different times."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Lab L ENROLLED: one ACTIVE CHEMISTRY enrollment E, one section SEC (critical_testing: false, checklist assigned), one personnel P QUALIFIED, one MethodValidation APPROVED. Inspection cycle C created (window 2026-09-10..2026-09-20), team with one LEAD inspector (from another lab, specialty CHEMISTRY) CLEARED, cycle SCREENED, clock advanced into window, cycle CONDUCTED."
            - "One LEVEL_2 finding F cited on SEC by the inspector."
            - "issue-findings called: burden = 4 (LEVEL_2 x1, non-critical section) -> provisional_decision = CONDITIONAL; F.response_due_at set."
            - "LaboratoryDirector responds to F; a DIFFERENT inspector accepts."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Prairie Pathology", clia_number: "45D0000002" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /laboratories"
              payload: { name: "Inspector Home Lab", clia_number: "45D0000003" }
              as: AccreditationOfficer
              captures: { lab_b_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Bench A", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /personnel-records"
              payload: { enrollment_id: "${enr_id}", person_name: "Pat Tech", personnel_role: "TESTING_PERSONNEL" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { pers_id: $.data.id }
            - call: "POST /personnel-records/${pers_id}/verify-qualification"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /method-validations"
              payload: { enrollment_id: "${enr_id}", method_name: "Hexokinase Glucose", instrument_name: "Analyzer X", correlation_r_squared: 0.99, precision_cv_pct: 3.0 }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { mv_id: $.data.id }
            - call: "POST /method-validations/${mv_id}/submit"
              payload: {}
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "POST /method-validations/${mv_id}/approve"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-cycles"
              payload: { laboratory_id: "${lab_id}", scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-20T00:00:00Z" }
              as: AccreditationOfficer
              captures: { cyc_id: $.data.id }
            - call: "POST /inspector-profiles"
              payload: { full_name: "Ingrid Inspector", affiliated_laboratory_id: "${lab_b_id}", specialties: ["CHEMISTRY"] }
              as: AccreditationOfficer
              captures: { insp1: $.data.id }
            - call: "POST /inspector-profiles"
              payload: { full_name: "Oscar Other", affiliated_laboratory_id: "${lab_b_id}", specialties: ["CHEMISTRY"] }
              as: AccreditationOfficer
              captures: { insp2: $.data.id }
            - call: "POST /team-assignments"
              payload: { inspection_cycle_id: "${cyc_id}", inspector_id: "${insp1}", role_in_team: "LEAD" }
              as: AccreditationOfficer
              captures: { asg1: $.data.id }
            - call: "POST /team-assignments/${asg1}/clear"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-cycles/${cyc_id}/screen-team"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /inspection-cycles/${cyc_id}/conduct"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-findings"
              payload: { inspection_cycle_id: "${cyc_id}", section_id: "${sec_id}", checklist_item_code: "CHM.10230", deficiency_level: "LEVEL_2" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { fnd_id: $.data.id }
            - call: "POST /inspection-cycles/${cyc_id}/issue-findings"
              payload: {}
              as: AccreditationOfficer
              captures: { cyc_issued: $.data.provisional_decision }
            - call: "POST /inspection-findings/${fnd_id}/respond"
              payload: { response_text: "Recalibrated and retrained; records attached." }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "POST /inspection-findings/${fnd_id}/accept"
              payload: {}
              as: Inspector
              as_user_id: "${insp2}"
          trigger:
            - call: "POST /inspection-cycles/${cyc_id}/decide"
              payload: { decision: "ACCREDITED" }
              as: AccreditationOfficer
          assert:
            - "At issue-findings time the cycle's provisional_decision == CONDITIONAL (captured as ${cyc_issued})"
            - "After acceptance, GET /inspection-cycles/${cyc_id}.deficiency_burden_score == 0"
            - "decide with ACCREDITED returns 200; InspectionCycle.${cyc_id}.final_decision == ACCREDITED"
            - "Laboratory.${lab_id}.accreditation_status == ACCREDITED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: competency_composite_round_then_sum_ordering
        grounds:
          - calculations.competency_composite
          - entities.CompetencyAssessment.fields.composite_score
        distinguishing_aspect: "Mode (b) nested-rounding: the composite rounds each element ratio w_i = s_i/600 to 4dp BEFORE summation. For element_scores [88,88,88,88,88,83] the pinned round-then-sum order yields 87.18, while the alternative sum-then-round yields 87.17 — a second-decimal divergence the test pins to the literal 87.18."
        test_recipe:
          setup:
            - "Clock at default 2026-09-01T00:00:00Z. Lab with one ACTIVE HEMATOLOGY enrollment (one section, checklist assigned)."
            - "Personnel P registered; verified QUALIFIED."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Hema Labs", clia_number: "45D0000010" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "HEMATOLOGY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "CBC Bench", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "HEM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "HEM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /personnel-records"
              payload: { enrollment_id: "${enr_id}", person_name: "Sam Slide", personnel_role: "TESTING_PERSONNEL" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { pers_id: $.data.id }
            - call: "POST /personnel-records/${pers_id}/verify-qualification"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /competency-assessments"
              payload: { personnel_id: "${pers_id}", assessed_at: "2026-09-05T00:00:00Z", element_scores: [88, 88, 88, 88, 88, 83] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { ca_id: $.data.id }
          assert:
            - "CompetencyAssessment.${ca_id}.composite_score == 87.18 (round-then-sum), NOT 87.17 (sum-then-round)"
            - "CompetencyAssessment.${ca_id}.passed == true"
            - "CompetencyAssessment.${ca_id}.valid_until == 2027-09-05T00:00:00Z (assessed_at + 365 days)"
            - "PersonnelRecord.${pers_id}.qualification_status remains QUALIFIED and consecutive_failed_assessments == 0"

      - name: deficiency_burden_weighted_multiplication_mode_a
        grounds:
          - calculations.deficiency_burden_score
          - calculations.provisional_decision
          - entities.TestingSection.fields.critical_testing
        distinguishing_aspect: "Mode (a) multi-input non-linear formula: burden = sum over unresolved findings of level-weight (LEVEL_2=4, LEVEL_1=2) x critical multiplier (critical section=2 else 1), and the provisional decision thresholds on the result (==0 ACCREDITED, <=6 CONDITIONAL, else DENIED). One LEVEL_2 finding on a critical section (4x2=8) plus one LEVEL_1 on a non-critical section (2x1=2) yields burden 10 -> provisional DENIED, whereas the same two findings with sections' criticality flipped would yield 6 -> CONDITIONAL."
        test_recipe:
          setup:
            - "Clock default. Lab L ENROLLED with one ACTIVE MICROBIOLOGY enrollment E and TWO sections: SEC_CRIT (critical_testing: true) and SEC_NORM (critical_testing: false), both checklist-assigned. One QUALIFIED personnel and one APPROVED method validation so posture is ready."
            - "Cycle C (window 2026-09-10..2026-09-20); one CLEARED LEAD inspector from another lab (specialty MICROBIOLOGY); SCREENED; clock to 2026-09-12; CONDUCTED."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Micro Lab", clia_number: "45D0000011" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /laboratories"
              payload: { name: "Away Lab", clia_number: "45D0000012" }
              as: AccreditationOfficer
              captures: { lab_b_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "MICROBIOLOGY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Blood Cultures", critical_testing: true }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_crit: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Environmental Cultures", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_norm: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "MIC", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_crit}/assign-checklist"
              payload: { checklist_code: "MIC", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_norm}/assign-checklist"
              payload: { checklist_code: "MIC", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /personnel-records"
              payload: { enrollment_id: "${enr_id}", person_name: "Mary Micro", personnel_role: "TESTING_PERSONNEL" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { pers_id: $.data.id }
            - call: "POST /personnel-records/${pers_id}/verify-qualification"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /method-validations"
              payload: { enrollment_id: "${enr_id}", method_name: "BCID Panel", instrument_name: "Analyzer M", correlation_r_squared: 0.98, precision_cv_pct: 5.0 }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { mv_id: $.data.id }
            - call: "POST /method-validations/${mv_id}/submit"
              payload: {}
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "POST /method-validations/${mv_id}/approve"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-cycles"
              payload: { laboratory_id: "${lab_id}", scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-20T00:00:00Z" }
              as: AccreditationOfficer
              captures: { cyc_id: $.data.id }
            - call: "POST /inspector-profiles"
              payload: { full_name: "Ivy Inspector", affiliated_laboratory_id: "${lab_b_id}", specialties: ["MICROBIOLOGY"] }
              as: AccreditationOfficer
              captures: { insp1: $.data.id }
            - call: "POST /team-assignments"
              payload: { inspection_cycle_id: "${cyc_id}", inspector_id: "${insp1}", role_in_team: "LEAD" }
              as: AccreditationOfficer
              captures: { asg1: $.data.id }
            - call: "POST /team-assignments/${asg1}/clear"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-cycles/${cyc_id}/screen-team"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /inspection-cycles/${cyc_id}/conduct"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-findings"
              payload: { inspection_cycle_id: "${cyc_id}", section_id: "${sec_crit}", checklist_item_code: "MIC.22000", deficiency_level: "LEVEL_2" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { f1: $.data.id }
            - call: "POST /inspection-findings"
              payload: { inspection_cycle_id: "${cyc_id}", section_id: "${sec_norm}", checklist_item_code: "MIC.11000", deficiency_level: "LEVEL_1" }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { f2: $.data.id }
          trigger:
            - call: "POST /inspection-cycles/${cyc_id}/issue-findings"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "InspectionCycle.${cyc_id}.deficiency_burden_score == 10 (4x2 + 2x1)"
            - "InspectionCycle.${cyc_id}.provisional_decision == DENIED (burden 10 > 6)"
            - "The same two findings with criticality flipped would have been 4x1 + 2x2 = 8 -> still DENIED; pinned ordering matters because one LEVEL_1 on critical + one LEVEL_2 on normal = 4+4 = 8 also DENIED — the falsifiable pin here is exactly 10 for this arrangement"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: inspection_cycle_appeal_self_inspection_redecision_loop
        grounds:
          - state_machines.InspectionCycle.DECIDED_to_APPEALED
          - state_machines.InspectionCycle.APPEALED_to_INTERIM_SELF_INSPECTION
          - state_machines.InspectionCycle.INTERIM_SELF_INSPECTION_to_RE_DECIDED
          - state_machines.InspectionCycle.RE_DECIDED_to_APPEALED
        distinguishing_aspect: "InspectionCycle is cyclic: DECIDED -> APPEALED -> INTERIM_SELF_INSPECTION -> RE_DECIDED -> APPEALED loops while appeal_count < 2; the loop terminates when appeal_count reaches 2 (second appeal works, third is rejected with ERR_APPEAL_LIMIT_REACHED) and each RE_DECIDED overwrites final_decision and re-fires the laboratory cascade."
        test_recipe:
          setup:
            - "Clock default. Lab L ENROLLED with one ACTIVE CHEMISTRY enrollment (section SEC assigned, personnel QUALIFIED, method validation APPROVED). Cycle C fully set up: LEAD inspector cleared, SCREENED, clock into window 2026-09-12, CONDUCTED."
            - "One LEVEL_1 finding on SEC cited; issue-findings (burden 2, provisional CONDITIONAL); finding responded and accepted by a second inspector (burden 0)."
            - "decide with DENIED succeeds even at burden 0 -> laboratory PROBATION cascade; cycle DECIDED, appeal_count == 0."
            - "appeal (count -> 1), self-inspect, re-decide ACCREDITED (burden still 0; laboratory -> ACCREDITED)."
          setup_api_calls:
            - call: "POST /laboratories"
              payload: { name: "Loop Lab", clia_number: "45D0000020" }
              as: AccreditationOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /laboratories"
              payload: { name: "Peer Lab", clia_number: "45D0000021" }
              as: AccreditationOfficer
              captures: { lab_b_id: $.data.id }
            - call: "POST /enrollments"
              payload: { laboratory_id: "${lab_id}", discipline: "CHEMISTRY" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { enr_id: $.data.id }
            - call: "POST /sections"
              payload: { enrollment_id: "${enr_id}", section_name: "Loop Bench", critical_testing: false }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { sec_id: $.data.id }
            - call: "POST /checklist-editions"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /sections/${sec_id}/assign-checklist"
              payload: { checklist_code: "CHM", checklist_version: "2026" }
              as: AccreditationOfficer
            - call: "POST /personnel-records"
              payload: { enrollment_id: "${enr_id}", person_name: "Lou Loop", personnel_role: "TESTING_PERSONNEL" }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { pers_id: $.data.id }
            - call: "POST /personnel-records/${pers_id}/verify-qualification"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /method-validations"
              payload: { enrollment_id: "${enr_id}", method_name: "M1", instrument_name: "I1", correlation_r_squared: 0.99, precision_cv_pct: 2.0 }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { mv_id: $.data.id }
            - call: "POST /method-validations/${mv_id}/submit"
              payload: {}
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
            - call: "POST /method-validations/${mv_id}/approve"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /inspection-cycles"
              payload: { laboratory_id: "${lab_id}", scheduled_start: "2026-09-10T00:00:00Z", scheduled_end: "2026-09-20T00:00:00Z" }
              as: AccreditationOfficer
              captures: { cyc_id: $.data.id }
            - call: "POST /inspector-profiles"
              payload: { full_name: "I1", affiliated_laboratory_id: "${lab_b_id}", specialties: ["CHEMISTRY"] }
              as: AccreditationOfficer
              captures: { insp1: $.data.id }
            - call: "POST /inspector-profiles"
              payload: { full_name: "I2", affiliated_laboratory_id: "${lab_b_id}", specialties: ["CHEMISTRY"] }
              as: AccreditationOfficer
              captures: { insp2: $.data.id }
            - call: "POST /team-assignments"
              payload: { inspection_cycle_id: "${cyc_id}", inspector_id: "${insp1}", role_in_team: "LEAD" }
              as: AccreditationOfficer
