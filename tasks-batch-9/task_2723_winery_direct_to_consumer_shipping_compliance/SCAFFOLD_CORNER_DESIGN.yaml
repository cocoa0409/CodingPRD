      - name: a_carrier_program_without_a_signature_service_cannot_carry_a_signature_order
        claim_type: triggerable
        grounds:
          - errors[ERR_ADULT_SIGNATURE_NOT_SUPPORTED]
          - validations.priority_72
          - entities.CarrierProgram.fields.adult_signature_service_code
          - entities.Shipment.fields.adult_signature_service_code
        distinguishing_aspect: |
          Priority 72 sits between the enrollment check at 70 and the volume checks below it, so it fires
          only when the winery IS enrolled and the enrolled program simply lacks the capability. The fix path
          proves the check reads the program and not the state: suspending the incapable enrollment and
          approving one on a program that carries AS21 clears an identical order, and the resulting Shipment
          copies the service code onto itself. Shipping against the suspended enrollment answers with priority
          70's error instead, which pins the ordering of the two rules.
        test_recipe:
          setup:
            - "The TX rule sets adult_signature_required true and requires_carrier_program true. Clock 2026-08-01."
            - "Estate 1 holds an ACTIVE TX permit and an APPROVED enrollment on a GSO program created with NO adult_signature_service_code."
            - "Consumer Ada is ID-verified and ships to 78701. Each order is 6 x 750 ml at 4200 c."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dtc/wineries"
              payload: { name: "Estate 1", ttb_permit_number: "TTB-1001", home_state_code: "CA", annual_production_gallons: 120000 }
