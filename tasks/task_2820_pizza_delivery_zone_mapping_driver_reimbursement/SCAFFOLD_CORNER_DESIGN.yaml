          assert:
            - "HTTP 409 with ${err_id} == 'ERR_INVALID_DISPUTE_STATE'"
            - "AddressDispute.${disp_id}.status is still 'WITHDRAWN' with review_round_count 0 and decided_at null"
            - "ServiceAddress.${addr_e_id}.override_state == null and effective_zone_state == 'EDGE'"
            - "ServiceAddress.${addr_e_id}.zone_state == 'EDGE' with grid_miles 13.33 and drive_time_estimate_minutes 46"

