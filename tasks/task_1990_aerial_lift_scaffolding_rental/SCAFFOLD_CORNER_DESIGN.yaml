      - name: pass_inspection_extends_due_date
        claim_type: computed_fields
        grounds: [entities.EquipmentUnit.fields.next_inspection_due_date, state_machines.InspectionRecord.SUBMITTED_to_CERTIFIED]
        distinguishing_aspect: "A CERTIFIED PASS inspection moves last_annual_inspection_date to the record's inspection_date and recomputes next_inspection_due_date = +365 days."
        test_recipe:
          setup: ["class S19PI; unit created at clock 2026-08-01T09:00:00Z (last inspection 2026-08-01, due 2027-08-01); SUBMITTED PASS record with inspection_date 2026-08-20"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /equipment-classes"
              payload: { class_code: "S19PI", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19PI-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
            - call: "POST /inspection-records"
              payload: { unit_id: "${unit_id}", inspection_date: "2026-08-20", ansi_standard_ref: "ANSI A92.22", result: "PASS" }
              as: YardTechnician
              as_user_id: "yt-1"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /inspection-records/${rec_id}/certify"
              as: BranchManager
              as_user_id: "bm-1"
              captures: { rstat: $.data.status }
            - call: "GET /equipment-units/${unit_id}"
              as: BranchManager
              captures: { last_insp: $.data.last_annual_inspection_date, next_due: $.data.next_inspection_due_date }
          assert:
            - "record status == CERTIFIED"
            - "unit last_annual_inspection_date == '2026-08-20' and next_inspection_due_date == '2027-08-20'"

      - name: recovery_credit_value
        claim_type: correct_result
        grounds: [calculations.recovery_credit]
        excluded_because:
          difficulty_instance: fleet_count_conserved_through_dispatch_loss_recovery
          rationale: "The 80% recovery credit (2000000 on a 2500000 chargeback) is asserted literally in the named §1.8 instance."

      - name: provisional_invoice_read_while_out_on_rent
        claim_type: variant_selection
        grounds: [calculations.rental_segment_charge]
        excluded_because:
          difficulty_instance: provisional_vs_final_segment_charge
          rationale: "Provisional quote on the invoice while OUT_ON_RENT is the asserted first half of the named §1.8 instance."

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_missing_headers_returns_401
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected 401 before any other processing."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /equipment-classes"
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED; http status 401 (headers absent)"

      - name: reach_exceeded_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_REACH_EXCEEDED]"
        distinguishing_aspect: "required_working_height_ft above the class maximum is rejected; at exactly the maximum it passes (<= semantics)."
        test_recipe:
          setup: ["class S19H max_working_height_ft 25; unit; DRAFT contract"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: BranchManager
            - call: "POST /customer-accounts"
              payload: { company_name: "Reach Co", contact_email: "ops@reach.example", credit_limit_cents: 100000000 }
              as: BranchManager
              captures: { cust_id: $.data.id }
            - call: "POST /equipment-classes"
              payload: { class_code: "S19H", category: "AERIAL_LIFT", max_working_height_ft: 25, min_rental_days: 1, daily_rate_cents: 14500, weekly_rate_cents: 43500, monthly_rate_cents: 99000, replacement_value_cents: 2500000 }
              as: BranchManager
              captures: { class_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { class_id: "${class_id}", serial_number: "S19H-001", ansi_standard_ref: "ANSI A92.22" }
              as: BranchManager
              captures: { unit_id: $.data.id }
