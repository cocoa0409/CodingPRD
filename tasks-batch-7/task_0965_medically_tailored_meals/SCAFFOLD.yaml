# =============================================================================
# SCAFFOLD.yaml — Medically-Tailored Meals (MTM) platform
# §1.0–§1.7 only. Difficulty design and corner design live in sibling files.
# =============================================================================

scenario: "generate task hard than expert level! 965. Medically-Tailored Meals (MTM): referral & diet prescription, menu & renal/diabetic nutrition compliance, delivery & cold-chain, payer (Medicaid waiver/MA supplemental) billing, adherence & outcome, allergen calculation, reauthorization, dietitian"

domain_name: medically-tailored-meals
api_prefix: /mtm

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

x-roles:
  all: &ALL_ROLES [ProgramAdmin, CareCoordinator, ReferringProvider, Dietitian, LogisticsCoordinator, Driver, BillingSpecialist, PayerReviewer, Member]

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; FKs canonical)
# =============================================================================
entities:
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: payer_type, type: enum, source: input, description: "MEDICAID_WAIVER | MEDICARE_ADVANTAGE" }
      - { name: payer_member_id, type: string, source: input, description: "Payer-side member identifier" }
      - { name: allergies, type: array, source: input, description: "Allergen codes the member is allergic to, e.g. [PEANUT, SHELLFISH, DAIRY, GLUTEN, SOY, EGG]" }
      - { name: diagnosis_codes, type: array, source: input, required: false, default: [], description: "ICD-10 diagnosis codes" }
      - { name: income_fpl_percent, type: integer, source: input, description: "Household income as integer percent of federal poverty level; drives waiver cost-share tier" }
      - { name: household_size, type: integer, source: input, description: "Household size (>= 1)" }
      - { name: status, type: enum, source: system, default: INTAKE, description: "INTAKE | ACTIVE | SUSPENDED | DISENROLLED" }
      - { name: adherence_delivered_pct, type: number, source: computed, default: 100.00, description: "Delivered-based adherence over trailing 84-day window; 100.00 when denominator is 0" }
      - { name: adherence_confirmed_pct, type: number, source: computed, default: 100.00, description: "Confirmed-based adherence over trailing 84-day window; 100.00 when no DELIVERED deliveries" }
      - { name: oop_accumulator_cents, type: integer, source: computed, default: 0, description: "Sum of member_cost_share_cents over this member's claims in {PAID, PARTIALLY_PAID}" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; referred member" }
      - { name: provider_user_id, type: string, source: system, description: "Referring provider operator id, from X-User-ID" }
      - { name: diagnosis_codes, type: array, source: input, description: "ICD-10 codes justifying MTM" }
      - { name: referred_diet_type, type: enum, source: input, description: "RENAL | DIABETIC | RENAL_DIABETIC | CARDIAC" }
      - { name: expires_at, type: string, source: input, description: "ISO date; referral auto-expires when logical clock date passes it while SUBMITTED or TRIAGED" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | TRIAGED | ACCEPTED | REJECTED | EXPIRED | CONSUMED" }

  - name: DietPrescription
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: referral_id, type: string, source: input, description: "FK -> Referral.id; must be ACCEPTED and belong to member_id" }
      - { name: supersedes_id, type: string, source: system, default: null, description: "FK -> DietPrescription.id; set on activate to the prior ACTIVE prescription it superseded, else null" }
      - { name: dietitian_user_id, type: string, source: system, description: "Authoring dietitian operator id, from X-User-ID" }
      - { name: diet_type, type: enum, source: input, description: "RENAL | DIABETIC | RENAL_DIABETIC | CARDIAC" }
      - { name: daily_sodium_mg_max, type: integer, source: input, description: "Daily sodium ceiling in mg" }
      - { name: daily_potassium_mg_max, type: integer, source: input, description: "Daily potassium ceiling in mg (renal only)" }
      - { name: daily_phosphorus_mg_max, type: integer, source: input, description: "Daily phosphorus ceiling in mg (renal only)" }
      - { name: daily_carbs_g_max, type: integer, source: input, description: "Daily carbohydrate ceiling in g (diabetic only)" }
      - { name: daily_protein_g_min, type: integer, source: input, description: "Daily protein floor in g" }
      - { name: excluded_allergens, type: array, source: input, description: "Allergen codes excluded by prescription; unioned with Member.allergies at freeze" }
      - { name: meals_per_week, type: integer, source: input, description: "Cap on total meal quantity per weekly menu cycle (>= 1)" }
      - { name: effective_from, type: string, source: input, description: "ISO date, inclusive start of closed effective window" }
      - { name: effective_to, type: string, source: input, description: "ISO date, inclusive end of closed effective window" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | SUPERSEDED | REVOKED" }

  - name: MenuItem
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Meal name" }
      - { name: sodium_mg, type: integer, source: input, description: "Sodium per meal, mg (>= 0)" }
      - { name: potassium_mg, type: integer, source: input, description: "Potassium per meal, mg (>= 0)" }
      - { name: phosphorus_mg, type: integer, source: input, description: "Phosphorus per meal, mg (>= 0)" }
      - { name: carbs_g, type: integer, source: input, description: "Carbohydrates per meal, g (>= 0)" }
      - { name: protein_g, type: integer, source: input, description: "Protein per meal, g (>= 0)" }
      - { name: allergen_codes, type: array, source: input, description: "Allergens contained, e.g. [PEANUT]" }
      - { name: base_cost_cents, type: integer, source: input, description: "Catalog cost per meal in cents (informational; billing uses payer rate card)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | RETIRED" }

  - name: MenuCycle
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: prescription_id, type: string, source: input, description: "FK -> DietPrescription.id; version-pinned at freeze (frozen cycles keep their pin even if the prescription is later superseded)" }
      - { name: week_start_date, type: string, source: input, description: "ISO date of the delivery week start" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | FROZEN | FULFILLED | CANCELLED" }
      - { name: compliance_status, type: enum, source: computed, default: UNCHECKED, description: "UNCHECKED | PASSED; set PASSED on successful freeze; reset to UNCHECKED on unfreeze or prescription re-pin" }
      - { name: meals_count, type: integer, source: computed, default: 0, description: "Sum of MenuCycleItem.quantity over the cycle's items" }

  - name: MenuCycleItem
    parent: null
    common_fields: false
    fields:
      - { name: menu_cycle_id, type: string, source: system, description: "FK -> MenuCycle.id" }
      - { name: menu_item_id, type: string, source: input, description: "FK -> MenuItem.id" }
      - { name: quantity, type: integer, source: input, description: "Meals of this item in the cycle (>= 1)" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: driver_id, type: string, source: input, description: "Driver operator identifier" }
      - { name: route_date, type: string, source: input, description: "ISO date of the route" }
      - { name: start_time, type: string, source: input, description: "HH:MM route window start (half-open)" }
      - { name: end_time, type: string, source: input, description: "HH:MM route window end (exclusive); must be > start_time" }
      - { name: capacity_stops, type: integer, source: input, description: "Maximum stops on the route (>= 1)" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | DISPATCHED | COMPLETED | CANCELLED" }

  - name: Delivery
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: menu_cycle_id, type: string, source: input, description: "FK -> MenuCycle.id; cycle must be FROZEN" }
      - { name: route_id, type: string, source: input, description: "FK -> DeliveryRoute.id; route must be PLANNED or DISPATCHED" }
      - { name: authorization_id, type: string, source: system, description: "FK -> Reauthorization.id; selected at schedule time by unit-reservation selector" }
      - { name: service_date, type: string, source: input, description: "ISO date of the drop; must equal the route's route_date" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | OUT_FOR_DELIVERY | DELIVERED | FAILED | CANCELLED | SPOILED" }
      - { name: cold_chain_status, type: enum, source: computed, default: INTACT, description: "INTACT | EXCURSION | SPOILED; parallel state dimension driven by cold-chain readings" }
      - { name: cumulative_excursion_minutes, type: integer, source: computed, default: 0, description: "Cumulative minutes above 8.0C, computed by chronological replay of readings" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp set on mark-delivered" }
      - { name: confirmed_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp set on member confirm-receipt" }

  - name: ColdChainReading
    parent: null
    common_fields: false
    fields:
      - { name: delivery_id, type: string, source: system, description: "FK -> Delivery.id" }
      - { name: recorded_at, type: datetime, source: input, description: "ISO8601 timestamp of the temperature sample" }
      - { name: temp_celsius, type: number, source: input, description: "Parcel temperature in Celsius" }

  - name: Reauthorization
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: authorized_units, type: integer, source: input, description: "Number of delivery service units authorized (>= 1)" }
      - { name: used_units, type: integer, source: computed, default: 0, description: "Units consumed by DELIVERED deliveries" }
      - { name: reserved_units, type: integer, source: computed, default: 0, description: "Units reserved by SCHEDULED/OUT_FOR_DELIVERY deliveries" }
      - { name: available_units, type: integer, source: computed, description: "= authorized_units - used_units - reserved_units" }
      - { name: max_amount_cents, type: integer, source: input, description: "Maximum plan-paid amount over the authorization window" }
      - { name: consumed_amount_cents, type: integer, source: computed, default: 0, description: "Sum of remitted_amount_cents over this authorization's claims in {PAID, PARTIALLY_PAID}" }
      - { name: start_date, type: string, source: input, description: "ISO date, inclusive window start" }
      - { name: end_date, type: string, source: input, description: "ISO date, inclusive window end" }
      - { name: authorization_number, type: string, source: system, default: null, description: "Payer authorization number recorded at approval" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | APPROVED | DENIED | EXHAUSTED | EXPIRED" }

  - name: OutcomeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: dietitian_user_id, type: string, source: system, description: "Assessing dietitian operator id, from X-User-ID" }
      - { name: assessed_at, type: string, source: input, description: "ISO date of assessment; reauthorization approval requires one within trailing 90 days" }
      - { name: weight_kg, type: number, source: input, description: "Measured weight" }
      - { name: hba1c_pct, type: number, source: input, description: "Measured HbA1c percent" }
      - { name: notes, type: string, source: input, required: false, description: "Optional dietitian notes" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id" }
      - { name: menu_cycle_id, type: string, source: input, description: "FK -> MenuCycle.id; cycle must be FROZEN or FULFILLED with >= 1 DELIVERED delivery" }
      - { name: authorization_id, type: string, source: input, description: "FK -> Reauthorization.id; must belong to member_id" }
      - { name: payer_type_snapshot, type: enum, source: system, description: "Member.payer_type captured at claim creation" }
      - { name: units_delivered, type: integer, source: computed, description: "= MenuCycle.meals_count at claim creation" }
      - { name: provisional_gross_cents, type: integer, source: computed, description: "Rate-card provisional amount: units_delivered x payer per-meal rate" }
      - { name: member_cost_share_cents, type: integer, source: computed, description: "Waiver tiered per-line rounded share, or MA flat copay capped by OOP headroom" }
      - { name: plan_liability_cents, type: integer, source: computed, description: "= provisional_gross_cents - member_cost_share_cents" }
      - { name: remitted_amount_cents, type: integer, source: system, default: null, description: "Final adjudicated plan payment recorded at remit; the final variant of the claim amount" }
      - { name: submitted_by_user_id, type: string, source: system, default: null, description: "BillingSpecialist operator id that submitted; segregation-of-duties bars the same id from voiding" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | PAID | PARTIALLY_PAID | DENIED | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Member
    initial_state: INTAKE
    terminal_states: [DISENROLLED]
    transitions:
      - from: INTAKE
        to: ACTIVE
        trigger: "POST /mtm/members/{id}/status with target_status=ACTIVE"
        actor: CareCoordinator | ProgramAdmin
        preconditions:
          - "Member.status == INTAKE (ERR_MEMBER_TERMINAL if DISENROLLED; ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Member.version += 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mtm/members/{id}/status with target_status=SUSPENDED"
        actor: CareCoordinator | ProgramAdmin
        preconditions: ["Member.status == ACTIVE"]
        side_effects: ["Member.version += 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mtm/members/{id}/status with target_status=ACTIVE"
        actor: CareCoordinator | ProgramAdmin
        preconditions: ["Member.status == SUSPENDED"]
        side_effects: ["Member.version += 1"]
        note: "Reactivation loop: ACTIVE <-> SUSPENDED is cyclic."
      - from: ACTIVE
        to: DISENROLLED
        trigger: "POST /mtm/members/{id}/status with target_status=DISENROLLED"
        actor: CareCoordinator | ProgramAdmin
        preconditions: ["Member.status in {ACTIVE, SUSPENDED}"]
        side_effects:
          - "Member.version += 1"
          - "Cascade link 1: member's ACTIVE DietPrescription -> REVOKED"
          - "Cascade link 2 (caused by the prescription REVOKED mutation): every MenuCycle of the member with status in {PLANNED, FROZEN} whose prescription_id is now REVOKED -> CANCELLED"
          - "Cascade link 3 (caused by each cycle CANCELLED mutation): every Delivery of that cycle with status in {SCHEDULED, OUT_FOR_DELIVERY} -> CANCELLED, and each cancelled delivery releases its reserved unit on its Reauthorization (reserved_units -= 1)"
      - from: SUSPENDED
        to: DISENROLLED
        trigger: "POST /mtm/members/{id}/status with target_status=DISENROLLED"
        actor: CareCoordinator | ProgramAdmin
        preconditions: ["Member.status in {ACTIVE, SUSPENDED}"]
        side_effects:
          - "Member.version += 1"
          - "Same three cascade links as ACTIVE -> DISENROLLED"

  - entity: Referral
    initial_state: SUBMITTED
    terminal_states: [REJECTED, EXPIRED, CONSUMED]
    transitions:
      - from: SUBMITTED
        to: TRIAGED
        trigger: "POST /mtm/referrals/{id}/decision with decision=TRIAGE"
        actor: CareCoordinator
        preconditions: ["Referral.status == SUBMITTED (else ERR_REFERRAL_NOT_ACTIONABLE)"]
        side_effects: []
      - from: TRIAGED
        to: ACCEPTED
        trigger: "POST /mtm/referrals/{id}/decision with decision=ACCEPT"
        actor: CareCoordinator
        preconditions:
          - "Referral.status == TRIAGED (else ERR_REFERRAL_NOT_ACTIONABLE)"
          - "Logical clock date <= expires_at (else ERR_REFERRAL_EXPIRED)"
        side_effects: []
      - from: TRIAGED
        to: REJECTED
        trigger: "POST /mtm/referrals/{id}/decision with decision=REJECT"
        actor: CareCoordinator
        preconditions: ["Referral.status == TRIAGED"]
        side_effects: []
      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (POST /mtm/_clock/set_current_utc sweep: logical date > expires_at)"
        actor: system
        preconditions: ["Referral.status in {SUBMITTED, TRIAGED} and current logical date > expires_at"]
        side_effects: []
      - from: TRIAGED
        to: EXPIRED
        trigger: "system (POST /mtm/_clock/set_current_utc sweep)"
        actor: system
        preconditions: ["Referral.status in {SUBMITTED, TRIAGED} and current logical date > expires_at"]
        side_effects: []
      - from: ACCEPTED
        to: CONSUMED
        trigger: "system (automatic when a DietPrescription referencing this referral is activated)"
        actor: system
        preconditions: ["Referral.status == ACCEPTED"]
        side_effects: []

  - entity: DietPrescription
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, REVOKED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /mtm/diet-prescriptions/{id}/activate"
        actor: Dietitian
        preconditions:
          - "Prescription.status == DRAFT (else ERR_PRESCRIPTION_NOT_DRAFT)"
          - "Member.status == ACTIVE (else ERR_MEMBER_NOT_ACTIVE)"
          - "Referral.status == ACCEPTED (else ERR_REFERRAL_NOT_ACTIONABLE)"
          - "expected_member_version == Member.version (else ERR_STALE_MEMBER_VERSION, 412)"
        side_effects:
          - "Member.version += 1"
          - "Referral -> CONSUMED"
          - "Prior ACTIVE prescription of the same member -> SUPERSEDED; this prescription's supersedes_id set to it (null if none)"
          - "Cascade (caused by the SUPERSEDED mutation): every MenuCycle of the member with status == PLANNED and prescription_id == the superseded prescription is re-pinned to the newly ACTIVE prescription and compliance_status reset to UNCHECKED; FROZEN cycles keep their original pin"
      - from: DRAFT
        to: REVOKED
        trigger: "POST /mtm/diet-prescriptions/{id}/revoke"
        actor: Dietitian
        preconditions: ["Prescription.status in {DRAFT, ACTIVE} (else ERR_PRESCRIPTION_NOT_DRAFT)"]
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /mtm/diet-prescriptions/{id}/revoke"
        actor: Dietitian
        preconditions: ["Prescription.status in {DRAFT, ACTIVE}"]
        side_effects:
          - "Cascade: member's PLANNED MenuCycles pinned to this prescription -> CANCELLED; their SCHEDULED deliveries -> CANCELLED and reserved units released"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when another prescription of the same member is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade: member's PLANNED MenuCycles pinned to this prescription re-pin to the new ACTIVE prescription, compliance_status -> UNCHECKED"

  - entity: MenuItem
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /mtm/menu-items/{id}/retire"
        actor: ProgramAdmin
        preconditions: ["MenuItem.status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: MenuCycle
    initial_state: PLANNED
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: PLANNED
        to: FROZEN
        trigger: "POST /mtm/menu-cycles/{id}/freeze"
        actor: Dietitian
        preconditions:
          - "MenuCycle.status == PLANNED (else ERR_MENU_CYCLE_NOT_PLANNED)"
          - "Member.status == ACTIVE (else ERR_MEMBER_NOT_ACTIVE)"
          - "Pinned DietPrescription.status == ACTIVE (else ERR_PRESCRIPTION_NOT_ACTIVE)"
          - "No allergen violation: no item's allergen_codes intersect (Member.allergies UNION prescription.excluded_allergens) (else ERR_ALLERGEN_VIOLATION)"
          - "Nutrition compliant per pinned prescription diet_type gates (else ERR_NUTRITION_NON_COMPLIANT)"
          - "meals_count <= prescription.meals_per_week (else ERR_MEAL_COUNT_EXCEEDED)"
        side_effects:
          - "compliance_status -> PASSED"
          - "prescription_id pin is locked for the life of the cycle"
      - from: FROZEN
        to: PLANNED
        trigger: "POST /mtm/menu-cycles/{id}/unfreeze"
        actor: Dietitian
        preconditions:
          - "MenuCycle.status == FROZEN (else ERR_MENU_CYCLE_NOT_FROZEN)"
          - "No Delivery of this cycle in {SCHEDULED, OUT_FOR_DELIVERY} (else ERR_MENU_CYCLE_HAS_OPEN_DELIVERIES)"
        side_effects: ["compliance_status -> UNCHECKED"]
        note: "Cyclic revision loop PLANNED -> FROZEN -> PLANNED."
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /mtm/menu-cycles/{id}/cancel"
        actor: Dietitian
        preconditions: ["MenuCycle.status in {PLANNED, FROZEN} (else ERR_MENU_CYCLE_TERMINAL)"]
        side_effects:
          - "Deliveries of this cycle in {SCHEDULED, OUT_FOR_DELIVERY} -> CANCELLED; reserved units released on their Reauthorizations"
      - from: FROZEN
        to: CANCELLED
        trigger: "POST /mtm/menu-cycles/{id}/cancel"
        actor: Dietitian
        preconditions: ["MenuCycle.status in {PLANNED, FROZEN}"]
        side_effects:
          - "Deliveries of this cycle in {SCHEDULED, OUT_FOR_DELIVERY} -> CANCELLED; reserved units released"
      - from: FROZEN
        to: FULFILLED
        trigger: "system (automatic when the cycle has >= 1 DELIVERED delivery and all of its deliveries are in terminal states {DELIVERED, FAILED, CANCELLED, SPOILED})"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DeliveryRoute
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /mtm/delivery-routes/{id}/dispatch"
        actor: LogisticsCoordinator
        preconditions: ["Route.status == PLANNED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /mtm/delivery-routes/{id}/complete"
        actor: LogisticsCoordinator
        preconditions:
          - "Route.status == DISPATCHED (else ERR_ROUTE_NOT_DISPATCHED)"
          - "All deliveries of the route in terminal states (else ERR_ROUTE_HAS_OPEN_DELIVERIES)"
        side_effects: []

  - entity: Delivery
    initial_state: "status=SCHEDULED, cold_chain_status=INTACT (parallel dimensions)"
    terminal_states: [DELIVERED, FAILED, CANCELLED, SPOILED]
    transitions:
      - from: SCHEDULED
        to: OUT_FOR_DELIVERY
        trigger: "POST /mtm/deliveries/{id}/out-for-delivery"
        actor: Driver
        preconditions:
          - "Delivery.status == SCHEDULED (else ERR_DELIVERY_NOT_SCHEDULED)"
          - "Route.status == DISPATCHED (else ERR_ROUTE_NOT_DISPATCHED)"
        side_effects: []
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /mtm/deliveries/{id}/mark-delivered"
        actor: Driver
        preconditions:
          - "Delivery.status == OUT_FOR_DELIVERY (else ERR_DELIVERY_NOT_OUT_FOR_DELIVERY)"
          - "Delivery.cold_chain_status != SPOILED (else ERR_DELIVERY_TERMINAL)"
        side_effects:
          - "delivered_at set to logical clock"
          - "Reauthorization: reserved_units -= 1, used_units += 1 (version += 1)"
          - "If Reauthorization.used_units == authorized_units: Reauthorization -> EXHAUSTED (auto)"
          - "If all cycle deliveries terminal and >= 1 DELIVERED: MenuCycle -> FULFILLED (auto)"
      - from: OUT_FOR_DELIVERY
        to: FAILED
        trigger: "POST /mtm/deliveries/{id}/mark-failed"
        actor: Driver
        preconditions: ["Delivery.status == OUT_FOR_DELIVERY (else ERR_DELIVERY_NOT_OUT_FOR_DELIVERY)"]
        side_effects:
          - "Reauthorization: reserved_units -= 1 (compensating release; version += 1)"
          - "If all cycle deliveries terminal and >= 1 DELIVERED: MenuCycle -> FULFILLED (auto)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (menu cycle cancel / member disenroll cascade)"
        actor: system
        preconditions: []
        side_effects: ["Reauthorization: reserved_units -= 1"]
      - from: OUT_FOR_DELIVERY
        to: CANCELLED
        trigger: "system (menu cycle cancel / member disenroll cascade)"
        actor: system
        preconditions: []
        side_effects: ["Reauthorization: reserved_units -= 1"]
      - from: OUT_FOR_DELIVERY
        to: SPOILED
        trigger: "system (cold-chain replay: cumulative_excursion_minutes > 30)"
        actor: system
        preconditions: ["Delivery.cold_chain_status computed SPOILED"]
        side_effects:
          - "Delivery.cold_chain_status -> SPOILED (parallel dimension)"
          - "Reauthorization: reserved_units -= 1 (compensating release; version += 1)"
    note: "cold_chain_status dimension: INTACT -> EXCURSION (any reading > 8.0C) -> SPOILED (cumulative > 30 min). SPOILED forces status -> SPOILED. EXCURSION does not block DELIVERED."

  - entity: Reauthorization
    initial_state: PENDING
    terminal_states: [DENIED, EXHAUSTED, EXPIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /mtm/reauthorizations/{id}/approve"
        actor: PayerReviewer
        preconditions:
          - "Reauthorization.status == PENDING (else ERR_AUTHORIZATION_NOT_PENDING)"
          - "Member.status != DISENROLLED (else ERR_MEMBER_TERMINAL)"
          - "Member.adherence_delivered_pct >= 80.00 (else ERR_ADHERENCE_BELOW_THRESHOLD)"
          - "Exists OutcomeAssessment for member with assessed_at >= current logical date - 90 days (else ERR_OUTCOME_ASSESSMENT_STALE)"
        side_effects:
          - "authorization_number recorded from input"
          - "Reauthorization.version += 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /mtm/reauthorizations/{id}/deny"
        actor: PayerReviewer
        preconditions: ["Reauthorization.status == PENDING (else ERR_AUTHORIZATION_NOT_PENDING)"]
        side_effects: []
      - from: APPROVED
        to: EXHAUSTED
        trigger: "system (automatic when used_units == authorized_units)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: EXPIRED
        trigger: "system (POST /mtm/_clock/set_current_utc sweep: logical date > end_date)"
        actor: system
        preconditions: ["Reauthorization.status == APPROVED and current logical date > end_date"]
        side_effects: []

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, PARTIALLY_PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mtm/claims/{id}/submit"
        actor: BillingSpecialist
        preconditions:
          - "Claim.status == DRAFT (else ERR_CLAIM_NOT_DRAFT)"
          - "MenuCycle.status in {FROZEN, FULFILLED} (else ERR_MENU_CYCLE_NOT_FROZEN) — state, checked before fiscal"
          - "Reauthorization.status == APPROVED (else ERR_AUTHORIZATION_NOT_APPROVED)"
          - "Claim.provisional_gross_cents <= authorization.max_amount_cents - authorization.consumed_amount_cents (else ERR_AUTHORIZATION_AMOUNT_EXCEEDED) — fiscal, checked last"
        side_effects: ["submitted_by_user_id set from X-User-ID"]
      - from: SUBMITTED
        to: PAID
        trigger: "POST /mtm/claims/{id}/remit with outcome=PAID"
        actor: PayerReviewer
        preconditions:
          - "Claim.status == SUBMITTED (else ERR_CLAIM_NOT_SUBMITTED)"
          - "remitted_amount_cents == plan_liability_cents (else ERR_REMIT_AMOUNT_MISMATCH)"
        side_effects:
          - "Member.oop_accumulator_cents += member_cost_share_cents"
          - "Reauthorization.consumed_amount_cents += remitted_amount_cents (version += 1)"
      - from: SUBMITTED
        to: PARTIALLY_PAID
        trigger: "POST /mtm/claims/{id}/remit with outcome=PARTIALLY_PAID"
        actor: PayerReviewer
        preconditions:
          - "Claim.status == SUBMITTED"
          - "0 < remitted_amount_cents < plan_liability_cents (else ERR_REMIT_AMOUNT_MISMATCH)"
        side_effects:
          - "Member.oop_accumulator_cents += member_cost_share_cents"
          - "Reauthorization.consumed_amount_cents += remitted_amount_cents (version += 1)"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /mtm/claims/{id}/remit with outcome=DENIED"
        actor: PayerReviewer
        preconditions:
          - "Claim.status == SUBMITTED"
          - "remitted_amount_cents omitted or 0 (else ERR_REMIT_AMOUNT_MISMATCH)"
        side_effects: []
      - from: DENIED
        to: DRAFT
        trigger: "POST /mtm/claims/{id}/correct"
        actor: BillingSpecialist
        preconditions: ["Claim.status == DENIED (else ERR_CLAIM_NOT_DENIED)"]
        side_effects: []
        note: "Resubmission cycle DRAFT -> SUBMITTED -> DENIED -> DRAFT."
      - from: PAID
        to: VOIDED
        trigger: "POST /mtm/claims/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "Claim.status in {PAID, PARTIALLY_PAID} (else ERR_CLAIM_NOT_VOIDABLE)"
          - "X-User-ID != claim.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Member.oop_accumulator_cents -= member_cost_share_cents (compensating reversal)"
          - "Reauthorization.consumed_amount_cents -= remitted_amount_cents (compensating reversal; version += 1)"
      - from: PARTIALLY_PAID
        to: VOIDED
        trigger: "POST /mtm/claims/{id}/void"
        actor: BillingSpecialist
        preconditions:
          - "Claim.status in {PAID, PARTIALLY_PAID}"
          - "X-User-ID != claim.submitted_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Member.oop_accumulator_cents -= member_cost_share_cents"
          - "Reauthorization.consumed_amount_cents -= remitted_amount_cents (version += 1)"

# =============================================================================
# §1.2.1 Concurrency Rules (true CREATE/ACTIVATE-with-supersede races; OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: prescription-activate-stale-member
    parent_entity: Member
    write_endpoint: "POST /mtm/diet-prescriptions/{id}/activate"
    occ_field: "expected_member_version"
    description: |
      Activating a DietPrescription supersedes the member's currently ACTIVE
      prescription, a member-aggregate mutation. If the Member's version has
      advanced beyond the version the activating dietitian last observed, the
      activation is rejected as stale; the client must re-read the member and
      retry with the current version.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412
  - rule_id: claim-create-stale-authorization
    parent_entity: Reauthorization
    write_endpoint: "POST /mtm/claims"
    occ_field: "expected_reauthorization_version"
    description: |
      Creating a Claim registers a fiscal liability against a Reauthorization
      whose unit and amount ledgers move with every delivery and remittance.
      If the Reauthorization's version has advanced beyond the version the
      billing specialist last observed, the creation is rejected as stale; the
      client must re-read the authorization and retry with the current version.
    error_id: ERR_STALE_AUTHORIZATION_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: nutrition_compliance_check
    trigger: "POST /mtm/menu-cycles/{id}/freeze and GET /mtm/menu-cycles/{id}/compliance"
    algorithm: threshold
    formula: |
      Let items = MenuCycleItem rows of the cycle; totals are WEEKLY sums:
        sodium_total  = sum(item.sodium_mg     * qty)
        potassium_total = sum(item.potassium_mg * qty)
        phosphorus_total = sum(item.phosphorus_mg * qty)
        carbs_total   = sum(item.carbs_g       * qty)
        protein_total = sum(item.protein_g     * qty)
      Weekly limits = 7 * prescription daily limit. Gate set depends on diet_type:
        RENAL:          sodium_ok AND potassium_ok AND phosphorus_ok AND protein_ok
        DIABETIC:       sodium_ok AND carbs_ok AND protein_ok
        RENAL_DIABETIC: all five gates
        CARDIAC:        sodium_ok AND protein_ok
      where sodium_ok = (sodium_total <= 7*daily_sodium_mg_max), etc., and
      protein_ok = (protein_total >= 7*daily_protein_g_min).
      nutrition_compliant = AND of the gated checks; violations lists each failed nutrient name.
    input_set: "MenuCycleItem rows of the cycle (any cycle status); limits from the pinned DietPrescription"
    constants:
      DAYS_PER_WEEK: 7
    precision: "integer mg/g; no rounding"
    variants: []

  - name: allergen_exposure_check
    trigger: "POST /mtm/menu-cycles/{id}/freeze and GET /mtm/menu-cycles/{id}/compliance"
    algorithm: aggregation
    formula: |
      blocked_allergens = Member.allergies UNION prescription.excluded_allergens (set union, dedup)
      allergen_violations = [item.name for item in cycle items if
                             set(item.allergen_codes) INTERSECT blocked_allergens != empty]
      allergen_ok = (allergen_violations is empty)
    input_set: "MenuCycleItem rows of the cycle; Member.allergies; pinned DietPrescription.excluded_allergens"
    precision: "set semantics; violation list sorted by item name ASC, tie created_at ASC"

  - name: claim_provisional_amount
    trigger: "POST /mtm/claims (claim creation -> DRAFT)"
    algorithm: tiered_pricing
    formula: |
      rate = 925 if payer_type_snapshot == MEDICAID_WAIVER else 1180  (cents per meal)
      For each MenuCycleItem line: line_gross = rate * quantity
      provisional_gross_cents = sum(line_gross)
      units_delivered = sum(quantity)  == MenuCycle.meals_count
      Cost share (member_cost_share_cents):
        MEDICAID_WAIVER — tier on Member.income_fpl_percent:
          tier_pct = 0.00 if fpl < 138; 0.05 if 138 <= fpl <= 150; 0.10 if fpl > 150
          PINNED ROUNDING ORDER (mode b): round EACH LINE first, then sum:
            member_cost_share_cents = sum( round_half_up(line_gross * tier_pct) )
          (Sum-then-round is FORBIDDEN: it yields different cents, e.g. two 925-cent
           lines at 5% give 46+46=92 per-line vs round(92.5)=93 summed.)
        MEDICARE_ADVANTAGE — flat copay capped by annual out-of-pocket headroom:
          member_cost_share_cents = min(500, max(0, 34000 - Member.oop_accumulator_cents))
      plan_liability_cents = provisional_gross_cents - member_cost_share_cents
    input_set: "MenuCycleItem rows of the claimed cycle; Member.payer_type (snapshot); Member.income_fpl_percent; Member.oop_accumulator_cents"
    constants:
      WAIVER_RATE_CENTS: 925
      MA_RATE_CENTS: 1180
      WAIVER_TIER2_FPL_MIN: 138
      WAIVER_TIER2_FPL_MAX: 150
      WAIVER_TIER2_PCT: 0.05
      WAIVER_TIER3_PCT: 0.10
      MA_COPAY_CENTS: 500
      OOP_MAX_CENTS: 34000
    precision: "integer cents; per-line round_half_up, then sum (pinned order)"
    variants:
      - name: provisional
        when: "claim in DRAFT or SUBMITTED"
        difference: "rate-card estimate: units x per-meal rate minus computed cost share"
      - name: final
        when: "claim remitted (PAID | PARTIALLY_PAID | DENIED)"
        difference: "adjudicated remitted_amount_cents recorded by PayerReviewer; for identical delivery data PAID yields plan_liability_cents, which differs from provisional_gross_cents whenever member_cost_share_cents > 0"

  - name: adherence_percentage
    trigger: "GET /mtm/members/{id}, GET /mtm/members/{id}/summary, POST /mtm/reauthorizations/{id}/approve"
    algorithm: aggregation
    formula: |
      Window: deliveries of the member with service_date in
      [current_logical_date - 84 days, current_logical_date], both inclusive.
      denominator = count(status in {DELIVERED, FAILED, SPOILED})
      delivered     = count(status == DELIVERED)
      confirmed     = count(status == DELIVERED and confirmed_at != null)
      adherence_delivered_pct = 100.00 if denominator == 0
                                else round_half_up(100 * delivered / denominator, 2)
      adherence_confirmed_pct = 100.00 if delivered == 0
                                else round_half_up(100 * confirmed / delivered, 2)
    input_set: "Delivery rows of the member in the trailing 84-day window (date filter on service_date)"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: delivered_based
        when: "reauthorization approval gate and member summary"
        difference: "counts DELIVERED over {DELIVERED, FAILED, SPOILED}; member confirmation not required"
      - name: confirmed_based
        when: "outcome review and member summary"
        difference: "counts member-confirmed receipts over DELIVERED only; same deliveries, different numerator AND denominator, so the two variants diverge (e.g. 4 delivered/1 failed with 3 confirmations: 80.00 vs 75.00)"

  - name: cold_chain_excursion
    trigger: "POST /mtm/deliveries/{id}/cold-chain-readings (after each inserted reading)"
    algorithm: chronological
    formula: |
      Replay the delivery's readings sorted by recorded_at ASC, tie-break created_at ASC
      (insertion order may differ from recorded order; the SORTED order governs).
      For each reading i with temp_celsius > 8.0 that has a successor reading i+1:
        accrue (recorded_at[i+1] - recorded_at[i]) in whole minutes (truncate seconds)
      The final reading accrues 0. cumulative_excursion_minutes = total accrued.
      cold_chain_status:
        INTACT    if no reading exceeds 8.0C
        EXCURSION if any reading > 8.0C and cumulative_excursion_minutes <= 30
        SPOILED   if cumulative_excursion_minutes > 30   (strictly greater; exactly 30 is NOT spoiled)
      On transition to SPOILED: Delivery.status -> SPOILED (spoilage cascade, see state machine).
    input_set: "ColdChainReading rows of the delivery"
    constants:
      EXCURSION_THRESHOLD_C: 8.0
      SPOILAGE_LIMIT_MINUTES: 30
    precision: "whole minutes, truncation"

  - name: authorization_unit_reservation
    trigger: "POST /mtm/deliveries (schedule), mark-delivered, mark-failed, spoilage, cycle cancel cascade"
    algorithm: waterfall_allocation
    formula: |
      On schedule, select the member's unit-reservation source:
        candidates = Reauthorizations of the member with status == APPROVED,
                     start_date <= service_date <= end_date, and available_units >= 1
        rank by end_date ASC; tie-break created_at ASC
        empty pool: if no APPROVED authorization covers service_date at all
                    -> ERR_SERVICE_DATE_OUT_OF_AUTHORIZATION (temporal);
                    if covering authorizations exist but all have available_units == 0
                    -> ERR_AUTHORIZATION_EXHAUSTED (fiscal)
      Forward: reserved_units += 1 on the selected authorization; Delivery.authorization_id set.
      Consume (mark-delivered): reserved_units -= 1, used_units += 1;
        if used_units == authorized_units: status -> EXHAUSTED.
      Compensate (mark-failed / spoilage / cycle-cancel cascade): reserved_units -= 1.
      INVARIANT (conserved quantity: service units):
        authorized_units == used_units + reserved_units + available_units at all times.
    input_set: "Reauthorization rows of the delivery's member"
    precision: "integer units"

  - name: claim_ledger_reconciliation
    trigger: "POST /mtm/claims/{id}/remit (PAID/PARTIALLY_PAID) and POST /mtm/claims/{id}/void"
    algorithm: aggregation
    formula: |
      On remit PAID/PARTIALLY_PAID:
        Member.oop_accumulator_cents += claim.member_cost_share_cents
        Reauthorization.consumed_amount_cents += claim.remitted_amount_cents
      On void (compensating action):
        Member.oop_accumulator_cents -= claim.member_cost_share_cents
        Reauthorization.consumed_amount_cents -= claim.remitted_amount_cents
      INVARIANTS (conserved quantity: money):
        Member.oop_accumulator_cents == sum(member_cost_share_cents over the member's
          claims with status in {PAID, PARTIALLY_PAID})
        Reauthorization.consumed_amount_cents == sum(remitted_amount_cents over the
          authorization's claims with status in {PAID, PARTIALLY_PAID})
      A remit followed by its void MUST leave both accumulators bit-identical to
      their pre-remit values.
    input_set: "Claim rows of the member / authorization with status in {PAID, PARTIALLY_PAID}"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and non-empty", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role permitted for this endpoint per §1.7", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every path id exists, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 3.5, category: existence, check: "Body foreign-key references exist (member_id, referral_id, prescription_id, menu_item_id, menu_cycle_id, route_id, authorization_id)", error_id: "ERR_MEMBER_NOT_FOUND | ERR_REFERRAL_NOT_FOUND | ERR_PRESCRIPTION_NOT_FOUND | ERR_MENU_ITEM_NOT_FOUND | ERR_MENU_CYCLE_NOT_FOUND | ERR_ROUTE_NOT_FOUND | ERR_AUTHORIZATION_NOT_FOUND", http_status: 404, applies_to: "mutation endpoints with body FKs" }
  - { priority: 4, category: state, check: "OCC: expected_member_version == Member.version / expected_reauthorization_version == Reauthorization.version", error_id: "ERR_STALE_MEMBER_VERSION | ERR_STALE_AUTHORIZATION_VERSION", http_status: 412, applies_to: "POST /mtm/diet-prescriptions/{id}/activate; POST /mtm/claims" }
  - { priority: 5, category: state, check: "Target resource state permits the operation per §1.2 transition preconditions", error_id: "ERR_MEMBER_NOT_ACTIVE | ERR_MEMBER_TERMINAL | ERR_REFERRAL_NOT_ACTIONABLE | ERR_REFERRAL_EXPIRED | ERR_PRESCRIPTION_NOT_DRAFT | ERR_PRESCRIPTION_NOT_ACTIVE | ERR_MENU_CYCLE_NOT_PLANNED | ERR_MENU_CYCLE_NOT_FROZEN | ERR_MENU_CYCLE_TERMINAL | ERR_MENU_CYCLE_HAS_OPEN_DELIVERIES | ERR_ROUTE_NOT_DISPATCHED | ERR_ROUTE_HAS_OPEN_DELIVERIES | ERR_DELIVERY_NOT_SCHEDULED | ERR_DELIVERY_NOT_OUT_FOR_DELIVERY | ERR_DELIVERY_TERMINAL | ERR_CLAIM_NOT_DRAFT | ERR_CLAIM_NOT_SUBMITTED | ERR_CLAIM_NOT_DENIED | ERR_CLAIM_NOT_VOIDABLE | ERR_AUTHORIZATION_NOT_PENDING | ERR_AUTHORIZATION_NOT_APPROVED | ERR_MENU_ITEM_RETIRED | ERR_INVALID_STATE", http_status: 409, applies_to: "state-transition and state-gated endpoints" }
  - { priority: 6, category: business_safety, check: "Freeze: no menu item allergen intersects Member.allergies UNION prescription.excluded_allergens; nutrition gates of pinned prescription diet_type all pass", error_id: "ERR_ALLERGEN_VIOLATION (checked first) | ERR_NUTRITION_NON_COMPLIANT", http_status: 422, applies_to: "POST /mtm/menu-cycles/{id}/freeze" }
  - { priority: 7, category: business_constraint, check: "Freeze: meals_count <= prescription.meals_per_week; claim void: X-User-ID != submitted_by_user_id; reauthorization approve: adherence_delivered_pct >= 80.00", error_id: "ERR_MEAL_COUNT_EXCEEDED | ERR_SEGREGATION_OF_DUTIES (403) | ERR_ADHERENCE_BELOW_THRESHOLD", http_status: 422, applies_to: "freeze; claim void; reauthorization approve" }
  - { priority: 8, category: business_temporal, check: "Route windows for same driver+date must not overlap under half-open [start,end) semantics (adjacency allowed); prescription effective windows for same member in {DRAFT, ACTIVE} must not overlap under closed-interval semantics (shared boundary date IS an overlap); delivery service_date must equal route.route_date and fall inside some APPROVED authorization window; reauthorization approve requires an outcome assessment with assessed_at >= current date - 90 days", error_id: "ERR_ROUTE_WINDOW_OVERLAP (409) | ERR_PRESCRIPTION_WINDOW_OVERLAP (409) | ERR_ROUTE_DATE_MISMATCH | ERR_SERVICE_DATE_OUT_OF_AUTHORIZATION | ERR_OUTCOME_ASSESSMENT_STALE (409)", http_status: 422, applies_to: "route create; prescription create; delivery schedule; reauthorization approve" }
  - { priority: 9, category: business_referential, check: "Referral belongs to member_id of prescription; authorization_id of claim belongs to claim's member; member confirm-receipt only on own delivery", error_id: "ERR_PRESCRIPTION_MEMBER_MISMATCH | ERR_AUTHORIZATION_MEMBER_MISMATCH | ERR_DELIVERY_NOT_OWNED (403)", http_status: 422, applies_to: "prescription create; claim create; delivery confirm-receipt" }
  - { priority: 10, category: business_fiscal, check: "Delivery schedule: covering authorizations exist but all exhausted; claim submit: provisional_gross_cents within authorization remaining amount", error_id: "ERR_AUTHORIZATION_EXHAUSTED | ERR_AUTHORIZATION_AMOUNT_EXCEEDED", http_status: 402, applies_to: "POST /mtm/deliveries; POST /mtm/claims/{id}/submit" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - { method: POST, path: "/mtm/_clock/set_current_utc", description: "Set the server logical clock. Startup default is exactly 2026-05-01T00:00:00Z before any set call; never falls back to wall-clock. Side effect: expiry sweep (referrals past expires_at -> EXPIRED; APPROVED authorizations past end_date -> EXPIRED).", roles: [ProgramAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["expiry sweep on Referral and Reauthorization"] }

  # --- members ---
  - { method: POST, path: "/mtm/members", description: "Register a member (status INTAKE)", roles: [CareCoordinator], code: 201, input: [full_name, payer_type, payer_member_id, allergies, income_fpl_percent, household_size, "diagnosis_codes?"], output: Member, side_effects: ["status=INTAKE; adherence fields 100.00; oop 0"] }
  - { method: GET, path: "/mtm/members", description: "List members", roles: *ALL_ROLES, code: 200, input: ["status?", "limit?", "offset?"], output: "Member[]", side_effects: [] }
  - { method: GET, path: "/mtm/members/{id}", description: "Get a member (includes computed adherence and oop fields)", roles: *ALL_ROLES, code: 200, input: [], output: Member, side_effects: [] }
  - { method: POST, path: "/mtm/members/{id}/status", description: "Member status transition (ACTIVE/SUSPENDED/DISENROLLED); disenroll fires the depth-3 cascade", roles: [CareCoordinator, ProgramAdmin], code: 200, input: [target_status], output: Member, side_effects: ["Member.version += 1; disenroll cascade: prescription REVOKED -> cycles CANCELLED -> deliveries CANCELLED + unit release"] }
  - { method: GET, path: "/mtm/members/{id}/summary", description: "Computed read: adherence variants, oop accumulator, active authorization", roles: *ALL_ROLES, code: 200, input: [], output: { member_id: string, status: string, adherence_delivered_pct: number, adherence_confirmed_pct: number, oop_accumulator_cents: integer, active_authorization_id: string }, side_effects: [] }

  # --- referrals ---
  - { method: POST, path: "/mtm/referrals", description: "Submit a referral (status SUBMITTED)", roles: [ReferringProvider], code: 201, input: [member_id, diagnosis_codes, referred_diet_type, expires_at], output: Referral, side_effects: ["provider_user_id from X-User-ID"] }
  - { method: GET, path: "/mtm/referrals", description: "List referrals", roles: *ALL_ROLES, code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: GET, path: "/mtm/referrals/{id}", description: "Get a referral", roles: *ALL_ROLES, code: 200, input: [], output: Referral, side_effects: [] }
  - { method: POST, path: "/mtm/referrals/{id}/decision", description: "Triage/accept/reject a referral", roles: [CareCoordinator], code: 200, input: [decision], output: Referral, side_effects: ["status transition per machine"] }

  # --- diet prescriptions ---
  - { method: POST, path: "/mtm/diet-prescriptions", description: "Create a DRAFT diet prescription against an ACCEPTED referral; closed-window overlap rejected", roles: [Dietitian], code: 201, input: [member_id, referral_id, diet_type, daily_sodium_mg_max, daily_potassium_mg_max, daily_phosphorus_mg_max, daily_carbs_g_max, daily_protein_g_min, excluded_allergens, meals_per_week, effective_from, effective_to], output: DietPrescription, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/mtm/diet-prescriptions", description: "List diet prescriptions", roles: *ALL_ROLES, code: 200, input: ["member_id?", "referral_id?", "supersedes_id?", "status?", "limit?", "offset?"], output: "DietPrescription[]", side_effects: [] }
  - { method: GET, path: "/mtm/diet-prescriptions/{id}", description: "Get a diet prescription", roles: *ALL_ROLES, code: 200, input: [], output: DietPrescription, side_effects: [] }
  - { method: POST, path: "/mtm/diet-prescriptions/{id}/activate", description: "Activate a DRAFT prescription (OCC on Member.version); supersedes the member's prior ACTIVE prescription and re-pins PLANNED cycles", roles: [Dietitian], code: 200, input: [expected_member_version], output: DietPrescription, side_effects: ["increments Member.version by 1", "referral -> CONSUMED", "prior ACTIVE -> SUPERSEDED", "PLANNED cycles re-pinned, compliance reset"] }
  - { method: POST, path: "/mtm/diet-prescriptions/{id}/revoke", description: "Revoke a DRAFT or ACTIVE prescription", roles: [Dietitian], code: 200, input: [], output: DietPrescription, side_effects: ["ACTIVE revoke cascades to PLANNED cycles"] }

  # --- menu items ---
  - { method: POST, path: "/mtm/menu-items", description: "Create a catalog meal", roles: [ProgramAdmin], code: 201, input: [name, sodium_mg, potassium_mg, phosphorus_mg, carbs_g, protein_g, allergen_codes, base_cost_cents], output: MenuItem, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/mtm/menu-items", description: "List menu items", roles: *ALL_ROLES, code: 200, input: ["status?", "limit?", "offset?"], output: "MenuItem[]", side_effects: [] }
  - { method: GET, path: "/mtm/menu-items/{id}", description: "Get a menu item", roles: *ALL_ROLES, code: 200, input: [], output: MenuItem, side_effects: [] }
  - { method: POST, path: "/mtm/menu-items/{id}/retire", description: "Retire a menu item", roles: [ProgramAdmin], code: 200, input: [], output: MenuItem, side_effects: ["status -> RETIRED"] }
  - { method: GET, path: "/mtm/menu-items/{id}/menu-cycle-items", description: "Reverse-reachability: cycle-item rows referencing this menu item", roles: *ALL_ROLES, code: 200, input: [], output: "MenuCycleItem[]", side_effects: [] }

  # --- menu cycles ---
  - { method: POST, path: "/mtm/menu-cycles", description: "Create a weekly menu cycle pinned to an ACTIVE prescription", roles: [Dietitian], code: 201, input: [member_id, prescription_id, week_start_date], output: MenuCycle, side_effects: ["status=PLANNED; prescription must be ACTIVE and belong to member"] }
  - { method: GET, path: "/mtm/menu-cycles", description: "List menu cycles", roles: *ALL_ROLES, code: 200, input: ["member_id?", "prescription_id?", "status?", "limit?", "offset?"], output: "MenuCycle[]", side_effects: [] }
  - { method: GET, path: "/mtm/menu-cycles/{id}", description: "Get a menu cycle", roles: *ALL_ROLES, code: 200, input: [], output: MenuCycle, side_effects: [] }
  - { method: GET, path: "/mtm/menu-cycles/{id}/items", description: "List the cycle's item lines", roles: *ALL_ROLES, code: 200, input: [], output: "MenuCycleItem[]", side_effects: [] }
  - { method: POST, path: "/mtm/menu-cycles/{id}/items", description: "Add an item line (cycle must be PLANNED; item must not be RETIRED)", roles: [Dietitian], code: 201, input: [menu_item_id, quantity], output: MenuCycleItem, side_effects: ["meals_count recomputed"] }
  - { method: DELETE, path: "/mtm/menu-cycles/{id}/items/{itemId}", description: "Remove an item line (cycle must be PLANNED)", roles: [Dietitian], code: 204, input: [], output: null, side_effects: ["meals_count recomputed"] }
  - { method: GET, path: "/mtm/menu-cycles/{id}/compliance", description: "Computed read: weekly nutrient totals, allergen violations, compliance verdict vs pinned prescription", roles: *ALL_ROLES, code: 200, input: [], output: { sodium_mg_total: integer, potassium_mg_total: integer, phosphorus_mg_total: integer, carbs_g_total: integer, protein_g_total: integer, meals_count: integer, allergen_violations: array, nutrient_violations: array, nutrition_compliant: boolean, allergen_ok: boolean }, side_effects: [] }
  - { method: POST, path: "/mtm/menu-cycles/{id}/freeze", description: "Freeze the cycle: member ACTIVE + allergen check + nutrition gates + meal-count cap", roles: [Dietitian], code: 200, input: [], output: MenuCycle, side_effects: ["status -> FROZEN; compliance_status -> PASSED; prescription pin locked"] }
  - { method: POST, path: "/mtm/menu-cycles/{id}/unfreeze", description: "Return a FROZEN cycle to PLANNED for revision (no open deliveries)", roles: [Dietitian], code: 200, input: [], output: MenuCycle, side_effects: ["status -> PLANNED; compliance_status -> UNCHECKED"] }
  - { method: POST, path: "/mtm/menu-cycles/{id}/cancel", description: "Cancel a PLANNED or FROZEN cycle; cancels open deliveries and releases reserved units", roles: [Dietitian], code: 200, input: [], output: MenuCycle, side_effects: ["open deliveries -> CANCELLED; reserved units released"] }

  # --- delivery routes ---
  - { method: POST, path: "/mtm/delivery-routes", description: "Create a route; same driver+date windows use half-open [start,end) overlap (adjacency allowed)", roles: [LogisticsCoordinator], code: 201, input: [driver_id, route_date, start_time, end_time, capacity_stops], output: DeliveryRoute, side_effects: ["status=PLANNED"] }
  - { method: GET, path: "/mtm/delivery-routes", description: "List routes", roles: *ALL_ROLES, code: 200, input: ["driver_id?", "route_date?", "status?", "limit?", "offset?"], output: "DeliveryRoute[]", side_effects: [] }
  - { method: GET, path: "/mtm/delivery-routes/{id}", description: "Get a route", roles: *ALL_ROLES, code: 200, input: [], output: DeliveryRoute, side_effects: [] }
  - { method: POST, path: "/mtm/delivery-routes/{id}/dispatch", description: "Dispatch a PLANNED route", roles: [LogisticsCoordinator], code: 200, input: [], output: DeliveryRoute, side_effects: ["status -> DISPATCHED"] }
  - { method: POST, path: "/mtm/delivery-routes/{id}/complete", description: "Complete a DISPATCHED route once all its deliveries are terminal", roles: [LogisticsCoordinator], code: 200, input: [], output: DeliveryRoute, side_effects: ["status -> COMPLETED"] }

  # --- deliveries ---
  - { method: POST, path: "/mtm/deliveries", description: "Schedule a delivery: cycle FROZEN, route PLANNED/DISPATCHED, service_date == route_date, waterfall unit reservation on the member's APPROVED authorizations", roles: [LogisticsCoordinator], code: 201, input: [member_id, menu_cycle_id, route_id, service_date], output: Delivery, side_effects: ["reserved_units += 1 on selected Reauthorization (version += 1); authorization_id set"] }
  - { method: GET, path: "/mtm/deliveries", description: "List deliveries", roles: *ALL_ROLES, code: 200, input: ["member_id?", "menu_cycle_id?", "route_id?", "authorization_id?", "status?", "limit?", "offset?"], output: "Delivery[]", side_effects: [] }
  - { method: GET, path: "/mtm/deliveries/{id}", description: "Get a delivery", roles: *ALL_ROLES, code: 200, input: [], output: Delivery, side_effects: [] }
  - { method: POST, path: "/mtm/deliveries/{id}/out-for-delivery", description: "Driver picks up the parcel (route must be DISPATCHED)", roles: [Driver], code: 200, input: [], output: Delivery, side_effects: ["status -> OUT_FOR_DELIVERY"] }
  - { method: POST, path: "/mtm/deliveries/{id}/mark-delivered", description: "Mark delivered: consumes a unit (reserved -> used), may exhaust authorization, may fulfill cycle", roles: [Driver], code: 200, input: [], output: Delivery, side_effects: ["reserved_units -= 1; used_units += 1; auto EXHAUSTED; auto cycle FULFILLED"] }
  - { method: POST, path: "/mtm/deliveries/{id}/mark-failed", description: "Mark failed: releases the reserved unit (compensation)", roles: [Driver], code: 200, input: [], output: Delivery, side_effects: ["reserved_units -= 1"] }
  - { method: POST, path: "/mtm/deliveries/{id}/confirm-receipt", description: "Member confirms receipt of own DELIVERED delivery", roles: [Member], code: 200, input: [], output: Delivery, side_effects: ["confirmed_at set; confirmed-based adherence recomputed"] }
  - { method: POST, path: "/mtm/deliveries/{id}/cold-chain-readings", description: "Append a temperature reading (delivery OUT_FOR_DELIVERY); replays excursion accumulation; may spoil the delivery", roles: [Driver], code: 201, input: [recorded_at, temp_celsius], output: ColdChainReading, side_effects: ["cumulative_excursion_minutes recomputed; cold_chain_status updated; SPOILED cascade releases reserved unit"] }
  - { method: GET, path: "/mtm/deliveries/{id}/cold-chain-readings", description: "List readings of a delivery, chronological order (recorded_at ASC, created_at ASC)", roles: *ALL_ROLES, code: 200, input: [], output: "ColdChainReading[]", side_effects: [] }

  # --- reauthorizations ---
  - { method: POST, path: "/mtm/reauthorizations", description: "Request a payer reauthorization (status PENDING)", roles: [CareCoordinator], code: 201, input: [member_id, authorized_units, max_amount_cents, start_date, end_date], output: Reauthorization, side_effects: ["status=PENDING"] }
  - { method: GET, path: "/mtm/reauthorizations", description: "List reauthorizations", roles: *ALL_ROLES, code: 200, input: ["member_id?", "status?", "limit?", "offset?"], output: "Reauthorization[]", side_effects: [] }
  - { method: GET, path: "/mtm/reauthorizations/{id}", description: "Get a reauthorization (used/reserved/available units, consumed amount)", roles: *ALL_ROLES, code: 200, input: [], output: Reauthorization, side_effects: [] }
  - { method: POST, path: "/mtm/reauthorizations/{id}/approve", description: "Approve: adherence_delivered_pct >= 80.00 and outcome assessment within trailing 90 days", roles: [PayerReviewer], code: 200, input: [authorization_number], output: Reauthorization, side_effects: ["status -> APPROVED; authorization_number recorded; version += 1"] }
  - { method: POST, path: "/mtm/reauthorizations/{id}/deny", description: "Deny a PENDING reauthorization", roles: [PayerReviewer], code: 200, input: [reason], output: Reauthorization, side_effects: ["status -> DENIED"] }

  # --- outcome assessments ---
  - { method: POST, path: "/mtm/outcome-assessments", description: "Dietitian records an outcome assessment", roles: [Dietitian], code: 201, input: [member_id, assessed_at, weight_kg, hba1c_pct, "notes?"], output: OutcomeAssessment, side_effects: ["dietitian_user_id from X-User-ID"] }
  - { method: GET, path: "/mtm/outcome-assessments", description: "List outcome assessments", roles: *ALL_ROLES, code: 200, input: ["member_id?", "limit?", "offset?"], output: "OutcomeAssessment[]", side_effects: [] }
  - { method: GET, path: "/mtm/outcome-assessments/{id}", description: "Get an outcome assessment", roles: *ALL_ROLES, code: 200, input: [], output: OutcomeAssessment, side_effects: [] }

  # --- claims ---
  - { method: POST, path: "/mtm/claims", description: "Create a DRAFT claim for a cycle with >= 1 DELIVERED delivery (OCC on Reauthorization.version); computes provisional amounts", roles: [BillingSpecialist], code: 201, input: [member_id, menu_cycle_id, authorization_id, expected_reauthorization_version], output: Claim, side_effects: ["increments Reauthorization.version by 1", "provisional_gross/member_cost_share/plan_liability computed", "payer_type_snapshot taken"] }
  - { method: GET, path: "/mtm/claims", description: "List claims", roles: *ALL_ROLES, code: 200, input: ["member_id?", "menu_cycle_id?", "authorization_id?", "status?", "limit?", "offset?"], output: "Claim[]", side_effects: [] }
  - { method: GET, path: "/mtm/claims/{id}", description: "Get a claim", roles: *ALL_ROLES, code: 200, input: [], output: Claim, side_effects: [] }
  - { method: POST, path: "/mtm/claims/{id}/submit", description: "Submit a DRAFT claim (state check on cycle, then authorization state, then fiscal headroom)", roles: [BillingSpecialist], code: 200, input: [], output: Claim, side_effects: ["status -> SUBMITTED; submitted_by_user_id recorded"] }
  - { method: POST, path: "/mtm/claims/{id}/remit", description: "Payer adjudication: PAID (remitted == plan_liability), PARTIALLY_PAID (0 < remitted < plan_liability), DENIED (no amount)", roles: [PayerReviewer], code: 200, input: [outcome, "remitted_amount_cents?"], output: Claim, side_effects: ["PAID/PARTIAL: member oop += cost share; authorization consumed += remitted (version += 1)"] }
  - { method: POST, path: "/mtm/claims/{id}/correct", description: "Return a DENIED claim to DRAFT for correction (resubmission cycle)", roles: [BillingSpecialist], code: 200, input: [], output: Claim, side_effects: ["status -> DRAFT"] }
  - { method: POST, path: "/mtm/claims/{id}/void", description: "Void a PAID/PARTIALLY_PAID claim; segregated from the submitter; reverses oop and consumed ledgers", roles: [BillingSpecialist], code: 200, input: [], output: Claim, side_effects: ["member oop -= cost share; authorization consumed -= remitted (version += 1)"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/empty" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request, missing required field, type mismatch, invalid enum/date" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "Body member_id does not exist" }
  - { id: ERR_REFERRAL_NOT_FOUND, http: 404, condition: "Body referral_id does not exist" }
  - { id: ERR_PRESCRIPTION_NOT_FOUND, http: 404, condition: "Body prescription_id does not exist" }
  - { id: ERR_MENU_ITEM_NOT_FOUND, http: 404, condition: "Body menu_item_id does not exist" }
  - { id: ERR_MENU_CYCLE_NOT_FOUND, http: 404, condition: "Body menu_cycle_id does not exist" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "Body route_id does not exist" }
  - { id: ERR_AUTHORIZATION_NOT_FOUND, http: 404, condition: "Body authorization_id does not exist" }
  - { id: ERR_STALE_MEMBER_VERSION, http: 412, condition: "expected_member_version does not match current Member.version" }
  - { id: ERR_STALE_AUTHORIZATION_VERSION, http: 412, condition: "expected_reauthorization_version does not match current Reauthorization.version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure not covered by a domain error" }
  - { id: ERR_MEMBER_NOT_ACTIVE, http: 409, condition: "Member must be ACTIVE for this operation" }
  - { id: ERR_MEMBER_TERMINAL, http: 409, condition: "Member is DISENROLLED (terminal) or operation targets terminal member" }
  - { id: ERR_REFERRAL_NOT_ACTIONABLE, http: 409, condition: "Referral not in the required state (SUBMITTED for triage; TRIAGED for accept/reject; ACCEPTED for prescription create/activate)" }
  - { id: ERR_REFERRAL_EXPIRED, http: 409, condition: "Logical clock date is past referral expires_at" }
  - { id: ERR_PRESCRIPTION_NOT_DRAFT, http: 409, condition: "Prescription must be DRAFT (activate) or DRAFT/ACTIVE (revoke)" }
  - { id: ERR_PRESCRIPTION_NOT_ACTIVE, http: 409, condition: "Pinned prescription must be ACTIVE (menu-cycle create/freeze)" }
  - { id: ERR_PRESCRIPTION_WINDOW_OVERLAP, http: 409, condition: "Closed effective window overlaps another DRAFT/ACTIVE prescription of the same member (shared boundary date counts as overlap)" }
  - { id: ERR_PRESCRIPTION_MEMBER_MISMATCH, http: 422, condition: "Referral belongs to a different member than the prescription's member_id" }
  - { id: ERR_MENU_CYCLE_NOT_PLANNED, http: 409, condition: "Menu cycle must be PLANNED (freeze, item add/remove)" }
  - { id: ERR_MENU_CYCLE_NOT_FROZEN, http: 409, condition: "Menu cycle must be FROZEN (unfreeze, delivery schedule) or FROZEN/FULFILLED (claim submit)" }
  - { id: ERR_MENU_CYCLE_TERMINAL, http: 409, condition: "Menu cycle is FULFILLED or CANCELLED" }
  - { id: ERR_MENU_CYCLE_HAS_OPEN_DELIVERIES, http: 409, condition: "Unfreeze blocked while deliveries are SCHEDULED or OUT_FOR_DELIVERY" }
  - { id: ERR_MENU_ITEM_RETIRED, http: 409, condition: "Cannot add a RETIRED menu item to a cycle" }
  - { id: ERR_ROUTE_NOT_DISPATCHED, http: 409, condition: "Route must be DISPATCHED (out-for-delivery, complete)" }
  - { id: ERR_ROUTE_HAS_OPEN_DELIVERIES, http: 409, condition: "Route completion blocked by non-terminal deliveries" }
  - { id: ERR_ROUTE_WINDOW_OVERLAP, http: 409, condition: "Same driver has a non-terminal route the same date whose half-open window intersects" }
  - { id: ERR_ROUTE_DATE_MISMATCH, http: 422, condition: "Delivery service_date must equal the route's route_date" }
  - { id: ERR_DELIVERY_NOT_SCHEDULED, http: 409, condition: "Delivery must be SCHEDULED for out-for-delivery" }
  - { id: ERR_DELIVERY_NOT_OUT_FOR_DELIVERY, http: 409, condition: "Delivery must be OUT_FOR_DELIVERY (mark-delivered, mark-failed, cold-chain readings)" }
  - { id: ERR_DELIVERY_TERMINAL, http: 409, condition: "Delivery is in a terminal state or cold-chain SPOILED" }
  - { id: ERR_DELIVERY_NOT_OWNED, http: 403, condition: "Member may confirm receipt only of own deliveries (X-User-ID must equal Delivery.member_id)" }
  - { id: ERR_CLAIM_NOT_DRAFT, http: 409, condition: "Claim must be DRAFT for submit" }
  - { id: ERR_CLAIM_NOT_SUBMITTED, http: 409, condition: "Claim must be SUBMITTED for remit" }
  - { id: ERR_CLAIM_NOT_DENIED, http: 409, condition: "Claim must be DENIED for correct" }
  - { id: ERR_CLAIM_NOT_VOIDABLE, http: 409, condition: "Claim must be PAID or PARTIALLY_PAID to void" }
  - { id: ERR_REMIT_AMOUNT_MISMATCH, http: 422, condition: "PAID requires remitted == plan_liability; PARTIALLY_PAID requires 0 < remitted < plan_liability; DENIED requires no amount" }
  - { id: ERR_AUTHORIZATION_NOT_PENDING, http: 409, condition: "Reauthorization must be PENDING for approve/deny" }
  - { id: ERR_AUTHORIZATION_NOT_APPROVED, http: 409, condition: "Claim submit requires authorization status APPROVED" }
  - { id: ERR_AUTHORIZATION_MEMBER_MISMATCH, http: 422, condition: "Authorization belongs to a different member than the claim" }
  - { id: ERR_AUTHORIZATION_EXHAUSTED, http: 402, condition: "Covering APPROVED authorizations exist but none has available_units >= 1" }
  - { id: ERR_AUTHORIZATION_AMOUNT_EXCEEDED, http: 402, condition: "Claim provisional_gross_cents exceeds authorization remaining amount (max - consumed)" }
  - { id: ERR_SERVICE_DATE_OUT_OF_AUTHORIZATION, http: 422, condition: "No APPROVED authorization window covers the delivery service_date" }
  - { id: ERR_ALLERGEN_VIOLATION, http: 422, condition: "A cycle item contains an allergen in Member.allergies UNION prescription.excluded_allergens" }
  - { id: ERR_NUTRITION_NON_COMPLIANT, http: 422, condition: "Weekly nutrient totals violate the pinned prescription's diet_type gates" }
  - { id: ERR_MEAL_COUNT_EXCEEDED, http: 422, condition: "meals_count exceeds prescription.meals_per_week" }
  - { id: ERR_ADHERENCE_BELOW_THRESHOLD, http: 409, condition: "Member adherence_delivered_pct < 80.00 at reauthorization approval" }
  - { id: ERR_OUTCOME_ASSESSMENT_STALE, http: 409, condition: "No outcome assessment within trailing 90 days at reauthorization approval" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Claim void attempted by the same operator id that submitted the claim" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "Platform operator: catalog administration and logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /mtm/menu-items; POST /mtm/menu-items/{id}/retire"
      - "POST /mtm/_clock/set_current_utc"
    shared_operations:
      - "POST /mtm/members/{id}/status (with CareCoordinator)"
      - "All GET endpoints"
  - name: CareCoordinator
    description: "Member intake, referral triage, reauthorization requests"
    identity: opaque
    exclusive_operations:
      - "POST /mtm/members"
      - "POST /mtm/referrals/{id}/decision"
      - "POST /mtm/reauthorizations"
    shared_operations:
      - "POST /mtm/members/{id}/status (with ProgramAdmin)"
      - "All GET endpoints"
  - name: ReferringProvider
    description: "External physician submitting MTM referrals"
    identity: opaque
    exclusive_operations:
      - "POST /mtm/referrals"
    shared_operations: ["All GET endpoints"]
  - name: Dietitian
    description: "Registered dietitian: diet prescriptions, menu cycles, outcome assessments"
    identity: opaque
    exclusive_operations:
      - "POST /mtm/diet-prescriptions; POST /mtm/diet-prescriptions/{id}/activate; POST /mtm/diet-prescriptions/{id}/revoke"
      - "POST /mtm/menu-cycles; POST /mtm/menu-cycles/{id}/items; DELETE /mtm/menu-cycles/{id}/items/{itemId}; POST /mtm/menu-cycles/{id}/freeze; POST /mtm/menu-cycles/{id}/unfreeze; POST /mtm/menu-cycles/{id}/cancel"
      - "POST /mtm/outcome-assessments"
    shared_operations: ["All GET endpoints"]
  - name: LogisticsCoordinator
    description: "Delivery routing and scheduling"
    identity: opaque
    exclusive_operations:
      - "POST /mtm/delivery-routes; POST /mtm/delivery-routes/{id}/dispatch; POST /mtm/delivery-routes/{id}/complete"
      - "POST /mtm/deliveries"
    shared_operations: ["All GET endpoints"]
  - name: Driver
    description: "Route driver: transit transitions and cold-chain readings"
    identity: opaque
    exclusive_operations:
      - "POST /mtm/deliveries/{id}/out-for-delivery; POST /mtm/deliveries/{id}/mark-delivered; POST /mtm/deliveries/{id}/mark-failed"
      - "POST /mtm/deliveries/{id}/cold-chain-readings"
    shared_operations: ["All GET endpoints"]
  - name: BillingSpecialist
    description: "Payer billing: claim creation, submission, correction, void (void segregated from submitter)"
    identity: opaque
    exclusive_operations:
      - "POST /mtm/claims; POST /mtm/claims/{id}/submit; POST /mtm/claims/{id}/correct; POST /mtm/claims/{id}/void"
    shared_operations: ["All GET endpoints"]
  - name: PayerReviewer
    description: "Payer-side reviewer: reauthorization adjudication and claim remittance"
    identity: opaque
    exclusive_operations:
      - "POST /mtm/reauthorizations/{id}/approve; POST /mtm/reauthorizations/{id}/deny"
      - "POST /mtm/claims/{id}/remit"
    shared_operations: ["All GET endpoints"]
  - name: Member
    description: "The patient; confirms receipt of own deliveries"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /mtm/deliveries/{id}/confirm-receipt (only when X-User-ID == Delivery.member_id)"
    shared_operations: ["All GET endpoints"]
