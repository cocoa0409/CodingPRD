            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 1000.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-02", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 0.00, expected_field_lot_version: "${l_v}" }, as: StorageManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer I", variety: "RUSSET_BURBANK", committed_volume_cwt: 600.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 100.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o1_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o1_id}/allocate", payload: {}, as: SalesManager }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 100.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o2_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o2_id}/allocate", payload: {}, as: SalesManager }
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-09T20:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/pack-orders/${o1_id}/pack-runs", payload: { scheduled_start: "2026-08-10T08:00:00Z", scheduled_end: "2026-08-10T10:00:00Z" }, as: PackLineSupervisor, captures: { r1_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-10T00:30:00Z", turbidity_ntu: 5.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager }
