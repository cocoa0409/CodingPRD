        claim_type: variant_selection
        grounds:
          - "calculations.censored_substitution"
          - "calculations.assessment_statistics"
          - "calculations.reassessment_due_date"
        distinguishing_aspect: "Detection ratio 1/3 < 0.5 forces the HALF branch: the two non-detects enter at 0.0026 each, yielding GM 0.0044 / GSD 2.4758 / UCL 0.0202 / LCL 0.0010, class BELOW_PEL_MONITOR; signing sets next_sample_due_date 2027-02-06 (+180d)."
