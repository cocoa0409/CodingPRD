          - calculations.campaign_billing_cost
        distinguishing_aspect: "With three QUEUED requests and batch_size 2, exactly the two oldest (created_at ASC) move to SENT with send_index 1 and 2, the third stays QUEUED, remaining_queued is 1 and billing_cost is 0.02 (two EMAIL lines at 0.01)."
