          the request names a custodian whose certification lapsed on 2026-08-15 AND requests a window
          that strictly overlaps an existing open transfer on the same item, and the response MUST be
          ERR_CUSTODIAN_NOT_CERTIFIED rather than ERR_CUSTODY_WINDOW_CONFLICT.
        test_recipe:
