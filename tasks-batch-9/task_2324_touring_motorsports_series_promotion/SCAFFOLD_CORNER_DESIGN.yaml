        excluded_because:
          difficulty_instance: "boundary_precision_check / run_order_exact_fit_at_the_show_window_then_one_more_segment_overruns"
          rationale: "Half-open adjacency, the FLOOR_RESET_MINUTES insertion between consecutive COMPETITION segments and the exact fit at show_window_minutes are all asserted offset by offset there."

      - name: corner_calc_venue_occupancy_padded_intervals
        claim_type: Correct Result
        grounds:
          - calculations.venue_occupancy_conflict
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / venue_occupancy_is_closed_and_turnaround_padded_so_an_exact_touch_collides"
          rationale: "The closed-interval plus turnaround-pad semantics, including the one-second admission either side of the pad, are that instance's subject."

      - name: corner_calc_haul_buffer_derived_window
        claim_type: Correct Result
        grounds:
          - calculations.haul_buffer_requirement
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / haul_buffer_is_a_one_sided_distance_derived_window_between_consecutive_stops"
          rationale: "CEIL(miles / HAUL_AVG_MPH) + HAUL_REST_HOURS against the preceding stop's tear-down is asserted at the exact-fit and one-hour-short distances there."

      - name: corner_calc_marketing_cap_ladder
        claim_type: Constants Applied
        grounds:
          - calculations.marketing_allocation_admission
        excluded_because:
          difficulty_instance: "boundary_precision_check / grassroots_channel_cap_admits_exact_equality_then_rejects_one_cent"
          rationale: "The stop cap, the per-channel caps and their inclusive equality boundary are asserted with pinned cap values there."
  - section: validations
    instances:
      - name: corner_validation_auth_then_shape_then_path_resolution_ladder
        claim_type: Priority Ordering
        grounds:
          - validations[order=1]
          - validations[order=2]
          - validations[order=3]
          - validations[order=4]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Four rules are simultaneously violable on one request against a non-existent booking id. The declared order forces exactly one answer at each rung: no X-User-ID beats everything (401), a wrong role beats body shape (403), a missing required body field beats path resolution (422), and only a fully well-formed authorised request reaches the 404. A server that resolves the path first would answer 404 to all four."
        test_recipe:
          setup:
            - "A Season, a Venue and one real TERMS_PROPOSED booking, so the final positive call has something to withdraw"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
          trigger:
            - call: "POST /venue-bookings/00000000-0000-0000-0000-0000000000ff/withdraw"
              payload: { reason: "no identity on this request" }
              as: SeriesPromoter
              as_user_id: ""
              captures: { err_401: "$.data.error_id" }
            - call: "POST /venue-bookings/00000000-0000-0000-0000-0000000000ff/withdraw"
              payload: { reason: "wrong role" }
              as: TicketingManager
              as_user_id: "tm-1"
              captures: { err_403: "$.data.error_id" }
            - call: "POST /venue-bookings/00000000-0000-0000-0000-0000000000ff/withdraw"
              payload: {}
              as: SeriesPromoter
              as_user_id: "sp-1"
              captures: { err_422: "$.data.error_id" }
            - call: "POST /venue-bookings/00000000-0000-0000-0000-0000000000ff/withdraw"
              payload: { reason: "well formed but unknown id" }
              as: SeriesPromoter
              as_user_id: "sp-1"
              captures: { err_404: "$.data.error_id" }
            - call: "POST /venue-bookings/${b_atl}/withdraw"
              payload: { reason: "the same request against a real booking" }
              as: SeriesPromoter
              as_user_id: "sp-1"
          assert:
            - "trigger call 1 returns HTTP 401 with ${err_401} == ERR_UNAUTHENTICATED (order 1 wins even though the path id is unknown)"
            - "trigger call 2 returns HTTP 403 with ${err_403} == ERR_UNAUTHORIZED (order 2 beats both the shape and the path)"
            - "trigger call 3 returns HTTP 422 with ${err_422} == ERR_INVALID_REQUEST because `reason` is required (order 3 beats order 4)"
            - "trigger call 4 returns HTTP 404 with ${err_404} == ERR_VENUE_BOOKING_NOT_FOUND"
            - "trigger call 5 returns HTTP 200 and VenueBooking.${b_atl}.state == WITHDRAWN, so the rejections were about the request, not the operation"
            - "none of the four rejections mutated anything: VenueBooking.${b_atl}.version was unchanged until trigger call 5"

      - name: corner_validation_staging_window_is_inclusive_at_both_ends
        claim_type: Temporal validation
        grounds:
          - validations[order=36]
          - global_constants.STAGING_OPEN_HOURS_BEFORE_SHOW
          - global_constants.STAGING_CLOSE_HOURS_BEFORE_SHOW
          - calculations.logistics_readiness_score.variants
        distinguishing_aspect: "The staging window is derived from show_start_utc (23:00Z) as [15:00Z, 21:00Z] and BOTH bounds are inclusive, so 14:59:59Z is refused, 15:00:00Z is admitted, 21:00:00Z is still admitted and 21:00:01Z is refused. The promised scheduled_arrival_utc never gates the door — it only shows up afterwards as the POST_STAGING slip penalty, which is why the 21:00Z arrival that promised 16:00Z is admitted but scores 85."
        test_recipe:
          setup:
            - "A CONFIRMED ATL booking with its TourStop, show_start_utc 2026-11-14T23:00:00Z"
            - "Three ENTERED entries from one competitor, each promising arrival at 2026-11-14T16:00:00Z with haul 100 miles"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
