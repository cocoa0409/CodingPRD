# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Traffic Citation Payment & Traffic School — Expert tier
# Breadth probe over §1.1-§1.7. Sections/claim_types come from
# references/claim-extraction-guide.md. excluded_because stubs cite §1.8 by name.
# Standard jurisdiction A config (created inline; same as the difficulty file):
#   base_court_fee_cents=5000, surcharge_pct=0.20, late_penalty_cents=3000,
#   installment_setup_fee_cents=2500, min_installment_cents=2000,
#   collections_age_days=30, collections_fee_pct=0.25, traffic_school_fee_cents=4000,
#   school_eligible_max_points=1, school_cooldown_months=18,
#   point_suspension_threshold=4, point_window_months=12.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_citation_returns_201_with_initial_fields
        claim_type: Creation
        grounds: [entities.Citation.fields.financial_status, endpoints]
        distinguishing_aspect: "POST /citations with all required fields returns 201; financial_status=DRAFT, adjudication_status=NONE, disposition=OPEN, version=1, balance_cents=0."
        test_recipe:
          setup: ["Jurisdiction A and driver D exist."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "EC1LIC", full_name: "Ent One" }
              as: CourtClerk
              captures: { d: $.data.id }
          trigger:
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "EC-1", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
          assert:
            - "Response status == 201"
            - "Citation.${cid}.financial_status == DRAFT"
            - "Citation.${cid}.adjudication_status == NONE"
            - "Citation.${cid}.disposition == OPEN"
            - "Citation.${cid}.version == 1"
            - "Citation.${cid}.balance_cents == 0"

      - name: get_citation_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /citations/{non-existent uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Jurisdiction A exists; no citation with the queried id."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
          trigger:
            - call: "GET /citations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CourtClerk
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_charge_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.CitationCharge.fields.base_fine_cents, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /charges omitting base_fine_cents returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A DRAFT citation exists."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "EC2LIC", full_name: "Ent Two" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "EC-2", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Unsafe speed", points: 1 }
              as: CourtClerk
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: computed_balance_ignores_client_supplied_balance
        claim_type: Computed Fields
        grounds: [entities.Citation.fields.balance_cents, calculations.assessed_total]
        distinguishing_aspect: "balance_cents is computed; a client cannot set it. After assessment balance_cents equals assessed_total_cents (29000), regardless of any input."
        test_recipe:
          setup: ["Jurisdiction A; citation with one charge base 20000; assessed."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "EC3LIC", full_name: "Ent Three" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "EC-3", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
          trigger:
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
          assert:
            - "Citation.${cid}.balance_cents == 29000"
            - "Citation.${cid}.base_fine_cents == 20000"

      - name: list_citations_paginated_envelope
        claim_type: Listing
        grounds: [endpoints, response_envelope]
        distinguishing_aspect: "GET /citations returns a paginated array envelope with total_count and has_more; filtering by driver_id returns only that driver's citations."
        test_recipe:
          setup: ["Jurisdiction A; driver D with two citations."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "EC4LIC", full_name: "Ent Four" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "EC-4A", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "EC-4B", issued_at: "2026-01-11T00:00:00Z", appear_by: "2026-02-11T00:00:00Z" }
              as: CourtClerk
          trigger:
            - call: "GET /citations?driver_id=${d}"
              payload: {}
              as: CourtClerk
          assert:
            - "Response status == 200; response_type == array"
            - "meta.total_count == 2; has_more == false"
            - "Both citations belong to driver ${d}"

      - name: immutable_point_ledger_entry_no_version_field
        claim_type: Immutability
        grounds: [entities.PointLedgerEntry.fields.state]
        distinguishing_aspect: "PointLedgerEntry has common_fields:false (no version field, no update endpoint); it is only read via GET /point-ledger and mutated solely by system cascades (UPHOLD post, school mask)."
        test_recipe:
          setup: ["A driver with one UPHELD citation -> one PointLedgerEntry."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CourtClerk
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "EC5LIC", full_name: "Ent Five" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "EC-5", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /citations/${cid}/contest-requests"
              payload: { grounds: "g" }
              as: Driver
              as_user_id: "${d}"
              captures: { req: $.data.id }
            - call: "POST /contest-requests/${req}/schedule"
              payload: { hearing_at: "2026-03-01T00:00:00Z" }
              as: CourtClerk
            - call: "POST /contest-requests/${req}/decide"
              payload: { verdict: "UPHOLD" }
              as: HearingOfficer
          trigger:
            - call: "GET /point-ledger?driver_id=${d}"
              payload: {}
              as: DmvAdmin
          assert:
            - "Exactly one PointLedgerEntry exists for driver ${d} with points==1, state==ACTIVE; no version field present on the row"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: assess_twice_second_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Citation.DRAFT_to_ASSESSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Assessing an already-ASSESSED citation returns ERR_INVALID_STATE (409); financial_status stays ASSESSED; no side effects."
        test_recipe:
          setup: ["Citation already assessed."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "SM1LIC", full_name: "Sm One" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "SM-1", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
          trigger:
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: assess_without_charges_returns_no_charges
        claim_type: precondition_violation
        grounds: [state_machines.Citation.DRAFT_to_ASSESSED, "errors[ERR_NO_CHARGES]"]
        distinguishing_aspect: "Assessing a DRAFT citation with zero charges returns ERR_NO_CHARGES (409)."
        test_recipe:
          setup: ["A DRAFT citation with no charges."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "SM2LIC", full_name: "Sm Two" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "SM-2", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
              captures: { eid: $.data.error_id }
          assert:
            - "Response status == 409"
            - "data.error_id == ERR_NO_CHARGES"

      - name: void_terminal_then_assess_returns_invalid_state
        claim_type: terminal_lockdown
        grounds: [state_machines.Citation.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "VOID is terminal; assessing a VOID citation returns ERR_INVALID_STATE (409); no transition leaves a terminal state."
        test_recipe:
          setup: ["A DRAFT citation voided (no charges needed for void from DRAFT)."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "SM3LIC", full_name: "Sm Three" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "SM-3", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /citations/${cid}/void"
              payload: {}
              as: CourtClerk
          trigger:
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
              captures: { eid: $.data.error_id }
          assert:
            - "Citation.${cid}.financial_status == VOID before the trigger"
            - "Response status == 409; data.error_id == ERR_INVALID_STATE"

      - name: contest_request_starts_in_requested
        claim_type: initial_state
        grounds: [state_machines.ContestRequest.initial_state, entities.Citation.fields.adjudication_status]
        distinguishing_aspect: "A newly filed ContestRequest is REQUESTED and the parent Citation.adjudication_status flips to CONTESTED."
        test_recipe:
          setup: ["An assessed citation owned by the filing driver."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "SM4LIC", full_name: "Sm Four" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "SM-4", issued_at: "2026-01-10T00:00:00Z", appear_by: "2026-02-10T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
          trigger:
            - call: "POST /citations/${cid}/contest-requests"
              payload: { grounds: "I was not speeding" }
              as: Driver
              as_user_id: "${d}"
              captures: { req: $.data.id }
            - call: "GET /citations/${cid}"
              payload: {}
              as: Driver
              as_user_id: "${d}"
          assert:
            - "ContestRequest.${req}.status == REQUESTED"
            - "ContestRequest.${req}.continuance_count == 0"
            - "Citation.${cid}.adjudication_status == CONTESTED"

      - name: dismiss_zeroes_balance_and_closes_citation
        claim_type: side_effect
        grounds: [state_machines.ContestRequest.HEARING_SET_to_DISMISSED, entities.Citation.fields.disposition]
        distinguishing_aspect: "DISMISS verdict sets Citation.adjudication_status=DISMISSED, balance_cents=0, disposition=CLOSED; no PointLedgerEntry is posted."
        test_recipe:
          setup: ["Assessed citation (balance 29000), contest filed and HEARING_SET."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CourtClerk
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "SM5LIC", full_name: "Sm Five" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "SM-5", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /citations/${cid}/contest-requests"
              payload: { grounds: "Wrong reading" }
              as: Driver
              as_user_id: "${d}"
              captures: { req: $.data.id }
            - call: "POST /contest-requests/${req}/schedule"
              payload: { hearing_at: "2026-03-01T00:00:00Z" }
              as: CourtClerk
          trigger:
            - call: "POST /contest-requests/${req}/decide"
              payload: { verdict: "DISMISS" }
              as: HearingOfficer
            - call: "GET /citations/${cid}"
              payload: {}
              as: Driver
              as_user_id: "${d}"
            - call: "GET /point-ledger?driver_id=${d}"
              payload: {}
              as: DmvAdmin
          assert:
            - "ContestRequest.${req}.status == DISMISSED"
            - "Citation.${cid}.adjudication_status == DISMISSED"
            - "Citation.${cid}.balance_cents == 0"
            - "Citation.${cid}.disposition == CLOSED"
            - "Zero PointLedgerEntry rows exist for driver ${d}"

      - name: fta_creates_warrant_and_fta_hold
        claim_type: side_effect
        grounds: [state_machines.ContestRequest.HEARING_SET_to_FTA, entities.Warrant.fields.status, entities.LicenseHold.fields.hold_type]
        distinguishing_aspect: "fail-to-appear after hearing_at sets ContestRequest FTA, creates an ACTIVE Warrant(FTA_HEARING), and opens an FTA_HOLD; Driver.license_status becomes HELD and fta_warrant_active true."
        test_recipe:
          setup: ["Assessed citation, contest HEARING_SET for 2026-03-01; clock advanced past the hearing to 2026-03-02."]
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Court A", state_code: "CA", base_court_fee_cents: 5000, surcharge_pct: 0.20, late_penalty_cents: 3000, installment_setup_fee_cents: 2500, min_installment_cents: 2000, collections_age_days: 30, collections_fee_pct: 0.25, traffic_school_fee_cents: 4000, school_eligible_max_points: 1, school_cooldown_months: 18, point_suspension_threshold: 4, point_window_months: 12 }
              as: CourtClerk
              captures: { jid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CourtClerk
            - call: "POST /drivers"
              payload: { jurisdiction_id: "${jid}", license_number: "SM6LIC", full_name: "Sm Six" }
              as: CourtClerk
              captures: { d: $.data.id }
            - call: "POST /citations"
              payload: { driver_id: "${d}", citation_number: "SM-6", issued_at: "2026-01-04T00:00:00Z", appear_by: "2026-02-04T00:00:00Z" }
              as: CourtClerk
              captures: { cid: $.data.id }
            - call: "POST /charges"
              payload: { citation_id: "${cid}", violation_code: "VC22350", description: "Unsafe speed", base_fine_cents: 20000, points: 1 }
              as: CourtClerk
            - call: "POST /citations/${cid}/assess"
              payload: {}
              as: CourtClerk
            - call: "POST /citations/${cid}/contest-requests"
              payload: { grounds: "Will appear" }
              as: Driver
              as_user_id: "${d}"
              captures: { req: $.data.id }
            - call: "POST /contest-requests/${req}/schedule"
              payload: { hearing_at: "2026-03-01T00:00:00Z" }
              as: CourtClerk
            - call: "POST /_clock/set_current_utc"
