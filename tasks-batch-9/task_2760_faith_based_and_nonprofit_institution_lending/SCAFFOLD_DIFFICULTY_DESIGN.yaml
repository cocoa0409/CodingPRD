      - name: loan_parallel_servicing_status_and_risk_posture_evolve_independently
        grounds:
          - state_machines.Loan.dimension.servicing_status
          - state_machines.Loan.dimension.risk_posture
          - state_machines.Covenant.transitions["COMPLIANT -> BREACH_PENDING_CURE"]
          - validations[priority=27].ERR_LOAN_TERMINAL
          - endpoints["POST /loans/{loan_id}/construction-completion"]
        distinguishing_aspect: |
          The two Loan dimensions advance on disjoint triggers and must not contaminate
          each other: a FAIL covenant test moves risk_posture OPEN -> WATCH while
          servicing_status stays CONSTRUCTION_DRAW; construction-completion and the
          payoff payment then walk servicing_status CONSTRUCTION_DRAW -> AMORTIZING ->
          PAID_OFF while risk_posture stays pinned at WATCH with the covenant still in
          BREACH_PENDING_CURE. The coupling is one-directional: reaching the PAID_OFF
          terminal in the servicing dimension makes further covenant tests fail with
          ERR_LOAN_TERMINAL, yet PAID_OFF never resets the posture to OPEN. A single-enum
          implementation cannot hold WATCH and PAID_OFF simultaneously.
