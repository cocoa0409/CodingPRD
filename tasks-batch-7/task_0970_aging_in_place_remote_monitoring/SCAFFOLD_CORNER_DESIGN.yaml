          assert:
            - "err == 'ERR_WINDOW_TOO_SHORT' (HTTP 422); no appointment created"
      - name: duplicate_final_report_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_DUPLICATE_REPORT]"]
        distinguishing_aspect: "A second FINAL report whose period overlaps an existing FINAL report for the same senior is rejected ERR_DUPLICATE_REPORT (409); PROVISIONAL reports are unaffected."
        test_recipe:
          setup: ["ACTIVE senior (wellness-enabled plan) with a FINAL report for 2026-05-01..2026-05-02 already generated at clock 2026-05-02T00:01:00Z"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PREMIUM", monthly_fee_cents: 9000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 8, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "WEEKLY" }, as: PlatformAdmin, captures: { plan_dup: $.data.id } }
