            - call: "POST /field-force/territories/${t2}/representatives"
              payload: { employee_id: "E9002", full_name: "Rep Jay", hire_date: "2021-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0009", brand_name: "Oncalex", controlled: false, per_visit_max_units: 4, annual_max_units_per_prescriber: 40, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
