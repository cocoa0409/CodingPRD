  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: jurisdiction_forum_overlap_half_open_adjacency
        grounds:
          - validations[priority=21]
          - errors[ERR_FORUM_TIME_OVERLAP]
          - entities.Forum.fields.scheduled_start
        distinguishing_aspect: |
          Half-open interval semantics on the Jurisdiction resource: forums in one
          jurisdiction occupy [scheduled_start, scheduled_end), so an exactly adjacent
          forum (start == prior end) is legal while a one-hour-into-it start collides.
        test_recipe:
          setup:
            - "One jurisdiction with two CANDIDATE_RACE contests in QUESTIONNAIRE_PHASE. Three distinct qualified moderators (M1, M2, M3) so the moderator buffer rule cannot interfere."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-09-01T00:00:00Z" }, as: LeagueAdmin }
            - { call: "POST /volunteers", payload: { volunteer_name: "Cara Coordinator", chapter_code: "CH1", roles: ["COORDINATOR"] }, as: LeagueAdmin, captures: { coord_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Mod One", chapter_code: "CH1", roles: ["MODERATOR"] }, as: LeagueAdmin, captures: { mod1: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Mod Two", chapter_code: "CH1", roles: ["MODERATOR"] }, as: LeagueAdmin, captures: { mod2: "$.data.id" } }
            - { call: "POST /volunteers", payload: { volunteer_name: "Mod Three", chapter_code: "CH1", roles: ["MODERATOR"] }, as: LeagueAdmin, captures: { mod3: "$.data.id" } }
            - { call: "POST /election-cycles", payload: { cycle_name: "2026 General", election_date: "2026-11-03" }, as: LeagueAdmin, captures: { cyc_id: "$.data.id" } }
            - { call: "POST /election-cycles/${cyc_id}/transitions", payload: { to: "OPEN" }, as: LeagueAdmin }
            - { call: "POST /election-cycles/${cyc_id}/jurisdictions", payload: { jurisdiction_name: "City of Springfield", fips_code: "06001", supported_language_codes: ["EN"], reading_level_metric: "FLESCH_KINCAID" }, as: LeagueAdmin, captures: { jur_id: "$.data.id" } }
