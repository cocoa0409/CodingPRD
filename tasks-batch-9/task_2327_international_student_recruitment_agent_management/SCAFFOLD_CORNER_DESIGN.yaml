            - 'both entries are still state "ACCRUED" with amount_cents 80000 and 100000 - the application reached ENROLLED, so its accruals are vested and a CONVENIENCE termination forfeits nothing'
            - 'Agency.${ag1_id}.net_earned_commission_cents == 180000 and StudentApplication.${a1_id}.net_commission_cents == 180000'
            - 'GET /recruitment/file-transitions returns total_count == 0 - ENROLLED is outside {DRAFT, SUBMITTED, ADMITTED, DEPOSIT_PAID} so no student file is transitioned'
            - 'StudentApplication.${a1_id}.custody_agency_id == "${ag1_id}" (custody unchanged)'

      - name: accrual_amount_matches_the_formula_for_known_inputs
        claim_type: correct_result
        excluded_because:
          difficulty_instance: platinum_accrual_rate_cap_and_cent_cap_interaction
          rationale: |
            That instance already pins the full milestone_commission_amount formula on known
            inputs - base bps plus the PLATINUM tier bonus, then the rate_cap_bps clamp, then
            round_half_up, then the per_milestone_cap_cents clamp - and asserts the exact
            cent amount at every stage, so a second known-inputs check would be redundant.

      - name: fraud_index_threshold_boundary
        claim_type: threshold
        excluded_because:
          difficulty_instance: fraud_index_flag_boundary_at_exactly_sixty
          rationale: |
            The boundary_precision_check instance already tests 59 (stays PENDING), exactly
            60 (auto-FLAGGED) and 61 on the FLAG_THRESHOLD constant, which is the only
            threshold boundary this scaffold exposes on the fraud index.

      - name: clawback_processing_order_is_chronological
        claim_type: chronological
        excluded_because:
          difficulty_instance: clawback_per_entry_rounding_order_pinned
          rationale: |
            That instance drives withdrawal_clawback_ledger over three accruals created in a
            non-chronological registration order and asserts that the per-entry results and
            their sum are identical to the chronological expectation, which is exactly the
            processing-order claim for this algorithm.

      - name: ledger_balance_aggregation_after_reversal
        claim_type: aggregation
        excluded_because:
          difficulty_instance: withdrawal_clawback_restores_zero_net_with_paid_liability
          rationale: |
            agency_commission_ledger_balance is asserted there both after the accruals are
            added and after they are reversed by the clawback, including the floor at zero
            and the separation of clawback_liability_cents, covering the running-total and
            reversal claims.

      - name: tier_bonus_applies_per_tier_band
        claim_type: tiered_pricing
        excluded_because:
          difficulty_instance: platinum_accrual_rate_cap_and_cent_cap_interaction
          rationale: |
            The TIER_BONUS_BPS bands are the tiering dimension of this scaffold, and that
            instance already shows the PLATINUM band raising the effective rate to the
            rate_cap while the UNRATED baseline in this file (80000 at 400 bps) fixes the
            zero-bonus band, so both ends of the tier ladder are pinned.

      - name: territory_interval_adjacency_and_overlap
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: exclusive_territory_cooloff_shadow_blocks_adjacent_interval
          rationale: |
            That instance covers the interval geometry of territory_exclusive_occupancy for
            the hard cases - a strictly adjacent interval that is still inside the 30-day
            cool-off shadow, the first day outside it, and a disjoint interval that is
            unaffected.

      - name: scorecard_weights_sum_without_drift
        claim_type: weighted_scoring
        excluded_because:
          difficulty_instance: scorecard_composite_platinum_band_at_exactly_zero_point_eight_five
          rationale: |
            The composite is asserted there from its three 4-decimal components with the
            0.45/0.35/0.20 weights, showing that rounding the components before weighting
            does not drift the composite off the tier boundary.

      - name: projection_includes_pending_milestones
        claim_type: forward_looking
        excluded_because:
          difficulty_instance: commission_projection_versus_final_net_after_tier_drop
          rationale: |
            The provisional_forward_looking variant is exercised there over an application
            with milestones still pending, and the projection is re-read after the pending
            set changes, which is the forward-looking claim.

      - name: entitlement_variants_diverge
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: agency_risk_rolling_versus_lifetime_band_divergence
          rationale: |
            Divergence is asserted there on the same incident data with an explicit non-zero
            lifetime_minus_rolling_delta, and this file's decay instance repeats the
            67.50 versus 90.00 split as a secondary witness.

      - name: correct_entitlement_variant_selected_per_context
        claim_type: variant_selection
        excluded_because:
          difficulty_instance: commission_projection_versus_final_net_after_tier_drop
          rationale: |
            That instance asserts that the provisional variant answers the projection read
            while the final_chronological variant is what materialises into CommissionEntry
            rows, which is precisely the context-selection claim.

      - name: projection_to_final_reconciliation_delta
        claim_type: reconciliation
        excluded_because:
          difficulty_instance: commission_projection_versus_final_net_after_tier_drop
          rationale: |
            The variant_delta_cents field is asserted there before and after the tier drop,
            so the delta applied to the ledger when the calculation switches from
            provisional to final is already pinned.

  # ===========================================================================
  # From Table 4 (Validations)
  # ===========================================================================
  - section: validations
    instances:
      - name: unauthenticated_call_missing_x_user_id_header
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: |
          Priority 10 runs before everything else: a request with a well-formed body but no
          X-User-ID header is rejected with ERR_UNAUTHENTICATED (401) and creates nothing.
        test_recipe:
          setup:
            - "No preconditions; the request is sent with the X-Role header only and the X-User-ID header omitted entirely."
          setup_api_calls: []
          trigger:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Anonymous Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: null
              captures: { err_auth: "$.data.error_id" }
          assert:
            - 'HTTP 401 with data.error_id == "ERR_UNAUTHENTICATED"'
            - 'GET /recruitment/agencies (as RecruitmentOfficer with a valid X-User-ID) returns total_count == 0 - no agency was created'

      - name: registrar_unauthorized_outranks_invalid_payload
        claim_type: priority_ordering
        grounds:
          - validations[priority=15]
          - validations[priority=20]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          The same request violates both the role rule (priority 15) and the schema rule
          (priority 20, home_country_code missing); the response is ERR_UNAUTHORIZED (403),
          proving the role check runs first and never leaks schema detail to a caller who
          has no business calling the endpoint.
        test_recipe:
          setup:
            - "No preconditions."
          setup_api_calls: []
          trigger:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Wrong Role Agency" }
              as: Registrar
              as_user_id: "registrar-1"
              captures: { err_role: "$.data.error_id" }
          assert:
            - 'HTTP 403 with data.error_id == "ERR_UNAUTHORIZED"'
            - 'data.error_id is not "ERR_INVALID_REQUEST" even though home_country_code is absent'

      - name: duplicate_program_code_and_certification_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=75]
          - errors[ERR_DUPLICATE_RESOURCE]
        distinguishing_aspect: |
          Priority 75 covers two different uniqueness scopes: a globally unique Program.code
          and at most one VALID TrainingCertification per (agency_id, module_code). Both
          duplicates return ERR_DUPLICATE_RESOURCE (409).
        test_recipe:
          setup:
            - "One program with code MSCS-2026 and one agency already holding a VALID PROGRAM_ACCURACY certification."
          setup_api_calls:
            - call: "POST /recruitment/programs"
              payload: { code: "MSCS-2026", name: "MSc Computer Science", level: "POSTGRADUATE", annual_tuition_cents: 2000000, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2027-02-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { prog1_id: "$.data.id" }
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Duplicate Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/training-certifications"
              payload: { module_code: "PROGRAM_ACCURACY", score: 92, issued_on: "2026-08-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { cert_pa_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/programs"
              payload: { code: "MSCS-2026", name: "MSc Computer Science (duplicate)", level: "POSTGRADUATE", annual_tuition_cents: 2100000, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2027-02-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_prog: "$.data.error_id" }
            - call: "POST /recruitment/agencies/${ag1_id}/training-certifications"
              payload: { module_code: "PROGRAM_ACCURACY", score: 95, issued_on: "2026-08-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_cert: "$.data.error_id" }
          assert:
            - 'both calls return HTTP 409 with data.error_id == "ERR_DUPLICATE_RESOURCE"'
            - 'GET /recruitment/agencies/${ag1_id}/training-certifications returns total_count == 1 and the surviving row is ${cert_pa_id} with score 92'

      - name: program_term_window_incoherent_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=69]
          - errors[ERR_TERM_WINDOW_INVALID]
        distinguishing_aspect: |
          Priority 69 checks intra-record date coherence: census_date before term_start_date
          and persistence_check_date not after census_date are both ERR_TERM_WINDOW_INVALID
          (422), and the coherent variant of the same record is accepted.
        test_recipe:
          setup:
            - "No preconditions."
          setup_api_calls: []
          trigger:
            - call: "POST /recruitment/programs"
              payload: { code: "BAD-1", name: "Census Before Term Start", level: "POSTGRADUATE", annual_tuition_cents: 2000000, term_start_date: "2026-09-01", census_date: "2026-08-15", persistence_check_date: "2027-02-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_census: "$.data.error_id" }
            - call: "POST /recruitment/programs"
              payload: { code: "BAD-2", name: "Persistence Equals Census", level: "POSTGRADUATE", annual_tuition_cents: 2000000, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2026-09-30" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_pers: "$.data.error_id" }
            - call: "POST /recruitment/programs"
              payload: { code: "GOOD-1", name: "Coherent Program", level: "POSTGRADUATE", annual_tuition_cents: 2000000, term_start_date: "2026-09-01", census_date: "2026-09-30", persistence_check_date: "2027-02-15" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { prog_ok_id: "$.data.id" }
          assert:
            - 'the first two calls return HTTP 422 with data.error_id == "ERR_TERM_WINDOW_INVALID"'
            - 'the third call returns HTTP 201 and Program.${prog_ok_id}.commission_eligible == true'
            - 'GET /recruitment/programs/${prog_ok_id} returns census_date "2026-09-30" and persistence_check_date "2027-02-15"'

      - name: exclusive_assignment_requires_permissive_contract_model
        claim_type: conditional_validation
        grounds:
          - validations[priority=76]
          - errors[ERR_EXCLUSIVITY_NOT_PERMITTED]
          - entities.AgentContract.fields.exclusivity_model
        distinguishing_aspect: |
          The rule fires only for contracts configured NON_EXCLUSIVE_ONLY: on such a contract
          an EXCLUSIVE assignment is ERR_EXCLUSIVITY_NOT_PERMITTED (422) while the identical
          request with exclusivity NON_EXCLUSIVE succeeds, and on an EXCLUSIVE_ALLOWED
          contract the EXCLUSIVE request is accepted.
        test_recipe:
          setup:
            - "Agency ag1 holds contract c1 with exclusivity_model NON_EXCLUSIVE_ONLY; agency ag2 holds contract c2 with EXCLUSIVE_ALLOWED."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Non Exclusive Agency", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-NX", exclusivity_model: "NON_EXCLUSIVE_ONLY", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id" }
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Exclusive Agency", home_country_code: "VN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag2_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag2_id}", contract_ref: "CTR-EX", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c2_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/contracts/${c1_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "EXCLUSIVE", start_date: "2026-08-01", end_date: "2027-07-31" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_excl: "$.data.error_id" }
            - call: "POST /recruitment/contracts/${c1_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "NON_EXCLUSIVE", start_date: "2026-08-01", end_date: "2027-07-31" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { t_nx_id: "$.data.id" }
            - call: "POST /recruitment/contracts/${c2_id}/territory-assignments"
              payload: { country_code: "VN", exclusivity: "EXCLUSIVE", start_date: "2026-08-01", end_date: "2027-07-31" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { t_ex_id: "$.data.id" }
          assert:
            - 'the first call returns HTTP 422 with data.error_id == "ERR_EXCLUSIVITY_NOT_PERMITTED"'
            - 'the second call returns HTTP 201 with TerritoryAssignment.${t_nx_id}.exclusivity == "NON_EXCLUSIVE" and .status == "ACTIVE"'
            - 'the third call returns HTTP 201 with TerritoryAssignment.${t_ex_id}.exclusivity == "EXCLUSIVE" (the rule does not fire on an EXCLUSIVE_ALLOWED contract)'

      - name: non_exclusive_capacity_boundary_is_aggregate
        claim_type: aggregate_validation
        grounds:
          - validations[priority=66]
          - errors[ERR_TERRITORY_CAPACITY_EXCEEDED]
          - calculations.territory_exclusive_occupancy.constants[MAX_CONCURRENT_NON_EXCLUSIVE]
        distinguishing_aspect: |
          Each of the four NON_EXCLUSIVE requests is individually legal; only the collective
          count matters. The third request lands exactly on MAX_CONCURRENT_NON_EXCLUSIVE (3)
          and is accepted, and the fourth is ERR_TERRITORY_CAPACITY_EXCEEDED (409).
        test_recipe:
          setup:
            - "Four distinct agencies each hold one NON_EXCLUSIVE_ONLY contract over 2026-08-01..2027-07-31 (an agency may hold only one live contract, so four agencies are required)."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Capacity Agency One", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Capacity Agency Two", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag2_id: "$.data.id" }
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Capacity Agency Three", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag3_id: "$.data.id" }
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Capacity Agency Four", home_country_code: "IN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag4_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-CAP-1", exclusivity_model: "NON_EXCLUSIVE_ONLY", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag2_id}", contract_ref: "CTR-CAP-2", exclusivity_model: "NON_EXCLUSIVE_ONLY", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c2_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag3_id}", contract_ref: "CTR-CAP-3", exclusivity_model: "NON_EXCLUSIVE_ONLY", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c3_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag4_id}", contract_ref: "CTR-CAP-4", exclusivity_model: "NON_EXCLUSIVE_ONLY", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c4_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/contracts/${c1_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "NON_EXCLUSIVE", start_date: "2026-08-01", end_date: "2027-07-31" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { t1_id: "$.data.id" }
            - call: "POST /recruitment/contracts/${c2_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "NON_EXCLUSIVE", start_date: "2026-08-01", end_date: "2027-07-31" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { t2_id: "$.data.id" }
            - call: "POST /recruitment/contracts/${c3_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "NON_EXCLUSIVE", start_date: "2026-08-01", end_date: "2027-07-31" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { t3_id: "$.data.id" }
            - call: "POST /recruitment/contracts/${c4_id}/territory-assignments"
              payload: { country_code: "IN", exclusivity: "NON_EXCLUSIVE", start_date: "2026-08-01", end_date: "2027-07-31" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { err_cap: "$.data.error_id" }
            - call: "GET /recruitment/territory-occupancy"
              payload: { country_code: "IN", at_date: "2026-09-01" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
          assert:
            - 'the first three calls return HTTP 201 and TerritoryAssignment ${t1_id}, ${t2_id}, ${t3_id} are all "ACTIVE"'
            - 'the fourth call returns HTTP 409 with data.error_id == "ERR_TERRITORY_CAPACITY_EXCEEDED"'
            - 'the occupancy read returns data.non_exclusive_active_count == 3, data.exclusive_active_count == 0 and data.exclusive_slot_available == false (three non-exclusive holders block a new exclusive grant)'

      - name: exclusive_assignment_passes_when_country_is_free
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=65]
          - calculations.territory_exclusive_occupancy
          - endpoints["GET /recruitment/territory-occupancy"]
        distinguishing_aspect: |
          With no prior assignment for the country the exclusivity geometry rule is satisfied
          and the EXCLUSIVE grant is accepted; the occupancy read then shows the country
          occupied with the cool-off shadow reaching 30 days past the interval end.
        test_recipe:
          setup:
            - "One agency with one EXCLUSIVE_ALLOWED contract and no territory assignments anywhere."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Free Country Agency", home_country_code: "VN" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-FREE", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id" }
          trigger:
            - call: "POST /recruitment/contracts/${c1_id}/territory-assignments"
              payload: { country_code: "VN", exclusivity: "EXCLUSIVE", start_date: "2026-08-01", end_date: "2026-12-31" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { t1_id: "$.data.id" }
            - call: "GET /recruitment/territory-occupancy"
              payload: { country_code: "VN", at_date: "2026-09-01" }
              as: ComplianceOfficer
              as_user_id: "compliance-1"
          assert:
            - 'HTTP 201 with TerritoryAssignment.${t1_id}.status == "ACTIVE" and .released_on == null'
            - 'the occupancy read returns data.exclusive_active_count == 1, data.non_exclusive_active_count == 0, data.exclusive_slot_available == false'
            - 'data.exclusive_cooloff_until == "2027-01-30" (end_date 2026-12-31 plus EXCLUSIVE_COOLOFF_DAYS 30)'

      - name: compliance_approve_requires_cleared_agency
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=50]
          - errors[ERR_AGENCY_NOT_CLEARED]
          - state_machines.AgentContract.status.PENDING_COMPLIANCE_REVIEW_to_ACTIVE
        distinguishing_aspect: |
          Contract paperwork may be prepared and signed while the agency is still in
          SCREENING, but COMPLIANCE_APPROVE reads the other entity's vetting_state and
          returns ERR_AGENCY_NOT_CLEARED (422); clearing the agency makes the identical call
          succeed.
        test_recipe:
          setup:
            - "Agency ag1 is in SCREENING with a complete due-diligence checklist."
            - "Contract c1 for ag1 carries a rate card and has been sent for signature and signed."
          setup_api_calls:
            - call: "POST /recruitment/agencies"
              payload: { legal_name: "Not Cleared Yet Agency", home_country_code: "IN", ownership_disclosed: true, beneficial_owner_count: 1, sanctions_screen_passed: true, reference_check_count: 2 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { ag1_id: "$.data.id" }
            - call: "POST /recruitment/agencies/${ag1_id}/vetting"
              payload: { action: "SUBMIT_FOR_SCREENING" }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
            - call: "POST /recruitment/contracts"
              payload: { agency_id: "${ag1_id}", contract_ref: "CTR-001", exclusivity_model: "EXCLUSIVE_ALLOWED", term_start_date: "2026-08-01", term_end_date: "2027-07-31", annual_commission_cap_cents: 5000000 }
              as: RecruitmentOfficer
              as_user_id: "officer-1"
              captures: { c1_id: "$.data.id", c1_v: "$.data.version" }
