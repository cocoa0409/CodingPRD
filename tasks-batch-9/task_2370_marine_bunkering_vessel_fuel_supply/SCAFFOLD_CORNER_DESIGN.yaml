          - state_machines.DeliveryOrder.RESURVEYED_to_AGREED
        distinguishing_aspect: "Variant choice is not a pure function of Customer.settlement_basis: for a SUPPLIER_FIGURES customer whose order was first agreed at 1198.450 and then disputed, the AGREE after the resurvey must select the joint_survey variant, yielding agreed 1193.700, basis JOINT_SURVEY and shortfall 4.750."
        test_recipe:
          setup:
            - "Base chain through complete-pumping for a SUPPLIER_FIGURES customer: measurement AGREED at 1198.450, basis SUPPLIER_FIGURES, shortfall 0.000"
            - "No BunkerDeliveryNote has been issued, so the DISPUTE right is still open"
            - "vessel_sounding_mt 1191.200 < barge_sounding_mt 1198.450, satisfying the discrepancy precondition"
            - "The CustomerRep disputes, the Surveyor resurveys at 1193.700"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: OpsCoordinator
            - call: "POST /ports"
              payload: { port_code: "NLRTM", name: "Rotterdam", eca_zone: true, eca_sulfur_limit_pct: 0.100, notice_lead_hours: 24, concurrent_ops_capacity: 2 }
              as: OpsCoordinator
              captures: { port_id: $.data.id }
            - call: "POST /fuel-grades"
              payload: { grade_code: "MGO-DMA", max_sulfur_pct: 0.100, eca_permitted: true, test_tolerance_pct: 0.010, index_code: "MGO-ARA", base_barging_rate_usd_per_mt: 9.50, min_barging_fee_usd: 2000.00, cross_contamination_group: "DISTILLATE" }
              as: OpsCoordinator
              captures: { grade_id: $.data.id }
            - call: "POST /index-quotes"
              payload: { grade_id: "${grade_id}", quote_date: "2026-08-03T00:00:00Z", price_usd_per_mt: 705.00 }
              as: OpsCoordinator
            - call: "POST /customers"
              payload: { name: "Aegean Lines", credit_limit_usd: 5000000.00, settlement_basis: "SUPPLIER_FIGURES" }
              as: CreditController
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-assets"
              payload: { name: "Bunker Alpha", asset_type: "BARGE", capacity_mt: 3000.000, home_port_id: "${port_id}", boom_certified: true, turnaround_buffer_minutes: 90 }
              as: OpsCoordinator
              captures: { asset_id: $.data.id }
            - call: "POST /nominations"
              payload: { customer_id: "${cust_id}", port_id: "${port_id}", grade_id: "${grade_id}", vessel_imo: "9123456", vessel_name: "MV Anemos", nominated_quantity_mt: 1200.000, window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-11T06:00:00Z", delivery_mode: "BARGE", declared_sulfur_pct: 0.100, eca_documentation_ref: "CHG-2026-0001" }
              as: OpsCoordinator
              captures: { nom_id: $.data.id }
            - call: "POST /nominations/${nom_id}/compliance-review"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              as_user_id: "co-001"
            - call: "POST /nominations/${nom_id}/confirm"
              payload: {}
              as: OpsCoordinator
              captures: { nom_v3: $.data.version }
            - call: "POST /delivery-orders"
              payload: { nomination_id: "${nom_id}", asset_id: "${asset_id}", planned_quantity_mt: 1200.000, slot_start: "2026-08-10T06:00:00Z", slot_end: "2026-08-10T12:00:00Z", expected_nomination_version: "${nom_v3}" }
              as: OpsCoordinator
              captures: { order_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:30:00Z" }
              as: OpsCoordinator
            - call: "POST /delivery-orders/${order_id}/clear"
              payload: { port_clearance_ref: "PA-RTM-0001" }
              as: OpsCoordinator
            - call: "POST /delivery-orders/${order_id}/start-pumping"
              payload: {}
              as: BargeMaster
              as_user_id: "${asset_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T14:30:00Z" }
              as: OpsCoordinator
            - call: "POST /delivery-orders/${order_id}/complete-pumping"
              payload: { barge_sounding_mt: 1198.450, vessel_sounding_mt: 1191.200, meter_mt: 1197.800 }
              as: BargeMaster
              as_user_id: "${asset_id}"
            - call: "POST /delivery-orders/${order_id}/quantity-decision"
              payload: { decision: "DISPUTE" }
              as: CustomerRep
              as_user_id: "${cust_id}"
            - call: "POST /delivery-orders/${order_id}/joint-survey"
              payload: { surveyed_mt: 1193.700 }
              as: Surveyor
              as_user_id: "sv-001"
          trigger:
            - call: "POST /delivery-orders/${order_id}/quantity-decision"
              payload: { decision: "AGREE" }
              as: Surveyor
              as_user_id: "sv-001"
          assert:
            - "HTTP 200 with DeliveryOrder.${order_id}.measurement_status == AGREED"
            - "DeliveryOrder.${order_id}.measurement_basis == JOINT_SURVEY even though Customer.settlement_basis == SUPPLIER_FIGURES"
            - "DeliveryOrder.${order_id}.agreed_quantity_mt == 1193.700 (the surveyed figure governs)"
            - "DeliveryOrder.${order_id}.shortfall_mt == 4.750 (1198.450 - 1193.700)"
            - "DeliveryOrder.${order_id}.barge_sounding_mt == 1198.450 and meter_mt == 1197.800 are unchanged"

      - name: exposure_input_set_filtering_by_invoice_status
        claim_type: input_set_filtering
        grounds:
          - calculations.customer_credit_exposure.input_set
        excluded_because:
          difficulty_instance: compensating_invariant / receivable_balance_conserved_across_issue_and_void
          rationale: "That instance drives an invoice through PROVISIONAL, ISSUED and VOID and asserts the exposure at each step, proving that only ISSUED and CREDIT_APPLIED rows enter settled_receivables and that the stem re-enters the open-commitment set after the void."
      - name: offspec_verdict_precision_at_trip_point
        claim_type: precision
        grounds:
          - calculations.offspec_verdict.precision
          - calculations.offspec_verdict.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / sulfur_offspec_at_exact_tolerance_boundary
          rationale: "That instance tests measured_sulfur_pct at exactly the 0.110 trip point (ON_SPEC, exceedance 0.000) and one thousandth above it (OFF_SPEC, exceedance 0.001)."
      - name: agreed_quantity_variant_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.agreed_quantity_resolution.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / agreed_quantity_supplier_vs_joint_survey_basis
          rationale: "That instance runs identical figures through both variants and asserts the 6.600 mt delta between agreed_quantity_mt 1198.450 and 1191.850."
      - name: claim_credit_reconciliation_into_invoice
        claim_type: reconciliation
        grounds:
          - calculations.remediation_credit
          - entities.Invoice.fields.claim_credit_usd
          - entities.Invoice.fields.final_amount_usd
        excluded_because:
          difficulty_instance: transitive_cascade / claim_acceptance_credit_cascade_depth_three
          rationale: "That instance asserts the accepted 44732.00 credit landing on claim_credit_usd, final_amount_usd 896461.73, the customer receivable and the credit_status step from HOLD to WATCH."

