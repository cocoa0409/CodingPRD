          - validations.priority_1
        distinguishing_aspect: "Priority 1 outranks everything: a request with no X-User-Role header returns 401 ERR_UNAUTHENTICATED even though the body is also missing a required field, so ERR_INVALID_REQUEST at priority 6 is never reported."
