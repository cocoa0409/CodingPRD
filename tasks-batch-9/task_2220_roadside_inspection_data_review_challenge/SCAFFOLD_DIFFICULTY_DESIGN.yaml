      - name: adjudication_court_and_record_dimensions_advance_independently
        grounds:
          - state_machines.CitationAdjudication.PENDING_to_REDUCED
          - state_machines.CitationAdjudication.NOT_APPLIED_to_APPLIED
          - entities.CitationAdjudication.fields.record_update_status
          - calculations.violation_severity_pin
          - calculations.basic_measure_recompute
        distinguishing_aspect: |
          CitationAdjudication carries two orthogonal state dimensions: recording court_status REDUCED
          sets severity_factor 0.5 but leaves record_update_status NOT_APPLIED and the violation
          untouched at time_weighted_severity 15.0, and only the later apply-to-record call moves the
          record dimension to APPLIED (violation RECODED, re-pinned to 9.0) while court_status stays
          REDUCED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Carrier c1 (20 power units, 1,600,000 VMT) -> MEDIUM, power_unit_exposure 30.0."
            - "UNSAFE_DRIVING code weight 5 (charged) and UNSAFE_DRIVING code weight 3 (reduced-to); UNSAFE_DRIVING/MEDIUM threshold 0.5 / 1.0 / 2.0."
            - "One SCORED report dated 2026-07-01 with a single weight-5 UNSAFE_DRIVING violation (time_weighted_severity 15.0, certified_measure 0.500, percentile 50.0, MONITOR)."
            - "A PENDING CitationAdjudication on that violation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
