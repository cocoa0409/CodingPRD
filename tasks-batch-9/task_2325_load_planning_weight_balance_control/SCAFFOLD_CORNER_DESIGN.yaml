      - name: declaration_quantity_and_non_dangerous_declarations_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - validations[priority=22]
          - errors[ERR_NOT_DANGEROUS_GOODS]
          - errors[ERR_DG_QUANTITY_EXCEEDS_ITEM]
        distinguishing_aspect: |
          Two guards on declaration submission, ordered so that the flag is
          checked before the quantity: a declaration against a consignment not
          flagged as dangerous goods is refused with ERR_NOT_DANGEROUS_GOODS
          (409), and a declaration of 500 kg against a 400 kg dangerous-goods
          consignment is refused with ERR_DG_QUANTITY_EXCEEDS_ITEM (422). The
          non-dangerous probe uses a gate-bag consignment created directly, so
          it is still BOOKED and the consignment state rule cannot mask the
          flag rule.
        test_recipe:
          setup:
            - "AC1 with H4, R1 with the [15,30) band, STD-2026, FLT; one 400 kg dangerous-goods consignment stowed in H4 and one 20 kg GATE_BAG consignment that is not dangerous goods and remains BOOKED."
