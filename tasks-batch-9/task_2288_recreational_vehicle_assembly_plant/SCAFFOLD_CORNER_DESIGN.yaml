      - name: chassis_selection_ranks_by_receipt_date_then_by_gvwr
        claim_type: chronological
        grounds:
          - calculations.chassis_match_selection.formula
          - endpoints["POST /unit-orders/{id}/match-chassis"]
        distinguishing_aspect: "Ranking key 1 (received_at ASC) decides the first match outright — the 2026-08-02 chassis wins over both 2026-08-03 arrivals — and only when key 1 ties does key 2 (gvwr ASC) decide, so the second order takes the 9500 lb chassis over the 9600 lb one; a wheelbase-mismatched chassis is never a candidate at all."
