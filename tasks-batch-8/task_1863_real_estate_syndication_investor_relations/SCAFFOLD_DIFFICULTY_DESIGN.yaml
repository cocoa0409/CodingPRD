      - name: distribution_pay_conserves_pool_across_lines
        grounds:
          - state_machines.Distribution.APPROVED_to_PAID
          - calculations.distribution_waterfall_allocation
          - entities.Offering.fields.total_distributed_cents
        distinguishing_aspect: |
          Conserved quantity: sum of DistributionLine.total_cents across a
          distribution (a line-level allocation invariant). The forward action
          is Distribution APPROVED -> PAID; the invariant is that the sum of
          line.total_cents equals Distribution.total_distributable_cents
          exactly, and that Offering.total_distributed_cents increases by
          exactly that amount (no drift, no leak).
        test_recipe:
          setup:
            - "Offering with two FUNDED subscriptions: A=$60K, B=$40K; total_funded_cents=10000000"
            - "Capital event executed with net_distributable=12000000"
            - "Distribution in APPROVED with total_distributable_cents=12000000 (lines computed via waterfall)"
            - "Offering.total_distributed_cents == 0"
