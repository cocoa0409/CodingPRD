        claim_type: violation_to_error
        grounds:
          - "validations[priority 38]"
          - "validations[priority 39]"
          - "validations[priority 43]"
          - "errors[ERR_ASSIGNED_ARREARS_NOT_COMPROMISABLE]"
          - "errors[ERR_COMPROMISE_RISK_TOO_HIGH]"
