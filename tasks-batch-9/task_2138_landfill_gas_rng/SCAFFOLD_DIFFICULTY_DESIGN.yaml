              as: WellfieldTechnician
            - call: "POST /wells/${w2_id}/readings"
              payload: { taken_at: "2026-08-10T01:00:00Z", methane_pct: 55.0, oxygen_pct: 0.8, nitrogen_pct: 4.0, temperature_f: 118.0, flow_scfm: 470.0, vacuum_inhg: 22.5 }
