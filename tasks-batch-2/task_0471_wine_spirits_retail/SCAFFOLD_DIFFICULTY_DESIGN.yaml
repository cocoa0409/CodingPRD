        distinguishing_aspect: "Different conserved quantity (monthly used_ml, not lot units): submit creates an active ComplianceWindow of 1500ml; cancel deactivates it so the customer's used_ml for (state,month) returns to 0 — the second over-cap submit that follows now succeeds, proving volume was restored."
        test_recipe:
          setup:
            - "Clock 2026-06-01. Age-verified customer. StateRule TX cap 1500ml. SHIP order 750ml*2 = 1500ml submitted then cancelled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
