  - section: errors
    instances:

      - name: every_not_found_error_id_is_reachable_from_its_own_resource
        claim_type: error_reachability
        grounds:
          - errors.ERR_PRODUCTION_NOT_FOUND
          - errors.ERR_ARCHIVE_NOT_FOUND
          - errors.ERR_FAIR_USE_ANALYSIS_NOT_FOUND
          - errors.ERR_OPINION_LETTER_NOT_FOUND
          - errors.ERR_SUBJECT_RELEASE_NOT_FOUND
          - errors.ERR_CLEARANCE_CHART_NOT_FOUND
          - errors.ERR_EO_APPLICATION_NOT_FOUND
          - errors.ERR_DELIVERY_PACKAGE_NOT_FOUND
          - validations[priority=5]
        distinguishing_aspect: "Priority 5 must resolve the PATH resource per entity type with its own error id — seven distinct 404 codes off seven distinct paths, all with the same syntactically valid UUID, so no handler may fall back to a generic ERR_NOT_FOUND."
        test_recipe:
          setup: ["One real production exists so the database is not empty; every id used in the trigger is a well-formed UUID that was never minted."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Reachability", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
          trigger:
            - call: "GET /productions/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProductionAdmin
            - call: "GET /archives/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ArchiveResearcher
            - call: "GET /fair-use-analyses/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: LegalCounsel
            - call: "POST /opinion-letters/00000000-0000-4000-8000-000000000004/state"
              payload: { to_status: "ISSUED" }
              as: LegalCounsel
            - call: "GET /subject-releases/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ProductionAdmin
            - call: "GET /clearance-charts/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ClearanceSupervisor
            - call: "GET /eo-applications/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ProductionAdmin
            - call: "GET /delivery-packages/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ProductionAdmin
          assert:
            - "the eight calls return 404 with error ids ERR_PRODUCTION_NOT_FOUND, ERR_ARCHIVE_NOT_FOUND, ERR_FAIR_USE_ANALYSIS_NOT_FOUND, ERR_OPINION_LETTER_NOT_FOUND, ERR_SUBJECT_RELEASE_NOT_FOUND, ERR_CLEARANCE_CHART_NOT_FOUND, ERR_EO_APPLICATION_NOT_FOUND and ERR_DELIVERY_PACKAGE_NOT_FOUND respectively"
            - "the opinion-letter call answers 404 before any state-machine check — path existence (priority 5) outranks priority 10"
            - "GET /productions/${prod_id} still returns 200, so the 404s are id-specific, not endpoint-wide"

      - name: wrong_role_and_missing_headers_return_unauthorized_or_unauthenticated
        claim_type: error_reachability
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The auth ladder answers in three distinct ways on the SAME path: absent headers and an undeclared role name both give 401 ERR_UNAUTHENTICATED (priorities 1 and 2), while a declared role that is simply not on the endpoint's roles list gives 403 ERR_UNAUTHORIZED (priority 3) — and all three outrank the 404 that a bogus path id would produce."
        test_recipe:
          setup:
            - "One real production exists. The trigger's first call is issued with NO X-User-Role and NO X-User-ID header; the second with X-User-Role: Producer, a name that is not one of the five declared roles."
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Locked Door", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /archives"
              payload: { name: "Pathe Vault", holder_type: "FILM_ARCHIVE" }
              as: ArchiveResearcher
              captures: { arch_id: $.data.id }
          trigger:
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: ProductionAdmin
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: ProductionAdmin
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: RightsHolderRep
              as_user_id: "${arch_id}"
            - call: "POST /archives/${arch_id}/state"
              payload: { to_status: "SUSPENDED", reason: "Chain of title dispute" }
              as: ArchiveResearcher
          assert:
            - "call 1, issued with both auth headers omitted, returns 401 ERR_UNAUTHENTICATED (priority 1)"
            - "call 2, issued with X-User-Role: Producer (an undeclared role) and a non-empty X-User-ID, returns 401 ERR_UNAUTHENTICATED (priority 2), not 403"
            - "call 3 returns 403 ERR_UNAUTHORIZED — RightsHolderRep is a declared role but is absent from GET /productions/{id}.roles"
            - "call 4 returns 403 ERR_UNAUTHORIZED — POST /archives/{id}/state is ClearanceSupervisor-exclusive; Archive.${arch_id}.status is still ACTIVE afterwards"
            - "a request with headers omitted against a non-existent production id still answers 401, never 404"

      - name: eo_review_gates_cover_role_type_duplicate_and_incomplete_reviews
        claim_type: error_reachability
        grounds:
          - validations[priority=25]
          - validations[priority=24]
          - validations[priority=44]
          - validations[priority=10]
          - state_machines.EOApplication.transitions.IN_REVIEW_to_CLEARED_TO_BIND
        distinguishing_aspect: "Three separate review errors are reachable off one application: recording LEGAL as ClearanceSupervisor is 403 ERR_REVIEW_TYPE_ROLE_MISMATCH, repeating a recorded type is 409 ERR_REVIEW_ALREADY_RECORDED, and asking for BOUND while only one dimension has PASSED is 409 ERR_REVIEWS_INCOMPLETE by the explicit exception in priority 10 — not the generic ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup: ["A production in CLEARANCE with no assets (posture OPEN), one PINNED chart, and one SUBMITTED E&O application with coverage 1000000 / retention 100000."]
          setup_api_calls:
            - call: "POST /productions"
              payload: { title: "Review Ladder", delivery_deadline_date: "2027-06-30" }
              as: ProductionAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /productions/${prod_id}/state"
              payload: { to_status: "CLEARANCE" }
              as: ProductionAdmin
            - call: "GET /productions/${prod_id}"
              payload: {}
              as: ClearanceSupervisor
              captures: { pv: $.data.version }
            - call: "POST /productions/${prod_id}/clearance-charts"
              payload: { chart_label: "v1", expected_production_version: "${pv}" }
              as: ClearanceSupervisor
              captures: { chart_id: $.data.id }
            - call: "POST /productions/${prod_id}/eo-applications"
              payload: { clearance_chart_id: "${chart_id}", coverage_limit_cents: 1000000, retention_cents: 100000 }
              as: ProductionAdmin
              captures: { eo_id: $.data.id }
            - call: "POST /eo-applications/${eo_id}/state"
              payload: { to_status: "SUBMITTED" }
              as: ProductionAdmin
          trigger:
            - call: "POST /eo-applications/${eo_id}/reviews"
              payload: { review_type: "LEGAL", outcome: "PASS", notes: "Clearance chart reviewed." }
              as: ClearanceSupervisor
            - call: "POST /eo-applications/${eo_id}/reviews"
              payload: { review_type: "LEGAL", outcome: "PASS", notes: "Clearance chart reviewed." }
              as: LegalCounsel
              as_user_id: "counsel-a"
            - call: "POST /eo-applications/${eo_id}/state"
              payload: { to_status: "BOUND", policy_number: "EO-2026-778" }
              as: ClearanceSupervisor
            - call: "POST /eo-applications/${eo_id}/reviews"
              payload: { review_type: "LEGAL", outcome: "FAIL", notes: "Second bite." }
              as: LegalCounsel
              as_user_id: "counsel-a"
            - call: "POST /eo-applications/${eo_id}/reviews"
              payload: { review_type: "UNDERWRITING", outcome: "PASS", notes: "Rated and accepted." }
              as: LegalCounsel
              as_user_id: "counsel-a"
            - call: "POST /eo-applications/${eo_id}/reviews"
              payload: { review_type: "UNDERWRITING", outcome: "PASS", notes: "Rated and accepted." }
              as: ClearanceSupervisor
            - call: "POST /eo-applications/${eo_id}/state"
              payload: { to_status: "BOUND", policy_number: "EO-2026-778" }
              as: ClearanceSupervisor
          assert:
            - "EOApplication.${eo_id}.premium_cents == 25000 at submission (base 12500, no rateable rows, credit 30000, floored at MIN_PREMIUM_CENTS)"
            - "call 1 returns 403 ERR_REVIEW_TYPE_ROLE_MISMATCH and leaves status SUBMITTED with legal_review_status PENDING"
            - "call 2 returns 200: status IN_REVIEW, legal_review_status PASSED, underwriting_review_status PENDING"
            - "call 3 returns 409 ERR_REVIEWS_INCOMPLETE — the priority 10 exception routes a BOUND request from IN_REVIEW to the specific error"
            - "call 4 returns 409 ERR_REVIEW_ALREADY_RECORDED and does NOT flip legal_review_status to FAILED or decline the application"
            - "call 5 returns 403 ERR_REVIEW_TYPE_ROLE_MISMATCH — UNDERWRITING is ClearanceSupervisor-only"
            - "call 6 returns 200 and the branch join fires: status CLEARED_TO_BIND with both dimensions PASSED"
            - "call 7 returns 200 with status BOUND and policy_number 'EO-2026-778'"

      - name: posture_gates_report_blocked_and_restricted_distinctly
        claim_type: error_reachability
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - errors.ERR_PRODUCTION_POSTURE_BLOCKED
