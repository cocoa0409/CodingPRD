            - "post-run: WireInstruction.${w3_id}.status == BLOCKED and block_reason == FACILITY_SUSPENDED and decided_by_user_id is null"
            - "d_calls == 0 — A1 already has an open call, so the DWELL_EXCEEDED step issues nothing, and A1's dwell of 3 days is under the 30-day limit anyway"
            - "d_days == 3 and d_fee == 1805000 = round_half_up(1960000000 * 0.0875 / 360 * 3) + round_half_up(18040000000 * 0.0025 / 360 * 3) = 1429167 + 375833"
            - "outstanding_principal_cents is still 1960000000 — a REJECTED advance never posted a ledger entry"
            - "GET /advances/${a3_id}/ledger-entries returns total_count == 0"

