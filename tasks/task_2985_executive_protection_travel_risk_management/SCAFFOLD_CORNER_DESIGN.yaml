          difficulty_instance: priority_pair_validation_conflict / resubmit_over_budget_trip_returns_state_error_not_fiscal_error
          rationale: "That instance violates the state rule at priority 21 and the fiscal rule at priority 49 in one request and asserts the priority-21 code."

