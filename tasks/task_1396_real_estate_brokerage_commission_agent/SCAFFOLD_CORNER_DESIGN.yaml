# =============================================================================
# §1.9 Scaffold Corner Design — task_1396
# Breadth coverage of every §1.1–§1.7 claim not already carried by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Shared fixture constants:
#   plan P1: royalty 6% cap 300000, E&O 6000, txn fee 25000, mentor 10% for
#            first 3 settled deals, tiers [{2500000, 0.30}, {0, 0.0}]
#   plan P2: royalty 6% cap 300000, E&O 7000, txn fee 20000, no mentor,
#            tiers [{2000000, 0.25}, {0, 0.0}]
#   Default clock 2026-08-01T00:00:00Z; agents joined 2025-09-01 have window 0
#   = [2025-09-01, 2026-09-01) which is OPEN at the default clock.
# =============================================================================

scaffold_corner_design:
  # ==================================================================
  - section: entities
    instances:
      - name: agent_create_applies_defaults_and_initial_state
        claim_type: creation_defaults
        grounds: [entities.Agent, state_machines.Agent]
        distinguishing_aspect: "A minimal agent create returns 201 with system defaults: status ONBOARDING, debit_balance_cents 0, settled_deal_count 0, mentor/team fields null, team_override_pct 0, version 1; server-minted id is a bare UUID."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Default Dana", email: "dd@x.com", license_number: "LIC-E1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, st: $.data.status, deb: $.data.debit_balance_cents, cnt: $.data.settled_deal_count, ov: $.data.team_override_pct, ver: $.data.version }
          trigger: []
          assert:
            - "${st} == ONBOARDING and ${deb} == 0 and ${cnt} == 0 and ${ov} == 0 and ${ver} == 1"
            - "mentor_agent_id is null and team_lead_agent_id is null"
            - "created_at has ISO-8601 UTC form with three fractional digits"

      - name: agent_create_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Agent]
        distinguishing_aspect: "Client-supplied id/status/debit_balance_cents in the create body are ignored: the server mints id and forces ONBOARDING/0 regardless."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Sneaky Sam", email: "ss@x.com", license_number: "LIC-E2", joined_at: "2025-09-01", id: "11111111-1111-1111-1111-111111111111", status: "ACTIVE", debit_balance_cents: 999 }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, st: $.data.status, deb: $.data.debit_balance_cents }
          assert:
            - "${ag_id} != '11111111-1111-1111-1111-111111111111'"
            - "${st} == ONBOARDING and ${deb} == 0 (client values ignored)"

      - name: deal_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=6]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent deal id returns 404 with ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /brokerage/deals/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: BrokerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status 404 and ${err} == ERR_NOT_FOUND"

      - name: agent_create_missing_required_license_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required license_number from agent create returns 400 ERR_INVALID_REQUEST before any state or business check runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /brokerage/agents"
              payload: { full_name: "No License", email: "nl@x.com", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status 400 and ${err} == ERR_INVALID_REQUEST"

      - name: deals_list_invalid_enum_status_returns_invalid_request
        claim_type: type_constraints
        grounds: ["validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An invalid enum value in a list query filter (status=BOGUS) is a 400 ERR_INVALID_REQUEST, not an empty list."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /brokerage/deals?status=BOGUS"
              payload: {}
              as: BrokerAdmin
              captures: { err: $.data.error_id }
          assert:
            - "http status 400 and ${err} == ERR_INVALID_REQUEST"

      - name: agents_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, endpoints: "GET /brokerage/agents"]
        distinguishing_aspect: "List responses carry the fixed envelope: limit/offset/total_count/has_more with defaults limit=10 offset=0; page 2 of 2 agents at limit=1 has has_more=false."
        test_recipe:
          setup: ["two agents created"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Page One", email: "p1@x.com", license_number: "LIC-P1", joined_at: "2025-09-01" }
              as: BrokerAdmin
            - call: "POST /brokerage/agents"
              payload: { full_name: "Page Two", email: "p2@x.com", license_number: "LIC-P2", joined_at: "2025-09-01" }
              as: BrokerAdmin
          trigger:
            - call: "GET /brokerage/agents?limit=1&offset=0"
              payload: {}
              as: BrokerAdmin
              captures: { tc: "$.meta" }
            - call: "GET /brokerage/agents?limit=1&offset=1"
              payload: {}
              as: BrokerAdmin
          assert:
            - "page 1: data has 1 row; pagination fields show limit 1, offset 0, total_count 2, has_more true"
            - "page 2: data has 1 row; total_count 2, has_more false"
            - "both responses carry meta.api_request_id and meta.api_request_timestamp and response_type == 'array'"

      - name: deals_list_status_filter_counts
        claim_type: listing
        grounds: [endpoints: "GET /brokerage/deals"]
        distinguishing_aspect: "The status filter partitions: one DRAFT and one PENDING_CLOSING deal yield total_count 1 for each filtered list."
        test_recipe:
          setup: ["agent ACTIVE; deal A left DRAFT; deal B submitted to PENDING_CLOSING"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Filter Fred", email: "ff@x.com", license_number: "LIC-F1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "1 A Ave", gross_commission_cents: 100000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { da: $.data.id }
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "2 B Blvd", gross_commission_cents: 200000, closing_date: "2026-01-16" }
              as: TransactionCoordinator
              captures: { db: $.data.id }
            - call: "POST /brokerage/deals/${db}/submit"
              payload: {}
              as: TransactionCoordinator
          trigger:
            - call: "GET /brokerage/deals?agent_id=${ag_id}&status=DRAFT"
              payload: {}
              as: BrokerAdmin
            - call: "GET /brokerage/deals?agent_id=${ag_id}&status=PENDING_CLOSING"
              payload: {}
              as: BrokerAdmin
          assert:
            - "status=DRAFT list contains exactly deal ${da} (total_count 1)"
            - "status=PENDING_CLOSING list contains exactly deal ${db} (total_count 1)"

      - name: ledger_entry_immutability_shape
        claim_type: immutability
        grounds: [entities.LedgerEntry]
        distinguishing_aspect: "LedgerEntry has common_fields false: the row exposes id and created_at but no version and no updated_at; no update/delete endpoints exist for it."
        test_recipe:
          setup: ["agent with one manual debit adjustment"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Ledger Lou", email: "ll@x.com", license_number: "LIC-LE1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /brokerage/agents/${ag_id}/debit-adjustments"
              payload: { amount_cents: 50000, reason: "advance desk fee" }
              as: BrokerAdmin
              captures: { entry_id: $.data.id }
          trigger:
            - call: "GET /brokerage/ledger-entries/${entry_id}"
              payload: {}
              as: BrokerAdmin
          assert:
            - "response has id and created_at and NO version / updated_at keys"
            - "entry_type == MANUAL_DEBIT, amount_cents == 50000, resulting_balance_cents == 50000"

      - name: deal_create_referral_fk_must_exist
        claim_type: parent_relationships
        grounds: ["validations[priority=14]", "entities.Deal.fields.referral_agent_id"]
        distinguishing_aspect: "Flat-topology FK integrity: referral_agent_id pointing at a nonexistent agent is rejected ERR_NOT_FOUND (404) while a self-referral is ERR_SELF_REFERENCE (422)."
        test_recipe:
          setup: ["agent ACTIVE"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Ref Rachel", email: "rr@x.com", license_number: "LIC-RF1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
          trigger:
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "3 Ghost Ct", gross_commission_cents: 500000, closing_date: "2026-01-15", referral_pct: 0.25, referral_agent_id: "00000000-0000-0000-0000-000000000000" }
              as: TransactionCoordinator
              captures: { err1: $.data.error_id }
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "4 Self St", gross_commission_cents: 500000, closing_date: "2026-01-15", referral_pct: 0.25, referral_agent_id: "${ag_id}" }
              as: TransactionCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "${err1} == ERR_NOT_FOUND (http 404)"
            - "${err2} == ERR_SELF_REFERENCE (http 422)"
            - "no deals persisted for ${ag_id}"

  # ==================================================================
  - section: state_machines
    instances:
      - name: initial_states_across_entities
        claim_type: initial_state
        grounds: [state_machines.Agent, state_machines.CommissionPlan, state_machines.Deal, state_machines.PlanEnrollment, state_machines.TaxForm1099]
        distinguishing_aspect: "Fresh rows start in their declared initial states: Agent ONBOARDING, CommissionPlan DRAFT, Deal DRAFT, future-dated PlanEnrollment SCHEDULED, generated TaxForm1099 DRAFT."
        test_recipe:
          setup: ["agent ACTIVE with an ACTIVE plan available"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Init Irene", email: "ii@x.com", license_number: "LIC-I1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, st_agent: $.data.status, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id, st_plan: $.data.status }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2027-01-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
              captures: { st_enroll: $.data.status }
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "5 Init Ln", gross_commission_cents: 100000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { st_deal: $.data.status }
            - call: "POST /brokerage/agents/${ag_id}/tax-forms"
              payload: { tax_year: 2025 }
              as: BrokerAdmin
              captures: { st_form: $.data.status, gp: $.data.gross_paid_cents, req: $.data.filing_required }
          trigger: []
          assert:
            - "${st_agent} == ONBOARDING, ${st_plan} == DRAFT, ${st_deal} == DRAFT, ${st_enroll} == SCHEDULED (effective 2027-01-01 is after the clock), ${st_form} == DRAFT"
            - "empty-year form: ${gp} == 0 and ${req} == false"

      - name: deal_invalid_transition_battery
        claim_type: invalid_transition
        grounds: ["state_machines.Deal", "errors[ERR_DEAL_INVALID_STATE]", "errors[ERR_DEAL_HAS_SETTLEMENT]"]
        distinguishing_aspect: "Every non-listed trigger from each Deal state is rejected: close/settle/withdraw/fall-through/void from DRAFT; settle/void/submit from PENDING_CLOSING; settle again from SETTLED (ERR_DEAL_HAS_SETTLEMENT); submit from SETTLED."
        test_recipe:
          setup: ["agent ACTIVE on P1; one deal carried DRAFT -> PENDING -> CLOSED -> SETTLED across the battery"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Battery Bill", email: "bb2@x.com", license_number: "LIC-BT1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "6 Battery Way", gross_commission_cents: 1000000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
          trigger:
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
              captures: { e_close_draft: $.data.error_id }
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { e_settle_draft: $.data.error_id }
            - call: "POST /brokerage/deals/${deal_id}/withdraw"
              payload: {}
              as: TransactionCoordinator
              captures: { e_withdraw_draft: $.data.error_id }
            - call: "POST /brokerage/deals/${deal_id}/fall-through"
              payload: {}
              as: TransactionCoordinator
              captures: { e_fall_draft: $.data.error_id }
            - call: "POST /brokerage/deals/${deal_id}/void"
              payload: {}
              as: TransactionCoordinator
              captures: { e_void_draft: $.data.error_id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { e_settle_pending: $.data.error_id }
            - call: "POST /brokerage/deals/${deal_id}/void"
              payload: {}
              as: TransactionCoordinator
              captures: { e_void_pending: $.data.error_id }
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { setl_ok: $.data.status }
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              captures: { e_settle_settled: $.data.error_id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
              captures: { e_submit_settled: $.data.error_id }
            - call: "POST /brokerage/deals/${deal_id}/fall-through"
              payload: {}
              as: TransactionCoordinator
              captures: { e_fall_settled: $.data.error_id }
          assert:
            - "from DRAFT: ${e_close_draft} == ${e_settle_draft} == ${e_withdraw_draft} == ${e_fall_draft} == ${e_void_draft} == ERR_DEAL_INVALID_STATE"
            - "from PENDING_CLOSING: ${e_settle_pending} == ERR_DEAL_INVALID_STATE and ${e_void_pending} == ERR_DEAL_INVALID_STATE"
            - "settle from CLOSED succeeds: ${setl_ok} == POSTED"
            - "second settle: ${e_settle_settled} == ERR_DEAL_HAS_SETTLEMENT (domain-specific, not the generic state error)"
            - "from SETTLED: ${e_submit_settled} == ERR_DEAL_INVALID_STATE and ${e_fall_settled} == ERR_DEAL_INVALID_STATE"

      - name: leg_invalid_transition_battery
        claim_type: invalid_transition
        grounds: ["state_machines.DisbursementLeg", "errors[ERR_LEG_INVALID_STATE]"]
        distinguishing_aspect: "Leg lifecycle rejects: release before authorize, double authorize, void after release, authorize after release — the terminal states RELEASED/VOIDED are locked."
        test_recipe:
          setup: ["settled deal (poster tc-1) with legs; AGENT leg driven through its lifecycle"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Leg Larry", email: "ll2@x.com", license_number: "LIC-LG1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
              captures: { ag_v1: $.data.version }
            - call: "POST /brokerage/plans"
              payload: { name: "P1", royalty_pct: 0.06, royalty_cap_cents: 300000, eo_fee_cents: 6000, transaction_fee_cents: 25000, mentor_split_pct: 0.10, mentor_deal_count: 3, tiers: [ { threshold_company_dollar_cents: 2500000, broker_split_pct: 0.30 }, { threshold_company_dollar_cents: 0, broker_split_pct: 0.0 } ] }
              as: BrokerAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /brokerage/plans/${plan_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/agents/${ag_id}/enrollments"
              payload: { plan_id: "${plan_id}", effective_from: "2025-09-01", expected_agent_version: "${ag_v1}" }
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "7 Leg Ln", gross_commission_cents: 1000000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { deal_id: $.data.id }
            - call: "POST /brokerage/deals/${deal_id}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${deal_id}/settle"
              payload: {}
              as: TransactionCoordinator
              as_user_id: "tc-1"
              captures: { setl_id: $.data.id }
            - call: "GET /brokerage/disbursement-legs?settlement_id=${setl_id}&payee_type=AGENT"
              payload: {}
              as: OfficeManager
              captures: { leg: "$.data[0].id" }
          trigger:
            - call: "POST /brokerage/disbursement-legs/${leg}/release"
              payload: {}
              as: OfficeManager
              as_user_id: "om-2"
              captures: { e_rel_sched: $.data.error_id }
            - call: "POST /brokerage/disbursement-legs/${leg}/authorize"
              payload: {}
              as: OfficeManager
              as_user_id: "om-1"
            - call: "POST /brokerage/disbursement-legs/${leg}/authorize"
              payload: {}
              as: OfficeManager
              as_user_id: "om-2"
              captures: { e_auth_twice: $.data.error_id }
            - call: "POST /brokerage/disbursement-legs/${leg}/release"
              payload: {}
              as: OfficeManager
              as_user_id: "om-2"
              captures: { rel_ok: $.data.status }
            - call: "POST /brokerage/disbursement-legs/${leg}/void"
              payload: {}
              as: OfficeManager
              as_user_id: "om-1"
              captures: { e_void_released: $.data.error_id }
            - call: "POST /brokerage/disbursement-legs/${leg}/authorize"
              payload: {}
              as: OfficeManager
              as_user_id: "om-1"
              captures: { e_auth_released: $.data.error_id }
          assert:
            - "${e_rel_sched} == ERR_LEG_INVALID_STATE (release needs AUTHORIZED)"
            - "${e_auth_twice} == ERR_LEG_INVALID_STATE"
            - "${rel_ok} == RELEASED"
            - "terminal lockdown: ${e_void_released} == ERR_LEG_INVALID_STATE and ${e_auth_released} == ERR_LEG_INVALID_STATE"

      - name: terminal_state_lockdowns
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Deal, state_machines.Agent, state_machines.TaxForm1099]
        distinguishing_aspect: "Terminal states accept no further transitions: FELL_THROUGH deal cannot be submitted; VOIDED deal cannot be settled; TERMINATED agent cannot be activated or re-terminated; VOIDED tax form cannot be finalized."
        test_recipe:
          setup: ["agent with a fell-through deal A, a voided deal B, and a voided tax form; plus a terminated agent"]
          setup_api_calls:
            - call: "POST /brokerage/agents"
              payload: { full_name: "Term Tina", email: "tt@x.com", license_number: "LIC-TE1", joined_at: "2025-09-01" }
              as: BrokerAdmin
              captures: { ag_id: $.data.id, ag_v0: $.data.version }
            - call: "POST /brokerage/agents/${ag_id}/activate"
              payload: {}
              as: BrokerAdmin
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "8 Dead Deal Dr", gross_commission_cents: 100000, closing_date: "2026-01-15" }
              as: TransactionCoordinator
              captures: { da: $.data.id }
            - call: "POST /brokerage/deals/${da}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${da}/fall-through"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals"
              payload: { agent_id: "${ag_id}", address: "9 Voided Way", gross_commission_cents: 100000, closing_date: "2026-01-16" }
              as: TransactionCoordinator
              captures: { db: $.data.id }
            - call: "POST /brokerage/deals/${db}/submit"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${db}/close"
              payload: {}
              as: TransactionCoordinator
            - call: "POST /brokerage/deals/${db}/void"
              payload: {}
              as: TransactionCoordinator
