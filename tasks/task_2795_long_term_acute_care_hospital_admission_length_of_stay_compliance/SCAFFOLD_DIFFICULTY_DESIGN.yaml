# §1.8 Scaffold Difficulty Design - Test Targeting Index for
# task_2795 Long-Term Acute Care Hospital Admission & Length-of-Stay Compliance.
#
# Every instance grounds only in elements declared in SCAFFOLD.yaml §1.1-§1.7.
# Every numeric assert below was executed against the declared formulas and constants.
# Fixture reference data reused across instances (created per instance by its own chain):
#   DRG "207": relative_weight 1.25, alos_days 30, standard_federal_rate 4,800,000c,
#              ipps per-diem 90,000c, ipps full 2,400,000c  ->  full standard 6,000,000c, SSO threshold 25d
#   DRG "573": relative_weight 0.75, alos_days 13, standard_federal_rate 4,800,000c,
#              ipps per-diem 400,000c, ipps full 3,400,000c ->  full standard 3,600,000c, SSO threshold 10d
#   Criteria set "CS-2026A": pmv_min_vent_hours 96, pmv_min_icu_days 3, wound_min_stage 3, wound_min_count 2
#   Cost reporting period: 2026-07-01 .. 2027-06-30 (OPEN); logical clock starts at 2026-08-01T00:00:00Z.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: payment_variant_standard_vs_site_neutral_on_one_determination
        grounds:
          - calculations.stay_payment_determination
          - calculations.high_cost_outlier_payment
          - entities.PaymentDetermination.fields.standard_variant_amount_cents
          - entities.PaymentDetermination.fields.site_neutral_variant_amount_cents
          - entities.PaymentDetermination.fields.payment_variant
        distinguishing_aspect: |
          This instance's two variants are two payment systems priced from the SAME stay row: the
          determination stores standard_variant_amount_cents 8,400,000 and
          site_neutral_variant_amount_cents 7,680,000 simultaneously and selects the standard one
          because the referral records a prior acute discharge and icu_days_at_referral 5 >= 3.
        test_recipe:
          setup:
            - "One OPEN cost reporting period 2026-07-01..2027-06-30 and one ACTIVE criteria set CS-2026A."
            - "DRG 207 loaded; patient Ada Vent referred by Metro General on the PMV track (vent 240h, ICU 5d)."
            - "Stay admitted 2026-07-05, no weaning plan, discharged 2026-08-14 with estimated cost 12,000,000c (covered LOS 40 days, above the 25-day SSO threshold)."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_metro_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-001", full_name: "Ada Vent", birth_date: "1955-03-04", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat1_id: $.data.id, pat1_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat1_id}", referring_hospital_id: "${rh_metro_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat1_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-04T12:00:00Z" }
              as: IntakeCoordinator
              captures: { ref1_id: $.data.id }
            - call: "POST /ltch/referrals/${ref1_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref1_id}/admit"
              payload: { admitted_at: "2026-07-05T00:00:00.000Z" }
              as: IntakeCoordinator
              captures: { stay1_id: $.data.id }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-08-14T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /ltch/stays/${stay1_id}/discharge"
              payload: { discharge_disposition: "SNF", estimated_cost_cents: 12000000 }
              as: UtilizationReviewNurse
            - call: "GET /ltch/stays/${stay1_id}/payment-determinations"
              payload: {}
              as: ComplianceOfficer
              captures: { det1_id: "$.data[0].id" }
          assert:
            - "Stay.${stay1_id}.covered_los_days == 40"
            - "Stay.${stay1_id}.sso_threshold_days == 25"
            - "Stay.${stay1_id}.short_stay_outlier_applied == false"
            - "PaymentDetermination.${det1_id}.payment_variant == STANDARD_LTCH_PPS"
            - "PaymentDetermination.${det1_id}.full_standard_amount_cents == 6000000"
            - "PaymentDetermination.${det1_id}.standard_variant_amount_cents == 8400000"
            - "PaymentDetermination.${det1_id}.site_neutral_variant_amount_cents == 7680000"
            - "PaymentDetermination.${det1_id}.base_payment_cents == 6000000"
            - "PaymentDetermination.${det1_id}.outlier_payment_cents == 2400000"
            - "PaymentDetermination.${det1_id}.total_payment_cents == 8400000"
            - "PaymentDetermination.${det1_id}.discharge_payment_pct == 100.00"
            - "PaymentDetermination.${det1_id}.standard_variant_amount_cents != PaymentDetermination.${det1_id}.site_neutral_variant_amount_cents"

      - name: denial_risk_as_documented_vs_query_adjusted_band_drop
        grounds:
          - calculations.denial_risk_score
          - entities.DenialRiskReview.fields.as_documented_score
          - entities.DenialRiskReview.fields.query_adjusted_score
          - entities.DenialRiskReview.fields.effective_score
          - state_machines.DocumentationQuery.ISSUED_to_ANSWERED
        distinguishing_aspect: |
          A different entity domain than the payment instance: the two variants here are two readings
          of the SAME chart on DenialRiskReview - AS_DOCUMENTED 77 (HIGH) versus QUERY_ADJUSTED 65
          (MODERATE) after exactly one answered query - and the divergence is driven by
          ANSWERED_QUERY_CREDIT, not by a payment system.
        test_recipe:
          setup:
            - "OPEN period, ACTIVE criteria set CS-2026A, DRG 573 loaded, one ACTIVE physician."
            - "Patient Ben Wound admitted 2026-07-06 on the COMPLEX_WOUND track (ICU 1 day, so site-neutral), with NO weaning plan and NO interdisciplinary notes at all."
            - "Discharged 2026-07-14 with estimated cost 1,500,000c: covered LOS 8 days <= the 10-day SSO threshold, so the discharge cascade scores the review at 77 (missing 4 disciplines = 32, no weaning plan = 15, SSO = 20, site-neutral = 10) and auto-issues one documentation query."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_metro_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "573", relative_weight: 0.75, alos_days: 13, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 400000, ipps_comparable_full_cents: 3400000 }
              as: ComplianceOfficer
              captures: { drg573_id: $.data.id }
            - call: "POST /ltch/physicians"
              payload: { npi: "2000000001", full_name: "Dr Ines Reyes", specialty: "WOUND_CARE" }
              as: ComplianceOfficer
              captures: { phys_wound_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-002", full_name: "Ben Wound", birth_date: "1948-11-02", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat2_id: $.data.id, pat2_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat2_id}", referring_hospital_id: "${rh_metro_id}", drg_rate_id: "${drg573_id}", expected_patient_version: "${pat2_v}", vent_hours_at_referral: 240, icu_days_at_referral: 1, wound_stage: 3, wound_count: 2, prior_acute_discharge_at: "2026-07-04T12:00:00Z" }
              as: IntakeCoordinator
              captures: { ref2_id: $.data.id }
            - call: "POST /ltch/referrals/${ref2_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref2_id}/admit"
              payload: { admitted_at: "2026-07-06T00:00:00.000Z" }
              as: IntakeCoordinator
              captures: { stay2_id: $.data.id }
            - call: "POST /ltch/_clock/set_current_utc"
              payload: { current_utc: "2026-07-14T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /ltch/stays/${stay2_id}/discharge"
              payload: { discharge_disposition: "HOME", estimated_cost_cents: 1500000 }
              as: UtilizationReviewNurse
            - call: "GET /ltch/stays/${stay2_id}/denial-risk-reviews"
              payload: {}
              as: ComplianceOfficer
              captures: { rev2_id: "$.data[0].id" }
            - call: "GET /ltch/documentation-queries"
              payload: { stay_id: "${stay2_id}" }
              as: ComplianceOfficer
              captures: { q2_id: "$.data[0].id" }
          trigger:
            - call: "POST /ltch/documentation-queries/${q2_id}/answer"
              payload: { response_text: "Wound staging and weaning rationale documented in the attached progress note." }
              as: AttendingPhysician
              as_user_id: "${phys_wound_id}"
          assert:
            - "DenialRiskReview.${rev2_id}.as_documented_score == 77"
            - "DenialRiskReview.${rev2_id}.query_adjusted_score == 65"
            - "DenialRiskReview.${rev2_id}.effective_score == 65"
            - "DenialRiskReview.${rev2_id}.risk_band == MODERATE"
            - "DenialRiskReview.${rev2_id}.answered_query_count == 1"
            - "DenialRiskReview.${rev2_id}.missing_discipline_count == 4"
            - "DocumentationQuery.${q2_id}.status == ANSWERED"
            - "DocumentationQuery.${q2_id}.answered_by_physician_id == ${phys_wound_id}"

  - rule_id: combinatorial_formula
    instances:
      - name: sso_nested_min_of_three_candidates_selects_ipps_full
        grounds:
          - calculations.stay_payment_determination
          - calculations.covered_los_days
          - entities.DrgRateEntry.fields.ipps_comparable_per_diem_cents
          - entities.DrgRateEntry.fields.ipps_comparable_full_cents
        distinguishing_aspect: |
          Mode (a) nested min/max with a conditional branch: inside the short-stay-outlier branch the
          standard base is min(min(full 6,000,000, LTCH per-diem product 5,000,000), 120%-IPPS-per-diem
          2,700,000, IPPS-full 2,400,000) = 2,400,000, so the THIRD candidate wins and any
          implementation that compares only two of the three lands on 2,700,000 or 5,000,000.
        test_recipe:
          setup:
            - "OPEN period 2026-07-01..2027-06-30, ACTIVE criteria set CS-2026A, DRG 207 loaded."
            - "Patient admitted (backdated) 2026-07-07 on the PMV track with ICU 5 days and a prior acute discharge, so the STANDARD variant is selected."
            - "Logical clock still at its 2026-08-01T00:00:00Z default, so discharging now yields covered LOS 25 days - exactly the SSO threshold floor(5/6 * 30)."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_metro_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "207", relative_weight: 1.25, alos_days: 30, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 90000, ipps_comparable_full_cents: 2400000 }
              as: ComplianceOfficer
              captures: { drg207_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-010", full_name: "Cleo Short", birth_date: "1951-01-09", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat10_id: $.data.id, pat10_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat10_id}", referring_hospital_id: "${rh_metro_id}", drg_rate_id: "${drg207_id}", expected_patient_version: "${pat10_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-04T12:00:00Z" }
              as: IntakeCoordinator
              captures: { ref10_id: $.data.id }
            - call: "POST /ltch/referrals/${ref10_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref10_id}/admit"
              payload: { admitted_at: "2026-07-07T00:00:00.000Z" }
              as: IntakeCoordinator
              captures: { stay10_id: $.data.id }
          trigger:
            - call: "POST /ltch/stays/${stay10_id}/discharge"
              payload: { discharge_disposition: "HOME_HEALTH", estimated_cost_cents: 1000000 }
              as: UtilizationReviewNurse
            - call: "GET /ltch/stays/${stay10_id}/payment-determinations"
              payload: {}
              as: ComplianceOfficer
              captures: { det10_id: "$.data[0].id" }
          assert:
            - "Stay.${stay10_id}.covered_los_days == 25"
            - "Stay.${stay10_id}.short_stay_outlier_applied == true"
            - "PaymentDetermination.${det10_id}.payment_variant == STANDARD_LTCH_PPS"
            - "PaymentDetermination.${det10_id}.base_payment_cents == 2400000"
            - "PaymentDetermination.${det10_id}.outlier_payment_cents == 0"
            - "PaymentDetermination.${det10_id}.total_payment_cents == 2400000"
            - "PaymentDetermination.${det10_id}.discharge_payment_pct == 40.00"
            - "PaymentDetermination.${det10_id}.standard_variant_amount_cents == 2400000"
            - "PaymentDetermination.${det10_id}.site_neutral_variant_amount_cents == 1000000"

      - name: period_rollup_rounds_per_determination_then_sums
        grounds:
          - calculations.period_payment_rollup
          - calculations.stay_payment_determination
          - entities.CostReportingPeriod.fields.total_payment_cents
          - entities.CostReportingPeriod.fields.final_determination_count
          - state_machines.PaymentDetermination.DRAFT_to_FINAL
        distinguishing_aspect: |
          Mode (b) pinned rounding order: DRG 573's per-diem products 1,384,615.3846 and
          1,661,538.4615 are each rounded to whole cents FIRST, so the period total is exactly
          3,046,153; summing the unrounded products and rounding once yields 3,046,154, which this
          instance asserts is wrong.
        test_recipe:
          setup:
            - "OPEN period 2026-07-01..2027-06-30, ACTIVE criteria set CS-2026A, DRG 573 loaded."
            - "Two PMV-track patients admitted (backdated) 2026-07-27 and 2026-07-26, both with estimated cost 500,000c so no high-cost outlier applies."
            - "Clock left at its 2026-08-01T00:00:00Z default, giving covered LOS 5 and 6 days - both inside DRG 573's 10-day SSO threshold."
            - "Each stay scores MODERATE denial risk (67), so no query is auto-issued; each review is cleared and each determination finalized by an analyst other than SYSTEM."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
              captures: { rh_metro_id: $.data.id }
            - call: "POST /ltch/admission-criteria-sets"
              payload: { label: "CS-2026A", effective_from: "2026-01-01", pmv_min_vent_hours: 96, pmv_min_icu_days: 3, wound_min_stage: 3, wound_min_count: 2 }
              as: ComplianceOfficer
              captures: { cs_a_id: $.data.id }
            - call: "POST /ltch/drg-rates"
              payload: { drg_code: "573", relative_weight: 0.75, alos_days: 13, standard_federal_rate_cents: 4800000, ipps_comparable_per_diem_cents: 400000, ipps_comparable_full_cents: 3400000 }
              as: ComplianceOfficer
              captures: { drg573_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-021", full_name: "Dara Five", birth_date: "1960-02-02", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat21_id: $.data.id, pat21_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat21_id}", referring_hospital_id: "${rh_metro_id}", drg_rate_id: "${drg573_id}", expected_patient_version: "${pat21_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-04T12:00:00Z" }
              as: IntakeCoordinator
              captures: { ref21_id: $.data.id }
            - call: "POST /ltch/referrals/${ref21_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref21_id}/admit"
              payload: { admitted_at: "2026-07-27T00:00:00.000Z" }
              as: IntakeCoordinator
              captures: { stay21_id: $.data.id }
            - call: "POST /ltch/patients"
              payload: { mrn: "MRN-022", full_name: "Emil Six", birth_date: "1962-04-04", primary_payer: "MEDICARE_FFS" }
              as: IntakeCoordinator
              captures: { pat22_id: $.data.id, pat22_v: $.data.version }
            - call: "POST /ltch/referrals"
              payload: { patient_id: "${pat22_id}", referring_hospital_id: "${rh_metro_id}", drg_rate_id: "${drg573_id}", expected_patient_version: "${pat22_v}", vent_hours_at_referral: 240, icu_days_at_referral: 5, wound_stage: 1, wound_count: 0, prior_acute_discharge_at: "2026-07-04T12:00:00Z" }
              as: IntakeCoordinator
              captures: { ref22_id: $.data.id }
            - call: "POST /ltch/referrals/${ref22_id}/screen"
              payload: {}
              as: IntakeCoordinator
            - call: "POST /ltch/referrals/${ref22_id}/admit"
              payload: { admitted_at: "2026-07-26T00:00:00.000Z" }
              as: IntakeCoordinator
              captures: { stay22_id: $.data.id }
            - call: "POST /ltch/stays/${stay21_id}/discharge"
              payload: { discharge_disposition: "HOME", estimated_cost_cents: 500000 }
              as: UtilizationReviewNurse
            - call: "POST /ltch/stays/${stay22_id}/discharge"
              payload: { discharge_disposition: "HOME", estimated_cost_cents: 500000 }
              as: UtilizationReviewNurse
            - call: "GET /ltch/stays/${stay21_id}/payment-determinations"
              payload: {}
              as: ComplianceOfficer
              captures: { det21_id: "$.data[0].id" }
            - call: "GET /ltch/stays/${stay22_id}/payment-determinations"
              payload: {}
              as: ComplianceOfficer
              captures: { det22_id: "$.data[0].id" }
            - call: "GET /ltch/stays/${stay21_id}/denial-risk-reviews"
              payload: {}
              as: ComplianceOfficer
              captures: { rev21_id: "$.data[0].id" }
            - call: "GET /ltch/stays/${stay22_id}/denial-risk-reviews"
              payload: {}
              as: ComplianceOfficer
              captures: { rev22_id: "$.data[0].id" }
            - call: "POST /ltch/denial-risk-reviews/${rev21_id}/resolve"
              payload: { outcome: "CLEARED", resolution_note: "Short stay, documentation adequate." }
              as: ComplianceOfficer
            - call: "POST /ltch/denial-risk-reviews/${rev22_id}/resolve"
              payload: { outcome: "CLEARED", resolution_note: "Short stay, documentation adequate." }
              as: ComplianceOfficer
          trigger:
            - call: "POST /ltch/payment-determinations/${det21_id}/finalize"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst-b"
            - call: "POST /ltch/payment-determinations/${det22_id}/finalize"
              payload: {}
              as: RevenueIntegrityAnalyst
              as_user_id: "analyst-b"
          assert:
            - "PaymentDetermination.${det21_id}.total_payment_cents == 1384615"
            - "PaymentDetermination.${det22_id}.total_payment_cents == 1661538"
            - "PaymentDetermination.${det21_id}.discharge_payment_pct == 38.46"
            - "PaymentDetermination.${det22_id}.discharge_payment_pct == 46.15"
            - "CostReportingPeriod.${period_id}.total_payment_cents == 3046153"
            - "CostReportingPeriod.${period_id}.total_payment_cents != 3046154"
            - "CostReportingPeriod.${period_id}.final_determination_count == 2"

      - name: high_cost_outlier_threshold_excludes_its_own_add_on
        grounds:
          - calculations.high_cost_outlier_payment
          - calculations.stay_payment_determination
          - entities.PaymentDetermination.fields.outlier_payment_cents
          - entities.Stay.fields.estimated_cost_cents
        distinguishing_aspect: |
          Mode (c) pinned evaluation order: the fixed-loss threshold is base + 3,000,000 evaluated
          BEFORE the add-on exists, so the outlier is 0.80 * (12,000,000 - 9,000,000) = 2,400,000; the
          circular reading that lets the add-on re-enter its own threshold converges to 1,333,333,
          which this instance asserts is wrong.
        test_recipe:
          setup:
            - "OPEN period 2026-07-01..2027-06-30, ACTIVE criteria set CS-2026A, DRG 207 loaded."
            - "PMV-track patient admitted (backdated) 2026-07-05, no weaning plan, clock advanced to 2026-08-14 so covered LOS is 40 days (no SSO reduction)."
            - "Estimated cost 12,000,000c - far above both variants' fixed-loss thresholds, so BOTH variant amounts carry an outlier add-on."
          setup_api_calls:
            - call: "POST /ltch/cost-reporting-periods"
              payload: { period_label: "FY2027", start_date: "2026-07-01", end_date: "2027-06-30" }
              as: ComplianceOfficer
              captures: { period_id: $.data.id }
            - call: "POST /ltch/referring-hospitals"
              payload: { name: "Metro General", npi: "1000000001", hospital_type: "ACUTE_CARE", is_colocated: false }
              as: ComplianceOfficer
