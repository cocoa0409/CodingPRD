            - "${posture_1} == PARTIAL — the preserved TELEMATICS_SNAPSHOT window ENDS exactly at occurred_at, and the bracket test is half-open (window_start <= occurred_at < window_end), so it satisfies nothing"
            - "${ev_bracket} is created with HTTP 201 despite being the same kind on the same crash — the two windows merely touch at 2026-07-31T12:00:00Z, and touching windows are explicitly allowed by priority 42"
            - "${posture_2} == PARTIAL still — TELEMATICS_SNAPSHOT is now satisfied but FORWARD_CAMERA is not, and a MODERATE crash requires both"
            - "${posture_3} == COMPLETE once the bracketing FORWARD_CAMERA is preserved"
