            - call: "GET /audit-events"
              payload: { subject_type: "LicenseRegistration", subject_ref: "${lic_id}" }
              as: ExaminationCoordinator
              as_user_id: "exam-1"
              captures: { ev_type: "$.data[0].event_type", ev_role: "$.data[0].actor_role", ev_seq: "$.data[0].sequence_no", ev_total: $.total_count }
