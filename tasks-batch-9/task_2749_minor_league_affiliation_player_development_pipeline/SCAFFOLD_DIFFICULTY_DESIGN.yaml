              captures: { st6b: $.data.status }
            - call: "POST /facility-reviews/${rev6}/disposition"
              payload: { action: "REOPEN" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { st6c: $.data.status, rc6: $.data.reopen_count, due6b: $.data.remediation_due_date }
            - call: "POST /facility-reviews/${rev6}/disposition"
              payload: { action: "SUBMIT_REMEDIATION", note: "flooring replaced on re-inspection" }
              as: AffiliateOperator
              as_user_id: "${aff6_id}"
              captures: { st6d: $.data.status }
          assert:
            - "On creation FacilityStandardReview.${rev6}.deficiency_level == MINOR, status == OPEN and remediation_due_date == 2026-05-31"
            - "The status sequence is OPEN -> REMEDIATION_SUBMITTED -> CLOSED -> REOPENED -> REMEDIATION_SUBMITTED, so REMEDIATION_SUBMITTED is entered twice"
            - "FacilityStandardReview.${rev6}.reopen_count == 0 before the REOPEN and == 1 after it"
            - "FacilityStandardReview.${rev6}.remediation_due_date == 2026-04-16 after the REOPEN (logical clock date 2026-04-01 + REMEDIATION_REOPEN_DAYS 15), not the original 2026-05-31"
            - "FacilityStandardReview.${rev6}.is_overdue == false at every step because the clock stays at 2026-04-01"
            - "Affiliate.${aff6_id}.facility_status == PROVISIONAL and AffiliationAgreement.${agr6_id}.posture == OPEN throughout (a MINOR deficiency never freezes posture)"
            - "FacilityStandardReview.${rev6}.remediation_note == 'flooring replaced on re-inspection' (the second submission overwrites the first)"

  # ==========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: clearance_revocation_cascades_to_assignment_plan_roster_and_posture
        grounds:
          - state_machines.MedicalClearance.ISSUED_to_REVOKED
          - state_machines.PlayerAssignment.ACTIVE_to_SUSPENDED
          - state_machines.Player.medical_status
          - state_machines.Player.roster_status
          - calculations.facility_posture_evaluation
          - calculations.roster_capacity_and_reserve
        distinguishing_aspect: |
          This instance's cascade ORIGINATES OUTSIDE the assignment aggregate:
          one clearance REVOKE propagates five levels (clearance -> player
          medical_status -> assignment -> player roster_status and affiliate
          counters -> agreement posture), and the option-year ledger is the
          explicit non-participant that must stay CHARGED.
