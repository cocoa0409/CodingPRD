            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/terms/${term_id}/advance"
              payload: { to_state: "ENROLLMENT_OPEN" }
              as: RegistrarAdmin
            - call: "POST /api/staff"
              payload: { full_name: "Ivy Incentive", email: "ivy@x.com", staff_type: "COUNSELOR", caseload_cap: 5, compensation_plan: "INCENTIVE" }
              as: SystemAdmin
            - call: "POST /api/staff"
              payload: { full_name: "Ann Advisor", email: "adv@x.com", staff_type: "ADVISOR", caseload_cap: 5 }
              as: SystemAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /api/applicants"
              payload: { full_name: "Pat Prospect", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap_id: "$.data.id" }
            - call: "POST /api/applications"
              payload: { applicant_id: "${ap_id}", term_id: "${term_id}", program_id: "${prog_id}" }
              as: Applicant
              as_user_id: "${ap_id}"
              captures: { appl_id: "$.data.id" }
            - call: "POST /api/applications/${appl_id}/decision"
              payload: { decision: "ADMIT" }
              as: RegistrarAdmin
              captures: { appl_v: "$.data.version" }
            - call: "POST /api/applications/${appl_id}/transfer-credit-evaluations"
              payload: { accepted_credits: 10, in_progress_credits: 0 }
              as: RegistrarAdmin
              captures: { tce_id: "$.data.id" }
            - call: "POST /api/transfer-credit-evaluations/${tce_id}/advance"
              payload: { to_state: "IN_REVIEW" }
              as: RegistrarAdmin
          trigger:
            - call: "POST /api/enrollments"
              payload: { application_id: "${appl_id}", advisor_id: "${adv_id}", enrollment_intensity: "FULL_TIME", tuition_cents: 500000, expected_application_version: "${appl_v}" }
              as: RegistrarAdmin
              captures: { err: "$.data.error_id" }
          assert:
            - "POST /api/enrollments returns ERR_INCENTIVE_COMP_VIOLATION (422), not ERR_EVALUATION_INCOMPLETE"
            - "no Enrollment created; Application remains ADMITTED"

  # ------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: contact_cadence_third_allowed_fourth_rejected_window_edge
        grounds:
          - calculations.contact_cadence
          - validations[priority=15]
          - errors[ERR_CONTACT_CADENCE_EXCEEDED]
        distinguishing_aspect: |
          Time-window membership boundary: the 3rd contact inside (now-168h, now]
          succeeds and the 4th fails ERR_CONTACT_CADENCE_EXCEEDED; after the
          clock advances exactly 168h the oldest attempt falls OUT of the
          half-open window (>= boundary excluded), so a 4th attempt succeeds.
        test_recipe:
          setup:
            - "Counselor C (cap 5) auto-assigned to applicant A; clock T0 2026-09-05T12:00:00Z"
          setup_api_calls:
            - call: "POST /api/staff"
              payload: { full_name: "Cal Counselor", email: "c@x.com", staff_type: "COUNSELOR", caseload_cap: 5, compensation_plan: "NON_INCENTIVE" }
              as: SystemAdmin
            - call: "POST /api/applicants"
              payload: { full_name: "Pat Prospect", email: "p@x.com", state_code: "CO" }
              as: RegistrarAdmin
              captures: { ap_id: "$.data.id", cns_id: "$.data.assigned_counselor_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T12:00:00Z" }
              as: SystemAdmin
            - call: "POST /api/applicants/${ap_id}/contact-attempts"
              payload: { channel: "PHONE", outcome: "NO_ANSWER" }
              as: Counselor
              as_user_id: "${cns_id}"
