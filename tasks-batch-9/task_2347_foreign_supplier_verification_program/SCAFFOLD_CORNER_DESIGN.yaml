  # ===========================================================================
  # 2. From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: qi_designation_moves_proposed_to_active_and_flips_program_status
        claim_type: valid_transition
        grounds:
          - state_machines.QualifiedIndividual.transitions[PROPOSED→ACTIVE]
          - endpoints["POST /fsvp/qualified-individuals/{id}/designation"]
          - calculations.importer_program_status
        distinguishing_aspect: "DESIGNATE on a PROPOSED QI whose training_valid_until (2028-06-01) is still ahead of the clock moves it to ACTIVE and, in the same response cycle, flips the importer from NON_COMPLIANT to COMPLIANT — the QI clause is the only NON_COMPLIANT clause that holds for an importer with zero pairs."
        test_recipe:
          setup:
            - "Importer with a single PROPOSED qualified individual; no suppliers, foods or pairs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Ada Ruiz", email: "ada@northbrook.example", qualification_summary: "PCQI and FSVP training plus eight years of supplier audit experience", training_completed_at: "2025-06-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_a: $.data.id }
          trigger:
            - call: "POST /fsvp/qualified-individuals/${qi_a}/designation"
              payload: { action: "DESIGNATE", note: "Designated as the FSVP qualified individual of record" }
              as: ComplianceOfficer
          assert:
            - "HTTP 200"
            - "QualifiedIndividual.${qi_a}.status == ACTIVE"
            - "QualifiedIndividual.${qi_a}.training_valid_until == 2028-06-01T00:00:00.000Z"
            - "Importer.${imp}.qualified_individual_designated == true"
            - "Importer.${imp}.program_status == COMPLIANT"

      - name: qi_designation_with_expired_training_returns_designation_invalid
        claim_type: precondition_enforcement
        grounds:
          - state_machines.QualifiedIndividual.transitions[PROPOSED→ACTIVE].preconditions
          - validations[priority=26]
          - errors[ERR_QI_DESIGNATION_INVALID]
        distinguishing_aspect: "training_completed_at 2022-01-01 is a valid past datetime (priority 3 passes), but training_valid_until 2025-01-01 < clock 2026-09-01, so the PROPOSED→ACTIVE precondition fails with 422 and the importer stays NON_COMPLIANT."
        test_recipe:
          setup:
            - "Importer with one PROPOSED QI whose 36-month training window already closed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fsvp/importers"
              payload: { legal_name: "Northbrook Foods Import LLC", dnb_number: "123456789", unique_facility_identifier: "UFI-NB-0001" }
              as: ComplianceOfficer
              captures: { imp: $.data.id }
            - call: "POST /fsvp/qualified-individuals"
              payload: { importer_id: "${imp}", full_name: "Cal Devereux", email: "cal@northbrook.example", qualification_summary: "Historic PCQI certificate with no refresher training since 2022", training_completed_at: "2022-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { qi_c: $.data.id }
          trigger:
            - call: "POST /fsvp/qualified-individuals/${qi_c}/designation"
              payload: { action: "DESIGNATE" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422"
            - "error_id == ERR_QI_DESIGNATION_INVALID"
            - "QualifiedIndividual.${qi_c}.status == PROPOSED"
            - "QualifiedIndividual.${qi_c}.training_valid_until == 2025-01-01T00:00:00.000Z"
            - "Importer.${imp}.qualified_individual_designated == false"
            - "Importer.${imp}.program_status == NON_COMPLIANT"

      - name: supplier_evaluation_approve_records_status_and_last_evaluated_at
        claim_type: side_effect_execution
        grounds:
          - state_machines.ForeignSupplier.transitions[UNEVALUATED→APPROVED].side_effects
          - endpoints["POST /fsvp/foreign-suppliers/{id}/evaluation"]
          - entities.ForeignSupplier.fields.last_evaluated_at
        distinguishing_aspect: "Every declared side effect of the evaluation must land in one request: status APPROVED, last_evaluated_at stamped from the logical clock (not wall time), both performance variants at 100.00 on a zero sample weight, and supplier.version bumped 1 → 2."
        test_recipe:
          setup:
            - "Importer with ACTIVE QI Ada and one UNEVALUATED supplier whose compliance status is NO_ADVERSE_FINDINGS."
          setup_api_calls:
