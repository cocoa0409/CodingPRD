          (on estoppel receive) -> VERIFIED (on estoppel DEFICIENT) -> re-request
          -> ESTOPPEL_PENDING -> ESTOPPELED. The loop allows multiple negotiation
          rounds before terminal ESTOPPELED. Different entity than the Deal/PSA
          machine.
