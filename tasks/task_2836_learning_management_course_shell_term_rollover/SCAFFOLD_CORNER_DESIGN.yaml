            - call: "GET /people/${prof9}"
              payload: {}
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { charge_after: $.data.sandbox_storage_charge_usd }
            - call: "GET /course-shells/${sd2}"
              payload: {}
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { sd2_end: $.data.provisioning_state, sd2_storage_end: $.data.storage_mb }
          assert:
            - "setup literals: ${t9_access_end} == \"2026-12-11T23:59:59Z\", ${t9_purge} == \"2027-12-11T23:59:59Z\", ${t9_open} == REGISTRATION_OPEN, ${charge_0} == 0.00, ${sd1_state} == ${sd2_state} == PROVISIONED with ${sd1_expires} == \"2027-02-09T00:00:00Z\" (term_end_at + 60 days)"
            - "${t9_closed} == CLOSED, then ${sd1_arch} == ${sd2_arch} == ARCHIVED with ${sd1_storage_arch} == 300.00 — archival preserves storage, only PURGE zeroes it"
            - "${charge_before} == 4.20 and the default SANDBOX listing returns total_count 2 with ${list_before_first} == \"SD-SBX-001\" (created_at ASC)"
            - "${sd1_purged} == PURGED with ${sd1_storage} == 0.00, ${sd1_items} == 0 and ${sd1_points} == 0.00 — the counters are zeroed in the very response that performs the transition"
            - "the same default listing now returns total_count 1 with ${list_after_first} == \"SD-SBX-002\" — the PURGED shell is filtered out even though no state filter was supplied"
            - "adding provisioning_state=PURGED returns total_count 1 with ${purged_first} == \"SD-SBX-001\" and ${purged_first_state} == PURGED — the row is retrievable only when it is asked for by name"
            - "${sd1_by_id} == PURGED at HTTP 200 with ${sd1_by_id_storage} == 0.00 and ${sd1_by_id_code} == \"SD-SBX-001\" — GET by id is NOT filtered, so this is a soft delete and never a 404"
            - "the child rows survive: GET /content-items?shell_id=${sd1} returns total_count 1 with ${item_first_copy} == SKIPPED and ${item_first_mb} == 0.00, and ${item_title} == \"Lecture capture archive\" with ${item_mb} == 0.00 and ${item_copy} == SKIPPED"
            - "${charge_after} == 1.20 — the purged shell left billable_shells entirely (3.00 dropped out), while ${sd2_end} == ARCHIVED with ${sd2_storage_end} == 180.00 keeps contributing its 1.20"

      - name: a_single_write_fans_out_across_four_entities_in_declared_order
        claim_type: cascading_side_effects
        grounds:
          - state_machines[ToolIntegration.approval_state]
          - state_machines[ToolPlacement.placement_state]
          - state_machines[CourseShell.provisioning_state]
          - entities[AcademicTerm].published_shell_count
        distinguishing_aspect: "One SUSPEND on a tool must travel tool -> placements -> shells -> term in that order, decrementing published_shell_count and setting unpublish_reason on shells the caller never named."
        excluded_because:
          difficulty_instance: tool_suspension_cascades_four_hops_from_placement_to_term_published_count
          rationale: "§1.8's transitive_cascade rule already walks the full four-hop fan-out with per-hop literals, including the tool's rescored risk_score and the term's published_shell_count; repeating it here would add no discriminating power."
        note: "The other declared cascades are covered by §1.9 state_machines (closing_the_term_cascades_three_hops_across_shells_in_created_at_order, concluding_a_published_shell_completes_its_active_rows_and_updates_both_parents) and §1.9 endpoints (applying_a_sync_batch_is_all_or_nothing_and_processes_operations_in_array_order)."

      - name: the_same_stored_row_yields_two_different_numbers_under_the_two_variants
        claim_type: dual_variant_calculation
        grounds:
          - calculations[final_grade_percentage]
          - calculations[rollover_due_date_projection]
          - entities[Enrollment].provisional_grade_pct
          - entities[Enrollment].final_grade_pct
        distinguishing_aspect: "Both variant pairs must diverge on identical stored data, and the selector is the CONTEXT (gradebook read versus passback submit; rollover date shift mode) rather than any stored discriminator field."
        excluded_because:
          difficulty_instance: final_grade_percentage_variant_divergence_on_enrollment_gradebook
          rationale: "§1.8's dual_variant_calc rule holds both instances — final_grade_percentage_variant_divergence_on_enrollment_gradebook and rollover_due_date_projection_variant_divergence_on_content_item_calendar — each pinning the two variants against one another on the same row, which is exactly what this layer requires."

  # ===========================================================================
  # 9. Consistency model  (§1.0 consistency_model: immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_write_is_visible_to_the_next_read_with_no_settling_delay
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations[waitlist_promotion_capacity]
          - calculations[enrollment_seat_ledger]
          - entities[CourseShell].active_enrollment_count
          - entities[AcademicTerm].total_active_enrollments
          - response_envelope.success
        distinguishing_aspect: "The declared consistency model is immediate, so there is no 202, no job id, no polling and no read-repair anywhere in this API: every derived field on every ancestor is final in the write's own response, and the very next read agrees to the cent and to the head. The instance interleaves write, ancestor read, and filtered list read so that a deferred recomputation (a nightly rollup, a cached counter, a lazily rebuilt gradebook) shows up as a mismatch between two adjacent calls."
        test_recipe:
          setup:
            - "Term IMM-2027-SP at REGISTRATION_OPEN, one professor, two students, and one OFFICIAL shell at PROVISIONED with base_seat_cap 10 under NORMAL posture (so effective_seat_cap is 10 + floor(10 * 0.00) = 10)."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "IMM-2027-SP", term_start_at: "2027-01-11T00:00:00Z", term_end_at: "2027-05-14T00:00:00Z" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { t10: $.data.id, t10_heads_0: $.data.total_active_enrollments }
            - call: "POST /academic-terms/${t10}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { t10_open: $.data.lifecycle_state }
            - call: "POST /people"
              payload: { sis_person_id: "IMM-F-01", full_name: "Katherine Johnson", primary_affiliation: "FACULTY" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { prof10: $.data.id }
            - call: "POST /people"
              payload: { sis_person_id: "IMM-S-01", full_name: "Ravi Menon", primary_affiliation: "STUDENT" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { stu10a: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${t10}", owner_person_id: "${prof10}", sis_section_code: "IMM-120-001", shell_type: "OFFICIAL", base_seat_cap: 10 }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { sh10: $.data.id }
            - call: "POST /course-shells/${sh10}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { sh10_state: $.data.provisioning_state, sh10_cap: $.data.effective_seat_cap, sh10_active_0: $.data.active_enrollment_count }
          trigger:
            - call: "POST /enrollments"
              payload: { shell_id: "${sh10}", person_id: "${stu10a}", role: "STUDENT" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { e10: $.data.id, e10_state: $.data.enrollment_state }
            - call: "GET /course-shells/${sh10}"
              payload: {}
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { sh10_active_1: $.data.active_enrollment_count, sh10_util_1: $.data.seat_utilization_pct, sh10_over_1: $.data.overflow_flag }
            - call: "GET /academic-terms/${t10}"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { t10_heads_1: $.data.total_active_enrollments }
            - call: "POST /content-items"
              payload: { shell_id: "${sh10}", item_type: "ASSIGNMENT", title: "Trajectory worksheet", points_possible: 25.00, storage_mb: 3.00 }
              as: Instructor
              as_user_id: "${prof10}"
              captures: { ci10: $.data.id }
            - call: "GET /course-shells/${sh10}"
              payload: {}
              as: Instructor
              as_user_id: "${prof10}"
              captures: { sh10_items: $.data.content_item_count, sh10_points: $.data.total_points_possible, sh10_storage: $.data.storage_mb }
            - call: "POST /_grade-records"
              payload: { enrollment_id: "${e10}", content_item_id: "${ci10}", earned_points: 20.00 }
              as: Instructor
              as_user_id: "${prof10}"
              captures: { e10_earned_w: $.data.earned_points_total, e10_possible_w: $.data.graded_points_possible, e10_prov_w: $.data.provisional_grade_pct }
            - call: "GET /enrollments/${e10}"
              payload: {}
              as: Instructor
              as_user_id: "${prof10}"
              captures: { e10_earned_r: $.data.earned_points_total, e10_possible_r: $.data.graded_points_possible, e10_prov_r: $.data.provisional_grade_pct }
            - call: "POST /enrollments/${e10}/transitions"
              payload: { action: "DROP", reason: "schedule conflict" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { e10_dropped: $.data.enrollment_state }
            - call: "GET /course-shells/${sh10}"
              payload: {}
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { sh10_active_2: $.data.active_enrollment_count, sh10_util_2: $.data.seat_utilization_pct }
            - call: "GET /academic-terms/${t10}"
              payload: {}
              as: Registrar
              as_user_id: "reg-1"
              captures: { t10_heads_2: $.data.total_active_enrollments }
            - call: "GET /enrollments"
              payload: { shell_id: "${sh10}", enrollment_state: "DROPPED" }
              as: Instructor
              as_user_id: "${prof10}"
              captures: { dropped_first: "$.data[0].enrollment_state" }
          assert:
            - "setup literals: ${t10_heads_0} == 0, ${t10_open} == REGISTRATION_OPEN, ${sh10_state} == PROVISIONED, ${sh10_cap} == 10 and ${sh10_active_0} == 0"
            - "${e10_state} == ACTIVE, and the IMMEDIATELY following ancestor reads already agree: ${sh10_active_1} == 1 with ${sh10_util_1} == 10.00 (1 / 10 * 100) and ${sh10_over_1} == false, and ${t10_heads_1} == 1"
            - "the content-item create is visible on its parent in the next call: ${sh10_items} == 1, ${sh10_points} == 25.00 and ${sh10_storage} == 3.00 — no rollup job stands between the two requests"
            - "the grade record's own response is already final: ${e10_earned_w} == 20.00, ${e10_possible_w} == 25.00, ${e10_prov_w} == 80.00 (20.00 / 25.00 * 100)"
            - "read-your-writes holds exactly: ${e10_earned_r} == ${e10_earned_w}, ${e10_possible_r} == ${e10_possible_w} and ${e10_prov_r} == ${e10_prov_w} == 80.00 — the read recomputes or reads through to the same numbers"
            - "${e10_dropped} == DROPPED and both ancestors settle in the same instant: ${sh10_active_2} == 0 with ${sh10_util_2} == 0.00, and ${t10_heads_2} == 0 — the seat ledger invariant holds after every single request, not eventually"
            - "filtered list reads see the write too: GET /enrollments?shell_id=&enrollment_state=DROPPED returns total_count 1 with ${dropped_first} == DROPPED, while the same read with enrollment_state=ACTIVE returns total_count 0 and has_more false"
            - "no endpoint in §1.5 returns 202 and no response carries a job/polling token: every write in this walk answers 200 or 201 with the final entity state in data"
