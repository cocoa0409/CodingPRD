              as_user_id: "auditor_alice"
              captures: { p2_first: "$.data[0].id" }
            - call: "POST /inspection-reports/${r2_id}/validate"
              payload: {}
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r2_status: $.data.status }
            - call: "GET /inspection-reports?status=RECEIVED&limit=2&offset=0"
              payload: {}
              as: FmcsaProgramAuditor
              as_user_id: "auditor_alice"
              captures: { p3_first: "$.data[0].id" }
