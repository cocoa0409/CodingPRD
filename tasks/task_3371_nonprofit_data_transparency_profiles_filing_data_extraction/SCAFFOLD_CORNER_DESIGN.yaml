            - call: "POST /nonprofits/organizations/${lc_id}/leadership-members"
              payload: { full_name: "Vera Nyberg", office_title: "Board Chair", service_start: "2024-01-01T00:00:00Z", is_officer: true, is_independent: true, disclosure_level: "PUBLIC" }
              as: OrganizationUser
              as_user_id: "${lc_id}"
