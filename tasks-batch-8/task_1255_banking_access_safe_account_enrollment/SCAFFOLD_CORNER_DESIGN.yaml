  - section: calculations
    instances:
      - name: education_stipend_pinned_evaluation_order
        claim_type: correct_result
        grounds: [calculations.claim_computation]
        distinguishing_aspect: "Mode (c) pinned order: with an education-required standard and 1/1 completed pairings, stipend = round(0.10 x (4963 + 0)) = 496 computed on the PRE-STIPEND subtotal; claim total = 5459."
