# =============================================================================
# Task 0993 — Subscription-Box Fulfillment & Kitting Service
# Scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  generate task hard than expert level! 993. Subscription-Box Fulfillment &
  Kitting Service: client & box plan, component/inventory & kit BOM, monthly
  assembly & run, subscriber list import & churn, shipping wave & label,
  returns/replacement, per-box billing, reporting

domain_name: subscription-box-fulfillment
api_prefix: /

complexity_profile:
  primary_archetype: quota_allocation        # finite component inventory reserved/committed/released across kitting runs
  secondary_archetype: ledger_reconciliation # per-box billing: provisional vs final statement variants
  complexity_layers:
    - optimistic_concurrency                 # OCC on BoxPlan.version (revision supersede) and Component.version (receipts)
    - cascading_side_effects                 # run lock → events → component posture; return resolve → shipment → events → component
    - dual_variant_calculation               # statement provisional vs final; availability instantaneous vs forward-looking
    - derived_field_reconciliation           # statement amounts recomputed on close / void-label / wave-cancel / refund events
  entity_topology: graph                     # flat collections; many-to-many BOM junction; cross-aggregate references
  state_machine_shape: cyclic                # dominant non-linear shapes: rework cycle, dispute cycle, label void/rebuy cycle, parallel dims
  relationship_patterns:
    - many_to_many                           # KitBOMLine joins KitRevision x Component
    - self_referential                       # KitRevision.supersedes_revision_id
    - cross_aggregate                        # Shipment -> Run/Wave/Subscriber; ReturnCase -> Shipment; BillingStatement -> Client
  role_model: peer_roles                     # ClientOps / WarehouseOps / BillingAdmin / CustomerService own distinct resources; PlatformAdmin override
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Brand client display name" }
      - { name: billing_email, type: string, source: input, description: "Invoice recipient email" }
      - { name: credit_balance_cents, type: integer, source: system, default: 0, description: "Prepaid wallet balance; mutated by credit-adjustments, statement finalize/dispute/resolve-dispute; may never be set directly on create" }

  - name: BoxPlan
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning brand" }
      - { name: name, type: string, source: input, description: "Box product name" }
      - { name: sku, type: string, source: input, description: "Globally unique plan SKU", constraints: "unique across all BoxPlans" }
      - { name: price_per_box_cents, type: integer, source: input, description: "Per-box kitting charge billed to the client", constraints: "> 0" }
      - { name: shipping_weight_grams, type: integer, source: input, description: "Packed box weight used by shipment_postage", constraints: "> 0" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | ACTIVE | RETIRED" }
      - { name: active_revision_id, type: string, source: system, description: "FK -> KitRevision.id; nullable; set when a revision is approved, cleared never", constraints: "nullable" }

  - name: KitRevision
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> BoxPlan.id; plan this BOM revision belongs to" }
      - { name: revision_no, type: integer, source: system, description: "Per-plan monotone counter, starts at 1, increments per created revision" }
      - { name: supersedes_revision_id, type: string, source: system, description: "FK -> KitRevision.id; nullable; points at the DRAFT revision retired by this creation", constraints: "nullable" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | APPROVED | RETIRED" }
      - { name: approved_at, type: datetime, source: system, description: "Set on APPROVED transition; null otherwise", constraints: "nullable" }

  - name: KitBOMLine
    parent: null
    common_fields: false
    fields:
      - { name: revision_id, type: string, source: input, description: "FK -> KitRevision.id" }
      - { name: component_id, type: string, source: input, description: "FK -> Component.id" }
      - { name: qty_per_box, type: integer, source: input, description: "Units of component consumed per kitted box", constraints: "> 0; unique (revision_id, component_id) pair" }

  - name: Component
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Globally unique component SKU", constraints: "unique across all Components" }
      - { name: name, type: string, source: input, description: "Component display name" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Replacement/restock reference cost", constraints: ">= 0" }
      - { name: reorder_point_units, type: integer, source: input, default: 0, description: "LOW-stock threshold on available_units", constraints: ">= 0" }
      - { name: on_hand_units, type: integer, source: system, default: 0, description: "Physical units; changed only via InventoryEvent RECEIPT (+) and COMMIT (-)" }
      - { name: reserved_units, type: integer, source: system, default: 0, description: "Units promised to LOCKED runs; changed via RESERVE (+) / RELEASE (-) / COMMIT (-)" }
      - { name: available_units, type: integer, source: computed, description: "= on_hand_units - reserved_units (instantaneous variant of component_availability)" }
      - { name: projected_available_units, type: integer, source: computed, description: "= available_units - demand of DRAFT runs (forward-looking variant of component_availability)" }
      - { name: stock_status, type: enum, source: computed, description: "OK | LOW; LOW iff available_units <= reorder_point_units" }

  - name: InventoryEvent
    parent: null
    common_fields: false
    fields:
      - { name: component_id, type: string, source: system, description: "FK -> Component.id" }
      - { name: run_id, type: string, source: system, description: "FK -> AssemblyRun.id; null for receipts", constraints: "nullable" }
      - { name: event_type, type: enum, source: system, description: "RECEIPT | RESERVE | RELEASE | COMMIT" }
      - { name: quantity_delta, type: integer, source: system, description: "Signed units applied to on_hand (RECEIPT/COMMIT) or reserved (RESERVE/RELEASE/COMMIT)" }
      - { name: note, type: string, source: system, description: "Human note; receipts may supply it", constraints: "nullable" }

  - name: ImportBatch
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> BoxPlan.id; taken from path" }
      - { name: rows, type: array, source: input, description: "Raw subscriber rows: [{email, zone, full_name?}]; zone integer 1..8" }
      - { name: total_rows, type: integer, source: computed, description: "= rows.length at upload" }
      - { name: accepted_count, type: integer, source: computed, default: 0, description: "Rows upserted at commit" }
      - { name: rejected_count, type: integer, source: computed, default: 0, description: "Rows skipped at commit (bad email, zone outside 1..8, duplicate email within file, or email already CHURNED on this plan)" }
      - { name: status, type: enum, source: system, default: UPLOADED, description: "UPLOADED | COMMITTED" }

  - name: Subscriber
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> BoxPlan.id" }
      - { name: import_batch_id, type: string, source: system, description: "FK -> ImportBatch.id; batch that created or last touched this subscriber" }
      - { name: email, type: string, source: input, description: "Subscriber email", constraints: "unique per plan_id (upsert key)" }
      - { name: full_name, type: string, source: input, description: "Display name", constraints: "nullable" }
      - { name: zone, type: integer, source: input, description: "Shipping zone 1..8 used by shipment_postage", constraints: "1 <= zone <= 8" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | PAUSED | CHURNED" }
      - { name: churned_at, type: datetime, source: system, description: "Clock value at churn; null otherwise", constraints: "nullable" }
      - { name: churn_reason, type: enum, source: input, description: "PRICE | PRODUCT | MOVED | OTHER; required on churn", constraints: "nullable" }

  - name: AssemblyRun
    parent: null
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: input, description: "FK -> BoxPlan.id" }
      - { name: period, type: string, source: input, description: "Billing/kitting month, format YYYY-MM", constraints: "unique per plan among non-CANCELLED runs" }
      - { name: planned_box_count, type: integer, source: system, default: 0, description: "Snapshot of ACTIVE subscriber count at lock" }
      - { name: kitted_box_count, type: integer, source: system, default: 0, description: "actual_kitted_count of the latest complete-kitting call" }
      - { name: estimate_cents, type: integer, source: system, default: 0, description: "= planned_box_count x price_per_box_cents, frozen at lock" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | LOCKED | KITTING | KITTED | CLOSED | CANCELLED" }
      - { name: locked_at, type: datetime, source: system, description: "Clock value at lock; null until LOCKED", constraints: "nullable" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: run_id, type: string, source: system, description: "FK -> AssemblyRun.id" }
      - { name: subscriber_id, type: string, source: system, description: "FK -> Subscriber.id" }
      - { name: wave_id, type: string, source: system, description: "FK -> ShippingWave.id; null until assigned", constraints: "nullable" }
      - { name: fulfill_status, type: enum, source: system, default: QUEUED, description: "QUEUED | STAGED | ASSIGNED | MANIFESTED | SHIPPED | DELIVERED | RETURNED | CANCELLED" }
      - { name: label_status, type: enum, source: system, default: NONE, description: "NONE | PURCHASED | VOIDED — parallel dimension, independent of fulfill_status" }
      - { name: postage_cents, type: integer, source: system, default: 0, description: "Last purchased label cost (shipment_postage); kept after void for audit" }
      - { name: tracking_code, type: string, source: system, description: "Minted at each label purchase; null until first purchase", constraints: "nullable" }
      - { name: is_replacement, type: boolean, source: system, default: false, description: "True when created by ReturnCase resolve(REPLACE)" }
      - { name: delivered_at, type: datetime, source: system, description: "Clock value at DELIVERED scan; null otherwise", constraints: "nullable" }

  - name: ShippingWave
    parent: null
    common_fields: true
    fields:
      - { name: carrier, type: enum, source: input, description: "USPS | UPS | FEDEX — the resource whose pickup windows cannot collide" }
      - { name: service_level, type: enum, source: input, description: "GROUND | EXPRESS" }
      - { name: pickup_start, type: datetime, source: input, description: "Half-open window start [pickup_start, pickup_end)" }
      - { name: pickup_end, type: datetime, source: input, description: "Half-open window end; must be strictly greater than pickup_start" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | MANIFESTED | TENDERED | CANCELLED" }
      - { name: assigned_count, type: integer, source: computed, default: 0, description: "Shipments with wave_id = this and fulfill_status IN {ASSIGNED, MANIFESTED}" }

  - name: ReturnCase
    parent: null
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: input, description: "FK -> Shipment.id; the delivered box being returned" }
      - { name: reason, type: enum, source: input, description: "DAMAGED | LOST | WRONG_ITEM | OTHER" }
      - { name: requested_resolution, type: enum, source: input, description: "REPLACE | REFUND" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | APPROVED | REJECTED | RECEIVED | RESOLVED" }
      - { name: resolution_applied, type: enum, source: system, description: "REPLACED | REFUNDED; null until RESOLVED", constraints: "nullable" }
      - { name: credit_cents, type: integer, source: system, default: 0, description: "Refund amount credited to the period statement (REFUND path only)" }
      - { name: replacement_shipment_id, type: string, source: system, description: "FK -> Shipment.id; replacement created on resolve(REPLACE); null otherwise", constraints: "nullable" }

  - name: BillingStatement
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: system, description: "FK -> Client.id" }
      - { name: period, type: string, source: system, description: "YYYY-MM of the contributing runs", constraints: "unique per client" }
      - { name: box_charge_cents, type: integer, source: computed, default: 0, description: "Sum of per-run line charges (statement_net_amount)" }
      - { name: postage_cents, type: integer, source: computed, default: 0, description: "Sum of shipment postage per active variant's label filter" }
      - { name: refund_credit_cents, type: integer, source: computed, default: 0, description: "Sum of credit_cents from RESOLVED/REFUNDED return cases of the period" }
      - { name: discount_pct, type: integer, source: computed, default: 0, description: "Volume tier in effect: 10 | 5 | 0" }
      - { name: adjustment_credit_cents, type: integer, source: system, default: 0, description: "Goodwill credit applied at resolve-dispute" }
      - { name: net_cents, type: integer, source: computed, default: 0, description: "= box_charge_cents + postage_cents - refund_credit_cents - adjustment_credit_cents" }
      - { name: status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL | FINALIZED | DISPUTED | PAID" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BoxPlan
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /box-plans/{id}/activate"
        actor: ClientOps
        preconditions:
          - "active_revision_id is not null (ERR_PLAN_HAS_NO_APPROVED_REVISION)"
        side_effects: ["increments BoxPlan.version by 1"]

      - from: ACTIVE
        to: RETIRED
        trigger: "POST /box-plans/{id}/retire"
        actor: ClientOps
        preconditions:
          - "no AssemblyRun of this plan in status LOCKED, KITTING, or KITTED (ERR_PLAN_HAS_OPEN_RUNS)"
        side_effects: ["increments BoxPlan.version by 1"]

  - entity: KitRevision
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /kit-revisions/{id}/approve"
        actor: ClientOps
        preconditions:
          - "revision has at least 1 KitBOMLine (ERR_REVISION_EMPTY_BOM)"
          - "owning BoxPlan.status is DRAFT or ACTIVE (ERR_PLAN_NOT_ACTIVE)"
        side_effects:
          - "BoxPlan.active_revision_id := this revision id"
          - "previous APPROVED KitRevision of the same plan (if any) -> RETIRED"
          - "approved_at := current clock"
          - "increments BoxPlan.version by 1 and increments KitRevision.version by 1"

      - from: DRAFT
        to: RETIRED
        trigger: "system (automatic when a newer KitRevision is created for the same plan)"
        actor: system
        preconditions: []
        side_effects: ["new revision's supersedes_revision_id := this revision id"]

      - from: APPROVED
        to: RETIRED
        trigger: "system (automatic when a different revision of the same plan is approved)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ImportBatch
    initial_state: UPLOADED
    terminal_states: [COMMITTED]
    transitions:
      - from: UPLOADED
        to: COMMITTED
        trigger: "POST /import-batches/{id}/commit"
        actor: ClientOps
        preconditions: []
        side_effects:
          - "upsert Subscribers by (plan_id, email): new emails create ACTIVE subscribers; existing ACTIVE/PAUSED subscribers update zone/full_name and import_batch_id; rows with bad email, zone outside 1..8, duplicate email within the file, or an email already CHURNED on this plan are skipped"
          - "accepted_count / rejected_count recomputed and frozen"

  - entity: Subscriber
    initial_state: ACTIVE
    terminal_states: [CHURNED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /subscribers/{id}/pause"
        actor: ClientOps
        preconditions: []
        side_effects: ["increments Subscriber.version by 1"]

      - from: PAUSED
        to: ACTIVE
        trigger: "POST /subscribers/{id}/resume"
        actor: ClientOps
        preconditions: []
        side_effects: ["increments Subscriber.version by 1"]

      - from: ACTIVE
        to: CHURNED
        trigger: "POST /subscribers/{id}/churn"
        actor: ClientOps
        preconditions: []
        side_effects:
          - "churned_at := current clock; churn_reason recorded"
          - "already-QUEUED shipments of this subscriber are NOT cancelled (locked snapshots are honored)"
          - "increments Subscriber.version by 1"

      - from: PAUSED
        to: CHURNED
        trigger: "POST /subscribers/{id}/churn"
        actor: ClientOps
        preconditions: []
        side_effects:
          - "churned_at := current clock; churn_reason recorded"
          - "increments Subscriber.version by 1"

  - entity: AssemblyRun
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: LOCKED
        trigger: "POST /assembly-runs/{id}/lock"
        actor: WarehouseOps
        preconditions:
          - "BoxPlan.status == ACTIVE (ERR_PLAN_NOT_ACTIVE)"
          - "BoxPlan.active_revision_id is not null (ERR_PLAN_HAS_NO_APPROVED_REVISION)"
          - "at least 1 subscriber of the plan has status == ACTIVE (ERR_RUN_EMPTY)"
          - "Client.credit_balance_cents >= estimate_cents (ERR_INSUFFICIENT_CREDIT)"
          - "for every BOM line of the active revision: Component.available_units >= qty_per_box x planned_box_count (ERR_COMPONENT_SHORTAGE)"
        side_effects:
          - "planned_box_count := count of plan subscribers with status == ACTIVE (subscriber_snapshot)"
          - "estimate_cents := planned_box_count x price_per_box_cents (run_estimate); locked_at := clock"
          - "create one RESERVE InventoryEvent per BOM line (quantity_delta = +required); Component.reserved_units += required per line"
          - "recompute each touched Component.available_units / projected_available_units / stock_status"
          - "create one Shipment per snapshotted subscriber (fulfill_status QUEUED, label_status NONE)"
          - "find-or-create BillingStatement (client_id, period) in PROVISIONAL; run statement_net_amount provisional variant and store amounts"
          - "increments AssemblyRun.version by 1"

      - from: LOCKED
        to: KITTING
        trigger: "POST /assembly-runs/{id}/start-kitting"
        actor: WarehouseOps
        preconditions: []
        side_effects: ["increments AssemblyRun.version by 1"]

      - from: KITTING
        to: KITTED
        trigger: "POST /assembly-runs/{id}/complete-kitting"
        actor: WarehouseOps
        preconditions:
          - "actual_kitted_count >= 1 (ERR_INVALID_QUANTITY)"
          - "actual_kitted_count <= planned_box_count (ERR_KIT_COUNT_MISMATCH)"
          - "if re-completing after a rework loop: actual_kitted_count >= kitted_box_count (ERR_REWORK_REGRESS)"
          - "if re-completing after a rework loop: for every BOM line, Component.available_units >= qty_per_box x (actual_kitted_count - kitted_box_count) (ERR_COMPONENT_SHORTAGE)"
        side_effects:
          - "new_commit := actual_kitted_count - kitted_box_count (0 on first completion means nothing consumed)"
          - "first completion (kitted_box_count was 0): COMMIT InventoryEvents consume from the run's reservation (Component.on_hand_units -= qty, Component.reserved_units -= qty), then RELEASE InventoryEvents release the remaining reservation of (planned_box_count - actual_kitted_count) units per BOM line, leaving the run with zero open reservation"
          - "post-rework completion: COMMIT InventoryEvents draw straight from stock (Component.on_hand_units -= qty only; the reservation was fully released at first completion)"
          - "excess selection (only on first completion): cancel (planned_box_count - actual_kitted_count) QUEUED shipments, chosen by excess_shipment_selection; selection never re-runs and never un-cancels"
          - "kitted_box_count := actual_kitted_count; recompute touched Component stock_status"
          - "increments AssemblyRun.version by 1"

      - from: KITTED
        to: KITTING
        trigger: "POST /assembly-runs/{id}/rework"
        actor: WarehouseOps
        preconditions:
          - "no shipment of this run in fulfill_status ASSIGNED, MANIFESTED, SHIPPED, DELIVERED, or RETURNED (ERR_RUN_HAS_COMMITTED_SHIPMENTS)"
        side_effects: ["increments AssemblyRun.version by 1"]
        note: "rework cycle: inventory committed so far is NOT released back; the next complete-kitting commits only the positive delta from unreserved stock"

      - from: KITTED
        to: CLOSED
        trigger: "POST /assembly-runs/{id}/close"
        actor: WarehouseOps
        preconditions:
          - "no shipment of this run in fulfill_status QUEUED, STAGED, ASSIGNED, or MANIFESTED (ERR_RUN_HAS_OPEN_SHIPMENTS)"
        side_effects:
          - "increments AssemblyRun.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /assembly-runs/{id}/cancel"
        actor: WarehouseOps
        preconditions: []
        side_effects: ["increments AssemblyRun.version by 1"]

      - from: LOCKED
        to: CANCELLED
        trigger: "POST /assembly-runs/{id}/cancel"
        actor: WarehouseOps
        preconditions: []
        side_effects:
          - "create RELEASE InventoryEvents per BOM line for the full remaining reservation (Component.reserved_units -= released)"
          - "QUEUED shipments of this run -> CANCELLED"
          - "recompute touched Component stock_status"
          - "increments AssemblyRun.version by 1"

  - entity: Shipment
    initial_state: QUEUED
    terminal_states: [DELIVERED, RETURNED, CANCELLED]
    note: "two parallel state dimensions on one row: fulfill_status (lifecycle below) x label_status (NONE -> PURCHASED -> VOIDED, with VOIDED -> PURCHASED allowed on re-manifest). fulfill transitions never read label_status and label transitions never read fulfill_status beyond the void-label guard (fulfill_status == MANIFESTED)"
    transitions:
      - from: QUEUED
        to: STAGED
        trigger: "system (AssemblyRun complete-kitting keeps this shipment)"
        actor: system
        preconditions: []
        side_effects: []

      - from: QUEUED
        to: CANCELLED
        trigger: "system (excess selection at complete-kitting, or run cancel) OR POST /shipments/{id}/cancel"
        actor: system | WarehouseOps
        preconditions: []
        side_effects: ["kitted stock already committed for this box is written off, not restocked"]

      - from: STAGED
        to: ASSIGNED
        trigger: "POST /shipping-waves/{id}/assign-shipments"
        actor: WarehouseOps
        preconditions:
          - "ShippingWave.status == SCHEDULED (ERR_INVALID_STATE)"
          - "label_status IN {NONE, VOIDED} (ERR_INVALID_STATE)"
          - "owning AssemblyRun.status IN {KITTING, KITTED, CLOSED} (ERR_INVALID_STATE)"
        side_effects: ["wave_id := wave; ShippingWave.assigned_count recomputed"]

      - from: ASSIGNED
        to: MANIFESTED
        trigger: "system (ShippingWave manifest)"
        actor: system
        preconditions: []
        side_effects:
          - "postage_cents := shipment_postage(carrier, service_level, subscriber.zone, plan.shipping_weight_grams)"
          - "label_status := PURCHASED; new tracking_code minted"
          - "period BillingStatement (if any) provisional postage recompute"

      - from: ASSIGNED
        to: STAGED
        trigger: "system (ShippingWave cancel)"
        actor: system
        preconditions: []
        side_effects: ["wave_id := null", "if label_status == PURCHASED: label_status := VOIDED", "period BillingStatement (if any) provisional postage recompute"]

      - from: MANIFESTED
        to: SHIPPED
        trigger: "system (ShippingWave tender)"
        actor: system
        preconditions: []
        side_effects: []

      - from: MANIFESTED
        to: STAGED
        trigger: "system (ShippingWave cancel)"
        actor: system
        preconditions: []
        side_effects: ["wave_id := null", "label_status PURCHASED -> VOIDED", "period BillingStatement (if any) provisional postage recompute"]

      - from: MANIFESTED
        to: MANIFESTED
        trigger: "POST /shipments/{id}/void-label (label dimension only)"
        actor: WarehouseOps
        preconditions:
          - "fulfill_status == MANIFESTED and label_status == PURCHASED (ERR_LABEL_NOT_VOIDABLE)"
        side_effects:
          - "label_status := VOIDED"
          - "period BillingStatement (if any) provisional postage recompute"
        note: "fulfill_status unchanged — parallel-dimension transition"

      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /shipments/{id}/scan (scan_type = DELIVERED)"
        actor: WarehouseOps
        preconditions: []
        side_effects: ["delivered_at := current clock"]

      - from: SHIPPED
        to: RETURNED
        trigger: "POST /shipments/{id}/scan (scan_type = RETURNED)"
        actor: WarehouseOps
        preconditions: []
        side_effects: []

      - from: STAGED
        to: CANCELLED
        trigger: "POST /shipments/{id}/cancel"
        actor: WarehouseOps
        preconditions: []
        side_effects: ["kitted stock already committed for this box is written off, not restocked"]

  - entity: ShippingWave
    initial_state: SCHEDULED
    terminal_states: [TENDERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: MANIFESTED
        trigger: "POST /shipping-waves/{id}/manifest"
        actor: WarehouseOps
        preconditions:
          - "assigned_count >= 1 (ERR_WAVE_EMPTY)"
        side_effects:
          - "each assigned shipment: ASSIGNED -> MANIFESTED with label purchase (see Shipment)"
          - "increments ShippingWave.version by 1"

      - from: MANIFESTED
        to: TENDERED
        trigger: "POST /shipping-waves/{id}/tender"
        actor: WarehouseOps
        preconditions: []
        side_effects:
          - "each MANIFESTED shipment of the wave -> SHIPPED"
          - "increments ShippingWave.version by 1"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /shipping-waves/{id}/cancel"
        actor: WarehouseOps
        preconditions: []
        side_effects:
          - "assigned shipments revert to STAGED (see Shipment)"
          - "increments ShippingWave.version by 1"

      - from: MANIFESTED
        to: CANCELLED
        trigger: "POST /shipping-waves/{id}/cancel"
        actor: WarehouseOps
        preconditions: []
        side_effects:
          - "manifested shipments revert to STAGED with labels PURCHASED -> VOIDED"
          - "period BillingStatement (if any) provisional postage recompute"
          - "increments ShippingWave.version by 1"

  - entity: ReturnCase
    initial_state: REQUESTED
    terminal_states: [REJECTED, RESOLVED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /return-cases/{id}/approve"
        actor: CustomerService
        preconditions:
          - "Shipment.fulfill_status == DELIVERED (ERR_SHIPMENT_NOT_DELIVERED)"
          - "current clock <= Shipment.delivered_at + 30 days (ERR_RETURN_WINDOW_EXPIRED)"
        side_effects: ["increments ReturnCase.version by 1"]

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /return-cases/{id}/reject"
        actor: CustomerService
        preconditions: []
        side_effects: ["increments ReturnCase.version by 1"]

      - from: APPROVED
        to: RECEIVED
        trigger: "POST /return-cases/{id}/receive"
        actor: WarehouseOps
        preconditions: []
        side_effects: ["increments ReturnCase.version by 1"]

      - from: RECEIVED
        to: RESOLVED
        trigger: "POST /return-cases/{id}/resolve"
        actor: CustomerService
        preconditions:
          - "if requested_resolution == REPLACE: for every BOM line of the plan's active revision, Component.available_units >= qty_per_box (ERR_COMPONENT_SHORTAGE)"
        side_effects:
          - "REPLACE: create replacement Shipment (same run_id/subscriber_id, is_replacement = true, fulfill_status = STAGED, label_status = NONE); create COMMIT InventoryEvents per BOM line for 1 box (on_hand -= qty); recompute Component stock_status; replacement_shipment_id set; resolution_applied := REPLACED"
          - "REFUND: credit_cents := plan.price_per_box_cents; period BillingStatement (if any) refund_credit_cents += credit_cents and provisional recompute; resolution_applied := REFUNDED"
          - "increments ReturnCase.version by 1"

  - entity: BillingStatement
    initial_state: PROVISIONAL
    terminal_states: [PAID]
    transitions:
      - from: PROVISIONAL
        to: FINALIZED
        trigger: "POST /billing-statements/{id}/finalize"
        actor: BillingAdmin
        preconditions:
          - "current clock >= first instant of the month after period (ERR_STATEMENT_PERIOD_OPEN)"
          - "Client.credit_balance_cents >= net_cents recomputed under the final variant (ERR_INSUFFICIENT_CREDIT)"
        side_effects:
          - "run statement_net_amount final variant; overwrite box_charge_cents / postage_cents / refund_credit_cents / discount_pct / net_cents"
          - "Client.credit_balance_cents -= net_cents"
          - "increments BillingStatement.version by 1"

      - from: FINALIZED
        to: DISPUTED
        trigger: "POST /billing-statements/{id}/dispute"
        actor: ClientOps
        preconditions:
          - "caller is a ClientOps of the statement's client (ERR_FORBIDDEN)"
        side_effects:
          - "Client.credit_balance_cents += net_cents (full provisional refund while disputed)"
          - "increments BillingStatement.version by 1"

      - from: DISPUTED
        to: FINALIZED
        trigger: "POST /billing-statements/{id}/resolve-dispute"
        actor: BillingAdmin
        preconditions:
          - "0 <= adjustment_credit_cents <= net_cents (ERR_INVALID_QUANTITY)"
        side_effects:
          - "adjustment_credit_cents recorded; net_cents := net_cents - adjustment_credit_cents"
          - "Client.credit_balance_cents -= net_cents (reduced net re-debited)"
          - "increments BillingStatement.version by 1"

      - from: FINALIZED
        to: PAID
        trigger: "POST /billing-statements/{id}/mark-paid"
        actor: BillingAdmin
        preconditions: []
        side_effects: ["increments BillingStatement.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: revision-create-stale-plan
    parent_entity: BoxPlan
    write_endpoint: "POST /box-plans/{id}/kit-revisions"
    occ_field: expected_box_plan_version
    description: |
      Creating a KitRevision against a BoxPlan whose version has advanced since
      the client last observed it is rejected. Creating a revision legitimately
      supersedes the plan's current DRAFT revision (which moves to RETIRED), so
      a writer holding a stale plan version must re-observe before superseding.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: receipt-create-stale-component
    parent_entity: Component
    write_endpoint: "POST /components/{id}/receipts"
    occ_field: expected_component_version
    description: |
      Recording a receipt against a Component whose version has advanced since
      the client last observed it is rejected. Receipts legitimately accumulate
      (each one raises on_hand_units), so a stale writer would silently lose the
      intervening receipt's context; the stale request must re-observe first.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: component_availability
    trigger: "every Component read; recomputed on any InventoryEvent append for that component"
    algorithm: aggregation
    formula: |
      instantaneous variant:
        available_units = on_hand_units - reserved_units
      forward-looking variant:
        projected_available_units = available_units - draft_demand
        draft_demand = sum over every AssemblyRun R with R.status == DRAFT
                       whose plan's active_revision_id resolves to a KitRevision
                       containing a BOM line L for this component:
                         L.qty_per_box * snapshot_demand(R.plan_id)
        snapshot_demand(plan_id) = count of Subscribers S with
                       S.plan_id == plan_id AND S.status == ACTIVE (evaluated now)
      stock_status = LOW iff available_units <= reorder_point_units else OK
    input_set: "DRAFT runs only contribute to draft_demand (LOCKED runs are already inside reserved_units; KITTING/KITTED runs are committed or in progress; CLOSED/CANCELLED excluded)"
    precision: "integer units, no rounding"
    variants:
      - name: instantaneous
        when: "available_units field; used by run-lock shortage gate and resolve(REPLACE) gate"
        difference: "ignores DRAFT-run demand entirely"
      - name: forward_looking
        when: "projected_available_units field; planning view on GET /components/{id}"
        difference: "subtracts not-yet-reserved DRAFT run demand, so identical inventory shows a lower number whenever a DRAFT run exists"

  - name: run_estimate
    trigger: "AssemblyRun lock (credit gate and estimate_cents freeze)"
    algorithm: aggregation
    formula: |
      estimate_cents = planned_box_count * BoxPlan.price_per_box_cents
      gate: Client.credit_balance_cents >= estimate_cents   (equality PASSES)
    input_set: "planned_box_count comes from subscriber_snapshot at the same lock call"
    precision: "integer cents"

  - name: subscriber_snapshot
    trigger: "AssemblyRun lock"
    algorithm: aggregation
    formula: |
      planned_box_count = count of Subscriber S with S.plan_id == run.plan_id
                          AND S.status == ACTIVE at the lock instant
      for each such subscriber (ordered by created_at ASC, tie-break email ASC):
        create Shipment(run_id, subscriber_id, QUEUED, NONE)
    input_set: "status == ACTIVE only; PAUSED and CHURNED excluded"

  - name: excess_shipment_selection
    trigger: "AssemblyRun complete-kitting when kitted_box_count was 0 and actual_kitted_count < planned_box_count"
    algorithm: chronological
    formula: |
      cancel_count = planned_box_count - actual_kitted_count
      candidates = shipments of this run with fulfill_status == QUEUED
      order candidates by Subscriber.created_at DESC, tie-break Subscriber.email ASC
      cancel the first cancel_count candidates (fulfill_status := CANCELLED)
    input_set: "QUEUED shipments only; never re-cancels; re-completions after rework commit deltas only and never re-run selection"

  - name: shipment_postage
    trigger: "ShippingWave manifest, per assigned shipment"
    algorithm: tiered_pricing
    formula: |
      weight_slab = ceil(plan.shipping_weight_grams / SLAB_GRAMS)
      base        = SERVICE_BASE[wave.service_level]
      zone_rate   = ZONE_RATE[subscriber.zone]            # zone integer 1..8
      raw         = base + zone_rate * weight_slab
      postage     = max(MIN_CHARGE[wave.service_level], raw)
      if wave.service_level == EXPRESS and subscriber.zone >= REMOTE_ZONE_MIN:
        postage += EXPRESS_REMOTE_SURCHARGE
      shipment.postage_cents = postage
    input_set: "all shipments of the wave in fulfill_status == ASSIGNED at manifest time"
    constants:
      SLAB_GRAMS: 500
      SERVICE_BASE: { GROUND: 320, EXPRESS: 745 }
      ZONE_RATE: { 1: 25, 2: 40, 3: 55, 4: 75, 5: 95, 6: 120, 7: 150, 8: 185 }
      MIN_CHARGE: { GROUND: 450, EXPRESS: 990 }
      REMOTE_ZONE_MIN: 5
      EXPRESS_REMOTE_SURCHARGE: 200
    precision: "integer cents; ceil applied to the slab division only"

  - name: statement_net_amount
    trigger: "provisional variant: AssemblyRun lock (find-or-create), label purchase at manifest, void-label, wave cancel, return resolve(REFUND); final variant: BillingStatement finalize"
    algorithm: aggregation
    formula: |
      Evaluation order is pinned (circular-looking dependency resolved):
        step 1: run_set = AssemblyRuns R of this client with R.period == statement.period
                AND R.status IN {KITTED, CLOSED}
        step 2: volume_basis = sum(R.planned_box_count)   [provisional variant]
                volume_basis = sum(R.kitted_box_count)    [final variant]
        step 3: discount_pct = 10 if volume_basis >= TIER10_BOXES
                               else 5 if volume_basis >= TIER5_BOXES else 0
        step 4: per run R in run_set:
                  boxes = R.planned_box_count  [provisional variant]
                  boxes = R.kitted_box_count   [final variant]
                  line_charge_cents = round_half_up(
                      R.plan.price_per_box_cents * boxes * (1 - discount_pct / 100))
                  # rounding order PINNED: round each line to integer cents FIRST,
                  # then sum. Sum-then-round is a rejected interpretation.
        step 5: box_charge_cents = sum(line_charge_cents over run_set)
        step 6: postage_cents = sum(S.postage_cents) over shipments S of runs in
                run_set with S.label_status == PURCHASED   [both variants]
        step 7: refund_credit_cents = sum(RC.credit_cents) over ReturnCases RC with
                RC.status == RESOLVED AND RC.resolution_applied == REFUNDED whose
                shipment belongs to a run in run_set
        step 8: net_cents = box_charge_cents + postage_cents
                          - refund_credit_cents - adjustment_credit_cents
    input_set: "runs KITTED/CLOSED of the client+period; shipments with label PURCHASED; RESOLVED/REFUNDED return cases only"
    constants:
      TIER5_BOXES: 200
      TIER10_BOXES: 500
    precision: "integer cents, round_half_up applied per line before summing"
    variants:
      - name: provisional
        when: "stored while statement status == PROVISIONAL; recomputed on every contributing event"
        difference: "volume_basis and per-run boxes use planned_box_count (optimistic)"
      - name: final
        when: "computed at finalize and frozen onto the statement"
        difference: "volume_basis and per-run boxes use kitted_box_count (actual); identical inputs therefore yield a different net whenever kitted != planned or the tier flips"

  - name: fulfillment_summary
    trigger: "GET /clients/{id}/reports/fulfillment-summary"
    algorithm: aggregation
    formula: |
      run_set = AssemblyRuns R of the client with R.period == period
                AND R.status IN {LOCKED, KITTING, KITTED, CLOSED}
      planned_boxes = sum(R.planned_box_count)
      kitted_boxes  = sum(R.kitted_box_count)
      shipped_boxes = count of shipments of run_set with
                      fulfill_status IN {SHIPPED, DELIVERED, RETURNED}
      returned_boxes = count of shipments of run_set with fulfill_status == RETURNED
      active_subscribers = count of Subscribers of the client's plans with status == ACTIVE
      churned_in_period = count of Subscribers of the client's plans with
                      churned_at inside [period-01T00:00:00Z, first instant of next month)
      fill_rate_pct = round_half_up(kitted_boxes * 100.0 / planned_boxes, 1)
                      (0.0 when planned_boxes == 0)
    input_set: "DRAFT and CANCELLED runs excluded from run_set"
    precision: "fill_rate_pct 1 decimal, round_half_up; counts integer"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "role permitted on the endpoint per §1.5/§1.7; for entity_backed ClientOps, X-User-ID must equal the owning Client.id of the target resource (plan / subscriber / import batch / statement), and client_id in POST /box-plans body must equal X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "path-template ids and body foreign keys (client_id, plan_id, shipment_id, shipment_ids[], component_id in lines[]) resolve to existing resources"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "target entity in a valid from-state for the requested transition; domain-pinned state errors: ERR_INVALID_STATE (generic wrong-state), ERR_PLAN_NOT_ACTIVE, ERR_PLAN_HAS_NO_APPROVED_REVISION, ERR_PLAN_HAS_OPEN_RUNS, ERR_REVISION_EMPTY_BOM, ERR_IMPORT_ALREADY_COMMITTED, ERR_LABEL_NOT_VOIDABLE, ERR_SHIPMENT_NOT_DELIVERED, ERR_RUN_HAS_COMMITTED_SHIPMENTS, ERR_RUN_HAS_OPEN_SHIPMENTS"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 5
    category: business_constraint
    check: "well-formedness and uniqueness: pickup_end strictly after pickup_start (ERR_INVALID_WINDOW); quantities > 0 (ERR_INVALID_QUANTITY); actual_kitted_count <= planned_box_count (ERR_KIT_COUNT_MISMATCH); rework re-completion not below prior kitted count (ERR_REWORK_REGRESS); plan SKU / component SKU uniqueness (ERR_DUPLICATE_SKU); one non-CANCELLED run per (plan_id, period) (ERR_RUN_PERIOD_CONFLICT); >= 1 ACTIVE subscriber at lock (ERR_RUN_EMPTY); >= 1 assigned shipment at manifest (ERR_WAVE_EMPTY); at least 1 BOM line at approve (ERR_REVISION_EMPTY_BOM counted here by uniqueness/emptiness family)"
    error_id: ERR_INVALID_WINDOW
    http_status: 409
    applies_to: "mutation endpoints with domain invariants"

  - priority: 6
    category: business_temporal
    check: "time-window rules: same-carrier pickup windows may not overlap half-open [start,end) and must keep >= 30 min gap (ERR_WAVE_WINDOW_CONFLICT); return approve within delivered_at + 30 days (ERR_RETURN_WINDOW_EXPIRED); statement finalize only after period end (ERR_STATEMENT_PERIOD_OPEN)"
    error_id: ERR_WAVE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "wave creation, return approval, statement finalize"

  - priority: 7
    category: business_fiscal
    check: "money and capacity last: Client.credit_balance_cents >= estimate at run lock and >= final net at finalize (ERR_INSUFFICIENT_CREDIT); Component.available_units >= required at run lock and at resolve(REPLACE) (ERR_COMPONENT_SHORTAGE)"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 409
    applies_to: "run lock, statement finalize, return resolve"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default before any call is exactly 2026-05-01T00:00:00Z (never wall-clock); every time rule in this scaffold reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced to to_iso8601 (must be >= current value; ERR_INVALID_REQUEST on regression)"]

  # --- Client ---
  - method: POST
    path: "/clients"
    description: "Register a brand client"
    roles: [PlatformAdmin]
    code: 201
    input: [name, billing_email]
    output: Client
    side_effects: ["credit_balance_cents = 0"]

  - method: GET
    path: "/clients/{id}"
    description: "Read a client (ClientOps restricted to own id)"
    roles: [PlatformAdmin, ClientOps, BillingAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{id}/credit-adjustments"
    description: "Top up (positive) or debit (negative) the client's prepaid wallet"
    roles: [PlatformAdmin, BillingAdmin]
    code: 200
    input: [amount_cents, reason]
    output: Client
    side_effects: ["credit_balance_cents += amount_cents", "increments Client.version by 1"]

  - method: GET
    path: "/clients/{id}/billing-statements"
    description: "List statements of a client"
    roles: [PlatformAdmin, ClientOps, BillingAdmin]
    code: 200
    input: ['period?', 'status?']
    output: BillingStatement[]
    side_effects: []

  - method: GET
    path: "/clients/{id}/reports/fulfillment-summary"
    description: "Computed per-period fulfillment report (fulfillment_summary)"
    roles: [PlatformAdmin, ClientOps, WarehouseOps]
    code: 200
    input: [period]
    output: { period: string, planned_boxes: integer, kitted_boxes: integer, shipped_boxes: integer, returned_boxes: integer, active_subscribers: integer, churned_in_period: integer, fill_rate_pct: number }
    side_effects: []

  # --- BoxPlan ---
  - method: POST
    path: "/box-plans"
    description: "Create a box plan (status DRAFT)"
    roles: [ClientOps, PlatformAdmin]
    code: 201
    input: [client_id, name, sku, price_per_box_cents, shipping_weight_grams]
    output: BoxPlan
    side_effects: ["status = DRAFT; ERR_DUPLICATE_SKU on sku conflict"]

  - method: GET
    path: "/box-plans"
    description: "List/filter box plans"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, BillingAdmin]
    code: 200
    input: ['client_id?', 'status?', 'active_revision_id?']
    output: BoxPlan[]
    side_effects: []

  - method: GET
    path: "/box-plans/{id}"
    description: "Read a box plan"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, BillingAdmin, CustomerService]
    code: 200
    input: []
    output: BoxPlan
    side_effects: []

  - method: POST
    path: "/box-plans/{id}/activate"
    description: "DRAFT -> ACTIVE (requires an APPROVED revision)"
    roles: [ClientOps]
    code: 200
    input: []
    output: BoxPlan
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/box-plans/{id}/retire"
    description: "ACTIVE -> RETIRED (blocked while a run is LOCKED/KITTING/KITTED)"
    roles: [ClientOps]
    code: 200
    input: []
    output: BoxPlan
    side_effects: ["status -> RETIRED"]

  - method: POST
    path: "/box-plans/{id}/kit-revisions"
    description: "Create a new DRAFT KitRevision; supersedes (retires) the plan's current DRAFT revision if one exists. OCC-guarded on BoxPlan.version."
    roles: [ClientOps]
    code: 201
    input: [expected_box_plan_version]
    output: KitRevision
    side_effects:
      - "ERR_STALE_VERSION (412) when expected_box_plan_version != BoxPlan.version"
      - "prior DRAFT revision of the plan -> RETIRED; supersedes_revision_id recorded"
      - "revision_no := max(existing revision_no of plan) + 1"
      - "increments BoxPlan.version by 1"

  - method: GET
    path: "/box-plans/{id}/kit-revisions"
    description: "List revisions of a plan"
    roles: [PlatformAdmin, ClientOps, WarehouseOps]
    code: 200
    input: ['status?']
    output: KitRevision[]
    side_effects: []

  - method: POST
    path: "/box-plans/{id}/import-batches"
    description: "Upload a subscriber list for this plan (status UPLOADED)"
    roles: [ClientOps]
    code: 201
    input: [rows]
    output: ImportBatch
    side_effects: ["total_rows = rows.length"]

  - method: GET
    path: "/box-plans/{id}/import-batches"
    description: "List import batches of a plan"
    roles: [PlatformAdmin, ClientOps]
    code: 200
    input: ['status?']
    output: ImportBatch[]
    side_effects: []

  - method: GET
    path: "/box-plans/{id}/assembly-runs"
    description: "List assembly runs of a plan"
    roles: [PlatformAdmin, ClientOps, WarehouseOps]
    code: 200
    input: ['period?', 'status?']
    output: AssemblyRun[]
    side_effects: []

  # --- KitRevision / BOM ---
  - method: GET
    path: "/kit-revisions/{id}"
    description: "Read a kit revision"
    roles: [PlatformAdmin, ClientOps, WarehouseOps]
    code: 200
    input: []
    output: KitRevision
    side_effects: []

  - method: GET
    path: "/kit-revisions"
    description: "List/filter kit revisions (including supersession lookups)"
    roles: [PlatformAdmin, ClientOps, WarehouseOps]
    code: 200
    input: ['plan_id?', 'supersedes_revision_id?', 'status?']
    output: KitRevision[]
    side_effects: []

  - method: POST
    path: "/kit-revisions/{id}/approve"
    description: "DRAFT -> APPROVED; pins the revision as the plan's active BOM"
    roles: [ClientOps]
    code: 200
    input: []
    output: KitRevision
    side_effects:
      - "BoxPlan.active_revision_id := revisionId; prior APPROVED revision -> RETIRED; approved_at := clock"
      - "increments BoxPlan.version by 1"

  - method: PUT
    path: "/kit-revisions/{id}/bom-lines"
    description: "Replace the full BOM line set of a DRAFT revision (bulk, transactional: any invalid line rejects the whole write)"
    roles: [ClientOps]
    code: 200
    input: [lines]
    output: KitBOMLine[]
    side_effects: ["existing lines of the revision deleted and replaced by lines[]; revision must be DRAFT (ERR_INVALID_STATE)"]

  - method: GET
    path: "/kit-revisions/{id}/bom-lines"
    description: "List BOM lines of a revision"
    roles: [PlatformAdmin, ClientOps, WarehouseOps]
    code: 200
    input: []
    output: KitBOMLine[]
    side_effects: []

  # --- Component / inventory ---
  - method: POST
    path: "/components"
    description: "Register a component"
    roles: [WarehouseOps]
    code: 201
    input: [sku, name, unit_cost_cents, 'reorder_point_units?']
    output: Component
    side_effects: ["on_hand_units = 0, reserved_units = 0; ERR_DUPLICATE_SKU on sku conflict"]

  - method: GET
    path: "/components/{id}"
    description: "Read a component (includes available_units / projected_available_units / stock_status)"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, BillingAdmin]
    code: 200
    input: []
    output: Component
    side_effects: []

  - method: GET
    path: "/components/{id}/bom-lines"
    description: "List BOM lines referencing this component"
    roles: [PlatformAdmin, ClientOps, WarehouseOps]
    code: 200
    input: []
    output: KitBOMLine[]
    side_effects: []

  - method: POST
    path: "/components/{id}/receipts"
    description: "Record a stock receipt. OCC-guarded on Component.version."
    roles: [WarehouseOps]
    code: 200
    input: [quantity, expected_component_version, 'note?']
    output: Component
    side_effects:
      - "ERR_STALE_VERSION (412) when expected_component_version != Component.version"
      - "ERR_INVALID_QUANTITY when quantity <= 0"
      - "append RECEIPT InventoryEvent (quantity_delta = +quantity, run_id = null); on_hand_units += quantity"
      - "recompute available_units / projected_available_units / stock_status"
      - "increments Component.version by 1"

  - method: GET
    path: "/components/{id}/inventory-events"
    description: "Chronological event ledger of the component (created_at ASC)"
    roles: [PlatformAdmin, ClientOps, WarehouseOps]
    code: 200
    input: ['event_type?']
    output: InventoryEvent[]
    side_effects: []

  # --- Import / Subscriber ---
  - method: GET
    path: "/import-batches/{id}"
    description: "Read an import batch (counts after commit)"
    roles: [PlatformAdmin, ClientOps]
    code: 200
    input: []
    output: ImportBatch
    side_effects: []

  - method: POST
    path: "/import-batches/{id}/commit"
    description: "Commit an UPLOADED batch: upsert subscribers by (plan_id, email)"
    roles: [ClientOps]
    code: 200
    input: []
    output: ImportBatch
    side_effects:
      - "per-row upsert per ImportBatch state machine; accepted_count / rejected_count frozen"
      - "status -> COMMITTED (second commit -> ERR_IMPORT_ALREADY_COMMITTED)"

  - method: GET
    path: "/subscribers"
    description: "List/filter subscribers"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, CustomerService]
    code: 200
    input: ['plan_id?', 'import_batch_id?', 'status?']
    output: Subscriber[]
    side_effects: []

  - method: GET
    path: "/subscribers/{id}"
    description: "Read a subscriber"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, CustomerService]
    code: 200
    input: []
    output: Subscriber
    side_effects: []

  - method: POST
    path: "/subscribers/{id}/pause"
    description: "ACTIVE -> PAUSED"
    roles: [ClientOps]
    code: 200
    input: []
    output: Subscriber
    side_effects: ["status -> PAUSED"]

  - method: POST
    path: "/subscribers/{id}/resume"
    description: "PAUSED -> ACTIVE"
    roles: [ClientOps]
    code: 200
    input: []
    output: Subscriber
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/subscribers/{id}/churn"
    description: "ACTIVE|PAUSED -> CHURNED (terminal)"
    roles: [ClientOps]
    code: 200
    input: [reason]
    output: Subscriber
    side_effects: ["status -> CHURNED; churned_at := clock; QUEUED shipments kept"]

  - method: GET
    path: "/subscribers/{id}/shipments"
    description: "List shipments of a subscriber"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, CustomerService]
    code: 200
    input: ['fulfill_status?']
    output: Shipment[]
    side_effects: []

  # --- AssemblyRun ---
  - method: POST
    path: "/assembly-runs"
    description: "Create a DRAFT run for a plan+period"
    roles: [WarehouseOps]
    code: 201
    input: [plan_id, period]
    output: AssemblyRun
    side_effects: ["ERR_RUN_PERIOD_CONFLICT when a non-CANCELLED run exists for (plan_id, period)"]

  - method: GET
    path: "/assembly-runs/{id}"
    description: "Read a run"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, BillingAdmin]
    code: 200
    input: []
    output: AssemblyRun
    side_effects: []

  - method: GET
    path: "/assembly-runs/{id}/shipments"
    description: "List shipments of a run"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, CustomerService]
    code: 200
    input: ['fulfill_status?', 'label_status?']
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/assembly-runs/{id}/inventory-events"
    description: "List inventory events tagged with this run (created_at ASC)"
    roles: [PlatformAdmin, ClientOps, WarehouseOps]
    code: 200
    input: ['event_type?']
    output: InventoryEvent[]
    side_effects: []

  - method: POST
    path: "/assembly-runs/{id}/lock"
    description: "DRAFT -> LOCKED: snapshot subscribers, create QUEUED shipments, reserve components per active BOM"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: AssemblyRun
    side_effects: ["subscriber_snapshot", "run_estimate + credit gate", "RESERVE events + reserved_units", "stock_status recompute", "find-or-create PROVISIONAL BillingStatement for (client, period) + provisional recompute"]

  - method: POST
    path: "/assembly-runs/{id}/start-kitting"
    description: "LOCKED -> KITTING"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: AssemblyRun
    side_effects: []

  - method: POST
    path: "/assembly-runs/{id}/complete-kitting"
    description: "KITTING -> KITTED: commit consumed inventory, release excess reservation, cancel excess QUEUED shipments"
    roles: [WarehouseOps]
    code: 200
    input: [actual_kitted_count]
    output: AssemblyRun
    side_effects: ["COMMIT events (delta-aware after rework)", "RELEASE excess", "excess_shipment_selection", "stock_status recompute"]

  - method: POST
    path: "/assembly-runs/{id}/rework"
    description: "KITTED -> KITTING (rework loop; committed inventory stays committed)"
    roles: [WarehouseOps]
    code: 200
    input: [note]
    output: AssemblyRun
    side_effects: []

  - method: POST
    path: "/assembly-runs/{id}/close"
    description: "KITTED -> CLOSED: administratively close a run whose shipments are all settled (SHIPPED or beyond, or CANCELLED)"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: AssemblyRun
    side_effects: ["ERR_RUN_HAS_OPEN_SHIPMENTS when any shipment is QUEUED/STAGED/ASSIGNED/MANIFESTED"]

  - method: POST
    path: "/assembly-runs/{id}/cancel"
    description: "DRAFT|LOCKED -> CANCELLED: release all remaining reservations, cancel QUEUED shipments"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: AssemblyRun
    side_effects: ["RELEASE events for remaining reservation", "QUEUED shipments -> CANCELLED", "stock_status recompute"]

  # --- ShippingWave / labels ---
  - method: POST
    path: "/shipping-waves"
    description: "Schedule a wave; same-carrier windows may not overlap and must keep a >= 30 minute gap"
    roles: [WarehouseOps]
    code: 201
    input: [carrier, service_level, pickup_start, pickup_end]
    output: ShippingWave
    side_effects: ["ERR_INVALID_WINDOW when pickup_end <= pickup_start", "ERR_WAVE_WINDOW_CONFLICT on overlap or gap < 30 min vs non-CANCELLED same-carrier waves"]

  - method: GET
    path: "/shipping-waves/{id}"
    description: "Read a wave"
    roles: [PlatformAdmin, ClientOps, WarehouseOps]
    code: 200
    input: []
    output: ShippingWave
    side_effects: []

  - method: GET
    path: "/shipping-waves/{id}/shipments"
    description: "List shipments currently linked to the wave"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, CustomerService]
    code: 200
    input: ['fulfill_status?']
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/shipping-waves/{id}/assign-shipments"
    description: "Assign STAGED shipments to a SCHEDULED wave (bulk; any ineligible shipment rejects the whole call)"
    roles: [WarehouseOps]
    code: 200
    input: [shipment_ids]
    output: ShippingWave
    side_effects: ["each shipment STAGED -> ASSIGNED, wave_id set; assigned_count recomputed"]

  - method: POST
    path: "/shipping-waves/{id}/manifest"
    description: "SCHEDULED -> MANIFESTED: purchase a label per assigned shipment (shipment_postage)"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: ShippingWave
    side_effects: ["ERR_WAVE_EMPTY when assigned_count == 0", "per shipment: postage computed, label PURCHASED, tracking minted", "statement provisional postage recompute"]

  - method: POST
    path: "/shipping-waves/{id}/tender"
    description: "MANIFESTED -> TENDERED: hand to carrier"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: ShippingWave
    side_effects: ["MANIFESTED shipments -> SHIPPED"]

  - method: POST
    path: "/shipping-waves/{id}/cancel"
    description: "SCHEDULED|MANIFESTED -> CANCELLED: revert shipments to STAGED, void purchased labels"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: ShippingWave
    side_effects: ["shipments revert per Shipment machine", "labels PURCHASED -> VOIDED", "statement provisional postage recompute"]

  # --- Shipment ---
  - method: GET
    path: "/shipments/{id}"
    description: "Read a shipment"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, CustomerService]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: POST
    path: "/shipments/{id}/cancel"
    description: "QUEUED|STAGED -> CANCELLED: abandon an unshipped box (committed stock is written off)"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: Shipment
    side_effects: ["fulfill_status -> CANCELLED (ERR_INVALID_STATE from any other fulfill_status)"]

  - method: POST
    path: "/shipments/{id}/void-label"
    description: "Void a purchased label while the shipment is still MANIFESTED (parallel label dimension)"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: Shipment
    side_effects: ["label_status PURCHASED -> VOIDED (ERR_LABEL_NOT_VOIDABLE otherwise)", "statement provisional postage recompute"]

  - method: POST
    path: "/shipments/{id}/scan"
    description: "Carrier scan: SHIPPED -> DELIVERED | RETURNED"
    roles: [WarehouseOps]
    code: 200
    input: [scan_type]
    output: Shipment
    side_effects: ["scan_type DELIVERED sets delivered_at := clock"]

  # --- ReturnCase ---
  - method: POST
    path: "/return-cases"
    description: "Open a return/replacement case against a shipment"
    roles: [CustomerService]
    code: 201
    input: [shipment_id, reason, requested_resolution]
    output: ReturnCase
    side_effects: ["status = REQUESTED"]

  - method: GET
    path: "/return-cases"
    description: "List/filter return cases"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, CustomerService]
    code: 200
    input: ['shipment_id?', 'replacement_shipment_id?', 'status?']
    output: ReturnCase[]
    side_effects: []

  - method: GET
    path: "/return-cases/{id}"
    description: "Read a return case"
    roles: [PlatformAdmin, ClientOps, WarehouseOps, CustomerService]
    code: 200
    input: []
    output: ReturnCase
    side_effects: []

  - method: POST
    path: "/return-cases/{id}/approve"
    description: "REQUESTED -> APPROVED (shipment DELIVERED, within 30-day window)"
    roles: [CustomerService]
    code: 200
    input: []
    output: ReturnCase
    side_effects: []

  - method: POST
    path: "/return-cases/{id}/reject"
    description: "REQUESTED -> REJECTED"
    roles: [CustomerService]
    code: 200
    input: ['note?']
    output: ReturnCase
    side_effects: []

  - method: POST
    path: "/return-cases/{id}/receive"
    description: "APPROVED -> RECEIVED (physical return arrived at warehouse)"
    roles: [WarehouseOps]
    code: 200
    input: []
    output: ReturnCase
    side_effects: []

  - method: POST
    path: "/return-cases/{id}/resolve"
    description: "RECEIVED -> RESOLVED: REPLACE ships a free replacement (consumes BOM stock); REFUND credits the period statement"
    roles: [CustomerService]
    code: 200
    input: []
    output: ReturnCase
    side_effects: ["REPLACE: replacement shipment + COMMIT events", "REFUND: credit_cents = price_per_box_cents, statement refund_credit_cents += credit_cents"]

  # --- BillingStatement ---
  - method: GET
    path: "/billing-statements/{id}"
    description: "Read a statement"
    roles: [PlatformAdmin, ClientOps, BillingAdmin]
    code: 200
    input: []
    output: BillingStatement
    side_effects: []

  - method: POST
    path: "/billing-statements/{id}/finalize"
    description: "PROVISIONAL -> FINALIZED: final variant recompute + wallet debit"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: BillingStatement
    side_effects: ["statement_net_amount final variant", "credit_balance_cents -= net_cents"]

  - method: POST
    path: "/billing-statements/{id}/dispute"
    description: "FINALIZED -> DISPUTED: wallet credited back in full while disputed"
    roles: [ClientOps]
    code: 200
    input: []
    output: BillingStatement
    side_effects: ["credit_balance_cents += net_cents"]

  - method: POST
    path: "/billing-statements/{id}/resolve-dispute"
    description: "DISPUTED -> FINALIZED with goodwill adjustment"
    roles: [BillingAdmin]
    code: 200
    input: [adjustment_credit_cents]
    output: BillingStatement
    side_effects: ["net_cents -= adjustment_credit_cents", "credit_balance_cents -= net_cents"]

  - method: POST
    path: "/billing-statements/{id}/mark-paid"
    description: "FINALIZED -> PAID (external payment acknowledged; wallet untouched)"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: BillingStatement
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on endpoint, or entity_backed ClientOps acting on another client's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body foreign key does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload: missing required field, wrong type, bad enum, clock regression on set_current_utc" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target entity not in a valid from-state for the requested transition (generic)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "BoxPlan.sku or Component.sku already in use" }
  - { id: ERR_PLAN_NOT_ACTIVE, http: 409, condition: "Run lock or revision approve requires BoxPlan.status ACTIVE (or DRAFT for approve); plan is otherwise" }
  - { id: ERR_PLAN_HAS_NO_APPROVED_REVISION, http: 409, condition: "Plan activate/lock attempted with active_revision_id null" }
  - { id: ERR_PLAN_HAS_OPEN_RUNS, http: 409, condition: "Plan retire attempted while a run is LOCKED, KITTING, or KITTED" }
  - { id: ERR_REVISION_EMPTY_BOM, http: 409, condition: "Approve attempted on a revision with zero BOM lines" }
  - { id: ERR_IMPORT_ALREADY_COMMITTED, http: 409, condition: "Commit attempted on a batch already COMMITTED" }
  - { id: ERR_RUN_PERIOD_CONFLICT, http: 409, condition: "A non-CANCELLED run already exists for (plan_id, period)" }
  - { id: ERR_RUN_EMPTY, http: 409, condition: "Lock attempted with zero ACTIVE subscribers" }
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "quantity/actual_kitted_count/adjustment_credit_cents outside its declared range" }
  - { id: ERR_KIT_COUNT_MISMATCH, http: 409, condition: "actual_kitted_count > planned_box_count" }
  - { id: ERR_REWORK_REGRESS, http: 409, condition: "Re-completion after rework with actual_kitted_count < previous kitted_box_count" }
  - { id: ERR_RUN_HAS_COMMITTED_SHIPMENTS, http: 409, condition: "Rework attempted while shipments are ASSIGNED/MANIFESTED/SHIPPED/DELIVERED/RETURNED" }
  - { id: ERR_RUN_HAS_OPEN_SHIPMENTS, http: 409, condition: "Close attempted while shipments are QUEUED/STAGED/ASSIGNED/MANIFESTED" }
  - { id: ERR_COMPONENT_SHORTAGE, http: 409, condition: "Component.available_units below required units at run lock or resolve(REPLACE)" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 409, condition: "Client.credit_balance_cents below estimate at lock or below final net at finalize" }
  - { id: ERR_INVALID_WINDOW, http: 400, condition: "pickup_end <= pickup_start (malformed interval beats any overlap finding)" }
  - { id: ERR_WAVE_WINDOW_CONFLICT, http: 409, condition: "Same-carrier pickup windows overlap (half-open) or gap < 30 minutes against a non-CANCELLED wave" }
  - { id: ERR_WAVE_EMPTY, http: 409, condition: "Manifest attempted with assigned_count == 0" }
  - { id: ERR_LABEL_NOT_VOIDABLE, http: 409, condition: "void-label attempted when label_status != PURCHASED or fulfill_status != MANIFESTED" }
  - { id: ERR_SHIPMENT_NOT_DELIVERED, http: 409, condition: "Return approve attempted on a shipment whose fulfill_status != DELIVERED" }
  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 409, condition: "Return approve after delivered_at + 30 days" }
  - { id: ERR_STATEMENT_PERIOD_OPEN, http: 409, condition: "Finalize attempted before the period has ended" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; superset read access, owns client onboarding, wallet top-ups, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /clients/{id}/credit-adjustments (with BillingAdmin)"
      - "All GET endpoints (with the resource-owning roles)"

  - name: ClientOps
    description: "Brand-side operator; manages own plans, BOM revisions, subscriber imports, pause/resume/churn, disputes own statements"
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /box-plans (client_id must equal X-User-ID)"
      - "POST /box-plans/{id}/activate, /retire, /kit-revisions"
      - "POST /kit-revisions/{id}/approve, PUT /kit-revisions/{id}/bom-lines"
      - "POST /box-plans/{id}/import-batches, POST /import-batches/{id}/commit"
      - "POST /subscribers/{id}/pause, /resume, /churn"
      - "POST /billing-statements/{id}/dispute (own client only)"
    shared_operations:
      - "GET on own client's plans, subscribers, shipments, runs, statements, reports"

  - name: WarehouseOps
    description: "Fulfillment-center operator; owns components, stock receipts, assembly runs, waves, labels, scans, and return receiving"
    identity: opaque
    exclusive_operations:
      - "POST /components, POST /components/{id}/receipts"
      - "POST /assembly-runs and all /assembly-runs/{id}/* actions"
      - "POST /shipping-waves and all /shipping-waves/{id}/* actions"
      - "POST /shipments/{id}/void-label, /scan, /cancel"
      - "POST /return-cases/{id}/receive"
    shared_operations:
      - "GET on plans, revisions, BOM lines, components, subscribers, shipments, runs, waves, return cases, reports"

  - name: BillingAdmin
    description: "Finance operator; owns statement lifecycle (finalize, resolve-dispute, mark-paid) and wallet adjustments"
    identity: opaque
    exclusive_operations:
      - "POST /billing-statements/{id}/finalize, /resolve-dispute, /mark-paid"
    shared_operations:
      - "POST /clients/{id}/credit-adjustments (with PlatformAdmin)"
      - "GET on clients, plans, components, runs, statements"

  - name: CustomerService
    description: "Support agent; opens and adjudicates return cases"
    identity: opaque
    exclusive_operations:
      - "POST /return-cases"
      - "POST /return-cases/{id}/approve, /reject, /resolve"
    shared_operations:
      - "GET on plans, subscribers, shipments, waves, return cases"
