              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
            - call: "POST /inspections/${ins_id}/start"
              payload: {}
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: { result: "CONDITIONAL", deficiencies: [ { code: "MIN-Q", severity: "MINOR", description: "phone dead" } ] }
              as: LicensedInspector
              as_user_id: "${insp_id}"
            - call: "GET /deficiencies?inspection_id=${ins_id}"
              payload: { inspection_id: "${ins_id}" }
              as: Registrar
              captures: { def_id: "$.data[0].id" }
            - call: "POST /citations"
              payload: { deficiency_id: "${def_id}" }
              as: Registrar
              captures: { cit_id: "$.data.id", surch: "$.data.surcharged_amount_cents" }
            - call: "POST /citations/${cit_id}/contest"
              payload: {}
              as: BuildingOwner
              as_user_id: "${owner_id}"
          trigger:
            - call: "POST /citations/${cit_id}/resolve-contest"
              payload: { outcome: "DISMISSED" }
              as: SafetyAdministrator
          assert:
            - "surch captured at issuance == 8044 (round_half_up(7500*1.0725))"
            - "Device.${dev_id}.outstanding_balance_cents == 0 (restored to pre-issuance value)"
            - "Citation.${cit_id}.status == DISMISSED"
            - "Deficiency.${def_id}.status == WAIVED"

      - name: assignment_count_conserved_on_cancel
        grounds:
          - "entities.Inspector.fields.active_assignment_count"
          - "state_machines.Inspection.SCHEDULED_to_ASSIGNED"
          - "state_machines.Inspection.ASSIGNED_to_CANCELLED"
        distinguishing_aspect: "Conserved quantity is Inspector.active_assignment_count (a count): assign increments +1 and cancelling that ASSIGNED inspection decrements -1, returning the count to its prior value 0 — a cardinality invariant distinct from the monetary outstanding-balance invariant."
        test_recipe:
          setup:
            - "An inspector with active_assignment_count 0 is assigned one PASSENGER inspection (count 1)."
          setup_api_calls:
            - call: "POST /owners"
              payload: { name: "Romeo Co", contact_email: "r@x.com" }
              as: Registrar
              captures: { owner_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { name: "Ro Insp", license_number: "L-18", license_expiry_period: 999, certified_categories: ["PASSENGER_ELEVATOR"] }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /devices"
              payload: { owner_id: "${owner_id}", category: "PASSENGER_ELEVATOR", location_description: "R-7", install_period: 0 }
              as: Registrar
              captures: { dev_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { device_id: "${dev_id}", type: "ANNUAL", scheduled_start_period: 1, scheduled_end_period: 2 }
              as: Registrar
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/assign"
              payload: { assigned_inspector_id: "${insp_id}" }
              as: Registrar
          trigger:
            - call: "POST /inspections/${ins_id}/cancel"
              payload: {}
              as: Registrar
          assert:
            - "Inspector.${insp_id}.active_assignment_count == 0 (restored after assign+cancel)"
            - "Inspection.${ins_id}.status == CANCELLED"
            - "Inspection.${ins_id}.assigned_inspector_id == null"

