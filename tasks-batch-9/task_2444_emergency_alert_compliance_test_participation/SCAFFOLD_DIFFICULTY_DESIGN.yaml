# =============================================================================
# §1.8 Scaffold Difficulty Design — task_2444_emergency_alert_compliance_test_participation
#
# Derived entirely from this task's SCAFFOLD.yaml (§1.0-§1.7). Every endpoint,
# payload key, role, entity field, error id and constant referenced below is
# declared there. Every numeric literal in an `assert:` was computed from the
# §1.3 formulas with Decimal / ROUND_HALF_UP arithmetic and the §1.5 logical
# clock (startup default 2026-08-01T00:00:00Z).
#
# Fixture conventions used throughout:
#   roles / user ids : ComplianceAdmin=adm-1, StationEngineer=eng-1,
#                      CertifyingOfficer=cert-1, FieldInspector=insp-1
#   plan             : state_code KS, plan_version_label 2026-R1 / 2026-R2
#   station          : call_sign KWEA (KDUO = dual-role station for
#                      ERR_SEGREGATION_OF_DUTIES), service_type TV
#   device           : model_code DASDEC-3, device_role DECODER, firmware 5.2.1
#   sources          : WXPEP / WXNWS / WXSAT / WXLP1 / WXLP2
#   unresolvable id  : 00000000-0000-4000-8000-000000000000
#   OCC              : expected_station_version / expected_test_event_version are
#                      ALWAYS taken from a GET issued immediately before the
#                      write, because almost every write is a Station recompute
#                      event and therefore bumps Station.version.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: outage_downtime_variants_diverge_on_breach_verdict
        grounds:
          - "§1.3 calculations.outage_downtime_hours, variants CONTINUOUS_CLOCK and OBLIGATION_CLOCK"
          - "§1.3 constants CONTINUOUS_BREACH_HOURS=60, REPAIR_DEADLINE_HOURS=48, OBLIGATION_WINDOW_START_HOUR=8, OBLIGATION_WINDOW_END_HOUR=20"
          - "§1.1 EquipmentOutage.continuous_downtime_hours / obligation_downtime_hours / continuous_clock_breached / obligation_breached"
          - "§1.5 POST /equipment-outages/{id}/restore"
        distinguishing_aspect: "The two variants are not a scaling of one another: over detected_at 2026-08-03T08:00:00Z -> restored_at 2026-08-06T20:00:00Z the CONTINUOUS_CLOCK yields 84.00 h and breaches its 60 h limit while the OBLIGATION_CLOCK yields exactly 48.00 h and does NOT breach its 48 h limit (strict `>`), so the two variants return opposite booleans from one identical timestamp pair."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring PEP and NWS, activated; station KWEA registered under it."
            - "One device dev1 readiness-checked to READY; both required sources assigned to dev1, so the station sits at accessible_source_count=2 and compliance_score=100.00."
            - "Clock moved back to 2026-08-03T08:00:00Z, outage filed with detected_at exactly at the obligation-window open, repair started, clock advanced to 2026-08-06T20:00:00Z (the obligation-window close on day 4)."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP", "NWS"], mandatory_relay_event_codes: ["EAN"] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv2: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "NWS", source_call_sign: "WXNWS", expected_station_version: "${sv2}" }
              captures: { ma2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
            - call: "POST /equipment-outages"
              as: StationEngineer
              as_user_id: eng-1
              payload: { device_id: "${dev1}", detected_at: "2026-08-03T08:00:00Z", failure_summary: "decoder RF front end dead" }
              captures: { outage_id: "$.data.id" }
            - call: "POST /equipment-outages/${outage_id}/start-repair"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-06T20:00:00Z" }
          trigger:
            - call: "POST /equipment-outages/${outage_id}/restore"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "GET /stations/${station_id}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "restore returns 200 with status == RESTORED and restored_at == 2026-08-06T20:00:00Z"
            - "CONTINUOUS_CLOCK variant: continuous_downtime_hours == 84.00 ((2026-08-06T20:00Z - 2026-08-03T08:00Z) = 302400 s / 3600)"
            - "continuous_clock_breached == true (84.00 > CONTINUOUS_BREACH_HOURS 60)"
            - "OBLIGATION_CLOCK variant: obligation_downtime_hours == 48.00 (day 08-03 12.00 h from 08:00 to 20:00, days 08-04 and 08-05 12.00 h each, day 08-06 12.00 h from 08:00 to the 20:00 restore = 48.00 h total)"
            - "obligation_breached == false — the comparison is strict `>` against REPAIR_DEADLINE_HOURS 48, so exactly 48.00 does not breach"
            - "the two variants therefore disagree: continuous_clock_breached != obligation_breached on the same detected_at/restored_at pair"
            - "GET /stations/${station_id} still reports compliance_score == 50.00, compliance_posture == SUSPENDED_FILINGS and accessible_source_count == 0 — the value written when POST /equipment-outages ran hop 1-4; restore is NOT in §1.2 state_machines.Station.recompute_events, so the station score is untouched by the restore"

      - name: station_score_variant_flips_provisional_to_certified_on_filing_accept
        grounds:
          - "§1.3 calculations.station_compliance_score, variants PROVISIONAL and CERTIFIED, certified_eligible clause"
          - "§1.3 constants BASE_SCORE=100.00, COMPLIANT_MIN_SCORE=90.00, CERTIFICATION_WINDOW_DAYS=365"
          - "§1.3 calculations.filing_penalty_points (penalty_points 0.94 feeds d6)"
          - "§1.5 POST /filing-records/{id}/accept side effect 'Station recompute event (variant may flip PROVISIONAL -> CERTIFIED)'"
        distinguishing_aspect: "Accepting the filing changes NO station input field, yet the score moves 100.00 -> 99.06 and compliance_variant_applied moves PROVISIONAL -> CERTIFIED, because d6 = penalty_points_total 0.94 is applied only by the CERTIFIED variant — proving variant selection, not data, drove the delta."
        test_recipe:
          setup:
            - "Plan KS 2026-R1 requiring only PEP so a single RECEIPT line satisfies §1.4 priority 9 receipt coverage."
            - "Station KWEA with dev1 READY and one ACTIVE PEP assignment -> accessible_source_count=1, missing_source_count=0."
            - "TestEvent te1 WEEKLY [2026-08-12T00:00Z, 2026-08-12T01:00Z) -> filing_deadline_at 2026-08-17T01:00:00Z; evaluated READY at 2026-08-12T00:30Z (readiness 80.00), one TRANSMISSION and one RECEIPT line appended, logging closed."
            - "Clock moved to 2026-08-17T02:00:00Z so the filing is late_days=1 and penalty_points=0.94; the filing itself leaves the variant PROVISIONAL because status is SUBMITTED, not ACCEPTED."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: ["EAN"] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { te1: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T00:30:00Z" }
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "TRANSMISSION" }
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "RECEIPT", source_call_sign: "WXPEP" }
            - call: "POST /test-events/${te1}/close-logging"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-17T02:00:00Z" }
            - call: "GET /test-events/${te1}"
              as: CertifyingOfficer
              as_user_id: cert-1
              captures: { te1_v: "$.data.version" }
            - call: "POST /filing-records"
              as: CertifyingOfficer
              as_user_id: cert-1
              payload: { test_event_id: "${te1}", expected_test_event_version: "${te1_v}", attestation_note: "weekly test filed one day late" }
              captures: { filing1: "$.data.id" }
            - call: "GET /stations/${station_id}"
              as: ComplianceAdmin
              as_user_id: adm-1
              captures: { score_before: "$.data.compliance_score", variant_before: "$.data.compliance_variant_applied" }
          trigger:
            - call: "POST /filing-records/${filing1}/accept"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "GET /stations/${station_id}/compliance-summary"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "pre-trigger capture: ${score_before} == 100.00 and ${variant_before} == 'PROVISIONAL' — penalty_points_total was already 0.94 but the PROVISIONAL variant does not apply d6"
            - "accept returns 200 with status == ACCEPTED"
            - "GET /stations/{id}/compliance-summary now reports compliance_variant_applied == 'CERTIFIED' (certified_eligible: one ACCEPTED filing with filed_at 2026-08-17T02:00:00Z inside [now - 365 d, now])"
            - "compliance_score == 99.06 == round(100.00 - 0 - 0 - 0 - 0 - d5 0 - d6 0.94, 2)"
            - "compliance_posture == 'COMPLIANT' (99.06 >= COMPLIANT_MIN_SCORE 90.00)"
            - "penalty_points_total == 0.94 and unfiled_test_count == 0 in the summary, i.e. the 0.94 delta is exactly d6"

      - name: certified_variant_adds_unfiled_and_penalty_deductions_dropping_a_posture_band
        grounds:
          - "§1.3 calculations.station_compliance_score: d5 = unfiled_test_count * UNFILED_TEST_DEDUCTION 20.00 and d6 = penalty_points_total, both CERTIFIED-only"
          - "§1.3 station_compliance_score pinned phase order (phase 2 unfiled sweep feeds d5, phase 4 scores)"
          - "§1.2 state_machines.TestEvent {READY, LOGGED} -> FAILED_UNFILED sweep"
          - "§1.5 POST /stations/{id}/run-log-review"
        distinguishing_aspect: "With the CERTIFIED variant latched, one READY test event that blew its filing deadline is swept to FAILED_UNFILED inside the same run-log-review call and its d5=20.00 is applied in phase 4 of that same request, taking the station 99.06 -> 79.06 (COMPLIANT -> WATCH); under PROVISIONAL the identical sweep would have left the score at 100.00."
        test_recipe:
          setup:
            - "Everything from station_score_variant_flips_provisional_to_certified_on_filing_accept, i.e. te1 FILED then ACCEPTED so the station is CERTIFIED at 99.06."
            - "A second test event te2 WEEKLY [2026-08-13T00:00Z, 2026-08-13T01:00Z) (disjoint from te1's half-open window) is evaluated to READY at 2026-08-13T00:30Z and then abandoned; its filing_deadline_at is 2026-08-18T01:00:00Z."
            - "run-log-review is fired at 2026-08-19T00:00:00Z: past te2's deadline but still inside SILENCE_MAX_DAYS 8 of the PEP assignment's last_receipt_at 2026-08-12T00:30:00Z, so phase 1 flags nothing and d2 stays 0."
          setup_api_calls:
            - call: "POST /state-plans"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_code: "KS", plan_version_label: "2026-R1", required_source_types: ["PEP"], mandatory_relay_event_codes: ["EAN"] }
              captures: { plan_id: "$.data.id" }
            - call: "POST /state-plans/${plan_id}/activate"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /stations"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { state_plan_id: "${plan_id}", call_sign: "KWEA", service_type: "TV", engineer_user_ids: ["eng-1"], certification_officer_user_id: "cert-1" }
              captures: { station_id: "$.data.id" }
            - call: "POST /eas-devices"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", model_code: "DASDEC-3", device_role: "DECODER", firmware_version: "5.2.1" }
              captures: { dev1: "$.data.id" }
            - call: "POST /eas-devices/${dev1}/readiness-check"
              as: StationEngineer
              as_user_id: eng-1
              payload: { self_test_passed: true, firmware_current: true }
            - call: "GET /stations/${station_id}"
              as: StationEngineer
              as_user_id: eng-1
              captures: { sv1: "$.data.version" }
            - call: "POST /monitoring-assignments"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", device_id: "${dev1}", source_type: "PEP", source_call_sign: "WXPEP", expected_station_version: "${sv1}" }
              captures: { ma1: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "WEEKLY", window_start_at: "2026-08-12T00:00:00Z", window_end_at: "2026-08-12T01:00:00Z" }
              captures: { te1: "$.data.id" }
            - call: "POST /test-events"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { station_id: "${station_id}", test_type: "WEEKLY", window_start_at: "2026-08-13T00:00:00Z", window_end_at: "2026-08-13T01:00:00Z" }
              captures: { te2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-12T00:30:00Z" }
            - call: "POST /test-events/${te1}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "TRANSMISSION" }
            - call: "POST /test-log-entries"
              as: StationEngineer
              as_user_id: eng-1
              payload: { test_event_id: "${te1}", device_id: "${dev1}", entry_kind: "RECEIPT", source_call_sign: "WXPEP" }
            - call: "POST /test-events/${te1}/close-logging"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-13T00:30:00Z" }
            - call: "POST /test-events/${te2}/evaluate-readiness"
              as: StationEngineer
              as_user_id: eng-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-17T02:00:00Z" }
            - call: "GET /test-events/${te1}"
              as: CertifyingOfficer
              as_user_id: cert-1
              captures: { te1_v: "$.data.version" }
            - call: "POST /filing-records"
              as: CertifyingOfficer
              as_user_id: cert-1
              payload: { test_event_id: "${te1}", expected_test_event_version: "${te1_v}", attestation_note: "weekly test filed one day late" }
              captures: { filing1: "$.data.id" }
            - call: "POST /filing-records/${filing1}/accept"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: {}
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-19T00:00:00Z" }
