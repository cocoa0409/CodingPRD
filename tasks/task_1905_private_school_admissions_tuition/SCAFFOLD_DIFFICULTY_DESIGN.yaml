            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
          trigger:
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evt: $.data.id } }
          assert:
            - "While DRAFT: captured error_id == ERR_APPLICATION_NOT_SUBMITTED (HTTP 409)"
            - "After submit: identical payload returns 201 and EntranceEvaluation.${evt}.status == SCHEDULED"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: interviewer_half_open_overlap_rules
        grounds:
          - errors[ERR_INTERVIEWER_SCHEDULE_CONFLICT]
          - entities.EntranceEvaluation.fields.interviewer_id
        distinguishing_aspect: |
          Half-open interval semantics on the interviewer-calendar resource:
          [10:00,11:00) then [11:00,12:00) are adjacent and BOTH allowed (end == start
          touches without overlapping), while [10:30,11:30) intersects the first booking
          and is rejected. Distinct interval semantics from the aggregate-capacity
          session instance.
        test_recipe:
          setup:
            - "OPEN cycle, G9 section; three SUBMITTED applications fam-a, fam-b, fam-c"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 10, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { aplA: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplA}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { appA: $.data.id } }
            - { call: "POST /admissions/applications/${appA}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-b", first_name: "Ben", last_name: "Bell", date_of_birth: "2013-06-01" }, as: Parent, as_user_id: "fam-b", captures: { aplB: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplB}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-b", captures: { appB: $.data.id } }
            - { call: "POST /admissions/applications/${appB}/submit", payload: {}, as: Parent, as_user_id: "fam-b" }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-c", first_name: "Cat", last_name: "Cole", date_of_birth: "2013-07-01" }, as: Parent, as_user_id: "fam-c", captures: { aplC: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplC}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-c", captures: { appC: $.data.id } }
            - { call: "POST /admissions/applications/${appC}/submit", payload: {}, as: Parent, as_user_id: "fam-c" }
          trigger:
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appA}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-7" }, as: AdmissionOfficer, captures: { evA: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appB}", kind: "INTERVIEW", scheduled_start: "2026-10-12T11:00:00Z", scheduled_end: "2026-10-12T12:00:00Z", interviewer_id: "int-7" }, as: AdmissionOfficer, captures: { evB: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appC}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:30:00Z", scheduled_end: "2026-10-12T11:30:00Z", interviewer_id: "int-7" }, as: AdmissionOfficer, captures: { err: $.data.error_id } }
          assert:
            - "First two bookings return 201: [10:00,11:00) and [11:00,12:00) merely touch (adjacency is NOT an overlap under half-open semantics)"
            - "Third booking fails: captured error_id == ERR_INTERVIEWER_SCHEDULE_CONFLICT (HTTP 409) — [10:30,11:30) intersects both existing bookings"
            - "A different interviewer at 10:30-11:30 would succeed (resource is the interviewer, not the clock window)"

      - name: test_session_aggregate_capacity_overlap
        grounds:
          - errors[ERR_TEST_SESSION_FULL]
          - entities.TestSession.fields.room_capacity
          - entities.EntranceEvaluation.fields.test_session_id
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on the TestSession resource (distinct
          from the half-open pairwise geometry of the interviewer instance): two TEST
          evaluations FULLY overlapping in time (both 09:00-10:00) are both accepted
          because only the count matters; the rejection fires purely when booked_count
          reaches room_capacity, regardless of times.
        test_recipe:
          setup:
            - "OPEN cycle, G9 section; session 2026-10-10 09:00-12:00 room_capacity 2; three SUBMITTED applications"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 10, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 2 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { aplA: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplA}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { appA: $.data.id } }
            - { call: "POST /admissions/applications/${appA}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-b", first_name: "Ben", last_name: "Bell", date_of_birth: "2013-06-01" }, as: Parent, as_user_id: "fam-b", captures: { aplB: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplB}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-b", captures: { appB: $.data.id } }
            - { call: "POST /admissions/applications/${appB}/submit", payload: {}, as: Parent, as_user_id: "fam-b" }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-c", first_name: "Cat", last_name: "Cole", date_of_birth: "2013-07-01" }, as: Parent, as_user_id: "fam-c", captures: { aplC: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${aplC}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-c", captures: { appC: $.data.id } }
            - { call: "POST /admissions/applications/${appC}/submit", payload: {}, as: Parent, as_user_id: "fam-c" }
          trigger:
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appA}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evA: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appB}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evB: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${appC}", kind: "TEST", scheduled_start: "2026-10-10T10:00:00Z", scheduled_end: "2026-10-10T11:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { err: $.data.error_id } }
          assert:
            - "Both fully-overlapping 09:00-10:00 bookings return 201 (interval geometry is irrelevant under aggregate capacity)"
            - "Third booking fails: captured error_id == ERR_TEST_SESSION_FULL (HTTP 409) even though its 10:00-11:00 window overlaps nothing pairwise-blocked"
            - "TestSession.${tss}.booked_count == 2"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: aid_commit_release_conserves_budget
        grounds:
          - entities.AdmissionCycle.fields.aid_committed_cents
          - state_machines.AidApplication.award_status.OFFERED_to_ACCEPTED
          - state_machines.AidApplication.award_status.ACCEPTED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: aid budget cents. Invariant: cycle.aid_committed_cents ==
          SUM(final_award_cents over ACCEPTED aid applications). The forward action
          (accept: +1,820,000) paired with its compensating action (contract lapse ->
          award release: -1,820,000) returns the committed total to exactly 0.
          Distinct quantity from the seat-count instance.
        test_recipe:
          setup:
            - "OPEN cycle budget 18,050,000; fam-a EARLY application OFFERED after close; aid award 1,820,000 finalized; contract issued (response_due 2026-11-16)"
            - "Baseline: cycle aid_committed_cents == 0 before acceptance"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 1, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/aid-applications", payload: { application_id: "${app}", reported_annual_income_cents: 12000000, household_size: 4 }, as: Parent, as_user_id: "fam-a", captures: { aid: $.data.id } }
            - { call: "POST /admissions/aid-applications/${aid}/verify", payload: { verified_annual_income_cents: 12000000 }, as: FinancialAidOfficer, as_user_id: "fao-1" }
            - { call: "POST /admissions/aid-applications/${aid}/finalize-award", payload: {}, as: FinancialAidOfficer, as_user_id: "fao-2" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evt: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-a" }, as: AdmissionOfficer, captures: { evi: $.data.id } }
            - { call: "POST /admissions/evaluations/${evt}/score", payload: { score: 80 }, as: AdmissionOfficer }
            - { call: "POST /admissions/evaluations/${evi}/score", payload: { score: 90 }, as: AdmissionOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: AdmissionDirector }
            - { call: "POST /admissions/cycles/${cyc}/close-round", payload: { round: "EARLY" }, as: AdmissionDirector }
            - { call: "POST /admissions/aid-applications/${aid}/accept-award", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/applications/${app}/issue-contract", payload: {}, as: AdmissionOfficer, captures: { con: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-17T00:00:00Z" }, as: AdmissionDirector }
            - { call: "POST /admissions/cycles/${cyc}/run-sweep", payload: {}, as: AdmissionDirector }
          assert:
            - "Forward action: after accept, GET cycle aid_committed_cents == 1820000 == SUM(final_award_cents of ACCEPTED awards)"
            - "Compensating action: after the lapse sweep, AidApplication.${aid}.award_status == RELEASED and GET cycle aid_committed_cents == 0"
            - "No drift: 1,820,000 committed then 1,820,000 released — the invariant aid_committed_cents == SUM(ACCEPTED finals) holds at both observation points"

      - name: offer_decline_conserves_seats
        grounds:
          - entities.GradeSection.fields.seats_held
          - calculations.seat_ledger
          - state_machines.Application.OFFERED_to_DECLINED
        distinguishing_aspect: |
          Conserved quantity: grade-section seat count (distinct from aid budget cents).
          Invariant: seats_held == count of applications in {OFFERED, CONTRACT_ISSUED,
          ENROLLED}. The forward action (round-close offer: +1) paired with its
          compensating action (decline: -1) returns seats_held to exactly 0, and a
          subsequent sweep with an empty waitlist promotes nobody.
        test_recipe:
          setup:
            - "OPEN cycle, G9 section capacity 1 tuition 3,000,000; fam-a EARLY application composite 84.0; clock 2026-11-02, close EARLY -> OFFERED (seats_held == 1)"
          setup_api_calls:
            - { call: "POST /admissions/cycles", payload: { academic_year: "2027-2028", early_deadline_at: "2026-11-01T00:00:00Z", regular_deadline_at: "2027-01-15T00:00:00Z", reenroll_response_deadline_at: "2027-03-01T00:00:00Z", melt_deadline_at: "2027-08-01T00:00:00Z", aid_budget_total_cents: 18050000 }, as: AdmissionDirector, captures: { cyc: $.data.id } }
            - { call: "POST /admissions/grade-sections", payload: { cycle_id: "${cyc}", grade_level: "G9", capacity: 1, tuition_cents: 3000000, max_aid_seat_pct: 1.0 }, as: AdmissionDirector, captures: { sec: $.data.id } }
            - { call: "POST /admissions/cycles/${cyc}/open", payload: {}, as: AdmissionDirector }
            - { call: "POST /admissions/test-sessions", payload: { cycle_id: "${cyc}", session_start: "2026-10-10T09:00:00Z", session_end: "2026-10-10T12:00:00Z", room_capacity: 5 }, as: AdmissionDirector, captures: { tss: $.data.id } }
            - { call: "POST /admissions/applicants", payload: { family_id: "fam-a", first_name: "Ann", last_name: "Able", date_of_birth: "2013-05-01" }, as: Parent, as_user_id: "fam-a", captures: { apl: $.data.id } }
            - { call: "POST /admissions/applications", payload: { applicant_id: "${apl}", cycle_id: "${cyc}", grade_section_id: "${sec}", round: "EARLY" }, as: Parent, as_user_id: "fam-a", captures: { app: $.data.id } }
            - { call: "POST /admissions/applications/${app}/submit", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "TEST", scheduled_start: "2026-10-10T09:00:00Z", scheduled_end: "2026-10-10T10:00:00Z", test_session_id: "${tss}" }, as: AdmissionOfficer, captures: { evt: $.data.id } }
            - { call: "POST /admissions/evaluations", payload: { application_id: "${app}", kind: "INTERVIEW", scheduled_start: "2026-10-12T10:00:00Z", scheduled_end: "2026-10-12T11:00:00Z", interviewer_id: "int-a" }, as: AdmissionOfficer, captures: { evi: $.data.id } }
            - { call: "POST /admissions/evaluations/${evt}/score", payload: { score: 80 }, as: AdmissionOfficer }
            - { call: "POST /admissions/evaluations/${evi}/score", payload: { score: 90 }, as: AdmissionOfficer }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: AdmissionDirector }
            - { call: "POST /admissions/cycles/${cyc}/close-round", payload: { round: "EARLY" }, as: AdmissionDirector }
          trigger:
            - { call: "POST /admissions/applications/${app}/decline", payload: {}, as: Parent, as_user_id: "fam-a" }
            - { call: "POST /admissions/cycles/${cyc}/run-sweep", payload: {}, as: AdmissionDirector }
          assert:
            - "After close (forward action): GradeSection.${sec}.seats_held == 1 and seats_available == 0"
            - "After decline (compensating action): GradeSection.${sec}.seats_held == 0 and seats_available == 1 — the offer/decline pair conserves the ledger"
            - "After sweep: seats_held still == 0 and the sweep response promoted_application_ids == [] (empty candidate set -> no-op, no phantom seat consumption)"
