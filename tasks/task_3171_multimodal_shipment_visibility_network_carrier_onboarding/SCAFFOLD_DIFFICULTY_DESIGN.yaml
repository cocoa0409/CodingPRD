  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: facility_suspended_beats_window_overlap
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_FACILITY_NOT_ACTIVE
          - errors.ERR_APPOINTMENT_WINDOW_CONFLICT
        distinguishing_aspect: |
          Error-category pair (state, business_temporal): a booking that
          violates both the facility-ACTIVE state gate and the half-open
          window-overlap rule returns ERR_FACILITY_NOT_ACTIVE (priority 6)
          rather than ERR_APPOINTMENT_WINDOW_CONFLICT (priority 7) — and the
          OCC version is current, isolating the priority effect.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Facility ACTIVE with one SCHEDULED appointment [10:00, 11:00). Connection TESTING. Facility then SUSPENDED via PATCH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { carrier_name: "PrioCo", scac_code: "PRIC" }
              as: NetworkOps
              captures: { pv_car_id: $.data.id }
            - call: "POST /carriers/${pv_car_id}/connections"
              payload: { channel: "TMS", supported_modes: ["TRUCKLOAD"] }
              as: NetworkOps
              captures: { pv_conn_id: $.data.id }
            - call: "POST /connections/${pv_conn_id}/submit-credentials"
              payload: { credential_ref: "vault://pric" }
              as: CarrierRep
              as_user_id: "${pv_car_id}"
            - call: "POST /connections/${pv_conn_id}/begin-testing"
              payload: { testing_window_start: "2026-09-01T00:00:00Z", testing_window_end: "2026-09-10T00:00:00Z" }
              as: NetworkOps
            - call: "POST /shippers"
              payload: { company_name: "PrioShip" }
              as: PlatformAdmin
              captures: { pv_shp_id: $.data.id }
            - call: "POST /shippers/${pv_shp_id}/shipments"
              payload: { carrier_id: "${pv_car_id}", connection_id: "${pv_conn_id}", mode: "TRUCKLOAD", tracking_reference: "TRK-P", mode_reference: "PRO-P", destination_code: "DAL", planned_departure_at: "2026-09-01T00:00:00Z", planned_arrival_at: "2026-09-03T00:00:00Z" }
              as: ShipperRep
              as_user_id: "${pv_shp_id}"
              captures: { pv_ship_id: $.data.id }
            - call: "POST /facilities"
              payload: { facility_name: "Prio DC", facility_type: "DESTINATION" }
              as: PlatformAdmin
              captures: { pv_fac_id: $.data.id, pv_fac_v: $.data.version }
            - call: "POST /facilities/${pv_fac_id}/appointments"
              payload: { shipment_id: "${pv_ship_id}", window_start: "2026-09-01T10:00:00Z", window_end: "2026-09-01T11:00:00Z", expected_facility_version: "${pv_fac_v}" }
              as: CarrierRep
