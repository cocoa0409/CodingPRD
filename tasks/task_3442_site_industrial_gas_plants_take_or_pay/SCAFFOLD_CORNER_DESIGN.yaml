              payload: { name: "BlackCo", segment: "CHEMICAL", credit_standing: "PRIME", blackout_windows: [{ start_iso: "2027-03-10T00:00:00Z", end_iso: "2027-03-20T00:00:00Z" }] }
              as: PlatformAdmin
              captures: { c_bl: $.data.id }
            - call: "POST /gas-supply/supply-mode-evaluations"
