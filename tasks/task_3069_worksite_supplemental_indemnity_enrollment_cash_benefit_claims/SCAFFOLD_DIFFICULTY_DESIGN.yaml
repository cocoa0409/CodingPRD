            - { call: "POST /enrollment-campaigns", payload: { employer_group_id: "${g14}", counselor_id: "${c14}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", guaranteed_issue: true }, as: BenefitCounselor, captures: { cam14: $.data.id } }
            - { call: "POST /employer-groups/${g14}/suspend", payload: {}, as: CarrierAdmin }
          trigger:
            - { call: "POST /enrollment-campaigns/${cam14}/open", payload: {}, as: BenefitCounselor, captures: { err14: $.data.error_id } }
            - { call: "POST /employer-groups/${g14}/activate", payload: {}, as: CarrierAdmin }
            - { call: "POST /enrollment-campaigns/${cam14}/open", payload: {}, as: BenefitCounselor }
          assert:
            - "Open while group SUSPENDED fails: ${err14} == ERR_GROUP_INACTIVE; campaign remains DRAFT"
            - "After group reactivation the identical open succeeds: EnrollmentCampaign.${cam14}.status == OPEN"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: group_campaign_window_half_open_adjacency_allowed
        grounds:
          - state_machines.EnrollmentCampaign.DRAFT_to_OPEN
          - errors[ERR_CAMPAIGN_WINDOW_OVERLAP]
          - entities.EnrollmentCampaign.fields.window_start
        distinguishing_aspect: |
          Resource = employer group enrollment calendar, HALF-OPEN interval
          semantics: a campaign whose window starts exactly at the OPEN campaign's
          window_end does NOT overlap ([s1,e1) ∩ [e1,e2) = empty) and opens
          cleanly; a one-second-earlier start does overlap and is rejected with
          ERR_CAMPAIGN_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Group G15 ACTIVE (0/0.0, DAILY); counselors C15a and C15b ACTIVE (two counselors so the counselor double-booking gate is not what fires)."
            - "Campaign CAM15A OPEN with window 2026-09-01T00:00:00Z .. 2026-09-15T00:00:00Z."
            - "Campaign CAM15B DRAFT with window 2026-09-15T00:00:00Z .. 2026-10-01T00:00:00Z (adjacent, touching at the boundary)."
            - "Campaign CAM15C DRAFT with window 2026-09-14T23:59:59Z .. 2026-10-01T00:00:00Z (overlaps by one second)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /employer-groups", payload: { name: "G15", group_code: "G15", participation_minimum_pct: 0.0, participation_minimum_count: 0, proration_convention: "DAILY" }, as: CarrierAdmin, captures: { g15: $.data.id } }
