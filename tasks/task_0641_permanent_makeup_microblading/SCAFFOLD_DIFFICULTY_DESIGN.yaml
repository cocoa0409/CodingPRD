  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_deposit_conservation_on_void
        grounds:
          - state_machines.Appointment.BOOKED_to_VOIDED
          - calculations.appointment_deposit_balance
          - entities.DepositTransaction.fields.txn_type
          - entities.Appointment.fields.deposit_paid_cents
        distinguishing_aspect: "Conserved quantity = money (deposit). After void, deposit_paid_cents returns to 0 and the ledger holds CHARGE 13000 then REFUND 13000, so sum(CHARGE) - sum(REFUND) == 0 == deposit_paid_cents: no money drift."
        test_recipe:
          setup:
            - "A BOOKED DEPOSIT_PAID appointment (deposit 13000) is voided by ComplianceOfficer."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
