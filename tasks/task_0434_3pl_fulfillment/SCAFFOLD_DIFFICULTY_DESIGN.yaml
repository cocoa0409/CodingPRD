  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bin_aggregate_volume_capacity_overlap_rejects_putaway
        grounds:
          - validations[priority=10]
          - entities.Bin.fields.occupied_cc
          - entities.Bin.fields.capacity_cc
          - errors[ERR_BIN_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on a GENERAL Bin: the sum of all
          lots' volume intervals must fit within [0, capacity_cc]. Putting 6 units
          * 400cc = 2400cc into a bin already holding 2000cc with capacity 4000cc
          overflows (4400 > 4000) and is rejected.
        test_recipe:
          setup:
            - "GENERAL bin capacity 4000cc already holding 2000cc (5 units * 400cc) of the client; new RECEIVED receipt of 6 more units (2400cc)"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Cap", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-14", bin_type: "GENERAL", capacity_cc: 4000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 5 }
              as: ReceivingClerk
              captures: { rcpt1: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt1}/receive"
              payload: { received_qty: 5 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt1}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 6 }
              as: ReceivingClerk
              captures: { rcpt2: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt2}/receive"
              payload: { received_qty: 6 }
              as: ReceivingClerk
          trigger:
            - call: "POST /clients/${cli}/receipts/${rcpt2}/putaway"
              payload: {}
              as: ReceivingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BIN_CAPACITY_EXCEEDED"
            - "Bin.${bin}.occupied_cc == 2000 (unchanged)"
            - "Receipt.${rcpt2}.status == RECEIVED (unchanged)"

      - name: pallet_exclusive_occupancy_overlap_rejects_other_client
        grounds:
          - validations[priority=11]
          - entities.Bin.fields.bin_type
          - entities.InventoryLot.fields.client_id
          - errors[ERR_PALLET_OCCUPIED_BY_OTHER_CLIENT]
        distinguishing_aspect: |
          Exclusive-occupancy interval semantics on a PALLET Bin (a different
          resource entity type and different geometry than aggregate volume): the
          pallet position admits at most ONE client; client B's putaway into a
          PALLET bin already holding client A's units is rejected even though
          volume capacity remains.
        test_recipe:
          setup:
            - "PALLET bin capacity 100000 holding client A's 4 units; client B has a RECEIVED receipt targeting the same PALLET bin"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "A", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50 }
              as: BillingClerk
              captures: { cliA: $.data.id }
            - call: "POST /clients"
              payload: { name: "B", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50 }
              as: BillingClerk
              captures: { cliB: $.data.id }
            - call: "POST /clients/${cliA}/skus"
              payload: { code: "A-SKU", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cliA}"
              captures: { skuA: $.data.id }
            - call: "POST /clients/${cliB}/skus"
              payload: { code: "B-SKU", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cliB}"
              captures: { skuB: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "P-01", bin_type: "PALLET", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cliA}/receipts"
              payload: { sku_id: "${skuA}", bin_id: "${bin}", expected_qty: 4 }
              as: ReceivingClerk
              captures: { rcptA: $.data.id }
            - call: "POST /clients/${cliA}/receipts/${rcptA}/receive"
              payload: { received_qty: 4 }
              as: ReceivingClerk
            - call: "POST /clients/${cliA}/receipts/${rcptA}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cliB}/receipts"
              payload: { sku_id: "${skuB}", bin_id: "${bin}", expected_qty: 4 }
              as: ReceivingClerk
              captures: { rcptB: $.data.id }
            - call: "POST /clients/${cliB}/receipts/${rcptB}/receive"
              payload: { received_qty: 4 }
              as: ReceivingClerk
          trigger:
            - call: "POST /clients/${cliB}/receipts/${rcptB}/putaway"
              payload: {}
              as: ReceivingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PALLET_OCCUPIED_BY_OTHER_CLIENT"
            - "Receipt.${rcptB}.status == RECEIVED (unchanged)"
            - "Bin.${bin}.occupied_cc == 1600 (only client A's 4*400cc)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reserve_then_cancel_conserves_available_qty
        grounds:
          - state_machines.Wave.BUILDING_to_RELEASED
          - state_machines.Order.RESERVED_to_CANCELLED
          - entities.InventoryLot.fields.available_qty
          - entities.InventoryLot.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity = InventoryLot.available_qty. Forward action (wave
          release reserves 3 units: reserved 0->3, available 10->7) paired with
          its compensation (order cancel from RESERVED releases: reserved 3->0,
          available 7->10) leaves available_qty exactly back at 10 and reserved at 0,
          pinned: available_qty == on_hand_qty - reserved_qty == 10 - 0.
        test_recipe:
          setup:
            - "Lot of 10 units; order of 3 released (reserving 3) then cancelled from RESERVED before any pick confirm"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Inv", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-15", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 10 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 10 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "GET /inventory-lots"
              payload: { sku_id: "${sku}", bin_id: "${bin}" }
              as: ReceivingClerk
              captures: { lot: "$.data[0].id"}
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 3 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
          trigger:
            - call: "POST /clients/${cli}/orders/${ord}/cancel"
              payload: {}
              as: ClientUser
              as_user_id: "${cli}"
              captures: { st: $.data.status }
          assert:
            - "Order.${ord}.status == CANCELLED"
            - "InventoryLot.${lot}.reserved_qty == 0"
            - "InventoryLot.${lot}.available_qty == 10"
            - "InventoryLot.${lot}.on_hand_qty == 10"

      - name: ship_then_sellable_return_conserves_on_hand_qty
        grounds:
          - state_machines.Order.PACKED_to_SHIPPED
          - state_machines.Return.REQUESTED_to_GRADED
          - entities.InventoryLot.fields.on_hand_qty
        distinguishing_aspect: |
          A different conserved quantity = total physical on_hand_qty for the SKU.
          Forward action (ship consumes 2 units: on_hand 2->0) paired with its
          compensation (SELLABLE return restocks 2 units back to a bin: on_hand
          0->2) restores total on_hand to 2, pinned as sum of on_hand_qty over the
          SKU's lots == 2.
        test_recipe:
          setup:
            - "Order of 2 units shipped (on_hand 0), then a SELLABLE return of 2 units restocked into a GENERAL bin"
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "Ret", storage_rate_per_pallet_cents: 1000, handling_rate_per_order_cents: 500, handling_rate_per_extra_unit_cents: 50, carrier_discount_bps: 0 }
              as: BillingClerk
              captures: { cli: $.data.id }
            - call: "POST /clients/${cli}/skus"
              payload: { code: "SKU1", unit_volume_cc: 400, hazmat: false }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { sku: $.data.id }
            - call: "POST /bins"
              payload: { location_code: "G-16", bin_type: "GENERAL", capacity_cc: 100000 }
              as: ReceivingClerk
              captures: { bin: $.data.id }
            - call: "POST /clients/${cli}/receipts"
              payload: { sku_id: "${sku}", bin_id: "${bin}", expected_qty: 2 }
              as: ReceivingClerk
              captures: { rcpt: $.data.id }
            - call: "POST /clients/${cli}/receipts/${rcpt}/receive"
              payload: { received_qty: 2 }
              as: ReceivingClerk
            - call: "POST /clients/${cli}/receipts/${rcpt}/putaway"
              payload: {}
              as: ReceivingClerk
            - call: "POST /clients/${cli}/orders"
              payload: { ship_to_zone: 2, lines: [ { sku_id: "${sku}", qty: 2 } ] }
              as: ClientUser
              as_user_id: "${cli}"
              captures: { ord: $.data.id }
            - call: "POST /clients/${cli}/waves"
              payload: {}
              as: WavePlanner
              captures: { wv: $.data.id }
            - call: "POST /clients/${cli}/waves/${wv}/add-order"
              payload: { order_id: "${ord}" }
              as: WavePlanner
            - call: "POST /clients/${cli}/waves/${wv}/release"
              payload: {}
              as: WavePlanner
            - call: "GET /pick-tasks"
              payload: { order_id: "${ord}" }
              as: WavePlanner
              captures: { pt0: "$.data[0].id"}
            - call: "POST /clients/${cli}/pick-tasks/${pt0}/confirm"
              payload: { picked_qty: 2 }
              as: PickOperator
            - call: "POST /clients/${cli}/orders/${ord}/pack"
              payload: { cartons: [ { packed_units: 2 } ] }
              as: PackStation
            - call: "POST /clients/${cli}/shipments"
              payload: { order_id: "${ord}" }
              as: ShipStation
              captures: { shp: $.data.id }
            - call: "POST /clients/${cli}/orders/${ord}/ship"
              payload: {}
              as: ShipStation
            - call: "POST /clients/${cli}/returns"
              payload: { order_id: "${ord}", sku_id: "${sku}", bin_id: "${bin}", qty: 2 }
              as: ReturnsClerk
              captures: { ret: $.data.id }
          trigger:
            - call: "POST /clients/${cli}/returns/${ret}/grade"
              payload: { grade: "SELLABLE" }
              as: ReturnsClerk
              captures: { st: $.data.status }
          assert:
            - "Return.${ret}.status == GRADED"
            - "Return.${ret}.grade == SELLABLE"
            - "sum of InventoryLot.on_hand_qty over lots for ${sku} == 2 (restored to the pre-ship total)"
            - "Bin.${bin}.occupied_cc == 800"
