scenario: "918. Community Health Worker & SDOH Program (provider side): patient roster & risk/SDOH screening, closed-loop referral (food/housing/transport), home-visit & goal, resource inventory & eligibility, encounter & time tracking, payer/grant billing, outcome & escalation, reporting"
domain_name: "chw-sdoh-program"
api_prefix: "/chw"

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: graph
  entity_topology_note: |
    Referral is self-referential (parent_referral_id / root_referral_id form a re-route chain),
    Escalation is polymorphic across three optional source FKs (Referral, Screening, ResourceOffering),
    and Encounter sits on a cross-aggregate seam between the clinical side (HomeVisit, Patient) and
    the funding side (PayerClaim, GrantChargeLine). No strict parent-child URL tree exists.

  state_machine_shape: parallel
  state_machine_shape_note: |
    Two entities carry two independent state axes each (Patient.enrollment_status x Patient.gate_status,
    HomeVisit.scheduling_status x HomeVisit.documentation_status). Referral and CarePlanGoal are cyclic,
    Escalation is a multi-way fan-out with auto-promotion, PayerClaim is a branching appeal tree.

  relationship_patterns:
    - one_to_many
    - self_referential
    - polymorphic
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# GLOBAL CONSTANTS (every named constant used anywhere in this scaffold has a
# concrete value here; §1.3 calculations re-declare the ones they consume)
# ===========================================================================
global_constants:
  SERVER_DEFAULT_CLOCK_UTC: "2026-05-01T00:00:00Z"

  # --- screening / risk ---
  DEFAULT_RESCREEN_CADENCE_DAYS: 90
  SCREENING_DOMAIN_SCORE_MIN: 0
  SCREENING_DOMAIN_SCORE_MAX: 4
  SCREENING_WEIGHT_SUM_REQUIRED: 100
  RISK_TIER_MODERATE_MIN: 25
  RISK_TIER_HIGH_MIN: 50
  RISK_TIER_CRITICAL_MIN: 75
  SCREENING_COVERAGE_WINDOW_DAYS: 365

  # --- referral / closed loop ---
  ACK_SLA_HOURS_ROUTINE: 72
  ACK_SLA_HOURS_URGENT: 24
  ACK_SLA_HOURS_EMERGENT: 4
  MAX_REROUTE_COUNT: 2
  REFERRAL_HOLD_EXPIRY_HOURS: 168
  UNFULFILLED_REFERRAL_ESCALATION_THRESHOLD: 2

  # --- home visit ---
  VISIT_INTERVAL_SEMANTICS: "HALF_OPEN"
  VISIT_MIN_DURATION_MINUTES: 15
  VISIT_MAX_DURATION_MINUTES: 240
  ATTESTATION_WINDOW_HOURS: 72
  AMENDMENT_WINDOW_DAYS: 30

  # --- encounter / time tracking ---
  MINUTE_ROUNDING_INCREMENT: 6
  ENCOUNTER_MAX_TOTAL_MINUTES: 480
  CM_CODE_MINUTE_THRESHOLD: 60
  CM_EXTENDED_MINUTE_THRESHOLD: 120
  CM_CODE_STANDARD: "CM-60"
  CM_CODE_EXTENDED: "CM-120"
  MILEAGE_BAND_1_MAX_MILES: 10
  MILEAGE_BAND_2_MAX_MILES: 30
  MILEAGE_RATE_BAND_1_CENTS: 67
  MILEAGE_RATE_BAND_2_CENTS: 55
  MILEAGE_RATE_BAND_3_CENTS: 40
  TRAVEL_REIMBURSEMENT_CAP_CENTS: 5000

  # --- payer claim ---
  CLAIM_UNIT_MINUTES: 15
  CLAIM_ALLOWED_CENTS_PER_UNIT: 2150
  CLAIM_APPEAL_WINDOW_DAYS: 60

  # --- grant ---
  GRANT_PERIOD_SEMANTICS: "CLOSED"
  GRANT_RATE_TIER_BREAK_CENTS: 50000
  GRANT_HOURLY_RATE_TIER1_CENTS: 4200
  GRANT_HOURLY_RATE_TIER2_CENTS: 3800
  DEFAULT_GRANT_INDIRECT_RATE_PCT: 10

  # --- escalation ---
  TIER1_ACK_SLA_HOURS: 48
  TIER2_ACK_SLA_HOURS: 24
  TIER3_ACK_SLA_HOURS: 8
  MAX_ESCALATION_TIER: 3

# ===========================================================================
# CONSERVATION INVARIANTS (must hold after EVERY request, including cascades)
# ===========================================================================
conservation_invariants:
  - id: offering_unit_conservation
    quantity: "resource inventory units"
    formula: |
      ResourceOffering.capacity_total ==
        ResourceOffering.available_units
        + ResourceOffering.allocated_units
        + ResourceOffering.delivered_units
    note: |
      Released and expired holds return their units to available_units; they never leave the
      partition. released_units and expired_units are cumulative counters, not partition members.

  - id: offering_hold_ledger_conservation
    quantity: "cumulative hold ledger entries"
    formula: |
      ResourceOffering.lifetime_allocated_units ==
        ResourceOffering.allocated_units
        + ResourceOffering.delivered_units
        + ResourceOffering.released_units
        + ResourceOffering.expired_units
    note: |
      Every unit ever held by a referral ends in exactly one of four buckets. lifetime_allocated_units
      only ever increases (on hold placement) and never decreases.

  - id: grant_budget_conservation
    quantity: "grant award currency (cents)"
    formula: |
      GrantAward.budget_cap_cents ==
        GrantAward.committed_cents + GrantAward.remaining_budget_cents
    note: |
      committed_cents is the sum of total_amount_cents over GrantChargeLine rows for this award
      whose status == POSTED. Reversing a line subtracts exactly the amount it added.

  - id: encounter_minute_conservation
    quantity: "CHW minutes"
    formula: |
      Encounter.total_minutes ==
        Encounter.direct_minutes + Encounter.indirect_minutes
        + Encounter.travel_minutes + Encounter.documentation_minutes
      AND for every (patient_id, service_month):
        sum(billable_minutes of Encounter with status IN {SUBMITTED, LOCKED}) ==
          payer_funded_minutes + grant_funded_minutes + unfunded_minutes
      where payer_funded_minutes  = sum over encounters with funding_source == PAYER,
            grant_funded_minutes  = sum over encounters with funding_source == GRANT,
            unfunded_minutes      = sum over encounters with funding_source == UNFUNDED.
    note: |
      No encounter's minutes may appear in two buckets (anti-double-dip). Compensating actions
      (PayerClaim -> UPHELD, GrantChargeLine reversal) move minutes back to UNFUNDED with zero drift.

# ===========================================================================
# §1.1 ENTITY-RELATIONSHIP TABLE (15 entities)
# ===========================================================================
entities:

  - name: CommunityHealthWorker
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the community health worker."
      - name: employee_code
        type: string
        source: input
        description: "Employer-assigned worker code."
        constraints: "Unique across all CommunityHealthWorker rows; non-empty string."
      - name: credential_level
        type: enum
        source: input
        description: "Credential band the worker holds."
        default: CHW_BASIC
        constraints: "One of CHW_BASIC, CHW_SENIOR, CHW_SUPERVISOR."
      - name: employment_status
        type: enum
        source: system
        description: "Whether the worker may be assigned new work. Set to ACTIVE at creation; this scaffold declares no operation that changes it, so ACTIVE is the only value any row ever holds."
        default: ACTIVE
        constraints: "Always the single value ACTIVE."

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number on the CHW program roster."
        constraints: "Unique across all Patient rows; non-empty string."
      - name: full_name
        type: string
        source: input
        description: "Patient full name."
      - name: household_size
        type: integer
        source: input
        description: "Number of people in the patient household."
        constraints: "Integer >= 1."
      - name: monthly_income_cents
        type: integer
        source: input
        description: "Self-reported household monthly income in cents."
        constraints: "Integer >= 0."
      - name: residence_zip
        type: string
        source: input
        description: "Five-digit residential ZIP code used for geography eligibility."
        constraints: "Exactly 5 numeric characters."
      - name: program_enrollments
        type: array
        source: input
        description: "Program codes the patient is already enrolled in, e.g. SNAP, WIC, MEDICAID."
        default: []
        constraints: "Array of non-empty uppercase strings."
      - name: categorical_exclusions
        type: array
        source: input
        description: "Exclusion flag codes on file for this patient, e.g. PRIOR_FRAUD_FINDING."
        default: []
        constraints: "Array of non-empty uppercase strings."
      - name: child_in_household
        type: boolean
        source: input
        description: "True when a child under 18 lives in the household."
        default: false
      - name: address_safety_flag
        type: boolean
        source: input
        description: "True when the residence address carries a documented safety concern; forces the two-person home-visit rule."
        default: false
      - name: enrollment_status
        type: enum
        source: system
        description: "Program enrollment axis of the Patient state machine."
        default: PROSPECTIVE
        constraints: "One of PROSPECTIVE, ENROLLED, DISENROLLED."
      - name: gate_status
        type: enum
        source: system
        description: "Records-hold axis of the Patient state machine; drives the global write gate at ladder rung 4."
        default: OPEN
        constraints: "One of OPEN, RECORDS_HOLD."
      - name: gate_reason
        type: string
        source: system
        description: "Free-text reason captured when the records hold was placed; null while gate_status is OPEN."
        default: null
      - name: risk_score
        type: number
        source: computed
        description: "Weighted SDOH score copied from the patient's current (non-SUPERSEDED) Screening; 0 when the patient has never been screened."
        default: 0
        constraints: "Two decimal places, range 0.00 to 100.00."
      - name: risk_tier
        type: enum
        source: computed
        description: "Risk band derived from risk_score by sdoh_weighted_risk_score; NONE until the first screening."
        default: NONE
        constraints: "One of NONE, LOW, MODERATE, HIGH, CRITICAL."
      - name: risk_tier_effective_at
        type: datetime
        source: computed
        description: "anchor_screened_at of the Screening that produced the current risk_tier; null before the first screening."
        default: null
      - name: unfulfilled_referral_count
        type: integer
        source: computed
        description: "Running count of this patient's referrals that reached LAPSED or DECLINED without a downstream SERVICE_DELIVERED."
        default: 0

  - name: ScreeningInstrument
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Instrument name, e.g. PRAPARE-Local."
      - name: version_label
        type: string
        source: input
        description: "Version label of this instrument revision, e.g. v2.1."
        constraints: "The pair (name, version_label) is unique across all ScreeningInstrument rows."
      - name: domain_weights
        type: object
        source: input
        description: "Map from SDOH domain code to integer weight, e.g. FOOD 30, HOUSING 40, TRANSPORT 30."
        constraints: "Keys are drawn from FOOD, HOUSING, TRANSPORT, EMPLOYMENT, HEALTH_LITERACY. Values are integers >= 0 summing to exactly SCREENING_WEIGHT_SUM_REQUIRED (100). At least one key."
      - name: rescreen_cadence_days
        type: integer
        source: input
        description: "Cadence window in days that decides amendment-vs-fresh anchoring on re-screen."
        default: 90
        constraints: "Integer >= 1."
      - name: effective_from
        type: datetime
        source: input
        description: "ISO 8601 UTC instant from which the instrument may be used."
      - name: status
        type: enum
        source: system
        description: "Publication lifecycle. DRAFT at creation; PUBLISHED set by POST /chw/screening-instruments/{id}/publish; RETIRED set by POST /chw/screening-instruments/{id}/retire."
        default: DRAFT
        constraints: "One of DRAFT, PUBLISHED, RETIRED."

  - name: Screening
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the screened patient."
      - name: instrument_id
        type: string
        source: input
        description: "FK -> ScreeningInstrument.id; the instrument revision used."
      - name: domain_scores
        type: object
        source: input
        description: "Map from SDOH domain code to raw score for this administration."
        constraints: "Keys MUST equal the key set of the instrument's domain_weights exactly. Values are integers between SCREENING_DOMAIN_SCORE_MIN (0) and SCREENING_DOMAIN_SCORE_MAX (4) inclusive."
      - name: anchor_screened_at
        type: datetime
        source: system
        description: "Logical-clock instant of the FIRST administration on this Screening row. Preserved across amendments; re-anchored only when a fresh Screening row is created."
      - name: latest_response_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent administration written onto this row; equals anchor_screened_at until the first amendment."
      - name: weighted_score
        type: number
        source: computed
        description: "Weighted SDOH score produced by sdoh_weighted_risk_score from domain_scores and the instrument's domain_weights."
        constraints: "Two decimal places, range 0.00 to 100.00."
      - name: risk_tier
        type: enum
        source: computed
        description: "Risk band derived from weighted_score."
        constraints: "One of LOW, MODERATE, HIGH, CRITICAL."
      - name: amendment_count
        type: integer
        source: system
        description: "Number of amendments folded into this row; 0 for a freshly anchored screening."
        default: 0
      - name: status
        type: enum
        source: system
        description: "SUBMITTED at creation; AMENDED after an in-cadence re-screen folds into this row; SUPERSEDED when an out-of-cadence re-screen creates a fresh row."
        default: SUBMITTED
        constraints: "One of SUBMITTED, AMENDED, SUPERSEDED."

  - name: ResourceOrg
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Community resource organization name."
      - name: org_type
        type: enum
        source: input
        description: "Primary service line of the organization."
        constraints: "One of FOOD, HOUSING, TRANSPORT."
      - name: service_zips
        type: array
        source: input
        description: "ZIP codes the organization serves."
        constraints: "Non-empty array of 5-character numeric strings."
      - name: contact_email
        type: string
        source: input
        description: "Closed-loop acknowledgement contact."
      - name: status
        type: enum
        source: system
        description: "Partnership status axis; SUSPENDED organizations cannot receive new referrals."
        default: ACTIVE
        constraints: "One of ACTIVE, SUSPENDED."

  - name: ResourceOffering
    parent: null
    common_fields: true
    fields:
      - name: resource_org_id
        type: string
        source: input
        description: "FK -> ResourceOrg.id; the organization that supplies these units."
      - name: unit_type
        type: enum
        source: input
        description: "Consumable unit this offering dispenses."
        constraints: "One of FOOD_BOX, HOUSING_VOUCHER, TRANSPORT_RIDE."
      - name: capacity_total
        type: integer
        source: input
        description: "Total units this offering can ever have outstanding at once; fixed at creation."
        constraints: "Integer >= 1."
      - name: available_units
        type: integer
        source: computed
        description: "Units free to be held by a new referral. Initialized to capacity_total."
        constraints: "Integer >= 0; participates in offering_unit_conservation."
      - name: allocated_units
        type: integer
        source: computed
        description: "Units currently held by referrals in status SENT or ACCEPTED."
        default: 0
      - name: delivered_units
        type: integer
        source: computed
        description: "Units consumed by referrals that reached SERVICE_DELIVERED; never returns to available_units."
        default: 0
      - name: released_units
        type: integer
        source: computed
        description: "Cumulative count of held units returned to available_units by a DECLINED, LAPSED or closed-without-delivery referral."
        default: 0
      - name: expired_units
        type: integer
        source: computed
        description: "Cumulative count of held units returned to available_units by the lazy hold-expiry sweep."
        default: 0
      - name: lifetime_allocated_units
        type: integer
        source: computed
        description: "Monotonic count of every unit ever placed on hold by a referral; participates in offering_hold_ledger_conservation."
        default: 0
      - name: availability_state
        type: enum
        source: computed
        description: "AVAILABLE while available_units > 0; EXHAUSTED the moment available_units reaches 0."
        default: AVAILABLE
        constraints: "One of AVAILABLE, EXHAUSTED."
      - name: exhausted_since
        type: datetime
        source: computed
        description: "Logical-clock instant availability_state last flipped to EXHAUSTED; null while AVAILABLE."
        default: null

  - name: EligibilityCriterion
    parent: ResourceOffering
    common_fields: true
    fields:
      - name: offering_id
        type: string
        source: input
        description: "FK -> ResourceOffering.id; the offering this criterion gates."
      - name: criterion_type
        type: enum
        source: input
        description: "Which gauntlet stage this criterion belongs to; also fixes its evaluation_rank."
        constraints: "One of INCOME_BAND, GEOGRAPHY, HOUSEHOLD_SIZE, PROGRAM_ENROLLMENT, CATEGORICAL_EXCLUSION."
      - name: evaluation_rank
        type: integer
        source: computed
        description: "Fixed rank derived from criterion_type: INCOME_BAND 1, GEOGRAPHY 2, HOUSEHOLD_SIZE 3, PROGRAM_ENROLLMENT 4, CATEGORICAL_EXCLUSION 5."
        constraints: "Integer between 1 and 5."
      - name: max_monthly_income_cents
        type: integer
        source: input
        description: "INCOME_BAND only: patient passes when monthly_income_cents <= this value. Null for other criterion types."
        default: null
      - name: allowed_zips
        type: array
        source: input
        description: "GEOGRAPHY only: patient passes when residence_zip is a member of this array. Empty for other criterion types."
        default: []
      - name: min_household_size
        type: integer
        source: input
        description: "HOUSEHOLD_SIZE only: patient passes when household_size >= this value. Null for other criterion types."
        default: null
      - name: max_household_size
        type: integer
        source: input
        description: "HOUSEHOLD_SIZE only: patient passes when household_size <= this value. Null for other criterion types."
        default: null
      - name: required_program_code
        type: string
        source: input
        description: "PROGRAM_ENROLLMENT only: patient passes when this code is a member of program_enrollments. Null for other criterion types."
        default: null
      - name: excluded_flag_code
        type: string
        source: input
        description: "CATEGORICAL_EXCLUSION only: patient FAILS when this code is a member of categorical_exclusions. Null for other criterion types."
        default: null

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the referred patient."
      - name: offering_id
        type: string
        source: input
        description: "FK -> ResourceOffering.id; the offering whose units this referral holds."
      - name: opened_by_chw_id
        type: string
        source: input
        description: "FK -> CommunityHealthWorker.id; the worker who sent the referral."
      - name: parent_referral_id
        type: string
        source: system
        description: "FK -> Referral.id; the DECLINED referral this one was re-routed from. Null on a root referral."
        default: null
      - name: root_referral_id
        type: string
        source: system
        description: "FK -> Referral.id; the first referral in this re-route chain. Equals this row's own id on a root referral."
      - name: urgency
        type: enum
        source: input
        description: "Acknowledgement urgency; selects the SLA hours."
        constraints: "One of ROUTINE, URGENT, EMERGENT."
      - name: units_requested
        type: integer
        source: input
        description: "Number of offering units this referral holds."
        constraints: "Integer >= 1."
      - name: status
        type: enum
        source: system
        description: "Closed-loop referral state."
        default: SENT
        constraints: "One of SENT, ACCEPTED, DECLINED, SERVICE_DELIVERED, CLOSED, LAPSED."
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock instant the referral entered SENT."
      - name: ack_deadline_at
        type: datetime
        source: computed
        description: "Instant by which the resource organization must respond; produced by referral_ack_deadline."
      - name: hold_expires_at
        type: datetime
        source: computed
        description: "sent_at plus REFERRAL_HOLD_EXPIRY_HOURS (168); the lazy hold-expiry sweep releases units after this instant."
      - name: reroute_count
        type: integer
        source: system
        description: "Number of re-routes already performed on this referral's chain, copied onto every member of the chain."
        default: 0
      - name: decline_reason
        type: string
        source: system
        description: "Reason recorded when status became DECLINED; null otherwise."
        default: null
      - name: lapse_reason
        type: string
        source: system
        description: "Reason recorded when status became LAPSED; exactly one of ACK_SLA_EXPIRED (REFERRAL_LAPSE sweep on a SENT referral), HOLD_EXPIRED (OFFERING_HOLD_EXPIRY sweep on an ACCEPTED referral) or RECORDS_HOLD (records-hold cascade). Null otherwise."
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant status became SERVICE_DELIVERED; null otherwise."
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant status became CLOSED; null otherwise."
        default: null
      - name: outcome_note
        type: string
        source: input
        description: "Loop-closure note supplied when the referral is closed; null before closure."
        default: null

  - name: HomeVisit
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the visited patient."
      - name: assigned_chw_id
        type: string
        source: input
        description: "FK -> CommunityHealthWorker.id; the worker who owns the visit and must attest it."
      - name: second_chw_id
        type: string
        source: input
        description: "FK -> CommunityHealthWorker.id; the second worker on a two-person visit. Null when not a two-person visit."
        default: null
      - name: scheduled_start
        type: datetime
        source: input
        description: "Inclusive start of the visit slot."
      - name: scheduled_end
        type: datetime
        source: input
        description: "Exclusive end of the visit slot; visit slots use HALF_OPEN interval semantics."
      - name: two_person_required
        type: boolean
        source: computed
        description: "Copied from Patient.address_safety_flag at creation; when true a second_chw_id is mandatory."
      - name: scheduling_status
        type: enum
        source: system
        description: "Scheduling axis of the HomeVisit state machine."
        default: SCHEDULED
        constraints: "One of SCHEDULED, EN_ROUTE, COMPLETED, NO_SHOW, CANCELLED."
      - name: documentation_status
        type: enum
        source: system
        description: "Documentation axis of the HomeVisit state machine; evolves independently of scheduling_status and gates billing."
        default: DRAFT
        constraints: "One of DRAFT, ATTESTED, AMENDED, VOIDED."
      - name: completed_at
        type: datetime
        source: system
        description: "Logical-clock instant scheduling_status became COMPLETED; null otherwise."
        default: null
      - name: attested_at
        type: datetime
        source: system
        description: "Logical-clock instant documentation_status first became ATTESTED; null before attestation."
        default: null
      - name: amendment_count
        type: integer
        source: system
        description: "Number of documentation revisions applied after the first attestation."
        default: 0
      - name: visit_note
        type: string
        source: input
        description: "Narrative note captured with the visit; null until supplied."
        default: null

  - name: CarePlanGoal
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient this goal belongs to."
      - name: domain
        type: enum
        source: input
        description: "SDOH domain the goal addresses."
        constraints: "One of FOOD, HOUSING, TRANSPORT, EMPLOYMENT, HEALTH_LITERACY."
      - name: direction
        type: enum
        source: input
        description: "Whether a rising or falling measure counts as progress; selects the progress variant."
        constraints: "One of INCREASE_GOOD, DECREASE_GOOD."
      - name: baseline_value
        type: number
        source: input
        description: "Measured value at goal creation."
      - name: target_value
        type: number
        source: input
        description: "Value that counts as full achievement."
        constraints: "For INCREASE_GOOD, target_value > baseline_value. For DECREASE_GOOD, target_value < baseline_value."
      - name: current_value
        type: number
        source: system
        description: "Latest measured value; initialized to baseline_value."
      - name: progress_pct
        type: number
        source: computed
        description: "Percent progress produced by goal_progress_pct; one decimal place, clamped to the range 0.0 to 100.0."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Goal lifecycle with a re-open path."
        default: ACTIVE
        constraints: "One of ACTIVE, MET, NOT_MET, DEFERRED."
      - name: review_cycle_days
        type: integer
        source: input
        description: "Days between reviews; drives review_due_at."
        default: 30
        constraints: "Integer >= 1."
      - name: review_due_at
        type: datetime
        source: computed
        description: "Instant the next review is due; recomputed as the logical clock plus review_cycle_days on creation, on every progress update and on every re-open."
      - name: reopen_count
        type: integer
        source: system
        description: "Number of times this goal returned to ACTIVE from a closed status."
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant the goal last left ACTIVE; null while ACTIVE."
        default: null

  - name: Encounter
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient served."
      - name: chw_id
        type: string
        source: input
        description: "FK -> CommunityHealthWorker.id; the worker whose time this encounter records."
      - name: home_visit_id
        type: string
        source: input
        description: "FK -> HomeVisit.id; the visit this encounter documents. Null for telephonic or field time not tied to a scheduled visit."
        default: null
      - name: funding_claim_id
        type: string
        source: system
        description: "FK -> PayerClaim.id; set when the encounter's minutes are carved to a payer claim. Null otherwise."
        default: null
      - name: encounter_date
        type: string
        source: input
        description: "Calendar date of service in YYYY-MM-DD form."
      - name: service_month
        type: string
        source: computed
        description: "First seven characters of encounter_date, in YYYY-MM form; the monthly bucket used by billing."
      - name: direct_minutes
        type: integer
        source: input
        description: "Face-to-face or telephonic minutes with the patient."
        constraints: "Integer >= 0."
      - name: indirect_minutes
        type: integer
        source: input
        description: "Minutes spent on the patient's behalf without the patient present."
        constraints: "Integer >= 0."
      - name: travel_minutes
        type: integer
        source: input
        description: "Minutes travelling to or from the encounter; never billable."
        constraints: "Integer >= 0."
      - name: documentation_minutes
        type: integer
        source: input
        description: "Minutes spent documenting the encounter."
        constraints: "Integer >= 0."
      - name: travel_miles
        type: number
        source: input
        description: "Miles travelled, one decimal place."
        default: 0
        constraints: "Number >= 0."
      - name: total_minutes
        type: integer
        source: computed
        description: "Sum of direct, indirect, travel and documentation minutes; participates in encounter_minute_conservation."
      - name: raw_billable_minutes
        type: integer
        source: computed
        description: "direct_minutes + indirect_minutes + documentation_minutes, before rounding."
      - name: billable_minutes
        type: integer
        source: computed
        description: "raw_billable_minutes rounded to the nearest MINUTE_ROUNDING_INCREMENT (6) using round_half_up; the per-encounter rounding step pinned by billable_minutes_monthly_rollup."
      - name: travel_reimbursement_cents
        type: integer
        source: computed
        description: "Mileage reimbursement produced by travel_mileage_reimbursement under the PER_ENCOUNTER_MARGINAL variant."
      - name: funding_source
        type: enum
        source: computed
        description: "Which funding bucket owns this encounter's minutes; enforces anti-double-dip."
        default: UNFUNDED
        constraints: "One of UNFUNDED, PAYER, GRANT."
      - name: status
        type: enum
        source: system
        description: "Encounter lifecycle; LOCKED means the minutes have been carved to a funding source and can only be freed by a compensating action."
        default: DRAFT
        constraints: "One of DRAFT, SUBMITTED, LOCKED, VOIDED."
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant status became SUBMITTED; null while DRAFT."
        default: null

  - name: PayerClaim
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the member being billed for."
      - name: service_month
        type: string
        source: input
        description: "Billing month in YYYY-MM form."
      - name: basis
        type: enum
        source: input
        description: "Selects the dual variant of billable_minutes_monthly_rollup. PROVISIONAL is a non-binding estimate; FINAL carves and locks minutes."
        constraints: "One of PROVISIONAL, FINAL."
      - name: claimed_minutes
        type: integer
        source: computed
        description: "Monthly billable minutes under the selected basis."
      - name: claimed_encounter_count
        type: integer
        source: computed
        description: "Number of Encounter rows included in the input set under the selected basis."
      - name: billing_code
        type: string
        source: computed
        description: "CM-60 when claimed_minutes >= 60 and < 120; CM-120 when claimed_minutes >= 120."
      - name: units
        type: integer
        source: computed
        description: "floor(claimed_minutes / CLAIM_UNIT_MINUTES), with CLAIM_UNIT_MINUTES = 15."
      - name: allowed_amount_cents
        type: integer
        source: computed
        description: "units multiplied by CLAIM_ALLOWED_CENTS_PER_UNIT (2150)."
      - name: status
        type: enum
        source: system
        description: "Adjudication and appeal lifecycle."
        default: SUBMITTED
        constraints: "One of SUBMITTED, PAID, DENIED, APPEALED, OVERTURNED, UPHELD."
      - name: denial_reason
        type: string
        source: system
        description: "Reason recorded when status became DENIED; null otherwise."
        default: null
      - name: denied_at
        type: datetime
        source: system
        description: "Logical-clock instant status became DENIED; anchors the appeal window. Null otherwise."
        default: null
      - name: appealed_at
        type: datetime
        source: system
        description: "Logical-clock instant status became APPEALED; null otherwise."
        default: null

  - name: GrantAward
    parent: null
    common_fields: true
    fields:
      - name: funder_name
        type: string
        source: input
        description: "Name of the funder; award periods are checked for overlap within a funder_name."
      - name: period_start
        type: string
        source: input
        description: "First allowable service date in YYYY-MM-DD form; the period is a CLOSED interval."
      - name: period_end
        type: string
        source: input
        description: "Last allowable service date in YYYY-MM-DD form, INCLUSIVE; the period is a CLOSED interval."
        constraints: "period_end >= period_start."
      - name: budget_cap_cents
        type: integer
        source: input
        description: "Maximum total_amount_cents this award may commit."
        constraints: "Integer >= 1."
      - name: indirect_rate_pct
        type: number
        source: input
        description: "Indirect cost rate applied to each line's direct amount, as a percentage."
        default: 10
        constraints: "Number >= 0 and <= 100."
      - name: allowable_cost_categories
        type: array
        source: input
        description: "Minute categories chargeable to this award. TRAVEL is never allowable regardless of this list."
        default: ["DIRECT", "INDIRECT", "DOCUMENTATION"]
        constraints: "Non-empty subset of DIRECT, INDIRECT, DOCUMENTATION."
      - name: committed_cents
        type: integer
        source: computed
        description: "Sum of total_amount_cents over this award's GrantChargeLine rows with status POSTED; participates in grant_budget_conservation."
        default: 0
      - name: remaining_budget_cents
        type: integer
        source: computed
        description: "budget_cap_cents minus committed_cents; initialized to budget_cap_cents."
      - name: status
        type: enum
        source: system
        description: "OPEN at creation; CLOSED set by POST /chw/grant-awards/{id}/close. CLOSED awards accept no new charge lines."
        default: OPEN
        constraints: "One of OPEN, CLOSED."

  - name: GrantChargeLine
    parent: null
    common_fields: true
    fields:
      - name: grant_award_id
        type: string
        source: input
        description: "FK -> GrantAward.id; the award charged."
      - name: encounter_id
        type: string
        source: input
        description: "FK -> Encounter.id; the encounter whose minutes are carved to this award."
      - name: charged_minutes
        type: integer
        source: computed
        description: "Copied from Encounter.billable_minutes at posting time."
      - name: hourly_rate_cents
        type: integer
        source: computed
        description: "Rate tier selected from the award's committed_cents as of the instant BEFORE this line posts."
      - name: direct_amount_cents
        type: integer
        source: computed
        description: "round_half_up(charged_minutes * hourly_rate_cents / 60), in whole cents."
      - name: indirect_amount_cents
        type: integer
        source: computed
        description: "round_half_up(direct_amount_cents * indirect_rate_pct / 100), in whole cents."
      - name: total_amount_cents
        type: integer
        source: computed
        description: "direct_amount_cents + indirect_amount_cents."
      - name: reversed_at
        type: datetime
        source: system
        description: "Logical-clock instant the line was reversed; null while POSTED."
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: "Reason recorded on reversal; one of MANUAL_REVERSAL or ENCOUNTER_VOIDED. Null while POSTED."
        default: null
      - name: status
        type: enum
        source: computed
        description: "POSTED while reversed_at is null; REVERSED once reversed_at is set."
        default: POSTED
        constraints: "One of POSTED, REVERSED."

  - name: Escalation
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient the escalation concerns."
      - name: source_flag
        type: enum
        source: input
        description: "What opened the escalation. MANUAL for operator-opened rows; the other four values are written only by cascades."
        constraints: "One of CRITICAL_SDOH_FINDING, RESOURCE_EXHAUSTED, REFERRAL_UNFULFILLED, GOAL_NOT_MET, MANUAL."
      - name: source_referral_id
        type: string
        source: system
        description: "FK -> Referral.id; the referral that opened this escalation. Null unless source_flag is REFERRAL_UNFULFILLED."
        default: null
      - name: source_screening_id
        type: string
        source: system
        description: "FK -> Screening.id; the screening that opened this escalation. Null unless source_flag is CRITICAL_SDOH_FINDING."
        default: null
      - name: blocking_offering_id
        type: string
        source: system
        description: "FK -> ResourceOffering.id; the exhausted offering that opened this escalation. Null unless source_flag is RESOURCE_EXHAUSTED."
        default: null
      - name: status
        type: enum
        source: system
        description: "Escalation tier ladder plus acknowledgement and resolution."
        default: OPEN_TIER_1
        constraints: "One of OPEN_TIER_1, OPEN_TIER_2, OPEN_TIER_3, ACKNOWLEDGED, RESOLVED."
      - name: current_tier
        type: integer
        source: computed
        description: "1, 2 or 3, mirroring the OPEN_TIER_n status; frozen at the tier reached when the escalation was acknowledged or resolved."
        default: 1
      - name: opened_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who opened the escalation, or the literal string SYSTEM for cascade-opened rows. Not a foreign key."
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the operator who acknowledged the escalation; null until acknowledged. Not a foreign key."
        default: null
      - name: tier_entered_at
        type: datetime
        source: system
        description: "Logical-clock instant the escalation entered its current tier; re-stamped on every promotion."
      - name: ack_deadline_at
        type: datetime
        source: computed
        description: "tier_entered_at plus the tier's SLA hours; produced by escalation_tier_deadline."
      - name: promotion_count
        type: integer
        source: system
        description: "Number of automatic tier promotions applied to this escalation."
        default: 0
      - name: resolution_reason
        type: string
        source: system
        description: "Reason recorded on resolution; one of MANUAL_RESOLUTION or RESOURCE_RESTORED. Null until RESOLVED."
        default: null
      - name: note
        type: string
        source: input
        description: "Operator note supplied at open time; null for cascade-opened rows."
        default: null

# ===========================================================================
# §1.2 STATE MACHINE TABLE (11 machines; 9 non-linear)
# `from: NONE` denotes entity creation, used where the creation itself starts
# a cascade that a PRD reader must be able to follow.
# ===========================================================================
state_machines:

  # ---------------------------------------------------------------- 1 of 11
  - entity: Patient
    axis: enrollment_status
    shape: cyclic
    initial_state: PROSPECTIVE
    terminal_states: []
    transitions:
      - from: PROSPECTIVE
        to: ENROLLED
        trigger: "POST /chw/screenings (automatic side effect of screening submission)"
        actor: system
        preconditions:
          - "Patient.enrollment_status == PROSPECTIVE"
          - "The risk_tier computed for the resulting Screening is one of MODERATE, HIGH, CRITICAL"
        side_effects:
          - "Set Patient.enrollment_status = ENROLLED"
          - "Increment Patient.version by 1 and refresh Patient.updated_at"
        note: "A LOW-tier screening leaves the patient PROSPECTIVE; enrollment then requires the manual ENROLL action."
      - from: PROSPECTIVE
        to: ENROLLED
        trigger: "PATCH /chw/patients/{id} with enrollment_action = ENROLL"
        actor: Supervisor
        preconditions:
          - "Patient.enrollment_status == PROSPECTIVE"
        side_effects:
          - "Set Patient.enrollment_status = ENROLLED"
          - "Increment Patient.version by 1"
      - from: ENROLLED
        to: DISENROLLED
        trigger: "PATCH /chw/patients/{id} with enrollment_action = DISENROLL"
        actor: Supervisor
        preconditions:
          - "Patient.enrollment_status == ENROLLED"
        side_effects:
          - "Set Patient.enrollment_status = DISENROLLED"
          - "Set CarePlanGoal.status = DEFERRED and CarePlanGoal.closed_at = current logical clock for every CarePlanGoal of this patient whose status == ACTIVE"
          - "Increment Patient.version by 1"
      - from: DISENROLLED
        to: ENROLLED
        trigger: "PATCH /chw/patients/{id} with enrollment_action = REENROLL"
        actor: Supervisor
        preconditions:
          - "Patient.enrollment_status == DISENROLLED"
        side_effects:
          - "Set Patient.enrollment_status = ENROLLED"
          - "Increment Patient.version by 1"
        note: "Closes the enrollment cycle; goals deferred by DISENROLL are NOT auto-reopened."

  # ---------------------------------------------------------------- 2 of 11
  - entity: Patient
    axis: gate_status
    shape: cyclic_parallel_axis
    initial_state: OPEN
    terminal_states: []
    note: |
      Runs independently of enrollment_status on the same row. gate_status == RECORDS_HOLD is the
      global write gate evaluated at validation ladder rung 4.
    transitions:
      - from: OPEN
        to: RECORDS_HOLD
        trigger: "POST /chw/patients/{id}/records-hold with action = PLACE"
        actor: Supervisor
        preconditions:
          - "Patient.gate_status == OPEN"
        side_effects:
          - "CASCADE LINK 1 - set Patient.gate_status = RECORDS_HOLD, set Patient.gate_reason = the supplied reason, increment Patient.version by 1"
          - "CASCADE LINK 2 (caused by link 1) - every Referral of this patient with status == SENT transitions to LAPSED with lapse_reason = RECORDS_HOLD"
          - "CASCADE LINK 3 (caused by each link-2 LAPSED transition) - that referral's hold is released on its ResourceOffering: allocated_units -= units_requested, available_units += units_requested, released_units += units_requested, offering.version += 1"
          - "CASCADE LINK 4 (caused by link 3 when that offering's available_units rises from 0 to a positive number) - the offering's availability_state flips EXHAUSTED -> AVAILABLE and exhausted_since is set to null"
          - "CASCADE LINK 5 (caused by link 4) - every Escalation whose source_flag == RESOURCE_EXHAUSTED and blocking_offering_id == that offering and status IN {OPEN_TIER_1, OPEN_TIER_2, OPEN_TIER_3} transitions to RESOLVED with resolution_reason = RESOURCE_RESTORED"
          - "Cascade links fire regardless of the write gate; the gate constrains inbound API writes only."
      - from: RECORDS_HOLD
        to: OPEN
        trigger: "POST /chw/patients/{id}/records-hold with action = RELEASE"
        actor: Supervisor
        preconditions:
          - "Patient.gate_status == RECORDS_HOLD"
        side_effects:
          - "Set Patient.gate_status = OPEN and Patient.gate_reason = null"
          - "Increment Patient.version by 1"
          - "Referrals lapsed by the PLACE cascade are NOT restored."
        note: "This endpoint is itself exempt from the rung-4 write gate; otherwise a held patient could never be released."

  # ---------------------------------------------------------------- 3 of 11
  - entity: Screening
    axis: status
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: NONE
        to: SUBMITTED
        trigger: "POST /chw/screenings when the patient has no non-SUPERSEDED Screening, or the FRESH_ANCHOR variant applies"
        actor: CHW
        preconditions:
          - "ScreeningInstrument.status == PUBLISHED"
          - "Patient.gate_status == OPEN"
        side_effects:
          - "Create the Screening with anchor_screened_at = latest_response_at = current logical clock and amendment_count = 0"
          - "Run sdoh_weighted_risk_score to set weighted_score and risk_tier"
          - "Copy weighted_score, risk_tier and anchor_screened_at onto Patient.risk_score, Patient.risk_tier, Patient.risk_tier_effective_at; increment Patient.version by 1"
          - "If the patient already had a Screening in status SUBMITTED or AMENDED, transition it to SUPERSEDED"
          - "If risk_tier == CRITICAL, open an Escalation with source_flag = CRITICAL_SDOH_FINDING, source_screening_id = this screening's id, opened_by_user_id = SYSTEM, status = OPEN_TIER_1"
          - "If Patient.enrollment_status == PROSPECTIVE and risk_tier IN {MODERATE, HIGH, CRITICAL}, set Patient.enrollment_status = ENROLLED"
      - from: SUBMITTED
        to: AMENDED
        trigger: "POST /chw/screenings when the AMENDMENT_ANCHOR variant applies (re-screen strictly inside the cadence window)"
        actor: CHW
        preconditions:
          - "The patient's current Screening has status SUBMITTED"
          - "current logical clock minus anchor_screened_at is strictly less than instrument.rescreen_cadence_days days"
          - "The submitted instrument_id equals the current Screening's instrument_id"
        side_effects:
          - "Overwrite domain_scores on the EXISTING row; anchor_screened_at is preserved unchanged"
          - "Set latest_response_at = current logical clock and increment amendment_count by 1"
          - "Recompute weighted_score and risk_tier on the existing row; increment Screening.version by 1"
          - "Copy the recomputed weighted_score and risk_tier onto the Patient, but leave Patient.risk_tier_effective_at at the preserved anchor_screened_at; increment Patient.version by 1"
          - "If the recomputed risk_tier == CRITICAL and no OPEN_TIER_n or ACKNOWLEDGED Escalation with source_screening_id == this screening exists, open one with source_flag = CRITICAL_SDOH_FINDING"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /chw/screenings when the AMENDMENT_ANCHOR variant applies again"
        actor: CHW
        preconditions:
          - "The patient's current Screening has status AMENDED"
          - "current logical clock minus anchor_screened_at is strictly less than instrument.rescreen_cadence_days days"
        side_effects:
          - "Same as SUBMITTED -> AMENDED; amendment_count increments again and anchor_screened_at stays fixed"
        note: "Self-loop; this is the cyclic element of the Screening machine."
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "POST /chw/screenings when the FRESH_ANCHOR variant applies (re-screen at or beyond the cadence window, or with a different instrument_id)"
        actor: CHW
        preconditions:
          - "A new Screening row is being created for the same patient"
        side_effects:
          - "Set status = SUPERSEDED on the prior row and increment its version by 1"
          - "The prior row's anchor_screened_at, weighted_score and risk_tier are frozen as historical record"
      - from: AMENDED
        to: SUPERSEDED
        trigger: "POST /chw/screenings when the FRESH_ANCHOR variant applies"
        actor: CHW
        preconditions:
          - "A new Screening row is being created for the same patient"
        side_effects:
          - "Set status = SUPERSEDED on the prior row and increment its version by 1"

  # ---------------------------------------------------------------- 4 of 11
  - entity: ResourceOrg
    axis: status
    shape: cyclic
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /chw/resource-orgs/{id}/suspend with action = SUSPEND"
        actor: ProgramAdmin
        preconditions:
          - "ResourceOrg.status == ACTIVE"
        side_effects:
          - "Set ResourceOrg.status = SUSPENDED and increment its version by 1"
          - "Existing referrals against this organization's offerings are left untouched and may still be responded to, delivered and closed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /chw/resource-orgs/{id}/suspend with action = REINSTATE"
        actor: ProgramAdmin
        preconditions:
          - "ResourceOrg.status == SUSPENDED"
        side_effects:
          - "Set ResourceOrg.status = ACTIVE and increment its version by 1"

  # ---------------------------------------------------------------- 5 of 11
  - entity: Referral
    axis: status
    shape: branching_cyclic
    initial_state: SENT
    terminal_states: [CLOSED, LAPSED]
    transitions:
      - from: NONE
        to: SENT
        trigger: "POST /chw/referrals"
        actor: CHW
        preconditions:
          - "Patient.enrollment_status == ENROLLED"
          - "Patient.gate_status == OPEN"
          - "ResourceOrg.status == ACTIVE for the offering's organization"
          - "The patient passes every EligibilityCriterion of the offering in evaluation_rank order"
          - "ResourceOffering.available_units >= units_requested"
        side_effects:
          - "CASCADE LINK 1 - create the Referral in SENT with sent_at = current logical clock, root_referral_id = its own id, parent_referral_id = null, reroute_count = 0; compute ack_deadline_at and hold_expires_at; place the hold: offering.allocated_units += units_requested, offering.available_units -= units_requested, offering.lifetime_allocated_units += units_requested, offering.version += 1"
          - "CASCADE LINK 2 (caused by link 1 when available_units reaches exactly 0) - offering.availability_state = EXHAUSTED and offering.exhausted_since = current logical clock"
          - "CASCADE LINK 3 (caused by link 2) - open an Escalation with source_flag = RESOURCE_EXHAUSTED, blocking_offering_id = this offering, patient_id = this referral's patient, opened_by_user_id = SYSTEM, status = OPEN_TIER_1"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /chw/referrals/{id}/respond with decision = ACCEPTED"
        actor: ResourcePartner
        preconditions:
          - "Referral.status == SENT"
          - "The acting ResourcePartner's X-User-ID equals the offering's resource_org_id"
        side_effects:
          - "Set Referral.status = ACCEPTED; the hold on the offering is retained unchanged"
          - "Increment Referral.version by 1"
      - from: SENT
        to: DECLINED
        trigger: "POST /chw/referrals/{id}/respond with decision = DECLINED"
        actor: ResourcePartner
        preconditions:
          - "Referral.status == SENT"
          - "The acting ResourcePartner's X-User-ID equals the offering's resource_org_id"
        side_effects:
          - "Set Referral.status = DECLINED and decline_reason = the supplied reason"
          - "Release the hold: offering.allocated_units -= units_requested, offering.available_units += units_requested, offering.released_units += units_requested, offering.version += 1"
          - "If that release raises the offering's available_units from 0 to a positive number, flip availability_state EXHAUSTED -> AVAILABLE, clear exhausted_since, and resolve every Escalation with source_flag == RESOURCE_EXHAUSTED and blocking_offering_id == this offering whose status is an OPEN_TIER_n, setting resolution_reason = RESOURCE_RESTORED"
          - "Increment Patient.unfulfilled_referral_count by 1; when it reaches UNFULFILLED_REFERRAL_ESCALATION_THRESHOLD (2), open an Escalation with source_flag = REFERRAL_UNFULFILLED and source_referral_id = this referral"
      - from: SENT
        to: LAPSED
        trigger: "POST /chw/ops/run-sweep with sweep_type = REFERRAL_LAPSE, or the records-hold cascade"
        actor: system
        preconditions:
          - "Referral.status == SENT"
          - "For the sweep: current logical clock is strictly after ack_deadline_at. For the cascade: the patient just entered RECORDS_HOLD."
        side_effects:
          - "Set Referral.status = LAPSED and lapse_reason = ACK_SLA_EXPIRED (sweep) or RECORDS_HOLD (cascade)"
          - "Release the hold: offering.allocated_units -= units_requested, offering.available_units += units_requested, offering.released_units += units_requested, offering.version += 1"
          - "If that release raises available_units from 0 to a positive number, flip availability_state EXHAUSTED -> AVAILABLE, clear exhausted_since, and resolve the offering's open RESOURCE_EXHAUSTED escalations with resolution_reason = RESOURCE_RESTORED"
          - "Increment Patient.unfulfilled_referral_count by 1; when it reaches 2, open an Escalation with source_flag = REFERRAL_UNFULFILLED"
      - from: ACCEPTED
        to: SERVICE_DELIVERED
        trigger: "POST /chw/referrals/{id}/deliver"
        actor: ResourcePartner
        preconditions:
          - "Referral.status == ACCEPTED"
          - "The acting ResourcePartner's X-User-ID equals the offering's resource_org_id"
        side_effects:
          - "Set Referral.status = SERVICE_DELIVERED and delivered_at = current logical clock"
          - "Consume the hold: offering.allocated_units -= units_requested, offering.delivered_units += units_requested, offering.version += 1. available_units is NOT increased; delivered units leave the pool permanently."
      - from: ACCEPTED
        to: LAPSED
        trigger: "POST /chw/ops/run-sweep with sweep_type = OFFERING_HOLD_EXPIRY"
        actor: system
        preconditions:
          - "Referral.status == ACCEPTED"
          - "current logical clock is strictly after hold_expires_at"
        side_effects:
          - "Set Referral.status = LAPSED and lapse_reason = HOLD_EXPIRED"
          - "Expire the hold: offering.allocated_units -= units_requested, offering.available_units += units_requested, offering.expired_units += units_requested, offering.version += 1"
          - "Increment Patient.unfulfilled_referral_count by 1; when it reaches 2, open an Escalation with source_flag = REFERRAL_UNFULFILLED"
        note: "Holds expire lazily - only when a sweep runs, never on a read."
      - from: SERVICE_DELIVERED
        to: CLOSED
        trigger: "POST /chw/referrals/{id}/close"
        actor: CHW
        preconditions:
          - "Referral.status == SERVICE_DELIVERED"
        side_effects:
          - "Set Referral.status = CLOSED, closed_at = current logical clock, outcome_note = the supplied note"
          - "The loop is counted as closed by program_report_rollups"
      - from: DECLINED
        to: CLOSED
        trigger: "POST /chw/referrals/{id}/close"
        actor: CHW
        preconditions:
          - "Referral.status == DECLINED"
        side_effects:
          - "Set Referral.status = CLOSED, closed_at = current logical clock, outcome_note = the supplied note"
          - "Counted as closed-without-delivery by program_report_rollups"
      - from: DECLINED
        to: DECLINED
        trigger: "POST /chw/referrals/{id}/reroute (the DECLINED row itself is not re-stated; a NEW Referral is created in SENT)"
        actor: CHW
        preconditions:
          - "Referral.status == DECLINED"
          - "The chain's reroute_count is strictly less than MAX_REROUTE_COUNT (2)"
          - "The alternate offering belongs to a ResourceOrg with status == ACTIVE"
        side_effects:
          - "Create a new Referral in SENT with parent_referral_id = this referral's id, root_referral_id = this referral's root_referral_id, reroute_count = chain reroute_count + 1"
          - "Write the incremented reroute_count onto EVERY Referral row sharing this root_referral_id, incrementing each row's version by 1"
          - "Place a hold on the alternate offering exactly as a root referral does, including the EXHAUSTED cascade"
        note: "This is the cycle: the chain returns to SENT on a new row while the DECLINED predecessor is retained for audit."

  # ---------------------------------------------------------------- 6 of 11
  - entity: HomeVisit
    axis: scheduling_status
    shape: branching
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EN_ROUTE
        trigger: "POST /chw/home-visits/{id}/en-route"
        actor: CHW
        preconditions:
          - "HomeVisit.scheduling_status == SCHEDULED"
          - "The acting CHW's X-User-ID equals assigned_chw_id"
        side_effects:
          - "Set scheduling_status = EN_ROUTE and increment version by 1"
      - from: EN_ROUTE
        to: COMPLETED
        trigger: "POST /chw/home-visits/{id}/complete"
        actor: CHW
        preconditions:
          - "HomeVisit.scheduling_status == EN_ROUTE"
          - "The acting CHW's X-User-ID equals assigned_chw_id"
        side_effects:
          - "Set scheduling_status = COMPLETED and completed_at = current logical clock; this starts the ATTESTATION_WINDOW_HOURS (72) clock on the documentation axis"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /chw/home-visits/{id}/no-show"
        actor: CHW
        preconditions:
          - "HomeVisit.scheduling_status == SCHEDULED"
        side_effects:
          - "Set scheduling_status = NO_SHOW; documentation_status remains DRAFT and can never be attested"
      - from: EN_ROUTE
        to: NO_SHOW
        trigger: "POST /chw/home-visits/{id}/no-show"
        actor: CHW
        preconditions:
          - "HomeVisit.scheduling_status == EN_ROUTE"
        side_effects:
          - "Set scheduling_status = NO_SHOW"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /chw/home-visits/{id}/cancel"
        actor: CHW
        preconditions:
          - "HomeVisit.scheduling_status == SCHEDULED"
        side_effects:
          - "Set scheduling_status = CANCELLED; the visit's slot no longer participates in visit-slot overlap checks"
        note: "Exempt from the rung-4 write gate so an in-flight visit on a newly held patient can always be stood down."
      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /chw/home-visits/{id}/cancel"
        actor: CHW
        preconditions:
          - "HomeVisit.scheduling_status == EN_ROUTE"
        side_effects:
          - "Set scheduling_status = CANCELLED; the slot is freed for overlap purposes"

  # ---------------------------------------------------------------- 7 of 11
  - entity: HomeVisit
    axis: documentation_status
    shape: cyclic_parallel_axis
    initial_state: DRAFT
    terminal_states: [VOIDED]
    note: |
      Independent of scheduling_status on the same row. Billing depends on THIS axis: an Encounter
      linked to a home visit may only be submitted when documentation_status is ATTESTED or AMENDED.
    transitions:
      - from: DRAFT
        to: ATTESTED
        trigger: "POST /chw/home-visits/{id}/attest"
        actor: CHW
        preconditions:
          - "HomeVisit.documentation_status == DRAFT"
          - "HomeVisit.scheduling_status == COMPLETED"
          - "The acting CHW's X-User-ID equals assigned_chw_id"
          - "current logical clock minus completed_at is less than or equal to ATTESTATION_WINDOW_HOURS (72) hours"
        side_effects:
          - "Set documentation_status = ATTESTED and attested_at = current logical clock"
      - from: ATTESTED
        to: AMENDED
        trigger: "POST /chw/home-visits/{id}/documentation-revision with action = AMEND"
        actor: CHW
        preconditions:
          - "HomeVisit.documentation_status == ATTESTED"
          - "current logical clock minus attested_at is less than or equal to AMENDMENT_WINDOW_DAYS (30) days"
          - "The acting CHW's X-User-ID equals assigned_chw_id"
        side_effects:
          - "Set documentation_status = AMENDED, overwrite visit_note, increment amendment_count by 1"
      - from: AMENDED
        to: AMENDED
        trigger: "POST /chw/home-visits/{id}/documentation-revision with action = AMEND"
        actor: CHW
        preconditions:
          - "HomeVisit.documentation_status == AMENDED"
          - "current logical clock minus attested_at is less than or equal to 30 days"
        side_effects:
          - "Overwrite visit_note and increment amendment_count by 1"
        note: "Self-loop; the amendment window is always measured from the ORIGINAL attested_at, never from the last amendment."
      - from: ATTESTED
        to: VOIDED
        trigger: "POST /chw/home-visits/{id}/documentation-revision with action = VOID"
        actor: Supervisor
        preconditions:
          - "HomeVisit.documentation_status == ATTESTED"
        side_effects:
          - "Set documentation_status = VOIDED"
          - "Every Encounter with home_visit_id == this visit and status == DRAFT is voided (status = VOIDED)"
      - from: AMENDED
        to: VOIDED
        trigger: "POST /chw/home-visits/{id}/documentation-revision with action = VOID"
        actor: Supervisor
        preconditions:
          - "HomeVisit.documentation_status == AMENDED"
        side_effects:
          - "Set documentation_status = VOIDED"
          - "Every Encounter with home_visit_id == this visit and status == DRAFT is voided (status = VOIDED)"

  # ---------------------------------------------------------------- 8 of 11
  - entity: CarePlanGoal
    axis: status
    shape: branching_cyclic
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: MET
        trigger: "POST /chw/goals/{id}/close with outcome = MET"
        actor: CHW
        preconditions:
          - "CarePlanGoal.status == ACTIVE"
          - "CarePlanGoal.progress_pct == 100.0"
        side_effects:
          - "Set status = MET and closed_at = current logical clock"
      - from: ACTIVE
        to: NOT_MET
        trigger: "POST /chw/goals/{id}/close with outcome = NOT_MET"
        actor: CHW
        preconditions:
          - "CarePlanGoal.status == ACTIVE"
        side_effects:
          - "Set status = NOT_MET and closed_at = current logical clock"
          - "Open an Escalation with source_flag = GOAL_NOT_MET, patient_id = this goal's patient, opened_by_user_id = the acting X-User-ID, status = OPEN_TIER_1"
      - from: ACTIVE
        to: DEFERRED
        trigger: "POST /chw/goals/{id}/close with outcome = DEFERRED, or the Patient DISENROLL cascade"
        actor: CHW
        preconditions:
          - "CarePlanGoal.status == ACTIVE"
        side_effects:
          - "Set status = DEFERRED and closed_at = current logical clock"
      - from: MET
        to: ACTIVE
        trigger: "POST /chw/goals/{id}/reopen"
        actor: CHW
        preconditions:
          - "CarePlanGoal.status == MET"
          - "Patient.enrollment_status == ENROLLED"
        side_effects:
          - "Set status = ACTIVE, closed_at = null, increment reopen_count by 1"
          - "Recompute review_due_at as the current logical clock plus review_cycle_days"
      - from: NOT_MET
        to: ACTIVE
        trigger: "POST /chw/goals/{id}/reopen"
        actor: CHW
        preconditions:
          - "CarePlanGoal.status == NOT_MET"
          - "Patient.enrollment_status == ENROLLED"
        side_effects:
          - "Set status = ACTIVE, closed_at = null, increment reopen_count by 1"
          - "Recompute review_due_at as the current logical clock plus review_cycle_days"
      - from: DEFERRED
        to: ACTIVE
        trigger: "POST /chw/goals/{id}/reopen"
        actor: CHW
        preconditions:
          - "CarePlanGoal.status == DEFERRED"
          - "Patient.enrollment_status == ENROLLED"
        side_effects:
          - "Set status = ACTIVE, closed_at = null, increment reopen_count by 1"
          - "Recompute review_due_at as the current logical clock plus review_cycle_days"
        note: "Closes the goal cycle; a goal deferred by a DISENROLL cascade can only be reopened after the patient is REENROLLed."

  # ---------------------------------------------------------------- 9 of 11
  - entity: Encounter
    axis: status
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /chw/encounters/{id}/submit"
        actor: CHW
        preconditions:
          - "Encounter.status == DRAFT"
          - "The acting CHW's X-User-ID equals Encounter.chw_id"
          - "If home_visit_id is not null, that HomeVisit.documentation_status IN {ATTESTED, AMENDED}"
        side_effects:
          - "Set status = SUBMITTED and submitted_at = current logical clock"
          - "funding_source stays UNFUNDED; the encounter is now eligible for the FINAL billing input set"
      - from: SUBMITTED
        to: LOCKED
        trigger: "POST /chw/payer-claims with basis = FINAL, or POST /chw/grant-charge-lines"
        actor: system
        preconditions:
          - "Encounter.status == SUBMITTED"
          - "Encounter.funding_source == UNFUNDED"
        side_effects:
          - "Set status = LOCKED"
          - "Set funding_source = PAYER and funding_claim_id = the claim's id (payer path), or funding_source = GRANT (grant path)"
          - "Increment Encounter.version by 1"
      - from: LOCKED
        to: SUBMITTED
        trigger: "POST /chw/grant-charge-lines/{id}/reverse, or POST /chw/payer-claims/{id}/appeal-decision with decision = UPHELD"
        actor: system
        preconditions:
          - "Encounter.status == LOCKED"
        side_effects:
          - "Set status = SUBMITTED, funding_source = UNFUNDED, funding_claim_id = null"
          - "Increment Encounter.version by 1; the minutes return to the unfunded bucket with zero drift under encounter_minute_conservation"
        note: "This is the cycle: minutes may be carved, released by a compensating action, and carved again to the other funding source."
      - from: DRAFT
        to: VOIDED
        trigger: "POST /chw/encounters/{id}/void, or the HomeVisit documentation VOID cascade"
        actor: Supervisor
        preconditions:
          - "Encounter.status == DRAFT"
        side_effects:
          - "Set status = VOIDED; all minute fields are retained but excluded from every billing input set"
      - from: SUBMITTED
        to: VOIDED
        trigger: "POST /chw/encounters/{id}/void"
        actor: Supervisor
        preconditions:
          - "Encounter.status == SUBMITTED"
        side_effects:
          - "Set status = VOIDED"
      - from: LOCKED
        to: VOIDED
        trigger: "POST /chw/encounters/{id}/void"
        actor: Supervisor
        preconditions:
          - "Encounter.status == LOCKED"
          - "Encounter.funding_source == GRANT (a payer-locked encounter cannot be voided; the claim must be resolved first)"
        side_effects:
          - "CASCADE LINK 1 - set Encounter.status = VOIDED and funding_source = UNFUNDED"
          - "CASCADE LINK 2 (caused by link 1) - the GrantChargeLine whose encounter_id == this encounter and status == POSTED is reversed: reversed_at = current logical clock, reversal_reason = ENCOUNTER_VOIDED, status becomes REVERSED"
          - "CASCADE LINK 3 (caused by link 2) - GrantAward.committed_cents -= that line's total_amount_cents, GrantAward.remaining_budget_cents += the same amount, GrantAward.version += 1"

  # --------------------------------------------------------------- 10 of 11
  - entity: PayerClaim
    axis: status
    shape: branching
    initial_state: SUBMITTED
    terminal_states: [PAID, OVERTURNED, UPHELD]
    transitions:
      - from: NONE
        to: SUBMITTED
        trigger: "POST /chw/payer-claims"
        actor: BillingSpecialist
        preconditions:
          - "Patient.gate_status == OPEN"
          - "claimed_minutes computed under the selected basis is greater than or equal to CM_CODE_MINUTE_THRESHOLD (60)"
        side_effects:
          - "Create the claim with computed claimed_minutes, claimed_encounter_count, billing_code, units and allowed_amount_cents"
          - "When basis == FINAL, every Encounter in the input set transitions SUBMITTED -> LOCKED with funding_source = PAYER and funding_claim_id = this claim's id"
          - "When basis == PROVISIONAL, NO encounter is mutated; the claim is a non-binding estimate"
      - from: SUBMITTED
        to: PAID
        trigger: "POST /chw/payer-claims/{id}/adjudicate with outcome = PAID"
        actor: BillingSpecialist
        preconditions:
          - "PayerClaim.status == SUBMITTED"
          - "PayerClaim.basis == FINAL"
        side_effects:
          - "Set status = PAID; the locked encounters stay LOCKED with funding_source PAYER"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /chw/payer-claims/{id}/adjudicate with outcome = DENIED"
        actor: BillingSpecialist
        preconditions:
          - "PayerClaim.status == SUBMITTED"
          - "PayerClaim.basis == FINAL"
        side_effects:
          - "Set status = DENIED, denial_reason = the supplied reason, denied_at = current logical clock"
          - "Encounters stay LOCKED pending appeal"
      - from: DENIED
        to: APPEALED
        trigger: "POST /chw/payer-claims/{id}/appeal"
        actor: BillingSpecialist
        preconditions:
          - "PayerClaim.status == DENIED"
          - "current logical clock minus denied_at is less than or equal to CLAIM_APPEAL_WINDOW_DAYS (60) days"
        side_effects:
          - "Set status = APPEALED and appealed_at = current logical clock"
      - from: APPEALED
        to: OVERTURNED
        trigger: "POST /chw/payer-claims/{id}/appeal-decision with decision = OVERTURNED"
        actor: BillingSpecialist
        preconditions:
          - "PayerClaim.status == APPEALED"
        side_effects:
          - "Set status = OVERTURNED; encounters stay LOCKED with funding_source PAYER"
      - from: APPEALED
        to: UPHELD
        trigger: "POST /chw/payer-claims/{id}/appeal-decision with decision = UPHELD"
        actor: BillingSpecialist
        preconditions:
          - "PayerClaim.status == APPEALED"
        side_effects:
          - "Set status = UPHELD"
          - "COMPENSATION - every Encounter with funding_claim_id == this claim transitions LOCKED -> SUBMITTED with funding_source = UNFUNDED and funding_claim_id = null, restoring encounter_minute_conservation to its pre-claim distribution"
          - "The month becomes claimable again: a prior FINAL claim in status UPHELD does not block a new FINAL claim"

  # --------------------------------------------------------------- 11 of 11
  - entity: Escalation
    axis: status
    shape: fan_out_with_auto_promotion
    initial_state: OPEN_TIER_1
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN_TIER_1
        to: OPEN_TIER_2
        trigger: "POST /chw/ops/run-sweep with sweep_type = ESCALATION_PROMOTION"
        actor: system
        preconditions:
          - "Escalation.status == OPEN_TIER_1"
          - "current logical clock is strictly after ack_deadline_at"
        side_effects:
          - "Set status = OPEN_TIER_2, current_tier = 2, tier_entered_at = current logical clock, promotion_count += 1"
          - "Recompute ack_deadline_at with TIER2_ACK_SLA_HOURS (24)"
      - from: OPEN_TIER_2
        to: OPEN_TIER_3
        trigger: "POST /chw/ops/run-sweep with sweep_type = ESCALATION_PROMOTION"
        actor: system
        preconditions:
          - "Escalation.status == OPEN_TIER_2"
          - "current logical clock is strictly after ack_deadline_at"
        side_effects:
          - "Set status = OPEN_TIER_3, current_tier = 3, tier_entered_at = current logical clock, promotion_count += 1"
          - "Recompute ack_deadline_at with TIER3_ACK_SLA_HOURS (8)"
        note: "OPEN_TIER_3 is the ceiling: MAX_ESCALATION_TIER is 3, so a later sweep leaves an over-deadline OPEN_TIER_3 escalation untouched (no state change, no version bump)."
      - from: OPEN_TIER_1
        to: ACKNOWLEDGED
        trigger: "POST /chw/escalations/{id}/acknowledge"
        actor: Supervisor
        preconditions:
          - "Escalation.status == OPEN_TIER_1"
          - "The acting X-User-ID differs from Escalation.opened_by_user_id"
        side_effects:
          - "Set status = ACKNOWLEDGED, acknowledged_by_user_id = the acting X-User-ID; current_tier freezes at 1"
      - from: OPEN_TIER_2
        to: ACKNOWLEDGED
        trigger: "POST /chw/escalations/{id}/acknowledge"
        actor: Supervisor
        preconditions:
          - "Escalation.status == OPEN_TIER_2"
          - "The acting X-User-ID differs from Escalation.opened_by_user_id"
        side_effects:
          - "Set status = ACKNOWLEDGED, acknowledged_by_user_id = the acting X-User-ID; current_tier freezes at 2"
      - from: OPEN_TIER_3
        to: ACKNOWLEDGED
        trigger: "POST /chw/escalations/{id}/acknowledge"
        actor: Supervisor
        preconditions:
          - "Escalation.status == OPEN_TIER_3"
          - "The acting X-User-ID differs from Escalation.opened_by_user_id"
        side_effects:
          - "Set status = ACKNOWLEDGED, acknowledged_by_user_id = the acting X-User-ID; current_tier freezes at 3"
      - from: ACKNOWLEDGED
        to: RESOLVED
        trigger: "POST /chw/escalations/{id}/resolve"
        actor: Supervisor
        preconditions:
          - "Escalation.status == ACKNOWLEDGED"
        side_effects:
          - "Set status = RESOLVED and resolution_reason = MANUAL_RESOLUTION"
      - from: OPEN_TIER_1
        to: RESOLVED
        trigger: "System auto-resolution when a RESOURCE_EXHAUSTED escalation's blocking offering returns to AVAILABLE"
        actor: system
        preconditions:
          - "Escalation.status == OPEN_TIER_1"
          - "Escalation.source_flag == RESOURCE_EXHAUSTED"
          - "The offering named by blocking_offering_id just flipped availability_state EXHAUSTED -> AVAILABLE"
        side_effects:
          - "Set status = RESOLVED and resolution_reason = RESOURCE_RESTORED; acknowledged_by_user_id stays null"
      - from: OPEN_TIER_2
        to: RESOLVED
        trigger: "System auto-resolution when a RESOURCE_EXHAUSTED escalation's blocking offering returns to AVAILABLE"
        actor: system
        preconditions:
          - "Escalation.status == OPEN_TIER_2"
          - "Escalation.source_flag == RESOURCE_EXHAUSTED"
        side_effects:
          - "Set status = RESOLVED and resolution_reason = RESOURCE_RESTORED"
      - from: OPEN_TIER_3
        to: RESOLVED
        trigger: "System auto-resolution when a RESOURCE_EXHAUSTED escalation's blocking offering returns to AVAILABLE"
        actor: system
        preconditions:
          - "Escalation.status == OPEN_TIER_3"
          - "Escalation.source_flag == RESOURCE_EXHAUSTED"
        side_effects:
          - "Set status = RESOLVED and resolution_reason = RESOURCE_RESTORED"

# ===========================================================================
# §1.2.1 CONCURRENCY RULES (OCC on a parent entity's `version`)
# ===========================================================================
concurrency_rules:
  - rule_id: referral-create-stale-offering
    parent_entity: ResourceOffering
    write_endpoint: "POST /chw/referrals"
    occ_field: "expected_offering_version"
    description: |
      Creating a Referral against a ResourceOffering whose version has advanced since the client
      last observed it is rejected. Every hold placement, release, expiry and delivery bumps the
      offering's version, so a client working from a stale view of the inventory would otherwise
      place a hold against a unit count that no longer exists.
    error_id: ERR_STALE_OFFERING_VERSION
    http_status: 412

  - rule_id: charge-line-create-stale-award
    parent_entity: GrantAward
    write_endpoint: "POST /chw/grant-charge-lines"
    occ_field: "expected_grant_award_version"
    description: |
      Posting a GrantChargeLine against a GrantAward whose version has advanced since the client
      last observed it is rejected. Each posted or reversed line moves committed_cents and therefore
      changes both the remaining budget and the rate tier the next line would receive.
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412

  - rule_id: screening-create-stale-patient
    parent_entity: Patient
    write_endpoint: "POST /chw/screenings"
    occ_field: "expected_patient_version"
    description: |
      Submitting a Screening against a Patient whose version has advanced since the client last
      observed it is rejected. A screening legitimately supersedes or amends the patient's prior
      screening and rewrites risk_score, risk_tier and risk_tier_effective_at, so a writer holding
      a stale view of the patient would silently overwrite a newer risk assessment.
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412

# ===========================================================================
# §1.3 CALCULATION RULES TABLE (9 rules; 6 carry divergent dual variants)
# ===========================================================================
calculations:

  - name: sdoh_weighted_risk_score
    trigger: "POST /chw/screenings — runs on the Screening row created (FRESH_ANCHOR) or amended (AMENDMENT_ANCHOR), then copies onto the Patient"
    algorithm: weighted_scoring
    formula: |
      # domain_scores: map domain -> integer in [0, 4]
      # domain_weights: map domain -> integer weight, summing to 100
      normalized = 0
      for d in domain_weights.keys():                       # key sets must match exactly
          normalized += (domain_scores[d] / SCREENING_DOMAIN_SCORE_MAX) * domain_weights[d]
      weighted_score = round_half_up(normalized, 2)         # 0.00 .. 100.00

      if   weighted_score >= RISK_TIER_CRITICAL_MIN: risk_tier = CRITICAL
      elif weighted_score >= RISK_TIER_HIGH_MIN:     risk_tier = HIGH
      elif weighted_score >= RISK_TIER_MODERATE_MIN: risk_tier = MODERATE
      else:                                          risk_tier = LOW

      # --- anchoring fork (the dual variant) ---
      current = the patient's Screening whose status IN {SUBMITTED, AMENDED}
                (at most one exists at any time; there is no tie to break)
      if current is null:
          variant = FRESH_ANCHOR
      elif submitted instrument_id != current.instrument_id:
          variant = FRESH_ANCHOR
      elif (now - current.anchor_screened_at) < instrument.rescreen_cadence_days days:
          variant = AMENDMENT_ANCHOR
      else:
          variant = FRESH_ANCHOR
    input_set: |
      Exactly one Screening row participates: the patient's Screening with status IN {SUBMITTED, AMENDED}.
      SUPERSEDED rows never participate. The instrument used is the one named by the request's
      instrument_id and it MUST have status == PUBLISHED.
    constants:
      SCREENING_DOMAIN_SCORE_MAX: 4
      SCREENING_WEIGHT_SUM_REQUIRED: 100
      RISK_TIER_MODERATE_MIN: 25
      RISK_TIER_HIGH_MIN: 50
      RISK_TIER_CRITICAL_MIN: 75
      DEFAULT_RESCREEN_CADENCE_DAYS: 90
    precision: "weighted_score to 2 decimal places, round_half_up. Tier comparisons use >= on the rounded value."
    variants:
      - name: AMENDMENT_ANCHOR
        when: "A re-screen with the SAME instrument_id arrives STRICTLY INSIDE the cadence window: (now - anchor_screened_at) < rescreen_cadence_days days."
        difference: |
          No new Screening row is created. The existing row is rewritten in place: domain_scores,
          weighted_score, risk_tier and latest_response_at change, amendment_count increments, and
          anchor_screened_at is PRESERVED. Patient.risk_tier_effective_at therefore keeps pointing at
          the ORIGINAL screening instant, so the patient's screening coverage window does not restart.
      - name: FRESH_ANCHOR
        when: "A re-screen arrives AT or BEYOND the cadence boundary ((now - anchor_screened_at) >= rescreen_cadence_days days), or with a different instrument_id, or the patient has no non-SUPERSEDED screening."
        difference: |
          A NEW Screening row is created with anchor_screened_at = now and amendment_count = 0; the
          prior row transitions to SUPERSEDED. Patient.risk_tier_effective_at RE-ANCHORS to now, which
          restarts the SCREENING_COVERAGE_WINDOW_DAYS clock used by program_report_rollups.
    boundary_note: "At exactly rescreen_cadence_days elapsed the comparison `< cadence` is false, so the FRESH_ANCHOR variant applies. The cadence window is half-open on its upper end."

  - name: referral_ack_deadline
    trigger: "POST /chw/referrals and POST /chw/referrals/{id}/reroute — computes ack_deadline_at and hold_expires_at on the Referral being created"
    algorithm: threshold
    formula: |
      sla_hours = ACK_SLA_HOURS_ROUTINE  if urgency == ROUTINE
                  ACK_SLA_HOURS_URGENT   if urgency == URGENT
                  ACK_SLA_HOURS_EMERGENT if urgency == EMERGENT

      if parent_referral_id is null:                      # variant FRESH_SLA
          ack_deadline_at = sent_at + sla_hours hours
      else:                                               # variant ROOT_CHAIN_BUDGET
          root = the Referral whose id == this row's root_referral_id
          ack_deadline_at = root.sent_at + sla_hours hours

      hold_expires_at = sent_at + REFERRAL_HOLD_EXPIRY_HOURS hours   # always from THIS row's sent_at
    input_set: "The referral being created plus, for a re-routed child, the single root Referral identified by root_referral_id."
    constants:
      ACK_SLA_HOURS_ROUTINE: 72
      ACK_SLA_HOURS_URGENT: 24
      ACK_SLA_HOURS_EMERGENT: 4
      REFERRAL_HOLD_EXPIRY_HOURS: 168
    precision: "Whole hours added to an ISO 8601 UTC instant; the result carries three fractional-second digits."
    variants:
      - name: FRESH_SLA
        when: "The referral is a root referral (parent_referral_id is null)."
        difference: "The acknowledgement clock starts at this referral's own sent_at, so the partner always gets the full SLA window."
      - name: ROOT_CHAIN_BUDGET
        when: "The referral was created by POST /chw/referrals/{id}/reroute (parent_referral_id is not null)."
        difference: |
          The whole re-route chain shares ONE acknowledgement budget anchored at the ROOT referral's
          sent_at. A re-routed referral therefore inherits an already-consumed window and can be born
          with ack_deadline_at already in the past, in which case the very next REFERRAL_LAPSE sweep
          lapses it. hold_expires_at, by contrast, always restarts from the child's own sent_at.

  - name: billable_minutes_monthly_rollup
    trigger: "POST /chw/payer-claims — computes claimed_minutes, claimed_encounter_count, billing_code, units and allowed_amount_cents on the claim"
    algorithm: aggregation
    formula: |
      # STEP 1 - per-encounter rounding (this order is PINNED)
      def encounter_billable(e):
          raw = e.direct_minutes + e.indirect_minutes + e.documentation_minutes   # travel excluded
          return round_half_up(raw / MINUTE_ROUNDING_INCREMENT) * MINUTE_ROUNDING_INCREMENT

      # STEP 2 - sum the ALREADY-ROUNDED per-encounter values
      claimed_minutes = sum(encounter_billable(e) for e in input_set)
      claimed_encounter_count = count(input_set)

      # STEP 3 - threshold-driven code selection
      if   claimed_minutes >= CM_EXTENDED_MINUTE_THRESHOLD: billing_code = CM_CODE_EXTENDED
      elif claimed_minutes >= CM_CODE_MINUTE_THRESHOLD:     billing_code = CM_CODE_STANDARD
      else:                                                 reject with ERR_MINUTE_THRESHOLD_NOT_MET

      # STEP 4 - units and money
      units = floor(claimed_minutes / CLAIM_UNIT_MINUTES)
      allowed_amount_cents = units * CLAIM_ALLOWED_CENTS_PER_UNIT
    input_set: |
      Encounters with patient_id == claim.patient_id AND service_month == claim.service_month AND
      funding_source == UNFUNDED, filtered by status according to the basis variant. Encounters in
      status VOIDED or LOCKED never participate. Ordering is irrelevant because the aggregate is a
      plain sum of independently rounded values.
    constants:
      MINUTE_ROUNDING_INCREMENT: 6
      CM_CODE_MINUTE_THRESHOLD: 60
      CM_EXTENDED_MINUTE_THRESHOLD: 120
      CM_CODE_STANDARD: "CM-60"
      CM_CODE_EXTENDED: "CM-120"
      CLAIM_UNIT_MINUTES: 15
      CLAIM_ALLOWED_CENTS_PER_UNIT: 2150
    precision: |
      ROUND PER ENCOUNTER, THEN SUM — never sum then round. round_half_up on the quotient
      raw / 6 means a raw value congruent to 3 modulo 6 rounds UP (raw 21 -> 24, raw 27 -> 30).
      Money is whole cents; units uses floor, not rounding.
    variants:
      - name: PROVISIONAL
        when: "basis == PROVISIONAL on POST /chw/payer-claims."
        difference: |
          Input set includes Encounters with status IN {DRAFT, SUBMITTED}. No encounter is mutated:
          nothing transitions to LOCKED and funding_source stays UNFUNDED, so the same minutes remain
          claimable later. The claim is a non-binding estimate and can never be adjudicated.
      - name: FINAL
        when: "basis == FINAL on POST /chw/payer-claims."
        difference: |
          Input set includes ONLY Encounters with status == SUBMITTED — DRAFT encounters are excluded,
          which makes claimed_minutes strictly smaller whenever any draft time exists. Every included
          encounter transitions SUBMITTED -> LOCKED with funding_source = PAYER and funding_claim_id set.

  - name: travel_mileage_reimbursement
    trigger: "POST /chw/encounters (PER_ENCOUNTER_MARGINAL, stored on Encounter.travel_reimbursement_cents) and GET /chw/reports/program-summary (MONTHLY_AGGREGATED_MARGINAL, reported as travel_reimbursement_monthly_cents)"
    algorithm: tiered_pricing
    formula: |
      def marginal_cents(miles):
          band1 = min(miles, MILEAGE_BAND_1_MAX_MILES)                                   # 0 .. 10
          band2 = min(max(miles - MILEAGE_BAND_1_MAX_MILES, 0),
                      MILEAGE_BAND_2_MAX_MILES - MILEAGE_BAND_1_MAX_MILES)               # 10 .. 30
          band3 = max(miles - MILEAGE_BAND_2_MAX_MILES, 0)                               # above 30
          gross = band1 * MILEAGE_RATE_BAND_1_CENTS
                + band2 * MILEAGE_RATE_BAND_2_CENTS
                + band3 * MILEAGE_RATE_BAND_3_CENTS
          return min(round_half_up(gross), TRAVEL_REIMBURSEMENT_CAP_CENTS)
    input_set: |
      PER_ENCOUNTER_MARGINAL: the single Encounter being created, using its own travel_miles.
      MONTHLY_AGGREGATED_MARGINAL: all Encounters with status IN {SUBMITTED, LOCKED} whose patient is
      in the report's patient denominator and whose service_month equals the report's service_month.
      Encounters in status DRAFT or VOIDED are excluded from the monthly variant.
    constants:
      MILEAGE_BAND_1_MAX_MILES: 10
      MILEAGE_BAND_2_MAX_MILES: 30
      MILEAGE_RATE_BAND_1_CENTS: 67
      MILEAGE_RATE_BAND_2_CENTS: 55
      MILEAGE_RATE_BAND_3_CENTS: 40
      TRAVEL_REIMBURSEMENT_CAP_CENTS: 5000
    precision: "Rates are marginal, never average: each band's rate applies only to the miles falling inside that band. Result is whole cents, round_half_up, then capped."
    variants:
      - name: PER_ENCOUNTER_MARGINAL
        when: "Computing Encounter.travel_reimbursement_cents at encounter creation."
        difference: "marginal_cents() is applied to ONE encounter's travel_miles, and the 5000-cent cap binds per encounter."
      - name: MONTHLY_AGGREGATED_MARGINAL
        when: "Computing travel_reimbursement_monthly_cents in GET /chw/reports/program-summary."
        difference: |
          marginal_cents() is applied ONCE to the SUM of the month's travel_miles, so later miles fall
          into cheaper bands. Two 10-mile encounters yield 670 + 670 = 1340 cents per-encounter but
          10*67 + 10*55 = 1220 cents aggregated. The cap binds once on the monthly total, not per row.

  - name: goal_progress_pct
    trigger: "POST /chw/goals (initial value) and POST /chw/goals/{id}/progress (every update)"
    algorithm: threshold
    formula: |
      if direction == INCREASE_GOOD:
          raw = 100 * (current_value - baseline_value) / (target_value - baseline_value)
      else:   # DECREASE_GOOD
          raw = 100 * (baseline_value - current_value) / (baseline_value - target_value)
      progress_pct = clamp(0.0, 100.0, round_half_up(raw, 1))
    input_set: "The single CarePlanGoal row; baseline_value and target_value are immutable after creation, current_value is the only moving input."
    constants:
      PROGRESS_PCT_MIN: 0.0
      PROGRESS_PCT_MAX: 100.0
    precision: "One decimal place, round_half_up, then clamped to [0.0, 100.0]. Clamping happens AFTER rounding."
    variants:
      - name: INCREASE_GOOD
        when: "direction == INCREASE_GOOD (e.g. monthly grocery-budget dollars, kept-appointment count)."
        difference: "Progress is measured upward from baseline toward a higher target; a current_value below baseline clamps to 0.0."
      - name: DECREASE_GOOD
        when: "direction == DECREASE_GOOD (e.g. missed medication doses, emergency-department visits)."
        difference: |
          Numerator and denominator are both inverted, so the SAME baseline/target/current triple
          yields a different percentage. baseline 40, target 20, current 30 gives 50.0 under
          DECREASE_GOOD but -50.0 -> clamped 0.0 under INCREASE_GOOD.

  - name: eligibility_gauntlet
    trigger: "POST /chw/offerings/{id}/eligibility-check and, as a precondition, POST /chw/referrals and POST /chw/referrals/{id}/reroute"
    algorithm: constraint_propagation
    formula: |
      candidates = EligibilityCriterion rows with offering_id == offering.id
      order      = candidates sorted by (evaluation_rank ASC, created_at ASC)
      # evaluation_rank is fixed by criterion_type:
      #   INCOME_BAND 1, GEOGRAPHY 2, HOUSEHOLD_SIZE 3, PROGRAM_ENROLLMENT 4, CATEGORICAL_EXCLUSION 5

      for c in order:
          if c.criterion_type == INCOME_BAND and
             patient.monthly_income_cents > c.max_monthly_income_cents:
                 return FAIL(c, ERR_ELIGIBILITY_INCOME)
          if c.criterion_type == GEOGRAPHY and
             patient.residence_zip not in c.allowed_zips:
                 return FAIL(c, ERR_ELIGIBILITY_GEOGRAPHY)
          if c.criterion_type == HOUSEHOLD_SIZE and
             (patient.household_size < c.min_household_size or
              patient.household_size > c.max_household_size):
                 return FAIL(c, ERR_ELIGIBILITY_HOUSEHOLD_SIZE)
          if c.criterion_type == PROGRAM_ENROLLMENT and
             c.required_program_code not in patient.program_enrollments:
                 return FAIL(c, ERR_ELIGIBILITY_PROGRAM_ENROLLMENT)
          if c.criterion_type == CATEGORICAL_EXCLUSION and
             c.excluded_flag_code in patient.categorical_exclusions:
                 return FAIL(c, ERR_ELIGIBILITY_CATEGORICAL_EXCLUSION)
      return PASS(evaluated_count = len(order))
    input_set: |
      Every EligibilityCriterion of the offering participates; there is no status filter because
      criteria have no lifecycle. An offering with zero criteria always passes with evaluated_count 0.
    constants:
      EVAL_RANK_INCOME_BAND: 1
      EVAL_RANK_GEOGRAPHY: 2
      EVAL_RANK_HOUSEHOLD_SIZE: 3
      EVAL_RANK_PROGRAM_ENROLLMENT: 4
      EVAL_RANK_CATEGORICAL_EXCLUSION: 5
    precision: |
      Evaluation stops at the FIRST failure and reports that criterion's error_id; later failures are
      never reported. Sort key is (evaluation_rank ASC, created_at ASC) — created_at, never id, breaks
      ties between two criteria of the same type. All comparisons are inclusive on the passing side:
      income passes at exactly max_monthly_income_cents, household size passes at exactly
      min_household_size and at exactly max_household_size.

  - name: grant_charge_line_amount
    trigger: "POST /chw/grant-charge-lines"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED — the rate tier is read from the award's committed_cents as it
      # stands BEFORE this line posts, even though this line will move committed_cents itself.
      # 1
      charged_minutes = encounter.billable_minutes
      # 2 - pre-line tier selection
      if award.committed_cents < GRANT_RATE_TIER_BREAK_CENTS:
          hourly_rate_cents = GRANT_HOURLY_RATE_TIER1_CENTS
      else:
          hourly_rate_cents = GRANT_HOURLY_RATE_TIER2_CENTS
      # 3
      direct_amount_cents   = round_half_up(charged_minutes * hourly_rate_cents / 60)
      # 4 - indirect is a percentage of the DIRECT amount, never of the total
      indirect_amount_cents = round_half_up(direct_amount_cents * award.indirect_rate_pct / 100)
      # 5
      total_amount_cents    = direct_amount_cents + indirect_amount_cents
      # 6 - budget gate, evaluated on the total; no trimming, the whole line is rejected
      if award.committed_cents + total_amount_cents > award.budget_cap_cents:
          reject with ERR_GRANT_BUDGET_EXCEEDED
      # 7
      award.committed_cents      += total_amount_cents
      award.remaining_budget_cents = award.budget_cap_cents - award.committed_cents
    input_set: |
      One GrantAward (status must be OPEN) and one Encounter (status must be SUBMITTED and
      funding_source UNFUNDED). committed_cents is the sum of total_amount_cents over this award's
      GrantChargeLine rows with status == POSTED; REVERSED lines are excluded.
    constants:
      GRANT_RATE_TIER_BREAK_CENTS: 50000
      GRANT_HOURLY_RATE_TIER1_CENTS: 4200
      GRANT_HOURLY_RATE_TIER2_CENTS: 3800
      DEFAULT_GRANT_INDIRECT_RATE_PCT: 10
    precision: |
      Whole cents, round_half_up, applied twice and independently: once to the direct amount and once
      to the indirect amount. Rounding the total in one step would give a different figure and is wrong.
      The tier break is >= : committed_cents of exactly 50000 selects TIER2 (3800).

  - name: escalation_tier_deadline
    trigger: "Escalation creation (manual or cascade) and every automatic tier promotion"
    algorithm: threshold
    formula: |
      sla_hours = TIER1_ACK_SLA_HOURS if current_tier == 1
                  TIER2_ACK_SLA_HOURS if current_tier == 2
                  TIER3_ACK_SLA_HOURS if current_tier == 3
      ack_deadline_at = tier_entered_at + sla_hours hours
    input_set: "The single Escalation row; tier_entered_at is re-stamped on every promotion so each tier gets a full, fresh window."
    constants:
      TIER1_ACK_SLA_HOURS: 48
      TIER2_ACK_SLA_HOURS: 24
      TIER3_ACK_SLA_HOURS: 8
      MAX_ESCALATION_TIER: 3
    precision: "Promotion fires only when the clock is STRICTLY after ack_deadline_at; a sweep run at exactly ack_deadline_at promotes nothing."

  - name: program_report_rollups
    trigger: "GET /chw/reports/program-summary — derived on every read and never stored on any entity"
    algorithm: aggregation
    formula: |
      # --- denominator (the dual variant) ---
      if denominator_basis == ENROLLED_ONLY:
          D = Patients with enrollment_status == ENROLLED
      else:   # EVER_ENROLLED
          D = Patients with enrollment_status IN {ENROLLED, DISENROLLED}
      patient_denominator_count = count(D)

      # --- screening coverage ---
      covered = Patients p in D having a Screening s with s.patient_id == p.id
                AND s.status IN {SUBMITTED, AMENDED}
                AND (now - s.anchor_screened_at) <= SCREENING_COVERAGE_WINDOW_DAYS days
      screening_coverage_pct = 0.0 if patient_denominator_count == 0
                               else round_half_up(100 * count(covered) / patient_denominator_count, 1)

      # --- referral loop closure ---
      resolved = Referrals r with r.patient_id in D
                 AND r.status IN {SERVICE_DELIVERED, CLOSED, DECLINED, LAPSED}
      closed_loops = resolved with r.status == CLOSED AND r.delivered_at is not null
      referral_loop_closure_pct = 0.0 if count(resolved) == 0
                                  else round_half_up(100 * count(closed_loops) / count(resolved), 1)

      # --- minutes by funding source, scoped to service_month ---
      M = Encounters e with e.patient_id in D AND e.service_month == service_month
          AND e.status IN {SUBMITTED, LOCKED}
      payer_minutes    = sum(e.billable_minutes for e in M where e.funding_source == PAYER)
      grant_minutes    = sum(e.billable_minutes for e in M where e.funding_source == GRANT)
      unfunded_minutes = sum(e.billable_minutes for e in M where e.funding_source == UNFUNDED)

      # --- travel, MONTHLY_AGGREGATED_MARGINAL variant of travel_mileage_reimbursement ---
      travel_reimbursement_monthly_cents = marginal_cents(sum(e.travel_miles for e in M))

      # --- open escalations ---
      open_escalation_count = count(Escalations x with x.patient_id in D
                                    AND x.status IN {OPEN_TIER_1, OPEN_TIER_2, OPEN_TIER_3})
    input_set: |
      Denominator D is pinned by denominator_basis and is the ONLY patient filter; PROSPECTIVE patients
      are excluded under both variants. Every downstream numerator restricts to patients in D. Encounters
      in DRAFT or VOIDED never count. Screenings in SUPERSEDED never count.
    constants:
      SCREENING_COVERAGE_WINDOW_DAYS: 365
    precision: "Percentages to one decimal place, round_half_up. An empty denominator yields 0.0, never a division error. Minutes are whole integers already rounded per encounter."
    variants:
      - name: ENROLLED_ONLY
        when: "denominator_basis == ENROLLED_ONLY."
        difference: "Only currently ENROLLED patients count. Disenrolling a patient shrinks the denominator and can RAISE screening_coverage_pct without any screening being performed."
      - name: EVER_ENROLLED
        when: "denominator_basis == EVER_ENROLLED."
        difference: |
          DISENROLLED patients stay in the denominator, so the same data yields a lower coverage
          percentage whenever a disenrolled patient lacks a recent screening. The two variants
          diverge on identical data the moment one patient is disenrolled.

# ===========================================================================
# VALIDATION PRIORITY LADDER — a SINGLE global ordering with no ties.
# 17 rungs; every validation in §1.4 carries a unique `priority` and names its
# `rung`. Evaluation stops at the first failing check.
# ===========================================================================
validation_ladder:
  - rung: 1
    name: authentication
    category: auth
  - rung: 2
    name: authorization_role
    category: auth
  - rung: 3
    name: path_resource_existence
    category: existence
  - rung: 4
    name: patient_records_hold_write_gate
    category: state
    note: "THE WRITE GATE. Sits ABOVE payload validation, so a gated patient's malformed request returns ERR_PATIENT_RECORDS_HOLD, not ERR_VALIDATION."
  - rung: 5
    name: payload_shape_and_domain
    category: business_constraint
  - rung: 6
    name: body_reference_existence
    category: existence
  - rung: 7
    name: optimistic_concurrency
    category: state
  - rung: 8
    name: target_state_precondition
    category: state
  - rung: 9
    name: cross_entity_state_precondition
    category: state
  - rung: 10
    name: actor_identity_and_segregation_of_duties
    category: auth
  - rung: 11
    name: safety
    category: business_safety
  - rung: 12
    name: eligibility_gauntlet
    category: business_referential
  - rung: 13
    name: temporal_overlap
    category: business_temporal
  - rung: 14
    name: window_and_count_limits
    category: business_temporal
  - rung: 15
    name: funding_exclusivity_and_allowability
    category: business_referential
  - rung: 16
    name: inventory_capacity
    category: business_constraint
  - rung: 17
    name: fiscal_caps_and_thresholds
    category: business_fiscal

# ---------------------------------------------------------------------------
# WRITE-GATE SCOPE (rung 4) — exhaustive and explicit.
# ---------------------------------------------------------------------------
write_gate:
  gate_field: "Patient.gate_status"
  gate_value: RECORDS_HOLD
  error_id: ERR_PATIENT_RECORDS_HOLD
  http_status: 409
  subject_resolution: |
    The gate subject is resolved in this fixed order:
      1. If the endpoint path contains /patients/{id}, the subject is that Patient.
      2. Otherwise, if the request body carries a patient_id field, the subject is that Patient.
      3. Otherwise, if the path names an entity that carries a patient_id column
         (Referral, HomeVisit, CarePlanGoal, Encounter, PayerClaim, Escalation, Screening),
         the subject is that row's Patient.
      4. Otherwise, if the path names a GrantChargeLine or a POST /chw/grant-charge-lines body,
         the subject is the Patient of the referenced Encounter.
      5. Otherwise there is NO subject and the rung is skipped.
    If step 2, 3 or 4 names an id that does not resolve to an existing Patient, the rung is
    SKIPPED (no gate error) and evaluation falls through to rung 5. This keeps ERR_VALIDATION and
    the rung-6 not-found errors reachable on malformed or dangling requests.
  gated_operations:
    - "PATCH /chw/patients/{id}"
    - "POST /chw/screenings"
    - "POST /chw/referrals"
    - "POST /chw/referrals/{id}/reroute"
    - "POST /chw/home-visits"
    - "POST /chw/home-visits/{id}/en-route"
    - "POST /chw/home-visits/{id}/complete"
    - "POST /chw/home-visits/{id}/no-show"
    - "POST /chw/home-visits/{id}/attest"
    - "POST /chw/home-visits/{id}/documentation-revision"
    - "POST /chw/goals"
    - "POST /chw/goals/{id}/progress"
    - "POST /chw/goals/{id}/close"
    - "POST /chw/goals/{id}/reopen"
    - "POST /chw/encounters"
    - "POST /chw/encounters/{id}/submit"
    - "POST /chw/payer-claims"
    - "POST /chw/grant-charge-lines"
    - "POST /chw/escalations"
  exempt_operations:
    - "Every GET endpoint without exception — a records hold restricts writes, never reads."
    - "POST /chw/patients/{id}/records-hold (both PLACE and RELEASE) — otherwise a held patient could never be released."
    - "POST /chw/patients — creation cannot have a gated subject."
    - "POST /chw/home-visits/{id}/cancel — an in-flight visit on a newly held patient must always be standable-down."
    - "POST /chw/encounters/{id}/void — corrections must remain possible while a hold is in force."
    - "POST /chw/escalations/{id}/acknowledge and POST /chw/escalations/{id}/resolve — open escalations must remain closeable."
    - "POST /chw/referrals/{id}/respond, POST /chw/referrals/{id}/deliver, POST /chw/referrals/{id}/close — the resource organization is a third party and is not bound by the provider's records hold."
    - "POST /chw/payer-claims/{id}/adjudicate, /appeal and /appeal-decision — payer-side adjudication of an already-submitted claim."
    - "POST /chw/grant-charge-lines/{id}/reverse — a compensating action."
    - "POST /chw/ops/run-sweep — system sweeps and every cascade they fire."
    - "All endpoints with no patient subject: workers, screening-instruments, resource-orgs, offerings, eligibility criteria, grant-awards, the clock and the report."

# ===========================================================================
# §1.4 VALIDATION RULES TABLE (43 rules, unique priorities, ordered)
# ===========================================================================
validations:

  # ---- rung 1: authentication ----
  - priority: 1
    rung: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, non-empty, and X-User-Role is one of CHW, Supervisor, ProgramAdmin, BillingSpecialist, ResourcePartner."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  # ---- rung 2: authorization ----
  - priority: 2
    rung: 2
    category: auth
    check: "The supplied X-User-Role appears in the target endpoint's declared roles list in §1.5."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  # ---- rung 3: path existence, left to right ----
  - priority: 3
    rung: 3
    category: existence
    check: "A {id} segment under /chw/patients resolves to an existing Patient."
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "GET /chw/patients/{id}, PATCH /chw/patients/{id}, POST /chw/patients/{id}/records-hold"
  - priority: 4
    rung: 3
    category: existence
    check: "A {id} segment under /chw/referrals resolves to an existing Referral."
    error_id: ERR_REFERRAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /chw/referrals/{id}, POST /chw/referrals/{id}/respond, /deliver, /close, /reroute"
  - priority: 5
    rung: 3
    category: existence
    check: "Every other {id} path segment resolves to an existing row of its collection's entity, checked left to right."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "All endpoints with a path id other than a Patient or Referral id."

  # ---- rung 4: THE WRITE GATE ----
  - priority: 6
    rung: 4
    category: state
    check: "The resolved gate-subject Patient has gate_status == OPEN. Subject resolution and the exempt list are pinned in the write_gate block; unresolvable subjects skip this rung."
    error_id: ERR_PATIENT_RECORDS_HOLD
    http_status: 409
    applies_to: "Every operation in write_gate.gated_operations"

  # ---- rung 5: payload shape and domain ----
  - priority: 7
    rung: 5
    category: business_constraint
    check: "All required body fields for the endpoint are present and of the declared JSON type; unknown fields are ignored; system and computed fields supplied by the client are ignored."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "All POST, PUT and PATCH endpoints"
  - priority: 8
    rung: 5
    category: business_constraint
    check: "Every enum-typed body field carries a declared member value (urgency, org_type, unit_type, criterion_type, direction, domain, basis, action, decision, outcome, sweep_type, denominator_basis, enrollment_action, credential_level)."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "All POST and PATCH endpoints carrying an enum field"
  - priority: 9
    rung: 5
    category: business_constraint
    check: |
      Domain rules on scalars: household_size >= 1; monthly_income_cents >= 0; residence_zip is exactly
      5 numeric characters; capacity_total >= 1; units_requested >= 1; budget_cap_cents >= 1;
      indirect_rate_pct between 0 and 100; every minute field >= 0 and total_minutes <=
      ENCOUNTER_MAX_TOTAL_MINUTES (480); travel_miles >= 0; domain_weights values are integers >= 0
      summing to exactly 100; domain_scores keys equal the instrument's domain_weights keys and values
      lie in 0..4; scheduled_end is strictly after scheduled_start with a duration between
      VISIT_MIN_DURATION_MINUTES (15) and VISIT_MAX_DURATION_MINUTES (240) inclusive; second_chw_id,
      when present, differs from assigned_chw_id; target_value > baseline_value for INCREASE_GOOD and
      target_value < baseline_value for DECREASE_GOOD; period_end >= period_start; encounter_date
      matches YYYY-MM-DD and service_month matches YYYY-MM; pagination limit is 1..100 and offset >= 0.
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "All endpoints accepting the named fields"
  - priority: 10
    rung: 5
    category: business_constraint
    check: "Uniqueness: Patient.mrn, CommunityHealthWorker.employee_code, and the ScreeningInstrument pair (name, version_label) are each unique across all rows."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "POST /chw/patients, POST /chw/workers, POST /chw/screening-instruments"

  # ---- rung 6: body-referenced existence ----
  - priority: 11
    rung: 6
    category: existence
    check: "A patient_id supplied in a request body resolves to an existing Patient."
    error_id: ERR_PATIENT_NOT_FOUND
    http_status: 404
    applies_to: "POST /chw/screenings, /chw/referrals, /chw/home-visits, /chw/goals, /chw/encounters, /chw/payer-claims, /chw/escalations, POST /chw/offerings/{id}/eligibility-check"
  - priority: 12
    rung: 6
    category: existence
    check: "Every other body-supplied foreign key (instrument_id, offering_id, opened_by_chw_id, assigned_chw_id, second_chw_id, chw_id, home_visit_id, resource_org_id, grant_award_id, encounter_id) resolves to an existing row of its entity."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "All POST endpoints carrying the named fields"

  # ---- rung 7: optimistic concurrency ----
  - priority: 13
    rung: 7
    category: state
    check: "expected_offering_version equals the current ResourceOffering.version."
    error_id: ERR_STALE_OFFERING_VERSION
    http_status: 412
    applies_to: "POST /chw/referrals"
  - priority: 14
    rung: 7
    category: state
    check: "expected_grant_award_version equals the current GrantAward.version."
    error_id: ERR_STALE_GRANT_VERSION
    http_status: 412
    applies_to: "POST /chw/grant-charge-lines"
  - priority: 15
    rung: 7
    category: state
    check: "expected_patient_version equals the current Patient.version."
    error_id: ERR_STALE_PATIENT_VERSION
    http_status: 412
    applies_to: "POST /chw/screenings"

  # ---- rung 8: target-entity state precondition ----
  - priority: 16
    rung: 8
    category: state
    check: "The target row is in a `from:` state that permits the requested transition per §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "Every state-changing action endpoint"
  - priority: 17
    rung: 8
    category: state
    check: "PayerClaim.basis == FINAL when the claim is adjudicated, appealed or decided; PROVISIONAL claims are estimates and can never leave SUBMITTED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /chw/payer-claims/{id}/adjudicate, /appeal, /appeal-decision"
  - priority: 18
    rung: 8
    category: state
    check: "Voiding a LOCKED Encounter requires funding_source == GRANT; a payer-locked encounter must have its claim resolved first."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /chw/encounters/{id}/void"

  # ---- rung 9: cross-entity state precondition ----
  - priority: 19
    rung: 9
    category: state
    check: "The ScreeningInstrument named by instrument_id has status == PUBLISHED."
    error_id: ERR_INSTRUMENT_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /chw/screenings"
  - priority: 20
    rung: 9
    category: state
    check: "The ResourceOrg owning the target offering has status == ACTIVE."
    error_id: ERR_RESOURCE_ORG_SUSPENDED
    http_status: 409
    applies_to: "POST /chw/referrals, POST /chw/referrals/{id}/reroute"
  - priority: 21
    rung: 9
    category: state
    check: "The subject Patient has enrollment_status == ENROLLED."
    error_id: ERR_PATIENT_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /chw/referrals, POST /chw/referrals/{id}/reroute, POST /chw/home-visits, POST /chw/goals, POST /chw/encounters, POST /chw/goals/{id}/reopen"
  - priority: 22
    rung: 9
    category: state
    check: "When the Encounter carries a non-null home_visit_id, that HomeVisit has documentation_status IN {ATTESTED, AMENDED}."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /chw/encounters/{id}/submit"

  # ---- rung 10: actor identity and segregation of duties ----
  - priority: 23
    rung: 10
    category: auth
    check: "Ownership: a ResourcePartner acting on a referral must have X-User-ID equal to the offering's resource_org_id; a CHW acting on a home visit must have X-User-ID equal to assigned_chw_id; a CHW submitting an encounter must have X-User-ID equal to chw_id."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /chw/referrals/{id}/respond, /deliver; POST /chw/home-visits/{id}/en-route, /complete, /attest; POST /chw/encounters/{id}/submit"
  - priority: 24
    rung: 10
    category: auth
    check: "On POST /chw/home-visits/{id}/documentation-revision, action == AMEND requires role CHW with X-User-ID equal to assigned_chw_id, and action == VOID requires role Supervisor."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /chw/home-visits/{id}/documentation-revision"
  - priority: 25
    rung: 10
    category: auth
    check: "Segregation of duties: the X-User-ID acknowledging an Escalation must differ from Escalation.opened_by_user_id."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /chw/escalations/{id}/acknowledge"

  # ---- rung 11: safety ----
  - priority: 26
    rung: 11
    category: business_safety
    check: "When the subject Patient has address_safety_flag == true, POST /chw/home-visits MUST supply a non-null second_chw_id."
    error_id: ERR_TWO_PERSON_VISIT_REQUIRED
    http_status: 422
    applies_to: "POST /chw/home-visits"

  # ---- rung 12: eligibility gauntlet, evaluated in evaluation_rank order ----
  - priority: 27
    rung: 12
    category: business_referential
    check: "INCOME_BAND (rank 1): patient.monthly_income_cents <= criterion.max_monthly_income_cents. Passing is inclusive at the boundary."
    error_id: ERR_ELIGIBILITY_INCOME
    http_status: 422
    applies_to: "POST /chw/referrals, POST /chw/referrals/{id}/reroute, POST /chw/offerings/{id}/eligibility-check"
  - priority: 28
    rung: 12
    category: business_referential
    check: "GEOGRAPHY (rank 2): patient.residence_zip is a member of criterion.allowed_zips."
    error_id: ERR_ELIGIBILITY_GEOGRAPHY
    http_status: 422
    applies_to: "POST /chw/referrals, POST /chw/referrals/{id}/reroute, POST /chw/offerings/{id}/eligibility-check"
  - priority: 29
    rung: 12
    category: business_referential
    check: "HOUSEHOLD_SIZE (rank 3): min_household_size <= patient.household_size <= max_household_size, inclusive on both ends."
    error_id: ERR_ELIGIBILITY_HOUSEHOLD_SIZE
    http_status: 422
    applies_to: "POST /chw/referrals, POST /chw/referrals/{id}/reroute, POST /chw/offerings/{id}/eligibility-check"
  - priority: 30
    rung: 12
    category: business_referential
    check: "PROGRAM_ENROLLMENT (rank 4): criterion.required_program_code is a member of patient.program_enrollments."
    error_id: ERR_ELIGIBILITY_PROGRAM_ENROLLMENT
    http_status: 422
    applies_to: "POST /chw/referrals, POST /chw/referrals/{id}/reroute, POST /chw/offerings/{id}/eligibility-check"
  - priority: 31
    rung: 12
    category: business_referential
    check: "CATEGORICAL_EXCLUSION (rank 5): criterion.excluded_flag_code is NOT a member of patient.categorical_exclusions."
    error_id: ERR_ELIGIBILITY_CATEGORICAL_EXCLUSION
    http_status: 422
    applies_to: "POST /chw/referrals, POST /chw/referrals/{id}/reroute, POST /chw/offerings/{id}/eligibility-check"

  # ---- rung 13: temporal overlap ----
  - priority: 32
    rung: 13
    category: business_temporal
    check: |
      HALF-OPEN visit slots. A new HomeVisit conflicts when, for the SAME CommunityHealthWorker in
      either the assigned_chw_id or the second_chw_id role, an existing HomeVisit with
      scheduling_status IN {SCHEDULED, EN_ROUTE, COMPLETED} satisfies
      new.scheduled_start < existing.scheduled_end AND existing.scheduled_start < new.scheduled_end.
      Touching slots do NOT collide: a visit starting exactly at another's scheduled_end is accepted.
      Visits in NO_SHOW or CANCELLED never participate. There is no buffer.
    error_id: ERR_VISIT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /chw/home-visits"
  - priority: 33
    rung: 13
    category: business_temporal
    check: |
      CLOSED grant periods. A new GrantAward conflicts when an existing GrantAward with the SAME
      funder_name and status == OPEN satisfies
      new.period_start <= existing.period_end AND existing.period_start <= new.period_end.
      Touching dates DO collide: a new period starting on the exact day an existing period ends is
      rejected. This is deliberately the opposite convention to the half-open visit slots above.
    error_id: ERR_GRANT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /chw/grant-awards"

  # ---- rung 14: window and count limits ----
  - priority: 34
    rung: 14
    category: business_temporal
    check: "Attestation window: current logical clock minus HomeVisit.completed_at <= ATTESTATION_WINDOW_HOURS (72) hours. Exactly 72 hours still attests."
    error_id: ERR_ATTESTATION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /chw/home-visits/{id}/attest"
  - priority: 35
    rung: 14
    category: business_temporal
    check: "Amendment window: current logical clock minus HomeVisit.attested_at <= AMENDMENT_WINDOW_DAYS (30) days, always measured from the ORIGINAL attestation and never from the last amendment."
    error_id: ERR_AMENDMENT_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /chw/home-visits/{id}/documentation-revision with action = AMEND"
  - priority: 36
    rung: 14
    category: business_constraint
    check: "Re-route limit: the chain's reroute_count is strictly less than MAX_REROUTE_COUNT (2). A chain that has already been re-routed twice cannot be re-routed again."
    error_id: ERR_REROUTE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /chw/referrals/{id}/reroute"
  - priority: 37
    rung: 14
    category: business_temporal
    check: "Appeal window: current logical clock minus PayerClaim.denied_at <= CLAIM_APPEAL_WINDOW_DAYS (60) days. Exactly 60 days still appeals."
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /chw/payer-claims/{id}/appeal"

  # ---- rung 15: funding exclusivity and allowability ----
  - priority: 38
    rung: 15
    category: business_referential
    check: "Anti-double-dip, payer side: no Encounter for this (patient_id, service_month) may have funding_source == GRANT, and no prior FINAL PayerClaim for this (patient_id, service_month) may exist in status SUBMITTED, PAID, APPEALED or OVERTURNED. A prior claim in status UPHELD does NOT block, because its compensation released the minutes."
    error_id: ERR_MINUTES_ALREADY_FUNDED
    http_status: 409
    applies_to: "POST /chw/payer-claims with basis = FINAL"
  - priority: 39
    rung: 15
    category: business_referential
    check: "Anti-double-dip, grant side: the referenced Encounter has funding_source == UNFUNDED. An encounter already carved to a payer claim or to another grant line cannot be charged again."
    error_id: ERR_MINUTES_ALREADY_FUNDED
    http_status: 409
    applies_to: "POST /chw/grant-charge-lines"
  - priority: 40
    rung: 15
    category: business_referential
    check: "Allowable cost: Encounter.encounter_date lies inside the award's CLOSED period (period_start <= encounter_date <= period_end), and the encounter has at least one minute in a category listed in allowable_cost_categories. An encounter whose only minutes are travel_minutes is never allowable."
    error_id: ERR_ENCOUNTER_NOT_ALLOWABLE
    http_status: 422
    applies_to: "POST /chw/grant-charge-lines"

  # ---- rung 16: inventory capacity ----
  - priority: 41
    rung: 16
    category: business_constraint
    check: "ResourceOffering.available_units >= units_requested. Requesting exactly the remaining units succeeds and drives the offering to EXHAUSTED; one more unit fails."
    error_id: ERR_INSUFFICIENT_UNITS
    http_status: 409
    applies_to: "POST /chw/referrals, POST /chw/referrals/{id}/reroute"

  # ---- rung 17: fiscal caps and thresholds ----
  - priority: 42
    rung: 17
    category: business_fiscal
    check: "Grant budget: award.committed_cents + this line's total_amount_cents <= award.budget_cap_cents. The line is rejected outright; it is never trimmed to fit."
    error_id: ERR_GRANT_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /chw/grant-charge-lines"
  - priority: 43
    rung: 17
    category: business_fiscal
    check: "Care-management minute threshold: claimed_minutes computed under the selected basis >= CM_CODE_MINUTE_THRESHOLD (60). Exactly 60 qualifies for CM-60; 59 or fewer is rejected."
    error_id: ERR_MINUTE_THRESHOLD_NOT_MET
    http_status: 422
    applies_to: "POST /chw/payer-claims"

# ===========================================================================
# §1.5 API ENDPOINT TABLE (70 endpoints)
# ===========================================================================
endpoints:

  # ---------------- logical clock (test-driving) ----------------
  - method: POST
    path: "/chw/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-05-01T00:00:00Z and MUST NOT fall back to real wall-clock time. Every deadline, window, cadence and expiry rule in this scaffold reads this clock."
    roles: ["ProgramAdmin"]
    code: 200
    input: ["to_iso8601"]
    output: "{ current_utc: string }"
    side_effects: ["Advances or rewinds the logical clock; no entity is mutated and no sweep is run."]

  # ---------------- community health workers ----------------
  - method: POST
    path: "/chw/workers"
    description: "Register a community health worker."
    roles: ["ProgramAdmin"]
    code: 201
    input: ["full_name", "employee_code", "credential_level?"]
    output: CommunityHealthWorker
    side_effects: ["Creates the worker with employment_status ACTIVE and version 1."]
  - method: GET
    path: "/chw/workers/{id}"
    description: "Read one community health worker."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: CommunityHealthWorker
    side_effects: []

  # ---------------- patients ----------------
  - method: POST
    path: "/chw/patients"
    description: "Add a patient to the CHW program roster."
    roles: ["CHW", "Supervisor", "ProgramAdmin"]
    code: 201
    input: ["mrn", "full_name", "household_size", "monthly_income_cents", "residence_zip", "program_enrollments?", "categorical_exclusions?", "child_in_household?", "address_safety_flag?"]
    output: Patient
    side_effects: ["Creates the Patient with enrollment_status PROSPECTIVE, gate_status OPEN, risk_tier NONE, risk_score 0, unfulfilled_referral_count 0 and version 1."]
  - method: GET
    path: "/chw/patients/{id}"
    description: "Read one patient, including the derived risk_tier and risk_tier_effective_at."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: PATCH
    path: "/chw/patients/{id}"
    description: "Update patient demographics, and optionally drive the enrollment axis with enrollment_action (ENROLL, DISENROLL, REENROLL)."
    roles: ["Supervisor", "ProgramAdmin"]
    code: 200
    input: ["household_size?", "monthly_income_cents?", "residence_zip?", "program_enrollments?", "categorical_exclusions?", "child_in_household?", "address_safety_flag?", "enrollment_action?"]
    output: Patient
    side_effects:
      - "Increments Patient.version by 1."
      - "enrollment_action = DISENROLL additionally sets every ACTIVE CarePlanGoal of this patient to DEFERRED with closed_at stamped."
      - "Gated by the rung-4 write gate."
  - method: POST
    path: "/chw/patients/{id}/records-hold"
    description: "Place (action = PLACE) or release (action = RELEASE) a consent-withdrawal records hold on a patient. Exempt from the rung-4 write gate."
    roles: ["Supervisor"]
    code: 200
    input: ["action", "reason?"]
    output: Patient
    side_effects:
      - "PLACE flips gate_status OPEN -> RECORDS_HOLD and fires the five-link cascade documented on the Patient gate_status state machine."
      - "RELEASE flips gate_status RECORDS_HOLD -> OPEN and clears gate_reason; lapsed referrals are not restored."
      - "Increments Patient.version by 1."

  # ---------------- screening instruments ----------------
  - method: POST
    path: "/chw/screening-instruments"
    description: "Create a screening instrument revision in DRAFT."
    roles: ["ProgramAdmin"]
    code: 201
    input: ["name", "version_label", "domain_weights", "effective_from", "rescreen_cadence_days?"]
    output: ScreeningInstrument
    side_effects: ["Creates the instrument in status DRAFT with rescreen_cadence_days defaulting to 90."]
  - method: GET
    path: "/chw/screening-instruments/{id}"
    description: "Read one screening instrument revision."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: ScreeningInstrument
    side_effects: []
  - method: POST
    path: "/chw/screening-instruments/{id}/publish"
    description: "Move a DRAFT instrument to PUBLISHED so screenings may reference it."
    roles: ["ProgramAdmin"]
    code: 200
    input: []
    output: ScreeningInstrument
    side_effects: ["Sets status = PUBLISHED and increments version by 1."]
  - method: POST
    path: "/chw/screening-instruments/{id}/retire"
    description: "Move a PUBLISHED instrument to RETIRED; existing screenings keep their historical scores."
    roles: ["ProgramAdmin"]
    code: 200
    input: []
    output: ScreeningInstrument
    side_effects: ["Sets status = RETIRED and increments version by 1. Screenings already anchored to this instrument are untouched."]

  # ---------------- screenings ----------------
  - method: POST
    path: "/chw/screenings"
    description: "Administer an SDOH screening. The server decides between the AMENDMENT_ANCHOR and FRESH_ANCHOR variants; an amendment returns 201 carrying the EXISTING row's id with an incremented amendment_count and an unchanged anchor_screened_at."
    roles: ["CHW", "Supervisor"]
    code: 201
    input: ["patient_id", "instrument_id", "domain_scores", "expected_patient_version"]
    output: Screening
    side_effects:
      - "Runs sdoh_weighted_risk_score; writes weighted_score and risk_tier."
      - "Copies risk_score, risk_tier and risk_tier_effective_at onto the Patient and increments Patient.version by 1."
      - "FRESH_ANCHOR supersedes the patient's prior non-SUPERSEDED Screening."
      - "risk_tier CRITICAL opens an Escalation with source_flag CRITICAL_SDOH_FINDING."
      - "A PROSPECTIVE patient scoring MODERATE or above becomes ENROLLED."
      - "Gated by the rung-4 write gate; guarded by OCC on expected_patient_version."
  - method: GET
    path: "/chw/screenings/{id}"
    description: "Read one screening."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: Screening
    side_effects: []
  - method: GET
    path: "/chw/screenings"
    description: "List screenings, filterable by patient, instrument and status."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: ["patient_id?", "instrument_id?", "status?", "limit?", "offset?"]
    output: Screening[]
    side_effects: []

  # ---------------- resource organizations ----------------
  - method: POST
    path: "/chw/resource-orgs"
    description: "Register a community resource organization."
    roles: ["ProgramAdmin"]
    code: 201
    input: ["name", "org_type", "service_zips", "contact_email"]
    output: ResourceOrg
    side_effects: ["Creates the organization in status ACTIVE."]
  - method: GET
    path: "/chw/resource-orgs/{id}"
    description: "Read one resource organization."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: ResourceOrg
    side_effects: []
  - method: POST
    path: "/chw/resource-orgs/{id}/suspend"
    description: "Suspend (action = SUSPEND) or reinstate (action = REINSTATE) a resource organization."
    roles: ["ProgramAdmin"]
    code: 200
    input: ["action"]
    output: ResourceOrg
    side_effects: ["Toggles status between ACTIVE and SUSPENDED and increments version by 1. Existing referrals are untouched."]

  # ---------------- resource offerings and eligibility ----------------
  - method: POST
    path: "/chw/offerings"
    description: "Create a consumable offering under a resource organization."
    roles: ["ProgramAdmin"]
    code: 201
    input: ["resource_org_id", "unit_type", "capacity_total"]
    output: ResourceOffering
    side_effects: ["Creates the offering with available_units = capacity_total, allocated/delivered/released/expired/lifetime counters at 0 and availability_state AVAILABLE."]
  - method: GET
    path: "/chw/offerings/{id}"
    description: "Read one offering, including every inventory counter."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: ResourceOffering
    side_effects: []
  - method: GET
    path: "/chw/offerings"
    description: "List offerings, filterable by organization, unit type and availability."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: ["resource_org_id?", "unit_type?", "availability_state?", "limit?", "offset?"]
    output: ResourceOffering[]
    side_effects: []
  - method: POST
    path: "/chw/offerings/{id}/criteria"
    description: "Attach an eligibility criterion to an offering. evaluation_rank is derived from criterion_type and cannot be supplied."
    roles: ["ProgramAdmin"]
    code: 201
    input: ["criterion_type", "max_monthly_income_cents?", "allowed_zips?", "min_household_size?", "max_household_size?", "required_program_code?", "excluded_flag_code?"]
    output: EligibilityCriterion
    side_effects: ["Creates the criterion with evaluation_rank fixed by criterion_type."]
  - method: GET
    path: "/chw/offerings/{id}/criteria"
    description: "List an offering's eligibility criteria in (evaluation_rank ASC, created_at ASC) order."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityCriterion[]
    side_effects: []
  - method: POST
    path: "/chw/offerings/{id}/eligibility-check"
    description: "Run the eligibility gauntlet for a patient against an offering WITHOUT creating a referral. Returns the first failing criterion, or eligible = true when every criterion passes. Always 200, even when the patient is ineligible."
    roles: ["CHW", "Supervisor", "ProgramAdmin"]
    code: 200
    input: ["patient_id"]
    output: "{ eligible: boolean, evaluated_count: integer, first_failing_criterion_id: string, first_failing_criterion_type: string, first_failing_error_id: string }"
    side_effects: ["None. This is a pure read of eligibility_gauntlet; first_failing_* fields are null when eligible is true."]

  # ---------------- referrals (closed loop) ----------------
  - method: POST
    path: "/chw/referrals"
    description: "Send a closed-loop referral, placing a hold on the offering's units."
    roles: ["CHW"]
    code: 201
    input: ["patient_id", "offering_id", "opened_by_chw_id", "urgency", "units_requested", "expected_offering_version"]
    output: Referral
    side_effects:
      - "Creates the Referral in SENT with root_referral_id equal to its own id and reroute_count 0."
      - "Places the hold: allocated_units += units_requested, available_units -= units_requested, lifetime_allocated_units += units_requested; increments ResourceOffering.version by 1."
      - "Computes ack_deadline_at under the FRESH_SLA variant and hold_expires_at from sent_at."
      - "Driving available_units to 0 flips availability_state to EXHAUSTED and opens a RESOURCE_EXHAUSTED Escalation (cascade depth 3)."
      - "Gated by the rung-4 write gate; guarded by OCC on expected_offering_version."
  - method: GET
    path: "/chw/referrals/{id}"
    description: "Read one referral."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: Referral
    side_effects: []
  - method: GET
    path: "/chw/referrals"
    description: "List referrals, filterable by patient, offering, opening worker, chain membership and status."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: ["patient_id?", "offering_id?", "opened_by_chw_id?", "parent_referral_id?", "root_referral_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []
  - method: POST
    path: "/chw/referrals/{id}/respond"
    description: "Resource-organization acknowledgement: decision = ACCEPTED or DECLINED. Exempt from the rung-4 write gate."
    roles: ["ResourcePartner"]
    code: 200
    input: ["decision", "decline_reason?"]
    output: Referral
    side_effects:
      - "ACCEPTED retains the hold and sets status ACCEPTED."
      - "DECLINED releases the hold (allocated -= n, available += n, released += n), increments Patient.unfulfilled_referral_count, may restore an EXHAUSTED offering to AVAILABLE and auto-resolve its RESOURCE_EXHAUSTED escalations, and may open a REFERRAL_UNFULFILLED escalation at count 2."
      - "Increments ResourceOffering.version by 1 on the DECLINED path."
  - method: POST
    path: "/chw/referrals/{id}/deliver"
    description: "Resource organization records service delivery. Exempt from the rung-4 write gate."
    roles: ["ResourcePartner"]
    code: 200
    input: []
    output: Referral
    side_effects:
      - "Sets status SERVICE_DELIVERED and delivered_at."
      - "Consumes the hold: allocated_units -= n, delivered_units += n; available_units is NOT restored. Increments ResourceOffering.version by 1."
  - method: POST
    path: "/chw/referrals/{id}/close"
    description: "Close the loop on a delivered or declined referral. Exempt from the rung-4 write gate."
    roles: ["CHW", "Supervisor"]
    code: 200
    input: ["outcome_note"]
    output: Referral
    side_effects: ["Sets status CLOSED, closed_at and outcome_note. Only a CLOSED referral with a non-null delivered_at counts toward referral_loop_closure_pct."]
  - method: POST
    path: "/chw/referrals/{id}/reroute"
    description: "Re-route a DECLINED referral to an alternate offering, creating a new SENT referral in the same chain."
    roles: ["CHW"]
    code: 201
    input: ["offering_id", "urgency", "units_requested", "expected_offering_version"]
    output: Referral
    side_effects:
      - "Creates a child Referral in SENT with parent_referral_id and the inherited root_referral_id."
      - "Writes the incremented reroute_count onto EVERY row in the chain, bumping each row's version by 1."
      - "Computes ack_deadline_at under the ROOT_CHAIN_BUDGET variant, anchored at the root's sent_at."
      - "Places a hold on the alternate offering exactly as a root referral does, including the EXHAUSTED cascade."
      - "Gated by the rung-4 write gate; guarded by OCC on expected_offering_version."

  # ---------------- home visits ----------------
  - method: POST
    path: "/chw/home-visits"
    description: "Schedule a home visit. Slots are HALF-OPEN: a visit starting exactly when another ends does not collide."
    roles: ["CHW", "Supervisor"]
    code: 201
    input: ["patient_id", "assigned_chw_id", "scheduled_start", "scheduled_end", "second_chw_id?"]
    output: HomeVisit
    side_effects:
      - "Creates the visit with scheduling_status SCHEDULED and documentation_status DRAFT."
      - "Copies Patient.address_safety_flag into two_person_required; a true flag makes second_chw_id mandatory."
      - "Gated by the rung-4 write gate."
  - method: GET
    path: "/chw/home-visits/{id}"
    description: "Read one home visit, including both state axes."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: HomeVisit
    side_effects: []
  - method: GET
    path: "/chw/home-visits"
    description: "List home visits, filterable by patient, either worker slot and either state axis."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: ["patient_id?", "assigned_chw_id?", "second_chw_id?", "scheduling_status?", "documentation_status?", "limit?", "offset?"]
    output: HomeVisit[]
    side_effects: []
  - method: POST
    path: "/chw/home-visits/{id}/en-route"
    description: "Assigned worker departs for the visit."
    roles: ["CHW"]
    code: 200
    input: []
    output: HomeVisit
    side_effects: ["Sets scheduling_status EN_ROUTE. Gated by the rung-4 write gate."]
  - method: POST
    path: "/chw/home-visits/{id}/complete"
    description: "Assigned worker completes the visit, starting the 72-hour attestation window."
    roles: ["CHW"]
    code: 200
    input: []
    output: HomeVisit
    side_effects: ["Sets scheduling_status COMPLETED and completed_at. Gated by the rung-4 write gate."]
  - method: POST
    path: "/chw/home-visits/{id}/no-show"
    description: "Record a patient no-show; the documentation axis stays DRAFT forever."
    roles: ["CHW", "Supervisor"]
    code: 200
    input: []
    output: HomeVisit
    side_effects: ["Sets scheduling_status NO_SHOW. Gated by the rung-4 write gate."]
  - method: POST
    path: "/chw/home-visits/{id}/cancel"
    description: "Cancel a scheduled or en-route visit and free its slot. Exempt from the rung-4 write gate."
    roles: ["CHW", "Supervisor"]
    code: 200
    input: []
    output: HomeVisit
    side_effects: ["Sets scheduling_status CANCELLED; the slot stops participating in visit-slot overlap checks."]
  - method: POST
    path: "/chw/home-visits/{id}/attest"
    description: "Assigned worker attests the visit documentation. Only ATTESTED or AMENDED documentation lets a linked encounter be submitted."
    roles: ["CHW"]
    code: 200
    input: ["visit_note"]
    output: HomeVisit
    side_effects: ["Sets documentation_status ATTESTED and attested_at. Gated by the rung-4 write gate."]
  - method: POST
    path: "/chw/home-visits/{id}/documentation-revision"
    description: "action = AMEND (assigned CHW, inside the 30-day window measured from the ORIGINAL attested_at) or action = VOID (Supervisor)."
    roles: ["CHW", "Supervisor"]
    code: 200
    input: ["action", "visit_note?"]
    output: HomeVisit
    side_effects:
      - "AMEND sets documentation_status AMENDED, overwrites visit_note and increments amendment_count."
      - "VOID sets documentation_status VOIDED and voids every DRAFT Encounter linked to this visit."
      - "Gated by the rung-4 write gate."

  # ---------------- care plan goals ----------------
  - method: POST
    path: "/chw/goals"
    description: "Create a measurable care-plan goal."
    roles: ["CHW", "Supervisor"]
    code: 201
    input: ["patient_id", "domain", "direction", "baseline_value", "target_value", "review_cycle_days?"]
    output: CarePlanGoal
    side_effects: ["Creates the goal ACTIVE with current_value = baseline_value, progress_pct 0.0 and review_due_at = now + review_cycle_days. Gated by the rung-4 write gate."]
  - method: GET
    path: "/chw/goals/{id}"
    description: "Read one goal with its derived progress_pct."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: CarePlanGoal
    side_effects: []
  - method: GET
    path: "/chw/goals"
    description: "List goals, filterable by patient, status and domain."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: ["patient_id?", "status?", "domain?", "limit?", "offset?"]
    output: CarePlanGoal[]
    side_effects: []
  - method: POST
    path: "/chw/goals/{id}/progress"
    description: "Record a new measurement and recompute progress_pct under the goal's direction variant."
    roles: ["CHW"]
    code: 200
    input: ["current_value"]
    output: CarePlanGoal
    side_effects: ["Sets current_value, recomputes progress_pct, resets review_due_at to now + review_cycle_days. Gated by the rung-4 write gate."]
  - method: POST
    path: "/chw/goals/{id}/close"
    description: "Close a goal with outcome = MET, NOT_MET or DEFERRED. MET requires progress_pct == 100.0."
    roles: ["CHW", "Supervisor"]
    code: 200
    input: ["outcome"]
    output: CarePlanGoal
    side_effects:
      - "Sets status and closed_at."
      - "outcome = NOT_MET additionally opens an Escalation with source_flag GOAL_NOT_MET at OPEN_TIER_1."
      - "Gated by the rung-4 write gate."
  - method: POST
    path: "/chw/goals/{id}/reopen"
    description: "Return a closed goal to ACTIVE; requires the patient to be ENROLLED."
    roles: ["CHW", "Supervisor"]
    code: 200
    input: []
    output: CarePlanGoal
    side_effects: ["Sets status ACTIVE, clears closed_at, increments reopen_count and resets review_due_at. Gated by the rung-4 write gate."]

  # ---------------- encounters and time tracking ----------------
  - method: POST
    path: "/chw/encounters"
    description: "Record CHW time for a patient, split across direct, indirect, travel and documentation minutes."
    roles: ["CHW"]
    code: 201
    input: ["patient_id", "chw_id", "encounter_date", "direct_minutes", "indirect_minutes", "travel_minutes", "documentation_minutes", "travel_miles?", "home_visit_id?"]
    output: Encounter
    side_effects:
      - "Computes service_month, total_minutes, raw_billable_minutes, billable_minutes (rounded to the nearest 6 minutes, half up) and travel_reimbursement_cents (PER_ENCOUNTER_MARGINAL)."
      - "Creates the encounter in DRAFT with funding_source UNFUNDED. Gated by the rung-4 write gate."
  - method: GET
    path: "/chw/encounters/{id}"
    description: "Read one encounter with all derived minute and money fields."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: Encounter
    side_effects: []
  - method: GET
    path: "/chw/encounters"
    description: "List encounters, filterable by patient, worker, visit, claim, month, status and funding source."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: ["patient_id?", "chw_id?", "home_visit_id?", "funding_claim_id?", "service_month?", "status?", "funding_source?", "limit?", "offset?"]
    output: Encounter[]
    side_effects: []
  - method: POST
    path: "/chw/encounters/{id}/submit"
    description: "Submit a DRAFT encounter for billing. When the encounter is linked to a home visit, that visit's documentation_status must be ATTESTED or AMENDED."
    roles: ["CHW"]
    code: 200
    input: []
    output: Encounter
    side_effects: ["Sets status SUBMITTED and submitted_at; the encounter joins the FINAL billing input set. Gated by the rung-4 write gate."]
  - method: POST
    path: "/chw/encounters/{id}/void"
    description: "Void an encounter. A LOCKED encounter may only be voided when its funding_source is GRANT. Exempt from the rung-4 write gate."
    roles: ["Supervisor"]
    code: 200
    input: ["reason?"]
    output: Encounter
    side_effects:
      - "Sets status VOIDED and funding_source UNFUNDED."
      - "Voiding a GRANT-locked encounter reverses its POSTED GrantChargeLine and decrements GrantAward.committed_cents by that line's total_amount_cents while raising remaining_budget_cents by the same amount (cascade depth 3); increments GrantAward.version by 1."

  # ---------------- payer claims ----------------
  - method: POST
    path: "/chw/payer-claims"
    description: "Create a monthly care-management claim under basis = PROVISIONAL (estimate, mutates nothing) or basis = FINAL (carves and locks minutes)."
    roles: ["BillingSpecialist"]
    code: 201
    input: ["patient_id", "service_month", "basis"]
    output: PayerClaim
    side_effects:
      - "Runs billable_minutes_monthly_rollup under the selected basis to set claimed_minutes, claimed_encounter_count, billing_code, units and allowed_amount_cents."
      - "basis = FINAL transitions every included Encounter SUBMITTED -> LOCKED with funding_source PAYER and funding_claim_id set."
      - "Gated by the rung-4 write gate."
  - method: GET
    path: "/chw/payer-claims/{id}"
    description: "Read one payer claim."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: PayerClaim
    side_effects: []
  - method: GET
    path: "/chw/payer-claims"
    description: "List payer claims, filterable by patient, month, status and basis."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: ["patient_id?", "service_month?", "status?", "basis?", "limit?", "offset?"]
    output: PayerClaim[]
    side_effects: []
  - method: POST
    path: "/chw/payer-claims/{id}/adjudicate"
    description: "Payer decision on a FINAL claim: outcome = PAID or DENIED. Exempt from the rung-4 write gate."
    roles: ["BillingSpecialist"]
    code: 200
    input: ["outcome", "denial_reason?"]
    output: PayerClaim
    side_effects: ["PAID sets status PAID. DENIED sets status DENIED, denial_reason and denied_at, which anchors the 60-day appeal window. Encounters stay LOCKED under both outcomes."]
  - method: POST
    path: "/chw/payer-claims/{id}/appeal"
    description: "Appeal a DENIED claim inside the 60-day window. Exempt from the rung-4 write gate."
    roles: ["BillingSpecialist"]
    code: 200
    input: []
    output: PayerClaim
    side_effects: ["Sets status APPEALED and appealed_at."]
  - method: POST
    path: "/chw/payer-claims/{id}/appeal-decision"
    description: "Resolve an appeal: decision = OVERTURNED or UPHELD. Exempt from the rung-4 write gate."
    roles: ["BillingSpecialist"]
    code: 200
    input: ["decision"]
    output: PayerClaim
    side_effects:
      - "OVERTURNED sets status OVERTURNED; encounters stay LOCKED with funding_source PAYER."
      - "UPHELD sets status UPHELD and compensates: every Encounter with funding_claim_id equal to this claim returns LOCKED -> SUBMITTED with funding_source UNFUNDED and funding_claim_id null, so the month becomes claimable again."

  # ---------------- grant awards and charge lines ----------------
  - method: POST
    path: "/chw/grant-awards"
    description: "Create a grant award. Award periods are CLOSED intervals: touching dates DO collide within a funder_name."
    roles: ["ProgramAdmin"]
    code: 201
    input: ["funder_name", "period_start", "period_end", "budget_cap_cents", "indirect_rate_pct?", "allowable_cost_categories?"]
    output: GrantAward
    side_effects: ["Creates the award OPEN with committed_cents 0 and remaining_budget_cents = budget_cap_cents."]
  - method: GET
    path: "/chw/grant-awards/{id}"
    description: "Read one grant award including committed and remaining budget."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: GrantAward
    side_effects: []
  - method: POST
    path: "/chw/grant-awards/{id}/close"
    description: "Close a grant award; no further charge lines may be posted."
    roles: ["ProgramAdmin"]
    code: 200
    input: []
    output: GrantAward
    side_effects: ["Sets status CLOSED and increments version by 1."]
  - method: POST
    path: "/chw/grant-charge-lines"
    description: "Charge one encounter's billable minutes to a grant award. The rate tier is read from the award's committed_cents as it stands BEFORE this line posts."
    roles: ["BillingSpecialist"]
    code: 201
    input: ["grant_award_id", "encounter_id", "expected_grant_award_version"]
    output: GrantChargeLine
    side_effects:
      - "Runs grant_charge_line_amount to set charged_minutes, hourly_rate_cents, direct_amount_cents, indirect_amount_cents and total_amount_cents."
      - "Transitions the Encounter SUBMITTED -> LOCKED with funding_source GRANT."
      - "Increases GrantAward.committed_cents and decreases remaining_budget_cents by total_amount_cents; increments GrantAward.version by 1."
      - "Gated by the rung-4 write gate; guarded by OCC on expected_grant_award_version."
  - method: GET
    path: "/chw/grant-charge-lines/{id}"
    description: "Read one grant charge line."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: GrantChargeLine
    side_effects: []
  - method: GET
    path: "/chw/grant-charge-lines"
    description: "List grant charge lines, filterable by award, encounter and status."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: ["grant_award_id?", "encounter_id?", "status?", "limit?", "offset?"]
    output: GrantChargeLine[]
    side_effects: []
  - method: POST
    path: "/chw/grant-charge-lines/{id}/reverse"
    description: "Reverse a POSTED charge line, returning both the money and the minutes. Exempt from the rung-4 write gate."
    roles: ["BillingSpecialist"]
    code: 200
    input: ["reversal_reason?"]
    output: GrantChargeLine
    side_effects:
      - "Sets reversed_at and reversal_reason; status becomes REVERSED."
      - "Decrements GrantAward.committed_cents and increments remaining_budget_cents by total_amount_cents; increments GrantAward.version by 1."
      - "Returns the Encounter LOCKED -> SUBMITTED with funding_source UNFUNDED."

  # ---------------- escalations ----------------
  - method: POST
    path: "/chw/escalations"
    description: "Open a manual escalation at OPEN_TIER_1; source_flag is always MANUAL and opened_by_user_id is the caller's X-User-ID."
    roles: ["CHW", "Supervisor"]
    code: 201
    input: ["patient_id", "note?"]
    output: Escalation
    side_effects: ["Creates the escalation at OPEN_TIER_1 with current_tier 1, tier_entered_at = now and ack_deadline_at = now + 48 hours. Gated by the rung-4 write gate."]
  - method: GET
    path: "/chw/escalations/{id}"
    description: "Read one escalation."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: []
    output: Escalation
    side_effects: []
  - method: GET
    path: "/chw/escalations"
    description: "List escalations, filterable by patient, source flag, status and each polymorphic source reference."
    roles: ["CHW", "Supervisor", "ProgramAdmin", "BillingSpecialist", "ResourcePartner"]
    code: 200
    input: ["patient_id?", "source_flag?", "status?", "source_referral_id?", "source_screening_id?", "blocking_offering_id?", "limit?", "offset?"]
    output: Escalation[]
    side_effects: []
  - method: POST
    path: "/chw/escalations/{id}/acknowledge"
    description: "Acknowledge an open escalation. The acting X-User-ID must differ from opened_by_user_id. Exempt from the rung-4 write gate."
    roles: ["Supervisor", "ProgramAdmin"]
    code: 200
    input: []
    output: Escalation
    side_effects: ["Sets status ACKNOWLEDGED and acknowledged_by_user_id; current_tier freezes at the tier reached."]
  - method: POST
    path: "/chw/escalations/{id}/resolve"
    description: "Resolve an acknowledged escalation. Exempt from the rung-4 write gate."
    roles: ["Supervisor", "ProgramAdmin"]
    code: 200
    input: []
    output: Escalation
    side_effects: ["Sets status RESOLVED and resolution_reason MANUAL_RESOLUTION."]

  # ---------------- system sweeps and reporting ----------------
  - method: POST
    path: "/chw/ops/run-sweep"
    description: "Run one lazy sweep: sweep_type = REFERRAL_LAPSE (SENT referrals past ack_deadline_at), OFFERING_HOLD_EXPIRY (ACCEPTED referrals past hold_expires_at) or ESCALATION_PROMOTION (open escalations past ack_deadline_at). Exempt from the rung-4 write gate."
    roles: ["ProgramAdmin"]
    code: 200
    input: ["sweep_type"]
    output: "{ sweep_type: string, referrals_lapsed: integer, holds_expired: integer, escalations_promoted: integer, units_returned: integer }"
    side_effects:
      - "REFERRAL_LAPSE lapses SENT referrals with lapse_reason ACK_SLA_EXPIRED and releases their holds into released_units."
      - "OFFERING_HOLD_EXPIRY lapses ACCEPTED referrals with lapse_reason HOLD_EXPIRED and returns their holds into expired_units."
      - "ESCALATION_PROMOTION promotes OPEN_TIER_1 to OPEN_TIER_2 and OPEN_TIER_2 to OPEN_TIER_3; OPEN_TIER_3 is the ceiling and is left untouched."
      - "Rows are processed in created_at ASC order within each sweep type."
  - method: GET
    path: "/chw/reports/program-summary"
    description: "Derived program report. Nothing here is stored on any entity; every figure is recomputed on read. denominator_basis selects ENROLLED_ONLY or EVER_ENROLLED."
    roles: ["Supervisor", "ProgramAdmin", "BillingSpecialist"]
    code: 200
    input: ["service_month", "denominator_basis"]
    output: "{ patient_denominator_count: integer, screening_coverage_pct: number, referral_loop_closure_pct: number, payer_minutes: integer, grant_minutes: integer, unfunded_minutes: integer, travel_reimbursement_monthly_cents: integer, open_escalation_count: integer }"
    side_effects: []

# ===========================================================================
# §1.6 ERROR CODE CATALOG (33 codes; every one is reachable — see the
# reachability column, which names a concrete triggering request)
# ===========================================================================
errors:

  # --- rung 1-2: authentication and authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role is not one of the five declared roles."
    reachable_via: "Any endpoint called without headers."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles."
    reachable_via: "POST /chw/patients/{id}/records-hold as CHW."

  # --- rung 3 and 6: existence ---
  - id: ERR_PATIENT_NOT_FOUND
    http: 404
    condition: "A Patient id supplied in the path (rung 3) or in a request body (rung 6) does not resolve."
    reachable_via: "GET /chw/patients/{unknown-uuid}; POST /chw/goals with an unknown patient_id."
  - id: ERR_REFERRAL_NOT_FOUND
    http: 404
    condition: "A Referral id supplied in the path does not resolve."
    reachable_via: "POST /chw/referrals/{unknown-uuid}/close."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "Any other path id (rung 3) or body-supplied foreign key (rung 6) does not resolve."
    reachable_via: "GET /chw/offerings/{unknown-uuid}; POST /chw/referrals with an unknown offering_id."

  # --- rung 4: the write gate ---
  - id: ERR_PATIENT_RECORDS_HOLD
    http: 409
    condition: "The resolved gate-subject Patient has gate_status == RECORDS_HOLD and the operation is in write_gate.gated_operations."
    reachable_via: "POST /chw/goals for a patient placed on records hold."

  # --- rung 5: payload ---
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong JSON type, undeclared enum member, out-of-range scalar, failed cross-field rule, or a uniqueness violation on mrn, employee_code or (name, version_label)."
    reachable_via: "POST /chw/patients with household_size 0; POST /chw/referrals with urgency BOGUS."

  # --- rung 7: optimistic concurrency ---
  - id: ERR_STALE_OFFERING_VERSION
    http: 412
    condition: "expected_offering_version does not equal the current ResourceOffering.version."
    reachable_via: "POST /chw/referrals carrying the offering version observed before an earlier referral placed a hold."
  - id: ERR_STALE_GRANT_VERSION
    http: 412
    condition: "expected_grant_award_version does not equal the current GrantAward.version."
    reachable_via: "POST /chw/grant-charge-lines carrying the award version observed before an earlier line posted."
  - id: ERR_STALE_PATIENT_VERSION
    http: 412
    condition: "expected_patient_version does not equal the current Patient.version."
    reachable_via: "POST /chw/screenings carrying the patient version observed before an earlier screening rewrote the patient's risk fields."

  # --- rung 8-9: state ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target row is not in a from-state that permits the requested transition, a PROVISIONAL claim is being adjudicated, a payer-locked encounter is being voided, or an encounter linked to an unattested visit is being submitted."
    reachable_via: "POST /chw/referrals/{id}/deliver on a SENT referral."
  - id: ERR_INSTRUMENT_NOT_PUBLISHED
    http: 409
    condition: "The ScreeningInstrument named by instrument_id has status DRAFT or RETIRED."
    reachable_via: "POST /chw/screenings against a DRAFT instrument."
  - id: ERR_RESOURCE_ORG_SUSPENDED
    http: 409
    condition: "The ResourceOrg owning the target offering has status SUSPENDED."
    reachable_via: "POST /chw/referrals against an offering whose organization was just suspended."
  - id: ERR_PATIENT_NOT_ENROLLED
    http: 409
    condition: "The subject Patient's enrollment_status is PROSPECTIVE or DISENROLLED where the operation requires ENROLLED."
    reachable_via: "POST /chw/encounters for a PROSPECTIVE patient."

  # --- rung 10: actor identity and segregation of duties ---
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "The acting X-User-ID is not the owner the operation requires (partner organization, assigned worker, encounter worker), or the documentation-revision action does not match the caller's role."
    reachable_via: "POST /chw/home-visits/{id}/attest by a CHW who is not assigned_chw_id."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The X-User-ID acknowledging an Escalation equals Escalation.opened_by_user_id."
    reachable_via: "A Supervisor opening an escalation and then acknowledging it with the same X-User-ID."

  # --- rung 11: safety ---
  - id: ERR_TWO_PERSON_VISIT_REQUIRED
    http: 422
    condition: "The patient's address_safety_flag is true and POST /chw/home-visits omitted second_chw_id."
    reachable_via: "POST /chw/home-visits for a safety-flagged patient with no second worker."

  # --- rung 12: the eligibility gauntlet ---
  - id: ERR_ELIGIBILITY_INCOME
    http: 422
    condition: "First failing criterion is INCOME_BAND: monthly_income_cents exceeds max_monthly_income_cents."
    reachable_via: "POST /chw/referrals for a patient above the offering's income band."
  - id: ERR_ELIGIBILITY_GEOGRAPHY
    http: 422
    condition: "First failing criterion is GEOGRAPHY: residence_zip is not in allowed_zips."
    reachable_via: "POST /chw/referrals for an out-of-area patient who passes the income band."
  - id: ERR_ELIGIBILITY_HOUSEHOLD_SIZE
    http: 422
    condition: "First failing criterion is HOUSEHOLD_SIZE: household_size falls outside the inclusive band."
    reachable_via: "POST /chw/offerings/{id}/eligibility-check equivalent request path, or POST /chw/referrals for a single-person household against a family offering."
  - id: ERR_ELIGIBILITY_PROGRAM_ENROLLMENT
    http: 422
    condition: "First failing criterion is PROGRAM_ENROLLMENT: required_program_code is absent from program_enrollments."
    reachable_via: "POST /chw/referrals for a patient without the SNAP enrollment an offering requires."
  - id: ERR_ELIGIBILITY_CATEGORICAL_EXCLUSION
    http: 422
    condition: "First failing criterion is CATEGORICAL_EXCLUSION: excluded_flag_code is present in categorical_exclusions."
    reachable_via: "POST /chw/referrals for a patient carrying the offering's exclusion flag."

  # --- rung 13: temporal overlap ---
  - id: ERR_VISIT_SLOT_CONFLICT
    http: 409
    condition: "A worker's HALF-OPEN visit slot overlaps an existing SCHEDULED, EN_ROUTE or COMPLETED visit for the same worker."
    reachable_via: "POST /chw/home-visits one minute inside an existing slot for the same assigned_chw_id."
  - id: ERR_GRANT_PERIOD_OVERLAP
    http: 409
    condition: "A new GrantAward's CLOSED period touches or overlaps an existing OPEN award's period for the same funder_name."
    reachable_via: "POST /chw/grant-awards whose period_start equals an existing award's period_end."

  # --- rung 14: windows and counts ---
  - id: ERR_ATTESTATION_WINDOW_CLOSED
    http: 422
    condition: "More than 72 hours have elapsed since HomeVisit.completed_at."
    reachable_via: "Advance the clock 73 hours past completion, then POST /chw/home-visits/{id}/attest."
  - id: ERR_AMENDMENT_WINDOW_CLOSED
    http: 422
    condition: "More than 30 days have elapsed since HomeVisit.attested_at."
    reachable_via: "Advance the clock 31 days past attestation, then POST a documentation-revision with action AMEND."
  - id: ERR_REROUTE_LIMIT_EXCEEDED
    http: 422
    condition: "The referral chain's reroute_count has already reached MAX_REROUTE_COUNT (2)."
    reachable_via: "A third POST /chw/referrals/{id}/reroute on the same chain."
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "More than 60 days have elapsed since PayerClaim.denied_at."
    reachable_via: "Advance the clock 61 days past denial, then POST /chw/payer-claims/{id}/appeal."

  # --- rung 15: funding exclusivity and allowability ---
  - id: ERR_MINUTES_ALREADY_FUNDED
    http: 409
    condition: "Payer side: the month already carries grant-funded encounters or a blocking prior FINAL claim. Grant side: the referenced Encounter's funding_source is not UNFUNDED."
    reachable_via: "POST /chw/grant-charge-lines for an encounter already locked to a payer claim."
  - id: ERR_ENCOUNTER_NOT_ALLOWABLE
    http: 422
    condition: "The encounter_date falls outside the award's CLOSED period, or the encounter's only minutes are travel_minutes."
    reachable_via: "POST /chw/grant-charge-lines for an encounter dated one day after period_end."

  # --- rung 16-17: capacity and fiscal ---
  - id: ERR_INSUFFICIENT_UNITS
    http: 409
    condition: "units_requested exceeds ResourceOffering.available_units."
    reachable_via: "POST /chw/referrals for 2 units against an offering with 1 available."
  - id: ERR_GRANT_BUDGET_EXCEEDED
    http: 422
    condition: "committed_cents plus the new line's total_amount_cents would exceed budget_cap_cents."
    reachable_via: "POST /chw/grant-charge-lines against an award whose remaining budget is smaller than the computed line."
  - id: ERR_MINUTE_THRESHOLD_NOT_MET
    http: 422
    condition: "claimed_minutes under the selected basis is below CM_CODE_MINUTE_THRESHOLD (60)."
    reachable_via: "POST /chw/payer-claims for a month holding a single 30-minute encounter."

# ===========================================================================
# §1.7 RBAC MATRIX (segregation of duties)
# ===========================================================================
roles:

  - name: CHW
    description: "Community health worker. Screens patients, sends and closes referrals, runs home visits, owns care-plan goals and records encounter time. Cannot touch billing, program configuration or records holds."
    identity: "entity_backed:CommunityHealthWorker"
    exclusive_operations:
      - "POST /chw/referrals"
      - "POST /chw/referrals/{id}/reroute"
      - "POST /chw/home-visits/{id}/en-route"
      - "POST /chw/home-visits/{id}/complete"
      - "POST /chw/home-visits/{id}/attest"
      - "POST /chw/goals/{id}/progress"
      - "POST /chw/encounters"
      - "POST /chw/encounters/{id}/submit"
    shared_operations:
      - "POST /chw/patients (with Supervisor and ProgramAdmin)"
      - "POST /chw/screenings (with Supervisor)"
      - "POST /chw/home-visits, /no-show, /cancel, /documentation-revision AMEND (with Supervisor)"
      - "POST /chw/goals, /close, /reopen (with Supervisor)"
      - "POST /chw/referrals/{id}/close (with Supervisor)"
      - "POST /chw/escalations (with Supervisor)"
      - "POST /chw/offerings/{id}/eligibility-check (with Supervisor and ProgramAdmin)"
      - "All GET endpoints except GET /chw/reports/program-summary"
    ownership_rules:
      - "X-User-ID MUST equal HomeVisit.assigned_chw_id for en-route, complete, attest and documentation-revision AMEND."
      - "X-User-ID MUST equal Encounter.chw_id for submit."

  - name: Supervisor
    description: "Program supervisor. Places and releases records holds, drives patient enrollment, voids documentation and encounters, and acknowledges and resolves escalations. Cannot bill."
    identity: opaque
    exclusive_operations:
      - "POST /chw/patients/{id}/records-hold"
      - "PATCH /chw/patients/{id} (shared only with ProgramAdmin)"
      - "POST /chw/home-visits/{id}/documentation-revision with action = VOID"
      - "POST /chw/encounters/{id}/void"
    shared_operations:
      - "POST /chw/escalations/{id}/acknowledge and /resolve (with ProgramAdmin)"
      - "POST /chw/patients, /chw/screenings, /chw/home-visits, /chw/goals, /chw/referrals/{id}/close, /chw/escalations (with CHW)"
      - "GET /chw/reports/program-summary (with ProgramAdmin and BillingSpecialist)"
      - "All GET endpoints"
    segregation_rules:
      - "A Supervisor MUST NOT acknowledge an Escalation whose opened_by_user_id equals their own X-User-ID."

  - name: ProgramAdmin
    description: "Program administrator. Owns configuration — workers, screening instruments, resource organizations, offerings, eligibility criteria, grant awards — plus the logical clock and the system sweeps. Cannot perform clinical work."
    identity: opaque
    exclusive_operations:
      - "POST /chw/_clock/set_current_utc"
      - "POST /chw/workers"
      - "POST /chw/screening-instruments, /publish, /retire"
      - "POST /chw/resource-orgs, /suspend"
      - "POST /chw/offerings, /chw/offerings/{id}/criteria"
      - "POST /chw/grant-awards, /chw/grant-awards/{id}/close"
      - "POST /chw/ops/run-sweep"
    shared_operations:
      - "PATCH /chw/patients/{id} (with Supervisor)"
      - "POST /chw/patients (with CHW and Supervisor)"
      - "POST /chw/escalations/{id}/acknowledge and /resolve (with Supervisor)"
      - "POST /chw/offerings/{id}/eligibility-check (with CHW and Supervisor)"
      - "GET /chw/reports/program-summary (with Supervisor and BillingSpecialist)"
      - "All GET endpoints"

  - name: BillingSpecialist
    description: "Revenue-cycle specialist. Owns every funding path: payer claims and their appeals, and grant charge lines and their reversals. Cannot create or submit the encounters being billed, which is the core segregation of duties in this program."
    identity: opaque
    exclusive_operations:
      - "POST /chw/payer-claims"
      - "POST /chw/payer-claims/{id}/adjudicate, /appeal, /appeal-decision"
      - "POST /chw/grant-charge-lines"
      - "POST /chw/grant-charge-lines/{id}/reverse"
    shared_operations:
      - "GET /chw/reports/program-summary (with Supervisor and ProgramAdmin)"
      - "All GET endpoints"
    segregation_rules:
      - "BillingSpecialist cannot create, submit or void an Encounter; CHW creates and submits, Supervisor voids, BillingSpecialist funds."

  - name: ResourcePartner
    description: "Community resource organization acting on its own referrals. X-User-ID is a ResourceOrg id."
    identity: "entity_backed:ResourceOrg"
    exclusive_operations:
      - "POST /chw/referrals/{id}/respond"
      - "POST /chw/referrals/{id}/deliver"
    shared_operations:
      - "All GET endpoints except GET /chw/reports/program-summary"
    ownership_rules:
      - "X-User-ID MUST equal the resource_org_id of the ResourceOffering named by the referral's offering_id."
