          Cancelling one dine-around leg propagates three links — TransportSegment CANCELLED -> all three
          ManifestEntry rows RELEASED -> Program.seated_guest_count 4 -> 0 and
          Program.unseated_guest_count 0 -> 3 — a transport-side trigger reaching seat counters, disjoint
          from the permit-side trigger and labor counters of permit_denial_cascade_depth_four.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Program 2026-09-10..2026-09-14."
            - "One SCHEDULED TransportSegment DINE_AROUND_LEG 2026-09-12T18:00Z..18:40Z, seat_capacity 20, wheelchair_accessible true."
            - "Three ManifestEntry rows on it with seat_count 2, 1 and 1 (booked_seat_count 4, Program.seated_guest_count 4, unseated_guest_count 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs"
              payload: { client_name: "Fenwick Legal", group_name: "Partner Dine-Around", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 24, markup_pct: 0.22 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${prog_id}", segment_type: "DINE_AROUND_LEG", vehicle_code: "VAN-07", origin: "Host Hotel", destination: "Trattoria Nine", depart_at: "2026-09-12T18:00:00Z", arrive_at: "2026-09-12T18:40:00Z", seat_capacity: 20, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg_id}", guest_ref: "G-001", guest_name: "Ingrid Halvorsen", seat_count: 2, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me1: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg_id}", guest_ref: "G-002", guest_name: "Tomas Beltran", seat_count: 1, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me2: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg_id}", guest_ref: "G-003", guest_name: "Ruth Adeyemi", seat_count: 1, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me3: $.data.id }
          trigger:
            - call: "POST /dmc/transport-segments/${seg_id}/cancel"
              payload: { cancel_reason: "Restaurant lost power; leg scrubbed." }
              as: OperationsCoordinator
          assert:
            - "TransportSegment.${seg_id}.status == CANCELLED"
            - "TransportSegment.${seg_id}.booked_seat_count == 0"
            - "ManifestEntry.${me1}.status == RELEASED"
            - "ManifestEntry.${me2}.status == RELEASED"
            - "ManifestEntry.${me3}.status == RELEASED"
            - "Program.${prog_id}.seated_guest_count == 0"
            - "Program.${prog_id}.unseated_guest_count == 3"
            - "Program.${prog_id}.staffing_gap_count == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: element_create_turnover_conflict_outranks_capacity_exceeded
        grounds:
          - validations[priority=22]
          - validations[priority=30]
          - errors[ERR_VENUE_TURNOVER_CONFLICT]
          - errors[ERR_VENUE_CAPACITY_EXCEEDED]
          - entities.Venue.fields.turnover_buffer_minutes
          - entities.Venue.fields.capacity_seated
        distinguishing_aspect: |
          A single create violates a business_temporal rule (priority 22, venue turnover buffer) and a
          business_constraint rule (priority 30, seated capacity) at once; the response must be
          ERR_VENUE_TURNOVER_CONFLICT with HTTP 409, never ERR_VENUE_CAPACITY_EXCEEDED with HTTP 422 — the
          category pair here is business_temporal vs business_constraint.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One Venue with capacity_seated 50, capacity_reception 60 and turnover_buffer_minutes 90."
            - "One APPROVED Supplier; Program 2026-09-10..2026-09-14 with markup_pct 0.18."
            - "One DINE_AROUND ProgramElement at that venue 2026-09-11T18:00Z..20:00Z with planned_headcount 40 (inside the seated capacity of 50), so Program.element_count == 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/venues"
              payload: { name: "Quayside Supper Room", capacity_seated: 50, capacity_reception: 60, turnover_buffer_minutes: 90, requires_special_venue_permit: false, status: "ACTIVE" }
              as: ProgramDirector
              captures: { venue_id: $.data.id }
            - call: "POST /dmc/suppliers"
              payload: { legal_name: "Quayside Hospitality Ltd", supplier_type: "VENUE_SERVICES", insurance_expires_on: "2027-01-31", insurance_liability_limit_cents: 500000000, coi_verified: true, status: "APPROVED" }
              as: SupplierManager
              captures: { sup_id: $.data.id }
            - call: "POST /dmc/programs"
              payload: { client_name: "Sable Media", group_name: "Creative Summit", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 90, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v1: $.data.version }
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "DINE_AROUND", title: "First Seating", starts_at: "2026-09-11T18:00:00Z", ends_at: "2026-09-11T20:00:00Z", planned_headcount: 40, guaranteed_headcount: 40, per_person_cost_cents: 11000, is_weather_dependent: false, expected_program_version: "${prog_v1}" }
              as: ProgramDirector
              captures: { el1: $.data.id }
            - call: "GET /dmc/programs/${prog_id}"
              payload: {}
              as: ProgramDirector
              captures: { prog_v2: $.data.version }
          trigger:
            - call: "POST /dmc/program-elements"
              payload: { program_id: "${prog_id}", supplier_id: "${sup_id}", venue_id: "${venue_id}", element_type: "DINE_AROUND", title: "Second Seating", starts_at: "2026-09-11T20:30:00Z", ends_at: "2026-09-11T22:30:00Z", planned_headcount: 80, guaranteed_headcount: 80, per_person_cost_cents: 11000, is_weather_dependent: false, expected_program_version: "${prog_v2}" }
              as: ProgramDirector
          assert:
            - "trigger returns HTTP 409 with data.error_id == ERR_VENUE_TURNOVER_CONFLICT"
            - "data.error_id != ERR_VENUE_CAPACITY_EXCEEDED"
            - "Program.${prog_id}.element_count == 1"
            - "Program.${prog_id}.open_element_count == 1"
            - "Program.${prog_id}.version == ${prog_v2}"

      - name: assignment_confirm_credential_expired_outranks_rest_gap
        grounds:
          - validations[priority=16]
          - validations[priority=24]
          - errors[ERR_CREDENTIAL_EXPIRED]
          - errors[ERR_STAFF_REST_GAP_VIOLATION]
          - calculations.staff_credential_status
          - entities.StaffMember.fields.min_rest_minutes
        distinguishing_aspect: |
          A single confirm violates a business_safety rule (priority 16, expired badge) and a
          business_temporal rule (priority 24, 60-minute gap against a 600-minute rest requirement) at
          once; the response must be ERR_CREDENTIAL_EXPIRED — a business_safety vs business_temporal pair,
          disjoint from the business_temporal vs business_constraint pair of
          element_create_turnover_conflict_outranks_capacity_exceeded.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Program 2026-09-10..2026-09-14; one SHUTTLE_LOOP TransportSegment on it."
            - "One ACTIVE COORDINATOR StaffMember, pay_rate_cents_per_hour 4200, min_rest_minutes 600, max_daily_minutes 720, badge_expires_on 2027-06-30, first_aid_expires_on 2027-12-31."
            - "Shift 1 (2026-09-11T08:00Z..12:00Z, 240 minutes) CONFIRMED while credentials are valid, so confirmed_minutes_total == 240."
            - "Badge then patched back to 2026-08-20 and the clock advanced to 2026-09-05T00:00:00Z, making credential_status EXPIRED."
            - "Shift 2 (2026-09-11T13:00Z..17:00Z) left PROPOSED: it does not overlap shift 1 under the closed-interval rule (13:00 > 12:00) but leaves only a 60-minute gap against a 600-minute rest requirement."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs"
              payload: { client_name: "Pinnacle Devices", group_name: "Field Service Rally", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 70, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${prog_id}", segment_type: "SHUTTLE_LOOP", vehicle_code: "SHUT-02", origin: "Host Hotel", destination: "Expo Hall", depart_at: "2026-09-11T08:00:00Z", arrive_at: "2026-09-11T17:00:00Z", seat_capacity: 40, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /dmc/staff-members"
              payload: { full_name: "Marc Delacroix", role_type: "COORDINATOR", badge_expires_on: "2027-06-30", first_aid_expires_on: "2027-12-31", pay_rate_cents_per_hour: 4200, min_rest_minutes: 600, max_daily_minutes: 720, status: "ACTIVE" }
              as: ProgramDirector
              captures: { staff_id: $.data.id }
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_id}", program_id: "${prog_id}", target_type: "SEGMENT", segment_id: "${seg_id}", role_type: "COORDINATOR", starts_at: "2026-09-11T08:00:00Z", ends_at: "2026-09-11T12:00:00Z" }
              as: ProgramDirector
              captures: { asg1: $.data.id }
            - call: "POST /dmc/staff-assignments/${asg1}/confirm"
              payload: {}
              as: ProgramDirector
            - call: "POST /dmc/staff-assignments"
              payload: { staff_id: "${staff_id}", program_id: "${prog_id}", target_type: "SEGMENT", segment_id: "${seg_id}", role_type: "COORDINATOR", starts_at: "2026-09-11T13:00:00Z", ends_at: "2026-09-11T17:00:00Z" }
              as: ProgramDirector
              captures: { asg2: $.data.id }
            - call: "PATCH /dmc/staff-members/${staff_id}"
              payload: { badge_expires_on: "2026-08-20" }
              as: ProgramDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ProgramDirector
          trigger:
            - call: "POST /dmc/staff-assignments/${asg2}/confirm"
              payload: {}
              as: ProgramDirector
          assert:
            - "trigger returns HTTP 422 with data.error_id == ERR_CREDENTIAL_EXPIRED"
            - "data.error_id != ERR_STAFF_REST_GAP_VIOLATION"
            - "StaffAssignment.${asg2}.status == PROPOSED"
            - "StaffAssignment.${asg2}.planned_labor_cost_cents == 0"
            - "StaffMember.${staff_id}.confirmed_minutes_total == 240"
            - "StaffMember.${staff_id}.credential_status == EXPIRED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: segment_seat_capacity_exact_fill_then_single_seat_overflow
        grounds:
          - calculations.segment_seat_occupancy
          - validations[priority=31]
          - errors[ERR_SEGMENT_CAPACITY_EXCEEDED]
          - entities.TransportSegment.fields.seat_capacity
          - entities.TransportSegment.fields.booked_seat_count
          - entities.Program.fields.seated_guest_count
        distinguishing_aspect: |
          The metric is an integer seat count on POST /dmc/manifest-entries and the comparison is strictly
          `>`: filling a 12-seat vehicle to exactly 12 succeeds (booked_seat_count == 12) while the very
          next 1-seat entry is rejected with ERR_SEGMENT_CAPACITY_EXCEEDED, leaving booked_seat_count at 12.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; Program 2026-09-10..2026-09-14."
            - "One SCHEDULED TransportSegment ARRIVAL_TRANSFER 2026-09-10T14:00Z..15:00Z with seat_capacity 12 and wheelchair_accessible true."
            - "Two ManifestEntry rows with seat_count 5 and 4, so booked_seat_count == 9 and Program.seated_guest_count == 9."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs"
              payload: { client_name: "Brightline Health", group_name: "Nurse Leaders Forum", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 12, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/transport-segments"
              payload: { program_id: "${prog_id}", segment_type: "ARRIVAL_TRANSFER", vehicle_code: "MINI-03", origin: "Airport T2", destination: "Host Hotel", depart_at: "2026-09-10T14:00:00Z", arrive_at: "2026-09-10T15:00:00Z", seat_capacity: 12, wheelchair_accessible: true }
              as: OperationsCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg_id}", guest_ref: "G-101", guest_name: "Family Nkemdirim", seat_count: 5, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me1: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg_id}", guest_ref: "G-102", guest_name: "Party Vasquez", seat_count: 4, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me2: $.data.id }
          trigger:
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg_id}", guest_ref: "G-103", guest_name: "Party Okonkwo", seat_count: 3, mobility_assist: false }
              as: OperationsCoordinator
              captures: { me3: $.data.id }
            - call: "POST /dmc/manifest-entries"
              payload: { segment_id: "${seg_id}", guest_ref: "G-104", guest_name: "Solo Traveller Hahn", seat_count: 1, mobility_assist: false }
              as: OperationsCoordinator
          assert:
            - "the first trigger call returns HTTP 201 and TransportSegment.${seg_id}.booked_seat_count == 12"
            - "Program.${prog_id}.seated_guest_count == 12"
            - "the second trigger call returns HTTP 409 with data.error_id == ERR_SEGMENT_CAPACITY_EXCEEDED"
            - "TransportSegment.${seg_id}.booked_seat_count == 12 after the rejected call"
            - "GET /dmc/manifest-entries?segment_id=${seg_id} returns total_count == 3"

      - name: credential_expiring_window_inclusive_boundary_on_confirm
        grounds:
          - calculations.staff_credential_status
          - validations[priority=16]
          - errors[ERR_CREDENTIAL_EXPIRED]
          - entities.StaffMember.fields.badge_expires_on
          - entities.StaffMember.fields.credential_status
        distinguishing_aspect: |
          The metric is a calendar-day distance to expiry on POST /dmc/staff-assignments/{id}/confirm and
          the two comparisons have different strictness: at clock 2026-09-01 a badge expiring exactly on
          2026-09-15 (now + CREDENTIAL_EXPIRING_WINDOW_DAYS) is EXPIRING and confirms successfully, a badge
          expiring 2026-08-31 (strictly before now) is EXPIRED and is rejected, and 2026-09-16 is VALID —
          a different metric and a different endpoint from
          segment_seat_capacity_exact_fill_then_single_seat_overflow.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z when the fixtures are created, then moved to 2026-09-01T00:00:00Z."
            - "Program 2026-09-10..2026-09-14; one SHUTTLE_LOOP TransportSegment on it."
            - "Three ACTIVE GREETER StaffMembers, all pay_rate_cents_per_hour 3000, first_aid_expires_on 2027-12-31, min_rest_minutes 600, max_daily_minutes 720; badge_expires_on 2026-09-15 (X), 2026-08-31 (Y) and 2026-09-16 (Z)."
            - "One PROPOSED 2026-09-11T09:00Z..13:00Z shift per staff member (240 minutes each; different staff, so no overlap or rest interaction)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /dmc/programs"
              payload: { client_name: "Cordis Analytics", group_name: "User Conference", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 200, markup_pct: 0.18 }
