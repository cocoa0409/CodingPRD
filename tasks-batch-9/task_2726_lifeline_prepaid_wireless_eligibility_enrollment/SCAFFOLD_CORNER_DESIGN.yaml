              as_user_id: "${p1_id}"
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-R5" }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { chk_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}", provider_id: "${p1_id}", eligibility_check_id: "${chk_id}", certified_address_id: "${addr_id}", service_type: "VOICE", one_per_household_attested: true }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { enr_id: $.data.id, freeze_until: $.data.port_freeze_until }
          trigger:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-29T23:59:59.999Z" }
              as: ProgramAdministrator
            - call: "GET /lifeline/enrollments/${enr_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { ver_1: $.data.version }
            - call: "POST /lifeline/service-transfers"
              payload: { enrollment_id: "${enr_id}", target_provider_id: "${p2_id}", subscriber_consent_ref: "CONSENT-41", expected_enrollment_version: "${ver_1}" }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { err_freeze: $.data.error_id }
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/service-transfers"
              payload: { enrollment_id: "${enr_id}", target_provider_id: "${p1_id}", subscriber_consent_ref: "CONSENT-42", expected_enrollment_version: "${ver_1}" }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { err_same: $.data.error_id }
            - call: "POST /lifeline/service-transfers"
              payload: { enrollment_id: "${enr_id}", target_provider_id: "${p2_id}", subscriber_consent_ref: "CONSENT-43", expected_enrollment_version: "${ver_1}" }
              as: ProviderAgent
              as_user_id: "${p1_id}"
              captures: { t_id: $.data.id, t_status: $.data.status }
            - call: "POST /lifeline/service-transfers/${t_id}/reject"
