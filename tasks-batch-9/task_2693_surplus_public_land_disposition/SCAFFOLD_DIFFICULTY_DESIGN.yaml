        grounds:
          - state_machines.Conveyance.READY_TO_RECORD_to_RECORDED
          - state_machines.SurplusDeclaration.OFFERING_AUTHORIZED_to_CONVEYED
          - state_machines.DispositionOffering.AWARDED_to_CLOSED_CONVEYED
          - state_machines.Bid.HELD_to_APPLIED
          - calculations.proceeds_waterfall_allocation
        distinguishing_aspect: |
          A different trigger (POST /conveyances/{id}/record) with cascade depth 4
          on a different spine: Parcel.ownership_status AGENCY_OWNED -> CONVEYED
          (link 1) forces SurplusDeclaration -> CONVEYED and DispositionOffering
          -> CLOSED_CONVEYED (link 2), which runs the waterfall and emits the
          ProceedsAllocation row (link 3), which credits Fund.balance_cents and
          lifetime_credits_cents (link 4); the winning Bid's deposit also moves
