            - "total_charge_amount == 475.00 = 400.00 + 50.00 fuel + 25.00 security (captured ${tot})"

      - name: liability_variant_math
        claim_type: variant_divergence
        grounds: ["calculations.liability_limit"]
        excluded_because:
          difficulty_instance: "dual_variant_calc / standard_vs_declared_value_liability"
          rationale: "Both liability variants with exact literals (2970.00 STANDARD vs 3000.00 DECLARED_VALUE) are asserted in the named 1.8 instance."

      - name: charge_line_rounding_order
        claim_type: precision
        grounds: ["calculations.charge_line_total"]
        excluded_because:
          difficulty_instance: "combinatorial_formula / per_line_rounding_then_sum"
          rationale: "The pinned per-line-then-sum rounding order (184.26 vs 184.25) is asserted in the named 1.8 instance."

  - section: validations
    instances:
      - name: forbidden_role_beats_not_found
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]"]
        distinguishing_aspect: "Authorization (priority 2) precedes existence (priority 3): a PricingManager submitting a NON-EXISTENT waybill gets ERR_FORBIDDEN_ROLE, never the 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /air-freight/house-waybills/00000000-0000-4000-8000-0000000000cc/submit", as: PricingManager, captures: { err: "$.data.error_id" } }
          assert:
            - "captured ${err} == ERR_FORBIDDEN_ROLE (HTTP 403) — role check wins over the non-existent resource"

      - name: path_existence_validated_left_to_right
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_MASTER_WAYBILL_NOT_FOUND]"]
        distinguishing_aspect: "With BOTH the master waybill id and the body hwb_id unknown, the path segment fails first: ERR_MASTER_WAYBILL_NOT_FOUND, not ERR_HOUSE_WAYBILL_NOT_FOUND."
        test_recipe:
          setup: ["A real booking + MAWB exist only to source a well-formed version value"]
          setup_api_calls:
            - { call: "POST /air-freight/flight-bookings", payload: { airline_code: "UA", flight_number: "UA838", origin_code: "SFO", destination_code: "NRT", scheduled_departure_utc: "2026-08-10T10:00:00Z", cutoff_utc: "2026-08-09T10:00:00Z", booked_weight_kg: 500.0, booked_volume_m3: 50.0 }, as: CapacityPlanner, captures: { bk1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "GET /air-freight/master-waybills/${mb1}", as: ForwarderOps, captures: { mv1: "$.data.version" } }
          trigger:
            - { call: "POST /air-freight/master-waybills/00000000-0000-4000-8000-0000000000dd/house-waybills", payload: { hwb_id: "00000000-0000-4000-8000-0000000000ee", expected_master_waybill_version: "${mv1}" }, as: ForwarderOps, captures: { err: "$.data.error_id" } }
          assert:
            - "captured ${err} == ERR_MASTER_WAYBILL_NOT_FOUND (left path segment validated before the body hwb_id)"

