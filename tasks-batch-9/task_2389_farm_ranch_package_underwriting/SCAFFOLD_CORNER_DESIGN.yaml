          assert:
            - "the decline sets uw_status DECLINED with closure_reason 'unacceptable wildfire exposure' and cancels Inspection.${ins_id2} (status CANCELLED)"
            - "all six follow-up calls return HTTP 409 with error_id == ERR_POLICY_TERMINAL"
            - "in particular the rate attempt reports ERR_POLICY_TERMINAL and NOT ERR_POLICY_NOT_IN_DRAFT — terminal lockdown is checked ahead of the per-route state message"
            - "ScheduledItem.${it_dw}.stated_value_cents is still 40000000, no second item exists and no LaborProfile row was created"
            - "FarmPolicy.${pol_id}.version does not advance past the decline"

      - name: corner_endorsement_decided_twice_rejected
        claim_type: idempotency
        grounds: ["state_machines.Endorsement[REQUESTED->APPROVED]", "calculations.endorsement_premium", "errors.ERR_ENDORSEMENT_NOT_REQUESTED"]
        distinguishing_aspect: "A PEAK_SEASON_INCREASE endorsement (requires_inspection false) is approved once for 132000; the identical second decision returns ERR_ENDORSEMENT_NOT_REQUESTED (409) and does not post the premium twice."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy rated to 269200, one REQUESTED PEAK_SEASON_INCREASE endorsement with sublimit 12000000"
          setup_api_calls:
