      - name: missing_x_user_role_header_is_unauthorized_unless_the_path_id_is_absent
        claim_type: standard_crud
        grounds:
          - validations[priority=2].path_entity_exists
          - validations[priority=4].role_permitted
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          An absent X-User-Role header is treated exactly like a disallowed one, and the 404-before-403
          ordering is proven with the same header state on two calls that differ only in whether the path
          id resolves — so the existence check cannot be short-circuited by the authorization check.
        test_recipe:
          setup:
            - "One composer exists so that a resolvable path id is available."
          setup_api_calls:
            - call: "POST /music-library/composers"
              payload: { display_name: "Nadia Okoro", pro_affiliation: "ASCAP" }
              as: CatalogAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: "(X-User-Role header omitted)"
            - call: "POST /music-library/composers"
              payload: { display_name: "Anonymous Upload", pro_affiliation: "ASCAP" }
              as: "(X-User-Role header omitted)"
            - call: "GET /music-library/composers/00000000-0000-0000-0000-0000000000d1"
              payload: {}
              as: "(X-User-Role header omitted)"
            - call: "GET /music-library/composers/${c1}"
              payload: {}
              as: "(X-User-Role header set to Archivist)"
          assert:
            - "Call 1 → 403 with data.error_id == \"ERR_UNAUTHORIZED\""
            - "Call 2 → 403 with data.error_id == \"ERR_UNAUTHORIZED\" and no composer row is created"
            - "Call 3 → 404 with data.error_id == \"ERR_COMPOSER_NOT_FOUND\", not ERR_UNAUTHORIZED (priority 2 precedes priority 4)"
            - "Call 4 → 403 with data.error_id == \"ERR_UNAUTHORIZED\" (an unrecognised role value is refused identically to an absent header)"

