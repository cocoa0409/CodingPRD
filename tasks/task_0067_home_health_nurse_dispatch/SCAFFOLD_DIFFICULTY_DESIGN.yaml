  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_episode_unlocks_oasis_lock_count_invariant
        grounds:
          - state_machines.Episode.DRAFT_to_CANCELLED
          - entities.OASISAssessment.fields.locked
          - state_machines.Episode.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity = OASIS lock-availability. Episode create locks the SOC OASIS; the compensating cancel
          unlocks it, restoring locked=false so the same OASIS can seed a fresh episode — net lock state unchanged after create+cancel.
        test_recipe:
          setup:
            - "Clock 2026-02-01; WOUND config active."
            - "A SOC OASIS exists; an Episode is created from it (OASIS locked=true), still DRAFT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now_utc: "2026-02-01T08:00:00Z" }
              as: BillingManager
            - call: "POST /pdgm-rate-configs"
