              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-orders/${o1}/mark-ready"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "11 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q2: $.data.id }
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q2}", customer_reference: "CO-2", idempotency_key: "co-2" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o2: $.data.id }
            - call: "POST /delivery-orders/${o2}/accept"
              payload: { promised_at: "2026-09-01T02:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-orders/${o2}/mark-ready"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "12 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q3: $.data.id }
            - call: "POST /delivery-orders"
              payload: { quote_id: "${q3}", customer_reference: "CO-3", idempotency_key: "co-3" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { o3: $.data.id }
            # o3 cannot be accepted (balance 1000 - 500 - 500 == 0): leave o3 ACCEPTED? No — leave QUOTED; batch excludes it.
            - call: "POST /delivery-batches"
              payload: { store_id: "${s_id}", courier_id: "${c_id}", order_ids: ["${o1}", "${o2}"], dispatch_window_start: "2026-09-01T00:30:00Z", dispatch_window_end: "2026-09-01T01:30:00Z", expected_courier_version: "${c_v0}" }
              as: PlatformAdmin
              captures: { b1: $.data.id }
            - call: "POST /delivery-batches/${b1}/dispatch"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "POST /delivery-orders/${o1}/confirm-pickup"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /delivery-batches/${b1}/fail"
              payload: {}
              as: Courier
              as_user_id: "${c_id}"
            - call: "GET /delivery-orders/${o1}"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - call: "GET /delivery-orders/${o2}"
              payload: {}
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-batches"
              payload: { store_id: "${s_id}", courier_id: "${c2_id}", order_ids: ["${o2}"], dispatch_window_start: "2026-09-01T02:00:00Z", dispatch_window_end: "2026-09-01T03:00:00Z", expected_courier_version: "${c2_v0}" }
              as: PlatformAdmin
              captures: { b2: $.data.id }
            - call: "POST /delivery-batches/${b2}/dispatch"
              payload: {}
              as: Courier
              as_user_id: "${c2_id}"
          assert:
            - "DeliveryBatch.${b1}.status == FAILED"
            - "DeliveryOrder.${o1}.fulfillment_status == PICKED_UP and batch_id is null (kept picked state)"
            - "DeliveryOrder.${o2}.fulfillment_status == READY_FOR_PICKUP and batch_id is null (reverted)"
            - "re-batch with second courier succeeds and DeliveryBatch.${b2}.status == DISPATCHED"

