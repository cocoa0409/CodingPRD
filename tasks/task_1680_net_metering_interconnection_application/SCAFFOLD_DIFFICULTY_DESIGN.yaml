            - { call: "POST /customers", payload: { full_name: "Cons Cust", email: "cons@x.com" }, as: ProgramAdministrator, captures: { cust: $.data.id } }
            - { call: "POST /service-accounts", payload: { customer_id: "${cust}", transformer_id: "${tx}", account_number: "ACCT-CONS", service_class: COMMERCIAL, prior_annual_usage_wh: 20000000 }, as: ProgramAdministrator, captures: { acct: $.data.id } }
            - { call: "POST /applications", payload: { service_account_id: "${acct}", program_id: "${prog}", technology: SOLAR_PV, system_size_watts_ac: 10000, estimated_annual_production_wh: 15000000 }, as: Applicant, as_user_id: "${cust}", captures: { app: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SITE_PLAN, title: "site" }, as: Applicant, as_user_id: "${cust}", captures: { doc1: $.data.id } }
            - { call: "POST /documents", payload: { application_id: "${app}", doc_type: SINGLE_LINE_DIAGRAM, title: "sld" }, as: Applicant, as_user_id: "${cust}", captures: { doc2: $.data.id } }
            - { call: "POST /documents/${doc1}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /documents/${doc2}/review", payload: { outcome: ACCEPTED }, as: InterconnectionCoordinator }
            - { call: "POST /applications/${app}/submit", payload: {}, as: Applicant, as_user_id: "${cust}" }
            - { call: "POST /applications/${app}/completeness-decision", payload: { outcome: COMPLETE }, as: InterconnectionCoordinator }
            - { call: "POST /screening-reports", payload: { application_id: "${app}" }, as: DistributionEngineer }
            - { call: "POST /meter-exchanges", payload: { application_id: "${app}", crew_id: "crew-1", window_start: "2026-08-03T09:00:00Z", window_end: "2026-08-03T11:00:00Z" }, as: MeterTechnician, captures: { ex: $.data.id } }
            - { call: "POST /meter-exchanges/${ex}/complete", payload: { installed_meter_serial: "MTR-1" }, as: MeterTechnician, as_user_id: "tech-1" }
            - { call: "POST /inspections", payload: { application_id: "${app}", scheduled_date: "2026-08-05T09:00:00Z" }, as: Applicant, as_user_id: "${cust}", captures: { insp: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: ProgramAdministrator }
            - { call: "POST /inspections/${insp}/record-result", payload: { outcome: PASSED, occurred_at: "2026-08-05T10:00:00Z" }, as: Inspector, as_user_id: "insp-1" }
            - { call: "POST /applications/${app}/grant-pto", payload: {}, as: InterconnectionCoordinator }
            - { call: "GET /service-accounts/${acct}", as: ProgramAdministrator, captures: { acct_v: $.data.version } }
          trigger:
            - { call: "POST /meter-readings", payload: { service_account_id: "${acct}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", import_wh: 500000, export_wh: 800000, expected_account_version: "${acct_v}" }, as: MeterTechnician, captures: { r1: $.data.id } }
