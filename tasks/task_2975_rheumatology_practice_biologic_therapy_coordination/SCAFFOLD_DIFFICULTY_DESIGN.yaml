      - name: quality_report_half_open_window_excludes_visit_at_period_end
        grounds:
          - calculations.quality_report_aggregation
          - validations.priority_47_ERR_QUALITY_PERIOD_NO_VISITS
          - endpoints.GET_patients_id_quality_report
        distinguishing_aspect: |
          A different metric on a different endpoint: the reporting window of
          GET /patients/{id}/quality-report is HALF-OPEN (period_start <= t < period_end), not
          the score ladder of the previous instance. The patient's only visit sits exactly at
          period_end in the first call, so qualifying_visit_count collapses to zero and the read
          must return ERR_QUALITY_PERIOD_NO_VISITS; moving period_end forward by one second
          returns 200, and a window whose period_start equals that same instant also returns 200,
          proving the lower bound is inclusive while the upper bound is exclusive.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One rheumatologist, one nurse, one patient with registry_consent true (so priority 41 cannot fire)."
            - "Exactly one FOLLOW_UP visit at 2026-08-03T14:00:00Z, checked in and scored CDAI 9.00 (LOW, at target, escalation CONTINUE)."
            - "No InfusionAppointment exists, so administered_dose_count is 0 and biosimilar_uptake_pct falls back to 0.0."
          setup_api_calls:
            - call: "POST /clinicians"
              payload: { npi: "1234567893", full_name: "Ada Rheum", role_type: "RHEUMATOLOGIST", can_attest_formulary_exception: true }
              as: RegistryAdmin
              captures: { rheum1_id: $.data.id }
