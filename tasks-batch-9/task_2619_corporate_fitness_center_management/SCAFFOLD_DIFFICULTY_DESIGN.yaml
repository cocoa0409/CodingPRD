          AED_INSPECTION_MAX_AGE_DAYS, evaluated at POST /facility-assets creation
          time rather than through the readiness score. With the clock on
          2026-08-01: last_inspection_on 2026-07-02 is exactly 30 days old and MUST
          be READY (the rule rejects only `> 30`), 2026-07-01 is 31 days old and MUST
          be NOT_READY, and a unit inspected yesterday whose pads expire exactly
          today + AED_CONSUMABLE_WARN_DAYS MUST be PADS_EXPIRING — a third state on
          the same boundary family that must NOT satisfy the AED gate.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; ACTIVE COST_PLUS contract with Studio A OPEN."
            - "Three AEDs are created in one room in the same request batch, differing only in the boundary field under test."
            - "AED-30: last_inspection_on 2026-07-02 (exactly 30 days), pads and battery 2027-03-31."
            - "AED-31: last_inspection_on 2026-07-01 (31 days), pads and battery 2027-03-31."
            - "AED-PAD: last_inspection_on 2026-07-31, pad_expiry_on 2026-08-31 (exactly today + 30), battery 2027-03-31."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: OperatorAdmin
            - call: "POST /client-contracts"
