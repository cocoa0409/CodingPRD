            - "ServiceVisit.${v_id}.services_outstanding == 1"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: hangar_tow_buffer_blocks_adjacency
        grounds:
          - validations[priority=9]
          - state_machines.ParkingAssignment.HELD_to_OCCUPIED
          - errors[ERR_SPOT_TOW_BUFFER_CONFLICT]
        distinguishing_aspect: |
          On a HANGAR spot, closed-with-buffer semantics reject an occupy whose
          window starts exactly when an OCCUPIED window ends ([10:00,11:00) then
          [11:00,12:00)) because the 30-minute tow buffer is violated — adjacency
          is NOT allowed on hangars.
        test_recipe:
          setup:
            - "A HANGAR spot with one OCCUPIED assignment for [10:00,11:00); a second HELD assignment on the same spot for [11:00,12:00)."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "H-1", spot_type: "HANGAR", max_weight_class: "HEAVY" }
              as: OpsDispatcher
              captures: { spot_id: $.data.id }
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T08:00:00.000Z", departure_utc: "2026-06-15T08:00:00.000Z" }
              as: OpsDispatcher
              captures: { v1_id: $.data.id }
            - call: "POST /service-visits/${v1_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /parking-assignments"
              payload: { service_visit_id: "${v1_id}", spot_id: "${spot_id}", occupy_start_utc: "2026-06-14T10:00:00.000Z", occupy_end_utc: "2026-06-14T11:00:00.000Z" }
              as: OpsDispatcher
              captures: { pa1_id: $.data.id, pa1_ver: $.data.version }
            - call: "POST /parking-assignments/${pa1_id}/occupy"
              payload: { expected_assignment_version: "${pa1_ver}" }
              as: OpsDispatcher
            - call: "POST /service-visits"
              payload: { operator_id: "${op_id}", aircraft_id: "${ac_id}", arrival_utc: "2026-06-14T09:00:00.000Z", departure_utc: "2026-06-15T09:00:00.000Z" }
              as: OpsDispatcher
              captures: { v2_id: $.data.id }
            - call: "POST /service-visits/${v2_id}/arrive"
              payload: {}
              as: OpsDispatcher
            - call: "POST /parking-assignments"
              payload: { service_visit_id: "${v2_id}", spot_id: "${spot_id}", occupy_start_utc: "2026-06-14T11:00:00.000Z", occupy_end_utc: "2026-06-14T12:00:00.000Z" }
              as: OpsDispatcher
              captures: { pa2_id: $.data.id, pa2_ver: $.data.version }
          trigger:
            - call: "POST /parking-assignments/${pa2_id}/occupy"
              payload: { expected_assignment_version: "${pa2_ver}" }
              as: OpsDispatcher
          assert:
            - "response.error_id == ERR_SPOT_TOW_BUFFER_CONFLICT"
            - "response.http_status == 409"
            - "ParkingAssignment.${pa2_id}.status == HELD"

      - name: ramp_slot_half_open_allows_adjacency
        grounds:
          - validations[priority=11]
          - state_machines.RampSlot.REQUESTED_to_APPROVED
          - errors[ERR_SLOT_OVERLAP]
        distinguishing_aspect: |
          On a RAMP pad, half-open semantics ALLOW an approve whose window starts
          exactly when an APPROVED window ends ([10:00,11:00) then [11:00,12:00))
          but REJECT a true overlap ([10:30,11:30)) — different interval geometry
          (no buffer, adjacency permitted) on a different resource (RampSlot) than the hangar.
        test_recipe:
          setup:
            - "A RAMP pad with one APPROVED slot for [10:00,11:00); a REQUESTED slot for the adjacent [11:00,12:00) and another REQUESTED slot for the overlapping [10:30,11:30)."
          setup_api_calls:
            - call: "POST /operators"
              payload: { legal_name: "Aero Ops", contact_email: "ops@aero.test" }
              as: BillingClerk
              captures: { op_id: $.data.id }
            - call: "POST /aircraft"
              payload: { operator_id: "${op_id}", tail_number: "N100AA", fuel_type: "JET_A", mtow_lb: 30000 }
              as: OpsDispatcher
              captures: { ac_id: $.data.id }
            - call: "POST /parking-spots"
              payload: { label: "PAD-9", spot_type: "RAMP", max_weight_class: "HEAVY" }
