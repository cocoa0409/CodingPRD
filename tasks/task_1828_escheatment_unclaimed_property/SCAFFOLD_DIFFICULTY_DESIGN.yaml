  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: property_dormancy_reactivation_cycle
        grounds:
          - state_machines.Property.ACTIVE_to_DORMANT
          - state_machines.Property.DORMANT_to_ACTIVE
          - calculations.dormancy_determination
        distinguishing_aspect: |
          Property machine is cyclic: ACTIVE -> DORMANT -> ACTIVE (reactivation)
          -> DORMANT again, and the second dormancy_date is recomputed from the
          NEW last_contact_date (2029-08-02), not the original (2026-03-16).
        test_recipe:
          setup:
            - "CA SAVINGS property (rule 3y) dormant at default clock, reactivated with a qualifying WITHDRAWAL contact dated 2026-08-01, then swept again across the new anniversary."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Cyc Lical", last_known_address: "6 Ivy Ct, Merced, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 60000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/contact-events", payload: { contact_type: "WITHDRAWAL", contact_date: "2026-08-01", evidence_ref: "stmt-881" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev1: $.data.id } }
            - { call: "POST /escheatment/properties/${p1}/reactivate", payload: { evidence_contact_event_id: "${ev1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { st_mid: $.data.status } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2029-08-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { st_anniv: $.data.status } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2029-08-02T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { st_end: $.data.status, dd_end: $.data.dormancy_date } }
          assert:
            - "After first sweep: status DORMANT with dormancy_date 2026-03-16 (observed in setup via reactivation eligibility)"
            - "After reactivate: status == ACTIVE and dormancy_date is null"
            - "Sweep on the new anniversary 2029-08-01: status still ACTIVE (strict > boundary)"
            - "Sweep on 2029-08-02: status == DORMANT and dormancy_date == 2029-08-02 — the cycle closed and the clock reset from the reactivation contact"

      - name: claim_more_info_request_cycle
        grounds:
          - state_machines.OwnerClaim.UNDER_REVIEW_to_MORE_INFO_REQUESTED
          - state_machines.OwnerClaim.MORE_INFO_REQUESTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          OwnerClaim machine loops UNDER_REVIEW <-> MORE_INFO_REQUESTED (two full
          rounds exercised) before approval; reviewed_by_user_id stays pinned to
          the original examiner across loops and the payout is computed only at
          APPROVED.
        test_recipe:
          setup:
            - "CA SAVINGS property 150000c remitted and confirmed at clock 2026-09-01; claim filed by its owner and under review by ce-1."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Loop Clara", last_known_address: "7 Ash Way, Chico, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 150000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/accept", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/remittances", payload: { amount_cents: 150000 }, as: TreasuryOps, as_user_id: "to-1", captures: { rem1: $.data.id } }
            - { call: "POST /escheatment/remittances/${rem1}/confirm", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/owner-claims", payload: { property_id: "${p1}" }, as: Claimant, as_user_id: "${own1}", captures: { cl1: $.data.id } }
            - { call: "POST /escheatment/owner-claims/${cl1}/start-review", as: ClaimsExaminer, as_user_id: "ce-1" }
          trigger:
            - { call: "POST /escheatment/owner-claims/${cl1}/request-info", payload: { info_request_note: "need id document" }, as: ClaimsExaminer, as_user_id: "ce-1", captures: { s1: $.data.status } }
            - { call: "POST /escheatment/owner-claims/${cl1}/submit-info", payload: { info_response_ref: "doc-9" }, as: Claimant, as_user_id: "${own1}", captures: { s2: $.data.status } }
            - { call: "POST /escheatment/owner-claims/${cl1}/request-info", payload: { info_request_note: "need proof of address" }, as: ClaimsExaminer, as_user_id: "ce-1", captures: { s3: $.data.status } }
            - { call: "POST /escheatment/owner-claims/${cl1}/submit-info", payload: { info_response_ref: "doc-10" }, as: Claimant, as_user_id: "${own1}", captures: { s4: $.data.status } }
            - { call: "POST /escheatment/owner-claims/${cl1}/approve", as: ClaimsApprover, as_user_id: "ap-1", captures: { s5: $.data.status, pay5: $.data.approved_payout_cents, rb5: $.data.reviewed_by_user_id } }
          assert:
            - "Loop 1: MORE_INFO_REQUESTED then UNDER_REVIEW; loop 2: MORE_INFO_REQUESTED then UNDER_REVIEW (cycle traversed twice)"
            - "reviewed_by_user_id == ce-1 still, after both loops"
            - "Final status APPROVED; days_held == 0 -> interest 0; gross 150000 > 100000 -> fee 2250; approved_payout_cents == 147750"

      - name: report_reject_reopen_resubmit_cycle
        grounds:
          - state_machines.HolderReport.SUBMITTED_to_REJECTED
          - state_machines.HolderReport.REJECTED_to_DRAFT
        distinguishing_aspect: |
          HolderReport machine loops SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED
          (non-linear revision cycle on HolderReport, distinct from the Property
          and OwnerClaim cycles); reopen clears submission metadata and resubmit
          re-stamps it from the advanced clock.
        test_recipe:
          setup:
            - "CA 2026 report with one 80000c SAVINGS line whose letter EXPIRED 2026-08-31, submitted 2026-09-01, rejected, reopened, resubmitted 2026-09-15."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Rej Ect", last_known_address: "8 Oak Bl, Redding, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 80000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1", captures: { sub1_date: $.data.submitted_date } }
            - { call: "POST /escheatment/holder-reports/${r1}/reject", payload: { rejection_reason: "malformed NAUPA file" }, as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/reopen", as: ComplianceOfficer, as_user_id: "co-1", captures: { st_draft: $.data.status, sub_cleared: $.data.submitted_date } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-15T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1", captures: { st2: $.data.status, sub2: $.data.submitted_date } }
          assert:
            - "First submit at 2026-09-01 succeeds (letter EXPIRED satisfies due-diligence completeness)"
            - "reject -> REJECTED; reopen -> DRAFT with submitted_date == null and rejection_reason == null"
            - "Resubmit -> SUBMITTED with submitted_date == 2026-09-15 (re-stamped from advanced clock)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: liquidation_settle_cascade_line_report_remittance
        grounds:
          - state_machines.LiquidationOrder.EXECUTED_to_SETTLED
          - state_machines.ReportLineItem.INCLUDED_to_FINAL
          - calculations.report_totals
          - entities.Remittance.fields.variance_cents
        distinguishing_aspect: |
          Depth-3 chain from a single trigger (settle): order SETTLED mutates the
          ReportLineItem (INCLUDED -> FINAL, final = net proceeds); that line
          mutation recomputes HolderReport.total_final_cents; that report mutation
          recomputes the PENDING Remittance.variance_cents (462500 - 480000 ==
          -17500), which then blocks confirm until requeue.
        test_recipe:
          setup:
            - "NV securities property (100 sh, close 4500c, div 12500c) in an ACCEPTED NV 2026 report (provisional 462500c); a liquidation order REQUESTED with fee 2500c; a PENDING remittance of 462500c created BEFORE settle; order executed at 4700c."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "NV", property_type: "BROKERAGE_SHARES", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Cas Cade", last_known_address: "10 Pine St, Reno, NV", state_code: "NV" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "BROKERAGE_SHARES", state_code: "NV", original_value_cents: 462500, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/properties/${p1}/securities-detail", payload: { cusip: "ESC1828C", shares_quantity: 100, last_close_price_cents: 4500, accrued_dividends_cents: 12500 }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "NV", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { li1: $.data.id } }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/accept", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/liquidation-orders", payload: { property_id: "${p1}", liquidation_fee_cents: 2500 }, as: TreasuryOps, as_user_id: "to-1", captures: { lo1: $.data.id } }
            - { call: "POST /escheatment/holder-reports/${r1}/remittances", payload: { amount_cents: 462500 }, as: TreasuryOps, as_user_id: "to-1", captures: { rem1: $.data.id } }
            - { call: "POST /escheatment/liquidation-orders/${lo1}/execute", payload: { execution_price_cents_per_share: 4700 }, as: TreasuryOps, as_user_id: "to-1" }
          trigger:
            - { call: "POST /escheatment/liquidation-orders/${lo1}/settle", as: TreasuryOps, as_user_id: "to-1" }
            - { call: "GET /escheatment/holder-reports/${r1}/line-items", as: Any, captures: { li_st: "$.data[0].status", li_fin: "$.data[0].final_value_cents" } }
            - { call: "GET /escheatment/holder-reports/${r1}", as: Any, captures: { r_fin: $.data.total_final_cents } }
            - { call: "GET /escheatment/remittances/${rem1}", as: Any, captures: { rem_var: $.data.variance_cents } }
            - { call: "POST /escheatment/remittances/${rem1}/confirm", as: StateAuditor, as_user_id: "sa-1", captures: { err_var: $.data.error_id } }
            - { call: "POST /escheatment/remittances/${rem1}/fail", payload: { failure_reason: "amount mismatch" }, as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/remittances/${rem1}/requeue", payload: { amount_cents: 480000 }, as: TreasuryOps, as_user_id: "to-1" }
            - { call: "POST /escheatment/remittances/${rem1}/confirm", as: StateAuditor, as_user_id: "sa-1", captures: { rem_st: $.data.status } }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { p_st: $.data.status } }
          assert:
            - "Hop 1: line ${li1} status FINAL, final_value_cents == 480000"
            - "Hop 2: report total_final_cents == 480000 (was 462500 before settle), total_provisional_cents still 462500"
            - "Hop 3: PENDING remittance variance_cents recomputed to -17500; confirm rejected with ERR_REMITTANCE_VARIANCE_NONZERO"
            - "After fail + requeue 480000 + confirm: remittance CONFIRMED and property REMITTED"

      - name: reactivation_cascade_line_removal_totals
        grounds:
          - state_machines.Property.REPORTABLE_to_ACTIVE
          - state_machines.ReportLineItem.INCLUDED_to_REMOVED
          - calculations.report_totals
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (reactivate, not settle):
          property REPORTABLE -> ACTIVE mutates the DRAFT-report line
          (INCLUDED -> REMOVED); that removal recomputes the report's totals to
          0 and bumps the report version.
        test_recipe:
          setup:
            - "CA SAVINGS property 50000c, letter expired, REPORTABLE, included as the only line of a DRAFT CA 2026 report (total 50000c, version 2); a qualifying contact event dated 2026-08-20 exists."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Reac Tivate", last_known_address: "11 Elm Dr, Suisun, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 50000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { li1: $.data.id } }
            - { call: "POST /escheatment/properties/${p1}/contact-events", payload: { contact_type: "IN_PERSON", contact_date: "2026-08-20", evidence_ref: "branch-visit-77" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/properties/${p1}/reactivate", payload: { evidence_contact_event_id: "${ev1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p_st: $.data.status } }
            - { call: "GET /escheatment/holder-reports/${r1}/line-items", as: Any, captures: { li_st: "$.data[0].status" } }
            - { call: "GET /escheatment/holder-reports/${r1}", as: Any, captures: { r_prov: $.data.total_provisional_cents, r_fin: $.data.total_final_cents, r_cnt: $.data.line_count, r_ver: $.data.version } }
          assert:
            - "Trigger: property status == ACTIVE"
            - "Hop 1: line ${li1} status == REMOVED (only DRAFT-report lines are touched)"
            - "Hop 2: report total_provisional_cents == 0, total_final_cents == 0, line_count == 0, version incremented from 2 to 3"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_failed_remittance_state_beats_fiscal_variance
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_REMITTANCE_NOT_PENDING]
          - errors[ERR_REMITTANCE_VARIANCE_NONZERO]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): a FAILED remittance whose amount
          also mismatches the report total fails BOTH the state precondition (p8)
          and the variance check (p12); the state error ERR_REMITTANCE_NOT_PENDING
          must be returned.
        test_recipe:
          setup:
            - "CA cash property 100000c through accept; remittance created with amount 99999c (variance -1000 nonzero), then marked FAILED by the state."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Pri Orij", last_known_address: "12 Bay St, Eureka, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 100000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/accept", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/remittances", payload: { amount_cents: 99999 }, as: TreasuryOps, as_user_id: "to-1", captures: { rem1: $.data.id } }
            - { call: "POST /escheatment/remittances/${rem1}/fail", payload: { failure_reason: "state clearinghouse reject" }, as: StateAuditor, as_user_id: "sa-1" }
          trigger:
            - { call: "POST /escheatment/remittances/${rem1}/confirm", as: StateAuditor, as_user_id: "sa-1", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_REMITTANCE_NOT_PENDING (state, priority 8) even though variance -1000 would also fail the fiscal check (priority 12)"
            - "remittance remains FAILED; report.confirmed_remittance_cents unchanged (0)"

      - name: duplicate_letter_constraint_beats_window_temporal
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_DUPLICATE_ACTIVE_LETTER]
          - errors[ERR_DUE_DILIGENCE_WINDOW_VIOLATION]
        distinguishing_aspect: |
          Category pair (business_constraint, business_temporal) — different pair
          from the state/fiscal instance: with an active SENT letter AND the clock
          outside the send window, letter creation fails both p9 and p10; the
          constraint error ERR_DUPLICATE_ACTIVE_LETTER must win.
        test_recipe:
          setup:
            - "CA property 75000c DORMANT with letter1 SENT 2026-08-01 (inside window); clock advanced to 2026-09-10 (outside [2026-05-05, 2026-09-02]) without running the sweep, so letter1 is still SENT."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Dup Letter", last_known_address: "13 Hill Ct, Yuba, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 75000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { let1: $.data.id } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-10T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_DUPLICATE_ACTIVE_LETTER (constraint, priority 9) even though 2026-09-10 is also outside the send window (temporal, priority 10)"
            - "letter1 ${let1} remains SENT; no second letter created"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: dormancy_anniversary_strictly_greater_boundary
        grounds:
          - calculations.dormancy_determination
          - state_machines.Property.ACTIVE_to_DORMANT
        distinguishing_aspect: |
          Metric: days elapsed. On the exact anniversary date (2026-03-15) the
          property stays ACTIVE (strict > comparison); one day later it flips to
          DORMANT. Reached via POST /escheatment/_sweeps/dormancy.
        test_recipe:
          setup:
            - "CA SAVINGS rule 3y; property last_contact_date 2023-03-15; clock parked at the anniversary 2026-03-15 for the first sweep."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Bou Ndary", last_known_address: "14 Lake St, Truckee, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 40000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-03-15T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { st1: $.data.status } }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-03-16T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "GET /escheatment/properties/${p1}", as: Any, captures: { st2: $.data.status, dd2: $.data.dormancy_date } }
          assert:
            - "Sweep at 2026-03-15 (exact anniversary): status == ACTIVE — strictly-greater comparison excludes the anniversary itself"
            - "Sweep at 2026-03-16: status == DORMANT and dormancy_date == 2026-03-16"

      - name: dd_threshold_exact_5000_boundary
        grounds:
          - entities.DormancyRule.fields.dd_threshold_cents
          - state_machines.Property.DORMANT_to_DUE_DILIGENCE
          - state_machines.Property.DORMANT_to_REPORTABLE
        distinguishing_aspect: |
          Metric: property value in cents (different metric and endpoint from the
          dormancy-day boundary). original_value_cents == 5000 meets >= and
          requires the letter; 4999 does not — and the sweep auto-advances only
          the under-threshold property to REPORTABLE.
        test_recipe:
          setup:
            - "CA UNCASHED_CHECK rule (default threshold 5000c); property A 5000c and property B 4999c, both dormant-eligible."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "UNCASHED_CHECK", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Thres Hold", last_known_address: "15 Mill St, Vallejo, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "UNCASHED_CHECK", state_code: "CA", original_value_cents: 5000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { pa: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "UNCASHED_CHECK", state_code: "CA", original_value_cents: 4999, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { pb: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "POST /escheatment/properties/${pa}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { leta: $.data.id } }
            - { call: "POST /escheatment/properties/${pb}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { err_b: $.data.error_id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "GET /escheatment/properties/${pa}", as: Any, captures: { sta: $.data.status } }
            - { call: "GET /escheatment/properties/${pb}", as: Any, captures: { stb: $.data.status } }
          assert:
            - "Property A (exactly 5000c): letter creation succeeds (201) — >= threshold is inclusive; status DUE_DILIGENCE"
            - "Property B (4999c): letter creation rejected with ERR_DUE_DILIGENCE_NOT_REQUIRED (422)"
            - "Second sweep: B (under threshold) auto-advances DORMANT -> REPORTABLE; A stays DUE_DILIGENCE (letter path is mandatory at/above threshold)"

      - name: remittance_variance_exactly_zero_boundary
        grounds:
          - entities.Remittance.fields.variance_cents
          - state_machines.Remittance.PENDING_to_CONFIRMED
          - errors[ERR_REMITTANCE_VARIANCE_NONZERO]
        distinguishing_aspect: |
          Metric: remittance variance in cents on the confirm endpoint (different
          metric and endpoint from the two instances above). variance == +1 is
          rejected; requeue to the exact total yields variance == 0 and confirms.
        test_recipe:
          setup:
            - "CA cash property 100000c through report accept; remittance created at 100001c."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Var Iance", last_known_address: "16 Bay Ave, Alameda, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 100000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/accept", as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/remittances", payload: { amount_cents: 100001 }, as: TreasuryOps, as_user_id: "to-1", captures: { rem1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/remittances/${rem1}/confirm", as: StateAuditor, as_user_id: "sa-1", captures: { err_id: $.data.error_id } }
            - { call: "POST /escheatment/remittances/${rem1}/fail", payload: { failure_reason: "overpayment" }, as: StateAuditor, as_user_id: "sa-1" }
            - { call: "POST /escheatment/remittances/${rem1}/requeue", payload: { amount_cents: 100000 }, as: TreasuryOps, as_user_id: "to-1" }
            - { call: "POST /escheatment/remittances/${rem1}/confirm", as: StateAuditor, as_user_id: "sa-1", captures: { rem_st: $.data.status, rem_var: $.data.variance_cents } }
          assert:
            - "variance +1: confirm rejected with ERR_REMITTANCE_VARIANCE_NONZERO (422)"
            - "After requeue to exactly 100000: confirm succeeds, variance_cents == 0, status CONFIRMED — the equality boundary admits exactly 0 and nothing else"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: letter_create_requires_property_dormant
        grounds:
          - state_machines.Property.DORMANT_to_DUE_DILIGENCE
          - errors[ERR_PROPERTY_NOT_DORMANT]
        distinguishing_aspect: |
          Entity pair DueDiligenceLetter -> Property: letter creation is gated on
          the property's state; on an ACTIVE property the request is rejected with
          ERR_PROPERTY_NOT_DORMANT.
        test_recipe:
          setup:
            - "CA SAVINGS rule and property registered; NO sweep run, so the property is still ACTIVE."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Gate One", last_known_address: "17 Lake Ct, Sonora, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 90000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
          trigger:
            - { call: "POST /escheatment/properties/${p1}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1", captures: { err_id: $.data.error_id } }
          assert:
            - "error_id == ERR_PROPERTY_NOT_DORMANT (409); no letter row created"

      - name: line_item_requires_reportable_property_and_draft_report
        grounds:
          - state_machines.HolderReport.DRAFT_to_SUBMITTED
          - errors[ERR_PROPERTY_NOT_REPORTABLE]
          - errors[ERR_REPORT_NOT_DRAFT]
        distinguishing_aspect: |
          Entity pair ReportLineItem -> Property and ReportLineItem -> HolderReport
          (different pair from Letter -> Property): the property must be REPORTABLE
          (referential, 422) and the report must be DRAFT (state, 409); both
          directions of the gate are exercised.
        test_recipe:
          setup:
            - "Two CA SAVINGS properties (60000c each). P1 only swept to DORMANT (letter never sent); P2 fully REPORTABLE and already lined into a report that is then SUBMITTED."
          setup_api_calls:
            - { call: "POST /escheatment/dormancy-rules", payload: { state_code: "CA", property_type: "SAVINGS", dormancy_years: 3, effective_from: "2020-01-01" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/owners", payload: { full_name: "Gate Two", last_known_address: "18 Pine Ave, Lodi, CA", state_code: "CA" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { own1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 60000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p1: $.data.id } }
            - { call: "POST /escheatment/properties", payload: { owner_id: "${own1}", property_type: "SAVINGS", state_code: "CA", original_value_cents: 60000, last_contact_date: "2023-03-15" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { p2: $.data.id } }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/holder-reports", payload: { state_code: "CA", report_year: 2026 }, as: ComplianceOfficer, as_user_id: "co-1", captures: { r1: $.data.id, r1_v1: $.data.version } }
            - { call: "POST /escheatment/properties/${p2}/due-diligence-letters", as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: HolderAdmin, as_user_id: "ha-1" }
            - { call: "POST /escheatment/_sweeps/dormancy", as: HolderAdmin, as_user_id: "ha-1" }
          trigger:
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p1}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err1: $.data.error_id } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p2}", expected_report_version: "${r1_v1}" }, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /escheatment/holder-reports/${r1}/submit", as: ComplianceOfficer, as_user_id: "co-1", captures: { r1_v3: $.data.version } }
            - { call: "POST /escheatment/holder-reports/${r1}/line-items", payload: { property_id: "${p2}", expected_report_version: "${r1_v3}" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { err2: $.data.error_id } }
          assert:
            - "P1 (DORMANT, not REPORTABLE) into DRAFT report: error_id == ERR_PROPERTY_NOT_REPORTABLE (422)"
            - "P2 (REPORTABLE) into DRAFT report: 201 INCLUDED"
            - "After submit, same line-add of P2 with the now-current version ${r1_v3}: OCC passes (version matches), state gate fails: error_id == ERR_REPORT_NOT_DRAFT (409)"

      - name: claim_create_requires_remitted_property
        grounds:
          - state_machines.OwnerClaim.transitions
          - errors[ERR_PROPERTY_NOT_CLAIMABLE]
        distinguishing_aspect: |
          Entity pair OwnerClaim -> Property (different pair from the letter and
          line-item instances): a claim on a REPORTED-but-not-yet-REMITTED
          property is rejected with ERR_PROPERTY_NOT_CLAIMABLE.
        test_recipe:
          setup:
