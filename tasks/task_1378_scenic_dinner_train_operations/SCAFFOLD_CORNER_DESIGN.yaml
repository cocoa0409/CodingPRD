scaffold_corner_design:
  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: excursion_created_with_defaults_and_computed_service_date
        claim_type: creation
        grounds: [entities.Excursion, state_machines.Excursion]
        distinguishing_aspect: "Excursion create returns status DRAFT, version 1, cancel_reason null, service_date copied from the slot, and zero availability before any car assignment."
        test_recipe:
          setup: ["ACTIVE agreement with one OPEN slot on 2026-10-15"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/excursions", payload: { title: "Fall Colors", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex_status: "$.data.status", ex_v: "$.data.version", ex_date: "$.data.service_date", ex_reason: "$.data.cancel_reason", ex_avail: "$.data.coach_seats_available" } }
          assert:
            - "${ex_status} == DRAFT (initial state)"
            - "${ex_v} == 1"
            - "${ex_date} == 2026-10-15 (computed copy from the slot)"
            - "${ex_reason} == null"
            - "${ex_avail} == 0 (no cars assigned yet)"
      - name: create_slot_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.OperatingSlot, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required end_minute on slot create fails with ERR_VALIDATION 400 before any business rule runs."
        test_recipe:
          setup: ["ACTIVE agreement"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
          trigger:
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600 }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400 (end_minute missing)"
      - name: create_agreement_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.TrackRightsAgreement]
        distinguishing_aspect: "Client-supplied id/version in the create payload are ignored: the server mints its own UUID id and starts version at 1."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id", agr_v: "$.data.version" } }
          assert:
            - "${agr} is a server-minted UUID distinct from any client-supplied value"
            - "${agr_v} == 1 regardless of client input"
      - name: create_stock_invalid_enum_value_rejected
        claim_type: type_constraints
        grounds: [entities.RollingStock.fields.stock_type, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "stock_type outside {LOCOMOTIVE, COACH_CAR, FIRST_CLASS_CAR, DINING_CAR} is rejected with ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "TENDER-1", stock_type: "TENDER", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_VALIDATION with HTTP 400"
      - name: get_nonexistent_excursion_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but unknown UUID returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /railroad/excursions/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_NOT_FOUND with HTTP 404"
      - name: bookings_list_pagination_envelope_defaults
        claim_type: listing
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "List response carries the fixed envelope: meta.api_request_id, meta.api_request_timestamp, response_type array, and pagination fields limit/offset/total_count/has_more with defaults limit=10, offset=0."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /railroad/bookings", as: StationAgent }
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == array and data == []"
            - "pagination block present with limit == 10, offset == 0, total_count == 0, has_more == false"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: terminated_agreement_rejects_further_events
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TrackRightsAgreement, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "TERMINATED is terminal: a subsequent ACTIVATE event on the same agreement is rejected with ERR_INVALID_STATE and no slot/excursion state changes."
        test_recipe:
          setup: ["Agreement created then TERMINATED from DRAFT"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "TERMINATE" }, as: OperationsManager }
          trigger:
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE (TERMINATED has no outbound transitions)"
      - name: begin_boarding_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Excursion, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "BEGIN_BOARDING requires PUBLISHED; on a DRAFT excursion it fails with ERR_INVALID_STATE and the excursion stays DRAFT."
        test_recipe:
          setup: ["DRAFT excursion on 2026-10-15 (slot reserved, no publish)"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Draft Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "BEGIN_BOARDING" }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "Excursion.${ex}.status remains DRAFT"
      - name: publish_without_locomotive_fails_consist
        claim_type: precondition_enforcement
        grounds: [state_machines.Excursion, "errors[ERR_CONSIST_INCOMPLETE]"]
        distinguishing_aspect: "PUBLISH with a passenger car but no LOCO assignment fails with ERR_CONSIST_INCOMPLETE even when crew coverage is satisfied."
        test_recipe:
          setup: ["DRAFT excursion with one COACH car assigned and full non-dining crew (ENGINEER, CONDUCTOR, CAR_HOST)"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "No Loco Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
          trigger:
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CONSIST_INCOMPLETE (no LOCO in the consist)"
            - "Excursion.${ex}.status remains DRAFT"
      - name: publish_without_crew_fails_coverage
        claim_type: precondition_enforcement
        grounds: [state_machines.Excursion, calculations.crew_coverage, "errors[ERR_CREW_COVERAGE_INCOMPLETE]"]
        distinguishing_aspect: "PUBLISH with a valid consist (LOCO + COACH) but zero crew assignments fails with ERR_CREW_COVERAGE_INCOMPLETE."
        test_recipe:
          setup: ["DRAFT excursion with LOCO + COACH consist, no crew assigned"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "No Crew Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
          trigger:
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_CREW_COVERAGE_INCOMPLETE"
            - "Excursion.${ex}.status remains DRAFT"
      - name: clock_sweep_expires_held_booking
        claim_type: automatic_transition
        grounds: [state_machines.Booking, calculations.clock_sweep]
        distinguishing_aspect: "Advancing the logical clock past expires_at (created_at + 45 min) moves a HELD booking to CANCELLED with refund_cents 0 and frees its conservative capacity."
        test_recipe:
          setup: ["Published REGULAR excursion (coach capacity 40) with one HELD booking party 2, created while the clock reads 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Sweep Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "held@x.com", class_code: "COACH", party_size: 2 }, as: StationAgent, captures: { b: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:46:00Z" }, as: OperationsManager }
            - { call: "GET /railroad/bookings/${b}", as: StationAgent, captures: { b_status: "$.data.status" } }
          assert:
            - "${b_status} == CANCELLED (swept: expires_at 2026-08-01T00:45:00Z <= now)"
            - "Booking.${b}.refund_cents == 0 (HELD was never paid)"
      - name: clock_sweep_expires_rain_check
        claim_type: automatic_transition
        grounds: [state_machines.RainCheck, calculations.clock_sweep]
        distinguishing_aspect: "A rain-check issued on 2026-08-01 (expires_on 2027-08-01) flips to EXPIRED only when the clock date passes expires_on; on 2027-08-01 itself it is still ISSUED."
        test_recipe:
          setup: ["Published excursion, one CONFIRMED booking (paid 6000), excursion weather-cancelled so RC1 is ISSUED with issued_on 2026-08-01 and expires_on 2027-08-01"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "LOC-1", stock_type: "LOCOMOTIVE", seat_capacity: 0, table_count: 0 }, as: Mechanic, captures: { loco: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Expiry Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${loco}", class_code: "LOCO", position: 1 }, as: Scheduler }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 2 }, as: Scheduler }
            - { call: "POST /railroad/crew-members", payload: { name: "Ed Eng", role: "ENGINEER", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_e: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Con Ida", role: "CONDUCTOR", is_volunteer: false, cert_expires_on: "2027-06-01" }, as: CrewManager, captures: { cm_c: "$.data.id" } }
            - { call: "POST /railroad/crew-members", payload: { name: "Hal Host", role: "CAR_HOST", is_volunteer: true }, as: CrewManager, captures: { cm_h: "$.data.id" } }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_e}", position: "ENGINEER" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_c}", position: "CONDUCTOR" }, as: CrewManager }
            - { call: "POST /railroad/crew-assignments", payload: { excursion_id: "${ex}", crew_member_id: "${cm_h}", position: "CAR_HOST" }, as: CrewManager }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v: "$.data.version" } }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "PUBLISH", expected_excursion_version: "${ex_v}" }, as: Scheduler }
            - { call: "POST /railroad/bookings", payload: { excursion_id: "${ex}", customer_email: "rc@x.com", class_code: "COACH", party_size: 1 }, as: StationAgent, captures: { b: "$.data.id" } }
            - { call: "POST /railroad/bookings/${b}/events", payload: { event_type: "CONFIRM" }, as: StationAgent }
            - { call: "POST /railroad/excursions/${ex}/events", payload: { event_type: "CANCEL", cancel_reason: "WEATHER" }, as: OperationsManager }
            - { call: "GET /railroad/rain-checks?booking_id=${b}", as: StationAgent, captures: { rc: "$.data[0].id", rc_exp: "$.data[0].expires_on" } }
          trigger:
            - { call: "POST /railroad/_clock/set_current_utc", payload: { to_iso8601: "2027-08-01T12:00:00Z" }, as: OperationsManager }
            - { call: "GET /railroad/rain-checks/${rc}", as: StationAgent, captures: { st_on_day: "$.data.status" } }
            - { call: "POST /railroad/_clock/set_current_utc", payload: { to_iso8601: "2027-08-02T00:00:00Z" }, as: OperationsManager }
            - { call: "GET /railroad/rain-checks/${rc}", as: StationAgent, captures: { st_after: "$.data.status" } }
          assert:
            - "${rc_exp} == 2027-08-01 (issued_on 2026-08-01 + 365 days)"
            - "on the expiry date itself: ${st_on_day} == ISSUED (redeemable through expires_on inclusive)"
            - "one day past: ${st_after} == EXPIRED"
      - name: work_order_start_requires_available_stock
        claim_type: precondition_enforcement
        grounds: [state_machines.MaintenanceWorkOrder, "errors[ERR_STOCK_UNAVAILABLE]"]
        distinguishing_aspect: "START on a second work order while the stock is already IN_MAINTENANCE (first WO IN_PROGRESS) fails with ERR_STOCK_UNAVAILABLE; the first WO is unaffected."
        test_recipe:
          setup: ["One coach car with two SCHEDULED work orders whose windows respect the 60-minute buffer (09:00-10:00 and 11:00-12:00 on 2026-10-20); the first WO has been STARTed"]
          setup_api_calls:
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { car: "$.data.id" } }
            - { call: "POST /railroad/work-orders", payload: { stock_id: "${car}", window_start: "2026-10-20T09:00:00Z", window_end: "2026-10-20T10:00:00Z", scope: "INSPECTION" }, as: Mechanic, captures: { wo1: "$.data.id" } }
            - { call: "POST /railroad/work-orders", payload: { stock_id: "${car}", window_start: "2026-10-20T11:00:00Z", window_end: "2026-10-20T12:00:00Z", scope: "REPAIR" }, as: Mechanic, captures: { wo2: "$.data.id" } }
            - { call: "POST /railroad/work-orders/${wo1}/events", payload: { event_type: "START" }, as: Mechanic }
          trigger:
            - { call: "POST /railroad/work-orders/${wo2}/events", payload: { event_type: "START" }, as: Mechanic, captures: { err: "$.data.error_id" } }
          assert:
            - "${err} == ERR_STOCK_UNAVAILABLE (stock is IN_MAINTENANCE under WO ${wo1})"
            - "MaintenanceWorkOrder.${wo2}.status remains SCHEDULED"
      - name: retire_cancels_scheduled_work_orders_and_strips_draft_consist
        claim_type: side_effect_execution
        grounds: [state_machines.RollingStock, state_machines.MaintenanceWorkOrder.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "RETIRE cascades: SCHEDULED work orders on the stock become CANCELLED and the stock's car assignment on a DRAFT excursion is removed (bumping the excursion version)."
        test_recipe:
          setup: ["Coach car with one SCHEDULED WO (2026-10-20 window) and one CarAssignment on a DRAFT excursion (2026-10-15)"]
          setup_api_calls:
            - { call: "POST /railroad/agreements", payload: { host_railroad_name: "Host Line RR", subdivision_code: "SUB-7", valid_from: "2026-01-01", valid_until: "2026-12-31", max_trains_per_day: 3, min_slot_minutes: 60 }, as: Scheduler, captures: { agr: "$.data.id" } }
            - { call: "POST /railroad/agreements/${agr}/events", payload: { event_type: "ACTIVATE" }, as: Scheduler }
            - { call: "POST /railroad/slots", payload: { agreement_id: "${agr}", service_date: "2026-10-15", start_minute: 600, end_minute: 780 }, as: Scheduler, captures: { slot: "$.data.id" } }
            - { call: "POST /railroad/rolling-stock", payload: { unit_code: "COACH-1", stock_type: "COACH_CAR", seat_capacity: 40, table_count: 0 }, as: Mechanic, captures: { coach: "$.data.id" } }
            - { call: "POST /railroad/work-orders", payload: { stock_id: "${coach}", window_start: "2026-10-20T09:00:00Z", window_end: "2026-10-20T10:00:00Z", scope: "OVERHAUL" }, as: Mechanic, captures: { wo: "$.data.id" } }
            - { call: "POST /railroad/excursions", payload: { title: "Draft Run", slot_id: "${slot}", event_type: "REGULAR", surge_multiplier_bp: 10000 }, as: Scheduler, captures: { ex: "$.data.id", ex_v0: "$.data.version" } }
            - { call: "POST /railroad/car-assignments", payload: { excursion_id: "${ex}", stock_id: "${coach}", class_code: "COACH", position: 1 }, as: Scheduler, captures: { ca: "$.data.id" } }
          trigger:
            - { call: "POST /railroad/rolling-stock/${coach}/events", payload: { event_type: "RETIRE" }, as: Mechanic, captures: { st: "$.data.status" } }
            - { call: "GET /railroad/rolling-stock/${coach}/work-orders", as: Mechanic, captures: { wo_status: "$.data[0].status" } }
            - { call: "GET /railroad/car-assignments?excursion_id=${ex}", as: Scheduler }
            - { call: "GET /railroad/excursions/${ex}", as: Scheduler, captures: { ex_v1: "$.data.version" } }
          assert:
            - "${st} == OUT_OF_SERVICE"
            - "${wo_status} == CANCELLED (retire cascade)"
            - "GET /railroad/car-assignments?excursion_id=${ex} returns an empty array (assignment removed)"
            - "${ex_v1} == ${ex_v0} + 2 (one bump for the assignment create, one for its removal)"

