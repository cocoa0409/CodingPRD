scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: indemnity_forward_reserve_vs_chronological_paid
        grounds:
          - calculations.indemnity_reserve_forward
          - calculations.indemnity_payment_amount
          - entities.Reserve.fields.indemnity_reserve_cents
          - entities.BenefitPayment.fields.amount_cents
        distinguishing_aspect: |
          Two valid algorithms on DIFFERENT entity domains for the SAME disability
          span: the forward-looking indemnity reserve on Reserve projects weekly*weeks
          with no waiting-period deduction, while the chronological paid amount on
          BenefitPayment deducts the 7-day waiting period — they diverge by exactly
          the waiting-period amount.
        test_recipe:
          setup:
            - "Employer + Policy + Worker A (AWW 150000c) exist; Claim accepted into LOST_TIME with disability_days=10; WageStatement fixes ttd_weekly_rate_cents=100005; Reserve set with projected_weeks=12 (indemnity_reserve_cents=1200060)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "P-001", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z", disability_days: 10 }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id, claim_v0: $.data.version }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/ack"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wage-statements"
              payload: { claim_id: "${claim_a}", average_weekly_wage_cents: 150000, expected_claim_version: "${claim_v0}" }
              as: ClaimsAdjuster
              captures: { claim_v1: $.data.id }
            - call: "POST /reserves"
              payload: { claim_id: "${claim_a}", severity_tier: "MODERATE", projected_weeks: 12 }
              as: ClaimsAdjuster
              captures: { res_a: $.data.id }
            - call: "POST /claims/${claim_a}/accept"
              payload: { disability_days: 10 }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /benefit-payments"
              payload: { claim_id: "${claim_a}", benefit_type: "TTD" }
              as: ClaimsAdjuster
              captures: { pay_a: $.data.id }
          assert:
            - "BenefitPayment.${pay_a}.amount_cents == 42858"
            - "Reserve.${res_a}.indemnity_reserve_cents == 1200060 before the payment"
            - "Reserve.${res_a}.indemnity_reserve_cents == 1157202 after the payment (1200060 - 42858)"
            - "The forward reserve (1200060) is NOT 12 weeks of paid benefit; the chronological paid amount (42858) reflects only 3 compensable days = (10 - 7-day waiting) * round(100005/7)."

      - name: experience_mod_debit_vs_credit_on_premium
        grounds:
          - calculations.experience_mod
          - entities.ExperienceModEntry.fields.mod_factor
          - entities.Policy.fields.modified_premium_cents
          - entities.Employer.fields.current_emr
        distinguishing_aspect: |
          Dual-variant on the Employer/Policy domain (distinct from the Reserve/
          BenefitPayment indemnity domain of the first instance): identical actual
          losses yield a debit mod (>1.00, premium surcharge) or a credit mod (<1.00,
          premium discount) purely from the expected-loss inputs, driving
          modified_premium_cents above or below manual_premium_cents.
        test_recipe:
          setup:
            - "Employer with one LOST_TIME claim whose Reserve.total_incurred_cents=2700060; Policy manual_premium_cents=5000000."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Beta Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "P-002", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z", disability_days: 10 }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id, claim_v0: $.data.version }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/ack"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wage-statements"
              payload: { claim_id: "${claim_a}", average_weekly_wage_cents: 150000, expected_claim_version: "${claim_v0}" }
              as: ClaimsAdjuster
            - call: "POST /reserves"
              payload: { claim_id: "${claim_a}", severity_tier: "MODERATE", projected_weeks: 12 }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_a}/accept"
              payload: { disability_days: 10 }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /experience-mods"
              payload: { employer_id: "${emp_id}", rating_year: 2026, weighting_factor: 0.30, ballast_cents: 300000, expected_primary_cents: 800000, expected_excess_cents: 400000 }
              as: PlatformAdmin
              captures: { mod_id: $.data.id }
          assert:
            - "ExperienceModEntry.${mod_id}.mod_factor == 1.72 (debit mod; actual losses far exceed low expected)"
            - "Employer.${emp_id}.current_emr == 1.72"
            - "Policy.${pol_id}.modified_premium_cents == 8600000 (5000000 * 1.72)"
            - "Under credit inputs (expected_primary_cents=1800000, expected_excess_cents=1200000, ballast 1000000) the same losses yield mod_factor == 0.96 and modified_premium_cents == 4800000 < 5000000."

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: experience_mod_three_input_nonlinear_clamp
        grounds:
          - calculations.experience_mod
          - entities.ExperienceModEntry.fields.weighting_factor
          - entities.ExperienceModEntry.fields.ballast_cents
        distinguishing_aspect: |
          Mode (a): the EMR formula has >3 inputs (Ap, Ae, Ep, Ee, W, B) with
          non-linear interaction — the primary/excess split is min/max per claim,
          W weights the excess term, and a final clamp to [0.75, 2.00] makes the
          output piecewise.
        test_recipe:
          setup:
            - "Employer with one claim Reserve.total_incurred_cents=2700060 (Ap=min(2700060,1700000)=1700000, Ae=1000060)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Gamma Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "P-003", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z", disability_days: 10 }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id, claim_v0: $.data.version }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/ack"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wage-statements"
              payload: { claim_id: "${claim_a}", average_weekly_wage_cents: 150000, expected_claim_version: "${claim_v0}" }
              as: ClaimsAdjuster
            - call: "POST /reserves"
              payload: { claim_id: "${claim_a}", severity_tier: "MODERATE", projected_weeks: 12 }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_a}/accept"
              payload: { disability_days: 10 }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /experience-mods"
              payload: { employer_id: "${emp_id}", rating_year: 2026, weighting_factor: 0.30, ballast_cents: 1000000, expected_primary_cents: 1800000, expected_excess_cents: 1200000 }
              as: PlatformAdmin
              captures: { mod_id: $.data.id }
          assert:
            - "ExperienceModEntry.${mod_id}.mod_factor == 0.96 (num = 1700000 + 0.30*1000060 + 0.70*1200000 + 1000000 = 3840018; den = 1800000 + 0.30*1200000 + 0.70*1200000 + 1000000 = 4000000; 3840018/4000000 = 0.9600045 rounds HALF_UP to 0.96)"
            - "With expected_primary_cents=1, expected_excess_cents=0, ballast_cents=0 (den=1) the raw mod is ~2000018 and is clamped to mod_factor == 2.00 (ceiling)."

      - name: ttd_daily_rounding_order_then_sum
        grounds:
          - calculations.indemnity_payment_amount
          - calculations.ttd_weekly_rate
          - entities.BenefitPayment.fields.amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the TTD amount rounds the
          weekly rate to a daily rate FIRST (round(100005/7)=14286), THEN multiplies
          by compensable days; rounding after the multiply (round(100005/7*3)) gives
          a different cent total, so the scaffold pins round-then-multiply.
        test_recipe:
          setup:
            - "Claim A in LOST_TIME, ttd_weekly_rate_cents=100005, disability_days=10 (3 compensable days), Reserve indemnity_reserve_cents=1200060."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Delta Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "P-004", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z", disability_days: 10 }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id, claim_v0: $.data.version }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/ack"
              payload: {}
              as: PlatformAdmin
            - call: "POST /wage-statements"
              payload: { claim_id: "${claim_a}", average_weekly_wage_cents: 150000, expected_claim_version: "${claim_v0}" }
              as: ClaimsAdjuster
            - call: "POST /reserves"
              payload: { claim_id: "${claim_a}", severity_tier: "MODERATE", projected_weeks: 12 }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_a}/accept"
              payload: { disability_days: 10 }
              as: ClaimsAdjuster
          trigger:
            - call: "POST /benefit-payments"
              payload: { claim_id: "${claim_a}", benefit_type: "TTD" }
              as: ClaimsAdjuster
              captures: { pay_a: $.data.id }
          assert:
            - "BenefitPayment.${pay_a}.amount_cents == 42858 (round(100005/7)=14286; 14286*3=42858)"
            - "It is NOT 42859 (round(100005/7*3) = round(42859.28...) = 42859); the pinned round-then-multiply order yields 42858."

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: injury_report_edi_reject_retransmit_cycle
        grounds:
          - state_machines.InjuryReport.TRANSMITTED_to_REJECTED
          - state_machines.InjuryReport.REJECTED_to_TRANSMITTED
        distinguishing_aspect: |
          Cyclic shape on InjuryReport: TRANSMITTED -> REJECTED -> TRANSMITTED forms
          an EDI correction loop, distinct from the linear claim pipeline; a report
          can re-enter TRANSMITTED after rejection.
        test_recipe:
          setup:
            - "A FROI InjuryReport for a claim, currently TRANSMITTED."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Eps Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "P-005", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z" }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/reject"
              payload: { rejection_code: "TR-051" }
              as: PlatformAdmin
          trigger:
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
              captures: { ed_status: $.data.edi_status }
          assert:
            - "InjuryReport.${froi_a}.edi_status == TRANSMITTED after re-transmit from REJECTED"
            - "InjuryReport.${froi_a}.rejection_code == TR-051 was set during the REJECTED hop"

      - name: impairment_rating_branch_dispute_vs_finalize
        grounds:
          - state_machines.ImpairmentRating.PROPOSED_to_DISPUTED
          - state_machines.ImpairmentRating.PROPOSED_to_FINALIZED
        distinguishing_aspect: |
          Branching shape on ImpairmentRating (different entity from InjuryReport):
          PROPOSED forks to DISPUTED (treating-physician rating, side-effect creates
          an IMEOrder) OR directly to FINALIZED (IME-issued rating, no dispute round),
          with divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "A LOST_TIME claim with a PROPOSED ImpairmentRating whose rater_role=IME."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Zeta Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "P-006", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z", disability_days: 10 }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id, claim_v0: $.data.version }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/ack"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reserves"
              payload: { claim_id: "${claim_a}", severity_tier: "MODERATE", projected_weeks: 12 }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_a}/accept"
              payload: { disability_days: 10 }
              as: ClaimsAdjuster
            - call: "POST /impairment-ratings"
              payload: { claim_id: "${claim_a}", whole_body_pct: 12, rater_role: "IME" }
              as: MedicalReviewer
              captures: { rate_a: $.data.id }
          trigger:
            - call: "POST /impairment-ratings/${rate_a}/finalize"
              payload: {}
              as: MedicalReviewer
              captures: { rstatus: $.data.status }
          assert:
            - "ImpairmentRating.${rate_a}.status == FINALIZED directly from PROPOSED (IME branch needs no dispute round)"
            - "Claim.${claim_a}.status == MMI (finalize cascade)"
            - "No IMEOrder was created for this claim by the finalize branch (the dispute branch is the only one that synthesizes one)."

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: dispute_creates_ime_then_complete_then_finalize_to_mmi
        grounds:
          - state_machines.ImpairmentRating.PROPOSED_to_DISPUTED
          - state_machines.IMEOrder.SCHEDULED_to_COMPLETED
          - state_machines.ImpairmentRating.DISPUTED_to_FINALIZED
          - state_machines.Claim.LOST_TIME_to_MMI
        distinguishing_aspect: |
          Depth-3 cascade originating at dispute: disputing a treating rating mutates
          the rating to DISPUTED AND creates an IMEOrder (link 1); completing that
          IMEOrder enables the rating to be finalized (link 2, caused by link 1's IME);
          finalizing cascades the Claim to MMI (link 3). Each hop is caused by the
          prior hop, not by the original dispute call.
        test_recipe:
          setup:
            - "A LOST_TIME claim with a PROPOSED treating-physician ImpairmentRating; clock at 2026-03-01."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Eta Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "P-007", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z", disability_days: 10 }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id }
            - call: "POST /injury-reports"
              payload: { claim_id: "${claim_a}", report_kind: "FROI", maintenance_type_code: "00" }
              as: ClaimsAdjuster
              captures: { froi_a: $.data.id }
            - call: "POST /injury-reports/${froi_a}/transmit"
              payload: {}
              as: ClaimsAdjuster
            - call: "POST /injury-reports/${froi_a}/ack"
              payload: {}
              as: PlatformAdmin
            - call: "POST /reserves"
              payload: { claim_id: "${claim_a}", severity_tier: "MODERATE", projected_weeks: 12 }
              as: ClaimsAdjuster
            - call: "POST /claims/${claim_a}/accept"
              payload: { disability_days: 10 }
              as: ClaimsAdjuster
            - call: "POST /impairment-ratings"
              payload: { claim_id: "${claim_a}", whole_body_pct: 15, rater_role: "TREATING" }
              as: MedicalReviewer
              captures: { rate_a: $.data.id }
          trigger:
            - call: "POST /impairment-ratings/${rate_a}/dispute"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /claims/${claim_a}/ime-orders"
              payload: {}
              as: ClaimsAdjuster
              captures: { ime_a: $.data.0.id }
            - call: "POST /ime-orders/${ime_a}/complete"
              payload: {}
              as: MedicalReviewer
            - call: "POST /impairment-ratings/${rate_a}/finalize"
              payload: {}
              as: MedicalReviewer
          assert:
            - "An IMEOrder was created by the dispute (GET /claims/${claim_a}/ime-orders returns exactly one, status COMPLETED after the complete call)"
            - "ImpairmentRating.${rate_a}.status == FINALIZED and finalized_pct == 15"
            - "Claim.${claim_a}.status == MMI (the depth-3 terminal hop)"

      - name: void_payment_cascade_restores_reserve_and_total
        grounds:
          - state_machines.BenefitPayment.POSTED_to_VOIDED
          - entities.Reserve.fields.indemnity_paid_cents
          - entities.Reserve.fields.indemnity_reserve_cents
          - entities.Reserve.fields.total_incurred_cents
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (benefit-payment void, not rating
          dispute): voiding a payment mutates the payment to VOIDED (link 1); that
          mutation drives the Reserve's indemnity_paid/indemnity_reserve fields back
          (link 2, caused by the void), which forces total_incurred_cents recompute.
        test_recipe:
          setup:
            - "Claim A LOST_TIME with Reserve indemnity_reserve_cents=1157202 and indemnity_paid_cents=42858 after one posted TTD payment of 42858."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Theta Co", state_code: "CA" }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /policies"
              payload: { employer_id: "${emp_id}", policy_number: "P-008", manual_premium_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", full_name: "Worker A", gross_wages_cents: 7800000, weeks_worked: 52 }
              as: PlatformAdmin
              captures: { wkr_a: $.data.id }
            - call: "POST /claims"
              payload: { policy_id: "${pol_id}", worker_id: "${wkr_a}", date_of_injury: "2026-02-01T00:00:00Z", disability_days: 10 }
              as: ClaimsAdjuster
              captures: { claim_a: $.data.id, claim_v0: $.data.version }
            - call: "POST /injury-reports"
