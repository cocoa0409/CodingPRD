      - name: customer_scope_confines_a_fleet_account_to_its_own_builds_forbidden
        claim_type: Role A cannot touch role B's resources
        grounds:
          - rbac.Customer
          - validations.priority_3_ERR_CUSTOMER_SCOPE_VIOLATION
