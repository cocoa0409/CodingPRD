  - rule_id: non_linear_state_machine
    rule_summary: "A state machine with recovery loops, so the same state is reachable more than once and history matters."
    instances:
      - name: instrument_drift_watch_then_recovery_to_approved
        mechanism: |
          Equipment.approval_status cycles APPROVED -> DRIFT_WATCH -> DRIFT_WATCH -> APPROVED driven by
          a rolling three-check mean rather than by the latest check. Deviations 0.30, 0.10 and 0.05
          produce rolling biases 0.30, 0.20 and exactly 0.15; the first two land in the drift band
          (0.15 < bias <= 0.30) and the third recovers because the boundary is inclusive on the
          APPROVED side. The instrument stays usable throughout, so history (which checks are still
          inside the window) determines the state, not the state alone.
        distinguishing_aspect: "The loop is driven by a rolling numeric window on the SAME entity; the sibling loop is driven by external filings on a different aggregate."
        entities_involved: [Equipment, Inspector]
        grounds:
          - "calculations.instrument_comparison_bias"
          - "state_machines.Equipment.approval_status.APPROVED_to_DRIFT_WATCH"
          - "state_machines.Equipment.approval_status.DRIFT_WATCH_to_APPROVED"
          - "calculations.inspector_performance_score"
          - "entities.Equipment.fields.rolling_bias_pct"
        test_recipe:
          setup:
            - "A DESIGNATED area with a freshly certified PROTEIN_INSTRUMENT in APPROVED, rolling_bias_pct null and an empty deviation history."
            - "A licensed inspector to be named on the comparison checks, filed by ServiceAdmin so the self-check prohibition never triggers."
            - "Logical clock at 2026-08-03T09:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED" }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-3001", full_name: "K. Adeyemi", endorsements: ["GRADING", "PROTEIN"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "PROTEIN_INSTRUMENT", asset_code: "NIR-2", model: "SpectraGrain 9" }
              captures: { nir: "$.data.id" }
            - call: POST /grain-inspection/equipment/${nir}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/comparison-checks
              as: ServiceAdmin
              payload: { instrument_id: "${nir}", inspector_id: "${insp}", reference_value_pct: 35.00, instrument_reading_pct: 35.30 }
              captures: { bias1: "$.data.rolling_bias_pct" }
            - call: POST /grain-inspection/comparison-checks
              as: ServiceAdmin
              payload: { instrument_id: "${nir}", inspector_id: "${insp}", reference_value_pct: 35.00, instrument_reading_pct: 35.10 }
              captures: { bias2: "$.data.rolling_bias_pct" }
          trigger:
            - call: POST /grain-inspection/comparison-checks
              as: ServiceAdmin
              payload: { instrument_id: "${nir}", inspector_id: "${insp}", reference_value_pct: 35.00, instrument_reading_pct: 35.05 }
              captures: { bias3: "$.data.rolling_bias_pct" }
          assert:
            - "After check 1: last_comparison_deviation_pct == 0.30, rolling_bias_pct == 0.30, approval_status == DRIFT_WATCH (0.30 is not greater than 0.30 so it is not out of tolerance)"
            - "After check 2: recent_deviations_pct == [0.30, 0.10], rolling_bias_pct == 0.20, approval_status == DRIFT_WATCH"
            - "201; after check 3: recent_deviations_pct == [0.30, 0.10, 0.05], rolling_bias_pct == 0.15, approval_status == APPROVED (recovery; the boundary is inclusive)"
            - "comparison_check_count == 3 and consecutive_out_of_tolerance_checks == 0 throughout"
            - "GET /grain-inspection/inspectors/${insp} -> check_sample_deviation_count == 1 (only the 0.30 deviation exceeds the 0.25 inspector threshold) and performance_score == 90"
            - "The instrument was never blocked: DRIFT_WATCH equipment remains usable for new protein analyses"
        expected_failure_mode_if_naive: "Judging each check in isolation reports APPROVED after check 2 (0.10 is small) and never enters the drift band; a rolling window that keeps more than three deviations never recovers."

      - name: certificate_appeal_loop_reenters_issued_without_deadline_extension
        mechanism: |
          Certificate.status re-enters ISSUED after an appeal terminates without revision, so the same
          state is reached twice while the appeal history accumulates. A dismissed REINSPECTION returns
          the certificate to ISSUED and refunds half its deposit; a subsequent APPEAL on the same
          certificate is then legal and drives it to UNDER_APPEAL again. Crucially the deadlines are
          NOT recomputed on re-entry: appeal_deadline_at still reflects the original issued_at, so the
          second filing is judged against the original window.
        distinguishing_aspect: "Re-entry is caused by terminal states of a DIFFERENT aggregate (Appeal) and is verified through fields that must NOT change; the sibling loop is numeric and same-entity."
        entities_involved: [Certificate, Appeal, Applicant, FeeSchedule]
        grounds:
          - "state_machines.Certificate.status.ISSUED_to_UNDER_APPEAL"
          - "state_machines.Certificate.status.UNDER_APPEAL_to_ISSUED"
          - "entities.Certificate.fields.appeal_deadline_at"
          - "calculations.appeal_panel_tally"
          - "errors[ERR_DUPLICATE_OPERATIVE_RECORD]"
        test_recipe:
          setup:
            - "A DELEGATED area with ACTIVE GRADING and APPEAL fee schedules and an applicant with sufficient credit limit."
            - "An ISSUED GRADE certificate carrying reinspection_deadline_at and appeal_deadline_at computed from its issuance instant."
            - "Logical clock at 2026-08-03T09:00:00Z, well inside both filing windows."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Plains Delegated Office", state_code: "KS", authority_type: "DELEGATED", fee_multiplier_bp: 10000, supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 8000, per_thousand_bushel_rate_cents: 2000, minimum_fee_cents: 10000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_g: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_g}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "APPEAL", base_fee_cents: 20000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_a: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_a}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Prairie Coop", account_code: "PRC-003", contact_email: "billing@prairie.example", credit_limit_cents: 500000 }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-3002", full_name: "T. Boone", endorsements: ["SAMPLING", "GRADING"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp: "$.data.id" }
            - call: POST /grain-inspection/equipment
              as: ServiceAdmin
              payload: { service_area_id: "${area}", equipment_kind: "SAMPLING_DEVICE", asset_code: "PROBE-K3", model: "Diverter D2" }
              captures: { probe: "$.data.id" }
            - call: POST /grain-inspection/equipment/${probe}/certify
              as: ServiceAdmin
              payload: { certified_until: "2027-01-01T00:00:00Z" }
            - call: POST /grain-inspection/inspection-requests
              as: ServiceAdmin
              payload: { applicant_id: "${app}", service_area_id: "${area}", commodity: "CORN", point_of_service: "UNLOADING", lot_identifier: "LOT-LOOP", declared_quantity_bushels: 500, requested_services: ["GRADING"] }
              captures: { req: "$.data.id" }
            - call: POST /grain-inspection/samples
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sampling_device_id: "${probe}", inspector_id: "${insp}", seal_number: "SEAL-LOOP", portions_count: 3 }
              captures: { smp: "$.data.id" }
            - call: POST /grain-inspection/grading-results
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", sample_id: "${smp}", inspector_id: "${insp}", test_weight_lbs_per_bushel: 56.0, moisture_pct: 13.0, damaged_total_pct: 2.0, heat_damaged_pct: 0.1, foreign_material_pct: 1.5 }
            - call: POST /grain-inspection/certificates
              as: LicensedInspector
              payload: { inspection_request_id: "${req}", issuing_inspector_id: "${insp}", certificate_type: "GRADE" }
              captures: { cert: "$.data.id", cert_v1: "$.data.version", deadline: "$.data.appeal_deadline_at" }
            - call: POST /grain-inspection/appeals
              as: ApplicantUser
              payload: { certificate_id: "${cert}", applicant_id: "${app}", appeal_type: "REINSPECTION", expected_certificate_version: "${cert_v1}" }
              captures: { ap1: "$.data.id" }
            - call: POST /grain-inspection/appeals/${ap1}/dismiss
              as: ServiceAdmin
              payload: { reason: "Applicant withdrew the reinspection request" }
            - call: GET /grain-inspection/certificates/${cert}
              as: ApplicantUser
              captures: { cert_v2: "$.data.version" }
          trigger:
            - call: POST /grain-inspection/appeals
              as: ApplicantUser
              payload: { certificate_id: "${cert}", applicant_id: "${app}", appeal_type: "APPEAL", expected_certificate_version: "${cert_v2}" }
              captures: { ap2: "$.data.id" }
          assert:
            - "The GRADE certificate fee_total_cents == 10000 (pre 8000 + 2000 = 10000 equals minimum_fee_cents, floor not binding)"
            - "After the dismissal the certificate is back in status ISSUED for the second time and appeal_deadline_at is unchanged from its first value (issued_at + 10 days = 2026-08-13T09:00:00Z)"
            - "The dismissed appeal has status DISMISSED, deposit_cents == 20000 and refund_cents == 10000 (floor of half)"
            - "GET /grain-inspection/samples/${smp} -> portions_retained == 0 after dismissal (no sample was ever assigned, and none is retained)"
            - "201; the second appeal is accepted, status == FILED, deposit_cents == 20000, and the certificate is UNDER_APPEAL again"
            - "GET /grain-inspection/applicants/${app} -> charges_total_cents == 50000 (10000 + 20000 + 20000), credits_total_cents == 10000, open_balance_cents == 40000"
            - "A third filing of appeal_type REINSPECTION while ap2 is open -> 422 ERR_DUPLICATE_OPERATIVE_RECORD"
        expected_failure_mode_if_naive: "Treating UNDER_APPEAL as terminal blocks the second filing; recomputing deadlines on re-entry silently extends the applicant's appeal rights; refunding the full deposit on dismissal breaks the ledger."

  - rule_id: transitive_cascade
    rule_summary: "One call must propagate through three or more entities, each hop conditional on the previous hop's outcome."
    instances:
      - name: appeal_revision_cascades_certificate_void_regrade_ledger_and_inspector_suspension
        mechanism: |
          Deciding an appeal REVISED propagates five hops from a single call: (1) the appeal closes and
          refunds its deposit, (2) the challenged certificate is VOIDED and its fee REVERSED, (3) a
          fee-free APPEAL_GRADE certificate is issued carrying the new grade and pointing back at the
          voided row, (4) the regrade displaces the original determination (FINAL / SUPERSEDED swap)
          and bumps the request's grade_revision_count, and (5) the ORIGINAL inspector's
          appeal_reversal_count increases, which re-scores them from 84 to 66 and trips the automatic
          suspension threshold. Hop 5 is conditional on hop 1's outcome (only a REVISED decision
          penalises the inspector) and on the inspector's pre-existing counters.
        distinguishing_aspect: "Cascade originates from a human decision on the Appeal aggregate and reaches a licence state on an unrelated entity; the sibling cascade originates from equipment calibration and reaches sample portion accounting."
        entities_involved: [Appeal, AppealVote, Certificate, GradingResult, InspectionRequest, Inspector, Applicant, Sample]
        grounds:
          - "state_machines.Appeal.status.UNDER_REVIEW_to_DECIDED_REVISED"
          - "state_machines.Certificate.status.UNDER_APPEAL_to_VOIDED"
          - "state_machines.Inspector.license_status.ACTIVE_to_SUSPENDED"
          - "calculations.inspector_performance_score"
          - "calculations.applicant_balance_ledger"
          - "entities.InspectionRequest.fields.grade_revision_count"
        test_recipe:
          setup:
            - "A DESIGNATED area with ACTIVE GRADING and APPEAL fee schedules; five ACTIVE inspectors (one original grader, one regrader, three panel members)."
            - "The original inspector already carries two comparison-check deviations of 0.30, so their performance_score stands at 84 before the decision."
            - "An ISSUED GRADE certificate for 27600 cents on a US_NO_2 determination, an APPEAL in UNDER_REVIEW with a retained portion, a FINAL regrade of US_NO_3 and three effective panel votes (2 REVISE, 1 UPHOLD) already cast."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: ServiceAdmin
              payload: { current_utc: "2026-08-03T09:00:00Z" }
            - call: POST /grain-inspection/service-areas
              as: ServiceAdmin
              payload: { name: "Gulf Designated Office", state_code: "TX", authority_type: "DESIGNATED", fee_multiplier_bp: 11500, supervision_required: false }
              captures: { area: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "GRADING", base_fee_cents: 12000, per_thousand_bushel_rate_cents: 3000, overtime_multiplier_bp: 2500, minimum_fee_cents: 15000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_g: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_g}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/fee-schedules
              as: ServiceAdmin
              payload: { service_area_id: "${area}", service_class: "APPEAL", base_fee_cents: 25000, effective_from: "2026-01-01T00:00:00Z" }
              captures: { fs_a: "$.data.id" }
            - call: POST /grain-inspection/fee-schedules/${fs_a}/activate
              as: ServiceAdmin
              payload: {}
            - call: POST /grain-inspection/applicants
              as: ServiceAdmin
              payload: { name: "Delta River Elevator", account_code: "DRE-004", contact_email: "ops@delta.example", credit_limit_cents: 500000 }
              captures: { app: "$.data.id" }
            - call: POST /grain-inspection/inspectors
              as: ServiceAdmin
              payload: { service_area_id: "${area}", license_number: "L-4001", full_name: "A. Original", endorsements: ["SAMPLING", "GRADING", "SUPERVISION"], license_expires_at: "2027-06-01T00:00:00Z" }
              captures: { insp_a: "$.data.id" }
            - call: POST /grain-inspection/inspectors/${insp_a}/training-records
              as: ServiceAdmin
              payload: { course_code: "OFFICIAL-GRADING-101", hours: 40 }
            - call: POST /grain-inspection/inspectors/${insp_a}/activate
              as: ServiceAdmin
              payload: {}
