            - "report.show_lead_quality_index == 38 (round_half_up of (75 + 0) / 2 == 37.5; NOT 60 from pooling, NOT 25 from averaging over three contracts, NOT 37 from truncation)"
            - "report.attrition_shortfall_sqft == 0 and report.attrition_settlement_cents == 0"

      - name: attrition_floor_is_inclusive_to_the_last_square_foot
        grounds:
          - calculations.show_attrition_settlement
          - state_machines.Show.ON_SITE_to_CLOSED
        distinguishing_aspect: |
          Boundary metric: attrition_settlement_cents at the inclusive forgiven-floor edge, written by
          POST /shows/{id}/transition with target_status CLOSED — a third metric on a third endpoint.
          Two shows under the SAME venue contract close with 1400 and 1399 assigned sqft against a
          forgiven floor of 1400, and the allowance itself pins floor(1647 * 15 / 100) == 247 rather than 248.
