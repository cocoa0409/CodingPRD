      - name: cap_deficiency_cascade_extends_care_and_escalates_sampling
        grounds:
          - state_machines.DisposalUnit.cap_integrity_state.ADEQUATE_to_DEFICIENT
          - calculations.cap_inspection_verdict
          - calculations.post_closure_care_end_date
          - entities.DisposalUnit.fields.deficiency_extension_months
          - entities.MonitoringProgram.fields.sampling_frequency
        distinguishing_aspect: |
          Depth three from a single inspection POST: (1) the CapInspection is written DEFICIENT, (2) which
          flips the unit's cap_integrity_state to DEFICIENT and sets cap_repair_due_date to 2027-04-11,
          (3) which — because the dimension changed, not because an inspection was filed — adds 12 months
          of care (end date 2057-01-15 -> 2058-01-15) and escalates the monitoring program to QUARTERLY.
          Hop 3 touches a different aggregate than hops 1 and 2.
        test_recipe:
          setup:
            - "One unit driven all the way to POST_CLOSURE_CARE: ADEQUATE stability assessment (2026-07-15), both public postings filed so the unit never freezes, a fully certified and APPROVED in-place closure plan, begin-closure, and complete-closure on 2027-01-15"
            - "post_closure_care_start_on is 2027-01-15, so the base 30-year care end date is 2057-01-15 and cap_integrity_state is ADEQUATE"
            - "The monitoring program is untouched and still SEMIANNUAL"
            - "Clock advanced to 2027-02-10 before the inspection"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/professionals"
              payload: { full_name: "Owen Park", license_number: "PE-22002", license_state: "NC", discipline: "CIVIL" }
              as: UtilityAdmin
              captures: { pe_civil_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0008", unit_name: "Ash Pond 8", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id, prog_id: $.data.monitoring_program_id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "STABILITY_ASSESSMENT", posted_on: "2026-08-01", document_uri: "https://records.example.com/ccr/imp-0008/stability-2026.pdf", document_sha256: "a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1a3f1" }
              as: ComplianceOfficer
            - call: "POST /ccr/closure-plans"
              payload: { unit_id: "${unit_id}", plan_code: "CP-0004", selected_method: "CLOSURE_IN_PLACE", in_place_capital_usd_cents: 100000000, in_place_annual_care_usd_cents: 1000000, removal_capital_usd_cents: 900000000, removal_annual_care_usd_cents: 1000000, care_period_years: 30 }
              as: UtilityAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ccr/closure-plans/${plan_id}/engineering-certification"
              payload: { certified_on: "2026-08-01", design_narrative: "Composite cap with 24-inch protective layer and perimeter toe drain regrade" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "POST /ccr/closure-plans/${plan_id}/cost-certification"
              payload: { certified_on: "2026-08-01", cost_basis_note: "Unit-price bid tabulation, 2026 dollars, 3 percent discount basis" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
            - call: "POST /ccr/closure-plans/${plan_id}/approve"
              payload: { approved_on: "2026-08-01", permit_reference: "PERMIT-2026-C" }
              as: Regulator
            - call: "POST /ccr/public-postings"
              payload: { unit_id: "${unit_id}", posting_type: "CLOSURE_PLAN", posted_on: "2026-08-01", document_uri: "https://records.example.com/ccr/imp-0008/closure-plan-2026.pdf", document_sha256: "c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2c4b2" }
              as: ComplianceOfficer
            - call: "POST /ccr/units/${unit_id}/begin-closure"
              payload: { initiated_on: "2026-08-01" }
              as: UtilityAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-15T00:00:00Z" }
              as: UtilityAdmin
            - call: "POST /ccr/units/${unit_id}/complete-closure"
              payload: { completed_on: "2027-01-15" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { care_end_before: $.data.post_closure_care_end_date, cap_state_before: $.data.cap_integrity_state }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-10T00:00:00Z" }
              as: UtilityAdmin
          trigger:
            - call: "POST /ccr/cap-inspections"
              payload: { unit_id: "${unit_id}", inspected_on: "2027-02-10", erosion_severity: "MAJOR", settlement_inches: 8.00, vegetation_cover_pct: 55.00, note: "Rill erosion on the south slope with local settlement basin" }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
              captures: { inspection_id: $.data.id }
          assert:
            - "the captured cap_state_before == ADEQUATE and care_end_before == 2057-01-15"
            - "hop 1 - CapInspection.${inspection_id}.verdict == DEFICIENT"
            - "hop 1 - CapInspection.${inspection_id}.deficient_criteria == [EROSION, SETTLEMENT, VEGETATION] in that fixed order"
            - "hop 2 - DisposalUnit.${unit_id}.cap_integrity_state == DEFICIENT"
            - "hop 2 - DisposalUnit.${unit_id}.cap_repair_due_date == 2027-04-11"
            - "hop 3 - DisposalUnit.${unit_id}.deficiency_extension_months == 12"
            - "hop 3 - DisposalUnit.${unit_id}.post_closure_care_end_date == 2058-01-15"
            - "hop 3 - MonitoringProgram.${prog_id}.sampling_frequency == QUARTERLY"
            - "DisposalUnit.${unit_id}.closure_state == POST_CLOSURE_CARE (the closure dimension is untouched by the cap dimension)"
            - "DisposalUnit.${unit_id}.compliance_posture == WATCH (clock 2027-02-10 is still inside the repair window)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: agreement_state_outranks_committed_tons_ceiling_on_shipment
        grounds:
          - validations.priority_23_ERR_INVALID_AGREEMENT_STATE
          - validations.priority_56_ERR_COMMITTED_TONS_EXCEEDED
          - errors.ERR_INVALID_AGREEMENT_STATE
          - errors.ERR_COMMITTED_TONS_EXCEEDED
        distinguishing_aspect: |
          The single shipment POST violates a state rule at priority 23 (the agreement is still DRAFT, and
          only ACTIVE agreements may ship) and a fiscal rule at priority 56 (500 tons against a 100-ton
          commitment). Only the priority-23 error may surface: an implementation that validates fiscal
          ceilings before lifecycle state returns 422 ERR_COMMITTED_TONS_EXCEEDED instead of 409
          ERR_INVALID_AGREEMENT_STATE.
        test_recipe:
          setup:
            - "One clean unit with 480,000 tons of ash in place and a COMPLIANT posture"
            - "One beneficial-reuse agreement left in DRAFT (never qualified, never activated) with committed_tons 100 and window 2026-01-01..2026-12-31"
            - "The unit's current version is read so the shipment carries a fresh expected_unit_version and the priority-16 OCC check passes"
          setup_api_calls:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0009", unit_name: "Ash Pond 9", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/reuse-agreements"
              payload: { unit_id: "${unit_id}", agreement_code: "AGR-0002", product_type: "CONCRETE_POZZOLAN", offtaker_name: "Piedmont Ready-Mix", committed_tons: 100, commitment_start_on: "2026-01-01", commitment_end_on: "2026-12-31", loi_percent: 6.00, retained_325_percent: 20.00, oxide_sum_percent: 82.00, market_price_usd_cents_per_ton: 3200, haul_distance_miles: 60 }
              as: UtilityAdmin
              captures: { agr_id: $.data.id }
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { unit_v: $.data.version }
          trigger:
            - call: "POST /ccr/reuse-shipments"
              payload: { agreement_id: "${agr_id}", shipment_code: "SHP-0001", tons: 500, shipped_on: "2026-08-01", expected_unit_version: "${unit_v}" }
              as: UtilityAdmin
          assert:
            - "the trigger returns HTTP 409 with error_id ERR_INVALID_AGREEMENT_STATE"
            - "the trigger does NOT return ERR_COMMITTED_TONS_EXCEEDED and does NOT return 422"
            - "BeneficialReuseAgreement.${agr_id}.status == DRAFT"
            - "BeneficialReuseAgreement.${agr_id}.shipped_tons_total == 0"
            - "DisposalUnit.${unit_id}.ash_in_place_tons == 480000"
            - "DisposalUnit.${unit_id}.ash_mass_balance_ok == true"
            - "no ReuseShipment row exists for agreement ${agr_id}"

      - name: unit_frozen_outranks_missing_extension_demonstration
        grounds:
          - validations.priority_29_ERR_UNIT_FROZEN
          - validations.priority_49_ERR_EXTENSION_DEMONSTRATION_MISSING
          - calculations.compliance_posture
          - calculations.posting_obligation_status
        distinguishing_aspect: |
          The GRANT decision violates a business_safety rule at priority 29 (the unit is FROZEN because
          two posting obligations are past due) and a business_referential rule at priority 49 (no POSTED
          EXTENSION_DEMONSTRATION exists). The correct answer is 409 ERR_UNIT_FROZEN; checking the
          demonstration first — the more obvious, endpoint-local check — returns 422
          ERR_EXTENSION_DEMONSTRATION_MISSING. This pair crosses different categories from the other
          instance in this rule (business_safety vs business_referential, not state vs fiscal).
        test_recipe:
          setup:
            - "One clean unit with an ADEQUATE stability assessment dated 2026-07-15, so stability_posting_due_date is 2026-08-14 — and no STABILITY_ASSESSMENT posting is ever filed"
            - "One extension request for 24 months created at the default clock, which sets extension_demonstration_due_date to 2026-08-31 — and no EXTENSION_DEMONSTRATION posting is ever filed"
            - "Clock advanced to 2026-09-15 so both obligations are strictly past due and overdue_posting_types is non-empty, making the unit FROZEN"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
              as: UtilityAdmin
              captures: { pe_geo_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0010", unit_name: "Ash Pond 10", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /ccr/stability-assessments"
              payload: { unit_id: "${unit_id}", assessed_on: "2026-07-15", factor_of_safety_static: 1.60, factor_of_safety_seismic: 1.10, factor_of_safety_liquefaction: 1.30 }
              as: ProfessionalEngineer
              as_user_id: "${pe_geo_id}"
            - call: "POST /ccr/extension-requests"
              payload: { unit_id: "${unit_id}", requested_months: 24, justification_category: "NO_ALTERNATIVE_CAPACITY", narrative: "No alternative disposal capacity is available before the statutory deadline" }
              as: UtilityAdmin
              captures: { ext_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: UtilityAdmin
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { posture_before: $.data.compliance_posture, overdue_before: $.data.overdue_posting_types }
          trigger:
            - call: "POST /ccr/extension-requests/${ext_id}/decision"
              payload: { decision: "GRANT", granted_months: 24, decided_on: "2026-09-15", decision_note: "Granted subject to quarterly progress reporting" }
              as: Regulator
          assert:
            - "the captured posture_before == FROZEN and overdue_before == [STABILITY_ASSESSMENT, EXTENSION_DEMONSTRATION] in POSTING_TYPE_ORDER"
            - "the trigger returns HTTP 409 with error_id ERR_UNIT_FROZEN"
            - "the trigger does NOT return ERR_EXTENSION_DEMONSTRATION_MISSING and does NOT return 422"
            - "ClosureExtensionRequest.${ext_id}.status == REQUESTED"
            - "ClosureExtensionRequest.${ext_id}.granted_months == 0"
            - "DisposalUnit.${unit_id}.granted_extension_months == 0"
            - "DisposalUnit.${unit_id}.closure_deadline_date == 2031-03-31"

  - rule_id: boundary_precision_check
    instances:
      - name: loi_exactly_six_percent_meets_class_f_and_six_point_zero_one_fails
        grounds:
          - calculations.ash_quality_and_reuse_score
          - validations.priority_52_ERR_ASH_QUALITY_FAILS_SPEC
          - state_machines.BeneficialReuseAgreement.DRAFT_to_QUALIFIED
          - entities.BeneficialReuseAgreement.fields.meets_astm_c618_class_f
        distinguishing_aspect: |
          The ASTM C618 Class F loss-on-ignition ceiling is inclusive: 6.00 percent MEETS the spec and
          6.01 fails it. The two agreements are otherwise identical, and their scores differ by only 0.03
          (70.30 vs 70.27), so nothing but the inclusive-vs-exclusive comparison separates a QUALIFIED
          agreement from a 422 ERR_ASH_QUALITY_FAILS_SPEC.
        test_recipe:
          setup:
            - "One clean unit with 480,000 tons of ash in place"
            - "Agreement A with loi_percent exactly 6.00; agreement B identical except loi_percent 6.01"
            - "Both agreements commit 30,000 tons over 2026-01-01..2026-12-31, so even summed they stay far below the ash inventory and the priority-55 exposure rule never fires"
            - "One GEOTECHNICAL PE to sign the qualifications"
          setup_api_calls:
            - call: "POST /ccr/professionals"
              payload: { full_name: "Dana Reyes", license_number: "PE-11001", license_state: "NC", discipline: "GEOTECHNICAL" }
