              payload: {}
              as: Fiduciary
              as_user_id: "${fid}"
            # open review to schedule, then close it back to ACTIVE so case is ACTIVE while review SCHEDULED would not be possible;
            # instead schedule the review during UNDER_REVIEW is required. To get a SCHEDULED review while case ACTIVE we schedule
