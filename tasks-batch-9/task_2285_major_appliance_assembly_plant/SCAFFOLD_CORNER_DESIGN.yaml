              payload: {}
              as: ProductionPlanner
          assert:
            - "Trigger 1: ShiftPlan.${shift_a_id}.unit_labor_minutes == 300, changeover_minutes == 0 and committed_labor_minutes == 300 — gross 300 sits exactly on FATIGUE_T1_MAX, so the multiplier is 1.00"
            - "Trigger 2 succeeds: BuildSlot.${slott_id}.status == SEQUENCED with labor_minutes_snapshot == 1 and option_points_snapshot == 1"
            - "Trigger 3: unit_labor_minutes == 301, changeover_minutes == 0 and committed_labor_minutes == 317 (ceil(301 * 1.05) == ceil(316.05)) — still within available_labor_minutes 480"
            - "Station.${st10_id}.presentation_slots_used == 5 (2 + 2 + 1) and Line.${line_id}.free_slot_pct == 93.75"

