  - rule_id: boundary_precision_check
    instances:
      - name: boundary_bid_increment_band_edge
        grounds:
          - calculations.min_next_bid
          - validations[priority=12]
        distinguishing_aspect: |
          Numeric threshold crossing on POST /lots/{id}/bids: with standing-high
          S exactly 100000 the band selection is [100000,500000) so increment is
          10000 and min_next_bid == 110000. A bid of 109999 is rejected
          ERR_BID_TOO_LOW; a bid of 110000 is accepted. The >= lo / < hi edge is
          the precision point.
        test_recipe:
          setup:
            - "Lot OPEN in a LIVE sale; one accepted bid of 100000 (standing-high == 100000)."
          setup_api_calls:
