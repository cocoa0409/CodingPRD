scenario: |
  Full-Time Virtual K-12 School (Stride/K12 online school): enrollment eligibility
  by district of residence & funding claim, device/internet stipend issuance &
  return, synchronous attendance & engagement measurement, truancy determination
  in an online setting, proctored assessment logistics & test site assignment,
  teacher caseload & state certification by student location, special-education
  service delivery online, withdrawal & funding proration.

domain_name: full-time-virtual-k12-school
api_prefix: /vks

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table (§1.1)
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - name: district_code
        type: string
        source: input
        description: Unique district code assigned by the state (e.g. "LAUSD-001")
        constraints: "unique across all districts; immutable after creation"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code of the district's jurisdiction
        constraints: "ISO 3166-2 US state code, uppercase"
      - name: funding_rate_cents
        type: integer
        source: input
        description: Per-pupil daily funding rate in cents claimed from this district
        constraints: ">= 1"
      - name: enrollment_cap
        type: integer
        source: input
        description: Maximum number of resident students whose funding the district will cover per school year
        constraints: ">= 0; 0 means the district funds no students"

  - name: Student
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Student's full legal name
      - name: date_of_birth
        type: datetime
        source: input
        description: Student date of birth (ISO 8601 date at midnight UTC)
      - name: grade_level
        type: integer
        source: input
        description: Current grade placement, 0 for Kindergarten through 12
        constraints: "0 <= grade_level <= 12"
      - name: district_of_residence_id
        type: string
        source: input
        description: "FK -> District.id; district where the student's family physically resides; drives funding claims"
      - name: special_education_flag
        type: boolean
        source: input
        description: Whether the student has an active IEP requiring online service delivery
        default: false
      - name: enrollment_status
        type: enum
        source: system
        description: Lifecycle of the student's enrollment with the virtual school
        constraints: "one of APPLIED, ELIGIBLE, ENROLLED, WITHDRAWN, REENROLL_PENDING"
        default: APPLIED
      - name: residency_verified_at
        type: datetime
        source: system
        description: Timestamp when district residency documentation was verified; null until verified
        default: null
      - name: funding_days_claimed
        type: integer
        source: computed
        description: Count of calendar days from ENROLLED start through withdrawal (exclusive) that are claimable for funding
        default: 0
      - name: funding_claim_cents
        type: integer
        source: computed
        description: Total funding claim in cents = funding_days_claimed * district.funding_rate_cents at time of computation
        default: 0
      - name: truancy_flag
        type: boolean
        source: computed
        description: True when the student's rolling truancy count meets the truancy threshold
        default: false
      - name: truancy_unexcused_count
        type: integer
        source: computed
        description: Rolling count of unexcused absence days in the current truancy window
        default: 0

  - name: EnrollmentTerm
    parent: null
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student this term belongs to"
      - name: term_start_date
        type: datetime
        source: input
        description: First calendar day of enrollment (ISO 8601 date at midnight UTC); inclusive
      - name: term_end_date
        type: datetime
        source: input
        description: Last calendar day of enrollment (ISO 8601 date at midnight UTC); inclusive; null while open
        default: null
      - name: term_status
        type: enum
        source: system
        description: State of this enrollment term
        constraints: "one of ACTIVE, WITHDRAWN, COMPLETED"
        default: ACTIVE
      - name: withdrawal_reason
        type: enum
        source: input
        description: Reason code recorded when a term is withdrawn
        constraints: "one of MOVED_DISTRICT, RETURN_TO_BRICK_AND_MORTAR, HOMESCHOOL, DROPOUT, ADMINISTRATIVE; required on withdraw"
        default: null
      - name: proration_mode
        type: enum
        source: system
        description: Which proration variant was used to compute funding for a withdrawn term
        constraints: "one of DAILY_ATTENDANCE, CALENDAR_ELAPSED; null while term is ACTIVE"
        default: null
      - name: claimable_days
        type: integer
        source: computed
        description: Days of funding claimable for this term under the active proration mode
        default: 0

  - name: DeviceStipend
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student receiving the stipend"
      - name: stipend_type
        type: enum
        source: input
        description: Category of the stipend
        constraints: "one of DEVICE, INTERNET"
      - name: amount_cents
        type: integer
        source: input
        description: Dollar amount of the stipend issued, in cents
        constraints: ">= 0"
      - name: issue_status
        type: enum
        source: system
        description: Lifecycle of the stipend
        constraints: "one of REQUESTED, ISSUED, RETURN_REQUESTED, RETURNED, FORFEITED"
        default: REQUESTED
      - name: issued_at
        type: datetime
        source: system
        description: Timestamp the stipend was disbursed
        default: null
      - name: return_due_date
        type: datetime
        source: system
        description: Date by which a DEVICE stipend's hardware must be returned after withdrawal; null for INTERNET
        default: null
      - name: clawback_cents
        type: integer
        source: computed
        description: Amount clawed back if a DEVICE is not returned by return_due_date; equals amount_cents when forfeited
        default: 0

  - name: Teacher
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: Teacher full name
      - name: certification_state_codes
        type: array
        source: input
        description: Array of two-letter state codes in which the teacher holds a valid K-12 teaching certificate
      - name: caseload_cap
        type: integer
        source: input
        description: Maximum number of ENROLLED students the teacher may be assigned
        constraints: ">= 1"
      - name: current_caseload
        type: integer
        source: computed
        description: Count of TeacherAssignment rows in ASSIGNED state linked to this teacher
        default: 0
      - name: teacher_status
        type: enum
        source: system
        description: Whether the teacher is currently employable for assignment
        constraints: "one of ACTIVE, INACTIVE"
        default: ACTIVE

  - name: TeacherAssignment
    parent: Teacher
    common_fields: true
    fields:
      - name: teacher_id
        type: string
        source: input
        description: "FK -> Teacher.id; assigned teacher"
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student being taught"
      - name: subject
        type: enum
        source: input
        description: Subject area of the assignment
        constraints: "one of ELA, MATH, SCIENCE, SOCIAL_STUDIES, SPECIAL_ED"
      - name: assignment_status
        type: enum
        source: system
        description: Lifecycle of the assignment
        constraints: "one of ASSIGNED, ENDED"
        default: ASSIGNED
      - name: assigned_at
        type: datetime
        source: system
        description: Timestamp assignment became effective
      - name: ended_at
        type: datetime
        source: system
        description: Timestamp assignment ended; null while ASSIGNED
        default: null

  - name: AttendanceRecord
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student whose attendance is recorded"
      - name: attendance_date
        type: datetime
        source: input
        description: Calendar date being recorded (ISO 8601 date at midnight UTC)
      - name: synchronous_minutes
        type: integer
        source: input
        description: Minutes spent in live synchronous class sessions that day
        constraints: ">= 0"
      - name: engagement_check_ins
        type: integer
        source: input
        description: Count of engagement events (login, LMS activity, assignment submission) that day
        constraints: ">= 0"
      - name: attendance_status
        type: enum
        source: system
        description: Derived daily attendance determination
        constraints: "one of PRESENT, PARTIAL, ABSENT_UNEXCUSED, ABSENT_EXCUSED"
      - name: excused_reason
        type: string
        source: input
        description: Free-text reason when a parent/guardian excuses the absence
        default: null

  - name: AssessmentWindow
    parent: null
    common_fields: true
    fields:
      - name: assessment_name
        type: string
        source: input
        description: Name of the proctored assessment (e.g. "Spring State Math Test")
      - name: subject
        type: enum
        source: input
        description: Subject tested
        constraints: "one of ELA, MATH, SCIENCE"
      - name: window_start
        type: datetime
        source: input
        description: First instant students may sit the assessment
      - name: window_end
        type: datetime
        source: input
        description: Last instant students may sit the assessment; must be after window_start
      - name: window_status
        type: enum
        source: system
        description: Lifecycle of the assessment window
        constraints: "one of SCHEDULED, OPEN, CLOSED"
        default: SCHEDULED

  - name: TestSite
    parent: null
    common_fields: true
    fields:
      - name: site_name
        type: string
        source: input
        description: Human-readable name of the proctoring site
      - name: state_code
        type: string
        source: input
        description: Two-letter state code where the site is located
        constraints: "ISO 3166-2 US state code, uppercase"
      - name: seat_capacity
        type: integer
        source: input
        description: Total proctored seats per assessment window
        constraints: ">= 1"
      - name: seats_booked
        type: integer
        source: computed
        description: Count of ProctorAssignment rows in BOOKED state at this site for the current window
        default: 0

  - name: ProctorAssignment
    parent: AssessmentWindow
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; student sitting the assessment"
      - name: assessment_window_id
        type: string
        source: input
        description: "FK -> AssessmentWindow.id; window within which the student sits"
      - name: test_site_id
        type: string
        source: input
        description: "FK -> TestSite.id; physical proctoring site assigned"
      - name: assignment_status
        type: enum
        source: system
        description: Lifecycle of this proctoring assignment
        constraints: "one of BOOKED, COMPLETED, NO_SHOW, CANCELLED"
        default: BOOKED
      - name: booked_at
        type: datetime
        source: system
        description: Timestamp the seat was booked
      - name: completed_at
        type: datetime
        source: system
        description: Timestamp the assessment was completed; null until COMPLETED
        default: null

  - name: ServiceDelivery
    parent: Student
    common_fields: true
    fields:
      - name: student_id
        type: string
        source: input
        description: "FK -> Student.id; special-education student receiving the service"
      - name: service_type
        type: enum
        source: input
        description: Category of special-education service
        constraints: "one of SPEECH_THERAPY, OCCUPATIONAL_THERAPY, COUNSELING, RESOURCE_ROOM"
      - name: scheduled_at
        type: datetime
        source: input
        description: Date/time the service session is scheduled
      - name: duration_minutes
        type: integer
        source: input
        description: Planned length of the session
        constraints: ">= 15"
      - name: provider_id
        type: string
        source: input
        description: "FK -> Teacher.id; teacher/related-service provider delivering the session; provider's certification_state_codes must contain the student's district state"
      - name: delivery_status
        type: enum
        source: system
        description: Lifecycle of this service session
        constraints: "one of SCHEDULED, DELIVERED, MISSED, CANCELLED"
        default: SCHEDULED
      - name: delivered_at
        type: datetime
        source: system
        description: Timestamp the session was marked delivered; null until DELIVERED
        default: null

# =============================================================================
# Table 2: State Machine Table (§1.2)
# =============================================================================
state_machines:
  - entity: Student
    initial_state: APPLIED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: APPLIED
        to: ELIGIBLE
        trigger: "POST /vks/students/{id}/verify-residency"
        actor: EnrollmentOfficer
        preconditions:
          - "student.enrollment_status == APPLIED"
          - "district referenced by student.district_of_residence_id exists"
          - "count of students with enrollment_status in {ELIGIBLE, ENROLLED} for this district < district.enrollment_cap"
        side_effects:
          - "set student.residency_verified_at to current clock time"
          - "increment student.version by 1"
      - from: ELIGIBLE
        to: ENROLLED
        trigger: "POST /vks/students/{id}/enroll"
        actor: EnrollmentOfficer
        preconditions:
          - "student.enrollment_status == ELIGIBLE"
          - "district referenced by student.district_of_residence_id has at least one open slot (enrolled count < enrollment_cap)"
        side_effects:
          - "create EnrollmentTerm with student_id = student.id, term_start_date = current clock date, term_status = ACTIVE"
          - "increment student.version by 1"
      - from: ENROLLED
        to: WITHDRAWN
        trigger: "POST /vks/students/{id}/withdraw"
        actor: EnrollmentOfficer
        preconditions:
          - "student.enrollment_status == ENROLLED"
          - "the student's current EnrollmentTerm.term_status == ACTIVE"
        side_effects:
          - "set current EnrollmentTerm.term_status = WITHDRAWN, term_end_date = current clock date minus 1 day"
          - "set EnrollmentTerm.proration_mode per withdrawal_reason (see calculations.proration_mode_selector)"
          - "recompute EnrollmentTerm.claimable_days via calculations.funding_proration"
          - "recompute student.funding_days_claimed as the sum of claimable_days over all terms"
          - "recompute student.funding_claim_cents via calculations.funding_claim_amount"
          - "for every DeviceStipend of this student with issue_status == ISSUED and stipend_type == DEVICE: set issue_status = RETURN_REQUESTED and return_due_date = current clock date + 30 days"
          - "for every DeviceStipend of this student with issue_status == ISSUED and stipend_type == INTERNET: set issue_status = FORFEITED, clawback_cents = 0 (internet stipends are not clawed back)"
          - "for every TeacherAssignment with student_id = student.id and assignment_status == ASSIGNED: set assignment_status = ENDED, ended_at = now; decrement that teacher's current_caseload by 1"
          - "for every ProctorAssignment with student_id = student.id and assignment_status == BOOKED: set assignment_status = CANCELLED; decrement that TestSite.seats_booked by 1"
          - "for every ServiceDelivery with student_id = student.id and delivery_status == SCHEDULED: set delivery_status = CANCELLED"
          - "increment student.version by 1"
      - from: WITHDRAWN
        to: REENROLL_PENDING
        trigger: "POST /vks/students/{id}/request-reenrollment"
        actor: EnrollmentOfficer
        preconditions:
          - "student.enrollment_status == WITHDRAWN"
        side_effects:
          - "increment student.version by 1"
      - from: REENROLL_PENDING
        to: ENROLLED
        trigger: "POST /vks/students/{id}/enroll"
        actor: EnrollmentOfficer
        preconditions:
          - "student.enrollment_status == REENROLL_PENDING"
          - "district referenced by student.district_of_residence_id has at least one open slot"
        side_effects:
          - "create new EnrollmentTerm with student_id = student.id, term_start_date = current clock date, term_status = ACTIVE"
          - "increment student.version by 1"

  - entity: DeviceStipend
    initial_state: REQUESTED
    terminal_states: [RETURNED, FORFEITED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /vks/stipends/{id}/issue"
        actor: FinanceOfficer
        preconditions:
          - "stipend.issue_status == REQUESTED"
          - "student referenced by stipend.student_id has enrollment_status == ENROLLED"
          - "no other DeviceStipend for the same student and same stipend_type has issue_status in {REQUESTED, ISSUED, RETURN_REQUESTED}"
        side_effects:
          - "set stipend.issued_at = now"
          - "increment stipend.version by 1"
      - from: ISSUED
        to: RETURN_REQUESTED
        trigger: "system cascade from Student ENROLLED -> WITHDRAWN"
        actor: system
        preconditions:
          - "stipend.stipend_type == DEVICE"
        side_effects:
          - "set stipend.return_due_date = current clock date + 30 days"
          - "increment stipend.version by 1"
      - from: ISSUED
        to: FORFEITED
        trigger: "system cascade from Student ENROLLED -> WITHDRAWN (INTERNET only)"
        actor: system
        preconditions:
          - "stipend.stipend_type == INTERNET"
        side_effects:
          - "set stipend.clawback_cents = 0"
          - "increment stipend.version by 1"
      - from: RETURN_REQUESTED
        to: RETURNED
        trigger: "POST /vks/stipends/{id}/mark-returned"
        actor: FinanceOfficer
        preconditions:
          - "stipend.issue_status == RETURN_REQUESTED"
        side_effects:
          - "set stipend.clawback_cents = 0"
          - "increment stipend.version by 1"
      - from: RETURN_REQUESTED
        to: FORFEITED
        trigger: "system auto-transition when current clock date > stipend.return_due_date and issue_status still RETURN_REQUESTED"
        actor: system
        preconditions:
          - "current clock date > stipend.return_due_date"
        side_effects:
          - "set stipend.clawback_cents = stipend.amount_cents"
          - "increment stipend.version by 1"

  - entity: AttendanceRecord
    initial_state: PRESENT
    terminal_states: []
    transitions:
      - from: PRESENT
        to: ABSENT_EXCUSED
        trigger: "POST /vks/attendance/{id}/excuse"
        actor: EnrollmentOfficer
        preconditions:
          - "record.attendance_status in {PRESENT, PARTIAL, ABSENT_UNEXCUSED}"
        side_effects:
          - "set record.excused_reason from request payload"
          - "recompute student.truancy_unexcused_count via calculations.truancy_window_count"
          - "recompute student.truancy_flag via calculations.truancy_determination"
          - "increment record.version by 1"
      - from: PARTIAL
        to: ABSENT_EXCUSED
        trigger: "POST /vks/attendance/{id}/excuse"
        actor: EnrollmentOfficer
        preconditions:
          - "record.attendance_status in {PRESENT, PARTIAL, ABSENT_UNEXCUSED}"
        side_effects:
          - "set record.excused_reason from request payload"
          - "recompute student.truancy_unexcused_count via calculations.truancy_window_count"
          - "recompute student.truancy_flag via calculations.truancy_determination"
          - "increment record.version by 1"
      - from: ABSENT_UNEXCUSED
        to: ABSENT_EXCUSED
        trigger: "POST /vks/attendance/{id}/excuse"
        actor: EnrollmentOfficer
        preconditions:
          - "record.attendance_status in {PRESENT, PARTIAL, ABSENT_UNEXCUSED}"
        side_effects:
          - "set record.excused_reason from request payload"
          - "recompute student.truancy_unexcused_count via calculations.truancy_window_count (count decreases by 1)"
          - "recompute student.truancy_flag via calculations.truancy_determination (may clear flag when count drops below threshold)"
          - "increment record.version by 1"

  - entity: AssessmentWindow
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "system auto-transition when current clock time >= window_start"
        actor: system
        preconditions:
          - "current clock time >= window.window_start"
        side_effects:
          - "increment window.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "system auto-transition when current clock time > window_end"
        actor: system
        preconditions:
          - "current clock time > window.window_end"
        side_effects:
          - "for every ProctorAssignment with assessment_window_id = window.id and assignment_status == BOOKED: set assignment_status = NO_SHOW"
          - "increment window.version by 1"

  - entity: ProctorAssignment
    initial_state: BOOKED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: BOOKED
        to: COMPLETED
        trigger: "POST /vks/proctor-assignments/{id}/mark-completed"
        actor: ProctorCoordinator
        preconditions:
          - "assignment.assignment_status == BOOKED"
          - "window referenced by assignment.assessment_window_id has window_status == OPEN"
        side_effects:
          - "set assignment.completed_at = now"
          - "increment assignment.version by 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /vks/proctor-assignments/{id}/cancel OR system cascade from Student withdrawal"
        actor: ProctorCoordinator
        preconditions:
          - "assignment.assignment_status == BOOKED"
        side_effects:
          - "decrement TestSite.seats_booked by 1 for the site referenced by assignment.test_site_id"
          - "increment assignment.version by 1"
      - from: BOOKED
        to: NO_SHOW
        trigger: "system cascade from AssessmentWindow OPEN -> CLOSED"
        actor: system
        preconditions:
          - "assignment.assignment_status == BOOKED at window close"
        side_effects:
          - "increment assignment.version by 1"

  - entity: TeacherAssignment
    initial_state: ASSIGNED
    terminal_states: [ENDED]
    transitions:
      - from: ASSIGNED
        to: ENDED
        trigger: "POST /vks/teacher-assignments/{id}/end OR system cascade from Student withdrawal"
        actor: AcademicDirector
        preconditions:
          - "assignment.assignment_status == ASSIGNED"
        side_effects:
          - "set assignment.ended_at = now"
          - "decrement teacher.current_caseload by 1"
          - "increment assignment.version by 1"

  - entity: ServiceDelivery
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /vks/service-deliveries/{id}/mark-delivered"
        actor: SpecialEdCoordinator
        preconditions:
          - "delivery.delivery_status == SCHEDULED"
          - "student referenced by delivery.student_id has enrollment_status == ENROLLED"
        side_effects:
          - "set delivery.delivered_at = now"
          - "increment delivery.version by 1"
      - from: SCHEDULED
        to: MISSED
        trigger: "POST /vks/service-deliveries/{id}/mark-missed"
        actor: SpecialEdCoordinator
        preconditions:
          - "delivery.delivery_status == SCHEDULED"
          - "current clock time > delivery.scheduled_at + duration_minutes"
        side_effects:
          - "increment delivery.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vks/service-deliveries/{id}/cancel OR system cascade from Student withdrawal"
        actor: SpecialEdCoordinator
        preconditions:
          - "delivery.delivery_status == SCHEDULED"
        side_effects:
          - "increment delivery.version by 1"
      - from: MISSED
        to: SCHEDULED
        trigger: "POST /vks/service-deliveries/{id}/reschedule"
        actor: SpecialEdCoordinator
        preconditions:
          - "delivery.delivery_status == MISSED"
          - "new scheduled_at in payload is strictly in the future relative to current clock"
        side_effects:
          - "set delivery.scheduled_at = payload.scheduled_at"
          - "increment delivery.version by 1"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: enroll-stale-student-version
    parent_entity: Student
    write_endpoint: "POST /vks/students/{id}/enroll"
    occ_field: "expected_student_version"
    description: |
      Enrolling a student whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      just mutated the student (e.g., residency verification or a withdrawal)
      and the current writer's view of the student is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: book-proctor-stale-site-version
    parent_entity: TestSite
    write_endpoint: "POST /vks/proctor-assignments"
    occ_field: "expected_test_site_version"
    description: |
      Booking a ProctorAssignment against a TestSite whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just booked or cancelled a seat (changing
      seats_booked) and the current writer's view of the site is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table (§1.3)
# =============================================================================
calculations:
  - name: funding_proration
    description: Compute claimable days for an EnrollmentTerm on withdrawal; two valid variants exist depending on state reporting rules
    trigger: "Student ENROLLED -> WITHDRAWN transition; also re-evaluated if withdrawal_reason is corrected before term is finalized"
    algorithm: chronological
    formula: |
      Let term_start = EnrollmentTerm.term_start_date (inclusive)
      Let term_end   = EnrollmentTerm.term_end_date (inclusive)
      Let calendar_days = (term_end - term_start).days + 1  # both endpoints inclusive
      If proration_mode == CALENDAR_ELAPSED:
        claimable_days = max(0, calendar_days)
      Else if proration_mode == DAILY_ATTENDANCE:
        # count only days with an AttendanceRecord.attendance_status in {PRESENT, PARTIAL}
        claimable_days = count of AttendanceRecord rows for this student
                         where attendance_date in [term_start, term_end] (inclusive)
                         and attendance_status in {PRESENT, PARTIAL}
      Set EnrollmentTerm.claimable_days = claimable_days
    input_set: "EnrollmentTerm being withdrawn; AttendanceRecord rows for the same student within [term_start, term_end] inclusive"
    constants:
      MIN_DAYS: 0
    precision: "integer days; no rounding"
    variants:
      - name: daily_attendance
        when: "withdrawal_reason in {DROPOUT, ADMINISTRATIVE}"
        difference: "only days with a PRESENT or PARTIAL AttendanceRecord count; calendar days with ABSENT_* or no record are excluded"
      - name: calendar_elapsed
        when: "withdrawal_reason in {MOVED_DISTRICT, RETURN_TO_BRICK_AND_MORTAR, HOMESCHOOL}"
        difference: "all calendar days from term_start through term_end inclusive count, regardless of attendance records"

  - name: funding_claim_amount
    description: Total funding claim in cents across all of a student's terms; rounding happens per term then sums
    trigger: "any change to an EnrollmentTerm.claimable_days, or on creation of a new term, or when district funding rate changes (recompute-on-read)"
    algorithm: aggregation
    formula: |
      Let terms = all EnrollmentTerm rows where student_id == student.id
      Let rate = student.district.funding_rate_cents  # rate at computation time
      For each term t in terms:
        term_claim_cents[t] = t.claimable_days * rate   # integer arithmetic, no rounding yet
      student.funding_days_claimed = sum over t of t.claimable_days
      student.funding_claim_cents  = sum over t of term_claim_cents[t]
    input_set: "EnrollmentTerm rows of the student (any term_status); District referenced by student.district_of_residence_id"
    constants: {}
    precision: "integer cents; multiplication per term, then sum — sum-then-round is NOT used"
    variants:
      - name: per_term_then_sum
        when: "always (this is the pinned order)"
        difference: "per-term claim computed first, then summed; alternative sum-of-days-then-multiply is forbidden"

  - name: attendance_determination
    description: Derive daily attendance_status from synchronous_minutes and engagement_check_ins against thresholds
    trigger: "on POST /vks/attendance (creation of the record)"
    algorithm: threshold
    formula: |
      Let mins = attendance.synchronous_minutes
      Let checkins = attendance.engagement_check_ins
      If mins >= FULL_DAY_MINUTES and checkins >= MIN_CHECKINS:
        attendance_status = PRESENT
      Else if mins >= HALF_DAY_MINUTES or checkins >= MIN_CHECKINS:
        attendance_status = PARTIAL
      Else:
        attendance_status = ABSENT_UNEXCUSED
      # Boundary rule: thresholds are inclusive (>=), not exclusive (>)
    input_set: "single AttendanceRecord being created"
    constants:
      FULL_DAY_MINUTES: 240
      HALF_DAY_MINUTES: 120
      MIN_CHECKINS: 2
    precision: "integer minutes / integer check-ins"
    variants: []

  - name: truancy_window_count
    description: Rolling count of unexcused absence days over a sliding window of the most recent school days
    trigger: "on AttendanceRecord creation when attendance_status == ABSENT_UNEXCUSED; on AttendanceRecord excuse transition; on Student ENROLLED (resets to 0)"
    algorithm: chronological
    formula: |
      Let window_days = TRUANCY_WINDOW_SCHOOL_DAYS  # 10
      Let cutoff = the (window_days)-th most recent calendar date that has an AttendanceRecord for this student
      truancy_unexcused_count = count of AttendanceRecord rows for this student
                                where attendance_date >= cutoff
                                and attendance_status == ABSENT_UNEXCUSED
      If the student has fewer than window_days records, cutoff is the earliest record's date (i.e. all records count).
    input_set: "AttendanceRecord rows for this student ordered by attendance_date DESC; only the most recent TRUANCY_WINDOW_SCHOOL_DAYS records enter the window"
    constants:
      TRUANCY_WINDOW_SCHOOL_DAYS: 10
    precision: "integer count"
    variants:
      - name: inclusive_window
        when: "always"
        difference: "window is defined by count of records, not by calendar span; the Nth most recent record's date is the inclusive cutoff"

  - name: truancy_determination
    description: Boolean flag derived from truancy_unexcused_count against the state truancy threshold
    trigger: "after every recompute of truancy_unexcused_count"
    algorithm: threshold
    formula: |
      If truancy_unexcused_count >= TRUANCY_THRESHOLD:
        student.truancy_flag = true
      Else:
        student.truancy_flag = false
      # Boundary rule: threshold is inclusive (>=) — exactly TRUANCY_THRESHOLD unexcused days triggers truancy
    input_set: "student.truancy_unexcused_count"
    constants:
      TRUANCY_THRESHOLD: 3
    precision: "boolean"
    variants: []

  - name: proration_mode_selector
    description: Deterministic mapping from withdrawal_reason to proration_mode
    trigger: "during Student ENROLLED -> WITHDRAWN transition, before funding_proration runs"
    algorithm: constraint_propagation
    formula: |
      If withdrawal_reason in {DROPOUT, ADMINISTRATIVE}:
        proration_mode = DAILY_ATTENDANCE
      Else if withdrawal_reason in {MOVED_DISTRICT, RETURN_TO_BRICK_AND_MORTAR, HOMESCHOOL}:
        proration_mode = CALENDAR_ELAPSED
    input_set: "payload.withdrawal_reason of the withdraw call"
    constants: {}
    precision: "enum"
    variants: []

  - name: teacher_caseload_check
    description: Verify adding an assignment does not exceed caseload cap; boundary at exactly cap is rejected
    trigger: "on POST /vks/teacher-assignments"
    algorithm: threshold
    formula: |
      Let proposed = teacher.current_caseload + 1
      If proposed > teacher.caseload_cap:
        reject with ERR_CASELOAD_EXCEEDED
      # Boundary rule: cap is a hard maximum — proposed == cap is allowed, proposed == cap+1 is rejected
    input_set: "Teacher row referenced by payload.teacher_id"
    constants: {}
    precision: "integer count"
    variants: []

  - name: test_site_seat_check
    description: Verify booking a proctored seat does not exceed site capacity for the window
    trigger: "on POST /vks/proctor-assignments"
    algorithm: threshold
    formula: |
      Let proposed = test_site.seats_booked + 1
      If proposed > test_site.seat_capacity:
        reject with ERR_NO_SEAT_AVAILABLE
      # Boundary rule: proposed == seat_capacity is allowed; proposed == seat_capacity + 1 is rejected
    input_set: "TestSite row referenced by payload.test_site_id"
    constants: {}
    precision: "integer count"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority, §1.4)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "acting role is in the endpoint's authorized roles list (§1.5 roles)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path-parameter id resolves to an existing entity; validated left-to-right along the path"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "every foreign-key field in the request body (district_of_residence_id, teacher_id, student_id, test_site_id, assessment_window_id, provider_id) resolves to an existing entity"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST/PUT/PATCH endpoints with body FKs"
  - priority: 5
    category: state
    check: "entity is in a state that admits the requested transition (per §1.2 preconditions); includes: ServiceDelivery creation requires referenced Student.enrollment_status == ENROLLED; DeviceStipend.issue requires Student.enrollment_status == ENROLLED; TeacherAssignment creation requires Student.enrollment_status == ENROLLED; ProctorAssignment creation requires Student.enrollment_status == ENROLLED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "OCC optimistic-concurrency check: payload.expected_<parent>_version == current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /vks/students/{id}/enroll, POST /vks/proctor-assignments"
  - priority: 7
    category: business_safety
    check: "teacher certification: on POST /vks/teacher-assignments, the state_code of the student's district_of_residence must be in teacher.certification_state_codes"
    error_id: ERR_TEACHER_NOT_CERTIFIED_IN_STATE
    http_status: 422
    applies_to: "POST /vks/teacher-assignments"
  - priority: 8
    category: business_safety
    check: "provider certification: on POST /vks/service-deliveries, the state_code of the student's district_of_residence must be in provider.certification_state_codes"
    error_id: ERR_PROVIDER_NOT_CERTIFIED_IN_STATE
    http_status: 422
    applies_to: "POST /vks/service-deliveries"
  - priority: 9
    category: business_constraint
    check: "teacher caseload cap: current_caseload + 1 <= caseload_cap"
    error_id: ERR_CASELOAD_EXCEEDED
    http_status: 422
    applies_to: "POST /vks/teacher-assignments"
  - priority: 10
    category: business_constraint
    check: "test-site seat availability: seats_booked + 1 <= seat_capacity"
    error_id: ERR_NO_SEAT_AVAILABLE
    http_status: 422
    applies_to: "POST /vks/proctor-assignments"
  - priority: 11
    category: business_temporal
    check: "assessment window open: on POST /vks/proctor-assignments, the referenced AssessmentWindow.window_status must be OPEN or SCHEDULED (bookings allowed pre-open); on mark-completed the window must be OPEN"
    error_id: ERR_ASSESSMENT_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /vks/proctor-assignments, POST /vks/proctor-assignments/{id}/mark-completed"
  - priority: 12
    category: business_temporal
    check: "service delivery reschedule: new scheduled_at strictly in the future relative to current clock"
    error_id: ERR_SCHEDULE_TIME_IN_PAST
    http_status: 422
    applies_to: "POST /vks/service-deliveries/{id}/reschedule"
  - priority: 13
    category: business_constraint
    check: "unique stipend: no other DeviceStipend for the same student and stipend_type in {REQUESTED, ISSUED, RETURN_REQUESTED} when issuing"
    error_id: ERR_DUPLICATE_ACTIVE_STIPEND
    http_status: 422
    applies_to: "POST /vks/stipends/{id}/issue"
  - priority: 14
    category: business_fiscal
    check: "district enrollment cap: on verify-residency and enroll, enrolled+eligible count for the district must be < enrollment_cap"
    error_id: ERR_DISTRICT_CAP_REACHED
    http_status: 422
    applies_to: "POST /vks/students/{id}/verify-residency, POST /vks/students/{id}/enroll"
  - priority: 15
    category: business_referential
    check: "special-education precondition: on POST /vks/service-deliveries, student.special_education_flag must be true"
    error_id: ERR_NOT_SPECIAL_ED_STUDENT
    http_status: 422
    applies_to: "POST /vks/service-deliveries"
  - priority: 16
    category: business_constraint
    check: "input shape: required fields present, enums in declared set, numeric ranges honored (grade_level in [0,12], minutes >= 0, capacity >= 1, etc.)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# Table 5: API Endpoint Table (§1.5)
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: /vks/_clock/set_current_utc
    description: "Set the server's logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; the clock MUST NOT fall back to real wall-clock time. All auto-transitions and date arithmetic use this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects:
      - "advance any AssessmentWindow whose window_start <= new clock to OPEN (if SCHEDULED)"
      - "advance any AssessmentWindow whose window_end < new clock to CLOSED (if OPEN), cascading BOOKED ProctorAssignments to NO_SHOW"
      - "advance any DeviceStipend in RETURN_REQUESTED whose return_due_date < new clock date to FORFEITED"

  # --- District ---
  - method: POST
    path: /vks/districts
    description: "Register a district"
    roles: [PlatformAdmin]
    code: 201
    input: [district_code, state_code, funding_rate_cents, enrollment_cap]
    output: District
    side_effects: []
  - method: GET
    path: /vks/districts/{id}
    description: "Fetch a district by id"
    roles: [PlatformAdmin, EnrollmentOfficer, FinanceOfficer, AcademicDirector, ProctorCoordinator, SpecialEdCoordinator]
    code: 200
    input: []
    output: District
    side_effects: []
  - method: GET
    path: /vks/districts
    description: "List districts with pagination"
    roles: [PlatformAdmin, EnrollmentOfficer, FinanceOfficer, AcademicDirector, ProctorCoordinator, SpecialEdCoordinator]
    code: 200
    input: ['limit?', 'offset?', 'state_code?']
    output: District[]
    side_effects: []

  # --- Student ---
  - method: POST
    path: /vks/students
    description: "Create a student application"
    roles: [EnrollmentOfficer, PlatformAdmin]
    code: 201
    input: [legal_name, date_of_birth, grade_level, district_of_residence_id, 'special_education_flag?']
    output: Student
    side_effects: []
  - method: GET
    path: /vks/students/{id}
    description: "Fetch a student by id"
    roles: [PlatformAdmin, EnrollmentOfficer, FinanceOfficer, AcademicDirector, ProctorCoordinator, SpecialEdCoordinator]
    code: 200
    input: []
    output: Student
    side_effects: []
  - method: GET
    path: /vks/students
    description: "List students with pagination"
    roles: [PlatformAdmin, EnrollmentOfficer, FinanceOfficer, AcademicDirector, ProctorCoordinator, SpecialEdCoordinator]
    code: 200
    input: ['limit?', 'offset?', 'district_of_residence_id?', 'enrollment_status?', 'truancy_flag?']
    output: Student[]
    side_effects: []
  - method: POST
    path: /vks/students/{id}/verify-residency
    description: "Mark a student's residency verified and move APPLIED -> ELIGIBLE"
    roles: [EnrollmentOfficer]
    code: 200
    input: []
    output: Student
    side_effects: ["Student APPLIED -> ELIGIBLE transition"]
  - method: POST
    path: /vks/students/{id}/enroll
    description: "Enroll a student (ELIGIBLE -> ENROLLED or REENROLL_PENDING -> ENROLLED). OCC-guarded on Student.version."
    roles: [EnrollmentOfficer]
    code: 200
    input: [expected_student_version]
    output: Student
    side_effects: ["Student -> ENROLLED transition; create EnrollmentTerm; increment student.version"]
  - method: POST
    path: /vks/students/{id}/withdraw
    description: "Withdraw a student; cascades stipends, assignments, proctor bookings, service deliveries; computes proration"
    roles: [EnrollmentOfficer]
    code: 200
    input: [withdrawal_reason]
    output: Student
    side_effects: ["Student ENROLLED -> WITHDRAWN transition with full cascade"]
  - method: POST
    path: /vks/students/{id}/request-reenrollment
    description: "Move a WITHDRAWN student to REENROLL_PENDING"
    roles: [EnrollmentOfficer]
    code: 200
    input: []
    output: Student
    side_effects: ["Student WITHDRAWN -> REENROLL_PENDING transition"]

  # --- EnrollmentTerm ---
  - method: GET
    path: /vks/students/{id}/enrollment-terms
    description: "List enrollment terms of a student"
    roles: [PlatformAdmin, EnrollmentOfficer, FinanceOfficer]
    code: 200
    input: ['limit?', 'offset?']
    output: EnrollmentTerm[]
    side_effects: []
  - method: GET
    path: /vks/enrollment-terms/{id}
    description: "Fetch one enrollment term"
    roles: [PlatformAdmin, EnrollmentOfficer, FinanceOfficer]
    code: 200
    input: []
    output: EnrollmentTerm
    side_effects: []

  # --- DeviceStipend ---
  - method: POST
    path: /vks/stipends
    description: "Request a stipend for a student"
    roles: [FinanceOfficer]
    code: 201
    input: [student_id, stipend_type, amount_cents]
    output: DeviceStipend
    side_effects: []
  - method: GET
    path: /vks/stipends/{id}
    description: "Fetch one stipend"
    roles: [PlatformAdmin, FinanceOfficer, EnrollmentOfficer]
    code: 200
    input: []
    output: DeviceStipend
    side_effects: []
  - method: GET
    path: /vks/students/{id}/stipends
    description: "List stipends of a student"
    roles: [PlatformAdmin, FinanceOfficer, EnrollmentOfficer]
    code: 200
    input: ['limit?', 'offset?', 'issue_status?']
    output: DeviceStipend[]
    side_effects: []
  - method: POST
    path: /vks/stipends/{id}/issue
    description: "Issue a REQUESTED stipend"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: DeviceStipend
    side_effects: ["DeviceStipend REQUESTED -> ISSUED"]
  - method: POST
    path: /vks/stipends/{id}/mark-returned
    description: "Mark a RETURN_REQUESTED device stipend as returned"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: DeviceStipend
    side_effects: ["DeviceStipend RETURN_REQUESTED -> RETURNED; clawback_cents = 0"]

  # --- Teacher ---
  - method: POST
    path: /vks/teachers
    description: "Register a teacher"
    roles: [AcademicDirector, PlatformAdmin]
    code: 201
    input: [full_name, certification_state_codes, caseload_cap]
    output: Teacher
    side_effects: []
  - method: GET
    path: /vks/teachers/{id}
    description: "Fetch a teacher"
    roles: [PlatformAdmin, AcademicDirector, SpecialEdCoordinator, EnrollmentOfficer]
    code: 200
    input: []
    output: Teacher
    side_effects: []
  - method: GET
    path: /vks/teachers
    description: "List teachers"
    roles: [PlatformAdmin, AcademicDirector, SpecialEdCoordinator, EnrollmentOfficer]
    code: 200
    input: ['limit?', 'offset?']
    output: Teacher[]
    side_effects: []

  # --- TeacherAssignment ---
  - method: POST
    path: /vks/teacher-assignments
    description: "Assign a teacher to a student for a subject"
    roles: [AcademicDirector]
    code: 201
    input: [teacher_id, student_id, subject]
    output: TeacherAssignment
    side_effects: ["increment teacher.current_caseload by 1"]
  - method: GET
    path: /vks/teacher-assignments/{id}
    description: "Fetch one teacher assignment"
    roles: [PlatformAdmin, AcademicDirector]
    code: 200
    input: []
    output: TeacherAssignment
    side_effects: []
  - method: GET
    path: /vks/teachers/{id}/teacher-assignments
    description: "List assignments of a teacher"
    roles: [PlatformAdmin, AcademicDirector]
    code: 200
    input: ['limit?', 'offset?', 'assignment_status?']
    output: TeacherAssignment[]
    side_effects: []
  - method: GET
    path: /vks/students/{id}/teacher-assignments
    description: "List teacher assignments of a student"
    roles: [PlatformAdmin, AcademicDirector, EnrollmentOfficer]
    code: 200
    input: ['limit?', 'offset?', 'assignment_status?']
    output: TeacherAssignment[]
    side_effects: []
  - method: POST
    path: /vks/teacher-assignments/{id}/end
    description: "End an ASSIGNED teacher assignment"
    roles: [AcademicDirector]
    code: 200
    input: []
    output: TeacherAssignment
    side_effects: ["TeacherAssignment ASSIGNED -> ENDED; decrement teacher.current_caseload"]

  # --- Attendance ---
  - method: POST
    path: /vks/attendance
