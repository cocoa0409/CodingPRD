# §1.9 Scaffold Corner Design - breadth coverage of every testable claim in SCAFFOLD.yaml
# §1.1-§1.7 that SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already assert.
# Taxonomy: references/claim-extraction-guide.md (sections and per-section claim_type rows only).
# Logical clock default for every recipe below: 2026-08-01T00:00:00Z.
scaffold_corner_design:
  - section: Entities
    instances:
      - name: participant_creation_returns_applied_with_provisional_fee_and_success_envelope
        claim_type: Creation
        grounds:
          - endpoints.POST_hie_participants
          - entities.Participant
          - calculations.participation_fee
          - response_envelope.success
        distinguishing_aspect: |
          POST /hie/participants with all four required inputs returns 201 wrapped in the declared success
          envelope (meta.api_request_id, meta.api_request_timestamp, response_type object, data) and the
          data object carries every declared Participant field, including the PROVISIONAL fee derived at
          registration time from ceil(360012 / 12) = 30001 monthly units.
        test_recipe:
          setup:
            - "Empty database; no participants exist."
          setup_api_calls: []
          trigger:
            - call: "POST /hie/participants"
              payload: { legal_name: "Ashford General Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 360012, primary_contact_email: "hie@ashford.example" }
              as: HieAdmin
              captures: { pE1_id: $.data.id, pE1_status: $.data.onboarding_status, pE1_version: $.data.version, pE1_fee: $.data.provisional_monthly_fee_cents, pE1_tier: $.data.fee_tier, pE1_grade: $.data.quality_grade, pE1_score: $.data.quality_score, pE1_balance: $.data.outstanding_balance_cents, pE1_sanctions: $.data.sanction_points_active, pE1_subs: $.data.active_subscription_count, pE1_attempts: $.data.conformance_attempt_count }
          assert:
            - "response status == 201"
            - "response_type == object and meta.api_request_id and meta.api_request_timestamp are present"
            - "${pE1_status} == APPLIED"
            - "${pE1_version} == 1"
            - "${pE1_fee} == 299877"
            - "${pE1_tier} == TIER_2"
            - "${pE1_grade} == UNGRADED"
            - "${pE1_score} == null"
            - "${pE1_balance} == 0"
            - "${pE1_sanctions} == 0"
            - "${pE1_subs} == 0"
            - "${pE1_attempts} == 0"
            - "${pE1_id} is a UUID with no type prefix"
      - name: participant_retrieval_returns_the_stored_row_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints.GET_hie_participants_id
          - entities.Participant
        distinguishing_aspect: |
          GET /hie/participants/{id} returns exactly the row written by the create call - same id, same
          legal_name, same computed fee - and does not mutate version.
        test_recipe:
          setup:
            - "One participant registered with declared_annual_patient_volume 360012."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Ashford General Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 360012, primary_contact_email: "hie@ashford.example" }
              as: HieAdmin
              captures: { pE2_id: $.data.id }
          trigger:
            - call: "GET /hie/participants/${pE2_id}"
              payload: {}
              as: HieAdmin
              captures: { pE2_read_id: $.data.id, pE2_read_name: $.data.legal_name, pE2_read_fee: $.data.provisional_monthly_fee_cents, pE2_read_version: $.data.version }
          assert:
            - "response status == 200"
            - "${pE2_read_id} == ${pE2_id}"
            - "${pE2_read_name} == Ashford General Hospital"
            - "${pE2_read_fee} == 299877"
            - "${pE2_read_version} == 1"
      - name: participant_listing_returns_pagination_fields_and_org_type_filter
        claim_type: Listing
        grounds:
          - endpoints.GET_hie_participants
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          GET /hie/participants returns response_type array with limit 10, offset 0, total_count 3 and
          has_more false over three rows, and the org_type filter narrows the same list to the single
          LAB row without changing total_count semantics (total_count reflects the filtered set).
        test_recipe:
          setup:
            - "Three participants exist: two HOSPITAL rows and one LAB row, created in that order."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Ashford General Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 360012, primary_contact_email: "hie@ashford.example" }
              as: HieAdmin
              captures: { pE3_a: $.data.id }
            - call: "POST /hie/participants"
              payload: { legal_name: "Brightwater Community Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 96000, primary_contact_email: "hie@brightwater.example" }
              as: HieAdmin
              captures: { pE3_b: $.data.id }
            - call: "POST /hie/participants"
              payload: { legal_name: "Calder Reference Laboratory", org_type: "LAB", declared_annual_patient_volume: 12000, primary_contact_email: "hie@calderlab.example" }
              as: HieAdmin
              captures: { pE3_c: $.data.id }
          trigger:
            - call: "GET /hie/participants"
              payload: {}
              as: HieAdmin
              captures: { listE3_first: "$.data[0].id", listE3_third: "$.data[2].id" }
            - call: "GET /hie/participants"
              payload: { org_type: "LAB" }
              as: HieAdmin
              captures: { listE3_lab_id: "$.data[0].id", listE3_lab_type: "$.data[0].org_type" }
          assert:
            - "the first trigger call returns response_type array with total_count 3, has_more false, limit 10 and offset 0"
            - "${listE3_first} == ${pE3_a}"
            - "${listE3_third} == ${pE3_c}"
            - "the second trigger call returns total_count 1 and has_more false"
            - "${listE3_lab_id} == ${pE3_c}"
            - "${listE3_lab_type} == LAB"
      - name: participant_read_with_unknown_id_returns_participant_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_hie_participants_id
          - validations.priority_7_path_id_resolution
          - errors.ERR_PARTICIPANT_NOT_FOUND
        distinguishing_aspect: |
          A well-formed UUID that matches no stored row returns 404 ERR_PARTICIPANT_NOT_FOUND in the error
          envelope, not 200 with a null body and not 400.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /hie/participants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: HieAdmin
          assert:
            - "response status == 404"
            - "response_type == error and data.error_id == ERR_PARTICIPANT_NOT_FOUND"
      - name: patient_record_without_birth_date_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_hie_participants_id_patient_records
          - validations.priority_6_ERR_INVALID_REQUEST
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: |
          birth_date is a required input on POST /hie/participants/{id}/patient-records with no default,
          so omitting it returns 400 ERR_INVALID_REQUEST before any matching work happens - no
          PatientRecord, no IdentityCluster and no MatchLink row is written.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY threshold generation is ACTIVE and one participant is at CONFORMANCE_TESTING."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-E5", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgE5_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgE5_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Ellingham Street Clinic", org_type: "CLINIC", declared_annual_patient_volume: 24000, primary_contact_email: "hie@ellingham.example" }
              as: HieAdmin
              captures: { pE5_id: $.data.id }
            - call: "POST /hie/participants/${pE5_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pE5_id}"
            - call: "POST /hie/participants/${pE5_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
          trigger:
            - call: "POST /hie/participants/${pE5_id}/patient-records"
              payload: { source_mrn: "E5-0001", given_name: "Nadia", family_name: "Whitlock", sex: "F", ssn_last4: "1102", postal_code: "02139", phone_digits: "6175550101" }
              as: HieAdmin
          assert:
            - "response status == 400 and data.error_id == ERR_INVALID_REQUEST"
            - "GET /hie/patient-records filtered by participant_id ${pE5_id} returns 0 rows"
      - name: consent_policy_omitting_effective_until_defaults_to_open_ended_draft
        claim_type: Defaults
        grounds:
          - endpoints.POST_hie_consent_policies
          - entities.ConsentPolicy.fields.effective_until
          - entities.ConsentPolicy.fields.directive_count
        distinguishing_aspect: |
          effective_until is the only optional input on POST /hie/consent-policies; omitting it must store
          null (an open-ended generation), and the two system-managed fields must initialize to DRAFT and
          0 rather than being echoed from the request.
        test_recipe:
          setup:
            - "No consent policies exist."
          setup_api_calls: []
          trigger:
            - call: "POST /hie/consent-policies"
              payload: { policy_version: "SP-2026.D", model: "OPT_IN", sensitive_categories_segmented: ["BEHAVIORAL_HEALTH", "HIV"], default_share_for_treatment: false, effective_from: "2026-01-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "privacy-policy-1"
              captures: { polE6_id: $.data.id, polE6_until: $.data.effective_until, polE6_status: $.data.status, polE6_count: $.data.directive_count, polE6_activator: $.data.activated_by_user_id }
          assert:
            - "response status == 201"
            - "${polE6_until} == null"
            - "${polE6_status} == DRAFT"
            - "${polE6_count} == 0"
            - "${polE6_activator} == null"
      - name: patient_record_computed_fields_recomputed_and_client_values_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.PatientRecord.fields.completeness_score
          - entities.PatientRecord.fields.match_state
          - entities.PatientRecord.fields.cluster_id
          - endpoints.POST_hie_participants_id_patient_records
        distinguishing_aspect: |
          completeness_score, match_state and cluster_id are source computed. A create request that also
          sends completeness_score 99, match_state QUARANTINED and cluster_id of an unrelated UUID must
          have those values ignored: the stored row shows completeness_score 6 (all six scored
          demographics present), match_state CLUSTERED and a freshly minted cluster id.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY threshold generation is ACTIVE and one participant is at CONFORMANCE_TESTING."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-E7", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgE7_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgE7_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Fairhaven Medical Associates", org_type: "CLINIC", declared_annual_patient_volume: 36000, primary_contact_email: "hie@fairhaven.example" }
              as: HieAdmin
              captures: { pE7_id: $.data.id }
            - call: "POST /hie/participants/${pE7_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pE7_id}"
            - call: "POST /hie/participants/${pE7_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
          trigger:
            - call: "POST /hie/participants/${pE7_id}/patient-records"
              payload: { source_mrn: "E7-0001", given_name: "Nadia", family_name: "Whitlock", birth_date: "1990-02-11", sex: "F", ssn_last4: "1102", postal_code: "02139", phone_digits: "6175550101", completeness_score: 99, match_state: "QUARANTINED", cluster_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2" }
              as: HieAdmin
              captures: { recE7_id: $.data.id, recE7_completeness: $.data.completeness_score, recE7_state: $.data.match_state, recE7_cluster: $.data.cluster_id }
          assert:
            - "response status == 201"
            - "${recE7_completeness} == 6"
            - "${recE7_state} == CLUSTERED"
            - "${recE7_cluster} != 8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
            - "IdentityCluster.${recE7_cluster}.member_record_count == 1 and IdentityCluster.${recE7_cluster}.status == ACTIVE"
      - name: participant_system_fields_are_server_minted_and_client_values_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Participant
          - endpoints.POST_hie_participants
        distinguishing_aspect: |
          id, created_at, updated_at and version are common fields minted by the server. A create request
          that supplies all four must have them ignored: version starts at 1 and the id is not the
          client-supplied UUID.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /hie/participants"
              payload: { legal_name: "Glenmore Health Plan", org_type: "HEALTH_PLAN", declared_annual_patient_volume: 60000, primary_contact_email: "hie@glenmore.example", id: "11111111-1111-4111-8111-111111111111", version: 77, created_at: "2020-01-01T00:00:00.000Z", updated_at: "2020-01-01T00:00:00.000Z" }
              as: HieAdmin
              captures: { pE8_id: $.data.id, pE8_version: $.data.version, pE8_created: $.data.created_at }
          assert:
            - "response status == 201"
            - "${pE8_id} != 11111111-1111-4111-8111-111111111111"
            - "${pE8_version} == 1"
            - "${pE8_created} == 2026-08-01T00:00:00.000Z"
      - name: participant_org_type_outside_its_domain_returns_invalid_enum
        claim_type: Type Constraints
        grounds:
          - entities.Participant.fields.org_type
          - validations.priority_6_ERR_INVALID_REQUEST
        distinguishing_aspect: |
          org_type is constrained to HOSPITAL | CLINIC | LAB | HEALTH_PLAN | PUBLIC_HEALTH; the value
          DENTIST is refused with 400 ERR_INVALID_REQUEST, and a negative
          declared_annual_patient_volume is refused by the same rule.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /hie/participants"
              payload: { legal_name: "Harlow Dental Group", org_type: "DENTIST", declared_annual_patient_volume: 12000, primary_contact_email: "hie@harlow.example" }
              as: HieAdmin
            - call: "POST /hie/participants"
              payload: { legal_name: "Harlow Dental Group", org_type: "CLINIC", declared_annual_patient_volume: -5, primary_contact_email: "hie@harlow.example" }
              as: HieAdmin
          assert:
            - "both trigger calls return status 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /hie/participants returns total_count 0"
      - name: feed_quality_sample_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.FeedQualitySample
          - endpoints.GET_hie_data_feeds_id_quality_samples
        distinguishing_aspect: |
          FeedQualitySample is declared common_fields false, so the stored row exposes id and created_at
          only - no version and no updated_at - and §1.5 offers no update or delete endpoint for it. The
          same holds for RecordLocatorQuery and AccessAuditEntry.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with one ADT feed carrying one sample."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Ironbridge Regional Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 72000, primary_contact_email: "hie@ironbridge.example" }
              as: HieAdmin
              captures: { pE10_id: $.data.id }
            - call: "POST /hie/participants/${pE10_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pE10_id}"
            - call: "POST /hie/participants/${pE10_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pE10_ver: $.data.version }
            - call: "POST /hie/participants/${pE10_id}/data-feeds"
              payload: { feed_type: "ADT", expected_participant_version: "${pE10_ver}" }
              as: HieAdmin
              captures: { feedE10_id: $.data.id }
            - call: "POST /hie/data-feeds/${feedE10_id}/quality-samples"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", messages_received: 8000, messages_rejected: 100, required_fields_missing_count: 200, duplicate_count: 50, timeliness_p95_seconds: 250 }
              as: HieAdmin
              captures: { sampE10_id: $.data.id, sampE10_rate: $.data.reject_rate }
          trigger:
            - call: "GET /hie/data-feeds/${feedE10_id}/quality-samples"
              payload: {}
              as: HieAdmin
              captures: { sampE10_read_id: "$.data[0].id", sampE10_read_created: "$.data[0].created_at" }
          assert:
            - "response status == 200 with total_count 1"
            - "${sampE10_read_id} == ${sampE10_id}"
            - "${sampE10_rate} == 0.0125"
            - "${sampE10_read_created} == 2026-08-01T00:00:00.000Z"
            - "the returned row carries no version key and no updated_at key"
      - name: conformance_test_under_unknown_participant_returns_participant_not_found
        claim_type: Parent Relationships
        grounds:
          - endpoints.POST_hie_participants_id_conformance_tests
          - validations.priority_7_path_id_resolution
          - errors.ERR_PARTICIPANT_NOT_FOUND
        distinguishing_aspect: |
          ConformanceTest declares parent Participant and is addressed only through
          /hie/participants/{id}/conformance-tests, so an unknown parent id returns 404
          ERR_PARTICIPANT_NOT_FOUND before any profile or schedule validation runs.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /hie/participants/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/conformance-tests"
              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
          assert:
            - "response status == 404 and data.error_id == ERR_PARTICIPANT_NOT_FOUND"
      - name: match_link_is_a_junction_row_reachable_from_both_records_and_the_cluster
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.MatchLink
          - endpoints.GET_hie_match_links
        distinguishing_aspect: |
          The declared topology is graph: MatchLink is a junction carrying its own score and lifecycle
          between two PatientRecord nodes owned by two different participants, and it is discoverable by
          left_record_id, by right_record_id and by cluster_id. A pair scoring 0.9200 yields exactly one
          junction row, not one per participant.
        test_recipe:
          setup:
            - "A PROBABILISTIC_ONLY generation with auto_link_threshold 0.9200 is ACTIVE."
            - "Two participants at CONFORMANCE_TESTING contribute the Robert Nguyen pair that scores exactly 0.9200 and AUTO_LINKS."
          setup_api_calls:
            - call: "POST /hie/match-threshold-configs"
              payload: { config_label: "REF-PROB-E12", auto_link_threshold: 0.9200, review_lower_bound: 0.7500, score_variant_mode: "PROBABILISTIC_ONLY", weight_family_name: 0.20, weight_given_name: 0.12, weight_birth_date: 0.25, weight_ssn_last4: 0.28, weight_postal_code: 0.08, weight_phone_digits: 0.07, partial_credit_factor: 0.50 }
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
              captures: { cfgE12_id: $.data.id }
            - call: "POST /hie/match-threshold-configs/${cfgE12_id}/activation"
              payload: {}
              as: PrivacyOfficer
              as_user_id: "privacy-tuner-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Juniper Falls Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 60000, primary_contact_email: "hie@juniperfalls.example" }
              as: HieAdmin
              captures: { pE12_a: $.data.id }
            - call: "POST /hie/participants/${pE12_a}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pE12_a}"
            - call: "POST /hie/participants/${pE12_a}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants"
              payload: { legal_name: "Kingsbridge Family Clinic", org_type: "CLINIC", declared_annual_patient_volume: 24000, primary_contact_email: "hie@kingsbridge.example" }
              as: HieAdmin
              captures: { pE12_b: $.data.id }
            - call: "POST /hie/participants/${pE12_b}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pE12_b}"
            - call: "POST /hie/participants/${pE12_b}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pE12_a}/patient-records"
              payload: { source_mrn: "E12-A1", given_name: "Robert", family_name: "Nguyen", birth_date: "1979-04-12", sex: "M", ssn_last4: "4417", postal_code: "94110", phone_digits: "4155550111" }
              as: HieAdmin
              captures: { recE12_l: $.data.id, clusterE12_a: $.data.cluster_id }
            - call: "POST /hie/participants/${pE12_b}/patient-records"
              payload: { source_mrn: "E12-B1", given_name: "Robert", family_name: "Nguyen", birth_date: "1979-04-12", sex: "M", ssn_last4: "4417", postal_code: "02139", phone_digits: "4155550111" }
              as: HieAdmin
              captures: { recE12_r: $.data.id }
          trigger:
            - call: "GET /hie/match-links"
              payload: { left_record_id: "${recE12_l}" }
              as: PrivacyOfficer
              captures: { linkE12_id: "$.data[0].id", linkE12_score: "$.data[0].match_score", linkE12_status: "$.data[0].status", linkE12_variant: "$.data[0].score_variant" }
            - call: "GET /hie/match-links"
              payload: { right_record_id: "${recE12_r}" }
              as: PrivacyOfficer
              captures: { linkE12_id_again: "$.data[0].id" }
            - call: "GET /hie/match-links"
              payload: { cluster_id: "${clusterE12_a}" }
              as: PrivacyOfficer
              captures: { linkE12_id_by_cluster: "$.data[0].id" }
          assert:
            - "each trigger call returns total_count 1"
            - "${linkE12_id_again} == ${linkE12_id}"
            - "${linkE12_id_by_cluster} == ${linkE12_id}"
            - "${linkE12_score} == 0.9200"
            - "${linkE12_status} == AUTO_LINKED"
            - "${linkE12_variant} == PROBABILISTIC"
  - section: State Machines
    instances:
      - name: submit_for_legal_review_moves_applied_to_legal_review
        claim_type: Valid Transition
        grounds:
          - state_machines.Participant.APPLIED_to_LEGAL_REVIEW
          - endpoints.POST_hie_participants_id_onboarding_transitions
        distinguishing_aspect: |
          The only outgoing action from APPLIED other than WITHDRAW: SUBMIT_FOR_LEGAL_REVIEW by the
          participant's own admin moves onboarding_status to LEGAL_REVIEW and increments version from 1
          to 2, with no other field touched.
        test_recipe:
          setup:
            - "One participant in APPLIED."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Larkspur Community Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 48000, primary_contact_email: "hie@larkspur.example" }
              as: HieAdmin
              captures: { pS1_id: $.data.id, pS1_v1: $.data.version }
          trigger:
            - call: "POST /hie/participants/${pS1_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pS1_id}"
              captures: { pS1_status: $.data.onboarding_status, pS1_v2: $.data.version, pS1_agreement: $.data.agreement_version }
          assert:
            - "response status == 200"
            - "${pS1_v1} == 1"
            - "${pS1_status} == LEGAL_REVIEW"
            - "${pS1_v2} == 2"
            - "${pS1_agreement} == null"
      - name: certify_without_all_required_profiles_returns_certification_profiles_incomplete
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Participant.CONFORMANCE_TESTING_to_CERTIFIED
          - validations.priority_36_ERR_CERTIFICATION_PROFILES_INCOMPLETE
          - calculations.conformance_pass_rate.constants.REQUIRED_CERTIFICATION_PROFILES
        distinguishing_aspect: |
          CERTIFY carries three preconditions; this instance violates only the profile-coverage one. The
          participant has ADT_PUBLISHER and DOCUMENT_SOURCE PASSED but no QUERY_RESPONDER run at all, so
          passed_profiles is not a superset of REQUIRED_CERTIFICATION_PROFILES and the call returns 409
          ERR_CERTIFICATION_PROFILES_INCOMPLETE while the participant stays in CONFORMANCE_TESTING.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with exactly two PASSED profiles: ADT_PUBLISHER and DOCUMENT_SOURCE."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Marlowe Point Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 60000, primary_contact_email: "hie@marlowepoint.example" }
              as: HieAdmin
              captures: { pS2_id: $.data.id }
            - call: "POST /hie/participants/${pS2_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pS2_id}"
            - call: "POST /hie/participants/${pS2_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pS2_id}/conformance-tests"
              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctS2_1: $.data.id }
            - call: "POST /hie/conformance-tests/${ctS2_1}/results"
              payload: { assertions_total: 200, assertions_passed: 200 }
              as: HieAdmin
            - call: "POST /hie/participants/${pS2_id}/conformance-tests"
              payload: { profile: "DOCUMENT_SOURCE", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctS2_2: $.data.id }
            - call: "POST /hie/conformance-tests/${ctS2_2}/results"
              payload: { assertions_total: 200, assertions_passed: 200 }
              as: HieAdmin
          trigger:
            - call: "POST /hie/participants/${pS2_id}/onboarding-transitions"
              payload: { action: "CERTIFY" }
              as: HieAdmin
              as_user_id: "admin-cert-1"
          assert:
            - "response status == 409 and data.error_id == ERR_CERTIFICATION_PROFILES_INCOMPLETE"
            - "Participant.${pS2_id}.onboarding_status == CONFORMANCE_TESTING"
            - "Participant.${pS2_id}.certified_by_user_id == null and Participant.${pS2_id}.certified_at == null"
      - name: execute_agreement_records_signatory_and_auto_advances_to_conformance_testing
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Participant.LEGAL_REVIEW_to_AGREEMENT_EXECUTED
          - state_machines.Participant.AGREEMENT_EXECUTED_to_CONFORMANCE_TESTING
          - entities.Participant.fields.agreement_executed_by_user_id
        distinguishing_aspect: |
          Four declared side effects must all be observable in the single response: agreement_version and
          agreement_signed_at stored, agreement_executed_by_user_id set from X-User-ID, the system
          transition AGREEMENT_EXECUTED -> CONFORMANCE_TESTING already applied (so the body reports
          CONFORMANCE_TESTING, never AGREEMENT_EXECUTED), and version advanced once per request.
        test_recipe:
          setup:
            - "One participant in LEGAL_REVIEW with version 2."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Norwood Crossing Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 84000, primary_contact_email: "hie@norwoodcrossing.example" }
              as: HieAdmin
              captures: { pS3_id: $.data.id }
            - call: "POST /hie/participants/${pS3_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pS3_id}"
              captures: { pS3_v2: $.data.version }
          trigger:
            - call: "POST /hie/participants/${pS3_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-07-20T09:30:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
              captures: { pS3_status: $.data.onboarding_status, pS3_agreement: $.data.agreement_version, pS3_signed: $.data.agreement_signed_at, pS3_signatory: $.data.agreement_executed_by_user_id, pS3_v3: $.data.version, pS3_failed: $.data.consecutive_failed_attempts }
          assert:
            - "${pS3_v2} == 2"
            - "${pS3_status} == CONFORMANCE_TESTING"
            - "${pS3_agreement} == DURSA-2026.1"
            - "${pS3_signed} == 2026-07-20T09:30:00Z"
            - "${pS3_signatory} == admin-legal-1"
            - "${pS3_v3} == 3"
            - "${pS3_failed} == 0"
      - name: certify_from_legal_review_returns_invalid_state_transition
        claim_type: Invalid Transitions
        grounds:
          - validations.priority_10_ERR_INVALID_STATE_TRANSITION
          - state_machines.Participant
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          CERTIFY is an outgoing action of CONFORMANCE_TESTING only. Sent while the participant is in
          LEGAL_REVIEW it must return 409 ERR_INVALID_STATE_TRANSITION - not
          ERR_CERTIFICATION_PROFILES_INCOMPLETE, even though the profile set is also empty, because
          priority 10 outranks priority 36.
        test_recipe:
          setup:
            - "One participant in LEGAL_REVIEW with no conformance runs."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Oakhurst Valley Clinic", org_type: "CLINIC", declared_annual_patient_volume: 18000, primary_contact_email: "hie@oakhurst.example" }
              as: HieAdmin
              captures: { pS4_id: $.data.id }
            - call: "POST /hie/participants/${pS4_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pS4_id}"
          trigger:
            - call: "POST /hie/participants/${pS4_id}/onboarding-transitions"
              payload: { action: "CERTIFY" }
              as: HieAdmin
              as_user_id: "admin-cert-1"
          assert:
            - "response status == 409 and data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "the response does not mention ERR_CERTIFICATION_PROFILES_INCOMPLETE"
            - "Participant.${pS4_id}.onboarding_status == LEGAL_REVIEW and Participant.${pS4_id}.version == 2"
      - name: scheduled_conformance_run_starts_in_running_with_attempt_number_one
        claim_type: Initial State
        grounds:
          - state_machines.ConformanceTest.initial_state
          - endpoints.POST_hie_participants_id_conformance_tests
          - entities.ConformanceTest.fields.attempt_number
        distinguishing_aspect: |
          A freshly scheduled ConformanceTest is created in RUNNING with attempt_number 1, pass_rate null
          and critical_failure false, and it raises the participant's conformance_attempt_count to 1 -
          the row is never created directly in PASSED or FAILED.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with no prior runs."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Pemberton Heights Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 66000, primary_contact_email: "hie@pemberton.example" }
              as: HieAdmin
              captures: { pS5_id: $.data.id }
            - call: "POST /hie/participants/${pS5_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pS5_id}"
            - call: "POST /hie/participants/${pS5_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
          trigger:
            - call: "POST /hie/participants/${pS5_id}/conformance-tests"
              payload: { profile: "QUERY_RESPONDER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctS5_id: $.data.id, ctS5_status: $.data.status, ctS5_attempt: $.data.attempt_number, ctS5_rate: $.data.pass_rate, ctS5_critical: $.data.critical_failure, ctS5_executor: $.data.executed_by_user_id }
          assert:
            - "response status == 201"
            - "${ctS5_status} == RUNNING"
            - "${ctS5_attempt} == 1"
            - "${ctS5_rate} == null"
            - "${ctS5_critical} == false"
            - "Participant.${pS5_id}.conformance_attempt_count == 1"
      - name: waiver_on_an_already_passed_conformance_run_returns_terminal_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ConformanceTest.terminal_states
          - validations.priority_11_ERR_TERMINAL_STATE
          - endpoints.POST_hie_conformance_tests_id_waiver
        distinguishing_aspect: |
          PASSED is terminal for ConformanceTest, so a waiver request against a PASSED run returns 409
          ERR_TERMINAL_STATE and leaves waiver_reason null. Waiver is only legal from FAILED.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING with a PASSED ADT_PUBLISHER run (200/200)."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Quarrymill Regional Hospital", org_type: "HOSPITAL", declared_annual_patient_volume: 54000, primary_contact_email: "hie@quarrymill.example" }
              as: HieAdmin
              captures: { pS6_id: $.data.id }
            - call: "POST /hie/participants/${pS6_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pS6_id}"
            - call: "POST /hie/participants/${pS6_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pS6_id}/conformance-tests"
              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctS6_id: $.data.id }
            - call: "POST /hie/conformance-tests/${ctS6_id}/results"
              payload: { assertions_total: 200, assertions_passed: 200 }
              as: HieAdmin
              captures: { ctS6_status: $.data.status }
          trigger:
            - call: "POST /hie/conformance-tests/${ctS6_id}/waiver"
              payload: { waiver_reason: "Attempting to waive a run that already passed." }
              as: HieAdmin
          assert:
            - "${ctS6_status} == PASSED"
            - "response status == 409 and data.error_id == ERR_TERMINAL_STATE"
            - "ConformanceTest.${ctS6_id}.status == PASSED and ConformanceTest.${ctS6_id}.waiver_reason == null"
      - name: repeating_submit_for_legal_review_is_rejected_on_the_second_attempt
        claim_type: Idempotency
        grounds:
          - state_machines.Participant.APPLIED_to_LEGAL_REVIEW
          - validations.priority_10_ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: |
          The onboarding action endpoint is not idempotent: the first SUBMIT_FOR_LEGAL_REVIEW succeeds and
          the identical second request returns 409 ERR_INVALID_STATE_TRANSITION because APPLIED is no
          longer the current state. version must advance exactly once across the two requests.
        test_recipe:
          setup:
            - "One participant in APPLIED."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Rosevale Community Clinic", org_type: "CLINIC", declared_annual_patient_volume: 21000, primary_contact_email: "hie@rosevale.example" }
              as: HieAdmin
              captures: { pS7_id: $.data.id }
          trigger:
            - call: "POST /hie/participants/${pS7_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pS7_id}"
              captures: { pS7_status_1: $.data.onboarding_status, pS7_v_1: $.data.version }
            - call: "POST /hie/participants/${pS7_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pS7_id}"
          assert:
            - "${pS7_status_1} == LEGAL_REVIEW"
            - "${pS7_v_1} == 2"
            - "the second trigger call returns status 409 with data.error_id == ERR_INVALID_STATE_TRANSITION"
            - "Participant.${pS7_id}.version == 2 after both calls"
      - name: onboarding_loops_conformance_testing_to_remediation_and_back
        claim_type: cyclic
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Participant.CONFORMANCE_TESTING_to_REMEDIATION
          - state_machines.Participant.REMEDIATION_to_CONFORMANCE_TESTING
          - calculations.conformance_pass_rate.constants.CONSECUTIVE_FAILURE_LIMIT
        distinguishing_aspect: |
          The declared shape is cyclic: three consecutive FAILED ADT_PUBLISHER results (189/200 each) drive
          the system transition into REMEDIATION with remediation_count 1, and RESUME_CONFORMANCE by the
          participant's own admin returns it to CONFORMANCE_TESTING with consecutive_failed_attempts reset
          to 0 while conformance_attempt_count stays at 3 and passed_profiles stays empty. The loop may be
          re-entered, so nothing about the cycle is one-shot.
        test_recipe:
          setup:
            - "One participant at CONFORMANCE_TESTING."
          setup_api_calls:
            - call: "POST /hie/participants"
              payload: { legal_name: "Stonebrook Medical Center", org_type: "HOSPITAL", declared_annual_patient_volume: 78000, primary_contact_email: "hie@stonebrook.example" }
              as: HieAdmin
              captures: { pS8_id: $.data.id }
            - call: "POST /hie/participants/${pS8_id}/onboarding-transitions"
              payload: { action: "SUBMIT_FOR_LEGAL_REVIEW" }
              as: ParticipantAdmin
              as_user_id: "${pS8_id}"
            - call: "POST /hie/participants/${pS8_id}/onboarding-transitions"
              payload: { action: "EXECUTE_AGREEMENT", agreement_version: "DURSA-2026.1", signed_at: "2026-08-01T00:00:00Z" }
              as: HieAdmin
              as_user_id: "admin-legal-1"
            - call: "POST /hie/participants/${pS8_id}/conformance-tests"
              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctS8_1: $.data.id }
            - call: "POST /hie/conformance-tests/${ctS8_1}/results"
              payload: { assertions_total: 200, assertions_passed: 189 }
              as: HieAdmin
              captures: { ctS8_1_status: $.data.status }
            - call: "POST /hie/participants/${pS8_id}/conformance-tests"
              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctS8_2: $.data.id, ctS8_2_attempt: $.data.attempt_number }
            - call: "POST /hie/conformance-tests/${ctS8_2}/results"
              payload: { assertions_total: 200, assertions_passed: 189 }
              as: HieAdmin
            - call: "GET /hie/participants/${pS8_id}"
              payload: {}
              as: HieAdmin
              captures: { pS8_status_after_2: $.data.onboarding_status, pS8_failed_after_2: $.data.consecutive_failed_attempts }
            - call: "POST /hie/participants/${pS8_id}/conformance-tests"
              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctS8_3: $.data.id, ctS8_3_attempt: $.data.attempt_number }
          trigger:
            - call: "POST /hie/conformance-tests/${ctS8_3}/results"
              payload: { assertions_total: 200, assertions_passed: 189 }
              as: HieAdmin
              captures: { ctS8_3_status: $.data.status }
            - call: "GET /hie/participants/${pS8_id}"
              payload: {}
              as: HieAdmin
              captures: { pS8_status_after_3: $.data.onboarding_status, pS8_remediations: $.data.remediation_count, pS8_failed_after_3: $.data.consecutive_failed_attempts, pS8_attempts: $.data.conformance_attempt_count }
            - call: "POST /hie/participants/${pS8_id}/onboarding-transitions"
              payload: { action: "RESUME_CONFORMANCE" }
              as: ParticipantAdmin
              as_user_id: "${pS8_id}"
              captures: { pS8_status_resumed: $.data.onboarding_status, pS8_failed_resumed: $.data.consecutive_failed_attempts, pS8_attempts_resumed: $.data.conformance_attempt_count, pS8_profiles_resumed: $.data.passed_profiles }
          assert:
            - "${ctS8_1_status} == FAILED"
            - "${ctS8_2_attempt} == 2"
            - "${pS8_status_after_2} == CONFORMANCE_TESTING"
            - "${pS8_failed_after_2} == 2"
            - "${ctS8_3_attempt} == 3"
            - "${ctS8_3_status} == FAILED"
            - "${pS8_status_after_3} == REMEDIATION"
            - "${pS8_remediations} == 1"
            - "${pS8_failed_after_3} == 3"
            - "${pS8_attempts} == 3"
            - "${pS8_status_resumed} == CONFORMANCE_TESTING"
            - "${pS8_failed_resumed} == 0"
            - "${pS8_attempts_resumed} == 3"
            - "${pS8_profiles_resumed} == []"
      - name: break_glass_dual_axis_state_independence
        claim_type: parallel
        grounds:
          - state_machines.BreakGlassAccess.initial_state
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / break_glass_session_and_review_dimensions_advance_independently
          rationale: "That §1.8 instance already asserts every combination of session_status x review_status reachable from the initial pair, including closure after an UNJUSTIFIED finding."
      - name: participant_suspension_cascades_down_to_feeds_and_scorecard
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Participant.CERTIFIED_to_SUSPENDED
          - state_machines.DataFeed.MONITORED_to_SUSPENDED
        excluded_because:
          difficulty_instance: transitive_cascade / unjustified_break_glass_review_cascades_sanction_suspension_feed_and_scorecard
          rationale: "The cascade-down side-effect set (feed suspension with PARTICIPANT_SUSPENSION_CASCADE plus quality re-run) is asserted end-to-end there."
      - name: unlink_compensation_reverses_every_merge_side_effect
        claim_type: Side Effect Execution
        grounds:
          - state_machines.MatchLink.LINKED_to_UNLINKED
          - state_machines.IdentityCluster.MERGED_AWAY_to_ACTIVE
        excluded_because:
          difficulty_instance: compensating_invariant / unlink_restores_cluster_membership_conservation_after_a_confirmed_merge
          rationale: "The compensation pattern (restore cluster, re-point records, clear prior_cluster_id, recount) is asserted field by field there."
      - name: subscription_activation_is_guarded_by_a_foreign_entity_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.NotificationSubscription.PENDING_ACTIVATION_to_ACTIVE
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / subscription_activation_blocked_until_a_fresh_adt_publisher_run_passes
          rationale: "The guarded-transition claim (ACTIVATE only if a PASSED ADT_PUBLISHER ConformanceTest exists) is asserted on both sides there."
  - section: Calculations
    instances:
      - name: conformance_pass_rate_at_the_floor_passes_and_one_assertion_below_fails
        claim_type: threshold
        grounds:
          - calculations.conformance_pass_rate
          - calculations.conformance_pass_rate.constants.CONFORMANCE_PASS_RATE_FLOOR
          - state_machines.ConformanceTest.RUNNING_to_PASSED
