  # --- Consult requests ---
  - method: POST
    path: "/econsult/consult-requests"
    description: "Submit a structured asynchronous consult; routing selector runs inline"
    roles: [ReferringProvider]
    code: 201
    input: [patient_ref, specialty_track_id, question_text, icd10_primary, "comorbidity_flags?", "urgency?"]
    output: ConsultRequest
    side_effects: ["referring_provider_id set from X-User-ID", "routing pass: ASSIGNED or QUEUED with RoutingDecision", "sla_due_at computed", "membership.open_consult_count += 1 when assigned", "billing_status UNBILLABLE"]
  - method: GET
    path: "/econsult/consult-requests"
    description: "List consult requests with filters (reverse reachability for its FKs)"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: ["referring_provider_id?", "specialty_track_id?", "assigned_specialist_id?", "assigned_membership_id?", "status?", "limit?", "offset?"]
    output: "ConsultRequest[]"
    side_effects: []
  - method: GET
    path: "/econsult/consult-requests/{id}"
    description: "Get a consult request"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: ConsultRequest
    side_effects: []
  - method: PATCH
    path: "/econsult/consult-requests/{id}"
    description: "Amend the structured question pre-answer (OCC-guarded)"
    roles: [ReferringProvider]
    code: 200
    input: ["question_text?", "icd10_primary?", "comorbidity_flags?", "urgency?", expected_consult_version]
    output: ConsultRequest
    side_effects: ["ConsultRequest.version incremented", "updated_at refreshed"]
  - method: POST
    path: "/econsult/consult-requests/{id}/reroute"
    description: "Re-run the routing selector for a QUEUED consult (OCC-guarded)"
    roles: [ProgramCoordinator]
    code: 200
    input: [expected_consult_version]
    output: ConsultRequest
    side_effects: ["QUEUED -> ASSIGNED with selector side effects", "ConsultRequest.version incremented"]
  - method: POST
    path: "/econsult/consult-requests/{id}/cancel"
    description: "Cancel a pre-answer consult"
    roles: [ReferringProvider]
    code: 200
    input: []
    output: ConsultRequest
    side_effects: ["status -> CANCELLED", "open_consult_count decremented when assigned", "PROVISIONAL entries REVERSED", "billing_status -> VOID"]
  - method: POST
    path: "/econsult/consult-requests/{id}/close"
    description: "Close an answered consult (requires FINALIZED response)"
    roles: [ReferringProvider]
    code: 200
    input: []
    output: ConsultRequest
    side_effects: ["status ANSWERED -> CLOSED"]
  - method: POST
    path: "/econsult/consult-requests/{id}/clarifications"
    description: "Post a clarification message; specialist posts drive ASSIGNED->CLARIFICATION_REQUESTED, provider replies drive CLARIFICATION_REQUESTED->ASSIGNED with a provisional CLARIFICATION_FEE"
    roles: [ReferringProvider, Specialist]
    code: 201
    input: [body]
    output: ClarificationMessage
    side_effects: ["cycle transition per author role", "clarification_rounds += 1 on specialist request", "CLARIFICATION_FEE provisional entry on provider reply"]
  - method: GET
    path: "/econsult/consult-requests/{id}/clarifications"
    description: "List clarification messages of a consult (reverse reachability)"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "ClarificationMessage[]"
    side_effects: []
  - method: GET
    path: "/econsult/consult-requests/{id}/routing-decisions"
    description: "List routing decisions of a consult (reverse reachability)"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "RoutingDecision[]"
    side_effects: []

  # --- Consult responses ---
  - method: POST
    path: "/econsult/consult-requests/{id}/responses"
    description: "Submit the specialist response (drives ASSIGNED -> ANSWERED)"
    roles: [Specialist]
    code: 201
    input: [disposition, recommendation_text]
    output: ConsultResponse
    side_effects: ["on_time / response_minutes / review_required snapshotted", "provisional RESPONSE_FEE entry", "membership counters updated", "billing_status -> PENDING_DOCUMENTATION", "quality recompute may change standing"]
  - method: GET
    path: "/econsult/consult-requests/{id}/responses"
    description: "List responses of a consult (reverse reachability)"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "ConsultResponse[]"
    side_effects: []
  - method: GET
    path: "/econsult/consult-responses/{id}"
    description: "Get a consult response"
    roles: [ProgramCoordinator, ReferringProvider, Specialist, QualityReviewer, BillingClerk]
    code: 200
    input: []
    output: ConsultResponse
    side_effects: []
  - method: POST
    path: "/econsult/consult-responses/{id}/documentation"
    description: "Mark one side of the dual-record documentation complete (PCP note by the owning provider, specialist note by the responder)"
    roles: [ReferringProvider, Specialist]
    code: 200
    input: [record_type]
    output: ConsultResponse
    side_effects: ["pcp_note_documented or specialist_note_documented set per record_type and caller identity", "documentation_complete recomputed"]
  - method: POST
    path: "/econsult/consult-responses/{id}/finalize"
    description: "Finalize a fully documented response (posts compensation at the final variant)"
    roles: [Specialist]
    code: 200
    input: []
    output: ConsultResponse
    side_effects: ["status -> FINALIZED", "RESPONSE_FEE PROVISIONAL -> POSTED at final amount", "CLARIFICATION_FEE entries POSTED", "consult.billing_status -> CHARGEABLE"]
  - method: POST
    path: "/econsult/consult-responses/{id}/revise"
    description: "Revise a REBUKED response (cycle back to SUBMITTED; documentation flags reset)"
    roles: [Specialist]
    code: 200
    input: [recommendation_text, "disposition?"]
    output: ConsultResponse
    side_effects: ["status REBUKED -> SUBMITTED", "revision_count += 1", "documentation flags reset", "new PROVISIONAL RESPONSE_FEE entry"]

  # --- Quality reviews ---
  - method: POST
    path: "/econsult/quality-reviews"
    description: "Open a quality review on a SUBMITTED response (reviewer must differ from responder)"
    roles: [QualityReviewer]
    code: 201
    input: [response_id]
    output: QualityReview
