      - name: lot_catalog_requires_estate_cataloging
        grounds:
          - state_machines.Lot.DRAFT_to_CATALOGED
          - validations[priority=6]
          - errors[ERR_ESTATE_NOT_CATALOGING]
          - entities.Estate.fields.status
        distinguishing_aspect: |
          A Lot transition depends on the Estate entity's state: DRAFT->CATALOGED
          requires Estate.status == CATALOGING. After the estate is opened (LIVE),
          a still-DRAFT lot's catalog PATCH is rejected with
          ERR_ESTATE_NOT_CATALOGING. Pair: Lot -> Estate.
        test_recipe:
          setup:
            - "Estate with L1 (photo, cataloged, listed) so it can be opened, and L2 left in DRAFT (photographed)."
            - "Estate opened -> LIVE (L1->SELLING, L2 stays DRAFT)."
