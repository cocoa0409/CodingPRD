  - rule_id: priority_pair_validation_conflict
    instances:
      - name: referral_state_409_outranks_sedation_credential_422_on_booking
        grounds:
          - validations.priority_8_state
          - validations.priority_10_ERR_SEDATION_CREDENTIAL_INVALID
          - errors.ERR_REFERRAL_NOT_TRIAGED
          - errors.ERR_SEDATION_CREDENTIAL_INVALID
        distinguishing_aspect: |
          One POST /procedures call violates priority 8 (referral is INFO_REQUESTED, not TRIAGED)
          and priority 10 (the named sedation RN's credential lapsed on 2026-07-31) at the same
          time. The scaffold requires the 409 ERR_REFERRAL_NOT_TRIAGED, i.e. the state class wins
          over the safety class - a plausible implementation that validates people before paperwork
          would surface the 422 instead. The pair is falsifiable in both directions because
          repairing only the referral state re-issues the identical body and then yields the 422.
        test_recipe:
          setup:
            - "one facility, one patient, one IN_USE AVG access with a single 2026-07-28 reading"
            - "one referral moved to INFO_REQUESTED by a coordinator info request"
            - "one SEDATION_RN whose credential_expires_on is 2026-07-31, i.e. lapsed against the default 2026-08-01 clock, but who is still moderate_sedation_credentialed"
