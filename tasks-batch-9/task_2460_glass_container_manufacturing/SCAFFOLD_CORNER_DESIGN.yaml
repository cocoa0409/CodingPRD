          rationale: "The named §1.8 instance pins the instantaneous refractory threshold exactly at 5.00 percent, and resource_temporal_overlap / color_change_closed_intervals_and_rolling_thirty_day_cap_on_furnace pins the cumulative rolling-window rate at its cap."

