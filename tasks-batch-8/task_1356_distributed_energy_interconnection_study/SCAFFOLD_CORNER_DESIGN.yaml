scaffold_corner_design:
  - section: entities
    instances:
      - name: developer_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Developer.fields.legal_name", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required input legal_name yields ERR_INVALID_REQUEST (400) and no Developer is persisted."
        test_recipe:
          setup: ["Empty system"]
          setup_api_calls: []
          trigger:
            - call: "POST /interconnection/developers"
              payload: { contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"

      - name: developer_create_applies_system_fields
        claim_type: creation
        grounds: ["entities.Developer"]
        distinguishing_aspect: "A well-formed POST /developers returns 201 with server-minted id, version 1, and created_at populated; input fields echoed."
        test_recipe:
          setup: ["Empty system"]
          setup_api_calls: []
          trigger:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id, dev_version: $.data.version }
          assert:
            - "HTTP 201; ${dev_id} is a server-minted UUID"
            - "${dev_version} == 1 and created_at/updated_at are present ISO8601 timestamps"
            - "data.legal_name == 'Acme Renewables LLC' and data.developer_type == IPP"

      - name: project_computed_field_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Project.fields.deposit_required_cents", "entities.Project.fields.queue_position", "entities.Project.fields.status"]
        distinguishing_aspect: "Client-supplied values for computed/system fields (deposit_required_cents, queue_position, status) are ignored; the server computes its own."
        test_recipe:
          setup: ["Developer onboarded; FORMING cluster capacity 200"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1", deposit_required_cents: 1, queue_position: 99, status: "QUEUED" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p_id: $.data.id }
          assert:
            - "HTTP 201; Project.${p_id}.deposit_required_cents == 1000000 (computed, not the supplied 1)"
            - "Project.${p_id}.queue_position == null and Project.${p_id}.status == SUBMITTED (supplied QUEUED ignored)"

      - name: project_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_PROJECT_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent project UUID returns 404 ERR_PROJECT_NOT_FOUND."
        test_recipe:
          setup: ["Empty system"]
          setup_api_calls: []
          trigger:
            - call: "GET /interconnection/projects/00000000-0000-0000-0000-000000000000"
              as: QueueAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_PROJECT_NOT_FOUND (HTTP 404)"

      - name: cluster_group_defaults_at_creation
        claim_type: defaults
        grounds: ["entities.ClusterGroup.fields.committed_mw", "entities.ClusterGroup.fields.status"]
        distinguishing_aspect: "A new ClusterGroup starts with committed_mw 0, status FORMING, version 1."
        test_recipe:
          setup: ["Empty system"]
          setup_api_calls: []
          trigger:
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id, committed: $.data.committed_mw, status: $.data.status, ver: $.data.version }
          assert:
            - "${committed} == 0 and ${status} == FORMING and ${ver} == 1"

      - name: deposit_ledger_immutable_and_running_balance
        claim_type: immutability
        grounds: ["entities.DepositTransaction", "entities.DepositTransaction.fields.balance_after_cents"]
        distinguishing_aspect: "DepositTransaction is append-only (common_fields false: no updated_at/version on reads) and balance_after_cents tracks the running ledger (600000 then 1000000)."
        test_recipe:
          setup: ["Developer; FORMING cluster; project P1 10 MW SOLAR (required 1000000)"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 600000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { bal1: $.data.balance_after_cents, tx1_type: $.data.tx_type }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 400000 }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { bal2: $.data.balance_after_cents }
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { p_status: $.data.status, p_pos: $.data.queue_position }
          assert:
            - "${tx1_type} == DEPOSIT and ${bal1} == 600000 and ${bal2} == 1000000"
            - "Deposit responses carry id and created_at but no updated_at or version (append-only, common_fields false)"
            - "${p_status} == QUEUED and ${p_pos} == 1 after the threshold is reached"

      - name: cluster_projects_pagination_interaction
        claim_type: listing
        grounds: ["endpoints.GET /interconnection/cluster-groups/{id}/projects", "response_envelope.pagination_defaults"]
        distinguishing_aspect: "limit/offset/total_count/has_more interact correctly: 3 member projects with limit 2 yields has_more true then false at offset 2."
        test_recipe:
          setup: ["Developer; FORMING cluster capacity 200"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 5, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P2", technology: "SOLAR", capacity_mw: 5, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-2" }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P3", technology: "SOLAR", capacity_mw: 5, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-3" }
              as: Developer
              as_user_id: "${dev_id}"
          trigger:
            - call: "GET /interconnection/cluster-groups/${cg_id}/projects"
              payload: { limit: 2, offset: 0 }
              as: QueueAdministrator
            - call: "GET /interconnection/cluster-groups/${cg_id}/projects"
              payload: { limit: 2, offset: 2 }
              as: QueueAdministrator
          assert:
            - "First page: data has 2 items, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second page: data has 1 item, total_count == 3, has_more == false, offset == 2"

  - section: state_machines
    instances:
      - name: project_initial_state_submitted
        claim_type: initial_state
        grounds: ["state_machines.Project"]
        distinguishing_aspect: "A new Project starts in SUBMITTED with queue_position null, deposit_posted_cents 0, readiness_satisfied false."
        test_recipe:
          setup: ["Developer; FORMING cluster"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { status: $.data.status, pos: $.data.queue_position, posted: $.data.deposit_posted_cents, ready: $.data.readiness_satisfied }
          assert:
            - "${status} == SUBMITTED and ${pos} == null and ${posted} == 0 and ${ready} == false"

      - name: deposit_exact_threshold_promotes_to_queued
        claim_type: side_effect_execution
        grounds: ["state_machines.Project.SUBMITTED_to_QUEUED", "calculations.deposit_assessment"]
        distinguishing_aspect: "Cumulative posted 999999 leaves the project SUBMITTED; one more cent reaches exactly deposit_required_cents and promotes it to QUEUED with queue_position 1 (>= boundary)."
        test_recipe:
          setup: ["Developer; FORMING cluster; project P1 10 MW SOLAR (required 1000000)"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 999999 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { st_mid: $.data.status }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 1 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { st_end: $.data.status, pos_end: $.data.queue_position }
          assert:
            - "${st_mid} == SUBMITTED (999999 < 1000000)"
            - "${st_end} == QUEUED and ${pos_end} == 1 (1000000 >= 1000000 is inclusive)"

      - name: withdraw_from_commercial_operation_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Project", "errors[ERR_PROJECT_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "COMMERCIAL_OPERATION is terminal for withdrawal: POST /projects/{id}/withdraw is rejected and nothing mutates."
        test_recipe:
          setup:
            - "P1 (10 MW SOLAR) in COMMERCIAL_OPERATION: READY -> study -> publish -> finalize -> agreement issued and executed -> commercial operation declared at the default clock (2026-08-01 <= target_cod 2027-06-01)"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/p1-site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_m1: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "TECHNICAL_DATA", evidence_uri: "s3://ev/p1-tech.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_m2: $.data.id }
            - call: "POST /interconnection/milestone-submissions/${p1_m1}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/milestone-submissions/${p1_m2}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/cluster-groups/${cg_id}/studies"
              payload: { total_cost_cents: 1000000 }
              as: StudyEngineer
              captures: { s_id: $.data.id }
            - call: "POST /interconnection/studies/${s_id}/publish-results"
              as: StudyEngineer
            - call: "POST /interconnection/studies/${s_id}/finalize"
              as: StudyEngineer
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { p1_v: $.data.version }
            - call: "POST /interconnection/projects/${p1_id}/agreements"
              payload: { target_cod: "2027-06-01T00:00:00Z", max_injection_mw: 10, curtailment_hours_cap: 0, expected_project_version: "${p1_v}" }
              as: QueueAdministrator
              captures: { ag_id: $.data.id }
            - call: "POST /interconnection/agreements/${ag_id}/execute"
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p1_id}/declare-commercial-operation"
              as: Developer
              as_user_id: "${dev_id}"
          trigger:
            - call: "POST /interconnection/projects/${p1_id}/withdraw"
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err: $.data.error_id }
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { status: $.data.status, posted: $.data.deposit_posted_cents }
          assert:
            - "${err} == ERR_PROJECT_NOT_WITHDRAWABLE"
            - "${status} == COMMERCIAL_OPERATION and ${posted} == 1000000 (no forfeiture ran)"

      - name: double_withdraw_rejected
        claim_type: idempotency
        grounds: ["state_machines.Project", "errors[ERR_PROJECT_NOT_WITHDRAWABLE]"]
        distinguishing_aspect: "Withdrawing an already WITHDRAWN project is rejected with ERR_PROJECT_NOT_WITHDRAWABLE; the ledger is unchanged."
        test_recipe:
          setup: ["Developer; FORMING cluster; P1 10 MW QUEUED (1000000 posted)"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p1_id}/withdraw"
              as: Developer
              as_user_id: "${dev_id}"
          trigger:
            - call: "POST /interconnection/projects/${p1_id}/withdraw"
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err: $.data.error_id }
            - call: "GET /interconnection/projects/${p1_id}/deposits"
              as: QueueAdministrator
          assert:
            - "${err} == ERR_PROJECT_NOT_WITHDRAWABLE"
            - "Deposit ledger still has exactly 3 entries (DEPOSIT 1000000, FORFEIT 100000, REFUND 900000) — the failed second withdrawal added nothing"

      - name: execute_expired_agreement_returns_not_issued
        claim_type: invalid_transition
        grounds: ["state_machines.InterconnectionAgreement", "errors[ERR_AGREEMENT_NOT_ISSUED]"]
        distinguishing_aspect: "EXPIRED is terminal: a second execute attempt on an expired agreement fails with ERR_AGREEMENT_NOT_ISSUED (not the deadline error again)."
        test_recipe:
          setup:
            - "P1 (10 MW) STUDY_COMPLETE under a FINALIZED study; agreement issued at the default clock (deadline 2026-10-30T00:00:00Z); clock advanced past the deadline and one execute attempt already expired the agreement"
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
              payload: { developer_id: "${dev_id}", cluster_group_id: "${cg_id}", project_name: "P1", technology: "SOLAR", capacity_mw: 10, service_type: "ENERGY_ONLY", point_of_interconnection: "SUB-1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/deposits"
              payload: { amount_cents: 1000000 }
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "SITE_CONTROL", evidence_uri: "s3://ev/p1-site.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_m1: $.data.id }
            - call: "POST /interconnection/projects/${p1_id}/milestone-submissions"
              payload: { milestone_type: "TECHNICAL_DATA", evidence_uri: "s3://ev/p1-tech.pdf" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { p1_m2: $.data.id }
            - call: "POST /interconnection/milestone-submissions/${p1_m1}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/milestone-submissions/${p1_m2}/review"
              payload: { decision: "ACCEPTED" }
              as: QueueAdministrator
            - call: "POST /interconnection/cluster-groups/${cg_id}/studies"
              payload: { total_cost_cents: 1000000 }
              as: StudyEngineer
              captures: { s_id: $.data.id }
            - call: "POST /interconnection/studies/${s_id}/publish-results"
              as: StudyEngineer
            - call: "POST /interconnection/studies/${s_id}/finalize"
              as: StudyEngineer
            - call: "GET /interconnection/projects/${p1_id}"
              as: QueueAdministrator
              captures: { p1_v: $.data.version }
            - call: "POST /interconnection/projects/${p1_id}/agreements"
              payload: { target_cod: "2027-06-01T00:00:00Z", max_injection_mw: 10, curtailment_hours_cap: 0, expected_project_version: "${p1_v}" }
              as: QueueAdministrator
              captures: { ag_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: QueueAdministrator
            - call: "POST /interconnection/agreements/${ag_id}/execute"
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err_first: $.data.error_id }
          trigger:
            - call: "POST /interconnection/agreements/${ag_id}/execute"
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err_first} == ERR_AGREEMENT_EXECUTION_DEADLINE_PASSED (expiry materialized)"
            - "${err} == ERR_AGREEMENT_NOT_ISSUED (EXPIRED is terminal for execute)"

      - name: milestone_review_after_accept_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.MilestoneSubmission", "errors[ERR_MILESTONE_NOT_PENDING_REVIEW]"]
        distinguishing_aspect: "Reviewing an already-ACCEPTED submission fails with ERR_MILESTONE_NOT_PENDING_REVIEW."
        test_recipe:
          setup: ["QUEUED project with one SITE_CONTROL submission already ACCEPTED"]
          setup_api_calls:
            - call: "POST /interconnection/developers"
              payload: { legal_name: "Acme Renewables LLC", contact_email: "queue@acme.example", developer_type: "IPP" }
              as: QueueAdministrator
              captures: { dev_id: $.data.id }
            - call: "POST /interconnection/cluster-groups"
              payload: { name: "Cluster 2026-A", region: "WEST", application_window_open: "2026-08-01T00:00:00Z", application_window_close: "2026-09-01T00:00:00Z", capacity_mw: 200 }
              as: QueueAdministrator
              captures: { cg_id: $.data.id }
            - call: "POST /interconnection/projects"
