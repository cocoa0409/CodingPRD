            - "After confirm: Patient.${pid}.account_balance_cents == 2650"
            - "After cancel-of-confirmed: Patient.${pid}.account_balance_cents == 0 (money conserved: balance_after == balance_before_confirm)"

      - name: session_book_cancel_conserves_station_cell_occupancy
        grounds:
          - state_machines.TreatmentSession.BOOKED_to_CANCELLED
          - validations[priority=12]
          - entities.TreatmentSession.fields.station_id
          - entities.TreatmentSession.fields.shift_id
        distinguishing_aspect: "Conserved quantity = STATION-CELL OCCUPANCY COUNT (a different conserved quantity than money): booking occupies (station,shift,date) then cancel releases it, so the occupancy count returns to 0 — provable because re-booking the identical cell after the cancel succeeds (no ERR_STATION_DOUBLE_BOOKED)."
        test_recipe:
          setup:
            - "A BOOKED session occupying (station,shift,2026-06-01); then it is CANCELLED; a fresh booking of the SAME cell must succeed."
          setup_api_calls:
            - call: "POST /clinics"
