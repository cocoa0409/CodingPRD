        as: GovernanceManager
      trigger:
      - call: POST /api/discipline-audits/${A1}/reviews
        payload:
          reviewer_name: Rae Auditor
          round_notes: Round one
        as: GovernanceManager
        captures:
          e1: $.data.error_id
          v2: $.data.version
      assert:
      - ${e1} == ERR_STALE_VERSION
  - name: fresh_account_version_on_audit_review_succeeds
    claim_type: occ_success
    grounds:
    - concurrency_rules[kpi-recompute-stale-account]
    - entities.AuditReview.fields.review_round_no
    distinguishing_aspect: Re-reading the account version after the scorecard publication lets the audit review succeed and the first round is numbered 1.
    test_recipe:
      setup:
      - PortfolioAccount ACTIVE
      - Scorecard SC1 DRAFT
