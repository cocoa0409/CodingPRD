# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over every other testable claim §1.1-§1.7 declares. Same gates as
# §1.8: setup_api_calls reachability, literal lock, §1.5 priority ladder.
scaffold_corner_design:

  - section: entities
    instances:
      - name: land_manager_creation_applies_declared_defaults_and_system_fields
        claim_type: defaults
        grounds:
          - entities.LandManager
          - entities.LandManager.fields.permit_lead_days
          - entities.LandManager.fields.policy_version
          - endpoints["POST /stewardship/land-managers"]
        distinguishing_aspect: |
          Only the two required inputs are supplied; every optional field must fall back to its
          declared §1.1 default and the system fields must be minted server-side.
        test_recipe:
          setup:
            - "Empty database; the logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Coast Range State Park", jurisdiction_code: "ORSP-COAST" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id, lm_v: $.data.version }
          trigger:
            - call: "GET /stewardship/land-managers/${lm_id}"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { pr: $.data.permit_required, pld: $.data.permit_lead_days, mps: $.data.max_party_size, wti: $.data.wet_threshold_index, rer: $.data.requires_engineering_review, rcs: $.data.requires_certified_sawyer, pv: $.data.policy_version, asc: $.data.adopted_segment_count }
          assert:
            - "${pr} == true and ${pld} == 14 and ${mps} == 20"
            - "${wti} == 0.65"
            - "${rer} == false and ${rcs} == true"
            - "${pv} == 1 and ${asc} == 0"
            - "${lm_v} == 1"
            - "LandManager.${lm_id}.id is a bare 36-character UUID with no type prefix"
            - "LandManager.${lm_id}.created_at is ISO 8601 UTC with three fractional digits"
      - name: volunteer_skill_class_and_waiver_expiry_are_computed
        claim_type: computed_fields
        grounds:
          - entities.VolunteerProfile.fields.skill_class
          - entities.VolunteerProfile.fields.waiver_expires_on
          - calculations.grant_match_value_usd
        distinguishing_aspect: |
          skill_class is derived from certifications with precedence PROFESSIONAL >
          CERTIFIED_SAWYER > SKILLED_TRAIL > GENERAL, and waiver_expires_on is waiver_signed_on plus
          exactly 365 days; neither is ever supplied by the client.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Petra Novak", email: "petra@example.org", waiver_signed_on: "2026-07-01", certifications: [] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { g_id: $.data.id, g_class: $.data.skill_class, g_exp: $.data.waiver_expires_on }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Tomas Reyes", email: "tomas@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_TRAIL_SKILLS"] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { t_class: $.data.skill_class }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Milo Okonkwo", email: "milo@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_SAWYER_B", "CERT_TRAIL_SKILLS"] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { s_class: $.data.skill_class }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Inez Vogel", email: "inez@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_ENGINEER", "CERT_SAWYER_C", "CERT_TRAIL_SKILLS"] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { p_class: $.data.skill_class }
          trigger:
            - call: "GET /stewardship/volunteers/${g_id}"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { g_life: $.data.lifetime_credited_hours, g_pend: $.data.pending_hours, g_ver: $.data.verified_hours, g_cert: $.data.certified_hours, g_arc: $.data.active_registration_count }
          assert:
            - "${g_class} == GENERAL"
            - "${t_class} == SKILLED_TRAIL"
            - "${s_class} == CERTIFIED_SAWYER"
            - "${p_class} == PROFESSIONAL"
            - "${g_exp} == 2027-07-01"
            - "${g_life} == 0 and ${g_pend} == 0 and ${g_ver} == 0 and ${g_cert} == 0 and ${g_arc} == 0"
      - name: trail_segment_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - entities.TrailSegment
          - errors[ERR_TRAIL_SEGMENT_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: |
          A syntactically valid but unknown UUID on GET /stewardship/trail-segments/{id} returns
          HTTP 404 with error_id ERR_TRAIL_SEGMENT_NOT_FOUND in the error envelope.
        test_recipe:
          setup:
            - "Empty database apart from one land manager."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
          trigger:
            - call: "GET /stewardship/trail-segments/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { nf_error: $.data.error_id, nf_msg: $.data.message }
          assert:
            - "HTTP status is 404"
            - "${nf_error} == ERR_TRAIL_SEGMENT_NOT_FOUND"
            - "${nf_msg} is a non-empty string"
            - "The response envelope carries response_type equal to the string error and a meta block with api_request_id and api_request_timestamp"
      - name: work_plan_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints["POST /stewardship/work-plans"]
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          requested_budget_cents carries no default in §1.1, so omitting it from
          POST /stewardship/work-plans must return HTTP 400 ERR_INVALID_REQUEST and create nothing.
        test_recipe:
          setup:
            - "An ACTIVE adoption on Alder Creek."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Rae Lindqvist", email: "rae@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_CREW_LEADER", "CERT_TRAIL_SKILLS", "CERT_FIRST_AID"], first_aid_expires_on: "2027-06-30" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lead_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
            - call: "POST /stewardship/adoption-agreements"
              payload: { trail_segment_id: "${seg_id}", crew_leader_volunteer_id: "${lead_id}", term_start_date: "2026-08-01", term_end_date: "2027-07-31" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { aa_id: $.data.id }
            - call: "POST /stewardship/adoption-agreements/${aa_id}/submit"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/adoption-agreements/${aa_id}/review"
              payload: { decision: "APPROVE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
            - call: "POST /stewardship/adoption-agreements/${aa_id}/activate"
              payload: {}
              as: LandManagerOfficer
              as_user_id: "${lm_id}"
          trigger:
            - call: "POST /stewardship/work-plans"
              payload: { adoption_agreement_id: "${aa_id}", season_year: 2026 }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { bad_error: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${bad_error} == ERR_INVALID_REQUEST"
            - "GET /stewardship/work-plans filtered by adoption_agreement_id returns total_count == 0"
      - name: condition_report_rejects_undeclared_severity_enum_member
        claim_type: type_constraints
        grounds:
          - entities.ConditionReport.fields.severity_class
          - validations[priority=6]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          severity_class is constrained to {LOW, MODERATE, HIGH, CRITICAL}; the undeclared member
          CATASTROPHIC must be refused with HTTP 400 before any state or business rule runs.
        test_recipe:
          setup:
            - "One land manager, one volunteer and the Alder Creek segment."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Petra Novak", email: "petra@example.org", waiver_signed_on: "2026-07-01", certifications: [] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { gen_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
          trigger:
            - call: "POST /stewardship/condition-reports"
              payload: { trail_segment_id: "${seg_id}", reported_by_volunteer_id: "${gen_id}", hazard_type: "BLOWDOWN", severity_class: "CATASTROPHIC", description: "Large fir across the tread." }
              as: Volunteer
              as_user_id: "${gen_id}"
              captures: { enum_error: $.data.error_id }
          assert:
            - "HTTP status is 400"
            - "${enum_error} == ERR_INVALID_REQUEST"
            - "GET /stewardship/condition-reports filtered by trail_segment_id returns total_count == 0"
      - name: adoption_agreement_creation_with_unknown_segment_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.AdoptionAgreement.fields.trail_segment_id
          - validations[priority=7]
          - errors[ERR_TRAIL_SEGMENT_NOT_FOUND]
        distinguishing_aspect: |
          Body foreign keys are resolved in the field order declared on the entity, so an unknown
          trail_segment_id is reported as ERR_TRAIL_SEGMENT_NOT_FOUND even though
          crew_leader_volunteer_id is also present and valid.
        test_recipe:
          setup:
            - "One land manager and the crew-leader volunteer Rae; no trail segment created."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Rae Lindqvist", email: "rae@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_CREW_LEADER", "CERT_TRAIL_SKILLS", "CERT_FIRST_AID"], first_aid_expires_on: "2027-06-30" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lead_id: $.data.id }
          trigger:
            - call: "POST /stewardship/adoption-agreements"
              payload: { trail_segment_id: "00000000-0000-4000-8000-000000000001", crew_leader_volunteer_id: "${lead_id}", term_start_date: "2026-08-01", term_end_date: "2027-07-31" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { fk_error: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "${fk_error} == ERR_TRAIL_SEGMENT_NOT_FOUND"
      - name: trail_segment_list_filters_by_land_manager_and_paginates
        claim_type: listing
        grounds:
          - endpoints["GET /stewardship/trail-segments"]
          - response_envelope.pagination_fields
          - entities.TrailSegment.fields.land_manager_id
        distinguishing_aspect: |
          The filtered-list form that gives TrailSegment.land_manager_id its reverse reachability
          must honour limit/offset and report total_count and has_more over the FILTERED set.
        test_recipe:
          setup:
            - "Two land managers; three segments under the first and one under the second."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Coast Range State Park", jurisdiction_code: "ORSP-COAST" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm2_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { s1_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Bear Hollow", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { s2_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Cedar Bench", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { s3_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm2_id}", name: "Dune Loop", length_miles: 1.5, surface_class: "GRAVEL", traffic_class: "LIGHT" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { s4_id: $.data.id }
          trigger:
            - call: "GET /stewardship/trail-segments?land_manager_id=${lm_id}&limit=2&offset=0"
              payload: { land_manager_id: "${lm_id}", limit: 2, offset: 0 }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { page1_first: "$.data[0].id" }
          assert:
            - "The response is an array of 2 TrailSegment objects"
            - "meta/pagination reports total_count == 3 and has_more == true"
            - "Every returned segment has land_manager_id == ${lm_id}; ${s4_id} never appears"
            - "Requesting limit=200 returns HTTP 400 ERR_INVALID_REQUEST"

  - section: state_machines
    instances:
      - name: adoption_agreement_starts_in_draft_and_cannot_be_activated_directly
        claim_type: initial_state
        grounds:
          - state_machines.AdoptionAgreement.initial_state
          - state_machines.AdoptionAgreement.APPROVED_to_ACTIVE
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          A freshly created agreement is DRAFT with revision_round 0 and pinned_policy_version
          null; activating it before the submit/review steps is not a declared transition and must
          return HTTP 409 ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "One land manager, the crew-leader volunteer Rae and the Alder Creek segment."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Rae Lindqvist", email: "rae@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_CREW_LEADER", "CERT_TRAIL_SKILLS", "CERT_FIRST_AID"], first_aid_expires_on: "2027-06-30" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lead_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
            - call: "POST /stewardship/adoption-agreements"
              payload: { trail_segment_id: "${seg_id}", crew_leader_volunteer_id: "${lead_id}", term_start_date: "2026-08-01", term_end_date: "2027-07-31" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { aa_id: $.data.id, aa_status: $.data.status, aa_round: $.data.revision_round, aa_pin: $.data.pinned_policy_version }
          trigger:
            - call: "POST /stewardship/adoption-agreements/${aa_id}/activate"
              payload: {}
              as: LandManagerOfficer
              as_user_id: "${lm_id}"
              captures: { st_error: $.data.error_id }
          assert:
            - "${aa_status} == DRAFT and ${aa_round} == 0 and ${aa_pin} == null"
            - "HTTP status is 409 and ${st_error} == ERR_INVALID_STATE"
            - "AdoptionAgreement.${aa_id}.status == DRAFT"
            - "TrailSegment.${seg_id}.adoption_status == UNADOPTED"
      - name: revoked_permit_cannot_be_revoked_again_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.WorkPermit.terminal_states
          - state_machines.WorkPermit.ISSUED_to_REVOKED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          REVOKED is a terminal state of the WorkPermit machine: a second revoke must be refused
          with HTTP 409 ERR_INVALID_STATE and must not re-run the party-blocking side effects.
        test_recipe:
          setup:
            - "An ACTIVE adoption with an APPROVED plan and an ISSUED permit for September 2026, revoked once."
          setup_api_calls:
            - call: "POST /stewardship/land-managers"
              payload: { agency_name: "Cascade National Forest", jurisdiction_code: "USFS-R6-ALDER", permit_required: true, permit_lead_days: 14, max_party_size: 20, wet_threshold_index: 0.65, requires_engineering_review: true, requires_certified_sawyer: true }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lm_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Rae Lindqvist", email: "rae@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_CREW_LEADER", "CERT_TRAIL_SKILLS", "CERT_FIRST_AID"], first_aid_expires_on: "2027-06-30" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { lead_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Milo Okonkwo", email: "milo@example.org", waiver_signed_on: "2026-07-01", certifications: ["CERT_SAWYER_B", "CERT_FIRST_AID"], first_aid_expires_on: "2027-06-30" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { saw_id: $.data.id }
            - call: "POST /stewardship/volunteers"
              payload: { full_name: "Petra Novak", email: "petra@example.org", waiver_signed_on: "2026-07-01", certifications: [] }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { gen_id: $.data.id }
            - call: "POST /stewardship/trail-segments"
              payload: { land_manager_id: "${lm_id}", name: "Alder Creek", length_miles: 4.2, surface_class: "NATIVE_SOIL", traffic_class: "MODERATE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { seg_id: $.data.id }
            - call: "POST /stewardship/adoption-agreements"
              payload: { trail_segment_id: "${seg_id}", crew_leader_volunteer_id: "${lead_id}", term_start_date: "2026-08-01", term_end_date: "2027-07-31" }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { aa_id: $.data.id }
            - call: "POST /stewardship/adoption-agreements/${aa_id}/submit"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/adoption-agreements/${aa_id}/review"
              payload: { decision: "APPROVE" }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
            - call: "POST /stewardship/adoption-agreements/${aa_id}/activate"
              payload: {}
              as: LandManagerOfficer
              as_user_id: "${lm_id}"
            - call: "POST /stewardship/work-plans"
              payload: { adoption_agreement_id: "${aa_id}", season_year: 2026, requested_budget_cents: 250000 }
              as: CrewLeader
              as_user_id: "${lead_id}"
              captures: { wp_id: $.data.id }
            - call: "POST /stewardship/work-plans/${wp_id}/submit"
              payload: {}
              as: CrewLeader
              as_user_id: "${lead_id}"
            - call: "POST /stewardship/work-plans/${wp_id}/review"
              payload: { decision: "APPROVE", approved_budget_cents: 250000 }
              as: StewardshipCoordinator
              as_user_id: "coord-1"
              captures: { wp_id_v0: $.data.version }
            - call: "POST /stewardship/work-permits"
              payload: { work_plan_id: "${wp_id}", trail_segment_id: "${seg_id}", window_start_date: "2026-09-01", window_end_date: "2026-09-30", requested_work_types: ["TREAD_WORK", "CHAINSAW", "SIGNAGE", "BRUSHING", "DRY_WORK", "BRIDGE_CONSTRUCTION"] }
              as: CrewLeader
              as_user_id: "${lead_id}"
