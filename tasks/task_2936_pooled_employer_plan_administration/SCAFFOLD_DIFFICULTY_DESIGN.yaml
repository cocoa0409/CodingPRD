      - name: election_submitted_returned_resubmitted_then_replaced_cycle
        grounds:
          - state_machines.PlanDesignElection.SUBMITTED_to_RETURNED
          - state_machines.PlanDesignElection.RETURNED_to_SUBMITTED
          - state_machines.PlanDesignElection.SUBMITTED_to_SUPERSEDED
          - state_machines.AdoptingEmployer.ELECTIONS_SUBMITTED_to_RETURNED_FOR_REVISION
          - entities.PlanDesignElection.fields.election_sequence
        distinguishing_aspect: |
          A backward edge and a sideways edge in the same walk: the election loops
          SUBMITTED -> RETURNED -> SUBMITTED (clearing return_reason and deficiency_code on
          the way back, and dragging the employer ELECTIONS_SUBMITTED -> RETURNED_FOR_REVISION
          -> ELECTIONS_SUBMITTED with it), and then a *replacement* election created for the
          same employer supersedes the still-SUBMITTED first election and rewinds the employer
          all the way to APPLIED. election_sequence advances only on the replacement (to 2),
          never on the resubmission, so the loop is observably distinct from the branch.
        test_recipe:
          setup:
            - "Provider REGISTERED, plan 001 ACTIVE with acknowledged 3(16) and 403(a) allocations."
            - "One APPLIED employer with a DRAFT election submitted once."
