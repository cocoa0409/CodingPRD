            - call: "POST /finished-units/${fuf1}/trim"
              payload: { trim_waste_kg: 0.400 }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fuf1}/outfit"
              payload: { hardware_kit_serial: "HK-CD-0011" }
              as: AssemblyTechnician
              as_user_id: "${t_asm}"
            - call: "POST /finished-units/${fuf1}/inspect"
              payload: { wall_thickness_points: [5.90, 6.00, 6.10, 5.95, 6.05, 6.00], impact_test_joules: 120.00, cosmetic_defect_grade: "A" }
              as: QualityInspector
              as_user_id: "${t_qc}"
            - call: "GET /warehouses/${whf}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { whf_v1: $.data.version }
            - call: "POST /finished-units/${fuf1}/store"
              payload: { expected_warehouse_version: "${whf_v1}" }
