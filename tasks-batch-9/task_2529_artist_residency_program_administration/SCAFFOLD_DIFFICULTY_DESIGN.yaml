              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { saC: "$.data.id" }
          assert:
            - "pre-state: S-02 max_concurrent_residents == 2; assignment A ACTIVE 2026-11-02 .. 2026-12-27 with occupied_days == 56; assignment B ACTIVE 2026-11-10 .. 2026-11-20 with occupied_days == 11; Studio.reserved_resident_days == 67 and active_assignment_count == 2"
            - "B's booking SUCCEEDED even though it sits entirely inside A's window - on a shared studio P46 is exempt by its own scoping clause, so overlap alone is never the error"
            - "the FIRST trigger (2026-11-15 .. 2026-11-18) returns 409 with error_id == 'ERR_STUDIO_CAPACITY_EXCEEDED': on each of 11-15, 11-16, 11-17 and 11-18 the ACTIVE census is 2 (A and B) and 2 + 1 == 3 > max_concurrent_residents 2"
            - "the error is AGGREGATE, not pairwise: C-vs-A alone is 2 concurrent and legal, C-vs-B alone is 2 concurrent and legal; only the three together exceed the headcount, so a pairwise-overlap implementation reports success here"
            - "the response is NOT 'ERR_STUDIO_INTERVAL_CONFLICT' - the interval rule and the headcount rule are scoped to disjoint studio populations (max_concurrent_residents == 1 vs > 1) and can never both fire on one studio"
            - "the SECOND trigger (2026-12-01 .. 2026-12-10) returns 201: those dates are covered by A only, so the census is 1 and 1 + 1 == 2 <= 2"
            - "the accepted assignment has occupied_days == 10 and afterwards Studio.reserved_resident_days == 77 (56 + 11 + 10) and active_assignment_count == 3 - MORE rows than max_concurrent_residents, which is legal because the limit is per DAY"
            - "boundary sharpness on the census: had C asked for 2026-11-21 .. 2026-12-10 (starting the day after B ends) the request would succeed, and 2026-11-20 .. 2026-12-10 would fail on the single shared day of 11-20"
            - "no turnaround buffer participates on the shared path: 2026-11-21 is bookable immediately after B's 2026-11-20, unlike the single-occupancy studio of instance 1 where two clear days are required"
            - "the same ${resC_v} token serves both attempts because the rejected first call does not bump Residency.version"

  # ===================================================================================
  # RULE 9 - compensating_invariant
  # Differentiation: three DIFFERENT conserved quantities, each pinned as an explicit formula.
  #   1. CYCLE MONEY + SLOTS
  #        stipend_committed_cents == SUM(r.stipend_total_cents WHERE r.status IN
  #            {SCHEDULED, IN_RESIDENCE, COMPLETED, TERMINATED})
  #        stipend_committed_cents + stipend_uncommitted_cents == stipend_pool_cents  (always)
  #   2. STUDIO-DAYS
  #        Studio.reserved_resident_days == SUM(a.occupied_days WHERE a.status == ACTIVE)
  #        Studio.active_assignment_count == COUNT(a WHERE a.status == ACTIVE)
  #   3. PAIRED MONEY + TAX LEDGERS
  #        Residency.stipend_paid_gross_cents  == SUM(d.gross_cents       WHERE d.status == PAID)
  #        Residency.withholding_to_date_cents == SUM(d.withholding_cents WHERE d.status == PAID)
  # ===================================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cycle_money_and_slot_ledgers_return_to_pre_award_values_after_withdrawal
        grounds: "§1.2 Residency SCHEDULED -> WITHDRAWN side effect 'compensation of Application OFFERED -> ACCEPTED: Cycle.stipend_committed_cents is reduced by the residency's full stipend_total_cents, restoring Cycle.stipend_committed_cents to its exact pre-acceptance value'; §1.3 calculations.cycle_stipend_ledger ('WITHDRAWN residencies leave both the money ledger and the slot ledger entirely')"
        distinguishing_aspect: |
          Conserved quantities: CYCLE MONEY (integer cents) and CYCLE SLOTS (integer counts), pinned as
              stipend_committed_cents   == SUM(r.stipend_total_cents
                                               WHERE r.cycle_id == C AND r.status IN
                                               {SCHEDULED, IN_RESIDENCE, COMPLETED, TERMINATED})
              stipend_uncommitted_cents == stipend_pool_cents - stipend_committed_cents
              slots_filled_count        == COUNT(same predicate)
              slots_open_count          == max(0, cohort_target_size - slots_filled_count)
          WITHDRAWN is excluded from the predicate, so a withdrawal must land the ledger back on the
          byte-exact figure it held before the residency existed - not merely "close". The
          withdrawal also fans out to five other ledgers (disbursements, obligations, studio-days,
          bed-nights, visa case) and every one of them must unwind, which is what separates a true
          compensation from a status flag flip. The invariant
          committed + uncommitted == stipend_pool_cents is asserted at all three snapshots.
        test_recipe:
          setup: |
            CHAIN-SHORT: one cycle with stipend_pool_cents 20000000, cohort_target_size 10 and
            stipend_weekly_rate_cents 70000. Baseline ledgers are read FIRST, before any residency
            exists. Then an invited 8-week SCULPT residency is created for a FRENCH applicant (so a
            VisaCase is created too), scheduled 2026-11-02 .. 2026-12-27, given a 4-period stipend
            schedule, a studio for the whole session on single-occupancy S-01, a bed for the whole
            session on 1-bed H-01, and its visa case walked to DOCS_SUBMITTED. Nothing is paid and
            nothing is completed, so the residency is still SCHEDULED and WITHDRAW is legal. The
            applicant then withdraws.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-05-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "GET /cycles/${cyc}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { base_committed: "$.data.stipend_committed_cents", base_slots: "$.data.slots_filled_count" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Camille Roux", email: "camille.roux@example.org",
                         affiliation_org: "Atelier Sud", citizenship_country: "FR",
                         treaty_country: true, declared_annual_income_cents: 1900000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /studios"
              payload: { code: "S-01", capability_tags: ["WELDING", "KILN"], ventilation_class: "LOCAL",
                         max_concurrent_residents: 1, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { studio: "$.data.id" }
            - call: "POST /housing-units"
              payload: { code: "H-01", bed_count: 1, meal_plan_included: true,
                         accessibility_features: ["STEP_FREE"], status: "AVAILABLE" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { unit: "$.data.id", unit_v: "$.data.version" }
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v: "$.data.version" }
            - call: "POST /residencies/${res}/stipend-schedule"
              payload: { expected_residency_version: "${res_v}" }
              as: FinanceOfficer
              as_user_id: "fin-01"
              captures: { res_v2: "$.data.version" }
            - call: "POST /studio-assignments"
              payload: { residency_id: "${res}", studio_id: "${studio}", start_date: "2026-11-02",
                         end_date: "2026-12-27", expected_residency_version: "${res_v2}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { sa: "$.data.id" }
            - call: "POST /housing-assignments"
              payload: { housing_unit_id: "${unit}", residency_id: "${res}", check_in_date: "2026-11-02",
                         check_out_date: "2026-12-28", expected_housing_unit_version: "${unit_v}",
                         meal_plan_selected: true }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { ha: "$.data.id" }
            - call: "GET /visa-cases"
              payload: {}
              as: VisaCoordinator
              as_user_id: "visa-01"
              captures: { vc: "$.data[0].id" }
            - call: "POST /visa-cases/${vc}/docs"
              payload: { action: "REQUEST", doc_list: ["PASSPORT", "INVITATION_LETTER"] }
              as: VisaCoordinator
              as_user_id: "visa-01"
            - call: "POST /visa-cases/${vc}/docs"
              payload: { action: "SUBMIT", doc_list: ["PASSPORT", "INVITATION_LETTER"] }
              as: VisaCoordinator
              as_user_id: "visa-01"
          trigger:
            - call: "POST /residencies/${res}/lifecycle"
              payload: { action: "WITHDRAW", reason: "artist accepted a competing fellowship" }
              as: Applicant
              as_user_id: "${art}"
          assert:
            - "BASELINE (before the residency exists): stipend_committed_cents == 0, stipend_uncommitted_cents == 20000000, slots_filled_count == 0, slots_open_count == 10, and 0 + 20000000 == stipend_pool_cents"
            - "PEAK (after scheduling and provisioning): Residency.stipend_total_cents == 560000 (70000 x 8) with stipend_basis == 'PROVISIONAL'; Cycle.stipend_committed_cents == 560000, stipend_uncommitted_cents == 19440000, slots_filled_count == 1, slots_open_count == 9; the sum 560000 + 19440000 == 20000000 still holds"
            - "PEAK side ledgers: 4 SCHEDULED StipendDisbursement rows of 140000 each (sum 560000, equal to stipend_total_cents); 4 PENDING Obligations (obligations_required_total == 5); Studio.reserved_resident_days == 56 with active_assignment_count == 1; HousingUnit.occupied_bed_nights == 56; VisaCase.status == 'DOCS_SUBMITTED'"
            - "AFTER WITHDRAW the money ledger is byte-exact with the baseline: stipend_committed_cents == 0 == ${base_committed} and stipend_uncommitted_cents == 20000000, because a WITHDRAWN residency is excluded from the SUM predicate entirely"
            - "AFTER WITHDRAW the slot ledger is byte-exact with the baseline too: slots_filled_count == 0 == ${base_slots} and slots_open_count == 10 - the slot returns to the pool and can be re-offered"
            - "the compensation fans out completely: all 4 disbursements are 'VOIDED' (none 'PAID'), all 4 obligations are 'WAIVED' with waived_reason 'RESIDENCY_WITHDRAWN', the StudioAssignment is 'RELEASED', the HousingAssignment is 'RELEASED' and the VisaCase moved 'DOCS_SUBMITTED' -> 'DENIED'"
            - "the dependent facility ledgers also return to baseline: Studio.reserved_resident_days == 0 with active_assignment_count == 0, HousingUnit.occupied_bed_nights == 0, and Residency.assigned_studio_code and assigned_housing_unit_code are both null"
            - "no drift is introduced by the intermediate stipend-schedule call: the schedule was derived FROM stipend_total_cents rather than into it, so the 4 VOIDED rows are never subtracted a second time"
            - "the residency row itself survives as history with status 'WITHDRAWN' and stipend_total_cents still 560000 - the ledgers are restored by CHANGING THE PREDICATE MEMBERSHIP, not by zeroing the residency's own fields"
            - "authorisation is part of the compensation path: WITHDRAW is Applicant-actioned and requires acting X-User-ID == Residency.applicant_id, so a ProgramAdmin issuing the same payload gets 403 'ERR_UNAUTHORIZED' and no ledger moves at all"

      - name: studio_day_ledger_restored_after_a_single_release_among_many
        grounds: "§1.2 StudioAssignment ACTIVE -> RELEASED side effect 'ledger sync: recomputes Studio.reserved_resident_days and Studio.active_assignment_count, restoring reserved_resident_days to its exact pre-assignment value when no other ACTIVE assignment was added'; §1.5 POST /studio-assignments/{id}/release"
        distinguishing_aspect: |
          Conserved quantity: STUDIO-DAYS (a physical, non-monetary resource measured in whole days),
          pinned as
              Studio.reserved_resident_days   == SUM(a.occupied_days WHERE a.studio_id == S
                                                                      AND a.status == ACTIVE)
              Studio.active_assignment_count  == COUNT(a WHERE a.studio_id == S AND a.status == ACTIVE)
          Unlike instance 1 the invariant is tested with a SURVIVING sibling: releasing B on a shared
          studio must subtract exactly B's 11 days and leave A's 56 untouched, so a naive "recompute
          by zeroing" or "subtract the last delta" implementation is caught. The released row also
          KEEPS its occupied_days == 11 for history, which means the ledger can only be right if the
          recomputation filters on status rather than deleting data. Re-booking the freed window
          afterwards returns the ledger to 67 exactly, showing the release genuinely freed capacity
          rather than only editing a counter.
        test_recipe:
          setup: |
            CHAIN-SHORT: one cycle, three applicants, three invited 8-week SCULPT residencies A, B
            and C all scheduled from 2026-11-02. One SHARED studio S-02 with
            max_concurrent_residents 2. Baseline ledgers are read before any assignment. A books
            2026-11-02 .. 2026-12-27 (56 days) and B books 2026-11-10 .. 2026-11-20 (11 days), so the
            studio sits at 67 reserved days with 2 ACTIVE rows and is at its per-day headcount over
            11-10 .. 11-20.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Ada Rivet", email: "ada.rivet@example.org",
                         affiliation_org: "North Shore Collective", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2000000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art1: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Kell Osei", email: "kell.osei@example.org",
                         affiliation_org: "Press Room East", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2200000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art2: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Tomas Bek", email: "tomas.bek@example.org",
                         affiliation_org: "Foundry Lane", citizenship_country: "US",
                         treaty_country: false, declared_annual_income_cents: 2100000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art3: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /studios"
              payload: { code: "S-02", capability_tags: ["WELDING", "KILN"], ventilation_class: "LOCAL",
                         max_concurrent_residents: 2, status: "AVAILABLE" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { studio: "$.data.id", base_days: "$.data.reserved_resident_days" }
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art1}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { resA: "$.data.id" }
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art2}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { resB: "$.data.id" }
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art3}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { resC: "$.data.id" }
            - call: "POST /residencies/${resA}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { resA_v: "$.data.version" }
            - call: "POST /residencies/${resB}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { resB_v: "$.data.version" }
            - call: "POST /residencies/${resC}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { resC_v: "$.data.version" }
            - call: "POST /studio-assignments"
              payload: { residency_id: "${resA}", studio_id: "${studio}", start_date: "2026-11-02",
                         end_date: "2026-12-27", expected_residency_version: "${resA_v}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { saA: "$.data.id" }
            - call: "POST /studio-assignments"
              payload: { residency_id: "${resB}", studio_id: "${studio}", start_date: "2026-11-10",
                         end_date: "2026-11-20", expected_residency_version: "${resB_v}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { saB: "$.data.id" }
          trigger:
            - call: "POST /studio-assignments/${saB}/release"
              payload: { reason: "resident moved to a private studio" }
              as: FacilitiesManager
              as_user_id: "fac-01"
            - call: "POST /studio-assignments"
              payload: { residency_id: "${resC}", studio_id: "${studio}", start_date: "2026-11-10",
                         end_date: "2026-11-20", expected_residency_version: "${resC_v}" }
              as: FacilitiesManager
              as_user_id: "fac-01"
              captures: { saC: "$.data.id" }
          assert:
            - "BASELINE at studio registration: reserved_resident_days == 0 == ${base_days} and active_assignment_count == 0"
            - "PEAK after both bookings: assignment A occupied_days == 56, assignment B occupied_days == 11, Studio.reserved_resident_days == 67 == 56 + 11 and active_assignment_count == 2"
            - "AFTER RELEASING B the ledger subtracts exactly B's contribution: reserved_resident_days == 56 and active_assignment_count == 1 - A's 56 days are untouched, so the recomputation is a SUM over ACTIVE rows and not a reset"
            - "the released row KEEPS its history: assignment B is 'RELEASED' with released_reason set and occupied_days still == 11, which means the 11 days must be excluded by the status filter rather than by deleting or zeroing the row"
            - "Residency B's assigned_studio_code becomes null while Residency A's still names S-02, so the per-residency denormalisation unwinds only for the released party"
            - "the release genuinely freed capacity rather than only editing a counter: the second trigger re-books the IDENTICAL 2026-11-10 .. 2026-11-20 window for residency C and returns 201, whereas that window was at its per-day headcount of 2 before the release"
            - "after the re-booking the ledger returns to the peak value EXACTLY: reserved_resident_days == 67 (56 + 11) and active_assignment_count == 2, with the released B row still sitting in history at 11 days"
            - "the conserved quantity is invariant to path: 0 -> 56 -> 67 -> 56 -> 67, and at every snapshot reserved_resident_days equals SUM(occupied_days) over ACTIVE rows of S-02 with no residue"
            - "releasing an already-RELEASED assignment is rejected by P31 (ERR_ASSIGNMENT_STATE_INVALID) rather than double-subtracting, so the ledger cannot be driven negative by a repeated release"

      - name: paired_paid_gross_and_withholding_ledgers_restored_by_a_reversal
        grounds: "§1.2 StipendDisbursement PAID -> REVERSED side effects 'compensation: recomputes Residency.stipend_paid_gross_cents and Residency.withholding_to_date_cents excluding this row, restoring both to their exact pre-payment values' and 'keeps gross_cents, withholding_cents and net_cents on the row for tax-reporting history'; §1.3 calculations.stipend_withholding"
        distinguishing_aspect: |
          Conserved quantities: a PAIR of ledgers that must unwind together, pinned as
              Residency.stipend_paid_gross_cents  == SUM(d.gross_cents       WHERE d.residency_id == R
                                                                              AND d.status == PAID)
              Residency.withholding_to_date_cents == SUM(d.withholding_cents WHERE d.residency_id == R
                                                                              AND d.status == PAID)
          This is the hardest of the three because the reversed row DELIBERATELY KEEPS its historical
          withholding_cents for the 1042-S, so the two ledgers and the row itself disagree by design,
          and because the withholding amounts are NOT proportional to gross: d1 withheld 4125 on
          87502 while d2 withheld 13125 on the same 87502, thanks to the cumulative exempt threshold.
          A reversal that subtracts an average rate, or that recomputes the remaining rows'
          withholding from scratch, produces 4125 vs some other figure - so only a genuine
          SUM-over-PAID restores both ledgers at once. The treaty rate 0.15 on a rate override of
          43751/wk is chosen so both withholding figures land on a .30 fractional cent, making the
          rounding survive the round trip.
        test_recipe:
          setup: |
            CHAIN-SHORT: an invited 8-week SCULPT residency for a FRENCH applicant with
            treaty_country true, so tax_form_type is '1042S' and withholding_rate is
            TREATY_WITHHOLDING_RATE 0.15. FinanceOfficer fin-01 generates the schedule with
            weekly_rate_override_cents 43751, producing 4 periods of 87502 (2 weeks x 43751).
            Baseline ledgers are read before any payment. fin-02 pays period 1 and then period 2.
            fin-03 performs the reversal, because P59 forbids the reverser from being the payer.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /cycles"
              payload: { code: "CY-2027", open_at: "2026-08-01T00:00:00Z", close_at: "2026-09-30T00:00:00Z",
                         application_fee_cents: 5000, panel_quorum: 2, cohort_target_size: 10,
                         alumni_reserve_pct: 0.25, stipend_pool_cents: 20000000, slate_min_score: 60.00,
                         stipend_weekly_rate_cents: 70000, session_length_options_weeks: [4, 5, 8, 9] }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { cyc: "$.data.id" }
            - call: "POST /disciplines"
              payload: { cycle_id: "${cyc}", code: "SCULPT", name: "Sculpture", portfolio_min_items: 1,
                         portfolio_max_items: 6, required_media_types: ["IMAGE"], requires_hazmat_review: false,
                         cohort_min_slots: 1, cohort_max_slots: 6, required_capability_tags: ["WELDING"],
                         required_ventilation_class: "LOCAL" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { disc: "$.data.id" }
            - call: "POST /applicants"
              payload: { full_name: "Camille Roux", email: "camille.roux@example.org",
                         affiliation_org: "Atelier Sud", citizenship_country: "FR",
                         treaty_country: true, declared_annual_income_cents: 1900000 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { art: "$.data.id" }
            - call: "POST /cycles/${cyc}/stage"
              payload: { to_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-01"
            - call: "POST /residencies"
              payload: { cycle_id: "${cyc}", applicant_id: "${art}", discipline_id: "${disc}" }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res: "$.data.id" }
            - call: "POST /residencies/${res}/schedule"
              payload: { session_start_date: "2026-11-02", session_length_weeks: 8 }
              as: ProgramAdmin
              as_user_id: "admin-01"
              captures: { res_v: "$.data.version" }
            - call: "POST /residencies/${res}/stipend-schedule"
              payload: { expected_residency_version: "${res_v}", weekly_rate_override_cents: 43751 }
              as: FinanceOfficer
              as_user_id: "fin-01"
            - call: "GET /residencies/${res}"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-02"
              captures: { base_gross: "$.data.stipend_paid_gross_cents", base_withheld: "$.data.withholding_to_date_cents" }
            - call: "GET /stipend-disbursements"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-02"
              captures: { d1: "$.data[0].id", d2: "$.data[1].id", d3: "$.data[2].id", d4: "$.data[3].id" }
            - call: "POST /stipend-disbursements/${d1}/settlement"
              payload: { action: "PAY", paid_on_date: "2026-11-16" }
              as: FinanceOfficer
              as_user_id: "fin-02"
            - call: "POST /stipend-disbursements/${d2}/settlement"
              payload: { action: "PAY", paid_on_date: "2026-11-30" }
              as: FinanceOfficer
              as_user_id: "fin-02"
          trigger:
            - call: "POST /stipend-disbursements/${d2}/settlement"
              payload: { action: "REVERSE", reason: "bank returned the transfer - stale IBAN on file" }
              as: FinanceOfficer
              as_user_id: "fin-03"
          assert:
            - "BASELINE before any payment: stipend_paid_gross_cents == 0 == ${base_gross} and withholding_to_date_cents == 0 == ${base_withheld}; 4 SCHEDULED rows of gross_cents 87502 each (2 weeks x 43751), tax_form_type '1042S'"
            - "d1 PAID: cumulative_taxable_cents == 87502, taxable slice 87502 - 60000 == 27502, withholding_cents == round_half_up(27502 x 0.15) == round_half_up(4125.30) == 4125, net_cents == 83377"
            - "d2 PAID: cumulative_taxable_cents == 175004, taxable slice max(0,175004-60000) - max(0,87502-60000) == 115004 - 27502 == 87502, withholding_cents == round_half_up(13125.30) == 13125, net_cents == 74377"
            - "PEAK ledgers: stipend_paid_gross_cents == 175004 (87502 + 87502) and withholding_to_date_cents == 17250 (4125 + 13125); note the two rows have IDENTICAL gross but DIFFERENT withholding, so no single rate can be used to unwind either ledger"
            - "AFTER REVERSING d2 both ledgers return to their exact pre-payment values: stipend_paid_gross_cents == 87502 and withholding_to_date_cents == 4125, i.e. precisely the d1-only sums"
            - "the reversed row keeps its history by design: d2.status == 'REVERSED' with gross_cents still 87502, withholding_cents still 13125 and net_cents still 74377 - the ledgers are restored by the status FILTER, so an implementation that zeroed the row would restore the ledgers but destroy the 1042-S"
            - "the pair must unwind TOGETHER: subtracting gross without withholding leaves 17250 against a gross of 87502, an implied rate of 19.7% that matches no statutory rate; subtracting a proportional share (17250 / 2 == 8625) also misses the correct 4125"
            - "GET /residencies/${res}/tax-report after the reversal reports annual_gross_cents 87502, annual_taxable_cents max(0, 87502 - 60000) == 27502, statutory_liability_cents round_half_up(27502 x 0.15) == 4125, withheld_actual_cents 4125, reconciliation_delta_cents 0 and paid_period_count 1 - the tax statement agrees with the restored ledgers, not with the reversed row's own figures"
            - "no cumulative drift is left behind for the next payment: paying d3 afterwards computes cumulative_taxable_cents == 175004 from the PAID rows (87502 + 87502) rather than 262506, so the reversal also rewound the threshold walk"
            - "segregation is enforced across the compensation: fin-02 attempting the same REVERSE gets 403 'ERR_SEGREGATION_OF_DUTIES' from P59 because a reverser may not be the row's paid_by_user_id, and no ledger moves"
            - "d1 is untouched throughout: still 'PAID' with withholding_cents 4125 and paid_by_user_id 'fin-02'"
