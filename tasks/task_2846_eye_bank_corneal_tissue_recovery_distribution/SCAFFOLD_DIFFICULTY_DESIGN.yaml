  - rule_id: priority_pair_validation_conflict
    instances:

      - name: allocation_of_quarantined_lookback_tissue_returns_409_state_error
        grounds:
          - validations[priority=14]
          - validations[priority=24]
          - errors.ERR_TISSUE_NOT_ELIGIBLE
          - errors.ERR_DONOR_UNDER_LOOKBACK
          - endpoints."POST /eye-bank/lookback-investigations"
        distinguishing_aspect: |
          state (priority 14) versus business_safety (priority 24) on the SAME call. Opening a
          lookback creates both violations in one step: the donor's lookback_flag goes true AND the
          ELIGIBLE tissue is quarantined. The allocation attempt must surface the priority-14 state
          error with HTTP 409, never the priority-24 safety error with HTTP 422. The companion call
          proves rule 24 is live: the donor's UNGRADED sibling — whose disposition IS a legal
          from-state for classify, so rule 14 passes — fails classification with 422 instead.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor with two corneas from one recovery, both fully evaluated (grades 0, ECD 3100)"
            - "tissue t1 classified -> TRANSPLANT_OPTICAL / ELIGIBLE; tissue t2 left UNGRADED but with both RECORDED evaluations"
