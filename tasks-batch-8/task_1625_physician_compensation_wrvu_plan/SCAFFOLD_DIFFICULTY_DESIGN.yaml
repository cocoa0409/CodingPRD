          - state_machines.Dispute.DATA_CORRECTION_to_RESOLVED_ACCEPTED
        distinguishing_aspect: |
          Cyclic machine on Dispute (UNDER_REVIEW -> DATA_CORRECTION -> UNDER_REVIEW -> DATA_CORRECTION
          -> RESOLVED_ACCEPTED): the correction loop is traversed twice, the cycle-back clears the
          recorded correction, and resolution applies only the latest correction (9 units, not 8).
        test_recipe:
          setup:
            - "ACTIVE plan, physician PH EFFECTIVE, capture CAP 99213 x 10 = 9.70 wRVU validated; dispute DSP filed on CAP by PH"
