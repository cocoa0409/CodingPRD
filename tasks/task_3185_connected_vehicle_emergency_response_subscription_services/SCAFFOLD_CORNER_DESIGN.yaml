              as_user_id: "${acct_a1}"
            - call: "GET /accounts/${acct_a1}/subscriptions/${sub_t1}"
              payload: {}
              as: Account
              as_user_id: "${acct_a1}"
              captures: { sub_t1_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_a1}/subscriptions/${sub_t1}/convert"
              payload: { expected_subscription_version: "${sub_t1_v}" }
              as: Account
              as_user_id: "${acct_a1}"
              captures: { err_tl: $.data.error_id }
          assert:
            - "response status 409 and error_id == ERR_INVALID_STATE (terminal lockdown, not an OCC failure)"
            - "Subscription.${sub_t1}.status still == CANCELLED"

      - name: consent_create_supersedes_prior_same_type_consent
        claim_type: side_effect_execution
        grounds:
          - state_machines.DataConsent.GRANTED_to_SUPERSEDED
        distinguishing_aspect: "Creating a second DRIVING_DATA_COLLECTION consent flips the first to SUPERSEDED via the system side effect; only one non-SUPERSEDED consent per (account, consent_type) survives."
        test_recipe:
          setup:
