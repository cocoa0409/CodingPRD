        claim_type: rate_threshold_triggers
        grounds: ["calculations.evidence_sufficiency_adjustment", "entities.EvaluationPolicy.fields.effective_threshold"]
        excluded_because:
          difficulty_instance: boundary_precision_check / composite_exactly_at_effective_threshold_bands_effective
          rationale: "That instance pins the `>=` behaviour at exactly 2.50, and its sibling pins the empty-growth-set renormalisation."

