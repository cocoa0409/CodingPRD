# =============================================================================
# §1.9 Scaffold Corner Design — task_3167 host railroad dispatch
# Breadth probe: claims §1.8 does not already cover. Anchors mirror the
# canonical chains (same literals as SCAFFOLD_DIFFICULTY_DESIGN.yaml); each
# instance replays them against a fresh empty DB.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: host_railroad_create_returns_defaults_and_envelope
        claim_type: Creation
        grounds:
          - entities.HostRailroad
          - endpoints.POST_/rail/host-railroads
          - response_envelope
        distinguishing_aspect: "A host railroad created with only name and reporting_mark returns 201 with server-minted id, created_at/updated_at, version 1, and the full meta envelope."
        test_recipe:
          setup: ["Empty DB; logical clock at default 2026-09-01T00:00:00Z (no clock call needed)."]
          setup_api_calls: []
          trigger:
            - &k_host
              call: "POST /rail/host-railroads"
              payload: { name: "Great Plains Rail", reporting_mark: "GPR" }
              as: SystemAdmin
              captures: { host_id: $.data.id, host_v: $.data.version }
          assert:
            - "response status 201, response_type object, meta.api_request_id and meta.api_request_timestamp present"
            - "HostRailroad.${host_id}.name == \"Great Plains Rail\" and reporting_mark == \"GPR\""
            - "${host_v} == 1 and created_at/updated_at are non-null"

      - name: host_railroad_create_id_input_ignored
        claim_type: System Fields
        grounds:
          - entities.HostRailroad
        distinguishing_aspect: "A client-supplied id in the create body is ignored; the server mints its own UUID."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rail/host-railroads"
              payload: { name: "Shadow Rail", reporting_mark: "SHD", id: "11111111-2222-3333-4444-555555555555" }
              as: SystemAdmin
              captures: { sh_id: $.data.id }
          assert:
            - "response status 201"
            - "${sh_id} != \"11111111-2222-3333-4444-555555555555\""

      - name: operating_agreement_get_round_trips_terms
        claim_type: Retrieval
        grounds:
          - entities.OperatingAgreement
          - endpoints.GET_/rail/operating-agreements/{id}
        distinguishing_aspect: "Every commercial term round-trips through GET unchanged and status/amendment_seq carry their system defaults DRAFT/0."
        test_recipe:
          setup: ["Host and corridor exist."]
          setup_api_calls:
            - &k_clock
              call: "POST /rail/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - *k_host
            - &k_corr
              call: "POST /rail/corridors"
              payload: { host_railroad_id: "${host_id}", code: "GP-1", name: "River Cities", endpoint_a: "CHI", endpoint_b: "KCY", service_type: "STATE_SUPPORTED", annual_cost_cents: 10000000 }
              as: SystemAdmin
              captures: { corr_id: $.data.id }
            - &k_seg1
              call: "POST /rail/track-segments"
              payload: { corridor_id: "${corr_id}", sequence_no: 1, milepost_start: 0.0, milepost_end: 10.0, state_code: "IL", track_class: "SINGLE", capacity_trains_per_day: 20, pure_run_minutes: 21, dwell_after_minutes: 0 }
              as: SystemAdmin
              captures: { seg1_id: $.data.id }
            - &k_seg2
              call: "POST /rail/track-segments"
              payload: { corridor_id: "${corr_id}", sequence_no: 2, milepost_start: 10.0, milepost_end: 40.0, state_code: "MO", track_class: "SINGLE", capacity_trains_per_day: 20, pure_run_minutes: 40, dwell_after_minutes: 0 }
              as: SystemAdmin
              captures: { seg2_id: $.data.id }
            - &k_oa
              call: "POST /rail/operating-agreements"
              payload: { host_railroad_id: "${host_id}", corridor_id: "${corr_id}", effective_from: "2026-09-01T00:00:00Z", effective_to: "2027-09-01T00:00:00Z", on_time_threshold_minutes: 15, penalty_rate_cents_per_minute: 50, incentive_rate_cents_per_train_mile: 12, otp_target_pct: 0.80, running_time_allowance_pct: 0.25 }
              as: PassengerOperator
              captures: { oa_id: $.data.id }
          trigger:
            - call: "GET /rail/operating-agreements/${oa_id}"
              payload: {}
              as: StateSponsor
          assert:
            - "response status 200"
            - "OperatingAgreement.${oa_id}.on_time_threshold_minutes == 15, penalty_rate_cents_per_minute == 50, incentive_rate_cents_per_train_mile == 12, otp_target_pct == 0.80, running_time_allowance_pct == 0.25"
            - "OperatingAgreement.${oa_id}.status == DRAFT and amendment_seq == 0"

      - name: train_runs_list_paginates_with_filter
        claim_type: Listing
        grounds:
          - endpoints.GET_/rail/train-runs
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With two runs materialized, timetable filter + limit=1 yields one row with total_count 2 and has_more true; offset=1 yields the second run with has_more false."
        test_recipe:
          setup: ["Published 2-run timetable on 2026-09-03."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - &k_oa_act
              call: "POST /rail/operating-agreements/${oa_id}/activate"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { oa_v: $.data.version }
            - &k_tt2
              call: "POST /rail/timetables"
              payload: { corridor_id: "${corr_id}", operating_agreement_id: "${oa_id}", service_date_start: "2026-09-03", service_date_end: "2026-09-03", trains_per_day: 2, departure_time_of_day: "08:00", headway_minutes: 120 }
              as: PassengerOperator
              captures: { tt2_id: $.data.id }
            - &k_tt2_prop
              call: "POST /rail/timetables/${tt2_id}/propose"
              payload: {}
              as: PassengerOperator
            - &k_tt2_rev
              call: "POST /rail/timetables/${tt2_id}/review"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &k_tt2_rat
              call: "POST /rail/timetables/${tt2_id}/ratify"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &k_tt2_pub
              call: "POST /rail/timetables/${tt2_id}/publish"
              payload: {}
              as: PassengerOperator
          trigger:
            - call: "GET /rail/train-runs"
              payload: { timetable_id: "${tt2_id}", limit: 1, offset: 0 }
              as: PassengerOperator
              captures: { r_first: "$.data[0].id" }
            - call: "GET /rail/train-runs"
              payload: { timetable_id: "${tt2_id}", limit: 1, offset: 1, status: "SCHEDULED" }
              as: PassengerOperator
              captures: { r_second: "$.data[0].id" }
          assert:
            - "page 1 returns exactly 1 row with total_count == 2 and has_more == true"
            - "page 2 returns exactly 1 row (SCHEDULED filter) with has_more == false and ${r_second} != ${r_first}"

      - name: corridor_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET_/rail/corridors/{id}
        distinguishing_aspect: "A well-formed UUID that does not exist returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /rail/corridors/3fa85f64-5717-4562-b3fc-2c963f66afa6"
              payload: {}
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 404 and ${err} == ERR_NOT_FOUND"

      - name: corridor_create_missing_required_code_returns_validation
        claim_type: Required Fields
        grounds:
          - validations[priority=1]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting the required field code on corridor create yields 400 ERR_VALIDATION even though all auth and existence checks would pass."
        test_recipe:
          setup: ["Host exists."]
          setup_api_calls:
            - *k_host
          trigger:
            - call: "POST /rail/corridors"
              payload: { host_railroad_id: "${host_id}", name: "No Code", endpoint_a: "CHI", endpoint_b: "KCY", service_type: "LONG_DISTANCE", annual_cost_cents: 5000000 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 and ${err} == ERR_VALIDATION"

      - name: corridor_create_invalid_enum_service_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Corridor.fields.service_type
          - validations[priority=1]
        distinguishing_aspect: "service_type MAGLEV is not a declared enum member -> 400 ERR_VALIDATION."
        test_recipe:
          setup: ["Host exists."]
          setup_api_calls:
            - *k_host
          trigger:
            - call: "POST /rail/corridors"
              payload: { host_railroad_id: "${host_id}", code: "X", name: "X", endpoint_a: "A", endpoint_b: "B", service_type: "MAGLEV", annual_cost_cents: 1 }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 and ${err} == ERR_VALIDATION"

      - name: timetable_defaults_draft_and_revision_zero
        claim_type: Defaults
        grounds:
          - entities.Timetable.fields.status
          - entities.Timetable.fields.revision_no
        distinguishing_aspect: "A created timetable starts in DRAFT with revision_no 0 without the client supplying either."
        test_recipe:
          setup: ["Host, corridor, segments, agreement exist."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
          trigger:
            - &k_tt1
              call: "POST /rail/timetables"
              payload: { corridor_id: "${corr_id}", operating_agreement_id: "${oa_id}", service_date_start: "2026-09-02", service_date_end: "2026-09-02", trains_per_day: 1, departure_time_of_day: "08:00", headway_minutes: 120 }
              as: PassengerOperator
              captures: { tt1_id: $.data.id, tt1_rev0: $.data.revision_no }
          assert:
            - "Timetable.${tt1_id}.status == DRAFT"
            - "${tt1_rev0} == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: delay_incident_initial_state_open_and_host_flag_derived
        claim_type: Initial State
        grounds:
          - state_machines.DelayIncident
          - entities.DelayIncident.fields.host_attributable
        distinguishing_aspect: "A coded incident starts OPEN with host_attributable derived from the cause code (HOST_SIGNAL -> true) and origin CODED — none of these are client-supplied."
        test_recipe:
          setup: ["Completed 1-run timetable run, 20 min late."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt1
            - &k_tt1_prop
              call: "POST /rail/timetables/${tt1_id}/propose"
              payload: {}
              as: PassengerOperator
            - &k_tt1_rev
              call: "POST /rail/timetables/${tt1_id}/review"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &k_tt1_rat
              call: "POST /rail/timetables/${tt1_id}/ratify"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &k_tt1_pub
              call: "POST /rail/timetables/${tt1_id}/publish"
              payload: {}
              as: PassengerOperator
            - &k_runs1
              call: "GET /rail/train-runs"
              payload: { timetable_id: "${tt1_id}" }
              as: PassengerOperator
              captures: { run_id: "$.data[0].id" }
            - &k_pass1
              call: "GET /rail/segment-passages"
              payload: { train_run_id: "${run_id}" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { pass1_id: "$.data[0].id", pass2_id: "$.data[1].id" }
            - &k_dep1
              call: "POST /rail/train-runs/${run_id}/depart"
              payload: { actual_departure_at: "2026-09-02T08:00:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &k_act1
              call: "POST /rail/segment-passages/${pass1_id}/actualize"
              payload: { actual_entry_at: "2026-09-02T08:00:00Z", actual_exit_at: "2026-09-02T08:43:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &k_act2
              call: "POST /rail/segment-passages/${pass2_id}/actualize"
              payload: { actual_entry_at: "2026-09-02T08:43:00Z", actual_exit_at: "2026-09-02T09:35:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - &k_comp1
              call: "POST /rail/train-runs/${run_id}/complete"
              payload: { actual_arrival_at: "2026-09-02T09:35:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /rail/delay-incidents"
              payload: { train_run_id: "${run_id}", cause_code: "HOST_SIGNAL", delay_minutes: 9 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { inc9: $.data.id, inc9_host: $.data.host_attributable, inc9_origin: $.data.origin }
          assert:
            - "DelayIncident.${inc9}.status == OPEN"
            - "${inc9_host} == true and ${inc9_origin} == CODED"

      - name: run_complete_from_scheduled_rejected_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TrainRun.transitions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "complete on a SCHEDULED run (never departed) is rejected with ERR_INVALID_STATE — EN_ROUTE is the only declared source."
        test_recipe:
          setup: ["Published 1-run timetable; run SCHEDULED."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt1
            - *k_tt1_prop
            - *k_tt1_rev
            - *k_tt1_rat
            - *k_tt1_pub
            - *k_runs1
          trigger:
            - call: "POST /rail/train-runs/${run_id}/complete"
              payload: { actual_arrival_at: "2026-09-02T09:17:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 and ${err} == ERR_INVALID_STATE"
            - "TrainRun.${run_id}.status == SCHEDULED (unchanged)"

      - name: cancelled_run_terminal_lockdown_depart_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TrainRun.transitions
        distinguishing_aspect: "A CANCELLED run is terminal: depart afterwards fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Published 1-run timetable; run cancelled by the operator."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt1
            - *k_tt1_prop
            - *k_tt1_rev
            - *k_tt1_rat
            - *k_tt1_pub
            - *k_runs1
            - call: "POST /rail/train-runs/${run_id}/cancel"
              payload: { reason: "consolidated" }
              as: PassengerOperator
          trigger:
            - call: "POST /rail/train-runs/${run_id}/depart"
              payload: { actual_departure_at: "2026-09-02T08:00:00Z" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 409 and ${err} == ERR_INVALID_STATE"
            - "TrainRun.${run_id}.cancellation_reason == OPERATOR_CANCEL"

      - name: incident_confirm_twice_second_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.DelayIncident.OPEN_to_CONFIRMED
        distinguishing_aspect: "Confirming an already-CONFIRMED incident is not idempotent — the second confirm is rejected with ERR_INVALID_STATE and attributed minutes are not double-counted."
        test_recipe:
          setup: ["Completed run; one CONFIRMED host incident of 20 minutes."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt1
            - *k_tt1_prop
            - *k_tt1_rev
            - *k_tt1_rat
            - *k_tt1_pub
            - *k_runs1
            - *k_pass1
            - *k_dep1
            - *k_act1
            - *k_act2
            - *k_comp1
            - &k_inc20
              call: "POST /rail/delay-incidents"
              payload: { train_run_id: "${run_id}", segment_passage_id: "${pass1_id}", cause_code: "HOST_FREIGHT_HOLD", delay_minutes: 20 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { inc20: $.data.id }
            - call: "POST /rail/delay-incidents/${inc20}/confirm"
              payload: {}
              as: PassengerOperator
          trigger:
            - call: "POST /rail/delay-incidents/${inc20}/confirm"
              payload: {}
              as: PassengerOperator
              captures: { err: $.data.error_id }
          assert:
            - "second confirm: status 409 and ${err} == ERR_INVALID_STATE"
            - "TrainRun.${run_id}.attributed_host_delay_minutes == 20 (not 40)"

      - name: capital_project_suspend_and_restart_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.CapitalProject.transitions
        distinguishing_aspect: "The CapitalProject machine supports the IN_PROGRESS -> SUSPENDED -> IN_PROGRESS loop via start; capacity is not incremented until complete."
        test_recipe:
          setup: ["ACTIVE agreement; FUNDED capital project on seg1 (version read after activation)."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - &k_proj
              call: "POST /rail/capital-projects"
              payload: { operating_agreement_id: "${oa_id}", track_segment_id: "${seg1_id}", project_type: "SIDING", funded_amount_cents: 50000000, added_frequency_capacity: 4 }
              as: PassengerOperator
              captures: { proj_id: $.data.id }
            - &k_proj_ok
              call: "POST /rail/capital-projects/${proj_id}/approve"
              payload: { expected_operating_agreement_version: "${oa_v}" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/capital-projects/${proj_id}/start"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
            - call: "POST /rail/capital-projects/${proj_id}/suspend"
              payload: { reason: "weather" }
              as: HostRailroadRep
              as_user_id: "${host_id}"
          trigger:
            - call: "POST /rail/capital-projects/${proj_id}/start"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          assert:
            - "CapitalProject.${proj_id}.status == IN_PROGRESS after resume"
            - "TrackSegment.${seg1_id}.capacity_trains_per_day == 20 (unchanged until complete)"

      - name: maintenance_release_from_planned
        claim_type: Valid Transition
        grounds:
          - state_machines.MaintenanceWindow.PLANNED_to_RELEASED
        distinguishing_aspect: "A window can be released directly from PLANNED without ever locking; no equipment hours were consumed so availability stays 40.00."
        test_recipe:
          setup: ["One PLANNED window."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - call: "POST /rail/maintenance-windows"
              payload: { track_segment_id: "${seg1_id}", window_start_at: "2026-09-08T06:00:00Z", window_end_at: "2026-09-08T10:00:00Z", equipment_unit_id: "EQ-2", clearance_buffer_minutes: 15 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { mw2: $.data.id }
          trigger:
            - call: "POST /rail/maintenance-windows/${mw2}/release"
              payload: {}
              as: HostRailroadRep
              as_user_id: "${host_id}"
          assert:
            - "MaintenanceWindow.${mw2}.status == RELEASED"
            - "MaintenanceWindow.${mw2}.equipment_week_hours_available == 40.00"

      - name: dispute_overturned_from_under_review_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DispatchPriorityDispute.UNDER_REVIEW_to_RESOLVED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "resolution OVERTURNED is only declared from ESCALATED; attempting it from UNDER_REVIEW fails with ERR_INVALID_STATE while UPHELD from the same state succeeds."
        test_recipe:
          setup: ["Completed run; two incidents each with an open dispute in UNDER_REVIEW."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt1
            - *k_tt1_prop
            - *k_tt1_rev
            - *k_tt1_rat
            - *k_tt1_pub
            - *k_runs1
            - *k_pass1
            - *k_dep1
            - *k_act1
            - *k_act2
            - *k_comp1
            - *k_inc20
            - call: "POST /rail/delay-incidents"
              payload: { train_run_id: "${run_id}", cause_code: "WEATHER", delay_minutes: 4 }
              as: HostRailroadRep
              as_user_id: "${host_id}"
              captures: { inc_w: $.data.id }
            - call: "POST /rail/delay-incidents/${inc20}/dispute"
              payload: {}
              as: PassengerOperator
              captures: { disp1: $.data.id }
            - call: "POST /rail/delay-incidents/${inc_w}/dispute"
              payload: {}
              as: PassengerOperator
              captures: { disp2: $.data.id }
          trigger:
            - call: "POST /rail/disputes/${disp1}/resolve"
              payload: { resolution: "OVERTURNED" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
            - call: "POST /rail/disputes/${disp2}/resolve"
              payload: { resolution: "UPHELD" }
              as: SystemAdmin
          assert:
            - "OVERTURNED from UNDER_REVIEW: status 409 and ${err} == ERR_INVALID_STATE"
            - "UPHELD from UNDER_REVIEW: status 200; DispatchPriorityDispute.${disp2}.status == RESOLVED"
            - "DelayIncident.${inc_w}.status == CONFIRMED and DelayIncident.${inc20}.status == DISPUTED (unchanged)"

      - name: incident_dispute_creates_dispute_in_under_review
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DelayIncident.OPEN_to_DISPUTED
          - state_machines.DispatchPriorityDispute
        distinguishing_aspect: "POST dispute returns the created DispatchPriorityDispute in UNDER_REVIEW carrying the incident's ids, and flips the incident to DISPUTED."
        test_recipe:
          setup: ["Completed run; one OPEN host incident."]
          setup_api_calls:
            - *k_clock
            - *k_host
            - *k_corr
            - *k_seg1
            - *k_seg2
            - *k_oa
            - *k_oa_act
            - *k_tt1
            - *k_tt1_prop
            - *k_tt1_rev
            - *k_tt1_rat
            - *k_tt1_pub
            - *k_runs1
            - *k_pass1
            - *k_dep1
            - *k_act1
            - *k_act2
            - *k_comp1
            - *k_inc20
          trigger:
