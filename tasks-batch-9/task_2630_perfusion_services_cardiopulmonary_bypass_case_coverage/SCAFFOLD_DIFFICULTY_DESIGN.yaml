      - name: ce_verify_then_revoke_restores_credit_ledger_and_readiness_gate
        grounds:
          - state_machines.CeActivity.SUBMITTED_to_VERIFIED
          - state_machines.CeActivity.VERIFIED_to_REVOKED
          - calculations.perfusionist_ce_ledger
          - calculations.perfusionist_readiness_score
          - entities.Perfusionist.fields.ce_credits_verified
          - entities.Perfusionist.fields.ce_credits_pending
          - validations[priority=43]
        distinguishing_aspect: |
          Compensation on a fractional ledger rather than an integer one, and the reversal is
          observable downstream instead of only in the field it touches. Credit hours carry one
          decimal place and the ledger rounds to one decimal, so a VERIFY-then-REVOKE pair is the
          natural place for rounding drift to appear; the invariant is that ce_credits_verified
          returns to the value it held before the verify, bit for bit, while the revoked row itself
          stays visible in REVOKED. The final assignment then proves the restored ledger is the one
          the admission gate reads: 12.5 restored hours give an ADMISSION score of 0.603, which
          still clears READINESS_MIN_ADMISSION, whereas the un-revoked 20.0 hours would have given
          0.694 - the delta is exactly CREDIT_WEIGHT * 7.5 / 45.
