      - name: both_pool_dimensions_can_exhaust_independently
        claim_type: Violation → Error
        grounds:
          - errors.ERR_SUSTAINED_POOL_EXHAUSTED
          - errors.ERR_MONTHLY_POOL_EXHAUSTED
          - validations.priority_55_sustained_pool_exhausted
          - validations.priority_56_monthly_pool_exhausted
          - calculations.quota_provisioning
