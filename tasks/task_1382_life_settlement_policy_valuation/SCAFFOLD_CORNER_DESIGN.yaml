            - { call: "POST /api/cases/${c1}/offers", payload: { amount_cents: 6000000 }, as: Underwriter, captures: { o1: "$.data.id", ov: "$.data.version" } }
          trigger:
            - { call: "POST /api/offers/${o1}/counter", payload: { counter_amount_cents: 6100000, expected_offer_version: "${ov}" }, as: Broker, as_user_id: "${bb}", captures: { err: "$.data.error_id" } }
          assert:
