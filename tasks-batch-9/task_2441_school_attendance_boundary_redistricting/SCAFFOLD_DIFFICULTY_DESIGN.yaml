    distinguishing_aspect: 'HALF-OPEN SCHOOL-YEAR INTERVALS WITH A QUIET-PERIOD BUFFER: two adoptions of the same district_name conflict not only when their [effective_school_year, effective_school_year + regime_years) intervals intersect but also when they are disjoint with a gap strictly smaller than MIN_REGIME_YEARS (2). The pair [2028,2031) and [2031,2033) touch at exactly one endpoint - gap 0 - and MUST be rejected, whereas [2033,2035) has gap exactly 2 and MUST be accepted. This is the opposite convention to area_rolling_absorption, where touching windows are legal.'
