            - "The response status is 409 and $.data.error_id == ERR_MEMBER_EMAIL_TAKEN."
            - "Member.${m_id}.status == PENDING and full_name == 'Ada Wells' - the first row was not overwritten."
            - "Member.${m_id}.join_date == 2026-07-01 and version == 1."

