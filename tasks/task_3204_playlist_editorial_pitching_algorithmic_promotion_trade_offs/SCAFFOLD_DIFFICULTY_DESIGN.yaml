              as: PlatformAdmin
              captures: { per_c: $.data.id, per_cv: $.data.version }
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_ca}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-11T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_cb}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-11T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_cb}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-12T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_cb}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-13T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
              captures: { stream_taint: $.data.id }
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_cb}", window_start: "2026-09-13T00:00:00Z", window_end: "2026-09-14T00:00:00Z", signal_bot_ratio: 1.0, signal_velocity_zscore: 1.0, signal_device_concentration: 0.6 }
              as: FraudAnalyst
              captures: { fc_cas: $.data.id }
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog/fraud-cases/${fc_cas}/adjudicate"
              payload: { verdict: "CONFIRM" }
              as: FraudAnalyst
            - call: "POST /catalog/royalty-periods/${per_c}/close"
              payload: { variant: "GROSS", expected_period_version: "${per_cv}" }
              as: PlatformAdmin
          assert:
            - "hop 1: FraudCase.${fc_cas}.verdict == CONFIRMED and clawback_cents == 0.40"
            - "hop 2: StreamEvent.${stream_taint}.is_tainted == true; the other three streams stay is_tainted == false"
            - "hop 3: close generates statements with raw 1/2 -> share_bps 5000/5000; A (created first) gross_payout_cents == 38889, B == 38888 — had the tainted stream counted, B's share would have been 7500"
            - "hop 3b: statement(B).clawback_cents == 0.40 so net_payout_cents == 38887.60"
            - "Artist.${art_cb}.fraud_strikes == 1"

      - name: artist_termination_cascades_release_track_module
        grounds:
          - state_machines.Artist.ACTIVE_to_TERMINATED
          - state_machines.Release.LIVE_to_REMOVED
          - state_machines.ProfileModule.ENABLED_to_DISABLED
        distinguishing_aspect: |
          Depth-3 cascade from the third CONFIRMED fraud case: FraudCase
          CONFIRMED -> Artist.fraud_strikes reaches TERMINATION_STRIKE_LIMIT 3
          -> Artist TERMINATED -> Release LIVE -> REMOVED -> Track AVAILABLE ->
          REMOVED and ProfileModule ENABLED -> DISABLED. Each link is triggered
          by the previous link, not by the adjudication directly; the trigger
          (fraud adjudication) is distinct from the statement-share cascade.
        test_recipe:
          setup:
            - "Artist X LIVE with release, focus track, a CANVAS profile module, and fraud_strikes already 2 from two earlier CONFIRMED cases."
            - "A third fraud case on the track with signals 1.0/1.0/0.6 (confidence 0.9000, AUTO_FLAGGED at creation)."
            - "An OPEN period so stream ingest is possible (no streams needed)."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "TermX", primary_genre: "ROCK", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_tx: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_tx}", title: "RX", release_type: "SINGLE", release_date: "2026-09-10T00:00:00Z", genre_tags: ["ROCK"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_tx}"
              captures: { rel_tx: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_tx}", title: "TX", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_tx}"
              captures: { trk_tx: $.data.id }
            - call: "POST /catalog/profile-modules"
              payload: { artist_id: "${art_tx}", module_type: "CANVAS", track_id: "${trk_tx}", payload_uri: "https://cdn.example.com/canvas/tx.mp4" }
              as: RightsHolder
              as_user_id: "${art_tx}"
              captures: { mod_tx: $.data.id }
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_tx}", window_start: "2026-09-11T00:00:00Z", window_end: "2026-09-12T00:00:00Z", signal_bot_ratio: 1.0, signal_velocity_zscore: 1.0, signal_device_concentration: 0.6 }
              as: FraudAnalyst
              captures: { fc_x1: $.data.id }
            - call: "POST /catalog/fraud-cases/${fc_x1}/adjudicate"
              payload: { verdict: "CONFIRM" }
              as: FraudAnalyst
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_tx}", window_start: "2026-09-13T00:00:00Z", window_end: "2026-09-14T00:00:00Z", signal_bot_ratio: 1.0, signal_velocity_zscore: 1.0, signal_device_concentration: 0.6 }
              as: FraudAnalyst
              captures: { fc_x2: $.data.id }
            - call: "POST /catalog/fraud-cases/${fc_x2}/adjudicate"
              payload: { verdict: "CONFIRM" }
              as: FraudAnalyst
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_tx}", window_start: "2026-09-15T00:00:00Z", window_end: "2026-09-16T00:00:00Z", signal_bot_ratio: 1.0, signal_velocity_zscore: 1.0, signal_device_concentration: 0.6 }
              as: FraudAnalyst
              captures: { fc_x3: $.data.id }
          trigger:
            - call: "POST /catalog/fraud-cases/${fc_x3}/adjudicate"
              payload: { verdict: "CONFIRM" }
              as: FraudAnalyst
          assert:
            - "after the second confirm the Artist was SUSPENDED (fraud_strikes == 2 == FRAUD_STRIKE_LIMIT) — its enrollments/placements were already TERMINATED/EVICTED by that cascade"
            - "the third case was openable and adjudicable while the artist was SUSPENDED (fraud review does not stop on suspension)"
            - "hop 1: FraudCase.${fc_x3}.verdict == CONFIRMED"
            - "hop 2: Artist.${art_tx}.fraud_strikes == 3 and status == TERMINATED"
            - "hop 3: Release.${rel_tx}.status == REMOVED and Track.${trk_tx}.status == REMOVED"
            - "hop 3b: ProfileModule.${mod_tx}.status == DISABLED"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pitch_state_beats_pitch_window_temporal
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_INVALID_STATE
          - errors.ERR_PITCH_WINDOW_CLOSED
        distinguishing_aspect: |
          Pair (state, business_temporal): a pitch already in terminal
          REJECTED that is ALSO inside the pitch window (clock within 7 days of
          release) must fail withdraw with the priority-5 state error
          ERR_INVALID_STATE, never the priority-6 ERR_PITCH_WINDOW_CLOSED —
          state outranks temporal even though both checks fail.
        test_recipe:
          setup:
            - "Artist with release dated 2026-09-20, focus track, playlist; pitch submitted at 2026-09-01, claimed, then decided REJECT (terminal REJECTED)."
            - "Clock then advanced to 2026-09-15T00:00:01Z — strictly inside MIN_PITCH_LEAD_DAYS of the release date, so the temporal check would fail too if it ran."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "PrioA", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_pa: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_pa}", title: "RP", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_pa}"
              captures: { rel_pa: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_pa}", title: "TP", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_pa}"
              captures: { trk_pa: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "Fresh Pop", genre_focus: "POP", mood_focus: "ANY", slot_count: 2, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_pa: $.data.id }
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_pa}", pitch_text: "doomed", target_playlist_id: "${pl_pa}" }
              as: RightsHolder
              as_user_id: "${art_pa}"
              captures: { pit_pa: $.data.id }
            - call: "POST /catalog/pitches/${pit_pa}/claim"
              payload: { team: "EDITORIAL_A" }
              as: PlaylistEditor
            - call: "POST /catalog/pitches/${pit_pa}/decide"
              payload: { decision: "REJECT" }
              as: EditorialLead
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T00:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /catalog/pitches/${pit_pa}/withdraw"
              payload: {}
              as: RightsHolder
              as_user_id: "${art_pa}"
              captures: { err_prio: $.data.error_id }
          assert:
            - "response is 409 and err_prio == ERR_INVALID_STATE (priority 5)"
            - "err_prio != ERR_PITCH_WINDOW_CLOSED — the temporal failure at priority 6 never surfaces because the state check fires first"

      - name: pitch_safety_fraud_hold_beats_fiscal_no_open_period
        grounds:
          - validations[priority=9]
          - validations[priority=16]
          - errors.ERR_FRAUD_HOLD
          - errors.ERR_NO_OPEN_PERIOD
        distinguishing_aspect: |
          Pair (business_safety, business_fiscal): one track carries an OPEN
          fraud case (fails the priority-9 safety check on pitch creation) and
          the platform has NO open royalty period (fails the priority-16 fiscal
          check on stream ingest) — the same dual-failure setup surfaces
          ERR_FRAUD_HOLD on the pitch endpoint and ERR_NO_OPEN_PERIOD on the
          stream endpoint, proving each endpoint stops at its own highest-
          priority failure rather than one global winner.
        test_recipe:
          setup:
            - "Artist with release dated 2026-09-20 and focus track; playlist exists."
            - "An OPEN-verdict fraud case on the track (signals 0.5/0.5/0.5 -> confidence 0.5000 < 0.7000, verdict OPEN — still blocking)."
            - "No RoyaltyPeriod has been created at all."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "PrioB", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_pb: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_pb}", title: "RPB", release_type: "SINGLE", release_date: "2026-09-20T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_pb}"
              captures: { rel_pb: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_pb}", title: "TPB", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_pb}"
              captures: { trk_pb: $.data.id }
            - call: "POST /catalog/playlists"
              payload: { name: "Fresh Pop", genre_focus: "POP", mood_focus: "ANY", slot_count: 2, rotation_cadence_days: 7, owning_team: "EDITORIAL_A" }
              as: EditorialLead
              captures: { pl_pb: $.data.id }
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_pb}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-02T00:00:00Z", signal_bot_ratio: 0.5, signal_velocity_zscore: 0.5, signal_device_concentration: 0.5 }
              as: FraudAnalyst
              captures: { fc_pb: $.data.id }
          trigger:
            - call: "POST /catalog/pitches"
              payload: { track_id: "${trk_pb}", pitch_text: "blocked", target_playlist_id: "${pl_pb}" }
              as: RightsHolder
              as_user_id: "${art_pb}"
              captures: { err_hold: $.data.error_id }
            - call: "POST /catalog/streams"
              payload: { track_id: "${trk_pb}", territory: "US", source: "ORGANIC", occurred_on: "2026-09-02T00:00:00Z", ms_played: 180000 }
              as: PlatformAdmin
              captures: { err_noperiod: $.data.error_id }
          assert:
            - "FraudCase.${fc_pb}.verdict == OPEN (confidence 0.5000 is below the 0.7000 auto-flag line but still blocks)"
            - "pitch create returns 409 err_hold == ERR_FRAUD_HOLD (priority 9 safety)"
            - "stream ingest returns 409 err_noperiod == ERR_NO_OPEN_PERIOD (priority 16 fiscal)"
            - "the two error categories (business_safety vs business_fiscal) fire on different endpoints of the same blocked catalog state"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fraud_confirm_threshold_inclusive_boundary
        grounds:
          - calculations.fraud_confidence_score
          - validations[priority=17]
          - errors.ERR_FRAUD_THRESHOLD_NOT_MET
        distinguishing_aspect: |
          Metric: fraud confidence_score, endpoint POST
          /catalog/fraud-cases/{id}/adjudicate. The gate is INCLUSIVE
          (>= 0.8500): signals 1.0/1.0/0.4 give exactly 0.8500 and CONFIRM
          succeeds, while 1.0/0.4/1.0 give 0.8400 (one hundredth below) and
          CONFIRM is rejected with ERR_FRAUD_THRESHOLD_NOT_MET. The boundary is
          reached and crossed by exactly one signal tick.
        test_recipe:
          setup:
            - "Artist with LIVE release and focus track."
            - "Case BELOW with signals 1.0/0.4/1.0 (confidence 0.8400, AUTO_FLAGGED since >= 0.7000 but below the confirm gate)."
            - "Case AT with signals 1.0/1.0/0.4 (confidence exactly 0.8500, AUTO_FLAGGED)."
          setup_api_calls:
            - call: "POST /catalog/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog/artists"
              payload: { stage_name: "Bound", primary_genre: "POP", home_territory: "US", follower_count: 5000 }
              as: PlatformAdmin
              captures: { art_bd: $.data.id }
            - call: "POST /catalog/releases"
              payload: { artist_id: "${art_bd}", title: "RBd", release_type: "SINGLE", release_date: "2026-09-10T00:00:00Z", genre_tags: ["POP"], mood_tags: [] }
              as: RightsHolder
              as_user_id: "${art_bd}"
              captures: { rel_bd: $.data.id }
            - call: "POST /catalog/tracks"
              payload: { release_id: "${rel_bd}", title: "TBd", duration_ms: 180000, is_focus_track: true }
              as: RightsHolder
              as_user_id: "${art_bd}"
              captures: { trk_bd: $.data.id }
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_bd}", window_start: "2026-09-11T00:00:00Z", window_end: "2026-09-12T00:00:00Z", signal_bot_ratio: 1.0, signal_velocity_zscore: 0.4, signal_device_concentration: 1.0 }
              as: FraudAnalyst
              captures: { fc_below: $.data.id }
            - call: "POST /catalog/fraud-cases"
              payload: { track_id: "${trk_bd}", window_start: "2026-09-13T00:00:00Z", window_end: "2026-09-14T00:00:00Z", signal_bot_ratio: 1.0, signal_velocity_zscore: 1.0, signal_device_concentration: 0.4 }
              as: FraudAnalyst
              captures: { fc_at: $.data.id }
          trigger:
            - call: "POST /catalog/fraud-cases/${fc_below}/adjudicate"
              payload: { verdict: "CONFIRM" }
              as: FraudAnalyst
              captures: { err_thr: $.data.error_id }
            - call: "POST /catalog/fraud-cases/${fc_at}/adjudicate"
              payload: { verdict: "CONFIRM" }
              as: FraudAnalyst
          assert:
            - "FraudCase.${fc_below}.confidence_score == 0.8400 and the CONFIRM attempt returns 409 err_thr == ERR_FRAUD_THRESHOLD_NOT_MET"
            - "FraudCase.${fc_at}.confidence_score == 0.8500 and its CONFIRM succeeds — the >= boundary is inclusive"
            - "FraudCase.${fc_below}.verdict is still AUTO_FLAGGED after the rejected adjudication (no partial state change; 0.8400 was already >= the 0.7000 auto-flag line)"

      - name: placement_slot_exhaustion_at_exact_capacity
        grounds:
          - calculations.placement_slot_selector
          - validations[priority=14]
          - errors.ERR_NO_FREE_SLOT
        distinguishing_aspect: |
          Metric: free-slot COUNT (an empty-collection edge), endpoint POST
          /catalog/pitches/{id}/decide. On a playlist with slot_count == 1 the
          first ACCEPT succeeds into slot 0; the second ACCEPT on a different
          pitch finds the candidate set EMPTY and fails with ERR_NO_FREE_SLOT —
          the boundary is exactly capacity == occupied, and the pitch stays
          UNDER_REVIEW rather than being rejected.
        test_recipe:
          setup:
            - "Two artists each with SCHEDULED release (2026-09-20) and focus track."
            - "Playlist with slot_count 1; two pitches, both claimed into UNDER_REVIEW."
