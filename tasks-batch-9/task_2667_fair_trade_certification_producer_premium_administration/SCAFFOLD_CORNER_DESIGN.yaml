              payload: { committee_id: "${cmte_id}", title: "Teacher stipend", use_category: "EDUCATION", requested_amount_cents: 300000, use_period_start: "2026-10-01", use_period_end: "2026-11-01", expected_fund_version: "${fund_v1}" }
              as: CommitteeChair
              as_user_id: "chair-1"
            - call: "GET /fairtrade/certificate-holders/${prod_id}/premium-funds"
              payload: {}
              as: CertificationOfficer
              captures: { fund_v2: "$.data[0].version" }
            - call: "POST /fairtrade/premium-use-proposals"
              payload: { committee_id: "${cmte_id}", title: "Teacher stipend", use_category: "EDUCATION", requested_amount_cents: 300000, use_period_start: "2026-10-01", use_period_end: "2026-11-01", expected_fund_version: "${fund_v2}" }
              as: CommitteeChair
              as_user_id: "chair-1"
              captures: { p2_id: $.data.id }
          assert:
            - "the first proposal returns 201 and the fund reads version == ${fund_v1} + 1 with pending_proposal_count == 1"
            - "the second proposal returns HTTP 412 with data.error_id == ERR_STALE_FUND_VERSION and the fund still reads version == ${fund_v1} + 1 and pending_proposal_count == 1"
            - "the refusal leaves total_accrued_cents == 2400000, balance_cents == 2400000, committed_cents == 0 and disbursed_cents == 0"
            - "${fund_v2} == ${fund_v1} + 1 and the retried proposal returns 201 with pending_proposal_count == 2 and fund version == ${fund_v2} + 1"
            - "PremiumUseProposal.${p1_id}.status == DRAFT and PremiumUseProposal.${p2_id}.status == DRAFT"

      - name: committee_activates_only_once_the_balance_reaches_exactly_the_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - global_constants.COMMITTEE_ACTIVATION_THRESHOLD_CENTS
          - state_machines.PremiumCommittee.FORMING_to_ACTIVE
          - calculations.community_development_premium
        distinguishing_aspect: "A 12499 kg settlement accrues 999920 cents, one cent short of the 1000000 threshold, and leaves the committee FORMING; a second settlement of 1 kg adds exactly 80 cents to hit 1000000 and flips it to ACTIVE, so the trigger uses >= at the exact boundary and is evaluated per settlement."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED producer and brand with a PHYSICAL chain, 50000 kg declared, and a FORMING committee chaired by chair-1"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}" }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { node_v1: $.data.version }
            - call: "POST /fairtrade/premium-committees"
              payload: { holder_id: "${prod_id}", chair_user_id: "chair-1", member_count: 5, approved_use_categories: ["EDUCATION"] }
              as: CertificationOfficer
              captures: { cmte_id: $.data.id, cmte_v: $.data.version }
          trigger:
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 12499, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions/${t1_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: Auditor
              as_user_id: "auditor-1"
            - call: "POST /fairtrade/trade-transactions/${t1_id}/settle"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
              captures: { node_v2: $.data.version }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 1, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v2}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t2_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions/${t2_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: Auditor
              as_user_id: "auditor-1"
            - call: "POST /fairtrade/trade-transactions/${t2_id}/settle"
              payload: {}
              as: CertificationOfficer
          assert:
            - "TradeTransaction.${t1_id}.premium_cents == 999920 with premium_basis == PHYSICAL_TRACEABILITY"
            - "after the first settle the fund reads total_accrued_cents == 999920 and balance_cents == 999920, and PremiumCommittee.${cmte_id}.status == FORMING with version == ${cmte_v}"
            - "TradeTransaction.${t2_id}.premium_cents == 80"
            - "after the second settle the fund reads total_accrued_cents == 1000000 and balance_cents == 1000000, exactly COMMITTEE_ACTIVATION_THRESHOLD_CENTS"
            - "PremiumCommittee.${cmte_id}.status == ACTIVE with version == ${cmte_v} + 1"
            - "GET /fairtrade/premium-ledger-entries with fund_id filter returns 2 ACCRUAL entries with balance_after_cents 999920 then 1000000, ordered by created_at ASC"

      - name: holder_compliance_aggregates_reconcile_after_each_finding_and_closure
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.holder_compliance_score_and_deadline
          - entities.CertificateHolder.compliance_score
          - endpoints[POST /fairtrade/audits/{id}/nonconformities]
        distinguishing_aspect: "The holder's four derived compliance fields are read after three source mutations: a MAJOR finding drops the score to 85, an added MINOR drops it to 80, and closing the MAJOR raises it back to 95 rather than to 100, proving the aggregates are recomputed from the surviving open set rather than adjusted by deltas."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED producer with a started audit by auditor-1 over 2026-08-01..2026-08-08 and no findings"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/audits"
              payload: { holder_id: "${prod_id}", auditor_user_id: "auditor-1", audit_type: "INITIAL", window_start: "2026-08-01", window_end: "2026-08-08" }
              as: CertificationOfficer
              captures: { audit_id: $.data.id }
            - call: "POST /fairtrade/audits/${audit_id}/start"
              payload: {}
              as: Auditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /fairtrade/audits/${audit_id}/nonconformities"
              payload: { clause_code: "4.2.1", grade: "MAJOR", description: "Wage records incomplete" }
              as: Auditor
              as_user_id: "auditor-1"
              captures: { major_id: $.data.id }
            - call: "POST /fairtrade/audits/${audit_id}/nonconformities"
              payload: { clause_code: "3.1.4", grade: "MINOR", description: "Signage missing at store" }
              as: Auditor
              as_user_id: "auditor-1"
              captures: { minor_id: $.data.id }
            - call: "POST /fairtrade/nonconformities/${major_id}/cap-submissions"
              payload: { narrative: "Payroll rebuilt and archived" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
            - call: "POST /fairtrade/nonconformities/${major_id}/cap-review"
              payload: { decision: "ACCEPT", review_note: "Evidence sufficient" }
              as: CertificationOfficer
              as_user_id: "officer-1"
          assert:
            - "after the MAJOR is raised: CertificateHolder.${prod_id}.compliance_score == 85, open_critical_count == 0, open_major_count == 1, open_minor_count == 0"
            - "Nonconformity.${major_id}.compliance_score_at_raise == 100, escalation_grace_days == 14 and deadline_at == 2026-09-15T00:00:00Z"
            - "after the MINOR is raised: compliance_score == 80, open_major_count == 1 and open_minor_count == 1"
            - "Nonconformity.${minor_id}.compliance_score_at_raise == 85, escalation_grace_days == 7 and deadline_at == 2026-10-30T00:00:00Z"
            - "after the accepted corrective action: Nonconformity.${major_id}.status == CLOSED, compliance_score == 95, open_major_count == 0 and open_minor_count == 1"
            - "Audit.${audit_id}.nonconformity_count == 2 and open_nonconformity_count == 1"
            - "CertificateHolder.${prod_id}.next_audit_due_at == null throughout, because no audit has reached CLOSED"

      - name: escalation_cascade_through_holder_nodes_and_trades
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - endpoints[POST /fairtrade/compliance-sweeps]
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_escalation_chains_from_nonconformity_to_holder_to_nodes_to_trades
          rationale: "The named §1.8 instance verifies the four-level sweep chain end to end, including the released reservation on the disputed trade."
      - name: premium_dual_variant_produces_two_different_amounts
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.community_development_premium
        excluded_because:
          difficulty_instance: dual_variant_calc / premium_basis_physical_versus_mass_balance_diverges_on_identical_shipment
          rationale: "The named §1.8 instance settles the same shipment under both seller traceability modes and asserts both amounts and their delta."

  - section: consistency_model
    instances:
      - name: settlement_effects_are_all_visible_without_any_re_read_delay
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /fairtrade/trade-transactions/{id}/settle]
          - calculations.premium_fund_conservation
        distinguishing_aspect: "The settle response itself already carries the final settlement fields, and the very next reads of the node, the fund and the ledger show the accrual, the claimed kilograms and the buyer's converted input with no lag and no reconciliation step."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "CERTIFIED producer and brand with a PHYSICAL chain, a 0.5 conversion ratio on the brand node, 50000 kg declared and one VERIFIED 10000 kg coffee trade"
          setup_api_calls:
            - call: "POST /fairtrade/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Kilimo Coop", holder_type: "PRODUCER_ORG", country_code: "KE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { prod_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${prod_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/certificate-holders"
              payload: { legal_name: "Nordic Roasters", holder_type: "BRAND", country_code: "SE", product_code: "COFFEE_ARABICA" }
              as: CertificationOfficer
              captures: { brand_id: $.data.id }
            - call: "POST /fairtrade/certificate-holders/${brand_id}/certify"
              payload: {}
              as: CertificationOfficer
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${prod_id}", node_role: "COOPERATIVE", traceability_mode: "PHYSICAL" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { sell_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes"
              payload: { holder_id: "${brand_id}", node_role: "BRAND_NODE", traceability_mode: "PHYSICAL", upstream_node_id: "${sell_node_id}", conversion_ratio: 0.5 }
              as: BrandLicensee
              as_user_id: "${brand_id}"
              captures: { buy_node_id: $.data.id }
            - call: "POST /fairtrade/supply-chain-nodes/${sell_node_id}/harvest-declarations"
              payload: { certified_volume_kg: 50000, harvest_season: "2026" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { node_v1: $.data.version }
            - call: "POST /fairtrade/trade-transactions"
              payload: { seller_node_id: "${sell_node_id}", buyer_node_id: "${buy_node_id}", product_code: "COFFEE_ARABICA", quality_grade: "STANDARD", volume_kg: 10000, declared_unit_price_cents_per_kg: 500, contract_date: "2026-08-01", expected_seller_node_version: "${node_v1}" }
              as: ProducerRepresentative
              as_user_id: "${prod_id}"
              captures: { t1_id: $.data.id }
            - call: "POST /fairtrade/trade-transactions/${t1_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: Auditor
              as_user_id: "auditor-1"
          trigger:
            - call: "POST /fairtrade/trade-transactions/${t1_id}/settle"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/supply-chain-nodes/${sell_node_id}"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/supply-chain-nodes/${buy_node_id}"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/certificate-holders/${prod_id}/premium-funds"
              payload: {}
              as: CertificationOfficer
            - call: "GET /fairtrade/premium-ledger-entries"
              payload: { trade_transaction_id: "${t1_id}" }
              as: CertificationOfficer
          assert:
            - "the settle response body already reports settlement_status == SETTLED and settled_at == 2026-08-01T00:00:00Z"
            - "the immediately following seller read shows claimed_output_kg == 10000.000, reserved_output_kg == 0.000 and available_credit_kg == 40000.000"
            - "the buyer read shows certified_input_kg == 5000.000, the 10000 kg scaled by the 0.5 conversion ratio"
            - "the fund read shows total_accrued_cents == 800000, balance_cents == 800000, committed_cents == 0 and disbursed_cents == 0"
            - "the ledger read returns exactly 1 ACCRUAL entry with amount_cents == 800000 and balance_after_cents == 800000"
            - "no assertion needs a second read of the same resource: every derived value is correct on its first read after the write"
