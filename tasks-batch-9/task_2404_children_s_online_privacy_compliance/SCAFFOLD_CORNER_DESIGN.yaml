  # ===========================================================================
  - section: errors
    instances:
      - name: request_missing_x_user_role_header_returns_401_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_UNAUTHENTICATED]
          - rbac
        distinguishing_aspect: "Priority 10 fires before every other check: a missing X-User-Role header, a missing X-User-ID header and a role string outside the five declared roles all return ERR_UNAUTHENTICATED (401) — even on a path id that does not exist, which would otherwise be a 404, and even on a payload that would otherwise be a 422."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; one registered service."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Auth Header Kids", operator_organization: "Auth Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
          trigger:
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: "(no X-User-Role header sent)"
              captures: { err_no_role: $.data.error_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: "(X-User-Role: ComplianceOfficer, no X-User-ID header sent)"
              captures: { err_no_user_id: $.data.error_id }
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: "(X-User-Role: RegulatorAuditor — a role that is not one of the five declared roles)"
              captures: { err_unknown_role: $.data.error_id }
            - call: "GET /online-services/00000000-0000-4000-8000-000000000401"
              payload: {}
              as: "(no X-User-Role header sent)"
              captures: { err_unknown_id_no_auth: $.data.error_id }
            - call: "POST /online-services"
              payload: { name: "Should Never Exist" }
              as: "(no X-User-Role header sent)"
              captures: { err_bad_payload_no_auth: $.data.error_id }
            - call: "GET /online-services"
              payload: { limit: 100, offset: 0 }
              as: ComplianceOfficer
              captures: { service_total: $.meta.total_count }
          assert:
            - "${err_no_role} == ERR_UNAUTHENTICATED with HTTP 401"
            - "${err_no_user_id} == ERR_UNAUTHENTICATED with HTTP 401 (both headers are mandatory, not just the role)"
            - "${err_unknown_role} == ERR_UNAUTHENTICATED with HTTP 401 — an undeclared role is unauthenticated, not 403"
            - "${err_unknown_id_no_auth} == ERR_UNAUTHENTICATED with HTTP 401, NOT ERR_SERVICE_NOT_FOUND (priority 10 precedes priority 40)"
            - "${err_bad_payload_no_auth} == ERR_UNAUTHENTICATED with HTTP 401, NOT ERR_INVALID_REQUEST (priority 10 precedes priority 65)"
            - "${service_total} == 1 (none of the refused calls created anything)"

      - name: notice_publish_by_privacy_engineer_returns_403_role_not_permitted
        claim_type: violation_to_error
        grounds:
          - validations[priority=20]
          - validations[priority=72]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_TRANSITION_ROLE_NOT_PERMITTED]
        distinguishing_aspect: "Two different 403 codes separate endpoint-level from transition-level authority: a PrivacyEngineer publishing a notice is not on the endpoint's role list at all (ERR_ROLE_NOT_PERMITTED, priority 20), whereas a ComplianceOfficer moving an age screen DRAFT -> IN_REVIEW IS on the endpoint's role list but is not the declared actor for that edge (ERR_TRANSITION_ROLE_NOT_PERMITTED, priority 72) — and the same officer is the correct actor for the very next edge, IN_REVIEW -> ACTIVE."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; MIXED_AUDIENCE service with a DRAFT notice and a DRAFT neutral age screen."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /online-services"
              payload: { name: "Role Split Kids", operator_organization: "Role Media", service_category: "GAME", subject_matter_code: "FAMILY_MIXED" }
              as: ComplianceOfficer
              captures: { svc_id: $.data.id }
            - call: "POST /determination-evidence"
              payload: { service_id: "${svc_id}", evidence_kind: "DESIGN_FACTOR", factor_code: "SUBJECT_MATTER", rating: "MODERATE" }
              as: ComplianceOfficer
            - call: "POST /online-services/${svc_id}/determination"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /online-services/${svc_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { sv1: $.data.version }
            - call: "POST /parental-notices"
              payload: { service_id: "${svc_id}", notice_label: "Notice r1", delivery_channel: "EMAIL", content_keys: ["OPERATOR_IDENTITY_CONTACT", "ELEMENTS_COLLECTED", "USE_PURPOSES", "THIRD_PARTY_DISCLOSURE", "PARENTAL_RIGHTS", "NO_CONDITIONING_OF_PARTICIPATION", "RETENTION_AND_DISPOSAL"], expected_service_version: "${sv1}" }
              as: ComplianceOfficer
              captures: { notice_id: $.data.id }
            - call: "POST /age-screens"
              payload: { service_id: "${svc_id}", mechanism: "NEUTRAL_DOB_ENTRY", retry_allowed_on_fail: false, outcome_session_persisted: true }
              as: PrivacyEngineer
              captures: { screen_id: $.data.id }
          trigger:
            - call: "POST /parental-notices/${notice_id}/publish"
              payload: {}
              as: PrivacyEngineer
              captures: { err_endpoint_role: $.data.error_id }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: ComplianceOfficer
              captures: { err_transition_role: $.data.error_id }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyEngineer
              captures: { review_status: $.data.status }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PrivacyEngineer
              captures: { err_activation_role: $.data.error_id }
            - call: "POST /age-screens/${screen_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
              captures: { active_status: $.data.status }
            - call: "GET /online-services/${svc_id}/parental-notices"
              payload: { limit: 100, offset: 0 }
              as: ComplianceOfficer
              captures: { notice_status: "$.data[0].status" }
          assert:
            - "${err_endpoint_role} == ERR_ROLE_NOT_PERMITTED with HTTP 403 (PrivacyEngineer is absent from the publish endpoint's roles)"
            - "${err_transition_role} == ERR_TRANSITION_ROLE_NOT_PERMITTED with HTTP 403 — a different code, because ComplianceOfficer IS listed on POST /age-screens/{id}/status"
            - "${review_status} == IN_REVIEW once the declared actor performs the edge"
            - "${err_activation_role} == ERR_TRANSITION_ROLE_NOT_PERMITTED with HTTP 403 (the roles swap on the next edge: the engineer may submit but not activate)"
            - "${active_status} == ACTIVE and ${notice_status} == DRAFT (the refused publish changed nothing)"

      - name: parent_addressing_another_parents_consent_reports_not_consent_holder
        claim_type: violation_to_error
        grounds:
