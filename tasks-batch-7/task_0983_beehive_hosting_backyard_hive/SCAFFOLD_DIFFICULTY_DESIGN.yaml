          assert:
            - "captured ${err} == ERR_CREW_SCHEDULE_CONFLICT (p8 constraint outranks p10 temporal)"
            - "2026-06-10T10:30:00Z overlaps job1's [09:00, 11:00) window AND is < now + 48h — both rules fail, observed error proves the ordering"
            - "RemovalJob.${rj2}.status == APPROVED (failed schedule leaves the job schedulable)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: four instances on DIFFERENT metrics,
  # each via a DISTINCT endpoint
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: mite_threshold_exact_3_00_triggers
        grounds:
          - calculations.mite_load_per_100
          - calculations.hive_posture_derivation
        distinguishing_aspect: |
          Metric: mite load per 100 bees, via POST /api/inspections/{id}/verify. Exactly
          3.00 (9/300) crosses the >= 3.00 treatment threshold (TREATMENT_REQUIRED, lifecycle
          stays ACTIVE); 2.67 (8/300) stays at WATCH. The boundary is inclusive.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE; site capacity 2; agreement ACTIVE; hive1 and hive2 installed"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
            - { call: "POST /api/hosts", payload: { full_name: "Host Fifteen", email: "h15@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "15 Sycamore Dr", base_capacity_hives: 2, water_source: true, setback_feet: 10 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
            - { call: "POST /api/agreements/${ag}/sign", payload: {}, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv1: $.data.id } }
            - { call: "POST /api/hives", payload: { site_id: "${site}", agreement_id: "${ag}" }, as: ApiaryManager, as_user_id: "mgr-1", captures: { hv2: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv1}", inspected_at: "2026-05-10T00:00:00Z", mites_counted: 9, bees_sampled: 300, disease_flag: false, brood_score: 8, queen_seen: true, stores_kg: 10.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i1: $.data.id } }
            - { call: "POST /api/inspections", payload: { hive_id: "${hv2}", inspected_at: "2026-05-10T00:00:00Z", mites_counted: 8, bees_sampled: 300, disease_flag: false, brood_score: 8, queen_seen: true, stores_kg: 10.0 }, as: Beekeeper, as_user_id: "bk-1", captures: { i2: $.data.id } }
            - { call: "POST /api/inspections/${i1}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
            - { call: "POST /api/inspections/${i2}/submit", payload: {}, as: Beekeeper, as_user_id: "bk-1" }
          trigger:
            - { call: "POST /api/inspections/${i1}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1", captures: { load1: $.data.mite_load_per_100 } }
            - { call: "POST /api/inspections/${i2}/verify", payload: {}, as: ApiaryManager, as_user_id: "mgr-1", captures: { load2: $.data.mite_load_per_100 } }
            - { call: "GET /api/hives/${hv1}", payload: {}, as: ApiaryManager }
            - { call: "GET /api/hives/${hv2}", payload: {}, as: ApiaryManager }
          assert:
            - "captured ${load1} == 3.00 and Hive.${hv1}.posture == TREATMENT_REQUIRED (>= 3.00 is inclusive)"
            - "Hive.${hv1}.lifecycle_status == ACTIVE (3.00 does NOT reach the 9.00 quarantine threshold)"
            - "captured ${load2} == 2.67 and Hive.${hv2}.posture == WATCH (2.67 >= 2.00 but < 3.00)"

      - name: site_capacity_equal_boundary_blocks
        grounds:
          - calculations.site_effective_capacity
          - errors[ERR_SITE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric: integer hive occupancy, via POST /api/hives. occupancy == effective capacity
          rejects (inclusive boundary): with capacity 2 the third install fails with
          ERR_SITE_CAPACITY_EXCEEDED; after the ADV-201 education bonus lifts capacity to 3,
          the identical third install succeeds.
        test_recipe:
          setup:
            - "Season S1 OPEN; host ACTIVE with waiver; site base_capacity_hives 2 (no subscription, no courses -> effective 2)"
            - "Two hives already installed (occupancy 2)"
          setup_api_calls:
            - { call: "POST /api/seasons", payload: { name: "S2026", frost_date: "2026-10-15T00:00:00Z" }, as: PlatformOps, captures: { s1: $.data.id } }
