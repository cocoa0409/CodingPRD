        grounds:
          - state_machines.Transaction.POSTED_to_REVERSED
          - state_machines.TransferRequest.SUBMITTED_to_HELD
          - state_machines.Account.CLEAR_to_WATCH
          - state_machines.BenefitEntitlement.ACTIVE_to_SUSPENDED
          - calculations.account_fraud_posture
        distinguishing_aspect: |
          Depth-4 chain triggered by Transaction POSTED -> REVERSED, where every hop is caused by
          the previous hop and never by the reversal itself: HOP 1 appends the CLAWBACK ledger
          entry; HOP 2 is the ledger recomputation that drives points_balance strictly negative;
          HOP 3 exists only because the recomputed balance is negative and holds the two in-flight
          transfers; HOP 4 exists only because HOP 3 pushed transfer_hold_count to 2, which is what
          moves the posture and suspends LOUNGE_ACCESS. A reversal on an account with a
          non-negative post-clawback balance stops after HOP 2.
