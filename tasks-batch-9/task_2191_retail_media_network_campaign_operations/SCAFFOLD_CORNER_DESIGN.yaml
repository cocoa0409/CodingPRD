  - section: consistency_model
    instances:
      - name: line_item_activation_returns_every_recomputed_field_in_its_own_response_with_no_reread_lag
        claim_type: immediate
        grounds:
          - consistency_model.immediate
          - endpoints[POST /rmn/line-items/{id}/activate]
