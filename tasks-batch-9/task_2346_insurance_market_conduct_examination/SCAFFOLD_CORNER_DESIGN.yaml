      - name: file_sample_references_are_system_minted_and_deterministic
        claim_type: system_fields
        grounds:
          - entities.FileSample.fields.file_reference
          - entities.FileSample.fields.population_index
          - calculations.sample_draw_plan
          - endpoints[GET /market-conduct/data-calls/{id}/file-samples]
        distinguishing_aspect: |
          FileSample rows are never POSTed: they materialise as a side effect of data-call
          acceptance, so file_reference and population_index are pure functions of the area
          (CLM prefix, interval 400, indices 1 / 401 / ... / 3601) with no randomness and no client
          input anywhere in their provenance.
        excluded_because:
          difficulty_instance: scope_area_loops_back_to_planned_on_data_call_rejection_voiding_samples
          rationale: "That §1.8 instance asserts the exact re-drawn reference sequence CLM-000001 .. CLM-003601, interval 400 and population_index 1 on the first row."

      - name: hybrid_topology_cross_cutting_associations_are_validated_at_both_ends
        claim_type: hybrid
        grounds:
          - complexity_profile.entity_topology
          - entities.FieldworkActivity.fields.area
          - entities.Criticism.fields.scope_area_id
          - entities.MultistateCollaboration.fields.exam_id
        distinguishing_aspect: |
          The topology is hybrid because two associations cut across the Examination hierarchy in
          opposite ways: Criticism.scope_area_id is a hard FK checked against the sibling exam_id,
          while FieldworkActivity.area is a loose enum match that is deliberately NOT checked against
          the examination's scope areas - the same word means a constraint in one place and a label
          in the other.
        excluded_because:
          difficulty_instance: safety_priority_51_beats_constraint_priority_66_on_criticism_issuance
          rationale: "The FK-checked end is asserted there (criticism issuance reads its scope area's state and error_count); the loose-enum end is asserted in the corner instance fieldwork_activity_is_immutable_and_carries_no_version."
