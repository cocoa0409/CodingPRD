      - name: governing_license_selection_picks_the_latest_expiring_coordinated_licence
        claim_type: correct_result
        grounds:
          - calculations.governing_license_selection
          - entities.RoamingAuthorization.fields.governing_license_id
          - 'endpoints["POST /satellite-broadband/roaming-authorizations/{id}/decide"]'
        distinguishing_aspect: "Three US-CA licences exist: the beam's (expires 2027-12-31), a later-expiring ACTIVE + COORDINATED one (2029-06-30) and an even later PENDING_COORDINATION one (2031-01-01). Approval must pin the 2029 licence — expires_at DESC among candidates only, so the uncoordinated 2031 licence is ignored and the beam's own licence does not win by association."
