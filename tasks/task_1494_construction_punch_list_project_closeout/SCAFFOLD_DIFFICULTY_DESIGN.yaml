  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: sc_request_safety_error_beats_minor_count_constraint
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors[ERR_OPEN_LIFE_SAFETY_ITEMS]
          - errors[ERR_TOO_MANY_OPEN_MINOR_ITEMS]
        distinguishing_aspect: |
          Error-category pair business_safety vs business_constraint: one request violates
          BOTH (1 blocking LIFE_SAFETY item AND 6 blocking MINOR items); the safety error
          ERR_OPEN_LIFE_SAFETY_ITEMS must win over ERR_TOO_MANY_OPEN_MINOR_ITEMS.
        test_recipe:
          setup:
            - "PUNCH_ACTIVE project, trade with COMPLETED walk, 1 OPEN LIFE_SAFETY item and 6 OPEN MINOR items"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj P1", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/projects/${pa}/begin-punch", as: GCProjectManager }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks", payload: { project_id: "${pa}", trade_package_id: "${ta}", lead_inspector_id: "insp-1", scheduled_start: "2026-08-03T09:00:00Z", scheduled_end: "2026-08-03T10:00:00Z" }, as: GCProjectManager, captures: { wa: $.data.id } }
            - { call: "POST /closeout/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: GCProjectManager }
            - { call: "POST /closeout/punch-walks/${wa}/complete", as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "Exit sign dead", severity: "LIFE_SAFETY", location_building: "B1", location_floor: "L1", location_area: "Corridor", photo_ref: "img-ls" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "M1", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R201", photo_ref: "img-m1" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "M2", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R202", photo_ref: "img-m2" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "M3", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R203", photo_ref: "img-m3" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "M4", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R204", photo_ref: "img-m4" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "M5", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R205", photo_ref: "img-m5" }, as: GCInspector }
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${ta}", title: "M6", severity: "MINOR", location_building: "B1", location_floor: "L2", location_area: "R206", photo_ref: "img-m6" }, as: GCInspector }
          trigger:
            - { call: "POST /closeout/projects/${pa}/request-sc-review", as: GCProjectManager, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_OPEN_LIFE_SAFETY_ITEMS  # safety (priority 9) beats minor-count constraint (priority 11)"
            - "Project.${pa}.status == PUNCH_ACTIVE (no transition occurred)"

      - name: item_create_state_error_beats_foreign_trade_referential
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TRADE_NOT_IN_PROJECT]
        distinguishing_aspect: |
          Error-category pair state vs business_referential (different pair than instance
          1): the create violates BOTH (target project MOBILIZED, not PUNCH_ACTIVE; AND the
          trade belongs to a different project); ERR_INVALID_STATE must win over
          ERR_TRADE_NOT_IN_PROJECT.
        test_recipe:
          setup:
            - "Project A (MOBILIZED) with its own trade; Project B (MOBILIZED) whose trade B is foreign to A"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "Proj A", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pa: $.data.id } }
            - { call: "POST /closeout/projects", payload: { name: "Proj B", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { pb: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pa}", trade_name: "ELECTRICAL", responsible_type: "SUBCONTRACTOR", subcontractor_org: "SparkyCo" }, as: GCProjectManager, captures: { ta: $.data.id } }
            - { call: "POST /closeout/trade-packages", payload: { project_id: "${pb}", trade_name: "PLUMBING", responsible_type: "SUBCONTRACTOR", subcontractor_org: "PipeCo" }, as: GCProjectManager, captures: { tb: $.data.id } }
          trigger:
            - { call: "POST /closeout/punch-items", payload: { project_id: "${pa}", trade_package_id: "${tb}", title: "Leak stain", severity: "MINOR", location_building: "B1", location_floor: "L1", location_area: "R101", photo_ref: "img-x" }, as: GCInspector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE  # state (priority 8) beats referential (priority 12)"
            - "No PunchItem created: GET /closeout/punch-items?project_id=${pa} returns total_count == 0"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: sc_minor_allowance_exactly_five_passes_six_fails
        grounds:
          - calculations.sc_eligibility
          - errors[ERR_TOO_MANY_OPEN_MINOR_ITEMS]
        distinguishing_aspect: |
          Boundary on the open-MINOR-count metric via POST request-sc-review: the rule is
          '<= 5', so exactly 5 blocking minors MUST pass and 6 MUST fail with
          ERR_TOO_MANY_OPEN_MINOR_ITEMS (off-by-one in either direction breaks one side).
        test_recipe:
          setup:
            - "Project P5: PUNCH_ACTIVE, trade walked, exactly 5 blocking MINOR items"
            - "Project P6: PUNCH_ACTIVE, trade walked, exactly 6 blocking MINOR items"
          setup_api_calls:
            - { call: "POST /closeout/projects", payload: { name: "P5", contract_value_cents: 10000000, retainage_pct: 0.10, reduction_policy: "STANDARD", warranty_sla_mode: "CALENDAR" }, as: GCProjectManager, captures: { p5: $.data.id } }
