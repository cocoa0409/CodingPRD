        excluded_because:
          difficulty_instance: combinatorial_formula / outreach_ledger_quantizes_each_activity_before_summing
          rationale: "The pinned quantize-then-sum order and its wrong-order counter-value are asserted there."
      - name: posture_constraint_propagation_to_suspension
        claim_type: constraint_propagation
        grounds:
          - calculations.readiness_posture
        excluded_because:
          difficulty_instance: transitive_cascade / contingency_escalation_to_posture_suspension
          rationale: "The propagation from escalated critical deficiencies through the auto PI events to SUSPENDED posture is asserted there."
      - name: registry_compliance_score_two_decimal_precision
        claim_type: precision
        grounds:
