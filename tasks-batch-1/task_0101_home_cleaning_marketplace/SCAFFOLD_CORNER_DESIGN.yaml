        claim_type: violation_to_error
        grounds: ["errors[ERR_CLEANER_NOT_CLEARED]", "validations[priority=6]"]
        distinguishing_aspect: "Owner pins a SUSPENDED cleaner who serves the area on POST /bookings -> ERR_CLEANER_NOT_CLEARED 409 (distinct from ERR_NO_CLEANER_AVAILABLE, which is empty pool / wrong area)."
        test_recipe:
          setup: ["A cleaner activated then SUSPENDED, serving 94110; a customer with a 94110 address; owner pins the suspended cleaner."]
          setup_api_calls:
            - call: "POST /cleaning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /cleaning/pricing-plans"
              payload: { name: "P", base_price_cents: { STUDIO: 6000, ONE_BR: 8000, TWO_BR: 11000, THREE_BR: 14000, FOUR_PLUS_BR: 18000 }, deep_clean_surcharge_pct: 0.50, move_out_surcharge_pct: 0.75, supplies_fee_cents: 1500 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id, plan_v: $.data.version }
            - call: "POST /cleaning/pricing-plans/${plan_id}/activate"
              payload: { expected_plan_version: "${plan_v}" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners"
              payload: { email: "c1@x.com", full_name: "C One", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { cl_id: $.data.id }
            - call: "POST /cleaning/cleaners/${cl_id}/background-checks"
              payload: { provider_ref: "ext-1" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bc_id}/adjudicate"
              payload: { result: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/cleaners/${cl_id}/suspend"
              payload: {}
              as: PlatformAdmin
            - call: "POST /cleaning/customers"
              payload: { email: "cust@x.com", full_name: "Cust" }
              as: Anonymous
              captures: { cu_id: $.data.id }
            - call: "POST /cleaning/addresses"
              payload: { customer_id: "${cu_id}", line1: "1 A St", postal_code: "94110", home_size: "STUDIO" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { ad_id: $.data.id }
          trigger:
            - call: "POST /cleaning/bookings"
              payload: { customer_id: "${cu_id}", address_id: "${ad_id}", pricing_plan_id: "${plan_id}", scheduled_start: "2026-06-10T09:00:00Z", cleaner_id: "${cl_id}" }
              as: Customer
              as_user_id: "${cu_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_CLEANER_NOT_CLEARED"

      - name: activate_terminal_check_failed_cleaner_returns_invalid_state
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]", state_machines.Cleaner.CHECK_PENDING_to_CHECK_FAILED]
        distinguishing_aspect: "Activating a terminal CHECK_FAILED cleaner -> ERR_INVALID_STATE 409 (CHECK_FAILED is in no activate from-set)."
        test_recipe:
          setup: ["A cleaner adjudicated ADVERSE -> terminal CHECK_FAILED."]
          setup_api_calls:
            - call: "POST /cleaning/cleaners"
              payload: { email: "bad@x.com", full_name: "Bad", service_postal_codes: ["94110"] }
              as: Anonymous
              captures: { bad_id: $.data.id }
            - call: "POST /cleaning/cleaners/${bad_id}/background-checks"
              payload: { provider_ref: "ext-bad" }
              as: PlatformAdmin
              captures: { bad_bc_id: $.data.id }
            - call: "POST /cleaning/background-checks/${bad_bc_id}/adjudicate"
              payload: { result: "ADVERSE" }
              as: PlatformAdmin
          trigger:
            - call: "POST /cleaning/cleaners/${bad_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response code == 409"
            - "error_id == ERR_INVALID_STATE"
