          - validations[priority=32]
          - errors[ERR_REPRESENTATIVE_NOT_FOUND]
        distinguishing_aspect: "The designation joins a Veteran and a Representative through two body foreign keys: an unused representative_id returns ERR_REPRESENTATIVE_NOT_FOUND (404), and once both ids resolve the row is created in OFFERED with both foreign keys stored and accepted_at null."
