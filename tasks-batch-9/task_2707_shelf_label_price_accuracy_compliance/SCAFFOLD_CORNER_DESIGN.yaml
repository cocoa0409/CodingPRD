              captures: { ver_3: $.data.version, st_3: $.data.status }
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${ai_a1}", auditor_associate_id: "${pa1}", audit_type: "REGULATORY", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T09:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { au_1: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${au_1}/scan-lines"
              payload: { item_upc: "00000000022001", shelf_price_cents: 449, register_price_cents: 499 }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { sl_1: $.data.id, class_1: $.data.classification }
            - call: "POST /price-integrity/scanner-audits/${au_1}/close"
              payload: { rate_variant: "GROSS_MISMATCH" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { au_ver_1: $.data.version, out_1: $.data.outcome }
            - call: "POST /price-integrity/refund-claims"
              payload: { scan_line_id: "${sl_1}", customer_ref: "CUST-1", expected_scanner_audit_version: "${au_ver_1}" }
              as: CustomerServiceDesk
              captures: { claim_1: $.data.id, claimed_1: $.data.claimed_amount_cents }
            - call: "GET /price-integrity/scanner-audits/${au_1}"
              as: ComplianceOfficer
              captures: { au_ver_1b: $.data.version }
            - call: "POST /price-integrity/regulatory-inspections"
              payload: { store_id: "${store_a}", scanner_audit_id: "${au_1}", inspector_ref: "INS-2026-17", inspection_date: "2026-08-01T10:00:00Z" }
              as: ComplianceOfficer
              captures: { insp_1: $.data.id, insp_ver_0: $.data.version }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/response"
              payload: { remediation_summary: "premature", expected_regulatory_inspection_version: "${insp_ver_0}" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_response_state: $.data.error_id }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/issue-findings"
              payload: { findings: [{ finding_code: "SCANNER_ERROR_RATE", severity: "MAJOR", affected_item_count: 1, affected_aisle_code: "A01" }] }
              as: ComplianceOfficer
              captures: { insp_ver_1: $.data.version }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/response"
              payload: { remediation_summary: "Relabelled the aisle.", expected_regulatory_inspection_version: "${insp_ver_0}" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { e_stale_insp: $.data.error_id }
            - call: "POST /price-integrity/regulatory-inspections/${insp_1}/response"
              payload: { remediation_summary: "Relabelled the aisle.", expected_regulatory_inspection_version: "${insp_ver_1}" }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { insp_ver_2: $.data.version, insp_status_2: $.data.status, round_2: $.data.response_round }
            - call: "POST /price-integrity/scanner-audits/${au_1}/reopen"
              payload: { reopen_reason: "sample disputed" }
              as: ComplianceOfficer
              captures: { au_ver_2: $.data.version, au_out_2: $.data.outcome }
            - call: "POST /price-integrity/scanner-audits/${au_1}/close"
              payload: { rate_variant: "GROSS_MISMATCH" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { au_ver_3: $.data.version, out_3: $.data.outcome }
            - call: "POST /price-integrity/refund-claims"
              payload: { scan_line_id: "${sl_1}", customer_ref: "CUST-2", expected_scanner_audit_version: "${au_ver_1}" }
              as: CustomerServiceDesk
              captures: { e_stale_audit: $.data.error_id }
            - call: "POST /price-integrity/refund-claims"
              payload: { scan_line_id: "${sl_1}", customer_ref: "CUST-2", expected_scanner_audit_version: "${au_ver_3}" }
              as: CustomerServiceDesk
              captures: { claim_2: $.data.id, claim_status_2: $.data.status }
            - call: "GET /price-integrity/scanner-audits/${au_1}"
              as: ComplianceOfficer
              captures: { au_ver_4: $.data.version }
          assert:
            - "${st_1} == DISTRIBUTED with ${ver_1} == ${ver_0} + 1"
            - "The pre-distribute version: HTTP 412 with ${e_stale_file_1} == ERR_STALE_PRICE_CHANGE_FILE_VERSION"
            - "With ${ver_1} the first task is created, and the auto-transition gives ${st_2} == PARTIALLY_EXECUTED with ${ver_2} == ${ver_1} + 1"
            - "Reusing ${ver_1} for the second task: HTTP 412 with ${e_stale_file_2} == ERR_STALE_PRICE_CHANGE_FILE_VERSION — the version that was fresh one call earlier is now stale purely because of the file's own side effect"
            - "With ${ver_2} the second task is created and ${ver_3} == ${ver_2} with ${st_3} == PARTIALLY_EXECUTED: no status change means no bump, so a third task would also use ${ver_2}"
            - "${class_1} == OVERCHARGE, ${out_1} == FAIL and the first claim succeeds with ${claimed_1} == 50 (499 - 449, under the 5000 cap)"
            - "${au_ver_1b} == ${au_ver_1}: creating a refund claim does NOT bump the audit's version, which is why the same captured value stays usable"
            - "Responding to a SCHEDULED inspection with the correct version: HTTP 409 with ${e_response_state} == ERR_INSPECTION_INVALID_STATE — the state check is not bypassed by a valid OCC token"
            - "${insp_ver_1} == ${insp_ver_0} + 1 after issue-findings, so replaying ${insp_ver_0} gives HTTP 412 with ${e_stale_insp} == ERR_STALE_INSPECTION_VERSION"
            - "With ${insp_ver_1}: HTTP 200, ${insp_status_2} == RESPONSE_SUBMITTED, ${round_2} == 1 and ${insp_ver_2} == ${insp_ver_1} + 1"
            - "Reopen gives ${au_ver_2} == ${au_ver_1} + 1 with ${au_out_2} == PENDING, and the re-close gives ${au_ver_3} == ${au_ver_2} + 1 with ${out_3} == FAIL"
            - "The now two-generations-old audit version: HTTP 412 with ${e_stale_audit} == ERR_STALE_SCANNER_AUDIT_VERSION"
            - "With ${au_ver_3}: HTTP 201 with ${claim_status_2} == PENDING, and ${au_ver_4} == ${au_ver_3} confirms the second claim bumped nothing either"

      - name: corner_thirty_day_posture_window_is_inclusive_and_a_reopen_withdraws_the_verdict
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.store_compliance_posture
          - state_machines.ScannerAudit
          - endpoints.GET_/price-integrity/stores/{id}/compliance-summary
        distinguishing_aspect: "The posture's failed-audit input is a rolling 30-day window measured backwards from the logical clock with an inclusive lower bound, and a reopen is a genuine reset rather than a decrement: it nulls closed_at and sets outcome PENDING, so the same audit leaves and re-enters the window as it cycles, and the FROZEN test (>= 2) is separated from the RESTRICTED test (== 1) by exactly one audit."
        test_recipe:
          setup:
            - "One jurisdiction (threshold 2.0) and one store with certified pa1 and two UNASSIGNED aisles, so audit failures produce no accountability actions."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California" }
              as: PricingAdmin
              captures: { jur_a: $.data.id, thr: $.data.scanner_error_rate_threshold_pct }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id, posture_0: $.data.compliance_posture }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-PA1", full_name: "Pat Auditor", role_code: "PRICE_AUDITOR" }
              as: PricingAdmin
              captures: { pa1: $.data.id }
            - call: "POST /price-integrity/associates/${pa1}/training-completions"
              payload: { module_code: "AUDIT_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { ai_a1: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A02", category_code: "BAKERY" }
              as: PricingAdmin
              captures: { ai_a2: $.data.id }
          trigger:
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${ai_a1}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-01T08:00:00Z", scan_window_end: "2026-08-01T09:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { au_1: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${au_1}/scan-lines"
              payload: { item_upc: "00000000023001", shelf_price_cents: 449, register_price_cents: 499 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${au_1}/close"
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { rate_1: $.data.error_rate_pct, out_1: $.data.outcome, closed_1: $.data.closed_at }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { failed_1: $.data.failed_audit_count_30d, posture_1: $.data.compliance_posture }
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /price-integrity/scanner-audits"
              payload: { store_id: "${store_a}", aisle_id: "${ai_a2}", auditor_associate_id: "${pa1}", audit_type: "ROUTINE", scan_window_start: "2026-08-05T08:00:00Z", scan_window_end: "2026-08-05T09:00:00Z" }
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { au_2: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${au_2}/scan-lines"
              payload: { item_upc: "00000000023002", shelf_price_cents: 549, register_price_cents: 599 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${au_2}/close"
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { out_2: $.data.outcome, closed_2: $.data.closed_at }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { failed_2: $.data.failed_audit_count_30d, posture_2: $.data.compliance_posture }
            - call: "POST /price-integrity/scanner-audits/${au_2}/reopen"
              payload: { reopen_reason: "auditor scanned the wrong shelf" }
              as: ComplianceOfficer
              captures: { st_r2: $.data.status, out_r2: $.data.outcome, closed_r2: $.data.closed_at, rate_r2: $.data.error_rate_pct, reopens_r2: $.data.reopen_count }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { failed_3: $.data.failed_audit_count_30d, posture_3: $.data.compliance_posture }
            - call: "POST /price-integrity/scanner-audits/${au_2}/close"
              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { out_4: $.data.outcome, closed_4: $.data.closed_at }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { failed_4: $.data.failed_audit_count_30d, posture_4: $.data.compliance_posture }
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /price-integrity/stores/${store_a}/compliance-summary"
              as: PricingAdmin
              captures: { failed_5: $.data.failed_audit_count_30d, posture_5: $.data.compliance_posture }
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:01Z" }
              as: ComplianceOfficer
            - call: "GET /price-integrity/stores/${store_a}/compliance-summary"
              as: PricingAdmin
              captures: { failed_6: $.data.failed_audit_count_30d, posture_6: $.data.compliance_posture }
            - call: "POST /price-integrity/stores/${store_a}/signage-sweep"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { sweep_posture: $.data.compliance_posture }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { failed_7: $.data.failed_audit_count_30d, posture_7: $.data.compliance_posture }
          assert:
            - "${thr} == 2.0 and ${posture_0} == OPEN on a fresh store"
            - "AU1 closes with ${rate_1} == 100.00 >= 2.0 so ${out_1} == FAIL and ${closed_1} == 2026-08-01T00:00:00Z; ${failed_1} == 1 puts the store at ${posture_1} == RESTRICTED (the equality branch failed_audit_count_30d == 1)"
            - "AU2 closes on 2026-08-05 with ${out_2} == FAIL and ${closed_2} == 2026-08-05T00:00:00Z; ${failed_2} == 2 >= FROZEN_FAILED_AUDIT_COUNT so ${posture_2} == FROZEN"
            - "Reopening AU2 resets rather than decrements: ${st_r2} == REOPENED, ${out_r2} == PENDING, ${closed_r2} == null, ${rate_r2} == null and ${reopens_r2} == 1"
            - "${failed_3} == 1 and ${posture_3} == RESTRICTED — the withdrawn verdict relaxes FROZEN in the same cycle"
            - "Re-closing AU2 re-enters the window with ${out_4} == FAIL and ${closed_4} == 2026-08-05T00:00:00Z (the clock has not moved), so ${failed_4} == 2 and ${posture_4} == FROZEN again"
            - "At clock 2026-08-31T00:00:00Z the window lower bound is exactly 2026-08-01T00:00:00Z, so AU1 is still counted: ${failed_5} == 2 and ${posture_5} == FROZEN (the bound is inclusive)"
            - "One second later the bound is 2026-08-01T00:00:01Z and AU1 drops out: ${failed_6} == 1 and ${posture_6} == RESTRICTED"
            - "${sweep_posture} == RESTRICTED and ${failed_7} == 1 with ${posture_7} == RESTRICTED: moving the clock is not itself a recompute trigger, so the stored posture catches up at the next triggering write (here the signage sweep, which swept zero signs)"

      - name: corner_four_level_cascade_chain_excluded
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        distinguishing_aspect: "A single verify-placement must propagate task -> line -> file -> store in one request, and the chain must stop at each level whose precondition is unmet."
        excluded_because:
          difficulty_instance: verify_placement_cascades_task_to_line_to_file_to_store_posture
          rationale: "That §1.8 instance already walks the full depth-4 chain end-to-end from one verify-placement call, including the partial case where the file has an unverified sibling line and therefore does not reach EXECUTED, which is the ordering-sensitivity claim this row asks for; the opposite cascade direction (bubble-up plus the cross-entity suspension that reverts a placed task) is covered by audit_fail_cascades_action_to_associate_suspension_to_task_revert_to_store."

      - name: corner_both_rate_variants_on_the_same_scan_set_excluded
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        distinguishing_aspect: "The identical scan set must PASS under one variant and FAIL under the other, and both stored rates must be populated regardless of which one was applied."
        excluded_because:
          difficulty_instance: audit_error_rate_gross_vs_net_variant_divergence
          rationale: "That §1.8 instance closes two audits over byte-identical scan sets under GROSS_MISMATCH and NET_OVERCHARGE, asserts both stored rates on both audits and shows the outcome flipping, which is exactly the variant-divergence and variant-selection pair this row asks for; the second dual-variant calculation (accountability scoring) is covered by accountability_score_occurrence_vs_task_weighted_divergence."
      - name: corner_derived_counter_reconciliation_excluded
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
        distinguishing_aspect: "Every derived counter must be correct after a create, after an update and after the source row leaves the counted set, with no incremental drift."
        excluded_because:
          difficulty_instance: label_backlog_counter_survives_reject_replace_and_withdrawal
          rationale: "That §1.8 instance drives the backlog counter through create, rejection, replacement and withdrawal and reconciles it against the underlying rows at every step, and refund_liability_ledger_reconciles_across_approve_pay_and_deny does the same for the money ledger; a §1.9 restatement would add no new failure mode."

  # ==========================================================================
  # Consistency Model (immediate)
  # ==========================================================================
  - section: Consistency Model
    instances:
      - name: corner_every_derived_field_is_final_on_the_first_read_after_the_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.PATCH_/price-integrity/jurisdictions/{id}
          - endpoints.POST_/price-integrity/stores/{id}/signage-sweep
        distinguishing_aspect: "Under immediate consistency there is no lag to hide behind: a jurisdiction PATCH must re-project missing_disclosure_codes on every posted sign before it responds, the operator sweep must return the recomputed posture in its own body, and the compensating removal must restore the counters in the same request — while the one thing that is genuinely deferred (the POSTED -> NON_COMPLIANT status hop) is deferred by declaration, not by staleness, so a sign whose disclosure requirement was just widened is still POSTED and still uncounted until the sweep runs."
        test_recipe:
          setup:
            - "One jurisdiction requiring no disclosures; one store with certified sm1 and aisle A01; one POSTED, fully compliant sign."
          setup_api_calls:
            - call: "POST /price-integrity/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PricingAdmin
            - call: "POST /price-integrity/jurisdictions"
              payload: { code: "US-CA", name: "California", signage_disclosure_codes: [] }
              as: PricingAdmin
              captures: { jur_a: $.data.id, codes_0: $.data.signage_disclosure_codes, jur_ver_0: $.data.version }
            - call: "POST /price-integrity/stores"
              payload: { store_number: "S001", name: "Bay Street", jurisdiction_id: "${jur_a}" }
              as: PricingAdmin
              captures: { store_a: $.data.id }
            - call: "POST /price-integrity/stores/${store_a}/associates"
              payload: { employee_number: "E-SM1", full_name: "Sam Manager", role_code: "STORE_MANAGER" }
              as: PricingAdmin
              captures: { sm1: $.data.id }
            - call: "POST /price-integrity/associates/${sm1}/training-completions"
              payload: { module_code: "LABEL_101", score_pct: 95 }
              as: PricingAdmin
            - call: "POST /price-integrity/stores/${store_a}/aisles"
              payload: { aisle_code: "A01", category_code: "DAIRY" }
              as: PricingAdmin
              captures: { ai_a1: $.data.id }
            - call: "POST /price-integrity/promo-signage"
              payload: { store_id: "${store_a}", aisle_id: "${ai_a1}", sign_code: "SG-1", promo_start_at: "2026-08-01T00:00:00Z", promo_end_at: "2026-08-20T00:00:00Z", disclosure_codes: ["UNIT_PRICE_SHOWN"] }
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { sg_1: $.data.id, miss_0: $.data.missing_disclosure_codes }
            - call: "POST /price-integrity/promo-signage/${sg_1}/post"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_0: $.data.status, state_0: $.data.compliance_state }
          trigger:
            - call: "PATCH /price-integrity/jurisdictions/${jur_a}"
              payload: { signage_disclosure_codes: ["EXPIRY_DATE", "UNIT_PRICE_SHOWN"] }
              as: PricingAdmin
              captures: { codes_1: $.data.signage_disclosure_codes, jur_ver_1: $.data.version }
            - call: "GET /price-integrity/promo-signage/${sg_1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { miss_1: $.data.missing_disclosure_codes, st_1: $.data.status, state_1: $.data.compliance_state }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { viol_1: $.data.signage_violation_count, posture_1: $.data.compliance_posture }
            - call: "POST /price-integrity/stores/${store_a}/signage-sweep"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { swept: $.data.swept_count, expired: $.data.expired_count, noncomp: $.data.non_compliant_count, sweep_posture: $.data.compliance_posture }
            - call: "GET /price-integrity/promo-signage/${sg_1}"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_2: $.data.status, state_2: $.data.compliance_state, miss_2: $.data.missing_disclosure_codes }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { viol_2: $.data.signage_violation_count, posture_2: $.data.compliance_posture }
            - call: "POST /price-integrity/promo-signage/${sg_1}/remove"
              as: StoreManager
              as_user_id: "${sm1}"
              captures: { st_3: $.data.status, state_3: $.data.compliance_state, removed_3: $.data.removed_at }
            - call: "GET /price-integrity/stores/${store_a}"
              as: PricingAdmin
              captures: { viol_3: $.data.signage_violation_count, posture_3: $.data.compliance_posture }
            - call: "GET /price-integrity/stores/${store_a}/compliance-summary"
              as: PricingAdmin
              captures: { viol_4: $.data.signage_violation_count, posture_4: $.data.compliance_posture }
          assert:
            - "${codes_0} == [] so ${miss_0} == [] at draft time, and posting gives ${st_0} == POSTED with ${state_0} == COMPLIANT"
            - "The PATCH returns ${codes_1} == ['EXPIRY_DATE', 'UNIT_PRICE_SHOWN'] with ${jur_ver_1} == ${jur_ver_0} + 1"
            - "The very next read of the sign already shows ${miss_1} == ['EXPIRY_DATE'] — the projection ran inside the PATCH, with the jurisdiction's declared order preserved and the code the sign does carry excluded"
            - "${st_1} == POSTED and ${state_1} == COMPLIANT: the status hop is the sweep's job, so ${viol_1} == 0 and ${posture_1} == OPEN — nothing is silently counted before its transition"
            - "The sweep body itself carries the outcome: ${swept} == 1, ${expired} == 0, ${noncomp} == 1 and ${sweep_posture} == RESTRICTED, with no follow-up read needed"
            - "${st_2} == NON_COMPLIANT with ${state_2} == MISSING_DISCLOSURE and ${miss_2} == ['EXPIRY_DATE'] unchanged"
