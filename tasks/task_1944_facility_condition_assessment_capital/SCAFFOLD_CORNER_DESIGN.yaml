            - "second run with the same captured version fails: err == ERR_STALE_VERSION, http 412 (run of S1 bumped CapitalPlan.version)"
      - name: occ_stale_facility_version_on_plan_create
        claim_type: stale_version
        grounds: ["concurrency_rules[plan-create-stale-facility]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a second plan with a facility version captured before the first plan creation (which bumps Facility.version) fails with ERR_STALE_VERSION."
        test_recipe:
          setup: ["Facility exists; capture its version once"]
          setup_api_calls:
