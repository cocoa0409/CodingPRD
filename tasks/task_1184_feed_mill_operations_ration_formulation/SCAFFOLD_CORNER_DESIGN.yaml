  - section: validations
    instances:
      - name: nonexistent_batch_start_returns_404
        claim_type: priority_ordering
        grounds: ["validations[priority=4]", "validations[priority=6]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Existence (priority 4) beats state (priority 6): starting a batch id that does not exist returns 404, never a state error."
        test_recipe:
          setup: ["an operator employee exists"]
          setup_api_calls:
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
          trigger:
            - { call: "POST /api/batches/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/start", payload: {}, as: Operator, as_user_id: "${op_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND, http 404"

      - name: schema_invalid_request_beats_forbidden_role
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Request-schema validation (priority 2) runs before role authorization (priority 3): a Customer posting a malformed ingredient body gets 400 ERR_INVALID_REQUEST, not 403."
        test_recipe:
          setup: ["a customer exists"]
          setup_api_calls:
