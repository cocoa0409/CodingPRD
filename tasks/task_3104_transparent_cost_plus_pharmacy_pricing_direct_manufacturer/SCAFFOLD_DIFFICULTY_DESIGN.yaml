  - rule_id: compensating_invariant
    instances:

      - name: order_cancellation_conserves_the_patient_price_decomposition
        grounds:
          - state_machines.Order.transitions.PAID_to_CANCELED
          - calculations.order_price
          - entities.Order.fields.patient_price_cents
          - entities.Order.fields.acquisition_cost_cents
          - endpoints.POST_/orders/{id}/cancellation
        distinguishing_aspect: >
          The forward action (payment) settles a money decomposition and the
          compensating action (cancellation of the PAID order) restores the consumed
          intake capacity while leaving every cent of that decomposition unchanged:
          the conserved quantity is the patientPrice identity
          acquisition_cost_cents + markup_cents + pharmacy_fee_cents + shipping_fee_cents
