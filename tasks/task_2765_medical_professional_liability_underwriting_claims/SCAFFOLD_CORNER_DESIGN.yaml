              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "GET /mpl/policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "GET /mpl/policy-terms/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-1"
            - call: "GET /mpl/tail-endorsements/00000000-0000-4000-8000-000000000000"
              payload: {}
