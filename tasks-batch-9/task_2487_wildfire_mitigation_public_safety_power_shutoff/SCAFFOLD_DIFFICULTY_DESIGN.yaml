              as: MeteorologyAnalyst
              captures: { fpi_g_id: $.data.id }
            - call: "POST /customers"
              payload: { account_number: "ACC-G1", circuit_id: "${golf_id}", customer_class: "CRITICAL_FACILITY", medical_baseline: false, preferred_language: "EN", notification_channels: ["VOICE"], accessibility_needs: [], address_zone_code: "ZG" }
              as: GridPlanner
            - call: "POST /customers"
              payload: { account_number: "ACC-G2", circuit_id: "${golf_id}", customer_class: "RESIDENTIAL", medical_baseline: true, preferred_language: "EN", notification_channels: ["SMS"], accessibility_needs: [], address_zone_code: "ZG" }
              as: GridPlanner
            - call: "POST /psps-events"
              payload: { event_code: "EV-G", trigger_fire_potential_index_id: "${fpi_g_id}", forecast_onset_at: "2026-08-25T00:00:00Z", forecast_all_clear_at: "2026-08-28T00:00:00Z" }
              as: PSPSDutyOfficer
              captures: { evg_id: $.data.id, evg_v0: $.data.version }
            - call: "POST /psps-events/${evg_id}/scope"
              payload: { expected_psps_event_version: "${evg_v0}" }
