      - name: state_machine_parallel_dimensions_of_the_usage_report
        claim_type: parallel transitions
        grounds:
          - state_machines.UsageReport.status
          - state_machines.UsageReport.fee_status
        excluded_because:
          difficulty_instance: non_linear_state_machine / usage_report_status_and_fee_status_dimensions_advance_independently
          rationale: >-
            That SS1.8 instance already walks both UsageReport dimensions in one chain and asserts that ACCEPT advances status and fee_status together while REMIT advances fee_status alone and RECONCILE advances status alone, which is exactly the parallel-dimension claim.
      - name: state_machine_cascade_down_from_a_substantiated_complaint
        claim_type: Cascade down
        grounds:
          - state_machines.MemberComplaint.status.UNDER_INVESTIGATION_to_SUBSTANTIATED
          - state_machines.Supplier.qualification_status.QUALIFIED_to_SUSPENDED
          - state_machines.PiggybackAnalysis.status.DETERMINED_to_VOIDED
        excluded_because:
          difficulty_instance: transitive_cascade / substantiated_complaint_cascades_five_hops_to_voided_piggyback_authority
          rationale: >-
            That SS1.8 instance asserts all five downward hops of the substantiation cascade with a contrasting two-hop control case, so a separate Cascade down corner would restate it.
      - name: state_machine_compensating_transition_on_an_overturned_appeal
        claim_type: Compensation
        grounds:
          - state_machines.MemberComplaint.status.APPEALED_to_OVERTURNED
          - calculations.supplier_performance_score
        excluded_because:
          difficulty_instance: compensating_invariant / overturned_appeal_reverses_points_exactly_without_reviving_suspensions
          rationale: >-
            That SS1.8 instance asserts the exact point reversal, the restored score and tier, and the deliberate non-revival of the suspension and of the voided analyses, which is the whole Compensation claim.
      - name: state_machine_cyclic_member_document_request_loop
        claim_type: cyclic transitions
        grounds:
          - state_machines.MemberAgency.registration_status.PENDING_VERIFICATION_to_DOCS_REQUESTED
          - state_machines.MemberAgency.registration_status.DOCS_REQUESTED_to_PENDING_VERIFICATION
          - errors.ERR_DOCS_REQUEST_ROUNDS_EXHAUSTED
        excluded_because:
          difficulty_instance: non_linear_state_machine / member_docs_request_cycle_exhausts_at_three_rounds_yet_verify_remains_open
          rationale: >-
            That SS1.8 instance already runs the full cycle to budget exhaustion and asserts that the exhausted loop leaves VERIFY reachable, which is the cyclic-shape claim.
      - name: state_machine_guarded_usage_creation_under_a_watch_posture
        claim_type: guarded transitions
        grounds:
          - state_machines.ContractUsage.status.RECORDED
          - state_machines.MasterContract.compliance_posture
          - errors.ERR_CONTRACT_POSTURE_DELINQUENT
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / usage_gated_by_amount_branch_posture_while_the_contract_stays_active
          rationale: >-
            That SS1.8 instance asserts that usage creation is guarded by the parent posture even while the parent status stays ACTIVE, and contrasts WATCH (permitted) against DELINQUENT (refused), which is the guarded-transition claim.

