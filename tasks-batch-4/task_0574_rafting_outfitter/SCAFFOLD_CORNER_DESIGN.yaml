        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-create-stale-trip]", "entities.RiverTrip.fields.version"]
        distinguishing_aspect: "A create carrying the current (freshly-read) expected_trip_version succeeds 201 and increments RiverTrip.version by 1."
        test_recipe:
          setup: ["A trip; client reads the current version immediately before creating."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "OCC2", difficulty_class: "CLASS_II", trip_date: "2026-08-29T09:00:00Z", end_time: "2026-08-29T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id, trip_v: $.data.version }
          trigger:
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { new_v: $.data.version }
          assert:
            - "HTTP status == 201 for the reservation create"
            - "RiverTrip.${trip_id}.version == 2 (incremented by 1 from the initial 1)"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: confirm_reflects_new_state_in_same_response
        claim_type: immediate
        grounds: ["state_machines.Reservation.PENDING_to_CONFIRMED"]
        distinguishing_aspect: "The confirm response body shows fulfillment_status == CONFIRMED immediately (immediate consistency, no read-after-write lag)."
        test_recipe:
          setup: ["An OPEN trip (1 guide) with a PENDING reservation."]
          setup_api_calls:
            - call: "POST /trips"
              payload: { river_name: "Imm", difficulty_class: "CLASS_III", trip_date: "2026-08-30T09:00:00Z", end_time: "2026-08-30T15:00:00Z", put_in_location: "A", take_out_location: "B", max_capacity: 12, guide_ratio_max: 6, base_rate_cents: 12000, safe_flow_min: 800, safe_flow_max: 3000, marginal_flow_max: 4000 }
              as: OutfitterManager
              captures: { trip_id: $.data.id }
            - call: "POST /guides"
              payload: { full_name: "G", max_class: "CLASS_III" }
              as: OutfitterManager
              captures: { guide_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { trip_id: "${trip_id}", guide_id: "${guide_id}", role: "LEAD" }
              as: OutfitterManager
            - call: "POST /trips/${trip_id}/open"
              payload: {}
              as: OutfitterManager
            - call: "GET /trips/${trip_id}"
              payload: {}
              as: Reservationist
              captures: { trip_v: $.data.version }
            - call: "POST /reservations"
              payload: { trip_id: "${trip_id}", booking_type: "GROUP", party_size: 1, deposit_cents: 3000, expected_trip_version: "${trip_v}" }
              as: Reservationist
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /reservations/${res_id}/confirm"
              payload: {}
              as: Reservationist
              captures: { fs: $.data.fulfillment_status }
          assert:
            - "confirm response.data.fulfillment_status == CONFIRMED"

