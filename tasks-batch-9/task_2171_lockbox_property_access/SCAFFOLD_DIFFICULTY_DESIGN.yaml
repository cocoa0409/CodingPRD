            - call: "GET /lockbox-placements/${pC_id}"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
              captures: { pC_v: $.data.version }
            - call: "POST /lockbox-placements/${pC_id}/state"
              payload: { action: "REMOVE", expected_placement_version: "${pC_v}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /associations/${assoc_id}/compliance-runs"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "GET /associations/${assoc_id}/recovery-summary?variant=closing_cohort&window_start=2026-06-01T00:00:00Z&window_end=2026-08-31T00:00:00Z"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "GET /associations/${assoc_id}/recovery-summary?variant=removal_activity&window_start=2026-06-01T00:00:00Z&window_end=2026-08-31T00:00:00Z"
              payload: {}
              as: AssociationAdmin
              as_user_id: "admin-1"
          assert:
            - "closing_cohort response has denominator_count == 2, numerator_count == 1, recovery_rate_pct == 50.00"
            - "removal_activity response has denominator_count == 3, numerator_count == 2, recovery_rate_pct == 66.67"
            - "GET /lockbox-placements/${pA_id} returns placement_status == \"REMOVED\" and on_time == true"
            - "GET /lockbox-placements/${pB_id} returns placement_status == \"DELINQUENT\" and billing_status == \"ACCRUED\""
            - "GET /lockbox-placements/${pC_id} returns placement_status == \"REMOVED\" and on_time == false"

  - rule_id: combinatorial_formula
    instances:
      - name: incident_risk_score_nested_multiplier_product_mode_a
        grounds:
          - calculations.incident_risk_score
          - calculations.access_outcome_resolution
          - state_machines.IncidentReview.OPEN_to_EVIDENCE_LOCKED
          - entities.AccessEvent.fields.risk_weight
        distinguishing_aspect: |
          Mode (a): risk_weight is a three-factor non-linear product (outcome weight x after-hours
          multiplier x actor multiplier) fed into a clamped sum with a conditional unmatched-showing
          penalty; three events yield exactly 81.75 and severity CRITICAL.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-06T00:00:00Z"
            - "Ana (m1) ACTIVE with one ACTIVE KEY_APP credential; LB-0001 assigned to Ana and PLACED on listing MLS-1001"
            - "No CONFIRMED showing exists on that listing, so a GRANTED member event stays unmatched"
            - "Three access events land in the review window: 02:30Z anonymous denial, 10:00Z granted member entry, 21:15Z denial on a credential suspended in between"
          setup_api_calls:
            - call: "POST /associations"
              payload: { name: "Cascade Regional Association", jurisdiction_code: "WA-KING" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { assoc_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T00:00:00Z" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /members"
              payload: { association_id: "${assoc_id}", full_name: "Ana Reyes", email: "ana@example.com", dues_paid_through: "2027-01-31" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id, m1_v: $.data.version }
            - call: "POST /access-credentials"
              payload: { member_id: "${m1_id}", credential_type: "KEY_APP", expires_at: "2027-06-30T00:00:00Z", expected_member_version: "${m1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /access-credentials/${c1_id}/state"
              payload: { action: "ACTIVATE", expected_credential_version: "${c1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { c1_v2: $.data.version }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_PRO", replacement_cost_cents: 12000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id, box1_v: $.data.version }
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "ASSIGN", member_id: "${m1_id}", expected_lockbox_version: "${box1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /listings"
              payload: { association_id: "${assoc_id}", listing_agent_id: "${m1_id}", address_line: "12 Pine St", mls_number: "MLS-1001" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { lst1_id: $.data.id }
            - call: "POST /lockbox-placements"
              payload: { lockbox_id: "${box1_id}", listing_id: "${lst1_id}" }
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /_devices/access-attempts"
              payload: { lockbox_id: "${box1_id}", actor_type: "UNKNOWN", occurred_at: "2026-08-06T02:30:00Z" }
              as: LockboxDevice
              as_user_id: "device-gw-1"
              captures: { ev1_id: $.data.id }
            - call: "POST /_devices/access-attempts"
              payload: { lockbox_id: "${box1_id}", actor_type: "MEMBER", credential_id: "${c1_id}", occurred_at: "2026-08-06T10:00:00Z" }
              as: LockboxDevice
              as_user_id: "device-gw-1"
              captures: { ev2_id: $.data.id }
            - call: "POST /access-credentials/${c1_id}/state"
              payload: { action: "SUSPEND", expected_credential_version: "${c1_v2}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /_devices/access-attempts"
              payload: { lockbox_id: "${box1_id}", actor_type: "CONTRACTOR", credential_id: "${c1_id}", occurred_at: "2026-08-06T21:15:00Z" }
              as: LockboxDevice
              as_user_id: "device-gw-1"
              captures: { ev3_id: $.data.id }
            - call: "POST /incident-reviews"
              payload: { association_id: "${assoc_id}", window_start: "2026-08-06T00:00:00Z", window_end: "2026-08-06T23:59:59Z", lockbox_id: "${box1_id}" }
              as: SecurityAuditor
              as_user_id: "auditor-1"
              captures: { rev_id: $.data.id, rev_v: $.data.version }
          trigger:
            - call: "POST /incident-reviews/${rev_id}/state"
              payload: { action: "LOCK_EVIDENCE", expected_review_version: "${rev_v}" }
              as: SecurityAuditor
              as_user_id: "auditor-1"
          assert:
            - "GET /incident-reviews/${rev_id} returns status == \"EVIDENCE_LOCKED\""
            - "GET /incident-reviews/${rev_id} returns event_count == 3"
            - "GET /incident-reviews/${rev_id} returns risk_score == 81.75"
            - "GET /incident-reviews/${rev_id} returns severity == \"CRITICAL\""
            - "GET /access-events/${ev1_id} returns outcome == \"DENIED_NO_CREDENTIAL\", after_hours == true, risk_weight == 36.00"
            - "GET /access-events/${ev2_id} returns outcome == \"GRANTED\", after_hours == false, risk_weight == 2.00, matched_appointment_id == null"
            - "GET /access-events/${ev3_id} returns outcome == \"DENIED_CREDENTIAL_INACTIVE\", after_hours == true, risk_weight == 33.75"

      - name: member_balance_per_line_surcharge_rounding_mode_b
        grounds:
          - calculations.member_statement_balance
          - calculations.late_removal_penalty
          - entities.Member.fields.outstanding_balance_cents
          - endpoints["POST /associations/{associationId}/compliance-runs"]
        distinguishing_aspect: |
          Mode (b): the 2.5% administration surcharge is rounded PER CHARGE LINE and then summed —
          two 1500-cent LATE_REMOVAL lines give outstanding_balance_cents == 3076, whereas the
          sum-then-round reading gives 3075.
