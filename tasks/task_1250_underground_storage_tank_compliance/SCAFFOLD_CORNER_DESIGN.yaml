            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}" }
          trigger:
            - { call: "POST /service-orders/${so}/results", payload: { readings: { leak_rate_gph: 0.5 } }, as: Technician, as_user_id: "${t_tt}" }
            - { call: "GET /deficiencies?source_service_order_id=${so}", as: Any, captures: { d_sev: "$.data[0].severity", d_origin: "$.data[0].origin", d_deadline: "$.data[0].correction_deadline" } }
            - { call: "GET /release-events?tank_system_id=${tank}", as: Any, captures: { rel_status: "$.data[0].status", rel_deadline: "$.data[0].report_deadline" } }
            - { call: "GET /tank-systems/${tank}", as: Any, captures: { tank_status: $.data.status } }
            - { call: "GET /facilities/${fac}", as: Any, captures: { fac_score: $.data.posture_score, fac_posture: $.data.compliance_posture } }
          assert:
            - "${d_sev} == CRITICAL and ${d_origin} == TEST_FAILURE"
            - "${d_deadline} == 2026-05-09T10:30:00Z (created_at 2026-05-02T10:30:00Z + CRITICAL 7 days)"
            - "${rel_status} == SUSPECTED and ${rel_deadline} == 2026-05-03T10:30:00Z (discovered_at = result clock + 24h)"
            - "${tank_status} == TEMPORARILY_CLOSED (CRITICAL deficiency cascade)"
            - "${fac_score} == 65 and ${fac_posture} == DEFICIENT (100 - 25 CRITICAL - 10 open release)"

      - name: schedule_moves_linked_deficiency_to_retest_scheduled
        claim_type: side_effect_execution
        grounds:
          - state_machines.Deficiency.CORRECTED_to_RE_TEST_SCHEDULED
        excluded_because:
          difficulty_instance: deficiency_retest_loop_after_failed_verify
          rationale: "The d_mid1 == RE_TEST_SCHEDULED assertion inside that §1.8 instance exercises exactly this system transition as a side effect of scheduling a linked order."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: cp_survey_dual_criterion_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.cp_survey_determination
        excluded_because:
          difficulty_instance: cp_survey_criterion_divergence_same_readings
          rationale: "§1.8 instance asserts FAIL vs PASS outcomes for identical voltage triples under the two criteria."

      - name: fund_claim_variant_payable_divergence
        claim_type: variant_divergence
        grounds:
          - calculations.fund_reimbursement_amount
        excluded_because:
          difficulty_instance: fund_claim_election_changes_payable
          rationale: "§1.8 instance pins both variants' deductible and payable literals on identical expense lines."

      - name: quote_rounding_order_pinned
        claim_type: precision
        grounds:
          - calculations.service_quote_total
        excluded_because:
          difficulty_instance: quote_per_line_rounding_beats_sum_rounding
          rationale: "§1.8 instance pins the per-line-then-sum rounding order with the 25002 vs 25001 discriminator."

      - name: posture_weighted_score_and_tiers
        claim_type: correct_result
        grounds:
          - calculations.compliance_posture_score
        excluded_because:
          difficulty_instance: posture_score_weighted_sum_tier_boundary
          rationale: "§1.8 instance pins the weighted sum at 85/70/85 across the tier boundary."

      - name: test_schedule_projection_intervals
        claim_type: correct_result
        grounds:
          - calculations.test_schedule_projection
        distinguishing_aspect: "Forward-looking projection applies per-mode applicability and per-type intervals: ATG tank gets annual tightness; interstitial tank with gravity piping and no components projects an empty schedule."
        test_recipe:
          setup:
            - "Facility ACTIVE with tank1 (ATG_INVENTORY, PRESSURIZED, STEEL, installed 2018-01-01) carrying LINE_LEAK_DETECTOR, CATHODIC_PROTECTION, and SPILL_BUCKET components, never tested"
            - "tank2 (INTERSTITIAL_MONITORING, GRAVITY, FRP, installed 2018-01-01) with no components"
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Schedule Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank1: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T2", substance: "KEROSENE", capacity_gallons: 5000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "GRAVITY", release_detection_mode: "INTERSTITIAL_MONITORING" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank2: $.data.id } }
            - { call: "POST /components", payload: { tank_system_id: "${tank1}", component_type: "LINE_LEAK_DETECTOR", install_date: "2018-01-01T00:00:00Z", serial_no: "LLD-1" }, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank1}", component_type: "CATHODIC_PROTECTION", install_date: "2018-01-01T00:00:00Z", serial_no: "CP-1" }, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank1}", component_type: "SPILL_BUCKET", install_date: "2018-01-01T00:00:00Z", serial_no: "SB-1" }, as: FacilityOwner, as_user_id: "owner-1" }
          trigger:
            - { call: "GET /tank-systems/${tank1}/test-schedule", as: Any }
            - { call: "GET /tank-systems/${tank2}/test-schedule", as: Any }
          assert:
            - "tank1 schedule has 5 items sorted by due_at ASC then test_type name ASC: LINE_TIGHTNESS 2019-01-01T00:00:00Z, LLD_FUNCTION 2019-01-01T00:00:00Z, TANK_TIGHTNESS 2019-01-01T00:00:00Z, CP_SURVEY 2021-01-01T00:00:00Z, SPILL_OVERFILL_INSPECTION 2021-01-01T00:00:00Z"
            - "tank2 schedule items == [] (INTERSTITIAL_MONITORING exempts tank tightness; GRAVITY exempts line tightness; no components => no LLD/CP/spill items)"

      - name: training_expiry_months_per_class
        claim_type: constants_applied
        grounds:
          - calculations.training_certificate_expiry
          - entities.TrainingRecord.fields.expires_at
        distinguishing_aspect: "VALIDITY_MONTHS constants are applied per class: class A 36 months and class C 12 months from the same completed_at produce different expires_at literals."
        test_recipe:
          setup: ["Facility with a class-A operator and a class-C operator; a trainer technician"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Expiry Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Trainer", endorsements: [], trainer: true }, as: ContractorAdmin, captures: { t_tr: $.data.id } }
            - { call: "POST /operators", payload: { facility_id: "${fac}", full_name: "Op A", operator_class: "A" }, as: FacilityOwner, as_user_id: "owner-1", captures: { opA: $.data.id } }
            - { call: "POST /operators", payload: { facility_id: "${fac}", full_name: "Op C", operator_class: "C" }, as: FacilityOwner, as_user_id: "owner-1", captures: { opC: $.data.id } }
          trigger:
            - { call: "POST /training-records", payload: { operator_id: "${opA}", course_class: "A", completed_at: "2026-01-10T00:00:00Z" }, as: Technician, as_user_id: "${t_tr}", captures: { expA: $.data.expires_at } }
            - { call: "POST /training-records", payload: { operator_id: "${opC}", course_class: "C", completed_at: "2026-01-10T00:00:00Z" }, as: Technician, as_user_id: "${t_tr}", captures: { expC: $.data.expires_at } }
            - { call: "GET /training-records?operator_id=${opA}", as: Any }
            - { call: "GET /operators?facility_id=${fac}", as: Any }
          assert:
            - "${expA} == 2029-01-10T00:00:00Z (36 months)"
            - "${expC} == 2027-01-10T00:00:00Z (12 months)"
            - "GET /training-records?operator_id=${opA} returns total_count 1"
            - "GET /operators?facility_id=${fac} returns total_count 2"

      - name: release_report_deadline_late_and_on_time
        claim_type: correct_result
        grounds:
          - calculations.release_report_deadline
          - entities.ReleaseEvent.fields.late_notification
        distinguishing_aspect: "report_deadline = discovered_at + 24h; confirming 49h after discovery is late, dismissing 12h after is not — strict > boundary on the same metric in both directions."
        test_recipe:
          setup: ["Facility; logical clock movable"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Deadline Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-02T08:00:00Z", source_description: "r1" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel1: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-04T09:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /release-events/${rel1}/confirm", payload: {}, as: StateRegulator, captures: { r1_late: $.data.late_notification, r1_deadline: $.data.report_deadline, r1_reported: $.data.reported_to_state_at } }
            - { call: "POST /release-events", payload: { facility_id: "${fac}", discovered_at: "2026-05-05T08:00:00Z", source_description: "r2" }, as: FacilityOwner, as_user_id: "owner-1", captures: { rel2: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T20:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /release-events/${rel2}/dismiss", payload: {}, as: StateRegulator, captures: { r2_late: $.data.late_notification, r2_deadline: $.data.report_deadline } }
          assert:
            - "${r1_deadline} == 2026-05-03T08:00:00Z and ${r1_reported} == 2026-05-04T09:00:00Z and ${r1_late} == true (49h > 24h)"
            - "${r2_deadline} == 2026-05-06T08:00:00Z and ${r2_late} == false (12h < 24h)"

      - name: spill_overfill_boundary_values_pass
        claim_type: correct_result
        grounds:
          - calculations.test_result_determination
        distinguishing_aspect: "Spill/overfill inclusive bounds: drain hold of exactly 5 minutes and overfill activation at exactly 95.0% both PASS; hold of 4 minutes FAILs."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE with SPILL_BUCKET component; two INSPECTOR-endorsed spill orders scheduled on non-overlapping windows"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Spill Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "SPILL_BUCKET", install_date: "2018-01-01T00:00:00Z", serial_no: "SB-9" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "Insp", endorsements: ["INSPECTOR"], trainer: false }, as: ContractorAdmin, captures: { t_in: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "SPILL_OVERFILL_INSPECTION", component_id: "${comp}", line_items: [{ description: "s1", qty: 1, unit_price_cents: 30000 }] }, as: ContractorAdmin, captures: { so1: $.data.id } }
            - { call: "POST /service-orders/${so1}/schedule", payload: { technician_id: "${t_in}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "SPILL_OVERFILL_INSPECTION", component_id: "${comp}", line_items: [{ description: "s2", qty: 1, unit_price_cents: 30000 }] }, as: ContractorAdmin, captures: { so2: $.data.id } }
            - { call: "POST /service-orders/${so2}/schedule", payload: { technician_id: "${t_in}", window_start: "2026-05-03T10:00:00Z", window_end: "2026-05-03T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so1}/start", payload: {}, as: Technician, as_user_id: "${t_in}" }
          trigger:
            - { call: "POST /service-orders/${so1}/results", payload: { readings: { visual_cracks_found: false, drain_test_hold_minutes: 5, overfill_activates_pct: 95.0 } }, as: Technician, as_user_id: "${t_in}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so2}/start", payload: {}, as: Technician, as_user_id: "${t_in}" }
            - { call: "POST /service-orders/${so2}/results", payload: { readings: { visual_cracks_found: false, drain_test_hold_minutes: 4, overfill_activates_pct: 95.0 } }, as: Technician, as_user_id: "${t_in}" }
            - { call: "GET /result-records?service_order_id=${so1}", as: Any, captures: { o1: "$.data[0].outcome" } }
            - { call: "GET /result-records?service_order_id=${so2}", as: Any, captures: { o2: "$.data[0].outcome" } }
            - { call: "GET /components?tank_system_id=${tank}", as: Any }
          assert:
            - "${o1} == PASS (hold 5 >= 5 inclusive; overfill 95.0 <= 95.0 inclusive; no cracks)"
            - "${o2} == FAIL (hold 4 < 5)"
            - "A MAJOR Deficiency exists with source_service_order_id == ${so2}; none for ${so1}"
            - "GET /components?tank_system_id=${tank} returns the SPILL_BUCKET component (total_count 1)"

      - name: lld_result_determination
        claim_type: correct_result
        grounds:
          - calculations.test_result_determination
        distinguishing_aspect: "LLD_FUNCTION outcome is a pure boolean gate on detects_simulated_leak: false FAILs and opens a MAJOR deficiency on the LINE_LEAK_DETECTOR component."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE with LINE_LEAK_DETECTOR component; LLD order started"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "LLD Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /components", payload: { tank_system_id: "${tank}", component_type: "LINE_LEAK_DETECTOR", install_date: "2018-01-01T00:00:00Z", serial_no: "LLD-9" }, as: FacilityOwner, as_user_id: "owner-1", captures: { comp: $.data.id } }
            - { call: "POST /technicians", payload: { full_name: "LLD Tech", endorsements: ["LLD_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_lld: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "LLD_FUNCTION", component_id: "${comp}", line_items: [{ description: "lld", qty: 1, unit_price_cents: 25000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_lld}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:30:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_lld}" }
          trigger:
            - { call: "POST /service-orders/${so}/results", payload: { readings: { detects_simulated_leak: false } }, as: Technician, as_user_id: "${t_lld}" }
            - { call: "GET /result-records?service_order_id=${so}", as: Any, captures: { outcome: "$.data[0].outcome" } }
            - { call: "GET /deficiencies?source_service_order_id=${so}", as: Any, captures: { d_sev: "$.data[0].severity" } }
            - { call: "GET /components/${comp}", as: Any, captures: { comp_status: $.data.status } }
          assert:
            - "${outcome} == FAIL"
            - "${d_sev} == MAJOR (LLD failure is not a tank/line leak — no CRITICAL, no ReleaseEvent created)"
            - "${comp_status} == DEFICIENT"
            - "No ReleaseEvent exists with tank_system_id == ${tank} (total_count 0)"

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_header_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A call without X-User-Role/X-User-ID fails priority-1 with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /facilities"
              payload: { facility_name: "NoAuth", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }
          assert:
            - "Error response: error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400 (no role/identity headers sent)"

      - name: wrong_role_facility_create_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "POST /facilities is exclusive to FacilityOwner; a Technician caller gets 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["A technician exists to supply a concrete identity"]
          setup_api_calls:
            - { call: "POST /technicians", payload: { full_name: "T", endorsements: [], trainer: false }, as: ContractorAdmin, captures: { t1: $.data.id } }
          trigger:
            - call: "POST /facilities"
              payload: { facility_name: "WrongRole", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }
              as: Technician
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INSUFFICIENT_PERMISSIONS with http 403"

      - name: non_owner_activate_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "FacilityOwner role alone is insufficient: X-User-ID must equal the facility's owner_account_id, so owner-2 activating owner-1's facility gets 403 ERR_NOT_RESOURCE_OWNER."
        test_recipe:
          setup: ["Facility owned by owner-1 with one tank (activation preconditions otherwise met)"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "Owned", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1" }
          trigger:
            - call: "POST /facilities/${fac}/activate"
              payload: {}
              as: FacilityOwner
              as_user_id: "owner-2"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_NOT_RESOURCE_OWNER with http 403"

      - name: duplicate_tank_tag_rejected_and_scoped_per_facility
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_TANK_TAG]
        distinguishing_aspect: "tank_tag uniqueness is scoped per facility: a duplicate within the same facility conflicts, while the same tag under a different facility succeeds."
        test_recipe:
          setup: ["Facilities F1 and F2; tank T1 under F1 with tag DUP"]
          setup_api_calls:
            - { call: "POST /facilities", payload: { facility_name: "F1", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac1: $.data.id } }
            - { call: "POST /facilities", payload: { facility_name: "F2", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-2", captures: { fac2: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac1}", tank_tag: "DUP", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1" }
          trigger:
            - call: "POST /tank-systems"
              payload: { facility_id: "${fac1}", tank_tag: "DUP", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2019-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "INTERSTITIAL_MONITORING" }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
            - call: "POST /tank-systems"
              payload: { facility_id: "${fac2}", tank_tag: "DUP", substance: "GASOLINE", capacity_gallons: 8000, installed_on: "2019-01-01T00:00:00Z", tank_construction: "FRP", piping_type: "SUCTION", release_detection_mode: "INTERSTITIAL_MONITORING" }
              as: FacilityOwner
              as_user_id: "owner-2"
              captures: { t_ok: $.data.id }
            - { call: "GET /tank-systems?facility_id=${fac1}", as: Any }
          assert:
            - "${err} == ERR_DUPLICATE_TANK_TAG with http 409"
            - "${t_ok} non-null (same tag under a different facility is a different scope)"
            - "GET /tank-systems?facility_id=${fac1} returns total_count 1"

      - name: duplicate_release_detection_record_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_RECORD]
        distinguishing_aspect: "(tank_system_id, period_month) is unique; the second record for the same pair fails with ERR_DUPLICATE_RECORD while a different month succeeds."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; one record for 2026-04 exists"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Dup Rec", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /release-detection-records", payload: { tank_system_id: "${tank}", period_month: "2026-04", readings_summary: { log: "april" } }, as: FacilityOwner, as_user_id: "owner-1" }
          trigger:
            - call: "POST /release-detection-records"
              payload: { tank_system_id: "${tank}", period_month: "2026-04", readings_summary: { log: "april again" } }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { err: $.data.error_id }
            - call: "POST /release-detection-records"
              payload: { tank_system_id: "${tank}", period_month: "2026-05", readings_summary: { log: "may" } }
              as: FacilityOwner
              as_user_id: "owner-1"
              captures: { rec2: $.data.id }
            - { call: "GET /release-detection-records?tank_system_id=${tank}", as: Any }
          assert:
            - "${err} == ERR_DUPLICATE_RECORD with http 409"
            - "${rec2} non-null (different period_month is a different uniqueness key)"
            - "GET /release-detection-records?tank_system_id=${tank} returns total_count 2 (2026-04 and 2026-05)"

      - name: schedule_window_end_before_start_invalid
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - errors[ERR_INVALID_WINDOW]
        distinguishing_aspect: "window_end equal to window_start is rejected (strictly-after rule): the window is a non-degenerate half-open interval."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; REQUESTED order; endorsed technician"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Window Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
          trigger:
            - call: "POST /service-orders/${so}/schedule"
              payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T10:00:00Z" }
              as: ContractorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_WINDOW (zero-length window violates end > start)"

      - name: start_outside_window_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=14]
          - errors[ERR_OUTSIDE_SERVICE_WINDOW]
        distinguishing_aspect: "Starting before window_start fails; starting exactly at window_start succeeds (inclusive lower bound of the start gate)."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; order SCHEDULED [2026-05-02T10:00, 11:00); clock at 2026-05-02T09:00"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Start Gate", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /technicians", payload: { full_name: "TT", endorsements: ["TIGHTNESS_TESTER"], trainer: false }, as: ContractorAdmin, captures: { t_tt: $.data.id } }
            - { call: "POST /service-orders", payload: { facility_id: "${fac}", tank_system_id: "${tank}", service_type: "TANK_TIGHTNESS", line_items: [{ description: "t", qty: 1, unit_price_cents: 60000 }] }, as: ContractorAdmin, captures: { so: $.data.id } }
            - { call: "POST /service-orders/${so}/schedule", payload: { technician_id: "${t_tt}", window_start: "2026-05-02T10:00:00Z", window_end: "2026-05-02T11:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T09:00:00Z" }, as: ContractorAdmin }
          trigger:
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-02T10:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /service-orders/${so}/start", payload: {}, as: Technician, as_user_id: "${t_tt}", captures: { so_status: $.data.status, so_perf: $.data.performed_by_technician_id } }
          assert:
            - "${err} == ERR_OUTSIDE_SERVICE_WINDOW (09:00 < window_start)"
            - "${so_status} == IN_PROGRESS at exactly window_start (inclusive lower bound)"
            - "${so_perf} == ${t_tt} (performed_by pinned at start for segregation)"

      - name: future_period_record_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=15]
          - errors[ERR_FUTURE_PERIOD]
        distinguishing_aspect: "A release-detection record for a period after the clock's current month is rejected; the current month itself is allowed."
        test_recipe:
          setup: ["Facility ACTIVE, tank IN_SERVICE; clock 2026-05-01"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ContractorAdmin }
            - { call: "POST /facilities", payload: { facility_name: "Period Site", state_code: "CA", annual_fee_paid_through: "2027-01-01T00:00:00Z" }, as: FacilityOwner, as_user_id: "owner-1", captures: { fac: $.data.id } }
            - { call: "POST /tank-systems", payload: { facility_id: "${fac}", tank_tag: "T1", substance: "DIESEL", capacity_gallons: 10000, installed_on: "2018-01-01T00:00:00Z", tank_construction: "STEEL", piping_type: "PRESSURIZED", release_detection_mode: "ATG_INVENTORY" }, as: FacilityOwner, as_user_id: "owner-1", captures: { tank: $.data.id } }
            - { call: "POST /facilities/${fac}/activate", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
            - { call: "POST /tank-systems/${tank}/place-in-service", payload: {}, as: FacilityOwner, as_user_id: "owner-1" }
          trigger:
            - call: "POST /release-detection-records"
              payload: { tank_system_id: "${tank}", period_month: "2026-06", readings_summary: { log: "future" } }
