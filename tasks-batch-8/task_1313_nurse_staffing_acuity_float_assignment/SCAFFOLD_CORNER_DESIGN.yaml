      - name: offer_duplicate_active_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_ALREADY_ACTIVE]"]
        distinguishing_aspect: "At most one OFFERED offer per shift; the second create is rejected while the first is still OFFERED."
