            - call: "POST /registrar/orders/${o1}/line-items"
              payload: { recipient_id: "${rid}", delivery_kind: "EMAIL_PDF", quantity: 1, expected_order_version: "${o1v0}" }
              as: Student
              as_user_id: "${sid}"
              captures: { o1v1: $.data.version }
            - call: "POST /registrar/identity-verifications"
              payload: { student_id: "${sid}", order_id: "${o1}", method: "SSN_DOB" }
              as: Student
              as_user_id: "${sid}"
              captures: { idv1: $.data.id, tok1: $.data.verification_token }
            - call: "POST /registrar/identity-verifications/${idv1}/confirm"
              payload: { verification_token: "${tok1}" }
              as: Student
              as_user_id: "${sid}"
            - call: "POST /registrar/orders/${o1}/submit"
              payload: { expected_order_version: "${o1v1}" }
              as: Student
              as_user_id: "${sid}"
            - call: "POST /registrar/orders"
              payload: { student_id: "${sid}", order_kind: "OFFICIAL" }
