            - call: "POST /referring-providers"
              payload: { name: "Dr A", npi: "2000000001", specialty: "INTERNAL_MEDICINE" }
              as: NetworkAdmin
              captures: { pa: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "M001", full_name: "Pat One", date_of_birth: "1980-01-01", region: "NORTH", insurance_plan_id: "${plan1}" }
              as: NetworkAdmin
              captures: { pt1: $.data.id }
            - call: "POST /referrals"
