        distinguishing_aspect: "Each evaluation is individually valid, but the player may hold only one open case: a second complete evaluation on the same night is refused at diagnosis with ERR_OPEN_CASE_EXISTS and the second evaluation stays in LOCKER_ROOM_EXAM."
