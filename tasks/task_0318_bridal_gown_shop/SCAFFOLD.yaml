# =============================================================================
# Bridal & Gown Shop — benchmark seed tables (Expert)
# =============================================================================

scenario: |
  Bridal & Gown Shop: appointment & fitting-room booking, gown order & size/lead
  time, alteration milestones & fittings, deposit & payment plan, accessory/veil
  add-on, party/group coordination, rush order, pickup & final steam

domain_name: bridal-gown-shop
api_prefix: ""
# Flat topology: many peer top-level collections (/stylists, /fitting-rooms,
# /bridal-parties, /appointments, /fitting-room-bookings, /gown-orders,
# /accessory-addons, /alteration-jobs, /payment-plans) rooted at "/". No single
# dominant resource, so the prefix is the API root.

# Selected structural DNA. Difficulty target: Expert (§0.4).
complexity_profile:
  primary_archetype: temporal_windowing
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - resource_temporal_overlap

  entity_topology: flat
  # Peer entities linked by foreign keys; no deep URL nesting. GownOrder, Appointment,
  # AlterationJob, PaymentPlan are top-level collections that reference each other
  # by FK fields carried in request bodies, not by nested paths.

  state_machine_shape: parallel
  # GownOrder carries two independent state axes (fulfillment_status × payment_status);
  # AlterationJob carries a cyclic refitting loop; Appointment is branching with revert.

  relationship_patterns:
    - one_to_many        # GownOrder -> AlterationJob, GownOrder -> AccessoryAddOn, PaymentPlan -> Payment
    - cross_aggregate    # Appointment/FittingRoomBooking reference Stylist & FittingRoom; AlterationJob references FittingRoom
    - self_referential   # BridalParty.lead_gown_order_id references the party's anchor GownOrder

  role_model: peer_roles
  # BridalConsultant owns appointment/order/party surface; Seamstress owns alteration surface;
  # FinanceClerk owns payment/deposit surface; ShopManager has the override/lifecycle surface.

  consistency_model: immediate
  # All cascades and derived-field recomputes complete atomically inside the triggering request.

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Stylist
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identity only; never a business-decision input" }
      - { name: full_name, type: string, source: input, description: "Consultant display name" }
      - { name: turnaround_buffer_minutes, type: integer, source: input, default: 15, description: "Cleanup/reset buffer enforced after each appointment this stylist runs", constraints: "integer >= 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether the stylist accepts new appointments; INACTIVE stylists reject booking" }

  - name: FittingRoom
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identity only; never a business-decision input" }
      - { name: room_label, type: string, source: input, description: "Human label, e.g. 'Suite A'" }
      - { name: capacity, type: integer, source: input, description: "Max concurrent occupants the room holds at any single instant", constraints: "integer >= 1" }
      - { name: out_of_service, type: boolean, source: input, default: false, description: "When true the room accepts no new bookings" }

  - name: BridalParty
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identity only; never a business-decision input" }
      - { name: party_name, type: string, source: input, description: "Group label, e.g. 'Okafor Wedding'" }
      - { name: event_date, type: datetime, source: input, description: "ISO 8601 UTC date of the event the party is dressing for" }
      - { name: lead_gown_order_id, type: string, source: input, default: null, description: "FK -> GownOrder.id; self-referential anchor — the bride's order that gates party coordination; nullable until set" }
      - { name: coordination_status, type: enum, source: system, description: "FORMING | LOCKED; LOCKED freezes member add/remove", constraints: "FORMING | LOCKED" }
      - { name: member_order_count, type: integer, source: computed, description: "Count of GownOrder rows whose bridal_party_id == this party and fulfillment_status != CANCELLED" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identity only; never a business-decision input" }
      - { name: stylist_id, type: string, source: input, description: "FK -> Stylist.id; the consultant running this appointment" }
      - { name: bridal_party_id, type: string, source: input, default: null, description: "FK -> BridalParty.id; nullable — links a group appointment to a party" }
      - { name: appointment_type, type: enum, source: input, description: "CONSULTATION | FITTING; FITTING appointments may host a fitting-room booking", constraints: "CONSULTATION | FITTING" }
      - { name: start_at, type: datetime, source: input, description: "ISO 8601 UTC inclusive start of the appointment window" }
      - { name: end_at, type: datetime, source: input, description: "ISO 8601 UTC exclusive end of the appointment window; must be strictly after start_at" }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW", constraints: "BOOKED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW" }

  - name: FittingRoomBooking
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identity only; never a business-decision input" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the appointment this room slot serves" }
      - { name: fitting_room_id, type: string, source: input, description: "FK -> FittingRoom.id; the room being occupied" }
      - { name: party_size, type: integer, source: input, description: "Number of occupants this booking consumes against room capacity", constraints: "integer >= 1" }
      - { name: slot_start_at, type: datetime, source: input, description: "ISO 8601 UTC inclusive start of room occupation [half-open with slot_end_at)" }
      - { name: slot_end_at, type: datetime, source: input, description: "ISO 8601 UTC exclusive end of room occupation; must be strictly after slot_start_at" }
      - { name: status, type: enum, source: system, description: "HELD | RELEASED; HELD consumes capacity, RELEASED does not", constraints: "HELD | RELEASED" }

  - name: GownOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identity only; never a business-decision input" }
      - { name: bridal_party_id, type: string, source: input, default: null, description: "FK -> BridalParty.id; nullable — group membership link" }
      - { name: origin_appointment_id, type: string, source: input, default: null, description: "FK -> Appointment.id; nullable — the consultation the order came from" }
      - { name: gown_style_code, type: string, source: input, description: "Catalog style code being ordered" }
      - { name: ordered_size, type: integer, source: input, description: "Dress size ordered; sizes >= SIZE_UPCHARGE_FLOOR carry a plus-size upcharge", constraints: "integer >= 0" }
      - { name: base_price_cents, type: integer, source: input, description: "List price of the gown in integer cents before any size/rush adjustment", constraints: "integer >= 0" }
      - { name: standard_lead_days, type: integer, source: input, description: "Vendor lead time in days for a standard (non-rush) order", constraints: "integer >= 1" }
      - { name: is_rush, type: boolean, source: input, default: false, description: "Whether a rush order was requested at creation" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional order total computed at creation: base + size upcharge + rush surcharge (estimate variant)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Finalized order total stamped at order RECEIVED: recomputed from realized fields, per-line rounding order (final variant); null until RECEIVED" }
      - { name: required_by_date, type: datetime, source: computed, description: "created_at + effective lead days (rush shortens lead); ISO 8601 UTC" }
      - { name: fulfillment_status, type: enum, source: system, description: "DRAFT | ORDERED | RECEIVED | READY | PICKED_UP | CANCELLED — vendor/fulfillment axis", constraints: "DRAFT | ORDERED | RECEIVED | READY | PICKED_UP | CANCELLED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED — independent billing axis", constraints: "UNPAID | DEPOSIT_PAID | PAID_IN_FULL | REFUNDED" }

  - name: AccessoryAddOn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identity only; never a business-decision input" }
      - { name: gown_order_id, type: string, source: input, description: "FK -> GownOrder.id; the order this veil/accessory attaches to" }
      - { name: accessory_type, type: enum, source: input, description: "VEIL | TIARA | SASH | SHOES", constraints: "VEIL | TIARA | SASH | SHOES" }
      - { name: price_cents, type: integer, source: input, description: "Add-on price in integer cents", constraints: "integer >= 0" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REMOVED; REMOVED add-ons drop out of the order total", constraints: "ACTIVE | REMOVED" }

  - name: AlterationJob
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identity only; never a business-decision input" }
      - { name: gown_order_id, type: string, source: input, description: "FK -> GownOrder.id; the gown being altered" }
      - { name: fitting_room_id, type: string, source: input, default: null, description: "FK -> FittingRoom.id; nullable — room reserved for this job's scheduled fitting" }
      - { name: estimated_labor_minutes, type: integer, source: input, description: "Estimated labor minutes used for the provisional alteration cost", constraints: "integer >= 0" }
      - { name: actual_labor_minutes, type: integer, source: computed, description: "Sum of logged labor minutes across all completed milestones; drives the final alteration cost" }
      - { name: refitting_count, type: integer, source: computed, description: "Number of times the job has cycled FITTING -> ADJUSTING (revision rounds); starts at 0" }
      - { name: estimated_cost_cents, type: integer, source: computed, description: "Provisional alteration charge: estimated_labor_minutes * LABOR_RATE_CENTS_PER_MIN (estimate variant)" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Final alteration charge at COMPLETED: actual_labor_minutes * LABOR_RATE_CENTS_PER_MIN + refitting surcharge (actual variant); null until COMPLETED" }
      - { name: status, type: enum, source: system, description: "QUEUED | FITTING | ADJUSTING | COMPLETED | CANCELLED", constraints: "QUEUED | FITTING | ADJUSTING | COMPLETED | CANCELLED" }

  - name: PaymentPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "UUID identity only; never a business-decision input" }
      - { name: gown_order_id, type: string, source: input, description: "FK -> GownOrder.id; the order this plan bills against (one active plan per order)" }
      - { name: plan_total_cents, type: integer, source: system, description: "Snapshot of GownOrder.quoted_total_cents plus active AccessoryAddOn prices at plan creation" }
      - { name: term_installments, type: integer, source: input, description: "Number of equal installments after the deposit", constraints: "integer >= 1" }
      - { name: deposit_cents, type: integer, source: input, description: "Up-front deposit; must be >= ceil(plan_total_cents * DEPOSIT_FLOOR_PCT)", constraints: "integer >= 0" }
      - { name: installment_cents, type: integer, source: computed, description: "Per-installment charge after the deposit (waterfall remainder loaded onto the final installment)" }
      - { name: amount_paid_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents for SETTLED payments minus sum for REFUNDED payments on this plan" }
      - { name: balance_due_cents, type: integer, source: computed, description: "plan_total_cents - amount_paid_cents" }
      - { name: status, type: enum, source: system, description: "DEPOSIT_DUE | ACTIVE | PAID_IN_FULL | CANCELLED", constraints: "DEPOSIT_DUE | ACTIVE | PAID_IN_FULL | CANCELLED" }
      - { name: expected_plan_version, type: integer, source: input, description: "OCC guard not stored; see concurrency_rules" }

  - name: Payment
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "UUID identity only; never a business-decision input" }
      - { name: payment_plan_id, type: string, source: input, description: "FK -> PaymentPlan.id; the plan this payment posts against" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in integer cents", constraints: "integer >= 1" }
      - { name: kind, type: enum, source: system, description: "DEPOSIT | INSTALLMENT | REFUND; set by the posting/refund endpoint", constraints: "DEPOSIT | INSTALLMENT | REFUND" }
      - { name: settlement_status, type: enum, source: system, description: "SETTLED | REVERSED; a refund posts a REFUND payment and flips the refunded source to REVERSED", constraints: "SETTLED | REVERSED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- Appointment: branching with revert (BOOKED <-> CHECKED_IN), no-show branch ----
  - entity: Appointment
    field: status
    initial_state: BOOKED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /appointments/{id}/check-in"
        actor: BridalConsultant
        preconditions:
          - "Appointment.status == BOOKED (else ERR_APPOINTMENT_NOT_BOOKED)"
          - "Stylist.active == true (else ERR_STYLIST_INACTIVE)"
        side_effects: []
      - from: CHECKED_IN
        to: BOOKED
        trigger: "POST /appointments/{id}/revert-check-in"
        actor: BridalConsultant
        preconditions:
          - "Appointment.status == CHECKED_IN (else ERR_APPOINTMENT_NOT_CHECKED_IN)"
        side_effects: []
        note: "Revert loop — corrects an accidental check-in; restores BOOKED so the slot can still be cancelled cleanly."
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /appointments/{id}/complete"
        actor: BridalConsultant
        preconditions:
          - "Appointment.status == CHECKED_IN (else ERR_APPOINTMENT_NOT_CHECKED_IN)"
        side_effects:
          - "All HELD FittingRoomBooking rows on this appointment -> RELEASED (each release frees that room's capacity for the slot interval)"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: BridalConsultant
        preconditions:
          - "Appointment.status == BOOKED (else ERR_APPOINTMENT_NOT_CANCELLABLE)"
        side_effects:
          - "All HELD FittingRoomBooking rows on this appointment -> RELEASED (frees room capacity)"
      - from: BOOKED
        to: NO_SHOW
        trigger: "POST /appointments/{id}/mark-no-show"
        actor: ShopManager
        preconditions:
          - "Appointment.status == BOOKED (else ERR_APPOINTMENT_NOT_BOOKED)"
        side_effects:
          - "All HELD FittingRoomBooking rows on this appointment -> RELEASED (frees room capacity)"

  # ---- FittingRoomBooking: short linear lifecycle (occupation toggle) ----
  - entity: FittingRoomBooking
    field: status
    initial_state: HELD
    terminal_states: [RELEASED]
    transitions:
      - from: HELD
        to: RELEASED
        trigger: "POST /fitting-room-bookings/{id}/release  OR  system (parent Appointment cancelled/completed/no-show; parent AlterationJob cancelled)"
        actor: BridalConsultant
        preconditions:
          - "FittingRoomBooking.status == HELD (else ERR_BOOKING_NOT_HELD)"
        side_effects:
          - "Releases party_size occupants back to FittingRoom capacity for the [slot_start_at, slot_end_at) interval"

  # ---- GownOrder: PARALLEL state dimensions (fulfillment_status x payment_status) ----
  - entity: GownOrder
    field: fulfillment_status
    initial_state: DRAFT
    terminal_states: [PICKED_UP, CANCELLED]
    transitions:
      - from: DRAFT
        to: ORDERED
        trigger: "POST /gown-orders/{id}/submit"
        actor: BridalConsultant
        preconditions:
          - "GownOrder.fulfillment_status == DRAFT (else ERR_ORDER_NOT_DRAFT)"
          - "A PaymentPlan exists for this order with status != CANCELLED (else ERR_PAYMENT_PLAN_REQUIRED)"
        side_effects:
          - "required_by_date stamped from created_at + effective lead days"
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /gown-orders/{id}/receive"
        actor: ShopManager
        preconditions:
          - "GownOrder.fulfillment_status == ORDERED (else ERR_ORDER_NOT_ORDERED)"
        side_effects:
          - "final_total_cents stamped via the final (per-line-rounded) variant of gown_order_total"
      - from: RECEIVED
        to: READY
        trigger: "POST /gown-orders/{id}/mark-ready"
        actor: Seamstress
        preconditions:
          - "GownOrder.fulfillment_status == RECEIVED (else ERR_ORDER_NOT_RECEIVED)"
          - "Every AlterationJob for this order is in COMPLETED or CANCELLED (else ERR_ALTERATIONS_OUTSTANDING)"
        side_effects: []
      - from: READY
        to: PICKED_UP
        trigger: "POST /gown-orders/{id}/pickup"
        actor: BridalConsultant
        preconditions:
          - "GownOrder.fulfillment_status == READY (else ERR_ORDER_NOT_READY)"
          - "GownOrder.payment_status == PAID_IN_FULL (else ERR_BALANCE_OUTSTANDING) [cross-entity: gates on payment axis]"
          - "final_steam_done flag in request == true (else ERR_FINAL_STEAM_REQUIRED)"
        side_effects:
          - "Appointment lifecycle untouched; order leaves the floor"
      - from: [DRAFT, ORDERED, RECEIVED, READY]
        to: CANCELLED
        trigger: "POST /gown-orders/{id}/cancel"
        actor: ShopManager
        preconditions:
          - "GownOrder.fulfillment_status NOT IN {PICKED_UP, CANCELLED} (else ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Every AlterationJob for this order NOT IN {COMPLETED, CANCELLED} -> CANCELLED (cascade hop 1)"
          - "Each cascade-cancelled AlterationJob with a HELD FittingRoomBooking on its fitting_room_id -> that booking RELEASED (cascade hop 2 -> frees room capacity, hop 3)"
          - "The order's PaymentPlan (if status != CANCELLED and amount_paid_cents == 0) -> CANCELLED"
          - "BridalParty.member_order_count recomputed for the linked party (derived-field reconciliation)"

  - entity: GownOrder
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: UNPAID
        to: DEPOSIT_PAID
        trigger: "system (PaymentPlan reaches deposit coverage on POST /payment-plans/{id}/payments)"
        actor: system
        preconditions:
          - "amount_paid_cents >= deposit_cents AND amount_paid_cents < plan_total_cents"
        side_effects: []
      - from: [UNPAID, DEPOSIT_PAID]
        to: PAID_IN_FULL
        trigger: "system (PaymentPlan balance reaches zero on POST /payment-plans/{id}/payments)"
        actor: system
        preconditions:
          - "amount_paid_cents == plan_total_cents (balance_due_cents == 0)"
        side_effects:
          - "Linked PaymentPlan.status -> PAID_IN_FULL"
      - from: [DEPOSIT_PAID, PAID_IN_FULL]
        to: REFUNDED
        trigger: "system (POST /payment-plans/{id}/refund issues a full refund)"
        actor: system
        preconditions:
          - "GownOrder.fulfillment_status == CANCELLED (refunds only after the order is cancelled) (else ERR_REFUND_NOT_ALLOWED)"
        side_effects:
          - "A REFUND Payment of amount_paid_cents is posted; every prior SETTLED Payment on the plan -> REVERSED; plan amount_paid_cents returns to 0"

  # ---- AlterationJob: CYCLIC refitting loop (FITTING <-> ADJUSTING) ----
  - entity: AlterationJob
    field: status
    initial_state: QUEUED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: QUEUED
        to: FITTING
        trigger: "POST /alteration-jobs/{id}/start-fitting"
        actor: Seamstress
        preconditions:
          - "AlterationJob.status == QUEUED (else ERR_JOB_NOT_QUEUED)"
          - "Linked GownOrder.fulfillment_status == RECEIVED (else ERR_ORDER_NOT_RECEIVED) [cross-entity: AlterationJob gates on GownOrder]"
        side_effects: []
      - from: FITTING
        to: ADJUSTING
        trigger: "POST /alteration-jobs/{id}/request-adjustment"
        actor: Seamstress
        preconditions:
          - "AlterationJob.status == FITTING (else ERR_JOB_NOT_FITTING)"
        side_effects:
          - "refitting_count += 1 (revision round counter)"
      - from: ADJUSTING
        to: FITTING
        trigger: "POST /alteration-jobs/{id}/log-labor (resume fitting after adjustment)"
        actor: Seamstress
        preconditions:
          - "AlterationJob.status == ADJUSTING (else ERR_JOB_NOT_ADJUSTING)"
        side_effects:
          - "actual_labor_minutes += body.minutes (accumulator); job returns to FITTING (cycle back)"
      - from: FITTING
        to: COMPLETED
        trigger: "POST /alteration-jobs/{id}/complete"
        actor: Seamstress
        preconditions:
          - "AlterationJob.status == FITTING (else ERR_JOB_NOT_FITTING)"
        side_effects:
          - "final_cost_cents stamped via the actual (refitting-surcharged) variant of alteration_cost"
          - "If the job holds a HELD FittingRoomBooking on its fitting_room_id, that booking -> RELEASED"
      - from: [QUEUED, FITTING, ADJUSTING]
        to: CANCELLED
        trigger: "POST /alteration-jobs/{id}/cancel  OR  system (parent GownOrder cancelled)"
        actor: Seamstress
        preconditions:
          - "AlterationJob.status NOT IN {COMPLETED, CANCELLED} (else ERR_JOB_NOT_CANCELLABLE)"
        side_effects:
          - "Any HELD FittingRoomBooking on this job's fitting_room_id -> RELEASED (frees room capacity)"

  # ---- BridalParty: one-way membership freeze toggle ----
  - entity: BridalParty
    field: coordination_status
    initial_state: FORMING
    terminal_states: [LOCKED]
    transitions:
      - from: FORMING
        to: LOCKED
        trigger: "POST /bridal-parties/{id}/lock"
        actor: ShopManager
        preconditions:
          - "BridalParty.coordination_status == FORMING (else ERR_PARTY_NOT_FORMING)"
        side_effects:
          - "Freezes membership: subsequent GownOrder creation with this bridal_party_id is rejected ERR_PARTY_NOT_FORMING"

  # ---- PaymentPlan: deposit-then-installment lifecycle ----
  - entity: PaymentPlan
    field: status
    initial_state: DEPOSIT_DUE
    terminal_states: [PAID_IN_FULL, CANCELLED]
    transitions:
      - from: DEPOSIT_DUE
        to: ACTIVE
        trigger: "system (first DEPOSIT Payment covering deposit_cents posted via POST /payment-plans/{id}/payments)"
        actor: system
        preconditions:
          - "amount_paid_cents >= deposit_cents AND amount_paid_cents < plan_total_cents"
        side_effects:
          - "Linked GownOrder.payment_status -> DEPOSIT_PAID"
      - from: [DEPOSIT_DUE, ACTIVE]
        to: PAID_IN_FULL
        trigger: "system (a Payment drives balance_due_cents to 0 via POST /payment-plans/{id}/payments)"
        actor: system
        preconditions:
          - "amount_paid_cents == plan_total_cents"
        side_effects:
          - "Linked GownOrder.payment_status -> PAID_IN_FULL"
      - from: [DEPOSIT_DUE, ACTIVE]
        to: CANCELLED
        trigger: "system (parent GownOrder cancelled with amount_paid_cents == 0)  OR  POST /payment-plans/{id}/refund"
        actor: FinanceClerk
        preconditions:
          - "PaymentPlan.status IN {DEPOSIT_DUE, ACTIVE} (else ERR_PLAN_NOT_CANCELLABLE)"
        side_effects:
          - "If a refund: post a REFUND Payment of amount_paid_cents, flip every SETTLED Payment -> REVERSED, GownOrder.payment_status -> REFUNDED"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: payment-post-stale-plan
    parent_entity: PaymentPlan
    write_endpoint: "POST /payment-plans/{id}/payments"
    occ_field: "expected_plan_version"
    description: |
      Posting a Payment against a PaymentPlan whose version has advanced since the
      client last observed it is rejected with a stale-version error. A prior write
      (another installment, or a refund that reversed the ledger) legitimately
      advanced the plan's amount_paid_cents/balance_due_cents and bumped its version;
      a payment carrying the pre-advance version is therefore working from a stale
      view of the plan's balance and must be refused so the client re-reads first.
    error_id: ERR_STALE_PLAN_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: gown_order_total
    trigger: "GownOrder creation (quoted variant); GownOrder fulfillment_status ORDERED->RECEIVED (final variant)"
    algorithm: tiered_pricing
    formula: |
      # Inputs: base_price_cents, ordered_size, is_rush, standard_lead_days,
      #         active AccessoryAddOn[] (status == ACTIVE) for this order.
      size_upcharge_cents =
        ceil(base_price_cents * SIZE_UPCHARGE_PCT) if ordered_size >= SIZE_UPCHARGE_FLOOR else 0
      rush_surcharge_cents =
        ceil(base_price_cents * RUSH_SURCHARGE_PCT) if is_rush else 0
      gown_subtotal_cents = base_price_cents + size_upcharge_cents + rush_surcharge_cents
      # accessory contribution differs by variant (see variants[])
    input_set: "The gown's own fields plus AccessoryAddOn rows for the order with status == ACTIVE (REMOVED excluded)."
    constants:
      SIZE_UPCHARGE_FLOOR: 20
      SIZE_UPCHARGE_PCT: 0.15
      RUSH_SURCHARGE_PCT: 0.30
    precision: "integer cents; ceil() on each percentage term BEFORE summation"
    variants:
      - name: quoted_estimate
        when: "Computed at GownOrder creation into quoted_total_cents; uses NO accessories (add-ons attach after the draft is created)."
        difference: "quoted_total_cents = gown_subtotal_cents (no accessory lines exist yet at draft creation)."
      - name: final_per_line_rounded
        when: "Stamped into final_total_cents on ORDERED->RECEIVED."
        difference: |
          final_total_cents = gown_subtotal_cents + sum(accessory.price_cents for ACTIVE add-ons).
          Rounding order is PINNED: each accessory line is already integer cents (no rounding),
          the gown_subtotal terms are each ceil()'d per-term then summed, and the accessory sum
          is added last — round-per-term-then-sum, NOT sum-of-raw-floats-then-round. Because
          add-ons can be added/removed between draft and RECEIVED, final_total_cents diverges
          from quoted_total_cents for the same order.

  - name: alteration_cost
    trigger: "AlterationJob creation (estimate variant); AlterationJob FITTING->COMPLETED (actual variant)"
    algorithm: weighted_scoring
    formula: |
      base_estimate_cents = estimated_labor_minutes * LABOR_RATE_CENTS_PER_MIN
      base_actual_cents    = actual_labor_minutes * LABOR_RATE_CENTS_PER_MIN
      # >=3 inputs interacting non-linearly via the refitting surcharge multiplier:
      refit_multiplier = 1 + (REFIT_SURCHARGE_PCT * refitting_count)
    input_set: "AlterationJob's own estimated_labor_minutes / actual_labor_minutes / refitting_count."
    constants:
      LABOR_RATE_CENTS_PER_MIN: 120
      REFIT_SURCHARGE_PCT: 0.10
    precision: "integer cents; ceil() applied once to the final product"
    variants:
      - name: estimated_labor
        when: "AlterationJob creation into estimated_cost_cents."
        difference: "estimated_cost_cents = estimated_labor_minutes * LABOR_RATE_CENTS_PER_MIN (no refitting; refitting_count == 0 at creation)."
      - name: actual_with_refits
        when: "Stamped into final_cost_cents on FITTING->COMPLETED."
        difference: "final_cost_cents = ceil(actual_labor_minutes * LABOR_RATE_CENTS_PER_MIN * (1 + REFIT_SURCHARGE_PCT * refitting_count)). Diverges from estimate by both realized minutes and refit rounds."

  - name: payment_plan_schedule
    trigger: "PaymentPlan creation (POST /payment-plans)"
    algorithm: waterfall_allocation
    formula: |
      # plan_total_cents snapshot = GownOrder.quoted_total_cents + sum(ACTIVE accessory price_cents).
      # >=3 inputs (plan_total_cents, deposit_cents, term_installments) with conditional branches:
      MIN_DEPOSIT = ceil(plan_total_cents * DEPOSIT_FLOOR_PCT)
      # deposit_cents must be >= MIN_DEPOSIT (validation, not clamp).
      financed_cents = plan_total_cents - deposit_cents
      base_installment = floor(financed_cents / term_installments)
      remainder = financed_cents - (base_installment * term_installments)
      # Waterfall: every installment is base_installment EXCEPT the final one,
      # which absorbs the remainder. installment_cents reports base_installment.
      installment_cents = base_installment
      # final_installment (implicit) = base_installment + remainder
    input_set: "plan_total_cents (snapshot at creation), deposit_cents (input), term_installments (input)."
    constants:
      DEPOSIT_FLOOR_PCT: 0.50
    precision: "integer cents; floor() for base installment, remainder loaded on final installment (no cents lost)"

  - name: plan_ledger
    trigger: "Payment posted (POST /payment-plans/{id}/payments); refund issued (POST /payment-plans/{id}/refund)"
    algorithm: aggregation
    formula: |
      amount_paid_cents = sum(p.amount_cents for p in Payment
                              where p.payment_plan_id == plan.id
                                and p.settlement_status == SETTLED
                                and p.kind IN {DEPOSIT, INSTALLMENT})
                          - sum(p.amount_cents for p in Payment
                              where p.payment_plan_id == plan.id
                                and p.kind == REFUND
                                and p.settlement_status == SETTLED)
      balance_due_cents = plan_total_cents - amount_paid_cents
    input_set: "All Payment rows for this plan; DEPOSIT/INSTALLMENT add to paid, REFUND subtracts. Conserved invariant: amount_paid_cents == plan_total_cents - balance_due_cents at all times."
    constants: {}
    precision: "integer cents; exact (no rounding)"

  - name: room_occupancy_at_instant
    trigger: "FittingRoomBooking creation (POST /fitting-room-bookings)"
    algorithm: interval_merge
    formula: |
      # For the candidate [slot_start_at, slot_end_at) on fitting_room_id:
      # at every instant t in the candidate interval, the sum of party_size over all
      # HELD FittingRoomBooking rows on the same room whose [slot_start_at, slot_end_at)
      # contains t, PLUS the candidate's party_size, must be <= room.capacity.
      # Half-open intervals: a booking ending exactly at slot_start_at does NOT overlap.
      peak_concurrent = max over t of sum(party_size of HELD bookings covering t)
      reject if peak_concurrent + candidate.party_size > room.capacity
    input_set: "HELD FittingRoomBooking rows on the target room (RELEASED excluded)."
    constants: {}
    precision: "integer occupant counts; half-open [start, end) interval semantics, adjacency (end == next start) does NOT conflict"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path id and every FK in the body resolve to an existing row (validated left-to-right: path id first, then body FKs in declaration order)"
    error_id: "ERR_APPOINTMENT_NOT_FOUND / ERR_STYLIST_NOT_FOUND / ERR_FITTING_ROOM_NOT_FOUND / ERR_PARTY_NOT_FOUND / ERR_ORDER_NOT_FOUND / ERR_ACCESSORY_NOT_FOUND / ERR_ALTERATION_JOB_NOT_FOUND / ERR_PAYMENT_PLAN_NOT_FOUND / ERR_BOOKING_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with a path id or body FK

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums in range, integers within declared constraints (capacity>=1, end strictly after start, amount_cents>=1, term_installments>=1)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all write endpoints

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is legal (state-machine from: set)"
    error_id: "ERR_APPOINTMENT_NOT_BOOKED / ERR_APPOINTMENT_NOT_CHECKED_IN / ERR_APPOINTMENT_NOT_CANCELLABLE / ERR_BOOKING_NOT_HELD / ERR_ORDER_NOT_DRAFT / ERR_ORDER_NOT_ORDERED / ERR_ORDER_NOT_RECEIVED / ERR_ORDER_NOT_READY / ERR_ORDER_NOT_CANCELLABLE / ERR_JOB_NOT_QUEUED / ERR_JOB_NOT_FITTING / ERR_JOB_NOT_ADJUSTING / ERR_JOB_NOT_CANCELLABLE / ERR_PLAN_NOT_CANCELLABLE"
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 6
    category: business_referential
    check: "Cross-entity precondition holds: e.g. submit requires a non-cancelled PaymentPlan (ERR_PAYMENT_PLAN_REQUIRED); start-fitting requires GownOrder RECEIVED (ERR_ORDER_NOT_RECEIVED); mark-ready requires all AlterationJobs COMPLETED/CANCELLED (ERR_ALTERATIONS_OUTSTANDING); refund requires order CANCELLED (ERR_REFUND_NOT_ALLOWED)"
    error_id: "ERR_PAYMENT_PLAN_REQUIRED / ERR_ORDER_NOT_RECEIVED / ERR_ALTERATIONS_OUTSTANDING / ERR_REFUND_NOT_ALLOWED"
    http_status: 409
    applies_to: "POST /gown-orders/{id}/submit, /alteration-jobs/{id}/start-fitting, /gown-orders/{id}/mark-ready, /payment-plans/{id}/refund"

  - priority: 7
    category: business_temporal
    check: "Stylist double-booking with cleanup buffer: a new/transitioning Appointment on a stylist must not overlap any other non-terminal Appointment on the same stylist once each existing appointment is inflated by that stylist's turnaround_buffer_minutes on its end side. Closed-on-start, buffered-on-end interval semantics."
    error_id: ERR_STYLIST_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /appointments"

  - priority: 8
    category: business_temporal
    check: "Fitting-room capacity overflow: candidate FittingRoomBooking interval [slot_start_at, slot_end_at) plus existing HELD bookings' party_size must not exceed room.capacity at any instant. Half-open intervals; adjacency does not conflict."
    error_id: ERR_FITTING_ROOM_OVERBOOKED
    http_status: 409
    applies_to: "POST /fitting-room-bookings"

  - priority: 9
    category: business_safety
    check: "BridalParty must be FORMING to add/remove member orders; LOCKED/DISBANDED parties reject membership mutation"
    error_id: ERR_PARTY_NOT_FORMING
    http_status: 409
    applies_to: "POST /gown-orders (when bridal_party_id set), POST /bridal-parties/{id}/lock"

  - priority: 10
    category: business_fiscal
    check: "Deposit floor: PaymentPlan.deposit_cents must be >= ceil(plan_total_cents * DEPOSIT_FLOOR_PCT); below floor is rejected"
    error_id: ERR_DEPOSIT_BELOW_FLOOR
    http_status: 422
    applies_to: "POST /payment-plans"

  - priority: 11
    category: business_fiscal
    check: "Payment overpayment guard: a posted Payment whose amount_cents would drive amount_paid_cents strictly above plan_total_cents is rejected"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /payment-plans/{id}/payments"

  - priority: 12
    category: business_fiscal
    check: "Pickup balance guard: pickup requires GownOrder.payment_status == PAID_IN_FULL (balance_due_cents == 0)"
    error_id: ERR_BALANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /gown-orders/{id}/pickup"

  - priority: 13
    category: business_constraint
    check: "Final steam guard: pickup requires final_steam_done == true in the request body"
    error_id: ERR_FINAL_STEAM_REQUIRED
    http_status: 409
    applies_to: "POST /gown-orders/{id}/pickup"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Stylist ----
  - method: POST
    path: "/stylists"
    description: "Create a stylist (consultant)"
    roles: [ShopManager]
    code: 201
    input: [full_name, "turnaround_buffer_minutes?", "active?"]
    output: Stylist
    side_effects: []
  - method: GET
    path: "/stylists"
    description: "List stylists"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Stylist[]"
    side_effects: []
  - method: GET
    path: "/stylists/{id}"
    description: "Get a stylist"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: []
    output: Stylist
    side_effects: []
  - method: PATCH
    path: "/stylists/{id}"
    description: "Update a stylist (toggle active, change buffer)"
    roles: [ShopManager]
    code: 200
    input: ["full_name?", "turnaround_buffer_minutes?", "active?"]
    output: Stylist
    side_effects: []

  # ---- FittingRoom ----
  - method: POST
    path: "/fitting-rooms"
    description: "Create a fitting room"
    roles: [ShopManager]
    code: 201
    input: [room_label, capacity, "out_of_service?"]
    output: FittingRoom
    side_effects: []
  - method: GET
    path: "/fitting-rooms"
    description: "List fitting rooms"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "FittingRoom[]"
    side_effects: []
  - method: GET
    path: "/fitting-rooms/{id}"
    description: "Get a fitting room"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: []
    output: FittingRoom
    side_effects: []

  # ---- BridalParty ----
  - method: POST
    path: "/bridal-parties"
    description: "Create a bridal party (group)"
    roles: [BridalConsultant, ShopManager]
    code: 201
    input: [party_name, event_date, "lead_gown_order_id?"]
    output: BridalParty
    side_effects: ["coordination_status = FORMING, member_order_count = 0"]
  - method: GET
    path: "/bridal-parties"
    description: "List bridal parties; filter by lead_gown_order_id"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: ["lead_gown_order_id?", "limit?", "offset?"]
    output: "BridalParty[]"
    side_effects: []
  - method: GET
    path: "/bridal-parties/{id}"
    description: "Get a bridal party (member_order_count recomputed)"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: []
    output: BridalParty
    side_effects: []
  - method: PATCH
    path: "/bridal-parties/{id}"
    description: "Set the party's lead_gown_order_id anchor"
    roles: [BridalConsultant, ShopManager]
    code: 200
    input: [lead_gown_order_id]
    output: BridalParty
    side_effects: []
  - method: POST
    path: "/bridal-parties/{id}/lock"
    description: "Lock a party so membership can no longer change"
    roles: [ShopManager]
    code: 200
    input: []
    output: BridalParty
    side_effects: ["coordination_status FORMING -> LOCKED"]

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Book an appointment with a stylist (overlap + buffer checked)"
    roles: [BridalConsultant, ShopManager]
    code: 201
    input: [stylist_id, appointment_type, start_at, end_at, "bridal_party_id?"]
    output: Appointment
    side_effects: ["status = BOOKED; rejects on ERR_STYLIST_DOUBLE_BOOKED"]
  - method: GET
    path: "/appointments"
    description: "List appointments; filter by stylist_id or bridal_party_id"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: ["stylist_id?", "bridal_party_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []
  - method: GET
    path: "/appointments/{id}"
    description: "Get an appointment"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/check-in"
    description: "Check a client in"
    roles: [BridalConsultant]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status BOOKED -> CHECKED_IN"]
  - method: POST
    path: "/appointments/{id}/revert-check-in"
    description: "Undo an accidental check-in"
    roles: [BridalConsultant]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status CHECKED_IN -> BOOKED"]
  - method: POST
    path: "/appointments/{id}/complete"
    description: "Complete an appointment"
    roles: [BridalConsultant]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status CHECKED_IN -> COMPLETED; all HELD FittingRoomBookings on this appointment -> RELEASED"]
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel a booked appointment"
    roles: [BridalConsultant, ShopManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status BOOKED -> CANCELLED; all HELD FittingRoomBookings -> RELEASED"]
  - method: POST
    path: "/appointments/{id}/mark-no-show"
    description: "Flag a booked appointment as no-show"
    roles: [ShopManager]
    code: 200
    input: []
    output: Appointment
    side_effects: ["status BOOKED -> NO_SHOW; all HELD FittingRoomBookings -> RELEASED"]

  # ---- FittingRoomBooking ----
  - method: POST
    path: "/fitting-room-bookings"
    description: "Hold a fitting room slot for an appointment (capacity + interval checked)"
    roles: [BridalConsultant, ShopManager]
    code: 201
    input: [appointment_id, fitting_room_id, party_size, slot_start_at, slot_end_at]
    output: FittingRoomBooking
    side_effects: ["status = HELD; rejects on ERR_FITTING_ROOM_OVERBOOKED"]
  - method: GET
    path: "/fitting-room-bookings"
    description: "List fitting-room bookings; filter by appointment_id or fitting_room_id"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: ["appointment_id?", "fitting_room_id?", "limit?", "offset?"]
    output: "FittingRoomBooking[]"
    side_effects: []
  - method: GET
    path: "/fitting-room-bookings/{id}"
    description: "Get a fitting-room booking"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: []
    output: FittingRoomBooking
    side_effects: []
  - method: POST
    path: "/fitting-room-bookings/{id}/release"
    description: "Manually release a held room slot"
    roles: [BridalConsultant, ShopManager]
    code: 200
    input: []
    output: FittingRoomBooking
    side_effects: ["status HELD -> RELEASED; frees room capacity"]

  # ---- GownOrder ----
  - method: POST
    path: "/gown-orders"
    description: "Create a gown order in DRAFT (quoted_total stamped)"
    roles: [BridalConsultant, ShopManager]
    code: 201
    input: [gown_style_code, ordered_size, base_price_cents, standard_lead_days, "is_rush?", "bridal_party_id?", "origin_appointment_id?"]
    output: GownOrder
    side_effects: ["fulfillment_status = DRAFT, payment_status = UNPAID, quoted_total_cents computed; if bridal_party_id set, party.member_order_count recomputed"]
  - method: GET
    path: "/gown-orders"
    description: "List gown orders; filter by bridal_party_id or origin_appointment_id"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: ["bridal_party_id?", "origin_appointment_id?", "limit?", "offset?"]
    output: "GownOrder[]"
    side_effects: []
  - method: GET
    path: "/gown-orders/{id}"
    description: "Get a gown order"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: []
    output: GownOrder
    side_effects: []
  - method: POST
    path: "/gown-orders/{id}/submit"
    description: "Submit a DRAFT order to the vendor"
    roles: [BridalConsultant, ShopManager]
    code: 200
    input: []
    output: GownOrder
    side_effects: ["fulfillment_status DRAFT -> ORDERED; required_by_date stamped"]
  - method: POST
    path: "/gown-orders/{id}/receive"
    description: "Mark an ordered gown as received from vendor (final total stamped)"
    roles: [ShopManager]
    code: 200
    input: []
    output: GownOrder
    side_effects: ["fulfillment_status ORDERED -> RECEIVED; final_total_cents stamped (final variant)"]
  - method: POST
    path: "/gown-orders/{id}/mark-ready"
    description: "Mark a received gown ready for pickup (alterations must be done)"
    roles: [Seamstress, ShopManager]
    code: 200
    input: []
    output: GownOrder
    side_effects: ["fulfillment_status RECEIVED -> READY"]
  - method: POST
    path: "/gown-orders/{id}/pickup"
    description: "Final steam + pickup; requires paid in full"
    roles: [BridalConsultant, ShopManager]
    code: 200
    input: [final_steam_done]
    output: GownOrder
    side_effects: ["fulfillment_status READY -> PICKED_UP"]
  - method: POST
    path: "/gown-orders/{id}/cancel"
    description: "Cancel a gown order (cascades to alterations, room bookings, plan)"
    roles: [ShopManager]
    code: 200
    input: []
    output: GownOrder
    side_effects:
      - "fulfillment_status -> CANCELLED"
      - "AlterationJobs not terminal -> CANCELLED (hop 1)"
      - "their HELD FittingRoomBookings -> RELEASED (hop 2) -> room capacity freed (hop 3)"
      - "PaymentPlan with amount_paid_cents == 0 -> CANCELLED"
      - "party.member_order_count recomputed"

  # ---- AccessoryAddOn ----
  - method: POST
    path: "/accessory-addons"
    description: "Attach a veil/accessory to a gown order"
    roles: [BridalConsultant, ShopManager]
    code: 201
    input: [gown_order_id, accessory_type, price_cents]
    output: AccessoryAddOn
    side_effects: ["status = ACTIVE; affects final_total_cents when order is received"]
  - method: GET
    path: "/accessory-addons"
    description: "List accessory add-ons; filter by gown_order_id"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: ["gown_order_id?", "limit?", "offset?"]
    output: "AccessoryAddOn[]"
    side_effects: []
  - method: GET
    path: "/accessory-addons/{id}"
    description: "Get an accessory add-on"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: []
    output: AccessoryAddOn
    side_effects: []
  - method: POST
    path: "/accessory-addons/{id}/remove"
    description: "Remove an accessory add-on (drops out of order total)"
    roles: [BridalConsultant, ShopManager]
    code: 200
    input: []
    output: AccessoryAddOn
    side_effects: ["status ACTIVE -> REMOVED"]

  # ---- AlterationJob ----
  - method: POST
    path: "/alteration-jobs"
    description: "Create an alteration job for a gown order (estimate cost stamped)"
    roles: [Seamstress, ShopManager]
    code: 201
    input: [gown_order_id, estimated_labor_minutes, "fitting_room_id?"]
    output: AlterationJob
    side_effects: ["status = QUEUED, refitting_count = 0, actual_labor_minutes = 0, estimated_cost_cents computed"]
  - method: GET
    path: "/alteration-jobs"
    description: "List alteration jobs; filter by gown_order_id or fitting_room_id"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: ["gown_order_id?", "fitting_room_id?", "limit?", "offset?"]
    output: "AlterationJob[]"
    side_effects: []
  - method: GET
    path: "/alteration-jobs/{id}"
    description: "Get an alteration job"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: []
    output: AlterationJob
    side_effects: []
  - method: POST
    path: "/alteration-jobs/{id}/start-fitting"
    description: "Start the first fitting (requires order RECEIVED)"
    roles: [Seamstress]
    code: 200
    input: []
    output: AlterationJob
    side_effects: ["status QUEUED -> FITTING"]
  - method: POST
    path: "/alteration-jobs/{id}/request-adjustment"
    description: "Send the job back for adjustment (refit round)"
    roles: [Seamstress]
    code: 200
    input: []
    output: AlterationJob
    side_effects: ["status FITTING -> ADJUSTING; refitting_count += 1"]
  - method: POST
    path: "/alteration-jobs/{id}/log-labor"
    description: "Log labor minutes and resume fitting after adjustment"
    roles: [Seamstress]
    code: 200
    input: [minutes]
    output: AlterationJob
    side_effects: ["status ADJUSTING -> FITTING; actual_labor_minutes += minutes"]
  - method: POST
    path: "/alteration-jobs/{id}/complete"
    description: "Complete the alteration (final cost stamped)"
    roles: [Seamstress]
    code: 200
    input: []
    output: AlterationJob
    side_effects: ["status FITTING -> COMPLETED; final_cost_cents stamped (actual variant); any HELD room booking on its fitting_room_id released"]
  - method: POST
    path: "/alteration-jobs/{id}/cancel"
    description: "Cancel an alteration job"
    roles: [Seamstress, ShopManager]
    code: 200
    input: []
    output: AlterationJob
    side_effects: ["status -> CANCELLED; any HELD room booking on its fitting_room_id released"]

  # ---- PaymentPlan ----
  - method: POST
    path: "/payment-plans"
    description: "Create the deposit + installment plan for a draft order"
    roles: [FinanceClerk, ShopManager]
    code: 201
    input: [gown_order_id, term_installments, deposit_cents]
    output: PaymentPlan
    side_effects: ["status = DEPOSIT_DUE; plan_total_cents snapshot; installment_cents computed; deposit floor validated"]
  - method: GET
    path: "/payment-plans"
    description: "List payment plans; filter by gown_order_id"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: ["gown_order_id?", "limit?", "offset?"]
    output: "PaymentPlan[]"
    side_effects: []
  - method: GET
    path: "/payment-plans/{id}"
    description: "Get a payment plan (ledger fields recomputed)"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: []
    output: PaymentPlan
    side_effects: []
  - method: POST
    path: "/payment-plans/{id}/payments"
    description: "Post a deposit/installment payment (OCC-guarded)"
    roles: [FinanceClerk, ShopManager]
    code: 201
    input: [amount_cents, expected_plan_version]
    output: Payment
    side_effects:
      - "Payment row created (kind DEPOSIT until deposit covered, then INSTALLMENT)"
      - "plan amount_paid_cents / balance_due_cents recomputed; increments PaymentPlan.version by 1"
      - "plan DEPOSIT_DUE -> ACTIVE on deposit coverage; -> PAID_IN_FULL on zero balance"
      - "GownOrder.payment_status UNPAID -> DEPOSIT_PAID / -> PAID_IN_FULL accordingly"
  - method: GET
    path: "/payment-plans/{id}/payments"
    description: "List payments for a plan"
    roles: [ShopManager, BridalConsultant, Seamstress, FinanceClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Payment[]"
    side_effects: []
  - method: POST
    path: "/payment-plans/{id}/refund"
    description: "Issue a full refund on a cancelled order's plan (OCC-guarded)"
    roles: [FinanceClerk, ShopManager]
    code: 201
    input: [expected_plan_version]
    output: Payment
    side_effects:
      - "REFUND Payment of amount_paid_cents created; increments PaymentPlan.version by 1"
      - "every prior SETTLED Payment -> REVERSED; plan amount_paid_cents -> 0; plan -> CANCELLED"
      - "GownOrder.payment_status -> REFUNDED"

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role not permitted for this operation" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, bad enum, integer out of declared constraint, or end not strictly after start" }
  # --- not found ---
  - { id: ERR_STYLIST_NOT_FOUND, http: 404, condition: "Stylist id does not resolve" }
  - { id: ERR_FITTING_ROOM_NOT_FOUND, http: 404, condition: "FittingRoom id does not resolve" }
  - { id: ERR_PARTY_NOT_FOUND, http: 404, condition: "BridalParty id does not resolve" }
  - { id: ERR_APPOINTMENT_NOT_FOUND, http: 404, condition: "Appointment id does not resolve" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "FittingRoomBooking id does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "GownOrder id does not resolve" }
  - { id: ERR_ACCESSORY_NOT_FOUND, http: 404, condition: "AccessoryAddOn id does not resolve" }
  - { id: ERR_ALTERATION_JOB_NOT_FOUND, http: 404, condition: "AlterationJob id does not resolve" }
  - { id: ERR_PAYMENT_PLAN_NOT_FOUND, http: 404, condition: "PaymentPlan id does not resolve" }
  # --- appointment state ---
  - { id: ERR_APPOINTMENT_NOT_BOOKED, http: 409, condition: "Operation requires Appointment.status == BOOKED" }
  - { id: ERR_APPOINTMENT_NOT_CHECKED_IN, http: 409, condition: "Operation requires Appointment.status == CHECKED_IN" }
  - { id: ERR_APPOINTMENT_NOT_CANCELLABLE, http: 409, condition: "Appointment not in BOOKED state for cancellation" }
  - { id: ERR_STYLIST_INACTIVE, http: 409, condition: "Stylist.active == false at check-in" }
  # --- booking state ---
  - { id: ERR_BOOKING_NOT_HELD, http: 409, condition: "Operation requires FittingRoomBooking.status == HELD" }
  # --- order fulfillment state ---
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "Operation requires GownOrder.fulfillment_status == DRAFT" }
  - { id: ERR_ORDER_NOT_ORDERED, http: 409, condition: "Operation requires GownOrder.fulfillment_status == ORDERED" }
  - { id: ERR_ORDER_NOT_RECEIVED, http: 409, condition: "Operation requires GownOrder.fulfillment_status == RECEIVED" }
  - { id: ERR_ORDER_NOT_READY, http: 409, condition: "Operation requires GownOrder.fulfillment_status == READY" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "GownOrder already PICKED_UP or CANCELLED" }
  # --- alteration state ---
  - { id: ERR_JOB_NOT_QUEUED, http: 409, condition: "Operation requires AlterationJob.status == QUEUED" }
  - { id: ERR_JOB_NOT_FITTING, http: 409, condition: "Operation requires AlterationJob.status == FITTING" }
  - { id: ERR_JOB_NOT_ADJUSTING, http: 409, condition: "Operation requires AlterationJob.status == ADJUSTING" }
  - { id: ERR_JOB_NOT_CANCELLABLE, http: 409, condition: "AlterationJob already COMPLETED or CANCELLED" }
  # --- plan state ---
  - { id: ERR_PLAN_NOT_CANCELLABLE, http: 409, condition: "PaymentPlan not in DEPOSIT_DUE or ACTIVE state" }
  # --- cross-entity referential ---
  - { id: ERR_PAYMENT_PLAN_REQUIRED, http: 409, condition: "submit requires a non-cancelled PaymentPlan on the order" }
  - { id: ERR_ALTERATIONS_OUTSTANDING, http: 409, condition: "mark-ready blocked: an AlterationJob is not yet COMPLETED/CANCELLED" }
  - { id: ERR_REFUND_NOT_ALLOWED, http: 409, condition: "refund requires the GownOrder to be CANCELLED" }
  # --- temporal / capacity ---
  - { id: ERR_STYLIST_DOUBLE_BOOKED, http: 409, condition: "Appointment overlaps another non-terminal appointment on the same stylist within the turnaround buffer" }
  - { id: ERR_FITTING_ROOM_OVERBOOKED, http: 409, condition: "Candidate booking would push concurrent occupancy above room.capacity at some instant" }
  # --- party ---
  - { id: ERR_PARTY_NOT_FORMING, http: 409, condition: "Membership mutation/lock on a party not in FORMING state" }
  # --- fiscal ---
  - { id: ERR_DEPOSIT_BELOW_FLOOR, http: 422, condition: "deposit_cents below ceil(plan_total_cents * DEPOSIT_FLOOR_PCT)" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment would drive amount_paid_cents above plan_total_cents" }
  - { id: ERR_BALANCE_OUTSTANDING, http: 409, condition: "pickup blocked: order not PAID_IN_FULL" }
  - { id: ERR_FINAL_STEAM_REQUIRED, http: 409, condition: "pickup blocked: final_steam_done not true" }
  # --- concurrency ---
  - { id: ERR_STALE_PLAN_VERSION, http: 412, condition: "expected_plan_version does not match PaymentPlan.version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ShopManager
    description: "Store operator; owns order lifecycle gating, vendor receipt, cancellations, no-shows, and resource setup. Override authority across surfaces."
    identity: "opaque"
    exclusive_operations:
      - "POST /stylists, PATCH /stylists/{id} — manage stylists"
      - "POST /fitting-rooms — manage rooms"
      - "POST /gown-orders/{id}/receive — mark received"
      - "POST /gown-orders/{id}/cancel — cancel order (cascade)"
      - "POST /appointments/{id}/mark-no-show — flag no-show"
      - "POST /bridal-parties/{id}/lock — lock a party"
    shared_operations:
      - "POST /bridal-parties, PATCH /bridal-parties/{id}"
      - "POST /appointments, /appointments/{id}/cancel"
      - "POST /fitting-room-bookings, /fitting-room-bookings/{id}/release"
      - "POST /gown-orders, /gown-orders/{id}/submit, /gown-orders/{id}/mark-ready, /gown-orders/{id}/pickup"
      - "POST /accessory-addons, /accessory-addons/{id}/remove"
      - "POST /alteration-jobs, /alteration-jobs/{id}/cancel"
      - "POST /payment-plans, /payment-plans/{id}/payments, /payment-plans/{id}/refund"
      - "all GET endpoints"

  - name: BridalConsultant
    description: "Front-of-house staff; owns appointments, fitting-room holds, gown orders, accessories, and party formation."
    identity: "opaque"
    exclusive_operations:
      - "POST /appointments/{id}/check-in, /appointments/{id}/revert-check-in, /appointments/{id}/complete — run the appointment floor"
    shared_operations:
      - "POST /bridal-parties, PATCH /bridal-parties/{id}"
      - "POST /appointments, /appointments/{id}/cancel"
      - "POST /fitting-room-bookings, /fitting-room-bookings/{id}/release"
      - "POST /gown-orders, /gown-orders/{id}/submit, /gown-orders/{id}/mark-ready, /gown-orders/{id}/pickup"
      - "POST /accessory-addons, /accessory-addons/{id}/remove"
      - "all GET endpoints"

  - name: Seamstress
    description: "Alteration staff; owns the alteration workflow and ready-marking."
    identity: "opaque"
    exclusive_operations:
      - "POST /alteration-jobs/{id}/start-fitting, /request-adjustment, /log-labor, /complete — drive the fitting cycle"
    shared_operations:
      - "POST /alteration-jobs, /alteration-jobs/{id}/cancel"
      - "POST /gown-orders/{id}/mark-ready"
      - "all GET endpoints"

  - name: FinanceClerk
    description: "Billing staff; owns payment plans, payments, and refunds."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /payment-plans, /payment-plans/{id}/payments, /payment-plans/{id}/refund"
      - "all GET endpoints"
