        grounds:
          - validations[priority=4]
          - entities.PracticePricingAgreement.fields.effective_to
          - errors.ERR_PRICING_WINDOW_OVERLAP
        distinguishing_aspect: "Interval semantics are half-open [effective_from, effective_to): a new window starting exactly at the incumbent's effective_to is ADJACENT and accepted, while one starting one second earlier intersects and is refused — the two differ by a single second of geometry."
