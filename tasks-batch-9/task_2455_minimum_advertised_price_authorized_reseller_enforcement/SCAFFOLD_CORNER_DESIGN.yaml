  # ===========================================================================
  # SECTION 3 — calculations  (§1.3, 13 declared calculations)
  # ===========================================================================
  - section: calculations
    instances:

      # --- bundle_component_allocation --------------------------------------
      - name: bundle_allocation_three_components_residual_to_last_member
        claim_type: correct_result
        grounds: ["calculations.bundle_component_allocation"]
        distinguishing_aspect: "Waterfall over msrp 20000/5000/3000 on a 10000 bundle: each non-last share is round_half_up FIRST (7143, 1786) and the residual 1071 lands on SKU-CASE-1, so the three shares sum to exactly 10000."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1 msrp 20000 / floor 15000; a 3-SKU bundle advertised at 10000 total."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
            - &OBSBUNDLE3
              call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "GreyBox Deals", listing_url: "https://mkt.example/b/3", listed_price_cents: 10000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", is_bundle: true, bundle_total_price_cents: 10000, bundle_components: [{ sku: "SKU-AUDIO-1", msrp_cents: 20000 }, { sku: "SKU-CABLE-1", msrp_cents: 5000 }, { sku: "SKU-CASE-1", msrp_cents: 3000 }] }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obsb3: $.data.id }
          trigger:
            - call: "POST /price-observations/${obsb3}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { alloc: $.data.allocated_component_price_cents, eff: $.data.effective_advertised_price_cents, dc: $.data.deviation_cents, dp: $.data.deviation_pct, pp: $.data.provisional_points }
          assert:
            - "HTTP 200"
            - "${alloc} == 7143"
            - "${eff} == 7143"
            - "${dc} == 7857"
            - "${dp} == 0.5238"
            - "${pp} == 9"
            - "PriceObservation.${obsb3}.effective_map_floor_cents == 15000"

      - name: bundle_allocation_residual_recipient_is_the_sku_ascending_tie_break
        claim_type: constants_applied
        grounds: ["calculations.bundle_component_allocation"]
        distinguishing_aspect: "RESIDUAL_RECIPIENT is the last member of (msrp_cents DESC, sku ASC), so with two equal 20000 msrps SKU-AUDIO-1 sorts first and is round_half_up to 5001 (from 5000.5) while SKU-BASS-1 absorbs the 5000 residual on a 10001 bundle."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1 msrp 20000 / floor 15000; a 2-SKU bundle at 10001 whose members have identical msrp 20000."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "GreyBox Deals", listing_url: "https://mkt.example/b/tie", listed_price_cents: 10001, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", is_bundle: true, bundle_total_price_cents: 10001, bundle_components: [{ sku: "SKU-AUDIO-1", msrp_cents: 20000 }, { sku: "SKU-BASS-1", msrp_cents: 20000 }] }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obstie: $.data.id }
          trigger:
            - call: "POST /price-observations/${obstie}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { alloc: $.data.allocated_component_price_cents, dc: $.data.deviation_cents, dp: $.data.deviation_pct, pp: $.data.provisional_points }
          assert:
            - "HTTP 200"
            - "${alloc} == 5001"
            - "${dc} == 9999"
            - "${dp} == 0.6666"
            - "${pp} == 9"

      - name: bundle_allocation_observed_sku_can_be_the_residual_recipient
        claim_type: precision
        grounds: ["calculations.bundle_component_allocation"]
        distinguishing_aspect: "An 18000 two-member bundle allocates 14400 exactly to SKU-AUDIO-1 with no drift, so the residual member SKU-CABLE-1 takes 3600 and the observed component breaches by only 600 (pct 0.0400, base tier 1, 2 points)."
        test_recipe:
          setup: ["Policy MAP-2026-A PUBLISHED; product SKU-AUDIO-1 msrp 20000 / floor 15000; a 2-SKU bundle at 18000."]
          setup_api_calls:
            - *CLK0801
            - *POLNEW
            - *POLSUB
            - *POLDEC
            - *POLPUB
            - *PRODA1
            - *CLK0820
            - call: "POST /price-observations"
              payload: { product_id: "${prod}", channel: "MARKETPLACE", seller_display_name: "GreyBox Deals", listing_url: "https://mkt.example/b/2", listed_price_cents: 18000, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b", is_bundle: true, bundle_total_price_cents: 18000, bundle_components: [{ sku: "SKU-AUDIO-1", msrp_cents: 20000 }, { sku: "SKU-CABLE-1", msrp_cents: 5000 }] }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
