          - "calculations.budget_line_variance_recognition"
        excluded_because:
          difficulty_instance: venue_reimbursement_rounds_per_line_not_on_the_category_total
          rationale: "The §1.8 instance already walks the aggregation row end to end: it adds lines one at a time and reads the running reimbursement total after each add, then reverses a line (VOID via cancellation and a REJECTED variance clamp) and re-reads, proving the total is recomputed per line rather than accumulated on a category subtotal. Its whole point is that the per-line rounding floor cannot be reconstructed from the aggregate, which is exactly the 'running total correct after add; correct after reversal' claim. A separate corner instance would drive the same endpoints with the same literals and could only be a weaker copy."

      - name: adjusted_gross_buckets_are_taken_in_the_declared_order_on_the_canonical_fixture
        claim_type: waterfall_allocation
        grounds:
          - "calculations.adjusted_gross_receipts"
          - "calculations.adjusted_gross_receipts.order_sensitivity"
          - "entities.Settlement.fields.ticket_tax_cents"
          - "entities.Settlement.fields.facility_fee_cents"
          - "entities.Settlement.fields.credit_card_fee_cents"
          - "endpoints[POST /settlements/{settlement_id}/calculate]"
        distinguishing_aspect: "The canonical 11400000 / 1800-ticket fixture pins all four buckets at once: tax 912000 off the gross, facility 630000 as a per-ticket charge that is NOT a percentage, card 262200 charged on the POST-TAX but PRE-FACILITY base, adjusted 9595800. The card bucket is the whole test: charging it on the raw gross gives 285000 (adjusted 9573000) and charging it after facility too gives 246450 (adjusted 9611550), so a single mis-ordered bucket is a 22800-cent error that the other three buckets hide."
        test_recipe:
          setup:
            - "Market Waterfall Market limit 20000000; Artist Waterfall Act withholding 0."
            - "Venue Waterfall Coliseum: gross_capacity 2500, ticket_tax_pct 8.00, facility_fee_cents_per_ticket 350 — a percentage bucket and a per-head bucket that cannot be confused."
            - "RENTAL show with rental_fee_cents 0 and ONE un-invoiced PRODUCTION line budgeted 100000 (validations priority 30 demands at least one BudgetLine before a settlement may be calculated). With no invoice behind it the line's actual_cents is 0, variance_pct is -100.00, it stays WITHIN_TOLERANCE and its settlement_expense_cents is 0 — so every expense leg is zero and the whole settlement is the receipt waterfall plus a flat guarantee."
            - "Accepted FLAT_GUARANTEE offer: guarantee 5000000, deposit 0, expense_cap 2500000."
            - "Sales: GA 5000 x 1400 sells 800 at 5000, is revised to 6000, sells 600 more; PIT 9500 x 400 sells 400. Gross 11400000 across exactly 1800 paid tickets."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: RiskOfficer
            - call: "POST /markets"
              payload: { name: "Waterfall Market", region_code: "WF", guarantee_exposure_limit_cents: 20000000 }
              as: RiskOfficer
              captures: { wf_mk_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Waterfall Act", agency: "Wtf Talent", tier: "ARENA", historical_sellthrough_pct: 75.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { wf_ar_id: $.data.id }
            - call: "POST /venues"
              payload: { market_id: "${wf_mk_id}", name: "Waterfall Coliseum", gross_capacity: 2500, facility_fee_cents_per_ticket: 350, ticket_tax_pct: 8.00 }
              as: TalentBuyer
              captures: { wf_vn_id: $.data.id }
            - call: "POST /shows"
              payload: { artist_id: "${wf_ar_id}", venue_id: "${wf_vn_id}", event_at: "2026-11-12T02:00:00.000Z", load_in_at: "2026-11-11T14:00:00.000Z", load_out_at: "2026-11-12T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
              as: TalentBuyer
              captures: { wf_sh_id: $.data.id, wf_sh_v: $.data.version }
            - call: "POST /offers"
              payload: { show_id: "${wf_sh_id}", expected_show_version: "${wf_sh_v}", deal_structure: "FLAT_GUARANTEE", guarantee_cents: 5000000, deposit_cents: 0, expense_cap_cents: 2500000 }
              as: TalentBuyer
              captures: { wf_of_id: $.data.id }
            - call: "POST /offers/${wf_of_id}/submit"
              payload: {}
              as: TalentBuyer
            - call: "POST /offers/${wf_of_id}/accept"
              payload: {}
              as: ArtistRep
              as_user_id: "${wf_ar_id}"
            - call: "POST /budget-lines"
              payload: { show_id: "${wf_sh_id}", category: "PRODUCTION", description: "Production allowance, never invoiced", budgeted_cents: 100000, is_artist_deductible: false }
              as: TourAccountant
              captures: { wf_bl_id: $.data.id }
            - call: "POST /ticket-tiers"
              payload: { show_id: "${wf_sh_id}", tier_name: "GA", price_cents: 5000, allocation_qty: 1400 }
