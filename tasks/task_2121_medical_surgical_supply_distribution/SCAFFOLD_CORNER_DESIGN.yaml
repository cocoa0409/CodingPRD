            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 3000, floor_price_cents: 2000 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-WIN", par_qty: 50, reorder_point: 10 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_id: $.data.id }
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /lots"
              payload: { item_id: "${item_id}", lot_code: "LOT-WIN", expiry_date: "2027-12-31T00:00:00Z", received_quantity: 50 }
              as: DistributionOperator
              as_user_id: "dc-op-1"
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_id}", requested_qty: 2, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
            - call: "POST /orders/${order_id}/allocate"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
            - call: "POST /delivery-routes"
              payload: { route_code: "RT-WIN", service_date: "2026-08-05", vehicle_class: "AMBIENT_VAN" }
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /delivery-routes/${route_id}/stops"
              payload: { order_id: "${order_id}", arrival_min: 580, service_minutes: 30 }
              as: DistributionOperator
              as_user_id: "dc-op-1"
