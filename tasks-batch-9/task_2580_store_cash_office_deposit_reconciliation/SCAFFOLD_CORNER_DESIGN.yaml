              as_user_id: "U-MGR-1"
              captures: { cashier_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 1, shift_start_at: "2026-08-03T09:00:00Z", shift_end_at: "2026-08-03T17:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { session_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T17:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/till-sessions/${session_id}/close"
              payload: { pos_cash_sales_cents: 100000, pos_card_sales_cents: 0, pos_paid_out_cents: 0 }
              as: StoreManager
              as_user_id: "U-MGR-1"
            - call: "POST /cash-ops/till-sessions/${session_id}/blind-count"
              payload: { counted_lines: [{ denomination_cents: 2000, quantity: 30 }] }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-3"
            - call: "POST /cash-ops/till-sessions/${session_id}/reconcile"
              payload: {}
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "GET /cash-ops/variance-cases"
              payload: { sales_journal_id: "${journal_id}", case_type: "SESSION_VARIANCE" }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { case_id: "$.data[0].id", case_v: "$.data[0].version" }
            - call: "POST /cash-ops/variance-cases/${case_id}/attributions"
              payload: { bucket: "REGISTER", amount_cents: 1000, note: "Void keyed as cash", expected_variance_case_version: "${case_v}" }
              as: StoreManager
              as_user_id: "U-MGR-1"
            - call: "POST /cash-ops/variance-cases/${case_id}/escalate"
              payload: { escalation_reason: "60000 short with no plausible explanation" }
              as: StoreManager
              as_user_id: "U-MGR-1"
            - call: "POST /cash-ops/variance-cases/${case_id}/close"
              payload: { disposition: "SUBSTANTIATED", closing_note: "Video shows cash removed from the till drawer" }
              as: LossPreventionInvestigator
              as_user_id: "U-LP-1"
          trigger:
            - call: "POST /cash-ops/till-sessions"
              payload: { sales_journal_id: "${journal_id}", cashier_id: "${cashier_id}", safe_id: "${safe_id}", register_number: 2, shift_start_at: "2026-08-03T18:00:00Z", shift_end_at: "2026-08-03T22:00:00Z", starting_bank_cents: 20000 }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403 and data.error_id == \"ERR_CASHIER_BARRED\" — not ERR_SAFE_FROZEN, because the close restored posture"
            - "VarianceCase.${case_id}.status == \"CLOSED_SUBSTANTIATED\", disposition == \"SUBSTANTIATED\", unexplained_cents == 59000"
            - "Cashier.${cashier_id}.till_eligibility == \"BARRED\" — a substantiated finding does not reinstate the cashier"
            - "Safe.${safe_id}.posture == \"OPEN\" and balance_cents == 421000 (480000 - 59000 written off)"
            - "GET /cash-ops/safe-transactions?safe_id=${safe_id}&txn_type=VARIANCE_ADJUSTMENT returns total_count == 1 with declared_amount_cents == 59000 and effective_amount_cents == -59000"
            - "SalesJournal.${journal_id}.open_case_count == 1 (the ROLLING_PATTERN case survives) and session_count == 1"

