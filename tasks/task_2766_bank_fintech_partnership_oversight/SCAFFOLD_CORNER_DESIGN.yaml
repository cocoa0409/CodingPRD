            - *q_clock
            - *q_cycle_aug
            - *q_partner_a
            - *q_dr_a
            - *q_dr_a_submit
            - *q_dr_a_pass
            - *q_pa_read_passed
            - *q_agr_a
            - *q_agr_a_submit
            - *q_agr_a_execute
            - *q_res_a_read
            - *q_res_fund_312500
            - *q_go_live_a
