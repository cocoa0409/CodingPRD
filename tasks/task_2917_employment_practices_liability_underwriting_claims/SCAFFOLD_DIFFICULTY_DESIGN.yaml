              as: Underwriter
              as_user_id: "uw-001"
              captures: { pol_id: $.data.id }
            - call: "POST /epli/policies/${pol_id}/claims"
              payload: { claim_type: "HARASSMENT", claimant_class: "EMPLOYEE", notice_type: "LAWSUIT", first_notice_at: "2026-08-01T00:00:00.000Z", alleged_damages_cents: 9000000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { c1_id: $.data.id }
            - call: "POST /epli/claims/${c1_id}/start-review"
