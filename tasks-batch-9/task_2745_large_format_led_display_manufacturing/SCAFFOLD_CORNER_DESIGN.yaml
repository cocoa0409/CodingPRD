          - errors.ERR_CREW_DOUBLE_BOOKED
          - calculations.crew_window_occupancy
        excluded_because:
          difficulty_instance: crew_half_open_window_adjacency_allowed_overlap_rejected
          rationale: |
            ERR_CREW_DOUBLE_BOOKED with the half-open adjacency boundary — a visit
            starting exactly at the previous window_end accepted, one millisecond
            earlier rejected — is exactly that §1.8 instance.

