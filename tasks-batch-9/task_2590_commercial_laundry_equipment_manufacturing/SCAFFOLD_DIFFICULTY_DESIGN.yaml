              as: Technician
              as_user_id: "${t1}"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 409"
            - "${err} == ERR_BUILD_STATE_INVALID"
            - "${err} != ERR_TECHNICIAN_NOT_CERTIFIED (priority 36 loses to priority 26)"
            - "BuildOrder.${b1}.build_state == PLANNED"
