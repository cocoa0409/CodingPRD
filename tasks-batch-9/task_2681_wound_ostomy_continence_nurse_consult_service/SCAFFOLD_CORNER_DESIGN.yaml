              captures: { c1_id: "$.data.id" }
            - call: "POST /consult-requests"
              payload: { patient_id: "${p2_id}", requesting_unit_id: "${u1_id}", consult_type: "WOUND", reported_stage: "STAGE_2", clinical_note: "New sacral breakdown on day three." }
              as: UnitCharge
