      - name: explicit_exclusion_outranks_the_stale_window_rules
        claim_type: priority_conflict
        grounds:
          - validations.priority_36
          - validations.priority_35
          - validations.priority_58
        excluded_because:
          difficulty_instance: excluded_target_outranks_expired_testing_window
          rationale: "The §1.8 instance already files a finding against an EXCLUDED target whose window has also lapsed and asserts ERR_TARGET_EXCLUDED rather than ERR_NO_OPEN_TESTING_WINDOW or ERR_OUTSIDE_TESTING_WINDOW, which is exactly this three-rule ordering claim."

      - name: capacity_check_precedes_the_hour_ledger_check
        claim_type: priority_conflict
        grounds:
          - validations.priority_56
          - validations.priority_65
        excluded_because:
          difficulty_instance: tester_capacity_outranks_engagement_hour_budget
          rationale: "That §1.8 instance builds an assignment that simultaneously exceeds max_concurrent_engagements and the remaining hour budget and asserts ERR_TESTER_CAPACITY_EXCEEDED, so a separate breadth probe of the same pair would be a copy."

      - name: provisioning_requires_a_cleared_background_check
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_40
          - errors[ERR_TESTER_NOT_CLEARED]
        excluded_because:
          difficulty_instance: access_provisioning_depends_on_tester_clearance_state
          rationale: "The §1.8 guarded-transition instance provisions the same assignment before and after the background check clears, asserting ERR_TESTER_NOT_CLEARED then success, which subsumes the with/without conditional claim."

      - name: unsigned_rules_of_engagement_block_the_start
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_15
          - errors[ERR_ENGAGEMENT_NOT_AUTHORIZED]
        excluded_because:
          difficulty_instance: engagement_start_depends_on_rules_of_engagement_signature
          rationale: "That §1.8 instance starts the engagement before and after the signature, asserting ERR_ENGAGEMENT_NOT_AUTHORIZED while the document is DRAFT and EXECUTING afterwards — the identical cross-entity precondition claim."

      - name: cooldown_padded_network_windows_collide
        claim_type: temporal_validation
        grounds:
          - validations.priority_54
          - calculations.authorized_target_collision
          - errors[ERR_TARGET_WINDOW_COLLISION]
        excluded_because:
          difficulty_instance: network_target_windows_collide_across_an_inclusive_cooldown_gap
          rationale: "The §1.8 instance probes the 24-hour NETWORK cooldown at exactly the padded boundary and one second beyond it, so the breadth-level collision claim is already covered with tighter literals."

  - section: endpoints
    instances:
      - name: test_plan_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /pentest/test-plans]
          - endpoints[GET /pentest/test-plans/{id}]
          - endpoints[GET /pentest/test-plans]
          - response_envelope.pagination_fields
        distinguishing_aspect: "The plan surface is create + read + filterable list with no delete: two plans in different fiscal years are created, each reads back with its own admission_threshold, and the fiscal_year filter narrows the list to one row with total_count 1 and has_more false while an unfiltered limit of 1 reports has_more true."
        test_recipe:
          setup:
            - "No prior plans."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2026, risk_appetite_score: 40, planned_engagement_count: 5, prioritization_mode: "RISK_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { p1_id: $.data.id, p1_thr: $.data.admission_threshold, p1_status: $.data.status, p1_ver: $.data.version }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2027, risk_appetite_score: 10, planned_engagement_count: 3, prioritization_mode: "COMPLIANCE_DRIVEN" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { p2_id: $.data.id, p2_thr: $.data.admission_threshold, p2_mode: $.data.prioritization_mode }
            - call: "GET /pentest/test-plans/${p1_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { r_id: $.data.id, r_year: $.data.fiscal_year, r_cov: $.data.coverage_score, r_total: $.data.total_risk_points }
            - call: "GET /pentest/test-plans"
              payload: { fiscal_year: 2027, limit: 10, offset: 0 }
              as: PlatformAdmin
              captures: { l_first: "$.data[0].id", l_year: "$.data[0].fiscal_year" }
            - call: "GET /pentest/test-plans"
              payload: { limit: 1, offset: 0 }
              as: PlatformAdmin
              captures: { pg_first: "$.data[0].id" }
          assert:
            - "${p1_thr} == 60 and ${p2_thr} == 90 — admission_threshold is 100 minus the appetite"
            - "${p1_status} == DRAFT and ${p1_ver} == 1 on creation"
            - "${p2_mode} == COMPLIANCE_DRIVEN — the mode is honoured at creation, not forced to the default"
            - "${r_id} == ${p1_id}, ${r_year} == 2026, ${r_cov} == 0.00 and ${r_total} == 0"
            - "the fiscal_year 2027 list returns exactly one row with ${l_first} == ${p2_id}, ${l_year} == 2027, total_count == 1 and has_more == false"
            - "the unfiltered limit-1 page returns ${pg_first} with total_count == 2 and has_more == true"

