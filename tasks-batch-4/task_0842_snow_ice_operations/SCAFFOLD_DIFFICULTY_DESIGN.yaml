  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: overtime_threshold_eight_hours
        grounds:
          - calculations.overtime_pay
          - entities.Callout.fields.overtime_hours
          - entities.Callout.fields.pay_cents
        distinguishing_aspect: |
          Overtime accrues strictly ABOVE the 8.0h STANDARD threshold: hours_worked exactly 8.00 yields
          overtime_hours 0 and pay 32000, while 8.01 yields overtime_hours > 0 and pay 32060. Boundary is
          on the labor-hours metric via POST /callouts/{id}/complete.
        test_recipe:
          setup:
            - "One operator at 4000/hr; a MODERATE storm with two ISSUED callouts (windows 16h apart)."
          setup_api_calls:
            - call: "POST /operators"
              payload: { full_name: "Op B", badge_number: "B3", cdl_class: "B", hourly_rate_cents: 4000 }
              as: YardManager
