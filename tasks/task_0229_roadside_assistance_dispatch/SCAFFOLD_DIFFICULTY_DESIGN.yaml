scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: final_service_cost_estimate_revised_vs_held_on_service_call
        grounds:
          - calculations.final_service_cost
          - calculations.estimated_service_cost
          - entities.ServiceCall.fields.final_cost_cents
          - state_machines.ServiceCall.EN_ROUTE_to_COMPLETED
        distinguishing_aspect: "On a ServiceCall (cost-accounting domain), completing with final_towed_miles=20 yields final_cost_cents=3000 while the at-creation estimate held a different value; the held variant (no final_towed_miles) leaves final_cost_cents == estimated_cost_cents."
        test_recipe:
          setup:
            - "Clock at 2026-06-01T12:00:00Z. PLUS plan: cap=5mi, overage=200c/mi, covers TOW, base=7500, annual_limit=4."
            - "ACTIVE member; TOW-capable AVAILABLE provider; a TOW call (breakdown (0,0) -> dropoff (0,0.2)) driven to EN_ROUTE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, call_v0: $.data.version, est_cost: $.data.estimated_cost_cents }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${call_v0}" }
              as: DispatchOperator
              captures: { offer_id: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${offer_id}/accept"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /service-calls/${call_id}/start"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /service-calls/${call_id}/complete"
              payload: { final_towed_miles: 20 }
              as: ServiceProvider
              as_user_id: "${prov_id}"
              captures: { fin_cost: $.data.final_cost_cents }
          assert:
            - "ServiceCall.${call_id}.status == COMPLETED"
            - "ServiceCall.${call_id}.final_cost_cents == 3000"
            - "ServiceCall.${call_id}.member_out_of_pocket_cents == 3000"

      - name: reimbursement_payout_capped_vs_full_on_reimbursement_claim
        grounds:
          - calculations.reimbursement_payout
          - entities.ReimbursementClaim.fields.approved_amount_cents
          - state_machines.ReimbursementClaim.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: "On a ReimbursementClaim (claims-adjudication domain, distinct from ServiceCall cost-accounting), an over-claim of 5000 against a call whose member_out_of_pocket_cents=3000 is trimmed: approved_amount_cents=3000, not the claimed 5000."
        test_recipe:
          setup:
            - "A COMPLETED TOW call with member_out_of_pocket_cents=3000 (final_towed_miles=20, PLUS plan)."
            - "Member files a claim for 5000 (over the documented cost); operator begins review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, call_v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${call_v0}" }
              as: DispatchOperator
              captures: { offer_id: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${offer_id}/accept"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /service-calls/${call_id}/start"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /service-calls/${call_id}/complete"
              payload: { final_towed_miles: 20 }
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /reimbursement-claims"
              payload: { member_id: "${mem_id}", service_call_id: "${call_id}", claimed_amount_cents: 5000 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /reimbursement-claims/${claim_id}/begin-review"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "POST /reimbursement-claims/${claim_id}/approve"
              payload: {}
              as: DispatchOperator
              captures: { approved: $.data.approved_amount_cents }
          assert:
            - "ReimbursementClaim.${claim_id}.status == APPROVED"
            - "ReimbursementClaim.${claim_id}.approved_amount_cents == 3000"
            - "Member.${mem_id}.outstanding_balance_cents == 0"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tow_overage_nested_rounding_order_round_then_multiply_then_round
        grounds:
          - calculations.final_service_cost
          - entities.ServiceCall.fields.final_cost_cents
          - state_machines.ServiceCall.EN_ROUTE_to_COMPLETED
        distinguishing_aspect: "Mode (b) nested rounding: final cost pins round-miles-to-3dp THEN multiply by rate THEN round-to-cents; with final_towed_miles=12.3456 (cap 5, rate 200) overage_miles=7.3456 -> round3=7.346 -> *200=1469.2 -> round=1469."
        test_recipe:
          setup:
            - "PLUS plan cap=5, rate=200, TOW covered, base=7500. A TOW call driven to EN_ROUTE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, call_v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${call_v0}" }
              as: DispatchOperator
              captures: { offer_id: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${offer_id}/accept"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /service-calls/${call_id}/start"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
          trigger:
            - call: "POST /service-calls/${call_id}/complete"
              payload: { final_towed_miles: 12.3456 }
              as: ServiceProvider
              as_user_id: "${prov_id}"
          assert:
            - "ServiceCall.${call_id}.final_cost_cents == 1469"

      - name: dispatch_candidate_multifactor_ranking_with_tow_conditional_tiebreak
        grounds:
          - calculations.dispatch_priority_selection
          - entities.ServiceProvider.fields.rating
          - entities.ProviderShift.fields.shift_start
        distinguishing_aspect: "Mode (a) >=3-input non-linear ranking with a conditional branch: ranking is rating DESC, then offer_distance ASC, then (TOW-only) capabilities_len ASC, then created_at ASC; two equally-rated equally-distant TOW providers are ordered by fewer capabilities first."
        test_recipe:
          setup:
            - "Clock 2026-06-01T12:00Z. A TOW call at (0,0). Two providers both rating 4.5, both at (0,0.05) (same distance), both inside a SCHEDULED shift covering noon; provider SPEC has capabilities [TOW] (len 1, registered first), provider GEN has [TOW,JUMP] (len 2)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Spec Tow", current_lat: 0.0, current_lng: 0.05, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { spec_id: $.data.id }
            - call: "POST /service-providers/${spec_id}/shifts"
              payload: { shift_start: "2026-06-01T08:00:00Z", shift_end: "2026-06-01T20:00:00Z" }
              as: DispatchOperator
            - call: "POST /service-providers"
              payload: { company_name: "Gen Tow", current_lat: 0.0, current_lng: 0.05, capabilities: ["TOW","JUMP"], rating: 4.5 }
              as: DispatchOperator
              captures: { gen_id: $.data.id }
            - call: "POST /service-providers/${gen_id}/shifts"
              payload: { shift_start: "2026-06-01T08:00:00Z", shift_end: "2026-06-01T20:00:00Z" }
              as: DispatchOperator
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id }
          trigger:
            - call: "GET /service-calls/${call_id}/dispatch-candidates"
              payload: {}
              as: DispatchOperator
          assert:
            - "response data array length == 2"
            - "data[0].id == ${spec_id}"
            - "data[1].id == ${gen_id}"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: service_call_cyclic_redispatch_loop_decline_then_reoffer
        grounds:
          - state_machines.ServiceCall.DISPATCHING_to_DISPATCHING
          - state_machines.DispatchOffer.OFFERED_to_DECLINED
          - entities.ServiceCall.fields.dispatch_attempts
        distinguishing_aspect: "ServiceCall is cyclic: after a provider DECLINES the live offer the call returns to DISPATCHING and a second offer is dispatched, proving the DISPATCHING self-loop; dispatch_attempts increments to 2 across the cycle."
        test_recipe:
          setup:
            - "A DISPATCHING TOW call; one TOW-capable provider who will decline, then a second offer is dispatched to it again."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, call_v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${call_v0}" }
              as: DispatchOperator
              captures: { offer1_id: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${offer1_id}/decline"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "GET /service-calls/${call_id}"
              payload: {}
              as: DispatchOperator
              captures: { call_v1: $.data.version }
          trigger:
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${call_v1}" }
              as: DispatchOperator
              captures: { offer2_id: $.data.id }
          assert:
            - "ServiceCall.${call_id}.status == DISPATCHING"
            - "ServiceCall.${call_id}.dispatch_attempts == 2"
            - "DispatchOffer.${offer2_id}.status == OFFERED"

      - name: reimbursement_claim_cyclic_info_request_resubmit_loop
        grounds:
          - state_machines.ReimbursementClaim.UNDER_REVIEW_to_INFO_REQUESTED
          - state_machines.ReimbursementClaim.INFO_REQUESTED_to_SUBMITTED
          - state_machines.ReimbursementClaim.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: "ReimbursementClaim (a different entity from ServiceCall) is cyclic: SUBMITTED -> UNDER_REVIEW -> INFO_REQUESTED -> SUBMITTED returns the claim to its initial state, proving the revision loop."
        test_recipe:
          setup:
            - "A COMPLETED call and a SUBMITTED claim against it; operator begins review then requests info; member resubmits."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, call_v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${call_v0}" }
              as: DispatchOperator
              captures: { offer_id: $.data.id }
            - call: "POST /service-calls/${call_id}/offers/${offer_id}/accept"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /service-calls/${call_id}/start"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /service-calls/${call_id}/complete"
              payload: { final_towed_miles: 20 }
              as: ServiceProvider
              as_user_id: "${prov_id}"
            - call: "POST /reimbursement-claims"
              payload: { member_id: "${mem_id}", service_call_id: "${call_id}", claimed_amount_cents: 1500 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /reimbursement-claims/${claim_id}/begin-review"
              payload: {}
              as: DispatchOperator
            - call: "POST /reimbursement-claims/${claim_id}/request-info"
              payload: {}
              as: DispatchOperator
          trigger:
            - call: "POST /reimbursement-claims/${claim_id}/resubmit"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "ReimbursementClaim.${claim_id}.status == SUBMITTED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: accept_offer_depth3_offer_to_call_to_provider
        grounds:
          - state_machines.ServiceCall.DISPATCHING_to_ASSIGNED
          - state_machines.DispatchOffer.OFFERED_to_ACCEPTED
          - entities.ServiceProvider.fields.status
          - entities.ServiceProvider.fields.active_call_id
        distinguishing_aspect: "Depth-3 chain triggered by accept: hop1 DispatchOffer->ACCEPTED causes hop2 ServiceCall->ASSIGNED (assigned_provider_id set) which causes hop3 ServiceProvider->ON_JOB (active_call_id set); each hop is caused by the prior, not directly by the accept action."
        test_recipe:
          setup:
            - "A DISPATCHING TOW call with one live offer from an AVAILABLE TOW provider."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
              payload: { member_id: "${mem_id}", service_type: "TOW", breakdown_lat: 0.0, breakdown_lng: 0.0, dropoff_lat: 0.0, dropoff_lng: 0.2 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { call_id: $.data.id, call_v0: $.data.version }
            - call: "POST /service-calls/${call_id}/offers"
              payload: { provider_id: "${prov_id}", expected_service_call_version: "${call_v0}" }
              as: DispatchOperator
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /service-calls/${call_id}/offers/${offer_id}/accept"
              payload: {}
              as: ServiceProvider
              as_user_id: "${prov_id}"
          assert:
            - "DispatchOffer.${offer_id}.status == ACCEPTED"
            - "ServiceCall.${call_id}.status == ASSIGNED"
            - "ServiceCall.${call_id}.assigned_provider_id == ${prov_id}"
            - "ServiceProvider.${prov_id}.status == ON_JOB"
            - "ServiceProvider.${prov_id}.active_call_id == ${call_id}"

      - name: cancel_assigned_call_depth2_call_to_provider_release
        grounds:
          - state_machines.ServiceCall.ASSIGNED_to_CANCELLED
          - entities.ServiceProvider.fields.status
          - entities.ServiceProvider.fields.active_call_id
        distinguishing_aspect: "Depth-2 chain from a different trigger (Member cancel): hop1 ServiceCall->CANCELLED causes hop2 the previously-assigned ServiceProvider->AVAILABLE with active_call_id cleared (compensation); originates from a different transition than the accept cascade."
        test_recipe:
          setup:
            - "An ASSIGNED TOW call with provider ON_JOB (active_call_id set)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: DispatchOperator
            - call: "POST /membership-plans"
              payload: { tier: "PLUS", annual_service_limit: 4, per_incident_mileage_cap_miles: 5, overage_rate_cents_per_mile: 200, priority_weight: 20, covered_service_types: ["TOW","JUMP","LOCKOUT","FUEL","TIRE"], base_service_fee_cents: 7500 }
              as: DispatchOperator
              captures: { plus_plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plus_plan_id}", full_name: "Mia Member", home_lat: 0.0, home_lng: 0.0 }
              as: DispatchOperator
              captures: { mem_id: $.data.id }
            - call: "POST /service-providers"
              payload: { company_name: "Ace Tow", current_lat: 0.0, current_lng: 0.1, capabilities: ["TOW"], rating: 4.5 }
              as: DispatchOperator
              captures: { prov_id: $.data.id }
            - call: "POST /service-calls"
