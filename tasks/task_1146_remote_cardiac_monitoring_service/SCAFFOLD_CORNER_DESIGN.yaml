  # ================================================================ cross-cutting complexity layers
  - section: complexity_layers
    instances:
      - name: enrollment_create_stale_order_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-create-stale-order]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC stale write: after a first enrollment create bumps the order version 1 -> 2, a second create carrying the stale expected_order_version 1 is rejected 412 ERR_STALE_VERSION (two strictly sequential requests; no wall-clock dependence)."
        test_recipe:
          setup: ["order OPEN at version 1; two EVENT devices IN_STOCK"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Occ Stale", date_of_birth: "1983-03-03", mrn: "MRN-6001", phone: "555-5000", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Occ", npi: "6000000001", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-6001", model: "EVENT" }, as: InventoryManager, captures: { d1_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-6002", model: "EVENT" }, as: InventoryManager, captures: { d2_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d1_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e1_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d2_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "First trigger returns 201 (order.version now 2)"
            - "Second trigger with the stale expected_order_version returns http 412 ERR_STALE_VERSION"
            - "Device.${d2_id}.status stays IN_STOCK (rejected write has no side effects)"

      - name: enrollment_create_bumps_order_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[enrollment-create-stale-order]", "endpoints.POST /v1/monitoring-orders/{id}/enrollments"]
        distinguishing_aspect: "Happy path: a correct expected_order_version succeeds and the parent's version increments by exactly 1, observable via GET /v1/monitoring-orders/{id}."
        test_recipe:
          setup: ["order OPEN at version 1; device IN_STOCK"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Occ Bump", date_of_birth: "1984-03-03", mrn: "MRN-6002", phone: "555-5001", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Bump", npi: "6000000002", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-6003", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
          trigger:
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "GET /v1/monitoring-orders/${o_id}", as: EnrollmentCoordinator, captures: { o_v2: $.data.version } }
          assert:
            - "Enrollment ${e_id} created (201) with status INITIATED"
            - "MonitoringOrder.${o_id}.version == 2 (${o_v} + 1)"

      - name: enrollment_create_supersedes_prior_nonterminal
        claim_type: cascading_side_effects
        grounds: ["endpoints.POST /v1/monitoring-orders/{id}/enrollments", state_machines.Enrollment]
        distinguishing_aspect: "Create-with-supersede: a second enrollment at the fresh version auto-aborts the prior INITIATED enrollment and releases its RESERVED device, all in one request."
        test_recipe:
          setup: ["order OPEN; enrollment E1 INITIATED holding device D1 RESERVED; device D2 IN_STOCK; order re-read at version 2"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Supersede", date_of_birth: "1985-03-03", mrn: "MRN-6003", phone: "555-5002", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Super", npi: "6000000003", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-6004", model: "EVENT" }, as: InventoryManager, captures: { d1_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-6005", model: "EVENT" }, as: InventoryManager, captures: { d2_id: $.data.id } }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d1_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e1_id: $.data.id } }
            - { call: "GET /v1/monitoring-orders/${o_id}", as: EnrollmentCoordinator, captures: { o_v2: $.data.version } }
          trigger:
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d2_id}", expected_order_version: "${o_v2}" }, as: EnrollmentCoordinator, captures: { e2_id: $.data.id } }
          assert:
            - "Enrollment ${e2_id} created with status INITIATED and device_id == ${d2_id}"
            - "Enrollment.${e1_id}.status == ABORTED (superseded)"
            - "Device.${d1_id}.status == IN_STOCK and Device.${d2_id}.status == RESERVED"

      - name: derived_total_billed_reconciliation
        claim_type: derived_field_reconciliation
        grounds: [entities.MonitoringEpisode.fields.total_billed_cents]
        distinguishing_aspect: "episode.total_billed_cents reconciles to the sum of submitted_total_cents (20040) after submit and is NOT drifted by a later approved +500 adjustment (snapshot semantics pinned)."
        test_recipe:
          setup: ["10-day episode COMPLETED; period SUBMITTED 20040; then +500 adjustment approved by a second billing user"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Reconcile", date_of_birth: "1986-03-03", mrn: "MRN-6004", phone: "555-5003", insurance_plan: "COMMERCIAL" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Rec", npi: "6000000004", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-6006", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 10 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-11T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/episodes/${ep_id}/complete", payload: { reason: "COMPLETED" }, as: EnrollmentCoordinator }
            - { call: "POST /v1/episodes/${ep_id}/billing-periods/generate", payload: {}, as: BillingSpecialist, captures: { bp_id: "$.data[0].id" } }
            - { call: "POST /v1/episodes/${ep_id}/reports", payload: { report_type: "INTERIM", findings_summary: "ok" }, as: Physician, as_user_id: "${dr_id}", captures: { r_id: $.data.id } }
            - { call: "POST /v1/reports/${r_id}/finalize", payload: {}, as: Physician, as_user_id: "${dr_id}" }
            - { call: "POST /v1/_ops/run-daily-sweep", payload: {}, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/billing-periods/${bp_id}/submit", payload: {}, as: BillingSpecialist, as_user_id: "billing-1" }
            - { call: "GET /v1/episodes/${ep_id}", as: BillingSpecialist }
            - { call: "POST /v1/billing-periods/${bp_id}/propose-adjustment", payload: { delta_cents: 500, reason: "documentation" }, as: BillingSpecialist, as_user_id: "billing-1" }
            - { call: "POST /v1/billing-periods/${bp_id}/approve-adjustment", payload: {}, as: BillingSpecialist, as_user_id: "billing-2" }
            - { call: "GET /v1/episodes/${ep_id}", as: BillingSpecialist }
          assert:
            - "After submit: MonitoringEpisode.${ep_id}.total_billed_cents == 20040"
            - "After the approved +500 adjustment: MonitoringEpisode.${ep_id}.total_billed_cents == 20040 (unchanged; adjustments move recognized_total_cents on the period, not the submitted snapshot sum)"
            - "BillingPeriod.${bp_id}.recognized_total_cents == 20540"

  # ================================================================ consistency model
  - section: consistency_model
    instances:
      - name: same_request_side_effect_visibility
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the activate response itself carries status ACTIVATED and the minted episode_id, and a subsequent GET of the episode shows started_at == the logical clock with both state dimensions at their initials."
        test_recipe:
          setup: ["enrollment EDUCATED, clock pinned at 2026-05-01T08:00:00Z"]
          setup_api_calls:
            - { call: "POST /v1/patients", payload: { full_name: "Immediate", date_of_birth: "1987-03-03", mrn: "MRN-7001", phone: "555-6000", insurance_plan: "MEDICARE" }, as: EnrollmentCoordinator, captures: { p_id: $.data.id } }
            - { call: "POST /v1/physicians", payload: { full_name: "Dr Imm", npi: "7000000001", specialty: "CARDIOLOGY" }, as: PlatformAdmin, captures: { dr_id: $.data.id } }
            - { call: "POST /v1/devices", payload: { serial_number: "EV-7001", model: "EVENT" }, as: InventoryManager, captures: { d_id: $.data.id } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T08:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/monitoring-orders", payload: { patient_id: "${p_id}", monitor_type: "EVENT", prescribed_days: 7 }, as: Physician, as_user_id: "${dr_id}", captures: { o_id: $.data.id, o_v: $.data.version } }
            - { call: "POST /v1/monitoring-orders/${o_id}/enrollments", payload: { device_id: "${d_id}", expected_order_version: "${o_v}" }, as: EnrollmentCoordinator, captures: { e_id: $.data.id } }
            - { call: "POST /v1/enrollments/${e_id}/complete-education", payload: { education_method: "VIDEO" }, as: EnrollmentCoordinator }
          trigger:
            - { call: "POST /v1/enrollments/${e_id}/activate", payload: { baseline_signal_quality: 90 }, as: EnrollmentCoordinator, captures: { ep_id: $.data.episode_id } }
            - { call: "GET /v1/episodes/${ep_id}", as: EnrollmentCoordinator }
          assert:
            - "activate response data.status == ACTIVATED and data.episode_id == ${ep_id} (side effect visible in the same response)"
            - "GET episode: started_at == 2026-05-01T08:00:00Z, scheduled_end_at == 2026-05-08T08:00:00Z, clinical_status == MONITORING, compliance_status == COMPLIANT, strike_count == 0"
            - "GET order ${o_id}: status == IN_SERVICE (cascade visible immediately)"
