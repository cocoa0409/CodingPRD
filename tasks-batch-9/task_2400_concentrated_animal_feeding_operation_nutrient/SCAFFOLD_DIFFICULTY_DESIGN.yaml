  - rule_id: priority_pair_validation_conflict
    instances:
      - name: plan_not_approved_outranks_rate_exceeds_limit
        grounds:
          - validations[priority=19]
          - validations[priority=43]
          - validations[priority=44]
          - errors.ERR_PLAN_NOT_APPROVED
        distinguishing_aspect: |
          Category pair state (priority 19) versus business_fiscal (priority 43): one request violates
          both, and the response must be ERR_PLAN_NOT_APPROVED (409), never ERR_RATE_EXCEEDS_LIMIT (422),
          proving the state gate is evaluated before any nutrient arithmetic.
