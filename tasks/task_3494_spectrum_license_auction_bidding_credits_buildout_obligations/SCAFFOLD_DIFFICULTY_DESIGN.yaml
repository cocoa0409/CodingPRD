  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: closed_round_state_beats_eligibility_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_ROUND_NOT_OPEN]
          - errors[ERR_BID_EXCEEDS_ELIGIBILITY]
        distinguishing_aspect: |
          Category pair STATE vs BUSINESS_FISCAL: one request violates both the round-state
          gate (round CLOSED) and the eligibility quota (20,000,000 units demanded vs
          12,500,000 eligible); priority 5 beats priority 10, so the error is
          ERR_ROUND_NOT_OPEN, never ERR_BID_EXCEEDS_ELIGIBILITY.
        test_recipe:
          setup:
            - "Area PEA001 / CATEGORY_A supply 2; applicant P QUALIFIED with 12,500,000 eligibility units; round 1 closed with NO bids (demand 0 <= supply 2, so the auction auto-advanced to ASSIGNMENT_PHASE)"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_x
            - *c_block_a
            - *c_publish
            - *c_auction
            - *c_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "P Bidder", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "P Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { p_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${p_id}/upfront-payments"
              payload: { amount_cents: 31250000000 }
              as: Bidder
              as_user_id: "${p_id}"
            - call: "POST /spectrum-auctions/applicants/${p_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${p_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - *c_get_rounds
            - *c_close_r1
          trigger:
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA001", category: "CATEGORY_A", quantity: 2 }
              as: Bidder
              as_user_id: "${p_id}"
              captures: { bid_err: "$.data.error_id" }
          assert:
            - "bid_err == ERR_ROUND_NOT_OPEN (state, priority 5)"
            - "bid_err != ERR_BID_EXCEEDS_ELIGIBILITY (fiscal, priority 10 — would have fired on quantity 2 = 20,000,000 units > 12,500,000 eligibility)"
            - "the response status is 409, not 422"
            - "no Bid is created for (round ${r1_id}, P) — GET /spectrum-auctions/applicants/${p_id}/bids returns an empty array"

      - name: quiet_period_safety_beats_ownership_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_QUIET_PERIOD_VIOLATION]
          - errors[ERR_OWNERSHIP_TOTAL_INVALID]
        distinguishing_aspect: |
          Category pair BUSINESS_SAFETY vs BUSINESS_CONSTRAINT: the disclosure PATCH carries
          ownership stakes summing to 90 (constraint violation) while the auction is in
          QUIET_PERIOD (anti-collusion safety violation); priority 6 beats priority 7, so the
          error is ERR_QUIET_PERIOD_VIOLATION, never ERR_OWNERSHIP_TOTAL_INVALID.
        test_recipe:
          setup:
            - "Applicant S (SUBMITTED) exists with valid ownership [{A,60},{B,40}]; auction moved to QUIET_PERIOD at 2026-09-16"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_y
            - *c_block_a
            - *c_publish
            - *c_auction
            - *c_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Sigma LLC", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "A", stake_pct: 60, holder_annual_revenue_cents: 0 }, { holder_name: "B", stake_pct: 40, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { s_id: "$.data.id", s_v: "$.data.version" }
            - *c_clock_quiet
            - *c_begin_quiet
          trigger:
            - call: "PATCH /spectrum-auctions/applicants/${s_id}/disclosure"
              payload: { expected_applicant_version: "${s_v}", ownership_interests: [{ holder_name: "A", stake_pct: 90, holder_annual_revenue_cents: 0 }, { holder_name: "B", stake_pct: 0, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              as_user_id: "${s_id}"
              captures: { patch_err: "$.data.error_id" }
          assert:
            - "patch_err == ERR_QUIET_PERIOD_VIOLATION (business_safety, priority 6)"
            - "patch_err != ERR_OWNERSHIP_TOTAL_INVALID (business_constraint, priority 7 — the stakes sum to 90, but that check is never reached)"
            - "the response status is 409, not 422"
            - "Applicant.${s_id}.ownership_interests still sums to 100 (the failed PATCH left state untouched) and version == s_v"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: activity_requirement_exact_boundary
        grounds:
          - calculations.activity_requirement
          - entities.Applicant.fields.eligibility_units
        distinguishing_aspect: |
          Boundary on the ACTIVITY metric through POST /rounds/{id}/close: P lands activity
          EXACTLY at the 800/1000 requirement (10,000,000 vs 12,500,000 eligibility) and is NOT
          reduced (inclusive >=), while Q in the same round lands below it (5,000,000) and is
          reduced to exactly 6,250,000 = floor(5,000,000*1000/800).
        test_recipe:
          setup:
            - "Area PEA001 pop 1,000,000; CATEGORY_A 10 MHz supply 2 price 50 (units 10,000,000); CATEGORY_B 5 MHz supply 1 price 10 (units 5,000,000)"
            - "P and Q each QUALIFIED with eligibility 12,500,000 units (upfront 31,250,000,000)"
            - "Round 1: P bids CATEGORY_A qty 1; Q bids CATEGORY_B qty 1"
          setup_api_calls:
            - *c_clock0
            - *c_plan
            - *c_area_x
            - *c_block_a
            - call: "POST /spectrum-auctions/license-blocks"
              payload: { band_plan_id: "${plan_id}", category: "CATEGORY_B", mhz_size: 5, supply_per_area: 1, price_per_mhz_pop_cents: 10 }
              as: AuctionAdmin
            - *c_publish
            - *c_auction
            - *c_open
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "P Bidder", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "P Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { p_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${p_id}/upfront-payments"
              payload: { amount_cents: 31250000000 }
              as: Bidder
              as_user_id: "${p_id}"
            - call: "POST /spectrum-auctions/applicants/${p_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${p_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants"
              payload: { auction_id: "${auction_id}", legal_name: "Q Bidder", claims_small_business: false, claims_rural_credit: false, own_annual_revenue_cents: 0, service_population: 0, ownership_interests: [{ holder_name: "Q Owner", stake_pct: 100, holder_annual_revenue_cents: 0 }] }
              as: Bidder
              captures: { q_id: "$.data.id" }
            - call: "POST /spectrum-auctions/applicants/${q_id}/upfront-payments"
              payload: { amount_cents: 31250000000 }
              as: Bidder
              as_user_id: "${q_id}"
            - call: "POST /spectrum-auctions/applicants/${q_id}/review"
              payload: { action: "START_REVIEW" }
              as: AuctionAdmin
            - call: "POST /spectrum-auctions/applicants/${q_id}/review"
              payload: { action: "QUALIFY" }
              as: AuctionAdmin
            - *c_clock_quiet
            - *c_begin_quiet
            - *c_start_clock
            - *c_get_rounds
            - *c_bid_w1_ax
            - call: "POST /spectrum-auctions/rounds/${r1_id}/bids"
              payload: { area_code: "PEA001", category: "CATEGORY_B", quantity: 1 }
              as: Bidder
              as_user_id: "${q_id}"
          trigger:
            - *c_close_r1
            - call: "GET /spectrum-auctions/applicants/${p_id}"
              payload: {}
              as: AuctionAdmin
              captures: { p_elig: "$.data.eligibility_units" }
            - call: "GET /spectrum-auctions/applicants/${q_id}"
              payload: {}
              as: AuctionAdmin
              captures: { q_elig: "$.data.eligibility_units" }
          assert:
            - "p_elig == 12500000 (activity 10,000,000 * 1000 >= 800 * 12,500,000 exactly — inclusive boundary, NO reduction)"
            - "q_elig == 6250000 (activity 5,000,000 * 1000 < 800 * 12,500,000 — reduced to floor(5,000,000*1000/800))"
            - "Auction.${auction_id}.status == ASSIGNMENT_PHASE (all demands <= supplies)"
            - "the two applicants differ ONLY in which product they bid, proving the boundary is the discriminator"

      - name: unjust_enrichment_day_1824_vs_1825
        grounds:
          - calculations.unjust_enrichment_repayment
          - entities.TransferApplication.fields.unjust_enrichment_cents
        distinguishing_aspect: |
          Boundary on the ELAPSED-DAYS metric through POST /licenses/{id}/transfer-applications:
          at grant+1824 days (years_elapsed 4) the repayment is exactly 20% of the 38,550,000
          credit (7,710,000); at grant+1825 days (years_elapsed 5) it is exactly 0. One day
          flips the schedule bucket. Distinct metric and endpoint from the activity boundary.
        test_recipe:
          setup:
            - "Rural applicant R wins CATEGORY_A@PEA002 (credit_pct 15, gross 250,000,000, assignment bid 0, net 212,500,000, credit_amount_cents 38,550,000); license ACTIVE with grant_date 2026-10-01"
