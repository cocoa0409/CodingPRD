      - name: clock_never_rewinds_and_a_future_detection_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=14]
          - validations[priority=15]
          - endpoints[POST /battery-warranty/_clock/set_current_utc]
        distinguishing_aspect: |
          Two temporal guards with opposite inclusivity meet here: the clock may be re-set to the
          SAME instant (>= is satisfied) but never to an earlier one, and detected_at may equal the
          clock but never exceed it. A single off-by-one on either comparison flips one of the four
          calls.
        test_recipe:
          setup:
            - "One program, one vehicle, one installed pack; clock at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000421", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C221", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
          trigger:
            - call: "POST /battery-warranty/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /battery-warranty/_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T23:59:59Z" }
              as: ProgramAdmin
            - call: "POST /battery-warranty/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /battery-warranty/thermal-events"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", severity: "S2", detected_at: "2026-08-05T00:00:01Z", source: "TELEMATICS" }
              as: TelematicsGateway
            - call: "POST /battery-warranty/thermal-events"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", severity: "S2", detected_at: "2026-08-05T00:00:00Z", source: "TELEMATICS" }
              as: TelematicsGateway
          assert:
            - "call 1 returns 200 and advances the clock to 2026-08-05T00:00:00Z"
            - "call 2 returns 409 ERR_CLOCK_REWIND_FORBIDDEN and the clock stays at 2026-08-05T00:00:00Z"
            - "call 3 returns 200 - re-setting the clock to the identical instant satisfies the inclusive >= comparison"
            - "call 4 returns 400 ERR_DETECTED_AT_IN_FUTURE (one second past the clock)"
            - "call 5 is created 201 with detected_at exactly at the clock, notification_status NOT_REQUIRED for S2, and the pack still IN_SERVICE"

