              captures: { w1: $.data.id }
            - call: "POST /api/workers"
              payload: { full_name: "W B", employment_type: "VOLUNTEER" }
              as: VolunteerCoordinator
              captures: { w2: $.data.id }
            - call: "POST /api/shifts"
              payload: { role_type: "INTAKE", starts_at: "2026-08-10T09:00:00Z", ends_at: "2026-08-10T12:00:00Z", required_headcount: 1 }
              as: VolunteerCoordinator
              captures: { sh1: $.data.id }
