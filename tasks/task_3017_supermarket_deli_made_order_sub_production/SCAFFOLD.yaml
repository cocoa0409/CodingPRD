  - method: POST
    path: "/deli/stores/{id}/run-production-day"
    description: "Close the production day: increment ops_run_index, expire lapsed certifications and hold windows, sweep waste laggards, close out reconciled bread orders, and recompute the store posture. This is the only bulk transition driver the store exposes."
    roles: [PlatformAdmin, DeliManager]
    code: 200
    input: []
    output: Store
    side_effects:
      - "ops_run_index += 1"
      - "logical_clock_at_last_run stamped from the logical clock"
      - "Batches whose hold_status is HOLDING or MARKED_DOWN and whose half-open window has closed -> DISCARDED"
      - "Certifications whose expires_at has passed -> EXPIRED (see the expiration trigger in §1.2)"
      - "BreadSupplyOrder rows eligible for closeout -> RECONCILED"
      - "posture / posture_reason / protection counters recomputed; version incremented"

  - method: GET
    path: "/deli/posture-report"
    description: "One-shot read of a store's derived posture, its posture_reason token, the protection and diffusion indices, and the newest COMPLETED ticket's lateness_minutes. Toggling this gate is the supported way to force the HALT posture predicate without touching certification or sanitation state."
