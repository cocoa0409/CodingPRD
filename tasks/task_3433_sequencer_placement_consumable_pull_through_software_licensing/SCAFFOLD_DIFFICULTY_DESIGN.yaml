# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Mirrors SCAFFOLD.yaml §1.1–§1.7 against the nine Difficulty Rules of §0.5.
# Every test_recipe replays from empty-DB using only §1.5 endpoints.
# Logical clock starts at the fixed default 2026-09-01T00:00:00Z unless a
# recipe explicitly sets it forward.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: tradein_provisional_vs_final_credit
        grounds:
          - calculations.tradein_credit_calc
          - entities.TransitionProgram.fields.provisional_credit_cents
          - entities.TransitionProgram.fields.final_credit_cents
        distinguishing_aspect: |
          Entity domain: trade-in credit on TransitionProgram/Instrument (hardware credit).
          The provisional variant (list pct by generation gap) and the final variant
          (condition + age deductions, clamped) produce different credits for the SAME
          instrument: 1,400,000 provisional vs 924,000 final.
        test_recipe:
          setup:
            - "RUO account; old model generation 2 base 4,000,000c; new model generation 4"
            - "old instrument registered with installed_at 2021-06-01T00:00:00Z (5 full years before appraisal at the 2026-09-01 default clock)"
            - "transition program enrolled before its enrollment window end"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Alpha", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-200", generation: 2, base_price_cents: 4000000, supported_chemistry_versions: ["V1", "V2"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { m_old: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-400", generation: 4, base_price_cents: 6000000, supported_chemistry_versions: ["V2", "V3"], base_run_modes: ["STD_SHORT", "STD_LONG"] }
              as: PlatformAdmin
              captures: { m_new: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${m_old}", serial_number: "SN-OLD-1", regulatory_mode: "RUO", installed_at: "2021-06-01T00:00:00Z" }
              as: AccountManager
              captures: { inst_old: $.data.id }
            - call: "POST /genomics/transition-programs"
              payload: { account_id: "${acct}", old_instrument_id: "${inst_old}", new_model_id: "${m_new}", enrollment_window_end: "2027-01-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "am-9"
              captures: { tp: $.data.id, tp_prov: $.data.provisional_credit_cents }
          trigger:
            - call: "POST /genomics/transition-programs/${tp}/advance"
              payload: { action: "APPRAISE", condition_flags: ["FUNCTIONAL_DEFECT", "MISSING_ACCESSORIES"] }
              as: FinanceAdmin
              as_user_id: "fa-9"
              captures: { tp_final: $.data.final_credit_cents }
          assert:
            - "captured tp_prov == 1400000  (round(4,000,000 * 0.35) for generation gap 2)"
            - "captured tp_final == 924000  (condition 0.30 + age 0.04 = 0.34 deduction = 476,000; 1,400,000 - 476,000; floor 200,000 and cap 1,400,000 not binding)"
            - "tp_final != tp_prov — the two variants disagree on identical instrument data"
            - "TransitionProgram.${tp}.program_state == APPRAISED"

      - name: commitment_accrual_vs_final_reconciliation
        grounds:
          - calculations.commitment_reconciliation_calc
          - state_machines.PlacementProgram.ACTIVE_to_BREACHED
          - entities.Account.fields.credit_hold
        distinguishing_aspect: |
          Entity domain: PlacementProgram fiscal reconciliation (different domain from the
          trade-in hardware credit). The accrual variant (pro-rata expectation at interim
          closes) only flags shortfall and keeps the program ACTIVE, while the final variant
          at period 12 measures against the full-term commitment, posts a 1,200,000c penalty
          and breaches the program — same delivered spend (0), different outcomes.
        test_recipe:
          setup:
            - "account with an ACTIVE program: term 12 months, committed_annual 12,000,000c, no reagent orders"
            - "interim closes 1..11 already executed; after close 6, accrual expectation was 6,000,000c vs delivered 0 -> shortfall_flag true but state still ACTIVE"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Beta", regulatory_class: "RUO", region: "EU" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.10, hardware_lines: [{ description: "instrument", quantity: 1, unit_price_cents: 500000 }] }
              as: AccountManager
              as_user_id: "am-1"
              captures: { prog: $.data.id }
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "SUBMIT" }
              as: AccountManager
              as_user_id: "am-1"
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "APPROVE" }
              as: FinanceAdmin
              as_user_id: "fa-1"
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
              captures: { mid_flag: $.data.shortfall_flag, mid_state: $.data.program_state }
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /genomics/placement-programs/${prog}/close-period"
              payload: {}
              as: FinanceAdmin
              captures: { final_state: $.data.program_state, final_penalty: $.data.penalty_cents }
            - call: "GET /genomics/accounts/${acct}"
              as: AccountManager
              captures: { acct_hold: $.data.credit_hold }
          assert:
            - "captured mid_flag == true and mid_state == ACTIVE  (accrual variant: expected 6,000,000 by period 6, delivered 0 — flag only, no breach)"
            - "captured final_state == BREACHED  (final variant: shortfall 12,000,000 - 0 > 0)"
            - "captured final_penalty == 1200000  (round(12,000,000 * 0.10))"
            - "captured acct_hold == true  (breach cascade sets the account credit hold)"

      - name: forecast_coverage_optimistic_vs_conservative
        grounds:
          - calculations.forecast_variance_calc
          - entities.SupplyForecast
          - entities.ReagentLot.fields.qc_status
        distinguishing_aspect: |
          Entity domain: SupplyForecast/ReagentLot supply coverage (different from both the
          trade-in and commitment domains). For identical data, the optimistic variant counts
          PENDING_QC lots as incoming supply (70 units) while the conservative variant counts
          QC_PASSED lots only (30 units) — the 40-unit PENDING_QC lot is the exact delta.
        test_recipe:
          setup:
            - "account; kit K1 (FROZEN_20, samples_per_kit 16, shelf 60d)"
            - "lot LP of K1: 80 units, QC_PASSED, expiry 2026-10-14; lot LQ of K1: 40 units, still PENDING_QC"
            - "forecast for the account: 75 units of K1 in ISO week 2026-09-07, SUBMITTED"
            - "50 units of K1 delivered to the account during that week (order submitted, shipped, delivered at 2026-09-08)"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Gamma", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K1", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LP", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 80 }
              as: SupplyPlanner
              captures: { lot_p: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot_p}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LQ", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 40 }
              as: SupplyPlanner
              captures: { lot_q: $.data.id }
            - call: "POST /genomics/supply-forecasts"
              payload: { account_id: "${acct}", lines: [{ kit_code: "K1", week_start: "2026-09-07T00:00:00Z", quantity: 75 }] }
              as: SupplyPlanner
              captures: { fc: $.data.id }
            - call: "POST /genomics/supply-forecasts/${fc}/advance"
              payload: { action: "SUBMIT" }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-orders"
              payload: { account_id: "${acct}", lines: [{ kit_code: "K1", quantity: 50 }] }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SUBMIT" }
              as: LabOperator
              as_user_id: "${acct}"
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SHIP" }
              as: SupplyPlanner
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "DELIVER" }
              as: SupplyPlanner
          trigger:
            - call: "GET /genomics/supply-forecasts/${fc}?include_variance=true"
              as: SupplyPlanner
              captures: { vlines: $.data.variance_lines }
          assert:
            - "vlines[0].forecast_quantity == 75 and vlines[0].actual_delivered_units == 50 and vlines[0].variance == -25"
            - "vlines[0].coverage_conservative_units == 30  (QC_PASSED lot: 80 - 50 delivered)"
            - "vlines[0].coverage_optimistic_units == 70   (30 + 40 from the PENDING_QC lot)"
            - "optimistic - conservative == 40, exactly the un-released lot's usable units"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: uptime_credit_tiered_cap_minmax
        grounds:
          - calculations.uptime_credit_calc
          - entities.ServiceContract.fields.credits_issued_ytd_cents
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — conditional tier branches on the
          deficit, then nested min/max against the annual cap remainder. Deficit exactly 1.00
          takes the 0.10 tier (not 0.05), and the second reconciliation's raw 125,000c is
          clamped to the 70,000c cap remainder.
        test_recipe:
          setup:
            - "account; instrument OPERATIONAL under an ACTIVE contract: committed 99.0, monthly fee 500,000c, annual cap 120,000c, coverage [2026-09-01, 2027-09-01)"
            - "service window 1: 2026-09-01T00:00 -> 00:20 (20 downtime minutes), recorded before the clock is advanced"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Delta", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-D-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
            - call: "POST /genomics/service-contracts"
              payload: { account_id: "${acct}", instrument_id: "${inst}", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2027-09-01T00:00:00Z", committed_uptime_percent: 99.0, monthly_fee_cents: 500000, annual_credit_cap_cents: 120000, reagent_guarantee: true }
              as: FinanceAdmin
              captures: { ctr: $.data.id }
            - call: "POST /genomics/service-contracts/${ctr}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_OPEN" }
              as: FieldServiceEngineer
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:20:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_CLOSE" }
              as: FieldServiceEngineer
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:40:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /genomics/service-contracts/${ctr}/uptime-reconciliations"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-01T16:40:00Z" }
              as: FinanceAdmin
              captures: { r1_credit: $.data.credit_cents, r1_uptime: $.data.uptime_percent }
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_OPEN" }
              as: FieldServiceEngineer
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T02:50:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_CLOSE" }
              as: FieldServiceEngineer
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:20:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/service-contracts/${ctr}/uptime-reconciliations"
              payload: { period_start: "2026-09-01T16:40:00Z", period_end: "2026-09-02T09:20:00Z" }
              as: FinanceAdmin
              captures: { r2_credit: $.data.credit_cents, r2_ytd: $.data.credits_issued_ytd_cents }
          assert:
            - "r1_uptime == 98.00 and r1_credit == 50000  (deficit exactly 1.00 -> 0.10 tier; raw = 500,000 * 0.10)"
            - "r2_credit == 70000  (uptime 95.00 -> deficit 4.00 -> 0.25 tier -> raw 125,000 clamped by min() to cap remainder 120,000 - 50,000)"
            - "r2_ytd == 120000  (cap fully consumed; the max(0, ...) floor binds thereafter)"

      - name: subsidy_pool_per_line_rounding
        grounds:
          - calculations.subsidy_pool_calc
          - entities.PlacementProgram.fields.subsidy_pool_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters. The scaffold pins per-line
          round_half_up THEN sum: three lines of round(101 * 0.155) = 16c each give 48c,
          whereas the forbidden sum-then-round order gives round(303 * 0.155) = 47c.
        test_recipe:
          setup:
            - "account; DRAFT program with subsidy_pct 0.155 and three hardware lines of quantity 1 at 101c each"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Epsilon", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.155, hardware_lines: [{ description: "part-a", quantity: 1, unit_price_cents: 101 }, { description: "part-b", quantity: 1, unit_price_cents: 101 }, { description: "part-c", quantity: 1, unit_price_cents: 101 }] }
              as: AccountManager
              captures: { prog: $.data.id }
          trigger:
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "SUBMIT" }
              as: AccountManager
              captures: { pool: $.data.subsidy_pool_cents, st: $.data.program_state }
          assert:
            - "pool == 48  (3 * round_half_up(101 * 0.155) = 3 * 16)"
            - "pool != 47  (sum-then-round would produce 47; that order is forbidden)"
            - "st == PENDING_APPROVAL  (48c is far under the 40% cap, so SUBMIT succeeds)"

      - name: billing_evaluation_order_pinned
        grounds:
          - calculations.sample_billing_calc
          - calculations.cloud_credit_ledger_calc
          - entities.SoftwareLicense.fields.credit_ledger
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned to a fixed evaluation order —
          samples -> tier -> gross -> EXPIRY -> offset -> net. With 100 expiring-grant
          credits and 70 fresh credits, offsetting BEFORE expiry would let 100 credits
          offset the invoice; the pinned order expires 30 first, so only 70 offset.
        test_recipe:
          setup:
            - "account; license ACTIVE (period 1 = [2026-09-01, 2026-10-01)); grants: 70 credits granted_on 2026-08-01 (fresh), 30 credits granted_on 2025-08-01 (older than 365 days at close)"
            - "one LOCAL SUCCESS run of 1000 samples on 2026-09-10 against an OPERATIONAL instrument and a QC_PASSED lot"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Zeta", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K1", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-Z-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LZ", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
              captures: { lot: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/software-licenses"
              payload: { account_id: "${acct}" }
              as: FinanceAdmin
              captures: { lic: $.data.id }
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "ACTIVATE" }
              as: FinanceAdmin
            - call: "POST /genomics/software-licenses/${lic}/credit-grants"
              payload: { credits: 70, grant_type: "PURCHASE", granted_on: "2026-08-01" }
              as: FinanceAdmin
            - call: "POST /genomics/software-licenses/${lic}/credit-grants"
              payload: { credits: 30, grant_type: "GRANT", granted_on: "2025-08-01" }
              as: FinanceAdmin
            - call: "POST /genomics/run-records"
              payload: { instrument_id: "${inst}", lot_id: "${lot}", license_id: "${lic}", run_at: "2026-09-10T00:00:00Z", run_mode: "STD_SHORT", analysis_mode: "LOCAL", samples_count: 1000, output_gb: 50.0, outcome: "SUCCESS" }
              as: LabOperator
              as_user_id: "${acct}"
          trigger:
            - call: "POST /genomics/software-licenses/${lic}/billing-close"
              payload: {}
              as: FinanceAdmin
              captures: { samples: $.data.billable_samples, tier: $.data.tier, gross: $.data.gross_cents, expired: $.data.expired_credits, offcr: $.data.offset_credits, offc: $.data.offset_cents, net: $.data.net_cents, bal: $.data.credits_balance }
          assert:
            - "samples == 1000 and tier == T2 and gross == 200000  (1000 * 200c)"
            - "expired == 30  (the 2025-08-01 grant is 396 days old at close; expiry runs BEFORE offset)"
            - "offcr == 70 and offc == 7000  (min(post-expiry balance 70, floor(200000*0.5/100) = 1000))"
            - "net == 193000 and bal == 0"
            - "had the order been offset-then-expire, offcr would have been 100 and net 190000 — the pinned order is observable"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: program_amendment_cycle
        grounds:
          - state_machines.PlacementProgram.ACTIVE_to_UNDER_AMENDMENT
          - state_machines.PlacementProgram.UNDER_AMENDMENT_to_ACTIVE
          - concurrency_rules[program-amendment-stale-version]
        distinguishing_aspect: |
          Cyclic machine on PlacementProgram: ACTIVE -> UNDER_AMENDMENT -> ACTIVE, looped
          twice — a REJECT cycle leaves committed_annual unchanged, an APPROVE cycle applies
          the amended subsidy_pct and recomputes the pool. Distinct entity from the
          instrument and license cycles.
        test_recipe:
          setup:
            - "account with ACTIVE program (committed 12,000,000c, subsidy 0.10, one hardware line 1 x 500,000c)"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Eta", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.10, hardware_lines: [{ description: "instrument", quantity: 1, unit_price_cents: 500000 }] }
              as: AccountManager
              as_user_id: "am-2"
              captures: { prog: $.data.id }
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "SUBMIT" }
              as: AccountManager
              as_user_id: "am-2"
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "APPROVE" }
              as: FinanceAdmin
              as_user_id: "fa-2"
              captures: { v_active: $.data.version }
          trigger:
            - call: "POST /genomics/placement-programs/${prog}/amendments"
              payload: { action: "CREATE", expected_program_version: "${v_active}", new_committed_annual_reagent_cents: 14000000 }
              as: AccountManager
              as_user_id: "am-2"
              captures: { st1: $.data.program_state }
            - call: "POST /genomics/placement-programs/${prog}/amendments"
              payload: { action: "REJECT" }
              as: FinanceAdmin
              captures: { st2: $.data.program_state, committed_after_reject: $.data.committed_annual_reagent_cents, v_after_reject: $.data.version }
            - call: "POST /genomics/placement-programs/${prog}/amendments"
              payload: { action: "CREATE", expected_program_version: "${v_after_reject}", new_subsidy_pct: 0.20 }
              as: AccountManager
              as_user_id: "am-2"
            - call: "POST /genomics/placement-programs/${prog}/amendments"
              payload: { action: "APPROVE" }
              as: FinanceAdmin
              as_user_id: "fa-2"
              captures: { st3: $.data.program_state, subsidy_after: $.data.subsidy_pct, pool_after: $.data.subsidy_pool_cents }
          assert:
            - "st1 == UNDER_AMENDMENT (cycle entered)"
            - "st2 == ACTIVE and committed_after_reject == 12000000 (REJECT discards the amendment — first full loop)"
            - "st3 == ACTIVE and subsidy_after == 0.20 and pool_after == 100000 (APPROVE applies: round(1 * 500,000 * 0.20) — second full loop)"
      - name: instrument_service_cycle
        grounds:
          - state_machines.Instrument.OPERATIONAL_to_DOWN_FOR_SERVICE
          - state_machines.Instrument.DOWN_FOR_SERVICE_to_OPERATIONAL
        distinguishing_aspect: |
          Cyclic machine on Instrument: OPERATIONAL -> DOWN_FOR_SERVICE -> OPERATIONAL looped
          twice; each loop appends and closes one service window, so two closed windows prove
          the cycle repeated. Distinct entity from the program and license cycles.
        test_recipe:
          setup:
            - "account; instrument driven to OPERATIONAL"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Theta", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-T-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
          trigger:
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_OPEN" }
              as: FieldServiceEngineer
              captures: { s1: $.data.install_state }
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:30:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_CLOSE" }
              as: FieldServiceEngineer
              captures: { s2: $.data.install_state }
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_OPEN" }
              as: FieldServiceEngineer
              captures: { s3: $.data.install_state }
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T11:15:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_CLOSE" }
              as: FieldServiceEngineer
              captures: { s4: $.data.install_state, windows: $.data.service_windows }
          assert:
            - "s1 == DOWN_FOR_SERVICE and s2 == OPERATIONAL (loop 1)"
            - "s3 == DOWN_FOR_SERVICE and s4 == OPERATIONAL (loop 2 — the machine cycles, not dead-ends)"
            - "windows has length 2; windows[0] spans 10:00->10:30 and windows[1] spans 11:00->11:15, both closed"
      - name: license_suspend_resume_cycle
        grounds:
          - state_machines.SoftwareLicense.ACTIVE_to_SUSPENDED
          - state_machines.SoftwareLicense.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on SoftwareLicense: ACTIVE -> SUSPENDED -> ACTIVE, looped twice;
          the version counter increments on every traversal (create=1, ACTIVATE=2, then four
          more transitions land on version 6). Distinct entity from the program and
          instrument cycles.
        test_recipe:
          setup:
            - "account; license created and activated"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Iota", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/software-licenses"
              payload: { account_id: "${acct}" }
              as: FinanceAdmin
              captures: { lic: $.data.id }
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "ACTIVATE" }
              as: FinanceAdmin
          trigger:
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "SUSPEND" }
              as: FinanceAdmin
              captures: { l1: $.data.license_state }
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "REINSTATE" }
              as: FinanceAdmin
              captures: { l2: $.data.license_state }
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "SUSPEND" }
              as: FinanceAdmin
              captures: { l3: $.data.license_state }
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "REINSTATE" }
              as: FinanceAdmin
              captures: { l4: $.data.license_state, lv: $.data.version }
          assert:
            - "l1 == SUSPENDED and l2 == ACTIVE and l3 == SUSPENDED and l4 == ACTIVE (two full loops)"
            - "lv == 6 (1 create + 1 activate + 4 cycle transitions)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: lot_qc_failure_cascade
        grounds:
          - state_machines.ReagentLot.QC_PASSED_to_QC_FAILED
          - state_machines.ReagentOrder.ALLOCATED_to_BACKORDERED
          - entities.PlacementProgram.fields.pipeline_spend_cents
        distinguishing_aspect: |
          Trigger: lot QC verdict FAILED on a released lot. Depth 3 across three entities:
          lot -> QC_FAILED (hop 0) causes reservation release, which causes the order to flip
          ALLOCATED -> BACKORDERED, which causes the program's pipeline_spend_cents to drop
          from 10,000 to 0. Different trigger from the transition-complete cascade.
        test_recipe:
          setup:
            - "account; kit K1 price 5,000c; lot L of K1, 10 units, QC_PASSED, expiry 2026-10-14"
            - "ACTIVE program pinning K1 at 5,000c; order of 2 units of K1 SUBMITTED and ALLOCATED (pipeline 10,000c)"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Kappa", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K1", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LK", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 10 }
              as: SupplyPlanner
              captures: { lot: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.10, hardware_lines: [{ description: "instrument", quantity: 1, unit_price_cents: 500000 }] }
              as: AccountManager
              as_user_id: "am-3"
              captures: { prog: $.data.id }
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "SUBMIT" }
              as: AccountManager
              as_user_id: "am-3"
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "APPROVE" }
              as: FinanceAdmin
              as_user_id: "fa-3"
            - call: "POST /genomics/reagent-orders"
              payload: { account_id: "${acct}", program_id: "${prog}", lines: [{ kit_code: "K1", quantity: 2 }] }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SUBMIT" }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { pipe_before: $.data.total_cents }
            - call: "GET /genomics/placement-programs/${prog}"
              as: FinanceAdmin
              captures: { pipe_alloc: $.data.pipeline_spend_cents }
          trigger:
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "FAILED" }
              as: SupplyPlanner
              captures: { lot_qc: $.data.qc_status, lot_res: $.data.reserved_units }
            - call: "GET /genomics/reagent-orders/${ord}"
              as: SupplyPlanner
              captures: { ord_state: $.data.order_state, ord_res: $.data.line_reservations }
            - call: "GET /genomics/placement-programs/${prog}"
              as: FinanceAdmin
              captures: { pipe_after: $.data.pipeline_spend_cents, deliv_after: $.data.delivered_spend_cents }
          assert:
            - "pipe_alloc == 10000 (2 x 5,000c pinned) and pipe_before == 10000"
            - "lot_qc == QC_FAILED and lot_res == 0 (hop 1: reservations released)"
            - "ord_state == BACKORDERED and ord_res == [] (hop 2: order loses allocation; re-allocation impossible — no other usable lot)"
            - "pipe_after == 0 and deliv_after == 0 (hop 3: program pipeline debited by the order's backorder, delivered untouched)"
      - name: transition_complete_cascade
        grounds:
          - state_machines.TransitionProgram.APPRAISED_to_COMPLETED
          - state_machines.Instrument.OPERATIONAL_to_DECOMMISSIONED
          - state_machines.ServiceContract.ACTIVE_to_TERMINATED
          - entities.Account.fields.credit_balance_cents
        distinguishing_aspect: |
          Trigger: transition program COMPLETE. Depth 4 across four entities: program ->
          COMPLETED causes the old instrument -> DECOMMISSIONED, which causes its ACTIVE
          contract -> TERMINATED with a final uptime reconciliation credit of 50,000c, which
          lands on the account balance together with the 924,000c trade-in credit.
        test_recipe:
          setup:
            - "RUO account; old instrument (gen 2 model, installed 2021-06-01) OPERATIONAL"
            - "ACTIVE contract on the instrument: committed 99.0, fee 500,000c, cap 120,000c, coverage [2026-09-01, 2027-09-01); one closed 20-minute service window 01:00->01:20"
            - "transition program APPRAISED with final credit 924,000c; clock advanced to 2026-09-01T16:40:00Z"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Lambda", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-200", generation: 2, base_price_cents: 4000000, supported_chemistry_versions: ["V1", "V2"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { m_old: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-400", generation: 4, base_price_cents: 6000000, supported_chemistry_versions: ["V2", "V3"], base_run_modes: ["STD_SHORT", "STD_LONG"] }
              as: PlatformAdmin
              captures: { m_new: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${m_old}", serial_number: "SN-L-1", regulatory_mode: "RUO", installed_at: "2021-06-01T00:00:00Z" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
            - call: "POST /genomics/service-contracts"
              payload: { account_id: "${acct}", instrument_id: "${inst}", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2027-09-01T00:00:00Z", committed_uptime_percent: 99.0, monthly_fee_cents: 500000, annual_credit_cap_cents: 120000, reagent_guarantee: false }
              as: FinanceAdmin
              captures: { ctr: $.data.id }
            - call: "POST /genomics/service-contracts/${ctr}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_OPEN" }
              as: FieldServiceEngineer
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:20:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_CLOSE" }
              as: FieldServiceEngineer
            - call: "POST /genomics/transition-programs"
              payload: { account_id: "${acct}", old_instrument_id: "${inst}", new_model_id: "${m_new}", enrollment_window_end: "2027-01-01T00:00:00Z" }
              as: AccountManager
              as_user_id: "am-4"
              captures: { tp: $.data.id }
            - call: "POST /genomics/transition-programs/${tp}/advance"
              payload: { action: "APPRAISE", condition_flags: ["FUNCTIONAL_DEFECT", "MISSING_ACCESSORIES"] }
              as: FinanceAdmin
              as_user_id: "fa-4"
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:40:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /genomics/transition-programs/${tp}/advance"
              payload: { action: "COMPLETE" }
              as: FinanceAdmin
              captures: { tp_state: $.data.program_state, tp_final: $.data.final_credit_cents }
            - call: "GET /genomics/instruments/${inst}"
              as: AccountManager
              captures: { inst_state: $.data.install_state }
            - call: "GET /genomics/service-contracts/${ctr}"
              as: FinanceAdmin
              captures: { ctr_state: $.data.contract_state, ctr_reason: $.data.terminated_reason, ctr_ytd: $.data.credits_issued_ytd_cents }
            - call: "GET /genomics/accounts/${acct}"
              as: AccountManager
              captures: { acct_credit: $.data.credit_balance_cents }
          assert:
            - "tp_state == COMPLETED and tp_final == 924000 (hop 0)"
            - "inst_state == DECOMMISSIONED (hop 1)"
            - "ctr_state == TERMINATED and ctr_reason == AUTO_DECOMMISSION (hop 2)"
            - "ctr_ytd == 50000 (hop 3: final reconciliation over [00:00, 16:40) = 1000 min with 20 down -> 98.00 -> deficit 1.00 -> 0.10 x 500,000)"
            - "acct_credit == 974000 (hop 4: 924,000 trade-in + 50,000 uptime credit)"

