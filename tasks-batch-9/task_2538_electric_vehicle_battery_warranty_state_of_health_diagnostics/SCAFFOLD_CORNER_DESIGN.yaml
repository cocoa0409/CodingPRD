# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over the §1.1-§1.7 surface of SCAFFOLD.yaml. Corners already
# asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Logical clock is pinned at 2026-08-01T00:00:00Z unless a recipe moves it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: warranty_program_creation_sorts_retention_schedule_ascending
        claim_type: creation
        grounds:
          - entities.WarrantyProgram.fields.retention_schedule
          - endpoints[POST /battery-warranty/warranty-programs]
          - response_envelope.success
        distinguishing_aspect: |
          The schedule is submitted newest-tier-first; the server MUST persist it sorted ascending
          by through_months, so data.retention_schedule[0].through_months is 48 and not 96 - and
          every later tier scan (coverage_position) depends on that stored order.
        test_recipe:
          setup:
            - "Empty database; the logical clock sits at its default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020", retention_schedule: [{through_months: 96, through_miles: 100000, min_retention_pct: 70.00}, {through_months: 48, through_miles: 50000, min_retention_pct: 80.00}] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          assert:
            - "returns 201 with meta.api_request_id present, meta.api_request_timestamp an ISO8601 string and response_type == object"
            - "data.retention_schedule[0] == {through_months: 48, through_miles: 50000, min_retention_pct: 80.00} - the rows were reordered ascending on write"
            - "data.retention_schedule[1].min_retention_pct == 70.00"
            - "data.accrued_liability_cents == 0, data.reman_available_count == 0, data.reman_stock_state == DEPLETED"
            - "data.version == 1 and data.id is a server-generated string"

      - name: battery_pack_creation_cascades_module_roster_with_positions
        claim_type: creation
        grounds:
          - entities.BatteryModule.fields.position_index
          - entities.BatteryModule.fields.module_capacity_kwh
          - endpoints[POST /battery-warranty/battery-packs]
        distinguishing_aspect: |
          Creating one pack mints exactly module_count child modules with position_index 1..16 in
          ascending order, each with module_capacity_kwh == 5.000 (80.000 / 16 to 3 decimals) and
          status HEALTHY - a pack created with no children would still answer 200 on the pack read,
          so the children must be asserted through the modules listing.
        test_recipe:
          setup:
            - "One program and one vehicle so the pack can be created in stock and read back."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C001" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "GET /battery-warranty/battery-packs/${pack_id}/modules"
              payload: { limit: 20 }
              as: ProgramAdmin
          assert:
            - "the pack is created with status STOCK, pack_type NEW, module_count 16, nominal_capacity_kwh 80.000, faulted_module_count 0, module_replacements_to_date 0, damaged_defective false"
            - "the modules listing returns response_type == array with total_count == 16 and has_more == false"
            - "data[0].position_index == 1 and data[15].position_index == 16 (ascending)"
            - "every row has status HEALTHY, cell_delta_mv 0, thermal_runaway_flag false, replaced_at null and module_capacity_kwh == 5.000"
            - "every row's pack_id == ${pack_id}"

      - name: battery_module_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints[GET /battery-warranty/battery-packs/{id}/modules]
        distinguishing_aspect: |
          With the default limit of 10 against a 16-module roster the first page reports
          has_more == true while total_count stays 16; the offset-10 page returns the remaining 6
          rows with has_more == false - so has_more is derived from offset + returned vs total_count,
          not from the page being full.
        test_recipe:
          setup:
            - "One program and one 16-module pack in stock."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C002" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
          trigger:
            - call: "GET /battery-warranty/battery-packs/${pack_id}/modules"
              payload: {}
              as: ProgramAdmin
            - call: "GET /battery-warranty/battery-packs/${pack_id}/modules"
              payload: { limit: 10, offset: 10 }
              as: ProgramAdmin
            - call: "GET /battery-warranty/battery-packs/${pack_id}/modules"
              payload: { status: "FAULTED" }
              as: ProgramAdmin
          assert:
            - "call 1 (no params) returns 10 rows with limit 10, offset 0, total_count 16, has_more true"
            - "call 1's rows are position_index 1..10 in ascending order"
            - "call 2 returns 6 rows with offset 10, total_count 16, has_more false, position_index 11..16"
            - "call 3 returns 0 rows with total_count 0 and has_more false - the status filter is applied before pagination"

      - name: vehicle_read_with_unknown_id_returns_vehicle_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_VEHICLE_NOT_FOUND]
          - validations[priority=6]
          - response_envelope.error
        distinguishing_aspect: |
          A syntactically valid but unknown vehicle id returns 404 ERR_VEHICLE_NOT_FOUND in the
          error envelope shape (response_type == error, data.error_id, data.message) rather than an
          empty 200 object or a 500.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /battery-warranty/vehicles/veh_00000000000000000000000000"
              payload: {}
              as: ProgramAdmin
          assert:
            - "returns 404 with response_type == error"
            - "data.error_id == ERR_VEHICLE_NOT_FOUND and data.message is a non-empty string"
            - "meta.api_request_id is present on the error envelope too"

      - name: soh_assessment_missing_required_variant_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /battery-warranty/soh-assessments]
        distinguishing_aspect: |
          variant has source input and no default, so omitting it is ERR_INVALID_REQUEST at priority
          4 - ahead of every FK-existence check, which is proved by omitting variant while ALSO
          naming a non-existent pack_id: the envelope still carries ERR_INVALID_REQUEST, not
          ERR_PACK_NOT_FOUND.
        test_recipe:
          setup:
            - "One program, one vehicle, one installed pack, one center and one technician."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000201", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C003", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
            - call: "GET /battery-warranty/vehicles/${veh_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { veh_ver: $.data.version }
          trigger:
            - call: "POST /battery-warranty/soh-assessments"
              payload: { vehicle_id: "${veh_id}", pack_id: "pack_missing_0000000000000000", technician_id: "${tech_a_id}", expected_vehicle_version: "${veh_ver}" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
          assert:
            - "returns 400 with data.error_id == ERR_INVALID_REQUEST - the missing required field outranks the dangling pack FK"
            - "no SohAssessment row is created: GET /battery-warranty/soh-assessments?vehicle_id=${veh_id} returns total_count == 0"
            - "Vehicle.${veh_id}.version is unchanged at ${veh_ver} - a rejected write bumps nothing"

      - name: service_center_defaults_applied_when_optionals_omitted
        claim_type: defaults
        grounds:
          - entities.ServiceCenter.fields.hv_bay_count
          - entities.ServiceCenter.fields.labor_rate_cents_per_hour
          - endpoints[POST /battery-warranty/service-centers]
        distinguishing_aspect: |
          A center created with nothing but a name must materialise the whole declared default set
          (L3 / no pack lift / 2 bays / 18333 c/h / US-WEST / tester due 2027-01-01), and its
          computed counters must start at 0 with compliance_score 100 - not null.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
            - call: "POST /battery-warranty/service-centers/${center_id}/technicians"
              payload: { full_name: "Tech A" }
              as: ProgramAdmin
              captures: { tech_a_id: $.data.id }
          assert:
            - "the center has region_code US-WEST, hv_certification_level L3, has_pack_lift false, hv_bay_count 2, labor_rate_cents_per_hour 18333 and insulation_tester_cal_due_at exactly 2027-01-01T00:00:00Z"
            - "the center has status ACTIVE, open_hazmat_holds 0, rejected_shipment_count 0, late_notification_count 0, compliance_score 100"
            - "the technician has hv_cert_level L3, cert_expires_at 2027-06-01T00:00:00Z, status ACTIVE, last_hv_window_end_at null and service_center_id == ${center_id}"

      - name: vehicle_odometer_computed_from_valid_snapshots_only
        claim_type: computed_fields
        grounds:
          - entities.Vehicle.fields.odometer_miles
          - entities.TelematicsSnapshot.fields.validity_flag
          - calculations.diagnostic_validity_gate
        distinguishing_aspect: |
          Vehicle.odometer_miles is MAX over VALID snapshots only: a client-supplied odometer_miles
          of 999999 at vehicle creation is ignored, and a later INVALID_CAPACITY_RANGE row carrying
          odometer 90000 must NOT raise the mirror above the 71200 set by the last valid row.
        test_recipe:
          setup:
            - "One program, one vehicle created with a bogus odometer_miles in the body, one installed 80.000 kWh pack."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000202", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10", odometer_miles: 999999 }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C004", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
          trigger:
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-20T00:00:00Z", odometer_miles: 71000, reported_capacity_kwh: 55.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-22T00:00:00Z", odometer_miles: 71200, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-24T00:00:00Z", odometer_miles: 90000, reported_capacity_kwh: 90.000 }
              as: TelematicsGateway
            - call: "GET /battery-warranty/vehicles/${veh_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the vehicle is created with odometer_miles == 0 - the supplied 999999 is ignored because the field is computed"
            - "snapshot 1 and 2 come back with validity_flag VALID and corrected_capacity_kwh 55.000 and 56.000 (coolant 20.0 -> factor 1.00)"
            - "snapshot 3 comes back with validity_flag INVALID_CAPACITY_RANGE (90.000 > 80.000 * 1.05 == 84.000) yet still carries corrected_capacity_kwh 90.000"
            - "the final vehicle read shows odometer_miles == 71200 - the invalid row's 90000 is excluded from the MAX"
            - "GET /battery-warranty/vehicles/${veh_id}/telematics-snapshots?validity_flag=VALID returns total_count == 2"

      - name: warranty_program_system_fields_generated_and_extra_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.WarrantyProgram.fields.accrued_liability_cents
          - response_envelope.success
          - endpoints[POST /battery-warranty/warranty-programs]
        distinguishing_aspect: |
          id, created_at, updated_at and version are system-generated: a client that posts its own
          id, version and accrued_liability_cents gets them all ignored (version 1, accrual 0), and
          the returned id is not the one supplied.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020", id: "prog_client_supplied", version: 99, accrued_liability_cents: 5000000, created_at: "2000-01-01T00:00:00Z" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          assert:
            - "returns 201 and data.id != prog_client_supplied"
            - "data.version == 1 and data.accrued_liability_cents == 0 - the client values are ignored, not honoured and not an error"
            - "data.created_at == data.updated_at and both are the current logical clock 2026-08-01T00:00:00Z, not 2000-01-01T00:00:00Z"

      - name: battery_pack_invalid_enum_and_out_of_range_module_count_rejected
        claim_type: type_constraints
        grounds:
          - entities.BatteryPack.fields.pack_type
          - entities.BatteryPack.fields.module_count
          - validations[priority=4]
        distinguishing_aspect: |
          Both declared constraint kinds are enforced at priority 4 on the same endpoint: an enum
          outside {NEW, REMANUFACTURED} and a module_count outside 8..24 each return
          ERR_INVALID_REQUEST, and a REMANUFACTURED pack that omits refurb_soh_pct is rejected too -
          none of the three creates a row.
        test_recipe:
          setup:
            - "One program."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C005", pack_type: "REFURBISHED" }
              as: ProgramAdmin
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C006", module_count: 30 }
              as: ProgramAdmin
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C007", pack_type: "REMANUFACTURED" }
              as: ProgramAdmin
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C008", pack_type: "NEW", refurb_soh_pct: 90.00 }
              as: ProgramAdmin
          assert:
            - "call 1 returns 400 ERR_INVALID_REQUEST (pack_type not in the declared enum)"
            - "call 2 returns 400 ERR_INVALID_REQUEST (module_count 30 outside 8..24)"
            - "call 3 returns 400 ERR_INVALID_REQUEST (refurb_soh_pct is required when pack_type == REMANUFACTURED)"
            - "call 4 returns 400 ERR_INVALID_REQUEST (refurb_soh_pct MUST be omitted when pack_type == NEW)"
            - "GET /battery-warranty/battery-packs returns total_count == 0 - not one of the four rejected calls persisted a pack"

      - name: telematics_snapshot_is_immutable_event_without_version_field
        claim_type: immutability
        grounds:
          - entities.TelematicsSnapshot.common_fields
          - endpoints[GET /battery-warranty/vehicles/{id}/telematics-snapshots]
        distinguishing_aspect: |
          TelematicsSnapshot is declared common_fields false / kind event: its create response and
          list rows carry id and created_at but NO version and NO updated_at, and §1.5 exposes no
          update or delete route for it - the row can only be superseded by ingesting another.
        test_recipe:
          setup:
            - "One program, one vehicle, one installed pack."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000203", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C009", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
          trigger:
            - call: "POST /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: { captured_at: "2026-07-20T00:00:00Z", odometer_miles: 71000, reported_capacity_kwh: 56.000 }
              as: TelematicsGateway
              captures: { snap_id: $.data.id }
            - call: "GET /battery-warranty/vehicles/${veh_id}/telematics-snapshots"
              payload: {}
              as: TelematicsGateway
          assert:
            - "the create response carries data.id and data.created_at but has no version key and no updated_at key"
            - "data.vehicle_id == ${veh_id} even though vehicle_id is never supplied in the body (source system, taken from the path)"
            - "the listing returns exactly 1 row whose id == ${snap_id}, and that row likewise has no version key"
            - "the defaults are materialised: charge_cycles 400, max_cell_delta_mv 40, coolant_temp_c 20.0, dcfc_session_count 0"

      - name: technician_creation_under_unknown_center_returns_center_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Technician.parent
          - validations[priority=6]
          - errors[ERR_CENTER_NOT_FOUND]
        distinguishing_aspect: |
          Technician is a nested child of ServiceCenter, so its create route is validated on the
          path segment first: an unknown center id returns ERR_CENTER_NOT_FOUND even though the body
          itself is perfectly valid, and no orphan technician is created.
        test_recipe:
          setup:
            - "One real center exists so the failure cannot be blamed on an empty table."
          setup_api_calls:
            - call: "POST /battery-warranty/service-centers"
              payload: { name: "West HV Center" }
              as: ProgramAdmin
              captures: { center_id: $.data.id }
          trigger:
            - call: "POST /battery-warranty/service-centers/ctr_00000000000000000000/technicians"
              payload: { full_name: "Ghost Tech" }
              as: ProgramAdmin
            - call: "GET /battery-warranty/service-centers/${center_id}/technicians"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the create returns 404 ERR_CENTER_NOT_FOUND"
            - "the real center's technician listing returns total_count == 0 - the row was not attached anywhere"

      - name: field_release_creates_one_consent_junction_row_per_eligible_vehicle
        claim_type: graph
        grounds:
          - entities.RemediationConsent.fields.solicitation_round
          - state_machines.RemediationCampaign.transitions.DRAFT_to_FIELD_RELEASE
          - errors[ERR_VEHICLE_NOT_TARGETED]
        distinguishing_aspect: |
          RemediationConsent is the many-to-many junction between campaign and vehicle: a FIELD
          release mints exactly one PENDING row per ELIGIBLE vehicle in vehicle.created_at ASC order
          (2 rows, not 3 - the MX-70 car is not targeted), each with solicitation_round 1 and
          expires_at exactly created_at + 14 days, and an explicit solicitation for the untargeted
          car is refused.
        test_recipe:
          setup:
            - "One program; three vehicles created in order A (MX-90), B (MX-90), C (MX-70); packs installed on A and B."
            - "One DRAFT campaign targeting model MX-90 with applies_to_pack_type ANY."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000211", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { vehA_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000212", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { vehB_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000213", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10", model_code: "MX-70" }
              as: ProgramAdmin
              captures: { vehC_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C011", installed_vehicle_id: "${vehA_id}" }
              as: ProgramAdmin
              captures: { packA_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C012", installed_vehicle_id: "${vehB_id}" }
              as: ProgramAdmin
              captures: { packB_id: $.data.id }
            - call: "POST /battery-warranty/remediation-campaigns"
              payload: { campaign_code: "CMP-CHG-01", target_defect: "CHARGING", software_version: "bms-4.2.1", applies_to_pack_type: "ANY", applies_to_model_code: "MX-90" }
              as: ProgramAdmin
              captures: { camp_id: $.data.id }
          trigger:
            - call: "POST /battery-warranty/remediation-campaigns/${camp_id}/release"
              payload: { release_scope: "FIELD" }
              as: ProgramAdmin
              captures: { camp_ver: $.data.version }
            - call: "GET /battery-warranty/remediation-consents"
              payload: { campaign_id: "${camp_id}" }
              as: ProgramAdmin
              captures: { consent_a_id: "$.data[0].id" }
            - call: "POST /battery-warranty/remediation-consents"
              payload: { campaign_id: "${camp_id}", vehicle_id: "${vehC_id}", expected_campaign_version: "${camp_ver}" }
              as: ProgramAdmin
          assert:
            - "the release returns 200 with status FIELD_RELEASE, release_scope FIELD, solicited_consent_count 2 and open_consent_count 2"
            - "the consent listing returns total_count == 2 with data[0].vehicle_id == ${vehA_id} and data[1].vehicle_id == ${vehB_id} (vehicle.created_at ASC)"
            - "both rows have consent_status PENDING, solicitation_round 1, superseded_consent_id null and expires_at 2026-08-15T00:00:00Z (created_at + 14 days)"
            - "no consent row exists for ${vehC_id}: the explicit solicitation returns 422 ERR_VEHICLE_NOT_TARGETED because its model_code MX-70 != applies_to_model_code MX-90"
            - "the refused solicitation leaves solicited_consent_count at 2"

  - section: state_machines
    instances:
      - name: thermal_event_s1_creation_sets_both_initial_dimensions
        claim_type: initial_state
        grounds:
          - state_machines.ThermalEvent.containment_status.initial_state
          - state_machines.ThermalEvent.notification_status
          - calculations.regulatory_notification_deadline
        distinguishing_aspect: |
          A severity-S1 event opens BOTH dimensions at once but asymmetrically: containment_status
          DETECTED (live) and notification_status NOT_REQUIRED (already settled) with a null
          deadline, and the join still reports event_status OPEN. Crucially an S1 event performs
          none of the S3/S4 cascade: the pack stays IN_SERVICE and the vehicle stays ACTIVE.
        test_recipe:
          setup:
            - "One program, one vehicle, one installed pack; clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /battery-warranty/warranty-programs"
              payload: { name: "MX Capacity Retention 2020" }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /battery-warranty/vehicles"
              payload: { vin: "5YJ3E1EA7KF000221", warranty_program_id: "${prog_id}", in_service_date: "2020-03-10" }
              as: ProgramAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /battery-warranty/battery-packs"
              payload: { serial_number: "PK-C021", installed_vehicle_id: "${veh_id}" }
              as: ProgramAdmin
              captures: { pack_id: $.data.id }
          trigger:
            - call: "POST /battery-warranty/thermal-events"
              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", severity: "S1", detected_at: "2026-07-31T12:00:00Z", source: "TELEMATICS", affected_module_positions: [4] }
              as: TelematicsGateway
              captures: { event_id: $.data.id }
            - call: "GET /battery-warranty/battery-packs/${pack_id}"
              payload: {}
              as: ProgramAdmin
            - call: "GET /battery-warranty/vehicles/${veh_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the event is created 201 with containment_status DETECTED, containment_steps_completed 0 and event_status OPEN"
            - "notification_status == NOT_REQUIRED with notification_deadline_at null, notification_filed_at null and reporting_service_center_id null"
            - "the pack still has status IN_SERVICE, damaged_defective false and hazmat_classification null - no S3/S4 cascade ran"
            - "the vehicle still has status ACTIVE and warranty_hold false"
            - "module position 4 still has thermal_runaway_flag false and status HEALTHY (only S3/S4 events flag modules)"

      - name: limited_release_requires_pilot_regions_then_solicits_only_pilot_vehicles
