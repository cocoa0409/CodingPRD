# =============================================================================
# task_0575_zipline_park — §1.9 Scaffold Corner Design (breadth coverage)
# Enumerates testable claims from §1.1–§1.7 not already carried by §1.8.
# Same seven-point contract + §1.5 reachability as §1.8. Clock default
# 2026-05-01T00:00:00Z; weekday slot 2026-06-03T10:00Z; weekend 2026-06-06T10:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_course_returns_201_and_echoes_fields
        claim_type: Creation
        grounds: [entities.Course, endpoints]
        distinguishing_aspect: "POST /courses with all required fields returns 201 with a server-minted id and echoes base_price_cents 5000, difficulty_level 2."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id, bp: $.data.base_price_cents }
          assert:
            - "response HTTP status == 201"
            - "Course.${course_id}.base_price_cents == 5000"
            - "Course.${course_id}.difficulty_level == 2"

      - name: participant_age_years_computed_from_clock
        claim_type: Computed Fields
        grounds: [entities.Participant.fields.age_years]
        distinguishing_aspect: "A participant born 2016-05-01 has computed age_years 10 at default clock 2026-05-01; input age is not accepted."
        test_recipe:
          setup: ["clock at default 2026-05-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /participants"
              payload: { full_name: "Kid", weight_kg: 40, birthdate: "2016-05-01T00:00:00Z" }
              as: Operator
              captures: { p_id: $.data.id, age: $.data.age_years }
          assert:
            - "Participant.${p_id}.age_years == 10"

      - name: timeslot_end_at_computed_from_duration
        claim_type: Computed Fields
        grounds: [entities.TimeSlot.fields.end_at]
        distinguishing_aspect: "TimeSlot.end_at is start_at + Course.duration_minutes: 10:00 + 90m = 2026-06-03T11:30:00Z."
        test_recipe:
          setup: ["Course duration 90"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id, end: $.data.end_at }
          assert:
            - "TimeSlot.${ts_id}.end_at == 2026-06-03T11:30:00.000Z"
            - "TimeSlot.${ts_id}.capacity == 4"

      - name: booking_not_found_returns_404
        claim_type: Not Found
        grounds: ["errors[ERR_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /bookings/{unknown-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"
            - "response HTTP status == 404"

      - name: course_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Course, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /courses omitting required base_price_cents returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_VALIDATION"

      - name: booking_use_season_pass_defaults_false
        claim_type: Defaults
        grounds: [entities.Booking.fields.use_season_pass, entities.Booking.fields.season_pass_id]
        distinguishing_aspect: "Omitting use_season_pass leaves season_pass_id null and charges the full computed price 5000."
        test_recipe:
          setup: ["Course, weekday slot, guide assigned, participant p; no pass involved"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_id}" }
              as: Operator
              captures: { b_id: $.data.id }
          assert:
            - "Booking.${b_id}.season_pass_id == null"
            - "Booking.${b_id}.price_cents == 5000"

      - name: incident_report_created_append_only
        claim_type: Creation
        grounds: [entities.IncidentReport, endpoints]
        distinguishing_aspect: "IncidentReport (common_fields:false) is created 201 with id+created_at, echoes severity SEVERE, and is discoverable via GET /bookings/{id}/incident-reports."
        test_recipe:
          setup: ["Course, weekday slot, guide assigned, participant, CONFIRMED booking"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_id}" }
              as: Operator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /incident-reports"
              payload: { booking_id: "${b_id}", severity: "SEVERE", description: "fall arrested by harness", reported_by_guide_id: "${g1_id}" }
              as: Guide
              as_user_id: "${g1_id}"
              captures: { ir_id: $.data.id }
          assert:
            - "response HTTP status == 201"
            - "IncidentReport.${ir_id}.severity == SEVERE"
            - "GET /bookings/${b_id}/incident-reports returns an array containing ${ir_id}"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: cancel_from_completed_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Booking, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A COMPLETED booking is terminal; POST /bookings/{id}/cancel returns ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["Course, weekday slot OPEN, guide assigned, participant with waiver, booking driven CONFIRMED->CHECKED_IN->BRIEFED->COMPLETED"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/waiver"
              payload: { signature_name: "P A" }
              as: Operator
            - call: "POST /time-slots/${ts_id}/open"
              payload: {}
              as: Operator
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_id}" }
              as: Operator
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/check-in"
              payload: {}
              as: Operator
            - call: "POST /bookings/${b_id}/brief"
              payload: {}
              as: Operator
            - call: "POST /bookings/${b_id}/complete"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Booking.${b_id}.status == COMPLETED"

      - name: redeem_non_rainchecked_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.RAINCHECKED_to_REDEEMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /bookings/{id}/redeem on a CONFIRMED (not RAINCHECKED) booking returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Course, two weekday slots ts1 (booked) and ts2 (target), guide assigned to each"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts1: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-10T10:00:00Z" }
              as: Operator
              captures: { ts2: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts1}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts1}", participant_id: "${p_id}" }
              as: Operator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/redeem"
              payload: { time_slot_id: "${ts2}" }
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: open_slot_without_guide_returns_no_guide_assigned
        claim_type: Precondition Enforcement
        grounds: [state_machines.TimeSlot.SCHEDULED_to_OPEN, "errors[ERR_NO_GUIDE_ASSIGNED]"]
        distinguishing_aspect: "Opening a slot with zero ASSIGNED guide assignments returns ERR_NO_GUIDE_ASSIGNED."
        test_recipe:
          setup: ["Course, weekday slot, no guide assigned"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
          trigger:
            - call: "POST /time-slots/${ts_id}/open"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_GUIDE_ASSIGNED"
            - "TimeSlot.${ts_id}.status == SCHEDULED"

      - name: slot_complete_marks_confirmed_no_show
        claim_type: Side Effect Execution
        grounds: [state_machines.TimeSlot.OPEN_to_COMPLETED, state_machines.Booking.CONFIRMED_to_NO_SHOW]
        distinguishing_aspect: "Completing a slot flips leftover CONFIRMED bookings to NO_SHOW (credit stays 0) and releases their seats (remaining back to 4)."
        test_recipe:
          setup: ["Course, weekday slot OPEN, guide assigned, one CONFIRMED booking"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /time-slots/${ts_id}/open"
              payload: {}
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_id}" }
              as: Operator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /time-slots/${ts_id}/complete"
              payload: {}
              as: Operator
          assert:
            - "Booking.${b_id}.status == NO_SHOW"
            - "Booking.${b_id}.raincheck_credit_cents == 0"
            - "TimeSlot.${ts_id}.remaining_capacity == 4"

      - name: cancel_group_twice_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Group.OPEN_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A second POST /groups/{id}/cancel on an already-CANCELLED group returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Course, weekday slot, guide assigned, Group G created and cancelled once"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /groups"
              payload: { name: "Team", time_slot_id: "${ts_id}", expected_size: 2, organizer_name: "Org" }
              as: Operator
              captures: { g_id: $.data.id }
            - call: "POST /groups/${g_id}/cancel"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /groups/${g_id}/cancel"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Group.${g_id}.status == CANCELLED"

  # ===========================================================================
  - section: calculations
    instances:
      - name: voluntary_full_refund_when_lead_ge_24h
        claim_type: Variant Selection
        grounds: [calculations.cancellation_credit, entities.Booking.fields.raincheck_credit_cents]
        distinguishing_aspect: "A voluntary cancel at default clock 2026-05-01 (>>24h before 2026-06-03 slot) yields full credit 5000 — the full-refund branch, contrasting the <24h half branch."
        test_recipe:
          setup: ["Course, weekday slot, guide assigned, participant, CONFIRMED booking (price 5000); clock stays 2026-05-01"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts_id: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts_id}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts_id}", participant_id: "${p_id}" }
              as: Operator
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Operator
          assert:
            - "Booking.${b_id}.status == CANCELLED"
            - "Booking.${b_id}.raincheck_credit_cents == 5000"

      - name: redeem_applies_raincheck_credit_to_new_booking
        claim_type: Reconciliation
        grounds: [state_machines.Booking.RAINCHECKED_to_REDEEMED, calculations.booking_price, entities.Booking.fields.redeemed_from_booking_id]
        distinguishing_aspect: "Redeeming a RAINCHECKED booking (credit 5000) into a weekday slot (price 5000) yields a new booking priced max(0, 5000-5000)=0 whose redeemed_from_booking_id points at the origin, and the origin becomes REDEEMED."
        test_recipe:
          setup: ["Course, slot ts1 (booked then weather-closed -> booking RAINCHECKED credit 5000), target slot ts2 (weekday SCHEDULED)"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-03T10:00:00Z" }
              as: Operator
              captures: { ts1: $.data.id }
            - call: "POST /time-slots"
              payload: { course_id: "${course_id}", start_at: "2026-06-10T10:00:00Z" }
              as: Operator
              captures: { ts2: $.data.id }
            - call: "POST /guides"
              payload: { name: "G1", certification_level: 3 }
              as: Operator
              captures: { g1_id: $.data.id }
            - call: "POST /guide-assignments"
              payload: { guide_id: "${g1_id}", time_slot_id: "${ts1}" }
              as: Operator
            - call: "POST /participants"
              payload: { full_name: "P A", weight_kg: 70, birthdate: "2000-01-01T00:00:00Z" }
              as: Operator
              captures: { p_id: $.data.id }
            - call: "POST /bookings"
              payload: { time_slot_id: "${ts1}", participant_id: "${p_id}" }
              as: Operator
              captures: { b_id: $.data.id }
            - call: "POST /time-slots/${ts1}/close"
              payload: { reason: "storm" }
              as: Operator
          trigger:
            - call: "POST /bookings/${b_id}/redeem"
              payload: { time_slot_id: "${ts2}" }
              as: Operator
              captures: { new_id: $.data.id, new_price: $.data.price_cents, new_from: $.data.redeemed_from_booking_id }
          assert:
            - "Booking.${b_id}.status == REDEEMED"
            - "Booking.${new_id}.price_cents == 0"
            - "Booking.${new_id}.redeemed_from_booking_id == ${b_id}"

      - name: weekend_surcharge_price_5750
        claim_type: Correct Result
        grounds: [calculations.booking_price]
        excluded_because:
          difficulty_instance: combinatorial_formula / booking_price_tiered_group_weekend_pass_mode_a
          rationale: "The weekend single-booking price 5750 is asserted as one of the three price paths of that §1.8 instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: age_below_minimum_returns_422
        claim_type: Violation to Error
        grounds: ["validations[priority=7]", "errors[ERR_AGE_BELOW_MINIMUM]"]
        distinguishing_aspect: "Booking a participant aged 6 (born 2019-06-04) on a course with min_age 8 returns ERR_AGE_BELOW_MINIMUM (422)."
        test_recipe:
          setup: ["Course min_age 8, weekday slot, guide assigned, participant born 2019-06-04 (age 6 at default clock)"]
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Zip A", difficulty_level: 2, min_weight_kg: 30, max_weight_kg: 120, min_age_years: 8, base_price_cents: 5000, duration_minutes: 90, default_capacity: 4, max_participants_per_guide: 4, weekend_surcharge_pct: 0.15 }
              as: Operator
              captures: { course_id: $.data.id }
            - call: "POST /time-slots"
