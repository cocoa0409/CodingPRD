            - "the gate is still IN_REVIEW at version 2 with cleared_by_user_id null"
            - "the use case is still UNDER_REVIEW with cleared_gate_count 0"

      - name: privacy_reviewer_cannot_open_business_gate_mismatch
        claim_type: cannot_perform_other_roles_exclusive_operations
        grounds: ["errors[ERR_GATE_ROLE_MISMATCH]", "validations[p27]", roles.PrivacyReviewer.exclusive_operations]
