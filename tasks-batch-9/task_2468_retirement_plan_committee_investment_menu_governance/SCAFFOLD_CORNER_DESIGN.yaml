            - call: "POST /governance/motions"
              payload: { meeting_id: "${meet_q7_id}", subject_type: "WATCH_LIST_ACTION", subject_id: "${fund_small_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
              captures: { motion_q7_id: $.data.id }
            - call: "POST /governance/plans/${plan_id}/advance-quarter"
              payload: {}
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/motions/${motion_q7_id}/votes"
              payload: { member_id: "${mem_chair_id}", vote: "FOR" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/committee-meetings/${meet_q7_id}/adjourn"
