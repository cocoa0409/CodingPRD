            - "DeliveryBooking.${b1}.status == CANCELLED"
            - "hop 1: DeliverySlot.${slot_id}.used_weight_kg == 70 and used_volume_m3 == 0.9 after promotion (100 - 60 freed, then + 30 / + 0.1 consumed)"
            - "hop 2: DeliveryBooking.${b3}.status == CONFIRMED (oldest fitting waitlisted booking promoted by the cancel, not by a direct call)"
            - "hop 3: Order.${o3}.delivery_status == SCHEDULED and BinStock.${bs30}.reserved == 1 (promotion reserves stock)"

      - name: assembly_complete_closes_order_credits_points
        grounds:
          - state_machines.AssemblyJob.IN_PROGRESS_to_COMPLETED
          - state_machines.Order.IN_PROGRESS_to_COMPLETED
          - state_machines.Order.DELIVERED_to_CLOSED
          - calculations.points_accrual
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (assembly completion, not
          booking cancel): completing the job mutates the job (hop 1), which
          bubbles the order's assembly_status to COMPLETED (hop 2), which
          auto-closes the DELIVERED order (hop 3), which credits family points
          to the Customer (hop 4) — each hop caused only by the previous one.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Store ST-001. Member customer M. Article ASM (price 1000, requires_assembly, standard 30 min/unit, carton 10 kg / 0.1 m3), stock 2. DELIVERY-channel order qty 1 (total 1000) booked on a ZONE_A slot, out for delivery and completed (order DELIVERED). Assembly job requested (estimate 30), dispatched and started."
