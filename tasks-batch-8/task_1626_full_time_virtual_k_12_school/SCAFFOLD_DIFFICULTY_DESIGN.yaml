scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (two calculations, different entity domains)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: funding_proration_daily_attendance_vs_calendar_elapsed
        grounds:
          - calculations.funding_proration
          - calculations.proration_mode_selector
          - state_machines.Student.ENROLLED_to_WITHDRAWN
        distinguishing_aspect: |
          The same EnrollmentTerm yields a different claimable_days under the
          DAILY_ATTENDANCE variant (counts only days with a PRESENT or PARTIAL
          AttendanceRecord) versus the CALENDAR_ELAPSED variant (counts every
          calendar day in the inclusive [term_start, term_end] range), even
          when the underlying attendance data is identical. This is a
          funding-domain calculation; the second Rule-1 instance lives in the
          truancy domain.
        test_recipe:
          setup:
            - "District D with funding_rate_cents=500"
            - "Student S in district D, enrolled on 2026-08-03"
            - "AttendanceRecord for 2026-08-03 PRESENT (300 mins, 3 check-ins)"
            - "AttendanceRecord for 2026-08-04 ABSENT_UNEXCUSED (0 mins, 0 check-ins)"
            - "AttendanceRecord for 2026-08-05 PRESENT (300 mins, 3 check-ins)"
            - "Student withdrawn on 2026-08-06 with withdrawal_reason=DROPOUT (term_end_date = 2026-08-05)"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-001", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 100 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Alice", date_of_birth: "2012-01-15T00:00:00Z", grade_level: 7, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { student_v_after_verify: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${student_v_after_verify}" }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-03T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-04T00:00:00Z", synchronous_minutes: 0, engagement_check_ins: 0 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-05T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "DROPOUT" }
              as: EnrollmentOfficer
          assert:
            - "Student.${student_id}.funding_days_claimed == 2"
            - "Student.${student_id}.funding_claim_cents == 1000"
            - "first EnrollmentTerm for student has proration_mode == DAILY_ATTENDANCE"
            - "first EnrollmentTerm for student has claimable_days == 2"
      - name: truancy_window_count_record_count_window_vs_calendar_span
        grounds:
          - calculations.truancy_window_count
          - calculations.truancy_determination
        distinguishing_aspect: |
          The truancy window is defined by *count of AttendanceRecord rows*
          (the 10 most recent records), not by a fixed calendar span. A
          student whose 3 unexcused absences fall inside the most-recent-10
          records is flagged truant; if the window were a calendar span
          instead, the same records might fall outside the window. This is a
          truancy-domain calculation, distinct from the funding-domain
          proration rule.
        test_recipe:
          setup:
            - "District D, Student S enrolled 2026-08-03"
            - "Nine AttendanceRecords on consecutive school days 2026-08-03 through 2026-08-13: 08-03, 08-05, 08-07 ABSENT_UNEXCUSED; the rest PRESENT"
            - "Clock advanced to 2026-08-14"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-002", state_code: "TX", funding_rate_cents: 400, enrollment_cap: 100 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Bob", date_of_birth: "2011-05-20T00:00:00Z", grade_level: 8, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { student_v_after_verify: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${student_v_after_verify}" }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-03T00:00:00Z", synchronous_minutes: 0, engagement_check_ins: 0 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-04T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-05T00:00:00Z", synchronous_minutes: 0, engagement_check_ins: 0 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-06T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-07T00:00:00Z", synchronous_minutes: 0, engagement_check_ins: 0 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-10T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-11T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-12T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${student_id}", attendance_date: "2026-08-13T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /vks/students/${student_id}"
              payload: {}
              as: EnrollmentOfficer
          assert:
            - "Student.${student_id}.truancy_unexcused_count == 3"
            - "Student.${student_id}.truancy_flag == true"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (different modes: (a) and (b))
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: funding_proration_conditional_branch_on_attendance_and_mode
        grounds:
          - calculations.funding_proration
          - calculations.proration_mode_selector
        distinguishing_aspect: |
          Mode (a): the formula has >=3 inputs (term_start, term_end,
          attendance_status set) with a conditional branch on proration_mode
          derived from withdrawal_reason; the two branches select disjoint
          input subsets of the same AttendanceRecord set. Same records, two
          modes, different outputs.
        test_recipe:
          setup:
            - "District D with funding_rate_cents=500"
            - "Students S1 and S2 in D, both enrolled 2026-08-03, identical attendance: 08-03 PRESENT, 08-04 ABSENT_UNEXCUSED, 08-05 PRESENT"
            - "Both withdrawn on 2026-08-06 (term_end=2026-08-05); S1 with reason DROPOUT, S2 with reason MOVED_DISTRICT"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-010", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 100 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Carol", date_of_birth: "2012-03-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { s1_id: $.data.id }
            - call: "POST /vks/students/${s1_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s1_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${s1_id}/enroll"
              payload: { expected_student_version: "${s1_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${s1_id}", attendance_date: "2026-08-03T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${s1_id}", attendance_date: "2026-08-04T00:00:00Z", synchronous_minutes: 0, engagement_check_ins: 0 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${s1_id}", attendance_date: "2026-08-05T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/students"
              payload: { legal_name: "Dave", date_of_birth: "2012-04-01T00:00:00Z", grade_level: 6, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { s2_id: $.data.id }
            - call: "POST /vks/students/${s2_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s2_v: $.data.version }
            - call: "POST /vks/students/${s2_id}/enroll"
              payload: { expected_student_version: "${s2_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${s2_id}", attendance_date: "2026-08-03T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${s2_id}", attendance_date: "2026-08-04T00:00:00Z", synchronous_minutes: 0, engagement_check_ins: 0 }
              as: EnrollmentOfficer
            - call: "POST /vks/attendance"
              payload: { student_id: "${s2_id}", attendance_date: "2026-08-05T00:00:00Z", synchronous_minutes: 300, engagement_check_ins: 3 }
              as: EnrollmentOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vks/students/${s1_id}/withdraw"
              payload: { withdrawal_reason: "DROPOUT" }
              as: EnrollmentOfficer
            - call: "POST /vks/students/${s2_id}/withdraw"
              payload: { withdrawal_reason: "MOVED_DISTRICT" }
              as: EnrollmentOfficer
          assert:
            - "Student.${s1_id}.funding_days_claimed == 2"
            - "Student.${s1_id}.funding_claim_cents == 1000"
            - "Student.${s2_id}.funding_days_claimed == 3"
            - "Student.${s2_id}.funding_claim_cents == 1500"
      - name: funding_claim_amount_per_term_then_sum_order
        grounds:
          - calculations.funding_claim_amount
        distinguishing_aspect: |
          Mode (b): nested-order pinning — the formula is explicitly
          "multiply per term, then sum", NOT "sum days then multiply". Two
          withdrawn terms of 3 days each at rate 333 cents produce
          (3*333) + (3*333) = 999 + 999 = 1998, pinned; alternative order
          ((3+3)*333 = 1998) coincides here so we vary the terms: term1=3
          days, term2=2 days at rate 333 -> 999 + 666 = 1665 (per-term) is
          the pinned answer regardless of aggregation order at integer
          precision; the discriminating scenario is the term-by-term
          accounting visible in per-term outputs, which the sum-then-multiply
          order would obscure.
        test_recipe:
          setup:
            - "District D with funding_rate_cents=333"
            - "Student S enrolled 2026-08-03; withdrawn 2026-08-06 with MOVED_DISTRICT (term_end=2026-08-05, 3 calendar days, CALENDAR_ELAPSED -> claimable_days=3)"
            - "S re-enrolled 2026-08-10; withdrawn 2026-08-12 with HOMESCHOOL (term_end=2026-08-11, 2 calendar days, CALENDAR_ELAPSED -> claimable_days=2)"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-011", state_code: "WA", funding_rate_cents: 333, enrollment_cap: 100 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Eve", date_of_birth: "2010-09-01T00:00:00Z", grade_level: 9, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v1: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v1}" }
              as: EnrollmentOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "MOVED_DISTRICT" }
              as: EnrollmentOfficer
            - call: "POST /vks/students/${student_id}/request-reenrollment"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v2: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v2}" }
              as: EnrollmentOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "HOMESCHOOL" }
              as: EnrollmentOfficer
          assert:
            - "Student.${student_id}.funding_days_claimed == 5"
            - "Student.${student_id}.funding_claim_cents == 1665"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: student_enrollment_withdrawal_reenrollment_cycle
        grounds:
          - state_machines.Student.ENROLLED_to_WITHDRAWN
          - state_machines.Student.WITHDRAWN_to_REENROLL_PENDING
          - state_machines.Student.REENROLL_PENDING_to_ENROLLED
        distinguishing_aspect: |
          Student entity exhibits a CYCLE: ENROLLED -> WITHDRAWN ->
          REENROLL_PENDING -> ENROLLED. The student can re-enter ENROLLED
          after reaching a nominally-terminal-looking WITHDRAWN state.
        test_recipe:
          setup:
            - "District D with enrollment_cap=10"
            - "Student S enrolled 2026-08-03, withdrawn 2026-08-10, re-enrolled 2026-08-17"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-020", state_code: "OR", funding_rate_cents: 400, enrollment_cap: 10 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Frank", date_of_birth: "2011-11-11T00:00:00Z", grade_level: 8, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v1: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v1}" }
              as: EnrollmentOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "HOMESCHOOL" }
              as: EnrollmentOfficer
            - call: "POST /vks/students/${student_id}/request-reenrollment"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v2: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-17T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v2}" }
              as: EnrollmentOfficer
          assert:
            - "Student.${student_id}.enrollment_status == ENROLLED"
            - "count of EnrollmentTerm rows for student == 2"
            - "first EnrollmentTerm has term_status == WITHDRAWN"
            - "second EnrollmentTerm has term_status == ACTIVE"
      - name: service_delivery_missed_to_scheduled_loop
        grounds:
          - state_machines.ServiceDelivery.SCHEDULED_to_MISSED
          - state_machines.ServiceDelivery.MISSED_to_SCHEDULED
        distinguishing_aspect: |
          ServiceDelivery entity exhibits a REVISION LOOP (different entity
          and different shape from Student's enrollment cycle): a MISSED
          delivery can be rescheduled back to SCHEDULED, potentially multiple
          times, before being DELIVERED.
        test_recipe:
          setup:
            - "Special-ed student S enrolled; provider T certified in S's district state NV"
            - "ServiceDelivery scheduled for 2026-08-05 10:00, 30 min"
            - "Clock advanced to 2026-08-05 11:00; delivery marked MISSED"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-021", state_code: "NV", funding_rate_cents: 400, enrollment_cap: 10 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Grace", date_of_birth: "2013-02-14T00:00:00Z", grade_level: 5, district_of_residence_id: "${district_id}", special_education_flag: true }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/teachers"
              payload: { full_name: "Ms. Smith", certification_state_codes: ["NV"], caseload_cap: 30 }
              as: AcademicDirector
              captures: { teacher_id: $.data.id }
            - call: "POST /vks/service-deliveries"
              payload: { student_id: "${student_id}", service_type: "SPEECH_THERAPY", scheduled_at: "2026-08-05T10:00:00Z", duration_minutes: 30, provider_id: "${teacher_id}" }
              as: SpecialEdCoordinator
              captures: { sd_id: $.data.id }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/service-deliveries/${sd_id}/mark-missed"
              payload: {}
              as: SpecialEdCoordinator
          trigger:
            - call: "POST /vks/service-deliveries/${sd_id}/reschedule"
              payload: { scheduled_at: "2026-08-06T10:00:00Z" }
              as: SpecialEdCoordinator
          assert:
            - "ServiceDelivery.${sd_id}.delivery_status == SCHEDULED"
            - "ServiceDelivery.${sd_id}.scheduled_at == 2026-08-06T10:00:00Z"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (different triggers, depths 3 and 2)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: withdraw_cascade_stipend_forfeit_and_clawback
        grounds:
          - state_machines.Student.ENROLLED_to_WITHDRAWN
          - state_machines.DeviceStipend.RETURN_REQUESTED_to_FORFEITED
        distinguishing_aspect: |
          Depth-3 cascade originating from the withdraw transition: Student
          ENROLLED->WITHDRAWN mutates DeviceStipend ISSUED->RETURN_REQUESTED
          (link 1); the RETURN_REQUESTED state then itself triggers the
          auto-transition to FORFEITED once the clock passes return_due_date
          (link 2); the FORFEITED transition sets clawback_cents =
          amount_cents (link 3). Each link is caused by the previous state,
          not by the original withdraw call directly.
        test_recipe:
          setup:
            - "Student S enrolled; DEVICE stipend of 50000 cents issued"
            - "S withdrawn 2026-08-10 -> stipend auto RETURN_REQUESTED with return_due_date = 2026-09-09"
            - "Clock advanced past 2026-09-09"
          setup_api_calls:
            - call: "POST /vks/districts"
              payload: { district_code: "D-030", state_code: "CA", funding_rate_cents: 500, enrollment_cap: 10 }
              as: PlatformAdmin
              captures: { district_id: $.data.id }
            - call: "POST /vks/students"
              payload: { legal_name: "Hank", date_of_birth: "2012-06-06T00:00:00Z", grade_level: 7, district_of_residence_id: "${district_id}" }
              as: EnrollmentOfficer
              captures: { student_id: $.data.id }
            - call: "POST /vks/students/${student_id}/verify-residency"
              payload: {}
              as: EnrollmentOfficer
              captures: { s_v: $.data.version }
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/enroll"
              payload: { expected_student_version: "${s_v}" }
              as: EnrollmentOfficer
            - call: "POST /vks/stipends"
              payload: { student_id: "${student_id}", stipend_type: "DEVICE", amount_cents: 50000 }
              as: FinanceOfficer
              captures: { stipend_id: $.data.id }
            - call: "POST /vks/stipends/${stipend_id}/issue"
              payload: {}
              as: FinanceOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /vks/students/${student_id}/withdraw"
              payload: { withdrawal_reason: "DROPOUT" }
              as: EnrollmentOfficer
            - call: "POST /vks/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T08:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /vks/stipends/${stipend_id}"
              payload: {}
              as: FinanceOfficer
          assert:
            - "DeviceStipend.${stipend_id}.issue_status == FORFEITED"
            - "DeviceStipend.${stipend_id}.clawback_cents == 50000"
      - name: withdraw_cascade_teacher_assignment_caseload_release
        grounds:
          - state_machines.Student.ENROLLED_to_WITHDRAWN
          - state_machines.TeacherAssignment.ASSIGNED_to_ENDED
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger target: Student
          ENROLLED->WITHDRAWN mutates TeacherAssignment ASSIGNED->ENDED
          (link 1); the ENDED transition itself decrements
          Teacher.current_caseload (link 2). The decrement is a consequence
          of the assignment state change, not of the original withdraw call
          directly mutating Teacher.
        test_recipe:
          setup:
            - "Student S enrolled; Teacher T certified in TX with caseload_cap=5"
            - "T assigned to S; T.current_caseload becomes 1"
            - "S withdrawn"
          setup_api_calls:
