          assert:
            - "trigger 1 responds 201 and the slot reports held_capacity == 8, sold_capacity == 0, available_capacity == 12"
            - "trigger 2 responds 201 and the slot reports held_capacity == 16, available_capacity == 4"
            - "trigger 3 responds 409 ERR_SLOT_CAPACITY_EXCEEDED: 8 guests is legal against max_group_size 12 and against base_capacity 20, but not against the live available_capacity of 4"
            - "trigger 4 responds 201: a party of exactly 4 consumes exactly the remaining 4 seats, so the boundary is inclusive"
            - "trigger 5 responds 409 ERR_SLOT_CAPACITY_EXCEEDED for a single guest against available_capacity 0, and the slot is still OPEN rather than SOLD_OUT because SOLD_OUT is only reached through a confirmation"
