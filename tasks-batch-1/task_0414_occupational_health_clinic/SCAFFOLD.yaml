# =============================================================================
# Occupational Health Clinic (Concentra-style) — benchmark seed tables (v1)
# =============================================================================

scenario: |
  414. Occupational Health Clinic (Concentra style): employer account & protocol,
  pre-employment physical & drug screen (DOT/non-DOT), injury visit & OSHA
  recordability, work-status/restriction (return-to-work), surveillance exam
  (audiometric/respirator fit), chain-of-custody & MRO review, employer invoice,
  clearance issuance.

domain_name: occupational-health-clinic
api_prefix: /clinic

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Flat peer collections under /clinic with foreign-key references in the body:
  # /clinic/employers, /clinic/protocols, /clinic/workers, /clinic/encounters,
  # /clinic/drug-screens, /clinic/custody-events, /clinic/injury-cases,
  # /clinic/work-statuses, /clinic/surveillance-exams, /clinic/clearances,
  # /clinic/invoices. Every child carries its parent FK and is discoverable via a
  # filtered list (GET /clinic/<children>?<fk>=...). Cross-aggregate links abound:
  # Invoice line items reference Encounters; Encounter snapshots a Protocol; a
  # DrugScreen's MRO review is gated by its Employer and Encounter clinician.

  state_machine_shape: branching
  # Encounter forks by encounter_type into divergent downstream pipelines with
  # different side-effect sets; DrugScreen has a recollection cycle (non-linear);
  # InjuryCase has a reopen cycle; Clearance and Invoice are mostly linear.

  relationship_patterns:
    - one_to_many        # Employer -> Encounters; DrugScreen -> CustodyEvents
    - cross_aggregate    # Invoice line items reference Encounters; Encounter references a Protocol snapshot
    - polymorphic        # Encounter has at most one of {DrugScreen, InjuryCase, SurveillanceExam} keyed by encounter_type

  role_model: segregation_of_duties
  # The MRO who reviews a drug screen MUST be the employer's assigned MRO AND MUST
  # NOT be the Clinician who owns the encounter. Operational roles: Clinician,
  # Collector, MRO, ClinicAdmin.

  consistency_model: immediate

# =============================================================================
# Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true  # id, created_at, updated_at, version
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: account_status, type: enum, source: system, description: "PROSPECT -> ACTIVE -> SUSPENDED -> CLOSED; gates encounter scheduling. Set ACTIVE on first protocol activation." }
      - { name: dot_regulated, type: boolean, source: input, default: false, description: "Whether this employer operates DOT-regulated (FMCSA/49 CFR Part 40) positions" }
      - { name: mro_user_id, type: string, source: input, description: "Operator id of the Medical Review Officer assigned to review this employer's drug screens (opaque MRO identity)" }
      - { name: net_terms_days, type: integer, source: input, default: 30, description: "Invoice payment terms in days; used to compute Invoice.due_date and aging" }
      - { name: current_date, type: datetime, source: system, default: "1970-01-01", description: "Employer-scoped deterministic clock anchor (UTC date) used for surveillance windows, RTW, invoice aging; advanced only via /_clock/set" }
      - { name: outstanding_balance_cents, type: integer, source: computed, default: 0, description: "Sum over this employer's Invoices with status IN {ISSUED, OVERDUE, PARTIALLY_PAID} of (total_cents - paid_cents)" }

  - name: Protocol
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the owning employer" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> RETIRED; at most one ACTIVE protocol per employer at a time" }
      - { name: effective_date, type: datetime, source: input, description: "UTC date this protocol becomes effective when activated" }
      - { name: panels, type: array, source: input, description: "List of panel objects: {panel_code (enum PHYSICAL|DRUG_DOT|DRUG_NON_DOT|AUDIOMETRIC|RESPIRATOR_FIT), required_for_job_category (string), price_cents (integer >=0), recheck_interval_days (integer >=0; 0 means one-time)}" }

  - name: Worker
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the worker's employer" }
      - { name: full_name, type: string, source: input, description: "Worker full name" }
      - { name: job_category, type: string, source: input, description: "Worker job category; matched against Protocol panel.required_for_job_category" }
      - { name: dob, type: datetime, source: input, description: "Date of birth (UTC date)" }
      - { name: hire_status, type: enum, source: system, description: "CANDIDATE -> CLEARED / DISQUALIFIED; reflects the latest non-rescinded clearance determination on the worker" }

  - name: Encounter
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the billing employer" }
      - { name: worker_id, type: string, source: input, description: "FK -> Worker.id; the worker being seen" }
      - { name: protocol_id, type: string, source: system, description: "FK -> Protocol.id; the ACTIVE protocol snapshotted at scheduling time" }
      - { name: encounter_type, type: enum, source: input, description: "PHYSICAL | DRUG_SCREEN | INJURY | SURVEILLANCE; selects the downstream pipeline" }
      - { name: panel_code, type: enum, source: input, required: false, description: "For PHYSICAL/DRUG_SCREEN/SURVEILLANCE: which Protocol panel applies (PHYSICAL|DRUG_DOT|DRUG_NON_DOT|AUDIOMETRIC|RESPIRATOR_FIT). For INJURY: must be omitted." }
      - { name: clinician_user_id, type: string, source: system, description: "Operator id of the Clinician who created/owns the encounter (from X-User-ID); pinned for segregation-of-duties checks" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> PENDING_RESULTS -> COMPLETED / CANCELLED / VOIDED; branches per encounter_type" }
      - { name: billable_amount_cents, type: integer, source: computed, default: 0, description: "Snapshotted panel price for billable encounter types at COMPLETED; 0 for INJURY and CANCELLED/VOIDED. Drives invoice line items." }
      - { name: is_billed, type: boolean, source: computed, default: false, description: "True once a non-voided Invoice references this encounter as a line item" }

  - name: DrugScreen
    parent: Encounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id; the DRUG_SCREEN encounter this result belongs to" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; denormalized for MRO routing and filtering" }
      - { name: is_dot, type: boolean, source: computed, description: "True when the encounter panel_code == DRUG_DOT; controls regulated review rules" }
      - { name: specimen_seal_intact, type: boolean, source: input, description: "Collector attestation that the specimen seal was intact at lab receipt" }
      - { name: lab_result, type: enum, source: system, description: "NEGATIVE | NON_NEGATIVE | REJECTED_FOR_TESTING; recorded via lab-result; null until then" }
      - { name: mro_verified_result, type: enum, source: system, description: "MRO final determination: NEGATIVE | POSITIVE | REFUSAL | CANCELLED; null until MRO verify" }
      - { name: mro_user_id, type: string, source: system, description: "Operator id of the MRO who received the screen (from X-User-ID); null until mro-receive" }
      - { name: recollection_count, type: integer, source: computed, default: 0, description: "Number of times a recollection was ordered for this screen (0..2)" }
      - { name: status, type: enum, source: system, description: "AWAITING_COLLECTION -> COLLECTED -> AT_LAB -> LAB_REPORTED -> MRO_REVIEW -> VERIFIED / RECOLLECT_ORDERED / CANCELLED; cyclic via RECOLLECT_ORDERED -> AWAITING_COLLECTION" }

  - name: CustodyEvent
    parent: DrugScreen
    common_fields: false  # append-only forensic log: id + created_at only
    fields:
      - { name: drug_screen_id, type: string, source: input, description: "FK -> DrugScreen.id; the screen this custody step belongs to" }
      - { name: step, type: enum, source: input, description: "COLLECT | SEAL | SHIP | LAB_RECEIVE | LAB_REPORT | MRO_RECEIVE; chain-of-custody step recorded" }
      - { name: actor_user_id, type: string, source: system, description: "Operator id who recorded this custody step (from X-User-ID)" }
      - { name: seq, type: integer, source: system, description: "Monotonic per-screen sequence index starting at 1; defines custody ordering" }
      - { name: note, type: string, source: input, required: false, description: "Optional free-text custody note" }

  - name: InjuryCase
    parent: Encounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id; the INJURY encounter this case belongs to" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; denormalized for OSHA log scoping and filtering" }
      - { name: injury_date, type: datetime, source: input, description: "UTC date the injury occurred; must be <= employer current_date" }
      - { name: treatment_level, type: enum, source: input, description: "FIRST_AID | MEDICAL_TREATMENT | LOST_TIME | RESTRICTED_DUTY | FATALITY; drives OSHA recordability" }
      - { name: days_away, type: integer, source: input, default: 0, description: "Calendar days away from work (>=0)" }
      - { name: days_restricted, type: integer, source: input, default: 0, description: "Calendar days on restricted/transferred duty (>=0)" }
      - { name: is_osha_recordable, type: boolean, source: computed, description: "Derived per OSHA recordability rules (calculations.osha_recordability)" }
      - { name: osha_column, type: enum, source: computed, description: "NOT_RECORDABLE | DEATH | DAYS_AWAY | RESTRICTED_TRANSFER | OTHER_RECORDABLE; OSHA 300 log column" }
      - { name: status, type: enum, source: system, description: "OPEN -> RTW_PENDING -> CLOSED; reopen cycle CLOSED -> OPEN" }

  - name: WorkStatus
    parent: InjuryCase
    common_fields: true
    fields:
      - { name: injury_case_id, type: string, source: input, description: "FK -> InjuryCase.id; the case this work-status note belongs to" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; denormalized for filtering" }
      - { name: disposition, type: enum, source: input, description: "FULL_DUTY | MODIFIED_DUTY | OFF_WORK; the return-to-work disposition" }
      - { name: restriction_text, type: string, source: input, required: false, description: "Free-text restrictions; required when disposition == MODIFIED_DUTY" }
      - { name: valid_from, type: datetime, source: input, description: "UTC date this work-status note takes effect (inclusive)" }
      - { name: valid_to, type: datetime, source: input, description: "UTC date this work-status note expires (inclusive); must be >= valid_from" }
      - { name: superseded, type: boolean, source: computed, default: false, description: "True when a later-issued WorkStatus on the same case overlaps and replaces this one" }

  - name: SurveillanceExam
    parent: Encounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id; the SURVEILLANCE encounter this exam belongs to" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; denormalized for filtering" }
      - { name: worker_id, type: string, source: system, description: "FK -> Worker.id; denormalized from the encounter for recheck-window queries" }
      - { name: exam_kind, type: enum, source: computed, description: "AUDIOMETRIC | RESPIRATOR_FIT; derived from encounter panel_code" }
      - { name: baseline_threshold_db, type: integer, source: input, required: false, description: "AUDIOMETRIC only: baseline hearing threshold in dB" }
      - { name: current_threshold_db, type: integer, source: input, required: false, description: "AUDIOMETRIC only: current hearing threshold in dB (same basis as baseline)" }
      - { name: fit_factor, type: integer, source: input, required: false, description: "RESPIRATOR_FIT only: measured quantitative fit factor (integer)" }
      - { name: respirator_class, type: enum, source: input, required: false, description: "RESPIRATOR_FIT only: HALF_MASK | FULL_FACEPIECE; sets the required fit-factor pass threshold" }
      - { name: outcome, type: enum, source: computed, description: "PASS | STS | FAIL; AUDIOMETRIC yields PASS/STS (standard threshold shift); RESPIRATOR_FIT yields PASS/FAIL; null until recorded" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> RECORDED -> FINALIZED / CANCELLED" }

  - name: Clearance
    parent: Encounter
    common_fields: true
    fields:
      - { name: encounter_id, type: string, source: input, description: "FK -> Encounter.id; the encounter this clearance certifies" }
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id; denormalized for filtering" }
      - { name: worker_id, type: string, source: system, description: "FK -> Worker.id; the cleared worker, denormalized from the encounter" }
      - { name: determination, type: enum, source: input, description: "FIT | FIT_WITH_RESTRICTIONS | NOT_FIT; clinician fit-for-duty determination" }
      - { name: restriction_text, type: string, source: input, required: false, description: "Required when determination == FIT_WITH_RESTRICTIONS" }
      - { name: status, type: enum, source: system, description: "ISSUED -> RESCINDED; terminal once RESCINDED" }

  - name: Invoice
    parent: Employer
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the billed employer" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive UTC date of the billing period" }
      - { name: period_end, type: datetime, source: input, description: "Inclusive UTC date of the billing period (>= period_start)" }
      - { name: issue_date, type: datetime, source: system, description: "Employer current_date at the moment of issue; null while DRAFT" }
      - { name: due_date, type: datetime, source: computed, description: "issue_date + Employer.net_terms_days; null while DRAFT" }
      - { name: line_item_encounter_ids, type: array, source: computed, description: "Encounter ids included as line items (billable, COMPLETED, period-matched, not already billed)" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of billable_amount_cents over line-item encounters" }
      - { name: discount_cents, type: integer, source: computed, description: "Volume discount applied per calculations.invoice_total" }
      - { name: total_cents, type: integer, source: computed, description: "subtotal_cents - discount_cents (>=0)" }
      - { name: paid_cents, type: integer, source: computed, default: 0, description: "Cumulative payments applied" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ISSUED -> PARTIALLY_PAID -> PAID; ISSUED/PARTIALLY_PAID -> OVERDUE (auto by clock); DRAFT -> VOIDED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Employer
    initial_state: PROSPECT
    terminal_states: [CLOSED]
    transitions:
      - from: PROSPECT
        to: ACTIVE
        trigger: "system (automatic when the employer's first Protocol is activated)"
        actor: system
        preconditions:
          - "Employer is PROSPECT (no-op if already ACTIVE)"
        side_effects:
          - "account_status = ACTIVE"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /clinic/employers/{employerId}/suspend"
        actor: ClinicAdmin
        preconditions:
          - "Employer is ACTIVE (ERR_EMPLOYER_NOT_ACTIVE)"
        side_effects:
          - "account_status = SUSPENDED; new encounter scheduling is blocked while SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /clinic/employers/{employerId}/reactivate"
        actor: ClinicAdmin
        preconditions:
          - "Employer is SUSPENDED (ERR_EMPLOYER_NOT_SUSPENDED)"
        side_effects:
          - "account_status = ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /clinic/employers/{employerId}/close"
        actor: ClinicAdmin
        preconditions:
          - "Employer is ACTIVE or SUSPENDED (ERR_EMPLOYER_NOT_CLOSABLE)"
          - "outstanding_balance_cents == 0 (ERR_EMPLOYER_HAS_BALANCE)"
          - "No Encounter for this employer in status IN {SCHEDULED, IN_PROGRESS, PENDING_RESULTS} (ERR_OPEN_ENCOUNTERS_EXIST)"
        side_effects:
          - "account_status = CLOSED"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /clinic/employers/{employerId}/close"
        actor: ClinicAdmin
        preconditions:
          - "Employer is ACTIVE or SUSPENDED (ERR_EMPLOYER_NOT_CLOSABLE)"
          - "outstanding_balance_cents == 0 (ERR_EMPLOYER_HAS_BALANCE)"
          - "No Encounter for this employer in status IN {SCHEDULED, IN_PROGRESS, PENDING_RESULTS} (ERR_OPEN_ENCOUNTERS_EXIST)"
        side_effects:
          - "account_status = CLOSED"

  - entity: Protocol
    initial_state: DRAFT
    terminal_states: [RETIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /clinic/protocols/{protocolId}/activate"
        actor: ClinicAdmin
        preconditions:
          - "Protocol is DRAFT (ERR_PROTOCOL_NOT_DRAFT)"
          - "panels is non-empty (ERR_PROTOCOL_EMPTY_PANELS)"
          - "No panel_code appears twice in panels (ERR_DUPLICATE_PANEL_CODE)"
          - "If Employer.dot_regulated is true, panels must include a DRUG_DOT panel (ERR_DOT_PANEL_REQUIRED)"
          - "expected_employer_version matches Employer.version (ERR_STALE_EMPLOYER_VERSION)"
        side_effects:
          - "status = ACTIVE"
          - "Any other ACTIVE protocol for this employer transitions to RETIRED (cascade); its RETIRED side-effects fire"
          - "If Employer.account_status == PROSPECT: Employer -> ACTIVE (cascade)"
          - "Employer.version increments by 1"
      - from: ACTIVE
        to: RETIRED
        trigger: "system (automatic when a newer protocol for the same employer is activated)"
        actor: system
        preconditions:
          - "Protocol is ACTIVE"
        side_effects:
          - "status = RETIRED; protocol no longer selectable for new encounters (existing encounters keep their snapshotted protocol_id)"

  - entity: Encounter
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED, VOIDED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /clinic/encounters/{encounterId}/check-in"
        actor: Clinician
        preconditions:
          - "Encounter is SCHEDULED (ERR_ENCOUNTER_NOT_SCHEDULED)"
          - "Employer.account_status == ACTIVE (ERR_EMPLOYER_NOT_ACTIVE)"
        side_effects:
          - "status = IN_PROGRESS"
      - from: IN_PROGRESS
        to: PENDING_RESULTS
        trigger: "system (automatic when the required child result entity for the encounter_type is created)"
        actor: system
        preconditions:
          - "Encounter is IN_PROGRESS"
          - "The child result entity matching encounter_type has been created (DrugScreen for DRUG_SCREEN, SurveillanceExam for SURVEILLANCE, InjuryCase for INJURY)"
        side_effects:
          - "status = PENDING_RESULTS"
        note: "PHYSICAL encounters skip PENDING_RESULTS and go IN_PROGRESS -> COMPLETED directly via complete."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /clinic/encounters/{encounterId}/complete"
        actor: Clinician
        preconditions:
          - "encounter_type == PHYSICAL (ERR_ENCOUNTER_TYPE_NOT_DIRECT_COMPLETE)"
          - "A Clearance has been issued (ISSUED) for this encounter (ERR_CLEARANCE_REQUIRED)"
        side_effects:
          - "status = COMPLETED"
          - "billable_amount_cents = snapshotted PHYSICAL panel price_cents (calculations.encounter_billable)"
          - "Worker.hire_status updated from the Clearance determination (FIT->CLEARED, NOT_FIT->DISQUALIFIED, FIT_WITH_RESTRICTIONS->CLEARED) — cross-entity cascade"
      - from: PENDING_RESULTS
        to: COMPLETED
        trigger: "POST /clinic/encounters/{encounterId}/complete"
        actor: Clinician
        preconditions:
          - "encounter_type IN {DRUG_SCREEN, SURVEILLANCE, INJURY} (ERR_ENCOUNTER_TYPE_NOT_RESULT_COMPLETE)"
          - "DRUG_SCREEN: DrugScreen.status IN {VERIFIED, CANCELLED} (ERR_DRUG_SCREEN_NOT_VERIFIED)"
          - "SURVEILLANCE: SurveillanceExam.status == FINALIZED (ERR_EXAM_NOT_FINALIZED)"
          - "INJURY: InjuryCase.status == CLOSED (ERR_INJURY_CASE_NOT_CLOSED)"
          - "A Clearance has been issued (ISSUED) for this encounter UNLESS encounter_type == INJURY (ERR_CLEARANCE_REQUIRED)"
        side_effects:
          - "status = COMPLETED"
          - "billable_amount_cents = snapshotted panel price_cents for DRUG_SCREEN/SURVEILLANCE; 0 for INJURY (calculations.encounter_billable)"
          - "For DRUG_SCREEN/SURVEILLANCE with a Clearance: Worker.hire_status cascade as above"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinic/encounters/{encounterId}/cancel"
        actor: Clinician
        preconditions:
          - "Encounter is SCHEDULED or IN_PROGRESS (ERR_ENCOUNTER_NOT_CANCELLABLE)"
        side_effects:
          - "status = CANCELLED; billable_amount_cents stays 0"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /clinic/encounters/{encounterId}/cancel"
        actor: Clinician
        preconditions:
          - "Encounter is SCHEDULED or IN_PROGRESS (ERR_ENCOUNTER_NOT_CANCELLABLE)"
        side_effects:
          - "status = CANCELLED; billable_amount_cents stays 0"
      - from: COMPLETED
        to: VOIDED
        trigger: "POST /clinic/encounters/{encounterId}/void"
        actor: ClinicAdmin
        preconditions:
          - "Encounter is COMPLETED (ERR_ENCOUNTER_NOT_VOIDABLE)"
          - "is_billed == false (ERR_ENCOUNTER_ALREADY_BILLED)"
        side_effects:
          - "status = VOIDED; billable_amount_cents reset to 0"
          - "Any ISSUED Clearance for this encounter -> RESCINDED (cascade)"
          - "Clearance rescission re-evaluates Worker.hire_status: set to CANDIDATE if it had been set from this clearance (transitive cascade)"

  - entity: DrugScreen
    initial_state: AWAITING_COLLECTION
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: AWAITING_COLLECTION
        to: COLLECTED
        trigger: "POST /clinic/custody-events (step=COLLECT)"
        actor: Collector
        preconditions:
          - "DrugScreen is AWAITING_COLLECTION (ERR_DRUG_SCREEN_NOT_AWAITING_COLLECTION)"
          - "step == COLLECT is the canonical first custody step (ERR_CUSTODY_SEQUENCE_VIOLATION otherwise)"
        side_effects:
          - "DrugScreen.status = COLLECTED; a CustodyEvent(step=COLLECT, seq=next) is appended"
      - from: COLLECTED
        to: AT_LAB
        trigger: "POST /clinic/custody-events (step=LAB_RECEIVE)"
        actor: Collector
        preconditions:
          - "DrugScreen is COLLECTED (ERR_DRUG_SCREEN_NOT_COLLECTED)"
          - "Prior custody steps form a valid prefix of [COLLECT, SEAL, SHIP, LAB_RECEIVE]; SEAL/SHIP are optional but may not appear after LAB_RECEIVE (ERR_CUSTODY_SEQUENCE_VIOLATION)"
        side_effects:
          - "DrugScreen.status = AT_LAB; CustodyEvent appended"
        note: "SEAL and SHIP custody events are recorded while COLLECTED and do not change DrugScreen.status; LAB_RECEIVE advances to AT_LAB."
      - from: AT_LAB
        to: LAB_REPORTED
        trigger: "POST /clinic/drug-screens/{drugScreenId}/lab-result"
        actor: Clinician
        preconditions:
          - "DrugScreen is AT_LAB (ERR_DRUG_SCREEN_NOT_AT_LAB)"
          - "lab_result IN {NEGATIVE, NON_NEGATIVE, REJECTED_FOR_TESTING}"
        side_effects:
          - "DrugScreen.status = LAB_REPORTED; lab_result recorded; CustodyEvent(step=LAB_REPORT) appended"
      - from: LAB_REPORTED
        to: MRO_REVIEW
        trigger: "POST /clinic/drug-screens/{drugScreenId}/mro-receive"
        actor: MRO
        preconditions:
          - "DrugScreen is LAB_REPORTED (ERR_DRUG_SCREEN_NOT_LAB_REPORTED)"
          - "X-User-ID == Employer.mro_user_id (ERR_MRO_NOT_ASSIGNED)"
          - "X-User-ID != Encounter.clinician_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "DrugScreen.status = MRO_REVIEW; CustodyEvent(step=MRO_RECEIVE) appended; mro_user_id pinned"
      - from: MRO_REVIEW
        to: VERIFIED
        trigger: "POST /clinic/drug-screens/{drugScreenId}/mro-verify (mro_verified_result != CANCELLED)"
        actor: MRO
        preconditions:
          - "DrugScreen is MRO_REVIEW (ERR_DRUG_SCREEN_NOT_IN_MRO_REVIEW)"
          - "X-User-ID == Employer.mro_user_id (ERR_MRO_NOT_ASSIGNED)"
          - "X-User-ID != Encounter.clinician_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "mro_verified_result IN {NEGATIVE, POSITIVE, REFUSAL}"
          - "If lab_result == NEGATIVE, mro_verified_result must be NEGATIVE (ERR_MRO_RESULT_INCONSISTENT)"
          - "If lab_result == REJECTED_FOR_TESTING, mro_verified_result must be CANCELLED (handled by CANCELLED transition); a non-CANCELLED verify is ERR_MRO_RESULT_INCONSISTENT"
        side_effects:
          - "DrugScreen.status = VERIFIED; mro_verified_result recorded"
      - from: MRO_REVIEW
        to: RECOLLECT_ORDERED
        trigger: "POST /clinic/drug-screens/{drugScreenId}/order-recollection"
        actor: MRO
        preconditions:
          - "DrugScreen is MRO_REVIEW (ERR_DRUG_SCREEN_NOT_IN_MRO_REVIEW)"
          - "X-User-ID == Employer.mro_user_id (ERR_MRO_NOT_ASSIGNED)"
          - "specimen_seal_intact == false OR lab_result == REJECTED_FOR_TESTING (ERR_RECOLLECTION_NOT_JUSTIFIED)"
          - "recollection_count < 2 (ERR_RECOLLECTION_LIMIT_REACHED)"
        side_effects:
          - "DrugScreen.status = RECOLLECT_ORDERED; recollection_count += 1"
      - from: RECOLLECT_ORDERED
        to: AWAITING_COLLECTION
        trigger: "system (automatic immediately after order-recollection)"
        actor: system
        preconditions:
          - "DrugScreen is RECOLLECT_ORDERED"
        side_effects:
          - "DrugScreen.status = AWAITING_COLLECTION; lab_result and mro_verified_result reset to null; custody chain restarts (new CustodyEvents required)"
        note: "Cyclic: a screen may loop AWAITING_COLLECTION -> ... -> MRO_REVIEW -> RECOLLECT_ORDERED -> AWAITING_COLLECTION up to 2 recollections."
      - from: MRO_REVIEW
        to: CANCELLED
        trigger: "POST /clinic/drug-screens/{drugScreenId}/mro-verify (mro_verified_result=CANCELLED)"
        actor: MRO
        preconditions:
          - "DrugScreen is MRO_REVIEW (ERR_DRUG_SCREEN_NOT_IN_MRO_REVIEW)"
          - "X-User-ID == Employer.mro_user_id (ERR_MRO_NOT_ASSIGNED)"
          - "X-User-ID != Encounter.clinician_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "DrugScreen.status = CANCELLED; mro_verified_result = CANCELLED"
        note: "CANCELLED is a verified-equivalent terminal that satisfies encounter completion (DrugScreen.status IN {VERIFIED, CANCELLED})."

  - entity: InjuryCase
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: RTW_PENDING
        trigger: "POST /clinic/work-statuses (disposition IN {MODIFIED_DUTY, OFF_WORK})"
        actor: Clinician
        preconditions:
          - "InjuryCase is OPEN (ERR_INJURY_CASE_NOT_OPEN)"
          - "The new WorkStatus disposition IN {MODIFIED_DUTY, OFF_WORK}"
        side_effects:
          - "InjuryCase.status = RTW_PENDING"
          - "Overlapping prior WorkStatus rows marked superseded (calculations.work_status_supersession)"
          - "is_osha_recordable / osha_column recomputed (calculations.osha_recordability)"
      - from: OPEN
        to: CLOSED
        trigger: "POST /clinic/work-statuses (disposition=FULL_DUTY)"
        actor: Clinician
        preconditions:
          - "InjuryCase is OPEN (ERR_INJURY_CASE_NOT_OPEN)"
          - "The new WorkStatus disposition == FULL_DUTY"
        side_effects:
          - "InjuryCase.status = CLOSED"
          - "Overlapping prior WorkStatus rows marked superseded"
          - "is_osha_recordable / osha_column recomputed"
      - from: RTW_PENDING
        to: CLOSED
        trigger: "POST /clinic/work-statuses (disposition=FULL_DUTY)"
        actor: Clinician
        preconditions:
          - "InjuryCase is RTW_PENDING (ERR_INJURY_CASE_NOT_RTW_PENDING)"
          - "The new WorkStatus disposition == FULL_DUTY"
        side_effects:
          - "InjuryCase.status = CLOSED"
          - "Overlapping prior WorkStatus rows marked superseded (calculations.work_status_supersession)"
          - "is_osha_recordable / osha_column recomputed"
      - from: CLOSED
        to: OPEN
        trigger: "POST /clinic/injury-cases/{injuryCaseId}/reopen"
        actor: Clinician
        preconditions:
          - "InjuryCase is CLOSED (ERR_INJURY_CASE_NOT_CLOSED_FOR_REOPEN)"
          - "The parent Encounter is not COMPLETED/VOIDED (ERR_ENCOUNTER_LOCKED)"
        side_effects:
          - "InjuryCase.status = OPEN"
        note: "Cyclic reopen loop; each reopen permits a new WorkStatus chain."

  - entity: SurveillanceExam
    initial_state: SCHEDULED
    terminal_states: [FINALIZED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RECORDED
        trigger: "POST /clinic/surveillance-exams/{examId}/record"
        actor: Clinician
        preconditions:
          - "SurveillanceExam is SCHEDULED (ERR_EXAM_NOT_SCHEDULED)"
          - "AUDIOMETRIC: baseline_threshold_db and current_threshold_db present (ERR_EXAM_MISSING_MEASUREMENTS)"
          - "RESPIRATOR_FIT: fit_factor and respirator_class present (ERR_EXAM_MISSING_MEASUREMENTS)"
        side_effects:
          - "SurveillanceExam.status = RECORDED; outcome computed (calculations.surveillance_outcome)"
      - from: RECORDED
        to: FINALIZED
        trigger: "POST /clinic/surveillance-exams/{examId}/finalize"
        actor: Clinician
        preconditions:
          - "SurveillanceExam is RECORDED (ERR_EXAM_NOT_RECORDED)"
        side_effects:
          - "SurveillanceExam.status = FINALIZED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /clinic/surveillance-exams/{examId}/cancel"
        actor: Clinician
        preconditions:
          - "SurveillanceExam is SCHEDULED or RECORDED (ERR_EXAM_NOT_CANCELLABLE)"
        side_effects:
          - "SurveillanceExam.status = CANCELLED"
      - from: RECORDED
        to: CANCELLED
        trigger: "POST /clinic/surveillance-exams/{examId}/cancel"
        actor: Clinician
        preconditions:
          - "SurveillanceExam is SCHEDULED or RECORDED (ERR_EXAM_NOT_CANCELLABLE)"
        side_effects:
          - "SurveillanceExam.status = CANCELLED"

  - entity: Clearance
    initial_state: ISSUED
    terminal_states: [RESCINDED]
    transitions:
      - from: ISSUED
        to: RESCINDED
        trigger: "POST /clinic/clearances/{clearanceId}/rescind"
        actor: Clinician
        preconditions:
          - "Clearance is ISSUED (ERR_CLEARANCE_NOT_ISSUED)"
          - "Parent Encounter is not COMPLETED (ERR_ENCOUNTER_LOCKED) — rescission of a completed encounter happens only via Encounter void cascade"
        side_effects:
          - "Clearance.status = RESCINDED"
          - "Worker.hire_status reverts to CANDIDATE if it was set from this clearance (cross-entity cascade)"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /clinic/invoices/{invoiceId}/issue"
        actor: ClinicAdmin
        preconditions:
          - "Invoice is DRAFT (ERR_INVOICE_NOT_DRAFT)"
          - "line_item_encounter_ids is non-empty (ERR_INVOICE_NO_LINE_ITEMS)"
          - "expected_employer_version matches Employer.version (ERR_STALE_EMPLOYER_VERSION)"
        side_effects:
          - "status = ISSUED; issue_date = Employer.current_date; due_date computed"
          - "line-item Encounters get is_billed = true (cascade)"
          - "Employer.outstanding_balance_cents recomputed (calculations.employer_outstanding_balance)"
          - "Employer.version increments by 1"
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: "POST /clinic/invoices/{invoiceId}/payments (paid_cents + amount_cents < total_cents)"
        actor: ClinicAdmin
        preconditions:
          - "Invoice is ISSUED or OVERDUE or PARTIALLY_PAID (ERR_INVOICE_NOT_PAYABLE)"
          - "amount_cents > 0 and paid_cents + amount_cents <= total_cents (ERR_PAYMENT_EXCEEDS_BALANCE)"
          - "paid_cents + amount_cents < total_cents (else PAID transition)"
        side_effects:
          - "paid_cents += amount_cents; status = PARTIALLY_PAID; Employer.outstanding_balance_cents recomputed"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /clinic/invoices/{invoiceId}/payments (paid_cents + amount_cents == total_cents)"
        actor: ClinicAdmin
        preconditions:
          - "Invoice is ISSUED or OVERDUE or PARTIALLY_PAID (ERR_INVOICE_NOT_PAYABLE)"
          - "paid_cents + amount_cents == total_cents (final payment)"
        side_effects:
          - "paid_cents = total_cents; status = PAID; Employer.outstanding_balance_cents recomputed (this invoice drops out)"
      - from: ISSUED
        to: PAID
        trigger: "POST /clinic/invoices/{invoiceId}/payments (amount_cents == total_cents)"
        actor: ClinicAdmin
        preconditions:
          - "Invoice is ISSUED or OVERDUE (ERR_INVOICE_NOT_PAYABLE)"
          - "amount_cents == total_cents (single full payment)"
        side_effects:
          - "paid_cents = total_cents; status = PAID; Employer.outstanding_balance_cents recomputed"
      - from: ISSUED
        to: OVERDUE
        trigger: "system (automatic on /_clock/set when Employer.current_date > due_date and invoice not fully paid)"
        actor: system
        preconditions:
          - "Invoice is ISSUED or PARTIALLY_PAID and Employer.current_date > due_date"
        side_effects:
          - "status = OVERDUE (PARTIALLY_PAID overdue invoices also flip to OVERDUE while retaining paid_cents); outstanding_balance unchanged (OVERDUE still counted)"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /clinic/invoices/{invoiceId}/void"
        actor: ClinicAdmin
        preconditions:
          - "Invoice is DRAFT (ERR_INVOICE_NOT_VOIDABLE)"
        side_effects:
          - "status = VOIDED"

# =============================================================================
# Concurrency Rules (§1.2.1) — true races only, OCC-resolved
# =============================================================================
concurrency_rules:
  - rule_id: protocol-activate-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /clinic/protocols/{protocolId}/activate"
    occ_field: "expected_employer_version"
    description: |
      Activating a Protocol against an Employer whose version has advanced since
      the client last observed it is rejected with a stale-version error. A
      protocol activation legitimately supersedes any prior ACTIVE protocol and
      flips the Employer from PROSPECT to ACTIVE (both bump Employer.version), so
      a second activation that carries an outdated expected_employer_version is
      operating on a stale view of the employer and is refused.
    error_id: ERR_STALE_EMPLOYER_VERSION
    http_status: 412

  - rule_id: invoice-issue-stale-employer
    parent_entity: Employer
    write_endpoint: "POST /clinic/invoices/{invoiceId}/issue"
    occ_field: "expected_employer_version"
    description: |
      Issuing an Invoice against an Employer whose version has advanced since the
      client last observed it is rejected with a stale-version error. Issuing an
      invoice marks line-item encounters billed and recomputes the employer's
      outstanding_balance_cents (bumping Employer.version); a later issue whose
      expected_employer_version is outdated would consume encounters a prior issue
      already billed, so it is refused on the stale version.
    error_id: ERR_STALE_EMPLOYER_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: osha_recordability
    trigger: "InjuryCase creation, every work-status transition, and any update to treatment_level/days_away/days_restricted"
    algorithm: threshold
    formula: |
      Determine is_osha_recordable and osha_column from treatment_level, days_away, days_restricted.
      Precedence (evaluate top-down; FIRST match wins — this fixed order is the difficulty):
        1. if treatment_level == FATALITY: is_osha_recordable = true; osha_column = DEATH
        2. elif days_away >= 1: is_osha_recordable = true; osha_column = DAYS_AWAY
        3. elif days_restricted >= 1 OR treatment_level == RESTRICTED_DUTY: is_osha_recordable = true; osha_column = RESTRICTED_TRANSFER
        4. elif treatment_level == MEDICAL_TREATMENT: is_osha_recordable = true; osha_column = OTHER_RECORDABLE
        5. elif treatment_level == LOST_TIME (with days_away == 0): is_osha_recordable = true; osha_column = OTHER_RECORDABLE
        6. else (treatment_level == FIRST_AID): is_osha_recordable = false; osha_column = NOT_RECORDABLE
      DAYS_AWAY outranks RESTRICTED_TRANSFER even when BOTH days_away>=1 and days_restricted>=1
      (an injury with both away and restricted days is logged in the DAYS_AWAY column per OSHA hierarchy).
    constants:
      MIN_AWAY_DAYS: 1
      MIN_RESTRICTED_DAYS: 1
    precision: "integer day counts; boolean/enum outputs"
    variants:
      - name: away_dominates_restricted
        when: "days_away >= 1 AND days_restricted >= 1"
        difference: "osha_column = DAYS_AWAY (not RESTRICTED_TRANSFER); the more-severe column wins."

  - name: encounter_billable
    trigger: "Encounter completion (any path to COMPLETED) and Encounter void"
    algorithm: aggregation
    formula: |
      On COMPLETED:
        if encounter_type == INJURY: billable_amount_cents = 0
        else: billable_amount_cents = price_cents of the panel in the encounter's SNAPSHOTTED Protocol
              (protocol_id pinned at scheduling) whose panel_code == Encounter.panel_code.
      On VOIDED: billable_amount_cents = 0.
      Use the snapshotted protocol_id, NOT the employer's current ACTIVE protocol — a later
      protocol activation that re-prices the same panel_code MUST NOT change an already-snapshotted price.
    precision: "integer cents"
    variants:
      - name: snapshot_vs_current_pricing
        when: "the employer activated a newer Protocol (different price_cents for the same panel_code) after the encounter was scheduled"
        difference: "billable uses the snapshotted protocol price, not the new ACTIVE protocol price; the two diverge for identical panel_code."

  - name: invoice_total
    trigger: "Invoice draft creation"
    algorithm: tiered_pricing
    formula: |
      Step 1 — line item selection (input set): include every Encounter for the employer where
        status == COMPLETED
        AND is_billed == false
        AND billable_amount_cents > 0
        AND the encounter's COMPLETED date (the date portion of updated_at at completion) is within
            [period_start, period_end] inclusive.
        Selection order is created_at ASC (never id).
      Step 2 — subtotal_cents = sum of billable_amount_cents over selected encounters.
      Step 3 — volume discount tier on the COUNT of selected line items n (not the subtotal):
        n < 5        -> discount_rate = 0.00
        5 <= n < 10  -> discount_rate = 0.05
        n >= 10      -> discount_rate = 0.10
        discount_cents = round_half_up(subtotal_cents * discount_rate)   # round the discount ONCE
      Step 4 — total_cents = subtotal_cents - discount_cents.
      Rounding order is pinned: compute discount_cents by rounding subtotal*rate ONCE, then subtract;
      do NOT round per-line-item. This is the only sanctioned order.
    constants:
      TIER1_MIN: 5
      TIER1_RATE: 0.05
      TIER2_MIN: 10
      TIER2_RATE: 0.10
    precision: "integer cents, round_half_up on the single discount computation"
    variants:
      - name: count_tier_boundary
        when: "exactly 5 vs 4 line items, or exactly 10 vs 9"
        difference: "discount tier is keyed on >= boundaries on the COUNT; 5 items -> 5%, 4 items -> 0%; 10 items -> 10%, 9 items -> 5%."

  - name: surveillance_outcome
    trigger: "SurveillanceExam record transition"
    algorithm: threshold
    formula: |
      AUDIOMETRIC (Standard Threshold Shift):
        shift_db = current_threshold_db - baseline_threshold_db
        if shift_db >= STS_THRESHOLD_DB: outcome = STS
        else: outcome = PASS    (negative or zero shift is PASS)
      RESPIRATOR_FIT:
        required = (HALF_MASK -> HALF_MASK_MIN_FF, FULL_FACEPIECE -> FULL_FACEPIECE_MIN_FF)
        if fit_factor >= required: outcome = PASS
        else: outcome = FAIL
    constants:
      STS_THRESHOLD_DB: 10
      HALF_MASK_MIN_FF: 100
      FULL_FACEPIECE_MIN_FF: 500
    precision: "integer dB / integer fit factor"
    variants:
      - name: sts_boundary
        when: "shift_db == 10 vs 9"
        difference: "shift_db == 10 -> STS (>= boundary); shift_db == 9 -> PASS."

  - name: work_status_supersession
    trigger: "WorkStatus creation on an InjuryCase"
    algorithm: interval_merge
    formula: |
      A new WorkStatus W on a case supersedes every existing non-superseded WorkStatus X on the
      SAME case whose [valid_from, valid_to] CLOSED interval overlaps W's [valid_from, valid_to].
      Overlap (closed intervals): X.valid_from <= W.valid_to AND W.valid_from <= X.valid_to.
      Intervals that merely touch at a single endpoint DO overlap under closed-interval semantics
      (X.valid_to == W.valid_from counts as overlap). For each such X: X.superseded = true.
      W itself is never superseded at creation. Processing order of existing rows: created_at ASC.
    precision: "calendar-date interval arithmetic, inclusive endpoints (closed)"
    variants:
      - name: touch_at_endpoint
        when: "X.valid_to == W.valid_from (intervals share exactly one boundary day)"
        difference: "closed-interval semantics treat shared-endpoint as overlap -> X superseded; half-open semantics would not."

  - name: employer_outstanding_balance
    trigger: "Invoice issue, payment, void, and clock-driven overdue flips"
    algorithm: aggregation
    formula: |
      outstanding_balance_cents = sum over the employer's Invoices with
        status IN {ISSUED, OVERDUE, PARTIALLY_PAID}
        of (total_cents - paid_cents).
      DRAFT, VOIDED, and PAID invoices contribute 0.
    precision: "integer cents"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: all resource endpoints

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys (employer_id, worker_id, encounter_id, injury_case_id, drug_screen_id) exist and are consistent (worker belongs to the body employer; child's encounter belongs to the same employer)"
    error_id: ERR_CROSS_EMPLOYER_REFERENCE
    http_status: 404
    applies_to: "POST encounters, drug-screens, injury-cases, surveillance-exams, work-statuses, clearances, invoices, custody-events"

  - priority: 5
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numbers non-negative, intervals valid_from <= valid_to, FIT_WITH_RESTRICTIONS has restriction_text"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PUT with a body"

  - priority: 6
    category: concurrency
    check: "expected_employer_version (when the endpoint requires it) matches Employer.version"
    error_id: ERR_STALE_EMPLOYER_VERSION
    http_status: 412
    applies_to: "POST protocols/{id}/activate, POST invoices/{id}/issue"
    note: "OCC check runs AFTER existence/auth/body-shape but BEFORE state preconditions and business rules."

  - priority: 7
    category: state
    check: "Target resource is in the correct state for the requested transition"
    error_id: "ERR_{RESOURCE}_NOT_{EXPECTED_STATE}"
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 8
    category: business_safety
    check: "Chain-of-custody steps must follow the canonical sequence prefix; out-of-order custody steps rejected"
    error_id: ERR_CUSTODY_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST custody-events"

  - priority: 9
    category: business_safety
    check: "MRO acting on a drug screen must equal the employer's assigned mro_user_id"
    error_id: ERR_MRO_NOT_ASSIGNED
    http_status: 403
    applies_to: "POST drug-screens/{id}/mro-receive, /mro-verify, /order-recollection"

  - priority: 10
    category: business_safety
    check: "Segregation of duties: the MRO acting on a drug screen must differ from the encounter's clinician_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST drug-screens/{id}/mro-receive, /mro-verify"

  - priority: 11
    category: business_referential
    check: "Encounter creation: encounter_type vs panel_code consistency (INJURY has no panel_code; PHYSICAL->PHYSICAL; DRUG_SCREEN->DRUG_DOT|DRUG_NON_DOT; SURVEILLANCE->AUDIOMETRIC|RESPIRATOR_FIT) and panel_code must exist in the employer's ACTIVE protocol panels"
    error_id: ERR_PANEL_NOT_IN_PROTOCOL
    http_status: 409
    applies_to: "POST encounters"

  - priority: 12
    category: business_referential
    check: "Encounter creation: worker.job_category must match the chosen panel's required_for_job_category (skipped for INJURY)"
    error_id: ERR_JOB_CATEGORY_PANEL_MISMATCH
    http_status: 409
    applies_to: "POST encounters"

  - priority: 13
    category: business_constraint
    check: "DOT drug screen: a DRUG_DOT encounter is only schedulable when Employer.dot_regulated == true"
    error_id: ERR_DOT_NOT_ALLOWED
    http_status: 409
    applies_to: "POST encounters (panel_code=DRUG_DOT)"

  - priority: 14
    category: business_temporal
    check: "SURVEILLANCE recheck window: a prior FINALIZED SurveillanceExam of the same exam_kind for the same worker within recheck_interval_days (relative to employer current_date) blocks scheduling a new one too early"
    error_id: ERR_SURVEILLANCE_TOO_EARLY
    http_status: 409
    applies_to: "POST encounters (encounter_type=SURVEILLANCE)"

  - priority: 15
    category: business_fiscal
    check: "Invoice payment must not exceed remaining balance (paid_cents + amount_cents <= total_cents) and amount_cents > 0"
    error_id: ERR_PAYMENT_EXCEEDS_BALANCE
    http_status: 402
    applies_to: "POST invoices/{id}/payments"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving) ---
  - method: POST
    path: "/_clock/set"
    description: "Set an employer's deterministic current_date; evaluates clock-driven overdue flips on the employer's invoices"
    roles: [ClinicAdmin]
    code: 200
    input: [employer_id, to_iso8601]
    output: Employer
    side_effects: ["Employer.current_date = to_iso8601", "Invoices ISSUED/PARTIALLY_PAID with current_date > due_date flip to OVERDUE", "Employer.version increments by 1"]

  # --- Employers ---
  - method: POST
    path: "/clinic/employers"
    description: "Create an Employer (account)"
    roles: [ClinicAdmin]
    code: 201
    input: [legal_name, "dot_regulated?", mro_user_id, "net_terms_days?", "current_date?"]
    output: Employer
    side_effects: ["account_status = PROSPECT", "current_date defaults to 1970-01-01 if omitted"]

  - method: GET
    path: "/clinic/employers"
    description: "List employers (paginated)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: "Employer[]"
    side_effects: []

  - method: GET
    path: "/clinic/employers/{employerId}"
    description: "Get an employer"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: Employer
    side_effects: []

  - method: POST
    path: "/clinic/employers/{employerId}/suspend"
    description: "Suspend an employer account"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: ["account_status = SUSPENDED"]

  - method: POST
    path: "/clinic/employers/{employerId}/reactivate"
    description: "Reactivate a suspended employer"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: ["account_status = ACTIVE"]

  - method: POST
    path: "/clinic/employers/{employerId}/close"
    description: "Close an employer account"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: ["account_status = CLOSED"]

  # --- Protocols ---
  - method: POST
    path: "/clinic/protocols"
    description: "Create a DRAFT protocol with panels"
    roles: [ClinicAdmin]
    code: 201
    input: [employer_id, effective_date, panels]
    output: Protocol
    side_effects: ["status = DRAFT"]

  - method: GET
    path: "/clinic/protocols"
    description: "List protocols (filter by employer_id, status)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: ["employer_id?", "status?"]
    output: "Protocol[]"
    side_effects: []

  - method: GET
    path: "/clinic/protocols/{protocolId}"
    description: "Get a protocol"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: Protocol
    side_effects: []

  - method: POST
    path: "/clinic/protocols/{protocolId}/activate"
    description: "Activate a draft protocol (retires the prior active one; activates the employer)"
    roles: [ClinicAdmin]
    code: 200
    input: [expected_employer_version]
    output: Protocol
    side_effects: ["status = ACTIVE", "prior ACTIVE protocol -> RETIRED", "Employer PROSPECT -> ACTIVE", "Employer.version increments by 1"]

  # --- Workers ---
  - method: POST
    path: "/clinic/workers"
    description: "Create a worker"
    roles: [ClinicAdmin, Clinician]
    code: 201
    input: [employer_id, full_name, job_category, dob]
    output: Worker
    side_effects: ["hire_status = CANDIDATE"]

  - method: GET
    path: "/clinic/workers"
    description: "List workers (filter by employer_id, job_category)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: ["employer_id?", "job_category?"]
    output: "Worker[]"
    side_effects: []

  - method: GET
    path: "/clinic/workers/{workerId}"
    description: "Get a worker"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: Worker
    side_effects: []

  # --- Encounters ---
  - method: POST
    path: "/clinic/encounters"
    description: "Schedule an encounter; snapshots the active protocol"
    roles: [ClinicAdmin, Clinician]
    code: 201
    input: [employer_id, worker_id, encounter_type, "panel_code?"]
    output: Encounter
    side_effects: ["status = SCHEDULED", "protocol_id snapshotted from the employer's ACTIVE protocol", "clinician_user_id pinned from X-User-ID"]

  - method: GET
    path: "/clinic/encounters"
    description: "List encounters (filter by employer_id, worker_id, protocol_id, status, encounter_type)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: ["employer_id?", "worker_id?", "protocol_id?", "status?", "encounter_type?"]
    output: "Encounter[]"
    side_effects: []

  - method: GET
    path: "/clinic/encounters/{encounterId}"
    description: "Get an encounter"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: Encounter
    side_effects: []

  - method: POST
    path: "/clinic/encounters/{encounterId}/check-in"
    description: "Check in (SCHEDULED -> IN_PROGRESS)"
    roles: [Clinician]
    code: 200
    input: []
    output: Encounter
    side_effects: ["status = IN_PROGRESS"]

  - method: POST
    path: "/clinic/encounters/{encounterId}/complete"
    description: "Complete an encounter; computes billable amount and cascades hire_status"
    roles: [Clinician]
    code: 200
    input: []
    output: Encounter
    side_effects: ["status = COMPLETED", "billable_amount_cents computed (calculations.encounter_billable)", "Worker.hire_status cascade from clearance"]

  - method: POST
    path: "/clinic/encounters/{encounterId}/cancel"
    description: "Cancel an encounter"
    roles: [Clinician]
    code: 200
    input: []
    output: Encounter
    side_effects: ["status = CANCELLED"]

  - method: POST
    path: "/clinic/encounters/{encounterId}/void"
    description: "Void a completed, unbilled encounter; rescinds clearance and reverts hire_status"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Encounter
    side_effects: ["status = VOIDED", "billable_amount_cents = 0", "Clearance -> RESCINDED", "Worker.hire_status -> CANDIDATE if set from this clearance"]

  # --- Clearances ---
  - method: POST
    path: "/clinic/clearances"
    description: "Issue a fit-for-duty clearance for an encounter"
    roles: [Clinician]
    code: 201
    input: [encounter_id, determination, "restriction_text?"]
    output: Clearance
    side_effects: ["status = ISSUED", "worker_id/employer_id denormalized from the encounter"]

  - method: GET
    path: "/clinic/clearances"
    description: "List clearances (filter by encounter_id, employer_id, worker_id)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: ["encounter_id?", "employer_id?", "worker_id?"]
    output: "Clearance[]"
    side_effects: []

  - method: GET
    path: "/clinic/clearances/{clearanceId}"
    description: "Get a clearance"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: Clearance
    side_effects: []

  - method: POST
    path: "/clinic/clearances/{clearanceId}/rescind"
    description: "Rescind an issued clearance (reverts hire_status)"
    roles: [Clinician]
    code: 200
    input: []
    output: Clearance
    side_effects: ["status = RESCINDED", "Worker.hire_status -> CANDIDATE if set from this clearance"]

  # --- Drug screens ---
  - method: POST
    path: "/clinic/drug-screens"
    description: "Create the drug screen for a DRUG_SCREEN encounter (transitions encounter to PENDING_RESULTS)"
    roles: [Clinician, Collector]
    code: 201
    input: [encounter_id, specimen_seal_intact]
    output: DrugScreen
    side_effects: ["status = AWAITING_COLLECTION", "is_dot derived from panel_code", "employer_id denormalized", "Encounter -> PENDING_RESULTS"]

  - method: GET
    path: "/clinic/drug-screens"
    description: "List drug screens (filter by encounter_id, employer_id, status)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: ["encounter_id?", "employer_id?", "status?"]
    output: "DrugScreen[]"
    side_effects: []

  - method: GET
    path: "/clinic/drug-screens/{drugScreenId}"
    description: "Get a drug screen"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: DrugScreen
    side_effects: []

  - method: POST
    path: "/clinic/custody-events"
    description: "Append a chain-of-custody event; drives COLLECTED/AT_LAB transitions"
    roles: [Collector]
    code: 201
    input: [drug_screen_id, step, "note?"]
    output: CustodyEvent
    side_effects: ["CustodyEvent appended with next seq", "DrugScreen status advances per custody step"]

  - method: GET
    path: "/clinic/custody-events"
    description: "List chain-of-custody events (filter by drug_screen_id; ordered by seq)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: ["drug_screen_id?"]
    output: "CustodyEvent[]"
    side_effects: []

  - method: GET
    path: "/clinic/custody-events/{custodyEventId}"
    description: "Get a single chain-of-custody event"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: CustodyEvent
    side_effects: []

  - method: POST
    path: "/clinic/drug-screens/{drugScreenId}/lab-result"
    description: "Record the lab result (AT_LAB -> LAB_REPORTED)"
    roles: [Clinician]
    code: 200
    input: [lab_result]
    output: DrugScreen
    side_effects: ["status = LAB_REPORTED", "lab_result recorded", "CustodyEvent(LAB_REPORT) appended"]

  - method: POST
    path: "/clinic/drug-screens/{drugScreenId}/mro-receive"
    description: "MRO receives the screen (LAB_REPORTED -> MRO_REVIEW)"
    roles: [MRO]
    code: 200
    input: []
    output: DrugScreen
    side_effects: ["status = MRO_REVIEW", "mro_user_id pinned", "CustodyEvent(MRO_RECEIVE) appended"]

  - method: POST
    path: "/clinic/drug-screens/{drugScreenId}/mro-verify"
    description: "MRO final determination (MRO_REVIEW -> VERIFIED or CANCELLED)"
    roles: [MRO]
    code: 200
    input: [mro_verified_result]
    output: DrugScreen
    side_effects: ["status = VERIFIED or CANCELLED", "mro_verified_result recorded"]

  - method: POST
    path: "/clinic/drug-screens/{drugScreenId}/order-recollection"
    description: "MRO orders recollection (MRO_REVIEW -> RECOLLECT_ORDERED -> AWAITING_COLLECTION)"
    roles: [MRO]
    code: 200
    input: []
    output: DrugScreen
    side_effects: ["recollection_count += 1", "status reset to AWAITING_COLLECTION", "lab_result/mro_verified_result reset to null"]

  # --- Injury cases ---
  - method: POST
    path: "/clinic/injury-cases"
    description: "Create the injury case for an INJURY encounter (transitions encounter to PENDING_RESULTS)"
    roles: [Clinician]
    code: 201
    input: [encounter_id, injury_date, treatment_level, "days_away?", "days_restricted?"]
    output: InjuryCase
    side_effects: ["status = OPEN", "is_osha_recordable/osha_column computed", "employer_id denormalized", "Encounter -> PENDING_RESULTS"]

  - method: GET
    path: "/clinic/injury-cases"
    description: "List injury cases (filter by encounter_id, employer_id, status)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: ["encounter_id?", "employer_id?", "status?"]
    output: "InjuryCase[]"
    side_effects: []

  - method: GET
    path: "/clinic/injury-cases/{injuryCaseId}"
    description: "Get an injury case"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: InjuryCase
    side_effects: []

  - method: POST
    path: "/clinic/injury-cases/{injuryCaseId}/reopen"
    description: "Reopen a closed injury case"
    roles: [Clinician]
    code: 200
    input: []
    output: InjuryCase
    side_effects: ["status = OPEN"]

  # --- Work statuses ---
  - method: POST
    path: "/clinic/work-statuses"
    description: "Add a work-status / return-to-work note; supersedes overlapping prior notes; drives case status"
    roles: [Clinician]
    code: 201
    input: [injury_case_id, disposition, "restriction_text?", valid_from, valid_to]
    output: WorkStatus
    side_effects: ["overlapping prior WorkStatus rows marked superseded", "InjuryCase status transition per disposition", "is_osha_recordable recomputed"]

  - method: GET
    path: "/clinic/work-statuses"
    description: "List work statuses (filter by injury_case_id, employer_id; ordered by created_at)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: ["injury_case_id?", "employer_id?"]
    output: "WorkStatus[]"
    side_effects: []

  - method: GET
    path: "/clinic/work-statuses/{workStatusId}"
    description: "Get a work status"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: WorkStatus
    side_effects: []

  # --- Surveillance exams ---
  - method: POST
    path: "/clinic/surveillance-exams"
    description: "Create the surveillance exam for a SURVEILLANCE encounter (transitions encounter to PENDING_RESULTS)"
    roles: [Clinician]
    code: 201
    input: [encounter_id, "baseline_threshold_db?", "current_threshold_db?", "fit_factor?", "respirator_class?"]
    output: SurveillanceExam
    side_effects: ["status = SCHEDULED", "exam_kind derived from panel_code", "worker_id/employer_id denormalized", "Encounter -> PENDING_RESULTS"]

  - method: GET
    path: "/clinic/surveillance-exams"
    description: "List surveillance exams (filter by encounter_id, employer_id, worker_id, status)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: ["encounter_id?", "employer_id?", "worker_id?", "status?"]
    output: "SurveillanceExam[]"
    side_effects: []

  - method: GET
    path: "/clinic/surveillance-exams/{examId}"
    description: "Get a surveillance exam"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: SurveillanceExam
    side_effects: []

  - method: POST
    path: "/clinic/surveillance-exams/{examId}/record"
    description: "Record measurements and compute outcome (SCHEDULED -> RECORDED)"
    roles: [Clinician]
    code: 200
    input: []
    output: SurveillanceExam
    side_effects: ["status = RECORDED", "outcome computed (calculations.surveillance_outcome)"]

  - method: POST
    path: "/clinic/surveillance-exams/{examId}/finalize"
    description: "Finalize a recorded exam (RECORDED -> FINALIZED)"
    roles: [Clinician]
    code: 200
    input: []
    output: SurveillanceExam
    side_effects: ["status = FINALIZED"]

  - method: POST
    path: "/clinic/surveillance-exams/{examId}/cancel"
    description: "Cancel a surveillance exam"
    roles: [Clinician]
    code: 200
    input: []
    output: SurveillanceExam
    side_effects: ["status = CANCELLED"]

  # --- Invoices ---
  - method: POST
    path: "/clinic/invoices"
    description: "Create a DRAFT invoice for a billing period; auto-selects line items and computes totals"
    roles: [ClinicAdmin]
    code: 201
    input: [employer_id, period_start, period_end]
    output: Invoice
    side_effects: ["status = DRAFT", "line items selected", "subtotal/discount/total computed (calculations.invoice_total)"]

  - method: GET
    path: "/clinic/invoices"
    description: "List invoices (filter by employer_id, status)"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: ["employer_id?", "status?"]
    output: "Invoice[]"
    side_effects: []

  - method: GET
    path: "/clinic/invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [ClinicAdmin, Clinician, Collector, MRO]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/clinic/invoices/{invoiceId}/issue"
    description: "Issue a draft invoice; marks line-item encounters billed (OCC on employer)"
    roles: [ClinicAdmin]
    code: 200
    input: [expected_employer_version]
    output: Invoice
    side_effects: ["status = ISSUED", "issue_date/due_date set", "line-item encounters is_billed = true", "Employer.outstanding_balance_cents/version recomputed"]

  - method: POST
    path: "/clinic/invoices/{invoiceId}/payments"
    description: "Apply a payment to an invoice"
    roles: [ClinicAdmin]
    code: 200
    input: [amount_cents]
    output: Invoice
    side_effects: ["paid_cents += amount_cents", "status PARTIALLY_PAID or PAID", "Employer.outstanding_balance_cents recomputed"]

  - method: POST
    path: "/clinic/invoices/{invoiceId}/void"
    description: "Void a draft invoice"
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status = VOIDED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }

  # --- Not found ---
  - { id: ERR_EMPLOYER_NOT_FOUND, http: 404, condition: "Employer id not found" }
  - { id: ERR_PROTOCOL_NOT_FOUND, http: 404, condition: "Protocol id not found" }
  - { id: ERR_WORKER_NOT_FOUND, http: 404, condition: "Worker id not found" }
  - { id: ERR_ENCOUNTER_NOT_FOUND, http: 404, condition: "Encounter id not found" }
  - { id: ERR_DRUG_SCREEN_NOT_FOUND, http: 404, condition: "Drug screen id not found" }
  - { id: ERR_INJURY_CASE_NOT_FOUND, http: 404, condition: "Injury case id not found" }
  - { id: ERR_SURVEILLANCE_EXAM_NOT_FOUND, http: 404, condition: "Surveillance exam id not found" }
  - { id: ERR_WORK_STATUS_NOT_FOUND, http: 404, condition: "Work status id not found" }
  - { id: ERR_CLEARANCE_NOT_FOUND, http: 404, condition: "Clearance id not found" }
  - { id: ERR_INVOICE_NOT_FOUND, http: 404, condition: "Invoice id not found" }
  - { id: ERR_CROSS_EMPLOYER_REFERENCE, http: 404, condition: "A body-referenced resource (worker/encounter/injury-case/drug-screen) is missing or not consistent with the body employer" }

  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum, negative number, valid_from > valid_to, or missing restriction_text on FIT_WITH_RESTRICTIONS/MODIFIED_DUTY" }
  - { id: ERR_PANEL_NOT_IN_PROTOCOL, http: 409, condition: "encounter_type/panel_code mismatch or panel_code absent from the active protocol" }
  - { id: ERR_JOB_CATEGORY_PANEL_MISMATCH, http: 409, condition: "Worker job_category does not match the panel's required_for_job_category" }
  - { id: ERR_MRO_RESULT_INCONSISTENT, http: 409, condition: "MRO verified result inconsistent with the lab result" }
  - { id: ERR_RECOLLECTION_NOT_JUSTIFIED, http: 409, condition: "Recollection ordered without seal break or REJECTED_FOR_TESTING" }

  # --- Concurrency ---
  - { id: ERR_STALE_EMPLOYER_VERSION, http: 412, condition: "expected_employer_version does not match Employer.version" }

  # --- Employer state ---
  - { id: ERR_EMPLOYER_NOT_ACTIVE, http: 409, condition: "Employer not ACTIVE for the requested operation" }
  - { id: ERR_EMPLOYER_NOT_SUSPENDED, http: 409, condition: "Employer not SUSPENDED for reactivate" }
  - { id: ERR_EMPLOYER_NOT_CLOSABLE, http: 409, condition: "Employer not ACTIVE/SUSPENDED for close" }
  - { id: ERR_EMPLOYER_HAS_BALANCE, http: 409, condition: "Employer has non-zero outstanding_balance_cents at close" }
  - { id: ERR_OPEN_ENCOUNTERS_EXIST, http: 409, condition: "Open encounters exist at employer close" }

  # --- Protocol state ---
  - { id: ERR_PROTOCOL_NOT_DRAFT, http: 409, condition: "Protocol not DRAFT for activate" }
  - { id: ERR_PROTOCOL_EMPTY_PANELS, http: 409, condition: "Protocol has no panels at activate" }
  - { id: ERR_DUPLICATE_PANEL_CODE, http: 409, condition: "A panel_code appears twice in protocol panels" }
  - { id: ERR_DOT_PANEL_REQUIRED, http: 409, condition: "DOT-regulated employer protocol lacks a DRUG_DOT panel" }

  # --- Encounter state ---
  - { id: ERR_ENCOUNTER_NOT_SCHEDULED, http: 409, condition: "Encounter not SCHEDULED for check-in" }
  - { id: ERR_ENCOUNTER_NOT_CANCELLABLE, http: 409, condition: "Encounter not in a cancellable state" }
  - { id: ERR_ENCOUNTER_NOT_VOIDABLE, http: 409, condition: "Encounter not COMPLETED for void" }
  - { id: ERR_ENCOUNTER_ALREADY_BILLED, http: 409, condition: "Encounter already billed; cannot void" }
  - { id: ERR_ENCOUNTER_TYPE_NOT_DIRECT_COMPLETE, http: 409, condition: "Non-PHYSICAL encounter cannot complete directly from IN_PROGRESS" }
  - { id: ERR_ENCOUNTER_TYPE_NOT_RESULT_COMPLETE, http: 409, condition: "PHYSICAL encounter cannot complete from PENDING_RESULTS" }
  - { id: ERR_CLEARANCE_REQUIRED, http: 409, condition: "No ISSUED clearance for an encounter that requires one before completion" }
  - { id: ERR_ENCOUNTER_LOCKED, http: 409, condition: "Parent encounter is COMPLETED/VOIDED and locks child mutations" }

  # --- Drug screen state / custody ---
  - { id: ERR_DRUG_SCREEN_NOT_AWAITING_COLLECTION, http: 409, condition: "Screen not AWAITING_COLLECTION for COLLECT" }
  - { id: ERR_DRUG_SCREEN_NOT_COLLECTED, http: 409, condition: "Screen not COLLECTED for LAB_RECEIVE" }
  - { id: ERR_DRUG_SCREEN_NOT_AT_LAB, http: 409, condition: "Screen not AT_LAB for lab-result" }
  - { id: ERR_DRUG_SCREEN_NOT_LAB_REPORTED, http: 409, condition: "Screen not LAB_REPORTED for mro-receive" }
  - { id: ERR_DRUG_SCREEN_NOT_IN_MRO_REVIEW, http: 409, condition: "Screen not MRO_REVIEW for mro-verify/order-recollection" }
  - { id: ERR_DRUG_SCREEN_NOT_VERIFIED, http: 409, condition: "Screen not VERIFIED/CANCELLED at encounter completion" }
  - { id: ERR_CUSTODY_SEQUENCE_VIOLATION, http: 409, condition: "Custody step out of canonical sequence" }
  - { id: ERR_MRO_NOT_ASSIGNED, http: 403, condition: "Acting MRO is not the employer's assigned mro_user_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "MRO equals the encounter clinician (segregation of duties violation)" }
  - { id: ERR_RECOLLECTION_LIMIT_REACHED, http: 409, condition: "recollection_count already at 2" }

  # --- Injury / work status state ---
  - { id: ERR_INJURY_CASE_NOT_OPEN, http: 409, condition: "Injury case not OPEN" }
  - { id: ERR_INJURY_CASE_NOT_RTW_PENDING, http: 409, condition: "Injury case not RTW_PENDING" }
  - { id: ERR_INJURY_CASE_NOT_CLOSED, http: 409, condition: "Injury case not CLOSED at encounter completion" }
  - { id: ERR_INJURY_CASE_NOT_CLOSED_FOR_REOPEN, http: 409, condition: "Injury case not CLOSED for reopen" }

  # --- Surveillance state / temporal ---
  - { id: ERR_EXAM_NOT_SCHEDULED, http: 409, condition: "Exam not SCHEDULED for record" }
  - { id: ERR_EXAM_NOT_RECORDED, http: 409, condition: "Exam not RECORDED for finalize" }
  - { id: ERR_EXAM_NOT_FINALIZED, http: 409, condition: "Exam not FINALIZED at encounter completion" }
  - { id: ERR_EXAM_NOT_CANCELLABLE, http: 409, condition: "Exam not in a cancellable state" }
  - { id: ERR_EXAM_MISSING_MEASUREMENTS, http: 409, condition: "Required measurements absent for the exam kind at record" }
  - { id: ERR_SURVEILLANCE_TOO_EARLY, http: 409, condition: "Surveillance recheck scheduled before recheck_interval_days elapsed" }
  - { id: ERR_DOT_NOT_ALLOWED, http: 409, condition: "DRUG_DOT encounter for a non-DOT-regulated employer" }

  # --- Clearance state ---
  - { id: ERR_CLEARANCE_NOT_ISSUED, http: 409, condition: "Clearance not ISSUED for rescind" }

  # --- Invoice state / fiscal ---
  - { id: ERR_INVOICE_NOT_DRAFT, http: 409, condition: "Invoice not DRAFT for issue" }
  - { id: ERR_INVOICE_NO_LINE_ITEMS, http: 409, condition: "Invoice has no line items at issue" }
  - { id: ERR_INVOICE_NOT_PAYABLE, http: 409, condition: "Invoice not in a payable state" }
  - { id: ERR_INVOICE_NOT_VOIDABLE, http: 409, condition: "Invoice not DRAFT for void" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 402, condition: "Payment exceeds remaining balance or non-positive amount" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: ClinicAdmin
    description: "Clinic administrator: employer accounts, protocols, invoices, encounter voids, clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set — Set employer clock"
      - "POST /clinic/employers — Create employer"
      - "POST /clinic/employers/{id}/suspend|reactivate|close — Employer lifecycle"
      - "POST /clinic/protocols — Create protocol"
      - "POST /clinic/protocols/{id}/activate — Activate protocol"
      - "POST /clinic/encounters/{id}/void — Void encounter"
      - "POST /clinic/invoices — Create invoice"
      - "POST /clinic/invoices/{id}/issue|payments|void — Invoice lifecycle"
    shared_operations:
      - "POST /clinic/workers — Create worker (with Clinician)"
      - "POST /clinic/encounters — Schedule encounter (with Clinician)"
      - "All GET reads"

  - name: Clinician
    description: "Clinician: encounters, clinical results (lab-result entry, injury/surveillance), clearances. clinician_user_id is pinned per encounter for segregation-of-duties."
    identity: opaque
    exclusive_operations:
      - "POST /clinic/encounters/{id}/check-in|complete|cancel — Encounter flow"
      - "POST /clinic/clearances — Issue clearance"
      - "POST /clinic/clearances/{id}/rescind — Rescind clearance"
      - "POST /clinic/drug-screens/{id}/lab-result — Record lab result"
      - "POST /clinic/injury-cases — Create injury case"
      - "POST /clinic/injury-cases/{id}/reopen — Reopen injury case"
      - "POST /clinic/work-statuses — Add work status"
      - "POST /clinic/surveillance-exams — Create exam"
      - "POST /clinic/surveillance-exams/{id}/record|finalize|cancel — Exam flow"
    shared_operations:
      - "POST /clinic/workers — Create worker (with ClinicAdmin)"
      - "POST /clinic/encounters — Schedule encounter (with ClinicAdmin)"
      - "POST /clinic/drug-screens — Create drug screen (with Collector)"
      - "All GET reads"

  - name: Collector
    description: "Specimen collector: chain-of-custody collection steps; drug-screen creation"
    identity: opaque
    exclusive_operations:
      - "POST /clinic/custody-events — Append custody event"
    shared_operations:
      - "POST /clinic/drug-screens — Create drug screen (with Clinician)"
      - "All GET reads"

  - name: MRO
    description: "Medical Review Officer: receives, verifies, or recollects drug screens. Must equal Employer.mro_user_id and differ from the encounter's clinician_user_id (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /clinic/drug-screens/{id}/mro-receive — Receive screen"
      - "POST /clinic/drug-screens/{id}/mro-verify — Verify result"
      - "POST /clinic/drug-screens/{id}/order-recollection — Order recollection"
    shared_operations:
      - "All GET reads"
