# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
#
# Every rule_id from §0.5, ≥ 2 instances each. Instances ground in elements
# declared in SCAFFOLD.yaml §1.1–§1.7. Deleting this file does not change
# the scaffold's declared behavior — it only makes coverage harder to audit.
# =============================================================================

scaffold_difficulty_design:

  # -----------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # -----------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: damage_fee_provisional_vs_final
        grounds:
          - calculations.provisional_damage_fee
          - calculations.final_damage_fee
          - state_machines.DamageReport.DRAFT_to_SUBMITTED
          - state_machines.DamageReport.SUBMITTED_to_CONFIRMED
        distinguishing_aspect: |
          Same DamageReport input produces two numerically different fees:
          provisional_damage_fee (quoted at SUBMIT) ignores insurance and
          waiver; final_damage_fee (computed at CONFIRM) applies insurance
          deductible AND free-lunch waiver AND depreciated-value cap, so
          final_fee_cents < provisional_fee_cents for the same row.
        test_recipe:
          setup:
            - "Program PROG ACTIVE, fleet F1 (DEVICE, replacement=100000, salvage=10000, useful_life=36, in_service=2025-09-01)"
            - "AssetUnit A1 (barcode 'BC-A1', serial 'SN-A1', condition_grade=B, READY)"
            - "Student S1 (free_lunch_eligible=true, family agreement SIGNED)"
            - "Student S1 has ACTIVE InsurancePolicy P1 (premium=5000, deductible=2500, coverage_cap=50000, year='2026-2027')"
            - "Assignment AS1 created for S1 with A1, expected_return 2027-06-01"
            - "DamageReport DR1 filed on AS1 (damage_category=SCREEN, observed_condition_grade=D) — provisional_fee computed"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "OneToOne-2026", school_year: "2026-2027", loaner_pool_threshold_pct: 0.10 }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "Chromebook-9", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-A1", serial_number: "SN-A1", condition_grade: "B" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-001", full_name: "Alice One", grade_level: 9, free_lunch_eligible: true }
              as: Registrar
              captures: { student_id: $.data.id, student_v0: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "Parent One" }
              as: Family
              as_user_id: "${student_id}"
            - call: "POST /api/programs/${prog_id}/students/${student_id}/insurance-policies"
              payload: { premium_cents: 5000, deductible_cents: 2500, coverage_cap_cents: 50000, academic_year: "2026-2027" }
              as: Family
              as_user_id: "${student_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/insurance-policies/${policy_id}/activate"
              payload: {}
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v1: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${student_v1}" }
              as: Registrar
              captures: { assignment_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/damage-reports"
              payload: { damage_category: "SCREEN", observed_condition_grade: "D" }
              as: Family
              as_user_id: "${student_id}"
              captures: { report_id: $.data.id, provisional_c: $.data.provisional_fee_cents }
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/damage-reports/${report_id}/submit"
              payload: {}
              as: Family
              as_user_id: "${student_id}"
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignmentId}/damage-reports/${report_id}/confirm"
              payload: {}
              as: SiteTechnician
              captures: { final_c: $.data.final_fee_cents }
          assert:
            - "DamageReport.${report_id}.provisional_fee_cents == 41250"
            - "DamageReport.${report_id}.final_fee_cents == 500"
            - "DamageReport.${report_id}.final_fee_cents < DamageReport.${report_id}.provisional_fee_cents"

      - name: depreciated_value_linear_vs_forced_terminal
        grounds:
          - calculations.asset_depreciated_value
          - state_machines.AssetUnit.END_OF_LIFE_to_DISPOSED
          - state_machines.AssetUnit.END_OF_LIFE_to_WRITTEN_OFF
        distinguishing_aspect: |
          asset_depreciated_value has three variants on the same AssetUnit:
          the linear formula (max(salvage, replacement − months ×
          depreciable/useful_life)) applies while the unit is alive; the
          end_of_life_forced variant overrides to salvage_value_cents at
          DISPOSED/DONATED; the write_off_forced variant overrides to 0 at
          WRITTEN_OFF. Three variants, three different cents values for the
          same unit.
        test_recipe:
          setup:
            - "Program PROG ACTIVE"
            - "Fleet F1 (DEVICE, replacement=100000, salvage=10000, useful_life=36, in_service=2024-09-01)"
            - "AssetUnit A_EOL (condition_grade=C, READY); months_in_service at clock=2026-05-01 is 20 → linear value = 100000 - round(20*90000/36) = 100000-50000 = 50000"
            - "AssetUnit retired to END_OF_LIFE (grade C but months_in_service >= 36 — advance clock to 2028-10-01 to force it; then depreciated = salvage = 10000 by linear formula too, so we need a different setup)"
            - "Cleaner: use fleet with useful_life_months=12, in_service=2025-05-01 → at clock 2026-05-01, months_in_service=12, linear depreciated = max(10000, 100000 - 90000) = 10000 (already at salvage); retire now, then dispose → forced salvage; then donate a second unit → forced salvage. To discriminate variants we need linear != salvage."
            - "Use useful_life_months=24, in_service=2025-05-01 → at clock 2026-05-01, months_in_service=12, linear = 100000 - round(12*90000/24)=100000-45000=55000; retire unit; dispose → forced 10000; verify delta == 45000"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "OneToOne-2026", school_year: "2026-2027", loaner_pool_threshold_pct: 0.10 }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "Chromebook-EOL", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 24, in_service_date: "2025-05-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-EOL", serial_number: "SN-EOL", condition_grade: "C" }
              as: SiteTechnician
              captures: { asset_id: $.data.id, asset_v0: $.data.version }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "GET /api/programs/${prog_id}/asset-units/${asset_id}"
              payload: {}
              as: DistrictAdmin
              captures: { asset_v_pre: $.data.version, dep_linear: $.data.depreciated_value_cents }
          trigger:
            - call: "POST /api/programs/${prog_id}/asset-units/${asset_id}/retire"
              payload: { expected_asset_unit_version: "${asset_v_pre}" }
              as: DistrictAdmin
            - call: "POST /api/programs/${progId}/asset-units/${asset_id}/dispose"
              payload: {}
              as: DistrictAdmin
              captures: { dep_after_dispose: $.data.depreciated_value_cents }
          assert:
            - "AssetUnit.${asset_id}.depreciated_value_cents before dispose == 55000 (linear formula at 12 months)"
            - "AssetUnit.${asset_id}.depreciated_value_cents after dispose == 10000 (forced salvage)"
            - "The two values differ by exactly 45000 cents — variant switch is observable"

  # -----------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  # -----------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: final_damage_fee_mode_a_multi_input_conditional
        grounds:
          - calculations.final_damage_fee
        distinguishing_aspect: |
          Mode (a): final_damage_fee is a >=3-input formula with non-linear
          interaction — base × severity_multiplier × (1 − condition_discount),
          then conditionally min'd against depreciated_value_cents only when
          observed_condition_grade ∈ {C, D, F}, then conditionally reduced
          by insurance deductible only when insurance_enrolled, then reduced
          by waiver only when free_lunch_eligible. Branch interactions, not
          just a linear pipeline.
        test_recipe:
          setup:
            - "Two students S1 (free_lunch_eligible=true, no insurance) and S2 (free_lunch_eligible=false, insurance ACTIVE with deductible=2500, cap=50000)"
            - "Each checks out an identical AssetUnit from identical fleet (replacement=100000, salvage=10000, useful_life=36, in_service=2025-09-01)"
            - "Each files a SCREEN damage report at observed_condition_grade=C"
            - "provisional for each = 100000 * 0.55 * (1 - 0.25) = 41250"
            - "S1 final: no insurance → 41250; waiver rate 0.80 → 41250 - 33000 = 8250; cap: depreciated at clock=2026-05-01 is 100000 - round(8*90000/36) = 100000-20000=80000; min(8250, 80000) = 8250"
            - "S2 final: insurance: cap-payouts=50000 >= 41250-2500 → payout=38750, responsibility=2500; no waiver; cap: min(2500, 80000) = 2500"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "OneToOne-2026", school_year: "2026-2027", loaner_pool_threshold_pct: 0.10 }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "Chromebook-9", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-S1", serial_number: "SN-S1", condition_grade: "B" }
              as: SiteTechnician
              captures: { asset_s1: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-S2", serial_number: "SN-S2", condition_grade: "B" }
              as: SiteTechnician
              captures: { asset_s2: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-S1", full_name: "S One", grade_level: 9, free_lunch_eligible: true }
              as: Registrar
              captures: { s1_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${s1_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "P One" }
              as: Family
              as_user_id: "${s1_id}"
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-S2", full_name: "S Two", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { s2_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${s2_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "P Two" }
              as: Family
              as_user_id: "${s2_id}"
            - call: "POST /api/programs/${prog_id}/students/${s2_id}/insurance-policies"
              payload: { premium_cents: 5000, deductible_cents: 2500, coverage_cap_cents: 50000, academic_year: "2026-2027" }
              as: Family
              as_user_id: "${s2_id}"
              captures: { s2_policy: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${s2_id}/insurance-policies/${s2_policy}/activate"
              payload: {}
              as: Family
              as_user_id: "${s2_id}"
            - call: "GET /api/programs/${prog_id}/students/${s1_id}"
              payload: {}
              as: Registrar
              captures: { s1_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${s1_id}/assignments"
              payload: { asset_unit_id: "${asset_s1}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${s1_v}" }
              as: Registrar
              captures: { s1_as: $.data.id }
            - call: "GET /api/programs/${prog_id}/students/${s2_id}"
              payload: {}
              as: Registrar
              captures: { s2_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${s2_id}/assignments"
              payload: { asset_unit_id: "${asset_s2}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${s2_v}" }
              as: Registrar
              captures: { s2_as: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${s1_id}/assignments/${s1_as}/damage-reports"
              payload: { damage_category: "SCREEN", observed_condition_grade: "C" }
              as: Family
              as_user_id: "${s1_id}"
              captures: { s1_dr: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${s2_id}/assignments/${s2_as}/damage-reports"
              payload: { damage_category: "SCREEN", observed_condition_grade: "C" }
              as: Family
              as_user_id: "${s2_id}"
              captures: { s2_dr: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${s1_id}/assignments/${s1_as}/damage-reports/${s1_dr}/submit"
              payload: {}
              as: Family
              as_user_id: "${s1_id}"
            - call: "POST /api/programs/${prog_id}/students/${s2_id}/assignments/${s2_as}/damage-reports/${s2_dr}/submit"
              payload: {}
              as: Family
              as_user_id: "${s2_id}"
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${s1_id}/assignments/${s1_as}/damage-reports/${s1_dr}/confirm"
              payload: {}
              as: SiteTechnician
              captures: { s1_final: $.data.final_fee_cents }
            - call: "POST /api/programs/${prog_id}/students/${s2_id}/assignments/${s2_as}/damage-reports/${s2_dr}/confirm"
              payload: {}
              as: SiteTechnician
              captures: { s2_final: $.data.final_fee_cents }
          assert:
            - "DamageReport.${s1_dr}.final_fee_cents == 8250 (no insurance, waiver 80% applied)"
            - "DamageReport.${s2_dr}.final_fee_cents == 2500 (insurance deductible absorbed, no waiver)"
            - "The same provisional fee (41250) branched into two different finals (8250 vs 2500) — interaction of insurance + waiver branches"

      - name: late_return_fee_mode_c_tiered_boundary_straddle
        grounds:
          - calculations.late_return_fee
        distinguishing_aspect: |
          Mode (c)-shaped (boundary + accumulation-order sensitivity): the
          late_return fee is a tiered formula where crossing a tier boundary
          mid-interval forces the total to be the SUM of partial-tier
          contributions, not tier(days)*rate. The tier boundary is INCLUSIVE
          on the lower edge (day 7 charges T1, day 8 charges T2). This
          differs from mode (a) — no conditional state branching on entity
          status, only positional tier arithmetic with cumulative accumulator
          ordering.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet DEVICE, asset READY, student S (not free_lunch_eligible, agreement signed)"
            - "Assignment AS created with expected_return_date=2026-06-01T00:00:00Z"
            - "Advance clock to 2026-06-11T00:00:00Z → 10 days late (days 1-7 @100c, days 8-10 @250c)"
            - "Expected fee = 7*100 + 3*250 = 700 + 750 = 1450"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "OneToOne-2026", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-LR", serial_number: "SN-LR", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-LR", full_name: "Late Returner", grade_level: 10, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id, student_v0: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "Guardian" }
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2026-06-01T00:00:00Z", expected_student_version: "${student_v}" }
              as: Registrar
              captures: { assignment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/return"
              payload: { return_condition_grade: "A" }
              as: SiteTechnician
          assert:
            - "Assignment.${assignment_id}.late_return_days == 10"
            - "A FeeAssessment with fee_type=LATE_RETURN exists on StudentAccount.${student_id}"
            - "LATE_RETURN FeeAssessment.amount_cents == 1450 (= 7*100 + 3*250; not 10*250 which would be wrong if tier boundary were exclusive on lower edge)"

  # -----------------------------------------------------------------
  # Rule 3 — Non-linear state machines on DIFFERENT entities
  # -----------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: asset_unit_cyclic_repair_loop
        grounds:
          - state_machines.AssetUnit
          - state_machines.AssetUnit.IN_REPAIR_to_DEPLOYED
        distinguishing_aspect: |
          AssetUnit has a true CYCLE: READY → DEPLOYED → IN_REPAIR → READY
          → DEPLOYED (and the explicit revert IN_REPAIR → DEPLOYED when the
          triggering DamageReport is DISMISSED). The state machine loops,
          not a linear pipeline.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet DEVICE, AssetUnit A (grade B)"
            - "Student S (agreement SIGNED, free_lunch_eligible=false)"
            - "Assignment AS created for S with A (A → DEPLOYED)"
            - "DamageReport DR filed (damage_category=FUNCTIONAL, observed_grade=F) → A → IN_REPAIR"
            - "DR submitted"
            - "DR DISMISSED → A reverts IN_REPAIR → DEPLOYED (the cyclic revert)"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-CYC", serial_number: "SN-CYC", condition_grade: "B" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-CYC", full_name: "Cyc", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${student_v}" }
              as: Registrar
              captures: { assignment_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/damage-reports"
              payload: { damage_category: "FUNCTIONAL", observed_condition_grade: "F" }
              as: Family
              as_user_id: "${student_id}"
              captures: { dr_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/damage-reports/${dr_id}/submit"
              payload: {}
              as: Family
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/damage-reports/${dr_id}/dismiss"
              payload: {}
              as: SiteTechnician
          assert:
            - "DamageReport.${dr_id}.status == DISMISSED"
            - "AssetUnit.${asset_id}.lifecycle_status == DEPLOYED (reverted from IN_REPAIR, not advanced to READY)"
            - "An AssetLifecycleEvent of type CORRECTION exists with supersedes_event_id pointing at the REPAIR_START event"

      - name: student_account_parallel_dimensions
        grounds:
          - entities.StudentAccount.fields.financial_posture
          - entities.StudentAccount.fields.family_agreement_status
          - state_machines.FamilyAgreement
          - calculations.financial_posture_derivation
        distinguishing_aspect: |
          StudentAccount carries two INDEPENDENT state dimensions that evolve
          on separate axes: family_agreement_status (PENDING → SIGNED /
          DECLINED, driven by FamilyAgreement transitions) and
          financial_posture (CLEAR / FEES_OUTSTANDING / SUSPENDED, derived
          from FeeAssessment rows). Both must be SIGNED+CLEAR before
          checkout, but they mutate independently — one does not imply the
          other.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet+asset ready, student S1 enrolled"
            - "S1 initially has family_agreement_status=PENDING AND financial_posture=CLEAR"
            - "Family signs → agreement=SIGNED, posture still CLEAR (no fees yet)"
            - "Assignment AS created; return it 5 days late → LATE_RETURN fee → posture=FEES_OUTSTANDING"
            - "Student now has agreement=SIGNED AND posture=FEES_OUTSTANDING — dimensions diverged"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-PAR", serial_number: "SN-PAR", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-PAR", full_name: "Par", grade_level: 10, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2026-05-06T00:00:00Z", expected_student_version: "${student_v}" }
              as: Registrar
              captures: { assignment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/return"
              payload: { return_condition_grade: "A" }
              as: SiteTechnician
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
          assert:
            - "StudentAccount.${student_id}.family_agreement_status == SIGNED (unchanged by fee)"
            - "StudentAccount.${student_id}.financial_posture == FEES_OUTSTANDING (changed by fee)"
            - "Two independent state dimensions on the same entity evolved independently"

  # -----------------------------------------------------------------
  # Rule 4 — Transitive cascades from DIFFERENT triggers, depth ≥ 3 / ≥ 2
  # -----------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: confirm_damage_report_depth3_cascade
        grounds:
          - state_machines.DamageReport.SUBMITTED_to_CONFIRMED
          - state_machines.FeeAssessment
          - state_machines.InsurancePolicy.ACTIVE_to_EXHAUSTED
          - calculations.financial_posture_derivation
        distinguishing_aspect: |
          Depth-3 cascade triggered by DamageReport.confirm:
          confirm → FeeAssessment created (link 1) → StudentAccount.
          lifetime_damage_count += 1 AND financial_posture recomputed
          (link 2, derived from FeeAssessment) → if insurance payout caused
          cumulative_payouts >= coverage_cap_cents, InsurancePolicy →
          EXHAUSTED (link 3, caused by the FeeAssessment creation, not the
          original confirm). Each link is caused by the previous link, not
          by the original action.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet (replacement=100000, salvage=10000, useful_life=36), asset A (grade A)"
            - "Student S (free_lunch_eligible=false, agreement signed)"
            - "InsurancePolicy P (premium=5000, deductible=1000, coverage_cap=3000, year='2026-2027') ACTIVE — cap is SMALL so one big payout exhausts it"
            - "Assignment AS; DamageReport DR damage_category=LOSS, observed_grade=A → provisional=100000*1.00*1.00=100000"
            - "Confirm: gross=100000; insurance payout = min(100000-1000, cap-0)=3000; student_responsibility=100000-3000=97000"
            - "Link 1: FeeAssessment created amount=97000"
            - "Link 2: StudentAccount.lifetime_damage_count += 1; posture recomputed → SUSPENDED (outstanding 97000 >= 10000)"
            - "Link 3: payout 3000 >= cap 3000 → InsurancePolicy → EXHAUSTED (this fires because of the FeeAssessment payout, not directly from confirm)"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-CAS", serial_number: "SN-CAS", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-CAS", full_name: "Cas", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "POST /api/programs/${prog_id}/students/${student_id}/insurance-policies"
              payload: { premium_cents: 5000, deductible_cents: 1000, coverage_cap_cents: 3000, academic_year: "2026-2027" }
              as: Family
              as_user_id: "${student_id}"
              captures: { policy_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/insurance-policies/${policy_id}/activate"
              payload: {}
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${student_v}" }
              as: Registrar
              captures: { assignment_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/damage-reports"
              payload: { damage_category: "LOSS", observed_condition_grade: "A" }
              as: Family
              as_user_id: "${student_id}"
              captures: { dr_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/damage-reports/${dr_id}/submit"
              payload: {}
              as: Family
              as_user_id: "${student_id}"
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/damage-reports/${dr_id}/confirm"
              payload: {}
              as: SiteTechnician
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
            - call: "GET /api/programs/${prog_id}/students/${student_id}/insurance-policies/${policy_id}"
              payload: {}
              as: Registrar
          assert:
            - "DamageReport.${dr_id}.status == CONFIRMED"
            - "DamageReport.${dr_id}.final_fee_cents == 97000"
            - "StudentAccount.${student_id}.lifetime_damage_count == 1"
            - "StudentAccount.${student_id}.financial_posture == SUSPENDED"
            - "InsurancePolicy.${policy_id}.status == EXHAUSTED (cap consumed; link-3 cascade fired)"

      - name: begin_summer_collection_depth2_cascade
        grounds:
          - state_machines.DistrictProgram.ACTIVE_to_SUMMER_COLLECTION
          - state_machines.Assignment.ACTIVE_to_OVERDUE
          - state_machines.AssetUnit.DEPLOYED_to_SUMMER_INTAKE
        distinguishing_aspect: |
          Depth-2 cascade with a DIFFERENT trigger than the damage-confirm
          chain: DistrictProgram.begin-summer-collection → Assignment ACTIVE
          → OVERDUE (link 1) → StudentAccount.financial_posture recomputed
          when late fees are generated (link 2, caused by the Assignment
          transition not by begin-summer-collection directly). Parallel to
          link 1: AssetUnit DEPLOYED → SUMMER_INTAKE.
        test_recipe:
          setup:
            - "Program ACTIVE, two students S1 S2 each with an Assignment whose expected_return_date is 2026-06-01"
            - "Assets A1 A2 in DEPLOYED state"
            - "Clock at 2026-06-15 (past expected_return_date for both)"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-SC1", serial_number: "SN-SC1", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset1_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-SC2", serial_number: "SN-SC2", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset2_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-SC1", full_name: "SC One", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { s1_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${s1_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G1" }
              as: Family
              as_user_id: "${s1_id}"
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-SC2", full_name: "SC Two", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { s2_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${s2_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G2" }
              as: Family
              as_user_id: "${s2_id}"
            - call: "GET /api/programs/${prog_id}/students/${s1_id}"
              payload: {}
              as: Registrar
              captures: { s1_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${s1_id}/assignments"
              payload: { asset_unit_id: "${asset1_id}", expected_return_date: "2026-06-01T00:00:00Z", expected_student_version: "${s1_v}" }
              as: Registrar
              captures: { as1_id: $.data.id }
            - call: "GET /api/programs/${prog_id}/students/${s2_id}"
              payload: {}
              as: Registrar
              captures: { s2_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${s2_id}/assignments"
              payload: { asset_unit_id: "${asset2_id}", expected_return_date: "2026-06-01T00:00:00Z", expected_student_version: "${s2_v}" }
              as: Registrar
              captures: { as2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: DistrictAdmin
          trigger:
            - call: "POST /api/programs/${prog_id}/begin-summer-collection"
              payload: {}
              as: DistrictAdmin
          assert:
            - "DistrictProgram.${prog_id}.status == SUMMER_COLLECTION"
            - "Assignment.${as1_id}.status == OVERDUE"
            - "Assignment.${as2_id}.status == OVERDUE"
            - "AssetUnit.${asset1_id}.lifecycle_status == SUMMER_INTAKE"
            - "AssetUnit.${asset2_id}.lifecycle_status == SUMMER_INTAKE"

  # -----------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # -----------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_assignment_create
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_AGREEMENT_NOT_SIGNED]
        distinguishing_aspect: |
          Pair (state, business_safety): assignment-create on a student
          whose FamilyAgreement is unsigned AND whose StudentAccount.status
          is WITHDRAWN violates priority 5 (state: ERR_STUDENT_NOT_ENROLLED)
          AND priority 6 (business_safety: ERR_AGREEMENT_NOT_SIGNED). The
          state error must win because priority 5 < priority 6.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet+asset ready"
            - "Student S created; FamilyAgreement left PENDING"
            - "Student S force-withdrawn (or: admin constructs a student whose status is not ENROLLED; for black-box we create a student and administratively mark them withdrawn via a path that bypasses the no-open-assignments precondition)"
            - "Alternative: use a student where agreement is PENDING AND a different state-rule is violated (e.g., program is DRAFT, not ACTIVE — but that hits priority 3 not 5). Cleaner: leave agreement PENDING (would normally trigger ERR_AGREEMENT_NOT_SIGNED) AND make the student's posture SUSPENDED via an outstanding NON_RETURN fee (would trigger priority 7 ERR_STUDENT_SUSPENDED). Actually priority 7 > priority 6, so we need a priority-5-vs-6 test."
            - "Use the program-state path: put program into DRAFT by creating a SECOND program (no activate), then attempt to create assignment against a student in the DRAFT program. That hits priority 3, not 5. Skip."
            - "Cleanest path: student has family_agreement DECLINED (still triggers ERR_AGREEMENT_NOT_SIGNED at priority 6) AND StudentAccount.status = WITHDRAWN. To reach WITHDRAWN the student needs zero open assignments and posture CLEAR — so enroll student, never assign anything, withdraw. Now student is WITHDRAWN AND agreement was never signed."
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-PRIO", serial_number: "SN-PRIO", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-PRIO", full_name: "Prio", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/withdraw"
              payload: {}
              as: Registrar
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v_post_withdraw: $.data.version }
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2027-06-01T00:00:00Z", expected_student_version: "${student_v_post_withdraw}" }
              as: Registrar
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_STUDENT_NOT_ENROLLED (priority 5 beats priority 6)"
            - "error_id != ERR_AGREEMENT_NOT_SIGNED"

      - name: business_temporal_vs_business_fiscal_on_fee_waive
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_WRITE_OFF_TOO_EARLY]
          - errors[ERR_WAIVER_NOT_ELIGIBLE]
        distinguishing_aspect: |
          Pair (business_temporal, business_fiscal): fee waive on a student
          who is NOT free_lunch_eligible AND whose fee is a NON_RETURN
          fee type (forbidden by waiver rules). Priority 10 (temporal) does
          not fire here, but priority 11 (fiscal) does — both
          ERR_WAIVER_NOT_ELIGIBLE and ERR_WAIVER_FORBIDDEN_FOR_FEE_TYPE
          match. This instance tests the same-priority ordering within
          fiscal: eligibility (precondition) checked before type-forbidden
          (postcondition) per the order they are listed in priority 11.
          Differentiation from instance 1: this is fiscal-internal ordering,
          not cross-category.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet+asset ready, student S enrolled NOT free_lunch_eligible, agreement signed"
            - "Assignment AS created; declare AS lost → NON_RETURN fee (amount = 100000) created with status=ASSESSED"
            - "Now call /waive: student is NOT free_lunch_eligible AND fee_type is NON_RETURN — both fiscal sub-rules violated"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-WV", serial_number: "SN-WV", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-WV", full_name: "Wv", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
              payload: { acceptable_use_version: "AUP-2026.v3", signed_by_guardian_name: "G" }
              as: Family
              as_user_id: "${student_id}"
            - call: "GET /api/programs/${prog_id}/students/${student_id}"
              payload: {}
              as: Registrar
              captures: { student_v: $.data.version }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments"
              payload: { asset_unit_id: "${asset_id}", expected_return_date: "2026-06-01T00:00:00Z", expected_student_version: "${student_v}" }
              as: Registrar
              captures: { assignment_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students/${student_id}/assignments/${assignment_id}/declare-lost"
              payload: {}
              as: Registrar
            - call: "GET /api/programs/${prog_id}/students/${student_id}/fees"
              payload: {}
              as: DistrictAdmin
              captures: { fee_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/programs/${prog_id}/students/${student_id}/fees/${fee_id}/waive"
              payload: {}
              as: DistrictAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_WAIVER_NOT_ELIGIBLE (eligibility is checked before fee-type — precedence within priority 11)"
            - "error_id != ERR_WAIVER_FORBIDDEN_FOR_FEE_TYPE"

  # -----------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # -----------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: suspend_threshold_inclusive_boundary
        grounds:
          - calculations.financial_posture_derivation
          - endpoints: "POST /program/{progId}/students/{studentId}/assignments"
        distinguishing_aspect: |
          Metric: outstanding_balance_cents. Boundary: SUSPEND_THRESHOLD_CENTS
          == 10000 (inclusive — posture == SUSPENDED exactly when outstanding
          >= 10000, FEES_OUTSTANDING when 0 < outstanding < 10000). Reachable
          via POST /assignments (rejected iff posture == SUSPENDED). Test
          straddles the boundary: outstanding == 9999 → assignment succeeds;
          outstanding == 10000 → ERR_STUDENT_SUSPENDED.
        test_recipe:
          setup:
            - "Program ACTIVE, fleet+asset ready, student S (agreement signed, NOT free_lunch_eligible)"
            - "Assignment AS1 created, returned 4 days late — late fee = 4*100 = 400 cents (still CLEAR)"
            - "Now create additional DAMAGE fees to land exactly at outstanding == 10000 (e.g. confirm damage reports totaling 10000-400 = 9600 cents)"
            - "Then attempt a SECOND assignment create — should fail ERR_STUDENT_SUSPENDED"
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { program_name: "P", school_year: "2026-2027" }
              as: DistrictAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets"
              payload: { fleet_name: "F", asset_class: "DEVICE", unit_replacement_cost_cents: 100000, salvage_value_cents: 10000, useful_life_months: 36, in_service_date: "2025-09-01T00:00:00Z" }
              as: DistrictAdmin
              captures: { fleet_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-BND1", serial_number: "SN-BND1", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset1_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/fleets/${fleet_id}/asset-units"
              payload: { asset_tag_barcode: "BC-BND2", serial_number: "SN-BND2", condition_grade: "A" }
              as: SiteTechnician
              captures: { asset2_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/activate"
              payload: {}
              as: DistrictAdmin
            - call: "POST /api/programs/${prog_id}/students"
              payload: { student_external_id: "SIS-BND", full_name: "Bnd", grade_level: 9, free_lunch_eligible: false }
              as: Registrar
              captures: { student_id: $.data.id }
            - call: "POST /api/programs/${prog_id}/students/${student_id}/family-agreement/sign"
