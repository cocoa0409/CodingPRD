      - name: campaign_close_empty_completion_set_returns_zero_pct
        grounds:
          - calculations.campaign_completion_pct
          - endpoints.POST_/campaigns/{campaignId}/close
          - entities.Campaign.fields.completion_pct
        distinguishing_aspect: |
          Metric: completion_pct on the EMPTY SET (zero in-scope completions).
          Endpoint: POST /campaigns/{cid}/close. Boundary: a campaign whose
          entire completion set has been EXEMPTED reports 0.00 (not 100.00),
          so it cannot be closed on the >=95.00 branch — it can only be closed
          on the clock > closes_on + 90 days branch. Differentiation: distinct
          metric (empty-set pct) on a distinct endpoint from the labor-minutes
          boundary.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet with one Truck."
            - "Campaign created with affected_model_codes=[CASCADIA_126]; a single CampaignCompletion row exists."
            - "That row is EXEMPTED (reason: TRUCK_DECOMMISSIONED via decommission, OR direct exempt call)."
            - "Clock is BEFORE closes_on + 90 days → close should fail."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
            - call: "POST /fleets"
              payload: { fleet_name: "EmptyCmp Fleet", home_region: "SE" }
              as: FleetManager
              as_user_id: "fm-ec"
              captures: { fleet_id: $.data.id }
            - call: "POST /fleets/${fleet_id}/trucks"
              payload: { vin: "1FUJGBDV8CLBP0080", model_code: "CASCADIA_126", in_service_on: "2026-01-01T00:00:00Z", odometer_miles: 50000, base_warranty_until_miles: 250000, base_warranty_until_on: "2028-01-01T00:00:00Z" }
              as: FleetManager
              as_user_id: "${fleet_id}"
              captures: { truck_id: $.data.id }
            - call: "POST /campaigns"
              payload: { campaign_code: "RCL-2026-EMPTY", campaign_kind: "RECALL", affected_model_codes: ["CASCADIA_126"], fault_code: "SPN3216_FMI4", opens_on: "2026-08-01T00:00:00Z", closes_on: "2027-08-01T00:00:00Z" }
              as: UptimeCoordinator
              captures: { campaign_id: $.data.id }
            - call: "GET /campaigns/${campaign_id}/completions"
              payload: { truck_id: "${truck_id}" }
              as: UptimeCoordinator
              captures: { cc_id: "$.data[0].id" }
            - call: "POST /campaigns/${campaign_id}/completions/${cc_id}/exempt"
              payload: { exemption_reason: "FLEET_SOLD" }
              as: UptimeCoordinator
            - call: "GET /campaigns/${campaign_id}"
              payload: {}
              as: UptimeCoordinator
              captures: { campaign_v: $.data.version, pct: $.data.completion_pct }
          trigger:
            - call: "POST /campaigns/${campaign_id}/close"
              payload: { expected_campaign_version: "${campaign_v}" }
              as: UptimeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "pct == 0.00 (empty in-scope set)"
            - "the close response status is 409"
            - "err == ERR_CAMPAIGN_NOT_CLOSABLE"
            - "Campaign.${campaign_id}.campaign_status == OPEN (unchanged)"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: case_schedule_blocked_by_suspended_dealer
        grounds:
          - state_machines.Case.TRIAGE_to_SCHEDULED
          - entities.Dealer.fields.dealer_status
          - validations.priority_10_business_safety
        distinguishing_aspect: |
          Pair: Case (transition TRIAGE→SCHEDULED) depends on Dealer
          (dealer_status must be ACTIVE). With Dealer SUSPENDED the schedule
          call fails with ERR_DEALER_NOT_AVAILABLE — a cross-entity state
          dependency. Pair (Case, Dealer) is distinct from (Case, Claim) used
          in the other instance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Fleet/Truck; Dealer is SUSPENDED (assume a suspend endpoint exists via FleetManager or that dealer is created SUSPENDED — for this test we simulate by creating dealer ACTIVE then using a hypothetical suspend; per spec dealer_status is system-managed; here we use a Dealer with region mismatch as the AVAILABLE-blocker instead)."
            - "Alternative concrete dependency: Dealer.region != Fleet.home_region AND allow_cross_region not set → ERR_DEALER_NOT_AVAILABLE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: UptimeCoordinator
