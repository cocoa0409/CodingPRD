          assert:
            - "err_issued == ERR_INVALID_STATE_TRANSITION (ISSUED is not EXECUTED — the from-state gate fires first)"
            - "err_sov == ERR_SOV_NOT_APPROVED (EXECUTED but sov_status == DRAFT — the SOV gate fires)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bid_received_after_exact_bid_due_instant_rejected
        grounds:
          - validations[priority=14]
          - errors[ERR_BID_AFTER_DEADLINE]
        distinguishing_aspect: |
          Interval semantics = half-open point-cutoff on the TradePackage bid
          window: bid_received_at equal to bid_due_at exactly is admissible
          (inclusive boundary), one second later collides with the closed
          window and is rejected. Adjacency at the exact instant is the tested
          edge.
        test_recipe:
          setup:
            - "Package PUBLISHED with bid_due_at = 2026-05-20T16:00:00Z (project clock at default 2026-05-01)"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-TO1", project_number: "TO1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "TO1-26", title: "Mechanical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, spec_section: "23 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
          trigger:
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Tau OnTime", contact_email: "t1@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-20T16:00:00Z" }
              as: BuyoutLead
              captures: { bid_on_time: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Tau Late", contact_email: "t2@x.com", base_bid_cents: 8900000, bid_received_at: "2026-05-20T16:00:01Z" }
              as: BuyoutLead
              captures: { err_late: $.data.error_id }
          assert:
            - "bid_on_time != null (received exactly at bid_due_at — inclusive boundary admits it)"
            - "err_late == ERR_BID_AFTER_DEADLINE (one second past the instant — half-open cutoff rejects it)"
            - "Bid.${bid_on_time}.status == PLACED"

      - name: insurance_certificate_expired_at_logical_clock_overlap
        grounds:
          - calculations.insurance_compliance_check
          - validations[priority=5]
          - errors[ERR_INSURANCE_CERT_EXPIRED]
        distinguishing_aspect: |
          Interval semantics = whole-validity-window vs point-in-time on the
          InsuranceCertificate resource (different resource and different
          geometry than the bid-window cutoff): coverage must extend STRICTLY
          past the project clock date — a certificate expiring ON the clock
          date is expired, and issue is blocked with
          ERR_INSURANCE_CERT_EXPIRED; one day later satisfies the whole window.
        test_recipe:
          setup:
            - "Project logical clock advanced to 2026-09-01T00:00:00Z"
            - "Subcontract AWARDED at 9000000 (bonding WAIVED); bid_due_at 2026-10-20 stays ahead of the moved clock"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-TO2", project_number: "TO2", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
            - call: "POST /projects/${proj_id}/clock"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "TO2-09", title: "Electrical", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, spec_section: "26 00 00", bid_due_at: "2026-10-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Upsilon Elec", contact_email: "u@x.com", base_bid_cents: 9000000, bid_received_at: "2026-09-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_u: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Phi Elec", contact_email: "p@x.com", base_bid_cents: 9100000, bid_received_at: "2026-09-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_p2: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_p2}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Upsilon Elec", source_bid_id: "${bid_u}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_u: $.data.id }
            - call: "POST /subcontracts/${sub_u}/recommend-award"
              payload: { contract_value_cents: 9000000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_u}/award"
              as: OperationsManager
          trigger:
            - call: "POST /subcontracts/${sub_u}/insurance-certificates"
              payload: { certificate_number: "CERT-EXP", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: true, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2026-09-01" }
              as: BuyoutLead
              captures: { cert_exp: $.data.id, cert_exp_status: $.data.status, cert_exp_verdict: $.data.compliance_verdict }
            - call: "POST /subcontracts/${sub_u}/issue"
              as: BuyoutLead
              captures: { err_issue: $.data.error_id }
            - call: "POST /subcontracts/${sub_u}/insurance-certificates"
              payload: { certificate_number: "CERT-OK", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: true, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2026-09-02" }
              as: BuyoutLead
              captures: { cert_ok: $.data.id, cert_ok_verdict: $.data.compliance_verdict }
            - call: "POST /subcontracts/${sub_u}/issue"
              as: BuyoutLead
              captures: { sub_u_status: $.data.status }
          assert:
            - "cert_exp_status == EXPIRED and cert_exp_verdict == NON_COMPLIANT (expires_on equal to the clock date fails the strict expires_on > clock rule)"
            - "err_issue == ERR_INSURANCE_CERT_EXPIRED (insurance_status EXPIRED_CERT_ONLY maps to the expiry-specific error)"
            - "cert_ok_verdict == COMPLIANT (one day of forward coverage satisfies the whole-window rule)"
            - "sub_u_status == ISSUED after the second issue call"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: award_then_unaward_restores_bid_and_package_state_exactly
        grounds:
          - state_machines.Bid.AWARDED_to_PLACED
          - state_machines.Bid.PLACED_to_AWARDED
          - state_machines.Subcontract.PENDING_AWARD_to_DRAFT
        distinguishing_aspect: |
          Conserved quantity = exact state vector (Bid.status,
          Subcontract.status, Subcontract.contract_value_cents): award moves
          bid PLACED -> AWARDED and subcontract DRAFT -> PENDING_AWARD with the
          value pinned; un-award MUST return all three to their pre-award
          values and leave TradePackage.awarded_value_cents at its pre-award
          value — zero drift.
        test_recipe:
          setup:
            - "Subcontract DRAFT created from bid B (contract_value_cents == 0)"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-CI1", project_number: "CI1", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "CI1-05", title: "Plumbing", estimated_budget_cents: 10000000, budgeted_contingency_cents: 0, spec_section: "22 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Phi Plumb", contact_email: "ph@x.com", base_bid_cents: 9000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_ph: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Chi Plumb", contact_email: "c@x.com", base_bid_cents: 9100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_c1: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_c1}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Phi Plumb", source_bid_id: "${bid_ph}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_ph: $.data.id }
            - call: "GET /trade-packages/${tp_id}"
              as: BuyoutLead
              captures: { tp_awarded_pre: $.data.awarded_value_cents }
            - call: "POST /subcontracts/${sub_ph}/recommend-award"
              payload: { contract_value_cents: 9000000 }
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_ph}/award"
              as: BuyoutLead
            - call: "GET /subcontracts/${sub_ph}"
              as: BuyoutLead
              captures: { sub_status_mid: $.data.status, sub_val_mid: $.data.contract_value_cents }
            - call: "GET /bids/${bid_ph}"
              as: BuyoutLead
              captures: { bid_status_mid: $.data.status }
          trigger:
            - call: "POST /bids/${bid_ph}/un-award"
              as: BuyoutLead
            - call: "GET /bids/${bid_ph}"
              as: BuyoutLead
              captures: { bid_status_post: $.data.status }
            - call: "GET /subcontracts/${sub_ph}"
              as: BuyoutLead
              captures: { sub_status_post: $.data.status, sub_val_post: $.data.contract_value_cents }
            - call: "GET /trade-packages/${tp_id}"
              as: BuyoutLead
              captures: { tp_awarded_post: $.data.awarded_value_cents }
          assert:
            - "tp_awarded_pre == 0 (no awarded anchors before the award)"
            - "sub_status_mid == PENDING_AWARD and sub_val_mid == 9000000 and bid_status_mid == AWARDED (forward action applied)"
            - "bid_status_post == PLACED (exact restoration of the bid)"
            - "sub_status_post == DRAFT and sub_val_post == 0 (exact restoration — value reset to the DRAFT sentinel, not left at 9000000)"
            - "tp_awarded_post == tp_awarded_pre == 0 (conserved fiscal quantity — zero drift)"

      - name: co_approve_then_void_preserves_cumulative_and_contract_value
        grounds:
          - state_machines.ChangeOrder.APPROVED_to_VOIDED
          - entities.Subcontract.fields.cumulative_co_cents
          - entities.Subcontract.fields.contract_value_cents
        distinguishing_aspect: |
          Conserved quantity = money (different quantity type than the sibling
          state vector): Subcontract.contract_value_cents and
          cumulative_co_cents after approve-then-void MUST equal their
          pre-approve values, and a subsequent authority check must observe the
          compensated cumulative (400000 voided units do not count).
        test_recipe:
          setup:
            - "EXECUTED subcontract, contract_value_cents=10000000, SOV APPROVED, single unlimited OM authority tier plus a PM tier"
            - "ChangeOrder of 400000 approved by ProjectManager, then voided"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "P-CI2", project_number: "CI2", estimated_budget_cents: 50000000, buyout_target_savings_pct: 0.05 }
              as: GCAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/open"
              as: GCAdmin
              captures: { proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/trade-packages"
              payload: { trade_code: "CI2-09", title: "Electrical", estimated_budget_cents: 12000000, budgeted_contingency_cents: 0, spec_section: "26 00 00", bid_due_at: "2026-05-20T16:00:00Z", bonding_policy: "WAIVED", expected_project_version: "${proj_v}" }
              as: BuyoutLead
              captures: { tp_id: $.data.id }
            - call: "POST /trade-packages/${tp_id}/publish"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Chi Elec", contact_email: "c@x.com", base_bid_cents: 10000000, bid_received_at: "2026-05-15T12:00:00Z" }
              as: BuyoutLead
              captures: { bid_c: $.data.id }
            - call: "POST /trade-packages/${tp_id}/bids"
              payload: { bidder_name: "Psi Elec", contact_email: "ps@x.com", base_bid_cents: 10100000, bid_received_at: "2026-05-15T13:00:00Z" }
              as: BuyoutLead
              captures: { bid_ps: $.data.id }
            - call: "POST /trade-packages/${tp_id}/close-bidding"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/bids/${bid_ps}/withdraw"
              as: BuyoutLead
            - call: "POST /trade-packages/${tp_id}/subcontracts"
              payload: { subcontractor_name: "Chi Elec", source_bid_id: "${bid_c}", flow_down_terms: "fd", payment_terms: { retainage_pct: 0.10, pay_if_paid: true }, change_authority_limits: [{ max_value_cents: 2500000, max_cumulative_pct: 0.10, roles: ["ProjectManager"] }, { max_value_cents: -1, max_cumulative_pct: -1, roles: ["OperationsManager"] }] }
              as: BuyoutLead
              captures: { sub_c: $.data.id }
            - call: "POST /subcontracts/${sub_c}/recommend-award"
              payload: { contract_value_cents: 10000000 }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_c}/award"
              as: OperationsManager
            - call: "POST /subcontracts/${sub_c}/insurance-certificates"
              payload: { certificate_number: "CERT-CI2", gl_occurrence_cents: 1000000, gl_aggregate_cents: 2000000, auto_cents: 1000000, umbrella_cents: 5000000, workers_comp: "STATUTORY", ai_endorsed: true, wos_endorsed: true, ptd_endorsed: true, pollution_cents: 0, expires_on: "2027-06-01" }
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_c}/issue"
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_c}/execute"
              as: BuyoutLead
            - call: "POST /subcontracts/${sub_c}/schedule-of-values"
              payload: { lines: [{ wbs_code: "01", description: "All", weight_numerator: 1 }] }
              as: BuyoutLead
              captures: { sov_c: $.data.id }
            - call: "POST /schedule-of-values/${sov_c}/approve"
              as: OperationsManager
            - call: "GET /subcontracts/${sub_c}"
              as: BuyoutLead
              captures: { cv_pre: $.data.contract_value_cents, cum_pre: $.data.cumulative_co_cents }
            - call: "POST /subcontracts/${sub_c}/change-orders"
              payload: { description: "CO then void", amount_cents: 400000 }
              as: BuyoutLead
              as_user_id: "bl-1"
              captures: { co_v: $.data.id }
            - call: "POST /change-orders/${co_v}/submit"
              as: BuyoutLead
            - call: "POST /change-orders/${co_v}/approve"
              as: ProjectManager
              as_user_id: "pm-1"
            - call: "GET /subcontracts/${sub_c}"
              as: BuyoutLead
              captures: { cv_mid: $.data.contract_value_cents, cum_mid: $.data.cumulative_co_cents }
          trigger:
            - call: "POST /change-orders/${co_v}/void"
              as: OperationsManager
              captures: { co_v_status: $.data.status }
            - call: "GET /subcontracts/${sub_c}"
              as: BuyoutLead
              captures: { cv_post: $.data.contract_value_cents, cum_post: $.data.cumulative_co_cents }
            - call: "POST /subcontracts/${sub_c}/change-orders"
              payload: { description: "post-void authority probe", amount_cents: 500000 }
              as: BuyoutLead
              as_user_id: "bl-1"
              captures: { co2: $.data.id }
            - call: "POST /change-orders/${co2}/submit"
              as: BuyoutLead
            - call: "POST /change-orders/${co2}/approve"
              as: ProjectManager
              as_user_id: "pm-1"
              captures: { co2_status: $.data.status }
          assert:
            - "cv_pre == 10000000 and cum_pre == 0"
            - "cv_mid == 10400000 and cum_mid == 400000 (forward action applied)"
            - "co_v_status == VOIDED"
            - "cv_post == 10000000 and cum_post == 0 (conserved money quantities restored — no drift)"
            - "co2_status == APPROVED (post-void cumulative_ratio == (0 + 500000) / 10000000 == 0.05 <= 0.10 — the voided 400000 does NOT count in the authority ledger)"
