            - "ServiceDay.${d_b}.surge_multiplier_bp == 12500"
            - "ServiceDay.${d_b}.planned_extra_vessels == 1"
            - "ServiceDay.${d_c}.surge_tier == PEAK"
            - "ServiceDay.${d_c}.surge_multiplier_bp == 15000"
            - "ServiceDay.${d_c}.planned_extra_vessels == 2"
            - "ServiceDay.${d_d}.surge_tier == NONE"
            - "ServiceDay.${d_d}.planned_extra_vessels == 0"
      - name: posture_thresholds_fire_at_exactly_22_and_35_knots_and_at_wave_120_and_250
        claim_type: threshold boundary
        grounds: ["calculations.service_day_posture", "entities.ServiceDay.fields.posture"]
        distinguishing_aspect: |
          wind_knots 21.9 is NORMAL and exactly 22.0 is RESTRICTED; 34.9 is RESTRICTED and exactly 35.0 is
          SUSPENDED; wave_height_m exactly 1.20 is RESTRICTED and exactly 2.50 is SUSPENDED. Every comparison
          is inclusive on the threshold value.
        test_recipe:
          setup:
            - "Empty database; six service days are created, one per boundary value."
          setup_api_calls:
            []
          trigger:
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-01", wind_knots: 21.9, wave_height_m: 0.30, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { d_w1: $.data.id }
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-02", wind_knots: 22.0, wave_height_m: 0.30, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { d_w2: $.data.id }
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-03", wind_knots: 34.9, wave_height_m: 0.30, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { d_w3: $.data.id }
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-04", wind_knots: 35.0, wave_height_m: 0.30, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { d_w4: $.data.id }
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-05", wind_knots: 10.0, wave_height_m: 1.20, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { d_v1: $.data.id }
            - call: "POST /harbor/service-days"
              payload: { service_date: "2026-09-06", wind_knots: 10.0, wave_height_m: 2.50, low_water_m: 2.10 }
              as: HarborAdmin
              as_user_id: "admin-1"
              captures: { d_v2: $.data.id }
          assert:
            - "ServiceDay.${d_w1}.posture == NORMAL"
            - "ServiceDay.${d_w2}.posture == RESTRICTED"
            - "ServiceDay.${d_w3}.posture == RESTRICTED"
            - "ServiceDay.${d_w4}.posture == SUSPENDED"
            - "ServiceDay.${d_v1}.posture == RESTRICTED"
            - "ServiceDay.${d_v2}.posture == SUSPENDED"
      - name: low_water_of_exactly_180_does_not_restrict_while_179_does
        claim_type: threshold boundary
        grounds: ["calculations.service_day_posture", "entities.ServiceDay.fields.low_water_m"]
        distinguishing_aspect: |
          The tide clause is a strict `<`, so low_water_m of exactly 1.80 leaves posture NORMAL and 1.79 makes
          it RESTRICTED - the opposite inclusivity to the wind and wave clauses in the same formula.
        test_recipe:
          setup:
            - "Empty database; two service days differing only in low_water_m."
          setup_api_calls:
            []
          trigger:
