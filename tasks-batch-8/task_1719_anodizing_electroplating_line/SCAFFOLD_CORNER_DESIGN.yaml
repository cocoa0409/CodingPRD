            - { call: "POST /work-orders/${w3}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b3x_v2}" }, as: LineOperator, captures: { lr32: $.data.id } }
            - { call: "POST /load-runs/${lr32}/complete", as: LineOperator }
            - { call: "POST /work-orders/${w3}/inspections", payload: { thickness_readings_um: [13.0, 14.0, 15.0], defect_type: "PITTING" }, as: QCInspector }
            - { call: "POST /work-orders/${w3}/start-strip", payload: { strip_method: "CHEMICAL" }, as: LineOperator }
            - { call: "POST /work-orders/${w3}/complete-strip", as: LineOperator, captures: { rc2: $.data.rework_count } }
            - { call: "POST /work-orders/${w3}/route", payload: { bath_id: "${b3x}", planned_duration_minutes: 40, planned_current_density_a_dm2: 1.5 }, as: LineOperator }
            - { call: "GET /baths/${b3x}", as: LabChemist, captures: { b3x_v3: $.data.version } }
            - { call: "POST /work-orders/${w3}/load-runs", payload: { duration_minutes: 40, current_density_a_dm2: 1.5, expected_bath_version: "${b3x_v3}" }, as: LineOperator, captures: { lr33: $.data.id } }
