          - validations[priority=12]
          - errors[ERR_GUIDE_OVERLAP]
        distinguishing_aspect: "Guide semantics = half-open [start,end): Dep1 ends 08-05, assigning the same guide to Dep2 starting exactly 08-05 is ALLOWED (adjacency, no buffer) — distinct from the coach buffer rule."
