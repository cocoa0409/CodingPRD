  - section: rbac
    instances:
      - name: exclusive_operations_are_forbidden_to_other_roles
        claim_type: Exclusive operations
        grounds:
          - roles.PermitOffice.exclusive_operations
          - roles.UtilityOperator.exclusive_operations
          - roles.InstallCoordinator.exclusive_operations
          - roles.ProgramManager.exclusive_operations
          - validations[priority 2 ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Peer roles cannot reach across the fence in either direction: the ProgramManager who owns the campaign cannot decide its permit, survey its poles or register a crew, and the InstallCoordinator cannot run qualification -- there is no hierarchical override anywhere in the eight roles, and the claims pair's segregation of duties is enforced separately at priority 6."
        test_recipe:
          setup:
            - "One campaign, one zone, one SUBMITTED ROW application and one REQUESTED pole request."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
              payload: { name: "Fiberhood 2026", city: "Aurora", prereg_window_open_at: "2026-08-01T00:00:00Z", prereg_window_close_at: "2026-09-30T23:59:00Z", default_threshold_pct: 10.00, deposit_amount_cents: 1000 }
              as: ProgramManager
              captures: { camp: $.data.id }
            - call: "POST /build-zones"
              payload: { campaign_id: "${camp}", name: "Zone Alpha", zone_code: "A1", household_count: 10, required_permit_types: ["ROW"] }
              as: ProgramManager
              captures: { z1: $.data.id }
            - call: "POST /permit-applications"
              payload: { build_zone_id: "${z1}", permit_type: "ROW", valid_days: 120, max_resubmissions: 2 }
              as: ProgramManager
              captures: { pa1: $.data.id }
            - call: "POST /permit-applications/${pa1}/submit"
              payload: {}
              as: ProgramManager
            - call: "POST /pole-attachment-requests"
              payload: { build_zone_id: "${z1}", utility_owner: "Aurora Power", pole_count: 12 }
              as: ProgramManager
              captures: { pr1: $.data.id }
          trigger:
            - call: "POST /permit-applications/${pa1}/decision"
              payload: { decision: "APPROVE" }
              as: ProgramManager
            - call: "POST /pole-attachment-requests/${pr1}/survey"
              payload: { make_ready_cost_cents: 45600 }
              as: ProgramManager
            - call: "POST /install-crews"
              payload: { name: "Bury Crew 1", crew_type: "BURY" }
              as: ProgramManager
            - call: "POST /campaigns/${camp}/qualification-run"
              payload: {}
              as: InstallCoordinator
            - call: "POST /accounts"
              payload: { full_name: "Ann Reyes", email: "ann@example.com", phone: "+13035550101", account_type: "RESIDENT" }
              as: Subscriber
              as_user_id: "00000000-0000-0000-0000-0000000002ff"
          assert:
            - "every call is HTTP 403 with data.error_id == ERR_FORBIDDEN_ROLE"
            - "PermitApplication.${pa1}.status stays SUBMITTED with reviewer_user_id null"
            - "PoleAttachmentRequest.${pr1}.status stays REQUESTED with make_ready_cost_cents 0"
            - "GET /install-crews as InstallCoordinator returns total_count 0 and GET /accounts as ProgramManager returns total_count 0"
            - "BuildZone.${z1}.campaign_status stays PREREG_OPEN -- the refused qualification-run changed nothing"

      - name: pole_decision_is_shared_between_program_manager_and_utility_operator
        claim_type: Shared operations
        grounds:
          - roles.ProgramManager.shared_operations
          - roles.UtilityOperator.shared_operations
          - endpoints["POST /pole-attachment-requests/{id}/decision"]
        distinguishing_aspect: "One endpoint, two legitimate callers, two different branches: the ProgramManager takes the ACCEPT that commits the make-ready money and the UtilityOperator takes the DENY that refuses the attachment, and both are accepted by the same route on sibling requests of the same zone."
        test_recipe:
          setup:
            - "One campaign and one zone with two SURVEYED pole requests, quoted at 45600 and 90000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /campaigns"
