            - "pat540_v1 > pat540_v0 - filing R1 wrote the patient (open_referral_count) and therefore bumped its version; pat540_open1 == 1"
            - "e_pat_stale == ERR_STALE_PATIENT_VERSION with HTTP 412, and the refused call created nothing: GET /ltch/referrals?patient_id=${pat540_id} still lists exactly one referral at that point"
            - "The retry with pat540_v1 returns 201, and ref540a_status == SUPERSEDED - the guard exists precisely because this supersede is destructive"
            - "GET /ltch/patients/${pat540_id} after the retry reports a version strictly greater than pat540_v1 and open_referral_count still 1"
            - "stay540_v2 > stay540_v1 - creating det540a wrote the stay (payment_review_status PRICED and the linkage), so the version moved"
            - "e_stay_stale == ERR_STALE_STAY_VERSION with HTTP 412, and det540a_status1 == DRAFT: the stale writer did NOT void the newer draft"
            - "GET /ltch/stays/${stay540_id}/payment-determinations after the refused call still returns exactly the two rows that existed then (the discharge-cascade determination, VOIDED, and det540a, DRAFT) - no third row was written"
            - "The retry with stay540_v2 returns 201 and det540a_status2 == VOIDED with det540a_void == SUPERSEDED"
            - "The refused writes did not bump any version: the stay's version immediately after e_stay_stale still equals stay540_v2"

      - name: the_small_denominator_guard_releases_at_the_fourth_admission
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.referral_source_share
          - validations.priority_12
          - errors.ERR_REFERRAL_SOURCE_BREACHED
        distinguishing_aspect: "Metro General holds a 100.00 percent share for three consecutive admissions and is still COMPLIANT, because MIN_ADMISSIONS_FOR_MONITORING gates on the period denominator, not on the share; the fourth admission - which belongs to a different hospital - is what releases the guard and retroactively turns Metro BREACHED at 75.00 percent, after which Metro's next admission is refused unless an override_reason is supplied. The monitoring trigger therefore fires on an admission the monitored hospital did not make."
