scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_standard_vs_immediate_on_contract
        grounds:
          - calculations.prorated_cancellation_refund
          - state_machines.Contract.ACTIVE_to_CANCELLATION_REQUESTED
          - state_machines.Contract.SUSPENDED_to_CANCELLATION_REQUESTED
          - entities.Contract.fields.refund_cents
        distinguishing_aspect: |
          Same Contract inputs, two variants: ACTIVE request yields refund_cents == 0
          (STANDARD: service runs to paid_through_at) while SUSPENDED request yields
          refund_cents == 2928 (IMMEDIATE: per-day proration of the unused 16 days). The
          divergence subject is the Contract entity / refund_cents field.
        test_recipe:
          setup:
            - "Two PLUS contracts (monthly 4000c + 1500c addon = 5500c/mo, min_commitment 12mo, ETF 20000c), each with one fall-detection device, both activated 2026-06-01 (paid_through 2026-07-01)."
            - "Contract A stays ACTIVE; request cancellation at 2026-06-15 -> STANDARD variant."
            - "Contract B is suspended (after mark-past-due) then has cancellation requested at 2026-06-15 -> IMMEDIATE variant."
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 4000, fall_detection_addon_cents: 1500, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 20000, min_commitment_months: 12 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub A", email: "a@x.com", residence_address: "1 A St", phone: "555-0001" }
              as: PlatformAdmin
              captures: { sub_a: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub B", email: "b@x.com", residence_address: "2 B St", phone: "555-0002" }
              as: PlatformAdmin
              captures: { sub_b: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_a}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_a: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_b}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_b: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_a}", serial_number: "SN-A1", device_type: "PENDANT", fall_detection_enabled: true }
              as: Subscriber
              as_user_id: "${sub_a}"
              captures: { dev_a: $.data.id }
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_b}", serial_number: "SN-B1", device_type: "PENDANT", fall_detection_enabled: true }
              as: Subscriber
              as_user_id: "${sub_b}"
              captures: { dev_b: $.data.id }
            - call: "POST /pers/devices/${dev_a}/tests"
              payload: { reported_battery_pct: 95, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_a}"
            - call: "POST /pers/devices/${dev_b}/tests"
              payload: { reported_battery_pct: 95, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_b}"
            - call: "POST /pers/devices/${dev_a}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_a}"
            - call: "POST /pers/devices/${dev_b}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_b}"
            - call: "POST /pers/contracts/${ctr_a}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/contracts/${ctr_b}/activate"
              payload: {}
              as: PlatformAdmin
            # Drive Contract B to SUSPENDED: clock past paid_through, mark-past-due, suspend.
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/contracts/${ctr_b}/billing/mark-past-due"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/contracts/${ctr_b}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { ctr_b_v: $.data.version }
            # For IMMEDIATE, paid_through is 2026-07-01 and clock 2026-07-02 -> unused 0 days.
            # Reset clock to 2026-06-15 to obtain the 16 unused days (suspend already applied).
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /pers/contracts/${ctr_a}"
              payload: {}
              as: PlatformAdmin
              captures: { ctr_a_v: $.data.version }
          trigger:
            - call: "POST /pers/contracts/${ctr_a}/request-cancellation"
              payload: { expected_contract_version: "${ctr_a_v}" }
              as: Subscriber
              as_user_id: "${sub_a}"
              captures: { refund_a: $.data.refund_cents }
            - call: "POST /pers/contracts/${ctr_b}/request-cancellation"
              payload: { expected_contract_version: "${ctr_b_v}" }
              as: Subscriber
              as_user_id: "${sub_b}"
              captures: { refund_b: $.data.refund_cents }
          assert:
            - "Contract.${ctr_a}.refund_cents == 0"
            - "Contract.${ctr_b}.refund_cents == 2928"
            - "Contract.${ctr_a}.refund_cents != Contract.${ctr_b}.refund_cents"

      - name: damage_fee_grade_c_vs_unreturned_on_equipment_return
        grounds:
          - calculations.equipment_damage_fee
          - state_machines.EquipmentReturn.RECEIVED_to_DAMAGED
          - state_machines.EquipmentReturn.INITIATED_to_DAMAGED
          - entities.EquipmentReturn.fields.damage_fee_cents
        distinguishing_aspect: |
          Two variants on the EquipmentReturn entity (different domain from Contract refund):
          grade-C MOBILE_GPS yields damage_fee_cents == 9000 (50% of 18000), while an
          UNRETURNED MOBILE_GPS past due_back_at yields 18000 (100%). Divergence subject is
          EquipmentReturn / damage_fee_cents.
        test_recipe:
          setup:
            - "Two cancelled BASIC contracts each with one MOBILE_GPS device, finalized so an EquipmentReturn (INITIATED) exists per device."
            - "Return X: kit sent, received, inspected grade C -> DAMAGED."
            - "Return Y: never received; past due_back_at; inspected UNRETURNED -> DAMAGED."
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "BASIC", monthly_fee_cents: 3000, fall_detection_addon_cents: 0, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 0, min_commitment_months: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub X", email: "x@x.com", residence_address: "3 X St", phone: "555-0003" }
              as: PlatformAdmin
              captures: { sub_x: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub Y", email: "y@x.com", residence_address: "4 Y St", phone: "555-0004" }
              as: PlatformAdmin
              captures: { sub_y: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_x}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_x: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_y}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_y: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_x}", serial_number: "SN-X1", device_type: "MOBILE_GPS" }
              as: Subscriber
              as_user_id: "${sub_x}"
              captures: { dev_x: $.data.id }
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_y}", serial_number: "SN-Y1", device_type: "MOBILE_GPS" }
              as: Subscriber
              as_user_id: "${sub_y}"
              captures: { dev_y: $.data.id }
            - call: "POST /pers/devices/${dev_x}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_x}"
            - call: "POST /pers/devices/${dev_y}/tests"
              payload: { reported_battery_pct: 90, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_y}"
            - call: "POST /pers/devices/${dev_x}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_x}"
            - call: "POST /pers/devices/${dev_y}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_y}"
            - call: "POST /pers/contracts/${ctr_x}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/contracts/${ctr_y}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { ctr_y_v: $.data.version }
            - call: "GET /pers/contracts/${ctr_x}"
              payload: {}
              as: PlatformAdmin
              captures: { ctr_x_v: $.data.version }
            # request + finalize cancellation for X (min_commitment 0 so cancellation_effective_at = paid_through 2026-07-01)
            - call: "POST /pers/contracts/${ctr_x}/request-cancellation"
              payload: { expected_contract_version: "${ctr_x_v}" }
              as: Subscriber
              as_user_id: "${sub_x}"
            - call: "POST /pers/contracts/${ctr_y}/request-cancellation"
              payload: { expected_contract_version: "${ctr_y_v}" }
              as: Subscriber
              as_user_id: "${sub_y}"
            # devices still ACTIVE -> must deactivate path via finalize after effective date; advance clock past paid_through.
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/contracts/${ctr_x}/finalize-cancellation"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/contracts/${ctr_y}/finalize-cancellation"
              payload: {}
              as: PlatformAdmin
            - call: "GET /pers/contracts/${ctr_x}/equipment-returns"
              payload: {}
              as: PlatformAdmin
              captures: { ret_x: "$.data[0].id" }
            - call: "GET /pers/contracts/${ctr_y}/equipment-returns"
              payload: {}
              as: PlatformAdmin
              captures: { ret_y: "$.data[0].id" }
            # Return X: kit -> received -> inspect grade C
            - call: "POST /pers/equipment-returns/${ret_x}/send-kit"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/equipment-returns/${ret_x}/mark-received"
              payload: {}
              as: PlatformAdmin
            # Return Y due_back_at = 2026-07-02 + 14d = 2026-07-16; advance past it for UNRETURNED.
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-17T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pers/equipment-returns/${ret_x}/inspect"
              payload: { condition_grade: "C" }
              as: PlatformAdmin
              captures: { fee_x: $.data.damage_fee_cents }
            - call: "POST /pers/equipment-returns/${ret_y}/inspect"
              payload: { condition_grade: "UNRETURNED" }
              as: PlatformAdmin
              captures: { fee_y: $.data.damage_fee_cents }
          assert:
            - "EquipmentReturn.${ret_x}.damage_fee_cents == 9000"
            - "EquipmentReturn.${ret_y}.damage_fee_cents == 18000"
            - "EquipmentReturn.${ret_x}.damage_fee_cents != EquipmentReturn.${ret_y}.damage_fee_cents"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: alarm_priority_three_input_nonlinear_mode_a
        grounds:
          - calculations.alarm_priority_score
          - entities.AlarmEvent.fields.priority
          - entities.Device.fields.fall_detection_enabled
          - entities.Device.fields.battery_health
        distinguishing_aspect: |
          MODE (a): >=3 inputs (signal_type, fall_detection_enabled, battery_health) with
          non-linear interaction — fall_bonus is gated on (fall_detection_enabled AND
          signal_type==FALL_DETECTED), battery_bonus on battery_health==CRITICAL, then a
          tiered cutoff selects priority. FALL_DETECTED on a fall-enabled device with
          CRITICAL battery scores 60+30+25=115 -> CRITICAL.
        test_recipe:
          setup:
            - "PREMIUM plan; subscriber with an ACTIVE fall-enabled PENDANT under an ACTIVE contract; device battery_health driven to CRITICAL by a low-battery test reading (battery_pct=10)."
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 6000, fall_detection_addon_cents: 2000, included_test_interval_days: 30, response_sla_seconds: 30, early_termination_fee_cents: 30000, min_commitment_months: 12 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub P", email: "p@x.com", residence_address: "5 P St", phone: "555-0005" }
              as: PlatformAdmin
              captures: { sub_p: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_p}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_p: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_p}", serial_number: "SN-P1", device_type: "PENDANT", fall_detection_enabled: true }
              as: Subscriber
              as_user_id: "${sub_p}"
              captures: { dev_p: $.data.id }
            - call: "POST /pers/devices/${dev_p}/tests"
              payload: { reported_battery_pct: 95, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_p}"
            - call: "POST /pers/devices/${dev_p}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_p}"
            - call: "POST /pers/contracts/${ctr_p}/activate"
              payload: {}
              as: PlatformAdmin
            # Record a low battery reading (FAIL_BATTERY) — still updates battery_pct -> CRITICAL band; device stays ACTIVE (not overdue).
            - call: "POST /pers/devices/${dev_p}/tests"
              payload: { reported_battery_pct: 10, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_p}"
          trigger:
            - call: "POST /pers/devices/${dev_p}/alarms"
              payload: { signal_type: "FALL_DETECTED" }
              as: Subscriber
              as_user_id: "${sub_p}"
              captures: { alarm_p: $.data.id, prio_p: $.data.priority }
          assert:
            - "Device.${dev_p}.battery_health == CRITICAL"
            - "AlarmEvent.${alarm_p}.priority == CRITICAL"

      - name: refund_per_day_round_then_multiply_mode_b
        grounds:
          - calculations.prorated_cancellation_refund
          - entities.Contract.fields.refund_cents
          - state_machines.Contract.SUSPENDED_to_CANCELLATION_REQUESTED
        distinguishing_aspect: |
          MODE (b): nested rounding where order is pinned — per-day rate is rounded FIRST
          (round_half_up(5500/30)=183) THEN multiplied by unused_days (16) = 2928. The
          alternative order (round(5500/30*16)=2933) is wrong; the scaffold pins
          round-per-day-then-multiply. Distinct mode from the priority formula (mode a).
        test_recipe:
          setup:
            - "One PLUS contract (5500c/mo effective with addon) activated 2026-06-01 (paid_through 2026-07-01), suspended via mark-past-due, cancellation requested at clock 2026-06-15 (16 unused days)."
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "PLUS", monthly_fee_cents: 4000, fall_detection_addon_cents: 1500, included_test_interval_days: 30, response_sla_seconds: 60, early_termination_fee_cents: 20000, min_commitment_months: 12 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub R", email: "r@x.com", residence_address: "6 R St", phone: "555-0006" }
              as: PlatformAdmin
              captures: { sub_r: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_r}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_r: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_r}", serial_number: "SN-R1", device_type: "PENDANT", fall_detection_enabled: true }
              as: Subscriber
              as_user_id: "${sub_r}"
              captures: { dev_r: $.data.id }
            - call: "POST /pers/devices/${dev_r}/tests"
              payload: { reported_battery_pct: 95, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_r}"
            - call: "POST /pers/devices/${dev_r}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_r}"
            - call: "POST /pers/contracts/${ctr_r}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/contracts/${ctr_r}/billing/mark-past-due"
              payload: {}
              as: PlatformAdmin
            - call: "POST /pers/contracts/${ctr_r}/suspend"
              payload: {}
              as: PlatformAdmin
              captures: { ctr_r_v: $.data.version }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pers/contracts/${ctr_r}/request-cancellation"
              payload: { expected_contract_version: "${ctr_r_v}" }
              as: Subscriber
              as_user_id: "${sub_r}"
              captures: { refund_r: $.data.refund_cents }
          assert:
            - "Contract.${ctr_r}.refund_cents == 2928"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: alarm_escalating_self_loop_walks_contact_tree
        grounds:
          - state_machines.AlarmEvent.CONTACTING_SUBSCRIBER_to_ESCALATING
          - state_machines.AlarmEvent.ESCALATING_to_ESCALATING
          - entities.AlarmEvent.fields.current_escalation_rank
          - entities.EmergencyContact.fields.escalates_to_contact_id
        distinguishing_aspect: |
          AlarmEvent has a cyclic self-loop ESCALATING -> ESCALATING: each CALL_CONTACT
          NO_ANSWER advances current_escalation_rank one hop along escalates_to_contact_id.
          Non-linear (cycle) on the AlarmEvent entity, distinct from the Contract cycle below.
        test_recipe:
          setup:
            - "ACTIVE PREMIUM contract + device; agent on shift; subscriber has 2 active contacts rank 1 (escalates_to rank 2) and rank 2."
            - "Alarm assigned, subscriber called NO_ANSWER -> ESCALATING at rank 1; then rank-1 contact NO_ANSWER -> self-loop ESCALATING at rank 2."
          setup_api_calls:
            - call: "POST /pers/monitoring-plans"
              payload: { tier: "PREMIUM", monthly_fee_cents: 6000, fall_detection_addon_cents: 2000, included_test_interval_days: 30, response_sla_seconds: 30, early_termination_fee_cents: 30000, min_commitment_months: 12 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pers/subscribers"
              payload: { full_name: "Sub E", email: "e@x.com", residence_address: "7 E St", phone: "555-0007" }
              as: PlatformAdmin
              captures: { sub_e: $.data.id }
            - call: "POST /pers/contracts"
              payload: { subscriber_id: "${sub_e}", plan_id: "${plan_id}" }
              as: PlatformAdmin
              captures: { ctr_e: $.data.id }
            - call: "POST /pers/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices"
              payload: { contract_id: "${ctr_e}", serial_number: "SN-E1", device_type: "PENDANT", fall_detection_enabled: false }
              as: Subscriber
              as_user_id: "${sub_e}"
              captures: { dev_e: $.data.id }
            - call: "POST /pers/devices/${dev_e}/tests"
              payload: { reported_battery_pct: 95, signal_ok: true }
              as: Subscriber
              as_user_id: "${sub_e}"
            - call: "POST /pers/devices/${dev_e}/enroll"
              payload: {}
              as: Subscriber
              as_user_id: "${sub_e}"
            - call: "POST /pers/contracts/${ctr_e}/activate"
              payload: {}
              as: PlatformAdmin
            # contact rank 2 first (so rank 1 can escalate_to it)
            - call: "POST /pers/emergency-contacts"
              payload: { subscriber_id: "${sub_e}", name: "C2", phone: "555-2222", relationship: "FAMILY", priority_rank: 2 }
              as: Subscriber
              as_user_id: "${sub_e}"
              captures: { c2: $.data.id }
            - call: "POST /pers/emergency-contacts"
              payload: { subscriber_id: "${sub_e}", name: "C1", phone: "555-1111", relationship: "CAREGIVER", priority_rank: 1, escalates_to_contact_id: "${c2}" }
              as: Subscriber
              as_user_id: "${sub_e}"
              captures: { c1: $.data.id }
            - call: "POST /pers/agent-shifts"
              payload: { agent_user_id: "agent-1", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-06-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pers/devices/${dev_e}/alarms"
              payload: { signal_type: "MANUAL_BUTTON" }
              as: Subscriber
              as_user_id: "${sub_e}"
              captures: { alarm_e: $.data.id }
            - call: "POST /pers/alarms/${alarm_e}/assign"
              payload: {}
              as: CallCenterAgent
              as_user_id: "agent-1"
            - call: "POST /pers/alarms/${alarm_e}/dispatch-actions"
              payload: { action_type: "CALL_SUBSCRIBER", outcome: "ANSWERED" }
              as: CallCenterAgent
              as_user_id: "agent-1"
            - call: "POST /pers/alarms/${alarm_e}/dispatch-actions"
              payload: { action_type: "CALL_SUBSCRIBER", outcome: "NO_ANSWER" }
              as: CallCenterAgent
              as_user_id: "agent-1"
          trigger:
            - call: "POST /pers/alarms/${alarm_e}/dispatch-actions"
              payload: { action_type: "CALL_CONTACT", outcome: "NO_ANSWER", target_contact_id: "${c1}" }
              as: CallCenterAgent
              as_user_id: "agent-1"
              captures: { da_id: $.data.id }
          assert:
            - "AlarmEvent.${alarm_e}.status == ESCALATING"
            - "AlarmEvent.${alarm_e}.current_escalation_rank == 2"

      - name: contract_active_suspended_reinstate_cycle
        grounds:
          - state_machines.Contract.ACTIVE_to_SUSPENDED
          - state_machines.Contract.SUSPENDED_to_ACTIVE
          - entities.Contract.fields.service_status
          - entities.Contract.fields.billing_status
        distinguishing_aspect: |
          Contract service_status cycles ACTIVE -> SUSPENDED -> ACTIVE via suspend/reinstate;
          billing_status evolves on a parallel axis (PAST_DUE during suspension, CURRENT
          after payment). Non-linear (cycle + parallel dimension) on the Contract entity —
          a different entity from the AlarmEvent cycle above.
        test_recipe:
