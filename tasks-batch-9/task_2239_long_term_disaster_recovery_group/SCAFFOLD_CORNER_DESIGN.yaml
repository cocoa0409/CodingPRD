      - name: corner_skill_fit_applies_the_critical_trade_weight
        claim_type: constants_applied
        grounds: [calculations.volunteer_skill_fit_score.constants.CRITICAL_TRADE_WEIGHT, "endpoints[GET /construction-projects/{id}/skill-fit]"]
        distinguishing_aspect: "ROOFING is critical (weight 3) and GENERAL_LABOR is not (weight 1). A 5-day window with 1 roofer and 2 labourers covers 30 of 60 roofing hours and 60 of 60 labour hours, so weighted_covered is 3*30 + 1*60 = 150 against weighted_required 3*60 + 1*60 = 240, giving 6250 bps. Treating every trade as weight 1 gives 7500 bps."
        test_recipe:
          setup:
            - "A PERMITTED project requiring 60 ROOFING and 60 GENERAL_LABOR hours with critical_trades [ROOFING]."
            - "A group with skill_profile {ROOFING: 1, GENERAL_LABOR: 2} on a 2026-09-07 -> 2026-09-11 window (5 closed-interval days, 6 hours per volunteer-day)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: LTRGAdmin
              as_user_id: u_admin_1
            - call: POST /survivors
              payload: { household_name: "Vasquez Household", primary_contact_phone: "555-0227", household_size: 2, income_band: "LOW", head_of_household_age: 42, has_member_with_disability: false, is_uninsured: false, consent_on_file: true, follow_up_opt_in: true }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { sv27: "$.data.id" }
            - call: POST /recovery-cases
              payload: { survivor_id: "${sv27}", disaster_code: "DR-4801", assigned_case_manager_user_id: "u_cm_1", primary_residence_status: "OWNER_OCCUPIED" }
              as: IntakeSpecialist
              as_user_id: u_intake_1
              captures: { cs27: "$.data.id" }
            - call: POST /construction-projects
              payload: { case_id: "${cs27}", scope_code: "INTERIOR_REPAIR", required_trade_hours: { ROOFING: 60, GENERAL_LABOR: 60 }, critical_trades: ["ROOFING"], estimated_material_cents: 300000 }
              as: ConstructionManager
              as_user_id: u_cn_1
              captures: { pr27: "$.data.id" }
            - call: POST /construction-projects/{id}/transition
              payload: { action: "PERMIT", permit_number: "PB-4027" }
              as: ConstructionManager
              as_user_id: u_cn_1
            - call: POST /volunteer-groups
              payload: { group_name: "Group Romeo", home_organization: "Romeo Chapel", member_count: 3, skill_profile: { ROOFING: 1, GENERAL_LABOR: 2 }, requires_housing: false, brings_own_tools: true }
              as: VolunteerCoordinator
              as_user_id: u_vc_1
              captures: { gr27: "$.data.id" }
          trigger:
            - call: GET /construction-projects/{id}/skill-fit
              payload: { group_id: "${gr27}", variant: "COVERAGE_WEIGHTED", arrival_date: "2026-09-07", departure_date: "2026-09-11" }
              as: VolunteerCoordinator
              as_user_id: u_vc_1
            - call: POST /volunteer-deployments
              payload: { group_id: "${gr27}", project_id: "${pr27}", arrival_date: "2026-09-07", departure_date: "2026-09-11" }
              as: VolunteerCoordinator
              as_user_id: u_vc_1
              captures: { dp27: "$.data.id" }
          assert:
            - "The skill-fit read returns day_count 5, weighted_covered 150, weighted_required 240, score_bps 6250 and meets_minimum true."
            - "The deployment is created with HTTP 201, skill_fit_score_bps 6250 and status 'REQUESTED'."
      - name: corner_funding_status_derivation_stops_at_the_first_matching_clause
        claim_type: correct_result
        grounds: ["calculations.case_funding_status_derivation"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / case_funding_status_reaches_satisfied_while_case_status_holds_active_recovery
          rationale: "That §1.8 instance walks the clause ladder in order, showing clause 2 (SATISFIED) pre-empting clause 4 (FULLY_COMMITTED) after two partial draws."
      - name: corner_unmet_need_variants_diverge_on_identical_data
        claim_type: variant_divergence
        grounds: ["calculations.unmet_need_determination.variants"]
        excluded_because:
          difficulty_instance: dual_variant_calc / unmet_need_purpose_matched_vs_pooled_diverge_by_600000
          rationale: "That §1.8 instance computes both variants over one dataset and asserts the exact 600000 delta plus the excluded DISPUTED record."
      - name: corner_admin_retention_rounds_per_allocation_line
        claim_type: precision
        grounds: ["calculations.restricted_fund_waterfall.precision"]
        excluded_because:
          difficulty_instance: combinatorial_formula / waterfall_retention_rounded_per_line_yields_105001_not_105000
          rationale: "That §1.8 instance pins the per-line rounding order, asserting 105001 rather than the round-once total of 105000."
      - name: corner_dob_threshold_at_and_around_zero_exposure
        claim_type: threshold
        grounds: ["calculations.dob_exposure_check"]
        excluded_because:
          difficulty_instance: boundary_precision_check / dob_exposure_zero_clears_and_one_cent_over_flags
          rationale: "That §1.8 instance tests exposure exactly 0 and exposure 1, the only boundary the threshold has."
      - name: corner_skill_fit_variants_diverge_for_an_undersized_crew
        claim_type: variant_divergence
        grounds: ["calculations.volunteer_skill_fit_score.variants"]
        excluded_because:
          difficulty_instance: dual_variant_calc / skill_fit_coverage_weighted_6000_vs_headcount_weighted_10000
          rationale: "That §1.8 instance reads both variants for one crew and window, asserting 6000 against 10000."

