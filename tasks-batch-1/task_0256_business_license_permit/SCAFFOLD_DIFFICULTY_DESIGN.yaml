          note the prereq is checked at APPROVE. The conflict tested here is segregation(403,prio6) vs
          state(prio5) on issue: an APPROVED application where the issuer is also the inspector AND the
          state is valid -> the higher-priority segregation check wins with ERR_SEGREGATION_OF_DUTIES.
        test_recipe:
          setup:
            - "Application APPROVED with one PASSED inspection by inspector_user_id='dual-officer'; issuer acts as the SAME id."
          setup_api_calls:
