      - name: scorecard_finalize_locks_counters
        claim_type: terminal_state_lockdown
        grounds: [state_machines.DepartmentScorecard.OPEN_to_FINALIZED, "errors[ERR_SCORECARD_NOT_OPEN]"]
        distinguishing_aspect: "FINALIZED freezes the period: a second finalize fails with ERR_SCORECARD_NOT_OPEN, and a denial triaged after finalization does not move the frozen counters."
        test_recipe:
          setup: ["OPEN scorecard CODING [2026-08-01, 2026-12-31); payer A; code CO-16; denial CLM-2401 triaged (denial_count 1)", "scorecard finalized"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
