      - name: an_open_cruise_cannot_back_a_harvest_block
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_STAND_NOT_INVENTORIED]"
          - "validations[priority=55 ERR_STAND_NOT_INVENTORIED]"
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stand_not_inventoried_at_55_beats_insufficient_tons_at_80
          rationale: "That instance fires ERR_STAND_NOT_INVENTORIED on a CRUISE_OPEN stand while the tonnage is also impossible, then shows the 80 error after the cruise closes."
      - name: a_draft_case_cannot_close_a_property
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_UNDERWRITING_NOT_APPROVED]"
          - "validations[priority=55 ERR_UNDERWRITING_NOT_APPROVED]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / property_acquisition_gated_by_underwriting_case_status
          rationale: "That instance triggers ERR_UNDERWRITING_NOT_APPROVED from DRAFT, SUBMITTED and REJECTED before the APPROVED case closes the tract."
      - name: a_third_revision_round_is_refused
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REVISION_LIMIT_REACHED]"
          - "validations[priority=55 ERR_REVISION_LIMIT_REACHED]"
        excluded_because:
          difficulty_instance: non_linear_state_machine / underwriting_revision_loop_terminates_at_two_rounds
          rationale: "That instance walks the revision cycle twice and asserts ERR_REVISION_LIMIT_REACHED on the third REQUEST_REVISION."
      - name: a_suspended_tract_cannot_commit_a_harvest
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_CERTIFICATION_SUSPENDED]"
          - "validations[priority=60 ERR_CERTIFICATION_SUSPENDED]"
        excluded_because:
          difficulty_instance: transitive_cascade / certification_suspension_cascades_committed_blocks_back_to_reserved
          rationale: "That instance suspends the tract, asserts the reverted blocks, and shows the commit refused with ERR_CERTIFICATION_SUSPENDED until reinstatement."
      - name: a_yield_shortfall_locks_scheduled_volume
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_YIELD_SHORTFALL_LOCK]"
          - "validations[priority=60 ERR_YIELD_SHORTFALL_LOCK]"
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / harvest_cancellation_gated_by_fund_cash_yield_mandate
          rationale: "That instance flips Fund.harvest_acceleration_required and asserts the CANCEL refusal, then the same CANCEL succeeding once the yield mandate is met."
      - name: a_block_inside_the_reentry_buffer_is_refused
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_REENTRY_BUFFER_CONFLICT]"
          - "validations[priority=64 ERR_REENTRY_BUFFER_CONFLICT]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / reentry_buffer_endpoint_itself_conflicts_one_day_later_allowed
          rationale: "That instance pins ERR_REENTRY_BUFFER_CONFLICT to the exact buffer endpoint date and accepts the block one day later."
      - name: a_commit_inside_a_hunting_blackout_is_refused
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_LEASE_BLACKOUT_CONFLICT]"
          - "validations[priority=64 ERR_LEASE_BLACKOUT_CONFLICT]"
        excluded_because:
          difficulty_instance: resource_temporal_overlap / closed_harvest_window_versus_half_open_lease_blackout
          rationale: "That instance tests the closed-versus-half-open interval boundary on both edges of the blackout, which is where ERR_LEASE_BLACKOUT_CONFLICT fires."
      - name: a_cruise_with_no_plots_cannot_close
