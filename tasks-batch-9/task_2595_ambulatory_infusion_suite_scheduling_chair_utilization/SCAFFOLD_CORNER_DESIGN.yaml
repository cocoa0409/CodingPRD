            - call: "POST /appointments/${ap1}/adverse-events"
              payload: { grade: 1, action: "HOLD" }
              as: MedicalDirector
              captures: { e_md_reports: $.data.error_id }
            - call: "POST /adverse-events/${ae1}/start-review"
              payload: {}
