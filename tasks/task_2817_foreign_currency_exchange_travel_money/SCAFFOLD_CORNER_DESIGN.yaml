        excluded_because:
          difficulty_instance: shipment_arrival_five_hop_cascade_to_auto_repatriation_manifest
          rationale: "The largest-denomination-first waterfall, the floor-to-whole-notes rule and the 8500-bps target are asserted note by note inside that §1.8 transitive_cascade instance; the boundary instance above only reuses its literals at the two posture edges."

