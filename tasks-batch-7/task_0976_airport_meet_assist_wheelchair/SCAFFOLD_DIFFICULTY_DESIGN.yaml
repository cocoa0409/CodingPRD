  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_dispatch_in_lockdown_with_no_tsa_agent
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_POSTURE_RESTRICTED]
          - errors[ERR_TSA_CLEARANCE_REQUIRED]
        distinguishing_aspect: |
          Error-category pair (state) vs (business_safety): a dispatch attempted while airport is
          in LOCKDOWN AND the only candidates all lack valid TSA clearance. State priority (5) wins
          over business_safety (6) — ERR_POSTURE_RESTRICTED must be returned, not the TSA error.
        test_recipe:
          setup:
            - "Airport IAH in LOCKDOWN"
            - "One PLANNED leg requiring TSA escort"
            - "One Agent whose tsa_cleared_until is in the past (would fail safety check anyway)"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "IAH", tz_offset_minutes: -300, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "E", requires_secure_escort: true }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "UA9", direction: "DEPARTURE", terminal_id: "${term_id}", scheduled_utc: "2026-06-16T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "P IAH", dob: "1980-01-01", mobility_code: "WCHR", airline_pnr: "IAH1" }
              as: Requester
              captures: { pax_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req_id: $.data.id }
            - call: "POST /maa/assist-requests/${req_id}/legs"
              payload: { segment_id: "${seg_id}", leg_kind: "DEPARTURE_ESCORT", pickup_zone: "Z" }
              as: Requester
              captures: { leg_id: $.data.id }
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T09:00:00Z" }
              as: PlatformAdmin
            - call: "GET /maa/assist-requests/${req_id}"
              as: Requester
              captures: { req_v: $.data.version }
            - call: "POST /maa/assist-requests/${req_id}/events"
              payload: { event_type: "SUBMIT", expected_assist_request_version: "${req_v}" }
              as: Requester
            - call: "POST /maa/airports/${ap_id}/agents"
              payload: { display_name: "IAH Ag expired", tsa_cleared_until: "2026-01-01T00:00:00Z", ummr_certified: false, senior_trained: false, wc_certified: true, shift_start_utc: "2026-06-16T08:00:00Z", shift_end_utc: "2026-06-16T20:00:00Z" }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/posture"
              payload: { posture: "DEGRADED" }
              as: OpsManager
            - call: "POST /maa/airports/${ap_id}/posture"
              payload: { posture: "LOCKDOWN" }
              as: OpsManager
            - call: "GET /maa/assist-requests/${req_id}"
              as: Dispatcher
              captures: { req_v3: $.data.version }
          trigger:
            - call: "POST /maa/legs/${leg_id}/dispatch"
              payload: { expected_assist_request_version: "${req_v3}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_POSTURE_RESTRICTED   # state (p5) beats business_safety (p6)"
            - "error_id != ERR_TSA_CLEARANCE_REQUIRED"

      - name: referential_vs_fiscal_submit_with_bogus_onward_leg_and_missing_payment
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_REFERENTIAL_INTEGRITY]
          - errors[ERR_PAYMENT_METHOD_REQUIRED]
        distinguishing_aspect: |
          Error-category pair (business_referential) vs (business_fiscal): a leg-create call that
          has BOTH an onward_leg_id pointing to a leg of a DIFFERENT AssistRequest AND the parent
          request's passenger lacks the required payment method for a subsequent SUBMIT. The
          referential error must fire on the leg-create call first (p8 < p12 — and fiscal only
          applies to SUBMIT anyway), demonstrating that the two error classes live on different
          endpoints and respect the priority ordering within their applies_to scopes.
        test_recipe:
          setup:
            - "Two AssistRequests R1 (passenger WITHOUT private_card_token, bill_to=PRIVATE) and R2 (different passenger, bill_to=AIRLINE)"
            - "R2 already has one leg L_R2"
            - "Attempt to add a leg to R1 with onward_leg_id = L_R2 (cross-request reference)"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "SEA", tz_offset_minutes: -420, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/terminals"
              payload: { code: "N", requires_secure_escort: false }
              as: PlatformAdmin
              captures: { term_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "AS1", direction: "ARRIVAL", terminal_id: "${term_id}", scheduled_utc: "2026-06-16T10:00:00Z" }
              as: PlatformAdmin
              captures: { seg1_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/segments"
              payload: { flight_no: "AS2", direction: "DEPARTURE", terminal_id: "${term_id}", scheduled_utc: "2026-06-16T14:00:00Z" }
              as: PlatformAdmin
              captures: { seg2_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "No Card", dob: "1990-01-01", mobility_code: "WCHR" }
              as: Requester
              captures: { pax1_id: $.data.id }
            - call: "POST /maa/passengers"
              payload: { full_name: "Other P", dob: "1985-01-01", mobility_code: "WCHR", airline_pnr: "OP1" }
              as: Requester
              captures: { pax2_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax2_id}", bill_to: "AIRLINE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req2_id: $.data.id }
            - call: "POST /maa/assist-requests/${req2_id}/legs"
              payload: { segment_id: "${seg2_id}", leg_kind: "DEPARTURE_ESCORT", pickup_zone: "Z2" }
              as: Requester
              captures: { leg_r2_id: $.data.id }
            - call: "POST /maa/assist-requests"
              payload: { passenger_id: "${pax1_id}", bill_to: "PRIVATE", service_tier: "STANDARD", companion_count: 0 }
              as: Requester
              captures: { req1_id: $.data.id }
          trigger:
            - call: "POST /maa/assist-requests/${req1_id}/legs"
              payload: { segment_id: "${seg1_id}", leg_kind: "CONNECTION_TRANSFER", pickup_zone: "Z1", onward_leg_id: "${leg_r2_id}" }
              as: Requester
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REFERENTIAL_INTEGRITY   # business_referential (p8) fires on leg-create"
            - "ServiceLeg NOT created on ${req1_id}"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: meet_buffer_minutes_boundary_15_accepted_14_rejected
        grounds:
          - entities.Airport.fields.meet_buffer_minutes
          - errors[ERR_BAD_REQUEST]
        distinguishing_aspect: |
          Numeric >= threshold: meet_buffer_minutes MUST be >= 15. Boundary tested at exactly 15
          (accepted) vs 14 (rejected). Metric = integer minutes on the Airport creation endpoint.
        test_recipe:
          setup: []
          setup_api_calls:
            - call: "POST /maa/airports"
              payload: { iata_code: "ATX", tz_offset_minutes: 0, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ok_ap: $.data.id }
          trigger:
            - call: "POST /maa/airports"
              payload: { iata_code: "BTY", tz_offset_minutes: 0, meet_buffer_minutes: 14 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "First POST succeeded with id ${ok_ap}"
            - "error_id == ERR_BAD_REQUEST   # 14 < 15"
            - "Airport.${ok_ap}.meet_buffer_minutes == 15"

      - name: usage_count_threshold_49_vs_50_maintenance_flip
        grounds:
          - state_machines.WheelchairAsset.CHECKED_OUT_to_AVAILABLE
          - entities.WheelchairAsset.fields.usage_count
          - entities.WheelchairAsset.fields.status
        distinguishing_aspect: |
          Empty-set/zero-count class of boundary tested on a different metric (usage_count vs
          minutes) AND a different endpoint (assignment lifecycle vs airport create): at
          usage_count = 49 (post-increment) the chair returns to AVAILABLE on check-in; at
          usage_count = 50 it transitions to MAINTENANCE instead. Reachable through assignment
          completion, not airport creation.
        test_recipe:
          setup:
            - "Airport AUS with a WheelchairAsset whose usage_count is one below the 50 threshold"
            - "Force usage_count to 49 by running 49 full checkout/checkin cycles (or via 49 dispatches each followed by COMPLETE)"
            - "Then dispatch once more (the 50th checkout, count → 50), then COMPLETE — chair MUST land in MAINTENANCE, not AVAILABLE"
          setup_api_calls:
            - call: "POST /maa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /maa/airports"
              payload: { iata_code: "AUS", tz_offset_minutes: -300, meet_buffer_minutes: 15 }
              as: PlatformAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/wheelchairs"
              payload: { asset_tag: "WC-AUS-1", chair_class: "MANUAL", is_wchc_rated: false }
              as: PlatformAdmin
              captures: { wc_id: $.data.id }
            - call: "POST /maa/airports/${ap_id}/wheelchairs"
              payload: { asset_tag: "WC-AUS-2", chair_class: "MANUAL", is_wchc_rated: false }
              as: PlatformAdmin
              captures: { wc2_id: $.data.id }
          trigger:
            # Note: full 49-cycle walk is elided here; the test body will issue the 49 (dispatch, COMPLETE)
            # pairs via a loop in the generated pytest. After the 49th COMPLETE, usage_count == 49.
            # 50th checkout/checkin: usage_count → 50; on the 50th check-in, status := MAINTENANCE.
            - call: "GET /maa/wheelchairs/${wc_id}"
              as: Dispatcher
              captures: { wc_state: $.data.status, wc_usage: $.data.usage_count }
          assert:
            - "After 49 cycles: WheelchairAsset.${wc_id}.usage_count == 49 AND status == AVAILABLE"
            - "After the 50th dispatch+COMPLETE: WheelchairAsset.${wc_id}.usage_count == 50 AND status == MAINTENANCE"

