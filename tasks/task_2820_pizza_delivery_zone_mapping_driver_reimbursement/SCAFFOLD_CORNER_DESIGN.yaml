          assert:
            - "HTTP 409 with ${err_id} == 'ERR_INVALID_ZONE_VERSION_STATE'"
            - "ZoneVersion.${zv_jul_id}.status is still 'SUPERSEDED'"
            - "ZoneVersion.${zv_aug_id}.status is still 'ACTIVE'"
            - "Store.${store_id}.active_zone_version_number == ${zv_aug_number}, unchanged by the rejected reactivation"

      - name: order_starts_placed_and_undisclosed_on_both_dimensions
        claim_type: initial_state
        grounds:
          - state_machines.Order.fulfillment_status
          - state_machines.Order.settlement_status
          - entities.Order.fields.placed_at
          - entities.Order.fields.promise_minutes_snapshot
        distinguishing_aspect: "A freshly created order occupies the initial state of BOTH parallel dimensions at once — fulfillment_status PLACED and settlement_status UNDISCLOSED — with placed_at stamped from the logical clock, promise_minutes_snapshot copied from the store, and every money-out field still zero."
        test_recipe:
          setup:
            - "A store with promise_minutes 30, an ACTIVE zone version and one IN_ZONE address at grid 3.00 miles."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
