  # =================================================================
  # Section: rbac
  # =================================================================
  - section: rbac
    instances:
      - name: patient_role_forbidden_on_formulary_create
        claim_type: rbac_denial
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Patient role calling a PlatformAdmin-only endpoint (POST /api/formulary-items) -> ERR_FORBIDDEN 403."
        test_recipe:
          setup: ["CASH plan; ACTIVE patient"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Self-Pay HSA", plan_type: CASH_HSA, coinsurance_pct: 1.00, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat RB1", date_of_birth: "1978-08-08", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
          trigger:
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "X", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 100, pack_size: 1, retail_price_cents: 100, max_units_per_cycle: 10, size_codes: ["45MM"] }, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN with http 403"

      - name: billing_specialist_cannot_decide_prior_auth
        claim_type: rbac_denial
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "Peer-role isolation: BillingSpecialist invoking PriorAuthSpecialist's exclusive decision endpoint -> ERR_FORBIDDEN."
        test_recipe:
          setup: ["MCR plan; ACTIVE patient; SUBMITTED PA exists"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat RB2", date_of_birth: "1956-06-06", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/prior-authorizations", payload: { patient_id: "${pt}", hcpcs_code: "A6250", approved_units: 45, valid_from: "2026-05-01", valid_to: "2026-08-31" }, as: PriorAuthSpecialist, captures: { pa: $.data.id } }
          trigger:
            - { call: "POST /api/prior-authorizations/${pa}/decision", payload: { outcome: APPROVED }, as: BillingSpecialist, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN; PriorAuthorization.${pa}.status remains SUBMITTED"

      - name: patient_cannot_access_other_patients_orders
        claim_type: rbac_ownership
        grounds:
          - validations[priority=2]
          - entities.Patient
        distinguishing_aspect: "entity_backed identity: Patient A (X-User-ID = A) reading patient B's orders is ERR_FORBIDDEN even though Patient is in the endpoint's role list."
        test_recipe:
          setup: ["CASH plan; ACTIVE patients A and B"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Self-Pay HSA", plan_type: CASH_HSA, coinsurance_pct: 1.00, cycle_months: 1, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat A", date_of_birth: "1983-03-03", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pta: $.data.id } }
            - { call: "POST /api/patients/${pta}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
            - { call: "POST /api/patients", payload: { full_name: "Pat B", date_of_birth: "1984-04-04", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { ptb: $.data.id } }
            - { call: "POST /api/patients/${ptb}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator }
          trigger:
            - { call: "GET /api/patients/${ptb}/orders", payload: {}, as: Patient, as_user_id: "${pta}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN (ownership check: resource.patient_id != X-User-ID)"

  # =================================================================
  # Section: complexity_layers
  # =================================================================
  - section: complexity_layers
    instances:
      - name: occ_fit_profile_stale_patient_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[fit-profile-create-stale-patient]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC on Patient.version: after a first profile create bumps the version, a second create carrying the previously observed expected_patient_version fails 412 ERR_STALE_VERSION; refetching and retrying succeeds and supersedes."
        test_recipe:
          setup: ["MCR plan; ACTIVE patient; observed version v after verify"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat OCC", date_of_birth: "1965-05-05", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
          trigger:
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator, captures: { fp1: $.data.id } }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "57MM", measured_on: "2026-05-01", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "GET /api/patients/${pt}", payload: {}, as: IntakeCoordinator, captures: { pt_v2: $.data.version } }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "57MM", measured_on: "2026-05-01", expected_patient_version: "${pt_v2}" }, as: IntakeCoordinator, captures: { fp2: $.data.id } }
            - { call: "GET /api/patients/${pt}/fit-profiles", payload: { category: OSTOMY }, as: IntakeCoordinator }
          assert:
            - "second create with stale expected_patient_version -> error_id == ERR_STALE_VERSION (412)"
            - "retry with fresh version succeeds: FitProfile.${fp2}.status == CURRENT and ${fp1} -> SUPERSEDED"
            - "exactly one CURRENT OSTOMY profile exists for the patient"

      - name: occ_order_line_stale_order_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[order-line-add-stale-order]
          - errors[ERR_STALE_ORDER_VERSION]
        distinguishing_aspect: "OCC on SupplyOrder.version: adding a line with the pre-first-add expected_order_version fails 412 ERR_STALE_ORDER_VERSION after the first add bumped the version; the version counter increments on every successful mutation."
        test_recipe:
          setup: ["MCR plan; ITM_OST; ACTIVE patient with Rx+fit; DRAFT order, observed version v0"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/patients", payload: { full_name: "Pat OC2", date_of_birth: "1970-09-09", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/orders", payload: { patient_id: "${pt}" }, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm}", size_code: "45MM", quantity: 5, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}" }
            - { call: "POST /api/orders/${ord}/lines", payload: { formulary_item_id: "${itm}", size_code: "45MM", quantity: 3, expected_order_version: "${ord_v}" }, as: Patient, as_user_id: "${pt}", captures: { err: $.data.error_id } }
            - { call: "GET /api/orders/${ord}", payload: {}, as: Patient, as_user_id: "${pt}", captures: { ord_v2: $.data.version } }
          assert:
            - "second line add with stale expected_order_version -> error_id == ERR_STALE_ORDER_VERSION (412)"
            - "SupplyOrder.${ord}.version == ${ord_v} + 1 (only the first add bumped it)"

      - name: derived_next_eligible_date_after_delivery
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.next_eligible_date
          - entities.ResupplyProgram.fields.next_eligible_date
        distinguishing_aspect: "Derived-field reconciliation: next_eligible_date starts as start_date and is recomputed to delivered_date + frequency_days (2026-05-03 + 30 = 2026-06-02) exactly when the delivery lands."
        test_recipe:
          setup: ["MCR plan; ITM_OST stock 500; ACTIVE patient with Rx+fit; OSTOMY program freq 30 start 2026-05-01; cycle confirmed, shipped"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
            - { call: "POST /api/formulary-items", payload: { hcpcs_code: "A4419", name: "Ostomy pouch", category: OSTOMY, covered_plan_ids: ["${pln}"], pack_fee_cents: 1850, pack_size: 10, retail_price_cents: 300, max_units_per_cycle: 60, requires_pa: false, size_codes: ["45MM"] }, as: PlatformAdmin, captures: { itm: $.data.id } }
            - { call: "POST /api/stock-levels", payload: { formulary_item_id: "${itm}", on_hand_qty: 500 }, as: PlatformAdmin }
            - { call: "POST /api/patients", payload: { full_name: "Pat DER", date_of_birth: "1958-08-18", payer_plan_id: "${pln}", hsa_initial_credit_cents: 0 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "POST /api/patients/${pt}/verify-eligibility", payload: { eligible: true }, as: IntakeCoordinator, captures: { pt_v: $.data.version } }
            - { call: "POST /api/prescriptions", payload: { patient_id: "${pt}", hcpcs_code: "A4419", prescriber_npi: "1234567890", diagnosis_codes: ["N39.3"], monthly_quantity: 20, effective_date: "2026-05-01", expiration_date: "2026-11-01" }, as: IntakeCoordinator }
            - { call: "POST /api/fit-profiles", payload: { patient_id: "${pt}", category: OSTOMY, size_code: "45MM", measured_on: "2026-04-20", expected_patient_version: "${pt_v}" }, as: IntakeCoordinator }
            - { call: "POST /api/resupply-programs", payload: { patient_id: "${pt}", category: OSTOMY, frequency_days: 30, start_date: "2026-05-01" }, as: IntakeCoordinator, captures: { prog: $.data.id, ne0: $.data.next_eligible_date } }
            - { call: "POST /api/resupply-programs/${prog}/confirm-cycle", payload: {}, as: Patient, as_user_id: "${pt}", captures: { ord: $.data.id } }
            - { call: "POST /api/shipments", payload: { order_id: "${ord}" }, as: FulfillmentAgent, captures: { shp: $.data.id } }
            - { call: "POST /api/shipments/${shp}/release", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/shipments/${shp}/ship", payload: {}, as: FulfillmentAgent }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/shipments/${shp}/deliver", payload: {}, as: FulfillmentAgent }
            - { call: "GET /api/resupply-programs/${prog}", payload: {}, as: IntakeCoordinator, captures: { ne1: $.data.next_eligible_date, ld1: $.data.last_delivered_date } }
          assert:
            - "at creation next_eligible_date == 2026-05-01 (== start_date)"
            - "after delivery: last_delivered_date == 2026-05-03 and next_eligible_date == 2026-06-02 (delivered_date + 30 days)"

  # =================================================================
  # Section: consistency_model
  # =================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_visibility
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a freshly created patient is fully visible to the very next GET in the same state (no eventual-consistency lag)."
        test_recipe:
          setup: ["MCR plan exists"]
          setup_api_calls:
            - { call: "POST /api/payer-plans", payload: { name: "Medicare DMEPOS", plan_type: MEDICARE_DMEPOS, coinsurance_pct: 0.20, cycle_months: 3, is_active: true }, as: PlatformAdmin, captures: { pln: $.data.id } }
          trigger:
            - { call: "POST /api/patients", payload: { full_name: "Pat IMM", date_of_birth: "1977-11-30", payer_plan_id: "${pln}", hsa_initial_credit_cents: 42 }, as: IntakeCoordinator, captures: { pt: $.data.id } }
            - { call: "GET /api/patients/${pt}", payload: {}, as: IntakeCoordinator, captures: { nm: $.data.full_name, st: $.data.status } }
            - { call: "GET /api/patients/${pt}/hsa-accounts", payload: {}, as: IntakeCoordinator, captures: { bal: "$.data[0].balance_cents" } }
          assert:
            - "GET returns full_name == 'Pat IMM' and status == PENDING_VERIFICATION in the immediately following request"
            - "cascade-created HSAAccount is also immediately readable with balance_cents == 42"
