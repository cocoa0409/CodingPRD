              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - call: "GET /cabinet/programs/${prog}"
              as: ProgramManager
              captures: { prog_v_pre: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L2", effective_start_week: "2026-W38", families: [{ family_code: "F1", standard_price_cents: 11000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v_pre}", old_line_disposition_qty: 0 }
              as: ProgramManager
          trigger:
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L3", effective_start_week: "2026-W40", families: [{ family_code: "F1", standard_price_cents: 12000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v_pre}", old_line_disposition_qty: 0 }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION (412): the version captured before the L2 supersede no longer matches"
            - "GET /cabinet/lines?program_id=${prog}: total_count == 2 (L3 not created)"

      - name: occ_current_version_succeeds_and_version_increments
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[line-create-stale-program]", entities.Program.fields.id]
        distinguishing_aspect: "Positive OCC leg: a line-create carrying the freshly-read program version succeeds (201), the program's version increments by exactly 1, and a still-fresh create after that is rejected by the state gate ERR_PROGRAM_TRANSITIONING (showing OCC and state checks are distinct layers)."
        test_recipe:
          setup: ["Dealer account; program ACTIVE with line L1"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer X", channel: DEALER, pricing_class: STANDARD, lead_time_class: STANDARD, credit_limit_cents: 100000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
              captures: { line1: $.data.id }
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - call: "GET /cabinet/programs/${prog}"
              as: ProgramManager
              captures: { prog_v_pre: $.data.version }
          trigger:
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L2", effective_start_week: "2026-W38", families: [{ family_code: "F1", standard_price_cents: 11000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v_pre}", old_line_disposition_qty: 0 }
              as: ProgramManager
              captures: { line2: $.data.id }
            - call: "GET /cabinet/programs/${prog}"
              as: ProgramManager
              captures: { prog_v_post: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L3", effective_start_week: "2026-W40", families: [{ family_code: "F1", standard_price_cents: 12000, base_lead_weeks: 2, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v_post}", old_line_disposition_qty: 0 }
              as: ProgramManager
              captures: { err: $.data.error_id }
          assert:
            - "Line create with the current version succeeded: GET /cabinet/lines/${line2} status == ACTIVE AND supersedes_line_id == ${line1}"
            - "prog_v_post == prog_v_pre + 1 (single increment per mutation)"
            - "err == ERR_PROGRAM_TRANSITIONING for the third create (fresh version, but state gate fires) — NOT ERR_STALE_VERSION"

  - section: consistency_model
    instances:
      - name: mutation_visible_immediately_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, state_machines.Order.SUBMITTED_to_ACKNOWLEDGED]
        distinguishing_aspect: "Immediate consistency: the acknowledge response body itself carries status == ACKNOWLEDGED and price_lock == true; no re-read is needed to observe the mutation, and the account read right after shows the updated exposure."
        test_recipe:
          setup: ["Dealer account VOLUME limit 1000000; program ACTIVE with F1 10000; order qty 1 SUBMITTED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /cabinet/accounts"
              payload: { name: "Dealer Y", channel: DEALER, pricing_class: VOLUME, lead_time_class: STANDARD, credit_limit_cents: 1000000, store_codes: [] }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /cabinet/programs"
              payload: { account_id: "${acct}", name: "P", program_discount_pct: 0.0 }
              as: ProgramManager
              captures: { prog: $.data.id, prog_v: $.data.version }
            - call: "POST /cabinet/programs/${prog}/lines"
              payload: { line_code: "L1", effective_start_week: "2026-W36", families: [{ family_code: "F1", standard_price_cents: 10000, base_lead_weeks: 3, complexity_units_per_cabinet: 1 }], expected_program_version: "${prog_v}" }
              as: ProgramManager
            - { call: "POST /cabinet/programs/${prog}/activate", payload: {}, as: ProgramManager }
            - call: "POST /cabinet/orders"
              payload: { account_id: "${acct}", program_id: "${prog}", destination_type: JOB_SITE, jobsite_address: "1 Job Ln", requested_delivery_week: "2026-W40", lines: [{ family_code: "F1", finish_code: "OAK", quantity: 1 }] }
              as: DealerRep
              as_user_id: "${acct}"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /cabinet/orders/${o1}/transition"
              payload: { to_status: ACKNOWLEDGED }
              as: ProgramManager
              captures: { st: $.data.status, lock: $.data.price_lock }
          assert:
            - "st == ACKNOWLEDGED AND lock == true in the transition response body itself"
            - "GET /cabinet/accounts/${acct} immediately after: open_exposure_cents == 9500"
