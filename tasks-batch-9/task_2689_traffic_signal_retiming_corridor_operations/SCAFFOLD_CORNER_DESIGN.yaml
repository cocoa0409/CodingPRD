            - "${pa_status} == DATA_COLLECTION and ${pa_version} == 1 — the refused advance wrote nothing"
            - "${e_clock} == ERR_CLOCK_NOT_MONOTONIC with HTTP 422 — the window cannot be reopened by winding the logical clock back"

      - name: project_creation_gates_on_corridor_status_and_on_any_active_project
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 78 ERR_CORRIDOR_NOT_SELECTED]
          - validations[priority 77 ERR_CORRIDOR_PROJECT_ACTIVE]
          - errors.ERR_CORRIDOR_NOT_SCREENED
        distinguishing_aspect: "Three separate cross-entity predicates are read off the parent Corridor rather than the RetimingProject being created: a NEW corridor cannot even receive a selection decision (ERR_CORRIDOR_NOT_SCREENED), a DEFERRED corridor is not projectable (ERR_CORRIDOR_NOT_SELECTED), and a SELECTED corridor that already owns a non-terminal project rejects a second one (ERR_CORRIDOR_PROJECT_ACTIVE) — the last of which requires scanning the corridor's project list, not just its own columns."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Corridor cSel (ARTERIAL, volume 20.0) has one READY member, is screened to 91.25 and SELECTED. Corridor cDef (LOCAL, volume 20.0) has the same member, is screened to 58.40 and DEFERRED. Corridor cNew (ARTERIAL) has the same member and is never screened."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Shared Junction @ Main", controller_type: "TS2_CABINET", max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { ishared_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Selected Corridor", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { csel_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Deferred Corridor", jurisdiction_class: "LOCAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { cdef_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Untouched Corridor", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { cnew_id: $.data.id, cnew_status0: $.data.selection_status }
            - call: "POST /signal-ops/corridors/${csel_id}/members"
              payload: { intersection_id: "${ishared_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${cdef_id}/members"
              payload: { intersection_id: "${ishared_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${cnew_id}/members"
              payload: { intersection_id: "${ishared_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
            - call: "POST /signal-ops/corridors/${csel_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { csel_score: $.data.priority_score }
            - call: "POST /signal-ops/corridors/${cdef_id}/screen"
              payload: {}
              as: SignalOpsAdmin
              captures: { cdef_score: $.data.priority_score }
            - call: "POST /signal-ops/corridors/${csel_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Programme this corridor" }
              as: SignalOpsAdmin
              captures: { csel_status: $.data.selection_status }
            - call: "POST /signal-ops/corridors/${cdef_id}/selection-decision"
              payload: { decision: "DEFER", rationale: "Revisit next cycle" }
              as: SignalOpsAdmin
              captures: { cdef_status: $.data.selection_status }
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${csel_id}", study_window_start_at: "2026-08-01T00:00:00Z", study_window_days: 90, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { p1_id: $.data.id, p1_status: $.data.status }
          trigger:
            - call: "POST /signal-ops/corridors/${cnew_id}/selection-decision"
              payload: { decision: "SELECT", rationale: "Skip the screening step" }
              as: SignalOpsAdmin
              captures: { e_not_screened: $.data.error_id }
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${cnew_id}", study_window_start_at: "2026-08-01T00:00:00Z", study_window_days: 90, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { e_new_not_selected: $.data.error_id }
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${cdef_id}", study_window_start_at: "2026-08-01T00:00:00Z", study_window_days: 90, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { e_deferred: $.data.error_id }
            - call: "POST /signal-ops/retiming-projects"
              payload: { corridor_id: "${csel_id}", study_window_start_at: "2026-08-01T00:00:00Z", study_window_days: 90, lead_engineer_user_id: "eng-1" }
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { e_active: $.data.error_id }
            - call: "GET /signal-ops/corridors/${csel_id}/retiming-projects"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { proj_total: $.total_count, proj0_id: "$.data[0].id" }
          assert:
            - "${cnew_status0} == NEW, ${csel_score} == 91.25 with ${csel_status} == SELECTED, and ${cdef_score} == 58.40 with ${cdef_status} == DEFERRED"
            - "${e_not_screened} == ERR_CORRIDOR_NOT_SCREENED with HTTP 409 — the selection decision reads the corridor's own state gate first"
            - "${e_new_not_selected} == ERR_CORRIDOR_NOT_SELECTED and ${e_deferred} == ERR_CORRIDOR_NOT_SELECTED, both HTTP 409 — NEW and DEFERRED are both non-SELECTED, and the DEFERRED corridor is refused despite scoring above nothing at all"
            - "${e_active} == ERR_CORRIDOR_PROJECT_ACTIVE with HTTP 409 — the predicate scans the corridor's projects for any status outside {CLOSED, ABANDONED}, and ${p1_status} == DATA_COLLECTION qualifies"
            - "${proj_total} == 1 and ${proj0_id} == ${p1_id} — none of the four refused calls created a row"

      - name: aps_flag_and_walking_speed_standard_must_move_together
        claim_type: conditional_validation
        grounds:
          - validations[priority 50 ERR_APS_STANDARD_MISMATCH]
          - errors.ERR_APS_STANDARD_MISMATCH
          - endpoints[PATCH /signal-ops/intersections/{id}]
        distinguishing_aspect: "The rule is conditional on the POST-write pair of values, not on either field alone: setting aps_installed true while walking_speed_standard would remain STD_3_5_FPS is refused, clearing aps_installed while the standard would remain EXTENDED_3_0_FPS is refused, and both directions are accepted when the two fields are patched in the same request — a per-field validator can never express this."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Intersection i1 is created with aps_installed false and walking_speed_standard STD_3_5_FPS."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", aps_installed: false, walking_speed_standard: "STD_3_5_FPS" }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id, i1_v0: $.data.version }
          trigger:
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { aps_installed: true }
              as: SignalOpsAdmin
              captures: { e_set_only_flag: $.data.error_id }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { walking_speed_standard: "EXTENDED_3_0_FPS" }
              as: SignalOpsAdmin
              captures: { e_set_only_standard: $.data.error_id }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { aps_installed: true, walking_speed_standard: "EXTENDED_3_0_FPS" }
              as: SignalOpsAdmin
              captures: { ok_aps: $.data.aps_installed, ok_std: $.data.walking_speed_standard, i1_v1: $.data.version }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { aps_installed: false }
              as: SignalOpsAdmin
              captures: { e_clear_only_flag: $.data.error_id }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { aps_installed: false, walking_speed_standard: "STD_3_5_FPS" }
              as: SignalOpsAdmin
              captures: { back_aps: $.data.aps_installed, back_std: $.data.walking_speed_standard, i1_v2: $.data.version }
          assert:
            - "${i1_v0} == 1"
            - "${e_set_only_flag} == ERR_APS_STANDARD_MISMATCH with HTTP 422 — the post-write pair would be (true, STD_3_5_FPS)"
            - "${e_set_only_standard} == ERR_APS_STANDARD_MISMATCH — the mirror direction, pair (false, EXTENDED_3_0_FPS)"
            - "${ok_aps} == true, ${ok_std} == EXTENDED_3_0_FPS and ${i1_v1} == 2 — the paired patch satisfies the rule, and only this call bumped the version"
            - "${e_clear_only_flag} == ERR_APS_STANDARD_MISMATCH — clearing the flag alone leaves the extended standard orphaned"
            - "${back_aps} == false, ${back_std} == STD_3_5_FPS and ${i1_v2} == 3 — three rejected PATCHes and two accepted ones leave the version at exactly 3"

      - name: member_sequence_index_must_be_exactly_member_count_plus_one
        claim_type: violation_to_error
        grounds:
          - validations[priority 74 ERR_SEQUENCE_INDEX_GAP | ERR_DUPLICATE_CORRIDOR_MEMBER]
          - errors.ERR_SEQUENCE_INDEX_GAP
          - errors.ERR_DUPLICATE_CORRIDOR_MEMBER
        distinguishing_aspect: "Enrolment is strictly append-only at member_count + 1, so both a gap (3 into an empty corridor) and a repeat of the current index (1 when one member exists) are refused, and the duplicate-intersection check is evaluated even when the sequence_index is the correct next value. A rejected enrolment must not increment member_count, otherwise the next legal index silently shifts."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Two intersections and one empty ARTERIAL corridor exist."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id }
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 3rd Ave", controller_type: "TS2_CABINET" }
              as: SignalOpsAdmin
              captures: { i2_id: $.data.id }
            - call: "POST /signal-ops/corridors"
              payload: { name: "Main St 1st-3rd", jurisdiction_class: "ARTERIAL", annual_volume_change_pct: 20.0 }
              as: SignalOpsAdmin
              captures: { c1_id: $.data.id, mc0: $.data.member_count }
          trigger:
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 3, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
              captures: { e_gap: $.data.error_id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 1, distance_from_prev_ft: 0 }
              as: SignalOpsAdmin
              captures: { m1_seq: $.data.sequence_index }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i2_id}", sequence_index: 1, distance_from_prev_ft: 2640 }
              as: SignalOpsAdmin
              captures: { e_repeat: $.data.error_id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i1_id}", sequence_index: 2, distance_from_prev_ft: 2640 }
              as: SignalOpsAdmin
              captures: { e_dupe: $.data.error_id }
            - call: "POST /signal-ops/corridors/${c1_id}/members"
              payload: { intersection_id: "${i2_id}", sequence_index: 2, distance_from_prev_ft: 2640 }
              as: SignalOpsAdmin
              captures: { m2_seq: $.data.sequence_index }
            - call: "GET /signal-ops/corridors/${c1_id}/members"
              payload: {}
              as: SignalOpsAdmin
              captures: { members_total: $.total_count, seq0: "$.data[0].sequence_index", seq1: "$.data[1].sequence_index" }
            - call: "GET /signal-ops/corridors/${c1_id}"
              payload: {}
              as: SignalOpsAdmin
              captures: { mc_final: $.data.member_count }
          assert:
            - "${mc0} == 0"
            - "${e_gap} == ERR_SEQUENCE_INDEX_GAP with HTTP 422 — 3 is not 0 + 1, and the corridor's member_count stays 0 so the following index-1 enrolment is still legal"
            - "${m1_seq} == 1 — the satisfaction case"
            - "${e_repeat} == ERR_SEQUENCE_INDEX_GAP — index 1 is now taken; the next legal value is exactly 2"
            - "${e_dupe} == ERR_DUPLICATE_CORRIDOR_MEMBER with HTTP 409 — i1 is already enrolled, and this is checked even though sequence_index 2 was correct"
            - "${m2_seq} == 2, ${members_total} == 2, ${seq0} == 1, ${seq1} == 2 and ${mc_final} == 2 — the three refused calls left no rows and no counter drift"

      - name: tod_window_overlap_is_half_open_per_intersection
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: timing_plan_tod_windows_half_open_zero_buffer_per_intersection
          rationale: "ERR_TOD_WINDOW_OVERLAP (priority 66) is the scaffold's resource_temporal_overlap rule for TimingPlan. That §1.8 instance already submits an abutting window at exactly tod_end_min, a one-minute overlap, and the same window at a different intersection, which is the complete violation/satisfaction pair for this validation."

      - name: travel_time_run_spacing_needs_a_two_minute_buffer
        claim_type: temporal_validation
        excluded_because:
          difficulty_instance: travel_time_run_intervals_closed_with_120_second_buffer_per_project_direction
          rationale: "ERR_RUN_SPACING_VIOLATION (priority 67) is the second resource_temporal_overlap rule, with closed intervals and a 120-second buffer scoped per (project, direction). That §1.8 instance covers the exactly-120 s satisfaction case, the 119 s violation and the cross-direction non-conflict."

      - name: select_decision_below_the_threshold_is_refused
        claim_type: violation_to_error
        excluded_because:
          difficulty_instance: selection_decision_at_exactly_the_fifty_point_zero_score_threshold
          rationale: "ERR_SCORE_BELOW_SELECT_THRESHOLD (priority 76) is a >= 50.00 comparison against the programming-variant score. That §1.8 boundary_precision_check instance decides at exactly 50.00, at 49.99 and at the DEFER path, which is both halves of this validation."

      - name: screening_with_no_eligible_member_is_refused
        claim_type: aggregate_validation
        excluded_because:
          difficulty_instance: screen_zero_cardinality_eligible_member_set_rejected
          rationale: "ERR_NO_ELIGIBLE_MEMBERS (priority 75) is an aggregate cardinality gate over the member set. That §1.8 instance screens a corridor with zero members and one whose only members are BLOCKED, and contrasts both against a corridor holding a single RESTRICTED member that does screen."

      - name: posture_gate_versus_plan_state_gate_ordering
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: certify_state_gate_priority_40_beats_posture_gate_priority_55_rejected
          rationale: "The ERR_POSTURE_BLOCKS_CERTIFICATION rule at priority 55 only ever surfaces when the priority-40 plan-state gate is satisfied. That §1.8 priority_pair_validation_conflict instance constructs a plan that violates both and asserts ERR_PLAN_NOT_SUBMITTED, then repairs the state gate to expose the posture error."

      - name: before_study_gate_versus_study_window_gate_ordering
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: advance_before_study_priority_60_beats_study_window_priority_65_rejected
          rationale: "ERR_BEFORE_STUDY_INCOMPLETE (60) and ERR_STUDY_WINDOW_EXPIRED (65) can be violated simultaneously on one advance. That §1.8 instance asserts the 60 error wins on the doubly-violating call and that the 65 error appears only after the study is completed."

      - name: complaint_link_must_match_the_project_corridor
        claim_type: cross_entity_validation
        excluded_because:
          difficulty_instance: complaint_link_depends_on_project_corridor_identity_and_terminality
          rationale: "ERR_COMPLAINT_PROJECT_MISMATCH (priority 63) compares CitizenComplaint.corridor_id against RetimingProject.corridor_id and additionally rejects terminal projects. That §1.8 cross_entity_state_dependency instance links across a mismatched corridor, against an ABANDONED project on the right corridor, and finally on the happy path."

  # =============================================================================================
  # SECTION 5 — endpoints
  # Walks Table-5's Standard CRUD, Action endpoint, Bulk action, Cross-reference link,
  # Computed read and Conditional action rows over §1.5's 60 endpoints.
  # =============================================================================================
  - section: endpoints
    instances:
      - name: patch_intersection_is_a_partial_update_over_its_six_declared_inputs
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /signal-ops/intersections/{id}]
          - endpoints[GET /signal-ops/intersections/{id}]
          - entities.Intersection
        distinguishing_aspect: "PATCH is partial over exactly the six declared inputs: a body carrying one field leaves the other five untouched and leaves location_name and controller_type — which PATCH does not accept at all — unchanged, while still recomputing operational_posture and bumping version by exactly 1. A full-replace implementation would blank the omitted fields, and an implementation that accepted location_name would let the immutable identity of the intersection drift."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "Intersection i1 is created with every optional input supplied explicitly."
          setup_api_calls:
            - call: "POST /signal-ops/intersections"
              payload: { location_name: "Main St @ 1st Ave", controller_type: "TS2_CABINET", detection_status: "FULL", comm_status: "ONLINE", aps_installed: false, walking_speed_standard: "STD_3_5_FPS", pedestrian_recall: true, max_cycle_length_sec: 150 }
              as: SignalOpsAdmin
              captures: { i1_id: $.data.id, v0: $.data.version, created0: $.data.created_at }
          trigger:
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { max_cycle_length_sec: 120 }
              as: SignalOpsAdmin
              captures: { p_max: $.data.max_cycle_length_sec, p_loc: $.data.location_name, p_ctrl: $.data.controller_type, p_det: $.data.detection_status, p_comm: $.data.comm_status, p_aps: $.data.aps_installed, p_std: $.data.walking_speed_standard, p_recall: $.data.pedestrian_recall, p_posture: $.data.operational_posture, v1: $.data.version }
            - call: "PATCH /signal-ops/intersections/${i1_id}"
              payload: { detection_status: "PARTIAL", pedestrian_recall: false }
              as: SignalOpsAdmin
              captures: { q_det: $.data.detection_status, q_recall: $.data.pedestrian_recall, q_max: $.data.max_cycle_length_sec, q_posture: $.data.operational_posture, v2: $.data.version }
            - call: "GET /signal-ops/intersections/${i1_id}"
              payload: {}
              as: TimingEngineer
              as_user_id: "eng-1"
              captures: { g_loc: $.data.location_name, g_det: $.data.detection_status, g_max: $.data.max_cycle_length_sec, g_recall: $.data.pedestrian_recall, g_created: $.data.created_at, g_v: $.data.version, g_age: $.data.timing_plan_age_days }
          assert:
            - "${v0} == 1 and the create echoes every supplied field"
            - "after the single-field PATCH: ${p_max} == 120 while ${p_loc} == Main St @ 1st Ave, ${p_ctrl} == TS2_CABINET, ${p_det} == FULL, ${p_comm} == ONLINE, ${p_aps} == false, ${p_std} == STD_3_5_FPS and ${p_recall} == true are all unchanged; ${p_posture} == READY and ${v1} == 2"
            - "after the two-field PATCH: ${q_det} == PARTIAL, ${q_recall} == false, ${q_max} == 120 (carried over from the previous PATCH, not reset), ${q_posture} == RESTRICTED and ${v2} == 3"
            - "the GET is byte-consistent with the last PATCH response: ${g_loc} == Main St @ 1st Ave, ${g_det} == PARTIAL, ${g_max} == 120, ${g_recall} == false, ${g_v} == 3 and ${g_age} == 3650"
            - "${g_created} == ${created0} — created_at is never rewritten by a PATCH, and no DELETE route exists for Intersection in §1.5, so the row cannot be removed"

      - name: pedestrian_checks_are_a_computed_read_produced_by_the_pipeline
        claim_type: computed_read
        grounds:
          - endpoints[GET /signal-ops/timing-plans/{id}/pedestrian-checks]
          - calculations.pedestrian_clearance_requirement
          - entities.PedestrianComplianceCheck
        distinguishing_aspect: "There is no POST for PedestrianComplianceCheck anywhere in §1.5: the rows only come into existence as step 6 of the coordination pipeline, one per pedestrian PhaseSplit, and the GET is a pure read that recomputes nothing and bumps no version. The row records BOTH sides of all three sub-checks (required vs provided), and provided_phase_length_sec is the POST-rescale effective split (34), not the drafted 30."
        test_recipe:
          setup:
            - "Clock at its startup default 2026-08-01T00:00:00Z."
            - "CHAIN-IMPL through coordinate on a single-intersection ARTERIAL corridor; the intersection has aps_installed false and walking_speed_standard STD_3_5_FPS."
            - "Plan tp1 has phases 1/2/4/6 at 21/30/22/22 with phase 2 flagged as the pedestrian phase (crosswalk 62 ft, walk 7.0, ped_clear 20.0) and holding the greatest min_green so it receives the +1 residual."
          setup_api_calls:
