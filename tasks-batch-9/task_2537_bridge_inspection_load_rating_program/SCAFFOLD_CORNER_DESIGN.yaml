              payload: { expected_bridge_version: "${br_v2}", source_inspection_id: "${ins_id}", method: "LRFR", rating_vehicle: "HL93", capacity_c_kn_m: 2000, dead_load_dc_kn_m: 465.6, dead_load_dw_kn_m: 33.5, live_load_ll_kn_m: 500 }
