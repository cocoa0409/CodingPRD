              as: Account
              as_user_id: "${acct_id}"
              captures: { first_reminder_at: $.data.last_reminder_at }
            - call: "POST /esign/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T23:59:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /esign/envelopes/${env_id}/reminders"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { err_code: $.data.error_id }
          assert:
            - "Recipient.${rec_id}.last_reminder_at == \"2026-09-02T00:00:00Z\" before the trigger"
            - "response error_id == \"ERR_REMINDER_COOLDOWN\"  (23h59m after the prior reminder is inside the closed-open 24-hour buffer)"
            - "http status == 409"
  - rule_id: compensating_invariant
    instances:
      - name: void_with_refund_restores_account_credit_exactly
        grounds:
          - state_machines.Envelope.SENT_to_VOIDED
          - calculations.credit_spend_consumption
          - entities.Account.fields.credit_balance
        distinguishing_aspect: |
          The conserved quantity is spendable credit: send debits exactly
          credit_spend_consumption(Envelope) and a void with refund_credit true credits exactly
          the same computed value back, so Account.credit_balance after the pair equals its value
          before the send with zero drift — the invariant is
          credit_balance_after == credit_balance_before + 0.
        test_recipe:
          setup:
            - "one STANDARD account with page_allowance 25 seeded to a known credit_balance"
            - "one CREATED SEQUENTIAL envelope holding three 70-page documents (210 pages) and 6 signer/approver recipients, so credit_spend_consumption is 21"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Std Co", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Refund invariant envelope", routing_mode: "PARALLEL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "D1.pdf", page_count: 70 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { d1_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "D2.pdf", page_count: 70 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { d2_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "D3.pdf", page_count: 70 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { d3_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "r1@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "r2@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "r3@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "r4@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "APPROVER", email: "r5@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "APPROVER", email: "r6@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${d1_id}", recipient_id: "${r1_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "R1" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${d2_id}", recipient_id: "${r2_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 2, value: "R2" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "GET /esign/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_start: $.data.credit_balance }
          trigger:
            - call: "POST /esign/envelopes/${env_id}/send"
              payload: {}
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_v: $.data.version }
            - call: "POST /esign/envelopes/${env_id}/void"
              payload: { expected_envelope_version: "${env_v}", void_reason: "issued in error", refund_credit: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_v_void: $.data.version }
          assert:
            - "Account.${acct_id}.credit_balance == ${bal_start}  (send debited 21 and void-with-refund credited 21, so the balance is unchanged)"
            - "the debit equals credit_spend_consumption: page_overage = ceil(max(0, 210 - 25) / 10) = 19; recipient_overage = max(0, 6 - 5) = 1; base = 1 + 19 + 1 = 21"
            - "Envelope.${env_id}.status == \"VOIDED\" and no residual debit remains"
      - name: unsent_envelope_cancel_leaves_credit_untouched
        grounds:
          - state_machines.Envelope.CREATED_to_SENT
          - state_machines.Envelope.SENT_to_VOIDED
          - calculations.credit_spend_consumption
          - entities.Account.fields.credit_balance
        distinguishing_aspect: |
          The conserved quantity is again spendable credit but the invariant is the null-action
          form: creating, assembling and then never sending an envelope must debit nothing, so
          Account.credit_balance after the whole draft-plus-abandon sequence equals its value at
          account creation (1000) with zero drift — the quantity conserved across a sequence of
          non-transitions.
        test_recipe:
          setup:
            - "one STANDARD account created with the default credit_balance 1000 and never adjusted"
            - "one SEQUENTIAL envelope drafted with several large documents and recipients, but never sent"
          setup_api_calls:
            - call: "POST /esign/accounts"
              payload: { name: "Std Co", state_code: "CA", tier: "STANDARD", page_allowance: 25 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /esign/retention-policies"
              payload: { name: "Std Retention", scope: "GLOBAL", retention_years: 3, purge_mode: "ANONYMIZE_METADATA", purge_grace_days: 0 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /esign/envelopes"
              payload: { sender_account_id: "${acct_id}", subject: "Never sent envelope", routing_mode: "SEQUENTIAL", expires_after_days: 120, sender_visible_window_days: 30, retention_policy_id: "${policy_id}" }
              as: Account
              as_user_id: "${acct_id}"
              captures: { env_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/documents"
              payload: { name: "Big.pdf", page_count: 400 }
              as: Account
              as_user_id: "${acct_id}"
              captures: { doc_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/recipients"
              payload: { role: "SIGNER", email: "never@example.com", routing_order: 1, auth_level: "EMAIL_ACCESS", consent_accepted: true }
              as: Account
              as_user_id: "${acct_id}"
              captures: { rec_id: $.data.id }
            - call: "POST /esign/envelopes/${env_id}/fields"
              payload: { envelope_document_id: "${doc_id}", recipient_id: "${rec_id}", field_type: "SIGNATURE", required: true, page_number: 1, tab_order: 1, value: "Never" }
              as: Account
              as_user_id: "${acct_id}"
            - call: "GET /esign/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_before_send: $.data.credit_balance }
          trigger:
            - call: "GET /esign/accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bal_after: $.data.credit_balance }
          assert:
            - "Account.${acct_id}.credit_balance == 1000  (no send occurred, so credit_spend_consumption was never debited)"
            - "Envelope.${env_id}.status == \"CREATED\"  (still a draft)"
            - "Account.${acct_id}.credit_balance == ${bal_before_send}  (the draft sequence is credit-neutral)"