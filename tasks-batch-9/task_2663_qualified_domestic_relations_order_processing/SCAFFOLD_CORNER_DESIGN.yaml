              as: QdroAnalyst
              captures: { caseA2: $.data.id, caseA2_v: $.data.version }
            - call: "POST /qdro-cases"
              payload: { participant_id: "${partB}", alternate_payee_name: "Other AP", valuation_date: "2026-06-30", marital_period_start: "2002-01-01", marital_period_end: "2010-01-01", alternate_payee_dob: "1977-07-07", alternate_payee_address_on_file: true }
              as: QdroAnalyst
