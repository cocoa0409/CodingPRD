            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub3}", route_id: "${route_a}", service_date: "2026-05-25" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t_new: $.data.id, t_new_st: $.data.status } }
          assert:
            - "capture ${st3} == REJECTED_CONTAMINATION"
            - "capture ${sub1_st} == SUSPENDED"
            - "capture ${st4} == SKIPPED"
            - "capture ${t_new_st} == SCHEDULED"
            - "PickupTicket.${u1}.status == SCHEDULED"

      - name: subscription_cancel_releases_slot_promotes_waitlist
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - state_machines.SurgeBooking.CONFIRMED_to_CANCELLED
          - state_machines.SurgeBooking.WAITLISTED_to_CONFIRMED
          - calculations.surge_slot_allocation
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (POST /subscriptions/{id}/cancel):
          cancellation cancels the household's CONFIRMED surge booking (hop 1)
          -> released slot decrements reserved_slots (hop 2) -> the
          earliest-created WAITLISTED booking is promoted to CONFIRMED and
          reserved_slots rises again (hop 3).
        test_recipe:
          setup:
            - "Universal zone; households A and B with auto-ACTIVE 2026 subscriptions"
            - "LEAF_SURGE event capacity_slots 1, booking window 2026-10-01..2026-11-01, service_date 2026-11-07"
            - "Clock 2026-10-15 (event OPEN); A's booking CONFIRMED; B's booking WAITLISTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "South", service_model: "UNIVERSAL", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 9000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_u: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /households", payload: { address_line: "2 Elm St", zone_id: "${zone_u}" }, as: Anonymous, captures: { hh_b: $.data.id, hh_b_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_b}", season_year: 2026, expected_household_version: "${hh_b_v}" }, as: Resident, as_user_id: "${hh_b}", captures: { sub_b: $.data.id } }
            - { call: "POST /surge-events", payload: { zone_id: "${zone_u}", event_type: "LEAF_SURGE", service_date: "2026-11-07", capacity_slots: 1, booking_window_start: "2026-10-01T00:00:00Z", booking_window_end: "2026-11-01T00:00:00Z" }, as: ProgramAdmin, captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /surge-bookings", payload: { surge_event_id: "${ev}", household_id: "${hh_a}", quantity_bundles: 3, expected_surge_event_version: "${ev_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { bk_a: $.data.id } }
            - { call: "GET /surge-events/${ev}", as: ProgramAdmin, captures: { ev_v2: $.data.version } }
            - { call: "POST /surge-bookings", payload: { surge_event_id: "${ev}", household_id: "${hh_b}", quantity_bundles: 2, expected_surge_event_version: "${ev_v2}" }, as: Resident, as_user_id: "${hh_b}", captures: { bk_b: $.data.id, bk_b_st: $.data.status } }
          trigger:
            - { call: "POST /subscriptions/${sub_a}/cancel", payload: {}, as: Resident, as_user_id: "${hh_a}" }
          assert:
            - "precondition capture ${bk_b_st} == WAITLISTED"
            - "SurgeBooking.${bk_a}.status == CANCELLED"
            - "SurgeBooking.${bk_b}.status == CONFIRMED"
            - "SurgeEvent.${ev}.reserved_slots == 1"
            - "Subscription.${sub_a}.status == CANCELLED"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: booking_state_trumps_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_SUBSCRIPTION_NOT_ACTIVE]
          - errors[ERR_OUTSTANDING_BALANCE]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the booking request violates
          BOTH ERR_SUBSCRIPTION_NOT_ACTIVE (SUSPENDED, priority 7) and
          ERR_OUTSTANDING_BALANCE (2000-cent unpaid reinstatement surcharge,
          priority 12); the state error MUST win.
        test_recipe:
          setup:
            - "Clock 2026-05-18; opt-in household with paid ACTIVE subscription (13500), then 3 TAGGED_REJECTED inspections -> SUSPENDED with outstanding surcharge 2000"
            - "LEAF_SURGE event in the same zone, capacity 5, booking window open at clock 2026-10-15"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /service-zones", payload: { name: "North", service_model: "OPT_IN", season_start_date: "2026-05-01", season_end_date: "2026-10-31", base_seasonal_fee_cents: 12000, universal_flat_credit_cents: 500, max_strikes_per_season: 3 }, as: ProgramAdmin, captures: { zone_o: $.data.id } }
            - { call: "POST /households", payload: { address_line: "1 Oak St", zone_id: "${zone_o}" }, as: Anonymous, captures: { hh_a: $.data.id, hh_a_v: $.data.version } }
            - { call: "POST /subscriptions", payload: { household_id: "${hh_a}", season_year: 2026, expected_household_version: "${hh_a_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { sub_a: $.data.id } }
            - { call: "POST /carts", payload: { household_id: "${hh_a}", subscription_id: "${sub_a}", size_gallons: "64" }, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /subscriptions/${sub_a}/pay", payload: { use_credit_balance: false }, as: Resident, as_user_id: "${hh_a}" }
            - { call: "POST /routes", payload: { zone_id: "${zone_o}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
            - { call: "POST /routes/${route_a}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-04" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t1: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-11" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t2: $.data.id } }
            - { call: "POST /pickup-tickets", payload: { subscription_id: "${sub_a}", route_id: "${route_a}", service_date: "2026-05-18" }, as: RouteSupervisor, as_user_id: "sup_1", captures: { t3: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-18T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t1}", result: "TAGGED_REJECTED", violation_codes: ["PLASTIC_BAG"] }, as: FieldInspector, as_user_id: "insp_1" }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t2}", result: "TAGGED_REJECTED", violation_codes: ["FOOD_WASTE"] }, as: FieldInspector, as_user_id: "insp_1" }
            - { call: "POST /contamination-inspections", payload: { pickup_ticket_id: "${t3}", result: "TAGGED_REJECTED", violation_codes: ["DIRT_ROCK"] }, as: FieldInspector, as_user_id: "insp_1" }
            - { call: "POST /surge-events", payload: { zone_id: "${zone_o}", event_type: "LEAF_SURGE", service_date: "2026-11-07", capacity_slots: 5, booking_window_start: "2026-10-01T00:00:00Z", booking_window_end: "2026-11-01T00:00:00Z" }, as: ProgramAdmin, captures: { ev: $.data.id, ev_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /surge-bookings", payload: { surge_event_id: "${ev}", household_id: "${hh_a}", quantity_bundles: 2, expected_surge_event_version: "${ev_v}" }, as: Resident, as_user_id: "${hh_a}", captures: { err: $.data.error_id } }
          assert:
            - "capture ${err} == ERR_SUBSCRIPTION_NOT_ACTIVE"
            - "Subscription.${sub_a}.status == SUSPENDED"
            - "Subscription.${sub_a}.total_due_cents - Subscription.${sub_a}.paid_cents == 2000"

      - name: receive_safety_trumps_referential
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_LOAD_SAFETY_LIMIT_EXCEEDED]
          - errors[ERR_ROUTE_NOT_PUBLISHED]
        distinguishing_aspect: |
          Category pair business_safety vs business_referential: the receive
          ACCEPT violates BOTH the contamination safety limit (6 > 5,
          priority 8) and the route-still-PUBLISHED referential check (route
          auto-archived after its effective window, priority 11); the safety
          error MUST win.
        test_recipe:
          setup:
            - "Opt-in zone; route window [2026-05-01, 2026-08-01) published; facility capacity 50000, safety limit 5"
            - "Delivery scheduled for 2026-06-15 10:00-11:00 while route PUBLISHED"
            - "Clock advanced to 2026-08-15 so the route has auto-archived"
          setup_api_calls:
