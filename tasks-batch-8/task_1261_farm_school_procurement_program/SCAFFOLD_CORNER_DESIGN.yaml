      - name: sm_agreement_create_requires_verified_offering
        claim_type: precondition_enforcement
        grounds:
          - errors[ERR_OFFERING_NOT_VERIFIED]
        distinguishing_aspect: "Cross-entity guard at creation: an agreement against a merely SUBMITTED offering fails ERR_OFFERING_NOT_VERIFIED."
