          - entities.Venue.fields.catch_fence_max_height_ft
          - global_constants.HEAVY_VEHICLE_LBS
        distinguishing_aspect: "The fence rule is two-sided and both sides live on OTHER entities: the floor comes from whether any VehicleEntry of the stop weighs at least HEAVY_VEHICLE_LBS (6 ft becomes 8 ft), and the ceiling comes from the booked Venue.catch_fence_max_height_ft. A plan that legitimately passed submit becomes uncertifiable because a heavy rig was entered in between, and over-building the fence to 11 ft on a 10 ft building fails with the very same error code."
        test_recipe:
          setup:
            - "A CONFIRMED ATL booking (Venue.catch_fence_max_height_ft == 10) with its TourStop and show timing, and no ticket tiers, so expected_attendance is 0"
