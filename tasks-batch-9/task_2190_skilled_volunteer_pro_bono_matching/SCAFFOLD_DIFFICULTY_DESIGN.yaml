      - name: repeated_termination_does_not_release_twice
        grounds:
          - invariants.INV_CYCLE_SLOT_CONSERVATION
          - invariants.INV_VOLUNTEER_HOUR_CONSERVATION
          - validations.priority_23_ERR_INVALID_WORK_STATE
        distinguishing_aspect: |
          The other instances test that the release happens; this one tests that it happens at
          most ONCE. The compensating operation is replayed verbatim on an already-TERMINATED
          engagement, so the state guard (priority 23, terminate requires a non-terminal
          work_status) must fire BEFORE any decrement runs - the refusal and the untouched
          counters are one requirement, not two.
          Arithmetic on the canonical world (capacity_slot_total 10, hours_offered 300.00,
          committed 40.00):
            after terminate #1 -> slots_committed 0, slots_reserved 0, slots_available 10,
                                  utilization_ratio round(0/10,4) = 0.0000, posture OPEN,
                                  hours_committed 0.00, hours_remaining 300.00,
                                  terminal_engagement_count 1,
                                  reliability points = max(0.00, round(0.25 - 0.10*0, 4)) = 0.2500
                                  (termination_reason ADMIN base 0.25) -> reliability_score
                                  round(1.000000*0.2500/1.000000, 4) = 0.2500 -> below
                                  RELIABILITY_FLOOR 0.4000 -> status PAUSED
            terminate #2       -> refused 409 ERR_INVALID_WORK_STATE, and every figure above is
                                  byte-identical afterwards
          A double-releasing implementation produces slots_committed -1 and slots_available 11
          (which breaks -1 + 0 + 11 == 10 only in sign, but violates the requirement that
          committed never goes negative and available never exceeds capacity_slot_total 10),
          hours_committed -40.00 with hours_remaining round(300.00 - -40.00, 2) = 340.00 - i.e.
          the volunteer is credited 40.00 hours of capacity that never existed - and
          terminal_engagement_count 2, which drags reliability_score through a second averaging
          pass. An implementation that swallows the replay with a 200 and no state change is also
          wrong: the exact error id is required.
