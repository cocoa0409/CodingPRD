  - rule_id: compensating_invariant
    instances:
      - name: renewal_payment_then_refund_leaves_establishment_net_fees_at_zero
        grounds:
          - state_machines.RenewalApplication.SUBMITTED_to_DENIED
          - entities.RenewalApplication.fields.fee_paid_cents
          - entities.RenewalApplication.fields.fee_refunded_cents
          - entities.Establishment.fields.fees_paid_cents
          - entities.Establishment.fields.fees_refunded_cents
          - endpoints["POST /body-art/renewal-applications/{renewal_application_id}/refund"]
        distinguishing_aspect: |
          Conserved quantity is MONEY: the named invariant
          Establishment.fees_paid_cents - Establishment.fees_refunded_cents must equal
          the sum over RenewalApplication of (fee_paid_cents - fee_refunded_cents), and the
          payment/refund pair must return that net figure to its pre-payment value of 0 with
          no drift, even though both gross counters end at 26875.
        test_recipe:
          setup:
            - "An ACTIVE Establishment whose fees_paid_cents and fees_refunded_cents are both 0."
            - "A RenewalApplication SUBMITTED with fee_estimate_cents 26875 (zero ACTIVE artists), paid in full and then DENIED, so a refund is permitted."
          setup_api_calls:
            - call: "POST /body-art/establishments"
              payload: { name: "Ledger Ink", street_address: "6 Cypress Ct", county_code: "ADA", establishment_type: "TATTOO" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_id: $.data.id }
            - call: "POST /body-art/plan-reviews"
              payload: { establishment_id: "${est_id}", floor_plan_reference: "FP-1600", sterilization_area_sqft: 43, procedure_station_count: 1, has_handwash_sink: true }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { pr_id: $.data.id }
            - call: "POST /body-art/plan-reviews/${pr_id}/decision"
              payload: { decision: "APPROVE", decision_notes: "Approved" }
              as: PlanReviewer
              as_user_id: "reviewer-1"
            - call: "POST /body-art/inspections"
              payload: { establishment_id: "${est_id}", inspection_type: "PREOPENING", scheduled_start_at: "2026-05-01T00:00:00Z", scheduled_end_at: "2026-05-01T02:00:00Z" }
              as: Inspector
              as_user_id: "officer-insp-1"
              captures: { ins_pre_id: $.data.id }
            - call: "POST /body-art/inspections/${ins_pre_id}/start"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/inspections/${ins_pre_id}/finalize"
              payload: {}
              as: Inspector
              as_user_id: "officer-insp-1"
            - call: "POST /body-art/establishments/${est_id}/activate"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { est_v: $.data.version, paid_before: $.data.fees_paid_cents, refunded_before: $.data.fees_refunded_cents }
            - call: "POST /body-art/renewal-applications"
              payload: { establishment_id: "${est_id}", requested_term_start_on: "2027-05-01T00:00:00Z", attested_bbp_current: true, attested_sterilization_logs_complete: true, expedite_requested: false, expected_establishment_version: "${est_v}" }
              as: EstablishmentOperator
              as_user_id: "${est_id}"
              captures: { ra_id: $.data.id }
            - call: "POST /body-art/renewal-applications/${ra_id}/submit"
              payload: {}
              as: EstablishmentOperator
              as_user_id: "${est_id}"
            - call: "POST /body-art/renewal-applications/${ra_id}/payment"
              payload: { amount_cents: 26875 }
              as: RecordsClerk
              as_user_id: "clerk-1"
            - call: "GET /body-art/establishments/${est_id}"
              payload: {}
              as: HealthOfficer
              as_user_id: "officer-ho-1"
              captures: { paid_mid: $.data.fees_paid_cents, refunded_mid: $.data.fees_refunded_cents }
            - call: "POST /body-art/renewal-applications/${ra_id}/review"
              payload: { decision: "DENY" }
              as: HealthOfficer
              as_user_id: "officer-ho-1"
          trigger:
            - call: "POST /body-art/renewal-applications/${ra_id}/refund"
              payload: {}
              as: RecordsClerk
              as_user_id: "clerk-1"
              captures: { ra_paid: $.data.fee_paid_cents, ra_ref: $.data.fee_refunded_cents, ra_pay_status: $.data.payment_status }
          assert:
            - "${paid_before} == 0 and ${refunded_before} == 0"
            - "${paid_mid} == 26875 and ${refunded_mid} == 0"
            - "${ra_paid} == 26875"
            - "${ra_ref} == 26875"
            - "${ra_pay_status} == REFUNDED"
            - "Establishment.${est_id}.fees_paid_cents == 26875"
            - "Establishment.${est_id}.fees_refunded_cents == 26875"
            - "Establishment.${est_id}.fees_paid_cents - Establishment.${est_id}.fees_refunded_cents == 0, identical to the pre-payment net of 0"
            - "RenewalApplication.${ra_id}.status == DENIED"

      - name: violation_issue_then_verified_correction_returns_open_counts_to_baseline
        grounds:
          - state_machines.Violation.null_to_ISSUED
          - state_machines.Violation.CORRECTION_SUBMITTED_to_VERIFIED
          - entities.Establishment.fields.open_violation_count
          - entities.Establishment.fields.open_critical_violation_count
          - calculations.establishment_risk_score
        distinguishing_aspect: |
          Conserved quantity is a COUNT, not money: the named invariant
          Establishment.open_violation_count == count(Violation reachable through this
          establishment's inspections with status in {ISSUED, CORRECTION_SUBMITTED,
          ESCALATED}) must return to its pre-issuance value of 0 after the
          issue-correct-verify compensating pair, dragging risk_score back to exactly 25.
        test_recipe:
          setup:
            - "An ACTIVE Establishment with no sterilization records, so risk_score is 25 and open_violation_count is 0."
            - "A ROUTINE inspection IN_PROGRESS at logical clock 2026-05-05."
