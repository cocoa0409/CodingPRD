  - rule_id: boundary_precision_check
    instances:
      - name: triage_urgency_multiplier_at_exactly_fourteen_days
        grounds:
          - calculations.request_priority_score
          - entities.ResearchRequest.fields.priority_score
          - entities.RoadmapDecision.fields.decision_deadline
        distinguishing_aspect: |
          Boundary on the days_to_deadline metric at POST /research-requests/{id}/triage: a deadline
          exactly URGENCY_TIER_1_DAYS (14) days out takes the 1.30 multiplier (97.50) while 15 days out
          takes 1.15 (86.25), so the tier test is `<=` and not `<`.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z"
            - "Two IRREVERSIBLE decisions with 12000 impacted users, deadlines 2026-08-15T00:00:00Z and 2026-08-16T00:00:00Z"
            - "One SUBMITTED request with evidence_gap FULL against each decision"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /roadmap-decisions"
              payload: { title: "Decision at fourteen days", reversibility: "IRREVERSIBLE", decision_deadline: "2026-08-15T00:00:00Z", impacted_user_count: 12000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_14: $.data.id }
            - call: "POST /roadmap-decisions"
              payload: { title: "Decision at fifteen days", reversibility: "IRREVERSIBLE", decision_deadline: "2026-08-16T00:00:00Z", impacted_user_count: 12000 }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { dec_15: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_14}", question: "What blocks activation this month?", question_type: "DISCOVERY", evidence_gap: "FULL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_14: $.data.id }
            - call: "POST /research-requests"
              payload: { roadmap_decision_id: "${dec_15}", question: "What blocks activation next month?", question_type: "DISCOVERY", evidence_gap: "FULL" }
              as: Stakeholder
              as_user_id: "u_stake_1"
              captures: { req_15: $.data.id }
          trigger:
            - call: "POST /research-requests/${req_14}/triage"
              payload: { outcome: "APPROVED" }
              as: ResearchLead
              as_user_id: "u_lead_1"
              captures: { score_14: $.data.priority_score }
            - call: "POST /research-requests/${req_15}/triage"
              payload: { outcome: "APPROVED" }
              as: ResearchLead
              as_user_id: "u_lead_1"
              captures: { score_15: $.data.priority_score }
          assert:
            - "ResearchRequest.${req_14}.priority_score == 97.50 (base 75.00 times the 1.30 tier at exactly 14 days)"
            - "ResearchRequest.${req_15}.priority_score == 86.25 (base 75.00 times the 1.15 tier at 15 days)"
            - "Both requests have recommended_method == INTERVIEW and approved_method == INTERVIEW"
            - "The 14-day request scored strictly higher than the 15-day request: 97.50 > 86.25"
