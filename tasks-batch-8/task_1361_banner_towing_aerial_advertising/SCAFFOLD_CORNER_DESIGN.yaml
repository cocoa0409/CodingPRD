# =============================================================================
# §1.9 — Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Enumerates testable claims §1.8 does not already cover.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # From Table 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: base_creation_stores_input_fields_and_defaults
        claim_type: creation
        grounds:
          - entities.Base
        distinguishing_aspect: "POST /btaa/bases with required fields returns 201 with id, status=ACTIVE, version=1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /btaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /btaa/bases"
              payload: { code: "KMYB", name: "Myrtle Beach" }
              as: PlatformAdmin
              captures: { bid: $.data.id, status: $.data.status, ver: $.data.version }
          assert:
            - "status == ACTIVE"
            - "ver == 1"

      - name: base_get_by_id_returns_persisted_fields
        claim_type: retrieval
        grounds:
          - entities.Base
          - endpoints["GET /btaa/bases/{id}"]
        distinguishing_aspect: "GET returns the same code/name as POSTed."
        test_recipe:
          setup: ["Base B1 created"]
          setup_api_calls:
            - call: "POST /btaa/bases"
              payload: { code: "KMYB", name: "Myrtle Beach" }
              as: PlatformAdmin
              captures: { bid: $.data.id }
          trigger:
            - call: "GET /btaa/bases/${bid}"
              payload: {}
              as: PlatformAdmin
              captures: { code: $.data.code }
          assert:
            - "code == KMYB"

      - name: base_get_nonexistent_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Unknown base id → 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /btaa/bases/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: aircraft_creation_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - entities.Aircraft
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required hourly_rate_cents → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Base B1 exists"]
          setup_api_calls:
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
              as: PlatformAdmin
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /btaa/bases/${bid}/aircraft"
              payload: { tail_number: "N1", model: "CITABRIA", max_tow_weight_lbs: 500 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: pilot_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Pilot
          - errors[ERR_INVALID_ENUM]
        distinguishing_aspect: "tow_endorsement_level=SUPERPILOT (not in enum) → ERR_INVALID_ENUM."
        test_recipe:
          setup: ["Base B1 exists"]
          setup_api_calls:
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
              as: PlatformAdmin
              captures: { bid: $.data.id }
          trigger:
            - call: "POST /btaa/bases/${bid}/pilots"
              payload: { full_name: "P", certificate_number: "C", tow_endorsement_level: "SUPERPILOT" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_ENUM"

      - name: weather_assessment_immutable_no_update_endpoint
        claim_type: immutability
        grounds:
          - entities.WeatherAssessment
        distinguishing_aspect: "WeatherAssessment has common_fields=false; no PUT/PATCH endpoint exists; attempts to modify it return 404 (no route)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /btaa/flight_slots/00000000-0000-0000-0000-000000000000/weather_assessments"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

  # ===========================================================================
  # From Table 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: campaign_draft_book_without_slots_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Campaign.DRAFT_to_BOOKED
        distinguishing_aspect: "Booking a campaign with zero BOOKED slots must fail."
        test_recipe:
          setup: ["Campaign with no slots"]
          setup_api_calls:
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
              as: PlatformAdmin
            - call: "POST /btaa/clients"
              payload: { legal_name: "C", billing_email: "c@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /btaa/clients/${cid}/campaigns"
              payload: { name: "CAM" }
              as: Client
              as_user_id: "${cid}"
              captures: { cam_id: $.data.id, cam_v: $.data.version }
          trigger:
            - call: "POST /btaa/campaigns/${cam_id}/book"
              payload: { expected_campaign_version: "${cam_v}" }
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"

      - name: cancelled_campaign_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Campaign
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: "Once CANCELLED, no further transitions are permitted."
        test_recipe:
          setup: ["Campaign CAM1 cancelled"]
          setup_api_calls:
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
              as: PlatformAdmin
            - call: "POST /btaa/clients"
              payload: { legal_name: "C", billing_email: "c@x.com" }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /btaa/clients/${cid}/campaigns"
              payload: { name: "CAM" }
              as: Client
              as_user_id: "${cid}"
              captures: { cam_id: $.data.id, cam_v: $.data.version }
            - call: "POST /btaa/campaigns/${cam_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${cid}"
          trigger:
            - call: "POST /btaa/campaigns/${cam_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${cid}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_ALREADY_TERMINAL"

      - name: schedule_booked_slot_transitions_and_campaign_state_lifts
        claim_type: side_effect_execution
        grounds:
          - state_machines.FlightSlot.BOOKED_to_SCHEDULED
          - state_machines.Campaign.BOOKED_to_IN_FLIGHT
        distinguishing_aspect: "First slot schedule drives parent campaign BOOKED → IN_FLIGHT."
        test_recipe:
          setup: ["Campaign BOOKED with one BOOKED slot"]
          setup_api_calls:
            - call: "POST /btaa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /btaa/bases"
              payload: { code: "B", name: "B" }
              as: PlatformAdmin
              captures: { base_id: $.data.id }
            - call: "POST /btaa/bases/${base_id}/aircraft"
              payload: { tail_number: "N1", model: "CITABRIA", max_tow_weight_lbs: 500, hourly_rate_cents: 30000 }
              as: PlatformAdmin
            - call: "POST /btaa/bases/${base_id}/pilots"
              payload: { full_name: "P", certificate_number: "C", tow_endorsement_level: "STANDARD" }
              as: PlatformAdmin
            - call: "POST /btaa/routes"
              payload: { code: "R", kind: "BEACH", base_id: "${base_id}", length_nm: 5, min_banner_length_ft: 10 }
              as: PlatformAdmin
              captures: { route_id: $.data.id }
            - call: "POST /btaa/clients"
              payload: { legal_name: "C", billing_email: "c@x.com" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /btaa/clients/${client_id}/campaigns"
              payload: { name: "CAM" }
              as: Client
              as_user_id: "${client_id}"
              captures: { cam_id: $.data.id, cam_v0: $.data.version }
            - call: "POST /btaa/campaigns/${cam_id}/banners"
              payload: { artwork_hash: "h", text_message: "M", banner_length_ft: 50, banner_weight_lbs: 100 }
              as: Client
              as_user_id: "${client_id}"
              captures: { ban_id: $.data.id, ban_v: $.data.version }
            - call: "POST /btaa/banners/${ban_id}/revisions"
              payload: { proposed_text: "M", proposed_artwork_hash: "h" }
              as: Client
              as_user_id: "${client_id}"
              captures: { rev_id: $.data.id }
            - call: "POST /btaa/banner_revisions/${rev_id}/approve"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /btaa/banners/${ban_id}/fabricate"
              payload: { expected_banner_version: "${ban_v} + 1" }
              as: GroundCrewLead
            - call: "POST /btaa/banners/${ban_id}/mark_ready"
              payload: {}
              as: GroundCrewLead
            - call: "POST /btaa/routes/${route_id}/airspace_approvals"
              payload: { date_local: "2026-08-13", window_start_utc: "2026-08-13T14:00:00Z", window_end_utc: "2026-08-13T18:00:00Z" }
              as: Dispatcher
              captures: { ap_id: $.data.id }
            - call: "POST /btaa/airspace_approvals/${ap_id}/grant"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /btaa/bases/${base_id}/seasonal_capacities"
              payload: { month_yyyy_mm: "2026-08", aircraft_hour_quota: 100 }
              as: PlatformAdmin
              captures: { sc_id: $.data.id, sc_v: $.data.version }
            - call: "POST /btaa/campaigns/${cam_id}/flight_slots"
              payload: { route_id: "${route_id}", airspace_approval_id: "${ap_id}", banner_id: "${ban_id}", date_local: "2026-08-13", planned_start_utc: "2026-08-13T15:00:00Z", planned_duration_hours: 1, expected_seasonal_capacity_version: "${sc_v}" }
              as: Client
              as_user_id: "${client_id}"
              captures: { slot_id: $.data.id }
            - call: "POST /btaa/campaigns/${cam_id}/book"
              payload: { expected_campaign_version: "${cam_v0} + 1" }
              as: Client
              as_user_id: "${client_id}"
          trigger:
            - call: "POST /btaa/flight_slots/${slot_id}/schedule"
              payload: {}
              as: Dispatcher
            - call: "GET /btaa/campaigns/${cam_id}"
              payload: {}
              as: PlatformAdmin
              captures: { cam_status: $.data.status }
          assert:
            - "cam_status == IN_FLIGHT"

