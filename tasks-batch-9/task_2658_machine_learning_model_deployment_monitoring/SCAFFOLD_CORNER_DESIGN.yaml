      - name: segregation_of_duties_blocks_the_registrar_and_the_submitter
        claim_type: Segregation of duties
        grounds:
          - validations.priority_20
          - validations.priority_21
          - errors.ERR_SEGREGATION_OF_DUTIES
          - complexity_profile.role_model
        distinguishing_aspect: |
          Two SoD rules keyed on X-User-ID rather than on role, tested with a user who legitimately holds
          BOTH roles: u_dual_1 registers a dataset and cannot approve it, and submits a version and cannot
          decide it. The role check at priority 2 passes in both cases, so the 403 comes from the identity
          comparison — and the identical request from a different user id succeeds, which is the only way
          to prove the rule is about identity and not about the role.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z startup default"
            - "user u_dual_1 acts as MLEngineer, DataSteward and ModelApprover in turn; u_stew_2 and u_appr_2 are independent second pairs of hands"
          setup_api_calls:
            - call: "POST /models"
              payload: { name: "fraud-scorer", task_type: "CLASSIFICATION", owner_team: "risk-ml" }
              as: MLEngineer
              as_user_id: "u_dual_1"
              captures: { m_id: $.data.id }
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: DataSteward
              as_user_id: "u_dual_1"
              captures: { ds_id: $.data.id, ds_registrar: $.data.registered_by_user_id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: DataSteward
              as_user_id: "u_dual_1"
              captures: { ds_state: $.data.approval_state }
          trigger:
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_dual_1"
              captures: { sod_dataset_err: $.data.error_id }
            - call: "POST /training-datasets/${ds_id}/decision"
              payload: { decision: "APPROVE" }
              as: DataSteward
              as_user_id: "u_stew_2"
              captures: { ds_approved: $.data.approval_state, ds_decider: $.data.decided_by_user_id }
            - call: "POST /model-versions"
              payload: { model_id: "${m_id}", training_dataset_id: "${ds_id}", semver: "1.0.0", artifact_digest: "sha256:aaa", feature_spec_hash: "fs-v1", baseline_accuracy: 0.82, baseline_positive_rate: 0.30, baseline_p95_latency_ms: 200, doc_sections: ["INTENDED_USE", "TRAINING_DATA", "EVALUATION", "LIMITATIONS"], repro_artifacts: ["TRAINING_CODE_COMMIT", "ENV_LOCKFILE_DIGEST", "RANDOM_SEED", "FEATURE_SPEC_HASH"] }
              as: MLEngineer
              as_user_id: "u_dual_1"
              captures: { v1_id: $.data.id }
            - call: "POST /model-versions/${v1_id}/submit-for-review"
              payload: {}
              as: MLEngineer
              as_user_id: "u_dual_1"
              captures: { v1_submitter: $.data.submitted_by_user_id }
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_dual_1"
              captures: { sod_version_err: $.data.error_id }
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "REQUEST_CHANGES" }
              as: ModelApprover
              as_user_id: "u_dual_1"
              captures: { sod_version_err2: $.data.error_id }
            - call: "POST /model-versions/${v1_id}/decision"
              payload: { decision: "APPROVE" }
              as: ModelApprover
              as_user_id: "u_appr_2"
              captures: { v1_state: $.data.approval_state, v1_decider: $.data.decided_by_user_id }
          assert:
            - "the dataset records registered_by_user_id 'u_dual_1' and reaches PENDING_APPROVAL"
            - "PRIORITY 20: the same user id deciding it returns HTTP 403 'ERR_SEGREGATION_OF_DUTIES' even though DataSteward is exactly the role the endpoint requires"
            - "a different steward id succeeds: approval_state 'APPROVED' with decided_by_user_id 'u_stew_2'"
            - "PRIORITY 21: the version submitted by u_dual_1 cannot be decided by u_dual_1 — HTTP 403 'ERR_SEGREGATION_OF_DUTIES'"
            - "the block is on the decision itself, not on the verdict: REQUEST_CHANGES from the submitter is refused with the same code"
            - "u_appr_2 decides the same version successfully: approval_state 'APPROVED' with decided_by_user_id 'u_appr_2'"
            - "the two refusals left the version in PENDING_REVIEW, so a rejected decision does not consume the review"

      - name: revalidation_review_cannot_be_taken_by_the_approver_who_decided_the_version
        claim_type: Segregation of duties
        grounds:
          - validations.priority_22
          - errors.ERR_SEGREGATION_OF_DUTIES
          - endpoints.POST_revalidation_tasks_disposition
          - calculations.revalidation_schedule
        distinguishing_aspect: |
          The third SoD rule reaches ACROSS entities and across time: the identity it compares is not on the
          RevalidationTask at all but on the ModelVersion the task points at, recorded 90 days earlier by a
          different endpoint. So the guard has to be resolved by following task -> version ->
          decided_by_user_id, and only the START_REVIEW action carries it.
        test_recipe:
          setup:
            - "clock walked 2026-08-01T00:00:00Z -> 2026-10-30T00:00:00Z"
            - "version 1.0.0 approved by ModelApprover u_appr_1 at 2026-08-01, giving revalidation_due_at 2026-10-30"
