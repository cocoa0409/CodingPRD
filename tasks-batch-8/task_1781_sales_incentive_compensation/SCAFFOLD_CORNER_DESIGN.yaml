          trigger:
            - { call: "POST /payroll-exports", payload: { program_id: "${ppu}", period_index: 1 }, as: CompAdmin, captures: { err_pu: $.data.error_id } }
          assert:
            - "HTTP 409, error_id == ERR_STATEMENTS_NOT_APPROVED; statement remains DRAFT; no PayrollExport created"

      - name: archive_with_active_assignment_rejected
        claim_type: violation_to_error
        grounds: ["state_machines.CompPlan.PUBLISHED_to_ARCHIVED", "errors[ERR_PLAN_HAS_ACTIVE_ASSIGNMENTS]"]
        distinguishing_aspect: "A plan with an ACTIVE assignment cannot be archived (ERR_PLAN_HAS_ACTIVE_ASSIGNMENTS); after terminating the assignment the archive succeeds."
        test_recipe:
          setup: ["published plan with one ACTIVE assignment"]
          setup_api_calls:
            - { call: "POST /programs", payload: { name: "Prog AA" }, as: CompAdmin, captures: { paa: $.data.id } }
            - { call: "POST /plans", payload: { program_id: "${paa}", name: "Plan AA", effective_start_date: "2026-01-01", effective_end_date: "2026-12-31", curve_tiers: [{ attainment_floor_bps: 0, rate_bps: 1000 }] }, as: CompAdmin, as_user_id: "admin-1", captures: { plan_aa: $.data.id } }
            - { call: "POST /plans/${plan_aa}/publish", payload: {}, as: CompAdmin, as_user_id: "admin-2" }
            - { call: "POST /reps", payload: { program_id: "${paa}", name: "Rep AA", employee_ref: "AA-R1" }, as: CompAdmin, captures: { raa: $.data.id } }
            - { call: "POST /assignments", payload: { program_id: "${paa}", rep_id: "${raa}", plan_id: "${plan_aa}", quota_cents: 1000000, effective_start_date: "2026-01-01" }, as: CompAdmin, captures: { asg_aa: $.data.id } }
          trigger:
            - { call: "POST /plans/${plan_aa}/archive", payload: {}, as: CompAdmin, captures: { err_aa: $.data.error_id } }
            - { call: "POST /assignments/${asg_aa}/terminate", payload: {}, as: CompAdmin }
            - { call: "POST /plans/${plan_aa}/archive", payload: {}, as: CompAdmin, captures: { aa_status: "$.data.status" } }
          assert:
            - "with ACTIVE assignment: HTTP 409, error_id == ERR_PLAN_HAS_ACTIVE_ASSIGNMENTS"
            - "after terminate: archive succeeds, CompPlan.${plan_aa}.status == ARCHIVED"

      - name: plan_window_overlap_error
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_WINDOW_OVERLAP]"]
