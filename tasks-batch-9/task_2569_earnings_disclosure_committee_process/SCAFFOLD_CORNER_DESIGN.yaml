      - name: cross_entity_transition_side_effect_lands_on_the_neighbouring_certification_rows
        claim_type: cross_entity
        grounds: [state_machines.MaterialEvent.NOT_REPORTABLE_to_REPORTABLE, state_machines.OfficerCertification.ELIGIBLE_to_BLOCKED]
        excluded_because:
          difficulty_instance: material_event_reassessment_cascades_three_hops_and_reverses_certification_eligibility
          rationale: |
            That §1.8 transitive_cascade instance already exercises the cross-entity side-effect pattern
            at full depth: a MaterialEvent transition adjusts ReportingCycle.open_material_event_count
            and then flips every ELIGIBLE OfficerCertification on the cycle back to BLOCKED, asserting
            both the neighbouring entity's state and its recomputed fields. A separate two-entity corner
            here would be a strict subset of it.
      - name: ledger_sync_between_child_writes_and_the_two_conserved_cycle_aggregates
        claim_type: ledger_sync
        grounds: [calculations.cycle_total_assigned_scope_weight, calculations.certification_coverage_pct]
        excluded_because:
          difficulty_instance: subcertification_withdrawal_restores_both_conserved_cycle_aggregates_with_zero_drift
          rationale: |
            The ledger-sync pattern in this domain is exactly the pair of conserved cycle aggregates
            (total_assigned_scope_weight and certification_coverage_pct) being re-derived on every child
            write. That §1.8 compensating_invariant instance reconciles both before and after values
            against a full recompute from source rows, which is the ledger-sync claim in its strongest
            form.
      - name: compensating_transition_undoes_every_side_effect_of_its_forward_transition
        claim_type: compensation
        grounds: [state_machines.PostFilingCorrection.ASSESSED_to_RESCINDED, state_machines.ControlDeficiency.OPEN_to_REVERSED]
        excluded_because:
          difficulty_instance: correction_rescission_reverses_the_deficiency_weight_and_the_restatement_stage_but_not_the_filing
          rationale: |
            RESCIND is the only true undo transition in the scaffold, and that §1.8 instance already
            asserts that every ASSESS side effect is reversed (deficiency OPEN -> REVERSED,
            unresolved_deficiency_weight back to its exact pre-ASSESS value, restatement_stage back to
            NONE, materiality_pct / classification / method cleared) while the Filing and the cycle
            `status` axis are deliberately left untouched.
      - name: conditional_cascade_touches_only_the_children_in_the_named_state
        claim_type: conditional_cascade
        grounds: [state_machines.CommitteeMember.ACTIVE_to_VACATED, state_machines.SubCertificationRequest.PENDING_to_VOID]
        excluded_because:
          difficulty_instance: seat_vacancy_cascades_four_hops_and_raises_coverage_by_shrinking_the_denominator
          rationale: |
            The conditional-cascade pattern here is the VACATE fan-out, which touches a child only when
            that child is in status PENDING and provably leaves SUBMITTED and EXCEPTION_NOTED rows
            alone. That §1.8 instance asserts the untouched rows' versions as well as the touched ones,
            which is precisely the "side effect applied only when child is in specific state" claim.

  - section: calculations
    instances:
      - name: adjusted_measure_reconciliation_produces_the_exact_sum_gap_and_prominence_verdict
        claim_type: correct_result
        grounds:
          - calculations.adjusted_measure_reconciliation
          - calculations.measure_gate_evaluation
          - entities.AdjustedMeasure.fields.reconciliation_sum
          - entities.AdjustedMeasure.fields.reconciliation_gap
          - entities.AdjustedMeasure.fields.prominence_ok
          - endpoints["POST /disclosure/adjusted-measures/{id}/reconcile"]
        distinguishing_aspect: |
          Known inputs are pushed through the formula and every intermediate is checked, not just the
          final enum: reconciliation_items 150.25 + 50.25 give reconciliation_sum 200.50, so
          reconciliation_gap is 1200.50 - (1000.00 + 200.50) == 0.00 exactly, prominence_ok is true
          because gaap_prominence_index 1 <= adjusted_prominence_index 2, and the row therefore lands on
          RECONCILED rather than REJECTED or PROMINENCE_FAILED. The document gate is observed on both
          sides of the call: BLOCKED_RECONCILIATION while the measure is still DRAFT, CLEARED afterwards.
        test_recipe:
          setup:
            - "An ADOPTED charter with an ACTIVE voting FINANCE member and an ACTIVE voting LEGAL member."
            - "A cycle in CLOSE_OPEN carrying a DRAFT EARNINGS_RELEASE document."
            - "One AdjustedMeasure on that document in status DRAFT."
          setup_api_calls:
            - call: "POST /disclosure/charters"
              payload: { name: "Q2 Disclosure Committee Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE", "LEGAL"] }
              as: ComplianceAdmin
              captures: { charter_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_id}/members"
