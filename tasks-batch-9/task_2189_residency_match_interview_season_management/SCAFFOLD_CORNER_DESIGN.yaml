        distinguishing_aspect: >
          The coordinator drives almost every operational write in this API - applications, waves, slots,
          assignments, screening - but the rank list belongs to the program director alone, and the
          coordinator's broad write access elsewhere does not extend to it. 403 at priority 2, before the
          program's RANKING phase is even considered.
