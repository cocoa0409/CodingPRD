              payload: { booking_id: "${bk_id}" }
              as: LabTechnician
              captures: { ej_id: "$.data[0].id" }
            - call: "POST /genetics/ejaculates/${ej_id}/qc-evaluation"
              payload: { post_thaw_motility_pct: 55.0, morphology_normal_pct: 82.0, verdict: "ACCEPTED" }
              as: LabTechnician
              as_user_id: "lab-1"
            - call: "POST /genetics/ejaculates/${ej_id}/straw-lots"
              payload: { product_line: "CONVENTIONAL", straw_count: 200, processing_cost_cents: 250000 }
              as: LabTechnician
              captures: { lot_id: "$.data.id" }
            - call: "POST /genetics/straw-lots/${lot_id}/release"
              payload: {}
              as: LabTechnician
              as_user_id: "lab-2"
            - call: "GET /genetics/sires/${c_id}"
              payload: {}
              as: ProgramDirector
              captures: { c_ver2: "$.data.version" }
            - call: "POST /genetics/sires/${c_id}/genomic-evaluations"
              payload: { milk_kg: 1100, fat_kg: 45, protein_kg: 36, somatic_cell_score: 2.90, fertility_pct: 2.0, longevity_months: 3.0, reliability_pct: 68, progeny_daughter_count: 50, effective_at: "2026-08-15T00:00:00Z", expected_sire_version: "${c_ver2}" }
              as: ProgramDirector
