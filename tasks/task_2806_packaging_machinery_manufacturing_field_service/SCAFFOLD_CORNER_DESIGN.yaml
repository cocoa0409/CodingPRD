      - name: trial_effective_ratio_exactly_at_heavy_duty_floor_is_heavy_duty
        claim_type: threshold
        grounds:
          - calculations.trial_config_recommendation
          - entities.ProductTrial.fields.config_recommendation
          - entities.ProductTrial.fields.rate_ratio_pct
        distinguishing_aspect: |
          Exactly ON the HEAVY_DUTY floor: measured 480 of nameplate 600 is rate_ratio_pct 80.00, and the
          customer's 5.00 product variation is SUBTRACTED first, giving effective_ratio_pct exactly 75.00.
          The comparison is >=, so this is HEAVY_DUTY, not NOT_FEASIBLE - and it is NOT STANDARD either,
          which is what an implementation that forgets the variation subtraction would return.
        test_recipe:
          setup:
            - "Customer with product_variation_pct 5.00"
            - "MachineModel with nameplate_rate_cpm 600"
            - "one ProductTrial in TESTING"
          setup_api_calls:
            - call: "POST /packaging-oem/customers"
              payload: { legal_name: "Meridian Dairy", region_code: "EU", product_variation_pct: 5.00 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /packaging-oem/machine-models"
              payload: { model_code: "FL-600", machine_family: "FILLER", nameplate_rate_cpm: 600, guarantee_efficiency_pct: 90.00, base_price_cents: 68000000, min_container_diameter_mm: 60, max_container_diameter_mm: 110 }
              as: PlatformAdmin
              captures: { model_id: $.data.id }
            - call: "POST /packaging-oem/product-trials"
              payload: { customer_id: "${cust_id}", machine_model_id: "${model_id}", product_name: "Whole Milk 1L", container_family: "HDPE_ROUND", container_diameter_mm: 95 }
              as: ApplicationEngineer
              captures: { trial_id: $.data.id }
            - call: "POST /packaging-oem/product-trials/${trial_id}/start-testing"
              payload: {}
              as: ApplicationEngineer
          trigger:
            - call: "POST /packaging-oem/product-trials/${trial_id}/record-result"
              payload: { measured_rate_cpm: 480, outcome: "PASS" }
              as: ApplicationEngineer
          assert:
            - "HTTP status == 200"
            - "response.data.status == PASSED"
            - "response.data.measured_rate_cpm == 480"
            - "response.data.rate_ratio_pct == 80.00"
            - "response.data.config_recommendation == HEAVY_DUTY"

