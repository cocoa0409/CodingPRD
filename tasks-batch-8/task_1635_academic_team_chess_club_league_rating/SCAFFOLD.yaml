scenario: 'Academic Team, Chess Club & League Rating (scholastic chess federation): club roster & membership dues, match/meet
  scheduling & round pairing, rating calculation & provisional ratings, tournament section eligibility by rating, coach/proctor
  assignment & rules disputes, team standings & tiebreak rules, travel & entry fee management, state qualification & national
  event

  '
domain_name: scholastic-chess-league
api_prefix: /api
complexity_profile:
  primary_archetype: event_sourcing
  secondary_archetype: compliance_audit
  complexity_layers:
  - dual_variant_calculation
  - cascading_side_effects
  - derived_field_reconciliation
  - selector_policy
  - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - self_referential
  - polymorphic
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\"\
    : \"object\" | \"array\", \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\"\
    \ } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
entities:
- name: Season
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Season display name
  - name: start_date
    type: string
    source: input
    description: ISO date YYYY-MM-DD, inclusive season start
  - name: end_date
    type: string
    source: input
    description: ISO date YYYY-MM-DD, inclusive season end; must be > start_date
  - name: dues_deadline
    type: datetime
    source: input
    description: ISO8601 UTC instant; memberships created at or before pay regular_due_cents, after pay late_due_cents
  - name: regular_due_cents
    type: integer
    source: input
    description: Per-player membership dues when created on/before dues_deadline; > 0
  - name: late_due_cents
    type: integer
    source: input
    description: Per-player membership dues when created after dues_deadline; >= regular_due_cents
  - name: provisional_game_threshold
    type: integer
    source: input
    default: 20
    description: A player with rated_games_played < this is provisional; >= 1
  - name: base_rating
    type: integer
    source: input
    default: 800
    description: Rating assigned to new players without initial_rating
  - name: state_bid_slots_per_region
    type: integer
    source: input
    default: 2
    description: Number of INDIVIDUAL_STATE bids offered per region at bid generation; >= 1
  - name: travel_base_cents
    type: integer
    source: input
    description: Per-meet travel stipend base; multiplied by Club.travel_tier; >= 0
  - name: status
    type: enum
    source: system
    default: REGISTRATION
    description: REGISTRATION | ACTIVE | FINALIZING | COMPLETED
    constraints: produced by activate/finalize/reopen/complete transitions
- name: Club
  parent: null
  common_fields: true
  fields:
  - name: season_id
    type: string
    source: input
    description: FK -> Season.id; season this club registration belongs to
  - name: name
    type: string
    source: input
    description: Club name
  - name: school_name
    type: string
    source: input
    description: School the club represents
  - name: region_code
    type: string
    source: input
    description: Federation region; bid pools and standings are per season, qualification per region
  - name: travel_tier
    type: integer
    source: input
    description: Travel distance tier 1|2|3; stipend multiplier
  - name: account_balance_cents
    type: integer
    source: computed
    default: 0
    description: Sum of amount_cents over all LedgerEntry rows for this club; may go negative only via ADJUSTMENT
  - name: projected_travel_stipend_cents
    type: integer
    source: computed
    default: 0
    description: 'Forward-looking stipend: travel_tier * season.travel_base_cents * min(count of meets in SCHEDULED|PAIRINGS_PUBLISHED|IN_PROGRESS|COMPLETED
      for this club, 10)'
  - name: status
    type: enum
    source: system
    default: GOOD_STANDING
    description: GOOD_STANDING | DELINQUENT | SUSPENDED; auto-flips on ledger posts, SUSPENDED/reinstate by FederationAdmin
- name: Coach
  parent: null
  common_fields: true
  fields:
  - name: club_id
    type: string
    source: input
    description: FK -> Club.id; club this coach belongs to
  - name: full_name
    type: string
    source: input
    description: Coach name
  - name: email
    type: string
    source: input
    description: Contact email
  - name: certification_level
    type: enum
    source: input
    description: CLUB | CERTIFIED | SENIOR
  - name: status
    type: enum
    source: system
    default: ACTIVE
    description: ACTIVE | INACTIVE
- name: Player
  parent: null
  common_fields: true
  fields:
  - name: club_id
    type: string
    source: input
    description: FK -> Club.id; owning club
  - name: full_name
    type: string
    source: input
    description: Player name
  - name: grade_level
    type: integer
    source: input
    description: School grade 1..12
  - name: initial_rating
    type: integer
    source: input
    required: false
    description: Federation-seeded starting rating for transfers; defaults to owning season.base_rating
  - name: initial_rated_games
    type: integer
    source: input
    required: false
    default: 0
    description: Federation-seeded prior rated game count; >= 0
  - name: rating
    type: integer
    source: computed
    description: Current rating = replay of effective RatingEvents starting from initial_rating
  - name: peak_rating
    type: integer
    source: computed
    description: Max of initial_rating and all effective RatingEvent.rating_after
  - name: rated_games_played
    type: integer
    source: computed
    description: initial_rated_games + count of effective RatingEvents
  - name: is_provisional
    type: boolean
    source: computed
    description: rated_games_played < season.provisional_game_threshold
  - name: performance_points
    type: integer
    source: computed
    default: 0
    description: 3 per confirmed meet win, 1 per draw, 1 per forfeit win, 0 per loss/double-forfeit, +2 per tournament check-in
  - name: status
    type: enum
    source: system
    default: ACTIVE
    description: ACTIVE | INACTIVE | SUSPENDED | GRADUATED
    constraints: GRADUATED set by system when season completes and grade_level == 12
- name: Membership
  parent: null
  common_fields: true
  fields:
  - name: player_id
    type: string
    source: input
    description: FK -> Player.id
  - name: season_id
    type: string
    source: input
    description: FK -> Season.id
  - name: fee_cents
    type: integer
    source: computed
    description: regular_due_cents if created_at <= season.dues_deadline else late_due_cents
  - name: paid_at
    type: datetime
    source: system
    description: Set when paid; null otherwise
  - name: status
    type: enum
    source: system
    default: INVOICED
    description: INVOICED | PAID | WAIVED | REFUNDED
    constraints: unique (player_id, season_id)
- name: LedgerEntry
  parent: null
  common_fields: false
  fields:
  - name: club_id
    type: string
    source: system
    description: FK -> Club.id; account owning this entry
  - name: entry_type
    type: enum
    source: system
    description: MEMBERSHIP_DUE | ENTRY_FEE | ENTRY_REFUND | TRAVEL_STIPEND | ADJUSTMENT | REVERSAL; manual posts allowed
      only as ADJUSTMENT
  - name: amount_cents
    type: integer
    source: input
    description: Signed cents; credits positive, debits negative; non-zero
  - name: memo
    type: string
    source: input
    required: false
    description: Free-text memo
  - name: posted_by_user_id
    type: string
    source: system
    description: X-User-ID of poster; segregation-of-duties anchor for reversal
  - name: membership_id
    type: string
    source: system
    required: false
    description: FK -> Membership.id; set on MEMBERSHIP_DUE and its refund entries
  - name: entry_id
    type: string
    source: system
    required: false
    description: FK -> TournamentEntry.id; set on ENTRY_FEE and ENTRY_REFUND entries
  - name: reversal_of_id
    type: string
    source: system
    required: false
    description: FK -> LedgerEntry.id; set on REVERSAL entries, points at the reversed original
  - name: reversed_by_id
    type: string
    source: system
    required: false
    description: Id of the REVERSAL entry that reversed this entry; null until reversed (system-maintained on the immutable
      row)
- name: Meet
  parent: null
  common_fields: true
  fields:
  - name: season_id
    type: string
    source: input
    description: FK -> Season.id
  - name: host_club_id
    type: string
    source: input
    description: FK -> Club.id; white pieces on every board
  - name: away_club_id
    type: string
    source: input
    description: FK -> Club.id; black pieces; must differ from host_club_id
  - name: scheduled_date
    type: string
    source: input
    description: ISO date YYYY-MM-DD; whole-day occupation for overlap checks
  - name: rounds_count
    type: integer
    source: input
    description: Number of rounds; >= 1
  - name: boards_count
    type: integer
    source: input
    description: Boards per round; >= 1
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | SCHEDULED | PAIRINGS_PUBLISHED | IN_PROGRESS | COMPLETED | POSTPONED | CANCELLED
- name: Pairing
  parent: null
  common_fields: true
  fields:
  - name: meet_id
    type: string
    source: system
    description: FK -> Meet.id
  - name: round_number
    type: integer
    source: input
    description: 1..meet.rounds_count
  - name: board_number
    type: integer
    source: input
    description: 1..meet.boards_count
  - name: white_player_id
    type: string
    source: input
    description: FK -> Player.id; must belong to meet.host_club_id
  - name: black_player_id
    type: string
    source: input
    description: FK -> Player.id; must belong to meet.away_club_id
  - name: result
    type: enum
    source: system
    default: UNREPORTED
    description: UNREPORTED | WHITE_WIN | BLACK_WIN | DRAW | WHITE_FORFEIT_WIN | BLACK_FORFEIT_WIN | DOUBLE_FORFEIT
  - name: reported_by_coach_id
    type: string
    source: system
    required: false
    description: Coach.id who reported the result
  - name: was_confirmed
    type: boolean
    source: system
    default: false
    description: True once the pairing has ever reached CONFIRMED; governs dispute-withdraw target state
  - name: confirmed_at
    type: datetime
    source: system
    required: false
    description: Logical-clock instant of confirmation; RatingEvent replay order key
  - name: status
    type: enum
    source: system
    default: SCHEDULED
    description: SCHEDULED | REPORTED | CONFIRMED | DISPUTED | REPLACED | CANCELLED
- name: Dispute
  parent: null
  common_fields: true
  fields:
  - name: pairing_id
    type: string
    source: system
    description: FK -> Pairing.id; disputed pairing
  - name: raised_by_coach_id
    type: string
    source: system
    description: FK -> Coach.id; from X-User-ID of the disputing ClubCoach
  - name: reason
    type: string
    source: input
    description: Dispute grounds; >= 10 chars
  - name: resolved_result
    type: enum
    source: input
    required: false
    description: Replacement result required iff outcome == OVERTURNED; same enum as Pairing.result minus UNREPORTED
  - name: resolution_notes
    type: string
    source: input
    required: false
    description: Adjudicator notes
  - name: status
    type: enum
    source: system
    default: OPEN
    description: OPEN | UNDER_REVIEW | UPHELD | OVERTURNED | WITHDRAWN
- name: Tournament
  parent: null
  common_fields: true
  fields:
  - name: season_id
    type: string
    source: input
    description: FK -> Season.id
  - name: host_club_id
    type: string
    source: input
    required: false
    description: FK -> Club.id; optional host club
  - name: name
    type: string
    source: input
    description: Tournament name
  - name: start_date
    type: string
    source: input
    description: ISO date, inclusive first day
  - name: end_date
    type: string
    source: input
    description: ISO date, inclusive last day; >= start_date
  - name: entry_fee_cents
    type: integer
    source: input
    description: Standard per-section entry fee; >= 0
  - name: early_bird_deadline
    type: datetime
    source: input
    required: false
    description: ISO8601 UTC; entries created at or before get early_bird_discount_pct
  - name: early_bird_discount_pct
    type: number
    source: input
    required: false
    description: 0..1 discount fraction; required iff early_bird_deadline set
  - name: capacity
    type: integer
    source: input
    description: Max total non-withdrawn entries across all sections; >= 1
  - name: status
    type: enum
    source: system
    default: DRAFT
    description: DRAFT | REGISTRATION_OPEN | REGISTRATION_CLOSED | RUNNING | COMPLETED | CANCELLED
- name: TournamentSection
  parent: null
  common_fields: true
  fields:
  - name: tournament_id
    type: string
    source: system
    description: FK -> Tournament.id
  - name: name
    type: string
    source: input
    description: Section name
  - name: min_rating
    type: integer
    source: input
    description: Inclusive lower rating bound
  - name: max_rating
    type: integer
    source: input
    description: Inclusive upper rating bound; >= min_rating
  - name: allow_provisional
    type: boolean
    source: input
    default: false
    description: Whether provisional players may enter
  - name: max_entries
    type: integer
    source: input
    description: Section capacity; >= 1
  - name: current_entries
    type: integer
    source: computed
    default: 0
    description: Count of entries in REGISTERED | CHECKED_IN | FINISHED
  - name: status
    type: enum
    source: system
    default: OPEN
    description: OPEN | LOCKED | CLOSED
    constraints: CLOSED set by system when tournament starts or cancels
- name: TournamentEntry
  parent: null
  common_fields: true
  fields:
  - name: section_id
    type: string
    source: system
    description: FK -> TournamentSection.id
  - name: player_id
    type: string
    source: input
    description: FK -> Player.id
  - name: fee_cents
    type: integer
    source: computed
    description: 'Charged fee: round_half_up(entry_fee_cents * (1 - early_bird_discount_pct)) when early-bird applies, else
      entry_fee_cents'
  - name: refund_cents
    type: integer
    source: computed
    default: 0
    description: Credited on withdrawal per refund tier
  - name: status
    type: enum
    source: system
    default: REGISTERED
    description: REGISTERED | CHECKED_IN | FINISHED | WITHDRAWN
    constraints: unique (section_id, player_id) among non-WITHDRAWN entries
- name: ProctorAssignment
  parent: null
  common_fields: true
  fields:
  - name: coach_id
    type: string
    source: input
    description: FK -> Coach.id; assigned proctor
  - name: event_type
    type: enum
    source: input
    description: MEET | TOURNAMENT; selects which FK is required
  - name: meet_id
    type: string
    source: input
    required: false
    description: FK -> Meet.id; required iff event_type == MEET
  - name: tournament_id
    type: string
    source: input
    required: false
    description: FK -> Tournament.id; required iff event_type == TOURNAMENT
  - name: status
    type: enum
    source: system
    default: ASSIGNED
    description: ASSIGNED | CONFIRMED | RELEASED | COMPLETED | NO_SHOW
- name: QualificationBid
  parent: null
  common_fields: true
  fields:
  - name: season_id
    type: string
    source: system
    description: FK -> Season.id
  - name: club_id
    type: string
    source: system
    description: FK -> Club.id; club of the invited player, or the invited team
  - name: player_id
    type: string
    source: system
    required: false
    description: FK -> Player.id; set for INDIVIDUAL_STATE bids, null for TEAM_STATE and NATIONAL
  - name: bid_type
    type: enum
    source: system
    description: INDIVIDUAL_STATE | TEAM_STATE | NATIONAL
  - name: offer_deadline
    type: datetime
    source: system
    description: Logical clock at offer + 7 days; sweep expires OFFERED bids past this
  - name: status
    type: enum
    source: system
    default: OFFERED
    description: OFFERED | ACCEPTED | DECLINED | EXPIRED
- name: RatingEvent
  parent: null
  common_fields: false
  fields:
  - name: player_id
    type: string
    source: system
    description: FK -> Player.id
  - name: pairing_id
    type: string
    source: system
    description: FK -> Pairing.id; game that produced this event
  - name: season_id
    type: string
    source: system
    description: FK -> Season.id
  - name: formula_variant
    type: enum
    source: system
    description: PROVISIONAL | ESTABLISHED; chosen by games-before vs season threshold
  - name: opponent_rating_snapshot
    type: integer
    source: system
    description: Opponent rating at original confirmation; frozen, reused verbatim on replay
  - name: score
    type: number
    source: system
    description: 1 | 0.5 | 0 from this player's perspective
  - name: k_factor
    type: integer
    source: system
    required: false
    description: K used; null for PROVISIONAL events
  - name: rating_before
    type: integer
    source: system
    description: Player rating before this event; rebased on replay
  - name: rating_after
    type: integer
    source: system
    description: Player rating after this event; rebased on replay
  - name: confirmed_at
    type: datetime
    source: system
    description: Logical-clock instant the pairing reached CONFIRMED; replay order key
  - name: status
    type: enum
    source: system
    default: EFFECTIVE
    description: EFFECTIVE | VOIDED; voided only by dispute-overturn cascade
- name: StandingSnapshot
  parent: null
  common_fields: true
  fields:
  - name: season_id
    type: string
    source: system
    description: FK -> Season.id
  - name: club_id
    type: string
    source: system
    description: FK -> Club.id
  - name: match_points
    type: number
    source: computed
    description: 2 per meet win, 1 per tie, 0 per loss over COMPLETED meets
  - name: game_points
    type: number
    source: computed
    description: Sum of board game points over CONFIRMED pairings of COMPLETED meets
  - name: sonneborn_berger
    type: number
    source: computed
    description: Sum over meets of opponent final match_points * our match result (1 | 0.5 | 0)
  - name: forfeit_losses
    type: integer
    source: computed
    description: Count of games lost by forfeit (incl. double-forfeit)
  - name: rank
    type: integer
    source: computed
    description: 1-based rank per the standings tiebreak cascade
  - name: is_final
    type: boolean
    source: system
    default: true
    description: Snapshots are always final; live standings come from GET /api/seasons/{id}/standings
- name: TravelStipend
  parent: null
  common_fields: true
  fields:
  - name: season_id
    type: string
    source: input
    description: FK -> Season.id
  - name: club_id
    type: string
    source: input
    description: FK -> Club.id
  - name: meets_counted
    type: integer
    source: computed
    description: min(count of COMPLETED meets for the club this season, 10)
  - name: amount_cents
    type: integer
    source: computed
    description: club.travel_tier * season.travel_base_cents * meets_counted
  - name: ledger_entry_id
    type: string
    source: system
    description: FK -> LedgerEntry.id; the TRAVEL_STIPEND credit posted; null when amount_cents == 0 (no ledger row is posted
      for a zero stipend)
    constraints: unique (season_id, club_id)
    required: false
state_machines:
- entity: Season
  initial_state: REGISTRATION
  terminal_states:
  - COMPLETED
  transitions:
  - from: REGISTRATION
    to: ACTIVE
    trigger: POST /api/seasons/{seasonId}/activate
    actor: FederationAdmin
    preconditions:
    - Season in REGISTRATION (ERR_SEASON_INVALID_STATE)
    side_effects: []
  - from: ACTIVE
    to: FINALIZING
    trigger: POST /api/seasons/{seasonId}/finalize
    actor: FederationAdmin
    preconditions:
    - Season in ACTIVE (ERR_SEASON_INVALID_STATE)
    side_effects: []
  - from: FINALIZING
    to: ACTIVE
    trigger: POST /api/seasons/{seasonId}/reopen
    actor: FederationAdmin
    preconditions:
    - Season in FINALIZING (ERR_SEASON_INVALID_STATE)
    side_effects: []
  - from: FINALIZING
    to: COMPLETED
    trigger: POST /api/seasons/{seasonId}/complete
    actor: FederationAdmin
    preconditions:
    - Season in FINALIZING (ERR_SEASON_INVALID_STATE — checked first)
    - At least one StandingSnapshot exists for the season (ERR_STANDINGS_NOT_FINAL)
    - No Dispute in OPEN or UNDER_REVIEW for pairings of this season's meets (ERR_OPEN_DISPUTES_EXIST)
    side_effects:
    - Every ACTIVE Player of this season's clubs with grade_level == 12 becomes GRADUATED
- entity: Club
  initial_state: GOOD_STANDING
  terminal_states: []
  transitions:
  - from: GOOD_STANDING
    to: DELINQUENT
    trigger: system (any ledger post leaving account_balance_cents < 0)
    actor: system
    preconditions:
    - Club in GOOD_STANDING and account_balance_cents < 0 after the post
    side_effects: []
  - from: DELINQUENT
    to: GOOD_STANDING
    trigger: system (any ledger post leaving account_balance_cents >= 0)
    actor: system
    preconditions:
    - Club in DELINQUENT and account_balance_cents >= 0 after the post
    side_effects: []
  - from: GOOD_STANDING
    to: SUSPENDED
    trigger: POST /api/clubs/{clubId}/suspend
    actor: FederationAdmin
    preconditions:
    - Club in GOOD_STANDING or DELINQUENT (ERR_CLUB_INVALID_STATE)
    side_effects: []
  - from: DELINQUENT
    to: SUSPENDED
    trigger: POST /api/clubs/{clubId}/suspend
    actor: FederationAdmin
    preconditions:
    - Club in GOOD_STANDING or DELINQUENT (ERR_CLUB_INVALID_STATE)
    side_effects: []
  - from: SUSPENDED
    to: GOOD_STANDING
    trigger: POST /api/clubs/{clubId}/reinstate
    actor: FederationAdmin
    preconditions:
    - Club in SUSPENDED (ERR_CLUB_INVALID_STATE)
    side_effects:
    - If account_balance_cents < 0 after reinstatement, club lands in DELINQUENT instead of GOOD_STANDING
  - from: SUSPENDED
    to: DELINQUENT
    trigger: POST /api/clubs/{clubId}/reinstate (with account_balance_cents < 0)
    actor: FederationAdmin
    preconditions:
    - Club in SUSPENDED (ERR_CLUB_INVALID_STATE)
    side_effects: []
- entity: Coach
  initial_state: ACTIVE
  terminal_states: []
  transitions:
  - from: ACTIVE
    to: INACTIVE
    trigger: POST /api/coaches/{coachId}/deactivate
    actor: FederationAdmin
    preconditions:
    - Coach in ACTIVE (ERR_COACH_INVALID_STATE)
    side_effects:
    - All ProctorAssignments for this coach in ASSIGNED become RELEASED
  - from: INACTIVE
    to: ACTIVE
    trigger: POST /api/coaches/{coachId}/reactivate
    actor: FederationAdmin
    preconditions:
    - Coach in INACTIVE (ERR_COACH_INVALID_STATE)
    side_effects: []
- entity: Player
  initial_state: ACTIVE
  terminal_states:
  - GRADUATED
  transitions:
  - from: ACTIVE
    to: INACTIVE
    trigger: POST /api/players/{playerId}/deactivate
    actor: ClubCoach | FederationAdmin
    preconditions:
    - Player in ACTIVE (ERR_PLAYER_INVALID_STATE)
    side_effects: []
  - from: INACTIVE
    to: ACTIVE
    trigger: POST /api/players/{playerId}/reactivate
    actor: ClubCoach | FederationAdmin
    preconditions:
    - Player in INACTIVE (ERR_PLAYER_INVALID_STATE)
    side_effects: []
  - from: ACTIVE
    to: SUSPENDED
    trigger: POST /api/players/{playerId}/suspend
    actor: FederationAdmin
    preconditions:
    - Player in ACTIVE or INACTIVE (ERR_PLAYER_INVALID_STATE)
    side_effects: []
  - from: INACTIVE
    to: SUSPENDED
    trigger: POST /api/players/{playerId}/suspend
    actor: FederationAdmin
    preconditions:
    - Player in ACTIVE or INACTIVE (ERR_PLAYER_INVALID_STATE)
    side_effects: []
  - from: ACTIVE
    to: GRADUATED
    trigger: system (season completes while player grade_level == 12)
    actor: system
    preconditions: []
    side_effects: []
- entity: Membership
  initial_state: INVOICED
  terminal_states:
  - WAIVED
  - REFUNDED
  transitions:
  - from: INVOICED
    to: PAID
    trigger: POST /api/memberships/{membershipId}/pay
    actor: ClubCoach | Treasurer | FederationAdmin
    preconditions:
    - Membership in INVOICED (ERR_MEMBERSHIP_NOT_PAYABLE)
    - Club account_balance_cents - fee_cents >= 0 (ERR_INSUFFICIENT_FUNDS)
    side_effects:
    - Post LedgerEntry MEMBERSHIP_DUE amount_cents = -fee_cents with membership_id set, paid_at = logical clock
    - Recompute club.account_balance_cents; apply Club standing auto-transition
  - from: INVOICED
    to: WAIVED
    trigger: POST /api/memberships/{membershipId}/waive
    actor: FederationAdmin
    preconditions:
    - Membership in INVOICED (ERR_MEMBERSHIP_NOT_PAYABLE)
    side_effects: []
  - from: PAID
    to: REFUNDED
    trigger: POST /api/memberships/{membershipId}/refund
    actor: Treasurer
    preconditions:
    - Membership in PAID (ERR_MEMBERSHIP_NOT_REFUNDABLE)
    side_effects:
    - Post LedgerEntry MEMBERSHIP_DUE refund with amount_cents = +fee_cents and membership_id set
    - Recompute club.account_balance_cents; apply Club standing auto-transition
- entity: Meet
  initial_state: DRAFT
  terminal_states:
  - COMPLETED
  - CANCELLED
  transitions:
  - from: DRAFT
    to: SCHEDULED
    trigger: POST /api/meets/{meetId}/schedule
    actor: FederationAdmin
    preconditions:
    - Meet in DRAFT (ERR_MEET_INVALID_STATE — checked first)
    - Neither host nor away club is SUSPENDED (ERR_CLUB_SUSPENDED)
    - Neither club occupies scheduled_date with another meet in SCHEDULED | PAIRINGS_PUBLISHED | IN_PROGRESS (ERR_MEET_DATE_CONFLICT)
    - Season of the meet in ACTIVE (ERR_SEASON_INVALID_STATE)
    side_effects: []
  - from: SCHEDULED
    to: POSTPONED
    trigger: POST /api/meets/{meetId}/postpone
    actor: ClubCoach | FederationAdmin
    preconditions:
    - Meet in SCHEDULED (ERR_MEET_INVALID_STATE)
    side_effects:
    - Meet releases its date occupation (POSTPONED occupies no date)
  - from: POSTPONED
    to: SCHEDULED
    trigger: POST /api/meets/{meetId}/reschedule
    actor: FederationAdmin
    preconditions:
    - Meet in POSTPONED (ERR_MEET_INVALID_STATE — checked first)
    - Neither club SUSPENDED (ERR_CLUB_SUSPENDED)
    - New scheduled_date not occupied by either club (ERR_MEET_DATE_CONFLICT)
    side_effects: []
  - from: DRAFT
    to: CANCELLED
    trigger: POST /api/meets/{meetId}/cancel
    actor: FederationAdmin
    preconditions:
    - Meet in DRAFT | SCHEDULED | POSTPONED (ERR_MEET_INVALID_STATE)
    side_effects:
    - All Pairings of this meet in SCHEDULED | REPORTED become CANCELLED
    - All ProctorAssignments with meet_id = this meet in ASSIGNED | CONFIRMED become RELEASED
  - from: SCHEDULED
    to: CANCELLED
    trigger: POST /api/meets/{meetId}/cancel
    actor: FederationAdmin
    preconditions:
    - Meet in DRAFT | SCHEDULED | POSTPONED (ERR_MEET_INVALID_STATE)
    side_effects:
    - All Pairings of this meet in SCHEDULED | REPORTED become CANCELLED
    - All ProctorAssignments with meet_id = this meet in ASSIGNED | CONFIRMED become RELEASED
  - from: POSTPONED
    to: CANCELLED
    trigger: POST /api/meets/{meetId}/cancel
    actor: FederationAdmin
    preconditions:
    - Meet in DRAFT | SCHEDULED | POSTPONED (ERR_MEET_INVALID_STATE)
    side_effects:
    - All Pairings of this meet in SCHEDULED | REPORTED become CANCELLED
    - All ProctorAssignments with meet_id = this meet in ASSIGNED | CONFIRMED become RELEASED
  - from: SCHEDULED
    to: PAIRINGS_PUBLISHED
    trigger: POST /api/meets/{meetId}/publish-pairings
    actor: FederationAdmin
    preconditions:
    - Meet in SCHEDULED (ERR_MEET_INVALID_STATE — checked first)
    - Every (round_number, board_number) slot in 1..rounds_count x 1..boards_count covered by a Pairing in SCHEDULED (ERR_INCOMPLETE_PAIRINGS)
    side_effects: []
  - from: PAIRINGS_PUBLISHED
    to: IN_PROGRESS
    trigger: POST /api/meets/{meetId}/start
    actor: FederationAdmin
    preconditions:
    - Meet in PAIRINGS_PUBLISHED (ERR_MEET_INVALID_STATE — checked first)
    - At least one ProctorAssignment with meet_id = this meet and status == CONFIRMED (ERR_NO_CONFIRMED_PROCTOR)
    side_effects: []
  - from: IN_PROGRESS
    to: COMPLETED
    trigger: POST /api/meets/{meetId}/complete
    actor: FederationAdmin
    preconditions:
    - Meet in IN_PROGRESS (ERR_MEET_INVALID_STATE — checked first)
    - Every Pairing of this meet not in REPLACED | CANCELLED is CONFIRMED (ERR_UNCONFIRMED_PAIRINGS)
    side_effects:
    - ProctorAssignments with meet_id = this meet in CONFIRMED become COMPLETED
    - Recompute projected_travel_stipend_cents for both clubs (meet now counts as COMPLETED)
- entity: Pairing
  initial_state: SCHEDULED
  terminal_states:
  - CONFIRMED
  - REPLACED
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: REPORTED
    trigger: POST /api/pairings/{pairingId}/report-result
    actor: ClubCoach
    preconditions:
    - Pairing in SCHEDULED (ERR_PAIRING_INVALID_STATE — checked first)
    - Parent meet in IN_PROGRESS (ERR_MEET_INVALID_STATE)
    - Acting coach belongs to host or away club (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)
    side_effects:
    - result set from payload; reported_by_coach_id = acting coach id
  - from: REPORTED
    to: CONFIRMED
    trigger: POST /api/pairings/{pairingId}/confirm
    actor: ClubCoach
    preconditions:
    - Pairing in REPORTED (ERR_PAIRING_INVALID_STATE — checked first)
    - Parent meet in IN_PROGRESS (ERR_MEET_INVALID_STATE)
    - Acting coach belongs to host or away club AND is not reported_by_coach_id's club (ERR_SAME_CLUB_CONFIRMATION)
    side_effects:
    - was_confirmed = true; confirmed_at = logical clock
    - 'If result is WHITE_WIN | BLACK_WIN | DRAW: create two RatingEvents (one per player) via rating_update, then recompute
      both players'' rating, peak_rating, rated_games_played, is_provisional, performance_points'
    - 'If result is WHITE_FORFEIT_WIN | BLACK_FORFEIT_WIN | DOUBLE_FORFEIT: no RatingEvents; recompute performance_points
      (forfeit win = 1 point, loser 0, double-forfeit 0/0) and forfeit_losses tallies'
  - from: REPORTED
    to: DISPUTED
    trigger: POST /api/pairings/{pairingId}/dispute
    actor: ClubCoach
    preconditions:
    - Pairing in REPORTED or CONFIRMED (ERR_PAIRING_INVALID_STATE — checked first)
    - Acting coach belongs to host or away club (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)
    side_effects:
    - Create Dispute in OPEN with raised_by_coach_id = acting coach id
  - from: CONFIRMED
    to: DISPUTED
    trigger: POST /api/pairings/{pairingId}/dispute
    actor: ClubCoach
    preconditions:
    - Pairing in REPORTED or CONFIRMED (ERR_PAIRING_INVALID_STATE — checked first)
    - Acting coach belongs to host or away club (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)
    side_effects:
    - Create Dispute in OPEN with raised_by_coach_id = acting coach id
  - from: DISPUTED
    to: CONFIRMED
    trigger: POST /api/disputes/{disputeId}/resolve (cascade)
    actor: FederationAdmin
    preconditions: []
    side_effects:
    - 'See Dispute.resolve cascade: on UPHELD the reported result stands; on OVERTURNED result := resolved_result'
    - 'If was_confirmed and OVERTURNED: void the two original RatingEvents, replay both players, then apply the rating side
      effects of the new result as on first confirmation'
    - 'If not was_confirmed: was_confirmed = true, confirmed_at = logical clock, apply rating side effects of the (possibly
      resolved) result'
- entity: Dispute
  initial_state: OPEN
  terminal_states:
  - UPHELD
  - OVERTURNED
  - WITHDRAWN
  transitions:
  - from: OPEN
    to: UNDER_REVIEW
    trigger: POST /api/disputes/{disputeId}/open-review
    actor: FederationAdmin
    preconditions:
    - Dispute in OPEN (ERR_DISPUTE_INVALID_STATE)
    side_effects: []
  - from: UNDER_REVIEW
    to: UPHELD
    trigger: POST /api/disputes/{disputeId}/resolve outcome=UPHELD
    actor: FederationAdmin
    preconditions:
    - Dispute in UNDER_REVIEW (ERR_DISPUTE_INVALID_STATE — checked first)
    - resolved_result must be absent (ERR_INVALID_REQUEST)
    side_effects:
    - Pairing DISPUTED -> CONFIRMED with reported result; if never confirmed, apply rating side effects now
  - from: UNDER_REVIEW
    to: OVERTURNED
    trigger: POST /api/disputes/{disputeId}/resolve outcome=OVERTURNED
    actor: FederationAdmin
    preconditions:
    - Dispute in UNDER_REVIEW (ERR_DISPUTE_INVALID_STATE — checked first)
    - resolved_result required and != UNREPORTED (ERR_INVALID_REQUEST)
    side_effects:
    - 'Cascade link 1: Pairing DISPUTED -> CONFIRMED, result := resolved_result'
    - 'Cascade link 2: if pairing.was_confirmed, the pairing''s two RatingEvents become VOIDED; each void triggers link 3'
    - 'Cascade link 3: each affected Player is replayed (rating, peak_rating, rated_games_played, is_provisional, performance_points
      recomputed); the replay output then drives link 4'
    - 'Cascade link 4: if the new result is rated, two fresh RatingEvents are created with opponent snapshots taken AFTER
      the void-replay, and both players replay again'
  - from: OPEN
    to: WITHDRAWN
    trigger: POST /api/disputes/{disputeId}/withdraw
    actor: ClubCoach
    preconditions:
    - Dispute in OPEN (ERR_DISPUTE_INVALID_STATE — checked first)
    - Acting coach == raised_by_coach_id (ERR_FORBIDDEN_RESOURCE_OWNERSHIP)
    side_effects:
    - Pairing DISPUTED -> CONFIRMED if was_confirmed else -> REPORTED (no rating changes)
- entity: Tournament
  initial_state: DRAFT
  terminal_states:
  - COMPLETED
  - CANCELLED
  transitions:
  - from: DRAFT
    to: REGISTRATION_OPEN
    trigger: POST /api/tournaments/{tournamentId}/open-registration
    actor: FederationAdmin
    preconditions:
    - Tournament in DRAFT (ERR_TOURNAMENT_INVALID_STATE)
    side_effects: []
  - from: REGISTRATION_OPEN
    to: REGISTRATION_CLOSED
    trigger: POST /api/tournaments/{tournamentId}/close-registration
    actor: FederationAdmin
    preconditions:
    - Tournament in REGISTRATION_OPEN (ERR_TOURNAMENT_INVALID_STATE)
    side_effects: []
  - from: REGISTRATION_CLOSED
    to: REGISTRATION_OPEN
    trigger: POST /api/tournaments/{tournamentId}/reopen-registration
    actor: FederationAdmin
    preconditions:
    - Tournament in REGISTRATION_CLOSED (ERR_TOURNAMENT_INVALID_STATE)
    side_effects: []
  - from: REGISTRATION_CLOSED
    to: RUNNING
    trigger: POST /api/tournaments/{tournamentId}/start
    actor: FederationAdmin
    preconditions:
    - Tournament in REGISTRATION_CLOSED (ERR_TOURNAMENT_INVALID_STATE — checked first)
    - At least one ProctorAssignment with tournament_id = this tournament and status == CONFIRMED (ERR_NO_CONFIRMED_PROCTOR)
    side_effects:
    - All TournamentSections of this tournament in OPEN | LOCKED become CLOSED
  - from: RUNNING
    to: COMPLETED
    trigger: POST /api/tournaments/{tournamentId}/complete
    actor: FederationAdmin
    preconditions:
    - Tournament in RUNNING (ERR_TOURNAMENT_INVALID_STATE)
    side_effects:
    - All entries in REGISTERED | CHECKED_IN become FINISHED
    - ProctorAssignments with tournament_id = this tournament in CONFIRMED become COMPLETED
  - from: DRAFT
    to: CANCELLED
    trigger: POST /api/tournaments/{tournamentId}/cancel
    actor: FederationAdmin
    preconditions:
    - Tournament in DRAFT | REGISTRATION_OPEN | REGISTRATION_CLOSED | RUNNING (ERR_TOURNAMENT_INVALID_STATE)
    side_effects:
    - 'Cascade link 1: every entry in REGISTERED | CHECKED_IN becomes WITHDRAWN with refund_cents = fee_cents (100%); each
      withdrawal triggers link 2'
    - 'Cascade link 2: for each withdrawn entry post LedgerEntry ENTRY_REFUND amount_cents = +fee_cents with entry_id set;
      each post triggers link 3'
    - 'Cascade link 3: recompute the entry''s club account_balance_cents; each recompute triggers link 4'
    - 'Cascade link 4: apply Club standing auto-transition (DELINQUENT -> GOOD_STANDING when balance >= 0)'
    - Sections in OPEN | LOCKED become CLOSED; ProctorAssignments in ASSIGNED | CONFIRMED become RELEASED
  - from: REGISTRATION_OPEN
    to: CANCELLED
    trigger: POST /api/tournaments/{tournamentId}/cancel
    actor: FederationAdmin
    preconditions:
    - Tournament in DRAFT | REGISTRATION_OPEN | REGISTRATION_CLOSED | RUNNING (ERR_TOURNAMENT_INVALID_STATE)
    side_effects:
    - Same four-link entry/refund/balance/standing cascade as DRAFT cancel
    - Sections in OPEN | LOCKED become CLOSED; ProctorAssignments in ASSIGNED | CONFIRMED become RELEASED
  - from: REGISTRATION_CLOSED
    to: CANCELLED
    trigger: POST /api/tournaments/{tournamentId}/cancel
    actor: FederationAdmin
    preconditions:
    - Tournament in DRAFT | REGISTRATION_OPEN | REGISTRATION_CLOSED | RUNNING (ERR_TOURNAMENT_INVALID_STATE)
    side_effects:
    - Same four-link entry/refund/balance/standing cascade as DRAFT cancel
    - Sections in OPEN | LOCKED become CLOSED; ProctorAssignments in ASSIGNED | CONFIRMED become RELEASED
  - from: RUNNING
    to: CANCELLED
    trigger: POST /api/tournaments/{tournamentId}/cancel
    actor: FederationAdmin
    preconditions:
    - Tournament in DRAFT | REGISTRATION_OPEN | REGISTRATION_CLOSED | RUNNING (ERR_TOURNAMENT_INVALID_STATE)
    side_effects:
    - Same four-link entry/refund/balance/standing cascade as DRAFT cancel
    - Sections in OPEN | LOCKED become CLOSED; ProctorAssignments in ASSIGNED | CONFIRMED become RELEASED
- entity: TournamentSection
  initial_state: OPEN
  terminal_states:
  - CLOSED
