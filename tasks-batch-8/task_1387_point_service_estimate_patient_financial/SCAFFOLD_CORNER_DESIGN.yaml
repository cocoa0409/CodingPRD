              payload: { expected_patient_version: "${pat_b_v}", payer_code: "ACME", member_id: "M-V6", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
