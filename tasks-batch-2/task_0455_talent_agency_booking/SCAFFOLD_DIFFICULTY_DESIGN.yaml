  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: audition_slot_buffered_overlap_rejected
        grounds:
          - validations[priority=9]
          - entities.AuditionSlot.fields.start_at
          - entities.AuditionSlot.fields.end_at
          - entities.AuditionSlot.fields.casting_director_id
        distinguishing_aspect: |
          AuditionSlot overlap uses CLOSED-interval-plus-15-minute-buffer semantics
          on the casting director's calendar: a second slot starting 10 minutes
          after the first ends still collides (within buffer) and is rejected with
          ERR_SLOT_OVERLAP — distinct interval arithmetic from the half-open hold rule.
        test_recipe:
          setup:
            - "One SCHEDULED audition slot on a casting director 10:00-10:30; a second submission ready."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Stellar", commission_rate_bps: 1000 }
              as: Agent
              captures: { agency_id: $.data.id }
            - call: "POST /casting-directors"
              payload: { display_name: "Dana", studio: "BigPic" }
              as: Agent
              captures: { cd_id: $.data.id }
            - call: "POST /talents"
              payload: { agency_id: "${agency_id}", full_name: "Tess", union_status: "SAG", scale_rate_cents: 100000 }
              as: Agent
              captures: { talent_id: $.data.id }
            - call: "POST /comp-cards"
              payload: { talent_id: "${talent_id}", headshot_url: "http://x/h.jpg", height_cm: 170, skills: ["act"] }
              as: Agent
              captures: { cc_id: $.data.id }
