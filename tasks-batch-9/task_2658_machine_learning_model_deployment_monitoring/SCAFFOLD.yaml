# =============================================================================
# PRD Benchmark Scaffold — task_2658_machine_learning_model_deployment_monitoring
# §1.0 – §1.7 (difficulty/corner design indices live in their sibling files)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2658. Machine Learning Model Deployment & Monitoring (machine learning platform team): model registry with versioning, training data references and approval status before deployment, deployment patterns across batch, real-time and shadow mode with traffic ramping, performance monitoring against baseline with prediction distribution and accuracy proxies, data drift and concept drift detection with retraining triggers and thresholds, feature pipeline consistency between training and serving with skew detection, rollback procedures and champion-challenger evaluation with promotion criteria, incident response for degraded predictions with fallback logic and manual override, model documentation, reproducibility artifacts and periodic revalidation

domain_name: "ml-model-deployment-monitoring"
api_prefix: ""

# -----------------------------------------------------------------------------
# §0.1–§0.3 Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Thirteen peer entities linked only by explicit foreign keys. No URL nesting
  # expresses ownership except two deliberate sub-resource reads
  # (POST/GET under /models/{model_id}/challenger-evaluations,
  #  GET /deployments/{deployment_id}/ramp-steps). Every other resource is
  # addressed at its own top-level collection and joined through FK filters.

  state_machine_shape: cyclic
  # Five of the seven machines contain a genuine loop:
  #   TrainingDataset   REJECTED -> DRAFT (resubmission loop)
  #   ModelVersion      CHANGES_REQUESTED -> DRAFT and BLOCKED -> APPROVED
  #   Deployment        RAMPING <-> HELD, plus an independent health_state axis
  #                     (HEALTHY <-> DEGRADED <-> CRITICAL) on the same row
  #   ChallengerEvaluation  COLLECTING -> INCONCLUSIVE -> COLLECTING (extension)
  #   PredictionIncident    MONITORING -> MITIGATING (recurrence loop)
  # Deployment additionally carries parallel state dimensions, and
  # ChallengerEvaluation additionally forks COLLECTING -> {PROMOTED, REJECTED,
  # INCONCLUSIVE} with a different side-effect set per branch.

  relationship_patterns:
    - one_to_many          # Model -> ModelVersion, Deployment -> MonitoringWindow
    - self_referential     # ModelVersion.parent_version_id -> ModelVersion.id (retraining lineage)
    - cross_aggregate      # DriftReport -> MonitoringWindow and -> TrainingDataset
    - polymorphic_absent   # deliberately not used; every FK targets exactly one entity

  role_model: segregation_of_duties
  # ModelApprover may not decide a ModelVersion they submitted; DataSteward may
  # not decide a TrainingDataset they registered. Both are enforced by
  # X-User-ID comparison against a stored actor field, not by role alone.

  consistency_model: immediate
  # Every cascade (dataset revocation, drift breach, rollback release,
  # promotion) completes inside the triggering request; no read-repair, no
  # deferred reconciliation. The revalidation sweep is the only epoch-style
  # batch and it is an explicit operator call, not a background job.

  difficulty_level: expert_plus
  # 13 entities / 58 endpoints / 69 error codes / 11 calculations / 10 state
  # machines (59 transitions) / 58 validation rules / 2 OCC races / 5 roles.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Model
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Human-readable registry name of the model."
        constraints: "1..120 chars; unique per (name, owner_team) pair, compared as case-sensitive exact match on both members (see validations priority 50); ERR_DUPLICATE_MODEL_NAME on collision"
      - name: task_type
        type: enum
        source: input
        description: "Prediction task the model performs."
        constraints: "one of {CLASSIFICATION, REGRESSION, RANKING}"
      - name: owner_team
        type: string
        source: input
        description: "Owning team slug, used as a list filter."
        constraints: "1..60 chars"
      - name: registry_status
        type: enum
        source: system
        description: "Registry lifecycle of the model itself."
        default: ACTIVE
        constraints: "one of {ACTIVE, ARCHIVED}; ARCHIVED is produced only by POST /models/{model_id}/archive"
      - name: revalidation_interval_days
        type: integer
        source: input
        description: "Days between periodic revalidations of every APPROVED version of this model."
        default: 90
        constraints: "1..365; immutable after creation (no endpoint mutates it)"
      - name: champion_version_id
        type: string
        source: computed
        description: "FK -> ModelVersion.id; the version currently serving as champion. null until the first challenger promotion or the first APPROVED version is deployed to LIVE."
        default: null
        constraints: "written only by the promotion cascade of POST /challenger-evaluations/{evaluation_id}/conclude and by the RAMPING->LIVE transition of a REALTIME Deployment"
      - name: champion_promoted_at
        type: datetime
        source: computed
        description: "Logical-clock instant at which champion_version_id was last written."
        default: null
      - name: open_retraining_trigger_count
        type: integer
        source: computed
        description: "Count of RetrainingTrigger rows for this model whose status IN {PROPOSED, ACKNOWLEDGED, IN_PROGRESS}."
        default: 0
      - name: registered_by_user_id
        type: string
        source: system
        description: "X-User-ID of the caller of POST /models."

  - name: TrainingDataset
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Snapshot label."
        constraints: "1..120 chars"
      - name: snapshot_uri
        type: string
        source: input
        description: "Immutable storage location of the frozen training snapshot."
        constraints: "1..400 chars"
      - name: row_count
        type: integer
        source: input
        description: "Number of rows in the snapshot."
        constraints: ">= 1"
      - name: feature_hash
        type: string
        source: input
        description: "Digest of the feature-pipeline specification used to materialise the snapshot."
        constraints: "1..80 chars; ModelVersion.feature_spec_hash must equal this value"
      - name: baseline_bin_proportions
        type: array
        source: input
        description: "Five expected bin proportions of the monitored feature, used as the TRAINING_BASELINE expected distribution for PSI."
        constraints: "exactly 5 numbers, each 0.0..1.0, sum within 0.0001 of 1.0; ERR_INVALID_BIN_PROPORTIONS otherwise"
      - name: baseline_positive_rate
        type: number
        source: input
        description: "Positive-class rate observed in the snapshot; the prediction-distribution reference."
        constraints: "0.0..1.0"
      - name: pii_review_passed
        type: boolean
        source: input
        description: "Whether the PII review of this snapshot passed."
        default: false
      - name: license_class
        type: enum
        source: input
        description: "Data licence class governing downstream deployment."
        constraints: "one of {OPEN, INTERNAL, RESTRICTED}"
      - name: approval_state
        type: enum
        source: system
        description: "Approval status of the training-data reference; gates ModelVersion approval."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED, REVOKED}"
      - name: registered_by_user_id
        type: string
        source: system
        description: "X-User-ID of the caller of POST /training-datasets; segregation-of-duties reference."
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DataSteward who approved or rejected this snapshot."
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent approve/reject decision."
        default: null
      - name: revocation_reason
        type: string
        source: system
        description: "Free-text reason recorded by POST /training-datasets/{dataset_id}/revoke."
        default: null
      - name: dependent_version_count
        type: integer
        source: computed
        description: "Count of ModelVersion rows whose training_dataset_id equals this snapshot and whose approval_state != REJECTED."
        default: 0

  - name: ModelVersion
    parent: null
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: input
        description: "FK -> Model.id; registry entry this version belongs to."
      - name: training_dataset_id
        type: string
        source: input
        description: "FK -> TrainingDataset.id; frozen snapshot this version was trained on."
      - name: parent_version_id
        type: string
        source: input
        description: "FK -> ModelVersion.id; predecessor this version was retrained from. null for the first version of a model."
        default: null
        constraints: "when non-null the referenced version must have the same model_id, else ERR_LINEAGE_MODEL_MISMATCH"
      - name: semver
        type: string
        source: input
        description: "Semantic version string of the artifact."
        constraints: "matches ^[0-9]+\\.[0-9]+\\.[0-9]+$; unique per (model_id, semver); ERR_DUPLICATE_SEMVER on collision"
      - name: artifact_digest
        type: string
        source: input
        description: "Content digest of the serialised model artifact."
        constraints: "1..120 chars"
      - name: feature_spec_hash
        type: string
        source: input
        description: "Digest of the feature-pipeline specification this artifact expects at serving time."
        constraints: "must equal TrainingDataset.feature_hash of training_dataset_id at creation, else ERR_FEATURE_SPEC_MISMATCH"
      - name: baseline_accuracy
        type: number
        source: input
        description: "Offline accuracy proxy measured on the snapshot's holdout; the monitoring baseline."
        constraints: "0.0..1.0"
      - name: baseline_positive_rate
        type: number
        source: input
        description: "Offline positive-class rate; prediction-distribution baseline for the health score."
        constraints: "0.0..1.0"
      - name: baseline_p95_latency_ms
        type: integer
        source: input
        description: "Offline p95 inference latency in milliseconds; latency baseline for the health score."
        constraints: ">= 1"
      - name: doc_sections
        type: array
        source: input
        description: "Model-documentation section keys present for this version; replaced wholesale by PATCH /model-versions/{version_id}/documentation."
        default: []
        constraints: "each element one of {INTENDED_USE, TRAINING_DATA, EVALUATION, LIMITATIONS, ETHICAL_REVIEW}; duplicates rejected with ERR_INVALID_REQUEST"
      - name: repro_artifacts
        type: array
        source: input
        description: "Reproducibility artifact keys recorded for this version; replaced wholesale by PATCH /model-versions/{version_id}/documentation."
        default: []
        constraints: "each element one of {TRAINING_CODE_COMMIT, ENV_LOCKFILE_DIGEST, RANDOM_SEED, FEATURE_SPEC_HASH}; duplicates rejected with ERR_INVALID_REQUEST"
      - name: doc_completeness_pct
        type: number
        source: computed
        description: "Output of calculations.documentation_and_reproducibility_score; percentage of required doc sections present."
        default: 0
      - name: reproducibility_score
        type: number
        source: computed
        description: "Output of calculations.documentation_and_reproducibility_score; percentage of required reproducibility artifacts present."
        default: 0
      - name: approval_state
        type: enum
        source: system
        description: "Approval and lifecycle status of this version."
        default: DRAFT
        constraints: "one of {DRAFT, PENDING_REVIEW, CHANGES_REQUESTED, APPROVED, BLOCKED, REJECTED, DEPRECATED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the caller of POST /model-versions/{version_id}/submit-for-review; segregation-of-duties reference."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ModelApprover who last decided this version."
        default: null
      - name: approved_at
        type: datetime
        source: computed
        description: "Logical-clock instant of the most recent PENDING_REVIEW->APPROVED transition; input to calculations.revalidation_schedule."
        default: null
      - name: revalidation_due_at
        type: datetime
        source: computed
        description: "Output of calculations.revalidation_schedule; when this version must be revalidated."
        default: null
      - name: evaluation_sample_quota
        type: integer
        source: input
        description: "Total labelled prediction samples this version may reserve across challenger evaluations."
        default: 50000
        constraints: "1..1000000"
      - name: evaluation_sample_budget
        type: integer
        source: computed
        description: "Output of calculations.evaluation_sample_ledger; unreserved remainder of evaluation_sample_quota."
        default: 50000
      - name: blocked_reason
        type: string
        source: system
        description: "Reason recorded when the version entered BLOCKED via the dataset-revocation cascade."
        default: null

  - name: ServingEndpoint
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Serving cluster label."
        constraints: "1..120 chars; unique per (name, region) pair, compared as case-sensitive exact match on both members (see validations priority 52); ERR_DUPLICATE_SERVING_ENDPOINT_NAME on collision"
      - name: region
        type: string
        source: input
        description: "Deployment region slug."
        constraints: "1..40 chars"
      - name: max_traffic_pct
        type: number
        source: input
        description: "Total traffic percentage this cluster may have allocated across all non-terminal deployments."
        default: 100
        constraints: "1.00..100.00, two decimals"
      - name: allocated_traffic_pct
        type: number
        source: computed
        description: "Output of calculations.endpoint_traffic_ledger; sum of traffic_pct over this endpoint's deployments in {RAMPING, HELD, LIVE, DRAINING}."
        default: 0
      - name: operational_state
        type: enum
        source: system
        description: "Operator posture of the cluster; gates deployment creation and ramping."
        default: OPEN
        constraints: "one of {OPEN, FROZEN, DRAINED}"
      - name: deploy_cooldown_minutes
        type: integer
        source: input
        description: "Trailing buffer appended to every deployment's serve_until when testing serve-window collisions on this endpoint."
        default: 30
        constraints: "0..240"
      - name: serving_feature_spec_hash
        type: string
        source: input
        description: "Digest of the feature-pipeline specification this cluster actually serves; must equal ModelVersion.feature_spec_hash for a deployment to be created."
        constraints: "1..80 chars"

  - name: Deployment
    parent: null
    common_fields: true
    fields:
      - name: model_version_id
        type: string
        source: input
        description: "FK -> ModelVersion.id; version being served."
      - name: serving_endpoint_id
        type: string
        source: input
        description: "FK -> ServingEndpoint.id; cluster the traffic is allocated on."
      - name: pattern
        type: enum
        source: input
        description: "Deployment pattern; selects the ramp checkpoint table and the headroom reserve rule."
        constraints: "one of {BATCH, REALTIME, SHADOW}"
      - name: serve_from
        type: datetime
        source: input
        description: "Inclusive start of the serve interval."
      - name: serve_until
        type: datetime
        source: input
        description: "Exclusive end of the serve interval."
        constraints: "must be strictly greater than serve_from, else ERR_INVALID_INTERVAL"
      - name: rollout_state
        type: enum
        source: system
        description: "Rollout dimension of the deployment's parallel state machine."
        default: PENDING
        constraints: "one of {PENDING, RAMPING, HELD, LIVE, DRAINING, ROLLED_BACK, RETIRED}"
      - name: health_state
        type: enum
        source: system
        description: "Health dimension of the deployment's parallel state machine; evolves independently of rollout_state."
        default: HEALTHY
        constraints: "one of {HEALTHY, DEGRADED, CRITICAL}"
      - name: traffic_pct
        type: number
        source: computed
        description: "Output of calculations.traffic_ramp_step_plan; percentage of endpoint traffic currently allocated to this deployment."
        default: 0
      - name: ramp_step_index
        type: integer
        source: computed
        description: "Index into the pattern's ramp checkpoint table; advances only when traffic_pct lands exactly on the checkpoint."
        default: 0
      - name: target_traffic_pct
        type: number
        source: computed
        description: "Final checkpoint of this pattern's ramp table; 100.00 for every pattern."
        default: 100
      - name: cumulative_ramp_delta_pct
        type: number
        source: computed
        description: "Sum of delta_pct over this deployment's TrafficRampStep rows ordered by created_at ASC; the conserved-quantity witness for the rollback invariant."
        default: 0
      - name: fallback_strategy
        type: enum
        source: input
        description: "Fallback prediction path available when an incident engages fallback."
        default: NONE
        constraints: "one of {NONE, PREVIOUS_CHAMPION, STATIC_DEFAULT, RULE_BASED}"
      - name: manual_override_active
        type: boolean
        source: system
        description: "True while a PredictionIncident manual override pins traffic_pct."
        default: false
      - name: override_traffic_pct
        type: number
        source: system
        description: "Traffic percentage pinned by the manual override; null when manual_override_active is false."
        default: null
      - name: health_score_provisional
        type: number
        source: computed
        description: "Output of calculations.composite_health_score variant PROVISIONAL over this deployment's OPEN windows; null before the first window exists."
        default: null
      - name: health_score_final
        type: number
        source: computed
        description: "Output of calculations.composite_health_score variant FINAL over this deployment's most recently CLOSED PERFORMANCE window; null before the first close."
        default: null
      - name: rolled_back_at
        type: datetime
        source: system
        description: "Logical-clock instant of the ROLLBACK action."
        default: null
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the caller of POST /deployments."

  - name: TrafficRampStep
    parent: null
    common_fields: false
    fields:
      - name: deployment_id
        type: string
        source: system
        description: "FK -> Deployment.id; deployment whose traffic this step moved."
      - name: step_index
        type: integer
        source: system
        description: "Value of Deployment.ramp_step_index at the moment this step was appended (before any advance)."
      - name: from_traffic_pct
        type: number
        source: system
        description: "traffic_pct before this step."
      - name: to_traffic_pct
        type: number
        source: system
        description: "traffic_pct after this step."
      - name: delta_pct
        type: number
        source: system
        description: "to_traffic_pct minus from_traffic_pct; negative for releases."
      - name: reason
        type: enum
        source: system
        description: "Why the step was appended."
        constraints: "one of {RAMP_STEP, ROLLBACK_RELEASE, DRAIN_RELEASE, MANUAL_OVERRIDE, OVERRIDE_RELEASE}"
      - name: health_state_at_step
        type: enum
        source: system
        description: "Deployment.health_state observed when the step was computed."
        constraints: "one of {HEALTHY, DEGRADED, CRITICAL}"
      - name: clock_at_step
        type: datetime
        source: system
        description: "Logical-clock instant of the step."

  - name: MonitoringWindow
    parent: null
    common_fields: true
    fields:
      - name: deployment_id
        type: string
        source: input
        description: "FK -> Deployment.id; deployment the observations came from."
      - name: model_version_id
        type: string
        source: input
        description: "FK -> ModelVersion.id; version being monitored; must equal the deployment's model_version_id, else ERR_WINDOW_VERSION_MISMATCH."
      - name: window_kind
        type: enum
        source: input
        description: "Which monitoring family this window belongs to; overlap and uniqueness are scoped per (deployment_id, window_kind)."
        constraints: "one of {PERFORMANCE, DISTRIBUTION, LATENCY}"
      - name: window_start
        type: datetime
        source: input
        description: "Inclusive start of the observation interval."
      - name: window_end
        type: datetime
        source: input
        description: "Inclusive end of the observation interval."
        constraints: "must be strictly greater than window_start, else ERR_INVALID_INTERVAL"
      - name: prediction_count
        type: integer
        source: input
        description: "Total predictions served in the window."
        constraints: ">= 0"
      - name: labeled_prediction_count
        type: integer
        source: input
        description: "Predictions in the window for which a ground-truth label has arrived."
        constraints: "0 <= labeled_prediction_count <= prediction_count, else ERR_LABEL_COUNT_INCONSISTENT"
      - name: correct_labeled_count
        type: integer
        source: input
        description: "Labelled predictions that matched their ground-truth label."
        constraints: "0 <= correct_labeled_count <= labeled_prediction_count, else ERR_LABEL_COUNT_INCONSISTENT"
      - name: positive_rate
        type: number
        source: input
        description: "Observed positive-class rate of the served predictions."
        constraints: "0.0..1.0"
      - name: p95_latency_ms
        type: integer
        source: input
        description: "Observed p95 inference latency in the window."
        constraints: ">= 1"
      - name: observed_bin_proportions
        type: array
        source: input
        description: "Five observed bin proportions of the monitored feature; the PSI observed distribution."
        constraints: "exactly 5 numbers, each 0.0..1.0, sum within 0.0001 of 1.0; ERR_INVALID_BIN_PROPORTIONS otherwise"
      - name: status
        type: enum
        source: system
        description: "Window lifecycle; CLOSED windows are the only ones eligible as drift inputs or rolling baselines."
        default: OPEN
        constraints: "one of {OPEN, CLOSED}"
      - name: health_score
        type: number
        source: computed
        description: "Output of calculations.composite_health_score for this window under health_score_variant."
        default: null
      - name: health_score_variant
        type: enum
        source: computed
        description: "Which variant produced health_score; PROVISIONAL while OPEN, FINAL after close."
        default: PROVISIONAL
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: baseline_delta_pct
        type: number
        source: computed
        description: "health_score minus 100 * ModelVersion.baseline_accuracy of model_version_id, rounded to two decimals; negative means below baseline."
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Logical-clock instant of POST /monitoring-windows/{window_id}/close."
        default: null

  - name: DriftReport
    parent: null
    common_fields: true
    fields:
      - name: monitoring_window_id
        type: string
        source: input
        description: "FK -> MonitoringWindow.id; the CLOSED window whose observed distribution is scored."
      - name: model_version_id
        type: string
        source: computed
        description: "FK -> ModelVersion.id; copied from the window's model_version_id at creation."
      - name: baseline_dataset_id
        type: string
        source: computed
        description: "FK -> TrainingDataset.id; snapshot supplying the expected distribution when the effective baseline is TRAINING_BASELINE. null when ROLLING_BASELINE was actually used."
        default: null
      - name: drift_kind
        type: enum
        source: input
        description: "Whether feature-input drift or label/outcome drift is being scored."
        constraints: "one of {DATA_DRIFT, CONCEPT_DRIFT}"
      - name: baseline_mode
        type: enum
        source: input
        description: "Requested expected-distribution source; selects the calculations.drift_index variant."
        constraints: "one of {TRAINING_BASELINE, ROLLING_BASELINE}"
      - name: effective_baseline_mode
        type: enum
        source: computed
        description: "Baseline actually used; equals baseline_mode except when ROLLING_BASELINE was requested and zero eligible prior CLOSED windows exist, in which case it falls back to TRAINING_BASELINE."
        constraints: "one of {TRAINING_BASELINE, ROLLING_BASELINE}"
      - name: expected_bin_proportions
        type: array
        source: computed
        description: "The five expected proportions actually used, each rounded to four decimals."
      - name: windows_used_count
        type: integer
        source: computed
        description: "Number of prior CLOSED windows averaged for the rolling baseline; 0 when effective_baseline_mode is TRAINING_BASELINE."
        default: 0
      - name: drift_index
        type: number
        source: computed
        description: "Output of calculations.drift_index; the population-stability index of observed vs expected."
      - name: severity
        type: enum
        source: computed
        description: "Threshold band of drift_index."
        constraints: "one of {NONE, WARN, CRITICAL}"
      - name: status
        type: enum
        source: system
        description: "Report lifecycle; BREACHED means a RetrainingTrigger was raised by this report."
        default: COMPUTED
        constraints: "one of {COMPUTED, BREACHED, ACKNOWLEDGED}"

  - name: SkewCheck
    parent: null
    common_fields: true
    fields:
      - name: model_version_id
        type: string
        source: input
        description: "FK -> ModelVersion.id; version whose training feature statistics are compared."
      - name: deployment_id
        type: string
        source: input
        description: "FK -> Deployment.id; deployment whose serving feature statistics are compared; must reference model_version_id, else ERR_SKEW_DEPLOYMENT_MISMATCH."
      - name: training_dataset_id
        type: string
        source: computed
        description: "FK -> TrainingDataset.id; copied from the version's training_dataset_id at creation."
      - name: training_feature_stats
        type: object
        source: input
        description: "Map of feature_name -> { mean: number } measured on the training snapshot."
        constraints: "at least one feature; every value must contain a numeric `mean`, else ERR_INVALID_FEATURE_STATS"
      - name: serving_feature_stats
        type: object
        source: input
        description: "Map of feature_name -> { mean: number } measured at serving time."
        constraints: "every value must contain a numeric `mean`, else ERR_INVALID_FEATURE_STATS"
      - name: max_skew_ratio
        type: number
        source: computed
        description: "Output of calculations.feature_skew_ratio; largest symmetric mean ratio across the compared features; 1.0000 when the maps agree exactly."
      - name: max_skew_feature
        type: string
        source: computed
        description: "Feature name attaining max_skew_ratio; ties broken by lowest feature_name in lexicographic ASCII order. null when serving_feature_stats shares no feature with training_feature_stats."
        default: null
      - name: missing_features
        type: array
        source: computed
        description: "Feature names present in training_feature_stats but absent from serving_feature_stats, sorted lexicographic ASCII ascending."
        default: []
      - name: status
        type: enum
        source: computed
        description: "Skew verdict; FAIL_* verdicts block ramping and promotion."
        constraints: "one of {PASS, WARN, FAIL_SKEW, FAIL_MISSING_FEATURE}"
      - name: checked_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the check was recorded."

  - name: RetrainingTrigger
    parent: null
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: computed
        description: "FK -> Model.id; copied from the drift report's version at raise time."
      - name: drift_report_id
        type: string
        source: computed
        description: "FK -> DriftReport.id; the BREACHED report that raised this trigger."
      - name: skew_check_id
        type: string
        source: computed
        description: "FK -> SkewCheck.id; most recent SkewCheck for the report's deployment ordered by checked_at DESC then created_at DESC. null when no SkewCheck exists for that deployment."
        default: null
      - name: retrained_version_id
        type: string
        source: system
        description: "FK -> ModelVersion.id; version linked as the retraining outcome. null until LINK_VERSION disposition."
        default: null
      - name: base_urgency
        type: number
        source: computed
        description: "Output of calculations.retraining_urgency step 1; pre-escalation urgency."
      - name: escalation_tier_bonus_pct
        type: number
        source: computed
        description: "Output of calculations.retraining_urgency step 2; escalation percentage selected by base_urgency alone."
      - name: total_urgency
        type: number
        source: computed
        description: "Output of calculations.retraining_urgency step 4; base_urgency plus escalation bonus, capped at URGENCY_CEILING."
      - name: priority_band
        type: enum
        source: computed
        description: "Band of total_urgency."
        constraints: "one of {LOW, MEDIUM, HIGH, CRITICAL}"
      - name: retrain_required
        type: boolean
        source: computed
        description: "True when total_urgency >= RETRAIN_REQUIRED_THRESHOLD; DISMISS is rejected while true."
      - name: status
        type: enum
        source: system
        description: "Trigger lifecycle."
        default: PROPOSED
        constraints: "one of {PROPOSED, ACKNOWLEDGED, IN_PROGRESS, SATISFIED, DISMISSED, STALE}"
      - name: acknowledged_by_user_id
        type: string
        source: system
        description: "X-User-ID of the caller who acknowledged the trigger."
        default: null
      - name: dismissed_reason
        type: string
        source: system
        description: "Reason recorded with the DISMISS disposition."
        default: null
      - name: stale_after
        type: datetime
        source: computed
        description: "Output of calculations.retraining_urgency step 5; raise instant plus STALE_AFTER_DAYS days. The revalidation sweep marks ACKNOWLEDGED and IN_PROGRESS triggers STALE once the clock passes this instant."

  - name: ChallengerEvaluation
    parent: null
    common_fields: true
    fields:
      - name: model_id
        type: string
        source: input
        description: "FK -> Model.id; taken from the path segment of POST /models/{model_id}/challenger-evaluations."
      - name: champion_deployment_id
        type: string
        source: input
        description: "FK -> Deployment.id; the incumbent REALTIME deployment being compared against."
      - name: challenger_deployment_id
        type: string
        source: input
        description: "FK -> Deployment.id; the SHADOW deployment carrying the challenger version."
      - name: challenger_version_id
        type: string
        source: computed
        description: "FK -> ModelVersion.id; copied from challenger_deployment's model_version_id at creation."
      - name: reserved_samples
        type: integer
        source: input
        description: "Labelled prediction samples reserved from the challenger version's evaluation_sample_budget."
        constraints: ">= 1"
      - name: evaluation_ends_at
        type: datetime
        source: input
        description: "Earliest logical-clock instant at which the evaluation may be concluded."
      - name: extension_count
        type: integer
        source: computed
        description: "Number of times this evaluation has been re-opened from INCONCLUSIVE."
        default: 0
      - name: champion_metrics
        type: object
        source: input
        description: "Map with numeric keys ACCURACY_PROXY, CALIBRATION, LATENCY, COST measured on the champion deployment."
        constraints: "all four keys required and numeric, else ERR_INVALID_METRIC_SET"
      - name: challenger_metrics
        type: object
        source: input
        description: "Map with numeric keys ACCURACY_PROXY, CALIBRATION, LATENCY, COST measured on the challenger deployment."
        constraints: "all four keys required and numeric, else ERR_INVALID_METRIC_SET"
      - name: metric_lines
        type: object
        source: computed
        description: "Output of calculations.challenger_promotion_score; the four per-metric weighted lines each rounded to four decimals."
        default: null
      - name: promotion_score
        type: number
        source: computed
        description: "Output of calculations.challenger_promotion_score; sum of metric_lines rounded to four decimals. null until conclude."
        default: null
      - name: labeled_prediction_count
        type: integer
        source: input
        description: "Labelled predictions actually collected, supplied at conclude time."
        default: null
        constraints: ">= 0"
      - name: criteria_failures
        type: array
        source: computed
        description: "Promotion-criterion keys that failed at conclude, sorted lexicographic ASCII ascending; empty when the challenger was promoted."
        default: []
      - name: status
        type: enum
        source: system
        description: "Evaluation lifecycle; the COLLECTING fork picks exactly one of the three outcome states."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COLLECTING, PROMOTED, REJECTED, INCONCLUSIVE}"
      - name: created_by_user_id
        type: string
        source: system
        description: "X-User-ID of the caller of POST /models/{model_id}/challenger-evaluations."

  - name: PredictionIncident
    parent: null
    common_fields: true
    fields:
      - name: deployment_id
        type: string
        source: input
        description: "FK -> Deployment.id; deployment producing degraded predictions."
      - name: model_version_id
        type: string
        source: computed
        description: "FK -> ModelVersion.id; copied from the deployment at creation."
      - name: drift_report_id
        type: string
        source: computed
        description: "FK -> DriftReport.id; the CRITICAL report whose cascade auto-raised this incident. null for manually reported incidents."
        default: null
      - name: source
        type: enum
        source: input
        description: "What surfaced the degradation. Auto-raised incidents are stamped DRIFT by the cascade and ignore any supplied value."
        default: MANUAL
        constraints: "one of {MANUAL, DRIFT, SKEW, LATENCY}"
      - name: severity
        type: enum
        source: input
        description: "Incident severity."
        default: SEV3
        constraints: "one of {SEV3, SEV2, SEV1}; the drift cascade stamps SEV2"
      - name: summary
        type: string
        source: input
        description: "Short description of the degradation."
        constraints: "1..300 chars"
      - name: status
        type: enum
        source: system
        description: "Incident lifecycle with a MONITORING -> MITIGATING recurrence loop."
        default: OPEN
        constraints: "one of {OPEN, MITIGATING, MONITORING, RESOLVED, ESCALATED}"
      - name: fallback_engaged
        type: boolean
        source: system
        description: "True once ENGAGE_FALLBACK succeeded on this incident."
        default: false
      - name: fallback_strategy_used
        type: enum
        source: system
        description: "Deployment.fallback_strategy captured at the moment fallback was engaged."
        default: null
        constraints: "one of {PREVIOUS_CHAMPION, STATIC_DEFAULT, RULE_BASED} or null"
      - name: manual_override_traffic_pct
        type: number
        source: system
        description: "Traffic percentage pinned on the deployment by MANUAL_OVERRIDE; null when no override was applied."
        default: null
      - name: recurrence_count
        type: integer
        source: computed
        description: "Number of MONITORING -> MITIGATING loops taken; ESCALATED is forced once it reaches MAX_RECURRENCES."
        default: 0
      - name: opened_at
        type: datetime
        source: system
        description: "Logical-clock instant the incident was raised."
      - name: resolved_at
        type: datetime
        source: system
        description: "Logical-clock instant of RESOLVE."
        default: null

  - name: RevalidationTask
    parent: null
    common_fields: true
    fields:
      - name: model_version_id
        type: string
        source: computed
        description: "FK -> ModelVersion.id; version whose periodic revalidation came due."
      - name: due_at
        type: datetime
        source: computed
        description: "Copy of ModelVersion.revalidation_due_at at sweep time."
      - name: status
        type: enum
        source: system
        description: "Revalidation lifecycle."
        default: DUE
        constraints: "one of {DUE, IN_REVIEW, PASSED, FAILED}"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the ModelApprover who took the task into review."
        default: null
      - name: findings
        type: string
        source: input
        description: "Reviewer notes supplied with the PASS or FAIL disposition."
        default: null
        constraints: "1..500 chars when present"
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant of the PASS/FAIL disposition."
        default: null
      - name: swept_at
        type: datetime
        source: system
        description: "Logical-clock instant of the sweep that created this task."

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: TrainingDataset
    dimension: approval_state
    shape: "branching with revert + resubmission cycle (DRAFT -> SUBMITTED -> REJECTED -> DRAFT)"
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /training-datasets/{dataset_id}/submit"
        actor: MLEngineer | DataSteward
        preconditions:
          - "approval_state == DRAFT"
          - "pii_review_passed == true, else ERR_PII_REVIEW_MISSING"
          - "baseline_bin_proportions has exactly 5 entries summing to 1.0 +/- 0.0001"
        side_effects:
          - "increments TrainingDataset.version by 1 and refreshes updated_at"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /training-datasets/{dataset_id}/decision with decision=APPROVE"
        actor: DataSteward
        preconditions:
          - "approval_state == SUBMITTED"
          - "X-User-ID != TrainingDataset.registered_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets decided_by_user_id = X-User-ID and decided_at = clock_now"
          - "increments TrainingDataset.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /training-datasets/{dataset_id}/decision with decision=REJECT"
        actor: DataSteward
        preconditions:
          - "approval_state == SUBMITTED"
          - "X-User-ID != TrainingDataset.registered_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets decided_by_user_id = X-User-ID and decided_at = clock_now"
          - "recomputes dependent_version_count per calculations.dataset_dependency_counter (REJECTED datasets keep their count; only their versions become unapprovable)"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /training-datasets/{dataset_id}/submit"
        actor: MLEngineer | DataSteward
        note: "Resubmission loop: the submit endpoint accepted from REJECTED first returns the row to DRAFT in the same request, then applies the DRAFT -> SUBMITTED transition above, so a single call lands on SUBMITTED and clears decided_by_user_id / decided_at."
        preconditions:
          - "approval_state == REJECTED"
          - "pii_review_passed == true, else ERR_PII_REVIEW_MISSING"
        side_effects:
          - "clears decided_by_user_id and decided_at to null"
          - "then applies DRAFT -> SUBMITTED in the same request"
      - from: APPROVED
        to: REVOKED
        trigger: "POST /training-datasets/{dataset_id}/revoke"
        actor: DataSteward | PlatformAdmin
        preconditions:
          - "approval_state == APPROVED, else ERR_INVALID_STATE"
        side_effects:
          - "sets revocation_reason from the request body and decided_at = clock_now"
          - "CASCADE HOP 1 -> HOP 2: because this dataset left APPROVED, every ModelVersion whose training_dataset_id == this dataset and whose approval_state == APPROVED transitions APPROVED -> BLOCKED with blocked_reason = 'TRAINING_DATA_REVOKED', processed in created_at ASC order"
          - "CASCADE HOP 2 -> HOP 3: because each of those versions entered BLOCKED, every Deployment referencing such a version whose rollout_state IN {RAMPING, HELD, LIVE} transitions to DRAINING, its traffic_pct is set to 0.00, a TrafficRampStep with reason = DRAIN_RELEASE and delta_pct = -(previous traffic_pct) is appended, and the owning ServingEndpoint.allocated_traffic_pct is recomputed by calculations.endpoint_traffic_ledger; deployments processed in created_at ASC order"
          - "CASCADE HOP 3 -> HOP 4: because each of those deployments left {RAMPING, HELD, LIVE}, every ChallengerEvaluation whose champion_deployment_id or challenger_deployment_id is such a deployment and whose status == COLLECTING transitions COLLECTING -> INCONCLUSIVE, criteria_failures gains 'DEPLOYMENT_DRAINED', and reserved_samples are returned to challenger_version.evaluation_sample_budget via calculations.evaluation_sample_ledger; evaluations processed in created_at ASC order"
          - "increments version by 1 on TrainingDataset and on every entity mutated by hops 2, 3 and 4"

  - entity: ModelVersion
    dimension: approval_state
    shape: "branching with revert cycle (PENDING_REVIEW -> CHANGES_REQUESTED -> DRAFT) plus a BLOCKED <-> APPROVED recovery cycle"
    initial_state: DRAFT
    terminal_states: [REJECTED, DEPRECATED]
    transitions:
      - from: DRAFT
        to: PENDING_REVIEW
        trigger: "POST /model-versions/{version_id}/submit-for-review"
        actor: MLEngineer
        preconditions:
          - "approval_state == DRAFT, else ERR_INVALID_STATE"
          - "Model.registry_status == ACTIVE, else ERR_MODEL_ARCHIVED"
        side_effects:
          - "sets submitted_by_user_id = X-User-ID"
          - "recomputes doc_completeness_pct and reproducibility_score per calculations.documentation_and_reproducibility_score"
          - "increments ModelVersion.version by 1"
      - from: CHANGES_REQUESTED
        to: DRAFT
        trigger: "PATCH /model-versions/{version_id}/documentation"
        actor: MLEngineer
        note: "Revision loop: editing documentation on a CHANGES_REQUESTED version returns it to DRAFT so it can be resubmitted."
        preconditions:
          - "approval_state IN {DRAFT, CHANGES_REQUESTED}, else ERR_INVALID_STATE"
        side_effects:
          - "replaces doc_sections and repro_artifacts wholesale"
          - "recomputes doc_completeness_pct and reproducibility_score per calculations.documentation_and_reproducibility_score"
          - "clears decided_by_user_id to null"
          - "increments ModelVersion.version by 1"
      - from: PENDING_REVIEW
        to: APPROVED
        trigger: "POST /model-versions/{version_id}/decision with decision=APPROVE"
        actor: ModelApprover
        preconditions:
          - "approval_state == PENDING_REVIEW, else ERR_INVALID_STATE"
          - "X-User-ID != ModelVersion.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "doc_completeness_pct >= DOC_COMPLETENESS_MIN_PCT and reproducibility_score == 100.00, else ERR_DOCUMENTATION_INCOMPLETE"
          - "CROSS-ENTITY: TrainingDataset(training_dataset_id).approval_state == APPROVED, else ERR_DATASET_NOT_APPROVED"
        side_effects:
          - "sets decided_by_user_id = X-User-ID and approved_at = clock_now"
          - "computes revalidation_due_at per calculations.revalidation_schedule"
          - "increments Model.version by 1 (dependent_version_count and open_retraining_trigger_count are re-read on the parent) and increments ModelVersion.version by 1"
      - from: PENDING_REVIEW
        to: CHANGES_REQUESTED
        trigger: "POST /model-versions/{version_id}/decision with decision=REQUEST_CHANGES"
        actor: ModelApprover
        preconditions:
          - "approval_state == PENDING_REVIEW, else ERR_INVALID_STATE"
          - "X-User-ID != ModelVersion.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
          - "increments ModelVersion.version by 1"
      - from: PENDING_REVIEW
        to: REJECTED
        trigger: "POST /model-versions/{version_id}/decision with decision=REJECT"
        actor: ModelApprover
        preconditions:
          - "approval_state == PENDING_REVIEW, else ERR_INVALID_STATE"
          - "X-User-ID != ModelVersion.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets decided_by_user_id = X-User-ID"
          - "recomputes TrainingDataset.dependent_version_count per calculations.dataset_dependency_counter (REJECTED versions leave the count)"
          - "increments ModelVersion.version by 1 and TrainingDataset.version by 1"
      - from: APPROVED
        to: BLOCKED
        trigger: "system event: cascade hop 2 of POST /training-datasets/{dataset_id}/revoke, OR cascade hop 2 of POST /revalidation-tasks/{revalidation_task_id}/disposition with action=FAIL"
        actor: system
        preconditions:
          - "approval_state == APPROVED"
          - "for the revoke producer: training_dataset_id is the dataset being revoked"
          - "for the revalidation producer: this version is the failed task's model_version_id"
        side_effects:
          - "sets blocked_reason = 'TRAINING_DATA_REVOKED' for the revoke producer, or 'REVALIDATION_FAILED' for the revalidation producer"
          - "for the revalidation producer only: clears revalidation_due_at to null"
          - "triggers cascade hop 3 on this version's non-terminal deployments"
          - "increments ModelVersion.version by 1"
      - from: BLOCKED
        to: APPROVED
        trigger: "POST /model-versions/{version_id}/decision with decision=APPROVE"
        actor: ModelApprover
        note: "Recovery cycle: after the version is repointed to an APPROVED snapshot the approver can restore it without a fresh review round."
        preconditions:
          - "approval_state == BLOCKED, else ERR_INVALID_STATE"
          - "X-User-ID != ModelVersion.submitted_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "CROSS-ENTITY: TrainingDataset(training_dataset_id).approval_state == APPROVED, else ERR_DATASET_NOT_APPROVED"
        side_effects:
          - "clears blocked_reason to null, sets decided_by_user_id = X-User-ID and approved_at = clock_now"
          - "recomputes revalidation_due_at per calculations.revalidation_schedule"
          - "increments ModelVersion.version by 1"
      - from: APPROVED
        to: DEPRECATED
        trigger: "POST /model-versions/{version_id}/deprecate"
        actor: ModelApprover | PlatformAdmin
        preconditions:
          - "approval_state IN {APPROVED, BLOCKED}, else ERR_INVALID_STATE"
          - "no Deployment referencing this version has rollout_state IN {RAMPING, HELD, LIVE}, else ERR_VERSION_STILL_SERVING"
          - "Model.champion_version_id != this version, else ERR_CANNOT_DEPRECATE_CHAMPION"
        side_effects:
          - "clears revalidation_due_at to null"
          - "cancels every RevalidationTask for this version whose status IN {DUE, IN_REVIEW} by leaving it untouched is FORBIDDEN: each such task transitions to PASSED with findings = 'VERSION_DEPRECATED'"
          - "increments ModelVersion.version by 1 and the version of every RevalidationTask mutated"
      - from: BLOCKED
        to: DEPRECATED
        trigger: "POST /model-versions/{version_id}/deprecate"
        actor: ModelApprover | PlatformAdmin
        preconditions:
          - "approval_state == BLOCKED"
          - "no Deployment referencing this version has rollout_state IN {RAMPING, HELD, LIVE}, else ERR_VERSION_STILL_SERVING"
        side_effects:
          - "same as APPROVED -> DEPRECATED"

  - entity: Deployment
    dimension: rollout_state
    shape: "cyclic (RAMPING <-> HELD) and one of two parallel dimensions on the same row; health_state below evolves independently"
    initial_state: PENDING
    terminal_states: [ROLLED_BACK, RETIRED]
    transitions:
      - from: PENDING
        to: RAMPING
        trigger: "POST /deployments/{deployment_id}/ramp (first call)"
        actor: ReliabilityEngineer
        preconditions:
          - "rollout_state == PENDING, else ERR_INVALID_STATE"
          - "CROSS-ENTITY: ServingEndpoint(serving_endpoint_id).operational_state == OPEN, else ERR_SERVING_ENDPOINT_NOT_OPEN"
          - "health_state != CRITICAL, else ERR_HEALTH_CRITICAL_BLOCKED"
          - "manual_override_active == false, else ERR_MANUAL_OVERRIDE_ACTIVE"
          - "serve_until > clock_now, else ERR_SERVE_WINDOW_EXPIRED"
          - "no PredictionIncident with deployment_id == this deployment and status IN {OPEN, MITIGATING}, else ERR_OPEN_INCIDENT_BLOCKS_ACTION"
          - "the latest SkewCheck for (model_version_id, deployment_id) ordered by checked_at DESC then created_at DESC, when one exists, has status NOT IN {FAIL_SKEW, FAIL_MISSING_FEATURE}, else ERR_SKEW_CHECK_FAILED"
          - "calculations.traffic_ramp_step_plan yields granted_delta_pct > 0, else ERR_ENDPOINT_CAPACITY_EXHAUSTED"
        side_effects:
          - "sets traffic_pct = new_traffic_pct from calculations.traffic_ramp_step_plan"
          - "advances ramp_step_index by 1 only when new_traffic_pct == nominal_target"
          - "appends a TrafficRampStep with reason = RAMP_STEP, step_index = the pre-call ramp_step_index, delta_pct = granted_delta_pct, health_state_at_step = health_state, clock_at_step = clock_now"
          - "recomputes cumulative_ramp_delta_pct and ServingEndpoint.allocated_traffic_pct per calculations.endpoint_traffic_ledger"
          - "increments Deployment.version by 1 and ServingEndpoint.version by 1"
      - from: RAMPING
        to: RAMPING
        trigger: "POST /deployments/{deployment_id}/ramp (subsequent calls while checkpoints remain)"
        actor: ReliabilityEngineer
        preconditions:
          - "rollout_state == RAMPING"
          - "ramp_step_index < length of the pattern's checkpoint table, else ERR_RAMP_ALREADY_COMPLETE"
          - "same cross-entity, health, override, serve-window, incident, skew and capacity preconditions as PENDING -> RAMPING"
        side_effects:
          - "same as PENDING -> RAMPING"
      - from: RAMPING
        to: LIVE
        trigger: "POST /deployments/{deployment_id}/ramp (call that lands on the final checkpoint)"
        actor: ReliabilityEngineer
        preconditions:
          - "rollout_state == RAMPING"
          - "the ramp advances ramp_step_index to exactly the length of the pattern's checkpoint table"
        side_effects:
          - "same traffic/ledger side effects as PENDING -> RAMPING"
          - "when pattern == REALTIME: sets Model(model_version.model_id).champion_version_id = model_version_id and champion_promoted_at = clock_now, and increments Model.version by 1"
      - from: RAMPING
        to: HELD
        trigger: "POST /deployments/{deployment_id}/rollout-action with action=HOLD, or system event: cascade hop 3 of POST /drift-reports when severity == CRITICAL"
        actor: ReliabilityEngineer | PlatformAdmin | system
        preconditions:
          - "rollout_state == RAMPING, else ERR_INVALID_STATE"
        side_effects:
          - "traffic_pct and ramp_step_index are left unchanged, so ServingEndpoint.allocated_traffic_pct is unchanged (HELD is inside the ledger's included state set)"
          - "no TrafficRampStep is appended"
          - "increments Deployment.version by 1"
      - from: HELD
        to: RAMPING
        trigger: "POST /deployments/{deployment_id}/rollout-action with action=RESUME"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "rollout_state == HELD, else ERR_INVALID_STATE"
          - "health_state != CRITICAL, else ERR_HEALTH_CRITICAL_BLOCKED"
          - "no PredictionIncident with deployment_id == this deployment and status IN {OPEN, MITIGATING}, else ERR_OPEN_INCIDENT_BLOCKS_ACTION"
        side_effects:
          - "increments Deployment.version by 1"
      - from: RAMPING
        to: ROLLED_BACK
        trigger: "POST /deployments/{deployment_id}/rollout-action with action=ROLLBACK"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "rollout_state IN {RAMPING, HELD, LIVE}, else ERR_INVALID_STATE"
        side_effects:
          - "COMPENSATING ACTION: sets traffic_pct = 0.00, ramp_step_index = 0, rolled_back_at = clock_now"
          - "appends a TrafficRampStep with reason = ROLLBACK_RELEASE and delta_pct = -(pre-call traffic_pct), so cumulative_ramp_delta_pct returns to exactly 0.00"
          - "recomputes ServingEndpoint.allocated_traffic_pct per calculations.endpoint_traffic_ledger; the endpoint's allocated_traffic_pct returns to its value before this deployment's first ramp"
          - "when Model.champion_version_id == model_version_id: sets Model.champion_version_id = parent_version_id of that version (null when the version has no parent) and champion_promoted_at = clock_now"
          - "every ChallengerEvaluation whose champion_deployment_id or challenger_deployment_id is this deployment and whose status == COLLECTING transitions COLLECTING -> INCONCLUSIVE and returns reserved_samples per calculations.evaluation_sample_ledger"
          - "increments Deployment.version, ServingEndpoint.version and the version of every entity mutated"
      - from: HELD
        to: ROLLED_BACK
        trigger: "POST /deployments/{deployment_id}/rollout-action with action=ROLLBACK"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "rollout_state == HELD"
        side_effects:
          - "same as RAMPING -> ROLLED_BACK"
      - from: LIVE
        to: ROLLED_BACK
        trigger: "POST /deployments/{deployment_id}/rollout-action with action=ROLLBACK"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "rollout_state == LIVE"
        side_effects:
          - "same as RAMPING -> ROLLED_BACK"
      - from: RAMPING
        to: DRAINING
        trigger: "system event: cascade hop 3 of POST /training-datasets/{dataset_id}/revoke"
        actor: system
        preconditions:
          - "rollout_state IN {RAMPING, HELD, LIVE}"
          - "the referenced ModelVersion just entered BLOCKED in this same request"
        side_effects:
          - "sets traffic_pct = 0.00 and appends a TrafficRampStep with reason = DRAIN_RELEASE and delta_pct = -(pre-cascade traffic_pct)"
          - "recomputes ServingEndpoint.allocated_traffic_pct (DRAINING is still inside the ledger's included state set, but the deployment now contributes 0.00)"
          - "triggers cascade hop 4 on this deployment's COLLECTING challenger evaluations"
          - "increments Deployment.version and ServingEndpoint.version by 1"
      - from: HELD
        to: DRAINING
        trigger: "system event: cascade hop 3 of POST /training-datasets/{dataset_id}/revoke"
        actor: system
        preconditions:
          - "rollout_state == HELD and the referenced ModelVersion just entered BLOCKED"
        side_effects:
          - "same as RAMPING -> DRAINING"
      - from: LIVE
        to: DRAINING
        trigger: "system event: cascade hop 3 of POST /training-datasets/{dataset_id}/revoke"
        actor: system
        preconditions:
          - "rollout_state == LIVE and the referenced ModelVersion just entered BLOCKED"
        side_effects:
          - "same as RAMPING -> DRAINING"
      - from: DRAINING
        to: RETIRED
        trigger: "POST /deployments/{deployment_id}/rollout-action with action=RETIRE"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "rollout_state IN {PENDING, LIVE, DRAINING}, else ERR_INVALID_STATE"
        side_effects:
          - "sets traffic_pct = 0.00; appends no TrafficRampStep when traffic_pct is already 0.00, otherwise appends one with reason = DRAIN_RELEASE"
          - "recomputes ServingEndpoint.allocated_traffic_pct (RETIRED is outside the ledger's included state set)"
          - "increments Deployment.version and ServingEndpoint.version by 1"
      - from: LIVE
        to: RETIRED
        trigger: "POST /deployments/{deployment_id}/rollout-action with action=RETIRE"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "rollout_state == LIVE"
        side_effects:
          - "same as DRAINING -> RETIRED"
      - from: PENDING
        to: RETIRED
        trigger: "POST /deployments/{deployment_id}/rollout-action with action=RETIRE"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "rollout_state == PENDING"
        side_effects:
          - "recomputes ServingEndpoint.allocated_traffic_pct (unchanged, since PENDING contributed 0.00)"
          - "increments Deployment.version and ServingEndpoint.version by 1"

  - entity: Deployment
    dimension: health_state
    shape: "parallel dimension on the same row as rollout_state; cyclic (HEALTHY -> DEGRADED -> HEALTHY, DEGRADED -> CRITICAL -> DEGRADED)"
    initial_state: HEALTHY
    terminal_states: []
    transitions:
      - from: HEALTHY
        to: DEGRADED
        trigger: "system event: cascade hop 2 of POST /drift-reports when severity == WARN"
        actor: system
        preconditions:
          - "health_state == HEALTHY"
          - "the created DriftReport has severity == WARN"
        side_effects:
          - "halves every subsequent ramp step via the DEGRADED branch of calculations.traffic_ramp_step_plan"
          - "increments Deployment.version by 1"
      - from: HEALTHY
        to: CRITICAL
        trigger: "system event: cascade hop 2 of POST /drift-reports when severity == CRITICAL"
        actor: system
        preconditions:
          - "health_state == HEALTHY"
          - "the created DriftReport has severity == CRITICAL"
        side_effects:
          - "CASCADE HOP 2 -> HOP 3: because health_state became CRITICAL, a Deployment in rollout_state == RAMPING transitions RAMPING -> HELD"
          - "increments Deployment.version by 1"
      - from: DEGRADED
        to: CRITICAL
        trigger: "system event: cascade hop 2 of POST /drift-reports when severity == CRITICAL"
        actor: system
        preconditions:
          - "health_state == DEGRADED"
          - "the created DriftReport has severity == CRITICAL"
        side_effects:
          - "same as HEALTHY -> CRITICAL"
      - from: DEGRADED
        to: HEALTHY
        trigger: "POST /monitoring-windows/{window_id}/close"
        actor: ReliabilityEngineer | MLEngineer
        preconditions:
          - "health_state == DEGRADED"
          - "window_kind == PERFORMANCE and the FINAL health_score of the closed window >= HEALTH_RECOVERY_MIN_SCORE"
        side_effects:
          - "writes Deployment.health_score_final = the closed window's health_score"
          - "increments Deployment.version by 1"
      - from: CRITICAL
        to: DEGRADED
        trigger: "POST /prediction-incidents/{incident_id}/actions with action=RESOLVE"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "health_state == CRITICAL"
          - "no other PredictionIncident on this deployment has status IN {OPEN, MITIGATING, MONITORING, ESCALATED}"
        side_effects:
          - "increments Deployment.version by 1"

  - entity: MonitoringWindow
    dimension: status
    shape: "linear (OPEN -> CLOSED) but its close transition is the switch point of the dual-variant health score"
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /monitoring-windows/{window_id}/close"
        actor: ReliabilityEngineer | MLEngineer
        preconditions:
          - "status == OPEN, else ERR_INVALID_STATE"
          - "window_end <= clock_now, else ERR_WINDOW_NOT_ENDED"
        side_effects:
          - "sets closed_at = clock_now and health_score_variant = FINAL"
          - "recomputes health_score with the FINAL variant of calculations.composite_health_score and rewrites baseline_delta_pct"
          - "when window_kind == PERFORMANCE: writes Deployment.health_score_final = health_score and, when Deployment.health_state == DEGRADED and health_score >= HEALTH_RECOVERY_MIN_SCORE, applies the Deployment health transition DEGRADED -> HEALTHY"
          - "increments MonitoringWindow.version by 1 and Deployment.version by 1"

  - entity: DriftReport
    dimension: status
    shape: "branching on severity: COMPUTED for severity NONE, BREACHED for severity IN {WARN, CRITICAL}, with divergent side-effect sets"
    initial_state: COMPUTED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: COMPUTED
        to: BREACHED
        trigger: "POST /drift-reports (evaluated inside the creating request)"
        actor: ReliabilityEngineer | MLEngineer
        preconditions:
          - "severity IN {WARN, CRITICAL} after calculations.drift_index"
        side_effects:
          - "CASCADE HOP 1 -> HOP 2: because the report status became BREACHED, a RetrainingTrigger is created in status PROPOSED with urgency fields from calculations.retraining_urgency, and Model.open_retraining_trigger_count is recomputed"
          - "CASCADE HOP 2 -> HOP 3 (severity == WARN): because the trigger was raised, the report's Deployment applies health HEALTHY -> DEGRADED"
          - "CASCADE HOP 2 -> HOP 3 (severity == CRITICAL): because the trigger was raised, the report's Deployment applies health {HEALTHY, DEGRADED} -> CRITICAL"
          - "CASCADE HOP 3 -> HOP 4 (severity == CRITICAL only): because health_state became CRITICAL, a Deployment in rollout_state == RAMPING applies rollout RAMPING -> HELD"
          - "CASCADE HOP 4 -> HOP 5 (severity == CRITICAL only): because the deployment was auto-held, a PredictionIncident is created in status OPEN with source = DRIFT, severity = SEV2, drift_report_id = this report, summary = 'AUTO: critical drift breach'"
          - "increments the version of every entity mutated by hops 2 through 5"
        note: "The Deployment for a report is DriftReport -> MonitoringWindow(monitoring_window_id).deployment_id. severity NONE produces no transition at all: the report stays COMPUTED and no trigger, health change, hold or incident is created."
      - from: BREACHED
        to: ACKNOWLEDGED
        trigger: "POST /retraining-triggers/{retraining_trigger_id}/disposition with action=ACKNOWLEDGE"
        actor: MLEngineer | PlatformAdmin
        preconditions:
          - "status == BREACHED"
          - "the disposed trigger's drift_report_id == this report"
        side_effects:
          - "increments DriftReport.version by 1"

  - entity: ChallengerEvaluation
    dimension: status
    shape: "fork-join with cycle: COLLECTING -> {PROMOTED, REJECTED, INCONCLUSIVE} with a different side-effect set per branch, and INCONCLUSIVE -> COLLECTING re-entry"
    initial_state: SCHEDULED
    terminal_states: [PROMOTED, REJECTED]
    transitions:
      - from: SCHEDULED
        to: COLLECTING
        trigger: "POST /challenger-evaluations/{evaluation_id}/start"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "status == SCHEDULED, else ERR_INVALID_STATE"
          - "CROSS-ENTITY: Deployment(challenger_deployment_id).rollout_state IN {RAMPING, LIVE}, else ERR_CHALLENGER_NOT_SERVING"
          - "CROSS-ENTITY: Deployment(champion_deployment_id).rollout_state == LIVE, else ERR_CHAMPION_NOT_LIVE"
        side_effects:
          - "increments ChallengerEvaluation.version by 1"
      - from: COLLECTING
        to: PROMOTED
        trigger: "POST /challenger-evaluations/{evaluation_id}/conclude (criteria_failures empty)"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "status == COLLECTING, else ERR_INVALID_STATE"
          - "clock_now >= evaluation_ends_at, else ERR_EVALUATION_NOT_MATURE"
          - "labeled_prediction_count >= 1, else ERR_NO_LABELED_PREDICTIONS"
          - "calculations.challenger_promotion_score yields criteria_failures == []"
        side_effects:
          - "writes metric_lines, promotion_score and criteria_failures = []"
          - "sets Model.champion_version_id = challenger_version_id and champion_promoted_at = clock_now; increments Model.version by 1"
          - "reserved_samples stay consumed: PROMOTED is inside the included set of calculations.evaluation_sample_ledger, so challenger_version.evaluation_sample_budget is unchanged by this transition"
          - "increments ChallengerEvaluation.version by 1"
      - from: COLLECTING
        to: REJECTED
        trigger: "POST /challenger-evaluations/{evaluation_id}/conclude (criteria_failures non-empty and not exactly ['INSUFFICIENT_LABELS'])"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "status == COLLECTING"
          - "clock_now >= evaluation_ends_at, else ERR_EVALUATION_NOT_MATURE"
          - "labeled_prediction_count >= 1, else ERR_NO_LABELED_PREDICTIONS"
        side_effects:
          - "writes metric_lines, promotion_score and the sorted criteria_failures list"
          - "Model.champion_version_id is NOT touched"
          - "COMPENSATION: reserved_samples are returned, because REJECTED is outside the included set of calculations.evaluation_sample_ledger; challenger_version.evaluation_sample_budget returns to exactly its pre-create value"
          - "increments ChallengerEvaluation.version and ModelVersion.version by 1"
      - from: COLLECTING
        to: INCONCLUSIVE
        trigger: "POST /challenger-evaluations/{evaluation_id}/conclude (criteria_failures == exactly ['INSUFFICIENT_LABELS'])"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "status == COLLECTING"
          - "clock_now >= evaluation_ends_at, else ERR_EVALUATION_NOT_MATURE"
          - "1 <= labeled_prediction_count < MIN_LABELED_PREDICTIONS"
        side_effects:
          - "writes metric_lines, promotion_score and criteria_failures = ['INSUFFICIENT_LABELS']"
          - "COMPENSATION: reserved_samples are returned, because INCONCLUSIVE is outside the included set of calculations.evaluation_sample_ledger"
          - "increments ChallengerEvaluation.version and ModelVersion.version by 1"
      - from: COLLECTING
        to: INCONCLUSIVE
        trigger: "system event: cascade hop 4 of POST /training-datasets/{dataset_id}/revoke, cascade hop 2 of the ROLLBACK action, or cascade hop 4 of the revalidation FAIL disposition"
        actor: system
        preconditions:
          - "status == COLLECTING"
          - "champion_deployment_id or challenger_deployment_id just left {RAMPING, HELD, LIVE} in this same request"
        side_effects:
          - "appends 'DEPLOYMENT_DRAINED' to criteria_failures"
          - "returns reserved_samples per calculations.evaluation_sample_ledger"
          - "increments ChallengerEvaluation.version and ModelVersion.version by 1"
      - from: INCONCLUSIVE
        to: COLLECTING
        trigger: "POST /challenger-evaluations/{evaluation_id}/extend"
        actor: ReliabilityEngineer | PlatformAdmin
        note: "Extension cycle. Re-reserving the samples can fail if the budget has been spent elsewhere in the meantime."
        preconditions:
          - "status == INCONCLUSIVE, else ERR_INVALID_STATE"
          - "extension_count < MAX_EVALUATION_EXTENSIONS, else ERR_MAX_EXTENSIONS_REACHED"
          - "reserved_samples <= challenger_version.evaluation_sample_budget, else ERR_SAMPLE_BUDGET_EXCEEDED"
          - "'DEPLOYMENT_DRAINED' NOT IN criteria_failures, else ERR_CHALLENGER_NOT_SERVING"
        side_effects:
          - "increments extension_count by 1, clears criteria_failures to [], clears promotion_score and metric_lines to null"
          - "sets evaluation_ends_at = evaluation_ends_at + EXTENSION_DAYS days"
          - "re-reserves reserved_samples per calculations.evaluation_sample_ledger"
          - "increments ChallengerEvaluation.version and ModelVersion.version by 1"

  - entity: RetrainingTrigger
    dimension: status
    shape: "branching fork on LINK_VERSION (ACKNOWLEDGED -> IN_PROGRESS or -> SATISFIED) plus a sweep-driven STALE exit"
    initial_state: PROPOSED
    terminal_states: [SATISFIED, DISMISSED, STALE]
    transitions:
      - from: PROPOSED
        to: ACKNOWLEDGED
        trigger: "POST /retraining-triggers/{retraining_trigger_id}/disposition with action=ACKNOWLEDGE"
        actor: MLEngineer | PlatformAdmin
        preconditions:
          - "status == PROPOSED, else ERR_INVALID_STATE"
        side_effects:
          - "sets acknowledged_by_user_id = X-User-ID"
          - "applies DriftReport BREACHED -> ACKNOWLEDGED on drift_report_id"
          - "recomputes Model.open_retraining_trigger_count"
          - "increments RetrainingTrigger.version, DriftReport.version and Model.version by 1"
      - from: PROPOSED
        to: DISMISSED
        trigger: "POST /retraining-triggers/{retraining_trigger_id}/disposition with action=DISMISS"
        actor: MLEngineer | PlatformAdmin
        preconditions:
          - "status == PROPOSED, else ERR_INVALID_STATE"
          - "retrain_required == false, else ERR_RETRAIN_REQUIRED"
          - "dismissed_reason supplied in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets dismissed_reason from the request body"
          - "recomputes Model.open_retraining_trigger_count"
          - "increments RetrainingTrigger.version and Model.version by 1"
      - from: ACKNOWLEDGED
        to: IN_PROGRESS
        trigger: "POST /retraining-triggers/{retraining_trigger_id}/disposition with action=LINK_VERSION where the linked version's approval_state != APPROVED"
        actor: MLEngineer | PlatformAdmin
        preconditions:
          - "status == ACKNOWLEDGED, else ERR_INVALID_STATE"
          - "retrained_version_id supplied and the referenced ModelVersion has model_id == this trigger's model_id, else ERR_RETRAINED_VERSION_LINEAGE_INVALID"
          - "the referenced ModelVersion's parent_version_id == the drift report's model_version_id, else ERR_RETRAINED_VERSION_LINEAGE_INVALID"
        side_effects:
          - "sets retrained_version_id"
          - "recomputes Model.open_retraining_trigger_count"
          - "increments RetrainingTrigger.version and Model.version by 1"
      - from: ACKNOWLEDGED
        to: SATISFIED
        trigger: "POST /retraining-triggers/{retraining_trigger_id}/disposition with action=LINK_VERSION where the linked version's approval_state == APPROVED"
        actor: MLEngineer | PlatformAdmin
        preconditions:
          - "status == ACKNOWLEDGED"
          - "same lineage preconditions as ACKNOWLEDGED -> IN_PROGRESS"
        side_effects:
          - "sets retrained_version_id"
          - "recomputes Model.open_retraining_trigger_count (this trigger leaves the open set)"
          - "increments RetrainingTrigger.version and Model.version by 1"
      - from: IN_PROGRESS
        to: SATISFIED
        trigger: "POST /retraining-triggers/{retraining_trigger_id}/disposition with action=LINK_VERSION re-issued once the linked version is APPROVED"
        actor: MLEngineer | PlatformAdmin
        preconditions:
          - "status == IN_PROGRESS"
          - "retrained_version_id in the body equals the already-linked retrained_version_id, else ERR_RETRAINED_VERSION_LINEAGE_INVALID"
          - "the referenced ModelVersion's approval_state == APPROVED, else ERR_INVALID_STATE"
        side_effects:
          - "recomputes Model.open_retraining_trigger_count"
          - "increments RetrainingTrigger.version and Model.version by 1"
      - from: ACKNOWLEDGED
        to: STALE
        trigger: "POST /_ops/revalidation-sweep"
        actor: PlatformAdmin
        preconditions:
          - "status IN {ACKNOWLEDGED, IN_PROGRESS}"
          - "clock_now > stale_after"
        side_effects:
          - "recomputes Model.open_retraining_trigger_count"
          - "increments RetrainingTrigger.version and Model.version by 1"
      - from: IN_PROGRESS
        to: STALE
        trigger: "POST /_ops/revalidation-sweep"
        actor: PlatformAdmin
        preconditions:
          - "status == IN_PROGRESS and clock_now > stale_after"
        side_effects:
          - "same as ACKNOWLEDGED -> STALE"

  - entity: PredictionIncident
    dimension: status
    shape: "cyclic (MONITORING -> MITIGATING recurrence loop) with a forced ESCALATED exit at the recurrence ceiling"
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: MITIGATING
        trigger: "POST /prediction-incidents/{incident_id}/actions with action=ENGAGE_FALLBACK"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "status == OPEN, else ERR_INVALID_STATE"
          - "CROSS-ENTITY: Deployment(deployment_id).fallback_strategy != NONE, else ERR_FALLBACK_NOT_CONFIGURED"
          - "CROSS-ENTITY: Deployment(deployment_id).rollout_state IN {RAMPING, HELD, LIVE}, else ERR_DEPLOYMENT_NOT_SERVING"
        side_effects:
          - "sets fallback_engaged = true and fallback_strategy_used = Deployment.fallback_strategy"
          - "increments PredictionIncident.version by 1"
      - from: OPEN
        to: MITIGATING
        trigger: "POST /prediction-incidents/{incident_id}/actions with action=MANUAL_OVERRIDE"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "status == OPEN, else ERR_INVALID_STATE"
          - "override_traffic_pct supplied, 0.00 <= override_traffic_pct <= Deployment.traffic_pct, else ERR_OVERRIDE_EXCEEDS_CURRENT_TRAFFIC"
          - "CROSS-ENTITY: Deployment(deployment_id).manual_override_active == false, else ERR_MANUAL_OVERRIDE_ACTIVE"
          - "CROSS-ENTITY: Deployment(deployment_id).rollout_state IN {RAMPING, HELD, LIVE}, else ERR_DEPLOYMENT_NOT_SERVING"
        side_effects:
          - "sets manual_override_traffic_pct = override_traffic_pct"
          - "sets Deployment.manual_override_active = true, Deployment.override_traffic_pct = override_traffic_pct and Deployment.traffic_pct = override_traffic_pct"
          - "appends a TrafficRampStep with reason = MANUAL_OVERRIDE, from_traffic_pct = the pre-call Deployment.traffic_pct, to_traffic_pct = override_traffic_pct, delta_pct = override_traffic_pct - pre-call traffic_pct"
          - "recomputes ServingEndpoint.allocated_traffic_pct per calculations.endpoint_traffic_ledger"
          - "increments PredictionIncident.version, Deployment.version and ServingEndpoint.version by 1"
      - from: MITIGATING
        to: MONITORING
        trigger: "POST /prediction-incidents/{incident_id}/actions with action=MONITOR"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "status == MITIGATING, else ERR_INVALID_STATE"
        side_effects:
          - "increments PredictionIncident.version by 1"
      - from: MONITORING
        to: MITIGATING
        trigger: "POST /prediction-incidents/{incident_id}/actions with action=RECUR while recurrence_count + 1 < MAX_RECURRENCES"
        actor: ReliabilityEngineer | PlatformAdmin
        note: "Recurrence loop."
        preconditions:
          - "status == MONITORING, else ERR_INVALID_STATE"
          - "recurrence_count + 1 < MAX_RECURRENCES"
        side_effects:
          - "increments recurrence_count by 1"
          - "increments PredictionIncident.version by 1"
      - from: MONITORING
        to: ESCALATED
        trigger: "POST /prediction-incidents/{incident_id}/actions with action=RECUR while recurrence_count + 1 >= MAX_RECURRENCES"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "status == MONITORING"
          - "recurrence_count + 1 >= MAX_RECURRENCES"
        side_effects:
          - "increments recurrence_count by 1 and raises severity to SEV1"
          - "increments PredictionIncident.version by 1"
      - from: MONITORING
        to: RESOLVED
        trigger: "POST /prediction-incidents/{incident_id}/actions with action=RESOLVE"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "status IN {MONITORING, ESCALATED}, else ERR_INVALID_STATE"
        side_effects:
          - "sets resolved_at = clock_now"
          - "COMPENSATION when manual_override_traffic_pct is non-null: sets Deployment.manual_override_active = false, Deployment.override_traffic_pct = null, and restores Deployment.traffic_pct to the from_traffic_pct of the most recent TrafficRampStep for this deployment with reason == MANUAL_OVERRIDE ordered by created_at DESC; appends a TrafficRampStep with reason = OVERRIDE_RELEASE and delta_pct = restored_traffic_pct - override_traffic_pct, so cumulative_ramp_delta_pct returns to its pre-override value"
          - "recomputes ServingEndpoint.allocated_traffic_pct per calculations.endpoint_traffic_ledger"
          - "when Deployment.health_state == CRITICAL and no other PredictionIncident on the deployment has status IN {OPEN, MITIGATING, MONITORING, ESCALATED}: applies the Deployment health transition CRITICAL -> DEGRADED"
          - "increments PredictionIncident.version, Deployment.version and ServingEndpoint.version by 1"
      - from: ESCALATED
        to: RESOLVED
        trigger: "POST /prediction-incidents/{incident_id}/actions with action=RESOLVE"
        actor: ReliabilityEngineer | PlatformAdmin
        preconditions:
          - "status == ESCALATED"
        side_effects:
          - "same as MONITORING -> RESOLVED"

  - entity: RevalidationTask
    dimension: status
    shape: "branching (IN_REVIEW -> PASSED or -> FAILED) with a four-hop cascade on the FAILED branch"
    initial_state: DUE
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: DUE
        to: IN_REVIEW
        trigger: "POST /revalidation-tasks/{revalidation_task_id}/disposition with action=START_REVIEW"
        actor: ModelApprover | PlatformAdmin
        preconditions:
          - "status == DUE, else ERR_INVALID_STATE"
        side_effects:
          - "sets reviewer_user_id = X-User-ID"
          - "increments RevalidationTask.version by 1"
      - from: IN_REVIEW
        to: PASSED
        trigger: "POST /revalidation-tasks/{revalidation_task_id}/disposition with action=PASS"
        actor: ModelApprover | PlatformAdmin
        preconditions:
          - "status == IN_REVIEW, else ERR_INVALID_STATE"
          - "X-User-ID == reviewer_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "findings supplied in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets decided_at = clock_now and findings from the request body"
          - "recomputes ModelVersion.revalidation_due_at per the REVALIDATION_PASS variant of calculations.revalidation_schedule (clock_now + Model.revalidation_interval_days days)"
          - "increments RevalidationTask.version and ModelVersion.version by 1"
      - from: IN_REVIEW
        to: FAILED
        trigger: "POST /revalidation-tasks/{revalidation_task_id}/disposition with action=FAIL"
        actor: ModelApprover | PlatformAdmin
        preconditions:
          - "status == IN_REVIEW, else ERR_INVALID_STATE"
          - "X-User-ID == reviewer_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "findings supplied in the request body, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets decided_at = clock_now and findings from the request body"
          - "CASCADE HOP 1 -> HOP 2: because this task became FAILED, ModelVersion(model_version_id) whose approval_state == APPROVED applies APPROVED -> BLOCKED with blocked_reason = 'REVALIDATION_FAILED' and revalidation_due_at cleared to null"
          - "CASCADE HOP 2 -> HOP 3: because that version entered BLOCKED, every Deployment referencing it whose rollout_state IN {RAMPING, HELD, LIVE} applies the DRAINING transition with its DRAIN_RELEASE traffic release and endpoint-ledger recompute, in created_at ASC order"
          - "CASCADE HOP 3 -> HOP 4: because those deployments left the serving set, every ChallengerEvaluation on them whose status == COLLECTING applies COLLECTING -> INCONCLUSIVE with 'DEPLOYMENT_DRAINED' and the reserved-sample return"
          - "increments the version of every entity mutated by hops 2 through 4"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: deployment-create-stale-serving-endpoint
    parent_entity: ServingEndpoint
    write_endpoint: "POST /deployments"
    occ_field: "expected_serving_endpoint_version"
    description: |
      Creating a Deployment against a ServingEndpoint whose version has
      advanced since the client last read it is rejected. This captures the
      case where the endpoint's allocated_traffic_pct, operational_state or
      cooldown geometry has already moved on: a second Deployment on the same
      endpoint is legitimate product behaviour whenever headroom remains, so
      the write cannot be resolved by a state precondition — the caller's view
      of the endpoint's capacity ledger is simply stale.
    error_id: ERR_STALE_SERVING_ENDPOINT_VERSION
    http_status: 412

  - rule_id: challenger-eval-create-stale-model
    parent_entity: Model
    write_endpoint: "POST /models/{model_id}/challenger-evaluations"
    occ_field: "expected_model_version"
    description: |
      Creating a ChallengerEvaluation against a Model whose version has
      advanced since the client last read it is rejected. A newly created
      evaluation legitimately supersedes the caller's understanding of which
      version is champion, so a second create against the same model would
      itself succeed under the natural product semantics; the rejection is
      purely a stale-version check on the parent registry entry whose
      champion_version_id and open_retraining_trigger_count the caller read.
    error_id: ERR_STALE_MODEL_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: traffic_ramp_step_plan
    trigger: "every POST /deployments/{deployment_id}/ramp, before the PENDING->RAMPING / RAMPING->RAMPING / RAMPING->LIVE transition is applied"
    algorithm: threshold
    combinatorial_mode: "(a) formula with 5 inputs and non-linear interaction: nested min/max, a conditional branch on health_state, a conditional branch on pattern, and tiered checkpoint selection"
    input_set: "the single Deployment being ramped plus its ServingEndpoint; no other deployments are read directly — their contribution arrives through ServingEndpoint.allocated_traffic_pct, which counts only deployments in rollout_state IN {RAMPING, HELD, LIVE, DRAINING}"
    constants:
      RAMP_CHECKPOINTS_REALTIME: [5, 15, 35, 65, 100]
      RAMP_CHECKPOINTS_SHADOW: [10, 50, 100]
      RAMP_CHECKPOINTS_BATCH: [50, 100]
      MAX_STEP_DELTA_PCT: 30
      DEGRADED_STEP_MULTIPLIER: 0.5
      ENDPOINT_HEADROOM_RESERVE_PCT: 5
    precision: "all percentages carried at 2 decimal places, round_half_up; the DEGRADED halving uses truncation toward zero at 2 decimals (floor_2), never round_half_up, so 5% halved is exactly 2.50 and 4.99% halved is exactly 2.49"
    formula: |
      checkpoints        = RAMP_CHECKPOINTS_<deployment.pattern>
      # (1) tiered checkpoint selection
      if deployment.ramp_step_index >= len(checkpoints):
          reject ERR_RAMP_ALREADY_COMPLETE
      nominal_target = checkpoints[deployment.ramp_step_index]
      raw_delta      = nominal_target - deployment.traffic_pct

      # (2) conditional branch on the parallel health dimension
      if deployment.health_state == "DEGRADED":
          capped_delta = floor_2(raw_delta * DEGRADED_STEP_MULTIPLIER)
      else:
          capped_delta = raw_delta            # CRITICAL never reaches here (blocked earlier)

      # (3) per-step ceiling
      step_delta = min(capped_delta, MAX_STEP_DELTA_PCT)

      # (4) conditional branch on pattern AND on being on the last checkpoint
      if deployment.pattern == "REALTIME" and nominal_target < checkpoints[-1]:
          reserve = ENDPOINT_HEADROOM_RESERVE_PCT
      else:
          reserve = 0

      # (5) nested max/min against the endpoint ledger
      available_headroom = serving_endpoint.max_traffic_pct - reserve
                           - serving_endpoint.allocated_traffic_pct
      granted_delta_pct  = max(0, min(step_delta, available_headroom))
      if granted_delta_pct == 0:
          reject ERR_ENDPOINT_CAPACITY_EXHAUSTED

      new_traffic_pct = round_half_up(deployment.traffic_pct + granted_delta_pct, 2)
      # (6) the index advances ONLY on an exact landing
      advance_index   = (new_traffic_pct == nominal_target)
    worked_example: |
      REALTIME on an endpoint with max_traffic_pct 100.00, no other deployments:
        ramp 1: idx 0 nominal 5   raw 5   step 5   reserve 5 headroom 95 -> traffic 5.00,  idx 1
        ramp 2: idx 1 nominal 15  raw 10  step 10  reserve 5 headroom 90 -> traffic 15.00, idx 2
        ramp 3: idx 2 nominal 35  raw 20  step 20  reserve 5 headroom 80 -> traffic 35.00, idx 3
        ramp 4: idx 3 nominal 65  raw 30  step 30  reserve 5 headroom 60 -> traffic 65.00, idx 4
        ramp 5: idx 4 nominal 100 raw 35  step 30  reserve 0 headroom 35 -> traffic 95.00, idx 4 (no advance)
        ramp 6: idx 4 nominal 100 raw 5   step 5   reserve 0 headroom 5  -> traffic 100.00, idx 5 -> LIVE
      Same deployment at traffic 15.00 / idx 2 but health_state DEGRADED:
        nominal 35, raw 20, capped floor_2(10.0)=10.00, step 10, reserve 5,
        headroom 100-5-15=80 -> traffic 25.00, idx stays 2.

  - name: composite_health_score
    trigger: "on POST /monitoring-windows (PROVISIONAL), on POST /monitoring-windows/{window_id}/close (FINAL), and on GET /deployments/{deployment_id}/health (either, per score_variant)"
    algorithm: weighted_scoring
    input_set: "exactly one MonitoringWindow plus the ModelVersion named by its model_version_id; the ModelVersion supplies baseline_accuracy, baseline_positive_rate and baseline_p95_latency_ms"
    constants:
      W_ACCURACY_PROXY: 0.45
      W_PREDICTION_DIST: 0.30
      W_LATENCY: 0.25
      DIST_TOLERANCE_BAND: 0.20
      UNLABELED_IMPUTE_RATE: 0.60
      HEALTH_RECOVERY_MIN_SCORE: 80.00
    precision: "components are carried in full float precision; the weighted sum is multiplied by 100 and rounded ONCE at the end to 2 decimals, round_half_up. Rounding each component first is NOT the pinned order."
    formula: |
      dist_component    = max(0, 1 - abs(w.positive_rate - mv.baseline_positive_rate)
                                      / DIST_TOLERANCE_BAND)
      latency_component = max(0, min(1, mv.baseline_p95_latency_ms / w.p95_latency_ms))
      accuracy_proxy    = <variant-specific, see variants below>
      health_score      = round_half_up(100 * ( W_ACCURACY_PROXY  * accuracy_proxy
                                              + W_PREDICTION_DIST * dist_component
                                              + W_LATENCY         * latency_component ), 2)
      baseline_delta_pct = round_half_up(health_score - 100 * mv.baseline_accuracy, 2)
    variants:
      - name: PROVISIONAL
        when: "MonitoringWindow.status == OPEN, and on GET /deployments/{deployment_id}/health with score_variant omitted or PROVISIONAL"
        difference: "accuracy_proxy = correct_labeled_count / labeled_prediction_count — the labelled subset is the whole denominator; unlabelled predictions are invisible. When labeled_prediction_count == 0 the accuracy_proxy is defined as 0.0 (no divide-by-zero) and the window's health_score is still written."
      - name: FINAL
        when: "MonitoringWindow.status == CLOSED, and on GET /deployments/{deployment_id}/health with score_variant=FINAL"
        difference: "accuracy_proxy = (correct_labeled_count + UNLABELED_IMPUTE_RATE * (prediction_count - labeled_prediction_count)) / prediction_count — every served prediction is in the denominator and the unlabelled remainder is imputed at UNLABELED_IMPUTE_RATE. When prediction_count == 0 the accuracy_proxy is defined as 0.0."
    divergence_example: |
      prediction_count 10000, labeled_prediction_count 2000, correct_labeled_count 1700,
      positive_rate 0.32, baseline_positive_rate 0.30, p95_latency_ms 240,
      baseline_p95_latency_ms 200:
        dist_component    = 1 - 0.02/0.20            = 0.9
        latency_component = min(1, 200/240)          = 0.8333333...
        PROVISIONAL accuracy_proxy = 1700/2000       = 0.85  -> health_score 86.08
        FINAL       accuracy_proxy = (1700+0.60*8000)/10000 = 0.65 -> health_score 77.08

  - name: drift_index
    trigger: "on POST /drift-reports, before the COMPUTED -> BREACHED branch is decided"
    algorithm: chronological
    input_set: "the CLOSED MonitoringWindow named by monitoring_window_id supplies observed_bin_proportions. The expected distribution comes from the variant: either TrainingDataset.baseline_bin_proportions of the version's training_dataset_id, or the element-wise mean of observed_bin_proportions over the ROLLING_WINDOW_COUNT most recent eligible prior windows."
    constants:
      BIN_COUNT: 5
      PSI_EPSILON: 0.0001
      DRIFT_WARN_THRESHOLD: 0.10
      DRIFT_CRITICAL_THRESHOLD: 0.25
      ROLLING_WINDOW_COUNT: 3
    precision: "expected_bin_proportions are each rounded to 4 decimals (round_half_up) BEFORE the PSI sum; the PSI sum itself is carried in full precision and rounded once to 4 decimals at the end"
    formula: |
      expected = <variant-specific, rounded element-wise to 4 dp>
      psi = sum over b in 0..BIN_COUNT-1 of
              (observed[b] - expected[b])
              * ln( max(observed[b], PSI_EPSILON) / max(expected[b], PSI_EPSILON) )
      drift_index = round_half_up(psi, 4)

      severity = "CRITICAL" if drift_index >= DRIFT_CRITICAL_THRESHOLD
                 else "WARN" if drift_index >= DRIFT_WARN_THRESHOLD
                 else "NONE"
      # NOTE both comparisons are >=, not >
    variants:
      - name: TRAINING_BASELINE
        when: "baseline_mode == TRAINING_BASELINE, or baseline_mode == ROLLING_BASELINE with zero eligible prior windows (the empty-pool fallback)"
        difference: "expected = TrainingDataset(model_version.training_dataset_id).baseline_bin_proportions. Sets baseline_dataset_id to that dataset, effective_baseline_mode = TRAINING_BASELINE and windows_used_count = 0."
      - name: ROLLING_BASELINE
        when: "baseline_mode == ROLLING_BASELINE and at least one eligible prior window exists"
        difference: "Eligibility filter: MonitoringWindow rows with the same deployment_id as the report's window, window_kind == DISTRIBUTION, status == CLOSED, and id != monitoring_window_id. Ranking: window_end DESC, then created_at DESC. Take the first min(3, available) rows; expected[b] = round_half_up(mean of their observed_bin_proportions[b], 4). Sets baseline_dataset_id = null, effective_baseline_mode = ROLLING_BASELINE and windows_used_count = the number of rows actually averaged."
    divergence_example: |
      observed = [0.10, 0.15, 0.20, 0.25, 0.30]
      TRAINING_BASELINE expected [0.20,0.20,0.20,0.20,0.20] -> drift_index 0.1354 (WARN)
      ROLLING_BASELINE over the three prior CLOSED DISTRIBUTION windows
        [0.12,0.16,0.20,0.24,0.28], [0.14,0.16,0.20,0.24,0.26], [0.10,0.18,0.20,0.26,0.26]
        -> expected [0.1200,0.1667,0.2000,0.2467,0.2667] -> drift_index 0.0094 (NONE)
      Identical observed data, one WARN report and one NONE report.

  - name: challenger_promotion_score
    trigger: "on POST /challenger-evaluations/{evaluation_id}/conclude, before the COLLECTING fork is resolved"
    algorithm: weighted_scoring
    combinatorial_mode: "(b) nested rounding where the order matters — per-line rounding then sum is pinned; sum-then-round is explicitly the wrong answer"
    input_set: "the ChallengerEvaluation's champion_metrics and challenger_metrics maps only; no aggregation over other rows"
    constants:
      METRIC_WEIGHT_ACCURACY_PROXY: 0.50
      METRIC_WEIGHT_CALIBRATION: 0.20
      METRIC_WEIGHT_LATENCY: 0.15
      METRIC_WEIGHT_COST: 0.15
      LOWER_IS_BETTER_METRICS: [LATENCY, COST]
      PROMOTION_MIN_SCORE: 0.0300
      MIN_LABELED_PREDICTIONS: 1000
      LATENCY_REGRESSION_TOLERANCE_MS: 25
      MAX_EVALUATION_EXTENSIONS: 2
      EXTENSION_DAYS: 7
    precision: "PINNED ROUNDING ORDER — round each of the four weighted lines to 4 decimals (round_half_up) FIRST, then sum the four rounded lines, then round the sum to 4 decimals. Summing in full precision and rounding once produces a different 4th decimal and is NOT the pinned order. Negative zero is normalised to 0.0000."
    formula: |
      METRIC_ORDER = [ACCURACY_PROXY, CALIBRATION, LATENCY, COST]   # fixed evaluation order
      for m in METRIC_ORDER:
          denom = max(abs(champion_metrics[m]), 0.0001)
          nd    = (challenger_metrics[m] - champion_metrics[m]) / denom
          if m in LOWER_IS_BETTER_METRICS: nd = -nd
          metric_lines[m] = round_half_up(METRIC_WEIGHT_<m> * nd, 4)
      promotion_score = round_half_up( metric_lines[ACCURACY_PROXY]
                                     + metric_lines[CALIBRATION]
                                     + metric_lines[LATENCY]
                                     + metric_lines[COST], 4 )

      # promotion criteria — every key that fails is appended, then the list is
      # sorted lexicographic ASCII ascending
      criteria_failures = []
      if promotion_score < PROMOTION_MIN_SCORE:                       add "SCORE_BELOW_MIN"
      if labeled_prediction_count < MIN_LABELED_PREDICTIONS:          add "INSUFFICIENT_LABELS"
      if challenger_metrics[LATENCY] > champion_metrics[LATENCY]
                                      + LATENCY_REGRESSION_TOLERANCE_MS: add "LATENCY_REGRESSION"
      if Deployment(challenger_deployment_id).health_state != "HEALTHY":  add "CHALLENGER_UNHEALTHY"
      if the latest SkewCheck for (challenger_version_id, challenger_deployment_id)
         ordered by checked_at DESC then created_at DESC exists and its status
         IN {FAIL_SKEW, FAIL_MISSING_FEATURE}:                        add "SKEW_CHECK_FAILED"
      if any PredictionIncident with deployment_id == challenger_deployment_id
         has status IN {OPEN, MITIGATING, ESCALATED}:                  add "OPEN_INCIDENT"

      decision = "PROMOTED"     if criteria_failures == []
                 "INCONCLUSIVE" if criteria_failures == ["INSUFFICIENT_LABELS"]
                 "REJECTED"     otherwise
    worked_example: |
      champion  { ACCURACY_PROXY 0.8200, CALIBRATION 0.9100, LATENCY 180.0, COST 0.00420 }
      challenger{ ACCURACY_PROXY 0.8570, CALIBRATION 0.9230, LATENCY 171.0, COST 0.00390 }
        lines = { ACCURACY_PROXY 0.0226, CALIBRATION 0.0029, LATENCY 0.0075, COST 0.0107 }
        PINNED  per-line-then-sum  -> promotion_score 0.0437
        WRONG   sum-then-round     -> 0.0436
      Threshold-boundary case:
      champion  { ACCURACY_PROXY 0.8000, CALIBRATION 0.9000, LATENCY 200.0, COST 0.00500 }
      challenger{ ACCURACY_PROXY 0.8400, CALIBRATION 0.9090, LATENCY 198.0, COST 0.00495 }
        lines = { ACCURACY_PROXY 0.0250, CALIBRATION 0.0020, LATENCY 0.0015, COST 0.0015 }
        promotion_score 0.0300 == PROMOTION_MIN_SCORE -> SCORE_BELOW_MIN does NOT fire (>=)

  - name: retraining_urgency
    trigger: "on creation of a RetrainingTrigger — cascade hop 2 of POST /drift-reports when severity is WARN or CRITICAL, or POST /skew-checks when the resulting status is FAIL_SKEW or FAIL_MISSING_FEATURE. The urgency fields are written once at raise time and are never recomputed afterwards, so they are a frozen snapshot of the evidence that raised the trigger."
    algorithm: threshold
    combinatorial_mode: "(c) a self-referential-looking dependency that is resolved by pinning the evaluation order: the escalation tier is chosen from base_urgency and is NEVER re-chosen from the total it produces"
    input_set: "the source DriftReport (if drift_report_id is set), the source SkewCheck (if skew_check_id is set), and the EVIDENCE VERSION — the ModelVersion named by DriftReport.model_version_id when drift_report_id is set, otherwise SkewCheck.model_version_id. Model.champion_version_id is deliberately NOT read, so the snapshot is well defined even before any champion has been promoted. days_since_approval is measured against the logical clock."
    constants:
      DRIFT_URGENCY_MULTIPLIER: 120
      SKEW_URGENCY_MULTIPLIER: 80
      STALENESS_URGENCY_PER_DAY: 0.5
      ESCALATION_TIERS: [[0, 0], [20, 10], [45, 25], [70, 40]]
      URGENCY_CEILING: 100
      RETRAIN_REQUIRED_THRESHOLD: 45
      STALE_AFTER_DAYS: 90
    precision: "base_urgency rounded to 2 decimals round_half_up; the escalation multiplier is applied to that rounded base and the product is rounded once to 2 decimals; the ceiling is applied last"
    formula: |
      drift_component     = DRIFT_URGENCY_MULTIPLIER * (drift_report.drift_index if drift_report_id else 0)
      skew_component      = SKEW_URGENCY_MULTIPLIER  * max(0, (skew_check.max_skew_ratio - 1.0)
                                                              if skew_check_id else 0)
      days_since_approval = whole days from evidence_version.approved_at to clock_now (floor);
                            0 when evidence_version.approved_at is null
      staleness_component = STALENESS_URGENCY_PER_DAY * days_since_approval

      base_urgency = round_half_up(drift_component + skew_component + staleness_component, 2)

      # PINNED ORDER: the tier is selected from base_urgency ONLY.
      escalation_pct = the `bonus` of the LAST pair [floor, bonus] in ESCALATION_TIERS
                       whose floor <= base_urgency
      total_urgency  = min(URGENCY_CEILING,
                           round_half_up(base_urgency * (1 + escalation_pct / 100), 2))
      # Re-selecting the tier against total_urgency is the wrong answer.

      urgency_band = "CRITICAL" if total_urgency >= 75
                     else "HIGH"   if total_urgency >= 50
                     else "MEDIUM" if total_urgency >= 25
                     else "LOW"
      retrain_required = (total_urgency >= RETRAIN_REQUIRED_THRESHOLD)
      escalation_tier_bonus_pct = escalation_pct
      stale_after = clock_now + STALE_AFTER_DAYS days      # raise instant plus the stale window
    worked_example: |
      drift_index 0.1354, max_skew_ratio 1.15, days_since_approval 56:
        components 16.248 + 12.0 + 28.0 -> base_urgency 56.25
        tier floor 45 -> escalation_pct 25 -> total_urgency 70.31, band HIGH, retrain_required true
        WRONG ORDER: 70.31 >= 70 would pick 40 -> 78.75 (band CRITICAL). Not the pinned answer.
      drift_index 0.5055, max_skew_ratio 1.354, days_since_approval 20:
        components 60.66 + 28.32 + 10.0 -> base_urgency 98.98
        tier floor 70 -> escalation_pct 40 -> 138.57 clamped to total_urgency 100.00
      drift_index 0.09, max_skew_ratio 1.05, days_since_approval 10:
        components 10.8 + 4.0 + 5.0 -> base_urgency 19.80
        tier floor 0 -> escalation_pct 0 -> total_urgency 19.80, band LOW, retrain_required false

  - name: feature_skew_ratio
    trigger: "on POST /skew-checks"
    algorithm: threshold
    input_set: "only the training_feature_stats map and the serving_feature_stats map submitted in the request; the authoritative feature name list is the KEY SET of training_feature_stats (the training snapshot defines which features the artifact expects). Extra keys present only in serving_feature_stats are ignored."
    constants:
      SKEW_WARN_THRESHOLD: 1.10
      SKEW_BLOCK_THRESHOLD: 1.25
      SKEW_RATIO_FLOOR: 0.0001
    precision: "each per-feature ratio is rounded to 4 decimals round_half_up before comparison; max_skew_ratio is the maximum of those rounded per-feature ratios"
    formula: |
      missing = [ f for f in training_feature_stats.keys()
                  if f not in serving_feature_stats ]
      for f in training_feature_stats.keys() if f not in missing:
          a = max(abs(training_feature_stats[f]["mean"]), SKEW_RATIO_FLOOR)
          b = max(abs(serving_feature_stats[f]["mean"]),  SKEW_RATIO_FLOOR)
          ratio[f] = round_half_up(max(a, b) / min(a, b), 4)      # symmetric, always >= 1.0

      max_skew_ratio  = max(ratio.values()) if ratio else 1.0000
      # tie-break is the lexicographically smallest feature_name, NEVER the id or insertion order
      max_skew_feature = min([f for f in ratio if ratio[f] == max_skew_ratio])

      # single ordered ladder — the first matching row wins
      status = "FAIL_MISSING_FEATURE" if missing != []
               else "FAIL_SKEW" if max_skew_ratio >= SKEW_BLOCK_THRESHOLD
               else "WARN"      if max_skew_ratio >= SKEW_WARN_THRESHOLD
               else "PASS"
      missing_features = sorted(missing)
    worked_example: |
      training_feature_stats keys ["amount", "tenure_days", "zscore"]
        training means { amount 0.8000, tenure_days 30.0000, zscore 1.0000 }
        serving  means { amount 1.0000, tenure_days 31.5000, zscore 1.0000 }
        ratios { amount 1.2500, tenure_days 1.0500, zscore 1.0000 }
        max_skew_ratio 1.2500 == SKEW_BLOCK_THRESHOLD -> status FAIL_SKEW (>=, not >),
        max_skew_feature "amount"
      Same stats but serving amount 0.8800 -> ratios { amount 1.1000, ... }
        max_skew_ratio 1.1000 == SKEW_WARN_THRESHOLD -> status WARN
      Same stats but serving omits "zscore"
        -> status FAIL_MISSING_FEATURE, missing_features ["zscore"], and the ladder
           short-circuits so amount's 1.2500 does NOT make it FAIL_SKEW

  - name: endpoint_traffic_ledger
    trigger: "recomputed on ServingEndpoint after every write that changes any of its deployments' traffic_pct or rollout_state: POST /deployments, POST /deployments/{deployment_id}/ramp, POST /deployments/{deployment_id}/rollout-action, POST /prediction-incidents/{incident_id}/actions with action=ENGAGE_FALLBACK or action=MANUAL_OVERRIDE, and cascade hop 3 of POST /training-datasets/{dataset_id}/revoke"
    algorithm: aggregation
    input_set: "Deployment rows with serving_endpoint_id == this endpoint AND rollout_state IN {RAMPING, HELD, LIVE, DRAINING}. Deployments in PENDING, ROLLED_BACK or RETIRED contribute nothing — a RETIRED deployment that once held 65.00% releases all of it."
    constants:
      TRAFFIC_LEDGER_PRECISION: 2
    precision: "2 decimals, round_half_up, recomputed from the contributing rows on every write — never incrementally patched, so no drift can accumulate"
    formula: |
      allocated_traffic_pct = round_half_up(
          sum(d.traffic_pct for d in contributing_deployments), 2)
      # per-deployment compensation ledger
      cumulative_ramp_delta_pct = round_half_up(
          sum(step.delta_pct for step in TrafficRampStep where deployment_id == d.id), 2)
    invariant: |
      COMPENSATING INVARIANT — for any deployment d, after POST /deployments/{d}/rollout-action
      with action=ROLLBACK:
        d.traffic_pct == 0.00
        d.cumulative_ramp_delta_pct == 0.00
        serving_endpoint.allocated_traffic_pct == its value immediately before d's FIRST ramp
      ROLLBACK writes one TrafficRampStep with reason=ROLLBACK_RELEASE and
      delta_pct == -(the traffic_pct held at rollback time), so the sum of all of d's
      step deltas telescopes to exactly zero. The same telescoping holds for the DRAIN_RELEASE
      step written by cascade hop 3 and by RETIRE.
    worked_example: |
      Endpoint max_traffic_pct 100.00. Deployment A ramps 0 -> 5.00 -> 15.00 -> 35.00
      (steps +5.00, +10.00, +20.00; allocated 35.00, cumulative_ramp_delta_pct 35.00).
      Deployment B is then created and ramps to 5.00 (allocated 40.00).
      ROLLBACK A: step -35.00 -> A.traffic_pct 0.00, A.cumulative_ramp_delta_pct 0.00,
      allocated_traffic_pct 5.00 == the value before A's first ramp (0.00) plus B's 5.00.

  - name: evaluation_sample_ledger
    trigger: "recomputed on ModelVersion after POST /models/{model_id}/challenger-evaluations, POST /challenger-evaluations/{evaluation_id}/start, POST /challenger-evaluations/{evaluation_id}/extend and POST /challenger-evaluations/{evaluation_id}/conclude"
    algorithm: aggregation
    input_set: "ChallengerEvaluation rows with challenger_version_id == this version AND status IN {SCHEDULED, COLLECTING, PROMOTED}. REJECTED and INCONCLUSIVE evaluations release their reservation in full."
    constants:
      SAMPLE_LEDGER_PRECISION: 0
      EXTENSION_SAMPLE_INCREMENT: 500
    precision: "integer sample counts only; no rounding"
    formula: |
      reserved_total = sum(e.reserved_samples for e in holding_evaluations)
      evaluation_sample_budget = model_version.evaluation_sample_quota - reserved_total
      # POST /models/{model_id}/challenger-evaluations rejects when
      #   requested reserved_samples > evaluation_sample_budget  -> ERR_SAMPLE_BUDGET_EXCEEDED
      # POST /challenger-evaluations/{id}/extend adds EXTENSION_SAMPLE_INCREMENT to
      #   reserved_samples and is subject to the same check.
    invariant: |
      COMPENSATING INVARIANT — for a version with evaluation_sample_quota Q:
        after any sequence of evaluation creations, extensions and conclusions,
        evaluation_sample_budget == Q - sum(reserved_samples of SCHEDULED/COLLECTING/PROMOTED rows)
      Concluding an evaluation to REJECTED or INCONCLUSIVE returns exactly the samples it held —
      not a recomputed estimate — so budget returns to its pre-creation value when every
      evaluation on the version ends non-PROMOTED.
    worked_example: |
      evaluation_sample_quota 5000. E1 created with reserved_samples 3000 -> budget 2000.
      A second evaluation requesting 2500 is rejected ERR_SAMPLE_BUDGET_EXCEEDED (2500 > 2000).
      E1 concludes REJECTED -> budget 5000; the 2500 request now succeeds -> budget 2500.

  - name: revalidation_schedule
    trigger: "on ModelVersion PENDING_REVIEW -> APPROVED, on POST /revalidation-tasks/{revalidation_task_id}/disposition with action=PASS, and on POST /_ops/revalidation-sweep"
    algorithm: forward_looking
    input_set: "the ModelVersion being approved/revalidated plus Model.revalidation_interval_days; the sweep reads every APPROVED ModelVersion whose revalidation_due_at is not null"
    constants:
      DEFAULT_REVALIDATION_INTERVAL_DAYS: 90
      SWEEP_PAGE_LIMIT: 100
    precision: "whole days added to a UTC instant; the time-of-day component of the anchor is preserved exactly"
    formula: |
      # anchor differs by trigger
      APPROVAL:            revalidation_due_at = approved_at + interval_days
      REVALIDATION_PASS:   revalidation_due_at = clock_now  + interval_days
      # sweep
      due_versions = APPROVED ModelVersions with revalidation_due_at is not null
                     AND revalidation_due_at <= clock_now
                     AND no RevalidationTask for that version in status IN {DUE, IN_REVIEW}
      order: revalidation_due_at ASC, then created_at ASC     # never by id
      for each: create RevalidationTask(status=DUE, due_at=version.revalidation_due_at,
                                        swept_at=clock_now)
      returns { created_count, skipped_existing_count, evaluated_count }
    variants:
      - name: APPROVAL_ANCHOR
        when: "the schedule is being set by the PENDING_REVIEW -> APPROVED transition"
        difference: "anchored to approved_at, i.e. the moment approval happened"
      - name: PASS_ANCHOR
        when: "the schedule is being set by a RevalidationTask PASS disposition"
        difference: "anchored to clock_now at disposition time, NOT to the task's due_at and NOT to the original approved_at — a late revalidation therefore pushes the next due date out by the full interval rather than staying on the original cadence"
    worked_example: |
      Model.revalidation_interval_days 90, approved_at 2026-08-01T00:00:00Z
        -> revalidation_due_at 2026-10-30T00:00:00Z
      Clock set to 2026-11-01T00:00:00Z, sweep -> RevalidationTask DUE with
      due_at 2026-10-30T00:00:00Z and swept_at 2026-11-01T00:00:00Z;
      a second sweep at the same clock returns
      created_count 0, skipped_existing_count 1.
      START_REVIEW then PASS at clock 2026-11-05T00:00:00Z
        -> revalidation_due_at 2027-02-03T00:00:00Z (PASS_ANCHOR), not 2027-01-28T00:00:00Z.

  - name: documentation_and_reproducibility_score
    trigger: "on PATCH /model-versions/{version_id}/documentation and re-evaluated as a gate on POST /model-versions/{version_id}/submit-for-review and on the PENDING_REVIEW -> APPROVED decision"
    algorithm: weighted_scoring
    input_set: "only the ModelVersion's own doc_sections array and repro_artifacts array"
    constants:
      REQUIRED_DOC_SECTIONS: [INTENDED_USE, TRAINING_DATA, EVALUATION, LIMITATIONS, ETHICAL_REVIEW]
      REQUIRED_REPRO_ARTIFACTS: [TRAINING_CODE_COMMIT, ENV_LOCKFILE_DIGEST, RANDOM_SEED, FEATURE_SPEC_HASH]
      DOC_COMPLETENESS_MIN_PCT: 80.00
      REPRO_COMPLETENESS_MIN_PCT: 100.00
    precision: "percentages to 2 decimals, round_half_up; a required key counts as present only when it appears at least once in the array; duplicate occurrences of the same key count once; array members outside the REQUIRED_* lists are ignored entirely and never raise the score"
    formula: |
      doc_present   = count of k in REQUIRED_DOC_SECTIONS    with k in set(doc_sections)
      repro_present = count of k in REQUIRED_REPRO_ARTIFACTS with k in set(repro_artifacts)
      doc_completeness_pct  = round_half_up(100 * doc_present   / 5, 2)
      reproducibility_score = round_half_up(100 * repro_present / 4, 2)
      documentation_gate_satisfied =
          doc_completeness_pct  >= DOC_COMPLETENESS_MIN_PCT
          AND reproducibility_score >= REPRO_COMPLETENESS_MIN_PCT
      # ERR_DOCUMENTATION_INCOMPLETE is raised when the gate is not satisfied
    worked_example: |
      4 of 5 sections and 4 of 4 artifacts -> 80.00 / 100.00 -> gate SATISFIED
        (80.00 >= 80.00 exactly; the boundary passes)
      3 of 5 sections and 4 of 4 artifacts -> 60.00 / 100.00 -> ERR_DOCUMENTATION_INCOMPLETE
      5 of 5 sections and 3 of 4 artifacts -> 100.00 / 75.00  -> ERR_DOCUMENTATION_INCOMPLETE
        (repro must be exactly 100.00; there is no partial credit)

  - name: dataset_dependency_counter
    trigger: "recomputed on TrainingDataset after POST /model-versions and after any ModelVersion approval_state transition"
    algorithm: aggregation
    input_set: "ModelVersion rows with training_dataset_id == this dataset AND approval_state != REJECTED; a REJECTED version stops being a dependency, and a BLOCKED one keeps counting because it can still return to APPROVED"
    constants:
      COUNTER_PRECISION: 0
    precision: "integers, recomputed from the contributing rows on every write"
    formula: |
      dependent_version_count = count(ModelVersion where training_dataset_id == dataset.id
                                      AND approval_state != "REJECTED")
      # POST /training-datasets/{dataset_id}/revoke is permitted regardless of this count —
      # it exists so the revoke cascade's blast radius is observable before and after.
    worked_example: |
      Dataset with three versions — one APPROVED and serving at 35.00%, one DRAFT, one REJECTED:
      dependent_version_count 2. After cascade hop 2 of revoke moves the APPROVED version to
      BLOCKED, dependent_version_count is still 2 (BLOCKED remains a dependency).

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority — LOWEST number wins)
#
# Every request walks this ladder top-down and returns the FIRST violated row.
# Domain ordering rationale: an ML serving platform is a safety-before-money
# surface — a model that predicts badly is worse than a model that is expensive —
# so business_safety (30s) precedes business_referential (40s), which precedes
# business_constraint (50s), business_temporal (60s) and business_fiscal (70s).
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header is present and names one of the five roles declared in §1.7; X-User-ID header is present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Runs before anything else, including path-id existence. A request with a missing or unknown X-User-Role gets 401 even when the path id does not exist."

  - priority: 2
    category: auth
    check: "the authenticated role appears in the target endpoint's roles list in §1.5"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
    description: "Role authorization precedes existence: a DataSteward calling POST /deployments with a non-existent serving_endpoint_id gets 403, never 404."

  - priority: 3
    category: existence
    check: "every id in the URL path resolves to a stored row, validated left-to-right in path order"
    error_id: "ERR_MODEL_NOT_FOUND | ERR_TRAINING_DATASET_NOT_FOUND | ERR_MODEL_VERSION_NOT_FOUND | ERR_SERVING_ENDPOINT_NOT_FOUND | ERR_DEPLOYMENT_NOT_FOUND | ERR_MONITORING_WINDOW_NOT_FOUND | ERR_DRIFT_REPORT_NOT_FOUND | ERR_SKEW_CHECK_NOT_FOUND | ERR_RETRAINING_TRIGGER_NOT_FOUND | ERR_CHALLENGER_EVALUATION_NOT_FOUND | ERR_PREDICTION_INCIDENT_NOT_FOUND | ERR_REVALIDATION_TASK_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a path parameter"
    description: "Left-to-right means POST /models/{model_id}/challenger-evaluations with a bad model_id returns ERR_MODEL_NOT_FOUND even when the body's champion_deployment_id is also bogus."

  - priority: 4
    category: existence
    check: "every foreign-key id supplied in the request body resolves to a stored row, validated in the field order declared by the endpoint's input: list"
    error_id: "ERR_MODEL_VERSION_NOT_FOUND | ERR_TRAINING_DATASET_NOT_FOUND | ERR_SERVING_ENDPOINT_NOT_FOUND | ERR_DEPLOYMENT_NOT_FOUND | ERR_MONITORING_WINDOW_NOT_FOUND"
    http_status: 404
    applies_to: "POST /model-versions, POST /deployments, POST /monitoring-windows, POST /drift-reports, POST /skew-checks, POST /prediction-incidents, POST /models/{model_id}/challenger-evaluations"
    description: "Body FKs are checked after path ids and before any field-shape validation, so a body with both a bad FK and a malformed enum returns the 404."

  - priority: 5
    category: existence
    check: "all required input fields are present; every field's JSON type matches §1.1; every enum value is a member of its declared constraint set; numeric fields respect their declared ranges (percentages 0..100, proportions 0..1, counts >= 0); bin-proportion arrays have exactly BIN_COUNT (5) members that sum to 1.0000 within +/- 0.0001; labeled_prediction_count <= prediction_count and correct_labeled_count <= labeled_prediction_count; metric maps carry exactly the four keys ACCURACY_PROXY, CALIBRATION, LATENCY, COST"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
    description: "One code covers shape, type, enum membership and intra-body arithmetic consistency. Specialised codes exist where the failure needs its own diagnosis: ERR_INVALID_BIN_PROPORTIONS, ERR_LABEL_COUNT_INCONSISTENT, ERR_INVALID_FEATURE_STATS and ERR_INVALID_METRIC_SET are raised in preference to ERR_INVALID_REQUEST when the offending field is identifiable."

  - priority: 6
    category: existence
    check: "bin-proportion arrays contain exactly 5 numbers in [0, 1] summing to 1.0000 +/- 0.0001"
    error_id: ERR_INVALID_BIN_PROPORTIONS
    http_status: 400
    applies_to: "POST /training-datasets (baseline_bin_proportions), POST /monitoring-windows (observed_bin_proportions)"
    description: "A distribution that does not sum to one would make every PSI meaningless, so it is rejected at the boundary rather than silently normalised."

  - priority: 7
    category: existence
    check: "labeled_prediction_count <= prediction_count AND correct_labeled_count <= labeled_prediction_count"
    error_id: ERR_LABEL_COUNT_INCONSISTENT
    http_status: 400
    applies_to: "POST /monitoring-windows"
    description: "Guarantees both composite_health_score variants stay within [0, 1] without clamping."

  - priority: 8
    category: existence
    check: "training_feature_stats and serving_feature_stats are non-empty maps of feature_name -> object carrying a numeric mean key"
    error_id: ERR_INVALID_FEATURE_STATS
    http_status: 400
    applies_to: "POST /skew-checks"
    description: "An empty training_feature_stats would make max_skew_ratio undefined, so the empty map is rejected here rather than defaulted to 1.0000."

  - priority: 9
    category: existence
    check: "champion_metrics and challenger_metrics each carry exactly the keys ACCURACY_PROXY, CALIBRATION, LATENCY, COST with numeric values"
    error_id: ERR_INVALID_METRIC_SET
    http_status: 400
    applies_to: "POST /models/{model_id}/challenger-evaluations"
    description: "challenger_promotion_score iterates a fixed METRIC_ORDER; a missing key would silently drop a weighted line."

  - priority: 10
    category: existence
    check: "limit is an integer in [1, 100] and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "every GET list endpoint"
    description: "Defaults limit=10, offset=0 apply when the parameters are omitted; an out-of-range explicit value is an error, never silently clamped."

  - priority: 11
    category: business_temporal
    check: "interval endpoints are ordered strictly: Deployment.serve_from < serve_until; MonitoringWindow.window_start < window_end; ChallengerEvaluation.evaluation_ends_at > clock_now at creation"
    error_id: ERR_INVALID_INTERVAL
    http_status: 400
    applies_to: "POST /deployments, POST /monitoring-windows, POST /models/{model_id}/challenger-evaluations"
    description: "Shape-level interval sanity. It precedes every overlap rule so a self-inverted interval is never compared against a stored one."

  - priority: 12
    category: business_temporal
    check: "the requested current_utc is strictly greater than the logical clock's present value"
    error_id: ERR_CLOCK_REGRESSION
    http_status: 409
    applies_to: "POST /_clock/set_current_utc"
    description: "The logical clock is monotonic. Rewinding it would let a test invalidate already-stamped approved_at / closed_at instants."

  - priority: 13
    category: state
    check: "the supplied expected_<parent>_version equals the parent row's current version, per the matching §1.2.1 concurrency rule"
    error_id: "ERR_STALE_SERVING_ENDPOINT_VERSION | ERR_STALE_MODEL_VERSION"
    http_status: 412
    applies_to: "POST /deployments (expected_serving_endpoint_version), POST /models/{model_id}/challenger-evaluations (expected_model_version)"
    description: "OCC sits after existence and interval shape but BEFORE every state and business rule, so a stale-version request against a FROZEN endpoint returns 412, not ERR_SERVING_ENDPOINT_NOT_OPEN."

  - priority: 14
    category: state
    check: "the target row is not in a terminal state for its §1.2 machine (TrainingDataset REVOKED; ModelVersion REJECTED or DEPRECATED; Deployment rollout_state ROLLED_BACK or RETIRED; MonitoringWindow CLOSED for mutating actions; ChallengerEvaluation PROMOTED or REJECTED; RetrainingTrigger SATISFIED, DISMISSED or STALE; PredictionIncident RESOLVED; RevalidationTask PASSED or FAILED)"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "every POST or PATCH action endpoint that targets an existing row"
    description: "Terminal lockdown is distinguished from a merely wrong non-terminal state so tests can tell 'this row is finished forever' from 'this row is not ready yet'."

  - priority: 15
    category: state
    check: "the requested transition is declared in §1.2 for the target row's current state (including the parallel Deployment health dimension where the action reads it)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "every state-changing endpoint"
    description: "The generic non-terminal wrong-state code. It outranks every business rule, so approving an already-APPROVED version returns ERR_INVALID_STATE even when that version's dataset has since been revoked (priority-pair conflict A)."

  - priority: 16
    category: state
    check: "a MonitoringWindow may only be closed when window_end <= clock_now"
    error_id: ERR_WINDOW_NOT_ENDED
    http_status: 409
    applies_to: "POST /monitoring-windows/{window_id}/close"
    description: "Prevents a FINAL health score being computed over an interval that has not elapsed on the logical clock."

  - priority: 17
    category: state
    check: "the MonitoringWindow named by monitoring_window_id has status == CLOSED"
    error_id: ERR_WINDOW_NOT_CLOSED
    http_status: 409
    applies_to: "POST /drift-reports"
    description: "Only CLOSED windows carry a FINAL health score and a settled observed distribution, so only they may be scored for drift or serve as rolling-baseline inputs."

  - priority: 18
    category: state
    check: "Deployment.ramp_step_index is strictly less than the number of checkpoints in its pattern's ramp table"
    error_id: ERR_RAMP_ALREADY_COMPLETE
    http_status: 409
    applies_to: "POST /deployments/{deployment_id}/ramp"
    description: "Distinct from ERR_INVALID_STATE: the deployment is LIVE and healthy, there is simply no checkpoint left to advance to."

  - priority: 19
    category: state
    check: "Deployment.manual_override_active is false"
    error_id: ERR_MANUAL_OVERRIDE_ACTIVE
    http_status: 409
    applies_to: "POST /deployments/{deployment_id}/ramp, POST /deployments/{deployment_id}/rollout-action with action=RESUME"
    description: "While an incident's manual override pins traffic_pct, the ramp planner must not move it; the override has to be released through the incident first."

  - priority: 20
    category: business_constraint
    check: "the X-User-ID approving or rejecting a TrainingDataset differs from TrainingDataset.registered_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /training-datasets/{dataset_id}/decision"
    description: "Segregation of duties on the data-approval step. It is a business rule, not an auth rule, so it sits after existence and state — approving a REVOKED dataset as its own registrar returns ERR_TERMINAL_STATE, not this code."

  - priority: 21
    category: business_constraint
    check: "the X-User-ID deciding a ModelVersion differs from ModelVersion.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /model-versions/{version_id}/decision"
    description: "Same rule on the model-approval step; the submitter can never be the approver even when that user holds the ModelApprover role."

  - priority: 22
    category: business_constraint
    check: "the X-User-ID taking a RevalidationTask into review differs from the ModelVersion's decided_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /revalidation-tasks/{revalidation_task_id}/disposition with action=START_REVIEW"
    description: "Periodic revalidation must be performed by someone other than the original approver, closing the self-review loop."

  - priority: 30
    category: business_safety
    check: "doc_completeness_pct >= 80.00 AND reproducibility_score >= 100.00 for the ModelVersion"
    error_id: ERR_DOCUMENTATION_INCOMPLETE
    http_status: 422
    applies_to: "POST /model-versions/{version_id}/submit-for-review, POST /model-versions/{version_id}/decision with decision=APPROVE"
    description: "The documentation and reproducibility gate. Highest-ranked business rule: an undocumented model must never reach review, regardless of how good its data or metrics are."

  - priority: 31
    category: business_safety
    check: "TrainingDataset.pii_review_passed is true for the version's training_dataset_id"
    error_id: ERR_PII_REVIEW_MISSING
    http_status: 422
    applies_to: "POST /training-datasets/{dataset_id}/submit, POST /model-versions/{version_id}/decision with decision=APPROVE"
    description: "A snapshot whose PII review has not passed cannot be submitted for approval, and no version trained on it can be approved."

  - priority: 32
    category: business_safety
    check: "Deployment.health_state != CRITICAL"
    error_id: ERR_HEALTH_CRITICAL_BLOCKED
    http_status: 422
    applies_to: "POST /deployments/{deployment_id}/ramp, POST /deployments/{deployment_id}/rollout-action with action=RESUME, POST /challenger-evaluations/{evaluation_id}/conclude"
    description: "Safety beats capacity: ramping a CRITICAL deployment on an endpoint with zero headroom returns this code, never ERR_ENDPOINT_CAPACITY_EXHAUSTED (priority-pair conflict B)."

  - priority: 33
    category: business_safety
    check: "no PredictionIncident for the deployment has status IN {OPEN, MITIGATING, ESCALATED}"
    error_id: ERR_OPEN_INCIDENT_BLOCKS_ACTION
    http_status: 422
    applies_to: "POST /deployments/{deployment_id}/ramp, POST /deployments/{deployment_id}/rollout-action with action=RESUME"
    description: "Traffic may not increase while degraded predictions are unresolved. A MONITORING incident does not block — that state exists precisely to allow cautious resumption."

  - priority: 34
    category: business_safety
    check: "the most recent SkewCheck for (model_version_id, deployment_id) ordered by checked_at DESC then created_at DESC — if one exists — has status NOT IN {FAIL_SKEW, FAIL_MISSING_FEATURE}"
    error_id: ERR_SKEW_CHECK_FAILED
    http_status: 422
    applies_to: "POST /deployments/{deployment_id}/ramp, POST /challenger-evaluations/{evaluation_id}/conclude"
    description: "Training/serving skew is a correctness hazard: the ramp is blocked until a fresh PASS or WARN check supersedes the failing one. Absence of any check does not block."

  - priority: 35
    category: business_safety
    check: "Deployment.fallback_strategy != NONE"
    error_id: ERR_FALLBACK_NOT_CONFIGURED
    http_status: 422
    applies_to: "POST /prediction-incidents/{incident_id}/actions with action=ENGAGE_FALLBACK"
    description: "There is nothing to fall back to when the deployment declares no fallback path; the operator must use MANUAL_OVERRIDE instead."

  - priority: 36
    category: business_safety
    check: "the requested override_traffic_pct is strictly less than the deployment's current traffic_pct"
    error_id: ERR_OVERRIDE_EXCEEDS_CURRENT_TRAFFIC
    http_status: 422
    applies_to: "POST /prediction-incidents/{incident_id}/actions with action=MANUAL_OVERRIDE"
    description: "A manual override during an incident is a containment tool; it may only reduce exposure, never raise it past the ramp planner's back."

  - priority: 40
    category: business_referential
    check: "TrainingDataset(model_version.training_dataset_id).approval_state == APPROVED"
    error_id: ERR_DATASET_NOT_APPROVED
    http_status: 422
    applies_to: "POST /model-versions/{version_id}/decision with decision=APPROVE"
    description: "Cross-entity gate (Rule 7 pair 1): a version's approval depends on another entity's state. Outranked by ERR_INVALID_STATE at priority 15."

  - priority: 41
    category: business_referential
    check: "ModelVersion(deployment.model_version_id).approval_state == APPROVED"
    error_id: ERR_VERSION_NOT_APPROVED
    http_status: 422
    applies_to: "POST /deployments, POST /deployments/{deployment_id}/ramp"
    description: "A BLOCKED version — including one blocked by the dataset-revocation cascade — cannot receive new traffic even though its existing deployment row survives."

  - priority: 42
    category: business_referential
    check: "ServingEndpoint(deployment.serving_endpoint_id).operational_state == OPEN"
    error_id: ERR_SERVING_ENDPOINT_NOT_OPEN
    http_status: 422
    applies_to: "POST /deployments, POST /deployments/{deployment_id}/ramp"
    description: "Cross-entity gate (Rule 7 pair 2): FROZEN accepts no new traffic and DRAINED accepts none at all, so both block create and ramp."

  - priority: 43
    category: business_referential
    check: "two structural feature-pipeline identities, one per endpoint: on POST /model-versions the submitted feature_spec_hash == TrainingDataset(training_dataset_id).feature_hash; on POST /deployments ServingEndpoint(serving_endpoint_id).serving_feature_spec_hash == ModelVersion(model_version_id).feature_spec_hash"
    error_id: ERR_FEATURE_SPEC_MISMATCH
    http_status: 422
    applies_to: "POST /model-versions, POST /deployments"
    description: "Feature-pipeline consistency is enforced structurally twice — once between the training snapshot and the artifact at registration, once between the artifact and the serving cluster at deployment; skew detection then catches statistical divergence at runtime."

  - priority: 44
    category: business_referential
    check: "MonitoringWindow.model_version_id equals Deployment(deployment_id).model_version_id"
    error_id: ERR_WINDOW_VERSION_MISMATCH
    http_status: 422
    applies_to: "POST /monitoring-windows"
    description: "Observations must be attributed to the version the deployment actually serves, or every baseline comparison is against the wrong reference."

  - priority: 45
    category: business_referential
    check: "SkewCheck.deployment_id names a deployment whose model_version_id equals the submitted model_version_id"
    error_id: ERR_SKEW_DEPLOYMENT_MISMATCH
    http_status: 422
    applies_to: "POST /skew-checks"
    description: "Prevents comparing one version's training statistics against another version's serving traffic."

  - priority: 46
    category: business_referential
    check: "both deployments of a challenger evaluation belong to the path model_id: champion_deployment's version and challenger_deployment's version both have model_id == the path model_id"
    error_id: ERR_CHALLENGER_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /models/{model_id}/challenger-evaluations"
    description: "Champion-challenger comparison is only meaningful within one registry entry."

  - priority: 47
    category: business_referential
    check: "ModelVersion.parent_version_id, when supplied, names a version with the same model_id"
    error_id: ERR_LINEAGE_MODEL_MISMATCH
    http_status: 422
    applies_to: "POST /model-versions"
    description: "Retraining lineage may not cross registry entries."

  - priority: 48
    category: business_referential
    check: "the version named by retrained_version_id has model_id == RetrainingTrigger.model_id and has parent_version_id set to some version of that same model"
    error_id: ERR_RETRAINED_VERSION_LINEAGE_INVALID
    http_status: 422
    applies_to: "POST /retraining-triggers/{retraining_trigger_id}/disposition with action=LINK_VERSION"
    description: "A retraining outcome must be a genuine descendant, not an unrelated artifact re-labelled as the fix."

  - priority: 50
    category: business_constraint
    check: "no other Model shares the same (name, owner_team) pair"
    error_id: ERR_DUPLICATE_MODEL_NAME
    http_status: 409
    applies_to: "POST /models"
    description: "Registry uniqueness is scoped per owning team."

  - priority: 51
    category: business_constraint
    check: "no other ModelVersion of the same model_id shares the same semver"
    error_id: ERR_DUPLICATE_SEMVER
    http_status: 409
    applies_to: "POST /model-versions"
    description: "Version strings are the human handle on the registry; duplicates would make rollback ambiguous."

  - priority: 52
    category: business_constraint
    check: "no other ServingEndpoint shares the same (name, region) pair"
    error_id: ERR_DUPLICATE_SERVING_ENDPOINT_NAME
    http_status: 409
    applies_to: "POST /serving-endpoints"
    description: "Cluster names are unique within a region."

  - priority: 53
    category: business_constraint
    check: "no MonitoringWindow with the same (deployment_id, window_kind) is already in status OPEN"
    error_id: ERR_DUPLICATE_OPEN_WINDOW
    http_status: 409
    applies_to: "POST /monitoring-windows"
    description: "Exactly one open window per deployment per monitoring family. This uniqueness check outranks the interval-overlap check at priority 62, so an open window that also overlaps returns this code (priority-pair conflict C)."

  - priority: 54
    category: business_constraint
    check: "no ChallengerEvaluation for the same model_id has status IN {SCHEDULED, COLLECTING}"
    error_id: ERR_ACTIVE_EVALUATION_EXISTS
    http_status: 409
    applies_to: "POST /models/{model_id}/challenger-evaluations"
    description: "One live champion-challenger experiment per model at a time; overlapping experiments would contaminate each other's traffic."

  - priority: 55
    category: business_constraint
    check: "Deployment(challenger_deployment_id).pattern == SHADOW and Deployment(champion_deployment_id).pattern == REALTIME"
    error_id: ERR_CHALLENGER_NOT_SHADOW
    http_status: 422
    applies_to: "POST /models/{model_id}/challenger-evaluations"
    description: "A challenger must be observed in shadow mode; promoting a challenger that already carries live traffic would defeat the experiment."

  - priority: 56
    category: business_constraint
    check: "ChallengerEvaluation.extension_count < MAX_EVALUATION_EXTENSIONS (2)"
    error_id: ERR_MAX_EXTENSIONS_REACHED
    http_status: 409
    applies_to: "POST /challenger-evaluations/{evaluation_id}/extend"
    description: "Bounds the INCONCLUSIVE -> COLLECTING cycle so the cyclic machine terminates."

  - priority: 57
    category: business_constraint
    check: "RetrainingTrigger.retrain_required is false"
    error_id: ERR_RETRAIN_REQUIRED
    http_status: 409
    applies_to: "POST /retraining-triggers/{retraining_trigger_id}/disposition with action=DISMISS"
    description: "A trigger whose total_urgency reached RETRAIN_REQUIRED_THRESHOLD (45) may not be waved away; it must be linked to a retrained version instead."

  - priority: 58
    category: business_constraint
    check: "ModelVersion has no Deployment in rollout_state IN {RAMPING, HELD, LIVE, DRAINING}"
    error_id: ERR_VERSION_STILL_SERVING
    http_status: 409
    applies_to: "POST /model-versions/{version_id}/deprecate"
    description: "Deprecation is terminal; a version still carrying traffic must be drained first."

  - priority: 59
    category: business_constraint
    check: "the version being deprecated is not Model.champion_version_id"
    error_id: ERR_CANNOT_DEPRECATE_CHAMPION
    http_status: 409
    applies_to: "POST /model-versions/{version_id}/deprecate"
    description: "The registry must always be able to name its champion; a replacement must be promoted first."

  - priority: 60
    category: business_constraint
    check: "Model.registry_status == ACTIVE"
    error_id: ERR_MODEL_ARCHIVED
    http_status: 409
    applies_to: "POST /model-versions, POST /models/{model_id}/challenger-evaluations"
    description: "An archived registry entry accepts no new versions and no new experiments."

  - priority: 61
    category: business_temporal
    check: "the deployment's [serve_from, serve_until) interval, extended by the endpoint's trailing deploy_cooldown_minutes buffer, does not overlap any existing non-terminal deployment of the same (serving_endpoint_id, pattern)"
    error_id: ERR_SERVE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /deployments"
    description: "Half-open geometry with an ASYMMETRIC TRAILING buffer: a new serve_from must be >= existing.serve_until + deploy_cooldown_minutes, but a new serve_until == existing.serve_from is allowed with no buffer at all."

  - priority: 62
    category: business_temporal
    check: "the window's [window_start, window_end] interval does not overlap any existing MonitoringWindow of the same (deployment_id, window_kind)"
    error_id: ERR_MONITORING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /monitoring-windows"
    description: "FULLY CLOSED geometry with zero buffer, on a different resource entity from rule 61: shared endpoints touch, so window_start == an existing window_end is an overlap and is rejected."

  - priority: 63
    category: business_temporal
    check: "Deployment.serve_until > clock_now"
    error_id: ERR_SERVE_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /deployments/{deployment_id}/ramp, POST /deployments/{deployment_id}/rollout-action with action=RESUME"
    description: "Traffic cannot be increased on a deployment whose serve window has already ended on the logical clock."

  - priority: 64
    category: business_temporal
    check: "ChallengerEvaluation.evaluation_ends_at <= clock_now"
    error_id: ERR_EVALUATION_NOT_MATURE
    http_status: 409
    applies_to: "POST /challenger-evaluations/{evaluation_id}/conclude"
    description: "An evaluation may not be concluded before its declared end instant, so promotion decisions cannot be rushed."

  - priority: 65
    category: business_temporal
    check: "Deployment(challenger_deployment_id).rollout_state IN {RAMPING, HELD, LIVE} and Deployment(champion_deployment_id).rollout_state == LIVE"
    error_id: "ERR_CHALLENGER_NOT_SERVING | ERR_CHAMPION_NOT_LIVE"
    http_status: 409
    applies_to: "POST /challenger-evaluations/{evaluation_id}/start, POST /challenger-evaluations/{evaluation_id}/conclude"
    description: "Both arms of the experiment must actually be serving; the challenger code is evaluated first, then the champion code."

  - priority: 66
    category: business_temporal
    check: "Deployment.rollout_state IN {RAMPING, HELD, LIVE}"
    error_id: ERR_DEPLOYMENT_NOT_SERVING
    http_status: 409
    applies_to: "POST /monitoring-windows, POST /skew-checks, POST /prediction-incidents"
    description: "Observations, skew checks and incidents only make sense against a deployment that is or was carrying traffic in a non-terminal state."

  - priority: 70
    category: business_fiscal
    check: "the ramp planner's granted_delta_pct is strictly greater than zero, i.e. serving_endpoint.max_traffic_pct - reserve - allocated_traffic_pct > 0"
    error_id: ERR_ENDPOINT_CAPACITY_EXHAUSTED
    http_status: 409
    applies_to: "POST /deployments/{deployment_id}/ramp"
    description: "Capacity is the LAST gate. Evaluated after every safety rule, so it is only ever returned when the deployment is otherwise perfectly eligible to ramp."

  - priority: 71
    category: business_fiscal
    check: "the requested reserved_samples (or EXTENSION_SAMPLE_INCREMENT on extend) is <= ModelVersion.evaluation_sample_budget of the challenger version"
    error_id: ERR_SAMPLE_BUDGET_EXCEEDED
    http_status: 409
    applies_to: "POST /models/{model_id}/challenger-evaluations, POST /challenger-evaluations/{evaluation_id}/extend"
    description: "Aggregate quota check: each individual reservation is legal, but the collective total may not exceed evaluation_sample_quota."

  - priority: 72
    category: business_fiscal
    check: "the labeled_prediction_count supplied at conclude time is strictly greater than zero"
    error_id: ERR_NO_LABELED_PREDICTIONS
    http_status: 422
    applies_to: "POST /challenger-evaluations/{evaluation_id}/conclude"
    description: "Zero-count boundary: with no labels there is no evidence at all, which is a different failure from having too few labels (which yields INCONCLUSIVE with criteria_failures ['INSUFFICIENT_LABELS'])."

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
#
# api_prefix is "" — every business collection is a top-level flat resource,
# matching complexity_profile.entity_topology: flat. Two nested reads exist
# (GET /deployments/{deployment_id}/ramp-steps and .../health); everything else
# is a flat collection, an action endpoint under a flat collection, or one of the
# two /_ operational endpoints.
#
# Every FK declared in §1.1 is reverse-reachable through a filtered list whose
# input carries that FK field, except TrafficRampStep.deployment_id which is
# reachable both through GET /deployments/{deployment_id}/ramp-steps and through
# GET /traffic-ramp-steps?deployment_id=...
# -----------------------------------------------------------------------------
endpoints:

  # --- Model ------------------------------------------------------------------
  - method: POST
    path: "/models"
    description: "Register a new model in the registry. registry_status starts ACTIVE, champion_version_id starts null, open_retraining_trigger_count starts 0."
    roles: [MLEngineer, PlatformAdmin]
    code: 201
    input: [name, task_type, owner_team, "revalidation_interval_days?"]
    output: Model
    side_effects:
      - "stamps registered_by_user_id from X-User-ID"
      - "applies revalidation_interval_days default 90 when omitted"

  - method: GET
    path: "/models/{model_id}"
    description: "Read one registry entry including its computed champion pointer and open-trigger counter."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: Model
    side_effects: []

  - method: GET
    path: "/models"
    description: "List registry entries. Reverse-reachability channel for Model.champion_version_id."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["owner_team?", "task_type?", "registry_status?", "champion_version_id?", "limit?", "offset?"]
    output: Model[]
    side_effects: []

  - method: POST
    path: "/models/{model_id}/archive"
    description: "Archive a registry entry. Blocks new versions and new challenger evaluations; existing deployments keep serving."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Model
    side_effects:
      - "sets registry_status = 'ARCHIVED'"
      - "increments Model.version by 1"

  - method: POST
    path: "/models/{model_id}/challenger-evaluations"
    description: "Schedule a champion-challenger evaluation for this model. OCC-guarded on the Model row per §1.2.1 rule challenger-eval-create-stale-model."
    roles: [ReliabilityEngineer, PlatformAdmin]
    code: 201
    input: [champion_deployment_id, challenger_deployment_id, reserved_samples, evaluation_ends_at, champion_metrics, challenger_metrics, expected_model_version]
    output: ChallengerEvaluation
    side_effects:
      - "rejects with ERR_STALE_MODEL_VERSION (412) when expected_model_version != Model.version"
      - "increments Model.version by 1"
      - "copies challenger_version_id from Deployment(challenger_deployment_id).model_version_id"
      - "stamps created_by_user_id from X-User-ID; status starts SCHEDULED; extension_count starts 0"
      - "recomputes calculations.evaluation_sample_ledger on the challenger ModelVersion, lowering evaluation_sample_budget by reserved_samples"

  # --- TrainingDataset --------------------------------------------------------
  - method: POST
    path: "/training-datasets"
    description: "Register an immutable training-data snapshot reference. approval_state starts DRAFT."
    roles: [MLEngineer, DataSteward]
    code: 201
    input: [name, snapshot_uri, row_count, feature_hash, baseline_bin_proportions, baseline_positive_rate, license_class, "pii_review_passed?"]
    output: TrainingDataset
    side_effects:
      - "stamps registered_by_user_id from X-User-ID"
      - "applies pii_review_passed default false when omitted"
      - "initialises dependent_version_count to 0"

  - method: GET
    path: "/training-datasets/{dataset_id}"
    description: "Read one training-data snapshot reference including its computed dependent_version_count."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: TrainingDataset
    side_effects: []

  - method: GET
    path: "/training-datasets"
    description: "List training-data snapshot references."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["approval_state?", "license_class?", "pii_review_passed?", "limit?", "offset?"]
    output: TrainingDataset[]
    side_effects: []

  - method: POST
    path: "/training-datasets/{dataset_id}/submit"
    description: "Submit a DRAFT snapshot for steward approval, or return a REJECTED snapshot to DRAFT for rework (the resubmission loop of the cyclic machine)."
    roles: [MLEngineer, DataSteward]
    code: 200
    input: []
    output: TrainingDataset
    side_effects:
      - "DRAFT -> SUBMITTED requires pii_review_passed == true, else ERR_PII_REVIEW_MISSING (422)"
      - "REJECTED -> DRAFT clears decided_by_user_id and decided_at"
      - "increments TrainingDataset.version by 1"

  - method: POST
    path: "/training-datasets/{dataset_id}/decision"
    description: "Steward decision on a SUBMITTED snapshot. decision is one of APPROVE, REJECT."
    roles: [DataSteward]
    code: 200
    input: [decision, "note?"]
    output: TrainingDataset
    side_effects:
      - "rejects with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == registered_by_user_id"
      - "stamps decided_by_user_id from X-User-ID and decided_at from the logical clock"
      - "increments TrainingDataset.version by 1"

  - method: POST
    path: "/training-datasets/{dataset_id}/revoke"
    description: "Revoke an APPROVED snapshot. Entry point of CASCADE A (depth 4): dataset -> dependent versions -> their deployments -> their challenger evaluations."
    roles: [DataSteward, PlatformAdmin]
    code: 200
    input: [revocation_reason]
    output: TrainingDataset
    side_effects:
      - "CASCADE HOP 1: approval_state APPROVED -> REVOKED; records revocation_reason"
      - "CASCADE HOP 2: every ModelVersion with this training_dataset_id in approval_state APPROVED goes APPROVED -> BLOCKED with blocked_reason = 'TRAINING_DATA_REVOKED'"
      - "CASCADE HOP 3: every non-terminal Deployment of those versions goes RAMPING|HELD|LIVE -> DRAINING, traffic_pct set to 0.00, one TrafficRampStep appended with reason = DRAIN_RELEASE, and calculations.endpoint_traffic_ledger recomputed on each affected ServingEndpoint"
      - "CASCADE HOP 4: every ChallengerEvaluation in status COLLECTING whose champion_deployment_id or challenger_deployment_id was drained goes COLLECTING -> INCONCLUSIVE with criteria_failures ['DEPLOYMENT_DRAINED'], releasing its reserved_samples through calculations.evaluation_sample_ledger"
      - "recomputes calculations.dataset_dependency_counter"
      - "increments the version of every row it mutates by 1"

  # --- ModelVersion -----------------------------------------------------------
  - method: POST
    path: "/model-versions"
    description: "Register a model artifact version against a snapshot. approval_state starts DRAFT; documentation and reproducibility scores are computed from the supplied arrays."
    roles: [MLEngineer]
    code: 201
    input: [model_id, training_dataset_id, semver, artifact_digest, feature_spec_hash, baseline_accuracy, baseline_positive_rate, baseline_p95_latency_ms, "parent_version_id?", "doc_sections?", "repro_artifacts?", "evaluation_sample_quota?"]
    output: ModelVersion
    side_effects:
      - "requires feature_spec_hash == TrainingDataset(training_dataset_id).feature_hash, else ERR_FEATURE_SPEC_MISMATCH (422, validations priority 43)"
      - "runs calculations.documentation_and_reproducibility_score, writing doc_completeness_pct and reproducibility_score"
      - "initialises evaluation_sample_budget to evaluation_sample_quota (default 50000)"
      - "recomputes calculations.dataset_dependency_counter on the TrainingDataset"
      - "increments TrainingDataset.version by 1"

  - method: GET
    path: "/model-versions/{version_id}"
    description: "Read one artifact version including approval state, documentation scores, revalidation due date and sample budget."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ModelVersion
    side_effects: []

  - method: GET
    path: "/model-versions"
    description: "List artifact versions. Reverse-reachability channel for ModelVersion.model_id, ModelVersion.training_dataset_id and ModelVersion.parent_version_id."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["model_id?", "training_dataset_id?", "parent_version_id?", "approval_state?", "limit?", "offset?"]
    output: ModelVersion[]
    side_effects: []

  - method: PATCH
    path: "/model-versions/{version_id}/documentation"
    description: "Replace the documentation-section and reproducibility-artifact key arrays wholesale. Also the CHANGES_REQUESTED -> DRAFT rework transition."
    roles: [MLEngineer]
    code: 200
    input: [doc_sections, repro_artifacts]
    output: ModelVersion
    side_effects:
      - "replaces doc_sections and repro_artifacts wholesale (no merge)"
      - "re-runs calculations.documentation_and_reproducibility_score"
      - "when approval_state == CHANGES_REQUESTED, transitions CHANGES_REQUESTED -> DRAFT and clears decided_by_user_id"
      - "increments ModelVersion.version by 1"

  - method: POST
    path: "/model-versions/{version_id}/submit-for-review"
    description: "Submit a DRAFT version for approval. Gated on the documentation and reproducibility score."
    roles: [MLEngineer]
    code: 200
    input: []
    output: ModelVersion
    side_effects:
      - "rejects with ERR_DOCUMENTATION_INCOMPLETE (422) unless doc_completeness_pct >= 80.00 AND reproducibility_score >= 100.00"
      - "stamps submitted_by_user_id from X-User-ID"
      - "increments ModelVersion.version by 1"

  - method: POST
    path: "/model-versions/{version_id}/decision"
    description: "Approver decision on a PENDING_REVIEW version, or re-approval of a BLOCKED one. decision is one of APPROVE, REQUEST_CHANGES, REJECT."
    roles: [ModelApprover]
    code: 200
    input: [decision, "note?"]
    output: ModelVersion
    side_effects:
      - "rejects with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == submitted_by_user_id"
      - "APPROVE requires TrainingDataset(training_dataset_id).approval_state == APPROVED, else ERR_DATASET_NOT_APPROVED (422)"
      - "APPROVE stamps approved_at from the logical clock and runs calculations.revalidation_schedule variant APPROVAL_ANCHOR, writing revalidation_due_at"
      - "APPROVE on a BLOCKED version clears blocked_reason"
      - "stamps decided_by_user_id from X-User-ID"
      - "increments ModelVersion.version by 1"

  - method: POST
    path: "/model-versions/{version_id}/deprecate"
    description: "Retire an APPROVED or BLOCKED version from the registry. Terminal."
    roles: [ModelApprover, PlatformAdmin]
    code: 200
    input: []
    output: ModelVersion
    side_effects:
      - "rejects with ERR_VERSION_STILL_SERVING (409) when any Deployment of this version is in rollout_state RAMPING, HELD, LIVE or DRAINING"
      - "rejects with ERR_CANNOT_DEPRECATE_CHAMPION (409) when Model.champion_version_id == this version"
      - "clears revalidation_due_at to null so the sweep stops raising tasks for it"
      - "recomputes calculations.dataset_dependency_counter on the TrainingDataset"
      - "increments ModelVersion.version by 1"

  # --- ServingEndpoint --------------------------------------------------------
  - method: POST
    path: "/serving-endpoints"
    description: "Register a serving cluster. operational_state starts OPEN, allocated_traffic_pct starts 0.00."
    roles: [PlatformAdmin, ReliabilityEngineer]
    code: 201
    input: [name, region, serving_feature_spec_hash, "max_traffic_pct?", "deploy_cooldown_minutes?"]
    output: ServingEndpoint
    side_effects:
      - "applies max_traffic_pct default 100.00 and deploy_cooldown_minutes default 30 when omitted"
      - "initialises allocated_traffic_pct to 0.00"

  - method: GET
    path: "/serving-endpoints/{serving_endpoint_id}"
    description: "Read one serving cluster including its computed allocated_traffic_pct ledger and its version (the OCC token for POST /deployments)."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ServingEndpoint
    side_effects: []

  - method: GET
    path: "/serving-endpoints"
    description: "List serving clusters."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["region?", "operational_state?", "limit?", "offset?"]
    output: ServingEndpoint[]
    side_effects: []

  - method: POST
    path: "/serving-endpoints/{serving_endpoint_id}/operational-state"
    description: "Set the operator posture of a cluster. operational_state is one of OPEN, FROZEN, DRAINED."
    roles: [PlatformAdmin, ReliabilityEngineer]
    code: 200
    input: [operational_state]
    output: ServingEndpoint
    side_effects:
      - "FROZEN and DRAINED both make POST /deployments and POST /deployments/{deployment_id}/ramp fail with ERR_SERVING_ENDPOINT_NOT_OPEN (422); existing traffic is untouched"
      - "increments ServingEndpoint.version by 1"

  # --- Deployment -------------------------------------------------------------
  - method: POST
    path: "/deployments"
    description: "Create a deployment of an APPROVED version onto an OPEN cluster. rollout_state starts PENDING, health_state starts HEALTHY, traffic_pct starts 0.00. OCC-guarded on the ServingEndpoint row per §1.2.1 rule deployment-create-stale-serving-endpoint."
    roles: [ReliabilityEngineer]
    code: 201
    input: [model_version_id, serving_endpoint_id, pattern, serve_from, serve_until, expected_serving_endpoint_version, "fallback_strategy?"]
    output: Deployment
    side_effects:
      - "rejects with ERR_STALE_SERVING_ENDPOINT_VERSION (412) when expected_serving_endpoint_version != ServingEndpoint.version"
      - "increments ServingEndpoint.version by 1"
      - "requires ModelVersion.approval_state == APPROVED (ERR_VERSION_NOT_APPROVED), ServingEndpoint.operational_state == OPEN (ERR_SERVING_ENDPOINT_NOT_OPEN) and ServingEndpoint.serving_feature_spec_hash == ModelVersion.feature_spec_hash (ERR_FEATURE_SPEC_MISMATCH)"
      - "enforces the half-open serve-window rule with the trailing deploy_cooldown_minutes buffer (ERR_SERVE_WINDOW_CONFLICT)"
      - "sets target_traffic_pct to the final checkpoint of the pattern's ramp table (100.00 for every pattern) and ramp_step_index to 0"
      - "stamps created_by_user_id from X-User-ID; applies fallback_strategy default NONE"
      - "recomputes calculations.endpoint_traffic_ledger (a PENDING deployment contributes 0.00)"

  - method: GET
    path: "/deployments/{deployment_id}"
    description: "Read one deployment including both state dimensions, its traffic ledger fields and both health-score variants."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: Deployment
    side_effects: []

  - method: GET
    path: "/deployments"
    description: "List deployments. Reverse-reachability channel for Deployment.model_version_id and Deployment.serving_endpoint_id."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["model_version_id?", "serving_endpoint_id?", "pattern?", "rollout_state?", "health_state?", "limit?", "offset?"]
    output: Deployment[]
    side_effects: []

  - method: POST
    path: "/deployments/{deployment_id}/ramp"
    description: "Advance the deployment one checkpoint along its pattern's traffic ramp. Runs calculations.traffic_ramp_step_plan and appends exactly one TrafficRampStep."
    roles: [ReliabilityEngineer]
    code: 200
    input: []
    output: Deployment
    side_effects:
      - "runs calculations.traffic_ramp_step_plan; writes traffic_pct, recomputes cumulative_ramp_delta_pct and advances ramp_step_index only when traffic_pct lands exactly on the checkpoint"
      - "appends one TrafficRampStep with reason = RAMP_STEP, step_index = the pre-advance ramp_step_index, and health_state_at_step = the current health_state"
      - "PENDING -> RAMPING on the first call; RAMPING -> LIVE on the call that lands on the final checkpoint"
      - "recomputes calculations.endpoint_traffic_ledger on the ServingEndpoint"
      - "increments Deployment.version by 1"

  - method: POST
    path: "/deployments/{deployment_id}/rollout-action"
    description: "Drive the rollout dimension. action is one of HOLD, RESUME, ROLLBACK, RETIRE."
    roles: [ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: [action]
    output: Deployment
    side_effects:
      - "HOLD: RAMPING -> HELD, traffic_pct unchanged"
      - "RESUME: HELD -> RAMPING, traffic_pct unchanged; re-runs every priority-19 through priority-63 gate before allowing it"
      - "ROLLBACK: -> ROLLED_BACK, traffic_pct set to 0.00, one TrafficRampStep appended with reason = ROLLBACK_RELEASE and delta_pct = -(traffic_pct held at rollback time), stamping rolled_back_at; cumulative_ramp_delta_pct telescopes to 0.00"
      - "ROLLBACK CASCADE HOP 2: every ChallengerEvaluation in status COLLECTING referencing this deployment as champion or challenger goes COLLECTING -> INCONCLUSIVE with criteria_failures ['DEPLOYMENT_ROLLED_BACK'], releasing its reserved_samples"
      - "RETIRE: DRAINING|LIVE|PENDING -> RETIRED, traffic_pct set to 0.00, one TrafficRampStep appended with reason = DRAIN_RELEASE when traffic_pct was non-zero"
      - "recomputes calculations.endpoint_traffic_ledger on the ServingEndpoint after every action"
      - "increments Deployment.version by 1"

  - method: GET
    path: "/deployments/{deployment_id}/ramp-steps"
    description: "Read this deployment's immutable traffic-ramp ledger, ordered created_at ASC. The compensation audit trail for the rollback invariant."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["reason?", "limit?", "offset?"]
    output: TrafficRampStep[]
    side_effects: []

  - method: GET
    path: "/deployments/{deployment_id}/health"
    description: "Computed read of the deployment's health against baseline, from its most recent MonitoringWindow of window_kind PERFORMANCE ordered window_end DESC then created_at DESC. score_variant selects the calculations.composite_health_score variant and defaults to PROVISIONAL."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["score_variant?"]
    output: "{ deployment_id: string, health_state: string, score_variant: string, health_score: number, baseline_delta_pct: number, monitoring_window_id: string, prediction_count: integer, labeled_prediction_count: integer }"
    side_effects:
      - "returns health_score null and monitoring_window_id null when the deployment has no PERFORMANCE window yet"
      - "score_variant FINAL over an OPEN window is computed on demand and is NOT persisted to MonitoringWindow.health_score"

  # --- TrafficRampStep --------------------------------------------------------
  - method: GET
    path: "/traffic-ramp-steps/{ramp_step_id}"
    description: "Read one immutable ramp-ledger row. TrafficRampStep has common_fields false, so it carries id and created_at only — no updated_at and no version."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: TrafficRampStep
    side_effects: []

  - method: GET
    path: "/traffic-ramp-steps"
    description: "List ramp-ledger rows across deployments, ordered created_at ASC. Reverse-reachability channel for TrafficRampStep.deployment_id."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["deployment_id?", "reason?", "limit?", "offset?"]
    output: TrafficRampStep[]
    side_effects: []

  # --- MonitoringWindow -------------------------------------------------------
  - method: POST
    path: "/monitoring-windows"
    description: "Record an observation window against a serving deployment. status starts OPEN and health_score is computed with the PROVISIONAL variant."
    roles: [MLEngineer, ReliabilityEngineer]
    code: 201
    input: [deployment_id, model_version_id, window_kind, window_start, window_end, prediction_count, labeled_prediction_count, correct_labeled_count, positive_rate, p95_latency_ms, observed_bin_proportions]
    output: MonitoringWindow
    side_effects:
      - "requires Deployment.rollout_state IN {RAMPING, HELD, LIVE} (ERR_DEPLOYMENT_NOT_SERVING) and model_version_id == Deployment.model_version_id (ERR_WINDOW_VERSION_MISMATCH)"
      - "rejects a second OPEN window for the same (deployment_id, window_kind) with ERR_DUPLICATE_OPEN_WINDOW (409), and a closed-interval overlap with ERR_MONITORING_WINDOW_OVERLAP (409)"
      - "runs calculations.composite_health_score variant PROVISIONAL, writing health_score, health_score_variant = PROVISIONAL and baseline_delta_pct"
      - "mirrors health_score into Deployment.health_score_provisional"
      - "increments Deployment.version by 1"

  - method: GET
    path: "/monitoring-windows/{window_id}"
    description: "Read one observation window including its computed health score and which variant produced it."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: MonitoringWindow
    side_effects: []

  - method: GET
    path: "/monitoring-windows"
    description: "List observation windows, ordered window_end DESC then created_at DESC. Reverse-reachability channel for MonitoringWindow.deployment_id and MonitoringWindow.model_version_id, and the discovery channel for the rolling-baseline candidate pool."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["deployment_id?", "model_version_id?", "window_kind?", "status?", "limit?", "offset?"]
    output: MonitoringWindow[]
    side_effects: []

  - method: POST
    path: "/monitoring-windows/{window_id}/close"
    description: "Close an elapsed observation window, recomputing its health score with the FINAL variant. Also the deployment's DEGRADED -> HEALTHY recovery path."
    roles: [MLEngineer, ReliabilityEngineer]
    code: 200
    input: []
    output: MonitoringWindow
    side_effects:
      - "requires window_end <= clock_now, else ERR_WINDOW_NOT_ENDED (409)"
      - "OPEN -> CLOSED, stamping closed_at from the logical clock"
      - "re-runs calculations.composite_health_score with variant FINAL, overwriting health_score, setting health_score_variant = FINAL and recomputing baseline_delta_pct"
      - "mirrors the FINAL score into Deployment.health_score_final"
      - "when Deployment.health_state == DEGRADED and the FINAL health_score >= HEALTH_RECOVERY_MIN_SCORE (80.00), transitions the health dimension DEGRADED -> HEALTHY; a CRITICAL deployment does not recover this way"
      - "increments MonitoringWindow.version and Deployment.version by 1"

  # --- DriftReport ------------------------------------------------------------
  - method: POST
    path: "/drift-reports"
    description: "Score a CLOSED observation window for drift. Entry point of CASCADE B (depth 5): report -> retraining trigger -> deployment health -> rollout hold -> auto-raised incident."
    roles: [MLEngineer, ReliabilityEngineer]
    code: 201
    input: [monitoring_window_id, drift_kind, baseline_mode]
    output: DriftReport
    side_effects:
      - "requires MonitoringWindow.status == CLOSED, else ERR_WINDOW_NOT_CLOSED (409)"
      - "copies model_version_id from the window; runs calculations.drift_index under the selected variant, writing expected_bin_proportions, effective_baseline_mode, windows_used_count, drift_index and severity"
      - "sets baseline_dataset_id to the version's training_dataset_id under TRAINING_BASELINE (including the empty-pool fallback) and null under ROLLING_BASELINE"
      - "CASCADE HOP 1: status COMPUTED -> BREACHED when severity IN {WARN, CRITICAL}; stays COMPUTED when severity == NONE"
      - "CASCADE HOP 2: on BREACHED, creates one RetrainingTrigger in status PROPOSED with model_id from the version, drift_report_id = this report, skew_check_id = the most recent SkewCheck for the window's deployment ordered checked_at DESC then created_at DESC (null when none exists), and runs calculations.retraining_urgency; increments Model.open_retraining_trigger_count"
      - "CASCADE HOP 3: health dimension of the window's Deployment goes HEALTHY -> DEGRADED when severity == WARN, or HEALTHY|DEGRADED -> CRITICAL when severity == CRITICAL"
      - "CASCADE HOP 4: on severity == CRITICAL, a Deployment in rollout_state RAMPING goes RAMPING -> HELD"
      - "CASCADE HOP 5: on severity == CRITICAL, creates one PredictionIncident in status OPEN with source = DRIFT, severity = SEV2, drift_report_id = this report and model_version_id copied from the deployment"
      - "increments the version of every row it mutates by 1"

  - method: GET
    path: "/drift-reports/{drift_report_id}"
    description: "Read one drift report including the expected distribution actually used and how many windows were averaged into it."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: DriftReport
    side_effects: []

  - method: GET
    path: "/drift-reports"
    description: "List drift reports. Reverse-reachability channel for DriftReport.monitoring_window_id, DriftReport.model_version_id and DriftReport.baseline_dataset_id."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["monitoring_window_id?", "model_version_id?", "baseline_dataset_id?", "drift_kind?", "severity?", "status?", "limit?", "offset?"]
    output: DriftReport[]
    side_effects: []

  # --- SkewCheck --------------------------------------------------------------
  - method: POST
    path: "/skew-checks"
    description: "Compare a version's training feature statistics against a deployment's serving feature statistics. Runs calculations.feature_skew_ratio."
    roles: [MLEngineer, ReliabilityEngineer]
    code: 201
    input: [model_version_id, deployment_id, training_feature_stats, serving_feature_stats]
    output: SkewCheck
    side_effects:
      - "requires Deployment(deployment_id).model_version_id == model_version_id, else ERR_SKEW_DEPLOYMENT_MISMATCH (422)"
      - "copies training_dataset_id from the version; stamps checked_at from the logical clock"
      - "runs calculations.feature_skew_ratio, writing max_skew_ratio, max_skew_feature, missing_features and status"
      - "on status IN {FAIL_SKEW, FAIL_MISSING_FEATURE}, creates one RetrainingTrigger in status PROPOSED with model_id from the version, skew_check_id = this check, drift_report_id = null, and runs calculations.retraining_urgency with a zero drift component; increments Model.open_retraining_trigger_count"
      - "a FAIL_* status blocks subsequent ramps and challenger conclusions until a later PASS or WARN check supersedes it"

  - method: GET
    path: "/skew-checks/{skew_check_id}"
    description: "Read one skew check including the offending feature and the missing-feature list."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: SkewCheck
    side_effects: []

  - method: GET
    path: "/skew-checks"
    description: "List skew checks, ordered checked_at DESC then created_at DESC. Reverse-reachability channel for SkewCheck.model_version_id, SkewCheck.deployment_id and SkewCheck.training_dataset_id."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["model_version_id?", "deployment_id?", "training_dataset_id?", "status?", "limit?", "offset?"]
    output: SkewCheck[]
    side_effects: []

  # --- RetrainingTrigger ------------------------------------------------------
  - method: GET
    path: "/retraining-triggers/{retraining_trigger_id}"
    description: "Read one retraining trigger including its frozen urgency snapshot and the version linked as its outcome."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: RetrainingTrigger
    side_effects: []

  - method: GET
    path: "/retraining-triggers"
    description: "List retraining triggers, ordered total_urgency DESC then created_at ASC. Reverse-reachability channel for RetrainingTrigger.model_id, .drift_report_id, .skew_check_id and .retrained_version_id."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["model_id?", "drift_report_id?", "skew_check_id?", "retrained_version_id?", "status?", "priority_band?", "limit?", "offset?"]
    output: RetrainingTrigger[]
    side_effects: []

  - method: POST
    path: "/retraining-triggers/{retraining_trigger_id}/disposition"
    description: "Act on a retraining trigger. action is one of ACKNOWLEDGE, DISMISS, LINK_VERSION. LINK_VERSION requires retrained_version_id; DISMISS requires dismissed_reason."
    roles: [MLEngineer, PlatformAdmin]
    code: 200
    input: [action, "retrained_version_id?", "dismissed_reason?"]
    output: RetrainingTrigger
    side_effects:
      - "ACKNOWLEDGE: PROPOSED -> ACKNOWLEDGED, stamping acknowledged_by_user_id from X-User-ID, and moves the source DriftReport BREACHED -> ACKNOWLEDGED when drift_report_id is set"
      - "DISMISS: PROPOSED -> DISMISSED; rejected with ERR_RETRAIN_REQUIRED (409) while retrain_required is true"
      - "LINK_VERSION: writes retrained_version_id after checking lineage (ERR_RETRAINED_VERSION_LINEAGE_INVALID); lands on SATISFIED when that version is already APPROVED, otherwise on IN_PROGRESS, and may be re-issued from IN_PROGRESS once the version is approved"
      - "decrements Model.open_retraining_trigger_count when the trigger reaches SATISFIED, DISMISSED or STALE"
      - "increments RetrainingTrigger.version by 1, and Model.version by 1 when the counter moves"

  # --- ChallengerEvaluation ---------------------------------------------------
  - method: GET
    path: "/challenger-evaluations/{evaluation_id}"
    description: "Read one champion-challenger evaluation including its per-metric weighted lines, promotion score and criteria failures."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ChallengerEvaluation
    side_effects: []

  - method: GET
    path: "/challenger-evaluations"
    description: "List champion-challenger evaluations. Reverse-reachability channel for ChallengerEvaluation.model_id, .champion_deployment_id, .challenger_deployment_id and .challenger_version_id."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["model_id?", "champion_deployment_id?", "challenger_deployment_id?", "challenger_version_id?", "status?", "limit?", "offset?"]
    output: ChallengerEvaluation[]
    side_effects: []

  - method: POST
    path: "/challenger-evaluations/{evaluation_id}/start"
    description: "Begin collecting on a SCHEDULED evaluation. Both arms must be serving."
    roles: [ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ChallengerEvaluation
    side_effects:
      - "requires the challenger deployment in rollout_state RAMPING, HELD or LIVE (ERR_CHALLENGER_NOT_SERVING) and the champion deployment LIVE (ERR_CHAMPION_NOT_LIVE)"
      - "SCHEDULED -> COLLECTING"
      - "increments ChallengerEvaluation.version by 1"

  - method: POST
    path: "/challenger-evaluations/{evaluation_id}/conclude"
    description: "Resolve a COLLECTING evaluation into PROMOTED, REJECTED or INCONCLUSIVE. Runs calculations.challenger_promotion_score and evaluates every promotion criterion."
    roles: [ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: [labeled_prediction_count]
    output: ChallengerEvaluation
    side_effects:
      - "requires evaluation_ends_at <= clock_now (ERR_EVALUATION_NOT_MATURE) and labeled_prediction_count > 0 (ERR_NO_LABELED_PREDICTIONS)"
      - "runs calculations.challenger_promotion_score, writing metric_lines, promotion_score and criteria_failures"
      - "PROMOTED when criteria_failures is empty; INCONCLUSIVE when it is exactly ['INSUFFICIENT_LABELS']; REJECTED otherwise"
      - "on PROMOTED: sets Model.champion_version_id = challenger_version_id and Model.champion_promoted_at = clock_now, and increments Model.version by 1"
      - "on REJECTED or INCONCLUSIVE: releases reserved_samples through calculations.evaluation_sample_ledger, restoring the challenger version's evaluation_sample_budget"
      - "increments ChallengerEvaluation.version by 1"

  - method: POST
    path: "/challenger-evaluations/{evaluation_id}/extend"
    description: "Re-open an INCONCLUSIVE evaluation for another collection round. The bounded cycle of the cyclic state machine."
    roles: [ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: ChallengerEvaluation
    side_effects:
      - "rejects with ERR_MAX_EXTENSIONS_REACHED (409) when extension_count is already MAX_EVALUATION_EXTENSIONS (2)"
      - "INCONCLUSIVE -> COLLECTING, incrementing extension_count by 1 and pushing evaluation_ends_at out by EXTENSION_DAYS (7) days from its previous value"
      - "re-reserves reserved_samples and adds EXTENSION_SAMPLE_INCREMENT (500) to it, subject to ERR_SAMPLE_BUDGET_EXCEEDED (409)"
      - "clears criteria_failures back to []"
      - "increments ChallengerEvaluation.version by 1"

  # --- PredictionIncident -----------------------------------------------------
  - method: POST
    path: "/prediction-incidents"
    description: "Raise an incident for degraded predictions on a serving deployment. status starts OPEN."
    roles: [ReliabilityEngineer, MLEngineer, PlatformAdmin]
    code: 201
    input: [deployment_id, summary, "source?", "severity?"]
    output: PredictionIncident
    side_effects:
      - "requires Deployment.rollout_state IN {RAMPING, HELD, LIVE}, else ERR_DEPLOYMENT_NOT_SERVING (409)"
      - "copies model_version_id from the deployment; drift_report_id stays null for manually raised incidents"
      - "applies source default MANUAL and severity default SEV3; stamps opened_at from the logical clock"
      - "initialises fallback_engaged false and recurrence_count 0"

  - method: GET
    path: "/prediction-incidents/{incident_id}"
    description: "Read one incident including whether fallback was engaged, which strategy was used and how many recurrences it has taken."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: PredictionIncident
    side_effects: []

  - method: GET
    path: "/prediction-incidents"
    description: "List incidents. Reverse-reachability channel for PredictionIncident.deployment_id, .model_version_id and .drift_report_id."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["deployment_id?", "model_version_id?", "drift_report_id?", "source?", "severity?", "status?", "limit?", "offset?"]
    output: PredictionIncident[]
    side_effects: []

  - method: POST
    path: "/prediction-incidents/{incident_id}/actions"
    description: "Drive the incident-response lifecycle. action is one of ENGAGE_FALLBACK, MANUAL_OVERRIDE, MONITOR, RECUR, RESOLVE. MANUAL_OVERRIDE requires override_traffic_pct."
    roles: [ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: [action, "override_traffic_pct?", "note?"]
    output: PredictionIncident
    side_effects:
      - "ENGAGE_FALLBACK: OPEN -> MITIGATING; requires Deployment.fallback_strategy != NONE (ERR_FALLBACK_NOT_CONFIGURED); sets fallback_engaged true and copies fallback_strategy_used from the deployment"
      - "MANUAL_OVERRIDE: OPEN -> MITIGATING; requires override_traffic_pct < the deployment's current traffic_pct (ERR_OVERRIDE_EXCEEDS_CURRENT_TRAFFIC); pins Deployment.traffic_pct to override_traffic_pct, sets manual_override_active true and override_traffic_pct on the deployment, records manual_override_traffic_pct on the incident, appends one TrafficRampStep with reason = MANUAL_OVERRIDE, and recomputes calculations.endpoint_traffic_ledger"
      - "MONITOR: MITIGATING -> MONITORING"
      - "RECUR: MONITORING -> MITIGATING while recurrence_count + 1 < MAX_RECURRENCES (2), otherwise MONITORING -> ESCALATED; increments recurrence_count by 1 either way"
      - "RESOLVE: MONITORING|ESCALATED -> RESOLVED, stamping resolved_at; releases any manual override by clearing Deployment.manual_override_active and override_traffic_pct, appending one TrafficRampStep with reason = OVERRIDE_RELEASE that restores traffic_pct to its pre-override value, and recomputing calculations.endpoint_traffic_ledger"
      - "RESOLVE also moves the Deployment health dimension CRITICAL -> DEGRADED when it was CRITICAL"
      - "increments PredictionIncident.version by 1, and Deployment.version by 1 whenever the deployment is touched"

  # --- RevalidationTask -------------------------------------------------------
  - method: GET
    path: "/revalidation-tasks/{revalidation_task_id}"
    description: "Read one periodic-revalidation task including the due date it was swept for and the reviewer who took it."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: []
    output: RevalidationTask
    side_effects: []

  - method: GET
    path: "/revalidation-tasks"
    description: "List periodic-revalidation tasks, ordered due_at ASC then created_at ASC. Reverse-reachability channel for RevalidationTask.model_version_id."
    roles: [MLEngineer, DataSteward, ModelApprover, ReliabilityEngineer, PlatformAdmin]
    code: 200
    input: ["model_version_id?", "status?", "limit?", "offset?"]
    output: RevalidationTask[]
    side_effects: []

  - method: POST
    path: "/revalidation-tasks/{revalidation_task_id}/disposition"
    description: "Act on a revalidation task. action is one of START_REVIEW, PASS, FAIL. Entry point of CASCADE C (depth 4) on FAIL: task -> version blocked -> deployments drained -> evaluations inconclusive."
    roles: [ModelApprover, PlatformAdmin]
    code: 200
    input: [action, "findings?"]
    output: RevalidationTask
    side_effects:
      - "START_REVIEW: DUE -> IN_REVIEW, stamping reviewer_user_id from X-User-ID; rejected with ERR_SEGREGATION_OF_DUTIES (403) when X-User-ID == the version's decided_by_user_id"
      - "PASS: IN_REVIEW -> PASSED, stamping decided_at, and runs calculations.revalidation_schedule variant PASS_ANCHOR, pushing the version's revalidation_due_at to clock_now + revalidation_interval_days"
      - "FAIL CASCADE HOP 1: IN_REVIEW -> FAILED, stamping decided_at"
      - "FAIL CASCADE HOP 2: the version goes APPROVED -> BLOCKED with blocked_reason = 'REVALIDATION_FAILED' and revalidation_due_at cleared to null"
      - "FAIL CASCADE HOP 3: every non-terminal Deployment of that version goes RAMPING|HELD|LIVE -> DRAINING with traffic_pct 0.00, one TrafficRampStep with reason = DRAIN_RELEASE, and calculations.endpoint_traffic_ledger recomputed"
      - "FAIL CASCADE HOP 4: every COLLECTING ChallengerEvaluation on a drained deployment goes COLLECTING -> INCONCLUSIVE with criteria_failures ['DEPLOYMENT_DRAINED'], releasing its reserved_samples"
      - "increments the version of every row it mutates by 1"

  # --- Operational (test-driving, /_ namespace) --------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z: before any call to this endpoint the logical clock reads 2026-08-01T00:00:00Z and never falls back to real wall-clock time. The clock is monotonic — a value not strictly after the present value is rejected with ERR_CLOCK_REGRESSION (409). Every datetime the server stamps (created_at, updated_at, approved_at, closed_at, checked_at, opened_at, resolved_at, decided_at, swept_at, clock_at_step) and every deadline comparison reads this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects:
      - "does not itself mutate any business row; it only changes what subsequent requests read as clock_now"

  - method: POST
    path: "/_ops/revalidation-sweep"
    description: "Run the periodic-revalidation sweep and the retraining-trigger staleness sweep against the current logical clock."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ evaluated_count: integer, created_count: integer, skipped_existing_count: integer, staled_trigger_count: integer }"
    side_effects:
      - "creates one RevalidationTask in status DUE for every APPROVED ModelVersion whose revalidation_due_at is non-null and <= clock_now and that has no task in status DUE or IN_REVIEW, ordered revalidation_due_at ASC then created_at ASC, stamping due_at from the version and swept_at from the clock"
      - "moves every RetrainingTrigger in status ACKNOWLEDGED or IN_PROGRESS whose stale_after <= clock_now to STALE and decrements Model.open_retraining_trigger_count for each"
      - "is idempotent at a fixed clock: a second call reports created_count 0 and counts the same versions under skipped_existing_count"
      - "increments the version of every row it mutates by 1"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  # --- auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role is not one of the five roles in §1.7"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the authenticated role is not listed in the target endpoint's roles"

  # --- not found ---
  - id: ERR_MODEL_NOT_FOUND
    http: 404
    condition: "model_id in the path, or a model_id body reference, resolves to no Model"
  - id: ERR_TRAINING_DATASET_NOT_FOUND
    http: 404
    condition: "dataset_id in the path, or a training_dataset_id body reference, resolves to no TrainingDataset"
  - id: ERR_MODEL_VERSION_NOT_FOUND
    http: 404
    condition: "version_id in the path, or a model_version_id / parent_version_id / retrained_version_id body reference, resolves to no ModelVersion"
  - id: ERR_SERVING_ENDPOINT_NOT_FOUND
    http: 404
    condition: "serving_endpoint_id in the path or body resolves to no ServingEndpoint"
  - id: ERR_DEPLOYMENT_NOT_FOUND
    http: 404
    condition: "deployment_id in the path, or a deployment_id / champion_deployment_id / challenger_deployment_id body reference, resolves to no Deployment"
  - id: ERR_TRAFFIC_RAMP_STEP_NOT_FOUND
    http: 404
    condition: "ramp_step_id in the path resolves to no TrafficRampStep"
  - id: ERR_MONITORING_WINDOW_NOT_FOUND
    http: 404
    condition: "window_id in the path, or a monitoring_window_id body reference, resolves to no MonitoringWindow"
  - id: ERR_DRIFT_REPORT_NOT_FOUND
    http: 404
    condition: "drift_report_id in the path resolves to no DriftReport"
  - id: ERR_SKEW_CHECK_NOT_FOUND
    http: 404
    condition: "skew_check_id in the path resolves to no SkewCheck"
  - id: ERR_RETRAINING_TRIGGER_NOT_FOUND
    http: 404
    condition: "retraining_trigger_id in the path resolves to no RetrainingTrigger"
  - id: ERR_CHALLENGER_EVALUATION_NOT_FOUND
    http: 404
    condition: "evaluation_id in the path resolves to no ChallengerEvaluation"
  - id: ERR_PREDICTION_INCIDENT_NOT_FOUND
    http: 404
    condition: "incident_id in the path resolves to no PredictionIncident"
  - id: ERR_REVALIDATION_TASK_NOT_FOUND
    http: 404
    condition: "revalidation_task_id in the path resolves to no RevalidationTask"

  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing, a field has the wrong JSON type, an enum value is outside its declared set, or a numeric field is outside its declared range"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside [1, 100] or offset negative on any list endpoint"
  - id: ERR_INVALID_INTERVAL
    http: 400
    condition: "serve_from >= serve_until, window_start >= window_end, or evaluation_ends_at <= clock_now at evaluation creation"
  - id: ERR_INVALID_BIN_PROPORTIONS
    http: 400
    condition: "a bin-proportion array does not have exactly 5 members in [0, 1] summing to 1.0000 +/- 0.0001"
  - id: ERR_LABEL_COUNT_INCONSISTENT
    http: 400
    condition: "labeled_prediction_count > prediction_count, or correct_labeled_count > labeled_prediction_count, on POST /monitoring-windows"
  - id: ERR_INVALID_FEATURE_STATS
    http: 400
    condition: "training_feature_stats or serving_feature_stats is empty, or some entry lacks a numeric mean key, on POST /skew-checks"
  - id: ERR_INVALID_METRIC_SET
    http: 400
    condition: "champion_metrics or challenger_metrics does not carry exactly the numeric keys ACCURACY_PROXY, CALIBRATION, LATENCY, COST"

  # --- optimistic concurrency (§1.2.1) ---
  - id: ERR_STALE_SERVING_ENDPOINT_VERSION
    http: 412
    condition: "expected_serving_endpoint_version on POST /deployments does not equal the ServingEndpoint's current version"
  - id: ERR_STALE_MODEL_VERSION
    http: 412
    condition: "expected_model_version on POST /models/{model_id}/challenger-evaluations does not equal the Model's current version"

  # --- state ---
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "the target row is already in a terminal state for its §1.2 machine and no transition can leave it"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared in §1.2 from the row's current non-terminal state"
  - id: ERR_WINDOW_NOT_ENDED
    http: 409
    condition: "POST /monitoring-windows/{window_id}/close while window_end > clock_now"
  - id: ERR_WINDOW_NOT_CLOSED
    http: 409
    condition: "POST /drift-reports naming a MonitoringWindow whose status is still OPEN"
  - id: ERR_RAMP_ALREADY_COMPLETE
    http: 409
    condition: "POST /deployments/{deployment_id}/ramp when ramp_step_index has already passed the last checkpoint of the pattern's table"
  - id: ERR_MANUAL_OVERRIDE_ACTIVE
    http: 409
    condition: "ramp or RESUME attempted while Deployment.manual_override_active is true"
  - id: ERR_CLOCK_REGRESSION
    http: 409
    condition: "POST /_clock/set_current_utc with a current_utc not strictly after the clock's present value"

  # --- segregation of duties ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID is the same person as the one who performed the preceding step: dataset registrar deciding their own dataset, version submitter deciding their own version, or version approver taking its revalidation into review"

  # --- safety / compliance ---
  - id: ERR_DOCUMENTATION_INCOMPLETE
    http: 422
    condition: "doc_completeness_pct < 80.00 or reproducibility_score < 100.00 at submit-for-review or at APPROVE"
  - id: ERR_PII_REVIEW_MISSING
    http: 422
    condition: "the training snapshot's pii_review_passed is false at dataset submit or at version APPROVE"
  - id: ERR_HEALTH_CRITICAL_BLOCKED
    http: 422
    condition: "ramp, RESUME or conclude attempted while the Deployment health dimension is CRITICAL"
  - id: ERR_OPEN_INCIDENT_BLOCKS_ACTION
    http: 422
    condition: "ramp or RESUME attempted while a PredictionIncident on the deployment is OPEN, MITIGATING or ESCALATED"
  - id: ERR_SKEW_CHECK_FAILED
    http: 422
    condition: "ramp or conclude attempted while the most recent SkewCheck for the (version, deployment) pair has status FAIL_SKEW or FAIL_MISSING_FEATURE"
  - id: ERR_FALLBACK_NOT_CONFIGURED
    http: 422
    condition: "ENGAGE_FALLBACK on a deployment whose fallback_strategy is NONE"
  - id: ERR_OVERRIDE_EXCEEDS_CURRENT_TRAFFIC
    http: 422
    condition: "MANUAL_OVERRIDE with override_traffic_pct >= the deployment's current traffic_pct"

  # --- referential / cross-entity ---
  - id: ERR_DATASET_NOT_APPROVED
    http: 422
    condition: "APPROVE on a ModelVersion whose training_dataset_id is not in approval_state APPROVED"
  - id: ERR_VERSION_NOT_APPROVED
    http: 422
    condition: "POST /deployments or ramp for a ModelVersion not in approval_state APPROVED (including BLOCKED by a cascade)"
  - id: ERR_SERVING_ENDPOINT_NOT_OPEN
    http: 422
    condition: "POST /deployments or ramp against a ServingEndpoint whose operational_state is FROZEN or DRAINED"
  - id: ERR_FEATURE_SPEC_MISMATCH
    http: 422
    condition: "feature_spec_hash != TrainingDataset.feature_hash on POST /model-versions, or ServingEndpoint.serving_feature_spec_hash != ModelVersion.feature_spec_hash on POST /deployments"
  - id: ERR_WINDOW_VERSION_MISMATCH
    http: 422
    condition: "POST /monitoring-windows whose model_version_id differs from the deployment's model_version_id"
  - id: ERR_SKEW_DEPLOYMENT_MISMATCH
    http: 422
    condition: "POST /skew-checks whose deployment serves a different model_version_id than the one submitted"
  - id: ERR_CHALLENGER_MODEL_MISMATCH
    http: 422
    condition: "either arm of a challenger evaluation belongs to a version of a different model than the path model_id"
  - id: ERR_LINEAGE_MODEL_MISMATCH
    http: 422
    condition: "POST /model-versions whose parent_version_id belongs to a different model_id"
  - id: ERR_RETRAINED_VERSION_LINEAGE_INVALID
    http: 422
    condition: "LINK_VERSION naming a version of another model, or one with no parent_version_id inside the trigger's model"

  # --- uniqueness / constraint ---
  - id: ERR_DUPLICATE_MODEL_NAME
    http: 409
    condition: "POST /models with a (name, owner_team) pair that already exists"
  - id: ERR_DUPLICATE_SEMVER
    http: 409
    condition: "POST /model-versions with a semver already used by another version of the same model"
  - id: ERR_DUPLICATE_SERVING_ENDPOINT_NAME
    http: 409
    condition: "POST /serving-endpoints with a (name, region) pair that already exists"
  - id: ERR_DUPLICATE_OPEN_WINDOW
    http: 409
    condition: "POST /monitoring-windows while another window for the same (deployment_id, window_kind) is still OPEN"
  - id: ERR_ACTIVE_EVALUATION_EXISTS
    http: 409
    condition: "POST /models/{model_id}/challenger-evaluations while another evaluation of that model is SCHEDULED or COLLECTING"
  - id: ERR_CHALLENGER_NOT_SHADOW
    http: 422
    condition: "the challenger deployment's pattern is not SHADOW, or the champion deployment's pattern is not REALTIME"
  - id: ERR_MAX_EXTENSIONS_REACHED
    http: 409
    condition: "POST /challenger-evaluations/{evaluation_id}/extend when extension_count already equals MAX_EVALUATION_EXTENSIONS (2)"
  - id: ERR_RETRAIN_REQUIRED
    http: 409
    condition: "DISMISS on a RetrainingTrigger whose retrain_required is true (total_urgency >= 45)"
  - id: ERR_VERSION_STILL_SERVING
    http: 409
    condition: "deprecate a version with a Deployment in RAMPING, HELD, LIVE or DRAINING"
  - id: ERR_CANNOT_DEPRECATE_CHAMPION
    http: 409
    condition: "deprecate the version currently named by Model.champion_version_id"
  - id: ERR_MODEL_ARCHIVED
    http: 409
    condition: "POST /model-versions or POST /models/{model_id}/challenger-evaluations against a Model whose registry_status is ARCHIVED"

  # --- temporal ---
  - id: ERR_SERVE_WINDOW_CONFLICT
    http: 409
    condition: "the new deployment's half-open serve interval, extended by the endpoint's trailing deploy_cooldown_minutes, overlaps a non-terminal deployment of the same (serving_endpoint_id, pattern)"
  - id: ERR_MONITORING_WINDOW_OVERLAP
    http: 409
    condition: "the new window's fully closed interval touches or overlaps an existing window of the same (deployment_id, window_kind)"
  - id: ERR_SERVE_WINDOW_EXPIRED
    http: 409
    condition: "ramp or RESUME on a deployment whose serve_until <= clock_now"
  - id: ERR_EVALUATION_NOT_MATURE
    http: 409
    condition: "conclude before evaluation_ends_at <= clock_now"
  - id: ERR_CHALLENGER_NOT_SERVING
    http: 409
    condition: "the challenger deployment's rollout_state is not RAMPING, HELD or LIVE at start or conclude"
  - id: ERR_CHAMPION_NOT_LIVE
    http: 409
    condition: "the champion deployment's rollout_state is not LIVE at start or conclude"
  - id: ERR_DEPLOYMENT_NOT_SERVING
    http: 409
    condition: "POST /monitoring-windows, POST /skew-checks or POST /prediction-incidents against a deployment whose rollout_state is not RAMPING, HELD or LIVE"

  # --- capacity / quota ---
  - id: ERR_ENDPOINT_CAPACITY_EXHAUSTED
    http: 409
    condition: "the ramp planner's granted_delta_pct evaluates to exactly 0 because max_traffic_pct minus the headroom reserve minus allocated_traffic_pct leaves nothing"
  - id: ERR_SAMPLE_BUDGET_EXCEEDED
    http: 409
    condition: "the requested reserved_samples, or the extension increment, exceeds the challenger version's evaluation_sample_budget"
  - id: ERR_NO_LABELED_PREDICTIONS
    http: 422
    condition: "conclude with labeled_prediction_count == 0"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix — role_model: segregation_of_duties
#
# Every role is `opaque`: X-User-ID is an operator identifier, never the id of a
# persisted row. The scaffold stores those operator ids on business rows
# (registered_by_user_id, submitted_by_user_id, decided_by_user_id,
# acknowledged_by_user_id, reviewer_user_id, created_by_user_id) purely so the
# three ERR_SEGREGATION_OF_DUTIES rules can compare "who did step A" with
# "who is attempting step B" — no comparison to any entity's id is ever made.
# -----------------------------------------------------------------------------
roles:

  - name: MLEngineer
    description: "Builds models: registers registry entries, snapshots and artifact versions, edits documentation, submits for review, records monitoring windows, drift reports and skew checks, and dispositions retraining triggers. Cannot approve anything."
    identity: opaque
    exclusive_operations:
      - "POST /model-versions"
      - "PATCH /model-versions/{version_id}/documentation"
      - "POST /model-versions/{version_id}/submit-for-review"
    shared_operations:
      - "POST /models (with PlatformAdmin)"
      - "POST /training-datasets, POST /training-datasets/{dataset_id}/submit (with DataSteward)"
      - "POST /monitoring-windows, POST /monitoring-windows/{window_id}/close (with ReliabilityEngineer)"
      - "POST /drift-reports, POST /skew-checks (with ReliabilityEngineer)"
      - "POST /retraining-triggers/{retraining_trigger_id}/disposition (with PlatformAdmin)"
      - "POST /prediction-incidents (with ReliabilityEngineer, PlatformAdmin)"
      - "every GET endpoint (with all roles)"

  - name: DataSteward
    description: "Owns the training-data reference lifecycle: approves, rejects and revokes snapshots. The dataset decision is exclusive to this role, and the segregation-of-duties rule stops a steward deciding a snapshot they registered themselves."
    identity: opaque
    exclusive_operations:
      - "POST /training-datasets/{dataset_id}/decision"
    shared_operations:
      - "POST /training-datasets, POST /training-datasets/{dataset_id}/submit (with MLEngineer)"
      - "POST /training-datasets/{dataset_id}/revoke (with PlatformAdmin)"
      - "every GET endpoint (with all roles)"

  - name: ModelApprover
    description: "Owns the model-approval and periodic-revalidation lifecycle. Cannot register or document versions, so the submit/approve split is structural; cannot ramp or roll back traffic either."
    identity: opaque
    exclusive_operations:
      - "POST /model-versions/{version_id}/decision"
    shared_operations:
      - "POST /model-versions/{version_id}/deprecate (with PlatformAdmin)"
      - "POST /revalidation-tasks/{revalidation_task_id}/disposition (with PlatformAdmin)"
      - "every GET endpoint (with all roles)"

  - name: ReliabilityEngineer
    description: "Owns serving traffic and incident response: creates deployments, drives the ramp and rollout actions, runs champion-challenger evaluations and resolves prediction incidents. Deployment creation and ramping are exclusive to this role — no admin override exists for them."
    identity: opaque
    exclusive_operations:
      - "POST /deployments"
      - "POST /deployments/{deployment_id}/ramp"
    shared_operations:
      - "POST /deployments/{deployment_id}/rollout-action (with PlatformAdmin)"
      - "POST /serving-endpoints, POST /serving-endpoints/{serving_endpoint_id}/operational-state (with PlatformAdmin)"
      - "POST /monitoring-windows, POST /monitoring-windows/{window_id}/close (with MLEngineer)"
      - "POST /drift-reports, POST /skew-checks (with MLEngineer)"
      - "POST /models/{model_id}/challenger-evaluations and the start / conclude / extend actions (with PlatformAdmin)"
      - "POST /prediction-incidents, POST /prediction-incidents/{incident_id}/actions (with PlatformAdmin)"
      - "every GET endpoint (with all roles)"

  - name: PlatformAdmin
    description: "Operates the platform: archives registry entries, manages serving clusters, drives the logical clock and the sweep, and can stand in for rollout, evaluation and incident actions. Deliberately NOT a superuser — it cannot create deployments, ramp traffic, decide datasets, decide versions, register versions or edit documentation, so no single role can walk a model from registration to live traffic alone."
    identity: opaque
    exclusive_operations:
      - "POST /models/{model_id}/archive"
      - "POST /_clock/set_current_utc"
      - "POST /_ops/revalidation-sweep"
    shared_operations:
      - "POST /models (with MLEngineer)"
      - "POST /training-datasets/{dataset_id}/revoke (with DataSteward)"
      - "POST /model-versions/{version_id}/deprecate (with ModelApprover)"
      - "POST /serving-endpoints, POST /serving-endpoints/{serving_endpoint_id}/operational-state (with ReliabilityEngineer)"
      - "POST /deployments/{deployment_id}/rollout-action (with ReliabilityEngineer)"
      - "POST /models/{model_id}/challenger-evaluations and the start / conclude / extend actions (with ReliabilityEngineer)"
      - "POST /prediction-incidents, POST /prediction-incidents/{incident_id}/actions (with ReliabilityEngineer)"
      - "POST /retraining-triggers/{retraining_trigger_id}/disposition (with MLEngineer)"
      - "POST /revalidation-tasks/{revalidation_task_id}/disposition (with ModelApprover)"
      - "every GET endpoint (with all roles)"
