            - *close_std
            - *get_rating
          trigger:
            - *c_publish
            - *publish_std
            - call: "GET /muni/engagements/${eng_go}"
              payload: {}
              as: LeadAnalyst
              as_user_id: "analyst-1"
              captures: { eng_status: $.data.status }
            - call: "GET /muni/ratings/${rating_id}/disclosure-obligations"
              payload: {}
              as: SurveillanceOfficer
              captures: { ob1_fye: "$.data[0].fiscal_year_end", ob1_due: "$.data[0].due_at", ob1_status: "$.data[0].status", ob1_period: "$.data[0].period_index" }
