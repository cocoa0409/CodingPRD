    roles: [PharmacyOps]
    code: 201
    input: [packaged_quantity]
    output: PrescriptionRequest
    side_effects:
      - "Transition DRAFT -> INTAKE_REVIEW per the Prescription state machine"
      - "Creates the PrescriptionRequest with status = SUBMITTED"
      - "Recomputes the drug's demand_units_30d"

  - method: POST
    path: "/prescriptions/{id}/termination"
    description: "Terminate an active prescription"
    roles: [Pharmacist]
    code: 200
    input: []
    output: Prescription
    side_effects: ["Transition ACTIVE -> TERMINATED per the Prescription state machine"]

  - method: POST
    path: "/prescriptions/{id}/substitution"
    description: "Substitute the prescription's drug after a shortage or an authorisation change; drives every non-terminal order comparison to REFRESH_REQUIRED"
    roles: [Pharmacist]
    code: 200
    input: [new_drug_id, reason_code]
    output: Prescription
    side_effects:
      - "Sets Prescription.drug_id = new_drug_id"
      - "For every Order of this prescription with status IN {CREATED, PAID, FULFILLING, SHIPPED}: recompute the order's retail_reference_price_cents and insured_reference_price_cents from the NEW drug's reference prices, then set the order's PriceComparison.state = REFRESH_REQUIRED, clear substantiated, clear substantiation_digest, and increment both the order's and the comparison's version"
      - "Recomputes the new drug's demand_units_30d"
      - "Increments Prescription.version by 1"

  # --- Prescription requests ---
  - method: GET
    path: "/prescription-requests/{id}"
    description: "Get an intake request"
    roles: [PharmacyOps, Pharmacist]
    code: 200
    input: []
    output: PrescriptionRequest
    side_effects: []

  - method: GET
    path: "/prescriptions/{id}/intake-requests"
    description: "List the intake requests of a prescription"
    roles: [PharmacyOps, Pharmacist]
    code: 200
    input: ["limit?", "offset?"]
    output: PrescriptionRequest[]
    side_effects: []

  - method: POST
    path: "/prescription-requests/{id}/review"
    description: "Move an intake request into review"
    roles: [Pharmacist]
    code: 200
    input: []
    output: PrescriptionRequest
    side_effects: ["Transition SUBMITTED -> UNDER_REVIEW per the PrescriptionRequest state machine"]

  - method: POST
    path: "/prescription-requests/{id}/acceptance"
    description: "Accept an intake request; the prescription becomes ACTIVE and its first refill authorisation is created"
    roles: [Pharmacist]
    code: 200
    input: []
    output: PrescriptionRequest
    side_effects:
      - "Transition UNDER_REVIEW -> ACCEPTED per the PrescriptionRequest state machine"
      - "Sets the prescription to ACTIVE"
      - "Creates the first Claim with claim_seq = 1 and status = PENDING"

  - method: POST
    path: "/prescription-requests/{id}/rejection"
    description: "Reject an intake request and restore the drug's claim-active reserved quantity exactly"
    roles: [Pharmacist]
    code: 200
    input: [reason_code]
    output: PrescriptionRequest
    side_effects:
      - "Transition UNDER_REVIEW -> REJECTED per the PrescriptionRequest state machine"
      - "Sets the prescription to REJECTED with the supplied reason code"
      - "Decrements the drug's claim-active reserved total by the request's consumed_quantity and resets consumed_quantity to 0"

  # --- Orders ---
  - method: POST
    path: "/orders"
    description: "Create an order against an accepted intake request, selecting the sourcing price row"
    roles: [PharmacyOps]
    code: 201
    input: [prescription_id, request_id, pharmacy_id, quantity, source_price_id, "sub_source_price_id?"]
    output: Order
    side_effects:
      - "status = CREATED"
      - "Copies ship_state_code from the prescription"
      - "Snapshots retail_reference_price_cents and insured_reference_price_cents from the drug"
      - "Computes acquisition_cost_cents, markup_cents, pharmacy_fee_cents, shipping_fee_cents and patient_price_cents via calculation order_price"
      - "Creates the order's PriceComparison with state = FRESH, status = UNSUBSTANTIATED and stale_deadline_at = created_at + 30 days"
      - "If the drug's state is FORMULARY, submits re-derivation of Drug.sourcing_status, Drug.supply_units and Drug.demand_units_30d"

  - method: GET
    path: "/orders/{id}"
    description: "Get an order"
    roles: [PharmacyOps, Pharmacist, Patient]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders, filterable by prescription, pharmacy, request and destination state"
    roles: [PharmacyOps, Pharmacist, Patient]
    code: 200
    input: ["prescription_id?", "request_id?", "pharmacy_id?", "ship_state_code?", "status?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/prescriptions/{id}/orders"
    description: "List the orders of a prescription"
    roles: [PharmacyOps, Pharmacist, Patient]
    code: 200
    input: ["limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/prescription-requests/{id}/orders"
    description: "List the orders consuming an intake request's capacity"
    roles: [PharmacyOps, Pharmacist]
    code: 200
    input: ["limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/pharmacies/{id}/orders"
    description: "List the orders allocated to a pharmacy"
    roles: [PharmacyOps, Pharmacist]
    code: 200
    input: ["limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/manufacturer-drug-prices/{id}/orders"
    description: "List the orders sourcing from a price row, either as primary or as fallback source"
    roles: [PharmacyOps, Pharmacist]
    code: 200
    input: ["limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/payment"
    description: "Pay an order and finalise its price decomposition"
    roles: [PharmacyOps]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Transition CREATED -> PAID per the Order state machine"
      - "Recomputes acquisition_cost_cents, markup_cents, pharmacy_fee_cents, shipping_fee_cents and patient_price_cents via calculation order_price"
      - "Sets paid_at = logical clock"

  - method: POST
    path: "/orders/{id}/fulfillment"
    description: "Create the order's shipment once the shipment interval has elapsed"
    roles: [PharmacyOps]
    code: 200
    input: [expected_order_version]
    output: Order
    side_effects:
      - "Transition PAID -> FULFILLING per the Order state machine"
      - "Creates a Shipment with status = PENDING"
      - "Increments the referenced PrescriptionRequest.consumed_quantity"
      - "Increments Order.version by 1"

  - method: POST
    path: "/orders/{id}/shipping"
    description: "Dispatch the order's shipment after the state licensure, shipping-enablement and controlled-substance gates pass"
    roles: [PharmacyOps]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Transition FULFILLING -> SHIPPED per the Order state machine"
      - "Sets the Shipment to DISPATCHED with dispatch_at = logical clock"
      - "Drives every PENDING or AUTHORIZED Claim of the prescription to SHIPPED with reserved_quantity = 0"
      - "Recomputes Drug.supply_units"

  - method: POST
    path: "/orders/{id}/delivery"
    description: "Confirm delivery and advance the prescription's refill counter"
    roles: [PharmacyOps]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Transition SHIPPED -> DELIVERED per the Order state machine"
      - "Sets the Shipment to DELIVERED with delivery_at = logical clock"
      - "Increments Prescription.refills_consumed by 1 and recomputes the drug's demand_units_30d"

  - method: POST
    path: "/orders/{id}/cancellation"
    description: "Cancel an order and restore the capacity it consumed"
    roles: [PharmacyOps]
    code: 200
    input: [reason_code]
    output: Order
    side_effects:
      - "Transition to CANCELED per the Order state machine, with a different restoration set per source state"

  - method: GET
    path: "/orders/{id}/comparisons"
    description: "List the price comparisons of an order, ordered by created_at ascending"
    roles: [PharmacyOps, Pharmacist, Patient]
    code: 200
    input: []
    output: PriceComparison[]
    side_effects: []

  - method: GET
    path: "/orders/{id}/comparison"
    description: "Serve the comparison message against typical retail and benefit-covered prices, provided it is substantiated"
    roles: [PharmacyOps, Pharmacist, Patient]
    code: 200
    input: ["limit?", "offset?"]
    output: "{ order_id: string, comparison_id: string, order_status: string, patient_price_cents: integer, typical_retail_price_cents: integer, benefit_covered_price_cents: integer, retail_delta_cents: integer, benefit_delta_cents: integer, state: string, status: string, substantiated: boolean, substantiation_digest: string }"
    side_effects: ["Recomputes the comparison's state and digest via calculation comparison_lifecycle before returning"]

  - method: POST
    path: "/orders/{id}/comparisons/{comparison_id}/refresh"
    description: "Re-derive a comparison's figures and digest after a drug substitution"
    roles: [PharmacyOps]
    code: 200
    input: []
    output: PriceComparison
    side_effects: ["Transition to FRESH per the PriceComparison state machine when an ENABLED unexpired substantiation exists"]

  - method: POST
    path: "/orders/{id}/substantiation-enablement"
    description: "Enable a substantiation for an order's comparison"
    roles: [PharmacyOps]
    code: 200
    input: [substantiation_id, expected_order_version]
    output: PriceSubstantiation
    side_effects:
      - "Transition PENDING -> ENABLED per the PriceSubstantiation state machine"
      - "Sets the order's comparison substantiated, digest and status"
      - "Increments Order.version by 1"
      - "Increments PriceComparison.version by 1"

  - method: POST
    path: "/orders/{id}/substantiation-disablement"
    description: "Disable a substantiation, which drives the comparison to STALE"
    roles: [PharmacyOps]
    code: 200
    input: [substantiation_id]
    output: PriceSubstantiation
    side_effects:
      - "Transition ENABLED -> DISABLED per the PriceSubstantiation state machine"
      - "Recomputes the comparison's state via calculation comparison_lifecycle"
      - "Increments PriceSubstantiation.version by 1"

  - method: GET
    path: "/orders/{id}/substantiation-records"
    description: "List the substantiation records attached to an order"
    roles: [PharmacyOps, Pharmacist]
    code: 200
    input: []
    output: PriceSubstantiation[]
    side_effects: []

  # --- Refill authorisations ---
  - method: POST
    path: "/claims/{id}/refill-authorizations"
    description: "Authorise, and thereby reserve supply for, the next refill of a prescription"
    roles: [Pharmacist]
    code: 200
    input: [quantity]
    output: Claim
    side_effects:
      - "Transition PENDING -> AUTHORIZED per the Claim state machine, OR PENDING -> DENIED with the applicable reason code when the refill budget, the drug's sourcing status or the drug's supply blocks it"
      - "Sets claim.reserved_quantity to the reserved quantity on the AUTHORIZED branch and recomputes Drug.supply_units"

  - method: GET
    path: "/claims/{id}"
    description: "Get a refill authorisation"
    roles: [PharmacyOps, Pharmacist, Patient]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claim-summaries/{id}"
    description: "Get a refill authorisation summary, including the shipment and denial reason"
    roles: [PharmacyOps, Pharmacist, Patient]
    code: 200
    input: []
    output: "{ claim_id: string, claim_seq: integer, status: string, reserved_quantity: integer, denial_reason_code: string, denied_at: datetime }"
    side_effects: []

  - method: GET
    path: "/prescriptions/{id}/claims"
    description: "List the refill authorisations of a prescription, ordered by claim_seq ascending"
    roles: [PharmacyOps, Pharmacist, Patient]
    code: 200
    input: ["limit?", "offset?"]
    output: Claim[]
    side_effects: []

  # --- Shipments ---
  - method: GET
    path: "/orders/{id}/shipments"
    description: "List the shipments of an order, ordered by shipment_seq ascending"
    roles: [PharmacyOps, Pharmacist, Patient]
    code: 200
    input: []
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/prescription-requests/{id}/shipments"
    description: "List the shipments consuming an intake request's packaged capacity"
    roles: [PharmacyOps, Pharmacist]
    code: 200
    input: []
    output: Shipment[]
    side_effects: []

  - method: GET
    path: "/shipment-summaries/{id}"
    description: "Get a shipment summary, including its dispatch and delivery instants"
    roles: [PharmacyOps, Pharmacist, Patient]
    code: 200
    input: []
    output: "{ shipment_id: string, order_id: string, shipment_seq: integer, status: string, dispatch_at: datetime, delivery_at: datetime }"
    side_effects: []

  # --- Substantiation intake ---
  - method: POST
    path: "/price-substantiations"
    description: "Register a substantiation record for an order's comparison"
    roles: [PharmacyOps]
    code: 201
    input: [order_id, source_kind, source_reference, observed_at, valid_until]
    output: PriceSubstantiation
    side_effects: ["status = PENDING"]

  - method: GET
    path: "/price-substantiations/{id}"
    description: "Get a substantiation record"
    roles: [PharmacyOps, Pharmacist]
    code: 200
    input: []
    output: PriceSubstantiation
    side_effects: []

  - method: GET
    path: "/price-substantiations"
    description: "List substantiation records, filterable by order, ordered by created_at ascending"
    roles: [PharmacyOps, Pharmacist]
    code: 200
    input: ["order_id?", "limit?", "offset?"]
    output: PriceSubstantiation[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_ROLE_HEADER
    http: 401
    condition: "X-User-Role header absent or not one of the declared roles"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "The caller's role is not listed in the endpoint's roles"
  - id: ERR_PATIENT_OWNERSHIP_REQUIRED
    http: 403
    condition: "A Patient caller addressed a prescription, order, claim or comparison that is not theirs"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "An id in the path does not resolve, validated left to right"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The resource is not in a state that admits the requested transition, including every transition attempted from a terminal state"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_order_version does not match the order's current version on POST /orders/{order_id}/fulfillment or POST /orders/{order_id}/substantiation-enablement"
  - id: ERR_CONTROLLED_SUBSTANCE_EXCLUDED
    http: 422
    condition: "The drug is a controlled substance, which is excluded from ordering and shipping"
  - id: ERR_NOT_LICENSED_IN_STATE
    http: 422
    condition: "No ACTIVE licence covers the order's ship_state_code for the selected pharmacy, or the pharmacy's shipping_enabled is false"
  - id: ERR_REQUEST_NOT_ACCEPTED
    http: 422
    condition: "The referenced intake request is not ACCEPTED"
  - id: ERR_REQUEST_CAPACITY_EXCEEDED
    http: 422
    condition: "The order's quantity exceeds the request's remaining packaged capacity"
  - id: ERR_SHIP_INTERVAL_NOT_ELAPSED
    http: 422
    condition: "The logical clock is earlier than order.paid_at + drug.ship_interval_days"
  - id: ERR_LICENSE_CONFLICT
    http: 409
    condition: "A second licence is filed for a (pharmacy_id, state_code) pair that already carries an ACTIVE licence, or the incoming expiry is not strictly after the incumbent's"
  - id: ERR_PRICE_INVARIANT_BROKEN
    http: 422
    condition: "The order's price decomposition does not satisfy patient_price_cents == acquisition_cost_cents + markup_cents + pharmacy_fee_cents + shipping_fee_cents, or any component is negative"
  - id: ERR_COMPARISON_UNSUBSTANTIATED
    http: 422
    condition: "A comparison message is requested for an order whose comparison is unsubstantiated or blocked"
  - id: ERR_SHIP_SLOT_CONFLICT
    http: 409
    condition: "The drug's carrier slot for the dispatch calendar day, including its one-day quarantine buffer, already carries the two permitted shipments"
  - id: ERR_SOURCE_PRICE_DRUG_MISMATCH
    http: 422
    condition: "The order's source_price_id references a price row for a different drug than the prescription's"
  - id: ERR_PRESCRIBER_ORDER_REQUIRED
    http: 422
    condition: "Intake requires a prescription carrying a prescriber reference and a drug reference, and an ACTIVE prescriber"
  - id: ERR_SUBSTITUTION_REASON_REQUIRED
    http: 422
    condition: "POST /prescriptions/{prescription_id}/substitution was sent without a reason_code"
  - id: ERR_CANCELLATION_REASON_REQUIRED
    http: 422
    condition: "POST /orders/{order_id}/cancellation was sent without a reason_code"
  - id: ERR_SUBSTANTIATION_ORDER_MISMATCH
    http: 422
    condition: "The substantiation_id does not belong to the order in the path"
  - id: ERR_SUBSTANTIATION_EXPIRED
    http: 422
    condition: "valid_until is not strictly after the logical clock at enablement"
  - id: ERR_FORMULARY_GATE_FAILED
    http: 422
    condition: "Formulary admission refused because the demand-versus-supply gate did not pass"
  - id: ERR_SOURCING_UNAVAILABLE
    http: 422
    condition: "The drug's sourcing_status is not SOURCED, so no refill may be authorised"
  - id: ERR_SUPPLY_SHORTFALL
    http: 422
    condition: "The drug's supply_units are below the requested refill quantity"
  - id: ERR_DRUG_DELISTED
    http: 422
    condition: "The drug is DELISTED, so a refill authorisation or an order may not proceed"
  - id: ERR_INVALID_AMOUNT
    http: 400
    condition: "unit_cost_cents < 1, available_units < 0, packaged_quantity < 1, quantity < 1, or total_refills_authorized < 0"

