scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 - dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: eligibility_variant_divergence_probe_based_vs_team_judgment
        grounds:
          - calculations.regression_recoupment_analysis
          - entities.EligibilityDetermination.fields.analysis_variant
          - entities.EligibilityDetermination.fields.criteria_met_count
          - entities.EligibilityDetermination.fields.eligibility_recommendation
          - entities.EligibilityDetermination.fields.max_recoupment_days
          - state_machines.EligibilityDetermination.DRAFT_to_PARENT_REVIEW
        distinguishing_aspect: |
          This dual variant lives in the ELIGIBILITY SCREENING domain on
          EligibilityDetermination: byte-identical skill_probes arrays produce
          criteria_met_count 2 / ELIGIBLE under PROBE_BASED and criteria_met_count 1
          / INELIGIBLE under TEAM_JUDGMENT, because PROBE_BASED tests observed
          recoupment with >= while TEAM_JUDGMENT tests a projected
          ceil(regression_pct / 1.2) with strict >.
        test_recipe:
          setup:
            - "Two students exist, each with one DRAFT EligibilityDetermination carrying the SAME two skill probes: READING_FLUENCY 80 -> 60 with 20 observed recoupment days and 4 trials, and MATH_COMPUTATION 100 -> 74 with 22 observed recoupment days and 4 trials."
            - "The first determination's analysis_variant is PROBE_BASED, the second's is TEAM_JUDGMENT. Nothing else differs."
            - "Logical clock at 2027-06-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, transportation_required: true, home_school_code: "MS-014" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { s1_id: $.data.id }
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-002", first_name: "Ben", last_name: "Okafor", grade_band: "MS_6_8", primary_disability: "SPECIFIC_LEARNING_DISABILITY", iep_weekly_minutes_total: 250, transportation_required: false, home_school_code: "MS-014" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { s2_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [ { skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 } ] }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { d_probe_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s2_id}", school_year: "2026-2027", analysis_variant: "TEAM_JUDGMENT", skill_probes: [ { skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 } ] }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { d_team_id: $.data.id }
          trigger:
            - call: "POST /esy/eligibility-determinations/${d_probe_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/eligibility-determinations/${d_team_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
          assert:
            - "EligibilityDetermination.${d_probe_id}.max_regression_pct == 26.0"
            - "EligibilityDetermination.${d_probe_id}.max_recoupment_days == 22"
            - "EligibilityDetermination.${d_probe_id}.criteria_met_count == 2"
            - "EligibilityDetermination.${d_probe_id}.eligibility_recommendation == ELIGIBLE"
            - "EligibilityDetermination.${d_team_id}.max_regression_pct == 26.0"
            - "EligibilityDetermination.${d_team_id}.max_recoupment_days == 22"
            - "EligibilityDetermination.${d_team_id}.criteria_met_count == 1"
            - "EligibilityDetermination.${d_team_id}.eligibility_recommendation == INELIGIBLE"
            - "Both determinations have data_sufficiency == SUFFICIENT and status == PARENT_REVIEW"

      - name: award_variant_divergence_minute_for_minute_vs_qualitative_benefit
        grounds:
          - calculations.compensatory_award_minutes
          - entities.CompensatoryAward.fields.calculation_variant
          - entities.CompensatoryAward.fields.computed_minutes
          - entities.CompensatoryAward.fields.severity_factor
          - entities.CompensatoryAward.fields.verified_missed_log_count
          - entities.CompensatoryAward.fields.excluded_log_count
          - state_machines.CompensatoryAward.PARENT_REVIEW_to_DECLINED
        distinguishing_aspect: |
          This dual variant lives in the REMEDY ACCOUNTING domain on
          CompensatoryAward, a different entity and a different metric from the
          eligibility instance: the identical log set (85 district-fault minutes)
          yields computed_minutes 85 under MINUTE_FOR_MINUTE and 105 under
          QUALITATIVE_BENEFIT, because only the second applies severity_factor 1.25
          and then rounds the 106.25 product to the nearest 15 minutes.
        test_recipe:
          setup:
            - "Student S1 is ESY ELIGIBLE via a FINALIZED PROBE_BASED determination whose max_regression_pct is 26.0, so severity_factor resolves to 1.25."
            - "Program P1 runs 2027-06-14..2027-07-23 on MON/TUE/WED/THU with blackouts 2027-06-30 and 2027-07-05: 22 instructional days across 6 ISO weeks."
            - "S1 has one ACTIVE commitment in P1 with three VERIFIED logs: MISSED_DISTRICT 60/0, PARTIAL 45/20, MISSED_PARENT 60/0. Only the first two are compensable, so 85 district-fault minutes."
            - "A first MINUTE_FOR_MINUTE award is opened, proposed and DECLINED by the parent, so it is terminal and does not block a second award on the same (student, program)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, transportation_required: true, home_school_code: "MS-014" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { s1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [ { skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 } ] }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { d1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/finalize"
              payload: {}
              as: SpedDirector
              as_user_id: "dir-001"
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              as_user_id: "pc-001"
              captures: { p1_id: $.data.id }
            - call: "POST /esy/fund-allocations"
              payload: { program_id: "${p1_id}", fund_source: "IDEA_611_FEDERAL", budget_code: "611-ESY-01", authorized_amount_cents: 25000000 }
              as: SpedDirector
              as_user_id: "dir-001"
              captures: { f1_id: $.data.id }
            - call: "POST /esy/providers"
              payload: { full_name: "Nina Torres", role_type: "SPED_TEACHER", credential_expires_on: "2028-06-30", rate_cents_per_minute: 150, max_weekly_minutes: 1200 }
              as: ProgramCoordinator
              as_user_id: "pc-001"
              captures: { pr1_id: $.data.id }
            - call: "POST /esy/service-commitments"
              payload: { program_id: "${p1_id}", student_id: "${s1_id}", service_type: "SPECIALIZED_INSTRUCTION", iep_weekly_minutes: 250, staffing_ratio: "ONE_TO_THREE" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /esy/provider-assignments"
              payload: { commitment_id: "${c1_id}", provider_id: "${pr1_id}", weekday: "MON", start_time: "09:00", end_time: "10:00", effective_from: "2027-06-14", effective_to: "2027-07-23", covered_weekly_minutes: 229, expected_commitment_version: "${c1_v}" }
              as: ProgramCoordinator
              as_user_id: "pc-001"
              captures: { a1_id: $.data.id }
            - call: "POST /esy/programs/${p1_id}/status"
              payload: { target_status: "STAFFING_LOCKED" }
              as: ProgramCoordinator
              as_user_id: "pc-001"
            - call: "POST /esy/programs/${p1_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramCoordinator
              as_user_id: "pc-001"
            - call: "POST /esy/service-commitments/${c1_id}/status"
              payload: { target_status: "ACTIVE" }
              as: ProgramCoordinator
              as_user_id: "pc-001"
            - call: "POST /esy/service-logs"
              payload: { commitment_id: "${c1_id}", service_date: "2027-06-14", outcome: "MISSED_DISTRICT", minutes_scheduled: 60, minutes_delivered: 0, miss_reason_code: "STAFF_ABSENCE" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/service-logs"
              payload: { commitment_id: "${c1_id}", service_date: "2027-06-15", outcome: "PARTIAL", minutes_scheduled: 45, minutes_delivered: 20, miss_reason_code: "TRANSPORT_FAILURE" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/service-logs"
              payload: { commitment_id: "${c1_id}", service_date: "2027-06-16", outcome: "MISSED_PARENT", minutes_scheduled: 60, minutes_delivered: 0, miss_reason_code: "PARENT_CANCELLED" }
              as: CaseManager
              as_user_id: "cm-001"
          trigger:
            - call: "POST /esy/compensatory-awards"
              payload: { student_id: "${s1_id}", source_program_id: "${p1_id}", calculation_variant: "MINUTE_FOR_MINUTE" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { aw_mfm_id: $.data.id }
            - call: "POST /esy/compensatory-awards/${aw_mfm_id}/propose"
              payload: { proposed_minutes: 85 }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/compensatory-awards/${aw_mfm_id}/parent-response"
              payload: { response: "DECLINE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/compensatory-awards"
              payload: { student_id: "${s1_id}", source_program_id: "${p1_id}", calculation_variant: "QUALITATIVE_BENEFIT" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { aw_qb_id: $.data.id }
          assert:
            - "CompensatoryAward.${aw_mfm_id}.computed_minutes == 85"
            - "CompensatoryAward.${aw_qb_id}.computed_minutes == 105"
            - "CompensatoryAward.${aw_mfm_id}.severity_factor == 1.25 and CompensatoryAward.${aw_qb_id}.severity_factor == 1.25"
            - "CompensatoryAward.${aw_mfm_id}.verified_missed_log_count == 2 and CompensatoryAward.${aw_mfm_id}.excluded_log_count == 1"
            - "CompensatoryAward.${aw_qb_id}.verified_missed_log_count == 2 and CompensatoryAward.${aw_qb_id}.excluded_log_count == 1"
            - "CompensatoryAward.${aw_mfm_id}.negotiation_status == DECLINED and CompensatoryAward.${aw_mfm_id}.agreed_minutes == null"
            - "CompensatoryAward.${aw_qb_id}.negotiation_status == DRAFT and CompensatoryAward.${aw_qb_id}.delivery_status == NOT_STARTED"

  # =====================================================================
  # Rule 2 - combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: minute_plan_round_per_week_then_sum_beats_sum_then_round
        grounds:
          - calculations.esy_service_minutes_plan
          - entities.ServiceCommitment.fields.planned_total_minutes
          - entities.ServiceCommitment.fields.weekly_minutes_committed
          - entities.ServiceCommitment.fields.daily_minutes
          - entities.EsyProgram.fields.instructional_week_count
        distinguishing_aspect: |
          MODE (b) - nested rounding where the order is outcome-changing: the pinned
          round-per-week-then-sum order over the per-week day counts [4,4,3,3,4,4]
          yields planned_total_minutes 1376, while the forbidden sum-then-round
          order yields 1375; the one-minute gap is the falsifiable signature.
        test_recipe:
          setup:
            - "Student S1 is ESY ELIGIBLE via a FINALIZED PROBE_BASED determination."
            - "Program P1 runs 2027-06-14 (MON) .. 2027-07-23 (FRI) on MON/TUE/WED/THU with blackout dates 2027-06-30 (WED) and 2027-07-05 (MON), giving 22 instructional days over 6 ISO weeks with per-week day counts 4,4,3,3,4,4 and daily_minutes_cap 90."
            - "Program P1 is still in PLANNING so commitments may be created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, transportation_required: true, home_school_code: "MS-014" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { s1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [ { skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 } ] }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { d1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/finalize"
              payload: {}
              as: SpedDirector
              as_user_id: "dir-001"
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              as_user_id: "pc-001"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /esy/service-commitments"
              payload: { program_id: "${p1_id}", student_id: "${s1_id}", service_type: "SPECIALIZED_INSTRUCTION", iep_weekly_minutes: 250, staffing_ratio: "ONE_TO_THREE" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { c1_id: $.data.id }
          assert:
            - "EsyProgram.${p1_id}.instructional_days_count == 22"
            - "EsyProgram.${p1_id}.instructional_week_count == 6"
            - "ServiceCommitment.${c1_id}.planned_total_minutes == 1376"
            - "ServiceCommitment.${c1_id}.planned_total_minutes != 1375"
            - "ServiceCommitment.${c1_id}.weekly_minutes_committed == 229"
            - "ServiceCommitment.${c1_id}.daily_minutes == 57"
            - "ServiceCommitment.${c1_id}.status == PLANNED"

      - name: fund_waterfall_selection_pinned_on_base_cost_then_indirect_overage
        grounds:
          - calculations.fund_charge_waterfall
          - validations[priority=34]
          - validations[priority=35]
          - errors[ERR_FUND_INDIRECT_OVERAGE]
          - entities.FundAllocation.fields.available_cents
          - entities.ProviderAssignment.fields.total_charge_cents
        distinguishing_aspect: |
          MODE (c) - circular-looking dependency with a pinned evaluation order: the
          bucket is chosen on base_cost_cents 206100 alone (STEP 2), but the amount
          actually posted depends on the chosen bucket's indirect rate (STEP 3), so
          the total 222588 exceeds the very allocation that base cost qualified;
          the pinned order forbids re-running STEP 2, so the request fails with
          ERR_FUND_INDIRECT_OVERAGE even though the LOCAL_GENERAL allocation holds
          10000000 cents of headroom.
        test_recipe:
          setup:
            - "Student S1 is ESY ELIGIBLE; program P1 has the 6-ISO-week / 22-day calendar; commitment C1 is PLANNED with weekly_minutes_committed 229."
            - "P1 has two OPEN allocations: IDEA_611_FEDERAL 611-ESY-01 authorized 210000 cents (created first) and LOCAL_GENERAL LOC-ESY-01 authorized 10000000 cents."
            - "Provider PR1 is an ACTIVE SPED_TEACHER at 150 cents per minute with max_weekly_minutes 1200 and credential valid to 2028-06-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, transportation_required: true, home_school_code: "MS-014" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { s1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [ { skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 } ] }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { d1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/finalize"
              payload: {}
              as: SpedDirector
              as_user_id: "dir-001"
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              as_user_id: "pc-001"
              captures: { p1_id: $.data.id }
            - call: "POST /esy/fund-allocations"
              payload: { program_id: "${p1_id}", fund_source: "IDEA_611_FEDERAL", budget_code: "611-ESY-01", authorized_amount_cents: 210000 }
              as: SpedDirector
              as_user_id: "dir-001"
              captures: { f_fed_id: $.data.id }
            - call: "POST /esy/fund-allocations"
              payload: { program_id: "${p1_id}", fund_source: "LOCAL_GENERAL", budget_code: "LOC-ESY-01", authorized_amount_cents: 10000000 }
              as: SpedDirector
              as_user_id: "dir-001"
              captures: { f_loc_id: $.data.id }
            - call: "POST /esy/providers"
              payload: { full_name: "Nina Torres", role_type: "SPED_TEACHER", credential_expires_on: "2028-06-30", rate_cents_per_minute: 150, max_weekly_minutes: 1200 }
              as: ProgramCoordinator
              as_user_id: "pc-001"
              captures: { pr1_id: $.data.id }
            - call: "POST /esy/service-commitments"
              payload: { program_id: "${p1_id}", student_id: "${s1_id}", service_type: "SPECIALIZED_INSTRUCTION", iep_weekly_minutes: 250, staffing_ratio: "ONE_TO_THREE" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
          trigger:
            - call: "POST /esy/provider-assignments"
              payload: { commitment_id: "${c1_id}", provider_id: "${pr1_id}", weekday: "MON", start_time: "09:00", end_time: "10:00", effective_from: "2027-06-14", effective_to: "2027-07-23", covered_weekly_minutes: 229, expected_commitment_version: "${c1_v}" }
              as: ProgramCoordinator
              as_user_id: "pc-001"
          assert:
            - "HTTP 422 with data.error_id == ERR_FUND_INDIRECT_OVERAGE"
            - "FundAllocation.${f_fed_id}.encumbered_amount_cents == 0 and FundAllocation.${f_fed_id}.available_cents == 210000"
            - "FundAllocation.${f_loc_id}.encumbered_amount_cents == 0 and FundAllocation.${f_loc_id}.available_cents == 10000000"
            - "ServiceCommitment.${c1_id}.status == PLANNED (no ProviderAssignment row was created)"
            - "GET /esy/service-commitments/${c1_id}/provider-assignments returns total_count == 0"
            - "The rejected charge would have been base_cost_cents 206100 + indirect_cost_cents 16488 == total_charge_cents 222588 against the 210000 federal allocation"

  # =====================================================================
  # Rule 3 - non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: award_parallel_dimensions_and_fulfilled_to_in_progress_cycle
        grounds:
          - state_machines.CompensatoryAward.IN_PROGRESS_to_FULFILLED
          - state_machines.CompensatoryAward.FULFILLED_to_IN_PROGRESS
          - state_machines.CompensatoryAward.AGREED_to_CLOSED
          - state_machines.MakeupSession.DELIVERED_to_VOIDED
          - entities.CompensatoryAward.fields.negotiation_status
          - entities.CompensatoryAward.fields.delivery_status
          - calculations.award_delivery_ledger
        distinguishing_aspect: |
