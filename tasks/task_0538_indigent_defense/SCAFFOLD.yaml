# =============================================================================
# PRD Benchmark Seed Tables — Public Defender & Indigent Defense Assignment
# Difficulty: Expert
# =============================================================================

scenario: |
  Public Defender & Indigent Defense Assignment: case referral & financial-eligibility
  screening, conflict check & attorney assignment, caseload weighting & capacity,
  court-event calendaring, investigator/expert request & voucher, panel-attorney
  billing, disposition & reporting, recoupment

domain_name: indigent-defense
api_prefix: ""            # flat topology: peer top-level collections (/cases, /attorneys, /vouchers, ...), no single nesting root

complexity_profile:
  primary_archetype: "Quota / allocation"          # attorneys hold finite weighted caseload capacity competed for by cases
  secondary_archetype: "Compliance / audit"        # conflict checks, segregation of duties, recoupment
  complexity_layers:
    - optimistic_concurrency          # reassignment supersede races on Case.version
    - cascading_side_effects          # dispose -> assignment close -> load recompute -> attorney status
    - dual_variant_calculation        # case_weight provisional/actual; recoupment schedule/actual
    - rate_threshold_triggers         # caseload capacity, income eligibility, budget restriction

  entity_topology: flat               # peer entities linked by FK ids; no deep URL nesting
  state_machine_shape: branching      # eligibility fork, voucher revise-loop, service branch
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties   # the screening decider may not later waive that case's recoupment
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: DefenderOffice
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Defender office / funding unit name" }
      - { name: annual_voucher_budget_cents, type: integer, source: input, description: "Total budget available for panel/service vouchers, in cents", constraints: "> 0" }
      - { name: recoupment_basis, type: enum, source: input, default: "SCHEDULE", description: "How RecoupmentOrder amounts are computed for cases in this office", constraints: "SCHEDULE | ACTUAL" }
      - { name: voucher_spent_cents, type: integer, source: computed, default: 0, description: "Read-only: sum of approved_amount_cents over this office's Vouchers in status APPROVED (VOIDED excluded)" }
      - { name: budget_status, type: enum, source: system, default: "OPEN", description: "OPEN | RESTRICTED; RESTRICTED once voucher_spent_cents > annual_voucher_budget_cents * 0.90" }

  - name: Attorney
    parent: null
    common_fields: true
    fields:
      - { name: office_id, type: string, source: input, description: "FK -> DefenderOffice.id" }
      - { name: name, type: string, source: input, description: "Attorney full name" }
      - { name: attorney_type, type: enum, source: input, description: "STAFF | PANEL", constraints: "STAFF | PANEL" }
      - { name: bar_number, type: string, source: input, description: "State bar number" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Panel billing rate per hour, in cents", constraints: ">= 0" }
      - { name: max_weighted_caseload, type: number, source: input, description: "Maximum total assigned weight this attorney may hold", constraints: "> 0" }
      - { name: current_weighted_load, type: number, source: computed, default: 0, description: "Read-only: sum of assigned_weight over this attorney's ACTIVE Assignments" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | AT_CAPACITY | SUSPENDED; AT_CAPACITY is load-derived (current_weighted_load >= max_weighted_caseload), SUSPENDED is set manually" }

  - name: Courtroom
    parent: null
    common_fields: false            # configuration resource: id + created_at only, no lifecycle
    fields:
      - { name: name, type: string, source: input, description: "Courtroom label, e.g. 'Dept 12'" }
      - { name: courthouse, type: string, source: input, description: "Courthouse building name" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: office_id, type: string, source: input, description: "FK -> DefenderOffice.id" }
      - { name: defendant_name, type: string, source: input, description: "Name of the accused defendant" }
      - { name: charge_class, type: enum, source: input, description: "Severity class driving weight and schedules", constraints: "FELONY_A | FELONY_B | MISDEMEANOR | JUVENILE | APPEAL" }
      - { name: status, type: enum, source: system, default: "REFERRED", description: "REFERRED -> SCREENED -> ASSIGNED -> DISPOSED; or REFERRED -> DENIED" }
      - { name: eligibility_status, type: enum, source: system, default: "PENDING", description: "PENDING | ELIGIBLE | PARTIAL | INELIGIBLE; set when the FinancialScreening is decided" }
      - { name: case_weight, type: number, source: computed, default: 0, description: "Read-only: PROVISIONAL base weight at assignment; recomputed to ACTUAL on adjust-weight" }
      - { name: weight_basis, type: enum, source: system, default: "PROVISIONAL", description: "PROVISIONAL | ACTUAL; ACTUAL after a weight adjustment" }
      - { name: complexity_tier, type: enum, source: system, default: "STANDARD", description: "STANDARD | COMPLEX | CAPITAL; set by adjust-weight" }
      - { name: co_defendant_count, type: integer, source: system, default: 0, description: "Number of co-defendants; set by adjust-weight" }
      - { name: assigned_attorney_id, type: string, source: computed, description: "Attorney id of this case's current ACTIVE Assignment, or null. Derived convenience field, NOT a stored foreign key." }
      - { name: disposition_type, type: enum, source: system, description: "DISMISSED | PLEA | ACQUITTAL | CONVICTION; set at dispose", default: null }
      - { name: disposition_date, type: datetime, source: system, description: "Logical-clock UTC timestamp captured at dispose", default: null }

  - name: FinancialScreening
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: household_income_cents, type: integer, source: input, description: "Annual household income, in cents", constraints: ">= 0" }
      - { name: household_size, type: integer, source: input, description: "Number of persons in household", constraints: ">= 1" }
      - { name: asset_value_cents, type: integer, source: input, description: "Countable household assets, in cents", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "SUBMITTED", description: "SUBMITTED | DECIDED" }
      - { name: result, type: enum, source: computed, default: "PENDING", description: "PENDING | ELIGIBLE | PARTIAL | INELIGIBLE; computed at decide" }
      - { name: contribution_amount_cents, type: integer, source: computed, default: 0, description: "Read-only: partial-eligibility contribution obligation, in cents; 0 unless result == PARTIAL" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the ScreeningOfficer who decided this screening (segregation-of-duties audit)", default: null }

  - name: ConflictCheck
    parent: null
    common_fields: false            # immutable audit artifact: id + created_at only
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: attorney_id, type: string, source: input, description: "FK -> Attorney.id" }
      - { name: co_defendant_names, type: array, source: input, default: [], description: "Adverse-party / co-defendant names to screen against the attorney's other ACTIVE cases" }
      - { name: result, type: enum, source: computed, description: "CLEAR | CONFLICT; CONFLICT if any co_defendant_name equals the defendant_name of another Case with an ACTIVE Assignment to this attorney, else CLEAR", constraints: "CLEAR | CONFLICT" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: attorney_id, type: string, source: input, description: "FK -> Attorney.id" }
      - { name: assigned_weight, type: number, source: computed, description: "Snapshot of Case.case_weight at the moment this Assignment became ACTIVE" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | REASSIGNED | CLOSED" }

  - name: CourtEvent
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: attorney_id, type: string, source: computed, description: "FK -> Attorney.id; copied from the case's assigned_attorney_id at scheduling time" }
      - { name: courtroom_id, type: string, source: input, description: "FK -> Courtroom.id" }
      - { name: event_type, type: enum, source: input, description: "ARRAIGNMENT | MOTION_HEARING | PRETRIAL | TRIAL | SENTENCING", constraints: "ARRAIGNMENT | MOTION_HEARING | PRETRIAL | TRIAL | SENTENCING" }
      - { name: scheduled_start, type: datetime, source: input, description: "Event start (ISO 8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Event end (ISO 8601 UTC); must be strictly after scheduled_start" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | VACATED" }

  - name: ServiceRequest
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: service_type, type: enum, source: input, description: "INVESTIGATOR | EXPERT_PSYCH | EXPERT_FORENSIC", constraints: "INVESTIGATOR | EXPERT_PSYCH | EXPERT_FORENSIC" }
      - { name: estimated_hours, type: number, source: input, description: "Estimated hours of service", constraints: "> 0" }
      - { name: estimated_rate_cents, type: integer, source: input, description: "Provider hourly rate, in cents", constraints: ">= 0" }
      - { name: authorized_amount_cents, type: integer, source: computed, default: 0, description: "Read-only: authorized ceiling set at approve" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | APPROVED | COMPLETED" }

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: input, description: "FK -> Case.id" }
      - { name: attorney_id, type: string, source: input, description: "FK -> Attorney.id (the panel attorney submitting the claim)" }
      - { name: service_request_id, type: string, source: input, default: null, description: "FK -> ServiceRequest.id; present only when voucher_type == SERVICE" }
      - { name: voucher_type, type: enum, source: input, description: "PANEL_FEE | SERVICE", constraints: "PANEL_FEE | SERVICE" }
      - { name: claimed_hours, type: number, source: input, description: "Hours claimed on this voucher", constraints: "> 0" }
      - { name: approved_amount_cents, type: integer, source: computed, default: 0, description: "Read-only: amount approved for payment, set at approve" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | SUBMITTED | APPROVED | REJECTED | VOIDED" }

  - name: RecoupmentOrder
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; the disposed case this order recoups against" }
      - { name: basis, type: enum, source: system, description: "SCHEDULE | ACTUAL; copied from DefenderOffice.recoupment_basis at creation" }
      - { name: assessed_amount_cents, type: integer, source: computed, description: "Read-only: amount ordered for recoupment, computed at creation" }
      - { name: collected_amount_cents, type: integer, source: computed, default: 0, description: "Read-only: running total collected" }
      - { name: status, type: enum, source: system, default: "ASSESSED", description: "ASSESSED | PARTIALLY_COLLECTED | SATISFIED | WAIVED" }
      - { name: waived_by_user_id, type: string, source: system, description: "X-User-ID of the SupervisingAttorney who waived the order", default: null }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Case
    initial_state: REFERRED
    terminal_states: [DISPOSED, DENIED]
    transitions:
      - from: REFERRED
        to: SCREENED
        trigger: "POST /financial-screenings/{screeningId}/decide (result ELIGIBLE or PARTIAL)"
        actor: ScreeningOfficer
        preconditions:
          - "A FinancialScreening exists for this case in status SUBMITTED"
          - "Computed result is ELIGIBLE or PARTIAL"
        side_effects:
          - "Case.eligibility_status <- computed result (ELIGIBLE | PARTIAL)"
          - "FinancialScreening.contribution_amount_cents set (>0 only when PARTIAL)"
          - "FinancialScreening.status -> DECIDED, decided_by_user_id <- X-User-ID"
        note: "Branching fork: eligible/partial branch continues to counsel; ineligible branch terminates (see next row) with a disjoint side-effect set."
      - from: REFERRED
        to: DENIED
        trigger: "POST /financial-screenings/{screeningId}/decide (result INELIGIBLE)"
        actor: ScreeningOfficer
        preconditions:
          - "A FinancialScreening exists for this case in status SUBMITTED"
          - "Computed result is INELIGIBLE"
        side_effects:
          - "Case.eligibility_status <- INELIGIBLE"
          - "FinancialScreening.status -> DECIDED, decided_by_user_id <- X-User-ID; NO counsel path opens, NO contribution set"
      - from: SCREENED
        to: ASSIGNED
        trigger: "POST /assignments"
        actor: AssignmentCoordinator
        preconditions:
          - "Case.status == SCREENED (ERR_CASE_NOT_SCREENED)"
          - "Attorney.status != SUSPENDED (ERR_ATTORNEY_NOT_ACTIVE)"
          - "A ConflictCheck with case_id==Case.id AND attorney_id==Attorney.id AND result==CLEAR exists (ERR_CONFLICT_NOT_CLEARED)"
          - "Attorney.current_weighted_load + provisional case_weight <= Attorney.max_weighted_caseload (ERR_CASELOAD_CAPACITY_EXCEEDED)"
        side_effects:
          - "Create Assignment{status:ACTIVE, assigned_weight: provisional case_weight}"
          - "Case.case_weight <- BASE_WEIGHT[charge_class] (PROVISIONAL), weight_basis PROVISIONAL, assigned_attorney_id <- Attorney.id"
          - "Attorney.current_weighted_load += assigned_weight; if load >= max_weighted_caseload then Attorney.status -> AT_CAPACITY"
      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /cases/{caseId}/reassign"
        actor: AssignmentCoordinator
        preconditions:
          - "Case.status == ASSIGNED (ERR_CASE_NOT_ASSIGNED)"
          - "expected_case_version == Case.version (ERR_STALE_CASE_VERSION)"
          - "new Attorney.status != SUSPENDED (ERR_ATTORNEY_NOT_ACTIVE)"
          - "A CLEAR ConflictCheck exists for (Case, new Attorney) (ERR_CONFLICT_NOT_CLEARED)"
          - "new Attorney.current_weighted_load + Case.case_weight <= new Attorney.max_weighted_caseload (ERR_CASELOAD_CAPACITY_EXCEEDED)"
        side_effects:
          - "Prior ACTIVE Assignment -> REASSIGNED; prior Attorney.current_weighted_load -= assigned_weight (if prior attorney was AT_CAPACITY and load now < max, prior Attorney.status -> ACTIVE)"
          - "Create new Assignment{status:ACTIVE, assigned_weight: Case.case_weight}; new Attorney.current_weighted_load += assigned_weight; if >= max then new Attorney.status -> AT_CAPACITY"
          - "Case.assigned_attorney_id <- new Attorney.id; increments Case.version by 1"
        note: "OCC CREATE-with-supersede: the new Assignment legitimately supersedes the prior one (see concurrency_rules.reassign-supersede-stale-case)."
      - from: ASSIGNED
        to: DISPOSED
        trigger: "POST /cases/{caseId}/dispose"
        actor: AssignmentCoordinator
        preconditions:
          - "Case.status == ASSIGNED (ERR_CASE_NOT_ASSIGNED)"
        side_effects:
          - "Case.status -> DISPOSED, disposition_type <- input, disposition_date <- logical clock"
          - "CASCADE link1: this case's ACTIVE Assignment -> CLOSED (caused by the dispose)"
          - "CASCADE link2: because that Assignment closed, Attorney.current_weighted_load -= assigned_weight (caused by the closure)"
          - "CASCADE link3: because the load dropped, if Attorney.status == AT_CAPACITY and current_weighted_load < max_weighted_caseload then Attorney.status -> ACTIVE"
          - "If the case's decided FinancialScreening.result == PARTIAL: create RecoupmentOrder{status:ASSESSED, basis: office.recoupment_basis, assessed_amount_cents: recoupment_assessed}"

  - entity: FinancialScreening
    initial_state: SUBMITTED
    terminal_states: [DECIDED]
    transitions:
      - from: SUBMITTED
        to: DECIDED
        trigger: "POST /financial-screenings/{screeningId}/decide"
        actor: ScreeningOfficer
        preconditions:
          - "FinancialScreening.status == SUBMITTED (ERR_SCREENING_ALREADY_DECIDED)"
        side_effects:
          - "result, contribution_amount_cents computed; decided_by_user_id <- X-User-ID; parent Case transitions (see Case machine)"

  - entity: Assignment
    initial_state: ACTIVE
    terminal_states: [REASSIGNED, CLOSED]
    transitions:
      - from: ACTIVE
        to: REASSIGNED
        trigger: "system (cascade from POST /cases/{caseId}/reassign)"
        actor: system
        preconditions: []
        side_effects:
          - "prior Attorney.current_weighted_load -= assigned_weight"
      - from: ACTIVE
        to: CLOSED
        trigger: "system (cascade from POST /cases/{caseId}/dispose)"
        actor: system
        preconditions: []
        side_effects:
          - "Attorney.current_weighted_load -= assigned_weight; attorney AT_CAPACITY->ACTIVE if applicable"

  - entity: ConflictCheck
    initial_state: RESOLVED
    terminal_states: [RESOLVED]
    transitions:
      - from: RESOLVED
        to: RESOLVED
        trigger: "POST /conflict-checks (result computed at creation; append-only, no further transitions)"
        actor: AssignmentCoordinator
        preconditions: []
        side_effects: []
        note: "ConflictCheck is immutable; result CLEAR/CONFLICT is fixed at creation."

  - entity: ServiceRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /service-requests/{serviceRequestId}/approve"
        actor: SupervisingAttorney
        preconditions:
          - "ServiceRequest.status == REQUESTED (ERR_SERVICE_REQUEST_NOT_APPROVED used for wrong-state complete; here wrong state also rejects)"
          - "parent Case.status == ASSIGNED (ERR_CASE_NOT_ASSIGNED)"
          - "office.budget_status != RESTRICTED (ERR_BUDGET_RESTRICTED)"
        side_effects:
          - "authorized_amount_cents <- service_authorized_amount"
      - from: APPROVED
        to: COMPLETED
        trigger: "POST /service-requests/{serviceRequestId}/complete"
        actor: AssignmentCoordinator
        preconditions:
          - "ServiceRequest.status == APPROVED (ERR_SERVICE_REQUEST_NOT_APPROVED)"
        side_effects: []

  - entity: CourtEvent
    initial_state: SCHEDULED
    terminal_states: [VACATED]
    transitions:
      - from: SCHEDULED
        to: VACATED
        trigger: "POST /court-events/{courtEventId}/vacate"
        actor: AssignmentCoordinator
        preconditions:
          - "CourtEvent.status == SCHEDULED (ERR_COURT_EVENT_NOT_SCHEDULED)"
        side_effects:
          - "The interval is released; a later CourtEvent may reuse the attorney/courtroom slot (VACATED events are excluded from overlap scans)"

  - entity: Voucher
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /vouchers/{voucherId}/submit"
        actor: Attorney
        preconditions:
          - "Voucher.status == DRAFT (ERR_VOUCHER_INVALID_STATE)"
          - "If voucher_type == PANEL_FEE: parent Case.status == DISPOSED (ERR_CASE_NOT_DISPOSED)"
          - "If voucher_type == SERVICE: linked ServiceRequest.status == COMPLETED (ERR_SERVICE_REQUEST_NOT_COMPLETED)"
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /vouchers/{voucherId}/approve"
        actor: SupervisingAttorney
        preconditions:
          - "Voucher.status == SUBMITTED (ERR_VOUCHER_INVALID_STATE)"
        side_effects:
          - "approved_amount_cents <- voucher_approved_amount"
          - "CASCADE link1: DefenderOffice.voucher_spent_cents += approved_amount_cents (caused by the approval)"
          - "CASCADE link2: because voucher_spent_cents rose, if voucher_spent_cents > annual_voucher_budget_cents*0.90 then DefenderOffice.budget_status -> RESTRICTED"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /vouchers/{voucherId}/reject"
        actor: SupervisingAttorney
        preconditions:
          - "Voucher.status == SUBMITTED (ERR_VOUCHER_INVALID_STATE)"
        side_effects: []
      - from: REJECTED
        to: DRAFT
        trigger: "POST /vouchers/{voucherId}/revise"
        actor: Attorney
        preconditions:
          - "Voucher.status == REJECTED (ERR_VOUCHER_INVALID_STATE)"
        side_effects:
          - "claimed_hours may be re-edited on next submit; approved_amount_cents reset to 0"
        note: "Revise loop: REJECTED -> DRAFT -> SUBMITTED -> ... (cyclic)."
      - from: APPROVED
        to: VOIDED
        trigger: "POST /vouchers/{voucherId}/void"
        actor: SupervisingAttorney
        preconditions:
          - "Voucher.status == APPROVED (ERR_VOUCHER_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: DefenderOffice.voucher_spent_cents -= approved_amount_cents; if voucher_spent_cents <= annual_voucher_budget_cents*0.90 then budget_status -> OPEN"

  - entity: RecoupmentOrder
    initial_state: ASSESSED
    terminal_states: [SATISFIED, WAIVED]
    transitions:
      - from: ASSESSED
        to: PARTIALLY_COLLECTED
        trigger: "POST /recoupment-orders/{recoupmentOrderId}/collect (collected < assessed)"
        actor: SupervisingAttorney
        preconditions:
          - "RecoupmentOrder.status in {ASSESSED, PARTIALLY_COLLECTED} (ERR_RECOUPMENT_NOT_COLLECTIBLE)"
          - "amount_cents > 0"
        side_effects:
          - "collected_amount_cents += amount_cents"
      - from: PARTIALLY_COLLECTED
        to: SATISFIED
        trigger: "POST /recoupment-orders/{recoupmentOrderId}/collect (collected >= assessed)"
        actor: SupervisingAttorney
        preconditions:
          - "RecoupmentOrder.status in {ASSESSED, PARTIALLY_COLLECTED}"
        side_effects:
          - "collected_amount_cents += amount_cents; if collected_amount_cents >= assessed_amount_cents then status -> SATISFIED"
      - from: ASSESSED
        to: SATISFIED
        trigger: "POST /recoupment-orders/{recoupmentOrderId}/collect (single payment >= assessed)"
        actor: SupervisingAttorney
        preconditions:
          - "RecoupmentOrder.status == ASSESSED"
        side_effects:
          - "collected_amount_cents += amount_cents; status -> SATISFIED"
      - from: ASSESSED
        to: WAIVED
        trigger: "POST /recoupment-orders/{recoupmentOrderId}/waive"
        actor: SupervisingAttorney
        preconditions:
          - "RecoupmentOrder.status in {ASSESSED, PARTIALLY_COLLECTED} (ERR_RECOUPMENT_NOT_COLLECTIBLE)"
          - "X-User-ID != the case's FinancialScreening.decided_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "status -> WAIVED, waived_by_user_id <- X-User-ID"
      - from: PARTIALLY_COLLECTED
        to: WAIVED
        trigger: "POST /recoupment-orders/{recoupmentOrderId}/waive"
        actor: SupervisingAttorney
        preconditions:
          - "same as ASSESSED -> WAIVED"
        side_effects:
          - "status -> WAIVED, waived_by_user_id <- X-User-ID"

  - entity: DefenderOffice
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: RESTRICTED
        trigger: "system (cascade from POST /vouchers/{voucherId}/approve)"
        actor: system
        preconditions:
          - "voucher_spent_cents > annual_voucher_budget_cents * 0.90"
        side_effects:
          - "New ServiceRequest approvals blocked with ERR_BUDGET_RESTRICTED while RESTRICTED"
      - from: RESTRICTED
        to: OPEN
        trigger: "system (cascade from POST /vouchers/{voucherId}/void)"
        actor: system
        preconditions:
          - "voucher_spent_cents <= annual_voucher_budget_cents * 0.90"
        side_effects: []

  - entity: Attorney
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /attorneys/{attorneyId}/suspend"
        actor: SupervisingAttorney
        preconditions:
          - "Attorney.status != SUSPENDED (ERR_ATTORNEY_NOT_ACTIVE)"
        side_effects: []
      - from: AT_CAPACITY
        to: SUSPENDED
        trigger: "POST /attorneys/{attorneyId}/suspend"
        actor: SupervisingAttorney
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /attorneys/{attorneyId}/reactivate"
        actor: SupervisingAttorney
        preconditions:
          - "Attorney.status == SUSPENDED"
        side_effects:
          - "If current_weighted_load >= max_weighted_caseload, resolves to AT_CAPACITY instead of ACTIVE"
      - from: ACTIVE
        to: AT_CAPACITY
        trigger: "system (assignment or adjust-weight brings load to >= max_weighted_caseload)"
        actor: system
        preconditions: []
        side_effects: []
      - from: AT_CAPACITY
        to: ACTIVE
        trigger: "system (reassign/dispose drops load below max_weighted_caseload)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reassign-supersede-stale-case
    parent_entity: Case
    write_endpoint: "POST /cases/{caseId}/reassign"
    occ_field: "expected_case_version"
    description: |
      Reassigning a Case to a new attorney creates a new ACTIVE Assignment that
      supersedes the prior one. If the Case.version has advanced since the client
      last observed it (because a reassignment already succeeded and legitimately
      superseded the prior assignment), the current writer's view is stale and the
      request is rejected on the version mismatch.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_determination
    trigger: "POST /financial-screenings/{screeningId}/decide"
    algorithm: threshold
    formula: |
      fpl = FPL_BASE_CENTS + (household_size - 1) * FPL_INCREMENT_CENTS
      if asset_value_cents > ASSET_INELIGIBLE_CAP_CENTS:
          result = INELIGIBLE
      elif household_income_cents <= fpl * ELIGIBLE_MULT:          # <= is inclusive
          result = ELIGIBLE
      elif household_income_cents <= fpl * PARTIAL_MULT:
          result = PARTIAL
      else:
          result = INELIGIBLE
    input_set: "The single FinancialScreening being decided"
    constants:
      FPL_BASE_CENTS: 1500000
      FPL_INCREMENT_CENTS: 500000
      ELIGIBLE_MULT: 1.25
      PARTIAL_MULT: 2.00
      ASSET_INELIGIBLE_CAP_CENTS: 2000000
    precision: "integer cents; comparison boundary is inclusive at the ELIGIBLE_MULT line (<=)"
    note: "Boundary metric: household_income_cents exactly at fpl*1.25 -> ELIGIBLE; one cent above -> PARTIAL."

  - name: financial_contribution
    trigger: "POST /financial-screenings/{screeningId}/decide when result == PARTIAL"
    algorithm: tiered_pricing
    formula: |
      fpl = FPL_BASE_CENTS + (household_size - 1) * FPL_INCREMENT_CENTS
      income_excess = household_income_cents - round(fpl * ELIGIBLE_MULT)
      asset_excess  = max(0, asset_value_cents - ASSET_CONTRIB_FLOOR_CENTS)
      component_income = round_half_up(income_excess * INCOME_RATE)   # round THIS component first
      component_asset  = round_half_up(asset_excess  * ASSET_RATE)    # round THIS component first
      contribution_amount_cents = component_income + component_asset  # THEN sum
    input_set: "The single PARTIAL FinancialScreening"
    constants:
      FPL_BASE_CENTS: 1500000
      FPL_INCREMENT_CENTS: 500000
      ELIGIBLE_MULT: 1.25
      ASSET_CONTRIB_FLOOR_CENTS: 500000
      INCOME_RATE: 0.10
      ASSET_RATE: 0.05
    precision: "round_half_up each component to whole cents BEFORE summing (per-component rounding, pinned order)"
    note: "Rounding order is load-bearing: round-each-then-sum differs from sum-then-round by up to one cent."

  - name: case_weight
    trigger: "POST /assignments (PROVISIONAL) and POST /cases/{caseId}/adjust-weight (ACTUAL)"
    algorithm: weighted_scoring
    formula: |
      PROVISIONAL (at assignment): case_weight = BASE_WEIGHT[charge_class]
      ACTUAL (at adjust-weight):
        case_weight = round_half_up(BASE_WEIGHT[charge_class] * COMPLEXITY_MULT[complexity_tier]
                                    + CO_DEF_INCREMENT * co_defendant_count, 2)
    input_set: "The single Case being assigned or adjusted"
    constants:
      BASE_WEIGHT: { FELONY_A: 4.0, FELONY_B: 2.5, MISDEMEANOR: 1.0, JUVENILE: 1.5, APPEAL: 3.0 }
      COMPLEXITY_MULT: { STANDARD: 1.0, COMPLEX: 1.5, CAPITAL: 2.0 }
      CO_DEF_INCREMENT: 0.25
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "at assignment (POST /assignments)"
        difference: "uses BASE_WEIGHT only; weight_basis = PROVISIONAL"
      - name: actual
        when: "at weight adjustment (POST /cases/{caseId}/adjust-weight)"
        difference: "applies complexity multiplier and co-defendant increment; weight_basis = ACTUAL; can differ from provisional for identical charge_class"

  - name: caseload_capacity_check
    trigger: "POST /assignments and POST /cases/{caseId}/reassign and POST /cases/{caseId}/adjust-weight"
    algorithm: threshold
    formula: |
      allowed if (attorney.current_weighted_load_excluding_this_case + candidate_weight) <= attorney.max_weighted_caseload
      else reject ERR_CASELOAD_CAPACITY_EXCEEDED
    input_set: "Target attorney's ACTIVE Assignments"
    constants: {}
    precision: "weight comparison inclusive at max (<=)"
    note: "Boundary metric: load exactly at max is allowed; strictly above is rejected."

  - name: voucher_approved_amount
    trigger: "POST /vouchers/{voucherId}/approve"
    algorithm: waterfall_allocation
    formula: |
      gross = round_half_up(claimed_hours * rate_cents)
      if voucher_type == PANEL_FEE:
          rate_cents = attorney.hourly_rate_cents
          prior = sum(approved_amount_cents of this case's PANEL_FEE Vouchers already in status APPROVED)
          remaining_cap = max(0, CASE_FEE_CAP[charge_class] - prior)
          approved_amount_cents = min(gross, remaining_cap)
      else:  # SERVICE
          rate_cents = linked ServiceRequest.estimated_rate_cents
          prior = sum(approved_amount_cents of Vouchers already APPROVED against this ServiceRequest)
          remaining_cap = max(0, ServiceRequest.authorized_amount_cents - prior)
          approved_amount_cents = min(gross, remaining_cap)
    input_set: "The voucher, its case/service-request, and prior APPROVED vouchers of the same channel"
    constants:
      CASE_FEE_CAP: { FELONY_A: 750000, FELONY_B: 500000, MISDEMEANOR: 200000, JUVENILE: 300000, APPEAL: 600000 }
    precision: "integer cents; round_half_up on the hours*rate product only"
    variants:
      - name: panel_fee
        when: "voucher_type == PANEL_FEE"
        difference: "capped by CASE_FEE_CAP[charge_class] net of prior panel approvals"
      - name: service
        when: "voucher_type == SERVICE"
        difference: "capped by ServiceRequest.authorized_amount_cents net of prior service approvals"

  - name: service_authorized_amount
    trigger: "POST /service-requests/{serviceRequestId}/approve"
    algorithm: threshold
    formula: |
      authorized_amount_cents = min(round_half_up(estimated_hours * estimated_rate_cents), SERVICE_CAP[service_type])
    input_set: "The single ServiceRequest being approved"
    constants:
      SERVICE_CAP: { INVESTIGATOR: 250000, EXPERT_PSYCH: 500000, EXPERT_FORENSIC: 750000 }
    precision: "integer cents, round_half_up"

  - name: recoupment_assessed
    trigger: "RecoupmentOrder auto-creation during POST /cases/{caseId}/dispose (screening result PARTIAL)"
    algorithm: aggregation
    formula: |
      if office.recoupment_basis == SCHEDULE:
          assessed_amount_cents = RECOUP_SCHEDULE[charge_class]
      else:  # ACTUAL
          assessed_amount_cents = FinancialScreening.contribution_amount_cents
    input_set: "The disposed case, its office config, and its decided FinancialScreening"
    constants:
      RECOUP_SCHEDULE: { FELONY_A: 50000, FELONY_B: 40000, MISDEMEANOR: 15000, JUVENILE: 10000, APPEAL: 35000 }
    precision: "integer cents"
    variants:
      - name: schedule
        when: "office.recoupment_basis == SCHEDULE"
        difference: "flat statutory amount keyed on charge_class"
      - name: actual
        when: "office.recoupment_basis == ACTUAL"
        difference: "means-based: uses the screening's contribution_amount_cents; differs from schedule for identical case data"

  - name: office_voucher_spent
    trigger: "POST /vouchers/{voucherId}/approve (+), POST /vouchers/{voucherId}/void (-)"
    algorithm: aggregation
    formula: |
      voucher_spent_cents == sum(approved_amount_cents for Vouchers of this office in status APPROVED)
      approve: voucher_spent_cents += approved_amount_cents
      void:    voucher_spent_cents -= approved_amount_cents
    input_set: "All APPROVED (non-VOIDED) Vouchers of the office"
    constants: {}
    precision: "integer cents; conserved: the running field always equals the sum over APPROVED vouchers"

  - name: attorney_weighted_load
    trigger: "assignment create (+), reassign/dispose close (-), adjust-weight (delta)"
    algorithm: aggregation
    formula: |
      current_weighted_load == sum(assigned_weight for this attorney's Assignments in status ACTIVE)
    input_set: "The attorney's ACTIVE Assignments"
    constants: {}
    precision: "2 decimals; conserved: the running field always equals the sum over ACTIVE assignments"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_USER_CONTEXT
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint; and when acting as Attorney on a Voucher, Voucher.attorney_id == X-User-ID"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every id in the path and every FK in the body exists (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path/body ids"

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric constraints (hours>0, income>=0, size>=1), scheduled_end strictly after scheduled_start"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the operation (case SCREENED for assign; case ASSIGNED for reassign/dispose/court-event/service-request; case DISPOSED for panel voucher submit; voucher/service-request/court-event/recoupment source state)"
    error_id: "ERR_CASE_NOT_SCREENED | ERR_CASE_NOT_ASSIGNED | ERR_CASE_NOT_DISPOSED | ERR_VOUCHER_INVALID_STATE | ERR_SERVICE_REQUEST_NOT_APPROVED | ERR_SERVICE_REQUEST_NOT_COMPLETED | ERR_COURT_EVENT_NOT_SCHEDULED | ERR_RECOUPMENT_NOT_COLLECTIBLE | ERR_SCREENING_ALREADY_DECIDED"
    http_status: 409
    applies_to: "state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-entity state gate: for POST /court-events the case must be ASSIGNED so an assigned attorney exists; for POST /assignments the target attorney must not be SUSPENDED"
    error_id: "ERR_CASE_NOT_ASSIGNED | ERR_ATTORNEY_NOT_ACTIVE"
    http_status: 409
    applies_to: "POST /court-events, POST /assignments, POST /cases/{caseId}/reassign"

  - priority: 7
    category: business_safety
    check: "A ConflictCheck with result==CLEAR exists for (case, attorney) before assignment/reassignment"
    error_id: ERR_CONFLICT_NOT_CLEARED
    http_status: 409
    applies_to: "POST /assignments, POST /cases/{caseId}/reassign"

  - priority: 8
    category: business_constraint
    check: "One FinancialScreening per case (uniqueness)"
    error_id: ERR_SCREENING_ALREADY_EXISTS
    http_status: 409
    applies_to: "POST /financial-screenings"

  - priority: 9
    category: business_temporal
    check: "Court-event scheduling: scheduled_start >= current logical clock (not in the past)"
    error_id: ERR_EVENT_IN_PAST
    http_status: 409
    applies_to: "POST /court-events"

  - priority: 10
    category: business_temporal
    check: "Attorney calendar: new event must be >= TRAVEL_BUFFER (30 min) edge-to-edge from every other SCHEDULED event of the same attorney (half-open intervals + buffer)"
    error_id: ERR_ATTORNEY_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /court-events"

  - priority: 11
    category: business_temporal
    check: "Courtroom calendar: new event must not overlap any other SCHEDULED event in the same courtroom (half-open intervals, no buffer; back-to-back at exact boundary allowed)"
    error_id: ERR_COURTROOM_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /court-events"

  - priority: 12
    category: business_constraint
    check: "Segregation of duties: the SupervisingAttorney waiving a RecoupmentOrder (X-User-ID) must differ from the FinancialScreening.decided_by_user_id of that case"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /recoupment-orders/{recoupmentOrderId}/waive"

  - priority: 13
    category: business_fiscal
    check: "Office budget posture: while DefenderOffice.budget_status == RESTRICTED, new ServiceRequest approvals are blocked"
    error_id: ERR_BUDGET_RESTRICTED
    http_status: 402
    applies_to: "POST /service-requests/{serviceRequestId}/approve"

  - priority: 14
    category: business_fiscal
    check: "Caseload capacity: target attorney's ACTIVE load + candidate weight must be <= max_weighted_caseload"
    error_id: ERR_CASELOAD_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /assignments, POST /cases/{caseId}/reassign, POST /cases/{caseId}/adjust-weight"

# =============================================================================
# 1.5 API Endpoint Table
