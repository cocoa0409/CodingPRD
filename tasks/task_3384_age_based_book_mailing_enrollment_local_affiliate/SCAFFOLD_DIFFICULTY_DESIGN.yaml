            - "AffiliateInvoice.${inv_o_id}.local_share_cents == 342  (672 - 330)"
            - "the AGGREGATE variant would give state 331 / local 341 (round_half_up(672 x 0.4925) = 331); the issued invoice MUST NOT carry those values"

