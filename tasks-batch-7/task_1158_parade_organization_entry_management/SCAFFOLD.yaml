scenario: |
  1158. Parade Organization & Entry Management (parade organizing committee): parade route & permit with agency coordination, entry application review & category assignment, lineup order & staging area assignment, float safety inspection & vehicle requirements, judging criteria & award presentation, marshal/volunteer assignment along route, emergency lane & dispersal plan, sponsor recognition & announcer scripts

domain_name: parade-organization
api_prefix: ""

complexity_profile:
  primary_archetype: posture_driven_gating   # ParadeEvent.posture (derived from PermitApplication + DispersalPlan + endorsements) gates all child operations
  secondary_archetype: temporal_windowing    # staging-area windows (closed intervals + buffer) vs marshal shifts (half-open intervals)
  complexity_layers:
    - optimistic_concurrency                 # OCC on ParadeEvent.version (lineup publish) and PermitApplication.version (endorsement create)
    - cascading_side_effects                 # permit revoke -> posture FROZEN -> lineup pull -> staging/script release; inspection fail -> float -> entry -> lineup
    - dual_variant_calculation               # judging provisional-vs-final; permit fee provisional-vs-final
    - derived_field_reconciliation           # posture, reserved_slots, allocated_seconds, fee_cents recomputes
  entity_topology: graph                     # flat collections with cross-aggregate FKs (script items -> sponsors AND entries; lineup -> entries AND staging areas AND parade)
  state_machine_shape: cyclic                # revision loop on EntryApplication, reopen loop on JudgingScoreSheet, revise loop on DispersalPlan, refile loop on PermitApplication
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties          # re-inspection must use a different inspector; judge submits, committee finalizes; committee requests, agency grants
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ParadeEvent
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Public name of the parade edition" }
      - { name: parade_date, type: datetime, source: input, description: "Scheduled parade start instant (ISO8601 UTC)" }
      - { name: entry_deadline, type: datetime, source: input, description: "Last instant at which EntryApplications may be created" }
      - { name: status, type: enum, source: system, description: "DRAFT | PERMIT_PENDING | PERMIT_GRANTED | LOCKED | LINEUP_PUBLISHED | COMPLETED | CANCELLED", default: DRAFT }
      - { name: posture, type: enum, source: computed, description: "RESTRICTED | OPERATIONAL | FROZEN. FROZEN iff parade CANCELLED or latest PermitApplication status in {DENIED, REVOKED}; else OPERATIONAL iff permit GRANTED and a DispersalPlan is APPROVED and status in {PERMIT_GRANTED, LOCKED, LINEUP_PUBLISHED}; else RESTRICTED" }
      - { name: approved_entry_count, type: integer, source: computed, description: "Count of EntryApplication with parade_id = this and status == APPROVED" }
      - { name: sponsor_seconds_allocated, type: integer, source: computed, description: "Sum of duration_seconds over AnnouncerScriptItem with parade_id = this, item_type == SPONSOR_READ, status in {APPROVED, LOCKED}" }
      - { name: script_finalized, type: boolean, source: system, description: "Set true by POST /parades/{id}/finalize-script once sponsor minimums verified", default: false }

  - name: RouteSegment
    parent: ParadeEvent
    common_fields: true
    fields:
      - { name: parade_id, type: string, source: system, description: "FK -> ParadeEvent.id" }
      - { name: order_index, type: integer, source: input, description: "Position of segment along route; unique per parade" }
      - { name: name, type: string, source: input, description: "Segment street name" }
      - { name: length_meters, type: number, source: input, description: "Segment length in meters, > 0" }
      - { name: emergency_lane_width_m, type: number, source: input, description: "Reserved emergency lane width in meters, must be >= 3.0" }
      - { name: segment_window_start, type: datetime, source: input, description: "Planned instant parade head enters segment" }
      - { name: segment_window_end, type: datetime, source: input, description: "Planned instant parade tail clears segment; must be > segment_window_start" }

  - name: PermitApplication
    parent: ParadeEvent
    common_fields: true
    fields:
      - { name: parade_id, type: string, source: system, description: "FK -> ParadeEvent.id; at most one permit per parade" }
      - { name: status, type: enum, source: system, description: "DRAFT | AGENCY_REVIEW | GRANTED | DENIED | REVOKED", default: DRAFT }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Flat estimate at creation: 75000 + 5000 * required_agency_count (calculation permit_filing_fee, provisional variant)" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Per-agency table fee computed at submit; null until status leaves DRAFT (calculation permit_filing_fee, final variant)", constraints: "null while status == DRAFT" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submit; null while DRAFT", constraints: "null while status == DRAFT" }
      - { name: required_agency_count, type: integer, source: computed, description: "Always 4: POLICE, FIRE, TRANSIT, SANITATION" }
      - { name: endorsed_count, type: integer, source: computed, description: "Count of AgencyEndorsement with permit_id = this and status == ENDORSED" }

  - name: AgencyEndorsement
    parent: PermitApplication
    common_fields: true
    fields:
      - { name: permit_id, type: string, source: system, description: "FK -> PermitApplication.id" }
      - { name: agency_type, type: enum, source: input, description: "POLICE | FIRE | TRANSIT | SANITATION; at most one endorsement with status in {PENDING, ENDORSED} per (permit, agency_type)" }
      - { name: status, type: enum, source: system, description: "PENDING | ENDORSED | REJECTED", default: PENDING }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of endorse/reject; null while PENDING", constraints: "null while PENDING" }
      - { name: permit_version, type: integer, source: computed, description: "PermitApplication.version immediately after this endorsement's creation (OCC read-back)" }

  - name: EntryApplication
    parent: ParadeEvent
    common_fields: true
    fields:
      - { name: parade_id, type: string, source: system, description: "FK -> ParadeEvent.id" }
      - { name: applicant_user_id, type: string, source: system, description: "Opaque Entrant id copied from X-User-ID at creation; ownership checks compare against it" }
      - { name: org_name, type: string, source: input, description: "Marching organization name" }
      - { name: requested_category, type: enum, source: input, description: "FLOAT | BAND | WALKING_GROUP | VEHICLE | EQUESTRIAN" }
      - { name: assigned_category, type: enum, source: system, description: "Committee-assigned category set at approve; FLOAT | BAND | WALKING_GROUP | VEHICLE | EQUESTRIAN; null until APPROVED", constraints: "null until approved" }
      - { name: estimated_participants, type: integer, source: input, description: "Expected marcher count; must be >= 1" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | REVISION_REQUESTED | APPROVED | SUSPENDED | REJECTED | WITHDRAWN", default: SUBMITTED }
      - { name: revision_count, type: integer, source: computed, description: "Number of times entry entered REVISION_REQUESTED", default: 0 }
      - { name: fee_cents, type: integer, source: computed, description: "calculation entry_fee; category basis = assigned_category when set, else requested_category; recomputed at create, approve, resubmit" }
      - { name: fee_paid, type: boolean, source: system, description: "Set true by POST /entries/{id}/pay-fee", default: false }
      - { name: provisional_score, type: number, source: computed, description: "calculation judging_score provisional variant; null until at least one sheet SUBMITTED", constraints: "null until a sheet is submitted" }
      - { name: final_score, type: number, source: computed, description: "calculation judging_score final variant over FINALIZED sheets; null until at least one sheet FINALIZED", constraints: "null until a sheet is finalized" }

  - name: Float
    parent: EntryApplication
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: system, description: "FK -> EntryApplication.id" }
      - { name: length_m, type: number, source: input, description: "Overall length in meters, > 0" }
      - { name: width_m, type: number, source: input, description: "Overall width in meters, > 0" }
      - { name: height_m, type: number, source: input, description: "Overall height in meters, > 0" }
      - { name: weight_kg, type: number, source: input, description: "Gross weight in kg, > 0" }
      - { name: vehicle_class, type: enum, source: input, description: "SELF_PROPELLED | TOWED | PUSHED" }
      - { name: fuel_type, type: enum, source: input, description: "GASOLINE | DIESEL | ELECTRIC | NONE" }
      - { name: compliance_status, type: enum, source: system, description: "PENDING_INSPECTION | CERTIFIED | FAILED", default: PENDING_INSPECTION }

  - name: SafetyInspection
    parent: Float
    common_fields: true
    fields:
      - { name: float_id, type: string, source: system, description: "FK -> Float.id" }
      - { name: inspector_user_id, type: string, source: system, description: "Opaque SafetyInspector id copied from X-User-ID at scheduling" }
      - { name: scheduled_at, type: datetime, source: input, description: "Planned inspection instant (ISO8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED | CANCELLED", default: SCHEDULED }
      - { name: checklist_score, type: integer, source: input, description: "0..100 recorded at pass/fail decision; pass requires >= 70, fail requires < 70" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of pass/fail; null while SCHEDULED", constraints: "null while SCHEDULED" }

  - name: StagingArea
    parent: ParadeEvent
    common_fields: true
    fields:
      - { name: parade_id, type: string, source: system, description: "FK -> ParadeEvent.id" }
      - { name: name, type: string, source: input, description: "Staging lot name" }
      - { name: capacity, type: integer, source: input, description: "Maximum simultaneous active lineup assignments; must be >= 1" }
      - { name: open_time, type: datetime, source: input, description: "Lot opens (ISO8601 UTC)" }
      - { name: close_time, type: datetime, source: input, description: "Lot closes; must be > open_time" }
      - { name: reserved_slots, type: integer, source: computed, description: "Count of LineupAssignment with staging_area_id = this and status in {CONFIRMED, CHECKED_IN}", default: 0 }

  - name: LineupAssignment
    parent: ParadeEvent
    common_fields: true
    fields:
      - { name: parade_id, type: string, source: system, description: "FK -> ParadeEvent.id" }
      - { name: entry_id, type: string, source: system, description: "FK -> EntryApplication.id" }
      - { name: staging_area_id, type: string, source: system, description: "FK -> StagingArea.id" }
      - { name: position_number, type: integer, source: input, description: "Order in the parade; unique per parade among assignments with status in {TENTATIVE, CONFIRMED, CHECKED_IN}" }
      - { name: arrive_at, type: datetime, source: input, description: "Staging arrival instant; must be >= staging area open_time" }
      - { name: depart_at, type: datetime, source: input, description: "Staging departure instant; must be > arrive_at and <= staging area close_time" }
      - { name: status, type: enum, source: system, description: "TENTATIVE | CONFIRMED | CHECKED_IN | RELEASED | PULLED | NO_SHOW", default: TENTATIVE }

  - name: MarshalAssignment
    parent: ParadeEvent
    common_fields: true
    fields:
      - { name: parade_id, type: string, source: system, description: "FK -> ParadeEvent.id" }
      - { name: route_segment_id, type: string, source: system, description: "FK -> RouteSegment.id" }
      - { name: marshal_user_id, type: string, source: input, description: "Opaque Marshal id being assigned" }
      - { name: shift_start, type: datetime, source: input, description: "Coverage window start (half-open)" }
      - { name: shift_end, type: datetime, source: input, description: "Coverage window end (half-open); must be > shift_start" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | CONFIRMED | COMPLETED | NO_SHOW", default: ASSIGNED }

  - name: JudgingScoreSheet
    parent: EntryApplication
    common_fields: true
    fields:
      - { name: entry_id, type: string, source: system, description: "FK -> EntryApplication.id; at most one sheet per (entry_id, judge_user_id)" }
      - { name: judge_user_id, type: string, source: system, description: "Opaque Judge id copied from X-User-ID at creation" }
      - { name: creativity, type: integer, source: input, description: "0..25 criterion score" }
      - { name: craftsmanship, type: integer, source: input, description: "0..25 criterion score" }
      - { name: theme, type: integer, source: input, description: "0..25 criterion score" }
      - { name: crowd_appeal, type: integer, source: input, description: "0..25 criterion score" }
      - { name: sheet_total, type: integer, source: computed, description: "creativity + craftsmanship + theme + crowd_appeal (0..100)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | FINALIZED", default: DRAFT }

  - name: Award
    parent: ParadeEvent
    common_fields: true
    fields:
      - { name: parade_id, type: string, source: system, description: "FK -> ParadeEvent.id" }
      - { name: award_category, type: enum, source: input, description: "BEST_FLOAT | BEST_BAND | BEST_WALKING | GRAND_PRIZE" }
      - { name: eligible_entry_category, type: enum, source: input, description: "FLOAT | BAND | WALKING_GROUP | VEHICLE | EQUESTRIAN | ANY" }
      - { name: winner_entry_id, type: string, source: system, description: "FK -> EntryApplication.id; null until announce resolves the selector", constraints: "null until ANNOUNCED" }
      - { name: status, type: enum, source: system, description: "PENDING | ANNOUNCED | PRESENTED | CANCELLED", default: PENDING }
      - { name: announced_at, type: datetime, source: system, description: "Logical-clock instant of announce; null while PENDING", constraints: "null while PENDING" }

  - name: SponsorPackage
    parent: ParadeEvent
    common_fields: true
    fields:
      - { name: parade_id, type: string, source: system, description: "FK -> ParadeEvent.id" }
      - { name: sponsor_name, type: string, source: input, description: "Sponsor organization name" }
      - { name: tier, type: enum, source: input, description: "GOLD | SILVER | BRONZE" }
      - { name: contribution_cents, type: integer, source: input, description: "Pledged contribution in cents, > 0" }
      - { name: status, type: enum, source: system, description: "PLEDGED | ACTIVE | FULFILLED | DEFAULTED", default: PLEDGED }
      - { name: allocated_seconds, type: integer, source: computed, description: "Sum of duration_seconds over AnnouncerScriptItem with sponsor_id = this, item_type == SPONSOR_READ, status in {APPROVED, LOCKED}", default: 0 }

  - name: AnnouncerScriptItem
    parent: ParadeEvent
    common_fields: true
    fields:
      - { name: parade_id, type: string, source: system, description: "FK -> ParadeEvent.id" }
      - { name: item_type, type: enum, source: input, description: "SPONSOR_READ | ENTRY_INTRO | SAFETY_ANNOUNCEMENT | AWARD_ANNOUNCEMENT" }
      - { name: sponsor_id, type: string, source: input, description: "FK -> SponsorPackage.id; required iff item_type == SPONSOR_READ; must reference an ACTIVE sponsor of the same parade", constraints: "required when item_type == SPONSOR_READ" }
      - { name: entry_id, type: string, source: input, description: "FK -> EntryApplication.id; required iff item_type == ENTRY_INTRO; must reference an entry of the same parade", constraints: "required when item_type == ENTRY_INTRO" }
      - { name: sequence_index, type: integer, source: input, description: "Reading order within the script" }
      - { name: duration_minutes, type: number, source: input, description: "Planned read duration in minutes, > 0" }
      - { name: duration_seconds, type: integer, source: computed, description: "round_half_up(duration_minutes * 60) — per-item rounding pinned by calculation announcer_script_timing" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | LOCKED | CANCELLED", default: DRAFT }

  - name: DispersalPlan
    parent: ParadeEvent
    common_fields: true
    fields:
      - { name: parade_id, type: string, source: system, description: "FK -> ParadeEvent.id; at most one plan per parade" }
      - { name: emergency_lane_width_m, type: number, source: input, description: "Guaranteed emergency lane width in meters; must be >= 3.0 at submit" }
      - { name: dispersal_corridors, type: array, source: input, description: "Ordered list of post-parade dispersal corridor names; must be non-empty at submit" }
      - { name: evacuation_notes, type: string, source: input, description: "Free-text evacuation instructions", constraints: "optional" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED", default: DRAFT }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ParadeEvent
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PERMIT_PENDING
        trigger: "POST /parades/{id}/submit-permit"
        actor: CommitteeAdmin
        preconditions:
          - "At least one RouteSegment exists for the parade (ERR_INVALID_STATE)"
          - "At least one StagingArea exists for the parade (ERR_INVALID_STATE)"
        side_effects:
          - "ParadeEvent.version incremented by 1"
      - from: PERMIT_PENDING
        to: PERMIT_GRANTED
        trigger: "system — fired as a side effect of POST /permits/{id}/grant"
        actor: system
        preconditions:
          - "PermitApplication transitioned to GRANTED"
        side_effects:
          - "ParadeEvent.posture recomputed per posture rule"
          - "ParadeEvent.version incremented by 1"
      - from: PERMIT_GRANTED
        to: LOCKED
        trigger: "POST /parades/{id}/lock"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture == OPERATIONAL (ERR_PERMIT_NOT_GRANTED when permit not GRANTED; ERR_INVALID_STATE otherwise)"
        side_effects:
          - "ParadeEvent.version incremented by 1"
      - from: LOCKED
        to: LINEUP_PUBLISHED
        trigger: "POST /parades/{id}/publish-lineup (OCC: expected_parade_version)"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture == OPERATIONAL (ERR_EVENT_FROZEN)"
          - "At least one LineupAssignment with status in {TENTATIVE, CONFIRMED, CHECKED_IN} exists (ERR_INVALID_STATE)"
          - "expected_parade_version == current ParadeEvent.version (ERR_STALE_VERSION)"
        side_effects:
          - "Every AnnouncerScriptItem of this parade with status == APPROVED transitions to LOCKED"
          - "ParadeEvent.version incremented by 1"
      - from: LINEUP_PUBLISHED
        to: COMPLETED
        trigger: "POST /parades/{id}/complete"
        actor: CommitteeAdmin
        preconditions:
          - "Every LineupAssignment of this parade is in a terminal state {RELEASED, PULLED, NO_SHOW} (ERR_INVALID_STATE)"
        side_effects:
          - "Every SponsorPackage with status == ACTIVE transitions to FULFILLED when allocated_seconds >= TIER_MIN_SECONDS[tier], else DEFAULTED"
          - "ParadeEvent.version incremented by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /parades/{id}/cancel"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "Cascade: every EntryApplication with status in {SUBMITTED, UNDER_REVIEW, REVISION_REQUESTED, APPROVED, SUSPENDED} -> WITHDRAWN"
          - "Cascade: every LineupAssignment with status in {TENTATIVE, CONFIRMED, CHECKED_IN} -> PULLED (each pull fires its own staging/script side effects)"
          - "Cascade: every SponsorPackage with status == ACTIVE -> DEFAULTED"
          - "ParadeEvent.posture recomputed (becomes FROZEN)"
          - "ParadeEvent.version incremented by 1"
      - from: PERMIT_PENDING
        to: CANCELLED
        trigger: "POST /parades/{id}/cancel"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "Same cascade set as DRAFT -> CANCELLED"
      - from: PERMIT_GRANTED
        to: CANCELLED
        trigger: "POST /parades/{id}/cancel"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "Same cascade set as DRAFT -> CANCELLED"
      - from: LOCKED
        to: CANCELLED
        trigger: "POST /parades/{id}/cancel"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "Same cascade set as DRAFT -> CANCELLED"
      - from: LINEUP_PUBLISHED
        to: CANCELLED
        trigger: "POST /parades/{id}/cancel"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "Same cascade set as DRAFT -> CANCELLED"

  - entity: PermitApplication
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: AGENCY_REVIEW
        trigger: "POST /permits/{id}/submit"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.status == PERMIT_PENDING (ERR_INVALID_STATE)"
          - "For each agency_type in {POLICE, FIRE, TRANSIT, SANITATION}, at least one AgencyEndorsement with status == PENDING exists (ERR_INVALID_STATE)"
        side_effects:
          - "submitted_at set to current logical clock"
          - "final_fee_cents computed via permit_filing_fee final variant (per-agency table + expedite surcharge)"
          - "PermitApplication.version incremented by 1"
      - from: AGENCY_REVIEW
        to: GRANTED
        trigger: "POST /permits/{id}/grant"
        actor: AgencyReviewer
        preconditions:
          - "For each agency_type in {POLICE, FIRE, TRANSIT, SANITATION}, at least one AgencyEndorsement with status == ENDORSED exists (ERR_INVALID_STATE)"
        side_effects:
          - "ParadeEvent of this permit transitions PERMIT_PENDING -> PERMIT_GRANTED"
          - "ParadeEvent.posture recomputed"
          - "PermitApplication.version incremented by 1"
      - from: AGENCY_REVIEW
        to: DENIED
        trigger: "POST /permits/{id}/deny"
        actor: AgencyReviewer
        preconditions: []
        side_effects:
          - "ParadeEvent.posture recomputed (becomes FROZEN)"
          - "PermitApplication.version incremented by 1"
      - from: DENIED
        to: DRAFT
        trigger: "POST /permits/{id}/refile"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "final_fee_cents reset to null; submitted_at reset to null"
          - "ParadeEvent.posture recomputed (leaves FROZEN)"
          - "PermitApplication.version incremented by 1"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /permits/{id}/revoke"
        actor: AgencyReviewer
        preconditions: []
        side_effects:
          - "Hop 1: PermitApplication.status -> REVOKED"
          - "Hop 2: the permit mutation forces ParadeEvent.posture recompute; posture becomes FROZEN"
          - "Hop 3: posture becoming FROZEN pulls every LineupAssignment of the parade with status in {CONFIRMED, CHECKED_IN} -> PULLED (TENTATIVE assignments are left in place but cannot confirm while FROZEN)"
          - "Hop 4: each assignment pulled by hop 3 releases its staging slot (StagingArea.reserved_slots recomputed) and cancels every AnnouncerScriptItem with item_type == ENTRY_INTRO, entry_id == the pulled assignment's entry, status == APPROVED -> CANCELLED (SponsorPackage.allocated_seconds unaffected: only SPONSOR_READ items count)"
          - "PermitApplication.version incremented by 1"

  - entity: AgencyEndorsement
    initial_state: PENDING
    terminal_states: [ENDORSED, REJECTED]
    transitions:
      - from: PENDING
        to: ENDORSED
        trigger: "POST /endorsements/{id}/endorse"
        actor: AgencyReviewer
        preconditions: []
        side_effects:
          - "decided_at set to current logical clock"
          - "PermitApplication.endorsed_count recomputed"
      - from: PENDING
        to: REJECTED
        trigger: "POST /endorsements/{id}/reject"
        actor: AgencyReviewer
        preconditions: []
        side_effects:
          - "decided_at set to current logical clock"
          - "PermitApplication.endorsed_count recomputed"

  - entity: EntryApplication
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /entries/{id}/start-review"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "EntryApplication.version incremented by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /entries/{id}/approve"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "assigned_category set from payload"
          - "fee_cents recomputed via entry_fee using assigned_category as the category basis"
          - "ParadeEvent.approved_entry_count recomputed"
          - "EntryApplication.version incremented by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /entries/{id}/reject"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "EntryApplication.version incremented by 1"
      - from: UNDER_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /entries/{id}/request-revision"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "revision_count incremented by 1"
          - "EntryApplication.version incremented by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /entries/{id}/resubmit"
        actor: Entrant
        preconditions:
          - "X-User-ID == EntryApplication.applicant_user_id (ERR_FORBIDDEN)"
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "estimated_participants / org_name replaced when present in payload"
          - "fee_cents recomputed via entry_fee with the current category basis and current logical clock for the late-surcharge branch"
          - "EntryApplication.version incremented by 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: Entrant
        preconditions:
          - "X-User-ID == EntryApplication.applicant_user_id (ERR_FORBIDDEN)"
        side_effects:
          - "Cascade: every LineupAssignment with entry_id == this and status in {CONFIRMED, CHECKED_IN} -> PULLED (each pull fires staging-slot release and ENTRY_INTRO cancellation)"
          - "ParadeEvent.approved_entry_count recomputed"
          - "EntryApplication.version incremented by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /entries/{id}/withdraw"
        actor: Entrant
        preconditions:
          - "X-User-ID == EntryApplication.applicant_user_id (ERR_FORBIDDEN)"
        side_effects:
          - "EntryApplication.version incremented by 1"
      - from: APPROVED
        to: SUSPENDED
        trigger: "system — fired when a Float of this entry transitions to FAILED"
        actor: system
        preconditions:
          - "Float.compliance_status just became FAILED"
        side_effects:
          - "Cascade: every LineupAssignment with entry_id == this and status in {CONFIRMED, CHECKED_IN} -> PULLED (staging-slot release + ENTRY_INTRO cancellation per pull)"
          - "ParadeEvent.approved_entry_count recomputed"
          - "EntryApplication.version incremented by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "system — fired when the failed Float transitions back to CERTIFIED (compensation for APPROVED -> SUSPENDED)"
        actor: system
        preconditions:
          - "Float.compliance_status just became CERTIFIED"
        side_effects:
          - "ParadeEvent.approved_entry_count recomputed"
          - "EntryApplication.version incremented by 1"

  - entity: Float
    initial_state: PENDING_INSPECTION
    terminal_states: []
    transitions:
      - from: PENDING_INSPECTION
        to: CERTIFIED
        trigger: "system — fired when a SafetyInspection of this float transitions to PASSED"
        actor: system
        preconditions: []
        side_effects:
          - "If parent EntryApplication.status == SUSPENDED, entry transitions SUSPENDED -> APPROVED (compensation)"
          - "Float.version incremented by 1"
      - from: PENDING_INSPECTION
        to: FAILED
        trigger: "system — fired when a SafetyInspection of this float transitions to FAILED"
        actor: system
        preconditions: []
        side_effects:
          - "If parent EntryApplication.status == APPROVED, entry transitions APPROVED -> SUSPENDED (which itself pulls that entry's CONFIRMED/CHECKED_IN LineupAssignments)"
          - "Float.version incremented by 1"
      - from: CERTIFIED
        to: FAILED
        trigger: "system — fired when a SafetyInspection of this float transitions to FAILED (spot re-inspection)"
        actor: system
        preconditions: []
        side_effects:
          - "If parent EntryApplication.status == APPROVED, entry transitions APPROVED -> SUSPENDED (with its own lineup-pull cascade)"
          - "Float.version incremented by 1"
      - from: FAILED
        to: PENDING_INSPECTION
        trigger: "system — fired when a new SafetyInspection is scheduled for this float"
        actor: system
        preconditions: []
        side_effects:
          - "Float.version incremented by 1"

  - entity: SafetyInspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/pass"
        actor: SafetyInspector
        preconditions:
          - "checklist_score >= 70 (ERR_VALIDATION)"
        side_effects:
          - "decided_at set; checklist_score recorded"
          - "Float transitions to CERTIFIED (hop 1 of the certification chain)"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/fail"
        actor: SafetyInspector
        preconditions:
          - "checklist_score < 70 (ERR_VALIDATION)"
        side_effects:
          - "decided_at set; checklist_score recorded"
          - "Hop 1: Float.compliance_status -> FAILED"
          - "Hop 2: the float failure suspends the parent EntryApplication APPROVED -> SUSPENDED"
          - "Hop 3: the suspension pulls the entry's LineupAssignments with status in {CONFIRMED, CHECKED_IN} -> PULLED"
          - "Hop 4: each pull releases the staging slot (StagingArea.reserved_slots recomputed) and cancels the entry's APPROVED ENTRY_INTRO AnnouncerScriptItems -> CANCELLED"

  - entity: LineupAssignment
    initial_state: TENTATIVE
    terminal_states: [RELEASED, PULLED, NO_SHOW]
    transitions:
      - from: TENTATIVE
        to: CONFIRMED
        trigger: "POST /lineup-assignments/{id}/confirm"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN) [state, priority 5]"
          - "EntryApplication.status == APPROVED (ERR_ENTRY_NOT_APPROVED) [state, priority 5]"
          - "If the entry has any Float, every Float must have compliance_status == CERTIFIED (ERR_FLOAT_UNCERTIFIED) [business_safety, priority 6]"
          - "position_number not held by another assignment of the parade with status in {TENTATIVE, CONFIRMED, CHECKED_IN} (ERR_LINEUP_POSITION_TAKEN) [business_constraint, priority 7]"
          - "StagingArea.reserved_slots < StagingArea.capacity (ERR_STAGING_CAPACITY_FULL) [business_constraint, priority 7]"
          - "Expanded window [arrive_at - 15m, depart_at + 15m] (closed) does not intersect the expanded window of any other CONFIRMED or CHECKED_IN assignment on the same StagingArea (ERR_STAGING_WINDOW_CONFLICT) [business_temporal, priority 8]"
          - "EntryApplication.fee_paid == true (ERR_ENTRY_FEE_OUTSTANDING) [business_fiscal, priority 9]"
        side_effects:
          - "StagingArea.reserved_slots recomputed (+1)"
          - "LineupAssignment.version incremented by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /lineup-assignments/{id}/check-in"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.status == LINEUP_PUBLISHED (ERR_LINEUP_NOT_PUBLISHED)"
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
          - "arrive_at <= current logical clock <= depart_at (ERR_CHECKIN_WINDOW_NOT_OPEN)"
        side_effects:
          - "LineupAssignment.version incremented by 1"
      - from: CHECKED_IN
        to: RELEASED
        trigger: "POST /lineup-assignments/{id}/release"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "StagingArea.reserved_slots recomputed (-1)"
          - "LineupAssignment.version incremented by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /lineup-assignments/{id}/no-show"
        actor: CommitteeAdmin
        preconditions:
          - "current logical clock > depart_at (ERR_CHECKIN_WINDOW_NOT_OPEN)"
        side_effects:
          - "StagingArea.reserved_slots recomputed (-1)"
          - "Every AnnouncerScriptItem with item_type == ENTRY_INTRO, entry_id == this assignment's entry, status == APPROVED -> CANCELLED"
          - "LineupAssignment.version incremented by 1"
      - from: TENTATIVE
        to: PULLED
        trigger: "POST /lineup-assignments/{id}/pull or system cascade"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "Every AnnouncerScriptItem with item_type == ENTRY_INTRO, entry_id == this assignment's entry, status == APPROVED -> CANCELLED"
          - "LineupAssignment.version incremented by 1"
      - from: CONFIRMED
        to: PULLED
        trigger: "POST /lineup-assignments/{id}/pull or system cascade"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "StagingArea.reserved_slots recomputed (-1)"
          - "Every AnnouncerScriptItem with item_type == ENTRY_INTRO, entry_id == this assignment's entry, status == APPROVED -> CANCELLED"
          - "LineupAssignment.version incremented by 1"
      - from: CHECKED_IN
        to: PULLED
        trigger: "system cascade only (permit revoke / entry suspension / parade cancel)"
        actor: system
        preconditions: []
        side_effects:
          - "StagingArea.reserved_slots recomputed (-1)"
          - "Every AnnouncerScriptItem with item_type == ENTRY_INTRO, entry_id == this assignment's entry, status == APPROVED -> CANCELLED"
          - "LineupAssignment.version incremented by 1"

  - entity: MarshalAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, NO_SHOW]
    transitions:
      - from: ASSIGNED
        to: CONFIRMED
        trigger: "POST /marshal-assignments/{id}/confirm"
        actor: Marshal
        preconditions:
          - "X-User-ID == MarshalAssignment.marshal_user_id (ERR_FORBIDDEN)"
        side_effects:
          - "MarshalAssignment.version incremented by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /marshal-assignments/{id}/complete"
        actor: Marshal
        preconditions:
          - "X-User-ID == MarshalAssignment.marshal_user_id (ERR_FORBIDDEN)"
          - "current logical clock >= shift_end (ERR_CHECKIN_WINDOW_NOT_OPEN)"
        side_effects:
          - "MarshalAssignment.version incremented by 1"
      - from: ASSIGNED
        to: NO_SHOW
        trigger: "POST /marshal-assignments/{id}/no-show"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "MarshalAssignment.version incremented by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /marshal-assignments/{id}/no-show"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "MarshalAssignment.version incremented by 1"

  - entity: JudgingScoreSheet
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /score-sheets/{id}/submit"
        actor: Judge
        preconditions:
          - "X-User-ID == JudgingScoreSheet.judge_user_id (ERR_FORBIDDEN)"
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "EntryApplication.provisional_score recomputed (judging_score provisional variant)"
          - "JudgingScoreSheet.version incremented by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /score-sheets/{id}/reopen"
        actor: Judge
        preconditions:
          - "X-User-ID == JudgingScoreSheet.judge_user_id (ERR_FORBIDDEN)"
          - "ParadeEvent.status != COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "EntryApplication.provisional_score recomputed (sheet leaves the SUBMITTED set)"
          - "JudgingScoreSheet.version incremented by 1"
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /score-sheets/{id}/finalize"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "EntryApplication.final_score recomputed (judging_score final variant over FINALIZED sheets)"
          - "JudgingScoreSheet.version incremented by 1"

  - entity: Award
    initial_state: PENDING
    terminal_states: [PRESENTED, CANCELLED]
    transitions:
      - from: PENDING
        to: ANNOUNCED
        trigger: "POST /awards/{id}/announce"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.status == LINEUP_PUBLISHED (ERR_LINEUP_NOT_PUBLISHED) [cross-entity dependency]"
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
          - "Eligible pool non-empty (ERR_NO_ELIGIBLE_WINNER): entries of this parade with status == APPROVED, assigned_category == eligible_entry_category (or eligible_entry_category == ANY), and at least one FINALIZED JudgingScoreSheet"
        side_effects:
          - "winner_entry_id resolved by selector: rank eligible entries by final_score DESC, tie-break finalized_sheet_count DESC, then org_name ASC, then created_at ASC"
          - "announced_at set to current logical clock"
          - "Award.version incremented by 1"
      - from: ANNOUNCED
        to: PRESENTED
        trigger: "POST /awards/{id}/present"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "Award.version incremented by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /awards/{id}/cancel"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "Award.version incremented by 1"

  - entity: SponsorPackage
    initial_state: PLEDGED
    terminal_states: [FULFILLED, DEFAULTED]
    transitions:
      - from: PLEDGED
        to: ACTIVE
        trigger: "POST /sponsors/{id}/activate"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "SponsorPackage.version incremented by 1"
      - from: ACTIVE
        to: FULFILLED
        trigger: "system — fired by POST /parades/{id}/complete"
        actor: system
        preconditions:
          - "allocated_seconds >= TIER_MIN_SECONDS[tier] at completion time"
        side_effects:
          - "SponsorPackage.version incremented by 1"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system — fired by POST /parades/{id}/complete or POST /parades/{id}/cancel"
        actor: system
        preconditions:
          - "allocated_seconds < TIER_MIN_SECONDS[tier] at completion time, or parade cancelled"
        side_effects:
          - "SponsorPackage.version incremented by 1"

  - entity: AnnouncerScriptItem
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /script-items/{id}/approve"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.posture != FROZEN (ERR_EVENT_FROZEN)"
        side_effects:
          - "SponsorPackage.allocated_seconds recomputed when item_type == SPONSOR_READ"
          - "ParadeEvent.sponsor_seconds_allocated recomputed when item_type == SPONSOR_READ"
          - "AnnouncerScriptItem.version incremented by 1"
      - from: APPROVED
        to: DRAFT
        trigger: "POST /script-items/{id}/reopen"
        actor: CommitteeAdmin
        preconditions:
          - "ParadeEvent.status != LINEUP_PUBLISHED and != COMPLETED (ERR_INVALID_STATE)"
        side_effects:
          - "SponsorPackage.allocated_seconds and ParadeEvent.sponsor_seconds_allocated recomputed when item_type == SPONSOR_READ"
          - "AnnouncerScriptItem.version incremented by 1"
      - from: APPROVED
        to: LOCKED
        trigger: "system — fired by POST /parades/{id}/publish-lineup"
        actor: system
        preconditions: []
        side_effects:
          - "AnnouncerScriptItem.version incremented by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /script-items/{id}/cancel or system cascade"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "SponsorPackage.allocated_seconds and ParadeEvent.sponsor_seconds_allocated recomputed when item_type == SPONSOR_READ"
          - "AnnouncerScriptItem.version incremented by 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /script-items/{id}/cancel or system cascade"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "SponsorPackage.allocated_seconds and ParadeEvent.sponsor_seconds_allocated recomputed when item_type == SPONSOR_READ"
          - "AnnouncerScriptItem.version incremented by 1"

  - entity: DispersalPlan
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dispersal-plans/{id}/submit"
        actor: CommitteeAdmin
        preconditions:
          - "emergency_lane_width_m >= 3.0 (ERR_EMERGENCY_LANE_TOO_NARROW) [business_safety]"
          - "dispersal_corridors non-empty (ERR_VALIDATION)"
        side_effects:
          - "DispersalPlan.version incremented by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /dispersal-plans/{id}/approve"
        actor: AgencyReviewer
        preconditions: []
        side_effects:
          - "ParadeEvent.posture recomputed"
          - "DispersalPlan.version incremented by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /dispersal-plans/{id}/reject"
        actor: AgencyReviewer
        preconditions: []
        side_effects:
          - "ParadeEvent.posture recomputed"
          - "DispersalPlan.version incremented by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /dispersal-plans/{id}/revise"
        actor: CommitteeAdmin
        preconditions: []
        side_effects:
          - "DispersalPlan.version incremented by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: lineup-publish-stale-parade
    parent_entity: ParadeEvent
    write_endpoint: "POST /parades/{id}/publish-lineup"
    occ_field: "expected_parade_version"
    description: |
      Publishing the lineup against a ParadeEvent whose version has advanced
      since the client last observed it is rejected. A prior successful publish
      legitimately supersedes the previous published lineup under product
      semantics, so a second publish carrying the version observed before that
      publish is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: endorsement-create-stale-permit
    parent_entity: PermitApplication
    write_endpoint: "POST /permits/{id}/endorsements"
    occ_field: "expected_permit_version"
    description: |
      Creating an AgencyEndorsement against a PermitApplication whose version
      has advanced since the client last observed it is rejected. Each
      endorsement creation legitimately succeeds under product semantics and
      advances the permit version, so a creation carrying an earlier observed
      version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: entry_fee
    trigger: "EntryApplication creation; POST /entries/{id}/approve; POST /entries/{id}/resubmit"
    algorithm: tiered_pricing
    formula: |
      category_basis = entry.assigned_category if entry.assigned_category is not null else entry.requested_category
      subtotal_cents = BASE_CENTS[category_basis]
      p = entry.estimated_participants
      tier1 = min(p, 50);            subtotal_cents += tier1 * 300
      tier2 = min(max(p - 50, 0), 150); subtotal_cents += tier2 * 200
      tier3 = max(p - 200, 0);       subtotal_cents += tier3 * 100
      late = entry_submission_instant > (parade.entry_deadline - 7 days)
      surcharge_cents = round_half_up(0.25 * subtotal_cents) if late else 0
      fee_cents = subtotal_cents + surcharge_cents
      Evaluation order pinned: base -> tier1 -> tier2 -> tier3 -> surcharge.
      entry_submission_instant = entry.created_at at creation; current logical
      clock at resubmit. All tier rates are integer cents so no rounding occurs
      before the surcharge step.
    input_set: "The single EntryApplication being created/approved/resubmitted; parade.entry_deadline from its parent ParadeEvent"
    constants:
      BASE_FLOAT_CENTS: 50000
      BASE_BAND_CENTS: 30000
      BASE_WALKING_GROUP_CENTS: 15000
      BASE_VEHICLE_CENTS: 40000
      BASE_EQUESTRIAN_CENTS: 35000
      TIER1_LIMIT: 50
      TIER1_RATE_CENTS: 300
      TIER2_LIMIT: 150
      TIER2_RATE_CENTS: 200
      TIER3_RATE_CENTS: 100
      LATE_WINDOW_DAYS: 7
      LATE_SURCHARGE_PCT: 0.25
    precision: "integer cents; surcharge round_half_up to whole cents"

  - name: judging_score
    trigger: "POST /score-sheets/{id}/submit and /reopen recompute provisional_score; POST /score-sheets/{id}/finalize recomputes final_score"
    algorithm: aggregation
    formula: |
      sheet_total(s) = s.creativity + s.craftsmanship + s.theme + s.crowd_appeal
      PROVISIONAL variant: mean of sheet_total over the entry's sheets with
        status in {SUBMITTED, FINALIZED}; null when the set is empty.
      FINAL variant: over sheets with status == FINALIZED only; when the count
        is >= 3, drop the single highest and the single lowest sheet_total
        before averaging (trimmed mean); when the count is 1 or 2, plain mean;
        null when the set is empty.
      The two variants are both valid aggregations of the same underlying
      sheets and diverge whenever >= 3 sheets are FINALIZED with non-symmetric
      extremes.
    input_set: "JudgingScoreSheet rows of the entry, filtered by status per variant"
    constants:
      TRIM_MIN_SHEETS: 3
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "Recomputed whenever a sheet enters or leaves SUBMITTED"
        difference: "Includes SUBMITTED and FINALIZED sheets; plain mean, no trimming"
      - name: final
        when: "Recomputed whenever a sheet is FINALIZED; used by the Award winner selector"
        difference: "FINALIZED sheets only; trims one high and one low when >= 3 sheets"

  - name: permit_filing_fee
    trigger: "provisional variant at PermitApplication creation; final variant at POST /permits/{id}/submit"
    algorithm: aggregation
    formula: |
      PROVISIONAL variant (at creation):
        provisional_fee_cents = 75000 + 5000 * required_agency_count   # 4 -> 95000
      FINAL variant (at submit):
        base = AGENCY_FEE[POLICE] + AGENCY_FEE[FIRE] + AGENCY_FEE[TRANSIT] + AGENCY_FEE[SANITATION]   # 90000
        expedited = submitted_at > (parade.parade_date - 14 days)
        final_fee_cents = base + round_half_up(0.20 * base) if expedited else base   # 108000 expedited
      Both variants price the same four-agency filing; the flat estimate and
      the per-agency table legitimately diverge.
    input_set: "The PermitApplication; the fixed four agency types; parade.parade_date"
    constants:
      PROVISIONAL_FLAT_CENTS: 75000
      PROVISIONAL_PER_AGENCY_CENTS: 5000
      AGENCY_FEE_POLICE_CENTS: 30000
      AGENCY_FEE_FIRE_CENTS: 25000
      AGENCY_FEE_TRANSIT_CENTS: 20000
      AGENCY_FEE_SANITATION_CENTS: 15000
      EXPEDITE_WINDOW_DAYS: 14
      EXPEDITE_SURCHARGE_PCT: 0.20
    precision: "integer cents; expedite surcharge round_half_up to whole cents"
    variants:
      - name: provisional
        when: "PermitApplication.status == DRAFT"
        difference: "Flat 75000 + 5000 per agency, regardless of agency mix"
      - name: final
        when: "Set once at submit"
        difference: "Per-agency fee table plus conditional 20% expedite surcharge"

  - name: announcer_script_timing
    trigger: "AnnouncerScriptItem creation (duration_seconds), approve/reopen/cancel (SponsorPackage.allocated_seconds, ParadeEvent.sponsor_seconds_allocated); POST /parades/{id}/finalize-script (tier minimum gate)"
    algorithm: aggregation
    formula: |
      Rounding order PINNED (nested-rounding mode): round each item first,
      then sum. Sum-then-round is FORBIDDEN because it yields a different
      total (e.g. two items of 0.759 min: per-item 46 + 46 = 92 s vs
      sum-first round_half_up(91.08) = 91 s).
      duration_seconds(item)   = round_half_up(item.duration_minutes * 60)
      allocated_seconds(sponsor) = sum duration_seconds over items with
        sponsor_id == sponsor.id, item_type == SPONSOR_READ, status in {APPROVED, LOCKED}
      sponsor_seconds_allocated(parade) = sum duration_seconds over items with
        parade_id == parade.id, item_type == SPONSOR_READ, status in {APPROVED, LOCKED}
      finalize-script gate: every SponsorPackage with status == ACTIVE must
        satisfy allocated_seconds >= TIER_MIN_SECONDS[tier] (ERR_SPONSOR_MINUTES_UNMET).
        Boundary is inclusive: exactly TIER_MIN_SECONDS passes.
    input_set: "AnnouncerScriptItem rows of the parade/sponsor with status in {APPROVED, LOCKED}"
    constants:
      TIER_MIN_SECONDS_GOLD: 120
      TIER_MIN_SECONDS_SILVER: 60
      TIER_MIN_SECONDS_BRONZE: 30
    precision: "whole seconds; per-item round_half_up"

  - name: staging_window_conflict
    trigger: "POST /lineup-assignments/{id}/confirm"
    algorithm: interval_merge
    formula: |
      BUFFER_MINUTES = 15. Each assignment occupies the CLOSED expanded
      interval [arrive_at - 15m, depart_at + 15m] on its StagingArea.
      A confirm is rejected (ERR_STAGING_WINDOW_CONFLICT) when the candidate's
      expanded interval intersects the expanded interval of any other
      assignment on the same StagingArea with status in {CONFIRMED, CHECKED_IN}.
      Closed-interval semantics: shared endpoints count as intersection
      (e.g. candidate arrive 08:10 vs existing depart 08:00: expanded
      [07:55, ...] vs [..., 08:15] intersect; arrive exactly 08:15 vs depart
      08:00 -> expanded endpoints 08:00 and 08:15 touch -> conflict).
      Capacity check is separate and aggregate: reserved_slots < capacity
      (ERR_STAGING_CAPACITY_FULL); boundary inclusive — reserved == capacity
      rejects, reserved == capacity - 1 accepts.
    input_set: "LineupAssignment rows of the same StagingArea with status in {CONFIRMED, CHECKED_IN}"
    constants:
      STAGING_BUFFER_MINUTES: 15
    precision: "instants compared at minute granularity after buffer expansion"

  - name: marshal_window_overlap
    trigger: "POST /parades/{id}/marshal-assignments"
    algorithm: interval_merge
    formula: |
      Marshal shifts are HALF-OPEN intervals [shift_start, shift_end).
      Creation is rejected (ERR_MARSHAL_WINDOW_OVERLAP) when the new shift
      overlaps any existing assignment of the same marshal_user_id with
      status in {ASSIGNED, CONFIRMED}: overlap iff
      existing.shift_start < new.shift_end AND new.shift_start < existing.shift_end.
      Adjacency is allowed: new.shift_start == existing.shift_end (or vice
      versa) is NOT an overlap — opposite of the closed+buffer staging rule.
    input_set: "MarshalAssignment rows with the same marshal_user_id and status in {ASSIGNED, CONFIRMED}"
    constants: {}
    precision: "instants compared exactly"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Role is permitted on the endpoint; ownership checks compare X-User-ID to applicant_user_id / marshal_user_id / judge_user_id where the endpoint demands the owner", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Every {id} path parameter resolves, validated left-to-right (parade, then permit/entry/float/..., then child)", error_id: ERR_PARADE_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids; per-resource variants ERR_PERMIT_NOT_FOUND, ERR_ENDORSEMENT_NOT_FOUND, ERR_ENTRY_NOT_FOUND, ERR_FLOAT_NOT_FOUND, ERR_INSPECTION_NOT_FOUND, ERR_STAGING_AREA_NOT_FOUND, ERR_ROUTE_SEGMENT_NOT_FOUND, ERR_LINEUP_ASSIGNMENT_NOT_FOUND, ERR_MARSHAL_ASSIGNMENT_NOT_FOUND, ERR_SCORE_SHEET_NOT_FOUND, ERR_AWARD_NOT_FOUND, ERR_SPONSOR_NOT_FOUND, ERR_SCRIPT_ITEM_NOT_FOUND, ERR_DISPERSAL_PLAN_NOT_FOUND" }
  - { priority: 4, category: existence, check: "Request body schema: required fields present, types valid, enum members valid, numeric ranges valid (estimated_participants >= 1, capacity >= 1, checklist_score 0..100, end > start for time pairs); conditional FK: sponsor_id required iff item_type == SPONSOR_READ, entry_id required iff item_type == ENTRY_INTRO", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST endpoints with a body" }
  - { priority: 5, category: state, check: "Target resource is in a valid from-state for the transition (incl. posture != FROZEN -> ERR_EVENT_FROZEN, entry APPROVED -> ERR_ENTRY_NOT_APPROVED, parade LINEUP_PUBLISHED -> ERR_LINEUP_NOT_PUBLISHED, permit GRANTED -> ERR_PERMIT_NOT_GRANTED); generic from-state mismatches use ERR_INVALID_STATE", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6, category: business_safety, check: "Float certification gate on confirm (ERR_FLOAT_UNCERTIFIED); re-inspection segregation of duties: inspector of a new inspection must differ from the inspector of the float's latest FAILED inspection (ERR_REINSPECTION_SOD); dispersal emergency_lane_width_m >= 3.0 at submit (ERR_EMERGENCY_LANE_TOO_NARROW)", error_id: ERR_FLOAT_UNCERTIFIED, http_status: 422, applies_to: "confirm, schedule-inspection, dispersal submit" }
  - { priority: 7, category: business_constraint, check: "One permit per parade (ERR_PERMIT_ALREADY_EXISTS); one dispersal plan per parade (ERR_PLAN_ALREADY_EXISTS); one PENDING|ENDORSED endorsement per (permit, agency_type) (ERR_DUPLICATE_AGENCY_ENDORSEMENT); one sheet per (entry, judge) (ERR_DUPLICATE_SCORE_SHEET); lineup position unique among active (ERR_LINEUP_POSITION_TAKEN); staging capacity reserved_slots < capacity (ERR_STAGING_CAPACITY_FULL); float only for FLOAT|VEHICLE entries (ERR_CATEGORY_WITHOUT_FLOAT)", error_id: ERR_DUPLICATE_AGENCY_ENDORSEMENT, http_status: 409, applies_to: "creation and confirm endpoints" }
  - { priority: 8, category: business_temporal, check: "Staging expanded-window conflict (ERR_STAGING_WINDOW_CONFLICT); staging hours contain [arrive_at, depart_at] (ERR_WINDOW_OUTSIDE_STAGING_HOURS); marshal half-open overlap (ERR_MARSHAL_WINDOW_OVERLAP); entry creation at/before entry_deadline (ERR_ENTRY_DEADLINE_PASSED); check-in within [arrive_at, depart_at] and no-show only after depart_at (ERR_CHECKIN_WINDOW_NOT_OPEN); marshal complete only at/after shift_end (ERR_CHECKIN_WINDOW_NOT_OPEN)", error_id: ERR_STAGING_WINDOW_CONFLICT, http_status: 409, applies_to: "lineup-assignment create, confirm, marshal-assignment create, entry create, check-in, no-show, marshal complete" }
  - { priority: 9, category: business_fiscal, check: "Confirm requires fee_paid == true (ERR_ENTRY_FEE_OUTSTANDING); finalize-script requires every ACTIVE sponsor allocated_seconds >= TIER_MIN_SECONDS[tier] (ERR_SPONSOR_MINUTES_UNMET)", error_id: ERR_ENTRY_FEE_OUTSTANDING, http_status: 402, applies_to: "confirm, finalize-script" }
  - { priority: 10, category: business_referential, check: "Award announce eligible pool non-empty (ERR_NO_ELIGIBLE_WINNER); SPONSOR_READ sponsor_id must reference an ACTIVE sponsor of the same parade (ERR_INVALID_STATE); ENTRY_INTRO entry_id must reference an entry of the same parade (ERR_INVALID_STATE)", error_id: ERR_NO_ELIGIBLE_WINNER, http_status: 422, applies_to: "award announce, script-item create" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- ParadeEvent ---
  - { method: POST, path: "/parades", description: "Create a parade edition", roles: [CommitteeAdmin], code: 201, input: [name, parade_date, entry_deadline], output: ParadeEvent, side_effects: ["status DRAFT, posture RESTRICTED, version 1"] }
  - { method: GET, path: "/parades", description: "List parades with pagination and filters", roles: [CommitteeAdmin, AgencyReviewer, SafetyInspector, Judge, Entrant, Marshal], code: 200, input: ["limit?", "offset?", "status?", "posture?"], output: "ParadeEvent[]", side_effects: [] }
  - { method: GET, path: "/parades/{id}", description: "Get one parade incl. computed posture/counters", roles: [CommitteeAdmin, AgencyReviewer, SafetyInspector, Judge, Entrant, Marshal], code: 200, input: [], output: ParadeEvent, side_effects: [] }
  - { method: POST, path: "/parades/{id}/submit-permit", description: "DRAFT -> PERMIT_PENDING; requires >=1 route segment and >=1 staging area", roles: [CommitteeAdmin], code: 200, input: [], output: ParadeEvent, side_effects: ["ParadeEvent.version + 1"] }
  - { method: POST, path: "/parades/{id}/lock", description: "PERMIT_GRANTED -> LOCKED; requires posture OPERATIONAL", roles: [CommitteeAdmin], code: 200, input: [], output: ParadeEvent, side_effects: ["ParadeEvent.version + 1"] }
  - { method: POST, path: "/parades/{id}/publish-lineup", description: "LOCKED -> LINEUP_PUBLISHED under OCC; locks APPROVED script items", roles: [CommitteeAdmin], code: 200, input: [expected_parade_version], output: ParadeEvent, side_effects: ["increments ParadeEvent.version by 1", "AnnouncerScriptItem APPROVED -> LOCKED"] }
  - { method: POST, path: "/parades/{id}/complete", description: "LINEUP_PUBLISHED -> COMPLETED; resolves ACTIVE sponsors to FULFILLED/DEFAULTED", roles: [CommitteeAdmin], code: 200, input: [], output: ParadeEvent, side_effects: ["sponsor resolution cascade", "ParadeEvent.version + 1"] }
  - { method: POST, path: "/parades/{id}/cancel", description: "Any non-terminal state -> CANCELLED with entry/lineup/sponsor cascades", roles: [CommitteeAdmin], code: 200, input: [], output: ParadeEvent, side_effects: ["entry withdraw cascade", "lineup pull cascade", "sponsor default cascade", "posture FROZEN"] }

  # --- RouteSegment ---
  - { method: POST, path: "/parades/{id}/route-segments", description: "Add a route segment", roles: [CommitteeAdmin], code: 201, input: [order_index, name, length_meters, emergency_lane_width_m, segment_window_start, segment_window_end], output: RouteSegment, side_effects: [] }
  - { method: GET, path: "/parades/{id}/route-segments", description: "List route segments of a parade", roles: [CommitteeAdmin, AgencyReviewer, SafetyInspector, Judge, Entrant, Marshal], code: 200, input: ["limit?", "offset?"], output: "RouteSegment[]", side_effects: [] }
  - { method: GET, path: "/route-segments/{id}", description: "Get one route segment", roles: [CommitteeAdmin, AgencyReviewer, Marshal], code: 200, input: [], output: RouteSegment, side_effects: [] }

  # --- PermitApplication ---
  - { method: POST, path: "/parades/{id}/permit", description: "Create the parade's permit application (at most one)", roles: [CommitteeAdmin], code: 201, input: [], output: PermitApplication, side_effects: ["provisional_fee_cents computed (95000)"] }
  - { method: GET, path: "/parades/{id}/permit", description: "Fetch the permit of a parade (array of 0-1)", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: [], output: "PermitApplication[]", side_effects: [] }
  - { method: GET, path: "/permits/{id}", description: "Get one permit incl. fee variants and endorsement counts", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: [], output: PermitApplication, side_effects: [] }
  - { method: POST, path: "/permits/{id}/submit", description: "DRAFT -> AGENCY_REVIEW; computes final_fee_cents; requires parade PERMIT_PENDING and all four agency PENDING endorsements", roles: [CommitteeAdmin], code: 200, input: [], output: PermitApplication, side_effects: ["final_fee_cents computed", "submitted_at set", "PermitApplication.version + 1"] }
  - { method: POST, path: "/permits/{id}/grant", description: "AGENCY_REVIEW -> GRANTED when all four agencies ENDORSED; flips parade to PERMIT_GRANTED", roles: [AgencyReviewer], code: 200, input: [], output: PermitApplication, side_effects: ["ParadeEvent PERMIT_PENDING -> PERMIT_GRANTED", "posture recompute", "PermitApplication.version + 1"] }
  - { method: POST, path: "/permits/{id}/deny", description: "AGENCY_REVIEW -> DENIED; freezes the parade posture", roles: [AgencyReviewer], code: 200, input: [], output: PermitApplication, side_effects: ["posture FROZEN", "PermitApplication.version + 1"] }
  - { method: POST, path: "/permits/{id}/revoke", description: "GRANTED -> REVOKED; fires the 4-hop freeze cascade", roles: [AgencyReviewer], code: 200, input: [], output: PermitApplication, side_effects: ["posture FROZEN", "CONFIRMED/CHECKED_IN lineup pulled", "staging slots released", "ENTRY_INTRO items cancelled", "PermitApplication.version + 1"] }
  - { method: POST, path: "/permits/{id}/refile", description: "DENIED -> DRAFT; resets final fee and submitted_at", roles: [CommitteeAdmin], code: 200, input: [], output: PermitApplication, side_effects: ["posture recompute", "PermitApplication.version + 1"] }

  # --- AgencyEndorsement ---
  - { method: POST, path: "/permits/{id}/endorsements", description: "Request an agency endorsement (OCC on permit version)", roles: [CommitteeAdmin], code: 201, input: [agency_type, expected_permit_version], output: AgencyEndorsement, side_effects: ["increments PermitApplication.version by 1"] }
  - { method: GET, path: "/permits/{id}/endorsements", description: "List endorsements of a permit", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: ["limit?", "offset?", "status?"], output: "AgencyEndorsement[]", side_effects: [] }
  - { method: GET, path: "/endorsements/{id}", description: "Get one endorsement", roles: [CommitteeAdmin, AgencyReviewer], code: 200, input: [], output: AgencyEndorsement, side_effects: [] }
  - { method: POST, path: "/endorsements/{id}/endorse", description: "PENDING -> ENDORSED", roles: [AgencyReviewer], code: 200, input: [], output: AgencyEndorsement, side_effects: ["permit endorsed_count recompute"] }
  - { method: POST, path: "/endorsements/{id}/reject", description: "PENDING -> REJECTED", roles: [AgencyReviewer], code: 200, input: [], output: AgencyEndorsement, side_effects: ["permit endorsed_count recompute"] }

  # --- EntryApplication ---
  - { method: POST, path: "/parades/{id}/entries", description: "Entrant submits an entry application; applicant_user_id taken from X-User-ID", roles: [Entrant], code: 201, input: [org_name, requested_category, estimated_participants], output: EntryApplication, side_effects: ["fee_cents computed (requested_category basis)"] }
  - { method: GET, path: "/parades/{id}/entries", description: "List entries of a parade", roles: [CommitteeAdmin, AgencyReviewer, Judge, Entrant], code: 200, input: ["limit?", "offset?", "status?", "assigned_category?"], output: "EntryApplication[]", side_effects: [] }
  - { method: GET, path: "/entries/{id}", description: "Get one entry incl. fee and scores", roles: [CommitteeAdmin, AgencyReviewer, Judge, Entrant], code: 200, input: [], output: EntryApplication, side_effects: [] }
  - { method: POST, path: "/entries/{id}/start-review", description: "SUBMITTED -> UNDER_REVIEW", roles: [CommitteeAdmin], code: 200, input: [], output: EntryApplication, side_effects: ["EntryApplication.version + 1"] }
  - { method: POST, path: "/entries/{id}/approve", description: "UNDER_REVIEW -> APPROVED with category assignment; recomputes fee", roles: [CommitteeAdmin], code: 200, input: [assigned_category], output: EntryApplication, side_effects: ["assigned_category set", "fee_cents recompute", "approved_entry_count recompute", "EntryApplication.version + 1"] }
  - { method: POST, path: "/entries/{id}/reject", description: "UNDER_REVIEW -> REJECTED", roles: [CommitteeAdmin], code: 200, input: ["reason?"], output: EntryApplication, side_effects: ["EntryApplication.version + 1"] }
  - { method: POST, path: "/entries/{id}/request-revision", description: "UNDER_REVIEW -> REVISION_REQUESTED", roles: [CommitteeAdmin], code: 200, input: [revision_notes], output: EntryApplication, side_effects: ["revision_count + 1", "EntryApplication.version + 1"] }
  - { method: POST, path: "/entries/{id}/resubmit", description: "REVISION_REQUESTED -> SUBMITTED by the owning entrant; recomputes fee", roles: [Entrant], code: 200, input: ["org_name?", "estimated_participants?"], output: EntryApplication, side_effects: ["fee_cents recompute", "EntryApplication.version + 1"] }
  - { method: POST, path: "/entries/{id}/withdraw", description: "SUBMITTED|APPROVED -> WITHDRAWN by the owning entrant; pulls confirmed lineup", roles: [Entrant], code: 200, input: [], output: EntryApplication, side_effects: ["lineup pull cascade", "approved_entry_count recompute", "EntryApplication.version + 1"] }
  - { method: POST, path: "/entries/{id}/pay-fee", description: "Mark the entry fee paid by the owning entrant", roles: [Entrant], code: 200, input: [], output: EntryApplication, side_effects: ["fee_paid = true", "EntryApplication.version + 1"] }

  # --- Float ---
  - { method: POST, path: "/entries/{id}/floats", description: "Register a float/vehicle for an APPROVED FLOAT|VEHICLE entry", roles: [Entrant], code: 201, input: [length_m, width_m, height_m, weight_kg, vehicle_class, fuel_type], output: Float, side_effects: ["compliance_status PENDING_INSPECTION"] }
  - { method: GET, path: "/entries/{id}/floats", description: "List floats of an entry", roles: [CommitteeAdmin, SafetyInspector, Entrant], code: 200, input: ["limit?", "offset?"], output: "Float[]", side_effects: [] }
  - { method: GET, path: "/floats/{id}", description: "Get one float", roles: [CommitteeAdmin, SafetyInspector, Entrant], code: 200, input: [], output: Float, side_effects: [] }

  # --- SafetyInspection ---
  - { method: POST, path: "/floats/{id}/inspections", description: "Schedule an inspection; inspector_user_id from X-User-ID; re-inspection must use a different inspector than the latest FAILED one", roles: [SafetyInspector], code: 201, input: [scheduled_at], output: SafetyInspection, side_effects: ["float FAILED -> PENDING_INSPECTION when re-inspection", "one SCHEDULED inspection per float at a time"] }
  - { method: GET, path: "/floats/{id}/inspections", description: "List inspections of a float", roles: [CommitteeAdmin, SafetyInspector, Entrant], code: 200, input: ["limit?", "offset?"], output: "SafetyInspection[]", side_effects: [] }
  - { method: GET, path: "/inspections/{id}", description: "Get one inspection", roles: [CommitteeAdmin, SafetyInspector], code: 200, input: [], output: SafetyInspection, side_effects: [] }
  - { method: POST, path: "/inspections/{id}/pass", description: "SCHEDULED -> PASSED; requires checklist_score >= 70; certifies the float", roles: [SafetyInspector], code: 200, input: [checklist_score], output: SafetyInspection, side_effects: ["Float -> CERTIFIED", "entry SUSPENDED -> APPROVED compensation when applicable"] }
  - { method: POST, path: "/inspections/{id}/fail", description: "SCHEDULED -> FAILED; requires checklist_score < 70; fires float->entry->lineup cascade", roles: [SafetyInspector], code: 200, input: [checklist_score], output: SafetyInspection, side_effects: ["Float -> FAILED", "entry APPROVED -> SUSPENDED", "CONFIRMED/CHECKED_IN lineup pulled", "staging slots released", "ENTRY_INTRO items cancelled"] }
  - { method: POST, path: "/inspections/{id}/cancel", description: "SCHEDULED -> CANCELLED", roles: [SafetyInspector], code: 200, input: [], output: SafetyInspection, side_effects: [] }

  # --- StagingArea ---
  - { method: POST, path: "/parades/{id}/staging-areas", description: "Create a staging area", roles: [CommitteeAdmin], code: 201, input: [name, capacity, open_time, close_time], output: StagingArea, side_effects: ["reserved_slots starts 0"] }
  - { method: GET, path: "/parades/{id}/staging-areas", description: "List staging areas of a parade", roles: [CommitteeAdmin, AgencyReviewer, Entrant], code: 200, input: ["limit?", "offset?"], output: "StagingArea[]", side_effects: [] }
  - { method: GET, path: "/staging-areas/{id}", description: "Get one staging area incl. reserved_slots", roles: [CommitteeAdmin, AgencyReviewer, Entrant], code: 200, input: [], output: StagingArea, side_effects: [] }

  # --- LineupAssignment ---
  - { method: POST, path: "/parades/{id}/lineup-assignments", description: "Create a TENTATIVE lineup assignment; requires entry APPROVED and parade status in {PERMIT_GRANTED, LOCKED}", roles: [CommitteeAdmin], code: 201, input: [entry_id, staging_area_id, position_number, arrive_at, depart_at], output: LineupAssignment, side_effects: [] }
  - { method: GET, path: "/lineup-assignments", description: "Filtered list of lineup assignments", roles: [CommitteeAdmin, AgencyReviewer, Entrant], code: 200, input: ["limit?", "offset?", "parade_id?", "entry_id?", "staging_area_id?", "status?"], output: "LineupAssignment[]", side_effects: [] }
  - { method: GET, path: "/lineup-assignments/{id}", description: "Get one lineup assignment", roles: [CommitteeAdmin, AgencyReviewer, Entrant], code: 200, input: [], output: LineupAssignment, side_effects: [] }
  - { method: POST, path: "/lineup-assignments/{id}/confirm", description: "TENTATIVE -> CONFIRMED under the full gate chain (posture, entry, float, position, capacity, window, fee)", roles: [CommitteeAdmin], code: 200, input: [], output: LineupAssignment, side_effects: ["StagingArea.reserved_slots + 1"] }
  - { method: POST, path: "/lineup-assignments/{id}/check-in", description: "CONFIRMED -> CHECKED_IN within [arrive_at, depart_at] after lineup publication", roles: [CommitteeAdmin], code: 200, input: [], output: LineupAssignment, side_effects: [] }
  - { method: POST, path: "/lineup-assignments/{id}/release", description: "CHECKED_IN -> RELEASED; frees the staging slot", roles: [CommitteeAdmin], code: 200, input: [], output: LineupAssignment, side_effects: ["StagingArea.reserved_slots - 1"] }
  - { method: POST, path: "/lineup-assignments/{id}/no-show", description: "CONFIRMED -> NO_SHOW after depart_at; frees slot, cancels ENTRY_INTRO items", roles: [CommitteeAdmin], code: 200, input: [], output: LineupAssignment, side_effects: ["StagingArea.reserved_slots - 1", "ENTRY_INTRO cancellation"] }
  - { method: POST, path: "/lineup-assignments/{id}/pull", description: "TENTATIVE|CONFIRMED -> PULLED; frees slot when confirmed, cancels ENTRY_INTRO items", roles: [CommitteeAdmin], code: 200, input: [], output: LineupAssignment, side_effects: ["StagingArea.reserved_slots - 1 when was CONFIRMED", "ENTRY_INTRO cancellation"] }

  # --- MarshalAssignment ---
  - { method: POST, path: "/parades/{id}/marshal-assignments", description: "Assign a marshal to a route segment shift (half-open overlap rule per marshal)", roles: [CommitteeAdmin], code: 201, input: [route_segment_id, marshal_user_id, shift_start, shift_end], output: MarshalAssignment, side_effects: [] }
  - { method: GET, path: "/marshal-assignments", description: "Filtered list of marshal assignments", roles: [CommitteeAdmin, AgencyReviewer, Marshal], code: 200, input: ["limit?", "offset?", "parade_id?", "route_segment_id?", "marshal_user_id?", "status?"], output: "MarshalAssignment[]", side_effects: [] }
  - { method: GET, path: "/marshal-assignments/{id}", description: "Get one marshal assignment", roles: [CommitteeAdmin, AgencyReviewer, Marshal], code: 200, input: [], output: MarshalAssignment, side_effects: [] }
  - { method: POST, path: "/marshal-assignments/{id}/confirm", description: "ASSIGNED -> CONFIRMED by the assigned marshal", roles: [Marshal], code: 200, input: [], output: MarshalAssignment, side_effects: [] }
  - { method: POST, path: "/marshal-assignments/{id}/complete", description: "CONFIRMED -> COMPLETED at/after shift_end", roles: [Marshal], code: 200, input: [], output: MarshalAssignment, side_effects: [] }
  - { method: POST, path: "/marshal-assignments/{id}/no-show", description: "ASSIGNED|CONFIRMED -> NO_SHOW by the committee", roles: [CommitteeAdmin], code: 200, input: [], output: MarshalAssignment, side_effects: [] }

  # --- JudgingScoreSheet ---
  - { method: POST, path: "/entries/{id}/score-sheets", description: "Judge opens a DRAFT sheet for an APPROVED|SUSPENDED entry; judge_user_id from X-User-ID; one sheet per (entry, judge)", roles: [Judge], code: 201, input: [creativity, craftsmanship, theme, crowd_appeal], output: JudgingScoreSheet, side_effects: ["sheet_total computed"] }
  - { method: GET, path: "/entries/{id}/score-sheets", description: "List score sheets of an entry", roles: [CommitteeAdmin, Judge], code: 200, input: ["limit?", "offset?", "status?"], output: "JudgingScoreSheet[]", side_effects: [] }
  - { method: GET, path: "/score-sheets/{id}", description: "Get one score sheet", roles: [CommitteeAdmin, Judge], code: 200, input: [], output: JudgingScoreSheet, side_effects: [] }
