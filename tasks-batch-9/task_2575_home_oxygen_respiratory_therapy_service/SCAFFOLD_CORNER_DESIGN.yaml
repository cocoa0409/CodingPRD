            - "${denied} == DENIED with decided_by_user_id \"u-mgr-1\"; every computed supply field is unchanged by the decision"
            - "${e_approve} == ERR_INVALID_STATE (409) and ${e_redeny} == ERR_INVALID_STATE (409): APPROVED and DENIED are both terminal"
