              captures: { series_id: $.data.id }
            - call: "POST /storage-zones"
              payload: { zone_code: "AV-COLD-5", temperature_c: 13.0, relative_humidity_pct: 37.0, max_overlapping_migration_jobs: 3 }
              as: PreservationOfficer
              captures: { zone_id: $.data.id }
            - call: "POST /accessions"
              payload: { record_series_id: "${series_id}", donor_name: "EHS Media Unit", transfer_instrument: "INTERNAL_TRANSFER", declared_unit_count: 50 }
              as: Archivist
              captures: { acc_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "SAFETY-TAPE-S", unit_count: 10, condition_grade: "GOOD", original_format: "MAGNETIC_TAPE", sensitivity_level: "INTERNAL" }
              as: Archivist
              captures: { itemS_id: $.data.id }
            - call: "POST /archival-items"
              payload: { accession_id: "${acc_id}", storage_zone_id: "${zone_id}", item_label: "SAFETY-TAPE-L", unit_count: 40, condition_grade: "FAIR", original_format: "MAGNETIC_TAPE", sensitivity_level: "INTERNAL" }
              as: Archivist
              captures: { itemL_id: $.data.id }
            - call: "POST /accessions/${acc_id}/verify-provenance"
              payload: { provenance_statement: "EHS media unit transfer with tape schedule", transfer_instrument_reference: "IT-2026-134" }
              as: Archivist
            - call: "POST /accessions/${acc_id}/process"
              payload: {}
              as: Archivist
            - call: "POST /preservation-plans"
              payload: { storage_zone_id: "${zone_id}", plan_name: "Safety Film Programme", budget_cents: 300000 }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { plan_id: $.data.id }
            - call: "POST /preservation-plans/${plan_id}/activate"
              payload: {}
              as: PreservationOfficer
              as_user_id: "preserv-a"
            - call: "POST /migration-jobs"
              payload: { preservation_plan_id: "${plan_id}", archival_item_id: "${itemS_id}", target_format: "PRESERVATION_MKV", units: 10, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-15T00:00:00Z" }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { jobA_id: $.data.id }
            - call: "POST /migration-jobs"
              payload: { preservation_plan_id: "${plan_id}", archival_item_id: "${itemL_id}", target_format: "PRESERVATION_MKV", units: 40, window_start: "2026-09-10T00:00:00Z", window_end: "2026-10-20T00:00:00Z" }
              as: PreservationOfficer
              as_user_id: "preserv-a"
              captures: { jobB_id: $.data.id }
            - call: "POST /migration-jobs/${jobA_id}/approve"
