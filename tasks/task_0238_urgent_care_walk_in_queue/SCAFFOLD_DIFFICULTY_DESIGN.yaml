      # ---- 7.2 mark-ready depends on Patient/Coverage (QueueEntry -> Patient) ----
      - name: mark_ready_blocked_without_coverage
        grounds:
          - state_machines.QueueEntry.IN_REGISTRATION_to_READY_FOR_PROVIDER
