# =============================================================================
# Fastener Cold Heading & Thread Rolling — scaffold seed tables (§1.0–§1.7)
# =============================================================================

scenario: |
  2382. Fastener Cold Heading & Thread Rolling (fastener manufacturer): wire drawing and material
  preparation with steel grade selection and lubrication coating, cold heading die design and setup
  with progressive stations and tool life management, thread rolling and secondary operations
  including drilling, slotting and pointing, heat treatment for strength class with core hardness and
  decarburization control, plating and coating with hydrogen embrittlement relief baking requirements,
  testing to strength grade standards with lot sampling and certification documents, aerospace and
  automotive qualification with traceability and counterfeit prevention, packaging by count or weight
  with tolerance and labeling requirements

domain_name: fastener-cold-heading
api_prefix: "/"   # flat top-level collections: /part-specs, /wire-lots, /production-lots, ...

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - contagion_risk_propagation
    - derived_field_reconciliation
    # derived_field_reconciliation: the wire-mass ledger (gross == available + reserved + consumed) and
    # the lot piece ledger (headed + heading_scrap == available + scrap + destructive + packed) must
    # reconcile after every write, including the compensating ones (abort-heading, pack reopen).
    - pagination_with_filtering
    # pagination_with_filtering: every list endpoint takes limit/offset plus status and foreign-key
    # filters and reports total_count / has_more against the filtered set, not the whole collection.

  entity_topology: graph
  # graph: ProductionLot is referenced by five peer process-record entities (SecondaryOperation,
  # HeatTreatRun, PlatingRun, LotTest, CertificationDocument, PackUnit) and itself references four
  # upstream entities (PartSpec, WireLot, HeadingTool, SteelHeat via denormalized traceability edge).
  # Every collection is a flat top-level path; there is no ownership tree in the URL space.

  state_machine_shape: parallel
  # ProductionLot carries two independent state dimensions (process_state × disposition) that evolve
  # under different actors; HeadingTool and CertificationDocument are cyclic; PlatingRun branches on
  # PartSpec.he_bake_required.

  relationship_patterns:
    - one_to_many          # ProductionLot -> SecondaryOperation / PlatingRun / LotTest / PackUnit
    - cross_aggregate      # ProductionLot -> HeadingTool, Furnace <- HeatTreatRun
    - polymorphic: false
    - self_referential: false

  role_model: segregation_of_duties
  # The opaque X-User-ID that performed a LotTest may never sign the CertificationDocument that cites
  # that test; QualityInspector records metallurgy, QualityManager signs certificates.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PartSpec
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Customer part number", constraints: "unique across PartSpec" }
      - { name: thread_designation, type: string, source: input, description: "Thread callout, e.g. M8x1.25" }
      - { name: strength_class, type: enum, source: input, description: "CLASS_8_8 | CLASS_10_9 | CLASS_12_9 | GRADE_5 | GRADE_8" }
      - { name: qualification_program, type: enum, source: input, description: "NONE | AUTOMOTIVE_PPAP | AEROSPACE_NADCAP", default: NONE }
      - { name: allowed_steel_grades, type: array, source: input, description: "Non-empty list of SteelHeat.grade enum values permitted for this part" }
      - { name: blank_mass_g, type: number, source: input, description: "Mass of one headed blank in grams", constraints: "> 0" }
      - { name: scrap_allowance_pct, type: number, source: input, description: "Fraction of planned_pieces allowed as heading overrun/scrap", default: 0.05, constraints: ">= 0 and <= 0.20" }
      - { name: station_count_required, type: integer, source: input, description: "Progressive heading stations the die set must provide", constraints: ">= 1" }
      - { name: thread_timing, type: enum, source: input, description: "BEFORE_HEAT_TREAT | AFTER_HEAT_TREAT — when the THREAD_ROLL secondary operation must run" }
      - { name: required_secondary_ops, type: array, source: input, description: "Subset of {THREAD_ROLL, DRILL, SLOT, POINT}; MUST contain THREAD_ROLL" }
      - { name: min_core_hardness_hv, type: number, source: input, description: "Inclusive lower core-hardness bound in HV for the strength class" }
      - { name: max_core_hardness_hv, type: number, source: input, description: "Inclusive upper core-hardness bound in HV for the strength class" }
      - { name: max_decarb_depth_mm, type: number, source: input, description: "Inclusive maximum total decarburization depth in mm" }
      - { name: plating_spec, type: enum, source: input, description: "NONE | ZINC_CLEAR | ZINC_NICKEL | CADMIUM" }
      - { name: packaging_mode, type: enum, source: input, description: "BY_COUNT | BY_WEIGHT" }
      - { name: nominal_pack_count, type: integer, source: input, description: "Target pieces per pack unit", constraints: ">= 1" }
      - { name: pieces_per_kg, type: number, source: input, description: "Nominal pieces per kilogram used for BY_WEIGHT count derivation", constraints: "> 0" }
      - { name: count_tolerance_pct, type: number, source: input, description: "Fraction of nominal_pack_count tolerated as pack count deviation", default: 0.02 }
      - { name: proof_load_kn, type: number, source: input, description: "Proof load in kN applied during lot testing" }
      - { name: he_bake_required, type: boolean, source: computed, description: "true iff plating_spec != NONE AND strength_class IN {CLASS_10_9, CLASS_12_9, GRADE_8}" }
      - { name: he_bake_min_minutes, type: integer, source: computed, description: "0 when he_bake_required is false; 480 for CLASS_12_9 and GRADE_8; 240 for CLASS_10_9" }

  - name: SteelHeat
    parent: null
    common_fields: true
    fields:
      - { name: heat_number, type: string, source: input, description: "Mill heat number", constraints: "unique across SteelHeat" }
      - { name: mill_code, type: string, source: input, description: "Producing mill identifier" }
      - { name: grade, type: enum, source: input, description: "SAE_1018 | SAE_1038 | SAE_10B21 | SAE_4037" }
      - { name: carbon_pct, type: number, source: input, description: "Ladle carbon percentage" }
      - { name: boron_ppm, type: number, source: input, description: "Boron content in ppm", default: 0 }
      - { name: gross_mass_kg, type: number, source: input, description: "Rod coil mass received from the mill", constraints: "> 0" }
      - { name: mill_cert_serial, type: string, source: input, description: "Serial of the mill test report; counterfeit prevention key", constraints: "unique across SteelHeat" }
      - { name: cert_status, type: enum, source: computed, description: "PENDING | VERIFIED | SUSPECTED_COUNTERFEIT | REJECTED", default: PENDING }
      - { name: lab_report_reference, type: string, source: system, description: "Independent lab report cited by the last verification attempt; null before first attempt" }
      - { name: verified_at, type: datetime, source: system, description: "Logical-clock instant of the last transition into VERIFIED; null otherwise" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of the QualityInspector who last verified; null otherwise" }
      - { name: counterfeit_reason, type: string, source: system, description: "Reason recorded on the last transition into SUSPECTED_COUNTERFEIT; null otherwise" }

  - name: WireLot
    parent: null
    common_fields: true
    fields:
      - { name: steel_heat_id, type: string, source: input, description: "FK -> SteelHeat.id; heat the rod was drawn from" }
      - { name: draw_pass_count, type: integer, source: input, description: "Number of drawing passes", constraints: ">= 1" }
      - { name: inlet_diameter_mm, type: number, source: input, description: "Rod diameter entering the draw bench", constraints: "> 0" }
      - { name: outlet_diameter_mm, type: number, source: input, description: "Wire diameter leaving the draw bench", constraints: "> 0 and < inlet_diameter_mm" }
      - { name: reduction_pct, type: number, source: computed, description: "Total cross-section reduction; see calculations.wire_draw_reduction" }
      - { name: lubricant_coating, type: enum, source: input, description: "PHOSPHATE | POLYMER | LIME | NONE" }
      - { name: coating_weight_gsm, type: number, source: input, description: "Lubricant coating weight in g/m^2", constraints: ">= 0" }
      - { name: gross_mass_kg, type: number, source: input, description: "Mass of drawn wire in the lot", constraints: "> 0" }
      - { name: available_mass_kg, type: number, source: computed, description: "Mass not yet reserved or consumed; ledger member" }
      - { name: reserved_mass_kg, type: number, source: computed, description: "Mass reserved by ProductionLot rows in process_state SETUP; ledger member" }
      - { name: consumed_mass_kg, type: number, source: computed, description: "Mass consumed by completed heading; ledger member" }
      - { name: status, type: enum, source: computed, description: "DRAWN | RELEASED | QUARANTINED", default: DRAWN }
      - { name: quarantine_source, type: enum, source: computed, description: "NONE | HEAT_COUNTERFEIT | HEAT_REJECTED — which cascade quarantined the lot", default: NONE }
      - { name: inspected_at, type: datetime, source: system, description: "Logical-clock instant of the DRAWN -> RELEASED transition; null before release" }

  - name: HeadingTool
    parent: null
    common_fields: true
    fields:
      - { name: tool_code, type: string, source: input, description: "Die-set identifier", constraints: "unique across HeadingTool" }
      - { name: station_count, type: integer, source: input, description: "Progressive stations the die set provides", constraints: ">= 1" }
      - { name: rated_life_pieces, type: integer, source: input, description: "Nameplate life of a fresh die set in pieces", constraints: ">= 1" }
      - { name: max_regrinds, type: integer, source: input, description: "Regrind cycles the die set may take before condemnation", default: 3, constraints: ">= 0" }
      - { name: regrind_count, type: integer, source: computed, description: "Completed regrinds", default: 0 }
      - { name: cumulative_pieces_current_cycle, type: integer, source: computed, description: "Pieces headed since the last regrind", default: 0 }
      - { name: cycle_pieces_history, type: array, source: system, description: "Integer pieces achieved in each closed life cycle, appended in cycle order" }
      - { name: completed_cycle_count, type: integer, source: computed, description: "Length of cycle_pieces_history", default: 0 }
      - { name: lifetime_pieces, type: integer, source: computed, description: "sum(cycle_pieces_history) + cumulative_pieces_current_cycle", default: 0 }
      - { name: observed_avg_cycle_pieces, type: number, source: computed, description: "Mean of cycle_pieces_history rounded to 2 dp; null when completed_cycle_count == 0" }
      - { name: rated_derated_life_pieces, type: integer, source: computed, description: "Nameplate life derated by regrind_count; see calculations.tool_effective_life" }
      - { name: conservative_life_pieces, type: integer, source: computed, description: "Aerospace variant of effective life; see calculations.tool_effective_life" }
      - { name: status, type: enum, source: computed, description: "AVAILABLE | MOUNTED | WORN | SCRAPPED", default: AVAILABLE }
      - { name: mounted_press_code, type: string, source: system, description: "Press the die set is mounted on; null unless status == MOUNTED" }
      - { name: condemn_reason, type: string, source: system, description: "Reason recorded on the last MOUNTED -> WORN operator transition; null when wear was counter-driven" }

  - name: Furnace
    parent: null
    common_fields: true
    fields:
      - { name: furnace_code, type: string, source: input, description: "Furnace identifier", constraints: "unique across Furnace" }
      - { name: max_charge_mass_kg, type: number, source: input, description: "Maximum charge mass per run", constraints: "> 0" }
      - { name: cooldown_minutes, type: integer, source: input, description: "Mandatory idle buffer after a run window before the next run window may open", default: 30, constraints: ">= 0" }
      - { name: status, type: enum, source: computed, description: "IDLE | OCCUPIED", default: IDLE }
      - { name: last_run_end_at, type: datetime, source: system, description: "Logical-clock instant the last HeatTreatRun on this furnace reached COMPLETED; null before that" }

  - name: ProductionLot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: input, description: "Traceable lot identifier", constraints: "unique across ProductionLot" }
      - { name: part_spec_id, type: string, source: input, description: "FK -> PartSpec.id; part being produced" }
      - { name: pinned_part_spec_version, type: integer, source: system, description: "PartSpec.version copied at lot creation and never re-derived" }
      - { name: wire_lot_id, type: string, source: input, description: "FK -> WireLot.id; wire consumed by heading" }
      - { name: heading_tool_id, type: string, source: input, description: "FK -> HeadingTool.id; die set used for heading" }
      - { name: traceability_heat_id, type: string, source: computed, description: "FK -> SteelHeat.id; denormalized from WireLot.steel_heat_id at lot creation and never re-derived" }
      - { name: press_code, type: string, source: input, description: "Press the lot is headed on" }
      - { name: press_window_start_at, type: datetime, source: input, description: "Inclusive start of the tool occupation window" }
      - { name: press_window_end_at, type: datetime, source: input, description: "Exclusive end of the tool occupation window", constraints: "> press_window_start_at" }
      - { name: planned_pieces, type: integer, source: input, description: "Planned good pieces", constraints: ">= 1" }
      - { name: wire_reserved_kg, type: number, source: computed, description: "Wire mass currently reserved by this lot; 0 once heading completes or aborts" }
      - { name: wire_consumed_kg, type: number, source: computed, description: "Wire mass consumed by this lot at heading completion" }
      - { name: headed_count, type: integer, source: computed, description: "Good pieces reported at heading completion", default: 0 }
      - { name: heading_scrap_count, type: integer, source: computed, description: "Pieces scrapped at heading completion; ledger member and part of scrap_count", default: 0 }
      - { name: available_count, type: integer, source: computed, description: "Pieces available for the next operation; ledger member", default: 0 }
      - { name: scrap_count, type: integer, source: computed, description: "Total pieces scrapped, heading plus secondary operations; ledger member", default: 0 }
      - { name: destructive_test_count, type: integer, source: computed, description: "Pieces consumed by destructive lot tests; ledger member", default: 0 }
      - { name: packed_count, type: integer, source: computed, description: "Pieces inside pack units in status SEALED, SHIPPED or RECALLED; ledger member", default: 0 }
      - { name: tool_utilization_pct, type: number, source: computed, description: "Tool life consumed at heading completion, snapshotted; see calculations.lot_release_risk_score" }
      - { name: heat_treat_completed, type: boolean, source: computed, description: "true once a HeatTreatRun for this lot reached COMPLETED with result PASS", default: false }
      - { name: process_state, type: enum, source: computed, description: "SETUP | HEADED | SECONDARY_IN_PROGRESS | SECONDARY_DONE | HEAT_TREATED | PLATED | BAKED | TESTING | TESTED | CERTIFIED | PACKED | SHIPPED | ABORTED", default: SETUP }
      - { name: disposition, type: enum, source: computed, description: "IN_PROCESS | HOLD | QUARANTINED | SCRAPPED", default: IN_PROCESS }
      - { name: hold_source, type: enum, source: computed, description: "NONE | TOOL_WEAR | HT_FAILURE | TEST_REJECT | QUALITY | HEAT_COUNTERFEIT", default: NONE }
      - { name: risk_score_pre_test, type: number, source: computed, description: "Pass-1 risk score; see calculations.lot_release_risk_score" }
      - { name: risk_score_final, type: number, source: computed, description: "Pass-2 risk score; see calculations.lot_release_risk_score" }
      - { name: inspection_severity, type: enum, source: computed, description: "NORMAL | TIGHTENED — frozen when the lot's LotTest is created; null before that" }
      - { name: achieved_strength_class, type: enum, source: computed, description: "CLASS_8_8 | CLASS_10_9 | CLASS_12_9 | GRADE_5 | GRADE_8 | NONE — from lot test hardness; null before test results" }
      - { name: abort_reason, type: string, source: system, description: "Reason recorded on the SETUP -> ABORTED transition; null otherwise" }

  - name: SecondaryOperation
    parent: ProductionLot
    common_fields: true
    fields:
      - { name: production_lot_id, type: string, source: input, description: "FK -> ProductionLot.id; lot the operation runs on" }
      - { name: op_type, type: enum, source: input, description: "THREAD_ROLL | DRILL | SLOT | POINT" }
      - { name: sequence_no, type: integer, source: input, description: "Operation order within the lot", constraints: ">= 1; unique per production_lot_id" }
      - { name: machine_code, type: string, source: input, description: "Machine the operation runs on" }
      - { name: pieces_in, type: integer, source: input, description: "Pieces loaded; MUST equal ProductionLot.available_count at creation" }
      - { name: pieces_out, type: integer, source: input, description: "Pieces returned at completion; null while PENDING", constraints: ">= 0 and <= pieces_in" }
      - { name: scrap_pieces, type: integer, source: computed, description: "pieces_in - pieces_out; null while PENDING" }
      - { name: status, type: enum, source: computed, description: "PENDING | DONE", default: PENDING }
      - { name: performed_after_heat_treat, type: boolean, source: computed, description: "ProductionLot.heat_treat_completed at the moment the operation was created" }

  - name: HeatTreatRun
    parent: null
    common_fields: true
    fields:
      - { name: production_lot_id, type: string, source: input, description: "FK -> ProductionLot.id; lot charged into the furnace" }
      - { name: furnace_id, type: string, source: input, description: "FK -> Furnace.id; furnace occupied by this run" }
      - { name: window_start_at, type: datetime, source: input, description: "Inclusive start of the furnace occupation window" }
      - { name: window_end_at, type: datetime, source: input, description: "Inclusive end of the furnace occupation window", constraints: "> window_start_at" }
      - { name: austenitize_temp_c, type: number, source: input, description: "Austenitizing temperature in Celsius" }
      - { name: quench_medium, type: enum, source: input, description: "OIL | WATER | POLYMER" }
      - { name: temper_temp_c, type: number, source: input, description: "Tempering temperature in Celsius" }
      - { name: temper_time_min, type: integer, source: input, description: "Tempering soak minutes", constraints: ">= 1" }
      - { name: carbon_potential_pct, type: number, source: input, description: "Furnace atmosphere carbon potential; drives decarburization amplification" }
      - { name: charge_mass_kg, type: number, source: computed, description: "Mass of the charged lot; see calculations.heat_treat_charge_mass" }
      - { name: core_hardness_hv, type: number, source: input, description: "Coupon core hardness in HV recorded with the run results; null while PENDING" }
      - { name: surface_decarb_depth_mm, type: number, source: input, description: "Measured surface decarburization depth in mm; null while PENDING" }
      - { name: total_decarb_depth_mm, type: number, source: computed, description: "Atmosphere-amplified decarburization; see calculations.heat_treat_metallurgy_evaluation" }
      - { name: result, type: enum, source: computed, description: "PENDING | PASS | FAIL_HARDNESS | FAIL_DECARB", default: PENDING }
      - { name: status, type: enum, source: computed, description: "PLANNED | RUNNING | COMPLETED", default: PLANNED }
      - { name: started_at, type: datetime, source: system, description: "Logical-clock instant of PLANNED -> RUNNING; null before start" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant of RUNNING -> COMPLETED; null before completion" }

  - name: PlatingRun
    parent: null
    common_fields: true
    fields:
      - { name: production_lot_id, type: string, source: input, description: "FK -> ProductionLot.id; lot being plated" }
      - { name: plating_spec, type: enum, source: computed, description: "ZINC_CLEAR | ZINC_NICKEL | CADMIUM — copied from PartSpec.plating_spec at creation" }
      - { name: load_mass_kg, type: number, source: computed, description: "round(ProductionLot.available_count * PartSpec.blank_mass_g / 1000, 3) at creation" }
      - { name: plated_at, type: datetime, source: system, description: "Logical-clock instant of SCHEDULED -> PLATED; null before that" }
      - { name: bake_started_at, type: datetime, source: system, description: "Logical-clock instant of PLATED -> BAKING; null before that" }
      - { name: bake_temp_c, type: number, source: input, description: "Relief-bake temperature in Celsius; null before bake start" }
      - { name: bake_duration_min, type: integer, source: input, description: "Committed relief-bake soak minutes; null before bake start" }
      - { name: bake_delay_hours, type: number, source: computed, description: "Hours from plated_at to bake_started_at; see calculations.he_bake_compliance" }
      - { name: bake_completed_at, type: datetime, source: system, description: "Logical-clock instant the run reached BAKE_COMPLETE; null before that" }
      - { name: status, type: enum, source: computed, description: "SCHEDULED | PLATED | BAKING | BAKE_COMPLETE | SUPERSEDED", default: SCHEDULED }

  - name: LotTest
    parent: ProductionLot
    common_fields: true
    fields:
      - { name: production_lot_id, type: string, source: input, description: "FK -> ProductionLot.id; lot sampled" }
      - { name: severity, type: enum, source: computed, description: "NORMAL | TIGHTENED — see calculations.lot_sampling_plan" }
      - { name: sample_size, type: integer, source: computed, description: "Pieces drawn; see calculations.lot_sampling_plan" }
      - { name: acceptance_number, type: integer, source: computed, description: "Maximum tolerated failures; see calculations.lot_sampling_plan" }
      - { name: destructive, type: boolean, source: input, description: "Whether sampled pieces are consumed", default: true }
      - { name: proof_load_failures, type: integer, source: input, description: "Sample pieces failing proof load; null while PENDING", constraints: ">= 0 and <= sample_size" }
      - { name: tensile_failures, type: integer, source: input, description: "Sample pieces failing tensile; null while PENDING", constraints: ">= 0 and <= sample_size" }
      - { name: min_measured_core_hardness_hv, type: number, source: input, description: "Lowest core hardness measured across the sample; null while PENDING" }
      - { name: total_failures, type: integer, source: computed, description: "proof_load_failures + tensile_failures; null while PENDING" }
      - { name: result, type: enum, source: computed, description: "PENDING | ACCEPT | REJECT", default: PENDING }
      - { name: performed_by_user_id, type: string, source: system, description: "X-User-ID of the QualityInspector who created the test; segregation-of-duties key" }
      - { name: completed_at, type: datetime, source: system, description: "Logical-clock instant results were recorded; null while PENDING" }

  - name: CertificationDocument
    parent: null
    common_fields: true
    fields:
      - { name: production_lot_id, type: string, source: input, description: "FK -> ProductionLot.id; certified lot" }
      - { name: lot_test_id, type: string, source: input, description: "FK -> LotTest.id; test cited by the certificate" }
      - { name: cert_serial, type: string, source: input, description: "Certificate serial printed on the document", constraints: "unique across CertificationDocument" }
      - { name: revision, type: integer, source: computed, description: "1 on first draft; incremented by each reissue", default: 1 }
      - { name: pinned_part_spec_version, type: integer, source: system, description: "ProductionLot.pinned_part_spec_version copied at draft time" }
      - { name: certified_strength_class, type: enum, source: computed, description: "CLASS_8_8 | CLASS_10_9 | CLASS_12_9 | GRADE_5 | GRADE_8 — ProductionLot.achieved_strength_class at draft time" }
      - { name: traceability_chain, type: object, source: computed, description: "Frozen provenance object; see calculations.traceability_chain_projection" }
      - { name: status, type: enum, source: computed, description: "DRAFT | ISSUED | REVOKED | REISSUE_PENDING", default: DRAFT }
      - { name: signed_by_user_id, type: string, source: system, description: "X-User-ID of the QualityManager who issued the document; null while DRAFT or REISSUE_PENDING" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant of the last transition into ISSUED; null before that" }
      - { name: revoked_reason, type: string, source: system, description: "Reason recorded on the last transition into REVOKED; null otherwise" }

  - name: PackUnit
    parent: ProductionLot
    common_fields: true
    fields:
      - { name: production_lot_id, type: string, source: input, description: "FK -> ProductionLot.id; lot packed into this unit" }
      - { name: certification_document_id, type: string, source: input, description: "FK -> CertificationDocument.id; certificate printed on the label; null until supplied" }
      - { name: label_serial, type: string, source: input, description: "Label serial", constraints: "unique across PackUnit" }
      - { name: pack_mode, type: enum, source: computed, description: "BY_COUNT | BY_WEIGHT — copied from PartSpec.packaging_mode at creation" }
      - { name: net_weight_kg, type: number, source: input, description: "Weighed net mass; required when pack_mode == BY_WEIGHT, otherwise null", constraints: "> 0 when supplied" }
      - { name: actual_count, type: integer, source: input, description: "Counted pieces; required when pack_mode == BY_COUNT, otherwise null", constraints: ">= 0 when supplied" }
      - { name: declared_count, type: integer, source: computed, description: "Pieces declared on the label; see calculations.pack_unit_count_reconciliation" }
      - { name: count_tolerance_pieces, type: integer, source: computed, description: "floor(PartSpec.nominal_pack_count * PartSpec.count_tolerance_pct)" }
      - { name: label_fields_complete, type: boolean, source: input, description: "Operator confirmation that the printed label carries the certificate serial, the lot code and the declared count; a pack opened without the confirmation can never ship", default: false }
      - { name: status, type: enum, source: computed, description: "OPEN | SEALED | SHIPPED | RECALLED", default: OPEN }
      - { name: sealed_at, type: datetime, source: system, description: "Logical-clock instant of OPEN -> SEALED; null before that" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical-clock instant of SEALED -> SHIPPED; null before that" }
      - { name: recall_reason, type: string, source: system, description: "Reason recorded on a transition into RECALLED; null otherwise" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: SteelHeat
    dimension: cert_status
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /steel-heats/{id}/verify-mill-cert with outcome=VERIFIED"
        actor: QualityInspector
        preconditions:
          - "cert_status IN {PENDING, SUSPECTED_COUNTERFEIT}"
          - "request mill_cert_serial equals SteelHeat.mill_cert_serial (else ERR_MILL_CERT_SERIAL_MISMATCH)"
        side_effects:
          - "cert_status = VERIFIED; verified_at = logical clock; verified_by_user_id = X-User-ID; lab_report_reference = request lab_report_reference"
          - "increments SteelHeat.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /steel-heats/{id}/verify-mill-cert with outcome=REJECTED"
        actor: QualityInspector
        preconditions:
          - "cert_status IN {PENDING, SUSPECTED_COUNTERFEIT}"
        side_effects:
          - "cert_status = REJECTED; lab_report_reference = request lab_report_reference"
          - "cascade link 1: every WireLot with steel_heat_id == this heat and status IN {DRAWN, RELEASED}, processed in created_at ASC order, becomes status = QUARANTINED, quarantine_source = HEAT_REJECTED"
          - "cascade link 2: for each WireLot quarantined by link 1, every ProductionLot with wire_lot_id == that WireLot.id and process_state NOT IN {SHIPPED, ABORTED}, processed in created_at ASC order, becomes disposition = QUARANTINED, hold_source = HEAT_COUNTERFEIT"
          - "increments SteelHeat.version by 1 and the version of every entity mutated by the cascade"
      - from: VERIFIED
        to: SUSPECTED_COUNTERFEIT
        trigger: "POST /steel-heats/{id}/flag-counterfeit"
        actor: QualityManager
        preconditions:
          - "cert_status IN {PENDING, VERIFIED}"
        side_effects:
          - "cert_status = SUSPECTED_COUNTERFEIT; counterfeit_reason = request reason"
          - "cascade link 1: every WireLot with steel_heat_id == this heat and status IN {DRAWN, RELEASED}, in created_at ASC order, becomes status = QUARANTINED, quarantine_source = HEAT_COUNTERFEIT"
          - "cascade link 2: caused by link 1 — every ProductionLot with wire_lot_id IN (the WireLots quarantined by link 1) and process_state NOT IN {ABORTED}, in created_at ASC order, becomes disposition = QUARANTINED, hold_source = HEAT_COUNTERFEIT"
          - "cascade link 3: caused by link 2 — every CertificationDocument with production_lot_id IN (the ProductionLots quarantined by link 2) and status IN {DRAFT, ISSUED, REISSUE_PENDING}, in created_at ASC order, becomes status = REVOKED, revoked_reason = 'HEAT_COUNTERFEIT'"
          - "cascade link 4: caused by link 3 — every PackUnit with certification_document_id IN (the CertificationDocuments revoked by link 3) and status IN {SEALED, SHIPPED}, in created_at ASC order, becomes status = RECALLED, recall_reason = 'HEAT_COUNTERFEIT'"
          - "increments SteelHeat.version by 1 and the version of every entity mutated by the cascade"
        note: "Four-link transitive chain: each link is triggered by the mutation performed by the previous link, not by the original request."
      - from: SUSPECTED_COUNTERFEIT
        to: VERIFIED
        trigger: "POST /steel-heats/{id}/verify-mill-cert with outcome=VERIFIED (re-verification against an independent lab report)"
        actor: QualityInspector
        preconditions:
          - "cert_status == SUSPECTED_COUNTERFEIT"
          - "request mill_cert_serial equals SteelHeat.mill_cert_serial"
        side_effects:
          - "cert_status = VERIFIED; verified_at = logical clock; verified_by_user_id = X-User-ID"
          - "compensating cascade: every WireLot with steel_heat_id == this heat and quarantine_source == HEAT_COUNTERFEIT, in created_at ASC order, becomes status = DRAWN, quarantine_source = NONE (re-release requires a fresh POST /wire-lots/{id}/release)"
          - "compensating cascade: every ProductionLot with hold_source == HEAT_COUNTERFEIT and disposition == QUARANTINED whose wire_lot_id is one of the WireLots restored above becomes disposition = IN_PROCESS, hold_source = NONE; revoked CertificationDocuments are NOT restored and remain REVOKED"
          - "increments SteelHeat.version by 1 and the version of every entity mutated by the cascade"
        note: "Cycle VERIFIED -> SUSPECTED_COUNTERFEIT -> VERIFIED; restoration is scoped by quarantine_source / hold_source tags so it never releases material quarantined for another reason."
      - from: SUSPECTED_COUNTERFEIT
        to: REJECTED
        trigger: "POST /steel-heats/{id}/verify-mill-cert with outcome=REJECTED"
        actor: QualityInspector
        preconditions:
          - "cert_status == SUSPECTED_COUNTERFEIT"
        side_effects:
          - "cert_status = REJECTED"
          - "increments SteelHeat.version by 1"

  - entity: WireLot
    dimension: status
    initial_state: DRAWN
    terminal_states: []
    transitions:
      - from: DRAWN
        to: RELEASED
        trigger: "POST /wire-lots/{id}/release"
        actor: QualityInspector
        preconditions:
          - "status == DRAWN"
          - "lubricant_coating != NONE AND coating_weight_gsm >= 2.0 (else ERR_LUBRICATION_INSUFFICIENT)"
          - "reduction_pct >= 8.0 AND reduction_pct <= 35.0 (else ERR_DRAW_REDUCTION_OUT_OF_RANGE)"
        side_effects:
          - "status = RELEASED; inspected_at = logical clock"
          - "increments WireLot.version by 1"
      - from: DRAWN
        to: QUARANTINED
        trigger: "system cascade from SteelHeat PENDING/VERIFIED -> SUSPECTED_COUNTERFEIT or -> REJECTED"
        actor: system
        preconditions:
          - "status IN {DRAWN, RELEASED}"
        side_effects:
          - "status = QUARANTINED; quarantine_source = HEAT_COUNTERFEIT or HEAT_REJECTED per triggering transition"
          - "increments WireLot.version by 1"
      - from: RELEASED
        to: QUARANTINED
        trigger: "system cascade from SteelHeat PENDING/VERIFIED -> SUSPECTED_COUNTERFEIT or -> REJECTED"
        actor: system
        preconditions:
          - "status IN {DRAWN, RELEASED}"
        side_effects:
          - "status = QUARANTINED; quarantine_source = HEAT_COUNTERFEIT or HEAT_REJECTED per triggering transition"
          - "increments WireLot.version by 1"
      - from: QUARANTINED
        to: DRAWN
        trigger: "system cascade from SteelHeat SUSPECTED_COUNTERFEIT -> VERIFIED"
        actor: system
        preconditions:
          - "quarantine_source == HEAT_COUNTERFEIT"
        side_effects:
          - "status = DRAWN; quarantine_source = NONE; inspected_at = null"
          - "increments WireLot.version by 1"

  - entity: HeadingTool
    dimension: status
    initial_state: AVAILABLE
    terminal_states: [SCRAPPED]
    transitions:
      - from: AVAILABLE
        to: MOUNTED
        trigger: "POST /heading-tools/{id}/mount"
        actor: ProcessEngineer
        preconditions:
          - "status == AVAILABLE"
        side_effects:
          - "status = MOUNTED; mounted_press_code = request press_code; condemn_reason = null"
          - "increments HeadingTool.version by 1"
      - from: MOUNTED
        to: WORN
        trigger: "system, at POST /production-lots/{id}/complete-heading when cumulative_pieces_current_cycle >= rated_derated_life_pieces after the increment"
        actor: system
        preconditions:
          - "status == MOUNTED"
          - "cumulative_pieces_current_cycle >= rated_derated_life_pieces"
        side_effects:
          - "status = WORN; mounted_press_code = null"
          - "cascade: every other ProductionLot with heading_tool_id == this tool and process_state == SETUP, in created_at ASC order, becomes disposition = HOLD, hold_source = TOOL_WEAR"
          - "increments HeadingTool.version by 1 and the version of every ProductionLot put on hold"
      - from: MOUNTED
        to: WORN
        trigger: "POST /heading-tools/{id}/condemn"
        actor: ProcessEngineer
        preconditions:
          - "status == MOUNTED"
        side_effects:
          - "status = WORN; condemn_reason = request reason; mounted_press_code = null"
          - "cascade: every ProductionLot with heading_tool_id == this tool and process_state == SETUP, in created_at ASC order, becomes disposition = HOLD, hold_source = TOOL_WEAR"
          - "increments HeadingTool.version by 1 and the version of every ProductionLot put on hold"
        note: "Operator path for a chipped or cracked die; ends the life cycle early so observed_avg_cycle_pieces can fall below the derated nameplate life."
      - from: WORN
        to: AVAILABLE
        trigger: "POST /heading-tools/{id}/regrind"
        actor: ProcessEngineer
        preconditions:
          - "status == WORN"
          - "regrind_count < max_regrinds"
        side_effects:
          - "cycle_pieces_history gets cumulative_pieces_current_cycle appended; completed_cycle_count and regrind_count each increment by 1; cumulative_pieces_current_cycle = 0"
          - "observed_avg_cycle_pieces, rated_derated_life_pieces and conservative_life_pieces recomputed per calculations.tool_effective_life"
          - "status = AVAILABLE; condemn_reason = null"
          - "increments HeadingTool.version by 1"
        note: "Closes the cycle AVAILABLE -> MOUNTED -> WORN -> AVAILABLE."
      - from: WORN
        to: SCRAPPED
        trigger: "POST /heading-tools/{id}/regrind when regrind_count == max_regrinds"
        actor: ProcessEngineer
        preconditions:
          - "status == WORN"
          - "regrind_count == max_regrinds"
        side_effects:
          - "cycle_pieces_history gets cumulative_pieces_current_cycle appended; completed_cycle_count increments by 1; status = SCRAPPED"
          - "increments HeadingTool.version by 1"
        note: "Branch out of the regrind cycle: same trigger, divergent target and side-effect set."

  - entity: ProductionLot
    dimension: process_state
    initial_state: SETUP
    terminal_states: [SHIPPED, ABORTED]
    transitions:
      - from: SETUP
        to: HEADED
        trigger: "POST /production-lots/{id}/complete-heading"
        actor: ProcessEngineer
        preconditions:
          - "process_state == SETUP"
          - "disposition == IN_PROCESS (else ERR_LOT_ON_HOLD or ERR_LOT_QUARANTINED)"
          - "HeadingTool.status == MOUNTED (else ERR_INVALID_TOOL_STATE)"
          - "headed_count + heading_scrap_count <= floor(planned_pieces * (1 + PartSpec.scrap_allowance_pct)) (else ERR_PIECE_COUNT_INVALID)"
        side_effects:
          - "headed_count = request headed_count; available_count = request headed_count; heading_scrap_count = request heading_scrap_count; scrap_count = request heading_scrap_count"
          - "wire ledger settlement per calculations.wire_mass_ledger: WireLot.consumed_mass_kg += wire_consumed_kg, WireLot.reserved_mass_kg -= wire_reserved_kg, WireLot.available_mass_kg += (wire_reserved_kg - wire_consumed_kg); ProductionLot.wire_reserved_kg = 0"
          - "cascade link 1: HeadingTool.cumulative_pieces_current_cycle += (headed_count + heading_scrap_count); HeadingTool.lifetime_pieces recomputed"
          - "tool_utilization_pct = round(100 * HeadingTool.cumulative_pieces_current_cycle / HeadingTool.rated_derated_life_pieces, 2) snapshotted on this lot"
          - "cascade link 2: caused by link 1 — when cumulative_pieces_current_cycle >= rated_derated_life_pieces the tool transitions MOUNTED -> WORN"
          - "cascade link 3: caused by link 2 — every other ProductionLot on that tool with process_state == SETUP becomes disposition = HOLD, hold_source = TOOL_WEAR"
          - "process_state = HEADED; increments ProductionLot.version, WireLot.version, HeadingTool.version by 1 each, plus the version of every lot put on hold"
      - from: SETUP
        to: ABORTED
        trigger: "POST /production-lots/{id}/abort-heading"
        actor: ProcessEngineer
        preconditions:
          - "process_state == SETUP"
        side_effects:
          - "compensating action for the reservation made at lot creation: WireLot.reserved_mass_kg -= wire_reserved_kg and WireLot.available_mass_kg += wire_reserved_kg, leaving WireLot.gross_mass_kg == available_mass_kg + reserved_mass_kg + consumed_mass_kg unchanged"
          - "wire_reserved_kg = 0; abort_reason = request reason; process_state = ABORTED; disposition = SCRAPPED"
          - "increments ProductionLot.version and WireLot.version by 1 each"
      - from: HEADED
        to: SECONDARY_IN_PROGRESS
        trigger: "POST /production-lots/{id}/secondary-operations"
        actor: ProcessEngineer
        preconditions:
          - "process_state IN {HEADED, HEAT_TREATED}"
          - "disposition == IN_PROCESS"
        side_effects:
          - "a SecondaryOperation is created in status PENDING; process_state = SECONDARY_IN_PROGRESS"
          - "increments ProductionLot.version by 1"
      - from: HEAT_TREATED
        to: SECONDARY_IN_PROGRESS
        trigger: "POST /production-lots/{id}/secondary-operations (AFTER_HEAT_TREAT thread rolling)"
        actor: ProcessEngineer
        preconditions:
          - "process_state == HEAT_TREATED"
          - "disposition == IN_PROCESS"
          - "PartSpec.thread_timing == AFTER_HEAT_TREAT for a THREAD_ROLL operation (else ERR_THREAD_TIMING_VIOLATION)"
        side_effects:
          - "a SecondaryOperation is created in status PENDING with performed_after_heat_treat = true; process_state = SECONDARY_IN_PROGRESS"
          - "increments ProductionLot.version by 1"
        note: "Closes the cycle SECONDARY_IN_PROGRESS -> SECONDARY_DONE -> HEAT_TREATED -> SECONDARY_IN_PROGRESS for AFTER_HEAT_TREAT parts."
      - from: SECONDARY_IN_PROGRESS
        to: SECONDARY_IN_PROGRESS
        trigger: "POST /production-lots/{id}/secondary-operations (queue the next operation of the same stage)"
        actor: ProcessEngineer
        preconditions:
          - "process_state == SECONDARY_IN_PROGRESS"
          - "disposition == IN_PROCESS"
          - "no SecondaryOperation of this lot is in status PENDING (else ERR_OP_SEQUENCE_CONFLICT)"
          - "sequence_no greater than every existing SecondaryOperation.sequence_no of the lot (else ERR_OP_SEQUENCE_CONFLICT)"
        side_effects:
          - "a SecondaryOperation is created in status PENDING with pieces_in = available_count; process_state stays SECONDARY_IN_PROGRESS"
          - "increments ProductionLot.version by 1"
        note: "Self-loop: a multi-operation route queues DRILL, SLOT and POINT one at a time; the lot only leaves SECONDARY_IN_PROGRESS once the stage's required op_types are all DONE."
      - from: SECONDARY_IN_PROGRESS
        to: SECONDARY_DONE
        trigger: "system, at POST /secondary-operations/{id}/complete when every op_type in PartSpec.required_secondary_ops that is due at this stage has a SecondaryOperation in status DONE"
        actor: system
        preconditions:
          - "no SecondaryOperation of this lot is in status PENDING"
          - "for thread_timing == BEFORE_HEAT_TREAT: every op_type in required_secondary_ops has a DONE operation; for thread_timing == AFTER_HEAT_TREAT and heat_treat_completed == false: every op_type in required_secondary_ops except THREAD_ROLL has a DONE operation"
        side_effects:
          - "process_state = SECONDARY_DONE; increments ProductionLot.version by 1"
      - from: SECONDARY_DONE
        to: HEAT_TREATED
        trigger: "system, at POST /heat-treat-runs/{id}/results with result == PASS"
        actor: system
        preconditions:
          - "process_state == SECONDARY_DONE AND heat_treat_completed == false"
        side_effects:
          - "heat_treat_completed = true; process_state = HEAT_TREATED; increments ProductionLot.version by 1"
      - from: SECONDARY_DONE
        to: PLATED
        trigger: "POST /plating-runs/{id}/complete-plating"
        actor: HeatTreatOperator
        preconditions:
          - "process_state IN {HEAT_TREATED, SECONDARY_DONE} AND heat_treat_completed == true"
          - "disposition == IN_PROCESS"
        side_effects:
          - "process_state = PLATED; PlatingRun.plated_at = logical clock; increments ProductionLot.version by 1"
        note: "Branch taken by AFTER_HEAT_TREAT parts, which re-enter secondary operations after heat treatment and therefore reach plating from SECONDARY_DONE."
      - from: HEAT_TREATED
        to: PLATED
        trigger: "POST /plating-runs/{id}/complete-plating"
        actor: HeatTreatOperator
        preconditions:
          - "process_state == HEAT_TREATED AND heat_treat_completed == true"
          - "disposition == IN_PROCESS"
        side_effects:
          - "process_state = PLATED; PlatingRun.plated_at = logical clock; increments ProductionLot.version by 1"
      - from: PLATED
        to: BAKED
        trigger: "POST /plating-runs/{id}/complete-bake"
        actor: HeatTreatOperator
        preconditions:
          - "process_state == PLATED"
          - "PlatingRun.status == BAKING when PartSpec.he_bake_required == true, else PlatingRun.status == PLATED"
        side_effects:
          - "process_state = BAKED; risk_score_pre_test computed per calculations.lot_release_risk_score pass 1; increments ProductionLot.version by 1"
      - from: BAKED
        to: TESTING
        trigger: "POST /lot-tests"
        actor: QualityInspector
        preconditions:
          - "process_state == BAKED, or process_state IN {HEAT_TREATED, SECONDARY_DONE} when PartSpec.plating_spec == NONE (else ERR_INVALID_LOT_STATE)"
          - "disposition == IN_PROCESS"
        side_effects:
          - "a LotTest is created; inspection_severity frozen; destructive_test_count += LotTest.sample_size and available_count -= LotTest.sample_size when destructive == true"
          - "process_state = TESTING; increments ProductionLot.version by 1"
      - from: HEAT_TREATED
        to: TESTING
        trigger: "POST /lot-tests (PartSpec.plating_spec == NONE)"
        actor: QualityInspector
        preconditions:
          - "PartSpec.plating_spec == NONE AND heat_treat_completed == true AND process_state IN {HEAT_TREATED, SECONDARY_DONE}"
          - "disposition == IN_PROCESS"
        side_effects:
          - "risk_score_pre_test computed per calculations.lot_release_risk_score pass 1 (bake_term = 0 for unplated parts); a LotTest is created; destructive_test_count += sample_size; available_count -= sample_size"
          - "process_state = TESTING; increments ProductionLot.version by 1"
      - from: SECONDARY_DONE
        to: TESTING
        trigger: "POST /lot-tests (PartSpec.plating_spec == NONE, AFTER_HEAT_TREAT parts)"
        actor: QualityInspector
        preconditions:
          - "PartSpec.plating_spec == NONE AND heat_treat_completed == true AND process_state == SECONDARY_DONE"
          - "disposition == IN_PROCESS"
        side_effects:
          - "risk_score_pre_test computed per calculations.lot_release_risk_score pass 1; a LotTest is created; destructive_test_count += sample_size; available_count -= sample_size"
          - "process_state = TESTING; increments ProductionLot.version by 1"
      - from: TESTING
        to: TESTING
        trigger: "POST /lot-tests (re-test of a lot whose previous LotTest came back REJECT)"
        actor: QualityInspector
        preconditions:
          - "process_state == TESTING AND every LotTest of the lot has result == REJECT (else ERR_INVALID_LOT_STATE)"
          - "disposition == IN_PROCESS — the TEST_REJECT hold must be released first"
        side_effects:
          - "a second LotTest is created; inspection_severity re-frozen as TIGHTENED because a REJECT exists on the same (part_spec_id, traceability_heat_id) pair; destructive_test_count += sample_size; available_count -= sample_size"
          - "process_state stays TESTING; increments ProductionLot.version by 1"
        note: "Self-loop on the process dimension: the retest keeps the lot in TESTING, so a certificate drafted afterwards may still cite the first, rejected test (ERR_TEST_NOT_ACCEPTED)."
      - from: TESTING
        to: TESTED
        trigger: "POST /lot-tests/{id}/results with result == ACCEPT"
        actor: QualityInspector
        preconditions:
          - "process_state == TESTING AND LotTest.result == PENDING"
        side_effects:
          - "achieved_strength_class and risk_score_final computed; process_state = TESTED; increments ProductionLot.version by 1"
      - from: TESTED
        to: CERTIFIED
        trigger: "POST /certification-documents/{id}/issue"
        actor: QualityManager
        preconditions:
          - "process_state == TESTED"
          - "CertificationDocument.status IN {DRAFT, REISSUE_PENDING}"
        side_effects:
          - "process_state = CERTIFIED; increments ProductionLot.version by 1"
      - from: CERTIFIED
        to: PACKED
        trigger: "POST /pack-units/{id}/seal"
        actor: ShippingClerk
        preconditions:
          - "process_state IN {CERTIFIED, PACKED}"
          - "disposition == IN_PROCESS"
        side_effects:
          - "packed_count += PackUnit.declared_count; available_count -= PackUnit.declared_count; process_state = PACKED"
          - "increments ProductionLot.version and PackUnit.version by 1 each"
      - from: PACKED
        to: CERTIFIED
        trigger: "POST /pack-units/{id}/reopen"
        actor: ShippingClerk
        preconditions:
          - "process_state == PACKED"
          - "PackUnit.status == SEALED"
        side_effects:
          - "compensating action for seal: packed_count -= PackUnit.declared_count and available_count += PackUnit.declared_count, leaving the conserved ledger headed_count + heading_scrap_count == available_count + scrap_count + destructive_test_count + packed_count unchanged"
          - "process_state = CERTIFIED when no PackUnit of this lot remains in status IN {SEALED, SHIPPED, RECALLED}, else stays PACKED"
          - "increments ProductionLot.version and PackUnit.version by 1 each"
      - from: PACKED
        to: SHIPPED
        trigger: "POST /pack-units/{id}/ship"
        actor: ShippingClerk
        preconditions:
          - "process_state == PACKED"
          - "every PackUnit of this lot is in status SHIPPED after this transition and at least one exists"
        side_effects:
          - "process_state = SHIPPED; increments ProductionLot.version by 1"

  - entity: ProductionLot
    dimension: disposition
    initial_state: IN_PROCESS
    terminal_states: [SCRAPPED]
    transitions:
      - from: IN_PROCESS
        to: HOLD
        trigger: "POST /production-lots/{id}/hold, or system cascade (tool wear at complete-heading; HeatTreatRun result FAIL_HARDNESS/FAIL_DECARB; LotTest result REJECT)"
        actor: QualityInspector | QualityManager | system
        preconditions:
          - "disposition == IN_PROCESS"
        side_effects:
          - "disposition = HOLD; hold_source = QUALITY for the operator path, TOOL_WEAR / HT_FAILURE / TEST_REJECT for the system paths"
          - "increments ProductionLot.version by 1"
        note: "Independent of process_state: a lot holds and releases without moving along the process dimension."
      - from: HOLD
        to: IN_PROCESS
        trigger: "POST /production-lots/{id}/release-hold"
        actor: QualityManager
        preconditions:
          - "disposition == HOLD"
          - "when hold_source == HEAT_COUNTERFEIT: SteelHeat(traceability_heat_id).cert_status == VERIFIED (else ERR_STEEL_HEAT_NOT_VERIFIED)"
        side_effects:
          - "disposition = IN_PROCESS; hold_source = NONE; increments ProductionLot.version by 1"
      - from: IN_PROCESS
        to: QUARANTINED
        trigger: "system cascade from SteelHeat -> SUSPECTED_COUNTERFEIT / REJECTED via WireLot quarantine"
        actor: system
        preconditions:
          - "disposition IN {IN_PROCESS, HOLD}"
          - "process_state != ABORTED"
        side_effects:
          - "disposition = QUARANTINED; hold_source = HEAT_COUNTERFEIT; increments ProductionLot.version by 1"
      - from: HOLD
        to: QUARANTINED
        trigger: "system cascade from SteelHeat -> SUSPECTED_COUNTERFEIT / REJECTED via WireLot quarantine"
        actor: system
        preconditions:
          - "disposition IN {IN_PROCESS, HOLD}"
          - "process_state != ABORTED"
        side_effects:
          - "disposition = QUARANTINED; hold_source = HEAT_COUNTERFEIT; increments ProductionLot.version by 1"
      - from: QUARANTINED
        to: IN_PROCESS
        trigger: "system compensating cascade from SteelHeat SUSPECTED_COUNTERFEIT -> VERIFIED"
        actor: system
        preconditions:
          - "disposition == QUARANTINED AND hold_source == HEAT_COUNTERFEIT"
        side_effects:
          - "disposition = IN_PROCESS; hold_source = NONE; increments ProductionLot.version by 1"
      - from: IN_PROCESS
        to: SCRAPPED
        trigger: "POST /production-lots/{id}/abort-heading"
        actor: ProcessEngineer
        preconditions:
          - "process_state == SETUP"
        side_effects:
          - "disposition = SCRAPPED (paired with process_state = ABORTED); increments ProductionLot.version by 1"

  - entity: SecondaryOperation
    dimension: status
    initial_state: PENDING
    terminal_states: [DONE]
    transitions:
      - from: PENDING
        to: DONE
        trigger: "POST /secondary-operations/{id}/complete"
        actor: ProcessEngineer
        preconditions:
          - "status == PENDING"
          - "ProductionLot.disposition == IN_PROCESS"
          - "request pieces_out <= pieces_in (else ERR_PIECE_COUNT_INVALID)"
        side_effects:
          - "pieces_out recorded; scrap_pieces = pieces_in - pieces_out; status = DONE"
          - "ProductionLot.available_count = pieces_out; ProductionLot.scrap_count += scrap_pieces"
          - "bubble-up: when the lot has no PENDING operation left and the stage's required op_types are DONE, ProductionLot.process_state = SECONDARY_DONE"
          - "increments SecondaryOperation.version and ProductionLot.version by 1 each"

  - entity: HeatTreatRun
    dimension: status
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: RUNNING
        trigger: "POST /heat-treat-runs/{id}/start"
        actor: HeatTreatOperator
        preconditions:
          - "status == PLANNED"
          - "Furnace.status == IDLE (else ERR_FURNACE_OCCUPIED)"
          - "logical clock >= window_start_at AND logical clock <= window_end_at (else ERR_OUTSIDE_RUN_WINDOW)"
          - "ProductionLot.disposition == IN_PROCESS AND ProductionLot.process_state == SECONDARY_DONE"
        side_effects:
          - "status = RUNNING; started_at = logical clock; Furnace.status = OCCUPIED"
          - "increments HeatTreatRun.version and Furnace.version by 1 each"
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /heat-treat-runs/{id}/results"
        actor: QualityInspector
        preconditions:
          - "status == RUNNING"
        side_effects:
          - "core_hardness_hv and surface_decarb_depth_mm recorded; total_decarb_depth_mm and result computed per calculations.heat_treat_metallurgy_evaluation"
          - "status = COMPLETED; completed_at = logical clock; Furnace.status = IDLE; Furnace.last_run_end_at = logical clock"
          - "on result == PASS: ProductionLot.heat_treat_completed = true and ProductionLot.process_state = HEAT_TREATED"
          - "on result IN {FAIL_HARDNESS, FAIL_DECARB}: ProductionLot.disposition = HOLD with hold_source = HT_FAILURE and process_state unchanged"
          - "increments HeatTreatRun.version, Furnace.version and ProductionLot.version by 1 each"

  - entity: PlatingRun
    dimension: status
    initial_state: SCHEDULED
    terminal_states: [BAKE_COMPLETE, SUPERSEDED]
    transitions:
      - from: SCHEDULED
        to: PLATED
        trigger: "POST /plating-runs/{id}/complete-plating"
        actor: HeatTreatOperator
        preconditions:
          - "status == SCHEDULED"
          - "ProductionLot.disposition == IN_PROCESS"
        side_effects:
          - "status = PLATED; plated_at = logical clock; ProductionLot.process_state = PLATED"
          - "increments PlatingRun.version and ProductionLot.version by 1 each"
      - from: PLATED
        to: BAKING
        trigger: "POST /plating-runs/{id}/start-bake"
        actor: HeatTreatOperator
        preconditions:
          - "status == PLATED"
          - "PartSpec.he_bake_required == true (else ERR_BAKE_NOT_REQUIRED)"
          - "bake_delay_hours <= 4.0 (else ERR_HE_BAKE_WINDOW_MISSED)"
          - "request bake_temp_c >= 190 AND <= 230 AND request bake_duration_min >= PartSpec.he_bake_min_minutes (else ERR_HE_BAKE_PARAMS_INVALID)"
        side_effects:
          - "status = BAKING; bake_started_at = logical clock; bake_delay_hours and bake parameters recorded"
          - "increments PlatingRun.version by 1"
      - from: BAKING
        to: BAKE_COMPLETE
        trigger: "POST /plating-runs/{id}/complete-bake"
        actor: HeatTreatOperator
        preconditions:
          - "status == BAKING"
          - "logical clock >= bake_started_at + bake_duration_min minutes (else ERR_BAKE_DURATION_NOT_ELAPSED)"
        side_effects:
          - "status = BAKE_COMPLETE; bake_completed_at = logical clock; ProductionLot.process_state = BAKED and risk_score_pre_test computed"
          - "increments PlatingRun.version and ProductionLot.version by 1 each"
      - from: PLATED
        to: BAKE_COMPLETE
        trigger: "POST /plating-runs/{id}/complete-bake when PartSpec.he_bake_required == false"
        actor: HeatTreatOperator
        preconditions:
          - "status == PLATED"
          - "PartSpec.he_bake_required == false"
        side_effects:
          - "status = BAKE_COMPLETE; bake_completed_at = logical clock; bake_delay_hours stays null; ProductionLot.process_state = BAKED and risk_score_pre_test computed with bake_term = 0"
          - "increments PlatingRun.version and ProductionLot.version by 1 each"
        note: "Branch: no-bake parts skip BAKING entirely and carry a different side-effect set (no bake parameters recorded)."
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system, when a newer PlatingRun is created for the same ProductionLot (strip and replate)"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, PLATED}"
        side_effects:
          - "status = SUPERSEDED; increments PlatingRun.version by 1"
      - from: PLATED
        to: SUPERSEDED
        trigger: "system, when a newer PlatingRun is created for the same ProductionLot (strip and replate)"
        actor: system
        preconditions:
          - "status IN {SCHEDULED, PLATED}"
        side_effects:
          - "status = SUPERSEDED; increments PlatingRun.version by 1"

  - entity: LotTest
    dimension: result
    initial_state: PENDING
    terminal_states: [ACCEPT, REJECT]
    transitions:
      - from: PENDING
        to: ACCEPT
        trigger: "POST /lot-tests/{id}/results when total_failures <= acceptance_number"
        actor: QualityInspector
        preconditions:
          - "result == PENDING"
          - "request proof_load_failures + tensile_failures <= sample_size (else ERR_PIECE_COUNT_INVALID)"
        side_effects:
          - "total_failures recorded; result = ACCEPT; completed_at = logical clock"
          - "ProductionLot.achieved_strength_class computed per calculations.certified_strength_class; risk_score_final computed per calculations.lot_release_risk_score pass 2; ProductionLot.process_state = TESTED"
          - "increments LotTest.version and ProductionLot.version by 1 each"
      - from: PENDING
        to: REJECT
        trigger: "POST /lot-tests/{id}/results when total_failures > acceptance_number"
        actor: QualityInspector
        preconditions:
          - "result == PENDING"
        side_effects:
          - "total_failures recorded; result = REJECT; completed_at = logical clock"
          - "ProductionLot.disposition = HOLD with hold_source = TEST_REJECT; process_state stays TESTING; risk_score_final computed"
          - "increments LotTest.version and ProductionLot.version by 1 each"
        note: "A rejected lot released from hold may be re-tested; the next LotTest for the same PartSpec + traceability_heat_id pair computes severity TIGHTENED."

  - entity: CertificationDocument
    dimension: status
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /certification-documents/{id}/issue"
        actor: QualityManager
        preconditions:
          - "status IN {DRAFT, REISSUE_PENDING}"
          - "ProductionLot.process_state == TESTED AND ProductionLot.disposition == IN_PROCESS"
          - "pinned_part_spec_version == PartSpec.version (else ERR_PART_SPEC_VERSION_DRIFT)"
        side_effects:
          - "status = ISSUED; issued_at = logical clock; signed_by_user_id = X-User-ID; ProductionLot.process_state = CERTIFIED"
          - "increments CertificationDocument.version and ProductionLot.version by 1 each"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /certification-documents/{id}/revoke, or system cascade link 3 of the counterfeit chain"
        actor: QualityManager | system
        preconditions:
          - "status IN {DRAFT, ISSUED, REISSUE_PENDING}"
        side_effects:
          - "status = REVOKED; revoked_reason recorded"
          - "cascade: every PackUnit with certification_document_id == this document and status IN {SEALED, SHIPPED}, in created_at ASC order, becomes status = RECALLED with recall_reason = revoked_reason"
          - "ProductionLot.disposition = HOLD with hold_source = QUALITY when the revoke came from the operator endpoint and disposition == IN_PROCESS"
          - "increments CertificationDocument.version, ProductionLot.version and the version of every recalled PackUnit by 1 each"
      - from: REVOKED
        to: REISSUE_PENDING
        trigger: "POST /certification-documents/{id}/reissue"
        actor: QualityManager
        preconditions:
          - "status == REVOKED"
          - "ProductionLot.disposition == IN_PROCESS (else ERR_LOT_ON_HOLD / ERR_LOT_QUARANTINED)"
        side_effects:
          - "cert_serial = request cert_serial; revision += 1; status = REISSUE_PENDING; signed_by_user_id = null; traceability_chain recomputed per calculations.traceability_chain_projection"
          - "increments CertificationDocument.version by 1"
      - from: REISSUE_PENDING
        to: ISSUED
        trigger: "POST /certification-documents/{id}/issue"
        actor: QualityManager
        preconditions:
          - "status == REISSUE_PENDING"
          - "pinned_part_spec_version == PartSpec.version"
        side_effects:
          - "status = ISSUED; issued_at = logical clock; signed_by_user_id = X-User-ID"
          - "increments CertificationDocument.version by 1"
        note: "Closes the cycle ISSUED -> REVOKED -> REISSUE_PENDING -> ISSUED."

  - entity: PackUnit
    dimension: status
    initial_state: OPEN
    terminal_states: [RECALLED]
    transitions:
      - from: OPEN
        to: SEALED
        trigger: "POST /pack-units/{id}/seal"
        actor: ShippingClerk
        preconditions:
          - "status == OPEN"
          - "ProductionLot.process_state IN {CERTIFIED, PACKED} AND disposition == IN_PROCESS"
          - "abs(declared_count - PartSpec.nominal_pack_count) <= count_tolerance_pieces (else ERR_PACK_COUNT_OUT_OF_TOLERANCE)"
          - "declared_count <= ProductionLot.available_count (else ERR_PIECE_COUNT_INVALID)"
        side_effects:
          - "status = SEALED; sealed_at = logical clock; ProductionLot.packed_count += declared_count; ProductionLot.available_count -= declared_count; ProductionLot.process_state = PACKED"
          - "increments PackUnit.version and ProductionLot.version by 1 each"
      - from: SEALED
        to: OPEN
        trigger: "POST /pack-units/{id}/reopen"
        actor: ShippingClerk
        preconditions:
          - "status == SEALED"
        side_effects:
          - "status = OPEN; sealed_at = null; ProductionLot.packed_count -= declared_count; ProductionLot.available_count += declared_count; ProductionLot.process_state = CERTIFIED when no other PackUnit of the lot is in status IN {SEALED, SHIPPED, RECALLED}"
          - "increments PackUnit.version and ProductionLot.version by 1 each"
      - from: SEALED
        to: SHIPPED
        trigger: "POST /pack-units/{id}/ship"
        actor: ShippingClerk
        preconditions:
          - "status == SEALED"
          - "label_fields_complete == true (else ERR_PACK_LABEL_INCOMPLETE)"
          - "CertificationDocument(certification_document_id).status == ISSUED (else ERR_CERT_NOT_ISSUED)"
          - "CertificationDocument(certification_document_id).production_lot_id == this production_lot_id (else ERR_CERT_LOT_MISMATCH)"
        side_effects:
          - "status = SHIPPED; shipped_at = logical clock; ProductionLot.process_state = SHIPPED when every PackUnit of the lot is SHIPPED"
          - "increments PackUnit.version and ProductionLot.version by 1 each"
      - from: SEALED
        to: RECALLED
        trigger: "system cascade from CertificationDocument -> REVOKED"
        actor: system
        preconditions:
          - "status IN {SEALED, SHIPPED}"
        side_effects:
          - "status = RECALLED; recall_reason recorded; ProductionLot.packed_count unchanged (recalled pieces stay accounted as packed)"
          - "increments PackUnit.version by 1"
      - from: SHIPPED
        to: RECALLED
        trigger: "system cascade from CertificationDocument -> REVOKED"
        actor: system
        preconditions:
          - "status IN {SEALED, SHIPPED}"
        side_effects:
          - "status = RECALLED; recall_reason recorded"
          - "increments PackUnit.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's version — the only sanctioned mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: production-lot-create-stale-wire-lot
    parent_entity: WireLot
    write_endpoint: "POST /production-lots"
    occ_field: "expected_wire_lot_version"
    description: |
      Creating a ProductionLot against a WireLot whose version has advanced since the client last
      observed it is rejected. A second writer may legitimately reserve mass from the same wire lot
      (mass reservations coexist), so the request would otherwise succeed on its own merits; the
      stale expected_wire_lot_version is what the system rejects, because the client's view of
      available_mass_kg predates the earlier reservation or quarantine.
    error_id: ERR_STALE_WIRE_LOT_VERSION
    http_status: 412

  - rule_id: certification-draft-stale-production-lot
    parent_entity: ProductionLot
    write_endpoint: "POST /certification-documents"
    occ_field: "expected_production_lot_version"
    description: |
      Drafting a CertificationDocument against a ProductionLot whose version has advanced since the
      client last observed it is rejected. A new draft legitimately supersedes an earlier draft for
      the same lot, so the write is not blocked by any state precondition; the stale
      expected_production_lot_version is what the system rejects, because the drafting client's view
      of the lot's test, risk and disposition fields predates the earlier mutation.
    error_id: ERR_STALE_PRODUCTION_LOT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: wire_draw_reduction
    trigger: "At POST /wire-lots, from inlet_diameter_mm and outlet_diameter_mm"
    algorithm: threshold
    formula: |
      area_ratio = (outlet_diameter_mm / inlet_diameter_mm) ** 2
      reduction_pct = round_half_up((1 - area_ratio) * 100, 2)
      # release gate, evaluated at POST /wire-lots/{id}/release, both bounds inclusive:
      draw_acceptable = (reduction_pct >= MIN_REDUCTION_PCT) AND (reduction_pct <= MAX_REDUCTION_PCT)
      lubrication_acceptable = (lubricant_coating != NONE) AND (coating_weight_gsm >= MIN_COATING_GSM)
    input_set: "The WireLot's own inlet/outlet diameters; no other entity participates"
    constants:
      MIN_REDUCTION_PCT: 8.0
      MAX_REDUCTION_PCT: 35.0
      MIN_COATING_GSM: 2.0
    precision: "reduction_pct 2 decimal places, round_half_up; comparisons on the rounded value"

  - name: wire_mass_ledger
    trigger: "Reservation at POST /production-lots; settlement at POST /production-lots/{id}/complete-heading; reversal at POST /production-lots/{id}/abort-heading"
    algorithm: aggregation
    formula: |
      # 1. reservation (lot creation)
      required_kg = round_half_up(planned_pieces * PartSpec.blank_mass_g * (1 + PartSpec.scrap_allowance_pct) / 1000, 3)
      require WireLot.available_mass_kg >= required_kg          # else ERR_WIRE_MASS_INSUFFICIENT
      WireLot.available_mass_kg -= required_kg
      WireLot.reserved_mass_kg  += required_kg
      ProductionLot.wire_reserved_kg = required_kg

      # 2. settlement (heading completion)
      consumed_kg = round_half_up((headed_count + heading_scrap_count) * PartSpec.blank_mass_g / 1000, 3)
      WireLot.reserved_mass_kg  -= ProductionLot.wire_reserved_kg
      WireLot.consumed_mass_kg  += consumed_kg
      WireLot.available_mass_kg += (ProductionLot.wire_reserved_kg - consumed_kg)   # may be negative when over-consumed
      ProductionLot.wire_consumed_kg = consumed_kg
      ProductionLot.wire_reserved_kg = 0

      # 3. reversal (heading abort) — exact compensation of step 1
      WireLot.reserved_mass_kg  -= ProductionLot.wire_reserved_kg
      WireLot.available_mass_kg += ProductionLot.wire_reserved_kg
      ProductionLot.wire_reserved_kg = 0

      # conserved invariant, true after every one of the three operations:
      WireLot.gross_mass_kg == WireLot.available_mass_kg + WireLot.reserved_mass_kg + WireLot.consumed_mass_kg
    input_set: "ProductionLots of the WireLot whose process_state is not ABORTED contribute reservations and consumption; ABORTED lots contribute nothing (their reservation was reversed)"
    constants:
      GRAMS_PER_KG: 1000
    precision: "kilogram amounts 3 decimal places, round_half_up; the invariant is checked on the rounded stored values"

  - name: tool_effective_life
    trigger: "Recomputed at POST /heading-tools (initial), at POST /heading-tools/{id}/regrind, and read at POST /production-lots (capacity gate) and POST /production-lots/{id}/complete-heading (wear evaluation)"
    algorithm: decay_function
    formula: |
      rated_derated_life_pieces = floor(rated_life_pieces * (1 - DERATE_PER_REGRIND * regrind_count))

      if completed_cycle_count == 0:
          observed_avg_cycle_pieces = null
          conservative_life_pieces  = rated_derated_life_pieces
      else:
          observed_avg_cycle_pieces = round_half_up(sum(cycle_pieces_history) / completed_cycle_count, 2)
          conservative_life_pieces  = floor(min(rated_derated_life_pieces,
                                                observed_avg_cycle_pieces * OBSERVED_SAFETY_FACTOR))

      # capacity gate at lot creation (variant-selected life budget below):
      remaining = life_budget - cumulative_pieces_current_cycle
      require ceil(planned_pieces * (1 + PartSpec.scrap_allowance_pct)) <= remaining   # else ERR_TOOL_LIFE_EXHAUSTED

      # wear evaluation after heading, always against the rated derated life:
      tool_utilization_pct = round_half_up(100 * cumulative_pieces_current_cycle / rated_derated_life_pieces, 2)
      if cumulative_pieces_current_cycle >= rated_derated_life_pieces: tool becomes WORN
    input_set: "cycle_pieces_history holds one entry per completed cycle, appended at regrind or scrap in chronological order; the open cycle's cumulative_pieces_current_cycle is excluded from the average"
    constants:
      DERATE_PER_REGRIND: 0.15
      OBSERVED_SAFETY_FACTOR: 0.90
      MAX_REGRINDS: 3
    precision: "life budgets are integers via floor; observed_avg_cycle_pieces and tool_utilization_pct 2 decimal places, round_half_up"
    variants:
      - name: rated_derated
        when: "PartSpec.qualification_program IN {NONE, AUTOMOTIVE_PPAP} — the lot being created is not aerospace-qualified"
        difference: "life_budget = rated_derated_life_pieces; the observed history is ignored entirely, so a tool whose real cycles ran short still offers its full nameplate life minus the regrind derate"
      - name: conservative_observed
        when: "PartSpec.qualification_program == AEROSPACE_NADCAP"
        difference: "life_budget = conservative_life_pieces, i.e. min(rated_derated_life_pieces, observed_avg_cycle_pieces * 0.90); with a history of short cycles this is strictly smaller than the rated_derated variant, so the same tool accepts an automotive lot and rejects the identically sized aerospace lot"

  - name: heat_treat_charge_mass
    trigger: "At POST /heat-treat-runs"
    algorithm: aggregation
    formula: |
      charge_mass_kg = round_half_up(ProductionLot.available_count * PartSpec.blank_mass_g / 1000, 3)
      require charge_mass_kg <= Furnace.max_charge_mass_kg      # else ERR_FURNACE_CAPACITY_EXCEEDED
    input_set: "Only the lot named by production_lot_id; one lot per run, so no aggregation across lots"
    constants:
      GRAMS_PER_KG: 1000
    precision: "3 decimal places, round_half_up; the capacity comparison is inclusive"

  - name: heat_treat_metallurgy_evaluation
    trigger: "At POST /heat-treat-runs/{id}/results"
    algorithm: threshold
    formula: |
      # decarburization amplification: a lean atmosphere multiplies the measured surface loss
      carbon_deficit_pct    = max(0, LEAN_ATMOSPHERE_THRESHOLD - carbon_potential_pct)
      total_decarb_depth_mm = round_half_up(surface_decarb_depth_mm * (1 + DECARB_AMPLIFIER * carbon_deficit_pct), 3)

      # evaluation order is pinned: hardness first, decarburization second
      if NOT (PartSpec.min_core_hardness_hv <= core_hardness_hv <= PartSpec.max_core_hardness_hv):
          result = FAIL_HARDNESS
      elif total_decarb_depth_mm > PartSpec.max_decarb_depth_mm:
          result = FAIL_DECARB
      else:
          result = PASS
    input_set: "The run's own recorded coupon values plus the PartSpec pinned on the lot at creation (pinned_part_spec_version), never the current PartSpec"
    constants:
      LEAN_ATMOSPHERE_THRESHOLD: 0.40
      DECARB_AMPLIFIER: 2.0
    precision: "total_decarb_depth_mm 3 decimal places, round_half_up; both hardness bounds inclusive; the decarburization limit is exceeded only when strictly greater"

  - name: he_bake_compliance
    trigger: "At POST /plating-runs/{id}/start-bake (window and parameters) and POST /plating-runs/{id}/complete-bake (elapsed soak)"
    algorithm: threshold
    formula: |
      bake_delay_hours = round_half_up((now - PlatingRun.plated_at) / 3600, 3)      # seconds -> hours
      require bake_delay_hours <= MAX_BAKE_DELAY_HOURS                              # else ERR_HE_BAKE_WINDOW_MISSED
      require BAKE_TEMP_MIN_C <= bake_temp_c <= BAKE_TEMP_MAX_C                     # else ERR_HE_BAKE_PARAMS_INVALID
      require bake_duration_min >= PartSpec.he_bake_min_minutes                      # else ERR_HE_BAKE_PARAMS_INVALID
      # at complete-bake:
      require now >= PlatingRun.bake_started_at + bake_duration_min minutes          # else ERR_BAKE_DURATION_NOT_ELAPSED
      # he_bake_required / he_bake_min_minutes are themselves derived on the PartSpec:
      he_bake_required   = (plating_spec != NONE) AND (strength_class IN EMBRITTLEMENT_CLASSES)
      he_bake_min_minutes = 0 if he_bake_required == false
                            else (480 if strength_class IN {CLASS_12_9, GRADE_8} else 240)
    input_set: "The newest non-SUPERSEDED PlatingRun of the lot; superseded runs never gate the bake"
    constants:
      MAX_BAKE_DELAY_HOURS: 4.0
      BAKE_TEMP_MIN_C: 190
      BAKE_TEMP_MAX_C: 230
      EMBRITTLEMENT_CLASSES: [CLASS_10_9, CLASS_12_9, GRADE_8]
    precision: "bake_delay_hours 3 decimal places, round_half_up; all three window/parameter bounds inclusive, so exactly 4.000 h, exactly 190 C and exactly 230 C all pass"

  - name: lot_sampling_plan
    trigger: "At POST /lot-tests, before the LotTest row is written"
    algorithm: threshold
    formula: |
      available = ProductionLot.available_count
      severity  = TIGHTENED if (ProductionLot.risk_score_pre_test >= TIGHTEN_RISK_THRESHOLD
                                OR exists LotTest with result == REJECT whose ProductionLot has the same
                                   (part_spec_id, traceability_heat_id) pair as this lot)
                            else NORMAL
      # variant-selected sample size and acceptance number (see variants)
      require available >= sample_size                # else ERR_INSUFFICIENT_SAMPLE_PIECES
      ProductionLot.inspection_severity  = severity   # frozen here; later risk changes do not re-derive it
      ProductionLot.destructive_test_count += sample_size
      ProductionLot.available_count        -= sample_size
      # at POST /lot-tests/{id}/results:
      total_failures = proof_load_failures + tensile_failures
      result = ACCEPT if total_failures <= acceptance_number else REJECT
    input_set: "Severity looks at every LotTest in the database, not only this lot's: any REJECT on the same part number and the same steel heat tightens the plan. Sample size reads available_count at the moment of test creation, after secondary-operation scrap has been booked."
    constants:
      TIGHTEN_RISK_THRESHOLD: 40.0
      NORMAL_MIN_SAMPLE: 8
      TIGHTENED_MIN_SAMPLE: 13
      TIGHTENED_SQRT_FACTOR: 1.5
      ACCEPTANCE_SAMPLE_THRESHOLD: 20
    precision: "sample sizes are integers via ceil then max; acceptance numbers are integers"
    variants:
      - name: normal_inspection
        when: "severity == NORMAL"
        difference: "sample_size = max(8, ceil(sqrt(available))); acceptance_number = 1 when sample_size >= 20, else 0 — so a single failure is tolerated on any lot of 400 pieces or more, and a lot holding fewer than 8 available pieces cannot be sampled at all"
      - name: tightened_inspection
        when: "severity == TIGHTENED"
        difference: "sample_size = max(13, ceil(1.5 * sqrt(available))); acceptance_number = 0 unconditionally — the same measured failure count that ACCEPTs under normal inspection REJECTs under tightened inspection, and the sampling floor of 13 pieces is itself unreachable for a nearly exhausted lot"

  - name: lot_release_risk_score
    trigger: "Pass 1 when the lot reaches BAKED (POST /plating-runs/{id}/complete-bake) or, for unplated parts, at POST /lot-tests; pass 2 at POST /lot-tests/{id}/results"
    algorithm: weighted_scoring
    formula: |
      # ---- pass 1: process risk, computed BEFORE any test result exists ----
      heat_term   = 0 if SteelHeat(traceability_heat_id).cert_status == VERIFIED else 25
      tool_term   = min(100, ProductionLot.tool_utilization_pct)
      if PartSpec.he_bake_required == false:
          bake_term = 0
      else:
          d = PlatingRun.bake_delay_hours
          bake_term = 0 if d <= BAKE_FREE_DELAY_HOURS else min(100, (d - BAKE_FREE_DELAY_HOURS) * BAKE_DELAY_SLOPE)
      decarb_term = min(100, round_half_up(100 * HeatTreatRun.total_decarb_depth_mm / PartSpec.max_decarb_depth_mm, 2))

      risk_score_pre_test = round_half_up(W_HEAT * heat_term + W_TOOL * tool_term
                                          + W_BAKE * bake_term + W_DECARB * decarb_term, 2)
      # ---- pass 2: adds test evidence to the frozen pass-1 value ----
      risk_score_final = round_half_up(min(100, risk_score_pre_test + FAILURE_PENALTY * LotTest.total_failures), 2)
      # certification gate at POST /certification-documents/{id}/issue:
      require risk_score_final <= MAX_CERTIFIABLE_RISK          # else ERR_RISK_SCORE_TOO_HIGH
    input_set: "Pass 1 reads the HeatTreatRun of this lot in status COMPLETED with result PASS that has the greatest window_end_at (tie-break created_at ASC) and the newest non-SUPERSEDED PlatingRun; pass 2 reads only the LotTest being resulted. Pass 1 is never recomputed after pass 2 runs, and inspection_severity is derived from the pass-1 value only."
    constants:
      W_HEAT: 0.30
      W_TOOL: 0.20
      W_BAKE: 0.25
      W_DECARB: 0.25
      UNVERIFIED_HEAT_PENALTY: 25
      BAKE_FREE_DELAY_HOURS: 2.0
      BAKE_DELAY_SLOPE: 40
      FAILURE_PENALTY: 12.5
      MAX_CERTIFIABLE_RISK: 55.00
    precision: "each term is capped at 100 before weighting; decarb_term is rounded to 2 decimals before capping; the weighted sum is rounded once at the end to 2 decimal places, round_half_up — never term by term"

  - name: certified_strength_class
    trigger: "At POST /lot-tests/{id}/results, from min_measured_core_hardness_hv"
    algorithm: threshold
    formula: |
      hv = LotTest.min_measured_core_hardness_hv
      if band_of(PartSpec.strength_class) contains hv:
          achieved_strength_class = PartSpec.strength_class
      else:
          # fixed evaluation order, highest class first; bands overlap, so the order is normative
          for cls in [CLASS_12_9, CLASS_10_9, GRADE_8, CLASS_8_8, GRADE_5]:
              if band_of(cls) contains hv: achieved_strength_class = cls; break
          else: achieved_strength_class = NONE
      # certification gate:
      require achieved_strength_class == PartSpec.strength_class   # else ERR_STRENGTH_CLASS_NOT_ACHIEVED
    input_set: "Only the LotTest being resulted; the PartSpec is the version pinned on the lot"
    constants:
      BAND_CLASS_8_8: [242, 318]
      BAND_CLASS_10_9: [304, 361]
      BAND_CLASS_12_9: [366, 414]
      BAND_GRADE_5: [241, 302]
      BAND_GRADE_8: [321, 352]
    precision: "hardness compared as recorded; both band bounds inclusive"

  - name: pack_unit_count_reconciliation
    trigger: "At POST /pack-units (declared count derivation) and POST /pack-units/{id}/seal (tolerance gate)"
    algorithm: aggregation
    formula: |
      count_tolerance_pieces = floor(PartSpec.nominal_pack_count * PartSpec.count_tolerance_pct)

      if PartSpec.packaging_mode == BY_COUNT:
          declared_count = request actual_count
      else:   # BY_WEIGHT — rounding happens PER PACK, then packs are summed
          declared_count = round_half_up(net_weight_kg * PartSpec.pieces_per_kg)     # integer, this pack only
      lot_declared_total = sum(declared_count of each PackUnit of the lot)            # sum of already-rounded per-pack values

      # seal gate:
      require abs(declared_count - PartSpec.nominal_pack_count) <= count_tolerance_pieces  # else ERR_PACK_COUNT_OUT_OF_TOLERANCE
      require declared_count <= ProductionLot.available_count                              # else ERR_PIECE_COUNT_INVALID
      require label_fields_complete == true at ship time                                   # else ERR_PACK_LABEL_INCOMPLETE

      # conserved piece ledger, true after every seal, reopen, test and secondary operation:
      headed_count + heading_scrap_count
        == available_count + scrap_count + destructive_test_count + packed_count
    input_set: "PackUnits of the lot in status SEALED, SHIPPED or RECALLED contribute to packed_count; OPEN units contribute nothing; RECALLED units keep contributing (recalled pieces left the lot)"
    constants:
      PIECES_PER_KG_SOURCE: "PartSpec.pieces_per_kg"
    precision: "declared_count is an integer via round_half_up applied to each pack's own weight, never to the summed weight; count_tolerance_pieces via floor"

  - name: traceability_chain_projection
    trigger: "At POST /certification-documents, at POST /certification-documents/{id}/reissue, and read by GET /production-lots/{id}/traceability"
    algorithm: projection
    formula: |
      heat  = SteelHeat(ProductionLot.traceability_heat_id)
      wire  = WireLot(ProductionLot.wire_lot_id)
      tool  = HeadingTool(ProductionLot.heading_tool_id)
      ht    = the HeatTreatRun of the lot with status == COMPLETED and result == PASS having the greatest
              window_end_at; tie-break created_at ASC (earliest created wins)
      plate = the PlatingRun of the lot with status == BAKE_COMPLETE having the greatest bake_started_at;
              tie-break created_at ASC; null when PartSpec.plating_spec == NONE
      traceability_chain = {
        heat_number: heat.heat_number, mill_code: heat.mill_code, mill_cert_serial: heat.mill_cert_serial,
        cert_status: heat.cert_status, wire_lot_reduction_pct: wire.reduction_pct,
        lubricant_coating: wire.lubricant_coating, tool_code: tool.tool_code,
        tool_regrind_count: tool.regrind_count, tool_utilization_pct: ProductionLot.tool_utilization_pct,
        austenitize_temp_c: ht.austenitize_temp_c, core_hardness_hv: ht.core_hardness_hv,
        total_decarb_depth_mm: ht.total_decarb_depth_mm,
        bake_delay_hours: plate.bake_delay_hours, bake_duration_min: plate.bake_duration_min,
        pinned_part_spec_version: ProductionLot.pinned_part_spec_version
      }
      # counterfeit prevention gate at draft time:
      require heat.cert_status == VERIFIED                    # else ERR_STEEL_HEAT_NOT_VERIFIED
      # aerospace-only gate:
      if PartSpec.qualification_program == AEROSPACE_NADCAP:
          require ProductionLot.tool_utilization_pct <= AEROSPACE_MAX_TOOL_UTILIZATION_PCT   # else ERR_AEROSPACE_TOOL_UTILIZATION_EXCEEDED
    input_set: "Only COMPLETED+PASS heat treat runs and BAKE_COMPLETE plating runs enter the chain; failed, running and superseded runs are excluded even when they are the most recent rows"
    constants:
      AEROSPACE_MAX_TOOL_UTILIZATION_PCT: 80.00
    precision: "values are copied as stored; no re-rounding at projection time"

# =============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority; the first
#      violated rule decides the response and no later rule runs)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the six declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: business_constraint
    check: "Request body and query parameters satisfy the endpoint's declared schema: required fields present, enum values in range, numbers within declared constraints, datetimes ISO-8601 UTC, press_window_end_at > press_window_start_at, window_end_at > window_start_at, planned_pieces >= 1, sequence_no >= 1, limit in 1..200, offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Every resource named by a path placeholder exists, validated left to right"
    error_id: "ERR_PART_SPEC_NOT_FOUND | ERR_STEEL_HEAT_NOT_FOUND | ERR_WIRE_LOT_NOT_FOUND | ERR_HEADING_TOOL_NOT_FOUND | ERR_FURNACE_NOT_FOUND | ERR_PRODUCTION_LOT_NOT_FOUND | ERR_SECONDARY_OPERATION_NOT_FOUND | ERR_HEAT_TREAT_RUN_NOT_FOUND | ERR_PLATING_RUN_NOT_FOUND | ERR_LOT_TEST_NOT_FOUND | ERR_CERT_DOCUMENT_NOT_FOUND | ERR_PACK_UNIT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path placeholder"

  - priority: 5
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row, validated in the order the fields appear in the endpoint's input list"
    error_id: "ERR_PART_SPEC_NOT_FOUND | ERR_STEEL_HEAT_NOT_FOUND | ERR_WIRE_LOT_NOT_FOUND | ERR_HEADING_TOOL_NOT_FOUND | ERR_FURNACE_NOT_FOUND | ERR_PRODUCTION_LOT_NOT_FOUND | ERR_LOT_TEST_NOT_FOUND | ERR_CERT_DOCUMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /wire-lots, POST /production-lots, POST /heat-treat-runs, POST /plating-runs, POST /lot-tests, POST /certification-documents, POST /pack-units"

  - priority: 6
    category: business_constraint
    check: "SteelHeat.mill_cert_serial is unique across all steel heats — the counterfeit-prevention register admits one mill certificate serial exactly once"
    error_id: ERR_DUPLICATE_MILL_CERT_SERIAL
    http_status: 409
    applies_to: "POST /steel-heats"

  - priority: 6
    category: business_constraint
    check: "Business identifiers are unique in their scope: PartSpec.part_number, ProductionLot.lot_code, HeadingTool.tool_code, Furnace.furnace_code, CertificationDocument.cert_serial, PackUnit.label_serial globally; SecondaryOperation.sequence_no per production_lot_id"
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /part-specs, POST /production-lots, POST /heading-tools, POST /furnaces, POST /certification-documents, POST /certification-documents/{id}/reissue, POST /pack-units, POST /production-lots/{id}/secondary-operations"

  - priority: 7
    category: state
    check: "expected_wire_lot_version equals the referenced WireLot's current version (§1.2.1 production-lot-create-stale-wire-lot)"
    error_id: ERR_STALE_WIRE_LOT_VERSION
    http_status: 412
    applies_to: "POST /production-lots"

  - priority: 7
    category: state
    check: "expected_production_lot_version equals the referenced ProductionLot's current version (§1.2.1 certification-draft-stale-production-lot)"
    error_id: ERR_STALE_PRODUCTION_LOT_VERSION
    http_status: 412
    applies_to: "POST /certification-documents"

  - priority: 8
    category: state
    check: "The ProductionLot in scope has disposition != QUARANTINED — quarantined material is frozen ahead of every other business check, including its own hold state"
    error_id: ERR_LOT_QUARANTINED
    http_status: 409
    applies_to: "every mutating endpoint whose target or parent is a ProductionLot: POST /production-lots/{id}/complete-heading, /abort-heading, /hold, /release-hold, /secondary-operations, POST /secondary-operations/{id}/complete, POST /heat-treat-runs, POST /heat-treat-runs/{id}/start, /results, POST /plating-runs, POST /plating-runs/{id}/complete-plating, /start-bake, /complete-bake, POST /lot-tests, POST /lot-tests/{id}/results, POST /certification-documents, POST /certification-documents/{id}/issue, /reissue, POST /pack-units, POST /pack-units/{id}/seal, /reopen, /ship"

  - priority: 9
    category: state
    check: "The ProductionLot in scope has disposition != HOLD; release-hold is the only mutating endpoint exempt from this rule"
    error_id: ERR_LOT_ON_HOLD
    http_status: 409
    applies_to: "same list as priority 8, excluding POST /production-lots/{id}/release-hold and POST /production-lots/{id}/hold"

  - priority: 10
    category: state
    check: "The target ProductionLot's process_state permits the requested transition per §1.2 ProductionLot.process_state, including the secondary-operation queue gate (HEADED, HEAT_TREATED or SECONDARY_IN_PROGRESS) and the lot-test entry gate (BAKED, or HEAT_TREATED/SECONDARY_DONE when PartSpec.plating_spec == NONE, or TESTING when every existing LotTest of the lot came back REJECT)"
    error_id: ERR_INVALID_LOT_STATE
    http_status: 409
    applies_to: "POST /production-lots/{id}/complete-heading, /abort-heading, /secondary-operations, POST /lot-tests, POST /certification-documents, POST /pack-units, POST /pack-units/{id}/seal, /reopen, /ship"

  - priority: 10
    category: state
    check: "The target HeadingTool's status permits the requested transition per §1.2 HeadingTool (mount needs AVAILABLE, condemn needs MOUNTED, regrind needs WORN)"
    error_id: ERR_INVALID_TOOL_STATE
    http_status: 409
    applies_to: "POST /heading-tools/{id}/mount, /condemn, /regrind"

  - priority: 10
    category: state
    check: "The target SteelHeat's cert_status permits the requested transition (verify needs PENDING or SUSPECTED_COUNTERFEIT; flag-counterfeit needs PENDING or VERIFIED; REJECTED is terminal)"
    error_id: ERR_INVALID_HEAT_STATE
    http_status: 409
    applies_to: "POST /steel-heats/{id}/verify-mill-cert, POST /steel-heats/{id}/flag-counterfeit"

  - priority: 10
    category: state
    check: "The target WireLot's status permits release (status == DRAWN; QUARANTINED and already RELEASED lots are rejected)"
    error_id: ERR_INVALID_WIRE_LOT_STATE
    http_status: 409
    applies_to: "POST /wire-lots/{id}/release"

  - priority: 10
    category: state
    check: "The target SecondaryOperation is still PENDING"
    error_id: ERR_INVALID_SECONDARY_OP_STATE
    http_status: 409
    applies_to: "POST /secondary-operations/{id}/complete"

  - priority: 10
    category: state
    check: "The target HeatTreatRun or PlatingRun status permits the requested transition per §1.2 (start needs PLANNED, results needs RUNNING, complete-plating needs SCHEDULED, start-bake needs PLATED, complete-bake needs BAKING or PLATED-with-no-bake-required; SUPERSEDED runs reject everything)"
    error_id: ERR_INVALID_PROCESS_RUN_STATE
    http_status: 409
    applies_to: "POST /heat-treat-runs/{id}/start, /results, POST /plating-runs/{id}/complete-plating, /start-bake, /complete-bake"

  - priority: 10
    category: state
    check: "The target CertificationDocument's status permits the requested transition (issue needs DRAFT or REISSUE_PENDING, revoke needs DRAFT/ISSUED/REISSUE_PENDING, reissue needs REVOKED)"
    error_id: ERR_INVALID_CERT_STATE
    http_status: 409
    applies_to: "POST /certification-documents/{id}/issue, /revoke, /reissue"

  - priority: 10
    category: state
    check: "The target PackUnit's status permits the requested transition (seal needs OPEN, reopen needs SEALED, ship needs SEALED; RECALLED is terminal)"
    error_id: ERR_INVALID_PACK_UNIT_STATE
    http_status: 409
    applies_to: "POST /pack-units/{id}/seal, /reopen, /ship"

  - priority: 11
    category: state
    check: "Cross-entity state — the ProductionLot's HeadingTool must be MOUNTED when heading completes; a tool condemned or worn mid-lot blocks the completion report"
    error_id: ERR_INVALID_TOOL_STATE
    http_status: 409
    applies_to: "POST /production-lots/{id}/complete-heading"

  - priority: 11
    category: state
    check: "Cross-entity state — the WireLot named at lot creation must be in status RELEASED"
    error_id: ERR_WIRE_LOT_NOT_RELEASED
    http_status: 409
    applies_to: "POST /production-lots"

  - priority: 11
    category: state
    check: "Cross-entity state — the SteelHeat behind the lot must have cert_status == VERIFIED at wire-lot release, at lot creation, at certification draft and at hold release with hold_source HEAT_COUNTERFEIT"
    error_id: ERR_STEEL_HEAT_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /wire-lots/{id}/release, POST /production-lots, POST /certification-documents, POST /production-lots/{id}/release-hold"

  - priority: 11
    category: state
    check: "Cross-entity state — the Furnace named by the run must be IDLE when the run starts"
    error_id: ERR_FURNACE_OCCUPIED
    http_status: 409
    applies_to: "POST /heat-treat-runs/{id}/start"

  - priority: 11
    category: state
    check: "Cross-entity state — heat treatment must have completed with result PASS (ProductionLot.heat_treat_completed == true) before plating is scheduled or completed"
    error_id: ERR_HEAT_TREAT_NOT_PASSED
    http_status: 409
    applies_to: "POST /plating-runs, POST /plating-runs/{id}/complete-plating"

  - priority: 12
    category: business_safety
    check: "Segregation of duties — the acting X-User-ID must differ from LotTest.performed_by_user_id of the test cited by the certificate; the inspector who ran the destructive test cannot sign or reissue its certificate"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /certification-documents/{id}/issue, POST /certification-documents/{id}/reissue"

  - priority: 13
    category: business_safety
    check: "Hydrogen-embrittlement relief bake must start within MAX_BAKE_DELAY_HOURS (4.0, inclusive) of plating completion"
    error_id: ERR_HE_BAKE_WINDOW_MISSED
    http_status: 422
    applies_to: "POST /plating-runs/{id}/start-bake"

  - priority: 13
    category: business_safety
    check: "Bake temperature within 190..230 C inclusive and bake_duration_min >= PartSpec.he_bake_min_minutes"
    error_id: ERR_HE_BAKE_PARAMS_INVALID
    http_status: 422
    applies_to: "POST /plating-runs/{id}/start-bake"

  - priority: 13
    category: business_safety
    check: "The bake soak must have fully elapsed on the logical clock before the bake is marked complete"
    error_id: ERR_BAKE_DURATION_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /plating-runs/{id}/complete-bake"

  - priority: 13
    category: business_safety
    check: "The lot's achieved_strength_class, derived from the test's minimum measured core hardness, equals PartSpec.strength_class"
    error_id: ERR_STRENGTH_CLASS_NOT_ACHIEVED
    http_status: 422
    applies_to: "POST /certification-documents"

  - priority: 13
    category: business_safety
    check: "Thread rolling timing matches the PartSpec: a THREAD_ROLL operation created after heat treatment requires thread_timing == AFTER_HEAT_TREAT, and one created before requires thread_timing == BEFORE_HEAT_TREAT"
    error_id: ERR_THREAD_TIMING_VIOLATION
    http_status: 422
    applies_to: "POST /production-lots/{id}/secondary-operations"

  - priority: 13
    category: business_safety
    check: "Aerospace-qualified parts cap the die-life consumption recorded on the lot at AEROSPACE_MAX_TOOL_UTILIZATION_PCT (80.00, inclusive)"
    error_id: ERR_AEROSPACE_TOOL_UTILIZATION_EXCEEDED
    http_status: 422
    applies_to: "POST /certification-documents"

  - priority: 13
    category: business_safety
    check: "Wire must carry a lubricant coating other than NONE with coating_weight_gsm >= 2.0 before release to heading"
    error_id: ERR_LUBRICATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /wire-lots/{id}/release"

  - priority: 13
    category: business_safety
    check: "Drawing reduction per the wire lot must land in 8.0..35.0 percent inclusive"
    error_id: ERR_DRAW_REDUCTION_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /wire-lots/{id}/release"

  - priority: 13
    category: business_safety
    check: "The mill_cert_serial supplied with a verification must match the serial recorded on the steel heat — a mismatch is a counterfeit-certificate signal, not a typo"
    error_id: ERR_MILL_CERT_SERIAL_MISMATCH
    http_status: 422
    applies_to: "POST /steel-heats/{id}/verify-mill-cert"

  - priority: 14
    category: business_referential
    check: "The LotTest cited by a certificate belongs to the same ProductionLot as the certificate"
    error_id: ERR_TEST_LOT_MISMATCH
    http_status: 409
    applies_to: "POST /certification-documents"

  - priority: 14
    category: business_referential
    check: "The LotTest cited by a certificate has result == ACCEPT; evaluated after the same-priority ERR_TEST_LOT_MISMATCH row, so a foreign test reports the mismatch and only a same-lot non-accepted test reaches this rule (a lot retested after a REJECT still holds its rejected first test)"
    error_id: ERR_TEST_NOT_ACCEPTED
    http_status: 409
    applies_to: "POST /certification-documents"

  - priority: 14
    category: business_referential
    check: "The CertificationDocument named by a pack unit belongs to the same ProductionLot as the pack unit"
    error_id: ERR_CERT_LOT_MISMATCH
    http_status: 409
    applies_to: "POST /pack-units, POST /pack-units/{id}/ship"

  - priority: 14
    category: business_referential
    check: "The pack unit's certificate is in status ISSUED at ship time"
    error_id: ERR_CERT_NOT_ISSUED
    http_status: 409
    applies_to: "POST /pack-units/{id}/ship"

  - priority: 14
    category: business_referential
    check: "The certificate's pinned_part_spec_version still equals PartSpec.version — a spec revised after the lot was drafted forces a reissue rather than a silent re-pin"
    error_id: ERR_PART_SPEC_VERSION_DRIFT
    http_status: 409
    applies_to: "POST /certification-documents/{id}/issue"

  - priority: 15
    category: business_temporal
    check: "The requested press window must not overlap another non-ABORTED ProductionLot's window on the same HeadingTool; windows are half-open [start, end), so a window starting exactly when another ends is accepted"
    error_id: ERR_TOOL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /production-lots"

  - priority: 15
    category: business_temporal
    check: "The requested furnace window must not overlap another non-terminal HeatTreatRun's window on the same Furnace, where each existing window is extended by Furnace.cooldown_minutes and both endpoints are inclusive: conflict when new_start <= other_end + cooldown AND new_end >= other_start"
    error_id: ERR_FURNACE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /heat-treat-runs"

  - priority: 15
    category: business_temporal
    check: "A furnace run may only be started inside its declared window: window_start_at <= now <= window_end_at"
    error_id: ERR_OUTSIDE_RUN_WINDOW
    http_status: 422
    applies_to: "POST /heat-treat-runs/{id}/start"

  - priority: 16
    category: business_constraint
    check: "The wire lot's steel grade must be listed in PartSpec.allowed_steel_grades"
    error_id: ERR_GRADE_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /production-lots"

  - priority: 16
    category: business_constraint
    check: "A new secondary operation's sequence_no must be greater than every existing operation's sequence_no on the lot, and no other operation of the lot may still be PENDING"
    error_id: ERR_OP_SEQUENCE_CONFLICT
    http_status: 409
    applies_to: "POST /production-lots/{id}/secondary-operations"

  - priority: 16
    category: business_constraint
    check: "Every op_type in PartSpec.required_secondary_ops due at this stage has a DONE SecondaryOperation before the lot may be charged into a furnace or tested"
    error_id: ERR_SECONDARY_OPS_INCOMPLETE
    http_status: 422
    applies_to: "POST /heat-treat-runs, POST /lot-tests"

  - priority: 16
    category: business_constraint
    check: "A relief bake may only be started for a part whose he_bake_required is true"
    error_id: ERR_BAKE_NOT_REQUIRED
    http_status: 409
    applies_to: "POST /plating-runs/{id}/start-bake"

  - priority: 16
    category: business_constraint
    check: "Piece counts stay internally consistent: headed_count + heading_scrap_count <= floor(planned_pieces * (1 + scrap_allowance_pct)); pieces_out <= pieces_in; proof_load_failures + tensile_failures <= sample_size; a pack unit's declared_count <= ProductionLot.available_count"
    error_id: ERR_PIECE_COUNT_INVALID
    http_status: 422
    applies_to: "POST /production-lots/{id}/complete-heading, POST /secondary-operations/{id}/complete, POST /lot-tests/{id}/results, POST /pack-units/{id}/seal"

  - priority: 16
    category: business_constraint
    check: "The lot has at least sample_size pieces available for the destructive sampling plan"
    error_id: ERR_INSUFFICIENT_SAMPLE_PIECES
    http_status: 422
    applies_to: "POST /lot-tests"

  - priority: 16
    category: business_constraint
    check: "A sealed pack's declared_count is within count_tolerance_pieces of PartSpec.nominal_pack_count"
    error_id: ERR_PACK_COUNT_OUT_OF_TOLERANCE
    http_status: 422
    applies_to: "POST /pack-units/{id}/seal"

  - priority: 16
    category: business_constraint
    check: "Label fields are complete before a pack unit ships"
    error_id: ERR_PACK_LABEL_INCOMPLETE
    http_status: 422
    applies_to: "POST /pack-units/{id}/ship"

  - priority: 16
    category: business_constraint
    check: "The lot's risk_score_final is at most MAX_CERTIFIABLE_RISK (55.00, inclusive)"
    error_id: ERR_RISK_SCORE_TOO_HIGH
    http_status: 422
    applies_to: "POST /certification-documents/{id}/issue"

  - priority: 17
    category: business_fiscal
    check: "The wire lot has enough available mass for the lot's reservation: available_mass_kg >= required_kg"
    error_id: ERR_WIRE_MASS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /production-lots"

  - priority: 17
    category: business_fiscal
    check: "The heading tool has enough remaining life for the planned run under the variant selected by the part's qualification_program"
    error_id: ERR_TOOL_LIFE_EXHAUSTED
    http_status: 422
    applies_to: "POST /production-lots"

  - priority: 17
    category: business_fiscal
    check: "The computed charge_mass_kg does not exceed Furnace.max_charge_mass_kg"
    error_id: ERR_FURNACE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /heat-treat-runs"

# =============================================================================
# §1.5 API Endpoint Table  (api_prefix is "/", so every path below is absolute)
# =============================================================================
endpoints:
  - method: POST
    path: "/part-specs"
    description: "Register a fastener part specification. he_bake_required and he_bake_min_minutes are derived from plating_spec and strength_class per calculations.he_bake_compliance."
    roles: [ProcessEngineer, PlantAdmin]
    code: 201
    input: [part_number, thread_designation, strength_class, qualification_program, allowed_steel_grades, blank_mass_g, station_count_required, thread_timing, required_secondary_ops, min_core_hardness_hv, max_core_hardness_hv, max_decarb_depth_mm, plating_spec, packaging_mode, nominal_pack_count, pieces_per_kg, proof_load_kn, "scrap_allowance_pct?", "count_tolerance_pct?"]
    output: PartSpec
    side_effects: ["derives he_bake_required and he_bake_min_minutes", "applies defaults scrap_allowance_pct=0.05 and count_tolerance_pct=0.02 when omitted", "version starts at 1"]

  - method: GET
    path: "/part-specs/{id}"
    description: "Read one part specification"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: []
    output: PartSpec
    side_effects: []

  - method: PATCH
    path: "/part-specs/{id}"
    description: "Revise the metallurgical and packaging limits of a part specification. Lots already created keep their pinned_part_spec_version, so a revision after drafting a certificate surfaces as ERR_PART_SPEC_VERSION_DRIFT at issue time."
    roles: [ProcessEngineer, PlantAdmin]
    code: 200
    input: ["min_core_hardness_hv?", "max_core_hardness_hv?", "max_decarb_depth_mm?", "nominal_pack_count?", "count_tolerance_pct?", "plating_spec?", "proof_load_kn?"]
    output: PartSpec
    side_effects: ["increments PartSpec.version by 1", "re-derives he_bake_required and he_bake_min_minutes when plating_spec changes", "never re-pins any existing ProductionLot or CertificationDocument"]

  - method: POST
    path: "/steel-heats"
    description: "Record an incoming steel heat with its mill test report serial"
    roles: [ProcessEngineer, QualityInspector, PlantAdmin]
    code: 201
    input: [heat_number, mill_code, grade, carbon_pct, boron_ppm, gross_mass_kg, mill_cert_serial]
    output: SteelHeat
    side_effects: ["cert_status starts at PENDING", "rejects a mill_cert_serial already present in the register with ERR_DUPLICATE_MILL_CERT_SERIAL"]

  - method: GET
    path: "/steel-heats/{id}"
    description: "Read one steel heat"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: []
    output: SteelHeat
    side_effects: []

  - method: POST
    path: "/steel-heats/{id}/verify-mill-cert"
    description: "Verify or reject a mill test report against an independent lab report; also the re-verification path out of SUSPECTED_COUNTERFEIT"
    roles: [QualityInspector]
    code: 200
    input: [outcome, mill_cert_serial, lab_report_reference]
    output: SteelHeat
    side_effects: ["cert_status -> VERIFIED or REJECTED", "on VERIFIED from SUSPECTED_COUNTERFEIT: restores WireLots tagged quarantine_source HEAT_COUNTERFEIT to DRAWN and their ProductionLots to IN_PROCESS; revoked certificates stay revoked", "on REJECTED: quarantines the heat's WireLots and their ProductionLots", "increments SteelHeat.version by 1 and the version of every cascaded entity"]

  - method: POST
    path: "/steel-heats/{id}/flag-counterfeit"
    description: "Flag a mill test report as suspected counterfeit, freezing every downstream artefact through a four-link cascade"
    roles: [QualityManager]
    code: 200
    input: [reason]
    output: SteelHeat
    side_effects: ["cert_status -> SUSPECTED_COUNTERFEIT", "link 1: WireLots of the heat -> QUARANTINED", "link 2: ProductionLots of those wire lots -> disposition QUARANTINED", "link 3: CertificationDocuments of those lots -> REVOKED", "link 4: PackUnits of those certificates -> RECALLED", "increments SteelHeat.version by 1 and the version of every cascaded entity"]

  - method: POST
    path: "/wire-lots"
    description: "Record a drawn and lubricant-coated wire lot; reduction_pct is derived from the diameters"
    roles: [ProcessEngineer, PlantAdmin]
    code: 201
    input: [steel_heat_id, draw_pass_count, inlet_diameter_mm, outlet_diameter_mm, lubricant_coating, coating_weight_gsm, gross_mass_kg]
    output: WireLot
    side_effects: ["computes reduction_pct per calculations.wire_draw_reduction", "available_mass_kg = gross_mass_kg; reserved_mass_kg = 0; consumed_mass_kg = 0", "status starts at DRAWN"]

  - method: GET
    path: "/wire-lots/{id}"
    description: "Read one wire lot including its mass ledger"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: []
    output: WireLot
    side_effects: []

  - method: GET
    path: "/wire-lots"
    description: "List wire lots, filterable by originating steel heat and status"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: ["steel_heat_id?", "status?", "limit?", "offset?"]
    output: WireLot[]
    side_effects: []

  - method: POST
    path: "/wire-lots/{id}/release"
    description: "Release a drawn wire lot to heading after checking lubrication, reduction and heat verification"
    roles: [QualityInspector]
    code: 200
    input: []
    output: WireLot
    side_effects: ["status DRAWN -> RELEASED; inspected_at = logical clock", "increments WireLot.version by 1"]

  - method: POST
    path: "/heading-tools"
    description: "Register a progressive cold-heading die set"
    roles: [ProcessEngineer, PlantAdmin]
    code: 201
    input: [tool_code, station_count, rated_life_pieces, "max_regrinds?"]
    output: HeadingTool
    side_effects: ["status starts at AVAILABLE; regrind_count = 0; cumulative_pieces_current_cycle = 0; cycle_pieces_history = []", "rated_derated_life_pieces and conservative_life_pieces initialised per calculations.tool_effective_life", "applies default max_regrinds=3 when omitted"]

  - method: GET
    path: "/heading-tools/{id}"
    description: "Read one heading tool including its life counters"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: []
    output: HeadingTool
    side_effects: []

  - method: POST
    path: "/heading-tools/{id}/mount"
    description: "Mount an available tool on a press, opening a life cycle"
    roles: [ProcessEngineer]
    code: 200
    input: [press_code]
    output: HeadingTool
    side_effects: ["status AVAILABLE -> MOUNTED; mounted_press_code recorded", "increments HeadingTool.version by 1"]

  - method: POST
    path: "/heading-tools/{id}/condemn"
    description: "Condemn a mounted tool early (chipped or cracked die), closing its cycle below nameplate life"
    roles: [ProcessEngineer, QualityInspector]
    code: 200
    input: [reason]
    output: HeadingTool
    side_effects: ["status MOUNTED -> WORN; condemn_reason recorded", "cascade: SETUP lots on this tool -> disposition HOLD with hold_source TOOL_WEAR", "increments HeadingTool.version by 1 and the version of every lot put on hold"]

  - method: POST
    path: "/heading-tools/{id}/regrind"
    description: "Regrind a worn tool back to service, or scrap it when the regrind allowance is exhausted"
    roles: [ProcessEngineer]
    code: 200
    input: []
    output: HeadingTool
    side_effects: ["appends the closed cycle to cycle_pieces_history and resets cumulative_pieces_current_cycle to 0", "status WORN -> AVAILABLE with regrind_count + 1, or WORN -> SCRAPPED when regrind_count already equals max_regrinds", "recomputes observed_avg_cycle_pieces, rated_derated_life_pieces and conservative_life_pieces", "increments HeadingTool.version by 1"]

  - method: POST
    path: "/furnaces"
    description: "Register a heat treatment furnace with its charge capacity and cooldown"
    roles: [ProcessEngineer, PlantAdmin]
    code: 201
    input: [furnace_code, max_charge_mass_kg, "cooldown_minutes?"]
    output: Furnace
    side_effects: ["status starts at IDLE", "applies default cooldown_minutes=30 when omitted"]

  - method: GET
    path: "/furnaces/{id}"
    description: "Read one furnace"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: []
    output: Furnace
    side_effects: []

  - method: POST
    path: "/production-lots"
    description: "Open a production lot: pins the part spec version, reserves wire mass, books the press window on the tool and checks remaining tool life under the part's qualification programme. expected_wire_lot_version carries the WireLot version the client last observed (§1.2.1)."
    roles: [ProcessEngineer]
    code: 201
    input: [lot_code, part_spec_id, wire_lot_id, heading_tool_id, press_code, press_window_start_at, press_window_end_at, planned_pieces, expected_wire_lot_version]
    output: ProductionLot
    side_effects: ["pinned_part_spec_version = PartSpec.version; traceability_heat_id = WireLot.steel_heat_id", "reserves wire mass per calculations.wire_mass_ledger step 1", "increments WireLot.version by 1", "process_state SETUP, disposition IN_PROCESS"]

  - method: GET
    path: "/production-lots/{id}"
    description: "Read one production lot with its piece ledger, risk scores and both state dimensions"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: []
    output: ProductionLot
    side_effects: []

  - method: GET
    path: "/production-lots"
    description: "List production lots, filterable by part spec, wire lot, tool, traceability heat and either state dimension"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: ["part_spec_id?", "wire_lot_id?", "heading_tool_id?", "traceability_heat_id?", "process_state?", "disposition?", "limit?", "offset?"]
    output: ProductionLot[]
    side_effects: []

  - method: GET
    path: "/production-lots/{id}/traceability"
    description: "Computed read of the lot's traceability chain per calculations.traceability_chain_projection, available before any certificate exists"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: []
    output: { heat_number: string, mill_code: string, mill_cert_serial: string, cert_status: string, wire_lot_reduction_pct: number, lubricant_coating: string, tool_code: string, tool_regrind_count: integer, tool_utilization_pct: number, austenitize_temp_c: number, core_hardness_hv: number, total_decarb_depth_mm: number, bake_delay_hours: number, bake_duration_min: integer, pinned_part_spec_version: integer }
    side_effects: []

  - method: POST
    path: "/production-lots/{id}/complete-heading"
    description: "Report heading completion: settles the wire ledger, advances the tool life counter and may wear the tool out, holding its other queued lots"
    roles: [ProcessEngineer]
    code: 200
    input: [headed_count, heading_scrap_count]
    output: ProductionLot
    side_effects: ["process_state SETUP -> HEADED; headed_count, heading_scrap_count, scrap_count and available_count set", "settles the wire ledger per calculations.wire_mass_ledger step 2 and increments WireLot.version by 1", "advances HeadingTool.cumulative_pieces_current_cycle and snapshots tool_utilization_pct", "may transition the tool MOUNTED -> WORN, which holds the tool's other SETUP lots with hold_source TOOL_WEAR", "increments ProductionLot.version and HeadingTool.version by 1 each"]

  - method: POST
    path: "/production-lots/{id}/abort-heading"
    description: "Abort a lot still in setup, reversing its wire reservation exactly"
    roles: [ProcessEngineer]
    code: 200
    input: [reason]
    output: ProductionLot
    side_effects: ["process_state SETUP -> ABORTED; disposition -> SCRAPPED; abort_reason recorded", "reverses the reservation per calculations.wire_mass_ledger step 3 and increments WireLot.version by 1", "increments ProductionLot.version by 1"]

  - method: POST
    path: "/production-lots/{id}/hold"
    description: "Put a lot on quality hold without moving it along the process dimension"
    roles: [QualityInspector, QualityManager]
    code: 200
    input: [reason]
    output: ProductionLot
    side_effects: ["disposition IN_PROCESS -> HOLD with hold_source QUALITY", "increments ProductionLot.version by 1"]

  - method: POST
    path: "/production-lots/{id}/release-hold"
    description: "Release a held lot; a lot held for a counterfeit heat cannot be released until the heat is verified again"
    roles: [QualityManager]
    code: 200
    input: ["note?"]
    output: ProductionLot
    side_effects: ["disposition HOLD -> IN_PROCESS with hold_source NONE", "increments ProductionLot.version by 1"]

  - method: POST
    path: "/production-lots/{id}/secondary-operations"
    description: "Queue the next secondary operation (thread rolling, drilling, slotting, pointing) on the lot; pieces_in is taken from the lot's current available_count"
    roles: [ProcessEngineer]
    code: 201
    input: [op_type, sequence_no, machine_code]
    output: SecondaryOperation
    side_effects: ["creates a SecondaryOperation in status PENDING with pieces_in = ProductionLot.available_count and performed_after_heat_treat = ProductionLot.heat_treat_completed", "ProductionLot.process_state -> SECONDARY_IN_PROGRESS from HEADED or from HEAT_TREATED", "increments ProductionLot.version by 1"]

  - method: GET
    path: "/production-lots/{id}/secondary-operations"
    description: "List the lot's secondary operations in sequence order"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SecondaryOperation[]
    side_effects: []

  - method: POST
    path: "/secondary-operations/{id}/complete"
    description: "Close a secondary operation with its piece yield; bubbles the lot up to SECONDARY_DONE once the stage's required operations are all done"
    roles: [ProcessEngineer]
    code: 200
    input: [pieces_out]
    output: SecondaryOperation
    side_effects: ["status PENDING -> DONE; scrap_pieces = pieces_in - pieces_out", "ProductionLot.available_count = pieces_out; ProductionLot.scrap_count += scrap_pieces", "bubble-up: ProductionLot.process_state -> SECONDARY_DONE when no PENDING operation remains and the stage's required op_types are DONE", "increments SecondaryOperation.version and ProductionLot.version by 1 each"]

  - method: POST
    path: "/heat-treat-runs"
    description: "Book a furnace window for a lot; computes the charge mass and rejects windows that collide with another run's window plus cooldown"
    roles: [HeatTreatOperator, ProcessEngineer]
    code: 201
    input: [production_lot_id, furnace_id, window_start_at, window_end_at, austenitize_temp_c, quench_medium, temper_temp_c, temper_time_min, carbon_potential_pct]
    output: HeatTreatRun
    side_effects: ["computes charge_mass_kg per calculations.heat_treat_charge_mass and checks Furnace.max_charge_mass_kg", "status starts at PLANNED", "does not occupy the furnace until the run starts"]

  - method: GET
    path: "/heat-treat-runs/{id}"
    description: "Read one heat treatment run including its metallurgical results"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: []
    output: HeatTreatRun
    side_effects: []

  - method: GET
    path: "/heat-treat-runs"
    description: "List heat treatment runs, filterable by lot, furnace and status"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: ["production_lot_id?", "furnace_id?", "status?", "limit?", "offset?"]
    output: HeatTreatRun[]
    side_effects: []

  - method: POST
    path: "/heat-treat-runs/{id}/start"
    description: "Charge the lot and start the furnace; requires the furnace idle and the logical clock inside the booked window"
    roles: [HeatTreatOperator]
    code: 200
    input: []
    output: HeatTreatRun
    side_effects: ["status PLANNED -> RUNNING; started_at = logical clock", "Furnace.status IDLE -> OCCUPIED", "increments HeatTreatRun.version and Furnace.version by 1 each"]

  - method: POST
    path: "/heat-treat-runs/{id}/results"
    description: "Record coupon hardness and surface decarburization; evaluates strength-class conformance and frees the furnace"
    roles: [QualityInspector]
    code: 200
    input: [core_hardness_hv, surface_decarb_depth_mm]
    output: HeatTreatRun
    side_effects: ["computes total_decarb_depth_mm and result per calculations.heat_treat_metallurgy_evaluation", "status RUNNING -> COMPLETED; Furnace.status -> IDLE and last_run_end_at = logical clock", "on PASS: ProductionLot.heat_treat_completed = true and process_state -> HEAT_TREATED", "on FAIL_HARDNESS or FAIL_DECARB: ProductionLot.disposition -> HOLD with hold_source HT_FAILURE", "increments HeatTreatRun.version, Furnace.version and ProductionLot.version by 1 each"]

  - method: POST
    path: "/plating-runs"
    description: "Schedule plating or coating for a heat-treated lot; a second run for the same lot supersedes the earlier one"
    roles: [HeatTreatOperator, ProcessEngineer]
    code: 201
    input: [production_lot_id, plating_spec, load_mass_kg]
    output: PlatingRun
    side_effects: ["status starts at SCHEDULED", "any earlier PlatingRun of the lot in status SCHEDULED or PLATED -> SUPERSEDED, incrementing its version by 1"]

  - method: GET
    path: "/production-lots/{id}/plating-runs"
    description: "List the lot's plating runs, newest first by created_at DESC"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: PlatingRun[]
    side_effects: []

  - method: POST
    path: "/plating-runs/{id}/complete-plating"
    description: "Mark plating complete, starting the hydrogen-embrittlement relief clock"
    roles: [HeatTreatOperator]
    code: 200
    input: []
    output: PlatingRun
    side_effects: ["status SCHEDULED -> PLATED; plated_at = logical clock", "ProductionLot.process_state -> PLATED", "increments PlatingRun.version and ProductionLot.version by 1 each"]

  - method: POST
    path: "/plating-runs/{id}/start-bake"
    description: "Start the embrittlement relief bake; enforces the 4.0 hour delay window and the 190-230 C / minimum-duration parameters"
    roles: [HeatTreatOperator]
    code: 200
    input: [bake_temp_c, bake_duration_min]
    output: PlatingRun
    side_effects: ["computes bake_delay_hours per calculations.he_bake_compliance", "status PLATED -> BAKING; bake_started_at = logical clock; bake parameters recorded", "increments PlatingRun.version by 1"]

  - method: POST
    path: "/plating-runs/{id}/complete-bake"
    description: "Close the relief bake once the soak has elapsed, or close a no-bake run directly; computes the pre-test risk score"
    roles: [HeatTreatOperator]
    code: 200
    input: []
    output: PlatingRun
    side_effects: ["status BAKING -> BAKE_COMPLETE, or PLATED -> BAKE_COMPLETE when PartSpec.he_bake_required is false", "bake_completed_at = logical clock", "ProductionLot.process_state -> BAKED and risk_score_pre_test computed per calculations.lot_release_risk_score pass 1", "increments PlatingRun.version and ProductionLot.version by 1 each"]

  - method: POST
    path: "/lot-tests"
    description: "Open a destructive lot test; derives the sampling plan and freezes the inspection severity"
    roles: [QualityInspector]
    code: 201
    input: [production_lot_id]
    output: LotTest
    side_effects: ["derives severity, sample_size and acceptance_number per calculations.lot_sampling_plan", "ProductionLot.inspection_severity frozen; destructive_test_count += sample_size; available_count -= sample_size", "for unplated parts also computes risk_score_pre_test per calculations.lot_release_risk_score pass 1", "performed_by_user_id = X-User-ID; ProductionLot.process_state -> TESTING", "increments ProductionLot.version by 1"]

  - method: GET
    path: "/production-lots/{id}/lot-tests"
    description: "List the lot's destructive tests"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: ["result?", "limit?", "offset?"]
    output: LotTest[]
    side_effects: []

  - method: POST
    path: "/lot-tests/{id}/results"
    description: "Record proof load and tensile failures plus the minimum measured core hardness; decides acceptance and the achieved strength grade"
    roles: [QualityInspector]
    code: 200
    input: [proof_load_failures, tensile_failures, min_measured_core_hardness_hv]
    output: LotTest
    side_effects: ["total_failures computed; result -> ACCEPT when total_failures <= acceptance_number else REJECT", "computes ProductionLot.achieved_strength_class per calculations.certified_strength_class and risk_score_final per calculations.lot_release_risk_score pass 2", "on ACCEPT: ProductionLot.process_state -> TESTED; on REJECT: ProductionLot.disposition -> HOLD with hold_source TEST_REJECT", "increments LotTest.version and ProductionLot.version by 1 each"]

  - method: POST
    path: "/certification-documents"
    description: "Draft a certificate of conformance for an accepted lot; projects the traceability chain and checks counterfeit, strength-class and aerospace gates. expected_production_lot_version carries the ProductionLot version the client last observed (§1.2.1)."
    roles: [QualityInspector, QualityManager]
    code: 201
    input: [production_lot_id, lot_test_id, cert_serial, expected_production_lot_version]
    output: CertificationDocument
    side_effects: ["status starts at DRAFT with revision 1", "pinned_part_spec_version copied from ProductionLot.pinned_part_spec_version", "traceability_chain and certified_strength_class projected per calculations.traceability_chain_projection", "increments ProductionLot.version by 1"]

  - method: GET
    path: "/certification-documents/{id}"
    description: "Read one certificate including its traceability chain"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: []
    output: CertificationDocument
    side_effects: []

  - method: GET
    path: "/certification-documents"
    description: "List certificates, filterable by lot, cited test and status"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: ["production_lot_id?", "lot_test_id?", "status?", "limit?", "offset?"]
    output: CertificationDocument[]
    side_effects: []

  - method: POST
    path: "/certification-documents/{id}/issue"
    description: "Sign and issue a drafted or reissue-pending certificate; enforces segregation of duties, the risk ceiling and part-spec version stability"
    roles: [QualityManager]
    code: 200
    input: []
    output: CertificationDocument
    side_effects: ["status -> ISSUED; issued_at = logical clock; signed_by_user_id = X-User-ID", "ProductionLot.process_state -> CERTIFIED", "increments CertificationDocument.version and ProductionLot.version by 1 each"]

  - method: POST
    path: "/certification-documents/{id}/revoke"
    description: "Revoke a certificate, recalling every pack unit shipped under it"
    roles: [QualityManager]
    code: 200
    input: [reason]
    output: CertificationDocument
    side_effects: ["status -> REVOKED with revoked_reason", "cascade: the certificate's SEALED and SHIPPED PackUnits -> RECALLED", "ProductionLot.disposition -> HOLD with hold_source QUALITY when it was IN_PROCESS", "increments CertificationDocument.version, ProductionLot.version and every recalled PackUnit.version by 1 each"]

  - method: POST
    path: "/certification-documents/{id}/reissue"
    description: "Open a revoked certificate for reissue under a new serial and the next revision"
    roles: [QualityManager]
    code: 200
    input: [cert_serial]
    output: CertificationDocument
    side_effects: ["status REVOKED -> REISSUE_PENDING; revision += 1; cert_serial replaced; signed_by_user_id cleared", "traceability_chain recomputed per calculations.traceability_chain_projection", "increments CertificationDocument.version by 1"]

  - method: POST
    path: "/pack-units"
    description: "Open a pack unit for a certified lot; declared_count is derived from the weight for BY_WEIGHT parts and taken from actual_count for BY_COUNT parts"
    roles: [ShippingClerk]
    code: 201
    input: [production_lot_id, certification_document_id, label_serial, "net_weight_kg?", "actual_count?", "label_fields_complete?"]
    output: PackUnit
    side_effects: ["pack_mode copied from PartSpec.packaging_mode", "declared_count and count_tolerance_pieces derived per calculations.pack_unit_count_reconciliation", "status starts at OPEN; label_fields_complete defaults to false"]

  - method: GET
    path: "/pack-units/{id}"
    description: "Read one pack unit"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: []
    output: PackUnit
    side_effects: []

  - method: GET
    path: "/pack-units"
    description: "List pack units, filterable by lot, certificate and status"
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: ["production_lot_id?", "certification_document_id?", "status?", "limit?", "offset?"]
    output: PackUnit[]
    side_effects: []

  - method: POST
    path: "/pack-units/{id}/seal"
    description: "Seal a pack unit, moving its declared count out of the lot's available pieces"
    roles: [ShippingClerk]
    code: 200
    input: []
    output: PackUnit
    side_effects: ["status OPEN -> SEALED; sealed_at = logical clock", "ProductionLot.packed_count += declared_count; available_count -= declared_count; process_state -> PACKED", "increments PackUnit.version and ProductionLot.version by 1 each"]

  - method: POST
    path: "/pack-units/{id}/reopen"
    description: "Reopen a sealed pack unit, returning its pieces to the lot exactly"
    roles: [ShippingClerk]
    code: 200
    input: [reason]
    output: PackUnit
    side_effects: ["status SEALED -> OPEN; sealed_at cleared", "ProductionLot.packed_count -= declared_count; available_count += declared_count; process_state -> CERTIFIED when no other pack unit of the lot is SEALED, SHIPPED or RECALLED", "increments PackUnit.version and ProductionLot.version by 1 each"]

  - method: POST
    path: "/pack-units/{id}/ship"
    description: "Ship a sealed pack unit; requires complete label fields and an issued certificate for the same lot"
    roles: [ShippingClerk]
    code: 200
    input: []
    output: PackUnit
    side_effects: ["status SEALED -> SHIPPED; shipped_at = logical clock", "ProductionLot.process_state -> SHIPPED once every pack unit of the lot is SHIPPED", "increments PackUnit.version and ProductionLot.version by 1 each"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock, which every timestamp, window and delay rule reads. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [ProcessEngineer, HeatTreatOperator, QualityInspector, QualityManager, ShippingClerk, PlantAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: datetime }
    side_effects: ["sets the logical clock used by every created_at, updated_at, window and delay evaluation", "does not itself mutate any entity"]

# =============================================================================
# §1.6 Error Code Catalog
