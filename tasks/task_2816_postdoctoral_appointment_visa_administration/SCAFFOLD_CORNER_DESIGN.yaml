              payload: { appointment_id: "${a72_id}", laboratory_id: "${lab72_id}", bench_seats: 1, access_start_date: "2026-10-01", access_end_date: "2027-03-31", expected_appointment_version: "${a72_vg}" }
              as: FacultyMentor
              as_user_id: "${m72_id}"
              captures: { g72a_id: "$.data.id", g72a_status: "$.data.status" }
            - call: "POST /appointments/${a72_id}/accept-offer"
              payload: {}
              as: Postdoc
              as_user_id: "${p72_id}"
              captures: { a72_v_accept: "$.data.version" }
            - call: "POST /lab-access-grants"
              payload: { appointment_id: "${a72_id}", laboratory_id: "${lab72_id}", bench_seats: 1, access_start_date: "2026-10-01", access_end_date: "2027-03-31", expected_appointment_version: "${a72_vg}" }
              as: FacultyMentor
              as_user_id: "${m72_id}"
              captures: { occ_grant_err: "$.data.error_id" }
            - call: "GET /lab-access-grants"
              payload: { appointment_id: "${a72_id}" }
              as: FacultyMentor
              captures: { g72_total_after_412: "$.meta.total_count" }
            - call: "POST /lab-access-grants"
              payload: { appointment_id: "${a72_id}", laboratory_id: "${lab72_id}", bench_seats: 1, access_start_date: "2026-10-01", access_end_date: "2027-03-31", expected_appointment_version: "${a72_v_accept}" }
              as: FacultyMentor
              as_user_id: "${m72_id}"
              captures: { g72b_id: "$.data.id", g72b_status: "$.data.status" }
            - call: "GET /lab-access-grants"
              payload: { appointment_id: "${a72_id}" }
