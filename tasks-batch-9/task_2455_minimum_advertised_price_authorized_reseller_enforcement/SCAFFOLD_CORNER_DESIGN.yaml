              payload: { product_id: "${prod}", channel: "PHYSICAL_RETAIL", seller_display_name: "Corner Electronics", listing_url: "https://flyer.example/p/1", listed_price_cents: 14300, observed_at: "2026-08-18T00:00:00Z", evidence_hash: "1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b" }
