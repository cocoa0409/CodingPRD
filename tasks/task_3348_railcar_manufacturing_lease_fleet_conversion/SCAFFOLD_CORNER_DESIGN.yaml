          wo_id: $.data.id
          wo_status: $.data.status
      assert:
      - 'The uncovered car is refused: HTTP 409 with data.error_id == ${err_capacity} == "ERR_CAPACITY_EXCEEDED"'
      - 'The rejection is atomic: LeaseFleetCar.${car_uncovered}.status == ${uncovered_after} == "HELD"
        and no work-order row was written'
      - 'The covered car is accepted: HTTP 201 with RetrofitWorkOrder.${wo_id}.status == ${wo_status}
        == "SCHEDULED"'
      - 'Coverage is read through the junction: both cars are HELD and both windows end before the 2026-12-31
        deadline, so priorities 8, 9, 10 and 21 are all satisfied and the sole difference is the RetrofitProgramCarType
        row'
      - The rule is checked last in the ladder (priority 24), after the free-car and temporal rules, so
        it is the coverage gate rather than a state or slot failure
      - Only one coverage row exists for this program — car type CT-W1 — which is exactly why CT-W2's
        car is refused
- section: rbac
  instances:
  - name: rbac_platform_admin_clock_control_exclusive_operation_succeeds
    claim_type: exclusive operations
    grounds:
    - roles.PlatformAdmin.exclusive_operations
    - POST /api/v1/_clock/set_current_utc
    - GET /api/v1/_clock/current
    distinguishing_aspect: PlatformAdmin is the only §1.7 role whose exclusive_operations list POST /_clock/set_current_utc,
      and its write is durable — the pre-write read pins the 2026-09-01T00:00:00Z startup default and
      the post-write read pins the newly set 2026-10-01T00:00:00Z.
    test_recipe:
      setup:
      - Empty DB; no clock call has been made yet, so the logical clock still reads the server's declared
        startup default.
      - PlatformAdmin is the acting role for both the read and the write; its exclusive_operations list
        carries exactly one entry, POST /_clock/set_current_utc.
      setup_api_calls:
      - call: GET /api/v1/_clock/current
        payload: {}
        as: PlatformAdmin
        captures:
          t_default: $.data.current_utc
      trigger:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-10-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          t_set_echo: $.data.current_utc
      - call: GET /api/v1/_clock/current
        payload: {}
        as: PlatformAdmin
        captures:
          t_after: $.data.current_utc
      assert:
      - The pre-write read returns HTTP 200 with data.current_utc == ${t_default} == "2026-09-01T00:00:00Z",
        the declared startup default — not a wall-clock instant
      - The PlatformAdmin write returns HTTP 200 and its own response body already carries data.current_utc
        == ${t_set_echo} == "2026-10-01T00:00:00Z"
      - 'The write is durable within the same logical request sequence: the immediately following GET
        /_clock/current returns data.current_utc == ${t_after} == "2026-10-01T00:00:00Z"'
      - No other §1.7 role declares POST /_clock/set_current_utc in exclusive_operations, so this success
        is the role-scoped half of the clock-control pair whose denial half is rbac_platform_admin_denied_component_creation_returns_forbidden
  - name: rbac_platform_admin_denied_component_creation_returns_forbidden
    claim_type: denial
    grounds:
    - roles.SupplyChainCoordinator.exclusive_operations
    - roles.PlatformAdmin.exclusive_operations
    - POST /api/v1/components
    - validations[priority=2]
    - errors[ERR_FORBIDDEN]
    distinguishing_aspect: PlatformAdmin holds the unconditional clock override but is absent from POST
      /components' §1.5 role list, so the identical payload is 403 ERR_FORBIDDEN under PlatformAdmin and
      201 under SupplyChainCoordinator — the override is per-operation, not a blanket superuser bypass.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z by the one role that may set it.
      - PlatformAdmin is declared in §1.7 (so priority 1 cannot fire) and its exclusive_operations list
        holds only POST /_clock/set_current_utc; POST /components lists SupplyChainCoordinator alone.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /api/v1/components
        payload:
          part_number: WS-DENIED-1
          component_class: WHEELSET
          unit_cost_cents: 1500
          lead_time_days: 5
        as: PlatformAdmin
        captures:
          err_id: $.data.error_id
          err_msg: $.data.message
      - call: POST /api/v1/components
        payload:
          part_number: WS-ALLOWED-1
          component_class: WHEELSET
          unit_cost_cents: 1500
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ok_id: $.data.id
          ok_part: $.data.part_number
      assert:
      - The PlatformAdmin write returns HTTP 403 with data.error_id == ${err_id} == "ERR_FORBIDDEN"
      - 'The denial is priority-2 authenticated-but-unpermitted, not priority-1: PlatformAdmin is declared
        in §1.7, so ERR_UNAUTHENTICATED is impossible here'
      - The identical payload under SupplyChainCoordinator returns HTTP 201 with data.id == ${ok_id} and
        data.part_number == ${ok_part} == "WS-ALLOWED-1", so the rejection is keyed on the acting role
        and not on the body
      - The 403 body is an error envelope with no data.id, so the denied call minted no Component row
      - 'PlatformAdmin''s clock override is not a blanket bypass: the same role that set the clock is
        refused this SupplyChainCoordinator-exclusive operation'
  - name: rbac_supply_chain_coordinator_component_catalog_and_receipt_operations_succeed
    claim_type: exclusive operations
    grounds:
    - roles.SupplyChainCoordinator.exclusive_operations
    - POST /api/v1/components
    - POST /api/v1/component-purchase-orders
    - POST /api/v1/component-purchase-orders/{id}/confirm
    - POST /api/v1/component-receipts
    - POST /api/v1/component-receipts/{id}/receive
    - entities.Component.fields.on_hand_qty
    distinguishing_aspect: SupplyChainCoordinator exercises five of its six declared exclusive_operations
      in one chain — catalogue, purchase order, confirm, receipt booking and receipt application — and
      the stock only moves on the final receive, from 0 to the received quantity 12.
    test_recipe:
      setup:
      - Empty DB; logical clock pinned to 2026-09-01T00:00:00Z.
      - No component exists, so the whole catalogue and yard chain is produced by SupplyChainCoordinator
        calls alone; every other role is absent from all five endpoints' §1.5 role lists.
      setup_api_calls:
      - call: POST /api/v1/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /api/v1/components
        payload:
          part_number: WS-SCC-1
          component_class: WHEELSET
          unit_cost_cents: 1500
          lead_time_days: 5
        as: SupplyChainCoordinator
        captures:
          ws_id: $.data.id
          oh_at_create: $.data.on_hand_qty
      trigger:
      - call: POST /api/v1/component-purchase-orders
        payload:
          component_id: ${ws_id}
          qty_ordered: 12
          unit_cost_cents: 1500
          order_date: '2026-09-01'
          expected_receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          po_id: $.data.id
          po_status_placed: $.data.status
      - call: POST /api/v1/component-purchase-orders/${po_id}/confirm
        payload: {}
        as: SupplyChainCoordinator
        captures:
          po_status_confirmed: $.data.status
      - call: POST /api/v1/component-receipts
        payload:
          component_purchase_order_id: ${po_id}
          component_id: ${ws_id}
          qty_received: 12
          receipt_date: '2026-09-06'
        as: SupplyChainCoordinator
        captures:
          rc_id: $.data.id
      - call: GET /api/v1/components/${ws_id}
        payload: {}
        as: SupplyChainCoordinator
        captures:
          oh_after_booking: $.data.on_hand_qty
      - call: POST /api/v1/component-receipts/${rc_id}/receive
        payload: {}
        as: SupplyChainCoordinator
      - call: GET /api/v1/component-purchase-orders/${po_id}
        payload: {}
        as: SupplyChainCoordinator
        captures:
          po_status_received: $.data.status
      - call: GET /api/v1/components/${ws_id}
        payload: {}
        as: SupplyChainCoordinator
        captures:
          oh_after_receive: $.data.on_hand_qty
          res_after_receive: $.data.reserved_qty
      assert:
      - The catalogue write returns HTTP 201 with data.on_hand_qty == ${oh_at_create} == 0, the declared
        system default
      - 'The purchase order opens in PLACED: data.status == ${po_status_placed} == "PLACED"'
      - POST /component-purchase-orders/${po_id}/confirm returns HTTP 200 with data.status == ${po_status_confirmed}
        == "CONFIRMED"
      - 'Booking a receipt alone moves no stock: GET /components/${ws_id} still reads data.on_hand_qty
        == ${oh_after_booking} == 0'
      - 'Applying the receipt closes the purchase: the parent order reads data.status == ${po_status_received}
        == "RECEIVED" while the component is lifted to data.on_hand_qty == ${oh_after_receive} == 12'
      - 'With no released order and no in-progress retrofit work order, the reservation term stays empty
        after the receipt lands: data.reserved_qty == ${res_after_receive} == 0'
      - All five calls succeed under one role, so SupplyChainCoordinator's exclusive_operations are role-scoped
        to it and exercisable end-to-end without any other role
  - name: rbac_supply_chain_coordinator_denied_production_order_creation_returns_forbidden
