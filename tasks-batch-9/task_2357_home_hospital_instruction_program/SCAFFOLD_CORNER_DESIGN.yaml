            - "The teacher still reads committed_weekly_minutes == 0 because the assignment is only PROPOSED."

      - name: rejecting_a_certification_returns_the_case_to_draft_and_locks_the_certification
        claim_type: valid_transition
        grounds:
          - state_machines.PhysicianCertification.SUBMITTED_to_REJECTED
          - state_machines.HomeboundCase.PENDING_CERT_REVIEW_to_DRAFT
          - entities.HomeboundCase.fields.certification_count
        distinguishing_aspect: |
          A REJECT decision drives two machines at once: the certification reaches its terminal
          REJECTED state and the case falls back to DRAFT with certification_count still 0 and no
          entitlement resolved — the rejection leaves no partial eligibility behind.
        test_recipe:
          setup:
            - "Case in PENDING_CERT_REVIEW with one SUBMITTED certification; PUBLISHED MIDDLE/IN_HOME rule available."
