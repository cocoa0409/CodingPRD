# =============================================================================
# task_2102 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids / 26 instances. Every grounds ref resolves into SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: attribution_proportional_vs_reverse_chronological_on_credit_balance
        grounds:
          - calculations.credit_balance_attribution_split
          - entities.CreditBalance.fields.patient_portion_cents
          - entities.CreditBalance.fields.payer_portion_cents
          - entities.CreditBalance.fields.attribution
          - state_machines.CreditBalance.UNDER_REVIEW_to_ATTRIBUTED
        distinguishing_aspect: |
          The dual variant lives on the CreditBalance entity domain (overpayment
          attribution): two accounts with byte-identical charge and payment
          histories produce patient_portion_cents 8000 / payer_portion_cents 12000
          under PROPORTIONAL and 20000 / 0 under REVERSE_CHRONOLOGICAL, so the
          same inputs yield a different attribution enum (SPLIT vs PATIENT).
        test_recipe:
          setup:
            - "One COMMERCIAL payer and two patient accounts SP1 and SP2 with identical ledgers: a CHARGE of +80000 on 2026-08-01, a PAYER PAYMENT of -60000 on 2026-08-05 and a PATIENT PAYMENT of -40000 on 2026-08-10, leaving balance_cents == -20000 on each."
            - "One identification sweep on 2026-08-15 created a CreditBalance of 20000 cents on each account; both are in status UNDER_REVIEW with attribution_method still null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-SP1", mrn: "MRN-SP1", patient_name: "Sara Poole", guarantor_state_code: "TX", primary_payer_id: "${payer_com_id}", financial_class: "OUTPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_sp1_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-SP2", mrn: "MRN-SP2", patient_name: "Sam Poole", guarantor_state_code: "TX", primary_payer_id: "${payer_com_id}", financial_class: "OUTPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_sp2_id: "$.data.id" }
            - call: "POST /patient-accounts/${acct_sp1_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 80000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /patient-accounts/${acct_sp2_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 80000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_sp1_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -60000, source: "PAYER", payer_id: "${payer_com_id}" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /patient-accounts/${acct_sp2_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -60000, source: "PAYER", payer_id: "${payer_com_id}" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_sp1_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -40000, source: "PATIENT" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /patient-accounts/${acct_sp2_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -40000, source: "PATIENT" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /credit-balances/identify-sweep"
              payload: { account_ids: ["${acct_sp1_id}", "${acct_sp2_id}"] }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
              captures: { cb_sp1_id: "$.data.credit_balance_ids[0]", cb_sp2_id: "$.data.credit_balance_ids[1]" }
            - call: "POST /credit-balances/${cb_sp1_id}/start-review"
              payload: {}
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /credit-balances/${cb_sp2_id}/start-review"
              payload: {}
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
          trigger:
            - call: "POST /credit-balances/${cb_sp1_id}/attribute"
              payload: { attribution_method: "PROPORTIONAL" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /credit-balances/${cb_sp2_id}/attribute"
              payload: { attribution_method: "REVERSE_CHRONOLOGICAL" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
          assert:
            - "CreditBalance.${cb_sp1_id}.credit_amount_cents == 20000"
            - "CreditBalance.${cb_sp1_id}.patient_portion_cents == 8000"
            - "CreditBalance.${cb_sp1_id}.payer_portion_cents == 12000"
            - "CreditBalance.${cb_sp1_id}.attribution == SPLIT"
            - "CreditBalance.${cb_sp2_id}.credit_amount_cents == 20000"
            - "CreditBalance.${cb_sp2_id}.patient_portion_cents == 20000"
            - "CreditBalance.${cb_sp2_id}.payer_portion_cents == 0"
            - "CreditBalance.${cb_sp2_id}.attribution == PATIENT"
            - "CreditBalance.${cb_sp1_id}.patient_portion_cents + CreditBalance.${cb_sp1_id}.payer_portion_cents == 20000"

      - name: escheat_dormancy_issue_date_vs_last_contact_on_escheatment_record
        grounds:
          - calculations.escheat_dormancy_clock
          - entities.EscheatmentRecord.fields.dormancy_start_at
          - entities.EscheatmentRecord.fields.escheat_due_at
          - entities.EscheatmentRecord.fields.due_diligence_open_at
          - entities.EscheatmentRecord.fields.basis
        distinguishing_aspect: |
          The dual variant lives on a different entity domain from the attribution
          split — unclaimed-property dormancy on EscheatmentRecord: two checks cut
          in the same batch on 2026-08-20 for the same CA jurisdiction yield
          escheat_due_at 2029-08-19 under ISSUE_DATE and 2029-11-09 under
          LAST_CONTACT, because a +100 CHARGE posted on 2026-11-10 to only the
          second account pushes dormancy_start_at forward.
        test_recipe:
          setup:
            - "One COMMERCIAL payer and two accounts ES1 and ES2, each charged +50000 on 2026-08-01 and paid -62000 by the PATIENT on 2026-08-05, leaving a 12000-cent credit identified on 2026-08-15 and attributed PROPORTIONAL to attribution PATIENT."
            - "One refund request per account for 12000 cents payable to the PATIENT in CA, both approved and both added to batch B-ESC, which was locked and issued on 2026-08-20 — two CheckDisbursement rows in state ISSUED with stale_at 2027-02-16."
            - "A +100 CHARGE was posted to ES2 only on 2026-11-10, so ES2.last_activity_at is later than the issue date while ES1.last_activity_at is not."
            - "The aging sweep on 2027-02-16 moved both checks ISSUED -> STALE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /payers"
              payload: { name: "Meridian Commercial", payer_code: "COM", payer_type: "COMMERCIAL" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { payer_com_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-ES1", mrn: "MRN-ES1", patient_name: "Elena Sharp", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "OUTPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_es1_id: "$.data.id" }
            - call: "POST /patient-accounts"
              payload: { account_number: "ACCT-ES2", mrn: "MRN-ES2", patient_name: "Evan Sharp", guarantor_state_code: "CA", primary_payer_id: "${payer_com_id}", financial_class: "OUTPATIENT" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { acct_es2_id: "$.data.id" }
            - call: "POST /patient-accounts/${acct_es1_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 50000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /patient-accounts/${acct_es2_id}/transactions"
              payload: { txn_type: "CHARGE", amount_cents: 50000, source: "SYSTEM" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /patient-accounts/${acct_es1_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -62000, source: "PATIENT" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /patient-accounts/${acct_es2_id}/transactions"
              payload: { txn_type: "PAYMENT", amount_cents: -62000, source: "PATIENT" }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
            - call: "POST /credit-balances/identify-sweep"
              payload: { account_ids: ["${acct_es1_id}", "${acct_es2_id}"] }
              as: CreditAnalyst
              as_user_id: "ca-analyst-1"
