scaffold_difficulty_design:
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_pro_rata_vs_schedule_tier_diverge
        grounds:
          - calculations.enrollment_refund_amount
          - state_machines.Enrollment.ACTIVE_to_REFUNDED
          - entities.Enrollment.fields.refunded_cents
        distinguishing_aspect: |
          On the SAME Enrollment (final_price 85000, fee 5000, road consumed 2 of 6,
          elapsed 10 days), PRO_RATA yields 53333 cents while SCHEDULE_TIER yields
          60000 cents — two valid refund algorithms on the Enrollment domain produce
          different cents for identical inputs.
        test_recipe:
          setup:
            - "CoursePackage TEEN_FULL: price 90000, fee 5000, classroom 30, online 8, road 6, bundle 5000, active."
            - "Adult student (DOB 1990) enrolled, no promo; enrollment ACTIVE with final_price 85000, activated_at 2026-06-01."
            - "Student has a recorded permit and 2 COMPLETED road hours; clock is 2026-06-11 (10 days elapsed)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "TEEN_FULL", name: "Teen Full", price_cents: 90000, enrollment_fee_cents: 5000, included_classroom_hours: 30, included_online_hours: 8, included_road_hours: 6, bundle_discount_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ivy Road", email: "ivy@x.com", certified_road: true, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /vehicles"
              payload: { plate: "DC-1", dual_control: true, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Adam Adult", email: "adam@x.com", date_of_birth: "1990-05-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /students/${stu_id}/record-permit"
              payload: { permit_number: "P-100" }
              as: SchoolAdmin
              captures: { sv1: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-06-02T14:00:00.000Z", end_at: "2026-06-02T16:00:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv1}" }
              as: SchoolAdmin
              captures: { les_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T16:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${les_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-11T00:00:00.000Z" }
              as: SchoolAdmin
          trigger:
            - call: "POST /enrollments/${enr_id}/refund"
              payload: { refund_method: "PRO_RATA", refund_destination: "WALLET" }
              as: SchoolAdmin
              captures: { refunded: $.data.refunded_cents }
          assert:
            - "Enrollment.${enr_id}.refunded_cents == 53333"
            - "Enrollment.${enr_id}.refund_method == PRO_RATA"
            - "A parallel enrollment refunded with SCHEDULE_TIER under identical setup yields refunded_cents == 60000 (!= 53333)"

      - name: instructor_payout_per_line_vs_sum_then_round
        grounds:
          - calculations.instructor_lesson_payout
          - endpoints
          - entities.Lesson.fields.instructor_payout_cents
        distinguishing_aspect: |
          On the Instructor domain, payout summed round-per-line over lessons of
          1.5h/2.0h/0.75h at rate 3333 = 14166 cents, whereas round(rate * 4.25h) =
          14165 — the round-then-sum vs sum-then-round order diverges by 1 cent on a
          different entity (Instructor) than the refund dual-variant (Enrollment).
        test_recipe:
          setup:
            - "Instructor at hourly_rate_cents 3333; three COMPLETED lessons of 1.5h, 2.0h, 0.75h for an adult student in period [2026-07-01,2026-07-31)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "ROAD_ONLY", name: "Road Only", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 0, included_online_hours: 0, included_road_hours: 10, bundle_discount_cents: 0, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Pat Pay", email: "pat@x.com", certified_road: true, hourly_rate_cents: 3333, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /vehicles"
              payload: { plate: "PV-1", dual_control: true, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Sam Solo", email: "sam@x.com", date_of_birth: "1985-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /students/${stu_id}/record-permit"
              payload: { permit_number: "P-200" }
              as: SchoolAdmin
              captures: { sv1: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-07-02T09:00:00.000Z", end_at: "2026-07-02T10:30:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv1}" }
              as: SchoolAdmin
              captures: { l1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T10:30:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${l1}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { sv2: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-07-03T09:00:00.000Z", end_at: "2026-07-03T11:00:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv2}" }
              as: SchoolAdmin
              captures: { l2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T11:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${l2}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { sv3: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-07-04T09:00:00.000Z", end_at: "2026-07-04T09:45:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv3}" }
              as: SchoolAdmin
              captures: { l3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-04T09:45:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${l3}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "GET /instructors/${inst_id}/payout-summary?period_start=2026-07-01T00:00:00.000Z&period_end=2026-07-31T00:00:00.000Z"
              payload: { period_start: "2026-07-01T00:00:00.000Z", period_end: "2026-07-31T00:00:00.000Z" }
              as: SchoolAdmin
              captures: { total: $.data.period_total_cents }
          assert:
            - "payout-summary.period_total_cents == 14166 (round-per-line: 5000+6666+2500)"
            - "period_total_cents != 14165 (which is the forbidden round(3333*4.25) sum-then-round result)"
            - "Lesson.${l1}.instructor_payout_cents == 5000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: enrollment_price_three_stacked_discounts_mode_a
        grounds:
          - calculations.enrollment_final_price
          - state_machines.Enrollment.DRAFT_to_ACTIVE
          - entities.Enrollment.fields.final_price_cents
        distinguishing_aspect: |
          Mode (a): final_price = max(0, round_half_up( price*(1-0.10)*(1-0.10) - bundle ))
          has 3 conditional inputs (is_minor, promo, both-tracks) with multiplicative
          then-subtractive non-linear interaction; minor+FLAT10+bundle on a 90000 package
          yields exactly 67900.
        test_recipe:
          setup:
            - "CoursePackage TEEN_FULL (90000/5000/30/8/6, bundle 5000). Minor student (DOB 2010, age <18 at 2026-06-01). GuardianConsent GRANTED. Enrollment with promo_code FLAT10."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "TEEN_FULL", name: "Teen Full", price_cents: 90000, enrollment_fee_cents: 5000, included_classroom_hours: 30, included_online_hours: 8, included_road_hours: 6, bundle_discount_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Tina Teen", email: "tina@x.com", date_of_birth: "2010-03-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /guardian-consents"
              payload: { student_id: "${stu_id}", guardian_name: "Gail Guard", guardian_email: "gail@x.com", relationship: "PARENT" }
              as: SchoolAdmin
              captures: { gc_id: $.data.id }
            - call: "POST /guardian-consents/${gc_id}/grant"
              payload: {}
              as: Guardian
              as_user_id: "${gc_id}"
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}", promo_code: "FLAT10" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
              captures: { fp: $.data.final_price_cents }
          assert:
            - "Enrollment.${enr_id}.final_price_cents == 67900"
            - "Enrollment.${enr_id}.amount_paid_cents == 67900"
            - "Enrollment.${enr_id}.status == ACTIVE"

      - name: instructor_payout_rounding_order_mode_b
        grounds:
          - calculations.instructor_lesson_payout
          - state_machines.Lesson.SCHEDULED_to_COMPLETED
          - endpoints
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the period payout SUMS
          per-lesson round_half_up(rate*hours) (round-then-sum = 14166), NOT
          round(rate * sum(hours)) (sum-then-round = 14165); the scaffold pins
          round-per-line-then-sum.
        test_recipe:
          setup:
            - "Same three COMPLETED lessons (1.5h, 2.0h, 0.75h) at rate 3333 as the dual-variant payout instance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "ROAD_B", name: "Road B", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 0, included_online_hours: 0, included_road_hours: 10, bundle_discount_cents: 0, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Ben Bill", email: "ben@x.com", certified_road: true, hourly_rate_cents: 3333, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /vehicles"
              payload: { plate: "BV-1", dual_control: true, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Bea Bee", email: "bea@x.com", date_of_birth: "1980-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /students/${stu_id}/record-permit"
              payload: { permit_number: "P-300" }
              as: SchoolAdmin
              captures: { sv1: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-08-02T09:00:00.000Z", end_at: "2026-08-02T10:30:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv1}" }
              as: SchoolAdmin
              captures: { l1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:30:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${l1}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { sv2: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-08-03T09:00:00.000Z", end_at: "2026-08-03T11:00:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv2}" }
              as: SchoolAdmin
              captures: { l2: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T11:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${l2}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { sv3: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-08-04T09:00:00.000Z", end_at: "2026-08-04T09:45:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv3}" }
              as: SchoolAdmin
              captures: { l3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T09:45:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${l3}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
          trigger:
            - call: "GET /instructors/${inst_id}/payout-summary?period_start=2026-08-01T00:00:00.000Z&period_end=2026-08-31T00:00:00.000Z"
              payload: { period_start: "2026-08-01T00:00:00.000Z", period_end: "2026-08-31T00:00:00.000Z" }
              as: SchoolAdmin
              captures: { total: $.data.period_total_cents }
          assert:
            - "payout-summary.period_total_cents == 14166"
            - "Lesson.${l2}.instructor_payout_cents == 6666"
            - "Lesson.${l3}.instructor_payout_cents == 2500"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: certificate_submitted_rejected_resubmit_cycle
        grounds:
          - state_machines.Certificate.SUBMITTED_to_REJECTED
          - state_machines.Certificate.REJECTED_to_SUBMITTED
          - entities.Certificate.fields.status
        distinguishing_aspect: |
          Certificate is cyclic: SUBMITTED -> REJECTED -> SUBMITTED, a revision loop
          on the Certificate entity (distinct from the Student cyclic revert), each
          re-submit re-mints dmv_reference.
        test_recipe:
          setup:
            - "A CERTIFIED student with an ISSUED Certificate that has been SUBMITTED then REJECTED by the DMV."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "CERT_PKG", name: "Cert Pkg", price_cents: 90000, enrollment_fee_cents: 5000, included_classroom_hours: 30, included_online_hours: 8, included_road_hours: 6, bundle_discount_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Cy Cert", email: "cy@x.com", certified_road: true, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /vehicles"
              payload: { plate: "CV-1", dual_control: true, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Cara Cert", email: "cara@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: SchoolAdmin
            - call: "POST /students/${stu_id}/record-permit"
              payload: { permit_number: "P-CERT" }
              as: SchoolAdmin
              captures: { sv1: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "CLASSROOM", start_at: "2026-06-02T08:00:00.000Z", end_at: "2026-06-03T14:00:00.000Z", instructor_id: "${inst_id}", expected_student_version: "${sv1}" }
              as: SchoolAdmin
              captures: { lc: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T14:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${lc}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { sv2: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ONLINE", start_at: "2026-06-04T08:00:00.000Z", end_at: "2026-06-04T16:00:00.000Z", instructor_id: "${inst_id}", expected_student_version: "${sv2}" }
              as: SchoolAdmin
              captures: { lo: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T16:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${lo}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
              captures: { sv3: $.data.version }
            - call: "POST /lessons"
              payload: { student_id: "${stu_id}", enrollment_id: "${enr_id}", lesson_type: "ROAD", start_at: "2026-06-05T08:00:00.000Z", end_at: "2026-06-05T14:00:00.000Z", instructor_id: "${inst_id}", vehicle_id: "${veh_id}", expected_student_version: "${sv3}" }
              as: SchoolAdmin
              captures: { lr: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T14:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /lessons/${lr}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${inst_id}"
            - call: "POST /students/${stu_id}/certificate"
              payload: { enrollment_id: "${enr_id}" }
              as: SchoolAdmin
              captures: { cert_id: $.data.id }
            - call: "POST /certificates/${cert_id}/submit"
              payload: {}
              as: SchoolAdmin
            - call: "POST /certificates/${cert_id}/dmv-callback"
              payload: { outcome: "REJECTED" }
              as: SchoolAdmin
          trigger:
            - call: "POST /certificates/${cert_id}/submit"
              payload: {}
              as: SchoolAdmin
              captures: { st: $.data.status }
          assert:
            - "Certificate.${cert_id}.status == SUBMITTED (re-entered SUBMITTED from REJECTED)"
            - "Certificate.${cert_id}.dmv_reference is non-null (re-minted)"

      - name: student_road_ready_reverts_to_permitted_cycle
        grounds:
          - state_machines.Student.ROAD_READY_to_PERMITTED
          - state_machines.Student.PERMITTED_to_ROAD_READY
          - entities.Student.fields.status
        distinguishing_aspect: |
          Student is cyclic on a different entity than Certificate: PERMITTED ->
          ROAD_READY (road floor met) -> PERMITTED (a COMPLETED road lesson cancelled,
          completed_road_hours drops below 6). This loop belongs to Student, not Certificate.
        test_recipe:
          setup:
            - "PERMITTED student who completed exactly 6 road hours across two 3h ROAD lessons, reaching ROAD_READY."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SchoolAdmin
            - call: "POST /course-packages"
              payload: { code: "REVERT_PKG", name: "Revert Pkg", price_cents: 60000, enrollment_fee_cents: 0, included_classroom_hours: 0, included_online_hours: 0, included_road_hours: 8, bundle_discount_cents: 0, active: true }
              as: SchoolAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /instructors"
              payload: { full_name: "Rod Rev", email: "rod@x.com", certified_road: true, hourly_rate_cents: 5000, active: true }
              as: SchoolAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /vehicles"
              payload: { plate: "RV-1", dual_control: true, prep_buffer_minutes: 0, out_of_service: false }
              as: SchoolAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /students"
              payload: { full_name: "Rita Rev", email: "rita@x.com", date_of_birth: "1990-01-01" }
              as: SchoolAdmin
              captures: { stu_id: $.data.id }
            - call: "POST /enrollments"
              payload: { student_id: "${stu_id}", package_id: "${pkg_id}" }
              as: SchoolAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
