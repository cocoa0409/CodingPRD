  - section: state_machines
    instances:
      - name: new_meal_claim_starts_in_draft_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.MealClaim.initial_state
          - endpoints[POST /sfsp/meal-claims]
        distinguishing_aspect: "A freshly created MealClaim is DRAFT with revision_round 0, line_item_count 0 and every reimbursement field at 0 before any submit."
        test_recipe:
          setup:
            - "Sponsor APPROVED; clock at 2026-07-06T09:00:00Z."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T09:00:00Z" }
              as: StateAgencyReviewer
            - call: "GET /sfsp/sponsors/${sp_id}"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { sp_ver: $.data.version }
          trigger:
            - call: "POST /sfsp/meal-claims"
              payload: { sponsor_id: "${sp_id}", claim_month: "2026-06", expected_sponsor_version: "${sp_ver}" }
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { cl_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "MealClaim.${cl_id}.status == DRAFT and revision_round == 0 and line_item_count == 0"
            - "MealClaim.${cl_id}.preliminary_reimbursement_cents == 0 and final_reimbursement_cents == 0 and advance_offset_cents == 0 and net_payable_cents == 0"
            - "MealClaim.${cl_id}.submitted_at == null and paid_at == null and created_at == 2026-07-06T09:00:00Z"

      - name: sponsor_application_submit_from_approved_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Sponsor.transitions[DRAFT->SUBMITTED]
          - validations[priority=18]
          - errors[ERR_SPONSOR_STATE_INVALID]
        distinguishing_aspect: "application-submit is only defined from DRAFT, so calling it on an APPROVED sponsor returns 409 ERR_SPONSOR_STATE_INVALID and leaves application_status APPROVED."
        test_recipe:
          setup:
            - "Sponsor APPROVED (DRAFT -> SUBMITTED -> APPROVED already walked)."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
            - call: "POST /sfsp/sponsors"
              payload: { legal_name: "Riverbend Community Alliance", sponsor_type: "NONPROFIT", experience_status: "EXPERIENCED", program_year: 2026, advance_eligible: true }
              as: StateAgencyReviewer
              captures: { sp_id: $.data.id }
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
            - call: "POST /sfsp/sponsors/${sp_id}/application-decision"
              payload: { decision: "APPROVED" }
              as: StateAgencyReviewer
              captures: { ver_before: $.data.version }
          trigger:
            - call: "POST /sfsp/sponsors/${sp_id}/application-submit"
              payload: {}
              as: SponsorAdmin
              as_user_id: "${sp_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "${err_id} == ERR_SPONSOR_STATE_INVALID"
            - "Sponsor.${sp_id}.application_status == APPROVED"
            - "Sponsor.${sp_id}.version == ${ver_before} (a rejected write does not bump the OCC version)"

      - name: terminated_sponsor_cannot_be_decided_again_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Sponsor.terminal_states
          - validations[priority=18]
          - errors[ERR_SPONSOR_STATE_INVALID]
        distinguishing_aspect: "TERMINATED is terminal: a further application-decision with decision=APPROVED on a TERMINATED sponsor returns 409 ERR_SPONSOR_STATE_INVALID, and the sites the termination cascade denied stay DENIED."
        test_recipe:
          setup:
            - "Sponsor APPROVED with one PENDING_REVIEW site, then TERMINATED (which cascades the site to DENIED)."
          setup_api_calls:
            - call: "POST /sfsp/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: StateAgencyReviewer
