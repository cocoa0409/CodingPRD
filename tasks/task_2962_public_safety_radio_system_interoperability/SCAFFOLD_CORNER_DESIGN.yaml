        distinguishing_aspect: "A patch activated at 00:00:00Z and released at 00:01:45Z stores duration_minutes 1 (105 seconds floored to whole minutes), not 1.75 and not 2."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z, advanced to 00:01:45Z before the release."
            - "Agency DUR (LAW, PATCH_AUTHORITY, recorder_retention_days 180) owns two CLEAR talkgroups on Site DUR-1 and has an ACTIVE patch between them."
          setup_api_calls:
            - call: "POST /radio-system/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "admin-1"
            - call: "POST /radio-system/agencies"
              payload: { name: "Duration County Police", agency_code: "DUR01", agency_type: "LAW", interop_privilege: "PATCH_AUTHORITY", recorder_retention_days: 180 }
