      - name: remediation_cycle_bounded_by_max_remediations_per_project
        claim_type: cyclic
        grounds:
          - state_machines.RebateProject.INSPECTION_FAILED_to_REMEDIATION
          - state_machines.RebateProject.REMEDIATION_to_INSTALLED
          - state_machines.RebateProject.INSTALLED_to_FAILED_FINAL
          - entities.RebateProject.fields.remediation_count
        excluded_because:
          difficulty_instance: transitive_cascade / failed_reinspection_release_cascade_depth_four
          rationale: "That §1.8 instance drives the full INSTALLED -> INSPECTION_FAILED -> REMEDIATION -> INSTALLED loop, exhausts max_remediations_per_project 1 on the second FAIL, and asserts the FAILED_FINAL termination plus the refusal of any further transition from that terminal state."

      - name: reserve_and_release_leave_program_ledger_without_drift
        claim_type: compensation
        grounds:
          - state_machines.Reservation.COMMITTED_to_CLAWED_BACK
          - calculations.program_budget_conservation
        excluded_because:
          difficulty_instance: compensating_invariant / program_appropriation_conserved_across_reserve_pay_and_clawback
          rationale: "That §1.8 instance pins the conservation identity budget_total == available + reserved + committed at three checkpoints across reserve, pay and clawback, which is exactly the undo-with-no-drift claim of this row."

      - name: project_expiry_cancels_only_still_scheduled_inspections
        claim_type: conditional_cascade
        grounds:
          - state_machines.Inspection.SCHEDULED_to_CANCELLED
          - state_machines.ProjectMeasure.install_status_to_VOID
        excluded_because:
          difficulty_instance: transitive_cascade / sweep_expiry_cascade_depth_three_voids_measures_and_cancels_inspection
          rationale: "That §1.8 instance asserts the expiry cascade hop-by-hop, including that the SCHEDULED inspection is cancelled while measures are VOIDed, and that terminal inspections are left alone."

  # ===========================================================================
  - section: calculations
    instances:

      - name: income_tier_thresholds_are_inclusive_at_eighty_and_one_fifty
        claim_type: threshold
        grounds:
          - calculations.income_tier_assignment
          - entities.Program.fields.ami_low_threshold_pct
          - entities.Program.fields.ami_moderate_threshold_pct
        distinguishing_aspect: |
          Both tier boundaries use `<=`, so ami_percent exactly 80.0 is LOW and
          exactly 150.0 is MODERATE, while one tenth of a point more falls to
          the next tier. Four households at 80.0 / 80.1 / 150.0 / 150.1 pin
          both edges and their cap and cost-share consequences in a single
          program.
        test_recipe:
          setup:
            - "One OPEN program at default thresholds (80.0 / 150.0) and default caps (LOW 1400000, MODERATE 800000, STANDARD 300000)."
            - "Four households, all household_size 4 (SIZE_ADJUSTMENT factor 1.0) with county_median_income_cents 10000000, so ami_percent is income / 100000."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Tier Edges", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Edge Low", email: "edge.low@example.com", service_address_line1: "1 Edge Way", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_a: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Edge Low Plus", email: "edge.lowplus@example.com", service_address_line1: "2 Edge Way", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_b: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Edge Moderate", email: "edge.mod@example.com", service_address_line1: "3 Edge Way", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_c: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Edge Standard", email: "edge.std@example.com", service_address_line1: "4 Edge Way", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 4, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh_d: $.data.id }
          trigger:
            - call: "POST /households/${hh_a}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_a}"
              captures: { iv_a: $.data.id }
            - call: "POST /income-verifications/${iv_a}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /households/${hh_b}/income-verifications"
              payload: { annual_household_income_cents: 8010000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_b}"
              captures: { iv_b: $.data.id }
            - call: "POST /income-verifications/${iv_b}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /households/${hh_c}/income-verifications"
              payload: { annual_household_income_cents: 15000000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_c}"
              captures: { iv_c: $.data.id }
            - call: "POST /income-verifications/${iv_c}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /households/${hh_d}/income-verifications"
              payload: { annual_household_income_cents: 15010000, county_median_income_cents: 10000000, household_size_attested: 4 }
              as: Applicant
              as_user_id: "${hh_d}"
              captures: { iv_d: $.data.id }
            - call: "POST /income-verifications/${iv_d}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Household.${hh_a}: ami_percent == 80.0, income_tier == LOW, rebate_cap_cents == 1400000, lifetime_cap_remaining_cents == 1400000 — the low threshold is inclusive"
            - "Household.${hh_b}: ami_percent == 80.1, income_tier == MODERATE, rebate_cap_cents == 800000 — one tenth of a point past the edge changes the tier"
            - "Household.${hh_c}: ami_percent == 150.0, income_tier == MODERATE, rebate_cap_cents == 800000 — the moderate threshold is inclusive too"
            - "Household.${hh_d}: ami_percent == 150.1, income_tier == STANDARD, rebate_cap_cents == 300000"
            - "IncomeVerification.${iv_c}.computed_ami_percent == 150.0 and assigned_cap_cents == 800000 — the verification row carries the same computed values it wrote onto the household"
            - "All four households have encumbered_cents == 0, so lifetime_cap_remaining_cents equals rebate_cap_cents in every case"

      - name: size_adjustment_constant_clamps_at_household_size_seven
        claim_type: constants_applied
        grounds:
          - calculations.income_tier_assignment
          - calculations.income_tier_assignment.constants.SIZE_ADJUSTMENT
        distinguishing_aspect: |
          One income (8000000) and one county median (10000000) run through
          four household sizes: the SIZE_ADJUSTMENT factor scales the median,
          not the income, so ami_percent falls as the household grows —
          114.3 at size 1, 74.1 at size 5, 64.5 at size 7 — and size 9 uses
          the size-7 factor 1.24 unchanged because of the min(size, 7) clamp.
        test_recipe:
          setup:
            - "One OPEN program at default thresholds."
            - "Four households with identical income and county median but household_size 1, 5, 7 and 9."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "HEEHRA 2026 Size Factors", state_code: "CO", budget_total_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/status"
              payload: { new_status: "OPEN" }
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Size One", email: "size1@example.com", service_address_line1: "1 Size St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 1, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh1: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Size Five", email: "size5@example.com", service_address_line1: "5 Size St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 5, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh5: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Size Seven", email: "size7@example.com", service_address_line1: "7 Size St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 7, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh7: $.data.id }
            - call: "POST /households"
              payload: { program_id: "${prog_id}", applicant_name: "Size Nine", email: "size9@example.com", service_address_line1: "9 Size St", county_code: "CO-031", utility_territory_code: "XCEL-CO", household_size: 9, existing_panel_amps: 200 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { hh9: $.data.id }
          trigger:
            - call: "POST /households/${hh1}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 1 }
              as: Applicant
              as_user_id: "${hh1}"
              captures: { iv1: $.data.id }
            - call: "POST /income-verifications/${iv1}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /households/${hh5}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 5 }
              as: Applicant
              as_user_id: "${hh5}"
              captures: { iv5: $.data.id }
            - call: "POST /income-verifications/${iv5}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /households/${hh7}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 7 }
              as: Applicant
              as_user_id: "${hh7}"
              captures: { iv7: $.data.id }
            - call: "POST /income-verifications/${iv7}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
            - call: "POST /households/${hh9}/income-verifications"
              payload: { annual_household_income_cents: 8000000, county_median_income_cents: 10000000, household_size_attested: 9 }
              as: Applicant
              as_user_id: "${hh9}"
              captures: { iv9: $.data.id }
            - call: "POST /income-verifications/${iv9}/verify"
              payload: { decision: "VERIFY" }
              as: ProgramReviewer
              as_user_id: "reviewer-1"
          assert:
            - "Household.${hh1}: factor 0.7 -> adjusted median 7000000 -> ami_raw 114.285714 -> ami_percent == 114.3, income_tier == MODERATE, rebate_cap_cents == 800000"
            - "Household.${hh5}: factor 1.08 -> adjusted median 10800000 -> ami_raw 74.074074 -> ami_percent == 74.1, income_tier == LOW, rebate_cap_cents == 1400000"
            - "Household.${hh7}: factor 1.24 -> adjusted median 12400000 -> ami_raw 64.516129 -> ami_percent == 64.5, income_tier == LOW"
            - "Household.${hh9}.ami_percent == 64.5 — identical to size 7 because SIZE_ADJUSTMENT[min(9, 7)] == 1.24; extrapolating the +0.08 per person pattern to 1.40 would have produced 57.1"
            - "IncomeVerification.${iv9}.household_size_attested == 9 is still stored verbatim even though its factor was clamped"
            - "The adjustment scales the MEDIAN, not the income: a bigger household yields a LOWER ami_percent on the same income, so ${hh1} is a higher tier than ${hh9} despite identical dollars"

      - name: cost_share_floors_the_half_cent_while_ami_rounds_half_up
        claim_type: precision
        grounds:
          - calculations.income_tier_assignment
          - calculations.measure_line_incentive
          - calculations.measure_incentive_allocation
        distinguishing_aspect: |
          Two different rounding modes coexist in one request chain: the AMI
          percentage uses round_half_up to one decimal (149.95 -> 150.0, which
          keeps the household MODERATE) while the cost-share cap uses floor on
          integer cents (floor(1000001 * 0.5) == 500000, not 500001). Getting
          either mode wrong changes a visible field.
        test_recipe:
          setup:
            - "One OPEN program at defaults: moderate_tier_cost_share_pct 0.5, moderate_tier_cap_cents 800000, group_cap_cents 800000."
            - "One catalog item HP-HVAC-01: unit_incentive_cents 800000, measure_cap_cents 800000, max_quantity 1, HVAC_GROUP, required_panel_capacity_amps 200, anchor."
            - "One household, size 4, panel 200 A, income 14995000 vs median 10000000 -> ami_raw exactly 149.95."
            - "One ENROLLED_ACTIVE contractor and an APPROVED assessment for HP-HVAC-01."
          setup_api_calls:
            - call: "POST /programs"
