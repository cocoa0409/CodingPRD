              as: IncentiveController
              as_user_id: "u-controller-1"
            - call: "POST /incentives/payment-batches"
              payload: { batch_code: "RTB-4", region_code: "WEST", period_start: "2026-08-17T00:00:00.000Z", period_end: "2026-08-28T00:00:00.000Z", scheduled_pay_date: "2026-09-20T00:00:00.000Z" }
              as: IncentiveController
