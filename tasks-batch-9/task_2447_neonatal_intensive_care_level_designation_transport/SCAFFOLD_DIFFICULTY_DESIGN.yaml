            - call: "GET /nicu-units/${unit_a}"
              payload: {}
              as: UnitDirector
              as_user_id: "${unit_a}:dir-1"
              captures: { v_t2: $.data.version }
            - call: "PATCH /nicu-units/${unit_a}"
              payload: { expected_unit_version: "${v_t2}", staffed_bed_target: 1 }
              as: UnitDirector
