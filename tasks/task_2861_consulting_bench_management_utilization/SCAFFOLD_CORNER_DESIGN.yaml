          - calculations.opportunity_coverage
          - calculations.practice_posture_rollup
          - calculations.rate_realization
        distinguishing_aspect: "No read in this recipe is retried or delayed: the confirm response already carries CONFIRMED, and the immediately following reads of the consultant, the group and the demand already show the settled cascade; the auto-approving discount create carries status APPROVED and decided_by_user_id SYSTEM_AUTO in its OWN 201 body, and the demand's re-priced rate and the assignment's re-pinned bill rate are visible on the very next request."
        test_recipe:
          setup:
            - "Clock 2026-08-03 (before the delivery window, so no workday is delivered and earned_realization_pct stays null)."
            - "One NA group holding exactly one consultant (cost 120.00, proficiency 4): bench_headcount 1 of 1 gives own_bench_ratio 1.0000 and posture FROZEN until the confirm takes them off the bench."
            - "Demand: standard 250.00, requested 250.00, required_fte 1.00, min_proficiency_level 3, onsite 2, window [2026-08-17, 2026-08-28]; QUALIFIED and INTERNAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: ResourceManager
            - call: "POST /practice-groups"
              payload: { name: "Cloud NA", geography_code: "NA" }
              as: PracticePartner
              captures: { pg_id: $.data.id }
            - call: "POST /skills"
              payload: { code: "CLOUD_ARCH", name: "Cloud Architecture", family: "CLOUD" }
              as: PracticePartner
              captures: { sk_id: $.data.id }
            - call: "POST /consultants"
              payload: { full_name: "Ada Byron", email: "ada.byron@firm.test", level: "CONSULTANT", practice_group_id: "${pg_id}", home_city: "Boston", home_geo_code: "NA", cost_rate_usd_per_hour: 120.00, standard_bill_rate_usd_per_hour: 300.00, travel_max_nights_per_week: 3 }
              as: ResourceManager
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - call: "POST /skill-assertions"
              payload: { consultant_id: "${c1_id}", skill_id: "${sk_id}", proficiency_level: 4 }
              as: ResourceManager
            - call: "POST /demand-opportunities"
              payload: { client_name: "Acme Retail", practice_group_id: "${pg_id}", required_skill_id: "${sk_id}", min_proficiency_level: 3, required_fte: 1.00, win_probability_pct: 60, start_date: "2026-08-17", end_date: "2026-08-28", industry_code: "RETAIL", onsite_nights_per_week: 2, standard_rate_usd_per_hour: 250.00, requested_rate_usd_per_hour: 250.00 }
              as: SalesLead
              captures: { d1_id: $.data.id }
            - call: "POST /demand-opportunities/${d1_id}/qualify"
              payload: {}
              as: SalesLead
            - call: "POST /demand-opportunities/${d1_id}/staffing-mode"
              payload: { staffing_mode: "INTERNAL" }
              as: ResourceManager
              captures: { d1_v: $.data.version }
            - call: "POST /assignments"
              payload: { consultant_id: "${c1_id}", demand_opportunity_id: "${d1_id}", allocation_pct: 100.00, start_date: "2026-08-17", end_date: "2026-08-29", category: "BILLABLE", expected_consultant_version: "${c1_v}" }
              as: ResourceManager
              captures: { a1_id: $.data.id, a1_bill: $.data.bill_rate_usd_per_hour }
          trigger:
            - call: "POST /assignments/${a1_id}/confirm"
              payload: {}
              as: ResourceManager
              captures: { a1_status: $.data.status, a1_confirmed_on: $.data.confirmed_on }
            - call: "GET /consultants/${c1_id}"
              as: ResourceManager
              captures: { c1_alloc: $.data.allocated_pct, c1_avail: $.data.availability_status }
            - call: "GET /practice-groups/${pg_id}"
              as: PracticePartner
              captures: { pg_bench: $.data.bench_headcount, pg_ratio: $.data.own_bench_ratio, pg_posture: $.data.posture }
            - call: "GET /demand-opportunities/${d1_id}"
              as: SalesLead
              captures: { d1_covered: $.data.covered_internal_fte, d1_open: $.data.open_fte, d1_staffing: $.data.staffing_status, d1_earned: $.data.earned_realization_pct, d1_v2: $.data.version }
            - call: "POST /discount-approvals"
              payload: { demand_opportunity_id: "${d1_id}", requested_rate_usd_per_hour: 245.00, expected_opportunity_version: "${d1_v2}" }
              as: SalesLead
              as_user_id: "u-alice"
              captures: { da_status: $.data.status, da_decided_by: $.data.decided_by_user_id, da_tier: $.data.required_tier, da_discount: $.data.discount_pct, da_cost: $.data.blended_cost_rate_usd_per_hour, da_margin: $.data.projected_margin_pct }
            - call: "GET /demand-opportunities/${d1_id}"
              as: SalesLead
              captures: { d1_approved: $.data.approved_rate_usd_per_hour, d1_effective: $.data.effective_rate_usd_per_hour, d1_booked: $.data.booked_realization_pct }
            - call: "GET /assignments/${a1_id}"
              as: ResourceManager
              captures: { a1_bill2: $.data.bill_rate_usd_per_hour }
          assert:
            - "${a1_status} == \"CONFIRMED\" and ${a1_confirmed_on} == 2026-08-03 in the confirm response itself; ${a1_bill} == 250.00 was already pinned at create time"
            - "the very next reads show ${c1_alloc} == 100.00, ${c1_avail} == \"ASSIGNED\", ${pg_bench} == 0, ${pg_ratio} == 0.0000 and ${pg_posture} == \"OPEN\" — the whole rollup settled inside the confirm, with no second request needed to trigger it"
            - "${d1_covered} == 1.00, ${d1_open} == 0.00, ${d1_staffing} == \"COVERED\" and ${d1_earned} is null (clock 2026-08-03 precedes the window, so total_delivered_hours == 0); ${d1_v2} == 4 after create, qualify, staffing-mode and confirm"
            - "the discount create's OWN 201 body carries ${da_discount} == round(100*(250.00-245.00)/250.00,2) == 2.00, ${da_tier} == \"NONE\", ${da_cost} == 120.00 (MIX_WEIGHTED: one CONFIRMED assignment, equal-weighted at allocation_pct because no workday is delivered), ${da_margin} == round(100*(245.00-120.00)/245.00,2) == 51.02, ${da_status} == \"APPROVED\" and ${da_decided_by} == \"SYSTEM_AUTO\" — the S7 auto-approval is not deferred to a later read"
            - "${d1_approved} == 245.00, ${d1_effective} == 245.00 and ${d1_booked} == round(100*245.00/250.00,2) == 98.00 on the immediately following read"
            - "${a1_bill2} == 245.00 — the four-hop rate cascade re-pinned the BILLABLE assignment's bill rate as part of the same write, not asynchronously"
