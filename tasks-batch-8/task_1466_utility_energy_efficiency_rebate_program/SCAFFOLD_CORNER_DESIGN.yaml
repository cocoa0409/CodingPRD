# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Utility Energy-Efficiency Rebate Program Administration
# =============================================================================
# Breadth coverage for §1.1–§1.7 claims not already exercised by §1.8.
# Sections follow the claim-extraction-guide taxonomy.

scaffold_corner_design:

  # ===========================================================================
  # Section: entities — creation / retrieval / listing / not-found /
  # required fields / defaults / computed fields / system fields /
  # type constraints / immutability
  # ===========================================================================
  - section: entities
    instances:
      - name: program_year_creation_assigns_defaults
        claim_type: creation
        grounds:
          - entities.ProgramYear
          - endpoints[POST /program-years]
        distinguishing_aspect: |
          POST /program-years with the four required inputs returns 201 and
          the server-minted fields: status=DRAFT, committed_cents=0,
          paid_cents=0, reported_kwh=0, adjusted_kwh=0, goal_attainment_pct=0,
          version=1.
        test_recipe:
          setup: ["Empty DB; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /program-years"
              payload: { program_code: "RES-2026", program_year_label: "PY2026", budget_cap_cents: 5000000, savings_goal_kwh: 100000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
          assert:
            - "ProgramYear.${py_id}.status == 'DRAFT'"
            - "ProgramYear.${py_id}.committed_cents == 0"
            - "ProgramYear.${py_id}.paid_cents == 0"
            - "ProgramYear.${py_id}.reported_kwh == 0"
            - "ProgramYear.${py_id}.adjusted_kwh == 0"
            - "ProgramYear.${py_id}.goal_attainment_pct == 0"
            - "ProgramYear.${py_id}.version == 1"

      - name: program_year_get_by_id_returns_stored_entity
        claim_type: retrieval
        grounds:
          - entities.ProgramYear
          - endpoints[GET /program-years/{id}]
        distinguishing_aspect: |
          GET /program-years/{id} returns the persisted entity with all input
          and computed fields visible.
        test_recipe:
          setup: ["One ProgramYear created"]
          setup_api_calls:
            - call: "POST /program-years"
              payload: { program_code: "RES-2026", program_year_label: "PY2026", budget_cap_cents: 5000000, savings_goal_kwh: 100000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
          trigger:
            - call: "GET /program-years/${py_id}"
              as: ProgramAdministrator
          assert:
            - "GET returns 200"
            - "ProgramYear.${py_id}.program_code == 'RES-2026'"
            - "ProgramYear.${py_id}.budget_cap_cents == 5000000"

      - name: program_year_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /program-years/{id}]
          - errors[ERR_PROGRAM_YEAR_NOT_FOUND]
        distinguishing_aspect: |
          GET on a non-existent ProgramYear id returns 404 with
          ERR_PROGRAM_YEAR_NOT_FOUND.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /program-years/00000000-0000-0000-0000-000000000000"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_PROGRAM_YEAR_NOT_FOUND'"

      - name: program_year_list_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /program-years]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          GET /program-years supports limit/offset and returns the standard
          pagination fields (limit, offset, total_count, has_more).
        test_recipe:
          setup: ["Three ProgramYears created"]
          setup_api_calls:
            - call: "POST /program-years"
              payload: { program_code: "P1", program_year_label: "PY1", budget_cap_cents: 1000000, savings_goal_kwh: 1000 }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "P2", program_year_label: "PY2", budget_cap_cents: 1000000, savings_goal_kwh: 1000 }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "P3", program_year_label: "PY3", budget_cap_cents: 1000000, savings_goal_kwh: 1000 }
              as: ProgramAdministrator
          trigger:
            - call: "GET /program-years?limit=2&offset=0"
              as: ProgramAdministrator
          assert:
            - "Response envelope contains pagination fields limit, offset, total_count, has_more"
            - "total_count == 3"
            - "has_more == true when limit=2 and offset=0"

      - name: program_year_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - endpoints[POST /program-years]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Omitting required field budget_cap_cents on POST /program-years
          returns 400 ERR_INVALID_REQUEST.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /program-years"
              payload: { program_code: "P1", program_year_label: "PY1", savings_goal_kwh: 1000 }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "error_id == 'ERR_INVALID_REQUEST'"

      - name: measure_creation_returns_defaults
        claim_type: defaults
        grounds:
          - entities.Measure
          - endpoints[POST /measures]
        distinguishing_aspect: |
          POST /measures without explicit is_active or requires_post_inspection
          defaults both to true/false respectively (is_active=true,
          requires_post_inspection=false).
        test_recipe:
          setup: ["One ProgramYear created"]
          setup_api_calls:
            - call: "POST /program-years"
              payload: { program_code: "P1", program_year_label: "PY1", budget_cap_cents: 1000000, savings_goal_kwh: 1000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M1", measure_name: "Measure 1", base_rate_cents: 5000, deemed_kwh_per_unit: 200 }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
          assert:
            - "Measure.${m_id}.is_active == true"
            - "Measure.${m_id}.requires_post_inspection == false"

      - name: measure_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /measures/{id}]
          - errors[ERR_MEASURE_NOT_FOUND]
        distinguishing_aspect: |
          GET on a non-existent Measure id returns 404 ERR_MEASURE_NOT_FOUND.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /measures/00000000-0000-0000-0000-000000000000"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_MEASURE_NOT_FOUND'"

      - name: trade_ally_creation_assigns_default_score_and_tier
        claim_type: defaults
        grounds:
          - entities.TradeAlly
          - endpoints[POST /trade-allies]
        distinguishing_aspect: |
          POST /trade-allies initializes performance_score=100 and
          standing_tier=STANDARD even though no inspections have completed
          (default for completed==0 branch).
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
          assert:
            - "TradeAlly.${ally_id}.enroll_status == 'PENDING'"
            - "TradeAlly.${ally_id}.performance_score == 100"
            - "TradeAlly.${ally_id}.standing_tier == 'STANDARD'"

      - name: trade_ally_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /trade-allies/{id}]
          - errors[ERR_ALLY_NOT_FOUND]
        distinguishing_aspect: |
          GET on a non-existent TradeAlly id returns 404 ERR_ALLY_NOT_FOUND.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /trade-allies/00000000-0000-0000-0000-000000000000"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_ALLY_NOT_FOUND'"

      - name: application_creation_assigns_draft_and_zero_totals
        claim_type: creation
        grounds:
          - entities.RebateApplication
          - endpoints[POST /applications]
        distinguishing_aspect: |
          POST /applications initializes status=DRAFT, incentive_total_cents=0,
          claimed_kwh=0, final_kwh=0, inspection_required=false, risk_score=0,
          auto_flag_status=CLEAR.
        test_recipe:
          setup: ["One OPEN ProgramYear, one ACTIVE TradeAlly"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "P1", program_year_label: "PY1", budget_cap_cents: 1000000, savings_goal_kwh: 1000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M1", measure_name: "M1", base_rate_cents: 5000, deemed_kwh_per_unit: 200 }
              as: ProgramAdministrator
            - call: "POST /program-years/${py_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C1", service_address: "1 A", invoice_number: "I-1", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_id: $.data.id }
          assert:
            - "RebateApplication.${app_id}.status == 'DRAFT'"
            - "RebateApplication.${app_id}.incentive_total_cents == 0"
            - "RebateApplication.${app_id}.claimed_kwh == 0"
            - "RebateApplication.${app_id}.final_kwh == 0"
            - "RebateApplication.${app_id}.inspection_required == false"
            - "RebateApplication.${app_id}.risk_score == 0"
            - "RebateApplication.${app_id}.auto_flag_status == 'CLEAR'"

      - name: application_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /applications/{id}]
          - errors[ERR_APPLICATION_NOT_FOUND]
        distinguishing_aspect: |
          GET on a non-existent application id returns 404 ERR_APPLICATION_NOT_FOUND.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /applications/00000000-0000-0000-0000-000000000000"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_APPLICATION_NOT_FOUND'"

      - name: line_item_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /line-items/{id}]
          - errors[ERR_LINE_ITEM_NOT_FOUND]
        distinguishing_aspect: |
          GET on a non-existent line-item id returns 404 ERR_LINE_ITEM_NOT_FOUND.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /line-items/00000000-0000-0000-0000-000000000000"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_LINE_ITEM_NOT_FOUND'"

      - name: savings_claim_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /savings-claims/{id}]
          - errors[ERR_SAVINGS_CLAIM_NOT_FOUND]
        distinguishing_aspect: |
          GET on a non-existent savings-claim id returns 404 ERR_SAVINGS_CLAIM_NOT_FOUND.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /savings-claims/00000000-0000-0000-0000-000000000000"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_SAVINGS_CLAIM_NOT_FOUND'"

      - name: inspection_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /inspections/{id}]
          - errors[ERR_INSPECTION_NOT_FOUND]
        distinguishing_aspect: |
          GET on a non-existent inspection id returns 404 ERR_INSPECTION_NOT_FOUND.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /inspections/00000000-0000-0000-0000-000000000000"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_INSPECTION_NOT_FOUND'"

      - name: evaluation_adjustment_not_found_returns_404
        claim_type: not_found
        grounds:
          - endpoints[GET /evaluation-adjustments/{id}]
          - errors[ERR_ADJUSTMENT_NOT_FOUND]
        distinguishing_aspect: |
          GET on a non-existent adjustment id returns 404 ERR_ADJUSTMENT_NOT_FOUND.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /evaluation-adjustments/00000000-0000-0000-0000-000000000000"
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "error_id == 'ERR_ADJUSTMENT_NOT_FOUND'"

      - name: fraud_flag_list_returns_created_flags
        claim_type: listing
        grounds:
          - endpoints[GET /fraud-flags]
          - entities.FraudFlag
        distinguishing_aspect: |
          GET /fraud-flags?application_id=<id> returns the FraudFlag rows that
          were persisted at submit time when the risk rules triggered.
        test_recipe:
          setup:
            - "OPEN ProgramYear; logical clock 2026-08-13"
            - "TradeAlly ACTIVE; 5 SUBMITTED applications on the same day (5th triggers ALLY_BURST)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "P1", program_year_label: "PY1", budget_cap_cents: 100000000, savings_goal_kwh: 1000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M1", measure_name: "M1", base_rate_cents: 1000, deemed_kwh_per_unit: 100 }
              as: ProgramAdministrator
              captures: { m1: $.data.id }
            - call: "POST /program-years/${py_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C1", service_address: "1 A", invoice_number: "I-1", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { a1: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${a1}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${a1}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C2", service_address: "2 A", invoice_number: "I-2", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { a2: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${a2}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${a2}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C3", service_address: "3 A", invoice_number: "I-3", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { a3: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${a3}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${a3}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C4", service_address: "4 A", invoice_number: "I-4", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { a4: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${a4}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${a4}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C5", service_address: "5 A", invoice_number: "I-5", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { a5: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${a5}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
            - call: "POST /applications/${a5}/submit"
              payload: {}
              as: TradeAlly
              as_user_id: "${ally_id}"
          trigger:
            - call: "GET /fraud-flags?application_id=${a5}"
              as: ProgramAdministrator
          assert:
            - "Exactly one FraudFlag row for application ${a5}"
            - "FraudFlag.flag_kind == 'ALLY_BURST'"
            - "FraudFlag.weight == 25"

      - name: savings_claim_immutable_after_creation
        claim_type: immutability
        grounds:
          - entities.SavingsClaim
        distinguishing_aspect: |
          SavingsClaim uses common_fields: false — it has id + created_at only.
          There is no PUT/PATCH/DELETE endpoint for SavingsClaim; only POST
          and GET. version and updated_at fields are absent.
        test_recipe:
          setup:
            - "OPEN ProgramYear; ACTIVE ally; DRAFT application; one line item"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /program-years"
              payload: { program_code: "P1", program_year_label: "PY1", budget_cap_cents: 1000000, savings_goal_kwh: 1000 }
              as: ProgramAdministrator
              captures: { py_id: $.data.id }
            - call: "POST /measures"
              payload: { program_year_id: "${py_id}", measure_code: "M1", measure_name: "M1", base_rate_cents: 5000, deemed_kwh_per_unit: 200 }
              as: ProgramAdministrator
              captures: { m1: $.data.id }
            - call: "POST /program-years/${py_id}/open"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /applications"
              payload: { program_year_id: "${py_id}", trade_ally_id: "${ally_id}", customer_account_number: "C1", service_address: "1 A", invoice_number: "I-1", invoice_date: "2026-08-01" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { app_id: $.data.id }
            - call: "POST /line-items"
              payload: { application_id: "${app_id}", measure_id: "${m1}", quantity: 1 }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /savings-claims"
              payload: { line_item_id: "${line_id}", claim_method: "DEEMED" }
              as: TradeAlly
              as_user_id: "${ally_id}"
              captures: { sc_id: $.data.id }
          assert:
            - "SavingsClaim.${sc_id} response contains id and created_at"
            - "SavingsClaim.${sc_id} response does NOT contain version"
            - "SavingsClaim.${sc_id} response does NOT contain updated_at"

  # ===========================================================================
  # Section: state_machines — initial state, invalid transitions,
  # terminal-state lockdown, side-effect execution
  # ===========================================================================
  - section: state_machines
    instances:
      - name: trade_ally_initial_state_is_pending
        claim_type: initial_state
        grounds:
          - state_machines.TradeAlly
        distinguishing_aspect: |
          A newly created TradeAlly starts in PENDING (initial_state).
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
          assert:
            - "TradeAlly.${ally_id}.enroll_status == 'PENDING'"

      - name: trade_ally_terminate_from_pending_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.TradeAlly
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Terminate is only declared from ACTIVE or SUSPENDED. Calling it on a
          PENDING ally returns ERR_INVALID_STATE.
        test_recipe:
          setup: ["One PENDING TradeAlly"]
          setup_api_calls:
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
          trigger:
            - call: "POST /trade-allies/${ally_id}/terminate"
              payload: {}
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_INVALID_STATE'"

      - name: trade_ally_terminated_is_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TradeAlly
        distinguishing_aspect: |
          TERMINATED is a terminal state — any further state-transition attempt
          (activate, suspend, reinstate, terminate) returns ERR_INVALID_STATE.
        test_recipe:
          setup: ["One TERMINATED TradeAlly (activated then terminated)"]
          setup_api_calls:
            - call: "POST /trade-allies"
              payload: { ally_name: "Acme", license_number: "LIC-001" }
              as: ProgramAdministrator
              captures: { ally_id: $.data.id }
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /trade-allies/${ally_id}/terminate"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /trade-allies/${ally_id}/activate"
              payload: {}
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "error_id == 'ERR_INVALID_STATE'"

      - name: application_submit_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds:
