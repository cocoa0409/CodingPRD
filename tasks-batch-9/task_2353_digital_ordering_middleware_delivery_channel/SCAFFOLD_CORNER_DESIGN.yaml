  # ===========================================================================
  - section: complexity_layers
    instances:

      - name: occ_publish_menu_with_stale_store_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[menu-publish-stale-store]
          - errors[ERR_STALE_STORE_VERSION]
        distinguishing_aspect: "The Store OCC rule is exercised against a version consumed by an unrelated writer (PATCH /stores changes capacity config, not the menu), so the publish is refused purely on the version token and succeeds once re-read."
        test_recipe:
          setup:
            - "BASE: MARKETMAX, a finalized BURGER menu version, Store S26 with a Monday window and no menu published"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T16:00:00Z" }
              as: PlatformAdmin
            - call: "POST /channels"
              payload: { code: "MARKETMAX", name: "MarketMax", channel_type: "MARKETPLACE", markup_bps: 1500, rounding_mode: "NICKEL", service_fee_cents: 299, commission_bps: 2500, settlement_mode: "NET_MODE", eighty_six_policy: "HONOR_86", throttle_policy: "SUPPRESS_ON_THROTTLE", adjustment_review_mode: "CHANNEL_REVIEW", accepts_delivery: true }
              as: PlatformAdmin
              captures: { ch_mp_id: "$.data.id" }
            - call: "POST /menu-versions"
              payload: { brand_code: "BRD1", version_label: "2026-Q3-CORE" }
              as: PlatformAdmin
              captures: { mv_id: "$.data.id" }
            - call: "POST /menu-versions/${mv_id}/items"
              payload: { sku: "BURGER", name: "Burger", base_price_cents: 1099, tax_bps: 875 }
              as: PlatformAdmin
            - call: "POST /menu-versions/${mv_id}/finalize"
              payload: {}
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { brand_code: "BRD1", name: "Store Twentysix", timezone_offset_minutes: -300, base_prep_minutes: 12, prep_capacity_per_bucket: 2, pos_retry_limit: 2, tablet_backlog_threshold: 1 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id", store_v1: "$.data.version" }
            - call: "POST /stores/${store_id}/hour-windows"
              payload: { day_of_week: 0, opens_at_minute: 600, closes_at_minute: 1320 }
              as: StoreOperator
              as_user_id: "${store_id}"
          trigger:
            - call: "PATCH /stores/${store_id}"
              payload: { base_prep_minutes: 20 }
              as: PlatformAdmin
              captures: { store_v2: "$.data.version" }
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v1}" }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /stores/${store_id}/publish-menu"
              payload: { menu_version_id: "${mv_id}", expected_store_version: "${store_v2}" }
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { store_v3: "$.data.version" }
          assert:
            - "The create response carried version 1, the PATCH response carries version 2, and adding the hour window did not bump the Store version (child creation is not a Store write)"
            - "Publishing with the stale version 1 returns 412 with data.error_id == ERR_STALE_STORE_VERSION and leaves active_menu_version_id null, throttle_state PAUSED and version 2"
            - "Publishing with version 2 returns 200 with version 3, active_menu_version_id == ${mv_id} and throttle_state NORMAL"
            - "A quote requested right after the successful publish returns promised_ready_at 2026-08-03T16:20:00Z, proving the PATCH's base_prep_minutes 20 took effect"

      - name: occ_adjustment_with_consumed_order_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[adjustment-create-stale-order]
          - errors[ERR_STALE_ORDER_VERSION]
        distinguishing_aspect: "Creating an adjustment itself bumps the parent Order's version, so replaying the very token that just worked is the natural stale case, and it must be refused even though the payload is otherwise identical and well within the refund ceiling."
        test_recipe:
