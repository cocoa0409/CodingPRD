        grounds:
          - validations[priority=11]
          - errors[ERR_FREEZE_DATE_NOT_REACHED]
        distinguishing_aspect: "With the logical clock at its 2026-08-01 default (before proposal_freeze_at 2026-10-01), freeze-proposals fails with ERR_FREEZE_DATE_NOT_REACHED."
