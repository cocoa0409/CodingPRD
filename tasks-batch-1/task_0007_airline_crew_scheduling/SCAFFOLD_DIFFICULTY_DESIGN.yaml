  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_confirm
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_FAA_DUTY_CAP_EXCEEDED]
        distinguishing_aspect: |
          A confirm call that would (a) be blocked because the Pairing is in
          DRAFT not AWARDED (state error_id=ERR_INVALID_STATE at priority 5)
          AND (b) would project FAA duty cap exceeded (business_safety error_id=
          ERR_FAA_DUTY_CAP_EXCEEDED at priority 7) MUST return the state error
          (priority 5 wins over priority 7). Error-category pair is
          state vs business_safety.
