  - section: endpoints
    instances:
      - name: withdraw_from_approved_releases_term_count
        claim_type: side_effect_execution
        grounds:
          - state_machines.Proposal.APPROVED_to_WITHDRAWN
          - entities.Term.fields.scheduled_proposal_count
        distinguishing_aspect: "Withdrawing an APPROVED proposal decrements the effective term's scheduled_proposal_count back to 0 — the action endpoint's ledger side effect."
        test_recipe:
          setup: ["Department CS; term T1; NEW_COURSE proposal fully approved with effective term T1 (count 1)"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: CurriculumCommittee, as_user_id: "cc-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: FacultySenate, as_user_id: "sen-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1" }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/withdraw", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { st: $.data.status } }
            - { call: "GET /curriculum/terms/${t1}", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { count: $.data.scheduled_proposal_count } }
          assert:
            - "captured st == WITHDRAWN"
            - "captured count == 0 (approval had booked 1; withdraw released it)"
      - name: reassign_same_term_rejected
        claim_type: conditional_action
        grounds:
          - state_machines.Proposal.APPROVED_to_APPROVED
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "REASSIGN_TERM to the already-assigned term is a shape violation (ERR_VALIDATION), not a no-op."
        test_recipe:
          setup: ["Department CS; term T1; NEW_COURSE proposal APPROVED with effective term T1"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: CurriculumCommittee, as_user_id: "cc-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: FacultySenate, as_user_id: "sen-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1" }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "REASSIGN_TERM", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_VALIDATION (same-term reassignment)"
            - "Proposal.${prop}.effective_term_id still == ${t1}"
      - name: catalog_entries_computed_read_covered
        claim_type: computed_read
        grounds:
          - entities.CatalogEntry
          - endpoints
        excluded_because:
          difficulty_instance: transitive_cascade / edition_publish_cascade_depth2
          rationale: "GET /curriculum/catalog-entries filtered by edition_id is exercised and asserted in the named §1.8 instance."

  - section: errors
    instances:
      - name: list_proposals_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected 401 ERR_UNAUTHENTICATED before any role or existence check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /curriculum/proposals"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_UNAUTHENTICATED (HTTP 401)"
      - name: duplicate_cross_listing_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=21]
          - errors[ERR_CROSS_LISTING_EXISTS]
        distinguishing_aspect: "A second CrossListing for the same unordered pair (either order) while one is non-terminal fails ERR_CROSS_LISTING_EXISTS."
        test_recipe:
          setup: ["Departments CS and MATH; term T1; ACTIVE courses C (CS 301) and M (MATH 210); XL1 PENDING for (C, M)"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/departments", payload: { dept_name: "Mathematics", subject_codes: ["MATH"], college: "Sciences" }, as: Registrar, as_user_id: "reg-1", captures: { dept_math: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "CS", course_number: "301", title: "C", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x"], owning_department_id: "${dept_cs}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_c: $.data.id } }
            - { call: "POST /curriculum/courses", payload: { subject_code: "MATH", course_number: "210", title: "M", credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["x"], owning_department_id: "${dept_math}", introduced_in_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1", captures: { course_m: $.data.id } }
            - { call: "POST /curriculum/cross-listings", payload: { home_course_id: "${course_c}", partner_course_id: "${course_m}" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
          trigger:
            - { call: "POST /curriculum/cross-listings", payload: { home_course_id: "${course_m}", partner_course_id: "${course_c}" }, as: DepartmentChair, as_user_id: "${dept_math}", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_CROSS_LISTING_EXISTS (reversed order still the same unordered pair)"

