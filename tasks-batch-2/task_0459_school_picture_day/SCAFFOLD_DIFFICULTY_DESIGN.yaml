# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0459_school_picture_day
# 9 rule_ids x 2 instances = 18 instances.
# All FK ids in payloads use ${var} bound from earlier captures; literals are
# pinned wherever the author can determine them. Money is in cents.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: commission_provisional_vs_final_on_session
        grounds:
          - calculations.provisional_school_commission
          - calculations.final_school_commission
          - entities.PictureDaySession.fields.school_commission_balance_cents
          - state_machines.PhotoOrder.SUBMITTED_to_PAID
          - state_machines.PictureDaySession.ORDERING_CLOSED_to_SETTLED
        distinguishing_aspect: |
          On PictureDaySession, school_commission_balance_cents is 23400 after the three pays
          (per-order chronological rates, round-per-order) but settle reconciles it to 25200
          (single final-gross rate, sum-then-round): a +1800 delta on the SAME entity field
          computed two valid ways. This dual-variant lives on the session-commission domain.
        test_recipe:
          setup:
            - "Session in ORDERING_CLOSED with three PAID orders whose merchandise_cents are 36000, 45000, 45000 (total gross 126000)."
            - "Each PAID order has a DISPATCHED shipment so settle's ERR_UNSHIPPED_ORDERS precondition is satisfied."
            - "After pays, school_commission_balance_cents == 23400 (provisional)."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Maple Elementary", scheduled_date: "2026-05-01T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "P40", name: "Premium 400", tier: "PREMIUM", base_price_cents: 40000 }
              as: SchoolCoordinator
              captures: { pkg40: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "P50", name: "Premium 500", tier: "PREMIUM", base_price_cents: 50000 }
              as: SchoolCoordinator
              captures: { pkg50: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Ann Lee", grade: "5", homeroom: "R-1", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { stu1: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Ben Ng", grade: "5", homeroom: "R-2", guardian_user_id: "g2" }
              as: SchoolCoordinator
              captures: { stu2: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Cara Vo", grade: "5", homeroom: "R-3", guardian_user_id: "g3" }
              as: SchoolCoordinator
              captures: { stu3: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/students/${stu1}/mark-absent"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/students/${stu2}/mark-absent"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/students/${stu3}/mark-absent"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/picture-day-sessions/${sess}/open-gallery"
              payload: {}
              as: SchoolCoordinator
            # order 1: merch 36000
            - call: "POST /api/photo-orders"
              payload: { picture_day_session_id: "${sess}", student_id: "${stu1}" }
              as: Guardian
              as_user_id: "g1"
              captures: { o1: $.data.id }
            - call: "POST /api/order-lines"
              payload: { photo_order_id: "${o1}", package_item_id: "${pkg40}", quantity: 1 }
              as: Guardian
              as_user_id: "g1"
            - call: "POST /api/photo-orders/${o1}/submit"
              payload: {}
              as: Guardian
              as_user_id: "g1"
            - call: "POST /api/photo-orders/${o1}/pay"
              payload: {}
              as: FulfillmentClerk
            # order 2: merch 45000
            - call: "POST /api/photo-orders"
              payload: { picture_day_session_id: "${sess}", student_id: "${stu2}" }
              as: Guardian
              as_user_id: "g2"
              captures: { o2: $.data.id }
            - call: "POST /api/order-lines"
              payload: { photo_order_id: "${o2}", package_item_id: "${pkg50}", quantity: 1 }
              as: Guardian
              as_user_id: "g2"
            - call: "POST /api/photo-orders/${o2}/submit"
              payload: {}
              as: Guardian
              as_user_id: "g2"
            - call: "POST /api/photo-orders/${o2}/pay"
              payload: {}
              as: FulfillmentClerk
            # order 3: merch 45000
            - call: "POST /api/photo-orders"
              payload: { picture_day_session_id: "${sess}", student_id: "${stu3}" }
              as: Guardian
              as_user_id: "g3"
              captures: { o3: $.data.id }
            - call: "POST /api/order-lines"
              payload: { photo_order_id: "${o3}", package_item_id: "${pkg50}", quantity: 1 }
              as: Guardian
              as_user_id: "g3"
            - call: "POST /api/photo-orders/${o3}/submit"
              payload: {}
              as: Guardian
              as_user_id: "g3"
            - call: "POST /api/photo-orders/${o3}/pay"
              payload: {}
              as: FulfillmentClerk
            # ship all three so settle's unshipped precondition passes
            - call: "POST /api/shipments"
              payload: { photo_order_id: "${o1}", carrier: "USPS", distribution_method: "HOME_DELIVERY", tracking_code: "T1" }
              as: FulfillmentClerk
              captures: { sh1: $.data.id }
            - call: "POST /api/shipments/${sh1}/dispatch"
              payload: {}
              as: FulfillmentClerk
            - call: "POST /api/shipments"
              payload: { photo_order_id: "${o2}", carrier: "USPS", distribution_method: "HOME_DELIVERY", tracking_code: "T2" }
              as: FulfillmentClerk
              captures: { sh2: $.data.id }
            - call: "POST /api/shipments/${sh2}/dispatch"
              payload: {}
              as: FulfillmentClerk
            - call: "POST /api/shipments"
              payload: { photo_order_id: "${o3}", carrier: "USPS", distribution_method: "HOME_DELIVERY", tracking_code: "T3" }
              as: FulfillmentClerk
              captures: { sh3: $.data.id }
            - call: "POST /api/shipments/${sh3}/dispatch"
              payload: {}
              as: FulfillmentClerk
            - call: "POST /api/picture-day-sessions/${sess}/close-ordering"
              payload: {}
              as: SchoolCoordinator
            - call: "GET /api/picture-day-sessions/${sess}"
              payload: {}
              as: SchoolCoordinator
              captures: { v_pre: $.data.version, prov_balance: $.data.school_commission_balance_cents }
          trigger:
            - call: "POST /api/picture-day-sessions/${sess}/settle"
              payload: { expected_picture_day_session_version: "${v_pre}" }
              as: SchoolCoordinator
              captures: { final_balance: $.data.school_commission_balance_cents }
          assert:
            - "PictureDaySession.${sess}.school_commission_balance_cents == 23400 immediately before settle (provisional variant)"
            - "PictureDaySession.${sess}.school_commission_balance_cents == 25200 after settle (final variant)"
            - "The reconciliation delta is 25200 - 23400 == 1800"
            - "PictureDaySession.${sess}.status == SETTLED"

      - name: retouch_cost_premium_vs_nonpremium
        grounds:
          - calculations.retouch_cost
          - entities.RetouchOrder.fields.net_cost_cents
          - entities.RetouchOrder.fields.premium_linked
          - entities.PhotoOrder.fields.has_premium_line
        distinguishing_aspect: |
          On RetouchOrder (a different entity domain from session commission), an identical
          adjustment_count=3 retouch yields net_cost_cents=3000 when the matched student has NO
          paid premium order, but 1500 when the student does (comp_discount 50%). Same inputs, two
          valid results keyed on the linked PhotoOrder's has_premium_line.
        test_recipe:
          setup:
            - "Session in GALLERY_OPEN with student S1 PHOTOGRAPHED via matched photo PH1."
            - "S1 has a PAID order containing a PREMIUM line (has_premium_line=true)."
            - "Student S2 PHOTOGRAPHED via PH2 but S2 has NO paid premium order."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Oak School", scheduled_date: "2026-05-02T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 100000 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "PRM", name: "Premium", tier: "PREMIUM", base_price_cents: 40000 }
              as: SchoolCoordinator
              captures: { pkgP: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "BSC", name: "Basic", tier: "BASIC", base_price_cents: 2499 }
              as: SchoolCoordinator
              captures: { pkgB: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Sam One", grade: "3", homeroom: "H1", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Sue Two", grade: "3", homeroom: "H2", guardian_user_id: "g2" }
              as: SchoolCoordinator
              captures: { s2: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/photos"
              payload: { picture_day_session_id: "${sess}", candidate_name: "Sam One", candidate_grade: "3", candidate_homeroom: "H1" }
              as: StudioPhotographer
              captures: { ph1: $.data.id }
            - call: "POST /api/photos/${ph1}/match"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/photos"
              payload: { picture_day_session_id: "${sess}", candidate_name: "Sue Two", candidate_grade: "3", candidate_homeroom: "H2" }
              as: StudioPhotographer
              captures: { ph2: $.data.id }
            - call: "POST /api/photos/${ph2}/match"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/picture-day-sessions/${sess}/open-gallery"
              payload: {}
              as: SchoolCoordinator
            # S1 gets a PAID premium order
            - call: "POST /api/photo-orders"
              payload: { picture_day_session_id: "${sess}", student_id: "${s1}" }
              as: Guardian
              as_user_id: "g1"
              captures: { o1: $.data.id }
            - call: "POST /api/order-lines"
              payload: { photo_order_id: "${o1}", package_item_id: "${pkgP}", quantity: 1 }
              as: Guardian
              as_user_id: "g1"
            - call: "POST /api/photo-orders/${o1}/submit"
              payload: {}
              as: Guardian
              as_user_id: "g1"
            - call: "POST /api/photo-orders/${o1}/pay"
              payload: {}
              as: FulfillmentClerk
          trigger:
            - call: "POST /api/retouch-orders"
              payload: { photo_id: "${ph1}", kind: "RETOUCH", adjustment_count: 3 }
              as: StudioPhotographer
              captures: { rt_premium: $.data.id, net_premium: $.data.net_cost_cents }
            - call: "POST /api/retouch-orders"
              payload: { photo_id: "${ph2}", kind: "RETOUCH", adjustment_count: 3 }
              as: StudioPhotographer
              captures: { rt_plain: $.data.id, net_plain: $.data.net_cost_cents }
          assert:
            - "RetouchOrder.${rt_premium}.premium_linked == true"
            - "RetouchOrder.${rt_premium}.gross_cost_cents == 3000 and comp_discount_cents == 1500 and net_cost_cents == 1500"
            - "RetouchOrder.${rt_plain}.premium_linked == false and net_cost_cents == 3000"
            - "net_cost_cents differs (1500 vs 3000) for identical adjustment_count=3"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: order_total_tier_and_freeship_branches
        grounds:
          - calculations.order_total
          - entities.PhotoOrder.fields.merchandise_cents
          - entities.PhotoOrder.fields.shipping_cents
          - entities.PhotoOrder.fields.total_cents
          - state_machines.PhotoOrder.CART_to_SUBMITTED
        distinguishing_aspect: |
          MODE (a): order_total combines >=3 inputs with non-linear interaction — a subtotal-tier
          branch (0/5/10%) AND a free-shipping branch keyed on the post-discount merchandise. Two
          lines (BASIC 2499 x2 + DELUXE 3999 x1) -> subtotal 8997 -> 5% disc 450 -> merch 8547 ->
          merch<10000 so shipping 599 -> total 9146. No single linear formula reproduces this.
        test_recipe:
          setup:
            - "Session in GALLERY_OPEN with student S; catalog has BASIC@2499 and DELUXE@3999."
            - "Order O in CART with lines BASIC x2 and DELUXE x1."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Pine School", scheduled_date: "2026-05-03T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "B", name: "Basic", tier: "BASIC", base_price_cents: 2499 }
              as: SchoolCoordinator
              captures: { pkgB: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "D", name: "Deluxe", tier: "DELUXE", base_price_cents: 3999 }
              as: SchoolCoordinator
              captures: { pkgD: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Stu A", grade: "1", homeroom: "A", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/students/${s1}/mark-absent"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/picture-day-sessions/${sess}/open-gallery"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/photo-orders"
              payload: { picture_day_session_id: "${sess}", student_id: "${s1}" }
              as: Guardian
              as_user_id: "g1"
              captures: { o1: $.data.id }
            - call: "POST /api/order-lines"
              payload: { photo_order_id: "${o1}", package_item_id: "${pkgB}", quantity: 2 }
              as: Guardian
              as_user_id: "g1"
            - call: "POST /api/order-lines"
              payload: { photo_order_id: "${o1}", package_item_id: "${pkgD}", quantity: 1 }
              as: Guardian
              as_user_id: "g1"
          trigger:
            - call: "POST /api/photo-orders/${o1}/submit"
              payload: {}
              as: Guardian
              as_user_id: "g1"
              captures: { sub: $.data.subtotal_cents, disc: $.data.discount_cents, merch: $.data.merchandise_cents, ship: $.data.shipping_cents, tot: $.data.total_cents }
          assert:
            - "PhotoOrder.${o1}.subtotal_cents == 8997"
            - "PhotoOrder.${o1}.discount_cents == 450"
            - "PhotoOrder.${o1}.merchandise_cents == 8547"
            - "PhotoOrder.${o1}.shipping_cents == 599"
            - "PhotoOrder.${o1}.total_cents == 9146"

      - name: commission_rounding_order_perorder_vs_total
        grounds:
          - calculations.provisional_school_commission
          - calculations.final_school_commission
          - entities.PictureDaySession.fields.school_commission_balance_cents
          - state_machines.PictureDaySession.ORDERING_CLOSED_to_SETTLED
        distinguishing_aspect: |
          MODE (b): rounding order. Provisional rounds each order's commission then sums (rate taken
          at the chronological cumulative gross): 5400 + 9000 + 9000 = 23400. Final sums merchandise
          to 126000 then rounds once at the final rate (0.20): round(25200)=25200. The 1800 gap is
          purely the per-order-then-sum vs sum-then-round rounding/tier ordering, distinct from MODE (a).
        test_recipe:
          setup:
