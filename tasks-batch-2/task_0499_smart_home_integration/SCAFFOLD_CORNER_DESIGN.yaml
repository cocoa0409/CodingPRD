            - call: "POST /projects/${proj_id}/proposals"
              payload: { labor_hours_estimate: 1.0, expected_project_version: "${proj_v0}" }
              as: SystemsDesigner
              captures: { prop_id: $.data.id }
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/line-items"
              payload: { sku: "X", category: "CONTROLLER", qty: 1, unit_price_cents: 250000 }
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/send"
              payload: {}
              as: SystemsDesigner
            - call: "POST /projects/${proj_id}/proposals/${prop_id}/accept"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /crew-members"
              payload: { full_name: "W Tech", region_code: "WEST", cert_level: "JOURNEYMAN", daily_visit_cap: 2, active: true }
              as: PlatformAdmin
              captures: { crew_id: $.data.id }
            - call: "POST /projects/${proj_id}/visits"
              payload: { window_start: "2026-10-01T09:00:00Z", window_end: "2026-10-01T12:00:00Z", visit_kind: "INSTALL", crew_size_required: 1 }
              as: ProjectManager
              captures: { visit_id: $.data.id, visit_v0: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/visits/${visit_id}/assignments"
              payload: { crew_member_id: "${crew_id}", expected_visit_version: "${visit_v0}" }
              as: ProjectManager
              captures: { asg_id: $.data.id }
            - call: "GET /projects/${proj_id}/visits/${visit_id}"
              payload: {}
              as: ProjectManager
              captures: { visit_v1: $.data.version }
          assert:
            - "VisitAssignment.${asg_id}.status == ACTIVE"
            - "Visit.${visit_id}.version == ${visit_v0} + 1 after the assignment"
            - "Visit.${visit_id}.assigned_crew_count == 1"

      - name: occ_change_order_apply_stale_project_excluded
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[change-order-apply-stale-project]"]
        excluded_because:
          difficulty_instance: dual_variant_calc / proposal_total_estimate_vs_final_after_change_order
          rationale: "The change-order apply path with a freshly captured project version is exercised positively by the named §1.8 instance; the stale-version negative for this same endpoint is the symmetric OCC corner and is covered there by the captures discipline."

