        distinguishing_aspect: "A partial update writes only the supplied fields, leaves the others intact and increments Site.version by exactly 1, which is what a subsequent booking must echo as expected_site_version."
        test_recipe:
          setup: ["One site created with capacity 4 and no closures."]
          setup_api_calls:
            - call: "POST /employers"
