# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3408_rideshare_payload_manifest_launch_slot_assignment_range
# 9 Difficulty Rules x 2 instances = 18 instances. Every test_recipe is a
# replayable empty-DB chain over §1.5 endpoints.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: manifest_commitment_total_counts_provisional_firm_counts_confirmed_only
        grounds:
          - calculations.manifest_commitment
          - entities.Mission.fields.committed_mass_kg
          - entities.Mission.fields.firm_mass_kg
          - entities.Mission.fields.committed_volume_m3
        distinguishing_aspect: |
          Same mission state, two inclusion sets on the Mission entity domain: the TOTAL variant
          (committed_mass_kg) counts PROVISIONAL + CONFIRMED assignments (150 kg), while the FIRM
          variant (firm_mass_kg) counts only CONFIRMED + INTEGRATED (100 kg).
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One customer; one SSO mission (300 kg / 6.0 m3, window 2026-10-10..2026-10-20); ports DSP-A (stack 4, max 150, RING_15+RING_24) and DSP-B (stack 3, max 100, CUBESAT)."
            - "Contract (MARGINAL, window 2026-10-01..2026-10-31) signed, carrying PL1 100 kg RING_15 SSO 2.0 m3 and PL2 50 kg CUBESAT SSO 1.0 m3."
            - "Customer PAYLOAD_OPERATOR license GRANTED; A1 = PL1 on DSP-A verified (MECHANICAL+ELECTRICAL PASSED), safety APPROVEd, then CONFIRMED; A2 = PL2 on DSP-B left PROVISIONAL."
          setup_api_calls:
            - &d_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_customer
              call: "POST /rideshare/customers"
              payload: { org_name: "Acme SmallSat Ventures", contact_email: "ops@acme-ssv.example", default_rebookings: 1 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - &d_mission
              call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-X1", target_orbit: "SSO", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z", mass_capacity_kg: 300, volume_capacity_m3: 6.0 }
              as: MissionOps
              captures: { m_id: $.data.id }
            - &d_port_a
              call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-A", stack_position: 4, max_mass_kg: 150, supported_interface_classes: ["RING_15", "RING_24"] }
              as: MissionOps
              captures: { p_a: $.data.id }
            - &d_port_b
              call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-B", stack_position: 3, max_mass_kg: 100, supported_interface_classes: ["CUBESAT"] }
              as: MissionOps
              captures: { p_b: $.data.id }
            - &d_contract_2pl
              call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PL1", mass_kg: 100, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }, { payload_name: "PL2", mass_kg: 50, volume_m3: 1.0, interface_class: "CUBESAT", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - &d_sign_2pl
              call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - &d_payloads_2pl
              call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id", pl2: "$.data[1].id" }
            - &d_lic_customer
              call: "POST /rideshare/licenses"
              payload: { subject_type: "CUSTOMER", kind: "PAYLOAD_OPERATOR", customer_id: "${c_id}", valid_until: "2027-01-01T00:00:00Z", debris_score: 80, spectrum_score: 90, operator_history_score: 80 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { lic_c_id: $.data.id }
            - &d_lic_customer_grant
              call: "POST /rideshare/licenses/${lic_c_id}/transition"
              payload: { to_state: "GRANTED" }
              as: Regulator
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - &d_a1_ver_mech
              call: "POST /rideshare/assignments/${a1}/verifications"
              payload: { check_type: "MECHANICAL", outcome: "PASSED" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
            - &d_a1_ver_elec
              call: "POST /rideshare/assignments/${a1}/verifications"
              payload: { check_type: "ELECTRICAL", outcome: "PASSED" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
            - &d_a1_safety
              call: "POST /rideshare/assignments/${a1}/safety-reviews"
              payload: { decision: "APPROVE", rationale: "interfaces nominal" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v2: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl2}", dispenser_port_id: "${p_b}", expected_mission_version: "${m_v2}" }
              as: MissionOps
              captures: { a2: $.data.id }
          trigger:
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
          assert:
            - "Mission.${m_id}.committed_mass_kg == 150 (TOTAL variant counts PROVISIONAL A2)"
            - "Mission.${m_id}.firm_mass_kg == 100 (FIRM variant excludes PROVISIONAL A2)"
            - "Mission.${m_id}.committed_volume_m3 == 3.0"
            - "ManifestAssignment.${a1}.status == CONFIRMED and ManifestAssignment.${a2}.status == PROVISIONAL"
            - "Mission.${m_id}.committed_mass_kg != Mission.${m_id}.firm_mass_kg"

      - name: contract_quote_marginal_vs_flat_diverge_at_250kg
        grounds:
          - calculations.contract_price_quote
          - entities.LaunchContract.fields.quoted_price_cents
          - entities.LaunchContract.fields.pricing_mode
        distinguishing_aspect: |
          Same 250 kg payload mass on the LaunchContract fiscal domain: the MARGINAL waterfall
          (50x600000 + 150x500000 + 50x425000) yields 126,250,000 cents while the FLAT variant
          bills everything at the tier-3 rate (250x425000) yielding 106,250,000 cents.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One customer. Two contracts with an identical single 250 kg RING_24 SSO payload, differing only in pricing_mode; both signed by the customer."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "HeavySat-M", mass_kg: 250, volume_m3: 3.0, interface_class: "RING_24", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_m: $.data.id }
            - call: "POST /rideshare/contracts/${ct_m}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "FLAT", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "HeavySat-F", mass_kg: 250, volume_m3: 3.0, interface_class: "RING_24", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_f: $.data.id }
            - call: "POST /rideshare/contracts/${ct_f}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "GET /rideshare/contracts/${ct_m}"
              payload: {}
              as: ContractManager
            - call: "GET /rideshare/contracts/${ct_f}"
              payload: {}
              as: ContractManager
          assert:
            - "LaunchContract.${ct_m}.quoted_price_cents == 126250000"
            - "LaunchContract.${ct_f}.quoted_price_cents == 106250000"
            - "LaunchContract.${ct_m}.quoted_price_cents != LaunchContract.${ct_f}.quoted_price_cents for identical 250 kg input"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: tiered_marginal_quote_breakpoint_straddle_200_vs_201kg
        grounds:
          - calculations.contract_price_quote
        distinguishing_aspect: |
          Mode (a) combinatorial: the MARGINAL formula selects per-tier rates across three inputs
          (mass against 50 kg and 200 kg breakpoints, pricing_mode). Exactly 200 kg fills tiers
          1+2 with zero tier-3 (105,000,000 cents); adding 1 kg pushes that kilogram into tier 3
          (105,425,000 cents).
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One customer. Two MARGINAL contracts, one with a 200 kg payload, one with a 201 kg payload; both signed."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "Sat-200", mass_kg: 200, volume_m3: 2.5, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_200: $.data.id }
            - call: "POST /rideshare/contracts/${ct_200}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "Sat-201", mass_kg: 201, volume_m3: 2.5, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_201: $.data.id }
            - call: "POST /rideshare/contracts/${ct_201}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
          trigger:
            - call: "GET /rideshare/contracts/${ct_200}"
              payload: {}
              as: ContractManager
            - call: "GET /rideshare/contracts/${ct_201}"
              payload: {}
              as: ContractManager
          assert:
            - "LaunchContract.${ct_200}.quoted_price_cents == 105000000 (50x600000 + 150x500000 + 0x425000)"
            - "LaunchContract.${ct_201}.quoted_price_cents == 105425000 (50x600000 + 150x500000 + 1x425000)"
            - "the 1 kg difference between the contracts adds exactly 425000 cents, the tier-3 rate"

      - name: integration_fee_round_per_line_sum_vs_sum_round_differ_by_one_cent
        grounds:
          - calculations.integration_fee_ledger
          - entities.Mission.fields.integration_revenue_cents
          - entities.Mission.fields.revenue_estimate_cents
          - entities.ManifestAssignment.fields.integration_fee_cents
        distinguishing_aspect: |
          Mode (b) combinatorial: rounding order is pinned per-line-then-sum for the stored total.
          Two CUBESAT lines of 1.001 kg each produce an unrounded 9609.6 cents per line; the stored
          mission total is 9610+9610 = 19,220 while the estimate variant rounds after summing to
          19,219 — a one-cent divergence on identical inputs.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. One customer; one SSO mission (300 kg / 6.0 m3) with ports DSP-B (stack 3, max 100, CUBESAT) and DSP-D (stack 1, max 100, RING_15+CUBESAT)."
            - "Contract signed with two 1.001 kg CUBESAT SSO payloads; customer PAYLOAD_OPERATOR license GRANTED; both payloads assigned, verified, safety-approved, CONFIRMED; mission locked."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_b
            - &d_port_d
              call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-D", stack_position: 1, max_mass_kg: 100, supported_interface_classes: ["RING_15", "CUBESAT"] }
              as: MissionOps
              captures: { p_d: $.data.id }
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "Cube-1", mass_kg: 1.001, volume_m3: 0.1, interface_class: "CUBESAT", required_orbit: "SSO" }, { payload_name: "Cube-2", mass_kg: 1.001, volume_m3: 0.1, interface_class: "CUBESAT", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id", pl2: "$.data[1].id" }
            - *d_lic_customer
            - *d_lic_customer_grant
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_b}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - *d_a1_ver_mech
            - *d_a1_ver_elec
            - *d_a1_safety
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v2: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl2}", dispenser_port_id: "${p_d}", expected_mission_version: "${m_v2}" }
              as: MissionOps
              captures: { a2: $.data.id }
            - call: "POST /rideshare/assignments/${a2}/verifications"
              payload: { check_type: "MECHANICAL", outcome: "PASSED" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
            - call: "POST /rideshare/assignments/${a2}/verifications"
              payload: { check_type: "ELECTRICAL", outcome: "PASSED" }
              as: IntegrationEngineer
              as_user_id: "eng-1"
            - call: "POST /rideshare/assignments/${a2}/safety-reviews"
              payload: { decision: "APPROVE", rationale: "interfaces nominal" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /rideshare/assignments/${a2}/confirm"
              payload: {}
              as: MissionOps
            - call: "POST /rideshare/missions/${m_id}/lock-manifest"
              payload: {}
              as: MissionOps
          trigger:
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
            - call: "GET /rideshare/assignments/${a1}"
              payload: {}
              as: MissionOps
          assert:
            - "ManifestAssignment.${a1}.integration_fee_cents == 9610 (round_half_up of 9609.6 per line)"
            - "Mission.${m_id}.integration_revenue_cents == 19220 (9610 + 9610, round-per-line-then-sum)"
            - "Mission.${m_id}.revenue_estimate_cents == 19219 (round_half_up of 19219.2, sum-then-round)"
            - "Mission.${m_id}.integration_revenue_cents != Mission.${m_id}.revenue_estimate_cents"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_cycles_signed_manifested_signed_on_assignment_removal
        grounds:
          - state_machines.LaunchContract.SIGNED_to_MANIFESTED
          - state_machines.LaunchContract.MANIFESTED_to_SIGNED
          - state_machines.Payload.MANIFESTED_to_REGISTERED
        distinguishing_aspect: |
          LaunchContract runs a cycle: SIGNED -> MANIFESTED when its first live assignment is
          created, then MANIFESTED -> SIGNED when that assignment is removed and no other live
          assignment remains — a revert transition, not a forward pipeline.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Customer, mission (300 kg / 6.0 m3), port DSP-A; contract signed with PL1 100 kg RING_15 SSO; A1 assigns PL1 to DSP-A."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_a
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PL1", mass_kg: 100, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
              captures: { ct_v_signed: $.data.version }
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id" }
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
          trigger:
            - call: "GET /rideshare/contracts/${ct_id}"
              payload: {}
              as: MissionOps
              captures: { ct_v_manifested: $.data.version }
            - call: "POST /rideshare/assignments/${a1}/remove"
              payload: { reason_code: "CUSTOMER_REQUEST" }
              as: MissionOps
            - call: "GET /rideshare/contracts/${ct_id}"
              payload: {}
              as: MissionOps
          assert:
            - "after assignment creation, LaunchContract.${ct_id}.status == MANIFESTED and version == ${ct_v_signed} + 1"
            - "after removal, LaunchContract.${ct_id}.status == SIGNED (cycle back) and version == ${ct_v_manifested} + 1"
            - "Payload.${pl1}.status == REGISTERED again (its own MANIFESTED -> REGISTERED revert)"
            - "ManifestAssignment.${a1}.status == REMOVED"
            - "Mission.${m_id}.committed_mass_kg == 0"

      - name: mission_cycles_range_scheduled_back_to_manifest_locked_on_delay
        grounds:
          - state_machines.Mission.MANIFEST_LOCKED_to_RANGE_SCHEDULED
          - state_machines.Mission.RANGE_SCHEDULED_to_MANIFEST_LOCKED
          - state_machines.RangeSlot.CONFIRMED_to_RELEASED
        distinguishing_aspect: |
          Mission runs a cycle: MANIFEST_LOCKED -> RANGE_SCHEDULED when its slot confirms, then
          RANGE_SCHEDULED -> MANIFEST_LOCKED when a delay moves the window outside the confirmed
          slot — a regression transition on a different entity than the LaunchContract cycle.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Launch-ready mission: one CONFIRMED-then-INTEGRATED assignment (PL1 100 kg RING_15), manifest locked, LAUNCH_AUTHORIZATION license GRANTED (scores 90/80/90, valid_until 2026-12-31), CCAFS slot [2026-10-10, 2026-10-20] RESERVED then CONFIRMED. Contract window [2026-10-01, 2026-11-30] covers the delay target so no contract impact fires."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_a
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-11-30T00:00:00Z", payloads: [{ payload_name: "PL1", mass_kg: 100, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id" }
            - *d_lic_customer
            - *d_lic_customer_grant
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - *d_a1_ver_mech
            - *d_a1_ver_elec
            - *d_a1_safety
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
            - call: "POST /rideshare/missions/${m_id}/lock-manifest"
              payload: {}
              as: MissionOps
            - &d_lic_mission
              call: "POST /rideshare/licenses"
              payload: { subject_type: "MISSION", kind: "LAUNCH_AUTHORIZATION", mission_id: "${m_id}", valid_until: "2026-12-31T00:00:00Z", debris_score: 90, spectrum_score: 80, operator_history_score: 90 }
              as: MissionOps
              captures: { lic_m_id: $.data.id }
            - &d_lic_mission_grant
              call: "POST /rideshare/licenses/${lic_m_id}/transition"
              payload: { to_state: "GRANTED" }
              as: Regulator
            - &d_slot
              call: "POST /rideshare/range-slots"
              payload: { mission_id: "${m_id}", range_code: "CCAFS", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z" }
              as: RangeOfficer
              captures: { s1: $.data.id }
            - call: "POST /rideshare/range-slots/${s1}/reserve"
              payload: {}
              as: RangeOfficer
            - call: "POST /rideshare/range-slots/${s1}/confirm"
              payload: {}
              as: RangeOfficer
          trigger:
            - call: "POST /rideshare/missions/${m_id}/delay"
              payload: { new_window_open_utc: "2026-11-01T00:00:00Z", new_window_close_utc: "2026-11-10T00:00:00Z", reason_code: "RANGE_CONFLICT" }
              as: MissionOps
              captures: { delay_id: $.data.id }
          assert:
            - "Mission.${m_id}.status == MANIFEST_LOCKED (regressed from RANGE_SCHEDULED)"
            - "Mission.${m_id}.window_open_utc == 2026-11-01T00:00:00Z"
            - "RangeSlot.${s1}.status == RELEASED (read via GET /rideshare/missions/${m_id}/range-slots)"
            - "DelayEvent.${delay_id}.slot_released == true"
            - "DelayEvent.${delay_id}.assignments_removed_count == 0 (contract window 2026-11-30 still covers the new window)"
            - "ManifestAssignment.${a1}.status == INTEGRATED (cascade did not touch it)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: delay_cascade_releases_slot_removes_assignments_flags_contracts
        grounds:
          - calculations.delay_cascade_assessment
          - state_machines.RangeSlot.CONFIRMED_to_RELEASED
          - state_machines.ManifestAssignment.INTEGRATED_to_REMOVED
          - state_machines.LaunchContract.MANIFESTED_to_SIGNED
          - state_machines.Payload.MANIFESTED_to_REGISTERED
        distinguishing_aspect: |
          Cascade triggered by POST /delay, depth >= 3: the window move releases the CONFIRMED
          slot and regresses the mission (hop 2), the impact sweep removes the contract's
          INTEGRATED assignment because contract.window_close 2026-10-31 < new close 2026-11-10
          (hop 3), and each removal reverts the payload to REGISTERED, reverts the contract to
          SIGNED with rebook_eligible=true, and recomputes mission commitment to 0 (hop 4).
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Fully launch-ready mission (assignment INTEGRATED, manifest locked, launch license GRANTED, CCAFS slot [2026-10-10, 2026-10-20] CONFIRMED, mission RANGE_SCHEDULED). Contract window is the tight [2026-10-01, 2026-10-31]."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_a
            - *d_contract_2pl
            - *d_sign_2pl
            - *d_payloads_2pl
            - *d_lic_customer
            - *d_lic_customer_grant
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - *d_a1_ver_mech
            - *d_a1_ver_elec
            - *d_a1_safety
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
            - call: "POST /rideshare/missions/${m_id}/lock-manifest"
              payload: {}
              as: MissionOps
            - *d_lic_mission
            - *d_lic_mission_grant
            - *d_slot
            - call: "POST /rideshare/range-slots/${s1}/reserve"
              payload: {}
              as: RangeOfficer
            - call: "POST /rideshare/range-slots/${s1}/confirm"
              payload: {}
              as: RangeOfficer
          trigger:
            - call: "POST /rideshare/missions/${m_id}/delay"
              payload: { new_window_open_utc: "2026-11-01T00:00:00Z", new_window_close_utc: "2026-11-10T00:00:00Z", reason_code: "VEHICLE_STACKING" }
              as: MissionOps
              captures: { delay_id: $.data.id }
          assert:
            - "DelayEvent.${delay_id}.slot_released == true and assignments_removed_count == 1"
            - "RangeSlot.${s1}.status == RELEASED (hop 2: window move forced the release)"
            - "Mission.${m_id}.status == MANIFEST_LOCKED and committed_mass_kg == 0 and firm_mass_kg == 0 (hop 4 recompute)"
            - "ManifestAssignment.${a1}.status == REMOVED (hop 3: contract window 2026-10-31 < new close 2026-11-10)"
            - "Payload.${pl1}.status == REGISTERED"
            - "LaunchContract.${ct_id}.status == SIGNED and rebook_eligible == true"
            - "LaunchContract.${ct_id}.rebookings_remaining == 1 (untouched; the cascade only flags)"

      - name: license_revoke_cascades_assignment_removal_and_contract_revert
        grounds:
          - state_machines.RegulatoryLicense.GRANTED_to_REVOKED
          - state_machines.ManifestAssignment.PROVISIONAL_to_REMOVED
          - calculations.manifest_commitment
        distinguishing_aspect: |
          Cascade triggered by a license REVOKE (different trigger than delay), depth >= 2:
          revoking the customer's GRANTED PAYLOAD_OPERATOR license removes that customer's live
          PROVISIONAL assignment on the unlaunched mission (hop 2), which reverts payload to
          REGISTERED, contract to SIGNED, and recomputes mission committed mass to 0 (hop 3).
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Mission MANIFEST_OPEN; contract signed with PL1 100 kg RING_15 SSO; customer PAYLOAD_OPERATOR license GRANTED; A1 = PL1 on DSP-A still PROVISIONAL."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_a
            - *d_contract_2pl
            - *d_sign_2pl
            - *d_payloads_2pl
            - *d_lic_customer
            - *d_lic_customer_grant
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /rideshare/licenses/${lic_c_id}/transition"
              payload: { to_state: "REVOKED" }
              as: Regulator
          assert:
            - "RegulatoryLicense.${lic_c_id}.status == REVOKED"
            - "ManifestAssignment.${a1}.status == REMOVED (cascade hop 2)"
            - "Payload.${pl1}.status == REGISTERED (cascade hop 3)"
            - "LaunchContract.${ct_id}.status == SIGNED (cascade hop 3 bubble-up)"
            - "Mission.${m_id}.committed_mass_kg == 0 and committed_volume_m3 == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: launch_in_wrong_state_with_weather_hold_reports_state_error
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors.ERR_INVALID_STATE
          - errors.ERR_WEATHER_HOLD
        distinguishing_aspect: |
          Pair (state vs business_safety): the launch request violates state (mission is
          MANIFEST_LOCKED, not RANGE_SCHEDULED) AND a WEATHER hold covers the launch instant;
          the priority-7 state check fires first, so 409 ERR_INVALID_STATE wins over the 422
          ERR_WEATHER_HOLD.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Mission with one CONFIRMED assignment, manifest locked (MANIFEST_LOCKED) — no range slot ever confirmed. A WEATHER exclusion window [2026-10-15T00:00:00Z, 2026-10-16T00:00:00Z) covers CCAFS; clock advanced to 2026-10-15T12:00:00Z (inside the hold)."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - *d_mission
            - *d_port_a
            - *d_contract_2pl
            - *d_sign_2pl
            - *d_payloads_2pl
            - *d_lic_customer
            - *d_lic_customer_grant
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - *d_a1_ver_mech
            - *d_a1_ver_elec
            - *d_a1_safety
            - call: "POST /rideshare/assignments/${a1}/confirm"
              payload: {}
              as: MissionOps
            - call: "POST /rideshare/missions/${m_id}/lock-manifest"
              payload: {}
              as: MissionOps
            - call: "POST /rideshare/exclusion-windows"
              payload: { scope_type: "RANGE", scope_value: "CCAFS", kind: "WEATHER", start_utc: "2026-10-15T00:00:00Z", end_utc: "2026-10-16T00:00:00Z" }
              as: RangeOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-15T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /rideshare/missions/${m_id}/launch"
              payload: {}
              as: MissionOps
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "err != ERR_WEATHER_HOLD even though the clock instant is inside the WEATHER window"
            - "Mission.${m_id}.status is still MANIFEST_LOCKED"

      - name: assignment_with_bad_window_and_mass_overflow_reports_window_error
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - errors.ERR_WINDOW_INCOMPATIBLE
          - errors.ERR_MASS_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Pair (business_temporal vs business_fiscal): the create violates the contract-window
          coverage rule (contract close 2026-10-15 < mission close 2026-10-20) AND would overflow
          mission mass capacity (100 + 250 > 300); the priority-9 temporal check fires first, so
          ERR_WINDOW_INCOMPATIBLE wins over ERR_MASS_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Mission (300 kg / 10 m3) with ports DSP-A (max 150) and DSP-C (max 150, RING_24). Contract-1 signed with PL_A 100 kg RING_15, assigned to DSP-A (committed 100 kg). Contract-2 signed with PL_B 250 kg RING_24 but window [2026-10-01, 2026-10-15] that does not cover the mission window."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-X2", target_orbit: "SSO", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z", mass_capacity_kg: 300, volume_capacity_m3: 10.0 }
              as: MissionOps
              captures: { m_id: $.data.id }
            - *d_port_a
            - &d_port_c
              call: "POST /rideshare/missions/${m_id}/dispenser-ports"
              payload: { port_code: "DSP-C", stack_position: 2, max_mass_kg: 150, supported_interface_classes: ["RING_24"] }
              as: MissionOps
              captures: { p_c: $.data.id }
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PL_A", mass_kg: 100, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct1: $.data.id }
            - call: "POST /rideshare/contracts/${ct1}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct1}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl_a: "$.data[0].id" }
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl_a}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-15T00:00:00Z", payloads: [{ payload_name: "PL_B", mass_kg: 250, volume_m3: 2.0, interface_class: "RING_24", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct2: $.data.id }
            - call: "POST /rideshare/contracts/${ct2}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct2}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl_b: "$.data[0].id" }
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v2: $.data.version }
          trigger:
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl_b}", dispenser_port_id: "${p_c}", expected_mission_version: "${m_v2}" }
              as: MissionOps
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and err == ERR_WINDOW_INCOMPATIBLE"
            - "err != ERR_MASS_CAPACITY_EXCEEDED even though 100 + 250 > 300"
            - "GET /rideshare/assignments?mission_id=${m_id} still returns exactly 1 row"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: assignment_at_exact_mass_capacity_allowed_fraction_over_rejected
        grounds:
          - validations[priority=11]
          - calculations.manifest_commitment
          - endpoints.POST_/rideshare/assignments
        distinguishing_aspect: |
          Mass metric boundary on POST /assignments: committed 150 + payload 150 == capacity 300
          is ALLOWED (overflow is strictly-greater), while adding a 0.001 kg payload on top
          (300.001) is rejected with ERR_MASS_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Clock at 2026-09-01. Mission (300 kg / 10 m3) with ports DSP-A (max 150, RING_15+RING_24), DSP-C (max 150, RING_24), DSP-B (max 100, CUBESAT). Contract signed with PL1 150 kg RING_15, PL2 150 kg RING_24, PL3 0.001 kg CUBESAT."
          setup_api_calls:
            - *d_clock
            - *d_customer
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-X3", target_orbit: "SSO", window_open_utc: "2026-10-10T00:00:00Z", window_close_utc: "2026-10-20T00:00:00Z", mass_capacity_kg: 300, volume_capacity_m3: 10.0 }
              as: MissionOps
              captures: { m_id: $.data.id }
            - *d_port_a
            - *d_port_c
            - *d_port_b
            - call: "POST /rideshare/contracts"
              payload: { customer_id: "${c_id}", pricing_mode: "MARGINAL", window_open_utc: "2026-10-01T00:00:00Z", window_close_utc: "2026-10-31T00:00:00Z", payloads: [{ payload_name: "PL1", mass_kg: 150, volume_m3: 2.0, interface_class: "RING_15", required_orbit: "SSO" }, { payload_name: "PL2", mass_kg: 150, volume_m3: 2.0, interface_class: "RING_24", required_orbit: "SSO" }, { payload_name: "PL3", mass_kg: 0.001, volume_m3: 0.001, interface_class: "CUBESAT", required_orbit: "SSO" }] }
              as: ContractManager
              captures: { ct_id: $.data.id }
            - call: "POST /rideshare/contracts/${ct_id}/sign"
              payload: {}
              as: Customer
              as_user_id: "${c_id}"
            - call: "GET /rideshare/contracts/${ct_id}/payloads"
              payload: {}
              as: MissionOps
              captures: { pl1: "$.data[0].id", pl2: "$.data[1].id", pl3: "$.data[2].id" }
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v1: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl1}", dispenser_port_id: "${p_a}", expected_mission_version: "${m_v1}" }
              as: MissionOps
              captures: { a1: $.data.id }
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v2: $.data.version }
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl2}", dispenser_port_id: "${p_c}", expected_mission_version: "${m_v2}" }
              as: MissionOps
              captures: { a2: $.data.id }
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
              captures: { m_v3: $.data.version }
          trigger:
            - call: "POST /rideshare/assignments"
              payload: { mission_id: "${m_id}", payload_id: "${pl3}", dispenser_port_id: "${p_b}", expected_mission_version: "${m_v3}" }
              as: MissionOps
              captures: { err: $.data.error_id }
            - call: "GET /rideshare/missions/${m_id}"
              payload: {}
              as: MissionOps
          assert:
            - "the PL2 assignment at exactly 300 kg total returned 201 (equality is allowed)"
            - "Mission.${m_id}.committed_mass_kg == 300"
            - "the PL3 attempt returns 422 and err == ERR_MASS_CAPACITY_EXCEEDED (300.001 > 300)"
            - "GET /rideshare/assignments?mission_id=${m_id} returns exactly 2 rows"

      - name: launch_at_weather_window_start_blocked_at_window_end_allowed
        grounds:
          - calculations.exclusion_window_checks
          - errors.ERR_WEATHER_HOLD
          - endpoints.POST_/rideshare/missions/{id}/launch
        distinguishing_aspect: |
          Time-instant metric on POST /missions/{id}/launch with half-open WEATHER semantics:
          launch at exactly start_utc (2026-10-15T12:00:00Z) is blocked, and at exactly end_utc
