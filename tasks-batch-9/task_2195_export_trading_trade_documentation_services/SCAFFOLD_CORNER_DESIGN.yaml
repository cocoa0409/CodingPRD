            - "the REJECT submit returns HTTP 200 and GET /letters-of-credit/${lc_id} reports status == \"REJECTED\" with terms_risk_score 60.00"
            - "the second reuse attempt returns HTTP 201 with supersedes_lc_id == ${lc_id}, amendment_round == 0 and status \"RECEIVED\""
            - "GET /letters-of-credit?export_order_id=${order_id} returns total_count == 2 — both rows keep lc_number LC-2026-0020"

