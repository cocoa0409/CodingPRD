# =============================================================================
# Task 0662 — Soft-Wash & Roof/Exterior Cleaning
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe across claim-extraction-guide sections.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_customer_returns_201_with_defaults
        claim_type: Creation
        grounds:
          - entities.Customer
          - endpoints
        distinguishing_aspect: "POST /customers with full_name+email returns 201; status=ACTIVE, outstanding_balance_cents=0, version=1, credit_limit_cents defaults to 0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "New Cust", email: "new@x.com" }
              as: Dispatcher
              captures: { cid: $.data.id, ver: $.data.version }
          assert:
            - "HTTP status == 201"
            - "Customer.${cid}.status == ACTIVE"
            - "Customer.${cid}.outstanding_balance_cents == 0"
            - "Customer.${cid}.credit_limit_cents == 0"
            - "Customer.${cid}.version == 1"

      - name: get_customer_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Customer
          - "errors[ERR_CUSTOMER_NOT_FOUND]"
        distinguishing_aspect: "GET /customers/{id} with a random UUID that was never created returns ERR_CUSTOMER_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /customers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: create_property_missing_required_stories_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Property.fields.stories
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /properties omitting the required `stories` field returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A Customer and Route exist."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "P Owner", email: "pp1@x.com" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "PR Zone" }
              as: Dispatcher
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "No Stories" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: create_lineitem_invalid_enum_surface_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.QuoteLineItem.fields.surface_type
          - "validations[priority=5]"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /quotes/{id}/line-items with surface_type='WALLS' (not in ROOF|SIDING|CONCRETE) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["A DRAFT quote on a 1-story property exists."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Enum Owner", email: "enum@x.com" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "EN Zone" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "1 Enum", stories: 1 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "WALLS", service_type: "HOUSE_WASH", measured_sqft: 100 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: customer_id_system_minted_input_id_ignored
        claim_type: System Fields
        grounds:
          - entities.Customer.fields.id
        distinguishing_aspect: "POST /customers cannot dictate id/created_at/version; server mints id (a bare UUID, no type prefix), created_at ISO8601, version=1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /customers"
              payload: { full_name: "Sys Field", email: "sys@x.com" }
              as: Dispatcher
              captures: { cid: $.data.id, ca: $.data.created_at, ver: $.data.version }
          assert:
            - "Customer.${cid}.id is a server-minted UUID with no prefix"
            - "Customer.${cid}.version == 1 and created_at is ISO8601 UTC"

      - name: quote_line_item_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.QuoteLineItem
        distinguishing_aspect: "QuoteLineItem is common_fields:false — it has no version field and no update/delete endpoint; only created via POST /quotes/{id}/line-items."
        test_recipe:
          setup: ["A DRAFT quote on a 1-story property with one line item."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Imm Owner", email: "imm@x.com" }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "IM Zone" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "2 Imm", stories: 1, siding_sqft: 500 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "SIDING", service_type: "HOUSE_WASH", measured_sqft: 500 }
              as: Dispatcher
              captures: { li_id: $.data.id }
          trigger:
            - call: "GET /quotes/${quote_id}/line-items"
              payload: {}
              as: Dispatcher
              captures: { first_li: '$.data[0].id' }
          assert:
            - "GET /quotes/${quote_id}/line-items returns exactly 1 line item with id ${li_id}"
            - "QuoteLineItem carries no version field (common_fields:false)"

      - name: property_requires_existing_customer_parent
        claim_type: Parent Relationships
        grounds:
          - entities.Property.fields.customer_id
          - "errors[ERR_CUSTOMER_NOT_FOUND]"
        distinguishing_aspect: "POST /properties with a customer_id that does not exist returns ERR_CUSTOMER_NOT_FOUND (404), validated before route_id."
        test_recipe:
          setup: ["A Route exists; no such customer."]
          setup_api_calls:
            - call: "POST /routes"
              payload: { name: "PX Zone" }
              as: Dispatcher
              captures: { route_id: $.data.id }
          trigger:
            - call: "POST /properties"
              payload: { customer_id: "11111111-1111-4111-8111-111111111111", route_id: "${route_id}", address: "Ghost", stories: 1 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and error_id == ERR_CUSTOMER_NOT_FOUND"

      - name: list_customers_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Customer
          - endpoints
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /customers returns an array envelope with total_count and has_more; default limit 10 applied."
        test_recipe:
          setup: ["Two customers created."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "L1", email: "l1@x.com" }
              as: Dispatcher
            - call: "POST /customers"
              payload: { full_name: "L2", email: "l2@x.com" }
              as: Dispatcher
          trigger:
            - call: "GET /customers"
              payload: {}
              as: Dispatcher
          assert:
            - "response_type == array; meta.total_count == 2; has_more == false; limit default 10"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: schedule_visit_from_completed_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Visit.REQUESTED_to_SCHEDULED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "Calling POST /visits/{id}/schedule on a COMPLETED visit (not REQUESTED) returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A COMPLETED one-off visit (full happy path)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: Dispatcher
            - call: "POST /customers"
              payload: { full_name: "C Done", email: "cdone@x.com", credit_limit_cents: 100000000 }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "CD Zone", travel_buffer_minutes: 0 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "CD Tech", ladder_cert_max_stories: 3, insurance_status: "ACTIVE" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /weather-windows"
              payload: { route_id: "${route_id}", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-05-01T23:59:59Z", wind_mph: 5 }
              as: Dispatcher
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "20 Oak", stories: 2, roof_sqft: 2000 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "ROOF", service_type: "ROOF_SOFT_WASH", measured_sqft: 2000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /visits"
              payload: { property_id: "${prop_id}", quote_id: "${quote_id}", scheduled_date: "2026-05-01", duration_minutes: 120 }
              as: Dispatcher
              captures: { visit_id: $.data.id, visit_v: $.data.version }
            - call: "POST /visits/${visit_id}/schedule"
              payload: { expected_visit_version: "${visit_v}" }
              as: Dispatcher
            - call: "POST /crew-assignments"
              payload: { visit_id: "${visit_id}", technician_id: "${tech_id}", window_start_utc: "2026-05-01T14:00:00Z" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /crew-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /visits/${visit_id}/photos"
              payload: { phase: "BEFORE", photo_url: "http://img/b.jpg" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${visit_id}/photos"
              payload: { phase: "AFTER", photo_url: "http://img/a.jpg" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${visit_id}/complete"
              payload: { re_measured_roof_sqft: 2000, re_measured_siding_sqft: 0, re_measured_concrete_sqft: 0 }
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /visits/${visit_id}/schedule"
              payload: { expected_visit_version: "${visit_v}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == ERR_INVALID_STATE"
            - "Visit.${visit_id}.status == COMPLETED (unchanged)"

      - name: cancel_terminal_cancelled_visit_returns_invalid_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Visit
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A CANCELLED visit is terminal; a second POST /visits/{id}/cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A REQUESTED visit that is then cancelled."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "T Owner", email: "tterm@x.com", credit_limit_cents: 100000000 }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "TT Zone" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "21 Oak", stories: 1, siding_sqft: 1000 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "SIDING", service_type: "HOUSE_WASH", measured_sqft: 1000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /visits"
              payload: { property_id: "${prop_id}", quote_id: "${quote_id}", scheduled_date: "2026-05-01", duration_minutes: 120 }
              as: Dispatcher
              captures: { visit_id: $.data.id }
            - call: "POST /visits/${visit_id}/cancel"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /visits/${visit_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == ERR_INVALID_STATE"

      - name: new_visit_initial_state_requested
        claim_type: initial_state
        grounds:
          - state_machines.Visit
          - entities.Visit.fields.status
        distinguishing_aspect: "A freshly created one-off Visit starts in REQUESTED with billing_status UNBILLED and route_id copied from the property."
        test_recipe:
          setup: ["An ACCEPTED quote on a property in a route."]
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Init Owner", email: "init@x.com", credit_limit_cents: 100000000 }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "INI Zone" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "22 Oak", stories: 1, siding_sqft: 800 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "SIDING", service_type: "HOUSE_WASH", measured_sqft: 800 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /visits"
              payload: { property_id: "${prop_id}", quote_id: "${quote_id}", scheduled_date: "2026-05-01", duration_minutes: 120 }
              as: Dispatcher
              captures: { visit_id: $.data.id, vroute: $.data.route_id, bstat: $.data.billing_status }
          assert:
            - "Visit.${visit_id}.status == REQUESTED"
            - "Visit.${visit_id}.billing_status == UNBILLED"
            - "Visit.${visit_id}.route_id == ${route_id}"

      - name: start_visit_without_before_photo_returns_error
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Visit.SCHEDULED_to_IN_PROGRESS
          - "errors[ERR_BEFORE_PHOTO_MISSING]"
        distinguishing_aspect: "POST /visits/{id}/start on a SCHEDULED visit with a CONFIRMED crew but no BEFORE PhotoSet returns ERR_BEFORE_PHOTO_MISSING (409)."
        test_recipe:
          setup: ["SCHEDULED visit with a CONFIRMED crew assignment; no photos uploaded."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: Dispatcher
            - call: "POST /customers"
              payload: { full_name: "NoPhoto Owner", email: "nop@x.com", credit_limit_cents: 100000000 }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "NP Zone", travel_buffer_minutes: 0 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "NP Tech", ladder_cert_max_stories: 3, insurance_status: "ACTIVE" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /weather-windows"
              payload: { route_id: "${route_id}", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-05-01T23:59:59Z", wind_mph: 5 }
              as: Dispatcher
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "23 Oak", stories: 2, roof_sqft: 2000 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "ROOF", service_type: "ROOF_SOFT_WASH", measured_sqft: 2000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /visits"
              payload: { property_id: "${prop_id}", quote_id: "${quote_id}", scheduled_date: "2026-05-01", duration_minutes: 120 }
              as: Dispatcher
              captures: { visit_id: $.data.id, visit_v: $.data.version }
            - call: "POST /visits/${visit_id}/schedule"
              payload: { expected_visit_version: "${visit_v}" }
              as: Dispatcher
            - call: "POST /crew-assignments"
              payload: { visit_id: "${visit_id}", technician_id: "${tech_id}", window_start_utc: "2026-05-01T14:00:00Z" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /crew-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == ERR_BEFORE_PHOTO_MISSING"

      - name: complete_visit_without_after_photo_returns_error
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Visit.IN_PROGRESS_to_COMPLETED
          - "errors[ERR_AFTER_PHOTO_MISSING]"
        distinguishing_aspect: "POST /visits/{id}/complete on an IN_PROGRESS visit with only a BEFORE photo returns ERR_AFTER_PHOTO_MISSING (409)."
        test_recipe:
          setup: ["IN_PROGRESS visit (started with a BEFORE photo) but no AFTER photo."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-15T00:00:00Z" }
              as: Dispatcher
            - call: "POST /customers"
              payload: { full_name: "NoAfter Owner", email: "noa@x.com", credit_limit_cents: 100000000 }
              as: Dispatcher
              captures: { cust_id: $.data.id }
            - call: "POST /routes"
              payload: { name: "NA Zone", travel_buffer_minutes: 0 }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "NA Tech", ladder_cert_max_stories: 3, insurance_status: "ACTIVE" }
              as: Dispatcher
              captures: { tech_id: $.data.id }
            - call: "POST /weather-windows"
              payload: { route_id: "${route_id}", window_start_utc: "2026-05-01T00:00:00Z", window_end_utc: "2026-05-01T23:59:59Z", wind_mph: 5 }
              as: Dispatcher
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", route_id: "${route_id}", address: "24 Oak", stories: 2, roof_sqft: 2000 }
              as: Dispatcher
              captures: { prop_id: $.data.id, prop_v: $.data.version }
            - call: "POST /quotes"
              payload: { property_id: "${prop_id}", expected_property_version: "${prop_v}" }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /quotes/${quote_id}/line-items"
              payload: { surface_type: "ROOF", service_type: "ROOF_SOFT_WASH", measured_sqft: 2000 }
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /quotes/${quote_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /visits"
              payload: { property_id: "${prop_id}", quote_id: "${quote_id}", scheduled_date: "2026-05-01", duration_minutes: 120 }
              as: Dispatcher
              captures: { visit_id: $.data.id, visit_v: $.data.version }
            - call: "POST /visits/${visit_id}/schedule"
              payload: { expected_visit_version: "${visit_v}" }
              as: Dispatcher
            - call: "POST /crew-assignments"
              payload: { visit_id: "${visit_id}", technician_id: "${tech_id}", window_start_utc: "2026-05-01T14:00:00Z" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /crew-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /visits/${visit_id}/photos"
              payload: { phase: "BEFORE", photo_url: "http://img/b.jpg" }
              as: FieldTech
              as_user_id: "${tech_id}"
            - call: "POST /visits/${visit_id}/start"
              payload: {}
              as: FieldTech
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /visits/${visit_id}/complete"
              payload: { re_measured_roof_sqft: 2000, re_measured_siding_sqft: 0, re_measured_concrete_sqft: 0 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and error_id == ERR_AFTER_PHOTO_MISSING"

      - name: start_visit_without_confirmed_crew_returns_error
        claim_type: precondition_enforcement
        grounds:
