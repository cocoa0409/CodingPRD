  # =========================================================================
  # Cross-Cutting Complexity Layers (optimistic concurrency)
  # =========================================================================
  - section: cross_cutting
    instances:
      - name: copy_issue_stale_event_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[copy-issue-stale-event]
          - errors[ERR_STALE_EVENT_VERSION]
        distinguishing_aspect: "After issuing copy1 (which bumps VitalEvent.version), issuing copy2 with the pre-issue expected_vital_event_version is stale -> ERR_STALE_EVENT_VERSION (412)."
        test_recipe:
          setup:
            - "A REGISTERED BIRTH event in CTY-57 with two ID_VERIFIED SELF STANDARD copy_count=1 requests c1,c2; clock recent."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "H57", facility_type: "HOSPITAL", jurisdiction_code: "CTY-57", npi: "NPI-057" }
              as: StateRegistrar
              captures: { fac: "$.data.id" }
            - call: "POST /vital-events"
              payload: { event_type: "BIRTH", event_date: "2026-02-25T00:00:00Z", subject_last_name: "St", subject_first_name: "Al", sex: "MALE", jurisdiction_code: "CTY-57", facility_id: "${fac}", place_of_event: "H57" }
              as: FacilityFiler
              as_user_id: "${fac}"
              captures: { ev: "$.data.id" }
            - call: "POST /vital-events/${ev}/file"
              payload: {}
              as: FacilityFiler
              as_user_id: "${fac}"
            - call: "POST /vital-events/${ev}/register"
              payload: {}
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Al St", requester_relationship: "SELF", id_document_type: "STATE_ID", copy_count: 1 }
              as: Applicant
              captures: { c1: "$.data.id" }
            - call: "POST /certified-copy-requests/${c1}/verify-id"
              payload: {}
              as: StateRegistrar
            - call: "POST /certified-copy-requests"
              payload: { vital_event_id: "${ev}", requester_name: "Al St", requester_relationship: "SELF", id_document_type: "STATE_ID", copy_count: 1 }
              as: Applicant
              captures: { c2: "$.data.id" }
            - call: "POST /certified-copy-requests/${c2}/verify-id"
              payload: {}
              as: StateRegistrar
            - call: "GET /vital-events/${ev}"
              payload: {}
              as: StateRegistrar
              captures: { ev_v0: "$.data.version" }
            - call: "POST /certified-copy-requests/${c1}/issue"
              payload: { expected_vital_event_version: "${ev_v0}" }
