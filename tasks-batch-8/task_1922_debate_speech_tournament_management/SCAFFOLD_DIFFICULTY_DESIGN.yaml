            - { call: "POST /rounds/${r1}/generate-pairings", payload: { expected_round_version: "${r1_v}" }, as: TabStaff }
            - { call: "GET /pairings?round_id=${r1}", as: TabStaff, captures: { p1: "$.data[0].id" } }
            - { call: "POST /pairings/${p1}/assign-room", payload: { room_id: "${rm1}" }, as: TabStaff }
            - { call: "GET /judges/${j_e1}", as: TabStaff }
          trigger:
            - { call: "POST /pairings/${p1}/assign-judge", payload: { judge_id: "${j_e1}" }, as: TabStaff }
            - { call: "GET /judges/${j_e1}", as: TabStaff }
            - { call: "GET /pairings/${p1}", as: TabStaff }
            - { call: "POST /pairings/${p1}/unassign-judge", as: TabStaff }
            - { call: "GET /judges/${j_e1}", as: TabStaff }
            - { call: "GET /pairings?judge_id=${j_e1}", as: TabStaff }
            - { call: "GET /pairings/${p1}", as: TabStaff }
          assert:
            - "before assign: Judge.${j_e1}.assigned_round_count == 0"
            - "after assign: assigned_round_count == 1 and Pairing.${p1}.status == STAFFED"
            - "after compensating unassign: assigned_round_count == 0 exactly (bookings conserved) and Pairing.${p1} reverted to PENDING_STAFFING with judge_id == null"
            - "GET /pairings?judge_id=${j_e1} returns total_count == 0"
