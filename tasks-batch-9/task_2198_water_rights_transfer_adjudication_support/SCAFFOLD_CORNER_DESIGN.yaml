          reachable by filtering GET /lease-assignments on each of its three
          independent parents (water_bank_account_id, water_right_id,
          point_of_diversion_id), and each filter returns exactly that row.
        test_recipe:
          setup:
            - "CERTIFIED right for claimant A with bank_enrolled true (certified_hcu_af 195.00) and one AUTHORIZED POD."
            - "Bank account funded with a 90.00 AF deposit; one RESERVED lease of 20.00 AF over 2026-04-01..2026-07-01."
