              as: SalesRep
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /api/service-tickets"
              payload: { order_id: "${order_id}", issue_description: "door hinge misaligned" }
              as: SalesRep
              captures: { err: $.data.error_id }
