errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing or malformed X-User-Role / X-User-ID headers.
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted for this endpoint per §1.5 roles.
- id: ERR_NOT_FOUND
  http: 404
  condition: Path id or body-supplied FK does not resolve to an existing row.
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field, enum violation, or numeric range violation (e.g. reserve_margin_pct outside (0,1), credit_score
    outside [0,1000]).
- id: ERR_INVALID_STATE
  http: 409
  condition: Requested transition does not exist from the resource's current state (e.g. clearing a DRAFT run, withdrawing
    a SEALED offer, verifying a SUBMITTED report).
- id: ERR_STALE_VERSION
  http: 412
  condition: 'OCC mismatch: expected_commitment_version or expected_auction_run_version does not equal the parent''s current
    version.'
- id: ERR_OWNERSHIP_VIOLATION
  http: 403
  condition: Acting ResourceOwner does not own the resource/offer/commitment being mutated.
- id: ERR_OWNER_SUSPENDED
  http: 422
  condition: SUSPENDED owner attempted to submit an offer, replacement, or measurement report.
- id: ERR_EVENT_OVERLAP
  http: 409
  condition: EmergencyEvent PAI overlaps an existing non-terminal event's half-open interval in the same delivery year.
- id: ERR_MEASUREMENT_WINDOW_OVERLAP
  http: 409
  condition: A VERIFIED MeasurementReport for the same resource already covers an overlapping half-open window.
- id: ERR_INVALID_TIME_RANGE
  http: 422
  condition: End <= start, or event window outside the delivery year's planning period.
- id: ERR_FORECAST_SHARES_INVALID
  http: 422
  condition: zonal_peak_shares missing a top-level zone or fractions do not sum to exactly 1.000 after 3-decimal rounding.
- id: ERR_OFFER_EXCEEDS_UCAP
  http: 422
  condition: offer_mw exceeds the resource's accredited UCAP minus MW already offered into the same run.
- id: ERR_REPLACEMENT_NOT_DELIVERABLE
  http: 422
  condition: Replacement resource lacks accredited headroom, is the same resource, or is not in a deliverable zone relative
    to the commitment.
- id: ERR_MITIGATION_PENDING
  http: 409
  condition: Clear attempted while a MitigationReview for the run's offers is still PENDING.
- id: ERR_ACCREDITATION_CONFLICT
  http: 409
  condition: An EFFECTIVE accreditation already exists for (resource_id, delivery_year_id).
- id: ERR_REPLACEMENT_EXCEEDS_COMMITMENT
  http: 422
  condition: replacement_mw <= 0 or greater than the commitment's current committed_mw.
- id: ERR_DEFAULT_THRESHOLD_NOT_MET
  http: 422
  condition: Commitment default attempted without cumulative_performance_score < 0.40 and >= 2 FINALIZED assessments.
- id: ERR_MEASUREMENT_NOT_APPLICABLE
  http: 422
  condition: MeasurementReport submitted for a GEN resource.
roles:
- name: MarketAdmin
  description: 'Grid/market operator staff: delivery-year setup, forecasts, zones, accreditation review, auction run lifecycle,
    mitigation review, emergency events, assessments, M&V review, commitment default, owner suspension, replacement review,
    clock.'
  identity: opaque
  exclusive_operations:
  - POST /capacity-market/delivery-years
  - POST /capacity-market/delivery-years/{id}/lock-forecast
  - POST /capacity-market/delivery-years/{id}/zones
  - POST /capacity-market/delivery-years/{id}/forecasts
  - POST /capacity-market/owners
  - POST /capacity-market/owners/{id}/suspend
  - POST /capacity-market/accreditations/{id}/approve
  - POST /capacity-market/accreditations/{id}/reject
  - POST /capacity-market/auction-runs
  - POST /capacity-market/auction-runs/{id}/open
  - POST /capacity-market/auction-runs/{id}/seal
  - POST /capacity-market/auction-runs/{id}/clear
  - POST /capacity-market/mitigation-reviews/{id}/resolve
  - POST /capacity-market/commitments/{id}/default
  - POST /capacity-market/replacement-transactions/{id}/approve
  - POST /capacity-market/replacement-transactions/{id}/reject
  - POST /capacity-market/emergency-events
  - POST /capacity-market/emergency-events/{id}/begin-assessment
  - POST /capacity-market/assessments/{id}/record-actual
  - POST /capacity-market/emergency-events/{id}/finalize-assessments
  - POST /capacity-market/measurement-reports/{id}/start-review
  - POST /capacity-market/measurement-reports/{id}/verify
  - POST /capacity-market/measurement-reports/{id}/reject
  - POST /capacity-market/_clock/set_current_utc
  shared_operations:
  - All GET endpoints
- name: ResourceOwner
  description: 'Market participant (capacity resource owner): registers and retires own resources, submits accreditations,
    offers, replacements, withdrawals, and measurement reports for owned resources.'
  identity: entity_backed:ResourceOwnerEntity
  exclusive_operations:
  - POST /capacity-market/resources
  - POST /capacity-market/resources/{id}/retire
  - POST /capacity-market/accreditations
  - POST /capacity-market/offers
  - POST /capacity-market/offers/{id}/withdraw
  - POST /capacity-market/replacement-transactions
  - POST /capacity-market/measurement-reports
  shared_operations:
  - All GET endpoints
- name: SettlementOps
  description: 'Settlement operator: settles and closes delivery years; reads all resources; reviews mitigation and settlement
    ledgers.'
  identity: opaque
  exclusive_operations:
  - POST /capacity-market/delivery-years/{id}/settle
  - POST /capacity-market/delivery-years/{id}/close
  shared_operations:
  - All GET endpoints
