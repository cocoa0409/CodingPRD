          assert:
            - "captured ${err} == ERR_INVALID_REQUEST"

      - name: auto_hos_violation_created_on_illegal_driving
        claim_type: side_effect_execution
        grounds: ["endpoints[POST /drivers/{id}/duty-events]", "calculations.driver_safety_score", "entities.SafetyEvent.fields.source"]
        distinguishing_aspect: "Auto-cascade: a DRIVING event inserted with drive_11h exhausted is RECORDED and auto-creates SafetyEvent(HOS_VIOLATION, severity 5, AUTO_HOS), dropping safety_score 100 -> 95."
        test_recipe:
          setup: ["clock 06:00; driver; DRIVING 06:00; clock 17:00; OFF_DUTY 17:00 (660 min driven); clock 17:30"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-R3", full_name: "R Three", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /drivers/${drv}/duty-events", payload: { event_type: "DRIVING", occurred_at: "2026-08-01T06:00:00Z" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T17:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers/${drv}/duty-events", payload: { event_type: "OFF_DUTY", occurred_at: "2026-08-01T17:00:00Z" }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T17:30:00Z" }, as: FleetAdmin }
          trigger:
            - { call: "POST /drivers/${drv}/duty-events", payload: { event_type: "DRIVING", occurred_at: "2026-08-01T17:30:00Z" }, as: Driver, as_user_id: "${drv}", captures: { ev: $.data.id } }
            - { call: "GET /drivers/${drv}/safety-events", payload: {}, as: SafetyOfficer, captures: { k0: "$.data[0].kind", s0: "$.data[0].source" } }
            - { call: "GET /drivers/${drv}", payload: {}, as: SafetyOfficer, captures: { score: $.data.safety_score } }
          assert:
            - "event recorded: ${ev} present (201 — violations are logged, not rejected)"
            - "auto violation: ${k0} == HOS_VIOLATION, ${s0} == AUTO_HOS (severity_points 5)"
            - "score recomputed: ${score} == 95 (100 - 5*1.0)"

      - name: accessorial_action_state_errors
        claim_type: violation_to_error
        grounds: ["errors[ERR_ACCESSORIAL_NOT_APPROVABLE]", "errors[ERR_ACCESSORIAL_NOT_DISPUTABLE]", "errors[ERR_ACCESSORIAL_NOT_REJECTABLE]", "state_machines.AccessorialCharge"]
        distinguishing_aspect: "Each adjudication action enforces its own from-state: approve/dispute/reject on a PENDING charge yield the three distinct 409 codes."
        test_recipe:
          setup: ["load with LUMPER 3013 in PENDING"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
