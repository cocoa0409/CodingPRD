# Task 2864 - Hotel Group Sales & Room Block Management
# Section 1.9 corner-case design index: breadth walk of the claim-extraction guide.
scaffold_corner_design:
- section: entities
  instances:
  - name: account_creation_returns_declared_defaults_and_version_one
    claim_type: creation
    grounds:
    - entities.GroupAccount
    - endpoints["POST /group-sales/accounts"]
    - entities.GroupAccount.fields.credit_hold
    - entities.GroupAccount.fields.rebooking_incentive_pct
    distinguishing_aspect: |
      POST with only the three required fields must return 201 with every declared field present and each documented default materialised: credit_hold false, repeat_group_count 0, lifetime_actualized_room_nights 0, last_completed_departure_date null, rebooking_incentive_pct 0.01 (the lowest account_rebooking_tier band) and version 1. An implementation that omits the computed fields until the first contract completes, or that starts version at 0, fails here.
    test_recipe:
      setup:
      - clock set to 2026-08-01T00:00:00Z; empty database
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      trigger:
      - call: POST /group-sales/accounts
        payload: {name: Northwind Manufacturing, market_segment: CORPORATE, billing_contact_email: ap@northwind.example}
        as: SalesManager
        as_user_id: sm-001
        captures: {acct_id: $.data.id, hold: $.data.credit_hold, tier: $.data.rebooking_incentive_pct,
          repeats: $.data.repeat_group_count, lifetime: $.data.lifetime_actualized_room_nights, ver: $.data.version}
      assert:
      - HTTP 201
      - hold == false
      - tier == 0.01
      - repeats == 0
      - lifetime == 0
      - last_completed_departure_date == null
      - ver == 1
      - name == "Northwind Manufacturing" and market_segment == CORPORATE and billing_contact_email ==
        "ap@northwind.example"
  - name: account_get_returns_the_stored_row_unchanged
    claim_type: retrieval
    grounds:
    - entities.GroupAccount
    - endpoints["GET /group-sales/accounts/{id}"]
    distinguishing_aspect: |
      GET must return the same field values the create response reported, including the computed tier, and must not advance version — a read that recomputes and rewrites the row would bump version to 2.
    test_recipe:
      setup:
      - one CORPORATE GroupAccount created at clock 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      - call: POST /group-sales/accounts
        payload: {name: Northwind Manufacturing, market_segment: CORPORATE, billing_contact_email: ap@northwind.example}
        as: SalesManager
        as_user_id: sm-001
        captures: {acct_id: $.data.id}
      trigger:
      - call: GET /group-sales/accounts/${acct_id}
        payload: {}
        as: RevenueManager
        as_user_id: rm-001
        captures: {got_name: $.data.name, got_seg: $.data.market_segment, got_tier: $.data.rebooking_incentive_pct,
          got_ver: $.data.version}
      assert:
      - HTTP 200
      - got_name == "Northwind Manufacturing"
      - got_seg == CORPORATE
      - got_tier == 0.01
      - got_ver == 1 (a GET must not mutate the row)
  - name: inventory_day_list_paginates_with_total_count_and_has_more
    claim_type: listing
    grounds:
    - endpoints["GET /group-sales/inventory-days"]
    - response_envelope.pagination_fields
    - response_envelope.pagination_defaults
    distinguishing_aspect: |
      Three InventoryDay rows exist; limit 2 must return exactly 2 rows with total_count 3 and has_more true, and offset 2 must return the last row with has_more false. total_count must count the whole filtered set, not the page.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; InventoryDay rows for 2026-11-09, 2026-11-10 and 2026-11-11
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-09', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-10', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-11', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      trigger:
      - call: GET /group-sales/inventory-days
        payload: {limit: 2, offset: 0}
        as: RevenueManager
        as_user_id: rm-001
        captures: {first_date: '$.data[0].stay_date', second_date: '$.data[1].stay_date'}
      - call: GET /group-sales/inventory-days
        payload: {limit: 2, offset: 2}
        as: RevenueManager
        as_user_id: rm-001
        captures: {third_date: '$.data[0].stay_date'}
      assert:
      - the first response has response_type "array", total_count == 3, has_more == true, limit == 2,
        offset == 0 and exactly 2 rows
      - first_date == "2026-11-09" and second_date == "2026-11-10" (ordered by stay_date ascending)
      - the second response has total_count == 3, has_more == false, offset == 2 and exactly 1 row
      - third_date == "2026-11-11"
  - name: unknown_path_ids_return_the_entity_specific_not_found_error
    claim_type: not_found
    grounds:
    - validations[priority=4]
    - errors[ERR_ACCOUNT_NOT_FOUND]
    - errors[ERR_LEAD_NOT_FOUND]
    - errors[ERR_PACKAGE_NOT_FOUND]
    - errors[ERR_ANALYSIS_NOT_FOUND]
    - errors[ERR_QUOTE_NOT_FOUND]
    - errors[ERR_CONTRACT_NOT_FOUND]
    - errors[ERR_BLOCK_NOT_FOUND]
    - errors[ERR_RESERVATION_NOT_FOUND]
    - errors[ERR_CHARGE_NOT_FOUND]
    - errors[ERR_RECONCILIATION_NOT_FOUND]
    - errors[ERR_HOLD_NOT_FOUND]
    distinguishing_aspect: |
      Every one of the eleven entity families must answer an unresolvable {id} with its own 404 error_id rather than a generic ERR_NOT_FOUND or a 500. The database is empty, so no row can accidentally match; a shared error id for all families fails the assert list.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; empty database — none of the ids below exist
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      trigger:
      - call: GET /group-sales/accounts/00000000-0000-4000-8000-000000000001
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_account: $.data.error_id}
      - call: GET /group-sales/leads/00000000-0000-4000-8000-000000000002
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_lead: $.data.error_id}
      - call: GET /group-sales/concession-packages/00000000-0000-4000-8000-000000000003
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_pkg: $.data.error_id}
      - call: GET /group-sales/displacement-analyses/00000000-0000-4000-8000-000000000004
        payload: {}
        as: RevenueManager
        as_user_id: rm-001
        captures: {e_analysis: $.data.error_id}
      - call: GET /group-sales/rate-quotes/00000000-0000-4000-8000-000000000005
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_quote: $.data.error_id}
      - call: GET /group-sales/contracts/00000000-0000-4000-8000-000000000006
        payload: {}
        as: ContractAdmin
        as_user_id: ca-001
        captures: {e_contract: $.data.error_id}
      - call: GET /group-sales/room-blocks/00000000-0000-4000-8000-000000000007
        payload: {}
        as: ReservationsAgent
        as_user_id: ra-001
        captures: {e_block: $.data.error_id}
      - call: GET /group-sales/reservations/00000000-0000-4000-8000-000000000008
        payload: {}
        as: ReservationsAgent
        as_user_id: ra-001
        captures: {e_reservation: $.data.error_id}
      - call: GET /group-sales/ancillary-charges/00000000-0000-4000-8000-000000000009
        payload: {}
        as: AccountingClerk
        as_user_id: ac-001
        captures: {e_charge: $.data.error_id}
      - call: GET /group-sales/reconciliations/00000000-0000-4000-8000-000000000010
        payload: {}
        as: AccountingClerk
        as_user_id: ac-001
        captures: {e_recon: $.data.error_id}
      - call: GET /group-sales/function-space-holds/00000000-0000-4000-8000-000000000011
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_hold: $.data.error_id}
      assert:
      - every call returns HTTP 404 with response_type "error"
      - e_account == ERR_ACCOUNT_NOT_FOUND
      - e_lead == ERR_LEAD_NOT_FOUND
      - e_pkg == ERR_PACKAGE_NOT_FOUND
      - e_analysis == ERR_ANALYSIS_NOT_FOUND
      - e_quote == ERR_QUOTE_NOT_FOUND
      - e_contract == ERR_CONTRACT_NOT_FOUND
      - e_block == ERR_BLOCK_NOT_FOUND
      - e_reservation == ERR_RESERVATION_NOT_FOUND
      - e_charge == ERR_CHARGE_NOT_FOUND
      - e_recon == ERR_RECONCILIATION_NOT_FOUND
      - e_hold == ERR_HOLD_NOT_FOUND
  - name: body_foreign_keys_that_do_not_resolve_are_rejected_as_not_found
    claim_type: parent_relationships
    grounds:
    - validations[priority=6]
    - entities.Lead.fields.account_id
    - entities.Reservation.fields.block_id
    - entities.AncillaryCharge.fields.contract_id
    - entities.RateQuote.fields.lead_id
    - entities.RateQuote.fields.concession_package_id
    distinguishing_aspect: |
      The scaffold's topology is flat, so referential integrity lives entirely in priority 6: an unresolvable FK in the request BODY must produce the same entity-specific 404 as an unresolvable path id, and must do so before any state or business rule is evaluated. The rate-quote leg carries a well-formed expected_lead_version, so a 412 instead of ERR_LEAD_NOT_FOUND would prove the ladder is mis-ordered.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; one CORPORATE account, three InventoryDay rows, one package and one
        qualified lead exist so that only the FK under test is unresolvable
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      - call: POST /group-sales/accounts
        payload: {name: Northwind Manufacturing, market_segment: CORPORATE, billing_contact_email: ap@northwind.example}
        as: SalesManager
        as_user_id: sm-001
        captures: {acct_id: $.data.id}
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-09', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-10', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-11', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/concession-packages
        payload: {name: Corporate Standard, room_rate_discount_pct: 0.0725, comp_room_ratio: 40, rebate_per_room_night_cents: 750,
          banquet_discount_pct: 0.1, av_discount_pct: 0.15, parking_discount_pct: 0.05, min_peak_rooms: 4,
          min_total_room_nights: 12, max_discount_stack_pct: 0.45}
        as: RevenueManager
        as_user_id: rm-001
        captures: {pkg_id: $.data.id}
      - call: POST /group-sales/leads
        payload: {account_id: '${acct_id}', program_name: Northwind Sales Kickoff, arrival_date: '2026-11-09',
          departure_date: '2026-11-12', peak_rooms: 4, total_requested_room_nights: 12, meeting_space_sqft_needed: 100,
          decision_deadline_at: '2026-09-15T00:00:00Z'}
        as: SalesManager
        as_user_id: sm-001
        captures: {lead_id: $.data.id}
      - call: POST /group-sales/leads/${lead_id}/qualify
        payload: {}
        as: SalesManager
        as_user_id: sm-001
      - call: GET /group-sales/leads/${lead_id}
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {lead_v1: $.data.version}
      trigger:
      - call: POST /group-sales/leads
        payload: {account_id: 00000000-0000-4000-8000-000000000021, program_name: Ghost Account Program,
          arrival_date: '2026-11-09', departure_date: '2026-11-12', peak_rooms: 4, total_requested_room_nights: 12,
          meeting_space_sqft_needed: 100, decision_deadline_at: '2026-09-15T00:00:00Z'}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_account: $.data.error_id}
      - call: POST /group-sales/rate-quotes
        payload: {lead_id: 00000000-0000-4000-8000-000000000022, concession_package_id: '${pkg_id}', base_rate_cents: 23950,
          quoted_peak_rooms: 4, quoted_room_nights: 12, expires_at: '2026-10-01T00:00:00Z', expected_lead_version: '${lead_v1}'}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_lead: $.data.error_id}
      - call: POST /group-sales/rate-quotes
        payload: {lead_id: '${lead_id}', concession_package_id: 00000000-0000-4000-8000-000000000023,
          base_rate_cents: 23950, quoted_peak_rooms: 4, quoted_room_nights: 12, expires_at: '2026-10-01T00:00:00Z',
          expected_lead_version: '${lead_v1}'}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_pkg: $.data.error_id}
      - call: POST /group-sales/reservations
        payload: {block_id: 00000000-0000-4000-8000-000000000024, guest_name: Delegate One, arrival_date: '2026-11-09',
          departure_date: '2026-11-10', source: ROOMING_LIST}
        as: ReservationsAgent
        as_user_id: ra-001
        captures: {e_block: $.data.error_id}
      - call: POST /group-sales/ancillary-charges
        payload: {contract_id: 00000000-0000-4000-8000-000000000025, category: BANQUET, gross_amount_cents: 500000}
        as: AccountingClerk
        as_user_id: ac-001
        captures: {e_contract: $.data.error_id}
      assert:
      - every call returns HTTP 404
      - e_account == ERR_ACCOUNT_NOT_FOUND
      - e_lead == ERR_LEAD_NOT_FOUND (not ERR_STALE_LEAD_VERSION — priority 6 runs before priority 8)
      - e_pkg == ERR_PACKAGE_NOT_FOUND
      - e_block == ERR_BLOCK_NOT_FOUND
      - e_contract == ERR_CONTRACT_NOT_FOUND
      - no Lead, RateQuote, Reservation or AncillaryCharge row was created by any of the five calls
  - name: lead_create_with_missing_required_peak_rooms_is_rejected
    claim_type: required_fields
    grounds:
    - validations[priority=3]
    - errors[ERR_INVALID_REQUEST]
    - entities.Lead.fields.peak_rooms
    - endpoints["POST /group-sales/leads"]
    distinguishing_aspect: |
      peak_rooms is source: input with no default, so omitting it is ERR_INVALID_REQUEST (400) — not a silent 0 that would make the qualification score computable. The second leg sends the room count as a JSON string, which priority 3 also rejects; an implementation that coerces "4" to 4 passes the first leg but fails the second.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; one CORPORATE account exists
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      - call: POST /group-sales/accounts
        payload: {name: Northwind Manufacturing, market_segment: CORPORATE, billing_contact_email: ap@northwind.example}
        as: SalesManager
        as_user_id: sm-001
        captures: {acct_id: $.data.id}
      trigger:
      - call: POST /group-sales/leads
        payload: {account_id: '${acct_id}', program_name: Missing Peak, arrival_date: '2026-11-09', departure_date: '2026-11-12',
          total_requested_room_nights: 12, meeting_space_sqft_needed: 100, decision_deadline_at: '2026-09-15T00:00:00Z'}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_missing: $.data.error_id}
      - call: POST /group-sales/leads
        payload: {account_id: '${acct_id}', program_name: Stringly Typed, arrival_date: '2026-11-09',
          departure_date: '2026-11-12', peak_rooms: '4', total_requested_room_nights: 12, meeting_space_sqft_needed: 100,
          decision_deadline_at: '2026-09-15T00:00:00Z'}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_typed: $.data.error_id}
      - call: GET /group-sales/accounts/${acct_id}/leads
        payload: {}
        as: SalesManager
        as_user_id: sm-001
        captures: {lead_count: $.data}
      assert:
      - both POSTs return HTTP 400 with response_type "error"
      - e_missing == ERR_INVALID_REQUEST
      - e_typed == ERR_INVALID_REQUEST ("4" as a JSON string is not an integer room count)
      - the reverse lookup reports total_count == 0 — neither rejected request persisted a Lead
  - name: account_create_with_invalid_enum_market_segment_is_rejected
    claim_type: type_constraints
    grounds:
    - validations[priority=3]
    - entities.GroupAccount.fields.market_segment
    - entities.ConcessionPackage.fields.max_discount_stack_pct
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: |
      market_segment is closed over {CORPORATE, ASSOCIATION, GOVERNMENT, SMERF} because lead_qualification_score keys SEGMENT_MULTIPLIER on it; an unknown member such as LEISURE has no multiplier and must be rejected at priority 3 rather than defaulted to 1.0. The second leg pushes a numeric range constraint (max_discount_stack_pct must satisfy 0 < x <= 1) to show range checks are also priority 3, not business-fiscal.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; empty database
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      trigger:
      - call: POST /group-sales/accounts
        payload: {name: Sunseeker Tours, market_segment: LEISURE, billing_contact_email: ap@sunseeker.example}
        as: SalesManager
        as_user_id: sm-001
        captures: {e_enum: $.data.error_id}
      - call: POST /group-sales/concession-packages
        payload: {name: Impossible Cap, room_rate_discount_pct: 0.0725, comp_room_ratio: 40, rebate_per_room_night_cents: 750,
          banquet_discount_pct: 0.1, av_discount_pct: 0.15, parking_discount_pct: 0.05, min_peak_rooms: 4,
          min_total_room_nights: 12, max_discount_stack_pct: 1.5}
        as: RevenueManager
        as_user_id: rm-001
        captures: {e_range: $.data.error_id}
      assert:
      - both calls return HTTP 400
      - e_enum == ERR_INVALID_REQUEST
      - e_range == ERR_INVALID_REQUEST
      - no GroupAccount and no ConcessionPackage row was created
  - name: lead_qualify_writes_both_computed_fields_and_leaves_inputs_alone
    claim_type: computed_fields
    grounds:
    - calculations.lead_qualification_score
    - calculations.lead_room_night_value
    - entities.Lead.fields.qualification_score
    - entities.Lead.fields.estimated_room_night_value_cents
    - entities.Lead.fields.nights_count
    - state_machines.Lead.NEW_to_QUALIFIED
    distinguishing_aspect: |
      qualification_score and estimated_room_night_value_cents are source: computed and must be null immediately after create, then materialise on qualify: raw = 1 + 1 + 15 + 12 = 29 scaled by the CORPORATE multiplier 1.2 to 34.8 which round_half_up to 35, and the two-stage ADR rounding gives round_half_up(21000 * 0.82) = 17220 per room night for 12 room nights = 206640. nights_count is derived from the half-open stay range and must be 3, not 4.
    test_recipe:
      setup:
      - clock 2026-08-01T00:00:00Z; CORPORATE account; InventoryDay rows for 2026-11-09..11 with transient_adr_cents
        21000; lead 2026-11-09 -> 2026-11-12, peak 4, 12 room nights, 100 sqft
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: {to_iso8601: '2026-08-01T00:00:00Z'}
        as: SystemOperator
        as_user_id: op-001
      - call: POST /group-sales/accounts
        payload: {name: Northwind Manufacturing, market_segment: CORPORATE, billing_contact_email: ap@northwind.example}
        as: SalesManager
        as_user_id: sm-001
        captures: {acct_id: $.data.id}
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-09', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-10', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/inventory-days
        payload: {stay_date: '2026-11-11', total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398,
          transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500}
        as: RevenueManager
        as_user_id: rm-001
      - call: POST /group-sales/concession-packages
        payload: {name: Corporate Standard, room_rate_discount_pct: 0.0725, comp_room_ratio: 40, rebate_per_room_night_cents: 750,
          banquet_discount_pct: 0.1, av_discount_pct: 0.15, parking_discount_pct: 0.05, min_peak_rooms: 4,
          min_total_room_nights: 12, max_discount_stack_pct: 0.45}
        as: RevenueManager
        as_user_id: rm-001
        captures: {pkg_id: $.data.id}
      - call: POST /group-sales/leads
        payload: {account_id: '${acct_id}', program_name: Northwind Sales Kickoff, arrival_date: '2026-11-09',
          departure_date: '2026-11-12', peak_rooms: 4, total_requested_room_nights: 12, meeting_space_sqft_needed: 100,
          decision_deadline_at: '2026-09-15T00:00:00Z'}
        as: SalesManager
        as_user_id: sm-001
        captures: {lead_id: $.data.id}
      trigger:
      - call: GET /group-sales/leads/${lead_id}
        payload: {}
        as: SalesManager
        as_user_id: sm-001
