# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN (§1.8) — task_1355 real-estate-pre-licensing-school
# 9 rule_ids x 3+ instances. All chains replay from empty-DB against §1.5.
# Shared literals: clock default 2026-08-01T00:00:00Z; school LSRS/TX;
# base course tuition 50000 -> charge_total 51500 (fee tier < 100000 -> 1500);
# offering window 2026-09-01..2026-09-10 unless stated otherwise.
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------- rule 1 ---
  - rule_id: dual_variant_calc
    instances:
      - name: refund_scheduled_vs_statutory_greater_of_two
        grounds:
          - calculations.refund_scheduled_cents
          - calculations.refund_statutory_cents
          - calculations.granted_refund_cents
          - entities.RefundRequest.fields.granted_refund_cents
        distinguishing_aspect: |
          FISCAL domain (RefundRequest): identical withdrawal inputs feed two valid refund
          algorithms — published tier schedule (41350) vs statutory daily pro-rata (29900) —
          and the scaffold pins granted = max(both); entity domain differs from the other
          instances (School regulatory rate; Enrollment academic progress).
        test_recipe:
          setup:
            - "LICENSED school; ACTIVE course (required 3000 min, tuition 50000); PUBLISHED offering 2026-09-01..2026-09-10; enrollment PAID 51500 with one 300-minute VERIFIED session on 2026-09-03 (completion fraction exactly 1000 bps)"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu One", email: "s1@x.com", license_goal_state: "TX" }, as: Registrar, captures: { st: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${st}" }, as: Registrar, captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/pay", payload: { amount_cents: 51500 }, as: Registrar }
            - { call: "POST /enrollments/${enr}/attendance-records", payload: { session_date: "2026-09-03", minutes: 300 }, as: Instructor, as_user_id: "${ins}" }
          trigger:
            - { call: "POST /enrollments/${enr}/withdraw", payload: { reason: "VOLUNTARY", effective_date: "2026-09-04" }, as: Registrar }
            - { call: "GET /refund-requests?enrollment_id=${enr}", as: Registrar, captures: { rr: "$.data[0].id" } }
          assert:
            - "RefundRequest.${rr}.completion_fraction_bps_at_withdrawal == 1000"
            - "RefundRequest.${rr}.scheduled_refund_cents == 41350   # round(51500*0.90) - 5000, tier f<=1000"
            - "RefundRequest.${rr}.statutory_refund_cents == 29900   # 51500 - round(51500/10)*4 - 1000"
            - "RefundRequest.${rr}.granted_refund_cents == 41350     # max(scheduled, statutory)"
            - "Enrollment.${enr}.academic_status == WITHDRAWN"

      - name: pass_rate_first_attempt_vs_all_attempts
        grounds:
          - calculations.pass_rate_bps
          - state_machines.School.GOOD_STANDING_to_PROBATION
          - entities.School.fields.posture
        distinguishing_aspect: |
          REGULATORY domain (School): the same 15 scored attempts yield first-attempt rate
          5000 bps (5/10) vs all-attempts rate 6000 bps (9/15); probation keys on the
