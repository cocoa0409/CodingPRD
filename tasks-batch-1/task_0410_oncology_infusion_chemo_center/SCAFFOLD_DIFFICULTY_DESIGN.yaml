              payload: { treatment_cycle_id: "${cyc_id}", chair_id: "${chair_id}", nurse_id: "${n2}", start_at: "2026-07-01T10:00:00Z", end_at: "2026-07-01T11:00:00Z", acuity: 2, expected_treatment_cycle_version: "${cyc_v1}" }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CHAIR_DOUBLE_BOOKED"

      - name: overlap_nurse_acuity_aggregate_capacity_rejected
        grounds:
          - calculations.nurse_acuity_load
          - validations[priority=12]
          - entities.Nurse.fields.max_acuity_load
        distinguishing_aspect: |
          Nurse interval semantics differ from chair: instead of a binary collision,
          the nurse rule sums acuity across ALL overlapping appointments (aggregate
          capacity) and rejects only when the sum exceeds max_acuity_load. Two
          overlapping acuity-4 appointments on a max_acuity_load=6 nurse exceed 6
