  - section: errors
    instances:
      - name: not_found_sweep_across_every_path_identifier
        claim_type: error_triggerable
        grounds:
          - validations[priority=20]
          - validations[priority=21]
          - validations[priority=22]
          - validations[priority=23]
          - validations[priority=24]
          - validations[priority=26]
          - validations[priority=27]
          - validations[priority=28]
          - validations[priority=29]
          - validations[priority=30]
          - validations[priority=31]
        distinguishing_aspect: |
          Every path identifier resolves to its OWN 404 error id - eleven distinct ids from one
          syntactically valid but unknown UUID - and existence is checked before any state or
          business rung, so even action endpoints such as approve, geocode, finalize and verify
          answer 404 rather than 409 or 422. All calls are made by opaque roles so the
          institution-scope rung cannot pre-empt the existence rung.
        test_recipe:
          setup:
            - "Empty database. Every call below uses the syntactically valid but unknown identifier 00000000-0000-4000-8000-000000000000."
          setup_api_calls: []
          trigger:
            - call: "GET /cdfi/institutions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
