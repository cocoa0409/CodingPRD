        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[reservation-create-stale-project]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC rule on the reservation write endpoint: two disjoint-window bookings on one project; the second booking carrying the pre-first version is rejected with ERR_STALE_VERSION even though its window would not conflict."
        test_recipe:
          setup: ["DRAFT project at version ${p_v}; two disjoint windows 2026-08-01..08-10 and 2026-08-15..08-20"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-10T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r1: $.data.id }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-15T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { err: $.data.error_id }
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v2: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-15T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v2}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r2_status: $.data.status }
          assert:
            - "captured err == ERR_STALE_VERSION (version advanced by the first booking)"
            - "captured r2_status == BOOKED after re-reading the version (disjoint window is otherwise legitimate)"
      - name: provisional_ld_recomputed_on_schedule_delta
        claim_type: derived_field_reconciliation
        grounds: [calculations.calc_liquidated_damages, calculations.calc_critical_path_days, entities.RepairProject.fields.forecast_delivery_utc, entities.RepairProject.fields.provisional_ld_cents]
        distinguishing_aspect: "Derived-field reconciliation across two denormalised fields: approving a change order with schedule_delta_days 10 shifts forecast_delivery_utc from 2026-08-04 to 2026-08-14 and the provisional LD follows in the same request chain (0 -> 500000), with no direct write to either field."
        test_recipe:
          setup: ["IN_DOCK project, contracted 60000000 (tier 2), one 3-day item so forecast 2026-08-04 (before contract 2026-08-10, provisional LD 0); change order with cost 100000, growth duration 1 day, schedule_delta_days 10"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Line 1", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 3, quantity: 100, unit_price_cents: 600000 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_v: $.data.version }
            - call: "POST /v1/dock-reservations"
              payload: { project_id: "${p_id}", start_utc: "2026-08-01T00:00:00Z", end_utc: "2026-08-20T00:00:00Z", expected_project_version: "${p_v}" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { r_id: $.data.id }
            - call: "POST /v1/dock-reservations/${r_id}/activate"
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { prov_pre: $.data.provisional_ld_cents, fc_pre: $.data.forecast_delivery_utc, p_v2: $.data.version }
            - call: "POST /v1/change-orders"
              payload: { project_id: "${p_id}", expected_project_version: "${p_v2}", description: "Growth with schedule impact", trade_code: "HULL_STEEL", pricing_mode: "LUMP_SUM", duration_days: 1, schedule_delta_days: 10, quantity: 0.2, unit_price_cents: 500000 }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { co_id: $.data.id }
          trigger:
            - call: "POST /v1/change-orders/${co_id}/approve"
              as: CommercialApprover
              as_user_id: "comm_1"
            - call: "GET /v1/repair-projects/${p_id}"
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { prov_post: $.data.provisional_ld_cents, fc_post: $.data.forecast_delivery_utc, price_post: $.data.contracted_price_cents }
          assert:
            - "captured prov_pre == 0 and fc_pre == 2026-08-04T00:00:00Z"
            - "captured price_post == 60100000 (100000 growth cost rolled in)"
            - "captured fc_post == 2026-08-14T00:00:00Z (+10 approved delta; growth item's 1 day does not extend the 3-day critical path)"
            - "captured prov_post == 500000 (2026-08-14 is 4 days late; 4 - 3 grace = 1 x 500000)"
      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: transitive_cascade / change_order_approval_price_ripple
          rationale: "N-level cascade ordering is asserted end-to-end by the named §1.8 instance (and by final_survey_pass_undocks_project)."
      - name: dual_variant_calculation_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [complexity_profile]
        excluded_because:
          difficulty_instance: dual_variant_calc / liquidated_damages_provisional_vs_final
          rationale: "Both variants and their reconciliation at the deliver transition are asserted by the named §1.8 instances (plus bid_line_pricing_lump_sum_vs_time_and_materials)."

  # ===================================================================
  # Section: consistency_model
  # ===================================================================
  - section: consistency_model
    instances:
      - name: award_response_reflects_contracted_price_immediately
        claim_type: immediate
        grounds: [state_machines.RepairProject.BID_SUBMITTED_to_CONTRACTED, entities.RepairProject.fields.contracted_price_cents]
        distinguishing_aspect: "Immediate consistency: the award response body itself carries awarded_price_cents, contracted_price_cents (154000) and ld_daily_rate_cents (200000, tier 1) — no re-read needed to observe the side effects."
        test_recipe:
          setup: ["BID_SUBMITTED project with bid total 154000 (LUMP_SUM 71250 + T&M 82750)"]
          setup_api_calls:
            - call: "POST /v1/docks"
              payload: { name: "Drydock 1", max_length_m: 230.0, max_beam_m: 40.0, max_depth_m: 12.0, daily_rate_cents: 400000 }
              as: YardAdmin
              captures: { dock_id: $.data.id }
            - call: "POST /v1/vessels"
              payload: { name: "MV Gulf Star", imo_number: "IMO9000001", length_m: 228.5, beam_m: 38.0, draft_m: 10.5, owner_user_id: "owner_9" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { vessel_id: $.data.id }
            - call: "POST /v1/repair-projects"
              payload: { vessel_id: "${vessel_id}", dock_id: "${dock_id}", contract_delivery_date: "2026-08-10" }
              as: ProjectManager
              as_user_id: "pm_1"
              captures: { p_id: $.data.id }
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Valve overhaul (lump)", trade_code: "MACHINERY", pricing_mode: "LUMP_SUM", duration_days: 3, quantity: 7.5, unit_price_cents: 9500 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/work-items"
              payload: { project_id: "${p_id}", description: "Valve overhaul (T&M)", trade_code: "MACHINERY", pricing_mode: "TIME_AND_MATERIALS", duration_days: 3, estimated_hours: 7.5, hourly_rate_cents: 9500, materials_cost_cents: 10000 }
              as: ProjectManager
              as_user_id: "pm_1"
            - call: "POST /v1/repair-projects/${p_id}/submit-bid"
              as: ProjectManager
              as_user_id: "pm_1"
          trigger:
            - call: "POST /v1/repair-projects/${p_id}/award"
              as: CommercialApprover
              as_user_id: "comm_1"
              captures: { aw: $.data.awarded_price_cents, cp: $.data.contracted_price_cents, rate: $.data.ld_daily_rate_cents, st: $.data.status }
          assert:
            - "captured st == CONTRACTED"
            - "captured aw == 154000 and cp == 154000 (same response body, no GET required)"
            - "captured rate == 200000 (154000 < 50000000 -> tier 1)"
