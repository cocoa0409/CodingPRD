scaffold_difficulty_design:

  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cacfp_tier_i_vs_tier_ii_reimbursement_divergence
        grounds:
          - calculations.cacfp_reimbursement
          - entities.Center.fields.cacfp_tier
          - entities.AttendanceRecord.fields.cacfp_reimbursement_cents
        distinguishing_aspect: "Same meal counts (breakfast=1, lunch=1, snack=1) on a TIER_I vs a TIER_II center yield 808 vs 394 cents — a CACFP-reimbursement calc on the AttendanceRecord/Center domain (distinct from the tuition pricing calc on Enrollment)."
        test_recipe:
          setup:
            - "Two centers: C1 cacfp_tier TIER_I, C2 cacfp_tier TIER_II, each with one TODDLER classroom"
            - "One child per center, enrolls_in_cacfp true, ACTIVE enrollment, one CHECKED_OUT attendance day with breakfast=1 lunch=1 snack=1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: CenterDirector
            - call: "POST /centers"
              payload: { name: "C1", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c1_id: $.data.id }
            - call: "POST /centers"
              payload: { name: "C2", cacfp_tier: "TIER_II" }
              as: CenterDirector
              captures: { c2_id: $.data.id }
            - call: "POST /centers/${c1_id}/classrooms"
              payload: { name: "T1", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room1_id: $.data.id, room1_v: $.data.version }
            - call: "POST /centers/${c2_id}/classrooms"
              payload: { name: "T2", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room2_id: $.data.id, room2_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c1_id}", primary_contact_name: "P1", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam1_id: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c2_id}", primary_contact_name: "P2", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam2_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam1_id}", full_name: "K1", birthdate: "2024-01-10", enrolls_in_cacfp: true }
              as: CenterDirector
              captures: { kid1_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam2_id}", full_name: "K2", birthdate: "2024-01-10", enrolls_in_cacfp: true }
              as: CenterDirector
              captures: { kid2_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${kid1_id}", classroom_id: "${room1_id}", expected_classroom_version: "${room1_v}" }
              as: CenterDirector
              captures: { enr1_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${kid2_id}", classroom_id: "${room2_id}", expected_classroom_version: "${room2_v}" }
              as: CenterDirector
              captures: { enr2_id: $.data.id }
            - call: "POST /enrollments/${enr1_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam1_id}"
            - call: "POST /enrollments/${enr2_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam2_id}"
            - call: "POST /enrollments/${enr1_id}/activate"
              payload: {}
              as: CenterDirector
            - call: "POST /enrollments/${enr2_id}/activate"
              payload: {}
              as: CenterDirector
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr1_id}", service_date: "2026-03-02", scheduled_pickup_local: "17:00", meals_breakfast: 1, meals_lunch: 1, meals_snack: 1 }
              as: Teacher
              as_user_id: "${room1_id}"
              captures: { att1_id: $.data.id }
            - call: "POST /attendance-records"
              payload: { enrollment_id: "${enr2_id}", service_date: "2026-03-02", scheduled_pickup_local: "17:00", meals_breakfast: 1, meals_lunch: 1, meals_snack: 1 }
              as: Teacher
              as_user_id: "${room2_id}"
              captures: { att2_id: $.data.id }
          trigger:
            - call: "POST /attendance-records/${att1_id}/check-out"
              payload: {}
              as: Teacher
              as_user_id: "${room1_id}"
              captures: { reimb1: $.data.cacfp_reimbursement_cents }
            - call: "POST /attendance-records/${att2_id}/check-out"
              payload: {}
              as: Teacher
              as_user_id: "${room2_id}"
              captures: { reimb2: $.data.cacfp_reimbursement_cents }
          assert:
            - "AttendanceRecord.${att1_id}.cacfp_reimbursement_cents == 808"
            - "AttendanceRecord.${att2_id}.cacfp_reimbursement_cents == 394"

      - name: tuition_pricing_vs_cacfp_distinct_entity_domains
        grounds:
          - calculations.monthly_net_tuition
          - calculations.cacfp_reimbursement
          - entities.Enrollment.fields.monthly_net_tuition_cents
        distinguishing_aspect: "monthly_net_tuition is a tiered_pricing calc on the Enrollment domain producing 84000 for a TIER_B anchor at base 120000, while cacfp_reimbursement is an aggregation calc on the AttendanceRecord domain — two valid value-producing algorithms on different entity subjects."
        test_recipe:
          setup:
            - "Center TIER_I, one TODDLER classroom base 120000; TIER_B family (income 5,000,000 size 4 -> parent_share 70); one ACTIVE anchor enrollment"
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "TIER_A", max_fpl_ratio_pct: 130, parent_share_pct: 40 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "TIER_B", max_fpl_ratio_pct: 185, parent_share_pct: 70 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 5000000, household_size: 4 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10", enrolls_in_cacfp: true }
              as: CenterDirector
              captures: { kid_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${kid_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}" }
              as: CenterDirector
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
          trigger:
            - call: "POST /enrollments/${enr_id}/activate"
              payload: {}
              as: CenterDirector
              captures: { net: $.data.monthly_net_tuition_cents }
          assert:
            - "Enrollment.${enr_id}.monthly_net_tuition_cents == 84000"
            - "Family.${fam_id}.sliding_scale_tier == TIER_B"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: monthly_net_tuition_pinned_round_order_scale_then_sibling
        grounds:
          - calculations.monthly_net_tuition
          - entities.Enrollment.fields.sibling_discount_pct
          - entities.Enrollment.fields.locked_parent_share_pct
        distinguishing_aspect: "Mode (b) nested rounding where order is pinned: base 99999 with parent_share 70 then a 10% sibling discount must round per-step (round(99999*0.70)=69999, then round(69999*0.90)=62999), not sum-then-round; the scaffold pins scale-then-sibling, round each step."
        test_recipe:
          setup:
            - "Center TIER_I; TIER_B family (parent_share 70); TODDLER classroom base 99999; two siblings both ACTIVE so the junior carries the 10% discount"
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "TIER_B", max_fpl_ratio_pct: 185, parent_share_pct: 70 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 99999 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 5000000, household_size: 4 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "Elder", birthdate: "2024-01-10", enrolls_in_cacfp: true }
              as: CenterDirector
              captures: { elder_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "Younger", birthdate: "2024-02-10", sibling_group_id: "${elder_id}", enrolls_in_cacfp: true }
              as: CenterDirector
              captures: { younger_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${elder_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}" }
              as: CenterDirector
              captures: { enr_elder_id: $.data.id }
            - call: "POST /enrollments/${enr_elder_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /enrollments/${enr_elder_id}/activate"
              payload: {}
              as: CenterDirector
              captures: { room_v2: $.data.version }
            - call: "GET /classrooms/${room_id}"
              payload: {}
              as: CenterDirector
              captures: { room_v3: $.data.version }
            - call: "POST /enrollments"
              payload: { child_id: "${younger_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v3}" }
              as: CenterDirector
              captures: { enr_younger_id: $.data.id }
            - call: "POST /enrollments/${enr_younger_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
          trigger:
            - call: "POST /enrollments/${enr_younger_id}/activate"
              payload: {}
              as: CenterDirector
              captures: { younger_net: $.data.monthly_net_tuition_cents }
          assert:
            - "Enrollment.${enr_elder_id}.monthly_net_tuition_cents == 69999"
            - "Enrollment.${enr_younger_id}.monthly_net_tuition_cents == 62999"
            - "Enrollment.${enr_younger_id}.sibling_discount_pct == 10"

      - name: sliding_scale_tier_selection_threshold_and_fpl_interaction
        grounds:
          - calculations.sliding_scale_tier_selection
          - entities.SlidingScaleTable.fields.max_fpl_ratio_pct
          - entities.Family.fields.household_size
        distinguishing_aspect: "Mode (a) >=3-input non-linear formula: fpl_ratio = floor(income*100 / (FPL_BASE + (size-1)*FPL_PER)), then the lowest tier whose max_fpl_ratio_pct >= ratio is selected — three inputs (income, size, table rows) with floor + tier-walk, distinct from the rounding mode (b) instance above."
        test_recipe:
          setup:
            - "Center with TIER_A(130)/TIER_B(185)/FULL_PAY rows; family income 1,960,400 size 1 -> ratio exactly 130 -> TIER_A (inclusive bound)"
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "TIER_A", max_fpl_ratio_pct: 130, parent_share_pct: 40 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "TIER_B", max_fpl_ratio_pct: 185, parent_share_pct: 70 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
              as: CenterDirector
          trigger:
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 1960400, household_size: 1 }
              as: CenterDirector
              captures: { fam_id: $.data.id, fam_tier: $.data.sliding_scale_tier }
          assert:
            - "Family.${fam_id}.sliding_scale_tier == TIER_A"

  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_branching_offered_to_accepted_or_declined
        grounds:
          - state_machines.Enrollment.OFFERED_to_ACCEPTED
          - state_machines.Enrollment.OFFERED_to_DECLINED
          - state_machines.Enrollment.ACCEPTED_to_ACTIVE
        distinguishing_aspect: "Enrollment forks at OFFERED into ACCEPTED (forward to ACTIVE) vs DECLINED (terminal) with divergent side-effect sets — branching fork on the Enrollment entity, distinct from the WaitlistEntry branching machine."
        test_recipe:
          setup:
            - "Center, classroom, family, two children; one enrollment will be accepted, the other declined"
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "A", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_a_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${kid_a_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}" }
              as: CenterDirector
              captures: { enr_a_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr_a_id}/decline"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
              captures: { st: $.data.status }
          assert:
            - "Enrollment.${enr_a_id}.status == DECLINED"
            - "Classroom.${room_id}.active_enrollment_count == 0"

      - name: waitlist_branching_waiting_to_offered_converted_or_expired
        grounds:
          - state_machines.WaitlistEntry.WAITING_to_OFFERED
          - state_machines.WaitlistEntry.OFFERED_to_EXPIRED
          - state_machines.WaitlistEntry.OFFERED_to_CONVERTED
        distinguishing_aspect: "WaitlistEntry forks at OFFERED into CONVERTED (consumed by an enrollment) vs EXPIRED (offer TTL lapsed) — branching on the WaitlistEntry entity, a different entity than the Enrollment branching instance."
        test_recipe:
          setup:
            - "Clock pinned; classroom; child on waitlist; entry promoted to OFFERED then clock advanced past offer_expires_at; expire-stale sweep run"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T08:00:00Z" }
              as: CenterDirector
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 1, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "W", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_id: $.data.id }
            - call: "POST /classrooms/${room_id}/waitlist"
              payload: { child_id: "${kid_id}" }
              as: CenterDirector
              captures: { wl_id: $.data.id }
            - call: "POST /classrooms/${room_id}/waitlist/promote"
              payload: {}
              as: CenterDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T08:00:00Z" }
              as: CenterDirector
          trigger:
            - call: "POST /classrooms/${room_id}/waitlist/expire-stale"
              payload: {}
              as: CenterDirector
          assert:
            - "WaitlistEntry.${wl_id}.status == EXPIRED"

  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: activate_cascade_capacity_sibling_rerank_tuition_depth3
        grounds:
          - state_machines.Enrollment.ACCEPTED_to_ACTIVE
          - calculations.monthly_net_tuition
          - entities.Classroom.fields.active_enrollment_count
          - entities.Classroom.fields.status
        distinguishing_aspect: "Depth>=3 chain from activate: activate(younger) -> recompute sibling_discount_pct (younger becomes the junior, gets 10%) -> that discount change recomputes younger.monthly_net_tuition_cents -> Classroom.active_enrollment_count increments which recomputes Classroom.status; originates from the activate transition."
        test_recipe:
          setup:
            - "TIER_B family, base 99999, capacity 2; elder already ACTIVE (anchor 0%); younger ACCEPTED ready to activate"
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "TIER_B", max_fpl_ratio_pct: 185, parent_share_pct: 70 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 2, base_monthly_tuition_cents: 99999 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 5000000, household_size: 4 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "Elder", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { elder_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "Younger", birthdate: "2024-02-10", sibling_group_id: "${elder_id}" }
              as: CenterDirector
              captures: { younger_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${elder_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v0}" }
              as: CenterDirector
              captures: { enr_elder_id: $.data.id }
            - call: "POST /enrollments/${enr_elder_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /enrollments/${enr_elder_id}/activate"
              payload: {}
              as: CenterDirector
            - call: "GET /classrooms/${room_id}"
              payload: {}
              as: CenterDirector
              captures: { room_v1: $.data.version }
            - call: "POST /enrollments"
              payload: { child_id: "${younger_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v1}" }
              as: CenterDirector
              captures: { enr_younger_id: $.data.id }
            - call: "POST /enrollments/${enr_younger_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
          trigger:
            - call: "POST /enrollments/${enr_younger_id}/activate"
              payload: {}
              as: CenterDirector
              captures: { ynet: $.data.monthly_net_tuition_cents }
          assert:
            - "Enrollment.${enr_younger_id}.monthly_net_tuition_cents == 62999"
            - "Enrollment.${enr_younger_id}.sibling_discount_pct == 10"
            - "Classroom.${room_id}.active_enrollment_count == 2"
            - "Classroom.${room_id}.status == FULL"

      - name: issue_invoice_ledger_balance_depth2
        grounds:
          - state_machines.Invoice.DRAFT_to_ISSUED
          - calculations.invoice_total
          - entities.Family.fields.account_balance_cents
        distinguishing_aspect: "Depth>=2 chain from issue: issue(invoice) -> freeze total_cents = sum of ACTIVE monthly_net_tuition -> that frozen total increments Family.account_balance_cents (ledger sync); originates from the DRAFT->ISSUED transition, a different trigger than activate."
        test_recipe:
          setup:
            - "FULL_PAY family with one ACTIVE enrollment at base 120000 (net 120000); a DRAFT invoice for billing_month 2026-03"
          setup_api_calls:
            - call: "POST /centers"
              payload: { name: "C", cacfp_tier: "TIER_I" }
              as: CenterDirector
              captures: { c_id: $.data.id }
            - call: "POST /centers/${c_id}/sliding-scale"
              payload: { tier: "FULL_PAY", max_fpl_ratio_pct: 999999, parent_share_pct: 100 }
              as: CenterDirector
            - call: "POST /centers/${c_id}/classrooms"
              payload: { name: "T", age_band: "TODDLER", licensed_capacity: 5, base_monthly_tuition_cents: 120000 }
              as: CenterDirector
              captures: { room_id: $.data.id, room_v: $.data.version }
            - call: "POST /families"
              payload: { center_id: "${c_id}", primary_contact_name: "P", annual_household_income_cents: 9999999, household_size: 2 }
              as: CenterDirector
              captures: { fam_id: $.data.id }
            - call: "POST /children"
              payload: { family_id: "${fam_id}", full_name: "K", birthdate: "2024-01-10" }
              as: CenterDirector
              captures: { kid_id: $.data.id }
            - call: "POST /enrollments"
              payload: { child_id: "${kid_id}", classroom_id: "${room_id}", expected_classroom_version: "${room_v}" }
              as: CenterDirector
              captures: { enr_id: $.data.id }
            - call: "POST /enrollments/${enr_id}/accept"
              payload: {}
              as: Parent
              as_user_id: "${fam_id}"
            - call: "POST /enrollments/${enr_id}/activate"
