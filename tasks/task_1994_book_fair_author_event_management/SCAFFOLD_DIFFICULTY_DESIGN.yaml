            - { call: "POST /consignment-agreements/${agr_id}/counter", payload: { discount_pct: 0.41, return_cap_pct: 0.22, restocking_fee_pct: 0.11, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72, expected_agreement_version: "${agr_v2}" }, as: Organizer, captures: { agr_v3: "$.data.version" } }
            - { call: "POST /consignment-agreements/${agr_id}/counter", payload: { discount_pct: 0.42, return_cap_pct: 0.20, restocking_fee_pct: 0.12, markdown_allowance_pct: 0.20, freight_responsibility: PUBLISHER, offer_expiry_hours: 72, expected_agreement_version: "${agr_v3}" }, as: PublisherRep, as_user_id: "${pub_id}", captures: { agr_v4: "$.data.version" } }
            - { call: "POST /consignment-agreements/${agr_id}/counter", payload: { discount_pct: 0.41, return_cap_pct: 0.22, restocking_fee_pct: 0.11, markdown_allowance_pct: 0.20, freight_responsibility: ORGANIZER, offer_expiry_hours: 72, expected_agreement_version: "${agr_v4}" }, as: Organizer, captures: { agr_v5: "$.data.version" } }
            - { call: "POST /consignment-agreements/${agr_id}/counter", payload: { discount_pct: 0.42, return_cap_pct: 0.20, restocking_fee_pct: 0.12, markdown_allowance_pct: 0.20, freight_responsibility: PUBLISHER, offer_expiry_hours: 72, expected_agreement_version: "${agr_v5}" }, as: PublisherRep, as_user_id: "${pub_id}", captures: { agr_v6: "$.data.version", round6: "$.data.negotiation_round" } }
