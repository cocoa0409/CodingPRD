              as: AccessibilityTester
              captures: { state_before: $.data.assessment_state, cov_before: $.data.coverage_pct }
          trigger:
            - call: "POST /assessment-runs/${run_sr_id}/complete"
              payload: { defects_found: 3 }
              as: AccessibilityTester
          assert:
            - "${state_before} == IN_TESTING"
            - "${cov_before} == 0.00"
            - "AssessmentRun.${run_sr_id}.status == COMPLETED"
            - "AssessmentRun.${run_sr_id}.completed_at == 2026-08-01T00:00:00Z"
            - "ProductComponent.${comp_id}.evidence_units_total == 40"
            - "ProductComponent.${comp_id}.coverage_pct == 45.00"
            - "ProductComponent.${comp_id}.assessment_state == COMPLETE"
            - "Product.${prod_id}.components_complete_count == 1"
            - "Product.${prod_id}.assessment_readiness == READY"

      - name: run_void_revalidation_chain
        grounds:
          - state_machines.AssessmentRun.COMPLETED_to_VOID
          - state_machines.ProductComponent.COMPLETE_to_IN_TESTING
          - state_machines.CriterionAssessment.ATTESTED_to_NEEDS_REVALIDATION
          - calculations.product_conformance_index
        distinguishing_aspect: |
          Cascade 2 of 3, triggered by voiding a completed run (a different transition from cascade 1
          and cascade 3), depth 4: the void reverses evidence_units_total (hop 1), which forces
          coverage_pct back to 0.00 (hop 2), which drops assessment_state COMPLETE -> IN_TESTING
          (hop 3), which flips the ATTESTED assessment to NEEDS_REVALIDATION (hop 4), which erases
          the provisional index (hop 5).
        test_recipe:
          setup:
            - "One in-scope component with applicable_criteria_count 40 whose single COMPLETED MANUAL SCREEN_READER run gives coverage_pct 45.00 and assessment_state COMPLETE"
            - "Criterion 1.1.1 has an ATTESTED assessment with support_level SUPPORTS, so Product.conformance_index_provisional is 100.00 and assessed_criteria_count is 1"
            - "No known issue cites the run as resolution evidence"
