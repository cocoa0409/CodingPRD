scenario: |
  2829. HVAC Filter Subscription & Resident Benefit Package (Second Nature): filter size
  capture and per-unit SKU mapping at move-in, ship-cadence calculation by system type and
  household profile, property-manager billing vs resident-paid enrollment, non-installation
  detection through HVAC runtime or renewal survey, damage-waiver and air-quality guarantee
  claim handling, bundled resident benefits (credit reporting, renters insurance)
  entitlement, mid-lease address change & subscription transfer, cancellation, proration and
  unreturned-shipment reconciliation

domain_name: hvac-filter-subscription-resident-benefits
api_prefix: "/"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - selector_policy
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only two nesting levels appear in URLs
  # (properties/{id}/units, subscriptions/{id}/<child>) and they exist purely as FK
  # reverse-reachability reads; every write targets a top-level collection with FK ids in
  # the body. Property/Unit/Resident/FilterSku/Subscription are peers, not a tree.

  state_machine_shape: parallel
  # Subscription carries TWO independent state dimensions on the same row:
  #   `status`               (commercial lifecycle: PENDING_SETUP/ACTIVE/SUSPENDED/TRANSFER_PENDING/...)
  #   `installation_posture` (compliance dimension: UNVERIFIED/COMPLIANT/NON_INSTALL_SUSPECTED/...)
  # Both dimensions have cycles (ACTIVE->SUSPENDED->ACTIVE, ACTIVE->TRANSFER_PENDING->ACTIVE;
  # NON_INSTALL_SUSPECTED->NON_INSTALL_CONFIRMED->REMEDIATED->COMPLIANT). Claim adds a second
  # non-linear machine (UNDER_REVIEW->INFO_REQUESTED->UNDER_REVIEW revision loop).

  relationship_patterns:
    - one_to_many          # Property -> Unit; Subscription -> Shipment/Claim/LedgerEntry/...
    - self_referential     # Subscription.predecessor_subscription_id -> Subscription.id (transfer chain)
    - cross_aggregate      # Subscription -> FilterSku (catalog), Claim -> BenefitEntitlement
    - polymorphic          # LedgerEntry.source_ref_id resolves per entry_type (pinned in §1.1)

  role_model: segregation_of_duties
  # ClaimsAdjuster owns claim triage AND claim decision, but the SAME X-User-ID may not do
  # both on one Claim (Claim.triaged_by_user_id != Claim.decided_by_user_id). Layered on top
  # of peer ownership: PropertyManager is entity_backed:Property, Resident is
  # entity_backed:Resident, and each may only act on resources their entity owns.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: property display name
        constraints: "1..120 chars"
      - name: state_code
        type: string
        source: input
        description: two-letter US state code of the property
        constraints: "exactly 2 uppercase letters"
      - name: billing_mode
        type: enum
        source: input
        description: who the program invoices for this property's subscriptions by default
        constraints: "PM_BILLED | RESIDENT_PAID"
      - name: benefit_tier
        type: enum
        source: input
        description: resident-benefit package tier purchased by the property
        constraints: "BASIC | PLUS | PREMIUM"
      - name: damage_waiver_enabled
        type: boolean
        source: input
        description: whether the property buys the damage-waiver rider for its residents
      - name: aqg_enabled
        type: boolean
        source: input
        description: whether the property buys the air-quality-guarantee rider
      - name: credit_limit_cents
        type: integer
        source: input
        description: maximum PM_BILLED outstanding balance the program extends to this property
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: property lifecycle state (see §1.2 Property)
        default: ONBOARDING
        constraints: "ONBOARDING | ACTIVE | SUSPENDED | OFFBOARDED"
      - name: suspend_reason
        type: string
        source: input
        description: "reason text supplied in the POST /properties/{id}/suspend body; null while ACTIVE"
        default: null
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: |
          Cross-entity derived ledger field. Equals
          SUM(LedgerEntry.amount_cents) over every LedgerEntry whose billed_party ==
          'PROPERTY_MANAGER' AND whose Subscription (LedgerEntry.subscription_id) has
          unit_id pointing at a Unit whose property_id == this Property.id. Recomputed on
          every LedgerEntry insert (see §1.3 property_ledger_rollup).
        default: 0
      - name: unit_count
        type: integer
        source: computed
        description: "count of Unit rows with property_id == this Property.id AND status IN {AVAILABLE, OCCUPIED}"
        default: 0

  - name: Unit
    parent: Property
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property this rental unit belongs to"
      - name: unit_label
        type: string
        source: input
        description: human-readable unit designator (e.g. "3B")
        constraints: "1..24 chars; unique per property_id"
      - name: hvac_system_type
        type: enum
        source: input
        description: HVAC equipment class driving base ship cadence
        constraints: "SINGLE_STAGE | TWO_STAGE | VARIABLE_SPEED | HEAT_PUMP"
      - name: filter_slot_count
        type: integer
        source: input
        description: number of filter slots that must be re-filtered every shipment
        constraints: ">= 1 and <= 6"
      - name: return_grille_count
        type: integer
        source: input
        description: number of return grilles (documentation/ops field, not a fee input)
        constraints: ">= 1 and <= 6"
      - name: nominal_size_code
        type: string
        source: input
        description: filter size printed on the existing filter, captured at onboarding
        constraints: "matches ^\\d{1,2}x\\d{1,2}x\\d{1,2}$"
      - name: actual_measured_size_code
        type: string
        source: system
        description: |
          Physically measured size captured at move-in via
          POST /units/{id}/filter-size-captures. Null until the first capture. SKU mapping
          uses actual_measured_size_code when non-null, otherwise nominal_size_code.
        default: null
      - name: size_capture_count
        type: integer
        source: system
        description: number of filter-size captures accepted on this unit
        default: 0
      - name: status
        type: enum
        source: system
        description: occupancy bookkeeping state of the unit
        default: AVAILABLE
        constraints: "AVAILABLE | OCCUPIED | OUT_OF_SERVICE"

  - name: FilterSku
    parent: null
    common_fields: true
    fields:
      - name: sku_code
        type: string
        source: input
        description: catalog SKU code
        constraints: "1..32 chars; globally unique"
      - name: size_code
        type: string
        source: input
        description: filter size this SKU fits
        constraints: "matches ^\\d{1,2}x\\d{1,2}x\\d{1,2}$"
      - name: thickness_inches
        type: integer
        source: input
        description: filter thickness in inches, drives the cadence thickness bonus
        constraints: "1 | 2 | 4 | 5"
      - name: merv_rating
        type: integer
        source: input
        description: MERV filtration rating
        constraints: ">= 6 and <= 16"
      - name: unit_cost_cents
        type: integer
        source: input
        description: program cost of one filter of this SKU
        constraints: "> 0"
      - name: ship_weight_oz
        type: integer
        source: input
        description: per-filter shipping weight in ounces, drives the weight surcharge
        constraints: "> 0"
      - name: pack_quantity
        type: integer
        source: input
        description: filters per sealed pack; shipments round up to a whole pack multiple
        constraints: ">= 1 and <= 6"
      - name: status
        type: enum
        source: system
        description: catalog availability
        default: ACTIVE
        constraints: "ACTIVE | DISCONTINUED"

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: resident legal name
        constraints: "1..120 chars"
      - name: email
        type: string
        source: input
        description: resident contact email
        constraints: "globally unique; must contain '@'"
      - name: household_size
        type: integer
        source: input
        description: number of occupants, drives cadence load points
        constraints: ">= 1 and <= 12"
      - name: has_pets
        type: boolean
        source: input
        description: household has shedding pets, drives cadence load points
      - name: smoker
        type: boolean
        source: input
        description: household includes a smoker, drives cadence load points
      - name: allergy_flag
        type: boolean
        source: input
        description: household requires elevated filtration, raises the minimum MERV floor
      - name: status
        type: enum
        source: system
        description: residency lifecycle (see §1.2 Resident)
        default: PROSPECT
        constraints: "PROSPECT | RESIDING | MOVED_OUT"

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: resident_id
        type: string
        source: input
        description: "FK -> Resident.id; the enrolled resident"
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the unit being filtered"
      - name: property_id
        type: string
        source: computed
        description: "FK -> Property.id; denormalized from Unit.property_id at creation and re-denormalized when a transfer moves the subscription to a unit at another property"
      - name: assigned_sku_id
        type: string
        source: computed
        description: "FK -> FilterSku.id; result of the §1.3 sku_selection selector at creation, re-run on filter-size capture and on transfer remap"
      - name: predecessor_subscription_id
        type: string
        source: computed
        description: "FK -> Subscription.id; self-referential link to the subscription this row superseded when a SubscriptionTransfer completed; null for original enrollments"
        default: null
      - name: billing_party
        type: enum
        source: input
        description: who is invoiced for this subscription's fees
        constraints: "PROPERTY_MANAGER | RESIDENT"
      - name: enrollment_channel
        type: enum
        source: input
        description: how the enrollment was captured
        constraints: "MOVE_IN_PACKET | RESIDENT_PORTAL | PM_BULK_UPLOAD"
      - name: lease_start_date
        type: string
        source: input
        description: "lease start, date-only ISO 8601 (YYYY-MM-DD); left edge of the unit occupancy interval"
      - name: lease_end_date
        type: string
        source: input
        description: "lease end, date-only ISO 8601 (YYYY-MM-DD); right edge of the unit occupancy interval; must be > lease_start_date"
      - name: status
        type: enum
        source: system
        description: commercial lifecycle dimension (see §1.2 Subscription.status)
        default: PENDING_SETUP
        constraints: "PENDING_SETUP | ACTIVE | SUSPENDED | TRANSFER_PENDING | CANCELLED | VOIDED"
      - name: installation_posture
        type: enum
        source: system
        description: independent compliance dimension (see §1.2 Subscription.installation_posture)
        default: UNVERIFIED
        constraints: "UNVERIFIED | COMPLIANT | NON_INSTALL_SUSPECTED | NON_INSTALL_CONFIRMED | REMEDIATED"
      - name: ship_cadence_days
        type: integer
        source: computed
        description: output of §1.3 ship_cadence_days
      - name: filters_per_shipment
        type: integer
        source: computed
        description: output of §1.3 filters_per_shipment
      - name: monthly_fee_cents
        type: integer
        source: computed
        description: output of §1.3 monthly_fee_cents; recomputed whenever the entitled benefit set, the assigned SKU, or the cadence changes
      - name: entitled_benefit_codes
        type: array
        source: computed
        description: "output of §1.3 benefit_entitlement_set, sorted ascending by benefit_code; the authoritative set the BenefitEntitlement rows mirror"
      - name: next_ship_date
        type: string
        source: computed
        description: "date-only ISO 8601; scheduled_ship_date of the Shipment with the greatest scheduled_ship_date whose status IN {SCHEDULED, SHIPPED}; null when no such shipment exists"
        default: null
      - name: shipment_sequence_counter
        type: integer
        source: system
        description: monotonically increasing counter stamped onto Shipment.sequence_number
        default: 0
      - name: activated_at
        type: datetime
        source: system
        description: logical-clock instant of the ACTIVE transition, ISO 8601 UTC with three fractional digits; null before activation
        default: null
      - name: cancel_effective_date
        type: string
        source: system
        description: "date-only ISO 8601 effective_date supplied to the cancel action; null while not cancelled"
        default: null
      - name: cancel_reason
        type: string
        source: input
        description: "reason text supplied in the POST /subscriptions/{id}/cancel body; overwritten with the literal TRANSFER_SUPERSEDED when the cancellation is driven by cascade C"
        default: null
      - name: gross_prorated_credit_cents
        type: integer
        source: computed
        description: step-1 output of §1.3 cancellation_settlement, frozen at cancellation
        default: 0
      - name: waiver_credit_pct
        type: number
        source: computed
        description: step-3 tier output of §1.3 cancellation_settlement, frozen at cancellation
        default: 0
      - name: unreturned_fee_gross_cents
        type: integer
        source: computed
        description: step-2 output of §1.3 cancellation_settlement, frozen at cancellation
        default: 0
      - name: unreturned_fee_net_cents
        type: integer
        source: computed
        description: step-4 output of §1.3 cancellation_settlement, frozen at cancellation
        default: 0
      - name: net_settlement_cents
        type: integer
        source: computed
        description: step-5 output of §1.3 cancellation_settlement, frozen at cancellation
        default: 0
      - name: latest_detection_method
        type: enum
        source: system
        description: detection_method of the most recent non-install evaluation on this subscription; null before any evaluation
        default: null
        constraints: "RUNTIME_ANALYTICS | RENEWAL_SURVEY | null"
      - name: latest_evidence_score
        type: integer
        source: computed
        description: evidence_score of the most recent non-install evaluation on this subscription; null before any evaluation
        default: null

  - name: Shipment
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription this shipment fulfills"
      - name: sku_id
        type: string
        source: computed
        description: "FK -> FilterSku.id; snapshot of Subscription.assigned_sku_id at shipment creation, never re-pointed afterwards"
      - name: sequence_number
        type: integer
        source: system
        description: 1-based ordinal within the subscription, from Subscription.shipment_sequence_counter
      - name: scheduled_ship_date
        type: string
        source: input
        description: "date-only ISO 8601 target ship date; left edge of the cadence occupation interval"
      - name: quantity
        type: integer
        source: input
        description: number of filters in this shipment
        default: null
        constraints: "when omitted, defaults to Subscription.filters_per_shipment; when supplied must equal Subscription.filters_per_shipment"
      - name: tracking_code
        type: string
        source: input
        description: carrier tracking code recorded at ship time
        default: null
      - name: shipped_at
        type: datetime
        source: system
        description: logical-clock instant of the SHIPPED transition, ISO 8601 UTC with three fractional digits
        default: null
      - name: delivered_at
        type: datetime
        source: input
        description: carrier-reported delivery instant, ISO 8601 UTC with three fractional digits
        default: null
      - name: returned_at
        type: datetime
        source: input
        description: instant the returned filters were scanned back in, ISO 8601 UTC with three fractional digits
        default: null
      - name: unreturned_fee_cents
        type: integer
        source: computed
        description: per-shipment fee written off by §1.3 unreturned_shipment_fee; 0 until the shipment is written off
        default: 0
      - name: status
        type: enum
        source: system
        description: fulfillment state (see §1.2 Shipment)
        default: SCHEDULED
        constraints: "SCHEDULED | SHIPPED | DELIVERED | RETURN_REQUESTED | RETURNED | UNRETURNED_WRITTEN_OFF | CANCELLED"

  - name: RuntimeReading
    parent: Unit
    common_fields: false
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the unit whose HVAC telemetry this reading covers"
      - name: window_start
        type: datetime
        source: input
        description: inclusive left edge of the telemetry window, ISO 8601 UTC with three fractional digits
      - name: window_end
        type: datetime
        source: input
        description: exclusive right edge of the telemetry window, ISO 8601 UTC with three fractional digits; must be > window_start
      - name: runtime_minutes
        type: integer
        source: input
        description: blower runtime minutes observed in the window
        constraints: ">= 0"
      - name: static_pressure_delta_pa
        type: integer
        source: input
        description: static pressure drop across the filter rack in pascals; rising values indicate a clogged (unchanged) filter
        constraints: "> 0"
      - name: source
        type: enum
        source: input
        description: telemetry origin
        constraints: "SMART_THERMOSTAT | PRESSURE_SENSOR | GATEWAY_BACKFILL"

  - name: RenewalSurvey
    parent: Subscription
    common_fields: false
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription the resident answered for"
      - name: installed_last_shipment
        type: boolean
        source: input
        description: resident self-reports whether the most recent delivered filters were installed
      - name: filters_on_hand_count
        type: integer
        source: input
        description: number of uninstalled filters the resident still has
        constraints: ">= 0 and <= 24"
      - name: self_reported_change_date
        type: string
        source: input
        description: "date-only ISO 8601 of the resident's last self-reported filter change; may be null"
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant the survey was accepted, ISO 8601 UTC with three fractional digits

  - name: NonInstallCase
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription under investigation"
      - name: detection_method
        type: enum
        source: input
        description: which §1.3 non_install_evidence_score variant produced this case
        constraints: "RUNTIME_ANALYTICS | RENEWAL_SURVEY"
      - name: evidence_score
        type: integer
        source: computed
        description: output of §1.3 non_install_evidence_score under the declared detection_method, 0..100
      - name: suspect_threshold
        type: integer
        source: computed
        description: SUSPECT_THRESHOLD constant for this detection_method, frozen onto the case at creation
      - name: confirm_threshold
        type: integer
        source: computed
        description: CONFIRM_THRESHOLD constant for this detection_method, frozen onto the case at creation
      - name: opened_at
        type: datetime
        source: system
        description: logical-clock instant the case was created, ISO 8601 UTC with three fractional digits
      - name: notice_sent_at
        type: datetime
        source: system
        description: logical-clock instant the resident notice was sent, ISO 8601 UTC with three fractional digits
        default: null
      - name: remediation_deadline
        type: string
        source: computed
        description: "date-only ISO 8601 = notice_sent_at date + REMEDIATION_GRACE_DAYS; null before the notice is sent"
        default: null
      - name: remediation_note
        type: string
        source: input
        description: operator/PM note recorded at remediation
        default: null
      - name: status
        type: enum
        source: system
        description: case workflow state (see §1.2 NonInstallCase)
        default: OPEN
        constraints: "OPEN | NOTICE_SENT | REMEDIATED | ESCALATED_TO_PM | CLOSED_UNSUBSTANTIATED"

  - name: Claim
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription the claim is filed against"
      - name: claim_type
        type: enum
        source: input
        description: which benefit rider is being claimed
        constraints: "DAMAGE_WAIVER | AIR_QUALITY_GUARANTEE"
      - name: incident_date
        type: string
        source: input
        description: "date-only ISO 8601 date the loss occurred; checked against the coverage window"
      - name: requested_amount_cents
        type: integer
        source: input
        description: amount the claimant asks for
        constraints: "> 0"
      - name: description
        type: string
        source: input
        description: free-text incident narrative
        constraints: "1..500 chars"
      - name: provisional_amount_cents
        type: integer
        source: computed
        description: output of §1.3 claim_settlement_amount variant provisional_at_triage, frozen at triage
        default: null
      - name: approved_amount_cents
        type: integer
        source: computed
        description: output of §1.3 claim_settlement_amount variant final_at_decision, frozen at the decide action; 0 when denied
        default: null
      - name: triaged_by_user_id
        type: string
        source: system
        description: opaque ClaimsAdjuster X-User-ID that performed triage
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: opaque ClaimsAdjuster X-User-ID that recorded the decision; must differ from triaged_by_user_id
        default: null
      - name: info_request_round
        type: integer
        source: system
        description: number of request-info rounds already consumed on this claim
        default: 0
      - name: paid_at
        type: datetime
        source: system
        description: logical-clock instant of the pay action, ISO 8601 UTC with three fractional digits
        default: null
      - name: reversal_reason
        type: string
        source: input
        description: reason text supplied to reverse-payment
        default: null
      - name: status
        type: enum
        source: system
        description: claim workflow state (see §1.2 Claim)
        default: SUBMITTED
        constraints: "SUBMITTED | UNDER_REVIEW | INFO_REQUESTED | APPROVED | DENIED | PAID | PAYMENT_REVERSED | WITHDRAWN"

  - name: BenefitEntitlement
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription this entitlement rides on"
      - name: benefit_code
        type: enum
        source: computed
        description: the bundled benefit this row grants; one row per member of Subscription.entitled_benefit_codes
        constraints: "CREDIT_REPORTING | RENTERS_INSURANCE | DAMAGE_WAIVER | AIR_QUALITY_GUARANTEE"
      - name: state
        type: enum
        source: system
        description: entitlement lifecycle (see §1.2 BenefitEntitlement)
        default: PENDING
        constraints: "PENDING | ACTIVE | SUSPENDED | FORFEITED | EXPIRED"
      - name: suspended_by_property_event
        type: boolean
        source: system
        description: true only while this row was suspended by a Property suspend cascade; the reactivate cascade restores exactly the rows carrying this flag
        default: false
      - name: effective_from
        type: datetime
        source: system
        description: logical-clock instant the row entered ACTIVE, ISO 8601 UTC with three fractional digits
        default: null
      - name: terminated_at
        type: datetime
        source: system
        description: logical-clock instant the row entered FORFEITED or EXPIRED, ISO 8601 UTC with three fractional digits
        default: null
      - name: forfeit_reason
        type: enum
        source: system
        description: why the entitlement was forfeited or expired
        default: null
        constraints: "NON_INSTALL_CONFIRMED | SUBSCRIPTION_CANCELLED | SUBSCRIPTION_VOIDED | TRANSFER_SUPERSEDED | null"

  - name: LedgerEntry
    parent: Subscription
    common_fields: false
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription the money movement belongs to"
      - name: entry_type
        type: enum
        source: system
        description: what produced the entry
        constraints: "ENROLLMENT_FEE | MONTHLY_FEE | PRORATION_CREDIT | UNRETURNED_SHIPMENT_FEE | WAIVER_REVERSAL | CLAIM_PAYOUT | CLAIM_PAYOUT_REVERSAL | TRANSFER_ADJUSTMENT"
      - name: amount_cents
        type: integer
        source: computed
        description: "signed cents; POSITIVE = charge to billed_party (raises outstanding balance), NEGATIVE = credit to billed_party"
      - name: billed_party
        type: enum
        source: computed
        description: snapshot of Subscription.billing_party at insert time
        constraints: "PROPERTY_MANAGER | RESIDENT"
      - name: period_start
        type: string
        source: computed
        description: "date-only ISO 8601 first day of the billing period the entry covers; equals the entry date for one-off entries"
      - name: period_end
        type: string
        source: computed
        description: "date-only ISO 8601 last day of the billing period the entry covers; equals period_start for one-off entries"
      - name: source_ref_id
        type: string
        source: computed
        description: |
          Polymorphic reference resolved by entry_type, pinned as follows:
          UNRETURNED_SHIPMENT_FEE -> Shipment.id; CLAIM_PAYOUT and
          CLAIM_PAYOUT_REVERSAL -> Claim.id; WAIVER_REVERSAL ->
          BenefitEntitlement.id; TRANSFER_ADJUSTMENT -> SubscriptionTransfer.id;
          ENROLLMENT_FEE, MONTHLY_FEE and PRORATION_CREDIT -> Subscription.id.
          Not declared as an FK because the referent entity varies by entry_type.
      - name: memo
        type: string
        source: computed
        description: short human-readable label describing the entry

  - name: SubscriptionTransfer
    parent: Subscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> Subscription.id; the subscription being moved"
      - name: to_unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the destination unit of the mid-lease address change"
      - name: effective_date
        type: string
        source: input
        description: "date-only ISO 8601 date the move takes effect; proration pivot for both legs"
      - name: remapped_sku_id
        type: string
        source: computed
        description: "FK -> FilterSku.id; sku_selection result for the destination unit, set by the remap-sku action"
        default: null
      - name: proration_credit_cents
        type: integer
        source: computed
        description: step-1 output of §1.3 transfer_proration (credit on the outgoing subscription)
        default: 0
      - name: proration_charge_cents
        type: integer
        source: computed
        description: step-2 output of §1.3 transfer_proration (charge on the incoming subscription)
        default: 0
      - name: net_adjustment_cents
        type: integer
        source: computed
        description: step-3 output of §1.3 transfer_proration; the signed TRANSFER_ADJUSTMENT amount
        default: 0
      - name: successor_subscription_id
        type: string
        source: computed
        description: "FK -> Subscription.id; the subscription minted on completion, whose predecessor_subscription_id points back at subscription_id"
        default: null
      - name: rejection_reason
        type: string
        source: input
        description: reason text supplied to the reject action
        default: null
      - name: status
        type: enum
        source: system
        description: transfer workflow state (see §1.2 SubscriptionTransfer)
        default: REQUESTED
        constraints: "REQUESTED | SKU_REMAPPED | COMPLETED | REJECTED | SUPERSEDED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Property
    state_field: status
    initial_state: ONBOARDING
    terminal_states: [OFFBOARDED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /properties/{id}/activate"
        actor: ProgramOperator
        preconditions:
          - "Property.status == ONBOARDING"
          - "Property.unit_count >= 1"
        side_effects:
          - "sets Property.status = ACTIVE"
          - "clears Property.suspend_reason to null"
          - "increments Property.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /properties/{id}/suspend"
        actor: ProgramOperator
        preconditions:
          - "Property.status == ACTIVE"
        side_effects:
          - "sets Property.status = SUSPENDED and Property.suspend_reason = request reason"
          - "CASCADE LINK 1->2: every Subscription with property_id == Property.id AND status == ACTIVE transitions ACTIVE -> SUSPENDED (see Subscription.ACTIVE_to_SUSPENDED)"
          - "increments Property.version by 1"
        note: "Head of transitive cascade B; links 2..3 are declared on Subscription.ACTIVE_to_SUSPENDED."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /properties/{id}/reactivate"
        actor: ProgramOperator
        preconditions:
          - "Property.status == SUSPENDED"
        side_effects:
          - "sets Property.status = ACTIVE and Property.suspend_reason = null"
          - "CASCADE LINK 1->2: every Subscription with property_id == Property.id AND status == SUSPENDED transitions SUSPENDED -> ACTIVE (see Subscription.SUSPENDED_to_ACTIVE)"
          - "increments Property.version by 1"
        note: "Compensating action for ACTIVE_to_SUSPENDED; see §1.3 entitlement_active_census."
      - from: SUSPENDED
        to: OFFBOARDED
        trigger: "POST /properties/{id}/offboard"
        actor: ProgramOperator
        preconditions:
          - "Property.status == SUSPENDED"
          - "no Subscription with property_id == Property.id has status IN {PENDING_SETUP, ACTIVE, TRANSFER_PENDING}"
        side_effects:
          - "sets Property.status = OFFBOARDED"
          - "sets every Unit with property_id == Property.id and status IN {AVAILABLE, OCCUPIED} to OUT_OF_SERVICE"
          - "increments Property.version by 1"

  - entity: Resident
    state_field: status
    initial_state: PROSPECT
    terminal_states: [MOVED_OUT]
    transitions:
      - from: PROSPECT
        to: RESIDING
        trigger: "system event: a Subscription referencing this Resident enters ACTIVE"
        actor: system
        preconditions:
          - "Resident.status == PROSPECT"
        side_effects:
          - "sets Resident.status = RESIDING"
          - "increments Resident.version by 1"
      - from: RESIDING
        to: MOVED_OUT
        trigger: "system event: a Subscription referencing this Resident enters CANCELLED"
        actor: system
        preconditions:
          - "Resident.status == RESIDING"
          - "CONDITIONAL CASCADE: no other Subscription with resident_id == Resident.id has status IN {PENDING_SETUP, ACTIVE, SUSPENDED, TRANSFER_PENDING}"
        side_effects:
          - "sets Resident.status = MOVED_OUT"
          - "increments Resident.version by 1"
        note: "Conditional cascade: a cancellation produced by a transfer supersede leaves the resident RESIDING because the successor subscription is ACTIVE."

  - entity: Unit
    state_field: status
    initial_state: AVAILABLE
    terminal_states: [OUT_OF_SERVICE]
    transitions:
      - from: AVAILABLE
        to: OCCUPIED
        trigger: "system event: a Subscription referencing this Unit enters ACTIVE"
        actor: system
        preconditions:
          - "Unit.status == AVAILABLE"
        side_effects:
          - "sets Unit.status = OCCUPIED"
          - "increments Unit.version by 1"
      - from: OCCUPIED
        to: AVAILABLE
        trigger: "system event: the last non-terminal Subscription referencing this Unit enters CANCELLED or VOIDED"
        actor: system
        preconditions:
          - "Unit.status == OCCUPIED"
          - "no Subscription with unit_id == Unit.id has status IN {PENDING_SETUP, ACTIVE, SUSPENDED, TRANSFER_PENDING}"
        side_effects:
          - "sets Unit.status = AVAILABLE"
          - "increments Unit.version by 1"
      - from: AVAILABLE
        to: OUT_OF_SERVICE
        trigger: "system event: the owning Property enters OFFBOARDED"
        actor: system
        preconditions:
          - "Unit.status == AVAILABLE"
        side_effects:
          - "sets Unit.status = OUT_OF_SERVICE"
          - "increments Unit.version by 1"
      - from: OCCUPIED
        to: OUT_OF_SERVICE
        trigger: "system event: the owning Property enters OFFBOARDED"
        actor: system
        preconditions:
          - "Unit.status == OCCUPIED"
        side_effects:
          - "sets Unit.status = OUT_OF_SERVICE"
          - "increments Unit.version by 1"

  - entity: FilterSku
    state_field: status
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /filter-skus/{id}/discontinue"
        actor: ProgramOperator
        preconditions:
          - "FilterSku.status == ACTIVE"
        side_effects:
          - "sets FilterSku.status = DISCONTINUED"
          - "increments FilterSku.version by 1"
        note: "Existing Subscription.assigned_sku_id links are NOT re-pointed; the stale link is surfaced by validation priority 17 on the next shipment creation."

  # ---- Subscription: PARALLEL DIMENSION 1 of 2 (commercial lifecycle) -------
  - entity: Subscription
    state_field: status
    initial_state: PENDING_SETUP
    terminal_states: [CANCELLED, VOIDED]
    note: |
      This machine evolves independently of Subscription.installation_posture (declared
      below). The two dimensions live on the same row: a subscription may be
      (ACTIVE, NON_INSTALL_CONFIRMED) or (SUSPENDED, COMPLIANT) and neither dimension
      constrains the other's transition set. Contains two cycles:
      ACTIVE -> SUSPENDED -> ACTIVE and ACTIVE -> TRANSFER_PENDING -> ACTIVE.
    transitions:
      - from: PENDING_SETUP
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/activate"
        actor: ProgramOperator | PropertyManager
        preconditions:
          - "Subscription.status == PENDING_SETUP"
          - "Property(Subscription.property_id).status == ACTIVE"
          - "FilterSku(Subscription.assigned_sku_id).status == ACTIVE"
          - "when Subscription.billing_party == PROPERTY_MANAGER: Property.outstanding_balance_cents + ENROLLMENT_FEE_CENTS + first_month_fee_cents <= Property.credit_limit_cents"
        side_effects:
          - "sets Subscription.status = ACTIVE and Subscription.activated_at = logical clock"
          - "transitions Resident(resident_id) PROSPECT -> RESIDING"
          - "transitions Unit(unit_id) AVAILABLE -> OCCUPIED"
          - "transitions every BenefitEntitlement of this subscription PENDING -> ACTIVE with effective_from = logical clock"
          - "creates Shipment #1 with status SCHEDULED, sequence_number = 1, scheduled_ship_date = logical clock date, quantity = Subscription.filters_per_shipment, sku_id = Subscription.assigned_sku_id; increments Subscription.shipment_sequence_counter to 1"
          - "recomputes Subscription.next_ship_date from the new shipment"
          - "inserts LedgerEntry(entry_type=ENROLLMENT_FEE, amount_cents=+ENROLLMENT_FEE_CENTS, source_ref_id=Subscription.id)"
          - "inserts LedgerEntry(entry_type=MONTHLY_FEE, amount_cents=+first_month_fee_cents from §1.3 first_month_fee, source_ref_id=Subscription.id)"
          - "recomputes Property.outstanding_balance_cents via §1.3 property_ledger_rollup"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: owning Property enters SUSPENDED (cascade B link 1->2)"
        actor: system
        preconditions:
          - "Subscription.status == ACTIVE"
        side_effects:
          - "sets Subscription.status = SUSPENDED"
          - "CASCADE LINK 2->3a: every Shipment of this subscription with status == SCHEDULED transitions SCHEDULED -> CANCELLED"
          - "CASCADE LINK 2->3b: every BenefitEntitlement of this subscription with state == ACTIVE AND benefit_code IN {RENTERS_INSURANCE, AIR_QUALITY_GUARANTEE} transitions ACTIVE -> SUSPENDED and sets suspended_by_property_event = true"
          - "recomputes Subscription.next_ship_date (becomes null once the SCHEDULED shipment is cancelled)"
          - "increments Subscription.version by 1"
        note: "Cascade B depth 3: Property.suspend -> Subscription.SUSPENDED -> {Shipment.CANCELLED, BenefitEntitlement.SUSPENDED}. Each link is caused by the previous link, not by the original request."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: owning Property enters ACTIVE via reactivate"
        actor: system
        preconditions:
          - "Subscription.status == SUSPENDED"
        side_effects:
          - "sets Subscription.status = ACTIVE"
          - "transitions every BenefitEntitlement of this subscription with state == SUSPENDED AND suspended_by_property_event == true back SUSPENDED -> ACTIVE and sets suspended_by_property_event = false"
          - "does NOT resurrect CANCELLED shipments and does NOT restore FORFEITED entitlements"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: TRANSFER_PENDING
        trigger: "POST /subscription-transfers"
        actor: Resident | PropertyManager
        preconditions:
          - "Subscription.status == ACTIVE"
          - "request expected_subscription_version == Subscription.version (see §1.2.1 transfer-create-stale-subscription)"
        side_effects:
          - "sets Subscription.status = TRANSFER_PENDING"
          - "creates SubscriptionTransfer with status REQUESTED"
          - "supersedes any prior SubscriptionTransfer of this subscription whose status IN {REQUESTED, SKU_REMAPPED} by transitioning it to SUPERSEDED"
          - "increments Subscription.version by 1"
      - from: TRANSFER_PENDING
        to: ACTIVE
        trigger: "POST /subscription-transfers/{id}/reject"
        actor: ProgramOperator
        preconditions:
          - "Subscription.status == TRANSFER_PENDING"
          - "SubscriptionTransfer.status IN {REQUESTED, SKU_REMAPPED}"
        side_effects:
          - "sets Subscription.status = ACTIVE (cycle closes with no fee or entitlement change)"
          - "increments Subscription.version by 1"
      - from: TRANSFER_PENDING
        to: CANCELLED
        trigger: "POST /subscription-transfers/{id}/complete (cascade C link 1->2)"
        actor: system
        preconditions:
          - "Subscription.status == TRANSFER_PENDING"
          - "SubscriptionTransfer.status == SKU_REMAPPED"
        side_effects:
          - "sets Subscription.status = CANCELLED, cancel_reason = 'TRANSFER_SUPERSEDED', cancel_effective_date = SubscriptionTransfer.effective_date"
          - "every Shipment with status == SCHEDULED transitions SCHEDULED -> CANCELLED"
          - "every BenefitEntitlement with state IN {PENDING, ACTIVE, SUSPENDED} transitions to EXPIRED with forfeit_reason = TRANSFER_SUPERSEDED"
          - "does NOT run §1.3 cancellation_settlement; transfer proration replaces it"
          - "increments Subscription.version by 1"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Resident | PropertyManager | ProgramOperator
        preconditions:
          - "Subscription.status == ACTIVE"
          - "request effective_date >= logical clock date AND effective_date <= Subscription.lease_end_date"
        side_effects:
          - "runs §1.3 cancellation_settlement and freezes gross_prorated_credit_cents, waiver_credit_pct, unreturned_fee_gross_cents, unreturned_fee_net_cents, net_settlement_cents onto the Subscription"
          - "sets Subscription.status = CANCELLED, cancel_effective_date, cancel_reason"
          - "every Shipment with status == SCHEDULED transitions SCHEDULED -> CANCELLED"
          - "every Shipment with status IN {SHIPPED, DELIVERED} transitions to RETURN_REQUESTED"
          - "every BenefitEntitlement with state IN {PENDING, ACTIVE, SUSPENDED} transitions to EXPIRED with forfeit_reason = SUBSCRIPTION_CANCELLED"
          - "inserts LedgerEntry(entry_type=PRORATION_CREDIT, amount_cents = -gross_prorated_credit_cents, source_ref_id=Subscription.id)"
          - "inserts LedgerEntry(entry_type=UNRETURNED_SHIPMENT_FEE, amount_cents = +unreturned_fee_net_cents, source_ref_id=Subscription.id, memo='cancellation unreturned reconciliation') only when unreturned_fee_net_cents > 0"
          - "recomputes Property.outstanding_balance_cents via §1.3 property_ledger_rollup"
          - "transitions Resident RESIDING -> MOVED_OUT when the conditional cascade on Resident holds"
          - "transitions Unit OCCUPIED -> AVAILABLE when no other non-terminal subscription references the unit"
          - "increments Subscription.version by 1"
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Resident | PropertyManager | ProgramOperator
        preconditions:
          - "Subscription.status == SUSPENDED"
          - "request effective_date >= logical clock date AND effective_date <= Subscription.lease_end_date"
        side_effects:
          - "identical side-effect set to ACTIVE_to_CANCELLED"
      - from: PENDING_SETUP
        to: VOIDED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: Resident | PropertyManager | ProgramOperator
        preconditions:
          - "Subscription.status == PENDING_SETUP"
        side_effects:
          - "sets Subscription.status = VOIDED, cancel_effective_date, cancel_reason"
          - "every BenefitEntitlement with state == PENDING transitions to EXPIRED with forfeit_reason = SUBSCRIPTION_VOIDED"
          - "runs NO settlement and inserts NO LedgerEntry (nothing was ever billed)"
          - "leaves Resident.status and Unit.status untouched"
          - "increments Subscription.version by 1"

  # ---- Subscription: PARALLEL DIMENSION 2 of 2 (installation compliance) ----
  - entity: Subscription
    state_field: installation_posture
    initial_state: UNVERIFIED
    terminal_states: []
    note: |
      Second independent state dimension on the same Subscription row. Contains the cycle
      NON_INSTALL_SUSPECTED -> NON_INSTALL_CONFIRMED -> REMEDIATED -> COMPLIANT and the
      short-circuit NON_INSTALL_SUSPECTED -> COMPLIANT. Never gates Subscription.status
      transitions; it gates claim settlement (§1.3 claim_settlement_amount) and entitlement
      forfeiture instead.
    transitions:
      - from: UNVERIFIED
        to: COMPLIANT
        trigger: "POST /subscriptions/{id}/non-install-evaluations with evidence_score < SUSPECT_THRESHOLD[detection_method]"
        actor: ProgramOperator
        preconditions:
          - "Subscription.installation_posture == UNVERIFIED"
          - "evidence_score computed by §1.3 non_install_evidence_score < SUSPECT_THRESHOLD[detection_method]"
        side_effects:
          - "sets Subscription.installation_posture = COMPLIANT, latest_detection_method, latest_evidence_score"
          - "creates NonInstallCase with status CLOSED_UNSUBSTANTIATED"
          - "increments Subscription.version by 1"
      - from: UNVERIFIED
        to: NON_INSTALL_SUSPECTED
        trigger: "POST /subscriptions/{id}/non-install-evaluations with evidence_score >= SUSPECT_THRESHOLD[detection_method]"
        actor: ProgramOperator
        preconditions:
          - "Subscription.installation_posture == UNVERIFIED"
          - "evidence_score computed by §1.3 non_install_evidence_score >= SUSPECT_THRESHOLD[detection_method]"
        side_effects:
          - "sets Subscription.installation_posture = NON_INSTALL_SUSPECTED, latest_detection_method, latest_evidence_score"
          - "creates NonInstallCase with status OPEN, evidence_score, suspect_threshold, confirm_threshold"
          - "increments Subscription.version by 1"
      - from: COMPLIANT
        to: NON_INSTALL_SUSPECTED
        trigger: "POST /subscriptions/{id}/non-install-evaluations with evidence_score >= SUSPECT_THRESHOLD[detection_method]"
        actor: ProgramOperator
        preconditions:
          - "Subscription.installation_posture == COMPLIANT"
          - "evidence_score >= SUSPECT_THRESHOLD[detection_method]"
        side_effects:
          - "same side-effect set as UNVERIFIED_to_NON_INSTALL_SUSPECTED"
      - from: NON_INSTALL_SUSPECTED
        to: COMPLIANT
        trigger: "POST /non-install-cases/{id}/close-unsubstantiated"
        actor: ProgramOperator
        preconditions:
          - "Subscription.installation_posture == NON_INSTALL_SUSPECTED"
          - "NonInstallCase.status IN {OPEN, NOTICE_SENT}"
        side_effects:
          - "sets Subscription.installation_posture = COMPLIANT"
          - "sets NonInstallCase.status = CLOSED_UNSUBSTANTIATED"
          - "increments Subscription.version by 1"
      - from: NON_INSTALL_SUSPECTED
        to: NON_INSTALL_CONFIRMED
        trigger: "POST /non-install-cases/{id}/confirm (cascade A link 1->2)"
        actor: system
        preconditions:
          - "Subscription.installation_posture == NON_INSTALL_SUSPECTED"
          - "NonInstallCase.status == NOTICE_SENT"
          - "NonInstallCase.evidence_score >= NonInstallCase.confirm_threshold"
        side_effects:
          - "sets Subscription.installation_posture = NON_INSTALL_CONFIRMED"
          - "CASCADE LINK 2->3: every BenefitEntitlement of this subscription with state IN {ACTIVE, SUSPENDED} AND benefit_code IN {DAMAGE_WAIVER, AIR_QUALITY_GUARANTEE} transitions to FORFEITED with forfeit_reason = NON_INSTALL_CONFIRMED"
          - "recomputes Subscription.entitled_benefit_codes and Subscription.monthly_fee_cents from the surviving entitlement set (§1.3 benefit_entitlement_set, §1.3 monthly_fee_cents)"
          - "increments Subscription.version by 1"
        note: "Cascade A links 3..5 continue on BenefitEntitlement.ACTIVE_to_FORFEITED."
      - from: NON_INSTALL_CONFIRMED
        to: REMEDIATED
        trigger: "POST /non-install-cases/{id}/remediate"
        actor: ProgramOperator | PropertyManager
        preconditions:
          - "Subscription.installation_posture == NON_INSTALL_CONFIRMED"
          - "NonInstallCase.status == ESCALATED_TO_PM"
        side_effects:
          - "sets Subscription.installation_posture = REMEDIATED"
          - "sets NonInstallCase.status = REMEDIATED and NonInstallCase.remediation_note"
          - "does NOT un-forfeit the FORFEITED entitlements (forfeiture is permanent for the subscription)"
          - "increments Subscription.version by 1"
      - from: REMEDIATED
        to: COMPLIANT
        trigger: "POST /subscriptions/{id}/non-install-evaluations with evidence_score < SUSPECT_THRESHOLD[detection_method]"
        actor: ProgramOperator
        preconditions:
          - "Subscription.installation_posture == REMEDIATED"
          - "evidence_score < SUSPECT_THRESHOLD[detection_method]"
        side_effects:
          - "sets Subscription.installation_posture = COMPLIANT (cycle closes)"
          - "creates NonInstallCase with status CLOSED_UNSUBSTANTIATED"
          - "increments Subscription.version by 1"

  - entity: Shipment
    state_field: status
    initial_state: SCHEDULED
    terminal_states: [RETURNED, UNRETURNED_WRITTEN_OFF, CANCELLED]
    note: "Branching machine: DELIVERED -> RETURN_REQUESTED forks into {RETURNED, UNRETURNED_WRITTEN_OFF} with divergent side-effect sets (no ledger movement vs a fee insert)."
    transitions:
      - from: SCHEDULED
        to: SHIPPED
        trigger: "POST /shipments/{id}/ship"
        actor: ProgramOperator
        preconditions:
          - "Shipment.status == SCHEDULED"
          - "Subscription(subscription_id).status == ACTIVE"
        side_effects:
          - "sets Shipment.status = SHIPPED, tracking_code, shipped_at = logical clock"
          - "increments Shipment.version by 1"
      - from: SHIPPED
        to: DELIVERED
        trigger: "POST /shipments/{id}/deliver"
        actor: ProgramOperator
        preconditions:
          - "Shipment.status == SHIPPED"
          - "request delivered_at >= Shipment.shipped_at"
        side_effects:
          - "sets Shipment.status = DELIVERED and Shipment.delivered_at"
          - "increments Shipment.version by 1"
      - from: DELIVERED
        to: RETURN_REQUESTED
        trigger: "POST /shipments/{id}/request-return"
        actor: ProgramOperator
        preconditions:
          - "Shipment.status == DELIVERED"
        side_effects:
          - "sets Shipment.status = RETURN_REQUESTED"
          - "increments Shipment.version by 1"
      - from: RETURN_REQUESTED
        to: RETURNED
        trigger: "POST /shipments/{id}/return"
        actor: ProgramOperator | PropertyManager
        preconditions:
          - "Shipment.status == RETURN_REQUESTED"
          - "request returned_at >= Shipment.delivered_at"
        side_effects:
          - "sets Shipment.status = RETURNED and Shipment.returned_at"
          - "inserts NO LedgerEntry (branch A of the fork carries no money movement)"
          - "increments Shipment.version by 1"
      - from: RETURN_REQUESTED
        to: UNRETURNED_WRITTEN_OFF
        trigger: "POST /shipments/{id}/write-off"
        actor: ProgramOperator
        preconditions:
          - "Shipment.status == RETURN_REQUESTED"
        side_effects:
          - "sets Shipment.status = UNRETURNED_WRITTEN_OFF and Shipment.unreturned_fee_cents = §1.3 unreturned_shipment_fee for this shipment"
          - "inserts LedgerEntry(entry_type=UNRETURNED_SHIPMENT_FEE, amount_cents = +Shipment.unreturned_fee_cents, source_ref_id = Shipment.id) (branch B of the fork)"
          - "recomputes Property.outstanding_balance_cents via §1.3 property_ledger_rollup"
          - "increments Shipment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system event: owning Subscription enters SUSPENDED, CANCELLED or VOIDED"
        actor: system
        preconditions:
          - "Shipment.status == SCHEDULED"
        side_effects:
          - "sets Shipment.status = CANCELLED"
          - "increments Shipment.version by 1"
      - from: SHIPPED
        to: RETURN_REQUESTED
        trigger: "system event: owning Subscription enters CANCELLED"
        actor: system
        preconditions:
          - "Shipment.status == SHIPPED"
        side_effects:
          - "sets Shipment.status = RETURN_REQUESTED"
          - "increments Shipment.version by 1"
      - from: DELIVERED
        to: RETURN_REQUESTED
        trigger: "system event: owning Subscription enters CANCELLED"
        actor: system
        preconditions:
          - "Shipment.status == DELIVERED"
        side_effects:
          - "sets Shipment.status = RETURN_REQUESTED"
          - "increments Shipment.version by 1"

  - entity: NonInstallCase
    state_field: status
    initial_state: OPEN
    terminal_states: [REMEDIATED, CLOSED_UNSUBSTANTIATED]
    note: |
      OPEN is the initial state for every case whose evidence_score reaches
      SUSPECT_THRESHOLD[detection_method]. An evaluation whose evidence_score falls below that
      threshold still materialises a case row for audit, but that row is written directly in the
      terminal state CLOSED_UNSUBSTANTIATED and never occupies OPEN; it therefore accepts no
      trigger at all.
    transitions:
      - from: OPEN
        to: NOTICE_SENT
        trigger: "POST /non-install-cases/{id}/send-notice"
        actor: ProgramOperator
        preconditions:
          - "NonInstallCase.status == OPEN"
        side_effects:
          - "sets NonInstallCase.status = NOTICE_SENT, notice_sent_at = logical clock, remediation_deadline = notice date + REMEDIATION_GRACE_DAYS"
          - "increments NonInstallCase.version by 1"
      - from: NOTICE_SENT
        to: ESCALATED_TO_PM
        trigger: "POST /non-install-cases/{id}/confirm"
        actor: ProgramOperator
        preconditions:
          - "NonInstallCase.status == NOTICE_SENT"
          - "NonInstallCase.evidence_score >= NonInstallCase.confirm_threshold"
        side_effects:
          - "CASCADE A LINK 1: sets NonInstallCase.status = ESCALATED_TO_PM"
          - "CASCADE A LINK 1->2: that escalation transitions Subscription.installation_posture NON_INSTALL_SUSPECTED -> NON_INSTALL_CONFIRMED"
          - "increments NonInstallCase.version by 1"
        note: "Head of transitive cascade A (depth 5): case escalation -> posture confirmed -> entitlements forfeited -> WAIVER_REVERSAL ledger entries -> property balance rollup."
      - from: OPEN
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /non-install-cases/{id}/close-unsubstantiated"
        actor: ProgramOperator
        preconditions:
          - "NonInstallCase.status == OPEN"
        side_effects:
          - "sets NonInstallCase.status = CLOSED_UNSUBSTANTIATED"
          - "transitions Subscription.installation_posture NON_INSTALL_SUSPECTED -> COMPLIANT"
          - "increments NonInstallCase.version by 1"
      - from: NOTICE_SENT
        to: CLOSED_UNSUBSTANTIATED
        trigger: "POST /non-install-cases/{id}/close-unsubstantiated"
        actor: ProgramOperator
        preconditions:
          - "NonInstallCase.status == NOTICE_SENT"
        side_effects:
          - "same side-effect set as OPEN_to_CLOSED_UNSUBSTANTIATED"
      - from: ESCALATED_TO_PM
        to: REMEDIATED
        trigger: "POST /non-install-cases/{id}/remediate"
        actor: ProgramOperator | PropertyManager
        preconditions:
          - "NonInstallCase.status == ESCALATED_TO_PM"
        side_effects:
          - "sets NonInstallCase.status = REMEDIATED and remediation_note"
          - "transitions Subscription.installation_posture NON_INSTALL_CONFIRMED -> REMEDIATED"
          - "increments NonInstallCase.version by 1"

  - entity: BenefitEntitlement
    state_field: state
    initial_state: PENDING
    terminal_states: [FORFEITED, EXPIRED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "system event: owning Subscription enters ACTIVE"
        actor: system
        preconditions:
          - "BenefitEntitlement.state == PENDING"
        side_effects:
          - "sets state = ACTIVE and effective_from = logical clock"
          - "increments BenefitEntitlement.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: owning Subscription enters SUSPENDED (cascade B link 2->3b)"
        actor: system
        preconditions:
          - "BenefitEntitlement.state == ACTIVE"
          - "benefit_code IN {RENTERS_INSURANCE, AIR_QUALITY_GUARANTEE}"
        side_effects:
          - "sets state = SUSPENDED and suspended_by_property_event = true"
          - "increments BenefitEntitlement.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system event: owning Subscription returns to ACTIVE via property reactivate"
        actor: system
        preconditions:
          - "BenefitEntitlement.state == SUSPENDED"
          - "BenefitEntitlement.suspended_by_property_event == true"
        side_effects:
          - "sets state = ACTIVE and suspended_by_property_event = false"
          - "increments BenefitEntitlement.version by 1"
      - from: ACTIVE
        to: FORFEITED
        trigger: "system event: owning Subscription.installation_posture enters NON_INSTALL_CONFIRMED (cascade A link 2->3)"
        actor: system
        preconditions:
          - "BenefitEntitlement.state == ACTIVE"
          - "benefit_code IN {DAMAGE_WAIVER, AIR_QUALITY_GUARANTEE}"
        side_effects:
          - "sets state = FORFEITED, forfeit_reason = NON_INSTALL_CONFIRMED, terminated_at = logical clock"
          - "CASCADE A LINK 3->4: that forfeiture inserts LedgerEntry(entry_type=WAIVER_REVERSAL, amount_cents = -§1.3 waiver_reversal_credit for this benefit_code, billed_party = Subscription.billing_party, source_ref_id = BenefitEntitlement.id)"
          - "CASCADE A LINK 4->5: that ledger insert recomputes Property.outstanding_balance_cents via §1.3 property_ledger_rollup"
          - "increments BenefitEntitlement.version by 1"
      - from: SUSPENDED
        to: FORFEITED
        trigger: "system event: owning Subscription.installation_posture enters NON_INSTALL_CONFIRMED"
        actor: system
        preconditions:
          - "BenefitEntitlement.state == SUSPENDED"
          - "benefit_code IN {DAMAGE_WAIVER, AIR_QUALITY_GUARANTEE}"
        side_effects:
          - "same side-effect set as ACTIVE_to_FORFEITED, and clears suspended_by_property_event to false so the reactivate cascade cannot resurrect it"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: owning Subscription enters CANCELLED"
        actor: system
        preconditions:
          - "BenefitEntitlement.state == ACTIVE"
        side_effects:
          - "sets state = EXPIRED, terminated_at = logical clock, forfeit_reason = SUBSCRIPTION_CANCELLED or TRANSFER_SUPERSEDED per the cancel cause"
          - "increments BenefitEntitlement.version by 1"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system event: owning Subscription enters CANCELLED"
        actor: system
        preconditions:
          - "BenefitEntitlement.state == SUSPENDED"
        side_effects:
          - "same side-effect set as ACTIVE_to_EXPIRED"
      - from: PENDING
        to: EXPIRED
        trigger: "system event: owning Subscription enters VOIDED"
        actor: system
        preconditions:
          - "BenefitEntitlement.state == PENDING"
        side_effects:
          - "sets state = EXPIRED, terminated_at = logical clock, forfeit_reason = SUBSCRIPTION_VOIDED"
          - "increments BenefitEntitlement.version by 1"

  - entity: Claim
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN, PAYMENT_REVERSED]
    note: |
      Cyclic machine: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW is a revision loop
      bounded by MAX_INFO_REQUEST_ROUNDS. The dual-variant settlement is anchored to the
      two ends of the loop: provisional_amount_cents is frozen on the first entry into
      UNDER_REVIEW, approved_amount_cents is computed at the decide action.
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/triage"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == SUBMITTED"
        side_effects:
          - "sets Claim.status = UNDER_REVIEW and Claim.triaged_by_user_id = X-User-ID"
          - "computes and freezes Claim.provisional_amount_cents via §1.3 claim_settlement_amount variant provisional_at_triage"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /claims/{id}/request-info"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "Claim.info_request_round < MAX_INFO_REQUEST_ROUNDS"
        side_effects:
          - "sets Claim.status = INFO_REQUESTED and increments Claim.info_request_round by 1"
          - "increments Claim.version by 1"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /claims/{id}/resubmit"
        actor: Resident | PropertyManager
        preconditions:
          - "Claim.status == INFO_REQUESTED"
        side_effects:
          - "sets Claim.status = UNDER_REVIEW (cycle closes)"
          - "does NOT recompute Claim.provisional_amount_cents; the triage-time freeze survives every loop iteration"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /claims/{id}/decide with decision == APPROVE"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "X-User-ID != Claim.triaged_by_user_id"
          - "the BenefitEntitlement of Claim.subscription_id whose benefit_code equals Claim.claim_type has state == ACTIVE at the decision instant"
        side_effects:
          - "sets Claim.status = APPROVED, Claim.decided_by_user_id = X-User-ID"
          - "computes Claim.approved_amount_cents via §1.3 claim_settlement_amount variant final_at_decision"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /claims/{id}/decide with decision == DENY"
        actor: ClaimsAdjuster
        preconditions:
          - "Claim.status == UNDER_REVIEW"
          - "X-User-ID != Claim.triaged_by_user_id"
        side_effects:
          - "sets Claim.status = DENIED, Claim.decided_by_user_id = X-User-ID, Claim.approved_amount_cents = 0"
          - "inserts NO LedgerEntry"
          - "increments Claim.version by 1"
      - from: APPROVED
        to: PAID
        trigger: "POST /claims/{id}/pay"
        actor: ProgramOperator
        preconditions:
          - "Claim.status == APPROVED"
          - "Claim.approved_amount_cents > 0"
        side_effects:
          - "sets Claim.status = PAID and Claim.paid_at = logical clock"
          - "inserts LedgerEntry(entry_type=CLAIM_PAYOUT, amount_cents = -Claim.approved_amount_cents, billed_party = Subscription.billing_party, source_ref_id = Claim.id)"
          - "recomputes Property.outstanding_balance_cents via §1.3 property_ledger_rollup"
          - "increments Claim.version by 1"
        note: "Forward leg of the §1.3 property_ledger_rollup conservation invariant."
      - from: PAID
        to: PAYMENT_REVERSED
        trigger: "POST /claims/{id}/reverse-payment"
        actor: ProgramOperator
        preconditions:
          - "Claim.status == PAID"
        side_effects:
          - "sets Claim.status = PAYMENT_REVERSED and Claim.reversal_reason"
          - "inserts LedgerEntry(entry_type=CLAIM_PAYOUT_REVERSAL, amount_cents = +Claim.approved_amount_cents, billed_party = the billed_party of the matching CLAIM_PAYOUT entry, source_ref_id = Claim.id)"
          - "recomputes Property.outstanding_balance_cents via §1.3 property_ledger_rollup"
          - "leaves Claim.approved_amount_cents unchanged so the two ledger legs sum to exactly zero"
          - "increments Claim.version by 1"
        note: "Compensating leg: property_ledger_net_cents must return to its exact pre-pay value."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /claims/{id}/withdraw"
        actor: Resident | PropertyManager
        preconditions:
          - "Claim.status == SUBMITTED"
        side_effects:
          - "sets Claim.status = WITHDRAWN"
          - "increments Claim.version by 1"
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /claims/{id}/withdraw"
        actor: Resident | PropertyManager
        preconditions:
          - "Claim.status == UNDER_REVIEW"
        side_effects:
          - "same side-effect set as SUBMITTED_to_WITHDRAWN"
      - from: INFO_REQUESTED
        to: WITHDRAWN
        trigger: "POST /claims/{id}/withdraw"
        actor: Resident | PropertyManager
        preconditions:
          - "Claim.status == INFO_REQUESTED"
        side_effects:
          - "same side-effect set as SUBMITTED_to_WITHDRAWN"

  - entity: SubscriptionTransfer
    state_field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REJECTED, SUPERSEDED]
    transitions:
      - from: REQUESTED
        to: SKU_REMAPPED
        trigger: "POST /subscription-transfers/{id}/remap-sku"
        actor: ProgramOperator
        preconditions:
          - "SubscriptionTransfer.status == REQUESTED"
          - "Unit(to_unit_id).status == AVAILABLE"
          - "§1.3 sku_selection over the destination unit yields a non-empty candidate set"
        side_effects:
          - "sets SubscriptionTransfer.status = SKU_REMAPPED and remapped_sku_id = §1.3 sku_selection winner for the destination unit"
          - "increments SubscriptionTransfer.version by 1"
      - from: SKU_REMAPPED
        to: COMPLETED
        trigger: "POST /subscription-transfers/{id}/complete"
        actor: ProgramOperator
        preconditions:
          - "SubscriptionTransfer.status == SKU_REMAPPED"
          - "Subscription(subscription_id).status == TRANSFER_PENDING"
          - "Property(Unit(to_unit_id).property_id).status == ACTIVE"
        side_effects:
          - "runs §1.3 transfer_proration and freezes proration_credit_cents, proration_charge_cents, net_adjustment_cents"
          - "CASCADE C LINK 1: sets SubscriptionTransfer.status = COMPLETED"
          - "CASCADE C LINK 1->2: mints a successor Subscription on to_unit_id with status ACTIVE, installation_posture UNVERIFIED, predecessor_subscription_id = the outgoing subscription id, assigned_sku_id = remapped_sku_id, and sets SubscriptionTransfer.successor_subscription_id"
          - "CASCADE C LINK 1->2b: transitions the outgoing Subscription TRANSFER_PENDING -> CANCELLED with cancel_reason 'TRANSFER_SUPERSEDED'"
          - "inserts LedgerEntry(entry_type=TRANSFER_ADJUSTMENT, amount_cents = net_adjustment_cents, source_ref_id = SubscriptionTransfer.id) against the successor subscription"
          - "recomputes Property.outstanding_balance_cents via §1.3 property_ledger_rollup"
          - "increments SubscriptionTransfer.version by 1"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /subscription-transfers/{id}/reject"
        actor: ProgramOperator
        preconditions:
          - "SubscriptionTransfer.status == REQUESTED"
        side_effects:
          - "sets SubscriptionTransfer.status = REJECTED and rejection_reason"
          - "transitions Subscription TRANSFER_PENDING -> ACTIVE (closing the Subscription.status cycle)"
          - "increments SubscriptionTransfer.version by 1"
      - from: SKU_REMAPPED
        to: REJECTED
        trigger: "POST /subscription-transfers/{id}/reject"
        actor: ProgramOperator
        preconditions:
          - "SubscriptionTransfer.status == SKU_REMAPPED"
        side_effects:
          - "same side-effect set as REQUESTED_to_REJECTED"
      - from: REQUESTED
        to: SUPERSEDED
        trigger: "system event: a newer SubscriptionTransfer is created for the same subscription_id"
        actor: system
        preconditions:
          - "SubscriptionTransfer.status == REQUESTED"
        side_effects:
          - "sets SubscriptionTransfer.status = SUPERSEDED"
          - "increments SubscriptionTransfer.version by 1"
      - from: SKU_REMAPPED
        to: SUPERSEDED
        trigger: "system event: a newer SubscriptionTransfer is created for the same subscription_id"
        actor: system
        preconditions:
          - "SubscriptionTransfer.status == SKU_REMAPPED"
        side_effects:
          - "sets SubscriptionTransfer.status = SUPERSEDED"
          - "increments SubscriptionTransfer.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only sanctioned
# write-write conflict mechanism; both entries are CREATE-with-supersede)
# =============================================================================
concurrency_rules:
  - rule_id: transfer-create-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /subscription-transfers"
    occ_field: "expected_subscription_version"
    description: |
      Creating a SubscriptionTransfer against a Subscription whose version has advanced
      since the client last observed it is rejected. Transfer creation legitimately
      supersedes any prior REQUESTED or SKU_REMAPPED transfer on the same subscription, so
      a create issued against a stale view would silently discard a mid-lease address
      change the client never saw. The stale-version check makes the discard explicit.
    error_id: ERR_STALE_SUBSCRIPTION_VERSION
    http_status: 412

  - rule_id: size-capture-stale-unit
    parent_entity: Unit
    write_endpoint: "POST /units/{id}/filter-size-captures"
    occ_field: "expected_unit_version"
    description: |
      Recording a filter-size capture against a Unit whose version has advanced since the
      client last observed it is rejected. A capture legitimately supersedes the unit's
      prior actual_measured_size_code and re-runs SKU mapping for every non-terminal
      subscription on the unit, so a capture written from a stale view would overwrite a
      measurement the client never observed. The stale-version check surfaces it.
    error_id: ERR_STALE_UNIT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: sku_selection
    trigger: "POST /subscriptions (initial mapping); POST /units/{id}/filter-size-captures (re-map every non-terminal subscription on the unit); POST /subscription-transfers/{id}/remap-sku (destination unit)"
    algorithm: selector_policy
    formula: |
      # (a) eligibility filter — an explicit predicate over entity fields
      target_size = Unit.actual_measured_size_code if Unit.actual_measured_size_code is not null
                    else Unit.nominal_size_code
      required_min_merv = REQUIRED_MIN_MERV_ALLERGY if Resident.allergy_flag else REQUIRED_MIN_MERV_BASE
      candidates = [ s for s in FilterSku
                     if s.status == 'ACTIVE'
                     and s.size_code == target_size
                     and s.merv_rating >= required_min_merv
                     and s.pack_quantity <= Unit.filter_slot_count + PACK_SLACK_PACKS ]
      # (b) ranking expression — cheapest adequate filtration first
      candidates.sort(key = (s.merv_rating ASC, s.unit_cost_cents ASC, s.created_at ASC))
      # (c) tie-break — created_at ASC is the final tie-break; FilterSku.id is NEVER consulted
      # (d) empty-pool fallback
      if candidates is empty: reject the request with ERR_NO_ELIGIBLE_SKU (422)
      winner = candidates[0]
    input_set: "FilterSku rows with status == ACTIVE only; DISCONTINUED rows are excluded from the candidate set even when they match the size"
    constants:
      REQUIRED_MIN_MERV_BASE: 8
      REQUIRED_MIN_MERV_ALLERGY: 11
      PACK_SLACK_PACKS: 2
    precision: "integer comparisons only; no rounding"
    variants: []

  - name: ship_cadence_days
    trigger: "POST /subscriptions; re-run on POST /units/{id}/filter-size-captures and on POST /subscription-transfers/{id}/complete (successor subscription)"
    algorithm: threshold
    formula: |
      base            = BASE_CADENCE_BY_SYSTEM[Unit.hvac_system_type]
      thickness_bonus = 30 if FilterSku.thickness_inches >= 4
                        else (15 if FilterSku.thickness_inches >= 2 else 0)
      load_points     = 0
      load_points    += 1 if Resident.household_size >= 4     # inclusive >=, not >
      load_points    += 1 if Resident.household_size >= 6     # cumulative with the >=4 point
      load_points    += 2 if Resident.has_pets
      load_points    += 1 if Resident.smoker
      load_points    += 1 if Resident.allergy_flag
      raw             = base + thickness_bonus - LOAD_PENALTY_DAYS_PER_POINT * load_points
      clamped         = max(CADENCE_FLOOR_DAYS, min(CADENCE_CEILING_DAYS, raw))
      # snap DOWN to the logistics grid AFTER clamping, then re-apply the floor
      ship_cadence_days = max(CADENCE_FLOOR_DAYS,
                              CADENCE_GRID_DAYS * floor(clamped / CADENCE_GRID_DAYS))
    input_set: "the Unit referenced by Subscription.unit_id, the Resident referenced by Subscription.resident_id, and the FilterSku selected by sku_selection in the same request"
    constants:
      BASE_CADENCE_BY_SYSTEM: { SINGLE_STAGE: 90, TWO_STAGE: 75, VARIABLE_SPEED: 60, HEAT_PUMP: 60 }
      LOAD_PENALTY_DAYS_PER_POINT: 10
      CADENCE_FLOOR_DAYS: 30
      CADENCE_CEILING_DAYS: 120
      CADENCE_GRID_DAYS: 15
    precision: "integer days; the grid snap is floor (never round, never ceil)"
    variants: []

  - name: filters_per_shipment
    trigger: "POST /subscriptions; re-run whenever sku_selection re-runs"
    algorithm: aggregation
    formula: |
      filters_per_shipment = ceil(Unit.filter_slot_count / FilterSku.pack_quantity)
                             * FilterSku.pack_quantity
    input_set: "the Unit referenced by Subscription.unit_id and the FilterSku selected by sku_selection"
    constants: {}
    precision: "integer; ceil applies to the pack count, then multiplies back up to whole filters"
    variants: []

  - name: benefit_entitlement_set
    trigger: "POST /subscriptions (initial set); recomputed when Subscription.installation_posture enters NON_INSTALL_CONFIRMED"
    algorithm: constraint_propagation
    formula: |
      codes  = set(TIER_CODES[Property.benefit_tier])
      codes |= {'DAMAGE_WAIVER'}           if Property.damage_waiver_enabled else {}
      codes |= {'AIR_QUALITY_GUARANTEE'}   if Property.aqg_enabled           else {}
      # payer/billing-mode interaction: renters insurance only rides along when the payer
      # matches the property's default billing mode
      codes -= {'RENTERS_INSURANCE'} if (Subscription.billing_party == 'RESIDENT'
                                        and Property.billing_mode == 'PM_BILLED') else {}
      # recomputation after a confirmed non-install drops the forfeited riders
      codes -= {'DAMAGE_WAIVER', 'AIR_QUALITY_GUARANTEE'} if
               Subscription.installation_posture == 'NON_INSTALL_CONFIRMED' else {}
      Subscription.entitled_benefit_codes = sorted(codes)   # ascending lexicographic
      # one BenefitEntitlement row per surviving code; rows whose code left the set are NOT
      # deleted — they are transitioned to FORFEITED/EXPIRED by §1.2
    input_set: "the Property reached through Subscription.property_id and the Subscription's own billing_party and installation_posture"
    constants:
      TIER_CODES:
        BASIC: [CREDIT_REPORTING]
        PLUS: [CREDIT_REPORTING, RENTERS_INSURANCE]
        PREMIUM: [CREDIT_REPORTING, RENTERS_INSURANCE, AIR_QUALITY_GUARANTEE]
    precision: "set-valued; serialized as a lexicographically ascending array of enum strings"
    variants: []

  - name: monthly_fee_cents
    trigger: "POST /subscriptions; recomputed whenever sku_selection, ship_cadence_days, or benefit_entitlement_set changes for the subscription"
    algorithm: tiered_pricing
    formula: |
      # ---- COMBINATORIAL MODE (b): NESTED ROUNDING WHERE ORDER MATTERS ----------
      # This scaffold PINS "round each of the three annual components to whole cents
      # AFTER dividing by 12, THEN sum the three rounded monthlies".
      # The rejected alternative ("sum the three annual components, divide by 12, round
      # once") produces a DIFFERENT cent for most inputs and MUST NOT be implemented.
      q                     = Subscription.filters_per_shipment
      shipments_per_year    = 365 / Subscription.ship_cadence_days   # EXACT rational, never rounded
      per_ship_weight_oz    = FilterSku.ship_weight_oz * q
      weight_surcharge      = max(0, per_ship_weight_oz - WEIGHT_FREE_OZ) * WEIGHT_SURCHARGE_CENTS_PER_OZ
      annual_filter_cents   = FilterSku.unit_cost_cents * q * shipments_per_year * (1 + MARKUP_PCT)
      annual_logistics_cents= (SHIP_HANDLING_CENTS + weight_surcharge) * shipments_per_year
      annual_benefit_cents  = sum(BENEFIT_ANNUAL_CENTS[c] for c in Subscription.entitled_benefit_codes)
      # three INDEPENDENT round_half_up calls, then one integer addition
      m_filter   = round_half_up(annual_filter_cents    / 12)
      m_logistics= round_half_up(annual_logistics_cents / 12)
      m_benefit  = round_half_up(annual_benefit_cents   / 12)
      monthly_fee_cents = m_filter + m_logistics + m_benefit
    input_set: "the FilterSku referenced by Subscription.assigned_sku_id, the subscription's own cadence and filters_per_shipment, and the CURRENT Subscription.entitled_benefit_codes (post-forfeiture after a confirmed non-install)"
    constants:
      MARKUP_PCT: 0.35
      SHIP_HANDLING_CENTS: 495
      WEIGHT_FREE_OZ: 32
      WEIGHT_SURCHARGE_CENTS_PER_OZ: 6
      BENEFIT_ANNUAL_CENTS: { CREDIT_REPORTING: 3600, RENTERS_INSURANCE: 15600, DAMAGE_WAIVER: 7200, AIR_QUALITY_GUARANTEE: 4800 }
      DAYS_PER_YEAR: 365
    precision: "whole cents, round_half_up, applied per component (three times) and never to the sum"
    variants: []

  - name: first_month_fee_cents
    trigger: "POST /subscriptions/{id}/activate"
    algorithm: aggregation
    formula: |
      activation_date  = logical clock date (UTC)
      days_in_period   = number of days in the calendar month containing activation_date
      billable_days    = days_in_period - activation_date.day + 1   # activation day is billable
      first_month_fee_cents = round_half_up(Subscription.monthly_fee_cents
                                            * billable_days / days_in_period)
    input_set: "the activating Subscription's monthly_fee_cents and the logical clock date"
    constants:
      ENROLLMENT_FEE_CENTS: 2500
    precision: "whole cents, round_half_up, single rounding at the end"
    variants: []

  - name: non_install_evidence_score
    trigger: "POST /subscriptions/{id}/non-install-evaluations"
    algorithm: weighted_scoring
    formula: |
      # ---- DUAL VARIANT #1 (entity domain: Subscription / Unit telemetry) --------
      # The request's detection_method selects the variant. The two variants read
      # DIFFERENT evidence about the SAME physical fact ("did the resident install the
      # filters we shipped?") and produce DIFFERENT integer scores AND different
      # confirmation thresholds for the same subscription state.
      dispatch on request detection_method -> see `variants:` below
    input_set: |
      RUNTIME_ANALYTICS: RuntimeReading rows with unit_id == Subscription.unit_id AND
        window_start >= the delivered_at of the Shipment with the greatest delivered_at
        among shipments of this subscription whose status IN {DELIVERED, RETURN_REQUESTED,
        RETURNED, UNRETURNED_WRITTEN_OFF} (tie-break: greatest created_at), ordered by
        window_start ASC then created_at ASC.
      RENEWAL_SURVEY: exactly one row — the RenewalSurvey of this subscription with the
        greatest submitted_at (tie-break: greatest created_at).
    constants:
      RUNTIME_EXPECTED_MINUTES_PER_DAY: 480
      PRESSURE_DRIFT_SATURATION_PCT: 0.25
      PRESSURE_WEIGHT: 0.6
      RUNTIME_WEIGHT: 0.4
      SUSPECT_THRESHOLD: { RUNTIME_ANALYTICS: 40, RENEWAL_SURVEY: 55 }
      CONFIRM_THRESHOLD: { RUNTIME_ANALYTICS: 60, RENEWAL_SURVEY: 80 }
      SURVEY_NOT_INSTALLED_POINTS: 70
      SURVEY_EXCESS_POINTS_PER_FILTER: 10
      SURVEY_EXCESS_POINTS_MAX_FILTERS: 3
      SURVEY_STALE_CHANGE_POINTS: 15
      SURVEY_STALE_CHANGE_MULTIPLIER: 2
      REMEDIATION_GRACE_DAYS: 21
    precision: "the weighted sum is evaluated in exact rational arithmetic, clamped to [0,1], multiplied by 100 and rounded once with round_half_up to an integer 0..100"
    variants:
      - name: runtime_analytics
        when: "request detection_method == RUNTIME_ANALYTICS"
        difference: |
          first        = readings[0]; last = readings[-1]
          window_days  = (last.window_end - first.window_start) in exact days (fractional allowed)
          total_runtime= sum(r.runtime_minutes for r in readings)
          drift_pct    = (last.static_pressure_delta_pa - first.static_pressure_delta_pa)
                         / first.static_pressure_delta_pa
          drift_term   = min(1, max(0, drift_pct / PRESSURE_DRIFT_SATURATION_PCT))
          runtime_term = min(1, total_runtime / (RUNTIME_EXPECTED_MINUTES_PER_DAY * window_days))
          raw          = PRESSURE_WEIGHT * drift_term + RUNTIME_WEIGHT * runtime_term
          evidence_score = round_half_up(100 * min(1, max(0, raw)))
          Requires at least 2 readings in the window, else ERR_NO_EVIDENCE_FOR_METHOD.
          Confirmation threshold is 60.
      - name: renewal_survey
        when: "request detection_method == RENEWAL_SURVEY"
        difference: |
          survey            = the single latest RenewalSurvey (see input_set)
          delivered_filters = sum(Shipment.quantity) over shipments of this subscription with
                              status IN {DELIVERED, RETURN_REQUESTED, RETURNED, UNRETURNED_WRITTEN_OFF}
          expected_on_hand  = max(0, delivered_filters - Subscription.filters_per_shipment)
          score  = 0
          score += SURVEY_NOT_INSTALLED_POINTS if survey.installed_last_shipment == false
          excess = max(0, survey.filters_on_hand_count - expected_on_hand)
          score += SURVEY_EXCESS_POINTS_PER_FILTER * min(SURVEY_EXCESS_POINTS_MAX_FILTERS, excess)
          score += SURVEY_STALE_CHANGE_POINTS if survey.self_reported_change_date is null
                   or survey.self_reported_change_date
                      < logical_clock_date - SURVEY_STALE_CHANGE_MULTIPLIER * Subscription.ship_cadence_days days
          evidence_score = min(100, score)
          Requires at least 1 survey, else ERR_NO_EVIDENCE_FOR_METHOD.
          Confirmation threshold is 80 — a score that confirms under RUNTIME_ANALYTICS may
          be merely suspicious under RENEWAL_SURVEY.

  - name: claim_settlement_amount
    trigger: "POST /claims/{id}/triage (variant provisional_at_triage -> Claim.provisional_amount_cents); POST /claims/{id}/decide with decision == APPROVE (variant final_at_decision -> Claim.approved_amount_cents)"
    algorithm: waterfall_allocation
    formula: |
      # ---- DUAL VARIANT #2 (entity domain: Claim settlement accounting) ----------
      # Both variants read the SAME Claim row and the SAME Subscription; they differ in
      # (i) WHEN the entitlement/posture snapshot is taken and (ii) whether the
      # non-install haircut applies. For a claim triaged while the subscription is
      # COMPLIANT and decided after the posture became NON_INSTALL_SUSPECTED, the two
      # variants produce DIFFERENT cents for identical inputs.
      # Shared base by claim_type:
      if Claim.claim_type == 'DAMAGE_WAIVER':
          base = min(max(0, Claim.requested_amount_cents - DAMAGE_WAIVER_DEDUCTIBLE_CENTS),
                     DAMAGE_WAIVER_PER_INCIDENT_CAP_CENTS)
      else:  # AIR_QUALITY_GUARANTEE
          months_elapsed  = floor((Claim.incident_date - date(Subscription.activated_at)) in days
                                  / AQG_DAYS_PER_MONTH)
          months_covered  = min(AQG_MONTHS_CAP, max(0, months_elapsed))
          entitled        = Subscription.monthly_fee_cents * months_covered
          base            = min(Claim.requested_amount_cents, entitled)
      # then the variant-specific step below
    input_set: "the Claim row, the Subscription reached through Claim.subscription_id, and the BenefitEntitlement of that subscription whose benefit_code == Claim.claim_type"
    constants:
      DAMAGE_WAIVER_DEDUCTIBLE_CENTS: 5000
      DAMAGE_WAIVER_PER_INCIDENT_CAP_CENTS: 30000
      AQG_MONTHS_CAP: 12
      AQG_DAYS_PER_MONTH: 30
      NON_INSTALL_HAIRCUT_PCT: 0.50
    precision: "whole cents, round_half_up, one rounding applied to the haircut multiplication only"
    variants:
      - name: provisional_at_triage
        when: "computed by POST /claims/{id}/triage and frozen into Claim.provisional_amount_cents; never recomputed by the INFO_REQUESTED loop"
        difference: |
          Uses Subscription.monthly_fee_cents as it stands at the triage instant and applies
          NO non-install haircut regardless of Subscription.installation_posture.
          provisional_amount_cents = base
      - name: final_at_decision
        when: "computed by POST /claims/{id}/decide with decision == APPROVE"
        difference: |
          Re-reads Subscription.monthly_fee_cents and Subscription.installation_posture at
          the decision instant and applies the haircut when the posture is
          NON_INSTALL_SUSPECTED:
            haircut = NON_INSTALL_HAIRCUT_PCT if Subscription.installation_posture == 'NON_INSTALL_SUSPECTED' else 0
            approved_amount_cents = round_half_up(base * (1 - haircut))
          A posture of NON_INSTALL_CONFIRMED does NOT reach this formula at all: the
          matching BenefitEntitlement is already FORFEITED, so validation priority 17
          rejects the approval with ERR_BENEFIT_NOT_ENTITLED.

  - name: unreturned_shipment_fee
    trigger: "POST /shipments/{id}/write-off (per-shipment fee); consumed by cancellation_settlement step 2"
    algorithm: threshold
    formula: |
      unreturned_fee_cents = min(FilterSku(Shipment.sku_id).unit_cost_cents * Shipment.quantity,
                                 UNRETURNED_FEE_CAP_CENTS)
    input_set: "the Shipment row and the FilterSku snapshot referenced by Shipment.sku_id (NOT the subscription's current assigned_sku_id)"
    constants:
      UNRETURNED_FEE_CAP_CENTS: 2500
    precision: "whole cents, no rounding required (integer multiply then min)"
    variants: []

  - name: cancellation_settlement
    trigger: "POST /subscriptions/{id}/cancel from status ACTIVE or SUSPENDED; previewed read-only by GET /subscriptions/{id}/settlement"
    algorithm: waterfall_allocation
    formula: |
      # ---- COMBINATORIAL MODE (c): CIRCULAR-LOOKING DEPENDENCY, ORDER PINNED ------
      # The waiver-relief percentage is keyed on the CREDIT TIER (step 1's output), and the
      # net settlement then subtracts the relieved fee. A reader may be tempted to key the
      # tier on net_settlement_cents (step 5) — that is a genuine circularity and is
      # FORBIDDEN. Evaluation order is exactly 1 -> 2 -> 3 -> 4 -> 5, single pass, no
      # fixed-point iteration.
      #
      # STEP 1 — prorated credit for the unused remainder of the current billing month
      period_start   = first day of the calendar month containing request effective_date
      days_in_period = number of days in that calendar month
      used_days      = effective_date.day - 1          # service consumed through the prior day
      unused_days    = days_in_period - used_days
      gross_prorated_credit_cents = round_half_up(Subscription.monthly_fee_cents
                                                  * unused_days / days_in_period)
      #
      # STEP 2 — gross unreturned exposure, explicit status filter, no ordering sensitivity
      exposed = [ sh for sh in Shipment where sh.subscription_id == Subscription.id
                  and sh.status IN {SHIPPED, DELIVERED, RETURN_REQUESTED} ]
      unreturned_fee_gross_cents = sum( min(FilterSku(sh.sku_id).unit_cost_cents * sh.quantity,
                                            UNRETURNED_FEE_CAP_CENTS) for sh in exposed )
      # SCHEDULED, CANCELLED, RETURNED and UNRETURNED_WRITTEN_OFF shipments are EXCLUDED
      #
      # STEP 3 — waiver relief tier, keyed ONLY on step 1's output
      waiver_credit_pct = WAIVER_CREDIT_TIERS lookup on gross_prorated_credit_cents:
          gross <  1000                  -> 0.00
          1000 <= gross <  5000           -> 0.25
          5000 <= gross < 10000           -> 0.50
          gross >= 10000                 -> 0.75
      #
      # STEP 4 — relieved fee, one rounding
      unreturned_fee_net_cents = round_half_up(unreturned_fee_gross_cents
                                               * (1 - waiver_credit_pct))
      #
      # STEP 5 — net settlement (may be negative: the resident/PM owes the program)
      net_settlement_cents = gross_prorated_credit_cents - unreturned_fee_net_cents
    input_set: "the Subscription's frozen monthly_fee_cents, all Shipment rows of the subscription filtered to status IN {SHIPPED, DELIVERED, RETURN_REQUESTED}, and the FilterSku snapshot on each such shipment"
    constants:
      UNRETURNED_FEE_CAP_CENTS: 2500
      WAIVER_CREDIT_TIERS: [{ min_cents: 0, pct: 0.00 }, { min_cents: 1000, pct: 0.25 }, { min_cents: 5000, pct: 0.50 }, { min_cents: 10000, pct: 0.75 }]
    precision: "whole cents; exactly two round_half_up calls, at step 1 and step 4; step 5 is integer subtraction"
    variants: []

  - name: transfer_proration
    trigger: "POST /subscription-transfers/{id}/complete"
    algorithm: chronological
    formula: |
      # STEP 1 — credit the outgoing subscription for the remainder of the month
      period_start   = first day of the calendar month containing SubscriptionTransfer.effective_date
      days_in_period = number of days in that calendar month
      remaining_days = days_in_period - (effective_date.day - 1)
      proration_credit_cents = round_half_up(outgoing.monthly_fee_cents
                                             * remaining_days / days_in_period)
      # STEP 2 — charge the successor subscription for the same remainder, at ITS OWN fee
      # (the successor's monthly_fee_cents is computed first: sku_selection ->
      #  ship_cadence_days -> filters_per_shipment -> benefit_entitlement_set ->
      #  monthly_fee_cents against the DESTINATION unit and its property)
      proration_charge_cents = round_half_up(successor.monthly_fee_cents
                                             * remaining_days / days_in_period)
      # STEP 3 — single signed ledger movement; the two legs are NEVER posted separately
      net_adjustment_cents = proration_charge_cents - proration_credit_cents
    input_set: "the outgoing Subscription's frozen monthly_fee_cents, the successor Subscription's freshly computed monthly_fee_cents, and SubscriptionTransfer.effective_date"
    constants: {}
    precision: "whole cents; two independent round_half_up calls (steps 1 and 2), then integer subtraction — the difference is NEVER computed on unrounded values"
    variants: []

  - name: waiver_reversal_credit
    trigger: "system event: a BenefitEntitlement transitions to FORFEITED with forfeit_reason == NON_INSTALL_CONFIRMED (cascade A link 3->4)"
    algorithm: aggregation
    formula: |
      confirm_date   = logical clock date (UTC)
      days_in_period = number of days in the calendar month containing confirm_date
      remaining_days = days_in_period - confirm_date.day + 1     # confirm day is refunded
      waiver_reversal_credit_cents = round_half_up(
          (BENEFIT_ANNUAL_CENTS[BenefitEntitlement.benefit_code] / 12)
          * remaining_days / days_in_period )
      # the LedgerEntry amount_cents is the NEGATIVE of this value (a credit)
    input_set: "one calculation per forfeited BenefitEntitlement row; rows are processed in ascending benefit_code order so the ledger insert order is deterministic"
    constants:
      BENEFIT_ANNUAL_CENTS: { CREDIT_REPORTING: 3600, RENTERS_INSURANCE: 15600, DAMAGE_WAIVER: 7200, AIR_QUALITY_GUARANTEE: 4800 }
    precision: "whole cents, round_half_up, one rounding per forfeited row (never a single rounding over the summed rows)"
    variants: []

  - name: property_ledger_rollup
    trigger: "every LedgerEntry insert (ENROLLMENT_FEE, MONTHLY_FEE, PRORATION_CREDIT, UNRETURNED_SHIPMENT_FEE, WAIVER_REVERSAL, CLAIM_PAYOUT, CLAIM_PAYOUT_REVERSAL, TRANSFER_ADJUSTMENT)"
    algorithm: aggregation
    formula: |
      # (a) source entity + explicit status filter, (b) window, (c) tie-break
      property_ledger_net_cents(P) = SUM(le.amount_cents)
        over every LedgerEntry le WHERE le.billed_party == 'PROPERTY_MANAGER'
        AND Subscription(le.subscription_id).property_id == P.id
        AND le.created_at <= now (i.e. all entries ever inserted; the ledger is append-only
            and entries are never deleted, so the window is unbounded on both ends)
      # sum of integers is order-independent, so no tie-break is needed for the value;
      # for reproducible ledger LISTING order, entries sort by (created_at ASC, period_start ASC)
      Property.outstanding_balance_cents = property_ledger_net_cents(P)
      # CONSERVATION INVARIANT (conserved quantity #1 — MONEY):
      # for every forward/compensating pair {CLAIM_PAYOUT, CLAIM_PAYOUT_REVERSAL} on the
      # same Claim.id, property_ledger_net_cents(P) after the reversal MUST equal its exact
      # value before the payout, because amount_cents(payout) + amount_cents(reversal) == 0.
    input_set: "all LedgerEntry rows with billed_party == PROPERTY_MANAGER whose subscription resolves to this property; RESIDENT-billed entries never enter the property balance"
    constants: {}
    precision: "integer cents; no rounding (all inputs are already whole cents)"
    variants: []

  - name: entitlement_active_census
    trigger: "read-only invariant evaluated over GET /subscriptions/{id}/benefit-entitlements; asserted across the Property suspend / reactivate pair"
    algorithm: aggregation
    formula: |
      # CONSERVATION INVARIANT (conserved quantity #2 — ENTITLEMENT SET, not money):
      entitlement_active_census(S) =
        COUNT(BenefitEntitlement be WHERE be.subscription_id == S.id AND be.state == 'ACTIVE')
      entitlement_total_census(S) =
        COUNT(BenefitEntitlement be WHERE be.subscription_id == S.id)
      # partition identity that must hold at every observable instant:
      entitlement_total_census(S) == count(state=PENDING) + count(state=ACTIVE)
                                     + count(state=SUSPENDED) + count(state=FORFEITED)
                                     + count(state=EXPIRED)
      # PAIR INVARIANT: POST /properties/{id}/suspend followed by
      # POST /properties/{id}/reactivate MUST leave entitlement_active_census(S) and the
      # exact SET of ACTIVE benefit_code values identical to their pre-suspend values,
      # because the reactivate cascade restores exactly the rows carrying
      # suspended_by_property_event == true. Rows already FORFEITED before the suspend are
      # terminal and MUST NOT reappear in the ACTIVE set — that reappearance is the drift
      # this invariant detects.
    input_set: "all BenefitEntitlement rows with subscription_id == S.id, no status filter for the total census and state == ACTIVE for the active census"
    constants: {}
    precision: "integer counts; set comparison is on the sorted benefit_code array"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST rule
# that fails determines the response error_id — no rule below it is evaluated)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the four §1.7 roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's §1.5 roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every resource referenced by the request exists, validated path segments left-to-right first, then body foreign keys in the order they are declared in §1.5 input"
    error_id: "ERR_PROPERTY_NOT_FOUND | ERR_UNIT_NOT_FOUND | ERR_SKU_NOT_FOUND | ERR_RESIDENT_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_SHIPMENT_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_TRANSFER_NOT_FOUND | ERR_ENTITLEMENT_NOT_FOUND"
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: |
      Ownership scope for entity_backed roles. PropertyManager (X-User-ID == Property.id):
      the target resource must resolve to that property through
      Unit.property_id / Subscription.property_id. Resident (X-User-ID == Resident.id):
      the target resource must resolve to that resident through Subscription.resident_id.
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose §1.5 roles include PropertyManager or Resident"

  - priority: 5
    category: business_constraint
    check: "request body is well-formed: every required §1.5 input field present, enum members recognized, integers within their §1.1 constraints, date-only fields match YYYY-MM-DD, instants match ISO 8601 UTC ending in 'Z' with an OPTIONAL fractional-second part of one to six digits (both 2026-08-01T00:00:00Z and 2026-08-01T00:00:00.000Z are accepted and denote the same instant)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_constraint
    check: "list query parameters are valid: limit within [1,100], offset >= 0, filter values are recognized enum members"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "all GET list endpoints"

  - priority: 7
    category: state
    check: "OCC — the request's expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_SUBSCRIPTION_VERSION | ERR_STALE_UNIT_VERSION"
    http_status: 412
    applies_to: "POST /subscription-transfers, POST /units/{id}/filter-size-captures"

  - priority: 8
    category: state
    check: "the Property reached from the target resource has status == ACTIVE (unit creation is deliberately NOT covered: a property must already hold at least one unit before it can be activated)"
    error_id: ERR_PROPERTY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /subscriptions, POST /subscriptions/{id}/activate, POST /subscription-transfers/{id}/complete"

  - priority: 9
    category: state
    check: "Subscription.status is in the set the requested transition allows (see §1.2 Subscription.status)"
    error_id: ERR_SUBSCRIPTION_STATE_INVALID
    http_status: 409
    applies_to: "POST /subscriptions/{id}/activate, POST /subscriptions/{id}/cancel, POST /subscriptions/{id}/shipments, POST /subscriptions/{id}/renewal-surveys, POST /subscriptions/{id}/non-install-evaluations, POST /subscription-transfers, POST /claims"

  - priority: 10
    category: state
    check: "Shipment.status is in the set the requested transition allows (see §1.2 Shipment)"
    error_id: ERR_SHIPMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /shipments/{id}/ship, POST /shipments/{id}/deliver, POST /shipments/{id}/request-return, POST /shipments/{id}/return, POST /shipments/{id}/write-off"

  - priority: 11
    category: state
    check: "Claim.status is in the set the requested transition allows (see §1.2 Claim)"
    error_id: ERR_CLAIM_STATE_INVALID
    http_status: 409
    applies_to: "POST /claims/{id}/triage, POST /claims/{id}/request-info, POST /claims/{id}/resubmit, POST /claims/{id}/decide, POST /claims/{id}/pay, POST /claims/{id}/reverse-payment, POST /claims/{id}/withdraw"

  - priority: 12
    category: state
    check: "NonInstallCase.status is in the set the requested transition allows (see §1.2 NonInstallCase)"
    error_id: ERR_CASE_STATE_INVALID
    http_status: 409
    applies_to: "POST /non-install-cases/{id}/send-notice, POST /non-install-cases/{id}/confirm, POST /non-install-cases/{id}/remediate, POST /non-install-cases/{id}/close-unsubstantiated"

  - priority: 13
    category: state
    check: "SubscriptionTransfer.status is in the set the requested transition allows (see §1.2 SubscriptionTransfer)"
    error_id: ERR_TRANSFER_STATE_INVALID
    http_status: 409
    applies_to: "POST /subscription-transfers/{id}/remap-sku, POST /subscription-transfers/{id}/complete, POST /subscription-transfers/{id}/reject"

  - priority: 14
    category: business_safety
    check: "segregation of duties — the acting ClaimsAdjuster X-User-ID must differ from Claim.triaged_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 422
    applies_to: "POST /claims/{id}/decide"

  - priority: 15
    category: business_safety
    check: "NonInstallCase.evidence_score >= NonInstallCase.confirm_threshold"
    error_id: ERR_EVIDENCE_BELOW_CONFIRM_THRESHOLD
    http_status: 422
    applies_to: "POST /non-install-cases/{id}/confirm"

  - priority: 16
    category: business_safety
    check: "the chosen detection_method has evidence: RUNTIME_ANALYTICS needs >= 2 RuntimeReading rows in the §1.3 window, RENEWAL_SURVEY needs >= 1 RenewalSurvey row"
    error_id: ERR_NO_EVIDENCE_FOR_METHOD
    http_status: 422
    applies_to: "POST /subscriptions/{id}/non-install-evaluations"

  - priority: 17
    category: business_referential
    check: "the BenefitEntitlement of the claim's subscription whose benefit_code equals the claim_type exists with state == ACTIVE (evaluated at submission on POST /claims and re-evaluated at the decision instant on an APPROVE decision)"
    error_id: ERR_BENEFIT_NOT_ENTITLED
    http_status: 422
    applies_to: "POST /claims, POST /claims/{id}/decide"

  - priority: 18
    category: business_temporal
    check: "Claim.incident_date is within the coverage window: incident_date >= date(Subscription.activated_at) AND incident_date <= logical clock date AND (logical clock date - incident_date) <= CLAIM_FILING_WINDOW_DAYS (60)"
    error_id: ERR_OUTSIDE_COVERAGE_WINDOW
    http_status: 422
    applies_to: "POST /claims"

  - priority: 19
    category: business_referential
    check: "FilterSku(Subscription.assigned_sku_id).status == ACTIVE"
    error_id: ERR_SKU_DISCONTINUED
    http_status: 422
    applies_to: "POST /subscriptions/{id}/activate, POST /subscriptions/{id}/shipments"

  - priority: 20
    category: business_constraint
    check: "§1.3 sku_selection yields a non-empty candidate set for the target unit"
    error_id: ERR_NO_ELIGIBLE_SKU
    http_status: 422
    applies_to: "POST /subscriptions, POST /units/{id}/filter-size-captures, POST /subscription-transfers/{id}/remap-sku"

  - priority: 21
    category: business_constraint
    check: "no other Subscription with the same (unit_id, resident_id) pair has status IN {PENDING_SETUP, ACTIVE, SUSPENDED, TRANSFER_PENDING}"
    error_id: ERR_DUPLICATE_ACTIVE_SUBSCRIPTION
    http_status: 409
    applies_to: "POST /subscriptions"

  - priority: 22
    category: business_temporal
    check: |
      RESOURCE TEMPORAL OVERLAP #1 — Unit occupancy, CLOSED intervals plus a mandatory
      turnover buffer. For every existing Subscription E on the same unit_id with status IN
      {PENDING_SETUP, ACTIVE, SUSPENDED, TRANSFER_PENDING}, the new interval
      [lease_start_date, lease_end_date] must satisfy
      new.lease_start_date > E.lease_end_date + TURNOVER_BUFFER_DAYS
      OR new.lease_end_date + TURNOVER_BUFFER_DAYS < E.lease_start_date.
      Both edges are INCLUSIVE and a gap of exactly TURNOVER_BUFFER_DAYS (3) still
      conflicts; the first legal start is E.lease_end_date + 4 days.
    error_id: ERR_UNIT_OCCUPANCY_CONFLICT
    http_status: 409
    applies_to: "POST /subscriptions, POST /subscription-transfers"

  - priority: 23
    category: business_temporal
    check: |
      RESOURCE TEMPORAL OVERLAP #2 — Subscription cadence occupation, HALF-OPEN interval
      with NO buffer. Let L be the Shipment of this subscription with the greatest
      scheduled_ship_date whose status IN {SCHEDULED, SHIPPED, DELIVERED, RETURN_REQUESTED,
      RETURNED, UNRETURNED_WRITTEN_OFF} (tie-break: greatest created_at). The requested
      scheduled_ship_date is rejected when it lies in the half-open window
      [L.scheduled_ship_date, L.scheduled_ship_date + Subscription.ship_cadence_days).
      Adjacency is LEGAL: a date exactly L.scheduled_ship_date + ship_cadence_days is
      accepted (gap of zero days between consecutive cadence windows).
    error_id: ERR_SHIPMENT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /subscriptions/{id}/shipments"

  - priority: 24
    category: business_constraint
    check: "Claim.info_request_round < MAX_INFO_REQUEST_ROUNDS (2)"
    error_id: ERR_INFO_REQUEST_LIMIT
    http_status: 422
    applies_to: "POST /claims/{id}/request-info"

  - priority: 25
    category: business_temporal
    check: "SubscriptionTransfer.effective_date >= logical clock date AND effective_date within [Subscription.lease_start_date, Subscription.lease_end_date]"
    error_id: ERR_TRANSFER_DATE_INVALID
    http_status: 422
    applies_to: "POST /subscription-transfers"

  - priority: 26
    category: business_constraint
    check: "to_unit_id != Subscription.unit_id AND Unit(to_unit_id).status == AVAILABLE"
    error_id: ERR_TRANSFER_TARGET_INVALID
    http_status: 422
    applies_to: "POST /subscription-transfers, POST /subscription-transfers/{id}/remap-sku"

  - priority: 27
    category: business_temporal
    check: "cancel effective_date >= logical clock date AND effective_date <= Subscription.lease_end_date (skipped when Subscription.status == PENDING_SETUP, which voids instead of settling)"
    error_id: ERR_CANCEL_DATE_INVALID
    http_status: 422
    applies_to: "POST /subscriptions/{id}/cancel"

  - priority: 28
    category: business_constraint
    check: "RuntimeReading window is non-degenerate: window_end > window_start AND static_pressure_delta_pa > 0"
    error_id: ERR_INVALID_RUNTIME_WINDOW
    http_status: 422
    applies_to: "POST /units/{id}/runtime-readings"

  - priority: 29
    category: business_fiscal
    check: "Claim.requested_amount_cents <= CLAIM_REQUEST_HARD_CAP_CENTS (100000)"
    error_id: ERR_CLAIM_AMOUNT_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /claims"

  - priority: 30
    category: business_fiscal
    check: "for PROPERTY_MANAGER-billed subscriptions at a PM_BILLED property: Property.outstanding_balance_cents + the charge this request would post <= Property.credit_limit_cents"
    error_id: ERR_PROPERTY_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /subscriptions/{id}/activate, POST /subscription-transfers/{id}/complete"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- logical clock (test-driving surface, §1.5 ladder rung 3) --------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint every date/deadline/window rule reads that default and the server MUST NOT fall back to real wall-clock time."
    roles: [ProgramOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["repoints the logical clock every calculation and validation reads; performs no entity mutation"]

  # ---- FilterSku catalog ----------------------------------------------------
  - method: POST
    path: "/filter-skus"
    description: "Registers a filter SKU in the program catalog."
    roles: [ProgramOperator]
    code: 201
    input: [sku_code, size_code, thickness_inches, merv_rating, unit_cost_cents, ship_weight_oz, pack_quantity]
    output: FilterSku
    side_effects: ["creates FilterSku with status ACTIVE and version 1"]

  - method: GET
    path: "/filter-skus/{id}"
    description: "Reads one catalog SKU."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: []
    output: FilterSku
    side_effects: []

  - method: POST
    path: "/filter-skus/{id}/discontinue"
    description: "Retires a SKU from the catalog; existing subscription links are not re-pointed."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: FilterSku
    side_effects: ["FilterSku ACTIVE -> DISCONTINUED", "increments FilterSku.version by 1", "removes the SKU from every future sku_selection candidate set"]

  # ---- Property ------------------------------------------------------------
  - method: POST
    path: "/properties"
    description: "Enrolls a managed property in the filter program."
    roles: [ProgramOperator]
    code: 201
    input: [name, state_code, billing_mode, benefit_tier, damage_waiver_enabled, aqg_enabled, credit_limit_cents]
    output: Property
    side_effects: ["creates Property with status ONBOARDING, outstanding_balance_cents 0, unit_count 0, version 1"]

  - method: GET
    path: "/properties/{id}"
    description: "Reads one property including its derived outstanding_balance_cents and unit_count."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: []
    output: Property
    side_effects: []

  - method: GET
    path: "/properties"
    description: "Lists properties with filtering and pagination."
    roles: [ProgramOperator]
    code: 200
    input: ["status?", "billing_mode?", "benefit_tier?", "limit?", "offset?"]
    output: Property[]
    side_effects: []

  - method: POST
    path: "/properties/{id}/activate"
    description: "Moves a property from ONBOARDING to ACTIVE once it has at least one unit."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Property
    side_effects: ["Property ONBOARDING -> ACTIVE", "increments Property.version by 1"]

  - method: POST
    path: "/properties/{id}/suspend"
    description: "Suspends a property; head of transitive cascade B (subscriptions -> shipments + entitlements)."
    roles: [ProgramOperator]
    code: 200
    input: [suspend_reason]
    output: Property
    side_effects: ["Property ACTIVE -> SUSPENDED", "cascades every ACTIVE Subscription at the property to SUSPENDED, which itself cancels SCHEDULED shipments and suspends RENTERS_INSURANCE / AIR_QUALITY_GUARANTEE entitlements", "increments Property.version by 1"]

  - method: POST
    path: "/properties/{id}/reactivate"
    description: "Compensating action for suspend; restores exactly the entitlements the suspend cascade suspended."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Property
    side_effects: ["Property SUSPENDED -> ACTIVE", "cascades every SUSPENDED Subscription at the property back to ACTIVE, which itself restores BenefitEntitlement rows carrying suspended_by_property_event == true", "increments Property.version by 1"]

  - method: POST
    path: "/properties/{id}/offboard"
    description: "Terminates the program relationship; requires the property to be SUSPENDED with no live subscriptions."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Property
    side_effects: ["Property SUSPENDED -> OFFBOARDED", "sets every AVAILABLE or OCCUPIED Unit at the property to OUT_OF_SERVICE", "increments Property.version by 1"]

  - method: GET
    path: "/properties/{id}/units"
    description: "Lists the units of one property (FK reverse-reachability for Unit.property_id)."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Unit[]
    side_effects: []

  # ---- Unit ----------------------------------------------------------------
  - method: POST
    path: "/properties/{id}/units"
    description: "Adds a rental unit with its HVAC profile and nominal filter size."
    roles: [ProgramOperator, PropertyManager]
    code: 201
    input: [unit_label, hvac_system_type, filter_slot_count, return_grille_count, nominal_size_code]
    output: Unit
    side_effects: ["creates Unit with status AVAILABLE, actual_measured_size_code null, size_capture_count 0, version 1", "increments Property.unit_count by 1"]

  - method: GET
    path: "/units/{id}"
    description: "Reads one unit."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: []
    output: Unit
    side_effects: []

  - method: POST
    path: "/units/{id}/filter-size-captures"
    description: "Records the physically measured filter size at move-in. OCC-guarded (§1.2.1 size-capture-stale-unit) because the capture supersedes the prior measurement and re-maps every live subscription on the unit."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: [actual_measured_size_code, expected_unit_version]
    output: Unit
    side_effects: ["sets Unit.actual_measured_size_code and increments Unit.size_capture_count by 1", "increments Unit.version by 1", "re-runs sku_selection, ship_cadence_days, filters_per_shipment and monthly_fee_cents for every Subscription on this unit whose status IN {PENDING_SETUP, ACTIVE, SUSPENDED}"]

  - method: POST
    path: "/units/{id}/runtime-readings"
    description: "Ingests one HVAC telemetry window for the unit."
    roles: [ProgramOperator]
    code: 201
    input: [window_start, window_end, runtime_minutes, static_pressure_delta_pa, source]
    output: RuntimeReading
    side_effects: ["appends an immutable RuntimeReading; performs no state transition"]

  - method: GET
    path: "/units/{id}/runtime-readings"
    description: "Lists the telemetry windows of one unit (FK reverse-reachability for RuntimeReading.unit_id)."
    roles: [ProgramOperator]
    code: 200
    input: ["source?", "limit?", "offset?"]
    output: RuntimeReading[]
    side_effects: []

  # ---- Resident ------------------------------------------------------------
  - method: POST
    path: "/residents"
    description: "Registers a resident with the household profile that drives cadence load points."
    roles: [ProgramOperator, PropertyManager]
    code: 201
    input: [full_name, email, household_size, has_pets, smoker, allergy_flag]
    output: Resident
    side_effects: ["creates Resident with status PROSPECT and version 1"]

  - method: GET
    path: "/residents/{id}"
    description: "Reads one resident."
    roles: [ProgramOperator, PropertyManager, Resident]
    code: 200
    input: []
    output: Resident
    side_effects: []

  # ---- Subscription --------------------------------------------------------
  - method: POST
    path: "/subscriptions"
    description: "Enrolls a resident on a unit. Runs sku_selection, ship_cadence_days, filters_per_shipment, benefit_entitlement_set and monthly_fee_cents at creation time."
    roles: [ProgramOperator, PropertyManager]
    code: 201
    input: [resident_id, unit_id, billing_party, enrollment_channel, lease_start_date, lease_end_date]
    output: Subscription
    side_effects: ["creates Subscription with status PENDING_SETUP, installation_posture UNVERIFIED, version 1", "resolves property_id from the unit and assigned_sku_id from sku_selection", "stores computed ship_cadence_days, filters_per_shipment and monthly_fee_cents", "creates one PENDING BenefitEntitlement per code in benefit_entitlement_set", "leaves Resident.status at PROSPECT — the resident becomes RESIDING only when the subscription is activated"]

  - method: GET
    path: "/subscriptions/{id}"
    description: "Reads one subscription with both state dimensions and all computed pricing fields."
    roles: [ProgramOperator, PropertyManager, Resident]
    code: 200
    input: []
    output: Subscription
    side_effects: []

  - method: GET
    path: "/subscriptions"
    description: "Lists subscriptions filtered by any FK or either state dimension (FK reverse-reachability for Subscription.resident_id, .unit_id, .property_id, .assigned_sku_id and .predecessor_subscription_id)."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: ["resident_id?", "unit_id?", "property_id?", "assigned_sku_id?", "predecessor_subscription_id?", "status?", "installation_posture?", "limit?", "offset?"]
    output: Subscription[]
    side_effects: []

  - method: POST
    path: "/subscriptions/{id}/activate"
    description: "Starts billing. Guarded by both the parent Property's state (priority 8) and the property's aggregate credit exposure (priority 30)."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Subscription PENDING_SETUP -> ACTIVE", "sets activated_at from the logical clock (no date is accepted in the body)", "posts a LedgerEntry(entry_type=ENROLLMENT_FEE, amount_cents=+2500) and a LedgerEntry(entry_type=MONTHLY_FEE, amount_cents=+first_month_fee_cents)", "sets every PENDING BenefitEntitlement to ACTIVE", "creates Shipment #1 with status SCHEDULED, sequence_number 1 and scheduled_ship_date equal to the logical-clock date", "recomputes Property.outstanding_balance_cents", "increments Subscription.version by 1"]

  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Terminates a subscription and books the full cancellation_settlement (prorated credit net of the tiered unreturned-shipment fee)."
    roles: [ProgramOperator, PropertyManager, Resident]
    code: 200
    input: [effective_date, cancel_reason]
    output: Subscription
    side_effects: ["from PENDING_SETUP: Subscription -> VOIDED, every PENDING BenefitEntitlement -> EXPIRED, no settlement and no LedgerEntry", "Subscription ACTIVE or SUSPENDED -> CANCELLED", "cancels every SCHEDULED Shipment", "transitions every Shipment in SHIPPED or DELIVERED to RETURN_REQUESTED (the settlement is computed BEFORE these transitions, over the pre-transition status set)", "posts a PRORATION_CREDIT LedgerEntry of minus gross_prorated_credit_cents, plus an UNRETURNED_SHIPMENT_FEE LedgerEntry of plus unreturned_fee_net_cents only when that value is greater than 0", "sets every non-terminal BenefitEntitlement to EXPIRED", "recomputes Property.outstanding_balance_cents", "increments Subscription.version by 1"]

  - method: GET
    path: "/subscriptions/{id}/settlement"
    description: "Computed read of cancellation_settlement against the current logical clock without mutating anything; exposes each intermediate so the tiered evaluation order is observable."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: [effective_date]
    output: { subscription_id: string, used_days: integer, unused_days: integer, gross_prorated_credit_cents: integer, exposed_shipment_count: integer, unreturned_fee_gross_cents: integer, waiver_credit_pct: string, unreturned_fee_net_cents: integer, net_settlement_cents: integer }
    side_effects: []

  - method: GET
    path: "/subscriptions/{id}/benefit-entitlements"
    description: "Lists the bundled resident benefits of one subscription (FK reverse-reachability for BenefitEntitlement.subscription_id)."
    roles: [ProgramOperator, PropertyManager, Resident]
    code: 200
    input: ["status?", "benefit_code?", "limit?", "offset?"]
    output: BenefitEntitlement[]
    side_effects: []

  - method: GET
    path: "/subscriptions/{id}/ledger-entries"
    description: "Lists the append-only money rows of one subscription in chronological order (FK reverse-reachability for LedgerEntry.subscription_id)."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: ["entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/subscriptions/{id}/claims"
    description: "Lists the claims filed against one subscription (FK reverse-reachability for Claim.subscription_id)."
    roles: [ProgramOperator, PropertyManager, ClaimsAdjuster, Resident]
    code: 200
    input: ["status?", "claim_type?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/subscriptions/{id}/non-install-cases"
    description: "Lists the non-installation cases opened on one subscription (FK reverse-reachability for NonInstallCase.subscription_id)."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: ["status?", "detection_method?", "limit?", "offset?"]
    output: NonInstallCase[]
    side_effects: []

  - method: POST
    path: "/subscriptions/{id}/shipments"
    description: "Schedules the next filter shipment; the cadence window must not overlap an existing live shipment window (priority 23, half-open interval, no buffer)."
    roles: [ProgramOperator]
    code: 201
    input: [scheduled_ship_date, "quantity?", "tracking_code?"]
    output: Shipment
    side_effects: ["creates Shipment with status SCHEDULED, version 1, sequence_number one greater than the subscription's highest existing sequence_number", "copies sku_id from Subscription.assigned_sku_id; sets quantity to the supplied value when present and to Subscription.filters_per_shipment when omitted", "treats the half-open interval [scheduled_ship_date, scheduled_ship_date + Subscription.ship_cadence_days) as this shipment's cadence window for priority 23"]

  - method: POST
    path: "/subscriptions/{id}/renewal-surveys"
    description: "Records the resident's renewal-survey answers, the second evidence source for non-installation detection."
    roles: [ProgramOperator, Resident]
    code: 201
    input: [installed_last_shipment, filters_on_hand_count, "self_reported_change_date?"]
    output: RenewalSurvey
    side_effects: ["appends an immutable RenewalSurvey; performs no state transition"]

  - method: GET
    path: "/subscriptions/{id}/renewal-surveys"
    description: "Lists the renewal surveys of one subscription (FK reverse-reachability for RenewalSurvey.subscription_id)."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: ["limit?", "offset?"]
    output: RenewalSurvey[]
    side_effects: []

  - method: POST
    path: "/subscriptions/{id}/non-install-evaluations"
    description: "Scores the chosen evidence source with non_install_evidence_score. A score at or above SUSPECT_THRESHOLD[detection_method] opens an investigable case; a score below it records a case already closed as unsubstantiated."
    roles: [ProgramOperator]
    code: 201
    input: [detection_method, evaluated_through_date]
    output: NonInstallCase
    side_effects: ["creates NonInstallCase with version 1, storing evidence_score, detection_method, suspect_threshold and confirm_threshold", "when evidence_score >= SUSPECT_THRESHOLD[detection_method]: case status OPEN and Subscription.installation_posture UNVERIFIED or COMPLIANT -> NON_INSTALL_SUSPECTED", "when evidence_score < SUSPECT_THRESHOLD[detection_method]: case status CLOSED_UNSUBSTANTIATED and Subscription.installation_posture UNVERIFIED or REMEDIATED -> COMPLIANT", "increments Subscription.version by 1"]

  # ---- Shipment ------------------------------------------------------------
  - method: GET
    path: "/shipments/{id}"
    description: "Reads one shipment."
    roles: [ProgramOperator, PropertyManager, Resident]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  - method: GET
    path: "/shipments"
    description: "Lists shipments filtered by owning subscription or catalog SKU (FK reverse-reachability for Shipment.subscription_id and Shipment.sku_id)."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: ["subscription_id?", "sku_id?", "status?", "limit?", "offset?"]
    output: Shipment[]
    side_effects: []

  - method: POST
    path: "/shipments/{id}/ship"
    description: "Dispatches a scheduled shipment."
    roles: [ProgramOperator]
    code: 200
    input: [tracking_code]
    output: Shipment
    side_effects: ["Shipment SCHEDULED -> SHIPPED", "sets shipped_at from the logical clock and stores tracking_code", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/deliver"
    description: "Confirms carrier delivery."
    roles: [ProgramOperator]
    code: 200
    input: [delivered_at]
    output: Shipment
    side_effects: ["Shipment SHIPPED -> DELIVERED", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/request-return"
    description: "Opens the return window on a delivered shipment; fork point of the branching Shipment machine."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: [return_reason]
    output: Shipment
    side_effects: ["Shipment DELIVERED -> RETURN_REQUESTED", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/return"
    description: "First fork arm: the filters came back, so no fee is owed."
    roles: [ProgramOperator]
    code: 200
    input: [returned_at]
    output: Shipment
    side_effects: ["Shipment RETURN_REQUESTED -> RETURNED", "leaves unreturned_fee_cents at 0", "increments Shipment.version by 1"]

  - method: POST
    path: "/shipments/{id}/write-off"
    description: "Second fork arm: the filters never came back, so unreturned_shipment_fee is booked against the shipment."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Shipment
    side_effects: ["Shipment SHIPPED, DELIVERED or RETURN_REQUESTED -> UNRETURNED_WRITTEN_OFF", "sets unreturned_fee_cents from §1.3 unreturned_shipment_fee", "posts an UNRETURNED_SHIPMENT_FEE LedgerEntry and recomputes Property.outstanding_balance_cents", "increments Shipment.version by 1"]

  # ---- NonInstallCase ------------------------------------------------------
  - method: GET
    path: "/non-install-cases/{id}"
    description: "Reads one non-installation case with its frozen thresholds."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: []
    output: NonInstallCase
    side_effects: []

  - method: POST
    path: "/non-install-cases/{id}/send-notice"
    description: "Notifies the resident and starts the remediation grace period."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: NonInstallCase
    side_effects: ["NonInstallCase OPEN -> NOTICE_SENT", "sets notice_sent_at from the logical clock and remediation_deadline to that date plus REMEDIATION_GRACE_DAYS", "increments NonInstallCase.version by 1"]

  - method: POST
    path: "/non-install-cases/{id}/confirm"
    description: "Head of transitive cascade A. Requires evidence_score >= the case's frozen confirm_threshold (priority 15)."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: NonInstallCase
    side_effects: ["NonInstallCase NOTICE_SENT -> ESCALATED_TO_PM", "Subscription.installation_posture NON_INSTALL_SUSPECTED -> NON_INSTALL_CONFIRMED", "forfeits the DAMAGE_WAIVER and AIR_QUALITY_GUARANTEE BenefitEntitlement rows", "inserts one WAIVER_REVERSAL LedgerEntry per forfeited entitlement from §1.3 waiver_reversal_credit", "recomputes Subscription.monthly_fee_cents and Property.outstanding_balance_cents", "increments NonInstallCase.version and Subscription.version by 1 each"]

  - method: POST
    path: "/non-install-cases/{id}/remediate"
    description: "Records that the property manager installed the filters; does not un-forfeit anything."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: [remediation_note]
    output: NonInstallCase
    side_effects: ["NonInstallCase ESCALATED_TO_PM -> REMEDIATED", "Subscription.installation_posture NON_INSTALL_CONFIRMED -> REMEDIATED", "increments NonInstallCase.version and Subscription.version by 1 each"]

  - method: POST
    path: "/non-install-cases/{id}/close-unsubstantiated"
    description: "Clears a suspicion without escalation; returns the posture to COMPLIANT."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: NonInstallCase
    side_effects: ["NonInstallCase OPEN or NOTICE_SENT -> CLOSED_UNSUBSTANTIATED", "Subscription.installation_posture NON_INSTALL_SUSPECTED -> COMPLIANT", "increments NonInstallCase.version and Subscription.version by 1 each"]

  # ---- BenefitEntitlement --------------------------------------------------
  - method: GET
    path: "/benefit-entitlements/{id}"
    description: "Reads one bundled-benefit entitlement including suspended_by_property_event and forfeit_reason."
    roles: [ProgramOperator, PropertyManager, Resident]
    code: 200
    input: []
    output: BenefitEntitlement
    side_effects: []

  # ---- Claim ---------------------------------------------------------------
  - method: POST
    path: "/claims"
    description: "Files a damage-waiver or air-quality-guarantee claim. Requires the matching BenefitEntitlement to be ACTIVE (priority 17) and the incident to fall inside the coverage window (priority 18)."
    roles: [Resident, PropertyManager, ProgramOperator]
    code: 201
    input: [subscription_id, claim_type, incident_date, requested_amount_cents, description]
    output: Claim
    side_effects: ["creates Claim with status SUBMITTED, info_request_round 0, version 1"]

  - method: GET
    path: "/claims/{id}"
    description: "Reads one claim with both settlement variants side by side."
    roles: [ProgramOperator, ClaimsAdjuster, PropertyManager, Resident]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: GET
    path: "/claims"
    description: "Lists claims filtered by owning subscription (FK reverse-reachability for Claim.subscription_id)."
    roles: [ProgramOperator, ClaimsAdjuster]
    code: 200
    input: ["subscription_id?", "claim_type?", "status?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: POST
    path: "/claims/{id}/triage"
    description: "Adjuster intake. Computes the provisional_at_triage variant of §1.3 claim_settlement_amount and records triaged_by_user_id for the segregation-of-duties check."
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["Claim SUBMITTED -> UNDER_REVIEW", "sets provisional_amount_cents from the provisional_at_triage variant", "stores triaged_by_user_id from the X-User-ID header", "increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/request-info"
    description: "Sends the claim back to the filer for more evidence; capped at MAX_INFO_REQUEST_ROUNDS (priority 24)."
    roles: [ClaimsAdjuster]
    code: 200
    input: [question]
    output: Claim
    side_effects: ["Claim UNDER_REVIEW -> INFO_REQUESTED", "increments info_request_round by 1", "increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/resubmit"
    description: "Closes the review cycle: the filer supplies the requested evidence and the claim returns to UNDER_REVIEW."
    roles: [Resident, PropertyManager, ProgramOperator]
    code: 200
    input: [description]
    output: Claim
    side_effects: ["Claim INFO_REQUESTED -> UNDER_REVIEW (cycle)", "recomputes provisional_amount_cents under the provisional_at_triage variant against the current data", "leaves info_request_round unchanged", "increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/decide"
    description: "Adjudicates the claim. On APPROVE it computes the final_at_decision variant of §1.3 claim_settlement_amount; the deciding user must differ from triaged_by_user_id (priority 14)."
    roles: [ClaimsAdjuster]
    code: 200
    input: [decision, decision_note]
    output: Claim
    side_effects: ["Claim UNDER_REVIEW -> APPROVED when decision == APPROVE, setting approved_amount_cents from the final_at_decision variant", "Claim UNDER_REVIEW -> DENIED when decision == DENY, leaving approved_amount_cents null", "stores decided_by_user_id from the X-User-ID header", "increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/pay"
    description: "Disburses an approved claim and moves money on the ledger."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: Claim
    side_effects: ["Claim APPROVED -> PAID", "sets paid_at from the logical clock", "posts a CLAIM_PAYOUT LedgerEntry of minus approved_amount_cents", "recomputes Property.outstanding_balance_cents", "increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/reverse-payment"
    description: "Compensating action for pay; the money invariant of §1.3 property_ledger_rollup must return to its pre-payout value with no drift."
    roles: [ProgramOperator]
    code: 200
    input: [reversal_reason]
    output: Claim
    side_effects: ["Claim PAID -> REVERSED", "posts a CLAIM_PAYOUT_REVERSAL LedgerEntry of exactly plus approved_amount_cents", "recomputes Property.outstanding_balance_cents", "increments Claim.version by 1"]

  - method: POST
    path: "/claims/{id}/withdraw"
    description: "Filer abandons a claim that has not yet been decided."
    roles: [Resident, PropertyManager, ProgramOperator]
    code: 200
    input: [withdraw_reason]
    output: Claim
    side_effects: ["Claim SUBMITTED, UNDER_REVIEW or INFO_REQUESTED -> WITHDRAWN", "increments Claim.version by 1"]

  # ---- SubscriptionTransfer ------------------------------------------------
  - method: POST
    path: "/subscription-transfers"
    description: "Opens a mid-lease address change. OCC-guarded (§1.2.1 transfer-create-stale-subscription) because the request supersedes any earlier open transfer on the same subscription."
    roles: [ProgramOperator, PropertyManager]
    code: 201
    input: [subscription_id, to_unit_id, effective_date, expected_subscription_version]
    output: SubscriptionTransfer
    side_effects: ["creates SubscriptionTransfer with status REQUESTED, version 1", "transitions Subscription ACTIVE -> TRANSFER_PENDING", "supersedes every prior SubscriptionTransfer of this subscription whose status IN {REQUESTED, SKU_REMAPPED}", "increments Subscription.version by 1"]

  - method: GET
    path: "/subscription-transfers/{id}"
    description: "Reads one transfer with its proration breakdown."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: []
    output: SubscriptionTransfer
    side_effects: []

  - method: GET
    path: "/subscription-transfers"
    description: "Lists transfers filtered by any of their four FKs (FK reverse-reachability for SubscriptionTransfer.subscription_id, .to_unit_id, .remapped_sku_id and .successor_subscription_id)."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: ["subscription_id?", "to_unit_id?", "remapped_sku_id?", "successor_subscription_id?", "status?", "limit?", "offset?"]
    output: SubscriptionTransfer[]
    side_effects: []

  - method: POST
    path: "/subscription-transfers/{id}/remap-sku"
    description: "Re-runs sku_selection against the destination unit's HVAC profile and measured size."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: SubscriptionTransfer
    side_effects: ["SubscriptionTransfer REQUESTED -> SKU_REMAPPED", "sets remapped_sku_id from §1.3 sku_selection evaluated against the destination unit", "increments SubscriptionTransfer.version by 1"]

  - method: POST
    path: "/subscription-transfers/{id}/complete"
    description: "Head of transitive cascade C. Books §1.3 transfer_proration and issues the successor subscription on the destination unit."
    roles: [ProgramOperator]
    code: 200
    input: []
    output: SubscriptionTransfer
    side_effects: ["SubscriptionTransfer SKU_REMAPPED -> COMPLETED", "stores proration_credit_cents, proration_charge_cents and net_adjustment_cents", "creates the successor Subscription on the destination unit in status ACTIVE with its own recomputed cadence, filters_per_shipment and monthly_fee_cents, and sets predecessor_subscription_id on it", "transitions the outgoing Subscription TRANSFER_PENDING -> CANCELLED with cancel_reason TRANSFER_SUPERSEDED and expires its entitlements", "posts exactly one signed TRANSFER_ADJUSTMENT LedgerEntry carrying net_adjustment_cents (the credit and charge legs are never posted separately) and recomputes Property.outstanding_balance_cents", "increments SubscriptionTransfer.version and Subscription.version by 1 each"]

  - method: POST
    path: "/subscription-transfers/{id}/reject"
    description: "Declines the transfer and returns the subscription to ACTIVE (cycle closes)."
    roles: [ProgramOperator, PropertyManager]
    code: 200
    input: [rejection_reason]
    output: SubscriptionTransfer
    side_effects: ["SubscriptionTransfer REQUESTED or SKU_REMAPPED -> REJECTED", "transitions Subscription TRANSFER_PENDING -> ACTIVE", "books no proration and inserts no LedgerEntry", "increments SubscriptionTransfer.version and Subscription.version by 1 each"]

# =============================================================================
# §1.6 Error Catalog
# =============================================================================
errors:

  # ---- auth / shape (priorities 1-6) ---------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    message: "X-User-ID and X-User-Role headers are required"
    condition: "either identity header is absent or empty on any endpoint"

  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    message: "role is not permitted to perform this operation"
    condition: "X-User-Role is not listed in the target endpoint's §1.5 roles, or is not a recognised role name"

  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    message: "caller does not own the target resource"
    condition: "PropertyManager whose X-User-ID is not the resolved Property.id, or Resident whose X-User-ID is not the resolved Subscription.resident_id"

  - id: ERR_INVALID_REQUEST
    http: 400
    message: "request body failed shape validation"
    condition: "a required input field is missing, a field has the wrong JSON type, an enum value is outside its constraint set, a money field is negative, or a date string is not ISO 8601"

  - id: ERR_INVALID_PAGINATION
    http: 400
    message: "limit must be between 1 and 100 and offset must be at least 0"
    condition: "limit <= 0, limit > 100, or offset < 0 on any list endpoint"

  # ---- existence (priority 3) ---------------------------------------------
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    message: "property not found"
    condition: "a property id in the path or body matches no Property row"

  - id: ERR_UNIT_NOT_FOUND
    http: 404
    message: "unit not found"
    condition: "a unit id in the path or body (including to_unit_id) matches no Unit row"

  - id: ERR_SKU_NOT_FOUND
    http: 404
    message: "filter sku not found"
    condition: "a filter-sku id in the path matches no FilterSku row"

  - id: ERR_RESIDENT_NOT_FOUND
    http: 404
    message: "resident not found"
    condition: "a resident id in the path or body matches no Resident row"

  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    message: "subscription not found"
    condition: "a subscription id in the path or body matches no Subscription row"

  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    message: "shipment not found"
    condition: "a shipment id in the path matches no Shipment row"

  - id: ERR_CASE_NOT_FOUND
    http: 404
    message: "non-installation case not found"
    condition: "a case id in the path matches no NonInstallCase row"

  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    message: "claim not found"
    condition: "a claim id in the path matches no Claim row"

  - id: ERR_TRANSFER_NOT_FOUND
    http: 404
    message: "subscription transfer not found"
    condition: "a transfer id in the path matches no SubscriptionTransfer row"

  - id: ERR_ENTITLEMENT_NOT_FOUND
    http: 404
    message: "benefit entitlement not found"
    condition: "an entitlement id in the path matches no BenefitEntitlement row"

  # ---- optimistic concurrency (priority 7, §1.2.1) ------------------------
  - id: ERR_STALE_SUBSCRIPTION_VERSION
    http: 412
    message: "expected_subscription_version does not match the current subscription version"
    condition: "POST /subscription-transfers carries an expected_subscription_version other than the target Subscription's current version"

  - id: ERR_STALE_UNIT_VERSION
    http: 412
    message: "expected_unit_version does not match the current unit version"
    condition: "POST /units/{id}/filter-size-captures carries an expected_unit_version other than the target Unit's current version"

  # ---- state guards (priorities 8-13) -------------------------------------
  - id: ERR_PROPERTY_NOT_ACTIVE
    http: 409
    message: "owning property is not ACTIVE"
    condition: "a subscription-level or transfer-level write is attempted while the owning Property.status is ONBOARDING, SUSPENDED or OFFBOARDED"

  - id: ERR_SUBSCRIPTION_STATE_INVALID
    http: 409
    message: "subscription is not in a state that allows this operation"
    condition: "the trigger is not a declared transition out of the Subscription's current status or installation_posture"

  - id: ERR_SHIPMENT_STATE_INVALID
    http: 409
    message: "shipment is not in a state that allows this operation"
    condition: "ship, deliver, request-return, return or write-off is called from a shipment status the §1.2 Shipment machine does not permit, including any terminal status"

  - id: ERR_CLAIM_STATE_INVALID
    http: 409
    message: "claim is not in a state that allows this operation"
    condition: "triage, request-info, resubmit, decide, pay, reverse-payment or withdraw is called from a claim status the §1.2 Claim machine does not permit"

  - id: ERR_CASE_STATE_INVALID
    http: 409
    message: "non-installation case is not in a state that allows this operation"
    condition: "send-notice, confirm, remediate or close-unsubstantiated is called from a case status the §1.2 NonInstallCase machine does not permit"

  - id: ERR_TRANSFER_STATE_INVALID
    http: 409
    message: "subscription transfer is not in a state that allows this operation"
    condition: "remap-sku, complete or reject is called from a transfer status the §1.2 SubscriptionTransfer machine does not permit"

  # ---- business rules (priorities 14-30) ----------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    message: "the adjuster who triaged this claim may not decide it"
    condition: "POST /claims/{id}/decide with an X-User-ID equal to Claim.triaged_by_user_id"

  - id: ERR_EVIDENCE_BELOW_CONFIRM_THRESHOLD
    http: 422
    message: "evidence score is below the confirmation threshold frozen on this case"
    condition: "POST /non-install-cases/{id}/confirm where NonInstallCase.evidence_score < NonInstallCase.confirm_threshold"

  - id: ERR_NO_EVIDENCE_FOR_METHOD
    http: 422
    message: "no evidence exists for the requested detection method"
    condition: "POST /subscriptions/{id}/non-install-evaluations with detection_method RUNTIME_ANALYTICS and no RuntimeReading in range, or RENEWAL_SURVEY and no RenewalSurvey in range"

  - id: ERR_BENEFIT_NOT_ENTITLED
    http: 422
    message: "the benefit backing this claim type is not an ACTIVE entitlement"
    condition: "POST /claims (or POST /claims/{id}/decide with APPROVE) where the BenefitEntitlement whose benefit_code matches the claim_type is absent or is in PENDING, SUSPENDED, FORFEITED or EXPIRED"

  - id: ERR_OUTSIDE_COVERAGE_WINDOW
    http: 422
    message: "incident date falls outside the coverage window"
    condition: "POST /claims where incident_date is earlier than date(Subscription.activated_at), later than the logical-clock date, or more than CLAIM_FILING_WINDOW_DAYS (60) before the logical-clock date"

  - id: ERR_SKU_DISCONTINUED
    http: 422
    message: "the mapped filter sku has been discontinued"
    condition: "a write that would newly bind or re-bind a Subscription to a FilterSku whose status is DISCONTINUED"

  - id: ERR_NO_ELIGIBLE_SKU
    http: 422
    message: "no active filter sku satisfies the unit and household profile"
    condition: "§1.3 sku_selection produces an empty candidate set for the unit's effective size_code and the household's minimum MERV requirement"

  - id: ERR_DUPLICATE_ACTIVE_SUBSCRIPTION
    http: 409
    message: "this resident already holds a live subscription on this unit"
    condition: "POST /subscriptions where a Subscription with the same resident_id and unit_id has status IN {PENDING_SETUP, ACTIVE, SUSPENDED, TRANSFER_PENDING}"

  - id: ERR_UNIT_OCCUPANCY_CONFLICT
    http: 409
    message: "requested lease interval conflicts with an existing occupancy plus turnover buffer"
    condition: "the closed interval [lease_start_date, lease_end_date] is not separated from every live interval on the unit by more than TURNOVER_BUFFER_DAYS"

  - id: ERR_SHIPMENT_WINDOW_OVERLAP
    http: 409
    message: "requested ship date falls inside the previous cadence window"
    condition: "scheduled_ship_date lies in the half-open window [latest.scheduled_ship_date, latest.scheduled_ship_date + ship_cadence_days)"

  - id: ERR_INFO_REQUEST_LIMIT
    http: 422
    message: "the information-request limit for this claim has been reached"
    condition: "POST /claims/{id}/request-info where Claim.info_request_round is already MAX_INFO_REQUEST_ROUNDS"

  - id: ERR_TRANSFER_DATE_INVALID
    http: 422
    message: "transfer effective date is outside the permitted range"
    condition: "effective_date precedes the logical-clock date or exceeds the outgoing subscription's lease_end_date"

  - id: ERR_TRANSFER_TARGET_INVALID
    http: 422
    message: "destination unit cannot receive this transfer"
    condition: "POST /subscription-transfers or POST /subscription-transfers/{id}/remap-sku where to_unit_id equals Subscription.unit_id, or Unit(to_unit_id).status is not AVAILABLE"

  - id: ERR_CANCEL_DATE_INVALID
    http: 422
    message: "cancellation effective date is outside the permitted range"
    condition: "effective_date precedes the logical-clock date or exceeds Subscription.lease_end_date"

  - id: ERR_INVALID_RUNTIME_WINDOW
    http: 422
    message: "runtime reading window is not a positive interval within the permitted length"
    condition: "POST /units/{id}/runtime-readings where window_end is not strictly after window_start, or static_pressure_delta_pa is not greater than 0"

  - id: ERR_CLAIM_AMOUNT_EXCEEDS_CAP
    http: 422
    message: "requested amount exceeds the per-claim cap for this claim type"
    condition: "POST /claims where requested_amount_cents exceeds CLAIM_REQUEST_HARD_CAP_CENTS (100000)"

  - id: ERR_PROPERTY_CREDIT_LIMIT_EXCEEDED
    http: 402
    message: "property credit limit would be exceeded by this commitment"
    condition: "activation or transfer completion would push the property's committed exposure above Property.credit_limit_cents"

# =============================================================================
# §1.7 RBAC
# =============================================================================
roles:

  - name: ProgramOperator
    identity: opaque
    description: "Second Nature program staff. Full operational surface: catalog, property lifecycle, telemetry ingestion, shipment fulfilment, non-installation investigation, payout disbursal and the logical clock. Cannot triage or decide claims."
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /filter-skus"
      - "POST /filter-skus/{id}/discontinue"
      - "POST /properties"
      - "POST /properties/{id}/activate"
      - "POST /properties/{id}/suspend"
      - "POST /properties/{id}/reactivate"
      - "POST /properties/{id}/offboard"
      - "POST /units/{id}/runtime-readings"
      - "GET /units/{id}/runtime-readings"
      - "POST /subscriptions/{id}/shipments"
      - "POST /subscriptions/{id}/non-install-evaluations"
      - "POST /shipments/{id}/ship"
      - "POST /shipments/{id}/deliver"
      - "POST /shipments/{id}/return"
      - "POST /shipments/{id}/write-off"
      - "POST /non-install-cases/{id}/send-notice"
      - "POST /non-install-cases/{id}/confirm"
      - "POST /non-install-cases/{id}/close-unsubstantiated"
      - "POST /claims/{id}/pay"
      - "POST /claims/{id}/reverse-payment"
      - "POST /subscription-transfers/{id}/remap-sku"
      - "POST /subscription-transfers/{id}/complete"
      - "GET /properties"
    shared_operations:
      - "POST /properties/{id}/units"
      - "POST /units/{id}/filter-size-captures"
      - "POST /residents"
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/activate"
      - "POST /subscriptions/{id}/cancel"
      - "POST /subscriptions/{id}/renewal-surveys"
      - "POST /shipments/{id}/request-return"
      - "POST /non-install-cases/{id}/remediate"
      - "POST /claims"
      - "POST /claims/{id}/resubmit"
      - "POST /claims/{id}/withdraw"
      - "POST /subscription-transfers"
      - "POST /subscription-transfers/{id}/reject"
      - "all GET endpoints"

  - name: PropertyManager
    identity: "entity_backed:Property"
    description: "Operator of one managed property; X-User-ID must equal that Property.id. Sees and writes only resources that resolve to that property through Unit.property_id or Subscription.property_id (priority 4). May remediate a confirmed non-installation case but may never score evidence, confirm a case, adjudicate a claim or disburse money."
    exclusive_operations: []
    shared_operations:
      - "POST /properties/{id}/units"
      - "POST /units/{id}/filter-size-captures"
      - "POST /residents"
      - "POST /subscriptions"
      - "POST /subscriptions/{id}/activate"
      - "POST /subscriptions/{id}/cancel"
      - "POST /shipments/{id}/request-return"
      - "POST /non-install-cases/{id}/remediate"
      - "POST /claims"
      - "POST /claims/{id}/resubmit"
      - "POST /claims/{id}/withdraw"
      - "POST /subscription-transfers"
      - "POST /subscription-transfers/{id}/reject"
      - "GET /properties/{id}, GET /properties/{id}/units, GET /units/{id}, GET /residents/{id}, GET /filter-skus/{id}"
      - "GET /subscriptions, GET /subscriptions/{id} and every /subscriptions/{id}/... sub-resource GET"
      - "GET /shipments, GET /shipments/{id}, GET /non-install-cases/{id}, GET /benefit-entitlements/{id}"
      - "GET /claims/{id}, GET /subscription-transfers, GET /subscription-transfers/{id}"

  - name: Resident
    identity: "entity_backed:Resident"
    description: "Household member enrolled on a unit; X-User-ID must equal that Resident.id. May answer renewal surveys, file and withdraw their own claims, cancel their own subscription and read their own records only."
    exclusive_operations: []
    shared_operations:
      - "POST /subscriptions/{id}/renewal-surveys"
      - "POST /subscriptions/{id}/cancel"
      - "POST /claims"
      - "POST /claims/{id}/resubmit"
      - "POST /claims/{id}/withdraw"
      - "GET /residents/{id}, GET /subscriptions/{id}, GET /subscriptions/{id}/benefit-entitlements"
      - "GET /subscriptions/{id}/claims, GET /claims/{id}, GET /shipments/{id}, GET /benefit-entitlements/{id}"

  - name: ClaimsAdjuster
    identity: opaque
    description: "Independent adjudicator of damage-waiver and air-quality-guarantee claims. Owns the whole review cycle but is deliberately barred from disbursing money, and priority 14 additionally bars the individual adjuster who triaged a claim from deciding it (segregation of duties keyed on X-User-ID)."
    exclusive_operations:
      - "POST /claims/{id}/triage"
      - "POST /claims/{id}/request-info"
      - "POST /claims/{id}/decide"
    shared_operations:
      - "GET /claims"
      - "GET /claims/{id}"
      - "GET /subscriptions/{id}/claims"
