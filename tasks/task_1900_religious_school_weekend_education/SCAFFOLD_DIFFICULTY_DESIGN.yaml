            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "Plan" }, as: SchoolAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /school/security-plans/${sp_id}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp_id}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/families", payload: { family_name: "Fam A", primary_email: "a@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_id: $.data.id } }
            - { call: "POST /school/families/${fam_id}/assistance-applications", payload: { school_year_id: "${y_id}", reason: "Income drop" }, as: SchoolAdmin, captures: { app: $.data.id } }
          trigger:
            - { call: "POST /school/assistance-applications/${app}/start-review", payload: {}, as: AssistanceOfficer, as_user_id: "officer-1" }
            - { call: "POST /school/assistance-applications/${app}/request-info", payload: {}, as: AssistanceOfficer, as_user_id: "officer-1" }
            - { call: "POST /school/assistance-applications/${app}/start-review", payload: {}, as: AssistanceOfficer, as_user_id: "officer-1" }
            - { call: "GET /school/assistance-applications/${app}", payload: {}, as: AssistanceOfficer }
          assert:
            - "After start-review: status == UNDER_REVIEW; after request-info: status == SUBMITTED (loop back)"
            - "After the second start-review: status == UNDER_REVIEW again — cycle traversed twice"
            - "AssistanceApplication.${app}.reviewed_by_user_id == officer-1 (retained across the loop)"

  # =====================================================================
  # Rule 4 — transitive_cascade (2 instances, depth >= 3 and >= 2, different triggers)
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: teacher_separation_cascade_section_session_milestone
        grounds:
          - state_machines.Teacher.HIRED_to_SEPARATED
          - entities.Section.fields.staffing_status
          - entities.Session.fields.cancel_reason
        distinguishing_aspect: |
          Depth-3 chain from POST /teachers/{id}/separate: Teacher HIRED->SEPARATED
          causes Sections to become UNSTAFFED (hop 1), which causes their SCHEDULED
          Sessions to be CANCELLED (hop 2), which causes per-student attendance
          recompute and Milestone re-evaluation (hop 3) — each hop triggered by the
          previous mutation, not by the original call.
        test_recipe:
          setup:
            - "Year OPEN; teacher HIRED and assigned; G3/BEGINNER section capacity 5 with 1 enrolled student; two SCHEDULED sessions (2026-09-13, 2026-09-20)"
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
