  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_invalid_state_beats_slot_capacity
        grounds:
          - validations[priority=7]
          - validations[priority=15]
        distinguishing_aspect: |
          Error-category pair state(priority 7, ERR_INVALID_STATE) vs business_fiscal(priority 15,
          ERR_SLOT_CAPACITY): an order already CONFIRMED on a now-full slot, re-confirmed, returns
          ERR_INVALID_STATE because the state check runs before the capacity check.
        test_recipe:
          setup:
            - "Patron P; slot S capacity 1, window 2026-06-10T10:00..12:00Z."
            - "Order O CONFIRMED on S (1 NON_MEMBER ticket) so slot is full (reserved_count==1==capacity)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /patrons"
              payload: { email: "p9@x.com", full_name: "P Nine" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 1, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "A" }
              as: Patron
              as_user_id: "${p_id}"
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /admission-orders/${o_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: confirm_slot_window_open_beats_slot_capacity
        grounds:
          - validations[priority=11]
          - validations[priority=15]
        distinguishing_aspect: |
          A different error-category pair business_temporal(priority 11, ERR_SLOT_WINDOW) vs
          business_fiscal(priority 15, ERR_SLOT_CAPACITY): a DRAFT order on a slot that is BOTH full
          (capacity_total=1 already taken) AND whose entry window has already opened returns
          ERR_SLOT_WINDOW, not the capacity error, because the temporal check precedes the fiscal check.
        test_recipe:
          setup:
            - "Slot S capacity_total=1, window 2026-06-10T10:00..12:00Z."
            - "Filler patron F's order FO CONFIRMED on S (slot full, reserved_count==1) while clock at 2026-06-01 (before window)."
            - "Patron P's DRAFT order O on S with 1 NON_MEMBER ticket."
            - "Clock advanced to 2026-06-10T10:05 (window now open) before P confirms."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MembershipAdmin
            - call: "POST /patrons"
              payload: { email: "p10@x.com", full_name: "P Ten" }
              as: MembershipAdmin
              captures: { p_id: $.data.id }
            - call: "POST /patrons"
              payload: { email: "p10b@x.com", full_name: "Filler" }
              as: MembershipAdmin
              captures: { f_id: $.data.id }
            - call: "POST /timed-entry-slots"
              payload: { starts_at: "2026-06-10T10:00:00Z", ends_at: "2026-06-10T12:00:00Z", capacity_total: 1, non_member_admission_cents: 2500 }
              as: MembershipAdmin
              captures: { slot_id: $.data.id }
            - call: "POST /admission-orders"
              payload: { patron_id: "${f_id}", slot_id: "${slot_id}" }
              as: Patron
              as_user_id: "${f_id}"
              captures: { fo_id: $.data.id }
            - call: "POST /admission-orders/${fo_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "Filler" }
              as: Patron
              as_user_id: "${f_id}"
            - call: "POST /admission-orders/${fo_id}/confirm"
              payload: {}
              as: Patron
              as_user_id: "${f_id}"
            - call: "POST /admission-orders"
              payload: { patron_id: "${p_id}", slot_id: "${slot_id}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { o_id: $.data.id }
            - call: "POST /admission-orders/${o_id}/tickets"
              payload: { ticket_type: "NON_MEMBER", person_name: "P Ten" }
              as: Patron
              as_user_id: "${p_id}"
