  # =====================================================================
  # Section: cross_cutting_complexity_layers
  # =====================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: renew_stale_property_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[renew-stale-property]
          - endpoints."POST /registry/properties/{id}/renew"
          - errors[ERR_STALE_PROPERTY_VERSION]
        distinguishing_aspect: "After a first renew advances version 1->2, a second renew still carrying expected_property_version 1 returns ERR_STALE_PROPERTY_VERSION (412)."
        test_recipe:
          setup: ["OWNER/VACANT property created at version 1."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner QQ", party_type: "OWNER", email: "qq@x.com", contact_phone: "555-0310", mailing_address: "210 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-OCC", street_address: "19 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id", prop_v: "$.data.version" }
            - call: "POST /registry/properties/${prop_id}/renew"
              payload: { expected_property_version: "${prop_v}" }
              as: Registrant
              as_user_id: "${reg_id}"
          trigger:
            - call: "POST /registry/properties/${prop_id}/renew"
              payload: { expected_property_version: "${prop_v}" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "first renew succeeds and Property.${prop_id}.version becomes 2"
            - "second renew (stale expected_property_version 1) -> response.status 412, error_id == ERR_STALE_PROPERTY_VERSION"

      - name: renew_correct_version_succeeds_and_extends_expiry
        claim_type: optimistic_concurrency
        grounds:
          - endpoints."POST /registry/properties/{id}/renew"
          - entities.Property.fields.registration_expires_at
          - entities.Property.fields.version
        distinguishing_aspect: "Renew with the current expected_property_version succeeds, increments version to 2, and extends registration_expires_at by 365 days."
        test_recipe:
          setup: ["OWNER/VACANT property created at version 1 at default clock 2026-03-01 (expires 2027-03-01)."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner RR", party_type: "OWNER", email: "rr@x.com", contact_phone: "555-0311", mailing_address: "211 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-OCC2", street_address: "20 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
              captures: { prop_id: "$.data.id", prop_v: "$.data.version" }
          trigger:
            - call: "POST /registry/properties/${prop_id}/renew"
              payload: { expected_property_version: "${prop_v}" }
              as: Registrant
              as_user_id: "${reg_id}"
          assert:
            - "Property.${prop_id}.version == 2"
            - "Property.${prop_id}.registration_expires_at == 2028-02-29T00:00:00Z"

      - name: properties_list_pagination_has_more
        claim_type: pagination_with_filtering
        grounds:
          - endpoints."GET /registry/properties"
          - response_envelope.pagination_fields
        distinguishing_aspect: "With two properties for a registrant, GET /registry/properties?registrant_id&limit=1 returns one element, total_count 2, has_more true."
        test_recipe:
          setup: ["OWNER registrant with two properties."]
          setup_api_calls:
            - call: "POST /registry/registrants"
              payload: { legal_name: "Owner SS", party_type: "OWNER", email: "ss@x.com", contact_phone: "555-0312", mailing_address: "212 Main St" }
              as: Anonymous
              captures: { reg_id: "$.data.id" }
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-PG1", street_address: "21 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
            - call: "POST /registry/properties"
              payload: { registrant_id: "${reg_id}", parcel_id: "C-PG2", street_address: "22 Elm", occupancy_status: "VACANT", registration_type: "OWNER" }
              as: Registrant
              as_user_id: "${reg_id}"
          trigger:
            - call: "GET /registry/properties?registrant_id=${reg_id}&limit=1&offset=0"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response.data length == 1"
            - "response.meta/envelope total_count == 2"
            - "response has_more == true"

