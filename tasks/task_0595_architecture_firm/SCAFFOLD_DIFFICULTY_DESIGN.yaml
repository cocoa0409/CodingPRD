          setup:
            - "A consultant firm with concurrent_review_capacity 1."
            - "An executed project whose contract uses CALENDAR_DAYS with submittal_review_period_days 14."
            - "Submittal A from that firm is UNDER_REVIEW with review_started_at 2026-06-01T09:00:00Z and review_due_at 2026-06-15T09:00:00Z; submittal B from the same firm is still RECEIVED."
