# =============================================================================
# 1.9 Scaffold Corner Design (breadth probe)
# Task 2608 - Federated Fundraising Campaign & Allocation
# Taxonomy: references/claim-extraction-guide.md - nine sections, per-section
# claim-type rows only. Every `excluded_because.difficulty_instance` names an
# instance that exists by `name` in SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# Every numeric literal in `assert:` was computed with Decimal round_half_up
# against the SCAFFOLD.yaml §1.3 formulas and their `constants:`.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:

      - name: agency_creation_returns_declared_fields_and_applicant_initial_state
        claim_type: Creation
        grounds:
          - entities.Agency
          - entities.Agency.fields.membership_status
          - entities.Agency.fields.designated_passthrough_ytd
          - endpoints.POST /fundraising/agencies
          - response_envelope.success
        distinguishing_aspect: |
          A brand-new Agency comes back 201 with the three input fields echoed verbatim, every
          computed field at its declared default (membership_status APPLICANT,
          latest_standing_score null, designated_passthrough_ytd 0.00, open_review_count 0,
          probation_count 0, outcome_report_delinquent false) and version 1 - no review exists
          yet, so nothing has scored the agency.
        test_recipe:
          setup:
            - "Empty database. No employer, campaign, cycle or review exists."
          setup_api_calls: []
          trigger:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Riverbend Community Aid", ein: "600000001", primary_priority_area: "HEALTH" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id, ms: $.data.membership_status }
          assert:
            - "HTTP 201"
            - "Agency.${ag}.legal_name == 'Riverbend Community Aid'"
            - "Agency.${ag}.ein == '600000001'"
            - "Agency.${ag}.primary_priority_area == HEALTH"
            - "Agency.${ag}.membership_status == APPLICANT"
            - "Agency.${ag}.latest_standing_score is null"
            - "Agency.${ag}.designated_passthrough_ytd == 0.00"
            - "Agency.${ag}.open_review_count == 0"
            - "Agency.${ag}.probation_count == 0"
            - "Agency.${ag}.outcome_report_delinquent == false"
            - "Agency.${ag}.version == 1 and created_at == updated_at"
            - "Response carries meta.api_request_id, meta.api_request_timestamp and response_type == 'object'"

      - name: employer_omitted_optional_inputs_take_declared_defaults
        claim_type: Defaults
        grounds:
          - entities.Employer.fields.payroll_periods_per_year
          - entities.Employer.fields.historical_shrinkage_rate_bps
          - entities.Employer.fields.partnership_signed
          - entities.Employer.fields.status
          - endpoints.POST /fundraising/employers
        distinguishing_aspect: |
          Posting only the two required Employer inputs applies payroll_periods_per_year 26,
          historical_shrinkage_rate_bps 800 and partnership_signed false, and because
          partnership_signed defaulted to false the computed status is PROSPECT (not ACTIVE),
          which is exactly what makes the later /activate call legal.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Fairfield Machine Works", employee_count: 250 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id, ppy: $.data.payroll_periods_per_year }
          assert:
            - "HTTP 201"
            - "Employer.${emp}.payroll_periods_per_year == 26"
            - "Employer.${emp}.historical_shrinkage_rate_bps == 800"
            - "Employer.${emp}.partnership_signed == false"
            - "Employer.${emp}.status == PROSPECT"
            - "Employer.${emp}.suspended_reason is null"
            - "Employer.${emp}.active_campaign_count == 0"

      - name: campaign_get_returns_stored_inputs_and_computed_totals
        claim_type: Retrieval
        grounds:
          - entities.Campaign
          - endpoints.GET /fundraising/campaigns/{id}
          - endpoints.POST /fundraising/campaigns
        distinguishing_aspect: |
          GET /campaigns/{id} after PLANNED -> OPEN returns the four stored inputs unchanged plus
          posture OPEN, every money aggregate still 0.00 and every provisional/final loss field
          still null, proving the read surfaces stored and computed state rather than recomputing
          the loss estimate on read.
        test_recipe:
          setup:
            - "One ACTIVE employer, one campaign of that employer driven PLANNED -> OPEN, no pledges yet."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Clearwater Mutual", employee_count: 180 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30", loss_reserve_amount: 500.00 }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/open"
              payload: {}
              as: UnitedFundAdmin
          trigger:
            - call: "GET /fundraising/campaigns/${camp}"
              payload: {}
              as: FinanceReviewer
              captures: { posture: $.data.posture, cgt: $.data.confirmed_gross_total }
          assert:
            - "HTTP 200"
            - "Campaign.${camp}.employer_id == ${emp}"
            - "Campaign.${camp}.campaign_year == 2026"
            - "Campaign.${camp}.solicitation_start_date == '2026-07-01'"
            - "Campaign.${camp}.solicitation_end_date == '2026-09-30'"
            - "Campaign.${camp}.loss_reserve_amount == 500.00"
            - "Campaign.${camp}.posture == OPEN"
            - "Campaign.${camp}.confirmed_gross_total == 0.00 and designated_gross_total == 0.00 and undesignated_gross_total == 0.00 and designation_fee_total == 0.00"
            - "Campaign.${camp}.provisional_estimated_loss is null and final_actual_loss is null and realized_shrinkage_rate_bps is null"
            - "Campaign.${camp}.solicitation_closed_at is null and reconciled_at is null"

      - name: pledge_list_filtered_by_campaign_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET /fundraising/pledges
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three pledges in one campaign: limit 2 offset 0 returns 2 rows with total_count 3 and
          has_more true; limit 2 offset 2 returns 1 row with total_count 3 and has_more false;
          omitting both params applies the declared defaults limit 10 offset 0 and returns all
          three with has_more false.
        test_recipe:
          setup:
            - "One OPEN campaign carrying three DRAFT pledges of 100.00, 200.00 and 300.00."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Brightline Rail", employee_count: 600 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "L-001", giving_method: "ONE_TIME_CHECK", gross_amount: 100.00 }
              as: UnitedFundAdmin
              captures: { pl1: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "L-002", giving_method: "CREDIT_CARD", gross_amount: 200.00 }
              as: UnitedFundAdmin
              captures: { pl2: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "L-003", giving_method: "STOCK_GIFT", gross_amount: 300.00 }
              as: UnitedFundAdmin
              captures: { pl3: $.data.id }
          trigger:
            - call: "GET /fundraising/pledges?campaign_id=${camp}&limit=2&offset=0"
              payload: {}
              as: UnitedFundAdmin
            - call: "GET /fundraising/pledges?campaign_id=${camp}&limit=2&offset=2"
              payload: {}
              as: UnitedFundAdmin
            - call: "GET /fundraising/pledges?campaign_id=${camp}"
              payload: {}
              as: UnitedFundAdmin
          assert:
            - "All three calls return HTTP 200 with response_type == 'array'"
            - "Call 1 returns exactly 2 Pledge rows; pagination fields total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Call 2 returns exactly 1 Pledge row; total_count == 3, has_more == false, limit == 2, offset == 2"
            - "Call 3 returns exactly 3 Pledge rows; total_count == 3, has_more == false, limit == 10, offset == 0 (declared pagination defaults)"
            - "Every returned row has campaign_id == ${camp}"

      - name: get_agency_with_unknown_uuid_returns_agency_not_found
        claim_type: Not Found
        grounds:
          - validations[priority=4]
          - errors[ERR_AGENCY_NOT_FOUND]
          - endpoints.GET /fundraising/agencies/{id}
        distinguishing_aspect: |
          A syntactically valid but unused UUID on GET /agencies/{id} returns HTTP 404 with
          error_id ERR_AGENCY_NOT_FOUND and the error envelope shape (data.error_id +
          data.message), not an empty 200 body.
        test_recipe:
          setup:
            - "One real agency exists so the collection is non-empty; the probed id belongs to nobody."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Northgate Shelter Network", ein: "600000002", primary_priority_area: "BASIC_NEEDS" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "GET /fundraising/agencies/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: UnitedFundAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == ERR_AGENCY_NOT_FOUND"
            - "response_type == 'error' and data.message is a non-empty string"
            - "Agency.${ag} is untouched: version == 1"

      - name: create_agency_missing_required_ein_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST /fundraising/agencies
        distinguishing_aspect: |
          Every field in POST /agencies' input: schema is required (none carries a default), so
          omitting ein alone returns HTTP 400 ERR_INVALID_REQUEST and persists no Agency row.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Halfway House Coalition", primary_priority_area: "BASIC_NEEDS" }
              as: UnitedFundAdmin
              captures: { eid: $.data.error_id }
          assert:
            - "HTTP 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "No Agency row was created (a subsequent GET of any id returns 404; the agency count is 0)"

      - name: employer_active_campaign_count_is_computed_on_campaign_open
        claim_type: Computed Fields
        grounds:
          - entities.Employer.fields.active_campaign_count
          - state_machines.Campaign.PLANNED_to_OPEN
          - endpoints.POST /fundraising/campaigns/{id}/open
          - endpoints.GET /fundraising/employers/{id}
        distinguishing_aspect: |
          active_campaign_count is source: computed and is not part of any input schema: it stays
          0 while the campaign is PLANNED and becomes 1 only as a side effect of the
          PLANNED -> OPEN transition, then 2 when a second campaign of the same employer opens.
        test_recipe:
          setup:
            - "One ACTIVE employer with two PLANNED campaigns whose solicitation windows do not overlap (2026-07-01..2026-08-01 and 2026-08-01..2026-09-01, half-open touching endpoints)."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Summit Dairy Cooperative", employee_count: 320 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-08-01" }
              as: UnitedFundAdmin
              captures: { camp1: $.data.id }
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-08-01", solicitation_end_date: "2026-09-01" }
              as: UnitedFundAdmin
              captures: { camp2: $.data.id }
            - call: "GET /fundraising/employers/${emp}"
              payload: {}
              as: UnitedFundAdmin
              captures: { acc0: $.data.active_campaign_count }
          trigger:
            - call: "POST /fundraising/campaigns/${camp1}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "GET /fundraising/employers/${emp}"
              payload: {}
              as: UnitedFundAdmin
              captures: { acc1: $.data.active_campaign_count }
            - call: "POST /fundraising/campaigns/${camp2}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "GET /fundraising/employers/${emp}"
              payload: {}
              as: UnitedFundAdmin
              captures: { acc2: $.data.active_campaign_count }
          assert:
            - "${acc0} == 0 (both campaigns still PLANNED)"
            - "${acc1} == 1 after the first open"
            - "${acc2} == 2 after the second open"
            - "Campaign.${camp1}.posture == OPEN and Campaign.${camp2}.posture == OPEN"

      - name: pledge_system_fields_are_server_minted_from_headers
        claim_type: System Fields
        grounds:
          - entities.Pledge.fields.recorded_by_coordinator_id
          - entities.CampaignCoordinator.fields.recorded_pledge_count
          - endpoints.POST /fundraising/campaigns/{id}/pledges
        distinguishing_aspect: |
          recorded_by_coordinator_id is source: system and is copied from the X-User-ID header of
          the CampaignCoordinator caller - it appears in no input schema, so the only way to set
          it is to act as that coordinator; id, created_at, updated_at and version are minted by
          the server (version 1, created_at == updated_at).
        test_recipe:
          setup:
            - "One ACTIVE employer with one LEAD coordinator and one OPEN campaign."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Copperfield Utilities", employee_count: 410 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/employers/${emp}/coordinators"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@copperfield.example", coordinator_role: "LEAD" }
              as: UnitedFundAdmin
              captures: { co: $.data.id }
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/open"
              payload: {}
              as: UnitedFundAdmin
          trigger:
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "S-001", giving_method: "PAYROLL_DEDUCTION", gross_amount: 240.00 }
              as: CampaignCoordinator
              as_user_id: "${co}"
              captures: { pl: $.data.id, rec: $.data.recorded_by_coordinator_id }
            - call: "GET /fundraising/employers/${emp}/coordinators"
              payload: {}
              as: UnitedFundAdmin
          assert:
            - "HTTP 201"
            - "Pledge.${pl}.recorded_by_coordinator_id == ${co}"
            - "Pledge.${pl}.campaign_id == ${camp}"
            - "Pledge.${pl}.designation_status == DRAFT and collection_status == PENDING"
            - "Pledge.${pl}.version == 1 and created_at == updated_at"
            - "CampaignCoordinator.${co}.recorded_pledge_count == 1 in the coordinators listing"

      - name: create_pledge_with_invalid_enum_giving_method_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Pledge.fields.giving_method
          - entities.Pledge.fields.gross_amount
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          giving_method is constrained to {PAYROLL_DEDUCTION, ONE_TIME_CHECK, CREDIT_CARD,
          STOCK_GIFT} and gross_amount to > 0 with at most 2 decimals: a non-member enum value,
          a 3-decimal amount and a zero amount each return HTTP 400 ERR_INVALID_REQUEST from
          priority 3, before any campaign-state check runs.
        test_recipe:
          setup:
            - "One OPEN campaign of an ACTIVE employer."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Anchor Bay Foods", employee_count: 275 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/open"
              payload: {}
              as: UnitedFundAdmin
          trigger:
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "T-001", giving_method: "BITCOIN", gross_amount: 100.00 }
              as: UnitedFundAdmin
              captures: { eid1: $.data.error_id }
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "T-002", giving_method: "CREDIT_CARD", gross_amount: 100.001 }
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "T-003", giving_method: "CREDIT_CARD", gross_amount: 0.00 }
              as: UnitedFundAdmin
          assert:
            - "All three calls return HTTP 400 with error_id == ERR_INVALID_REQUEST"
            - "Campaign.${camp}.confirmed_gross_total == 0.00 - no Pledge row was created by any of the three calls"

      - name: allocation_request_with_unknown_cycle_fk_returns_cycle_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.AllocationRequest.fields.cycle_id
          - entities.AllocationRequest.fields.agency_id
          - validations[priority=5]
          - errors[ERR_CYCLE_NOT_FOUND]
          - errors[ERR_AGENCY_NOT_FOUND]
        distinguishing_aspect: |
          AllocationRequest declares parent AllocationCycle plus a cross-aggregate Agency FK:
          an unused cycle_id returns ERR_CYCLE_NOT_FOUND and an unused agency_id returns
          ERR_AGENCY_NOT_FOUND, both 404 from priority 5, while the same body with both real ids
          creates the request in DRAFT.
        test_recipe:
          setup:
            - "One DRAFT allocation cycle and one APPLICANT agency; request creation itself needs no membership standing (that is checked at submission by priority 24)."
          setup_api_calls:
            - call: "POST /fundraising/allocation-cycles"
              payload: { cycle_year: 2026, focus_priority_area: "EDUCATION", opening_undesignated_pool: 300000.00, max_award_per_agency: 100000.00, request_window_start: "2026-07-01", request_window_end: "2026-10-01" }
              as: AllocationsDirector
              captures: { cyc: $.data.id }
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Willow Creek Youth Services", ein: "600000003", primary_priority_area: "EDUCATION" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /fundraising/allocation-requests"
              payload: { cycle_id: "22222222-2222-4222-8222-222222222222", agency_id: "${ag}", requested_amount: 40000.00, priority_area: "EDUCATION", narrative_summary: "After-school tutoring expansion." }
              as: UnitedFundAdmin
              captures: { eid1: $.data.error_id }
            - call: "POST /fundraising/allocation-requests"
              payload: { cycle_id: "${cyc}", agency_id: "33333333-3333-4333-8333-333333333333", requested_amount: 40000.00, priority_area: "EDUCATION", narrative_summary: "After-school tutoring expansion." }
              as: UnitedFundAdmin
            - call: "POST /fundraising/allocation-requests"
              payload: { cycle_id: "${cyc}", agency_id: "${ag}", requested_amount: 40000.00, priority_area: "EDUCATION", narrative_summary: "After-school tutoring expansion." }
              as: UnitedFundAdmin
              captures: { req: $.data.id, st: $.data.status }
          assert:
            - "Call 1 returns HTTP 404 with error_id == ERR_CYCLE_NOT_FOUND"
            - "Call 2 returns HTTP 404 with error_id == ERR_AGENCY_NOT_FOUND"
            - "Call 3 returns HTTP 201 with AllocationRequest.${req}.status == DRAFT, cycle_id == ${cyc}, agency_id == ${ag}"
            - "AllocationCycle.${cyc}.submitted_request_count == 0 (creation does not count as submission)"

      - name: panel_assignment_junction_is_listable_from_both_cycle_and_panelist
        claim_type: graph
        grounds:
          - entities.PanelAssignment
          - endpoints.GET /fundraising/allocation-cycles/{id}/panel-assignments
          - endpoints.GET /fundraising/panelists/{id}/panel-assignments
          - validations[priority=35]
        distinguishing_aspect: |
          PanelAssignment is the many-to-many junction of the graph topology: one panelist seated
          on two different cycles is reachable from either side (the panelist's assignment list
          holds 2 rows, each cycle's list holds 1), and priority 35 still forbids a second
          assignment of the same panelist to the same cycle.
        test_recipe:
          setup:
            - "Two DRAFT allocation cycles for different cycle_years and one panelist seated on both."
          setup_api_calls:
            - call: "POST /fundraising/panelists"
              payload: { full_name: "Marcus Hale", email: "marcus.hale@panel.example", expertise_area: "FINANCE" }
              as: AllocationsDirector
              captures: { p1: $.data.id }
            - call: "POST /fundraising/allocation-cycles"
              payload: { cycle_year: 2026, focus_priority_area: "EDUCATION", opening_undesignated_pool: 200000.00, max_award_per_agency: 80000.00, request_window_start: "2026-07-01", request_window_end: "2026-10-01" }
              as: AllocationsDirector
              captures: { cyc1: $.data.id }
            - call: "POST /fundraising/allocation-cycles"
              payload: { cycle_year: 2027, focus_priority_area: "HEALTH", opening_undesignated_pool: 200000.00, max_award_per_agency: 80000.00, request_window_start: "2027-07-01", request_window_end: "2027-10-01" }
              as: AllocationsDirector
              captures: { cyc2: $.data.id }
            - call: "POST /fundraising/allocation-cycles/${cyc1}/panel-assignments"
              payload: { panelist_id: "${p1}", conflict_declared: false, assignment_role: "CHAIR" }
              as: AllocationsDirector
              captures: { pa1: $.data.id }
            - call: "POST /fundraising/allocation-cycles/${cyc2}/panel-assignments"
              payload: { panelist_id: "${p1}", conflict_declared: false, assignment_role: "SCORER" }
              as: AllocationsDirector
              captures: { pa2: $.data.id }
          trigger:
            - call: "GET /fundraising/panelists/${p1}/panel-assignments"
              payload: {}
              as: AllocationsDirector
            - call: "GET /fundraising/allocation-cycles/${cyc1}/panel-assignments?assignment_role=CHAIR"
              payload: {}
              as: AllocationsDirector
            - call: "POST /fundraising/allocation-cycles/${cyc1}/panel-assignments"
              payload: { panelist_id: "${p1}", conflict_declared: false, assignment_role: "SCORER" }
              as: AllocationsDirector
              captures: { eid: $.data.error_id }
          assert:
            - "Call 1 returns HTTP 200 with total_count == 2; the two rows are ${pa1} (cycle_id ${cyc1}) and ${pa2} (cycle_id ${cyc2})"
            - "Call 2 returns HTTP 200 with total_count == 1 and the single row is ${pa1} with assignment_role == CHAIR"
            - "Call 3 returns HTTP 409 with error_id == ERR_DUPLICATE_PANEL_SCORE (one assignment per panelist per cycle)"
            - "PanelAssignment.${pa1}.submitted_score_count == 0 and PanelAssignment.${pa2}.submitted_score_count == 0"

  - section: state_machines
    instances:

      - name: allocation_cycle_initial_posture_is_draft_with_zero_available_pool
        claim_type: Initial State
        grounds:
          - state_machines.AllocationCycle.initial_state
          - entities.AllocationCycle.fields.posture
          - entities.AllocationCycle.fields.available_undesignated_pool
          - endpoints.POST /fundraising/allocation-cycles
        distinguishing_aspect: |
          A newly created cycle is DRAFT with available_undesignated_pool 0.00 even though
          opening_undesignated_pool is 300000.00 - the pool is only funded by the DRAFT -> OPEN
          transition's side effect, so a DRAFT cycle can award nothing.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /fundraising/allocation-cycles"
              payload: { cycle_year: 2026, focus_priority_area: "BASIC_NEEDS", opening_undesignated_pool: 300000.00, max_award_per_agency: 100000.00, request_window_start: "2026-07-01", request_window_end: "2026-10-01" }
              as: AllocationsDirector
              captures: { cyc: $.data.id, posture: $.data.posture, avail: $.data.available_undesignated_pool }
          assert:
            - "HTTP 201"
            - "AllocationCycle.${cyc}.posture == DRAFT"
            - "AllocationCycle.${cyc}.opening_undesignated_pool == 300000.00"
            - "AllocationCycle.${cyc}.available_undesignated_pool == 0.00"
            - "AllocationCycle.${cyc}.awarded_total == 0.00 and submitted_request_count == 0 and suspended_request_count == 0"
            - "AllocationCycle.${cyc}.suspended_request_ratio == 0.00 and awards_blocked == false"
            - "AllocationCycle.${cyc}.version == 1"

      - name: agency_review_creation_moves_applicant_to_under_financial_review
        claim_type: Valid Transition
        grounds:
          - state_machines.Agency.APPLICANT_to_UNDER_FINANCIAL_REVIEW
          - state_machines.AgencyReview.initial_state
          - calculations.agency_financial_standing_score
          - entities.Agency.fields.open_review_count
          - endpoints.POST /fundraising/agencies/{id}/reviews
        distinguishing_aspect: |
          Filing the first review is a system-driven transition on a different entity than the one
          addressed by the URL: the AgencyReview is created PENDING / SELF_REPORTED with
          preliminary_score 80.00 (audit points forced to 0 by the PRELIMINARY variant even though
          audit_opinion is UNQUALIFIED), and the Agency moves APPLICANT -> UNDER_FINANCIAL_REVIEW
          with open_review_count 1.
        test_recipe:
          setup:
            - "One APPLICANT agency, no reviews."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Eastbrook Health Partners", ein: "600000004", primary_priority_area: "HEALTH" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /fundraising/agencies/${ag}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.7800, admin_expense_ratio: 0.1900, months_operating_reserve: 4.00, governance_checklist_passed_count: 8, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev: $.data.id, prelim: $.data.preliminary_score }
            - call: "GET /fundraising/agencies/${ag}"
              payload: {}
              as: FinanceReviewer
              captures: { ms: $.data.membership_status, orc: $.data.open_review_count }
          assert:
            - "HTTP 201"
            - "AgencyReview.${rev}.status == PENDING and review_basis == SELF_REPORTED"
            - "AgencyReview.${rev}.preliminary_score == 80.00"
            - "AgencyReview.${rev}.certified_score is null and standards_met is null and restatement_penalty_applied == false"
            - "AgencyReview.${rev}.audited_program_expense_ratio is null and audited_admin_expense_ratio is null and audited_months_operating_reserve is null"
            - "Agency.${ag}.membership_status == UNDER_FINANCIAL_REVIEW"
            - "Agency.${ag}.open_review_count == 1"
            - "Agency.${ag}.latest_standing_score is null (only certify writes it)"

      - name: close_solicitation_on_planned_campaign_returns_campaign_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Campaign.transitions
          - validations[priority=12]
          - errors[ERR_CAMPAIGN_INVALID_STATE]
          - endpoints.POST /fundraising/campaigns/{id}/close-solicitation
        distinguishing_aspect: |
          PLANNED has exactly one outgoing trigger (open). Firing close-solicitation or reconcile
          from PLANNED returns HTTP 409 ERR_CAMPAIGN_INVALID_STATE and leaves posture PLANNED,
          solicitation_closed_at null and provisional_estimated_loss null - no side effect of the
          refused transition leaks.
        test_recipe:
          setup:
            - "One ACTIVE employer with a campaign still in PLANNED."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Redstone Quarry", employee_count: 140 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
          trigger:
            - call: "POST /fundraising/campaigns/${camp}/close-solicitation"
              payload: {}
              as: UnitedFundAdmin
              captures: { eid1: $.data.error_id }
            - call: "POST /fundraising/campaigns/${camp}/reconcile"
              payload: {}
              as: FinanceReviewer
          assert:
            - "Both calls return HTTP 409 with error_id == ERR_CAMPAIGN_INVALID_STATE"
            - "Campaign.${camp}.posture == PLANNED"
            - "Campaign.${camp}.solicitation_closed_at is null and reconciled_at is null"
            - "Campaign.${camp}.provisional_estimated_loss is null and final_actual_loss is null"
            - "Campaign.${camp}.version == 1 (no refused transition bumped it)"

      - name: certify_same_review_twice_returns_review_already_certified
        claim_type: Idempotency
        grounds:
          - state_machines.AgencyReview.PENDING_to_CERTIFIED
          - state_machines.AgencyReview.terminal_states
          - validations[priority=15]
          - errors[ERR_REVIEW_ALREADY_CERTIFIED]
        distinguishing_aspect: |
          certify is not idempotent: the first call moves the review PENDING -> CERTIFIED with
          certified_score 90.00 and the agency to GOOD_STANDING; replaying the identical body
          returns HTTP 409 ERR_REVIEW_ALREADY_CERTIFIED and the agency's version does not move a
          second time.
        test_recipe:
          setup:
            - "One agency in UNDER_FINANCIAL_REVIEW with one PENDING review: prog 0.7800, admin 0.1900, reserve 4.00 months, 8 governance items, UNQUALIFIED opinion."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Cedar Hills Family Center", ein: "600000005", primary_priority_area: "FINANCIAL_STABILITY" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.7800, admin_expense_ratio: 0.1900, months_operating_reserve: 4.00, governance_checklist_passed_count: 8, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev: $.data.id }
          trigger:
            - call: "POST /fundraising/agencies/${ag}/reviews/${rev}/certify"
              payload: { audited_program_expense_ratio: 0.7800, audited_admin_expense_ratio: 0.1900, audited_months_operating_reserve: 4.00 }
              as: FinanceReviewer
              captures: { cert: $.data.certified_score, st: $.data.status }
            - call: "GET /fundraising/agencies/${ag}"
              payload: {}
              as: FinanceReviewer
              captures: { ver1: $.data.version }
            - call: "POST /fundraising/agencies/${ag}/reviews/${rev}/certify"
              payload: { audited_program_expense_ratio: 0.7800, audited_admin_expense_ratio: 0.1900, audited_months_operating_reserve: 4.00 }
              as: FinanceReviewer
              captures: { eid: $.data.error_id }
          assert:
            - "Call 1 returns HTTP 200 with AgencyReview.${rev}.status == CERTIFIED, review_basis == AUDITED, certified_score == 90.00, standards_met == true, restatement_penalty_applied == false"
            - "Agency.${ag}.membership_status == GOOD_STANDING and latest_standing_score == 90.00 and open_review_count == 0"
            - "Call 3 returns HTTP 409 with error_id == ERR_REVIEW_ALREADY_CERTIFIED"
            - "After call 3, Agency.${ag}.version == ${ver1} (unchanged) and AgencyReview.${rev}.certified_score is still 90.00"

      - name: write_off_then_collect_on_written_off_pledge_returns_collection_terminal
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Pledge.collection_status.terminal_states
          - state_machines.Pledge.PENDING_to_WRITTEN_OFF
          - validations[priority=14]
          - errors[ERR_PLEDGE_COLLECTION_TERMINAL]
        distinguishing_aspect: |
          WRITTEN_OFF is terminal on the collection axis: neither a remittance nor a second
          write-off is accepted afterwards (both HTTP 409 ERR_PLEDGE_COLLECTION_TERMINAL), and
          uncollected_amount stays pinned at the full 500.00 written off.
        test_recipe:
          setup:
            - "One OPEN campaign with one CONFIRMED PAYROLL_DEDUCTION pledge of 500.00, then written off for TERMINATION with nothing collected."
          setup_api_calls:
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Union Pacific Grain", employee_count: 300 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "W-001", giving_method: "PAYROLL_DEDUCTION", gross_amount: 500.00 }
              as: UnitedFundAdmin
              captures: { pl: $.data.id }
            - call: "POST /fundraising/pledges/${pl}/confirm"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/pledges/${pl}/write-off"
              payload: { reason_code: "TERMINATION" }
              as: FinanceReviewer
              captures: { unc: $.data.uncollected_amount, cs: $.data.collection_status }
          trigger:
            - call: "POST /fundraising/pledges/${pl}/collections"
              payload: { amount: 100.00, remitted_on: "2026-08-01" }
              as: FinanceReviewer
              captures: { eid1: $.data.error_id }
            - call: "POST /fundraising/pledges/${pl}/write-off"
              payload: { reason_code: "DONOR_REVOKED" }
              as: FinanceReviewer
          assert:
            - "Both trigger calls return HTTP 409 with error_id == ERR_PLEDGE_COLLECTION_TERMINAL"
            - "Pledge.${pl}.collection_status == WRITTEN_OFF"
            - "Pledge.${pl}.write_off_reason_code == 'TERMINATION' (the second reason_code never lands)"
            - "Pledge.${pl}.collected_amount == 0.00 and uncollected_amount == 500.00"
            - "Pledge.${pl}.designation_status == CONFIRMED (the write-off touches only the collection axis)"

      - name: certify_second_review_on_suspended_agency_returns_membership_terminal
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AgencyReview.PENDING_to_CERTIFIED
          - state_machines.Agency.UNDER_FINANCIAL_REVIEW_to_SUSPENDED_MEMBERSHIP
          - validations[priority=16]
          - errors[ERR_AGENCY_MEMBERSHIP_TERMINAL]
          - calculations.agency_financial_standing_score
        distinguishing_aspect: |
          The certify transition carries three preconditions; this instance violates only the
          agency-side one. Two PENDING reviews are filed while the agency is still admissible,
          the first certifies to 0.00 (program 4.00 + reserve 5.00 + governance 0.00 + audit 0
          = 9.00 raw, minus a 30.00 admin penalty, clamped at 0) and drives
          SUSPENDED_MEMBERSHIP, after which certifying the second review is refused with
          ERR_AGENCY_MEMBERSHIP_TERMINAL rather than ERR_REVIEW_ALREADY_CERTIFIED.
        test_recipe:
          setup:
            - "One agency with two PENDING reviews (fiscal_year 2025 and 2024 - fiscal_year is unique per agency), both reporting prog 0.6600, admin 0.4000, reserve 1.00 month, 0 governance items, audit NONE."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Lakeshore Rescue Mission", ein: "600000006", primary_priority_area: "BASIC_NEEDS" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.6600, admin_expense_ratio: 0.4000, months_operating_reserve: 1.00, governance_checklist_passed_count: 0, audit_opinion: "NONE" }
              as: FinanceReviewer
              captures: { rev1: $.data.id, prelim1: $.data.preliminary_score }
            - call: "POST /fundraising/agencies/${ag}/reviews"
              payload: { fiscal_year: 2024, program_expense_ratio: 0.6600, admin_expense_ratio: 0.4000, months_operating_reserve: 1.00, governance_checklist_passed_count: 0, audit_opinion: "NONE" }
              as: FinanceReviewer
              captures: { rev2: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews/${rev1}/certify"
              payload: { audited_program_expense_ratio: 0.6600, audited_admin_expense_ratio: 0.4000, audited_months_operating_reserve: 1.00 }
              as: FinanceReviewer
              captures: { cert1: $.data.certified_score }
          trigger:
            - call: "POST /fundraising/agencies/${ag}/reviews/${rev2}/certify"
              payload: { audited_program_expense_ratio: 0.6600, audited_admin_expense_ratio: 0.4000, audited_months_operating_reserve: 1.00 }
              as: FinanceReviewer
              captures: { eid: $.data.error_id }
          assert:
            - "AgencyReview.${rev1}.preliminary_score == 0.00 and certified_score == 0.00 and standards_met == false"
            - "Agency.${ag}.membership_status == SUSPENDED_MEMBERSHIP and latest_standing_score == 0.00"
            - "Trigger returns HTTP 409 with error_id == ERR_AGENCY_MEMBERSHIP_TERMINAL"
            - "AgencyReview.${rev2}.status is still PENDING and certified_score is null"

      - name: panel_assignment_and_cycle_open_on_frozen_cycle_return_cycle_frozen
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.AllocationCycle.OPEN_to_FROZEN
