            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "00000000-0000-4000-8000-000000000002", slot_start_date: "2026-09-01T00:00:00Z", slot_end_date: "2026-09-15T00:00:00Z", reserved_price_cents: 30000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v}" }
