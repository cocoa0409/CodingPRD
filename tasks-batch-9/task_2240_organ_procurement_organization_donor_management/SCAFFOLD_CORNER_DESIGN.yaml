      - name: clearing_a_screening_with_a_confirmed_positive_nat_is_rejected
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 60]
          - errors.ERR_ABSOLUTE_CONTRAINDICATION
          - entities.SerologyResult.fields.absolute_contraindication_marker
        distinguishing_aspect: |
          The clearance gate reads a child row, not the screening's own inputs: one HIV_NAT POSITIVE
          with nat_confirmed true flips absolute_contraindication on the parent screening, and the
          director's CLEARED decision is then refused with 422 while a RULED_OUT decision on the very
          same screening is accepted.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-05T08:00:00Z."
            - "A PENDING screening with a filed risk assessment and one confirmed positive HIV NAT result."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T08:00:00Z" }
              as: OpoAdmin
            - call: "POST /opo/hospital-partners"
              payload: { name: "Mercy General", hospital_code: "MERCY", timely_referral_window_minutes: 60 }
