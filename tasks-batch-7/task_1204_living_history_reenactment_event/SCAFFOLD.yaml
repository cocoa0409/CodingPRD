# =============================================================================
# SCAFFOLD.yaml — Task 1204: Living History & Reenactment Event Management
# =============================================================================

scenario: |
  generate task hard than expert level! 1204. Living History & Reenactment Event Management (living history event organizer): participant registration & unit/impression vetting, authenticity standards & safety inspection of equipment, site layout (camps/demonstration areas) & schedule of programs, spectator ticketing & parking, insurance & landowner agreement, weather/fire restriction contingency, sutler/vendor row management, minor participation rules & supervision

domain_name: living-history-reenactment-event
api_prefix: "/"

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: posture_driven_gating
  # Event.event_posture + restriction_level (derived from open ContingencyAlerts)
  # gate nearly every child operation: registration, vetting, check-in, slot
  # confirmation, ticket sales, vendor contracting, settlement.
  secondary_archetype: temporal_windowing
  # ProgramSlot half-open intervals, AreaAllocation windows, Inspection fixed
  # 45-minute buffered windows, Agreement effective windows.
  complexity_layers:
    - optimistic_concurrency      # OCC on Event.version for PATCH + agreement supersede
    - cascading_side_effects      # unit-suspend depth-3 cascade; event-cancel depth-2 cascade
    - dual_variant_calculation    # ticket quote vs charge; vendor provisional vs final fee
    - rate_threshold_triggers     # supervision ratio, parking capacity, combatant minimums
  entity_topology: flat           # peer collections joined by FKs; no nested URL ownership
  state_machine_shape: cyclic     # Participant vetting loop; Event EVENT_OPEN<->RESTRICTED loop
  relationship_patterns:
    - one_to_many
    - self_referential            # Participant.supervisor_participant_id -> Participant.id
    - cross_aggregate             # Inspection -> EquipmentItem -> Participant -> Unit -> Event
  role_model: segregation_of_duties
  # Inspection.record recorded_by_user_id cannot equal the waiving SafetyOfficer's
  # X-User-ID; vetting (AuthenticityOfficer) is disjoint from inspection (SafetyOfficer)
  # and from event administration (EventOrganizer).
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Event
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Event display name" }
      - { name: site_name, type: string, source: input, description: "Venue / field name" }
      - { name: event_starts_at, type: datetime, source: input, description: "First public moment of the event (ISO 8601 UTC)" }
      - { name: event_ends_at, type: datetime, source: input, description: "Last scheduled moment of the event (ISO 8601 UTC)" }
      - { name: adult_day_price_cents, type: integer, source: input, description: "List price, adult single-day ticket" }
      - { name: child_day_price_cents, type: integer, source: input, description: "List price, child (under 13) single-day ticket" }
      - { name: adult_weekend_price_cents, type: integer, source: input, description: "List price, adult full-event pass" }
      - { name: child_weekend_price_cents, type: integer, source: input, description: "List price, child full-event pass" }
      - { name: early_bird_pct, type: number, source: input, description: "Early-bird discount fraction (e.g. 0.20)" }
      - { name: early_bird_cutoff_at, type: datetime, source: input, description: "Early-bird eligibility boundary; eligible when pricing timestamp <= cutoff (inclusive)" }
      - { name: service_fee_cents, type: integer, source: input, description: "Flat per-order fee added after line sum; never discounted" }
      - { name: refund_retain_pct, type: number, source: input, description: "Fraction of final_total_cents retained on a PATRON_CHOICE refund" }
      - { name: required_liability_cents, type: integer, source: input, description: "Minimum insurance coverage required to publish" }
      - { name: max_minor_per_adult, type: integer, source: input, description: "Supervision ratio: minors per checked-in adult per unit", default: 4 }
      - { name: vendor_frontage_rate_cents, type: integer, source: input, description: "Sutler booth rate per frontage foot per day" }
      - { name: vendor_multi_day_discount_pct, type: number, source: input, description: "Booth-fee discount fraction when requested_days >= 3" }
      - { name: vendor_min_fee_cents, type: integer, source: input, description: "Floor for booth fee before surcharges" }
      - { name: vendor_late_insurance_surcharge_cents, type: integer, source: input, description: "Flat surcharge added at settlement when insurance_uploaded_at > vendor_insurance_deadline_at" }
      - { name: vendor_insurance_deadline_at, type: datetime, source: input, description: "Insurance certificate deadline for sutlers" }
      - { name: event_posture, type: enum, source: system, description: "PLANNING | REGISTRATION_OPEN | PUBLISHED | EVENT_OPEN | RESTRICTED | COMPLETED | CANCELLED" }
      - { name: restriction_level, type: enum, source: computed, description: "GREEN | YELLOW | RED; derived from OPEN ContingencyAlerts: RED if any OPEN RED_FLAG, else YELLOW if any OPEN WATCH, else GREEN" }
      - { name: approved_combatant_count, type: integer, source: computed, description: "Count of Participants of this event with status IN {VETTED, CHECKED_IN}, impression_class = COMBATANT, whose unit (if any) has status = APPROVED" }
      - { name: cancelled_at, type: datetime, source: system, description: "Logical clock value at cancellation; null unless CANCELLED" }

  - name: Agreement
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: agreement_type, type: enum, source: input, description: "LANDOWNER_USE | INSURANCE_LIABILITY" }
      - { name: document_ref, type: string, source: input, description: "External document reference" }
      - { name: coverage_amount_cents, type: integer, source: input, description: "Liability coverage; required iff agreement_type = INSURANCE_LIABILITY", default: null }
      - { name: effective_from, type: datetime, source: input, description: "Start of in-force window (inclusive)" }
      - { name: effective_until, type: datetime, source: input, description: "End of in-force window (inclusive); in-force iff status = SIGNED and effective_from <= now <= effective_until" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | SIGNED | SUPERSEDED" }
      - { name: signed_at, type: datetime, source: system, description: "Logical clock value at signing; null until SIGNED" }
      - { name: signer_name, type: string, source: system, description: "Recorded from the sign call payload; null until SIGNED" }

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: name, type: string, source: input, description: "Unit roster name" }
      - { name: unit_type, type: enum, source: input, description: "MILITARY | CIVILIAN | ARTILLERY" }
      - { name: portrayal_name, type: string, source: input, description: "Portrayed historical unit" }
      - { name: headcount_estimate, type: integer, source: input, description: "Declared expected headcount", default: 0 }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | SUSPENDED" }
      - { name: vet_notes, type: string, source: system, description: "Notes from the most recent vet decision; null until vetted" }
      - { name: approved_combatant_count, type: integer, source: computed, description: "Count of this unit's Participants with status IN {VETTED, CHECKED_IN} and impression_class = COMBATANT" }

  - name: Participant
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; null for independent reenactors", default: null }
      - { name: supervisor_participant_id, type: string, source: input, description: "FK -> Participant.id; supervising adult; required before check-in when is_minor", default: null }
      - { name: full_name, type: string, source: input, description: "Participant legal name" }
      - { name: age_at_event, type: integer, source: input, description: "Age in years on the event's first day" }
      - { name: impression_class, type: enum, source: input, description: "COMBATANT | CIVILIAN | ARTILLERY_CREW" }
      - { name: persona_description, type: string, source: input, description: "Impression / garb description for authenticity vetting", default: "" }
      - { name: is_minor, type: boolean, source: computed, description: "true iff age_at_event < 18" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | CHANGES_REQUESTED | VETTED | CHECKED_IN | REJECTED | WITHDRAWN" }
      - { name: vet_notes, type: string, source: system, description: "Notes from the most recent vetting decision; null until vetted" }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical clock value at check-in; null until CHECKED_IN" }

  - name: EquipmentItem
    parent: null
    common_fields: true
    fields:
      - { name: participant_id, type: string, source: input, description: "FK -> Participant.id" }
      - { name: item_type, type: enum, source: input, description: "FIREARM | EDGED | CANNON | CAMP_FLAME | TENTAGE | OTHER" }
      - { name: description, type: string, source: input, description: "Item description (make, pattern, material)" }
      - { name: status, type: enum, source: system, description: "DECLARED | INSPECTION_DUE | PASSED | FAILED | WAIVED | BANNED | WITHDRAWN" }
      - { name: failure_count, type: integer, source: system, description: "Number of RECORDED_FAIL inspections; starts at 0; item auto-transitions FAILED -> BANNED when a failure makes failure_count = 2", default: 0 }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: equipment_item_id, type: string, source: input, description: "FK -> EquipmentItem.id" }
      - { name: inspection_kind, type: enum, source: input, description: "SAFETY | AUTHENTICITY" }
      - { name: scheduled_for, type: datetime, source: input, description: "Start of the fixed 45-minute inspection window" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | RECORDED_PASS | RECORDED_FAIL | WAIVED | CANCELLED" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the SafetyOfficer who recorded the outcome; null until recorded" }
      - { name: failure_reason, type: string, source: system, description: "Recorded from the record payload when outcome = FAIL; null otherwise" }
      - { name: waived_by_user_id, type: string, source: system, description: "X-User-ID of the waiving SafetyOfficer; MUST differ from recorded_by_user_id; null until WAIVED" }
      - { name: waiver_reason, type: string, source: system, description: "Recorded from the waive payload; null until WAIVED" }

  - name: SiteArea
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: area_name, type: string, source: input, description: "Area label (e.g. 'Union Camp North', 'Lot B')" }
      - { name: area_kind, type: enum, source: input, description: "CAMP | DEMO | PARKING | SUTLER | SPECTATOR" }
      - { name: capacity_units, type: integer, source: input, description: "Capacity in abstract units (tents / booth feet blocks / vehicle units)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CLOSED" }
      - { name: allocated_units, type: integer, source: computed, description: "PARKING: sum of units_used over ACTIVE ParkingPasses on this area; other kinds: sum of units over ACTIVE AreaAllocations on this area" }

  - name: AreaAllocation
    parent: null
    common_fields: true
    fields:
      - { name: site_area_id, type: string, source: input, description: "FK -> SiteArea.id" }
      - { name: unit_id, type: string, source: input, description: "FK -> Unit.id; exactly one of unit_id / vendor_id is non-null", default: null }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; exactly one of unit_id / vendor_id is non-null", default: null }
      - { name: starts_at, type: datetime, source: input, description: "Occupation window start (half-open)" }
      - { name: ends_at, type: datetime, source: input, description: "Occupation window end (half-open, exclusive)" }
      - { name: units, type: integer, source: input, description: "Capacity units consumed" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RELEASED" }

  - name: ProgramSlot
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: site_area_id, type: string, source: input, description: "FK -> SiteArea.id; area must have area_kind = DEMO" }
      - { name: title, type: string, source: input, description: "Program title (e.g. 'Artillery demonstration')" }
      - { name: starts_at, type: datetime, source: input, description: "Program window start (half-open)" }
      - { name: ends_at, type: datetime, source: input, description: "Program window end (half-open, exclusive)" }
      - { name: open_flame, type: boolean, source: input, description: "true when the program involves open flame / black powder", default: false }
      - { name: required_combatants, type: integer, source: input, description: "Minimum approved combatants required to confirm", default: 0 }
      - { name: status, type: enum, source: system, description: "PROPOSED | CONFIRMED | DONE | CANCELLED" }
      - { name: cancel_reason, type: string, source: system, description: "Reason recorded at cancellation (manual or contingency cascade); null until CANCELLED" }

  - name: TicketOrder
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: buyer_user_id, type: string, source: system, description: "X-User-ID of the creating Spectator; ownership anchor" }
      - { name: buyer_name, type: string, source: input, description: "Buyer display name" }
      - { name: lines, type: array, source: input, description: "Array of { line_type: ADULT_DAY | CHILD_DAY | ADULT_WEEKEND | CHILD_WEEKEND, quantity: integer >= 1 }; at least one line" }
      - { name: status, type: enum, source: system, description: "RESERVED | PAID | CHECKED_IN | REFUNDED | CANCELLED" }
      - { name: quoted_total_cents, type: integer, source: computed, description: "Provisional quote computed at creation time per ticket_order_pricing (provisional variant)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Charged amount computed at pay time per ticket_order_pricing (final variant); null until PAID" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Amount returned per ticket_refund_amount; null until REFUNDED" }
      - { name: retained_fee_cents, type: integer, source: computed, description: "Amount retained per ticket_refund_amount; null until REFUNDED" }
      - { name: refund_reason, type: enum, source: system, description: "PATRON_CHOICE | EVENT_CONTINGENCY; null until REFUNDED" }
      - { name: paid_at, type: datetime, source: system, description: "Logical clock value at payment; null until PAID" }
      - { name: refunded_at, type: datetime, source: system, description: "Logical clock value at refund; null until REFUNDED" }

  - name: ParkingPass
    parent: null
    common_fields: true
    fields:
      - { name: ticket_order_id, type: string, source: input, description: "FK -> TicketOrder.id" }
      - { name: site_area_id, type: string, source: system, description: "FK -> SiteArea.id (area_kind = PARKING); server-selected when omitted at issue, echoed here" }
      - { name: vehicle_plate, type: string, source: input, description: "Vehicle plate text" }
      - { name: vehicle_class, type: enum, source: input, description: "STANDARD | OVERSIZE" }
      - { name: units_used, type: integer, source: computed, description: "1 for STANDARD, 2 for OVERSIZE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: owner_user_id, type: string, source: system, description: "X-User-ID of the applying Vendor; ownership anchor" }
      - { name: business_name, type: string, source: input, description: "Sutler business name" }
      - { name: wares_description, type: string, source: input, description: "Goods offered (period wares)" }
      - { name: frontage_feet, type: integer, source: input, description: "Requested booth frontage in feet" }
      - { name: requested_days, type: integer, source: input, description: "Requested vending days" }
      - { name: status, type: enum, source: system, description: "APPLIED | APPROVED | CONTRACTED | SETTLED | REVOKED" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "Booth fee estimated at approval per vendor_booth_fee (provisional variant); null until APPROVED" }
      - { name: final_fee_cents, type: integer, source: computed, description: "Booth fee settled post-event per vendor_booth_fee (final variant); null until SETTLED" }
      - { name: fee_paid_cents, type: integer, source: system, description: "Cumulative booth-fee payments recorded at contract; starts at 0", default: 0 }
      - { name: insurance_cert_ref, type: string, source: system, description: "Certificate reference recorded from the contract payload; null until CONTRACTED" }
      - { name: insurance_uploaded_at, type: datetime, source: system, description: "Logical clock value at contract; null until CONTRACTED" }
      - { name: balance_due_cents, type: integer, source: computed, description: "final_fee_cents - fee_paid_cents, fixed at settlement; null until SETTLED" }

  - name: ContingencyAlert
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> Event.id" }
      - { name: alert_kind, type: enum, source: input, description: "WEATHER | FIRE | SECURITY" }
      - { name: severity, type: enum, source: input, description: "ADVISORY | WATCH | RED_FLAG" }
      - { name: message, type: string, source: input, description: "Free-text description of the condition" }
      - { name: status, type: enum, source: system, description: "OPEN | RESOLVED" }
      - { name: resolved_at, type: datetime, source: system, description: "Logical clock value at resolution; null until RESOLVED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Event
    initial_state: PLANNING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNING
        to: REGISTRATION_OPEN
        trigger: "POST /events/{event_id}/open-registration"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["increments Event.version by 1"]
      - from: REGISTRATION_OPEN
        to: PUBLISHED
        trigger: "POST /events/{event_id}/publish"
        actor: EventOrganizer
        preconditions:
          - "A LANDOWNER_USE Agreement for this event with status = SIGNED whose window covers the event (effective_from <= event_starts_at AND effective_until >= event_ends_at) exists (ERR_AGREEMENT_NOT_IN_FORCE)"
          - "An INSURANCE_LIABILITY Agreement for this event with status = SIGNED, window covering the event, and coverage_amount_cents >= Event.required_liability_cents exists (ERR_INSURANCE_COVERAGE_INSUFFICIENT)"
        side_effects: ["increments Event.version by 1"]
      - from: PUBLISHED
        to: EVENT_OPEN
        trigger: "POST /events/{event_id}/open-gates"
        actor: EventOrganizer
        preconditions:
          - "No ContingencyAlert for this event with status = OPEN and severity = RED_FLAG (ERR_RED_ALERTS_OPEN)"
        side_effects: ["increments Event.version by 1"]
      - from: EVENT_OPEN
        to: RESTRICTED
        trigger: "POST /events/{event_id}/restrict, or system when a RED_FLAG ContingencyAlert is created"
        actor: "SafetyOfficer, EventOrganizer, or system"
        preconditions: []
        side_effects:
          - "increments Event.version by 1"
          - "Every ProgramSlot of this event with open_flame = true and status IN {PROPOSED, CONFIRMED} transitions to CANCELLED with cancel_reason = 'CONTINGENCY'"
      - from: RESTRICTED
        to: EVENT_OPEN
        trigger: "POST /events/{event_id}/lift-restriction"
        actor: "SafetyOfficer, EventOrganizer"
        preconditions:
          - "No ContingencyAlert for this event with status = OPEN and severity = RED_FLAG (ERR_RED_ALERTS_OPEN)"
        side_effects: ["increments Event.version by 1"]
      - from: EVENT_OPEN
        to: COMPLETED
        trigger: "POST /events/{event_id}/complete"
        actor: EventOrganizer
        preconditions: []
        side_effects:
          - "increments Event.version by 1"
          - "Every ProgramSlot of this event with status = CONFIRMED transitions to DONE"
      - from: RESTRICTED
        to: COMPLETED
        trigger: "POST /events/{event_id}/complete"
        actor: EventOrganizer
        preconditions: []
        side_effects:
          - "increments Event.version by 1"
          - "Every ProgramSlot of this event with status = CONFIRMED transitions to DONE"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /events/{event_id}/cancel"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["event cancellation cascade (see CANCELLED note)"]
      - from: REGISTRATION_OPEN
        to: CANCELLED
        trigger: "POST /events/{event_id}/cancel"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["event cancellation cascade (see CANCELLED note)"]
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /events/{event_id}/cancel"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["event cancellation cascade (see CANCELLED note)"]
      - from: EVENT_OPEN
        to: CANCELLED
        trigger: "POST /events/{event_id}/cancel"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["event cancellation cascade (see CANCELLED note)"]
      - from: RESTRICTED
        to: CANCELLED
        trigger: "POST /events/{event_id}/cancel"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["event cancellation cascade (see CANCELLED note)"]
    note: |
      Event cancellation cascade (each hop caused by the previous):
      (1) Event -> CANCELLED sets cancelled_at = now and increments Event.version by 1;
      (2) every TicketOrder of this event in PAID transitions to REFUNDED using the
          EVENT_CONTINGENCY variant of ticket_refund_amount (retained_fee_cents = 0),
          every TicketOrder in RESERVED transitions to CANCELLED;
      (3) every ParkingPass whose order was refunded in hop (2) and whose status = ACTIVE
          transitions to VOIDED, decrementing its lot's allocated_units by units_used;
      also every ProgramSlot in PROPOSED or CONFIRMED -> CANCELLED ('EVENT_CANCELLED'),
      every AreaAllocation ACTIVE -> RELEASED (area allocated_units recomputed),
      every Vendor in APPROVED or CONTRACTED -> REVOKED ('EVENT_CANCELLED'),
      every ContingencyAlert OPEN -> RESOLVED (resolved_at = cancelled_at).

  - entity: Agreement
    initial_state: SUBMITTED
    terminal_states: [SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: SIGNED
        trigger: "POST /agreements/{agreement_id}/sign"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["sets signed_at = now", "sets signer_name from payload", "increments Agreement.version by 1"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a new Agreement of the same agreement_type is created for the same event"
        actor: system
        preconditions: []
        side_effects: ["increments Agreement.version by 1"]
      - from: SIGNED
        to: SUPERSEDED
        trigger: "system: a new Agreement of the same agreement_type is created for the same event"
        actor: system
        preconditions: []
        side_effects: ["increments Agreement.version by 1"]

  - entity: Unit
    initial_state: SUBMITTED
    terminal_states: [REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /units/{unit_id}/vet with decision = APPROVE"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["sets vet_notes from payload", "increments Unit.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /units/{unit_id}/vet with decision = REJECT"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["sets vet_notes from payload", "increments Unit.version by 1"]
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /units/{unit_id}/suspend"
        actor: EventOrganizer
        preconditions: []
        side_effects:
          - "increments Unit.version by 1"
          - "unit suspension cascade hop 1: every Participant with unit_id = this unit and status IN {SUBMITTED, CHANGES_REQUESTED, VETTED} transitions to WITHDRAWN"
          - "unit suspension cascade hop 2: for each Participant withdrawn in hop 1, every EquipmentItem of that participant with status IN {DECLARED, INSPECTION_DUE, FAILED} transitions to WITHDRAWN"
          - "unit suspension cascade hop 3: for each EquipmentItem withdrawn in hop 2, every Inspection of that item with status = SCHEDULED transitions to CANCELLED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /units/{unit_id}/vet with decision = APPROVE"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["sets vet_notes from payload", "increments Unit.version by 1", "note: participants withdrawn by the suspension cascade are NOT restored"]

  - entity: Participant
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /participants/{participant_id}/submit"
        actor: "UnitCommander, Participant"
        preconditions:
          - "If unit_id is non-null, the referenced Unit has status = APPROVED (ERR_INVALID_UNIT_STATUS)"
        side_effects: ["increments Participant.version by 1"]
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /participants/{participant_id}/submit (resubmission)"
        actor: "UnitCommander, Participant"
        preconditions:
          - "If unit_id is non-null, the referenced Unit has status = APPROVED (ERR_INVALID_UNIT_STATUS)"
        side_effects: ["increments Participant.version by 1"]
      - from: SUBMITTED
        to: VETTED
        trigger: "POST /participants/{participant_id}/vet with decision = APPROVE"
        actor: AuthenticityOfficer
        preconditions: []
        side_effects: ["sets vet_notes from payload", "increments Participant.version by 1", "recompute Event.approved_combatant_count and Unit.approved_combatant_count"]
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /participants/{participant_id}/vet with decision = REQUEST_CHANGES"
        actor: AuthenticityOfficer
        preconditions: []
        side_effects: ["sets vet_notes from payload", "increments Participant.version by 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /participants/{participant_id}/vet with decision = REJECT"
        actor: AuthenticityOfficer
        preconditions: []
        side_effects: ["sets vet_notes from payload", "increments Participant.version by 1"]
      - from: VETTED
        to: CHECKED_IN
        trigger: "POST /participants/{participant_id}/check-in"
        actor: "EventOrganizer, SafetyOfficer"
        preconditions:
          - "The referenced Event has event_posture = EVENT_OPEN (ERR_INVALID_EVENT_POSTURE)"
          - "If unit_id is non-null, the referenced Unit has status = APPROVED (ERR_INVALID_UNIT_STATUS)"
          - "No EquipmentItem of this participant with item_type IN {FIREARM, EDGED, CANNON, CAMP_FLAME} has status IN {DECLARED, INSPECTION_DUE, FAILED} (ERR_UNINSPECTED_EQUIPMENT)"
          - "If is_minor: supervisor_participant_id is non-null (ERR_SUPERVISOR_REQUIRED)"
          - "If is_minor: the supervisor Participant is an adult (age_at_event >= 18), has the same unit_id, and has status = CHECKED_IN (ERR_SUPERVISOR_INELIGIBLE)"
          - "If is_minor: (count of this unit's CHECKED_IN minors) + 1 <= Event.max_minor_per_adult * (count of this unit's CHECKED_IN adults) (ERR_SUPERVISION_RATIO_EXCEEDED)"
        side_effects: ["sets checked_in_at = now", "increments Participant.version by 1", "recompute Event.approved_combatant_count and Unit.approved_combatant_count"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /participants/{participant_id}/withdraw, or system (unit suspension cascade)"
        actor: "Participant, UnitCommander, EventOrganizer, or system"
        preconditions: []
        side_effects: ["increments Participant.version by 1", "every EquipmentItem of this participant with status IN {DECLARED, INSPECTION_DUE, FAILED} transitions to WITHDRAWN", "every Inspection of those items with status = SCHEDULED transitions to CANCELLED"]
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /participants/{participant_id}/withdraw, or system (unit suspension cascade)"
        actor: "Participant, UnitCommander, EventOrganizer, or system"
        preconditions: []
        side_effects: ["increments Participant.version by 1", "every EquipmentItem of this participant with status IN {DECLARED, INSPECTION_DUE, FAILED} transitions to WITHDRAWN", "every Inspection of those items with status = SCHEDULED transitions to CANCELLED"]
      - from: CHANGES_REQUESTED
        to: WITHDRAWN
        trigger: "POST /participants/{participant_id}/withdraw, or system (unit suspension cascade)"
        actor: "Participant, UnitCommander, EventOrganizer, or system"
        preconditions: []
        side_effects: ["increments Participant.version by 1", "every EquipmentItem of this participant with status IN {DECLARED, INSPECTION_DUE, FAILED} transitions to WITHDRAWN", "every Inspection of those items with status = SCHEDULED transitions to CANCELLED"]
      - from: VETTED
        to: WITHDRAWN
        trigger: "POST /participants/{participant_id}/withdraw, or system (unit suspension cascade)"
        actor: "Participant, UnitCommander, EventOrganizer, or system"
        preconditions: []
        side_effects: ["increments Participant.version by 1", "every EquipmentItem of this participant with status IN {DECLARED, INSPECTION_DUE, FAILED} transitions to WITHDRAWN", "every Inspection of those items with status = SCHEDULED transitions to CANCELLED"]
      - from: CHECKED_IN
        to: WITHDRAWN
        trigger: "POST /participants/{participant_id}/withdraw (mid-event departure)"
        actor: "Participant, UnitCommander, EventOrganizer"
        preconditions: []
        side_effects: ["increments Participant.version by 1", "recompute Event.approved_combatant_count and Unit.approved_combatant_count"]

  - entity: EquipmentItem
    initial_state: DECLARED
    terminal_states: [PASSED, WAIVED, BANNED, WITHDRAWN]
    transitions:
      - from: DECLARED
        to: INSPECTION_DUE
        trigger: "POST /equipment-items/{id}/inspections (schedules an Inspection)"
        actor: SafetyOfficer
        preconditions: []
        side_effects: ["increments EquipmentItem.version by 1"]
      - from: FAILED
        to: INSPECTION_DUE
        trigger: "POST /equipment-items/{id}/inspections (re-inspection)"
        actor: SafetyOfficer
        preconditions: []
        side_effects: ["increments EquipmentItem.version by 1"]
      - from: INSPECTION_DUE
        to: INSPECTION_DUE
        trigger: "POST /equipment-items/{id}/inspections (additional inspection, e.g. AUTHENTICITY after SAFETY)"
        actor: SafetyOfficer
        preconditions: []
        side_effects: ["increments EquipmentItem.version by 1"]
      - from: INSPECTION_DUE
        to: PASSED
        trigger: "system: an Inspection of this item transitions to RECORDED_PASS"
        actor: system
        preconditions: []
        side_effects: ["increments EquipmentItem.version by 1"]
      - from: INSPECTION_DUE
        to: FAILED
        trigger: "system: an Inspection of this item transitions to RECORDED_FAIL"
        actor: system
        preconditions: []
        side_effects: ["increments failure_count by 1", "if failure_count = 2, transition immediately to BANNED instead", "increments EquipmentItem.version by 1"]
      - from: FAILED
        to: WAIVED
        trigger: "system: the RECORDED_FAIL Inspection that caused the failure transitions to WAIVED"
        actor: system
        preconditions: []
        side_effects: ["increments EquipmentItem.version by 1"]
      - from: DECLARED
        to: WITHDRAWN
        trigger: "POST /equipment-items/{item_id}/withdraw, or system (participant/unit cascade)"
        actor: "Participant, UnitCommander, EventOrganizer, or system"
        preconditions: []
        side_effects: ["increments EquipmentItem.version by 1"]
      - from: INSPECTION_DUE
        to: WITHDRAWN
        trigger: "POST /equipment-items/{item_id}/withdraw, or system (participant/unit cascade)"
        actor: "Participant, UnitCommander, EventOrganizer, or system"
        preconditions: []
        side_effects: ["increments EquipmentItem.version by 1", "every Inspection of this item with status = SCHEDULED transitions to CANCELLED"]
      - from: FAILED
        to: WITHDRAWN
        trigger: "POST /equipment-items/{item_id}/withdraw, or system (participant/unit cascade)"
        actor: "Participant, UnitCommander, EventOrganizer, or system"
        preconditions: []
        side_effects: ["increments EquipmentItem.version by 1"]

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [RECORDED_PASS, WAIVED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: RECORDED_PASS
        trigger: "POST /inspections/{inspection_id}/record with outcome = PASS"
        actor: SafetyOfficer
        preconditions: []
        side_effects: ["sets recorded_by_user_id = X-User-ID", "the inspected EquipmentItem transitions INSPECTION_DUE -> PASSED", "every other SCHEDULED Inspection of the same item transitions to CANCELLED", "increments Inspection.version by 1"]
      - from: SCHEDULED
        to: RECORDED_FAIL
        trigger: "POST /inspections/{inspection_id}/record with outcome = FAIL"
        actor: SafetyOfficer
        preconditions: ["failure_reason payload field is required when outcome = FAIL (ERR_VALIDATION)"]
        side_effects: ["sets recorded_by_user_id = X-User-ID and failure_reason from payload", "the inspected EquipmentItem transitions INSPECTION_DUE -> FAILED (failure_count += 1; auto-BANNED at 2)", "every other SCHEDULED Inspection of the same item transitions to CANCELLED", "increments Inspection.version by 1"]
      - from: RECORDED_FAIL
        to: WAIVED
        trigger: "POST /inspections/{inspection_id}/waive"
        actor: SafetyOfficer
        preconditions:
          - "X-User-ID of the caller != recorded_by_user_id (segregation of duties, ERR_SOD_SELF_WAIVER)"
        side_effects: ["sets waived_by_user_id = X-User-ID and waiver_reason from payload", "the inspected EquipmentItem transitions FAILED -> WAIVED", "increments Inspection.version by 1"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (participant withdraw / unit suspension cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments Inspection.version by 1"]

  - entity: SiteArea
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /site-areas/{area_id}/close"
        actor: "EventOrganizer, SafetyOfficer"
        preconditions: []
        side_effects: ["increments SiteArea.version by 1"]

  - entity: AreaAllocation
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /allocations/{allocation_id}/release, or system (event cancellation cascade)"
        actor: "EventOrganizer, or system"
        preconditions: []
        side_effects: ["recompute the SiteArea.allocated_units of the referenced area", "increments AreaAllocation.version by 1"]

  - entity: ProgramSlot
    initial_state: PROPOSED
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: PROPOSED
        to: CONFIRMED
        trigger: "POST /program-slots/{slot_id}/confirm"
        actor: EventOrganizer
        preconditions:
          - "The referenced SiteArea has status = ACTIVE (ERR_AREA_NOT_ACTIVE)"
          - "If open_flame = true, the event's restriction_level = GREEN (ERR_OPEN_FLAME_RESTRICTED)"
          - "required_combatants <= the event's approved_combatant_count (ERR_VALIDATION)"
          - "The event has event_posture IN {PUBLISHED, EVENT_OPEN} (ERR_INVALID_EVENT_POSTURE)"
        side_effects: ["increments ProgramSlot.version by 1"]
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /program-slots/{slot_id}/cancel, or system (restriction cascade / event cancellation)"
        actor: "EventOrganizer, SafetyOfficer, or system"
        preconditions: []
        side_effects: ["sets cancel_reason from payload or cascade source", "increments ProgramSlot.version by 1"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /program-slots/{slot_id}/cancel, or system (restriction cascade / event cancellation)"
        actor: "EventOrganizer, SafetyOfficer, or system"
        preconditions: []
        side_effects: ["sets cancel_reason from payload or cascade source", "increments ProgramSlot.version by 1"]
      - from: CONFIRMED
        to: DONE
        trigger: "system: the event transitions to COMPLETED"
        actor: system
        preconditions: []
        side_effects: ["increments ProgramSlot.version by 1"]

  - entity: TicketOrder
    initial_state: RESERVED
    terminal_states: [CHECKED_IN, REFUNDED, CANCELLED]
    transitions:
      - from: RESERVED
        to: PAID
        trigger: "POST /ticket-orders/{order_id}/pay"
        actor: Spectator
        preconditions:
          - "X-User-ID = this order's buyer_user_id (ERR_FORBIDDEN)"
        side_effects: ["computes final_total_cents per ticket_order_pricing final variant using paid_at = now", "sets paid_at = now", "increments TicketOrder.version by 1"]
      - from: PAID
        to: CHECKED_IN
        trigger: "POST /ticket-orders/{order_id}/check-in"
        actor: EventOrganizer
        preconditions:
          - "The referenced Event has event_posture IN {EVENT_OPEN, RESTRICTED} (ERR_INVALID_EVENT_POSTURE)"
        side_effects: ["increments TicketOrder.version by 1"]
      - from: PAID
        to: REFUNDED
        trigger: "POST /ticket-orders/{order_id}/refund, or system (event cancellation cascade)"
        actor: "Spectator, EventOrganizer, or system"
        preconditions:
          - "Manual: X-User-ID = buyer_user_id when called as Spectator (ERR_FORBIDDEN)"
          - "Manual: event_posture NOT IN {COMPLETED, CANCELLED} for reason = PATRON_CHOICE (ERR_INVALID_EVENT_POSTURE)"
          - "Manual: reason = EVENT_CONTINGENCY requires event_posture = CANCELLED (ERR_INVALID_EVENT_POSTURE)"
        side_effects:
          - "computes refund_amount_cents and retained_fee_cents per ticket_refund_amount for the applicable variant; final_total_cents = refund_amount_cents + retained_fee_cents always holds"
          - "sets refund_reason, refunded_at = now"
          - "every ParkingPass of this order with status = ACTIVE transitions to VOIDED, decrementing its lot's allocated_units by units_used"
          - "increments TicketOrder.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "system (event cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: ["increments TicketOrder.version by 1"]

  - entity: ParkingPass
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /parking-passes/{pass_id}/void, or system (refund / event cancellation cascade)"
        actor: "Spectator, EventOrganizer, or system"
        preconditions:
          - "Manual: X-User-ID = the parent order's buyer_user_id when called as Spectator (ERR_FORBIDDEN)"
        side_effects: ["decrement the lot's allocated_units by units_used", "increments ParkingPass.version by 1"]

  - entity: Vendor
    initial_state: APPLIED
    terminal_states: [SETTLED, REVOKED]
    transitions:
      - from: APPLIED
        to: APPROVED
        trigger: "POST /vendors/{vendor_id}/approve"
        actor: EventOrganizer
        preconditions: []
        side_effects: ["computes provisional_fee_cents per vendor_booth_fee provisional variant", "increments Vendor.version by 1"]
      - from: APPROVED
        to: CONTRACTED
        trigger: "POST /vendors/{vendor_id}/contract"
        actor: Vendor
        preconditions:
          - "X-User-ID = this vendor's owner_user_id (ERR_FORBIDDEN)"
          - "The referenced Event has event_posture IN {REGISTRATION_OPEN, PUBLISHED} (ERR_INVALID_EVENT_POSTURE)"
        side_effects: ["sets insurance_cert_ref from payload, insurance_uploaded_at = now", "fee_paid_cents += payload fee_payment_cents", "increments Vendor.version by 1"]
      - from: CONTRACTED
        to: SETTLED
        trigger: "POST /vendors/{vendor_id}/settle"
        actor: EventOrganizer
        preconditions:
          - "The referenced Event has event_posture = COMPLETED (ERR_INVALID_EVENT_POSTURE)"
          - "A LANDOWNER_USE Agreement for this event with status = SIGNED and in force at settlement time exists (ERR_AGREEMENT_NOT_IN_FORCE)"
          - "fee_paid_cents >= provisional_fee_cents (ERR_VENDOR_BALANCE_OUTSTANDING)"
        side_effects: ["computes final_fee_cents per vendor_booth_fee final variant (late-insurance surcharge applied when insurance_uploaded_at > event.vendor_insurance_deadline_at)", "sets balance_due_cents = final_fee_cents - fee_paid_cents", "increments Vendor.version by 1"]
      - from: APPLIED
        to: REVOKED
        trigger: "POST /vendors/{vendor_id}/revoke, or system (event cancellation cascade)"
        actor: "EventOrganizer, SafetyOfficer, or system"
        preconditions: []
        side_effects: ["every ACTIVE AreaAllocation with vendor_id = this vendor transitions to RELEASED", "increments Vendor.version by 1"]
      - from: APPROVED
        to: REVOKED
        trigger: "POST /vendors/{vendor_id}/revoke, or system (event cancellation cascade)"
        actor: "EventOrganizer, SafetyOfficer, or system"
        preconditions: []
        side_effects: ["every ACTIVE AreaAllocation with vendor_id = this vendor transitions to RELEASED", "increments Vendor.version by 1"]
      - from: CONTRACTED
        to: REVOKED
        trigger: "POST /vendors/{vendor_id}/revoke, or system (event cancellation cascade)"
        actor: "EventOrganizer, SafetyOfficer, or system"
        preconditions: []
        side_effects: ["every ACTIVE AreaAllocation with vendor_id = this vendor transitions to RELEASED", "increments Vendor.version by 1"]

  - entity: ContingencyAlert
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /contingency-alerts/{alert_id}/resolve, or system (event cancellation cascade)"
        actor: "SafetyOfficer, or system"
        preconditions: []
        side_effects: ["sets resolved_at = now", "recompute the event's restriction_level from remaining OPEN alerts", "increments ContingencyAlert.version by 1"]
    note: |
      Creating a ContingencyAlert (always OPEN) recomputes the event's restriction_level;
      when the recomputed level is RED and event_posture = EVENT_OPEN, the system
      transitions the Event EVENT_OPEN -> RESTRICTED with its documented side effects.

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: event-patch-stale-version
    parent_entity: Event
    write_endpoint: "PATCH /events/{event_id}"
    occ_field: "expected_event_version"
    description: |
      Updating an Event's mutable settings requires the client to present the
      Event.version it last observed; if the stored version has advanced since,
      the update is rejected as stale. This captures the case where another
      organizer has modified the event (or created an agreement, which also
      bumps Event.version) since the client read it.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: agreement-create-stale-event
    parent_entity: Event
    write_endpoint: "POST /events/{id}/agreements"
    occ_field: "expected_event_version"
    description: |
      Creating an Agreement against an Event whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just created a same-type agreement (which legitimately
      supersedes the prior one) and the current writer's view of the event is
      therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ticket_order_pricing
    trigger: "POST /events/{id}/ticket-orders (provisional variant, sets quoted_total_cents); POST /ticket-orders/{order_id}/pay (final variant, sets final_total_cents)"
    algorithm: aggregation
    formula: |
      for each line in TicketOrder.lines (processed in array order):
        unit = price_for(line.line_type)            # adult_day_price_cents / child_day_price_cents /
                                                    # adult_weekend_price_cents / child_weekend_price_cents
        line_cents = unit * line.quantity
        if pricing_ts <= event.early_bird_cutoff_at:   # INCLUSIVE boundary
          line_cents = line_cents * (1 - event.early_bird_pct)
        line_cents = round_half_up(line_cents)      # ROUND PER LINE, BEFORE SUM — pinned order
      total = sum(line_cents over all lines) + event.service_fee_cents   # fee added AFTER sum, never discounted
      where pricing_ts = created_at (provisional variant) or paid_at = now (final variant)
    input_set: "All lines of the order (every line has quantity >= 1). Early-bird eligibility is re-evaluated against the variant's own pricing timestamp, not carried over."
    constants:
      ROUNDING: "round_half_up to integer cents, applied per line before summation"
    precision: "integer cents, round_half_up per line, then sum, then add service fee"
    variants:
      - name: provisional_quote
        when: "order creation (status RESERVED)"
        difference: "pricing_ts = order created_at; result stored in quoted_total_cents; never charged"
      - name: final_charge
        when: "payment (RESERVED -> PAID)"
        difference: "pricing_ts = paid_at (logical clock now); early-bird eligibility re-evaluated — an order created before the cutoff but paid after it is charged the undiscounted price"

  - name: ticket_refund_amount
    trigger: "POST /ticket-orders/{order_id}/refund (variant selected by reason); system event cancellation cascade (always EVENT_CONTINGENCY variant)"
    algorithm: threshold
    formula: |
      PATRON_CHOICE variant:
        retained_fee_cents = round_half_up(final_total_cents * event.refund_retain_pct)
        refund_amount_cents = final_total_cents - retained_fee_cents
      EVENT_CONTINGENCY variant:
        total_days = (date(event.event_ends_at) - date(event.event_starts_at)) + 1
        elapsed_days = clamp((date(event.cancelled_at) - date(event.event_starts_at)), 0, total_days)
        retained_fee_cents = 0
        refund_amount_cents = round_half_up(final_total_cents * (total_days - elapsed_days) / total_days)
      invariant: refund_amount_cents + retained_fee_cents = final_total_cents
    input_set: "The single TicketOrder being refunded (must be PAID). final_total_cents is the charged amount, never the quote."
    constants:
      ROUNDING: "round_half_up to integer cents"
    precision: "integer cents, round_half_up"
    variants:
      - name: patron_choice
        when: "refund with reason = PATRON_CHOICE"
        difference: "retains round_half_up(final_total_cents * refund_retain_pct); no day pro-rating"
      - name: event_contingency
        when: "refund with reason = EVENT_CONTINGENCY (manual) or the event cancellation cascade"
        difference: "retains 0; pro-rates by unused event days measured from event_starts_at to cancelled_at"

  - name: vendor_booth_fee
    trigger: "POST /vendors/{vendor_id}/approve (provisional variant, sets provisional_fee_cents); POST /vendors/{vendor_id}/settle (final variant, sets final_fee_cents and balance_due_cents)"
    algorithm: threshold
    formula: |
      base = vendor.frontage_feet * vendor.requested_days * event.vendor_frontage_rate_cents
      if vendor.requested_days >= 3:
        base = round_half_up(base * (1 - event.vendor_multi_day_discount_pct))
      fee = max(base, event.vendor_min_fee_cents)
      FINAL VARIANT ONLY:
        if vendor.insurance_uploaded_at > event.vendor_insurance_deadline_at:   # STRICT >
          fee = fee + event.vendor_late_insurance_surcharge_cents
      balance_due_cents = final_fee_cents - fee_paid_cents      # final variant only
    input_set: "The single Vendor. Provisional uses the same frontage/days inputs but never applies the late-insurance surcharge; final adds the surcharge when the insurance certificate arrived strictly after the deadline."
    constants:
      MULTI_DAY_THRESHOLD_DAYS: 3
      ROUNDING: "round_half_up to integer cents"
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional_at_approval
        when: "APPLIED -> APPROVED"
        difference: "no late-insurance surcharge (insurance not yet due); result = max(round_half_up(frontage*days*rate*(1-discount if days>=3)), min_fee)"
      - name: final_at_settlement
        when: "CONTRACTED -> SETTLED"
        difference: "adds vendor_late_insurance_surcharge_cents when insurance_uploaded_at > vendor_insurance_deadline_at; identical inputs therefore produce a higher fee when insurance was late"

  - name: supervision_ratio_check
    trigger: "POST /participants/{participant_id}/check-in when the participant's is_minor = true"
    algorithm: threshold
    formula: |
      let unit = participant.unit_id
      adults_checked_in = count of Participants p where p.unit_id = unit, p.status = CHECKED_IN, p.age_at_event >= 18
      minors_checked_in = count of Participants p where p.unit_id = unit, p.status = CHECKED_IN, p.age_at_event < 18
      allowed iff: minors_checked_in + 1 <= event.max_minor_per_adult * adults_checked_in   # INCLUSIVE <=
    input_set: "Participants of the SAME unit only (unit_id equality; the independent participant case has unit_id null and is handled by the supervisor rules, not this ratio). Both counts are taken at check-in time, after the supervisor's own check-in."
    constants: {}
    precision: "integer comparison, no rounding"

  - name: parking_lot_allocation
    trigger: "POST /ticket-orders/{id}/parking-passes (capacity check + optional lot selection); recomputed on issue and on void"
    algorithm: aggregation
    formula: |
      units_needed = 2 if vehicle_class = OVERSIZE else 1
      lot.allocated_units = sum of units_used over ParkingPasses with site_area_id = lot.id and status = ACTIVE
      explicit-lot issue allowed iff: lot.allocated_units + units_needed <= lot.capacity_units   # INCLUSIVE <=
      when site_area_id is omitted, server selects the lot (selector, deterministic):
        eligibility: SiteAreas of this event with area_kind = PARKING, status = ACTIVE,
                     and capacity_units - allocated_units >= units_needed
        ranking:     (capacity_units - allocated_units) DESC
        tie-break:   created_at ASC (never id)
        empty pool:  reject with ERR_NO_PARKING_AVAILABLE
    input_set: "ParkingPasses with status = ACTIVE only; VOIDED passes never count."
    constants:
      OVERSIZE_UNITS: 2
      STANDARD_UNITS: 1
    precision: "integer units, no rounding"

  - name: approved_combatant_count
    trigger: "recomputed on Participant vet-approve, check-in, withdraw, and on unit suspension; read by ProgramSlot confirmation"
    algorithm: aggregation
    formula: |
      Event.approved_combatant_count = count of Participants p where p.event_id = event.id,
        p.status IN {VETTED, CHECKED_IN}, p.impression_class = COMBATANT,
        and (p.unit_id is null OR unit(p.unit_id).status = APPROVED)
      Unit.approved_combatant_count = count of Participants p where p.unit_id = unit.id,
        p.status IN {VETTED, CHECKED_IN}, p.impression_class = COMBATANT
    input_set: "Only statuses VETTED and CHECKED_IN count; DRAFT, SUBMITTED, CHANGES_REQUESTED, REJECTED, WITHDRAWN never count. Participants of a SUSPENDED unit drop out of the event-level count while suspended."
    constants: {}
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role header names a declared role and (for non-creation calls) X-User-ID header is present", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles; entity-backed ownership: UnitCommander acts only on its own unit and that unit's participants/equipment, Participant acts only on itself, Vendor acts only on itself, Spectator acts only on orders/passes whose buyer_user_id = X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "{event_id} in path or body resolves to an Event", error_id: ERR_EVENT_NOT_FOUND, http_status: 404, applies_to: "event-scoped endpoints, POST /units, POST /participants, POST /equipment-items (via participant), POST /events/{id}/ticket-orders, POST /events/{id}/vendors, POST /events/{id}/site-areas, POST /events/{id}/program-slots, POST /events/{id}/agreements, POST /events/{id}/contingency-alerts" }
  - { priority: 3, category: existence, check: "{unit_id} in path or body resolves to a Unit", error_id: ERR_UNIT_NOT_FOUND, http_status: 404, applies_to: "unit-scoped endpoints, POST /participants, POST /site-areas/{area_id}/allocations, GET /participants?unit_id=" }
  - { priority: 3, category: existence, check: "{participant_id} in path or body resolves to a Participant; supervisor_participant_id when non-null resolves to a Participant", error_id: ERR_PARTICIPANT_NOT_FOUND, http_status: 404, applies_to: "participant-scoped endpoints, POST /equipment-items, POST /participants" }
  - { priority: 3, category: existence, check: "{item_id} resolves to an EquipmentItem", error_id: ERR_EQUIPMENT_NOT_FOUND, http_status: 404, applies_to: "equipment-scoped endpoints" }
  - { priority: 3, category: existence, check: "{inspection_id} resolves to an Inspection", error_id: ERR_INSPECTION_NOT_FOUND, http_status: 404, applies_to: "inspection-scoped endpoints" }
  - { priority: 3, category: existence, check: "{area_id} in path or body resolves to a SiteArea", error_id: ERR_AREA_NOT_FOUND, http_status: 404, applies_to: "area-scoped endpoints, POST /events/{id}/program-slots, POST /ticket-orders/{id}/parking-passes" }
  - { priority: 3, category: existence, check: "{slot_id} resolves to a ProgramSlot", error_id: ERR_SLOT_NOT_FOUND, http_status: 404, applies_to: "slot-scoped endpoints" }
  - { priority: 3, category: existence, check: "{order_id} resolves to a TicketOrder", error_id: ERR_ORDER_NOT_FOUND, http_status: 404, applies_to: "order-scoped endpoints" }
  - { priority: 3, category: existence, check: "{pass_id} resolves to a ParkingPass", error_id: ERR_PASS_NOT_FOUND, http_status: 404, applies_to: "pass-scoped endpoints" }
  - { priority: 3, category: existence, check: "{vendor_id} in path or body resolves to a Vendor", error_id: ERR_VENDOR_NOT_FOUND, http_status: 404, applies_to: "vendor-scoped endpoints, POST /site-areas/{area_id}/allocations" }
  - { priority: 3, category: existence, check: "{agreement_id} resolves to an Agreement", error_id: ERR_AGREEMENT_NOT_FOUND, http_status: 404, applies_to: "agreement-scoped endpoints" }
  - { priority: 3, category: existence, check: "{alert_id} resolves to a ContingencyAlert", error_id: ERR_ALERT_NOT_FOUND, http_status: 404, applies_to: "alert-scoped endpoints" }
  - { priority: 3, category: existence, check: "{allocation_id} resolves to an AreaAllocation", error_id: ERR_ALLOCATION_NOT_FOUND, http_status: 404, applies_to: "allocation-scoped endpoints" }
  - { priority: 4, category: state, check: "OCC: expected_event_version equals the Event's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /events/{event_id}, POST /events/{id}/agreements" }
  - { priority: 5, category: state, check: "Event posture permits the operation: lifecycle endpoints require their from-state; POST /units, POST /participants, POST /events/{id}/vendors require {REGISTRATION_OPEN, PUBLISHED}; POST /events/{id}/ticket-orders requires {PUBLISHED, EVENT_OPEN}; POST /events/{id}/program-slots requires {PUBLISHED, EVENT_OPEN}; POST /events/{id}/contingency-alerts requires {PUBLISHED, EVENT_OPEN, RESTRICTED}; POST /events/{id}/site-areas requires {PLANNING, REGISTRATION_OPEN, PUBLISHED}; POST /site-areas/{id}/allocations requires {REGISTRATION_OPEN, PUBLISHED, EVENT_OPEN}; participant check-in requires EVENT_OPEN; order check-in requires {EVENT_OPEN, RESTRICTED}; vendor contract requires {REGISTRATION_OPEN, PUBLISHED}; vendor settle requires COMPLETED; PATRON_CHOICE refund requires posture NOT IN {COMPLETED, CANCELLED} and EVENT_CONTINGENCY refund requires CANCELLED; PATCH requires {PLANNING, REGISTRATION_OPEN}", error_id: ERR_INVALID_EVENT_POSTURE, http_status: 409, applies_to: "event lifecycle + posture-gated endpoints" }
  - { priority: 5, category: state, check: "Unit in a valid from-state for vet/suspend (vet: SUBMITTED or SUSPENDED; suspend: APPROVED)", error_id: ERR_INVALID_UNIT_STATUS, http_status: 409, applies_to: "POST /units/{unit_id}/vet, POST /units/{unit_id}/suspend" }
  - { priority: 5, category: state, check: "Participant in a valid from-state (submit: DRAFT or CHANGES_REQUESTED; vet: SUBMITTED; check-in: VETTED; withdraw: any non-terminal); equipment declaration requires participant NOT IN {REJECTED, WITHDRAWN}", error_id: ERR_INVALID_PARTICIPANT_STATUS, http_status: 409, applies_to: "participant action endpoints, POST /equipment-items" }
  - { priority: 5, category: state, check: "Participant's unit (when unit_id non-null) has status = APPROVED for submit and check-in; a SUSPENDED unit blocks both", error_id: ERR_INVALID_UNIT_STATUS, http_status: 409, applies_to: "POST /participants/{participant_id}/submit, POST /participants/{participant_id}/check-in" }
  - { priority: 5, category: state, check: "EquipmentItem in a valid from-state (schedule inspection: DECLARED, FAILED, or INSPECTION_DUE; withdraw: DECLARED, INSPECTION_DUE, or FAILED)", error_id: ERR_INVALID_EQUIPMENT_STATUS, http_status: 409, applies_to: "POST /equipment-items/{id}/inspections, POST /equipment-items/{item_id}/withdraw" }
  - { priority: 5, category: state, check: "Inspection in a valid from-state (record: SCHEDULED; waive: RECORDED_FAIL)", error_id: ERR_INVALID_INSPECTION_STATUS, http_status: 409, applies_to: "POST /inspections/{inspection_id}/record, POST /inspections/{inspection_id}/waive" }
  - { priority: 5, category: state, check: "ProgramSlot in a valid from-state (confirm: PROPOSED; cancel: PROPOSED or CONFIRMED)", error_id: ERR_INVALID_SLOT_STATUS, http_status: 409, applies_to: "POST /program-slots/{slot_id}/confirm, POST /program-slots/{slot_id}/cancel" }
  - { priority: 5, category: state, check: "TicketOrder in a valid from-state (pay: RESERVED; check-in: PAID; refund: PAID; parking-passes issue: PAID)", error_id: ERR_INVALID_ORDER_STATUS, http_status: 409, applies_to: "order action endpoints, POST /ticket-orders/{id}/parking-passes" }
  - { priority: 5, category: state, check: "ParkingPass in a valid from-state (void: ACTIVE)", error_id: ERR_INVALID_PASS_STATUS, http_status: 409, applies_to: "POST /parking-passes/{pass_id}/void" }
  - { priority: 5, category: state, check: "Vendor in a valid from-state (approve: APPLIED; contract: APPROVED; settle: CONTRACTED; revoke: APPLIED, APPROVED, or CONTRACTED)", error_id: ERR_INVALID_VENDOR_STATUS, http_status: 409, applies_to: "vendor action endpoints" }
  - { priority: 5, category: state, check: "Agreement in a valid from-state (sign: SUBMITTED)", error_id: ERR_INVALID_AGREEMENT_STATUS, http_status: 409, applies_to: "POST /agreements/{agreement_id}/sign" }
  - { priority: 5, category: state, check: "ContingencyAlert in a valid from-state (resolve: OPEN)", error_id: ERR_INVALID_ALERT_STATUS, http_status: 409, applies_to: "POST /contingency-alerts/{alert_id}/resolve" }
  - { priority: 5, category: state, check: "SiteArea status = ACTIVE for new slots, confirmations, allocations, and explicit-lot parking issues", error_id: ERR_AREA_NOT_ACTIVE, http_status: 409, applies_to: "POST /events/{id}/program-slots, POST /program-slots/{slot_id}/confirm, POST /site-areas/{area_id}/allocations, POST /ticket-orders/{id}/parking-passes" }
  - { priority: 6, category: business_safety, check: "Check-in: no EquipmentItem of the participant with item_type IN {FIREARM, EDGED, CANNON, CAMP_FLAME} has status IN {DECLARED, INSPECTION_DUE, FAILED}", error_id: ERR_UNINSPECTED_EQUIPMENT, http_status: 409, applies_to: "POST /participants/{participant_id}/check-in" }
  - { priority: 6, category: business_safety, check: "Check-in of a minor: supervisor_participant_id is non-null", error_id: ERR_SUPERVISOR_REQUIRED, http_status: 422, applies_to: "POST /participants/{participant_id}/check-in" }
  - { priority: 6, category: business_safety, check: "Check-in of a minor: supervisor is an adult (age_at_event >= 18), has the same unit_id, and has status = CHECKED_IN", error_id: ERR_SUPERVISOR_INELIGIBLE, http_status: 422, applies_to: "POST /participants/{participant_id}/check-in" }
  - { priority: 6, category: business_safety, check: "Check-in of a minor: supervision_ratio_check allows one more minor (inclusive boundary)", error_id: ERR_SUPERVISION_RATIO_EXCEEDED, http_status: 409, applies_to: "POST /participants/{participant_id}/check-in" }
  - { priority: 6, category: business_safety, check: "ProgramSlot confirmation with open_flame = true requires the event's restriction_level = GREEN", error_id: ERR_OPEN_FLAME_RESTRICTED, http_status: 409, applies_to: "POST /program-slots/{slot_id}/confirm" }
  - { priority: 6, category: business_safety, check: "open-gates and lift-restriction require no OPEN RED_FLAG ContingencyAlert on the event", error_id: ERR_RED_ALERTS_OPEN, http_status: 409, applies_to: "POST /events/{event_id}/open-gates, POST /events/{event_id}/lift-restriction" }
  - { priority: 6, category: business_safety, check: "Segregation of duties: waiving SafetyOfficer's X-User-ID must differ from the inspection's recorded_by_user_id", error_id: ERR_SOD_SELF_WAIVER, http_status: 403, applies_to: "POST /inspections/{inspection_id}/waive" }
  - { priority: 7, category: business_constraint, check: "Request body shape: required fields present, enum members valid, integers in range, quantity >= 1, lines non-empty, supervisor_participant_id != own id, coverage_amount_cents present iff agreement_type = INSURANCE_LIABILITY, failure_reason present iff outcome = FAIL, ProgramSlot.required_combatants <= event.approved_combatant_count at confirm", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 7, category: business_constraint, check: "Participant's unit (when unit_id non-null) belongs to the same event as the participant", error_id: ERR_UNIT_NOT_IN_EVENT, http_status: 422, applies_to: "POST /participants" }
  - { priority: 7, category: business_constraint, check: "ProgramSlot half-open overlap: reject when another slot on the same site_area_id with status IN {PROPOSED, CONFIRMED} satisfies new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at; touching endpoints (new.starts_at = existing.ends_at) are NOT a conflict", error_id: ERR_SLOT_OVERLAP, http_status: 409, applies_to: "POST /events/{id}/program-slots" }
  - { priority: 7, category: business_constraint, check: "Inspection window conflict: each inspection occupies the fixed closed window [scheduled_for, scheduled_for + 45min]; reject when the new window expanded by 15 min on both sides intersects (touching counts) any other SCHEDULED inspection window of the SAME equipment item — schedule at exactly existing_end + 15min IS a conflict, +16min is not", error_id: ERR_INSPECTION_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /equipment-items/{id}/inspections" }
  - { priority: 7, category: business_constraint, check: "AreaAllocation half-open overlap: reject when another ACTIVE allocation on the same site_area_id satisfies new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at; touching endpoints are NOT a conflict", error_id: ERR_ALLOCATION_OVERLAP, http_status: 409, applies_to: "POST /site-areas/{area_id}/allocations" }
  - { priority: 7, category: business_constraint, check: "AreaAllocation must name exactly one occupying party: unit_id XOR vendor_id non-null", error_id: ERR_ALLOCATION_PARTY_REQUIRED, http_status: 422, applies_to: "POST /site-areas/{area_id}/allocations" }
  - { priority: 7, category: business_constraint, check: "Area kind fitness: ProgramSlot requires area_kind = DEMO; AreaAllocation requires area_kind IN {CAMP, SUTLER} (unit on CAMP, vendor on SUTLER); explicit-lot ParkingPass requires area_kind = PARKING", error_id: ERR_AREA_KIND_MISMATCH, http_status: 422, applies_to: "POST /events/{id}/program-slots, POST /site-areas/{area_id}/allocations, POST /ticket-orders/{id}/parking-passes" }
  - { priority: 7, category: business_constraint, check: "Allocation party state: unit_id party must be APPROVED; vendor_id party must be CONTRACTED", error_id: ERR_INVALID_UNIT_STATUS, http_status: 409, applies_to: "POST /site-areas/{area_id}/allocations", note: "vendor party violation uses ERR_INVALID_VENDOR_STATUS" }
  - { priority: 8, category: business_temporal, check: "starts_at < ends_at strictly for ProgramSlot and AreaAllocation; effective_from <= effective_until for Agreement", error_id: ERR_INVALID_TIME_RANGE, http_status: 422, applies_to: "POST /events/{id}/program-slots, POST /site-areas/{area_id}/allocations, POST /events/{id}/agreements" }
  - { priority: 8, category: business_temporal, check: "ProgramSlot window inside [event_starts_at, event_ends_at]; AreaAllocation window inside [event_starts_at - 24h, event_ends_at + 24h]", error_id: ERR_OUTSIDE_EVENT_WINDOW, http_status: 422, applies_to: "POST /events/{id}/program-slots, POST /site-areas/{area_id}/allocations" }
  - { priority: 9, category: business_referential, check: "publish requires a LANDOWNER_USE Agreement with status = SIGNED whose window covers the event (effective_from <= event_starts_at AND effective_until >= event_ends_at); vendor settle requires a LANDOWNER_USE Agreement with status = SIGNED and in force at settlement time (effective_from <= now <= effective_until)", error_id: ERR_AGREEMENT_NOT_IN_FORCE, http_status: 409, applies_to: "POST /events/{event_id}/publish, POST /vendors/{vendor_id}/settle" }
  - { priority: 10, category: business_fiscal, check: "publish requires an INSURANCE_LIABILITY Agreement with status = SIGNED, window covering the event, and coverage_amount_cents >= required_liability_cents", error_id: ERR_INSURANCE_COVERAGE_INSUFFICIENT, http_status: 422, applies_to: "POST /events/{event_id}/publish" }
  - { priority: 10, category: business_fiscal, check: "vendor settle requires fee_paid_cents >= provisional_fee_cents", error_id: ERR_VENDOR_BALANCE_OUTSTANDING, http_status: 409, applies_to: "POST /vendors/{vendor_id}/settle" }
  - { priority: 10, category: business_fiscal, check: "explicit-lot parking issue requires allocated_units + units_needed <= capacity_units (inclusive)", error_id: ERR_PARKING_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /ticket-orders/{id}/parking-passes" }
  - { priority: 10, category: business_fiscal, check: "automatic lot selection finds no eligible PARKING area", error_id: ERR_NO_PARKING_AVAILABLE, http_status: 409, applies_to: "POST /ticket-orders/{id}/parking-passes" }
  - { priority: 10, category: business_fiscal, check: "AreaAllocation requires area.allocated_units + units <= capacity_units (inclusive)", error_id: ERR_AREA_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /site-areas/{area_id}/allocations" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Event lifecycle ----
  - { method: POST, path: "/events", description: "Create an event in PLANNING posture", roles: [EventOrganizer], code: 201, input: [name, site_name, event_starts_at, event_ends_at, adult_day_price_cents, child_day_price_cents, adult_weekend_price_cents, child_weekend_price_cents, early_bird_pct, early_bird_cutoff_at, service_fee_cents, refund_retain_pct, required_liability_cents, vendor_frontage_rate_cents, vendor_multi_day_discount_pct, vendor_min_fee_cents, vendor_late_insurance_surcharge_cents, vendor_insurance_deadline_at, "max_minor_per_adult?"], output: Event, side_effects: [] }
  - { method: GET, path: "/events/{event_id}", description: "Read an event including posture, restriction_level, approved_combatant_count, version", roles: [EventOrganizer, AuthenticityOfficer, SafetyOfficer, UnitCommander, Participant, Vendor, Spectator], code: 200, input: [], output: Event, side_effects: [] }
  - { method: PATCH, path: "/events/{event_id}", description: "Update mutable event settings; OCC-guarded; requires posture PLANNING or REGISTRATION_OPEN", roles: [EventOrganizer], code: 200, input: [expected_event_version, "name?", "site_name?", "event_starts_at?", "event_ends_at?", "required_liability_cents?", "max_minor_per_adult?"], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/events/{event_id}/open-registration", description: "PLANNING -> REGISTRATION_OPEN", roles: [EventOrganizer], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/events/{event_id}/publish", description: "REGISTRATION_OPEN -> PUBLISHED; requires in-force signed landowner agreement and sufficient signed liability insurance", roles: [EventOrganizer], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/events/{event_id}/open-gates", description: "PUBLISHED -> EVENT_OPEN; blocked while any RED_FLAG alert is OPEN", roles: [EventOrganizer], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/events/{event_id}/restrict", description: "EVENT_OPEN -> RESTRICTED (manual weather/fire call); cancels open-flame slots in PROPOSED or CONFIRMED", roles: [EventOrganizer, SafetyOfficer], code: 200, input: ["reason?"], output: Event, side_effects: ["open-flame ProgramSlots -> CANCELLED ('CONTINGENCY')", "increments Event.version by 1"] }
  - { method: POST, path: "/events/{event_id}/lift-restriction", description: "RESTRICTED -> EVENT_OPEN; blocked while any RED_FLAG alert is OPEN", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: Event, side_effects: ["increments Event.version by 1"] }
  - { method: POST, path: "/events/{event_id}/complete", description: "EVENT_OPEN or RESTRICTED -> COMPLETED; CONFIRMED slots -> DONE", roles: [EventOrganizer], code: 200, input: [], output: Event, side_effects: ["CONFIRMED ProgramSlots -> DONE", "increments Event.version by 1"] }
  - { method: POST, path: "/events/{event_id}/cancel", description: "Any non-terminal posture -> CANCELLED; runs the full cancellation cascade (PAID orders refunded via EVENT_CONTINGENCY variant, their passes voided, RESERVED orders cancelled, slots cancelled, allocations released, vendors revoked, alerts resolved)", roles: [EventOrganizer], code: 200, input: ["reason?"], output: Event, side_effects: ["sets cancelled_at = now", "event cancellation cascade per state_machines.Event note", "increments Event.version by 1"] }

  # ---- Agreements ----
  - { method: POST, path: "/events/{id}/agreements", description: "Submit a new agreement version; OCC-guarded; supersedes any SUBMITTED/SIGNED agreement of the same type for this event; allowed in any non-terminal posture", roles: [EventOrganizer], code: 201, input: [agreement_type, document_ref, effective_from, effective_until, expected_event_version, "coverage_amount_cents?"], output: Agreement, side_effects: ["same-type Agreements in SUBMITTED or SIGNED -> SUPERSEDED", "increments Event.version by 1"] }
  - { method: POST, path: "/agreements/{agreement_id}/sign", description: "SUBMITTED -> SIGNED; records signer_name and signed_at", roles: [EventOrganizer], code: 200, input: [signer_name], output: Agreement, side_effects: ["increments Agreement.version by 1"] }
  - { method: GET, path: "/events/{id}/agreements", description: "List agreements of an event (all statuses, including SUPERSEDED), ordered by created_at ASC", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: "Agreement[]", side_effects: [] }

  # ---- Units ----
  - { method: POST, path: "/units", description: "Register a reenactment unit for an event (bootstrap: the UnitCommander's X-User-ID becomes the created unit's id)", roles: [UnitCommander], code: 201, input: [event_id, name, unit_type, portrayal_name, "headcount_estimate?"], output: Unit, side_effects: [] }
  - { method: GET, path: "/units/{unit_id}", description: "Read a unit", roles: [UnitCommander, EventOrganizer, AuthenticityOfficer, SafetyOfficer], code: 200, input: [], output: Unit, side_effects: [] }
  - { method: POST, path: "/units/{unit_id}/vet", description: "Vet a unit: SUBMITTED -> APPROVED/REJECTED, or reinstate SUSPENDED -> APPROVED (decision = APPROVE)", roles: [EventOrganizer], code: 200, input: [decision, "notes?"], output: Unit, side_effects: ["sets vet_notes", "increments Unit.version by 1"] }
  - { method: POST, path: "/units/{unit_id}/suspend", description: "APPROVED -> SUSPENDED; runs the depth-3 suspension cascade (participants withdrawn -> their equipment withdrawn -> scheduled inspections cancelled)", roles: [EventOrganizer], code: 200, input: ["reason?"], output: Unit, side_effects: ["unit suspension cascade per state_machines.Unit", "increments Unit.version by 1"] }
  - { method: GET, path: "/events/{id}/units", description: "List units of an event", roles: [EventOrganizer, AuthenticityOfficer, SafetyOfficer], code: 200, input: [], output: "Unit[]", side_effects: [] }

  # ---- Participants ----
  - { method: POST, path: "/participants", description: "Register a participant (DRAFT). UnitCommander for own unit's members; Participant role self-registers as an independent (bootstrap); EventOrganizer may register anyone", roles: [UnitCommander, Participant, EventOrganizer], code: 201, input: [event_id, full_name, age_at_event, impression_class, "persona_description?", "unit_id?", "supervisor_participant_id?"], output: Participant, side_effects: [] }
  - { method: GET, path: "/participants", description: "Filtered, paginated list of participants", roles: [EventOrganizer, AuthenticityOfficer, SafetyOfficer, UnitCommander, Participant], code: 200, input: ["unit_id?", "event_id?", "supervisor_participant_id?", "status?", "limit?", "offset?"], output: "Participant[]", side_effects: [] }
  - { method: GET, path: "/participants/{participant_id}", description: "Read a participant", roles: [EventOrganizer, AuthenticityOfficer, SafetyOfficer, UnitCommander, Participant], code: 200, input: [], output: Participant, side_effects: [] }
  - { method: POST, path: "/participants/{participant_id}/submit", description: "DRAFT or CHANGES_REQUESTED -> SUBMITTED; requires unit APPROVED when unit_id non-null", roles: [UnitCommander, Participant], code: 200, input: [], output: Participant, side_effects: ["increments Participant.version by 1"] }
  - { method: POST, path: "/participants/{participant_id}/vet", description: "Authenticity vetting: SUBMITTED -> VETTED / CHANGES_REQUESTED / REJECTED per decision", roles: [AuthenticityOfficer], code: 200, input: [decision, "notes?"], output: Participant, side_effects: ["sets vet_notes", "recompute approved_combatant_count on event and unit", "increments Participant.version by 1"] }
  - { method: POST, path: "/participants/{participant_id}/check-in", description: "VETTED -> CHECKED_IN; gates: event EVENT_OPEN, unit APPROVED, equipment cleared, minor supervisor + ratio rules", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: Participant, side_effects: ["sets checked_in_at = now", "recompute approved_combatant_count on event and unit", "increments Participant.version by 1"] }
  - { method: POST, path: "/participants/{participant_id}/withdraw", description: "Any non-terminal status -> WITHDRAWN; withdraws non-terminal equipment and cancels its SCHEDULED inspections", roles: [Participant, UnitCommander, EventOrganizer], code: 200, input: ["reason?"], output: Participant, side_effects: ["equipment WITHDRAWN / inspections CANCELLED cascade", "recompute approved_combatant_count on event and unit", "increments Participant.version by 1"] }

  # ---- Equipment & inspections ----
  - { method: POST, path: "/equipment-items", description: "Declare an equipment item for a participant (DECLARED)", roles: [Participant, UnitCommander, EventOrganizer], code: 201, input: [participant_id, item_type, description], output: EquipmentItem, side_effects: [] }
  - { method: GET, path: "/equipment-items/{item_id}", description: "Read an equipment item", roles: [SafetyOfficer, EventOrganizer, UnitCommander, Participant], code: 200, input: [], output: EquipmentItem, side_effects: [] }
  - { method: GET, path: "/participants/{id}/equipment-items", description: "List a participant's equipment items", roles: [SafetyOfficer, EventOrganizer, UnitCommander, Participant], code: 200, input: [], output: "EquipmentItem[]", side_effects: [] }
  - { method: POST, path: "/equipment-items/{item_id}/withdraw", description: "DECLARED / INSPECTION_DUE / FAILED -> WITHDRAWN; cancels the item's SCHEDULED inspections", roles: [Participant, UnitCommander, EventOrganizer], code: 200, input: [], output: EquipmentItem, side_effects: ["SCHEDULED Inspections of this item -> CANCELLED", "increments EquipmentItem.version by 1"] }
  - { method: POST, path: "/equipment-items/{id}/inspections", description: "Schedule a 45-minute inspection window; item DECLARED or FAILED -> INSPECTION_DUE; buffered-window conflict check per validations", roles: [SafetyOfficer], code: 201, input: [scheduled_for, inspection_kind], output: Inspection, side_effects: ["EquipmentItem -> INSPECTION_DUE", "increments EquipmentItem.version by 1"] }
  - { method: GET, path: "/equipment-items/{id}/inspections", description: "List an item's inspections", roles: [SafetyOfficer, EventOrganizer], code: 200, input: [], output: "Inspection[]", side_effects: [] }
  - { method: POST, path: "/inspections/{inspection_id}/record", description: "SCHEDULED -> RECORDED_PASS / RECORDED_FAIL; records recorded_by_user_id = X-User-ID; drives equipment to PASSED or FAILED (BANNED at failure_count 2)", roles: [SafetyOfficer], code: 200, input: [outcome, "failure_reason?"], output: Inspection, side_effects: ["equipment status + failure_count update per state_machines.Inspection", "increments Inspection.version by 1"] }
  - { method: POST, path: "/inspections/{inspection_id}/waive", description: "RECORDED_FAIL -> WAIVED; segregation of duties: caller's X-User-ID must differ from recorded_by_user_id; equipment FAILED -> WAIVED", roles: [SafetyOfficer], code: 200, input: [waiver_reason], output: Inspection, side_effects: ["EquipmentItem FAILED -> WAIVED", "increments Inspection.version by 1"] }

  # ---- Site areas & allocations ----
  - { method: POST, path: "/events/{id}/site-areas", description: "Define a site area (camp / demo / parking / sutler row / spectator); requires posture IN {PLANNING, REGISTRATION_OPEN, PUBLISHED}", roles: [EventOrganizer], code: 201, input: [area_name, area_kind, capacity_units], output: SiteArea, side_effects: [] }
  - { method: GET, path: "/site-areas/{area_id}", description: "Read a site area including allocated_units", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: SiteArea, side_effects: [] }
  - { method: GET, path: "/events/{id}/site-areas", description: "List an event's site areas", roles: [EventOrganizer, SafetyOfficer], code: 200, input: ["area_kind?"], output: "SiteArea[]", side_effects: [] }
  - { method: POST, path: "/site-areas/{area_id}/close", description: "ACTIVE -> CLOSED", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: SiteArea, side_effects: ["increments SiteArea.version by 1"] }
  - { method: POST, path: "/site-areas/{area_id}/allocations", description: "Allocate camp ground (unit) or sutler booth (vendor) with a half-open occupation window; overlap + capacity + party-state checks; requires posture IN {REGISTRATION_OPEN, PUBLISHED, EVENT_OPEN}", roles: [EventOrganizer], code: 201, input: [starts_at, ends_at, units, "unit_id?", "vendor_id?"], output: AreaAllocation, side_effects: ["recompute SiteArea.allocated_units"] }
  - { method: GET, path: "/allocations", description: "Filtered, paginated list of allocations", roles: [EventOrganizer, SafetyOfficer], code: 200, input: ["site_area_id?", "unit_id?", "vendor_id?", "limit?", "offset?"], output: "AreaAllocation[]", side_effects: [] }
  - { method: GET, path: "/allocations/{allocation_id}", description: "Read an allocation", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: AreaAllocation, side_effects: [] }
  - { method: POST, path: "/allocations/{allocation_id}/release", description: "ACTIVE -> RELEASED; recomputes the area's allocated_units", roles: [EventOrganizer], code: 200, input: [], output: AreaAllocation, side_effects: ["recompute SiteArea.allocated_units", "increments AreaAllocation.version by 1"] }

  # ---- Program slots ----
  - { method: POST, path: "/events/{id}/program-slots", description: "Propose a program slot on a DEMO area (PROPOSED); half-open overlap check against PROPOSED/CONFIRMED slots on the same area; requires posture IN {PUBLISHED, EVENT_OPEN}", roles: [EventOrganizer], code: 201, input: [title, site_area_id, starts_at, ends_at, "open_flame?", "required_combatants?"], output: ProgramSlot, side_effects: [] }
  - { method: GET, path: "/events/{id}/program-slots", description: "List an event's program slots", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: "ProgramSlot[]", side_effects: [] }
  - { method: GET, path: "/site-areas/{id}/program-slots", description: "List a site area's program slots", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: "ProgramSlot[]", side_effects: [] }
  - { method: POST, path: "/program-slots/{slot_id}/confirm", description: "PROPOSED -> CONFIRMED; gates: area ACTIVE, flame vs restriction_level, required_combatants vs approved_combatant_count, posture IN {PUBLISHED, EVENT_OPEN}", roles: [EventOrganizer], code: 200, input: [], output: ProgramSlot, side_effects: ["increments ProgramSlot.version by 1"] }
  - { method: POST, path: "/program-slots/{slot_id}/cancel", description: "PROPOSED or CONFIRMED -> CANCELLED", roles: [EventOrganizer, SafetyOfficer], code: 200, input: ["reason?"], output: ProgramSlot, side_effects: ["increments ProgramSlot.version by 1"] }

  # ---- Ticket orders & parking ----
  - { method: POST, path: "/events/{id}/ticket-orders", description: "Create a spectator ticket order (RESERVED); computes quoted_total_cents (provisional variant); requires posture IN {PUBLISHED, EVENT_OPEN}", roles: [Spectator], code: 201, input: [buyer_name, lines], output: TicketOrder, side_effects: ["sets buyer_user_id = X-User-ID", "computes quoted_total_cents per ticket_order_pricing provisional variant"] }
  - { method: GET, path: "/events/{id}/ticket-orders", description: "List an event's ticket orders", roles: [EventOrganizer], code: 200, input: ["status?", "limit?", "offset?"], output: "TicketOrder[]", side_effects: [] }
  - { method: GET, path: "/ticket-orders/{order_id}", description: "Read a ticket order (Spectator limited to own orders)", roles: [Spectator, EventOrganizer], code: 200, input: [], output: TicketOrder, side_effects: [] }
  - { method: POST, path: "/ticket-orders/{order_id}/pay", description: "RESERVED -> PAID; computes final_total_cents (final variant) using paid_at = now", roles: [Spectator], code: 200, input: [payment_method, payment_reference], output: TicketOrder, side_effects: ["computes final_total_cents per ticket_order_pricing final variant", "sets paid_at", "increments TicketOrder.version by 1"] }
  - { method: POST, path: "/ticket-orders/{order_id}/refund", description: "PAID -> REFUNDED; reason PATRON_CHOICE (retains refund_retain_pct) or EVENT_CONTINGENCY (event CANCELLED only; pro-rated, retains 0); voids the order's ACTIVE parking passes", roles: [Spectator, EventOrganizer], code: 200, input: [reason], output: TicketOrder, side_effects: ["computes refund per ticket_refund_amount", "ACTIVE ParkingPasses of this order -> VOIDED", "increments TicketOrder.version by 1"] }
  - { method: POST, path: "/ticket-orders/{order_id}/check-in", description: "PAID -> CHECKED_IN (gate scan); requires posture IN {EVENT_OPEN, RESTRICTED}", roles: [EventOrganizer], code: 200, input: [], output: TicketOrder, side_effects: ["increments TicketOrder.version by 1"] }
  - { method: POST, path: "/ticket-orders/{id}/parking-passes", description: "Issue a parking pass against a PAID order; explicit lot (capacity check) or server-selected per parking_lot_allocation selector", roles: [Spectator], code: 201, input: [vehicle_plate, vehicle_class, "site_area_id?"], output: ParkingPass, side_effects: ["recompute lot allocated_units", "sets units_used per vehicle_class"] }
  - { method: GET, path: "/ticket-orders/{id}/parking-passes", description: "List an order's parking passes", roles: [Spectator, EventOrganizer], code: 200, input: [], output: "ParkingPass[]", side_effects: [] }
  - { method: GET, path: "/site-areas/{id}/parking-passes", description: "List a parking lot's passes", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: "ParkingPass[]", side_effects: [] }
  - { method: POST, path: "/parking-passes/{pass_id}/void", description: "ACTIVE -> VOIDED; decrements lot allocated_units by units_used", roles: [Spectator, EventOrganizer], code: 200, input: [], output: ParkingPass, side_effects: ["decrement lot allocated_units", "increments ParkingPass.version by 1"] }

  # ---- Vendors (sutler row) ----
  - { method: POST, path: "/events/{id}/vendors", description: "Sutler application (APPLIED); bootstrap: the Vendor's X-User-ID becomes the created vendor's owner_user_id anchor; requires posture IN {REGISTRATION_OPEN, PUBLISHED}", roles: [Vendor], code: 201, input: [business_name, wares_description, frontage_feet, requested_days], output: Vendor, side_effects: ["sets owner_user_id = X-User-ID if provided, else the created vendor id (bootstrap self-anchor)"] }
  - { method: GET, path: "/events/{id}/vendors", description: "List an event's vendors", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: "Vendor[]", side_effects: [] }
  - { method: GET, path: "/vendors/{vendor_id}", description: "Read a vendor", roles: [Vendor, EventOrganizer], code: 200, input: [], output: Vendor, side_effects: [] }
  - { method: POST, path: "/vendors/{vendor_id}/approve", description: "APPLIED -> APPROVED; computes provisional_fee_cents (provisional variant)", roles: [EventOrganizer], code: 200, input: [], output: Vendor, side_effects: ["computes provisional_fee_cents per vendor_booth_fee provisional variant", "increments Vendor.version by 1"] }
  - { method: POST, path: "/vendors/{vendor_id}/contract", description: "APPROVED -> CONTRACTED; records insurance certificate and a fee payment", roles: [Vendor], code: 200, input: [insurance_cert_ref, fee_payment_cents], output: Vendor, side_effects: ["sets insurance_cert_ref, insurance_uploaded_at = now, fee_paid_cents += fee_payment_cents", "increments Vendor.version by 1"] }
  - { method: POST, path: "/vendors/{vendor_id}/revoke", description: "APPLIED / APPROVED / CONTRACTED -> REVOKED; releases the vendor's ACTIVE allocations", roles: [EventOrganizer, SafetyOfficer], code: 200, input: ["reason?"], output: Vendor, side_effects: ["vendor's ACTIVE AreaAllocations -> RELEASED", "increments Vendor.version by 1"] }
  - { method: POST, path: "/vendors/{vendor_id}/settle", description: "CONTRACTED -> SETTLED (post-event); computes final_fee_cents (final variant, late-insurance surcharge) and balance_due_cents", roles: [EventOrganizer], code: 200, input: [], output: Vendor, side_effects: ["computes final_fee_cents per vendor_booth_fee final variant", "sets balance_due_cents", "increments Vendor.version by 1"] }

  # ---- Contingency alerts ----
  - { method: POST, path: "/events/{id}/contingency-alerts", description: "Raise a weather/fire/security alert (OPEN); recomputes restriction_level; a resulting RED level while EVENT_OPEN forces the Event to RESTRICTED and cancels open-flame slots; requires posture IN {PUBLISHED, EVENT_OPEN, RESTRICTED}", roles: [SafetyOfficer], code: 201, input: [alert_kind, severity, message], output: ContingencyAlert, side_effects: ["recompute Event.restriction_level", "RED while EVENT_OPEN: Event -> RESTRICTED + open-flame slots CANCELLED ('CONTINGENCY')"] }
  - { method: GET, path: "/events/{id}/contingency-alerts", description: "List an event's contingency alerts", roles: [EventOrganizer, SafetyOfficer], code: 200, input: [], output: "ContingencyAlert[]", side_effects: [] }
  - { method: POST, path: "/contingency-alerts/{alert_id}/resolve", description: "OPEN -> RESOLVED; recomputes restriction_level (posture is NOT auto-lifted)", roles: [SafetyOfficer], code: 200, input: [], output: ContingencyAlert, side_effects: ["sets resolved_at = now", "recompute Event.restriction_level", "increments ContingencyAlert.version by 1"] }

  # ---- Test-driving clock ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (ISO 8601 UTC). The server's default logical time at startup is fixed at 2026-05-01T00:00:00Z and MUST NOT fall back to wall-clock time; every timestamp comparison (early-bird cutoff, insurance deadline, agreement in-force windows, refund pro-rating) reads this logical clock.", roles: [EventOrganizer], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role, or missing X-User-ID where required" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on the endpoint, or entity-backed ownership check failed (wrong unit / wrong participant / wrong vendor / wrong buyer)" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "Event reference does not resolve" }
  - { id: ERR_UNIT_NOT_FOUND, http: 404, condition: "Unit reference does not resolve" }
  - { id: ERR_PARTICIPANT_NOT_FOUND, http: 404, condition: "Participant or supervisor reference does not resolve" }
  - { id: ERR_EQUIPMENT_NOT_FOUND, http: 404, condition: "EquipmentItem reference does not resolve" }
  - { id: ERR_INSPECTION_NOT_FOUND, http: 404, condition: "Inspection reference does not resolve" }
  - { id: ERR_AREA_NOT_FOUND, http: 404, condition: "SiteArea reference does not resolve" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "ProgramSlot reference does not resolve" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "TicketOrder reference does not resolve" }
  - { id: ERR_PASS_NOT_FOUND, http: 404, condition: "ParkingPass reference does not resolve" }
  - { id: ERR_VENDOR_NOT_FOUND, http: 404, condition: "Vendor reference does not resolve" }
  - { id: ERR_AGREEMENT_NOT_FOUND, http: 404, condition: "Agreement reference does not resolve" }
  - { id: ERR_ALERT_NOT_FOUND, http: 404, condition: "ContingencyAlert reference does not resolve" }
  - { id: ERR_ALLOCATION_NOT_FOUND, http: 404, condition: "AreaAllocation reference does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_event_version does not match the Event's current version (OCC)" }
  - { id: ERR_INVALID_EVENT_POSTURE, http: 409, condition: "Event posture does not permit the operation" }
  - { id: ERR_INVALID_UNIT_STATUS, http: 409, condition: "Unit (or allocation's unit party, or participant's unit) not in a valid status for the operation" }
  - { id: ERR_INVALID_PARTICIPANT_STATUS, http: 409, condition: "Participant not in a valid status for the operation" }
  - { id: ERR_INVALID_EQUIPMENT_STATUS, http: 409, condition: "EquipmentItem not in a valid status for the operation" }
  - { id: ERR_INVALID_INSPECTION_STATUS, http: 409, condition: "Inspection not in a valid status for the operation" }
  - { id: ERR_INVALID_SLOT_STATUS, http: 409, condition: "ProgramSlot not in a valid status for the operation" }
  - { id: ERR_INVALID_ORDER_STATUS, http: 409, condition: "TicketOrder not in a valid status for the operation" }
  - { id: ERR_INVALID_PASS_STATUS, http: 409, condition: "ParkingPass not ACTIVE for void" }
  - { id: ERR_INVALID_VENDOR_STATUS, http: 409, condition: "Vendor (or allocation's vendor party) not in a valid status for the operation" }
  - { id: ERR_INVALID_AGREEMENT_STATUS, http: 409, condition: "Agreement not SUBMITTED for signing" }
  - { id: ERR_INVALID_ALERT_STATUS, http: 409, condition: "ContingencyAlert not OPEN for resolve" }
  - { id: ERR_AREA_NOT_ACTIVE, http: 409, condition: "SiteArea is CLOSED; new slots, confirmations, allocations, and explicit-lot parking issues rejected" }
  - { id: ERR_UNINSPECTED_EQUIPMENT, http: 409, condition: "Check-in blocked by an inspectable EquipmentItem in DECLARED, INSPECTION_DUE, or FAILED status" }
  - { id: ERR_SUPERVISOR_REQUIRED, http: 422, condition: "Minor check-in without a supervisor_participant_id" }
  - { id: ERR_SUPERVISOR_INELIGIBLE, http: 422, condition: "Supervisor is not an adult, not in the same unit, or not CHECKED_IN" }
  - { id: ERR_SUPERVISION_RATIO_EXCEEDED, http: 409, condition: "Minor check-in would exceed max_minor_per_adult * checked-in adults of the unit (inclusive boundary)" }
  - { id: ERR_OPEN_FLAME_RESTRICTED, http: 409, condition: "open_flame program confirmation while restriction_level is YELLOW or RED" }
  - { id: ERR_RED_ALERTS_OPEN, http: 409, condition: "open-gates or lift-restriction while a RED_FLAG ContingencyAlert is OPEN" }
  - { id: ERR_SOD_SELF_WAIVER, http: 403, condition: "Waiving officer's X-User-ID equals the inspection's recorded_by_user_id (segregation of duties)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, invalid enum member, out-of-range number, empty lines, missing conditional field (coverage_amount_cents / failure_reason), required_combatants above approved_combatant_count" }
  - { id: ERR_UNIT_NOT_IN_EVENT, http: 422, condition: "Participant's unit_id belongs to a different event than participant's event_id" }
  - { id: ERR_SLOT_OVERLAP, http: 409, condition: "Half-open program-slot overlap on the same DEMO area (touching endpoints allowed)" }
  - { id: ERR_INSPECTION_WINDOW_CONFLICT, http: 409, condition: "Fixed 45-minute inspection window (with 15-minute closed buffer) conflicts with another SCHEDULED inspection of the same equipment item" }
  - { id: ERR_ALLOCATION_OVERLAP, http: 409, condition: "Half-open allocation overlap on the same site area (touching endpoints allowed)" }
  - { id: ERR_ALLOCATION_PARTY_REQUIRED, http: 422, condition: "Allocation names neither or both of unit_id / vendor_id" }
  - { id: ERR_AREA_KIND_MISMATCH, http: 422, condition: "Area kind unfit: slots need DEMO, allocations need CAMP/SUTLER, explicit parking lot needs PARKING" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "starts_at >= ends_at (slot/allocation) or effective_from > effective_until (agreement)" }
  - { id: ERR_OUTSIDE_EVENT_WINDOW, http: 422, condition: "Slot/allocation window lies outside the event window (allocations get a +/-24h setup/teardown allowance)" }
  - { id: ERR_AGREEMENT_NOT_IN_FORCE, http: 409, condition: "No SIGNED LANDOWNER_USE agreement whose window covers the event (publish) or that is in force now (vendor settle)" }
  - { id: ERR_INSURANCE_COVERAGE_INSUFFICIENT, http: 422, condition: "No SIGNED, in-force INSURANCE_LIABILITY agreement with coverage >= required_liability_cents" }
  - { id: ERR_VENDOR_BALANCE_OUTSTANDING, http: 409, condition: "Vendor settlement with fee_paid_cents < provisional_fee_cents" }
  - { id: ERR_PARKING_CAPACITY_EXCEEDED, http: 409, condition: "Explicit-lot parking issue would exceed capacity_units (allocated + needed > capacity)" }
  - { id: ERR_NO_PARKING_AVAILABLE, http: 409, condition: "Automatic lot selection found no eligible PARKING area" }
  - { id: ERR_AREA_CAPACITY_EXCEEDED, http: 409, condition: "Allocation would exceed the area's capacity_units" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EventOrganizer
    description: "The living history event organizer; administers the event, agreements, units, site layout, program schedule, vendor row, and gate operations"
    identity: opaque
    exclusive_operations: ["event lifecycle transitions (open-registration, publish, open-gates, complete, cancel)", "PATCH /events/{event_id}", "agreement create/sign", "unit vet/suspend", "site-area create", "allocation create/release", "program-slot create/confirm", "vendor approve/settle", "ticket-order check-in", "POST /_clock/set_current_utc"]
    shared_operations: ["restrict/lift-restriction (with SafetyOfficer)", "site-area close (with SafetyOfficer)", "program-slot cancel (with SafetyOfficer)", "vendor revoke (with SafetyOfficer)", "participant check-in (with SafetyOfficer)", "participant withdraw (with Participant, UnitCommander)", "equipment-item create/withdraw (with Participant, UnitCommander)", "reads"]
  - name: AuthenticityOfficer
    description: "Vets participant impressions and garb against the event's authenticity standards; disjoint from safety inspection duties"
    identity: opaque
    exclusive_operations: ["POST /participants/{participant_id}/vet"]
    shared_operations: ["reads (event, units, participants)"]
  - name: SafetyOfficer
    description: "Runs equipment safety/authenticity inspections, raises and resolves weather/fire contingency alerts, shares restriction authority"
    identity: opaque
    exclusive_operations: ["inspection schedule/record/waive", "contingency-alert raise/resolve"]
    shared_operations: ["restrict/lift-restriction (with EventOrganizer)", "site-area close (with EventOrganizer)", "program-slot cancel (with EventOrganizer)", "vendor revoke (with EventOrganizer)", "participant check-in (with EventOrganizer)", "reads"]
  - name: UnitCommander
    description: "Registers and manages one reenactment unit and its roster; X-User-ID equals the unit's id (bootstrap at unit creation)"
    identity: "entity_backed:Unit"
    exclusive_operations: ["POST /units"]
    shared_operations: ["participant create/submit/withdraw for own unit (with Participant/EventOrganizer)", "equipment-item create/withdraw for own unit's members", "reads"]
  - name: Participant
    description: "An individual reenactor; X-User-ID equals the participant's id (bootstrap at self-registration)"
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations: ["participant create (self-register as independent)", "submit/withdraw own record", "equipment-item create/withdraw for self", "reads"]
  - name: Vendor
    description: "A sutler; X-User-ID anchors to the created vendor record's owner_user_id (bootstrap at application)"
    identity: "entity_backed:Vendor"
    exclusive_operations: ["POST /events/{id}/vendors", "POST /vendors/{vendor_id}/contract (own)"]
    shared_operations: ["reads (own vendor, event)"]
  - name: Spectator
    description: "A ticket buyer; X-User-ID is an opaque buyer identifier stored as TicketOrder.buyer_user_id; owns their orders and passes"
    identity: opaque
    exclusive_operations: ["POST /events/{id}/ticket-orders", "POST /ticket-orders/{order_id}/pay (own)", "POST /ticket-orders/{id}/parking-passes (own paid order)"]
    shared_operations: ["ticket-order refund (own, with EventOrganizer)", "parking-pass void (own, with EventOrganizer)", "reads (own orders/passes, event)"]
