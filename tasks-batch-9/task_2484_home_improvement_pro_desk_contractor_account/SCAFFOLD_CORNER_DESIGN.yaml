      - name: quote_negotiation_cycle_claim
        claim_type: cyclic
        excluded_because:
          difficulty_instance: job_quote_negotiation_cycle_countered_back_to_submitted
          rationale: "The §1.8 instance already drives SUBMITTED -> COUNTERED -> SUBMITTED -> COUNTERED to round_count 2 / revision_count 1 and shows the later round superseding the earlier prices, which is the cyclic loop-back claim; the loop's termination condition (MAX_QUOTE_ROUNDS) is not asserted there and is covered separately by the validations-section instance negotiation_loop_terminates_at_max_quote_rounds."

      - name: pro_order_parallel_dimension_claim
        claim_type: parallel
        excluded_because:
          difficulty_instance: pro_order_parallel_dimensions_advance_independently
          rationale: "The §1.8 instance advances fulfillment_status and credit_status independently on two orders and asserts every combined pair, which is the parallel-shape claim in full."

  - section: calculations
    instances:

      - name: tier_selection_is_inclusive_at_every_table_threshold
        claim_type: tiered_pricing
        grounds:
          - calculations.account_tier_determination.constants.TIER_TABLE
          - entities.ProAccount.fields.tier_code
        distinguishing_aspect: "Six accounts straddling the three TIER_TABLE thresholds prove the lower bound is inclusive: 4999999 is MEMBER but 5000000 is GOLD, 19999999 is GOLD but 20000000 is PLATINUM, 49999999 is PLATINUM but 50000000 is DIAMOND, with discounts 0.00 / 0.05 / 0.08 / 0.12."
        test_recipe:
          setup:
            - "Store HD-101 exists; six accounts are created with baseline volumes one cent below and exactly at each threshold."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
          trigger:
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Below Gold", home_store_id: "${store_id}", baseline_volume_cents: 4999999 }
              as: PlatformAdmin
              captures: { a1: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "At Gold", home_store_id: "${store_id}", baseline_volume_cents: 5000000 }
              as: PlatformAdmin
              captures: { a2: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Below Platinum", home_store_id: "${store_id}", baseline_volume_cents: 19999999 }
              as: PlatformAdmin
              captures: { a3: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "At Platinum", home_store_id: "${store_id}", baseline_volume_cents: 20000000 }
              as: PlatformAdmin
              captures: { a4: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Below Diamond", home_store_id: "${store_id}", baseline_volume_cents: 49999999 }
              as: PlatformAdmin
              captures: { a5: "$.data.id" }
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "At Diamond", home_store_id: "${store_id}", baseline_volume_cents: 50000000 }
              as: PlatformAdmin
              captures: { a6: "$.data.id" }
          assert:
            - "ProAccount.${a1}.tier_code == MEMBER and tier_discount_pct == 0.00"
            - "ProAccount.${a2}.tier_code == GOLD and tier_discount_pct == 0.05"
            - "ProAccount.${a3}.tier_code == GOLD and tier_discount_pct == 0.05"
            - "ProAccount.${a4}.tier_code == PLATINUM and tier_discount_pct == 0.08"
            - "ProAccount.${a5}.tier_code == PLATINUM and tier_discount_pct == 0.08"
            - "ProAccount.${a6}.tier_code == DIAMOND and tier_discount_pct == 0.12"
            - "ProAccount.${a1}.trailing_volume_cents == 4999999"
            - "ProAccount.${a6}.trailing_volume_cents == 50000000"

      - name: restocking_and_tax_refund_round_half_up_once_on_the_summed_gross
        claim_type: precision
        grounds:
          - calculations.return_refund_valuation
          - entities.ReturnRequest.fields.restocking_fee_cents
        distinguishing_aspect: "The return path rounds ONCE on the summed gross, unlike order pricing's per-unit rounding: gross 5997 at a 0.10 age band gives round_half_up(599.7) = 600 (rounded up) and the tax leg gives round_half_up(445.2525) = 445 (rounded down), for a refund total of 5842."
        test_recipe:
          setup:
            - "Store HD-101 (tax 0.0825) stocks SHINGLE-BUNDLE at 1999; MEMBER account (discount 0.00)."
            - "CARD will-call order of 3 units: subtotal 5997, tax round_half_up(494.7525) = 495, total 6492; fulfilled at 2026-08-01T00:00:00Z."
            - "Clock then moves to 2026-09-15T00:00:00Z, exactly 45 whole days later, so the age band is 0.10 (> RESTOCK_FREE_WINDOW_DAYS 30) and still inside RETURN_WINDOW_DAYS 90."
          setup_api_calls:
            - call: "POST /pro/stores"
              payload: { store_code: "HD-101", region_code: "MIDWEST", state_code: "IL", distance_rank: 1, will_call_bay_slots: 2, lift_gate_available: true, tax_rate_pct: 0.0825, max_stage_hours: 48 }
              as: PlatformAdmin
              captures: { store_id: "$.data.id" }
            - call: "POST /pro/store-stocks"
              payload: { store_id: "${store_id}", sku: "SHINGLE-BUNDLE", on_hand_units: 600, list_unit_price_cents: 1999 }
              as: PlatformAdmin
            - call: "POST /pro/pro-accounts"
              payload: { business_name: "Rounding Roofers", home_store_id: "${store_id}" }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id" }
            - call: "POST /pro/pro-orders"
              payload: { pro_account_id: "${acct_id}", fulfillment_store_id: "${store_id}", payment_method: "CARD", delivery_mode: "WILL_CALL" }
              as: ContractorAdmin
              as_user_id: "${acct_id}"
