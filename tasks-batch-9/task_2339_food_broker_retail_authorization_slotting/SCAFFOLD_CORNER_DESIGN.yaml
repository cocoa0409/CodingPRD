            - "Call 12 returns 200 with ${rn} == Bigmart — retailer rows are not principal-scoped, so they stay readable"
            - "Principal ${p1}.name is still 'Northwind Foods' with version 1 and GET /items returns total_count 1 afterwards"

      - name: segregation_of_duties_follows_the_current_filer_identity
        claim_type: segregation_of_duties
        grounds:
          - roles.BrokerAuditManager.constraints
          - validations.v-segregation-of-duties
          - errors.ERR_SEGREGATION_OF_DUTIES
        distinguishing_aspect: |
          The control has two halves. Structurally, filing and substantiating are
          BrokerAccountManager-exclusive, so an audit identity can never manufacture
          its own claim. Dynamically, the check compares X-User-ID with the CURRENT
          Deduction.filed_by_user_id and covers BOTH audit verbs, so the same human
          wearing both hats is refused on approve AND on deny — yet after a refile
          by a different account manager that same human becomes a legitimate
          approver, because filed_by_user_id was overwritten.
        test_recipe:
          setup:
            - "Retailer BIGMART, principal NWF; one SHORTAGE deduction of 100000 dated 2026-08-01, filed and substantiated by the dual-hatted identity u_dual; clock 2026-08-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: BrokerAdmin
            - call: "POST /retailers"
              payload: { name: "Bigmart", chain_code: "BIGMART", total_store_count: 1200 }
              as: BrokerAdmin
              captures: { ret: $.data.id }
            - call: "POST /principals"
              payload: { name: "Northwind Foods", code: "NWF", slotting_budget_cents: 20000000 }
              as: BrokerAdmin
              captures: { prin: $.data.id }
            - call: "POST /deductions"
              payload: { retailer_id: "${ret}", principal_id: "${prin}", reason_code: "SHORTAGE", amount_cents: 100000, deduction_date: "2026-08-01" }
              as: RetailerBuyer
              as_user_id: "${ret}"
              captures: { ded: $.data.id }
            - call: "POST /deductions/${ded}/dispute"
              payload: { claim_amount_cents: 100000 }
              as: BrokerAccountManager
              as_user_id: "u_dual"
              captures: { filer: $.data.filed_by_user_id }
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "POD-A" }
              as: BrokerAccountManager
              as_user_id: "u_dual"
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "INV-A" }
              as: BrokerAccountManager
              as_user_id: "u_dual"
              captures: { docs: $.data.substantiation_doc_count }
          trigger:
            - call: "POST /deductions/${ded}/dispute"
              payload: { claim_amount_cents: 100000 }
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { e1: $.data.error_id }
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "FAKE-1" }
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { e2: $.data.error_id }
            - call: "POST /deductions/${ded}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_dual"
              captures: { e3: $.data.error_id }
            - call: "POST /deductions/${ded}/deny-recovery"
              payload: { denial_reason: "self-denial attempt" }
              as: BrokerAuditManager
              as_user_id: "u_dual"
              captures: { e4: $.data.error_id }
            - call: "POST /deductions/${ded}/deny-recovery"
              payload: { denial_reason: "Documents do not match the invoice" }
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { ds1: $.data.dispute_state, approver1: $.data.approved_by_user_id }
            - call: "POST /deductions/${ded}/dispute"
              payload: { claim_amount_cents: 100000 }
              as: BrokerAccountManager
              as_user_id: "u_am_2"
              captures: { filer2: $.data.filed_by_user_id, rf: $.data.refile_count, docs2: $.data.substantiation_doc_count }
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "POD-B" }
              as: BrokerAccountManager
              as_user_id: "u_am_2"
            - call: "POST /deductions/${ded}/substantiate"
              payload: { document_ref: "INV-B" }
              as: BrokerAccountManager
              as_user_id: "u_am_2"
            - call: "POST /deductions/${ded}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_dual"
              captures: { ds2: $.data.dispute_state, ss2: $.data.settlement_state, rec: $.data.recovered_cents, con: $.data.conceded_cents, approver2: $.data.approved_by_user_id, filer3: $.data.filed_by_user_id }
          assert:
            - "Setup: ${filer} == u_dual and ${docs} == 2 — a repeat substantiate only increments the counter"
            - "Calls 1 and 2 return 403 ERR_ROLE_FORBIDDEN — the audit role cannot file or substantiate at all, which is the structural half of the control"
            - "Call 3 returns 403 ERR_SEGREGATION_OF_DUTIES — u_dual holds the correct role and the deduction is SUBSTANTIATED with 2 documents, so nothing but the identity clash is wrong"
            - "Call 4 returns 403 ERR_SEGREGATION_OF_DUTIES too — the rule covers deny as well as approve, so the filer cannot quietly kill its own claim either"
            - "Call 5 returns 200 with ${ds1} == DENIED and ${approver1} still null (denial records denial_reason, not an approver); open_cents is still 100000"
            - "Call 6 refiles as a DIFFERENT account manager: ${filer2} == u_am_2, ${rf} == 1 and ${docs2} == 0"
            - "Call 9 now returns 200 for the very same u_dual identity that was refused in call 3: ${ds2} == APPROVED, ${approver2} == u_dual, ${filer3} == u_am_2, ${ss2} == RECOVERED, ${rec} == 50000 == floor(100000*5000/10000) and ${con} == 50000 — the check is against the CURRENT filer, not against any historical participant"

  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_review_version_blocks_the_award_across_a_reopen_cycle
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.review-decide-stale-review
          - errors.ERR_STALE_REVIEW_VERSION
        distinguishing_aspect: |
          The reopen cycle is exactly the scenario the OCC guard exists for: a buyer
          who read the review before a reopen holds a version that is now two
          writes behind, and the award it would produce (different deadline,
          possibly different submitted presentations) must be refused rather than
          silently applied. The rejected decide must itself leave the version
          untouched, so a retry with the refreshed version succeeds unchanged.
        test_recipe:
          setup:
            - "Retailer BIGMART; principal NWF ACTIVE with an ACTIVE FROZEN_SNACKS agreement; item i1 VALIDATED; review [2026-09-01, 2026-09-15) with deadline 2026-08-20 and new_item_slots 2; presentation submitted; no slotting deal."
