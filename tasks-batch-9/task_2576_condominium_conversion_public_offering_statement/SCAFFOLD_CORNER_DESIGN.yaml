      - name: threshold_evaluation_on_a_draft_batch_reports_invalid_state_transition
        claim_type: priority_ordering
        grounds:
          - validations[priority 23]
          - validations[priority 45]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_NO_INCLUDED_UNITS]
          - endpoints[POST /closing-batches/{id}/threshold-evaluations]
          - state_machines.ClosingBatch.initial_state
          - entities.ConversionProject.fields.included_unit_count
        distinguishing_aspect: "The batch is DRAFT and the project has zero INCLUDED units, so the p23
          state guard and the p45 denominator guard are violated simultaneously; priority 23 wins, so the
          answer is 409 ERR_INVALID_STATE_TRANSITION and NOT ERR_NO_INCLUDED_UNITS. This is also the only
          reachable configuration for the p45 rule: the batch can only leave DRAFT by assigning an
          agreement, which presupposes a Unit, and priority 44 then keeps at least one Unit INCLUDED
          forever, so ERR_NO_INCLUDED_UNITS is structurally masked (recorded as a scaffold defect)."
        test_recipe:
          setup:
            - "One project with no declaration package and one ClosingBatch in DRAFT."
          setup_api_calls:
            - call: "POST /conversion-projects"
              payload: { building_address: "44 Cove Lane, Bangor ME", year_built: 1968, total_unit_count: 2, sponsor_user_id: "sponsor-1" }
              as: ConverterSponsor
              as_user_id: "sponsor-1"
              captures: { proj_id: "$.data.id" }
