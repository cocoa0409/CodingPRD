  - section: errors
    instances:
      - name: request_without_x_user_id_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority 1]
        distinguishing_aspect: |
          Priority 1 outranks everything, so a missing identity header on an otherwise perfect
          payload is a 401 and not the 400 the malformed body would earn, and it is a 401 even on a
          read.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with one owner registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
          trigger:
            - call: "GET /owners/${owner_id}"
              payload: {}
              as: none
            - call: "POST /engineers"
              payload: { full_name: "Ghost", license_number: "PE-00000" }
              as: none
          assert:
            - "the unauthenticated GET returns HTTP 401 with error_id ERR_UNAUTHENTICATED"
            - "the unauthenticated POST with an incomplete body also returns HTTP 401 with ERR_UNAUTHENTICATED, not ERR_INVALID_REQUEST"
            - "GET /engineers returns total_count 0, so nothing was created"

      - name: role_without_the_operation_returns_forbidden_role
        claim_type: violation_to_error
        grounds:
          - errors[ERR_FORBIDDEN_ROLE]
          - validations[priority 2]
          - roles.EmergencyCoordinator
        distinguishing_aspect: |
          Priority 2 is evaluated before any body parsing or entity lookup, so the coordinator's
          attempt at an admin-exclusive write is a 403 even when the path id does not exist.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with one owner registered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
          trigger:
            - call: "POST /owners/${owner_id}/fee-adjustments"
              payload: { entry_type: "CIVIL_PENALTY", amount_cents: 10000 }
              as: EmergencyCoordinator
            - call: "POST /owners/00000000-0000-0000-0000-0000000000ff/fee-adjustments"
              payload: { entry_type: "CIVIL_PENALTY", amount_cents: 10000 }
              as: EmergencyCoordinator
          assert:
            - "both calls return HTTP 403 with error_id ERR_FORBIDDEN_ROLE"
            - "the unknown-owner variant is still 403, proving the role gate precedes the 404 lookup"
            - "Owner.${owner_id}.fee_balance_cents == 0 and its ledger is empty"

      - name: unknown_engineer_identity_returns_403_identity_unknown
        claim_type: violation_to_error
        grounds:
          - errors[ERR_IDENTITY_UNKNOWN]
          - validations[priority 6]
          - roles.Engineer
        distinguishing_aspect: |
          An entity-backed role must resolve its X-User-ID to a live row: the header carries the
          correct role but an id that is not an Engineer, which is a 403 identity failure rather
          than the 404 an unknown path parameter would produce.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z with owner, engineer, reach and a registered dam."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /owners"
              payload: { legal_name: "Cascade Hydro LLC", owner_type: "PRIVATE", contact_email: "ops@cascadehydro.example", financial_assurance_bond_cents: 50000000 }
              as: ProgramAdmin
              captures: { owner_id: "$.data.id" }
            - call: "POST /engineers"
              payload: { full_name: "Dana Reyes", license_number: "PE-44120", license_expires_at: "2029-12-31T00:00:00Z", certified_hazard_classes: ["LOW", "SIGNIFICANT", "HIGH"] }
              as: ProgramAdmin
              captures: { eng_a_id: "$.data.id" }
            - call: "POST /river-reaches"
              payload: { name: "Little Bear Creek Reach 3", channel_capacity_cfs: 1200, downstream_community: "Elk Hollow" }
              as: ProgramAdmin
              captures: { reach_id: "$.data.id" }
            - call: "POST /dams"
              payload: { owner_id: "${owner_id}", river_reach_id: "${reach_id}", name: "Elk Hollow Dam", nid_code: "ST00123", height_ft: 62, gross_storage_acre_ft: 1500, crest_elevation_ft: 1042.5, normal_pool_elevation_ft: 1038.0, year_completed: 1968, registered_at: "2019-04-15T00:00:00Z" }
              as: ProgramAdmin
              captures: { dam_id: "$.data.id" }
          trigger:
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 9000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-A" }
              as: Engineer
              as_user_id: "00000000-0000-0000-0000-0000000000ff"
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 9000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-A" }
              as: Engineer
              as_user_id: "${owner_id}"
            - call: "POST /consequence-assessments"
              payload: { dam_id: "${dam_id}", population_at_risk: 3, habitable_structures: 2, critical_facilities: 0, breach_peak_outflow_cfs: 9000, breach_travel_time_minutes: 200, inundation_area_acres: 50, inundation_map_ref: "IM-2019-A" }
              as: Engineer
              as_user_id: "${eng_a_id}"
              captures: { a1_id: "$.data.id" }
          assert:
            - "the unknown-uuid identity returns HTTP 403 with error_id ERR_IDENTITY_UNKNOWN"
            - "an Owner id presented as an Engineer identity also returns HTTP 403 ERR_IDENTITY_UNKNOWN"
            - "the real engineer identity returns HTTP 201 with ConsequenceAssessment.${a1_id}.status == DRAFT and assessed_by_engineer_id == ${eng_a_id}"
            - "GET /consequence-assessments?dam_id=${dam_id} returns total_count 1"

