  # ---------------------------------------------------------------- rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: placement_confirm_requires_barn_available
        grounds:
          - state_machines.PigGroup
          - state_machines.Barn
          - errors[ERR_BARN_NOT_PLACEABLE]
        distinguishing_aspect: |
          Entity pair PigGroup -> Barn: confirm-placement is gated on the BARN's state, not
          the group's. Confirm fails while the barn is OCCUPIED, fails again while
          WASH_REQUIRED/DOWNTIME, and succeeds only after the wash -> verify -> 72h downtime
          -> release chain returns the barn to AVAILABLE.
        test_recipe:
          setup:
            - "Contract A ACTIVE; barn B1; group GA placed 03-02 (500 head, target 07-13); group GB scheduled 07-13 -> 08-24 (adjacent, legal)"
          setup_api_calls:
