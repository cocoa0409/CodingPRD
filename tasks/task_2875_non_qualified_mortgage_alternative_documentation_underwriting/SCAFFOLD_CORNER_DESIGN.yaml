          - errors.ERR_AUDIT_NOT_FOUND
          - errors.ERR_FINDING_NOT_FOUND
          - errors.ERR_POOL_NOT_FOUND
        distinguishing_aspect: "Each of the thirteen 404 codes belongs to exactly one resource family, so the same never-issued UUID must produce a different error_id on each endpoint - never a generic ERR_NOT_FOUND and never the parent's code on a child path."
        test_recipe:
