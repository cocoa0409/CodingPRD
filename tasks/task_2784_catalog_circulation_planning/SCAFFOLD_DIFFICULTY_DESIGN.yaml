          assert:
            - "${rental_resp} == 132 and ${rental_unit} == 9  # round_half_up(110 * 12000 / 10000) and round_half_up(8500 / 1000)"
            - "before the trigger: MergePurgeRun.${mp_id}.gross_input_names == 55000 and duplicates_removed == 5000 and net_mailable_names == 50000"
            - "before the trigger: ProspectListRental.${rental_id}.net_names_delivered == 20000"
            - "before the trigger: CirculationLine.${l_rental_id}.unit_cost_cents == 245 and allocated_quantity == 20000 and committed_cost_cents == 4900000"
            - "before the trigger: CirculationPlan.${plan_id}.status == COSTED and committed_cost_cents == 7260000 and planned_contribution_cents == -1134216"
            - "HOP 1: ProspectListRental.${rental_id}.status == CANCELLED with gross_names == 0 and net_names_delivered == 0"
            - "HOP 1: MergePurgeRun.${mp_id}.status == STALE"
            - "HOP 1: MergePurgeRun.${mp_id}.gross_input_names == 30000 and suppressed_names == 0 and duplicates_removed == 0 and net_mailable_names == 30000"
            - "HOP 1: MergePurgeRun.${mp_id}.gross_input_names == MergePurgeRun.${mp_id}.net_mailable_names + suppressed_names + duplicates_removed  # names conserved across the recompute"
            - "HOP 2: CirculationLine.${l_rental_id}.status == VOIDED with allocated_quantity == 0, mailable_quantity == 0, committed_cost_cents == 0, forecast_demand_cents == 0, gross_margin_cents == 0, circulation_cost_cents == 0, contribution_cents == 0"
            - "HOP 2: CirculationPlan.${plan_id}.committed_cost_cents == 2360000 and uncommitted_budget_cents == 17640000"
            - "HOP 3: Drop.${d1_id}.requested_quantity_total == 10000 and Drop.${d1_id}.planned_quantity == 10000"
            - "HOP 3: Drop.${d1_id}.cost_per_book_cents == 236 and Drop.${d1_id}.cost_basis == ESTIMATED_POSTAGE"
            - "HOP 4: CirculationPlan.${plan_id}.planned_cost_cents == 2360000"
            - "HOP 4: CirculationPlan.${plan_id}.planned_demand_cents == 11470000"
            - "HOP 4: CirculationPlan.${plan_id}.planned_contribution_cents == 2457400  # the -3591616 rental line has left the input set"
            - "HOP 4: CirculationPlan.${plan_id}.status == DRAFT  # the automatic COSTED -> DRAFT invalidation edge fired"
            - "CirculationLine.${l_house_id}.status == ALLOCATED and committed_cost_cents == 2360000  # the housefile line is untouched"

  # ===========================================================================
  # RULE 5 — priority_pair_validation_conflict (3 instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: plan_not_editable_at_40_wins_over_budget_exhausted_at_92
        grounds:
          - validations[priority=40]
          - validations[priority=92]
          - errors[ERR_PLAN_NOT_EDITABLE]
          - errors[ERR_PLAN_BUDGET_EXHAUSTED]
          - state_machines.CirculationPlan.COSTED_to_UNDER_REVIEW
          - state_machines.CirculationPlan.UNDER_REVIEW_to_DRAFT
        distinguishing_aspect: |
          Category pair = state (priority 40, ERR_PLAN_NOT_EDITABLE, 409) versus
          business_fiscal (priority 92, ERR_PLAN_BUDGET_EXHAUSTED, 422). Both are
          genuinely violated by one allocate call: the plan is UNDER_REVIEW AND only
          100 cents of a 4720100-cent budget remain against a 236-cent provisional
          book. The state rule wins; the control step proves the fiscal rule was live
          by re-issuing the identical call after request-revision returns the plan to
          DRAFT, which then yields the 422.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card."
            - "Segments S_A and S_B, both 30000 names / 620 bps / AOV 18500."
            - "Plan P1 with budget_cents 4720100 and a COMPLETED housefile-only merge-purge run."
            - "Drop 1 (page_count 64, in_home 2026-09-15) with an S_A line for 20000, allocated at the provisional 236 for 4720000 cents, leaving exactly 100 uncommitted cents."
            - "Drop 2 (page_count 64, in_home 2026-10-20) with a still-PROPOSED S_B line for 20000."
            - "Plan costed by u-planner-1 and submitted for review by u-planner-1, so it sits in UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_B", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_b_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 4720100 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 20000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 2, in_home_date: "2026-10-20", page_count: 64 }
              as: CirculationPlanner
              captures: { d2_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d2_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_b_id}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { l2_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
          trigger:
            - call: "POST /catalog-circulation/drops/${d2_id}/allocate"
              payload: {}
              as: CirculationPlanner
              captures: { err_state: "$.data.error_id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/request-revision"
              payload: { note: "trim drop 2" }
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/drops/${d2_id}/allocate"
              payload: {}
              as: CirculationPlanner
              captures: { err_budget: "$.data.error_id" }
          assert:
            - "before the trigger: CirculationPlan.${plan_id}.committed_cost_cents == 4720000 and uncommitted_budget_cents == 100"
            - "${err_state} == ERR_PLAN_NOT_EDITABLE with HTTP 409  # priority 40 beats priority 92"
            - "${err_state} != ERR_PLAN_BUDGET_EXHAUSTED"
            - "after the first trigger: CirculationLine.${l2_id}.status == PROPOSED and allocated_quantity == 0 and committed_cost_cents == 0"
            - "after the first trigger: CirculationPlan.${plan_id}.committed_cost_cents == 4720000  # the rejected call has no partial effect"
            - "after request-revision: CirculationPlan.${plan_id}.status == DRAFT and revision_round == 1"
            - "${err_budget} == ERR_PLAN_BUDGET_EXHAUSTED with HTTP 422  # the fiscal rule was live all along: floor(100 / 236) == 0 books fundable"
            - "after the second trigger: CirculationLine.${l2_id}.status == PROPOSED and CirculationPlan.${plan_id}.uncommitted_budget_cents == 100"

      - name: segment_suppressed_at_55_wins_over_inhome_spacing_at_74
        grounds:
          - validations[priority=55]
          - validations[priority=74]
          - errors[ERR_SEGMENT_SUPPRESSED]
          - errors[ERR_INHOME_SPACING_VIOLATION]
          - entities.HousefileSegment.fields.contact_strategy
          - entities.CatalogSeason.fields.min_inhome_gap_days
        distinguishing_aspect: |
          Category pair = business_safety (priority 55, ERR_SEGMENT_SUPPRESSED, 422)
          versus business_temporal (priority 74, ERR_INHOME_SPACING_VIOLATION, 409) —
          a DIFFERENT pair from the state/business_fiscal instance. One
          circulation-line create violates both: the segment has been patched to
          SUPPRESS_ONLY AND the target drop's in-home date is only 5 days after the
          drop that already carries that segment (min_inhome_gap_days is 21). The
          safety rule wins; patching the strategy back to STANDARD and repeating the
          identical call proves the temporal rule was live by producing the 409.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card (min_inhome_gap_days 21)."
            - "Segment S_A (30000 names, 620 bps, AOV 18500), initially BEST / PREMIUM_FULL."
            - "Plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run."
            - "Drop 1 (page_count 64, in_home 2026-09-15) already carries a PROPOSED S_A line, so S_A occupies the 21-day buffer around 2026-09-15."
            - "Drop 2 (page_count 64, in_home 2026-09-20) is empty."
            - "S_A is then patched to contact_strategy SUPPRESS_ONLY."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { l1_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 2, in_home_date: "2026-09-20", page_count: 64 }
              as: CirculationPlanner
              captures: { d2_id: "$.data.id" }
            - call: "PATCH /catalog-circulation/housefile-segments/${seg_a_id}"
              payload: { contact_strategy: "SUPPRESS_ONLY" }
              as: CirculationPlanner
              captures: { strategy_after_patch: "$.data.contact_strategy" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d2_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 5000 }
              as: CirculationPlanner
              captures: { err_safety: "$.data.error_id" }
            - call: "PATCH /catalog-circulation/housefile-segments/${seg_a_id}"
              payload: { contact_strategy: "STANDARD" }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d2_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 5000 }
              as: CirculationPlanner
              captures: { err_temporal: "$.data.error_id" }
          assert:
            - "${strategy_after_patch} == SUPPRESS_ONLY  # the explicit PATCH overrides the BEST tier default"
            - "${err_safety} == ERR_SEGMENT_SUPPRESSED with HTTP 422  # priority 55 beats priority 74"
            - "${err_safety} != ERR_INHOME_SPACING_VIOLATION"
            - "${err_temporal} == ERR_INHOME_SPACING_VIOLATION with HTTP 409  # the 5-day gap was under the 21-day buffer all along"
            - "GET /catalog-circulation/circulation-lines?drop_id=${d2_id} returns total_count == 0  # neither rejected call created a line"
            - "CirculationLine.${l1_id}.status == PROPOSED  # drop 1's line is untouched by either rejection"

      - name: auth_forbidden_role_at_20_wins_over_line_not_found_at_30
        grounds:
          - validations[priority=20]
          - validations[priority=30]
          - errors[ERR_FORBIDDEN_ROLE]
          - errors[ERR_LINE_NOT_FOUND]
          - roles.MarketingAnalyst
          - roles.CirculationPlanner
        distinguishing_aspect: |
          Category pair = auth (priority 20, ERR_FORBIDDEN_ROLE, 403) versus existence
          (priority 30, ERR_LINE_NOT_FOUND, 404) — a third distinct pair. One void
          call names a UUID that does not exist AND arrives under MarketingAnalyst, a
          role POST /circulation-lines/{id}/void does not grant. The auth rule wins,
          so an unauthorised caller cannot use 403-versus-404 to probe which
          circulation-line ids exist; repeating the identical non-existent id under
          CirculationPlanner then returns the 404.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 exists so the API is warm, but no CirculationLine is ever created."
            - "The probed id 00000000-0000-0000-0000-000000000000 corresponds to no CirculationLine."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/circulation-lines/00000000-0000-0000-0000-000000000000/void"
              payload: { reason: "probe" }
              as: MarketingAnalyst
              captures: { err_auth: "$.data.error_id" }
            - call: "POST /catalog-circulation/circulation-lines/00000000-0000-0000-0000-000000000000/void"
              payload: { reason: "probe" }
              as: CirculationPlanner
              captures: { err_missing: "$.data.error_id" }
          assert:
            - "${err_auth} == ERR_FORBIDDEN_ROLE with HTTP 403  # priority 20 beats priority 30"
            - "${err_auth} != ERR_LINE_NOT_FOUND"
            - "${err_missing} == ERR_LINE_NOT_FOUND with HTTP 404  # the existence rule was live all along"
            - "the two responses carry different HTTP statuses (403 then 404) for the identical path and payload"

  # ===========================================================================
  # RULE 6 — boundary_precision_check (3 instances, different metrics AND
  #          three distinct endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: automation_share_exactly_nine_thousand_bps_qualifies
        grounds:
          - calculations.drop_postage_total
          - calculations.drop_postage_total.constants.automation_qualification_threshold_bps
          - calculations.drop_cost_per_book
          - entities.Drop.fields.automation_share_bps
          - entities.Drop.fields.automation_qualified
          - endpoints[POST /catalog-circulation/drops/{id}/presort]
        distinguishing_aspect: |
          Metric = automation_share_bps, an all-or-nothing FLOORED share threshold, and
          the tested endpoint is POST /drops/{id}/presort. One piece moved between the
          two batches straddles the line: 18000 of 20000 automation pieces floors to
          exactly 9000 and qualifies, while 17999 of 20000 is 8999.5 which FLOORS to
          8999 and forfeits the entire 2-cent-per-piece discount. That the exact-hit
          side qualifies (>= not >) and that flooring - not rounding - decides 8999.5
          are two independent off-by-one traps, and the 2-cent difference in cost per
          book (223 vs 225) makes both observable on the drop, not just on the share.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card (automation threshold 9000 bps, discount 2 cents per automation piece, FIVE_DIGIT 42, MIXED_AADC 58, minimum 150 pieces for FIVE_DIGIT)."
            - "Segments S_A and S_B, each 30000 names / 620 bps / AOV 18500 (so no in-home spacing interaction between the two drops)."
            - "Plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run, approved by u-director-9 after u-planner-1 costed and submitted it."
            - "Drop A (page_count 64, in_home 2026-09-15) carries S_A for 20000 and drop B (page_count 64, in_home 2026-09-16) carries S_B for 20000; both allocated at the provisional 236 for 4720000 cents each. page_count 64 gives weight_oz_milli 2560, which is under the 4000 free allowance, so the weight surcharge is 0 and only the share threshold moves the answer."
            - "Drop A is batched 18000 FIVE_DIGIT + 2000 MIXED_AADC; drop B is batched 17999 FIVE_DIGIT + 2001 MIXED_AADC. Both cover their planned_quantity of 20000 exactly, so ERR_PRESORT_COVERAGE_MISMATCH does not fire on either."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_B", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_b_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { da_id: "$.data.id", da_weight: "$.data.weight_oz_milli" }
            - call: "POST /catalog-circulation/drops/${da_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { la_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${da_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 2, in_home_date: "2026-09-16", page_count: 64 }
              as: CirculationPlanner
              captures: { db_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${db_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_b_id}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { lb_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${db_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/drops/${da_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 18000 }
              as: CirculationPlanner
              captures: { ba1_tier: "$.data.effective_tier", ba1_rate: "$.data.rate_cents_per_piece", ba1_postage: "$.data.batch_postage_cents", ba1_auto: "$.data.is_automation_qualified", ba1_surcharge: "$.data.weight_surcharge_cents_per_piece" }
            - call: "POST /catalog-circulation/drops/${da_id}/presort-batches"
              payload: { declared_tier: "MIXED_AADC", piece_count: 2000 }
              as: CirculationPlanner
              captures: { ba2_postage: "$.data.batch_postage_cents", ba2_auto: "$.data.is_automation_qualified" }
            - call: "POST /catalog-circulation/drops/${db_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 17999 }
              as: CirculationPlanner
              captures: { bb1_postage: "$.data.batch_postage_cents" }
            - call: "POST /catalog-circulation/drops/${db_id}/presort-batches"
              payload: { declared_tier: "MIXED_AADC", piece_count: 2001 }
              as: CirculationPlanner
              captures: { bb2_postage: "$.data.batch_postage_cents" }
          trigger:
            - call: "POST /catalog-circulation/drops/${da_id}/presort"
              payload: {}
              as: CirculationPlanner
              captures: { da_share: "$.data.automation_share_bps", da_qualified: "$.data.automation_qualified", da_postage: "$.data.postage_total_cents", da_cpb: "$.data.cost_per_book_cents" }
            - call: "POST /catalog-circulation/drops/${db_id}/presort"
              payload: {}
              as: CirculationPlanner
              captures: { db_share: "$.data.automation_share_bps", db_qualified: "$.data.automation_qualified", db_postage: "$.data.postage_total_cents", db_cpb: "$.data.cost_per_book_cents" }
          assert:
            - "${da_weight} == 2560 and ${ba1_surcharge} == 0  # 2560 < the 4000 free allowance, so weight plays no part"
            - "${ba1_tier} == FIVE_DIGIT and ${ba1_rate} == 42 and ${ba1_postage} == 756000 and ${ba1_auto} == true  # 18000 >= the 150-piece minimum"
            - "${ba2_postage} == 116000 and ${ba2_auto} == false  # MIXED_AADC at 58 is never an automation tier"
            - "${bb1_postage} == 755958 and ${bb2_postage} == 116058"
            - "AT the boundary: ${da_share} == 9000 and ${da_qualified} == true  # floor(18000 * 10000 / 20000)"
            - "AT the boundary: ${da_postage} == 836000  # 872000 batch sum minus 2 * 18000 automation pieces"
            - "AT the boundary: Drop.${da_id}.postage_cents_per_book == 42 and ${da_cpb} == 223  # round_half_up(836000 / 20000) == 42 on top of 166 printing + 15 paper"
            - "ONE PIECE BELOW: ${db_share} == 8999 and ${db_qualified} == false  # 17999 * 10000 / 20000 is exactly 8999.5 and FLOORS to 8999, it does not round to 9000"
            - "ONE PIECE BELOW: ${db_postage} == 872016  # the whole discount is forfeited, not pro-rated"
            - "ONE PIECE BELOW: Drop.${db_id}.postage_cents_per_book == 44 and ${db_cpb} == 225  # round_half_up(872016 / 20000) == 44"
            - "${db_postage} - ${da_postage} == 36016  # one piece of declared tier is worth 36016 cents of postage at this boundary"
            - "both drops: cost_basis == PRESORTED_ACTUAL and production_status == PRESORTED"
            - "CirculationLine.${la_id}.circulation_cost_cents == 4460000 and CirculationLine.${lb_id}.circulation_cost_cents == 4500000  # 20000 * 223 and 20000 * 225"
            - "both lines keep committed_cost_cents == 4720000  # committed is frozen at the provisional 236 and is NOT restated by presort"

      - name: zero_responder_control_cell_yields_insufficient_control
        grounds:
          - calculations.test_cell_lift
          - calculations.test_cell_lift.constants.min_sample_quantity
          - entities.TestCell.fields.lift_bps
          - entities.TestCell.fields.significance
          - endpoints[POST /catalog-circulation/test-cells/{id}/measure]
          - state_machines.TestCell.PLANNED_to_MEASURED
        distinguishing_aspect: |
          Metric = the control response_rate_bps DENOMINATOR at exactly zero, on a
          DIFFERENT endpoint (POST /test-cells/{id}/measure). Relative lift is
          undefined when the control drew no responders, so the boundary is not a
          threshold comparison but a divide-by-zero guard that must resolve to
          lift_bps 0 with significance INSUFFICIENT_CONTROL rather than to an
          exception, an infinity or a silently huge lift. It also pins the re-scoring
          direction: measuring the CONTROL second must re-score the already-MEASURED
          test cell, and re-scoring it against a zero rate must not turn its 380-bps
          response into a SIGNIFICANT result.
        test_recipe:
          setup:
            - "Logical clock stepped 2026-08-01 -> 2026-09-20T00:00:00Z."
            - "Season FW26 on the default rate card; segment S_A (30000 names, 620 bps, AOV 18500)."
            - "Plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run; drop 1 (page_count 64, in_home 2026-09-15) with an S_A line for 20000, allocated at the provisional 236 (mailable_quantity 20000)."
            - "Two PLANNED test cells on that line: T_A (test_type OFFER, cell_role TEST, quantity 5000) and T_C (test_type OFFER, cell_role CONTROL, quantity 5000). Both quantities are >= the 1000 minimum sample, so the sample guard cannot mask the control guard, and 5000 + 5000 <= the line's 20000 mailable books."
            - "The plan is costed, submitted, approved; drop 1 is presorted as a single 20000-piece FIVE_DIGIT batch (postage_total 800000, cost_per_book 221) and mailed at 2026-09-20, which is what unlocks measurement."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { l1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-lines/${l1_id}/test-cells"
              payload: { cell_code: "T_A", test_type: "OFFER", cell_role: "TEST", quantity: 5000 }
              as: MarketingAnalyst
              captures: { cell_test_id: "$.data.id", cell_test_sig0: "$.data.significance" }
            - call: "POST /catalog-circulation/circulation-lines/${l1_id}/test-cells"
              payload: { cell_code: "T_C", test_type: "OFFER", cell_role: "CONTROL", quantity: 5000 }
              as: MarketingAnalyst
              captures: { cell_ctrl_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/drops/${d1_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 20000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/drops/${d1_id}/presort"
              payload: {}
              as: CirculationPlanner
              captures: { d1_cpb: "$.data.cost_per_book_cents" }
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-09-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/drops/${d1_id}/mail"
              payload: {}
              as: CirculationPlanner
              captures: { d1_prod: "$.data.production_status" }
          trigger:
            - call: "POST /catalog-circulation/test-cells/${cell_test_id}/measure"
              payload: { responders: 190, demand_cents: 3515000 }
              as: MarketingAnalyst
              captures: { test_rate: "$.data.response_rate_bps", test_lift_before: "$.data.lift_bps", test_sig_before: "$.data.significance" }
            - call: "POST /catalog-circulation/test-cells/${cell_ctrl_id}/measure"
              payload: { responders: 0, demand_cents: 0 }
              as: MarketingAnalyst
              captures: { ctrl_rate: "$.data.response_rate_bps", ctrl_lift: "$.data.lift_bps", ctrl_sig: "$.data.significance" }
          assert:
            - "${cell_test_sig0} == UNMEASURED and ${d1_prod} == MAILED and ${d1_cpb} == 221"
            - "${test_rate} == 380  # round_half_up(190 * 10000 / 5000)"
            - "${test_sig_before} == INSUFFICIENT_CONTROL and ${test_lift_before} == 0  # no MEASURED control existed yet"
            - "AT the boundary: ${ctrl_rate} == 0  # round_half_up(0 * 10000 / 5000)"
            - "AT the boundary: ${ctrl_lift} == 0 and ${ctrl_sig} == INSUFFICIENT_CONTROL  # a CONTROL cell never scores lift against itself"
            - "RE-SCORE: TestCell.${cell_test_id}.significance == INSUFFICIENT_CONTROL and lift_bps == 0  # measuring the control re-scored the sibling, and a zero-rate control still yields no lift rather than a divide-by-zero or an infinite lift"
            - "RE-SCORE: TestCell.${cell_test_id}.significance != SIGNIFICANT and != NOT_SIGNIFICANT and != INSUFFICIENT_SAMPLE  # both cells are at 5000 >= the 1000 minimum, so the sample guard is NOT what fired"
            - "TestCell.${cell_test_id}.status == MEASURED and TestCell.${cell_ctrl_id}.status == MEASURED"
            - "TestCell.${cell_test_id}.responders == 190 and demand_cents == 3515000; TestCell.${cell_ctrl_id}.responders == 0 and demand_cents == 0"
            - "GET /catalog-circulation/circulation-lines/${l1_id}/test-cells returns total_count == 2 ordered T_A then T_C  # cell_code ASC"

      - name: fatigue_score_exactly_at_threshold_suppresses
        grounds:
          - calculations.contact_fatigue_score
          - calculations.contact_fatigue_score.constants.channel_weights
          - calculations.contact_fatigue_score.constants.decay_bands_bps
          - entities.CatalogSeason.fields.fatigue_suppression_threshold
          - entities.HousefileSegment.fields.fatigue_score
          - entities.HousefileSegment.fields.suppressed_at
          - endpoints[POST /catalog-circulation/contact-events]
        distinguishing_aspect: |
          Metric = fatigue_score against fatigue_suppression_threshold, on a THIRD
          endpoint (POST /contact-events). The comparison is >= rather than >, so the
          exact hit must suppress; the fixture proves it by holding the three contact
          events identical (MAIL 40 + MAIL 40 + EMAIL 12 == 92) and moving only the
          season's threshold between 92 and 93. That isolates the comparison operator
          from the arithmetic: a > implementation leaves both segments contactable and
          a >= implementation suppresses exactly one, and the paired suppressed_at
          (set to the logical clock versus still null) makes the difference visible on
          two fields rather than one.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Season FW26A with fatigue_suppression_threshold 92 (all other rate-card values default) and season FW26B with fatigue_suppression_threshold 93."
            - "Segment S_P92 in FW26A and S_P93 in FW26B, both created with recency_days 45 / orders_12mo 7 / ltv_cents 62000, so both score rfm 1000, tier BEST and default contact_strategy PREMIUM_FULL."
            - "No circulation plan is needed: the flip is observable on the segment itself."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26A", fiscal_year: 2026, fatigue_suppression_threshold: 92 }
              as: PlatformAdmin
              captures: { season_a_id: "$.data.id", thresh_a: "$.data.fatigue_suppression_threshold", window_a: "$.data.fatigue_window_days" }
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26B", fiscal_year: 2026, fatigue_suppression_threshold: 93 }
              as: PlatformAdmin
              captures: { season_b_id: "$.data.id", thresh_b: "$.data.fatigue_suppression_threshold" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_a_id}", segment_code: "S_P92", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg92_id: "$.data.id", seg92_rfm: "$.data.rfm_score", seg92_strategy0: "$.data.contact_strategy", seg92_fatigue0: "$.data.fatigue_score" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_b_id}", segment_code: "S_P93", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg93_id: "$.data.id" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg92_id}", channel: "MAIL", contact_date: "2026-08-01", source: "MANUAL" }
              as: MarketingAnalyst
              captures: { ev1_weight: "$.data.channel_weight", ev1_decay: "$.data.decay_factor_bps", ev1_points: "$.data.weighted_points" }
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg92_id}", channel: "MAIL", contact_date: "2026-08-01", source: "MANUAL" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg93_id}", channel: "MAIL", contact_date: "2026-08-01", source: "MANUAL" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg93_id}", channel: "MAIL", contact_date: "2026-08-01", source: "MANUAL" }
              as: MarketingAnalyst
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg93_id}", channel: "EMAIL", contact_date: "2026-08-01", source: "MANUAL" }
              as: MarketingAnalyst
              captures: { ev93_points: "$.data.weighted_points" }
            - call: "GET /catalog-circulation/housefile-segments/${seg92_id}"
              payload: {}
              as: CirculationPlanner
              captures: { seg92_fatigue_before: "$.data.fatigue_score", seg92_strategy_before: "$.data.contact_strategy" }
          trigger:
            - call: "POST /catalog-circulation/contact-events"
              payload: { housefile_segment_id: "${seg92_id}", channel: "EMAIL", contact_date: "2026-08-01", source: "MANUAL" }
              as: MarketingAnalyst
              captures: { ev3_weight: "$.data.channel_weight", ev3_points: "$.data.weighted_points" }
          assert:
            - "${thresh_a} == 92 and ${thresh_b} == 93 and ${window_a} == 90  # only the threshold differs between the two seasons"
            - "${seg92_rfm} == 1000 and ${seg92_strategy0} == PREMIUM_FULL and ${seg92_fatigue0} == 0"
            - "${ev1_weight} == 40 and ${ev1_decay} == 10000 and ${ev1_points} == 40  # days_ago 0 sits in the <= 14 band"
            - "${ev3_weight} == 12 and ${ev3_points} == 12  # EMAIL is 12 points undecayed"
            - "${seg92_fatigue_before} == 80 and ${seg92_strategy_before} == PREMIUM_FULL  # one EMAIL short of the threshold"
            - "AT the boundary: HousefileSegment.${seg92_id}.fatigue_score == 92  # 40 + 40 + 12, each event rounded independently then summed exactly"
            - "AT the boundary: HousefileSegment.${seg92_id}.contact_strategy == SUPPRESS_ONLY  # 92 >= 92 suppresses; a strictly-greater-than implementation would leave it PREMIUM_FULL"
            - "AT the boundary: HousefileSegment.${seg92_id}.suppressed_at == 2026-08-01T00:00:00Z"
            - "ONE POINT ABOVE the threshold: HousefileSegment.${seg93_id}.fatigue_score == 92 as well and ${ev93_points} == 12"
            - "ONE POINT ABOVE the threshold: HousefileSegment.${seg93_id}.contact_strategy == PREMIUM_FULL and suppressed_at == null  # 92 < 93"
            - "GET /catalog-circulation/housefile-segments/${seg92_id}/contact-events returns total_count == 3 and GET /catalog-circulation/housefile-segments/${seg93_id}/contact-events returns total_count == 3  # identical contact histories"

  # ===========================================================================
  # RULE 7 — cross_entity_state_dependency (3 instances, different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: presorting_a_drop_requires_its_plan_to_be_approved
        grounds:
          - state_machines.Drop.production_status.PLANNED_to_PRESORTED
          - state_machines.CirculationPlan.UNDER_REVIEW_to_APPROVED
          - errors[ERR_INVALID_PLAN_STATE]
          - validations[priority=42]
          - endpoints[POST /catalog-circulation/drops/{id}/presort]
        distinguishing_aspect: |
          Entity pair = (Drop, CirculationPlan): the Drop's own production_status is a
          legal PLANNED and its presort batches already cover planned_quantity
          exactly, so the only thing blocking the transition is the state of a
          DIFFERENT entity - the owning plan, which is merely COSTED. The guard is
          proved to be cross-entity rather than self-referential because the failing
          and succeeding calls are byte-identical and nothing about the Drop changes
          between them; only the plan advances COSTED -> UNDER_REVIEW -> APPROVED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card; segment S_A (30000 names, 620 bps, AOV 18500)."
            - "Plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run; drop 1 (page_count 64, in_home 2026-09-15) with an S_A line for 20000, allocated at the provisional 236 for 4720000 cents."
            - "A single 20000-piece FIVE_DIGIT presort batch already covers the drop's planned_quantity, so ERR_PRESORT_COVERAGE_MISMATCH cannot fire."
            - "The plan is costed by u-planner-1 and left in COSTED - deliberately NOT submitted or approved."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a_id}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { l1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
              captures: { d1_planned_qty: "$.data.planned_quantity" }
            - call: "POST /catalog-circulation/drops/${d1_id}/presort-batches"
              payload: { declared_tier: "FIVE_DIGIT", piece_count: 20000 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cost"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
              captures: { plan_status_costed: "$.data.status" }
          trigger:
            - call: "POST /catalog-circulation/drops/${d1_id}/presort"
              payload: {}
              as: CirculationPlanner
              captures: { err_plan_state: "$.data.error_id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/submit-review"
              payload: {}
              as: CirculationPlanner
              as_user_id: "u-planner-1"
            - call: "POST /catalog-circulation/drops/${d1_id}/presort"
              payload: {}
              as: CirculationPlanner
              captures: { err_plan_state_2: "$.data.error_id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/approve"
              payload: {}
              as: CirculationDirector
              as_user_id: "u-director-9"
            - call: "POST /catalog-circulation/drops/${d1_id}/presort"
              payload: {}
              as: CirculationPlanner
              captures: { d1_prod: "$.data.production_status", d1_basis: "$.data.cost_basis", d1_cpb: "$.data.cost_per_book_cents", d1_postage: "$.data.postage_total_cents" }
          assert:
            - "${d1_planned_qty} == 20000 and ${plan_status_costed} == COSTED"
            - "BLOCKED by the plan: ${err_plan_state} == ERR_INVALID_PLAN_STATE with HTTP 409 while the drop's own production_status is a perfectly legal PLANNED"
            - "BLOCKED by the plan: Drop.${d1_id}.production_status == PLANNED and postage_total_cents == 0 and cost_basis == ESTIMATED_POSTAGE  # the rejected call had no partial effect"
            - "STILL BLOCKED at UNDER_REVIEW: ${err_plan_state_2} == ERR_INVALID_PLAN_STATE with HTTP 409  # only APPROVED unlocks it, not merely leaving DRAFT"
            - "UNBLOCKED: ${d1_prod} == PRESORTED and ${d1_basis} == PRESORTED_ACTUAL"
            - "UNBLOCKED: ${d1_postage} == 800000 and ${d1_cpb} == 221  # 20000 * 42 minus 2 * 20000 automation pieces, so 40 postage per book on 166 printing + 15 paper"
            - "UNBLOCKED: CirculationLine.${l1_id}.circulation_cost_cents == 4420000 and contribution_cents == 5214800  # re-derived at the presorted 221"
            - "UNBLOCKED: CirculationPlan.${plan_id}.status == APPROVED  # the presort recompute does not move the plan's own status"
            - "the three trigger calls are byte-identical, so the differing outcomes are attributable only to the plan's state"

      - name: allocating_a_rental_line_requires_its_rental_to_be_netted
        grounds:
          - validations[priority=62]
          - errors[ERR_RENTAL_NOT_NETTED]
          - state_machines.ProspectListRental.DELIVERED_to_NETTED
          - state_machines.CirculationLine.PROPOSED_to_ALLOCATED
          - calculations.merge_purge_net_mailable_names
          - calculations.circulation_waterfall_allocation
          - entities.ProspectListRental.fields.net_names_delivered
        distinguishing_aspect: |
          Entity pair = (CirculationLine, ProspectListRental) - a different pair from
          (Drop, CirculationPlan), and the dependency runs sideways across aggregates
          rather than up to a parent. The line is a valid PROPOSED row on a valid
          PLANNED drop under a valid DRAFT plan with a COMPLETED merge-purge run; the
          block comes purely from R1 still sitting in DELIVERED because the first
          merge-purge run was executed over an empty rental list and therefore never
          netted it. Re-running merge-purge WITH R1 moves R1 to NETTED and the
          identical allocate call then succeeds, which also proves the rental's
          net_names_delivered - not its requested quantity - caps the allocation.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; season FW26 on the default rate card (prospect_base_response_bps 110)."
            - "Segment S_A (30000 names) supplies the housefile side of the universe but is NOT lined on the drop."
            - "Rental R1: requested 25000 names at 8500 CPM, housefile_overlap_bps 2000, inter_list_overlap_bps 0; modelled at coop_model_score 640, ordered (unit_cost_cents_per_name 9) and delivered with 25000 gross names - so it reaches DELIVERED but no further."
            - "Plan P1 budget 20000000 with a first COMPLETED merge-purge run whose input_rental_ids is the empty array, which nets the housefile only and leaves R1 in DELIVERED."
            - "Drop 1 (page_count 64, in_home 2026-09-15) carries a single RENTAL line for 25000 books against R1."
          setup_api_calls:
            - call: "POST /catalog-circulation/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "COOP-A", requested_gross_names: 25000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 2000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { rental_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${rental_id}/model"
              payload: { coop_model_score: 640 }
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${rental_id}/order"
              payload: {}
              as: ListBroker
              captures: { rental_unit: "$.data.unit_cost_cents_per_name" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${rental_id}/deliver"
              payload: { delivered_gross_names: 25000 }
              as: ListBroker
              captures: { rental_status_delivered: "$.data.status", rental_net_before: "$.data.net_names_delivered" }
            - call: "POST /catalog-circulation/circulation-plans"
