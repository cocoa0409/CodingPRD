      - name: duplicate_assignment_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DUPLICATE_ASSIGNMENT]"]
        distinguishing_aspect: "A reviewer with an OFFERED assignment on a protocol cannot be assigned to it again; after they DECLINE, a fresh assignment to the same reviewer succeeds (terminal DECLINED frees the pair)."
        test_recipe:
          setup: ["Protocol P UNDER_EXPEDITED_REVIEW; reviewer r1 with an OFFERED assignment"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr DA", email: "da@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev DA", email: "revda@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { r1: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "DupAsg", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
              captures: { p: $.data.id }
            - call: "POST /irb/protocols/${p}/consent-documents"
              payload: { file_ref: "s3://consent/da.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_id}"
            - call: "POST /irb/protocols/${p}/determinations"
              payload: { determined_review_level: "EXPEDITED" }
              as: IrbCoordinator
            - call: "POST /irb/protocols/${p}/review-assignments"
              payload: { reviewer_id: "${r1}", reviewer_role: "PRIMARY" }
              as: IrbCoordinator
              captures: { a1: $.data.id }
          trigger:
            - call: "POST /irb/protocols/${p}/review-assignments"
              payload: { reviewer_id: "${r1}", reviewer_role: "SECONDARY" }
              as: IrbCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /irb/review-assignments/${a1}/respond"
              payload: { response: "DECLINE" }
              as: Reviewer
              as_user_id: "${r1}"
            - call: "POST /irb/protocols/${p}/review-assignments"
              payload: { reviewer_id: "${r1}", reviewer_role: "SECONDARY" }
              as: IrbCoordinator
              captures: { a2: $.data.id }
          assert:
            - "Second offer while OFFERED: error_id ERR_DUPLICATE_ASSIGNMENT (http 409)"
            - "After DECLINE, re-assignment succeeds: ReviewAssignment.${a2}.status == OFFERED"

