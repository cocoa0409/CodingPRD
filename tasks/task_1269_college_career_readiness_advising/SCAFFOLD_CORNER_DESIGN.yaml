  # ===========================================================================
  - section: endpoints
    instances:
      - name: equity_report_shape_and_reverse_lookups
        claim_type: computed_read
        grounds: ["endpoints.GET /ccr/advisors/{id}/equity-report", "endpoints.GET /ccr/advisors/{id}/students", "endpoints.GET /ccr/students/{id}/plans"]
        distinguishing_aspect: "The computed read returns every declared inline field, and the FK reverse-reachability GETs return arrays (0..n) for advisor->students and student->plans."
        test_recipe:
          setup: ["Advisor A with one student who has one DRAFT plan"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "EQ Adv", email: "eqa@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GEQ", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "EQ1", full_name: "Stu EQ", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad}" }, as: DistrictAdmin, captures: { s: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s}/plans", payload: { pathway_id: "${pw}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad}" }
          trigger:
            - { call: "GET /ccr/advisors/${ad}/equity-report", as: Advisor, as_user_id: "${ad}" }
            - { call: "GET /ccr/advisors/${ad}/students", as: Advisor, as_user_id: "${ad}" }
            - { call: "GET /ccr/students/${s}/plans", as: Advisor, as_user_id: "${ad}" }
          assert:
            - "equity-report carries advisor_id, active_caseload_count (== 1), caseload_load_simple, caseload_load_weighted, equity_gap_index, target_caseload, district_total_students, district_total_capacity"
            - "GET /ccr/advisors/${ad}/students returns array of length 1 containing ${s}"
            - "GET /ccr/students/${s}/plans returns array of length 1 with status DRAFT"

      - name: application_create_autoseeds_milestones
        claim_type: side_effect_execution
        grounds: ["endpoints.POST /ccr/students/{id}/applications", "entities.ApplicationMilestone"]
        distinguishing_aspect: "Creation side effect: exactly three required milestones (ESSAY, TRANSCRIPT, FEE_PAYMENT) are seeded READY with due_at == application.deadline_at, ordered created_at ASC."
        test_recipe:
          setup: ["Advisor A; pathway GEN; student; ACTIVE plan"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "AS Adv", email: "asa@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GAS", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "AS1", full_name: "Stu AS", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad}" }, as: DistrictAdmin, captures: { s: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s}/plans", payload: { pathway_id: "${pw}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad}", captures: { pl: $.data.id } }
            - { call: "POST /ccr/plans/${pl}/activate", as: Advisor, as_user_id: "${ad}" }
          trigger:
            - { call: "POST /ccr/students/${s}/applications", payload: { college_name: "State U", program_type: "TRADE_PROGRAM", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s}", captures: { ap: $.data.id } }
            - { call: "GET /ccr/applications/${ap}/milestones", as: Student, as_user_id: "${s}" }
          assert:
            - "Exactly 3 milestones exist; kinds == [ESSAY, TRANSCRIPT, FEE_PAYMENT] in created_at ASC order"
            - "Each has required == true, status == READY (no dependency), due_at == 2026-06-15T00:00:00Z"
            - "Application.${ap}.submission_status == DRAFT and decision_status == NONE"

      - name: ops_run_monotonic_index_and_counters
        claim_type: conditional_action
        grounds: ["endpoints.POST /ccr/ops-runs", "entities.OpsRun.fields.run_index"]
        distinguishing_aspect: "Run index is a monotonic epoch counter (1, then 2) and counters reflect only that run's sweep — an epoch with no overdue milestones marks nothing."
        test_recipe:
          setup: ["One application with a milestone due far in the future (no misses possible)"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "OP Adv", email: "opa@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GOP", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "OP1", full_name: "Stu OP", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad}" }, as: DistrictAdmin, captures: { s: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s}/plans", payload: { pathway_id: "${pw}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad}", captures: { pl: $.data.id } }
            - { call: "POST /ccr/plans/${pl}/activate", as: Advisor, as_user_id: "${ad}" }
            - { call: "POST /ccr/students/${s}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s}" }
          trigger:
            - { call: "POST /ccr/ops-runs", as: DistrictAdmin, captures: { r1: $.data.id } }
            - { call: "POST /ccr/ops-runs", as: DistrictAdmin, captures: { r2: $.data.id } }
          assert:
            - "OpsRun.${r1}.run_index == 1 and OpsRun.${r2}.run_index == 2"
            - "OpsRun.${r1}.milestones_marked_missed == 0 and applications_regressed == 0 (all dues 2026-06-15 > now)"
            - "OpsRun.${r1}.reminders_queued == 0 (2026-06-15 is outside [2026-05-01, 2026-05-08)) and plans_recomputed >= 1"

  # ===========================================================================
  - section: errors
    instances:
      - name: error_envelope_shape_on_4xx
        claim_type: violation_to_error
        grounds: ["response_envelope", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Error responses use the fixed §1.0 envelope: meta.api_request_id + meta.api_request_timestamp present, response_type == error, data.error_id and data.message populated."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /ccr/students/00000000-0000-4000-8000-000000000000"
              as: DistrictAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error; data.error_id == ERR_NOT_FOUND; data.message is a non-empty string; meta.api_request_id present"

      - name: error_caseload_full_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_CASELOAD_FULL]"]
        excluded_because:
          difficulty_instance: caseload_full_at_exact_max
          rationale: "Asserted as the failure path of the named §1.8 boundary instance."

      - name: error_site_capacity_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_SITE_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: site_capacity_at_exact_max
          rationale: "Asserted (both the exact-max pass and the overflow reject) in the named §1.8 instance."

      - name: error_placement_overlap_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLACEMENT_OVERLAP]"]
        excluded_because:
          difficulty_instance: student_pairwise_half_open_overlap
          rationale: "Asserted on the interior-overlap reject in the named §1.8 instance."

      - name: error_credits_shortfall_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_CREDITS_SHORTFALL]"]
        excluded_because:
          difficulty_instance: audit_credits_exact_threshold
          rationale: "23.5-credit audit fails with this error in the named §1.8 instance."

      - name: error_open_enrollments_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPEN_ENROLLMENTS]"]
        excluded_because:
          difficulty_instance: audit_certify_blocked_by_open_enrollment
          rationale: "Certify rejection asserted in the named §1.8 instance."

      - name: error_student_not_graduated_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_STUDENT_NOT_GRADUATED]"]
        excluded_because:
          difficulty_instance: outcome_requires_graduated_student
          rationale: "Pre-graduation create asserts this error in the named §1.8 instance."

      - name: error_pending_rec_letters_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_PENDING_REC_LETTERS]"]
        excluded_because:
          difficulty_instance: application_submit_blocked_by_pending_letter
          rationale: "Blocked SUBMITTED asserts this error in the named §1.8 instance."

      - name: error_stale_version_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: caseload_sum_conserved_on_reassignment
          rationale: "The OCC-guarded reassignment happy path is exercised there; the 412 failure paths are asserted by §1.9 instances stale_plan_create_returns_412 and stale_reassignment_returns_412 (cross_cutting_complexity_layers claims live in validations section here)."

  # ===========================================================================
  - section: rbac
    instances:
      - name: student_cannot_transition_enrollment_returns_403
        claim_type: violation_to_error
        grounds: ["roles", "errors[ERR_FORBIDDEN]", "endpoints.POST /ccr/enrollments/{id}/transition"]
        distinguishing_aspect: "Student role is absent from the enrollment transition endpoint's roles -> 403 ERR_FORBIDDEN even for the student's own enrollment."
        test_recipe:
          setup: ["Advisor A; pathway GEN; student; ACTIVE plan; enrollment PLANNED"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "RB Adv", email: "rba@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GRB", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "RB1", full_name: "Stu RB", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad}" }, as: DistrictAdmin, captures: { s: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s}/plans", payload: { pathway_id: "${pw}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad}", captures: { pl: $.data.id } }
            - { call: "POST /ccr/plans/${pl}/activate", as: Advisor, as_user_id: "${ad}" }
            - { call: "POST /ccr/students/${s}/enrollments", payload: { plan_id: "${pl}", course_code: "X1", term: "2026-SPRING", credits: 2 }, as: Advisor, as_user_id: "${ad}", captures: { en: $.data.id } }
          trigger:
            - call: "POST /ccr/enrollments/${en}/transition"
              payload: { to_status: "ENROLLED" }
              as: Student
              as_user_id: "${s}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (enrollment transitions are Advisor-only)"

      - name: wbl_coordinator_cannot_record_decision_returns_403
        claim_type: violation_to_error
        grounds: ["roles", "errors[ERR_FORBIDDEN]", "endpoints.POST /ccr/applications/{id}/decision"]
        distinguishing_aspect: "WblCoordinator is a peer role owning placements/certifications; the decision endpoint is DistrictAdmin-exclusive -> 403."
        test_recipe:
          setup: ["Advisor A; pathway GEN; student; ACTIVE plan; application DRAFT"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "WB Adv", email: "wba@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GWB", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "WB1", full_name: "Stu WB", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad}" }, as: DistrictAdmin, captures: { s: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s}/plans", payload: { pathway_id: "${pw}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad}", captures: { pl: $.data.id } }
            - { call: "POST /ccr/plans/${pl}/activate", as: Advisor, as_user_id: "${ad}" }
            - { call: "POST /ccr/students/${s}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s}", captures: { ap: $.data.id } }
          trigger:
            - call: "POST /ccr/applications/${ap}/decision"
              payload: { to_decision: "ACCEPTED" }
              as: WblCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN (decision is DistrictAdmin-only; decision would also be state-blocked, but role authorization at priority 3 fires first)"

      - name: advisor_cannot_create_site_returns_403
        claim_type: violation_to_error
        grounds: ["roles", "errors[ERR_FORBIDDEN]", "endpoints.POST /ccr/placement-sites"]
        distinguishing_aspect: "Advisor attempting DistrictAdmin-exclusive site creation -> 403; segregation_of_duties role model keeps configuration away from advising roles."
        test_recipe:
          setup: ["Advisor A exists"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "SC Adv", email: "sca@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad: $.data.id } }
          trigger:
            - call: "POST /ccr/placement-sites"
              payload: { site_code: "NOPE", name: "Nope", max_concurrent_placements: 5 }
              as: Advisor
              as_user_id: "${ad}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: graduate_cascade_closes_open_work
        claim_type: cascading_side_effects
        grounds: ["state_machines.Student.ENROLLED_to_GRADUATED", "state_machines.Application.DRAFT_to_WITHDRAWN", "state_machines.RecommendationRequest.REQUESTED_to_WITHDRAWN"]
        distinguishing_aspect: "Graduation fans out one transition into a full open-work close: DRAFT application WITHDRAWN, its remaining READY milestones WAIVED, the open letter request WITHDRAWN (teacher open_request_count decremented), and the scheduled certification CANCELLED — all visible in one immediate read."
        test_recipe:
          setup:
            - "Advisors AX (assigned), AY (auditor); teacher T; pathway GEN; grade-12 student; ACTIVE plan"
            - "24-credit course COMPLETED; audit CERTIFIED by AY"
            - "Application DRAFT (3 seeded milestones READY); letter request REQUESTED to T; certification EXAM_SCHEDULED"
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "GCx", email: "gcx@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ax: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "GCy", email: "gcy@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ay: $.data.id } }
            - { call: "POST /ccr/teachers", payload: { full_name: "GC Tee", department: "ELA", max_active_letters: 5 }, as: DistrictAdmin, captures: { t: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GGC", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "GC1", full_name: "Stu GC", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ax}" }, as: DistrictAdmin, captures: { s: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s}/plans", payload: { pathway_id: "${pw}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ax}", captures: { pl: $.data.id } }
            - { call: "POST /ccr/plans/${pl}/activate", as: Advisor, as_user_id: "${ax}" }
            - { call: "POST /ccr/students/${s}/enrollments", payload: { plan_id: "${pl}", course_code: "CR24", term: "2026-SPRING", credits: 24 }, as: Advisor, as_user_id: "${ax}", captures: { en: $.data.id } }
            - { call: "POST /ccr/enrollments/${en}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ax}" }
            - { call: "POST /ccr/enrollments/${en}/transition", payload: { to_status: "COMPLETED", grade: "PASS" }, as: Advisor, as_user_id: "${ax}" }
            - { call: "POST /ccr/students/${s}/senior-audits", payload: { auditor_advisor_id: "${ay}" }, as: DistrictAdmin, captures: { aud: $.data.id } }
            - { call: "POST /ccr/senior-audits/${aud}/transition", payload: { to_status: "IN_REVIEW" }, as: Advisor, as_user_id: "${ay}" }
            - { call: "POST /ccr/senior-audits/${aud}/transition", payload: { to_status: "CERTIFIED" }, as: Advisor, as_user_id: "${ay}" }
            - { call: "POST /ccr/students/${s}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s}", captures: { ap: $.data.id } }
            - { call: "POST /ccr/students/${s}/recommendation-requests", payload: { teacher_id: "${t}", due_at: "2026-06-01T00:00:00Z" }, as: Student, as_user_id: "${s}", captures: { rr: $.data.id } }
            - { call: "POST /ccr/students/${s}/certifications", payload: { cert_code: "OSHA" }, as: WblCoordinator, captures: { cert: $.data.id } }
            - { call: "POST /ccr/certifications/${cert}/transition", payload: { to_status: "EXAM_SCHEDULED", exam_at: "2026-05-20T09:00:00Z" }, as: WblCoordinator }
          trigger:
            - { call: "POST /ccr/students/${s}/graduate", as: DistrictAdmin }
            - { call: "GET /ccr/applications/${ap}", as: DistrictAdmin }
            - { call: "GET /ccr/applications/${ap}/milestones", as: DistrictAdmin }
            - { call: "GET /ccr/recommendation-requests/${rr}", as: DistrictAdmin }
            - { call: "GET /ccr/certifications/${cert}", as: DistrictAdmin }
            - { call: "GET /ccr/teachers/${t}", as: DistrictAdmin }
          assert:
            - "Application.${ap}.submission_status == WITHDRAWN"
            - "All 3 seeded milestones == WAIVED (cascade via application withdrawal, not direct graduation action)"
            - "RecommendationRequest.${rr}.status == WITHDRAWN and Teacher.${t}.open_request_count == 0"
            - "Certification.${cert}.status == CANCELLED"
            - "Student.${s}.status == GRADUATED"

      - name: clock_default_is_fixed_epoch
        claim_type: scheduled_actions
        grounds: ["endpoints.POST /_clock/set_current_utc", "notes.clock_default"]
        distinguishing_aspect: "Before any set call the logical clock is exactly 2026-05-01T00:00:00Z — a milestone due 2026-04-30 is overdue from the first request, and an ops-run without any clock-set marks it MISSED."
        test_recipe:
          setup: ["Advisor A; pathway GEN; student; ACTIVE plan; application with one custom milestone due 2026-04-30 — wait, creation would fail ERR_DUE_DATE_PAST; instead the milestone is due 2026-05-02 and an ops-run at the default clock does NOT miss it (boundary proof of the default)"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "CK Adv", email: "cka@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "GCK", name: "Gen", required_course_codes: [] }, as: DistrictAdmin, captures: { pw: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "CK1", full_name: "Stu CK", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad}" }, as: DistrictAdmin, captures: { s: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s}/plans", payload: { pathway_id: "${pw}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad}", captures: { pl: $.data.id } }
            - { call: "POST /ccr/plans/${pl}/activate", as: Advisor, as_user_id: "${ad}" }
            - { call: "POST /ccr/students/${s}/applications", payload: { college_name: "State U", program_type: "COLLEGE_4YR", deadline_at: "2026-06-15T00:00:00Z" }, as: Student, as_user_id: "${s}", captures: { ap: $.data.id } }
            - { call: "POST /ccr/applications/${ap}/milestones", payload: { kind: "FAFSA", due_at: "2026-05-02T00:00:00Z" }, as: Student, as_user_id: "${s}", captures: { m: $.data.id } }
          trigger:
            - { call: "POST /ccr/ops-runs", as: DistrictAdmin, captures: { r: $.data.id } }
          assert:
            - "OpsRun.${r}.executed_at == 2026-05-01T00:00:00Z (default clock, no set call)"
            - "OpsRun.${r}.milestones_marked_missed == 0 (2026-05-02 is not < 2026-05-01)"
            - "OpsRun.${r}.reminders_queued == 1 (2026-05-02 is inside [2026-05-01, 2026-05-08))"

      - name: derived_fields_reconcile_on_replan_loop
        claim_type: derived_field_reconciliation
        grounds: ["calculations.plan_alignment", "state_machines.CourseEnrollment.DROPPED_to_PLANNED"]
        distinguishing_aspect: "Derived fields track the enrollment lifecycle both directions: PLANNED->ENROLLED->DROPPED removes provisional coverage (alignment_provisional_pct 100 -> 0), and the DROPPED->PLANNED replan loop restores it (0 -> 100)."
        test_recipe:
          setup: ["Advisor A; pathway ONE requiring [C1]; student; ACTIVE plan; enrollment C1"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "DR Adv", email: "dra@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad: $.data.id } }
            - { call: "POST /ccr/pathways", payload: { pathway_code: "ONE", name: "One Course", required_course_codes: ["C1"] }, as: DistrictAdmin, captures: { pw: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "DR1", full_name: "Stu DR", grade_level: 12, demographic_group: "GROUP_A", advisor_id: "${ad}" }, as: DistrictAdmin, captures: { s: $.data.id, s_v: $.data.version } }
            - { call: "POST /ccr/students/${s}/plans", payload: { pathway_id: "${pw}", expected_student_version: "${s_v}" }, as: Advisor, as_user_id: "${ad}", captures: { pl: $.data.id } }
            - { call: "POST /ccr/plans/${pl}/activate", as: Advisor, as_user_id: "${ad}" }
            - { call: "POST /ccr/students/${s}/enrollments", payload: { plan_id: "${pl}", course_code: "C1", term: "2026-SPRING", credits: 4 }, as: Advisor, as_user_id: "${ad}", captures: { en: $.data.id } }
            - { call: "POST /ccr/enrollments/${en}/transition", payload: { to_status: "ENROLLED" }, as: Advisor, as_user_id: "${ad}" }
          trigger:
            - { call: "POST /ccr/enrollments/${en}/transition", payload: { to_status: "DROPPED" }, as: Advisor, as_user_id: "${ad}" }
            - { call: "GET /ccr/plans/${pl}", as: Advisor, as_user_id: "${ad}" }
            - { call: "POST /ccr/enrollments/${en}/transition", payload: { to_status: "PLANNED" }, as: Advisor, as_user_id: "${ad}" }
            - { call: "GET /ccr/plans/${pl}", as: Advisor, as_user_id: "${ad}" }
          assert:
            - "While ENROLLED: alignment_provisional_pct == 100.0"
            - "After DROPPED: alignment_provisional_pct == 0.0"
            - "After DROPPED->PLANNED replan: alignment_provisional_pct == 100.0 (loop restores the derived value)"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_in_same_request
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model", "endpoints.POST /ccr/students"]
        distinguishing_aspect: "Immediate consistency: the POST /ccr/students response itself carries the selector-chosen assigned_advisor_id and status ENROLLED, and a follow-up GET returns identical values with no reconciliation lag."
        test_recipe:
          setup: ["Advisor A exists"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "IM Adv", email: "ima@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { ad: $.data.id } }
          trigger:
            - { call: "POST /ccr/students", payload: { student_ref: "IM1", full_name: "Stu IM", grade_level: 9, demographic_group: "GROUP_A" }, as: DistrictAdmin, captures: { s: $.data.id } }
            - { call: "GET /ccr/students/${s}", as: DistrictAdmin }
          assert:
            - "Create response includes assigned_advisor_id == ${ad} (auto-selector result visible in the same response)"
            - "GET returns the same assigned_advisor_id and status ENROLLED (no eventual-consistency window)"

      - name: selector_tie_break_by_created_at
        claim_type: immediate_consistency
        grounds: ["notes.selector_determinism", "endpoints.POST /ccr/students"]
        distinguishing_aspect: "Two ACTIVE advisors with equal load: the selector picks the one with the smaller created_at; after one assignment the tie is broken by load — never by random id."
        test_recipe:
          setup: ["Advisors A1 (created first) and A2 (created second), both max_caseload 10, both load 0"]
          setup_api_calls:
            - { call: "POST /ccr/advisors", payload: { full_name: "First", email: "first@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { a1: $.data.id } }
            - { call: "POST /ccr/advisors", payload: { full_name: "Second", email: "second@d.org", max_caseload: 10 }, as: DistrictAdmin, captures: { a2: $.data.id } }
          trigger:
            - { call: "POST /ccr/students", payload: { student_ref: "TB1", full_name: "Stu TB1", grade_level: 9, demographic_group: "GROUP_A" }, as: DistrictAdmin, captures: { s1: $.data.id } }
            - { call: "POST /ccr/students", payload: { student_ref: "TB2", full_name: "Stu TB2", grade_level: 9, demographic_group: "GROUP_B" }, as: DistrictAdmin, captures: { s2: $.data.id } }
          assert:
            - "Student.${s1}.assigned_advisor_id == ${a1} (tie at load 0 broken by created_at ASC)"
            - "Student.${s2}.assigned_advisor_id == ${a2} (load 0 < 1 wins over created_at)"
