            - "AidDisbursement.${dm2}.status remains SCHEDULED"
            - "AidAward.${lm}.disbursed_amount_cents remains 0"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: term_closed_interval_overlap_with_adjacency_allowed
        grounds:
          - validations[priority=10]
          - errors[ERR_TERM_OVERLAP]
          - entities.AcademicTerm.fields.start_date
        distinguishing_aspect: |
          Resource AcademicTerm, closed-closed interval semantics: a new term starting on
          the existing term's last day overlaps (shared date 2026-12-11) and is rejected;
          starting the next day (2026-12-12) is adjacent and allowed — no merging occurs.
        test_recipe:
          setup:
            - "Term T1 exists: 2026-08-24..2026-12-11"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /r2t4/terms"
              payload: { name: "Winter Overlap", start_date: "2026-12-11", end_date: "2027-03-31" }
              as: RegistrarClerk
              captures: { err_t: $.data.error_id }
            - call: "POST /r2t4/terms"
              payload: { name: "Winter Adjacent", start_date: "2026-12-12", end_date: "2027-03-31" }
              as: RegistrarClerk
              captures: { t_adj: $.data.id }
          assert:
            - "First create -> error_id == ERR_TERM_OVERLAP (http 409): closed intervals share 2026-12-11"
            - "Second create -> 201 with a new term id (adjacency [.., 12-11] [12-12, ..] is not overlap)"

      - name: break_adjacency_merges_for_deduction
        grounds:
          - calculations.term_day_counts
          - validations[priority=10]
          - errors[ERR_BREAK_OVERLAP]
        distinguishing_aspect: |
          Resource ScheduledBreak with different interval semantics than terms: two breaks
          whose dates merely touch (end + 1 day == next start) do NOT overlap but MERGE
          into one deductible group — 3-day + 2-day adjacent breaks become a 5-day
          deductible group that reduces total_days, while a genuinely intersecting break
          is rejected with ERR_BREAK_OVERLAP.
        test_recipe:
          setup:
            - "Term T9 2027-01-11..2027-04-30 (110 calendar days, no breaks yet, no overlap with T1)"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Spring 2027", start_date: "2027-01-11", end_date: "2027-04-30" }
              as: RegistrarClerk
              captures: { t9: $.data.id }
          trigger:
            - call: "POST /r2t4/terms/${t9}/breaks"
              payload: { start_date: "2027-02-15", end_date: "2027-02-17" }
              as: RegistrarClerk
              captures: { b1: $.data.id, b1_ded: $.data.deductible_days }
            - call: "POST /r2t4/terms/${t9}/breaks"
              payload: { start_date: "2027-02-18", end_date: "2027-02-19" }
              as: RegistrarClerk
              captures: { b2: $.data.id, b2_ded: $.data.deductible_days }
            - call: "GET /r2t4/terms/${t9}"
              payload: {}
              as: RegistrarClerk
              captures: { t9_total: $.data.total_days, t9_ded: $.data.deductible_break_days }
            - call: "POST /r2t4/terms/${t9}/breaks"
              payload: { start_date: "2027-02-16", end_date: "2027-02-18" }
              as: RegistrarClerk
              captures: { err_b: $.data.error_id }
          assert:
            - "Break ${b1} (Feb 15-17, 3 days) and break ${b2} (Feb 18-19, 2 days) are adjacent, not overlapping: both creations return 201"
            - "After both creations: AcademicTerm.${t9}.deductible_break_days == 5 and .total_days == 105 (110 - 5)"
            - "ScheduledBreak.${b1}.deductible_days == 5 (group span attributed to the earliest break) and ${b2}.deductible_days == 0"
            - "Third break Feb 16-18 intersects both existing breaks -> error_id == ERR_BREAK_OVERLAP (http 409)"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: aid_conservation_across_recalculation_loop
        grounds:
          - calculations.r2t4_earned_unearned
          - state_machines.WithdrawalCase.CALCULATED_to_CALCULATED
          - entities.WithdrawalCase.fields.aid_unearned_cents
        distinguishing_aspect: |
          Conserved quantity: total disbursable Title IV aid. Across a calculate ->
          recalculate loop with identical inputs, aid_earned_cents + aid_unearned_cents
          == aid_disbursable_cents with zero drift, and the regenerated obligation equals
          the voided one (200000) — the compensation neither leaks nor duplicates dollars.
        test_recipe:
          setup:
            - "Term T1 (105 days); enrollment charges 600000; PELL 200000 + SUB 300000 disbursed (disbursable 500000)"
            - "Withdraw OFFICIAL 2026-10-25; calculate -> earned 300000, unearned 200000, SCHOOL obligation 200000"
          setup_api_calls:
            - call: "POST /r2t4/terms"
              payload: { name: "Fall 2026", start_date: "2026-08-24", end_date: "2026-12-11" }
              as: RegistrarClerk
              captures: { t1: $.data.id }
            - call: "POST /r2t4/terms/${t1}/breaks"
              payload: { start_date: "2026-11-25", end_date: "2026-11-29" }
              as: RegistrarClerk
