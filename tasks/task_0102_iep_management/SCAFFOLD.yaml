# =============================================================================
# task_0102_iep_management — Special Education IEP Management Scaffold
# =============================================================================

scenario: |
  Special Education IEP Management: eligibility evaluation, annual IEP meeting,
  goal progress tracking, related services (OT/PT/Speech), parental consent,
  least restrictive environment, triennial reevaluation cycle, transition planning.

domain_name: iep-management
api_prefix: /districts

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - scheduled_deferred_actions
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: District
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "District name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code" }
      - { name: current_date, type: datetime, source: system, description: "Deterministic clock for compliance date math; advances only via POST /districts/{id}/clock/advance. ISO 8601 UTC with three fractional digits." }

  - name: Student
    parent: District
    common_fields: true
    fields:
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: external_student_number, type: string, source: input, description: "District-assigned identifier, unique within district" }
      - { name: date_of_birth, type: datetime, source: input, description: "ISO 8601 UTC date" }
      - { name: parent_user_id, type: string, source: input, description: "X-User-ID of the legally responsible parent/guardian; recorded for ownership checks" }
      - { name: current_iep_id, type: string, source: computed, description: "id of the IEP currently in ACTIVE state for this student, or null. At most one ACTIVE IEP per student (see §1.2.1)." }
      - { name: current_eligibility_evaluation_id, type: string, source: computed, description: "id of the most recently FINALIZED EligibilityEvaluation; null until first finalization." }
      - { name: triennial_reevaluation_due_date, type: datetime, source: computed, description: "= last finalized EligibilityEvaluation.finalized_at + 3 years (exact calendar year, same month and day); null until first finalization." }
      - { name: triennial_status, type: enum, source: computed, description: "ON_TRACK (current_date < triennial_reevaluation_due_date) | DUE_SOON (within 90 days) | OVERDUE (>=). Constraint: {ON_TRACK, DUE_SOON, OVERDUE, NOT_APPLICABLE}." }
      - { name: requires_transition_plan, type: boolean, source: computed, description: "True when current_date >= date_of_birth + 16 years AND current_iep_id is non-null" }
      - { name: lre_classification, type: enum, source: computed, description: "Federal LRE category {LRE_A, LRE_B, LRE_C, NOT_APPLICABLE} derived from current IEP service-time totals; see calculations.lre_percentage." }

  - name: EligibilityEvaluation
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "Subject student id" }
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: requested_at, type: datetime, source: system, description: "When the evaluation was requested (creation time)" }
      - { name: consent_received_at, type: datetime, source: system, description: "When ParentalConsent.scope=EVALUATION was APPROVED for this evaluation" }
      - { name: finalized_at, type: datetime, source: system, description: "When status moved to ELIGIBLE or INELIGIBLE (terminal)" }
      - { name: disability_categories, type: array, source: input, description: "Array of disability category strings from fixed enum (SLD, OHI, ASD, SI, OI, ED, ID, HI, VI, DB, TBI, MD, DD). Empty allowed only when status is INELIGIBLE." }
      - { name: evaluator_user_id, type: string, source: system, description: "X-User-ID of the SchoolPsychologist who performed the evaluation" }
      - { name: evaluation_type, type: enum, source: input, description: "{INITIAL, TRIENNIAL, INTERIM}. INITIAL means first-ever for student; TRIENNIAL required for the once-every-three-years cycle." }
      - { name: is_reevaluation, type: boolean, source: computed, description: "True iff evaluation_type == TRIENNIAL" }
      - { name: status, type: enum, source: system, description: "REQUESTED → CONSENT_PENDING → IN_PROGRESS → {ELIGIBLE, INELIGIBLE}. Constraint: {REQUESTED, CONSENT_PENDING, IN_PROGRESS, ELIGIBLE, INELIGIBLE}." }

  - name: ParentalConsent
    parent: Student
    common_fields: false
    fields:
      - { name: student_id, type: string, source: system, description: "Subject student id" }
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: scope, type: enum, source: input, description: "{EVALUATION, IEP_IMPLEMENTATION, RELATED_SERVICE, PLACEMENT_CHANGE}. Determines what the consent gates." }
      - { name: target_resource_type, type: enum, source: input, description: "{EligibilityEvaluation, IEP, RelatedService, Student}. Must match scope per the table in §1.4." }
      - { name: target_resource_id, type: string, source: input, description: "id of the gated resource" }
      - { name: requested_at, type: datetime, source: system, description: "When consent was requested" }
      - { name: decided_at, type: datetime, source: system, description: "When status moved out of PENDING" }
      - { name: withdrawn_at, type: datetime, source: system, description: "When APPROVED→WITHDRAWN transition occurred; null otherwise" }
      - { name: parent_user_id, type: string, source: system, description: "X-User-ID of the Parent who decided; must equal Student.parent_user_id" }
      - { name: status, type: enum, source: system, description: "PENDING → {APPROVED, REJECTED}; APPROVED → WITHDRAWN. Constraint: {PENDING, APPROVED, REJECTED, WITHDRAWN}." }
      # Note: common_fields=false because consent decisions are append-only events; a new ParentalConsent row is created to re-request after a withdrawal.

  - name: IEP
    parent: Student
    common_fields: true
    fields:
      - { name: student_id, type: string, source: system, description: "Subject student id" }
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: meeting_held_at, type: datetime, source: input, description: "Datetime of the annual IEP meeting that produced this IEP. Required for DRAFT→ACTIVE transition." }
      - { name: effective_start_date, type: datetime, source: input, description: "Date the IEP becomes effective once active" }
      - { name: scheduled_review_date, type: datetime, source: computed, description: "= effective_start_date + 365 days (one annual cycle)" }
      - { name: total_instructional_minutes_per_week, type: integer, source: input, description: "Authoritative denominator for LRE_percentage_instructional (e.g., 1500 = 5 days × 300 min)" }
      - { name: total_school_day_minutes_per_week, type: integer, source: input, description: "Total school day minutes per week including non-instructional time (lunch/recess); denominator for LRE_percentage_school_day variant" }
      - { name: special_education_minutes_per_week, type: integer, source: computed, description: "Sum of RelatedService.minutes_per_week for ACTIVE services on this IEP" }
      - { name: lre_percentage_instructional, type: number, source: computed, description: "= 100 × special_education_minutes_per_week / total_instructional_minutes_per_week. Round_half_up to 2 decimal places. CANONICAL value used for lre_classification." }
      - { name: lre_percentage_school_day, type: number, source: computed, description: "= 100 × special_education_minutes_per_week / total_school_day_minutes_per_week. Round_half_up to 2 decimal places. Reported but NOT used for classification." }
      - { name: requires_transition_plan, type: boolean, source: computed, description: "Mirrors Student.requires_transition_plan at the time of IEP activation; locked thereafter." }
      - { name: transition_plan_id, type: string, source: computed, description: "id of the TransitionPlan linked to this IEP; required non-null whenever requires_transition_plan is true" }
      - { name: status, type: enum, source: system, description: "DRAFT → ACTIVE → {EXPIRED, REVOKED, SUPERSEDED}; ACTIVE → AMENDMENT_PENDING → ACTIVE (cycle). Constraint: {DRAFT, ACTIVE, AMENDMENT_PENDING, EXPIRED, REVOKED, SUPERSEDED}." }

  - name: IEPGoal
    parent: IEP
    common_fields: true
    fields:
      - { name: iep_id, type: string, source: system, description: "Parent IEP id" }
      - { name: student_id, type: string, source: system, description: "Subject student id" }
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: domain, type: enum, source: input, description: "{ACADEMIC, COMMUNICATION, MOTOR, BEHAVIORAL, FUNCTIONAL, TRANSITION}" }
      - { name: description, type: string, source: input, description: "Measurable annual goal text" }
      - { name: objectives, type: array, source: input, description: "Array of {objective_id, weight (0<weight<=1), latest_progress_percent (0..100, default 0)}. Sum of weights MUST equal 1.00 (round_half_up to 2 dp). At least 1 objective required." }
      - { name: mastery_score, type: number, source: computed, description: "Weighted score = sum over objectives of weight × latest_progress_percent. Round_half_up to 2 decimal places." }
      - { name: mastery_tier, type: enum, source: computed, description: "{INSUFFICIENT_PROGRESS, PROGRESSING, MASTERED} keyed by mastery_score (see calculations.goal_mastery_tier)" }
      - { name: status, type: enum, source: system, description: "PROPOSED → ACTIVE → {MET, NOT_MET, DISCONTINUED}. Constraint: {PROPOSED, ACTIVE, MET, NOT_MET, DISCONTINUED}." }

  - name: GoalProgressReport
    parent: IEPGoal
    common_fields: false
    fields:
      - { name: iep_goal_id, type: string, source: system, description: "Parent goal id" }
      - { name: iep_id, type: string, source: system, description: "Containing IEP id" }
      - { name: student_id, type: string, source: system, description: "Subject student id" }
      - { name: reporting_period_index, type: integer, source: input, description: "Monotone integer 1..N identifying the reporting window. Two reports on the same (goal_id, reporting_period_index) are forbidden." }
      - { name: reported_by_user_id, type: string, source: system, description: "X-User-ID of the SpecialEducationTeacher who filed the report" }
      - { name: objective_progress, type: array, source: input, description: "Array of {objective_id, progress_percent (0..100 integer)}; every objective on the parent goal MUST appear exactly once." }
      - { name: narrative, type: string, source: input, description: "Free-text narrative; length 1..2000" }

  - name: RelatedService
    parent: IEP
    common_fields: true
    fields:
      - { name: iep_id, type: string, source: system, description: "Parent IEP id" }
      - { name: student_id, type: string, source: system, description: "Subject student id" }
      - { name: district_id, type: string, source: system, description: "Owning district id" }
      - { name: service_type, type: enum, source: input, description: "{OT, PT, SPEECH, COUNSELING, ORIENTATION_MOBILITY}. Service domain key — at most one ACTIVE RelatedService per (iep_id, service_type)." }
      - { name: minutes_per_week, type: integer, source: input, description: "Prescribed weekly minutes; must be > 0" }
      - { name: provider_user_id, type: string, source: input, description: "X-User-ID of the licensed RelatedServiceProvider responsible" }
      - { name: location_setting, type: enum, source: input, description: "{PULL_OUT, PUSH_IN, COMMUNITY}. PULL_OUT contributes to lre_percentage; PUSH_IN does not." }
      - { name: consent_id, type: string, source: computed, description: "id of the ParentalConsent (scope=RELATED_SERVICE) gating this service; required to leave PROPOSED" }
      - { name: total_prescribed_minutes_to_date, type: integer, source: computed, description: "= weeks_active × minutes_per_week, recomputed when status leaves ACTIVE" }
      - { name: total_delivered_minutes, type: integer, source: computed, description: "Sum of ServiceSession.actual_minutes for sessions in DELIVERED status" }
      - { name: total_cancelled_minutes, type: integer, source: computed, description: "Sum of ServiceSession.scheduled_minutes for sessions in CANCELLED status" }
      - { name: compensatory_minutes_owed, type: integer, source: computed, description: "Per calculations.compensatory_service_hours; populated on SUSPENDED transition" }
      - { name: utilization_percent, type: number, source: computed, description: "= 100 × total_delivered_minutes / total_prescribed_minutes_to_date when denominator>0, else 0. Round_half_up to 2 decimal places." }
      - { name: status, type: enum, source: system, description: "PROPOSED → ACTIVE → {COMPLETED, SUSPENDED}; SUSPENDED → ACTIVE (cycle). Constraint: {PROPOSED, ACTIVE, SUSPENDED, COMPLETED}." }

  - name: ServiceSession
    parent: RelatedService
    common_fields: true
    fields:
      - { name: related_service_id, type: string, source: system, description: "Parent service id" }
      - { name: iep_id, type: string, source: system, description: "Containing IEP id" }
      - { name: student_id, type: string, source: system, description: "Subject student id" }
      - { name: scheduled_start, type: datetime, source: input, description: "ISO 8601 UTC datetime when the session is scheduled to start" }
      - { name: scheduled_end, type: datetime, source: input, description: "ISO 8601 UTC datetime when the session is scheduled to end. scheduled_end > scheduled_start." }
      - { name: scheduled_minutes, type: integer, source: computed, description: "= floor((scheduled_end - scheduled_start) total_seconds / 60). Pinned formula." }
      - { name: actual_minutes, type: integer, source: input, description: "Actual minutes delivered; required when marking DELIVERED. 0 <= actual_minutes <= scheduled_minutes." }
      - { name: status, type: enum, source: system, description: "SCHEDULED → {DELIVERED, CANCELLED}. Constraint: {SCHEDULED, DELIVERED, CANCELLED}." }

  - name: TransitionPlan
    parent: IEP
    common_fields: true
    fields:
      - { name: iep_id, type: string, source: system, description: "Parent IEP id" }
      - { name: student_id, type: string, source: system, description: "Subject student id" }
      - { name: post_secondary_goal, type: string, source: input, description: "Measurable post-secondary goal (length 10..1000)" }
      - { name: required_courses, type: array, source: input, description: "Non-empty array of {course_code, projected_completion_term}" }
      - { name: outside_agency_referrals, type: array, source: input, description: "Array of {agency_name, contact_role}; may be empty" }
      - { name: parent_invitation_documented, type: boolean, source: input, description: "Whether parent was formally invited to the transition meeting; required true for finalization" }
      - { name: student_invitation_documented, type: boolean, source: input, description: "Whether student was formally invited; required true for finalization" }
      - { name: status, type: enum, source: system, description: "DRAFT → FINALIZED → {ACTIVE, SUPERSEDED}; ACTIVE → SUPERSEDED. Constraint: {DRAFT, FINALIZED, ACTIVE, SUPERSEDED}." }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: EligibilityEvaluation
    initial_state: REQUESTED
    terminal_states: [ELIGIBLE, INELIGIBLE]
    transitions:
      - from: REQUESTED
        to: CONSENT_PENDING
        trigger: "POST /districts/{districtId}/students/{studentId}/eligibility-evaluations/{evaluationId}/request-consent"
        actor: SchoolPsychologist
        preconditions:
          - "Evaluation must be in REQUESTED (ERR_EVALUATION_NOT_REQUESTED)"
        side_effects:
          - "Create ParentalConsent with scope=EVALUATION, target_resource_type=EligibilityEvaluation, target_resource_id=evaluation.id, status=PENDING"

      - from: CONSENT_PENDING
        to: IN_PROGRESS
        trigger: "system (automatic on ParentalConsent.scope=EVALUATION → APPROVED for this evaluation)"
        actor: system
        preconditions:
          - "Evaluation is in CONSENT_PENDING"
          - "ParentalConsent for this evaluation has transitioned PENDING→APPROVED"
        side_effects:
          - "EligibilityEvaluation.consent_received_at = ParentalConsent.decided_at"

      - from: IN_PROGRESS
        to: ELIGIBLE
        trigger: "POST /districts/{districtId}/students/{studentId}/eligibility-evaluations/{evaluationId}/finalize"
        actor: SchoolPsychologist
        preconditions:
          - "Evaluation must be in IN_PROGRESS (ERR_EVALUATION_NOT_IN_PROGRESS)"
          - "disability_categories is non-empty"
          - "Acting SchoolPsychologist.user_id == evaluator_user_id; SchoolPsychologist cannot also be the parent_user_id (segregation of duties — ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "finalized_at = District.current_date"
          - "Student.current_eligibility_evaluation_id = evaluation.id"
          - "Student.triennial_reevaluation_due_date = finalized_at + 3 years (same month/day)"
          - "Student.triennial_status recomputed (ON_TRACK)"

      - from: IN_PROGRESS
        to: INELIGIBLE
        trigger: "POST /districts/{districtId}/students/{studentId}/eligibility-evaluations/{evaluationId}/finalize"
        actor: SchoolPsychologist
        preconditions:
          - "Evaluation must be in IN_PROGRESS (ERR_EVALUATION_NOT_IN_PROGRESS)"
          - "disability_categories is empty (request body declared status=INELIGIBLE)"
          - "Acting SchoolPsychologist.user_id == evaluator_user_id; SchoolPsychologist cannot also be the parent_user_id (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "finalized_at = District.current_date"
          - "Student.current_eligibility_evaluation_id = evaluation.id"
          - "If Student.current_iep_id is non-null: cascade — IEP→REVOKED, all RelatedService→SUSPENDED with compensatory_minutes_owed recomputed, all IEPGoal→DISCONTINUED, Student.current_iep_id=null, Student.lre_classification=NOT_APPLICABLE"

  - entity: ParentalConsent
    initial_state: PENDING
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /districts/{districtId}/students/{studentId}/parental-consents/{consentId}/approve"
        actor: Parent
        preconditions:
          - "Consent must be in PENDING (ERR_CONSENT_NOT_PENDING)"
          - "Acting Parent.user_id == Student.parent_user_id (ERR_PARENT_OWNERSHIP_MISMATCH)"
        side_effects:
          - "decided_at = District.current_date"
          - "If scope=EVALUATION: EligibilityEvaluation referenced by target_resource_id → IN_PROGRESS"
          - "If scope=IEP_IMPLEMENTATION: enables IEP DRAFT→ACTIVE; does not transition by itself"
          - "If scope=RELATED_SERVICE: RelatedService.consent_id = consent.id; enables RelatedService PROPOSED→ACTIVE on next put"
          - "If scope=PLACEMENT_CHANGE: enables a pending placement-change action (out of scope for v1; recorded only)"

      - from: PENDING
        to: REJECTED
        trigger: "POST /districts/{districtId}/students/{studentId}/parental-consents/{consentId}/reject"
        actor: Parent
        preconditions:
          - "Consent must be in PENDING (ERR_CONSENT_NOT_PENDING)"
          - "Acting Parent.user_id == Student.parent_user_id (ERR_PARENT_OWNERSHIP_MISMATCH)"
        side_effects:
          - "decided_at = District.current_date"

      - from: APPROVED
        to: WITHDRAWN
        trigger: "POST /districts/{districtId}/students/{studentId}/parental-consents/{consentId}/withdraw"
        actor: Parent
        preconditions:
          - "Consent must be in APPROVED (ERR_CONSENT_NOT_APPROVED)"
          - "Acting Parent.user_id == Student.parent_user_id (ERR_PARENT_OWNERSHIP_MISMATCH)"
        side_effects:
          - "withdrawn_at = District.current_date"
          - "Cascade (Rule 4 — depth 3): for each RelatedService where consent_id == this consent: RelatedService → SUSPENDED; that suspension triggers compensatory_service_hours calculation which sets RelatedService.compensatory_minutes_owed; for each suspended RelatedService, sum of compensatory_minutes_owed across all services on the parent IEP is recomputed and if sum > 0 the parent IEP enters AMENDMENT_PENDING."
          - "If scope=IEP_IMPLEMENTATION: parent IEP → REVOKED (independent path; no cascade chain through services because IEP revocation is the direct effect)"
          - "If scope=EVALUATION on an IN_PROGRESS evaluation: evaluation cannot proceed; SchoolPsychologist must re-request consent via a new ParentalConsent row (state unchanged here)"

  - entity: IEP
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /districts/{districtId}/students/{studentId}/ieps/{iepId}/activate"
        actor: SpecialEducationTeacher
        preconditions:
          - "IEP must be in DRAFT (ERR_IEP_NOT_DRAFT)"
          - "Student.current_eligibility_evaluation_id resolves to an EligibilityEvaluation in ELIGIBLE state (ERR_STUDENT_NOT_ELIGIBLE) — cross-entity dependency"
          - "ParentalConsent with scope=IEP_IMPLEMENTATION, target_resource_type=IEP, target_resource_id=iep.id must exist in APPROVED status (ERR_IEP_CONSENT_NOT_APPROVED)"
          - "meeting_held_at is non-null and <= District.current_date (ERR_IEP_MEETING_NOT_HELD)"
          - "At least one IEPGoal in PROPOSED status (ERR_IEP_NO_GOALS)"
          - "If requires_transition_plan is true: TransitionPlan exists in FINALIZED (ERR_TRANSITION_PLAN_REQUIRED)"
          - "Student must have no other IEP currently in ACTIVE or AMENDMENT_PENDING (ERR_IEP_ALREADY_ACTIVE) — exactly-one-active invariant"
        side_effects:
          - "All PROPOSED IEPGoals → ACTIVE"
          - "Student.current_iep_id = iep.id"
          - "scheduled_review_date = effective_start_date + 365 days"
          - "Student.lre_classification recomputed via lre_percentage calculation"
          - "If TransitionPlan exists in FINALIZED: TransitionPlan → ACTIVE"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (automatic when District.current_date >= scheduled_review_date AND no superseding IEP has been activated)"
        actor: system
        preconditions:
          - "IEP is in ACTIVE"
          - "District.current_date >= scheduled_review_date"
        side_effects:
          - "All ACTIVE IEPGoals → NOT_MET"
          - "All ACTIVE RelatedServices → SUSPENDED; compensatory_service_hours triggered for each"
          - "Student.current_iep_id = null"
          - "Student.lre_classification = NOT_APPLICABLE"
          - "Any ACTIVE TransitionPlan → SUPERSEDED"

      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "POST /districts/{districtId}/students/{studentId}/ieps/{iepId}/begin-amendment"
        actor: SpecialEducationTeacher
        preconditions:
          - "IEP is in ACTIVE (ERR_IEP_NOT_ACTIVE)"
        side_effects:
          - "Locks IEPGoal and RelatedService mutations except those scoped under POST .../amendment-finalize"

      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /districts/{districtId}/students/{studentId}/ieps/{iepId}/finalize-amendment"
        actor: SpecialEducationTeacher
        preconditions:
          - "IEP is in AMENDMENT_PENDING (ERR_IEP_NOT_AMENDMENT_PENDING)"
        side_effects:
          - "Re-evaluate Student.lre_classification"

      - from: ACTIVE
        to: REVOKED
        trigger: "system (cascaded from EligibilityEvaluation→INELIGIBLE OR ParentalConsent scope=IEP_IMPLEMENTATION → WITHDRAWN)"
        actor: system
        preconditions:
          - "IEP is in ACTIVE or AMENDMENT_PENDING"
        side_effects:
          - "All ACTIVE IEPGoals → DISCONTINUED"
          - "All ACTIVE RelatedServices → SUSPENDED; compensatory_service_hours triggered for each"
          - "Student.current_iep_id = null; Student.lre_classification=NOT_APPLICABLE"
          - "Any ACTIVE TransitionPlan → SUPERSEDED"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when a new IEP for the same student transitions DRAFT→ACTIVE under POST .../ieps/{iepId}/activate)"
        actor: system
        preconditions:
          - "A different IEP on the same student successfully activated"
        side_effects:
          - "All ACTIVE IEPGoals → DISCONTINUED"
          - "All ACTIVE RelatedServices → COMPLETED (clean handoff, no compensatory minutes owed)"
          - "Any ACTIVE TransitionPlan → SUPERSEDED"

  - entity: IEPGoal
    initial_state: PROPOSED
    terminal_states: [MET, NOT_MET, DISCONTINUED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "system (automatic on IEP DRAFT→ACTIVE)"
        actor: system
        preconditions:
          - "Parent IEP just transitioned to ACTIVE"
        side_effects: []

      - from: ACTIVE
        to: MET
        trigger: "POST /districts/{districtId}/students/{studentId}/ieps/{iepId}/goals/{goalId}/close"
        actor: SpecialEducationTeacher
        preconditions:
          - "Goal must be in ACTIVE (ERR_GOAL_NOT_ACTIVE)"
          - "Parent IEP must be in ACTIVE (ERR_IEP_NOT_ACTIVE) — not AMENDMENT_PENDING"
          - "mastery_tier == MASTERED computed from objectives (ERR_GOAL_NOT_MASTERED)"
          - "Request body declares disposition=MET"
        side_effects: []

      - from: ACTIVE
        to: NOT_MET
        trigger: "POST /districts/{districtId}/students/{studentId}/ieps/{iepId}/goals/{goalId}/close"
        actor: SpecialEducationTeacher
        preconditions:
          - "Goal must be in ACTIVE (ERR_GOAL_NOT_ACTIVE)"
          - "Parent IEP must be in ACTIVE (ERR_IEP_NOT_ACTIVE)"
          - "Request body declares disposition=NOT_MET"
        side_effects: []

      - from: ACTIVE
        to: DISCONTINUED
        trigger: "system (cascaded from IEP→REVOKED or IEP→SUPERSEDED)"
        actor: system
        preconditions:
          - "Goal is in ACTIVE"
        side_effects: []

  - entity: RelatedService
    initial_state: PROPOSED
    terminal_states: [COMPLETED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: "PUT /districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/activate"
        actor: RelatedServiceProvider
        preconditions:
          - "RelatedService is in PROPOSED (ERR_SERVICE_NOT_PROPOSED)"
          - "Parent IEP is in ACTIVE or AMENDMENT_PENDING (ERR_IEP_NOT_ACTIVE)"
          - "consent_id resolves to a ParentalConsent in APPROVED with scope=RELATED_SERVICE (ERR_SERVICE_CONSENT_NOT_APPROVED) — cross-entity dependency"
          - "Student.current_eligibility_evaluation_id resolves to an EligibilityEvaluation in ELIGIBLE (ERR_STUDENT_NOT_ELIGIBLE) — cross-entity dependency"
          - "No other RelatedService on the same iep_id with same service_type currently in ACTIVE (ERR_SERVICE_TYPE_ALREADY_ACTIVE) — temporal overlap on service-domain key"
        side_effects:
          - "IEP.special_education_minutes_per_week recomputed"
          - "IEP.lre_percentage_instructional and lre_percentage_school_day recomputed"
          - "Student.lre_classification recomputed"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (cascaded from ParentalConsent scope=RELATED_SERVICE → WITHDRAWN, EligibilityEvaluation→INELIGIBLE, IEP→REVOKED, or IEP→EXPIRED) OR PUT /districts/{...}/related-services/{id}/suspend"
        actor: system | RelatedServiceProvider
        preconditions:
          - "Service is in ACTIVE (ERR_SERVICE_NOT_ACTIVE)"
        side_effects:
          - "Compute compensatory_minutes_owed via calculations.compensatory_service_hours"
          - "IEP.special_education_minutes_per_week recomputed (subtract this service's minutes_per_week)"
          - "IEP.lre_percentage_instructional / lre_percentage_school_day recomputed"
          - "Student.lre_classification recomputed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "PUT /districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/resume"
        actor: RelatedServiceProvider
        preconditions:
          - "Service is in SUSPENDED (ERR_SERVICE_NOT_SUSPENDED)"
          - "consent_id resolves to ParentalConsent in APPROVED (ERR_SERVICE_CONSENT_NOT_APPROVED) — caller must request a fresh consent if needed"
          - "Parent IEP is in ACTIVE (ERR_IEP_NOT_ACTIVE)"
        side_effects:
          - "IEP.special_education_minutes_per_week recomputed"
          - "IEP.lre_percentage_instructional / lre_percentage_school_day recomputed"
          - "Student.lre_classification recomputed"

      - from: ACTIVE
        to: COMPLETED
        trigger: "system (cascaded from IEP→SUPERSEDED — clean handoff to next IEP)"
        actor: system
        preconditions:
          - "Service is in ACTIVE"
          - "Parent IEP transitioned to SUPERSEDED"
        side_effects:
          - "compensatory_minutes_owed = 0 (clean handoff — distinguishes from SUSPENDED path)"

  - entity: ServiceSession
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DELIVERED
        trigger: "POST /districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/sessions/{sessionId}/deliver"
        actor: RelatedServiceProvider
        preconditions:
          - "Session is in SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
          - "Parent RelatedService is in ACTIVE (ERR_SERVICE_NOT_ACTIVE)"
          - "Request body actual_minutes provided and 0 <= actual_minutes <= scheduled_minutes (ERR_INVALID_REQUEST)"
          - "District.current_date >= scheduled_start (ERR_SESSION_NOT_DUE_YET)"
        side_effects:
          - "RelatedService.total_delivered_minutes += actual_minutes"
          - "RelatedService.utilization_percent recomputed"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/sessions/{sessionId}/cancel"
        actor: RelatedServiceProvider
        preconditions:
          - "Session is in SCHEDULED (ERR_SESSION_NOT_SCHEDULED)"
        side_effects:
          - "RelatedService.total_cancelled_minutes += scheduled_minutes"

  - entity: TransitionPlan
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /districts/{districtId}/students/{studentId}/ieps/{iepId}/transition-plan/finalize"
        actor: SpecialEducationTeacher
        preconditions:
          - "TransitionPlan is in DRAFT (ERR_TRANSITION_PLAN_NOT_DRAFT)"
          - "post_secondary_goal length >= 10 (ERR_INVALID_REQUEST)"
          - "required_courses non-empty (ERR_INVALID_REQUEST)"
          - "parent_invitation_documented == true AND student_invitation_documented == true (ERR_TRANSITION_INVITATIONS_MISSING)"
          - "Parent IEP is in DRAFT or AMENDMENT_PENDING (ERR_IEP_NOT_AMENDABLE_FOR_TRANSITION)"
        side_effects: []

      - from: FINALIZED
        to: ACTIVE
        trigger: "system (automatic on parent IEP DRAFT→ACTIVE)"
        actor: system
        preconditions:
          - "Parent IEP just transitioned to ACTIVE"
        side_effects: []

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (cascaded from parent IEP→EXPIRED, REVOKED, or SUPERSEDED)"
        actor: system
        preconditions:
          - "Parent IEP exited ACTIVE"
        side_effects: []

      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system (cascaded from parent IEP→REVOKED before activation)"
        actor: system
        preconditions:
          - "Parent IEP transitioned to REVOKED while still DRAFT"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two SpecialEducationTeachers simultaneously activate two different DRAFT IEPs for the same student"
    guarantee: "At most one IEP per student may be ACTIVE or AMENDMENT_PENDING at any instant; second activation rejected."
    error_id: ERR_IEP_ALREADY_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on Student.current_iep_id assignment"

  - scenario: "Two RelatedServiceProviders simultaneously activate two PROPOSED RelatedServices on the same IEP and same service_type (e.g., both OT)"
    guarantee: "At most one ACTIVE RelatedService per (iep_id, service_type); second activation rejected."
    error_id: ERR_SERVICE_TYPE_ALREADY_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on RelatedService.status = ACTIVE within (iep_id, service_type) pair"

  - scenario: "Parent approves and rejects the same PENDING ParentalConsent simultaneously"
    guarantee: "Exactly one decision wins; the loser sees the consent already decided."
    error_id: ERR_CONSENT_NOT_PENDING
    http_status: 409
    serialization: "First-writer-wins on ParentalConsent.status leaving PENDING"

  - scenario: "Parent withdraws an APPROVED consent while a RelatedServiceProvider concurrently activates the gated RelatedService"
    guarantee: "Exactly one operation wins; if withdrawal commits first, activation sees status != APPROVED and is rejected."
    error_id: ERR_SERVICE_CONSENT_NOT_APPROVED
    http_status: 409
    serialization: "First-writer-wins on ParentalConsent.status; activation reads consent.status after this commit"

  - scenario: "Two GoalProgressReports filed concurrently for the same (iep_goal_id, reporting_period_index)"
    guarantee: "At most one report per (goal, period); duplicate is rejected."
    error_id: ERR_DUPLICATE_PROGRESS_REPORT
    http_status: 409
    serialization: "First-writer-wins on (iep_goal_id, reporting_period_index) uniqueness"

  - scenario: "Two ServiceSession deliveries scheduled with overlapping time windows on the same RelatedService"
    guarantee: "Sessions on the same RelatedService must not overlap in time (closed intervals on scheduled_start..scheduled_end); second creation rejected."
    error_id: ERR_SERVICE_SESSION_OVERLAP
    http_status: 409
    serialization: "First-writer-wins on overlapping (scheduled_start, scheduled_end) within related_service_id"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: lre_percentage
    trigger: "RelatedService activation/suspension/resumption/completion; IEP DRAFT→ACTIVE; IEP amendment finalize"
    algorithm: aggregation
    formula: |
      sped_minutes = sum(rs.minutes_per_week
                        for rs in RelatedService
                        where rs.iep_id == iep.id
                          and rs.status == ACTIVE
                          and rs.location_setting == PULL_OUT)
      # Note: PUSH_IN minutes happen inside the regular classroom; they
      # do NOT count toward pull-out time. COMMUNITY counts as PULL_OUT.
      lre_percentage_instructional = round_half_up(
          100.0 * sped_minutes / iep.total_instructional_minutes_per_week, 2)
      lre_percentage_school_day    = round_half_up(
          100.0 * sped_minutes / iep.total_school_day_minutes_per_week, 2)
      # Classification uses ONLY lre_percentage_instructional (canonical):
      if lre_percentage_instructional <= 20.00:
          lre_classification = LRE_A   # full inclusion (inside regular class >= 80%)
      elif lre_percentage_instructional <= 60.00:
          lre_classification = LRE_B   # resource (inside 40-80%)
      else:
          lre_classification = LRE_C   # separate (inside < 40%)
    input_set: "RelatedService rows where status=ACTIVE and location_setting in {PULL_OUT, COMMUNITY}; PUSH_IN excluded"
    constants:
      LRE_A_UPPER_INCLUSIVE: 20.00
      LRE_B_UPPER_INCLUSIVE: 60.00
    precision: "round_half_up to 2 decimal places"
    variants:
      - name: instructional_basis
        when: "Federal LRE classification reporting (canonical for lre_classification)"
        difference: "Denominator = IEP.total_instructional_minutes_per_week; excludes lunch/recess"
      - name: school_day_basis
        when: "Reported alongside instructional basis on GET /ieps/{id}/lre-summary; NOT used for classification"
        difference: "Denominator = IEP.total_school_day_minutes_per_week (larger), producing a strictly smaller or equal percentage for identical numerator"
    note: "Both variants compute simultaneously from identical pull-out minutes; lre_classification depends ONLY on instructional_basis. Same inputs, two valid algorithms, different outputs — dual-variant on the IEP entity."

  - name: goal_mastery_tier
    trigger: "GoalProgressReport creation; IEP amendment finalize"
    algorithm: weighted_scoring
    formula: |
      # IEPGoal.objectives = [{objective_id, weight, latest_progress_percent}, ...]
      # Pinned: sum of weights MUST equal exactly 1.00 (validated on goal creation).
      # Combinatorial mode (a): >=3 inputs (each objective contributes
      # weight × progress) with a conditional branch over the resulting score.

      mastery_score = round_half_up(
          sum(o.weight * o.latest_progress_percent for o in goal.objectives),
          2)

      # Tier branches — boundaries pinned:
      #   score >= 80.00      → MASTERED
      #   50.00 <= score < 80 → PROGRESSING
      #   score < 50.00       → INSUFFICIENT_PROGRESS
      if mastery_score >= 80.00:
          mastery_tier = MASTERED
      elif mastery_score >= 50.00:
          mastery_tier = PROGRESSING
      else:
          mastery_tier = INSUFFICIENT_PROGRESS
    input_set: "All objectives on the goal (no status filter — discontinued goals retain their last computed value, but progress reports only land on ACTIVE goals)"
    constants:
      MASTERED_THRESHOLD: 80.00
      PROGRESSING_THRESHOLD: 50.00
    precision: "round_half_up to 2 decimal places"
    variants:
      - name: simple_average_naive
        when: "Naive interpretation that ignores per-objective weights"
        difference: "Treats every objective as equal-weight (1/n); produces a different score whenever weights are unequal — the scaffold pins WEIGHTED, not simple average."
    note: "Combinatorial mode (a): ≥3 inputs (weights, progress values) with non-linear interaction via tier branching. Different entity domain (IEPGoal) from lre_percentage (IEP)."

  - name: compensatory_service_hours
    trigger: "RelatedService transitions ACTIVE→SUSPENDED (any cause)"
    algorithm: aggregation
    formula: |
      # Compute on SUSPEND. PINNED rounding order:
      #   round-per-session-then-sum  (NOT sum-then-round)
      # Sessions still SCHEDULED with scheduled_start <= current_date at the
      # moment of suspension are deemed missed. Federal compensatory-service
      # convention applies a 1.5x make-up multiplier per missed session.

      MAKEUP_MULTIPLIER = 1.5

      per_session_owed = []
      for session in ServiceSession
          where session.related_service_id == rs.id
            and session.status == SCHEDULED
            and session.scheduled_start <= District.current_date:
          raw = session.scheduled_minutes * MAKEUP_MULTIPLIER
          # round EACH session to whole minutes (round_half_up) BEFORE summing:
          per_session_owed.append(round_half_up(raw, 0))

      compensatory_minutes_owed = sum(per_session_owed)

      # Worked example proving the rounding-order matters:
      #   three SCHEDULED sessions of 25 min each, all in the past at suspend
      #   per-session raw = 25 * 1.5 = 37.5 → round_half_up = 38 each
      #   round-then-sum = 38 + 38 + 38 = 114   ← PINNED
      #   sum-then-round = 37.5 * 3 = 112.5  → round = 113
      # The scaffold pins 114.
    input_set: "ServiceSession rows for this RelatedService in SCHEDULED status with scheduled_start <= District.current_date at the moment of suspension"
    constants:
      MAKEUP_MULTIPLIER: 1.5
    precision: "round_half_up to 0 decimal places (whole minutes) per session, then sum"
    variants:
      - name: round_then_sum_pinned
        when: "Authoritative — always applied"
        difference: "Multiplies per-session scheduled_minutes by 1.5, rounds each result to whole minutes, then sums. PINNED."
      - name: sum_then_round_naive
        when: "Naive interpretation — explicitly NOT used"
        difference: "Sums raw 1.5x products then rounds once. Produces a strictly different total whenever an odd number of sessions has odd scheduled_minutes (each ends in .5)."
    note: "Combinatorial mode (b): nested rounding where the order matters; we pin round-per-line-item then sum."

  - name: triennial_status
    trigger: "EligibilityEvaluation finalize; POST /districts/{id}/clock/advance; Student GET"
    algorithm: threshold
    formula: |
      if Student.triennial_reevaluation_due_date is null:
          triennial_status = NOT_APPLICABLE
      else:
          days_to_due = (Student.triennial_reevaluation_due_date - District.current_date).days
          if days_to_due > 90:
              triennial_status = ON_TRACK
          elif days_to_due >= 0:
              triennial_status = DUE_SOON
          else:
              triennial_status = OVERDUE
      # Boundary precision:
      #   days_to_due == 91 → ON_TRACK
      #   days_to_due == 90 → DUE_SOON
      #   days_to_due ==  0 → DUE_SOON
      #   days_to_due == -1 → OVERDUE
    constants:
      DUE_SOON_WINDOW_DAYS: 90
    precision: "integer days; boundary inclusive at 0 and 90"
    note: "Threshold calculation with pinned inclusive/exclusive boundaries."

  - name: requires_transition_plan
    trigger: "Student GET; IEP DRAFT→ACTIVE; POST /districts/{id}/clock/advance"
    algorithm: threshold
    formula: |
      age_threshold_date = Student.date_of_birth + 16 years (same month/day)
      requires_transition_plan = (District.current_date >= age_threshold_date)
                                 and (Student.current_iep_id is not null)
      # Boundary: on the exact day equal to date_of_birth + 16 years,
      # requires_transition_plan is TRUE (inclusive ">=").
    constants:
      TRANSITION_AGE_YEARS: 16
    precision: "calendar-day exact"
    note: "Boundary precision rule on a date metric different from triennial_status (different entity field, different endpoint surface)."

  - name: service_utilization_percent
    trigger: "ServiceSession DELIVERED or CANCELLED; RelatedService SUSPENDED"
    algorithm: aggregation
    formula: |
      weeks_active = floor(
          ((min(District.current_date, suspended_at_or_now)
            - service_first_active_at).total_seconds()) / (7 * 86400))
      total_prescribed_minutes_to_date = max(weeks_active, 0) * minutes_per_week
      if total_prescribed_minutes_to_date == 0:
          utilization_percent = 0.00
      else:
          utilization_percent = round_half_up(
              100.0 * total_delivered_minutes / total_prescribed_minutes_to_date, 2)
    input_set: "ServiceSession rows in DELIVERED status for this RelatedService"
    precision: "round_half_up to 2 decimal places"
    note: "Aggregate metric reported on GET /related-services/{id}; not used to gate state transitions."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this operation per RBAC matrix (§1.7)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "All path-segment resource ids resolve, validated left-to-right (district → student → iep → goal/service → session)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all path-bearing endpoints"

  - priority: 3.5
    category: existence
    check: "Parent must act only on their own Student (Parent.user_id == Student.parent_user_id)"
    error_id: ERR_PARENT_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "all endpoints whose authorized role includes Parent"

  - priority: 4
    category: concurrency
    check: "When body or query carries version, it must equal the resource's current version"
    error_id: ERR_VERSION_MISMATCH
    http_status: 409
    applies_to: "all mutation endpoints that accept version"

  - priority: 5
    category: state
    check: "Target resource must be in a state permitting the operation per §1.2"
    error_id: "ERR_{ENTITY}_NOT_{REQUIRED_STATE}  (e.g., ERR_IEP_NOT_DRAFT, ERR_CONSENT_NOT_PENDING)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "Cross-aggregate foreign keys resolve to the SAME district and student as the parent path"
    error_id: ERR_CROSS_STUDENT_REFERENCE
    http_status: 400
    applies_to: "POST/PUT bodies that carry foreign keys (consent.target_resource_id, dependency_trial_id-like fields, RelatedService.consent_id)"

  - priority: 7
    category: business_safety
    check: "EligibilityEvaluation may finalize only if the acting SchoolPsychologist is not the parent_user_id of the Student (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST .../eligibility-evaluations/{id}/finalize"

  - priority: 8
    category: business_safety
    check: "IEP activation requires Student.current_eligibility_evaluation_id to resolve to an ELIGIBLE evaluation"
    error_id: ERR_STUDENT_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST .../ieps/{id}/activate, PUT .../related-services/{id}/activate"

  - priority: 9
    category: business_safety
    check: "IEP activation requires ParentalConsent(scope=IEP_IMPLEMENTATION) in APPROVED for this IEP"
    error_id: ERR_IEP_CONSENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST .../ieps/{id}/activate"

  - priority: 10
    category: business_safety
    check: "RelatedService activation requires ParentalConsent(scope=RELATED_SERVICE) in APPROVED matching consent_id"
    error_id: ERR_SERVICE_CONSENT_NOT_APPROVED
    http_status: 409
    applies_to: "PUT .../related-services/{id}/activate, PUT .../related-services/{id}/resume"

  - priority: 11
    category: business_safety
    check: "If Student.requires_transition_plan, IEP activation requires a FINALIZED TransitionPlan"
    error_id: ERR_TRANSITION_PLAN_REQUIRED
    http_status: 409
    applies_to: "POST .../ieps/{id}/activate"

  - priority: 12
    category: business_constraint
    check: "At most one IEP per student in {ACTIVE, AMENDMENT_PENDING}"
    error_id: ERR_IEP_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST .../ieps/{id}/activate"

  - priority: 13
    category: business_constraint
    check: "At most one ACTIVE RelatedService per (iep_id, service_type)"
    error_id: ERR_SERVICE_TYPE_ALREADY_ACTIVE
    http_status: 409
    applies_to: "PUT .../related-services/{id}/activate, PUT .../related-services/{id}/resume"

  - priority: 14
    category: business_temporal
    check: "ServiceSession scheduled_start < scheduled_end AND no other SCHEDULED/DELIVERED session on the same related_service_id with overlapping [scheduled_start, scheduled_end] (closed intervals — adjacency counts as overlap)"
    error_id: ERR_SERVICE_SESSION_OVERLAP
    http_status: 409
    applies_to: "POST .../sessions"

  - priority: 15
    category: business_temporal
    check: "IEP effective_start_date must be strictly after the most recent prior IEP.scheduled_review_date for the same student (half-open [start, end) intervals — no overlap and no gap-touch ambiguity)"
    error_id: ERR_IEP_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST .../ieps/{id}/activate"

  - priority: 16
    category: business_constraint
    check: "IEPGoal.objectives weights MUST sum to exactly 1.00 (round_half_up to 2 dp)"
    error_id: ERR_OBJECTIVE_WEIGHTS_INVALID
    http_status: 400
    applies_to: "POST .../ieps/{id}/goals, PUT .../ieps/{id}/goals/{goalId}"

  - priority: 17
    category: business_constraint
    check: "GoalProgressReport.objective_progress MUST include exactly the objective_id set declared on the parent goal — no missing, no extra"
    error_id: ERR_PROGRESS_OBJECTIVE_SET_MISMATCH
    http_status: 400
    applies_to: "POST .../goals/{goalId}/progress-reports"

  - priority: 18
    category: business_constraint
    check: "GoalProgressReport (iep_goal_id, reporting_period_index) MUST be unique"
    error_id: ERR_DUPLICATE_PROGRESS_REPORT
    http_status: 409
    applies_to: "POST .../goals/{goalId}/progress-reports"

  - priority: 19
    category: business_fiscal
    check: "IEP.special_education_minutes_per_week <= IEP.total_instructional_minutes_per_week — sped time cannot exceed instructional time"
    error_id: ERR_SERVICE_MINUTES_EXCEED_INSTRUCTIONAL_TIME
    http_status: 422
    applies_to: "PUT .../related-services/{id}/activate, PUT .../related-services/{id}/resume, POST .../related-services"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Districts (root, includes deterministic clock) ---
  - method: POST
    path: "/districts"
    description: "Create a District (root tenant)"
    roles: [DistrictAdmin]
    code: 201
    input: [name, state_code]
    output: District
    side_effects: ["current_date initialized to 2025-01-01T00:00:00.000Z"]

  - method: GET
    path: "/districts/{districtId}"
    description: "Get a District"
    roles: [DistrictAdmin, SchoolPsychologist, SpecialEducationTeacher, RelatedServiceProvider, Parent]
    code: 200
    input: []
    output: District
    side_effects: []

  - method: POST
    path: "/districts/{districtId}/clock/advance"
    description: "Advance the deterministic clock — REQUIRED for tests to exercise time-gated transitions (triennial overdue, IEP expiry, transition-age threshold, session due-yet check)"
    roles: [DistrictAdmin]
    code: 200
    input: ["by_days (integer 1..3650)"]
    output: District
    side_effects:
      - "current_date += by_days"
      - "All Students: recompute triennial_status and requires_transition_plan"
      - "All ACTIVE IEPs whose scheduled_review_date <= new current_date: auto-transition to EXPIRED with cascades"

  # --- Students ---
  - method: POST
    path: "/districts/{districtId}/students"
    description: "Create a Student"
    roles: [DistrictAdmin]
    code: 201
    input: [external_student_number, date_of_birth, parent_user_id]
    output: Student
    side_effects: ["triennial_status = NOT_APPLICABLE; lre_classification = NOT_APPLICABLE"]

  - method: GET
    path: "/districts/{districtId}/students"
    description: "List Students (filter by triennial_status, lre_classification optional)"
    roles: [DistrictAdmin, SchoolPsychologist, SpecialEducationTeacher, RelatedServiceProvider]
    code: 200
    input: ["triennial_status?", "lre_classification?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/students/{studentId}"
    description: "Get a Student (includes computed triennial_status, lre_classification, requires_transition_plan)"
    roles: [DistrictAdmin, SchoolPsychologist, SpecialEducationTeacher, RelatedServiceProvider, Parent]
    code: 200
    input: []
    output: Student
    side_effects: ["triennial_status and requires_transition_plan are recomputed lazily on read"]

  # --- Eligibility Evaluations ---
  - method: POST
    path: "/districts/{districtId}/students/{studentId}/eligibility-evaluations"
    description: "Create an EligibilityEvaluation in REQUESTED status"
    roles: [SchoolPsychologist]
    code: 201
    input: [evaluation_type]
    output: EligibilityEvaluation
    side_effects: ["status = REQUESTED; evaluator_user_id = X-User-ID"]

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/eligibility-evaluations/{evaluationId}/request-consent"
    description: "Transition REQUESTED→CONSENT_PENDING; auto-creates the gating ParentalConsent"
    roles: [SchoolPsychologist]
    code: 200
    input: []
    output: EligibilityEvaluation
    side_effects:
      - "Evaluation status → CONSENT_PENDING"
      - "Create ParentalConsent(scope=EVALUATION, target_resource_id=evaluation.id, status=PENDING)"

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/eligibility-evaluations/{evaluationId}/finalize"
    description: "Finalize the evaluation as ELIGIBLE or INELIGIBLE"
    roles: [SchoolPsychologist]
    code: 200
    input: [disability_categories]
    output: EligibilityEvaluation
    side_effects:
      - "status → ELIGIBLE (non-empty categories) | INELIGIBLE (empty)"
      - "finalized_at = District.current_date"
      - "Student.current_eligibility_evaluation_id = evaluation.id"
      - "Student.triennial_reevaluation_due_date = finalized_at + 3 years"
      - "If INELIGIBLE: cascade — revoke any ACTIVE IEP and its goals/services"

  - method: GET
    path: "/districts/{districtId}/students/{studentId}/eligibility-evaluations"
    description: "List evaluations"
    roles: [DistrictAdmin, SchoolPsychologist, SpecialEducationTeacher, Parent]
    code: 200
    input: ["status?"]
    output: "EligibilityEvaluation[]"
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/students/{studentId}/eligibility-evaluations/{evaluationId}"
    description: "Get an evaluation"
    roles: [DistrictAdmin, SchoolPsychologist, SpecialEducationTeacher, Parent]
    code: 200
    input: []
    output: EligibilityEvaluation
    side_effects: []

  # --- Parental Consents ---
  - method: POST
    path: "/districts/{districtId}/students/{studentId}/parental-consents"
    description: "Create a ParentalConsent (used for scope=IEP_IMPLEMENTATION or scope=RELATED_SERVICE explicitly; EVALUATION-scope consents are auto-created by request-consent)"
    roles: [SpecialEducationTeacher, RelatedServiceProvider]
    code: 201
    input: [scope, target_resource_type, target_resource_id]
    output: ParentalConsent
    side_effects: ["status = PENDING"]

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/parental-consents/{consentId}/approve"
    description: "Parent approves a PENDING consent"
    roles: [Parent]
    code: 200
    input: []
    output: ParentalConsent
    side_effects:
      - "status → APPROVED; decided_at = current_date"
      - "If scope=EVALUATION: parent EligibilityEvaluation → IN_PROGRESS"
      - "If scope=RELATED_SERVICE: RelatedService.consent_id = consent.id"

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/parental-consents/{consentId}/reject"
    description: "Parent rejects a PENDING consent"
    roles: [Parent]
    code: 200
    input: []
    output: ParentalConsent
    side_effects: ["status → REJECTED; decided_at = current_date"]

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/parental-consents/{consentId}/withdraw"
    description: "Parent withdraws an APPROVED consent (revocation cycle)"
    roles: [Parent]
    code: 200
    input: []
    output: ParentalConsent
    side_effects:
      - "status → WITHDRAWN; withdrawn_at = current_date"
      - "Cascade per §1.2 ParentalConsent APPROVED→WITHDRAWN"

  - method: GET
    path: "/districts/{districtId}/students/{studentId}/parental-consents"
    description: "List consents"
    roles: [DistrictAdmin, SpecialEducationTeacher, RelatedServiceProvider, SchoolPsychologist, Parent]
    code: 200
    input: ["scope?", "status?"]
    output: "ParentalConsent[]"
    side_effects: []

  # --- IEPs ---
  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps"
    description: "Create a DRAFT IEP"
    roles: [SpecialEducationTeacher]
    code: 201
    input: [meeting_held_at, effective_start_date, total_instructional_minutes_per_week, total_school_day_minutes_per_week]
    output: IEP
    side_effects:
      - "status = DRAFT; scheduled_review_date = effective_start_date + 365 days"
      - "special_education_minutes_per_week = 0"

  - method: GET
    path: "/districts/{districtId}/students/{studentId}/ieps"
    description: "List IEPs for a student"
    roles: [DistrictAdmin, SpecialEducationTeacher, RelatedServiceProvider, SchoolPsychologist, Parent]
    code: 200
    input: ["status?"]
    output: "IEP[]"
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}"
    description: "Get an IEP (includes lre_percentage variants)"
    roles: [DistrictAdmin, SpecialEducationTeacher, RelatedServiceProvider, SchoolPsychologist, Parent]
    code: 200
    input: []
    output: IEP
    side_effects: []

  - method: GET
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/lre-summary"
    description: "Computed read: returns both lre_percentage_instructional and lre_percentage_school_day plus classification"
    roles: [DistrictAdmin, SpecialEducationTeacher, RelatedServiceProvider, SchoolPsychologist, Parent]
    code: 200
    input: []
    output: "{lre_percentage_instructional, lre_percentage_school_day, lre_classification, total_sped_minutes}"
    side_effects: []

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/activate"
    description: "Activate a DRAFT IEP"
    roles: [SpecialEducationTeacher]
    code: 200
    input: []
    output: IEP
    side_effects:
      - "status → ACTIVE; all PROPOSED goals → ACTIVE; FINALIZED TransitionPlan (if any) → ACTIVE"
      - "Any previously ACTIVE IEP for same student → SUPERSEDED (cascade COMPLETED on its services)"
      - "Student.current_iep_id = iep.id; recompute lre_classification"

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/begin-amendment"
    description: "Begin an amendment cycle on an ACTIVE IEP"
    roles: [SpecialEducationTeacher]
    code: 200
    input: []
    output: IEP
    side_effects: ["status → AMENDMENT_PENDING"]

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/finalize-amendment"
    description: "Finalize an amendment cycle"
    roles: [SpecialEducationTeacher]
    code: 200
    input: []
    output: IEP
    side_effects: ["status → ACTIVE; recompute lre_classification"]

  # --- IEP Goals ---
  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/goals"
    description: "Add a goal to a DRAFT or AMENDMENT_PENDING IEP"
    roles: [SpecialEducationTeacher]
    code: 201
    input: [domain, description, objectives]
    output: IEPGoal
    side_effects: ["status = PROPOSED if IEP is DRAFT; status = PROPOSED if IEP is AMENDMENT_PENDING"]

  - method: GET
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/goals"
    description: "List goals on an IEP"
    roles: [DistrictAdmin, SpecialEducationTeacher, RelatedServiceProvider, SchoolPsychologist, Parent]
    code: 200
    input: ["status?", "domain?"]
    output: "IEPGoal[]"
    side_effects: []

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/goals/{goalId}/close"
    description: "Close an ACTIVE goal as MET or NOT_MET"
    roles: [SpecialEducationTeacher]
    code: 200
    input: [disposition]
    output: IEPGoal
    side_effects: ["status → MET | NOT_MET per disposition and gating rules"]

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/goals/{goalId}/progress-reports"
    description: "File a progress report; updates objective.latest_progress_percent and recomputes mastery_tier"
    roles: [SpecialEducationTeacher]
    code: 201
    input: [reporting_period_index, objective_progress, narrative]
    output: GoalProgressReport
    side_effects:
      - "For each entry in objective_progress: update matching objective.latest_progress_percent"
      - "Recompute goal.mastery_score and goal.mastery_tier"

  # --- Related Services ---
  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services"
    description: "Propose a related service"
    roles: [SpecialEducationTeacher]
    code: 201
    input: [service_type, minutes_per_week, provider_user_id, location_setting]
    output: RelatedService
    side_effects: ["status = PROPOSED"]

  - method: GET
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services"
    description: "List related services on an IEP"
    roles: [DistrictAdmin, SpecialEducationTeacher, RelatedServiceProvider, Parent]
    code: 200
    input: ["status?", "service_type?"]
    output: "RelatedService[]"
    side_effects: []

  - method: PUT
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/activate"
    description: "Activate a PROPOSED related service after consent"
    roles: [RelatedServiceProvider]
    code: 200
    input: [consent_id]
    output: RelatedService
    side_effects:
      - "status → ACTIVE; recompute IEP.lre_percentage_*; recompute Student.lre_classification"

  - method: PUT
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/suspend"
    description: "Suspend an ACTIVE related service (provider-initiated)"
    roles: [RelatedServiceProvider]
    code: 200
    input: []
    output: RelatedService
    side_effects:
      - "status → SUSPENDED; compute compensatory_minutes_owed; recompute LRE"

  - method: PUT
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/resume"
    description: "Resume a SUSPENDED related service"
    roles: [RelatedServiceProvider]
    code: 200
    input: [consent_id]
    output: RelatedService
    side_effects:
      - "status → ACTIVE; recompute LRE"

  # --- Service Sessions ---
  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/sessions"
    description: "Schedule a service session"
    roles: [RelatedServiceProvider]
    code: 201
    input: [scheduled_start, scheduled_end]
    output: ServiceSession
    side_effects: ["scheduled_minutes computed"]

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/sessions/{sessionId}/deliver"
    description: "Mark a session DELIVERED"
    roles: [RelatedServiceProvider]
    code: 200
    input: [actual_minutes]
    output: ServiceSession
    side_effects:
      - "status → DELIVERED; RelatedService.total_delivered_minutes += actual_minutes; utilization_percent recomputed"

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/related-services/{serviceId}/sessions/{sessionId}/cancel"
    description: "Cancel a SCHEDULED session"
    roles: [RelatedServiceProvider]
    code: 200
    input: []
    output: ServiceSession
    side_effects: ["status → CANCELLED; total_cancelled_minutes += scheduled_minutes"]

  # --- Transition Plan ---
  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/transition-plan"
    description: "Create a DRAFT TransitionPlan on a DRAFT or AMENDMENT_PENDING IEP"
    roles: [SpecialEducationTeacher]
    code: 201
    input: [post_secondary_goal, required_courses, outside_agency_referrals, parent_invitation_documented, student_invitation_documented]
    output: TransitionPlan
    side_effects: ["status = DRAFT"]

  - method: POST
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/transition-plan/finalize"
    description: "Finalize a DRAFT TransitionPlan"
    roles: [SpecialEducationTeacher]
    code: 200
    input: []
    output: TransitionPlan
    side_effects: ["status → FINALIZED"]

  - method: GET
    path: "/districts/{districtId}/students/{studentId}/ieps/{iepId}/transition-plan"
    description: "Get the TransitionPlan for an IEP (null if none)"
    roles: [DistrictAdmin, SpecialEducationTeacher, RelatedServiceProvider, Parent]
    code: 200
    input: []
    output: TransitionPlan
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / authorization ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or invalid" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_PARENT_OWNERSHIP_MISMATCH, http: 403, condition: "Acting Parent.user_id is not Student.parent_user_id" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Acting SchoolPsychologist is also the Student's parent_user_id; finalize forbidden" }

  # --- Existence ---
  - { id: ERR_DISTRICT_NOT_FOUND, http: 404, condition: "District id does not resolve" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student id does not resolve within District" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "EligibilityEvaluation id does not resolve" }
  - { id: ERR_CONSENT_NOT_FOUND, http: 404, condition: "ParentalConsent id does not resolve" }
  - { id: ERR_IEP_NOT_FOUND, http: 404, condition: "IEP id does not resolve" }
  - { id: ERR_GOAL_NOT_FOUND, http: 404, condition: "IEPGoal id does not resolve" }
  - { id: ERR_SERVICE_NOT_FOUND, http: 404, condition: "RelatedService id does not resolve" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "ServiceSession id does not resolve" }
  - { id: ERR_TRANSITION_PLAN_NOT_FOUND, http: 404, condition: "TransitionPlan id does not resolve" }
  - { id: ERR_PROGRESS_REPORT_NOT_FOUND, http: 404, condition: "GoalProgressReport id does not resolve" }

  # --- Input validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, type mismatch, or out-of-range value" }
  - { id: ERR_CROSS_STUDENT_REFERENCE, http: 400, condition: "Foreign-key target belongs to a different student or district than the path implies" }
  - { id: ERR_OBJECTIVE_WEIGHTS_INVALID, http: 400, condition: "IEPGoal.objectives weights do not sum to 1.00 or include weights outside (0, 1]" }
  - { id: ERR_PROGRESS_OBJECTIVE_SET_MISMATCH, http: 400, condition: "GoalProgressReport.objective_progress does not match the goal's objective_id set exactly" }
  - { id: ERR_TRANSITION_INVITATIONS_MISSING, http: 400, condition: "TransitionPlan finalize attempted without parent_invitation_documented=true or student_invitation_documented=true" }

  # --- Concurrency ---
  - { id: ERR_VERSION_MISMATCH, http: 409, condition: "Provided version does not match current entity version" }
  - { id: ERR_DUPLICATE_PROGRESS_REPORT, http: 409, condition: "A progress report already exists for (iep_goal_id, reporting_period_index)" }
  - { id: ERR_SERVICE_SESSION_OVERLAP, http: 409, condition: "Two ServiceSession rows overlap on the same RelatedService (closed-interval adjacency)" }
  - { id: ERR_IEP_PERIOD_OVERLAP, http: 409, condition: "Proposed IEP.effective_start_date is not strictly after a prior IEP.scheduled_review_date for the same student (half-open intervals)" }

  # --- State constraints (entity-specific 409s) ---
  - { id: ERR_EVALUATION_NOT_REQUESTED, http: 409, condition: "EligibilityEvaluation not in REQUESTED" }
  - { id: ERR_EVALUATION_NOT_IN_PROGRESS, http: 409, condition: "EligibilityEvaluation not in IN_PROGRESS" }
  - { id: ERR_CONSENT_NOT_PENDING, http: 409, condition: "ParentalConsent not in PENDING" }
  - { id: ERR_CONSENT_NOT_APPROVED, http: 409, condition: "ParentalConsent not in APPROVED (withdraw attempted on wrong status)" }
  - { id: ERR_IEP_NOT_DRAFT, http: 409, condition: "IEP not in DRAFT" }
  - { id: ERR_IEP_NOT_ACTIVE, http: 409, condition: "IEP not in ACTIVE" }
  - { id: ERR_IEP_NOT_AMENDMENT_PENDING, http: 409, condition: "IEP not in AMENDMENT_PENDING" }
  - { id: ERR_IEP_NOT_AMENDABLE_FOR_TRANSITION, http: 409, condition: "TransitionPlan finalize while parent IEP is not in DRAFT or AMENDMENT_PENDING" }
  - { id: ERR_IEP_NO_GOALS, http: 409, condition: "IEP activation attempted with zero PROPOSED goals" }
  - { id: ERR_IEP_MEETING_NOT_HELD, http: 409, condition: "IEP.meeting_held_at is null or > District.current_date at activation" }
  - { id: ERR_GOAL_NOT_ACTIVE, http: 409, condition: "IEPGoal not in ACTIVE" }
  - { id: ERR_GOAL_NOT_MASTERED, http: 409, condition: "Goal close attempted as MET but mastery_tier != MASTERED" }
  - { id: ERR_SERVICE_NOT_PROPOSED, http: 409, condition: "RelatedService not in PROPOSED" }
  - { id: ERR_SERVICE_NOT_ACTIVE, http: 409, condition: "RelatedService not in ACTIVE" }
  - { id: ERR_SERVICE_NOT_SUSPENDED, http: 409, condition: "RelatedService not in SUSPENDED (resume attempted)" }
  - { id: ERR_SESSION_NOT_SCHEDULED, http: 409, condition: "ServiceSession not in SCHEDULED" }
  - { id: ERR_SESSION_NOT_DUE_YET, http: 409, condition: "ServiceSession scheduled_start > District.current_date at deliver time" }
  - { id: ERR_TRANSITION_PLAN_NOT_DRAFT, http: 409, condition: "TransitionPlan not in DRAFT (finalize attempted)" }

  # --- Cross-entity & business gates (403/409/422) ---
  - { id: ERR_STUDENT_NOT_ELIGIBLE, http: 409, condition: "Student.current_eligibility_evaluation_id does not resolve to ELIGIBLE" }
  - { id: ERR_IEP_CONSENT_NOT_APPROVED, http: 409, condition: "ParentalConsent(scope=IEP_IMPLEMENTATION) for this IEP not in APPROVED" }
  - { id: ERR_SERVICE_CONSENT_NOT_APPROVED, http: 409, condition: "ParentalConsent(scope=RELATED_SERVICE) referenced by RelatedService.consent_id not in APPROVED" }
  - { id: ERR_TRANSITION_PLAN_REQUIRED, http: 409, condition: "Student.requires_transition_plan is true but no FINALIZED TransitionPlan exists at IEP activation" }
  - { id: ERR_IEP_ALREADY_ACTIVE, http: 409, condition: "Another IEP for the same student is already in ACTIVE or AMENDMENT_PENDING" }
  - { id: ERR_SERVICE_TYPE_ALREADY_ACTIVE, http: 409, condition: "Another RelatedService on the same IEP with same service_type is already ACTIVE" }
  - { id: ERR_SERVICE_MINUTES_EXCEED_INSTRUCTIONAL_TIME, http: 422, condition: "Activating this RelatedService would push special_education_minutes_per_week above total_instructional_minutes_per_week" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictAdmin
    description: "District administrator. Manages district, clock, and student records. Cannot perform evaluative or instructional roles (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST /districts — Create district"
      - "POST /districts/{id}/clock/advance — Advance deterministic clock"
      - "POST /districts/{id}/students — Create student"
    shared_operations:
      - "GET /districts/{id} — Read district"
      - "GET /districts/{id}/students[/{id}] — List/read students"
      - "GET .../eligibility-evaluations[/{id}] — Read evaluations"
      - "GET .../ieps[/{id}], .../goals, .../related-services, .../transition-plan — Read instructional records"
      - "GET .../parental-consents — Read consents"

  - name: SchoolPsychologist
    description: "Conducts eligibility evaluations. Cannot also be the acting Parent on the same Student (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST .../eligibility-evaluations — Create"
      - "POST .../eligibility-evaluations/{id}/request-consent — Move REQUESTED→CONSENT_PENDING"
      - "POST .../eligibility-evaluations/{id}/finalize — Finalize ELIGIBLE/INELIGIBLE"
    shared_operations:
      - "GET reads on students, evaluations, IEPs, goals, services"

  - name: SpecialEducationTeacher
    description: "Drafts and amends IEPs, owns goals and transition plans, files progress reports. Cannot finalize evaluations (segregation of duties)."
    identity: opaque
    exclusive_operations:
      - "POST .../ieps — Create draft IEP"
      - "POST .../ieps/{id}/activate, .../begin-amendment, .../finalize-amendment"
      - "POST .../ieps/{id}/goals, POST .../goals/{id}/close, POST .../goals/{id}/progress-reports"
      - "POST .../ieps/{id}/transition-plan, .../transition-plan/finalize"
      - "POST .../ieps/{id}/related-services — Propose service (PROPOSED state)"
    shared_operations:
      - "POST .../parental-consents (scope=IEP_IMPLEMENTATION) — shared with RelatedServiceProvider"
      - "GET reads on students, IEPs, evaluations, services"

  - name: RelatedServiceProvider
    description: "Licensed OT/PT/Speech/Counseling/OM provider. Activates services, schedules and delivers sessions."
    identity: opaque
    exclusive_operations:
      - "PUT .../related-services/{id}/activate, .../suspend, .../resume"
      - "POST .../related-services/{id}/sessions, .../sessions/{id}/deliver, .../sessions/{id}/cancel"
    shared_operations:
      - "POST .../parental-consents (scope=RELATED_SERVICE) — shared with SpecialEducationTeacher"
      - "GET reads on students, IEPs, services, sessions"

  - name: Parent
    description: "Legally responsible parent/guardian of a Student. Acts on consents for their own student only."
    identity: opaque
    exclusive_operations:
      - "POST .../parental-consents/{id}/approve"
      - "POST .../parental-consents/{id}/reject"
      - "POST .../parental-consents/{id}/withdraw"
    shared_operations:
      - "GET reads on their own Student, IEPs, evaluations, services, consents (only their own student)"
    note: "Parent identity is opaque (X-User-ID is an opaque parent identifier), but every Parent request additionally requires X-User-ID == Student.parent_user_id — enforced by ERR_PARENT_OWNERSHIP_MISMATCH (priority 3.5)."
