          assert:
            - "HTTP 200 with status == ABANDONED, labor_minutes_total == 30, parts_cost_cents == 0, packaging_cost_cents == 0 and total_cost_cents == 3278 (overhead applied once to 2850)"
            - "GET /return-lines/${rl_id} shows disposition_state == DISPOSITION_ASSIGNED and disposition == LIQUIDATE — D5 no longer matches because refurb_eligible_effective is false, and D6 holds (11700 * 100 == 1170000 >= 20000 * 1 * 30 == 600000)"
