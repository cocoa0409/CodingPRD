# =============================================================================
# §1.9 Scaffold Corner Design — Breadth Coverage Index
# Water & Sewer Utility Billing (task_0277)
# Walks references/claim-extraction-guide.md against §1.1-§1.7. §1.8 covers the
# nine depth rules; §1.9 covers required-field validation, invalid transitions,
# RBAC denial, FK integrity, response envelope, computed fields, OCC, pagination.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_account_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "POST /accounts with rate_schedule_id+holder_name+service_address returns 201; billing_status=CURRENT, service_status=ACTIVE, balance_due_cents=0, version=1."
        test_recipe:
          setup: ["Empty DB; one rate schedule."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "Jane", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
          assert:
            - "Account.${acct_id}.billing_status == CURRENT"
            - "Account.${acct_id}.service_status == ACTIVE"
            - "Account.${acct_id}.balance_due_cents == 0"
            - "Account.${acct_id}.version == 1"

      - name: get_account_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Account, "validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /accounts/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_account_missing_required_field_returns_422
        claim_type: Required Fields
        grounds: [entities.Account, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts omitting holder_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["One rate schedule exists."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
          trigger:
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", service_address: "1 Main" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

      - name: meter_invalid_enum_type_returns_422
        claim_type: Type Constraints
        grounds: [entities.Meter.fields.meter_type, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /accounts/{id}/meters with meter_type=GAS (not in {POTABLE,IRRIGATION}) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Account exists."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "GAS", serial: "G1" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 422"

      - name: meter_read_consumption_computed_from_prior_read
        claim_type: Computed Fields
        grounds: [entities.MeterRead.fields.consumption_gallons, entities.Meter.fields.last_reading_gallons, endpoints]
        distinguishing_aspect: "First read (5000) has consumption_gallons=0; second read (12000) has consumption_gallons=7000; Meter.last_reading_gallons=12000."
        test_recipe:
          setup: ["Account with one POTABLE meter."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 5000, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
              captures: { r1: $.data.consumption_gallons }
          trigger:
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 12000, read_date: "2026-01-15T00:00:00Z" }
              as: BillingClerk
              captures: { r2: $.data.consumption_gallons }
          assert:
            - "MeterRead.r1.consumption_gallons == 0"
            - "MeterRead.r2.consumption_gallons == 7000"
            - "Meter.${mp}.last_reading_gallons == 12000"

      - name: list_accounts_paginated_envelope
        claim_type: Listing
        grounds: [entities.Account, endpoints]
        distinguishing_aspect: "GET /accounts returns an array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["Two accounts exist."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "B", service_address: "2 Main" }
              as: BillingClerk
          trigger:
            - call: "GET /accounts"
              payload: { limit: 1, offset: 0 }
              as: BillingClerk
          assert:
            - "response.response_type == array"
            - "response.meta.total_count == 2"
            - "response.meta.has_more == true"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: post_bill_from_already_posted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Bill.DRAFT_to_POSTED, "validations[priority=6]", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Posting a bill already in POSTED state returns ERR_INVALID_STATE (409); no double-posting."
        test_recipe:
          setup: ["A POSTED bill (potable 6000)."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 6000, read_date: "2026-01-20T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /bills/${bill}/post"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /bills/${bill}/post"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: duplicate_bill_same_account_cycle_returns_409
        claim_type: Precondition Enforcement
        grounds: [state_machines.Bill.DRAFT_to_POSTED, "validations[priority=8]", "errors[ERR_DUPLICATE_BILL]"]
        distinguishing_aspect: "Generating a second non-VOID bill for the same (account_id, billing_cycle_id) returns ERR_DUPLICATE_BILL (409)."
        test_recipe:
          setup: ["One bill already exists for (account, cycle)."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 6000, read_date: "2026-01-20T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { bill1: $.data.id }
          trigger:
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_DUPLICATE_BILL"
            - "response.http_status == 409"

      - name: execute_shutoff_before_scheduled_for_returns_not_due
        claim_type: Precondition Enforcement
        grounds: [state_machines.ShutoffOrder.SCHEDULED_to_EXECUTED, "validations[priority=12]", "errors[ERR_SHUTOFF_NOT_DUE]"]
        distinguishing_aspect: "Executing a SCHEDULED order while current clock < scheduled_for returns ERR_SHUTOFF_NOT_DUE (409)."
        test_recipe:
          setup: ["Account SHUTOFF_PENDING with a SCHEDULED order for 2026-03-10; clock at 2026-03-05."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: BillingClerk
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 30000, read_date: "2026-01-20T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /bills/${bill}/post"
              payload: {}
              as: BillingClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /billing-cycles/${cyc}/close"
              payload: {}
              as: BillingClerk
            - call: "POST /shutoff-orders"
              payload: { account_id: "${acct_id}", triggering_bill_id: "${bill}", scheduled_for: "2026-03-10T00:00:00Z" }
              as: FieldOps
              captures: { so_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-05T00:00:00Z" }
              as: FieldOps
          trigger:
            - call: "POST /shutoff-orders/${so_id}/execute"
              payload: {}
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_SHUTOFF_NOT_DUE"
            - "response.http_status == 409"

      - name: reconnect_scheduled_order_returns_not_executed
        claim_type: Invalid Transitions
        grounds: [state_machines.ShutoffOrder.EXECUTED_to_RECONNECTED, "validations[priority=16]", "errors[ERR_NOT_EXECUTED]"]
        distinguishing_aspect: "Reconnecting a still-SCHEDULED (never executed) order returns ERR_NOT_EXECUTED (409)."
        test_recipe:
          setup: ["Account SHUTOFF_PENDING with a SCHEDULED (not executed) order."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: BillingClerk
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 30000, read_date: "2026-01-20T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /bills/${bill}/post"
              payload: {}
              as: BillingClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /billing-cycles/${cyc}/close"
              payload: {}
              as: BillingClerk
            - call: "POST /shutoff-orders"
              payload: { account_id: "${acct_id}", triggering_bill_id: "${bill}", scheduled_for: "2026-03-10T00:00:00Z" }
              as: FieldOps
              captures: { so_id: $.data.id }
          trigger:
            - call: "POST /shutoff-orders/${so_id}/reconnect"
              payload: {}
              as: FieldOps
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_EXECUTED"
            - "response.http_status == 409"

      - name: void_posted_bill_with_payment_returns_409
        claim_type: Precondition Enforcement
        grounds: [state_machines.Bill.POSTED_to_VOID, "errors[ERR_BILL_HAS_PAYMENT]"]
        distinguishing_aspect: "Voiding a POSTED bill that already has an applied payment returns ERR_BILL_HAS_PAYMENT (409)."
        test_recipe:
          setup: ["A POSTED bill with a payment partially applied to it."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: null, rate_cents_per_kgal: 500}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 6000, read_date: "2026-01-20T00:00:00Z" }
              as: BillingClerk
            - call: "POST /bills"
              payload: { account_id: "${acct_id}", billing_cycle_id: "${cyc}" }
              as: BillingClerk
              captures: { bill: $.data.id }
            - call: "POST /bills/${bill}/post"
              payload: {}
              as: BillingClerk
            - call: "POST /accounts/${acct_id}/payments"
              payload: { amount_cents: 1000, method: "ACH" }
              as: BillingClerk
          trigger:
            - call: "POST /bills/${bill}/void"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_BILL_HAS_PAYMENT"
            - "response.http_status == 409"

      - name: leak_approve_computes_credit_and_reduces_balance
        claim_type: Side Effect Execution
        grounds: [state_machines.LeakAdjustment.PENDING_to_APPROVED, calculations.leak_credit, entities.Bill.fields.leak_credit_cents]
        distinguishing_aspect: "Approving a leak adjustment (baseline 4000 on potable 12000) sets credit_cents=1200, Bill.leak_credit_cents=1200, amount_billed_cents 18980->17780, and reduces Account.balance_due_cents by 1200."
        test_recipe:
          setup: ["A POSTED bill (potable 12000, irrigation 8000, amount_billed 18980, balance 18980); a PENDING leak adjustment baseline 4000."]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { name: "Res", fixed_water_charge_cents: 1200, fixed_sewer_charge_cents: 800, water_tiers: [{up_to_gallons: 5000, rate_cents_per_kgal: 300}, {up_to_gallons: 15000, rate_cents_per_kgal: 500}, {up_to_gallons: null, rate_cents_per_kgal: 800}], sewer_rate_cents_per_kgal: 600, sewer_ratio_pct: 90 }
              as: BillingClerk
              captures: { rs_id: $.data.id }
            - call: "POST /accounts"
              payload: { rate_schedule_id: "${rs_id}", holder_name: "A", service_address: "1 Main" }
              as: BillingClerk
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "POTABLE", serial: "P" }
              as: BillingClerk
              captures: { mp: $.data.id }
            - call: "POST /accounts/${acct_id}/meters"
              payload: { meter_type: "IRRIGATION", serial: "I" }
              as: BillingClerk
              captures: { mi: $.data.id }
            - call: "POST /billing-cycles"
              payload: { label: "2026-01", period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z", due_date: "2026-02-15T00:00:00Z" }
              as: BillingClerk
              captures: { cyc: $.data.id }
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mp}/reads"
              payload: { reading_gallons: 12000, read_date: "2026-01-31T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mi}/reads"
              payload: { reading_gallons: 0, read_date: "2026-01-01T00:00:00Z" }
              as: BillingClerk
            - call: "POST /meters/${mi}/reads"
