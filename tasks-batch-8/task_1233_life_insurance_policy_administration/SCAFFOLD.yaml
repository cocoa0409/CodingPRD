# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "Missing or malformed X-User-ID / X-User-Role headers" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not allowed on this endpoint" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "policy id in path does not exist" }
  - { id: ERR_APPLICATION_NOT_FOUND, http: 404, condition: "application id in path does not exist" }
  - { id: ERR_TEMPLATE_NOT_FOUND, http: 404, condition: "product_template id in path does not exist" }
  - { id: ERR_INSURED_NOT_FOUND, http: 404, condition: "insured_person id in path does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "billing cycle id in path does not exist" }
  - { id: ERR_LOAN_NOT_FOUND, http: 404, condition: "loan id in path does not exist" }
  - { id: ERR_RIDER_NOT_FOUND, http: 404, condition: "rider id in path does not exist" }
  - { id: ERR_REINSTATEMENT_NOT_FOUND, http: 404, condition: "reinstatement request id in path does not exist" }
  - { id: ERR_CONVERSION_NOT_FOUND, http: 404, condition: "conversion request id in path does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a state permitting the operation (e.g., approve a PENDING application, terminate an EXERCISED rider)" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Same X-User-ID attempted two distinct steps in a segregation-of-duties chain (issue vs approve, conversion request vs approve, reinstatement request vs approve)" }
  - { id: ERR_WINDOW_EXPIRED, http: 409, condition: "Clock-based window has passed (conversion > 5y from issue; reinstatement > 5y from lapse)" }
  - { id: ERR_INCOMPATIBLE_REFERENCE, http: 422, condition: "Referenced entity exists but is in an incompatible state (target product is TERM_CONVERTIBLE; rider policy not IN_FORCE)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Field value fails schema constraint (bad enum, out-of-range amount, missing required field)" }
  - { id: ERR_CLASS_TOBACCO_MISMATCH, http: 422, condition: "Requested underwriting_class inconsistent with insured's tobacco_user flag" }
  - { id: ERR_INSUFFICIENT_CASH_VALUE, http: 402, condition: "Cash value (net of loans and charges) insufficient for the requested loan / non-forfeiture election" }
  - { id: ERR_INSUFFICIENT_PAYMENT, http: 402, condition: "Reinstatement payment does not cover back_premium_due_cents" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_policy_version does not match current Policy.version (OCC)" }
  - { id: ERR_PRODUCT_NOT_PARTICIPATING, http: 422, condition: "Dividend declaration attempted on a non-participating product" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Operation on a resource already in a terminal state (e.g., repay a REPAID loan, terminate an EXERCISED rider)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Carrier platform administrator — manages product templates, declares dividends, controls the logical clock, triggers manual accruals"
    identity: "opaque"
    exclusive_operations:
      - "POST /product-templates"
      - "POST /_clock/set_current_utc"
      - "POST /policies/{id}/dividend-declarations"
      - "POST /policies/{id}/loans/{loanId}/accrue-interest"
    shared_operations:
      - "GET endpoints"

  - name: Agent
    description: "Licensed insurance agent servicing policyholders — submits applications, requests reinstatements, manages riders, records payments, originates conversions"
    identity: "entity_backed:InsuredPerson"
    exclusive_operations:
      - "POST /insured-persons"
      - "POST /applications"
      - "POST /applications/{id}/submit-evidence"
      - "POST /policies/{id}/premium-payments"
      - "POST /policies/{id}/mode-change"
      - "POST /policies/{id}/reinstatement-requests"
      - "POST /policies/{id}/reinstatement-requests/{rid}/payments"
      - "POST /policies/{id}/reinstatement-requests/{rid}/submit-evidence"
      - "POST /policies/{id}/riders"
      - "POST /policies/{id}/riders/{rid}/terminate"
      - "POST /policies/{id}/riders/{rid}/exercise"
      - "POST /policies/{id}/conversion-requests"
    shared_operations:
      - "GET endpoints"

  - name: Underwriter
    description: "Carrier underwriter — reviews applications, assigns underwriting class, approves reinstatements and conversions"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/begin-review"
      - "POST /applications/{id}/request-evidence"
      - "POST /applications/{id}/approve"
      - "POST /applications/{id}/decline"
      - "POST /policies/{id}/reinstatement-requests/{rid}/request-evidence"
      - "POST /policies/{id}/reinstatement-requests/{rid}/approve"
      - "POST /policies/{id}/reinstatement-requests/{rid}/decline"
      - "POST /policies/{id}/conversion-requests/{cid}/approve"
      - "POST /policies/{id}/conversion-requests/{cid}/decline"
    shared_operations:
      - "GET endpoints"

  - name: PolicyIssuer
    description: "Carrier policy-issuance specialist — final issue step (segregated from underwriter approval)"
    identity: "opaque"
    exclusive_operations:
      - "POST /applications/{id}/issue"
    shared_operations:
      - "GET endpoints"

  - name: Policyholder
    description: "Policyholder — owns the policy; can originate policy loans, choose non-forfeiture elections, set dividend option"
    identity: "entity_backed:InsuredPerson"
    exclusive_operations:
      - "POST /policies/{id}/loans"
      - "POST /policies/{id}/loans/{loanId}/repayments"
      - "POST /policies/{id}/nonforfeiture-elections"
      - "POST /policies/{id}/dividend-option"
    shared_operations:
      - "GET endpoints"
