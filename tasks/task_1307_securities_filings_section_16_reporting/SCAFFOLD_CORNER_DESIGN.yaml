            - "bal_earlier == 100 (2026-08-04 purchase sorts first chronologically)"
            - "bal_later == 150 (recomputed after the out-of-order confirmation: 100 + 50)"

      - name: six_month_window_exactly_excluded
        claim_type: threshold_boundary
        grounds: [calculations.short_swing_profit]
        distinguishing_aspect: "A sale exactly six calendar months after a purchase is NOT matchable (strict < on add_calendar_months); a sale one day earlier is matchable."
        test_recipe:
