            - { call: "POST /fleetcare/preventive-visits/${v1_id}/checklist-results", payload: { item_code: "EMERGENCY_STOP", result: "PASS" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { resolved: "$.data.checklist_resolved_count" } }
