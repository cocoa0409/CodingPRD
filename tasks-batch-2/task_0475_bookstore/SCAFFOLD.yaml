# =============================================================================
# Bookstore (Barnes & Noble / indie style) — Seed Tables (v1)
# Expert difficulty tier
# =============================================================================

scenario: |
  475. Bookstore (Barnes & Noble / indie style): title/ISBN & inventory, special
  order & print-on-demand, returns to publisher (returnable), author event/signing
  & ticketing, café & sideline, used-book buyback & credit, membership/loyalty,
  local-author consignment

domain_name: bookstore
api_prefix: /
# Flat topology: every business entity is a top-level collection (/titles, /members,
# /sales-orders, /author-events, ...) linked by foreign keys, so the shared API prefix
# is the root. Single-resource reads take the form /<collection>/{id}.

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer business entities (Title, Member, AuthorEvent, ConsignmentAgreement, …)
  # linked by foreign keys, not nested URL ownership. Line-items (OrderLine,
  # BuybackLine, EventTicket, ConsignmentCopy) hang off their owners by FK.

  state_machine_shape: parallel
  # SalesOrder carries two independent axes (payment_status × fulfillment_status);
  # SpecialOrder has a revision cycle; PublisherReturn is a guarded branch.

  relationship_patterns:
    - one_to_many        # Title -> StockItem copies; SalesOrder -> OrderLine; AuthorEvent -> EventTicket
    - cross_aggregate    # OrderLine references Title; BuybackLine references Title; ConsignmentCopy references Title + Member

  role_model: peer_roles
  # Customer/Member acts on own orders/tickets/buybacks; Bookseller runs the floor
  # (inventory, special orders, buyback intake, event check-in); InventoryManager
  # owns publisher returns + consignment settlement; StoreAdmin is the operator superset.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  # ---- Catalog / inventory --------------------------------------------------
  - name: Title
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: isbn13, type: string, source: input, description: "13-digit ISBN; unique across catalog", constraints: "exactly 13 digits; unique" }
      - { name: name, type: string, source: input, description: "Title display name" }
      - { name: category, type: enum, source: input, description: "BOOK | CAFE | SIDELINE", default: "BOOK", constraints: "BOOK|CAFE|SIDELINE" }
      - { name: list_price_cents, type: integer, source: input, description: "Publisher list price in cents", constraints: ">= 0" }
      - { name: returnable, type: boolean, source: input, description: "True if copies may be returned to publisher for credit", default: true }
      - { name: demand_flag, type: enum, source: input, description: "HIGH | NORMAL — drives buyback demand bonus and event ticket pricing", default: "NORMAL", constraints: "HIGH|NORMAL" }
      - { name: pod_eligible, type: boolean, source: input, description: "True if title can be print-on-demand fulfilled", default: false }
      - { name: on_hand_qty, type: integer, source: computed, description: "Count of StockItem rows in AVAILABLE state for this title" }
      - { name: reserved_qty, type: integer, source: computed, description: "Count of StockItem rows in RESERVED state for this title" }
      - { name: status, type: enum, source: system, description: "ACTIVE | DISCONTINUED", default: "ACTIVE", constraints: "ACTIVE|DISCONTINUED" }

  - name: StockItem
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the title this physical copy stocks" }
      - { name: source, type: enum, source: input, description: "DISTRIBUTOR | BUYBACK | CONSIGNMENT — provenance of this copy", constraints: "DISTRIBUTOR|BUYBACK|CONSIGNMENT" }
      - { name: cost_cents, type: integer, source: input, description: "Acquisition cost in cents (0 for consignment until sold)", default: 0, constraints: ">= 0" }
      - { name: state, type: enum, source: system, description: "AVAILABLE | RESERVED | SOLD | RETURNED_TO_PUBLISHER", default: "AVAILABLE", constraints: "AVAILABLE|RESERVED|SOLD|RETURNED_TO_PUBLISHER" }
      - { name: reserved_order_line_id, type: string, source: system, description: "FK -> OrderLine.id; set while RESERVED, cleared otherwise" }
      - { name: consignment_copy_id, type: string, source: system, description: "FK -> ConsignmentCopy.id; set only for CONSIGNMENT-source copies" }

  # ---- Membership / credit --------------------------------------------------
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: email, type: string, source: input, description: "Login email; unique", constraints: "unique" }
      - { name: full_name, type: string, source: input, description: "Member full name" }
      - { name: tier, type: enum, source: input, description: "REGULAR | GOLD — loyalty tier; GOLD earns 2x points and 5% off", default: "REGULAR", constraints: "REGULAR|GOLD" }
      - { name: store_credit_cents, type: integer, source: computed, description: "Running store-credit balance = sum of CreditLedgerEntry.delta_cents for this member; never negative" }
      - { name: loyalty_points, type: integer, source: computed, description: "Running loyalty points = sum of finalized point awards minus redemptions" }
      - { name: is_local_author, type: boolean, source: input, description: "True if member may hold consignment agreements", default: false }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED", default: "ACTIVE", constraints: "ACTIVE|SUSPENDED" }

  - name: CreditLedgerEntry
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owner of this ledger row" }
      - { name: delta_cents, type: integer, source: system, description: "Signed store-credit change (+issue, -redeem); the only mutator of Member.store_credit_cents" }
      - { name: reason, type: enum, source: system, description: "BUYBACK | REDEMPTION | EVENT_REFUND | ADJUSTMENT — what created this row", constraints: "BUYBACK|REDEMPTION|EVENT_REFUND|ADJUSTMENT" }
      - { name: ref_id, type: string, source: system, description: "Originating entity id (BuybackTransaction / SalesOrder / EventTicket)" }

  # ---- Sales orders (parallel state) ---------------------------------------
  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the purchasing member" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PAID | REFUNDED — payment axis (independent of fulfillment)", default: "UNPAID", constraints: "UNPAID|PAID|REFUNDED" }
      - { name: fulfillment_status, type: enum, source: system, description: "OPEN | RESERVED | FULFILLED | CANCELLED — fulfillment axis (independent of payment)", default: "OPEN", constraints: "OPEN|RESERVED|FULFILLED|CANCELLED" }
      - { name: credit_redeemed_cents, type: integer, source: input, description: "Store credit the member elects to apply at checkout", default: 0, constraints: ">= 0" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum of OrderLine.line_total_cents" }
      - { name: member_discount_cents, type: integer, source: computed, description: "GOLD 5% discount on subtotal, else 0" }
      - { name: net_paid_cents, type: integer, source: computed, description: "subtotal - member_discount - credit_redeemed, floored at 0" }
      - { name: points_provisional, type: integer, source: computed, description: "Provisional loyalty points estimated at PLACED" }
      - { name: points_final, type: integer, source: computed, description: "Final loyalty points awarded at FULFILLED" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; owning order" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the title being purchased" }
      - { name: quantity, type: integer, source: input, description: "Copies requested on this line", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: computed, description: "Snapshot of Title.list_price_cents at line creation" }
      - { name: line_total_cents, type: integer, source: computed, description: "unit_price_cents * quantity" }
      - { name: reserved_qty, type: integer, source: computed, description: "Count of StockItem rows reserved against this line" }

  # ---- Special orders / print-on-demand (revision cycle) -------------------
  - name: SpecialOrder
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; requesting member" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the title to source" }
      - { name: quantity, type: integer, source: input, description: "Copies to source", constraints: ">= 1" }
      - { name: fulfillment_method, type: enum, source: input, description: "DISTRIBUTOR | POD — sourcing channel", constraints: "DISTRIBUTOR|POD" }
      - { name: state, type: enum, source: system, description: "DRAFT | QUOTED | CONFIRMED | RECEIVED | CANCELLED — QUOTED->DRAFT is a revision loop", default: "DRAFT", constraints: "DRAFT|QUOTED|CONFIRMED|RECEIVED|CANCELLED" }
      - { name: quoted_unit_cents, type: integer, source: computed, description: "Per-copy quoted price set at QUOTE" }
      - { name: promised_eta, type: datetime, source: computed, description: "Promised arrival timestamp computed at QUOTE per fulfillment_method" }
      - { name: revision_count, type: integer, source: system, description: "Number of QUOTED->DRAFT revision loops taken", default: 0 }

  # ---- Returns to publisher (guarded branch) -------------------------------
  - name: PublisherReturn
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; title being returned" }
      - { name: quantity, type: integer, source: input, description: "Copies to return to publisher", constraints: ">= 1" }
      - { name: state, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED — branch on publisher decision", default: "DRAFT", constraints: "DRAFT|SUBMITTED|ACCEPTED|REJECTED" }
      - { name: credit_unit_cents, type: integer, source: computed, description: "Per-copy publisher credit snapshot taken at SUBMIT" }
      - { name: credit_total_cents, type: integer, source: computed, description: "credit_unit_cents * quantity, realized only on ACCEPT" }

  # ---- Author events / ticketing (capacity quota) --------------------------
  - name: AuthorEvent
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; featured title" }
      - { name: name, type: string, source: input, description: "Event name" }
      - { name: starts_at, type: datetime, source: input, description: "Event start timestamp (ISO 8601 UTC)" }
      - { name: capacity, type: integer, source: input, description: "Total seats available", constraints: ">= 1" }
      - { name: base_price_cents, type: integer, source: input, description: "Base ticket price in cents", constraints: ">= 0" }
      - { name: tickets_sold, type: integer, source: computed, description: "Count of EventTicket rows in BOOKED state" }
      - { name: state, type: enum, source: system, description: "SCHEDULED | CANCELLED — cancelling refunds all booked tickets", default: "SCHEDULED", constraints: "SCHEDULED|CANCELLED" }

  - name: EventTicket
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: event_id, type: string, source: input, description: "FK -> AuthorEvent.id; the event ticketed" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; ticket holder" }
      - { name: price_paid_cents, type: integer, source: computed, description: "Price charged at booking (base, +HIGH-demand surcharge, -GOLD member discount)" }
      - { name: state, type: enum, source: system, description: "BOOKED | CHECKED_IN | REFUNDED — booked seat lifecycle", default: "BOOKED", constraints: "BOOKED|CHECKED_IN|REFUNDED" }

  # ---- Used-book buyback ----------------------------------------------------
  - name: BuybackTransaction
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member selling used books" }
      - { name: state, type: enum, source: system, description: "PENDING | OFFERED | COMPLETED | VOIDED", default: "PENDING", constraints: "PENDING|OFFERED|COMPLETED|VOIDED" }
      - { name: offer_total_cents, type: integer, source: computed, description: "Total store-credit offer computed at OFFER (per-line-then-sum)" }

  - name: BuybackLine
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: buyback_id, type: string, source: input, description: "FK -> BuybackTransaction.id; owning transaction" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the used title offered" }
      - { name: condition_grade, type: enum, source: input, description: "LIKE_NEW | GOOD | FAIR — drives the grade multiplier", constraints: "LIKE_NEW|GOOD|FAIR" }
      - { name: quantity, type: integer, source: input, description: "Copies of this title in this line", constraints: ">= 1" }
      - { name: line_offer_cents, type: integer, source: computed, description: "Per-line offer = round_half_up(list*rate*grade) * quantity, set at OFFER" }

  # ---- Local-author consignment (settlement ledger) ------------------------
  - name: ConsignmentAgreement
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: author_member_id, type: string, source: input, description: "FK -> Member.id; the local author (must have is_local_author=true)" }
      - { name: title_id, type: string, source: input, description: "FK -> Title.id; the consigned title" }
      - { name: units_sold_to_date, type: integer, source: computed, description: "Count of ConsignmentCopy rows in SOLD state for this agreement; drives commission tier" }
      - { name: total_payout_cents, type: integer, source: computed, description: "Sum of payout_cents over SOLD copies; equals sum of related CreditLedgerEntry? No — paid by check, tracked here" }
      - { name: state, type: enum, source: system, description: "ACTIVE | TERMINATED — TERMINATED blocks new copies and new sales", default: "ACTIVE", constraints: "ACTIVE|TERMINATED" }

  - name: ConsignmentCopy
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: agreement_id, type: string, source: input, description: "FK -> ConsignmentAgreement.id; owning agreement" }
      - { name: sale_price_cents, type: integer, source: input, description: "Shelf price for this copy", constraints: ">= 0" }
      - { name: state, type: enum, source: system, description: "ON_SHELF | SOLD | RETURNED_TO_AUTHOR — copy lifecycle", default: "ON_SHELF", constraints: "ON_SHELF|SOLD|RETURNED_TO_AUTHOR" }
      - { name: payout_cents, type: integer, source: computed, description: "Author payout realized when SOLD; commission-tier dependent" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  # ---- SalesOrder: PARALLEL dimensions (payment × fulfillment) -------------
  - entity: SalesOrder
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    note: "Payment axis evolves independently of fulfillment axis (parallel dimensions)."
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /sales-orders/{id}/pay"
        actor: Member
        preconditions:
          - "SalesOrder.payment_status == UNPAID"
          - "SalesOrder has >= 1 OrderLine"
          - "credit_redeemed_cents <= Member.store_credit_cents (enough credit balance)"
        side_effects:
          - "Recompute subtotal_cents, member_discount_cents, net_paid_cents (calc order_pricing)"
          - "Compute points_provisional (calc loyalty_points, provisional variant)"
          - "If credit_redeemed_cents > 0: append CreditLedgerEntry{reason=REDEMPTION, delta_cents = -credit_redeemed_cents}; recompute Member.store_credit_cents"
          - "increments SalesOrder.version by 1"
      - from: PAID
        to: REFUNDED
        trigger: "POST /sales-orders/{id}/refund"
        actor: Bookseller
        preconditions:
          - "SalesOrder.payment_status == PAID"
          - "SalesOrder.fulfillment_status != FULFILLED"
        side_effects:
          - "If credit_redeemed_cents > 0: append CreditLedgerEntry{reason=ADJUSTMENT, delta_cents = +credit_redeemed_cents} (restore redeemed credit); recompute Member.store_credit_cents"
          - "Set fulfillment_status = CANCELLED (cascade onto fulfillment axis); release every RESERVED StockItem on this order's lines back to AVAILABLE"
          - "increments SalesOrder.version by 1"

  - entity: SalesOrder
    field: fulfillment_status
    initial_state: OPEN
    terminal_states: [FULFILLED, CANCELLED]
    note: "Fulfillment axis. RESERVE pulls inventory; FULFILL requires PAID on the payment axis (cross-axis guard)."
    transitions:
      - from: OPEN
        to: RESERVED
        trigger: "POST /sales-orders/{id}/reserve"
        actor: Bookseller
        preconditions:
          - "SalesOrder.fulfillment_status == OPEN"
          - "For each OrderLine: Title.on_hand_qty (AVAILABLE StockItems) >= OrderLine.quantity"
        side_effects:
          - "For each OrderLine: flip OrderLine.quantity StockItems from AVAILABLE to RESERVED (oldest created_at first), set their reserved_order_line_id"
          - "Recompute each Title.on_hand_qty and reserved_qty; recompute each OrderLine.reserved_qty"
          - "increments SalesOrder.version by 1"
      - from: RESERVED
        to: FULFILLED
        trigger: "POST /sales-orders/{id}/fulfill"
        actor: Bookseller
        preconditions:
          - "SalesOrder.fulfillment_status == RESERVED"
          - "SalesOrder.payment_status == PAID (cross-axis guard)"
        side_effects:
          - "Flip every RESERVED StockItem on this order from RESERVED to SOLD"
          - "For any SOLD StockItem with source=CONSIGNMENT: transition its ConsignmentCopy ON_SHELF->SOLD (cascade), which computes payout_cents and bumps ConsignmentAgreement.units_sold_to_date + total_payout_cents"
          - "Finalize points: compute points_final (calc loyalty_points, final variant); append nothing to credit; add points_final to Member.loyalty_points"
          - "Recompute Title.on_hand_qty/reserved_qty"
          - "increments SalesOrder.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: Member
        preconditions:
          - "SalesOrder.fulfillment_status == OPEN"
        side_effects:
          - "increments SalesOrder.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: Member
        preconditions:
          - "SalesOrder.fulfillment_status == RESERVED"
        side_effects:
          - "Release every RESERVED StockItem on this order's lines back to AVAILABLE, clear reserved_order_line_id; recompute Title.on_hand_qty/reserved_qty"
          - "increments SalesOrder.version by 1"

  # ---- SpecialOrder: CYCLIC (QUOTED -> DRAFT revision loop) ----------------
  - entity: SpecialOrder
    initial_state: DRAFT
    terminal_states: [RECEIVED, CANCELLED]
    note: "Revision cycle: a member may bounce QUOTED back to DRAFT to renegotiate, incrementing revision_count."
    transitions:
      - from: DRAFT
        to: QUOTED
        trigger: "POST /special-orders/{id}/quote"
        actor: Bookseller
        preconditions:
          - "SpecialOrder.state == DRAFT"
          - "If fulfillment_method == POD: Title.pod_eligible == true"
        side_effects:
          - "Compute quoted_unit_cents and promised_eta (calc special_order_quote, method-specific variant)"
          - "increments SpecialOrder.version by 1"
      - from: QUOTED
        to: DRAFT
        trigger: "POST /special-orders/{id}/revise"
        actor: Member
        preconditions:
          - "SpecialOrder.state == QUOTED"
          - "SpecialOrder.revision_count < 3"
        side_effects:
          - "Clear quoted_unit_cents and promised_eta"
          - "increments SpecialOrder.revision_count by 1"
          - "increments SpecialOrder.version by 1"
      - from: QUOTED
        to: CONFIRMED
        trigger: "POST /special-orders/{id}/confirm"
        actor: Member
        preconditions:
          - "SpecialOrder.state == QUOTED"
        side_effects:
          - "increments SpecialOrder.version by 1"
      - from: CONFIRMED
        to: RECEIVED
        trigger: "POST /special-orders/{id}/receive"
        actor: Bookseller
        preconditions:
          - "SpecialOrder.state == CONFIRMED"
        side_effects:
          - "Create SpecialOrder.quantity new StockItem rows for title_id in AVAILABLE state, source=DISTRIBUTOR (or POD-printed; still DISTRIBUTOR-sourced inventory), cost_cents=quoted_unit_cents"
          - "Recompute Title.on_hand_qty"
          - "increments SpecialOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: Member
        preconditions:
          - "SpecialOrder.state == DRAFT"
        side_effects:
          - "increments SpecialOrder.version by 1"
      - from: QUOTED
        to: CANCELLED
        trigger: "POST /special-orders/{id}/cancel"
        actor: Member
        preconditions:
          - "SpecialOrder.state == QUOTED"
        side_effects:
          - "increments SpecialOrder.version by 1"

  # ---- PublisherReturn: BRANCHING (ACCEPTED vs REJECTED) -------------------
  - entity: PublisherReturn
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    note: "Branch on publisher decision; only ACCEPT realizes credit and consumes inventory. Guarded by Title.returnable."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /publisher-returns/{id}/submit"
        actor: InventoryManager
        preconditions:
          - "PublisherReturn.state == DRAFT"
          - "Title.returnable == true (cross-entity guard)"
          - "Title.on_hand_qty >= PublisherReturn.quantity (enough AVAILABLE copies)"
        side_effects:
          - "Snapshot credit_unit_cents and credit_total_cents (calc return_credit)"
          - "Reserve PublisherReturn.quantity AVAILABLE StockItems by flipping them to RESERVED (oldest created_at first), reserved_order_line_id stays null"
          - "Recompute Title.on_hand_qty/reserved_qty"
          - "increments PublisherReturn.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /publisher-returns/{id}/accept"
        actor: InventoryManager
        preconditions:
          - "PublisherReturn.state == SUBMITTED"
        side_effects:
          - "Flip the PublisherReturn.quantity RESERVED StockItems (held by this return) to RETURNED_TO_PUBLISHER"
          - "Recompute Title.reserved_qty"
          - "increments PublisherReturn.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /publisher-returns/{id}/reject"
        actor: InventoryManager
        preconditions:
          - "PublisherReturn.state == SUBMITTED"
        side_effects:
          - "Release the PublisherReturn.quantity RESERVED StockItems held by this return back to AVAILABLE (compensation — no credit realized)"
          - "Zero out credit_total_cents (no credit on rejection)"
          - "Recompute Title.on_hand_qty/reserved_qty"
          - "increments PublisherReturn.version by 1"

  # ---- BuybackTransaction: linear with credit issuance --------------------
  - entity: BuybackTransaction
    initial_state: PENDING
    terminal_states: [COMPLETED, VOIDED]
    note: "Used-book buyback: offer computed at OFFER, store credit issued at COMPLETE."
    transitions:
      - from: PENDING
        to: OFFERED
        trigger: "POST /buybacks/{id}/offer"
        actor: Bookseller
        preconditions:
          - "BuybackTransaction.state == PENDING"
          - "BuybackTransaction has >= 1 BuybackLine"
        side_effects:
          - "Compute offer_total_cents (calc buyback_offer, per-line-then-sum)"
          - "increments BuybackTransaction.version by 1"
      - from: OFFERED
        to: COMPLETED
        trigger: "POST /buybacks/{id}/complete"
        actor: Bookseller
        preconditions:
          - "BuybackTransaction.state == OFFERED"
          - "Member.status == ACTIVE (cross-entity guard)"
        side_effects:
          - "For each BuybackLine: create one StockItem per quantity for its title in AVAILABLE state, source=BUYBACK, cost_cents=line offer/quantity"
          - "Append CreditLedgerEntry{reason=BUYBACK, delta_cents = +offer_total_cents}; recompute Member.store_credit_cents"
          - "Recompute affected Title.on_hand_qty"
          - "increments BuybackTransaction.version by 1"
      - from: OFFERED
        to: VOIDED
        trigger: "POST /buybacks/{id}/void"
        actor: Bookseller
        preconditions:
          - "BuybackTransaction.state == OFFERED"
        side_effects:
          - "increments BuybackTransaction.version by 1"
      - from: PENDING
        to: VOIDED
        trigger: "POST /buybacks/{id}/void"
        actor: Bookseller
        preconditions:
          - "BuybackTransaction.state == PENDING"
        side_effects:
          - "increments BuybackTransaction.version by 1"

  # ---- AuthorEvent: cancellation cascade ----------------------------------
  - entity: AuthorEvent
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    note: "Cancelling refunds all booked tickets (cascade onto EventTicket and member store credit)."
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /author-events/{id}/cancel"
        actor: Bookseller
        preconditions:
          - "AuthorEvent.state == SCHEDULED"
        side_effects:
          - "For each EventTicket in BOOKED state: transition BOOKED->REFUNDED (cascade), each appending CreditLedgerEntry{reason=EVENT_REFUND, delta_cents = +price_paid_cents} to the holder, recompute that Member.store_credit_cents"
          - "Recompute AuthorEvent.tickets_sold"
          - "increments AuthorEvent.version by 1"

  # ---- EventTicket: booked seat lifecycle ---------------------------------
  - entity: EventTicket
    initial_state: BOOKED
    terminal_states: [CHECKED_IN, REFUNDED]
    note: "Refund returns the paid amount as store credit; check-in at the event."
    transitions:
      - from: BOOKED
        to: CHECKED_IN
        trigger: "POST /event-tickets/{id}/check-in"
        actor: Bookseller
        preconditions:
          - "EventTicket.state == BOOKED"
          - "AuthorEvent.state == SCHEDULED (cross-entity guard — cannot check into a cancelled event)"
        side_effects:
          - "increments EventTicket.version by 1"
      - from: BOOKED
        to: REFUNDED
        trigger: "POST /event-tickets/{id}/refund"
        actor: Member
        preconditions:
          - "EventTicket.state == BOOKED"
        side_effects:
          - "Append CreditLedgerEntry{reason=EVENT_REFUND, delta_cents = +price_paid_cents}; recompute Member.store_credit_cents"
          - "Recompute AuthorEvent.tickets_sold"
          - "increments EventTicket.version by 1"

  # ---- ConsignmentAgreement: termination ----------------------------------
  - entity: ConsignmentAgreement
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    note: "Terminating returns all ON_SHELF copies to the author (cascade)."
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /consignment-agreements/{id}/terminate"
        actor: InventoryManager
        preconditions:
          - "ConsignmentAgreement.state == ACTIVE"
        side_effects:
          - "For each ConsignmentCopy in ON_SHELF state: transition ON_SHELF->RETURNED_TO_AUTHOR (cascade); for any backing StockItem still AVAILABLE, mark it RETURNED_TO_PUBLISHER-equivalent removal (flip to RETURNED_TO_PUBLISHER)"
          - "Recompute Title.on_hand_qty for the consigned title"
          - "increments ConsignmentAgreement.version by 1"

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reserve-stale-order
    parent_entity: SalesOrder
    write_endpoint: "POST /sales-orders/{id}/reserve"
    occ_field: "expected_sales_order_version"
    description: |
      Reserving inventory against a SalesOrder whose version has advanced since
      the client last observed it is rejected. A prior writer may have already
      paid or reserved the order (bumping its version and pulling stock), so the
      current writer's view of the order's reservation state is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: submit-stale-return
    parent_entity: PublisherReturn
    write_endpoint: "POST /publisher-returns/{id}/submit"
    occ_field: "expected_publisher_return_version"
    description: |
      Submitting a PublisherReturn whose version has advanced since the client
      last read it is rejected. Another writer may have already submitted (and
      thereby reserved the available copies and snapshotted credit), so this
      writer's view of the return is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  # (1) Buyback offer — per-line-then-sum rounding (combinatorial mode b)
  - name: buyback_offer
    trigger: "BuybackTransaction PENDING->OFFERED (POST /buybacks/{id}/offer)"
    algorithm: aggregation
    formula: |
      For each BuybackLine L on the transaction:
        rate_L   = BASE_RATE + (DEMAND_BONUS if L.title.demand_flag == HIGH else 0)
        grade_mult_L = GRADE_MULT[L.condition_grade]
        line_offer_L = round_half_up( L.title.list_price_cents * rate_L * grade_mult_L * L.quantity / L.quantity , 0)
                     # i.e. per-copy offer rounded, then * quantity:
        per_copy_L   = round_half_up( L.title.list_price_cents * rate_L * grade_mult_L , 0 )   # ROUND HERE (per line)
        line_offer_L = per_copy_L * L.quantity
      offer_total_cents = SUM over lines of line_offer_L      # SUM AFTER per-line rounding
      # ORDER IS PINNED: round each per-copy offer first, THEN multiply by quantity, THEN sum.
      # "sum raw then round once" is explicitly NOT used and yields a different total.
    input_set: "All BuybackLine rows on the transaction; condition_grade and the line's Title fields."
    constants:
      BASE_RATE: 0.30
      DEMAND_BONUS: 0.10
      GRADE_MULT: { LIKE_NEW: 1.00, GOOD: 0.70, FAIR: 0.40 }
    precision: "round_half_up to whole cents, applied per-copy before multiplying by quantity and summing"

  # (2) Order pricing + loyalty (dual-variant: provisional vs final, combinatorial mode a)
  - name: order_pricing
    trigger: "SalesOrder UNPAID->PAID (POST /sales-orders/{id}/pay)"
    algorithm: aggregation
    formula: |
      subtotal_cents        = SUM over OrderLines of (unit_price_cents * quantity)
      member_discount_cents = round_half_up(subtotal_cents * 0.05, 0) if Member.tier == GOLD else 0
      net_paid_cents        = max(0, subtotal_cents - member_discount_cents - credit_redeemed_cents)
      # Evaluation order PINNED: subtotal -> discount(from subtotal) -> subtract credit -> floor at 0.
    input_set: "All OrderLine rows on the order."
    constants:
      GOLD_DISCOUNT_RATE: 0.05
    precision: "round_half_up to whole cents on the discount; net floored at 0"

  - name: loyalty_points
    trigger: "provisional at SalesOrder UNPAID->PAID; final at fulfillment_status RESERVED->FULFILLED"
    algorithm: threshold
    formula: |
      tier_mult = 2 if Member.tier == GOLD else 1
      points_provisional = min( floor(net_paid_cents / 100) * tier_mult , MONTHLY_POINT_CAP )   # uses net_paid at PAY time
      points_final       = min( floor(net_paid_cents / 100) * tier_mult , MONTHLY_POINT_CAP )   # recomputed at FULFILL
      # The two variants diverge whenever net_paid_cents differs between PAY and FULFILL
      # (e.g. a partial line cancel between the two changes subtotal). points_final is the
      # awarded value; points_provisional is an estimate only.
    input_set: "SalesOrder.net_paid_cents and Member.tier at the moment the variant runs."
    constants:
      MONTHLY_POINT_CAP: 1000
      EARN_DIVISOR: 100
    precision: "floor on the divisor result; integer points"
    variants:
      - name: provisional
        when: "computed at UNPAID->PAID using net_paid at pay time"
        difference: "estimate stored in points_provisional; NOT added to Member.loyalty_points"
      - name: final
        when: "computed at RESERVED->FULFILLED using net_paid at fulfill time"
        difference: "stored in points_final AND added to Member.loyalty_points"

  # (3) Consignment payout — tiered commission (threshold / volume tier)
  - name: consignment_payout
    trigger: "ConsignmentCopy ON_SHELF->SOLD (cascade from SalesOrder fulfill, or POST /consignment-copies/{id}/mark-sold)"
    algorithm: threshold
    formula: |
      u = ConsignmentAgreement.units_sold_to_date   # BEFORE this copy is counted
      commission_rate = 0.40 if u < 10 else (0.35 if u < 25 else 0.30)
      payout_cents = round_half_up( ConsignmentCopy.sale_price_cents * (1 - commission_rate), 0 )
      # Tier is selected from units_sold_to_date AS OF the moment this copy sells (exclusive of this copy).
      # Boundary: the 10th unit (u==9 before) still pays the 0.40 tier; the 11th (u==10) pays 0.35.
    input_set: "ConsignmentAgreement.units_sold_to_date (exclusive of the selling copy); ConsignmentCopy.sale_price_cents."
    constants:
      TIER_1_RATE: 0.40
      TIER_2_RATE: 0.35
      TIER_3_RATE: 0.30
      TIER_2_THRESHOLD: 10
      TIER_3_THRESHOLD: 25
    precision: "round_half_up to whole cents"

  # (4) Special-order quote — dual-variant by fulfillment method
  - name: special_order_quote
    trigger: "SpecialOrder DRAFT->QUOTED (POST /special-orders/{id}/quote)"
    algorithm: forward_looking
    formula: |
      if fulfillment_method == DISTRIBUTOR:
        quoted_unit_cents = round_half_up(Title.list_price_cents * 1.00, 0)   # at list
        promised_eta      = current_clock + DISTRIBUTOR_LEAD_DAYS days
      else:  # POD
        quoted_unit_cents = round_half_up(Title.list_price_cents * POD_MARKUP, 0)
        promised_eta      = current_clock + POD_LEAD_DAYS days
    input_set: "Title.list_price_cents, fulfillment_method, logical clock."
    constants:
      DISTRIBUTOR_LEAD_DAYS: 7
      POD_LEAD_DAYS: 3
      POD_MARKUP: 1.20
    precision: "round_half_up to whole cents; eta computed against the logical clock"
    variants:
      - name: distributor
        when: "fulfillment_method == DISTRIBUTOR"
        difference: "price at list, 7-day lead"
      - name: pod
        when: "fulfillment_method == POD"
        difference: "price at 1.20x list, 3-day lead; requires Title.pod_eligible"

  # (5) Publisher return credit — list-price based
  - name: return_credit
    trigger: "PublisherReturn DRAFT->SUBMITTED (POST /publisher-returns/{id}/submit)"
    algorithm: aggregation
    formula: |
      credit_unit_cents  = round_half_up(Title.list_price_cents * PUBLISHER_CREDIT_RATE, 0)
      credit_total_cents = credit_unit_cents * PublisherReturn.quantity
    input_set: "Title.list_price_cents, PublisherReturn.quantity."
    constants:
      PUBLISHER_CREDIT_RATE: 0.50
    precision: "round_half_up to whole cents on the per-unit credit, then multiply by quantity"

  # (6) Event ticket price — surcharge + member discount
  - name: ticket_price
    trigger: "EventTicket creation (POST /author-events/{id}/tickets)"
    algorithm: aggregation
    formula: |
      surcharge = round_half_up(AuthorEvent.base_price_cents * HIGH_DEMAND_SURCHARGE, 0) if Title.demand_flag == HIGH else 0
      gross     = AuthorEvent.base_price_cents + surcharge
      discount  = round_half_up(gross * 0.05, 0) if Member.tier == GOLD else 0
      price_paid_cents = max(0, gross - discount)
      # Evaluation order PINNED: surcharge from base -> add -> discount from (base+surcharge) -> subtract.
    input_set: "AuthorEvent.base_price_cents, featured Title.demand_flag, booking Member.tier."
    constants:
      HIGH_DEMAND_SURCHARGE: 0.25
      GOLD_DISCOUNT_RATE: 0.05
    precision: "round_half_up to whole cents at each rounding step in the pinned order"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /members and POST /_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For entity_backed roles (Member), X-User-ID owns the targeted resource (order.member_id / ticket.member_id / buyback.member_id / special_order.member_id == X-User-ID)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "Member-actor endpoints operating on a specific resource"

  - priority: 4
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path id or FK body field"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "ConsignmentAgreement.author_member_id refers to a Member with is_local_author == true"
    error_id: ERR_NOT_LOCAL_AUTHOR
    http_status: 422
    applies_to: "POST /consignment-agreements"

  - priority: 7
    category: business_referential
    check: "PublisherReturn submit requires Title.returnable == true"
    error_id: ERR_TITLE_NOT_RETURNABLE
    http_status: 422
    applies_to: "POST /publisher-returns/{id}/submit"

  - priority: 8
    category: business_constraint
    check: "POD special-order quote requires the Title.pod_eligible == true"
    error_id: ERR_TITLE_NOT_POD_ELIGIBLE
    http_status: 422
    applies_to: "POST /special-orders/{id}/quote"

  - priority: 9
    category: business_constraint
    check: "isbn13 is exactly 13 digits and unique across Titles"
    error_id: ERR_DUPLICATE_ISBN
    http_status: 409
    applies_to: "POST /titles"

  - priority: 10
    category: business_constraint
    check: "SpecialOrder may not revise once revision_count has reached 3"
    error_id: ERR_REVISION_LIMIT
    http_status: 422
    applies_to: "POST /special-orders/{id}/revise"

  - priority: 11
    category: business_temporal
    check: "Booking a ticket requires AuthorEvent.starts_at to be strictly after the current clock"
    error_id: ERR_EVENT_PAST
    http_status: 422
    applies_to: "POST /author-events/{id}/tickets"

  - priority: 12
    category: business_safety
    check: "Reserve / publisher-return-submit require enough AVAILABLE StockItems for the requested quantity"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 422
    applies_to: "POST /sales-orders/{id}/reserve, POST /publisher-returns/{id}/submit"

  - priority: 13
    category: business_safety
    check: "Booking a ticket requires AuthorEvent.tickets_sold < AuthorEvent.capacity (seat available)"
    error_id: ERR_EVENT_SOLD_OUT
    http_status: 422
    applies_to: "POST /author-events/{id}/tickets"

  - priority: 14
    category: business_fiscal
    check: "credit_redeemed_cents on pay must be <= Member.store_credit_cents"
    error_id: ERR_INSUFFICIENT_CREDIT
    http_status: 422
    applies_to: "POST /sales-orders/{id}/pay"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version must equal the live parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sales-orders/{id}/reserve, POST /publisher-returns/{id}/submit"

  - priority: 16
    category: business_constraint
    check: "Required body fields present and well-typed; quantity >= 1; enum values valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/transition endpoints"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ---------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time."
    roles: [StoreAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock advanced/reset to the given instant"]

  # ---- Members --------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Register a member"
    roles: [Anonymous, StoreAdmin]
    code: 201
    input: [email, full_name, "tier?", "is_local_author?"]
    output: Member
    side_effects: ["Member created ACTIVE with store_credit_cents=0, loyalty_points=0"]

  - method: GET
    path: "/members/{id}"
    description: "Read a member, including computed store_credit_cents and loyalty_points"
    roles: [Member, Bookseller, InventoryManager, StoreAdmin]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members/{id}/credit-ledger"
    description: "List a member's CreditLedgerEntry rows (reverse-reachability for CreditLedgerEntry.member_id)"
    roles: [Member, Bookseller, InventoryManager, StoreAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: CreditLedgerEntry[]
    side_effects: []

  - method: POST
    path: "/members/{id}/credit-adjustments"
    description: "Operator adjusts a member's store credit (general business admin surface)"
    roles: [StoreAdmin]
    code: 201
    input: [delta_cents]
    output: CreditLedgerEntry
    side_effects: ["Append CreditLedgerEntry{reason=ADJUSTMENT}; recompute Member.store_credit_cents"]

  - method: POST
    path: "/members/{id}/suspend"
    description: "Suspend a member (ACTIVE->SUSPENDED); blocks buyback completion"
    roles: [StoreAdmin]
    code: 200
    input: []
    output: Member
    side_effects: ["Set Member.status = SUSPENDED; increments Member.version by 1"]

  # ---- Titles + stock -------------------------------------------------------
  - method: POST
    path: "/titles"
    description: "Create a catalog title"
    roles: [Bookseller, InventoryManager, StoreAdmin]
    code: 201
    input: [isbn13, name, "category?", list_price_cents, "returnable?", "demand_flag?", "pod_eligible?"]
    output: Title
    side_effects: ["Title created ACTIVE; on_hand_qty/reserved_qty=0"]

  - method: GET
    path: "/titles/{id}"
    description: "Read a title with computed on_hand_qty/reserved_qty"
    roles: [Member, Bookseller, InventoryManager, StoreAdmin]
    code: 200
    input: []
    output: Title
    side_effects: []

  - method: GET
    path: "/titles"
    description: "List titles (paginated, filterable)"
    roles: [Member, Bookseller, InventoryManager, StoreAdmin]
    code: 200
    input: ["category?", "demand_flag?", "limit?", "offset?"]
    output: Title[]
    side_effects: []

  - method: POST
    path: "/titles/{id}/stock-items"
    description: "Receive distributor stock for a title (creates AVAILABLE copies)"
    roles: [Bookseller, InventoryManager, StoreAdmin]
    code: 201
    input: [quantity, "cost_cents?"]
    output: StockItem
    side_effects: ["Create quantity StockItem rows source=DISTRIBUTOR, AVAILABLE; recompute Title.on_hand_qty"]

  - method: GET
    path: "/titles/{id}/stock-items"
    description: "List StockItem rows for a title (reverse-reachability for StockItem.title_id)"
    roles: [Member, Bookseller, InventoryManager, StoreAdmin]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: StockItem[]
    side_effects: []

  - method: GET
    path: "/stock-items/{id}"
    description: "Read a single StockItem"
    roles: [Bookseller, InventoryManager, StoreAdmin]
    code: 200
    input: []
    output: StockItem
    side_effects: []

  - method: GET
    path: "/stock-items"
    description: "List StockItem rows filterable by title_id / reserved_order_line_id / consignment_copy_id (reverse-reachability for those FKs)"
    roles: [Bookseller, InventoryManager, StoreAdmin]
    code: 200
    input: ["title_id?", "reserved_order_line_id?", "consignment_copy_id?", "state?", "limit?", "offset?"]
    output: StockItem[]
    side_effects: []

  # ---- Sales orders ---------------------------------------------------------
  - method: POST
    path: "/sales-orders"
    description: "Create an OPEN/UNPAID sales order for a member"
    roles: [Member, Bookseller, StoreAdmin]
    code: 201
    input: [member_id, "credit_redeemed_cents?"]
    output: SalesOrder
    side_effects: ["SalesOrder created payment_status=UNPAID, fulfillment_status=OPEN"]

  - method: GET
    path: "/sales-orders/{id}"
    description: "Read a sales order with computed pricing and points fields"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []

  - method: GET
    path: "/sales-orders"
    description: "List sales orders, filterable by member_id (reverse-reachability for SalesOrder.member_id)"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: ["member_id?", "payment_status?", "fulfillment_status?", "limit?", "offset?"]
    output: SalesOrder[]
    side_effects: []

  - method: POST
    path: "/sales-orders/{id}/lines"
    description: "Add a line to an OPEN/UNPAID order"
    roles: [Member, Bookseller, StoreAdmin]
    code: 201
    input: [title_id, quantity]
    output: OrderLine
    side_effects: ["Snapshot unit_price_cents from Title; compute line_total_cents; recompute SalesOrder.subtotal_cents"]

  - method: GET
    path: "/sales-orders/{id}/lines"
    description: "List order lines (reverse-reachability for OrderLine.order_id)"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: GET
    path: "/order-lines/{id}"
    description: "Read a single order line"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  - method: GET
    path: "/order-lines"
    description: "List order lines filterable by title_id and order_id (reverse-reachability for OrderLine.title_id and OrderLine.order_id)"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: ["title_id?", "order_id?", "limit?", "offset?"]
    output: OrderLine[]
    side_effects: []

  - method: POST
    path: "/sales-orders/{id}/pay"
    description: "Pay an order (UNPAID->PAID): prices it, redeems credit, computes provisional points"
    roles: [Member, StoreAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["Recompute pricing (calc order_pricing); compute points_provisional; redeem credit ledger entry; increments SalesOrder.version by 1"]

  - method: POST
    path: "/sales-orders/{id}/reserve"
    description: "Reserve inventory for an OPEN order (OPEN->RESERVED). OCC-guarded."
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: [expected_sales_order_version]
    output: SalesOrder
    side_effects: ["Flip AVAILABLE StockItems to RESERVED oldest-first; recompute Title/OrderLine counts; increments SalesOrder.version by 1"]

  - method: POST
    path: "/sales-orders/{id}/fulfill"
    description: "Fulfill a reserved+paid order (RESERVED->FULFILLED)"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["RESERVED StockItems -> SOLD; consignment copies cascade ON_SHELF->SOLD; finalize points_final to Member.loyalty_points; increments SalesOrder.version by 1"]

  - method: POST
    path: "/sales-orders/{id}/cancel"
    description: "Cancel an OPEN or RESERVED order"
    roles: [Member, StoreAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["Release any RESERVED stock back to AVAILABLE; fulfillment_status=CANCELLED; increments SalesOrder.version by 1"]

  - method: POST
    path: "/sales-orders/{id}/refund"
    description: "Refund a paid, not-yet-fulfilled order (PAID->REFUNDED)"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["Restore redeemed credit; cascade fulfillment_status=CANCELLED; release stock; increments SalesOrder.version by 1"]

  # ---- Special orders -------------------------------------------------------
  - method: POST
    path: "/special-orders"
    description: "Create a DRAFT special order"
    roles: [Member, Bookseller, StoreAdmin]
    code: 201
    input: [member_id, title_id, quantity, fulfillment_method]
    output: SpecialOrder
    side_effects: ["SpecialOrder created DRAFT, revision_count=0"]

  - method: GET
    path: "/special-orders/{id}"
    description: "Read a special order"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: []

  - method: GET
    path: "/special-orders"
    description: "List special orders filterable by member_id and title_id (reverse-reachability for both FKs)"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: ["member_id?", "title_id?", "state?", "limit?", "offset?"]
    output: SpecialOrder[]
    side_effects: []

  - method: POST
    path: "/special-orders/{id}/quote"
    description: "Quote a DRAFT special order (DRAFT->QUOTED)"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["Compute quoted_unit_cents and promised_eta (calc special_order_quote); increments SpecialOrder.version by 1"]

  - method: POST
    path: "/special-orders/{id}/revise"
    description: "Bounce a QUOTED order back to DRAFT (QUOTED->DRAFT), incrementing revision_count"
    roles: [Member, StoreAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["Clear quote fields; increments revision_count and version by 1"]

  - method: POST
    path: "/special-orders/{id}/confirm"
    description: "Confirm a QUOTED order (QUOTED->CONFIRMED)"
    roles: [Member, StoreAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["increments SpecialOrder.version by 1"]

  - method: POST
    path: "/special-orders/{id}/receive"
    description: "Receive a CONFIRMED order's stock (CONFIRMED->RECEIVED)"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["Create quantity AVAILABLE StockItems; recompute Title.on_hand_qty; increments SpecialOrder.version by 1"]

  - method: POST
    path: "/special-orders/{id}/cancel"
    description: "Cancel a DRAFT or QUOTED special order"
    roles: [Member, StoreAdmin]
    code: 200
    input: []
    output: SpecialOrder
    side_effects: ["increments SpecialOrder.version by 1"]

  # ---- Publisher returns ----------------------------------------------------
  - method: POST
    path: "/publisher-returns"
    description: "Create a DRAFT publisher return"
    roles: [InventoryManager, StoreAdmin]
    code: 201
    input: [title_id, quantity]
    output: PublisherReturn
    side_effects: ["PublisherReturn created DRAFT"]

  - method: GET
    path: "/publisher-returns/{id}"
    description: "Read a publisher return"
    roles: [InventoryManager, StoreAdmin]
    code: 200
    input: []
    output: PublisherReturn
    side_effects: []

  - method: GET
    path: "/publisher-returns"
    description: "List publisher returns filterable by title_id (reverse-reachability for PublisherReturn.title_id)"
    roles: [InventoryManager, StoreAdmin]
    code: 200
    input: ["title_id?", "state?", "limit?", "offset?"]
    output: PublisherReturn[]
    side_effects: []

  - method: POST
    path: "/publisher-returns/{id}/submit"
    description: "Submit a return (DRAFT->SUBMITTED). OCC-guarded; reserves copies and snapshots credit."
    roles: [InventoryManager, StoreAdmin]
    code: 200
    input: [expected_publisher_return_version]
    output: PublisherReturn
    side_effects: ["Snapshot credit (calc return_credit); reserve copies; recompute Title counts; increments PublisherReturn.version by 1"]

  - method: POST
    path: "/publisher-returns/{id}/accept"
    description: "Publisher accepts (SUBMITTED->ACCEPTED): copies leave inventory permanently"
    roles: [InventoryManager, StoreAdmin]
    code: 200
    input: []
    output: PublisherReturn
    side_effects: ["RESERVED copies -> RETURNED_TO_PUBLISHER; increments PublisherReturn.version by 1"]

  - method: POST
    path: "/publisher-returns/{id}/reject"
    description: "Publisher rejects (SUBMITTED->REJECTED): reserved copies released, no credit"
    roles: [InventoryManager, StoreAdmin]
    code: 200
    input: []
    output: PublisherReturn
    side_effects: ["RESERVED copies -> AVAILABLE; credit_total_cents zeroed; recompute Title counts; increments PublisherReturn.version by 1"]

  # ---- Buybacks -------------------------------------------------------------
  - method: POST
    path: "/buybacks"
    description: "Create a PENDING buyback transaction for a member"
    roles: [Bookseller, StoreAdmin]
    code: 201
    input: [member_id]
    output: BuybackTransaction
    side_effects: ["BuybackTransaction created PENDING"]

  - method: GET
    path: "/buybacks/{id}"
    description: "Read a buyback transaction"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: []
    output: BuybackTransaction
    side_effects: []

  - method: GET
    path: "/buybacks"
    description: "List buyback transactions filterable by member_id (reverse-reachability for BuybackTransaction.member_id)"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: ["member_id?", "state?", "limit?", "offset?"]
    output: BuybackTransaction[]
    side_effects: []

  - method: POST
    path: "/buybacks/{id}/lines"
    description: "Add a line (title + grade + quantity) to a PENDING buyback"
    roles: [Bookseller, StoreAdmin]
    code: 201
    input: [title_id, condition_grade, quantity]
    output: BuybackLine
    side_effects: ["BuybackLine created"]

  - method: GET
    path: "/buybacks/{id}/lines"
    description: "List buyback lines (reverse-reachability for BuybackLine.buyback_id)"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: BuybackLine[]
    side_effects: []

  - method: GET
    path: "/buyback-lines/{id}"
    description: "Read a single buyback line"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: BuybackLine
    side_effects: []

  - method: GET
    path: "/buyback-lines"
    description: "List buyback lines filterable by title_id and buyback_id (reverse-reachability for BuybackLine.title_id and BuybackLine.buyback_id)"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: ["title_id?", "buyback_id?", "limit?", "offset?"]
    output: BuybackLine[]
    side_effects: []

  - method: POST
    path: "/buybacks/{id}/offer"
    description: "Compute the offer (PENDING->OFFERED)"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: BuybackTransaction
    side_effects: ["Compute offer_total_cents (calc buyback_offer); increments BuybackTransaction.version by 1"]

  - method: POST
    path: "/buybacks/{id}/complete"
    description: "Accept the offer (OFFERED->COMPLETED): create stock and issue store credit"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: BuybackTransaction
    side_effects: ["Create BUYBACK StockItems; append BUYBACK credit ledger entry; recompute Member.store_credit_cents and Title counts; increments BuybackTransaction.version by 1"]

  - method: POST
    path: "/buybacks/{id}/void"
    description: "Void a PENDING or OFFERED buyback"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: BuybackTransaction
    side_effects: ["increments BuybackTransaction.version by 1"]

  # ---- Author events + tickets ----------------------------------------------
  - method: POST
    path: "/author-events"
    description: "Schedule an author event for a title"
    roles: [Bookseller, StoreAdmin]
    code: 201
    input: [title_id, name, starts_at, capacity, base_price_cents]
    output: AuthorEvent
    side_effects: ["AuthorEvent created SCHEDULED, tickets_sold=0"]

  - method: GET
    path: "/author-events/{id}"
    description: "Read an author event with computed tickets_sold"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: []
    output: AuthorEvent
    side_effects: []

  - method: GET
    path: "/author-events"
    description: "List author events filterable by title_id (reverse-reachability for AuthorEvent.title_id)"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: ["title_id?", "state?", "limit?", "offset?"]
    output: AuthorEvent[]
    side_effects: []

  - method: POST
    path: "/author-events/{id}/tickets"
    description: "Book a ticket for a member (creates BOOKED EventTicket)"
    roles: [Member, Bookseller, StoreAdmin]
    code: 201
    input: [member_id]
    output: EventTicket
    side_effects: ["Compute price_paid_cents (calc ticket_price); recompute AuthorEvent.tickets_sold"]

  - method: GET
    path: "/author-events/{id}/tickets"
    description: "List tickets for an event (reverse-reachability for EventTicket.event_id)"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: EventTicket[]
    side_effects: []

  - method: GET
    path: "/event-tickets/{id}"
    description: "Read a single event ticket"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: []
    output: EventTicket
    side_effects: []

  - method: GET
    path: "/event-tickets"
    description: "List tickets filterable by member_id and event_id (reverse-reachability for EventTicket.member_id and EventTicket.event_id)"
    roles: [Member, Bookseller, StoreAdmin]
    code: 200
    input: ["member_id?", "event_id?", "state?", "limit?", "offset?"]
    output: EventTicket[]
    side_effects: []

  - method: POST
    path: "/event-tickets/{id}/check-in"
    description: "Check a booked ticket in at the event (BOOKED->CHECKED_IN)"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: EventTicket
    side_effects: ["increments EventTicket.version by 1"]

  - method: POST
    path: "/event-tickets/{id}/refund"
    description: "Refund a booked ticket to store credit (BOOKED->REFUNDED)"
    roles: [Member, StoreAdmin]
    code: 200
    input: []
    output: EventTicket
    side_effects: ["Append EVENT_REFUND credit ledger entry; recompute Member.store_credit_cents; recompute AuthorEvent.tickets_sold; increments EventTicket.version by 1"]

  - method: POST
    path: "/author-events/{id}/cancel"
    description: "Cancel an event (SCHEDULED->CANCELLED): refund all booked tickets"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: AuthorEvent
    side_effects: ["Cascade BOOKED tickets -> REFUNDED with EVENT_REFUND credit; recompute tickets_sold; increments AuthorEvent.version by 1"]

  # ---- Consignment ----------------------------------------------------------
  - method: POST
    path: "/consignment-agreements"
    description: "Create an ACTIVE consignment agreement with a local author"
    roles: [InventoryManager, StoreAdmin]
    code: 201
    input: [author_member_id, title_id]
    output: ConsignmentAgreement
    side_effects: ["ConsignmentAgreement created ACTIVE; counters at 0"]

  - method: GET
    path: "/consignment-agreements/{id}"
    description: "Read a consignment agreement with computed counters"
    roles: [Member, InventoryManager, StoreAdmin]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: []

  - method: GET
    path: "/consignment-agreements"
    description: "List agreements filterable by author_member_id and title_id (reverse-reachability for both FKs)"
    roles: [Member, InventoryManager, StoreAdmin]
    code: 200
    input: ["author_member_id?", "title_id?", "state?", "limit?", "offset?"]
    output: ConsignmentAgreement[]
    side_effects: []

  - method: POST
    path: "/consignment-agreements/{id}/copies"
    description: "Shelve a consigned copy (creates ON_SHELF ConsignmentCopy + backing AVAILABLE CONSIGNMENT StockItem)"
    roles: [InventoryManager, StoreAdmin]
    code: 201
    input: [sale_price_cents]
    output: ConsignmentCopy
    side_effects: ["Create ConsignmentCopy ON_SHELF and a StockItem source=CONSIGNMENT AVAILABLE linked via consignment_copy_id; recompute Title.on_hand_qty"]

  - method: GET
    path: "/consignment-agreements/{id}/copies"
    description: "List copies for an agreement (reverse-reachability for ConsignmentCopy.agreement_id)"
    roles: [Member, InventoryManager, StoreAdmin]
    code: 200
    input: ["state?", "limit?", "offset?"]
    output: ConsignmentCopy[]
    side_effects: []

  - method: POST
    path: "/consignment-copies/{id}/mark-sold"
    description: "Directly mark an ON_SHELF consigned copy SOLD (ON_SHELF->SOLD), computing payout"
    roles: [Bookseller, StoreAdmin]
    code: 200
    input: []
    output: ConsignmentCopy
    side_effects: ["Compute payout_cents (calc consignment_payout); bump agreement counters; flip backing StockItem to SOLD; recompute Title.on_hand_qty"]

  - method: POST
    path: "/consignment-agreements/{id}/terminate"
    description: "Terminate an agreement (ACTIVE->TERMINATED): return ON_SHELF copies to author"
    roles: [InventoryManager, StoreAdmin]
    code: 200
    input: []
    output: ConsignmentAgreement
    side_effects: ["Cascade ON_SHELF copies -> RETURNED_TO_AUTHOR; remove backing StockItems; recompute Title.on_hand_qty; increments ConsignmentAgreement.version by 1"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID header" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Member acts on a resource whose member_id is not their X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or FK-referenced resource does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested transition not defined from the resource's current state" }
  - { id: ERR_DUPLICATE_ISBN, http: 409, condition: "isbn13 already exists on another Title" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the live parent version (OCC)" }
  - { id: ERR_NOT_LOCAL_AUTHOR, http: 422, condition: "Consignment agreement author_member_id is not a Member with is_local_author=true" }
  - { id: ERR_TITLE_NOT_RETURNABLE, http: 422, condition: "Publisher return submitted for a Title with returnable=false" }
  - { id: ERR_TITLE_NOT_POD_ELIGIBLE, http: 422, condition: "POD special-order quote on a Title with pod_eligible=false" }
  - { id: ERR_REVISION_LIMIT, http: 422, condition: "Special order revise attempted after revision_count reached 3" }
  - { id: ERR_EVENT_PAST, http: 422, condition: "Ticket booking on an event whose starts_at is not strictly after the current clock" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 422, condition: "Not enough AVAILABLE StockItems for the requested reserve/return quantity" }
  - { id: ERR_EVENT_SOLD_OUT, http: 422, condition: "Ticket booking when tickets_sold has reached capacity" }
  - { id: ERR_INSUFFICIENT_CREDIT, http: 422, condition: "credit_redeemed_cents exceeds the member's store_credit_cents" }
  - { id: ERR_EMPTY_TRANSACTION, http: 422, condition: "Offer/pay attempted on a transaction/order with zero lines" }
  - { id: ERR_MEMBER_SUSPENDED, http: 422, condition: "Buyback complete attempted for a SUSPENDED member" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/ill-typed body field, quantity < 1, bad enum, or non-13-digit isbn13" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register"
    identity: "opaque"
    exclusive_operations: []
    shared_operations: ["POST /members"]

  - name: Member
    description: "A registered member acting on their own orders, tickets, buybacks, special orders"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /sales-orders/{id}/pay"
      - "POST /sales-orders/{id}/cancel"
      - "POST /sales-orders/{id}/refund (NO — see Bookseller)"
    shared_operations:
      - "POST /members"
      - "GET /members/{id}"
      - "POST /sales-orders, GET /sales-orders, GET /sales-orders/{id}"
      - "POST /sales-orders/{id}/lines, GET /sales-orders/{id}/lines"
      - "POST /special-orders, GET /special-orders, POST /special-orders/{id}/revise|confirm|cancel"
      - "POST /author-events/{id}/tickets, GET /event-tickets, POST /event-tickets/{id}/refund"
      - "GET /members/{id}/credit-ledger, GET /buybacks, GET /buybacks/{id}"
      - "GET catalog/title/event/consignment read endpoints"

  - name: Bookseller
    description: "Floor staff: inventory intake, special-order quoting/receiving, buyback intake, sales reservation/fulfillment, event check-in"
    identity: "opaque"
    exclusive_operations:
      - "POST /sales-orders/{id}/reserve"
      - "POST /sales-orders/{id}/fulfill"
      - "POST /sales-orders/{id}/refund"
      - "POST /special-orders/{id}/quote, POST /special-orders/{id}/receive"
      - "POST /buybacks, POST /buybacks/{id}/lines|offer|complete|void"
      - "POST /titles/{id}/stock-items"
      - "POST /author-events, POST /author-events/{id}/cancel, POST /event-tickets/{id}/check-in"
      - "POST /consignment-copies/{id}/mark-sold"
    shared_operations:
      - "POST /titles, GET /titles, GET /titles/{id}, GET /titles/{id}/stock-items, GET /stock-items"
      - "GET sales-order/special-order/buyback/event read endpoints"

  - name: InventoryManager
    description: "Owns publisher returns and consignment lifecycle"
    identity: "opaque"
    exclusive_operations:
      - "POST /publisher-returns, POST /publisher-returns/{id}/submit|accept|reject"
      - "POST /consignment-agreements, POST /consignment-agreements/{id}/copies|terminate"
    shared_operations:
      - "POST /titles, GET /titles, GET catalog/stock/consignment reads"

  - name: StoreAdmin
    description: "Operator superset; may perform any operation including clock and credit adjustments"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /members/{id}/credit-adjustments"
    shared_operations:
      - "Every endpoint above (admin superset of Member, Bookseller, InventoryManager operations)"
