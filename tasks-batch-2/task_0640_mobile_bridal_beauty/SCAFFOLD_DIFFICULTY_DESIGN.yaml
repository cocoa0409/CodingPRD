  # =====================================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: trial_referential_beats_artist_constraint
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors[ERR_TRIAL_NOT_COMPLETED]
          - errors[ERR_ARTIST_NOT_ACTIVE]
        distinguishing_aspect: |
          On POST /contracts a request that BOTH lacks a completed trial (P7 business_referential) and
          names a SUSPENDED lead artist (P8 business_constraint) returns ERR_TRIAL_NOT_COMPLETED — the
          lower-priority-number referential check wins over the constraint check. Different category pair.
        test_recipe:
          setup:
            - "event trial_required=true with NO completed trial; lead artist SUSPENDED; event QUOTED"
          setup_api_calls:
            - call: "POST /bridal-beauty/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
