            - "after sweep past due_at (issued+48h): call EXPIRED and liquidation order created"
            - "LiquidationOrder.${lo_id}.quantity == 200  # selector takes the whole position"

      - name: withdrawal_requires_account_active_pair_cashmovement_account
        grounds:
          - state_machines.MarginAccount.ACTIVE_to_RESTRICTED
