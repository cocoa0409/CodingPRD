              payload: { name: "LOccC", airport_code: "MCO", capacity: 10, settlement_rate_cents: 1200, guest_fee_cents: 1000, day_pass_price_cents: 4000 }
              as: NetworkAdmin
              captures: { l_id: $.data.id, l_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
