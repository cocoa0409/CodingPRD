              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "CORRECTIVE_DISTRIBUTION", principal_cents: 9000, planned_execution_date: "2026-03-01", participant_id: "${p1}" }
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
