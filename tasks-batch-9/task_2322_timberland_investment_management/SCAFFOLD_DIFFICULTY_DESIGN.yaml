          - calculations.harvest_block_net_revenue
          - entities.Fund.fields.harvest_acceleration_required
        distinguishing_aspect: |
          harvest_acceleration_required uses STRICT less-than, so a fund whose realised
          cash yield rounds to exactly 317 bps against a 317 bps mandate must report
          false, while an otherwise identical fund with a 318 bps mandate must report
          true. The yield itself is 15858.07 / 500000.00 * 10000 = 317.1614 bps, which
          only lands on 317 if the bps figure is rounded half-up to 0 decimals AFTER the
          division rather than truncated or rounded at any intermediate step.
