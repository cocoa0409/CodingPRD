            - call: "GET /fire-ops/leave-requests"
              payload: { firefighter_id: "${ff135a}", status: "QUEUED" }
              as: Firefighter
              as_user_id: "${ff135a}"
              captures: { seen_leave: "$.data[0].id" }
            - call: "GET /fire-ops/trade-requests"
              payload: { duty_shift_id: "${sh135}" }
