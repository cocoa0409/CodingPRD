# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Coverage) — Task 0646
# Walks references/claim-extraction-guide.md section-by-section against §1.1–§1.7.
# section:/claim_type: values come verbatim from the guide. excluded_because stubs
# point at §1.8 instances by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_trainer_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Trainer
          - 'endpoints[POST /trainers]'
        distinguishing_aspect: "POST /trainers with full_name+email returns 201, status=ACTIVE, server-minted id, version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /trainers"
              payload: { full_name: "Alex", email: "alex@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id, t_ver: $.data.version }
          assert:
            - "Trainer.${t_id}.status == ACTIVE"
            - "Trainer.${t_id}.version == 1"

      - name: get_client_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Client
          - 'errors[ERR_CLIENT_NOT_FOUND]'
        distinguishing_aspect: "GET /clients/{id} with a non-existent UUID returns ERR_CLIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["a trainer exists; the target client id does not"]
          setup_api_calls:
            - call: "POST /trainers"
              payload: { full_name: "T", email: "tnf@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /clients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_CLIENT_NOT_FOUND"

      - name: create_client_missing_required_sex_returns_422
        claim_type: Required Fields
        grounds:
          - entities.Client.fields.sex
          - 'validations[priority=5]'
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "POST /clients omitting required field sex returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["trainer exists"]
          setup_api_calls:
            - call: "POST /trainers"
              payload: { full_name: "T", email: "treq@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "creq@x.com", birth_year: 1990, height_cm: 170 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: create_session_pack_nonpositive_total_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.SessionPack.fields.total_sessions
          - 'validations[priority=5]'
          - 'errors[ERR_INVALID_REQUEST]'
        distinguishing_aspect: "POST session-pack with total_sessions=0 violates the >0 constraint -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["ASSESSED client, SESSION_PACK engagement E ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "tzp@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "czp@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /engagements/${e_id}/session-packs"
              payload: { total_sessions: 0, price_cents: 10000 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_REQUEST"

      - name: per_session_value_computed_on_pack_create
        claim_type: Computed Fields
        grounds:
          - entities.SessionPack.fields.per_session_value_cents
          - calculations.per_session_value_cents
        distinguishing_aspect: "per_session_value_cents = round_half_up(price_cents/total_sessions); 80000/10 -> 8000, input ignored."
        test_recipe:
          setup: ["ASSESSED client, SESSION_PACK engagement E ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "tpsv@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "cpsv@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /engagements/${e_id}/session-packs"
              payload: { total_sessions: 10, price_cents: 80000 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { p_id: $.data.id }
          assert:
            - "SessionPack.${p_id}.per_session_value_cents == 8000"
            - "SessionPack.${p_id}.sessions_remaining == 10"

      - name: list_clients_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.Client
          - 'endpoints[GET /clients]'
          - response_envelope.pagination_fields
        distinguishing_aspect: "GET /clients?limit=1 returns array with total_count and has_more reflecting >1 client."
        test_recipe:
          setup: ["trainer with two clients"]
          setup_api_calls:
            - call: "POST /trainers"
              payload: { full_name: "T", email: "tlist@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C1", email: "cl1@x.com", sex: "MALE", birth_year: 1990, height_cm: 175 }
              as: Trainer
              as_user_id: "${t_id}"
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C2", email: "cl2@x.com", sex: "FEMALE", birth_year: 1991, height_cm: 165 }
              as: Trainer
              as_user_id: "${t_id}"
          trigger:
            - call: "GET /clients"
              payload: { trainer_id: "${t_id}", limit: 1, offset: 0 }
              as: Trainer
              as_user_id: "${t_id}"
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == true"

      - name: habit_log_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.HabitLog
          - 'endpoints[POST /habit-logs]'
        distinguishing_aspect: "HabitLog has common_fields:false — only id+created_at; no update endpoint and no version field exist."
        test_recipe:
          setup: ["engagement E ACTIVE with PUBLISHED program PA"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "thl@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "chl@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "ONLINE_SUBSCRIPTION", expected_client_version: "${c_ver}", monthly_fee_cents: 6000, cycle_start_utc: "2026-06-01T00:00:00Z" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /program-assignments"
              payload: { engagement_id: "${e_id}", title: "P1", planned_workouts_per_week: 4, habit_checks_target: 10 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { pa_id: $.data.id }
            - call: "POST /program-assignments/${pa_id}/publish"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /habit-logs"
              payload: { engagement_id: "${e_id}", program_assignment_id: "${pa_id}", kind: "HABIT_CHECK", logged_at: "2026-06-02T07:00:00Z" }
              as: Client
              as_user_id: "${c_id}"
              captures: { hl_id: $.data.id }
          assert:
            - "HabitLog.${hl_id}.id == ${hl_id}"
            - "response_type == object"

      - name: trainer_default_timezone_applied
        claim_type: Defaults
        grounds:
          - entities.Trainer.fields.timezone
        distinguishing_aspect: "POST /trainers without timezone applies default 'UTC'."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /trainers"
              payload: { full_name: "Dee", email: "dee@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
          assert:
            - "Trainer.${t_id}.timezone == UTC"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: assess_client_not_submitted_returns_invalid
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Client.SUBMITTED_to_ASSESSED
          - 'errors[ERR_INTAKE_NOT_SUBMITTED]'
        distinguishing_aspect: "Assessing a DRAFT (never submitted) client returns ERR_INTAKE_NOT_SUBMITTED; intake_status stays DRAFT."
        test_recipe:
          setup: ["client C in DRAFT"]
          setup_api_calls:
            - call: "POST /trainers"
              payload: { full_name: "T", email: "tas@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "cas@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INTAKE_NOT_SUBMITTED"
            - "Client.${c_id}.intake_status == DRAFT"

      - name: complete_booking_before_start_returns_not_started
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Booking.BOOKED_to_COMPLETED
          - 'errors[ERR_SESSION_NOT_STARTED]'
        distinguishing_aspect: "Completing a booking while current_clock_utc < start_utc returns ERR_SESSION_NOT_STARTED; status stays BOOKED."
        test_recipe:
          setup: ["SESSION_PACK engagement E ACTIVE; pack; one future BOOKED booking; clock before start"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "tcb@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "ccb@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/session-packs"
              payload: { total_sessions: 5, price_cents: 50000 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /bookings"
              payload: { engagement_id: "${e_id}", start_utc: "2026-06-20T10:00:00Z", end_utc: "2026-06-20T11:00:00Z", session_pack_id: "${p_id}", expected_session_pack_version: "${p_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/complete"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_SESSION_NOT_STARTED"
            - "Booking.${b_id}.status == BOOKED"

      - name: mark_no_show_before_end_returns_not_ended
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Booking.BOOKED_to_NO_SHOW
          - 'errors[ERR_SESSION_NOT_ENDED]'
        distinguishing_aspect: "mark-no-show while current_clock_utc < end_utc returns ERR_SESSION_NOT_ENDED; status stays BOOKED."
        test_recipe:
          setup: ["SESSION_PACK engagement E ACTIVE; pack; BOOKED booking; clock between start and end"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "tns@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "cns@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/session-packs"
              payload: { total_sessions: 5, price_cents: 50000 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /bookings"
              payload: { engagement_id: "${e_id}", start_utc: "2026-06-05T10:00:00Z", end_utc: "2026-06-05T11:00:00Z", session_pack_id: "${p_id}", expected_session_pack_version: "${p_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T10:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookings/${b_id}/mark-no-show"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_SESSION_NOT_ENDED"
            - "Booking.${b_id}.status == BOOKED"

      - name: cancel_already_cancelled_booking_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Booking.BOOKED_to_CANCELLED
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Cancelling an already-CANCELLED booking returns ERR_INVALID_STATE; no double seat release."
        test_recipe:
          setup: ["SESSION_PACK engagement E ACTIVE; pack total 5; one CANCELLED booking"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "tcc@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "ccc@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "SESSION_PACK", expected_client_version: "${c_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /engagements/${e_id}/session-packs"
              payload: { total_sessions: 5, price_cents: 50000 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { p_id: $.data.id, p_ver: $.data.version }
            - call: "POST /bookings"
              payload: { engagement_id: "${e_id}", start_utc: "2026-06-20T10:00:00Z", end_utc: "2026-06-20T11:00:00Z", session_pack_id: "${p_id}", expected_session_pack_version: "${p_ver}" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_INVALID_STATE"
            - "SessionPack.${p_id}.sessions_remaining == 5"

      - name: reschedule_within_24h_returns_too_late
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Booking.BOOKED_to_RESCHEDULED
          - 'errors[ERR_RESCHEDULE_TOO_LATE]'
        distinguishing_aspect: "Rescheduling a booking starting < NO_SHOW_CUTOFF_SECONDS away returns ERR_RESCHEDULE_TOO_LATE; status stays BOOKED."
        test_recipe:
          setup: ["ONLINE_SUBSCRIPTION engagement E ACTIVE; booking starting 12h from clock"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /trainers"
              payload: { full_name: "T", email: "trtl@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /clients"
              payload: { trainer_id: "${t_id}", full_name: "C", email: "crtl@x.com", sex: "MALE", birth_year: 1992, height_cm: 178 }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/submit-intake"
              payload: {}
              as: Client
              as_user_id: "${c_id}"
            - call: "POST /clients/${c_id}/assess"
              payload: {}
              as: Trainer
              as_user_id: "${t_id}"
              captures: { c_ver: $.data.version }
            - call: "POST /engagements"
              payload: { client_id: "${c_id}", billing_model: "ONLINE_SUBSCRIPTION", expected_client_version: "${c_ver}", monthly_fee_cents: 6000, cycle_start_utc: "2026-06-05T00:00:00Z" }
              as: Trainer
              as_user_id: "${t_id}"
              captures: { e_id: $.data.id }
            - call: "POST /bookings"
              payload: { engagement_id: "${e_id}", start_utc: "2026-06-05T12:00:00Z", end_utc: "2026-06-05T13:00:00Z" }
              as: Client
              as_user_id: "${c_id}"
              captures: { b_id: $.data.id }
          trigger:
            - call: "POST /bookings/${b_id}/reschedule"
              payload: { start_utc: "2026-06-10T12:00:00Z", end_utc: "2026-06-10T13:00:00Z" }
              as: Client
              as_user_id: "${c_id}"
              captures: { err: $.data.error_id }
          assert:
            - "$.data.error_id == ERR_RESCHEDULE_TOO_LATE"
            - "Booking.${b_id}.status == BOOKED"

      - name: resume_active_engagement_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Engagement.PAUSED_to_ACTIVE
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "Resuming an already-ACTIVE engagement returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["ONLINE_SUBSCRIPTION engagement E ACTIVE (never paused)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
