scenario: "generate task hard than expert level! 1265. New Hire Onboarding & System Provisioning (HR onboarding team): pre-boarding task checklist & document collection, background/reference clearance gate, equipment & access provisioning by role profile, day-one orientation scheduling & compliance training assignment, buddy/manager check-in cadence, probation period milestone & evaluation, data flow to payroll/benefits enrollment, onboarding experience survey & time-to-productivity"

domain_name: new-hire-onboarding
api_prefix: /api

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_deferred_actions
    - optimistic_concurrency
  entity_topology: flat            # peer entities joined by FK references; filtered-list / sub-resource GETs
  state_machine_shape: cyclic      # task rework loop, case health ON_TRACK<->AT_RISK, probation extension regeneration
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential             # Employee.manager_id -> Employee.id
  role_model: segregation_of_duties  # clearance initiator may not adjudicate; owner-scoped NewHire/Buddy/HiringManager ops
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: RoleProfile
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human-readable profile name (e.g. 'Software Engineer')" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED" , default: DRAFT }
      - { name: published_version, type: integer, source: system, description: "Starts 0; increments by 1 on every publish; cases pin the value current at case creation" }
      - { name: preboarding_tasks, type: array, source: input, description: "Template of checklist tasks: [{task_kind: DOCUMENT_UPLOAD|FORM_ACK|POLICY_READ, title, is_required}]" }
      - { name: training_modules, type: array, source: input, description: "Compliance training template: [{module_code, due_offset_days}]" }
      - { name: equipment_items, type: array, source: input, description: "Equipment template: [{item_name, quantity}]" }
      - { name: access_grants, type: array, source: input, description: "Access template: [{system_name, permission_level}]" }
      - { name: probation_days, type: integer, source: input, description: "Days from start_date to first probation evaluation due" }
      - { name: max_probation_extensions, type: integer, source: input, description: "How many EXTEND outcomes are allowed: cycle k may extend iff k <= this" }
      - { name: extension_days, type: integer, source: input, description: "Days added to evaluation_due_at for each extension cycle" }
      - { name: buddy_checkin_interval_days, type: integer, source: input, description: "Days between buddy check-ins" }
      - { name: buddy_checkin_count, type: integer, source: input, description: "Number of buddy check-ins generated" }
      - { name: manager_checkin_offsets_days, type: array, source: input, description: "Manager check-in day offsets from start_date, ascending" }
      - { name: provisioning_sla_hours, type: integer, source: input, description: "SLA for order fulfillment measured from submitted_at" }

  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Employee display name" }
      - { name: email, type: string, source: input, description: "Work email (informational; no uniqueness rule)" }
      - { name: employment_status, type: enum, source: system, description: "ACTIVE | INACTIVE", default: ACTIVE }
      - { name: manager_id, type: string, source: input, description: "FK -> Employee.id; nullable org-chart manager" }

  - name: NewHire
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "New hire legal name" }
      - { name: personal_email, type: string, source: input, description: "Contact email (informational; no uniqueness rule)" }
      - { name: start_date, type: string, source: input, description: "Agreed start date, ISO date YYYY-MM-DD" }
      - { name: department, type: string, source: input, description: "Department name" }
      - { name: status, type: enum, source: system, description: "REGISTERED | EMPLOYED | RESCINDED | SEPARATED", default: REGISTERED }

  - name: OnboardingCase
    parent: null
    common_fields: true
    fields:
      - { name: new_hire_id, type: string, source: input, description: "FK -> NewHire.id; at most one non-terminal case per new hire" }
      - { name: role_profile_id, type: string, source: input, description: "FK -> RoleProfile.id; must be PUBLISHED at creation" }
      - { name: pinned_profile_version, type: integer, source: system, description: "RoleProfile.published_version pinned at case creation; drives all generated content" }
      - { name: manager_id, type: string, source: input, description: "FK -> Employee.id; hiring manager" }
      - { name: buddy_id, type: string, source: input, description: "FK -> Employee.id; onboarding buddy; must differ from manager_id" }
      - { name: start_date, type: string, source: input, description: "Day-one date YYYY-MM-DD; must be >= current logical date at creation" }
      - { name: base_salary_cents, type: integer, source: input, description: "Per-pay-period base salary in cents" }
      - { name: signing_bonus_cents, type: integer, source: input, description: "One-time signing bonus in cents", default: 0 }
      - { name: relocation_stipend_cents, type: integer, source: input, description: "One-time relocation stipend in cents", default: 0 }
      - { name: benefits_tier, type: enum, source: input, description: "STANDARD | PLUS | PREMIUM" }
      - { name: phase, type: enum, source: system, description: "PRE_BOARDING | CLEARANCE_IN_PROGRESS | PROVISIONING | DAY_ONE_READY | IN_PROGRESS | PROBATION | COMPLETED | WITHDRAWN | REVOKED | SEPARATED" }
      - { name: health, type: enum, source: system, description: "ON_TRACK | AT_RISK; derived: AT_RISK iff health_score < 70 (parallel state dimension)" }
      - { name: health_score, type: integer, source: computed, description: "See calculations.case_health_score; recomputed on every relevant mutation and on read" }
      - { name: orientation_session_id, type: string, source: system, description: "FK -> OrientationSession.id; nullable; set by orientation booking" }
      - { name: orientation_rsvp, type: enum, source: system, description: "NONE | BOOKED | ATTENDED | NO_SHOW | SESSION_CANCELLED", default: NONE }
      - { name: manager_reassignment_required, type: boolean, source: system, description: "Set true when the manager Employee is deactivated; cleared by reassign-manager", default: false }

  - name: OnboardingTask
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> OnboardingCase.id" }
      - { name: task_kind, type: enum, source: system, description: "DOCUMENT_UPLOAD | FORM_ACK | POLICY_READ (from profile template)" }
      - { name: title, type: string, source: system, description: "Task title from profile template" }
      - { name: is_required, type: boolean, source: system, description: "Required tasks gate submit-for-clearance and cannot be waived" }
      - { name: status, type: enum, source: system, description: "PENDING | SUBMITTED | APPROVED | REJECTED | WAIVED | CANCELLED" }
      - { name: document_ref, type: string, source: input, description: "Document reference; required on submit when task_kind == DOCUMENT_UPLOAD" }
      - { name: note, type: string, source: input, description: "Optional submission note" }
      - { name: review_note, type: string, source: input, description: "Reviewer note on approve/reject" }
      - { name: reject_count, type: integer, source: system, description: "Increments by 1 on each REJECTED transition", default: 0 }
      - { name: due_at, type: datetime, source: system, description: "start_dateT23:59:59Z of the owning case" }
      - { name: sort_index, type: integer, source: system, description: "Template order; list ordering key (ASC)" }

  - name: ClearanceCase
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> OnboardingCase.id; 1:1, created by submit-for-clearance" }
      - { name: status, type: enum, source: system, description: "IN_PROGRESS | ESCALATED | CLEARED | REJECTED | CANCELLED" }
      - { name: background_status, type: enum, source: system, description: "PENDING | PASSED | FAILED" }
      - { name: reference_status, type: enum, source: system, description: "PENDING | PASSED | FAILED" }
      - { name: initiated_by_user_id, type: string, source: system, description: "X-User-ID of the HRAdmin who submitted for clearance; segregation-of-duties anchor" }
      - { name: adjudicated_by_user_id, type: string, source: system, description: "X-User-ID of adjudicator; nullable" }
      - { name: adjudication_rationale, type: string, source: input, description: "Required rationale recorded at adjudication" }
      - { name: override_clear, type: boolean, source: system, description: "True when CLEARED via adjudication override despite a FAILED component", default: false }

  - name: ProvisioningOrder
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> OnboardingCase.id; 1:1, created on phase entry to PROVISIONING" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | IN_PROGRESS | ATTENTION_REQUIRED | FULFILLED | CANCELLED (compound over items)" }
      - { name: pinned_profile_version, type: integer, source: system, description: "Copied from owning case at creation" }
      - { name: sla_hours, type: integer, source: system, description: "Copied from pinned RoleProfile.provisioning_sla_hours" }
      - { name: submitted_at, type: datetime, source: system, description: "Set on DRAFT -> SUBMITTED" }
      - { name: fulfilled_at, type: datetime, source: system, description: "Set on transition to FULFILLED; null while unfulfilled" }
      - { name: elapsed_calendar_hours, type: number, source: computed, description: "Hours from submitted_at to min(now, fulfilled_at); 0 before submit" }
      - { name: elapsed_business_hours, type: number, source: computed, description: "Same interval excluding hours whose UTC weekday is Saturday/Sunday" }
      - { name: sla_breached_calendar, type: boolean, source: computed, description: "elapsed_calendar_hours > sla_hours (strictly greater; equality is NOT a breach)" }
      - { name: sla_breached_business, type: boolean, source: computed, description: "elapsed_business_hours > sla_hours (strictly greater)" }

  - name: ProvisioningItem
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> ProvisioningOrder.id" }
      - { name: item_kind, type: enum, source: system, description: "EQUIPMENT (from equipment_items) | ACCESS (from access_grants)" }
      - { name: item_name, type: string, source: system, description: "Equipment item_name or access system_name from pinned profile" }
      - { name: quantity, type: integer, source: system, description: "Equipment quantity; 1 for ACCESS items" }
      - { name: status, type: enum, source: system, description: "PENDING | IN_FULFILLMENT | DONE | BLOCKED | CANCELLED" }
      - { name: blocked_reason, type: string, source: input, description: "Required when transitioning to BLOCKED" }
      - { name: sort_index, type: integer, source: system, description: "Generation order; list ordering key (ASC)" }

  - name: OrientationSession
    parent: null
    common_fields: true
    fields:
      - { name: room, type: string, source: input, description: "Room/location identifier; overlap-checked per room" }
      - { name: starts_at, type: datetime, source: input, description: "Session start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Session end; must be > starts_at" }
      - { name: capacity, type: integer, source: input, description: "Maximum bookings; must be >= 1" }
      - { name: booked_count, type: integer, source: computed, description: "COUNT(OnboardingCase WHERE orientation_session_id == this.id AND orientation_rsvp IN {BOOKED, ATTENDED})" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | FULL | CONDUCTED | CANCELLED" }

  - name: CheckIn
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> OnboardingCase.id" }
      - { name: owner_employee_id, type: string, source: system, description: "FK -> Employee.id; manager for MANAGER kind, buddy for BUDDY kind" }
      - { name: kind, type: enum, source: system, description: "MANAGER | BUDDY" }
      - { name: scheduled_at, type: datetime, source: system, description: "start_date + offset days at 09:00:00Z, shifted forward past Sat/Sun to Monday" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | COMPLETED | MISSED | CANCELLED" }
      - { name: productivity_rating, type: integer, source: input, description: "Optional 1-5 rating recorded at completion" }
      - { name: notes, type: string, source: input, description: "Optional completion notes" }
      - { name: completed_at, type: datetime, source: system, description: "Set on completion; null otherwise" }
      - { name: sort_index, type: integer, source: system, description: "Generation order: MANAGER (offset ASC) then BUDDY (date ASC); list ordering key (ASC)" }

  - name: TrainingAssignment
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> OnboardingCase.id" }
      - { name: module_code, type: string, source: system, description: "Module code from pinned profile" }
      - { name: due_at, type: datetime, source: system, description: "(start_date + due_offset_days)T23:59:59Z" }
      - { name: status, type: enum, source: system, description: "ASSIGNED | COMPLETED | OVERDUE | CANCELLED" }
      - { name: score, type: number, source: input, description: "Optional completion score" }
      - { name: completed_at, type: datetime, source: system, description: "Set on completion; null otherwise" }
      - { name: completed_late, type: boolean, source: computed, description: "completed_at > due_at", default: false }
      - { name: sort_index, type: integer, source: system, description: "Template order; list ordering key (ASC)" }

  - name: ProbationCycle
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> OnboardingCase.id" }
      - { name: cycle_index, type: integer, source: system, description: "1-based; extension creates cycle_index+1" }
      - { name: evaluation_due_at, type: datetime, source: system, description: "Cycle 1: (start_date + probation_days)T17:00:00Z; extension cycle: previous evaluation_due_at + extension_days at 17:00:00Z" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EVALUATION_DUE | EVALUATED_PASS | EVALUATED_EXTEND | EVALUATED_FAIL | CANCELLED" }
      - { name: outcome_rating, type: integer, source: input, description: "1-5 manager rating at evaluation" }
      - { name: notes, type: string, source: input, description: "Optional evaluation notes" }
      - { name: evaluated_at, type: datetime, source: system, description: "Set at evaluation; null otherwise" }

  - name: PayrollHandoff
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> OnboardingCase.id" }
      - { name: status, type: enum, source: system, description: "DRAFT | TRANSMITTED | ACKNOWLEDGED | REJECTED_BY_PAYROLL | SUPERSEDED | WITHDRAWN" }
      - { name: base_salary_cents, type: integer, source: system, description: "Snapshot from case at creation" }
      - { name: signing_bonus_cents, type: integer, source: system, description: "Snapshot from case at creation" }
      - { name: relocation_stipend_cents, type: integer, source: system, description: "Snapshot from case at creation" }
      - { name: benefits_tier, type: enum, source: system, description: "Snapshot from case at creation" }
      - { name: start_date, type: string, source: system, description: "Snapshot from case at creation" }
      - { name: first_period_start_date, type: string, source: input, description: "First pay-period start YYYY-MM-DD" }
      - { name: first_period_end_date, type: string, source: input, description: "First pay-period end YYYY-MM-DD; must be >= start" }
      - { name: first_period_gross_cents, type: integer, source: computed, description: "See calculations.first_period_gross_proration (per-component round-then-sum)" }
      - { name: transmitted_at, type: datetime, source: system, description: "Set on transmit; null otherwise" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Set on acknowledge; null otherwise" }
      - { name: benefits_window_end, type: datetime, source: system, description: "(start_date + 30 days)T23:59:59Z" }
      - { name: benefits_window_breached, type: boolean, source: computed, description: "acknowledged_at > benefits_window_end; false when null or on/before (<= is NOT a breach)", default: false }
      - { name: rejection_reason, type: string, source: input, description: "Required on reject" }

  - name: Survey
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> OnboardingCase.id; 1:1, created on phase entry to IN_PROGRESS" }
      - { name: status, type: enum, source: system, description: "SENT | SUBMITTED | EXPIRED | CANCELLED" }
      - { name: sent_at, type: datetime, source: system, description: "Set at creation" }
      - { name: expires_at, type: datetime, source: system, description: "sent_at + 14 days" }
      - { name: onboarding_experience_rating, type: integer, source: input, description: "1-5" }
      - { name: manager_support_rating, type: integer, source: input, description: "1-5" }
      - { name: resources_rating, type: integer, source: input, description: "1-5" }
      - { name: overall_score, type: number, source: computed, description: "round_half_up(0.4*experience + 0.3*manager + 0.3*resources, 2 decimal places)" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: OnboardingCase
    initial_state: PRE_BOARDING
    terminal_states: [COMPLETED, WITHDRAWN, REVOKED, SEPARATED]
    note: "Two parallel dimensions: phase (below) and health (ON_TRACK <-> AT_RISK, system-derived from calculations.case_health_score; cyclic). Time-based transitions are evaluated whenever the logical clock advances via POST /api/_clock/set_current_utc and on any read of the affected entity."
    transitions:
      - from: PRE_BOARDING
        to: CLEARANCE_IN_PROGRESS
        trigger: "POST /api/onboarding-cases/{id}/submit-for-clearance"
        actor: HRAdmin
        preconditions:
          - "phase == PRE_BOARDING (else ERR_INVALID_CASE_PHASE / ERR_CASE_TERMINAL)"
          - "Every OnboardingTask of the case with is_required == true has status IN {APPROVED, WAIVED} (else ERR_REQUIRED_TASKS_INCOMPLETE)"
        side_effects:
          - "Create ClearanceCase (status IN_PROGRESS, background_status PENDING, reference_status PENDING, initiated_by_user_id = caller X-User-ID)"
          - "OnboardingCase.version += 1"
      - from: CLEARANCE_IN_PROGRESS
        to: PROVISIONING
        trigger: "system (automatic when owning ClearanceCase reaches CLEARED, including adjudication override)"
        actor: system
        preconditions:
          - "ClearanceCase.status == CLEARED"
        side_effects:
          - "Create ProvisioningOrder (DRAFT) with ProvisioningItems generated from pinned_profile_version template (equipment_items then access_grants, sort_index in template order, status PENDING)"
          - "OnboardingCase.version += 1"
      - from: CLEARANCE_IN_PROGRESS
        to: REVOKED
        trigger: "system (automatic when owning ClearanceCase reaches REJECTED)"
        actor: system
        preconditions:
          - "ClearanceCase.status == REJECTED"
        side_effects:
          - "Cascade (link 3 of the adjudication chain): all OnboardingTasks in {PENDING, SUBMITTED, REJECTED} -> CANCELLED (APPROVED/WAIVED untouched); all TrainingAssignments in {ASSIGNED, OVERDUE} -> CANCELLED; all CheckIns in {SCHEDULED, MISSED} -> CANCELLED; all ProbationCycles in {ACTIVE, EVALUATION_DUE} -> CANCELLED; Survey in {SENT} -> CANCELLED if present"
          - "NewHire.status -> RESCINDED"
          - "OnboardingCase.version += 1"
      - from: PROVISIONING
        to: DAY_ONE_READY
        trigger: "system (gate re-evaluated on every ProvisioningOrder mutation and every orientation booking/cancellation)"
        actor: system
        preconditions:
          - "ProvisioningOrder.status == FULFILLED AND orientation_rsvp == BOOKED"
        side_effects:
          - "OnboardingCase.version += 1"
      - from: DAY_ONE_READY
        to: PROVISIONING
        trigger: "system (gate re-evaluated when orientation booking is cancelled or the booked session is cancelled)"
        actor: system
        preconditions:
          - "orientation_rsvp != BOOKED"
        side_effects:
          - "OnboardingCase.version += 1"
      - from: DAY_ONE_READY
        to: IN_PROGRESS
        trigger: "system (automatic when current logical time >= start_dateT00:00:00Z)"
        actor: system
        preconditions:
          - "current_utc >= start_dateT00:00:00Z"
        side_effects:
          - "NewHire.status -> EMPLOYED"
          - "Create Survey (SENT, sent_at = now, expires_at = now + 14 days)"
          - "OnboardingCase.version += 1"
      - from: IN_PROGRESS
        to: PROBATION
        trigger: "system (gate re-evaluated on every TrainingAssignment completion and every CheckIn completion)"
        actor: system
        preconditions:
          - "All TrainingAssignments of the case have status == COMPLETED AND at least one CheckIn with kind == MANAGER has status == COMPLETED"
        side_effects:
          - "OnboardingCase.version += 1"
      - from: PROBATION
        to: COMPLETED
        trigger: "system (automatic when any ProbationCycle of the case reaches EVALUATED_PASS)"
        actor: system
        preconditions:
          - "ProbationCycle.status == EVALUATED_PASS"
        side_effects:
          - "OnboardingCase.version += 1"
      - from: PROBATION
        to: SEPARATED
        trigger: "system (automatic when any ProbationCycle of the case reaches EVALUATED_FAIL)"
        actor: system
        preconditions:
          - "ProbationCycle.status == EVALUATED_FAIL"
        side_effects:
          - "Cascade: TrainingAssignments in {ASSIGNED, OVERDUE} -> CANCELLED; CheckIns in {SCHEDULED, MISSED} -> CANCELLED; remaining ProbationCycles in {ACTIVE, EVALUATION_DUE} -> CANCELLED; Survey in {SENT} -> CANCELLED; PayrollHandoffs in {DRAFT, TRANSMITTED} -> WITHDRAWN"
          - "NewHire.status -> SEPARATED"
          - "OnboardingCase.version += 1"
      - from: PRE_BOARDING
        to: WITHDRAWN
        trigger: "POST /api/onboarding-cases/{id}/withdraw"
        actor: HRAdmin
        preconditions:
          - "phase IN {PRE_BOARDING, CLEARANCE_IN_PROGRESS, PROVISIONING, DAY_ONE_READY} (else ERR_INVALID_CASE_PHASE / ERR_CASE_TERMINAL)"
        side_effects:
          - "Cascade: tasks {PENDING, SUBMITTED, REJECTED} -> CANCELLED; ClearanceCase in {IN_PROGRESS, ESCALATED} -> CANCELLED; ProvisioningOrder in {DRAFT, SUBMITTED, IN_PROGRESS, ATTENTION_REQUIRED} -> CANCELLED with its items {PENDING, IN_FULFILLMENT, BLOCKED} -> CANCELLED; trainings {ASSIGNED, OVERDUE} -> CANCELLED; check-ins {SCHEDULED, MISSED} -> CANCELLED; cycles {ACTIVE, EVALUATION_DUE} -> CANCELLED; orientation booking released if rsvp == BOOKED (session booked_count -= 1; FULL -> SCHEDULED)"
          - "NewHire.status -> RESCINDED"
          - "OnboardingCase.version += 1"
      - from: CLEARANCE_IN_PROGRESS
        to: WITHDRAWN
        trigger: "POST /api/onboarding-cases/{id}/withdraw"
        actor: HRAdmin
        preconditions: ["same as PRE_BOARDING -> WITHDRAWN"]
        side_effects: ["same as PRE_BOARDING -> WITHDRAWN"]
      - from: PROVISIONING
        to: WITHDRAWN
        trigger: "POST /api/onboarding-cases/{id}/withdraw"
        actor: HRAdmin
        preconditions: ["same as PRE_BOARDING -> WITHDRAWN"]
        side_effects: ["same as PRE_BOARDING -> WITHDRAWN"]
      - from: DAY_ONE_READY
        to: WITHDRAWN
        trigger: "POST /api/onboarding-cases/{id}/withdraw"
        actor: HRAdmin
        preconditions: ["same as PRE_BOARDING -> WITHDRAWN"]
        side_effects: ["same as PRE_BOARDING -> WITHDRAWN"]
      - from: ON_TRACK
        to: AT_RISK
        trigger: "system (health dimension: whenever calculations.case_health_score < 70 after a mutation or clock advance)"
        actor: system
        preconditions: ["health_score < 70"]
        side_effects: ["OnboardingCase.health updated; version += 1"]
      - from: AT_RISK
        to: ON_TRACK
        trigger: "system (health dimension: whenever calculations.case_health_score >= 70 after a mutation or clock advance)"
        actor: system
        preconditions: ["health_score >= 70"]
        side_effects: ["OnboardingCase.health updated; version += 1"]

  - entity: OnboardingTask
    initial_state: PENDING
    terminal_states: [APPROVED, WAIVED, CANCELLED]
    transitions:
      - from: PENDING
        to: SUBMITTED
        trigger: "POST /api/onboarding-tasks/{id}/submit"
        actor: NewHire
        preconditions:
          - "status IN {PENDING, REJECTED} (else ERR_INVALID_TASK_STATE)"
          - "caller X-User-ID == owning case's new_hire_id (else ERR_NOT_RESOURCE_OWNER)"
          - "task_kind == DOCUMENT_UPLOAD requires document_ref present (else ERR_VALIDATION)"
        side_effects: ["OnboardingCase.version += 1"]
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /api/onboarding-tasks/{id}/submit (rework cycle)"
        actor: NewHire
        preconditions: ["same as PENDING -> SUBMITTED"]
        side_effects: ["OnboardingCase.version += 1"]
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/onboarding-tasks/{id}/review {decision: APPROVE}"
        actor: HRAdmin
        preconditions: ["status == SUBMITTED (else ERR_INVALID_TASK_STATE)"]
        side_effects: ["OnboardingCase.version += 1"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /api/onboarding-tasks/{id}/review {decision: REJECT}"
        actor: HRAdmin
        preconditions: ["status == SUBMITTED (else ERR_INVALID_TASK_STATE)"]
        side_effects:
          - "reject_count += 1"
          - "OnboardingCase.version += 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /api/onboarding-tasks/{id}/waive"
        actor: HRAdmin
        preconditions:
          - "status IN {PENDING, REJECTED} (else ERR_INVALID_TASK_STATE)"
          - "is_required == false (else ERR_TASK_REQUIRED)"
        side_effects: ["OnboardingCase.version += 1"]
      - from: REJECTED
        to: WAIVED
        trigger: "POST /api/onboarding-tasks/{id}/waive"
        actor: HRAdmin
        preconditions: ["same as PENDING -> WAIVED"]
        side_effects: ["OnboardingCase.version += 1"]
      - from: PENDING
        to: CANCELLED
        trigger: "system (cascade from case WITHDRAWN/REVOKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REJECTED
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ClearanceCase
    initial_state: IN_PROGRESS
    terminal_states: [CLEARED, REJECTED, CANCELLED]
    transitions:
      - from: IN_PROGRESS
        to: CLEARED
        trigger: "system (automatic on record-result when background_status == PASSED AND reference_status == PASSED)"
        actor: system
        preconditions: []
        side_effects:
          - "OnboardingCase phase CLEARANCE_IN_PROGRESS -> PROVISIONING cascade (ProvisioningOrder + items created)"
      - from: IN_PROGRESS
        to: ESCALATED
        trigger: "system (automatic on record-result when any component becomes FAILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: CLEARED
        trigger: "POST /api/clearance-cases/{id}/adjudicate {decision: CLEARED}"
        actor: BackgroundAdjudicator
        preconditions:
          - "status == ESCALATED (else ERR_CLEARANCE_NOT_ESCALATED)"
          - "caller X-User-ID != initiated_by_user_id (segregation of duties, else ERR_SELF_ADJUDICATION_FORBIDDEN)"
        side_effects:
          - "override_clear = true; adjudicated_by_user_id = caller; adjudication_rationale recorded"
          - "OnboardingCase phase CLEARANCE_IN_PROGRESS -> PROVISIONING cascade"
      - from: ESCALATED
        to: REJECTED
        trigger: "POST /api/clearance-cases/{id}/adjudicate {decision: REJECTED}"
        actor: BackgroundAdjudicator
        preconditions: ["same as ESCALATED -> CLEARED"]
        side_effects:
          - "adjudicated_by_user_id = caller; adjudication_rationale recorded"
          - "OnboardingCase phase CLEARANCE_IN_PROGRESS -> REVOKED cascade (which itself cascades to tasks/trainings/check-ins/cycles and NewHire RESCINDED)"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (cascade from case withdraw)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ESCALATED
        to: CANCELLED
        trigger: "system (cascade from case withdraw)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProvisioningOrder
    initial_state: DRAFT
    terminal_states: [FULFILLED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /api/provisioning-orders/{id}/submit"
        actor: HRAdmin
        preconditions: ["status == DRAFT (else ERR_ORDER_NOT_DRAFT)"]
        side_effects:
          - "submitted_at = now; sla_hours pinned from profile"
          - "OnboardingCase.version += 1"
      - from: SUBMITTED
        to: IN_PROGRESS
        trigger: "system (automatic when the first item leaves PENDING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: ATTENTION_REQUIRED
        trigger: "system (automatic when >= 1 item is BLOCKED and not all items DONE)"
        actor: system
        preconditions: []
        side_effects: ["OnboardingCase health_score recomputed"]
      - from: IN_PROGRESS
        to: ATTENTION_REQUIRED
        trigger: "system (automatic when >= 1 item is BLOCKED and not all items DONE)"
        actor: system
        preconditions: []
        side_effects: ["OnboardingCase health_score recomputed"]
      - from: ATTENTION_REQUIRED
        to: IN_PROGRESS
        trigger: "system (automatic when no item remains BLOCKED and not all items DONE)"
        actor: system
        preconditions: []
        side_effects: ["OnboardingCase health_score recomputed"]
      - from: SUBMITTED
        to: FULFILLED
        trigger: "system (automatic when all items reach DONE)"
        actor: system
        preconditions: []
        side_effects:
          - "fulfilled_at = now"
          - "OnboardingCase PROVISIONING -> DAY_ONE_READY gate re-evaluated"
      - from: IN_PROGRESS
        to: FULFILLED
        trigger: "system (automatic when all items reach DONE)"
        actor: system
        preconditions: []
        side_effects: ["same as SUBMITTED -> FULFILLED"]
      - from: ATTENTION_REQUIRED
        to: FULFILLED
        trigger: "system (automatic when all items reach DONE)"
        actor: system
        preconditions: []
        side_effects: ["same as SUBMITTED -> FULFILLED"]
      - from: DRAFT
        to: CANCELLED
        trigger: "system (cascade from case withdraw/revoke)"
        actor: system
        preconditions: []
        side_effects: ["items in {PENDING, IN_FULFILLMENT, BLOCKED} -> CANCELLED"]
      - from: SUBMITTED
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: ["items in {PENDING, IN_FULFILLMENT, BLOCKED} -> CANCELLED"]
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: ["items in {PENDING, IN_FULFILLMENT, BLOCKED} -> CANCELLED"]
      - from: ATTENTION_REQUIRED
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: ["items in {PENDING, IN_FULFILLMENT, BLOCKED} -> CANCELLED"]

  - entity: ProvisioningItem
    initial_state: PENDING
    terminal_states: [DONE, CANCELLED]
    transitions:
      - from: PENDING
        to: IN_FULFILLMENT
        trigger: "POST /api/provisioning-items/{id}/transition {to: IN_FULFILLMENT}"
        actor: ITProvisioner
        preconditions:
          - "owning ProvisioningOrder.status IN {SUBMITTED, IN_PROGRESS, ATTENTION_REQUIRED} (else ERR_ORDER_NOT_ACTIVE)"
          - "transition (from, to) must be one of: (PENDING, IN_FULFILLMENT), (IN_FULFILLMENT, DONE), (IN_FULFILLMENT, BLOCKED), (BLOCKED, IN_FULFILLMENT) (else ERR_INVALID_ITEM_TRANSITION)"
        side_effects: ["ProvisioningOrder compound status re-derived"]
      - from: IN_FULFILLMENT
        to: DONE
        trigger: "POST /api/provisioning-items/{id}/transition {to: DONE}"
        actor: ITProvisioner
        preconditions: ["same guard pair as PENDING -> IN_FULFILLMENT"]
        side_effects: ["ProvisioningOrder compound status re-derived; on all-DONE, order -> FULFILLED with its case-gate side effects"]
      - from: IN_FULFILLMENT
        to: BLOCKED
        trigger: "POST /api/provisioning-items/{id}/transition {to: BLOCKED, blocked_reason}"
        actor: ITProvisioner
        preconditions:
          - "same guard pair as PENDING -> IN_FULFILLMENT"
          - "blocked_reason required when to == BLOCKED (else ERR_VALIDATION)"
        side_effects: ["ProvisioningOrder compound status re-derived (likely ATTENTION_REQUIRED); case health_score recomputed"]
      - from: BLOCKED
        to: IN_FULFILLMENT
        trigger: "POST /api/provisioning-items/{id}/transition {to: IN_FULFILLMENT} (retry cycle)"
        actor: ITProvisioner
        preconditions: ["same guard pair as PENDING -> IN_FULFILLMENT"]
        side_effects: ["blocked_reason cleared; ProvisioningOrder compound status re-derived; case health_score recomputed"]
      - from: PENDING
        to: CANCELLED
        trigger: "system (cascade from order cancellation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_FULFILLMENT
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: BLOCKED
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: OrientationSession
    initial_state: SCHEDULED
    terminal_states: [CONDUCTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: FULL
        trigger: "system (automatic when booked_count reaches capacity)"
        actor: system
        preconditions: ["booked_count == capacity"]
        side_effects: []
      - from: FULL
        to: SCHEDULED
        trigger: "system (automatic when a booking is cancelled and booked_count drops below capacity)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: CONDUCTED
        trigger: "system (automatic when current logical time >= ends_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Cases with orientation_session_id == this and orientation_rsvp == BOOKED (never marked attended) -> orientation_rsvp = NO_SHOW; case health_score recomputed"
      - from: FULL
        to: CONDUCTED
        trigger: "system (automatic when current logical time >= ends_at)"
        actor: system
        preconditions: []
        side_effects: ["same as SCHEDULED -> CONDUCTED"]
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/orientation-sessions/{id}/cancel"
        actor: HRAdmin
        preconditions: ["status IN {SCHEDULED, FULL} (else ERR_SESSION_NOT_BOOKABLE)"]
        side_effects:
          - "Cases with orientation_rsvp == BOOKED on this session -> orientation_rsvp = SESSION_CANCELLED, orientation_session_id cleared to null, booked_count recomputed; any such case in DAY_ONE_READY reverts to PROVISIONING"
      - from: FULL
        to: CANCELLED
        trigger: "POST /api/orientation-sessions/{id}/cancel"
        actor: HRAdmin
        preconditions: ["same as SCHEDULED -> CANCELLED"]
        side_effects: ["same as SCHEDULED -> CANCELLED"]

  - entity: CheckIn
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /api/check-ins/{id}/complete"
        actor: "Buddy (kind == BUDDY) | HiringManager (kind == MANAGER)"
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_CHECKIN_STATE); a MISSED check-in must be rescheduled before completion"
          - "caller X-User-ID == owner_employee_id (else ERR_NOT_RESOURCE_OWNER); role must match kind (Buddy for BUDDY, HiringManager for MANAGER)"
        side_effects:
          - "completed_at = now; productivity_rating/notes recorded"
          - "OnboardingCase health_score recomputed; IN_PROGRESS -> PROBATION gate re-evaluated; time_to_productivity recomputed"
          - "OnboardingCase.version += 1"
      - from: SCHEDULED
        to: MISSED
        trigger: "system (automatic when current logical time > scheduled_at + 24 hours)"
        actor: system
        preconditions: []
        side_effects: ["OnboardingCase health_score recomputed"]
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /api/check-ins/{id}/reschedule {scheduled_at}"
        actor: "HiringManager | HRAdmin"
        preconditions:
          - "status IN {SCHEDULED, MISSED} (else ERR_INVALID_CHECKIN_STATE)"
          - "new scheduled_at > current logical time (else ERR_CHECKIN_TIME_IN_PAST)"
          - "Buffer rule: for the same owner_employee_id, every other CheckIn with status IN {SCHEDULED, COMPLETED} must satisfy ABS(new_scheduled_at - other.scheduled_at) >= 30 minutes (else ERR_CHECKIN_TOO_CLOSE); exactly 30 minutes is allowed"
        side_effects: ["OnboardingCase.version += 1"]
      - from: MISSED
        to: SCHEDULED
        trigger: "POST /api/check-ins/{id}/reschedule {scheduled_at} (reschedule cycle)"
        actor: "HiringManager | HRAdmin"
        preconditions: ["same as SCHEDULED -> SCHEDULED"]
        side_effects:
          - "OnboardingCase health_score recomputed (missed count drops)"
          - "OnboardingCase.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (cascade from case withdraw/revoke/separate, or from owner Employee deactivation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MISSED
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrainingAssignment
    initial_state: ASSIGNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: COMPLETED
        trigger: "POST /api/training-assignments/{id}/complete"
        actor: NewHire
        preconditions:
          - "status IN {ASSIGNED, OVERDUE} (else ERR_INVALID_TRAINING_STATE)"
          - "caller X-User-ID == owning case's new_hire_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "completed_at = now; completed_late = (completed_at > due_at)"
          - "OnboardingCase health_score recomputed; IN_PROGRESS -> PROBATION gate re-evaluated; time_to_productivity recomputed"
          - "OnboardingCase.version += 1"
      - from: OVERDUE
        to: COMPLETED
        trigger: "POST /api/training-assignments/{id}/complete (late completion)"
        actor: NewHire
        preconditions: ["same as ASSIGNED -> COMPLETED"]
        side_effects: ["same as ASSIGNED -> COMPLETED; completed_late == true"]
      - from: ASSIGNED
        to: OVERDUE
        trigger: "system (automatic when current logical time > due_at)"
        actor: system
        preconditions: []
        side_effects: ["OnboardingCase health_score recomputed"]
      - from: ASSIGNED
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ProbationCycle
    initial_state: ACTIVE
    terminal_states: [EVALUATED_PASS, EVALUATED_EXTEND, EVALUATED_FAIL, CANCELLED]
    transitions:
      - from: ACTIVE
        to: EVALUATION_DUE
        trigger: "system (automatic when current logical time >= evaluation_due_at)"
        actor: system
        preconditions: []
        side_effects: ["If current time > evaluation_due_at + 7 days, case health_score recomputed (probation-overdue term)"]
      - from: EVALUATION_DUE
        to: EVALUATED_PASS
        trigger: "POST /api/probation-cycles/{id}/evaluate {outcome: PASS}"
        actor: HiringManager
        preconditions:
          - "status == EVALUATION_DUE (else ERR_CYCLE_NOT_EVALUABLE)"
          - "caller X-User-ID == owning case's manager_id (else ERR_NOT_RESOURCE_OWNER)"
          - "owning OnboardingCase.phase == PROBATION (else ERR_INVALID_CASE_PHASE)"
        side_effects:
          - "outcome_rating/notes/evaluated_at recorded"
          - "OnboardingCase phase PROBATION -> COMPLETED"
      - from: EVALUATION_DUE
        to: EVALUATED_EXTEND
        trigger: "POST /api/probation-cycles/{id}/evaluate {outcome: EXTEND}"
        actor: HiringManager
        preconditions:
          - "same as EVALUATED_PASS"
          - "cycle_index <= pinned profile max_probation_extensions (else ERR_MAX_EXTENSIONS_REACHED)"
        side_effects:
          - "Create successor ProbationCycle (cycle_index + 1, status ACTIVE, evaluation_due_at = this.evaluation_due_at + extension_days at 17:00:00Z) (extension regeneration loop)"
          - "OnboardingCase.version += 1"
      - from: EVALUATION_DUE
        to: EVALUATED_FAIL
        trigger: "POST /api/probation-cycles/{id}/evaluate {outcome: FAIL}"
        actor: HiringManager
        preconditions: ["same as EVALUATED_PASS"]
        side_effects: ["OnboardingCase phase PROBATION -> SEPARATED cascade"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EVALUATION_DUE
        to: CANCELLED
        trigger: "system (cascade)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PayrollHandoff
    initial_state: DRAFT
    terminal_states: [ACKNOWLEDGED, REJECTED_BY_PAYROLL, SUPERSEDED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: TRANSMITTED
        trigger: "POST /api/payroll-handoffs/{id}/transmit"
        actor: HRAdmin
        preconditions: ["status == DRAFT (else ERR_INVALID_HANDOFF_STATE)"]
        side_effects: ["transmitted_at = now"]
      - from: TRANSMITTED
        to: ACKNOWLEDGED
        trigger: "POST /api/payroll-handoffs/{id}/acknowledge"
        actor: PayrollOps
        preconditions: ["status == TRANSMITTED (else ERR_INVALID_HANDOFF_STATE)"]
        side_effects: ["acknowledged_at = now; benefits_window_breached = (now > benefits_window_end)"]
      - from: TRANSMITTED
        to: REJECTED_BY_PAYROLL
        trigger: "POST /api/payroll-handoffs/{id}/reject {reason}"
        actor: PayrollOps
        preconditions: ["status == TRANSMITTED (else ERR_INVALID_HANDOFF_STATE)"]
        side_effects: ["rejection_reason recorded"]
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /api/payroll-handoffs/{id}/withdraw"
        actor: HRAdmin
        preconditions: ["status == DRAFT (else ERR_INVALID_HANDOFF_STATE)"]
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a new PayrollHandoff is created for the same case)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TRANSMITTED
        to: SUPERSEDED
        trigger: "system (automatic when a new PayrollHandoff is created for the same case)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (cascade from case SEPARATED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: TRANSMITTED
        to: WITHDRAWN
        trigger: "system (cascade from case SEPARATED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Survey
    initial_state: SENT
    terminal_states: [SUBMITTED, EXPIRED, CANCELLED]
    transitions:
      - from: SENT
        to: SUBMITTED
        trigger: "POST /api/surveys/{id}/submit"
        actor: NewHire
        preconditions:
          - "status == SENT (else ERR_INVALID_SURVEY_STATE)"
          - "caller X-User-ID == owning case's new_hire_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["overall_score computed per calculations.survey_overall_score"]
      - from: SENT
        to: EXPIRED
        trigger: "system (automatic when current logical time > expires_at)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SENT
        to: CANCELLED
        trigger: "system (cascade from case REVOKED/SEPARATED)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RoleProfile
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/role-profiles/{id}/publish"
        actor: HRAdmin
        preconditions: []
        side_effects: ["published_version += 1"]
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /api/role-profiles/{id}/publish (re-publish after PUT edits)"
        actor: HRAdmin
        preconditions: []
        side_effects: ["published_version += 1; existing cases keep their pinned_profile_version"]

  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /api/employees/{id}/deactivate"
        actor: HRAdmin
        preconditions: ["employment_status == ACTIVE (a repeated deactivate is rejected with ERR_EMPLOYEE_NOT_ACTIVE)"]
        side_effects:
          - "Cascade link 1: every OnboardingCase with manager_id == this employee and phase NOT IN {COMPLETED, WITHDRAWN, REVOKED, SEPARATED} gets manager_reassignment_required = true (version += 1 each)"
          - "Cascade link 2 (triggered by each mutated case): every CheckIn of those cases with owner_employee_id == this employee and status IN {SCHEDULED, MISSED} -> CANCELLED; case health_score recomputed"
          - "Also: every CheckIn with owner_employee_id == this employee where the employee is the buddy (case.buddy_id == this employee) and status IN {SCHEDULED, MISSED} -> CANCELLED"

  - entity: NewHire
    initial_state: REGISTERED
    terminal_states: [RESCINDED, SEPARATED]
    transitions:
      - from: REGISTERED
        to: EMPLOYED
        trigger: "system (automatic when owning OnboardingCase enters IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: REGISTERED
        to: RESCINDED
        trigger: "system (automatic when owning OnboardingCase becomes WITHDRAWN or REVOKED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EMPLOYED
        to: SEPARATED
        trigger: "system (automatic when owning OnboardingCase becomes SEPARATED)"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: handoff-create-stale-case-version
    parent_entity: OnboardingCase
    write_endpoint: "POST /api/onboarding-cases/{id}/payroll-handoffs"
    occ_field: "expected_case_version"
    description: |
      Creating a PayrollHandoff against an OnboardingCase whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a handoff (which legitimately
      supersedes the prior non-terminal handoff under the create-with-supersede
      rule) and the current writer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: case_health_score
    trigger: "On every mutation of the case's children (training OVERDUE/COMPLETED, check-in MISSED/rescheduled/COMPLETED, provisioning order ATTENTION_REQUIRED transitions, probation EVALUATION_DUE aging, orientation NO_SHOW) and on every read of the case or its summary"
    algorithm: weighted_scoring
    formula: |
      inputs (all counts over the owning case):
        ot  = COUNT(TrainingAssignment WHERE status == OVERDUE)
        mc  = COUNT(CheckIn WHERE status == MISSED)
        peo = 1 if any ProbationCycle has status == EVALUATION_DUE and now > evaluation_due_at + 7 days, else 0
        par = 1 if ProvisioningOrder.status == ATTENTION_REQUIRED, else 0
        ns  = 1 if OnboardingCase.orientation_rsvp == NO_SHOW, else 0
      health_score = max(0, 100 - 15*ot - 10*mc - 25*peo - 20*par - 30*ns)
      health = AT_RISK iff health_score < 70; ON_TRACK iff health_score >= 70
      (boundary pinned: score exactly 70 is ON_TRACK; score 69 is AT_RISK)
    input_set: "Children of the single owning OnboardingCase in the exact statuses named above; CANCELLED children never count"
    constants:
      OVERDUE_TRAINING_PENALTY: 15
      MISSED_CHECKIN_PENALTY: 10
      PROBATION_OVERDUE_PENALTY: 25
      PROBATION_OVERDUE_GRACE_DAYS: 7
      PROVISIONING_ATTENTION_PENALTY: 20
      NO_SHOW_PENALTY: 30
      AT_RISK_THRESHOLD: 70
      SCORE_FLOOR: 0
    precision: "integer; no rounding"

  - name: time_to_productivity
    trigger: "Recomputed on every TrainingAssignment/CheckIn completion and on every read of GET /api/onboarding-cases/{id}/summary"
    algorithm: forward_looking
    formula: |
      Variant ESTIMATED (always available):
        base_days = MAX( MAX(pinned profile training_modules.due_offset_days),
                         MAX(pinned profile manager_checkin_offsets_days) )
        estimated_ttp_days = base_days
                             + 3 * COUNT(TrainingAssignment WHERE status == OVERDUE)
                             + 5 * COUNT(CheckIn WHERE status == MISSED)
      Variant ACTUAL (null until satisfied):
        When ALL TrainingAssignments are COMPLETED AND ALL CheckIns with kind == MANAGER are COMPLETED:
          actual_ttp_days = calendar-day difference between case.start_date and the date of
                            MAX(completed_at over all TrainingAssignments and MANAGER CheckIns)
        else actual_ttp_days = null
    input_set: "TrainingAssignments and CheckIns of the owning case in the exact statuses named; CANCELLED excluded"
    constants:
      OVERDUE_TRAINING_SLIP_DAYS: 3
      MISSED_CHECKIN_SLIP_DAYS: 5
    precision: "integer days"
    variants:
      - name: estimated
        when: "Always computable; forward-looking estimate that drifts with overdue/missed items"
        difference: "Uses profile base + slip penalties; ignores actual completion timestamps"
      - name: actual
        when: "Only once all trainings COMPLETED and all MANAGER check-ins COMPLETED"
        difference: "Uses real completion timestamps; for identical mid-flight data the two variants return different numbers (e.g. 30 vs 4)"

  - name: provisioning_sla_elapsed
    trigger: "On read of a ProvisioningOrder (elapsed/sla fields are computed, never stored)"
    algorithm: chronological
    formula: |
      interval = [submitted_at, min(now, fulfilled_at)]; empty (0 hours) when submitted_at is null
      Variant CALENDAR: elapsed_calendar_hours = total hours in interval
      Variant BUSINESS: elapsed_business_hours = hours in interval whose UTC weekday is Monday-Friday
        (Saturday/Sunday hours excluded; holidays not modelled)
      sla_breached_calendar = elapsed_calendar_hours > sla_hours
      sla_breached_business  = elapsed_business_hours > sla_hours
      (boundary pinned: strictly greater; elapsed exactly == sla_hours is NOT a breach)
    input_set: "The single ProvisioningOrder"
    precision: "hours with 1 decimal place (half-hour granularity sufficient); comparisons exact"
    variants:
      - name: calendar
        when: "Wall-clock SLA view"
        difference: "Counts weekend hours; a Friday submit breaches by Monday"
      - name: business
        when: "Business-hours SLA view"
        difference: "Excludes Saturday/Sunday hours; identical interval yields a smaller value and can flip the breach boolean"

  - name: first_period_gross_proration
    trigger: "On PayrollHandoff creation; result stored as first_period_gross_cents"
    algorithm: tiered_pricing
    formula: |
      days_in_period = (first_period_end_date - first_period_start_date).days + 1
      days_employed  = max(0, (first_period_end_date - max(case.start_date, first_period_start_date)).days + 1)
        (0 when start_date is after first_period_end_date)
      ratio = days_employed / days_in_period
      ROUNDING ORDER PINNED — per-component first, then sum:
        comp_base  = round_half_up(base_salary_cents * ratio)          to whole cents
        comp_bonus = round_half_up(signing_bonus_cents * ratio)        to whole cents
        comp_reloc = round_half_up(relocation_stipend_cents * ratio)   to whole cents
        first_period_gross_cents = comp_base + comp_bonus + comp_reloc
      The alternative order (sum all components unrounded, then round once) is FORBIDDEN and
      produces different cents for the same inputs (e.g. 90000/10000/2500 at 11/14:
      per-component 80535 vs sum-then-round 80536).
    input_set: "Compensation snapshot fields of the PayrollHandoff"
    precision: "integer cents, round_half_up per component"

  - name: survey_overall_score
    trigger: "On Survey submit; result stored as overall_score"
    algorithm: weighted_scoring
    formula: |
      overall_score = round_half_up(0.4 * onboarding_experience_rating
                                  + 0.3 * manager_support_rating
                                  + 0.3 * resources_rating, 2 decimal places)
    input_set: "The three submitted ratings (each integer 1-5)"
    constants:
      W_EXPERIENCE: 0.4
      W_MANAGER: 0.3
      W_RESOURCES: 0.3
    precision: "2 decimal places, round_half_up"

  - name: checkin_cadence_schedule
    trigger: "On OnboardingCase creation (generates all CheckIns); also on reassign-manager (regenerates future MANAGER milestones)"
    algorithm: chronological
    formula: |
      For each manager offset m in pinned profile manager_checkin_offsets_days (processed in ascending offset order):
        d = start_date + m days; while d is Saturday/Sunday: d += 1 day   (weekend shift forward to Monday)
        scheduled_at = dT09:00:00Z; owner = case.manager_id; kind = MANAGER
      Buddy check-ins: for k in 0 .. buddy_checkin_count-1:
        d = start_date + (1 + k * buddy_checkin_interval_days) days; same weekend shift
        scheduled_at = dT09:00:00Z; owner = case.buddy_id; kind = BUDDY
      sort_index: MANAGER entries first (offset ASC), then BUDDY entries (date ASC)
      Buffer invariant on regeneration: newly generated check-ins must satisfy the 30-minute buffer rule
      against the owner's existing non-CANCELLED check-ins; generated slots are always 09:00Z on distinct
      dates for a single case, so conflicts can only arise across cases sharing an owner.
    input_set: "Pinned RoleProfile cadence fields + case start_date"
    precision: "datetime to the second"

  - name: benefits_enrollment_window
    trigger: "On PayrollHandoff acknowledge"
    algorithm: threshold
    formula: |
      benefits_window_end = (start_date + 30 days)T23:59:59Z
      benefits_window_breached = (acknowledged_at > benefits_window_end)
      (boundary pinned: acknowledgment exactly at benefits_window_end is NOT breached; one second later is)
    input_set: "The single PayrollHandoff"
    precision: "datetime to the second"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 400
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Request shape: required fields present, enums valid, dates parseable, quantity >= 1, ends_at > starts_at, first_period_end_date >= first_period_start_date, pagination params within response_envelope bounds (limit 1-100, offset >= 0); conditional: document_ref present when task_kind == DOCUMENT_UPLOAD on submit; blocked_reason present when to == BLOCKED"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints (body fields and query/pagination params)"
  - priority: 4
    category: existence
    check: "Resource ids referenced by the request exist: path ids validated left-to-right, and body-referenced ids (role_profile_id, new_hire_id, manager_id, buddy_id, new_manager_id, session_id, case_id) resolve to existing entities of the right type"
    error_id: "ERR_ROLE_PROFILE_NOT_FOUND | ERR_EMPLOYEE_NOT_FOUND | ERR_NEW_HIRE_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_TASK_NOT_FOUND | ERR_CLEARANCE_NOT_FOUND | ERR_ORDER_NOT_FOUND | ERR_ITEM_NOT_FOUND | ERR_SESSION_NOT_FOUND | ERR_CHECKIN_NOT_FOUND | ERR_TRAINING_NOT_FOUND | ERR_CYCLE_NOT_FOUND | ERR_HANDOFF_NOT_FOUND | ERR_SURVEY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: auth
    check: "Ownership: NewHire may only act on entities of the case whose new_hire_id == X-User-ID; Buddy/HiringManager may only complete CheckIns they own (owner_employee_id == X-User-ID) and of matching kind; HiringManager may only evaluate cycles of cases where manager_id == X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /api/onboarding-tasks/{id}/submit, POST /api/training-assignments/{id}/complete, POST /api/surveys/{id}/submit, POST /api/onboarding-cases/{id}/orientation-booking(+cancel) as NewHire, POST /api/check-ins/{id}/complete, POST /api/probation-cycles/{id}/evaluate"
  - priority: 6
    category: state
    check: "Target entity is in a state that permits the operation (per state machine preconditions): case phase gates, task/clearance/order/item/check-in/training/cycle/handoff/survey status gates, terminal lockdown"
    error_id: "ERR_INVALID_CASE_PHASE | ERR_CASE_TERMINAL | ERR_INVALID_TASK_STATE | ERR_INVALID_CLEARANCE_STATE | ERR_CLEARANCE_NOT_ESCALATED | ERR_ORDER_NOT_DRAFT | ERR_ORDER_NOT_ACTIVE | ERR_INVALID_ITEM_TRANSITION | ERR_SESSION_NOT_BOOKABLE | ERR_ALREADY_BOOKED | ERR_NO_BOOKING_TO_CANCEL | ERR_INVALID_CHECKIN_STATE | ERR_INVALID_TRAINING_STATE | ERR_CYCLE_NOT_EVALUABLE | ERR_INVALID_HANDOFF_STATE | ERR_INVALID_SURVEY_STATE"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "Compliance gates: adjudicator must not be the clearance initiator (segregation of duties); submit-for-clearance requires all required tasks APPROVED/WAIVED"
    error_id: "ERR_SELF_ADJUDICATION_FORBIDDEN | ERR_REQUIRED_TASKS_INCOMPLETE"
    http_status: 409
    applies_to: "POST /api/clearance-cases/{id}/adjudicate, POST /api/onboarding-cases/{id}/submit-for-clearance"
  - priority: 8
    category: business_referential
    check: "Referenced configuration/people are usable: RoleProfile PUBLISHED, manager/buddy Employees ACTIVE, no other non-terminal OnboardingCase for the new hire"
    error_id: "ERR_ROLE_PROFILE_NOT_PUBLISHED | ERR_EMPLOYEE_NOT_ACTIVE | ERR_DUPLICATE_ACTIVE_CASE"
    http_status: 409
    applies_to: "POST /api/onboarding-cases, POST /api/onboarding-cases/{id}/reassign-manager"
  - priority: 9
    category: business_constraint
    check: "Constraint satisfaction: manager_id != buddy_id; orientation room overlap (half-open); check-in 30-minute buffer; session capacity; required task not waivable; probation extension budget; OCC expected_case_version match"
    error_id: "ERR_DUAL_ROLE_ASSIGNMENT | ERR_SESSION_ROOM_OVERLAP | ERR_CHECKIN_TOO_CLOSE | ERR_SESSION_FULL | ERR_TASK_REQUIRED | ERR_MAX_EXTENSIONS_REACHED | ERR_STALE_VERSION"
    http_status: 409
    applies_to: "case create/reassign, session create, booking, check-in reschedule, task waive, cycle evaluate, handoff create"
  - priority: 10
    category: business_temporal
    check: "Temporal sanity: case start_date must be >= current logical date at creation; rescheduled check-in time must be in the future"
    error_id: "ERR_START_DATE_IN_PAST | ERR_CHECKIN_TIME_IN_PAST"
    http_status: 409
    applies_to: "POST /api/onboarding-cases, POST /api/check-ins/{id}/reschedule"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- RoleProfile ---
  - { method: POST, path: "/api/role-profiles", description: "Create a RoleProfile (status DRAFT, published_version 0)", roles: [HRAdmin], code: 201, input: [name, preboarding_tasks, training_modules, equipment_items, access_grants, probation_days, max_probation_extensions, extension_days, buddy_checkin_interval_days, buddy_checkin_count, manager_checkin_offsets_days, provisioning_sla_hours], output: RoleProfile, side_effects: [] }
  - { method: GET, path: "/api/role-profiles/{id}", description: "Get a RoleProfile", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: [], output: RoleProfile, side_effects: [] }
  - { method: PUT, path: "/api/role-profiles/{id}", description: "Edit profile template fields; does not change published_version", roles: [HRAdmin], code: 200, input: ["name?", "preboarding_tasks?", "training_modules?", "equipment_items?", "access_grants?", "probation_days?", "max_probation_extensions?", "extension_days?", "buddy_checkin_interval_days?", "buddy_checkin_count?", "manager_checkin_offsets_days?", "provisioning_sla_hours?"], output: RoleProfile, side_effects: [] }
  - { method: POST, path: "/api/role-profiles/{id}/publish", description: "Publish: status -> PUBLISHED, published_version += 1", roles: [HRAdmin], code: 200, input: [], output: RoleProfile, side_effects: ["published_version += 1"] }

  # --- Employee ---
  - { method: POST, path: "/api/employees", description: "Create an Employee (ACTIVE)", roles: [HRAdmin], code: 201, input: [full_name, email, "manager_id?"], output: Employee, side_effects: [] }
  - { method: GET, path: "/api/employees", description: "List employees", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["manager_id?", "employment_status?", "limit?", "offset?"], output: "Employee[]", side_effects: [] }
  - { method: GET, path: "/api/employees/{id}", description: "Get an Employee", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: [], output: Employee, side_effects: [] }
  - { method: POST, path: "/api/employees/{id}/deactivate", description: "Deactivate an Employee; cascades to managed cases and owned check-ins", roles: [HRAdmin], code: 200, input: [], output: Employee, side_effects: ["manager_reassignment_required on managed non-terminal cases", "owned SCHEDULED/MISSED CheckIns -> CANCELLED"] }
  - { method: GET, path: "/api/employees/{id}/check-ins", description: "List CheckIns owned by an Employee", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["limit?", "offset?"], output: "CheckIn[]", side_effects: [] }

  # --- NewHire ---
  - { method: POST, path: "/api/new-hires", description: "Create a NewHire person record (REGISTERED)", roles: [HRAdmin], code: 201, input: [full_name, personal_email, start_date, department], output: NewHire, side_effects: [] }
  - { method: GET, path: "/api/new-hires/{id}", description: "Get a NewHire", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: [], output: NewHire, side_effects: [] }

  # --- OnboardingCase ---
  - { method: POST, path: "/api/onboarding-cases", description: "Create an OnboardingCase (PRE_BOARDING); pins current role profile version; generates tasks, trainings, check-ins, probation cycle 1 from the pinned profile", roles: [HRAdmin], code: 201, input: [new_hire_id, role_profile_id, manager_id, buddy_id, start_date, base_salary_cents, benefits_tier, "signing_bonus_cents?", "relocation_stipend_cents?"], output: OnboardingCase, side_effects: ["generate OnboardingTasks (template order, sort_index)", "generate TrainingAssignments (ASSIGNED, due_at)", "generate CheckIns per calculations.checkin_cadence_schedule", "create ProbationCycle cycle 1 (ACTIVE)", "pinned_profile_version set"] }
  - { method: GET, path: "/api/onboarding-cases", description: "List cases with filters", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["new_hire_id?", "role_profile_id?", "manager_id?", "buddy_id?", "orientation_session_id?", "phase?", "health?", "limit?", "offset?"], output: "OnboardingCase[]", side_effects: [] }
  - { method: GET, path: "/api/onboarding-cases/{id}", description: "Get a case (health/health_score recomputed on read)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: [], output: OnboardingCase, side_effects: [] }
  - { method: GET, path: "/api/onboarding-cases/{id}/summary", description: "Computed read: health score, time-to-productivity variants, open handoff count", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: [], output: { health_score: integer, health: string, phase: string, estimated_ttp_days: integer, actual_ttp_days: "integer|null", open_handoff_count: integer }, side_effects: [] }
  - { method: POST, path: "/api/onboarding-cases/{id}/submit-for-clearance", description: "PRE_BOARDING -> CLEARANCE_IN_PROGRESS; creates ClearanceCase", roles: [HRAdmin], code: 200, input: [], output: OnboardingCase, side_effects: ["create ClearanceCase IN_PROGRESS", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/api/onboarding-cases/{id}/withdraw", description: "Withdraw a pre-day-one case; full cancellation cascade", roles: [HRAdmin], code: 200, input: [], output: OnboardingCase, side_effects: ["cascade per state machine", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/api/onboarding-cases/{id}/reassign-manager", description: "Assign a new ACTIVE manager; clears manager_reassignment_required; regenerates future MANAGER check-ins per cadence calc", roles: [HRAdmin], code: 200, input: [new_manager_id], output: OnboardingCase, side_effects: ["manager_id updated", "manager_reassignment_required = false", "future MANAGER CheckIns regenerated for new owner", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/api/onboarding-cases/{id}/orientation-booking", description: "Book the case into an orientation session", roles: [HRAdmin, NewHire], code: 200, input: [session_id], output: OnboardingCase, side_effects: ["orientation_rsvp -> BOOKED", "session booked_count += 1 (auto FULL at capacity)", "DAY_ONE_READY gate re-evaluated", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/api/onboarding-cases/{id}/orientation-booking/cancel", description: "Cancel the case's orientation booking", roles: [HRAdmin, NewHire], code: 200, input: [], output: OnboardingCase, side_effects: ["orientation_rsvp -> NONE, session link cleared", "session booked_count -= 1 (FULL -> SCHEDULED)", "DAY_ONE_READY gate re-evaluated (may revert to PROVISIONING)", "increments OnboardingCase.version by 1"] }

  # --- Case sub-resources (filtered lists by parent) ---
  - { method: GET, path: "/api/onboarding-cases/{id}/tasks", description: "List tasks of a case (sort_index ASC)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["limit?", "offset?"], output: "OnboardingTask[]", side_effects: [] }
  - { method: GET, path: "/api/onboarding-cases/{id}/clearance-cases", description: "List clearance cases of a case (0 or 1 entries)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["limit?", "offset?"], output: "ClearanceCase[]", side_effects: [] }
  - { method: GET, path: "/api/onboarding-cases/{id}/provisioning-orders", description: "List provisioning orders of a case (0 or 1 entries)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["limit?", "offset?"], output: "ProvisioningOrder[]", side_effects: [] }
  - { method: GET, path: "/api/onboarding-cases/{id}/check-ins", description: "List check-ins of a case (sort_index ASC)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["limit?", "offset?"], output: "CheckIn[]", side_effects: [] }
  - { method: GET, path: "/api/onboarding-cases/{id}/training-assignments", description: "List training assignments of a case (sort_index ASC)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["limit?", "offset?"], output: "TrainingAssignment[]", side_effects: [] }
  - { method: GET, path: "/api/onboarding-cases/{id}/probation-cycles", description: "List probation cycles of a case (cycle_index ASC)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["limit?", "offset?"], output: "ProbationCycle[]", side_effects: [] }
  - { method: GET, path: "/api/onboarding-cases/{id}/payroll-handoffs", description: "List payroll handoffs of a case (created_at ASC)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["limit?", "offset?"], output: "PayrollHandoff[]", side_effects: [] }
  - { method: GET, path: "/api/onboarding-cases/{id}/surveys", description: "List surveys of a case (0 or 1 entries)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["limit?", "offset?"], output: "Survey[]", side_effects: [] }

  # --- OnboardingTask actions ---
  - { method: POST, path: "/api/onboarding-tasks/{id}/submit", description: "New hire submits a task (PENDING/REJECTED -> SUBMITTED)", roles: [NewHire], code: 200, input: ["document_ref?", "note?"], output: OnboardingTask, side_effects: ["increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/api/onboarding-tasks/{id}/review", description: "HR reviews a SUBMITTED task", roles: [HRAdmin], code: 200, input: [decision, "review_note?"], output: OnboardingTask, side_effects: ["APPROVE -> APPROVED; REJECT -> REJECTED with reject_count += 1", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/api/onboarding-tasks/{id}/waive", description: "HR waives an optional task (PENDING/REJECTED -> WAIVED)", roles: [HRAdmin], code: 200, input: [], output: OnboardingTask, side_effects: ["increments OnboardingCase.version by 1"] }

  # --- ClearanceCase actions ---
  - { method: POST, path: "/api/clearance-cases/{id}/record-result", description: "Record a background/reference check result", roles: [HRAdmin], code: 200, input: [component, result], output: ClearanceCase, side_effects: ["component status set", "auto CLEARED when both PASSED (case -> PROVISIONING cascade)", "auto ESCALATED when any FAILED"] }
  - { method: POST, path: "/api/clearance-cases/{id}/adjudicate", description: "Adjudicate an ESCALATED clearance (segregation of duties enforced)", roles: [BackgroundAdjudicator], code: 200, input: [decision, rationale], output: ClearanceCase, side_effects: ["CLEARED -> override_clear + case PROVISIONING cascade; REJECTED -> case REVOKED cascade"] }

  # --- Provisioning ---
  - { method: GET, path: "/api/provisioning-orders/{id}", description: "Get an order (elapsed/SLA fields computed on read)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: [], output: ProvisioningOrder, side_effects: [] }
  - { method: POST, path: "/api/provisioning-orders/{id}/submit", description: "DRAFT -> SUBMITTED; starts SLA clock", roles: [HRAdmin], code: 200, input: [], output: ProvisioningOrder, side_effects: ["submitted_at = now", "increments OnboardingCase.version by 1"] }
  - { method: GET, path: "/api/provisioning-orders/{id}/items", description: "List items of an order (sort_index ASC)", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["limit?", "offset?"], output: "ProvisioningItem[]", side_effects: [] }
  - { method: POST, path: "/api/provisioning-items/{id}/transition", description: "Move an item along PENDING -> IN_FULFILLMENT -> DONE with BLOCKED/retry cycle", roles: [ITProvisioner], code: 200, input: [to, "blocked_reason?"], output: ProvisioningItem, side_effects: ["order compound status re-derived", "case health recomputed", "on all-DONE: order FULFILLED and case gate re-evaluated"] }

  # --- OrientationSession ---
  - { method: POST, path: "/api/orientation-sessions", description: "Create a session; half-open [starts_at, ends_at) room-overlap check against non-CANCELLED sessions in the same room", roles: [HRAdmin], code: 201, input: [room, starts_at, ends_at, capacity], output: OrientationSession, side_effects: [] }
  - { method: GET, path: "/api/orientation-sessions", description: "List sessions", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: ["room?", "status?", "limit?", "offset?"], output: "OrientationSession[]", side_effects: [] }
  - { method: POST, path: "/api/orientation-sessions/{id}/cancel", description: "Cancel a session; booked cases flip to SESSION_CANCELLED", roles: [HRAdmin], code: 200, input: [], output: OrientationSession, side_effects: ["booked cases -> SESSION_CANCELLED; DAY_ONE_READY gate re-evaluated"] }
  - { method: POST, path: "/api/orientation-sessions/{id}/attendance", description: "Mark a booked case ATTENDED or NO_SHOW", roles: [HRAdmin], code: 200, input: [case_id, attended], output: OnboardingCase, side_effects: ["orientation_rsvp -> ATTENDED or NO_SHOW", "case health recomputed on NO_SHOW"] }

  # --- CheckIn actions ---
  - { method: POST, path: "/api/check-ins/{id}/complete", description: "Owner completes a SCHEDULED check-in (early completion allowed)", roles: [Buddy, HiringManager], code: 200, input: ["productivity_rating?", "notes?"], output: CheckIn, side_effects: ["completed_at = now", "case health/TTP recomputed", "PROBATION gate re-evaluated", "increments OnboardingCase.version by 1"] }
  - { method: POST, path: "/api/check-ins/{id}/reschedule", description: "Move a SCHEDULED/MISSED check-in to a future time (30-minute buffer per owner)", roles: [HRAdmin, HiringManager], code: 200, input: [scheduled_at], output: CheckIn, side_effects: ["MISSED -> SCHEDULED restores health", "increments OnboardingCase.version by 1"] }

  # --- TrainingAssignment actions ---
  - { method: POST, path: "/api/training-assignments/{id}/complete", description: "New hire completes a training (late completion allowed, flagged)", roles: [NewHire], code: 200, input: ["score?"], output: TrainingAssignment, side_effects: ["completed_late computed", "case health/TTP recomputed", "PROBATION gate re-evaluated", "increments OnboardingCase.version by 1"] }

  # --- ProbationCycle actions ---
  - { method: POST, path: "/api/probation-cycles/{id}/evaluate", description: "Manager evaluates an EVALUATION_DUE cycle: PASS | EXTEND | FAIL", roles: [HiringManager], code: 200, input: [outcome, rating, "notes?"], output: ProbationCycle, side_effects: ["PASS -> case COMPLETED; FAIL -> case SEPARATED cascade; EXTEND -> successor cycle created (budget-checked)"] }

  # --- PayrollHandoff ---
  - { method: POST, path: "/api/onboarding-cases/{id}/payroll-handoffs", description: "Create a handoff (OCC on case version); supersedes existing DRAFT/TRANSMITTED handoffs of the case; snapshots compensation and computes first_period_gross_cents", roles: [HRAdmin], code: 201, input: [expected_case_version, first_period_start_date, first_period_end_date], output: PayrollHandoff, side_effects: ["existing DRAFT/TRANSMITTED handoffs -> SUPERSEDED", "first_period_gross_cents computed", "increments OnboardingCase.version by 1"] }
  - { method: GET, path: "/api/payroll-handoffs/{id}", description: "Get a handoff", roles: [HRAdmin, HiringManager, Buddy, NewHire, ITProvisioner, BackgroundAdjudicator, PayrollOps], code: 200, input: [], output: PayrollHandoff, side_effects: [] }
  - { method: POST, path: "/api/payroll-handoffs/{id}/transmit", description: "DRAFT -> TRANSMITTED (requires owning case phase IN {DAY_ONE_READY, IN_PROGRESS, PROBATION})", roles: [HRAdmin], code: 200, input: [], output: PayrollHandoff, side_effects: ["transmitted_at = now"] }
  - { method: POST, path: "/api/payroll-handoffs/{id}/acknowledge", description: "TRANSMITTED -> ACKNOWLEDGED; sets benefits_window_breached", roles: [PayrollOps], code: 200, input: [], output: PayrollHandoff, side_effects: ["acknowledged_at = now", "benefits_window_breached computed"] }
  - { method: POST, path: "/api/payroll-handoffs/{id}/reject", description: "TRANSMITTED -> REJECTED_BY_PAYROLL", roles: [PayrollOps], code: 200, input: [reason], output: PayrollHandoff, side_effects: [] }
  - { method: POST, path: "/api/payroll-handoffs/{id}/withdraw", description: "DRAFT -> WITHDRAWN", roles: [HRAdmin], code: 200, input: [], output: PayrollHandoff, side_effects: [] }

  # --- Survey ---
  - { method: POST, path: "/api/surveys/{id}/submit", description: "New hire submits the experience survey", roles: [NewHire], code: 200, input: [onboarding_experience_rating, manager_support_rating, resources_rating], output: Survey, side_effects: ["overall_score computed"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/api/_clock/set_current_utc", description: "Set the server's logical clock (ISO 8601 UTC). Startup default before any call is exactly 2026-05-01T00:00:00Z and the clock never falls back to wall-clock time. Advancing the clock evaluates all time-based transitions (phase auto-advance, OVERDUE/MISSED flips, survey expiry, session CONDUCTED, probation EVALUATION_DUE) as an atomic sweep.", roles: [HRAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["time-based transition sweep"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 400, condition: "X-User-ID or X-User-Role header missing/unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not permitted on this endpoint" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad enum/date, quantity < 1, ends_at <= starts_at, missing conditional field (document_ref / blocked_reason)" }
  - { id: ERR_ROLE_PROFILE_NOT_FOUND, http: 404, condition: "RoleProfile id does not exist" }
  - { id: ERR_EMPLOYEE_NOT_FOUND, http: 404, condition: "Employee id does not exist" }
  - { id: ERR_NEW_HIRE_NOT_FOUND, http: 404, condition: "NewHire id does not exist" }
  - { id: ERR_CASE_NOT_FOUND, http: 404, condition: "OnboardingCase id does not exist" }
  - { id: ERR_TASK_NOT_FOUND, http: 404, condition: "OnboardingTask id does not exist" }
  - { id: ERR_CLEARANCE_NOT_FOUND, http: 404, condition: "ClearanceCase id does not exist" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "ProvisioningOrder id does not exist" }
  - { id: ERR_ITEM_NOT_FOUND, http: 404, condition: "ProvisioningItem id does not exist" }
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "OrientationSession id does not exist" }
  - { id: ERR_CHECKIN_NOT_FOUND, http: 404, condition: "CheckIn id does not exist" }
  - { id: ERR_TRAINING_NOT_FOUND, http: 404, condition: "TrainingAssignment id does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "ProbationCycle id does not exist" }
  - { id: ERR_HANDOFF_NOT_FOUND, http: 404, condition: "PayrollHandoff id does not exist" }
  - { id: ERR_SURVEY_NOT_FOUND, http: 404, condition: "Survey id does not exist" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Caller is not the owning NewHire / check-in owner / case manager" }
  - { id: ERR_INVALID_CASE_PHASE, http: 409, condition: "Case phase does not permit the operation (booking, submit-for-clearance, handoff create/transmit, evaluate gate)" }
  - { id: ERR_CASE_TERMINAL, http: 409, condition: "Case is COMPLETED/WITHDRAWN/REVOKED/SEPARATED; no further mutations" }
  - { id: ERR_INVALID_TASK_STATE, http: 409, condition: "Task not in a state permitting submit/review/waive" }
  - { id: ERR_INVALID_CLEARANCE_STATE, http: 409, condition: "record-result requires IN_PROGRESS and the component still PENDING" }
  - { id: ERR_CLEARANCE_NOT_ESCALATED, http: 409, condition: "adjudicate requires ESCALATED" }
  - { id: ERR_ORDER_NOT_DRAFT, http: 409, condition: "Order submit requires DRAFT" }
  - { id: ERR_ORDER_NOT_ACTIVE, http: 409, condition: "Item transitions require order SUBMITTED/IN_PROGRESS/ATTENTION_REQUIRED" }
  - { id: ERR_INVALID_ITEM_TRANSITION, http: 409, condition: "(from, to) not in the allowed item transition set" }
  - { id: ERR_SESSION_NOT_BOOKABLE, http: 409, condition: "Session CANCELLED or CONDUCTED (also cancel on terminal session)" }
  - { id: ERR_ALREADY_BOOKED, http: 409, condition: "Case already holds a booking (rsvp not NONE/SESSION_CANCELLED)" }
  - { id: ERR_NO_BOOKING_TO_CANCEL, http: 409, condition: "Cancel booking requires rsvp == BOOKED" }
  - { id: ERR_INVALID_CHECKIN_STATE, http: 409, condition: "complete requires SCHEDULED; reschedule requires SCHEDULED/MISSED" }
  - { id: ERR_INVALID_TRAINING_STATE, http: 409, condition: "complete requires ASSIGNED/OVERDUE" }
  - { id: ERR_CYCLE_NOT_EVALUABLE, http: 409, condition: "evaluate requires EVALUATION_DUE" }
  - { id: ERR_INVALID_HANDOFF_STATE, http: 409, condition: "transmit requires DRAFT; acknowledge/reject require TRANSMITTED; withdraw requires DRAFT" }
  - { id: ERR_INVALID_SURVEY_STATE, http: 409, condition: "submit requires SENT (EXPIRED/SUBMITTED/CANCELLED rejected)" }
  - { id: ERR_SELF_ADJUDICATION_FORBIDDEN, http: 403, condition: "Adjudicator X-User-ID equals clearance initiated_by_user_id (segregation of duties)" }
  - { id: ERR_REQUIRED_TASKS_INCOMPLETE, http: 409, condition: "submit-for-clearance with a required task not APPROVED/WAIVED" }
  - { id: ERR_ROLE_PROFILE_NOT_PUBLISHED, http: 409, condition: "Case creation against a DRAFT profile" }
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 409, condition: "manager/buddy (or reassign target) is INACTIVE; also second deactivate" }
  - { id: ERR_DUPLICATE_ACTIVE_CASE, http: 409, condition: "New hire already has a non-terminal OnboardingCase" }
  - { id: ERR_DUAL_ROLE_ASSIGNMENT, http: 422, condition: "manager_id == buddy_id on case create/reassign" }
  - { id: ERR_SESSION_ROOM_OVERLAP, http: 409, condition: "New session's half-open interval overlaps a non-CANCELLED session in the same room" }
  - { id: ERR_CHECKIN_TOO_CLOSE, http: 409, condition: "Rescheduled check-in within < 30 minutes of another non-CANCELLED check-in of the same owner" }
  - { id: ERR_SESSION_FULL, http: 409, condition: "Booking into a session whose booked_count == capacity" }
  - { id: ERR_TASK_REQUIRED, http: 422, condition: "Waive attempted on a required task" }
  - { id: ERR_MAX_EXTENSIONS_REACHED, http: 409, condition: "EXTEND when cycle_index > max_probation_extensions" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_case_version does not match the case's current version (OCC)" }
  - { id: ERR_START_DATE_IN_PAST, http: 409, condition: "Case start_date before the current logical date" }
  - { id: ERR_CHECKIN_TIME_IN_PAST, http: 409, condition: "Rescheduled check-in time not in the future" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HRAdmin
    description: "HR onboarding team operator; runs the whole administrative surface"
    identity: opaque
    exclusive_operations:
      - "POST /api/role-profiles, PUT /api/role-profiles/{id}, POST /api/role-profiles/{id}/publish"
      - "POST /api/employees, POST /api/employees/{id}/deactivate"
      - "POST /api/new-hires"
      - "POST /api/onboarding-cases, submit-for-clearance, withdraw, reassign-manager"
      - "POST /api/onboarding-tasks/{id}/review, POST /api/onboarding-tasks/{id}/waive"
      - "POST /api/clearance-cases/{id}/record-result"
      - "POST /api/provisioning-orders/{id}/submit"
      - "POST /api/orientation-sessions, cancel, attendance"
      - "POST /api/onboarding-cases/{id}/payroll-handoffs, transmit, withdraw"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/onboarding-cases/{id}/orientation-booking and cancel (shared with NewHire)"
      - "POST /api/check-ins/{id}/reschedule (shared with HiringManager)"
  - name: HiringManager
    description: "Manager of the new hire; owns MANAGER check-ins and probation evaluation"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /api/probation-cycles/{id}/evaluate (must be the case's manager)"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/check-ins/{id}/complete for owned MANAGER check-ins (shared role list with Buddy, ownership+kind enforced)"
      - "POST /api/check-ins/{id}/reschedule (shared with HRAdmin)"
  - name: Buddy
    description: "Onboarding buddy; owns BUDDY check-ins"
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
      - "POST /api/check-ins/{id}/complete for owned BUDDY check-ins"
  - name: NewHire
    description: "The incoming employee; completes pre-boarding tasks, training, orientation RSVP, survey"
    identity: "entity_backed:NewHire"
    exclusive_operations:
      - "POST /api/onboarding-tasks/{id}/submit (own case only)"
      - "POST /api/training-assignments/{id}/complete (own case only)"
      - "POST /api/surveys/{id}/submit (own case only)"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/onboarding-cases/{id}/orientation-booking and cancel (own case only)"
  - name: ITProvisioner
    description: "IT fulfillment operator for equipment and access items"
    identity: opaque
    exclusive_operations:
      - "POST /api/provisioning-items/{id}/transition"
    shared_operations:
      - "All GET endpoints"
  - name: BackgroundAdjudicator
    description: "Independent adjudicator for escalated clearances; must not be the initiator"
    identity: opaque
    exclusive_operations:
      - "POST /api/clearance-cases/{id}/adjudicate"
    shared_operations:
      - "All GET endpoints"
  - name: PayrollOps
    description: "Payroll/benefits counterpart system operator"
    identity: opaque
    exclusive_operations:
      - "POST /api/payroll-handoffs/{id}/acknowledge"
      - "POST /api/payroll-handoffs/{id}/reject"
    shared_operations:
      - "All GET endpoints"
