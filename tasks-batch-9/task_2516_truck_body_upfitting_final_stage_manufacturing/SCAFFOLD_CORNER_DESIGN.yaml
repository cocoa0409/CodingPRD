          assert:
            - "HTTP 201"
            - "UpfitOrder.${uo}.build_status == \"DRAFT\""
            - "UpfitOrder.${uo}.compliance_status == \"NOT_STARTED\""
            - "UpfitOrder.${uo}.body_install_status == \"PLANNED\""
