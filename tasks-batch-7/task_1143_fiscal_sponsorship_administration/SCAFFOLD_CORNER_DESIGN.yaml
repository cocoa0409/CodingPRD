      - name: sod_sponsor_signer_reused_from_compliance_rejected
        claim_type: segregation_of_duties
        grounds: ["validations[priority=9]", "errors[ERR_SOD_VIOLATION]", entities.DisbursementRequest.fields.sponsor_approved_by_user_id]
        distinguishing_aspect: "On the high-value path the sponsor approver must differ from the compliance approver: sponsor-approve with the same X-User-ID -> ERR_SOD_VIOLATION."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE; received 2,000,000 (available 1,840,000); disbursement 1,000,000 PENDING_SPONSOR with compliance_approved_by_user_id == user_sa_9"]
