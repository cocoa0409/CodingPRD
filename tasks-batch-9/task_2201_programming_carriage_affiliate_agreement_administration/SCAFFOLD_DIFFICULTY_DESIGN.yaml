          assert:
            - "the captured a_draft_lifecycle equals \"DRAFT\", rep_draft_status equals \"SUBMITTED\" and a_susp_lifecycle equals \"SUSPENDED\""
            - "response status code == 409"
            - "response body data.error_id == \"ERR_AGREEMENT_NOT_EXECUTED\""
            - "GET /carriage/subscriber-reports/${rep_draft_id} returns status == \"SUBMITTED\", license_fee_due_cents == null and billable_subscribers == null"
            - "GET /carriage/agreements/${a_draft_id} returns recognized_revenue_cents == 0 and penetration_compliance_status unchanged"
            - "the same call against ${rep_susp_id} — whose agreement is SUSPENDED, not EXECUTED — returns 200 with status == \"ACCEPTED\" and license_fee_due_cents == 5200000"
            - "after that acceptance GET /carriage/agreements/${a_susp_id} returns consecutive_compliant_periods == 1 and lifecycle_status == \"SUSPENDED\" (acceptance never un-suspends an agreement by itself)"

      - instance_id: CE-2
        name: license_fee_issue_blocked_by_distributor_credit_hold
        grounds:
          - validations[priority=41]
          - errors[ERR_DISTRIBUTOR_CREDIT_HOLD]
          - state_machines.Invoice.DRAFT_to_ISSUED
          - entities.Distributor.fields.status
        title: "Licence-fee invoice issuance depends on the operator's credit standing, not on the invoice's own state"
        dependency: "Invoice.status == DRAFT is admissible, but Distributor.status must be ACTIVE"
        rationale: >-
          A DRAFT invoice with a positive net_due and fully accepted source
          reports is internally ready to issue. Issuance is nonetheless refused
          while the operator sits on credit hold, because issuing would load a
          receivable onto an account the network has already stopped extending
          credit to. The guard reads an entity two hops away from the invoice
          (Invoice -> Distributor), and it is checked at ISSUE rather than at
          creation, so an invoice can be legitimately drafted and then become
          un-issuable without changing at all.
        distinguishing_aspect: >-
          The identical POST with action=ISSUE returns 409
          ERR_DISTRIBUTOR_CREDIT_HOLD while the operator is on hold and 200 with
          status ISSUED once the hold is released — with no change whatsoever to
          the invoice row in between (net_due_cents stays 4784000 throughout, and
          its coop_offset_cents stays 416000). The refusal must also leave
          Distributor.receivable_balance_cents at 0 and the co-op ledger
          unconsumed.
        test_recipe:
          setup: >-
            Cliffside Telco reports 130,000 subscribers for 2026-06, the month is
            accepted at 5,200,000 cents, and a LICENSE_FEE invoice is drafted with
