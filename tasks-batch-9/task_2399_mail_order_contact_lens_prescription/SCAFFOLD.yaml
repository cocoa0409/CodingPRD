task_id: task_2399_mail_order_contact_lens_prescription
domain_name: mail-order-contact-lens
api_prefix: "/"
scenario_description: |
  2399. Mail-Order Contact Lens & Prescription Verification (1-800 CONTACTS): prescription capture by upload, doctor lookup or self-report, passive verification clock to the prescriber with response handling, expired or invalid prescription blocking and reorder holds, brand/parameter substitution rules and lens-equivalent mapping, insurance out-of-network reimbursement paperwork generation, torn-lens and prescription-change return policy with proration, auto-reorder cadence tied to wear schedule, prescriber dispute handling and order cancellation

complexity_profile:
  primary_archetype: compliance_audit_workflow
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: InsurancePlan
    description: An out-of-network-capable vision plan whose allowance, coinsurance and paperwork rules drive reimbursement packet generation.
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        required: true
        description: Plan display name.
      - name: network_status
        type: enum(IN_NETWORK, OUT_OF_NETWORK)
        source: input
        required: true
        description: Only OUT_OF_NETWORK plans may have reimbursement claims generated against them.
      - name: annual_allowance_cents
        type: integer
        source: input
        required: true
        description: Maximum eligible spend reimbursed per plan year, in cents. Must be >= 0.
      - name: coinsurance_rate
        type: decimal(3,2)
        source: input
        required: true
        description: Member coinsurance share applied to the amount above the allowance. 0.00 <= rate <= 1.00.
      - name: requires_itemized_receipt
        type: boolean
        source: input
        required: false
        default: true
        description: When true, claim generation requires the order to carry an itemized receipt reference.
      - name: covers_shipping
        type: boolean
        source: input
        required: false
        default: false
        description: When false, order shipping_cents is excluded from base eligible spend.
      - name: claim_window_days
        type: integer
        source: input
        required: false
        default: 90
        description: Days after order delivery within which a claim may be generated.
      - name: plan_year_start_month_day
        type: string
        source: input
        required: false
        default: "01-01"
        description: MM-DD anchor of the plan year used for the allowance window.
      - name: status
        type: enum(ACTIVE, RETIRED)
        source: input
        required: false
        default: ACTIVE
        description: RETIRED plans reject new claim generation.

  - name: Product
    description: A sellable contact lens SKU with wear schedule, fitting parameters and price used for snapshotting onto orders.
    common_fields: true
    fields:
      - name: brand
        type: string
        source: input
        required: true
        description: Manufacturer brand.
      - name: name
        type: string
        source: input
        required: true
        description: SKU display name.
      - name: wear_schedule
        type: enum(DAILY_DISPOSABLE, BIWEEKLY, MONTHLY)
        source: input
        required: true
        description: Replacement schedule; drives days-per-lens in cadence calculation.
      - name: lenses_per_box
        type: integer
        source: input
        required: true
        description: Lens count per box. Must be >= 1.
      - name: unit_price_cents
        type: integer
        source: input
        required: true
        description: Price per box in cents. Must be >= 1.
      - name: base_curve
        type: decimal(4,2)
        source: input
        required: true
        description: Base curve in millimetres.
      - name: diameter
        type: decimal(4,2)
        source: input
        required: true
        description: Lens diameter in millimetres.
      - name: sphere_min
        type: decimal(5,2)
        source: input
        required: true
        description: Most negative sphere power stocked.
      - name: sphere_max
        type: decimal(5,2)
        source: input
        required: true
        description: Most positive sphere power stocked. Must be >= sphere_min.
      - name: sphere_step
        type: decimal(4,2)
        source: input
        required: false
        default: 0.25
        description: Granularity of stocked sphere powers; drives PARAMETER_ROUNDED substitution snapping.
      - name: material_family
        type: string
        source: input
        required: true
        description: Material grouping used by MATERIAL_ONLY equivalences.
      - name: status
        type: enum(ACTIVE, INACTIVE)
        source: input
        required: false
        default: ACTIVE
        description: INACTIVE products may not be ordered or substituted into.

  - name: LensEquivalence
    description: Directed self-referential mapping between two Products declaring how far a substitution may travel and whether patient consent is required.
    common_fields: true
    fields:
      - name: from_product_id
        type: uuid
        source: input
        required: true
        description: FK -> Product.id. The originally ordered product.
      - name: to_product_id
        type: uuid
        source: input
        required: true
        description: FK -> Product.id. The product that may be fulfilled instead.
      - name: equivalence_class
        type: enum(EXACT, CLINICAL, MATERIAL_ONLY)
        source: input
        required: true
        description: EXACT auto-approves, CLINICAL is deviation-gated, MATERIAL_ONLY always requires consent.
      - name: requires_patient_consent
        type: boolean
        source: input
        required: false
        default: false
        description: When true the substitution request must carry patient_consent=true.
      - name: status
        type: enum(ACTIVE, RETIRED)
        source: input
        required: false
        default: ACTIVE
        description: RETIRED mappings are not usable for substitution.

  - name: Prescriber
    description: An eye-care provider who receives passive verification requests and may file disputes.
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        required: true
        description: Provider name.
      - name: license_number
        type: string
        source: input
        required: true
        description: State license number. Unique per license_state.
      - name: license_state
        type: string
        source: input
        required: true
        description: Two-letter state code of licensure.
      - name: contact_channel
        type: enum(FAX, PORTAL, EMAIL)
        source: input
        required: true
        description: Channel used when sending verification requests.
      - name: directory_verified
        type: boolean
        source: input
        required: false
        default: false
        description: True when matched from the provider directory; drives the 8-business-hour passive clock instead of 12.
      - name: status
        type: enum(ACTIVE, SUSPENDED)
        source: input
        required: false
        default: ACTIVE
        description: SUSPENDED prescribers cannot be sent verification requests.

  - name: Customer
    description: The purchasing patient, carrying the derived cash, allowance, hold and schedule ledgers that all compensating invariants reconcile against.
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        required: true
        description: Patient name.
      - name: email
        type: string
        source: input
        required: true
        description: Contact email. Unique.
      - name: state_code
        type: string
        source: input
        required: true
        description: Two-letter state of residence.
      - name: insurance_plan_id
        type: uuid
        source: input
        required: false
        description: FK -> InsurancePlan.id. Null when the customer is self-pay.
      - name: store_credit_cents
        type: integer
        source: computed
        required: false
        default: 0
        description: Running store-credit balance credited by STORE_CREDIT return settlements.
      - name: lifetime_charged_cents
        type: integer
        source: computed
        required: false
        default: 0
        description: Sum of total_cents over all orders whose fulfillment_state is not CANCELLED.
      - name: lifetime_refunded_cents
        type: integer
        source: computed
        required: false
        default: 0
        description: Sum of settlement_cents over SETTLED return requests whose settlement_channel is CASH_REFUND.
      - name: net_cash_position_cents
        type: integer
        source: computed
        required: false
        default: 0
        description: lifetime_charged_cents minus lifetime_refunded_cents. Subject of invariant INV_MONEY.
      - name: allowance_used_cents
        type: integer
        source: computed
        required: false
        default: 0
        description: Plan-year allowance consumed by claims in GENERATED or SUBMITTED. Subject of invariant INV_ALLOWANCE.
      - name: open_hold_count
        type: integer
        source: computed
        required: false
        default: 0
        description: Count of ReorderHold rows for this customer in status OPEN.
      - name: active_schedule_count
        type: integer
        source: computed
        required: false
        default: 0
        description: Count of AutoReorderSchedule rows for this customer in status ACTIVE.
      - name: auto_reorder_enabled
        type: boolean
        source: computed
        required: false
        default: false
        description: True exactly when active_schedule_count > 0 and open_hold_count == 0.

  - name: Prescription
    description: A captured contact lens prescription that must clear verification before it authorises boxes, and that may supersede a prior prescription.
    common_fields: true
    fields:
      - name: customer_id
        type: uuid
        source: input
        required: true
        description: FK -> Customer.id. Owning patient.
      - name: prescriber_id
        type: uuid
        source: input
        required: false
        description: FK -> Prescriber.id. Required for DOCTOR_LOOKUP capture; null for SELF_REPORT.
      - name: product_id
        type: uuid
        source: input
        required: true
        description: FK -> Product.id. The prescribed SKU.
      - name: supersedes_prescription_id
        type: uuid
        source: input
        required: false
        description: FK -> Prescription.id. Self-referential link to the prescription this one replaces; permits an otherwise overlapping validity interval.
      - name: capture_mode
        type: enum(UPLOAD, DOCTOR_LOOKUP, SELF_REPORT)
        source: input
        required: true
        description: UPLOAD is verified on submit; DOCTOR_LOOKUP and SELF_REPORT enter passive verification.
      - name: document_reference
        type: string
        source: input
        required: false
        description: Scan reference; required when capture_mode is UPLOAD.
      - name: self_reported_prescriber_name
        type: string
        source: input
        required: false
        description: Free-text prescriber name; required when capture_mode is SELF_REPORT.
      - name: issue_date
        type: date
        source: input
        required: true
        description: Date the prescription was written. Inclusive start of the validity interval.
      - name: expiry_date
        type: date
        source: input
        required: true
        description: Exclusive end of the validity interval. Must be strictly after issue_date.
      - name: od_sphere
        type: decimal(5,2)
        source: input
        required: true
        description: Right-eye sphere power.
      - name: os_sphere
        type: decimal(5,2)
        source: input
        required: true
        description: Left-eye sphere power.
      - name: base_curve
        type: decimal(4,2)
        source: input
        required: true
        description: Prescribed base curve.
      - name: diameter
        type: decimal(4,2)
        source: input
        required: true
        description: Prescribed diameter.
      - name: boxes_authorized_total
        type: integer
        source: input
        required: true
        description: Total boxes the prescription authorises across its life. Must be >= 1.
      - name: boxes_consumed
        type: integer
        source: computed
        required: false
        default: 0
        description: Sum of boxes_od + boxes_os over non-CANCELLED orders against this prescription. Subject of invariant INV_BOXES.
      - name: verification_rounds
        type: integer
        source: computed
        required: false
        default: 0
        description: Number of verification requests sent for this prescription; capped by MAX_VERIFICATION_ROUNDS.
      - name: status
        type: enum(DRAFT, PENDING_VERIFICATION, CORRECTION_PENDING, VERIFIED_ACTIVE, INVALIDATED, EXPIRED)
        source: system
        required: false
        default: DRAFT
        description: Lifecycle state; see state machine prescription_lifecycle.

  - name: VerificationRequest
    description: One outbound passive-verification contact to a prescriber, carrying its own business-hour deadline and response.
    common_fields: true
    fields:
      - name: prescription_id
        type: uuid
        source: input
        required: true
        description: FK -> Prescription.id. Prescription being verified.
      - name: prescriber_id
        type: uuid
        source: input
        required: true
        description: FK -> Prescriber.id. Recipient of the contact.
      - name: channel
        type: enum(FAX, PORTAL, EMAIL)
        source: computed
        required: false
        description: Snapshot of the prescriber contact_channel at send time.
      - name: sent_at
        type: timestamp
        source: computed
        required: false
        description: Logical clock value when the request was sent.
      - name: passive_deadline_at
        type: timestamp
        source: computed
        required: false
        description: Business-hour deadline after which silence promotes the prescription. See calculation passive_verification_deadline.
      - name: round_number
        type: integer
        source: computed
        required: false
        description: 1-based round index within the prescription.
      - name: response_type
        type: enum(CONFIRMED, CORRECTED, DENIED)
        source: computed
        required: false
        description: Null until the prescriber responds.
      - name: status
        type: enum(SENT, CONFIRMED, CORRECTED, DENIED, PASSIVE_TIMEOUT)
        source: system
        required: false
        default: SENT
        description: Lifecycle state; see state machine verification_request_lifecycle.

  - name: Order
    description: A boxes order against a prescription, carrying two independent state dimensions plus the price and lens-count snapshots that later settlements prorate from.
    common_fields: true
    fields:
      - name: customer_id
        type: uuid
        source: input
        required: true
        description: FK -> Customer.id. Purchaser.
      - name: prescription_id
        type: uuid
        source: input
        required: true
        description: FK -> Prescription.id. Authorising prescription.
      - name: ordered_product_id
        type: uuid
        source: input
        required: true
        description: FK -> Product.id. Product the customer asked for.
      - name: fulfilled_product_id
        type: uuid
        source: computed
        required: false
        description: FK -> Product.id. Product actually shipped; equals ordered_product_id until a substitution is applied.
      - name: boxes_od
        type: integer
        source: input
        required: true
        description: Boxes for the right eye. Must be >= 0.
      - name: boxes_os
        type: integer
        source: input
        required: true
        description: Boxes for the left eye. Must be >= 0; boxes_od + boxes_os must be >= 1.
      - name: unit_price_cents
        type: integer
        source: computed
        required: false
        description: Snapshot of ordered product unit_price_cents at creation; immune to later product repricing.
      - name: lenses_per_box_at_capture
        type: integer
        source: computed
        required: false
        description: Snapshot of ordered product lenses_per_box at creation; used by return proration.
      - name: subtotal_cents
        type: integer
        source: computed
        required: false
        description: unit_price_cents times total boxes.
      - name: shipping_cents
        type: integer
        source: computed
        required: false
        description: 0 when subtotal_cents >= FREE_SHIPPING_THRESHOLD_CENTS, else STANDARD_SHIPPING_CENTS.
      - name: total_cents
        type: integer
        source: computed
        required: false
        description: subtotal_cents plus shipping_cents. See calculation order_total_cents.
      - name: verification_state
        type: enum(RX_PENDING, RX_CLEARED, RX_BLOCKED)
        source: system
        required: false
        default: RX_PENDING
        description: Prescription-clearance dimension; independent of fulfillment_state.
      - name: fulfillment_state
        type: enum(PENDING, SHIPPED, DELIVERED, CANCELLED)
        source: system
        required: false
        default: PENDING
        description: Physical dimension; independent of verification_state.
      - name: substitution_type
        type: enum(NONE, BRAND_EQUIVALENT, PARAMETER_ROUNDED)
        source: computed
        required: false
        default: NONE
        description: What kind of substitution was applied, if any. NONE until a substitution is applied; PARAMETER_ROUNDED when the substitute product's sphere_step forces fulfilled_od_sphere or fulfilled_os_sphere away from the prescribed value; otherwise BRAND_EQUIVALENT.
      - name: parameter_deviation_index
        type: decimal(5,2)
        source: computed
        required: false
        default: 0.00
        description: Weighted fitting-parameter distance between prescription and fulfilled product. See calculation parameter_deviation_index.
      - name: fulfilled_od_sphere
        type: decimal(5,2)
        source: computed
        required: false
        description: Right-eye sphere actually dispensed after any snapping.
      - name: fulfilled_os_sphere
        type: decimal(5,2)
        source: computed
        required: false
        description: Left-eye sphere actually dispensed after any snapping.
      - name: itemized_receipt_reference
        type: string
        source: input
        required: false
        description: Receipt identifier required by plans with requires_itemized_receipt true.
      - name: recall_flagged
        type: boolean
        source: computed
        required: false
        default: false
        description: Set when an already-shipped or delivered order is caught by prescription invalidation and cannot be cancelled.
      - name: cancellation_reason
        type: enum(CUSTOMER_REQUEST, DISPUTE_UPHELD, PRESCRIBER_DENIED, RX_EXPIRED)
        source: computed
        required: false
        description: Populated when fulfillment_state becomes CANCELLED.
      - name: shipped_at
        type: timestamp
        source: computed
        required: false
        description: Logical clock value at ship time.
      - name: delivered_at
        type: timestamp
        source: computed
        required: false
        description: Logical clock value at delivery; anchors the claim window.

  - name: ReorderHold
    description: A compliance block that suppresses auto-reorder for a customer until a compliance officer other than the opener releases it.
    common_fields: true
    fields:
      - name: customer_id
        type: uuid
        source: input
        required: true
        description: FK -> Customer.id. Held customer.
      - name: prescription_id
        type: uuid
        source: input
        required: true
        description: FK -> Prescription.id. Prescription that triggered the hold.
      - name: reason
        type: enum(PRESCRIBER_DENIED, PRESCRIPTION_EXPIRED, DISPUTE_UPHELD, MANUAL)
        source: input
        required: true
        description: Why the hold exists.
      - name: opened_by_user_id
        type: string
        source: system
        required: false
        description: X-User-ID that opened the hold, or the string "system" when opened by a cascade.
      - name: released_by_user_id
        type: string
        source: computed
        required: false
        description: X-User-ID that released the hold; must differ from opened_by_user_id.
      - name: escalated_reason
        type: string
        source: computed
        required: false
        description: Populated when the hold is escalated instead of released.
      - name: status
        type: enum(OPEN, RELEASED, ESCALATED)
        source: system
        required: false
        default: OPEN
        description: Lifecycle state; see state machine reorder_hold_lifecycle.

  - name: AutoReorderSchedule
    description: A recurring shipment plan whose cadence is derived from the wear schedule or from observed consumption, and which pauses whenever a hold is open.
    common_fields: true
    fields:
      - name: customer_id
        type: uuid
        source: input
        required: true
        description: FK -> Customer.id. Subscriber.
      - name: prescription_id
        type: uuid
        source: input
        required: true
        description: FK -> Prescription.id. Authorising prescription.
      - name: product_id
        type: uuid
        source: input
        required: true
        description: FK -> Product.id. Product to ship each run.
      - name: boxes_per_run
        type: integer
        source: input
        required: true
        description: Boxes shipped per eye-pair each run. Must be >= 1.
      - name: cadence_basis
        type: enum(NOMINAL, USAGE_ADJUSTED)
        source: input
        required: false
        default: NOMINAL
        description: Selects the cadence variant. USAGE_ADJUSTED requires observed_days_per_box.
      - name: observed_days_per_box
        type: integer
        source: input
        required: false
        description: Measured days a box actually lasts; required when cadence_basis is USAGE_ADJUSTED.
      - name: cadence_days
        type: integer
        source: computed
        required: false
        description: Days between runs. See calculation auto_reorder_cadence.
      - name: anchor_date
        type: date
        source: input
        required: true
        description: Date the cadence counts from.
      - name: next_run_at
        type: timestamp
        source: computed
        required: false
        description: anchor_date plus cadence_days at 08:00:00Z.
      - name: consecutive_skip_count
        type: integer
        source: computed
        required: false
        default: 0
        description: Runs skipped in a row; at MAX_CONSECUTIVE_SKIPS the schedule is paused.
      - name: pause_reason
        type: enum(HOLD_OPEN, CUSTOMER_REQUEST, SKIP_LIMIT)
        source: computed
        required: false
        description: Populated when status becomes PAUSED.
      - name: status
        type: enum(ACTIVE, PAUSED, CANCELLED)
        source: system
        required: false
        default: ACTIVE
        description: Lifecycle state; see state machine auto_reorder_schedule_lifecycle.

  - name: ReturnRequest
    description: A torn-lens or prescription-change return whose settlement prorates unopened boxes plus partially used boxes under a rounding-granularity variant.
    common_fields: true
    fields:
      - name: order_id
        type: uuid
        source: input
        required: true
        description: FK -> Order.id. Order being returned against.
      - name: customer_id
        type: uuid
        source: input
        required: true
        description: FK -> Customer.id. Requesting patient; must own the order.
      - name: reason
        type: enum(TORN_LENS, PRESCRIPTION_CHANGE, WRONG_PARAMETER)
        source: input
        required: true
        description: Drives both the settlement variant and the settlement channel.
      - name: unopened_boxes
        type: integer
        source: input
        required: false
        default: 0
        description: Fully unopened boxes returned. Must be >= 0.
      - name: opened_box_used_counts
        type: array[integer]
        source: input
        required: false
        default: []
        description: Lenses already used in each opened box returned, one element per opened box.
      - name: torn_lens_count
        type: integer
        source: input
        required: false
        description: Lenses reported torn; required when reason is TORN_LENS.
      - name: settlement_mode
        type: enum(PER_BOX_ROUNDED, POOLED_ROUNDED, NO_PRORATION)
        source: computed
        required: false
        description: Rounding granularity variant selected from reason.
      - name: settlement_cents
        type: integer
        source: computed
        required: false
        description: Amount owed to the customer. See calculation return_settlement_cents.
      - name: settlement_channel
        type: enum(CASH_REFUND, STORE_CREDIT)
        source: computed
        required: false
        description: TORN_LENS settles to STORE_CREDIT; other reasons settle to CASH_REFUND.
      - name: approved_by_user_id
        type: string
        source: computed
        required: false
        description: X-User-ID that approved the request.
      - name: settled_by_user_id
        type: string
        source: computed
        required: false
        description: X-User-ID that settled the request; must differ from approved_by_user_id.
      - name: rejection_reason
        type: string
        source: computed
        required: false
        description: Populated when the request is rejected.
      - name: status
        type: enum(SUBMITTED, APPROVED, REJECTED, SETTLED)
        source: system
        required: false
        default: SUBMITTED
        description: Lifecycle state; see state machine return_request_lifecycle.

  - name: ReimbursementClaim
    description: An out-of-network reimbursement packet whose money is computed in a fixed eight-step order and whose allowance consumption is released on void.
    common_fields: true
    fields:
      - name: order_id
        type: uuid
        source: input
        required: true
        description: FK -> Order.id. Delivered order being claimed.
      - name: customer_id
        type: uuid
        source: input
        required: true
        description: FK -> Customer.id. Claimant.
      - name: insurance_plan_id
        type: uuid
        source: input
        required: true
        description: FK -> InsurancePlan.id. Plan snapshot the claim was priced against.
      - name: refund_offset_cents
        type: integer
        source: computed
        required: false
        default: 0
        description: Sum of SETTLED settlement_cents on the order, subtracted before allowance application.
      - name: base_eligible_cents
        type: integer
        source: computed
        required: false
        description: Step 3 of the claim calculation.
      - name: applied_allowance_cents
        type: integer
        source: computed
        required: false
        description: Step 5 of the claim calculation.
      - name: coinsurance_cents
        type: integer
        source: computed
        required: false
        description: Step 6 of the claim calculation.
      - name: pre_fee_subtotal_cents
        type: integer
        source: computed
        required: false
        description: Step 7 of the claim calculation; the value the processing-fee tier is keyed on.
      - name: processing_fee_cents
        type: integer
        source: computed
        required: false
        description: Tiered fee deducted from the pre-fee subtotal.
      - name: reimbursable_cents
        type: integer
        source: computed
        required: false
        description: Final amount the plan will reimburse. See calculation insurance_reimbursable_cents.
      - name: packet_reference
        type: string
        source: computed
        required: false
        description: Generated paperwork identifier; populated on generation.
      - name: submitted_at
        type: timestamp
        source: computed
        required: false
        description: Logical clock value at submission.
      - name: voided_reason
        type: enum(DISPUTE_UPHELD, CUSTOMER_REQUEST, PLAN_RETIRED)
        source: computed
        required: false
        description: Populated when the claim is voided.
      - name: status
        type: enum(DRAFT, GENERATED, SUBMITTED, VOIDED)
        source: system
        required: false
        default: DRAFT
        description: Lifecycle state; see state machine reimbursement_claim_lifecycle.

  - name: PrescriberDispute
    description: A prescriber challenge to a prescription whose upholding cascades through invalidation, order cancellation and claim voiding.
    common_fields: true
    fields:
      - name: prescription_id
        type: uuid
        source: input
        required: true
        description: FK -> Prescription.id. Disputed prescription.
      - name: prescriber_id
        type: uuid
        source: input
        required: true
        description: FK -> Prescriber.id. Filing prescriber.
      - name: dispute_reason
        type: enum(NOT_MY_PATIENT, PARAMETERS_ALTERED, NEVER_ISSUED)
        source: input
        required: true
        description: Grounds for the dispute.
      - name: resolution
        type: enum(UPHELD, DISMISSED)
        source: computed
        required: false
        description: Populated at resolution.
      - name: resolved_by_user_id
        type: string
        source: computed
        required: false
        description: X-User-ID of the compliance officer who resolved the dispute.
      - name: status
        type: enum(OPEN, UPHELD, DISMISSED)
        source: system
        required: false
        default: OPEN
        description: Lifecycle state; see state machine prescriber_dispute_lifecycle.

  - name: ComplianceEvent
    description: Append-only audit record of every compliance-relevant transition against a prescription.
    common_fields: false
    fields:
      - name: id
        type: uuid
        source: system
        required: false
        description: Immutable identifier.
      - name: prescription_id
        type: uuid
        source: input
        required: true
        description: FK -> Prescription.id. Prescription the event belongs to.
      - name: event_type
        type: enum(RX_SUBMITTED, REQUEST_SENT, RESPONSE_RECEIVED, PASSIVE_PROMOTED, RX_EXPIRED, RX_INVALIDATED, HOLD_OPENED, HOLD_RELEASED, HOLD_ESCALATED, ORDER_BLOCKED, ORDER_CANCELLED, SUBSTITUTION_APPLIED, DISPUTE_FILED, DISPUTE_RESOLVED, CLAIM_VOIDED, SCHEDULE_PAUSED)
        source: input
        required: true
        description: Kind of compliance event.
      - name: subject_type
        type: string
        source: input
        required: true
        description: Entity name the event concerns, e.g. Order.
      - name: subject_id
        type: string
        source: input
        required: true
        description: Identifier of the subject row.
      - name: actor_role
        type: string
        source: system
        required: false
        description: Role that caused the event, or "System" for sweeps and cascades.
      - name: actor_user_id
        type: string
        source: system
        required: false
        description: X-User-ID that caused the event, or "system".
      - name: detail
        type: string
        source: input
        required: false
        description: Human-readable note.
      - name: occurred_at
        type: timestamp
        source: system
        required: false
        description: Logical clock value when the event was recorded.

state_machines:
  - name: prescription_lifecycle
    entity: Prescription
    initial_state: DRAFT
    terminal_states: [INVALIDATED, EXPIRED]
    description: Branching submit fork plus a correction loop capped at MAX_VERIFICATION_ROUNDS (3).
    transitions:
      - from: DRAFT
        to: VERIFIED_ACTIVE
        trigger: POST /prescriptions/{id}/submit
        preconditions:
          - capture_mode is UPLOAD
          - document_reference is present
          - expiry_date is strictly after the current logical date
          - no other VERIFIED_ACTIVE or PENDING_VERIFICATION prescription of the same customer has a validity interval overlapping [issue_date, expiry_date) unless supersedes_prescription_id names one of them
        side_effects:
          - Append ComplianceEvent RX_SUBMITTED with detail "upload accepted"
          - If supersedes_prescription_id is set, transition that prescription to INVALIDATED and cancel its ACTIVE schedules
      - from: DRAFT
        to: PENDING_VERIFICATION
        trigger: POST /prescriptions/{id}/submit
        preconditions:
          - capture_mode is DOCTOR_LOOKUP or SELF_REPORT
          - prescriber_id is present when capture_mode is DOCTOR_LOOKUP
          - self_reported_prescriber_name is present when capture_mode is SELF_REPORT
          - expiry_date is strictly after the current logical date
        side_effects:
          - Append ComplianceEvent RX_SUBMITTED with detail "awaiting prescriber verification"
      - from: PENDING_VERIFICATION
        to: VERIFIED_ACTIVE
        trigger: POST /verification-requests/{id}/respond with response_type CONFIRMED
        preconditions:
          - The verification request belongs to this prescription and is in status SENT
        side_effects:
          - Set the verification request status to CONFIRMED and response_type to CONFIRMED
          - Append ComplianceEvent RESPONSE_RECEIVED
          - Set verification_state to RX_CLEARED on every RX_PENDING order against this prescription, ordered by created_at ascending
      - from: PENDING_VERIFICATION
        to: VERIFIED_ACTIVE
        trigger: POST /compliance/verification-sweep
        preconditions:
          - A verification request for this prescription is in status SENT
          - The current logical time is greater than or equal to that request passive_deadline_at
        side_effects:
          - Set the verification request status to PASSIVE_TIMEOUT
          - Append ComplianceEvent PASSIVE_PROMOTED
          - Set verification_state to RX_CLEARED on every RX_PENDING order against this prescription, ordered by created_at ascending
      - from: PENDING_VERIFICATION
        to: CORRECTION_PENDING
        trigger: POST /verification-requests/{id}/respond with response_type CORRECTED
        preconditions:
          - The verification request belongs to this prescription and is in status SENT
          - corrected_od_sphere and corrected_os_sphere are present
        side_effects:
          - Set the verification request status to CORRECTED and response_type to CORRECTED
          - Overwrite od_sphere and os_sphere with the corrected values
          - Append ComplianceEvent RESPONSE_RECEIVED with detail "parameters corrected"
      - from: PENDING_VERIFICATION
        to: PENDING_VERIFICATION
        trigger: POST /prescriptions/{id}/verification-requests
        preconditions:
          - verification_rounds is strictly less than MAX_VERIFICATION_ROUNDS
          - The prescriber status is ACTIVE and has fewer than 3 verification requests in status SENT
          - No verification request for this prescriber and this prescription was sent within the closed 4-business-hour cooldown window
        side_effects:
          - Create a VerificationRequest with round_number equal to verification_rounds plus one
          - Increment verification_rounds
          - Append ComplianceEvent REQUEST_SENT
      - from: CORRECTION_PENDING
        to: PENDING_VERIFICATION
        trigger: POST /prescriptions/{id}/verification-requests
        preconditions:
          - verification_rounds is strictly less than MAX_VERIFICATION_ROUNDS
          - The prescriber has fewer than 3 verification requests in status SENT
          - No verification request for this prescriber and this prescription was sent within the closed 4-business-hour cooldown window
        side_effects:
          - Create a VerificationRequest with round_number equal to verification_rounds plus one
          - Increment verification_rounds
          - Append ComplianceEvent REQUEST_SENT
      - from: PENDING_VERIFICATION
        to: INVALIDATED
        trigger: POST /verification-requests/{id}/respond with response_type DENIED
        preconditions:
          - The verification request belongs to this prescription and is in status SENT
        side_effects:
          - Set the verification request status to DENIED and response_type to DENIED
          - Append ComplianceEvent RX_INVALIDATED
          - Create a ReorderHold with reason PRESCRIBER_DENIED in status OPEN, opened_by_user_id "system"
          - Set verification_state to RX_BLOCKED on every order against this prescription whose fulfillment_state is PENDING
          - Transition every ACTIVE schedule on this prescription to PAUSED with pause_reason HOLD_OPEN, ordered by created_at ascending
          - Recompute Customer open_hold_count, active_schedule_count and auto_reorder_enabled
      - from: CORRECTION_PENDING
        to: INVALIDATED
        trigger: POST /prescriptions/{id}/invalidate
        preconditions:
          - The caller is a ComplianceOfficer or PlatformAdmin
        side_effects:
          - Append ComplianceEvent RX_INVALIDATED
          - Create a ReorderHold with reason MANUAL in status OPEN
          - Recompute Customer open_hold_count and auto_reorder_enabled
      - from: VERIFIED_ACTIVE
        to: INVALIDATED
        trigger: POST /prescriber-disputes/{id}/resolve with resolution UPHELD
        preconditions:
          - The dispute names this prescription and is in status OPEN
        side_effects:
          - Append ComplianceEvent RX_INVALIDATED
          - Cancel every order against this prescription whose fulfillment_state is PENDING with cancellation_reason DISPUTE_UPHELD, ordered by created_at ascending
          - Set recall_flagged true on every order against this prescription whose fulfillment_state is SHIPPED or DELIVERED
          - Void every ReimbursementClaim on the cancelled or recall-flagged orders whose status is DRAFT, GENERATED or SUBMITTED with voided_reason DISPUTE_UPHELD
          - Recompute Customer allowance_used_cents, lifetime_charged_cents and net_cash_position_cents
      - from: VERIFIED_ACTIVE
        to: EXPIRED
        trigger: POST /compliance/verification-sweep
        preconditions:
          - expiry_date is less than or equal to the current logical date
        side_effects:
          - Append ComplianceEvent RX_EXPIRED
          - Create a ReorderHold with reason PRESCRIPTION_EXPIRED in status OPEN, opened_by_user_id "system"
          - Transition every ACTIVE schedule on this prescription to PAUSED with pause_reason HOLD_OPEN
          - Recompute Customer open_hold_count, active_schedule_count and auto_reorder_enabled

  - name: verification_request_lifecycle
    entity: VerificationRequest
    initial_state: SENT
    terminal_states: [CONFIRMED, CORRECTED, DENIED, PASSIVE_TIMEOUT]
    description: Branching fork on the prescriber response, with a fourth branch reached only by the passive clock.
    transitions:
      - from: SENT
        to: CONFIRMED
        trigger: POST /verification-requests/{id}/respond with response_type CONFIRMED
        preconditions:
          - The current logical time is strictly before passive_deadline_at
          - The responding Prescriber identity equals prescriber_id
        side_effects:
          - Set response_type to CONFIRMED
          - Promote the prescription to VERIFIED_ACTIVE
      - from: SENT
        to: CORRECTED
        trigger: POST /verification-requests/{id}/respond with response_type CORRECTED
        preconditions:
          - The current logical time is strictly before passive_deadline_at
          - The responding Prescriber identity equals prescriber_id
        side_effects:
          - Set response_type to CORRECTED
          - Move the prescription to CORRECTION_PENDING and overwrite its spheres
      - from: SENT
        to: DENIED
        trigger: POST /verification-requests/{id}/respond with response_type DENIED
        preconditions:
          - The current logical time is strictly before passive_deadline_at
          - The responding Prescriber identity equals prescriber_id
        side_effects:
          - Set response_type to DENIED
          - Invalidate the prescription and open a PRESCRIBER_DENIED hold
      - from: SENT
        to: PASSIVE_TIMEOUT
        trigger: POST /compliance/verification-sweep
        preconditions:
          - The current logical time is greater than or equal to passive_deadline_at
        side_effects:
          - Leave response_type null
          - Promote the prescription to VERIFIED_ACTIVE

  - name: order_verification_state
    entity: Order
    initial_state: RX_PENDING
    terminal_states: [RX_BLOCKED]
    description: First of two independent Order dimensions; changes without touching fulfillment_state.
    transitions:
      - from: RX_PENDING
        to: RX_CLEARED
        trigger: POST /verification-requests/{id}/respond with response_type CONFIRMED
        preconditions:
          - The order prescription reaches VERIFIED_ACTIVE
        side_effects:
          - Append ComplianceEvent RESPONSE_RECEIVED for subject_type Order
      - from: RX_PENDING
        to: RX_CLEARED
        trigger: POST /compliance/verification-sweep
        preconditions:
          - The order prescription is promoted to VERIFIED_ACTIVE by the passive clock
        side_effects:
          - Append ComplianceEvent PASSIVE_PROMOTED for subject_type Order
      - from: RX_PENDING
        to: RX_BLOCKED
        trigger: POST /verification-requests/{id}/respond with response_type DENIED
        preconditions:
          - fulfillment_state is PENDING
        side_effects:
          - Append ComplianceEvent ORDER_BLOCKED
      - from: RX_CLEARED
        to: RX_BLOCKED
        trigger: POST /compliance/verification-sweep
        preconditions:
          - The order prescription transitions to EXPIRED and fulfillment_state is PENDING
        side_effects:
          - Append ComplianceEvent ORDER_BLOCKED with detail "prescription expired"

  - name: order_fulfillment_state
    entity: Order
    initial_state: PENDING
    terminal_states: [DELIVERED, CANCELLED]
    description: Second independent Order dimension; shipping requires the other dimension to be RX_CLEARED but does not alter it.
    transitions:
      - from: PENDING
        to: SHIPPED
        trigger: POST /orders/{id}/ship
        preconditions:
          - verification_state is RX_CLEARED
          - The customer has no ReorderHold in status OPEN
        side_effects:
          - Set shipped_at to the current logical time
      - from: SHIPPED
        to: DELIVERED
        trigger: POST /orders/{id}/deliver
        preconditions:
          - shipped_at is present
        side_effects:
          - Set delivered_at to the current logical time, opening the claim window
      - from: PENDING
        to: CANCELLED
        trigger: POST /orders/{id}/cancel
        preconditions:
          - fulfillment_state is PENDING
        side_effects:
          - Set cancellation_reason from the request
          - Decrement Prescription boxes_consumed by boxes_od plus boxes_os
          - Recompute Customer lifetime_charged_cents and net_cash_position_cents
          - Void every ReimbursementClaim on this order whose status is DRAFT, GENERATED or SUBMITTED
          - Append ComplianceEvent ORDER_CANCELLED
      - from: PENDING
        to: CANCELLED
        trigger: POST /prescriber-disputes/{id}/resolve with resolution UPHELD
        preconditions:
          - The order prescription is invalidated by the resolution
        side_effects:
          - Set cancellation_reason to DISPUTE_UPHELD and apply the same ledger and claim compensations

  - name: reorder_hold_lifecycle
    entity: ReorderHold
    initial_state: OPEN
    terminal_states: [RELEASED, ESCALATED]
    description: Release is gated by segregation of duties and by the absence of an open dispute.
    transitions:
      - from: OPEN
        to: RELEASED
        trigger: POST /reorder-holds/{id}/release
        preconditions:
          - The releasing X-User-ID differs from opened_by_user_id
          - No PrescriberDispute on the same prescription is in status OPEN
          - The prescription status is VERIFIED_ACTIVE
        side_effects:
          - Set released_by_user_id
          - Recompute Customer open_hold_count and auto_reorder_enabled
          - Append ComplianceEvent HOLD_RELEASED
      - from: OPEN
        to: ESCALATED
        trigger: POST /reorder-holds/{id}/escalate
        preconditions:
          - The caller is a ComplianceOfficer or PlatformAdmin
        side_effects:
          - Set escalated_reason
          - Recompute Customer open_hold_count and auto_reorder_enabled
          - Append ComplianceEvent HOLD_ESCALATED

  - name: auto_reorder_schedule_lifecycle
    entity: AutoReorderSchedule
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    description: Cyclic ACTIVE and PAUSED loop; cancellation is reachable from either state.
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: POST /auto-reorder-schedules/{id}/pause
        preconditions:
          - status is ACTIVE
        side_effects:
          - Set pause_reason to CUSTOMER_REQUEST
          - Recompute Customer active_schedule_count and auto_reorder_enabled
      - from: ACTIVE
        to: PAUSED
        trigger: POST /fulfillment/auto-reorder-run
        preconditions:
          - consecutive_skip_count reaches MAX_CONSECUTIVE_SKIPS
        side_effects:
          - Set pause_reason to SKIP_LIMIT
          - Append ComplianceEvent SCHEDULE_PAUSED
          - Recompute Customer active_schedule_count and auto_reorder_enabled
      - from: ACTIVE
        to: PAUSED
        trigger: POST /verification-requests/{id}/respond with response_type DENIED
        preconditions:
          - A ReorderHold is opened for the schedule customer
        side_effects:
          - Set pause_reason to HOLD_OPEN
          - Append ComplianceEvent SCHEDULE_PAUSED
          - Recompute Customer active_schedule_count and auto_reorder_enabled
      - from: PAUSED
        to: ACTIVE
        trigger: POST /auto-reorder-schedules/{id}/resume
        preconditions:
          - The customer has no ReorderHold in status OPEN
          - The prescription status is VERIFIED_ACTIVE
        side_effects:
          - Clear pause_reason and reset consecutive_skip_count to 0
          - Recompute Customer active_schedule_count and auto_reorder_enabled
      - from: ACTIVE
        to: CANCELLED
        trigger: POST /prescriptions/{id}/submit
        preconditions:
          - The submitted prescription supersedes the schedule prescription
        side_effects:
          - Recompute Customer active_schedule_count and auto_reorder_enabled
      - from: PAUSED
        to: CANCELLED
        trigger: POST /auto-reorder-schedules/{id}/cancel
        preconditions:
          - status is PAUSED
        side_effects:
          - Recompute Customer active_schedule_count and auto_reorder_enabled

  - name: return_request_lifecycle
    entity: ReturnRequest
    initial_state: SUBMITTED
    terminal_states: [REJECTED, SETTLED]
    description: Approval and settlement must be performed by different users; settlement is where money moves.
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /return-requests/{id}/approve
        preconditions:
          - The order fulfillment_state is SHIPPED or DELIVERED
        side_effects:
          - Set approved_by_user_id
          - Freeze settlement_mode and settlement_cents from the calculation
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /return-requests/{id}/reject
        preconditions:
          - status is SUBMITTED
        side_effects:
          - Set rejection_reason
      - from: APPROVED
        to: SETTLED
        trigger: POST /return-requests/{id}/settle
        preconditions:
          - The settling X-User-ID differs from approved_by_user_id
          - settlement_cents does not exceed the order total_cents less prior settlements
        side_effects:
          - Set settled_by_user_id
          - Credit store_credit_cents when settlement_channel is STORE_CREDIT, else increase lifetime_refunded_cents
          - Recompute Customer net_cash_position_cents
          - Set refund_offset_cents on every DRAFT claim on the order

  - name: reimbursement_claim_lifecycle
    entity: ReimbursementClaim
    initial_state: DRAFT
    terminal_states: [VOIDED]
    description: Allowance is consumed at generation and released at void.
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: POST /reimbursement-claims/{id}/generate
        preconditions:
          - The order fulfillment_state is DELIVERED
          - The plan network_status is OUT_OF_NETWORK and status is ACTIVE
          - The remaining plan-year allowance is strictly greater than 0
        side_effects:
          - Compute all eight money steps and set packet_reference
          - Increase Customer allowance_used_cents by applied_allowance_cents
      - from: GENERATED
        to: SUBMITTED
        trigger: POST /reimbursement-claims/{id}/submit
        preconditions:
          - packet_reference is present
          - The current logical date is within claim_window_days of delivered_at
        side_effects:
          - Set submitted_at
      - from: GENERATED
        to: VOIDED
        trigger: POST /reimbursement-claims/{id}/void
        preconditions:
          - status is GENERATED
        side_effects:
          - Decrease Customer allowance_used_cents by applied_allowance_cents
          - Append ComplianceEvent CLAIM_VOIDED
      - from: SUBMITTED
        to: VOIDED
        trigger: POST /prescriber-disputes/{id}/resolve with resolution UPHELD
        preconditions:
          - The claim order is cancelled or recall-flagged by the cascade
        side_effects:
          - Set voided_reason to DISPUTE_UPHELD
          - Decrease Customer allowance_used_cents by applied_allowance_cents
          - Append ComplianceEvent CLAIM_VOIDED
      - from: DRAFT
        to: VOIDED
        trigger: POST /orders/{id}/cancel
        preconditions:
          - The claim order is cancelled
        side_effects:
          - Set voided_reason to CUSTOMER_REQUEST

  - name: prescriber_dispute_lifecycle
    entity: PrescriberDispute
    initial_state: OPEN
    terminal_states: [UPHELD, DISMISSED]
    description: The upheld branch is the deepest cascade in the system.
    transitions:
      - from: OPEN
        to: UPHELD
        trigger: POST /prescriber-disputes/{id}/resolve with resolution UPHELD
        preconditions:
          - The caller is a ComplianceOfficer or PlatformAdmin
        side_effects:
          - Set resolution and resolved_by_user_id
          - Invalidate the prescription, cancel its PENDING orders, void their claims and recompute the customer ledgers
          - Append ComplianceEvent DISPUTE_RESOLVED
      - from: OPEN
        to: DISMISSED
        trigger: POST /prescriber-disputes/{id}/resolve with resolution DISMISSED
        preconditions:
          - The caller is a ComplianceOfficer or PlatformAdmin
        side_effects:
          - Set resolution and resolved_by_user_id
          - Leave the prescription, its orders and its claims untouched
          - Append ComplianceEvent DISPUTE_RESOLVED

concurrency_rules:
  - name: substitution-stale-order
    parent_entity: Order
    write_endpoint: POST /orders/{id}/substitution
    occ_field: expected_order_version
    error_id: ERR_STALE_ORDER_VERSION
    status_code: 412
    description: A substitution write must carry the Order version the caller last read. If the stored version differs, the write is rejected and no field changes.

  - name: dispute-file-stale-prescription
    parent_entity: Prescription
    write_endpoint: POST /prescriber-disputes
    occ_field: expected_prescription_version
    error_id: ERR_STALE_PRESCRIPTION_VERSION
    status_code: 412
    description: Filing a dispute must carry the Prescription version the prescriber last read. If the stored version differs, no dispute row is created.

calculations:
  - name: order_total_cents
    entity: Order
    algorithm_type: threshold
    description: Prices an order from the price and lens-count snapshot taken at creation, then applies free shipping at an inclusive threshold.
    constants:
      FREE_SHIPPING_THRESHOLD_CENTS: 5000
      STANDARD_SHIPPING_CENTS: 695
    input_set: The order boxes_od and boxes_os plus the ordered Product unit_price_cents snapshot; later repricing of the Product never changes an existing order.
    precision: Integer cents; no rounding required.
    formula:
      - step: 1
        expression: total_boxes = boxes_od + boxes_os
      - step: 2
        expression: unit_price_cents = ordered Product unit_price_cents at creation time
      - step: 3
        expression: subtotal_cents = unit_price_cents * total_boxes
      - step: 4
        expression: shipping_cents = 0 when subtotal_cents >= FREE_SHIPPING_THRESHOLD_CENTS else STANDARD_SHIPPING_CENTS
      - step: 5
        expression: total_cents = subtotal_cents + shipping_cents
    worked_examples:
      - inputs: unit_price_cents 3200, boxes_od 1, boxes_os 1
        result: subtotal_cents 6400, shipping_cents 0, total_cents 6400
      - inputs: unit_price_cents 3200, boxes_od 1, boxes_os 0
        result: subtotal_cents 3200, shipping_cents 695, total_cents 3895
      - inputs: unit_price_cents 2500, boxes_od 1, boxes_os 1
        result: subtotal_cents 5000, shipping_cents 0, total_cents 5000 (exact threshold is free)
      - inputs: unit_price_cents 1700, boxes_od 1, boxes_os 2
        result: subtotal_cents 5100, shipping_cents 0, total_cents 5100

  - name: parameter_deviation_index
    entity: Order
    algorithm_type: weighted_scoring
    description: Weighted fitting distance between the prescription and the product actually fulfilled, computed entirely in integer hundredths so no binary-floating-point residue can shift a boundary decision.
    constants:
      WEIGHT_BASE_CURVE: 4
      WEIGHT_DIAMETER: 2
      WEIGHT_SPHERE_PER_EYE: 1
      AUTO_APPROVE_MAX_INDEX: 0.50
      CONSENT_MAX_INDEX: 1.00
    input_set: Prescription base_curve, diameter, od_sphere and os_sphere versus the fulfilled Product base_curve and diameter and the post-snapping fulfilled spheres.
    precision: Compute in integer hundredths, then divide by 100 and present with 2 decimal places.
    formula:
      - step: 1
        expression: 'h(v) = round_half_up(v * 100) as an integer'
      - step: 2
        expression: 'fulfilled_od_sphere = the multiple of fulfilled Product sphere_step nearest to Prescription od_sphere; an exact tie resolves away from zero (the stronger power). Same rule for fulfilled_os_sphere.'
      - step: 3
        expression: 'd_raw = WEIGHT_BASE_CURVE * abs(h(rx.base_curve) - h(product.base_curve)) + WEIGHT_DIAMETER * abs(h(rx.diameter) - h(product.diameter)) + WEIGHT_SPHERE_PER_EYE * abs(h(rx.od_sphere) - h(fulfilled_od_sphere)) + WEIGHT_SPHERE_PER_EYE * abs(h(rx.os_sphere) - h(fulfilled_os_sphere))'
      - step: 4
        expression: parameter_deviation_index = d_raw / 100
      - step: 5
        expression: 'A substitution is auto-approved when parameter_deviation_index <= AUTO_APPROVE_MAX_INDEX; it requires patient_consent true when the index is above AUTO_APPROVE_MAX_INDEX and <= CONSENT_MAX_INDEX; it is rejected when the index exceeds CONSENT_MAX_INDEX.'
    worked_examples:
      - inputs: rx bc 8.60 dia 14.20 od -2.25 os -4.00; product bc 8.60 dia 14.20 step 0.25
        result: 0.00
      - inputs: rx bc 8.60 dia 14.20 od -2.25 os -4.00; product bc 8.70 dia 14.20 step 0.25
        result: 0.40
      - inputs: rx bc 8.60 dia 14.20 od -2.25 os -4.00; product bc 8.70 dia 14.25 step 0.25
        result: 0.50 exactly, which is auto-approved because the comparison is inclusive
      - inputs: rx bc 8.60 dia 14.20 od -2.25 os -4.00; product bc 8.75 dia 14.30 step 0.25
        result: 0.80, inside the consent band
      - inputs: rx bc 8.60 dia 14.20 od -2.25 os -4.00; product bc 8.80 dia 14.40 step 0.25
        result: 1.20, above CONSENT_MAX_INDEX
      - inputs: rx bc 8.60 dia 14.20 od -2.25 os -4.00; product bc 8.60 dia 14.20 step 0.50
        result: 0.25 with fulfilled_od_sphere -2.50 and fulfilled_os_sphere -4.00, substitution_type PARAMETER_ROUNDED

  - name: passive_verification_deadline
    entity: VerificationRequest
    algorithm_type: chronological
    description: Advances a business-hour clock from the send instant to produce the passive-verification deadline. Silence past the deadline is treated as prescriber agreement.
    constants:
      BUSINESS_DAY_START_UTC: "08:00"
      BUSINESS_DAY_END_UTC: "17:00"
      BUSINESS_HOURS_PER_DAY: 9
      DIRECTORY_VERIFIED_BUSINESS_HOURS: 8
      SELF_REPORTED_BUSINESS_HOURS: 12
      CONTACT_COOLDOWN_BUSINESS_HOURS: 4
      BUSINESS_DAYS: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY]
    input_set: The logical send instant plus the Prescriber directory_verified flag.
    precision: Millisecond-resolution ISO-8601 UTC timestamps.
    formula:
      - step: 1
        expression: 'budget_hours = DIRECTORY_VERIFIED_BUSINESS_HOURS when the prescriber directory_verified is true, else SELF_REPORTED_BUSINESS_HOURS'
      - step: 2
        expression: 'cursor = sent_at, then normalise: if cursor falls before BUSINESS_DAY_START_UTC on a business day, move it to that day start; if it falls at or after BUSINESS_DAY_END_UTC or on a non-business day, move it to the start of the next business day.'
      - step: 3
        expression: 'While budget_hours > 0, consume min(budget_hours, hours remaining until BUSINESS_DAY_END_UTC) from the cursor; if budget remains, jump the cursor to the next business day start.'
      - step: 4
        expression: passive_verification_deadline = the resulting cursor
      - step: 5
        expression: The same walk with CONTACT_COOLDOWN_BUSINESS_HOURS from a prior send instant produces the closed end of the per-prescriber-per-prescription contact cooldown window.
    worked_examples:
      - inputs: sent_at 2026-09-08T10:00:00Z, directory_verified true (8 business hours)
        result: "2026-09-09T09:00:00.000Z"
      - inputs: sent_at 2026-09-08T10:00:00Z, directory_verified false (12 business hours)
        result: "2026-09-09T13:00:00.000Z"
      - inputs: sent_at 2026-09-04T14:00:00Z (Friday), directory_verified true
        result: "2026-09-07T13:00:00.000Z"
      - inputs: sent_at 2026-09-04T14:00:00Z (Friday), directory_verified false
        result: "2026-09-07T17:00:00.000Z"
      - inputs: sent_at 2026-09-07T09:00:00Z, directory_verified true
        result: '"2026-09-07T17:00:00.000Z", exactly the business day end'
      - inputs: sent_at 2026-08-01T00:00:00Z (Saturday, the default clock), directory_verified true
        result: "2026-08-03T16:00:00.000Z"
      - inputs: cooldown walk of 4 business hours from 2026-09-08T10:00:00Z
        result: '"2026-09-08T14:00:00.000Z" is the inclusive end of the blocked window'

  - name: return_settlement_cents
    entity: ReturnRequest
    algorithm_type: aggregation
    description: Settles a return by prorating unopened boxes at full value and opened boxes by their unused lens residue. The two prorating variants differ only in whether rounding happens per box or once over the pooled residue, which is enough to shift the settlement by a cent on the same physical return.
    constants:
      TORN_LENS_CAP_RATE: 0.20
    variants:
      - name: PER_BOX_ROUNDED
        applies_when: reason is PRESCRIPTION_CHANGE
        description: Each opened box residue is rounded to cents independently and then summed.
      - name: POOLED_ROUNDED
        applies_when: reason is WRONG_PARAMETER
        description: All opened box residues are summed exactly and the single total is rounded once.
      - name: NO_PRORATION
        applies_when: reason is TORN_LENS
        description: No box residue is considered; only the torn lens count matters, capped as a share of the order total.
    input_set: Order unit_price_cents and lenses_per_box_at_capture snapshots, the return unopened_boxes, opened_box_used_counts and torn_lens_count.
    precision: Integer cents; round_half_up wherever a division is rounded.
    formula:
      - step: 1
        expression: 'unit = Order.unit_price_cents; lpb = Order.lenses_per_box_at_capture'
      - step: 2
        expression: 'unopened_component = unopened_boxes * unit'
      - step: 3
        expression: 'PER_BOX_ROUNDED: opened_component = sum over each element used_i of opened_box_used_counts of round_half_up(unit * (lpb - used_i) / lpb)'
      - step: 4
        expression: 'POOLED_ROUNDED: opened_component = round_half_up(unit * sum over used_i of (lpb - used_i) / lpb)'
      - step: 5
        expression: 'NO_PRORATION: settlement_cents = min(round_half_up(torn_lens_count * unit / lpb), floor(Order.total_cents * TORN_LENS_CAP_RATE))'
      - step: 6
        expression: 'For the two prorating variants, settlement_cents = unopened_component + opened_component'
      - step: 7
        expression: 'settlement_channel = STORE_CREDIT when reason is TORN_LENS, else CASH_REFUND'
    worked_examples:
      - inputs: unit 3200, lpb 30, unopened_boxes 0, opened_box_used_counts [7, 7, 7], reason PRESCRIPTION_CHANGE
        result: 'each box residue 2453.333 rounds to 2453, so settlement_cents 7359'
      - inputs: unit 3200, lpb 30, unopened_boxes 0, opened_box_used_counts [7, 7, 7], reason WRONG_PARAMETER
        result: 'pooled residue is exactly 7360.000, so settlement_cents 7360'
      - inputs: unit 3200, lpb 30, unopened_boxes 0, opened_box_used_counts [11, 11, 11], reason PRESCRIPTION_CHANGE
        result: 'each box residue 2026.667 rounds to 2027, so settlement_cents 6081'
      - inputs: unit 3200, lpb 30, unopened_boxes 0, opened_box_used_counts [11, 11, 11], reason WRONG_PARAMETER
        result: 'pooled residue 6080.000, so settlement_cents 6080'
      - inputs: unit 3200, lpb 30, torn_lens_count 7, order total_cents 6400, reason TORN_LENS
        result: '746.667 rounds to 747, under the cap of 1280, so settlement_cents 747 as STORE_CREDIT'
      - inputs: unit 3200, lpb 30, torn_lens_count 13, order total_cents 6400, reason TORN_LENS
        result: '1386.667 rounds to 1387 but the cap floor(6400 * 0.20) = 1280 binds, so settlement_cents 1280'

  - name: insurance_reimbursable_cents
    entity: ReimbursementClaim
    algorithm_type: tiered_pricing
    description: Prices an out-of-network reimbursement packet in a fixed eight-step order. The processing fee tier is keyed on pre_fee_subtotal_cents, not on the order subtotal and not on the final reimbursable amount, so any reordering of the steps yields a different tier on the same order.
    constants:
      FEE_TIER_1_MAX_CENTS: 5000
      FEE_TIER_1_CENTS: 0
      FEE_TIER_2_MAX_CENTS: 15000
      FEE_TIER_2_CENTS: 250
      FEE_TIER_3_CENTS: 500
    input_set: The delivered Order, all SETTLED ReturnRequests on that order, the InsurancePlan snapshot and the Customer allowance_used_cents for the current plan year.
    precision: Integer cents; round_half_up on the coinsurance multiplication.
    formula:
      - step: 1
        expression: 'gross_cents = Order.subtotal_cents + (Order.shipping_cents when plan.covers_shipping is true, else 0)'
      - step: 2
        expression: 'refund_offset_cents = sum of settlement_cents over ReturnRequests on this order in status SETTLED'
      - step: 3
        expression: 'base_eligible_cents = max(0, gross_cents - refund_offset_cents)'
      - step: 4
        expression: 'remaining_allowance_cents = max(0, plan.annual_allowance_cents - customer.allowance_used_cents)'
      - step: 5
        expression: 'applied_allowance_cents = min(base_eligible_cents, remaining_allowance_cents)'
      - step: 6
        expression: 'coinsurance_cents = round_half_up((base_eligible_cents - applied_allowance_cents) * plan.coinsurance_rate)'
      - step: 7
        expression: 'pre_fee_subtotal_cents = applied_allowance_cents + coinsurance_cents'
      - step: 8
        expression: 'processing_fee_cents = FEE_TIER_1_CENTS when pre_fee_subtotal_cents <= FEE_TIER_1_MAX_CENTS, FEE_TIER_2_CENTS when pre_fee_subtotal_cents <= FEE_TIER_2_MAX_CENTS, else FEE_TIER_3_CENTS; reimbursable_cents = max(0, pre_fee_subtotal_cents - processing_fee_cents)'
    worked_examples:
      - inputs: subtotal 5100, shipping 0, covers_shipping false, allowance 15000, used 0, coinsurance_rate 0.20
        result: 'base 5100, applied 5100, coinsurance 0, pre_fee 5100, fee 250, reimbursable_cents 4850'
      - inputs: subtotal 5000, allowance 15000, used 0
        result: 'pre_fee 5000 sits exactly on the first tier ceiling so fee 0 and reimbursable_cents 5000'
      - inputs: subtotal 6400, allowance 15000, used 0, coinsurance_rate 0.20
        result: 'pre_fee 6400, fee 250, reimbursable_cents 6150'
      - inputs: subtotal 19200, allowance 15000, used 0, coinsurance_rate 0.20
        result: 'applied 15000, coinsurance 840, pre_fee 15840, fee 500, reimbursable_cents 15340'
      - inputs: subtotal 6400, allowance 15000, used 12000, coinsurance_rate 0.20
        result: 'remaining 3000, applied 3000, coinsurance 680, pre_fee 3680, fee 0, reimbursable_cents 3680'
      - inputs: subtotal 19200, allowance 15000, used 0, refund_offset 7359, coinsurance_rate 0.20
        result: 'base 11841, applied 11841, coinsurance 0, pre_fee 11841, fee 250, reimbursable_cents 11591'

  - name: auto_reorder_cadence
    entity: AutoReorderSchedule
    algorithm_type: threshold
    description: Derives the shipment interval from the wear schedule, or from observed consumption when the customer reports it, then pulls the interval forward by a fixed lead time and floors it.
    constants:
      MIN_CADENCE_DAYS: 14
      REORDER_LEAD_TIME_DAYS: 5
      DAYS_PER_LENS_DAILY_DISPOSABLE: 1
      DAYS_PER_LENS_BIWEEKLY: 14
      DAYS_PER_LENS_MONTHLY: 30
      MAX_CONSECUTIVE_SKIPS: 2
      RUN_HOUR_UTC: "08:00"
    variants:
      - name: NOMINAL
        applies_when: cadence_basis is NOMINAL
        description: Supply days are derived from the product wear schedule and lens count.
      - name: USAGE_ADJUSTED
        applies_when: cadence_basis is USAGE_ADJUSTED
        description: Supply days are taken from the customer-reported observed_days_per_box.
    input_set: The schedule boxes_per_run and anchor_date plus the Product wear_schedule and lenses_per_box.
    precision: Whole days; next_run_at is always at RUN_HOUR_UTC.
    formula:
      - step: 1
        expression: 'days_per_lens = DAYS_PER_LENS_DAILY_DISPOSABLE, DAYS_PER_LENS_BIWEEKLY or DAYS_PER_LENS_MONTHLY according to Product wear_schedule'
      - step: 2
        expression: 'NOMINAL: supply_days = boxes_per_run * Product.lenses_per_box * days_per_lens'
      - step: 3
        expression: 'USAGE_ADJUSTED: supply_days = boxes_per_run * observed_days_per_box'
      - step: 4
        expression: 'cadence_days = max(MIN_CADENCE_DAYS, supply_days - REORDER_LEAD_TIME_DAYS)'
      - step: 5
        expression: 'next_run_at = (anchor_date plus cadence_days) at RUN_HOUR_UTC'
      - step: 6
        expression: 'On each run the schedule advances next_run_at by cadence_days; a run that cannot ship increments consecutive_skip_count, and reaching MAX_CONSECUTIVE_SKIPS pauses the schedule with pause_reason SKIP_LIMIT.'
    worked_examples:
      - inputs: DAILY_DISPOSABLE, lenses_per_box 30, boxes_per_run 3, cadence_basis NOMINAL, anchor_date 2026-09-08
        result: 'supply_days 90, cadence_days 85, next_run_at "2026-12-02T08:00:00.000Z"'
      - inputs: DAILY_DISPOSABLE, lenses_per_box 30, boxes_per_run 1, cadence_basis USAGE_ADJUSTED, observed_days_per_box 40, anchor_date 2026-09-14
        result: 'supply_days 40, cadence_days 35, next_run_at "2026-10-19T08:00:00.000Z"'
      - inputs: MONTHLY, lenses_per_box 6, boxes_per_run 1, cadence_basis NOMINAL, anchor_date 2026-09-08
        result: 'supply_days 180, cadence_days 175'
      - inputs: DAILY_DISPOSABLE, lenses_per_box 30, boxes_per_run 1, cadence_basis USAGE_ADJUSTED, observed_days_per_box 16, anchor_date 2026-09-08
        result: 'supply_days 16, cadence_days 14 because MIN_CADENCE_DAYS floors the result'

  - name: customer_allowance_used_cents
    entity: Customer
    algorithm_type: aggregation
    description: Reconciles the plan-year allowance ledger from live claim rows, over a half-open plan-year window and an explicit claim status filter, so that voiding a claim releases exactly what generating it consumed.
    constants:
      INCLUDED_CLAIM_STATUSES: [GENERATED, SUBMITTED]
    input_set: All ReimbursementClaim rows for the customer whose created_at falls inside the current plan-year window and whose status is in INCLUDED_CLAIM_STATUSES. DRAFT and VOIDED claims contribute nothing.
    precision: Integer cents.
    formula:
      - step: 1
        expression: 'plan_year_start = the most recent occurrence of plan.plan_year_start_month_day at or before the current logical date'
      - step: 2
        expression: 'window = [plan_year_start, plan_year_start plus one year), half-open so a claim generated exactly on the next plan year start belongs to the next year'
      - step: 3
        expression: 'allowance_used_cents = sum of applied_allowance_cents over the customer claims inside the window whose status is in INCLUDED_CLAIM_STATUSES'
      - step: 4
        expression: 'This value is recomputed after every claim generation and every claim void; it is never incremented blindly.'
    worked_examples:
      - inputs: one GENERATED claim with applied_allowance_cents 5100 and one VOIDED claim with applied_allowance_cents 6400
        result: 5100
      - inputs: one SUBMITTED claim with applied_allowance_cents 15000
        result: 15000, leaving remaining allowance 0
      - inputs: no claims
        result: 0

validations:
  - priority: 1
    name: authenticated_caller_required
    category: auth
    applies_to: All endpoints
    condition: X-User-ID or X-Role header is absent or empty.
    error_id: ERR_UNAUTHENTICATED
    status_code: 401
  - priority: 2
    name: request_schema_wellformed
    category: schema
    applies_to: All endpoints with a request body or query parameters
    condition: A required field is absent, a field has the wrong type, an enum value is outside its domain, a numeric field is outside its declared range, or expiry_date is not a valid date.
    error_id: ERR_INVALID_REQUEST
    status_code: 400
  - priority: 3
    name: role_permitted_for_endpoint
    category: auth
    applies_to: All endpoints
    condition: The X-Role value is not listed in the endpoint roles.
    error_id: ERR_UNAUTHORIZED
    status_code: 403
  - priority: 4
    name: path_entity_exists
    category: referential
    applies_to: All endpoints with a path identifier
    condition: The identifier in the path does not name a stored row.
    error_id: The not-found code of the addressed entity, for example ERR_PRESCRIPTION_NOT_FOUND, ERR_ORDER_NOT_FOUND, ERR_REORDER_HOLD_NOT_FOUND
    status_code: 404
  - priority: 5
    name: body_reference_exists
    category: referential
    applies_to: All endpoints whose body carries a foreign key
    condition: A foreign key in the body does not name a stored row.
    error_id: The not-found code of the referenced entity, for example ERR_CUSTOMER_NOT_FOUND, ERR_PRODUCT_NOT_FOUND, ERR_INSURANCE_PLAN_NOT_FOUND
    status_code: 404
  - priority: 6
    name: entity_backed_identity_owns_row
    category: auth
    applies_to: All Customer-facing and Prescriber-facing endpoints
    condition: The caller role is entity-backed and the X-User-ID does not equal the id of the Customer or Prescriber that owns the addressed row.
    error_id: ERR_IDENTITY_MISMATCH
    status_code: 403
  - priority: 7
    name: segregation_of_duties_enforced
    category: auth
    applies_to: POST /reorder-holds/{id}/release, POST /return-requests/{id}/settle
    condition: The acting X-User-ID equals the user who performed the paired earlier step, that is opened_by_user_id for a hold release or approved_by_user_id for a return settlement.
    error_id: ERR_SEGREGATION_OF_DUTIES
    status_code: 409
  - priority: 8
    name: order_version_current
    category: concurrency
    applies_to: POST /orders/{id}/substitution
    condition: expected_order_version does not equal the stored Order version.
    error_id: ERR_STALE_ORDER_VERSION
    status_code: 412
  - priority: 9
    name: prescription_version_current
    category: concurrency
    applies_to: POST /prescriber-disputes
    condition: expected_prescription_version does not equal the stored Prescription version.
    error_id: ERR_STALE_PRESCRIPTION_VERSION
    status_code: 412
  - priority: 10
    name: transition_declared_for_current_state
    category: state
    applies_to: All action endpoints
    condition: The requested trigger is not declared for the current state of the target entity in its state machine, including any attempt from a terminal state or a repeat of an already-applied trigger. It also covers a declared transition whose own state precondition fails and for which no more specific error code exists, for example shipping an order whose verification_state is not RX_CLEARED, approving a return whose order is still PENDING, generating a claim whose order is not DELIVERED, or responding to a verification request that is no longer SENT. Where a specific code is declared for the failing precondition, such as ERR_HOLD_OPEN_BLOCKS_ACTION, ERR_PRESCRIPTION_NOT_VERIFIED, ERR_SEGREGATION_OF_DUTIES or ERR_REFUND_EXCEEDS_CAPTURE, that code is returned instead of this one.
    error_id: ERR_INVALID_STATE_TRANSITION
    status_code: 409
  - priority: 11
    name: customer_email_unique
    category: uniqueness
    applies_to: POST /customers
    condition: Another Customer already has the given email.
    error_id: ERR_DUPLICATE_EMAIL
    status_code: 409
  - priority: 12
    name: prescription_unexpired_for_order
    category: business_temporal
    applies_to: POST /orders, POST /fulfillment/auto-reorder-run, POST /prescriptions/{id}/submit
    condition: The prescription expiry_date is less than or equal to the current logical date, or its status is EXPIRED. On POST /fulfillment/auto-reorder-run the condition is evaluated per due schedule
      and causes that schedule to be skipped rather than an error response, so the run itself still returns 200.
    error_id: ERR_PRESCRIPTION_EXPIRED
    status_code: 409
  - priority: 13
    name: prescriber_license_unique_per_state
    category: uniqueness
    applies_to: POST /prescribers
    condition: Another Prescriber already has the given license_number in the given license_state.
    error_id: ERR_DUPLICATE_LICENSE
    status_code: 409
  - priority: 14
    name: expiry_after_issue
    category: business_temporal
    applies_to: POST /prescriptions
    condition: expiry_date is less than or equal to issue_date.
    error_id: ERR_EXPIRY_BEFORE_ISSUE
    status_code: 400
  - priority: 15
    name: upload_requires_document
    category: business_referential
    applies_to: POST /prescriptions, POST /prescriptions/{id}/submit
    condition: capture_mode is UPLOAD and document_reference is absent.
    error_id: ERR_CAPTURE_MODE_REQUIRES_DOCUMENT
    status_code: 400
  - priority: 16
    name: doctor_lookup_requires_prescriber
    category: business_referential
    applies_to: POST /prescriptions, POST /prescriptions/{id}/submit
    condition: capture_mode is DOCTOR_LOOKUP and prescriber_id is absent.
    error_id: ERR_CAPTURE_MODE_REQUIRES_PRESCRIBER
    status_code: 400
  - priority: 17
    name: self_report_requires_name
    category: business_referential
    applies_to: POST /prescriptions, POST /prescriptions/{id}/submit
    condition: capture_mode is SELF_REPORT and self_reported_prescriber_name is absent.
    error_id: ERR_SELF_REPORT_REQUIRES_NAME
    status_code: 400
  - priority: 18
    name: prescription_interval_not_overlapping
    category: business_temporal
    applies_to: POST /prescriptions/{id}/submit
    condition: Another prescription of the same customer in status VERIFIED_ACTIVE or PENDING_VERIFICATION has a half-open validity interval [issue_date, expiry_date) that overlaps this one, and supersedes_prescription_id does not name that prescription. Intervals that merely touch, where one expiry_date equals the other issue_date, do not overlap.
    error_id: ERR_PRESCRIPTION_INTERVAL_OVERLAP
    status_code: 409
  - priority: 19
    name: prescription_verified_for_dependent_action
    category: state
    applies_to: POST /auto-reorder-schedules, POST /auto-reorder-schedules/{id}/resume, POST /reorder-holds/{id}/release
    condition: The prescription status is not VERIFIED_ACTIVE.
    error_id: ERR_PRESCRIPTION_NOT_VERIFIED
    status_code: 409
  - priority: 20
    name: prescription_not_invalidated
    category: state
    applies_to: POST /orders, POST /orders/{id}/ship, POST /orders/{id}/substitution
    condition: The prescription status is INVALIDATED.
    error_id: ERR_PRESCRIPTION_INVALIDATED
    status_code: 409
  - priority: 21
    name: prescriber_active_for_contact
    category: business_referential
    applies_to: POST /prescriptions/{id}/verification-requests
    condition: The Prescriber status is SUSPENDED.
    error_id: ERR_PRESCRIBER_SUSPENDED
    status_code: 409
  - priority: 22
    name: response_inside_passive_window
    category: business_temporal
    applies_to: POST /verification-requests/{id}/respond
    condition: The current logical time is greater than or equal to passive_deadline_at.
    error_id: ERR_VERIFICATION_WINDOW_CLOSED
    status_code: 409
  - priority: 23
    name: substitution_deviation_within_limit
    category: business_safety
    applies_to: POST /orders/{id}/substitution
    condition: The computed parameter_deviation_index exceeds CONSENT_MAX_INDEX of 1.00.
    error_id: ERR_PARAMETER_DEVIATION_EXCEEDED
    status_code: 422
  - priority: 24
    name: consent_present_when_required
    category: business_safety
    applies_to: POST /orders/{id}/substitution
    condition: The computed parameter_deviation_index is above AUTO_APPROVE_MAX_INDEX of 0.50 and at most 1.00, or the equivalence requires_patient_consent is true, and patient_consent is not true.
    error_id: ERR_CONSENT_REQUIRED
    status_code: 422
  - priority: 25
    name: equivalence_mapping_exists
    category: business_referential
    applies_to: POST /orders/{id}/substitution
    condition: No ACTIVE LensEquivalence maps the ordered product to the requested substitute product.
    error_id: ERR_NO_EQUIVALENCE_MAPPING
    status_code: 422
  - priority: 26
    name: product_active_for_use
    category: business_referential
    applies_to: POST /orders, POST /orders/{id}/substitution, POST /auto-reorder-schedules
    condition: The referenced Product status is INACTIVE.
    error_id: ERR_PRODUCT_INACTIVE
    status_code: 409
  - priority: 27
    name: no_open_dispute_on_release
    category: business_referential
    applies_to: POST /reorder-holds/{id}/release
    condition: A PrescriberDispute on the same prescription is in status OPEN.
    error_id: ERR_OPEN_DISPUTE_BLOCKS_RELEASE
    status_code: 409
  - priority: 28
    name: prescriber_contact_cooldown_respected
    category: business_temporal
    applies_to: POST /prescriptions/{id}/verification-requests
    condition: A prior VerificationRequest to the same prescriber for the same prescription was sent within the closed 4-business-hour cooldown window, that is the current logical time is less than or equal to the cooldown end computed from that send instant.
    error_id: ERR_PRESCRIBER_CONTACT_COOLDOWN
    status_code: 429
  - priority: 29
    name: prescriber_pending_request_capacity
    category: business_aggregate
    applies_to: POST /prescriptions/{id}/verification-requests
    condition: The prescriber already has 3 or more VerificationRequests in status SENT across all prescriptions.
    error_id: ERR_PRESCRIBER_REQUEST_CAPACITY
    status_code: 409
  - priority: 30
    name: verification_rounds_within_cap
    category: business_aggregate
    applies_to: POST /prescriptions/{id}/verification-requests
    condition: Prescription verification_rounds is already equal to MAX_VERIFICATION_ROUNDS of 3.
    error_id: ERR_MAX_VERIFICATION_ROUNDS
    status_code: 409
  - priority: 31
    name: no_open_hold_for_fulfillment
    category: business_referential
    applies_to: POST /orders/{id}/ship, POST /auto-reorder-schedules/{id}/resume, POST /fulfillment/auto-reorder-run
    condition: The customer has at least one ReorderHold in status OPEN. On POST /fulfillment/auto-reorder-run the condition is evaluated per due schedule against that schedule's own customer and causes
      that schedule to be skipped rather than an error response, so the run itself still returns 200.
    error_id: ERR_HOLD_OPEN_BLOCKS_ACTION
    status_code: 409
  - priority: 32
    name: plan_active_for_claim
    category: business_referential
    applies_to: POST /reimbursement-claims, POST /reimbursement-claims/{id}/generate
    condition: The InsurancePlan status is RETIRED.
    error_id: ERR_PLAN_RETIRED
    status_code: 409
  - priority: 33
    name: plan_is_out_of_network
    category: business_referential
    applies_to: POST /reimbursement-claims, POST /reimbursement-claims/{id}/generate
    condition: The InsurancePlan network_status is IN_NETWORK.
    error_id: ERR_PLAN_NOT_OUT_OF_NETWORK
    status_code: 422
  - priority: 34
    name: itemized_receipt_present
    category: business_referential
    applies_to: POST /reimbursement-claims/{id}/generate
    condition: The plan requires_itemized_receipt is true and the order itemized_receipt_reference is absent.
    error_id: ERR_ITEMIZED_RECEIPT_REQUIRED
    status_code: 422
  - priority: 35
    name: claim_window_open
    category: business_temporal
    applies_to: POST /reimbursement-claims/{id}/generate, POST /reimbursement-claims/{id}/submit
    condition: The current logical date is more than claim_window_days after the order delivered_at.
    error_id: ERR_CLAIM_WINDOW_CLOSED
    status_code: 409
  - priority: 36
    name: allowance_remaining
    category: business_fiscal
    applies_to: POST /reimbursement-claims/{id}/generate
    condition: The remaining plan-year allowance, that is annual_allowance_cents minus allowance_used_cents, is less than or equal to 0.
    error_id: ERR_ALLOWANCE_EXHAUSTED
    status_code: 409
  - priority: 37
    name: box_authorization_not_exceeded
    category: business_fiscal
    applies_to: POST /orders, POST /fulfillment/auto-reorder-run
    condition: Prescription boxes_consumed plus the requested boxes_od plus boxes_os exceeds boxes_authorized_total. On POST /fulfillment/auto-reorder-run the requested quantity is the schedule boxes_per_run
      and the condition is evaluated per due schedule, causing that schedule to be skipped rather than an error response, so the run itself still returns 200.
    error_id: ERR_BOX_AUTHORIZATION_EXCEEDED
    status_code: 409
  - priority: 38
    name: return_quantity_within_order
    category: business_referential
    applies_to: POST /return-requests
    condition: unopened_boxes plus the length of opened_box_used_counts exceeds the order boxes_od plus boxes_os, or any element of opened_box_used_counts is greater than lenses_per_box_at_capture, or torn_lens_count exceeds the total lenses shipped. Negative numbers are rejected earlier by priority 2 as out-of-range values.
    error_id: ERR_RETURN_QUANTITY_EXCEEDS_ORDER
    status_code: 422
  - priority: 39
    name: refund_within_captured_amount
    category: business_fiscal
    applies_to: POST /return-requests/{id}/settle
    condition: settlement_cents plus the sum of prior SETTLED settlements on the order exceeds the order total_cents.
    error_id: ERR_REFUND_EXCEEDS_CAPTURE
    status_code: 409

endpoints:
  - method: POST
    path: /_clock/set_current_utc
    name: set_logical_clock
    roles: [PlatformAdmin]
    code: 200
    input: { current_utc: timestamp }
    output: { current_utc: timestamp }
    side_effects:
      - Sets the logical clock every deadline, sweep and window comparison reads.
    description: Test-driving endpoint for the logical clock. When it has never been called the logical clock reads 2026-08-01T00:00:00Z.

  - method: GET
    path: /_clock
    name: read_logical_clock
    roles: [PlatformAdmin, ComplianceOfficer, FulfillmentOperator]
    code: 200
    input: {}
    output: { current_utc: timestamp }
    side_effects: []
    description: Reads the current logical clock, defaulting to 2026-08-01T00:00:00Z.

  - method: POST
