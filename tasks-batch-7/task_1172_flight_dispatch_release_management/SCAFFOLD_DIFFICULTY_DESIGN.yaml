            - { call: "PUT /dispatch/manifests/${man1}", payload: { cargo_kg: 4001 }, as: Dispatcher, as_user_id: "${d1}", captures: { put_err: $.data.error_id } }
          assert:
            - "man1_pay == 19000 and man1_max == 19000 — equality accepted (boundary is inclusive <=)"
