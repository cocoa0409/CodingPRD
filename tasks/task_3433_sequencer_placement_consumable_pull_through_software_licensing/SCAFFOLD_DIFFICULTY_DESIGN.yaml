  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: uptime_exact_threshold_yields_zero_credit
        grounds:
          - calculations.uptime_credit_calc
          - entities.ServiceContract.fields.committed_uptime_percent
        distinguishing_aspect: |
          Metric: measured uptime percentage at the committed threshold. Endpoint:
          POST /genomics/service-contracts/{id}/uptime-reconciliations. The rule is
          strictly-below: measured uptime exactly equal to the 99.90 commitment yields a
          zero credit (the >= guard, not >).
        test_recipe:
          setup:
            - "account; OPERATIONAL instrument under ACTIVE contract: committed 99.90, fee 500,000c, cap 100,000c, coverage [2026-09-01, 2027-09-01)"
            - "exactly 1 minute of downtime (01:00 -> 01:01) inside a 1000-minute measurement period 00:00 -> 16:40"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Xi", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-X-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
            - call: "POST /genomics/service-contracts"
              payload: { account_id: "${acct}", instrument_id: "${inst}", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2027-09-01T00:00:00Z", committed_uptime_percent: 99.90, monthly_fee_cents: 500000, annual_credit_cap_cents: 100000, reagent_guarantee: false }
              as: FinanceAdmin
              captures: { ctr: $.data.id }
            - call: "POST /genomics/service-contracts/${ctr}/activate"
              payload: {}
              as: FinanceAdmin
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:00:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_OPEN" }
              as: FieldServiceEngineer
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:01:00Z" }
              as: PlatformAdmin
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SERVICE_CLOSE" }
              as: FieldServiceEngineer
            - call: "POST /genomics/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T16:40:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /genomics/service-contracts/${ctr}/uptime-reconciliations"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-09-01T16:40:00Z" }
              as: FinanceAdmin
              captures: { up: $.data.uptime_percent, cred: $.data.credit_cents, down: $.data.downtime_minutes }
          assert:
            - "down == 1 and up == 99.90  (100 * 999 / 1000, rounded to 2 decimals)"
            - "cred == 0  (99.90 >= 99.90: exact-threshold equality is NOT a breach; strictly-below rule)"
      - name: sample_tier_exact_boundary_uses_lower_rate
        grounds:
          - calculations.sample_billing_calc
          - entities.SoftwareLicense.fields.pinned_sample_rate_cents
        distinguishing_aspect: |
          Metric: billable sample count at the 1000-sample tier breakpoint. Endpoint:
          POST /genomics/software-licenses/{id}/billing-close. The boundary is inclusive of
          the lower tier minimum: exactly 1000 samples prices ALL samples at the T2 rate
          (200c -> 200,000c), not the T1 rate (250c -> 250,000c). Different metric and
          endpoint from the uptime-threshold instance.
        test_recipe:
          setup:
            - "account; ACTIVE license (period [2026-09-01, 2026-10-01)); OPERATIONAL instrument; QC_PASSED lot"
            - "one SUCCESS LOCAL run of exactly 1000 samples on 2026-09-10"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Omicron", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K1", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-O-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LO", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
              captures: { lot: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/software-licenses"
              payload: { account_id: "${acct}" }
              as: FinanceAdmin
              captures: { lic: $.data.id }
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "ACTIVATE" }
              as: FinanceAdmin
            - call: "POST /genomics/run-records"
              payload: { instrument_id: "${inst}", lot_id: "${lot}", license_id: "${lic}", run_at: "2026-09-10T00:00:00Z", run_mode: "STD_SHORT", analysis_mode: "LOCAL", samples_count: 1000, output_gb: 50.0, outcome: "SUCCESS" }
              as: LabOperator
              as_user_id: "${acct}"
          trigger:
            - call: "POST /genomics/software-licenses/${lic}/billing-close"
              payload: {}
              as: FinanceAdmin
              captures: { samples: $.data.billable_samples, tier: $.data.tier, gross: $.data.gross_cents, net: $.data.net_cents }
          assert:
            - "samples == 1000 and tier == T2  (1000 >= SAMPLE_TIER_T2_MIN — the breakpoint belongs to the lower-rate tier)"
            - "gross == 200000  (1000 * 200c average-rate over all samples; 999 samples would price 249,750c at T1)"
            - "net == 200000  (no credits granted, so offset is 0)"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_submit_requires_program_active
        grounds:
          - state_machines.ReagentOrder.DRAFT_to_ALLOCATED
          - validations[priority=9]
        distinguishing_aspect: |
          Entity pair: ReagentOrder -> PlacementProgram. The order's DRAFT -> ALLOCATED
          transition is gated on the referenced program's program_state == ACTIVE; a
          PENDING_APPROVAL program blocks it with ERR_PROGRAM_NOT_ACTIVE (no credit hold
          involved here — the dependency alone rejects).
        test_recipe:
          setup:
            - "account (no credit hold); kit K1 with a usable QC_PASSED lot (allocation would succeed)"
            - "program P for the account is PENDING_APPROVAL (submitted, not yet approved)"
            - "DRAFT order referencing program P"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Pi", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K1", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LP", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 10 }
              as: SupplyPlanner
              captures: { lot: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.10, hardware_lines: [{ description: "instrument", quantity: 1, unit_price_cents: 500000 }] }
              as: AccountManager
              as_user_id: "am-6"
              captures: { prog: $.data.id }
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "SUBMIT" }
              as: AccountManager
              as_user_id: "am-6"
            - call: "POST /genomics/reagent-orders"
              payload: { account_id: "${acct}", program_id: "${prog}", lines: [{ kit_code: "K1", quantity: 1 }] }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
          trigger:
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SUBMIT" }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PROGRAM_NOT_ACTIVE"
            - "ReagentOrder.${ord}.order_state remains DRAFT and lot ${lot}.reserved_units remains 0"
      - name: update_apply_requires_active_contract
        grounds:
          - validations[priority=10]
          - state_machines.ServiceContract
        distinguishing_aspect: |
          Entity pair: Instrument -> ServiceContract (different pair from order->program).
          The software-update application is gated on an ACTIVE contract covering the
          instrument; with only a DRAFT contract the gate fires ERR_CONTRACT_NOT_ACTIVE even
          though the update itself is fully compatible and validated.
        test_recipe:
          setup:
            - "RUO account; OPERATIONAL instrument (model gen 2); contract for the instrument left in DRAFT"
            - "update U: RELEASED, min_model_generation 2, VALIDATED (every other gate passes)"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Rho", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-200", generation: 2, base_price_cents: 4000000, supported_chemistry_versions: ["V1", "V2"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-R-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
            - call: "POST /genomics/service-contracts"
              payload: { account_id: "${acct}", instrument_id: "${inst}", coverage_start: "2026-09-01T00:00:00Z", coverage_end: "2027-09-01T00:00:00Z", committed_uptime_percent: 99.0, monthly_fee_cents: 500000, annual_credit_cap_cents: 120000 }
              as: FinanceAdmin
            - call: "POST /genomics/software-updates"
              payload: { update_version: "2.1.0", min_model_generation: 2, unlocks_run_modes: ["STD_LONG"], clinical_validation_status: "VALIDATED" }
              as: PlatformAdmin
              captures: { upd: $.data.id }
          trigger:
            - call: "POST /genomics/instruments/${inst}/software-updates"
              payload: { update_id: "${upd}" }
              as: FieldServiceEngineer
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CONTRACT_NOT_ACTIVE (the DRAFT contract does not satisfy the gate)"
            - "Instrument.${inst}.software_version remains 1.0.0"
      - name: run_requires_active_license
        grounds:
          - validations[priority=12]
          - state_machines.SoftwareLicense.ACTIVE_to_SUSPENDED
        distinguishing_aspect: |
          Entity pair: RunRecord -> SoftwareLicense (third distinct pair). A run recorded
          while its license is SUSPENDED is rejected with ERR_LICENSE_NOT_ACTIVE; after
          REINSTATE the identical run succeeds — the gate is the license's state, not the
          payload.
        test_recipe:
          setup:
            - "RUO account; OPERATIONAL instrument; QC_PASSED lot of a compatible kit; license ACTIVATEd then SUSPENDed"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Sigma", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K1", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-S-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "SHIP" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "INSTALL" }
              as: FieldServiceEngineer
            - call: "POST /genomics/instruments/${inst}/events"
              payload: { action: "COMMISSION" }
              as: FieldServiceEngineer
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LS", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 5 }
              as: SupplyPlanner
              captures: { lot: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/software-licenses"
              payload: { account_id: "${acct}" }
              as: FinanceAdmin
              captures: { lic: $.data.id }
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "ACTIVATE" }
              as: FinanceAdmin
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "SUSPEND" }
              as: FinanceAdmin
          trigger:
            - call: "POST /genomics/run-records"
              payload: { instrument_id: "${inst}", lot_id: "${lot}", license_id: "${lic}", run_at: "2026-09-10T00:00:00Z", run_mode: "STD_SHORT", analysis_mode: "LOCAL", samples_count: 100, output_gb: 5.0, outcome: "SUCCESS" }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
            - call: "POST /genomics/software-licenses/${lic}/status"
              payload: { action: "REINSTATE" }
              as: FinanceAdmin
            - call: "POST /genomics/run-records"
              payload: { instrument_id: "${inst}", lot_id: "${lot}", license_id: "${lic}", run_at: "2026-09-10T01:00:00Z", run_mode: "STD_SHORT", analysis_mode: "LOCAL", samples_count: 100, output_gb: 5.0, outcome: "SUCCESS" }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { run_ok: $.data.id }
          assert:
            - "err == ERR_LICENSE_NOT_ACTIVE (SUSPENDED license rejects the run)"
            - "after REINSTATE the identical run succeeds (run_ok is a UUID) and lot ${lot}.consumed_units == 1"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: contract_window_half_open_adjacency
        grounds:
          - validations[priority=23]
          - calculations.uptime_credit_calc
        distinguishing_aspect: |
          Interval semantics: half-open [coverage_start, coverage_end) on the Instrument
          resource — adjacency (new start == existing end) is ALLOWED, a one-day overlap is
          rejected. Different resource and semantics from the cold-chain aggregate bucket.
        test_recipe:
          setup:
            - "account; instrument (never decommissioned)"
            - "contract A [2026-01-01, 2027-01-01) ACTIVE on the instrument"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Tau", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/instrument-models"
              payload: { model_code: "SQ-100", generation: 1, base_price_cents: 1000000, supported_chemistry_versions: ["V1"], base_run_modes: ["STD_SHORT"] }
              as: PlatformAdmin
              captures: { mdl: $.data.id }
            - call: "POST /genomics/instruments"
              payload: { account_id: "${acct}", model_id: "${mdl}", serial_number: "SN-TAU-1", regulatory_mode: "RUO" }
              as: AccountManager
              captures: { inst: $.data.id }
            - call: "POST /genomics/service-contracts"
              payload: { account_id: "${acct}", instrument_id: "${inst}", coverage_start: "2026-01-01T00:00:00Z", coverage_end: "2027-01-01T00:00:00Z", committed_uptime_percent: 99.0, monthly_fee_cents: 500000, annual_credit_cap_cents: 120000 }
              as: FinanceAdmin
              captures: { ctrA: $.data.id }
            - call: "POST /genomics/service-contracts/${ctrA}/activate"
              payload: {}
              as: FinanceAdmin
          trigger:
            - call: "POST /genomics/service-contracts"
              payload: { account_id: "${acct}", instrument_id: "${inst}", coverage_start: "2027-01-01T00:00:00Z", coverage_end: "2028-01-01T00:00:00Z", committed_uptime_percent: 99.0, monthly_fee_cents: 600000, annual_credit_cap_cents: 120000 }
              as: FinanceAdmin
              captures: { ctrB: $.data.id }
            - call: "POST /genomics/service-contracts/${ctrB}/activate"
              payload: {}
              as: FinanceAdmin
              captures: { ctrB_state: $.data.contract_state }
            - call: "POST /genomics/service-contracts"
              payload: { account_id: "${acct}", instrument_id: "${inst}", coverage_start: "2026-12-31T00:00:00Z", coverage_end: "2027-06-01T00:00:00Z", committed_uptime_percent: 99.5, monthly_fee_cents: 700000, annual_credit_cap_cents: 120000 }
              as: FinanceAdmin
              captures: { ctrC: $.data.id }
            - call: "POST /genomics/service-contracts/${ctrC}/activate"
              payload: {}
              as: FinanceAdmin
              captures: { err: $.data.error_id }
          assert:
            - "ctrB_state == ACTIVE  (start 2027-01-01 == A's end: adjacency allowed under half-open semantics)"
            - "err == ERR_CONTRACT_WINDOW_OVERLAP  (C starts 2026-12-31, one day inside A's window)"
            - "ServiceContract.${ctrC}.contract_state remains DRAFT"
      - name: cold_chain_week_aggregate_capacity
        grounds:
          - calculations.cold_chain_capacity_calc
          - validations[priority=33]
          - errors[ERR_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Interval semantics: whole-ISO-week aggregate capacity buckets on the cold-chain
          resource (not per-instrument windows) — any two forecasts touching the same week
          ALWAYS aggregate (no adjacency exemption), and demand exactly equal to the 500-unit
          FROZEN_20 capacity is allowed while 501 is rejected. Different resource and
          semantics from the contract half-open window.
        test_recipe:
          setup:
            - "accounts A and B; kits F1 and F2 both FROZEN_20"
            - "forecast A submitted: 400 units of F1 in ISO week 2026-09-07 (400 <= 500 passes)"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Upsilon A", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acctA: $.data.id }
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Upsilon B", regulatory_class: "RUO", region: "EU" }
              as: AccountManager
              captures: { acctB: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "F1", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "F2", run_type: "STD_LONG", flow_cell_version: "FC_MID", chemistry_version: "V2", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 9000, samples_per_kit: 24, min_model_generation: 1 }
              as: PlatformAdmin
            - call: "POST /genomics/supply-forecasts"
              payload: { account_id: "${acctA}", lines: [{ kit_code: "F1", week_start: "2026-09-07T00:00:00Z", quantity: 400 }] }
              as: SupplyPlanner
              captures: { fcA: $.data.id }
            - call: "POST /genomics/supply-forecasts/${fcA}/advance"
              payload: { action: "SUBMIT" }
              as: SupplyPlanner
              captures: { fcA_state: $.data.forecast_state }
          trigger:
            - call: "POST /genomics/supply-forecasts"
              payload: { account_id: "${acctB}", lines: [{ kit_code: "F2", week_start: "2026-09-07T00:00:00Z", quantity: 150 }] }
              as: SupplyPlanner
              captures: { fcB1: $.data.id }
            - call: "POST /genomics/supply-forecasts/${fcB1}/advance"
              payload: { action: "SUBMIT" }
              as: SupplyPlanner
              captures: { err: $.data.error_id }
            - call: "POST /genomics/supply-forecasts"
              payload: { account_id: "${acctB}", lines: [{ kit_code: "F2", week_start: "2026-09-07T00:00:00Z", quantity: 100 }] }
              as: SupplyPlanner
              captures: { fcB2: $.data.id }
            - call: "POST /genomics/supply-forecasts/${fcB2}/advance"
              payload: { action: "SUBMIT" }
              as: SupplyPlanner
              captures: { fcB2_state: $.data.forecast_state }
          assert:
            - "fcA_state == SUBMITTED (400 <= 500)"
            - "err == ERR_CAPACITY_EXCEEDED (400 + 150 = 550 > 500 — cross-account aggregation in the same week bucket)"
            - "SupplyForecast.${fcB1}.forecast_state remains DRAFT"
            - "fcB2_state == SUBMITTED (400 + 100 == 500 — demand exactly equal to capacity is allowed, <=)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: deliver_return_conserves_delivered_spend
        grounds:
          - state_machines.ReagentOrder.SHIPPED_to_DELIVERED
          - state_machines.ReagentOrder.DELIVERED_to_RETURNED
          - entities.PlacementProgram.fields.delivered_spend_cents
        distinguishing_aspect: |
          Conserved quantity: PlacementProgram.delivered_spend_cents (money). Invariant:
          delivered_spend_cents == sum(attributed totals of DELIVERED orders) -
          sum(attributed totals of RETURNED orders). The DELIVER (+10,000) then RETURN
          (-10,000) pair returns the counter to exactly its pre-delivery value.
        test_recipe:
          setup:
            - "account; kit K1 pinned at 5,000c by an ACTIVE program; lot of 10 QC_PASSED units"
            - "order of 2 units under the program: SUBMITTED, SHIPPED, DELIVERED (delivered_spend 10,000c; below the 12,000,000c commitment, so the program stays ACTIVE)"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Phi", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K1", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LPH", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 10 }
              as: SupplyPlanner
              captures: { lot: $.data.id }
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/placement-programs"
              payload: { account_id: "${acct}", term_months: 12, committed_annual_reagent_cents: 12000000, subsidy_pct: 0.10, hardware_lines: [{ description: "instrument", quantity: 1, unit_price_cents: 500000 }] }
              as: AccountManager
              as_user_id: "am-7"
              captures: { prog: $.data.id }
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "SUBMIT" }
              as: AccountManager
              as_user_id: "am-7"
            - call: "POST /genomics/placement-programs/${prog}/review"
              payload: { action: "APPROVE" }
              as: FinanceAdmin
              as_user_id: "fa-7"
            - call: "POST /genomics/reagent-orders"
              payload: { account_id: "${acct}", program_id: "${prog}", lines: [{ kit_code: "K1", quantity: 2 }] }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SUBMIT" }
              as: LabOperator
              as_user_id: "${acct}"
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SHIP" }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "DELIVER" }
              as: SupplyPlanner
            - call: "GET /genomics/placement-programs/${prog}"
              as: FinanceAdmin
              captures: { delivered_mid: $.data.delivered_spend_cents, prog_state_mid: $.data.program_state }
          trigger:
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "RETURN" }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { ord_state: $.data.order_state }
            - call: "GET /genomics/placement-programs/${prog}"
              as: FinanceAdmin
              captures: { delivered_end: $.data.delivered_spend_cents }
            - call: "GET /genomics/accounts/${acct}"
              as: AccountManager
              captures: { acct_credit: $.data.credit_balance_cents }
          assert:
            - "delivered_mid == 10000 and prog_state_mid == ACTIVE (delivery posted; 10,000 < 12,000,000 commitment so no auto-complete)"
            - "ord_state == RETURNED"
            - "delivered_end == 0 — deliver-then-return conserves delivered_spend_cents exactly"
            - "acct_credit == 10000 (the refund posts to account credit; it does NOT touch delivered_spend)"
      - name: reserve_cancel_conserves_available_units
        grounds:
          - calculations.lot_allocation_calc
          - state_machines.ReagentOrder.ALLOCATED_to_CANCELLED
          - entities.ReagentLot.fields.available_units
        distinguishing_aspect: |
          Conserved quantity: ReagentLot.available_units (physical units, not money).
          Invariant: available_units == quantity_units - reserved_units - consumed_units.
          The SUBMIT (reserve 4) then CANCEL (release 4) pair returns available_units to
          exactly its pre-order value of 10 with zero units consumed.
        test_recipe:
          setup:
            - "account; kit K1; lot LQ of 10 units, QC_PASSED, unexpired"
            - "DRAFT order of 4 units (no program)"
          setup_api_calls:
            - call: "POST /genomics/accounts"
              payload: { name: "Lab Chi", regulatory_class: "RUO", region: "NA" }
              as: AccountManager
              captures: { acct: $.data.id }
            - call: "POST /genomics/reagent-kits"
              payload: { kit_code: "K1", run_type: "STD_SHORT", flow_cell_version: "FC_LOW", chemistry_version: "V1", regulatory_clearance: "RUO_ONLY", shelf_life_days: 60, cold_chain_class: "FROZEN_20", price_cents: 5000, samples_per_kit: 16, min_model_generation: 1 }
              as: PlatformAdmin
              captures: { kit: $.data.id }
            - call: "POST /genomics/reagent-lots"
              payload: { kit_id: "${kit}", lot_number: "LCH", manufacture_date: "2026-08-15T00:00:00Z", quantity_units: 10 }
              as: SupplyPlanner
              captures: { lot: $.data.id, avail0: $.data.available_units }
            - call: "POST /genomics/reagent-lots/${lot}/qc"
              payload: { outcome: "PASSED" }
              as: SupplyPlanner
            - call: "POST /genomics/reagent-orders"
              payload: { account_id: "${acct}", lines: [{ kit_code: "K1", quantity: 4 }] }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "SUBMIT" }
              as: LabOperator
              as_user_id: "${acct}"
            - call: "GET /genomics/reagent-lots/${lot}"
              as: SupplyPlanner
              captures: { res_mid: $.data.reserved_units, avail_mid: $.data.available_units }
          trigger:
            - call: "POST /genomics/reagent-orders/${ord}/advance"
              payload: { action: "CANCEL" }
              as: LabOperator
              as_user_id: "${acct}"
              captures: { ord_state: $.data.order_state }
            - call: "GET /genomics/reagent-lots/${lot}"
              as: SupplyPlanner
              captures: { res_end: $.data.reserved_units, avail_end: $.data.available_units, cons_end: $.data.consumed_units }
          assert:
            - "avail0 == 10"
            - "res_mid == 4 and avail_mid == 6 (reservation taken)"
            - "ord_state == CANCELLED"
            - "res_end == 0 and avail_end == 10 == avail0 and cons_end == 0 — reserve-then-cancel conserves available_units exactly"
