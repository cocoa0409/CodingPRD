            - { call: "POST /incident-reports/${i}/begin-classification", payload: {}, as: CleryCoordinator }
          trigger:
            - { call: "POST /incident-reports/${i}/unfound", payload: { justification: "" }, as: PoliceChief, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNFOUNDED_JUSTIFICATION_REQUIRED, HTTP 422"

      - name: lapsed_csa_cannot_file_referral
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_CSA_NOT_CERTIFIED]"]
        distinguishing_aspect: "A referral from a LAPSED CSA yields ERR_CSA_NOT_CERTIFIED 422 (certification gates intake)."
        test_recipe:
          setup: ["CSA trained 2025-06-01 (valid_to 2026-09-30T23:59:59Z); clock at 2026-10-02T00:00:00Z so the CSA is LAPSED; geography exists"]
          setup_api_calls:
            - { call: "POST /campus-security-authorities", payload: { full_name: "Lee Lapsed", email: "lee@example.edu", department: "Housing", csa_category: "RESIDENT_ADVISOR" }, as: SystemAdmin, captures: { c: $.data.id } }
            - { call: "POST /campus-security-authorities/${c}/training-records", payload: { completed_at: "2025-06-01T10:00:00Z", score: 88 }, as: SystemAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /campus-security-authorities/${c}", payload: {}, as: SystemAdmin }
            - { call: "POST /clery-geographies", payload: { name: "Hall E", category: "ON_CAMPUS_RESIDENTIAL", is_residential_facility: true }, as: SystemAdmin, captures: { g: $.data.id } }
          trigger:
            - { call: "POST /csa-referral-reports", payload: { occurred_at: "2026-10-01T22:00:00Z", geography_id: "${g}", offense_suspicion: "DRUG_LAW_REFERRAL", narrative: "x" }, as: CampusSecurityAuthority, as_user_id: "${c}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CSA_NOT_CERTIFIED, HTTP 422"

      - name: disseminate_without_channels_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_NO_DISTRIBUTION_CHANNELS]"]
        distinguishing_aspect: "disseminate with an empty distribution_channels array yields ERR_NO_DISTRIBUTION_CHANNELS 422."
        test_recipe:
          setup: ["alert AUTHORIZED"]
          setup_api_calls:
            - { call: "POST /clery-geographies", payload: { name: "U", category: "ON_CAMPUS", is_residential_facility: false }, as: SystemAdmin, captures: { g: $.data.id } }
            - { call: "POST /incident-reports", payload: { reported_at: "2026-07-30T09:00:00Z", occurred_at: "2026-07-30T08:00:00Z", geography_id: "${g}", source: "POLICE_DIRECT", narrative: "x" }, as: PoliceChief, captures: { i: $.data.id } }
            - { call: "POST /incident-reports/${i}/submit", payload: {}, as: PoliceChief }
            - { call: "POST /incident-reports/${i}/safety-alerts", payload: { alert_type: "EMERGENCY_NOTIFICATION" }, as: CleryCoordinator, captures: { a: $.data.id } }
            - { call: "POST /safety-alerts/${a}/decide", payload: { decision: "ISSUE", decision_rationale: "threat" }, as: CleryCoordinator }
            - { call: "POST /safety-alerts/${a}/authorize", payload: {}, as: PoliceChief }
          trigger:
            - { call: "POST /safety-alerts/${a}/disseminate", payload: { distribution_channels: [] }, as: PoliceChief, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NO_DISTRIBUTION_CHANNELS, HTTP 422; status remains AUTHORIZED"

      - name: advance_review_without_actions_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_UNRESOLVED_ACTIONS]"]
        distinguishing_aspect: "FINDINGS_ISSUED -> CORRECTIVE_ACTION with zero corrective actions yields ERR_UNRESOLVED_ACTIONS 422."
        test_recipe:
          setup: ["review in FINDINGS_ISSUED with no actions"]
