              payload: { property_address: "2 K St", parcel_number: "P-K2", closing_date: "2026-08-25", order_class: "RUSH", service_date: "2026-08-10", jurisdiction_id: "${j_id}" }
              as: TitleAgent
              as_user_id: "agent_2"
              captures: { err: $.data.error_id}
          assert:
            - "First RUSH order (occupant_count 0 == capacity - 1) created with 201, status INTAKE"
            - "Second RUSH order (occupant_count 1 >= capacity 1) rejected: error_id == ERR_RUSH_CAPACITY_FULL, http 409"

      - name: estoppel_valid_through_equals_closing_date_accepted
        grounds:
          - calculations.estoppel_timeline
          - errors[ERR_ESTOPPEL_STALE_FOR_CLOSING]
        distinguishing_aspect: |
          Date boundary on POST /search-orders/{id}/submit-for-verification (a
