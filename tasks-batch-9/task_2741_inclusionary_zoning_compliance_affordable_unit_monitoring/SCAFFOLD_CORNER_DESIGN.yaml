            - { call: "POST /iz-compliance/resale-transactions/${t_id}/rofr-decision", payload: { decision: "WAIVE" }, as: ProgramAdministrator }
            - { call: "POST /iz-compliance/income-certifications", payload: { household_id: "${h2_id}", unit_id: "${u_id}", certified_income_cents: 5000000, contract_rent_cents: 0, effective_date: "2026-08-01" }, as: HousingComplianceOfficer, as_user_id: "hco-1", captures: { c2_id: $.data.id } }
            - { call: "POST /iz-compliance/resale-transactions/${t_id}/certify-buyer", payload: { buyer_household_id: "${h2_id}", certification_id: "${c2_id}" }, as: HousingComplianceOfficer, as_user_id: "hco-2" }
          trigger:
            - { call: "POST /iz-compliance/resale-transactions/${t_id}/close", payload: {}, as: HousingComplianceOfficer, as_user_id: "hco-2" }
            - { call: "GET /iz-compliance/trust-fund-summary", payload: {}, as: FundAuditor, as_user_id: "aud-1" }
          assert:
            - "HTTP 200 and ResaleTransaction.${t_id}.state == CLOSED with closed_at 2026-08-01T00:00:00Z"
            - "ResaleTransaction.${t_id}.net_proceeds_cents == 31000000 (32000000 less the 1000000 broker fee)"
            - "ResaleTransaction.${t_id}.seller_equity_cents == 31000000 — clamped by the remaining proceeds, not by the 32500000 basis"
            - "ResaleTransaction.${t_id}.seller_improvement_credit_cents == 0, seller_appreciation_share_cents == 0, city_recapture_cents == 0"
            - "the four buckets sum to exactly 31000000, equal to net_proceeds_cents — nothing is created or destroyed even in the degenerate case"
            - "AffordableUnit.${u_id}.original_purchase_price_cents == 32000000 and occupant_household_id == ${h2_id} with occupancy_status OCCUPIED — the basis resets DOWN to the actual sale price"
            - "IncomeCertification.${c1_id}.state == SUPERSEDED while IncomeCertification.${c2_id}.state stays CERTIFIED"
            - "GET /iz-compliance/trust-fund-summary reports total_recapture_cents 0, total_paid_fees_cents 0, total_inflow_cents 0 and unencumbered_balance_cents 0"

      - name: equal_preference_scores_are_ranked_by_created_at_ascending
        claim_type: boundary_chronological
        grounds:
          - calculations.lottery_ranking
          - calculations.income_limit
        distinguishing_aspect: |
          When a marketing plan lists no preference categories every applicant scores 0, so the
          ranking reduces to the sole declared tie-break of created_at ASC and the earliest two
          registrations win the two offered units regardless of what they claimed. The same call
          also shows the pool filter: a household whose income exceeds the eligibility limit for
          its own household_size is dropped from the ranking entirely, keeping state APPLIED with
          rank_position null rather than being waitlisted at the bottom.
