      - name: scheduled_audit_ninety_day_spacing_boundary_and_surprise_capacity
        grounds:
          - validations.priority_120.ERR_AUDIT_SPACING_VIOLATION
          - validations.priority_120.ERR_SURPRISE_AUDIT_IN_PROGRESS
          - entities.EscrowAudit.fields.as_of_date
          - entities.EscrowAudit.fields.audit_type
        distinguishing_aspect: |
          Different interval semantics on a different contended resource (an
          EscrowAccount rather than an Agency calendar): SCHEDULED audits are
          point events needing a minimum 90-day gap, where exactly 90 days is
          accepted and 89 is not, while SURPRISE audits ignore spacing entirely
          and are instead capped at one non-terminal audit per account at a
          time.
        test_recipe:
          setup:
            - "APPOINTED agency in CA with escrow account ESCROW-1 and one existing SCHEDULED audit whose as_of_date is 2026-05-03."
            - "No snapshot is needed because every trigger stops at audit creation."
          setup_api_calls:
