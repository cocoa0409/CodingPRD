  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: filing_window_half_open_adjacency
        grounds:
          - state_machines.RateFiling.SUBMITTED_to_APPROVED
          - validations[priority=9]
        distinguishing_aspect: |
          Resource = RateFiling (program+state); interval semantics = half-open
          [effective_from, effective_to): a filing starting exactly at the incumbent's
          effective_to (adjacency) is APPROVED, while one overlapping by even one day
          is ERR_FILING_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "program PROPOSED with guideline+allocation; filing A [2026-08-01, 2027-08-01) APPROVED"
            - "filing B [2027-08-01, 2028-08-01) SUBMITTED (adjacent at 2027-08-01); filing C [2027-06-01, 2028-01-01) SUBMITTED (overlaps A by 2 months)"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier TO1", naic_code: "NAIC-TO1", contact_email: "uw@to1.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "TO1 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { filA: $.data.id } }
            - { call: "POST /mga/rate-filings/${filA}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${filA}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1600 }, policy_fee_cents: 5000, effective_from: "2027-08-01T00:00:00Z", effective_to: "2028-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { filB: $.data.id } }
            - { call: "POST /mga/rate-filings/${filB}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1700 }, policy_fee_cents: 5000, effective_from: "2027-06-01T00:00:00Z", effective_to: "2028-01-01T00:00:00Z" }, as: MGAUnderwriter, captures: { filC: $.data.id } }
            - { call: "POST /mga/rate-filings/${filC}/submit", payload: {}, as: MGAUnderwriter }
          trigger:
            - { call: "POST /mga/rate-filings/${filB}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { b_st: $.data.status } }
            - { call: "POST /mga/rate-filings/${filC}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { c_err: $.data.error_id } }
          assert:
            - "filing B APPROVED: adjacency (2027-08-01 == A's effective_to) is NOT an intersection under half-open semantics"
            - "filing C rejected: error_id == ERR_FILING_WINDOW_OVERLAP ([2027-06-01, 2028-01-01) intersects A's [2026-08-01, 2027-08-01))"
            - "RateFiling.${filC}.status remains SUBMITTED"

      - name: appointment_gap_closed_interval_buffer
        grounds:
          - state_machines.TPAAppointment.PENDING_to_ACTIVE
          - validations[priority=9]
        distinguishing_aspect: |
          Resource = TPAAppointment (different resource from RateFiling); interval
          semantics = CLOSED windows plus a mandatory 30-day buffer — the exact
          opposite of filing adjacency: a successor starting 29 days after the
          incumbent's end is rejected (ERR_APPOINTMENT_WINDOW_GAP), while 30 days is
          accepted; mere adjacency (1-day gap) would also be a conflict here.
        test_recipe:
          setup:
            - "ACTIVE program; appointment A ACTIVE for LIABILITY window [2026-08-01, 2027-08-01]"
            - "appointments B and C (same program+claim_type+TPA as A — the gap rule is per-TPA) starting 2027-08-30 (gap 29 days) and 2027-08-31 (gap exactly 30)"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier TO2", naic_code: "NAIC-TO2", contact_email: "uw@to2.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/tpas", payload: { name: "TPA TO2-A", license_number: "LIC-TO2A", contact_email: "a@to2.com" }, as: PlatformAdmin, captures: { tpaA: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "TO2 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/tpa-appointments", payload: { tpa_id: "${tpaA}", claim_type: "LIABILITY", authority_limit_cents: 100000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { apptA: $.data.id } }
            - { call: "POST /mga/tpa-appointments/${apptA}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/tpa-appointments", payload: { tpa_id: "${tpaA}", claim_type: "LIABILITY", authority_limit_cents: 50000, effective_from: "2027-08-30T00:00:00Z", effective_to: "2028-08-01T00:00:00Z" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { apptB: $.data.id } }
            - { call: "POST /mga/programs/${prog}/tpa-appointments", payload: { tpa_id: "${tpaA}", claim_type: "LIABILITY", authority_limit_cents: 60000, effective_from: "2027-08-31T00:00:00Z", effective_to: "2028-08-01T00:00:00Z" }, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { apptC: $.data.id } }
          trigger:
            - { call: "POST /mga/tpa-appointments/${apptB}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { b_err: $.data.error_id } }
            - { call: "POST /mga/tpa-appointments/${apptC}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}", captures: { c_st: $.data.status } }
          assert:
            - "appointment B (from 2027-08-30, gap 29 days < 30) rejected: error_id == ERR_APPOINTMENT_WINDOW_GAP; stays PENDING"
            - "appointment C (from 2027-08-31, gap exactly 30 >= 30) ACTIVATED — the gap boundary is inclusive"
            - "contrast with filing semantics: appointment windows demand a buffer, filings allow zero-gap adjacency"

      - name: audit_window_gap_boundary
        grounds:
          - state_machines.CarrierAudit
          - validations[priority=9]
        distinguishing_aspect: |
          Resource = CarrierAudit (third resource): same 30-day closed-gap semantics as
          appointments — audit windows 29 days apart rejected, 30 days apart accepted —
          showing the buffer rule applies per-resource with per-resource state filters
          (only non-terminal audits occupy the calendar).
        test_recipe:
