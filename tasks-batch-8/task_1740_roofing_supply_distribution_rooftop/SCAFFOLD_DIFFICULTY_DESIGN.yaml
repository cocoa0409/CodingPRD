      - name: allocation_grant_outside_surge_window
        grounds:
          - state_machines.StormSurgeEvent.transitions
          - validations[priority=4]
        distinguishing_aspect: |
          Interval semantic = half-open time window on StormSurgeEvent: an
          allocation grant is valid only while the logical clock lies in
          [starts_at, ends_at) keeping the event ACTIVE; after the clock
          passes ends_at the event auto-CLOSES, its PENDING allocations
          cascade to EXPIRED, and the grant fails — different semantics than
          the discrete capacity counter on DeliverySlot (continuous clock vs
          discrete bucket).
        test_recipe:
          setup:
            - "Surge event window 2026-08-01..2026-08-10; clock moved past ends_at so event auto-closed"
