          - errors[ERR_PHASE_NOT_ALLOWED]
        distinguishing_aspect: "From PLANNING the only legal target is DESIGN: asking for CONSTRUCTION answers 409 ERR_PHASE_NOT_ALLOWED and leaves delivery_phase PLANNING, while DESIGN succeeds and bumps the project version."
        test_recipe:
          setup:
            - "Project P in PLANNING with one APPROVED OwnerRequirement (the DESIGN precondition)."
          setup_api_calls:
            - call: "POST /cx-projects"
              payload: { name: "Phase Cx", building_name: "Phase Block", project_type: "NEW_CONSTRUCTION", contract_value_cents: 50000000 }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
              captures: { p: $.data.id }
