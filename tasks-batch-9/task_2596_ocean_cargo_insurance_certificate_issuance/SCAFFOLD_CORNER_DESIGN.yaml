      - name: premium_audit_segregation_refuses_the_submitting_user_as_auditor
        claim_type: segregation_of_duties
        grounds:
          - validations.priority_6_segregation
          - errors.ERR_SEGREGATION_OF_DUTIES
          - endpoints.POST /premium-declarations/{id}/start-audit
          - state_machines.PremiumDeclaration.status.SUBMITTED_to_UNDER_AUDIT
        distinguishing_aspect: |
          The audit gate is on X-User-ID, not on the role: a PremiumAuditor whose
