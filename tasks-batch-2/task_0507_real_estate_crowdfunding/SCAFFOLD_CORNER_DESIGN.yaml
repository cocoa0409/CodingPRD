scaffold_corner_design:

  # =========================================================================
  # Section: entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_fund_returns_201_with_bootstrap_nav
        claim_type: Creation
        grounds: [entities.Fund, endpoints]
        distinguishing_aspect: "POST /funds with required fields returns 201; status=OPEN, nav_per_share_cents=1000, shares_outstanding=0, total_capital_cents=0, current_valuation_seq=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { name: "Fund E1", vehicle_type: "REIT", gross_asset_value_cents: 500000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id }
          assert:
            - "Fund.${fund_id}.status == OPEN"
            - "Fund.${fund_id}.nav_per_share_cents == 1000"
            - "Fund.${fund_id}.shares_outstanding == 0"
            - "Fund.${fund_id}.total_capital_cents == 0"
            - "Fund.${fund_id}.current_valuation_seq == 0"
            - "Fund.${fund_id}.version == 1"

      - name: get_fund_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Fund, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /funds/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /funds/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: FundManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_investor_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Investor, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /investors without net_worth_cents (a required source:input field) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /investors"
              payload: { email: "m@x.com", full_name: "M", annual_income_cents: 8000000 }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: investor_accredited_status_defaults_non_accredited
        claim_type: Defaults
        grounds: [entities.Investor.fields.accredited_status]
        distinguishing_aspect: "Omitting accredited_status on POST /investors applies the default NON_ACCREDITED."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /investors"
              payload: { email: "def@x.com", full_name: "Def", annual_income_cents: 8000000, net_worth_cents: 12000000 }
              as: Anonymous
              captures: { inv: $.data.id, st: $.data.accredited_status }
          assert:
            - "Investor.${inv}.accredited_status == NON_ACCREDITED"
            - "Investor.${inv}.suitability_status == PENDING"

      - name: fund_nav_recomputed_after_valuation_post
        claim_type: Computed Fields
        grounds: [entities.Fund.fields.nav_per_share_cents, calculations.nav_per_share]
        distinguishing_aspect: "After a Valuation posts with gross 1000000, liab 0 against shares_outstanding 1000, nav_per_share_cents recomputes to 1000; resulting_nav_per_share_cents on the Valuation freezes 1000."
        test_recipe:
          setup: ["Fund with one settled holding of 1000 shares (NAV 1000)."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund CF", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "cf@x.com", full_name: "CF", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q1", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { val_nav: $.data.resulting_nav_per_share_cents }
          assert:
            - "Valuation.resulting_nav_per_share_cents == 1000"
            - "Fund.${fund_id}.nav_per_share_cents == 1000"
            - "Fund.${fund_id}.current_valuation_seq == 1"

      - name: fund_system_fields_input_ignored
        claim_type: System Fields
        grounds: [entities.Fund.fields.status, entities.Fund.fields.shares_outstanding]
        distinguishing_aspect: "POST /funds is declared with input [name, vehicle_type, gross_asset_value_cents, total_liabilities_cents]; status/shares_outstanding/nav are system/computed, so a client cannot set status and the create still yields status=OPEN, shares_outstanding=0."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { name: "Fund SF", vehicle_type: "PARTNERSHIP", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id }
          assert:
            - "Fund.${fund_id}.status == OPEN"
            - "Fund.${fund_id}.shares_outstanding == 0"

      - name: fund_invalid_vehicle_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Fund.fields.vehicle_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /funds with vehicle_type='LLC' (not in {REIT, PARTNERSHIP}) returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /funds"
              payload: { name: "Bad", vehicle_type: "LLC", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: valuation_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.Valuation]
        distinguishing_aspect: "Valuation is common_fields:false (append-only); its create response carries id and created_at but no version field, and no update endpoint exists."
        test_recipe:
          setup: ["Fund with one settled holding (1000 shares)."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund IM", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "im@x.com", full_name: "IM", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q1", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { vseq: $.data.seq }
          assert:
            - "Valuation.seq == 1"

      - name: share_class_create_wrong_parent_fund_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.ShareClass.fields.fund_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /funds/{id}/share-classes against a non-existent fund returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /funds/00000000-0000-0000-0000-000000000000/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: list_funds_pagination_envelope
        claim_type: Listing
        grounds: [entities.Fund]
        distinguishing_aspect: "GET /funds returns a paginated array envelope with total_count and has_more after two funds are created."
        test_recipe:
          setup: ["Two funds created."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "F1", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
            - call: "POST /funds"
              payload: { name: "F2", vehicle_type: "PARTNERSHIP", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
          trigger:
            - call: "GET /funds"
              payload: { limit: 1, offset: 0 }
              as: FundManager
          assert:
            - "response.meta has total_count == 2"
            - "response.data length == 1"
            - "response has_more == true"

  # =========================================================================
  # Section: state_machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_subscription_from_settled_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Subscription.PENDING_ACH_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a subscription already SETTLED (cancel only defined from PENDING_ACH) returns ERR_INVALID_STATE (409); no side effects fire."
        test_recipe:
          setup: ["Subscription SETTLED."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund IS", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "is@x.com", full_name: "IS", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /subscriptions/${sub}/cancel"
              payload: {}
              as: Investor
              as_user_id: "${inv}"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: project_dispose_then_stabilize_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Project.STABILIZED_to_DISPOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "After a Project reaches DISPOSED (terminal), POST /projects/{id}/stabilize returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Project ACQUIRED then DISPOSED."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund PJ", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/projects"
              payload: { name: "Proj 1", acquisition_cost_cents: 1000000, appraised_value_cents: 1000000 }
              as: FundManager
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/dispose"
              payload: {}
              as: FundManager
          trigger:
            - call: "POST /projects/${proj_id}/stabilize"
              payload: {}
              as: FundManager
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: subscription_initial_state_pending_ach
        claim_type: Initial State
        grounds: [state_machines.Subscription, entities.Subscription.fields.status]
        distinguishing_aspect: "A newly created subscription starts in PENDING_ACH with provisional_nav_cents populated and shares_allocated null."
        test_recipe:
          setup: ["Fund + approved investor; create subscription."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund INI", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "ini@x.com", full_name: "INI", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id, prov: $.data.provisional_nav_cents }
          assert:
            - "Subscription.${sub}.status == PENDING_ACH"
            - "Subscription.${sub}.provisional_nav_cents == 1000"

      - name: settle_already_settled_subscription_idempotency_rejected
        claim_type: Idempotency
        grounds: [state_machines.Subscription.PENDING_ACH_to_SETTLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Settling a subscription twice: the second settle (status already SETTLED) returns ERR_INVALID_STATE (409); no double-minting of shares."
        test_recipe:
          setup: ["Subscription SETTLED."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund ID2", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "id2@x.com", full_name: "ID2", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
          trigger:
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: distribution_pay_before_valuation_returns_no_valuation
        claim_type: Precondition Enforcement
        grounds: [state_machines.Distribution.DECLARED_to_PAID, "validations[priority=13]", "errors[ERR_NO_VALUATION]"]
        distinguishing_aspect: "Paying a DECLARED distribution when fund.current_valuation_seq == 0 returns ERR_NO_VALUATION (409) — guarded precondition, distinct from invalid-state."
        test_recipe:
          setup: ["Fund with no valuation; a distribution DECLARED."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund NV", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/distributions"
              payload: { period_label: "2026-Q1", dividend_per_share_cents: 1.5 }
              as: FundManager
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Operator
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_NO_VALUATION"

      - name: share_class_resume_cycle_back_to_offering
        claim_type: Valid Transition
        grounds: [state_machines.ShareClass.OFFERING_to_SUSPENDED, state_machines.ShareClass.SUSPENDED_to_OFFERING]
        distinguishing_aspect: "OFFERING->SUSPENDED then SUSPENDED->OFFERING returns the share class to OFFERING (cycle valid transitions both directions)."
        test_recipe:
          setup: ["Fund OPEN with one OFFERING share class."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund SR", vehicle_type: "REIT", gross_asset_value_cents: 0, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /share-classes/${sc_id}/suspend"
              payload: {}
              as: FundManager
          trigger:
            - call: "POST /share-classes/${sc_id}/resume"
              payload: {}
              as: FundManager
              captures: { st: $.data.status }
          assert:
            - "ShareClass.${sc_id}.status == OFFERING"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: penalty_tier1_under_one_year_300bps
        claim_type: Constants Applied
        grounds: [calculations.early_withdrawal_penalty, calculations.penalty_age_quarters]
        distinguishing_aspect: "A holding redeemed at age 0 quarters (settled and redeemed before any valuation, fund seq stays 0) uses tier1 300bps: gross 102500 -> penalty 3075, net 99425."
        test_recipe:
          setup: ["Holding first acquired at seq 0; fund still seq 0 (NAV bootstrap 1000? — need NAV via valuation for gross; but redemption uses fund.nav_per_share which is 1000 even at seq 0). Redeem 100 shares."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund T1", vehicle_type: "REIT", gross_asset_value_cents: 1025000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "t1@x.com", full_name: "T1", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
              captures: { holding: $.data.holding_id }
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q1", gross_asset_value_cents: 1025000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "GET /holdings/${holding}"
              payload: {}
              as: Operator
              captures: { hv: $.data.version }
            - call: "POST /redemption-requests"
              payload: { holding_id: "${holding}", shares_requested: 100, expected_holding_version: "${hv}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { rr: $.data.id }
          trigger:
            - call: "POST /redemption-requests/${rr}/force-fulfill"
              payload: {}
              as: Operator
              captures: { net: $.data.net_proceeds_cents }
          assert:
            - "RedemptionRequest.${rr}.penalty_tier_rate_bps == 300"
            - "RedemptionRequest.${rr}.gross_value_cents == 102500"
            - "RedemptionRequest.${rr}.penalty_cents == 3075"
            - "RedemptionRequest.${rr}.net_proceeds_cents == 99425"

      - name: cash_distribution_allocation_per_holding_precision
        claim_type: Correct Result
        grounds: [calculations.dividend_allocation, entities.DistributionAllocation.fields.gross_dividend_cents]
        distinguishing_aspect: "A single 1000-share CASH holding at 2.5c/share allocates gross_dividend_cents = round_half_up(1000*2.5)=2500; mode=CASH (drip not elected)."
        test_recipe:
          setup: ["Fund with one settled holding 1000 shares (drip_elected false), NAV 1000 via valuation, distribution 2.5c/share declared."]
          setup_api_calls:
            - call: "POST /funds"
              payload: { name: "Fund CD", vehicle_type: "REIT", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
              captures: { fund_id: $.data.id, fund_v0: $.data.version }
            - call: "POST /funds/${fund_id}/share-classes"
              payload: { class_code: "A", min_investment_cents: 100000, mgmt_fee_bps: 100 }
              as: FundManager
              captures: { sc_id: $.data.id }
            - call: "POST /investors"
              payload: { email: "cd@x.com", full_name: "CD", accredited_status: "ACCREDITED", annual_income_cents: 50000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { inv: $.data.id }
            - call: "POST /investors/${inv}/approve-suitability"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { investor_id: "${inv}", share_class_id: "${sc_id}", funded_amount_cents: 1000000, drip_elected: false, expected_fund_version: "${fund_v0}" }
              as: Investor
              as_user_id: "${inv}"
              captures: { sub: $.data.id }
            - call: "POST /subscriptions/${sub}/settle"
              payload: {}
              as: Operator
              captures: { holding: $.data.holding_id }
            - call: "POST /funds/${fund_id}/valuations"
              payload: { period_label: "2026-Q1", gross_asset_value_cents: 1000000, total_liabilities_cents: 0 }
              as: FundManager
            - call: "POST /funds/${fund_id}/distributions"
              payload: { period_label: "2026-Q1", dividend_per_share_cents: 2.5 }
              as: FundManager
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /distributions/${dist_id}/pay"
              payload: {}
              as: Operator
