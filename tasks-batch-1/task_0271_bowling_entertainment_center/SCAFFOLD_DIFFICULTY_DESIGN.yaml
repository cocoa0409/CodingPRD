            - "Customer.${c_id}.deposit_balance_cents == 1920 after hold"
            - "Customer.${c_id}.deposit_balance_cents == 0 after cancel"
            - "Customer.${c_id}.wallet_credit_cents == 1920 after cancel (balance moved, ledger conserved)"

      - name: rental_inventory_conserved_on_take_then_return
        grounds:
          - state_machines.Reservation.DRAFT_to_HELD
          - entities.RentalItem.fields.total_count
          - entities.RentalItem.fields.available_count
          - entities.RentalItem.fields.out_on_rent_count
        distinguishing_aspect: "A different conserved quantity = rental inventory: invariant total_count == available_count + out_on_rent_count must hold before and after a take+return cycle; taking 3 of 5 then returning restores available_count to 5 with out_on_rent_count 0."
        test_recipe:
          setup:
            - "RateCard rc, Lane L IN_SERVICE, Customer C ACTIVE, RentalItem RI BALL total_count=5."
            - "R HELD on L; take 3 of RI (OPEN line), then return the line."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "I2", per_game_cents: 500, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 141 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "i2@x.com", full_name: "I2 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /rental-items"
              payload: { kind: "BALL", label: "12lb", unit_price_cents: 400, total_count: 5 }
              as: CenterManager
              captures: { ri_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-08-16T18:00:00.000Z", end_at: "2026-08-16T19:00:00.000Z", bowler_count: 3, game_count: 1 }
              as: FrontDesk
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/hold"
              payload: {}
              as: FrontDesk
            - call: "POST /rental-lines"
              payload: { reservation_id: "${r_id}", rental_item_id: "${ri_id}", quantity: 3 }
              as: FrontDesk
              captures: { rl_id: $.data.id }
            - call: "GET /rental-items/${ri_id}"
              payload: {}
              as: FrontDesk
              captures: { avail_mid: $.data.available_count, out_mid: $.data.out_on_rent_count }
          trigger:
            - call: "POST /rental-lines/${rl_id}/return"
              payload: {}
              as: FrontDesk
            - call: "GET /rental-items/${ri_id}"
              payload: {}
              as: FrontDesk
              captures: { avail_after: $.data.available_count, out_after: $.data.out_on_rent_count }
          assert:
            - "RentalItem.${ri_id}.available_count == 2 and out_on_rent_count == 3 while line OPEN"
            - "RentalItem.${ri_id}.available_count == 5 and out_on_rent_count == 0 after return"
            - "RentalItem.${ri_id}.total_count == RentalItem.${ri_id}.available_count + RentalItem.${ri_id}.out_on_rent_count throughout"

