        claim_type: precision
        grounds:
          - calculations.gauge_capability.precision
        excluded_because:
          difficulty_instance: boundary_precision_check / gauge_cpk_at_capable_threshold_versus_one_ten_thousandth_below
          rationale: "The round-before-banding rule and its 1/10000 discriminator are the subject of the named 1.8 instance."
      - name: cpk_threshold_split_between_capable_and_marginal
