              payload: { name: "Expiry Check", spirit_type: "BOURBON", min_quality_score: 0, required_barrel_count: 1, reservation_window_days: 45 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /barrel-aging/private-selection-programs/${prog_id}/reservations"
              payload: { barrel_id: "${b_id}", expected_program_version: "${prog_v}" }
              as: ProgramDirector
              captures: { res_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-10-17T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /barrel-aging/private-selection-programs/${prog_id}", as: ProgramDirector }
            - { call: "GET /barrel-aging/private-selection-programs/${prog_id}/reservations?state=EXPIRED", as: ProgramDirector }
            - call: "POST /barrel-aging/reservations/${res_id}/consume"
              as: ProgramDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "PrivateSelectionProgram.${prog_id}.available_slots == 1 (expiry restored the quota)"
            - "the EXPIRED-filtered reservation list contains exactly ${res_id}"
            - "err_id == ERR_INVALID_STATE_TRANSITION (consuming an expired reservation)"

      - name: cross_cutting_cascade_covered_by_commission_chain
        claim_type: cascade_chain
        grounds:
          - "complexity_profile.complexity_layers[cascading_side_effects]"
        excluded_because:
          difficulty_instance: commission_cascade_materializes_slots_and_posture
          rationale: "The N-level cascade claim is exercised end-to-end by the named difficulty instance (and by dump_cascade_frees_slot_and_flips_posture for the reverse direction)."

      - name: cross_cutting_dual_variant_covered_by_barrel_volume
        claim_type: variant_divergence
        grounds:
          - "complexity_profile.complexity_layers[dual_variant_calculation]"
        excluded_because:
          difficulty_instance: barrel_volume_ledger_vs_statutory_divergence
          rationale: "Both variants' expected values and their delta are asserted in the named difficulty instance."

  - section: consistency_model
    instances:
      - name: immediate_consistency_covered_by_commit_cycle
        claim_type: immediate_consistency
        grounds:
          - "complexity_profile.consistency_model"
        excluded_because:
          difficulty_instance: blend_batch_revision_cycle_commits
          rationale: "That instance asserts the component barrel's ledger reads 80.00 in the immediate read after commit (immediate model; no lag)."

  - section: state_machines
    instances:
      - name: program_locks_when_quota_consumed
        claim_type: bubble_up
        grounds:
          - "state_machines.PrivateSelectionProgram.SELECTION_to_LOCKED"
          - "state_machines.BarrelReservation.ACTIVE_to_CONSUMED"
          - "calculations.program_available_slots"
        distinguishing_aspect: "Bubble-up auto-transition: consuming the reservation that brings the CONSUMED count to required_barrel_count flips the program SELECTION -> LOCKED in the same request, and a subsequent reservation against the locked program is rejected at the state gate (priority 6) even though quota is also zero (priority 8)."
        test_recipe:
          setup: ["Rickhouse 1x1x2 commissioned; barrels b1 and b2 both MATURE_ELIGIBLE BOURBON; program required_barrel_count 1, window 45 days; b1 reserved."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-S8", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 2, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { s1: "$.data[0].id", s2: "$.data[1].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s1}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 0 }
              as: WarehouseManager
              captures: { b1: $.data.id }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${s2}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 0 }
              as: WarehouseManager
              captures: { b2: $.data.id }
            - call: "POST /barrel-aging/private-selection-programs"
              payload: { name: "Lock Check", spirit_type: "BOURBON", min_quality_score: 0, required_barrel_count: 1, reservation_window_days: 45 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /barrel-aging/private-selection-programs/${prog_id}/reservations"
              payload: { barrel_id: "${b1}", expected_program_version: "${prog_v}" }
              as: ProgramDirector
              captures: { res_id: $.data.id }
          trigger:
            - { call: "POST /barrel-aging/reservations/${res_id}/consume", as: ProgramDirector }
            - { call: "GET /barrel-aging/private-selection-programs/${prog_id}", as: ProgramDirector, captures: { prog_v3: $.data.version } }
            - call: "POST /barrel-aging/private-selection-programs/${prog_id}/reservations"
              payload: { barrel_id: "${b2}", expected_program_version: "${prog_v3}" }
              as: ProgramDirector
              captures: { err_id: $.data.error_id }
          assert:
            - "after consume: PrivateSelectionProgram.${prog_id}.state == LOCKED (bubble-up) and available_slots == 0"
            - "PrivateSelectionProgram.${prog_id}.version == 3 (create 1, reserve 2, consume-with-lock 3)"
            - "reservation against the LOCKED program: err_id == ERR_INVALID_STATE_TRANSITION"
            - "no reservation exists for ${b2}"

  - section: endpoints
    instances:
      - name: single_resource_retrieval_reads
        claim_type: retrieval
        grounds:
          - "endpoints"
        distinguishing_aspect: "Single-resource GETs return stored data with computed fields resolved: the expansion project (state APPROVED, approved_at stamped), the label (REGISTERED, immutable age statement), and the warehouse slot (heat_factor computed)."
        test_recipe:
          setup: ["Project approved (rickhouse exists in PLANNED); a label registered; after commission, a floor-2 slot readable."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-P6", region_code: "TN", floors: 2, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 70000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - call: "POST /barrel-aging/labels"
              payload: { name: "Read Me", age_statement_years: 6, spirit_type: "SINGLE_MALT" }
              as: MasterBlender
              captures: { lbl_id: $.data.id }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_f2: "$.data[1].id" } }
          trigger:
            - { call: "GET /barrel-aging/expansion-projects/${proj_id}", as: DistilleryPlanner }
            - { call: "GET /barrel-aging/labels/${lbl_id}", as: MasterBlender }
            - { call: "GET /barrel-aging/warehouse-slots/${slot_f2}", as: WarehouseManager }
          assert:
            - "project read: state == COMMISSIONED, approved_at == 2026-09-01T00:00:00Z, commissioned_at == 2028-08-21T00:00:00Z, planned_annual_distillation_liters == 70000"
            - "label read: state == REGISTERED and age_statement_years == 6"
            - "slot read: floor_index == 2 and heat_factor == 1.05"

      - name: filtered_lists_and_reverse_lookups
        claim_type: retrieval
        grounds:
          - "entities.SlotOccupancy.fields.slot_id"
          - "entities.BarrelAssessment.fields.barrel_id"
          - "entities.BarrelReservation.fields.barrel_id"
          - "entities.BlendBatch.fields.label_id"
        distinguishing_aspect: "Filtered-list and sub-resource reads resolve every remaining FK direction: occupancies by slot, assessments and reservations by barrel, blend batches by label_id, reports by state."
        test_recipe:
          setup: ["Rickhouse 1x1x1 commissioned; barrel (min_maturation_months 0) filled 2028-09-01; one EVAPORATION_READING; one label with one blend batch; one program with one ACTIVE reservation on the barrel; one OPEN report."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
              payload: { name: "RH-P7", region_code: "KY", floors: 1, rows_per_floor: 1, positions_per_row: 1, construction_lag_months: 24, planned_annual_distillation_liters: 50000 }
              as: DistilleryPlanner
              captures: { proj_id: $.data.id }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/approve", as: OperationsDirector }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-08-21T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /barrel-aging/expansion-projects/${proj_id}/commission", as: OperationsDirector }
            - { call: "GET /barrel-aging/rickhouses?expansion_project_id=${proj_id}", as: PlatformAdmin, captures: { rh_id: "$.data[0].id" } }
            - { call: "GET /barrel-aging/rickhouses/${rh_id}/slots", as: PlatformAdmin, captures: { slot_a: "$.data[0].id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2028-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/barrels"
              payload: { slot_id: "${slot_a}", wood_origin: "AMERICAN_WHITE_OAK", seasoning_months: 12, char_level: 3, spirit_type: "BOURBON", fill_proof: 125.0, fill_volume_liters: 200.0, min_maturation_months: 0 }
              as: WarehouseManager
              captures: { b_id: $.data.id }
            - call: "POST /barrel-aging/barrels/${b_id}/assessments"
              payload: { kind: "EVAPORATION_READING", measured_volume_liters: 199.0 }
              as: WarehouseManager
            - call: "POST /barrel-aging/labels"
              payload: { name: "Filter Me", age_statement_years: 1, spirit_type: "BOURBON" }
              as: MasterBlender
              captures: { lbl_id: $.data.id }
            - call: "POST /barrel-aging/blend-batches"
              payload: { label_id: "${lbl_id}", scheduled_bottling_date: "2030-09-01T00:00:00Z" }
              as: MasterBlender
              captures: { bb_id: $.data.id }
            - call: "POST /barrel-aging/private-selection-programs"
              payload: { name: "Reverse Me", spirit_type: "BOURBON", min_quality_score: 0, required_barrel_count: 1, reservation_window_days: 45 }
              as: ProgramDirector
              captures: { prog_id: $.data.id, prog_v: $.data.version }
            - call: "POST /barrel-aging/private-selection-programs/${prog_id}/reservations"
              payload: { barrel_id: "${b_id}", expected_program_version: "${prog_v}" }
              as: ProgramDirector
              captures: { res_id: $.data.id }
            - call: "POST /barrel-aging/bonded-reports"
              payload: { period_start: "2028-08-01T00:00:00Z", period_end: "2028-12-01T00:00:00Z" }
              as: BondedPreparer
              captures: { rep_id: $.data.id }
          trigger:
            - { call: "GET /barrel-aging/warehouse-slots/${slot_a}/occupancies", as: WarehouseManager }
            - { call: "GET /barrel-aging/barrels/${b_id}/assessments", as: WarehouseManager }
            - { call: "GET /barrel-aging/barrels/${b_id}/reservations", as: ProgramDirector }
            - { call: "GET /barrel-aging/blend-batches?label_id=${lbl_id}", as: MasterBlender }
            - { call: "GET /barrel-aging/bonded-reports?state=OPEN", as: BondedPreparer }
          assert:
            - "slot-side occupancies: exactly 1, barrel_id == ${b_id}, status OPEN, move_reason INITIAL_FILL"
            - "barrel-side assessments: exactly 1 with measured_volume_liters == 199.00"
            - "barrel-side reservations: exactly 1 with id == ${res_id} and state ACTIVE"
            - "label_id filter returns exactly the batch ${bb_id}"
            - "state=OPEN filter returns exactly the report ${rep_id}"
