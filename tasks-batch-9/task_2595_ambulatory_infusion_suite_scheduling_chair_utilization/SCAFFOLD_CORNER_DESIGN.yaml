          assert:
            - "${ap1_v1} == 1 and ${ap1_v2} == 2 and ${ap1_confirmed} == 'CONFIRMED' — every accepted write increments the version"
            - "${e_stale} == 'ERR_STALE_APPOINTMENT_VERSION' with HTTP 412 — the client's view of version 1 is two writes behind"
            - "${ap1_vnow} == 2 and ${ap1_status_mid} == 'CONFIRMED' — the refused reschedule neither bumped the version nor moved the row"
            - "Second reschedule returns HTTP 201 with ${ap2_from} == ${ap1}, ${ap2_date} == '2026-08-17', ${ap2_start} == 540 and ${ap2_v} == 1"
            - "${ap2_chair} == ${ch1} and ${ap1_chair} == ${ch1} — the original chair is released before the selector re-runs, so the replacement can reclaim it"
            - "${ap1_final_status} == 'CANCELLED' with ${ap1_final_v} == 3 and ${ap1_charge} == 0 — the retirement is a zero-charge cancel and is itself a versioned write"
            - "Chair.${ch1}.committed_minutes == 240 and Nurse.${nr1}.assigned_acuity_points == 3 — one live visit, not two"
            - "GET /infusion-centers/${ctr}/utilization with service_date 2026-08-10 and variant SCHEDULED returns utilization_pct 0.00 — the vacated day is empty"
            - "GET /appointments returns exactly 2 rows: the CANCELLED original and the TENTATIVE replacement"

      - name: lot_adjustment_rejects_a_stale_lot_version_then_accepts_the_current_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lot-adjustment-stale-lot-version]
          - errors[ERR_STALE_LOT_VERSION]
          - endpoints[POST /drug-lots/{id}/adjustments]
        distinguishing_aspect: |
          Two successive physical recounts are each individually legal, so a second adjustment
          derived from a pre-recount view would silently discard the first one's delta. The
          guard is the only thing that surfaces it, and it has to be checked before the units
          arithmetic runs — the refused call must leave units_received, units_available, the
          derived status AND the version exactly where the first adjustment left them.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. One drug and one lot LOT-DEC with 10 units received, expiring 2026-12-01. The creation response's version is the client's view."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Pharmacist
            - call: "POST /drugs"
              payload: { name: "Infliximab-Ref", is_biosimilar: false, base_administration_minutes: 120, min_administration_minutes: 90, premedication_minutes: 30, observation_minutes_first_dose: 60, observation_minutes_subsequent: 30, acuity_points: 2, prep_stability_minutes: 240, unit_cost_cents: 90000, requires_lab_gate: true, lab_min_anc: 1.5, lab_min_platelets: 100 }
              as: Pharmacist
              captures: { dr1: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${dr1}", lot_number: "LOT-DEC", units_received: 10, expires_on: "2026-12-01T00:00:00Z" }
              as: Pharmacist
              captures: { lot1: $.data.id, lot1_v1: $.data.version, lot1_avail1: $.data.units_available }
          trigger:
            - call: "POST /drug-lots/${lot1}/adjustments"
              payload: { units_delta: 5, reason: "Second carton found in the fridge" }
              as: Pharmacist
              captures: { e_missing_occ: $.data.error_id }
            - call: "POST /drug-lots/${lot1}/adjustments"
              payload: { units_delta: 5, reason: "Second carton found in the fridge", expected_drug_lot_version: "${lot1_v1}" }
              as: Pharmacist
              captures: { lot1_v2: $.data.version, lot1_recv2: $.data.units_received, lot1_avail2: $.data.units_available }
            - call: "POST /drug-lots/${lot1}/adjustments"
              payload: { units_delta: -3, reason: "Breakage", expected_drug_lot_version: "${lot1_v1}" }
              as: Pharmacist
              captures: { e_stale: $.data.error_id }
            - call: "GET /drug-lots/${lot1}"
              payload: {}
              as: Pharmacist
              captures: { lot1_vnow: $.data.version, lot1_recv_mid: $.data.units_received, lot1_status_mid: $.data.status }
            - call: "POST /drug-lots/${lot1}/adjustments"
              payload: { units_delta: -3, reason: "Breakage", expected_drug_lot_version: "${lot1_vnow}" }
              as: Pharmacist
              captures: { lot1_v3: $.data.version, lot1_recv3: $.data.units_received, lot1_avail3: $.data.units_available }
          assert:
            - "${lot1_v1} == 1 and ${lot1_avail1} == 10"
            - "${e_missing_occ} == 'ERR_INVALID_REQUEST' with HTTP 422 — expected_drug_lot_version is a required input, not an optional guard"
            - "${lot1_v2} == 2 with ${lot1_recv2} == 15 and ${lot1_avail2} == 15"
            - "${e_stale} == 'ERR_STALE_LOT_VERSION' with HTTP 412 — the client is replaying the pre-recount version"
            - "${lot1_vnow} == 2, ${lot1_recv_mid} == 15 and ${lot1_status_mid} == 'AVAILABLE' — the refused adjustment moved neither the units nor the version"
            - "${lot1_v3} == 3 with ${lot1_recv3} == 12 and ${lot1_avail3} == 12 — the retry against the re-read version applies the -3"
            - "DrugLot.${lot1}.units_committed == 0, units_administered == 0, units_wasted == 0 and units_returned == 0 throughout — adjustments touch units_received only"

      - name: plan_revision_rejects_a_stale_plan_version_then_accepts_the_current_one
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[plan-revision-stale-plan-version]
          - errors[ERR_STALE_PLAN_VERSION]
          - endpoints[POST /treatment-plans/{id}/revisions]
        distinguishing_aspect: |
          The plan's version does not move because someone edited the plan — it moves because
          a discharge elsewhere in the system rolled completed_cycles and first_dose_completed
          into it. That makes this the most realistic stale-view case in the domain: a
          director who read the regimen before the first infusion and files a dose revision
          afterwards would otherwise silently reset the cycle counters. The 412 must fire
          before the supersede cascade, so the plan must still be ACTIVE afterwards, and the
          retry against the re-read version must supersede it cleanly.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z. Standing center, chair, nurse, drug (requires_lab_gate true), 10-unit lot, MID template, one 70 kg patient."
            - "Plan P1 at 10 mg/kg with total_cycles 6 is created and its creation version is remembered as the director's view."
            - "Cycle 1 on 2026-08-10 at 540 is then carried all the way to COMPLETED (authorized, confirmed, lab resulted, prepared at 08:30, checked in, started 09:00, infusion completed 11:30, discharged 13:15), which rolls the plan's counters."
