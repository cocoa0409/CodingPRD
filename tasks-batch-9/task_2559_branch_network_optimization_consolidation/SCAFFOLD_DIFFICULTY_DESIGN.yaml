        grounds:
          - state_machines.ConsolidationCase.NOTICE_FILED_to_CLOSURE_EXECUTED
          - state_machines.Branch.CLOSURE_SCHEDULED_to_CLOSED
          - state_machines.PropertyDisposition.PENDING_to_MARKETED
