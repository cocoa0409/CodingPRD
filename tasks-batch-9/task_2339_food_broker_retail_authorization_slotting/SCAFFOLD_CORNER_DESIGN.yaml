            - call: "POST /deductions/${d3}/substantiate"
              payload: { document_ref: "DUP-3001" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${d3}/substantiate"
              payload: { document_ref: "DUP-3002" }
              as: BrokerAccountManager
              as_user_id: "u_am_1"
            - call: "POST /deductions/${d3}/approve-recovery"
              payload: {}
              as: BrokerAuditManager
              as_user_id: "u_audit_1"
              captures: { rec3: $.data.recovered_cents, con3: $.data.conceded_cents, ss3: $.data.settlement_state }
          assert:
            - "Call 1 returns 422 ERR_DUPLICATE_LINK_INVALID — a DUPLICATE_BILLBACK must have the SAME amount_cents as its original (60001 != 60000)"
            - "Call 2 returns 422 ERR_PROMO_LINK_INVALID — PROMO_BILLBACK without promotion_event_id"
            - "SHORTAGE: ${rec1} == 45000 == floor(90001*5000/10000) (floor, not round — 45000.5 must not become 45001), ${con1} == 45001, open_cents == 0, ${ss1} == RECOVERED"
            - "COMPLIANCE_FINE: ${rec2} == 0, ${con2} == 75000, ${ss2} == CONCEDED while ${ds2} == APPROVED — the two dimensions disagree on purpose"
            - "DUPLICATE_BILLBACK: ${rec3} == 60000 (the whole claim), ${con3} == 0, ${ss3} == RECOVERED"
            - "For every deduction amount_cents == recovered_cents + conceded_cents + open_cents holds after the approval"
            - "Principal.${prin}.open_deduction_cents == 60000 at the end — only the untouched ${d0} is still OPEN (90001 + 75000 + 60000 settled)"

