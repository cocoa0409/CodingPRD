  # ===========================================================================
  - section: rbac
    instances:
      - name: store_clerk_cannot_issue_recall
        claim_type: peer_roles
        grounds:
          - roles.StoreClerk
          - roles.InventoryManager
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "POST /recalls is exclusive to InventoryManager; a StoreClerk attempt → 403 ERR_INSUFFICIENT_PERMISSIONS."
        test_recipe:
          setup: ["Product P exists."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "P-RB", name: "P", category: "FOOD", unit_price_cents: 1000 }
              as: InventoryManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /recalls"
              payload: { product_id: "${p_id}", severity: "ADVISORY" }
              as: StoreClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_INSUFFICIENT_PERMISSIONS"

      - name: customer_cannot_pause_other_customers_subscription
        claim_type: peer_roles
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
          - roles.Customer
        distinguishing_aspect: "A Customer (X-User-ID = C2) pausing C1's subscription → 403 ERR_NOT_RESOURCE_OWNER (ownership check)."
        test_recipe:
          setup: ["Customers C1 and C2; C1 has an ACTIVE subscription."]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "S", state_code: "CA" }
              as: InventoryManager
              captures: { s_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "P", name: "P", category: "FOOD", unit_price_cents: 1000 }
