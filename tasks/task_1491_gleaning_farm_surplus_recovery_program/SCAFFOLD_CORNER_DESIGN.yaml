        claim_type: optimistic_concurrency
        grounds:
          - 'concurrency_rules[offer-close-stale-version]'
          - 'errors[ERR_STALE_OFFER_VERSION]'
        distinguishing_aspect: "Close with expected_offer_version observed before an intervening mutation (incident resolution bumped the offer's event, not the offer — here the stale version arises from a prior successful close-attempt-side mutation: use two reads, mutate via second path) — concretely: read v, then create a templog/incident (no offer bump) does not change offer version; instead a SECOND coordinator's distribution-driven event bump also leaves offer version intact. The deterministic stale path: read offer version v after GLEANED, close succeeds (v -> v+1); a replayed close carrying the ORIGINAL v fails 412 ERR_STALE_OFFER_VERSION or 409 terminal."
        test_recipe:
          setup: ["offer GLEANED (reconciled event, no incidents)"]
          setup_api_calls:
            - call: "POST /glean/farms"
              payload: { farm_name: "OC", contact_email: "oc@x.com", county_code: "OC1", donor_tin: "51-1111111" }
