scaffold_corner_design:
  # =====================================================================
  # Section: entities — creation/retrieval/listing/not-found/required-fields/
  # defaults/computed/system-fields/type-constraints/immutability/parent
  # =====================================================================
  - section: entities
    instances:
      - name: team_creation_required_fields
        claim_type: creation
        grounds: ["entities.Team.fields.team_code", "entities.Team.fields.display_name"]
        distinguishing_aspect: "POST /travel/teams with team_code+display_name returns 201 + server-minted id, created_at, version=1"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
          trigger:
            - call: "POST /travel/teams"
              payload: { team_code: "GSW", display_name: "Golden State" }
              as: TravelOpsAdmin
              captures: { team: $.data }
          assert:
            - "http status == 201"
            - "Team.id is a UUID"
            - "Team.version == 1"
            - "Team.league_rest_policy == STANDARD (default applied)"

      - name: team_get_not_found
        claim_type: not_found
        grounds: ["entities.Team", "endpoints.GET_/travel/teams/{teamId}"]
        distinguishing_aspect: "GET /travel/teams/{random-uuid} returns 404 ERR_TEAM_NOT_FOUND"
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
          trigger:
            - call: "GET /travel/teams/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "http status == 404"
            - "error_id == ERR_TEAM_NOT_FOUND"

      - name: trip_computed_party_size
        claim_type: computed_field
        grounds: ["entities.Trip.fields.party_size"]
        distinguishing_aspect: "party_size is computed from count of TravelPartyMember status IN; client-supplied value must be ignored"
        test_recipe:
          setup: ["team, season, trip exist"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "HOU", display_name: "Houston" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 50000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "DAL", game_tipoff_utc: "2027-03-01T00:00:00Z", return_arrival_utc: "2027-03-02T08:00:00Z" }
              as: TravelManager
              captures: { trip: $.data }
          assert:
            - "Trip.party_size == 0 (computed; no members yet)"
            - "Trip.estimated_cost_cents == 0"
            - "Trip.posture == DRAFT (initial state)"

      - name: member_enum_party_role_validation
        claim_type: type_constraint
        grounds: ["entities.TravelPartyMember.fields.party_role"]
        distinguishing_aspect: "party_role outside the enum set (e.g. 'VIP') must be rejected with ERR_INVALID_REQUEST"
        test_recipe:
          setup: ["team/season/trip"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "IND", display_name: "Indiana" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 50000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "CHI", game_tipoff_utc: "2027-03-05T00:00:00Z", return_arrival_utc: "2027-03-06T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "X01", party_role: "VIP", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
              captures: { err: $.data.error_id }
          assert:
            - "http status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: member_list_filtered_by_status
        claim_type: listing
        grounds: ["entities.TravelPartyMember.fields.status", "endpoints.GET_/travel/teams/{teamId}/trips/{tripId}/members"]
        distinguishing_aspect: "GET /members?status=IN returns only IN members; total_count reflects filter"
        test_recipe:
          setup: ["3 members: 2 IN, 1 SCRATCHED"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "WAS", display_name: "Washington" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 50000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "BOS", game_tipoff_utc: "2027-03-10T00:00:00Z", return_arrival_utc: "2027-03-11T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "W1", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
              captures: { w1: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "W2", party_role: "COACH", travel_class: "CHARTER_STANDARD", per_diem_tier: "TIER_B" }
              as: TravelManager
              captures: { w2: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "W3", party_role: "STAFF", travel_class: "COMMERCIAL_COACH", per_diem_tier: "TIER_C" }
              as: TravelManager
              captures: { w3: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${w3}/scratch"
              payload: {}
              as: TravelManager
          trigger:
            - call: "GET /travel/teams/${team_id}/trips/${trip_id}/members?status=IN"
              payload: {}
              as: Any
              captures: { list: $.data }
          assert:
            - "response.meta.response_type == 'array'"
            - "list contains exactly 2 members (W1, W2)"
            - "list does not contain ${w3}"

      - name: equipment_chargeback_default_zero
        claim_type: defaults
        grounds: ["entities.EquipmentShipment.fields.chargeback_cents"]
        distinguishing_aspect: "New EquipmentShipment has chargeback_cents == 0 by default before any load"
        test_recipe:
          setup: ["team/season/trip"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "DET", display_name: "Detroit" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 50000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "MIL", game_tipoff_utc: "2027-03-15T00:00:00Z", return_arrival_utc: "2027-03-16T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/equipment"
              payload: { shipment_kind: "TEAM_GEAR", gross_weight_lb: 500, piece_count: 5, declared_value_cents: 50000 }
              as: EquipmentManager
              captures: { ship: $.data }
          assert:
            - "EquipmentShipment.${ship}.status == STAGED (initial state)"
            - "EquipmentShipment.${ship}.chargeback_cents == 0 (default)"

  # =====================================================================
  # Section: state_machines — invalid-from rejection, terminal lockdown,
  # initial state, idempotency, compound parent
  # =====================================================================
  - section: state_machines
    instances:
      - name: trip_lock_from_locked_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Trip.transitions"]
        distinguishing_aspect: "Second lock attempt on already-LOCKED trip rejected with ERR_TRIP_NOT_DRAFT (not generic ERR_INVALID_STATE)"
        test_recipe:
          setup: ["trip already LOCKED"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "CHA", display_name: "Charlotte" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "ATL", game_tipoff_utc: "2027-03-20T00:00:00Z", return_arrival_utc: "2027-03-21T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "C01", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "CLT", destination_code: "ATL", scheduled_depart_utc: "2027-03-19T18:00:00Z", scheduled_arrive_utc: "2027-03-19T19:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HATL", room_count: 1, rate_cents_per_night: 20000, check_in_date: "2027-03-19", night_count: 1, cutoff_date: "2027-03-15" }
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/lock"
              payload: { expected_trip_version: "${trip_v0}" }
              as: TravelManager
              captures: { locked_trip: $.data }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/lock"
              payload: { expected_trip_version: "${locked_trip.version}" }
              as: TravelManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TRIP_NOT_DRAFT"
            - "http status == 409"

      - name: terminal_trip_cancel_rejected
        claim_type: terminal_lockdown
        grounds: ["state_machines.Trip.terminal_states"]
        distinguishing_aspect: "Trip in CLOSED is terminal; further cancel attempt returns ERR_TRIP_ALREADY_TERMINAL"
        test_recipe:
          setup: ["fully closed trip via depart+arrive+close"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "MIL", display_name: "Milwaukee" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "CHI", game_tipoff_utc: "2027-03-25T00:00:00Z", return_arrival_utc: "2027-03-26T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "M01", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A" }
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs"
              payload: { leg_seq: 1, origin_code: "MKE", destination_code: "ORD", scheduled_depart_utc: "2027-03-24T18:00:00Z", scheduled_arrive_utc: "2027-03-24T19:00:00Z", is_charter: false }
              as: TravelCoordinator
              captures: { leg_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/book"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HCHI", room_count: 1, rate_cents_per_night: 20000, check_in_date: "2027-03-24", night_count: 1, cutoff_date: "2027-03-20" }
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/lock"
              payload: { expected_trip_version: "${trip_v0}" }
              as: TravelManager
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/depart"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/flight-legs/${leg_id}/arrive"
              payload: {}
              as: TravelCoordinator
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/close"
              payload: {}
              as: TravelFinanceLead
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/cancel"
              payload: {}
              as: TravelManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TRIP_ALREADY_TERMINAL"

      - name: charter_execute_requires_countersigned
        claim_type: precondition_enforcement
        grounds: ["state_machines.CharterContract.VENDOR_COUNTERSIGNED_to_TEAM_EXECUTED"]
        distinguishing_aspect: "Execute on a SUBMITTED (not yet countersigned) contract fails with ERR_CONTRACT_NOT_VENDOR_COUNTERSIGNED"
        test_recipe:
          setup: ["contract in SUBMITTED status"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "NY", display_name: "NY Nets" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 1000000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "BOS", game_tipoff_utc: "2027-04-01T00:00:00Z", return_arrival_utc: "2027-04-02T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts"
              payload: { vendor_code: "VX", base_price_cents: 5000000, fuel_surcharge_cap_cents: 500000, seat_capacity: 30, cargo_capacity_lb: 10000, penalty_bands: [{days_before: 30, penalty_pct: 10}] }
              as: TravelManager
              captures: { contract_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/submit"
              payload: {}
              as: TravelManager
              captures: { contract_v: $.data.version }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/charter-contracts/${contract_id}/execute"
              payload: { expected_contract_version: "${contract_v}" }
              as: TravelFinanceLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CONTRACT_NOT_VENDOR_COUNTERSIGNED"
            - "http status == 409"

      - name: ledger_pay_from_draft_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PerDiemLedger.transitions"]
        distinguishing_aspect: "Pay attempt on a DRAFT (never approved) ledger fails with ERR_LEDGER_NOT_APPROVED"
        test_recipe:
          setup: ["ledger in DRAFT"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "SAC", display_name: "Sacramento" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "OAK", game_tipoff_utc: "2027-04-05T00:00:00Z", return_arrival_utc: "2027-04-06T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "S01", party_role: "STAFF", travel_class: "COMMERCIAL_COACH", per_diem_tier: "TIER_C" }
              as: TravelManager
              captures: { m_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m_id}/per-diem"
              payload: { service_date: "2027-04-05", day_kind: "GAME_DAY", meals_provided_count: 0 }
              as: TravelFinanceLead
              captures: { ledger_id: $.data.id }
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members/${m_id}/per-diem/${ledger_id}/pay"
              payload: {}
              as: TravelFinanceLead
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_LEDGER_NOT_APPROVED"

      - name: room_checkin_requires_block_locked
        claim_type: precondition_enforcement
        grounds: ["state_machines.RoomAssignment.CONFIRMED_to_CHECKED_IN"]
        distinguishing_aspect: "Checkin on a room in a HOLDING (not yet LOCKED) block fails — cross-entity guard"
        test_recipe:
          setup: ["block in HOLDING, room assignment CONFIRMED"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "NOP", display_name: "New Orleans" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "MEM", game_tipoff_utc: "2027-04-10T00:00:00Z", return_arrival_utc: "2027-04-11T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
              payload: { member_ref: "N01", party_role: "PLAYER", travel_class: "CHARTER_FIRST", per_diem_tier: "TIER_A", requires_single_room: true }
              as: TravelManager
              captures: { m_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks"
              payload: { hotel_code: "HMEM", room_count: 2, rate_cents_per_night: 22000, check_in_date: "2027-04-09", night_count: 1, cutoff_date: "2027-04-05" }
              as: TravelCoordinator
              captures: { block_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks/${block_id}/rooms"
              payload: { member_id: "${m_id}", room_label: "701" }
              as: TravelCoordinator
              captures: { room_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks/${block_id}/rooms/${room_id}/confirm"
              payload: {}
              as: TravelCoordinator
          trigger:
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/hotel-blocks/${block_id}/rooms/${room_id}/checkin"
              payload: {}
              as: TravelCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_BLOCK_NOT_NAME_LIST_DUE (or ERR_INVALID_STATE if block still HOLDING)"
            - "http status == 409"

      - name: compound_trip_posture_derived_from_children
        claim_type: compound_state_derivation
        grounds: ["entities.Trip.fields.posture", "state_machines.Trip.transitions"]
        distinguishing_aspect: "Trip posture is derived from child states: opening a ContingencyEvent on LOCKED trip flips posture to DISRUPTED without an explicit Trip-level endpoint call"
        test_recipe:
          setup: ["trip LOCKED with a BOOKED leg"]
          setup_api_calls:
            - call: "POST /travel/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TravelOpsAdmin
            - call: "POST /travel/teams"
              payload: { team_code: "OKC", display_name: "Oklahoma City" }
              as: TravelOpsAdmin
              captures: { team_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/seasons"
              payload: { label: "2026-27", travel_budget_cents: 100000000 }
              as: TravelFinanceLead
              captures: { season_id: $.data.id }
            - call: "POST /travel/teams/${team_id}/trips"
              payload: { season_id: "${season_id}", destination_code: "TUL", game_tipoff_utc: "2027-04-12T00:00:00Z", return_arrival_utc: "2027-04-13T08:00:00Z" }
              as: TravelManager
              captures: { trip_id: $.data.id, trip_v0: $.data.version }
            - call: "POST /travel/teams/${team_id}/trips/${trip_id}/members"
