      - name: provisional_award_component_rounding
        claim_type: precision
        grounds:
          - calculations.provisional_award
          - entities.CostShareApplication.fields.provisional_award_cents
        distinguishing_aspect: |
          The pinned per-component rounding order rounds the city share half-up
          BEFORE summing: qty 10.01 sqft at share 70 (ARTERIAL + NONE) gives
          repair_estimate round_half_up(10.01*1200)=12012 and city share
          round_half_up(12012*70/100)=round_half_up(8408.4)=8408, not 8409 (no
          ceil) and not a sum-then-round value.
        test_recipe:
          setup:
            - "OPEN cycle; NONE owner; ARTERIAL parcel; segment; defect; notice issued"
          setup_api_calls:
            - { call: "POST /program-cycles", payload: { cycle_year: 2026, window_start_date: "2026-01-01", window_end_date: "2026-12-31", appropriation_cents: 10000000 }, as: ProgramCoordinator, captures: { cycle_id: "$.data.id" } }
