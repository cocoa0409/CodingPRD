# SCAFFOLD_DIFFICULTY_DESIGN.yaml - task_2550_pulmonary_function_lab_respiratory_diagnostics
# Section 1.8 of the scaffold-generator specification. Two instances per Difficulty Rule,
# each grounded in SCAFFOLD.yaml sections 1.1-1.7 and carrying an executable test recipe.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: bcs_comparator_absolute_baseline_vs_rolling_mean_divergence
        grounds:
          - calculations.biologic_control_deviation
          - entities.DeviceQualityEvent.fields.deviation_variant
          - entities.DeviceQualityEvent.fields.rolling_mean_fev1_l
          - entities.Staff.fields.baseline_established_on
          - endpoints[POST /pft-lab/devices/{device_id}/quality-events]
        distinguishing_aspect: |
          The identical measured_fev1_l of 3.850 on the identical device yields deviation_pct 3.75 with
          outcome PASS under ABSOLUTE_BASELINE and deviation_pct 6.35 with outcome WARN under
          ROLLING_MEAN, because the variant swaps the comparator from the subject's enrolment
          baseline_fev1_l (4.000) to the 3-point rolling mean of that subject's own recent measurements
          (3.620); variant selection is driven purely by whether baseline_established_on is more than
          BASELINE_VALIDITY_DAYS (180) old at the current logical clock.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "technologist T-001 is ON_DUTY and credentialed for SPIROMETRY"
            - "biologic-control subject T-090 has baseline_fev1_l 4.000 with baseline_established_on 2025-01-15, i.e. 565 days stale, so its variant is ROLLING_MEAN"
            - "biologic-control subject T-091 has the same baseline_fev1_l 4.000 with baseline_established_on 2026-05-01, i.e. 94 days old, so its variant is ABSOLUTE_BASELINE"
            - "device SPIRO-1 is AVAILABLE after a PASS volume calibration"
            - "device SPIRO-1 already carries exactly three prior BIOLOGIC_CONTROL events for subject T-090 with measured_fev1_l 3.600, 3.640 and 3.620, each of which fell back to ABSOLUTE_BASELINE because the window was not yet full, and each of which computed WARN so all three stay eligible for the window"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-001", full_name: "Tessa Ng", role_type: "TECHNOLOGIST", credential: "RPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY", "DLCO", "PLETHYSMOGRAPHY"] }
              as: LabManager
              captures: { tech1_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-090", full_name: "Cal Mensah", role_type: "TECHNOLOGIST", credential: "CPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"], is_biologic_control: true, baseline_fev1_l: 4.000, baseline_fvc_l: 5.200, baseline_established_on: "2025-01-15" }
              as: LabManager
              captures: { bcs_stale_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-091", full_name: "Nia Kaur", role_type: "TECHNOLOGIST", credential: "CPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"], is_biologic_control: true, baseline_fev1_l: 4.000, baseline_fvc_l: 5.200, baseline_established_on: "2026-05-01" }
              as: LabManager
              captures: { bcs_fresh_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-1", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev1_id: $.data.id }
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "VOLUME_CALIBRATION", measured_volume_l: 2.764, ambient_temp_c: 23, barometric_pressure_kpa: 101.30 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_stale_id}", measured_fev1_l: 3.600, measured_fvc_l: 4.900 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_stale_id}", measured_fev1_l: 3.640, measured_fvc_l: 4.910 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_stale_id}", measured_fev1_l: 3.620, measured_fvc_l: 4.920 }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { ev_p3_id: $.data.id }
          trigger:
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_stale_id}", measured_fev1_l: 3.850, measured_fvc_l: 5.100 }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { ev_roll_id: $.data.id }
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_fresh_id}", measured_fev1_l: 3.850, measured_fvc_l: 5.100 }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { ev_abs_id: $.data.id }
          assert:
            - "DeviceQualityEvent.${ev_p3_id}.deviation_variant == ABSOLUTE_BASELINE"
            - "DeviceQualityEvent.${ev_p3_id}.deviation_pct == 9.50"
            - "DeviceQualityEvent.${ev_p3_id}.rolling_mean_fev1_l == null"
            - "DeviceQualityEvent.${ev_roll_id}.deviation_variant == ROLLING_MEAN"
            - "DeviceQualityEvent.${ev_roll_id}.rolling_mean_fev1_l == 3.620"
            - "DeviceQualityEvent.${ev_roll_id}.deviation_pct == 6.35"
            - "DeviceQualityEvent.${ev_roll_id}.outcome == WARN"
            - "DeviceQualityEvent.${ev_roll_id}.failure_reason == null"
            - "DeviceQualityEvent.${ev_abs_id}.deviation_variant == ABSOLUTE_BASELINE"
            - "DeviceQualityEvent.${ev_abs_id}.rolling_mean_fev1_l == null"
            - "DeviceQualityEvent.${ev_abs_id}.deviation_pct == 3.75"
            - "DeviceQualityEvent.${ev_abs_id}.outcome == PASS"
            - "the two trigger events carry the identical measured_fev1_l 3.850, so DeviceQualityEvent.${ev_roll_id}.deviation_pct - DeviceQualityEvent.${ev_abs_id}.deviation_pct == 2.60 and the outcomes differ (WARN vs PASS)"
            - "Device.${dev1_id}.status == AVAILABLE"
            - "Device.${dev1_id}.consecutive_biologic_failures == 0"
            - "Device.${dev1_id}.last_biologic_control_date == 2026-08-03"
      - name: bronchodilator_criterion_2005_baseline_vs_2021_predicted_divergence
        grounds:
          - calculations.bronchodilator_response
          - calculations.reference_equation_selection_and_predicted_values
          - entities.ReferenceEquationSet.fields.bd_criterion
          - entities.TestSession.fields.bd_response_variant
          - endpoints[POST /pft-lab/test-sessions/{session_id}/finalize-quality]
        distinguishing_aspect: |
          Two sessions with byte-identical maneuver data (pre best_fev1_l 2.400, post best_fev1_post_l
          2.720, predicted_fev1_l 4.000) diverge because the pinned equation's bd_criterion swaps the
          denominator and the threshold set: PCT_BASELINE_2005 divides by the patient's own pre value
          and requires BOTH 12.0 percent and 200 mL, giving 13.3 percent and bd_response_positive true,
          while PCT_PREDICTED_2021 divides by predicted_fev1_l and consults only the 10.0 percent floor,
          giving 8.0 percent and bd_response_positive false; bd_response_ml is 320 in both.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "equation set GLI-M-2005 (ages 40-60, sex MALE, SPIROMETRY, bd_criterion PCT_BASELINE_2005) is the only ACTIVE set when session 1 is created, so session 1 pins it"
            - "equation set GLI-M-2021 is created afterwards with the same coefficients but a narrower age band 44-46 and bd_criterion PCT_PREDICTED_2021, so the selector's narrowest-band-first ranking pins it to session 2"
            - "patient MRN-7001 is a 45-year-old male, height 175.0 cm, so both sets predict fev1 4.000 L and fvc 4.800 L"
            - "devices SPIRO-1 and SPIRO-2 are both AVAILABLE with a same-day PASS calibration, a PASS biologic control, a fresh filter and a completed disinfection cycle"
            - "orders ORD-1 and ORD-2 are both DYSPNEA_EVALUATION / ROUTINE_CLINICAL with bronchodilator_requested true and no medication classes, so both submit straight to READY"
            - "each session receives the same three PRE_BD maneuvers (fev1 2.400 / 2.250 / 2.200) and the same single POST_BD maneuver (fev1 2.720)"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-001", full_name: "Tessa Ng", role_type: "TECHNOLOGIST", credential: "RPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY", "DLCO", "PLETHYSMOGRAPHY"] }
              as: LabManager
              captures: { tech1_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-090", full_name: "Cal Mensah", role_type: "TECHNOLOGIST", credential: "CPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"], is_biologic_control: true, baseline_fev1_l: 4.000, baseline_fvc_l: 5.200, baseline_established_on: "2026-05-01" }
              as: LabManager
              captures: { bcs_id: $.data.id }
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "D-001", full_name: "Dana Okafor", role_type: "ORDERING_PHYSICIAN", credential: "MD", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY"] }
              as: LabManager
              captures: { doc1_id: $.data.id }
            - call: "POST /pft-lab/reference-equations"
              payload: { equation_code: "GLI-M-2005", modality_scope: ["SPIROMETRY"], sex_scope: "MALE", applicable_age_min: 40, applicable_age_max: 60, lln_percentile: 5.0, ratio_lln: 0.700, a_fev1: 2.300, b_fev1: 0.020, c_fev1: 0.400, a_fvc: 1.350, b_fvc: 0.030, c_fvc: 0.400, rsd_frac: 0.130, bd_criterion: "PCT_BASELINE_2005" }
              as: LabManager
              captures: { eq2005_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-1", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev1_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-2", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev2_id: $.data.id }
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "VOLUME_CALIBRATION", measured_volume_l: 2.764, ambient_temp_c: 23, barometric_pressure_kpa: 101.30 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_id}", measured_fev1_l: 3.850, measured_fvc_l: 5.100 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "FILTER_REPLACEMENT", filter_serial: "F-1001" }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "HIGH_LEVEL_DISINFECT", dwell_minutes: 25 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev2_id}/quality-events"
              payload: { event_type: "VOLUME_CALIBRATION", measured_volume_l: 2.764, ambient_temp_c: 23, barometric_pressure_kpa: 101.30 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev2_id}/quality-events"
              payload: { event_type: "BIOLOGIC_CONTROL", subject_staff_id: "${bcs_id}", measured_fev1_l: 3.850, measured_fvc_l: 5.100 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev2_id}/quality-events"
              payload: { event_type: "FILTER_REPLACEMENT", filter_serial: "F-1002" }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/devices/${dev2_id}/quality-events"
              payload: { event_type: "HIGH_LEVEL_DISINFECT", dwell_minutes: 25 }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/patients"
              payload: { mrn: "MRN-7001", full_name: "Alan Ruiz", birth_date: "1981-03-15", sex: "MALE", height_cm: 175.0, weight_kg: 80.0, smoking_status: "FORMER" }
              as: LabManager
              captures: { pat1_id: $.data.id }
            - call: "POST /pft-lab/test-orders"
              payload: { patient_id: "${pat1_id}", indication_code: "DYSPNEA_EVALUATION", requested_modalities: ["SPIROMETRY"], test_context: "ROUTINE_CLINICAL", bronchodilator_requested: true, current_medication_classes: [] }
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
              captures: { ord1_id: $.data.id }
            - call: "POST /pft-lab/test-orders/${ord1_id}/submit"
              payload: {}
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
            - call: "POST /pft-lab/test-sessions"
              payload: { order_id: "${ord1_id}", device_id: "${dev1_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-03T09:30:00Z" }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { sess1_id: $.data.id }
            - call: "POST /pft-lab/test-sessions/${sess1_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.200, fev1_l: 2.400, pef_l_s: 6.00, back_extrapolated_volume_ml: 100, expiratory_time_s: 15.0, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/test-sessions/${sess1_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.150, fev1_l: 2.250, pef_l_s: 5.80, back_extrapolated_volume_ml: 120, expiratory_time_s: 16.0, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/test-sessions/${sess1_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.100, fev1_l: 2.200, pef_l_s: 5.60, back_extrapolated_volume_ml: 110, expiratory_time_s: 15.5, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/test-sessions/${sess1_id}/maneuvers"
              payload: { phase: "POST_BD", fvc_l: 3.300, fev1_l: 2.720, pef_l_s: 6.40, back_extrapolated_volume_ml: 120, expiratory_time_s: 16.0, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/reference-equations"
              payload: { equation_code: "GLI-M-2021", modality_scope: ["SPIROMETRY"], sex_scope: "MALE", applicable_age_min: 44, applicable_age_max: 46, lln_percentile: 5.0, ratio_lln: 0.700, a_fev1: 2.300, b_fev1: 0.020, c_fev1: 0.400, a_fvc: 1.350, b_fvc: 0.030, c_fvc: 0.400, rsd_frac: 0.130, bd_criterion: "PCT_PREDICTED_2021" }
              as: LabManager
              captures: { eq2021_id: $.data.id }
            - call: "POST /pft-lab/test-orders"
              payload: { patient_id: "${pat1_id}", indication_code: "DYSPNEA_EVALUATION", requested_modalities: ["SPIROMETRY"], test_context: "ROUTINE_CLINICAL", bronchodilator_requested: true, current_medication_classes: [] }
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
              captures: { ord2_id: $.data.id }
            - call: "POST /pft-lab/test-orders/${ord2_id}/submit"
              payload: {}
              as: OrderingPhysician
              as_user_id: "${doc1_id}"
            - call: "POST /pft-lab/test-sessions"
              payload: { order_id: "${ord2_id}", device_id: "${dev2_id}", scheduled_start_at: "2026-08-03T10:00:00Z", scheduled_end_at: "2026-08-03T10:30:00Z" }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { sess2_id: $.data.id }
            - call: "POST /pft-lab/test-sessions/${sess2_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.200, fev1_l: 2.400, pef_l_s: 6.00, back_extrapolated_volume_ml: 100, expiratory_time_s: 15.0, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/test-sessions/${sess2_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.150, fev1_l: 2.250, pef_l_s: 5.80, back_extrapolated_volume_ml: 120, expiratory_time_s: 16.0, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/test-sessions/${sess2_id}/maneuvers"
              payload: { phase: "PRE_BD", fvc_l: 3.100, fev1_l: 2.200, pef_l_s: 5.60, back_extrapolated_volume_ml: 110, expiratory_time_s: 15.5, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/test-sessions/${sess2_id}/maneuvers"
              payload: { phase: "POST_BD", fvc_l: 3.300, fev1_l: 2.720, pef_l_s: 6.40, back_extrapolated_volume_ml: 120, expiratory_time_s: 16.0, plateau_reached: false, cough_in_first_second: false, glottic_closure: false }
              as: Technologist
              as_user_id: "${tech1_id}"
          trigger:
            - call: "POST /pft-lab/test-sessions/${sess1_id}/finalize-quality"
              payload: { technologist_comment: "Three acceptable efforts, good coaching response." }
              as: Technologist
              as_user_id: "${tech1_id}"
            - call: "POST /pft-lab/test-sessions/${sess2_id}/finalize-quality"
              payload: { technologist_comment: "Three acceptable efforts, good coaching response." }
              as: Technologist
              as_user_id: "${tech1_id}"
          assert:
            - "TestSession.${sess1_id}.reference_equation_code == GLI-M-2005"
            - "TestSession.${sess2_id}.reference_equation_code == GLI-M-2021"
            - "TestSession.${sess1_id}.predicted_fev1_l == 4.000 and TestSession.${sess2_id}.predicted_fev1_l == 4.000"
            - "TestSession.${sess1_id}.best_fev1_l == 2.400 and TestSession.${sess1_id}.best_fev1_post_l == 2.720"
            - "TestSession.${sess2_id}.best_fev1_l == 2.400 and TestSession.${sess2_id}.best_fev1_post_l == 2.720"
            - "TestSession.${sess1_id}.bd_response_variant == PCT_BASELINE_2005"
            - "TestSession.${sess1_id}.bd_response_pct == 13.3"
            - "TestSession.${sess1_id}.bd_response_ml == 320"
            - "TestSession.${sess1_id}.bd_response_positive == true"
            - "TestSession.${sess2_id}.bd_response_variant == PCT_PREDICTED_2021"
            - "TestSession.${sess2_id}.bd_response_pct == 8.0"
            - "TestSession.${sess2_id}.bd_response_ml == 320"
            - "TestSession.${sess2_id}.bd_response_positive == false"
            - "both sessions reach session_status ACCEPTED with quality_grade A, so the divergence is attributable to bd_criterion alone"

  - rule_id: combinatorial_formula
    instances:
      - name: calibration_btps_three_stage_chained_rounding_order
        grounds:
          - calculations.calibration_btps_error
          - entities.DeviceQualityEvent.fields.btps_factor
          - entities.DeviceQualityEvent.fields.corrected_volume_l
          - entities.DeviceQualityEvent.fields.error_pct
          - state_machines.Device.AVAILABLE_to_QUARANTINED
        distinguishing_aspect: |
          error_pct is the fourth stage of a chain (water-vapour-pressure table lookup at
          ambient_temp_c 23 -> btps_factor rounded to 4 dp -> corrected_volume_l rounded to 3 dp ->
          error_pct rounded to 2 dp FROM the already-rounded volume), and measured_volume_l 2.848
          discriminates the order: the pinned chain yields corrected_volume_l 3.091 and error_pct 3.03
          (FAIL), while deriving error_pct from the unrounded product 3.0913... yields 3.04, so no single
          arithmetic shortcut reproduces all three events.
        test_recipe:
          setup:
            - "logical clock is 2026-08-03T08:00:00Z"
            - "technologist T-001 is credentialed for SPIROMETRY with competency_expires_on 2027-06-30"
            - "device SPIRO-1 has just been registered and is in status NEW"
            - "the first calibration (measured_volume_l 2.764) has already promoted it to AVAILABLE with error_pct 0.00"
          setup_api_calls:
            - call: "POST /pft-lab/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: LabManager
            - call: "POST /pft-lab/staff"
              payload: { employee_code: "T-001", full_name: "Tessa Ng", role_type: "TECHNOLOGIST", credential: "RPFT", competency_expires_on: "2027-06-30", credentialed_modalities: ["SPIROMETRY", "DLCO", "PLETHYSMOGRAPHY"] }
              as: LabManager
              captures: { tech1_id: $.data.id }
            - call: "POST /pft-lab/devices"
              payload: { device_code: "SPIRO-1", modality: "SPIROMETRY" }
              as: LabManager
              captures: { dev1_id: $.data.id }
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "VOLUME_CALIBRATION", measured_volume_l: 2.764, ambient_temp_c: 23, barometric_pressure_kpa: 101.30 }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { ev_zero_id: $.data.id }
          trigger:
            - call: "POST /pft-lab/devices/${dev1_id}/quality-events"
              payload: { event_type: "VOLUME_CALIBRATION", measured_volume_l: 2.847, ambient_temp_c: 23, barometric_pressure_kpa: 101.30 }
              as: Technologist
              as_user_id: "${tech1_id}"
              captures: { ev_edge_id: $.data.id }
