              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { enc5_id: $.data.id, enc5_charge_before: $.data.patient_charge_cents, enc5_basis_before: $.data.charge_basis }
            - call: "POST /encounters/${enc5_id}/bill"
              payload: { claim_reference: "CLM-6001" }
              as: BillingSpecialist
              as_user_id: "bs-1"
            - call: "POST /encounters/${enc5_id}/record-payment"
              payload: { mco_paid_cents: 14000 }
              as: BillingSpecialist
              as_user_id: "bs-1"
              captures: { enc5_wrap_before: $.data.wraparound_due_cents }
            - call: "GET /patients/${p5_id}"
