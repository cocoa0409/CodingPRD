              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Senior Debt Fund", notice_email: "servicing@keystone.example", original_principal_cents: 3000000, priority_rank: 1, cure_extension_days: 30 }
              as: LessorAdmin
              captures: { m1_id: $.data.id }
            - call: "GET /portfolio/leases/${lease_id}"
              payload: {}
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
              captures: { v1: $.data.version }
          trigger:
            - call: "POST /portfolio/estoppel-certificates"
              payload: { lease_id: "${lease_id}", requested_by_mortgage_id: "${m1_id}", expected_lease_version: "${v1}" }
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
              captures: { cert1: $.data.id }
            - call: "GET /portfolio/leases/${lease_id}"
              payload: {}
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
              captures: { v2: $.data.version }
            - call: "POST /portfolio/estoppel-certificates"
              payload: { lease_id: "${lease_id}", requested_by_mortgage_id: "${m1_id}", expected_lease_version: "${v2}" }
              as: LessorAdmin
              captures: { cert2: $.data.id }
          assert:
            - "trigger[0] returns 201 with status ISSUED, issued_at 2026-08-01T00:00:00Z, issued_by_user_id agent-keystone-1, certified_annual_base_rent_cents 10000000, certified_arrears_cents 0, certified_rent_status BASE_ONLY and certified_lease_version == ${v1}"
            - "trigger[1] shows the lease version is now ${v1} + 1 - issuance itself is a write"
            - "trigger[2] returns 201 with status ISSUED and certified_lease_version == ${v2}"
            - "EstoppelCertificate.${cert1}.status == SUPERSEDED while ${cert2}.status == ISSUED"
            - "GET /portfolio/estoppel-certificates?lease_id=${lease_id}&requested_by_mortgage_id=${m1_id} returns total_count 2 - supersession retires the row rather than deleting it"

      - name: rent_summary_computed_read_matches_every_underlying_row
        claim_type: computed_read
        grounds:
          - endpoints.GET_/portfolio/leases/{id}/rent-summary
          - calculations.sublease_inclusion_base
        distinguishing_aspect: |
          The lender-facing read has to agree with five different sources at once - the live base rent,
          the ACTIVE-sublease inclusion base, the arrears ledger, the two halves of the GFA envelope and
          the three deposit buckets - plus the open mortgage principal. Any single field derived from a
          stale copy rather than recomputed shows up here.
        test_recipe:
          setup:
            - "One lease with an approved 40000 sqft alteration, an ACTIVE 50000 sqft sublease at 12000000, a 3000000 mortgage and 1000000 of arrears."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-119", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Senior Debt Fund", notice_email: "servicing@keystone.example", original_principal_cents: 3000000, priority_rank: 1, cure_extension_days: 30 }
              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
              payload: { amount_cents: 1000000, memo: "Q3 base rent" }
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /portfolio/leases/${lease_id}/alteration-requests"
              payload: { scope_code: "COSMETIC", proposed_use_code: "RETAIL_MIXED", requested_gfa_sqft: 40000, construction_window_start: "2027-01-01T00:00:00Z", construction_window_end: "2027-03-01T00:00:00Z", estimated_cost_cents: 100000 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { alt_id: $.data.id }
            - call: "POST /portfolio/alteration-requests/${alt_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "SUBLEASE", term_start: "2027-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", transferee_legal_name: "Pier Market Grocers LLC", premises_unit_code: "UNIT-A", annual_sublease_rent_cents: 12000000, sublet_area_sqft: 50000, consent_deposit_cents: 0 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /portfolio/transfer-requests/${sub_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
              as_user_id: "am-1"
            - call: "POST /portfolio/transfer-requests/${sub_id}/fee-payments"
              payload: { amount_cents: 4868750 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
          trigger:
            - call: "GET /portfolio/leases/${lease_id}/rent-summary"
              payload: {}
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
          assert:
            - "returns 200 with current_annual_base_rent_cents 10000000, percentage_rent_sublease_base_cents 6000000 and arrears_balance_cents 1000000"
            - "gfa_allocated_sqft 40000 and gfa_unallocated_sqft 160000, summing to total_permitted_gfa_sqft 200000"
            - "deposit_held_cents 5000000, deposit_applied_cents 0 and deposit_refunded_cents 0, summing to security_deposit_cents 5000000"
            - "active_sublease_count 1 and open_mortgage_principal_cents 3000000"
            - "the same figures are readable field-by-field on GET /portfolio/leases/${lease_id} - the computed read introduces no divergence"

      - name: new_lease_election_is_available_only_up_to_its_deadline
        claim_type: conditional_action
        grounds:
          - state_machines.LeaseholdMortgage.NEW_LEASE_ELIGIBLE_to_NEW_LEASE_ELECTED
          - endpoints.POST_/portfolio/leasehold-mortgages/{id}/new-lease-election
        distinguishing_aspect: |
          The mortgagee's ultimate protection is a conditional action with three preconditions, and the
          deadline is inclusive: electing at exactly termination + 30 days must succeed and mint a
          replacement lease that copies the terms but resets the ledger (arrears 0, deposits 0, envelope
          0, insurance LAPSED, commencement = now). The replacement also re-uses the terminated lease's
          premises_code, which is only legal because the predecessor is TERMINATED.
        test_recipe:
          setup:
            - "An unpermitted-use default on a mortgaged lease, run out through both cure windows and terminated by a second user, leaving the mortgage NEW_LEASE_ELIGIBLE to 2026-10-31."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Keystone Successor Tenant LLC", notice_email: "reo@keystone.example", credit_rating_code: "BBB" }
              as: LessorAdmin
              captures: { successor_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-120", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 20, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Senior Debt Fund", notice_email: "servicing@keystone.example", original_principal_cents: 3000000, priority_rank: 1, cure_extension_days: 30 }
              as: LessorAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_id}/default-notices"
              payload: { default_type: "UNPERMITTED_USE" }
              as: AssetManager
              as_user_id: "am-1"
              captures: { notice_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: LessorAdmin
            - call: "POST /portfolio/administration-runs"
              payload: {}
              as: LessorAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: LessorAdmin
            - call: "POST /portfolio/administration-runs"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/default-notices/${notice_id}/terminate"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-31T00:00:00Z" }
              as: LessorAdmin
          trigger:
            - call: "POST /portfolio/leasehold-mortgages/${m1_id}/new-lease-election"
              payload: { new_lessee_id: "${successor_id}" }
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
              captures: { new_lease_id: $.data.id }
          assert:
            - "after setup: DefaultNotice.${notice_id}.status == TERMINATION_EFFECTED (lessee window closed 2026-08-31, mortgagee window 2026-09-30) and LeaseholdMortgage.${m1_id}.status == NEW_LEASE_ELIGIBLE with new_lease_election_deadline 2026-10-31T00:00:00Z"
            - "trigger returns 201 at exactly the deadline instant - the comparison is inclusive"
            - "LeaseholdMortgage.${m1_id}.status == NEW_LEASE_ELECTED"
            - "Lease.${new_lease_id}: predecessor_lease_id ${lease_id}, origin_mortgage_id ${m1_id}, lessee_id ${successor_id}, premises_code PIER-120, current_annual_base_rent_cents 10000000, expiration_date 2070-01-01T00:00:00Z, commencement_date 2026-10-31T00:00:00Z"
            - "Lease.${new_lease_id}: lease_status ACTIVE, rent_status BASE_ONLY, insurance_status LAPSED, arrears_balance_cents 0, deposit_held_cents 0, gfa_allocated_sqft 0"
            - "Lease.${lease_id}.lease_status is still TERMINATED with rent_status FROZEN"

      - name: default_notice_action_endpoint_preconditions_corner
        claim_type: action_endpoint
        excluded_because:
          difficulty_instance: default_notice_forks_into_mortgagee_branch_after_lessee_window_lapses
          rationale: |
            The action-endpoint claims for the default-notice family - each transition triggering
            correctly and each precondition enforced across the lessee-cure, mortgagee-cure and terminate
            endpoints - are the named §1.8 non_linear_state_machine instance, which walks the whole fork
            including the segregation-of-duties bar on termination.

  - section: errors
    instances:
      - name: unknown_ids_return_the_parent_specific_not_found_code
        claim_type: triggerability
        grounds:
          - errors.ERR_MORTGAGE_NOT_FOUND
          - errors.ERR_REVALUATION_NOT_FOUND
          - errors.ERR_APPRAISAL_NOT_FOUND
          - errors.ERR_ARBITRATION_NOT_FOUND
          - errors.ERR_STATEMENT_NOT_FOUND
          - errors.ERR_ALTERATION_NOT_FOUND
          - errors.ERR_TRANSFER_NOT_FOUND
          - errors.ERR_NOTICE_NOT_FOUND
          - errors.ERR_LOSS_EVENT_NOT_FOUND
          - errors.ERR_ASSESSMENT_NOT_FOUND
          - errors.ERR_CERTIFICATE_NOT_FOUND
          - validations.priority_1_referential
        distinguishing_aspect: |
          Eleven parents, eleven distinct 404 codes: the catalog does not have a single generic
          NOT_FOUND, so each read path must name the entity it failed to find. The write paths are
          included too, because a foreign key that misses (a statement quoting an unknown lease, a
          sublease quoting an unknown parent_transfer_id, an election on an unknown mortgage) must report
          the missing PARENT's code at priority 1 - before any role, shape or state check runs.
        test_recipe:
          setup:
            - "One lessee and one lease whose version is then deliberately bumped, so that every id below genuinely names nothing while the OCC guard the last calls carry is genuinely stale."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-131", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 20, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id, stale_version: $.data.version }
            - call: "POST /portfolio/leases/${lease_id}/rent-charges"
              payload: { amount_cents: 3000000, memo: "Q3 2026 base rent" }
              as: LeaseAccountant
              as_user_id: "acct-1"
          trigger:
            - call: "GET /portfolio/leasehold-mortgages/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LessorAdmin
            - call: "GET /portfolio/rent-revaluations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LessorAdmin
            - call: "GET /portfolio/appraisal-submissions/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LessorAdmin
            - call: "GET /portfolio/arbitrations/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LessorAdmin
            - call: "GET /portfolio/percentage-rent-statements/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "GET /portfolio/alteration-requests/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AssetManager
              as_user_id: "am-1"
            - call: "GET /portfolio/transfer-requests/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AssetManager
              as_user_id: "am-1"
            - call: "GET /portfolio/default-notices/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AssetManager
              as_user_id: "am-1"
            - call: "GET /portfolio/loss-events/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LeaseAccountant
              as_user_id: "acct-1"
            - call: "GET /portfolio/reversion-assessments/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: AssetManager
              as_user_id: "am-1"
            - call: "GET /portfolio/estoppel-certificates/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "00000000-0000-0000-0000-0000000000ff", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", reported_gross_sales_cents: 120000000, expected_lease_version: "${stale_version}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/leasehold-mortgages/00000000-0000-0000-0000-0000000000ff/new-lease-election"
              payload: { new_lessee_id: "${lessee_id}" }
              as: MortgageeAgent
              as_user_id: "agent-keystone-1"
          assert:
            - "trigger[0] returns ERR_MORTGAGE_NOT_FOUND (404), trigger[1] ERR_REVALUATION_NOT_FOUND, trigger[2] ERR_APPRAISAL_NOT_FOUND, trigger[3] ERR_ARBITRATION_NOT_FOUND"
            - "trigger[4] returns ERR_STATEMENT_NOT_FOUND, trigger[5] ERR_ALTERATION_NOT_FOUND, trigger[6] ERR_TRANSFER_NOT_FOUND, trigger[7] ERR_NOTICE_NOT_FOUND"
            - "trigger[8] returns ERR_LOSS_EVENT_NOT_FOUND, trigger[9] ERR_ASSESSMENT_NOT_FOUND, trigger[10] ERR_CERTIFICATE_NOT_FOUND - all 404"
            - "trigger[11] returns ERR_LEASE_NOT_FOUND (404), not ERR_STALE_LEASE_VERSION (412): the referential check at priority 1 runs before the concurrency check at priority 4 even though ${stale_version} went stale when the rent charge was posted"
            - "trigger[12] returns ERR_MORTGAGE_NOT_FOUND (404) rather than an invalid-state error"

      - name: stale_lease_version_code_corner
        claim_type: triggerability
        excluded_because:
          difficulty_instance: statement_stale_version_beats_chronology_then_chronology_surfaces
          rationale: |
            ERR_STALE_LEASE_VERSION (412) is triggered by the named §1.8 instance on the statement write,
            and again on the estoppel write inside
            estoppel_certificate_blocked_while_a_revaluation_is_in_arbitration, which quotes a fresh
            version precisely so the 409 cannot be mistaken for the 412.

      - name: max_rounds_reached_code_corner
        claim_type: triggerability
        excluded_because:
          difficulty_instance: revaluation_round_cycle_reopens_then_refuses_a_third_round
          rationale: |
            ERR_MAX_ROUNDS_REACHED (409) has exactly one reachable trigger - a third negotiation round -
            and the named §1.8 instance drives the revaluation to round 2 and asserts the refusal.

      - name: cure_window_closed_code_corner
        claim_type: triggerability
        excluded_because:
          difficulty_instance: lessee_cure_succeeds_at_the_deadline_instant_and_fails_one_second_later
          rationale: |
            ERR_CURE_WINDOW_CLOSED (409) is triggered by the named §1.8 boundary_precision_check instance
            on the lessee-cure path, one second past the deadline, together with the inclusive success at
            the deadline instant.

      - name: lease_not_operative_code_corner
        claim_type: triggerability
        excluded_because:
          difficulty_instance: terminated_lease_statement_rejected_by_priority_7_not_priority_11
          rationale: |
            ERR_LEASE_NOT_OPERATIVE (409) is triggered by the named §1.8 instance, which files a statement
            against a terminated lease and shows the operability code beating the chronology one.

      - name: interval_overlap_code_corner
        claim_type: triggerability
        excluded_because:
          difficulty_instance: construction_windows_touch_is_allowed_overlap_by_one_second_is_not_and_the_recheck_bites_at_decision
          rationale: |
            ERR_INTERVAL_OVERLAP (409) is triggered by the named §1.8 instance on both the alteration
            window path and (via sublease_overlap_is_keyed_by_unit_while_the_area_cap_is_keyed_by_lease)
            the per-unit sublease term path.

      - name: sublet_area_exceeded_code_corner
        claim_type: triggerability
        excluded_because:
          difficulty_instance: sublease_overlap_is_keyed_by_unit_while_the_area_cap_is_keyed_by_lease
          rationale: |
            ERR_SUBLET_AREA_EXCEEDED (409) is triggered by the named §1.8 instance, which pushes the
            lease's consented plus active sublet area one square foot past total_permitted_gfa_sqft.

      - name: segregation_of_duties_code_corner
        claim_type: triggerability
        excluded_because:
          difficulty_instance: reversion_holdback_then_close_conserves_the_security_deposit_across_three_buckets
          rationale: |
            ERR_SEGREGATION_OF_DUTIES (403) is triggered on the holdback path by the named §1.8 instance
            (the inspector trying to apply his own holdback) and on the termination path by
            default_notice_forks_into_mortgagee_branch_after_lessee_window_lapses.

      - name: cross_entity_blocked_code_corner
        claim_type: triggerability
        excluded_because:
          difficulty_instance: arbitration_referral_blocked_while_the_lease_sits_in_default
          rationale: |
            ERR_CROSS_ENTITY_BLOCKED (409) has four clauses and three of them are triggered by the named
            §1.8 cross_entity_state_dependency instances; the fourth (a transfer consent while rent_status
            is IN_ARBITRATION) is asserted inside
            estoppel_certificate_blocked_while_a_revaluation_is_in_arbitration.

  - section: rbac
    instances:
      - name: every_role_cannot_perform_another_roles_exclusive_operation
        claim_type: unauthorized_operations
        grounds:
          - roles.LessorAdmin.exclusive_operations
          - roles.AssetManager.exclusive_operations
          - roles.LeaseAccountant.exclusive_operations
          - roles.GroundTenant.exclusive_operations
          - roles.MortgageeAgent.exclusive_operations
          - roles.Arbitrator.shared_operations
          - errors.ERR_UNAUTHORIZED
          - validations.priority_2_authorization
        distinguishing_aspect: |
          Six roles, six exclusive fences, and the read scopes are narrower than the write scopes: the
          Arbitrator may read the lease, the revaluation, the appraisals and the proceeding but NOT the
          percentage-rent statements, and the MortgageeAgent may read mortgages and notices but not the
          lessee register. The last call is the ordering probe - a wrong-role request whose body is also
          malformed must still answer 403, because authorization sits at priority 2 and shape validation
          at priority 3.
