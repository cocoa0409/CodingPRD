# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1593 Air Cargo Handling & ULD Management
# 9 Difficulty Rules x 2 instances each. All chains replay against SCAFFOLD.yaml §1.5.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: ULDCharge vs Claim)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: demurrage_provisional_vs_final_diverge
        grounds:
          - calculations.demurrage_calculation
          - entities.ULDCharge.fields.amount
          - state_machines.ULD.ASSIGNED_to_DISPATCHED
          - state_machines.ULD.DISPATCHED_to_RETURNED
        distinguishing_aspect: |
          Entity domain = ULDCharge (asset demurrage). Same dispatch data, two valid
          variants: provisional (end = flight.scheduled_arrival, 4 days -> 1 chargeable
          day -> 50.00) vs final (end = actual returned_at, 10 days -> 7 chargeable
          days -> 560.00). The pinned literals differ (50.00 vs 560.00) for one ULD.
        test_recipe:
          setup:
            - "Flight CA201 OPEN_FOR_BOOKING, dep 2026-08-10T08:00:00Z arr 2026-08-14T08:00:00Z, cap 1000kg/10m3, 2 positions, dg_certified"
            - "ULDType AKE tare 100 max 500; ULD AKE00001CA SERVICEABLE"
            - "Booking 200kg/2m3 ACCEPTED, then BUILT_UP on a DRAFT plan using AKE00001CA; plan SEALED"
            - "Clock at 2026-08-10T08:00:00Z; flight CLOSED then DEPARTED -> PROVISIONAL demurrage charge = 50.00"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA201", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-14T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00001CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-D1", commodity_code: "GEN", pieces: 4, gross_weight_kg: 200, volume_m3: 2 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "GET /cargo/ulds/${u_id}/charges"
              as: RampOperator
              captures: { ch_id: "$.data[0].id" }
            - call: "GET /cargo/uld-charges/${ch_id}"
              as: RampOperator
              captures: { prov_amount: $.data.amount, prov_status: $.data.status, prov_t1: $.data.tier1_days, prov_t2: $.data.tier2_days }
          trigger:
            - call: "POST /cargo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T08:00:00Z" }
              as: CapacityController
            - call: "POST /cargo/ulds/${u_id}/return"
              as: RampOperator
            - call: "GET /cargo/uld-charges/${ch_id}"
              as: RampOperator
              captures: { fin_amount: $.data.amount, fin_status: $.data.status, fin_t1: $.data.tier1_days, fin_t2: $.data.tier2_days }
          assert:
            - "Provisional variant: ${prov_status} == PROVISIONAL and ${prov_amount} == 50.00 and ${prov_t1} == 1 and ${prov_t2} == 0"
            - "Final variant on the SAME charge row: ${fin_status} == FINALIZED and ${fin_amount} == 560.00 and ${fin_t1} == 4 and ${fin_t2} == 3"
            - "${fin_amount} != ${prov_amount} (560.00 vs 50.00) — identical dispatch data, divergent variants"

      - name: claim_liability_vs_declared_value_basis
        grounds:
          - calculations.claim_settlement_calculation
          - entities.Claim.fields.approved_amount
          - entities.Booking.fields.declared_value
          - state_machines.Claim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Entity domain = Claim (financial liability) — distinct from ULDCharge above.
          Two LOADED bookings with identical gross weight (100kg), identical claim items
          (one 600kg item) and identical claimed_amount (10000): the booking without
          declared_value settles on LIABILITY basis (cap 100*19 = 1900.00), the one with
          declared_value 8000 settles on DECLARED_VALUE basis (cap 8000.00).
        test_recipe:
          setup:
            - "Flight OPEN_FOR_BOOKING cap 1000/10, 2 positions, dg_certified; ULDType AKE tare 100 max 500; ULD AKE00002CA"
            - "Booking A 100kg/0.1m3 (no declared_value) ACCEPTED; Booking B 100kg/0.1m3 declared_value 8000 ACCEPTED"
            - "Both BUILT_UP on one plan (tare 100 + 200 = 300 <= 500), plan SEALED, flight CLOSED, DEPARTED -> both LOADED"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA202", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00002CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-CA", commodity_code: "GEN", pieces: 2, gross_weight_kg: 100, volume_m3: 0.1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_a: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-CB", commodity_code: "GEN", pieces: 2, gross_weight_kg: 100, volume_m3: 0.1, declared_value: 8000 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_b: $.data.id }
            - call: "POST /cargo/bookings/${b_a}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings/${b_b}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_a}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
              captures: { p_v2: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_b}", expected_build_up_plan_version: "${p_v2}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "POST /cargo/claims"
              payload: { booking_id: "${b_a}", claim_type: "DAMAGE", claimed_amount: 10000, items: [{ weight_kg: 600 }] }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { c_a: $.data.id }
            - call: "POST /cargo/claims"
              payload: { booking_id: "${b_b}", claim_type: "DAMAGE", claimed_amount: 10000, items: [{ weight_kg: 600 }] }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { c_b: $.data.id }
          trigger:
            - call: "POST /cargo/claims/${c_a}/approve"
              as: ClaimsAdjuster
              captures: { a_amt: $.data.approved_amount, a_basis: $.data.basis }
            - call: "POST /cargo/claims/${c_b}/approve"
              as: ClaimsAdjuster
              captures: { b_amt: $.data.approved_amount, b_basis: $.data.basis }
          assert:
            - "Claim A: ${a_basis} == LIABILITY and ${a_amt} == 1900.00 (min(10000, 11400.00, 100*19.00))"
            - "Claim B: ${b_basis} == DECLARED_VALUE and ${b_amt} == 8000.00 (min(10000, 11400.00, 8000))"
            - "${a_amt} != ${b_amt} (1900.00 vs 8000.00) — identical weights/items/claimed_amount, variant flips on declared_value"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) tiered min/max vs mode (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: demurrage_tier_straddling_formula
        grounds:
          - calculations.demurrage_calculation
          - entities.ULDCharge.fields.tier1_days
          - entities.ULDCharge.fields.tier2_days
        distinguishing_aspect: |
          Mode (a): formula with >= 3 inputs and non-linear interaction — nested
          max(0, days_in_use - FREE_DAYS), min(chargeable, TIER1_DAYS) and the tier-2
          remainder. At 12 days in use: chargeable 9 splits 4 @ 50.00 + 5 @ 120.00
          = 800.00; both tier fields are observably non-zero.
        test_recipe:
          setup:
            - "Flight OPEN_FOR_BOOKING dep 2026-08-10T08:00:00Z arr 2026-08-14T08:00:00Z; ULD built with one 200kg booking, SEALED"
            - "Clock at departure instant; flight CLOSED then DEPARTED"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA203", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-14T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00003CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-D2", commodity_code: "GEN", pieces: 4, gross_weight_kg: 200, volume_m3: 2 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "GET /cargo/ulds/${u_id}/charges"
              as: RampOperator
              captures: { ch_id: "$.data[0].id" }
          trigger:
            - call: "POST /cargo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-22T08:00:00Z" }
              as: CapacityController
            - call: "POST /cargo/ulds/${u_id}/return"
              as: RampOperator
            - call: "GET /cargo/uld-charges/${ch_id}"
              as: RampOperator
              captures: { fin_amount: $.data.amount, fin_status: $.data.status, fin_t1: $.data.tier1_days, fin_t2: $.data.tier2_days }
          assert:
            - "${fin_status} == FINALIZED"
            - "${fin_t1} == 4 and ${fin_t2} == 5 (chargeable 9 = min(9,4) tier-1 days + remainder 5 tier-2 days)"
            - "${fin_amount} == 800.00 (4*50.00 + 5*120.00)"

      - name: claim_per_item_rounding_order
        grounds:
          - calculations.claim_settlement_calculation
          - entities.Claim.fields.item_total
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-item-THEN-sum. Three 0.335kg items at 19.00/kg: per-item
          round_half_up(6.365) = 6.37, sum = 19.11. The alternative order
          (sum 19.095 then round) yields 19.10; the test pins 19.11.
        test_recipe:
          setup:
            - "Flight OPEN_FOR_BOOKING; booking 100kg/0.1m3 (chargeable 100.00) ACCEPTED then LOADED via plan/seal/close/depart"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA204", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00004CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-R1", commodity_code: "GEN", pieces: 3, gross_weight_kg: 100, volume_m3: 0.1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "POST /cargo/claims"
              payload: { booking_id: "${b_id}", claim_type: "DAMAGE", claimed_amount: 1000, items: [{ weight_kg: 0.335 }, { weight_kg: 0.335 }, { weight_kg: 0.335 }] }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /cargo/claims/${c_id}/approve"
              as: ClaimsAdjuster
              captures: { it: $.data.item_total, ap: $.data.approved_amount, bs: $.data.basis }
          assert:
            - "${bs} == LIABILITY"
            - "${it} == 19.11 (3 x round_half_up(0.335*19.00, 2) = 3 x 6.37 — per-item rounding before summation)"
            - "${ap} == 19.11 (min(1000, 19.11, 1900.00)); a sum-then-round implementation would produce 19.10 and fail"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (cyclic Booking vs cyclic ULD)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: booking_offload_rebook_cycle
        grounds:
          - state_machines.Booking.ACCEPTED_to_OFFLOADED
          - state_machines.Booking.OFFLOADED_to_ACCEPTED
          - calculations.offload_selection
        distinguishing_aspect: |
          Booking machine is cyclic: REQUESTED -> ACCEPTED -> OFFLOADED -> ACCEPTED
          (rebook). The loop edge OFFLOADED -> ACCEPTED lands on a DIFFERENT flight
          and debits that flight's allocation, proving the cycle is a real
          re-entry, not a no-op.
        test_recipe:
          setup:
            - "Flight F1 cap 1200/100 OPEN_FOR_BOOKING with bookings B1 300kg, B2 400kg, B3 500kg all ACCEPTED (allocated 1200)"
            - "Weight restriction 900 offloads B3 (newest first): allocated 700, B3 OFFLOADED"
            - "Flight F2 cap 1000 OPEN_FOR_BOOKING"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA205", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1200, max_volume_m3: 100, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f1: $.data.id }
            - call: "POST /cargo/flights/${f1}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f1}", shipper_ref: "SHP-O1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 300, volume_m3: 3 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f1}", shipper_ref: "SHP-O2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 400, volume_m3: 4 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f1}", shipper_ref: "SHP-O3", commodity_code: "GEN", pieces: 1, gross_weight_kg: 500, volume_m3: 5 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b3: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings/${b2}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings/${b3}/accept"
              as: CapacityController
            - call: "POST /cargo/flights/${f1}/weight-restriction"
              payload: { restricted_payload_kg: 900 }
              as: CapacityController
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA206", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-11T08:00:00Z", scheduled_arrival: "2026-08-13T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 100, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f2: $.data.id }
            - call: "POST /cargo/flights/${f2}/open"
              as: CapacityController
          trigger:
            - call: "POST /cargo/bookings/${b3}/rebook"
              payload: { flight_id: "${f2}" }
              as: CapacityController
              captures: { b3_st: $.data.status, b3_fl: $.data.flight_id }
            - call: "GET /cargo/flights/${f2}"
              as: CapacityController
              captures: { f2_aw: $.data.allocated_weight_kg }
            - call: "GET /cargo/flights/${f1}"
              as: CapacityController
              captures: { f1_aw: $.data.allocated_weight_kg }
          assert:
            - "${b3_st} == ACCEPTED (cycle REQUESTED -> ACCEPTED -> OFFLOADED -> ACCEPTED completed)"
            - "${b3_fl} == ${f2} (rebook retargets the flight)"
            - "${f2_aw} == 500 and ${f1_aw} == 700"

      - name: uld_damage_repair_cycle
        grounds:
          - state_machines.ULD.RETURNED_to_DAMAGE_REPORTED
          - state_machines.ULD.DAMAGE_REPORTED_to_SERVICEABLE
          - state_machines.ULD.SERVICEABLE_to_ASSIGNED
          - calculations.repair_charge_calculation
        distinguishing_aspect: |
          ULD machine is cyclic with a damage loop: SERVICEABLE -> ASSIGNED ->
          DISPATCHED -> RETURNED -> DAMAGE_REPORTED -> SERVICEABLE, and the unit
          then re-enters SERVICEABLE -> ASSIGNED on a new flight — the repair loop
          returns the asset to full usability, and the REPAIR charge flips
          PROVISIONAL(300.00 estimate) -> FINALIZED(275.50 actual).
        test_recipe:
          setup:
            - "Flight F1 OPEN_FOR_BOOKING; ULD built with one 100kg booking, SEALED; clock 2026-08-10T08:00:00Z; CLOSED, DEPARTED"
            - "Clock 2026-08-12T08:00:00Z; ULD RETURNED; damage reported (estimate 300.00) -> DAMAGE_REPORTED; repair completed (final 275.50) -> SERVICEABLE"
            - "Flight F2 OPEN_FOR_BOOKING ready for a new plan"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA207", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-14T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f1: $.data.id }
            - call: "POST /cargo/flights/${f1}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "PMC", tare_weight_kg: 120, max_gross_weight_kg: 2000, internal_volume_m3: 10 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "PMC00005CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f1}", shipper_ref: "SHP-U1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f1}"
              as: CapacityController
              captures: { f1_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f1}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f1_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: CapacityController
            - call: "POST /cargo/flights/${f1}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f1}/depart"
              as: CapacityController
            - call: "POST /cargo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T08:00:00Z" }
              as: CapacityController
            - call: "POST /cargo/ulds/${u_id}/return"
              as: RampOperator
            - call: "POST /cargo/ulds/${u_id}/report-damage"
              payload: { damage_description: "torn net and dented base", repair_cost_estimate: 300 }
              as: RampOperator
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA208", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-20T08:00:00Z", scheduled_arrival: "2026-08-22T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f2: $.data.id }
            - call: "POST /cargo/flights/${f2}/open"
              as: CapacityController
          trigger:
            - call: "POST /cargo/ulds/${u_id}/complete-repair"
              payload: { final_repair_cost: 275.5 }
              as: RampOperator
              captures: { u_st: $.data.status }
            - call: "GET /cargo/ulds/${u_id}/charges"
              payload: { charge_type: "REPAIR" }
              as: RampOperator
              captures: { rep_ch: "$.data[0].id" }
            - call: "GET /cargo/uld-charges/${rep_ch}"
              as: RampOperator
              captures: { rep_amt: $.data.amount, rep_st: $.data.status }
            - call: "GET /cargo/flights/${f2}"
              as: CapacityController
              captures: { f2_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f2}", uld_id: "${u_id}", build_start: "2026-08-19T10:00:00Z", build_end: "2026-08-19T12:00:00Z", expected_flight_version: "${f2_v}" }
              as: RampOperator
              captures: { p2_st: $.data.status }
            - call: "GET /cargo/ulds/${u_id}"
              as: RampOperator
              captures: { u_st2: $.data.status }
          assert:
            - "${u_st} == SERVICEABLE (damage loop DAMAGE_REPORTED -> SERVICEABLE closes the cycle)"
            - "${rep_st} == FINALIZED and ${rep_amt} == 275.50 (final repair cost replaces the 300.00 estimate)"
            - "${p2_st} == DRAFT and ${u_st2} == ASSIGNED (unit re-enters SERVICEABLE -> ASSIGNED on a new flight)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (weight-restriction depth 3 vs departure depth 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: weight_restriction_offload_cascade
        grounds:
          - state_machines.Booking.BUILT_UP_to_OFFLOADED
          - state_machines.BuildUpPlan.DRAFT_to_CANCELLED
          - state_machines.ULD.ASSIGNED_to_SERVICEABLE
          - calculations.offload_selection
        distinguishing_aspect: |
          Depth-3 chain from POST weight-restriction: restriction offloads the
          BUILT_UP booking (link 1) -> removal from its plan recomputes
          total_weight_kg and, at zero bookings, auto-cancels the plan (link 2)
          -> the auto-cancel releases the ULD ASSIGNED -> SERVICEABLE (link 3).
          Each link is caused by the previous one, not by the endpoint directly.
        test_recipe:
          setup:
            - "Flight cap 1200 OPEN_FOR_BOOKING; B1 300kg, B2 400kg, B3 500kg all ACCEPTED (allocated 1200 == cap)"
            - "B3 additionally BUILT_UP as the only booking on a DRAFT plan (ULD AKE00006CA, type tare 100 max 5000)"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA209", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1200, max_volume_m3: 100, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-W1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 300, volume_m3: 3 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-W2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 400, volume_m3: 4 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-W3", commodity_code: "GEN", pieces: 1, gross_weight_kg: 500, volume_m3: 5 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b3: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings/${b2}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings/${b3}/accept"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 5000, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00006CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b3}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
          trigger:
            - call: "POST /cargo/flights/${f_id}/weight-restriction"
              payload: { restricted_payload_kg: 900 }
              as: CapacityController
            - call: "GET /cargo/bookings/${b3}"
              as: CapacityController
              captures: { b3_st: $.data.status, b3_plan: $.data.build_up_plan_id }
            - call: "GET /cargo/bookings/${b1}"
              as: CapacityController
              captures: { b1_st: $.data.status }
            - call: "GET /cargo/bookings/${b2}"
              as: CapacityController
              captures: { b2_st: $.data.status }
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { f_aw: $.data.allocated_weight_kg }
            - call: "GET /cargo/build-up-plans/${p_id}"
              as: CapacityController
              captures: { p_st: $.data.status, p_tw: $.data.total_weight_kg }
            - call: "GET /cargo/ulds/${u_id}"
              as: CapacityController
              captures: { u_st: $.data.status }
          assert:
            - "Link 1: ${b3_st} == OFFLOADED and ${b3_plan} == null; ${b1_st} == ACCEPTED and ${b2_st} == ACCEPTED (only the newest candidate offloaded)"
            - "Link 2: ${p_st} == CANCELLED and ${p_tw} == 0 (empty plan auto-cancelled)"
            - "Link 3: ${u_st} == SERVICEABLE (auto-cancel released the ULD)"
            - "${f_aw} == 700 (1200 - 500)"

      - name: departure_dispatch_cascade
        grounds:
          - state_machines.Flight.CLOSED_to_DEPARTED
          - state_machines.BuildUpPlan.SEALED_to_DEPARTED
          - state_machines.ULD.ASSIGNED_to_DISPATCHED
          - state_machines.ULDCharge.PROVISIONAL_to_FINALIZED
          - calculations.demurrage_calculation
        distinguishing_aspect: |
          Depth-3 chain from POST depart: flight departure moves the SEALED plan
          to DEPARTED (link 1) -> the departed plan dispatches its ULD with
          dispatched_at stamped (link 2) -> dispatch mints a PROVISIONAL demurrage
          charge of 50.00 (link 3). A different trigger than weight-restriction,
          and the same depart also offloads the unbuilt ACCEPTED booking.
        test_recipe:
          setup:
            - "Flight dep 2026-08-10T08:00:00Z arr 2026-08-14T08:00:00Z OPEN_FOR_BOOKING; B1 100kg ACCEPTED and BUILT_UP (plan SEALED); B2 150kg ACCEPTED but never built"
            - "Clock at 2026-08-10T08:00:00Z; flight CLOSED"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA210", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-14T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00007CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-F1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-F2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 150, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings/${b2}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b1}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
          trigger:
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "GET /cargo/build-up-plans/${p_id}"
              as: CapacityController
              captures: { p_st: $.data.status }
            - call: "GET /cargo/ulds/${u_id}"
              as: CapacityController
              captures: { u_st: $.data.status, u_disp: $.data.dispatched_at }
            - call: "GET /cargo/ulds/${u_id}/charges"
              as: CapacityController
              captures: { ch_id: "$.data[0].id" }
            - call: "GET /cargo/uld-charges/${ch_id}"
              as: CapacityController
              captures: { ch_st: $.data.status, ch_amt: $.data.amount, ch_type: $.data.charge_type }
            - call: "GET /cargo/bookings/${b1}"
              as: CapacityController
              captures: { b1_st: $.data.status }
            - call: "GET /cargo/bookings/${b2}"
              as: CapacityController
              captures: { b2_st: $.data.status }
          assert:
            - "Link 1: ${p_st} == DEPARTED"
            - "Link 2: ${u_st} == DISPATCHED and ${u_disp} == 2026-08-10T08:00:00Z (logical clock stamped)"
            - "Link 3: ${ch_type} == DEMURRAGE and ${ch_st} == PROVISIONAL and ${ch_amt} == 50.00 (scheduled_arrival basis: 4 days in use, 1 chargeable)"
            - "${b1_st} == LOADED and ${b2_st} == OFFLOADED (built booking flies; unbuilt ACCEPTED booking is bumped)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (state/safety vs safety/fiscal)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: assign_state_beats_customs_safety
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - state_machines.Booking.ACCEPTED_to_BUILT_UP
        distinguishing_aspect: |
          Error-category pair state(p6) vs business_safety(p8): one assign request
          violates both rules at once — the booking is not-ACCEPTED (state
          violation) AND under an ACTIVE customs hold (safety violation); the
          state error ERR_BOOKING_NOT_ACCEPTED wins.
        test_recipe:
          setup:
            - "Flight OPEN_FOR_BOOKING; booking B (never accepted, stays REQUESTED) with an ACTIVE customs hold; DRAFT plan exists"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA211", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00008CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-P1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/customs-holds"
              payload: { reason_code: "DOC_CHECK" }
              as: CustomsOfficer
              captures: { h_id: $.data.id }
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_BOOKING_NOT_ACCEPTED (state p6 outranks customs-safety p8; the ACTIVE hold is never reported)"

      - name: accept_dg_safety_beats_capacity_fiscal
        grounds:
          - validations[priority=7]
          - validations[priority=13]
          - state_machines.Booking.REQUESTED_to_ACCEPTED
        distinguishing_aspect: |
          Error-category pair business_safety(p7) vs business_fiscal(p13): one
          accept request violates both rules at once — the DG booking targets a
          flight that is not dg_certified (safety) AND is payload-full (fiscal);
          ERR_FLIGHT_NOT_DG_CERTIFIED wins.
        test_recipe:
          setup:
            - "Flight NOT dg_certified, max_payload 100, OPEN_FOR_BOOKING; B1 100kg already ACCEPTED (allocated == 100 == cap)"
            - "B2 is_dangerous_goods, 50kg, still REQUESTED"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA212", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 100, max_volume_m3: 100, uld_position_count: 2, dg_certified: false }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-P2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-P3", commodity_code: "DG", pieces: 1, gross_weight_kg: 50, volume_m3: 1, is_dangerous_goods: true }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b2}/accept"
              as: CapacityController
              captures: { err: $.data.error_id }
            - call: "GET /cargo/bookings/${b2}"
              as: CapacityController
              captures: { b2_st: $.data.status }
          assert:
            - "${err} == ERR_FLIGHT_NOT_DG_CERTIFIED (business_safety p7 outranks business_fiscal p13)"
            - "${b2_st} == REQUESTED (no mutation on validation failure)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (weight equality vs whole-day equality)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: flight_payload_equality_accepted
        grounds:
          - calculations.flight_capacity_check
          - validations[priority=13]
        distinguishing_aspect: |
          Metric = allocated weight kg, endpoint = POST accept. Boundary is
          inclusive: allocated + gross == max_payload ACCEPTS (1000 == 1000);
          strictly greater by 0.1 REJECTS with ERR_FLIGHT_PAYLOAD_EXCEEDED.
        test_recipe:
          setup:
            - "Flight cap 1000/100 OPEN_FOR_BOOKING; B1 600kg ACCEPTED; B2 400kg REQUESTED; B3 0.1kg REQUESTED"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA213", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 100, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-B1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 600, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-B2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 400, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-B3", commodity_code: "GEN", pieces: 1, gross_weight_kg: 0.1, volume_m3: 0.1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b3: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b2}/accept"
              as: CapacityController
              captures: { b2_st: $.data.status }
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { f_aw: $.data.allocated_weight_kg }
            - call: "POST /cargo/bookings/${b3}/accept"
              as: CapacityController
              captures: { err: $.data.error_id }
          assert:
            - "${b2_st} == ACCEPTED (600 + 400 == 1000 == max_payload: equality is accepted, rule is strictly-greater)"
            - "${f_aw} == 1000"
            - "${err} == ERR_FLIGHT_PAYLOAD_EXCEEDED (1000 + 0.1 > 1000)"

      - name: demurrage_free_day_boundary
        grounds:
          - calculations.demurrage_calculation
          - entities.ULDCharge.fields.amount
        distinguishing_aspect: |
          Metric = whole days in use, endpoint = POST /cargo/ulds/{id}/return.
          days_in_use == FREE_DAYS (3) yields chargeable 0 and amount 0.00; one
          day later (4) yields exactly one tier-1 day and 50.00. Different metric
          and different endpoint than the weight boundary.
        test_recipe:
          setup:
            - "Flight dep 2026-08-10T08:00:00Z arr 2026-08-20T08:00:00Z, 2 positions; ULD1 with B1 100kg on plan P1 (window 10:00-11:00), ULD2 with B2 100kg on plan P2 (window 12:00-13:00, 60min gap >= 30); both SEALED; clock at departure; CLOSED, DEPARTED"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA214", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-20T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 5000, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00009CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u1: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00010CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u2: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-D3", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-D4", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings/${b2}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u1}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T11:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v2: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u2}", build_start: "2026-08-09T12:00:00Z", build_end: "2026-08-09T13:00:00Z", expected_flight_version: "${f_v2}" }
              as: RampOperator
              captures: { p2: $.data.id, p2_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p1}/assign"
              payload: { booking_id: "${b1}", expected_build_up_plan_version: "${p1_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p2}/assign"
              payload: { booking_id: "${b2}", expected_build_up_plan_version: "${p2_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p1}/seal"
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p2}/seal"
              as: RampOperator
            - call: "POST /cargo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "GET /cargo/ulds/${u1}/charges"
              as: RampOperator
              captures: { ch1: "$.data[0].id" }
            - call: "GET /cargo/ulds/${u2}/charges"
              as: RampOperator
              captures: { ch2: "$.data[0].id" }
          trigger:
            - call: "POST /cargo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-13T08:00:00Z" }
              as: CapacityController
            - call: "POST /cargo/ulds/${u1}/return"
              as: RampOperator
            - call: "GET /cargo/uld-charges/${ch1}"
              as: RampOperator
              captures: { c1_amt: $.data.amount, c1_st: $.data.status, c1_t1: $.data.tier1_days }
            - call: "POST /cargo/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T08:00:00Z" }
              as: CapacityController
            - call: "POST /cargo/ulds/${u2}/return"
              as: RampOperator
            - call: "GET /cargo/uld-charges/${ch2}"
              as: RampOperator
              captures: { c2_amt: $.data.amount, c2_st: $.data.status, c2_t1: $.data.tier1_days }
          assert:
            - "days_in_use == FREE_DAYS (3): ${c1_st} == FINALIZED and ${c1_amt} == 0.00 and ${c1_t1} == 0"
            - "days_in_use == FREE_DAYS + 1 (4): ${c2_st} == FINALIZED and ${c2_amt} == 50.00 and ${c2_t1} == 1"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (Booking/CustomsHold vs Claim/Booking)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: assign_blocked_by_active_customs_hold
        grounds:
          - state_machines.Booking.ACCEPTED_to_BUILT_UP
          - state_machines.CustomsHold.ACTIVE_to_RELEASED
          - validations[priority=8]
        distinguishing_aspect: |
          Entity pair (Booking, CustomsHold): a booking's ACCEPTED -> BUILT_UP
          transition is gated by the ABSENCE of an ACTIVE CustomsHold row on that
          booking; releasing the hold unblocks the very same assign request.
        test_recipe:
          setup:
            - "Flight OPEN_FOR_BOOKING; booking 100kg ACCEPTED; DRAFT plan; ACTIVE customs hold on the booking"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA215", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00011CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-X1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings/${b_id}/customs-holds"
              payload: { reason_code: "INSPECTION" }
              as: CustomsOfficer
              captures: { h_id: $.data.id }
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
              captures: { err: $.data.error_id }
            - call: "POST /cargo/customs-holds/${h_id}/release"
              payload: { release_note: "docs verified" }
              as: CustomsOfficer
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
              captures: { p_tw: $.data.total_weight_kg }
            - call: "GET /cargo/bookings/${b_id}"
              as: RampOperator
              captures: { b_st: $.data.status, b_plan: $.data.build_up_plan_id }
          assert:
            - "While hold ACTIVE: ${err} == ERR_CUSTOMS_HOLD_ACTIVE"
            - "After release, the identical assign succeeds: ${b_st} == BUILT_UP and ${b_plan} == ${p_id} and ${p_tw} == 100"

      - name: claim_requires_booking_loaded
        grounds:
          - state_machines.Claim.SUBMITTED_to_APPROVED
          - state_machines.Booking.BUILT_UP_to_LOADED
          - validations[priority=6]
        distinguishing_aspect: |
          Entity pair (Claim, Booking) — distinct from (Booking, CustomsHold):
          claim creation is gated on the referenced booking being LOADED; the same
          claim body fails with ERR_BOOKING_INVALID_STATE while the booking is
          ACCEPTED and succeeds after departure moves it to LOADED.
        test_recipe:
          setup:
            - "Flight OPEN_FOR_BOOKING; booking 100kg ACCEPTED (not yet LOADED)"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA216", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-X2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/accept"
              as: CapacityController
          trigger:
            - call: "POST /cargo/claims"
              payload: { booking_id: "${b_id}", claim_type: "LOSS", claimed_amount: 50, items: [{ weight_kg: 1 }] }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { err: $.data.error_id }
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00012CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /cargo/build-up-plans/${p_id}/assign"
              payload: { booking_id: "${b_id}", expected_build_up_plan_version: "${p_v}" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/seal"
              as: RampOperator
            - call: "POST /cargo/flights/${f_id}/close"
              as: CapacityController
            - call: "POST /cargo/flights/${f_id}/depart"
              as: CapacityController
            - call: "POST /cargo/claims"
              payload: { booking_id: "${b_id}", claim_type: "LOSS", claimed_amount: 50, items: [{ weight_kg: 1 }] }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { c_st: $.data.status }
          assert:
            - "While booking ACCEPTED: ${err} == ERR_BOOKING_INVALID_STATE"
            - "After departure (booking LOADED): identical claim body succeeds with ${c_st} == SUBMITTED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (buffer-gap on Flight vs containment on Booking)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: flight_build_window_buffer
        grounds:
          - validations[priority=11]
          - entities.BuildUpPlan.fields.build_start
          - entities.BuildUpPlan.fields.build_end
        distinguishing_aspect: |
          Resource = Flight; interval semantics = closed windows with a mandatory
          30-minute separation buffer. A second plan starting 20 minutes after the
          first plan's build_end is rejected; one starting exactly 30 minutes after
          is accepted (gap >= 30, boundary inclusive).
        test_recipe:
          setup:
            - "Flight OPEN_FOR_BOOKING; ULDType AKE; ULDs AKE00013CA and AKE00014CA SERVICEABLE"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA217", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 3, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00013CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u1: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00014CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u2: $.data.id }
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u1}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p1: $.data.id }
          trigger:
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v2: $.data.version }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u2}", build_start: "2026-08-09T12:20:00Z", build_end: "2026-08-09T13:00:00Z", expected_flight_version: "${f_v2}" }
              as: RampOperator
              captures: { err: $.data.error_id }
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u2}", build_start: "2026-08-09T12:30:00Z", build_end: "2026-08-09T13:30:00Z", expected_flight_version: "${f_v2}" }
              as: RampOperator
              captures: { p2_st: $.data.status }
          assert:
            - "20-minute gap: ${err} == ERR_BUILD_WINDOW_CONFLICT (buffer violation; ULD stays SERVICEABLE, no plan persisted)"
            - "Exactly 30-minute gap: ${p2_st} == DRAFT (buffer boundary is inclusive)"

      - name: customs_hold_containment_overlap
        grounds:
          - validations[priority=6]
          - state_machines.CustomsHold.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          Resource = Booking; interval semantics = containment in an open-ended
          occupation [placed_at, released_at): a second hold whose placement falls
          inside the first hold's still-open interval is rejected
          (ERR_HOLD_ALREADY_ACTIVE); after release closes the interval, a new hold
          is accepted. Different resource and different interval geometry than the
          flight build-window buffer.
        test_recipe:
          setup:
            - "Flight OPEN_FOR_BOOKING; booking REQUESTED (holds allowed pre-acceptance)"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA218", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-H1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 100, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b_id: $.data.id }
            - call: "POST /cargo/bookings/${b_id}/customs-holds"
              payload: { reason_code: "DOC_CHECK" }
              as: CustomsOfficer
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /cargo/bookings/${b_id}/customs-holds"
              payload: { reason_code: "INSPECTION" }
              as: CustomsOfficer
              captures: { err: $.data.error_id }
            - call: "POST /cargo/customs-holds/${h1}/release"
              payload: { release_note: "cleared" }
              as: CustomsOfficer
              captures: { h1_st: $.data.status }
            - call: "POST /cargo/bookings/${b_id}/customs-holds"
              payload: { reason_code: "INSPECTION" }
              as: CustomsOfficer
              captures: { h2_st: $.data.status }
          assert:
            - "Second hold inside the first hold's open interval: ${err} == ERR_HOLD_ALREADY_ACTIVE"
            - "Release closes the interval: ${h1_st} == RELEASED; the new placement then succeeds with ${h2_st} == ACTIVE"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (allocated mass vs serviceable fleet count)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: flight_weight_accept_cancel_conservation
        grounds:
          - state_machines.Booking.REQUESTED_to_ACCEPTED
          - state_machines.Booking.ACCEPTED_to_CANCELLED
          - calculations.flight_capacity_check
          - entities.Flight.fields.allocated_weight_kg
        distinguishing_aspect: |
          Conserved quantity = allocated mass (kg): invariant
          flight.allocated_weight_kg == sum(gross of bookings in {ACCEPTED,
          BUILT_UP}). Forward action accept(+200) paired with compensating
          cancel(-200) returns the quantity to exactly its pre-action value 400.
        test_recipe:
          setup:
            - "Flight cap 1000 OPEN_FOR_BOOKING; B1 400kg ACCEPTED (allocated 400); B2 200kg REQUESTED (owner fwd-1)"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA219", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 100, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-I1", commodity_code: "GEN", pieces: 1, gross_weight_kg: 400, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b1: $.data.id }
            - call: "POST /cargo/bookings/${b1}/accept"
              as: CapacityController
            - call: "POST /cargo/bookings"
              payload: { flight_id: "${f_id}", shipper_ref: "SHP-I2", commodity_code: "GEN", pieces: 1, gross_weight_kg: 200, volume_m3: 1 }
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2: $.data.id }
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { aw_pre: $.data.allocated_weight_kg }
          trigger:
            - call: "POST /cargo/bookings/${b2}/accept"
              as: CapacityController
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { aw_mid: $.data.allocated_weight_kg }
            - call: "POST /cargo/bookings/${b2}/cancel"
              as: ForwarderAgent
              as_user_id: fwd-1
              captures: { b2_st: $.data.status }
            - call: "GET /cargo/flights/${f_id}"
              as: CapacityController
              captures: { aw_post: $.data.allocated_weight_kg }
          assert:
            - "${aw_pre} == 400 and ${aw_mid} == 600 (accept debits the pool)"
            - "${b2_st} == CANCELLED and ${aw_post} == 400 (compensating cancel restores the conserved quantity exactly — no drift)"

      - name: uld_fleet_assign_cancel_conservation
        grounds:
          - state_machines.ULD.SERVICEABLE_to_ASSIGNED
          - state_machines.ULD.ASSIGNED_to_SERVICEABLE
          - state_machines.BuildUpPlan.DRAFT_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity = serviceable fleet count (asset units, not kg):
          creating a plan moves the only ULD out of SERVICEABLE (count 1 -> 0) and
          the compensating plan cancel returns it (0 -> 1). Different conserved
          quantity type than the allocated-mass invariant.
        test_recipe:
          setup:
            - "Flight OPEN_FOR_BOOKING; ULDType AKE; exactly one ULD AKE00015CA SERVICEABLE"
          setup_api_calls:
            - call: "POST /cargo/flights"
              payload: { flight_number: "CA220", origin: "SFO", destination: "NRT", scheduled_departure: "2026-08-10T08:00:00Z", scheduled_arrival: "2026-08-12T08:00:00Z", max_payload_kg: 1000, max_volume_m3: 10, uld_position_count: 2, dg_certified: true }
              as: CapacityController
              captures: { f_id: $.data.id }
            - call: "POST /cargo/flights/${f_id}/open"
              as: CapacityController
            - call: "POST /cargo/uld-types"
              payload: { type_code: "AKE", tare_weight_kg: 100, max_gross_weight_kg: 500, internal_volume_m3: 4.5 }
              as: RampOperator
              captures: { t_id: $.data.id }
            - call: "POST /cargo/ulds"
              payload: { uld_code: "AKE00015CA", uld_type_id: "${t_id}" }
              as: RampOperator
              captures: { u_id: $.data.id }
            - call: "GET /cargo/flights/${f_id}"
              as: RampOperator
              captures: { f_v: $.data.version }
          trigger:
            - call: "POST /cargo/build-up-plans"
              payload: { flight_id: "${f_id}", uld_id: "${u_id}", build_start: "2026-08-09T10:00:00Z", build_end: "2026-08-09T12:00:00Z", expected_flight_version: "${f_v}" }
              as: RampOperator
              captures: { p_id: $.data.id }
            - call: "GET /cargo/ulds"
              payload: { status: "SERVICEABLE" }
              as: RampOperator
            - call: "POST /cargo/build-up-plans/${p_id}/cancel"
              as: RampOperator
            - call: "GET /cargo/ulds/${u_id}"
              as: RampOperator
              captures: { u_post_st: $.data.status }
          assert:
            - "After plan create: GET /cargo/ulds with payload {status: SERVICEABLE} returns an empty data array and total_count 0 (fleet count 0)"
            - "After compensating plan cancel: ${u_post_st} == SERVICEABLE (fleet count restored to 1 — forward assign + cancel conserve the serviceable-unit count)"
