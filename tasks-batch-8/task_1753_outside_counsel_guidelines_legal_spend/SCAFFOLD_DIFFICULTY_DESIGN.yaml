  # =====================================================================
  # Rule 6 — boundary_precision_check (≥2 instances, different metrics/endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rate_cap_exact_boundary_compliant
        grounds:
          - calculations.annual_rate_increase_pct
          - endpoints: "POST /legal-departments/{deptId}/panel-firms/{firmId}/rate-cards/{cardId}/approve"
        distinguishing_aspect: |
          Metric: annual_increase_pct. A proposed rate at EXACTLY the cap
          (5.00% over prior year) is compliant (inclusive boundary); one cent
          above is clamped. Boundary is >= vs > precision.
        test_recipe:
          setup:
            - "Firm with APPROVED 2026 card, PARTNER approved_rate_cents=100000"
            - "Two DRAFT 2027 cards in sequence (year conflict prevents simultaneous submission); we test on a single card whose PARTNER proposes 105000 (exactly +5.00%) and a second timekeeper ASSOCIATE at 52000 (exactly +4.00% = sub-cap)"
          setup_api_calls:
            - call: "POST /legal-departments"
              payload: { name: "BndDept", annual_rate_increase_cap_pct: 5.00, partner_ratio_min_pct: 10, partner_ratio_max_pct: 90, guideline_notice_days: 30, acknowledgment_window_days: 14 }
