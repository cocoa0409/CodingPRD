            - { call: "POST /comp/programs/${prog}/transition", payload: { to_state: "PUBLISHED" }, as: CompAdmin }
            - { call: "POST /comp/departments", payload: { name: "Dept A", code: "DA", adjustment_pool_cents: 5000000 }, as: CompAdmin, captures: { dept: $.data.id } }
            - { call: "POST /comp/employees", payload: { employee_ref: "E1", department_id: "${dept}", job_profile_id: "${prof2}", geo_zone_id: "${nat}", base_salary_cents: 14000000, hire_date: "2019-05-01" }, as: HRBP, captures: { emp: $.data.id } }
            - { call: "POST /comp/exception-requests", payload: { employee_id: "${emp}", pay_band_id: "${band2}", type: "OFF_CYCLE_INCREASE", requested_salary_cents: 15697500, justification: "at cap" }, as: DepartmentManager, as_user_id: "${dept}", captures: { xr: $.data.id } }
            - { call: "POST /comp/exception-requests/${xr}/hrbp-pass", payload: {}, as: HRBP, as_user_id: "hrbp-1" }
