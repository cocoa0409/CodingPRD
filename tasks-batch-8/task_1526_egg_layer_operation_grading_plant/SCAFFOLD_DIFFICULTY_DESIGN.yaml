          Metric = integer age_weeks on POST /api/flocks/{id}/induce-molt. The rule is
          age_weeks >= 60: at 59 weeks (419 days) induce-molt is rejected with
          ERR_MOLT_AGE_INELIGIBLE; at exactly 60 weeks (420 days) it succeeds.
        test_recipe:
          setup:
            - "Farm; house; flock placed 2026-01-05 (800 hens); ops run executed after each clock move so the flock is LAYING"
