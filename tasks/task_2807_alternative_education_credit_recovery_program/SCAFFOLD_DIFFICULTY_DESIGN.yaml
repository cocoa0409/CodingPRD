      - name: placement_exit_cascade_to_waitlist_promotion
        depth: 3
        grounds:
          - state_machines.Placement.ACTIVE_to_EXITED_UNSUCCESSFUL
          - state_machines.CourseEnrollment.IN_PROGRESS_to_AWARD_DENIED
          - state_machines.Center.FROZEN_to_OPEN
          - state_machines.Referral.WAITLISTED_to_PLACEMENT_OFFERED
          - calculations.center_intake_posture
          - entities.Referral.fields.promoted_from_waitlist
        distinguishing_aspect: |
          A different trigger (POST /placements/{id}/exit, not an award) drives a three-hop chain
          across four entities and re-derives the same derived field twice inside one request:
          hop 1 denies the in-progress enrollment, hop 2 releases the seat so intake_posture leaves
          FROZEN for OPEN, hop 3 promotes the single WAITLISTED referral, whose reservation pushes
          intake_posture straight back to FROZEN. The final posture equals the starting posture even
          though every intermediate value changed.
        test_recipe:
          setup:
            - "one home school and one center with seat_capacity 1, certified_teacher_fte 4.00, support_staff_fte 2.00, max_students_per_teacher 12"
            - "one PACKET course ALG1 (credit_value 1.00, total_modules 8, required_seat_hours 60.00)"
