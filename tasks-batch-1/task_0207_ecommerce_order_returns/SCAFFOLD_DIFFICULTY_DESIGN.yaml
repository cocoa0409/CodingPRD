  # =========================================================================
  # Rule 8 — Resource temporal/capacity overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inventory_aggregate_capacity_overlap_pushes_second_order_to_backorder
        grounds:
          - calculations.reservation_waterfall
          - entities.InventoryItem.fields.available_qty
          - entities.OrderLine.fields.backordered_qty
        distinguishing_aspect: |
          [aggregate-capacity interval] Two orders compete for the same finite on_hand pool: order A reserves the full
          available_qty 5 at a warehouse; order B's checkout for qty 3 then collides with A's held occupation and is
          pushed entirely to backorder (available_qty 0). The conflict is aggregate-capacity overlap on InventoryItem.
        test_recipe:
          setup:
            - "One product, one warehouse on_hand 5. Order A (qty5) checked out reserves all 5 → available 0."
            - "Order B (qty3) checked out collides with A's held occupation → reserved 0, backordered 3, order B BACKORDERED."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "c8a@x.com", full_name: "C8A" }
              as: Anonymous
              captures: { cust_id: $.data.id }
            - call: "POST /warehouses"
              payload: { code: "W8A", name: "Main", fulfillment_priority: 1 }
              as: StoreAdmin
              captures: { wh_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "S8A", title: "S8A", unit_price_cents: 1000, tax_rate_bps: 0, return_window_days: 30, final_sale: false }
              as: StoreAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /inventory"
              payload: { product_id: "${prod_id}", warehouse_id: "${wh_id}", on_hand_qty: 5 }
              as: StoreAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ordA_id: $.data.id }
            - call: "POST /orders/${ordA_id}/lines"
              payload: { product_id: "${prod_id}", qty: 5 }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /orders/${ordA_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ordA_v: $.data.version }
            - call: "POST /orders/${ordA_id}/checkout"
              payload: { expected_order_version: "${ordA_v}" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ordB_id: $.data.id }
            - call: "POST /orders/${ordB_id}/lines"
              payload: { product_id: "${prod_id}", qty: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { olB_id: $.data.id }
