  # Every error id in the §1.6 catalog is triggered by at least one instance in
  # this file or in SCAFFOLD_DIFFICULTY_DESIGN.yaml. Coverage that lives outside
  # this section:
  #   ERR_VALIDATION, ERR_READONLY_FIELD, ERR_VETERAN_NOT_FOUND  -> entities
  #   ERR_POA_VETERAN_MISMATCH                                   -> entities (flat)
  #   ERR_INVALID_STATE_TRANSITION, ERR_REPORT_NOT_COMPUTED      -> state_machines
  #   ERR_APPEAL_DEADLINE_PASSED                                 -> calculations
  #   ERR_INVALID_SERVICE_DATES, ERR_INTENT_TO_FILE_DATE_INVALID,
  #   ERR_PROGRAM_INPUT_MISMATCH, ERR_EVIDENCE_ITEM_OUTSTANDING  -> validations
  #   ERR_REPRESENTATIVE_NOT_FOUND, ERR_QUARTER_NOT_CLOSED       -> endpoints
  #   ERR_UNAUTHORIZED, ERR_ACTOR_NOT_OWNER                      -> rbac
  #   ERR_STALE_VETERAN_VERSION, ERR_STALE_PROGRAM_VERSION       -> cross-cutting complexity layers
      - name: corner_patch_endpoints_touch_only_the_supplied_fields_on_claims_and_sites
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /cvso/claims/{id}]
          - endpoints[PATCH /cvso/exam-sites/{id}]
          - endpoints[GET /cvso/claims/{id}/evidence-items]
          - endpoints[GET /cvso/representatives/{id}/outreach-events]
          - validations[priority=58]
        distinguishing_aspect: "A partial update rewrites only the keys present in the body: the claim PATCH replaces claimed_conditions and sets intent_to_file_date while leaving status DRAFT and evidence_completeness_pct at 0.00, the site PATCH raises concurrent_capacity while leaving booked_slot_count at 0, each bumps only its own version by one, and the two reverse-lookup lists report total_count 0 for the untouched children."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO with no outreach events."
            - "ExamSite site with concurrent_capacity 2 and buffer_minutes 15."
            - "Veteran vet with a VERIFIED DD214, an ACTIVE designation and a claim claim left in DRAFT with the single condition tinnitus."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
