            - *b02
            - *b03
            - *b04
            - *b05
            - *b06
            - *b07
            - *b08
            - *b09
            - *b10
            - *b11
            - *b12
            - *b13
            - *b14
            - *b15
            - *b16
            - *b17
            - *b18
            - *b19
            - *b20
            - *b21
            - *b22
            - *b23
            - *b24
            - *b25
            - *b26
            - *b27
            - *b28
            - *b29
            - *b30
            - *b31
            - *b32
            - *b33
            - call: "POST /assets/${d1_id}/replication-observations"
