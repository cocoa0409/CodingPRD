              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${opener_id}"
            - call: "POST /retake-authorizations"
              payload: { voided_session_id: "${sess_id}" }
              as: ReviewOfficer
              as_user_id: "${officer_id}"
              captures: { retake_id: $.data.id }
            - call: "GET /appointments/${appt_id}"
              as: SchedulingCoordinator
              captures: { orig_v: $.data.version }
          trigger:
            - call: "POST /retake-authorizations/${retake_id}/rebook"
              payload: { proctor_id: "${opener_id}", scheduled_start_utc: "2026-07-01T14:00:00Z", expected_appointment_version: "${orig_v} - 1" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"

      - name: cascade_dismiss_resolves_flag_and_resumes_session
        claim_type: cascading_side_effects
        grounds: [state_machines.Escalation.UNDER_REVIEW_to_DISMISSED, state_machines.ProctoringSession.REVIEW_HELD_to_ACTIVE, entities.IncidentFlag.fields.status]
        excluded_because:
          difficulty_instance: compensating_invariant / dismiss_conserves_session_integrity_penalty_set
          rationale: "The dismiss cascade (flag RESOLVED, session ACTIVE, integrity restored) is asserted end-to-end by the named §1.8 instance."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: rebook_supersede_immediate_visibility
        claim_type: immediate
        grounds: [state_machines.Appointment.CONSUMED_to_CONSUMED, entities.Appointment.fields.superseded_by_id, entities.RetakeAuthorization.fields.replacement_appointment_id]
        distinguishing_aspect: "After POST /retake-authorizations/{id}/rebook, the same response and an immediate re-read show original.superseded_by_id set, original.status still CONSUMED, retake.status REBOOKED — all changes visible immediately (immediate consistency)."
        test_recipe:
          setup: ["A VOIDED session (auto-threshold), a retake AUTHORIZED for it by a review officer; original appointment still present."]
          setup_api_calls:
            - call: "POST /institutions"
              payload: { name: "Inst RB" }
              as: SchedulingCoordinator
              captures: { inst_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Opener RB", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { opener_id: $.data.id }
            - call: "POST /proctors"
              payload: { institution_id: "${inst_id}", full_name: "Officer RB", concurrent_capacity: 4 }
              as: SchedulingCoordinator
              captures: { officer_id: $.data.id }
            - call: "POST /candidates"
              payload: { institution_id: "${inst_id}", full_name: "Cand RB", email: "rb@x.com" }
              as: SchedulingCoordinator
              captures: { cand_id: $.data.id }
            - call: "POST /exams"
              payload: { institution_id: "${inst_id}", title: "RB Exam", base_duration_minutes: 60, window_start_utc: "2026-07-01T08:00:00Z", window_end_utc: "2026-07-01T23:00:00Z", monitoring_mode: "LIVE", lockdown_required: false }
              as: SchedulingCoordinator
              captures: { exam_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /appointments"
              payload: { exam_id: "${exam_id}", candidate_id: "${cand_id}", proctor_id: "${opener_id}", scheduled_start_utc: "2026-07-01T09:00:00Z" }
              as: SchedulingCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /appointments/${appt_id}/check-in"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { sess_id: $.data.id }
            - call: "POST /sessions/${sess_id}/flags"
              payload: { kind: "PROHIBITED_MATERIAL", severity: "CRITICAL" }
              as: Proctor
              as_user_id: "${opener_id}"
            - call: "POST /sessions/${sess_id}/flags"
              payload: { kind: "SECOND_FACE", severity: "MAJOR" }
              as: Proctor
              as_user_id: "${opener_id}"
            - call: "POST /retake-authorizations"
              payload: { voided_session_id: "${sess_id}" }
              as: ReviewOfficer
              as_user_id: "${officer_id}"
              captures: { retake_id: $.data.id }
            - call: "GET /appointments/${appt_id}"
              as: SchedulingCoordinator
              captures: { orig_v: $.data.version }
          trigger:
            - call: "POST /retake-authorizations/${retake_id}/rebook"
              payload: { proctor_id: "${opener_id}", scheduled_start_utc: "2026-07-01T14:00:00Z", expected_appointment_version: "${orig_v}" }
              as: SchedulingCoordinator
              captures: { repl_id: $.data.id }
          assert:
            - "Appointment.${appt_id}.superseded_by_id == ${repl_id} (visible immediately)"
            - "Appointment.${appt_id}.status == CONSUMED (status preserved; only superseded_by_id + version changed)"
            - "RetakeAuthorization.${retake_id}.status == REBOOKED"
