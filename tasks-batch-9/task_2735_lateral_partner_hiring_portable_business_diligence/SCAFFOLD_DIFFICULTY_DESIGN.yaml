  - rule_id: combinatorial_formula
    instances:

      - name: entry_amount_hard_cap_and_realization_cap_interact_non_linearly
        grounds:
          - calculations.entry_validated_portable_amount
          - entities.ClientBookEntry.fields.relationship_role
          - entities.ClientBookEntry.fields.client_consent_status
          - entities.ClientBookEntry.fields.claimed_realization_rate
          - entities.ClientBookEntry.fields.baseline_portable_amount_usd
          - state_machines.ClientBookEntry.UNVALIDATED_to_VALIDATED
        distinguishing_aspect: |
          Mode (a): five independent entity fields plus one cross-entity aggregate feed a
          formula whose interaction is non-linear in two separate places — MIN() on the
          realization rate and a second MIN() hard cap on the PRODUCT. Entry A proves the
          0.90 hard cap DOMINATES (raw 1339500.00 is discarded for 1269000.00), entry B
          proves the role/consent factors dominate instead (raw 332112.1481 survives
          because the cap 666000.30 is slack), and entry C proves the realization cap
          clips 0.9900 down to 0.9500. No single factor is monotone in the output: raising
          entry A's claimed_realization_rate from 1.0000 to any value changes NOTHING,
          while raising entry B's by the same delta moves its amount.
        test_recipe:
          setup:
            - "One OPEN PracticeGroup, one ACTIVE SearchFirmEngagement, one Candidate in DILIGENCE."
            - "The FULL BOOK: three ACTIVE ClientBookEntry rows spanning all three relationship_role values and both client_consent_status values."
            - "Nine VERIFIED HISTORICAL CollectionRecord rows, three per entry, all inside the half-open lookback window [2023-07-01, 2026-07-01)."
