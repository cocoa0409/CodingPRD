              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/market-value-snapshots"
              payload: { snapshot_kind: "QUARTER_END", effective_date: "2025-12-31T00:00:00Z", market_value: 110000.00 }
              as: FinanceOfficer
            - call: "POST /funds/${fe_id}/spending-policy-runs"
              payload: { fiscal_year: 2026 }
              as: FinanceOfficer
            - call: "POST /grantees"
              payload: { legal_name: "City Food Bank", tax_id: "123456789", irs_subsection: "C3_501" }
              as: ComplianceOfficer
              captures: { g_id: $.data.id }
            - call: "POST /grantees/${g_id}/begin-review"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /grantees/${g_id}/clear"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /funds/${fe_id}"
              as: FoundationAdmin
              captures: { fe_v_pre: $.data.version }
            - call: "POST /grants"
              payload: { fund_id: "${fe_id}", grantee_id: "${g_id}", amount: 4666.87, purpose: "Food program", expected_fund_version: "${fe_v_pre}" }
              as: FoundationAdmin
              captures: { gr_id: $.data.id }
            - call: "POST /grants/${gr_id}/submit"
              payload: {}
              as: FoundationAdmin
            - call: "POST /grants/${gr_id}/claim-review"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /grants/${gr_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-c2-distinct-from-claimer"
          assert:
