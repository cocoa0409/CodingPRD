scaffold_corner_design:

  # ---------------------------------------------------------------- Entities
  - section: entities
    instances:
      - name: create_product_returns_201_with_computed_available
        claim_type: creation
        grounds: [entities.Product.fields.stock_available, endpoints]
        distinguishing_aspect: "POST /products with stock_on_hand 5 returns 201 with stock_reserved 0 and computed stock_available 5."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /products", payload: { sku: "P1", name: "Deck", category: "DECK", unit_price_cents: 6000, stock_on_hand: 5 }, as: ShopManager, captures: { p_id: "$.data.id" } }
          assert:
            - "Product.${p_id}.stock_reserved == 0"
            - "Product.${p_id}.stock_available == 5"
            - "HTTP status == 201"

      - name: create_product_default_buildable_false
        claim_type: defaults
        grounds: [entities.Product.fields.buildable_component]
        distinguishing_aspect: "Omitting buildable_component defaults it to false."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /products", payload: { sku: "P2", name: "Wax", category: "WAX", unit_price_cents: 500 }, as: ShopManager, captures: { p_id: "$.data.id" } }
          assert:
            - "Product.${p_id}.buildable_component == false"

      - name: get_member_nonexistent_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]", endpoints]
        distinguishing_aspect: "GET /members/{unknown-uuid} returns ERR_MEMBER_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /members/00000000-0000-4000-8000-000000000000", payload: {}, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_MEMBER_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_product_missing_category_returns_validation
        claim_type: required_fields
        grounds: ["errors[ERR_VALIDATION]", entities.Product.fields.category]
        distinguishing_aspect: "POST /products without required category returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /products", payload: { sku: "P3", name: "NoCat", unit_price_cents: 100 }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: create_rental_unit_invalid_kind_returns_validation
        claim_type: type_constraints
        grounds: ["errors[ERR_VALIDATION]", entities.RentalUnit.fields.kind]
        distinguishing_aspect: "POST /rental-units with kind='CANOE' (not in enum) returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /rental-units", payload: { name: "Bad", kind: "CANOE", daily_rate_cents: 100 }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: restock_recomputes_stock_available
        claim_type: computed_fields
        grounds: [entities.Product.fields.stock_available, endpoints]
        distinguishing_aspect: "POST /products/{id}/restock quantity 3 on a product with on_hand 2, reserved 0 yields stock_available 5."
        test_recipe:
          setup: ["a product on_hand 2"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P4", name: "Bearings", category: "BEARINGS", unit_price_cents: 2000, stock_on_hand: 2 }, as: ShopManager, captures: { p_id: "$.data.id" } }
          trigger:
            - { call: "POST /products/${p_id}/restock", payload: { quantity: 3 }, as: ShopManager }
          assert:
            - "Product.${p_id}.stock_on_hand == 5"
            - "Product.${p_id}.stock_available == 5"

      - name: list_board_builds_by_member_reverse_reachability
        claim_type: listing
        grounds: [entities.BoardBuild.fields.member_id, endpoints]
        distinguishing_aspect: "GET /board-builds?member_id=<id> returns the member's builds as an array with pagination envelope."
        test_recipe:
          setup: ["a member with one DRAFT build"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P5", name: "Deck", category: "DECK", unit_price_cents: 6000, buildable_component: true, stock_on_hand: 3 }, as: ShopManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "lst@x.com", full_name: "Lister" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${p_id}", qty: 1 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
          trigger:
            - { call: "GET /board-builds?member_id=${m_id}", payload: {}, as: Associate }
          assert:
            - "response.data is an array containing a build with id == ${build_id}"
            - "response.meta pagination fields total_count/has_more present"

      - name: list_event_registrations_by_event_reverse_reachability
        claim_type: listing
        grounds: [entities.EventRegistration.fields.event_id, endpoints]
        distinguishing_aspect: "GET /event-registrations?event_id=<id> returns the event's registrations array."
        test_recipe:
          setup: ["an OPEN event (cost 0) with one REGISTERED member"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "ereg@x.com", full_name: "Reg" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /events", payload: { name: "Free Jam", capacity: 10, entry_points_cost: 0 }, as: ShopManager, captures: { e_id: "$.data.id" } }
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m_id}" }, as: Associate, captures: { reg_id: "$.data.id" } }
          trigger:
            - { call: "GET /event-registrations?event_id=${e_id}", payload: {}, as: Associate }
          assert:
            - "response.data is an array containing a registration with id == ${reg_id}"

  # ---------------------------------------------------------- State machines
  - section: state_machines
    instances:
      - name: assemble_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.BoardBuild.COMPONENTS_RESERVED_to_ASSEMBLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Calling /assemble on a DRAFT build (needs COMPONENTS_RESERVED) returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["a DRAFT build"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P6", name: "Deck", category: "DECK", unit_price_cents: 6000, buildable_component: true, stock_on_hand: 3 }, as: ShopManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "st1@x.com", full_name: "St1" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${p_id}", qty: 1 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
          trigger:
            - { call: "POST /board-builds/${build_id}/assemble", payload: {}, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "BoardBuild.${build_id}.status == DRAFT"

      - name: cancel_completed_build_terminal_lockdown_returns_invalid_state
        claim_type: terminal_state
        grounds: [state_machines.BoardBuild.SETUP_COMPLETE_to_COMPLETED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancelling a COMPLETED (terminal) build returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a COMPLETED build (reserved->assembled->setup->complete)"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "P7", name: "Deck", category: "DECK", unit_price_cents: 6000, buildable_component: true, stock_on_hand: 3 }, as: ShopManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "st2@x.com", full_name: "St2" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${p_id}", qty: 1 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
            - { call: "POST /board-builds/${build_id}/reserve", payload: {}, as: Associate }
            - { call: "POST /board-builds/${build_id}/assemble", payload: {}, as: Associate }
            - { call: "POST /board-builds/${build_id}/setup", payload: {}, as: Associate }
            - { call: "POST /board-builds/${build_id}/complete", payload: {}, as: Associate }
          trigger:
            - { call: "POST /board-builds/${build_id}/cancel", payload: {}, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "BoardBuild.${build_id}.status == COMPLETED"

      - name: suspend_already_suspended_returns_invalid_state
        claim_type: idempotency
        grounds: [state_machines.Member.ACTIVE_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Suspending an already-SUSPENDED member returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a SUSPENDED member"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "st3@x.com", full_name: "St3" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /members/${m_id}/suspend", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /members/${m_id}/suspend", payload: {}, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: special_order_deposit_before_quote_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SpecialOrder.QUOTED_to_DEPOSIT_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /special-orders/{id}/deposit on a REQUESTED (un-quoted) order returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a REQUESTED special order"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "so1@x.com", full_name: "SO1" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /special-orders", payload: { member_id: "${m_id}", product_name: "Custom fin", qty: 1 }, as: Associate, captures: { so_id: "$.data.id" } }
          trigger:
            - { call: "POST /special-orders/${so_id}/deposit", payload: { deposit_cents: 500 }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"

  # ------------------------------------------------------------ Calculations
  - section: calculations
    instances:
      - name: rental_charge_base_plus_late_fee
        claim_type: correct_result
        grounds: [calculations.rental_charge, state_machines.Rental.CHECKED_OUT_to_RETURNED, endpoints]
        distinguishing_aspect: "3-day rental at 2500/day returned 2 days late (clock 2026-07-14, end 2026-07-12): rental_total 7500, late_fee 2*1500=3000."
        test_recipe:
          setup: ["a CHECKED_OUT rental 2026-07-10..2026-07-12 at 2500/day; clock advanced to 2026-07-14"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "rc@x.com", full_name: "RC" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /rental-units", payload: { name: "Board", kind: "SURFBOARD", daily_rate_cents: 2500 }, as: ShopManager, captures: { u_id: "$.data.id" } }
            - { call: "POST /rentals", payload: { member_id: "${m_id}", unit_id: "${u_id}", start_date: "2026-07-10", end_date: "2026-07-12" }, as: Associate, captures: { r_id: "$.data.id" } }
            - { call: "POST /rentals/${r_id}/checkout", payload: {}, as: Associate }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-14T09:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "POST /rentals/${r_id}/return", payload: {}, as: Associate }
          assert:
            - "Rental.${r_id}.rental_total_cents == 7500"
            - "Rental.${r_id}.late_fee_cents == 3000"
            - "Rental.${r_id}.status == RETURNED"

      - name: service_charge_labor_plus_parts_and_consumption
        claim_type: correct_result
        grounds: [calculations.service_charge, state_machines.ServiceOrder.IN_PROGRESS_to_DONE, entities.Product.fields.stock_on_hand]
        distinguishing_aspect: "GRIP service (labor 800) consuming 2 wax parts at 500 each: parts_total 1000, total_cents 1800; wax on_hand 5->3, reserved 2->0."
        test_recipe:
          setup: ["a member; an OPEN bay; a wax part product on_hand 5; an IN_PROGRESS GRIP service order reserving 2 wax parts"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "WAX2", name: "Wax", category: "WAX", unit_price_cents: 500, stock_on_hand: 5 }, as: ShopManager, captures: { part_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "sc@x.com", full_name: "SC" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /service-bays", payload: { name: "Bay X" }, as: ShopManager, captures: { bay_id: "$.data.id" } }
            - { call: "POST /service-orders", payload: { member_id: "${m_id}", bay_id: "${bay_id}", service_type: "GRIP", parts_lines: [ { product_id: "${part_id}", qty: 2 } ], slot_start: "2026-07-05T10:00:00Z", slot_end: "2026-07-05T10:45:00Z" }, as: Associate, captures: { so_id: "$.data.id" } }
            - { call: "POST /service-orders/${so_id}/start", payload: {}, as: Associate }
          trigger:
            - { call: "POST /service-orders/${so_id}/complete", payload: {}, as: Associate }
          assert:
            - "ServiceOrder.${so_id}.labor_total_cents == 800"
            - "ServiceOrder.${so_id}.parts_total_cents == 1000"
            - "ServiceOrder.${so_id}.total_cents == 1800"
            - "Product.${part_id}.stock_on_hand == 3"
            - "Product.${part_id}.stock_reserved == 0"

      - name: loyalty_earn_min_cap_applies
        claim_type: constants_applied
        grounds: [calculations.loyalty_earn, state_machines.Lesson.CONFIRMED_to_COMPLETED, entities.Member.fields.points_balance]
        distinguishing_aspect: "STANDARD lesson fee 60000 -> floor(60000/100)=600 base points; MAX_POINTS_PER_TXN caps earned at 500."
        test_recipe:
          setup: ["STANDARD member; a CONFIRMED lesson fee 60000"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "cap@x.com", full_name: "Cap" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /instructors", payload: { full_name: "Coach G", discipline: "SKATE" }, as: ShopManager, captures: { i_id: "$.data.id" } }
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SKATE", start_at: "2026-07-11T10:00:00Z", end_at: "2026-07-11T11:00:00Z", fee_cents: 60000 }, as: Associate, captures: { l_id: "$.data.id" } }
            - { call: "POST /lessons/${l_id}/confirm", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /lessons/${l_id}/complete", payload: {}, as: ShopManager }
          assert:
            - "Member.${m_id}.points_balance == 500"

  # -------------------------------------------------------------- Validations
  - section: validations
    instances:
      - name: create_member_missing_auth_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "POST /members with no/invalid X-User-Role header returns ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["empty DB; request sent with no auth headers"]
          setup_api_calls: []
          trigger:
            - { call: "POST /members", payload: { email: "na@x.com", full_name: "NoAuth" }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: appraise_existence_before_state_nonexistent_tradein_returns_not_found
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_TRADEIN_NOT_FOUND]"]
        distinguishing_aspect: "POST /trade-ins/{unknown}/appraise returns ERR_TRADEIN_NOT_FOUND (404) — existence (prio 3) before state."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /trade-ins/00000000-0000-4000-8000-000000000abc/appraise", payload: { appraised_value_cents: 100 }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_TRADEIN_NOT_FOUND"

  # -------------------------------------------------------------------- Errors
  - section: errors
    instances:
      - name: reserve_insufficient_stock_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Reserving a build line qty 2 against a product with stock_available 1 returns ERR_INSUFFICIENT_STOCK (409)."
        test_recipe:
          setup: ["a buildable product stock 1; a build with one line qty 2"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "LOW1", name: "Deck", category: "DECK", unit_price_cents: 6000, buildable_component: true, stock_on_hand: 1 }, as: ShopManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "ins@x.com", full_name: "Ins" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${p_id}", qty: 2 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
          trigger:
            - { call: "POST /board-builds/${build_id}/reserve", payload: {}, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_STOCK"
            - "Product.${p_id}.stock_reserved == 0"

      - name: reserve_discontinued_component_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_PRODUCT_DISCONTINUED]"]
        distinguishing_aspect: "Reserving a build whose component product has status DISCONTINUED returns ERR_PRODUCT_DISCONTINUED (409)."
        test_recipe:
          setup: ["a build referencing a product later set DISCONTINUED"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "DIS1", name: "Deck", category: "DECK", unit_price_cents: 6000, buildable_component: true, stock_on_hand: 5 }, as: ShopManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "dis@x.com", full_name: "Dis" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${p_id}", qty: 1 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
            - { call: "PATCH /products/${p_id}", payload: { status: "DISCONTINUED" }, as: ShopManager }
          trigger:
            - { call: "POST /board-builds/${build_id}/reserve", payload: {}, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_PRODUCT_DISCONTINUED"

      - name: rental_unit_overlap_returns_unit_unavailable
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_UNIT_UNAVAILABLE]"]
        distinguishing_aspect: "A second within-max rental 2026-07-11..2026-07-13 overlapping an existing 2026-07-10..2026-07-12 reservation on the same unit returns ERR_UNIT_UNAVAILABLE (409)."
        test_recipe:
          setup: ["a unit with a RESERVED rental 2026-07-10..2026-07-12"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "ov@x.com", full_name: "Ov" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /rental-units", payload: { name: "Board2", kind: "SURFBOARD", daily_rate_cents: 2500 }, as: ShopManager, captures: { u_id: "$.data.id" } }
            - { call: "POST /rentals", payload: { member_id: "${m_id}", unit_id: "${u_id}", start_date: "2026-07-10", end_date: "2026-07-12" }, as: Associate, captures: { r_id: "$.data.id" } }
          trigger:
            - { call: "POST /rentals", payload: { member_id: "${m_id}", unit_id: "${u_id}", start_date: "2026-07-11", end_date: "2026-07-13" }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_UNIT_UNAVAILABLE"

      - name: instructor_overlap_returns_unavailable
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INSTRUCTOR_UNAVAILABLE]"]
        distinguishing_aspect: "A lesson 10:30-11:30 overlapping an existing 10:00-11:00 lesson for the same instructor returns ERR_INSTRUCTOR_UNAVAILABLE (409)."
        test_recipe:
          setup: ["an instructor with a BOOKED lesson 2026-07-09T10:00:00Z..11:00:00Z"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "io@x.com", full_name: "IO" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /instructors", payload: { full_name: "Coach H", discipline: "SKATE" }, as: ShopManager, captures: { i_id: "$.data.id" } }
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SKATE", start_at: "2026-07-09T10:00:00Z", end_at: "2026-07-09T11:00:00Z", fee_cents: 5000 }, as: Associate, captures: { l1: "$.data.id" } }
          trigger:
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SKATE", start_at: "2026-07-09T10:30:00Z", end_at: "2026-07-09T11:30:00Z", fee_cents: 5000 }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INSTRUCTOR_UNAVAILABLE"

      - name: register_duplicate_returns_duplicate_registration
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_DUPLICATE_REGISTRATION]"]
        distinguishing_aspect: "Registering the same member twice for the same OPEN event (cost 0) returns ERR_DUPLICATE_REGISTRATION (409) on the second call."
        test_recipe:
          setup: ["an OPEN event cost 0; a member already REGISTERED"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "dup@x.com", full_name: "Dup" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /events", payload: { name: "Free Event", capacity: 10, entry_points_cost: 0 }, as: ShopManager, captures: { e_id: "$.data.id" } }
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m_id}" }, as: Associate, captures: { reg_id: "$.data.id" } }
          trigger:
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m_id}" }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_DUPLICATE_REGISTRATION"

      - name: register_event_full_returns_event_full
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_EVENT_FULL]"]
        distinguishing_aspect: "Registering a second member for a capacity-1 event already at registration_count 1 returns ERR_EVENT_FULL (409)."
        test_recipe:
          setup: ["a capacity-1 OPEN event cost 0 with one REGISTERED member"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "f1@x.com", full_name: "F1" }, as: ShopManager, captures: { m1: "$.data.id" } }
            - { call: "POST /members", payload: { email: "f2@x.com", full_name: "F2" }, as: ShopManager, captures: { m2: "$.data.id" } }
            - { call: "POST /events", payload: { name: "Tiny", capacity: 1, entry_points_cost: 0 }, as: ShopManager, captures: { e_id: "$.data.id" } }
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m1}" }, as: Associate }
          trigger:
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m2}" }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_EVENT_FULL"

      - name: register_insufficient_points_returns_error
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "A member with 0 points registering for an OPEN event cost 100 returns ERR_INSUFFICIENT_POINTS (402) — isolated (no state violation)."
        test_recipe:
          setup: ["a 0-point member; an OPEN event cost 100 cap 5"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "np@x.com", full_name: "NoPts" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /events", payload: { name: "Paid Event", capacity: 5, entry_points_cost: 100 }, as: ShopManager, captures: { e_id: "$.data.id" } }
          trigger:
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m_id}" }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INSUFFICIENT_POINTS"
            - "HTTP status == 402"

  # ---------------------------------------------------------------------- RBAC
  - section: rbac
    instances:
      - name: member_cannot_suspend_member_returns_unauthorized
        claim_type: rbac_denial
        grounds: [roles.Member, roles.ShopManager, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Member role calling POST /members/{id}/suspend (ShopManager-only) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["an ACTIVE member"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "rb1@x.com", full_name: "RB1" }, as: ShopManager, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "POST /members/${m_id}/suspend", payload: {}, as: Member, as_user_id: "${m_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: associate_cannot_appraise_tradein_returns_unauthorized
        claim_type: rbac_denial
        grounds: [roles.Associate, roles.ShopManager, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "Associate calling POST /trade-ins/{id}/appraise (ShopManager-exclusive) returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["a RECEIVED trade-in"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "rb2@x.com", full_name: "RB2" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /trade-ins", payload: { member_id: "${m_id}", description: "Old board" }, as: Associate, captures: { ti_id: "$.data.id" } }
          trigger:
            - { call: "POST /trade-ins/${ti_id}/appraise", payload: { appraised_value_cents: 100 }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_UNAUTHORIZED"

      - name: instructor_confirms_own_lesson_succeeds
        claim_type: rbac_permission
        grounds: [roles.Instructor, state_machines.Lesson.BOOKED_to_CONFIRMED]
        distinguishing_aspect: "Instructor (entity_backed) confirming their own BOOKED lesson (no linked rental) succeeds -> CONFIRMED."
        test_recipe:
          setup: ["an instructor with one BOOKED lesson, no linked rental"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "rb3@x.com", full_name: "RB3" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /instructors", payload: { full_name: "Coach I", discipline: "SURF" }, as: ShopManager, captures: { i_id: "$.data.id" } }
            - { call: "POST /lessons", payload: { member_id: "${m_id}", instructor_id: "${i_id}", discipline: "SURF", start_at: "2026-07-12T10:00:00Z", end_at: "2026-07-12T11:00:00Z", fee_cents: 5000 }, as: Associate, captures: { l_id: "$.data.id" } }
          trigger:
            - { call: "POST /lessons/${l_id}/confirm", payload: {}, as: Instructor, as_user_id: "${i_id}" }
          assert:
            - "Lesson.${l_id}.status == CONFIRMED"

  # ------------------------------------------- Cross-cutting complexity layers
  - section: cross_cutting_complexity_layers
    instances:
      - name: special_order_requote_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[special-order-requote-stale]", "errors[ERR_STALE_VERSION]", entities.SpecialOrder.fields.version]
        distinguishing_aspect: "After one quote advances SpecialOrder.version 1->2, a second quote carrying the stale expected_special_order_version 1 returns ERR_STALE_VERSION (412); a current version succeeds."
        test_recipe:
          setup: ["a REQUESTED special order (version 1) quoted once (version now 2)"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "occ@x.com", full_name: "OCC" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /special-orders", payload: { member_id: "${m_id}", product_name: "Custom trucks", qty: 1 }, as: Associate, captures: { so_id: "$.data.id", v0: "$.data.version" } }
            - { call: "POST /special-orders/${so_id}/quote", payload: { quoted_price_cents: 12000, expected_special_order_version: "${v0}" }, as: Associate, captures: { v1: "$.data.version" } }
          trigger:
            - { call: "POST /special-orders/${so_id}/quote", payload: { quoted_price_cents: 13000, expected_special_order_version: "${v0}" }, as: Associate, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: registration_count_reconciled_on_register
        claim_type: derived_field_reconciliation
        grounds: [entities.Event.fields.registration_count, state_machines.EventRegistration.null_to_REGISTERED]
        distinguishing_aspect: "Registering a member increments Event.registration_count 0->1 in the same request's event read."
        test_recipe:
          setup: ["an OPEN event cost 0 cap 5; a member"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "dfr@x.com", full_name: "DFR" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /events", payload: { name: "Count", capacity: 5, entry_points_cost: 0 }, as: ShopManager, captures: { e_id: "$.data.id" } }
          trigger:
            - { call: "POST /events/${e_id}/register", payload: { member_id: "${m_id}" }, as: Associate }
          assert:
            - "Event.${e_id}.registration_count == 1"

      - name: build_complete_consumes_reservation_no_available_drift
        claim_type: cascading_side_effects
        grounds: [state_machines.BoardBuild.SETUP_COMPLETE_to_COMPLETED, entities.Product.fields.stock_on_hand]
        distinguishing_aspect: "Completing a build converts reservation to consumption: on a product start on_hand 5/reserved 0, after reserve then complete on_hand 4, reserved 0, stock_available 4."
        test_recipe:
          setup: ["a SETUP_COMPLETE build reserving one unit of a stock-5 product; member ACTIVE"]
          setup_api_calls:
            - { call: "POST /products", payload: { sku: "CMP1", name: "Deck", category: "DECK", unit_price_cents: 6000, buildable_component: true, stock_on_hand: 5 }, as: ShopManager, captures: { p_id: "$.data.id" } }
            - { call: "POST /members", payload: { email: "cmp@x.com", full_name: "Cmp" }, as: ShopManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /board-builds", payload: { member_id: "${m_id}", component_lines: [ { product_id: "${p_id}", qty: 1 } ] }, as: Associate, captures: { build_id: "$.data.id" } }
            - { call: "POST /board-builds/${build_id}/reserve", payload: {}, as: Associate }
            - { call: "POST /board-builds/${build_id}/assemble", payload: {}, as: Associate }
            - { call: "POST /board-builds/${build_id}/setup", payload: {}, as: Associate }
          trigger:
            - { call: "POST /board-builds/${build_id}/complete", payload: {}, as: Associate }
          assert:
            - "Product.${p_id}.stock_on_hand == 4"
            - "Product.${p_id}.stock_reserved == 0"
            - "Product.${p_id}.stock_available == 4"

  # --------------------------------------------------------- Consistency model
  - section: consistency_model
    instances:
      - name: immediate_visibility_on_create
        claim_type: immediate
        grounds: [endpoints, entities.Member.fields.status]
        distinguishing_aspect: "A member created via POST /members is immediately readable via GET /members/{id} with status ACTIVE in the same session."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /members", payload: { email: "imm@x.com", full_name: "Imm" }, as: ShopManager, captures: { m_id: "$.data.id" } }
          trigger:
            - { call: "GET /members/${m_id}", payload: {}, as: Associate }
          assert:
            - "Member.${m_id}.status == ACTIVE"

