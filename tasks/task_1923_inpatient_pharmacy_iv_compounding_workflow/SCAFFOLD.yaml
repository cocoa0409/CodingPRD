  # --- logical clock (test-driving) ---
  - method: POST
    path: /pharmacy/_clock/set_current_utc
    description: "Set the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (server default; never falls back to wall-clock). Setting the clock runs the expiry sweeps: preparations with bud_expiry <= now in {COMPOUNDED, QA_PASSED} -> EXPIRED; protocols with expires_at <= now in ACTIVE -> EXPIRED."
    roles: [PharmacyAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: string }"
    side_effects: ["preparation expiry sweep", "protocol expiry sweep"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or empty X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per RBAC"
  - id: ERR_ROLE_MISMATCH
    http: 403
    condition: "Entity-backed role: staff member missing/inactive or staff_role does not match X-User-Role"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, wrong type, or enum value out of range"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body-referenced FK id does not resolve"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_<parent>_version does not match the parent's current version"
  - id: ERR_ORDER_ALREADY_TERMINAL
    http: 409
    condition: "Mutation attempted on an order whose verification is DISCONTINUED/SUPERSEDED or fulfillment is ADMINISTERED"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "State-machine from-state does not allow the attempted transition"
  - id: ERR_ALLERGY_CONFLICT
    http: 422
    condition: "Ordered or substitute drug appears in patient.allergy_drug_product_ids"
  - id: ERR_HD_CERTIFICATION_REQUIRED
    http: 422
    condition: "HD batch but compounder lacks HD certification or certification expired at the logical clock"
  - id: ERR_HOOD_NOT_HD_RATED
    http: 422
    condition: "HD batch but the session's hood is not is_hd_rated"
  - id: ERR_WITNESS_REQUIRED
    http: 422
    condition: "WASTE of a C_II drug without witness_staff_id"
  - id: ERR_WITNESS_SELF_FORBIDDEN
    http: 422
    condition: "witness_staff_id equals the recorder's X-User-ID"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "QA release/reject attempted by the batch's compounder (segregation of duties)"
  - id: ERR_NOT_ORDER_PRESCRIBER
    http: 403
    condition: "Discontinue attempted by a prescriber other than the ordering prescriber"
  - id: ERR_INVALID_QUANTITY
    http: 400
    condition: "units < 1, waste_ml < 0, or end_at <= start_at"
  - id: ERR_HOOD_OVERLAP
    http: 409
    condition: "New hood session's half-open interval overlaps a non-cancelled session on the same hood"
  - id: ERR_COVERAGE_CAP_EXCEEDED
    http: 409
    condition: "New coverage shift would create a 3-way overlap in the same zone"
  - id: ERR_POCKET_CAPACITY_EXCEEDED
    http: 422
    condition: "Restock would push on_hand_units above max_units"
  - id: ERR_INSUFFICIENT_STOCK
    http: 422
    condition: "Dispense/waste units exceed pocket on_hand_units"
  - id: ERR_DRUG_MISMATCH
    http: 422
    condition: "Order's drug does not match the pocket's drug"
  - id: ERR_WASTE_TOLERANCE_EXCEEDED
    http: 422
    condition: "Batch overage_pct exceeds the size-tier tolerance at QA release"
  - id: ERR_HOOD_SESSION_OUTSIDE_WINDOW
    http: 422
    condition: "Session start attempted with the logical clock outside [start_at, end_at)"
  - id: ERR_HOOD_SESSION_NOT_ACTIVE
    http: 409
    condition: "Batch start attempted while its hood session is not IN_USE"
  - id: ERR_BUD_EXPIRED
    http: 422
    condition: "Dispense attempted at or after the preparation's bud_expiry"
  - id: ERR_PROTOCOL_EXPIRED
    http: 422
    condition: "Activation attempted at or after protocol expires_at"
  - id: ERR_ORDER_NOT_VERIFIED
    http: 422
    condition: "Dispense or batch inclusion attempted on an order whose verification_status is not VERIFIED"
  - id: ERR_PREPARATION_NOT_QA_PASSED
    http: 422
    condition: "IV dispense attempted without a linked QA_PASSED preparation"
  - id: ERR_POCKET_QUARANTINED
    http: 409
    condition: "Dispense attempted on a QUARANTINED pocket"
  - id: ERR_DRUG_DISCONTINUED
    http: 422
    condition: "Verification attempted on an order whose drug is formulary-DISCONTINUED"
  - id: ERR_SUBSTITUTION_NOT_PENDING
    http: 422
    condition: "Substitution attempted on an order with substitution_pending == false"
  - id: ERR_NO_ACTIVE_PROTOCOL
    http: 422
    condition: "No ACTIVE protocol matches the order's current drug"
  - id: ERR_NO_ELIGIBLE_SUBSTITUTE
    http: 422
    condition: "The protocol's substitute drug is not formulary-ACTIVE (empty eligible pool)"
  - id: ERR_DRUG_NOT_IN_SHORTAGE
    http: 422
    condition: "Protocol activation attempted while the shortage drug has in_shortage == false"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PharmacyAdmin
    description: "Pharmacy system administrator; owns formulary, staff, patients, stations, protocols, coverage, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /pharmacy/staff"
      - "POST /pharmacy/patients ; PATCH /pharmacy/patients/{id}"
      - "POST /pharmacy/drug-products ; PATCH /pharmacy/drug-products/{id}"
      - "POST /pharmacy/hoods"
      - "POST /pharmacy/adc-stations ; POST /pharmacy/adc-stations/{id}/pockets"
      - "POST /pharmacy/substitution-protocols ; activate ; revoke"
      - "POST /pharmacy/coverage-shifts"
      - "POST /pharmacy/_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
  - name: Prescriber
    description: "Physician ordering medications; discontinues only own orders"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /pharmacy/medication-orders"
      - "POST /pharmacy/medication-orders/{id}/discontinue"
    shared_operations:
      - "all GET endpoints"
  - name: Pharmacist
    description: "Verification pharmacist and QA reviewer; cannot QA-release/reject a batch they compounded (SoD) and cannot witness their own waste"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /pharmacy/medication-orders/{id}/verify ; resume ; substitute"
      - "POST /pharmacy/medication-orders/{id}/interventions"
      - "POST /pharmacy/batches/{id}/qa-release ; qa-reject"
      - "POST /pharmacy/adc-pockets/{id}/count ; quarantine ; release-quarantine"
      - "POST /pharmacy/adc-pockets/{id}/waste (shared with PharmacyTechnician)"
      - "POST /pharmacy/discrepancy-cases/{id}/investigate ; resolve"
    shared_operations:
      - "all GET endpoints"
  - name: PharmacyTechnician
    description: "Compounding and restocking technician; cannot QA their own batch (SoD)"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /pharmacy/hood-sessions ; start ; complete ; cancel"
      - "POST /pharmacy/batches ; start ; complete ; rework"
      - "POST /pharmacy/adc-pockets/{id}/restock ; waste (waste shared with Pharmacist)"
    shared_operations:
      - "all GET endpoints"
  - name: Nurse
    description: "Administers and handles cabinet dispense/return"
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /pharmacy/adc-pockets/{id}/dispense ; return"
      - "POST /pharmacy/medication-orders/{id}/administer"
    shared_operations:
      - "all GET endpoints"
  - name: DiversionOfficer
    description: "Controlled-substance diversion investigator"
    identity: opaque
    exclusive_operations:
      - "POST /pharmacy/diversion-cases ; review ; adjudicate"
      - "POST /pharmacy/diversion-risk/evaluate"
    shared_operations:
      - "all GET endpoints"
