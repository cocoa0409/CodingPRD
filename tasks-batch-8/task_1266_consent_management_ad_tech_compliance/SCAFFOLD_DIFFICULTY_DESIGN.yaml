# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1266 consent & ad-tech compliance
# 9 difficulty rules x 2 instances each. All numeric asserts precomputed.
# Common clock baseline: server default 2026-05-01T00:00:00Z unless set.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: retention_pinned_vs_rolling_expiry
        grounds:
          - calculations.retention_expiry_dual
          - entities.ConsentRecord.fields.expires_at_pinned
          - entities.ConsentRecord.fields.expires_at_rolling
          - state_machines.ConsentRecord.GRANTED_to_EXPIRED
        distinguishing_aspect: |
          ConsentRecord domain: expiry has two valid computations — pinned snapshot
          (authoritative, drives EXPIRED) vs rolling live-policy value. After a
          retention_days amendment 30 -> 10, pinned stays 2026-06-09 while rolling
          becomes 2026-05-20; at clock 2026-05-21 the record is still GRANTED
          because pinned (not rolling) is authoritative.
        test_recipe:
          setup:
            - "Property P (SELLS_AND_SHARES); ACTIVE policy EU-GDPR OPT_IN_REQUIRED min_age 16 retention_days 30 gpc_honored true window [2026-01-01, 2027-01-01)"
            - "Adult visitor (birthdate 2000-01-01) with GRANTED ANALYTICS record created at 2026-05-10T00:00:00Z (snapshot 30 days)"
            - "Policy retention_days later amended to 10"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Retention Site", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "rv1@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "2000-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { rec: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { retention_days: 10 }, as: PrivacyAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-21T00:00:00Z" }, as: PrivacyAdmin }
          trigger:
            - { call: "GET /v1/consent-records/${rec}", as: Any }
          assert:
            - "ConsentRecord.${rec}.expires_at_pinned == '2026-06-09T00:00:00Z' (last_changed 2026-05-10 + 30d snapshot)"
            - "ConsentRecord.${rec}.expires_at_rolling == '2026-05-20T00:00:00Z' (last_changed + live 10d)"
            - "ConsentRecord.${rec}.expires_at_pinned != ConsentRecord.${rec}.expires_at_rolling"
            - "ConsentRecord.${rec}.status == GRANTED at 2026-05-21 — rolling horizon passed but pinned is authoritative"
            - "ConsentRecord.${rec}.policy_snapshot_retention_days == 30"

      - name: vendor_risk_strict_vs_weighted
        grounds:
          - calculations.vendor_risk_scores
          - entities.Vendor.fields.risk_score_strict
          - entities.Vendor.fields.risk_score_weighted
          - state_machines.TrackerFinding.OPEN_to_CONFIRMED_VIOLATION
        distinguishing_aspect: |
          Vendor domain (different entity domain than retention): two scoring
          variants over identical finding data — binary any-violation strict score
          vs severity-weighted capped score. One CONFIRMED_VIOLATION MEDIUM finding
          yields strict == 100 but weighted == 25; before confirmation the same
          OPEN finding yields strict == 0 but weighted == 25.
        test_recipe:
          setup:
            - "Property P; vendor V APPROVED with tracker_signatures ['trk-a.com'], declared_purposes [ADVERTISING]"
            - "Scan by auditor aud-1 run observing trk-a.com under ANALYTICS (purpose mismatch -> MEDIUM finding on V) and rogue-x.com (unauthorized -> HIGH, vendor null)"
            - "Then aud-2 confirms the MEDIUM finding as violation"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Risk Site", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "AdCorp", declared_purposes: ["ADVERTISING"], tracker_signatures: ["trk-a.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/tag-audit-scans", payload: { property_id: "${prop}", scheduled_start: "2026-06-01T10:00:00Z", duration_minutes: 60 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { scan: $.data.id } }
            - { call: "POST /v1/tag-audit-scans/${scan}/run", payload: { observed_trackers: [{ tracker_signature: "trk-a.com", purpose_category: "ANALYTICS" }, { tracker_signature: "rogue-x.com", purpose_category: "ADVERTISING" }] }, as: ComplianceAuditor, as_user_id: "aud-1" }
            - { call: "GET /v1/tag-audit-scans/${scan}/findings", as: Any, captures: { f_mismatch: "$.data[0].id" } }
            - { call: "GET /v1/vendors/${vend}", as: Any, captures: { strict_open: $.data.risk_score_strict, weighted_open: $.data.risk_score_weighted } }
            - { call: "PUT /v1/tracker-findings/${f_mismatch}", payload: { status: "CONFIRMED_VIOLATION" }, as: ComplianceAuditor, as_user_id: "aud-2" }
          trigger:
            - { call: "GET /v1/vendors/${vend}", as: Any }
          assert:
            - "Vendor.${vend}.risk_score_strict == 100 (a CONFIRMED_VIOLATION exists)"
            - "Vendor.${vend}.risk_score_weighted == 25 (single MEDIUM weight; HIGH finding has vendor_id null and does not count)"
            - "Before confirmation: strict_open == 0 and weighted_open == 25 (same OPEN finding flips strict only)"
            - "TagAuditScan.${scan}.findings_created_count == 2 and unauthorized_findings_count == 1"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: consent_resolution_waterfall_branches
        grounds:
          - calculations.effective_consent_resolution
          - entities.VisitorProfile.fields.gpc_effective
          - entities.VisitorProfile.fields.age_status
        distinguishing_aspect: |
          Mode (a): waterfall with >= 3 interacting inputs (age_status, gpc signal
          vs record timestamps, banner_regime) and conditional branches; distinct
          inputs select BLOCKED_CHILD / ALWAYS_GRANTED / FORCED_OPT_OUT /
          DENIED_BY_DEFAULT / GRANTED_BY_DEFAULT on the same preview endpoint.
        test_recipe:
          setup:
            - "Property P; ACTIVE policy US-CA OPT_IN_REQUIRED min_age 16 retention 30 gpc_honored true window [2026-01-01, 2027-01-01)"
            - "Visitor A: ADULT (2000-01-01). Visitor C: CHILD (2015-06-01). Visitor G: ADULT with GPC ON"
            - "Clock 2026-05-10T00:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Preview Site", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "adult@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { visA: $.data.id } }
            - { call: "POST /v1/visitors/${visA}/age-attestation", payload: { attested_birthdate: "2000-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${visA}" }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "child@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { visC: $.data.id } }
            - { call: "POST /v1/visitors/${visC}/age-attestation", payload: { attested_birthdate: "2015-06-01T00:00:00Z" }, as: Visitor, as_user_id: "${visC}" }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "gpc@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { visG: $.data.id } }
            - { call: "POST /v1/visitors/${visG}/age-attestation", payload: { attested_birthdate: "1990-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${visG}" }
            - { call: "POST /v1/visitors/${visG}/gpc-signals", payload: { signal: "ON" }, as: Visitor, as_user_id: "${visG}" }
          trigger:
            - { call: "GET /v1/visitors/${visC}/consent-preview", payload: { purpose_category: "ADVERTISING" }, as: Any, captures: { dec_child: $.data.decision } }
            - { call: "GET /v1/visitors/${visA}/consent-preview", payload: { purpose_category: "NECESSARY" }, as: Any, captures: { dec_nec: $.data.decision } }
            - { call: "GET /v1/visitors/${visA}/consent-preview", payload: { purpose_category: "ANALYTICS" }, as: Any, captures: { dec_optin: $.data.decision } }
            - { call: "GET /v1/visitors/${visG}/consent-preview", payload: { purpose_category: "SALE_SHARE" }, as: Any, captures: { dec_gpc: $.data.decision } }
            - { call: "GET /v1/visitors/${visG}/consent-preview", payload: { purpose_category: "ANALYTICS" }, as: Any, captures: { dec_gpc_ana: $.data.decision } }
          assert:
            - "dec_child == BLOCKED_CHILD (CHILD + non-NECESSARY short-circuits everything)"
            - "dec_nec == ALWAYS_GRANTED (NECESSARY bypasses regime)"
            - "dec_optin == DENIED_BY_DEFAULT (OPT_IN_REQUIRED, no record)"
            - "dec_gpc == FORCED_OPT_OUT (GPC ON + gpc_honored + SALE_SHARE, no later explicit grant)"
            - "dec_gpc_ana == DENIED_BY_DEFAULT (GPC does not touch ANALYTICS; falls to OPT_IN_REQUIRED default)"

      - name: sweep_penalty_round_per_finding_then_sum
        grounds:
          - calculations.sweep_penalty_exposure_cents
          - entities.RegulatorySweep.fields.penalty_exposure_cents
          - state_machines.RegulatorySweep.OPEN_to_ESCALATED
        distinguishing_aspect: |
          Mode (b) nested rounding (different mode than the waterfall): penalty
          rounds each finding to whole cents THEN sums — pinned order. Two MEDIUM
          findings open exactly 4 days: per-finding round_half_up(77777 x 1.2)
          = 93332; total 186664. Sum-then-round would give
          round_half_up(186664.8) = 186665 — a different number.
        test_recipe:
          setup:
            - "Property P; APPROVED vendor V declaring signatures ['bad-1.com','bad-2.com'] for ADVERTISING"
            - "Scan run at clock 2026-05-01T00:00:00Z observing both signatures under ANALYTICS -> two PURPOSE_MISMATCH MEDIUM findings, created_at 2026-05-01"
            - "Both findings CONFIRMED_VIOLATION by a second auditor"
            - "Clock advanced to exactly 2026-05-05T00:00:00Z (4.000 days later); sweep escalated at that instant -> days_open == 4"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Penalty Site", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "MismatchCo", declared_purposes: ["ADVERTISING"], tracker_signatures: ["bad-1.com", "bad-2.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/tag-audit-scans", payload: { property_id: "${prop}", scheduled_start: "2026-05-01T09:00:00Z", duration_minutes: 30 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { scan: $.data.id } }
            - { call: "POST /v1/tag-audit-scans/${scan}/run", payload: { observed_trackers: [{ tracker_signature: "bad-1.com", purpose_category: "ANALYTICS" }, { tracker_signature: "bad-2.com", purpose_category: "ANALYTICS" }] }, as: ComplianceAuditor, as_user_id: "aud-1" }
            - { call: "GET /v1/tag-audit-scans/${scan}/findings", as: Any, captures: { f1: "$.data[0].id", f2: "$.data[1].id" } }
            - { call: "PUT /v1/tracker-findings/${f1}", payload: { status: "CONFIRMED_VIOLATION" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "PUT /v1/tracker-findings/${f2}", payload: { status: "CONFIRMED_VIOLATION" }, as: ComplianceAuditor, as_user_id: "aud-2" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-05T00:00:00Z" }, as: PrivacyAdmin }
            - { call: "POST /v1/regulatory-sweeps", payload: { property_id: "${prop}", regulator_ref: "AG-2026-041", jurisdiction_code: "US-CA", deadline_days: 30 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { sweep: $.data.id } }
          trigger:
            - { call: "POST /v1/regulatory-sweeps/${sweep}/escalate", as: ComplianceAuditor, as_user_id: "aud-1" }
          assert:
            - "RegulatorySweep.${sweep}.penalty_exposure_cents == 186664 (per-finding round_half_up(93332.4)=93332 twice, then summed)"
            - "penalty_exposure_cents != 186665 (sum-then-round ordering is wrong)"
            - "RegulatorySweep.${sweep}.status == ESCALATED"
            - "Property.${prop}.posture == FROZEN (escalation cascade link 1)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: consent_record_grant_withdraw_cycle
        grounds:
          - state_machines.ConsentRecord.GRANTED_to_WITHDRAWN
          - state_machines.ConsentRecord.WITHDRAWN_to_GRANTED
          - calculations.granted_purpose_count_sync
        distinguishing_aspect: |
          ConsentRecord is cyclic (GRANTED -> WITHDRAWN -> GRANTED -> WITHDRAWN),
          not a pipeline: the same row loops, refreshing snapshot/timestamps on
          each regrant, and the property counter tracks each lap.
        test_recipe:
          setup:
            - "Property P; ACTIVE policy EU-GDPR OPT_IN_REQUIRED min_age 16 retention 30 gpc_honored false, window covering 2026"
            - "ADULT visitor; clock 2026-05-10T00:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Cycle Site", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "cyc@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1995-03-03T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { rec: $.data.id } }
          trigger:
            - { call: "POST /v1/consent-records/${rec}/withdraw", as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/consent-records/${rec}/regrant", as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/consent-records/${rec}/withdraw", as: Visitor, as_user_id: "${vis}" }
            - { call: "GET /v1/properties/${prop}", as: Any, captures: { cnt: $.data.granted_purpose_count } }
          assert:
            - "ConsentRecord.${rec}.status == WITHDRAWN after the second withdraw (loop completed)"
            - "ConsentRecord.${rec}.source_of_decision == EXPLICIT_WITHDRAW"
            - "Property.${prop}.granted_purpose_count == 0 (1 grant, +1 regrant, -2 withdraws)"
            - "Regrant refreshed policy_snapshot_retention_days == 30 and status returned to GRANTED before final withdraw"

      - name: dns_parallel_dimensions_with_retry_cycle
        grounds:
          - state_machines.DoNotSellRequest
          - state_machines.VendorPropagation.FAILED_to_PENDING
          - calculations.propagation_counters
        distinguishing_aspect: |
          DoNotSellRequest carries two parallel state dimensions (verification x
          propagation) on one entity — different entity than ConsentRecord —
          and propagation contains a FAILED -> PENDING retry cycle: propagate is
          rejected while UNVERIFIED even though propagation is independently
          NOT_STARTED; retry loops PARTIAL_FAILURE back to PROPAGATING.
        test_recipe:
          setup:
            - "Property P (SELLS_AND_SHARES); APPROVED vendor V declared [SALE_SHARE]"
            - "Visitor U; request created (UNVERIFIED / NOT_STARTED)"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "DNS Site", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "SellCo", declared_purposes: ["SALE_SHARE"], tracker_signatures: ["sell-1.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "dns@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/do-not-sell-requests", payload: {}, as: Visitor, as_user_id: "${vis}", captures: { req: $.data.id } }
            - { call: "POST /v1/do-not-sell-requests/${req}/propagate", as: PrivacyAdmin, captures: { early_err: $.data.error_id } }
            - { call: "PUT /v1/do-not-sell-requests/${req}", payload: { verification_status: "VERIFIED" }, as: PrivacyAdmin }
            - { call: "POST /v1/do-not-sell-requests/${req}/propagate", as: PrivacyAdmin }
            - { call: "GET /v1/do-not-sell-requests/${req}/propagations", as: Any, captures: { prop1: "$.data[0].id" } }
          trigger:
            - { call: "PUT /v1/vendor-propagations/${prop1}", payload: { status: "FAILED" }, as: VendorManager, captures: { st_fail: $.data.status } }
            - { call: "GET /v1/do-not-sell-requests/${req}", as: Any, captures: { dim_partial: $.data.propagation_status } }
            - { call: "PUT /v1/vendor-propagations/${prop1}", payload: { status: "PENDING" }, as: VendorManager, captures: { att: $.data.attempts } }
            - { call: "GET /v1/do-not-sell-requests/${req}", as: Any, captures: { dim_back: $.data.propagation_status } }
            - { call: "PUT /v1/vendor-propagations/${prop1}", payload: { status: "CONFIRMED" }, as: VendorManager }
            - { call: "GET /v1/do-not-sell-requests/${req}", as: Any, captures: { dim_done: $.data.propagation_status } }
          assert:
            - "early_err == ERR_DNS_INVALID_STATE (propagate rejected while verification UNVERIFIED; dimensions gate independently)"
            - "dim_partial == PARTIAL_FAILURE after the single propagation FAILED (pending 0, failed 1)"
            - "att == 2 after retry and dim_back == PROPAGATING (FAILED -> PENDING cycle)"
            - "dim_done == ALL_CONFIRMED after confirm; verification_status stayed VERIFIED throughout (dimensions independent)"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: gpc_signal_cascade_depth3
        grounds:
          - state_machines.ConsentRecord.GRANTED_to_WITHDRAWN
          - entities.VisitorProfile.fields.sale_share_opted_out
          - calculations.granted_purpose_count_sync
        distinguishing_aspect: |
          Trigger = POST gpc-signals {ON}. Depth 3 chain: signal flips
          visitor.sale_share_opted_out (link 1); that flag mutation withdraws the
          visitor's GRANTED SALE_SHARE records (link 2, AUTO_GPC_WITHDRAW); each
          withdrawal decrements Property.granted_purpose_count and bumps
          Property.version (link 3). ADVERTISING records on the same visitor are
          untouched.
        test_recipe:
          setup:
            - "Property P; ACTIVE policy US-CA OPT_OUT_ALLOWED min_age 16 retention 30 gpc_honored true, window covering"
            - "ADULT visitor with GRANTED SALE_SHARE and GRANTED ADVERTISING records (count == 2)"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "GPC Site", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_OUT_ALLOWED", min_consent_age: 16, retention_days: 30, gpc_honored: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "g@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1988-07-07T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "SALE_SHARE" }, as: Visitor, as_user_id: "${vis}", captures: { rec_sale: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ADVERTISING" }, as: Visitor, as_user_id: "${vis}", captures: { rec_adv: $.data.id } }
          trigger:
            - { call: "POST /v1/visitors/${vis}/gpc-signals", payload: { signal: "ON" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "GET /v1/visitors/${vis}", as: Any, captures: { opted: $.data.sale_share_opted_out, gpc_now: $.data.gpc_effective } }
            - { call: "GET /v1/consent-records/${rec_sale}", as: Any, captures: { sale_st: $.data.status, sale_src: $.data.source_of_decision } }
            - { call: "GET /v1/consent-records/${rec_adv}", as: Any, captures: { adv_st: $.data.status } }
            - { call: "GET /v1/properties/${prop}", as: Any, captures: { cnt: $.data.granted_purpose_count } }
          assert:
            - "opted == true and gpc_now == ON (link 1)"
            - "sale_st == WITHDRAWN and sale_src == AUTO_GPC_WITHDRAW (link 2 caused by the flag flip, not the endpoint directly)"
            - "adv_st == GRANTED (cascade is scoped to SALE_SHARE only)"
            - "cnt == 1 (2 grants - 1 cascaded withdrawal; link 3 ledger sync)"

      - name: sweep_escalation_cascade_depth3
        grounds:
          - state_machines.RegulatorySweep.OPEN_to_ESCALATED
          - state_machines.ConsentBannerConfig.PUBLISHED_to_SUPPRESSED
          - state_machines.TagRule.ENABLED_to_DISABLED
        distinguishing_aspect: |
          Different trigger than GPC: POST regulatory-sweeps/{id}/escalate.
          Depth 3 chain: escalation flips Property.posture to FROZEN (link 1);
          FROZEN suppresses the property's PUBLISHED banner config (link 2); the
          suppression disables the config's ENABLED tag rules (link 3) — each hop
          caused by the previous mutation, not by the endpoint.
        test_recipe:
          setup:
            - "Property P; ACTIVE policy US-CA (window covering); banner config C PUBLISHED for US-CA; APPROVED vendor V; ENABLED tag rule R on (C, ADVERTISING, V)"
            - "Sweep S OPEN"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Cascade Site", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id, prop_v: $.data.version } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_OUT_ALLOWED", min_consent_age: 16, retention_days: 30, gpc_honored: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", categories_shown: ["ADVERTISING", "SALE_SHARE"], config_label: "v1" }, as: PrivacyAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /v1/banner-configs/${cfg}/publish", payload: { expected_property_version: "${prop_v}" }, as: PrivacyAdmin }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "TagCo", declared_purposes: ["ADVERTISING"], tracker_signatures: ["tag-1.com"] }, as: VendorManager, captures: { vend: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/tag-rules", payload: { vendor_id: "${vend}", banner_config_id: "${cfg}", purpose_category: "ADVERTISING" }, as: VendorManager, captures: { rule: $.data.id } }
            - { call: "POST /v1/regulatory-sweeps", payload: { property_id: "${prop}", regulator_ref: "FTC-9", jurisdiction_code: "US-CA", deadline_days: 30 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { sweep: $.data.id } }
          trigger:
            - { call: "POST /v1/regulatory-sweeps/${sweep}/escalate", as: ComplianceAuditor, as_user_id: "aud-1" }
            - { call: "GET /v1/properties/${prop}", as: Any, captures: { posture: $.data.posture } }
            - { call: "GET /v1/banner-configs/${cfg}", as: Any, captures: { cfg_st: $.data.status } }
            - { call: "GET /v1/tag-rules/${rule}", as: Any, captures: { rule_st: $.data.status } }
          assert:
            - "posture == FROZEN (link 1)"
            - "cfg_st == SUPPRESSED (link 2 caused by posture flip)"
            - "rule_st == DISABLED (link 3 caused by config suppression)"
            - "RegulatorySweep.${sweep}.status == ESCALATED and escalated_at == current clock"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: frozen_state_beats_child_safety_on_consent_grant
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - state_machines.RegulatorySweep.OPEN_to_ESCALATED
        distinguishing_aspect: |
          Error-category pair (state vs business_safety): the consent grant fails
          BOTH the FROZEN posture gate (p5) and the CHILD non-NECESSARY safety
          gate (p8); the higher-priority state error ERR_PROPERTY_FROZEN must win.
        test_recipe:
          setup:
            - "Property P; ACTIVE policy US-CA min_age 16 window covering; CHILD visitor (birthdate 2015-06-01, attested while NORMAL)"
            - "Sweep escalated -> property FROZEN"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Frozen Site", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_OUT_ALLOWED", min_consent_age: 16, retention_days: 30, gpc_honored: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "kid@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "2015-06-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/regulatory-sweeps", payload: { property_id: "${prop}", regulator_ref: "AG-1", jurisdiction_code: "US-CA", deadline_days: 30 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { sweep: $.data.id } }
            - { call: "POST /v1/regulatory-sweeps/${sweep}/escalate", as: ComplianceAuditor, as_user_id: "aud-1" }
          trigger:
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ADVERTISING" }, as: Visitor, as_user_id: "${vis}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_PROPERTY_FROZEN (state p5 outranks business_safety p8)"
            - "err != ERR_CHILD_CONSENT_FORBIDDEN although the child-safety check would also fail"

      - name: cross_property_reference_beats_duplicate_tag_rule
        grounds:
          - validations[priority=10]
          - validations[priority=14]
        distinguishing_aspect: |
          Different error-category pair (business_referential vs
          business_constraint): the tag-rule create fails BOTH the cross-property
          vendor reference check (p10) and the (banner_config_id, purpose)
          uniqueness constraint (p14); ERR_CROSS_PROPERTY_REFERENCE must win.
        test_recipe:
          setup:
            - "Properties P1, P2; vendor V1 in P1 APPROVED; config C1 in P1 (DRAFT ok); tag rule already exists on (C1, ANALYTICS) via V1"
            - "Vendor V2 in P2 APPROVED (cross-property relative to C1)"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "P1", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { p1: $.data.id } }
            - { call: "POST /v1/properties", payload: { name: "P2", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { p2: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${p1}", legal_name: "V1", declared_purposes: ["ANALYTICS"], tracker_signatures: ["v1.com"] }, as: VendorManager, captures: { v1: $.data.id } }
            - { call: "POST /v1/vendors/${v1}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/vendors", payload: { property_id: "${p2}", legal_name: "V2", declared_purposes: ["ANALYTICS"], tracker_signatures: ["v2.com"] }, as: VendorManager, captures: { v2: $.data.id } }
            - { call: "POST /v1/vendors/${v2}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${p1}", jurisdiction_code: "US-CA", categories_shown: ["ANALYTICS"], config_label: "c1" }, as: PrivacyAdmin, captures: { c1: $.data.id } }
            - { call: "POST /v1/tag-rules", payload: { vendor_id: "${v1}", banner_config_id: "${c1}", purpose_category: "ANALYTICS" }, as: VendorManager }
          trigger:
            - { call: "POST /v1/tag-rules", payload: { vendor_id: "${v2}", banner_config_id: "${c1}", purpose_category: "ANALYTICS" }, as: VendorManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CROSS_PROPERTY_REFERENCE (referential p10 outranks constraint p14)"
            - "err != ERR_DUPLICATE_TAG_RULE although (C1, ANALYTICS) is already taken"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: age_gate_exact_min_age_birthday
        grounds:
          - calculations.age_years_at_attestation
          - entities.VisitorProfile.fields.age_status
        distinguishing_aspect: |
          Metric = integer age in years; endpoint = POST age-attestation. The
          comparator is <=: a visitor whose 16th birthday is exactly the clock
          date is ADULT, one day younger is CHILD.
        test_recipe:
          setup:
            - "Property P; ACTIVE policy US-CA min_consent_age 16 window covering; clock pinned to 2026-05-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Age Site", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_OUT_ALLOWED", min_consent_age: 16, retention_days: 30, gpc_honored: true, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "exact@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { visA: $.data.id } }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "minus1@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { visB: $.data.id } }
          trigger:
            - { call: "POST /v1/visitors/${visA}/age-attestation", payload: { attested_birthdate: "2010-05-01T00:00:00Z" }, as: Visitor, as_user_id: "${visA}", captures: { stA: $.data.age_status } }
            - { call: "POST /v1/visitors/${visB}/age-attestation", payload: { attested_birthdate: "2010-05-02T00:00:00Z" }, as: Visitor, as_user_id: "${visB}", captures: { stB: $.data.age_status } }
          assert:
            - "stA == ADULT (birthdate + 16 years == clock date exactly; <= boundary qualifies)"
            - "stB == CHILD (one day short of the 16th birthday)"

      - name: retention_expiry_exact_instant
        grounds:
          - calculations.retention_expiry_dual
          - state_machines.ConsentRecord.GRANTED_to_EXPIRED
        distinguishing_aspect: |
          Different metric (timestamp, not integer age) on a different endpoint
          (GET /v1/consent-records/{id}, not age-attestation): the record is
          GRANTED one second before expires_at_pinned and EXPIRED at exactly the
          expiry instant (now >= expiry).
        test_recipe:
          setup:
            - "Property P; ACTIVE policy EU-GDPR retention_days 30 window covering; ADULT visitor"
            - "Record granted at 2026-05-01T00:00:00Z -> expires_at_pinned 2026-05-31T00:00:00Z"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Expiry Site", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "exp@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1990-01-01T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { rec: $.data.id } }
          trigger:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-30T23:59:59Z" }, as: PrivacyAdmin }
            - { call: "GET /v1/consent-records/${rec}", as: Any, captures: { st_before: $.data.status, exp: $.data.expires_at_pinned } }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: PrivacyAdmin }
            - { call: "GET /v1/consent-records/${rec}", as: Any, captures: { st_at: $.data.status, src_at: $.data.source_of_decision } }
          assert:
            - "exp == '2026-05-31T00:00:00Z'"
            - "st_before == GRANTED (one second before expiry)"
            - "st_at == EXPIRED at exactly the expiry instant (>= semantics) and src_at == EXPIRY"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: tag_rule_gated_by_vendor_approval
        grounds:
          - validations[priority=10.5]
          - state_machines.Vendor.PENDING_REVIEW_to_APPROVED
          - state_machines.TagRule.DISABLED_to_ENABLED
        distinguishing_aspect: |
          Entity pair TagRule -> Vendor: create is rejected while the vendor is
          PENDING_REVIEW, succeeds after approve; and after a suspend cascade the
          DISABLED rule cannot be re-enabled while the vendor is SUSPENDED.
        test_recipe:
          setup:
            - "Property P; vendor V PENDING_REVIEW; banner config C (DRAFT is sufficient for rule creation)"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Gate Site", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", categories_shown: ["ADVERTISING"], config_label: "c1" }, as: PrivacyAdmin, captures: { cfg: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "GateCo", declared_purposes: ["ADVERTISING"], tracker_signatures: ["gate-1.com"] }, as: VendorManager, captures: { vend: $.data.id } }
          trigger:
            - { call: "POST /v1/tag-rules", payload: { vendor_id: "${vend}", banner_config_id: "${cfg}", purpose_category: "ADVERTISING" }, as: VendorManager, captures: { err1: $.data.error_id } }
            - { call: "POST /v1/vendors/${vend}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/tag-rules", payload: { vendor_id: "${vend}", banner_config_id: "${cfg}", purpose_category: "ADVERTISING" }, as: VendorManager, captures: { rule: $.data.id } }
            - { call: "POST /v1/vendors/${vend}/suspend", as: PrivacyAdmin }
            - { call: "GET /v1/tag-rules/${rule}", as: Any, captures: { st_mid: $.data.status } }
            - { call: "PUT /v1/tag-rules/${rule}", payload: { status: "ENABLED" }, as: VendorManager, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_VENDOR_NOT_APPROVED (create blocked by PENDING_REVIEW vendor)"
            - "TagRule.${rule}.status == ENABLED after approval"
            - "st_mid == DISABLED (suspend cascade)"
            - "err2 == ERR_VENDOR_NOT_APPROVED (re-enable blocked while vendor SUSPENDED)"

      - name: banner_publish_gated_by_active_policy
        grounds:
          - validations[priority=9]
          - validations[priority=11]
          - state_machines.ConsentBannerConfig.DRAFT_to_PUBLISHED
        distinguishing_aspect: |
          Different entity pair (ConsentBannerConfig -> JurisdictionPolicy):
          publish is rejected with ERR_NO_ACTIVE_POLICY when the jurisdiction has
          only a DRAFT policy, and with ERR_POLICY_OUTSIDE_COVERAGE_WINDOW when an
          ACTIVE policy exists but the clock has passed its effective_to.
        test_recipe:
          setup:
            - "Property P; policy US-CA DRAFT only (never activated); config C1 for US-CA"
            - "Second jurisdiction EU-GDPR: policy ACTIVE with window [2026-01-01, 2026-03-01) — already expired at clock 2026-05-01; config C2 for EU-GDPR"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "PubGate Site", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id, prop_v: $.data.version } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol_draft: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-03-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol_exp: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol_exp}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", categories_shown: ["ANALYTICS"], config_label: "c1" }, as: PrivacyAdmin, captures: { c1: $.data.id } }
            - { call: "POST /v1/banner-configs", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", categories_shown: ["ANALYTICS"], config_label: "c2" }, as: PrivacyAdmin, captures: { c2: $.data.id } }
          trigger:
            - { call: "POST /v1/banner-configs/${c1}/publish", payload: { expected_property_version: "${prop_v}" }, as: PrivacyAdmin, captures: { err1: $.data.error_id } }
            - { call: "POST /v1/banner-configs/${c2}/publish", payload: { expected_property_version: "${prop_v}" }, as: PrivacyAdmin, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_NO_ACTIVE_POLICY (only a DRAFT policy exists for US-CA)"
            - "err2 == ERR_POLICY_OUTSIDE_COVERAGE_WINDOW (ACTIVE policy but clock 2026-05-01 >= effective_to 2026-03-01)"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: policy_window_half_open_adjacency_allowed
        grounds:
          - validations[priority=13]
          - entities.JurisdictionPolicy.fields.effective_from
        distinguishing_aspect: |
          Resource = JurisdictionPolicy, interval semantics = half-open
          [from, to): a policy starting exactly at the predecessor's effective_to
          is adjacent (gap 0) and allowed, while a one-day-earlier start overlaps
          and is rejected.
        test_recipe:
          setup:
            - "Property P; ACTIVE policy A US-CA window [2026-01-01, 2026-06-01)"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Window Site", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }, as: PrivacyAdmin, captures: { polA: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${polA}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-06-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { polB: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "US-CA", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-05-31T00:00:00Z", effective_to: "2026-12-01T00:00:00Z" }, as: PrivacyAdmin, captures: { polC: $.data.id } }
          trigger:
            - { call: "PUT /v1/jurisdiction-policies/${polB}", payload: { status: "ACTIVE" }, as: PrivacyAdmin, captures: { stB: $.data.status } }
            - { call: "PUT /v1/jurisdiction-policies/${polC}", payload: { status: "ACTIVE" }, as: PrivacyAdmin, captures: { errC: $.data.error_id } }
          assert:
            - "stB == ACTIVE (effective_from 2026-06-01 == A.effective_to: half-open adjacency is not an overlap)"
            - "errC == ERR_POLICY_WINDOW_OVERLAP (2026-05-31 start intersects A's window by one day)"

      - name: scan_cooldown_buffer_edge
        grounds:
          - validations[priority=12]
          - entities.TagAuditScan.fields.scheduled_start
        distinguishing_aspect: |
          Different resource (TagAuditScan) with different interval semantics
          (cooldown-buffer expansion, not half-open adjacency): a scan starting
          exactly SCAN_COOLDOWN_MINUTES (120) after the previous scan's end is
          allowed, one minute earlier conflicts — plain adjacency (gap 0) would
          be illegal here, opposite of the policy rule.
        test_recipe:
          setup:
            - "Property P; scan A scheduled [2026-06-10T10:00:00Z, +60min) -> raw end 11:00"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Scan Site", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/tag-audit-scans", payload: { property_id: "${prop}", scheduled_start: "2026-06-10T10:00:00Z", duration_minutes: 60 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { scanA: $.data.id } }
          trigger:
            - { call: "POST /v1/tag-audit-scans", payload: { property_id: "${prop}", scheduled_start: "2026-06-10T12:59:00Z", duration_minutes: 60 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { errC: $.data.error_id } }
            - { call: "POST /v1/tag-audit-scans", payload: { property_id: "${prop}", scheduled_start: "2026-06-10T13:00:00Z", duration_minutes: 60 }, as: ComplianceAuditor, as_user_id: "aud-1", captures: { scanB: $.data.id } }
          assert:
            - "errC == ERR_SCAN_WINDOW_CONFLICT (12:59 start: expanded window [10:59, 14:59) intersects A's raw [10:00, 11:00))"
            - "scanB created successfully (13:00 start: expanded start 11:00 == A end, not strictly intersecting — buffer edge allowed)"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: grant_withdraw_regrant_counter_conservation
        grounds:
          - calculations.granted_purpose_count_sync
          - entities.Property.fields.granted_purpose_count
          - state_machines.ConsentRecord.GRANTED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = effective-grant cardinality:
          Property.granted_purpose_count must always equal the number of GRANTED
          ConsentRecords; a grant+withdraw pair nets to zero and a withdraw+regrant
          pair nets to zero, verified against an independent filtered recount.
        test_recipe:
          setup:
            - "Property P; ACTIVE policy EU-GDPR OPT_IN_REQUIRED min_age 16 retention 30 gpc_honored false window covering; ADULT visitor"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Invariant Site", sale_share_designation: "NO_SALE_NO_SHARE" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/jurisdiction-policies", payload: { property_id: "${prop}", jurisdiction_code: "EU-GDPR", banner_regime: "OPT_IN_REQUIRED", min_consent_age: 16, retention_days: 30, gpc_honored: false, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z" }, as: PrivacyAdmin, captures: { pol: $.data.id } }
            - { call: "PUT /v1/jurisdiction-policies/${pol}", payload: { status: "ACTIVE" }, as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "inv@x.com", jurisdiction_code: "EU-GDPR" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/age-attestation", payload: { attested_birthdate: "1985-09-09T00:00:00Z" }, as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ANALYTICS" }, as: Visitor, as_user_id: "${vis}", captures: { r1: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/consent-records", payload: { purpose_category: "ADVERTISING" }, as: Visitor, as_user_id: "${vis}", captures: { r2: $.data.id } }
          trigger:
            - { call: "POST /v1/consent-records/${r1}/withdraw", as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/consent-records/${r1}/regrant", as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/consent-records/${r1}/withdraw", as: Visitor, as_user_id: "${vis}" }
            - { call: "POST /v1/consent-records/${r2}/withdraw", as: Visitor, as_user_id: "${vis}" }
            - { call: "GET /v1/properties/${prop}", as: Any, captures: { cnt: $.data.granted_purpose_count } }
            - { call: "GET /v1/visitors/${vis}/consent-records", payload: { status: "GRANTED" }, as: Any, captures: { tot: $.meta.total_count } }
          assert:
            - "cnt == 0 after two grants and two compensating withdraws (round-trip nets to zero)"
            - "tot == 0 — stored counter equals the independent filtered recount of GRANTED records (no drift)"
            - "ConsentRecord.${r1}.status == WITHDRAWN and ConsentRecord.${r2}.status == WITHDRAWN"

      - name: propagation_partition_counter_conservation
        grounds:
          - calculations.propagation_counters
          - entities.DoNotSellRequest.fields.pending_count
          - state_machines.VendorPropagation.FAILED_to_PENDING
        distinguishing_aspect: |
          Different conserved quantity: the partition cardinality of propagation
          outcomes — pending+confirmed+failed == total_propagations == child count
          — conserved across confirm, fail, and the FAILED->PENDING retry, ending
          in ALL_CONFIRMED with failed == 0.
        test_recipe:
          setup:
            - "Property P (SELLS_AND_SHARES); three APPROVED vendors W1, W2, W3 each declared [SALE_SHARE]"
            - "Visitor U with VERIFIED request (default scope [SALE_SHARE])"
          setup_api_calls:
            - { call: "POST /v1/properties", payload: { name: "Partition Site", sale_share_designation: "SELLS_AND_SHARES" }, as: PrivacyAdmin, captures: { prop: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "W1", declared_purposes: ["SALE_SHARE"], tracker_signatures: ["w1.com"] }, as: VendorManager, captures: { w1: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "W2", declared_purposes: ["SALE_SHARE"], tracker_signatures: ["w2.com"] }, as: VendorManager, captures: { w2: $.data.id } }
            - { call: "POST /v1/vendors", payload: { property_id: "${prop}", legal_name: "W3", declared_purposes: ["SALE_SHARE"], tracker_signatures: ["w3.com"] }, as: VendorManager, captures: { w3: $.data.id } }
            - { call: "POST /v1/vendors/${w1}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/vendors/${w2}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/vendors/${w3}/approve", as: PrivacyAdmin }
            - { call: "POST /v1/visitors", payload: { property_id: "${prop}", external_ref: "pp@x.com", jurisdiction_code: "US-CA" }, as: Anonymous, captures: { vis: $.data.id } }
            - { call: "POST /v1/visitors/${vis}/do-not-sell-requests", payload: {}, as: Visitor, as_user_id: "${vis}", captures: { req: $.data.id } }
            - { call: "PUT /v1/do-not-sell-requests/${req}", payload: { verification_status: "VERIFIED" }, as: PrivacyAdmin }
            - { call: "POST /v1/do-not-sell-requests/${req}/propagate", as: PrivacyAdmin }
            - { call: "GET /v1/do-not-sell-requests/${req}/propagations", as: Any, captures: { g1: "$.data[0].id", g2: "$.data[1].id", g3: "$.data[2].id" } }
          trigger:
            - { call: "PUT /v1/vendor-propagations/${g1}", payload: { status: "CONFIRMED" }, as: VendorManager }
            - { call: "PUT /v1/vendor-propagations/${g2}", payload: { status: "FAILED" }, as: VendorManager }
            - { call: "PUT /v1/vendor-propagations/${g2}", payload: { status: "PENDING" }, as: VendorManager }
            - { call: "PUT /v1/vendor-propagations/${g2}", payload: { status: "CONFIRMED" }, as: VendorManager }
            - { call: "PUT /v1/vendor-propagations/${g3}", payload: { status: "CONFIRMED" }, as: VendorManager }
            - { call: "GET /v1/do-not-sell-requests/${req}", as: Any, captures: { t: $.data.total_propagations, p: $.data.pending_count, c: $.data.confirmed_count, f: $.data.failed_count, pst: $.data.propagation_status } }
          assert:
            - "t == 3 and p == 0 and c == 3 and f == 0"
            - "p + c + f == t at every step (confirm: 2+1+0; fail: 1+1+1; retry: 2+1+0 with attempts 2 on g2)"
            - "pst == ALL_CONFIRMED"
            - "VendorPropagation.${g2}.attempts == 2"
