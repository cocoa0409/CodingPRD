          setup: "Approve-blocked HIGH-tier use case with an enormous reach: CONSEQUENTIAL impact, FULLY_AUTOMATED autonomy, INTERNAL sensitivity, reach 300000, no listed jurisdictions -> 40 + 30 + 6 + 6 + 0 = 82, tier HIGH. Bind it to a third-party asset whose accepted assessment grades C (DOCUMENTED_MIXED provenance, VENDOR_RETAINS output rights, 120-day retention with opt-out, subprocessors disclosed -> 8 + 16 + 10 + 0 + 0 = 34 points, grade C, penalty 12). Run five evaluations: BIAS passes, a LATER BIAS run fails (leaving safety_flag true), then ROBUSTNESS, HALLUCINATION and SECURITY_REDTEAM pass. Clear all four gates so the use case reaches READY_FOR_APPROVAL. final_risk_score is then 82 + 12 - 15 = 79, still HIGH, and 300000 alone exceeds PORTFOLIO_HIGH_TIER_REACH_CAP 250000."
