        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_GRANT_WINDOW_CLOSED]
          - entities.GrantAward.fields.obligation_window_start
          - entities.GrantAward.fields.obligation_window_end
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          The rule declares both bounds inclusive, so this instance certifies once with the clock parked exactly on
          obligation_window_start and once exactly on obligation_window_end — both must pass and both must move the
          ledger — and then certifies a third identical line one day past the end, which must fail. That triple pins the
