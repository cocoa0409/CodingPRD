              as: Scheduler
              captures: { e_past: $.data.error_id }
            - call: "POST /appointments"
              payload: { center_id: "${ctr}", patient_id: "${pt1}", treatment_plan_id: "${pl1}", template_id: "${tp1}", service_date: "2026-08-11", requested_start_minute: 540, cycle_number: 1, booking_class: "ROUTINE" }
