        distinguishing_aspect: "Capacity boundary: seat_capacity 1 with one APPROVED rider (assigned_rider_count==seat_capacity) rejects a second eligible approval with ERR_ROUTE_FULL (409); the first approval at count 0 < 1 succeeds."
