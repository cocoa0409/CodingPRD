              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /store-ops/drivers/${drv_id}/qualification-decisions"
              payload: { decision: "QUALIFY" }
              as: ComplianceOfficer
              as_user_id: "co-2"
            - call: "POST /store-ops/orders"
              payload: { store_id: "${store_id}", service_address_id: "${addr_a_id}", customer_name: "Ann", customer_phone: "555-0101", food_subtotal_cents: 2200, payment_method: "CASH", tip_cents: 500 }
