          rationale: "The §1.8 non_linear_state_machine instance already drives the approval axis and the execution axis of one ImplementationStrategy independently and asserts the combined (approval_state, execution_state) pair after each move, which is exactly the posture_driven/parallel shape claim."

      - name: cyclic_shape_allows_loop_back_and_re_advance
        claim_type: cyclic
        excluded_because:
          difficulty_instance: cycle_board_defer_returns_to_strategy_development_and_readvances
          rationale: "The §1.8 instance already covers the only loop in the cycle machine (BOARD_REVIEW -> STRATEGY_DEVELOPMENT -> BOARD_REVIEW), including board_deferral_count as the loop counter and the strategy RETURNED -> SUBMITTED re-entry."

      - name: branching_fork_and_join_paths
        claim_type: branching
        excluded_because:
          difficulty_instance: partnership_fork_join_requires_both_signatures_before_executed
          rationale: "The §1.8 instance already exercises both fork arms (HOSPITAL-first and PARTNER-first) and proves the EXECUTED join is reached only when both signatures are present."

      - name: guarded_transition_requires_other_entity_state
        claim_type: guarded transitions
        excluded_because:
          difficulty_instance: candidate_score_blocked_when_indicator_data_insufficient
          rationale: "The §1.8 cross_entity_state_dependency instance already asserts a transition on entity A (candidate score) gated on entity B's state (HealthIndicator.data_state), which is the guarded-transition claim for this scaffold."

      - name: cascade_down_from_parent_adoption
