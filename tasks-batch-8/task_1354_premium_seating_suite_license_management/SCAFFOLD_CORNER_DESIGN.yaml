      - name: event_cancel_fans_out_full_compensation_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.Event.SCHEDULED_to_CANCELLED]
        distinguishing_aspect: "One event cancellation compensates three child domains in a single mutation: CONFIRMED catering order -> CANCELLED with fee 0 and accrual removed, ISSUED credential -> EXPIRED, CONFIRMED rental -> CANCELLED with fee 0 and its RENTAL invoice VOID (account balance returns to 0)."
