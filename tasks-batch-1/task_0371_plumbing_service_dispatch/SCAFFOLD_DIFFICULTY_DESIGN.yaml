  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: approve_state_beats_credit_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=14]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Category pair STATE (priority 5) vs BUSINESS_FISCAL (priority 14): approving an estimate that is
          already DECLINED on a customer who ALSO lacks credit must return ERR_INVALID_STATE (state wins),
          not ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "An estimate was presented then DECLINED by the customer; the customer's credit_limit (1000) is below the estimate total (40000), so both the state check and the fiscal check would fail."
          setup_api_calls:
            - call: "POST /plumbing/_clock/set"
              payload: { to_iso8601: "2026-05-20T10:00:00.000Z" }
              as: OfficeManager
            - call: "POST /plumbing/flat-rate-items"
              payload: { code: "PC-1", category: "LEAK", base_price_cents: 40000, skill_required: 1 }
              as: OfficeManager
              captures: { fr_id: $.data.id }
            - call: "POST /plumbing/customers"
              payload: { name: "Cust PC1", service_address: "8 Walnut St", credit_limit_cents: 1000 }
              as: OfficeManager
              captures: { cust_id: $.data.id }
            - call: "POST /plumbing/technicians"
              payload: { name: "Tech PC1", skill_level: 2 }
              as: OfficeManager
              captures: { tech_id: $.data.id }
            - call: "POST /plumbing/service-jobs"
              payload: { customer_id: "${cust_id}", category: "LEAK", priority: "STANDARD" }
              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /plumbing/dispatch-assignments"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-05-20T11:00:00.000Z", window_end: "2026-05-20T13:00:00.000Z", eta: "2026-05-20T11:15:00.000Z", expected_job_version: "${job_v0}" }
              as: Dispatcher
              captures: { asg_id: $.data.id }
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/confirm"
              payload: {}
              as: Dispatcher
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/dispatch-assignments/${asg_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "GET /plumbing/service-jobs/${job_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { job_v_onsite: $.data.version }
            - call: "POST /plumbing/service-jobs/${job_id}/estimates"
              payload: { expected_job_version: "${job_v_onsite}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { est_id: $.data.id }
            - call: "POST /plumbing/estimates/${est_id}/lines"
              payload: { line_type: "FLAT_RATE", flat_rate_item_id: "${fr_id}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/present"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /plumbing/estimates/${est_id}/decline"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
