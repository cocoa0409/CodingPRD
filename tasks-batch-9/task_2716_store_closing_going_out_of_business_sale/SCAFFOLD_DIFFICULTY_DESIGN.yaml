  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: settlement_fee_tier_evaluation_order_original_ratio_then_total_gross
        grounds:
          - calculations.engagement_settlement_split
          - entities.Settlement.fields.recovery_ratio
          - entities.Settlement.fields.fee_rate
          - entities.Settlement.fields.liquidator_fee_cents
          - entities.Engagement.fields.original_cost_value_cents
        distinguishing_aspect: |
          Mode (c) — the pinned evaluation order. The fee TIER is keyed on ORIGINAL-merchandise
          net sales over ORIGINAL cost value (3,900,000 / 5,000,000 = 0.7800 -> 0.0350) while the
          fee AMOUNT is charged on TOTAL gross recovery including augmentation (4,200,000), so the
          correct fee is 147,000; keying the tier on total gross instead gives ratio 0.8400,
          tier 0.0500, fee 210,000 and retailer_proceeds 3,990,000.
        test_recipe:
          setup:
            - "One FEE_BASED engagement, expense_responsibility SHARED at 0.40, with no expense items at all"
            - "One SELLING store with 5,000,000 cents of ORIGINAL cost value and a RECEIVED 200-unit augmentation consignment (400,000 cents cost, ratio 0.0800)"
            - "Two POSTED sales days totalling 3,900,000 ORIGINAL and 300,000 AUGMENTATION net sales"
            - "No PENDING_REVIEW sales days, so the PROVISIONAL basis sees exactly the posted ledger"
          setup_api_calls:
