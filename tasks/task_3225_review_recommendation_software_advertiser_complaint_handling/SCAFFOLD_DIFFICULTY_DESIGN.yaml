              payload: { rating: 4, text: "Cozy rooms and a generous breakfast spread." }
              as: Reviewer
              as_user_id: "${ia_id}"
              captures: { ri_id: $.data.id }
            - call: "POST /platform/users/${ia_id}/trust-adjustments"
              payload: { trust_score: 50 }
              as: PlatformOps
            - call: "POST /platform/reviews/${ri_id}/evaluate"
              payload: {}
              as: PlatformOps
            - call: "POST /platform/business-pages/${pi_id}/complaints"
              payload: { review_id: "${ri_id}", kind: "FILTERED_DISPUTE", body: "This filtered review should be shown." }
              as: BusinessOwner
              as_user_id: "${io_id}"
              captures: { ci_id: $.data.id }
            - call: "POST /platform/complaints/${ci_id}/start-review"
              payload: {}
              as: ContentModerator
          trigger:
            - call: "POST /platform/complaints/${ci_id}/resolve"
              payload: { action: "RESTORE_REVIEW" }
              as: ContentModerator
            - call: "GET /platform/business-pages/${pi_id}"
              payload: {}
              as: SupportAdmin
              captures: { pi_count_mid: $.data.displayed_review_count, pi_avg_mid: $.data.displayed_rating_avg_x100 }
            - call: "POST /platform/business-pages/${pi_id}/complaints"
              payload: { review_id: "${ri_id}", kind: "NEGATIVE_DISPUTE", body: "On reflection this review should go away." }
              as: BusinessOwner
              as_user_id: "${io_id}"
              captures: { ci2_id: $.data.id }
