      - name: layer_cascading_side_effects_one_demold_call_fans_out_to_six_observable_facts
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - "endpoints.POST_/molding-cycles/{molding_cycle_id}/demold"
          - state_machines.MoldingCycle
          - state_machines.FinishedUnit
          - entities.Mold.fields.cycles_since_service
        distinguishing_aspect: |
          A single demould call must land six consequences at once — two minted
          FinishedUnit rows in DEMOLDED/UNALLOCATED, the cycle in DEMOLDED, the
          mould back to AVAILABLE with cycles_since_service raised by exactly 1,
          the order in IN_PRODUCTION with completed_qty still 0, and a resin
          ledger that does NOT move because the charge was already consumed at
          oven start — so this is the fan-out breadth of one write, not the
          transitive unblocking chain.
        test_recipe:
          setup:
            - "Base plant with cycle CYC-1 (mould MLD-CD-1, cavity_count 2) in COOLING after a 09:00-10:00 oven run, its 24.000 kg charge already CONSUMED at oven start."
            - "LOT-CD-1 stands at available 476.000 kg, reserved 0.000 kg, consumed 24.000 kg of its 500.000 kg receipt; MLD-CD-1 is IN_CYCLE with cycles_since_service 0."
            - "Logical clock at 2026-08-01T10:35:00Z, which is 35 minutes of cooling against the model's 30-minute floor."
