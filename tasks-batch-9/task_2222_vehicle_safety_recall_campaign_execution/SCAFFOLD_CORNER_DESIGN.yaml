          - calculations.parts_allocation_grant
        excluded_because:
          difficulty_instance: parts_units_conserved_across_supersede_and_reversal_of_consumed_allocation
          rationale: "That §1.8 instance asserts the second allocation lands ALLOCATED with allocated_qty 1 and partially_granted true while the RemedyPart drops to unallocated_qty 99 with consumed_qty 0 -- the entity-B adjustment this row would claim."

      - name: owner_reimbursement_denial_leaves_obligation_ledger_at_zero
        claim_type: ledger_sync
        grounds:
          - state_machines.OwnerReimbursementRequest.SUBMITTED_to_DENIED
          - entities.RecallCampaign.fields.reimbursement_obligation_cents
          - entities.OwnerReimbursementRequest.fields.approved_amount_cents
        distinguishing_aspect: |
          The obligation ledger only moves on the APPROVE branch: a denied pre-recall repair claim
          must leave reimbursement_obligation_cents at 0 and pin approved_amount_cents to 0 with the
          denial_reason recorded -- proving the ledger is driven by the decision, not by intake.
        test_recipe:
          setup:
            - "BASE-FILED for 26V-210 with one matched NE build record; historic LaborOperation R210-00 flat_hours 1.30 effective 2025-01-01..2026-07-31; R210-01 flat 1.10 effective 2026-08-01..2027-12-31; part P-88210 unit_cost 21.90 (100 units); remedy released 2026-08-03."
            - "An owner reimbursement request for a 2026-07-15 invoice of 412.75 with 1.30 claimed hours is SUBMITTED."
          setup_api_calls:
