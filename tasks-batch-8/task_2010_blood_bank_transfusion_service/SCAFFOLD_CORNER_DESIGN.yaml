              captures: { sup_id: $.data.id }
            - call: "POST /blood-bank/par-level-policies"
              payload: { product_type: "RBC", abo_type: "O", rh_type: "NEG", watch_threshold: 6, shortage_threshold: 4, critical_threshold: 2, min_shelf_life_hours: 4 }
              as: BloodBankSupervisor
              captures: { pol: $.data.id }
            - call: "POST /blood-bank/supplier-orders"
              payload: { supplier_id: "${sup_id}", is_emergency: false, lines: [{ product_type: "RBC", abo_type: "O", rh_type: "NEG", quantity: 6 }], expected_delivery_at: "2026-08-12T09:00:00Z" }
              as: SupplierCoordinator
