              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "VENDOR", vendor_id: "${ven_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { part_id: "${part_id}", quantity: 3 }
              as: Vendor
              as_user_id: "${ven_id}"
              captures: { wop_id: $.data.id }
          trigger:
            - call: "POST /vendors/${ven_id}/events"
              payload: { event_type: "SUSPEND", reason: "lapsed paperwork" }
              as: PropertyManager
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: Dispatcher
              captures: { wo_status: $.data.status, wo_vendor: $.data.assigned_vendor_id }
            - call: "GET /work-order-parts"
              payload: { work_order_id: "${wo_id}" }
              as: PropertyManager
              captures: {wop_status: "$.data[0].status"}
            - call: "GET /parts/${part_id}"
              payload: {}
              as: PropertyManager
              captures: { p_onhand: $.data.quantity_on_hand, p_resv: $.data.reserved_quantity, p_restock: $.data.restock_status }
          assert:
            - "Vendor.${ven_id}.status == SUSPENDED"
            - "WorkOrder.${wo_id}: status == TRIAGED, assigned_vendor_id == null, assignment_type == null (link 1)"
            - "WorkOrderPart.${wop_id}.status == RELEASED (link 2)"
            - "Part.${part_id}: quantity_on_hand == 5, reserved_quantity == 0, restock_status == IN_STOCK (link 3; was LOW_STOCK at 2 <= 2 before the cascade)"

      - name: completion_consumption_cascade_depth3
        grounds:
          - state_machines.WorkOrder.IN_PROGRESS_to_COMPLETED
          - state_machines.WorkOrderPart.RESERVED_to_CONSUMED
          - calculations.part_stock_ledger
          - entities.WorkOrder.fields.parts_total_cents
        distinguishing_aspect: |
          Trigger POST /work-orders/{id}/complete, depth 3: completion converts
          RESERVED lines to CONSUMED (link 1); each consumption debits
          Part.reserved_quantity (link 2); the consumptions recompute
          WorkOrder.parts_total_cents to the sum of consumed line totals (link 3).
        test_recipe:
          setup:
            - "Work order IN_PROGRESS (in-house), resident sign-off recorded"
            - "Part A (unit_cost 100, initial_stock 6, reorder_level 2): 3 units RESERVED (on_hand 3, reserved 3); part B (unit_cost 50, initial_stock 4): 1 unit RESERVED (on_hand 3, reserved 1)"
