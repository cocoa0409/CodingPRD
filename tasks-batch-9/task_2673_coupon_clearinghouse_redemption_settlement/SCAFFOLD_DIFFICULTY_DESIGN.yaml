            - "the 2026-08-15 and 2026-08-16 clock calls each return expired_offer_count == 0"
            - "boundary-1: the lot created at 2026-08-14 returns 201 and SubmissionLot.${lot_day14_id}.status == SORTED"
            - "boundary: the lot created at 2026-08-15 returns 201 and SubmissionLot.${lot_day15_id}.status == SORTED — exactly expiration_date + 5 days is inside the window"
            - "boundary+1: the lot attempted at 2026-08-16 returns 422 ERR_SUBMISSION_PAST_GRACE"
            - "Submission.${sub_id}.sorted_lot_count == 2 and intake_status == COUNT_VERIFIED (4 of 6 counted, so the submission never advanced to SORTED)"
            - "Submission.${sub_id}.declared_face_value_cents == 200 (4 counted coupons at face 50)"

      - name: fraud_rate_rounds_before_weighting_at_watchlist_threshold
        grounds:
          - calculations.retailer_fraud_score
          - state_machines.Retailer.ACTIVE_to_WATCHLIST
          - entities.Retailer.fields.handling_fee_tier
          - calculations.duplicate_barcode_detection
        distinguishing_aspect: |
          Two precision claims in one fixture. Retailer 1's pool of 2 adjudicated
          items with 1 REJECTED_DUPLICATE gives duplicate_rate exactly 50.00 and
          therefore score exactly 70.00 == FRAUD_WATCHLIST_THRESHOLD, and the
          comparison is `>=`, so the retailer MUST land in WATCHLIST with
          handling_fee_tier forced to PROBATION; a `>` comparison leaves it
          ACTIVE. Retailer 2's pool of 3 items with 1 duplicate gives
          duplicate_rate 33.33 (rounded to 2 decimals BEFORE weighting) and
          therefore 33.33 * 1.40 = 46.662 -> 46.66. Weighting the unrounded
          33.3333... first yields 46.67. One cent of difference distinguishes the
          two rounding orders, and the spec pins rate-then-weight.
        test_recipe:
          setup:
            - "clock at its 2026-08-01T00:00:00Z default throughout, so every item is inside the 90-day rolling window and sits in decay bucket 0"
            - "retailer 1: submission verified 2, one lot counted_qty 2, items (SN-A1 with purchase record POS-J1) then (SN-A1 again, same barcode) — the second is REJECTED_DUPLICATE of the first"
            - "retailer 2: submission verified 3, one lot counted_qty 3, items (SN-B1 / POS-K1), (SN-B2 / POS-K2), (SN-B2 again) — the third is REJECTED_DUPLICATE of the second"
