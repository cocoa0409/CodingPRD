            - "first reversal activation: error_id == ERR_READINESS_GATES_NOT_MET (machine was cascade-unassigned by the suspension)"
            - "after re-assigning the machine: reversal status == ACTIVE and patient program_status == ACTIVE_HOME"
            - "original TransitionRecord.${trans}.status == REVERSED (self-referential link resolved)"

  # ------------------------------------------------------------------ RULE 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: chair_half_open_overlap_adjacency_allowed
        grounds:
          - entities.BackupSlotReservation.fields.slot_start
          - entities.BackupSlotReservation.fields.slot_end
          - validations[priority=8]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [slot_start, slot_end) on InCenterChair — a reservation whose
          start equals another's end (12:00 vs 12:00) is adjacent and ALLOWED, while a strictly
          intersecting one (11:00-13:00 vs 10:00-12:00) is rejected with ERR_CHAIR_SLOT_OVERLAP.
        test_recipe:
          setup:
            - "ACTIVE_HOME patient with ACTIVE plan; chair CH-1 in service; clock 2026-05-01"
