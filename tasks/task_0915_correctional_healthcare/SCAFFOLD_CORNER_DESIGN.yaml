      - name: records_unfreeze_cannot_reopen_a_decedent_record
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Inmate.FROZEN_to_OPEN
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "The death-induced freeze is permanent: records-unfreeze on a DECEASED inmate fails the custody_status != DECEASED precondition with 409 ERR_INVALID_STATE and records_state stays FROZEN."
        test_recipe:
