          difficulty_instance: "transitive_cascade / remake_on_a_settled_order_cascades_four_hops_into_refund_due"
          rationale: >-
            The §1.8 instance already walks the whole four-hop chain from the remake case through the
            job scrap, the order reopening, the writeoff and the PATIENT_SETTLED -> REFUND_DUE flip,
            asserting the ledger rows and the negative balance at each hop; a corner probe of the same
            cascade would only re-derive a subset of those assertions.

