  # =====================================================================
  # RULE 7 — cross_entity_state_dependency
  # =====================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: commission_blocked_until_a_cleared_review_covers_the_commissioned_ride_system
        grounds:
          - state_machines.RideSystem.ENGINEERED_to_COMMISSIONED
          - validations[priority 15].ERR_SAFETY_REVIEW_NOT_CLEARED
          - endpoints[POST /ride-systems/{id}/commission]
        distinguishing_aspect: |
          Entity pair = RideSystem depends on SafetyReview (reached through DesignPackage.ride_system_id). The project
          already owns a CLEARED SafetyReview — that is exactly what let it enter INSTALLATION — yet commission of the
          selected ride system is still refused, because the cleared review covers a package whose ride_system_id names
          the OTHER ride system. Clearing a review on a package that does name the selected system flips the same call
          to success, so the dependency is on the review's package-to-ride-system linkage, not on review existence.
        test_recipe:
          setup:
            - "Project driven to INSTALLATION with rs_main SELECTED then ENGINEERED and rs_alt left CANDIDATE."
            - "DesignPackage pkg_alt cites ride_system_id rs_alt, base_construction_cost_cents 400000000 => total_cost_of_work_cents 515200000, and is APPROVED."
            - "SafetyReview rev_alt on pkg_alt is CLEARED, which satisfies the PRODUCTION -> INSTALLATION precondition."
          setup_api_calls:
            - call: "POST /attraction-projects"
              payload: { project_code: "TAD-CE1", name: "Skyward Saga", design_day_attendance: 8000, peak_hour_share: 0.10, budget_ceiling_cents: 3600000000 }
              as: OwnerRep
              as_user_id: "u-owner-1"
              captures: { proj: $.data.id, pv0: $.data.version }
            - call: "POST /show-scenes"
              payload: { project_id: "${proj}", scene_label: "Prologue", sequence_index: 1, duration_seconds: 180 }
