  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: budget_reforecast_cycle_replaces_approved_base
        grounds:
          - state_machines.Budget
          - concurrency_rules[budget-reforecast-stale-base]
        distinguishing_aspect: |
          Budget has a non-linear create-with-supersede cycle: ANNUAL DRAFT ->
          SUBMITTED -> APPROVED, then a REFORECAST DRAFT -> SUBMITTED ->
          APPROVED flips the first APPROVED budget to SUPERSEDED, and a second
          reforecast may legitimately supersede again — a cycle over the
          (property, fiscal_year) budget set rather than a one-way pipeline.
        test_recipe:
          setup:
            - "Owner O5; Agreement AG5 ACTIVE; Property P5 MANAGED (zero-balance onboarding, one resident)"
            - "ANNUAL Budget B5 approved for fiscal 2026"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Cycle Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { o5_id: $.data.id }
            - call: "POST /mgmt/owners/${o5_id}/properties"
              payload: { name: "Cycle Property", unit_count: 80 }
              as: PortfolioManager
              captures: { p5_id: $.data.id }
            - call: "POST /mgmt/owners/${o5_id}/agreements"
              payload: { property_id: "${p5_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { ag5_id: $.data.id, ag5_v: $.data.version }
            - call: "POST /mgmt/agreements/${ag5_id}/activate"
              payload: { expected_agreement_version: "${ag5_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${p5_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-08-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { ob5_id: $.data.id }
            - call: "POST /mgmt/properties/${p5_id}/residents"
              payload: { unit_label: "5A", full_name: "Res Five", lease_end_date: "2027-07-31T00:00:00Z" }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob5_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob5_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob5_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob5_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob5_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/budgets"
              payload: { property_id: "${p5_id}", fiscal_year: 2026, kind: ANNUAL, operating_revenue_cents: 9000000, operating_expense_cents: 5000000, capex_total_cents: 500000 }
              as: PropertyAccountant
              captures: { b5_base: $.data.id }
            - call: "POST /mgmt/budgets/${b5_base}/submit"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/budgets/${b5_base}/approve"
              payload: {}
              as: OwnerRep
              as_user_id: "${o5_id}"
              captures: { b5_base_v: $.data.version }
          trigger:
            - call: "POST /mgmt/budgets"
              payload: { property_id: "${p5_id}", fiscal_year: 2026, kind: REFORECAST, operating_revenue_cents: 9500000, operating_expense_cents: 5200000, capex_total_cents: 700000, supersedes_budget_id: "${b5_base}", expected_base_budget_version: "${b5_base_v}" }
              as: PropertyAccountant
              captures: { b5_rf: $.data.id }
            - call: "POST /mgmt/budgets/${b5_rf}/submit"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/budgets/${b5_rf}/approve"
              payload: {}
              as: OwnerRep
              as_user_id: "${o5_id}"
            - call: "GET /mgmt/budgets/${b5_base}"
              payload: {}
              as: PropertyAccountant
              captures: { b5_base_status: $.data.status }
          assert:
            - "Budget.${b5_rf}.status == APPROVED"
            - "Budget.${b5_base}.status == SUPERSEDED (flip executed in the same approve request)"

